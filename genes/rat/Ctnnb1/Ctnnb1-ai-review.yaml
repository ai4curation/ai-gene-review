- term:
    id: GO:0000209
    label: protein polyubiquitination
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P35222
  review:
    summary: RGD orthology transfer from human CTNNB1. Beta-catenin is the substrate of polyubiquitination,
      not the enzyme that performs it.
    action: REMOVE
    reason: SCF(BTRC) and other E3 ligases polyubiquitinate phosphorylated beta-catenin. Per GO convention
      the process term belongs to the ligases that do the work; the substrate does none of the chemistry.
      The human donor annotation was itself rejected on the same grounds in the human CTNNB1 review.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P35222
        source_status: SOURCE_BAD
        comment: The donor annotation assigns a substrate the process performed on it.
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0000209
      confidence: PROBABLE
      explanation: 'ISO from human CTNNB1: beta-catenin is the substrate of polyubiquitination
        by SCF(BTRC) and other E3 ligases, not a participant that performs it. The human donor annotation
        was rejected on the same grounds in the human CTNNB1 review.'
    supported_by:
    - reference_id: UniProtKB:Q9WU82
      supporting_text: Ubiquitinated by the SCF(BTRC) E3 ligase complex when phosphorylated by GSK3B,
        leading to its degradation
    - reference_id: UniProtKB:Q9WU82
      supporting_text: In the absence of Wnt, forms a complex with AXIN1, AXIN2, APC, CSNK1A1 and GSK3B
        that promotes phosphorylation on N-terminal Ser and Thr residues and ubiquitination of CTNNB1
        via BTRC and its subsequent degradation by the proteasome
- term:
    id: GO:0000578
    label: embryonic axis specification
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:88276
  review:
    summary: RGD orthology transfer from mouse Ctnnb1. Developmental or physiological outcome downstream
      of Wnt/beta-catenin transcription.
    action: KEEP_AS_NON_CORE
    reason: Beta-catenin is the TCF/LEF coactivator of canonical Wnt signalling and a cadherin-adhesion
      scaffold; experimental perturbation of the mouse or human ortholog affects this process, and the
      rat row inherits that annotation by orthology or sequence similarity. The term records a tissue-
      or stage-specific consequence of Wnt/TCF target-gene activation (and in some contexts of adhesion),
      not a distinct molecular activity, so it is kept as non-core.
    supported_by:
    - reference_id: UniProtKB:Q9WU82
      supporting_text: Key downstream component of the canonical Wnt signaling pathway
    - reference_id: UniProtKB:Q9WU82
      supporting_text: In the presence of Wnt ligand, CTNNB1 is not ubiquitinated and accumulates in the
        nucleus, where it acts as a coactivator for transcription factors of the TCF/LEF family, leading
        to activate Wnt responsive genes
