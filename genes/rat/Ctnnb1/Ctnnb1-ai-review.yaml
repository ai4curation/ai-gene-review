- term:
    id: GO:0016922
    label: nuclear receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:88276
  - PANTHER:PTN001153077
  - UniProtKB:P35222
  - WB:WBGene00006943
  review:
    summary: PAINT phylogenetic inference (PTN001153077). Beta-catenin coactivates nuclear receptors (e.g.
      NR5A2, androgen receptor) in addition to TCF/LEF.
    action: KEEP_AS_NON_CORE
    reason: Supported by the UniProt-curated coactivator role for NR5A2 and by ortholog data; a real but
      secondary coactivator partner class, non-core relative to TCF/LEF coactivation. The IBA node is
      consistent with conserved nuclear receptor coactivation in vertebrate beta-catenins.
    supported_by:
    - reference_id: UniProtKB:Q9WU82
      supporting_text: Also acts as a coactivator for other transcription factors, such as NR5A2
