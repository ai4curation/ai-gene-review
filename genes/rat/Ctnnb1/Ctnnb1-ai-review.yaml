id: Q9WU82
gene_symbol: Ctnnb1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Ctnnb1 encodes beta-catenin, an armadillo-repeat protein with two conserved roles. At the
  plasma membrane its twelve ARM repeats bind the cytoplasmic tails of classical cadherins (N-, E-cadherin
  and the atypical cadherin Fat1) and its N-terminal region binds alpha-catenin, forming the cadherin-catenin
  complex of adherens junctions that underlies cadherin-mediated cell-cell adhesion in epithelia, Sertoli-germ
  cell junctions, cardiomyocyte intercalated discs and synapses. A cytosolic pool is held low by the Axin/APC/GSK3B/CK1
  destruction complex, which phosphorylates its N-terminus for SCF(BTRC)-mediated ubiquitination and proteasomal
  degradation. When this is blocked (Wnt ligands, or in rat cells also IGF-I/AKT, mechanical strain, Smad3/Smad4
  or estradiol inputs), beta-catenin accumulates, enters the nucleus and acts as the transcriptional coactivator
  of TCF/LEF factors, activating Wnt target genes. Through this coactivator role it influences proliferation,
  differentiation and morphogenesis in many tissues, and activating mutations at its phosphorylation sites
  drive chemically induced rat colon tumours.
