core_functions:
- description: Armadillo-repeat binding of classical cadherin cytoplasmic tails places beta-catenin in
    the cadherin-catenin complex at adherens junctions, where it is required for cadherin-mediated cell-cell
    adhesion and junction assembly (epithelia, Sertoli-germ cell junctions, cardiomyocyte intercalated
    discs, synapses).
  molecular_function:
    id: GO:0045296
    label: cadherin binding
  directly_involved_in:
  - id: GO:0044331
    label: cell-cell adhesion mediated by cadherin
  - id: GO:0034333
    label: adherens junction assembly
  locations:
  - id: GO:0005912
    label: adherens junction
  in_complex:
    id: GO:0016342
    label: catenin complex
  supported_by:
  - reference_id: PMID:11348595
    supporting_text: As a component of adherens junctions and the Wnt signaling pathway, beta-catenin
      binds cadherins, Tcf family transcription factors, and the tumor suppressor APC
  - reference_id: PMID:12533412
    supporting_text: An anti-N-cadherin antibody can pull out beta-catenin, whereas N-cadherin can also
      be pulled out using an anti-beta-catenin antibody
- description: The beta-catenin N-terminal region binds alpha-catenin, recruiting it to the cadherin-bound
    complex; alpha-catenin supplies the regulated link to actin.
  molecular_function:
    id: GO:0045294
    label: alpha-catenin binding
  directly_involved_in:
  - id: GO:0044331
    label: cell-cell adhesion mediated by cadherin
  locations:
  - id: GO:0005912
    label: adherens junction
  in_complex:
    id: GO:0016342
    label: catenin complex
  supported_by:
  - reference_id: PMID:7890674
    supporting_text: although the amino-terminal half independently binds alpha-catenin
  - reference_id: PMID:8834786
    supporting_text: Both complexes are composed of N-cadherin and alpha-catenin which bind to either
      beta-catenin or plakoglobin in a mutually exclusive manner
- description: When stabilised (Wnt, or IGF-I/AKT, strain, Smad3/4 and estradiol inputs in rat cells),
    beta-catenin enters the nucleus, binds TCF/LEF factors and acts as their transcriptional coactivator,
    the effector step of canonical Wnt signalling.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0060070
    label: canonical Wnt signaling pathway
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:1990907
    label: beta-catenin-TCF complex
  supported_by:
  - reference_id: PMID:9065401
    supporting_text: hTcf-4 transactivates transcription only when associated with beta-catenin
  - reference_id: PMID:11751639
    supporting_text: a dedicated coactivator of LEF/TCF
  - reference_id: PMID:17170212
    supporting_text: Beta-catenin binding to TCF/LEF increased (P<0.05) in progesterone-pretreated uteri
      in response to estradiol
suggested_questions:
- question: In rat osteoblast-like cells strain and IGF-I activate beta-catenin independently of Wnt/LRP5;
    which TCF/LEF target genes does this AKT-driven pool activate, and do they differ from Wnt-driven
    targets?
- question: Does the Smad3/Smad4-beta-catenin complex in rat chondrogenic cells occupy TCF sites, SMAD
    sites, or both on shared target genes?
- question: Is the beta-catenin pool that binds NR2B at rat glutamatergic synapses the cadherin-bound
    pool or a distinct one, and how does GSK3B phosphorylation select between them?
suggested_experiments:
- description: ChIP-seq or CUT&RUN for beta-catenin and TCF7L2 in UMR-106 cells after mechanical strain
    versus Wnt3a, to compare the AKT-driven and Wnt-driven nuclear programmes.
- description: Beta-catenin knockdown or degron depletion in rat Schwann cell-DRG cocultures with rescue
    by ARM-repeat mutants that separately abolish cadherin or TCF binding, to separate adhesion and transcription
    contributions to axon-induced proliferation.
