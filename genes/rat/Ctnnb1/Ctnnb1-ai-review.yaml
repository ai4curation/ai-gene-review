- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - MGI:MGI:88276
  review:
    summary: RGD orthology transfer from mouse Ctnnb1. Beta-catenin has no nucleic-acid-binding domain;
      its chromatin association is via TCF/LEF.
    action: MARK_AS_OVER_ANNOTATED
    reason: Beta-catenin lacks a DNA- or RNA-binding domain; the transcription-factor partner (TCF/LEF)
      binds DNA. Nucleic acid binding therefore overstates the donor evidence, which concerns chromatin
      occupancy; that occupancy is captured by chromatin binding.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:88276
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The donor evidence records an indirect readout or over-reaching term; transfer adds nothing
          beyond it.
    supported_by:
    - reference_id: UniProtKB:Q9WU82
      supporting_text: The stabilized protein translocates to the nucleus, where it binds TCF/LEF-1 family
        members, BCL9, BCL9L and possibly also RUVBL1 and CHD8
    - reference_id: UniProtKB:Q9WU82
      supporting_text: Belongs to the beta-catenin family
