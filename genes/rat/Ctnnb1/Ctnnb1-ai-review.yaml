- term:
    id: GO:0019899
    label: enzyme binding
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - MGI:MGI:88276
  review:
    summary: RGD orthology transfer from mouse Ctnnb1. Enzyme binding is true but entailed by the more
      specific kinase, phosphatase, ligase, NOS and methyltransferase binding terms kept here.
    action: TOO_GENERAL
    reason: Uninformative parent of protein kinase binding, protein phosphatase binding, ubiquitin protein
      ligase binding, nitric-oxide synthase binding and histone methyltransferase binding, all asserted
      in this review.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: MGI:MGI:88276
        source_status: SUPPORTS_TRANSFER
        comment: The source annotation is sound for the ortholog; the issue is term granularity, not the
          transfer.
    supported_by:
    - reference_id: UniProtKB:Q9WU82
      supporting_text: In the absence of Wnt, forms a complex with AXIN1, AXIN2, APC, CSNK1A1 and GSK3B
        that promotes phosphorylation on N-terminal Ser and Thr residues and ubiquitination of CTNNB1
        via BTRC and its subsequent degradation by the proteasome
