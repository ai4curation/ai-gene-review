  review:
    summary: RGD orthology transfer from human CTNNB1. Beta-catenin is the degraded substrate of proteasomal
      catabolism, not a participant performing it.
    action: REMOVE
    reason: Phosphorylated, ubiquitinated beta-catenin is degraded by the proteasome; the substrate does
      not perform the catabolic steps. The regulated turnover is captured by destruction-complex membership
      (GO:0030877). The human donor annotation was rejected in the human CTNNB1 review.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P35222
        source_status: SOURCE_BAD
        comment: The donor annotation assigns a substrate the process performed on it.
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0043161
      confidence: PROBABLE
      explanation: 'ISO from human CTNNB1: beta-catenin is the degraded substrate of proteasome-mediated
        catabolism; the process term belongs to the ubiquitin-proteasome machinery. The human donor annotation
        was rejected in the human CTNNB1 review.'
    supported_by:
    - reference_id: UniProtKB:Q9WU82
