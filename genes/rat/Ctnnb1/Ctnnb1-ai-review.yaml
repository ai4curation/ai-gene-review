- term:
    id: GO:0030877
    label: beta-catenin destruction complex
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: part_of
  supporting_entities:
  - MGI:MGI:88276
  review:
    summary: RGD orthology transfer from mouse Ctnnb1. Beta-catenin is the substrate bound within the
      Axin/APC/GSK3B destruction complex.
    action: ACCEPT
    reason: Beta-catenin binds Axin directly within the destruction complex; rat Axin binds the ARM repeats
      and promotes GSK3B phosphorylation of beta-catenin (PMID:9482734). Membership as the bound substrate
      is a defining feature of its regulation.
    supported_by:
    - reference_id: UniProtKB:Q9WU82
      supporting_text: In the absence of Wnt, forms a complex with AXIN1, AXIN2, APC, CSNK1A1 and GSK3B
        that promotes phosphorylation on N-terminal Ser and Thr residues and ubiquitination of CTNNB1
        via BTRC and its subsequent degradation by the proteasome
    - reference_id: PMID:9482734
      supporting_text: rAxin also interacted directly with the armadillo repeats of beta-catenin
