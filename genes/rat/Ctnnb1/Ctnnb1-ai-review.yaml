- term:
    id: GO:0016331
    label: morphogenesis of embryonic epithelium
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:88276
  review:
    summary: RGD orthology transfer from mouse Ctnnb1. Developmental or physiological outcome downstream
      of Wnt/beta-catenin transcription.
    action: KEEP_AS_NON_CORE
    reason: Beta-catenin is the TCF/LEF coactivator of canonical Wnt signalling and a cadherin-adhesion
      scaffold; experimental perturbation of the mouse or human ortholog affects this process, and the
      rat row inherits that annotation by orthology or sequence similarity. The term records a tissue-
      or stage-specific consequence of Wnt/TCF target-gene activation (and in some contexts of adhesion),
      not a distinct molecular activity, so it is kept as non-core.
    supported_by:
    - reference_id: UniProtKB:Q9WU82
      supporting_text: Key downstream component of the canonical Wnt signaling pathway
    - reference_id: UniProtKB:Q9WU82
      supporting_text: In the presence of Wnt ligand, CTNNB1 is not ubiquitinated and accumulates in the
        nucleus, where it acts as a coactivator for transcription factors of the TCF/LEF family, leading
        to activate Wnt responsive genes
