    label: cytoplasm
  evidence_type: EXP
  original_reference_id: PMID:16815997
  qualifier: located_in
  review:
    summary: Rat EXP annotation (PMID:16815997). Cytoplasmic pool of beta-catenin (cadherin-bound and
      destruction-complex pools); core location.
    action: ACCEPT
    reason: Beta-catenin is cytoplasmic in its cadherin-bound and destruction-complex pools; rat data
      show cytosolic beta-catenin regulated by GSK3 (PMID:12610652) and cytoplasmic accumulation in embryonic
      liver (PMID:17236583). The IBA node is consistent with this conserved localisation.
    supported_by:
    - reference_id: PMID:12610652
      supporting_text: Lithium chloride, which mimics Wnt signaling by inhibiting glycogen synthase kinase-3beta
        promoted the survival of post-mitotic neurons against Abeta neurotoxicity and recovered cytosolic
        beta-catenin to control levels
    - reference_id: PMID:17236583
      supporting_text: Beta-catenin proteins were found in cytoplasm of E12 and E16 embryonic liver as
        well as in hepatoma
    - reference_id: UniProtKB:Q9WU82
      supporting_text: In the absence of Wnt, forms a complex with AXIN1, AXIN2, APC, CSNK1A1 and GSK3B
        that promotes phosphorylation on N-terminal Ser and Thr residues and ubiquitination of CTNNB1
        via BTRC and its subsequent degradation by the proteasome
