suggested_questions:
- question: Should rat Pgp be annotated to negative regulation of insulin secretion involved
    in cellular response to glucose stimulus (GO:0061179)? In rat INS832/13 cells and
    islets G3PP knockdown increases and overexpression decreases glucose-stimulated
    insulin secretion (PMID:26755581), but the effect is mediated by Gro3P levels, so
    curators should decide whether this metabolic influence counts as regulation of
    secretion by Pgp.
- question: Should rat Pgp also carry 4-phosphoerythronate phosphatase activity (GO:0140401),
    the activity shown for mammalian PGP in the metabolite-repair study (PMID:27294321),
    and is there rat-specific enzymology for it?
