  review:
    summary: Toxic metabolite repair, transferred by orthology from human PGP (UniProtKB:A6NDG6). Mammalian PGP removes the glycolytic side
      products 4-phosphoerythronate (made by GAPDH) and 2-phospho-L-lactate (made by
      pyruvate kinase) that would otherwise inhibit the pentose phosphate pathway and
      fructose-2,6-bisphosphate synthesis. Pgp catalyzes the repair step itself, so this
      process is directly executed by the gene product.
    action: ACCEPT
    reason: Experimental work on the mammalian enzyme establishes metabolite repair as
      a conserved function of PGP (PMID:27294321), and the rat protein is a one-to-one
      ortholog; this row is a donor-split duplicate of the mouse-sourced ISO row with human PGP (A6NDG6) as donor. Changed from KEEP_AS_NON_CORE at the 2026 re-review; this is a
      core role together with glycerol-3-phosphate hydrolysis.
    supported_by:
