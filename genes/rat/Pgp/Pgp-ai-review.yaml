- term:
    id: GO:0008967
    label: phosphoglycolate phosphatase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - UniProtKB:A6NDG6
  review:
    summary: Phosphoglycolate phosphatase activity (EC 3.1.3.18), the historical namesake
      activity of this HAD-family hydrolase, is transferred by orthology from human PGP (UniProtKB:A6NDG6). It is one of the conserved metabolite-repair
      activities of PGP, alongside dephosphorylation of the glycolytic side products 4-phosphoerythronate
      and 2-phospho-L-lactate, and is retained together with glycerol-3-phosphate phosphatase
      activity as a core activity.
    action: ACCEPT
    reason: The mammalian enzyme dephosphorylates 2-phosphoglycolate and, more efficiently
      in cells, the related glycolytic side products that it was shown to repair (PMID:27294321).
      2-phosphoglycolate levels in hepatocytes are below the enzyme Km, so in those
      cells Gro3P hydrolysis may dominate flux, but this does not make the activity
      incorrect; the rat enzyme is a one-to-one ortholog of the characterized mouse and
      human PGP (here the donor is human PGP A6NDG6; donor-split duplicate of the mouse-sourced ISO row). Changed from KEEP_AS_NON_CORE at the 2026 re-review to reflect
      the metabolite-repair role now foregrounded in UniProt.
    supported_by:
    - reference_id: UniProtKB:D3ZDK7
      supporting_text: 'Reaction=2-phosphoglycolate + H2O = glycolate + phosphate'
    - reference_id: PMID:27294321
