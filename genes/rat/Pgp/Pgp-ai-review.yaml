- id: PMID:26755581
  title: 'Identification of a mammalian glycerol-3-phosphate phosphatase: Role in
    metabolism and signaling in pancreatic beta-cells and hepatocytes'
  findings:
  - statement: Mammalian phosphoglycolate phosphatase acts as a glycerol-3-phosphate
      phosphatase (G3PP) that directly hydrolyzes Gro3P to glycerol, and by controlling
      Gro3P levels regulates glucose-stimulated insulin secretion and the metabolic
      stress response in pancreatic beta-cells.
    supporting_text: We found that G3PP, by controlling Gro3P levels, regulates glycolysis
      and glucose oxidation, cellular redox and ATP production, gluconeogenesis, glycerolipid
      synthesis, and fatty acid oxidation in pancreatic islet β-cells and hepatocytes,
      and that glucose stimulated insulin secretion and the response to metabolic
      stress, e.g., glucolipotoxicity, in β-cells.
    reference_section_type: ABSTRACT
- id: PMID:27294321
  title: A conserved phosphatase destroys toxic glycolytic side products in mammals
    and yeast.
  findings:
  - statement: Mammalian PGP is a conserved metabolite-repair enzyme that dephosphorylates
      4-phosphoerythronate and 2-phospho-L-lactate formed by GAPDH and pyruvate kinase
      side reactions.
    supporting_text: We discovered that a single, widely conserved enzyme, known as
      phosphoglycolate phosphatase (PGP) in mammals, dephosphorylates both 4-phosphoerythronate
      and 2-phospho-L-lactate, thereby preventing a block in the pentose phosphate
      pathway and glycolysis.
    reference_section_type: ABSTRACT
