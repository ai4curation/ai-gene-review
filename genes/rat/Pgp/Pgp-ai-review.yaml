core_functions:
- description: Rat Pgp is the mammalian glycerol-3-phosphate phosphatase (G3PP), a
    HAD-like Mg2+-dependent hydrolase that cleaves glycerol-3-phosphate (Gro3P) into
    glycerol plus inorganic phosphate. By operating this glycerol shunt it sets cellular
    Gro3P levels at the crossroads of glucose, lipid, and energy metabolism. In hepatocytes
    it restrains gluconeogenesis from glycerol, and in pancreatic beta-cells it modulates
    glucose-stimulated insulin secretion and protects against glucolipotoxicity. Although
    historically named phosphoglycolate phosphatase, in hepatocytes and beta-cells Gro3P
    (near the enzyme Km) rather than 2-phosphoglycolate appears to be the main substrate.
  supported_by:
  - reference_id: UniProtKB:D3ZDK7
    supporting_text: 'Reaction=sn-glycerol 3-phosphate + H2O = glycerol + phosphate'
  - reference_id: PMID:26755581
    supporting_text: We describe here a mammalian Gro3P phosphatase (G3PP), which was
      not known to exist in mammalian cells, that can directly hydrolyze Gro3P to glycerol.
  - reference_id: file:rat/Pgp/Pgp-deep-research-falcon.md
    supporting_text: catalyzing **glycerol-3-phosphate (Gro3P) → glycerol + inorganic
      phosphate** and thereby operating a **“glycerol shunt”**
