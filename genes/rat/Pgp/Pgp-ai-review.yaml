- description: Pgp is a conserved metabolite-repair phosphatase that dephosphorylates
    2-phosphoglycolate and the glycolytic side products 4-phosphoerythronate and 2-phospho-L-lactate,
    preventing their inhibition of the pentose phosphate pathway and of fructose-2,6-bisphosphate
    synthesis.
