        phosphoglycolate phosphatase (PGP) in mammals, dephosphorylates both 4-phosphoerythronate
        and 2-phospho-L-lactate, thereby preventing a block in the pentose phosphate
        pathway and glycolysis.
    - reference_id: file:rat/Pgp/Pgp-deep-research-falcon.md
