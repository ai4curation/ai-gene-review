- term:
    id: GO:0110052
    label: toxic metabolite repair
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: Toxic metabolite repair, transferred by sequence similarity from mouse Pgp (UniProtKB:Q8CHP8). Mammalian PGP removes the glycolytic side
      products 4-phosphoerythronate (made by GAPDH) and 2-phospho-L-lactate (made by
      pyruvate kinase) that would otherwise inhibit the pentose phosphate pathway and
      fructose-2,6-bisphosphate synthesis. Pgp catalyzes the repair step itself, so this
      process is directly executed by the gene product.
    action: ACCEPT
    reason: Experimental work on the mammalian enzyme establishes metabolite repair as
      a conserved function of PGP (PMID:27294321), and the rat protein is a one-to-one
      ortholog of mouse Pgp Q8CHP8, which carries IDA support for this process. Changed from KEEP_AS_NON_CORE at the 2026 re-review; this is a
      core role together with glycerol-3-phosphate hydrolysis.
    supported_by:
    - reference_id: UniProtKB:D3ZDK7
      supporting_text: 'Acts as a metabolite repair enzyme which eliminates toxic glycolytic side products (By similarity).'
    - reference_id: PMID:27294321
