id: D3ZDK7
gene_symbol: Pgp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Pgp encodes the rat phosphoglycolate phosphatase / glycerol-3-phosphate
  phosphatase (G3PP, also called AUM), a cytosolic Mg2+-dependent haloacid dehalogenase
  (HAD) superfamily hydrolase. It hydrolyzes glycerol-3-phosphate to glycerol and phosphate,
  operating a glycerol shunt that sets Gro3P levels at the junction of glycolysis, glycerolipid
  synthesis, gluconeogenesis and the Gro3P redox shuttle; in rat hepatocytes and pancreatic
  beta-cells this restrains gluconeogenesis and modulates glucose-stimulated insulin secretion.
  The enzyme is also a conserved metabolite-repair phosphatase that dephosphorylates
  2-phosphoglycolate and the glycolytic side products 4-phosphoerythronate and 2-phospho-L-lactate,
  preventing inhibition of the pentose phosphate pathway and glycolysis. Weak tyrosine-protein
  and nucleotide phosphatase activities have been reported in vitro.
