  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: A defining downstream output of EGFR is activation of the RAS-RAF-MEK-ERK
      (MAPK) cascade via GRB2/SHC1 recruitment. This is one of the principal signaling
      consequences of receptor activation, but it is a downstream BP consequence of
      the core RTK activity rather than the core function itself.
