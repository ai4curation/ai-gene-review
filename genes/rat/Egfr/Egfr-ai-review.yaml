id: G3V6K6
gene_symbol: Egfr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Egfr (EGFR/ErbB1) is the rat ortholog of the epidermal growth factor
  receptor, a single-pass type I transmembrane receptor tyrosine kinase (EC 2.7.10.1).
  Its extracellular region contains cysteine-rich (furin-like) subdomains that bind
  EGF-family ligands; ligand binding stabilizes an active conformation, exposes a
  dimerization arm, and drives receptor dimerization. Dimerization activates the intracellular
  tyrosine kinase domain (asymmetric kinase-domain interaction), which autophosphorylates
  C-terminal tail tyrosines, creating SH2/PTB docking sites for adaptors (GRB2, SHC1,
  GAB1, PLCgamma). This couples EGFR to the canonical RAS-RAF-MEK-ERK (MAPK), PI3K-AKT-mTOR,
  and PLCgamma/Ca2+ pathways, governing proliferation, survival, motility, and context-dependent
  transcription. The core function is therefore ligand-activated transmembrane receptor
  tyrosine kinase signaling at the plasma membrane. Activated EGFR is internalized
  by clathrin-mediated endocytosis and can continue signaling from early endosomes
  before recycling or Cbl/Cbl-b ubiquitin-dependent lysosomal degradation; this trafficking
  shapes signal duration. In native rat inner medullary collecting duct, EGFR is localized
  to the basolateral plasma membrane and EGF stimulation increases EGFR tyrosine phosphorylation
  (e.g. Y1091/Y1171) with strong ErbB/PI3K-Akt/MAPK pathway enrichment. EGFR is highly
  pleiotropic, contributing to many downstream developmental, proliferative, and physiological
  processes that are not its core biochemical function.
