- id: PMID:20639532
  title: A novel role of CPEB3 in regulating EGFR gene transcription via association
    with Stat5b in neurons.
  findings:
  - statement: CPEB3 represses EGFR transcription with Stat5b in neurons; elevated
      EGFR in CPEB3-knockdown neurons gives amplified EGF-induced Stat5b and Akt signalling,
      and EGF or gefitinib infusion modulates spatial learning and memory in mice.
    supporting_text: The elevated EGFR level in CPEB3 knockdown neurons, when stimulated
      with EGF, results in extended and amplified downstream signaling measured by
      phosphorylation of Stat5b and Akt.
- id: PMID:30574069
  title: Endocytic Adaptor Protein HIP1R Controls Intracellular Trafficking of Epidermal
    Growth Factor Receptor in Neuronal Dendritic Development.
  findings:
  - statement: HIP1R binds EGFR and drives its endocytosis in cultured rat hippocampal
      neurons, contributing to dendritic development.
    supporting_text: We found out that HIP1R interacts with EGFR and induces EGFR endocytosis
      to participate in dendritic development.
