core_functions:
- description: Ligand-activated transmembrane receptor tyrosine kinase - EGFR binds
    EGF-family ligands at the cell surface, dimerizes, and autophosphorylates C-terminal
    tyrosines via its intracellular kinase domain, transmitting the signal across
    the plasma membrane.
  molecular_function:
    id: GO:0004714
    label: transmembrane receptor protein tyrosine kinase activity
  supported_by:
  - reference_id: file:rat/Egfr/Egfr-deep-research-falcon.md
    supporting_text: EGFR is a **receptor protein-tyrosine kinase** that increases
      intrinsic kinase activity upon ligand-induced dimerization and catalyzes autophosphorylation
      on cytoplasmic tyrosines, generating SH2/PTB docking sites for signaling proteins
      such as GRB2, GAB1, and PLCγ.
- description: EGF-family ligand recognition - the extracellular cysteine-rich domains
    bind EGF, the obligatory first step that initiates receptor activation.
  molecular_function:
    id: GO:0048408
    label: epidermal growth factor binding
  supported_by:
  - reference_id: file:rat/Egfr/Egfr-deep-research-falcon.md
    supporting_text: EGFR is activated by binding EGF-family ligands, which stabilizes
      an active extracellular conformation, exposes a dimerization interface, and
      promotes receptor dimerization.
- description: Initiation of EGFR signaling and downstream MAPK/PI3K activation -
    autophosphorylated EGFR recruits GRB2/SHC1/GAB1/PLCgamma to drive the RAS-RAF-MEK-ERK
    and PI3K-AKT-mTOR pathways.
  molecular_function:
    id: GO:0005006
    label: epidermal growth factor receptor activity
  supported_by:
  - reference_id: file:rat/Egfr/Egfr-deep-research-falcon.md
    supporting_text: Autophosphorylation enables recruitment of adaptor/effector proteins
      (e.g., GRB2, GAB1, PLCγ), coupling EGFR to major signaling routes including
      **RAS–RAF–MEK–ERK (MAPK)** and **PI3K–AKT–mTOR**, among others.
