description: >-
  ProTrek sequence-to-text retrieval for rat Egfr, the third EGFR ortholog in the cohort. Ranks 1,
  3 and 4 are exact GOA matches recovering two of this review's three core functions, and rank 2 repeats
  the ERBB3:ERBB2 error that appeared at rank 3 for both the human and mouse orthologs - here promoted
  a rank. Rank 5 is obsolete. Across three species the same five concepts are returned in near-identical
  order, including the same wrong complex. Assessment: 2 correct not novel (CNN), 1 paralog incorrect
  (PLI).
