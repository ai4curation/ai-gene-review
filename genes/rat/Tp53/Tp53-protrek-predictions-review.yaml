id: P10361
gene_symbol: Tp53
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus (Rat)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for rat Tp53. None of the three curated core functions - sequence-specific
  RNA polymerase II transcription factor activity and its transcription-activator refinements - appears
  anywhere in the top five, although GOA carries sequence-specific DNA binding with IDA support. What
  comes back instead is a minor biochemical activity, two ranks of the same actinomycin-D response,
  and circadian behavior. The comparison across orthologs is the notable part: mouse Trp53 (P02340)
  returns the same four terms in the same order at ranks 1-4, while human TP53 (P04637) returns a
  completely different list dominated by thymocyte and oligodendrocyte apoptosis. Three orthologs
  of the most-studied tumour suppressor in biology, three unrelated answers, and none of them the
  transcription factor - the rodent pair is matching a shared ISS/ISO-derived annotation set rather
  than p53 biology. The free-text channel again outperforms the GO channel, returning the correct
  tumour-suppressor and trans-activator comment at 17.46. Assessment: 2 correct not novel (CNN), 1
  less precise (LSP).
