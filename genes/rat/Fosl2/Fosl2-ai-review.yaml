  review:
    summary: RNA polymerase II-specific DNA-binding transcription factor activity, inherited across the Fos family.
    action: ACCEPT
    reason: 'Core function. Fra-2 regulates transcription of pol II target genes in rat: it activates the C/EBPbeta
      promoter in PGE2-treated osteoblasts (PMID:15299028) and its own promoter (PMID:11340164), and represses Rgs4
      through a variant AP-1 element (PMID:21367864). The PAINT node placement across Fos-family members is consistent
