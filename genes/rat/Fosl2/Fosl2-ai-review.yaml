suggested_questions:
- question: 'What determines whether a Fra-2-containing AP-1 dimer activates (C/EBPbeta, Cd24) or represses (Rgs4,
    Dio2) a given rat pineal or osteoblast promoter: the Jun partner, the cis-element variant (AP-1 vs AP-1R), or
    Fra-2 phosphorylation state?'
- question: Should the many mouse phenotype-derived ISO process annotations (lung fibrosis, systemic inflammation,
    glucose homeostasis) projected to rat Fosl2 be restricted to processes in which Fra-2 directly controls a target
    gene?
suggested_experiments:
- description: Genome-wide FRA-2 ChIP-seq in rat pineal gland at night versus day, combined with the DN-FRA-2 transgenic
    expression data, to define direct activated versus repressed targets and the associated cis-element variants.
- description: Co-immunoprecipitation and sequential ChIP of FRA-2 with JunD/c-Jun and CBP at the Rgs4 and Cebpb
    promoters to test partner-dependent activation versus repression.
