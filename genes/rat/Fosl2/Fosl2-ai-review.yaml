id: P51145
gene_symbol: Fosl2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Fosl2 encodes Fos-related antigen 2 (Fra-2), a 326-residue Fos-family basic region-leucine zipper
  (bZIP) transcription factor. Fra-2 cannot homodimerize; it forms AP-1 heterodimers with Jun proteins (c-Jun, JunD)
  that bind TRE-type and variant AP-1 cis-elements in RNA polymerase II promoters in the nucleus. Lacking the potent
  C-terminal transactivation domain of c-Fos, Fra-2 activates or represses targets depending on its partner and
  promoter: in rat it activates C/EBPbeta in PGE2/PKA-stimulated osteoblasts and its own gene, and represses Rgs4
  in the pineal gland by binding a variant AP-1 element and dismissing the co-activator CBP. Fosl2 is an inducible
  immediate-early gene, strongly induced by adrenergic/cAMP signalling; in the rat pineal gland it shows a ~200-fold
  nocturnal rise and provides most of the rhythmic AP-1 DNA-binding activity, regulating genes such as Dio2, Cd24
  and Rgs4. Work in mouse shows that Fra-2 controls chondrocyte hypertrophy, osteoblast differentiation and collagen
  expression, osteoclast survival and size (via LIF), adipocyte turnover (via PPARgamma2 and leptin), and B and
  T lymphocyte differentiation; ectopic expression causes lung fibrosis. Fra-2 is phosphorylated, acetylated and
  SUMOylated.'
