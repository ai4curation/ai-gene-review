    summary: 'Proposed: FRA-2 represses Rgs4 by binding a proximal variant AP-1 (AP-1R) element and displacing the
      co-activator CBP.'
    action: NEW
    reason: 'Direct molecular-function evidence in rat: FRA-2 occupies the Rgs4 AP-1R element in pineal chromatin
      (ChIP) and in vitro (EMSA); dominant-negative FRA-2 relieves nocturnal Rgs4 repression; mutating the AP-1R
      element blocks repression while mutating an upstream consensus AP-1 site does not; and FRA-2 loading is inversely
      related to CBP occupancy. Dio2 is a second candidate repressed target (PMID:11340164) and Adipoq/PPARgamma2
      are repressed targets in mouse. This is a sibling, not an ancestor or descendant, of the activator activity
      already on the gene; together they reflect the dimer- and promoter-dependent dual output of Fra-2.'
    supported_by:
