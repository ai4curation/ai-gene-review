        effect
    - reference_id: PMID:11340164
      supporting_text: Our observations that cotransfected DNF2 protein failed to stimulate fra-2 promoter-driven
        reporter gene activity whereas intact Fra-2 has this effect are fully consistent with a model involving
        autostimulation
    - reference_id: PMID:21367864
      supporting_text: Nocturnal changes in protein complexes at the Rgs4 AP-1R sequence are associated with FRA-2-dependent
        dismissal of the co-activator, CBP; this provides a mechanistic basis for Rgs4 gene repression
