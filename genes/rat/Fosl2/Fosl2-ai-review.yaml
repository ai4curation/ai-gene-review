        and serotonin through the suprachiasmatic nucleus
    - reference_id: PMID:7592994
      supporting_text: Both Fra-2 mRNA and protein are absent during the day and increase robustly at night on a
        circadian basis; organ culture studies indicate that regulation is mediated by an adrenergic-->cyclic AMP
        mechanism
    - reference_id: PMID:21367864
      supporting_text: a nocturnal rhythm of pineal gland FRA-2 is suppressed by a genetically encoded, dominant
        negative mutant protein
