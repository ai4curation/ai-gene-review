- term:
    id: GO:0001503
    label: ossification
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:102858
  review:
    summary: Ossification (mouse Fosl2 mutants; delayed vertebral ossification, osteoblast defect).
    action: KEEP_AS_NON_CORE
    reason: 'This ISO row is projected by RGD from mouse Fosl2 (MGI:102858), where knockout, conditional-knockout
      and transgenic-overexpression phenotypes are the evidence. Here the mouse loss-of-function data are cell-autonomous
      and tied to identified direct Fra-2 target genes, so the process is a reasonable, if pleiotropic, context
      in which this AP-1 factor acts as a transcriptional regulator. It is kept as non-core: the core activity is
      RNA polymerase II-specific DNA-binding transcription factor activity, and the developmental role has not been
      examined in rat.'
    supported_by:
    - reference_id: PMID:20837772
      supporting_text: Fra-2-deficient osteoblasts display a differentiation defect both in vivo and in vitro
    - reference_id: PMID:15509771
      supporting_text: Hence, Fra2 is a novel transcription factor important for skeletogenesis by affecting chondrocyte
        differentiation
