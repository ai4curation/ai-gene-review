gene_symbol: Sipa1l1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Sipa1l1 (SPAR, spine-associated Rap GTPase-activating protein; also SPAL) is a large (1822 aa) cytoplasmic
  Rap-GAP of the SIPA1/Rap1GAP family, with a Rap-GAP domain, a PDZ domain, an actin-interacting (Act2) region and
  a C-terminal coiled coil. Highly expressed in brain, it is enriched in dendritic spines of excitatory neurons,
  where it binds F-actin and the guanylate kinase domain of PSD-95-family scaffolds. Its GAP activity inactivates
  Rap1 and Rap2, and together with actin reorganization it promotes enlargement and maturation of dendritic spine
  heads. Through its PDZ domain it binds the C terminus of ephrin-activated EphA4, coupling EphA4 to Rap1/Rap2 inactivation
  and growth cone collapse. SPAR abundance is controlled by activity: CDK5 priming phosphorylation creates a docking
  site for the activity-induced kinase Plk2, whose phosphorylation generates a phosphodegron recognized by SCF(beta-TRCP),
  leading to SPAR ubiquitination and proteasomal degradation; this removal is required for homeostatic synaptic
  scaling. Knockout mice nevertheless have normal spine size and NMDA receptor-dependent plasticity but show behavioural
  and GPCR-signaling abnormalities, and super-resolution imaging in mouse places most of the protein in submembranous
  regions rather than the PSD.'
