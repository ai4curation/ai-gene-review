suggested_questions:
- question: Is SPAR a constituent of the PSD proper, or a submembranous/actin-cortex protein that co-fractionates
    with PSD preparations? The 2001-2010 biochemical data and the 2022 mouse super-resolution and interactor data
    disagree.
- question: Why do Sipa1l1 knockout mice have normal spine size distribution when acute knockdown and dominant-negative
    constructs alter spines; do SIPA1L2/SIPA1L3 or RAP1GAP compensate?
- question: GO:0046582 Rap GTPase activator activity is obsolete; should Rap-substrate specificity of GAPs such
    as SPAR be captured by has_input in GO-CAM?
suggested_experiments:
- hypothesis: SPAR's role in spine morphology is masked in knockouts by paralog compensation.
  description: Combined conditional deletion of Sipa1l1 with Sipa1l2/Sipa1l3 in forebrain neurons, measuring spine
    morphology, Rap1/Rap2-GTP and synaptic scaling.
  experiment_type: genetic perturbation
- hypothesis: SPAR GAP activity toward Rap1 and Rap2 is directly modulated by EphA4 binding and by Plk2/CDK5 phosphorylation.
  description: In vitro GAP assays with purified SPAR (wild type, PDZ deletion, phospho-mimetic and phospho-dead
    Ser-1367/Ser-1344/Thr-1348 mutants) on Rap1 and Rap2, with or without EphA4 C-terminal peptide.
  experiment_type: biochemical assay
