- term:
    id: GO:0047826
    label: D-lysine 5,6-aminomutase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000785233
  - UniProtKB:Q8N661
  review:
    summary: 'D-lysine 5,6-aminomutase activity: an erroneous term propagated from human TMEM86B.'
    action: REMOVE
    reason: GO:0047826 D-lysine 5,6-aminomutase activity (EC 5.4.3.3) is an adenosylcobalamin-dependent intramolecular
      aminotransferase of anaerobic lysine fermentation in bacteria. Nothing in the TMEM86 literature reports any
      aminomutase activity; the only paper cited for the human donor (PMID:21515882) measures lysoplasmalogenase
      (EC 3.3.2.2) only. The donor annotation on human TMEM86B (Q8N661, IDA:UniProtKB citing PMID:21515882) is a
      mis-mapped term, and the rat rows are propagations of it. TMEM86B has no cobalamin- or PLP-binding domain;
      its YhhN fold is a membrane ether hydrolase. This propagated row should be removed.
    supported_by:
    - *id008
    - *id004
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      source_entities:
      - source_id: UniProtKB:Q8N661
        source_status: SOURCE_BAD
        comment: Human IDA to GO:0047826 cites PMID:21515882, which reports only lysoplasmalogenase activity.
      - source_id: PANTHER:PTN000785233
        source_status: SOURCE_BAD
        comment: Node carries the aminomutase term solely because of the erroneous human seed.
    source_defects:
    - defect_type: WRONG_TERM
      requested_change: DELETE_ROW
      asserted_value: GO:0047826
      confidence: PROBABLE
      resource: GO_CENTRAL
      explanation: GO:0047826 D-lysine 5,6-aminomutase activity (EC 5.4.3.3) is an adenosylcobalamin-dependent intramolecular
        aminotransferase of anaerobic lysine fermentation in bacteria. Nothing in the TMEM86 literature reports
