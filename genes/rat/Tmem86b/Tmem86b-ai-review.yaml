core_functions:
- description: 'Lysoplasmalogenase: hydrolysis of the vinyl ether bond of choline and ethanolamine lysoplasmalogens
    to fatty aldehyde plus glycerophosphocholine or glycerophosphoethanolamine, at the ER membrane, controlling
    plasmalogen/lysoplasmalogen levels.'
  molecular_function:
    id: GO:0047408
    label: alkenylglycerophosphocholine hydrolase activity
  directly_involved_in:
  - id: GO:0046485
    label: ether lipid metabolic process
  locations: *id001
  supported_by:
  - *id004
  - *id011
  - *id012
  - *id013
  - *id010
suggested_questions:
- question: Should GO:0047408 be broadened or relabelled (e.g. lysoplasmalogenase activity) now that EC 3.3.2.5
    is merged into EC 3.3.2.2 and GO:0047409 is obsolete, so that ethanolamine lysoplasmalogen hydrolysis is explicitly
    covered?
- question: Would GO accept an ether lipid (or plasmalogen) catabolic process term, so that lysoplasmalogenases
    and plasmalogenases need not be annotated only to the broad metabolic process?
- question: What is the source of the human TMEM86B D-lysine 5,6-aminomutase IDA (UniProt), and can it be withdrawn
    along with the PAINT node PTN000785233 assertion?
suggested_experiments:
- description: Determine the topology and catalytic mechanism of rat Tmem86b by structure determination (cryo-EM
    of the dimer) combined with mutagenesis of the conserved histidines, to define the active site of the YhhN ether
    hydrolase fold and which face of the ER membrane it acts on.
- description: Confirm ER membrane residence of endogenous rat Tmem86b in hepatocytes by co-localisation with ER
    markers and by protease-protection of microsomes.
