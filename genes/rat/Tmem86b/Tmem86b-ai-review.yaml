id: B0BNF0
gene_symbol: Tmem86b
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Tmem86b is a multi-pass (eight-helix) integral membrane protein of the YhhN/TMEM86 family that functions
  as lysoplasmalogenase (EC 3.3.2.2), the enzyme that hydrolyses the vinyl ether bond of sn-2-deacylated plasmalogens
  (lysoplasmenylcholine and lysoplasmenylethanolamine) to a long-chain fatty aldehyde and glycerophosphocholine
  or glycerophosphoethanolamine. It was purified from rat liver microsomes, where it resides in the endoplasmic
  reticulum membrane; it has a Km of about 50 uM for both substrates, a neutral pH optimum, and is competitively
  inhibited by lysophosphatidic acid. Expression is highest in liver. By degrading lysoplasmalogens produced by
  plasmalogen-selective phospholipase A2, it limits the pool available for reacylation and so regulates cellular
  and circulating plasmalogen levels; loss of the mouse ortholog raises plasmalogens and lysoplasmalogens in plasma,
  liver and NK cells.
