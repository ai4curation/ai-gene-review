- term:
    id: GO:0046485
    label: ether lipid metabolic process
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8N661
  review:
    summary: Ether lipid (plasmalogen) metabolism; the enzyme degrades lysoplasmalogens.
    action: ACCEPT
    reason: Tmem86b catalyses the hydrolytic cleavage of the vinyl ether bond of lysoplasmalogens, a step of plasmalogen
      catabolism performed by the gene product itself. GO has no ether lipid or plasmalogen catabolic process term,
      so GO:0046485 is as precise as available. Overexpression lowers cellular plasmalogens and knockout mice accumulate
      plasmalogens and lysoplasmalogens.
    supported_by:
    - &id008
      reference_id: file:rat/Tmem86b/Tmem86b-uniprot.txt
      supporting_text: Catalyzes the hydrolysis of the vinyl ether bond of choline or ethanolamine lysoplasmalogens,
        forming fatty aldehyde and glycerophosphocholine or glycerophosphoethanolamine, respectively and is specific
        for the sn-2-deacylated (lyso) form of plasmalogen.
    - &id009
      reference_id: PMID:21515882
      supporting_text: Overexpression of TMEM86b in HEK 293T cells resulted in decreased levels of plasmalogens
    - &id010
      reference_id: PMID:40245986
      supporting_text: Tmem86b KO mice demonstrated significantly elevated levels of the plasmalogens, alkenylphosphatidylethanolamine
        (PE(P)), and alkenylphosphatidylcholine (PC(P)), as well as lysoplasmalogens, in the plasma, liver, and
        natural killer cells compared to their wild-type counterparts.
