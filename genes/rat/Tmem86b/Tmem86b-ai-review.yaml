- term:
    id: GO:0047408
    label: alkenylglycerophosphocholine hydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000785233
  - RGD:1593455
  - UniProtKB:Q8N661
  review:
    summary: Lysoplasmalogenase (EC 3.3.2.2) activity on alkenyl-glycerophosphocholine (and ethanolamine) lysoplasmalogens;
      the defining activity of Tmem86b.
    action: ACCEPT
    reason: Rat liver lysoplasmalogenase was purified to near homogeneity and identified as Tmem86b, with Km ~50
      uM for lysoplasmenylcholine and lysoplasmenylethanolamine; expression of the cDNA in HEK293T and in E. coli
      (which lacks the activity) conferred lysoplasmalogenase activity, and an independent HPLC assay confirmed
      TMEM86B activity. The ethanolamine-substrate term GO:0047409 is obsolete, so GO:0047408 covers the enzyme.
      The PAINT node (PTN000785233) is seeded by the rat and human TMEM86B experimental annotations; bacterial YhhN
      proteins are also lysoplasmalogenases, consistent with an ancestral activity.
    supported_by:
    - *id004
    - reference_id: PMID:25445671
      supporting_text: We recently purified lysoplasmalogenase from rat liver microsomes and identified the protein
        as TMEM86B, an integral membrane protein that is a member of the YhhN family found in numerous species of
        eukaryotes and bacteria.
