      (EC 3.3.2.2) only. The donor annotation on human TMEM86B (Q8N661, IDA:UniProtKB citing PMID:21515882) is a
      mis-mapped term, and the rat rows are propagations of it. TMEM86B has no cobalamin- or PLP-binding domain;
      its YhhN fold is a membrane ether hydrolase. This propagated row should be removed.
    supported_by:
