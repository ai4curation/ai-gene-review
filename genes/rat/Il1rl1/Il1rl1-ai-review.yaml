    record_section: ["CC:FUNCTION"]
    supporting_text: Receptor for interleukin-33 (IL-33) which plays crucial roles in innate and adaptive
      immunity, contributing to tissue homeostasis and responses to environmental stresses together with
      coreceptor IL1RAP
