id: Q62611
gene_symbol: Il1rl1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Interleukin-1 receptor-like 1 (Il1rl1; also Fit-1, T1/ST2) is the ligand-binding receptor
  chain for the IL-1 family cytokine interleukin-33. It is a type I transmembrane protein with three extracellular
  Ig-like C2 domains and a cytoplasmic TIR domain. Alternative promoter usage and 3' processing give a
  membrane-bound form (Fit-1M, ST2L, isoform A) and a secreted form made of the extracellular domain alone
  (Fit-1S, sST2, isoform B). IL-33 bound to ST2L recruits the coreceptor IL1RAP, and the paired TIR domains
  assemble MYD88, IRAK1/IRAK4 and TRAF6 to activate NF-kappaB and MAP kinase signalling. This pathway
  drives type 2 (Th2, ILC2, mast cell) immune responses and alternatively activated macrophages, and protects
  tissue after injury. Soluble ST2 binds IL-33 and acts as a decoy that inhibits IL-33 signalling. In
  rat, Il1rl1 is a Fos-responsive delayed-early gene in fibroblasts. It is induced in cardiac myocytes
  by mechanical strain and endothelin-1, and the IL-33/ST2 axis acts as a cardioprotective fibroblast-cardiomyocyte
  paracrine system. Soluble ST2 rises in the aorta of diet-induced obese rats, where it is associated
  with vascular fibrosis.
