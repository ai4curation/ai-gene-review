core_functions:
- description: Membrane-bound ST2L (isoform A) is the ligand-binding chain of the IL-33 receptor. IL-33
    binding recruits IL1RAP, and the TIR domains assemble MYD88/IRAK/TRAF6 to activate NF-kappaB and MAPK
    signalling.
  molecular_function:
    id: GO:0002114
    label: interleukin-33 receptor activity
  directly_involved_in:
