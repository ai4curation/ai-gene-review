suggested_questions:
- question: Does the IL1RL1 TIR domain have any intrinsic NAD+ hydrolase activity, or is the UniProt EC
    3.2.2.6 assignment purely a PROSITE TIR-rule artefact?
- question: In rat heart, what is the relative contribution of membrane ST2L signalling versus sST2 decoy
    sequestration to the cardioprotective effects of IL-33?
suggested_experiments:
- description: Purify the rat Il1rl1 TIR domain (with and without forced dimerisation) and assay NAD+
    consumption and ADPR/cADPR production by HPLC, using SARM1 TIR as a positive control.
- description: Selectively delete the distal (Fit-1S) or proximal (Fit-1M) promoter in rat and measure
    IL-33 responses and cardiac remodelling after pressure overload.
