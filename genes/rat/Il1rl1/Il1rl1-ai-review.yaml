- term:
    id: GO:0061809
    label: NAD+ nucleosidase activity, cyclic ADP-ribose generating
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:3.2.2.6
  review:
    summary: EC 3.2.2.6 mapping from a PROSITE TIR-domain rule assigns NAD+ nucleosidase (cADPR-generating)
      activity.
    action: REMOVE
    reason: The EC number comes only from the automatic PROSITE-ProRule PRU00204 TIR rule. NAD+ hydrolysis
      is established for SARM1 and plant/bacterial TIR domains, but not for IL-1 receptor-family TIR domains,
      which act as signalling scaffolds that recruit MYD88. No study reports NADase or cyclic ADP-ribose
      production by ST2, and cADPR generation is a further specific claim on top of the EC mapping. This
      is an over-propagated electronic inference.
    supported_by:
    - reference_id: file:rat/Il1rl1/Il1rl1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Its stimulation recruits MYD88, IRAK1, IRAK4, and TRAF6
    - reference_id: file:rat/Il1rl1/Il1rl1-deep-research-manual.md
      supporting_text: no study reports NAD+ hydrolysis by an IL-1 receptor-family TIR domain
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:Q62611
      requested_change: CHECK
      asserted_value: EC:3.2.2.6
      confidence: PROBABLE
      explanation: PROSITE-ProRule PRU00204 (TIR domain) adds EC 3.2.2.6 NAD+ hydrolase to IL1RL1; IL-1
        receptor-family TIR domains have no demonstrated NADase activity, so the catalytic-activity and
        EC assignment (and its GO:0061809 mapping) appear over-propagated from SARM1/plant TIR NADases.
