core_functions:
- description: >-
    Uncharacterized rat fold-type I PLP-dependent enzyme-like paralog (putative
    pseudoenzyme in PTHR43795:SF1) that retains Lys419, Asp382, Trp231, and
    substrate-orienting Arg553 while substituting Tyr447 at the inter-subunit
    cationic pocket site corresponding to ACCS Arg351; its protein expression,
    PLP binding, potential enzymatic or regulatory activity, and localization
    remain undetermined (PMID:39876065).
  supported_by:
  - reference_id: PMID:39876065
    supporting_text: >-
      Interestingly, this arginine-to-cysteine substitution is unique to
      hACCSL, as the arginine residue is conserved in other non-human ACCSL
      orthologues (Figure 2).
  - reference_id: file:rat/Accsl/Accsl-uniprot.txt
    record_section: ["DR:PANTHER"]
    supporting_text: >-
      DR   PANTHER; PTHR43795:SF1; INACTIVE 1-AMINOCYCLOPROPANE-1-CARBOXYLATE SYNTHASE-LIKE PROTEIN 2-RELATED; 1.
knowledge_gaps:
- gap_statement: >-
    It is unknown whether rat Accsl (D3ZUW2) is translated in vivo in ovary and
    reproductive tissues, covalently binds PLP at Lys419, retains enzymatic
    activity via Arg553 despite Tyr447, or acts as a non-catalytic pseudoenzyme,
    and its subcellular localization and biological role are wholly
    uncharacterized.
  boundary: >-
    Retention of Lys419/Asp382/Arg553 and substitution of Tyr447 in the
    mammalian SF1 clade are established from genomic sequence (PMID:39876065),
    whereas direct proteomic, biochemical, localization, and genetic evidence
    are absent.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    Resolving whether rodent ACCSL orthologs (Arg551/Arg553) are enzymatically
    active or catalytically silent distinguishes clade-wide mammalian
    neofunctionalization into a pseudoenzyme from a human-specific loss of
    Arg529.
  resolution: >-
    Verify endogenous protein translation in rat ovary by targeted proteomics
    and assay purified recombinant rat Accsl for PLP stoichiometry and ligand
    turnover.
  provenance:
  - reference_id: PMID:39876065
    supporting_text: >-
      Nevertheless, our bioinformatics analysis clearly indicates that animal
      ACCS homologues are more prevalent and complex than previously
      anticipated. Biochemical characterization of these animal homologues is
      therefore warranted to help us understand their functions.
