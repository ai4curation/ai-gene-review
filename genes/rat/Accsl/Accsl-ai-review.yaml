suggested_questions:
- question: >-
    Is rat Accsl protein detectably expressed in ovary or male germ cells, and
    does purified rat Accsl bind PLP at Lys419?
  experts:
  - Yang Hai
suggested_experiments:
- hypothesis: >-
    Recombinant rat Accsl binds PLP via Lys419 and anchors amino-acid
    carboxylates via Arg553, but exhibits minimal C-beta-S lyase turnover due
    to Tyr447.
  description: >-
    Purify recombinant rat Accsl alongside rat Accs and measure UV-vis PLP
    stoichiometry and pyruvate formation across S-substituted cysteine
    sulfoxides and amino-acid substrates.
  experiment_type: Comparative recombinant enzymology
