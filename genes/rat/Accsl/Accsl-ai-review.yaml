description: >-
  Probable inactive 1-aminocyclopropane-1-carboxylate synthase-like protein 2
  (Accsl) is a predicted 617-residue rat fold-type I pyridoxal
  5'-phosphate-dependent aminotransferase-like protein encoded on chromosome 3
  adjacent to its ancestral paralog Accs. Assigned to the mammalian-specific
  clade PTHR43795:SF1, rat Accsl retains the putative Schiff-base Lys419,
  pyridinium-stabilizing Asp382, pocket Trp231, and—like mouse Accsl and other
  non-human mammals—preserves the substrate alpha-carboxylate-anchoring Arg553
  that is replaced by cysteine in reference human ACCSL, while sharing the
  clade-wide SF1 substitution Tyr447 at the cationic inter-subunit pocket
  position (Arg351 in human ACCS, where R351Y reduces beta-lyase activity
  ~40-fold). Its cofactor occupancy, potential catalytic or non-catalytic
  pseudoenzyme function, subcellular localization, and physiological role in
  rat ovary and somatic tissues remain experimentally uncharacterized.
