core_functions:
- description: Zinc-dependent betaine-homocysteine S-methyltransferase that remethylates L-homocysteine to L-methionine
    using glycine betaine as methyl donor, regenerating methionine in the methionine cycle and catalysing the first
    step of betaine (choline-derived) catabolism; mainly cytosolic, with a minor active nuclear pool.
  molecular_function: *id005
  directly_involved_in:
  - id: GO:0071267
    label: L-methionine salvage
  - id: GO:0006579
    label: amino-acid betaine catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  substrates:
  - id: CHEBI:17750
    label: glycine betaine
  - id: CHEBI:58199
    label: L-homocysteine zwitterion
  supported_by:
  - *id003
  - *id009
  - *id001
  - *id006
suggested_questions:
- question: Does the BHMT co-purified with FDH (Aldh1l1) and CPS1 reflect a genuine metabolon in rat liver, or co-binding
    of abundant proteins to the soybean trypsin inhibitor resin?
- question: Does nuclear BHMT remethylate homocysteine locally to support nuclear SAM supply for chromatin methylation,
    or does it have a non-catalytic moonlighting role in the nucleus?
suggested_experiments:
- hypothesis: Nuclear BHMT contributes to the nuclear methionine/SAM pool used for histone and DNA methylation.
  description: Express nuclear-excluded (NES-tagged) versus wild-type BHMT in Bhmt-null rat hepatocytes and measure
    nuclear methionine/SAM and histone methylation under oxidative stress.
  experiment_type: genetic complementation with metabolomics
- hypothesis: BHMT, FDH and CPS1 do not form a stable complex in hepatocytes.
  description: Proximity labelling or crosslinking mass spectrometry in rat liver to test whether BHMT associates
    with Aldh1l1 and CPS1 in situ.
  experiment_type: interaction proteomics
