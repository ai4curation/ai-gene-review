taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Bhmt encodes betaine--homocysteine S-methyltransferase 1 (BHMT, EC 2.1.1.5), a zinc-dependent methyltransferase
  highly expressed in liver and kidney. It transfers a methyl group from glycine betaine to L-homocysteine, producing
  N,N-dimethylglycine and L-methionine. This reaction is one of the two hepatic routes of homocysteine remethylation
  in the methionine cycle, alongside folate/cobalamin-dependent methionine synthase, and it is also the first step
  of betaine catabolism, which completes the irreversible oxidation of choline. Each subunit has an (alpha/beta)8
  barrel that binds one catalytic Zn(2+) through three cysteines, and the enzyme is a homotetramer. BHMT is mainly
  cytosolic. A smaller active nuclear pool grows under oxidative stress and in tissues where expression is low.
  Hepatic BHMT levels respond to diet, rising with ethanol feeding and betaine supplementation.
