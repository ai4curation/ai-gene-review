core_functions:
- description: Phosphorylation-dependent DNA-binding transcription activator that binds cAMP response
    elements in Pol II promoters as a bZIP dimer and activates target-gene transcription in response to
    cAMP/PKA, calcium and growth-factor signals.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0141156
    label: cAMP/PKA signal transduction
  locations:
  - id: GO:0000785
    label: chromatin
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: file:rat/Creb1/Creb1-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Phosphorylation-dependent transcription factor that stimulates transcription upon
      binding to the DNA cAMP response element (CRE), a sequence present in many viral and cellular promoters
  - reference_id: PMID:12409294
    supporting_text: the CRE-decoy blocked GLU-induced accumulation of Per1 mRNA
- description: Sequence-specific binding of cAMP response elements (TGACGTCA) and CRE half-sites through
    the bZIP basic region.
  molecular_function:
    id: GO:0035497
    label: cAMP response element binding
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:21367864
    supporting_text: indicates constitutive CREB binding to this sequence
  - reference_id: PMID:16891311
    supporting_text: Electrophoresis mobility supershift assays indicated that CRE-binding protein 1 (CREB1)
      and Smad3 were the major components present in this TGFbeta-inducible complex.
- description: Phospho-Ser-119 kinase-inducible domain binds the KIX domain of CBP/p300, recruiting coactivator
    acetyltransferase activity to CRE-bound promoters.
  molecular_function:
    id: GO:0001223
    label: transcription coactivator binding
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:9413984
    supporting_text: The nuclear factor CREB activates transcription of target genes in part through direct
      interactions with the KIX domain of the coactivator CBP in a phosphorylation-dependent manner.
suggested_questions:
- question: Is the mitochondrial matrix pool of CREB1 reproducible with modern fractionation (ER/nuclear
    contamination controls, protease protection), and does it regulate mtDNA transcription in vivo?
- question: Does PMID:16687181 support an IMP code for memory, or should the RGD row be IEP given that
    only pCREB correlations with D1 ligands were measured?
- question: Which CREB1 target genes mediate the opposing pro-survival (Bcl-2) and pro-apoptotic (DNA-damage,
    autophagy-defective cells) outputs, and what determines the switch?
suggested_experiments:
- description: Mitochondria-targeted versus nuclear-restricted CREB1 rescue in Creb1-deficient rat neurons,
    measuring mtDNA-encoded transcripts and complex I respiration, to test whether mitochondrial CREB1
    has a function separable from nuclear target genes.
  experiment_type: genetic rescue
- description: CUT&RUN for CREB1 and phospho-Ser-119 CREB1 in rat pineal gland across the day/night cycle,
    to map which CRE and CRE half-site loci are occupied constitutively versus phosphorylation-regulated.
  experiment_type: chromatin profiling
