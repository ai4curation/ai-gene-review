id: P15337
gene_symbol: Creb1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Creb1 (cAMP-responsive element-binding protein 1) is a nuclear bZIP transcription factor
  that binds, as a dimer, to cAMP response elements (CRE, TGACGTCA) and CRE half-sites in the promoters
  of many cellular genes. An N-terminal kinase-inducible domain (KID) is phosphorylated on Ser-119 (Ser-133
  in the alpha isoform) by PKA, CaM kinases, RSK/MSK and AKT in response to cAMP, calcium, neurotrophin
  and growth-factor signals; phospho-KID binds the KIX domain of the coactivators CBP/p300, and CRTC/TORC
  coactivators enhance activity independently of phosphorylation. Through target genes such as Per1, c-fos,
  Bdnf, Bcl-2 and TGF-beta isoforms, Creb1 mediates stimulus-dependent transcription that underlies neuronal
  survival, synaptic plasticity and long-term memory, light entrainment of the circadian clock, endocrine
  and metabolic gene programmes, and cell proliferation and differentiation in many tissues. A minor pool
  has been reported in axons (locally translated and retrogradely transported) and in the mitochondrial
  matrix.
