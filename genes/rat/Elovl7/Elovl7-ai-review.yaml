- term:
    id: GO:0030148
    label: sphingolipid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: This IBA annotation propagates a sphingolipid biosynthesis role across
      the ELOVL family, but ELOVL7's measured substrate preference argues against
      a dedicated sphingolipid (ceramide) role for this paralog. Sphingolipids characteristically
      incorporate very-long-chain fatty acids (C22-C26 and longer), whereas purified
      ELOVL7 is most active toward C18 acyl-CoAs over a C16-C20 range and shows little
      or no activity toward C22-C26 saturated acyl-CoAs. The VLCFAs destined for sphingolipid/ceramide
      synthesis are predominantly produced by other ELOVL paralogs (e.g., ELOVL1/ELOVL4).
      This is therefore best treated as a family-level over-annotation rather than
      a specific ELOVL7 function.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IBA-propagated sphingolipid biosynthesis role does not match ELOVL7's
      C16-C20 (C18-preferring) substrate specificity; the long-chain substrates characteristic
      of sphingolipids are elongated mainly by other ELOVL paralogs.
    supported_by:
    - reference_id: UniProtKB:D4ADY9
      supporting_text: Little or no activity toward C22:0-, C24:0-, or C26:0-CoAs.
    - reference_id: file:rat/Elovl7/Elovl7-deep-research-falcon.md
      supporting_text: In purified-enzyme assays (reconstituted into proteoliposomes),
        mammalian ELOVL7 shows activity toward **C16–C20** acyl‑CoA substrates, with
        the **highest activity toward C18 substrates**, and comparatively little/no
        activity toward longer saturated substrates (e.g., **C22–C26** saturated acyl‑CoAs)
        under the tested conditions.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000125390
        source_label: PANTHER:PTN000125390
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: In the current PTHR11157 PAINT slice the GO:0030148 IBD at this deep
          family node is seeded exclusively by sphingolipid-dedicated members - human
          ELOVL1 (Q9BW60), a mouse Elovl member, two budding-yeast ELO genes and two
          Candida CGD entries - with no ELOVL7 ortholog among the seeds. Those members
          elongate the C22-C26 substrates that sphingolipids incorporate; ELOVL7's
          measured C16-C20 (C18-preferring) range means the sphingolipid role does
          not follow for the rat gene, even though the same node correctly anchors
          the elongase activity and elongation-process IBDs that Elovl7 does inherit
          (GO:0009922, GO:0019367, GO:0034625, GO:0034626 - the latter three seeded
          in part by rat RGD members).
