id: D4ADY9
gene_symbol: Elovl7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Elovl7 encodes rat elongation of very long chain fatty acids protein 7, a
  multi-pass endoplasmic reticulum membrane condensing enzyme (3-ketoacyl-CoA synthase)
  of the ELO family. It catalyzes the first and rate-limiting step of the microsomal fatty
  acid elongation cycle, condensing an acyl-CoA with malonyl-CoA to form a 3-ketoacyl-CoA
  two carbons longer, which the downstream reductases and dehydratase convert to the elongated
  acyl-CoA. Based on its characterized human ortholog, Elovl7 prefers C18 acyl-CoAs, especially
  C18:3(n-3) and C18:3(n-6), and also elongates C16:0-, C18:0-, C18:1-, C18:2- and C20:4-CoAs,
  with little or no activity toward C22-C26 saturated acyl-CoAs. It therefore supplies
  C20-C22 saturated, monounsaturated and polyunsaturated fatty acids used as precursors
  of membrane lipids and lipid mediators. It forms homodimers and associates with the elongation-cycle
  reductase TECR.
