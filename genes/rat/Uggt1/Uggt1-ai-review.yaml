  label: Rattus norvegicus
description: 'Uggt1 (UGGT1; UniProt Q9JLA3) encodes the rat UDP-glucose:glycoprotein
  glucosyltransferase 1, a ~170 kDa endoplasmic reticulum (ER) luminal glycoprotein-folding
  sensor and quality-control enzyme. It transfers a single glucose residue from UDP-glucose
  onto deglucosylated N-linked glycans (Man7-9GlcNAc2; e.g. Man9GlcNAc2 -> Glc1Man9GlcNAc2)
  on glycoproteins that have not reached a native conformation. This reglucosylation
  regenerates the monoglucosylated tag recognized by the lectin chaperones calnexin/calreticulin,
  driving the calnexin/calreticulin (CNX/CRT) folding cycle: non-native clients are
  retained for further folding attempts and prevented from premature ER exit. UGGT1
  acts as a conformation sensor, preferentially recognizing non-native glycoproteins
  with exposed hydrophobic surfaces, and it can delay entry of unstable/misfolded
  clients into glycoprotein ER-associated degradation (gpERAD), competing with EDEM/mannose-trimming
  pathways. Catalysis requires Ca2+ coordinated by a DxD motif. UGGT1 is the dominant
  cellular glucosyltransferase of this system and forms a stable complex with the
  selenoprotein SELENOF (SEP15), a redox-active cochaperone.'
