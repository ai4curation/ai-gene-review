    label: protein folding
  evidence_type: TAS
  original_reference_id: PMID:12518055
  review:
    summary: UGGT1 contributes to protein folding indirectly, by reglucosylating non-native
      glycoproteins so they re-engage the calnexin/calreticulin lectin chaperones
      for additional folding rounds and avoid premature ER exit. The generic 'protein
      folding' term captures this only at a high level; the precise role is the glycan-dependent
      quality-control/folding cycle described in the falcon synthesis. Replaced by
      the compartment-specific GO:0034975 (protein folding in endoplasmic reticulum),
      which states the same involvement at the right scope.
    action: MODIFY
    reason: UGGT1 does not directly fold proteins; it drives the lectin-chaperone
      folding cycle in the ER lumen. The generic 'protein folding' term is broad relative
      to that mechanism and is not compartment-specific; GO:0034975 (protein folding
      in endoplasmic reticulum) states the same involvement at the right scope and
      is the term this review carries in core_functions.
    proposed_replacement_terms:
    - id: GO:0034975
      label: protein folding in endoplasmic reticulum
