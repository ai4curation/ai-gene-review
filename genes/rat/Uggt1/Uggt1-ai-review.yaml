- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: UGGT1 is a conformation sensor that selectively recognizes and binds
      non-native/partially folded glycoproteins (preferring exposed hydrophobic surfaces)
      as the recognition step preceding reglucosylation. That recognition is real
      and directly assayed (GO:0051082 IDA from PMID:10764828), but it is the substrate-selection
      step of the glucosyltransferase rather than a standalone chaperone-like binding
      function, and GO:0051082 is now formally obsolete with no replacement that fits
      a glycoprotein quality-control sensor - so the term over-annotates the gene.
    action: MARK_AS_OVER_ANNOTATED
    reason: Recognition/binding of non-native glycoprotein clients is real, but it
      is the substrate-selection step intrinsic to UGGT1's glucosyltransferase activity
      rather than a standalone chaperone-like binding function. GO:0051082 has been
      formally obsoleted in the ontology (OLS returns the label "obsolete unfolded
      protein binding", with the stated reason that binding terms of this kind should
      be replaced by an activity term such as GO:0044183 or GO:0140309); neither replacement
      fits a glycoprotein quality-control sensor. This restores the project-level
      call in projects/UNFOLDED_PROTEIN_BINDING.md, which records rat Uggt1 (Q9JLA3)
      as OVER_ANNOTATED for this term with no suitable replacement ("not chaperones").
      The IBA is additionally stale — the current PANTHER PAINT release no longer
      carries an IBD for GO:0051082 in PTHR11226.
      GOA no longer carries this IBA row.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTHR11226
        source_label: UDP-glucose glycoprotein glucosyltransferase family (PAINT)
        source_status: SOURCE_STALE_OR_MISSING
        comment: No IBD for GO:0051082 remains in the current PTHR11226 PAINT slice
          (snapshot 20260528); the remaining IBDs at PTN000132051 are GO:0003980,
          GO:0005783, and GO:0006487 only. GO:0051082 (unfolded protein binding) has
          been formally obsoleted in the ontology, which likely explains its removal
