core_functions:
- description: ER luminal folding sensor that reglucosylates non-native glycoproteins
    to regenerate the monoglucosylated N-glycan tag, driving the calnexin/calreticulin
    quality-control cycle. Client selection is conformation-sensing — non-native and
    partially folded glycoproteins with exposed hydrophobic surfaces are preferred
    over folded ones — and this recognition step is intrinsic to the transferase activity
    rather than a separate chaperone-like binding function.
  supported_by:
  - reference_id: file:rat/Uggt1/Uggt1-deep-research-falcon.md
    supporting_text: UGGT1 is a **reglucosylating glycosyltransferase** that transfers
      a **glucose residue from UDP-glucose** onto **deglucosylated N-linked glycans**
      on glycoproteins that have not reached a native conformation.
    reference_section_type: OTHER
