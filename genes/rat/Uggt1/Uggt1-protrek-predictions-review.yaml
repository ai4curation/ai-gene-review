  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    summary: >-
      Rank 2 (score 17.55). Glycoprotein 2-beta-D-xylosyltransferase (EC 2.4.2.38) is a Golgi enzyme
      of plants and invertebrates that adds beta1,2-xylose to the N-glycan core from UDP-xylose. UGGT1
      is a glycosyltransferase family 8 enzyme of the ER lumen that adds glucose from UDP-glucose.
      Wrong sugar donor, wrong acceptor position, wrong compartment, wrong enzyme family, and in the
      rat the reaction does not occur at all. Scored MORE_SPECIFIC against GOA's generic transferase
      activity, so ontology closure would count it as a refinement.
    supported_by:
