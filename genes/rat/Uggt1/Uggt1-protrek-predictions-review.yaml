status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for rat Uggt1. Rank 1 is the strongest single call in the rat
  set - the exact core molecular function at 20.43, with experimental GOA support - and it is a genuinely
  specific enzyme term rather than a generic transferase. Below it the retrieval spreads across unrelated
  glycosyltransferase specificities (rank 2 a plant/invertebrate xylosyltransferase, rank 4 MGAT1's
  N-acetylglucosaminyltransferase activity): having identified 'glycosyltransferase acting on N-glycans',
  it cannot hold the particular reaction. Missing from the top five is the second curated core function,
  unfolded protein binding (GO:0051082, IDA) - the conformation-sensing step that makes UGGT1 a folding
  sensor rather than an ordinary transferase, and the reason it sits in the calnexin/calreticulin
  cycle at all. Assessment: 2 correct not novel (CNN), 1 nonparalog incorrect (NPI).
