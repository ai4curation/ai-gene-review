- term:
    id: GO:0002031
    label: G protein-coupled receptor internalization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001370087
  - UniProtKB:P32121
  - UniProtKB:P49407
  review:
    summary: GPCR internalization via clathrin-coated pits is a core process of beta-arrestin-2.
    action: ACCEPT
    reason: Beta-arrestin-2 is the clathrin/AP-2 cargo adaptor for agonist-occupied GPCRs; rat-cell RNAi
      and dominant-negative experiments show it drives endocytosis of the alpha1B-AR and mu-opioid receptor.
      The IBA node (PTN001370087) covers the beta-arrestin clade, and this gene sits inside it.
    supported_by:
    - reference_id: UniProtKB:P29067
      supporting_text: The beta-arrestins target many receptors for internalization by acting as endocytic
        adapters (CLASPs, clathrin-associated sorting proteins) and recruiting the GPRCs to the adapter
        protein 2 complex 2 (AP-2) in clathrin-coated pits (CCPs).
    - reference_id: PMID:18523139
      supporting_text: RNA interference showed that beta-arrestin 2 plays a prominent role in alpha1b-AR
        endocytosis.
    - reference_id: PMID:16120787
      supporting_text: endocytosis induced by both ligands was inhibited by a dominant-negative mutant
        version of arrestin-3 (beta-arrestin-2).
