id: P29067
gene_symbol: Arrb2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Beta-arrestin-2 (arrestin-3) is a cytosolic adaptor protein of the arrestin family, abundant
  in neurons and spleen. After agonist activation and GRK phosphorylation of a G protein-coupled receptor,
  beta-arrestin-2 is recruited from the cytoplasm to the plasma membrane and binds the receptor. Binding
  sterically blocks G protein coupling, which desensitizes the receptor. Through C-terminal clathrin-
  and AP-2-binding motifs it acts as a clathrin-cargo adaptor that concentrates receptors in clathrin-coated
  pits for internalization. Class B receptors such as AT1R and V2R remain bound and travel with it to
  endosomes. Beta-arrestin-2 also serves as a signalling scaffold: it assembles receptor-associated ERK1/2
  (and JNK3) modules and an AKT/PP2A complex, giving G protein-independent signals that in rat vascular
  smooth muscle cells, neurons, astrocytes and fibroblasts promote ERK activation, survival (BAD inactivation),
  proliferation and matrix synthesis. Additional adaptor roles include binding E3 ligases (MDM2, and ITCH
  via ARRDC1) to control ubiquitination of partner proteins, restraining TRAF6/NF-kappa-B signalling,
  and contributing to Smoothened trafficking to the primary cilium. In the nervous system it limits opioid
  receptor signalling, and knockdown enhances morphine analgesia.'
