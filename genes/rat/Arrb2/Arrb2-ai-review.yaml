  review:
    summary: Beta-arrestin-2 is the endocytic adaptor itself, so it participates in GPCR internalization
      rather than regulating it from outside.
    action: MODIFY
    reason: Dominant-negative arrestin-3 blocked morphine- and DAMGO-induced mu-opioid receptor endocytosis
      in rat striatal neurons. Because beta-arrestin-2 performs the cargo-adaptor step, GPCR internalization
      (GO:0002031, already accepted for this gene) is the better term than positive regulation of receptor
      internalization.
