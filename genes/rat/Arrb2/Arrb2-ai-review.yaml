core_functions:
- description: Binds agonist-activated, GRK-phosphorylated G protein-coupled receptors at the plasma membrane
    and sterically blocks their coupling to heterotrimeric G proteins, desensitizing receptor signalling.
  molecular_function:
    id: GO:0001664
    label: G protein-coupled receptor binding
  directly_involved_in:
  - id: GO:0002029
    label: desensitization of G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1517224
    supporting_text: beta-Arrestin2 was equipotent to beta-arrestin1 and specifically inhibited beta 2AR
      function.
  - reference_id: UniProtKB:P29067
    supporting_text: During homologous desensitization, beta-arrestins bind to the GPCR-phosphorylated
      receptor and sterically preclude its coupling to the cognate G protein
  - reference_id: PMID:16899567
    supporting_text: FSH induces the recruitment of the endogenous GRK 2 and beta-arrestin 1/2 from the
      cytoplasm to the plasma membrane of rat primary Sertoli cells.
- description: 'Clathrin-cargo adaptor: links bound GPCRs to clathrin and the AP-2 adaptor complex in
    clathrin-coated pits, driving receptor internalization; class B receptor-arrestin complexes persist
    on endosomes.'
  molecular_function:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  directly_involved_in:
  - id: GO:0002031
    label: G protein-coupled receptor internalization
  locations:
  - id: GO:0005905
    label: clathrin-coated pit
  - id: GO:0005768
    label: endosome
  supported_by:
  - reference_id: UniProtKB:P29067
    supporting_text: The beta-arrestins target many receptors for internalization by acting as endocytic
      adapters (CLASPs, clathrin-associated sorting proteins) and recruiting the GPRCs to the adapter
      protein 2 complex 2 (AP-2) in clathrin-coated pits (CCPs).
  - reference_id: PMID:15498833
    supporting_text: c-Src stabilizes the agonist-independent association between beta-arrestin2 and the
      beta-subunit of AP-2 independently of the kinase activity of c-Src.
  - reference_id: PMID:18523139
    supporting_text: RNA interference showed that beta-arrestin 2 plays a prominent role in alpha1b-AR
      endocytosis.
- description: 'Signalling scaffold: assembles receptor-associated ERK1/2 modules (and AKT complexes)
    for G protein-independent, arrestin-dependent signalling that promotes ERK1/2 activation downstream
    of GPCRs such as AT1R, D1, kappa-opioid and PAF receptors.'
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0070374
    label: positive regulation of ERK1 and ERK2 cascade
  locations:
  - id: GO:0030139
    label: endocytic vesicle
  supported_by:
  - reference_id: UniProtKB:P29067
    supporting_text: Acts as a signaling scaffold for MAPK pathways such as MAPK1/3 (ERK1/2) and MAPK10
      (JNK3).
  - reference_id: PMID:19254952
    supporting_text: Activation by both ligands is diminished by depletion of beta-arrestin2 by small
      interfering RNA, although the effect is more complete with SII.
  - reference_id: PMID:19200235
    supporting_text: In pERK immunoprecipitated extracts, β-arrestin2 was detected in a dose-dependent
      manner
suggested_questions:
- question: Which reference did RGD intend for the GO:0019904 protein domain specific binding row with
    the D2 dopamine receptor (cited as PMID:12890920, a dystrophin paper)?
- question: What evidence underlies the GO:1904037 positive regulation of epithelial cell apoptotic process
    IMP row citing PMID:24719556, which contains no epithelial apoptosis data?
- question: The rat beta-arrestin-2 hinge carries an ERK regulatory motif (PET178P) absent from human
    beta-arrestin-2 (PMID:25016018). How much do rodent findings on endosomal receptor/arrestin-2 complex
    stability transfer to human?
suggested_experiments:
- description: Compare endosomal GPCR/beta-arrestin-2 complex lifetime and sustained ERK signalling in
    rat cells expressing wild-type, T178A and T178D beta-arrestin-2 with endogenous protein knocked out.
  hypothesis: ERK phosphorylation at the rodent-specific T178 site controls the stability of endosomal
    receptor-arrestin complexes and the duration of arrestin-dependent signalling.
