  review:
    summary: Binding to activated, GRK-phosphorylated GPCRs is the defining molecular activity of beta-arrestin-2.
    action: ACCEPT
    reason: Transferred from human ARRB2; the rat protein has direct evidence for binding many GPCRs (AT1R,
      alpha1B-AR, D1, FSHR, PAFR). GPCR binding is the core interaction underlying desensitization, internalization
      and arrestin-dependent signalling.
