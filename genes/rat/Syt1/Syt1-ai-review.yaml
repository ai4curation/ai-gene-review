gene_symbol: Syt1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Synaptotagmin-1 (p65) is a single-pass integral membrane protein of synaptic vesicles and neuroendocrine dense-core
  vesicles, with a short intravesicular N-terminus, one transmembrane helix, a juxtamembrane linker and two cytoplasmic C2
  domains (C2A, C2B). The C2 domains bind Ca2+ (about five ions in total) and, in a Ca2+-dependent manner, insert into membranes
  containing anionic phospholipids (phosphatidylserine, PIP2) and bind the neuronal t-SNAREs and assembled SNARE complex.
  Through these interactions Syt1 tethers vesicles to the presynaptic plasma membrane, clamps premature fusion, and on Ca2+
  influx triggers SNARE-mediated fusion, acting as the principal Ca2+ sensor for fast synchronous neurotransmitter release;
  it also contributes to dense-core vesicle exocytosis in neuroendocrine cells. Secondary roles include binding the AP-2 and
  stonin-2 endocytic adaptors for its own retrieval during synaptic vesicle endocytosis, Ca2+-promoted self-association, and
  serving as a host receptor for botulinum neurotoxins B and G.
