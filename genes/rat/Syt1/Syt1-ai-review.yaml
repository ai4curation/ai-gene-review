suggested_questions:
- question: Should the RGD calcium activated phospholipid scrambling (GO:0061588) rows be retired, given that the cited papers
    report lateral PS demixing and dependence on inter-membrane PS asymmetry rather than transbilayer movement?
- question: What is the evidence behind the human SYT1 low-density lipoprotein particle receptor binding annotation propagated
    to rat Syt1?
- question: Is the Ca2+-triggered oligomerisation / juxtamembrane-linker phase separation of Syt1 required for its Ca2+-sensor
    function in vivo, or a regulatory modulation of it?
suggested_experiments:
- description: Test whether linker-LLPS-deficient Syt1 mutants that preserve membrane and SNARE binding rescue synchronous
    release and spontaneous-release clamping in Syt1-knockout neurons.
