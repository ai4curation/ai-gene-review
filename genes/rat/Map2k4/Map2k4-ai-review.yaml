core_functions:
- description: 'Dual-specificity MAP2K of the JNK cascade: activated by stress-responsive MAP3Ks, MKK4 docks JNK1-3 through
    its N-terminal D-site and phosphorylates the JNK Thr-Pro-Tyr activation motif (preferring the tyrosine), cooperating with
    MKK7 for full JNK activation.'
  molecular_function:
    id: GO:0008545
    label: JUN kinase kinase activity
  directly_involved_in:
  - *id001
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id005
  - *id011
  - *id003
  - *id010
- description: MKK4 also phosphorylates and activates p38 MAPKs, docking them through the same D-site; in rat tissues this
    contribution is stimulus-dependent and minor relative to MKK3/MKK6 (not engaged in cardiac ischaemia).
  molecular_function: *id007
  directly_involved_in:
  - *id002
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id008
  - *id004
  - *id015
  - *id018
suggested_questions:
- question: Is the mouse Map2k4 IMP to neuromuscular junction development (PMID:10521398, with Erbb2 allele MGI:1929071) intended
    for Erbb2? If so, the mouse and rat ISO rows should be moved or deleted.
- question: Does the mouse IDA of Map2k4 to ERBB signaling pathway (PMID:8702681) actually assay MKK4, or the ERK-pathway
    MEK described in the abstract?
- question: Should the mouse/rat motoneuron apoptosis annotations from PMID:25100604 be positive rather than negative regulation,
    given that MKK4 loss protects motoneurons from axotomy-induced death?
- question: Under which stimuli does rat MKK4 make a non-redundant contribution to p38 activation, given that it is not engaged
    during cardiac ischaemia?
suggested_experiments:
- description: Kinase-dead Map2k4 knock-in or acute degradation in rat cardiomyocytes and neurons, combined with Map2k7 loss,
    to quantify MKK4-specific JNK Tyr185 and p38 phosphorylation across osmotic, oxidative and ischaemia/reperfusion stimuli.
