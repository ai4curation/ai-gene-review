id: A0ABK0L269
gene_symbol: Map2k4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Map2k4 (MKK4, SEK1, JNKK1, MEK4) encodes a dual-specificity protein kinase of the STE group that forms, with
  MKK7, the MAP kinase kinase tier of the stress-activated JNK cascade and also contributes to p38 MAPK activation. Activated
  by MAP3Ks such as MEKK1, ASK1 and the mixed-lineage kinases, it docks JNK1-3 and p38 through an N-terminal D-site and phosphorylates
  the Thr-Pro-Tyr activation motif of JNK (preferring the tyrosine) and the TGY motif of p38; it does not activate ERK. In
  rat cells and tissues MKK4 is activated by hyperosmotic stress and by cerebral ischaemia/reperfusion, but not by cardiac
  ischaemia, where p38 is instead activated by MKK3/MKK6. It is a soluble cytoplasmic kinase found throughout neurons (cell
  bodies, dendrites and axons). Through JNK and c-Jun it relays signals that promote neuronal and hepatoma cell apoptosis,
  motoneuron death after axotomy, agonist-induced cardiomyocyte hypertrophy and hepatocyte proliferation.
