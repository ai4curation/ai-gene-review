- term:
    id: GO:0061891
    label: calcium ion sensor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:99667
  - PANTHER:PTN000001283
  - RGD:3803
  - WB:WBGene00004921
  - WB:WBGene00004923
  review:
    summary: IBA calcium ion sensor activity from the synaptotagmin family node.
    action: REMOVE
    reason: Rat Syt4 has diverged from the Ca2+-sensor function of the family. Its C2A has the inactivating Asp-to-Ser
      (Ser244) substitution (PMID:9162066), and its C2B cannot form full Ca2+-binding sites (PMID:15311271). It
      does not couple Ca2+ to fusion, and inhibits fusion with or without Ca2+ (PMID:18508778, PMID:20688915). Reverting
      S244D restores Ca2+-sensor function, which pins the loss to the substitution. Dai et al. state explicitly
      that Syt4 is a Ca2+ sensor in the fly but not in the rat. This is an over-propagated IBA argued against on
      target-specific grounds.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN000001283
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ca2+-sensor activity is seeded by Syt1/Syt2-type isoforms and invertebrate orthologs; the mammalian
          Syt4/Syt11 subclade has lost it.
      - source_id: RGD:3803
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Syt1 is a bona fide Ca2+ sensor; this does not transfer to rat Syt4.
    supported_by:
    - reference_id: PMID:15311271
      supporting_text: These results indicate that synaptotagmin 4 is a Ca(2+) sensor in the fly but not in the
        rat
    - reference_id: PMID:20688915
      supporting_text: In summary, rat SYT4 serves as an inhibitory isoform, whereas fly SYT4 is a bona fide Ca(2+)
