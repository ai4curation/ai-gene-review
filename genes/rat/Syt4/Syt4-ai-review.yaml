taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Synaptotagmin-4 (Syt IV) is a single-pass membrane protein of the synaptotagmin family, with a short
  intravesicular N-terminus and two cytoplasmic C2 domains. It is an activity-induced immediate early gene in neurons
  and neuroendocrine cells. Unlike Ca2+-sensing synaptotagmins, rat Syt4 has lost Ca2+ binding: its C2A carries
  an Asp-to-Ser (Ser244) substitution of a Ca2+ ligand and its C2B cannot form full Ca2+ sites, so it shows no Ca2+-dependent
  phospholipid binding. Syt4 binds syntaxins and t-SNARE heterodimers Ca2+-independently, inhibits SNARE-catalysed
  membrane fusion and competes with Ca2+-sensing synaptotagmins such as Syt1, Syt7 and Syt9. In cells it acts as
  a negative regulator of Ca2+-triggered dense-core vesicle exocytosis, including catecholamine and BDNF release,
  and it shapes fusion pores. On immature secretory granules it binds syntaxin 6 and is needed for their homotypic
  fusion and maturation. On neuronal dense-core vesicles it binds the kinesin KIF1A. Phosphorylation of Ser135 by
  JNK weakens this interaction, so dense-core vesicles are released from microtubule transport and captured at synapses.
  Syt4 is also found at the Golgi, in dendrites, axons and astrocyte processes, where it supports Ca2+-dependent
  glutamate release.'
