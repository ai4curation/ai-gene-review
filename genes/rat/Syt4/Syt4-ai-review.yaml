  review:
    summary: Co-flotation shows weak, Ca2+-independent binding of Syt IV to PS-containing liposomes; contradicted
      by later co-sedimentation data.
    action: UNDECIDED
    reason: Full text read. Bhalla et al. found that all isoforms tested, Syt IV included, show some PS and t-SNARE
      binding without Ca2+, and that Ca2+ does not enhance it for Syt IV. A later co-sedimentation study from the
      same lab found no PS binding by rat SYT4 with or without Ca2+ (PMID:20688915), and Dai et al. found no efficient
      phospholipid binding (PMID:15311271). The weak Ca2+-independent binding is an experimental observation the
      curator correctly captured. The two assays from the same laboratory disagree on whether rat Syt4 binds PS
      at all in the absence of Ca2+, and the evidence does not settle it, so this is left undecided. Both agree
      that Ca2+-dependent PS binding, the effector interaction behind synaptotagmin Ca2+-sensor function, is absent
      (accepted NOT rows).
