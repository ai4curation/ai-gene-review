    summary: ISO from mouse Syt4 calcium ion binding (mouse IDA, PMID:15197251); contradicted by direct structural
      and biochemical evidence on rat Syt4.
    action: REMOVE
    reason: Mouse and rat Syt4 are nearly identical, so the question is whether Syt4 binds Ca2+ at all. Direct structural
      and biochemical work on rat Syt4 shows that neither C2 domain forms a full Ca2+-binding site (PMID:15311271),
      and C2A has the inactivating Asp-to-Ser substitution (PMID:9162066). The mouse donor is a cell-biology paper
      on glial glutamate release that treats C2B as only a putative Ca2+-binding domain. Older reports of Ca2+-promoted
      C2B oligomerisation (PMID:10397765, PMID:9830048) predate the crystal structure and did not measure Ca2+ binding
      directly. The ISO transfer contradicts the direct NOT evidence on the target (PMID:15311271, accepted), so
      it is removed.
