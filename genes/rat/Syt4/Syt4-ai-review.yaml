- term:
    id: GO:0019894
    label: kinesin binding
  evidence_type: IPI
  original_reference_id: PMID:29166604
  qualifier: enables
  supporting_entities:
  - UniProtKB:F1M4A4
  review:
    summary: 'Proposed new molecular function: Syt4 binds the kinesin-3 motor KIF1A, regulated by JNK phosphorylation
      at Ser135 and by Ca2+.'
    action: NEW
    reason: Bharat et al. show a direct Syt4-KIF1A interaction that is weakened by phosphomimetic S135E and strengthened
      by S135A, and that KIF1A transports Syt4 DCVs. Stucchi et al. independently find Syt4 among Ca2+-dependent
      KIF1A interactors and pull down mCherry-Syt4 with a KIF1A tail fragment. This is the molecular basis of the
      accepted DCV cytoskeletal transport role and replaces the bare protein-binding row (PMID:29166604). It is
      a molecular function, so the process-term bar does not apply, and it is not an ancestor or descendant of any
      other term on the gene.
    supported_by:
    - reference_id: PMID:29166604
      supporting_text: Phosphorylation of serine 135 of Syt4 by JNK steers DCV trafficking by destabilizing Syt4-Kif1A
        interaction
    - reference_id: PMID:30021165
      supporting_text: Only in the presence of calcium KIF1A(657-1698) associated with specific DCV-related proteins
        such as Syt4 and synaptotagmin 11 (Syt11)
    - reference_id: file:rat/Syt4/Syt4-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Involved in neuronal dense core vesicles (DCVs) mobility through its interaction with KIF1A.
