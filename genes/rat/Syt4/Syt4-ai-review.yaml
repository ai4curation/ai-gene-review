core_functions:
- description: Ca2+-independent SNARE (syntaxin/t-SNARE) binding on dense-core vesicle membranes, by which Syt4
    inhibits SNARE-catalysed fusion and competes with Ca2+-sensing synaptotagmins, acting as a negative regulator
    of Ca2+-triggered dense-core vesicle exocytosis.
  molecular_function:
    id: GO:0000149
    label: SNARE binding
  directly_involved_in:
  - *id004
  - *id006
  locations:
  - *id001
  supported_by:
  - reference_id: PMID:20688915
    supporting_text: Rat SYT4 strongly bound to t-SNARE heterodimers in the absence Ca2+; binding was not influenced
      by the addition of Ca2+.
  - reference_id: PMID:20688915
    supporting_text: We report that rat SYT4 inhibited SNARE-catalyzed membrane fusion in both the absence and presence
      of Ca(2+).
  - reference_id: PMID:18508778
    supporting_text: 'Thus, it appears that inhibitory isoforms of syt can impact fusion in two ways: first, they
      directly inhibit SNARE-mediated fusion, and second, they displace syt I from the fusion complex.'
  - reference_id: PMID:21551071
    supporting_text: syt IV strongly inhibited exocytosis of syt I–bearing or syt IX–bearing DCVs
- description: Syntaxin 6 binding on immature secretory granule membranes, required for homotypic fusion of immature
    secretory granules and their maturation in neuroendocrine cells.
  molecular_function:
    id: GO:0019905
    label: syntaxin binding
  directly_involved_in:
  - *id003
  - id: GO:0061792
    label: secretory granule maturation
  locations:
  - *id002
  supported_by:
  - reference_id: PMID:16618809
    supporting_text: Syt IV binds to syntaxin 6, a SNARE protein that is involved in ISG maturation
  - reference_id: PMID:16618809
    supporting_text: ISG homotypic fusion was inhibited in vivo by small interfering RNA-mediated depletion of Syt
      IV.
  - reference_id: PMID:16618809
    supporting_text: We conclude that Syt IV is an essential component for secretory granule maturation.
- description: KIF1A (kinesin-3) binding on neuronal dense-core vesicles, linking the vesicle to the motor for long-range
    microtubule transport; JNK phosphorylation of Ser135 weakens the interaction and leads to capture of the vesicles
    at synapses.
  molecular_function:
    id: GO:0019894
    label: kinesin binding
  directly_involved_in:
  - id: GO:0099519
    label: dense core granule cytoskeletal transport
  locations:
  - *id001
  supported_by:
  - reference_id: PMID:29166604
    supporting_text: Phosphorylation of serine 135 of Syt4 by JNK steers DCV trafficking by destabilizing Syt4-Kif1A
      interaction
  - reference_id: PMID:29166604
    supporting_text: indicating that Kif1A is the motor protein that transports Syt4-harboring DCVs
  - reference_id: PMID:30021165
    supporting_text: Only in the presence of calcium KIF1A(657-1698) associated with specific DCV-related proteins
      such as Syt4 and synaptotagmin 11 (Syt11)
suggested_questions:
- question: Does the Ca2+-independent PS binding of rat Syt4 seen in co-flotation (PMID:18508778), but not in co-sedimentation
    (PMID:20688915), occur on native membranes, and does it contribute to inhibition of fusion?
- question: Should NOT syntaxin binding (PMID:7791877) be restricted to Ca2+-dependent binding, given the Ca2+-independent
    syntaxin binding of Syt4 shown in later work?
- question: How does Syt4 support glucose-stimulated insulin secretion in beta-cell lines (PMID:22939844) while
    acting as an inhibitory isoform in PC12 cells and neurons?
suggested_experiments:
- description: Map the KIF1A-binding surface on Syt4 and test whether it overlaps the t-SNARE-binding surface, using
    purified proteins with S135A/S135E phosphomutants in direct binding assays.
- description: Compare wild-type and S244D Syt4 knock-in neurons for BDNF release and axonal DCV capture to separate
    the effects of the inhibitory, Ca2+-insensitive C2A from those of KIF1A binding.
