id: P02661
gene_symbol: Csn1s1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Csn1s1 encodes rat alpha-casein, the ortholog of ruminant alpha-s1-casein and a member of
  the mammal-specific calcium-sensitive casein family that arose from the secretory calcium-binding phosphoprotein
  (SCPP) gene cluster. It is a 284-residue precursor with a 15-residue signal peptide, expressed specifically
  in the lactating mammary epithelium under lactogenic hormone control and secreted into milk. The mature
  protein is an intrinsically disordered, multiply phosphorylated protein whose clustered phosphoseryl
  residues (phosphate centres) bind and sequester nanoclusters of amorphous calcium phosphate; together
  with beta- and gamma-casein and the surface-stabilizing kappa-casein it assembles into casein micelles,
  which allow milk to carry high concentrations of calcium phosphate and protein to the suckling young
  without precipitation or calcification of mammary tissue. Rat alpha-casein carries a rodent-specific
  insertion of ten tandem six-residue repeats. Loss of the orthologous mouse gene impairs secretion of
  other milk proteins and calcium phosphate and slows pup growth, indicating a role in casein micelle
  formation and in milk as a source of amino acids and minerals.
