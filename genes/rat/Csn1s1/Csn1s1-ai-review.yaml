suggested_questions:
- question: GO:0140314 calcium ion sequestering activity is an approximation for caseins, which sequester
    nanoclusters of amorphous calcium phosphate (calcium together with phosphate) via phosphate centres
    rather than free calcium ions. Should GO add a child term such as "calcium phosphate nanocluster sequestering
    activity"?
- question: Does the rodent-specific insertion of ten tandem six-residue repeats in rat alpha-casein change
    its calcium phosphate sequestering capacity or micelle behaviour compared with mouse alpha-casein?
- question: Should steroid-response IBA annotations derived from casein expression readouts (bovine explant
    data) be removed at the PAINT node for the alpha-s1 casein clade?
suggested_experiments:
- description: Measure calcium phosphate sequestration (ion activity product and nanocluster size) by
    recombinant, enzymatically phosphorylated rat alpha-casein and by its phosphate-centre peptide, with
    and without the ten-repeat insertion.
  experiment_type: in vitro biophysical assay
