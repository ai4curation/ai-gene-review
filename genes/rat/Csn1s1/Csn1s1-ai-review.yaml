- term:
    id: GO:0032355
    label: response to estradiol
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000028262
  - UniProtKB:P02662
  review:
    summary: Phylogenetic propagation of a bovine IDA based on inhibition of casein synthesis by high-dose
      steroids in bovine mammary explants.
    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000028262
        comment: Alpha-s1 casein clade node carrying the steroid-response IBD; the only experimental descendant
          evidence is the bovine explant study.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:P02662
        comment: Bovine CSN1S1 IDA from PMID:3585228, where casein synthesis was the readout of high-dose
          steroid treatment; casein is the regulated target, not an agent of the hormone response. The
          experiment is real, but as an expression readout at supraphysiological doses it is weak grounds
          for a clade-wide process assertion.
        source_status: SOURCE_WEAK_OR_INFERRED
    reason: 'The underlying observation is that steroid hormones at supraphysiological concentrations
      reduce casein synthesis and mRNA accumulation in mammary explants. Casein is the transcriptional
      readout of the hormone response; the casein protein performs no step of the cellular response to
      estradiol. Propagating this expression-level observation to the whole alpha-s1 casein clade as a
      biological process does not describe a function of the gene product. Marked over-annotated rather
      than removed or kept: the underlying bovine explant experiment is real and GO conventionally admits
      expression-level hormone responses, but the casein protein performs no step of the response; this
      matches the call made across the casein family reviews.'
    supported_by:
    - reference_id: PMID:3585228
      supporting_text: A similar inhibitory effect was also found using high levels of other steroids
        without 11 beta-hydroxyl, such as deoxycorticosterone and dehydroepiandrosterone, and to some
        extent with oestradiol-17 beta
