- id: PMID:3952000
  title: 'Evolution of the casein multigene family: conserved sequences in the 5'' flanking and exon regions.'
  findings:
  - statement: The rat alpha-casein gene has the casein exon architecture, with separate exons for the
      5' noncoding region, signal peptide and casein kinase phosphorylation sequence.
    supporting_text: The rat alpha-, beta-, gamma- and bovine alpha s1-casein genes contain similar 5'
      exon arrangements in which the 5' noncoding, signal peptide and casein kinase phosphorylation sequences
      are each encoded by separate exons.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed abstract checked; gene structure/evolution paper, supports casein identity but
      contains no localization experiment.
- id: PMID:6298707
  title: 'Sequence of rat alpha- and gamma-casein mRNAs: evolutionary comparison of the calcium-dependent
    rat casein multigene family.'
  findings:
  - statement: Rat alpha-casein has a 15-residue signal peptide and is homologous to bovine alpha-s1-casein,
      with a rodent-specific repeat insertion.
    supporting_text: Significant homology was also detected between rat alpha- and bovine alpha s1-casein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original cDNA sequence of rat alpha-casein (UniProt reference).
- id: PMID:21789179
  title: Milk lacking α-casein leads to permanent reduction in body size in mice.
  findings:
  - statement: Mouse alpha-casein knockout curtails secretion of other milk proteins and calcium phosphate
      and causes reduced pup growth.
    supporting_text: Absence of α-casein protein significantly curtails secretion of other milk proteins
      and calcium-phosphate, suggesting a role for α-casein in the establishment of casein micelles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; ortholog knockout that underlies the ISO lactation, nutrient reservoir
      and sequestering rows.
- id: PMID:23958008
  title: 'Invited review: Caseins and the casein micelle: their biological functions, structures, and
    behavior in foods.'
  findings:
  - statement: Most caseins in a micelle form stable complexes with amorphous calcium phosphate nanoclusters,
      preventing calcification and amyloidosis of the mammary gland.
    supporting_text: As a result of forming micelles, nutritious milk can be secreted and stored without
      causing either pathological calcification or amyloidosis of the mother's mammary tissue.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review (abstract only cached); family-level background.
- id: PMID:25632319
  title: A review of the biology of calcium phosphate sequestration with special reference to milk.
  findings:
  - statement: A phosphate centre is a short sequence with three or more phosphorylated residues that
      sequesters amorphous calcium phosphate.
    supporting_text: Phosphopeptides that contain three or more phosphorylated residues (usually seryl)
      in a short sequence are said to have a phosphate centre (PC).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review, full text cached; mechanism of calcium phosphate sequestration.
- id: PMID:3585228
  title: Inhibition of casein and fat synthesis and alpha-lactalbumin secretion by progesterone in explants
    from bovine lactating mammary glands.
  findings:
  - statement: High-dose progesterone and other steroids lacking an 11-beta-hydroxyl inhibit casein synthesis
      in bovine lactating mammary explants.
    supporting_text: The effect of progesterone on casein and fat synthesis, on alpha-lactalbumin secretion
      and on accumulation of casein mRNA was studied in explants from bovine lactating mammary glands
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Source of the bovine IDA rows behind the steroid-response IBAs; it measures casein synthesis
      as a hormone readout and does not show a function of the casein protein in a hormone response.
