- description: Activity-induced postsynaptic serine/threonine kinase that phosphorylates Ras/Rap regulators (SPAR,
    RasGRF1, SynGAP, PDZGEF1), targeting SPAR and RasGRF1 for ubiquitin-proteasome degradation and activating SynGAP
    and PDZGEF1, thereby suppressing Ras, stimulating Rap and driving homeostatic synaptic downscaling and spine
    shrinkage.
