id: Q9R012
gene_symbol: Plk2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Polo-like kinase 2 (Plk2, also called SNK, serum-inducible kinase) is a serine/threonine protein kinase
  of the CDC5/Polo family with an N-terminal kinase domain and two C-terminal polo-box domains that bind primed
  phosphopeptide motifs. In hippocampal neurons Plk2 is an immediate-early gene induced by synaptic activity; the
  induced protein is targeted to dendrites and dendritic spines, where it acts as a homeostatic suppressor of overexcitation.
  It phosphorylates the RapGAP SPAR (after CDK5 priming) and the RasGEF RasGRF1, marking them for ubiquitin-proteasome
  degradation (SPAR via SCF(beta-TRCP)), and phosphorylates and activates SynGAP and PDZGEF1, so that Ras activity
  falls and Rap activity rises. Independently of its kinase activity, its C-terminus binds NSF and dissociates it
  from the AMPA receptor subunit GluA2, causing loss of surface GluA2 and weakening of excitatory synapses. Together
  these actions drive synaptic scaling and activity-dependent shrinkage and loss of dendritic spines. In proliferating
  cells, as shown for human PLK2, it localizes to centrioles near the G1/S transition and its kinase activity is
  required for centriole duplication.
