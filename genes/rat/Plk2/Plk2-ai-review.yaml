suggested_questions:
- question: Does Plk2 directly phosphorylate Ser1305/Thr1309 in the SPAR DSGIDT phosphodegron, or is another kinase
    required downstream of Plk2 to create the beta-TRCP binding site?
- question: Does rat Plk2 localize to centrioles and contribute to centriole duplication in dividing neural progenitors,
    as shown for human PLK2 in cell lines?
- question: The RGD IPI rows from PMID:20802490 use protein kinase binding for adaptins and GTPase binding for dynamins;
    should these be deleted, given that adaptin binding was lost under stringent conditions and dynamin binding
    was non-specific?
suggested_experiments:
- hypothesis: Plk2 directly phosphorylates the SPAR phosphodegron.
  description: In vitro kinase assays of purified Plk2 on SPAR Act2-domain peptides (wild type, S1305A, T1309A)
    with phosphosite mapping by mass spectrometry, followed by beta-TRCP binding assays with the phosphorylated
    peptides.
  experiment_type: biochemistry / phosphoproteomics
- hypothesis: Kinase-dependent and kinase-independent (NSF) Plk2 functions make separable contributions to synaptic
    scaling.
  description: Replace endogenous Plk2 in hippocampal neurons with kinase-dead (K108M) or NSF-binding-deficient
    mutants and measure mEPSC scaling, surface GluA2 and spine size after chronic PTX treatment.
  experiment_type: genetic rescue with electrophysiology
