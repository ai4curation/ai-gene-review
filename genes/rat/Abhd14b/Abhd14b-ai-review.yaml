    reason: >-
      Rat Q6DGG1 shares 89% identity with human Q96IU4 and 96% identity with
      mouse Q8VCR7 with complete active-site conservation (PMID:31478652), and
      already carries EC 2.3.1.- and RHEA:45950 in UniProt; GO:0016407 captures
      the non-hydrolytic acetyl-transfer onto CoA pending creation of a
      dedicated CoA-dependent protein-lysine deacetylase term.
    supported_by:
    - reference_id: PMID:31478652
      supporting_text: >-
        In this paper, we annotate ABHD14B as a lysine deacetylase (KDAC),
        showing this enzyme's ability to transfer an acetyl group from a
        post-translationally acetylated lysine to coenzyme A (CoA), to yield acetyl-CoA,
        while regenerating the free amine of protein lysine residues.
    - reference_id: file:rat/Abhd14b/Abhd14b-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "PhysiologicalDirection=right-to-left; Xref=Rhea:RHEA:45950;"
- term:
    id: GO:0010906
    label: regulation of glucose metabolic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - UniProtKB:Q8VCR7
  review:
    summary: >-
      Conserved mammalian physiological role in regulating systemic and hepatic
      glucose metabolism inferred by 1:1 rodent orthology (96% identity) from
      in vivo mouse hepatic Abhd14b knockdown (PMID:35700823).
    action: NEW
    reason: >-
      Rat Q6DGG1 is 96% identical across all 210 residues to mouse Q8VCR7,
      whose in vivo hepatic knockdown disrupts systemic fasting glucose
      metabolism (PMID:35700823).
    supported_by:
    - reference_id: PMID:35700823
      supporting_text: >-
        Further, from studies in mice, we find that disruption of hepatic ABHD14B
        especially during fasting, disturbs homeostatic systemic glucose
        metabolism, and in doing so, significantly alters the organismal
        energetic status.
