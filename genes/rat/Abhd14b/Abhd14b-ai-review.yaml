- term:
    id: GO:0061733
    label: protein-lysine-acetyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:45948
  review:
    summary: >-
      Inverted RHEA2GO mapping from undirected RHEA:45948 ignoring UniProt's
      explicit PhysiologicalDirection=right-to-left (RHEA:45950, lysine
      deacetylation).
    action: REMOVE
    reason: >-
      Assigns the reverse protein-lysine acetyltransferase (KAT) reaction
      contradicted by PMID:31478652; ABHD14B acts exclusively in the
      CoA-dependent lysine deacetylase direction.
    supported_by:
    - reference_id: PMID:31478652
      supporting_text: >-
        That CoA binds more tightly to ABHD14B and accelerates the enzyme
        catalysed pNp-acetate hydrolysis reaction, and the inability of this
        enzyme to hydrolyze acetyl-CoA, suggested that ABHD14B might, contrary to
        previous speculation23, functions as a deacetylase rather than an
        acetyltransferase.
    - reference_id: file:rat/Abhd14b/Abhd14b-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "PhysiologicalDirection=right-to-left; Xref=Rhea:RHEA:45950;"
    source_defects:
    - defect_type: WRONG_TERM
      resource: GOA_EBI
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0061733
      corrected_value: GO:0016407
      corrected_label: acetyltransferase activity
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: >-
        GO_REF:0000116 maps undirected RHEA:45948 on UniProtKB:Q6DGG1 to
        GO:0061733 (protein-lysine-acetyltransferase activity), ignoring
        PhysiologicalDirection=right-to-left (RHEA:45950, CoA-dependent
        protein-lysine deacetylation).
