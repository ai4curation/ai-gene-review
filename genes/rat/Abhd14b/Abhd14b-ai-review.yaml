- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002920773
  - UniProtKB:Q96IU4
  review:
    summary: >-
      PAINT IBA from SF2 node PANTHER:PTN002920773 (seeded by human Q96IU4
      surrogate p-nitrophenyl butyrate hydrolysis in PMID:14672934).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Reflects slow in vitro hydrolysis of synthetic p-nitrophenyl esters by
      human ABHD14B, whereas physiological catalysis transfers acetyl groups
      from acetyl-lysine onto CoA to yield acetyl-CoA without hydrolyzing water
      (RHEA:45950; PMID:31478652).
    supported_by:
    - reference_id: PMID:31478652
      supporting_text: >-
        In this paper, we annotate ABHD14B as a lysine deacetylase (KDAC),
        showing this enzyme's ability to transfer an acetyl group from a
        post-translationally acetylated lysine to coenzyme A (CoA), to yield acetyl-CoA,
        while regenerating the free amine of protein lysine residues.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002920773
        source_label: PTN002920773
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Seeded on artificial p-nitrophenyl butyrate esterase activity of human
          Q96IU4 rather than physiological CoA-dependent acetyl transfer.
