id: Q6DGG1
gene_symbol: Abhd14b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Soluble cytosolic and nuclear alpha/beta-hydrolase (210 aa) that acts as a
  coenzyme A-dependent protein-lysine deacetylase (KDAC), transferring an acetyl
  group from N6-acetylated protein lysine residues onto CoA via its conserved
  Ser111-Asp162-His188 catalytic triad to produce acetyl-CoA (RHEA:45950).
  Conserved 1:1 mammalian ortholog of human ABHD14B and mouse ABHD14B, expressed
  prominently in metabolically active tissues such as kidney and liver where
  mammalian ABHD14B supports systemic fasting glucose homeostasis.
