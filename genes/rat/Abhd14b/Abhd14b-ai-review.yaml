- term:
    id: GO:0016407
    label: acetyltransferase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96IU4
  review:
    summary: >-
      CoA-dependent acetyl-transfer KDAC activity (RHEA:45950, EC 2.3.1.-)
      conserved with human ortholog ABHD14B (Q96IU4), retaining the identical
      Ser111-Asp162-His188 catalytic triad in SPSLSGMY/VYGDQDPM/GAGHPCYL motifs.
