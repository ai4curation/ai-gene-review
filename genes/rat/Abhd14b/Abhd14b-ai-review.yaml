- id: PMID:31478652
  title: Functional Annotation of ABHD14B, an Orphan Serine Hydrolase Enzyme.
  findings:
  - statement: >-
      Mammalian ABHD14B catalyzes CoA-dependent deacetylation of protein lysine
      residues to yield acetyl-CoA and resides in the cytosol and nucleus of
      metabolically active tissues.
    supporting_text: >-
      In this paper, we annotate ABHD14B as a lysine deacetylase (KDAC),
      showing this enzyme's ability to transfer an acetyl group from a
      post-translationally acetylated lysine to coenzyme A (CoA), to yield acetyl-CoA,
      while regenerating the free amine of protein lysine residues.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Defines the CoA-dependent KDAC reaction and subcellular/tissue distribution
      transferred to 1:1 rat ortholog Q6DGG1.
- id: PMID:35700823
  title: A multi-omics analysis reveals that the lysine deacetylase ABHD14B influences
    glucose metabolism in mammals.
  findings:
  - statement: >-
      Hepatic ABHD14B regulates systemic glucose metabolism in mammals during
      fasting.
    supporting_text: >-
      Further, from studies in mice, we find that disruption of hepatic ABHD14B
      especially during fasting, disturbs homeostatic systemic glucose
      metabolism, and in doing so, significantly alters the organismal
      energetic status.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes the physiological glucose-metabolic regulatory role of
      mammalian hepatic ABHD14B in closely related rodent mouse (96% identity
      to rat Q6DGG1).
