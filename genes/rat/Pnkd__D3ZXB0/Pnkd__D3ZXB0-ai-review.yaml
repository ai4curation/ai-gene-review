- term:
    id: GO:0046929
    label: negative regulation of neurotransmitter secretion
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00084480
  - UniProtKB:Q8N490
  - ensembl:ENSP00000273077
  review:
    summary: >-
      Core neuronal role of PNKD-L, established in mouse and with human constructs.
      PNKD-L binds the active-zone proteins RIM1 and RIM2. Overexpressed PNKD halves
      synaptic-vesicle exocytosis, and disease mutants are less effective. Pnkd knockout
      mice have lower RIM levels and impaired synaptic strength.
    action: ACCEPT
    reason: >-
      Experimental support comes from the human IMP and mouse IGI annotations from Shen et
      al. (2015). The rat gene is the 1:1 ortholog in PANTHER SF116, and D3ZXB0 contains
      the PNKD-L sequence, including the C-terminal epitope used to immunoprecipitate the
      mouse protein. In that study the exocytosis assay was run in cultured rat
      hippocampal neurons, but with exogenous PNKD constructs, so endogenous rat Pnkd
      function has not been measured. The term describes regulation of release, which is
      the level the evidence supports.
    supported_by:
    - reference_id: PMID:25730884
      supporting_text: Overexpressed PNKD protein suppresses release, and mutant PNKD protein
        is less effective than wild-type at inhibiting exocytosis.
    - reference_id: PMID:25730884
      supporting_text: In PNKD KO mice, RIM1/2 protein levels are reduced and synaptic strength
        is impaired.
