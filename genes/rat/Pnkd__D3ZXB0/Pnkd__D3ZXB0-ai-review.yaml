- term:
    id: GO:0004416
    label: hydroxyacylglutathione hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017782
  review:
    summary: >-
      InterPro2GO transfer of the HAGH-specific reaction to a PNKD-subfamily protein.
      The metallo-beta-lactamase fold and binuclear zinc site are conserved, which
      supports a thiolester hydrolase activity, but S-D-lactoylglutathione is not a
      physiological substrate of PNKD-L.
    action: MODIFY
    reason: >-
      In PAINT for PTHR11935 the curator placed GO:0016790 thiolester hydrolase activity
      at the root node PTN004322580, which reaches the PNKD-related subfamily SF116 (human
      Q8N490 and mouse Q69ZP3 both carry that IBA). GO:0004416 was placed at PTN000232795,
      a node that does not include the PNKD branch. Treat that omission as deliberate. It
      matches the biochemistry: human PNKD-L hydrolyses SLG only at a trace rate, and a
      PNKD-L transgene does not rescue HAGH-null flies. D3ZXB0 is the rat ortholog in
      SF116 and conserves all seven Zn(2+) ligands, so the parent activity is the
      defensible term. It is inferred by orthology and has not been measured on the rat
      protein.
    proposed_replacement_terms:
    - id: GO:0016790
      label: thiolester hydrolase activity
