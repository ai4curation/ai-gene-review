core_functions:
- description: >-
    Probable zinc-dependent thiolester hydrolase of the PNKD-related glyoxalase-II
    subfamily. Inferred by orthology (PANTHER SF116, PAINT root IBD) and by conservation
    of all seven Zn(2+) ligands. The characterized human PNKD-L ortholog has only trace
    activity on S-D-lactoylglutathione, and the physiological substrate is unknown. Not
    measured on the rat protein.
  molecular_function:
    id: GO:0016790
    label: thiolester hydrolase activity
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:21487022
    supporting_text: PNKD-L has extremely low but consistent SLG hydrolysis activity
  - reference_id: file:rat/Pnkd__D3ZXB0/Pnkd__D3ZXB0-bioinformatics/RESULTS-d3zxb0.md
    supporting_text: '| 253 | D | 292 | D |'
  - reference_id: file:rat/Pnkd__D3ZXB0/Pnkd__D3ZXB0-uniprot.txt
    supporting_text: PANTHER; PTHR11935:SF116; HYDROLASE PNKD-RELATED; 1.
- description: >-
    Presynaptic restraint of synaptic-vesicle exocytosis through association with the
    active-zone scaffolds RIM1 and RIM2. Established for the mouse and human orthologs
    (PNKD-L) and transferred to rat by 1:1 orthology. Endogenous rat Pnkd has not been
    tested.
  directly_involved_in:
  - id: GO:0046929
    label: negative regulation of neurotransmitter secretion
  locations:
  - id: GO:0099523
    label: presynaptic cytosol
  supported_by:
  - reference_id: PMID:25730884
    supporting_text: We propose a model wherein PNKD stabilizes RIM and inhibits the RIM-dependent
      pathway to suppress presynaptic neurotransmitter release.
suggested_questions:
- question: Is the long PNKD product mitochondrial (inner membrane, after MTS cleavage) or
    plasma-membrane/synaptic, and does the 39-residue hydrophobic exon present in D3ZXB0
    (but absent from the 385-residue PNKD-L) change its targeting?
- question: What is the physiological alpha-hydroxythioester (or other thioester) substrate
    of PNKD, and is the hydrolase activity needed for its presynaptic role?
- question: Is the rat D3ZXB0 (mouse isoform 3-type) transcript the major brain product
    in rat, compared with the 385-residue PNKD-L-type and the MR-1S/MR-1M products?
suggested_experiments:
- description: Purify rat D3ZXB0 and a 385-residue PNKD-L construct, measure zinc
    content and thioesterase activity on a panel of alpha-hydroxythioesters, and run
    untargeted metabolomics on Pnkd-null rodent brain to identify the substrate that
    accumulates.
- description: Do isoform-resolved localization of endogenous rat Pnkd in brain
    (subcellular fractionation with mitochondrial inner-membrane and synaptosomal markers,
    plus immuno-EM) using isoform-specific antibodies or epitope knock-ins.
