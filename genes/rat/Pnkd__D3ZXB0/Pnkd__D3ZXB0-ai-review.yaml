- term:
    id: GO:0032225
    label: regulation of synaptic transmission, dopaminergic
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:1930773
  review:
    summary: >-
      Transferred from a mouse IMP. The source is a transgenic model that carries the
      dominant human disease mutations and shows reduced striatal extracellular dopamine.
      That is a phenotype of a pathogenic allele, not evidence that PNKD performs part of
      dopaminergic transmission.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The mouse curator used a weak qualifier, acts_upstream_of_or_within. The underlying
      model expresses A7V/A9V mutant Pnkd, and the dopamine changes are a circuit-level
      outcome downstream of the presynaptic role. The mechanistic process supported for
      PNKD is negative regulation of neurotransmitter secretion through RIM, which applies
      to synapses generally and is not specific to dopamine. Transferring the
      allele-phenotype term to rat adds no information about what the protein does. I am
      not overruling the mouse annotation; I am marking the rat transfer as over-annotation.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:1930773
        source_label: Pnkd
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Mouse IMP (PMID:22214848) is a phenotype of a dominant disease-allele transgene (reduced striatal dopamine), not participation in dopaminergic transmission.
    supported_by:
    - reference_id: PMID:22214848
      supporting_text: Transgenic mice carrying mutations in the mouse Pnkd locus equivalent
        to those found in patients with PNKD recapitulated the human PNKD phenotype.
