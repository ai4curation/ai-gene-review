  review:
    summary: >-
      Plasma-membrane association was reported for the human brain-specific long isoform
      PNKD-L, which D3ZXB0 matches outside the 39-residue exon. A later study found it to
      be mitochondrial instead. Keep as a disputed, non-core location.
    action: KEEP_AS_NON_CORE
    reason: >-
      Lee et al. (2004) and Shen et al. (2011) place PNKD-L at the cell membrane. Lee et
      al. (2012) found one isoform membrane-associated in mouse brain, and PNKD-L is found
