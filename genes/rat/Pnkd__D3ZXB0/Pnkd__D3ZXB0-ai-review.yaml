- id: PMID:21487022
  title: Mutations in PNKD causing paroxysmal dyskinesia alters protein cleavage and stability.
  findings:
  - statement: Human PNKD-L hydrolyses S-D-lactoylglutathione only at a trace rate and
      does not rescue HAGH-null Drosophila; SLG is not its physiological substrate.
    supporting_text: PNKD-L has extremely low but consistent SLG hydrolysis activity
  - statement: The N-terminus of wild-type PNKD-L is cleaved; disease mutations block
      cleavage and destabilize the protein.
    supporting_text: The mutant PNKD-L isoform is resistant to N-terminal cleavage and is
      less stable than the WT protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; human PNKD-L expressed in HEK293 cells and in transgenic
      flies, plus Pnkd mouse models. Primary source for the enzymology.
- id: PMID:25730884
  title: Protein mutated in paroxysmal dyskinesia interacts with the active zone protein
    RIM and suppresses synaptic vesicle exocytosis.
  findings:
  - statement: Mouse Pnkd-L binds RIM1/RIM2, localizes to presynaptic terminals, and
      overexpressed PNKD suppresses synaptic-vesicle exocytosis (assayed in cultured rat
      hippocampal neurons with exogenous constructs).
    supporting_text: Overexpressed PNKD protein suppresses release, and mutant PNKD protein
      is less effective than wild-type at inhibiting exocytosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; source of the human IMP and mouse IGI/IDA annotations
      transferred to rat. Rat neurons were only the host cells for exogenous PNKD.
- id: PMID:19124534
  title: Paroxysmal non-kinesigenic dyskinesia is caused by mutations of the MR-1 mitochondrial
    targeting sequence.
  findings:
  - statement: MR-1L and MR-1S are imported into mitochondria through a cleavable 39-residue
      N-terminal MTS, while MR-1M localizes to Golgi, ER and plasma membrane.
    supporting_text: both MR-1L and MR-1S isoforms are mitochondrial
      proteins
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Abstract only. Mitochondrial localization of the long isoform conflicts
      with plasma-membrane localization reported by Lee 2004 and Shen 2011.
- id: PMID:15496428
  title: The gene for paroxysmal non-kinesigenic dyskinesia encodes an enzyme in a stress
    response pathway.
  findings:
  - statement: MR-1L is brain-specific and at the cell membrane; MR-1S is ubiquitous and
      cytoplasmic/nuclear; PNKD is homologous to HAGH.
    supporting_text: The MR-1L isoform is specifically expressed in brain and is localized
      to the cell membrane
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. The enzyme inference in the title is from homology, later
      tested and largely not borne out for SLG (PMID:21487022).
- id: PMID:22214848
  title: Dopamine dysregulation in a mouse model of paroxysmal nonkinesigenic dyskinesia.
  findings:
  - statement: Mice carrying the dominant disease mutations show dyskinesia and reduced
      striatal extracellular dopamine; one PNKD isoform is membrane-associated in neurons.
    supporting_text: One PNKD isoform is a membrane-associated
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Source of mouse IMP phenotype annotations (dopamine,
      posture), which describe mutant-allele phenotypes rather than protein activity.
- id: PMID:28199844
  title: MR-1S Interacts with PET100 and PET117 in Module-Based Assembly of Human Cytochrome
    c Oxidase.
  findings:
  - statement: The short isoform MR-1S is a COX assembly factor acting with PET100 and PET117.
    supporting_text: we identified the short isoform of the myofibrillogenesis
      regulator 1 (MR-1S) as a new COX assembly factor
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Isoform-specific (MR-1S); relevant to the gene but not to
      the long D3ZXB0 product.
- id: PMID:15188056
  title: Characterization of MR-1, a novel myofibrillogenesis regulator in human muscle.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. Human MR-1S (isoform 2) interactions with sarcomeric
      proteins; isoform-specific and not used as support.
- id: PMID:22418241
  title: Myofibrillogenesis regulator 1 induces hypertrophy by promoting sarcomere organization
    in neonatal rat cardiomyocytes.
  findings: []
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: Rat cardiomyocyte study with overexpression of human MR-1 (17 kDa, i.e.
      the short isoform) and siRNA against rat MR-1; isoform-ambiguous hypertrophy
      phenotype. The only rat-endogenous perturbation found, but not informative for the
