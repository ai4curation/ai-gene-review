- term:
    id: GO:0051596
    label: methylglyoxal catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR017782
  review:
    summary: >-
      InterPro2GO transfer of the glyoxalase-II pathway role. PNKD-L does not perform the
      glyoxalase-II step in vivo, and PAINT propagated no glyoxalase-pathway process term
      to the PNKD branch.
    action: REMOVE
    reason: >-
      The glyoxalase-II step of methylglyoxal detoxification is hydrolysis of
      S-D-lactoylglutathione. HAGH performs it. A human PNKD-L transgene does not restore
      SLG metabolism in HAGH-null flies, and the authors conclude that PNKD-L does not use
      SLG in vivo. In PTHR11935 the only related process IBD (GO:0006749 glutathione
      metabolic process) is on the HAGH node PTN002631193, not on the PNKD subfamily.
      That a PNKD hydrolase detoxifies some other alpha-hydroxythioester remains a
      hypothesis and does not support this term.
    supported_by:
    - reference_id: PMID:21487022
      supporting_text: introduction of a human PNKD-L transgene into the same null background
        shows no rescue of SLG metabolism
    - reference_id: PMID:21487022
      supporting_text: This indicates that hydrolysis of SLG in vivo by PNKD-L is unlikely
        to be physiologically relevant.
- term:
    id: GO:0099523
    label: presynaptic cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:Q69ZP3
  - ensembl:ENSMUSP00000084478
  review:
    summary: >-
      Ensembl Compara transfer from the mouse IDA (immuno-electron microscopy), which
      places Pnkd in presynaptic terminals with no signal in Pnkd-null tissue. This is
      the compartment where the release-regulating role is performed.
    action: ACCEPT
    reason: >-
      Mouse Q69ZP3 is the SF116 ortholog. D3ZXB0 is about 99% identical to mouse isoform 3
      and contains the PNKD-L C-terminus. The presynaptic localization fits the RIM
      interaction. It has not been tested in rat.
    supported_by:
    - reference_id: PMID:25730884
      supporting_text: Here, we show that PNKD is a novel synaptic protein that interacts
        with RIMs and can be found at presynaptic terminals.
    - reference_id: PMID:25730884
      supporting_text: Because virtually no labeling of presynaptic profiles was found in
        Pnkd −/− samples
