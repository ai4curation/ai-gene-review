  review:
    summary: >-
      Supported by orthology. In human, the long and short PNKD isoforms are imported into
      mitochondria by an N-terminal MTS that is cleaved before insertion in the inner
      membrane. D3ZXB0 conserves that N-terminal exon, and PAINT placed mitochondrion on
