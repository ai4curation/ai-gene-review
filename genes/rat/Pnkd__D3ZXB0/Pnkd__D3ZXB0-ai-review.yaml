id: D3ZXB0
gene_symbol: Pnkd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Rat Pnkd (paroxysmal nonkinesigenic dyskinesia protein; myofibrillogenesis regulator 1,
  MR-1) encodes a glyoxalase-II-related metallo-beta-lactamase-fold protein of the
  PNKD-related subfamily (PANTHER PTHR11935:SF116), a lineage distinct from the canonical
  hydroxyacylglutathione hydrolase HAGH. D3ZXB0 is the 424-residue canonical rat product.
  It matches the mouse long isoform 3 almost exactly: the shared N-terminal exon, which
  carries the disease-mutated alanines and a cleavable mitochondrial targeting sequence,
  is followed by a 39-residue hydrophobic segment, also used by the short isoform MR-1S,
  and then by the complete metallo-beta-lactamase and HAGH_C domains with all seven
  zinc-ligand residues conserved. By orthology with the characterized human and mouse
  long isoform (PNKD-L), the protein is a probable zinc-dependent thioesterase. It
  hydrolyses S-D-lactoylglutathione only at a trace rate and cannot replace HAGH, so its
  physiological substrate, perhaps another alpha-hydroxythioester, is unknown. In neurons
  PNKD-L sits in presynaptic terminals, binds the active-zone scaffolds RIM1 and RIM2, and
  restrains synaptic-vesicle exocytosis. Reports disagree on whether the long isoform is
  mitochondrial (inner membrane, after MTS cleavage) or associated with the plasma
  membrane. None of these properties has been tested on the endogenous rat protein. Rat
  data consist of overexpression of exogenous PNKD in rat neurons and of human MR-1 in rat
  cardiomyocytes.
