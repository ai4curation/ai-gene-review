suggested_questions:
- question: Unlike mouse, which duplicated Pot1 into Pot1a and Pot1b, how does rat Acd coordinate capping versus G-overhang length regulation with the rat POT1 repertoire across somatic and germ tissues?
  experts:
  - Titia de Lange
  - Sandy Chang
suggested_experiments:
- hypothesis: Rat Acd directly binds rat TERT via Trp12 (NOB) and Glu80-Glu81-Lys82-Glu83 (TEL patch) to stimulate processive telomeric repeat addition in vitro.
  description: Reconstitute recombinant rat POT1-Acd with rat telomerase RNP in direct primer-extension assays comparing wild-type Acd against W12A and K82del variants.
  experiment_type: In vitro telomerase direct primer-extension processivity assay
