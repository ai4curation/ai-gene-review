id: Q4FZR5
gene_symbol: Acd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Core adaptor subunit of the Rattus norvegicus telomeric shelterin complex (commonly termed TPP1) that bridges single-stranded telomeric G-overhang-binding POT1 proteins to TIN2 and the duplex telomere-binding scaffold (TERF1/TERF2). Rat Acd (417 amino acids) contains a conserved N-terminal oligonucleotide/oligosaccharide-binding (OB) fold preceded by the hydrophobic PWI motif (Pro11-Trp12-Ile13) and carrying the surface-exposed acidic TEL-patch loop (Asp78-Trp79-Glu80-Glu81-Lys82-Glu83), followed by a central POT1-binding domain and a C-terminal TIN2-interacting motif. Like human ACD and mouse Acd, rat Acd does not bind telomeric DNA directly; instead, it tethers POT1 to telomeric repeat chromatin to cap chromosome ends against DNA damage signaling and non-homologous end joining, directly binds the telomerase reverse transcriptase TERT via its NOB and TEL-patch surfaces to recruit telomerase and stimulate repeat-addition processivity, and restrains telomere over-elongation through shelterin overhang sequestration and CST complex recruitment.
