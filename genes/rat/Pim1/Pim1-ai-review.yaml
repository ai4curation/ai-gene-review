      membrane, from human PIM1 isoform 2 (IMP) and orthology.
    action: KEEP_AS_NON_CORE
    reason: Human PIM1 isoform 2 (the membrane-associated CUG-initiated form) phosphorylates ABCG2 and
      promotes its multimerization and drug-efflux function. The rat entry lists no CUG isoform, but mouse
      has one and rodent hearts contain a 44 kDa Pim-1, so the activity is plausibly conserved; it is
      a peripheral, cancer-cell-defined output and is kept non-core.
    supported_by: *id036
