id: P26794
gene_symbol: Pim1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Pim1 encodes the rat proto-oncogene serine/threonine-protein kinase pim-1, a constitutively
  active member of the CAMK-group PIM subfamily whose activity is controlled mainly at the level of expression
  and protein turnover rather than by a regulatory domain. It is expressed in haematolymphoid cells, germ
  cells (with a stable testis-specific transcript) and the heart. PIM1 phosphorylates pro-apoptotic proteins
  such as BAD, MAP3K5 and FOXO3 to promote cell survival, and phosphorylates CDC25A, CDC25C, CDKN1A and
  CDKN1B to drive G1/S and G2/M progression; it also stabilizes MYC and cooperates with it in transformation.
  Further substrate-level roles described in orthologues include enhancement of mTORC1 signalling via
  DEPDC5, restraint of GBP1-mediated innate defence and activation of the ABCG2 drug transporter. The
  protein is found in the cytoplasm and nucleus, with a longer CUG-initiated isoform reported at the plasma
  membrane in mouse and human. In rat cardiomyocytes Pim1 is induced by pro-survival stimuli and protects
  against apoptosis.
