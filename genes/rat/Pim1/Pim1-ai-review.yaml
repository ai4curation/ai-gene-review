suggested_questions:
- question: Does rat Pim1 produce the CUG-initiated 44 kDa isoform described for mouse (P06803-2) and
    human (P11309-2)? If so, should UniProt add it to P26794, and should membrane, BMX and ABCG2 annotations
    be restricted to that isoform?
- question: Human and mouse PIM1 carry manganese ion binding (IDA) although the curated cofactor is Mg2+.
    What is the experimental basis, and is it appropriate to propagate it by orthology?
- question: Which species of Pim-1 was used in Mochizuki et al. 1999 (PMID:10373478)? If it was rat Pim-1,
    RGD could add experimental IDA annotations for kinase activity and Cdc25A phosphorylation.
suggested_experiments:
- hypothesis: Endogenous rat Pim1 is required for cardiomyocyte survival under ischaemic stress through
    phosphorylation of BAD Ser112.
  description: siRNA or CRISPR knockdown of Pim1 in neonatal rat ventricular myocytes, with rescue by
    wild-type or kinase-dead (K67M) rat Pim1, measuring BAD Ser112 phosphorylation and apoptosis after
    simulated ischaemia/reperfusion.
  experiment_type: loss-of-function with rescue
- hypothesis: Rat Pim1 mRNA is translated from an upstream CUG codon to yield a membrane-associated 44
    kDa isoform.
  description: Ribosome profiling and N-terminal proteomics of rat testis and heart, plus expression of
    CUG-start reporter constructs, to detect a CUG-initiated Pim1 product.
  experiment_type: proteomics
