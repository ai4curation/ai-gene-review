- term:
    id: GO:0007193
    label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P24588
  review:
    summary: ISO from human AKAP79 for adenylate cyclase-inhibiting GPCR signaling.
    action: MARK_AS_OVER_ANNOTATED
    reason: AKAP79/150 anchors PKA near beta-adrenergic receptors, and PKA phosphorylation of the receptor is reported to
      switch its coupling. The AKAP is a scaffold for the kinase that modifies the receptor, not a component that transduces
      a Gi-coupled signal. Annotating it to the Gi pathway itself overstates its role. Its supported cAMP-pathway role is
      captured by adenylate cyclase binding and negative regulation of adenylate cyclase activity.
    supported_by:
    - &id031
      reference_id: file:rat/Akap5/Akap5-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Multivalent scaffold protein that anchors the cAMP-dependent protein kinase/PKA to cytoskeletal and/or
        organelle-associated proteins, targeting the signal carried by cAMP to specific intracellular effectors
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P24588
        source_label: human AKAP5 (AKAP79)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Source annotation could not be inspected in full; the scaffolding role it rests on transfers, but the process
          term overstates participation.
