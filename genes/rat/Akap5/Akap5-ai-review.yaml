core_functions:
- description: PKA/calcineurin anchoring scaffold at the postsynaptic membrane of excitatory synapses. AKAP150 binds PKA RII
    and calcineurin and, through PSD-95/SAP97, brings them to AMPA receptors. Anchored calcineurin drives NMDA receptor-triggered
    AMPA receptor endocytosis.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0099149
    label: regulation of postsynaptic neurotransmitter receptor internalization
  locations:
  - id: GO:0032591
    label: dendritic spine membrane
  - id: GO:0099092
    label: postsynaptic density, intracellular component
  supported_by:
  - *id021
  - *id022
  - *id013
  - *id005
