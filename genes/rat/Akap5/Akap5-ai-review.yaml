suggested_questions:
- question: UniProt's DR GO lines for P24587 include 'positive regulation of adenylate cyclase activity' (IDA:RGD), absent
    from the GOA file reviewed here. If it rests on PMID:20410303, the authors attribute the HEK293 AKAP150-HA enhancement
    of AC8 to a non-native context and report attenuation in MIN6 cells and neurons. Should that row be withdrawn?
- question: Does the 'negative regulation of monoatomic ion transport' row from PMID:18701070 reflect a specific inhibitory
    finding, or is it a sign inversion of the TRPV1 sensitization result?
- question: Does the rodent-specific 28 x 8-residue repeat region of AKAP150 (absent from human AKAP79) change partner binding
    or AC8 regulation, as the opposite HEK293 overexpression effects of AKAP150 and AKAP79 might suggest?
suggested_experiments:
- description: Express AKAP150 lacking the central repeat array, or AKAP79/AKAP150 chimeras, in AKAP150-knockdown rat hippocampal
    neurons and measure Ca2+-stimulated AC8 cAMP production with a FRET sensor. This tests whether the rodent repeats explain
    the ortholog differences reported in PMID:20410303.
