id: P24587
gene_symbol: Akap5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Akap5 encodes AKAP150 (P150), the rodent ortholog of human AKAP79. It is a 714-residue scaffold protein with
  no catalytic activity, mainly in neurons and also in secretory and smooth-muscle tissues. Three N-terminal polybasic domains
  bind PIP2 and acidic phospholipids, F-actin, calmodulin and cadherins, and palmitoylation adds a lipid anchor. Together
  these hold the protein on the cytoplasmic face of the plasma membrane, and at the postsynaptic membrane of excitatory synapses
  in dendritic spines. A C-terminal amphipathic helix binds the RII regulatory-subunit dimer of PKA. Further sites bind PKC
  and the phosphatase calcineurin (PP2B), each of which is held inactive while bound. Through the SH3-GK region of the MAGUKs
  PSD-95 and SAP97, AKAP150 is recruited to AMPA and NMDA receptors. It also binds beta-adrenergic receptors, CaV1.2 L-type
  channels, TRPV1, K+ channels and adenylyl cyclases, including the Ca2+-stimulated AC8. The scaffold sets the phosphorylation
  state of these targets. Anchored calcineurin drives NMDA receptor-triggered AMPA receptor endocytosis and couples Ca2+ entry
  through L-type channels to NFAT activation. Anchored PKA sensitizes TRPV1 and modulates AMPA receptors. Bound to AC8, AKAP150
  dampens Ca2+-stimulated cAMP production, partly through PKA phosphorylation of the cyclase. NMDA receptor activity moves
  AKAP150 and PKA out of spines, a step linked to long-term depression.
