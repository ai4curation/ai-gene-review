- id: PMID:28694771
  title: Nupr1 Modulates Methamphetamine-Induced Dopaminergic Neuronal Apoptosis and Autophagy through
    CHOP-Trib3-Mediated Endoplasmic Reticulum Stress Signaling Pathway.
  findings: []
- id: PMID:43073435
  title: 'TRIB3 Knockdown Attenuates Post-cardiac Arrest Brain Injury with Suppression of Mitophagy: Involvement
    of AKT-FOXO3a-BNIP3 Signaling.'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Literature-scan lead (issue 7139); only the abstract is cached. Rat hippocampus after
      asphyxial CA-CPR, and rat H19-7 cells after OGD/R. The abstract reports four findings: (1) AAV or
      lentiviral TRIB3 knockdown attenuated mitophagy and apoptosis; (2) in OGD/R cells, knockdown raised
      p-AKT/AKT and p-FOXO3a/FOXO3a, reduced FOXO3a nuclear accumulation and BNIP3, and reduced FOXO3a
      enrichment at the Bnip3 promoter; (3) co-IP showed more TRIB3-AKT association after OGD/R; (4) TIC10
      counteracted the benefits of knockdown. This is rat-specific support for the existing AKT-binding
      and AKT-inhibiting rows. The effect on mitophagy goes through a transcriptional cascade, so it is
      indirect, and no NEW annotation was made.'
