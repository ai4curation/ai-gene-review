- term:
    id: GO:0010506
    label: regulation of autophagy
  evidence_type: IMP
  original_reference_id: PMID:28694771
  qualifier: involved_in
  review:
    summary: Regulation of autophagy (IMP), from rat PC12 cells exposed to methamphetamine.
    action: KEEP_AS_NON_CORE
    reason: In PC12 cells, Trib3 siRNA changed methamphetamine-induced autophagy markers, and the authors
      conclude that Trib3 acts through mTOR inhibition (PMID:28694771). The new rat paper also links Trib3
      knockdown to reduced mitophagy after CA-CPR (PMID:43073435). Both effects lie downstream of AKT
      inhibition and stress signalling, so the annotation is kept as non-core.
    supported_by:
    - reference_id: PMID:28694771
      supporting_text: These results suggest that Trib3 is involved in METH-caused dopaminergic neuronal
        autophagy via inhibiting the mTOR signaling pathway.
    - reference_id: PMID:43073435
      supporting_text: It also attenuated mitophagy, alleviated mitochondrial dysfunction, and reduced
        neuronal apoptosis in vivo and in vitro.
