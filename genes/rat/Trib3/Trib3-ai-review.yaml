  review:
    summary: Programmed cell death (NAS), from the rat NIPK cloning paper.
    action: KEEP_AS_NON_CORE
    reason: 'The original paper shows only that NIPK is induced during neuronal programmed cell death
      (PMID:10329375). Later work shows a causal contribution: TRB3 knockdown reduces ER-stress death
      in human cells (PMID:15775988), and Trib3 knockdown reduces neuronal apoptosis in rat after CA-CPR
      (PMID:43073435). The term is broad and non-core.'
    supported_by:
    - reference_id: PMID:10329375
      supporting_text: these findings suggest that NIPK is involved in programmed cell death via a pathway
        that is present in neurons but is absent in non-neurons
    - reference_id: PMID:43073435
