- term:
    id: GO:0004860
    label: protein kinase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96RU7
  - ensembl:ENSP00000217233
  review:
    summary: Protein kinase inhibitor activity, transferred from human TRIB3 (AKT).
    action: ACCEPT
    reason: 'TRB3 binds AKT directly and blocks its activation in mouse liver (PMID:12791994). The literature-scan
      paper adds rat evidence: after OGD/R, TRIB3 associates more with AKT, and its knockdown raises p-AKT
      (PMID:43073435). One rat hepatocyte overexpression study found no inhibition of PKB (PMID:15469416),
      so the activity may depend on context. It is still the best-supported molecular function.'
    supported_by: &id003
    - reference_id: PMID:12791994
      supporting_text: TRB3 disrupts insulin signaling by binding directly to Akt and blocking activation
        of the kinase
    - reference_id: PMID:43073435
      supporting_text: Co-immunoprecipitation assays showed increased TRIB3-AKT association and reduced
        AKT-FOXO3a association after OGD/R.
