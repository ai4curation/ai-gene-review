suggested_questions:
- question: The rat UniProt entry (Q9WTQ6) cites PMID:15469416 for "Disrupts insulin signaling by binding
    directly to Akt kinases". That paper reports no PKB inhibition by overexpressed TRB3/NIPK in rat hepatocytes.
    Should the citation be PMID:12791994 (mouse), with the rat result recorded as conflicting?
- question: Is TRIB3's pro-mitophagy effect after cardiac arrest entirely downstream of AKT inhibition
    (FOXO3a-BNIP3), or does TRIB3 act at mitochondria directly?
suggested_experiments:
- description: In H19-7 cells, re-express knockdown-resistant wild-type TRIB3 or an AKT-binding mutant
    after OGD/R. Measure p-AKT, FOXO3a nuclear localisation, BNIP3 and mitophagy flux. This would test
    whether AKT binding is needed for the mitophagy phenotype.
  experiment_type: rescue with an AKT-binding-deficient mutant and mitophagy flux assay
