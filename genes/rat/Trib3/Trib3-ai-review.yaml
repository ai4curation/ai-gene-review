id: Q9WTQ6
gene_symbol: Trib3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Trib3 (Tribbles homolog 3; NIPK, neuronal cell death-inducible putative kinase) is a pseudokinase
  of the Tribbles subfamily. It is a stress-inducible scaffold protein. ER stress and the integrated stress
  response induce it through ATF4 and CHOP, and it binds ATF4 and CHOP and represses their transactivation,
  acting as negative feedback. It also binds AKT and blocks its activation, binds MAPK kinases, and binds
  the E3 ligase COP1 to promote ubiquitination and degradation of substrates such as acetyl-CoA carboxylase.
  Trib3 is mainly nuclear. In rat it was first identified as a gene induced during NGF-deprivation-induced
  neuronal death. It is strongly induced in the hippocampus after cardiac arrest, where it promotes AKT-FOXO3a-BNIP3-dependent
  mitophagy and neuronal apoptosis.
