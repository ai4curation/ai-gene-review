- id: PMID:15469416
  title: Lack of evidence for a role of TRB3/NIPK as an inhibitor of PKB-mediated insulin signalling in
    primary hepatocytes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. In primary rat hepatocytes, adenoviral overexpression of TRB3/NIPK (more
      than 25-fold over PKB) did not reduce insulin-induced PKB phosphorylation or its downstream outputs.
      The rat UniProt entry cites this paper for "Disrupts insulin signaling by binding directly to Akt
      kinases". That is the opposite of what the paper reports; the statement comes from PMID:12791994
      (mouse liver). See notes.
