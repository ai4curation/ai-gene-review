- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000719
  review:
    summary: ATP binding, from the InterPro protein kinase domain mapping.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mapping comes from a generic kinase-domain signature, and UniProt calls the Trib3 kinase
      domain predicted to be catalytically inactive. Tribbles pseudokinases bind ATP at most weakly. Human
      TRB2 binds ATP and a similar low level of autophosphorylation was seen for human TRB3 (PMID:25583260),
      but no ATP-dependent function is known for Trib3. The term overstates the evidence for this protein.
    supported_by:
    - reference_id: file:rat/Trib3/Trib3-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: The protein kinase domain is predicted to be catalytically inactive.
    - reference_id: PMID:25583260
      supporting_text: A similar low level of autophosphorylation is also preserved in the closely related
        human TRB3.
