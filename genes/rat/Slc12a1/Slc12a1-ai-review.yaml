gene_symbol: Slc12a1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Slc12a1 encodes NKCC2 (BSC1), the kidney-specific, bumetanide- and furosemide-sensitive
  Na+-K+-2Cl- cotransporter of the SLC12A cation-chloride cotransporter family. It is a
  multi-pass membrane glycoprotein with cytoplasmic N- and C-terminal domains that resides in the
  apical plasma membrane and subapical vesicles of epithelial cells of the thick ascending limb
  (TAL) of Henle's loop and macula densa. NKCC2 mediates electroneutral uptake of one Na+, one K+
  and two Cl- from the tubular lumen, providing the apical entry step for transepithelial NaCl
  reabsorption by the TAL; this drives the countercurrent urinary concentrating mechanism and
  contributes to extracellular volume and blood pressure control. Its activity is regulated by
  N-terminal phosphorylation (SPAK/OSR1 downstream of WNK kinases, AMPK; dephosphorylation by
  calcineurin) and by trafficking - vasopressin/cAMP/PKA-stimulated, VAMP2-dependent exocytic
  insertion and dynamin-2/clathrin- and lipid-raft-dependent endocytosis. NKCC2 is the target of
  loop diuretics. F7EUW9 is the TrEMBL record for the same rat gene (RGD:3685) described by the
  Swiss-Prot entry P55016.
