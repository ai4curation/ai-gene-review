- term:
    id: GO:0070294
    label: renal sodium ion absorption
  evidence_type: IC
  original_reference_id: PMID:23108645
  qualifier: involved_in
  review:
    summary: >-
      NKCC2 itself performs the apical Na+ entry step of NaCl reabsorption in the thick ascending
      limb, which reabsorbs a large fraction of filtered NaCl. It therefore does part of the work
      of renal sodium absorption rather than merely being required for it. Comparators in the same
      role (NCC/SLC12A3 in the distal convoluted tubule, ENaC) carry this term, as does the
      Swiss-Prot rat NKCC2 entry P55016 (IDA, PMID:16275913).
    action: NEW
    reason: >-
      The transporter directly mediates the luminal sodium uptake step of TAL NaCl reabsorption
      (apical location shown directly in rat TAL; transport activity shown in oocytes).
    supported_by:
    - reference_id: PMID:23108645
      supporting_text: of filtered NaCl via the apical Na-K-2Cl cotransporter (NKCC2)
    - reference_id: PMID:16275913
      supporting_text: kidney-specific transporters that mediate apical NaCl reabsorption in the thick
        ascending limb
