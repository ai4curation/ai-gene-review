suggested_questions:
- question: >-
    Should the experimental rat NKCC2 annotations held on Swiss-Prot P55016 (EXP/IDA for
    GO:0008511, apical plasma membrane, renal sodium ion absorption) be propagated to the TrEMBL
    entry F7EUW9 of the same gene (RGD:3685), or should F7EUW9 be merged/redundant with P55016?
- question: >-
    Does rat NKCC2 transport NH4+ in place of K+ in the medullary TAL to a degree that warrants an
    ammonium transmembrane transport annotation, and is this splice-variant (A/B/F) dependent?
suggested_experiments:
- description: >-
    Compare NH4+ versus K+ (86Rb+) transport kinetics of the rat NKCC2 A, B and F splice variants
    expressed in Xenopus oocytes to determine whether ammonium transport is a general property of
    rat NKCC2.
  experiment_type: heterologous expression flux assay
