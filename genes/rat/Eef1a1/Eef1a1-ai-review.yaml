id: P62630
gene_symbol: Eef1a1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Eef1a1 encodes eukaryotic translation elongation factor 1A-1 (eEF1A1), a highly abundant,
  ubiquitously expressed translational GTPase of the EF-Tu/EF-1A family. In its GTP-bound form eEF1A1
  binds aminoacyl-tRNA and delivers it to the A site of cytosolic 80S ribosomes; codon-anticodon pairing
  triggers GTP hydrolysis and release of the aa-tRNA, and the GDP-bound factor is recycled by the guanine
  nucleotide exchange factor eEF1B (Eef1b2). In rat cardiomyocytes, TIP30 (Htatip2) binds the middle domain
  of eEF1A1 and competes with eEF1B2, restraining elongation during hypertrophic growth. eEF1A1 is the
  predominant isoform in most tissues; in postnatal neurons and muscle it is largely replaced by the paralog
  eEF1A2. Besides translation, eEF1A proteins bind and bundle F-actin, bind specific mRNA 3'UTR elements
  (e.g., metallothionein-1), associate with the cytosolic face of lysosomes in a GFAP- and GTP-regulated
  step of chaperone-mediated autophagy, and interact with signaling proteins such as sphingosine kinases,
  ZPR1 and DLC1; these moonlighting roles are less well defined than its core elongation function.
