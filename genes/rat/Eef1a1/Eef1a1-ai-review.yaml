- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:31468715
  qualifier: enables
  supporting_entities:
  - UniProtKB:A6IPG1
  review:
    summary: Rat eEF1A1 interacts with Eef1b2 in pull-down/co-IP assays (PMID:31468715).
    action: REMOVE
    reason: The interaction with Eef1b2 is real (GST pull-down and co-immunoprecipitation in the cited
      full text), but bare protein binding carries no functional information. eEF1B2 is the guanine nucleotide
      exchange factor that recycles eEF1A1-GDP; that relationship is captured by the elongation factor
      and GTPase activity annotations, and the GEF activity belongs to Eef1b2. Removal follows the GO:0005515
      policy and does not dispute the interaction.
    supported_by:
    - *id008
    - &id009
      reference_id: PMID:31468715
      supporting_text: Increasing concentrations of recombinant TIP30 decreased binding between eEF1A1
        and eEF1B2 in a GST‐pulldown assay (Fig 4A).
