  review:
    summary: Aminoacyl-tRNA binding is intrinsic to eEF1A1 function, which is to carry aa-tRNA to the
      ribosome as the eEF1A-GTP-aa-tRNA ternary complex.
    action: MODIFY
    reason: The binding is correct and central, but the tRNA eEF1A1 carries to the ribosome is aminoacylated;
      the human donor evidence (Exp5 export via aminoacylated tRNA) and the rat TIP30 study (tRNA binding
      of rat eEF1A1 assayed directly) both concern charged tRNA. The more precise child term alpha-aminoacyl-tRNA
      binding (GO:1904678) captures the core ternary-complex interaction.
    supported_by:
    - &id001
      reference_id: file:rat/Eef1a1/Eef1a1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Translation elongation factor that catalyzes the GTP-dependent binding of aminoacyl-tRNA
        (aa-tRNA) to the A-site of ribosomes during the elongation phase of protein synthesis.
    - reference_id: PMID:12426392
      supporting_text: This cargo-exportin interaction is rather un usual in that eEF1A binds the exportin
        not directly, but instead via aminoacylated tRNAs.
    - &id002
