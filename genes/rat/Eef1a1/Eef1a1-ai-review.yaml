  review:
    summary: eEF1A1 is a translational GTPase; codon-anticodon pairing on the ribosome triggers GTP hydrolysis,
      releasing aa-tRNA. GDP-eEF1A1 is recycled by eEF1B2.
    action: ACCEPT
    reason: GTP hydrolysis is mechanistically integral to the elongation cycle and is conserved across
      the TRAFAC translation-factor GTPase family (tr-type G domain IPR000795). The human ortholog has
      direct GTPase assays; rat eEF1A1 interacts with its GEF eEF1B2 (PMID:31468715). Consistent across
      IBA, IEA, ISO and ISS rows.
    supported_by:
    - &id006
      reference_id: file:rat/Eef1a1/Eef1a1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Base pairing between the mRNA codon and the aa-tRNA anticodon promotes GTP hydrolysis,
        releasing the aa-tRNA from EEF1A1 and allowing its accommodation into the ribosome.
    - *id003
    - &id007
      reference_id: file:rat/Eef1a1/Eef1a1-uniprot.txt
      record_section:
      - DR:InterPro
      supporting_text: InterPro; IPR000795; T_Tr_GTP-bd_dom.
