suggested_questions:
- question: Does the IMP of PMID:23041468 (negative regulation of ROS biosynthesis) belong to Tufm rather
    than Eef1a1, as the abstract and MeSH indexing indicate?
- question: Do the postsynaptic density and gephyrin-cluster findings in rat neurons reflect eEF1A1, eEF1A2,
    or both, given that mature neurons switch to eEF1A2?
- question: Is there direct evidence that mammalian eEF1A1 binds calmodulin, and what is the basis of
    the mouse IDA keyed to PMID:12384497?
suggested_experiments:
- description: Use paralog-specific antibodies or tagged knock-in alleles in mature rat cortical and hippocampal
    neurons to determine whether eEF1A1 itself is present in the postsynaptic density and at gephyrin-positive
    synapses.
- description: Test whether eEF1A1 knockdown alone (without drug) changes ROS production or apoptosis
    in rat cardiomyocytes, with rescue by a knockdown-resistant eEF1A1, to separate direct from translation-capacity
    effects.
