  review:
    summary: KLK9/SEV is a secreted serine protease (signal peptide 1-18, propeptide
      19-24) purified from submandibular gland and active on extracellular targets
      (vascular smooth muscle, circulating angiotensinogen). Extracellular region is
      where its protease activity operates, consistent with the kallikrein-family PAINT
      node.
    action: ACCEPT
    reason: Secretion of glandular kallikreins is conserved across the family, and the
      rat protein carries a signal peptide and acts on extracellular substrates in the
      only functional study. The IBA placement at the kallikrein node is appropriate
      for this secreted family member.
    supported_by:
