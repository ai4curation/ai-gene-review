  review:
    summary: The zymogen activation annotation is plausible for Klk9 but should be
      kept as non-core context rather than used to define the gene product function.
    action: KEEP_AS_NON_CORE
    reason: The annotation is compatible with Klk9 biology but is broader or more
      contextual than the core molecular function. It is inherited from a kallikrein-family
      PAINT node; no zymogen substrate of rat KLK9 itself has been identified (its
      only defined cleavage products are angiotensin II from angiotensinogen and weak
      hydrolysis of a thrombin peptide substrate), and there is no target-specific
      evidence of divergence that would justify removing the IBA. Note that KLK9's
      own activation from a zymogen (UniProt keyword Zymogen) is not what this term
      asserts.
