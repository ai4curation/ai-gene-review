  label: Rattus norvegicus
description: Klk9 encodes rat glandular kallikrein-9 (KLK-S3), identified as the submandibular
  enzymatic vasoconstrictor (SEV). It is a trypsin-like serine protease of the peptidase
  S1 kallikrein subfamily, made as a signal-peptide-bearing zymogen and matured into
  a disulfide-linked heavy and light chain. It is expressed mainly in the submandibular
  gland and prostate, with lower levels in other organs. Purified SEV contracts isolated
  aortic rings slowly and persistently, independently of the endothelium and of angiotensin
  II receptors, by a mechanism that requires its protease activity; it also releases
  angiotensin II from angiotensinogen, at about one tenth the activity of tonin, and
  hydrolyses thrombin-type peptide substrates weakly. Its physiological substrates are
  not defined.
