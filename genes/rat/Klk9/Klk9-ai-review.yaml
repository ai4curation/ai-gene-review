- id: file:rat/Klk9/Klk9-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: rat Klk9 (P07647) — submandibular
    glandular kallikrein-9 (rKLK9/SEV/KLK-S3)'
  findings:
  - statement: 'Falcon confirms gene identity: rat Klk9 (P07647) is rKLK9, equated
      with SEV

      (submandibular enzymatic vasoconstrictor), within the rat tissue kallikrein

      multigene family of secreted serine proteases (EC 3.4.21.35), and explicitly

      distinguishes it from human KLK9.'
    supporting_text: explicitly equates **rKLK9 with SEV** and places it within the
      **rat tissue (glandular) kallikrein multigene family** of secreted serine proteases
      (EC **3.4.21.35**)
    reference_section_type: OTHER
  - statement: 'rKLK9/SEV is repeatedly described as having potent/direct vasoconstrictor

      activity, contrasting with the canonical vasodilatory/kinin-generating role
      of

      most tissue kallikreins.'
    supporting_text: it is repeatedly described as having **potent/direct vasoconstrictor
      activity**, contrasting with the vasodilatory/vasodepressor framing often emphasized
      for kinin-generating kallikreins
    reference_section_type: OTHER
  - statement: 'A primary expression paper describes SEV (rKLK9) as having direct

      vasoconstrictor activity, corroborating the GO:0045907 IDA annotation.'
    supporting_text: Rat rKLK9 encodes SEV, described in a primary expression paper
      as having **direct vasoconstrictor activity**
    reference_section_type: OTHER
  - statement: 'Falcon flags a major evidence gap: direct biochemical characterization
      of

      purified rat rKLK9/SEV (cleavage-site preference, physiological substrates,

      kinetics, inhibitor constants, light/heavy chain processing) was not available

      in this run. This supports conservative, family/EC-level annotations rather

      than speculative substrate- or maturation-specific claims.'
    supporting_text: direct biochemical characterization of purified rat rKLK9/SEV
      (e.g., cleavage-site preference, defined physiological substrates, Km/kcat,
      inhibitor constants, or processing into light/heavy chains)** was **not available**
    reference_section_type: OTHER
  - statement: 'Falcon advises that claims beyond serine protease in the tissue kallikrein

      family (EC 3.4.21.35) and vasoconstrictor activity attributed to SEV would be

      speculative on this evidence set.'
    supporting_text: any claim beyond “serine protease in the tissue kallikrein family
      (EC 3.4.21.35)” and “vasoconstrictor activity attributed to SEV” would be speculative
      based on this evidence set
    reference_section_type: OTHER
  - statement: 'Expression survey (MacDonald et al. 1996): rKLK9/SEV mRNA detected
      in 16 of

      20 rat organs, with Northern hybridization showing predominant expression in

      submandibular gland and prostate (secretory tissues), supporting a secreted

      product and the secretory-granule/extracellular localization context.'
    supporting_text: Northern hybridization had primarily detected rKLK9 in **SMG
      and prostate**, whereas RT-PCR revealed additional lower-level sites (including
      **kidney**).
    reference_section_type: OTHER
