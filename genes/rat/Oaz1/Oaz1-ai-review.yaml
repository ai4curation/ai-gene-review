id: P54370
gene_symbol: Oaz1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Oaz1 encodes ornithine decarboxylase antizyme 1 (AZ1), a small non-catalytic
  regulatory protein whose full-length form is produced by polyamine-stimulated +1
  ribosomal frameshifting, so that its synthesis rises when intracellular polyamines
  accumulate. AZ1 binds ornithine decarboxylase (ODC) monomers, preventing formation
  of the active ODC homodimer, and delivers the bound monomers to the 26S proteasome
  for ubiquitin-independent degradation. It also represses cellular polyamine uptake,
  closing a negative-feedback loop on both polyamine synthesis and import. AZ1 is
  predominantly cytoplasmic but carries nuclear export signals and shuttles between
  nucleus and cytoplasm. Its activity is opposed by the antizyme inhibitors (AZIN1,
  AZIN2), which bind AZ1 more tightly than ODC does.
