  evidence_type: IEP
  original_reference_id: PMID:8649218
  review:
    summary: response to ischemia is marked as over-annotated for Oaz1; the evidence
      supports the gene's core activity or context, not this broader process claim
      (IEP, PMID:8649218).
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is a change in antizyme mRNA level in rat small intestine after
      ischaemia/reperfusion. A transcript-level fluctuation shows the gene is expressed
      differently after the insult but not that AZ1 carries out any part of a response
      to ischaemia; the process claim overshoots the expression data.
    supported_by:
    - reference_id: PMID:8649218
