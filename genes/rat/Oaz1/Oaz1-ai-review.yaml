references:
- id: file:rat/Oaz1/Oaz1-deep-research-falcon.md
  title: Falcon deep research report for rat Oaz1 (ornithine decarboxylase antizyme
    1)
  findings:
  - statement: Falcon report confirms OAZ1 is a polyamine-inducible regulatory (non-catalytic)
      protein that binds ODC, inhibits its activity, and accelerates ubiquitin-independent
      26S proteasomal degradation.
    supporting_text: OAZ1 is a polyamine-inducible antizyme produced by **programmed
      +1 ribosomal frameshifting**, binds **ornithine decarboxylase (ODC)**, inhibits
      its enzymatic activity, and accelerates its **ubiquitin-independent 26S proteasomal
      degradation**.
    reference_section_type: OTHER
  - statement: OAZ1 binds ODC monomers and prevents formation of the active ODC dimer,
      thereby inhibiting decarboxylase activity.
    supporting_text: OAZ1 binds ODC subunits/monomers and prevents formation of the
      active ODC dimer, thereby inhibiting decarboxylase activity
