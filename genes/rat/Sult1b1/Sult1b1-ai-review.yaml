id: P52847
gene_symbol: Sult1b1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Sult1b1 encodes rat sulfotransferase 1B1 (ST1B1, EC 2.8.2.1), a cytosolic aryl sulfotransferase
  of the SULT1 family. It transfers the sulfonate group of 3'-phosphoadenylyl sulfate (PAPS) onto the hydroxyl
  of phenolic acceptors, releasing an aryl sulfate and adenosine 3',5'-bisphosphate. Characterised rat
  substrates are dopamine, small phenols such as 1-naphthol and p-nitrophenol, and the thyroid hormones
  3,3'-diiodothyronine, triiodothyronine (T3), and reverse T3, which makes the enzyme a contributor both to
  catecholamine and phenolic-xenobiotic conjugation and to peripheral thyroid hormone inactivation, since
  iodothyronine sulfation accelerates subsequent deiodination. By similarity to the human orthologue it also
  O-sulfonates 4-ethylphenol, a tyrosine-derived metabolite produced by gut bacteria, placing it at a
  gut-microbiota-host metabolic interface. Sulfation depends on PAPS supply and the reaction is a canonical
  phase II conjugation step that increases the water solubility of its acceptors.
