- id: PMID:8530477
  title: 'Purification, characterization, and molecular cloning of a novel rat liver Dopa/tyrosine sulfotransferase.'
  findings:
  - statement: Purified rat liver Sult1b1 is a cytosolic aryl sulfotransferase with DOPA/tyrosine, dopamine,
      p-nitrophenol, and thyroid hormone substrates.
    supporting_text: Purification, characterization, and molecular cloning of a novel rat liver Dopa/tyrosine
      sulfotransferase.
    reference_section_type: TITLE
- id: PMID:23207770
  title: 'Ethanol sulfation by the human cytosolic sulfotransferases: a systematic analysis.'
  findings:
  - statement: This is the IDA source behind the human SULT1B1 GO:0006068 annotation that was ISO-transferred
      to rat Sult1b1. The abstract names four ethanol-sulfating enzymes out of eleven purified human SULTs
      screened, and SULT1B1 is not among them, so the donor evidence for an ethanol-catabolism role is weak
      and the rat transfer is flagged as over-annotation.
    supporting_text: A systematic analysis revealed four ethanol-sulfating SULTs, SULT1A1, SULT1A2, SULT1A3,
      and SULT1C4, among the eleven human SULT enzymes previously prepared and purified.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified as a human SULT ethanol-sulfation screen. Cited here not as evidence for
      rat Sult1b1 function but as the donor reference for an ISO-propagated annotation; only the abstract is
      cached (full_text_available false), so the apparent absence of SULT1B1 from the positive set is reported
      as a caveat rather than treated as a refutation.
- id: PMID:21492153
  title: Analysis of proteomic changes induced upon cellular differentiation of the human intestinal cell line
    Caco-2.
  findings:
  - statement: This is the IEP source behind the human SULT1B1 GO:0030855 annotation that was ISO-transferred
      to rat Sult1b1. It is a proteomic comparison of Caco-2 cells before and after differentiation, so it
      establishes correlated abundance rather than a functional role in differentiation.
    supporting_text: Analysis of proteomic changes induced upon cellular differentiation of the human
      intestinal cell line Caco-2.
    reference_section_type: TITLE
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified. Relevant only as the donor reference for the epithelial cell
      differentiation ISO transfer; the IEP evidence code and the study design (differentiation-associated
      proteome survey) both indicate expression correlation, not participation.
- id: file:rat/Sult1b1/Sult1b1-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: Functional annotation of rat Sult1b1 (UniProt P52847, ST1B1)'
  findings:
  - statement: Falcon confirms target identity as the canonical rat cytosolic SULT1B1/ST1B1 (UniProt P52847),
      distinguished from other SULT1 isoforms by phylogeny, and not a paralog-misassigned gene.
    supporting_text: |-
      The collected evidence supports that “Sult1b1” here refers to the canonical **rat cytosolic SULT1B1/ST1B1** enzyme (target UniProt P52847), not an unrelated gene.
    reference_section_type: OTHER
  - statement: Falcon corroborates the core enzymatic mechanism — PAPS-dependent transfer of a sulfonate group
      to acceptor substrates, generating sulfated metabolites and PAP.
    supporting_text: |-
      encodes a **cytosolic sulfotransferase 1 family enzyme** (SULT1B1/ST1B1) that catalyzes **sulfate conjugation (sulfonation/sulfation)** of small molecules by transferring **SO3−** from the universal donor **PAPS** to nucleophilic atoms (commonly oxygen on hydroxyl groups), generating **sulfate esters** and **PAP**.
    reference_section_type: OTHER
  - statement: Falcon corroborates rat-specific substrate specificity for L-DOPA, tyrosine, p-nitrophenol, and
      thyroid hormones from early enzyme characterization.
    supporting_text: |-
      Rat Sult1b1 was reported to show high substrate specificity for **L-DOPA** and **tyrosine**, with additional sulfating activity toward **p-nitrophenol (pNP)** and **thyroid hormones**.
    reference_section_type: OTHER
  - statement: Falcon corroborates cytosolic (soluble) localization, supporting the cytoplasm annotation and
      excluding a membrane/secreted role.
    supporting_text: |-
      SULTs are described as **soluble cytosolic enzymes**; SULT1B1 is therefore a cytosolic phase II sulfotransferase rather than a membrane transporter or secreted protein.
    reference_section_type: OTHER
  - statement: Falcon flags a paralog caution — broad SULT1B1 xenobiotic/drug substrate compilations are not
      rat-isoform-specific and should be interpreted cautiously, supporting keeping such terms as non-core.
    supporting_text: |-
      the broader substrate compilation supports involvement in xenobiotic/drug sulfation but should be interpreted cautiously because it is not rat-isoform-specific in the cited excerpt.
    reference_section_type: OTHER
  - statement: Falcon notes human SULT1B1 functions as a physiological homodimer with cofactor-dependent
      subunit communication, informing the molecular architecture of the rat ortholog.
    supporting_text: |-
      human SULT isoforms—including SULT1B1—are described as **homodimers** with conserved dimer interfaces, and their activity depends critically on efficient binding/release of PAPS and PAP.
    reference_section_type: OTHER
core_functions:
- description: As a cytosolic SULT1-family enzyme, transfers the sulfonate group of PAPS onto the hydroxyl of
    phenolic acceptors, releasing an aryl sulfate and adenosine 3',5'-bisphosphate. In rat the characterised
    acceptors are dopamine, small phenols such as 1-naphthol and p-nitrophenol, and the iodothyronines
    3,3'-diiodothyronine, T3, and reverse T3, so the same active site serves both phase II conjugation of
    catecholamines and phenolic xenobiotics and the sulfation step that commits thyroid hormone to peripheral
    inactivation.
  supported_by:
  - reference_id: UniProtKB:P52847
    supporting_text: "FUNCTION: Sulfotransferase that utilizes 3'-phospho-5'-adenylyl sulfate (PAPS) as sulfonate
      donor to catalyze the sulfate conjugation of dopamine, small phenols such as 1-naphthol and p-nitrophenol
      and thyroid hormones, including 3,3'-diiodothyronine, triidothyronine (T3) and reverse triiodothyronine (rT3)"
