suggested_questions:
- question: The human SULT1B1 GO:0006068 "ethanol catabolic process" annotation is IDA from PMID:23207770,
    but that paper's abstract names SULT1A1, SULT1A2, SULT1A3, and SULT1C4 as the ethanol-sulfating enzymes
    among the eleven purified human SULTs screened. Does the full text report measurable ethanol sulfation by
    SULT1B1, and if not should the human annotation (and the rat ISO transfer that depends on it) be
    retracted?
- question: Rat Sult1b1 sulfates T3, rT3, and 3,3'-diiodothyronine in vitro. Is iodothyronine sulfation by
    SULT1B1 quantitatively significant for peripheral thyroid hormone inactivation in vivo, relative to the
    contribution of Sult1a1 and the deiodinases?
- question: Does rat Sult1b1 O-sulfonate 4-ethylphenol, the gut-bacterial tyrosine metabolite? The activity
    is currently recorded for the rat protein only as ECO:0000250 similarity to human O43704, so the
    microbiota-host role is inferred rather than measured in rat.
- question: Is SULT1B1 protein abundance in differentiating intestinal epithelium (the basis of the IEP donor
    annotation for epithelial cell differentiation) simply a consequence of enterocyte maturation, or does
    loss of the enzyme perturb differentiation itself?
suggested_experiments:
- hypothesis: Rat SULT1B1 does not sulfate ethanol at a physiologically meaningful rate, so the ISO-derived
    ethanol catabolic process annotation reflects a donor-evidence problem rather than rat biology.
  description: Assay purified recombinant rat SULT1B1 with [35S]PAPS across a range of ethanol concentrations,
    running rat Sult1a1 and a SULT1A-family human positive control in parallel and using 1-naphthol as an
    activity control for the rat enzyme itself, so that a negative ethanol result is attributable to substrate
    specificity rather than to an inactive preparation.
  experiment_type: radiolabelled PAPS sulfotransferase assay with paralog controls
- hypothesis: SULT1B1-mediated iodothyronine sulfation is a rate-relevant step in peripheral thyroid hormone
    disposal, not merely an in vitro capability.
  description: Quantify T3 sulfate, rT3 sulfate, and 3,3'-T2 sulfate by LC-MS/MS in liver and small-intestine
    tissue and plasma from wild-type versus Sult1b1-knockout rats under basal conditions and after a T3 bolus,
    and compare the deficit against that seen with Sult1a1 loss.
  experiment_type: knockout metabolite flux analysis by LC-MS/MS
- hypothesis: SULT1B1 is a marker of enterocyte maturation rather than an effector of epithelial
    differentiation, so its loss should not block differentiation.
  description: Knock down Sult1b1 in a differentiating rat intestinal epithelial organoid or cell model and
    score differentiation markers, brush-border enzyme activity, and monolayer polarisation against controls,
    testing directly whether the correlation reported by the IEP donor evidence is causal.
  experiment_type: loss-of-function test of a correlation-based annotation
