    label: ethanol catabolic process
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: ethanol catabolic process is marked as over-annotated for Sult1b1; the evidence supports the 
      gene's core activity or context, not this broader process claim (ISO, GO_REF:0000121).
    action: MARK_AS_OVER_ANNOTATED
    reason: The characterised rat substrates are dopamine, small phenols, and iodothyronines; the donor
      evidence behind this ISO transfer named four other SULTs as the ethanol-sulfating enzymes, so an
      ethanol-catabolism role is not supported for Sult1b1.
    supported_by:
    - reference_id: UniProtKB:P52847
      supporting_text: "FUNCTION: Sulfotransferase that utilizes 3'-phospho-5'-adenylyl sulfate (PAPS) as sulfonate
        donor to catalyze sulfate conjugation of dopamine, small phenols and thyroid hormones."
    - reference_id: PMID:23207770
      supporting_text: A systematic analysis revealed four ethanol-sulfating SULTs, SULT1A1, SULT1A2, SULT1A3,
        and SULT1C4, among the eleven human SULT enzymes previously prepared and purified.
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:O43704
        source_label: human SULT1B1
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The donor annotation is IDA from PMID:23207770. That paper systematically screened
          eleven purified human SULTs for ethanol sulfation and reported SULT1A1, SULT1A2,
          SULT1A3, and SULT1C4 as the ethanol-sulfating enzymes; SULT1B1 is not among the
          four named positives. The cached abstract does not state which eleven enzymes were
          screened, so whether SULT1B1 was among them cannot be confirmed from the cache.
          The full text was not read,
          so this is flagged as weak support for the donor rather than asserted to be wrong,
          but it is not a sound basis for ISO transfer of an ethanol-catabolism role to rat
          Sult1b1, whose characterised substrates are dopamine, small phenols, and
          iodothyronines. Worth referring back to the human curator.
