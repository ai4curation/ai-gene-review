id: O08775
gene_symbol: Kdr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Kdr (VEGFR-2, Flk-1) is a single-pass type I transmembrane receptor tyrosine kinase of the
  CSF-1/PDGF receptor subfamily, expressed mainly on vascular endothelial cells and also on endothelial
  and hematopoietic progenitors and some neurons. Its seven extracellular Ig-like domains bind VEGFA,
  VEGFC and VEGFD (via domains 2-3); ligand binding induces receptor dimerization and trans-autophosphorylation
  of the split intracellular kinase domain. The phosphotyrosines recruit PLCG1 (a direct substrate), PI3K,
  SHB, NCK1 and other adaptors, activating PKC/Ca2+, ERK1/2, PI3K-AKT, FAK and eNOS/NO outputs. VEGFR-2
  signalling drives endothelial proliferation, survival, migration and tube formation and is essential
  for vasculogenesis, angiogenesis and embryonic hematopoiesis; it also mediates VEGF-induced vasodilation
  and vascular permeability. In rat, Kdr mediates VEGF-induced hypotension, ocular neovascularization
  and neurotrophic effects of VEGF on neurons (Ca2+ signalling, neurite outgrowth, hypoxic neuroprotection,
  hippocampal neurogenesis). Signalling is tuned by endosomal trafficking, heterodimerization with FLT1/FLT4,
  co-receptors such as neuropilins, and a short truncated isoform that retains ligand binding.
