suggested_questions:
- question: 'GO:0070482 response to oxygen levels (rat Kdr IEP, PMID:15885787): the abstract describes
    human pterygium specimens and no oxygen manipulation. Is this row attached to the intended paper and
    species?'
- question: GO:0050769 positive regulation of neurogenesis (PMID:15258583) is coded IEP, but the abstract
    reports a dominant-negative KDR experiment. Should the evidence be IMP?
- question: 'GO:0003416 endochondral bone growth (PMID:14612527): CP-547,632 inhibits FGFR as potently
    as VEGFR-2. Does the full text separate the two targets for the growth-plate phenotype?'
suggested_experiments:
- description: Endothelial-specific conditional deletion of Kdr in rat (or kinase-dead knock-in) to test
    which rat physiological phenotypes attributed to Kdr by pharmacology (hypotension, ocular neovascularization,
    growth-plate effects) depend on its kinase activity rather than on off-target inhibition of FGFRs
    or FLT1.
