core_functions:
- description: Kdr binds VEGFA, VEGFC and VEGFD at the endothelial plasma membrane and, as a ligand-activated
    receptor tyrosine kinase, dimerizes and trans-autophosphorylates to initiate VEGFR-2 signalling, phosphorylating
    PLCG1 and recruiting PI3K and adaptor proteins.
  molecular_function:
    id: GO:0005021
    label: vascular endothelial growth factor receptor activity
  directly_involved_in:
  - id: GO:0036324
    label: vascular endothelial growth factor receptor-2 signaling pathway
  - id: GO:0018108
    label: peptidyl-tyrosine phosphorylation
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: UniProtKB:O08775
    supporting_text: Tyrosine-protein kinase that acts as a cell-surface receptor for VEGFA, VEGFC and
      VEGFD
  - reference_id: UniProtKB:O08775
    supporting_text: Binding of VEGFA, VEGFC or VEGFD leads to dimerization and activation by autophosphorylation
      on tyrosine residues
  - reference_id: PMID:9442048
    supporting_text: VEGF induced a biphasic increase of cytoplasmic calcium with both forms in HK 293
      transfected cells, indicating that both forms of the VEGF receptor-2/Flk-1 are functional
  - reference_id: PMID:9160888
    supporting_text: As a major substrate of KDR/Flk-1, PLC-gamma was found to be rapidly tyrosine-phosphorylated
      and associated with KDR/Flk-1 both in endothelial cells and NIH3T3 cells
- description: VEGFR-2 signalling from Kdr drives endothelial cell proliferation, survival and migration,
