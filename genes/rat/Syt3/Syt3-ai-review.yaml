taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Synaptotagmin-3 (Syt3) is a single-pass membrane protein of the synaptotagmin family with
  an N-terminal disulfide-forming cysteine motif and tandem cytoplasmic C2 domains. It is a high-affinity
  Ca2+ sensor: its C2 domains bind three Ca2+ ions and, in response to low micromolar Ca2+, bind anionic
  phospholipids (phosphatidylserine, PIP2) and t-SNARE complexes and stimulate SNARE-mediated membrane
  fusion. Unlike synaptotagmins 1 and 2, Syt3 is enriched in synaptic and other plasma membranes rather
  than on synaptic vesicles. Presynaptically it acts as the high-affinity Ca2+ sensor for synaptic vesicle
  replenishment and short-term plasticity; postsynaptically it binds GluA2 and drives activity-dependent
  AMPA receptor endocytosis, long-term depression and forgetting. It forms disulfide-linked homodimers
  and heterodimers with related synaptotagmins and is also expressed in endocrine cells, where it has
  been proposed to act as a plasma-membrane Ca2+ sensor for regulated exocytosis.'
