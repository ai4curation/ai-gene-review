suggested_questions:
- question: Should SynGO/RGD record Syt3 presynaptic function in vesicle replenishment with a priming/docking
    term (e.g. GO:0016082 synaptic vesicle priming) once direct mechanistic (not only knockout) evidence
    exists?
- question: Is the human SYT3 annotation to positive regulation of dendrite extension (melanocyte, PMID:23999003)
    appropriate given that GO dendrite is restricted to neurons?
suggested_experiments:
- description: Test whether Syt3 C2B Ca2+-binding mutants rescue fast vesicle replenishment in Syt3 knockout
    synapses, and whether Syt3 directly promotes tight docking in reconstituted docking assays.
- description: Map the Syt3-GluA2 binding interface and test whether Syt3 recruits AP2/clathrin directly
    to drive receptor endocytosis in a Ca2+-dependent manner.
