suggested_questions:
- question: Does the RGD IDA annotation of cardiac muscle contraction from PMID:14551059 (tropomyosin detected as
    a marker in engineered cardiac constructs) meet the bar for direct evidence, or should it be re-sourced to a
    thin-filament regulation study?
- question: Which rat Tpm1 isoforms are present in the AQP2-associated complex and at ruffles in vivo, and do these
    localizations reflect specific isoform sorting?
suggested_experiments:
- description: Isoform-specific knockdown/rescue of fibroblast Tpm1 isoforms (TM-2, TM-3, TM-5a, TM-5b) in rat cells,
    with live imaging of stress-fiber assembly and myosin II recruitment, to separate isoform-specific from generic
    actin-stabilizing roles.
