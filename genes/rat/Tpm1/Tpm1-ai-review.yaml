- term:
    id: GO:0005862
    label: muscle thin filament tropomyosin
  evidence_type: IC
  original_reference_id: PMID:22812662
  qualifier: part_of
  review:
    summary: Alpha-tropomyosin homodimers and alpha-beta heterodimers are the tropomyosin of striated muscle thin
      filaments, associated with actin and troponin.
    action: NEW
    reason: 'Two independent lines agree: the curated UniProt function places rat Tpm1 with troponin in Ca2+-dependent
      regulation of striated muscle contraction, and the dimer studies show alpha2 and alpha-beta dimers are the
      striated muscle tropomyosin species that bind actin and regulate myosin binding with cardiac troponin. GO:0005862
      is the specific complex term for this tropomyosin dimer on the thin filament; it is a cellular component,
      not a process, and the rat gene carries only the general myofibril term.'
    supported_by:
    - reference_id: PMID:22812662
      supporting_text: In mammalian skeletal and cardiac muscle, the Tm is expressed from two separate genes to
        give the α- and β-Tm isoforms
    - reference_id: UniProtKB:P04692
      supporting_text: Plays a central role, in association with the troponin complex, in the calcium dependent
        regulation of vertebrate striated muscle contraction
