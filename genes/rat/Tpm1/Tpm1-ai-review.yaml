id: P04692
gene_symbol: Tpm1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Alpha-tropomyosin (Tropomyosin alpha-1 chain), a parallel two-chained alpha-helical coiled-coil protein
  that binds head-to-tail along the length of actin filaments. Alternative promoters and splicing produce striated
  muscle, smooth muscle, brain and fibroblast (TM-2, TM-3, TM-5a, TM-5b) isoforms that differ in actin affinity
  and dimerization preference. In striated muscle, alpha-tropomyosin homodimers and alpha-beta heterodimers (with
  Tpm2) are thin-filament components that, together with troponin, gate myosin binding to actin and so confer Ca2+-dependent
  regulation of contraction; it is the predominant tropomyosin of the rodent heart. In non-muscle cells, high-molecular-weight
  isoforms stabilize actin filaments and stress fibers, influencing cell adhesion and motility, and tropomyosin
  cooperates with tropomodulin to cap actin filament pointed ends.
