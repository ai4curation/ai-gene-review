- term:
    id: GO:0003065
    label: positive regulation of heart rate by epinephrine
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:98809
  review:
    summary: 'Transferred from a mouse phenotype annotation: altered heart-rate response to epinephrine in Tpm1
      mutant/transgenic mice.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Tropomyosin is a thin-filament protein that regulates the Ca2+-dependent actomyosin interaction in cardiomyocytes
      (contractility); it does not do any of the work of adrenergic heart-rate regulation, which is set by pacemaker
      cells. An altered chronotropic response in a mutant mouse is an indirect, systemic consequence of perturbed
      contractility. Not removed because it is a curator-made transfer of an experimental mouse phenotype.
    supported_by:
    - &id004
      reference_id: UniProtKB:P04692
      supporting_text: Plays a central role, in association with the troponin complex, in the calcium dependent
        regulation of vertebrate striated muscle contraction
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:98809
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Mouse donor annotation rests on a whole-animal physiological phenotype of Tpm1 mutant mice; it
          records a downstream consequence of altered contractility, not a step of adrenergic heart-rate control
