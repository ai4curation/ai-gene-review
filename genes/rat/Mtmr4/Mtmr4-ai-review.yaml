gene_symbol: Mtmr4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Mtmr4 (myotubularin-related protein 4, originally described in human as FYVE-DSP2) is a
  peripheral-membrane phosphoinositide 3-phosphatase of the myotubularin family. It has an N-terminal
  PH-GRAM domain, an active myotubularin phosphatase domain (catalytic Cys407 in a CX5R loop), a coiled-coil
  region, a PY motif and a C-terminal FYVE zinc finger. Through the FYVE domain it binds PtdIns3P and
  is the only myotubularin that resides on endosomes: early and Rab11-positive recycling endosomes, late
  endosomes, autophagosomes and, in macrophages, phagosomes. There it hydrolyses PtdIns3P (and probably
  PtdIns(3,5)P2) to remove the 3-phosphate, controlling the PtdIns3P content of endosomal and phagosomal
  membranes and thereby endosomal sorting and recycling, endolysosomal and autophagic flux, and phagosome
  maturation. MTMR4 forms heteromers with MTMR3. Additional reported roles include dephosphorylation of
  activated R-Smads to attenuate TGF-beta and BMP signalling, and an adaptor role with MTMR3 in recruiting
  CEP55 to the midbody for abscission. MTMR4 carries a PY motif bound by the ubiquitin ligase NEDD4, which
  ubiquitinates it, and in rat skeletal muscle MTMR4 protein drops sharply after denervation as NEDD4
  rises. Almost all functional data are from human and mouse cells; the rat protein conserves the catalytic,
  FYVE, PY and CEP55-binding motifs.'
