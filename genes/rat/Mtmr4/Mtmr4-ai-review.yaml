- term:
    id: GO:0014894
    label: response to denervation involved in regulation of muscle adaptation
  evidence_type: IEP
  original_reference_id: PMID:19125695
  qualifier: involved_in
  review:
    summary: 'Rat-specific expression evidence: Mtmr4 protein falls about 90% in denervated gastrocnemius
      as Nedd4 rises; the term additionally claims a role in regulation of muscle adaptation, which was
      not tested.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Plant et al. (full text read) show decreased MTMR4 protein 30 days after tibial nerve transection
      in rat, attributed to Nedd4-mediated ubiquitination. This is a change in protein level, consistent
      with a response to denervation, but no experiment tested whether Mtmr4 regulates muscle adaptation,
      and the decrease is plausibly passive degradation. The precomposed "involved in regulation of muscle
      adaptation" part is therefore over-stated; the expression observation is recorded here as non-core.
    supported_by:
    - reference_id: PMID:19125695
      supporting_text: MTMR4 decreases approx. 90% with a 2-fold increase in Nedd4 expression
    - reference_id: file:rat/Mtmr4/Mtmr4-deep-research-manual.md
      supporting_text: no function of MTMR4 in muscle adaptation
