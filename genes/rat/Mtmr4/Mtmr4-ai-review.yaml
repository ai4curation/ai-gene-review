      resource: UNIPROT
      record: UniProtKB:A0A8I6A3Q2
      slot: CC:CATALYTIC ACTIVITY
      requested_change: CHECK
      asserted_value: EC:3.1.3.48
      cause: OTHER
      confidence: SUSPECTED
      explanation: The protein-tyrosine phosphatase reaction (EC 3.1.3.48) is assigned by PROSITE-ProRule
        PRU10044 from the generic PTP active-site motif shared by myotubularins. Myotubularin phosphatases
        act on 3-phosphoinositides (EC 3.1.3.64/3.1.3.95); no phosphotyrosine protein substrate of MTMR4
