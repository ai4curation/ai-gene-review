suggested_questions:
- question: Is the R-Smad (protein phosphoserine) phosphatase activity reported for MTMR4 reproducible
    outside the original laboratory, and is it direct (purified components) rather than mediated by PtdIns3P-dependent
    sequestration on endosomes?
- question: Does the decrease of Mtmr4 protein in denervated rat muscle have any functional consequence
    for muscle atrophy, or is it a passive consequence of NEDD4 up-regulation?
- question: What fraction of cellular PtdIns(3,5)P2 hydrolysis is attributable to MTMR4 compared with
    other active myotubularins?
suggested_experiments:
- description: Muscle-specific knockdown or overexpression of Mtmr4 (wild type, C407S and PY-motif mutant)
    in rat denervation atrophy, measuring endosomal PtdIns3P, fibre size and atrophy markers, to test
    whether Mtmr4 loss contributes to atrophy.
- description: In vitro phosphatase assays with purified rat Mtmr4 on PtdIns3P, PtdIns(3,5)P2 and C-terminally
    phosphorylated Smad peptides, to define its substrate specificity and kinetics.
