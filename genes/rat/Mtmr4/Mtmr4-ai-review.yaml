  review:
    summary: Protein tyrosine phosphatase activity via the EC 3.1.3.48 mapping from the generic PTP active-site
      signature. No phosphotyrosine protein substrate of MTMR4 has been reported.
    action: MARK_AS_OVER_ANNOTATED
    reason: Myotubularins share the PTP/DSP CX5R fold, which triggers the PROSITE PTP active-site rule
      and EC 3.1.3.48, but their physiological substrates are PtdIns3P and PtdIns(3,5)P2. The only protein
      substrates reported for MTMR4 are phosphoserine residues on R-Smads. In vitro hydrolysis of para-nitrophenylphosphate
      does not establish protein-tyrosine phosphatase activity. The EC mapping is a family-signature over-annotation.
    source_defects:
