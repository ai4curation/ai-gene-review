  review:
    summary: PtdIns3P 3-phosphatase activity is the defining catalytic activity of MTMR4; rat Mtmr4 retains
      the catalytic Cys407 CX5R loop.
    action: ACCEPT
    reason: Human MTMR4 (FYVE-DSP2) dephosphorylates PtdIns3P in vitro and lowers endosomal PtdIns3P in
      cells, and the catalytic-dead C407A mutant increases PtdIns3P-positive endosomes. Rat Mtmr4 conserves
      Cys407 and the full myotubularin phosphatase domain, so this ARBA annotation is correct and core.
    supported_by:
