core_functions:
- description: 'Endosome-resident phosphatidylinositol 3-phosphate 3-phosphatase: the FYVE domain targets
    the enzyme to PtdIns3P-rich early, recycling and late endosome membranes, where it hydrolyses PtdIns3P
    to PtdIns and limits the PtdIns3P content of these membranes, shaping endosomal sorting, recycling
    and endolysosomal/autophagic traffic.'
