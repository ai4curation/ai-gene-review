id: P29994
gene_symbol: Itpr1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Itpr1 encodes the type 1 inositol 1,4,5-trisphosphate receptor (IP3R1), a large (2,750-residue) multi-pass
  membrane protein that assembles into homo- or heterotetrameric ligand-gated Ca2+ release channels in the endoplasmic
  reticulum membrane and nuclear envelope. Binding of the second messenger IP3, produced by phospholipase C downstream
  of G protein-coupled and tyrosine kinase receptors, together with cytosolic Ca2+ (biphasic activation and inhibition)
  and ATP opens a six-transmembrane-helix pore per subunit, releasing Ca2+ from the ER lumen into the cytosol and
  nucleoplasm. Channel sensitivity is tuned by cAMP, PKA phosphorylation and many binding partners (e.g. calmodulin,
  IRBIT, Bcl-2/calcineurin, 4.1N, huntingtin/HAP1). IP3R1 is the predominant neuronal subtype, especially abundant
  in cerebellar Purkinje cells, and at ER-mitochondria contacts it couples to VDAC1 through GRP75 to supply Ca2+
  to mitochondria. IP3R1-mediated Ca2+ signals contribute to synaptic Ca2+ dynamics, motor coordination, egg activation,
  hepatocyte proliferation during liver regeneration and Ca2+-dependent cell death.
