suggested_questions:
- question: Human ITPR1 carries IDA annotations to calcium channel inhibitor activity and negative regulation of
    calcium-mediated signaling from PMID:16793548, a paper showing IRBIT (AHCYL1) inhibits IP3R. Should these be
    moved to AHCYL1, which would also remove the rat ISO rows?
- question: Does a functional plasma-membrane pool of IP3R1 (as opposed to IP3R3) exist in native rat cells, or
    is the plasma membrane IBA driven by other subtypes?
- question: Is the rat myotube sarcoplasmic reticulum IDA (PMID:16014380) attributable to IP3R1, given that the
    abstract places type 2 in the SR and type 1 in the inner nuclear membrane?
suggested_experiments:
- hypothesis: Nuclear-envelope IP3R1 generates nucleoplasmic Ca2+ transients independently of cytosolic release
    and drives CREB phosphorylation.
  description: Express IP3R1 restricted to the inner nuclear membrane (or ER-only) in IP3R-null cells and compare
    nucleoplasmic versus cytosolic Ca2+ and CREB phosphorylation after targeted IP3 uncaging.
  experiment_type: targeted expression with organelle Ca2+ imaging
