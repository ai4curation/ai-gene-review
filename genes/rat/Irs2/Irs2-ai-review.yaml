- description: 'Docking/adaptor protein for the activated insulin and IGF-1 receptor tyrosine kinases: binds the receptor
    via its PH/PTB domains, becomes tyrosine phosphorylated, and couples the receptor to SH2-domain effectors.'
  molecular_function: *id001
  locations:
  - id: GO:0005829
    label: cytosol
  directly_involved_in:
  - *id002
  - id: GO:0048009
    label: insulin-like growth factor receptor signaling pathway
  supported_by:
  - reference_id: PMID:7675087
    supporting_text: The protein IRS-1 acts as an interface between signalling proteins with Src-homology-2 domains (SH2 proteins)
      and the receptors for insulin, IGF-1
  - reference_id: PMID:7675087
    supporting_text: Alignment of the sequences of IRS-2 and IRS-1 revealed a highly conserved amino terminus containing a
      pleckstrin-homology domain and a phosphotyrosine-binding domain, and a poorly conserved carboxy terminus containing
      several tyrosine phosphorylation motifs.
  - reference_id: PMID:12891559
    supporting_text: there was a high level of IRS-2 expression and insulin-stimulated tyrosyl phosphorylation as early as
