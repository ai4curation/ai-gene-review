- term:
    id: GO:0005068
    label: transmembrane receptor protein tyrosine kinase adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:109334
  - MGI:MGI:99454
  - PANTHER:PTN000064809
  - RGD:2922
  review:
    summary: IRS-2 is the canonical docking/adaptor protein for the insulin and IGF-1 receptor tyrosine kinases.
    action: ACCEPT
    reason: The PH/PTB N-terminus binds the activated receptor, which phosphorylates C-terminal tyrosine motifs that then
      recruit SH2 proteins (PI3K p85, Grb2, SHP2). This is the defining molecular function of IRS-2; IBA, ISO and IEA rows
      agree.
    supported_by:
    - reference_id: PMID:7675087
      supporting_text: The protein IRS-1 acts as an interface between signalling proteins with Src-homology-2 domains (SH2
        proteins) and the receptors for insulin, IGF-1
    - reference_id: PMID:7675087
      supporting_text: Alignment of the sequences of IRS-2 and IRS-1 revealed a highly conserved amino terminus containing
        a pleckstrin-homology domain and a phosphotyrosine-binding domain, and a poorly conserved carboxy terminus containing
        several tyrosine phosphorylation motifs.
    - reference_id: Reactome:R-RNO-1168854
      supporting_text: Tyrosyl phosphorylation of IRS-1 and IRS-2 in response to insulin provides binding sites for specific
        proteins containing SH2 domains, including the 85-kDa regulatory subunit of phosphatidylinositol 3-kinase (PI3K),
        tyrosine phosphatase SHP2, and Grb2.
