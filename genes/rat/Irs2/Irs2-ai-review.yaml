    summary: IRS-2 is a core transducer of insulin and IGF-1 receptor signalling.
    action: ACCEPT
    reason: 'IRS-2 performs a step of these pathways: it is phosphorylated by the receptor kinase and recruits downstream
      effectors. Rat liver data and mouse knockouts support its role.'
    supported_by:
    - reference_id: PMID:22912850
      supporting_text: Phosphorylation of insulin receptor substrate (IRS)-2 on tyrosine residues is a key event in IGF-1/insulin
        signaling and leads to activation of the PI 3-kinase and the Ras/MAPK pathway.
    - reference_id: PMID:9495343
      supporting_text: disruption of IRS-2 impairs both peripheral insulin signalling and pancreatic beta-cell function.
