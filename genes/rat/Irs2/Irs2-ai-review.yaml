id: F1MAL5
gene_symbol: Irs2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Insulin receptor substrate 2 (IRS-2) is a large cytosolic docking/adaptor protein of the IRS family. An N-terminal
  pleckstrin-homology (PH) domain and IRS-type phosphotyrosine-binding (PTB) domain target it to activated insulin and IGF-1
  receptor tyrosine kinases (and cytokine receptor/JAK complexes), which phosphorylate multiple tyrosine motifs in its long
  disordered C-terminal tail. These phosphotyrosines recruit SH2-domain proteins, chiefly the p85 regulatory subunit of class
  IA PI3K (activating PI3K/Akt signalling), Grb2 (Ras/MAPK) and SHP2. Akt-dependent serine phosphorylation (e.g. Ser573) creates
  14-3-3 binding sites that dampen signalling. IRS-2 is the dominant insulin substrate in fetal liver and is essential in
  mice for hepatic insulin action and pancreatic beta-cell growth and survival; its expression is induced by glucose in beta-cells.
