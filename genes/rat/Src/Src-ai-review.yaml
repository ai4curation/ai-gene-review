suggested_questions:
- question: Many rat Src annotations rest on PP1/PP2, herbimycin A or pan-SFK antibodies (for example
    PMID:20537760, PMID:19230846, PMID:12655602). Which of these effects are specific to Src rather than
    Fyn or Yes?
- question: 'GO:0099073 mitochondrion-derived vesicle (IDA, PMID:10698670) and GO:1902737 dendritic filopodium
    (IDA, PMID:2462872): does the full text of these papers support the assigned locations, or were broader
    terms (cytoplasm, growth cone) intended?'
- question: Do the neuron-specific N1-Src and N2-Src isoforms, which have altered SH3 ligand specificity,
    take part in NMDA receptor regulation, or is that role specific to C-Src?
suggested_experiments:
- hypothesis: N1-Src and N2-Src phosphorylate a distinct set of neuronal substrates from C-Src.
  description: Isoform-selective knockdown of the N1/N2 microexons in rat cortical neurons followed by
    quantitative phosphotyrosine proteomics, compared with pan-Src knockdown.
  experiment_type: phosphoproteomics
- hypothesis: Src, not other SFKs, mediates the pharmacologically defined effects in rat vascular smooth
    muscle.
  description: Use analog-sensitive Src knock-in or isoform-specific siRNA rescue in rat aortic smooth
    muscle cells to test angiotensin II-induced Ras activation and proliferation.
  experiment_type: chemical genetics
