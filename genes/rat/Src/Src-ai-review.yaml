      kinase DAPK1 and the scaffold Dlg4 carry this term, so regulatory kinases of the receptor are within
      GO convention. The term is not an ancestor or descendant of any other term on this gene.'
    supported_by:
    - reference_id: PMID:9005855
      supporting_text: the endogenous tyrosine kinase Src was shown to regulate the activity of NMDA channels.
    - reference_id: PMID:9005855
      supporting_text: Src coprecipitated with NMDA receptor proteins. Finally, endogenous Src regulated
        the function of NMDA receptors at synapses.
    - reference_id: PMID:15069201
      supporting_text: ND2 acts as an adapter protein anchoring Src to the N-methyl-d-aspartate (NMDA)
        receptor complex, and is crucial for Src regulation of synaptic NMDA receptor activity.
