- name: 3 (N2-Src)
  id: Q9WUD9-3
  sequence_note: VSP_061495
existing_annotations:
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P12931
  review:
    summary: ISO from human SRC (IMP, PMID:21531765). Src is a membrane-associated signalling kinase;
      any repression of RNA polymerase II transcription is an indirect downstream consequence of signalling
      through transcription factors.
    action: MARK_AS_OVER_ANNOTATED
    reason: Src does not act on the transcription machinery; downstream gene-expression effects are better
      captured by its signalling roles. Annotating a direct negative transcription-regulation process
      to a cytoplasmic/membrane tyrosine kinase over-extends the donor phenotype.
    supported_by:
    - reference_id: UniProtKB:Q9WUD9
      supporting_text: Non-receptor protein tyrosine kinase which is activated following engagement of
        many different classes of cellular receptors including immune response receptors, integrins and
        other adhesion receptors, receptor protein tyrosine kinases, G protein-coupled receptors as well
        as cytokine receptors.
    - reference_id: UniProtKB:Q9WUD9
      supporting_text: Participates in signaling pathways that control a diverse spectrum of biological
        activities including gene transcription, immune response, cell adhesion, cell cycle progression,
        apoptosis, migration, and transformation.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P12931
        source_label: human SRC
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Donor carries this term with experimental support; the concern is the scope of the term
          for a signalling kinase, not the donor evidence.
- term:
    id: GO:0001819
    label: positive regulation of cytokine production
  evidence_type: IMP
  original_reference_id: PMID:19736311
  qualifier: involved_in
  review:
    summary: 'Rat VSMC study: 15(S)-HETE induced MCP-1 expression via Src-STAT-3 signalling.'
    action: KEEP_AS_NON_CORE
    reason: Src kinase activity is required upstream of STAT-3 for MCP-1 expression; a valid but context-specific
      downstream outcome of its signalling role.
    supported_by:
    - reference_id: PMID:19736311
      supporting_text: 15(S)-HETE also induced monocyte chemoattractant protein-1 (MCP-1) expression via
        Src-STAT-3 signaling
- term:
    id: GO:0002102
    label: podosome
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: located_in
  supporting_entities:
  - MGI:MGI:98397
  review:
    summary: ISO from mouse Src. Src is required for podosome formation and localizes there.
    action: KEEP_AS_NON_CORE
    reason: Podosome localization is well established for Src in osteoclasts and transformed cells; peripheral
      to the core function. The rat transfer is plausible because Src is a 1:1 ortholog with conserved
      SH3, SH2 and kinase domains, but the term describes one of many contexts in which the kinase acts
      rather than its defining activity.
    supported_by:
    - reference_id: UniProtKB:Q9WUD9
      supporting_text: Required for podosome formation
