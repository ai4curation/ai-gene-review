- term:
    id: GO:0004713
    label: protein tyrosine kinase activity
  evidence_type: EXP
  original_reference_id: PMID:26026271
  qualifier: enables
  review:
    summary: Protein tyrosine kinase activity is the defining activity of Src; rat data show kinase activity
      of the c-Src, N1-Src and N2-Src isoforms and of endogenous c-Src in several rat cell systems.
    action: MODIFY
    reason: The activity is correct and core, but Src is a cytoplasmic, myristoyl-anchored kinase without
      a transmembrane segment, so the more specific GO:0004715 non-membrane spanning protein tyrosine
      kinase activity (a descendant of GO:0004713, already on this gene by IBA/IEA/ISO) is the right core
      term.
    supported_by:
    - reference_id: UniProtKB:Q9WUD9
      supporting_text: Non-receptor protein tyrosine kinase which is activated following engagement of
        many different classes of cellular receptors including immune response receptors, integrins and
        other adhesion receptors, receptor protein tyrosine kinases, G protein-coupled receptors as well
        as cytokine receptors.
    - reference_id: PMID:26026271
      supporting_text: N2-Src also had a higher basal kinase activity than N1- and C-Src in vitro and
        in cells, which could be explained by weakened intramolecular interactions.
    proposed_replacement_terms:
    - id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
