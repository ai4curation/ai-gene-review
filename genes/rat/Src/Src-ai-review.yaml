- description: Myristoyl-anchored non-receptor protein tyrosine kinase activated at the plasma membrane
    and focal adhesions by integrin, receptor tyrosine kinase and cytokine receptor engagement; phosphorylates
    receptor cytoplasmic domains and focal adhesion proteins (FAK, paxillin) to relay adhesion and growth
    factor signals.
