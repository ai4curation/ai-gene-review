id: Q9WUD9
gene_symbol: Src
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Src (pp60c-src) is the rat proto-oncogene non-receptor protein tyrosine kinase, the founding
  member of the Src family. It has an N-terminal myristoylated unique region, SH3 and SH2 domains and
  a C-terminal tyrosine kinase domain; it is held inactive by CSK phosphorylation of Tyr530 and SH2/SH3
  intramolecular engagement, and is activated by dephosphorylation of Tyr530 and autophosphorylation of
  Tyr419. Anchored at the cytoplasmic face of the plasma membrane, Src is recruited to integrin, receptor
  tyrosine kinase, G protein-coupled receptor (for example angiotensin II AT1) and cytokine receptor complexes,
  where it phosphorylates receptors, focal adhesion proteins (FAK, paxillin), junctional proteins and
  signalling enzymes, relaying signals to the Ras-MAP kinase and PI3K-Akt pathways that control adhesion,
  migration, proliferation and survival. In neurons, where the N1-Src and N2-Src splice isoforms are also
  expressed, Src is anchored to the NMDA receptor complex through ND2 and PSD-95 at glutamatergic synapses
  and up-regulates NMDA receptor channel activity. Additional pools act at caveolae, endosomes and brain
  mitochondria, and Src is required for osteoclastic bone resorption.
