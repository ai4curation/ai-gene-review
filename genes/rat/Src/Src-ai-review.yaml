      supporting_text: Insulin caused an immediate stimulation of Src and induced its physical association
        with both IR and PKCdelta.
    - reference_id: PMID:19952103
      supporting_text: Thus, the regulatory domain of PKCdelta via interaction with Src appears to determine
        the role of PKCdelta as a positive regulator of IR signaling in skeletal muscle.
