  review:
    summary: Ortholog transfer of the mouse annotation that HSD11beta2 is the oxysterol
      synthase producing 7-ketocholesterol, precursor of SMO-activating oxysterols,
      and thereby promotes Hedgehog pathway activity (ISO from mouse Hsd11b2, GO_REF:0000121).
    action: KEEP_AS_NON_CORE
    reason: The mouse donor annotation rests on direct experiments rather than inference,
      including shRNA depletion and pharmacologic inhibition that attenuated Hedgehog
      signalling downstream of PTCH1 and upstream of SUFU, and rescue of pathway
      activity by the oxysterols made downstream of the enzyme (PMID:30340023). Rat
      Hsd11b2 is the one-to-one ortholog and its UniProt record carries the same
      7beta-hydroxycholesterol to 7-ketocholesterol conversion, so the transfer is
      appropriate. It is non-core rather than core because the enzyme supplies a
      ligand precursor upstream of the pathway rather than acting in it, and because
      only cell types expressing the enzyme in Hedgehog-active domains are affected;
      the defining role of the rat enzyme remains NAD(+)-dependent glucocorticoid
      inactivation. The earlier reading of this row as an indirect glucocorticoid
      effect is contradicted by the donor paper, in which cerebellar deletion of
      the enzyme did not alter glucocorticoid target gene expression.
