id: P50233
gene_symbol: Hsd11b2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Hsd11b2 encodes NAD-dependent 11beta-hydroxysteroid dehydrogenase type
  2, a microsomal/endoplasmic-reticulum short-chain dehydrogenase that oxidizes active
  11beta-hydroxyglucocorticoids such as corticosterone to inactive 11-keto forms
  such as 11-dehydrocorticosterone. The oxidation is high-affinity (KM about 10 nM
  for corticosterone) and essentially unidirectional, so the enzyme acts as a pre-receptor
  gatekeeper. By locally depleting active glucocorticoids in aldosterone-sensitive
  epithelia (distal nephron, distal colon, salivary and sweat glands) it confers
  aldosterone specificity on the otherwise non-selective mineralocorticoid receptor,
  and in placenta and fetal tissues it limits fetal exposure to maternal corticosterone.
  It is the inactivating member of the 11beta-HSD pair, distinct from the reductive,
  NADPH-dependent Hsd11b1. Loss of activity produces apparent mineralocorticoid excess,
  with sodium and water retention, hypokalaemia and salt-sensitive hypertension.
  Secondary activities of the mammalian enzyme include oxidation of 11beta-hydroxyandrogens
  to bioactive 11-ketoandrogens, and oxidation of 7beta-hydroxycholesterol to 7-ketocholesterol,
  the precursor of oxysterols that bind and activate Smoothened; through the latter
  the enzyme can potentiate Hedgehog signalling in cell types where it is expressed
  in domains of active Hedgehog activity, including cerebellar granule cell precursors
  and Hedgehog-driven tumours.
