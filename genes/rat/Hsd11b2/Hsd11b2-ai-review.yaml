      supporting_text: Like sterol depletion, depleting HSD11β2 attenuated HH signaling
        in Ptch1−/− MEFs, but not Sufu−/− MEFs, suggesting that HSD11β2 modulates
        HH signaling downstream of PTCH1 and upstream of SUFU
