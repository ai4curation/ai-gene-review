- term:
    id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: Hsd11b2 contributes to smoothened pathway activation through its oxysterol-synthase
      side activity, oxidizing 7beta-hydroxycholesterol to 7-ketocholesterol, the
      precursor of the SMO-binding oxysterols 7-keto,27-hydroxycholesterol and 7beta,27-dihydroxycholesterol
      (IEA ortholog transfer from mouse Hsd11b2/UniProtKB:P51661, where the role
      was shown directly).
    action: KEEP_AS_NON_CORE
    reason: The donor evidence is direct, not inferential. In mouse, depletion or
      pharmacologic inhibition of HSD11beta2 attenuated Hedgehog signalling in Ptch1-null
      MEFs but not Sufu-null MEFs, reduced ciliary SMO accumulation, and lowered
      7-ketocholesterol in cells and cilia, with the downstream oxysterols restoring
      pathway activity (PMID:30340023). UniProt records the same 7beta-hydroxycholesterol
      to 7-ketocholesterol conversion for the rat enzyme, so the term transfers.
      It is kept as non-core because the enzyme catalyses a biosynthetic step upstream
      of the SMO ligand rather than acting within the pathway, and because the effect
      is restricted to cell types that express the enzyme in domains of active Hedgehog
      signalling (cerebellar external granule layer, Hedgehog-associated medulloblastoma)
      rather than to the glucocorticoid-barrier epithelia that define its main role.
      An earlier rationale that any smoothened effect must be an indirect consequence
      of glucocorticoid inactivation does not hold, because cerebellar deletion of
      the enzyme left glucocorticoid target gene expression unchanged while still
      impairing Hedgehog-driven growth.
    supported_by:
    - reference_id: PMID:30340023
      supporting_text: Either genetic or pharmacologic inhibition of HSD11β2, an
        oxysterol synthase, attenuates HH signal transduction and the growth of HH
        pathway-associated medulloblastoma.
      reference_section_type: RESULTS
    - reference_id: PMID:30340023
      supporting_text: However, deletion of HSD11β2 in the cerebellum did not affect
        glucocorticoid target gene expression (Figures S5A and S5B), suggesting that
        HSD11β2 may not be critical for restraining physiological levels of glucocorticoids
        in the cerebellum.
      reference_section_type: RESULTS
    - reference_id: UniProtKB:P50233
      supporting_text: a precursor of 7-keto,27-hydroxycholesterol, which activates
        smoothened (SMO) and the smoothened signaling pathway
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:P51661
        source_status: SUPPORTS_TRANSFER
        comment: Mouse donor record carries the directly demonstrated oxysterol-synthase
          role (PMID:30340023); rat is the one-to-one ortholog and its UniProt record
          carries the same reaction, so the transfer is sound, but the role is secondary
          to glucocorticoid inactivation and confined to Hedgehog-active tissues.
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P51661
  - ensembl:ENSMUSP00000034363
- term:
    id: GO:0047022
    label: 7-beta-hydroxysteroid dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: 7-beta-hydroxysteroid dehydrogenase activity is a genuine secondary
      activity of 11beta-HSD2, which oxidizes 7beta-hydroxycholesterol to 7-ketocholesterol;
      the rat record carries the corresponding reaction (RHEA:68656) and the activity
      was shown directly for the mouse ortholog.
    action: KEEP_AS_NON_CORE
    reason: This is not a family-level guess. Mouse HSD11beta2 oxidizes 7beta-hydroxycholesterol
      to 7-ketocholesterol - overexpression increased 7-ketocholesterol production
      from 7beta-hydroxycholesterol but not from the 7alpha isomer, and inhibition
      reduced 7-ketocholesterol in cells and cilia (PMID:30340023). UniProt records
      the 7-oxocholesterol/7beta-hydroxycholesterol reaction (RHEA:68656) and the
      7beta-hydroxycholesterol to 7-ketocholesterol conversion for the rat enzyme.
      It is kept as non-core because the defining, high-affinity activity is NAD(+)-dependent
      oxidation of 11beta-hydroxyglucocorticoids, and with one caveat - the GO term
      specifies NADP(+) as cofactor, and while the UniProt reaction is written with
      NADP(H), the cofactor actually used for the 7beta-oxidation by the rat enzyme
      has not been established experimentally; that cofactor clause, not the 7beta-oxidation
      chemistry, is the part of the term that remains unverified for rat.
    supported_by:
    - reference_id: PMID:30340023
      supporting_text: HSD11β2 increased 7k-C production in 7β-OHC-treated cells,
        but not in 7a-OHC-treated cells (Figure 4B).
      reference_section_type: RESULTS
    - reference_id: PMID:30340023
      supporting_text: Pharmacologic inhibition of HSD11β2 reduced 7k-C in LLC-PK1
        cells and cilia (Figure 4E), further indicating that HSD11β2 generates 7k-C.
      reference_section_type: RESULTS
    - reference_id: UniProtKB:P50233
      supporting_text: Catalyzes the conversion of 7-beta-hydroxycholesterol into
        7-ketocholesterol
  qualifier: enables
  supporting_entities:
  - UniProtKB:P51661
  - ensembl:ENSMUSP00000034363
  - RHEA:68656
