- id: PMID:30340023
  title: Cilia-Associated Oxysterols Activate Smoothened.
  findings:
  - statement: HSD11B2 acts as an oxysterol synthase, oxidizing 7beta-hydroxycholesterol
      to 7-ketocholesterol, the precursor of Smoothened-activating oxysterols.
    supporting_text: 7k-C production in HEK293T cells overexpressing HSD11β2 was inhibited
      by CNX (Figure 4B), suggesting that HSD11β2 converts 7β-OHC to 7k-C.
    reference_section_type: RESULTS
  - statement: The oxidation is specific to the 7beta isomer of hydroxycholesterol.
    supporting_text: HSD11β2 increased 7k-C production in 7β-OHC-treated cells, but
      not in 7a-OHC-treated cells (Figure 4B).
    reference_section_type: RESULTS
  - statement: Loss of HSD11B2 attenuates Hedgehog signalling between PTCH1 and SUFU,
      and the oxysterols made downstream of the enzyme restore pathway activity.
    supporting_text: Like sterol depletion, depleting HSD11β2 attenuated HH signaling
      in Ptch1−/− MEFs, but not Sufu−/− MEFs, suggesting that HSD11β2 modulates HH
      signaling downstream of PTCH1 and upstream of SUFU
    reference_section_type: RESULTS
  - statement: The Hedgehog effect is not a secondary consequence of glucocorticoid
      inactivation, since cerebellar deletion of the enzyme left glucocorticoid target
      gene expression unchanged.
    supporting_text: However, deletion of HSD11β2 in the cerebellum did not affect
      glucocorticoid target gene expression (Figures S5A and S5B), suggesting that
      HSD11β2 may not be critical for restraining physiological levels of glucocorticoids
      in the cerebellum.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text available and read; this is the donor evidence
