- id: file:rat/Hsd11b2/Hsd11b2-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: rat Hsd11b2 (11-beta-hydroxysteroid
    dehydrogenase type 2, UniProt P50233)'
  findings:
  - statement: 11beta-HSD2 is the inactivating (oxidative) member of the 11beta-HSD
      pair, distinct from the reductive 11beta-HSD1.
    supporting_text: 11β‑HSD2 is the inactivating dehydrogenase
    reference_section_type: OTHER
  - statement: The catalyzed reaction is the oxidation/inactivation of active glucocorticoids
      to their inert 11-keto forms.
    supporting_text: '11β‑HSD2 catalyzes oxidation/inactivation of glucocorticoids:
      **cortisol→cortisone** and **corticosterone→11‑dehydrocorticosterone**.'
    reference_section_type: OTHER
  - statement: The enzyme uses NAD(+) as cofactor, consistent with SDR-family oxidative
      directionality in epithelia.
    supporting_text: 11β‑HSD2 is described as **NAD-dependent/NAD+-dependent**, consistent
      with SDR-family dehydrogenase directionality in epithelia.
    reference_section_type: OTHER
  - statement: By locally removing active glucocorticoids the enzyme confers aldosterone
      specificity on the otherwise non-selective mineralocorticoid receptor.
    supporting_text: 11β‑HSD2 enables aldosterone-specific MR signaling** in target
      cells by locally removing active glucocorticoids.
    reference_section_type: OTHER
  - statement: Glucocorticoids circulate far in excess of aldosterone; the enzyme
      prevents them occupying MR while aldosterone, not a substrate, signals through
      MR.
    supporting_text: aldosterone is not a substrate and can therefore signal through
      MR.
    reference_section_type: OTHER
  - statement: Canonical sites of action are the classic aldosterone-sensitive epithelia.
    supporting_text: Canonical sites include **distal nephron/kidney**, **colon**,
      **salivary glands**, and **sweat glands**
    reference_section_type: OTHER
  - statement: The enzyme acts as a placental/fetal barrier limiting fetal exposure
      to maternal glucocorticoids.
    supporting_text: 11β‑HSD2 is highly expressed in **placenta and fetal tissues**
      where it **minimizes fetal exposure to maternal glucocorticoids**
    reference_section_type: OTHER
  - statement: In adult rodent CNS the enzyme is restricted to discrete hindbrain
      regions supporting aldosterone-specific control of salt appetite and blood pressure.
    supporting_text: nucleus of the solitary tract** and **subcommissural organ**,
      where 11β-HSD2 supports aldosterone-specific control of **salt appetite** and
      influences **blood pressure**.
    reference_section_type: OTHER
  - statement: Loss of enzyme function causes apparent mineralocorticoid excess (AME),
      underscoring its physiological role.
    supporting_text: Loss of 11β‑HSD2 function causes **AME**
    reference_section_type: OTHER
core_functions:
- description: Hsd11b2 inactivates active glucocorticoids through NAD-dependent 11beta-hydroxysteroid
    dehydrogenase activity, oxidizing corticosterone (and cortisol in species that
    produce it) to inactive 11-keto forms and thereby conferring aldosterone specificity
    on the mineralocorticoid receptor.
  supported_by:
  - reference_id: UniProtKB:P50233
    supporting_text: 'FUNCTION: Catalyzes the conversion of biologically active 11beta-hydroxyglucocorticoids
      such as corticosterone to inactive 11-ketoglucocorticoids such as 11-dehydrocorticosterone,
      in the presence of NAD(+).'
  - reference_id: file:rat/Hsd11b2/Hsd11b2-deep-research-falcon.md
    supporting_text: '11β‑HSD2 catalyzes oxidation/inactivation of glucocorticoids:
      **cortisol→cortisone** and **corticosterone→11‑dehydrocorticosterone**.'
  - reference_id: file:rat/Hsd11b2/Hsd11b2-deep-research-falcon.md
    supporting_text: 11β‑HSD2 enables aldosterone-specific MR signaling** in target
      cells by locally removing active glucocorticoids.
  molecular_function:
