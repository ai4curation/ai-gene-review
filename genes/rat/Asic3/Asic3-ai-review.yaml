id: O35240
gene_symbol: Asic3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Acid-sensing ion channel 3 (ASIC3, DRASIC) is a two-transmembrane subunit of the DEG/ENaC family that
  assembles, alone or with ASIC1 and ASIC2, into trimeric proton-gated cation channels selective for Na+. It is
  expressed mainly in sensory neurons of dorsal root and other ganglia, where it is located at the plasma membrane
  of somata, processes and sensory endings. ASIC3 opens with high proton sensitivity near pH 7 and produces a biphasic
  current with a fast transient and a sustained component; the channel is enhanced by lactate and hypertonicity,
  inhibited by amiloride, gadolinium and the toxin APETx2, and its surface level and kinetics are tuned by C-terminal
  PDZ scaffolds (CIPP/PATJ, NHERF-1, PSD-95, Lin-7b) and by stomatin-family proteins. ASIC3 is the proton sensor
  that depolarizes nociceptors during tissue acidosis, as in myocardial ischemia and inflammation, and knockout
  studies implicate it in modulation of mechanosensation and hyperalgesia.
