- term:
    id: GO:0031334
    label: positive regulation of protein-containing complex assembly
  evidence_type: IDA
  original_reference_id: PMID:12023974
  qualifier: involved_in
  review:
    summary: Based on the observation that TRH increases the abundance of receptor homodimers.
    action: MARK_AS_OVER_ANNOTATED
    reason: The finding is that the agonist TRH stabilises or promotes the receptor's own
      self-association. It is the ligand, not the receptor, that modulates dimer abundance, and
      the receptor is not shown to regulate the assembly of any other complex. The homodimer
      itself is better captured as protein homodimerization activity. Only the abstract was
      available, so not removed.
    supported_by:
    - reference_id: PMID:12023974
      supporting_text: The abundance of receptor dimers was increased when cells had been
        stimulated by TRH, indicating that TRH either stabilizes pre-existing dimers or increases
        dimer formation.
