suggested_questions:
- question: Does agonist-promoted TRH-R1 homodimerization (PMID:12023974) have a functional
    role in desensitization or internalization, and should GO:0031334 be retained for it?
- question: Which physiological outputs (TSH and prolactin secretion) should carry rat-specific
    experimental annotation for Trhr, given that current GOA rows lack any endocrine process term?
suggested_experiments:
- description: Test whether dimerization-deficient TRH-R1 mutants differ in arrestin
    recruitment and internalization kinetics in pituitary GH cells.
  experiment_type: mutagenesis with BRET-based arrestin recruitment and internalization assays
