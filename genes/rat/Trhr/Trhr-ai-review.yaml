  label: Rattus norvegicus
description: Trhr encodes thyrotropin-releasing hormone receptor 1 (TRH-R1), a rhodopsin-like
  (class A) seven-transmembrane G protein-coupled receptor of the plasma membrane. It binds
  the hypothalamic tripeptide TRH (pGlu-His-Pro-NH2) and couples to Gq/G11, activating
  phospholipase C and the inositol trisphosphate/Ca2+ and diacylglycerol/protein kinase C
  pathways. It is highly expressed in anterior pituitary thyrotrophs and lactotrophs, where it
  mediates TRH-stimulated TSH and prolactin release, and is also found in hypothalamus and
  brain stem. Two splice isoforms differing in the C-terminal tail, TRH-R(412) and TRH-R(387),
  are both fully functional. The receptor forms homodimers whose abundance and phosphorylation
  increase on agonist stimulation, events linked to desensitization and internalization.
