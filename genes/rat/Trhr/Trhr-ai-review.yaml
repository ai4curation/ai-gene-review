- id: PMID:12023974
  title: Dimerization and phosphorylation of thyrotropin-releasing hormone receptors are
    modulated by agonist stimulation.
  findings:
  - statement: Rat TRH receptors form homodimers; TRH increases dimer abundance and
      phosphorylation independently of PLC signalling.
    supporting_text: The ability of TRH to increase receptor phosphorylation and dimerization did
      not depend on signal transduction, because it was not inhibited by the phospholipase C
      inhibitor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; PMID and title match the cached PubMed record. Sole GOA source
      for experimental rows.
