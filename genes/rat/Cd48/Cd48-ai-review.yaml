suggested_questions:
- question: What are the relative physiological contributions of CD2-CD48 and 2B4-CD48 (and rat 2B4R-CD48) interactions in rat T cell and NK cell responses, given that all share the same CD48 binding face?
- question: Does rat CD48 on endothelium act as a CD2/2B4 ligand during leukocyte-endothelial interactions, and is endothelial CD48 expression conserved in other species?
- question: Does the rat CD48 orthologue participate in the LCK/LAT recruitment to the TCR/CD3 complex described for human CD48, given that rodent CD2 binds CD48 rather than CD58?
- question: Is CD48-2B4 (and CD48-2B4R) signalling activating or inhibitory in rat NK cells?
suggested_experiments:
- hypothesis: Rat CD48 engagement of 2B4 and 2B4R activates rat NK-cell cytotoxicity, whereas engagement of CD2 primarily supports adhesion.
  description: Generate rat CD48 V-domain mutants that selectively abolish CD2 or CD244/2B4R binding (guided by the 2DRU structure), express them on target cells and measure rat NK killing, conjugate formation and T cell proliferation.
  experiment_type: mutagenesis with functional assays
- hypothesis: CD48 on rat mast cells mediates bacterial binding and degranulation.
  description: Knock down Cd48 in a rat mast cell line (e.g. RBL-2H3) and measure mycobacterial or FimH-expressing E. coli binding and beta-hexosaminidase/histamine release, with rescue by wild-type CD48.
  experiment_type: genetic perturbation with functional assay
