id: P10252
gene_symbol: Cd48
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Cd48 encodes CD48 (the MRC OX-45 antigen; SLAMF2, BCM1), a glycosylphosphatidylinositol (GPI)-anchored cell-surface glycoprotein of the CD2/SLAM subset of the immunoglobulin superfamily. The mature protein consists of a membrane-distal V-set domain that lacks a disulfide bond and a membrane-proximal C2-set domain, and is heavily N-glycosylated; the C-terminal propeptide is replaced by a GPI anchor attached to a serine residue, placing CD48 on the outer leaflet of the plasma membrane, where like other GPI-anchored proteins it partitions into lipid rafts. In the rat it is broadly expressed on leukocytes and also on endothelium. CD48 binds, through the flat, charged face of its V-set domain, two receptors of the same family: CD2 on T cells, for which CD48 is the principal ligand in rodents, with very low affinity and fast kinetics, and the NK-cell receptor 2B4 (CD244), and in rat also the related 2B4R. Through these interactions CD48 mediates transient heterotypic cell-cell contacts
  and regulates NK and T cell responses; the CD48-2B4 signal is activating in human NK cells but predominantly inhibitory in mouse, and its direction in rat is not known. On mast cells, CD48 has also been implicated in the binding of bacteria and in mast cell activation by mycobacteria. A soluble form, reported for human CD48, may be released from the cell surface.'
