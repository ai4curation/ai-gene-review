  review:
    summary: Direction of CD48-2B4 signalling in rat NK cells is not established; the positive term derives from human, where the axis is activating, whereas in mouse it is predominantly inhibitory.
    action: UNDECIDED
    reason: 'The human-derived positive term cannot be assumed for rodents: in mouse, CD48 engagement of 2B4 inhibits NK cytotoxicity (PMID:15123744) and Slam-locus deletion enhances NK activation (PMID:27573813), opposite to human (PMID:16002700). No rat NK functional data on CD48-2B4 direction were found, and rat additionally expresses the related receptor 2B4R. Mouse Cd48 rows were therefore changed to regulation of natural killer cell activation; rat is left UNDECIDED pending rat-specific evidence rather than inferring from either species.'
    supported_by:
    - &id007
      reference_id: PMID:16002700
      supporting_text: In human NK cells, 2B4/CD48 interaction induces activation signals, whereas in murine NK cells it sends inhibitory signals.
    - &id008
      reference_id: PMID:15123744
      supporting_text: Surprisingly, we have found, using antibody-blocking and 2B4-deficient NK cells, that NK lysis of CD48(+) tumor and allogeneic targets is inhibited by 2B4 ligation.
    - &id009
      reference_id: PMID:27573813
      supporting_text: Analyses of mice lacking individual SFRs showed that the inhibitory function of the Slam locus was due solely to 2B4 and was not influenced positively or negatively by other SFRs.
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      source_entities:
      - source_id: PANTHER:PTN008532944
        comment: PAINT node seeded by human CD2 and human CD48 (UniProtKB:P09326), where CD48-2B4 signalling activates NK cells. Rodent Cd48 is inside the clade; the divergence is in the direction of the 2B4 output in rodents, not in CD48 binding. Rat direction is untested.
        source_status: UNRESOLVED
