  evidence_type: IDA
  original_reference_id: PMID:16803907
  review:
    summary: Rat CD48 binds the T-cell adhesion molecule CD2 through the flat, charged face of its N-terminal V-set domain; the rat CD2-CD48 complex has been studied structurally and thermodynamically.
    action: NEW
    reason: Rat CD48 is the principal CD2 ligand in rats; binding has been characterized by mutagenesis and ionic-strength studies (PMID:9576909) and by crystal structure plus calorimetry of the rat CD48 receptor-binding domain (PMID:16803907). No existing annotation captures this interaction specifically; it replaces the uninformative protein-containing complex annotation. Molecular function, not a process term, so the participation test does not apply; consistent with the term proposed for human CD48 CD2 binding.
