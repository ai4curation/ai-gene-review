id: F1LSL7
gene_symbol: Klf5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Krueppel-like factor 5 (Klf5; also BTEB2/IKLF) is a nuclear C2H2 zinc-finger transcription
  factor of the KLF family. Its three C-terminal zinc fingers bind GC-rich/CACCC (TCE) elements in RNA
  polymerase II promoters, and it mainly acts as a transcriptional activator of growth and differentiation
  genes such as PDGF-A, TGF-beta, PPARgamma2, cyclin D1 and myogenic genes (with MyoD and Mef2). In vascular
  smooth muscle cells it can also repress p21 within an RARalpha-HDAC2 complex, with acetylation and deacetylation
  of Klf5 switching this output. Klf5 is induced by stress and growth stimuli (angiotensin II, endothelin-1
  via ERK1/2) and contributes to vascular remodeling and angiogenesis, adipocyte differentiation, skeletal
  muscle regeneration, intestinal crypt epithelial proliferation and LIF-dependent embryonic stem cell
  plasticity.
