- id: PMID:14726538
  title: Intestinal tumor progression is associated with altered function of KLF5.
  full_text_unavailable: true
  findings:
  - statement: KLF5 expression in non-transformed rat IEC-18 cells enhances colony formation, cyclin D1
      transcription and growth; effects reverse in transformed cells.
    supporting_text: enhances colony formation, cyclin D1 transcription, and cell growth
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Rat IEC-18 gain-of-function growth data plus crypt expression; context-dependent
      effect on proliferation. GOA IEP code looks inappropriate for the growth data.
- id: PMID:18406357
  title: 'Differential regulation of Krüppel-like factor family transcription factor expression in neonatal
    rat cardiac myocytes: effects of endothelin-1, oxidative stress and cytokines.'
  findings:
  - statement: Endothelin-1 induces Klf5 mRNA in rat cardiac myocytes, requiring new protein synthesis.
    supporting_text: Klf5 mRNA was upregulated from 1 h, with maximal expression at 1.5 h
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Full text read. Expression study only: Klf5 is a second-phase, ERK1/2-dependent endothelin-1-induced
      gene in neonatal rat cardiac myocytes.'
- id: PMID:21383775
  title: HDAC2 phosphorylation-dependent Klf5 deacetylation and RARα acetylation induced by RAR agonist
    switch the transcription regulatory programs of p21 in VSMCs.
  findings:
  - statement: Klf5 binds TCE sites of the p21 promoter and represses it with RARalpha and HDAC2; RAR
      agonist triggers HDAC2-mediated Klf5 deacetylation and release.
