  qualifier: involved_in
  review:
    summary: Positive regulation of cell population proliferation (rat IEC-18 intestinal epithelial cells).
    action: KEEP_AS_NON_CORE
    reason: The abstract shows KLF5 is restricted to proliferating crypt cells and that its expression
      in non-transformed rat IEC-18 cells enhances colony formation and growth (but not in transformed
      cells). The claim is reasonable and context-dependent, downstream of cyclin D1 activation. The supporting
      data are gain-of-function, not an expression pattern, so the IEP code looks wrong (flagged). Abstract
      only.
    supported_by:
    - &id020
      reference_id: PMID:14726538
      supporting_text: expression of KLF5 (IKLF/BTEB2) is limited to proliferating crypt cells
    - *id011
    - reference_id: PMID:14726538
      supporting_text: KLF5 reduced colony number, failed to enhance cyclin D1 transcription, and was
        negatively correlated with cell growth in colon cancer cell lines
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: RGD
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000270
      confidence: SUSPECTED
      explanation: IEP supports only an expression response; the cited abstract reports overexpression
        of KLF5 in rat IEC-18 cells enhancing colony formation and cell growth, which would be IDA/IMP-type
        evidence for a regulation process. Please check whether the code should change.
      supported_by:
