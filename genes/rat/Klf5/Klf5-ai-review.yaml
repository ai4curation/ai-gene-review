  review:
    summary: Negative regulation of Pol II transcription.
    action: KEEP_AS_NON_CORE
    reason: Klf5 represses p21 through TCE sites together with RARalpha and HDAC2 in rat VSMCs; repression
      is a real but secondary, context-dependent output of a mainly activating factor. Rat Klf5 is the
      1:1 orthologue of mouse Klf5 (MGI:1338056) and human KLF5 (Q13887), with an identical three-zinc-finger
      DNA-binding domain; the transfer itself is sound.
    supported_by:
    - &id006
      reference_id: PMID:21383775
      supporting_text: mutation of TCE sites removed the inhibitory effect of Klf5, but not RARα
    - &id014
      reference_id: PMID:21383775
      supporting_text: Klf5, RARα and HDAC2 form a repression complex to synergistically inhibit the expression
        of p21 under basal conditions
    - &id005
      reference_id: PMID:21383775
      supporting_text: many of the genes identified to date as direct targets of Klf5 are transactivated
        by Klf5
