- id: PMID:10995551
  title: Localization and phosphorylation of Abl-interactor proteins, Abi-1 and Abi-2, in the developing
    nervous system.
  findings:
  - statement: Rat/rodent Abi1 and Abi2 are concentrated in synaptosomes and growth cone particles in
      developing brain.
    supporting_text: Both Abi and Abl proteins are present in synaptosomes and growth cone particles.
- id: PMID:11516653
  title: The Abl interactor proteins localize to sites of actin polymerization at the tips of lamellipodia
    and filopodia.
  findings: []
- id: PMID:12672821
  title: Abl interactor 1 promotes tyrosine 296 phosphorylation of mammalian enabled (Mena) by c-Abl kinase.
  findings: []
- id: PMID:15048123
  title: Abi1 is essential for the formation and activation of a WAVE2 signalling complex.
  findings: []
- id: PMID:15572692
  title: ABI2-deficient mice exhibit defective cell migration, aberrant dendritic spine morphogenesis,
    and deficits in learning and memory.
  findings: []
- id: PMID:15755804
  title: Analysis of mouse embryonic patterning and morphogenesis by forward genetics.
  findings: []
- id: PMID:16831833
  title: Axis specification and morphogenesis in the mouse embryo require Nap1, a regulator of WAVE-mediated
    actin branching.
  findings: []
- id: PMID:17101133
  title: NESH (Abi-3) is present in the Abi/WAVE complex but does not promote c-Abl-mediated phosphorylation.
  findings: []
- id: PMID:17304222
  title: Abelson interacting protein 1 (Abi-1) is essential for dendrite morphogenesis and synapse formation.
  findings:
  - statement: Rat Abi1 localizes to growth cones and dendritic spine PSDs with Eps8, Sos1, and Shank3,
      regulates dendrite branching and spine maturation, and translocates upon NMDA stimulation in an
      Abl-dependent manner to the nucleus where it binds Myc/Max.
    supporting_text: Abi-1 translocates upon NMDA application from PSDs to nuclei. Nuclear entry depends
      on abelson kinase activity. Abi-1 co-immunoprecipitates with the transcription factor complex of
      Myc/Max proteins and enhances E-box-regulated gene transcription.
