id: Q9QZM5
gene_symbol: Abi1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Rat Abl interactor 1 (Abi1) is a multidomain signaling adaptor and core subunit of the heteropentameric
  WAVE regulatory complex (WRC) that couples Rac GTPase and c-Abl tyrosine kinase signaling to Arp2/3-mediated
  branched actin filament nucleation at lamellipodia, filopodia tips, neuronal growth cones, and excitatory
  postsynaptic densities. In addition to assembling cytosolic and leading-edge WRC and Eps8-Abi1-Sos1
  complexes, rat Abi1 binds via its C-terminal SH3 domain to a proline-rich consensus motif in ProSAP2/Shank3
  within dendritic spine postsynaptic densities to restrain excessive dendrite branching and promote spine
  maturation, and undergoes NMDA- and Abl-dependent synapto-nuclear translocation to associate with Myc/Max
  transcription factors.
