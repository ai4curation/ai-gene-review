  title: The cell migration molecule UNC-53/NAV2 is linked to the ARP2/3 complex by ABI-1.
  findings: []
- id: PMID:19200726
  title: Neutrophils establish rapid and robust WAVE complex polarity in an actin-dependent fashion.
  findings: []
- id: PMID:21107423
  title: Structure and control of the actin regulatory WAVE complex.
  findings: []
- id: PMID:21482783
  title: Essential role for Abi1 in embryonic survival and WAVE2 complex integrity.
  findings: []
- id: PMID:25293574
  title: Nanoscale segregation of actin nucleation and elongation factors determines dendritic spine protrusion.
  findings:
  - statement: Super-resolution microscopy in rat hippocampal neurons reveals nanoscale confinement of
      the Abi1-containing WAVE complex at the postsynaptic density to drive spine protrusion.
    supporting_text: The PSD is a persistent confinement zone for IRSp53 and the WAVE complex, an activator
      of the Arp2/3 complex.
- id: PMID:9010225
  title: Isolation and characterization of e3B1, an eps8 binding protein that regulates cell growth.
  findings: []
core_functions:
- description: Core signaling adaptor subunit of the heteropentameric WAVE/SCAR regulatory complex driving
    Arp2/3-mediated branched actin organization and lamellipodium morphogenesis at leading-edge and cortical
    actin protrusions.
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0072673
    label: lamellipodium morphogenesis
  in_complex:
    id: GO:0031209
    label: SCAR complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0030027
    label: lamellipodium
  supported_by:
  - reference_id: PMID:11516653
    supporting_text: We show that Abi-1 and Abi-2b fused to enhanced yellow fluorescent protein (EYFP)
      are recruited to the tips of lamellipodia and filopodia.
  - reference_id: PMID:17304222
    supporting_text: During early neuronal development, Abi-1 is localized in neurites and growth cones;
      at later stages, the protein is enriched in dendritic spines and PSDs, as are components of a trimeric
      complex consisting of Abi-1, Eps8 and Sos-1.
  - reference_id: PMID:21107423
    supporting_text: The WASP relative WAVE regulates lamellipodia formation within a 400-kilodalton,
      hetero-pentameric WAVE regulatory complex (WRC). The WRC is inactive towards the Arp2/3 complex,
      but can be stimulated by the Rac GTPase, kinases and phosphatidylinositols.
  - reference_id: PMID:25293574
    supporting_text: The PSD is a persistent confinement zone for IRSp53 and the WAVE complex, an activator
      of the Arp2/3 complex.
suggested_questions:
- question: Which E-box target genes require NMDA-induced nuclear translocation of rat Abi1 in vivo during
    synaptic plasticity?
- question: How is rat Abi1 partitioned between nanoscale PSD-confined WAVE complexes and mobile Eps8-Abi1-Sos1
    complexes during LTP?
suggested_experiments:
- description: ChIP-seq and nascent RNA-seq in rat hippocampal neurons carrying a knock-in Tyr53Ala Abi1
    mutation blocking NMDA-induced nuclear import.
- description: Single-particle tracking PALM of endogenous HaloTag-Abi1 simultaneously with WAVE2 and
    Eps8 during glutamate uncaging on rat dendritic spines.
