  title: The cell migration molecule UNC-53/NAV2 is linked to the ARP2/3 complex by ABI-1.
  findings: []
- id: PMID:19200726
  title: Neutrophils establish rapid and robust WAVE complex polarity in an actin-dependent fashion.
  findings: []
- id: PMID:21107423
  title: Structure and control of the actin regulatory WAVE complex.
  findings: []
- id: PMID:21482783
  title: Essential role for Abi1 in embryonic survival and WAVE2 complex integrity.
  findings: []
- id: PMID:25293574
  title: Nanoscale segregation of actin nucleation and elongation factors determines dendritic spine protrusion.
  findings:
  - statement: Super-resolution microscopy in rat hippocampal neurons reveals nanoscale confinement of
      the Abi1-containing WAVE complex at the postsynaptic density to drive spine protrusion.
    supporting_text: The PSD is a persistent confinement zone for IRSp53 and the WAVE complex, an activator
      of the Arp2/3 complex.
