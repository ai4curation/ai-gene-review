id: Q9JJS8
gene_symbol: Masp2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Mannan-binding lectin serine protease 2 (MASP-2) is a liver-synthesised, secreted plasma serine protease
  of the C1r/C1s/MASP (peptidase S1) family, built from CUB1-EGF-CUB2-CCP1-CCP2-serine protease domains. It forms
  a Ca2+-independent homodimer via its N-terminal CUB1-EGF region and binds, in a Ca2+-dependent manner, to the
  collagen-like stalks of mannose-binding lectin (MBL) and ficolins. When these soluble pattern-recognition molecules
  engage carbohydrate arrays on microbial surfaces, MASP-2 is activated by autocatalytic (and MASP-1-mediated) cleavage
  of its Arg-Ile activation bond; the active enzyme cleaves complement C4 and C2, generating the lectin-pathway
  C3 convertase C4b2a on the pathogen surface and thereby initiating complement activation, opsonization and inflammation.
  Accessory C4/C4b binding sites in its CCP-SP region aid substrate recognition. The same gene produces the truncated
  non-catalytic MAp19 (isoform 2) by alternative processing.
