  review:
    summary: 'ISO from human MASP2: cell surface pattern recognition receptor signaling pathway.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The lectin pathway is initiated by soluble pattern-recognition molecules (MBL, ficolins) binding microbial
      carbohydrate, with MASP-2 acting as an extracellular protease; it is a proteolytic cascade, not intracellular
      signalling initiated by a cell surface PRR. The term (signalling downstream of a host cell-surface receptor)
