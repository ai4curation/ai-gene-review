- term:
    id: GO:0016540
    label: protein autoprocessing
  evidence_type: IDA
  original_reference_id: PMID:15060079
  qualifier: involved_in
  review:
    summary: 'Proposed: rat MASP-2 autocatalytically cleaves its own zymogen at the Arg-Ile activation bond.'
    action: NEW
    reason: MASP-2 itself performs the activation cleavage of its own zymogen (autoactivation), stimulated when
      MBL-MASP-2 complexes bind a glycan surface; wild-type rat MASP-2 autoactivates even during biosynthesis, and
      an Arg424Lys activation-site mutant slows this. The gene product carries out the step (it is both enzyme and
      substrate), so the term passes the NEW bar; protein autoprocessing is the GO term for exactly this case. MASP-1-mediated
      activation in serum is an additional route.
    supported_by:
    - *id009
    - *id015
    - reference_id: PMID:20118239
      supporting_text: MASP-2K is a catalytically active form, in which the arginine residue at the cleavage site
        for zymogen activation (Arg424) has been changed to a lysine residue to slow down the rate of spontaneous
        autoactivation during biosynthesis.
    - reference_id: file:rat/Masp2/Masp2-uniprot.txt
      record_section:
      - CC:PTM
      supporting_text: The uncleaved zymogen is inactive towards synthetic substrates, but has sufficient activity
        to effect autocatalytic cleavage.
