suggested_questions:
- question: In rat serum, what fraction of MASP-2 activation on microbial surfaces is autocatalytic versus MASP-1-mediated,
    given that rat MASP-2 autoactivates readily in vitro?
- question: Should the human MASP2 source annotation to cell surface pattern recognition receptor signaling pathway
    (GO:0002752), propagated by ISO to rat, be retired in favour of complement activation, lectin pathway?
- question: Does rat MAp19 (isoform 2) compete with MASP-2 for MBL binding and regulate lectin-pathway activation
    in vivo?
suggested_experiments:
- hypothesis: MASP-1 is required for physiological MASP-2 activation in rat serum despite efficient in vitro autoactivation.
  description: Measure C4 deposition on mannan-coated surfaces using sera from Masp1-null versus wild-type rats
    reconstituted with recombinant zymogen or R424K MASP-2.
  experiment_type: biochemical reconstitution
