id: P19491
gene_symbol: Gria2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Gria2 encodes GluA2 (GluR2, GluR-B), a pore-forming subunit of AMPA-type ionotropic glutamate
  receptors. GluA2 assembles with GluA1, GluA3 or GluA4 (or as homomers) into tetrameric glutamate-gated
  cation channels, together with auxiliary TARP and cornichon subunits, and these receptors mediate most
  fast excitatory transmission at glutamatergic synapses, where they are anchored in the postsynaptic
  density membrane of dendritic spines. GluA2 dominates the properties of heteromeric receptors: RNA editing
  of the pore-loop Q/R site (Gln607Arg) makes GluA2-containing receptors Ca2+-impermeable and shapes rectification,
  and flip/flop splicing tunes desensitization. The cytoplasmic C-terminal tail is a trafficking hub:
  its PDZ ligand binds GRIP1/ABP and PICK1, a membrane-proximal motif binds NSF, and a basic motif binds
  AP-2, so that phosphorylation-regulated interactions control synaptic delivery, clustering, recycling
  and the endocytosis that expresses long-term depression and homeostatic scaling. Smaller GluA2 pools
  occur in presynaptic terminals and synaptic vesicle membranes.'
