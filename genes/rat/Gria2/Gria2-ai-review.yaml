- term:
    id: GO:0001919
    label: regulation of receptor recycling
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00091234
  review:
    summary: Regulation of receptor recycling (IEA), based on GluR2/3 receptors continuously replacing
      synaptic receptors in an NSF- and PDZ-dependent manner.
    action: MARK_AS_OVER_ANNOTATED
    reason: GluA2 is the receptor that recycles (the cargo); its C-tail motifs recruit NSF and PDZ proteins,
      which do the regulating. The GluA2 C-tail is needed for its own recycling, but that is not the gene
      product regulating receptor recycling as a process. Core trafficking role is captured by PDZ domain
      binding.
    supported_by:
    - reference_id: PMID:11348590
      supporting_text: GluR2/GluR3 receptors replace existing synaptic receptors continuously; this occurs
        only at synapses that already have AMPA-Rs and requires interactions by GluR2 with NSF and group
        II PDZ domain proteins.
    - reference_id: PMID:16037816
      supporting_text: NEEP21-GRIP1 binding is crucial for GluR2-AMPAR sorting through endosomes and their
        recruitment to the plasma membrane
