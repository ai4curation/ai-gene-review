core_functions:
- description: 'Glutamate-gated cation channel subunit: binds L-glutamate (and AMPA) in its extracellular
    ligand-binding domain and forms the pore of tetrameric AMPA receptors that depolarize the postsynaptic
    membrane at glutamatergic synapses; edited GluA2 makes the channel Ca2+-impermeable.'
  molecular_function:
    id: GO:0004971
    label: AMPA glutamate receptor activity
  directly_involved_in:
  - id: GO:0035249
    label: synaptic transmission, glutamatergic
  - id: GO:0060079
    label: excitatory postsynaptic potential
  locations:
  - id: GO:0098839
    label: postsynaptic density membrane
  - id: GO:0043197
    label: dendritic spine
  in_complex:
    id: GO:0032281
    label: AMPA glutamate receptor complex
  supported_by:
  - reference_id: PMID:19946266
    supporting_text: Here we report the crystal structure of the alpha-amino-3-hydroxy-5-methyl-4-isoxazole
      propionic acid (AMPA)-sensitive, homotetrameric, rat GluA2 receptor at 3.6 A resolution in complex
      with a competitive antagonist.
  - reference_id: PMID:30872532
    supporting_text: Within the receptor, the core subunits arrange to give the GluA2 subunit dominant
      control of gating.
  - reference_id: file:rat/Gria2/Gria2-uniprot.txt
    record_section:
    - CC:RNA EDITING
    supporting_text: Heteromerically expressed edited GLUR2 (R) receptor complexes are impermeable to
      calcium, whereas the unedited (Q) forms are highly permeable to divalent cations.
  - reference_id: PMID:11348590
    supporting_text: AMPA-type glutamate receptors (AMPA-Rs) mediate a majority of excitatory synaptic
      transmission in the brain.
  - reference_id: file:rat/Gria2/Gria2-deep-research-manual.md
    supporting_text: Ca2+-permeable AMPA channel activity is a property of GluA2-lacking receptors or
      of the unedited/mutant GluA2 constructs used experimentally
- description: C-terminal PDZ ligand (-SVKI) binds class II PDZ domains of GRIP1/ABP/GRIP2 and PICK1,
    anchoring and trafficking GluA2-containing AMPA receptors at synapses; phosphorylation of Ser880 and
    Tyr876 switches partner preference during LTD, LTP and homeostatic scaling.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  locations:
  - id: GO:0098839
    label: postsynaptic density membrane
  supported_by:
  - reference_id: PMID:9069286
    supporting_text: Here we identify a synaptic PDZ domain-containing protein GRIP (glutamate receptor
      interacting protein) that specifically interacts with the C termini of AMPA receptors.
  - reference_id: PMID:9768844
    supporting_text: ABP binds to the GluR2/3 C-terminal VKI-COOH motif via class II hydrophobic PDZ interactions
  - reference_id: PMID:10027300
    supporting_text: Here, we show that PICK1 (protein interacting with C kinase), a PDZ domain-containing
      protein, interacts with the C termini of alpha-amino-3-hydroxy-5-methyl-isoxazole-4-propionic acid
      (AMPA) receptors in vitro and in vivo.
  - reference_id: PMID:32071234
    supporting_text: These results demonstrate that AMPAR trafficking during homeostatic upscaling can
      be gated by a single phosphorylation site on the GluA2 subunit.
suggested_questions:
- question: Should GO:0022849 glutamate-gated calcium ion channel activity be restricted to GluA2-lacking
    AMPA receptors, given that native GluA2 is Q/R-edited and renders receptors Ca2+-impermeable, with
    Ca2+ permeability shown only for unedited or mutant GluA2 constructs?
- question: Is there direct evidence that presynaptic GluA2-containing receptors regulate presynaptic
    membrane potential or release, which would justify GO:0099507 for GluA2 from a suitable paper?
suggested_experiments:
- hypothesis: Presynaptic GluA2-containing AMPA receptors depolarize corticostriatal terminals and modulate
    glutamate release.
  description: Compare presynaptic release probability in terminal-specific Gria2 conditional knockouts
    at corticostriatal synapses, to test whether presynaptic GluA2-containing AMPARs regulate presynaptic
    membrane potential.
