  review:
    summary: AMPA glutamate receptor activity (IBA). GluA2 is a pore-forming, glutamate-binding subunit
      of AMPA receptors.
    action: ACCEPT
    reason: Core function. GluA2 binds glutamate in its S1/S2 domain and forms the cation pore of homo-
      and heteromeric AMPA receptors; it dominates gating in GluA1/2 heteromers and its edited Q/R site
      sets Ca2+ impermeability. Native AMPARs containing GluA2 with TARP and cornichon auxiliary subunits
      show this activity.
    supported_by:
    - reference_id: PMID:19946266
      supporting_text: Here we report the crystal structure of the alpha-amino-3-hydroxy-5-methyl-4-isoxazole
        propionic acid (AMPA)-sensitive, homotetrameric, rat GluA2 receptor at 3.6 A resolution in complex
        with a competitive antagonist.
    - reference_id: PMID:30872532
      supporting_text: Within the receptor, the core subunits arrange to give the GluA2 subunit dominant
        control of gating.
