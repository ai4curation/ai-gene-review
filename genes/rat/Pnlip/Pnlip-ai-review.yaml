id: P27657
gene_symbol: Pnlip
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Pnlip encodes pancreatic triglyceride lipase, a secreted digestive enzyme
  that preferentially hydrolyzes the sn-1 and sn-3 ester bonds of dietary triacylglycerols
  to yield monoacylglycerols and free fatty acids. Colipase supports its activity
  at lipid interfaces in the presence of bile salts. Rat pancreatic enzyme preparations
  also show substantial Pnlip-associated retinyl ester hydrolysis, linking this enzyme
  to dietary vitamin A processing. Its abundance, secretion and activity change with
  postnatal development, dietary lipid composition and leptin exposure.
