        - reference_id: file:rat/Pnlip/Pnlip-deep-research-falcon.md
          supporting_text: |-
            emphasizing its dominant contribution to adult/older-child fat digestion relative to other lipases.
  - term:
      id: GO:0006633
      label: fatty acid biosynthetic process
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: The scope of fatty-acid formation by lipolysis must be distinguished from de novo
        fatty-acid synthesis.
      action: UNDECIDED
      reason: GO:0006633 is defined as chemical reactions and pathways resulting in formation of
        fatty acids; its definition alone does not restrict the term to fatty-acid synthase chemistry.
        The IBD at PTN000906454 in PTHR11610 must therefore be evaluated against the process convention
        and the actual source annotations. Pnlip directly releases fatty acids during triglyceride
        hydrolysis, but whether this is appropriately modeled as the named biosynthetic process
        remains unresolved. The prior categorical removal imposed an unverified narrower definition.
      propagation_review:
        root_cause: UNRESOLVED
        source_entities:
        - source_id: PANTHER:PTN000906454
          source_label: PTN000906454
          source_status: UNRESOLVED
          comment: Current PTHR11610 IBD recovered. Source-process scope and target substrate/context
            retention require adjudication; no target loss is inferred solely from digestive specialization.
  - term:
      id: GO:0008970
      label: glycerophospholipid phospholipase A1 activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: Rat pancreatic lipase has reported weak phospholipid hydrolysis, requiring a position-specific
        assessment before excluding PLA1 activity.
      action: UNDECIDED
      reason: The IBD is at PTN000906454 in PTHR11610. PMID:8656075 compares rat PLRP2 with conventional
        PL and explicitly describes phospholipids as poorly hydrolyzed by PL. This contradicts the
        premise that only PLRP2 has any such capacity. The accessible abstract does not resolve
        the sn-1 bond, substrate preparation or small-rate controls; focused primary adjudication
        is needed for GO:0008970. Retain uncertainty rather than infer complete loss from triglyceride
        preference.
      propagation_review:
        root_cause: UNRESOLVED
        source_entities:
        - source_id: PANTHER:PTN000906454
          source_label: PTN000906454
          source_status: UNRESOLVED
          comment: Ancestral PLA1 placement is challenged only if the target lacks the exact positional
            reaction. The rat comparator paper reports poor phospholipid hydrolysis, not absence.
      supported_by:
      - reference_id: PMID:8656075
        supporting_text: phospholipids, a substrate poorly hydrolyzed by PL
