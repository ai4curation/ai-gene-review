references:
- id: file:rat/Pnlip/Pnlip-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: rat Pnlip (UniProt P27657), pancreatic triacylglycerol lipase'
  findings:
  - statement: Identity verification confirms P27657/rat Pnlip is the classical colipase-dependent pancreatic digestive lipase (EC 3.1.1.3), distinct from plasma/hepatic lipases.
    supporting_text: corresponds to **pancreatic triacylglycerol lipase** (also called pancreatic lipase; **EC 3.1.1.3**), a major **exocrine pancreatic digestive enzyme** responsible for hydrolysis of dietary triacylglycerols.
    reference_section_type: OTHER
  - statement: Core molecular function is hydrolysis of dietary triacylglycerols at the lipid-water interface, yielding monoacylglycerols and free fatty acids.
    supporting_text: catalyzes hydrolysis of **dietary triacylglycerols (TAGs)** in the gastrointestinal tract. In the intestinal lumen (classically the duodenum), TAG hydrolysis generates absorbable lipid products, typically described as **monoacylglycerols and free fatty acids (FFAs)**, enabling intestinal uptake.
    reference_section_type: OTHER
  - statement: Pnlip is the dominant lipase for dietary fat digestion in adults, supporting triglyceride catabolic process as a core pathway role.
    supporting_text: emphasizing its dominant contribution to adult/older-child fat digestion relative to other lipases.
    reference_section_type: OTHER
  - statement: Pnlip is produced by pancreatic acinar cells and secreted into the gastrointestinal tract, acting extracellularly to digest dietary lipids.
    supporting_text: PNLIP is an exocrine enzyme produced by **pancreatic acinar cells** and secreted into the gastrointestinal tract as part of pancreatic juice, where it performs extracellular digestion of dietary lipids.
    reference_section_type: OTHER
  - statement: In acinar cells, properly folded Pnlip traffics to zymogen granules, co-localizing with amylase, consistent with the regulated secretory pathway.
    supporting_text: in wild-type acinar cells, PNLIP localizes to punctate structures that **co-localize with amylase in zymogen granules**.
    reference_section_type: OTHER
  - statement: Pnlip activity depends on the cofactor colipase, which stabilizes the active state and restores activity in the presence of inhibitory bile salts at the lipid interface.
    supporting_text: Colipase stabilizes the active state of PNLIP and restores enzymatic activity in the presence of inhibitory substances (including bile salts), effectively enabling productive adsorption/anchoring of lipase at the lipid interface.
    reference_section_type: OTHER
  - statement: Catalysis uses a canonical serine-hydrolase Ser-Asp-His catalytic triad with interfacial activation, consistent with the AB-hydrolase lipase fold.
    supporting_text: Catalysis uses a canonical serine hydrolase **catalytic triad (Ser–Asp–His)** typical of mammalian pancreatic lipases
    reference_section_type: OTHER
  - statement: Caution against paralog misassignment - Pnlip and the paralog Pnliprp2/PNLIPRP2 were reported as equipotent in lipolysis, so activity attributed to one can be confounded with the other.
    supporting_text: PNLIP and PNLIPRP2 were described as **equipotent** in lipolysis/lipotoxic injury in the cited experimental framework.
    reference_section_type: OTHER
- id: file:rat/Pnlip/Pnlip-hypotheses/secondary-lipolysis-and-fatty-acid-pathway-scope/openscientist.md
  title: OpenScientist focused review of secondary Pnlip lipase-family annotations
  findings:
  - statement: The focused review traced inherited lipase-family GO terms to PTN000906454 and found that the phospholipase, lipoprotein-lipase, HDL-remodeling and fatty-acid-biosynthesis assertions are family-level inferences from vascular-lipase paralogs.
    supporting_text: They are family-level inferences, **not direct evidence for classical pancreatic lipase**.
    reference_section_type: OTHER
  - statement: The positive-regulation ISO traces to a source paper that characterizes human pancreatic lipase's own colipase-dependent activation rather than regulation of another lipase.
    supporting_text: Source paper characterizes the enzyme's own colipase-dependent interfacial activation, not regulation of a separate TG lipase.
    reference_section_type: OTHER
