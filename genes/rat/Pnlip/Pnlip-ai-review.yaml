- term:
    id: GO:0042632
    label: cholesterol homeostasis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Retain the inherited cholesterol-homeostasis role as a secondary consequence of digestive lipid processing.
    action: KEEP_AS_NON_CORE
    reason: The current PTHR11610 IBD at PTN000906454 includes this process. Pnlip hydrolyzes dietary triglycerides and influences the lipid environment supporting cholesterol uptake; it need not be a cholesterol ester hydrolase to contribute to homeostasis. No target-specific loss was established, and the retained intestinal cholesterol-absorption annotation supplies a compatible process context.
