  review:
    summary: Hydrolysis of lipoprotein-bound triglyceride remains an unresolved substrate-context
      capacity.
    action: UNDECIDED
    reason: GO:0004465 requires hydrolysis of triglyceride in a lipoprotein. Ordinary
      emulsified-triglyceride assays establish Pnlip catalysis but do not directly
