- term:
    id: GO:0034375
    label: high-density lipoprotein particle remodeling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: IBA from PTHR11610 node PTN000906454, which spans the vascular lipases (LPL, LIPC, LIPG)
      and the pancreatic lipases. In human and mouse, the only experimental annotations
      to this term are IMP calls for hepatic lipase (LIPC) and endothelial lipase
      (LIPG), enzymes that act on circulating HDL. Pnlip is secreted by pancreatic
      acinar cells into the intestinal lumen, where it acts on emulsified dietary
      triglyceride.
    action: MARK_AS_OVER_ANNOTATED
    reason: Previously UNDECIDED. HDL particle remodeling is a plasma process carried out by the
      vascular members of the family. Pnlip has no access to circulating HDL particles
      and no reported role in HDL metabolism, so the inherited process overshoots what
      this pancreatic-lumen enzyme does. The IBD is correct for the vascular lipase
      clade but is placed at a node that also covers the pancreatic lipases.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000906454
        source_label: PTN000906454
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Experimental grounding for this IBD is IMP on LIPC and LIPG (QuickGO),
          plasma-acting lipases that remodel HDL; Pnlip is an exocrine digestive enzyme
          secreted into the gut lumen, so the physiological process does not transfer.
    supported_by:
    - reference_id: UniProtKB:P27657
      supporting_text: 'SUBCELLULAR LOCATION: Secreted'
    - reference_id: UniProtKB:P27657
      supporting_text: 'FUNCTION: Plays an important role in fat metabolism. It preferentially splits the
        esters of long-chain fatty acids at positions 1 and 3, producing mainly
        2-monoacylglycerol and free fatty acids'
  qualifier: involved_in
