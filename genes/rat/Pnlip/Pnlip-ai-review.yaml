      post-embryonic development.
    supporting_text: rPL and rPLRP-2 hydrolyze triolein, 8.0 and 4.4 mumol.min-1.microgram-1,
      respectively.
    reference_section_type: ABSTRACT
- id: PMID:8656075
  title: Rat GP-3 is a pancreatic lipase with kinetic properties that differ from colipase-dependent
    pancreatic lipase.
  findings:
  - statement: For Pnlip, this publication was assessed for the PMID:8656075 triacylglycerol
      lipase annotation and found to be weak stand-alone support because it primarily characterizes
      PLRP2.
    supporting_text: To further characterize rPLRP2, we expressed the recombinant enzyme in
      a baculovirus system, purified the secreted protein, and measured its kinetic properties.
    reference_section_type: ABSTRACT
- id: PMID:8967484
  title: Dexamethasone-regulated expression of pancreatic lipase and two related proteins in
    AR42J cells.
  findings:
  - statement: For Pnlip, this publication was assessed for annotations including extracellular
      region.
    supporting_text: We conclude that AR42J cells synthesize and secrete PL, PLRP-1, and PLRP-2
      and that dexamethasone discoordinately regulates the expression of the three genes.
    reference_section_type: ABSTRACT
- id: PMID:10769148
  title: Hydrolysis of retinyl esters by pancreatic triglyceride lipase.
  findings:
  - statement: For Pnlip, this publication was assessed for annotations including triacylglycerol
      lipase activity.
    supporting_text: Enzyme assays of pancreatic triglyceride lipase (PTL) showed that there
      was a colipase-stimulated REH activity in rat and mouse (WT and CELKO) pancreas, consistent
      with hydrolysis of retinyl ester (RE) by PTL.
    reference_section_type: ABSTRACT
- id: PMID:15181189
  title: Pancreatic lipase and its related protein 2 are regulated by dietary polyunsaturated
    fat during the postnatal development of rats.
  findings:
  - statement: For Pnlip, this publication was assessed for annotations including lipase activity;
      post-embryonic development; response to lipid.
    supporting_text: Diet (LF < MF = HF; P < 0.002), postnatal development (d15 < d21 < d28
      = d56; P < 0.001), and interaction of diet x development significantly affected PL activity
      starting as early as d15.
    reference_section_type: ABSTRACT
- id: PMID:17010228
  title: Leptin directly regulates exocrine pancreas lipase and two related proteins in the
    rat.
  findings:
  - statement: For Pnlip, this publication was assessed for annotations including extracellular
      region; response to peptide hormone.
    supporting_text: Leptin directly, rapidly (within 30 min) and significantly inhibited both
      the secretion and intracellular activity of PL.
    reference_section_type: ABSTRACT
