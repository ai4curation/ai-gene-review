- term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'IBA from PTHR11610 node PTN000906454. The comparator check shows that curators annotate
      this term to lipases that release fatty acids by hydrolysis: human LPL and LIPC by
      IDA (PMID:182536) and mouse LPL by IDA (PMID:18635818). Under that convention,
      hydrolysis of acylglycerols counts as forming fatty acids, and Pnlip does the same
      chemistry on dietary triacylglycerol, producing 2-monoacylglycerol and free fatty
      acids.'
    action: KEEP_AS_NON_CORE
    reason: Previously UNDECIDED. The inherited term follows an established curation convention for
      lipolytic fatty acid release, and Pnlip releases fatty acids from triacylglycerol,
      so it is kept. It is non-core because triglyceride catabolic process (GO:0019433)
      describes the same activity more precisely and the term does not imply de novo
      synthesis.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000906454
        source_label: PTN000906454
        source_status: SUPPORTS_TRANSFER
        comment: IBD grounded by IDA annotations of LPL and LIPC for lipolytic fatty
          acid release (QuickGO); Pnlip performs the same acylglycerol hydrolysis on dietary
          lipid.
    supported_by:
