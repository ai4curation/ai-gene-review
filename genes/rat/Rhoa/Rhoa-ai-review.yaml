suggested_questions:
- question: Should rat RhoA carry GO:0160124 guanyl nucleotide exchange factor activator activity for
    its allosteric activation of ECT2 (currently by similarity only in UniProt), and if so on which evidence?
- question: Many rat GOA rows (2006-2008 RGD pharmacology papers) annotate 'response to X' from changes
    in RhoA activity; should RGD review these IEP response annotations, which describe RhoA as a target
    rather than an actor?
- question: The IMP row 'microtubule depolymerization' (PMID:20858895) places RhoA downstream of drug-induced
    depolymerization; should it be re-curated to a signalling or cell-survival term?
suggested_experiments:
- hypothesis: RhoA itself, rather than RhoB or RhoC, mediates the C3-exoenzyme-sensitive effects reported
    in rat neurons and smooth muscle.
  description: Use RhoA-specific genetic perturbation (siRNA or conditional deletion with rescue), rather
    than C3 exoenzyme, which also inhibits RhoB and RhoC, to confirm RhoA-specific roles in rat neuronal
    synapse formation and smooth muscle tone.
  experiment_type: genetic perturbation
