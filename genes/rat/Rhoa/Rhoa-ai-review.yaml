id: P61589
gene_symbol: Rhoa
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: RhoA is a ubiquitously expressed Rho-family small GTPase that acts as a molecular switch,
  cycling between an inactive GDP-bound form and an active GTP-bound form. GDP-RhoA is held in the cytosol
  by RhoGDI; guanine nucleotide exchange factors (for example AKAP-Lbc and GEF-H1) load GTP at the cytoplasmic
  face of the plasma membrane, to which RhoA is anchored by a C-terminal geranylgeranyl group, and intrinsic
  GTP hydrolysis, accelerated by GTPase-activating proteins, terminates signalling. GTP-RhoA binds and
  activates effectors such as the ROCK and PKN kinases and the formin mDia, thereby driving actomyosin
  contractility, stress fibre and focal adhesion assembly, and contractile ring formation at the cleavage
  furrow during cytokinesis. Through these outputs it regulates smooth muscle contraction, cell adhesion
  and migration, epithelial junctions, and in neurons it restrains neurite initiation and dendritic branching
  and mediates early structural plasticity of dendritic spines.
