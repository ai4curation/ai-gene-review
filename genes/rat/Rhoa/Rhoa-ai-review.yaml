core_functions:
- description: 'GTP/GDP-cycling molecular switch: GTP-bound RhoA at the cytoplasmic face of the plasma
    membrane engages effectors (ROCK, PKN, mDia) to transduce Rho signals; intrinsic GTPase activity returns
    it to the GDP state, and RhoGDI holds the inactive form in the cytosol.'
  molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
  - id: GO:0007266
    label: Rho protein signal transduction
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  supported_by:
  - reference_id: file:rat/Rhoa/Rhoa-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Small GTPase which cycles between an active GTP-bound and an inactive GDP-bound state
  - reference_id: PMID:20472934
    supporting_text: free RhoA rapidly exchanged its bound nucleotide (GDP) with GTP, and the reaction
      was saturated after 15 min
  - reference_id: PMID:17662049
    supporting_text: ICAM-1 cross-linking induces a strong activation of RhoA in RBE4 cells
- description: 'Organizes contractile actin structures: via ROCK and mDia, active RhoA drives stress fibre
    and focal adhesion assembly and actin polymerization, underlying smooth muscle contraction and cell
    adhesion.'
  molecular_function:
