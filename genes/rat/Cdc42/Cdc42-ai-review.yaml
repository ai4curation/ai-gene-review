id: Q8CFN2
gene_symbol: Cdc42
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Cdc42 is a Rho-family small GTPase that acts as a membrane-anchored molecular switch. It
  is C-terminally geranylgeranylated and associates with the cytoplasmic face of the plasma membrane and
  with Golgi membranes, while its GDP-bound form is held in the cytosol by RhoGDI. Guanine-nucleotide
  exchange factors load it with GTP; GTP-Cdc42 binds the CRIB/GBD motifs of effectors such as N-WASP,
  PAK kinases, MLK3, IRSp53 and Par6, and its intrinsic GTPase activity, accelerated by GAPs, returns
  it to the GDP state. Through these effectors Cdc42 directs Arp2/3-dependent actin branching, filopodial
  and lamellipodial protrusion and directed migration, establishes cell polarity through Par6-aPKC and
  GSK-3beta/APC, controls dynein-dependent positioning of the Golgi apparatus, and in hippocampal neurons
  maintains the long-term structural plasticity of individual dendritic spines downstream of CaMKII. It
  also contributes to regulated exocytosis, endocytic trafficking and JNK pathway activation.
