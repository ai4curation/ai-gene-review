- term:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - UniProtKB:P60953
  review:
    summary: Ubiquitin protein ligase activity transferred from a human annotation.
    action: REMOVE
    reason: Cdc42 is a Rho GTPase with no E3 ligase domain. The human donor (AgBase IDA, PMID:21435037)
      concerns Salmonella SopB binding to Cdc42; SopB mutants that cannot bind Cdc42 are still ubiquitinated,
      and the human review found no experiment showing CDC42 catalysing ubiquitin transfer. The ISO propagates
      a misassigned activity.
    supported_by:
    - reference_id: PMID:21435037
      supporting_text: SopB mutant proteins defective for binding Cdc42 were ubiquitinated upon translocation
        in mammalian cells
    - *id004
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P60953
        source_status: SOURCE_BAD
        comment: Human IDA (PMID:21435037) shows Cdc42-dependent SopB ubiquitination effects, not E3 ligase
          catalysis by CDC42.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: UniProtKB:P60953
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0061630
      confidence: PROBABLE
      explanation: 'Assigned by AgBase. Human CDC42 enables ubiquitin protein ligase activity (IDA, PMID:21435037)
        is not supported: the paper studies binding of Salmonella SopB to CDC42 and reports that SopB
        mutants unable to bind CDC42 are still ubiquitinated. CDC42 has no E3 ligase domain. RGD propagated
        the term to rat by ISO.'
