suggested_questions:
- question: Does rat Cdc42 contribute to cytokinesis or kinetochore-microtubule attachment in any rat
    cell type, given that NRK cells divide normally without it (PMID:21763307)?
- question: Is the human CDC42 COG complex annotation (PMID:16380373) intended as a Golgi apparatus location,
    and can it be repointed?
suggested_experiments:
- description: Compare Cdc42 depletion phenotypes in mitosis (chromosome congression, kinetochore attachment)
    across rat NRK, fibroblast and epithelial lines alongside HeLa to test whether the mitotic role is
    cell-type-specific.
