core_functions:
- description: 'Membrane-anchored GTP/GDP molecular switch: GEF-loaded GTP-Cdc42 signals through Rho-family
    effectors and its intrinsic GTPase activity, accelerated by GAPs such as ArhGAP44, terminates the
    signal. Through Par6-aPKC and GSK-3beta/APC this switch establishes cell polarity.'
