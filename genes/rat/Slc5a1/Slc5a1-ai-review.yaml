  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: IBA annotation based on phylogenetic inference. SGLT1 apical localization
      is well-established across mammals. Direct experimental evidence in rat shows
      SGLT1 at apical membrane in MDCK cells (PMID:11831390), blood-brain barrier
      endothelial cells (PMID:14986005), and kidney proximal tubule S3 segments (PMID:16204409).
    action: ACCEPT
    reason: Core localization for SGLT1 function. Phylogenetic inference is well-supported
      by multiple direct experimental studies in rat demonstrating apical membrane
      localization in intestinal epithelium, renal proximal tubules, and brain endothelial
      cells. The N-terminal domain determines apical targeting (PMID:11831390).
    supported_by:
