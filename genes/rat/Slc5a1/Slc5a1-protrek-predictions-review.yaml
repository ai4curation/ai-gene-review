description: >-
  ProTrek sequence-to-text retrieval for rat Slc5a1 (SGLT1). The substrate lottery: all five top calls
  are sodium-coupled sugar symporter activities from the same SLC5 family, and the correct one is
  third. SGLT1 is the high-affinity, 2:1 Na+:glucose cotransporter of the intestinal brush border;
  rank 1 asserts low affinity (SGLT2/SGLT4 territory) and rank 2 asserts mannose (SGLT4/SLC5A9). Both
  outrank the correct call - by 0.085 and 0.001 units - and both are mechanically scored MORE_SPECIFIC
  or credited against a GOA ancestor, so a closure-based metric would score two paralog errors as
  refinements. The free-text channel is worse still: its top two hits at 21.45 and 21.22, the highest
  free-text scores in the rat set, are the SGLT4 mannose/fructose comment. Scores span only 17.7-19.4
  across the five, so confidence gives no usable signal about which is right. Assessment: 1 correct-not-novel,
  2 paralog incorrect. Assessment: 1 correct not novel (CNN), 2 paralog incorrect (PLI).
