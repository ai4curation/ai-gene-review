    summary: >-
      Rank 2 (score 19.29), 0.001 units above the correct call. Mannose:sodium symporter activity
      belongs to SGLT4/SLC5A9, the family member that transports mannose and fructose with 1:1 Na+
      coupling; the same protein's Function comment is what the free-text channel returns at rank
      1. SGLT1 transports D-glucose and D-galactose, not mannose. A within-family substitution invisible
      to any metric that stops at the family level.
