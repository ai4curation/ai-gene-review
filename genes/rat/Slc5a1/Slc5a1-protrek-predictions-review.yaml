    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 19.37). Low-affinity D-glucose:sodium symporter activity is defined for
      transporters that bind glucose only at very high concentrations, and its GO cross-reference
      points at SGLT4; the low-affinity renal transporter is SGLT2/SLC5A2. SGLT1 is the high-affinity
      member of the family - that is its defining kinetic property and the basis of its role in dietary
      hexose absorption. Because GO:0005362 is_a GO:0005412, the correct call, this is scored MORE_SPECIFIC
      and would be credited by ontology-closure agreement as a refinement of exactly the annotation
      it contradicts.
