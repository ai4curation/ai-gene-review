    summary: PAINT IBA for signal transduction at PTN000366423, grounded on human MVP.
    action: KEEP_AS_NON_CORE
    reason: Human MVP binds the SH2 domains of SRC and PTPN11 after tyrosine phosphorylation, dampens
      EGF-dependent ERK activation and IFN-gamma/STAT1 signalling, and in mouse macrophages restrains
