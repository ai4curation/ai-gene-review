core_functions:
- description: Structural shell protein of the vault. Rat Mvp self-assembles into the 78-mer barrel-shaped
    cage (two half-vaults of 39 chains) of the cytoplasmic vault ribonucleoprotein particle, whose lumen
    houses PARP4, TEP1 and the vault RNA. This is the one function of Mvp established beyond doubt;
    what the assembled vault does for the cell is unknown.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:19150846
    supporting_text: the cage structure consists of a dimer of half-vaults, with each half-vault comprising
      39 identical major vault protein (MVP) chains
  - reference_id: PMID:11349122
    supporting_text: the expression of the rat MVP alone can direct the formation of particles that have
      biochemical characteristics similar to endogenous rat vaults
  - reference_id: PMID:25354757
    supporting_text: the polyribosome acts like a 3D nanoprinter to direct the ordered translation and
      assembly of the multi-subunit vault homopolymer
  knowledge_gaps:
  - gap_statement: 'The physiological function of the vault particle is unknown: no cargo, transport
      activity or enzymatic role of the assembled cage has been demonstrated in rat or any other mammal.'
    boundary: The structure of the rat liver vault is known at 3.5 A, its composition (Mvp, PARP4, TEP1,
      vault RNA) and co-translational assembly on polyribosomes are described, and a fraction of vaults
      sits at the nuclear envelope and along microtubules; proposed roles in drug resistance and nucleocytoplasmic
      transport were not supported in knockout cells.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: Without a defined function, all process annotations for Mvp rest on indirect modulatory
      phenotypes, and the reason the abundant, conserved vault exists remains unexplained.
proposed_new_terms:
- proposed_name: vault complex
  proposed_definition: A barrel-shaped cytoplasmic ribonucleoprotein complex of about 13 MDa, formed by
    two half-vaults each made of multiple copies of the major vault protein, and containing the minor
    vault components such as vault poly(ADP-ribose) polymerase, TEP1 and vault RNAs.
  justification: GO has no term for the vault, first purified from rat liver and solved at atomic resolution
    from rat liver; Mvp, Parp4, Tep1 and vault RNA can only be annotated to the generic ribonucleoprotein
    complex. Same proposal as in the human MVP review.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:19150846
    supporting_text: the cage structure consists of a dimer of half-vaults, with each half-vault comprising
      39 identical major vault protein (MVP) chains
  - reference_id: PMID:2943744
    supporting_text: One of these (Mr 104,000) greatly predominates, accounting for greater than 70% of
      the total Coomassie Brilliant Blue-staining protein
suggested_questions:
- question: Does the vault-nuclear pore association seen by immunogold EM in rat tissue reflect a specific
    docking interaction, given that MVP-/- cells show normal nucleocytoplasmic transport and the eightfold
    symmetry-matching rationale was superseded by the 39-fold vault structure?
- question: Is the minority of rapidly moving vaults in rat PC12 neurites carrying specific cargo, and
    which motor drives them?
- question: Is the glucocorticoid receptor co-purification of Mvp from rat liver cytosol a specific interaction
    or a contaminant of abundant vault particles?
suggested_experiments:
- hypothesis: Vaults deliver a specific set of proteins or RNAs to defined subcellular sites, such as
    neurite tips or the nuclear envelope.
  description: In rat PC12 cells or primary neurons, use proximity labelling targeted to the vault lumen
    (via a PARP4 MVP-interaction-domain fusion) to define the vault-enclosed proteome, and test whether
    candidate cargo mislocalises when Mvp is knocked out.
  experiment_type: proteomics
- hypothesis: The microtubule and nuclear-envelope associations of vaults require assembled cages rather
    than free Mvp.
  description: Express assembly-defective rat Mvp mutants (cap-helix mutations) in Mvp-depleted PC12 cells
    and compare their microtubule co-localisation, nuclear-envelope association and motility with wild-type
    Mvp by live imaging and immunogold EM.
  experiment_type: genetic complementation
