id: Q62667
gene_symbol: Mvp
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Major vault protein (Mvp, p104) is the principal structural protein of vaults, barrel-shaped
  cytoplasmic ribonucleoprotein particles of about 13 MDa that were first purified from rat liver and
  are conserved across most eukaryotes. Mvp accounts for more than 70% of vault protein; each vault is
  a dimer of half-vaults, each built from 39 identical Mvp chains, and every chain folds into nine N-terminal
  repeat domains that form the barrel wall, a stomatin-like shoulder domain, a long cap-helix whose contacts
  stabilise the particle, and a cap-ring. Rat Mvp expressed alone in insect cells assembles into vault-like
  particles, and in cells vaults are assembled co-translationally on polyribosomes. The vault lumen houses
  the minor components vault poly(ADP-ribose) polymerase (PARP4), TEP1 and a single small RNA polymerase
  III-transcribed vault RNA. Vaults are mostly cytosolic; a fraction associates with the nuclear envelope
  and nuclear pore complexes, and vaults partly co-localise with microtubules and actin-rich neurite tips,
  where a minority move rapidly. Mvp is a substrate of cellular kinases and is induced in reactive microglia
  after seizures. As in other mammals, studies mainly in human and mouse cells link Mvp to modulation of
  EGF/SRC-ERK, interferon and inflammatory signalling, but the physiological function of the vault particle
  remains unknown.'
