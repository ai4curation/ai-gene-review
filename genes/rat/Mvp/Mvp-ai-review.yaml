- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:19150846
  review:
    summary: 'Rat Mvp is the structural shell protein of the vault: the 3.5 A crystal structure of native
      rat liver vault shows 78 identical Mvp chains (two half-vaults of 39) forming the cage, and rat Mvp
      alone assembles vault-like particles.'
    action: NEW
    reason: 'The one activity of Mvp established beyond doubt is structural, and the foundational evidence
      is from rat: native rat liver vaults are built mainly from Mvp, which is over 70% of vault protein;
      the crystal structure of rat liver vault resolves the cage as 78 Mvp chains stabilised by cap-helix
      contacts; and rat Mvp expressed alone in Sf9 cells forms vault-like particles. Structural molecule
      activity is the closest existing GO term (a more specific vault term is proposed); no rat GOA row
      captures this function. Matches the NEW row on human MVP.'
    supported_by:
    - reference_id: PMID:19150846
      supporting_text: the cage structure consists of a dimer of half-vaults, with each half-vault comprising
        39 identical major vault protein (MVP) chains
    - reference_id: PMID:11349122
      supporting_text: the expression of the rat MVP alone can direct the formation of particles that
        have biochemical characteristics similar to endogenous rat vaults
    - reference_id: PMID:18453688
      supporting_text: Multimerization of the major vault protein (MVP) is sufficient to assemble the
