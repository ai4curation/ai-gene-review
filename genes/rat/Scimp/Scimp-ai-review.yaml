id: A0ABK0LNG9
gene_symbol: Scimp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Scimp (SLP adaptor and CSK-interacting membrane protein) is the rat ortholog of human SCIMP
  and mouse Scimp. It has not been characterized experimentally in rat; its function is inferred from
  the orthologs. It is predicted to be a small palmitoylated single-pass transmembrane adaptor protein
  (TRAP family) of antigen-presenting cells that resides in tetraspanin-enriched microdomains of the plasma
  membrane. In mouse macrophages the ortholog binds the TLR4 TIR domain after LPS stimulation and scaffolds
  LYN, SYK and ERK1/2 to the receptor, driving TLR4 tyrosine phosphorylation and selective IL-6 and IL-12p40
  production; it also contributes to MHC-II and Dectin-1 signalling.
