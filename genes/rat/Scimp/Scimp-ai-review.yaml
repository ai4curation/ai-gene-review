suggested_questions:
- question: Are the SH2-docking tyrosines (mouse Y58, Y96, Y120; human Y69, Y107, Y131) and the LYN-binding
    proline-rich region conserved in rat Scimp (A0ABK0LNG9), as they would need to be for the transferred
    adaptor annotations to hold?
- question: Do rat macrophages show the same selective SCIMP-dependent IL-6 and IL-12p40 (but not TNF)
    response to TLR agonists described in mouse?
suggested_experiments:
- hypothesis: Rat Scimp acts as a TLR4 adaptor in macrophages as mouse Scimp does.
  description: Knock down or knock out Scimp in rat bone-marrow-derived macrophages and measure LPS-induced
    TLR4 tyrosine phosphorylation, ERK1/2 activation and IL-6, IL-12p40 and TNF secretion.
