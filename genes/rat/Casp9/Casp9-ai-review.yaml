    label: cytosol
  in_complex:
    id: GO:0043293
    label: apoptosome
  supported_by:
  - reference_id: PMID:9390557
    supporting_text: Caspase-9 and Apaf-1 bind to each other via their respective NH2-terminal CED-3 homologous
      domains in the presence of cytochrome c and dATP, an event that leads to caspase-9 activation
  - reference_id: PMID:9390557
    supporting_text: caspase-9 is the most upstream member of the apoptotic protease cascade that is triggered
      by cytochrome c and dATP
  - reference_id: PMID:9708735
    supporting_text: Casp9 is a critical upstream activator of the caspase cascade in vivo
  - reference_id: file:rat/Casp9/Casp9-bioinformatics/RESULTS.md
    supporting_text: 'Catalytic dyad conserved: human His237 maps to rat His275 and human Cys287 maps
      to rat Cys325'
- description: Apoptosome-bound caspase-9 processes executioner procaspase-3 and procaspase-7 by cleavage,
    activating them and so driving the execution phase of apoptosis.
  molecular_function:
