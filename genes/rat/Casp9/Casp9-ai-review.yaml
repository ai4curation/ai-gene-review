  review:
    summary: Caspase-9 protein levels change in neonatal rat brain after hypoxia-ischemia; an apoptosis
      read-out, not a role in the hypoxia response.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The cited rat study measures caspase-9 protein, cleavage or LEHD-substrate activity as a
      read-out of intrinsic apoptosis in this experimental model. That shows caspase-9 is activated when
      cells die under the condition, not that caspase-9 performs any step of the organism''s response
      to the stimulus; its own activity is the apoptotic cascade. The row is a context annotation of the
      apoptotic role, so it is marked as an over-annotation rather than removed. Full text read: caspase-9
      was one of the apoptosis markers blotted to assess miR-210 effects.'
    supported_by:
