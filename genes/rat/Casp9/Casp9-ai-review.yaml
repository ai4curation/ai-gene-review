id: Q9JHK1
gene_symbol: Casp9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Casp9 encodes caspase-9, the CARD-containing initiator caspase of the intrinsic (mitochondrial)
  apoptotic pathway. After mitochondrial release of cytochrome c, Apaf-1 oligomerizes into the cytosolic
  apoptosome and recruits procaspase-9 through CARD-CARD interaction; caspase-9 is activated on this platform
  and, as a cysteine-type endopeptidase cleaving after aspartate, processes and activates the executioner
  procaspases-3 and -7. Its activity is also regulated by phosphorylation (an ABL1 site is conserved in
  rat) and by IAP proteins such as XIAP. Rat studies show caspase-9 activation and a requirement for its
  activity in intrinsic apoptosis of cardiac endothelial cells after ischemia, of hepatocytes under oxidative
  stress and of neurons after seizures.
