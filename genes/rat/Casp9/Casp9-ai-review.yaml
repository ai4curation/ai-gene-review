core_functions:
- description: Caspase-9 is recruited by Apaf-1 into the cytosolic apoptosome and, once activated there,
    acts as the initiator cysteine-type endopeptidase of the intrinsic (mitochondrial) apoptotic signaling
    pathway.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
