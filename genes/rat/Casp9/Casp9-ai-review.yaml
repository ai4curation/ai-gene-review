  - reference_id: PMID:9390557
    supporting_text: Activated caspase-9 in turn cleaves and activates caspase-3
  - reference_id: PMID:16352606
    supporting_text: the latter complex directly cleaves/activates procaspase-7
suggested_questions:
- question: PMID:17869439 reports that caspase-9 inhibitors did not reduce gentamicin plus XIAP-inhibitor
    induced hair cell loss; which experiment in that paper supports RGD's IMP for positive regulation
    of apoptotic process?
- question: Human CASP9 Ser196 (AKT1 inhibitory site) aligns to Trp234 in rat. Is caspase-9 regulated
    by AKT in rat cells at all, and should the rat Reactome projection 'AKT phosphorylates targets in
    the cytosol' include caspase-9?
- question: Rat Casp9 has a ~38-residue longer CARD-p20 linker than human CASP9, with repeated PVVLGP-like
    motifs. Does this linker affect apoptosome-dependent activation or XIAP binding?
suggested_experiments:
- description: Compare apoptosome activation and XIAP inhibition of recombinant rat and human caspase-9
    in a reconstituted cytochrome c/Apaf-1/dATP system, including a rat linker-deletion mutant, to test
    whether the rodent-specific linker changes activation kinetics.
  experiment_type: in vitro reconstitution
- description: Test AKT-dependent phosphorylation of rat caspase-9 in rat cells (phospho-proteomics after
    growth-factor stimulation) to establish whether the absence of the Ser196 site removes this regulatory
    input in rodents.
  experiment_type: phosphoproteomics
