  review:
    summary: Core catalytic activity of caspase-9, the initiator caspase of the apoptosome; IBA from the
      caspase clade is sound.
    action: ACCEPT
    reason: Caspase-9 is a CASc-domain peptidase C14A protein with the conserved catalytic His/Cys dyad
      (rat His275/Cys325). Its endopeptidase activity on procaspase-3 and -7 is established for the mammalian
      orthologs, and the PAINT node covering the caspases places this activity at the family level; the
      rat protein retains the catalytic residues, so the inheritance holds.
    supported_by:
    - reference_id: PMID:9390557
      supporting_text: Activated caspase-9 in turn cleaves and activates caspase-3
    - reference_id: file:rat/Casp9/Casp9-bioinformatics/RESULTS.md
      supporting_text: 'Catalytic dyad conserved: human His237 maps to rat His275 and human Cys287 maps
        to rat Cys325'
    - reference_id: file:rat/Casp9/Casp9-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the peptidase C14A family.
