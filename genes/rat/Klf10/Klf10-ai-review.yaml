- term:
    id: GO:0007623
    label: circadian rhythm
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1101353
  review:
    summary: Circadian rhythm, transferred from mouse Klf10.
    action: MODIFY
    reason: Klf10 is not a core clock component; it is a CLOCK-BMAL1 target that feeds back by repressing
      Bmal1 and modulates period length, and it links the clock to hepatic metabolic output. Its role
      is regulatory, better captured by regulation of circadian rhythm (GO:0042752), which the gene already
      carries by IMP. This is a lateral refinement (GO:0042752 regulates rather than is_a GO:0007623).
    supported_by:
    - reference_id: PMID:20385766
      supporting_text: establish KLF10 as a required circadian transcriptional regulator that links the
        molecular clock to energy metabolism in the liver
    - &id009
      reference_id: PMID:20070857
      supporting_text: siRNA-mediated knock-down of TIEG1 caused period shortening of cellular bioluminescence
        rhythms driven by Bmal1-luciferase and Per2-luciferase reporters
    proposed_replacement_terms:
    - id: GO:0042752
      label: regulation of circadian rhythm
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:1101353
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Klf10 circadian expression and clock-output role are well supported; the term conflates
          a regulator/output with the rhythm process itself.
- term:
    id: GO:0009267
    label: cellular response to starvation
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1101353
  review:
    summary: Cellular response to starvation, transferred from mouse Klf10.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse evidence is that Klf10-/- males have fasting and postprandial hyperglycemia from
      derepressed Pepck, a knockout metabolic phenotype; Klf10 is induced by glucose (feeding), not by
      starvation, and no evidence shows Klf10 executes a cellular starvation response. Over-annotation
      from a phenotype.
    supported_by:
    - &id008
      reference_id: PMID:20385766
      supporting_text: Male Klf10(-/-) mice displayed postprandial and fasting hyperglycemia
    - *id004
    propagation_review:
