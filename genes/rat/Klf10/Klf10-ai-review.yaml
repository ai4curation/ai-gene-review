core_functions:
- description: Sequence-specific binding of GC-box cis-regulatory elements and repression of RNA polymerase
    II promoters (e.g. Bmal1, Pepck), via recruitment of the mSin3A-HDAC corepressor through its N-terminal
    alpha-helical repression motif; this feeds back on the circadian clock and couples it to hepatic metabolic
    gene expression.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0042752
    label: regulation of circadian rhythm
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:20070857
    supporting_text: TIEG1 bound to Bmal1 gene promoter and repressed its transcriptional activity through
      two juxtaposed GC boxes near the transcription initiation site
  - reference_id: PMID:20385766
    supporting_text: functional data showed that the proximal Pepck promoter is repressed directly by
      KLF10
  - reference_id: PMID:11438660
    supporting_text: The alpha-HRM from these proteins also mediates direct interaction with mSin3A and
      represses transcription.
  - reference_id: PMID:20070857
    supporting_text: siRNA-mediated knock-down of TIEG1 caused period shortening of cellular bioluminescence
      rhythms driven by Bmal1-luciferase and Per2-luciferase reporters
suggested_questions:
- question: What is the mouse experimental source for the somatic stem cell population maintenance annotation
    transferred to rat Klf10, and does it reflect a direct Klf10 activity or a knockout phenotype?
- question: 'How does Klf10 act as a repressor on Bmal1/Pepck/Smad7 yet as an activator on Smad2/Runx2
    promoters: are these distinct cofactor complexes, promoter architecture, or post-translational states?'
suggested_experiments:
- description: ChIP-seq for Klf10 in rat liver across the circadian cycle combined with RNA-seq of Klf10-knockdown
    hepatocytes, to define direct repressed versus activated targets.
  experiment_type: ChIP-seq / RNA-seq
- description: Mutate the alpha-helical repression motif in rat Klf10 and test Bmal1-promoter repression
    and circadian period in Rat-1 fibroblasts, to establish whether Sin3A recruitment is required for
    clock regulation.
  experiment_type: mutagenesis / reporter assay
