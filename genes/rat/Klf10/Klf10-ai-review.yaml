id: O08876
gene_symbol: Klf10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Krueppel-like factor 10 (Klf10, also TIEG/TIEG1, TGF-beta-inducible early gene 1) is a 480-aa
  nuclear Sp/KLF-family transcription factor with three C-terminal C2H2 zinc fingers that bind GC-rich
  (GC box, GGTGTG) cis-regulatory elements in RNA polymerase II promoters. It acts mainly as a transcriptional
  repressor, recruiting the mSin3A-histone deacetylase corepressor through an N-terminal alpha-helical
  repression motif, although it activates some promoters such as Smad2 and Runx2. Klf10 is rapidly induced
  by TGF-beta family cytokines, glucose and other stimuli, and it enhances TGF-beta/Smad signalling by
  repressing Smad7 and inducing Smad2. It is a clock-controlled gene that feeds back on the circadian
  oscillator by repressing Bmal1 through promoter GC boxes, and in liver it links the clock to metabolism
  by repressing gluconeogenic (Pepck) and modulating lipogenic genes. Through these transcriptional activities
  it influences osteoblast differentiation and bone mineralization, osteoblast support of osteoclastogenesis,
  cell proliferation and apoptosis.
