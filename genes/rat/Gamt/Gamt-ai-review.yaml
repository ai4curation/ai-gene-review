- term:
    id: GO:1990402
    label: embryonic liver development
  evidence_type: IEP
  original_reference_id: PMID:15918910
  review:
    summary: The cited study maps where Gamt mRNA and protein appear during rat embryogenesis
      and finds expression in the hepatic primordium from day 12.5; this is an expression
      pattern, not evidence that Gamt shapes liver development (IEP, PMID:15918910).
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is spatiotemporal expression only. Being transcribed in a
      developing organ does not make a metabolic enzyme a participant in that organ's
      development, and nothing in the study perturbs Gamt or assays a hepatic developmental
      outcome. The appropriate reading is that the embryonic liver is a site of creatine
      synthesis from mid-gestation, which the accepted creatine biosynthetic process
      annotations already capture; the liver-development term over-reaches.
    supported_by:
