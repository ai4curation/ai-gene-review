id: P10868
gene_symbol: Gamt
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Gamt encodes guanidinoacetate N-methyltransferase (EC 2.1.1.2), the
  cytosolic class I-like SAM-binding methyltransferase that catalyses the second
  and final step of endogenous creatine biosynthesis, transferring a methyl group
  from S-adenosyl-L-methionine to guanidinoacetate to give creatine and S-adenosyl-L-homocysteine.
  Guanidinoacetate is supplied by Gatm/AGAT, which makes the amidino group transfer
  from arginine to glycine in the preceding step. The enzyme is most abundant in
  liver and pancreas, is also expressed in neurons and glia where it supports local
  creatine synthesis, and appears in the hepatic primordium from about embryonic
  day 12.5. Activity is sensitive to the cellular methylation potential, since the
  coproduct S-adenosylhomocysteine is a competitive inhibitor, and the enzyme consumes
  a substantial share of hepatic SAM. Its N-terminal 36-42 residues cover the active-site
  entrance and are susceptible to proteolysis, which abolishes activity and allows
  the truncated protein to dimerise, while the physiological form is a monomer. Loss
  of activity both deprives tissues of creatine and allows the neurotoxic precursor
  guanidinoacetate to accumulate, the biochemical signature of GAMT deficiency.
