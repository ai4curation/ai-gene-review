- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:12079381
  review:
    summary: Self-association was observed directly in the rat liver GAMT crystal
      structure, where the protein that had lost its N-terminal 36 residues during
      purification formed a dimer with an inter-subunit contact at the guanidinoacetate
      site; retained as oligomeric context, not as the defining activity (IPI, PMID:12079381).
    action: KEEP_AS_NON_CORE
    reason: The interaction is real and structurally resolved, and the partner subunit
      even contributes a residue to the substrate site, so the annotation is not
      an inference. Two caveats keep it non-core. First, it is an oligomeric-state
      observation rather than a molecular activity. Second, the dimer was formed
      by the N-terminally truncated protein, and UniProt records the physiological
      species as a monomer that only may dimerise after that cleavage, which itself
      abolishes activity - so the self-association should not be read as the functional
      state of the enzyme in the cell.
    supported_by:
    - reference_id: PMID:12079381
      supporting_text: The truncated enzyme forms a dimer, and each subunit contains
        one SAH molecule in the active site. Arg220 of the partner subunit forms a
        pair of hydrogen bonds with Asp134 at the guanidinoacetate-binding site.
      reference_section_type: ABSTRACT
    - reference_id: UniProtKB:P10868
      supporting_text: 'SUBUNIT: Monomer. May form homodimers upon proteolytic removal
        of the first 36 amino acid residues.'
