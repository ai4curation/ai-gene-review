- term:
    id: GO:0035886
    label: vascular associated smooth muscle cell differentiation
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: vascular associated smooth muscle cell differentiation should not be
      retained for Cfd based on the combined gene function and cited/source evidence
      (ISO, GO_REF:0000121).
    action: REMOVE
    reason: The mouse source is a genetic-interaction study in which factor D deficiency
      prevented complement-dependent thrombotic angiopathy in factor H-mutant mice.
      That places Cfd upstream of a complement-mediated vascular disease phenotype,
      not in smooth muscle cell differentiation; the developmental term misrepresents
      the finding. Cfd is the secreted alternative-pathway serine protease, and its
      contribution here is already captured by complement activation, alternative
      pathway.
    supported_by:
    - reference_id: UniProtKB:P32038
      supporting_text: Activated CFD cleaves factor B (CFB) when the latter is complexed
        with complement C3b, activating the C3 convertase of the alternative pathway.
    - reference_id: file:rat/Cfd/Cfd-deep-research-falcon.md
      supporting_text: Rat CFD (Cfd/adipsin; UniProt P32038) should be annotated as
        a **secreted trypsin-like serine endopeptidase** of the alternative complement
        pathway that **cleaves factor B only efficiently when factor B is complexed
        with C3b/C3(H2O)**, enabling formation of the alternative pathway C3 convertase
        (C3bBb or C3(H2O)Bb).
    - reference_id: PMID:28057640
      supporting_text: Genetic deficiency of complement C3 and factor D prevented both
        the systemic thrombophilia and renal TMA phenotypes.
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: MGI:MGI:87931
        source_label: Cfd
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The mouse Cfd donor annotation is an IGI from PMID:28057640 (per QuickGO),
          in which factor D deficiency (like C3 deficiency) prevented complement-dependent
          systemic thrombophilia and thrombotic microangiopathy in factor H-mutant mice.
          Rescue of a complement-driven vascular pathology is not evidence that Cfd
          acts in smooth muscle cell differentiation, so the term does not transfer.
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:87931
