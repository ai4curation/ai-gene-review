id: P32038
gene_symbol: Cfd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Cfd encodes complement factor D (adipsin), a secreted, N-glycosylated
  trypsin-like serine protease produced mainly by adipocytes and circulating in plasma.
  It is the rate-limiting enzyme of the alternative complement pathway, cleaving
  factor B only when factor B is bound to C3b or hydrolysed C3 (C3(H2O)), to release
  Ba and generate the C3 convertases C3bBb and C3(H2O)Bb; free factor B is a very
  poor substrate. The pathway acts as an amplification loop for C3 and C5 convertase
  formation on activating surfaces. Factor D circulates largely in its mature form,
  its pro-enzyme being processed by MASP-3, and its expression in adipose tissue is
  reduced in genetically obese rodents and repressed by the Notch target Hes-1.
