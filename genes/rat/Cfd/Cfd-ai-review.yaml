- term:
    id: GO:0051604
    label: protein maturation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: protein maturation is retained as contextual support for Cfd, but it
      is not the core function (IBA, GO_REF:0000033).
    action: KEEP_AS_NON_CORE
    reason: Factor D takes part in protein maturation as the processing protease. It
      cleaves the pro-convertase factor B (in the C3bB complex) into Ba and Bb, which
      converts factor B into the catalytic subunit of the C3 convertase. This is a
      correct, broader description of the same cleavage captured more specifically
      by complement activation, alternative pathway, hence non-core. (Cfd's own conversion
      from pro-factor D by MASP-3 is Cfd acting as a substrate and is not the basis
      for this term.)
    supported_by:
    - reference_id: UniProtKB:P32038
      supporting_text: Activated CFD cleaves factor B (CFB) when the latter is complexed
        with complement C3b, activating the C3 convertase of the alternative pathway.
