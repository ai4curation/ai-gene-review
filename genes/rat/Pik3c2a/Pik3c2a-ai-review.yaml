  - reference_id: PMID:10766823
    supporting_text: the distribution of PI3K-C2alpha closely paralleled that of gamma-adaptin, a component
      of the AP-1 adaptor that is present in the trans-Golgi and the trans-Golgi network (TGN) resident
      protein TGN-46
- description: Phosphatidylinositol 3-kinase producing localised PI3P pools on endosomal and secretory
    membranes (recycling endosome at the cilium base, autophagosome precursors, neuroendocrine secretory
    granules), supporting endosomal trafficking, ciliogenesis and, in rat PC12 and INS1 cells, regulated
    exocytosis of secretory granules.
