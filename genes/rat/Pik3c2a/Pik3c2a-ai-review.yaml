core_functions:
- description: Clathrin-activated lipid kinase that phosphorylates PtdIns4P to PI(3,4)P2 at late-stage
    clathrin-coated pits, promoting coated-pit maturation and clathrin-dependent endocytosis; clathrin
    binding through the N-terminus couples the enzyme to coated membranes at the plasma membrane and trans-Golgi
    network.
  molecular_function:
    id: GO:0035005
    label: 1-phosphatidylinositol-4-phosphate 3-kinase activity
  directly_involved_in:
