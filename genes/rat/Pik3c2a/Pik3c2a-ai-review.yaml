- term:
    id: GO:0006897
    label: endocytosis
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O00443
  review:
    summary: 'ISO from human O00443: endocytosis.'
    action: MODIFY
    reason: Endocytosis is correct but general. The best-characterised role of PI3K-C2alpha is in clathrin-mediated
      endocytosis, where it synthesises PI(3,4)P2 at late-stage coated pits needed for SNX9 recruitment
      and pit maturation, so the enzyme performs a step of the process. The row is refined to clathrin-dependent
      endocytosis (an is_a descendant of endocytosis). The donor IMP (PMID:21081650) concerned dynamin-independent
      uptake, which is real but less mechanistically resolved; it remains covered by the parent if other
      rows retain it.
    supported_by:
    - reference_id: PMID:23823722
      supporting_text: formation of phosphatidylinositol-3,4-bisphosphate (PI(3,4)P2) by class II phosphatidylinositol-3-kinase
        C2α (PI(3)K C2α) spatiotemporally controls clathrin-mediated endocytosis
    - reference_id: PMID:23823722
      supporting_text: Depletion of PI(3,4)P2 or PI(3)K C2α impairs the maturation of late-stage clathrin-coated
        pits before fission.
    - reference_id: PMID:21081650
      supporting_text: downregulation of PI3KC2α impaired internalization of CD59 as well as fluid-phase
        endocytosis
