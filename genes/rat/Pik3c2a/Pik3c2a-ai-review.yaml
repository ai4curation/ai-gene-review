    supporting_text: we here identify phosphatidylinositol 3-phosphate as the sole in vivo product of
      the insulin-dependent activation of PI3K-C2alpha
  - reference_id: PMID:24697898
    supporting_text: PI3K-C2α is enriched in the pericentriolar recycling endocytic compartment (PRE)
      at the base of the primary cilium, where it regulates production of a specific pool of PtdIns3P.
  - reference_id: PMID:16055506
    supporting_text: Overexpression of wild-type PI3K-C2alpha enhanced secretion, whereas transfection
      of PC12 cells with a catalytically inactive PI3K-C2alpha mutant or a 2xFYVE domain sequestering
      PtdIns3P abolished secretion.
  - reference_id: PMID:21127054
    supporting_text: Here we report that selective down-regulation of this PI3K isoform in INS1 rat insulinoma
      cells specifically impairs insulin secretion irrespective of the metabolic effect, without affecting
      insulin content or the number of insulin granules associated with the plasma membrane in resting
      cells.
suggested_questions:
- question: Should RGD add a rat IMP annotation from PMID:21127054 (INS1 knockdown) to a regulation-of-insulin-secretion
    term, given that the mechanism (PtdIns3P-dependent granule fusion competence) is only inferred from
    PC12 data?
- question: What is the basis of the mouse IMP to GO:0071583 negative regulation of zinc ion transmembrane
    transport citing PMID:23823722, which concerns clathrin-mediated endocytosis?
- question: Which lipid product (PI3P or PI(3,4)P2) mediates PI3K-C2alpha function in insulin granule
    fusion, and on which membrane is it made?
suggested_experiments:
- hypothesis: PI3K-C2alpha catalytic activity, not only its clathrin-binding scaffold, is required for
    insulin granule fusion in rat beta cells.
  description: In INS1 cells depleted of endogenous PI3K-C2alpha, re-express siRNA-resistant wild-type,
    kinase-dead, or clathrin-binding-deficient PI3K-C2alpha and measure KCl-evoked secretion, SNAP25 proteolysis,
    and single-granule fusion by TIRF, with PI3P and PI(3,4)P2 biosensors to identify the lipid acting
    at the granule.
  experiment_type: rescue with domain mutants and live-cell TIRF imaging
