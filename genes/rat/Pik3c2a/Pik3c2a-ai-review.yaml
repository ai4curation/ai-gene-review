- term:
    id: GO:0009267
    label: cellular response to starvation
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:1203729
  review:
    summary: 'ISO from mouse (IGI PMID:24098492): cellular response to starvation (acts_upstream_of_or_within).'
    action: MARK_AS_OVER_ANNOTATED
    reason: The donor experiment silenced PI3K-C2alpha and PI3K-C2beta together in MEFs, so the starvation
      phenotype cannot be attributed to C2alpha alone, and Vps34 is the main PI3P source in starvation-induced
      autophagy. In kidney epithelia PIK3C2A supplies PI3P for shear-stress, not starvation, autophagy.
      Response to starvation as a whole over-reaches what was shown; the autophagy contribution is captured
      by the macroautophagy and autophagy-regulation rows.
    supported_by:
    - reference_id: PMID:24098492
      supporting_text: Control and Vps34 KO cells were treated with mock siRNA or both PI3K-C2α and β
        siRNAs
    - reference_id: PMID:32102612
      supporting_text: We showed that PtdIns3P is generated by PIK3C2A, but not by PIK3C3/VPS34, during
        flow-associated primary cilium-dependent autophagy, in a ULK1-independent manner.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
