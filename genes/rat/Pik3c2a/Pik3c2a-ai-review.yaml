    label: clathrin-coated pit
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0030136
    label: clathrin-coated vesicle
  supported_by:
  - reference_id: PMID:23823722
    supporting_text: formation of phosphatidylinositol-3,4-bisphosphate (PI(3,4)P2) by class II phosphatidylinositol-3-kinase
      C2α (PI(3)K C2α) spatiotemporally controls clathrin-mediated endocytosis
  - reference_id: PMID:23823722
    supporting_text: Depletion of PI(3,4)P2 or PI(3)K C2α impairs the maturation of late-stage clathrin-coated
      pits before fission.
  - reference_id: PMID:11239472
    supporting_text: clathrin functions as an adaptor for the class II PI 3-kinase C2alpha (PI3K-C2alpha),
      binding to its N-terminal region and stimulating its catalytic activity, especially toward phosphorylated
      inositide substrates
  - reference_id: PMID:10766823
    supporting_text: Centrifugation of rat brain homogenates and Western blotting revealed that in contrast
      to the class IA PI3K enzymes, PI3K-C2alpha could be co-purified with a population of clathrin-coated
      vesicles (CCVs)
- description: Clathrin binding by the N-terminal region, which stimulates the kinase and can itself promote
    clathrin lattice assembly.
  molecular_function:
