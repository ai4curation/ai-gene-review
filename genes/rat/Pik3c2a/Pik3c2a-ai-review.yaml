id: D3ZTF6
gene_symbol: Pik3c2a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Pik3c2a encodes phosphatidylinositol 4-phosphate 3-kinase C2 domain-containing subunit alpha
  (PI3K-C2alpha), a class II phosphoinositide 3-kinase of about 190 kDa with an N-terminal clathrin-binding
  region, a Ras-binding domain, a C2 domain, a helical domain, the PI3K catalytic domain, and C-terminal
  PX and C2 domains. It phosphorylates phosphatidylinositol to phosphatidylinositol 3-phosphate (PI3P)
  and phosphatidylinositol 4-phosphate to phosphatidylinositol 3,4-bisphosphate (PI(3,4)P2), is relatively
  insensitive to wortmannin, and is activated by clathrin binding. It associates with clathrin-coated
  pits at the plasma membrane, clathrin-coated vesicles (co-purifying with rat brain CCVs) and the trans-Golgi
  network, with additional pools at recycling endosomes near the cilium base and in the nucleus. PI(3,4)P2
  made by PI3K-C2alpha drives maturation of late-stage clathrin-coated pits, and its PI3P pools support
  endosomal trafficking, Rab11 activation and ciliogenesis, and autophagosome biogenesis. In rat neuroendocrine
  PC12 cells and INS1 insulinoma cells it is required for regulated exocytosis of secretory granules (ATP-dependent
  priming and insulin granule fusion). In mammals it is essential for embryonic angiogenesis, vascular
  barrier function and kidney podocyte maintenance, and loss-of-function causes a human syndromic disorder
  with ciliary dysfunction.
