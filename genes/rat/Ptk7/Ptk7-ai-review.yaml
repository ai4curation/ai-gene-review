- term:
    id: GO:0004714
    label: transmembrane receptor protein tyrosine kinase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1918711
  negated: true
  review:
    action: ACCEPT
    summary: The annotation explicitly asserts NOT receptor tyrosine kinase activity, and that negation
      is correct. PTK7 is a receptor pseudokinase. Human structural evidence identifies an occluded ATP
      site and noncanonical catalytic motifs; the corresponding rat residues are conserved. PTK7-dependent
      phosphorylation is mediated by associated active kinases such as Src, not intrinsic receptor tyrosine
      kinase activity.
    supported_by:
    - &id003
      reference_id: PMID:32619402
      supporting_text: ATP binding to PTK7 and ROR2 is prevented by projection of a tyrosine side-chain
        from the β5/αD hinge region
    - *id002
    - &id004
      reference_id: PMID:24703874
      supporting_text: 'PTK7 interacts with the

        tyrosine kinase Src and stimulates Src signaling along cell-cell contacts.'
