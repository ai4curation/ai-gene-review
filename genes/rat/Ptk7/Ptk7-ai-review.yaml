suggested_questions:
- question: Does the selected rat N-terminal product reach the cell surface with the same efficiency and
    topology as canonical PTK7?
- question: Which rat Ptk7 5' exon is used in vivo? A0A8I6ALM9 (Ensembl canonical Ptk7-202) lacks the
    conserved signal peptide that A0A8I6AKN3 (Ptk7-201) and mouse and human PTK7 encode; should the RGD
    and UniProt gene-centric representative be switched to the signal-peptide-bearing model?
- question: Can PANTHER reclassify rat Ptk7 from PTHR24418:SF399 (MATK) to PTHR45080:SF21, so that rat
    receives the PTK7-node IBAs (for example PTN000701324, cell-cell junction and regulation of canonical
    Wnt signaling) instead of Csk/Src-node kinase terms?
suggested_experiments:
- description: 5' RACE or long-read cDNA sequencing of rat Ptk7 transcripts from embryonic neural tube
    and cochlea, with surface biotinylation of epitope-tagged A0A8I6ALM9 and A0A8I6AKN3 products, to establish
    which N-terminus is expressed and whether the signal-peptide-less product reaches the plasma membrane.
