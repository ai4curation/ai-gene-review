id: A0A8I6ALM9
gene_symbol: Ptk7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: PTK7 is a single-pass receptor pseudokinase with seven extracellular immunoglobulin-like
  domains. It organizes signaling at cell contacts, including Src-dependent control of junctional actomyosin,
  and contributes to planar cell polarity and tissue morphogenesis. Its kinase-like domain has an occluded
  nucleotide pocket and lacks the catalytic machinery of an active receptor tyrosine kinase; it does not
  bind ATP, and phosphotyrosine signaling downstream of PTK7 is carried out by associated active kinases
  such as Src. In mouse, loss of Ptk7 disrupts neural tube closure, convergent extension, inner-ear hair-cell
  planar polarity and heart, lung and kidney development. The rat A0A8I6ALM9 gene model retains the seven
  Ig-like domains, membrane-spanning helix and pseudokinase-domain residues of mouse and human PTK7, but its
  first 35 residues differ from the conserved signal peptide encoded by the alternative rat model A0A8I6AKN3.
