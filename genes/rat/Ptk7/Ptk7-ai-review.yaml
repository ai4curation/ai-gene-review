  review:
    action: REMOVE
    summary: 'This IBA does not come from the PTK7 lineage. PANTHER:PTN001231168 is a node of the non-receptor
      tyrosine kinase family PTHR24418 (seed: Drosophila Csk, FB:FBgn0262081), and rat Ptk7 reaches it only
      because the PANTHER 19.0 rat classification file places A0A8I6ALM9 in PTHR24418:SF399 (MATK). Rat
      Ptk7 has no SH2 or SH3 domain; it has seven Ig-like domains, a transmembrane helix and a PTK7-type
      pseudokinase domain, and the current UniProt record places it in PTHR45080:SF21 with mouse and human
      PTK7, neither of which receives this term. The function is also contradicted on the target itself:
      PTK7 does not bind ATP, mouse PTK7 shows no auto- or trans-phosphorylation, and the rat sequence
      keeps the human pocket-occluding residues. The PAINT judgment for the Csk node is not disputed; the
