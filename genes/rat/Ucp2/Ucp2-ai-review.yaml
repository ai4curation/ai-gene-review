core_functions:
- description: Electroneutral export of C4 Krebs-cycle intermediates (malate, oxaloacetate, aspartate)
    from the mitochondrial matrix in exchange for phosphate plus a proton, limiting oxidation of acetyl-CoA-producing
    substrates and thereby lowering the ATP/ADP ratio and mitochondrial ROS production.
  molecular_function:
    id: GO:0015364
    label: dicarboxylate:phosphate antiporter activity
  directly_involved_in:
  - id: GO:0015740
    label: C4-dicarboxylate transport
  - id: GO:1990542
    label: mitochondrial transmembrane transport
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - *id017
  - *id010
  - *id018
suggested_questions:
- question: This review takes C4-dicarboxylate:phosphate antiport as UCP2's core activity and keeps proton
    conductance (GO:0015078) as non-core. The fatty-acid-activated proton-leak reading is still actively
    defended; should the core function instead record both activities, or proton transport alone?
- question: In rat INS-1E cells, how much of the UCP2-dependent attenuation of glucose-stimulated insulin
    secretion reflects C4-dicarboxylate export versus fatty-acid-activated proton leak?
- question: What degradation machinery outside the mitochondrion (proteasome-dependent turnover) sets
    the ~1 h half-life of UCP2, and is it regulated by nutrients?
suggested_experiments:
- description: Re-express wild-type or transport-dead UCP2 in UCP2-knockdown INS-1E cells and measure
    malate/aspartate efflux, proton leak and GSIS to test which activity accounts for the secretion phenotype.
