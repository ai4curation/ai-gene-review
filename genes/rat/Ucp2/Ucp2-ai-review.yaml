- term:
    id: GO:0017077
    label: oxidative phosphorylation uncoupler activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT3G54110
  - MGI:MGI:98894
  - PANTHER:PTN000642156
  - RGD:3931
  review:
    summary: Oxidative phosphorylation uncoupler activity (IBA).
    action: MARK_AS_OVER_ANNOTATED
    reason: The IBA node is grounded in UCP1 (MGI:98894, RGD:3931) and a plant UCP. UCP2 was named by
      homology with UCP1, but reconstitution and silencing data show it is a C4-dicarboxylate/phosphate
      antiporter; its proton conductance is real but small (UCP2 levels are hundreds of times lower than
      UCP1 in brown fat, PMID:18692019) and its uncoupling role is disputed. The transport capability
      is kept as GO:0015078 (non-core); the claim that it uncouples oxidative phosphorylation as UCP1
      does is not supported.
    supported_by:
    - reference_id: PMID:24395786
      supporting_text: Here we show that UCP2 is a metabolite transporter that regulates substrate oxidation
        in mitochondria.
    - *id018
    - reference_id: PMID:18692019
      supporting_text: These mitochondrial concentrations are hundreds of times lower than UCP1 in brown
        adipose tissue
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000642156
        comment: Node uncoupler activity grounded in UCP1 and a plant UCP; UCP2 is instead a C4-dicarboxylate/phosphate
          antiporter whose uncoupling role is disputed.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: MGI:MGI:98894
        comment: Thermogenic mouse UCP1.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: RGD:3931
        comment: Thermogenic rat UCP1.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
