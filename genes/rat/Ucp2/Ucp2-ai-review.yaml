id: P56500
gene_symbol: Ucp2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Ucp2 (SLC25A8) encodes mitochondrial uncoupling protein 2, a 309-residue member of the mitochondrial
  carrier (SLC25) family with six transmembrane helices in three Mito_carr repeats, located in the inner
  mitochondrial membrane. Despite its name and homology to the thermogenic UCP1, its principal activity
  (shown for the human and mouse orthologues) is an antiport that exports four-carbon Krebs-cycle intermediates
  (malate, oxaloacetate, aspartate) from the matrix in exchange for phosphate plus a proton; by draining
  C4 metabolites it limits oxidation of acetyl-CoA-producing substrates such as glucose, favours glutaminolysis,
  and lowers the ATP/ADP ratio and mitochondrial ROS production. UCP2 also mediates a fatty-acid-activated,
  purine-nucleotide-inhibited proton conductance whose physiological weight is debated, and it does not
  mediate adaptive thermogenesis. In rat INS-1E beta cells UCP2 is a low-abundance protein with a half-life
  of about 1 h whose level is set by glutamine-dependent translation and glucose; it contributes to proton
  leak and restrains glucose-stimulated insulin secretion while protecting against oxidative stress. Rat
  UCP2 is widely expressed (notably spleen, lung, heart, kidney, pancreas, adipocytes and hypothalamus),
  and its expression responds to nutrients, hormones and oxidative or inflammatory stress.
