    label: response to superoxide
  evidence_type: IDA
  original_reference_id: PMID:12372827
  qualifier: involved_in
  review:
    summary: Response to superoxide.
    action: KEEP_AS_NON_CORE
    reason: In isolated rat kidney mitochondria, exogenous or matrix-generated superoxide activated a
      nucleotide-sensitive proton conductance attributed to UCP2 (Echtay et al. 2002). This is a direct
      regulatory response of the carrier to superoxide, so the term is reasonable, but the superoxide/alkenal
      activation model of UCP2 proton leak was later disputed and is peripheral to the C4-dicarboxylate
      antiport; non-core.
    supported_by:
    - &id002
      reference_id: PMID:12372827
      supporting_text: superoxide activates UCP2 in rat kidney mitochondria from the matrix side of the
        mitochondrial inner membrane
    - reference_id: PMID:12372827
      supporting_text: Superoxide activates nucleotide-sensitive mitochondrial proton transport through
        the uncoupling proteins UCP1, UCP2, and UCP3
    - &id014
      reference_id: file:rat/Ucp2/Ucp2-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: This activity and its potential regulation by ubiquinones and nucleotides was disputed
        by later studies, which failed to reproduce the effect on proton conductance under physiological
        conditions.
