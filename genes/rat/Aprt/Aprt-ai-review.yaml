- term:
    id: GO:0032263
    label: GMP salvage
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: GMP salvage should not be retained for Aprt based on the combined gene
      function and cited/source evidence (ISO, GO_REF:0000121).
    action: REMOVE
    reason: The available evidence supports Aprt's curated activity rather than GMP
      salvage; this annotation is unsupported, assigned to the wrong biological context,
      or too misleading to keep as non-core. APRT accepts adenine and forms AMP; GMP
      is formed from guanine by HGPRT, and in cells adenine is routed overwhelmingly
      to adenine rather than guanine nucleotides.
    supported_by:
    - reference_id: UniProtKB:P36972
      supporting_text: Catalyzes a salvage reaction resulting in the formation of AMP,
        that is energically less costly than de novo synthesis.
    - reference_id: PMID:718989
      supporting_text: adenine or guanine were principally sources for adenine (greater
        than 85%) or guanine (greater than 90%)
    - reference_id: file:rat/Aprt/Aprt-deep-research-falcon.md
      supporting_text: '**Adenine phosphoribosyltransferase (APRT)** is a purine salvage
        enzyme that transfers a phosphoribosyl group from **5-phosphoribosyl-1-pyrophosphate
        (PRPP)** to **adenine**, generating **adenosine monophosphate (AMP)** and
        releasing **pyrophosphate (PPi)**'
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: MGI:MGI:88061
        source_label: mouse Aprt
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse Aprt GMP salvage is an MGI IDA from PMID:718989, a whole-cell
          study of purine nucleotide synthesis in HGPRT-deficient neuroblastoma cells
          (abstract-only in cache). That abstract reports guanine-derived nucleotide
          synthesis depends on HGPRT and that adenine is principally a source of adenine
          nucleotides. The mouse IDA is not adjudicated here, but APRT chemistry yields
          AMP, so GMP salvage is not a transferable Aprt function for rat.
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:88061
