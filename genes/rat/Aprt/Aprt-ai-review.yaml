id: P36972
gene_symbol: Aprt
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Aprt encodes adenine phosphoribosyltransferase (APRT), a homodimeric cytosolic
  enzyme of the purine/pyrimidine phosphoribosyltransferase family that salvages free
  adenine by transferring the 5-phosphoribosyl group of PRPP to adenine, yielding
  AMP and pyrophosphate (EC 2.4.2.7). This one-step route recycles adenine released
  from polyamine and nucleotide metabolism and is energetically cheaper than de novo
  purine synthesis. APRT is the only mammalian enzyme that removes adenine; in its
  absence adenine is oxidized by xanthine oxidoreductase to poorly soluble 2,8-dihydroxyadenine,
  causing kidney stones and crystal nephropathy.
