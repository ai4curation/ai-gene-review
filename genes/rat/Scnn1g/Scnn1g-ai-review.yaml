- term:
    id: GO:0071548
    label: response to dexamethasone
  evidence_type: IEP
  original_reference_id: PMID:16263802
  qualifier: involved_in
  negated: true
  review:
    summary: 'NOT response to dexamethasone: in neonatal rat semicircular canal duct, dexamethasone did
      not raise gamma-ENaC transcript, yet the same abstract reports increased gamma-ENaC protein.'
    action: UNDECIDED
    reason: The abstract reports that dexamethasone up-regulated alpha-ENaC transcript but that alpha-
      and gamma-ENaC protein expression was increased by dexamethasone, which appears to conflict with
      a NOT annotation. Without the full text, the curator's basis (presumably the transcript data) cannot
      be checked, and a separate study (PMID:17873005) reports a dexamethasone-induced gamma-ENaC mRNA
      increase in lung. Expression-response terms are in any case non-core.
    supported_by:
    - reference_id: PMID:16263802
      supporting_text: Proteins were present for the alpha-, beta-, and gamma-subunits of ENaC and Sgk1,
        and expression of alpha- and gamma-ENaC was upregulated by dexamethasone.
    - &id028
      reference_id: PMID:17873005
      supporting_text: DEX slightly increased the mRNA of alpha- and gamma-ENaC in whole rat lung.
