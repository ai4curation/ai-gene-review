  review:
    summary: Intracellular sodium ion homeostasis. ENaC drives transepithelial Na+ reabsorption that sets
      whole-body Na+ balance; it is not a regulator of cytosolic Na+ concentration.
    action: MARK_AS_OVER_ANNOTATED
    reason: ENaC's homeostatic role is transepithelial Na+ absorption and organismal Na+ balance, captured
      by sodium ion homeostasis (GO:0055078, accepted for this gene), not control of cytosolic Na+ concentration,
      which in absorptive epithelia is set by basolateral extrusion through the Na+/K+-ATPase; ENaC-mediated
      entry is the load on that system rather than its regulator. Because the correct parent is already
      accepted, the row is marked over-annotated rather than modified to it. The ComplexPortal IDA source
      (PMID:17562820) is a single-channel stoichiometry study and does not address intracellular Na+ homeostasis.
