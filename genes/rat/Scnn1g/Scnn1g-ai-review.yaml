core_functions:
- description: Pore-forming gamma subunit of the alpha-beta-gamma epithelial sodium channel; contributes
    to the amiloride-sensitive, highly Na+-selective channel activity that mediates Na+ entry across the
    apical plasma membrane of absorptive epithelia.
