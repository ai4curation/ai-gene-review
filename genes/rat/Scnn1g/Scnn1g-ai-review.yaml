- term:
    id: GO:0006883
    label: intracellular sodium ion homeostasis
  evidence_type: IDA
  original_reference_id: PMID:17562820
  qualifier: involved_in
  review:
    summary: ENaC drives transepithelial Na+ reabsorption that sets whole-body Na+ balance; 'intracellular
      sodium ion homeostasis' misplaces the homeostatic role.
    action: MODIFY
    reason: The channel's homeostatic role is organismal sodium balance (renal and colonic Na+ reabsorption),
      not regulation of cytosolic Na+ concentration, which in epithelia is set mainly by the basolateral
      Na+/K+-ATPase. The cited single-channel stoichiometry study does not address intracellular Na+ homeostasis.
      Sodium ion homeostasis (GO:0055078), already carried by the gene, is the appropriate term.
    supported_by:
    - &id011
      reference_id: file:rat/Scnn1g/Scnn1g-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: It plays a key role in maintaining sodium homeostasis through electrogenic sodium
        reabsorption in the kidneys.
    - &id012
      reference_id: PMID:24419567
      supporting_text: Sodium transport in the distal nephron is mediated by epithelial sodium channel
        activity.
    proposed_replacement_terms:
    - &id013
      id: GO:0055078
      label: sodium ion homeostasis
