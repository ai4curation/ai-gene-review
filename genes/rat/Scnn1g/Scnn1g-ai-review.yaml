- term:
    id: GO:0005272
    label: sodium channel activity
  evidence_type: IDA
  original_reference_id: PMID:20007351
  qualifier: contributes_to
  review:
    summary: Gamma-ENaC contributes to the sodium channel activity of the obligate alpha-beta-gamma ENaC
      heteromer; this is the core molecular function.
    action: ACCEPT
    reason: The gamma subunit is one of the pore-forming subunits of ENaC; it has no intrinsic activity
      alone but strongly increases channel activity when co-expressed with alpha. contributes_to correctly
      captures that the activity is a property of the heteromer. The cited study expressed rat alpha-beta-gamma
      ENaC in oocytes and measured amiloride-sensitive currents.
    supported_by:
    - &id003
      reference_id: PMID:8188647
      supporting_text: It had no intrinsic activity when expressed alone in Xenopus oocytes, but its co-expression
        with RCNaCh1 increased the channel activity 18 +/- 5-fold.
    - &id004
      reference_id: PMID:8107805
      supporting_text: Here we identify two other subunits (beta and gamma) by functional complementation
        of the alpha-subunit of the rat epithelial Na+ channel.
    - *id001
    - reference_id: PMID:20007351
      supporting_text: Similar stimulatory effects of cGMP were observed in oocytes expressing either
        mouse or rat alphabetagamma-ENaC channels.
