- term:
    id: GO:0050699
    label: WW domain binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00089434
  review:
    summary: The gamma-ENaC C-terminal PY motif (PPPRY) binds the WW domains of Nedd4/Nedd4-2, the ubiquitin
      ligases that downregulate ENaC.
    action: KEEP_AS_NON_CORE
    reason: Direct yeast two-hybrid and in vitro binding showed rat Nedd4 WW domains bind the gamma-ENaC
      PY motif; deletion of this motif causes Liddle syndrome. This is a well-supported regulatory interaction
      rather than the channel's transport function, so it is retained as non-core.
    supported_by:
    - &id024
      reference_id: PMID:8665844
      supporting_text: the rNedd4-WW domains mediate this association by binding to the P2 regions, which
        include the PY motifs (XPPXY) of either betarENaC (PPPNY) or gammarENaC (PPPRY).
    - &id025
      reference_id: file:rat/Scnn1g/Scnn1g-uniprot.txt
      record_section: ["CC:PTM"]
      supporting_text: Ubiquitination by NEDD4 or NEDD4L inhibits the ENaC channel through endocytosis,
        intracellular retention and degradation of its individual subunits.
