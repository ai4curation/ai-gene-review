- term:
    id: GO:0071548
    label: response to dexamethasone
  evidence_type: IEP
  original_reference_id: PMID:16263802
  qualifier: involved_in
  negated: true
  review:
    summary: 'NOT response to dexamethasone: in neonatal rat semicircular canal duct, dexamethasone did
      not raise the gamma-ENaC transcript, yet the same abstract reports increased gamma-ENaC protein.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Response to dexamethasone is an expression-response term that does not describe channel function
      in either polarity, and the positive gamma-ENaC row is marked over-annotated on that basis; the
      NOT row is treated the same way. The negative claim is also only partly supported: the abstract
      reports increased gamma-ENaC protein after dexamethasone, and PMID:17873005 reports a dexamethasone-induced
      gamma-ENaC mRNA increase in lung, although the curator presumably relied on the unchanged transcript,
      which the abstract-only record cannot confirm. The beta subunit''s NOT row (Scnn1b review) is also
      marked over-annotated on the same term-scope grounds, although there the negative observation itself
      holds, since for beta-ENaC neither transcript nor protein rose, whereas for gamma-ENaC the protein
      did.'
    supported_by:
    - reference_id: PMID:16263802
      supporting_text: Proteins were present for the alpha-, beta-, and gamma-subunits of ENaC and Sgk1,
        and expression of alpha- and gamma-ENaC was upregulated by dexamethasone.
    - &id026
      reference_id: PMID:17873005
      supporting_text: DEX slightly increased the mRNA of alpha- and gamma-ENaC in whole rat lung.
