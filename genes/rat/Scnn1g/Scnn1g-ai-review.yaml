id: P37091
gene_symbol: Scnn1g
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Scnn1g encodes the gamma subunit of the amiloride-sensitive epithelial sodium channel (ENaC),
  a non-voltage-gated, highly Na+-selective channel of the DEG/ENaC family formed by alpha (Scnn1a), beta
  (Scnn1b) and gamma (Scnn1g) subunits. Each subunit has cytoplasmic N- and C-termini, two transmembrane
  helices and a large extracellular domain. Gamma-ENaC has no channel activity on its own but strongly
  increases the activity of channels containing alpha. The assembled channel sits in the apical plasma
  membrane of Na+-absorbing epithelia (distal nephron, distal colon, airway and alveolar epithelium, exocrine
  gland ducts), where it allows luminal Na+ to enter the cell. This entry is the rate-limiting step of
  electrogenic transepithelial Na+ reabsorption and so of whole-body sodium balance, extracellular fluid
  volume and blood pressure. Gamma-ENaC is a major site of channel regulation. Aldosterone and low-salt
  diet induce its expression. Furin and then prostasin or other proteases cleave its extracellular domain,
  which releases an inhibitory tract and raises the open probability. Its C-terminal PY motif (PPPRY)
  binds the WW domains of Nedd4/Nedd4-2, which ubiquitinate N-terminal lysines and drive endocytosis and
  degradation; deletion of this motif in humans causes Liddle syndrome. C-terminal phosphorylation sites
  (CK2 Thr599, ERK Thr623) tune channel activity. Gamma-ENaC is also detected in some non-epithelial cells,
  including vascular smooth muscle and certain neurons.
