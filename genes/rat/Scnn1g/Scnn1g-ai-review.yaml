- term:
    id: GO:0050914
    label: sensory perception of salty taste
  evidence_type: NAS
  original_reference_id: PMID:22983350
  qualifier: involved_in
  review:
    summary: In rodents, amiloride-sensitive salt taste is mediated by ENaC in taste cells; gamma-ENaC
      participation is plausible but this NAS row cites a review on delta-ENaC.
    action: KEEP_AS_NON_CORE
    reason: ENaC channel activity in taste receptor cells underlies the amiloride-sensitive component
      of salty taste in rodents. The cited review is about the human/primate delta subunit and does not
      directly address rat gamma-ENaC, so the term is kept as non-core.
    supported_by:
    - &id026
      reference_id: PMID:22983350
      supporting_text: The widespread distribution of epithelial sodium channels in both epithelial and
        nonepithelial tissues implies a range of physiological functions.
    - reference_id: file:rat/Scnn1g/Scnn1g-uniprot.txt
      record_section: ["CC:ACTIVITY REGULATION"]
      supporting_text: Originally identified and characterized by its inhibition by the diuretic drug
        amiloride.
- term:
