suggested_questions:
- question: Should ENaC subunits continue to carry ligand-gated sodium channel activity (GO:0015280) via
    the DEG/ENaC PAINT node, given that ENaC is constitutively open and gated by proteolysis and Na+ self-inhibition
    rather than agonist binding? Would placing the ligand-gated term only on the ASIC/FaNaC clades be
    more accurate?
- question: Is there value in a specific GO cellular component term for the epithelial sodium channel
    complex (alpha-beta-gamma, or delta-containing) distinct from generic sodium channel complex?
- question: Do gamma-ENaC-containing channels in vascular smooth muscle and neurons conduct Na+ (or act
    as mechanosensors) in vivo, or do the non-epithelial phenotypes reflect channel-independent roles?
suggested_experiments:
- description: Taste-cell-specific deletion of Scnn1g in rodents to test whether gamma-ENaC is required
    for amiloride-sensitive salty taste, as has been shown for the alpha subunit.
- description: Vascular smooth muscle-specific Scnn1g knockout to test the proposed role in myogenic constriction
    and smooth muscle migration, controlling for systemic sodium balance.
