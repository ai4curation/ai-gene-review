- term:
    id: GO:0015280
    label: ligand-gated sodium channel activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN000189658
  - RGD:3640
  - RGD:3641
  review:
    summary: ENaC is a constitutively open, non-voltage-gated sodium channel; it is not opened by binding
      of a specific ligand, so ligand-gated sodium channel activity is over-specific. Sodium channel activity
      is the correct term.
    action: MODIFY
    reason: GO:0015280 requires a channel that opens when a specific ligand is bound. ENaC gating is controlled
      by proteolytic release of inhibitory tracts, extracellular Na+ self-inhibition and shear stress
      rather than by agonist binding (the ligand-gated property belongs to proton-gated ASIC and peptide-gated
      FaNaC relatives in the DEG/ENaC family). The experimental data (rat channel in oocytes and MDCK
      cells; PHA-1 gating mutation in gamma reducing current) support sodium channel activity, contributed
      by gamma within the heteromer. The parent term GO:0005272, already carried by this gene, is the
      correct replacement.
    supported_by:
    - &id019
      reference_id: PMID:9118951
      supporting_text: Homologous mutations, introduced into alpha, beta or gamma subunits, all significantly
        reduce macroscopic sodium channel currents recorded in Xenopus laevis oocytes.
    - &id020
      reference_id: file:rat/Scnn1g/Scnn1g-uniprot.txt
      record_section: ["CC:PTM"]
      supporting_text: Furin cleaves the SCNN1G subunit first, followed by cleavage by prostasin (PRSS8),
        which results in a stepwise increase in the open probability of the channel due to the release
        of an inhibitory tract.
    - *id018
    proposed_replacement_terms:
    - *id017
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000189658
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The DEG/ENaC node includes proton- and peptide-gated members (ASICs, FaNaC); ENaC subunits
