      supporting_text: 'FUNCTION: Catalyzes the hydrolysis of acyl-CoAs into free
        fatty acids and coenzyme A (CoASH), regulating their respective intracellular
        levels. More active towards saturated and unsaturated long chain fatty acyl-CoAs
        (C12-C20).'
    - reference_id: UniProtKB:O88267
      supporting_text: Reaction=eicosanoyl-CoA + H2O = eicosanoate + CoA + H(+);
    - reference_id: file:rat/Acot1/Acot1-deep-research-falcon.md
      supporting_text: ACOT1 is a **long-chain acyl-CoA thioesterase** with preference
        for **C12-C20** saturated and monounsaturated acyl-CoAs; no detectable activity
        is reported for acyl-CoAs of **C8 or shorter** in comparative ACOT1/2 studies.
