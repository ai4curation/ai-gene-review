- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: This peroxisome annotation is an IBA phylogenetic inference made across
      the whole ACOT family panel, which includes peroxisomal paralogs. Rat Acot1
      is specifically a cytosolic enzyme - UniProt records its subcellular location
      as "Cytoplasm, cytosol" (PMID:9490035) with no peroxisomal localization, and
      the falcon deep research consistently places Acot1 in the cytosol while explicitly
      assigning the peroxisomal localization to the distinct paralogs Acot3-6. The
      peroxisome term is therefore an over-annotation propagated from family members
      with different localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: IBA family-level localization that conflicts with experimental and review
      evidence placing rat Acot1 in the cytosol, not the peroxisome; the peroxisomal
      localization belongs to the distinct Acot3-6 paralogs.
    supported_by:
    - reference_id: UniProtKB:O88267
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm, cytosol {ECO:0000269|PubMed:9490035}.'
    - reference_id: file:rat/Acot1/Acot1-deep-research-falcon.md
      supporting_text: In rodent ACOT clusters, **Acot1** is the **cytosolic** member;
        **Acot2** is **mitochondrial**; **Acot3-6** are **peroxisomal**.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001286267
        source_label: PANTHER:PTN001286267
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Peroxisomal localization is a real property of the peroxisomal ACOT
          branch represented at this node (GO:0005777 IBD at PTN001286267, seeded
          largely by peroxisomal mouse/human ACOTs), but it does not transfer to rat
          Acot1, which is cytosolic. The current PTHR10824 PAINT slice (2026 rows)
          now carries explicit IRD (NOT) prunings of GO:0005777 against this IBD at
          PTN000793338 (a Murinae branch that instead holds a mitochondrion IBD seeded
          by rodent Acot2) and at PTN002585587 - PAINT itself has re-scoped the peroxisome
          assertion away from the non-peroxisomal ACOT1/ACOT2 branches, confirming
