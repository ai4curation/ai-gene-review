id: O88267
gene_symbol: Acot1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Acot1 encodes rat cytosolic acyl-CoA thioesterase 1 (CTE-I; also called
  long-chain acyl-CoA hydrolase ACH2), a serine hydrolase of the acyl-CoA thioesterase/bile
  acid-CoA:amino acid N-acyltransferase family. It hydrolyzes long-chain acyl-CoAs (preferring
  saturated and monounsaturated C12-C20 substrates such as palmitoyl- and oleoyl-CoA) to
  free fatty acid and coenzyme A, thereby regulating cytosolic acyl-CoA, free fatty acid
  and CoA pools. Acot1 is expressed mainly in liver, kidney and brown adipose tissue and
  is strongly induced by peroxisome proliferators (via PPARalpha) and by fasting. It is
  the cytosolic member of the rodent Acot1-6 gene cluster, whose other products are mitochondrial
  (Acot2) or peroxisomal (Acot3-6). By limiting long-chain acyl-CoA accumulation it modulates
  fatty acid oxidative flux, and in cardiomyocyte models it protects against lipid-induced
  apoptosis.
existing_annotations:
- term:
    id: GO:0000038
    label: very long-chain fatty acid metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: This very long-chain fatty acid (VLCFA, C22+) annotation is an IBA phylogenetic
      inference made across the whole ACOT family panel (which includes paralogs with
      broader substrate ranges). Rat Acot1 is characterized as a long-chain (C12-C20)
      acyl-CoA thioesterase with no documented activity on substrates above C20 -
      UniProt records it as "More active towards saturated and unsaturated long chain
      fatty acyl-CoAs (C12-C20)" and the falcon deep research describes it exclusively
      as a long-chain thioesterase (C12-C20). VLCFA per GO:0000038 requires aliphatic
      tails of more than 22 carbons, which falls outside the experimentally supported
      substrate range; the closest accurate process term is GO:0001676 (long-chain
      fatty acid metabolic process), which is separately annotated. This VLCFA term
      is therefore an over-annotation propagated from family members with different
      substrate ranges.
    action: MARK_AS_OVER_ANNOTATED
    reason: IBA family-level inference that conflicts with the experimentally documented
      C12-C20 (long-chain) substrate range for rat Acot1; very long-chain (C22+) activity
      is not supported by UniProt or the deep research, so the long-chain term GO:0001676
      is the accurate process term. The longest curated substrate for rat Acot1 and
      for its human ortholog is eicosanoyl-CoA (C20), which GO classes as long-chain
      (13-22 carbons); no target-specific C22+ activity has been reported.
    supported_by:
