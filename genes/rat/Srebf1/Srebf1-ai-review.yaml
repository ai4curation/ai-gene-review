- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:107606
  review:
    summary: Negative regulation of RNA polymerase II transcription, propagated from a mouse Srebf1 phenotype
      annotation (acts_upstream_of_or_within).
    action: MARK_AS_OVER_ANNOTATED
    reason: SREBP-1 is a transcriptional activator; its documented direct activity is activation through
      SREs and E-boxes. Reported decreases in particular transcripts after SREBP-1c gain or loss (for
      example insulin receptor substrate genes) are indirect consequences of the lipogenic programme,
      recorded in the source with the acts_upstream_of_or_within qualifier. Repression is not a function
      of rat SREBP-1.
    supported_by:
    - &id007
      reference_id: PMID:7739539
      supporting_text: When expressed in fibroblasts, ADD1/SREBP1 activates transcription through both
        the carbohydrate response E-box element and SRE-1
    - &id013
      reference_id: UniProtKB:P56720
      supporting_text: Key transcription factor that regulates expression of genes involved in cholesterol
        biosynthesis and lipid homeostasis
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
