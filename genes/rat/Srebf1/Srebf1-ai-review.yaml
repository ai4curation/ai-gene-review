        nuclear receptor activity from PMID:23610160, propagated to rat by ISO and Ensembl IEA. SREBP-1
        is a bHLH-ZIP factor, not a ligand-activated nuclear receptor; the nuclear receptor in the paper
        is SF1 (NR5A1). If the paper shows SREBP-1 activating the DGKtheta promoter, GO:0001228 fits.
