  - PR:Q9WTN3-1
  - PR:Q9WTN3-3
  review:
    summary: Transcription cis-regulatory region binding (ISO from mouse).
    action: MODIFY
    reason: Correct but less specific than the evidence supports. Nuclear SREBP-1 binds SRE-1 and E-box
      sequences in RNA polymerase II promoters (FAS, PCSK9, lipogenic genes), so the RNA polymerase II-specific
      cis-regulatory term GO:0000978, which the gene already carries by IBA and IDA, is the right refinement.
    proposed_replacement_terms:
    - id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    supported_by: &id002
    - &id003
      reference_id: PMID:7739539
      supporting_text: we demonstrate that ADD1/SREBP1 has dual DNA sequence specificity, binding to both
        an E-box motif (ATCACGTGA) and a non-E-box sequence previously shown to be important in cholesterol
        metabolism, sterol regulatory element 1 (SRE-1; ATCACCCCAC)
    - &id005
      reference_id: UniProtKB:P56720
      supporting_text: Binds to the sterol regulatory element 1 (SRE-1) (5'-ATCACCCCAC-3')
    - &id004
      reference_id: PMID:16407292
      supporting_text: verified the functionality of a SREBP-1c responsive element located from 335 bp
        to 355 bp upstream of the ATG
