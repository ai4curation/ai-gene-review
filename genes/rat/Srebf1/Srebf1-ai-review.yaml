id: P56720
gene_symbol: Srebf1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Srebf1 encodes sterol regulatory element-binding protein 1 (SREBP-1; ADD1), a basic helix-loop-helix
  leucine zipper transcription factor made as an inactive precursor anchored in the endoplasmic reticulum
  membrane by two transmembrane helices. Its C-terminal domain binds the escort protein SCAP. When sterols
  are low, or when insulin signals through Akt, the SCAP-SREBP-1 complex is packaged into COPII vesicles
  and carried to the Golgi, where site-1 and site-2 proteases cut it. The released N-terminal bHLH-ZIP
  fragment enters the nucleus, binds as a dimer to sterol regulatory elements (SRE-1, ATCACCCCAC) and
  E-boxes (ATCACGTGA) in target promoters, and activates RNA polymerase II transcription. The nuclear
  form is short-lived and is degraded by the proteasome. Two isoforms arise from alternative first exons.
  SREBP-1a is a strong activator of both cholesterogenic and lipogenic genes. SREBP-1c (ADD1), the main
  form in liver and adipose tissue, preferentially activates fatty acid and triglyceride synthesis genes
  such as FAS, ACC, SCD1, L-pyruvate kinase and S14, and also PCSK9. In rat hepatocytes SREBP-1c transcription
  is induced by insulin, glucose and LXR and repressed by glucagon/cAMP and polyunsaturated fatty acids,
  so it links carbohydrate and insulin status to de novo lipogenesis. It has been implicated in hepatic
  steatosis, including alcoholic fatty liver, and an Srebf1 variant in the spontaneously hypertensive
  rat affects hepatic cholesterol accumulation.
