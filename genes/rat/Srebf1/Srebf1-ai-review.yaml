core_functions:
- description: Nuclear SREBP-1 (processed N-terminal bHLH-ZIP fragment) binds sterol regulatory elements
    and E-boxes in RNA polymerase II promoters and activates transcription of lipogenic genes (FAS, ACC,
    L-PK, S14, SCD1; mainly SREBP-1c) and cholesterogenic genes (mainly SREBP-1a).
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0045723
    label: positive regulation of fatty acid biosynthetic process
  - id: GO:0045542
    label: positive regulation of cholesterol biosynthetic process
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:7739539
    supporting_text: When expressed in fibroblasts, ADD1/SREBP1 activates transcription through both the
      carbohydrate response E-box element and SRE-1
  - reference_id: PMID:8336713
    supporting_text: ADD1 can function as a sequence-specific transcriptional activator
  - reference_id: PMID:10207099
    supporting_text: we demonstrate that this factor is absolutely necessary for the stimulation by glucose
      of L-pyruvate kinase, fatty acid synthase, S14, and acetyl coenzyme A carboxylase gene expression
  - reference_id: PMID:16407292
    supporting_text: verified the functionality of a SREBP-1c responsive element located from 335 bp to
      355 bp upstream of the ATG
  - reference_id: file:rat/Srebf1/Srebf1-deep-research-manual.md
    supporting_text: 'SREBP-1A: higher activity, cholesterogenic and lipogenic targets; SREBP-1C (ADD1):'
- description: Sequence-specific binding to sterol regulatory element 1 (SRE-1, ATCACCCCAC), with dual
    specificity for E-box motifs, conferred by an atypical tyrosine in the basic region.
  molecular_function:
    id: GO:0032810
    label: sterol response element binding
  directly_involved_in:
  - id: GO:0032933
    label: SREBP signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:7739539
    supporting_text: we demonstrate that ADD1/SREBP1 has dual DNA sequence specificity, binding to both
      an E-box motif (ATCACGTGA) and a non-E-box sequence previously shown to be important in cholesterol
      metabolism, sterol regulatory element 1 (SRE-1; ATCACCCCAC)
  - reference_id: PMID:9786926
    supporting_text: SREBP2 was able to displace ADD1/SREBP1 binding from the sterol regulatory element
      (SRE) site
suggested_questions:
- question: Should rat Srebf1 carry GO:0070888 E-box binding (PMID:7739539) in addition to sterol response
    element binding, given that SREBP-1c activates lipogenic promoters through carbohydrate-response E-boxes?
- question: Does the human IDA to nuclear receptor activity (PMID:23610160) reflect SREBP-1 activity at
    all, or should it be repointed to DNA-binding transcription activator activity?
- question: Which rat lipogenic promoters are activated through SRE-1 versus E-box elements in vivo, and
    does the SREBP-1c isoform use the E-box mode preferentially?
suggested_experiments:
- description: ChIP-seq of nuclear SREBP-1 in refed rat liver with motif analysis, and reporter assays
    with the tyrosine-to-arginine basic-region mutant, to quantify SRE-1 versus E-box occupancy at lipogenic
    targets.
