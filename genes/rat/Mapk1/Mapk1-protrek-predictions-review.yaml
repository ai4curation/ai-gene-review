  label: Rattus norvegicus (Rat)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for rat Mapk1 (ERK2). A complete miss on the core function: MAP
  kinase activity (GO:0004707) is held in GOA with IDA support, and neither it nor protein serine/threonine
  kinase activity, ATP binding, or the ERK1/ERK2 cascade appears anywhere in the top five. The retrieval
  returns instead two telomere-maintenance terms, two nuclear-receptor signalling pathways and a craniofacial
  development term. The free-text channel fails in a more diagnostic way: its top two hits are the
  UniProt Function comments for MAPK7 (ERK5, activated by MAP2K5) and MAPK14 (p38 alpha) - the right
  family, the wrong members. For a 358-residue kinase whose activity is among the best-characterised
  in signal transduction, this is the sharpest paralog collapse in the rat set. Assessment: 1 correct
  not novel (CNN), 1 uncertain (UNC), 1 nonparalog incorrect (NPI).
