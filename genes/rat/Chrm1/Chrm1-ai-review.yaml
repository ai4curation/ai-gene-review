core_functions:
- description: Cell-surface acetylcholine receptor that activates Gq/11 and thereby phospholipase C-beta
    (phosphoinositide hydrolysis, IP3/Ca2+, DAG/PKC); secondary Gi/o coupling inhibits adenylate cyclase.
    The receptor does not itself catalyse the downstream reactions.
