suggested_questions:
- question: What does the RGD ISO source RGD:14227533 report for M1 in phototransduction and circadian
    clock entrainment, and was M1 identified genetically or only with nonselective muscarinic pharmacology?
- question: Should biosensor translocation readouts of second-messenger signalling (eGFP-PKC, eGFP-MARCKS)
    be annotated to positive regulation of intracellular protein transport, as for PMID:17908240?
- question: Is the pirenzepine-sensitive presynaptic receptor at the rat neuromuscular junction (PMID:12534975)
    genuinely M1, given pirenzepine selectivity limits?
suggested_experiments:
- description: Use Chrm1 knockout or M1-selective positive allosteric modulators in rat neuromuscular
    preparations to confirm M1 identity of the pirenzepine-sensitive presynaptic receptor.
- description: Quantify Gq versus Gi/o coupling of rat M1 in native hippocampal neurons using G-protein
    BRET sensors to establish the physiological relevance of adenylate cyclase inhibition.
