    - reference_id: PMID:17908240
      supporting_text: This protocol produced robust, reversible MCh-stimulated membrane recruitments
        of eGFP-PKCε, which mirror data obtained with the eGFP-PHPLCδ biosensor, suggesting that translocation
        of this probe is driven by changes in the concentration of DAG in the plasma membrane
    - reference_id: PMID:17908240
      supporting_text: Stimulation of M1 mACh receptors with MCh (3 μmol/L) produced a rapid and transient
        translocation of MARCKS to the cytoplasm, which quickly returned to the plasma membrane on agonist
        removal.
