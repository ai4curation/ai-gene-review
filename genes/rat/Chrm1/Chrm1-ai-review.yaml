id: P08482
gene_symbol: Chrm1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Muscarinic acetylcholine receptor M1, a class A (rhodopsin-like) seven-transmembrane G protein-coupled
  receptor. It binds acetylcholine at the cell surface and preferentially activates Gq/11 proteins, stimulating
  phospholipase C-beta, phosphoinositide hydrolysis, IP3/Ca2+ release and DAG/PKC signalling; it can also
  inhibit adenylate cyclase through pertussis-toxin-sensitive Gi/o proteins. M1 is the most abundant muscarinic
  receptor in forebrain (cortex, hippocampus, striatum, amygdala), where it is concentrated on somatodendritic
  membranes and postsynaptic densities of principal neurons, with a minor presynaptic pool in axon terminals.
  Through suppression of the M-current and other conductances it increases neuronal excitability and modulates
  synaptic transmission and plasticity, contributing to learning and memory; peripherally it contributes
  to salivary secretion and to modulation of acetylcholine release at the neuromuscular junction. Signalling
  is terminated by GRK-mediated desensitization.
