    summary: 'Proposed new process: rat M1 initiates the Gq/11-phospholipase C branch of acetylcholine
      receptor signalling, its primary transducing pathway.'
    action: NEW
    reason: Cloned rat M1 drives phosphoinositide hydrolysis in heterologous cells (PMID:2846274, PMID:1317867)
      and is the main Gq/11-PLC-coupled muscarinic receptor in rat hippocampal neurons (PMID:17908240).
      The receptor itself performs the initiating step (acetylcholine recognition and G-protein activation),
      so this is participation, not necessity. Rat GOA carries only the generic acetylcholine pathway
      (GO:0007213), of which this is a more informative descendant; the human ortholog carries GO:0007207.
