- id: PMID:12534975
  title: Modulation of ACh release by presynaptic muscarinic autoreceptors in the neuromuscular junction
    of the newborn and adult rat.
  findings:
  - statement: Pirenzepine-sensitive M1-type receptors enhance evoked ACh release at adult rat neuromuscular
      synapses
    supporting_text: the M1 receptor-selective antagonist pirenzepine (10 micro m) reduced evoked neurotransmission
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. Pharmacological (pirenzepine) evidence for an M1-type
      presynaptic receptor modulating ACh release at rat NMJ.
- id: PMID:17908240
  title: The regulation of M1 muscarinic acetylcholine receptor desensitization by synaptic activity in
    cultured hippocampal neurons.
  findings:
  - statement: M1 is the main Gq/11-PLC-coupled muscarinic receptor in hippocampus
    supporting_text: M1 mACh receptors are the major subtype signalling through Gq/11 to phospholipase
      C (PLC) and phosphoinositide hydrolysis in the hippocampus
  - statement: Agonist-stimulated MARCKS translocation is a readout of M1-driven PKC activity
    supporting_text: Stimulation of M1 mACh receptors with MCh (3 μmol/L) produced a rapid and transient
      translocation of MARCKS to the cytoplasm
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC2658029). Native rat hippocampal neurons; M1/Gq/PLC signalling and
      GRK/PKC-dependent desensitization. Protein translocations are biosensor readouts.
- id: PMID:8182478
  title: 'Distribution of m1-m4 muscarinic receptor proteins in the rat striatum: light and electron microscopic
    immunocytochemistry using subtype-specific antibodies.'
  findings:
  - statement: M1 is enriched in spiny dendrites and postsynaptic densities
    supporting_text: enriched in spiny dendrites and at postsynaptic densities
  - statement: A few M1-positive axon terminals form asymmetric synapses
    supporting_text: A small number of m1-immunoreactive axon terminals were observed, all forming asymmetrical
      synapses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. Subtype-specific antibody EM localization of m1 in rat
      striatum.
- id: PMID:2846274
  title: Cloned M1 muscarinic receptors mediate both adenylate cyclase inhibition and phosphoinositide
    turnover.
  findings:
  - statement: Rat M1 mediates both adenylate cyclase inhibition and PI turnover
    supporting_text: The cloned receptors mediated both adenylate cyclase inhibition and phosphoinositide
      hydrolysis, but by different mechanisms.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. Cloned rat M1 couples to both PI hydrolysis and PTX-sensitive
      cyclase inhibition.
- id: PMID:1317867
  title: Site-directed mutagenesis of the rat m1 muscarinic acetylcholine receptor. Role of conserved
    cysteines in receptor function.
  findings:
  - statement: Extracellular-loop cysteines required for ligand binding and PI signalling of rat m1
    supporting_text: display no carbachol-mediated hydrolysis of phosphoinositides
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. Rat m1 Cys mutagenesis in CHO cells; carbachol-stimulated
      PI hydrolysis readout.
- id: PMID:3037705
  title: Identification of a family of muscarinic acetylcholine receptor genes.
  findings:
  - statement: Rat muscarinic receptor cDNAs cloned from cerebral cortex
    supporting_text: Complementary DNAs for three different muscarinic acetylcholine receptors were isolated
      from a rat cerebral cortex library
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. Original cloning of rat muscarinic receptor family including
      m1.
- id: PMID:7751967
  title: Expression of m1-m4 muscarinic acetylcholine receptor proteins in rat hippocampus and regulation
    by cholinergic innervation.
  findings:
  - statement: M1 in somata and dendrites of hippocampal principal cells
    supporting_text: m1 is widely expressed in somata and dendrites of pyramidal neurons and granule cells
      in dentate gyrus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. Rat hippocampal m1 localization.
- id: PMID:23559406
  title: 'Muscarinic cholinergic receptor M1 in the rat basolateral amygdala: ultrastructural localization
    and synaptic relationships to cholinergic axons.'
  findings:
  - statement: M1 in axon terminals forming asymmetric synapses
    supporting_text: M1R immunoreactivity (M1R-ir) was also seen in axon terminals, most of which formed
      asymmetrical synapses.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. Rat BLA EM localization of M1.
- id: PMID:9371842
  title: Disruption of the m1 receptor gene ablates muscarinic receptor-dependent M current regulation
    and seizure activity in mice.
  findings:
  - statement: M1 mediates muscarinic M-current suppression in sympathetic neurons
    supporting_text: Because muscarinic suppression of the M current increases the rate of firing of sympathetic
      neurons
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; mouse m1 knockout loses muscarinic M-current suppression (ortholog
      evidence).
- id: PMID:12483218
  title: Selective cognitive dysfunction in acetylcholine M1 muscarinic receptor mutant mice.
  findings:
  - statement: M1 knockout mice have selective memory deficits
    supporting_text: severely impaired in non-matching-to-sample working memory as well as consolidation
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. Mouse knockout cognitive phenotype.
- id: PMID:15266016
  title: Cholinergic stimulation of salivary secretion studied with M1 and M3 muscarinic receptor single-
    and double-knockout mice.
  findings:
  - statement: M1 and M3 jointly mediate cholinergic salivation
    supporting_text: a mixture of M(1) and M(3) receptors mediates cholinergic stimulation of salivary
      flow
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. Mouse knockout salivation study.
