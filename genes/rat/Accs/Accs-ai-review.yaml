    label: carbon-sulfur lyase activity
  supported_by:
  - reference_id: PMID:39876065
    supporting_text: >-
      In this study, through a biochemical profiling approach, we demonstrate
      that human ACCS possesses cysteine conjugate sulfoxide β-lyase activity.
  - reference_id: PMID:39876065
    supporting_text: >-
      Notably, both W135 and R351 are highly conserved in mammalian ACCS
      orthologues (Figure 7).
knowledge_gaps:
- gap_statement: >-
    The endogenous physiological or xenobiotic cysteine S-conjugate sulfoxide
    substrates, metabolic pathway, and native subcellular localization of rat
    Accs have not been experimentally determined.
  boundary: >-
    Active-site identity with human cysteine S-conjugate sulfoxide beta-lyase
    ACCS is established (PMID:39876065), whereas direct biochemical,
    localization, and in vivo rat hepatic/renal mercapturic-acid studies of
    Accs are absent.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Classical rat hepatic and renal cysteine S-conjugate beta-lyase activities
    were extensively studied in toxicology, making it important to test whether
    rat Accs accounts for sulfoxide-selective C-beta-S lyase activity in rat
    liver and kidney.
  resolution: >-
    Fractionate rat liver and kidney extracts alongside recombinant rat Accs to
    test its contribution to hepatic cysteine S-conjugate sulfoxide cleavage.
  provenance:
  - reference_id: PMID:39876065
    supporting_text: >-
      Although understanding the biological function of hACCS still awaits in
      vivo study, our discovery of hACCS’s cysteine-conjugate sulfoxide Cβ-S
      lyase activity in vitro suggests hACCS is the potential missing link in
      the glutathione-based xenobiotic metabolic pathways.
