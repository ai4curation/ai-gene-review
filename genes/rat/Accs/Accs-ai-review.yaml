core_functions:
- description: >-
    Homodimeric fold-type I PLP-dependent carbon-sulfur beta-lyase inferred
    from 1:1 human ortholog ACCS to bind pyridoxal 5'-phosphate at Lys324 and
    catalyze alpha,beta-elimination of cysteine S-conjugate sulfoxides and
    thioethers via conserved Arg458 and partner-subunit pocket residues Trp136,
    Tyr133, and Arg352 (PMID:39876065).
  molecular_function:
