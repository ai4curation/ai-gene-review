description: >-
  1-aminocyclopropane-1-carboxylate synthase-like protein 1 (Accs) is a
  502-residue rat fold-type I pyridoxal 5'-phosphate (PLP)-dependent
  carbon-sulfur beta-lyase encoded on chromosome 3 adjacent to its
  mammalian-specific paralog Accsl. Assigned to the vertebrate clade
  PTHR43795:SF17 as the 1:1 ortholog of human ACCS and mouse Accs, rat Accs
  lacks plant 1-aminocyclopropane-1-carboxylate synthase activity toward
  S-adenosyl-L-methionine due to steric hindrance from partner-subunit Tyr133
  and absence of plant ACS catalytic residues, while strictly conserving the
  PLP Schiff-base Lys324, pyridinium-stabilizing Asp287, substrate
  alpha-carboxylate-anchoring Arg458, and inter-subunit homodimer pocket
  residues Trp136, Tyr133, and Arg352 that catalyze alpha,beta-elimination of
  cysteine S-conjugate sulfoxides and thioethers in human ACCS. Its endogenous
  physiological substrates, metabolic pathway, and native subcellular
  localization in rat tissues remain experimentally uncharacterized.
