- id: PMID:11470512
  title: >-
    The human cDNA for a homologue of the plant enzyme
    1-aminocyclopropane-1-carboxylate synthase encodes a protein lacking that
    activity.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Establishes that mammalian ACCS binds PLP and lacks plant ACC synthase
      activity, refuting the Ensembl-imported TrEMBL SubName on A0A8J8YIP6.
  findings:
  - statement: >-
      Mammalian PHACS/ACCS binds PLP but lacks 1-aminocyclopropane-1-carboxylate
      synthase activity.
    supporting_text: >-
      Purified recombinant PHACS, expressed in Pichia pastoris, contains bound
      pyridoxal-5'-phosphate (PLP), but does not catalyze the synthesis of ACC.
- id: PMID:39876065
  title: Cysteine S-conjugate sulfoxide β-lyase activity for human ACCS.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Demonstrates cysteine S-conjugate sulfoxide beta-lyase activity in human
      ACCS and confirms conservation of key catalytic pocket residues W135 and
      R351 across mammalian ACCS orthologs.
  findings:
  - statement: >-
      Mammalian ACCS orthologs conserve the inter-subunit pocket residues W135
      and R351 required for human ACCS cysteine S-conjugate sulfoxide
      beta-lyase catalysis.
    supporting_text: >-
      Notably, both W135 and R351 are highly conserved in mammalian ACCS
      orthologues (Figure 7).
