suggested_questions:
- question: >-
    Does rat Accs account for a sulfoxide-preferring fraction of hepatic and
    renal cysteine S-conjugate beta-lyase activity classically measured in rat
    toxicology studies?
  experts:
  - Yang Hai
  - Arthur J. L. Cooper
suggested_experiments:
- hypothesis: >-
    Recombinant rat Accs catalyzes PLP-dependent alpha,beta-elimination of
    S-phenyl-L-cysteine sulfoxide and nephrotoxic haloalkene-derived cysteine
    S-conjugate sulfoxides.
  description: >-
    Express and purify recombinant rat Accs (wild-type and K324A) and determine
    steady-state kinetic parameters toward S-aryl- and haloalkenyl-L-cysteine
    sulfoxides versus thioethers.
  experiment_type: Recombinant enzymology and toxicology substrate profiling
