  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P62937
  review:
    summary: Human source is an EXP annotation (PMID:29551599) identifying cell-surface CyPA as a receptor for a
      Mycoplasma genitalium adhesin.
    action: MARK_AS_OVER_ANNOTATED
    reason: CyPA has no transmembrane segment or lipid anchor; surface detection probably reflects secreted CyPA
      bound to heparans/CD147 rather than an integral plasma membrane location. Transfer of this host-pathogen observation
      to rat over-states the location.
    supported_by:
    - reference_id: PMID:11943775
      supporting_text: Both signaling and chemotactic activities of CyPA depended also on the presence of heparans,
