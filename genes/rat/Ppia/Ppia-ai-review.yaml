  review:
    summary: CyPA is secreted in response to oxidative stress and inflammatory stimuli and acts extracellularly
      as a ligand of BSG/CD147.
    action: ACCEPT
    reason: Secretion from VSMC and macrophages is well documented for human/mouse CyPA (PMID:15130913) and extracellular
      CyPA activity depends on its rotamase active site (PMID:11943775). The extracellular pool is a functionally
      important location for the catalytic activity.
    supported_by:
    - reference_id: PMID:15130913
      supporting_text: CyPA is secreted from smooth muscle cells and macrophages in response to oxidative stress
        and lipopolysaccharide
    - reference_id: file:rat/Ppia/Ppia-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Secretion occurs in response to oxidative stress in vascular smooth muscle through a vesicular
        secretory pathway
    - reference_id: PMID:11943775
      supporting_text: rotamase-defective CyPA mutants failed to initiate signaling events
