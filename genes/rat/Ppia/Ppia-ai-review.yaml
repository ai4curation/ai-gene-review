id: P10111
gene_symbol: Ppia
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Peptidyl-prolyl cis-trans isomerase A (cyclophilin A, CyPA) is an abundant, ubiquitously expressed
  single-domain cyclophilin that catalyses cis-trans isomerization of peptidyl-prolyl bonds. It is mainly a soluble
  cytosolic protein, with a minor nuclear pool, and is secreted in response to oxidative stress and inflammatory
  stimuli. Intracellularly it acts as a prolyl isomerase/chaperone for specific clients (for example in platelet
  calcium and integrin signalling and TARDBP-containing hnRNP assembly) and modulates stress kinase signalling such
  as ASK1. Extracellular CyPA binds heparan sulfate and the receptor BSG/CD147, triggering ERK activation, leukocyte
  chemotaxis and pro-inflammatory endothelial activation in a manner that requires its rotamase active site. CyPA
  is the principal intracellular receptor for cyclosporin A; the CyPA-cyclosporin complex inhibits the phosphatase
  calcineurin, which underlies the immunosuppressive action of the drug.
