- term:
    id: GO:0106057
    label: negative regulation of calcineurin-mediated signaling
  evidence_type: IDA
  original_reference_id: PMID:19832699
  qualifier: involved_in
  review:
    summary: Rat CyP-A inhibits calcineurin only when complexed with cyclosporin A; alone it slightly activates
      calcineurin.
    action: MARK_AS_OVER_ANNOTATED
    reason: In PMID:19832699 the CsA-CyP-A complex inhibited calcineurin phosphatase activity in vitro, whereas
      CyP-A alone produced a small activation. The inhibition is a drug-induced gain of function of the complex
      (as in PMID:1715244), not a normal biological role of Ppia, and the assay measured phosphatase activity on
      a peptide rather than calcineurin-mediated signalling. The annotation over-reads a pharmacological effect.
    supported_by:
    - reference_id: PMID:19832699
      supporting_text: Figure 3 shows that, whereas CyP-A alone produced a small (20%) activation of calcineurin,
        the CsA–CyP-A complex inhibited calcineurin by approx. 70%.
    - reference_id: PMID:1715244
      supporting_text: the complexes cyclophilin-CsA and FKBP-FK506 (but not cyclophilin, FKBP, FKBP-rapamycin,
        or FKBP-506BD) competitively bind to and inhibit the Ca(2+)- and calmodulin-dependent phosphatase calcineurin
    source_defects:
    - defect_type: OTHER
      resource: RGD
      record: RGD:3372
      slot: GO term
      requested_change: CHECK
      asserted_value: GO:0106057
      cause: OTHER
      confidence: PROBABLE
      explanation: The IDA annotation of rat Ppia to GO:0106057 negative regulation of calcineurin-mediated signaling
        (PMID:19832699) rests on in vitro inhibition of calcineurin by the cyclosporin A-CyP-A complex; CyP-A alone
        mildly activated calcineurin in the same assay. The effect is drug-dependent and should not be annotated
        as a function of Ppia itself; consider deleting or restricting the row.
      supported_by:
      - reference_id: PMID:19832699
        supporting_text: Figure 3 shows that, whereas CyP-A alone produced a small (20%) activation of calcineurin,
          the CsA–CyP-A complex inhibited calcineurin by approx. 70%.
