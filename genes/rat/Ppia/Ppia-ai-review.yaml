core_functions:
- description: Cyclophilin-type peptidyl-prolyl cis-trans isomerase that isomerizes peptidyl-prolyl bonds of client
    proteins, chiefly in the cytosol; the same rotamase activity is required for the signalling activity of secreted
    extracellular CyPA.
  molecular_function:
    id: GO:0003755
    label: peptidyl-prolyl cis-trans isomerase activity
  directly_involved_in:
  - id: GO:0000413
    label: protein peptidyl-prolyl isomerization
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: file:rat/Ppia/Ppia-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Catalyzes the cis-trans isomerization of proline imidic peptide bonds in oligopeptides
  - reference_id: PMID:19832699
    supporting_text: The effects of these modifications of CsA on interactions with CyP-D and CyP-A were investigated
      by measuring PPIase inhibition.
  - reference_id: PMID:11943775
    supporting_text: rotamase-defective CyPA mutants failed to initiate signaling events
suggested_questions:
- question: Should extracellular CyPA, which acts as a ligand of BSG/CD147 and heparans to drive leukocyte chemotaxis,
    be captured with an MF term such as signaling receptor binding or cytokine activity, and is there rat-specific
    evidence for its secretion?
- question: Should drug-dependent effects such as calcineurin inhibition by the CyPA-cyclosporin complex be annotated
    to Ppia at all, or only recorded as has_input/drug context on calcineurin?
suggested_experiments:
- description: Test whether rat vascular smooth muscle cells secrete Ppia under oxidative stress and whether a PPIase-dead
    mutant (R55A/F60A equivalents) loses BSG-dependent ERK activation in rat leukocytes.
