- term:
    id: GO:0001662
    label: behavioral fear response
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:96273
  review:
    summary: Behavioral fear response, propagated from mouse Htr1a (MGI) where knockout mice show increased
      anxiety-like behaviour.
    action: KEEP_AS_NON_CORE
    reason: Knockout-level phenotype reflecting the receptor's inhibitory control of serotonergic and
      limbic circuits; the receptor acts upstream of, rather than executing, the behaviour. Retained as
      a non-core organismal role; not a molecular or cellular core function.
    supported_by:
    - reference_id: PMID:18685031
      supporting_text: The 5-HT(1A)R is confined to the somatodendritic domain of central neurons, where
        it mediates serotonin-evoked hyperpolarization
    - reference_id: PMID:2140514
      supporting_text: The release of serotonin (5-HT) from the terminals of serotonergic (raphe) neurons
        is under inhibitory feed-back control
