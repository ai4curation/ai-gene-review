- id: file:rat/Htr1a/Htr1a-deep-research-manual.md
  title: Manual literature synthesis for rat Htr1a
core_functions:
- description: 'Serotonin-activated Gi/o-coupled receptor at the somatodendritic plasma membrane of central
    neurons: binds 5-HT with nanomolar potency, activates Galpha(o)/Galpha(i3)-containing G proteins,
    inhibits adenylate cyclase/cAMP-PKA signalling and gates GIRK-type K+ and voltage-gated Ca2+ currents,
    producing neuronal inhibition as a raphe autoreceptor and limbic/cortical heteroreceptor.'
  molecular_function:
    id: GO:0001586
    label: Gi/o-coupled serotonin receptor activity
  directly_involved_in:
  - id: GO:0007198
    label: adenylate cyclase-inhibiting serotonin receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0030425
    label: dendrite
  supported_by:
  - reference_id: PMID:2156831
    supporting_text: it mediates agonist-induced inhibition of basal and stimulated cAMP accumulation
      in transfected GH4C1 pituitary cells
  - reference_id: PMID:16772521
    supporting_text: 5-HT1A receptors were found to interact equally with Galpha(o) and Galpha(i3) in
      the cerebral cortex
  - reference_id: PMID:8271204
    supporting_text: this involves a PTX-sensitive G-protein in the transduction pathway
  - reference_id: PMID:12149253
    supporting_text: serotonin, by activating 5-HT(1A) receptors, suppress glutamatergic signaling through
      the inhibition of CaMKII, which is achieved by the inhibition of PKA and ensuing activation of PP1
  - reference_id: PMID:18685031
    supporting_text: The 5-HT(1A)R is confined to the somatodendritic domain of central neurons, where
      it mediates serotonin-evoked hyperpolarization
  - reference_id: file:rat/Htr1a/Htr1a-deep-research-manual.md
    supporting_text: Native rat brain receptors physically associate with Galpha(o) and Galpha(i3)
suggested_questions:
- question: PMID:8271204 is cited for adenylate cyclase-inhibiting serotonin receptor signaling (IMP),
    but its abstract reports cAMP-independent, PTX-sensitive GIRK activation. Does the full text contain
    an adenylate cyclase/cAMP experiment that supports GO:0007198, or should the row be re-pointed to
    a GIRK-coupling term (none is currently live; GO:0099109 is obsolete)?
- question: Is the presynaptic membrane / GABA-ergic synapse localization of 5-HT1A in basolateral amygdala
    (PMID:10381597) supported by anything beyond 8-OH-DPAT and spiperone pharmacology, given the classical
    somatodendritic and axon-initial-segment distribution of the receptor?
- question: Should GO:0007198 adenylate cyclase-inhibiting serotonin receptor signaling pathway be placed
    under GO:0007210 serotonin receptor signaling pathway (as its sibling GO:0007192 is), so that the
    two are not disjoint in the ontology?
suggested_experiments:
- description: Test the receptor assignment of presynaptic inhibition of GABA release in basolateral amygdala
    using the selective antagonist WAY-100635 and Htr1a knockout or knockdown, together with immuno-electron
    microscopy for 5-HT1A on GABAergic terminals.
