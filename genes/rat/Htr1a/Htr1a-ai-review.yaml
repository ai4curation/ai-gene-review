  review:
    summary: GPCR signaling pathway (IEA, InterPro).
    action: MODIFY
    reason: Correct but general. The rat receptor signals through Gi/o to inhibit adenylate cyclase/cAMP-PKA
      (cAMP inhibition in transfected cells; PKA-PP1-CaMKII cascade in PFC neurons; AC-cAMP-dependent
      presynaptic inhibition), so the specific pathway term GO:0007198, which the gene already carries,
      is preferred.
