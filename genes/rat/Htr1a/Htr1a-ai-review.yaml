- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:18685031
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6PEC3
  review:
    summary: Yif1B binds the 5-HT1A C-terminal 17-aa domain (yeast two-hybrid, GST pull-down) and is required
      for dendritic targeting.
    action: REMOVE
    reason: Bare protein binding is uninformative. The interaction is real and important, but the receptor
      is the trafficked cargo of the Yif1B ER/Golgi machinery; there is no informative molecular function
      of HTR1A to substitute. The biology is captured instead by the dendrite localization rows. Removal
      does not mean the interaction is false.
    supported_by:
    - reference_id: PMID:18685031
      supporting_text: Yif1B is a member of the ER/Golgi trafficking machinery, which plays a key role
        in specific targeting of 5-HT(1A)R to the neuronal dendrites
