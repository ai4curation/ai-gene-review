- term:
    id: GO:0007214
    label: gamma-aminobutyric acid signaling pathway
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:96273
  review:
    summary: GABA signaling pathway (acts_upstream_of_or_within), propagated from mouse knockout data.
    action: MARK_AS_OVER_ANNOTATED
    reason: HTR1A is a serotonin receptor; it does not bind GABA or transduce GABA receptor signals. Knockout-associated
      changes in GABAergic function are indirect circuit or compensatory effects. The legitimate link
      (5-HT1A inhibition of GABA release) is captured by the GABA-secretion and presynaptic-modulation
      rows.
    supported_by:
    - reference_id: PMID:10381597
      supporting_text: 5-HT inhibits GABAergic mIPSCs by inactivating the AC-cAMP signal transduction
        pathway via a G-protein-coupled 5-HT1A receptor
    - reference_id: PMID:18685031
      supporting_text: The 5-HT(1A)R is confined to the somatodendritic domain of central neurons, where
        it mediates serotonin-evoked hyperpolarization
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:96273
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Mouse donor rests on knockout phenotypes in GABAergic function; records an indirect consequence,
          not GABA signal transduction by the serotonin receptor.
