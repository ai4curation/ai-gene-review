    summary: Adenylate cyclase-inhibiting serotonin receptor signaling, IMP from a dorsal raphe GIRK-current
      study.
    action: ACCEPT
    reason: The pathway claim is correct for the gene (cAMP inhibition in transfected cells, PMID:2156831;
      PKA inhibition in PFC neurons, PMID:12149253). Note however that the cached abstract of PMID:8271204
