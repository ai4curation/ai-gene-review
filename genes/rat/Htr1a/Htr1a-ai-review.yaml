id: P19327
gene_symbol: Htr1a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Htr1a encodes the serotonin 5-HT1A receptor, a seven-transmembrane class A G protein-coupled
  receptor of the 5-hydroxytryptamine receptor subfamily. It binds serotonin with high affinity and couples
  to pertussis-toxin-sensitive Gi/o proteins (Galpha(o), Galpha(i3) and, regionally, Galpha(i1) and Galpha(z))
  to inhibit adenylate cyclase and cAMP/PKA signalling, activate G protein-gated inwardly rectifying K+
  channels and inhibit voltage-gated Ca2+ currents, producing neuronal hyperpolarization and inhibition.
  The receptor is targeted to the somatodendritic plasma membrane and axon hillock of central neurons,
  with dendritic targeting dependent on Yif1B. It acts as a somatodendritic autoreceptor on raphe serotonergic
  neurons, providing feedback inhibition of serotonin release, and as a postsynaptic heteroreceptor in
  limbic and cortical neurons, where it suppresses AMPA and NMDA receptor function and inhibits GABA release.
  It can form heteroreceptor complexes with FGFR1. Through these actions it influences anxiety-related
  behaviour, feeding and the response to antidepressant drugs.
