- term:
    id: GO:0090168
    label: Golgi reassembly
  evidence_type: IDA
  original_reference_id: PMID:10811609
  review:
    action: NEW
    summary: Recombinant rat p97 together with p47 drives regrowth of Golgi cisternae from mitotic Golgi
      fragments (rat liver Golgi) in vitro; p97/Ufd1/Npl4 does not.
    reason: 'Participation test: p97 is the ATPase that performs the p47-dependent membrane fusion reaction
      that rebuilds the cisternae; p47 is its cofactor and a p47 point mutant unable to bind p97 abolishes
      regrowth. Comparator check: rat Vcpip1 (VCIP135), a partner in the same reaction, carries GO:0090168
      by IDA (PMID:15037600), and rat Nsfl1c carries Golgi organization and membrane fusion by IDA. No
      VCP/Vcp in rat, mouse or human currently carries GO:0090168, so an expert should confirm this is
      an omission rather than a convention.'
    supported_by:
    - &id112
      reference_id: PMID:10811609
      supporting_text: Only a combination of p97 and p47 could promote reassembly.
    - &id113
      reference_id: PMID:9214505
      supporting_text: It is essential for the p97-mediated regrowth of Golgi cisternae from mitotic Golgi
        fragments, a process restricted to animal cells.
    - reference_id: PMID:20691684
      supporting_text: p47(F253S) could not form a complex with p97 and did not caused any cisternal regrowth
        in an in vitro Golgi reassembly assay.
