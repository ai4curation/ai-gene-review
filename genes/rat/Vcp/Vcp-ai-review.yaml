id: P46462
gene_symbol: Vcp
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Vcp (p97, transitional endoplasmic reticulum ATPase) is an abundant, highly conserved type
  II AAA+ ATPase of the Cdc48 family. Each subunit has an N-terminal cofactor-binding domain and two tandem
  AAA ATPase domains (D1, D2) that assemble into a homohexamer of two stacked rings around a central pore;
  D2 provides most of the ATP hydrolysis and D1 binds ADP tightly. Vcp uses the energy of ATP hydrolysis
  to unfold and extract ubiquitinated proteins from membranes, chromatin and protein complexes. Its activities
  are directed by mutually exclusive cofactors bound to the N domain: with the UFD1-NPL4 heterodimer it
  recognises polyubiquitinated substrates and pulls misfolded proteins out of the endoplasmic reticulum
  membrane for proteasomal degradation (ERAD), while with the p47 (NSFL1C) trimer and VCIP135 it drives
  membrane fusion that rebuilds Golgi cisternae and transitional ER after mitosis. Vcp is mainly cytosolic,
  docks on the cytosolic face of the ER membrane, and also acts in the nucleus. Studies of its orthologs
  extend its ubiquitin-dependent extraction role to autophagosome maturation, mitophagy, endolysosomal
  sorting, stress granule clearance, and removal of proteins from chromatin during DNA repair. Mutations
  in the human gene cause multisystem proteinopathy (inclusion body myopathy with Paget disease of bone
  and frontotemporal dementia).'
