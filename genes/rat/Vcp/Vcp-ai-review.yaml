suggested_questions:
- question: Should VCP/Vcp carry GO:0090168 Golgi reassembly, given that its partner VCIP135 carries it
    by IDA and the p97/p47 cisternal regrowth assay was done with rat Golgi and rat proteins (PMID:10811609,
    PMID:9214505)?
- question: Is there a GO molecular function term that captures the ATP-dependent segregase/unfoldase
    activity of Cdc48/p97 better than ATP hydrolysis activity, analogous to ATP-dependent protein disaggregase
    activity?
- question: Does the rat TER ATPase act in transition-vesicle budding from transitional ER (PMID:7806566),
    or is the in vitro antibody effect explained by its p47-dependent role in tER membrane assembly?
suggested_experiments:
- description: Test whether ATPase-dead (E578Q) rat Vcp supports p47-dependent Golgi cisternal regrowth
    in the rat liver mitotic Golgi fragment assay, to establish that ATP hydrolysis by Vcp itself drives
    Golgi reassembly.
  experiment_type: in vitro reconstitution
- description: In rat hippocampal neurons, rescue VCP knockdown with ATPase-dead or cofactor-binding-deficient
    Vcp to determine whether the dendritic spine phenotype requires the segregase activity or only the
    neurofibromin interaction.
  experiment_type: knockdown-rescue
