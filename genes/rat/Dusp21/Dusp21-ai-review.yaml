id: D3ZAQ8
gene_symbol: Dusp21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Rat Dusp21 encodes a small (189 aa) atypical dual specificity protein phosphatase of the
  DUSP18/DUSP21 subfamily, with a single DSPc catalytic domain containing the CX5R P-loop and a catalytic
  cysteine (Cys105) but no MAPK-docking or CH2 domain. It is expressed essentially only in testis. The
  orthologous enzyme hydrolyses phosphotyrosine and, less efficiently, phosphothreonine substrates in
  vitro. In rat testis the endogenous protein is imported into mitochondria through an internal targeting
  sequence and is a peripheral protein of the inner membrane on its matrix face. In mouse spermatozoa
  the ortholog is a microtubule inner protein anchored to tektin filaments in the A-tubule lumen of the
  flagellar doublet microtubules; its loss raises phosphorylation of axonemal proteins but leaves sperm
  motility and fertility normal. Physiological substrates are unknown.
