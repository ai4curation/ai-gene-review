  - UniProtKB-SubCell:SL-0191
  review:
    summary: Nucleus, transferred from the human ortholog (UniProt SubCell SL-0191).
    action: MARK_AS_OVER_ANNOTATED
    reason: The nuclear/cytoplasmic localization of DUSP21 comes from N-terminally tagged overexpression
      in COS cells (Hood et al. 2002). Endogenous DSP21 in rat testis is mitochondrial, and N-terminal
      tags were shown to block mitochondrial import of DSP18/21; mouse sperm structural work places it
      in the axoneme. There is no endogenous evidence for a nuclear pool.
