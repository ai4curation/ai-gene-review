core_functions:
- description: Atypical dual-specificity protein phosphatase (pTyr preferred, also pSer/pThr) acting at
    the matrix face of the mitochondrial inner membrane in testis and, in rodent spermatozoa, as an enzyme
    anchored inside the A-tubule of flagellar doublet microtubules; physiological substrates unknown.
  molecular_function: *id014
  locations:
  - *id021
  - *id022
  supported_by:
  - *id013
  - *id003
  - *id008
  - *id010
