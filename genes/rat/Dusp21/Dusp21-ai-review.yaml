    supporting_text: In Dusp21-/y spermatozoa, an increased proportion of up-phosphorylated sites was
      observed, consistent with its function as a phosphatase.
suggested_questions:
- question: What are the physiological substrates of DUSP21 in the mitochondrial matrix and in the sperm
    axoneme?
- question: Are the mitochondrial (Rardin et al. 2008) and axonemal (mouse cryo-EM) localizations of rodent
    DUSP21 stage-specific pools, or does the 2008 antibody signal need re-evaluation in light of the structural
    data?
- question: Should the mouse IDA annotations to flagellated sperm motility derived from DMT structure
    papers be retained given the normal motility of Dusp21 knockout sperm?
suggested_experiments:
- description: Substrate-trapping (C105S/D-to-A) DUSP21 pulldowns from rat testis mitochondria and sperm
    axonemes followed by mass spectrometry, cross-referenced with the hyperphosphorylated sites in Dusp21
    knockout sperm.
- description: Immuno-EM or cryo-ET of rat sperm flagella and testis sections to determine whether rat
    Dusp21 occupies the A-tubule MIP site seen in mouse and whether a mitochondrial pool exists in germ
    cells.
