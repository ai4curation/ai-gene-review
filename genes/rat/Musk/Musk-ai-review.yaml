core_functions:
- description: 'Agrin/LRP4-activated transmembrane receptor tyrosine kinase: autophosphorylates (juxtamembrane
    Tyr553, activation loop) and phosphorylates Dok7 and other effectors in the postsynaptic muscle membrane,
    initiating signalling that clusters acetylcholine receptors and assembles the neuromuscular junction.'
