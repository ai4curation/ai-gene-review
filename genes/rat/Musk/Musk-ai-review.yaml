suggested_questions:
- question: Does rat MuSK bind Rinl in muscle in vivo, and does Rinl-regulated Rab5/Rab22 endocytosis
    control MuSK surface levels or signalling at the NMJ?
- question: Is hippocampal MuSK in rat activated by agrin/LRP4 as in muscle, and does it signal through
    Dok7 there?
- question: Should the 14-3-3 gamma co-expression result (PMID:15604144) be represented as negative regulation
    of gene expression by MuSK, given that agrin-MuSK signalling physiologically induces synaptic genes?
suggested_experiments:
- description: Knock down or knock out Rinl in rat or mouse myotubes and measure agrin-induced MuSK endocytosis,
    phosphorylation and AChR clustering.
- description: Conditional neuronal Musk deletion in rodent hippocampus with LTP and memory testing to
    confirm the antisense knockdown results of PMID:16870737.
