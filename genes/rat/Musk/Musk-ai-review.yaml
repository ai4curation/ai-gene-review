id: Q62838
gene_symbol: Musk
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Muscle-specific kinase (MuSK) is a single-pass type I transmembrane receptor tyrosine kinase
  of skeletal muscle, with an ectodomain of Ig-like domains and a Frizzled-like cysteine-rich domain and
  a cytoplasmic tyrosine kinase domain. Neural agrin released by motor nerve terminals binds LRP4, which
  associates with MuSK and triggers MuSK dimerization and trans-autophosphorylation of its juxtamembrane
  NPXY tyrosine and activation loop; the adaptor Dok7 binds the phosphorylated juxtamembrane site, dimerizes
  MuSK further and is itself a substrate. Activated MuSK organizes the postsynaptic membrane of the neuromuscular
  junction: it drives clustering of nicotinic acetylcholine receptors via rapsyn, actin remodelling through
  Rac and other effectors, and synapse-specific gene expression in subsynaptic nuclei, and it is required
  both to form and to maintain the junction. MuSK is concentrated at the endplate in adult muscle and
  is re-expressed along the fibre after denervation. Wnt proteins can also bind its cysteine-rich domain.
  Lower-level expression in brain has been linked to hippocampal memory consolidation and long-term potentiation,
  and expression has been reported in retinal astrocytes and inner ear.'
