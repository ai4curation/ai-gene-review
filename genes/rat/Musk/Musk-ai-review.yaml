  review:
    summary: Plasma membrane location of MuSK (IBA).
    action: ACCEPT
    reason: 'MuSK is a single-pass type I plasma membrane receptor. Plasma membrane is not merely a general
      form of postsynaptic membrane here: MuSK is on the surface of cultured (aneural) myotubes, in prepatterned
      clusters before innervation and extrajunctionally after denervation, so plasma membrane is the appropriate
      location across contexts; postsynaptic membrane is accepted separately for the synaptic pool.'
