core_functions:
- description: Transfers long-chain acyl groups from acyl-CoA to L-carnitine at the cytosolic face of the mitochondrial
    outer membrane, forming acylcarnitines for import via the carnitine shuttle; this malonyl-CoA-inhibited step
    is rate-limiting for mitochondrial long-chain fatty acid beta-oxidation.
  molecular_function:
    id: GO:0004095
    label: carnitine O-palmitoyltransferase activity
  directly_involved_in:
  - id: GO:0006853
    label: carnitine shuttle
  - id: GO:0006635
    label: fatty acid beta-oxidation
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
