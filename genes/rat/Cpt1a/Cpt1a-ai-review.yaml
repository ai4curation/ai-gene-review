id: P32198
gene_symbol: Cpt1a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Carnitine O-palmitoyltransferase 1, liver isoform (CPT1A, L-CPT1) is a polytopic integral protein of
  the mitochondrial outer membrane, with two transmembrane segments, cytosolic N- and C-terminal domains and a short
  intermembrane-space loop. Its C-terminal catalytic domain, a member of the carnitine/choline acetyltransferase
  family with catalytic His473 and Asp477, transfers long-chain acyl groups from acyl-CoA to L-carnitine to form
  acylcarnitines. This is the first step of the carnitine shuttle and the rate-limiting, regulated entry point of
  long-chain fatty acids into mitochondrial beta-oxidation. Activity is inhibited by malonyl-CoA, the first intermediate
  of fatty acid synthesis, linking oxidation to lipogenic state; sensitivity is tuned by the N-terminal regulatory
  segment (a membrane-curvature-responsive structural switch), the loop/TM2 region, CK2 phosphorylation and membrane
  lipid environment. CPT1A forms trimers/hexamers through TM2 and associates with ACSL1 and VDAC in the outer membrane.
  Expressed mainly in liver and kidney, it controls hepatic fatty acid oxidation, ketogenesis and triglyceride output,
  and its expression is strongly induced by fasting, fatty acids and PPARalpha agonists. The human ortholog additionally
  has reported lysine succinyltransferase activity and a role recruiting ZDHHC4 to MAVS in type I interferon signalling.
