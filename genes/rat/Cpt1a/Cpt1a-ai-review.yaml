    summary: CPT1A catalyses the first step of the carnitine shuttle.
    action: NEW
    reason: 'The carnitine shuttle moves long-chain fatty acids into mitochondria via CPT1 (acylcarnitine formation
      at the outer membrane), carnitine-acylcarnitine translocase and CPT2. Rat CPT1A has experimentally established
      carnitine O-palmitoyltransferase activity at the outer membrane, so it performs a step of this process. Comparator
      check: human CPT1A, CPT2 and SLC25A20 carry GO:0006853, i.e. the term is used for the enzymes and transporter
      that do the steps. Not an ancestor/descendant of any other term carried.'
