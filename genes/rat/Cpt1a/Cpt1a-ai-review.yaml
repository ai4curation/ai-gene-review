  - *id004
  - *id003
  - *id006
  - *id002
suggested_questions:
- question: Does rat CPT1A have the peptide-lysine succinyltransferase activity reported for human CPT1A, and is
    it separable from carnitine acyltransfer (e.g. G710E)?
- question: Should the "regulation of fatty acid (beta-)oxidation" annotations to CPT1A be retired, given that CPT1A
    is the regulated enzyme of the pathway rather than an upstream regulator?
- question: Is the ZDHHC4-MAVS adaptor role of CPT1A conserved in rodents?
suggested_experiments:
- description: Assay recombinant rat CPT1A (wild type and a carnitine-transfer-dead mutant) for succinyl-CoA-dependent
    lysine succinylation of ENO1 in vitro and in hepatocytes.
- description: Test whether rat Cpt1a knockdown in macrophages or hepatocytes reduces MAVS palmitoylation and type
    I IFN responses after RNA-virus challenge.
