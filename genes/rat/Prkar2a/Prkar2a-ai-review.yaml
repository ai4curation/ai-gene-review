core_functions:
- description: 'cAMP-sensing inhibitory subunit of type II PKA: binds and inhibits the catalytic subunit
    in the R2C2 holoenzyme and releases it upon binding cAMP, coupling cAMP elevation to PKA activity.'
  molecular_function:
    id: GO:0004862
    label: cAMP-dependent protein kinase inhibitor activity
  directly_involved_in:
  - id: GO:0141156
    label: cAMP/PKA signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0005952
    label: cAMP-dependent protein kinase complex
  supported_by:
  - reference_id: PMID:21177871
    supporting_text: RII subunits bind to the catalytic subunits and potently inhibit their activity.
      cAMP causes the dissociation of C subunits from RII subunits and thereby activation of the catalytic
      subunits.
  - &id017
    reference_id: file:rat/Prkar2a/Prkar2a-uniprot.txt
    record_section:
    - CC:SUBUNIT
    supporting_text: The inactive form of the enzyme is composed of two regulatory chains and two catalytic
      chains. Activation by cAMP produces two active catalytic monomers and a regulatory dimer that binds
      four cAMP molecules.
- description: cAMP binding by two tandem cyclic nucleotide-binding domains (four cAMP per RIIalpha dimer),
    the trigger for catalytic-subunit release.
  molecular_function:
    id: GO:0030552
    label: cAMP binding
  directly_involved_in:
  - id: GO:0141156
    label: cAMP/PKA signal transduction
  in_complex:
    id: GO:0005952
    label: cAMP-dependent protein kinase complex
  supported_by:
  - reference_id: PMID:21177871
    supporting_text: binding of RIIα to cAMP was reduced by 50%
  - *id017
- description: Anchoring of PKA through docking of the AKAP amphipathic helix into the hydrophobic groove
    of the D/D-domain homodimer, targeting type II PKA to subcellular compartments (e.g. cardiac T-tubules
    with CaV1.2).
  molecular_function:
    id: GO:0019904
    label: protein domain specific binding
  supported_by:
  - reference_id: PMID:17081990
    supporting_text: A stable, hydrophobic docking groove is formed by the helical interface of two RIIalpha
      protomers.
  - reference_id: file:rat/Prkar2a/Prkar2a-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Type II regulatory chains mediate membrane association by binding to anchoring proteins,
      including the MAP2 kinase.
  - reference_id: PMID:14569017
    supporting_text: Whereas a clear overlap of Ca V 1.2 channel and RIIα staining was detected along
      the z -line in the transverse tubules
suggested_questions:
- question: Which RIIalpha species (rat or human) was used for the STD-NMR and SPR binding experiments
    in PMID:21177871 that RGD annotated to rat Prkar2a?
- question: What is the source study behind the RGD ISO annotations with/from RGD:14184392 (oocyte maturation,
    germinal vesicle), and does it show a positive role of type II PKA in meiotic resumption?
- question: Should GO provide a molecular-function term for A-kinase anchoring protein (AKAP) helix binding
    by PKA RII D/D domains, instead of the generic protein domain specific binding?
- question: Does RIIalpha contact the beta-2 adrenergic receptor directly (PMID:20395454), or only via
    AKAP150?
suggested_experiments:
- hypothesis: Type II PKA containing RIIalpha contributes to meiotic resumption control in rat oocytes
    distinctly from type I PKA.
  description: Knock down Prkar2a specifically in rat fully grown oocytes, or displace RII with an RII-selective
    AKAP disruptor peptide, and score germinal vesicle breakdown and MPF activity relative to RI-selective
    disruption.
