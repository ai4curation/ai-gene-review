- term:
    id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:104878
  - PANTHER:PTN000180782
  - PomBase:SPAC8C9.03
  - dictyBase:DDB_G0276027
  review:
    summary: IBA involved_in adenylate cyclase-activating GPCR signaling pathway.
    action: MODIFY
    reason: 'RIIalpha acts at the cAMP-sensing step: it binds cAMP and releases the catalytic subunit.
      That step is described precisely by GO:0141156 cAMP/PKA signal transduction (the intracellular cassette
      from cAMP production to PKA effectors). The GPCR pathway term is broader and includes receptor and
      G-protein steps RIIalpha does not perform; GO:0141156 is not a descendant of GO:0007189 in GO, so
      this is a lateral refinement to the cassette the gene actually executes.'
    proposed_replacement_terms:
    - id: GO:0141156
      label: cAMP/PKA signal transduction
    supported_by:
    - *id001
    - *id004
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: MGI:MGI:104878
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Donor R-subunit annotations record participation downstream of Gs-coupled receptors;
          the step performed by R subunits is cAMP sensing in the cAMP/PKA cassette.
      failure_modes:
      - GRANULARITY_MISMATCH
