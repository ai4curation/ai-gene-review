id: P12368
gene_symbol: Prkar2a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Prkar2a encodes RIIalpha, the type II-alpha regulatory subunit of cAMP-dependent protein
  kinase (PKA). RIIalpha has an N-terminal dimerization/docking (D/D) domain, a linker carrying an autoinhibitory
  site that occupies the catalytic cleft of the PKA catalytic subunit, and two tandem cyclic nucleotide-binding
  domains. Two RIIalpha chains and two catalytic chains form the inactive type II holoenzyme; binding
  of four cAMP molecules to the R dimer releases active catalytic subunits. The RIIalpha D/D domain forms
  a hydrophobic groove that docks the amphipathic helix of A-kinase anchoring proteins (AKAPs), targeting
  PKA to discrete sites such as cardiac T-tubules with CaV1.2, the perinuclear mAKAP compartment, synapses,
  centrosomes and the plasma membrane, and thereby compartmentalising cAMP signalling (for example in
  cardiac contractility).
