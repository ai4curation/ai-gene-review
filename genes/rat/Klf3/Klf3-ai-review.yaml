description: Klf3 (Kruppel-like factor 3, basic Kruppel-like factor/BKLF) encodes a widely expressed nuclear
  C2H2 zinc-finger transcription factor of the KLF family. Its three C-terminal zinc fingers bind CACCC-box
  and GC-rich cis-regulatory elements, and its N-terminal repression domain recruits C-terminal binding
  protein (CtBP) co-repressors through a PVDLT motif, together with FHL3 and SUMO modification, so that
  KLF3 acts mainly as a transcriptional repressor of RNA polymerase II genes. Studies of the mouse ortholog
  show that it represses Klf8, C/ebpalpha and a subset of KLF1 (EKLF) target genes, acting as a feedback
  repressor that counters KLF1 during erythroid maturation, and that it restrains adipocyte differentiation.
  In rat cardiac myocytes, Klf3 mRNA is transiently decreased by endothelin-1.
