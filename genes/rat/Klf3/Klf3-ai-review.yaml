core_functions:
- description: 'CtBP-dependent DNA-binding transcriptional repressor: KLF3 binds CACCC-box cis-regulatory
    elements of Pol II genes through its three C2H2 zinc fingers and represses them by recruiting CtBP
    co-repressors via its N-terminal PVDLT motif (inferred for rat from the mouse ortholog).'
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:9724649
    supporting_text: We show that mCtBP2 recognizes a related motif in the minimal repression domain of
      BKLF, and the integrity of this motif is required for repression activity.
  - reference_id: PMID:18687676
    supporting_text: Here we show that Bklf or Klf3 (Basic Krüppel-like factor) represses the Klf8 (Krüppel-like
      Factor 8) gene in vivo.
  - reference_id: file:rat/Klf3/Klf3-bioinformatics/RESULTS.md
    supporting_text: The CtBP-binding motif PVDLT (the motif mapped as required for repression in mouse
      BKLF) is present at residue 61 in rat, mouse and human.
- description: Sequence-specific binding of CACCC/GC-box cis-regulatory elements in Pol II promoters,
    the DNA-recognition activity underlying repression.
  molecular_function:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:18687676
    supporting_text: Chromatin immunoprecipitation experiments confirm that Klf3 occupies both Klf8 promoters
      in vivo.
  - reference_id: PMID:8657145
    supporting_text: BKLF binds with high affinity and preferentially over Sp1 to many CACCC sequences
      of erythroid cell expressed genes
  - reference_id: file:rat/Klf3/Klf3-bioinformatics/RESULTS.md
    supporting_text: 'Rat vs mouse KLF3: overall identity 97.4% over 344 columns; zinc-finger region identity
      100.0% over 84 columns.'
suggested_questions:
- question: Which genes does Klf3 repress in rat cardiac myocytes, and does the transient ET-1-induced
    fall in Klf3 mRNA translate into a change in Klf3 protein and derepression of CACCC-box targets during
    the hypertrophic response?
- question: Should the ARBA rule ARBA00093729 (cellular response to endothelin) be applied to KLF family
    members whose only supporting evidence is an expression change, given that it propagates IEP-level
    observations as process participation?
suggested_experiments:
- description: ChIP-seq for Klf3 and CtBP2 in neonatal rat cardiac myocytes before and after endothelin-1
    treatment, combined with Klf3 knockdown RNA-seq, to identify direct Klf3-repressed targets and test
    whether Klf3 loss contributes to the ET-1 transcriptional response.
  experiment_type: ChIP-seq
