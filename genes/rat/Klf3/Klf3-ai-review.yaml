    label: cellular response to endothelin
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00093729
  review:
    summary: Klf3 mRNA is transiently decreased (minimum at ~30 min) by endothelin-1 in neonatal rat cardiac
      myocytes; no function of Klf3 protein in the endothelin response was examined.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only evidence is a transient expression change of Klf3 mRNA in one cell type (IEP); the
      authors explicitly did not study Klf3 targets and focused further work on other KLFs. Klf3 does
      none of the work of the cellular response to endothelin. The ARBA IEA row likely generalises such
      KLF-family IEP annotations and rests on the same weak basis.
    supported_by: &id012
    - reference_id: PMID:18406357
      supporting_text: Whereas the decrease in expression of Klf3 was transient with minimal expression
        at ∼ 30 min (Fig. 1G)
    - reference_id: PMID:18406357
      supporting_text: Clearly, the genes which each of the Klfs regulates in cardiac myocytes remain
        to be established.
