- term:
    id: GO:0098632
    label: cell-cell adhesion mediator activity
  evidence_type: IC
  original_reference_id: PMID:9252369
  qualifier: enables
  review:
    summary: 'Proposed MF for PECAM-1''s own adhesive activity: trans-homophilic binding through Ig domain
      1 that holds two cells together.'
    action: NEW
    reason: 'PECAM-1 itself performs the adhesion: mutagenesis maps the homophilic binding site to its
      own Ig domain 1, and trans-homodimerization through Ig domains 1-2 is required for cell-cell interaction.
      The rat gene currently carries only protein homodimerization activity (a binding term) and BP adhesion
      terms, with no MF describing the adhesion-mediating activity. GO:0098632 is_a cell adhesion mediator
      activity and cell adhesion molecule binding, the category used for adhesion receptors that bridge
      cells; it is not an ancestor or descendant of any MF already on the gene. Inferred by curator from
      the conserved Ig domain 1 homophilic site (human mutagenesis) and rat in vivo evidence that PECAM-1
      engagement is required at endothelial junctions.'
    supported_by:
    - reference_id: PMID:9252369
      supporting_text: the NH2-terminal (membrane-distal) immunoglobulin domain of CD31 is necessary but
        not sufficient to support stable homophilic adhesion
    - reference_id: file:rat/Pecam1/Pecam1-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Trans-homodimer (via Ig-like C2-type 1 and Ig-like C2-type 2 domains); trans-homodimerization
        is required for cell-cell interaction.
    - reference_id: file:rat/Pecam1/Pecam1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Trans-homophilic interaction may play a role in endothelial cell-cell adhesion
        via cell junctions.
