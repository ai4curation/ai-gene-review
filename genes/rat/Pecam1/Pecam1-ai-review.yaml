suggested_questions:
- question: Should GO:0072011 glomerular endothelium development be propagated by ISO when the human source
    annotation is IEP (expression in developing glomeruli)?
- question: Does PECAM-1 participate in T cell activation, or act as an ITIM-dependent negative regulator
    of TCR signaling (PMID:11259373 donor claim)?
- question: Is the mouse smooth muscle contractile fiber localization (PMID:18332105) a genuine smooth-muscle
    location or endothelial staining within muscle tissue?
suggested_experiments:
- description: In rat RBE4 or primary brain endothelial cells, express ITIM tyrosine-to-phenylalanine
    (Y660F/Y683-equivalent) Pecam1 mutants and test whether loss of SHP-2 docking abolishes the PECAM-1-mediated
    block of ICAM-1-induced RhoA activation and stress fibre formation.
