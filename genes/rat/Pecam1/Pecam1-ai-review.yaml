id: Q3SWT0
gene_symbol: Pecam1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Pecam1 encodes platelet endothelial cell adhesion molecule 1 (PECAM-1, CD31), a type I transmembrane
  glycoprotein of the immunoglobulin superfamily with six extracellular Ig-like C2-type domains, a single
  transmembrane helix and a short cytoplasmic tail carrying an immunoreceptor tyrosine-based inhibitory
  motif (ITIM, Tyr-660). It is expressed on endothelial cells, where it concentrates at lateral intercellular
  junctions and recycles through the lateral border recycling compartment, and on platelets and most leukocytes.
  Trans-homophilic binding through its membrane-distal Ig domains mediates endothelial cell-cell adhesion
  and leukocyte-endothelial interactions, and heterophilic partners such as CD177 and CD38 add further
  contacts. PECAM-1 is required for the transmigration (diapedesis) step of leukocyte extravasation: in
  rat models antibody blockade inhibits neutrophil passage through the endothelium without affecting rolling
  or firm adhesion. Engagement of PECAM-1 leads to tyrosine phosphorylation of its ITIM and docking of
  the tyrosine phosphatase SHP-2 (PTPN11), through which it transmits inhibitory signals; in rat brain
  endothelial cells this counteracts ICAM-1-induced RhoA activation, cortactin phosphorylation and stress
  fibre formation. PECAM-1 also acts as the force-transmitting element of an endothelial mechanosensory
  complex with VE-cadherin and VEGFR2 that mediates responses to fluid shear stress, and it contributes
  to endothelial barrier integrity, angiogenesis and clearance of apoptotic leukocytes.'
