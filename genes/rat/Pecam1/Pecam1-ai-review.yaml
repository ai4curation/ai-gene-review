  review:
    summary: IBA immune response from the Ig Fc receptor-like PANTHER node PTN008518992.
    action: MARK_AS_OVER_ANNOTATED
    reason: The family node is dominated by Fc receptors and immune Ig receptors whose activities directly
      drive immune effector responses. PECAM-1's contribution is to leukocyte trafficking (diapedesis)
      and inhibitory ITIM signaling; these are captured by specific terms in this review (diapedesis,
      neutrophil and monocyte extravasation). The bare 'immune response' term adds no information for
      PECAM-1 and overstates its role as an immune response effector.
    supported_by:
    - &id018
      reference_id: file:rat/Pecam1/Pecam1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Cell adhesion molecule which is required for leukocyte transendothelial migration
        (TEM) under most inflammatory conditions.
    - *id005
