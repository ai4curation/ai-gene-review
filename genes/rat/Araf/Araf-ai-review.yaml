proposed_new_terms:
- proposed_name: positive regulation of Ras protein signal transduction (via NF1/RasGAP
    antagonism)
  proposed_definition: A kinase-independent function of A-Raf in which A-Raf binds
    RAS and competes with NF1 (a RasGAP) for RAS, reducing NF1-stimulated GTP hydrolysis
    and thereby increasing RAS-GTP levels and positively regulating Ras protein signal
    transduction. This activity requires the A-Raf RAS-binding capacity and its unique
    N-terminus, but not dimerization or kinase activity.
  justification: The falcon deep research report (anchored on Su et al. 2022, Molecular
    Cell) documents a non-catalytic mechanism by which ARAF antagonizes NF1 binding
    to RAS to increase RAS-GTP. This RAS-node regulatory function is not captured
    by any of the existing GOA annotations (none cover regulation of Ras GTPase activity
    or RasGAP antagonism). The existing GO term GO:0046579 (positive regulation of
    Ras protein signal transduction) already exists and is an appropriate fit, so
    this is a candidate missing annotation rather than a genuinely novel ontology
    term. Cross-species (human/mouse) mechanistic inference for the rat ortholog.
  proposed_parent:
    id: GO:0035556
    label: intracellular signal transduction
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: GO:0046579
      label: positive regulation of Ras protein signal transduction
  supported_by:
  - reference_id: file:rat/Araf/Araf-deep-research-falcon.md
    supporting_text: 'A more recent mechanistic study demonstrates another kinase-independent
      function: **ARAF can increase RAS‑GTP by antagonizing NF1 (a RasGAP) binding
      to RAS**, thereby reducing NF1-stimulated GTP hydrolysis.'
    reference_section_type: OTHER
suggested_questions:
- question: Does rat A-Raf (P14056) recapitulate the kinase-independent NF1/RasGAP
    antagonism described for human/mouse ARAF (Su et al. 2022), i.e. does rat A-Raf
    increase RAS-GTP by competing with NF1 for RAS binding independent of its kinase
    activity?
