- term:
    id: GO:0032434
    label: regulation of proteasomal ubiquitin-dependent protein catabolic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: Regulation of proteasomal ubiquitin-dependent protein catabolic process, inferred
      by sequence similarity to human ARAF (UniProtKB:P10398) from the PRR5L degradation study.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      In the source study, ARAF acts through ERK to raise expression of the E3 ligase RFFL, which
      then ubiquitinates PRR5L. ARAF is several steps upstream: it changes the abundance of an
      E3 ligase and has no direct part in ubiquitination or proteasomal targeting. Annotating the
      kinase to regulation of proteasomal catabolism overstates its role; the finding is better
      represented by the regulation of TOR signaling rows.
    supported_by:
    - reference_id: PMID:22609986
      supporting_text: Knockdown of ARAF, but not BRAF or CRAF, by siRNAs inhibited Gα12QL-mediated
        upregulation of RFFL expression and polyubiquitination of PRR5L
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P10398
        source_label: ARAF
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The human ARAF donor annotation (IMP, PMID:22609986) records that ARAF knockdown
          blocked RFFL upregulation and PRR5L polyubiquitination. The ortholog transfer itself is
