- term:
    id: GO:0004709
    label: MAP kinase kinase kinase activity
  evidence_type: IDA
  original_reference_id: PMID:10648842
  review:
    summary: MAP kinase kinase kinase activity, from immunoprecipitation kinase assays of Raf
      isoforms, including A-Raf, from rat liver.
    action: ACCEPT
    reason: >-
      The study detected A-Raf in fetal and adult rat liver and assayed immunoprecipitated Raf and
      MEKK isoforms for MEK-phosphorylating activity. The abstract reports that none of these
      accounted for the EGF-sensitive hepatic MEK kinase activity; it does not say A-Raf lacked
      MEK kinase activity. The cached record is abstract-only, the curator read the full text, and
      MEK kinase activity is the established function of RAF-family kinases, so the annotation is
      accepted. (Earlier review text called this evidence mismatched; that judgment cannot be made
      from the abstract.)
