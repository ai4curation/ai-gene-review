- term:
    id: GO:0032006
    label: regulation of TOR signaling
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: Regulation of TOR signaling, inferred by sequence similarity to human ARAF
      (UniProtKB:P10398), based on the Galpha12-ARAF-RFFL-PRR5L pathway that controls mTORC2.
    action: KEEP_AS_NON_CORE
    reason: >-
      In human cells, Galpha12 activates ARAF, which via ERK upregulates the E3 ligase RFFL; RFFL
      degrades the mTORC2 subunit PRR5L, increasing mTORC2-mediated PKC-delta phosphorylation.
      ARAF knockdown, but not BRAF or CRAF knockdown, blocked this, so the regulatory role is
      specific to ARAF. It is an upstream, indirect input into mTORC2 rather than the core
      MAPKKK function, so it is kept as non-core.
    supported_by:
    - reference_id: UniProtKB:P14056
      supporting_text: May also regulate the TOR signaling cascade (By similarity).
    - reference_id: PMID:22609986
      supporting_text: Knockdown of ARAF, but not BRAF or CRAF, by siRNAs inhibited Gα12QL-mediated
        upregulation of RFFL expression and polyubiquitination of PRR5L
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P10398
