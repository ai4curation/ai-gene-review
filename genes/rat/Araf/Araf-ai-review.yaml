id: P14056
gene_symbol: Araf
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Araf encodes A-Raf, a serine/threonine protein kinase of the RAF family (with
  B-Raf and Raf-1/C-Raf). It has an N-terminal RAS-binding domain, a cysteine-rich zinc-binding
  domain and a C-terminal kinase domain. Inactive A-Raf monomers are cytosolic; RAS-GTP recruits
  them to the plasma membrane, where they form active dimers and phosphorylate and activate the MAP
  kinase kinases MEK1/2, relaying mitogenic signals to ERK. A-Raf has weaker intrinsic MEK kinase
  activity than B-Raf. It also has kinase-independent roles, including binding MST2 to restrain
  MST2-driven apoptosis and competing with NF1 for RAS to sustain RAS-GTP. Human ARAF also acts
  downstream of Galpha12 to promote degradation of the mTORC2 subunit PRR5L, which regulates mTORC2
  signaling.
