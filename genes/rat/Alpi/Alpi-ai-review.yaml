id: P15693
gene_symbol: Alpi
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Alpi encodes intestinal-type alkaline phosphatase 1 (IAP-I; EC 3.1.3.1),
  a zinc- and magnesium-dependent, homodimeric phosphomonoesterase of the alkaline
  phosphatase family that is expressed in the small-intestinal epithelium. The enzyme
  is a glycosylated ectoenzyme attached to the outer leaflet of the enterocyte apical
  (brush-border) plasma membrane by a glycosylphosphatidylinositol (GPI) anchor, from
  which it can be released by phosphatidylinositol-specific phospholipase C; it hydrolyses
  a broad range of phosphate monoesters with optimal activity at alkaline pH, releasing
  inorganic phosphate. Rat intestine expresses a second, closely related isozyme (IAP-II)
  that differs in C-terminal sequence, metal coordination and response to dietary fat.
  Physiological roles attributed to intestinal alkaline phosphatase, including dephosphorylation
  of bacterial lipopolysaccharide, of luminal nucleotides (ATP/ADP/AMP to adenosine)
  and of dietary phosphate esters, and support of gut barrier function, follow from
  this catalytic activity.
