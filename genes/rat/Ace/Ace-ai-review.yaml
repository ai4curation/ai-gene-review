        source_status: UNRESOLVED
        comment: Mouse donor IDA (PMID:18158355, PMID:27649628) not read; canonical ACE chemistry is dipeptide
          release (EC 3.4.15.1).
    supported_by:
    - reference_id: UniProtKB:P47820
      supporting_text: Dipeptidyl carboxypeptidase that removes dipeptides from the C-terminus of a variety
