- term:
    id: GO:0002003
    label: angiotensin maturation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:87874
  - PANTHER:PTN002575151
  - UniProtKB:P12821
  review:
    summary: Ace converts angiotensin I to angiotensin II by removing the C-terminal His-Leu dipeptide;
      this is its defining physiological activity.
    action: ACCEPT
    reason: Core function. Rat ACE in CSF converts Ang I to Ang II (PMID:2172462), and the curated UniProt
      function names the conversion as the major role of the enzyme. ACE is the protease that performs
      this processing step, so it is a genuine participant in angiotensin maturation (unlike the substrate
      angiotensinogen).
    supported_by:
    - reference_id: UniProtKB:P47820
      supporting_text: Plays a major role in the angiotensin-renin system that regulates blood pressure
        and sodium retention by the kidney by converting angiotensin I to angiotensin II, resulting in
        an increase of the vasoconstrictor activity of angiotensin
    - reference_id: PMID:2172462
      supporting_text: which sequentially degraded bradykinin (BK) by liberating the carboxy-terminal
        dipeptides and converted angiotensin I to angiotensin II
