        role in the regulation of blood pressure, electrolyte homeostasis or synaptic plasticity
    - reference_id: PMID:2172462
      supporting_text: which sequentially degraded bradykinin (BK) by liberating the carboxy-terminal
        dipeptides and converted angiotensin I to angiotensin II
    - reference_id: PMID:20487892
      supporting_text: Product release was inhibited by low concentrations of MK-421 but not by Thiorphan,
        indicating that the cleavage of the heptapeptide was mediated by the angiotensin converting enzyme.
