id: P47820
gene_symbol: Ace
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Ace encodes somatic angiotensin I-converting enzyme (ACE, kininase II, EC 3.4.15.1), a zinc-
  and chloride-dependent peptidyl-dipeptidase of the peptidase M2 family. The somatic enzyme is a type
  I transmembrane ectoenzyme with two homologous extracellular catalytic domains (N- and C-domain), anchored
  in the plasma membrane of vascular endothelium and of absorptive epithelia (renal proximal tubule and
  intestinal brush border); juxtamembrane shedding releases a soluble form that circulates in plasma and
  is present in cerebrospinal fluid. ACE removes C-terminal dipeptides from oligopeptides. Its principal
  physiological actions are conversion of angiotensin I to the vasoconstrictor angiotensin II (C-domain
  preferred) and inactivation of the vasodilator bradykinin, which together raise systemic arterial blood
  pressure and promote sodium retention within the renin-angiotensin system. It also inactivates or processes
  other bioactive peptides, including substance P, neurotensin, enkephalins (converting Met-enkephalin-Arg-Phe
  to Met-enkephalin, with effects on synaptic plasticity), angiotensin-(1-7), gonadoliberin, and the haematopoietic
  regulator N-acetyl-Ser-Asp-Lys-Pro (AcSDKP, N-domain preferred), and in the intestine contributes to
  digestion of prolyl peptides. An alternative intragenic promoter produces a testis-specific isoform
  (germinal ACE) with only the C-domain, expressed in spermatocytes and on the sperm midpiece and shed
  during epididymal transit, which is required for male fertility through unidentified substrates. In
  the rat, Ace lies at a chromosome 10 blood-pressure locus and is a candidate modifier of hypertensive
  end-organ damage.
