      precise location is the extracellular space.
    action: MODIFY
    reason: Correct but general. Serum Ace activity was measured directly in the rat (PMID:19307186) and
      a soluble peptidyl dipeptidase is present in rat CSF (PMID:2172462); UniProt describes release into
      blood plasma after juxtamembrane shedding. All rows to this term are refined to GO:0005615 extracellular
      space.
