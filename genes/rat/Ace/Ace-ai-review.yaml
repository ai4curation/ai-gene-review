suggested_questions:
- question: Does rat ACE (somatic or germinal) have genuine single-residue carboxypeptidase activity on
    any physiological substrate, as implied by the mouse metallocarboxypeptidase annotations, or do these
    reflect dipeptidyl trimming of antigenic peptides?
- question: Is the chromosome 10 malignant-hypertension modifier effect in Ren2 rats due to Ace expression
    level (and tissue AcSDKP) rather than the L341F N-domain substitution, and which tissue pool of ACE
    matters?
- question: GO has no specific process terms for AcSDKP or angiotensin-(1-7) degradation; should these
    ACE N-domain/C-domain roles be represented by new catabolic process terms, or by has_input on the
    peptidyl-dipeptidase activity in GO-CAM?
suggested_experiments:
- hypothesis: In the rat, angiotensin I conversion depends mainly on the C-domain and AcSDKP degradation
    on the N-domain.
  description: Domain-selective inactivation (N- or C-domain HEXXH mutants) of rat Ace by genome editing,
    measuring plasma and tissue Ang II, bradykinin, AcSDKP and Ang-(1-7) and blood pressure, to apportion
    each physiological substrate to a domain in the rat.
  experiment_type: genetic perturbation with peptidomics
- hypothesis: Ace expression level, not linked genes, is the chromosome 10 modifier of malignant hypertension
    severity.
  description: Allele replacement of Fischer Ace with Lewis Ace (and vice versa) on the Ren2 inducible-hypertension
    background to test whether Ace alone accounts for the chromosome 10 end-organ-damage QTL.
  experiment_type: congenic allele replacement
- hypothesis: Germinal ACE processes specific sperm-surface or epididymal peptide substrates required
    for fertilization competence.
  description: Unbiased substrate profiling of germinal (testis) ACE on epididymal fluid and sperm-surface
    peptides/GPI-anchored proteins to identify the substrates required for male fertility.
  experiment_type: substrate profiling / proteomics
