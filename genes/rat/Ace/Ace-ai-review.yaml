- term:
    id: GO:0007283
    label: spermatogenesis
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:87874
  review:
    summary: Testicular ACE is needed for sperm fertilizing ability, not for formation of spermatozoa
      (mouse acts-upstream donor PMID:17135368).
    action: MARK_AS_OVER_ANNOTATED
    reason: Germinal ACE is expressed in spermatocytes and placed on the sperm midpiece, then totally
      shed in the epididymis (PMID:12444051); its loss impairs male fertility through sperm function,
      while spermatogenesis proceeds. The substrates required are unknown. Spermatogenesis over-states
      the role.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes: *id003
      source_entities:
      - source_id: MGI:MGI:87874
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Donor annotation rests on a knockout/overexpression phenotype downstream of angiotensin
          II; it records necessity or consequence, not a step performed by ACE.
    supported_by:
    - reference_id: UniProtKB:P47820
      supporting_text: The identity of substrates that are needed for male fertility is unknown.
    - reference_id: PMID:12444051
      supporting_text: the rodent germinal ACE is released from the testicular sperm membrane when sperm
        enter the epididymis
