      supporting_text: This was associated with a long-term reduction in blood pressure by approximately
        15 mm Hg, exclusively in the spontaneously hypertensive rat.
    - reference_id: UniProtKB:P47820
      supporting_text: Also able to inactivate bradykinin, a potent vasodilator, and therefore enhance
        the blood pressure response
