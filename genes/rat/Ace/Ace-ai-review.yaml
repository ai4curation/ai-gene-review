- term:
    id: GO:0003779
    label: actin binding
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - UniProtKB:P12821
  - UniProtKB:P12821-1
  review:
    summary: Actin binding transferred from human ACE isoform 1; no supporting donor annotation is now
      retrievable and ACE has only a ~30-residue cytoplasmic tail.
    action: MARK_AS_OVER_ANNOTATED
    reason: ACE is a type I ectoenzyme whose catalytic domains face the extracellular space; actin binding
      is not part of its described function in UniProt. A QuickGO query (2026-10-28) found no current
      human ACE annotation to GO:0003779, so the ISO donor appears stale. Retaining actin binding as a
      function of rat Ace over-reaches the evidence.
    propagation_review:
      root_cause: SOURCE_STALE_OR_MISSING
      source_entities:
      - source_id: UniProtKB:P12821
        source_status: SOURCE_STALE_OR_MISSING
        comment: No current human ACE annotation to actin binding was found in QuickGO (2026-10-28).
      - source_id: UniProtKB:P12821-1
        source_status: SOURCE_STALE_OR_MISSING
        comment: No current human ACE annotation to actin binding was found in QuickGO (2026-10-28).
    supported_by:
    - reference_id: UniProtKB:P47820
      supporting_text: Single-pass type I membrane protein
- term:
    id: GO:0004175
    label: endopeptidase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - UniProtKB:P12821
  review:
    summary: ACE can cleave internally in blocked peptides (e.g. release of the N-terminal tripeptide
      of LH-RH), a secondary endopeptidase-like activity.
    action: KEEP_AS_NON_CORE
    reason: Human ACE hydrolyses N- and C-terminally blocked LH-RH, including cleavage of the Trp-Ser
      bond to release pGlu-His-Trp (PMID:2983326), and degrades amyloid-beta. These are real but secondary
      to the dipeptidyl carboxypeptidase activity.
    supported_by:
    - reference_id: PMID:2983326
      supporting_text: human ACE, although it is named peptidyl dipeptidase or dipeptidyl carboxypeptidase,
        can cleave a protected peptide at the NH2 or COOH terminus
    - reference_id: UniProtKB:P47820
      supporting_text: Catalyzes cleavage of cholecystokinin (maturation of Cholecystokinin-8 and Cholecystokinin-5)
        and Gonadoliberin-1 (both maturation and degradation) hormones
- term:
    id: GO:0004181
    label: metallocarboxypeptidase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - MGI:MGI:87874
  review:
    summary: Metallocarboxypeptidase activity transferred from mouse (donor IDA PMID:18158355, PMID:27649628);
      ACE is classified as a peptidyl-dipeptidase (EC 3.4.15.1), not a single-residue carboxypeptidase.
    action: UNDECIDED
    reason: GO:0004181 asserts release of a single C-terminal residue. The canonical ACE reaction releases
      a C-terminal dipeptide and is already captured by GO:0008241. The mouse donor papers (antigen-peptide
      trimming by ACE) were not available to verify whether single-residue release was shown, so the row
      is left undecided rather than removed.
