- term:
    id: GO:0002446
    label: neutrophil mediated immunity
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:87874
  review:
    summary: Mouse-derived acts-upstream annotation from myeloid ACE overexpression (PMID:17082641 donor);
      not a process ACE executes.
    action: MARK_AS_OVER_ANNOTATED
    reason: The donor phenotype comes from mice with ectopic/over-expression of ACE in myeloid cells,
      where enhanced neutrophil function follows by an unresolved mechanism. ACE's established activity
      is peptide processing; there is no evidence that rat Ace performs a step of neutrophil-mediated
      immunity.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes: &id003
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:87874
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Donor annotation rests on a knockout/overexpression phenotype downstream of angiotensin
          II; it records necessity or consequence, not a step performed by ACE.
    supported_by:
    - reference_id: UniProtKB:P47820
      supporting_text: Dipeptidyl carboxypeptidase that removes dipeptides from the C-terminus of a variety
        of circulating hormones, such as angiotensin I, bradykinin or enkephalins, thereby playing a key
        role in the regulation of blood pressure, electrolyte homeostasis or synaptic plasticity
- term:
    id: GO:0003081
    label: regulation of systemic arterial blood pressure by renin-angiotensin
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P12821
  review:
    summary: Ace is the converting enzyme of the renin-angiotensin system and so a direct participant
      in RAS control of systemic arterial blood pressure.
    action: ACCEPT
    reason: Core process. ACE catalyses the Ang I to Ang II step of the renin-angiotensin system and inactivates
      bradykinin; antisense knock-down of Ace lowers blood pressure in SHR (PMID:10506486).
    supported_by:
    - reference_id: UniProtKB:P47820
      supporting_text: Plays a major role in the angiotensin-renin system that regulates blood pressure
        and sodium retention by the kidney by converting angiotensin I to angiotensin II, resulting in
        an increase of the vasoconstrictor activity of angiotensin
    - reference_id: PMID:10506486
      supporting_text: This was associated with a long-term reduction in blood pressure by approximately
        15 mm Hg, exclusively in the spontaneously hypertensive rat.
- term:
