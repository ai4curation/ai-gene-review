- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IEP
  original_reference_id: PMID:14527966
  qualifier: involved_in
  review:
    summary: Carotid body ACE activity rises during chronic hypoxia; this is regulation of Ace by hypoxia.
    action: MARK_AS_OVER_ANNOTATED
    reason: Inducible expression or activity of Ace under this condition shows that Ace is regulated by
      the stimulus, not that Ace executes a response to it. Expression evidence alone does not show participation
      in the response process.
    supported_by:
    - reference_id: PMID:14527966
      supporting_text: ACE activity was markedly increased under the hypoxic stress of 7-, 14-, 21-, and
        28-day exposures.
- term:
    id: GO:0001822
    label: kidney development
  evidence_type: IEP
  original_reference_id: PMID:7977726
  qualifier: involved_in
  review:
    summary: Ace contributes to kidney development through local angiotensin II generation; non-core developmental
      role.
    action: KEEP_AS_NON_CORE
    reason: 'Ace-null mice (donor evidence for the ISO/ISS rows: mouse IMP PMID:11723129, PMID:12777443,
      PMID:14757757, PMID:17135368) have hypoplastic renal papilla and medullary defects, the renal phenotype
      shared by all renin-angiotensin pathway knockouts, so the contribution is real but runs through
      Ang II production. The rat IEP row (developmental regulation of renal Ace expression) is weak on
      its own but consistent. Kept as non-core: development is a downstream consequence of the angiotensin-generating
      activity.'
    supported_by:
    - reference_id: UniProtKB:P47820
      supporting_text: Plays a major role in the angiotensin-renin system that regulates blood pressure
        and sodium retention by the kidney by converting angiotensin I to angiotensin II, resulting in
        an increase of the vasoconstrictor activity of angiotensin
    - reference_id: PMID:7977726
      supporting_text: In the kidney, they were low and decreased further during growth.
