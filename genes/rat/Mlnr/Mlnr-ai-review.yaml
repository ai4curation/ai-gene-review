- id: PMID:17760865
  title: Hypothalamic neuronal histamine mediates the thyrotropin-releasing hormone-induced
    suppression of food intake.
  findings:
  - statement: TRH-R2, but not TRH-R1, is detected by immunohistochemistry in cell
      bodies of histaminergic neurons of the rat tuberomammillary nucleus.
    supporting_text: we identified TRH-R2, but not TRH-R1, within the cell bodies of
      histaminergic neurons within the TMN
  - statement: TRH-R2 mRNA is broadly distributed in brain, suggesting roles in
      cognition and arousal.
    supporting_text: TRH-R2 mRNA is distributed widely throughout the brain, including
      the cerebral cortex and reticular formation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text (PMC2156111) read. Localization of TRH-R2 to histaminergic
      neuronal somata supports the IDA for neuronal cell body. The feeding and arousal
      roles are inferred from co-localization plus TRH (ligand) injection, not from
      receptor-specific perturbation.
