- id: PMID:19696113
  title: Stepwise loss of motilin and its specific receptor genes in rodents.
  findings:
  - statement: The true motilin receptor gene (MLNR) was pseudogenized early in the
      rodent lineage, so the rat locus named Mlnr is not a functional motilin receptor.
    supporting_text: We speculate that the MLNR gene became a pseudogene before the
      divergence of the squirrel and other rodents about 75 mya.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Context for the nomenclature anomaly (TRH-R2 locus
      renamed Mlnr).
