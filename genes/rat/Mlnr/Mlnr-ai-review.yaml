  title: Rat TRH receptor type 2 exhibits higher basal signaling activity than TRH
    receptor type 1.
  findings:
  - statement: Rat TRH-R2 signals via the phosphoinositide-calcium pathway and has
      higher constitutive signalling than TRH-R1.
    supporting_text: We found that TRH-R2 exhibited higher basal signaling activity
      than TRH-R1 via pathways mediated by transcription factors AP-1, Elk-1 and CREB.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Direct functional study of the rat receptor.
- id: PMID:11181534
  title: Regulator of G protein signaling 4 suppresses basal and thyrotropin releasing-hormone
    (TRH)-stimulated signaling by two mouse TRH receptors, TRH-R(1) and TRH-R(2).
  findings:
  - statement: Mouse TRH-R2 (92% identical to rat) binds TRH, signals via the
      phosphoinositide pathway and its basal and stimulated signalling is suppressed
      by RGS4.
    supporting_text: Interestingly, RGS4 markedly inhibited basal signaling by mTRH-R2.
  reference_review:
    relevance: MEDIUM
