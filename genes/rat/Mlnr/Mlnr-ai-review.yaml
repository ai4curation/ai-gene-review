  findings:
  - statement: Rat TRH-R2 internalizes more rapidly upon agonist binding than TRH-R1.
    supporting_text: rat thyrotropin-releasing hormone (TRH) receptor type 2 exhibits
      higher basal signaling activity and internalizes more rapidly upon agonist binding
