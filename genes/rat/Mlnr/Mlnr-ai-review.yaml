suggested_questions:
- question: The rat locus formerly named Trhr2 (GeneID 252859) is now labelled Mlnr
    (motilin receptor) while mouse Trhr2 (GeneID 170732) keeps its name, and the
    rodent motilin receptor is reported to be pseudogenized. What orthology evidence
    supports the rename, and should the protein name continue to state TRH receptor
    type 2 to avoid implying motilin-receptor function?
- question: Is the high constitutive activity of TRH-R2 physiologically relevant in
    vivo, for example in cortical or thalamic neurons where TRH levels are low?
suggested_experiments:
- hypothesis: TRH-R2 on tuberomammillary histaminergic neurons mediates TRH-induced
    histamine release and the resulting suppression of food intake.
  description: Conditional deletion or shRNA knockdown of Mlnr/Trhr2 in histidine
    decarboxylase-expressing neurons, followed by intra-TMN TRH injection with
    measurement of hypothalamic histamine turnover and food intake; compare with a
    TRH-R2-selective agonist.
  experiment_type: genetic perturbation with behavioural and neurochemical readouts
- hypothesis: The rat Mlnr protein does not respond to motilin.
  description: Express rat A0ACM8Q218 in HEK293 cells and test motilin, ghrelin and
    TRH in calcium-flux and IP-one assays, alongside human MLNR as a positive control.
  experiment_type: heterologous expression pharmacology
