gene_symbol: Mlnr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Rat Mlnr (formerly Trhr2) encodes thyrotropin-releasing hormone receptor type 2
  (TRH-R2), a 352-residue rhodopsin-family (class A) seven-transmembrane G
  protein-coupled receptor. Although the locus now carries the motilin receptor
  symbol, the protein is the rodent TRH-R2 subtype; the genuine motilin receptor gene
  was pseudogenized early in rodent evolution and no motilin binding has been shown
  for this protein. TRH-R2 binds TRH with nanomolar affinity, similar to TRH-R1, and
  couples to Gq/11 to activate phospholipase C, phosphoinositide hydrolysis and
  calcium signalling. Compared with TRH-R1 it shows higher agonist-independent
  (constitutive) signalling, which is suppressed by RGS4 and by the inverse agonist
  midazolam, and it internalizes more rapidly after agonist binding. Expression is
  essentially restricted to the central nervous system, including thalamus, cerebral
  and cerebellar cortex and reticular formation, and the protein is found in the cell
  bodies of histaminergic neurons of the tuberomammillary nucleus, where it may relay
  TRH effects on feeding and arousal. It has no human ortholog.
