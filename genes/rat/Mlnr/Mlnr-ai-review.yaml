- description: Plasma-membrane Gq/11-coupled receptor for thyrotropin-releasing hormone
    in brain neurons that activates phospholipase C and phosphoinositide-calcium
    signalling, with notably high constitutive (agonist-independent) activity.
  molecular_function:
