id: Q63269
gene_symbol: Itpr3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Itpr3 encodes the type 3 inositol 1,4,5-trisphosphate receptor (IP3R3), a 2,670-residue multi-pass membrane protein
  that assembles into homo- or heterotetrameric ligand-gated Ca2+ release channels in the endoplasmic reticulum membrane and
  the ER-continuous nuclear envelope. Binding of IP3, produced by phospholipase C downstream of Gq-coupled and tyrosine kinase
  receptors, to the N-terminal binding core, together with cytosolic Ca2+ (biphasic activation and inhibition) and ATP (a
  low-affinity, cooperative modulatory site), opens a six-transmembrane-helix pore per subunit and releases ER Ca2+ into the
  cytosol. Rat IP3R3 single channels have the same ~75 pS conductance as other subtypes but a lower apparent IP3 affinity;
  its sensitivity is increased by PKA phosphorylation and by cAMP acting independently of PKA, and decreased by PKC. IP3R3
  is the predominant subtype in pancreatic beta-cells and islets, insulinoma cells, many secretory epithelia (where it concentrates
  at the apical pole), Schwann cells, taste receptor cells and some forebrain neuronal terminals, where its Ca2+ signals couple
  receptor activation to secretion and sensory transduction.
