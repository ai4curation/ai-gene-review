  review:
    summary: Ca2+ binding at regulatory sites of the IP3R.
    action: KEEP_AS_NON_CORE
    reason: Cytosolic Ca2+ is a co-agonist that regulates IP3R3 biphasically through a high-affinity juxtamembrane site and
      a low-affinity cytoplasmic-domain site (UniProt, by similarity to human ITPR3 cryo-EM structures). Ca2+ binding is a
      regulatory property of the channel, not its core activity; kept as non-core.
    supported_by:
    - reference_id: file:rat/Itpr3/Itpr3-uniprot.txt
      record_section:
      - CC:ACTIVITY REGULATION
      supporting_text: Inositol 1,4,5-trisphosphate-gated calcium channel is regulated by cytosolic calcium in a biphasic
        manner.
