    phosphoinositide lipids; should the PAINT node assertion be withdrawn in favour of inositol 1,4,5 trisphosphate binding?
- question: Do the rat IDA rows for dendrite (PMID:17471556) and neuronal cell body (PMID:17091480) rest on IP3R3-specific
    antibodies, given that both abstracts foreground other subtypes or Schwann cells?
