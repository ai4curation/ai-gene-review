  label: Rattus norvegicus (Rat)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for rat BiP/Hspa5. Four of the five calls are correct and three
  are exact GOA matches: the ER chaperone complex, denatured protein binding, the ER lumen and IRE1-UPR
  regulation, which between them cover this review's chaperone and misfolded-protein-binding core
  functions and the compartment. The ATP hydrolysis activity that powers the Hsp70 cycle, and that
  this review lists as a second core function, is not retrieved. This is among the better results
  in the rodent set. Assessment: 1 correct novel (COR), 2 correct not novel (CNN).
