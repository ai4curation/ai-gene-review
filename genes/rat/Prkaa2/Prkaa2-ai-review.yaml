      label: positive regulation of autophagy
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: Well-established function through ULK1 phosphorylation and mTORC1
        inhibition. However, 2024 research shows complexity - AMPK can suppress 
        autophagy in specific contexts. Keep as important but context-dependent 
        function.
      action: KEEP_AS_NON_CORE
  - term:
      id: GO:0042149
      label: cellular response to glucose starvation
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: Core function - AMPK is the primary cellular glucose/energy
        sensor. Activated by low glucose via AMP/ATP ratio changes. Knockout
        mice show impaired glucose homeostasis. Multiple ISS/ISO annotations
        support this.
      action: ACCEPT
      supported_by:
        - reference_id: file:rat/Prkaa2/Prkaa2-deep-research-falcon.md
          supporting_text: |-
            AMP binding to AMPK (via γ subunit CBS motifs) promotes AMPK activation through allosteric effects and protection from dephosphorylation, coupling ATP depletion to kinase activation.
