  - id: file:rat/Prkaa2/Prkaa2-deep-research-falcon.md
    title: Falcon (Edison Scientific) deep research report for rat Prkaa2 (AMPKα2)
    findings:
      - statement: |-
          Prkaa2 encodes the catalytic alpha-2 subunit of the heterotrimeric
          AMPK serine/threonine kinase; the alpha subunit carries the catalytic
          kinase activity.
        supporting_text: |-
          AMPK is a **heterotrimeric serine/threonine kinase** consisting of a **catalytic α** subunit plus **regulatory β and γ** subunits.
        reference_section_type: OTHER
      - statement: |-
          The alpha subunit provides the catalytic kinase activity and is
          activated by phosphorylation at Thr172 in the activation loop.
        supporting_text: |-
          The α subunit provides the **catalytic kinase activity** and is activated primarily by phosphorylation at a conserved threonine within the activation loop (**Thr172 for α2**), which is a core mechanistic definition of “AMPK activation.”
        reference_section_type: OTHER
      - statement: |-
          Prkaa2 is a protein serine/threonine kinase (EC 2.7.11.1).
        supporting_text: |-
          Prkaa2 encodes a **protein kinase** (EC 2.7.11.1; Ser/Thr kinase).
        reference_section_type: OTHER
      - statement: |-
          AMP binding (via the gamma subunit) allosterically activates AMPK and
          protects it from dephosphorylation, coupling ATP depletion to kinase
          activation — the basis of AMP-activated protein kinase activity.
        supporting_text: |-
          AMP binding to AMPK (via γ subunit CBS motifs) promotes AMPK activation through allosteric effects and protection from dephosphorylation, coupling ATP depletion to kinase activation.
        reference_section_type: OTHER
      - statement: |-
          Upstream kinases phosphorylate AMPKα2 at Thr172, with LKB1 as a primary
          kinase and CaMKKβ/CAMKK2 as a calcium-responsive route.
        supporting_text: |-
          upstream kinases phosphorylate AMPKα2 at **Thr172**, with **LKB1** frequently highlighted as a primary kinase
        reference_section_type: OTHER
      - statement: |-
          AMPKα2 integrates energy stress to inhibit anabolic metabolism and
          promote catabolism and autophagy — its core energy-homeostasis role.
        supporting_text: |-
          Functionally, AMPKα2 integrates energy stress to inhibit anabolic metabolism and promote catabolism and autophagy
        reference_section_type: OTHER
      - statement: |-
          AMPK phosphorylates metabolic targets including ACC, HMGCR, and
          autophagy regulators such as ULK1.
        supporting_text: |-
          AMPKα2 phosphorylates metabolic targets including ACC/ACAC (canonical readout; ACC Ser79 commonly used), HMGCR, and autophagy regulators such as ULK1
        reference_section_type: OTHER
      - statement: |-
          AMPK inhibits mTORC1 via phosphorylation of TSC2 and Raptor.
        supporting_text: |-
          AMPK inhibits mTORC1 via phosphorylation of TSC2 and Raptor
        reference_section_type: OTHER
      - statement: |-
          AMPKα2 has a nuclear localization signal and can shuttle to the nucleus,
          whereas α1 is primarily cytosolic.
        supporting_text: |-
          AMPKα2 contains a nuclear localization signal and can shuttle to the nucleus
        reference_section_type: OTHER
      - statement: |-
          A 2024 primary study identifies an AMPKα2-specific role in skeletal
          muscle ketone utilization via binding and stabilization of SCOT.
        supporting_text: |-
          These results place AMPKα2 as an important regulator of **skeletal muscle ketone utilization**
        reference_section_type: OTHER
