id: Q09137
gene_symbol: Prkaa2
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: PRKAA2 encodes the alpha-2 catalytic subunit of AMP-activated 
  protein kinase (AMPK), a central cellular energy sensor that maintains energy 
  homeostasis. As a serine/threonine kinase, PRKAA2 is activated when cellular 
  AMP/ATP ratios rise, triggering phosphorylation of metabolic enzymes to 
  suppress anabolic processes (fatty acid/cholesterol synthesis) while promoting
  catabolic processes (fatty acid oxidation, glycolysis, autophagy). The protein
  forms heterotrimeric complexes with regulatory beta and gamma subunits, 
  localizes to both cytoplasm and nucleus, and phosphorylates key substrates 
  including ACC (fatty acid synthesis), HMGCR (cholesterol synthesis), PFK-2 
  (glycolysis), and ChREBP (transcriptional regulation). Recent discoveries 
  highlight its direct role in chromatin remodeling via histone H2B 
  phosphorylation under stress conditions.
existing_annotations:
  - term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: Core catalytic function strongly supported by extensive 
        biochemical evidence. PRKAA2 phosphorylates serine/threonine residues on
        numerous substrates (ACC, HMGCR, PFK-2, ChREBP, TSC2, Raptor). Multiple 
        IDA studies confirm this activity (PMID:8955377, PMID:12065578).
      action: ACCEPT
      supported_by:
        - reference_id: file:rat/Prkaa2/Prkaa2-deep-research.md
          supporting_text: Generated using OpenAI Deep Research API
        - reference_id: file:rat/Prkaa2/Prkaa2-deep-research-falcon.md
          supporting_text: |-
            Prkaa2 encodes a **protein kinase** (EC 2.7.11.1; Ser/Thr kinase).
  - term:
