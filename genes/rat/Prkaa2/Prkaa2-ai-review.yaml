      label: cytoplasm
    evidence_type: IDA
    original_reference_id: PMID:18256313
    review:
      summary: Direct experimental evidence from PMID:18256313 showing AMPK 
        localization in renal epithelial cells. Cytoplasmic localization is 
        essential for AMPK's role in controlling glycogen synthase and other 
        metabolic targets in response to energy stress.
      action: ACCEPT
      reason: Strong experimental evidence for cytoplasmic localization where 
        AMPK performs its primary metabolic regulatory functions.
      supported_by:
        - reference_id: PMID:18256313
          supporting_text: Control of glycogen synthase through ADIPOR1-AMPK 
            pathway in renal distal tubules of normal and diabetic rats.
  - term:
      id: GO:0016324
      label: apical plasma membrane
    evidence_type: IDA
    original_reference_id: PMID:18256313
    review:
      summary: Direct immunohistochemical evidence in rat kidney - AMPK
        alpha1/alpha2 catalytic subunits were detected in the same distal
        tubule/thick ascending limb cells where ADIPOR1 marks the luminal
        (apical) membrane (PMID:18256313; abstract-only in cache, curator read
        the full text). A genuine but tissue-specific membrane-proximal
        localization supporting luminal adiponectin-AMPK signaling, not a core
        localization.
      action: KEEP_AS_NON_CORE
      reason: Deferring to the UniProt curator on the apical-membrane assignment
        (the cached abstract confirms the luminal ADIPOR1-AMPK co-localization
        context but full text is unavailable). Kept as non-core because
        apical-membrane recruitment in renal epithelium is a specialized,
        polarized-cell context, in contrast to the core cytoplasmic/nuclear
        localizations.
      supported_by:
        - reference_id: PMID:18256313
          supporting_text: Immunohistochemistry revealed the presence of ADIPOR1
            on the luminal portion of distal tubules and thick ascending limb
            cells. Catalytic subunits alpha(1) and alpha(2), their
            phosphorylated active forms, and the glycogen-binding subunit
            beta(2) were also found in the same cells
        - reference_id: file:rat/Prkaa2/Prkaa2-deep-research.md
          supporting_text: and at the **apical plasma membrane** in polarized cells
  - term:
      id: GO:0032991
      label: protein-containing complex
    evidence_type: IDA
    original_reference_id: PMID:14511394
    review:
      summary: The experiment is sound - native AMPK purified from rat liver
        (the physiological heterotrimer, activated by the LKB1-STRAD-MO25
        upstream kinase complexes characterized in PMID:14511394, full text
        available) - but the root term protein-containing complex conveys no
        information. The specific complex AMPKalpha2 belongs to is the
        nucleotide-activated protein kinase complex (GO:0031588), which already
        carries rat IDA evidence (PMID:16648175).
      action: MODIFY
      reason: Root CC term is uninformative for a protein whose complex identity
        is precisely known; the essence (complex membership demonstrated
        experimentally in rat) is correct, so replace with the specific
        heterotrimer term rather than removing the experimental annotation.
      proposed_replacement_terms:
        - id: GO:0031588
          label: nucleotide-activated protein kinase complex
      supported_by:
        - reference_id: PMID:14511394
          supporting_text: AMPK was purified from rat liver as described
            previously
        - reference_id: PMID:16648175
          supporting_text: AMPK, a serine-threonine kinase, is a heterotrimeric
            complex of catalytic alpha-subunits and regulatory beta- and
            gamma-subunits with multiple isoforms
  - term:
      id: GO:0031588
      label: nucleotide-activated protein kinase complex
    evidence_type: IDA
    original_reference_id: PMID:16648175
    review:
      summary: Direct rat experimental evidence - in intact rat heart, the
        alpha2 catalytic isoform co-immunoprecipitated with regulatory
        gamma1/gamma2 isoforms and its complex-associated kinase activity was
        stimulated by ischemia (PMID:16648175; abstract-only in cache but the
        abstract itself documents the co-immunoprecipitation). This is the
        defining evidence that rat AMPKalpha2 is the catalytic subunit of the
        heterotrimeric AMPK complex. Core.
      action: ACCEPT
      supported_by:
        - reference_id: PMID:16648175
          supporting_text: The gamma(1)- and gamma(2)-isoforms
            coimmunoprecipitated with alpha(1)- and alpha(2)-isoforms in
            proportion to alpha-subunit content
  - term:
      id: GO:0005654
      label: nucleoplasm
    evidence_type: TAS
    original_reference_id: Reactome:R-RNO-164087
    review:
      summary: Reactome-derived localization - the curated rat event
        "Phosphorylation of rChREBP(Ser 568) by rAMPK" takes place in the
        nucleus, placing the AMPK heterotrimer in the nucleoplasm.
        Consistent with AMPKalpha2's nuclear localization signal, nuclear
        shuttling, and nuclear substrates (ChREBP, histone H2B).
      action: ACCEPT
      reason: Consistent with the accepted nucleus IEA/ISO and nucleoplasm ISO
        rows; nuclear-compartment activity on ChREBP is part of the core
        transcriptional arm of AMPKalpha2 function.
      supported_by:
        - reference_id: file:rat/Prkaa2/Prkaa2-deep-research-falcon.md
          supporting_text: |-
            AMPKα2 contains a nuclear localization signal and can shuttle to the nucleus
  - term:
      id: GO:0005654
      label: nucleoplasm
    evidence_type: TAS
    original_reference_id: Reactome:R-RNO-164106
    review:
      summary: Reactome-derived localization - the curated rat event "rLkb-1
        (Stk-11) activates AMPK by phosphorylation" is placed in the nucleus,
        locating the AMPK heterotrimer in the nucleoplasm during LKB1-mediated
        Thr172 activation. Consistent with AMPKalpha2 nuclear shuttling and the
        other accepted nucleus/nucleoplasm rows.
      action: ACCEPT
      reason: Same judgment as the companion Reactome nucleoplasm row; nuclear
        localization of AMPKalpha2 is well supported and underlies its
        chromatin/transcriptional functions.
      supported_by:
        - reference_id: file:rat/Prkaa2/Prkaa2-deep-research-falcon.md
          supporting_text: |-
            AMPKα2 contains a nuclear localization signal and can shuttle to the nucleus
