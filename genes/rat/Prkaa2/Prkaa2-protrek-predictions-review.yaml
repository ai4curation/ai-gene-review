description: >-
  ProTrek sequence-to-text retrieval for rat Prkaa2 (AMPK catalytic subunit alpha-2). The best GO-channel
  result in the rat set: ranks 1-3 are three consecutive exact GOA matches that between them cover
  the AMPK holoenzyme complex and two of the three curated core molecular functions, and rank 4 ([acetyl-CoA
  carboxylase] kinase activity, obsolete in the current GO release) names the canonical AMPK substrate.
  Two caveats temper it. Q09137 is a SwissProt entry, so its own GO sentences sit in the searched
  index and this is recall of a memorised annotation set rather than generalisation. And the free-text
  channel returns the LKB1/STK11 Function comment - the upstream kinase that activates AMPK - in both
  top slots, so the free-text side lands on the right pathway but the wrong protein even where the
  GO side is right. Assessment: 3 correct not novel (CNN).
