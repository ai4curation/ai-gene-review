- id: PMID:22294686
  title: >-
    Human α/β hydrolase domain containing 10 (ABHD10) is responsible enzyme for
    deglucuronidation of mycophenolic acid acyl-glucuronide in liver.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      Human ABHD10 hydrolyzes the carboxylic ester AcMPAG (Km = 100.7 uM) and
      does not hydrolyze the phenolic O-glycoside MPAG.
    supporting_text: >-
      In fact, we found that the recombinant human ABHD10 could catalyze the
      deglucuronidation of AcMPAG, but could not catalyze the deglucuronidation
      of MPAG, a phenolic glucuronide of MPA (data not shown).
- id: PMID:31740833
  title: >-
    ABHD10 is an S-depalmitoylase affecting redox homeostasis through
    peroxiredoxin-5.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      Mammalian ABHD10 is a resident mitochondrial S-depalmitoylase with a
      conserved alpha/beta-hydrolase catalytic triad.
    supporting_text: >-
      As expected, mature ABHD10 possesses a canonical α/β hydrolase domain with
      a catalytic triad formed by Ser100–His227–D197 (Fig. 4d,e).
- id: PMID:41285782
  title: >-
    The S-depalmitoylase ABHD10 is essential for sperm mitochondrial sheath
    formation and male fertility.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      Subcellular fractionation of mouse testes confirms mammalian ABHD10
      localizes specifically to mitochondria and is absent from
      mitochondria-depleted cytoplasm.
    supporting_text: >-
      Our data indicated that ABHD10 was specifically localized in the
      mitochondria of the testes (Fig. 5e).
  - statement: >-
      Immunoelectron microscopy confirms mammalian ABHD10 residence in the
      mitochondrial matrix.
    supporting_text: >-
      Furthermore, we applied immunoelectron microscopy and confirmed that
      ABHD10 is localized in the mitochondrial matrix of testes (Fig. 5h).
  - statement: >-
      HA-knock-in mouse analyses confirm mitochondrial matrix localization in
      vivo, although the authors' description of ABHD10 as "testis-specific"
      overstates tissue exclusivity relative to hepatic and somatic expression.
    supporting_text: >-
