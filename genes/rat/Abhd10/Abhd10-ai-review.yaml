id: Q5I0K5
gene_symbol: Abhd10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Abhd10 (alpha/beta hydrolase domain-containing protein 10) is a mitochondrial
  matrix serine hydrolase and protein S-depalmitoylase (EC 3.1.2.22) in Rattus
  norvegicus. Synthesized as a 297-residue precursor with a predicted
  43-residue N-terminal mitochondrial transit peptide, mature rat ABHD10
  (residues 44-297) shares over 92% sequence identity with mouse ABHD10 and
  conserves the alpha/beta-hydrolase fold, hydrophobic cap domain, and
  charge-relay catalytic triad at Ser143, Asp240, and His270. Conserved across
  mammals, ABHD10 hydrolyzes S-palmitoyl thioester linkages on mitochondrial
  matrix proteins—such as peroxiredoxin-5 (PRDX5) and germ-cell mitochondrial
  sheath and metabolic factors characterized in mammalian orthologs—and by
  orthology to human ABHD10 is also implicated in secondary carboxylic-ester
  hydrolysis of xenobiotic 1-O-acyl-beta-D-glucuronide conjugates.
