        source_status: NOT_RELEVANT
        comment: A PAINT internal node identifier, not an independent evidence source.
      - source_id: RGD:3665
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: A surfactant collectin from alveolar type II cells. Its multivesicular-body
          trafficking is specific to pneumocytes.
      - source_id: RGD:3667
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: A surfactant collectin, with the same pneumocyte compartment biology. No evidence
          places MBP-A there.
