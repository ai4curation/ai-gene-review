- id: PMID:10903744
  title: Impaired secretion of rat mannose-binding protein resulting from mutations
    in the collagen-like domain.
  findings:
  - statement: Collagen-domain mutations equivalent to human immunodeficiency alleles slow the
      secretion of rat serum MBP, disrupt its disulfide bonding and impair complement fixation.
    supporting_text: The mutations Gly25-->Asp and Gly28-->Glu disrupt the disulfide-bonding arrangement
      of the protein
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. It concerns rat serum MBP (MBP-A) and is consistent with the UniProt
      citation for secretion and oligomerization.
- id: PMID:10913141
  title: 'Interaction of mannose-binding protein with associated serine proteases:
    effects of naturally occurring mutations.'
  full_text_unavailable: true
  findings:
  - statement: Rat MBP binds MASP-1 and MASP-2 independently and Ca2+-dependently.
    supporting_text: Binding studies reveal that both MASPs associate independently with rat MBP in a
      Ca(2+)-dependent manner
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only, and the publisher full text could not be retrieved (HTTP 403). The
      homodimer statement in the abstract refers to the truncated MASPs, which bears on the
      GO:0042803 row.
- id: PMID:11850428
  title: Orientation of bound ligands in mannose-binding proteins. Implications for
    multivalent ligand recognition.
  findings:
  - statement: Crystal structures define Ca2+-mediated mannose and oligosaccharide binding by the
      MBP-A CRD.
    supporting_text: MBPs bind to their carbohydrate ligands by forming a series of Ca(2+) coordination
      and hydrogen bonds with two hydroxyl groups equivalent to the 3- and 4-OH of mannose
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. A structural study of rat MBP-A and MBP-C.
- id: PMID:16272342
  title: Decoupling of carbohydrate binding and MASP-2 autoactivation in variant mannose-binding
    lectins associated with immunodeficiency.
  findings:
  - statement: Rat MBL-MASP-2 complexes activate MASP-2 on a mannan surface. Collagen-domain variants
      fail to do so.
    supporting_text: reduced complement activation by both mutant MBLs is caused by failure to activate
      MASP-2 efficiently on binding to a mannan-coated surface
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. The paper uses the rat lectin pathway.
- id: PMID:22167201
  title: Near-planar solution structures of mannose-binding lectin oligomers provide
    insight on activation of lectin pathway of complement.
  findings:
  - statement: Recombinant rat MBL-A oligomers (dimers, trimers and tetramers of subunits) adopt
      near-planar fan-like solution structures. MBL-A was purified on mannose-Sepharose.
    supporting_text: the carbohydrate-recognition domains in the MBL dimer, trimer, and tetramer are
      positioned close to each other in near-planar fan-like structures
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Recombinant rat MBL-A from CHO cells.
- id: PMID:25419660
  title: Lysyl hydroxylase 3 modifies lysine residues to facilitate oligomerization
    of mannan-binding lectin.
  findings:
  - statement: LH3-dependent glycosylation of hydroxylysines is needed for normal oligomerization
      of rat MBL-A. MBL-A is secreted and found in serum.
    supporting_text: MBL subunits form oligomers inside the producing cell, which are subsequently secreted
      in to the serum.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. It uses recombinant rat MBL-A in MEFs and endogenous MBL-A in mouse
      serum.
- id: PMID:3584121
  title: Serum lectin with known structure activates complement through the classical
    pathway.
  findings:
  - statement: Rat serum MBP is MBP-A. It activates complement in a sugar-dependent, C4-dependent way.
    supporting_text: revealing that MBP-A is in fact identical with serum MBP
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. The title says classical pathway because the paper predates the MASP
      discovery. The activity is what is now called the lectin pathway.
- id: PMID:9315725
  title: A novel type of binding specificity to phospholipids for rat mannose-binding
    proteins isolated from serum and liver.
  findings:
  - statement: Serum MBP binds phosphatidylinositol and PI4P in vitro, Ca2+-dependently.
    supporting_text: S- and L-MBPs bound to phosphatidylinositol 4-monophosphate
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. An in vitro binding assay; physiological relevance is unknown.
- id: PMID:20118239
  title: Engineering novel complement activity into a pulmonary surfactant protein.
  findings:
  - statement: The MBL-MASP interaction depends mainly on one lysine in the collagen-like domain.
      MBL-MASP complexes are held inactive until target recognition.
    supporting_text: Overall, therefore, specificity of the MBL-MASP interaction appears to be driven
      mainly by a single lysine residue in the collagen-like domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. It uses recombinant rat MBL (MBL-A) and engineered SP-A.
- id: PMID:1436090
  title: Structure of a C-type mannose-binding protein complexed with an oligosaccharide.
  findings:
  - statement: Ca2+ directly coordinates the carbohydrate ligand in the rat MBP-A CRD.
    supporting_text: reveals that Ca2+ forms coordination bonds with the carbohydrate ligand
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. UniProt cites it for the 2MSB structure of MBP-A residues 124-238.
- id: PMID:7704532
  title: Trimeric structure of a C-type mannose-binding protein.
  findings:
  - statement: The MBP-A neck forms a triple coiled coil. The widely spaced CRDs favour binding to
      repetitive microbial sugar arrays.
    supporting_text: MBPs can recognize pathogens selectively by binding avidly only to the widely spaced,
      repetitive sugar arrays on pathogenic cell surfaces
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. It concerns the MBP-A trimeric fragment.
- id: PMID:3009480
  title: Mannose-binding proteins isolated from rat liver contain carbohydrate-recognition
    domains linked to collagenous tails. Complete primary structures and homology with
    pulmonary surfactant apoprotein.
  findings:
  - statement: Primary structure of MBP-A, with a signal sequence, a collagenous domain and a CRD.
    supporting_text: Each protein is preceded by a cleaved, NH2-terminal signal sequence
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. The original sequence paper.
- id: PMID:15148336
  title: Mannose-binding lectin-deficient mice are susceptible to infection with Staphylococcus
    aureus.
  findings:
  - statement: Mbl1/Mbl2 double-null mice lack the MBL pathway, are highly susceptible to S. aureus
      and show reduced macrophage phagocytosis.
    supporting_text: These MBL-null mice lack MBL in serum and lack the MBL complement pathway
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available. A mouse double knockout of MBL-A and MBL-C, which does not
      separate the two proteins' roles. It is the likely basis of the RGD ISO rows from MGI:96923.
core_functions:
- description: Ca2+-dependent recognition of terminal mannose, N-acetylglucosamine and fucose residues,
    including high-mannose oligosaccharides and mannan, by the C-type CRD. The trimeric and oligomeric
    arrangement of the CRDs gives avid binding to the widely spaced, repetitive glycan arrays of
    microbial surfaces.
