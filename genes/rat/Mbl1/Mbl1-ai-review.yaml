  review:
    summary: This IBA rests only on the rat surfactant collectins (RGD:3665, RGD:3667), which are
      processed through multivesicular and lamellar bodies in alveolar type II cells. MBP-A is made
      in the liver and secreted into serum, and no study places it in multivesicular bodies.
    action: MARK_AS_OVER_ANNOTATED
    reason: The surfactant-collectin compartment biology does not carry over to the serum lectin
      branch. The only known intracellular route for MBP-A is the secretory pathway (ER and Golgi)
      to secretion. No direct test excludes MBP-A from multivesicular bodies, so this is an
      over-annotation rather than a demonstrated error.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
