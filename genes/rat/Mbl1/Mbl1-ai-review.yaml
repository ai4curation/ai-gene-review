id: P19999
gene_symbol: Mbl1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Mbl1 encodes mannose-binding protein A (MBP-A, MBL-A), the serum mannose-binding
  lectin of the rat. It is a secreted collectin made in the liver, with an N-terminal cysteine-rich
  region, a collagen-like domain, an alpha-helical coiled-coil neck and a C-terminal C-type
  carbohydrate-recognition domain (CRD). Three polypeptides form a homotrimeric structural unit,
  and these units associate into dimers, trimers and tetramers that are linked by disulfide bonds.
  Each CRD binds terminal mannose, N-acetylglucosamine and fucose through a Ca2+ ion that coordinates
  the sugar hydroxyls. Because the CRDs are spaced widely within the oligomer, MBP-A binds avidly
  only to the repetitive glycan arrays on microbial surfaces. Its collagen-like stalks bind the
  MBL-associated serine proteases MASP-1 and MASP-2 through a conserved lysine-containing motif.
  When MBP-A recognizes a target, the associated MASP-2 is activated and cleaves C4 and C2, which
  initiates the lectin pathway of complement activation. Mice lacking both MBL forms are highly
  susceptible to Staphylococcus aureus and show reduced opsonophagocytosis.
