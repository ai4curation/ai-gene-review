    label: antibacterial innate immune response
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:96923
  review:
    summary: This row is transferred from mouse Mbl1, based on MBL-null susceptibility to S. aureus.
    action: KEEP_AS_NON_CORE
    reason: The term is a correct organism-level outcome of MBP-A's role as a soluble innate-immune
      pattern-recognition molecule. Its specific mechanistic contribution is captured by lectin-pathway
      complement activation, so this term is non-core.
    supported_by:
    - reference_id: PMID:15148336
      supporting_text: These MBL-null mice lack MBL in serum and lack the MBL complement pathway
