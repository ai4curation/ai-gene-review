- term:
    id: GO:0001867
    label: complement activation, lectin pathway
  evidence_type: IDA
  original_reference_id: PMID:16272342
  qualifier: involved_in
  review:
    summary: MBP-A is the recognition subcomponent of the rat lectin pathway. In complexes reconstituted
      from recombinant components, wild-type MBP-A drives MASP-2 activation on binding a mannan surface,
      and collagen-domain variants that cannot do this are defective in complement activation.
    action: ACCEPT
    reason: MBP-A does part of the work of this process. It recognizes the activating surface and
      holds and triggers the MASP-2 protease, as C1q does for the classical pathway. Direct
      functional evidence comes from the rat system, and the role is the central function of the gene.
    supported_by:
    - reference_id: PMID:16272342
      supporting_text: reduced complement activation by both mutant MBLs is caused by failure to activate
        MASP-2 efficiently on binding to a mannan-coated surface
    - reference_id: PMID:3584121
      supporting_text: the activation is initiated by the sugar binding activity of MBP
