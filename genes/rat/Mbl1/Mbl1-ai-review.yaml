suggested_questions:
- question: Does the full text of PMID:10913141 contain any evidence that MBP-A itself homodimerizes,
    or should the GO:0042803 IPI row (with P19999) be assigned to the MASP proteins instead?
- question: Is the binding of MBP-A to phosphatidylinositol and PI4P seen in vitro physiologically
    relevant, for example in recognizing apoptotic cells or microbial membranes?
- question: In rats, how do MBP-A (serum) and MBP-C divide the work of lectin-pathway activation and
    opsonization in vivo, given that the mouse knockout removed both?
suggested_experiments:
- hypothesis: MBP-A contributes to antibacterial defense independently of MBP-C.
  description: Generate Mbl1 single-knockout rats (or mice) and compare lectin-pathway C4 deposition,
    opsonophagocytosis and survival after S. aureus challenge with wild-type and Mbl2-null animals.
  experiment_type: genetic knockout with infection challenge
