suggested_questions:
- question: Should Klf9 carry positive regulation of neuron projection development (or dendrite morphogenesis)
    given rat-specific antisense and overexpression data (PMID:12021188, PMID:10438482), or is this better
    captured as a GO-CAM causal link from Klf9 TF activity to T3-driven neurite branching via identified
    target genes?
- question: Is the repression of the single-GC-box CYP1A1 promoter by rat BTEB a true repressor activity
    (Sin3A recruitment) or competition with Sp1 for the same site, and should the GO repressor term be
    restricted to the Sin3A-dependent mechanism?
- question: Should circadian rhythm annotations be retained for clock-output transcription factors such
    as KLF9 whose rhythmic expression is driven by cortisol, or replaced by response-to-glucocorticoid
    terms?
suggested_experiments:
- description: ChIP-seq and RNA-seq after Klf9 knockdown in rat primary cortical neurons treated with
    T3, to identify direct Klf9 target genes mediating neurite branching and test whether they are activated
    or repressed.
  experiment_type: ChIP-seq / RNA-seq
- description: Reporter assays with rat Klf9 carrying SID point mutations that abolish mSin3A binding,
    on single- versus tandem-GC-box promoters, to separate Sin3A-dependent repression from site competition
    with Sp1.
  experiment_type: reporter assay / mutagenesis
