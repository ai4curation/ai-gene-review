id: Q01713
gene_symbol: Klf9
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Krueppel-like factor 9 (Klf9, also called BTEB/BTEB1) is a small (244 aa) nuclear Sp/KLF-family
  transcription factor that binds GC-box and CACCC elements in RNA polymerase II promoters through three
  C-terminal C2H2 zinc fingers. It acts in a promoter-context-dependent manner: it activates promoters
  carrying tandem GC boxes and represses promoters with a single GC box, the latter via an N-terminal
  alpha-helical Sin3-interacting domain that recruits the mSin3A-histone deacetylase corepressor. Klf9
  is itself a hormone-responsive gene, induced by thyroid hormone in developing brain, by glucocorticoids,
  and by progesterone signalling, and it cooperates with the progesterone receptor to modulate PR target
  genes. Through these transcriptional activities it contributes to uterine receptivity and embryo implantation,
  thyroid hormone-driven neurite branching and oligodendrocyte differentiation, and restraint of keratinocyte
  proliferation.'
