- term:
    id: GO:0007566
    label: embryo implantation
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:1333856
  review:
    summary: acts_upstream_of_or_within embryo implantation, transferred from Klf9-null mouse phenotype.
    action: KEEP_AS_NON_CORE
    reason: Klf9-null female mice have fewer implantation sites due to a maternal uterine defect and reduced
      progesterone responsiveness. The acts_upstream_of_or_within qualifier is appropriate for this knockout
      phenotype; it is a physiological consequence of Klf9 transcriptional regulation in uterine stroma,
      not its core activity, and has not been tested in rat.
    supported_by:
    - reference_id: PMID:15117941
      supporting_text: The reduced litter size is solely a maternal genotype effect and results from fewer
        numbers of implantation sites, rather than defects in ovulation.
    - *id007
- term:
    id: GO:0007623
    label: circadian rhythm
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q13886
  review:
    summary: Circadian rhythm, transferred from human KLF9 (Spörl et al. 2012).
    action: MARK_AS_OVER_ANNOTATED
    reason: The human study shows KLF9 mRNA oscillates with time of day and is cortisol-induced in epidermis,
      i.e. KLF9 is a clock-controlled output gene. No evidence places Klf9 in the clock mechanism itself
      (no effect on core clock gene oscillation reported in the abstract), so involved_in circadian rhythm
      overstates its role; rhythmic expression alone is expression evidence. No rat data.
    supported_by:
    - reference_id: PMID:22711835
      supporting_text: Putative Klf9 target genes include proliferation/differentiation markers that also
        show circadian expression in vivo
    - &id010
      reference_id: PMID:22711835
      supporting_text: that is substantially up-regulated in a cortisol and differentiation-state-dependent
        manner
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:Q13886
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: 'Human KLF9 circadian claim rests on rhythmic, cortisol-driven expression in epidermis
          (PMID:22711835): a clock-output gene, not a participant in the circadian clock.'
