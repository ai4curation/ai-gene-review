- term:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:1356762
  review:
    summary: Rat BTEB represses the single-GC-box CYP1A1 BTE promoter in transfected CV-1 cells; its N-terminal
      SID recruits mSin3A and represses when tethered to DNA.
    action: NEW
    reason: 'Molecular function, not a process term: rat Klf9 is a bifunctional DNA-binding transcription
      factor, and the repressor half of its activity is supported by a direct reporter assay with the
      rat protein (PMID:1356762) and by the conserved Sin3-interacting alpha-helical repression motif
      (PMID:11438660). GOA currently carries only the activator term (GO:0001228), so the repressor activity
      is missing. Comparator: KLF10/KLF11 (TIEG), which share the same SID, are annotated as RNA polymerase
      II-specific repressors.'
    supported_by:
