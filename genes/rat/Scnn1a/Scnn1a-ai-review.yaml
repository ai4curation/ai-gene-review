  review:
    summary: Plasma membrane.
    action: ACCEPT
    reason: Correct. ENaC subunits are integral two-pass membrane proteins that act at the cell surface.
      Apical plasma membrane (GO:0016324, also accepted) is the specific location in polarized epithelia,
      but ENaC also forms amiloride-sensitive channels in the plasma membrane of cells with no apical
      domain (Xenopus oocytes, heterologous cell lines, vascular smooth muscle, neurons), so plasma membrane
      is as precise as warranted across contexts and is kept beside the apical term rather than replaced
      by it.
    supported_by:
    - reference_id: PMID:26394093
      supporting_text: the observation of amiloride sensitive current is evidence for αrENaC activity
        in the plasma membrane of the induced CHO cells
    - reference_id: PMID:11773057
      supporting_text: using electron microscopy, we demonstrated apical, but not basal, membrane localization
        of ENaC in these cells
    - reference_id: file:rat/Scnn1a/Scnn1a-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: ENaC operates in epithelial tissues, where it mediates the electrodiffusion of
        sodium ions from extracellular fluid through the apical membrane of cells, with water following
        osmotically
