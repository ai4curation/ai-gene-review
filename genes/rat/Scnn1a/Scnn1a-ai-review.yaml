- term:
    id: GO:0005272
    label: sodium channel activity
  evidence_type: IDA
  original_reference_id: PMID:20007351
  qualifier: contributes_to
  review:
    summary: Sodium channel activity (contributes_to). Rat alpha-beta-gamma ENaC expressed in oocytes
      produces amiloride-sensitive Na+ currents stimulated by 8-pCPT-cGMP.
    action: ACCEPT
    reason: Core molecular function. Rat alpha-ENaC was expression-cloned as an amiloride-sensitive Na+
      channel and is required for full alpha-beta-gamma channel activity; alpha alone can form homomeric
      Na+-conducting channels, so both enables and contributes_to are correct.
    supported_by:
    - reference_id: PMID:20007351
      supporting_text: Similar stimulatory effects of cGMP were observed in oocytes expressing either
        mouse or rat alphabetagamma-ENaC channels
    - reference_id: PMID:8107805
      supporting_text: The ion-selective permeability, the gating properties and the pharmacological profile
        of the channel formed by coexpressing the three subunits in oocytes are similar to that of the
        native channel
