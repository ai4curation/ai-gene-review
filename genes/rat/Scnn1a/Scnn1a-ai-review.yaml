core_functions:
- description: Principal pore-forming subunit of the alpha-beta-gamma epithelial sodium channel that mediates
    amiloride-sensitive Na+ entry across the apical plasma membrane of absorptive epithelia, the rate-limiting
    step of transepithelial Na+ reabsorption in the distal nephron and of fluid absorption in the lung.
  molecular_function:
    id: GO:0005272
    label: sodium channel activity
  directly_involved_in:
  - id: GO:0098719
    label: sodium ion import across plasma membrane
  - id: GO:0055078
    label: sodium ion homeostasis
  - id: GO:0042045
    label: epithelial fluid transport
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  in_complex:
    id: GO:0034706
    label: sodium channel complex
  supported_by:
  - reference_id: PMID:8382172
    supporting_text: It forms a channel that has the electrophysiological and pharmacological properties
      characteristic of the epithelial Na+ channel
  - reference_id: PMID:8107805
    supporting_text: The amiloride-sensitive epithelial sodium channel constitutes the rate-limiting step
      for sodium reabsorption in epithelial cells that line the distal part of the renal tubule
  - reference_id: PMID:11352848
    supporting_text: Immunoelectron microscopy confirmed the presence of ENaC subunits in both the apical
      plasma membrane and intracellular vesicles
  - reference_id: PMID:17562820
    supporting_text: Our results support a tetrameric arrangement of ENaC subunits where 2alpha, 1beta,
      and 1gamma come together around central pore.
  - reference_id: PMID:16258001
    supporting_text: Terbutaline failed to increase lung fluid absorption in rats given the specific alpha-ENaC
      siRNA-generating plasmid (pSi-4)
  - reference_id: file:rat/Scnn1a/Scnn1a-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: This is one of the three pore-forming subunits of the heterotrimeric epithelial sodium
      channel (ENaC), a critical regulator of sodium balance and fluid homeostasis
suggested_questions:
- question: Should ENaC subunits continue to carry ligand-gated sodium channel activity (GO:0015280) through
    PANTHER/InterPro family propagation, given that ENaC is constitutively open and has no physiological
    gating ligand, or should the PAINT node and InterPro2GO mapping (IPR004724) be restricted to ASIC/FaNaC/BASIC
    branches?
- question: Should renal sodium ion absorption (GO:0070294) be annotated to ENaC subunits? ENaC performs
    the apical Na+ entry step, rate-limiting for Na+ reabsorption, in the connecting tubule and collecting
    duct, and the apical transporters NKCC2 (SLC12A1) and NCC (SLC12A3) carry the term, yet no ENaC subunit
    in human, mouse or rat does. Is this absence a deliberate convention or a gap?
- question: Does alpha-ENaC in hypothalamic magnocellular neurons and vascular smooth muscle form canonical
    alpha-beta-gamma channels, or alpha-containing channels with other partners (e.g. delta or ASIC subunits)?
suggested_experiments:
- description: Conditional deletion of Scnn1a in rat magnocellular vasopressin neurons combined with patch
    clamp and measurement of plasma vasopressin and Na+ balance, to test whether neuronal alpha-ENaC sets
    neuronal excitability and contributes to osmotic or Na+-dependent vasopressin release.
  experiment_type: conditional knockout with electrophysiology
- description: Selective ENaC inhibition or genetic knockout in rat spermatozoa, with CASA motility and
    acrosome reaction assays using selective blockers (e.g. benzamil at low concentrations) rather than
    EIPA, to test whether sperm alpha-ENaC has a function.
  experiment_type: pharmacology and sperm function assays
