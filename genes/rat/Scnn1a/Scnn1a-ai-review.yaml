id: P37089
gene_symbol: Scnn1a
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Scnn1a encodes the alpha subunit of the amiloride-sensitive epithelial sodium channel (ENaC),
  a member of the DEG/ENaC family. Alpha-ENaC has short cytoplasmic N- and C-termini, two transmembrane
  helices and a large cysteine-rich, N-glycosylated extracellular domain. It is the principal pore-forming
  subunit: expressed alone it forms small amiloride-sensitive Na+ currents, and with beta (Scnn1b) and
  gamma (Scnn1g) subunits it forms the highly Na+-selective, constitutively open channel of the apical
  plasma membrane of Na+-absorbing epithelia (connecting tubule and collecting duct, distal colon, airway
  and alveolar epithelium, exocrine ducts). ENaC carries out the rate-limiting apical Na+ entry step of
  transepithelial Na+ reabsorption and so sets whole-body Na+ balance, extracellular fluid volume and
  blood pressure, and drives alveolar fluid clearance; loss of alpha-ENaC function causes pseudohypoaldosteronism
  type 1. Alpha-ENaC is the subunit transcriptionally induced by aldosterone and glucocorticoids. Channel
  activity is controlled by furin cleavage that releases an inhibitory tract from the alpha extracellular
  domain, by SGK1 phosphorylation of the alpha C-terminus, and by NEDD4/NEDD4L binding to the C-terminal
  PY motif, which drives ubiquitination and retrieval. Alpha-ENaC also mediates amiloride-sensitive salt
  taste and is detected in hypothalamic magnocellular neurons, vascular smooth muscle, motile cilia and
  sperm, where its roles are less well defined.'
