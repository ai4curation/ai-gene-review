- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - UniProtKB:P06858
  review:
    summary: Signaling receptor binding transferred from the mouse ortholog.
    action: KEEP_AS_NON_CORE
    reason: LPL binds endocytic lipoprotein receptors (LRP1, VLDLR) and acts as a bridge for lipoprotein
      uptake, and VLDLR has been proposed to traffic LPL to the endothelium. The binding is plausible
      and conserved but is not the enzymatic core function, and these receptors act mainly as endocytic
      rather than signalling receptors.
    supported_by:
    - &id018
      reference_id: PMID:18722549
      supporting_text: Interestingly, LPL is not synthesised in the endothelium but is derived from the
        cardiomyocyte itself [4] and must be translocated across the interstitial space to be re-expressed
        on the luminal surface of the capillary endothelium [5].
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - UniProtKB:P06858
  review:
    summary: Calcium binding stabilises the LPL fold and promotes active dimer formation.
    action: KEEP_AS_NON_CORE
    reason: The Ca(2+) binding residues (194, 197, 199, 202) are conserved, and Ca(2+) promotes folding
      into the active form. This is a structural cofactor property rather than the gene's core function.
    supported_by:
    - reference_id: file:rat/Lpl/Lpl-uniprot.txt
      record_section: ["CC:ACTIVITY REGULATION"]
      supporting_text: Ca(2+) binding promotes protein stability and formation of the active homodimer.
    - &id030
      reference_id: PMID:16179346
      supporting_text: The second step was promoted by Ca2+ and converted LPL monomers from the molten
        globule state to dimerization-competent and more tightly folded monomers that rapidly formed active
        LPL dimers.
