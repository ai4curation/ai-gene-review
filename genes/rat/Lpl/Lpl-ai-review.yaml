  review:
    summary: Lpl is a secreted enzyme that acts extracellularly, on the luminal surface of capillary endothelium.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0005615
      label: extracellular space
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008325466
        source_status: SUPPORTS_TRANSFER
        comment: The extracellular location transfers correctly to rat LPL, a secreted enzyme; only the term granularity is refined.
    reason: LPL is synthesised by parenchymal cells (adipocytes, cardiomyocytes, myocytes), secreted,
      and transported to the capillary lumen. Rat adipose tissue studies directly distinguish intracellular
      and extracellular (heparin-releasable) LPL pools (PMID:12551943). The term is correct but general, since the
      secreted enzyme acts in the extracellular space (capillary lumen), so it is refined to GO:0005615.
    supported_by: &id008
    - *id007
    - reference_id: PMID:12551943
      supporting_text: Lipoprotein lipase (LPL) acts at the vascular endothelium.
    - reference_id: PMID:20620994
      supporting_text: LPL is synthesized and secreted by myocytes and adipocytes, but then finds its
        way into the lumen of capillaries, where it hydrolyzes lipoprotein triglycerides.
