id: Q06000
gene_symbol: Lpl
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Lpl encodes lipoprotein lipase, a secreted member of the lipase family (alpha/beta hydrolase
  fold with a C-terminal PLAT domain) that hydrolyses triacylglycerol carried in circulating chylomicrons
  and very-low-density lipoproteins. It is made mainly by adipocytes, cardiomyocytes and skeletal myocytes,
  secreted, held by heparan sulfate proteoglycans, and moved to the luminal surface of capillary endothelium,
  where GPIHBP1 anchors it. There, with the apolipoprotein APOC2 as activator, it releases fatty acids
  and monoacylglycerol for uptake by the underlying tissue, converting chylomicrons and VLDL into remnant
  particles and driving plasma triglyceride clearance. LPL also has a weak phospholipase A1 activity.
  In rat, active heparin-releasable LPL in adipose tissue and heart is regulated after translation by
  nutritional state, insulin, cold acclimation and inflammatory nitration, which directs fatty acids to
  storage or oxidation.
