suggested_questions:
- question: Is the rat IMP annotation to triglyceride biosynthetic process (PMID:11788374) based on a
    direct measurement of triglyceride synthesis, or on adipose LPL activity changes that only supply
    fatty acids for re-esterification?
- question: In rat heart, which route (VLDLR-dependent or GPIHBP1-dependent transcytosis) moves cardiomyocyte-derived
    LPL to the luminal endothelial surface during cold acclimation?
suggested_experiments:
- description: In perfused hearts from cold-acclimated rats, compare heparin-releasable LPL with Gpihbp1
    and Vldlr protein levels and localisation (immunofluorescence on capillaries), to identify which receptor
    limits LPL presentation in physiological hypertrophy.
  experiment_type: immunofluorescence and enzyme activity assay
