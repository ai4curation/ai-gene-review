- term:
    id: GO:0004465
    label: lipoprotein lipase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:96820
  - PANTHER:PTN000906454
  - RGD:3017
  - UniProtKB:P06858
  - UniProtKB:P11151
  review:
    summary: Lipoprotein lipase activity is the defining catalytic activity of Lpl.
    action: ACCEPT
    reason: LPL hydrolyses the sn-1/sn-3 ester bonds of triacylglycerol carried in chylomicrons and VLDL,
      with APOC2 as cofactor. Rat LPL carries the conserved Ser-Asp-His catalytic triad (S159, D183, H268)
      and the lipase family signature. Rat-specific evidence comes from heparin-releasable and tissue
      triolein hydrolase activity, assayed with an apoC-II source, in adipose tissue and heart (PMID:12551943,
      PMID:11788374, PMID:21569266, PMID:18722549). The IBA node, ISO transfers and the IEA mapping all
      reinforce the same claim.
    supported_by: &id002
    - *id001
    - &id003
      reference_id: PMID:1371284
      supporting_text: Lipoprotein lipase (LPL) plays a central role in normal lipid metabolism as the
        key enzyme involved in the hydrolysis of triglycerides present in chylomicrons and very low density
        lipoproteins.
    - reference_id: PMID:18722549
      supporting_text: Aliquots of post-heparin perfusate and acetone-dried heart powders (10 mg) were
        reacted with triacylglycerol emulsion (final concentration 5.6 mM) pre-labelled with 3H-[9,10]-triolein
        supplemented with human plasma (ratio plasma to final reaction volume 1:6) as a source of Apolipoprotein
        CII.
