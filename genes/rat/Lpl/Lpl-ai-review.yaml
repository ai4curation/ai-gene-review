- id: PMID:11016888
  title: Masoprocol decreases serum triglyceride concentrations in rats with fructose-induced hypertriglyceridemia.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract read. Pharmacology study; adipose LPL activity increased with masoprocol. Supports
      only an expression/activity response, not a gene function.
- id: PMID:11788374
  title: Resistance of adipose tissue lipoprotein lipase to insulin action in rats fed an obesity-promoting
    diet.
  findings:
  - statement: Adipose LPL activity rises postprandially in chow-fed rats but is blunted by an obesogenic
      diet.
    supporting_text: In chow-fed rats, adipose LPL activity increased two- to fourfold postprandially,
      but only minimally (30%) in HSHF-fed rats.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract read (full text not cached). Measures rat adipose and muscle LPL activity with
      feeding and diet-induced insulin resistance; supports LPL activity and its role in triglyceride
      clearance. Does not show LPL catalysing triglyceride synthesis.
- id: PMID:12551943
  title: The distribution of lipoprotein lipase in rat adipose tissue. Changes with nutritional state
    engage the extracellular enzyme.
  findings:
  - statement: Nutritional regulation of adipose LPL acts on the activity state of the extracellular enzyme.
    supporting_text: This study suggests that the nutritional regulation of LPL in adipose tissue determines
      the activity state of extracellular LPL.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read (full text not cached). Rat adipose tissue study separating intracellular
      and extracellular, active and inactive LPL; heparin releases endothelial-surface LPL. Supports activity
      and extracellular/cell-surface location.
- id: PMID:21569266
  title: Changes in white adipose tissue metabolism induced by resveratrol in rats.
  findings:
  - statement: Heparin-releasable LPL is the active, endothelium-located form of the enzyme in adipose
      tissue.
    supporting_text: Heparin-releasable LPL, the active form of this enzyme which is placed in adipose
      tissue endothelium, was significantly reduced by resveratrol.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Heparin-releasable LPL activity in rat adipose tissue reduced by resveratrol;
      supports LPL activity in rat tissue.
- id: PMID:25931001
  title: ShRNA-mediated gene silencing of lipoprotein lipase improves insulin sensitivity in L6 skeletal
    muscle cells.
  findings:
  - statement: LPL depletion in L6 myotubes mimics insulin action on glucose metabolism.
    supporting_text: Thus, LPL depletion appeared to mimic the action of insulin.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. shRNA knockdown of LPL in rat L6 myotubes with purified LPL add-back;
      LPL depletion enhances insulin-stimulated glucose metabolism. Effect is indirect (fatty acid supply).
- id: PMID:18722549
  title: Cold acclimation induces physiological cardiac hypertrophy and increases assimilation of triacylglycerol
    metabolism through lipoprotein lipase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text read. Isolated perfused rat hearts: cold acclimation increases heparin-releasable
      and tissue-residual LPL activity (triolein hydrolysis with an apoC-II source) and uptake of triacylglycerol
      emulsion. Supports LPL activity and its endothelial-surface (heparin-releasable) pool in rat heart.
      Not cited in GOA.'
  findings:
  - statement: Cold acclimation increases heparin-releasable and residual LPL activity in rat heart.
    supporting_text: Cold acclimation significantly increased heparin-releasable LPL (P<0.05) and tissue
      residual LPL (P<0.01).
  - statement: Cardiac LPL is made by cardiomyocytes and translocated to the luminal endothelial surface.
    supporting_text: Interestingly, LPL is not synthesised in the endothelium but is derived from the
      cardiomyocyte itself [4] and must be translocated across the interstitial space to be re-expressed
      on the luminal surface of the capillary endothelium [5].
