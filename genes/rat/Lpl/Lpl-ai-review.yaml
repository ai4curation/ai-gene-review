    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: Lpl is a peripheral protein on the extracellular face of the plasma membrane of endothelial
      (and producing) cells.
    action: ACCEPT
    reason: UniProt places LPL as a peripheral membrane protein on the extracellular side of the cell
      membrane, anchored by GPI-anchored GPIHBP1 and by HSPGs. This is consistent with its action at the
      luminal endothelial surface. Cell surface (also carried) is the closer description of this location.
    supported_by: &id009
