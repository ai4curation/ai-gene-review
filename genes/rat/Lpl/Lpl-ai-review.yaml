core_functions:
- description: Secreted lipoprotein lipase that, anchored at the luminal surface of capillary endothelium
    by GPIHBP1 and heparan sulfate proteoglycans and activated by APOC2, hydrolyses triacylglycerol in
    chylomicrons and VLDL. This releases fatty acids for uptake by adipose tissue, heart and skeletal
    muscle, and remodels the particles into remnants that are cleared from plasma.
