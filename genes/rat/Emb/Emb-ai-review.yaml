core_functions:
- description: 'Ancillary (escort) subunit of proton-linked monocarboxylate transporters: embigin binds
    MCT2 (and MCT1 in rat erythrocytes, and MCT7) through its transmembrane helix, delivers the transporter
    to the plasma membrane and is required for its transport activity and inhibitor sensitivity.'
  molecular_function:
    id: GO:0140597
    label: protein carrier chaperone
  directly_involved_in:
