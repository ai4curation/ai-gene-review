  - *id003
  - *id001
  - *id011
  - reference_id: PMID:19473976
    supporting_text: DIDS cross-links MCT1 to its ancillary protein embigin
  - reference_id: PMID:35257743
    supporting_text: interactions of MCT7 with ancillary proteins basigin/CD147 and embigin/GP70 enhanced
      MCT7-mediated taurine transport
suggested_questions:
- question: Should embigin be annotated to taurine transport (via MCT7) or monocarboxylate transport generally,
    given that rat Gp70 enhances MCT7-mediated taurine uptake, or is the ancillary role better captured
    only by protein carrier activity and protein localization to plasma membrane?
- question: Is the neuromuscular-junction sprouting effect of embigin mediated by its MCT-ancillary role
    (e.g. lactate export from muscle) or by an adhesion function in trans with NCAM-expressing nerve terminals?
- question: Should the IgSF PAINT node PTN001296633 be split so that basigin-family MCT ancillary proteins
    do not inherit Dscam-type dendrite self-avoidance and axon-guidance terms?
suggested_experiments:
- description: Emb knockout or muscle-specific knockdown in rat/mouse with measurement of MCT2 and MCT1
    surface levels and lactate flux in erythrocytes, neurons and muscle, to test the ancillary role in
