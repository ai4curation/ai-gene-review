description: 'Embigin (Emb, gp70) is a single-pass type I transmembrane glycoprotein of the immunoglobulin
  superfamily (two extracellular Ig-like domains, one transmembrane helix and a short cytoplasmic tail),
  belonging to the basigin family together with basigin (CD147) and neuroplastin. Its best-characterised
  role is as an ancillary (chaperone) subunit of proton-linked monocarboxylate transporters: it associates
  with MCT2 (Slc16a7), with MCT1 in rat erythrocytes and with MCT7 (Slc16a6), binding the transporter
  through its transmembrane helix next to transporter helices 3 and 6, and is required for delivery of
  the transporter to the plasma membrane and for its activity, also shaping inhibitor sensitivity. Embigin
  is also expressed in developing and regressing prostate and mammary epithelium, and in skeletal muscle,
  where it is strongly induced by denervation and concentrates at neuromuscular junctions; muscle overexpression
  promotes motor nerve terminal sprouting, and mouse embigin enhances integrin-dependent cell-substratum
  adhesion.'
