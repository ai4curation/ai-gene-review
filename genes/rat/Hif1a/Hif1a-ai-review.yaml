        interaction with the cysteine- and histidine-rich 1 domain of p300.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: UniProtKB:Q16665 GO:0140537 PMID:11063749 (assigned by DisProt)
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0140537
      corrected_value: GO:0001223
      corrected_label: transcription coactivator binding
      confidence: PROBABLE
      explanation: PMID:11063749 shows the HIF-1alpha CTAD binds the p300 CH1 domain as required for HIF-1 transactivation;
        HIF-1alpha is the recruiting transcription factor, not a regulator that activates p300. The ISO row in rat
        inherits this.
