core_functions:
- description: 'Oxygen-regulated transcription activator: as the alpha subunit of the HIF-1 heterodimer with ARNT,
    binds hypoxia response elements in RNA polymerase II cis-regulatory regions and activates transcription of hypoxia-responsive
    genes (erythropoietin, VEGF, glucose transporters, glycolytic enzymes), producing the cellular response to hypoxia.'
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - &id001
    id: GO:0071456
    label: cellular response to hypoxia
  - id: GO:0097411
    label: hypoxia-inducible factor-1alpha signaling pathway
  - id: GO:0032364
    label: intracellular oxygen homeostasis
  locations:
  - &id002
    id: GO:0005634
    label: nucleus
  in_complex: &id003
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  supported_by:
