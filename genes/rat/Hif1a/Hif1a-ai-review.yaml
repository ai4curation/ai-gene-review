id: O35800
gene_symbol: Hif1a
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Hif1a encodes hypoxia-inducible factor 1-alpha, the oxygen-regulated subunit of the HIF-1 basic helix-loop-helix
  PAS transcription factor. In normoxia HIF-1alpha is hydroxylated on two prolines in its oxygen-dependent degradation
  domain by the PHD/EGLN prolyl hydroxylases, bound by the von Hippel-Lindau E3 ubiquitin ligase and degraded by
  the proteasome, while asparaginyl hydroxylation of its C-terminal transactivation domain by FIH blocks recruitment
  of the coactivators CBP/p300. When oxygen falls, or when iron chelators, cobalt, carbon monoxide, reactive oxygen
  species, cytokines or growth-factor signalling intervene, HIF-1alpha accumulates, enters the nucleus and heterodimerises
  through its bHLH-PAS region with ARNT (and with the neuronal paralogue ARNT2). The heterodimer binds hypoxia response
  elements containing the core 5'-RCGTG-3' in promoters and enhancers and recruits CBP/p300 to activate RNA polymerase
  II transcription of genes for erythropoietin, vascular endothelial growth factor, glucose transporters and glycolytic
  enzymes, among many others; at some promoters HIF-1 instead represses transcription. Through this target programme
  HIF-1alpha drives cellular and systemic adaptation to hypoxia, including angiogenesis, erythropoiesis, glycolytic
  metabolism and cell survival, and it is required for normal cardiovascular and placental development. In rat it
  is expressed in kidney (higher in the medulla than the cortex), perivenous hepatocytes, heart, lung and brain.
