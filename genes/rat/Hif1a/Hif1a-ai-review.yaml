- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:20496369
  qualifier: involved_in
  review:
    summary: In rat nucleus pulposus cells HIF-1 binds HREs in the ANK promoter and represses it.
    action: ACCEPT
    reason: 'Full text (PMID:20496369): HIF-1alpha silencing raises and overexpression suppresses ANK promoter
      activity through its HREs, so HIF-1 represses this RNA polymerase II gene directly. Repression is a
      genuine, if less common, mode of the same DNA-binding activity and is carried in core_functions beside
      the activator role.'
    supported_by:
    - reference_id: PMID:20496369
      supporting_text: We found that HIF-1 can bind to either of the HREs and can suppress promoter activity
    - reference_id: PMID:20496369
      supporting_text: Both HIF-1 and HIF-2 serve as negative regulators of ANK expression in the disc.
