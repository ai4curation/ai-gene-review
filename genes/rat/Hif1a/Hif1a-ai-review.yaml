    supporting_text: All three cDNAs encoded functionally active proteins, of 825, 874 and 662 amino acids. After
      transfection they were able to activate luciferase activity of a luciferase gene construct containing three
      HIF-responsive elements.
  - &id004
    reference_id: PMID:12675925
    supporting_text: induction of TH gene expression involves activation of the hypoxia-inducible transcription
      factors (HIFs) that interact with a specific hypoxia-responsive element (HRE) in the proximal region of the
      TH promoter
  - &id005
    reference_id: PMID:26071548
    supporting_text: Our promoter activity and chromatin immunoprecipitation assays confirmed the presence of a
      functional hypoxia response element in the frataxin promoter.
  - reference_id: file:rat/Hif1a/Hif1a-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Functions as a master transcriptional regulator of the adaptive response to hypoxia
  - reference_id: file:rat/Hif1a/Hif1a-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Under hypoxic conditions, activates the transcription of over 40 genes, including erythropoietin,
      glucose transporters, glycolytic enzymes, vascular endothelial growth factor
- description: Sequence-specific DNA binding at hypoxia response elements; the basic regions of HIF-1alpha and ARNT
    each contact one half-site, so DNA binding is a property of the heterodimer.
