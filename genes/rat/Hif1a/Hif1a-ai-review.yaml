suggested_questions:
- question: Which genes does the neuronal HIF-1alpha/ARNT2 heterodimer regulate in rat? It did not recognise the
    erythropoietin HRE (PMID:11029639), so its DNA-binding preference and target set are unknown.
- question: Are the two rat Hif1a brain splice variants (PMID:11029639) represented among the isoforms of UniProt
    O35800, and do they differ functionally from the canonical protein?
- question: Many rat annotations are IEP rows recording that HIF-1alpha protein or mRNA changes under a stimulus.
    Should GO adopt a convention distinguishing "the factor is induced by X" from "the factor executes the response
    to X"?
suggested_experiments:
- description: ChIP-seq of HIF-1alpha and ARNT (and ARNT2) in rat neurons and cardiomyocytes under hypoxia, to define
    the direct rat target gene set and to separate activated from repressed targets.
- description: 'Test the repressive mode directly: compare HIF-1 occupancy and coregulator composition (p300 versus
    corepressors) at an activated HRE (enolase-1) and a repressed HRE (ANK) in rat nucleus pulposus cells.'
- description: Re-examine the gluconeogenesis claim with a Hif1a-specific knockdown or PHD-inhibitor rescue in aged
    rat hepatocytes, measuring PEPCK and glucose output, since the cited study perturbed HNF4alpha.
