taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Sry is the Y-linked testis-determining gene of the rat. Like human and mouse SRY it encodes
  an HMG-box transcription factor that binds [AT]AACAA[AT] sites and, in somatic cells of the undifferentiated
  gonadal ridge, activates a cascade of testis genes including Sox9. The laboratory rat is unusual in
  carrying many Sry copies on the Y chromosome (Sry1, Sry2, Sry3 variants, Sry4, Sry4A and a non-HMG copy)
  that encode slightly different proteins; Sry4A, Sry1 and Sry3C are expressed at the onset of testis
  differentiation. In adult males Sry is also expressed in tyrosine hydroxylase-positive neurons of the
  substantia nigra, where knockdown lowers tyrosine hydroxylase and causes motor deficits.
