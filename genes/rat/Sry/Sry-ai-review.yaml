suggested_questions:
- question: Which of the many rat Sry copies are functionally required for testis determination, and do
    their protein variants differ in DNA binding or nuclear import?
- question: Is the regulation of tyrosine hydroxylase by Sry in nigral neurons direct, and does it involve
    the same DNA-binding activity used in the gonad?
suggested_experiments:
- description: Copy-specific knockout or knockdown of Sry4A, Sry1 and Sry3C in rat embryos to test which
    copies are needed for testis differentiation.
