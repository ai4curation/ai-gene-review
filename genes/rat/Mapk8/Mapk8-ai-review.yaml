suggested_questions:
- question: 'GO:0097050 type B pancreatic cell apoptotic process (IMP, PMID:24475223): the paper shows
    that JNK1 knockdown increases INS-1 apoptosis. Should RGD replace the term with GO:2000675 negative
    regulation of type B pancreatic cell apoptotic process?'
- question: 'GO:0060395 SMAD protein signal transduction (IMP, PMID:27769861): the abstract places JNK
    downstream of, and suppressed by, activin A/Smad signalling. Does the full text show a JNK1-specific
    perturbation that affects Smad signalling itself, or should the annotation be withdrawn?'
- question: 'GO:0048666 neuron development (IEP, PMID:17568197): the abstract reports increased JNK1 mRNA
    during TNF-induced apoptosis of differentiated PC12 cells. Is there evidence in the full text that
    supports a neuron development annotation?'
- question: 'GO:0019894 kinesin binding (IPI, PMID:18932217, with RGD:621559): does the full text show
    direct JNK1 binding to the kinesin component, or is the interaction bridged by Daxx?'
- question: Rat-specific data on JNK1 in apoptosis point in opposite directions (pro-apoptotic in cardiomyocyte
    reoxygenation, cortical neurons and glioma; protective in INS-1 beta cells). Which substrates (for
    example BIM/BMF versus BAD) account for the sign in each cell type?
suggested_experiments:
- description: Use JNK1-selective knockdown or analogue-sensitive JNK1 knock-in in H4IIEC3 hepatocytes
    to test whether the palmitate-induced, ROS-dependent inhibition of insulin signalling seen with SP600125
    is mediated by JNK1 rather than JNK2, and identify the phosphorylated IRS2 serine sites.
  hypothesis: JNK1 is the isoform that couples palmitate-derived mitochondrial ROS to serine phosphorylation
    of IRS2 in rat hepatocytes.
- description: Phosphoproteomics of rat INS-1 cells expressing JNK1 shRNA versus control under palmitate/high
    glucose, to identify the JNK1 substrates that mediate its protective effect on beta-cell survival.
  hypothesis: The anti-apoptotic action of JNK1 in beta cells is mediated by phosphorylation of specific
    Bcl-2 family or UPR proteins distinct from its pro-apoptotic substrates in neurons.
