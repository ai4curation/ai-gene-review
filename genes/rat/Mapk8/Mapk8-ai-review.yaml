    supporting_text: These data suggest that JNK1 is responsible for regulation of SCG10 depolymerizing
      activity and neurite elongation during brain development.
  - reference_id: PMID:16618812
    supporting_text: SCG10-S73 phosphorylation is significantly decreased in JNK1-/- cortex, indicating
      that JNK1 phosphorylates SCG10 in developing forebrain.
  - reference_id: PMID:21297631
    supporting_text: the phosphorylation of SCG10 by JNK1 is a fundamental mechanism that governs the
