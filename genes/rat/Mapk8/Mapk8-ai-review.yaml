- id: PMID:19332540
  title: Palmitate induces insulin resistance in H4IIEC3 hepatocytes through reactive oxygen species produced
    by mitochondria.
  findings:
  - statement: Palmitate activates JNK in rat H4IIEC3 hepatocytes via mitochondrial ROS; the pan-JNK inhibitor
      SP600125 restores insulin signalling. JNK1 and JNK2 were not distinguished.
    supporting_text: These results suggest that JNK activation by palmitate contributed to palmitate-induced
      insulin resistance.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Rat hepatocyte line; JNK inhibited only pharmacologically (SP600125),
      so the insulin-resistance effect cannot be assigned to JNK1 specifically. No new annotation proposed
      from it.
core_functions:
- description: 'Terminal kinase of the stress-activated JNK cascade: once dually phosphorylated on the
    TXY motif by MAP2K4/MAP2K7, JNK1 phosphorylates AP-1 transcription factors such as c-Jun (Ser63/Ser73)
    and ATF2, coupling cytokine, oxidative and metabolic stress to transcription.'
  molecular_function:
    id: GO:0004705
    label: JUN kinase activity
  directly_involved_in:
