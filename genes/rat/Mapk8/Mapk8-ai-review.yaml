id: P49185
gene_symbol: Mapk8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Mapk8 encodes c-Jun N-terminal kinase 1 (JNK1, SAPK gamma), a proline-directed serine/threonine
  protein kinase of the CMGC group and the MAP kinase subfamily. It is the terminal kinase of the stress-activated
  JNK cascade: cytokines, oxidants, metabolic stress and other cellular stresses activate MAP3Ks that
  drive dual phosphorylation of the Thr183-Pro-Tyr185 activation-loop motif by MAP2K4 and MAP2K7, and
  JIP scaffolds assemble these modules. Active JNK1 phosphorylates Ser/Thr-Pro sites in many substrates.
  In the nucleus these are mainly AP-1 transcription factors such as c-Jun (Ser63/Ser73) and ATF2, through
  which JNK1 controls stress-responsive gene expression. In the cytoplasm, and prominently in neurons,
  it phosphorylates SCG10/stathmin-2 (regulating microtubule dynamics, neurite length and radial migration),
  paxillin (cell migration), synaptotagmin-4 (capture of dense core vesicles at synapses) and AMPA receptor
  subunits. In rat cells JNK1 promotes apoptosis in some settings (cardiomyocyte reoxygenation, amyloid-beta-treated
  cortical neurons, glioma) and protects against it in others (INS-1 beta cells under glucolipotoxicity),
  and it drives agonist-stimulated hepatocyte DNA synthesis. Its activity is inhibited by S-nitrosylation
  of Cys116 and by dual-specificity phosphatases.'
