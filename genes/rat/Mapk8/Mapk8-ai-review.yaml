    label: JNK cascade
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:rat/Mapk8/Mapk8-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: In this cascade, two dual specificity kinases MAP2K4/MKK4 and MAP2K7/MKK7 phosphorylate
      and activate MAPK8/JNK1. In turn, MAPK8/JNK1 phosphorylates a number of transcription factors, primarily
      components of AP-1 such as JUN, JDP2 and ATF2 and thus regulates AP-1 transcriptional activity.
  - reference_id: PMID:9487126
    supporting_text: JNK1- blunted the abilities of glucose, TNFalpha, or HGF to increase JNK1 activity,
      to increase phosphorylation of c-Jun at serine 63, and to stimulate DNA synthesis.
  - reference_id: PMID:11849756
    supporting_text: These data suggest that MKK7 is responsible for activating the JNK pathway during
      LK-induced CGN apoptosis.
- description: Cytoplasmic neuronal JNK1 phosphorylates the microtubule-destabilising protein SCG10/stathmin-2
    on Ser62/Ser73, inhibiting its depolymerising activity and so controlling microtubule dynamics, neurite
    elongation and the rate of radial migration of cortical neurons.
  molecular_function:
