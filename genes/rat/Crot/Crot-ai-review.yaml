- term:
    id: GO:0009410
    label: response to xenobiotic stimulus
  evidence_type: IDA
  original_reference_id: PMID:11023836
  review:
    summary: response to xenobiotic stimulus is treated as over-annotation because
      it is contextual or downstream of Crot's direct role (IDA, PMID:11023836).
    action: MARK_AS_OVER_ANNOTATED
    reason: The paper shows that the drug etomoxir irreversibly inhibits rat COT and maps the
      inhibitor-sensitive histidines (H131, H340). Being the molecular target of a drug
      is a property of the enzyme, not participation by Crot in a cellular or organismal
      response to the xenobiotic, so the process term overshoots what was measured. The
      informative result is captured by the carnitine O-octanoyltransferase activity
      annotation from the same paper.
    supported_by:
    - reference_id: PMID:11023836
      supporting_text: Rat peroxisomal carnitine octanoyltransferase (COT), which facilitates the transport of
        medium-chain fatty acids through the peroxisomal membrane, is irreversibly
        inhibited by the hypoglycaemia-inducing drug etomoxir.
    - reference_id: PMID:11023836
      supporting_text: these results indicate that the two histidine residues, H131 and H340, are the sites
        responsible for inhibition by etomoxir
  qualifier: involved_in
- term:
    id: GO:0071874
    label: cellular response to norepinephrine stimulus
  evidence_type: HEP
  original_reference_id: PMID:14618266
  review:
    summary: cellular response to norepinephrine stimulus is treated as over-annotation
      because it is contextual or downstream of Crot's direct role (HEP, PMID:14618266).
    action: MARK_AS_OVER_ANNOTATED
    reason: Crot mRNA co-clustered with energy-metabolism genes in a microarray time course of
      cardiomyocytes from norepinephrine-infused rats. An expression change during in
