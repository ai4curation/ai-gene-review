- id: file:rat/Crot/Crot-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: rat Crot (UniProt P11466),
    peroxisomal carnitine O-octanoyltransferase'
  findings:
  - statement: Falcon confirms the gene identity (rat Crot, UniProt P11466) and the
      core catalytic role as a peroxisomal carnitine acyltransferase catalyzing reversible
      acyl transfer between acyl-CoA and carnitine, corroborating GO:0008458.
    supporting_text: 'CROT is a **peroxisomal carnitine acyltransferase** that catalyzes
      a reversible acyl‑transfer reaction:


      **L‑carnitine + acyl‑CoA ⇄ acyl‑L‑carnitine + CoASH**.'
    reference_section_type: OTHER
  - statement: Falcon documents the physiological rationale for acylcarnitine formation,
      supporting the carnitine metabolic process and coenzyme A metabolic process
      annotations.
    supporting_text: This chemistry is central to **acylcarnitine formation**, which
      is widely used by cells to move (or buffer) acyl groups across compartment boundaries
      where **acyl‑CoAs themselves are poorly membrane‑permeable**.
    reference_section_type: OTHER
  - statement: Falcon corroborates the medium-chain substrate preference that underpins
      the carnitine O-octanoyltransferase activity and medium-chain fatty acid metabolic/transport
      annotations.
    supporting_text: Across sources, CROT is described as preferring **medium‑chain
      acyl‑CoAs**
    reference_section_type: OTHER
  - statement: Falcon supports the role of Crot in handling branched-chain beta-oxidation
      products (e.g. DMN-CoA), consistent with medium-chain fatty acid metabolic process.
    supporting_text: CROT has also been implicated in handling **branched‑chain β‑oxidation
      products**, including conversion of **4,8‑dimethylnonanoyl‑CoA (DMN‑CoA)** to
      a carnitine ester for downstream oxidation.
    reference_section_type: OTHER
  - statement: Falcon supports peroxisomal localization (GO:0005777) as the site where
      Crot acts.
    supporting_text: CROT is described as **peroxisomal** and, in one mechanistic
      discussion, as **entirely peroxisomal**.
    reference_section_type: OTHER
  - statement: Falcon frames the pathway role as export of peroxisomal beta-oxidation
      products as acylcarnitines for downstream mitochondrial oxidation, supporting
      fatty acid beta-oxidation and the medium-chain transport annotations.
    supporting_text: Core pathway role is export of **peroxisomal β-oxidation products**
      as **acylcarnitines** for downstream mitochondrial oxidation.
    reference_section_type: OTHER
  - statement: Falcon describes Crot as a carnitine-dependent transport mechanism
      exporting beta-oxidation products to mitochondria, supporting the medium-chain
      fatty acid transport annotation.
    supporting_text: CROT is explicitly presented as a key component of a **carnitine-dependent
      transport mechanism** exporting β-oxidation products to mitochondria for further
      metabolism.
    reference_section_type: OTHER
  - statement: Falcon notes that rat Crot expression is induced by peroxisome proliferators
      in liver, providing context (but not core-function support) for the response
      to xenobiotic stimulus annotation, which remains marked as over-annotation (downstream
      transcriptional response).
    supporting_text: In rat liver, **peroxisome proliferators** induce **Crot** expression.
    reference_section_type: OTHER
  - statement: Falcon reports a 2023 finding that CROT is a p53 target supporting
      oxidative metabolism and cell survival during nutrient starvation, providing
      regulatory context downstream of the core enzymatic role.
    supporting_text: CROT activity supports **oxidative metabolism and cell survival
      during nutrient starvation**
    reference_section_type: OTHER
