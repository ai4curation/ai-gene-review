id: P11466
gene_symbol: Crot
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Crot encodes peroxisomal carnitine O-octanoyltransferase (COT), a member
  of the carnitine/choline acetyltransferase family that is imported into peroxisomes
  by a C-terminal Ala-His-Leu targeting signal. COT reversibly transfers acyl groups between
  coenzyme A and L-carnitine; it acts on saturated acyl-CoAs from C2 to C20 with an optimum
  at C6-C10, and also on branched-chain intermediates such as 4,8-dimethylnonanoyl-CoA
  from pristanic acid oxidation. By converting the medium-chain and branched-chain acyl-CoA
  products of peroxisomal beta-oxidation into acylcarnitines, it allows these chain-shortened
  fatty acids to leave the peroxisome for complete oxidation in mitochondria, and it
  regenerates free CoA inside the organelle. COT is abundant in liver, is induced by peroxisome
  proliferators, and is inhibited by malonyl-CoA and the drug etomoxir through two active-site-proximal
  histidines (His131 and His340).
