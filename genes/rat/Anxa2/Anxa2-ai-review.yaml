id: Q07936
gene_symbol: Anxa2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Annexin A2 (p36, calpactin I heavy chain) is a ubiquitously expressed member of the annexin
  family of calcium-regulated membrane-binding proteins, built from four annexin repeats and an N-terminal
  tail that binds S100A10 (p11) and carries regulatory Src (Tyr24) and PKC (Ser26) phosphorylation sites.
  In a Ca2+-dependent manner it binds anionic phospholipids, notably phosphatidylserine and phosphatidylinositol
  4,5-bisphosphate, at the cytoplasmic face of the plasma membrane and of endosomes, macropinosomes and
  secretory vesicles, and it binds F-actin, linking membranes to the cortical actin cytoskeleton and limiting
  barbed-end filament elongation. As the AnxA2-S100A10 heterotetramer it is also displayed on the endothelial
  cell surface, where it acts as a co-receptor for plasminogen and tissue plasminogen activator and promotes
  plasmin generation, supporting fibrinolysis and neoangiogenesis. In rat cells it is required for v-Src
  targeting to the plasma membrane and recycling endosomes and for v-Src-driven actin remodeling and transformation,
  and it contributes to regulated exocytosis such as surfactant secretion by alveolar type II cells. Additional
  reported roles include endocytic trafficking, membrane repair and inhibition of PCSK9-mediated LDL receptor
  degradation.
