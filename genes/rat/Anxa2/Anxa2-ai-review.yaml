suggested_questions:
- question: Is the UniProt basement membrane location (PMID:1618851) a genuine extracellular localization
    in rat tissue, or does it reflect the sub-plasma-membrane lamina noted in the same record?
- question: Does annexin A2 have a genuine serine-type endopeptidase inhibitor activity, or does the human-derived
    annotation reflect an indirect effect on protease activity?
suggested_experiments:
- description: Test whether a Tyr24 phospho-dead (Y24F) annexin A2 rescues v-Src-induced transformation
    in annexin A2-depleted Rat-1 cells, to separate its upstream role in v-Src targeting from its downstream
    effector role in actin remodeling.
