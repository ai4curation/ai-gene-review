core_functions:
- description: Sequence-specific binding of GC-box cis-regulatory elements and repression of RNA polymerase II promoters (e.g.
    Smad7, caveolin-1, Sod2, catalase) through recruitment of the mSin3A-HDAC corepressor via its N-terminal Sin3-interacting
    alpha-helical motif; repression of Smad7 potentiates TGF-beta signalling.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in: *id012
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id005
  - *id001
  - *id002
  - *id009
  - *id003
- description: Context-dependent activation of RNA polymerase II promoters in pancreatic beta cells (insulin, Pdx1), via GC-box
    binding and recruitment of the coactivator p300.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id006
  - *id007
suggested_questions:
- question: What is the human experimental source for the regulation of G1/S transition annotation transferred to rat Klf11,
    and does it reflect a direct KLF11 activity or an overexpression phenotype?
- question: 'What determines whether KLF11 represses (Smad7, caveolin-1) or activates (insulin, Pdx1) a GC-box promoter: mSin3A
    versus p300 recruitment, ERK phosphorylation state, or promoter architecture?'
suggested_experiments:
- description: ChIP-seq and RNA-seq of Klf11 knockdown in rat beta cells (INS-1) and cardiomyocytes to define direct repressed
    versus activated targets in rat.
  experiment_type: ChIP-seq / RNA-seq
- description: Mutate the Sin3-interacting alpha-helical motif of rat Klf11 and test Smad7-promoter repression and TGF-beta
    reporter potentiation, to confirm conservation of the human mechanism.
  experiment_type: mutagenesis / reporter assay
