id: E9PTS6
gene_symbol: Klf11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Krueppel-like factor 11 (Klf11, also TIEG2, TGF-beta-inducible early gene 2) is a nuclear Sp/KLF-family transcription
  factor with three C-terminal C2H2 zinc fingers that bind GC-box (GGGCGG) cis-regulatory elements in RNA polymerase II promoters.
  It acts mainly as a transcriptional repressor, recruiting the mSin3A-histone deacetylase corepressor through an N-terminal
  alpha-helical Sin3-interacting motif; ERK/MAPK phosphorylation next to this motif disrupts mSin3A binding and relieves repression.
  Repressed targets include Smad7, so that Klf11 potentiates TGF-beta/Smad signalling, as well as caveolin-1, the antioxidant
  genes Sod2 and catalase, and Bcl-xL. Klf11 also activates some promoters, notably insulin and Pdx1 in pancreatic beta cells
  through the coactivator p300. Its overexpression inhibits cell proliferation and promotes apoptosis, and human KLF11 variants
  are associated with maturity-onset diabetes of the young type 7. Mouse Klf11 knockouts are viable with normal hematopoiesis.
  In rat cardiomyocytes Klf11 mRNA is downregulated by endothelin-1.
