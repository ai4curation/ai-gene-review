  supporting_entities:
  - UniProtKB:O14901
  review:
    summary: Negative regulation of cell population proliferation (acts upstream of), from human KLF11.
    action: KEEP_AS_NON_CORE
    reason: KLF11/TIEG2 overexpression inhibits proliferation and neoplastic transformation, dependent on its mSin3A-interacting
      domain. This is a downstream cellular consequence of its repressor activity, appropriately qualified acts_upstream_of;
      non-core. The KLF11 knockout mouse has no growth defect, so the role is not essential.
