  supporting_entities:
  - GO:0042147
  review:
    summary: >-
      Inter-ontology logical inference to cytosol from retrograde transport, endosome to
      Golgi; keep as non-core for the soluble cytosolic pool of Arfrp1.
    action: KEEP_AS_NON_CORE
    reason: >-
      Rat Arfrp1 lacks transmembrane helices and is synthesized in the cytosol before
      Sys1-mediated TGN docking, cycling into the cytosol when GDP-bound (PMID:17127620),
      whereas its active sorting function takes place at the TGN membrane.
