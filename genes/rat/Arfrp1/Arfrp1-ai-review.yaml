id: Q63055
gene_symbol: Arfrp1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  ADP-ribosylation factor-related protein 1 (Arfrp1; aliases Arp1, ARP) is a 201-residue
  monomeric Arf-family small GTPase in rat that shares 100% amino-acid sequence identity with
  mouse Arfrp1 and 97.5% identity with human ARFRP1. Unlike canonical Gly2-myristoylated Arf
  isotypes, rat Arfrp1 carries an N-terminal amphipathic helix starting with Met1-Tyr2 that
  undergoes NatC-mediated N-acetylation to dock onto the Golgi integral membrane receptor Sys1
  at the trans-Golgi network (TGN), and purified recombinant ARP displays saturable GTPgammaS
  binding and intrinsic GTPase activity without requiring phospholipids or tissue extracts. At
  the TGN, Arfrp1 orchestrates recruitment of ARL1, GRIP-domain golgins, ARL5/GARP, AP-1, and
  GOPC to drive endosome-to-Golgi retrograde transport and selective TGN-to-plasma-membrane
  protein and lipoprotein trafficking.
