- term:
    id: GO:0036402
    label: proteasome-activating activity
  evidence_type: ISS
  original_reference_id: PMID:23495936
  qualifier: contributes_to
  review:
    action: NEW
    summary: Psmc6/Rpt4 contributes, as one of the six base ATPases, to the ATP-driven proteasome-activating
      activity of the 19S base hexamer.
    reason: GO:0036402 is ATP hydrolysis that promotes substrate unfolding and 20S channel opening, an
      activity of the base heterohexamer as a whole. Rpt4 is an intact AAA ATPase in that ring (IPR050221,
      Walker A/B present), so it contributes to the activity; it cannot perform it alone, and its own
      C-terminal tail lacks the HbYX motif and is not docked in the alpha ring, so the contributes_to qualifier
      is required. The other base ATPases carry this term (e.g. rat Psmc4 by IBA); here GOA lacks the
      IBA row, and the molecular function is supported directly by family membership and structure.
    supported_by:
    - reference_id: PMID:23495936
      supporting_text: 'The six ATPases adopt a single arrangement in normal cells: Rpt1-Rpt2-Rpt6-Rpt3-Rpt4-Rpt5'
    - reference_id: PMID:17803938
      supporting_text: Upon ATP binding, these C-terminal residues bind to pockets between the 20S's alpha
        subunits.
    - reference_id: PMID:29636472
      supporting_text: the carboxyl (C)-terminal tails of Rpt subunits, with the exception of Rpt4, were
        inserted into the corresponding α-pockets
    - reference_id: file:rat/Psmc6/Psmc6-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR050221; 26S_Proteasome_ATPase.
