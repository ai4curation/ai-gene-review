gene_symbol: Psmc6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Psmc6 (26S proteasome regulatory subunit 10B; also called p42, S10b or Rpt4) is one of
  the six AAA+ ATPases that form the heterohexameric base of the 19S regulatory particle of the 26S proteasome,
  where it sits between Rpt3 and Rpt5 and pairs with Rpt5 through an N-terminal coiled coil. Its Walker
  A/B AAA module binds and hydrolyses ATP, and as part of the ATPase ring it helps unfold ubiquitinated
  substrates and translocate them into the 20S core particle for degradation in the cytosol and nucleus.
  Unlike Rpt2, Rpt3 and Rpt5, its C-terminal tail lacks an HbYX motif and is not seen docked in the 20S
  alpha ring. In mammalian cells Rpt4 is also found in a 20S-free 19S-like (APIS) complex. In rat neurons
  it accumulates at polyglutamine inclusions, and its knockdown reduces inclusion formation by mutant huntingtin.'
