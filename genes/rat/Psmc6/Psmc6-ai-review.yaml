core_functions:
- description: Psmc6/Rpt4 is an AAA+ ATPase of the 19S base heterohexamer (between Rpt3 and Rpt5). It
    binds and hydrolyses ATP, and as one of six ring ATPases contributes to the hexamer's proteasome-activating
    activity, unfolding ubiquitinated substrates and translocating them into the 20S core, so it directly
    carries out 26S-proteasome-mediated degradation of ubiquitinated proteins in the cytosol and nucleus.
    It cannot perform the activating activity alone, and unlike the HbYX-bearing ATPases its tail does
    not dock in the 20S alpha ring.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  contributes_to_molecular_function:
