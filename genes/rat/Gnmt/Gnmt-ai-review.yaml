id: P13255
gene_symbol: Gnmt
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Glycine N-methyltransferase (Gnmt, EC 2.1.1.20) is an abundant soluble cytosolic enzyme
  of rat liver, also expressed in kidney proximal tubules, exocrine pancreas and intestinal epithelium.
  It transfers the methyl group of S-adenosyl-L-methionine (SAM/AdoMet) to glycine, producing sarcosine
  (N-methylglycine) and S-adenosyl-L-homocysteine (SAH/AdoHcy). Because sarcosine has no major biosynthetic
  fate, the reaction serves mainly to dispose of excess SAM and thereby sets the hepatic SAM:SAH ratio
  (cellular methylation potential). The enzyme is a homotetramer of a class I-like SAM-dependent methyltransferase
  fold whose N-terminal segments reach into the neighbouring subunit''s active site, giving auto-inhibition
  at low SAM, cooperative SAM binding and weak product inhibition by SAH. Gnmt is identical to the major
  hepatic folate-binding protein (folate-binding protein-cytosol II): it binds two molecules of 5-methyltetrahydrofolate
  (preferentially the pentaglutamate) per tetramer at intersubunit sites, and this binding inhibits the
  enzyme, most potently in the native N-terminally acetylated form. Folate inhibition couples SAM disposal
  to de novo methyl-group synthesis through the folate/methionine cycle. Hepatic Gnmt levels are induced
  by retinoids and by betaine supplementation.'
