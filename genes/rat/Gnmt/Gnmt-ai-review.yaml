  - reference_id: PMID:18501206
    supporting_text: is an important regulatory enzyme, which serves to remove excess S-adenosylmethionine,
      the universal methyl donor in the cell, by the methylation of glycine
  - reference_id: PMID:12859184
    supporting_text: Glycine N-methyltransferase (GNMT) catalyzes the S-adenosyl-l-methionine- (SAM-)
      dependent methylation of glycine to form sarcosine.
- description: Binds 5-methyltetrahydrofolate (preferentially the polyglutamate) at two intersubunit sites
    per homotetramer; folate binding inhibits catalysis, coupling SAM disposal to folate-dependent de
    novo methyl-group supply. Inhibition is potentiated by N-terminal acetylation of the native enzyme.
