core_functions:
- description: Cytosolic glycine N-methyltransferase that transfers the methyl group of SAM to glycine,
    forming sarcosine and SAH; this removes excess hepatic SAM and sets the SAM:SAH ratio (methylation
    potential) as a step of the methionine cycle.
