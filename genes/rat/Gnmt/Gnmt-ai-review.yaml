    label: glycine metabolic process
  evidence_type: IMP
  original_reference_id: PMID:10756111
  qualifier: involved_in
  review:
    summary: Glycine metabolic process from R175K glycine-site mutant and structural analysis of rat GNMT.
    action: KEEP_AS_NON_CORE
    reason: GNMT methylates glycine to sarcosine and so directly performs a step of glycine metabolism;
