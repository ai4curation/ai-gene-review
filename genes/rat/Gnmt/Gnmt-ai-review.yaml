    - &id009
      reference_id: PMID:12859184
      supporting_text: Glycine N-methyltransferase (GNMT) catalyzes the S-adenosyl-l-methionine- (SAM-)
        dependent methylation of glycine to form sarcosine.
- term:
    id: GO:0006546
    label: glycine catabolic process
  evidence_type: IMP
  original_reference_id: PMID:18501206
  qualifier: involved_in
  review:
    summary: Glycine catabolic process attributed to rat GNMT from a study of N-terminal acetylation and
      folate inhibition.
    action: MARK_AS_OVER_ANNOTATED
    reason: The full text of PMID:18501206 reports kinetics, folate binding and folate inhibition of native
      vs recombinant rat GNMT; it does not measure glycine breakdown. Physiologically the sarcosine formed
      by GNMT is demethylated back to glycine by sarcosine dehydrogenase, so the GNMT/SARDH cycle is a
      route for disposal of SAM methyl groups, not net glycine catabolism. Glycine metabolic process (GO:0006544)
      is the appropriate glycine-related process; the catabolic term is an over-annotation.
    supported_by:
    - *id005
