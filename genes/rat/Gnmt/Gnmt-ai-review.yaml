    summary: glycogen metabolic process transferred from mouse Gnmt (MGI) knockout/phenotype data.
    action: MARK_AS_OVER_ANNOTATED
    reason: Gnmt has no direct catalytic or regulatory role in glycogen metabolic process; any effect
