    summary: Reactome assigns rat Gnmt to the demethylation of Se-adenosylselenomethionine (AdoSeMet)
      to Se-adenosylselenohomocysteine.
    action: KEEP_AS_NON_CORE
    reason: The GO definition (R + Se-adenosylselenomethionine = CH3-R + Se-adenosyl-L-selenohomocysteine)
