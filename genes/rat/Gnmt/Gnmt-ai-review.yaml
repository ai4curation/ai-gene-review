suggested_questions:
- question: Is the reported nuclear pool of rat liver Gnmt (PMID:8278367) functionally significant, and
    should a nucleus location be annotated?
- question: Should regulation of gluconeogenesis and glycogen metabolic process, which rest on whole-animal
    phenotypes of Gnmt-deficient mice, be propagated by PAINT/ISO to rat at all, given that GNMT does
    not act on these pathways directly?
- question: How quantitatively important is Gnmt-catalysed use of Se-adenosylselenomethionine (GO:0098603)
    in rat selenium metabolism compared with other methyltransferases?
- question: Does phosphorylation of N-terminal serines (e.g. Ser9) tune folate sensitivity of Gnmt differently
    across liver, kidney and pancreas?
suggested_experiments:
- hypothesis: N-terminal acetylation is required for physiological folate inhibition of rat Gnmt in vivo.
  description: Knock-in rats expressing a Gnmt variant that cannot be N-terminally acetylated (or NatA-deficient
    hepatocytes); measure hepatic SAM, SAH, sarcosine and 5-methyltetrahydrofolate-dependent inhibition
    of Gnmt activity under folate-replete and folate-deficient diets.
- hypothesis: Gnmt contributes to Se-adenosylselenomethionine demethylation in rat liver.
  description: Compare demethylation of [75Se]selenomethionine-derived AdoSeMet in liver cytosol from
    wild-type and Gnmt-deficient rats, with recombinant enzyme kinetics for AdoSeMet versus AdoMet.
