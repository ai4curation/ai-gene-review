    label: folic acid binding
  evidence_type: IDA
  original_reference_id: PMID:17158459
  qualifier: enables
  review:
    summary: Crystal structure of rat GNMT with 5-methyltetrahydrofolate plus solution binding assays
      show two folate molecules bound per tetramer in intersubunit sites.
    action: ACCEPT
    reason: GNMT was originally identified as folate-binding protein-cytosol II of rat liver and binds
      5-methyltetrahydrofolate (preferentially the pentaglutamate) at two intersubunit sites per tetramer;
      this binding is the physiological mechanism by which folate status inhibits GNMT and so links methyl-group
      disposal to de novo methyl-group synthesis. GO:0005542 folic acid binding is the most specific available
      term (no 5-methyltetrahydrofolate-specific binding term was found in GO). Core regulatory function.
    supported_by:
    - reference_id: PMID:17158459
      supporting_text: Binding experiments in solution also confirm that one GNMT tetramer binds two folate
        molecules.
    - reference_id: PMID:17158459
      supporting_text: In the GNMT-folate complex, two folate binding sites were located in the intersubunit
        areas of the tetramer.
