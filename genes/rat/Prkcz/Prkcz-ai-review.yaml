  review:
    summary: Mouse-derived ISO for microtubule cytoskeleton organization (acts upstream of or within).
    action: KEEP_AS_NON_CORE
    reason: 'Consistent with the polarity role: in rat astrocytes Cdc42-recruited Par6/PKCzeta acts through dynein
      to reorient the MTOC and microtubule network toward the leading edge. PKCzeta acts upstream of microtubule
      reorganization through the polarity pathway rather than organising microtubules itself, so this is peripheral
      to its kinase function.'
