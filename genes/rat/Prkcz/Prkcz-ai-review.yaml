- term:
    id: GO:0004697
    label: diacylglycerol-dependent serine/threonine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:2.7.11.13
  review:
    summary: IEA from the EC 2.7.11.13 (protein kinase C) mapping to diacylglycerol-dependent serine/threonine kinase
      activity.
    action: REMOVE
    reason: Atypical PKCs are not activated by diacylglycerol; the single C1 domain of PKCzeta does not bind DAG.
      EC 2.7.11.13 covers all PKC isoforms, so mapping it to the DAG-dependent child term is wrong for atypical
      PKCs.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: ec2go
      slot: EC:2.7.11.13 mapping
      requested_change: REPOINT
      asserted_value: GO:0004697
      corrected_value: GO:0004674
      corrected_label: protein serine/threonine kinase activity
      cause: OTHER
      confidence: PROBABLE
      explanation: The ec2go mapping of EC 2.7.11.13 (protein kinase C) to GO:0004697 diacylglycerol-dependent serine/threonine
        kinase activity propagates a DAG-dependence claim to atypical PKCs (PRKCZ, PRKCI), which are not regulated
        by diacylglycerol or calcium. Either map EC 2.7.11.13 to GO:0004674 or exclude atypical PKCs.
      supported_by:
      - &id006
        reference_id: file:rat/Prkcz/Prkcz-uniprot.txt
        record_section: ["CC:ACTIVITY REGULATION"]
        supporting_text: are not regulated by diacylglycerol, phosphatidylserine, phorbol esters or calcium ions
    supported_by:
    - *id006
    - &id007
      reference_id: file:rat/Prkcz/Prkcz-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: The C1 domain does not bind the diacylglycerol (DAG).
