suggested_questions:
- question: Which postsynaptic substrates does PKMzeta phosphorylate to drive NSF/GluR2-dependent AMPA receptor
    insertion, and is NSF itself a direct substrate?
- question: To what extent does PKCiota/lambda compensate for PKCzeta/PKMzeta in rat LTP maintenance and memory,
    given the debated specificity of the ZIP inhibitor peptide?
- question: Should the EC 2.7.11.13 to GO:0004697 (DAG-dependent) mapping be restricted so that atypical PKCs no
    longer receive DAG-dependent activity terms?
suggested_experiments:
- hypothesis: PKMzeta kinase activity, not only its protein level, is required for late-LTP maintenance and memory
    in rat hippocampus.
  description: Isoform-specific knockdown of PKMzeta in rat dorsal hippocampus with rescue by wild-type versus kinase-dead
    PKMzeta (and an analog-sensitive allele for acute inhibition), measuring late-LTP and long-term memory, with
    PKCiota/lambda levels monitored for compensation.
  experiment_type: genetic perturbation with electrophysiology
- hypothesis: PKMzeta directly phosphorylates postsynaptic proteins that release GluR2-containing AMPA receptors
    from PICK1-held extrasynaptic pools.
  description: Phosphoproteomics of synaptosomes from tetanised versus control CA1 slices, with and without analog-sensitive
    PKMzeta inhibition, followed by phospho-site mutant validation of candidate substrates.
  experiment_type: phosphoproteomics
