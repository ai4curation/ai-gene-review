    - id: GO:0030864
      label: cortical actin cytoskeleton
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      record: RGD:3399
      slot: GO term
      requested_change: REPOINT
      asserted_value: GO:0001725
      corrected_value: GO:0030864
      corrected_label: cortical actin cytoskeleton
      cause: OTHER
      confidence: PROBABLE
      explanation: The RGD IDA annotation of rat Prkcz to GO:0001725 stress fiber cites PMID:16525020 (Liu et al.
        2006, L6 muscle cells). The paper states that where actin remained in stress fibres the PKCzeta staining
        was diffuse, and that PKCzeta colocalised with insulin-induced cortical actin (meshlike structures beneath
        the dorsal surface). GO:0030864 cortical actin cytoskeleton fits the reported localisation.
      supported_by:
