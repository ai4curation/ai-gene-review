  review:
    summary: IDA for stress fiber from L6 myotube imaging (PMID:16525020).
    action: MODIFY
    reason: 'The full text of PMID:16525020 does not show PKCzeta on stress fibres: where actin remained in stress
      fibres PKCzeta staining was diffuse, and PKCzeta colocalised instead with the insulin-induced cortical actin
      mesh beneath the dorsal plasma membrane. The location the paper supports is the cortical actin cytoskeleton.'
