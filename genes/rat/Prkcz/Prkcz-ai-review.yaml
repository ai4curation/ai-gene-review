    summary: ISO from human PRKCZ (Q05513) for calcium,diacylglycerol-dependent serine/threonine kinase activity.
    action: REMOVE
    reason: PKCzeta is an atypical PKC that is regulated neither by calcium nor by diacylglycerol; it lacks a C2
      domain and its C1 domain does not bind DAG. The conventional-PKC activity term is demonstrably wrong for this
      gene and should not be propagated.
    propagation_review:
