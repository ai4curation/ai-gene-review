id: P09217
gene_symbol: Prkcz
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Prkcz encodes protein kinase C zeta (PKCzeta), an atypical member of the AGC protein kinase C family.
  It has an N-terminal PB1 domain that mediates heterodimerisation with PAR6 and with scaffolds such as SQSTM1/p62,
  a pseudosubstrate segment, a single atypical C1 domain that does not bind diacylglycerol, and a Ser/Thr kinase
  domain. Unlike conventional and novel PKCs it is insensitive to calcium, diacylglycerol and phorbol esters; it
  is activated downstream of PI 3-kinase by PDK1 phosphorylation of its activation loop (Thr-410). The full-length
  kinase is a predominantly cytoplasmic protein recruited to the plasma membrane and cell cortex, where, in the
  PAR6-PAR3-aPKC polarity complex downstream of Cdc42, it establishes front-rear and apico-basal polarity, orients
  the microtubule network and supports directed migration. It also acts downstream of PI 3-kinase in insulin and
  growth-factor signaling, contributing to GLUT4 translocation and glucose uptake, activation of the MEK-ERK cascade
  and NF-kappa-B-dependent transcription. An alternative promoter in intron 4 produces the brain-specific, N-terminally
  truncated, constitutively active isoform PKMzeta, which is concentrated at postsynaptic densities of hippocampal
  and cortical neurons and sustains the late phase of long-term potentiation by promoting NSF/GluR2-dependent insertion
  of AMPA receptors into synapses.
