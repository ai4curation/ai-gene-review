core_functions:
- description: As a heme-thiolate cytochrome P450 anchored to the endoplasmic reticulum membrane, accepts
    electrons from NADPH--cytochrome P450 reductase and inserts one atom of molecular oxygen into its
    substrate, acting principally as a steroid 7-alpha-hydroxylase on testosterone, progesterone, and
    androstenedione. The same active site also oxidises coumarin, which rat CYP2A1 converts by 3,4-epoxidation
    rather than by the 7-hydroxylation carried out by its human and mouse orthologues, giving the enzyme a
    role in hepatic steroid turnover and in xenobiotic oxidation.
  supported_by:
  - reference_id: UniProtKB:P11711
    supporting_text: 'FUNCTION: Highly active in the 7-alpha-hydroxylation of testosterone, progesterone and androstenedione.'
  - reference_id: PMID:12162851
    supporting_text: whereas the rat orthologue (CYP2A1) exhibits 3,4-epoxidation of coumarin, which is also
      consistent with the modelled interaction between enzyme and substrate
    reference_section_type: ABSTRACT
  molecular_function:
    id: GO:0008395
    label: steroid hydroxylase activity
  directly_involved_in:
  - id: GO:0006805
    label: xenobiotic metabolic process
  - id: GO:0009804
    label: coumarin metabolic process
  substrates:
  - id: CHEBI:17347
    label: testosterone
  - id: CHEBI:17026
    label: progesterone
  - id: CHEBI:16422
    label: androstenedione
