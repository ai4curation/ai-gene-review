id: P11711
gene_symbol: Cyp2a1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Cyp2a1 encodes rat cytochrome P450 2A1 (EC 1.14.14.1), a heme-thiolate monooxygenase of the
  CYP2A subfamily that sits as a peripheral protein on the endoplasmic reticulum and microsomal membrane.
  Using NADPH--cytochrome P450 reductase as its electron donor, it activates molecular oxygen at a heme iron
  centre and inserts one oxygen atom into an organic substrate while reducing the other to water. Its
  best-characterised activity is steroid 7-alpha-hydroxylation, being highly active on testosterone,
  progesterone, and androstenedione, which places it in hepatic steroid hormone turnover. It also metabolises
  coumarin, but by a route that distinguishes it from its orthologues, carrying out 3,4-epoxidation where
  human CYP2A6 and mouse CYP2A5 perform 7-hydroxylation, so the shared "coumarin metabolic process" role
  conceals a species-specific difference in regiochemistry and in the reactive metabolite produced.
  Expression is largely restricted to liver and testis and is induced by 3-methylcholanthrene.
