suggested_questions:
- question: Rat CYP2A1 epoxidises coumarin at the 3,4-position whereas human CYP2A6 and mouse CYP2A5
    7-hydroxylate it. Is GO:0009804 "coumarin metabolic process" the right shared term for all three, or does
    the divergent regiochemistry (and the reactive 3,4-epoxide it yields) warrant distinguishing the rat
    activity from the orthologous 7-hydroxylase activity?
- question: The arachidonate epoxygenase IBA on Cyp2a1 is seeded from rat Cyp2b12. Has arachidonic acid
    epoxidation ever been measured directly on purified or heterologously expressed rat CYP2A1, and if not,
    should the PANTHER node PTN002549507 be resolved so that the epoxygenase terms are scoped to the
    CYP2B/CYP2C/CYP2J branches?
- question: Rat CYP2A1, CYP2A2, and CYP2A3 are closely related and differ in tissue distribution and
    regioselectivity of steroid hydroxylation. Which 7-alpha-hydroxylation activities attributed to "rat
    CYP2A" are specifically CYP2A1 rather than CYP2A2?
- question: Is the physiologically important role of CYP2A1 the clearance of testosterone, progesterone, and
    androstenedione in liver, or does its testis expression indicate a local role in gonadal steroid
    metabolism?
suggested_experiments:
- hypothesis: Rat CYP2A1 does not enable arachidonate epoxygenase activity, and the IBA-derived GO:0008392 and
    GO:0019373 annotations reflect propagation from the CYP2B branch of the PANTHER node rather than measured
    CYP2A1 chemistry.
  description: Express rat CYP2A1 heterologously, reconstitute it with NADPH--cytochrome P450 reductase and
    lipid, and assay arachidonic acid turnover by LC-MS/MS for EET regioisomers alongside a positive-control
    CYP2B or CYP2C enzyme and a testosterone 7-alpha-hydroxylation positive control for CYP2A1 itself, so that
    a negative epoxygenase result is interpretable rather than an activity failure.
  experiment_type: reconstituted P450 activity assay with LC-MS/MS metabolite profiling
- hypothesis: The species split in coumarin regiochemistry is determined by a small number of active-site
    residues, so rat CYP2A1 can be converted toward 7-hydroxylation by substituting the corresponding CYP2A5
    or CYP2A6 residues.
  description: Build the reciprocal active-site mutants predicted by the published CYP2A homology models and
