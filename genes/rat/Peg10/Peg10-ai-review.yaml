suggested_questions:
- question: Does the rat Peg10 locus encode a Pol/aspartic-protease-containing isoform via -1 frameshifting,
    as in mouse and human, and is that protease catalytically active?
suggested_experiments:
- hypothesis: Rat PEG10 forms RNA-packaging virus-like particles like its mouse and human orthologs.
  description: Express tagged rat PEG10 in cells, purify particles by iodixanol ultracentrifugation, and
    test self-mRNA packaging by RNA-seq of the particle fraction.
  experiment_type: biochemical / particle assay
