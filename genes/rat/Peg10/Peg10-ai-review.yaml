gene_symbol: Peg10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Peg10 (paternally expressed gene 10; SIRH1) is a therian-specific imprinted gene domesticated
  from a Ty3/gypsy (sushi-ichi) LTR retrotransposon. The protein retains a retroviral Gag-like capsid
  domain with a CCHC-type nucleocapsid zinc knuckle; the capsid self-assembles into virus-like particles
  that bind and package PEG10's own mRNA and are secreted within extracellular vesicles, enabling intercellular
  transfer of the packaged mRNA. In other therian mammals (mouse, human) PEG10 is essential for placentation
  and its Pol-like aspartic protease is required for placental fetal-capillary maintenance; the rat protein
  is inferred to share the capsid/RNA-packaging and placental functions by orthology. PEG10 acts mainly
  in the cytoplasm and extracellularly, with a minor nuclear pool, and negatively regulates TGF-beta receptor
  signalling. The reviewed rat UniProt record (A0ABK0LI09, 408 aa) corresponds to the Gag-like (capsid)
  region and does not include a Pol/protease domain.
