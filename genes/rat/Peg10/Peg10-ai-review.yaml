- term:
    id: GO:0039660
    label: structural constituent of virion
  evidence_type: ISS
  original_reference_id: PMID:34413232
  qualifier: enables
  review:
    summary: The PEG10 Gag capsid domain self-assembles into virus-like particles in mouse and human (PMID:34413232);
      the rat ortholog retains the capsid domain and is inferred to share this structural (capsid) activity,
      which is the primary molecular function and not captured by existing annotations. X-ray crystallography
      of the human PEG10 CA C-terminal domain confirms it is a structural homolog of retroviral Gag capsid
      (PMID:34357660).
    action: NEW
    reason: Capsid self-assembly demonstrated for the orthologs; rat retains the capsid domain. Protease
      is not asserted here because the reviewed rat record lacks the Pol region.
    supported_by:
    - reference_id: PMID:34413232
      supporting_text: self-assemble into capsid-like particles
    - reference_id: PMID:34357660
      supporting_text: report here the X-ray crystal structures of the CA CTD-like domains of MOAP1 and
        PEG10, and confirm that these proteins are indeed structural homologs of retrovirus and retrotransposon
        Gag proteins
