id: P49653
gene_symbol: P2rx2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: P2rx2 encodes the P2X2 purinoceptor, a subunit of the P2X family of extracellularly ATP-gated,
  non-selective cation channels. Each subunit has two transmembrane helices, a large glycosylated extracellular
  loop that forms intersubunit ATP-binding sites, and cytoplasmic N- and C-termini. Three subunits assemble
  into homotrimeric P2X2 channels or heterotrimers with P2X1, P2X3 (P2X2/3), P2X4 and P2X6. When extracellular
  ATP binds, the channel opens a pore permeable to Na+, K+ and Ca2+ that depolarizes the cell and admits
  calcium, and it desensitizes only slowly. Extracellular zinc and copper potentiate gating through an
  intersubunit histidine site, and membrane phosphoinositides acting on the proximal C-terminus slow desensitization
  and pore dilation. Alternative splicing produces a C-terminally shortened variant (P2X2b) that desensitizes
  faster. P2X2 sits in the plasma membrane of neurons, sensory epithelia and secretory cells, including
  postsynaptic and presynaptic membranes of glutamatergic synapses, sensory afferent terminals, and the
  endolymph-facing surfaces of the cochlea. It mediates fast ATP-dependent synaptic and sensory transmission,
  for example in enteric neurons, carotid body chemoreceptor afferents, gustatory afferents and nociceptive
  and bladder afferents, and it is required for lifelong normal hearing.
