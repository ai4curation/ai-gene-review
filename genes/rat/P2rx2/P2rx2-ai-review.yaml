core_functions:
- description: 'Extracellular ATP-gated non-selective cation channel: P2X2 subunits assemble into homo-
    or heterotrimeric receptors in the plasma membrane that open on binding extracellular ATP, conducting
    Na+, K+ and Ca2+ to depolarize the cell and admit calcium, mediating fast purinergic synaptic and
    sensory transmission.'
