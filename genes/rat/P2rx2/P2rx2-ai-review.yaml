suggested_questions:
- question: GO:0019228 neuronal action potential is annotated to rat P2rx2 by IDA/IMP from PMID:16190872,
    PMID:16934235 and PMID:15317863, whose abstracts describe ATP-gated currents recorded under voltage
    clamp in oocytes, HEK cells or trigeminal neurons. Do the full texts report action potentials, or
    should these rows be replaced by the channel activity term already present?
- question: PMID:12849743 (response to ischemia, IMP) used the non-selective P2 antagonists suramin and
    basilen blue. Is there P2X2-specific perturbation evidence (knockout, knockdown or selective antagonist)
    in the full text that justifies an IMP rather than an IEP code?
- question: What is the primary evidence behind the mouse annotation of P2rx2 to GO:0098992 neuronal dense
    core vesicle (propagated to rat by ISO)?
- question: GO has no specific complex term for P2X receptor trimers. Would a 'P2X receptor complex' (homo-
    and heterotrimeric ATP-gated cation channel) under GO:0043235 be useful for P2X1-7?
suggested_experiments:
- hypothesis: P2X2 signalling on one side of the developing NMJ is required for pre/postsynaptic apposition.
  description: Compare NMJ formation in conditional (motor neuron vs muscle) P2rx2 knockouts to determine
    on which side of the developing synapse P2X2 acts and whether the muscle fibre changes are secondary
    to denervation.
  experiment_type: conditional knockout
