  review:
    summary: ISO from mouse (MGI) for response to hypoxia, based on the P2X2 knockout, which has an attenuated
      ventilatory response to hypoxia because carotid body afferents lose ATP-evoked excitation.
    action: KEEP_AS_NON_CORE
    reason: The mouse knockout supports a role in the hypoxic ventilatory reflex, where P2X2-containing
      receptors on sinus nerve afferents transduce ATP released by glomus cells. This is a physiological
      context of the channel, not its core activity; the more specific carotid body chemoreceptor term
      is also present.
