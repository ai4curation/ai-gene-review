  review:
    summary: IDA copper ion binding. Copper potently potentiates ATP currents through an extracellular
      histidine site (His120, His192, His213, His245, plus His319 for copper).
    action: KEEP_AS_NON_CORE
    reason: The metal-binding site is defined by mutagenesis and copper/zinc act there as allosteric modulators.
