    label: response to ischemia
  evidence_type: IMP
  original_reference_id: PMID:12849743
  qualifier: involved_in
  review:
    summary: IMP for response to ischemia. In hippocampal organotypic cultures and in gerbil hippocampus,
      P2X2 protein is upregulated after glucose/oxygen deprivation, and the non-selective P2 antagonists
      suramin and basilen blue reduce cell death.
    action: MARK_AS_OVER_ANNOTATED
    reason: From the abstract (full text not cached), the evidence is upregulation of expression (an IEP-type
      observation) and protection by broad-spectrum P2 antagonists that do not discriminate P2X2 from
      other P2X/P2Y receptors. Neither shows that P2X2 itself carries out a response to ischemia; a 'response
      to' annotation built on expression change is a classic over-annotation. Not removed because the
      curator saw the full text.
    supported_by:
