    supporting_text: In pancreatic cells, it forms KATP channels with ABCC8/SUR1
  - reference_id: PMID:15163199
    supporting_text: These studies indicate that the observed effects of the compounds on beta cells result
      from activation of K(ATP) channels of the cell membrane
suggested_questions:
- question: Should GO:0015272 be relabelled (e.g. 'ATP-inhibited inward rectifier potassium channel activity')?
    Its definition describes pore block by ATP, but the label 'ATP-activated' inverts the regulatory sign
    for KATP channels.
- question: Is there direct evidence that Kir6.2 (rather than Kir6.1) contributes to presynaptic KATP
    channels in rat hippocampal or other synapses?
suggested_experiments:
- description: Immuno-EM or super-resolution localization of Kir6.2 versus Kir6.1 at hippocampal CA3 presynaptic
    terminals in wild-type and Kcnj11-null tissue, to resolve which pore subunit forms presynaptic KATP
    channels.
