  review:
    action: KEEP_AS_NON_CORE
    summary: Potassium import across the plasma membrane by an inward rectifier.
    reason: Inward rectifiers pass K+ inward more readily, and GO links the KATP complex to this process;
      reconstituted Kir6.2/SUR channels conduct K+ in both directions. Physiologically, KATP opening mainly
      drives K+ efflux and hyperpolarization, so the core process is captured by GO:0071805 potassium
      ion transmembrane transport and this directional child is kept as non-core.
    supported_by:
    - reference_id: PMID:8630239
      supporting_text: Coexpression of SUR2 and the inward rectifier K+ channel subunit Kir6.2 in COS1
        cells reconstitutes the properties of K(ATP) channels described in cardiac and skeletal muscle.
    - reference_id: PMID:8607800
      supporting_text: Co-expression of rat Kir6.2 and sulfonylurea receptor in human embryonic kidney
        cells generated a potassium current with the properties of the beta-cell ATP-sensitive potassium
        channel.
