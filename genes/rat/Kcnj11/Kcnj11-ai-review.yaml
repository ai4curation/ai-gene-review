- term:
    id: GO:0019829
    label: ATPase-coupled monoatomic cation transmembrane transporter activity
  evidence_type: IGI
  original_reference_id: PMID:28842488
  qualifier: enables
  supporting_entities:
  - UniProtKB:A0A1S4NYG1
  - UniProtKB:A0A1U7R319
  review:
    action: MODIFY
    summary: IGI ATPase-coupled cation transporter activity; wrong activity class for a K+ channel pore.
    reason: Kir6.2 is a passive K+ channel; the paper measures channel open-state stability and ATP sensitivity.
      ATP is a ligand inhibiting the pore, not hydrolysed to drive transport. The intended claim is KATP
      channel activity (GO:0015272).
    proposed_replacement_terms:
    - id: GO:0015272
      label: ATP-activated inward rectifier potassium channel activity
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0019829
      corrected_value: GO:0015272
      corrected_label: ATP-activated inward rectifier potassium channel activity
      confidence: PROBABLE
      explanation: GO:0019829 is an ATP-hydrolysis-driven pump activity. PMID:28842488 studies slide-helix
        mutations of Kir6.1/Kir6.2 by ion flux and patch clamp, i.e. passive KATP channel gating; neither
        Kir6.2 nor its SUR partners pump cations.
    supported_by:
    - reference_id: PMID:28842488
      supporting_text: methionine substitution, but not leucine substitution, results in increased open
        state stability and hence significantly reduced ATP sensitivity
