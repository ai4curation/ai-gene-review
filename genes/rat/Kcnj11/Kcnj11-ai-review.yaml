id: P70673
gene_symbol: Kcnj11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Kcnj11 encodes Kir6.2, the pore-forming subunit of ATP-sensitive potassium (KATP) channels.
  Four Kir6.2 subunits form an inwardly rectifying K+ pore and assemble with four sulfonylurea receptor
  subunits (SUR1/Abcc8 in pancreatic beta cells and neurons, SUR2A/SUR2B/Abcc9 in heart, skeletal and
  smooth muscle) to form a hetero-octameric plasma membrane channel. ATP binding to the Kir6.2 cytoplasmic
  domain closes the pore, PIP2 opens it, and MgADP acting through SUR stimulates opening, so channel activity
  tracks the cytoplasmic ATP/ADP ratio and couples cell metabolism to membrane potential. In beta cells,
  closure of Kir6.2/SUR1 channels by glucose-derived ATP depolarizes the cell and triggers insulin secretion,
  while open channels suppress it; in cardiomyocytes, Kir6.2/SUR2A channels at the sarcolemma, T-tubules
  and intercalated disks open during ischemia and shorten the action potential. Surface delivery depends
  on co-assembly with SUR and on an ankyrin-B-binding motif in the Kir6.2 C-terminus.
