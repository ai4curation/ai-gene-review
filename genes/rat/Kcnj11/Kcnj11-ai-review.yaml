core_functions:
- description: 'Pore-forming subunit of ATP-sensitive K+ (KATP) channels: a Kir6.2 tetramer forms the
    inwardly rectifying K+ pore that is closed by ATP binding to Kir6.2 and opened by PIP2, conducting
    K+ across the plasma membrane in proportion to the cytoplasmic ATP/ADP ratio.'
