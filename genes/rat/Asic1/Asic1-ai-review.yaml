suggested_questions:
- question: Which native ASIC1-containing channels (ASIC1a homomers vs ASIC1a/2a or ASIC1a/1b heteromers)
    carry the acid-evoked current in defined rat brain regions, and what is their subunit stoichiometry?
- question: Is the behavioural fear/learning phenotype of ASIC1 loss a direct consequence of postsynaptic
    proton sensing, or secondary to altered spine density and network excitability?
suggested_experiments:
- hypothesis: Surface expression of rat ASIC1a homomers requires PCYOX1L in vivo.
  description: Knock down Pcyox1l in rat hippocampal neurons and quantify surface ASIC1a (extracellular-epitope
    labelling) and acid-evoked currents versus controls.
- hypothesis: Acid-evoked Ca2+ entry specifically through ASIC1a sets dendritic spine density.
  description: Compare spine density and acid-evoked spine Ca2+ transients in rat neurons expressing WT
    ASIC1a versus a Ca2+-impermeable pore mutant in an Asic1-null background.
