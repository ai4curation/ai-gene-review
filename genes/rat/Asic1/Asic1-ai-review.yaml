- description: Pore-forming subunit of trimeric proton-gated, Na+-selective cation channels in the neuronal
    plasma and postsynaptic membrane that open on extracellular acidification and depolarize the cell
    (ASIC1a and ASIC1b homomers and ASIC heteromers).
