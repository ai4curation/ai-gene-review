  negated: true
  review:
    summary: NOT pH-gated monoatomic ion channel activity, propagated by ISO from human ASIC1 isoform
      1 (hVariant 1, P78348-1), contradicts the direct rat evidence.
    action: REMOVE
    reason: The human NOT annotation is specific to hVariant 1, a primate-only isoform with a 46-residue
      insertion before the gate that is non-functional. That isoform does not exist in rodents, so the
      negation cannot be transferred to rat Asic1, whose isoforms ASIC1a and ASIC1b are both proton-gated
      channels by direct assay. The row is a demonstrably wrong electronic propagation across a lineage
      boundary.
