    label: behavioral fear response
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:1194915
  review:
    summary: 'behavioral fear response: behavioural phenotype of mouse Asic1 knockouts, transferred to
      rat by orthology.'
    action: KEEP_AS_NON_CORE
    reason: ASIC1a contributes to hippocampal and amygdala synaptic plasticity, and knockouts show learning,
      memory and fear deficits. The acts_upstream_of_or_within qualifier fits; these organismal processes
      are downstream of channel activity and are non-core.
    supported_by:
