- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:11842212
  qualifier: located_in
  review:
    summary: ASIC1 is a multi-pass plasma membrane channel; plasma membrane localization is supported
      by rat DRG immunolocalization and surface-expression assays.
    action: ACCEPT
    reason: The proton-gated conductance operates at the plasma membrane. Rat DRG immunohistochemistry
      with patch clamp, and surface biotinylation of heterologously expressed rat ASIC1a, support it.
      This is a direct-evidence location for a root cellular component (not an organelle sub-compartment
      issue), kept as a core location.
    supported_by:
    - &id006
      reference_id: PMID:11842212
      supporting_text: ASIC1 localizes to the plasma membrane of small-, medium-, and large-diameter cells
    - &id007
      reference_id: PMID:19074149
      supporting_text: biotinylation of surface proteins revealed equal amounts of rASIC1 protein in the
        plasma membrane of cells expressing wild type or mutants Gly-72 or Gly-288
    - &id008
      reference_id: PMID:40712023
      supporting_text: Strikingly, in the absence of PCYOX1L, plasma membrane expression of ASIC1a was
        abolished, indicating that PCYOX1L is indispensable for proper assembly of homomeric ASIC1a.
