id: P55926
gene_symbol: Asic1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Acid-sensing ion channel 1 (ASIC1, Accn2) is a DEG/ENaC-family subunit with two transmembrane
  helices and a large cysteine-rich extracellular domain that assembles into trimeric, voltage-independent
  cation channels opened by a drop in extracellular pH. Homotrimeric ASIC1a, the main brain isoform, gives
  transient, rapidly desensitizing, amiloride-sensitive Na+-selective currents with a small Ca2+ permeability;
  ASIC1b, expressed in sensory ganglia, activates at more acidic pH and is Ca2+-impermeable, and ASIC-beta2
  is inactive alone but modulates heteromers. ASIC1 also co-assembles with ASIC2 and ASIC3 to form heteromeric
  channels with distinct properties. In central neurons ASIC1a resides in the plasma membrane of somata,
  dendrites and spine heads, where it acts as a postsynaptic proton receptor, and its surface expression
  depends on the secreted protein PCYOX1L. Through acid-evoked depolarization and Ca2+ entry it influences
  dendritic spine density, synaptic plasticity, learning, memory and fear behaviour, contributes to acidosis-induced
  neuronal injury, and shapes acid-evoked responses of sensory neurons.
