    label: cytoskeletal protein binding
  evidence_type: IPI
  original_reference_id: PMID:21278383
  qualifier: enables
  review:
    summary: 'Proposed: Tes LIM domains bind cytoskeletal/focal-adhesion proteins (Mena EVH1 via LIM3, zyxin via
      LIM1, Arp7A via LIM2-3); the Tes-Mena-Arp7A complex was immunoprecipitated from rat testis.'
    action: NEW
    reason: 'Tes has no GO molecular-function row other than structural zinc binding. Its established activity is
      binding to cytoskeletal proteins through its LIM domains: LIM3 binds the Mena EVH1 domain (crystal structure),
      LIM1 binds zyxin directly, LIM2-3 binds the Arp7A N-terminus (crystal structure), and Tes co-purifies with
      actin. In rat, Tes is complexed with Mena and Arp7A in testis extracts. This is the activity itself, not a
      phenotype, and is more informative than protein binding; it is not an ancestor or descendant of any term on
      the gene.'
