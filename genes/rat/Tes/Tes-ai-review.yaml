core_functions:
- description: LIM-domain scaffold that binds cytoskeletal and focal-adhesion proteins (zyxin via LIM1, Arp7A via
    LIM2-3, Mena EVH1 via LIM3) and is recruited by zyxin to focal adhesions, where it modulates actin stress-fibre
    organisation, cell spreading and Mena-dependent migration; in spermatids it forms an Arp7A-Tes-Mena complex
    in the subacrosomal layer.
  molecular_function:
    id: GO:0008092
    label: cytoskeletal protein binding
  locations:
  - id: GO:0005925
    label: focal adhesion
  supported_by:
