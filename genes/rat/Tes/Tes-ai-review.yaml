  - *id010
  - *id008
  - *id007
  - *id001
suggested_questions:
- question: What is the function of the Arp7A-Tes-Mena complex in the rat acroplaxome, and does GO need a cellular-component
    term for the acroplaxome (subacrosomal layer) to capture this location?
- question: What signal opens the closed Tes conformation to allow zyxin binding and focal-adhesion recruitment,
    and is it conserved in rat?
- question: Is the growth-suppressive effect of TES overexpression a direct consequence of its focal-adhesion scaffolding
    (e.g. via Mena or RhoA), or an indirect effect in tumour lines?
suggested_experiments:
- hypothesis: Tes is required for acroplaxome integrity and acrosome anchoring in rat spermatids.
  description: Germ-cell-specific Tes knockout in rat, followed by electron microscopy of acrosome-acroplaxome-nuclear
    envelope attachment and localisation of Arp7A and Mena.
  experiment_type: genetic knockout with ultrastructural analysis
- hypothesis: Tes LIM3 limits Mena activity at focal adhesions in rat cells.
  description: Express LIM3 point mutants that abolish Mena EVH1 binding in Tes-null rat fibroblasts and measure
    Mena localisation, lamellipodial dynamics and migration.
  experiment_type: structure-guided mutagenesis with live imaging
