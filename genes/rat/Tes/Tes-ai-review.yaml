  review:
    summary: Cytoplasmic localisation inherited across the prickle/espinas/testin (PET-LIM) family.
    action: KEEP_AS_NON_CORE
    reason: PAINT placed cytoplasm at the family node with fly, frog, mouse and human Tes donors; rat Tes is a canonical
      member of that clade and nothing suggests loss. Tes is a soluble LIM-domain scaffold with no transmembrane
      segment or signal peptide; it distributes between a diffuse cytoplasmic pool, actin stress fibres and focal
      adhesions, and in round spermatids the subacrosomal layer. Cytoplasm is the umbrella location that covers
      this whole distribution; the specific site of action (focal adhesion) is captured by its own rows, so this
