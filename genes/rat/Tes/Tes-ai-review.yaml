  label: Rattus norvegicus
description: 'Tes (testin) is a cytoplasmic LIM-domain scaffold protein of the prickle/espinas/testin family, with
  an N-terminal PET domain and three C-terminal zinc-binding LIM domains. Its LIM domains bind cytoskeletal and
  focal adhesion proteins: LIM1 binds zyxin, which recruits Tes to focal adhesions; LIM3 binds the EVH1 domain of
  Mena (but not VASP or EVL), competing with FPPPP ligands and modulating Mena-dependent cell migration; and LIM2-3
  binds the N-terminal extension of the testis actin-related protein Arp7A (ACTL7A). The N- and C-terminal halves
  associate in a closed conformation that masks partner binding. Tes localises to focal adhesions, actin stress
  fibres and cell-cell contacts, contributes to stress-fibre organisation and cell spreading, and in rat testis
  forms an Arp7A-Tes-Mena complex in the subacrosomal layer (acroplaxome) of round spermatids. Forced expression
  suppresses tumour-cell growth, and TES is a candidate tumour suppressor frequently silenced by promoter methylation.'
