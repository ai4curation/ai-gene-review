    summary: MTMR12 is cytoplasmic, as shown for tagged human 3-PAP in COS-7 cells, where it also draws
      MTM1 into the cytoplasm, and in muscle it sits with MTM1 at triads overlapping the sarcoplasmic
      reticulum marker RyR1. The rat gene already carries GO:0016529 sarcoplasmic reticulum, accepted in
      the gene review, and cytoplasm is an ancestor of that term (OLS4), so the prediction is correct but
      less precise than an existing supported annotation. The selected product differs from the canonical
      rat product only in its first 40 residues, so the gene-level localization applies to it; the
      computational signal peptide on that alternative N-terminus does not establish secretion.
