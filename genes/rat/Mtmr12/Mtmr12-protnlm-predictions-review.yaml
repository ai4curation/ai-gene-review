id: A0A8I5ZMD5
gene_symbol: Mtmr12
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
status: COMPLETE
description: MTMR12 is a catalytically inactive myotubularin-family protein that binds and stabilizes
  MTM1 in the cytoplasm and localizes with it at skeletal-muscle triads. The selected product is an
  alternative gene model that differs from the canonical rat product only in its first 40 residues and
  keeps the whole pseudophosphatase domain. The single ProtNLM2 prediction, cytoplasm, is correct but
  less precise than the sarcoplasmic reticulum annotation the gene already carries.
