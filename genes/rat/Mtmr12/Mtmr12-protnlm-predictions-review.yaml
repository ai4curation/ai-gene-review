- id: PMID:23818870
  title: Loss of catalytically inactive lipid phosphatase myotubularin-related protein 12 impairs myotubularin
    stability and promotes centronuclear myopathy in zebrafish.
  findings:
  - statement: Cell and animal experiments distinguish inactive MTMR12 from its catalytically active MTM1
      partner and support a protein-stability mechanism.
    supporting_text: MTMR12 primarily regulates the function of myotubularin protein by affecting protein
      levels instead of modulating the enzymatic activity
  - statement: Partial compensation in zebrafish supports noncatalytic MTMR12 function, not intrinsic
      phosphoinositide phosphatase activity.
    supporting_text: the catalytically inactive MTMR12 only partially but significantly rescues myotubularin
      function
  full_text_unavailable: false
