core_functions:
- description: >-
    Catalytically inactive myotubularin-family partner that binds the active lipid phosphatase
    MTM1 (myotubularin), keeps it in the cytoplasm and maintains its protein abundance, supporting
    triad and myofibre maintenance in skeletal muscle. Evidence is from human cells, mouse muscle
    and cells, and zebrafish, transferred within PANTHER subfamily PTHR10807:SF37. The rat product
    keeps the whole pseudophosphatase domain and C-terminal region of the canonical protein, so the
    transfer covers it, but its own MTM1 binding has not been tested.
  supported_by:
  - reference_id: PMID:23818870
    supporting_text: binds to myotubularin in skeletal muscle
  - reference_id: PMID:23818870
    supporting_text: MTMR12 primarily regulates the function of myotubularin protein by affecting protein
      levels instead of modulating the enzymatic activity
  - reference_id: PMID:12847286
    supporting_text: coexpression of 3-PAP with myotubularin led to attenuation of the plasma membrane
      phenotype, associated with myotubularin relocalization to the cytosol
  - reference_id: file:rat/Mtmr12/Mtmr12-bioinformatics/RESULTS-rereview.md
    supporting_text: the catalytic cysteine and arginine are absent in every MTMR12 product
