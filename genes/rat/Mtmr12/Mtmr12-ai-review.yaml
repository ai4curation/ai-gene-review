suggested_questions:
- question: Is the alternative first exon that gives A0A8I5ZMD5 its 40-residue N-terminus transcribed
    and translated in rat tissue, or is it an Ensembl gene-model artifact relative to the cDNA-supported
    Q5FVM6 product?
- question: Should MTMR12's noncatalytic stabilization of MTM1 be captured by a regulator MF term (for
    example a phosphatase-stabilizing activity), given that the evidence argues against an effect on
    MTM1 catalytic activity and so against GO:0019211 phosphatase activator activity?
suggested_experiments:
- description: RT-PCR or long-read RNA-seq of rat skeletal muscle across the Mtmr12 5' region to test
    whether the alternative first exon is used, followed by co-immunoprecipitation of the encoded product
    with MTM1.
