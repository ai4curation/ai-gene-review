  review:
    action: UNDECIDED
    summary: Muscle-membrane localization of MTMR12 is consistent with its MTM1-associated maintenance
      function, but the selected product has an alternative N-terminus with a predicted secretory signal.
      The domain is intact; neither absence nor preservation of normal cytoplasmic-side sarcoplasmic-reticulum
      targeting has been demonstrated for this product.
