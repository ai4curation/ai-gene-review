- id: PMID:12847286
  title: Identification of myotubularin as the lipid phosphatase catalytic subunit associated with the
    3-phosphatase adapter protein, 3-PAP.
  findings:
  - statement: Human 3-PAP (MTMR12) is catalytically inactive, coprecipitates myotubularin and relocates
      it from the plasma membrane to the cytosol.
    supporting_text: coexpression of 3-PAP with myotubularin led to attenuation of the plasma membrane
