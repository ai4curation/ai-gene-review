  label: Rattus norvegicus
description: MTMR12 is a catalytically inactive myotubularin-family protein that binds and stabilizes
  the active lipid phosphatase MTM1. This interaction supports skeletal-muscle membrane organization and
  maintenance. Rat A0A8I5ZMD5 retains the complete reference myotubularin domain but has a different N-terminal
  segment, leaving its trafficking and participation in the cytoplasmic MTM1 complex uncertain.
