core_functions:
- description: Catalytically inactive myotubularin-family adaptor that binds the active lipid phosphatase
    MTM1 (myotubularin) and maintains its protein abundance, supporting skeletal-muscle membrane and
    triad maintenance. Evidence is from zebrafish, mouse and human cells and muscle; this rat product
    retains the complete myotubularin domain and the C-terminal region (691/692 identical to reference
    residues 57-748) but has an alternative N-terminus, so its own MTM1 binding is inferred, not tested.
  supported_by:
