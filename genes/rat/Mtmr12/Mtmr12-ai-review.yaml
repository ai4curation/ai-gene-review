- id: PMID:23818870
  title: Loss of catalytically inactive lipid phosphatase myotubularin-related protein 12 impairs myotubularin
    stability and promotes centronuclear myopathy in zebrafish.
  findings:
  - statement: MTMR12 binds MTM1 directly (GST pull-down) and in mouse skeletal muscle (co-IP), and
      colocalizes with it at triads.
    supporting_text: a combination of GST pull down, co-immunoprecipitation and co-localization studies
  - statement: Inactive MTMR12 acts mainly by maintaining MTM1 protein levels rather than by modulating
      its enzymatic activity.
    supporting_text: MTMR12 primarily regulates the function of myotubularin protein by affecting protein
      levels instead of modulating the enzymatic activity
  - statement: Partial compensation in zebrafish supports a noncatalytic MTMR12 function.
    supporting_text: the catalytically inactive MTMR12 only partially but significantly rescues myotubularin
      function
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; quotes checked against it. Experiments are in zebrafish, mouse C2C12
      cells and mouse muscle, and human patient myotubes, not in rat.
- id: PMID:12847286
  title: Identification of myotubularin as the lipid phosphatase catalytic subunit associated with the
    3-phosphatase adapter protein, 3-PAP.
  findings:
  - statement: Human 3-PAP (MTMR12) is a catalytically inactive myotubularin-family protein that coprecipitates
      PI3P 3-phosphatase activity; the catalytic subunit is myotubularin (MTM1).
    supporting_text: We have now identified myotubularin as the catalytically active 3-phosphatase subunit
      interacting with 3-PAP.
  - statement: 3-PAP coexpression relocalizes MTM1 from the plasma membrane to the cytosol, acting as an
      adapter.
    supporting_text: 3-PAP functions as an "adapter" for myotubularin
  full_text_unavailable: false
