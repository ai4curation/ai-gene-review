core_functions:
- description: Catalytically inactive myotubularin-family adapter that binds the active lipid phosphatase
    MTM1 and maintains its protein abundance and subcellular distribution. This activity supports
    skeletal-muscle triad maintenance. The function is established for the zebrafish, mouse and human
    proteins and transferred by orthology (PTHR10807:SF37). The CX5R catalytic cysteine and arginine
    positions are replaced in the rat protein (E376, L382), consistent with no intrinsic phosphatase
    activity.
  supported_by:
  - reference_id: PMID:23818870
    supporting_text: binds to myotubularin in skeletal muscle
  - reference_id: PMID:23818870
    supporting_text: MTMR12 primarily regulates the function of myotubularin protein by affecting protein
      levels instead of modulating the enzymatic activity
  - reference_id: PMID:12847286
    supporting_text: 3-PAP functions as an "adapter" for myotubularin
