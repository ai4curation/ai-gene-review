suggested_questions:
- question: Is the alternative 40-residue N-terminal exon of the Ensembl model behind A0A8I5ZMD5 supported
    by any rat transcript, or is the conserved N-terminus of Q5FVM6 the only expressed form?
- question: Does MTMR12 change MTM1 substrate preference or catalytic rate in addition to stabilizing it,
    as MTMR9 does for MTMR6?
suggested_experiments:
- description: Long-read or 5' RACE profiling of rat skeletal-muscle Mtmr12 transcripts to test whether
    the alternative first exon encoding the non-conserved N-terminus of A0A8I5ZMD5 is used.
  experiment_type: transcript structure analysis
