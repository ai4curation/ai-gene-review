  label: Rattus norvegicus
description: MTMR12 is a catalytically inactive myotubularin-family protein that binds and stabilizes
  the active lipid phosphatase MTM1. This interaction supports skeletal-muscle membrane organization and
  maintenance. Rat A0A8I5ZMD5 retains the complete reference myotubularin domain but has a different N-terminal
  segment, leaving its trafficking and participation in the cytoplasmic MTM1 complex uncertain.
existing_annotations:
- term:
    id: GO:0016529
    label: sarcoplasmic reticulum
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0239
  review:
    action: UNDECIDED
    summary: Muscle-membrane localization of MTMR12 is consistent with its MTM1-associated maintenance
      function, but the selected product has an alternative N-terminus with a predicted secretory signal.
      The domain is intact; neither absence nor preservation of normal cytoplasmic-side sarcoplasmic-reticulum
      targeting has been demonstrated for this product.
    reason: Gene-level sarcoplasmic-reticulum/triad localization is well supported (mouse MTMR12 carries
      an EXP annotation to this term from PMID:23818870, and the MTM1-MTMR12 complex localizes to triads
      in mouse muscle). The open question is only whether this alternative-N-terminus rat product, which
      carries a predicted signal peptide, is targeted the same way; that cannot be settled from the
      available data, so the row stays UNDECIDED rather than REMOVE.
    supported_by:
    - &id001
      reference_id: PMID:23818870
      supporting_text: MTMR12 primarily regulates the function of myotubularin protein by affecting protein
        levels instead of modulating the enzymatic activity
