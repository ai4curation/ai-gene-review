id: A0A8I5ZMD5
gene_symbol: Mtmr12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  MTMR12 (also called 3-phosphatase adapter protein, 3-PAP) is a catalytically inactive member of
  the myotubularin family of phosphoinositide 3-phosphatases. It carries a PH-GRAM-like region and a
  myotubularin phosphatase-like domain in which the catalytic cysteine and arginine of the CX5R loop
  are replaced, followed by a coiled-coil-containing C-terminal region. MTMR12 forms a heteromeric
  complex with the active phosphatase MTM1 (myotubularin) and also associates with MTMR2. Within the
  complex it acts as an adapter that maintains MTM1 protein levels and influences MTM1 subcellular
  distribution, shifting it from the plasma membrane to the cytosol in cultured cells. In skeletal
  muscle MTMR12 colocalizes with MTM1 at triads, partially overlapping ryanodine receptor-positive
  sarcoplasmic reticulum. Loss of MTMR12 lowers MTM1 abundance and produces a myotubular myopathy-like
  muscle pathology in zebrafish. This rat entry (A0A8I5ZMD5) is a 732-residue Ensembl gene-model
  product whose first 40 residues differ from the conserved N-terminus of the reviewed rat and human
  proteins; the remainder, including the whole phosphatase-like domain, is identical to the reviewed rat
  protein.
existing_annotations:
- term:
    id: GO:0016529
    label: sarcoplasmic reticulum
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0239
  review:
    action: ACCEPT
    summary: MTMR12 colocalizes with MTM1 at skeletal-muscle triads and partially overlaps the
      sarcoplasmic-reticulum marker RyR1 in mouse muscle. This rat product is the same gene, sits in the
      same PANTHER subfamily (PTHR10807:SF37) as the characterized mouse and human proteins, and is
      identical to the reviewed rat protein over residues 41-732.
    reason: The localization is experimentally established for the mouse ortholog (PMID:23818870, the
      source of the mouse sarcoplasmic-reticulum annotation), and orthology within PTHR10807:SF37 justifies
      transfer. The previous review left this UNDECIDED because of a SignalP call on residues 1-20. That
      call falls in a 40-residue N-terminal segment that is not found in the reviewed rat (Q5FVM6) or
      human (Q9C0I1) proteins, which share a different, conserved N-terminus. The segment is therefore
      most likely an artefact of this Ensembl gene model and not evidence for secretory targeting. A
      computational signal peptide on a non-conserved exon does not outweigh orthologous experimental
      localization. The association is peripheral and cytoplasmic-side, via MTM1, so this is an
      approximate rather than an exact description of the site.
    supported_by:
    - reference_id: PMID:23818870
      supporting_text: partial co-localization of MTMR12 was observed with ryanodine receptors, a sarcoplasmic
        reticulum marker
    - reference_id: file:rat/Mtmr12/Mtmr12-bioinformatics/RESULTS.md
      supporting_text: '| 57–748 | 41–732 | 691 |'
    - reference_id: file:rat/Mtmr12/Mtmr12-bioinformatics/RESULTS.md
      supporting_text: '| Myotubularin phosphatase | 206–644 | 439 | 439 |'
- term:
    id: GO:0030017
    label: sarcomere
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0313
  review:
    action: KEEP_AS_NON_CORE
    summary: In mouse skeletal muscle MTMR12 shows a striated distribution with MTM1 at triads, which recur
      within each sarcomere. The same study found no overlap with alpha-actinin at Z-lines. Sarcomere
      therefore describes where the protein is in the muscle fibre only loosely. The more exact site is the
      triad and sarcoplasmic reticulum, which the GO:0016529 row already covers.
    reason: UniProt's curated ortholog record also places the protein in the sarcomere ("co-localizes
      with MTM1 in the sarcomere", by similarity to mouse). The claim is not wrong at the level of
      tissue-scale position, so REMOVE is not warranted. MTMR12 is not a component of the contractile
      myofibrillar lattice, however, so the term is kept as a non-core localization. Sarcomere is a
      different branch from sarcoplasmic reticulum, not an ancestor of it, so MODIFY does not apply.
    supported_by:
    - reference_id: PMID:23818870
      supporting_text: The expression of MTMR12 was restricted to triads as no co-localization was observed
        with α-actinin at Z-lines
    - reference_id: PMID:23818870
      supporting_text: The interaction between myotubularin and MTMR12 in skeletal muscle and co-localization
        at the triad
