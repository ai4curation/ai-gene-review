  label: Rattus norvegicus
description: >-
  Myotubularin-related protein 12 (MTMR12, also called 3-phosphatase adapter protein, 3-PAP) is a
  catalytically inactive member of the myotubularin family. Its myotubularin-like phosphatase fold
  lacks the catalytic cysteine and arginine of the CX5R motif, so it has no intrinsic
  phosphoinositide 3-phosphatase activity. It acts as a noncatalytic partner of the active lipid
  phosphatase MTM1 (myotubularin), binding it directly, holding it in the cytoplasm and maintaining
  its protein abundance; it also associates with MTMR2. In skeletal muscle the MTM1-MTMR12 complex
  sits at triads, where the sarcoplasmic reticulum meets the T-tubules, and loss of MTMR12
  destabilizes MTM1 and disorganizes triads and myofibres. The rat UniProt entry A0A8I5ZMD5 is an
  Ensembl alternative gene model of Mtmr12 whose first 40 residues replace the conserved canonical
  N-terminus (residues 1-56 of Q5FVM6); the rest of the protein, including the whole pseudophosphatase
  domain, is identical to the canonical rat product.
existing_annotations:
- term:
    id: GO:0016529
    label: sarcoplasmic reticulum
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0239
  review:
    summary: >-
      MTMR12 localizes with MTM1 at skeletal-muscle triads and partly overlaps the
      sarcoplasmic-reticulum marker RyR1 in mouse muscle (the basis of the mouse EXP annotation
      to this term). The localization is a gene-level property of the MTM1-MTMR12 complex.
    action: ACCEPT
    reason: >-
      The claim is about the Mtmr12 gene product and is directly supported in mouse muscle
      (PMID:23818870), an ortholog in the same PANTHER subfamily (PTHR10807:SF37). The mouse
      ortholog carries an EXP annotation to this term from that paper, and the canonical rat
      product Q5FVM6 receives it by ISO. The earlier UNDECIDED rested on the predicted signal
      peptide of this product's alternative N-terminus. That segment is absent from the
      cDNA-supported rat, mouse and human products (RESULTS-rereview.md) and is most likely a
      gene-model feature; even if it were translated and used, ER/SR import would not move the
      protein out of the sarcoplasmic reticulum. ACCEPT, with the triad localization being the
      functionally relevant location.
    supported_by:
    - reference_id: PMID:23818870
      supporting_text: co-localization of MTMR12 was observed with ryanodine receptors, a sarcoplasmic
        reticulum marker
    - reference_id: PMID:23818870
      supporting_text: The expression of MTMR12 was restricted to triads as no co-localization was observed
        with α-actinin at Z-lines
    - reference_id: file:rat/Mtmr12/Mtmr12-bioinformatics/RESULTS-rereview.md
      supporting_text: A0A8I5ZMD5 residues 41-732 align to Q5FVM6 residues 57-748 with 691 identical
        residues (691/692).
- term:
    id: GO:0030017
    label: sarcomere
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0313
  review:
    summary: >-
      MTMR12 shows a striated pattern in muscle, but the primary report places it at triads and
      explicitly not at alpha-actinin-positive Z-lines. GO sarcomere is defined by the array of
      thick and thin filaments between Z discs, which is not where MTMR12 was found.
    action: MODIFY
    reason: >-
      The SubCell mapping turns a striated triad pattern into sarcomere. The experimental
      basis (mouse tibialis anterior, PMID:23818870) says MTMR12 is restricted to triads; mouse
      MGI curators annotated sarcoplasmic reticulum from this paper, not sarcomere. The correct
      lateral replacement is GO:0030314 junctional membrane complex (the triad: the junction of
      SR and T-tubule membranes). This is a lateral correction rather than a refinement, because
      the junctional membrane complex is not part of the sarcomere in GO. Confocal co-staining is
      the only evidence, so the location is gene-level and orthology-based for the rat product.
    proposed_replacement_terms:
    - id: GO:0030314
      label: junctional membrane complex
    supported_by:
    - reference_id: PMID:23818870
      supporting_text: The expression of MTMR12 was restricted to triads as no co-localization was observed
        with α-actinin at Z-lines
    - reference_id: PMID:23818870
      supporting_text: colocalize at the resolution of confocal microscopy (Figure 1D)
