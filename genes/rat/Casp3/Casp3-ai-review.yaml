- term:
    id: GO:0016005
    label: phospholipase A2 activator activity
  evidence_type: IMP
  original_reference_id: PMID:12492473
  review:
    summary: IMP based on Ac-DEVD-CMK inhibition placing caspase-3 upstream of ceramide-induced activation
      of a plasmalogen-selective phospholipase A2 in brain.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The experiment is inhibitor-based epistasis: it orders caspase-3 upstream of PLA2 activation
      but does not show caspase-3 binding or directly activating a phospholipase A2. A dedicated ''phospholipase
      A2 activator activity'' molecular function overstates this; any real effect would most plausibly
      be indirect or via substrate cleavage, already covered by the proteolysis annotations.'
    supported_by:
    - reference_id: PMID:12492473
      supporting_text: experiments with Ac-DEVD-CMK (caspase-3 specific inhibitor) have led us to conclude
        that caspase-3 is downstream of ceramide in activating the brain plasmalogen-selective phospholipase
        A2
  qualifier: enables
