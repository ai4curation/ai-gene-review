id: P55213
gene_symbol: Casp3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Casp3 encodes rat caspase-3 (CPP32/apopain/Yama), the principal executioner caspase of apoptosis
  and a member of the peptidase C14A family. It is synthesised as an inactive cytosolic zymogen and is
  activated by initiator caspases (caspase-8 downstream of death receptors, caspase-9 downstream of the
  mitochondrial apoptosome) that cleave it at Asp175-Ser176, followed by autocatalytic prodomain removal
  at Asp28, generating the p17 and p12 subunits that assemble into the active heterotetramer. The active
  enzyme is a cysteine-type endopeptidase (EC 3.4.22.56) with an absolute requirement for aspartate at
  P1 and a preference for DEVD-like recognition motifs. Acting mainly in the cytoplasm and cytosol, and
  on nuclear substrates in dying cells, it carries out the limited, selective proteolysis that constitutes
  the execution phase of apoptosis: cleavage of PARP, of the ICAD/DFF45 inhibitor to release the nuclease
  that fragments chromosomal DNA, of cytoskeletal and repair proteins, and of downstream caspases. In
  rat, caspase-3 is induced and activated in neurons after cerebral ischaemia, seizures, excitotoxic and
  hypoxic injury, in cardiomyocytes after ischaemia/reperfusion, and in ovarian follicular and luteal
  cells, and its inhibition by Z-DEVD-FMK is protective. Beyond cell death, sublethal caspase-3 activity
  contributes to non-apoptotic processes including synapse pruning and synaptic vesicle regulation, keratinocyte
  and erythroid differentiation, and proliferation of cerebellar granule-cell precursors, and caspase-3
  cleavage of gasdermin D links apoptosis to the control of pyroptosis.'
