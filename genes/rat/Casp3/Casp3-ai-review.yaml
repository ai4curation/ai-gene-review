      stress triggers apoptosis which caspase-3 executes. 'Response to hydrogen peroxide' as an involved_in
      process for the effector caspase is an over-annotation of a stimulus context.
    supported_by:
    - reference_id: PMID:18479463
      supporting_text: leptin prevented H(2)O(2)-induced increases in caspase-3 cleavage and activity
  qualifier: involved_in
- term:
    id: GO:0043200
    label: response to amino acid
  evidence_type: IEP
  original_reference_id: PMID:18423997
  review:
    summary: IEP from glutamate infusion into rat spinal cord, where nuclei of many cells stained for
      activated caspase-3 during oligodendrocyte and neuron loss.
    action: MARK_AS_OVER_ANNOTATED
    reason: Glutamate excitotoxicity is the stimulus; caspase-3 activation is the downstream execution
      read-out. The authors themselves note that caspase-3 staining persisted for a week without corresponding
      cell loss, further weakening any direct process claim.
    supported_by:
    - reference_id: PMID:18423997
      supporting_text: The nuclei of many cells strongly and specifically stained for activated caspase-3,
        an indicator of apoptosis, in response to exposure to glutamate
  qualifier: involved_in
- term:
    id: GO:0043525
    label: positive regulation of neuron apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:18404518
  review:
    summary: 'IMP: in rat primary cortical neurons, P2X7 receptor activation by BzATP caused caspase-3
      activation and DNA fragmentation, and the caspase-3 inhibitor Z-DEVD-FMK prevented the apoptosis.'
    action: KEEP_AS_NON_CORE
    reason: Strong rat inhibitor-based evidence that caspase-3 activity is required for neuronal apoptosis,
      but this is a cell-type-restricted manifestation of the core apoptotic execution role. Kept as non-core,
      aligned with the IBA row for this term.
    supported_by:
    - reference_id: PMID:18404518
      supporting_text: Z-DEVD-FMK, a specific and irreversible cell permeable inhibitor of caspase-3,
        prevented BzATP-induced apoptosis in rPCNs
  qualifier: involved_in
- term:
    id: GO:0051384
    label: response to glucocorticoid
  evidence_type: IEP
  original_reference_id: PMID:18288275
  review:
    summary: IEP from dexamethasone treatment of rats with severe acute pancreatitis, where thymic Caspase-3
      protein expression and apoptotic index were higher in the treated group.
    action: MARK_AS_OVER_ANNOTATED
    reason: Glucocorticoid-induced thymocyte apoptosis is executed by caspase-3; the correlation of caspase-3
      protein with steroid treatment does not make caspase-3 part of a glucocorticoid-response pathway.
    supported_by:
    - reference_id: PMID:18288275
      supporting_text: The treated group in Caspase-3 protein expression of thymus significantly exceeded
        the model group at 12 hours
  qualifier: involved_in
- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    action: KEEP_AS_NON_CORE
    summary: Transferred from mouse Casp3 DNA-damage experiments. Caspase-3 genuinely executes the apoptosis
      triggered by DNA damage, a bona fide branch of the DNA damage response, so an upstream/within link
      to this process is real, and the GOA qualifier acts_upstream_of_or_within already scopes the claim
      correctly to that upstream involvement rather than to sensing or signal transduction. The earlier
      REMOVE rested only on the effector-versus-sensor directness argument, which the qualifier already
      answers. Kept as non-core because DNA damage is one of several upstream stimuli converging on the
      core executioner-caspase function rather than a distinct core Casp3 role.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: MGI:MGI:107739
        source_status: SUPPORTS_TRANSFER
        comment: mouse evidence for caspase-3 executing DNA-damage-induced apoptosis supports the upstream-scoped
          rat transfer; the link is real but peripheral to the core executioner function
        source_label: mouse Casp3
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:107739
- term:
    id: GO:0030163
    label: protein catabolic process
  evidence_type: IDA
  original_reference_id: PMID:15004018
  review:
    summary: IDA from minocycline protection of kidney epithelial cells, where caspase activity was measured
      across hypoxia, azide, cisplatin and staurosporine challenges.
    action: MODIFY
    reason: Caspase-3 acts by limited, site-specific cleavage of substrates rather than bulk protein degradation.
      Replace with proteolysis, consistent with the ISO, IEA and other IDA rows for this term.
    proposed_replacement_terms: *id002
    supported_by:
    - reference_id: PMID:15004018
      supporting_text: Minocycline protected kidney epithelial cells against apoptosis induced by hypoxia,
        azide, cisplatin, and staurosporine
  qualifier: involved_in
- term:
    id: GO:0007605
    label: sensory perception of sound
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    action: REMOVE
    summary: Transferred from mouse Casp3 as a sensory/hearing phenotype. The GOA row is qualified
      acts_upstream_of_or_within, which already concedes upstream action, so this removal does not rest
      on indirectness. It rests on propagation grounds, in that the donor evidence is a mouse organismal
      hearing-loss phenotype (hair-cell loss) too phenotype- and context-specific to transfer to rat as
      a conserved claim even in upstream-scoped form, and the rat auditory context is already better
      covered by the chinchilla-sourced response-to-auditory-stimulus row kept as non-core.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: MGI:MGI:107739
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: mouse hearing-loss phenotype arises from cochlear hair-cell loss in the knockout, a
          mouse-specific organismal phenotype context that does not transfer to rat as a conserved process
          assignment; the rat auditory context is already covered by the chinchilla-sourced response-to-auditory-stimulus
          row kept as non-core
        source_label: mouse Casp3
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:107739
