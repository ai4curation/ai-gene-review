  review:
    summary: 'IEP: active caspase-3 is expressed in proliferating (Ki67+) and differentiating (TUJ1+)
      cells of the postnatal rat cerebellar external granule cell layer in the explicit absence of apoptotic
      hallmarks (no chromatin condensation, no PS externalisation, no TUNEL).'
    action: KEEP_AS_NON_CORE
    reason: 'One of the better non-apoptotic caspase-3 datasets in rat: it argues for a role in EGL proliferation/differentiation
      rather than death. Still a specialised, secondary function supported by expression data, so kept
      as non-core and aligned with the IBA row for this term.'
