    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: PAINT places cytoplasmic activity at a deep caspase-family node seeded by experimentally
      characterised caspases across insects, nematodes, fish and mammals (including rat Casp3 itself,
      RGD:2275). Effector caspases are synthesised as soluble cytoplasmic zymogens and act on cytoplasmic
      substrates.
    action: ACCEPT
    reason: 'The node placement is sound: caspase zymogen storage and activation in the cytoplasm is ancestral
      to the whole family, and rat Casp3 sits squarely inside the clade. Rat Casp3 also has its own IDA
      support for cytoplasmic localization (PMID:21630211), so its appearance in the WITH/FROM list is
      the expected marker of descendant experimental grounding rather than circularity.'
