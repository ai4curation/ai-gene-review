description: >-
  ProTrek sequence-to-text retrieval for rat caspase-3. The model identifies the enzyme and its stage
  of the apoptotic cascade correctly - rank 4 is an exact GOA match to execution phase of apoptosis,
  this review's core process - but its two most confident molecular-function calls, at ranks 1 and
  5, both resolve to obsoleted GO terms. The free-text channel's top hit is the non-apoptotic keratinocyte-differentiation
  role, which is a real but secondary caspase-3 function. Assessment: 1 correct not novel (CNN), 2
  uncertain (UNC).
