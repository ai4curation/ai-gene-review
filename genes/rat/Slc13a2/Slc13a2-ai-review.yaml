    supporting_text: Characterization of a rat Na+-dicarboxylate cotransporter.
    reference_section_type: TITLE
- id: file:rat/Slc13a2/Slc13a2-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: rat Slc13a2 / NaDC1 (UniProt
    P70545) functional annotation'
  findings:
  - statement: Identity and core molecular function confirmed as an apical Na+-coupled
      dicarboxylate/citrate cotransporter (NaDC1) in kidney and intestine, matching
      UniProt P70545.
    supporting_text: The provided UniProt accession **P70545** corresponds to **Slc13a2**
      in **Rattus norvegicus** and encodes **solute carrier family 13 member 2**,
      commonly termed **NaDC1 / NADC‑1 / SDCT1**, an apical **Na+-coupled dicarboxylate
      (incl. citrate) cotransporter** in kidney and intestine.
    reference_section_type: OTHER
  - statement: NaDC1 is an electrogenic Na+-coupled symporter with a commonly cited
      3 Na+:1 anion coupling ratio, supporting the sodium:dicarboxylate symporter
      molecular function.
    supporting_text: NaDC1 is described as a **Na+-coupled electrogenic symporter**.
      A review synthesis reports a **Na+:anion coupling ratio of 3:1**, consistent
      with an electrogenic uptake process.
    reference_section_type: OTHER
  - statement: Substrate preference is for divalent Krebs-cycle anions, with high
      affinity for succinate and lower affinity for citrate, supporting the substrate-specific
      transporter terms.
    supporting_text: Across mammalian NaDC1 orthologs, NaDC1 shows preference for
      **divalent Krebs-cycle anions**, with **high affinity for succinate** and generally
      **lower affinity for citrate**; recent work and reviews describe NaDC1 as mediating
      **Na+-dependent cotransport of citrate and succinate** in kidney and intestine.
    reference_section_type: OTHER
  - statement: Subcellular localization is the apical/luminal brush-border membrane
      of proximal tubule epithelial cells (and apical intestine), supporting apical
      plasma membrane as non-core localization.
    supporting_text: NaDC1 localizes to the **apical/luminal (brush-border) membrane**
      of **proximal tubule epithelial cells** and is also discussed as apical in intestine/small
      intestinal villus epithelium.
    reference_section_type: OTHER
  - statement: Rat-specific renal localization places NaDC1 in the outer stripe of
      the outer medulla and luminal membranes of the superficial cortex proximal tubule.
    supporting_text: For rat, NaDC1 is described as localizing to the **outer stripe
      of the outer medulla** and to **luminal membranes in the renal superficial cortex**,
      consistent with **proximal tubule apical/brush-border expression**.
    reference_section_type: OTHER
  - statement: Physiological role is primary apical citrate reabsorption in the proximal
      tubule, the pathway-level consequence of the transporter activity.
    supporting_text: NaDC1 is repeatedly positioned as a **primary apical entry step
      for citrate reabsorption** in proximal tubule, thereby regulating how much citrate
      remains in urine versus being reclaimed and metabolized.
    reference_section_type: OTHER
  - statement: Mechanism is elevator-type alternating access, established by 2024
      cryo-EM of human NaDC1 (SLC13A2) and applicable by orthology to the rat protein.
    supporting_text: '**Mechanistic paradigm (2024): elevator transport.** High-resolution
      cryo-EM of human NaDC1 (SLC13A2) supports an **elevator-type alternating-access
      mechanism**, with a relatively stable scaffold/dimerization region and a mobile
      transport/core domain; protomers within the dimer can occupy different conformations,
      implying semi-independent transport cycles.'
    reference_section_type: OTHER
core_functions:
- description: Slc13a2 is an apical sodium:dicarboxylate symporter for succinate,
    citrate, fumarate, and alpha-ketoglutarate.
  supported_by:
  - reference_id: UniProtKB:P70545
    supporting_text: 'FUNCTION: Low-affinity sodium-dicarboxylate cotransporter, that mediates the entry of citric acid cycle intermediates, such as succinate, citrate, fumarate and alpha-ketoglutarate (2-oxoglutarate) into the small intestine and renal proximal tubule'
  - reference_id: file:rat/Slc13a2/Slc13a2-deep-research-falcon.md
    supporting_text: Across mammalian NaDC1 orthologs, NaDC1 shows preference for
      **divalent Krebs-cycle anions**, with **high affinity for succinate** and generally
      **lower affinity for citrate**; recent work and reviews describe NaDC1 as mediating
      **Na+-dependent cotransport of citrate and succinate** in kidney and intestine.
    reference_section_type: OTHER
  molecular_function:
    id: GO:0017153
    label: sodium:dicarboxylate symporter activity
