  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: cellular response to lithium ion is marked as over-annotated for Slc13a2;
      the evidence supports the gene's core activity or context, not this broader
      process claim (IBA, GO_REF:0000033).
