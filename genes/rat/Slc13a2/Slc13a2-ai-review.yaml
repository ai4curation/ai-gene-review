id: P70545
gene_symbol: Slc13a2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Slc13a2 encodes NaDC1 (SDCT1), the low-affinity sodium-coupled dicarboxylate
  cotransporter of the SLC13/DASS family. A multi-pass protein of the apical (brush-border)
  membrane of renal proximal tubule S2/S3 segments and of small- and large-intestinal
  enterocytes, it mediates electrogenic uptake of citric acid cycle intermediates such
  as succinate, alpha-ketoglutarate, fumarate and citrate (the latter as the divalent
  protonated form) with a stoichiometry of three Na+ per divalent anion. In the kidney
  it reabsorbs filtered citrate and succinate, thereby influencing urinary citrate
  and kidney stone risk. Li+ inhibits transport by competing at a cation-binding site.
