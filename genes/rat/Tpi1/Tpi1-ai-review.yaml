  evidence_type: IPI
  original_reference_id: PMID:16170200
  review:
    summary: Generic protein binding (IPI, PMID:16170200) recording a yeast two-hybrid
      and co-immunoprecipitation interaction between triose-phosphate isomerase and
      the C terminus of the K(ATP) channel subunit Kir6.2.
    action: REMOVE
    reason: GO:0005515 protein binding conveys no functional information. The cached
      abstract-only record identifies triose-phosphate isomerase as a Kir6.2 interactor
      in a two-hybrid screen of a rat heart library, but does not define a more specific
      molecular activity for Tpi1 in that complex (the functional channel effects shown
      were for GAPDH and pyruvate kinase substrates), so no evidence-backed replacement
      MF is proposed. Removal of the generic term does not mean the reported interaction
      is false. GOA no longer carries this row (retired).
