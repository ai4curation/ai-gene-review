  review:
    summary: ISO transfer of ubiquitin protein ligase binding from human TPI1 (UniProtKB:P60174),
      whose source annotation is an IPI with Parkin (O60260) from a tandem-affinity-purification
      proteomics screen (PMID:19725078).
    action: MARK_AS_OVER_ANNOTATED
    reason: In the source study TPI1 is one of 14 putative Parkin co-purifying proteins,
      most of them abundant energy-metabolism proteins, recovered by TAP/MS in HEK293
      cells. This does not establish a characterised, functionally meaningful E3-ligase
      binding activity for triose-phosphate isomerase, and transferring it by orthology
      to rat overstates the evidence. The donor-side human TPI1 review reaches the same
      judgment.
