- id: file:rat/Tpi1/Tpi1-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report on rat Tpi1 (UniProt P48500)
  findings:
  - statement: Falcon confirms gene identity (rat Tpi1 / P48500) and the canonical
      reaction catalyzed by triosephosphate isomerase, the reversible interconversion
      of the triose phosphates DHAP and G3P, as the primary molecular function.
    supporting_text: '**Triosephosphate isomerase 1 (TPI1)** catalyzes the **reversible
      interconversion** of the triose phosphates'
    reference_section_type: OTHER
  - statement: Falcon describes TPI as a cofactor-independent homodimeric enzyme in
      which dimerization is required for catalytic activity, supporting the homodimerization
      annotation as functionally relevant context.
    supporting_text: each monomer contributes a catalytic site but **dimerization
      is required for activity**
    reference_section_type: OTHER
  - statement: Falcon describes the catalytic mechanism (proton transfer via a cis-enediol
      intermediate with active-site loop closure), consistent with the conserved TIM
      mechanism.
    supporting_text: TIM catalysis involves a proton-transfer mechanism proceeding
      through a **cis-enediol intermediate**, with active-site loop closure helping
      protect intermediates from solvent.
    reference_section_type: OTHER
  - statement: Falcon places TPI1 as a core enzyme of glycolysis/gluconeogenesis,
      mediating the DHAP/G3P interconversion step within central carbon metabolism.
    supporting_text: TPI1 is a core enzyme in **glycolysis/gluconeogenesis**, mediating
      the DHAP/G3P interconversion step
    reference_section_type: OTHER
  - statement: Falcon confirms canonical cytosolic localization of TPI1, consistent
      with glycolysis being largely cytosolic.
    supporting_text: As a glycolytic enzyme, TPI1 is typically considered a **cytosolic
      enzyme**, consistent with glycolysis being largely cytosolic.
    reference_section_type: OTHER
  - statement: Falcon's identity check found no evidence that rat Tpi1/P48500 is a
      bona fide methylglyoxal synthase, interpreting methylglyoxal-related literature
      as dicarbonyl-stress and modification biology affecting TPI rather than a distinct
      primary enzyme function. This supports marking the methylglyoxal synthase/biosynthetic
      annotations as over-annotated.
    supporting_text: no retrieved evidence supports rat P48500 being a bona fide methylglyoxal
      synthase, so the methylglyoxal-related literature is best interpreted as modification/stress
      biology affecting TPI rather than a different primary enzyme function.
    reference_section_type: OTHER
  - statement: Falcon notes context-dependent non-canonical (moonlighting) roles,
      including regulated nuclear localization linked to Ser80 phosphorylation; these
      are conditional and mostly from non-rat systems, so they are not treated as
      core for rat Tpi1.
    supporting_text: phosphorylation at Ser80 (S80)** is discussed as influencing
      nuclear localization
    reference_section_type: OTHER
  - statement: Falcon reports proteomic evidence that glycolytic enzymes including
      TPI1 can associate with cytoskeletal/actomyosin (NMII) assemblies to support
      localized glycolysis, indicating subcellular organization beyond diffuse cytosol.
    supporting_text: glycolytic enzymes—including TPI1—can associate with cytoskeletal
      motor assemblies to support localized energetic demands
    reference_section_type: OTHER
