id: P48500
gene_symbol: Tpi1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Tpi1 encodes triose-phosphate isomerase, a highly efficient cytosolic
  glycolytic enzyme that interconverts dihydroxyacetone phosphate and D-glyceraldehyde-3-phosphate
  in glycolysis and gluconeogenesis. The enzyme is an obligate homodimer; each subunit
  carries an active site, and catalysis proceeds through a cis-enediol(ate) intermediate.
  Partial loss of the phosphate from that intermediate makes the enzyme a minor but
  non-negligible source of the reactive dicarbonyl methylglyoxal. In heart, Tpi1 has
  also been reported to associate with the Kir6.2 subunit of ATP-sensitive potassium
  channels together with other glycolytic enzymes.
