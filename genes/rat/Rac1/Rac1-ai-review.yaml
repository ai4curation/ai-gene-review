  review:
    summary: Rac1 regulates the actin cytoskeleton from the plasma membrane rather than being a cytoskeletal
      constituent.
    action: MARK_AS_OVER_ANNOTATED
    reason: Rac1 is a prenylated, membrane-anchored signalling switch whose effectors (WAVE, PAK) remodel
      cortical actin. The Rho-family PAINT node places the location at the generic cytoskeleton; for Rac1
      the supported locations are the plasma membrane, ruffles and lamellipodia.
    supported_by:
    - reference_id: file:rat/Rac1/Rac1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Inner surface of plasma membrane possibly with attachment requiring prenylation
        of the C-terminal cysteine
    - reference_id: file:rat/Rac1/Rac1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Localizes to the lamellipodium in a SH3RF1-dependent manner
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      residue_claims_not_applicable: Location-scope argument, not a residue question.
