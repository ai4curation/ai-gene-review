- term:
    id: GO:0016020
    label: membrane
  evidence_type: IDA
  original_reference_id: PMID:20696765
  qualifier: located_in
  review:
    summary: Membrane is correct but general; Rac1's membrane is the plasma membrane.
    action: MODIFY
    reason: The membrane pool of Rac1 is the inner leaflet of the plasma membrane, from which RhoGDIalpha
      extracts it. GO:0005886 plasma membrane is a descendant of GO:0016020 and the gene carries it. The
      cited paper (abstract only) studies glioma cells described in its title as human; Rac1 is identical
      in sequence, and the location is independently established.
    proposed_replacement_terms: &id006
    - id: GO:0005886
      label: plasma membrane
    supported_by:
    - reference_id: file:rat/Rac1/Rac1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Inner surface of plasma membrane possibly with attachment requiring prenylation
        of the C-terminal cysteine
    - reference_id: PMID:20696765
      supporting_text: Sema5A promotes Rac1 recruitment to RhoGDIα and reduces its membrane localization
        in a plexin-B3-dependent manner
