  review:
    summary: Regulation of neuron maturation is a downstream phenotype-level process, not a function Rac1
      performs.
    action: MARK_AS_OVER_ANNOTATED
    reason: Rac1 is required in mouse for normal regulation of neuron maturation. This is a tissue-, organ-
      or organism-level outcome of Rac1 loss in mouse (or human) studies; Rac1 contributes through its
      general cytoskeletal switch function and does not perform a step specific to this process. Rat,
      mouse and human RAC1 are identical in sequence, so the transfer itself carries no divergence risk.
