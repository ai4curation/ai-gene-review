- description: At neuronal synapses, locally activated Rac1 (via GIT1/betaPIX) signals through PAK to
    organise postsynaptic actin, shaping spines and stabilising GABAA receptor clusters.
  molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
  - id: GO:0098974
    label: postsynaptic actin cytoskeleton organization
  locations:
  - id: GO:0098982
    label: GABA-ergic synapse
  - id: GO:0045202
    label: synapse
  supported_by:
  - reference_id: PMID:25284783
    supporting_text: We find that Rac1 activity stabilizes GABAARs at inhibitory synapses while disrupting
      GIT1, Rac1 or PAK all lead to impaired inhibitory transmission.
  - reference_id: PMID:15800193
    supporting_text: We also show that Rac is locally activated in dendritic spines using fluorescence
      resonance energy transfer.
  - reference_id: file:rat/Rac1/Rac1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: In neurons, plays a crucial role in regulating GABA(A) receptor synaptic stability
      and hence GABAergic inhibitory synaptic transmission through its role in PAK1 activation and eventually
      F-actin stabilization
