suggested_questions:
- question: PMID:20696765 (Sema5A/plexin-B3) describes human glioma cells in its title and abstract, yet
    its rows (cytosol, membrane, semaphorin-plexin signalling, protein binding) are on rat Rac1. Were
    rat cells (e.g. C6) used, or should these rows be on human RAC1 (P63000)?
- question: Which human RAC1 experiments underlie the ISO transfers of negative regulation of fibroblast
    migration, positive regulation of stress fiber assembly, thioesterase binding and cytoplasmic ribonucleoprotein
    granule?
- question: How do PAK-mediated (Ser101/Ser174) and PKC-mediated (Ser34) RhoGDIalpha phosphorylation combine
    to set the relative release of Rac1 and RhoA in rat fibroblast adhesion?
suggested_experiments:
- description: Image Rac1 activity with a FRET biosensor at inhibitory versus excitatory synapses of rat
    hippocampal neurons while acutely inhibiting betaPIX or PAK, and measure GABAA receptor cluster lifetime.
  hypothesis: Local, synapse-type-specific Rac1 activation by GIT1/betaPIX controls GABAA receptor surface
    stability through PAK-dependent F-actin stabilisation.
- description: Knock out Rac1 in rat osteoclast precursors and rescue with wild-type, fast-cycling and
    effector-binding mutants to separate cytoskeletal (PAK/WAVE) from NADPH oxidase roles in ruffled-border
    formation and resorption.
  hypothesis: Ruffled-border formation and resorption require Rac1 effector signalling to actin, independent
    of its NOX role.
