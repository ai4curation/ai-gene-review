  evidence_type: IDA
  original_reference_id: PMID:20696765
  qualifier: located_in
  review:
    summary: Inactive Rac1 resides in the cytosol bound to RhoGDIalpha.
    action: ACCEPT
    reason: Cytosolic Rac1-RhoGDI complexes are the reservoir from which Rac1 is delivered to membranes;
      RhoGDIalpha sequesters Rac1 away from the membrane. The cited paper (abstract only) studies glioma
      cells described in its title as human; Rac1 is identical in sequence, and the location is independently
      established.
