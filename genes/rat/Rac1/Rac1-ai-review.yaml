      supporting_text: Interacts with the GEF proteins PREX1, RASGRF2, FARP1, FARP2, DOCK1, DOCK2 and
        DOCK7, which promote the exchange between GDP and GTP, and therefore activate it.
    - reference_id: file:rat/Rac1/Rac1-uniprot.txt
