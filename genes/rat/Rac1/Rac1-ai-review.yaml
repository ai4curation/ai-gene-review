    - reference_id: PMID:20696765
      supporting_text: Sema5A promotes Rac1 recruitment to RhoGDIα and reduces its membrane localization
        in a plexin-B3-dependent manner
    - reference_id: PMID:20472934
      supporting_text: When Ser-34 was mutated to Asp, there was significantly reduced RhoGDIα binding
        to RhoA (by around 75%) but not Rac1 or Cdc42.
