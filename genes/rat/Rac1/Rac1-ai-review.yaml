id: Q6RUV5
gene_symbol: Rac1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Rac1 is a ubiquitously expressed Rho-family small GTPase that acts as a molecular switch,
  cycling between an inactive GDP-bound form, held in the cytosol by RhoGDIalpha, and an active GTP-bound
  form anchored by its C-terminal prenyl group to the inner leaflet of the plasma membrane. Guanine nucleotide
  exchange factors (e.g. betaPIX/ARHGEF7, DOCK1, PREX1) activate it and GTPase-activating proteins such
  as ARHGAP44 terminate signalling by stimulating its intrinsic GTP hydrolysis. GTP-Rac1 binds effectors
  including PAK kinases, PKN2 and the WAVE regulatory complex to drive Arp2/3-dependent actin polymerisation
  in lamellipodia and membrane ruffles, and it is a regulatory subunit of the NADPH oxidase complex, activating
  superoxide production. Through these activities Rac1 controls cell protrusion, spreading, adhesion turnover,
  migration, phagocytic engulfment and cell polarity. In rat neurons it is activated locally in dendritic
  spines by the GIT1/PIX module and acts with PAK to shape spines and excitatory synapses and to stabilise
  GABAA receptor clusters at inhibitory synapses; in rat osteoclasts it organises the actin ring and ruffled
  border needed for bone resorption. The rat, mouse and human proteins are identical in sequence.
