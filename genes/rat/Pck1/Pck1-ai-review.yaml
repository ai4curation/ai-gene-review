- term:
    id: GO:0006114
    label: glycerol biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:4186849
  qualifier: involved_in
  review:
    summary: Glycerol biosynthetic process, IDA (BHF-UCL) citing PMID:4186849.
    action: MODIFY
    reason: 'PEPCK-C''s role in glycerol-lipid metabolism is glyceroneogenesis: PEP made by PEPCK-C is converted
      to dihydroxyacetone phosphate and then glycerol 3-phosphate, which is used to re-esterify fatty acids (PMID:11792850;
      PMID:26709450). The product is glycerol 3-phosphate, not free glycerol, so GO:0046167 glycerol-3-phosphate
      biosynthetic process is the accurate term (a lateral correction; GO:0046167 is not a descendant of GO:0006114).
      The cited 1969 purification paper is abstract-unavailable, so the assay behind this row could not be checked;
      the glyceroneogenic role itself is independently established.'
    supported_by:
    - *id006
    - &id025
      reference_id: PMID:11792850
      supporting_text: The importance of glyceroneogenesis in adipose tissue was assessed in mice by specifically
        eliminating the expression of the cytosolic form of phosphoenolpyruvate carboxykinase (PEPCK-C), an enzyme
        that plays a pivotal role in the pathway.
    - &id045
      reference_id: PMID:23052097
      supporting_text: MR not only caused the transcriptional upregulation of genes associated with fatty acid synthesis
        but also of Lpin1, Pc, Pck1 and Pdk1, genes that are associated with glyceroneogenesis.
    proposed_replacement_terms: &id026
    - id: GO:0046167
      label: glycerol-3-phosphate biosynthetic process
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      requested_change: CHECK
      asserted_value: GO:0006114
      corrected_value: GO:0046167
      corrected_label: glycerol-3-phosphate biosynthetic process
      confidence: SUSPECTED
      explanation: Rat Pck1 IDA to GO:0006114 glycerol biosynthetic process (PMID:4186849). PEPCK-C supports glyceroneogenesis,
        whose product is glycerol 3-phosphate (GO:0046167) rather than free glycerol. Please check whether PMID:4186849
        (a purification paper) supports a glycerol-biosynthesis claim, and if so consider GO:0046167.
