- term:
    id: GO:0006006
    label: glucose metabolic process
  evidence_type: IMP
  original_reference_id: PMID:18055057
  qualifier: involved_in
  review:
    summary: Glucose metabolic process, IMP from siRNA knockdown in H4IIEC3 rat hepatoma cells (PMID:18055057).
    action: MODIFY
    reason: Knockdown of PEPCK reduced glucose production by the hepatoma cells, i.e. the defect is in glucose synthesis.
      Glucose metabolic process is correct but general; gluconeogenesis (GO:0006094, an is_a child), which the gene
      already carries, is the specific process.
    supported_by:
    - &id014
      reference_id: PMID:18055057
      supporting_text: the knockdown of PEPCK, which is the rate-limiting enzyme for gluconeogenesis, led to a reduction
        in glucose production in rat hepatoma H4IIEC3 cells.
    proposed_replacement_terms: &id016
    - &id047
      id: GO:0006094
      label: gluconeogenesis
