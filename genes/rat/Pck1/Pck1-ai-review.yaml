  review:
    summary: Magnesium ion binding, transferred from human PCK1 (P35558).
    action: KEEP_AS_NON_CORE
    reason: GTP-dependent PEPCKs use Mn2+ at the active-site M1 metal and a divalent cation (physiologically Mg2+)
      complexed with the nucleotide at the M2 site. The human structure (PMID:11851336) shows the nucleotide pocket;
      rat structures show the two-metal arrangement with Mn2+ (PMID:17685635). The nucleotide-associated Mg2+ binding
      is real but is a cofactor detail of the core GO:0004613 activity, so non-core.
    supported_by:
    - &id001
      reference_id: PMID:11851336
      supporting_text: Three phenylalanine residues form the walls of the guanine-binding pocket on the enzyme's
        surface
    - &id002
