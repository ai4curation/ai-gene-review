- term:
    id: GO:0004550
    label: nucleoside diphosphate kinase activity
  evidence_type: EXP
  original_reference_id: PMID:1383219
  qualifier: enables
  review:
    summary: Nucleoside diphosphate kinase activity (Reactome EXP, PMID:1383219), from the in vitro phosphorylation
      of carbovir diphosphate.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0004550 is ATP + NDP = ADP + NTP. The row comes from the Reactome reaction R-RNO-2162084, in which
      rat PCK1 converts the antiviral nucleoside analogue carbovir diphosphate to the triphosphate in vitro. The
      cached abstract names other kinases but not PEPCK, and the full text could not be read. The physiological
      reverse reaction of PEPCK transfers a phosphoryl group from PEP to GDP (PEP + CO2 + GDP -> OAA + GTP), so
      phosphorylation of a GDP analogue by PEPCK is most likely its own carboxykinase chemistry acting on an unnatural
      nucleotide rather than an ATP-dependent NDP kinase. Even taken at face value it is a xenobiotic, in vitro
      side activity. Not REMOVE because the experiment itself cannot be inspected.
    supported_by:
    - reference_id: Reactome:R-RNO-2162084
      supporting_text: Cytosolic PCK1 (phosphoenolpyruvate carboxykinase 1) catalyzes the reaction of carbovir diphosphate
        and ATP to form carbovir triphosphate and ADP.
    - reference_id: PMID:1383219
      supporting_text: Pyruvate kinase, phosphoglycerate kinase, and creatine kinase phosphorylated both enantiomers
        of carbovir diphosphate at similar rates.
    - &id015
      reference_id: file:rat/Pck1/Pck1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Cytosolic phosphoenolpyruvate carboxykinase that catalyzes the reversible decarboxylation
        and phosphorylation of oxaloacetate (OAA) and acts as the rate-limiting enzyme in gluconeogenesis
    source_defects:
    - defect_type: WRONG_TERM
      resource: REACTOME
      requested_change: CHECK
      asserted_value: GO:0004550
      corrected_value: GO:0004613
      corrected_label: phosphoenolpyruvate carboxykinase (GTP) activity
      confidence: SUSPECTED
      explanation: Reactome R-RNO-2162084 (carbovir diphosphate + ATP => carbovir triphosphate + ADP, PMID:1383219)
        is mapped to GO:0004550 NDP kinase activity for rat PCK1. PEPCK phosphorylates GDP using PEP in its reverse
        reaction, so the measured phosphorylation of a GDP analogue may reflect PEPCK activity with PEP as donor
        rather than ATP-dependent NDP kinase activity. Please check the phosphoryl donor used in PMID:1383219 and
        whether an MF annotation for a xenobiotic substrate is warranted.
