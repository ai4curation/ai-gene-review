- term:
    id: GO:0046889
    label: positive regulation of lipid biosynthetic process
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P35558
  review:
    summary: Positive regulation of lipid biosynthetic process, ISO from human PCK1 (PMID:32322062).
    action: KEEP_AS_NON_CORE
    reason: 'All rat rows for the GTP-dependent protein kinase function (GO:0106264, GO:0018105, the ER location
      and the lipid-biosynthesis regulation terms) are transfers of one human study, PMID:32322062: in human hepatocellular
      carcinoma cells AKT phosphorylates PCK1 at Ser90, and PCK1 then moves to the ER and uses GTP to phosphorylate
      INSIG1 Ser207 and INSIG2 Ser151, releasing SCAP-SREBP. Ser90 is conserved in rat Pck1 (UniProt records the
      S90 mutagenesis in PMID:30193097), so the transfer is plausible, but no rat experiment on Pck1 protein kinase
      activity or INSIG phosphorylation exists and the human finding has not been reproduced in a normal gluconeogenic
      tissue. The term is kept as non-core: it describes a context-dependent moonlighting activity, not the enzyme''s
      metabolic role. Phosphorylation of INSIG1/2 by PCK1 releases SCAP-SREBP and promotes lipogenic gene expression,
      which is the positive regulation this term names.'
    supported_by:
    - &id036
      reference_id: PMID:32322062
      supporting_text: disrupts the interaction between INSIG proteins and SCAP, leading to the translocation of
        the SCAP-SREBP complex to the Golgi apparatus, the activation of SREBP proteins (SREBP1 or SREBP2) and the
        transcription of downstream lipogenesis-related genes
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      residue_claims_not_applicable: Not a residue-level question; the issue is the scope of the transferred term.
