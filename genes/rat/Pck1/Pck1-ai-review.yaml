id: P07379
gene_symbol: Pck1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Pck1 encodes cytosolic phosphoenolpyruvate carboxykinase [GTP] (PEPCK-C), a monomeric, Mn2+-dependent
  enzyme that converts oxaloacetate and GTP to phosphoenolpyruvate, GDP and CO2. This is the committed step that
  withdraws carbon from the tricarboxylic acid cycle (cataplerosis) for glucose synthesis in liver and kidney cortex,
  and for glyceroneogenesis (glycerol 3-phosphate for triglyceride re-esterification) in adipose tissue. Rat PEPCK-C
  is the principal structural and kinetic model of the GTP-dependent PEPCKs, with crystal structures showing in-line
  phosphoryl transfer and lid-gated active-site loops. The reaction is reversible: acetylation of Lys91 under high
  glucose favours the anaplerotic carboxylation of phosphoenolpyruvate, and SIRT1 deacetylation restores the gluconeogenic
  direction. Pck1 transcription is induced by glucagon/cAMP and glucocorticoids and repressed by insulin. It is
  distinct from the mitochondrial isozyme encoded by Pck2. In human cancer cells, AKT-phosphorylated PCK1 has been
  reported to act as a GTP-dependent protein kinase on INSIG1/2 at the endoplasmic reticulum, a function not yet
  examined in rat.'
