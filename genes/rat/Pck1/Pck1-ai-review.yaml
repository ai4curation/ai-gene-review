    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1860456
  - PANTHER:PTN000169230
  - UniProtKB:Q16822
  review:
    summary: Mitochondrion, IBA from PANTHER node PTN000169230.
    action: REMOVE
    reason: 'Vertebrates have two PEPCK-GTP isozymes: cytosolic Pck1 and mitochondrial Pck2. The IBA donors (MGI:1860456
      Pck2, UniProtKB:Q16822 human PCK2) are both the mitochondrial paralog. Rat Pck1 is the cytosolic form: it
      was purified from the cytosol fraction and is immunochemically distinct from the mitochondrial enzyme (PMID:4186849),
      >90% of adult rat liver PEPCK activity is cytoplasmic (PMID:6049928), and in rat islets, which lack PEPCK-C,
      all PEPCK activity is mitochondrial PEPCK-M (PMID:19635791). The mitochondrial location belongs to the PCK2
      branch and should not propagate to PCK1. This is an over-propagated IBA argued against on biological grounds.'
    supported_by:
    - reference_id: file:rat/Pck1/Pck1-uniprot.txt
      record_section: ["CC:MISCELLANEOUS"]
      supporting_text: 'In eukaryotes there are two isozymes: a cytoplasmic one and a mitochondrial one.'
    - *id009
    - &id010
      reference_id: PMID:19635791
      supporting_text: PEPCK-M but not PEPCK-C is present in INS-1 832/13 cells, rat islets, and mouse islets.
    - reference_id: PMID:19635791
      supporting_text: Because insulin-secreting cells lack PEPCK-C
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      residue_claims_not_applicable: Compartment divergence between paralogs (mitochondrial targeting in PCK2 only),
        not a point-residue question.
      source_entities:
      - source_id: PANTHER:PTN000169230
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Location seeded only by PCK2 (mitochondrial) members; the PCK1 branch is cytosolic.
      - source_id: MGI:MGI:1860456
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse mitochondrial paralog Pck2.
        source_label: Pck2 (mouse)
      - source_id: UniProtKB:Q16822
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human mitochondrial paralog PCK2.
        source_label: PCK2 (human)
    source_defects:
    - defect_type: OTHER
      resource: GO_CENTRAL
      requested_change: DELETE_ROW
      asserted_value: GO:0005739
      confidence: PROBABLE
      explanation: IBA is_active_in GO:0005739 mitochondrion (PTN000169230) reaches rat Pck1 (P07379), the cytosolic
        PEPCK-C isozyme. The only donors are the mitochondrial paralog PCK2 (MGI:1860456, UniProtKB:Q16822). The
        mitochondrial location should be confined to the PCK2 clade (or blocked on the PCK1 clade), since rat, mouse
        and human PCK1 are cytosolic.
      supported_by:
      - *id010
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q9Z2V4
  - ensembl:ENSMUSP00000029017
  - UniProtKB-SubCell:SL-0095
  review:
    summary: Endoplasmic reticulum, IEA from human PCK1 (P35558) / mouse Pck1.
    action: KEEP_AS_NON_CORE
    reason: 'The ER location rests on human PCK1 in HCC cells, where AKT phosphorylation at Ser90 drives translocation
      of a fraction of PCK1 to the ER (PMID:32322062); UniProt carries it for rat "By similarity". The organelle
      claim is the observed one (no sub-compartment can be resolved from it). It is a conditional, signalling-dependent
      pool, not the location of the enzyme''s metabolic activity (cytosol), so it is kept as non-core. Checked source:
      human IDA (PMID:32322062).'
    supported_by:
    - &id011
      reference_id: PMID:32322062
      supporting_text: Phosphorylated PCK1 translocates to the endoplasmic reticulum, where it uses GTP as a phosphate
        donor to phosphorylate INSIG1 at Ser207 and INSIG2 at Ser151.
    - &id012
      reference_id: file:rat/Pck1/Pck1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Phosphorylation at Ser-90 promotes translocation to the endoplasmic reticulum.
