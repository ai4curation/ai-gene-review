suggested_questions:
- question: Is rat Pck1 phosphorylated at Ser90 by AKT in liver or adipose tissue, and does a Pck1 pool reach the
    ER and phosphorylate INSIG1/2 outside the cancer-cell context reported for human PCK1?
- question: Did PMID:1383219 measure carbovir diphosphate phosphorylation by PEPCK with ATP or with PEP as donor?
    If PEP, the GO:0004550 NDP kinase mapping in Reactome R-RNO-2162084 is wrong.
- question: Should the PAINT mitochondrion IBA (PTN000169230) be blocked on the PCK1 clade, given that all characterised
    PCK1 orthologs are cytosolic?
suggested_experiments:
- description: Express rat Pck1 S90A and S90D in primary rat hepatocytes and measure INSIG1/2 phosphorylation, SREBP
    processing and de novo lipogenesis under insulin stimulation, to test whether the human protein-kinase mechanism
    operates in normal rat liver.
- description: Assay purified rat PEPCK-C with carbovir diphosphate using ATP or PEP as phosphoryl donor (with and
    without CO2/HCO3-) to establish whether the analogue phosphorylation is the PEPCK reverse reaction.
