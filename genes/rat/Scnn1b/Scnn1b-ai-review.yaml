- term:
    id: GO:0002028
    label: regulation of sodium ion transport
  evidence_type: IDA
  original_reference_id: PMID:16027156
  qualifier: involved_in
  review:
    summary: Regulation of sodium ion transport (IDA). The beta-ENaC C-terminus is required for Cl(-)-dependent
      inhibition of ENaC.
    action: KEEP_AS_NON_CORE
    reason: The beta C-terminus mediates regulatory inputs (Cl-, NEDD4L, ERK, CK2) that set channel activity;
      this is a property of the channel itself rather than regulation of another transporter. Non-core.
    supported_by:
    - reference_id: PMID:16027156
      supporting_text: The results confirm a role of the carboxyl terminus of betaENaC for Cl(-)-dependent
        inhibition of the Na+ channel
    - reference_id: PMID:18308722
      supporting_text: Phosphorylation by CK2 is essential for ENaC activation, and to a lesser degree,
        it also controls membrane expression of alphabetagamma-ENaC.
