- term:
    id: GO:1904116
    label: response to vasopressin
  evidence_type: IEP
  original_reference_id: PMID:16528252
  qualifier: involved_in
  review:
    summary: Response to vasopressin (IEP). Chronic dDAVP increased the intracellular pool of beta- and
      gamma-ENaC in rat principal cells.
    action: KEEP_AS_NON_CORE
    reason: Vasopressin stimulates ENaC-mediated Na+ absorption in the collecting duct, in part by relieving
      NEDD4-2-mediated retrieval, and the term is entailed by the kept cellular response to vasopressin
      (GO:1904117) rows. The IEP row itself (PMID:16528252) records only a larger intracellular ENaC pool
      after chronic dDAVP with no increase at the cell surface, which is regulatory context, so the term
      is kept as non-core.
    supported_by:
    - reference_id: PMID:16528252
      supporting_text: dDAVP markedly increased the intracellular pool of the beta- and gamma-ENaC subunits
        in the principal cells
    - reference_id: PMID:24419567
      supporting_text: Phosphorylation of NEDD4-2 by SGK1 or 14-3-3 adaptor proteins recruited to NEDD4-2
        by vasopressin, hinders interactions between NEDD4-2 and ENaC subunits, thus prolonging the dwell
        time of ENaCs in the apical membrane.
