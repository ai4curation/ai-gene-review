      supporting_text: induced a pronounced translocation of beta-ENaC from intracellular regions toward
        the VSMC membrane
    - reference_id: PMID:11352848
      supporting_text: Immunoelectron microscopy confirmed the presence of ENaC subunits in both the apical
        plasma membrane and intracellular vesicles.
