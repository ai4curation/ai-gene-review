- term:
    id: GO:0031175
    label: neuron projection development
  evidence_type: IMP
  original_reference_id: PMID:16192303
  qualifier: involved_in
  review:
    summary: Neuron projection development. In PC12 cells, benzamil, siRNA and dominant-negative ENaC
      inhibited NGF-induced neurite formation.
    action: KEEP_AS_NON_CORE
    reason: 'Experimental (IMP) but indirect, from a single PC12 cell-line study: NGF induced beta- and
      gamma-ENaC (not alpha-ENaC), and benzamil, siRNA and dominant-negative ENaC subunits inhibited NGF-induced
      neurite formation. The mechanism is unknown and the role is peripheral to the channel''s epithelial
      physiology, so the curator''s annotation is kept as non-core rather than overruled; the cached record
      is abstract-only, so which subunits were knocked down cannot be checked.'
    supported_by:
    - reference_id: PMID:16192303
      supporting_text: We found NGF-induced expression of beta- and gamma-subunits of ENaC, but not alpha-ENaC.
    - reference_id: PMID:16192303
      supporting_text: NGF-induced neurite formation was inhibited by disruption of ENaC expression
