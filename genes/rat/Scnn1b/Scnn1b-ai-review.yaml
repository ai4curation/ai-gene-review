- term:
    id: GO:0015280
    label: ligand-gated sodium channel activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN000189658
  - RGD:3640
  - RGD:3641
  review:
    summary: Ligand-gated sodium channel activity. Scnn1b is a pore-forming subunit of ENaC, a constitutively
      open, amiloride-sensitive Na+ channel; the channel activity is real but ENaC has no physiological
      ligand gate.
    action: MODIFY
    reason: ENaC activity is set by surface abundance and open probability, tuned by proteolytic processing,
      Na+ self-inhibition and kinase/NEDD4L signalling, not by agonist binding. The ligand-gated label
      comes from family placement (the DEG/ENaC family also contains proton-gated ASICs and peptide-gated
      FaNaC) and should be replaced by the parent sodium channel activity (GO:0005272), which the gene
      already carries. A cGMP analog activating the channel from outside (PMID:20007351) is a pharmacological
      effect, not a gating ligand.
    supported_by:
    - reference_id: PMID:8107805
      supporting_text: Here we identify two other subunits (beta and gamma) by functional complementation
        of the alpha-subunit of the rat epithelial Na+ channel
    - reference_id: PMID:24419567
      supporting_text: Proteolytic processing of external domains and inhibition with increased sodium
        concentrations are important regulatory features of epithelial sodium channel complexes expressed
        in the distal nephron.
    - reference_id: PMID:9118951
      supporting_text: mutations of a conserved glycine in the N-terminus of ENaC subunits change ENaC
        channel gating
    proposed_replacement_terms: &id004
    - *id003
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      residue_claims_not_applicable: No residue-level claim is involved.
      source_entities:
      - source_id: PANTHER:PTN000189658
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Family node spans ligand-gated DEG/ENaC members (ASIC, FaNaC); the ENaC branch is constitutively
          active, so only the parent sodium channel activity transfers.
