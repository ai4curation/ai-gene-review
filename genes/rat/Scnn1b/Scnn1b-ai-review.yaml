- term:
    id: GO:0050914
    label: sensory perception of salty taste
  evidence_type: NAS
  original_reference_id: PMID:22983350
  qualifier: involved_in
  review:
    summary: Sensory perception of salty taste (NAS). ENaC is the amiloride-sensitive Na+ taste receptor
      in rodents; the cited review concerns the delta subunit.
    action: KEEP_AS_NON_CORE
    reason: 'ENaC is the amiloride-sensitive sodium taste receptor of the attractive salt-taste cells
      in mice (PMID:20107438); the cited NAS source is a delta-ENaC review that does not address taste,
      so the claim rests on the primary genetic data. Non-core relative to epithelial Na+ absorption.
      For beta-ENaC the support is indirect, unlike the alpha subunit for which a taste-cell knockout
      exists: the same study treats the receptor as the obligate alpha-beta-gamma heteromer (loss of any
      subunit abolishes ENaC function) and attributes the amiloride-insensitive back of the tongue to
      the lack of functional ENaC channels.'
    supported_by:
    - reference_id: PMID:20107438
      supporting_text: These results validate ENaC as the mammalian taste receptor responsible for behavioural
        acceptance of (and attraction to) NaCl.
    - reference_id: PMID:20107438
      supporting_text: While a knockout of any ENaC subunit is sufficient to completely abolish ENaC function
    - reference_id: PMID:20107438
      supporting_text: Therefore, amiloride-insensitivity at the back of the tongue is due to the lack
        of functional ENaC channels.
