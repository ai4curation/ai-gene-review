- term:
    id: GO:0003014
    label: renal system process
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:104696
  review:
    summary: Renal system process (ISO from mouse). Beta-ENaC-deficient mice have renal salt wasting.
    action: KEEP_AS_NON_CORE
    reason: 'Correct at the level stated: beta-ENaC-deficient mice have renal salt wasting, and the acts_upstream_of_or_within
      qualifier fits a knockout phenotype. The specific child renal sodium ion absorption (GO:0070294)
      is not proposed because no ENaC subunit in human, mouse or rat carries it while NKCC2 and NCC do,
      which is read as a convention to be checked (see suggested questions) rather than a gap; the organismal
      role is captured by sodium ion homeostasis (accepted). Kept as non-core.'
    supported_by:
    - reference_id: file:rat/Scnn1b/Scnn1b-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: It plays a key role in maintaining sodium homeostasis through electrogenic sodium
        reabsorption in the kidneys
    - reference_id: PMID:8107805
      supporting_text: The amiloride-sensitive epithelial sodium channel constitutes the rate-limiting
        step for sodium reabsorption in epithelial cells that line the distal part of the renal tubule
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      residue_claims_not_applicable: No residue-level claim is involved.
      source_entities:
      - source_id: MGI:MGI:104696
        source_status: SUPPORTS_TRANSFER
        comment: The source knockout phenotype transfers at the level of renal system process.
