- term:
    id: GO:0071548
    label: response to dexamethasone
  evidence_type: IEP
  original_reference_id: PMID:16263802
  qualifier: involved_in
  negated: true
  review:
    summary: NOT response to dexamethasone. In neonatal rat semicircular canal duct epithelium, dexamethasone
      upregulated alpha- and gamma-ENaC but not beta-ENaC.
    action: MARK_AS_OVER_ANNOTATED
    reason: Response to dexamethasone is an expression-response term that does not describe channel function
      in either polarity, so this NOT row is treated the same way as the positive and negated GO:0071548
