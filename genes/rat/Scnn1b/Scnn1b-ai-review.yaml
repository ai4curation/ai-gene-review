    label: cytosol
  evidence_type: IDA
  original_reference_id: PMID:18024548
  qualifier: located_in
  review:
    summary: Cytosol. Immunolabeling of VSMC showed beta-ENaC in intracellular regions that moved toward
      the membrane on high-salt diet.
    action: MARK_AS_OVER_ANNOTATED
    reason: Beta-ENaC is an integral multipass membrane protein (two TM helices); its intracellular pool
      is in vesicle/secretory-pathway membranes, not free in the cytosol. Light-microscopy 'intracellular'
      signal is better captured by cytoplasmic vesicle membrane.
    supported_by:
