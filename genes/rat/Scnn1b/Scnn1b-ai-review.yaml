id: P37090
gene_symbol: Scnn1b
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Scnn1b encodes the beta subunit of the amiloride-sensitive epithelial sodium channel (ENaC),
  a member of the DEG/ENaC family. Beta-ENaC has two transmembrane helices, a large cysteine-rich N-glycosylated
  extracellular domain and cytoplasmic termini; together with alpha (Scnn1a) and gamma (Scnn1g) subunits
  it forms a constitutively active, highly Na+-selective channel in the apical plasma membrane of Na+-absorbing
  epithelia (aldosterone-sensitive distal nephron, distal colon, airway and alveolar epithelium, exocrine
  ducts). ENaC carries out the rate-limiting step of transepithelial Na+ reabsorption and so sets whole-body
  Na+ balance, extracellular fluid volume, K+ secretion and blood pressure; beta-subunit loss of function
  causes pseudohypoaldosteronism type 1 and truncation of its C-terminal PY motif causes Liddle syndrome.
  The beta C-terminus is a regulatory hub: its PY motif binds the WW domains of NEDD4/NEDD4L, which ubiquitinate
  the channel and drive its retrieval, and nearby ERK and CK2 phosphorylation sites tune this interaction
  and channel activity. Beta-ENaC is also detected outside epithelia, for example in vascular smooth muscle
  and baroreceptor neurons, where its roles are less well defined.'
