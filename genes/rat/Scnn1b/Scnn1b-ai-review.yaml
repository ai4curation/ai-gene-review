- term:
    id: GO:1904044
    label: response to aldosterone
  evidence_type: IEP
  original_reference_id: PMID:16426574
  qualifier: involved_in
  review:
    summary: Response to aldosterone (IEP). Aldosterone decreased beta-ENaC mRNA in kidneys of Dahl salt-sensitive
      rats.
    action: KEEP_AS_NON_CORE
    reason: Aldosterone, acting through the mineralocorticoid receptor, SGK1 and NEDD4-2, is the principal
      hormonal regulator of ENaC, and the channel is the end-effector of aldosterone-stimulated distal
      Na+ absorption; the term is also entailed by the kept cellular response to aldosterone (GO:1904045)
      rows. The IEP rows themselves record expression changes, which are regulatory context rather than
      the channel's function, so the term is kept as non-core. Unlike the alpha and gamma subunits, whose
      rows include aldosterone-induced expression, the only beta-ENaC row (PMID:16426574) reports decreased
      beta-ENaC mRNA in salt-sensitive Dahl rats, an abnormal response; the term is kept on the strength
      of the channel's effector role, not that observation.
    supported_by:
    - reference_id: PMID:16426574
      supporting_text: Aldosterone decreased mRNA expression of beta- and gamma-ENaC in DS rat unlike
        DR rat
    - reference_id: PMID:24419567
      supporting_text: Na+ and K+ balance and regulation of blood pressure are achieved through the final
        regulation of transport in the distal nephron and the collecting duct under hormonal control (aldosterone,
        vasopressin
- term:
    id: GO:1904045
    label: cellular response to aldosterone
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:104696
  review:
    summary: Cellular response to aldosterone. ENaC is the principal effector channel of aldosterone's
      natriferic action in the distal nephron.
    action: KEEP_AS_NON_CORE
    reason: Aldosterone increases ENaC activity and abundance; the channel is the terminal effector of
      this response. Kept as non-core because the response is mostly driven by alpha-subunit induction
      and regulatory kinases (SGK1, NEDD4L), with beta-ENaC as the effector channel subunit.
    supported_by:
    - reference_id: PMID:24419567
      supporting_text: Na+ and K+ balance and regulation of blood pressure are achieved through the final
        regulation of transport in the distal nephron and the collecting duct under hormonal control (aldosterone,
        vasopressin, angiotensin, insulin, bradykinin, endothelin, etc.).
