core_functions:
- description: Pore-forming subunit of the alpha-beta-gamma epithelial sodium channel that mediates amiloride-sensitive
    Na+ entry across the apical plasma membrane of absorptive epithelia, the rate-limiting step of transepithelial
    Na+ reabsorption.
  molecular_function:
    id: GO:0005272
    label: sodium channel activity
  directly_involved_in:
  - id: GO:0098719
    label: sodium ion import across plasma membrane
  - id: GO:0055078
    label: sodium ion homeostasis
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  in_complex:
    id: GO:0034706
    label: sodium channel complex
  supported_by:
  - reference_id: PMID:8107805
    supporting_text: Here we identify two other subunits (beta and gamma) by functional complementation
      of the alpha-subunit of the rat epithelial Na+ channel
  - reference_id: PMID:8107805
    supporting_text: The amiloride-sensitive epithelial sodium channel constitutes the rate-limiting step
      for sodium reabsorption in epithelial cells that line the distal part of the renal tubule
  - reference_id: PMID:17562820
    supporting_text: Our results support a tetrameric arrangement of ENaC subunits where 2alpha, 1beta,
      and 1gamma come together around central pore.
  - reference_id: PMID:11352848
    supporting_text: Immunoelectron microscopy confirmed the presence of ENaC subunits in both the apical
      plasma membrane and intracellular vesicles.
  - reference_id: file:rat/Scnn1b/Scnn1b-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: This is one of the three pore-forming subunits of the heterotrimeric epithelial sodium
      channel (ENaC), a critical regulator of sodium balance and fluid homeostasis
suggested_questions:
- question: Should ENaC subunits continue to carry ligand-gated sodium channel activity (GO:0015280) through
    PANTHER/InterPro family propagation, given that ENaC is constitutively open and has no physiological
    gating ligand, or should the PAINT node and InterPro2GO mapping be restricted to ASIC/FaNaC/BASIC
    branches?
- question: Should renal sodium ion absorption (GO:0070294) be annotated to ENaC subunits? ENaC performs
    the apical Na+ entry step, rate-limiting for Na+ reabsorption, in the connecting tubule and collecting
    duct, and the apical transporters NKCC2 (SLC12A1) and NCC (SLC12A3) carry the term, yet no ENaC subunit
    in human, mouse or rat does. Is this absence a deliberate convention or a gap?
- question: Do beta- and gamma-ENaC participate in amiloride-sensitive salt taste in rodent fungiform
    taste cells, or is salt taste mediated by alpha-ENaC-containing channels without beta/gamma?
- question: Are the mouse Scnn1b-Tg airway overexpression phenotypes (mucus obstruction, neutrophilic
    inflammation) being propagated to orthologs as normal gene functions, and should such transgenic gain-of-function
    annotations be flagged at source?
suggested_experiments:
- description: Conditional, tissue-specific Scnn1b knockout in rat vascular smooth muscle or nodose neurons
    combined with patch clamp and myogenic/baroreflex measurements to test whether non-epithelial beta-ENaC
    forms functional channels or acts in another capacity.
  experiment_type: conditional knockout with electrophysiology
