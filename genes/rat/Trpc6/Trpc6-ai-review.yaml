id: A0ABK0M635
gene_symbol: Trpc6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Trpc6 encodes transient receptor potential canonical 6 (TRPC6), a member of the TRPC3/6/7 subfamily
  of plasma membrane cation channels. The 930-residue protein has N-terminal ankyrin repeats, six transmembrane
  helices and a C-terminal TRP domain, and assembles into tetrameric nonselective, Ca2+-permeable channels. TRPC6
  is activated downstream of Gq/phospholipase C-coupled receptors (muscarinic, vasopressin and growth factor receptors)
  by diacylglycerol, largely independently of store depletion, and its activity and surface trafficking are enhanced
  by oxidation of cysteine thiols by H2O2. In rat it carries receptor-operated cation currents in vascular smooth
  muscle, contributes to hypoxia-induced Ca2+ changes in pulmonary arterial smooth muscle, mediates NT-4-evoked
  Ca2+ influx in hippocampal neurons, and associates with the Na+/K+-ATPase in brain and kidney. Orthologs localize
  to the podocyte slit diaphragm, where gain-of-function variants cause familial focal segmental glomerulosclerosis
  in human.
