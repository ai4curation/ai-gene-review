suggested_questions:
- question: Does the full text of PMID:22764246 support negative regulation of dendrite morphogenesis for Trpc6,
    or does NT-4-activated TRPC6 promote dendritic growth as the abstract states?
- question: Does TRPC6 contribute to store-operated Ca2+ entry in rat pulmonary arterial smooth muscle as a homomeric
    channel, or only through heteromers with TRPC1 or indirect effects?
- question: Is the human TRPC6 inositol 1,4,5 trisphosphate binding annotation (PMID:14505576) meant to describe
    coupling to IP3 receptors rather than IP3 ligand binding?
suggested_experiments:
- description: Patch-clamp of rat PASMCs from Trpc6 knockout or knockdown versus TRPC1 knockdown to separate store-operated
    from receptor-operated currents.
- description: Identify the oxidized cysteine(s) mediating H2O2 activation of rat TRPC6 by cysteine-to-serine mutagenesis
    with cell-attached recordings.
