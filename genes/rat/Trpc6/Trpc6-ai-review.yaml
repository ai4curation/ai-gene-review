- term:
    id: GO:0015279
    label: store-operated calcium channel activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - MGI:MGI:109523
  review:
    summary: Store-operated calcium channel activity transferred from mouse Trpc6.
    action: MARK_AS_OVER_ANNOTATED
    reason: TRPC6 is primarily a receptor-operated, diacylglycerol-activated channel. Rat TRP6 isoforms were not
      activated by thapsigargin store depletion (PMID:11278449) and the TRPC6-like A7r5 current was not activated
      by store depletion (PMID:11788346). Rat PASMC data link TRPC6 knockdown to reduced SOCE under hypoxia (PMID:19889962),
      but this is context dependent and may reflect heteromeric or indirect contributions, so store-operated gating
      is not an established property of TRPC6 itself.
    supported_by:
    - reference_id: PMID:11278449
      supporting_text: passive depletion of intracellular Ca(2+) stores with thapsigargin did not induce Ba(2+)
        influx in cells expressing rTRP6 isoforms
    - reference_id: PMID:11788346
      supporting_text: Currents were not activated by store depletion or increased [Ca(2+)](i)
    - reference_id: PMID:19889962
      supporting_text: evidence in various cell types including PASMCs suggests that TRPC6 can also act as SOCC
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: MGI:MGI:109523
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Mouse store-operated annotation (IDA, PMID:8646775, an early TRP family study) predates the characterization
          of TRPC6 as store-independent; rat data argue against store-operated gating.
