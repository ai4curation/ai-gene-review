- term:
    id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P15692
  review:
    summary: 'PLC-activating G protein-coupled receptor signaling pathway: wrong pathway; VEGF receptors are receptor
      tyrosine kinases.'
    action: REMOVE
    reason: VEGF-A signals through the receptor tyrosine kinases VEGFR1/2, which activate PLCgamma directly; no
      GPCR is involved. The human donor (PMID:18059339) reports VEGFR2/KDR and PKC-mediated signalling, which is
      VEGFR2 signalling, not GPCR signalling. The ISO row propagates a mis-termed donor annotation and is contradicted
      by the receptor biology.
    supported_by:
    - reference_id: PMID:18059339
      supporting_text: VEGF induced a rapid increase in Egr-dependent transcriptional activation mediated via its
        major signalling receptor, VEGFR2/KDR, and the protein kinase C (PKC) pathway
    - reference_id: PMID:1417831
      supporting_text: Here we report that a previously identified receptor tyrosine kinase gene, KDR, encodes a
        receptor for VEGF.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: human VEGFA (UniProtKB:P15692) IDA PMID:18059339, assigned by BHF-UCL
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0007200
      corrected_value: GO:0048010
      corrected_label: vascular endothelial growth factor receptor signaling pathway
      confidence: PROBABLE
      explanation: PMID:18059339 describes VEGF-induced Egr3 transcription via VEGFR2/KDR and PKC; VEGFR2 is a receptor
        tyrosine kinase, so the GPCR pathway term is wrong. The rat ISO row inherits it.
      supported_by:
      - reference_id: PMID:18059339
        supporting_text: VEGF induced a rapid increase in Egr-dependent transcriptional activation mediated via
          its major signalling receptor, VEGFR2/KDR, and the protein kinase C (PKC) pathway
    - defect_type: WRONG_TERM
