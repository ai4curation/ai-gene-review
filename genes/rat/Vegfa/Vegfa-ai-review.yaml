      record: rat Vegfa ISO GO_REF:0000121 from UniProtKB:P15692
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0007200
      confidence: PROBABLE
      explanation: ISO transfer of the mis-termed human annotation; VEGF receptors are RTKs, not GPCRs.
      supported_by:
      - reference_id: PMID:1417831
        supporting_text: Here we report that a previously identified receptor tyrosine kinase gene, KDR, encodes
          a receptor for VEGF.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P15692
        source_label: human VEGFA
        source_status: SOURCE_BAD
