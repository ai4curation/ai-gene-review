suggested_questions:
- question: Does rat Vegfa use the conserved upstream CUG start that produces L-VEGF and the N-VEGF fragment in
    human, and is the rat N-VEGF nuclear under hypoxia? P16612 does not represent this product, yet nucleus/cytoplasm
    rows are transferred from human N-VEGF.
- question: Should GO:0007200 (PLC-activating GPCR signalling) on human VEGFA (PMID:18059339) be repointed to VEGFR
    signalling, and GO:1905604 (negative regulation of BBB permeability, PMID:19148554) to the positive term or
    to ANGPT1?
- question: Is there a rat inhibitory VEGF-Axxxb isoform equivalent to human VEGF165B, which binds KDR without activating
    signalling?
- question: Should isoform-specific NOT annotations transferred by ISO (mouse PR:Q00731-3 axon-guidance rows) carry
    the corresponding rat isoform identifier?
suggested_experiments:
- description: Isoform-specific knock-in or isoform-restricted rescue in rat (e.g. Vegfa120-only) to test which
    isoforms mediate NRP1-dependent axon guidance and vessel branching in rat, as in mouse.
- description: Ribosome profiling or N-terminal proteomics of hypoxic rat cells to test for CUG-initiated L-VEGF/N-VEGF
    translation and its subcellular localisation.
