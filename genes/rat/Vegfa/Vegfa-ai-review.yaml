- term:
    id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:12881220
  qualifier: involved_in
  review:
    summary: 'Positive regulation of transcription by RNA polymerase II: VEGF induces target genes only indirectly
      via receptor signalling.'
    action: MARK_AS_OVER_ANNOTATED
    reason: In the rat IDA (PMID:12881220) VEGF from hypoxic myocytes induced endothelial COX-2 transcription; this
      is a downstream consequence of VEGFR signalling (via PKC and NOS), not a transcription-regulating activity
      of the ligand. The same holds for the ISO rows (e.g. Egr3 induction, PMID:18059339).
    supported_by:
    - reference_id: PMID:12881220
      supporting_text: VEGF induced endothelial cell COX-2 expression by both increasing COX-2 transcription and
        prolonging the COX-2 mRNA half-life.
    - reference_id: PMID:18059339
      supporting_text: VEGF induced a rapid increase in Egr-dependent transcriptional activation mediated via its
        major signalling receptor, VEGFR2/KDR, and the protein kinase C (PKC) pathway
