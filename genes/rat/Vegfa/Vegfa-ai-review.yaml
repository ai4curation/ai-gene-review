- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P15692
  review:
    summary: 'Negative regulation of transcription by RNA polymerase II: distal output of VEGF signalling.'
    action: MARK_AS_OVER_ANNOTATED
    reason: VEGF-A is a secreted ligand with no transcription-regulatory activity; changes in target-gene transcription
      are distal consequences of receptor signalling and are better captured by the VEGFR signalling terms. The
      human donor (PMID:18093989) describes altered arterial/venous marker expression in Vegf120 mice.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P15692
        source_label: human VEGFA
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The human source shows expression changes downstream of VEGF signalling, not a VEGF-A transcriptional
          activity; same scoping issue at source.
    supported_by:
    - &id002
      reference_id: file:rat/Vegfa/Vegfa-deep-research-manual.md
      supporting_text: Transcription, mRNA-stability and gene-expression rows reflect distal signalling outputs,
        not activities of VEGF-A itself.
