id: P16612
gene_symbol: Vegfa
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Vegfa encodes vascular endothelial growth factor A (VEGF-A), a secreted, glycosylated, disulfide-linked
  homodimeric cystine-knot growth factor of the PDGF/VEGF family. Alternative splicing produces VEGF-A120, -A144,
  -A164 and -A188, which differ in basic heparin/extracellular-matrix-binding domains: VEGF-A120 is freely diffusible,
  whereas VEGF-A164 and especially VEGF-A188 are retained on heparan sulfate and matrix. VEGF-A acts as a ligand
  for the receptor tyrosine kinases VEGFR1/FLT1 and VEGFR2/KDR, with neuropilin-1 and heparan sulfate as co-receptors;
  VEGFR2 activation drives endothelial cell proliferation, survival, migration and chemotaxis, and increases vascular
  permeability. It is thereby the principal inducer of vasculogenesis and angiogenesis, and is strongly induced
  by hypoxia. In rat it is required for postnatal lung alveolarisation and capillary growth, coronary collateral
  growth and ischaemia-induced vascular leak, and it also acts on non-endothelial cells, stimulating neurogenesis
  and neuronal survival, smooth muscle cell proliferation and Th1 polarisation of T cells.'
