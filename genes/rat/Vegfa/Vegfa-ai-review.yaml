core_functions:
- description: Secreted homodimeric growth factor that binds and activates the receptor tyrosine kinases VEGFR2/KDR
    and VEGFR1/FLT1, initiating VEGF receptor signalling that drives endothelial proliferation, survival and angiogenesis.
  molecular_function:
    id: GO:0030297
    label: transmembrane receptor protein tyrosine kinase activator activity
  directly_involved_in:
  - id: GO:0048010
    label: vascular endothelial growth factor receptor signaling pathway
  - id: GO:0001525
    label: angiogenesis
  - id: GO:0001938
    label: positive regulation of endothelial cell proliferation
  locations:
  - id: GO:0005576
    label: extracellular region
  in_complex:
    id: GO:1990150
    label: VEGF-A complex
  supported_by:
  - reference_id: PMID:7929439
    supporting_text: Vascular endothelial growth factor (VEGF) is a homodimeric peptide growth factor which binds
      to two structurally related tyrosine kinase receptors denoted Flt1 and KDR.
  - reference_id: PMID:7929439
    supporting_text: KDR was found to undergo ligand-induced autophosphorylation in intact cells
  - reference_id: PMID:1417831
    supporting_text: Here we report that a previously identified receptor tyrosine kinase gene, KDR, encodes a receptor
      for VEGF.
  - reference_id: PMID:12181492
    supporting_text: the effect of VEGF was blocked by the VEGFR2/Flk-1 receptor tyrosine kinase inhibitor SU1498.
  - reference_id: PMID:16230500
    supporting_text: VEGF blockade decreases lung VEGF and VEGF receptor 2 (VEGFR-2) expression in newborn rats
      and impairs alveolar development, leading to alveolar simplification and loss of lung capillaries
- description: 'Growth factor activity: mitogenic and survival signalling for endothelial cells and other VEGFR2-expressing
    cells (neural precursors, astrocytes, smooth muscle cells).'
  molecular_function:
    id: GO:0008083
    label: growth factor activity
  directly_involved_in:
  - id: GO:0008284
    label: positive regulation of cell population proliferation
  - id: GO:0045766
    label: positive regulation of angiogenesis
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: file:rat/Vegfa/Vegfa-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Growth factor active in angiogenesis, vasculogenesis and endothelial cell growth. Induces endothelial
      cell proliferation, promotes cell migration, inhibits apoptosis and induces permeabilization of blood vessels.
  - reference_id: PMID:12181492
    supporting_text: VEGF (>10 ng/ml) stimulated 5-bromo-2′-deoxyuridine (BrdUrd) incorporation into cells that
      expressed immature neuronal marker proteins and increased cell number in cultures by 20–30%.
  - reference_id: PMID:18614764
    supporting_text: endogenous VEGF signaling during insult was essential for cell fate since VEGF inhibition appreciably
      augmented cell death and reduced proliferation.
  - reference_id: PMID:23562340
    supporting_text: VEGFA-modified EPC and HO-1-modified EPC synergized with each other in promoting angiogenesis
      in ischemic limbs of rat hindlimb ischemia model.
- description: Chemoattractant for endothelial cells (tip-cell guidance in sprouting angiogenesis, with NRP1 as
    co-receptor) and for VEGFR-expressing leukocytes.
  molecular_function:
    id: GO:0042056
    label: chemoattractant activity
  directly_involved_in:
  - id: GO:0002040
    label: sprouting angiogenesis
  - id: GO:0010595
    label: positive regulation of endothelial cell migration
  - id: GO:0038190
    label: VEGF-activated neuropilin signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:7929439
    supporting_text: The KDR expressing cells showed striking changes in cell morphology, actin reorganization and
      membrane ruffling, chemotaxis and mitogenicity upon VEGF stimulation
  - reference_id: PMID:21653826
    supporting_text: In endothelial cells, neuropilin-1 (NRP1) binds vascular endothelial growth factor (VEGF)-A
      and is thought to act as a coreceptor for kinase insert domain-containing receptor (KDR)
  - reference_id: PMID:21653826
    supporting_text: VEGF binding to NRP1 has specific effects on endothelial cell signaling and is important for
      endothelial cell migration and angiogenesis
- description: 'Vascular permeability factor: VEGF-A signalling disassembles endothelial junctions and increases
    microvascular permeability.'
  molecular_function:
