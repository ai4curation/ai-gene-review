  evidence_type: IPI
  original_reference_id: PMID:19473976
  qualifier: enables
  supporting_entities:
  - RGD:3690
  review:
    summary: Identical protein binding based on an MCT1 'dimer' band on western blots.
    action: REMOVE
    reason: The full text of the cited paper explicitly attributes the ~85 kDa dimer band to aggregation
      of MCT1 in detergent, more prominent with overexpression and absence of embigin, i.e. an artifact.
      FRET in situ found no MCT1-MCT1 proximity. The functional unit is MCT1 with basigin/embigin.
    supported_by:
    - reference_id: PMID:19473976
      supporting_text: Such dimers occur even in the absence of DIDS, and we have shown previously that
        this occurs as a result of aggregation of MCT1 in detergent (16).
    - reference_id: PMID:11719518
      supporting_text: No FRET was observed between MCT1-YFP and MCT-CFP in any combination.
    - reference_id: file:rat/Slc16a1/Slc16a1-deep-research-manual.md
      supporting_text: detergent aggregation, not a physiological homodimer
