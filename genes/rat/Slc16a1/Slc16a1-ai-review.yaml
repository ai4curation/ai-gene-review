core_functions:
- description: Proton-coupled bidirectional symport of L-lactate (and pyruvate, ketone bodies) across
    the plasma membrane, mediating lactate efflux from glycolytic cells and uptake for oxidation; requires
    the ancillary protein basigin or embigin for surface expression.
  molecular_function:
    id: GO:0015650
    label: lactate:proton symporter activity
  directly_involved_in:
  - id: GO:0035879
    label: plasma membrane lactate transport
  - id: GO:1901475
    label: pyruvate transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9639576
    supporting_text: Superfusion with lactate resulted in intracellular acidification of MCT1-expressing
      oocytes, but not in non-injected control oocytes.
  - reference_id: PMID:8526936
    supporting_text: When expressed in Xenopus laevis oocytes, the ratMCT1 cRNA caused a significant increase
      in the uptake of radiolabeled lactic acid.
  - reference_id: PMID:19473976
    supporting_text: K38Q-MCT1 and K38R-MCT1 were inactive when expressed at the plasma membrane of Xenopus
      laevis oocytes
  - reference_id: PMID:11719518
    supporting_text: The monocarboxylate (lactate) transporters MCT1 and MCT4 require the membrane-spanning
      glycoprotein CD147 for their correct plasma membrane expression and function.
- description: Broader monocarboxylate transport, including ketone bodies, branched-chain 2-oxoacids and
    xenobiotic weak acids such as benzoate (e.g. at the blood-brain barrier).
  molecular_function:
    id: GO:0008028
    label: monocarboxylic acid transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015718
    label: monocarboxylic acid transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9639576
    supporting_text: MCT1 mediated the reversible transport of a wide variety of monocarboxylic acids
      including pyruvate, D,L-3-hydroxybutyrate, acetoacetate, alpha-oxoisohexanoate and alpha-oxoisovalerate,
      but not of dicarboxylic and tricarboxylic acids.
  - reference_id: PMID:10714609
    supporting_text: hybrid depletion of MCT1 in RBEC1 using an antisense oligonucleotide against rat
      MCT1 abolished the saturable transport of benzoic acid.
suggested_questions:
- question: Does rat MCT1 transport protonated succinate at acidic pH as shown for mouse heart, and should
    succinate transport terms be restricted to the human/mouse orthologs with experimental evidence?
- question: Should the GO:0042802 identical protein binding annotation from PMID:19473976 be withdrawn
    at RGD, given the authors attribute the MCT1 dimer band to detergent aggregation?
- question: Is there a GO convention for capturing an obligate ancillary subunit dependence (MCT1 requires
    basigin/embigin) beyond bare protein binding?
suggested_experiments:
- description: Measure [14C]succinate uptake/efflux by rat MCT1 (with basigin) in oocytes across extracellular
    pH 6.0-7.4 to define pH dependence of dicarboxylate transport.
- description: Determine oligomeric state of native rat MCT1-basigin/embigin complexes from erythrocyte
    membranes by cryo-EM or native mass spectrometry, avoiding detergent-induced aggregation.
