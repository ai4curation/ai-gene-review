id: P53987
gene_symbol: Slc16a1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Slc16a1 encodes monocarboxylate transporter 1 (MCT1), a 12-transmembrane-helix member of
  the SLC16/monocarboxylate porter family of the major facilitator superfamily. MCT1 is a bidirectional
  proton-linked symporter in the plasma membrane that moves L-lactate, pyruvate, ketone bodies (acetoacetate,
  beta-hydroxybutyrate), branched-chain 2-oxoacids and some xenobiotic weak acids (e.g. benzoate) together
  with H+, the direction set by the substrate and proton gradients. Its surface expression and activity
  require association with the single-pass ancillary glycoproteins basigin (CD147) or embigin. Lys38 (TM1)
  and the Asp302/Arg306 pair (TM8) are essential for the translocation cycle. MCT1 is widely expressed
  (erythrocytes, heart, skeletal muscle, brain astrocytes and microvessel endothelium, intestinal epithelium),
  where it supports lactate efflux from glycolytic cells, lactate and ketone-body uptake for oxidation,
  intracellular pH regulation, and, under acidic conditions, export of the protonated form of succinate.
