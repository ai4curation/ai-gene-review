      cellular localization data for rat Pgam2 come from skeletal muscle.
    action: MARK_AS_OVER_ANNOTATED
    reason: Ooplasm is defined as the cytoplasm of an ovum. The experimental localization
      study cited for the IDA ooplasm row examined rat skeletal muscle and found the
      enzyme in cytosol and nucleus; no evidence presented here places Pgam2, a muscle/heart
      enriched glycolytic isozyme, specifically in oocyte cytoplasm. The rule-based
      transfer therefore overshoots the available localization evidence, as judged
      for the IDA sibling.
