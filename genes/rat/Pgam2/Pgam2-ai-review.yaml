- term:
    id: GO:1990917
    label: ooplasm
  evidence_type: IDA
  original_reference_id: PMID:2158448
  review:
    summary: ooplasm is an over-annotation. The cited reference (PMID:2158448) is
      an immunogold study of rat skeletal muscle that localized the enzyme to cytosol
      and nucleus; it does not provide evidence for an oocyte/ooplasm localization.
      Falcon deep research finds no support for non-cytosolic localization of mammalian
      PGAM2 beyond the intracellular carbohydrate-metabolism context.
    action: MARK_AS_OVER_ANNOTATED
    reason: ooplasm (an oocyte cytoplasm term) is not supported by the muscle immunocytochemistry
      reference, and PGAM2 is a muscle/heart-enriched cytosolic glycolytic enzyme;
      the dominant functional context is intracellular carbohydrate metabolism.
    supported_by:
    - reference_id: PMID:2158448
