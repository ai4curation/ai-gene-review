id: P16290
gene_symbol: Pgam2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Pgam2 encodes rat muscle-specific phosphoglycerate mutase (PGAM-M; UniProt
  P16290), the muscle/heart-enriched, cytosolic glycolytic isoform distinct from the
  brain-predominant Pgam1. It is a 2,3-bisphosphoglycerate-dependent phospho-histidine
  mutase that interconverts 3-phosphoglycerate and 2-phosphoglycerate in lower glycolysis
  and can also act on 2,3-bisphosphoglycerate. The active enzyme is a homodimer that
  uses a catalytic tele-phosphohistidine intermediate. In skeletal muscle it is found
  mainly in the cytosol, with a fraction of the activity also detected in nuclei.
