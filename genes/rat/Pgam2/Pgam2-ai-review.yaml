      spermatogenesis, where the paper frames PGAM as "an essential glycolytic enzyme
      for the spermatozoa energy supply". This testis expression reflects the same
      core glycolytic mutase function operating in a germ-cell context (an IEP expression-pattern
      observation) rather than a distinct, direct involvement of PGAM2 in the spermatogenesis
      differentiation program itself.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is an IEP expression-pattern observation; although PMID:7867621
      frames PGAM-M as essential for spermatozoa energy supply, this is the same glycolytic
      mutase activity deployed in germ cells, not a direct PGAM2 role in the spermatogenesis
      developmental process, so annotating Pgam2 to spermatogenesis over-states its
      function.
