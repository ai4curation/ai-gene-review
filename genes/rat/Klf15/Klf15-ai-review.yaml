gene_symbol: Klf15
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Kruppel-like factor 15 (Klf15, originally KKLF, kidney-enriched Kruppel-like factor) is a nuclear C2H2
  zinc-finger transcription factor of the Sp/KLF family. Its three C-terminal zinc fingers bind GC-rich KLF elements
  in RNA polymerase II promoters, and its N-terminal region mediates context-dependent activation (e.g. via p300
  recruitment) or repression (e.g. blocking P/CAF recruitment or antagonizing MAZ, GATA4, MEF2 and myocardin-related
  factors). KLF15 is abundant in heart, kidney, liver, skeletal muscle and adipose tissue. It activates genes such
  as Slc2a4 (GLUT4), Kcnip2 (KChIP2), nephrin/podocin, Bmper and Pck1 and genes of amino-acid catabolism, linking
  it to glucose uptake, fasting gluconeogenesis, cardiac lipid metabolism, circadian control of cardiac repolarization
  and podocyte differentiation. In cardiomyocytes and cardiac fibroblasts it acts as a brake on stress-induced hypertrophy
  and fibrosis, repressing hypertrophic genes and CTGF; its expression falls in response to hypertrophic and pro-fibrotic
  stimuli such as endothelin-1 and TGF-beta1.
