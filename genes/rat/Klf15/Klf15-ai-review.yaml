    id: GO:1990859
    label: cellular response to endothelin
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00093729
  review:
    summary: ARBA cellular response to endothelin; the underlying observation is that endothelin-1 downregulates
      Klf15 mRNA.
    action: MARK_AS_OVER_ANNOTATED
    reason: In neonatal rat cardiomyocytes (PMID:18406357, read in full) and endothelial cells (PMID:19767294) endothelin-1
      reduces Klf15 transcript levels. That is a change in the gene's expression, not evidence that the KLF15 protein
      performs a step of the cellular response to endothelin; no experiment shows KLF15 activity is required for
      or mediates the endothelin response in rat. The ARBA rule appears to generalize expression-pattern annotations.
    supported_by:
    - reference_id: PMID:18406357
      supporting_text: Consistent with our microarray data, Klf3, Klf11 and Klf15 were downregulated in response
        to ET-1
