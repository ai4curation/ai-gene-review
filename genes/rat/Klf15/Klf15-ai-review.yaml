core_functions:
- description: 'Sequence-specific RNA polymerase II transcription activator: the C2H2 zinc-finger domain binds KLF
    elements in target promoters and activates genes for glucose uptake (GLUT4), gluconeogenesis and amino-acid
    catabolism (PEPCK and amino-acid-degrading enzymes), cardiac repolarization (KChIP2) and podocyte differentiation
    (nephrin, podocin).'
