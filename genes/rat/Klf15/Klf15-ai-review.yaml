suggested_questions:
- question: Does KLF15 repress targets such as CTGF and CLC-K1 through its own DNA binding (a DNA-binding repressor
    activity, GO:0001227) or only by competing with or blocking co-activators (P/CAF, MAZ, GATA4, MEF2)?
- question: Should the mouse UniProt IMP annotation of Klf15 to GO:0014898 (cardiac muscle hypertrophy in response
    to stress, PMID:17438289) be re-pointed to GO:1903243, given that the paper shows KLF15 inhibits hypertrophy?
- question: The RGD IMP rows on rat Klf15 (negative regulation of collagen biosynthetic process; negative regulation
    of TGF-beta production) appear in UniProt but not in the GOA download; which reference supports them, and are
    they direct transcriptional targets?
suggested_experiments:
- description: ChIP-seq of endogenous KLF15 in adult rat cardiomyocytes and cardiac fibroblasts with and without
    endothelin-1 or TGF-beta1, combined with CUT&RUN for p300 and P/CAF, to separate directly activated from directly
    repressed targets.
- description: Reporter assays with KLF-site mutants at CTGF and CLC-K1 promoters to test whether KLF15 repression
    requires DNA binding by its zinc fingers.
