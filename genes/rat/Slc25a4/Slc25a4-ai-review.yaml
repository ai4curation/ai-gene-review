id: Q05962
gene_symbol: Slc25a4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: ADP/ATP translocase 1 (ANT1, AAC1) is the heart- and skeletal-muscle-enriched isoform of
  the mitochondrial ADP/ATP carrier, a six-transmembrane member of the mitochondrial carrier family (SLC25)
  located in the mitochondrial inner membrane. Working as a monomer with a single substrate-binding site
  and an alternating-access mechanism, it exchanges cytosolic ADP for matrix ATP, supplying ATP synthase
  with substrate and exporting the ATP made by oxidative phosphorylation. It also mediates a fatty-acid-dependent
  proton leak that uncouples respiration from ATP synthesis and is negatively regulated by ongoing ADP/ATP
  exchange. ANT binds cyclophilin D and modulates, without being essential for, the mitochondrial permeability
  transition pore, and it promotes PINK1/parkin mitophagy through TIM44 independently of nucleotide exchange.
  In rat, ANT1 expression rises during postnatal heart maturation, and cardiac overexpression enhances
  contractile function and protects cardiomyocytes from TGF-beta1-induced, pore-dependent apoptosis.
