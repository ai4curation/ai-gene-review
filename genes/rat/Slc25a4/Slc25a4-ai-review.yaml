core_functions:
- description: ATP:ADP antiporter of the mitochondrial inner membrane that imports cytosolic ADP into
    the matrix and exports matrix ATP, supplying ATP synthase and delivering oxidative-phosphorylation
    ATP to the cell; the predominant carrier isoform in heart and skeletal muscle.
  molecular_function:
    id: GO:0005471
    label: ATP:ADP antiporter activity
  directly_involved_in:
  - id: GO:0140021
    label: mitochondrial ADP transmembrane transport
  - id: GO:1990544
    label: mitochondrial ATP transmembrane transport
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:37278158
    supporting_text: imports ADP into the mitochondrial matrix and exports ATP, which are key steps in
      oxidative phosphorylation
  - reference_id: PMID:21325829
    supporting_text: These data reveal a close association of elevated mitochondrial ATP/ADP transportation
      via ANT1 with increased contractile function.
- description: Fatty-acid-dependent proton leak from the intermembrane space into the matrix, a second
    transport mode that uncouples respiration from ATP synthesis and is negatively regulated by ongoing
    ADP/ATP exchange.
  molecular_function:
    id: GO:0017077
    label: oxidative phosphorylation uncoupler activity
  directly_involved_in:
  - id: GO:1902600
    label: proton transmembrane transport
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:31341297
    supporting_text: The AAC-mediated H+ current requires free fatty acids and resembles the H+ leak via
      the thermogenic uncoupling protein 1 found in brown fat.
  - reference_id: PMID:18251717
    supporting_text: an endogenously generated activator stimulates proton conductance catalysed partly
      by UCP3 and partly by the adenine nucleotide translocase
suggested_questions:
- question: Is ANT1 a pore-forming component of the mitochondrial permeability transition pore or only
    a regulator of it, and do ANT1 and ANT2 differ in this role in rat heart?
- question: How much of the carboxyatractylate-sensitive proton leak in rat heart and skeletal muscle
    is carried by ANT1 rather than ANT2, and how is it regulated in vivo?
- question: Did the rat raft proteomics (PMID:14499952) and liver IMM pull-down (PMID:9820802) detect
    ANT1 specifically or a pan-ANT signal? Isoform-specific reagents would settle which rat experimental
    rows belong to Slc25a4 rather than Slc25a5.
suggested_experiments:
- description: Patch-clamp inner membranes from Slc25a4-knockout and wild-type rat cardiomyocytes to quantify
    ANT1-specific fatty-acid-dependent H+ current versus ADP/ATP exchange current.
- description: Use isoform-specific antibodies or tagged knock-in rats to test whether ANT1 is present
    in detergent-resistant plasma-membrane fractions or only in mitochondrial inner membrane.
