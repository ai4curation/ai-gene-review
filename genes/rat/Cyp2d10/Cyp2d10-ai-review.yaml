- term:
    id: GO:0019369
    label: arachidonate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      arachidonate metabolic process is an over-annotation for rat Cyp2d10. The IBD behind this IBA sits at
      PANTHER node PTN000670525 and is seeded by a single experimental member, RGD:620640 = rat Cyp2d4, a
      CYP2D-subfamily paralog that does enable arachidonate monooxygenase activity. So the substrate is
      documented within the CYP2D subfamily, but only for that paralog; substrate range is the fastest-diverging
      property in the CYP2 family, and generalizing one paralog's arachidonate activity to a deep ancestral node
      over-reaches. No direct rat Cyp2d10 arachidonate evidence exists; falcon deep research surveyed CYP2D
      substrate chemistry and found the documented CYP2D10-relevant substrates to be basic drug-like xenobiotics
      (debrisoquine, codeine, imipramine, thioridazine).
    action: MARK_AS_OVER_ANNOTATED
    reason: |-
      Single-seed generalization of a paralog-specific substrate: the sole experimental seed behind the IBD is
      the rat paralog Cyp2d4 (RGD:620640, arachidonate monooxygenase per RGD), and no evidence extends
      arachidonate metabolism to rat Cyp2d10, whose documented substrate profile is basic drug-like xenobiotics.
      The over-annotation call challenges the node placement (a deep node carrying one member's substrate
      specificity), not the reality of the source annotation. An earlier version of this review attributed the
      term to non-CYP2D epoxygenase families; the WITH/FROM trace corrects that mechanism while sustaining the
      same conclusion.
    supported_by:
    - reference_id: UniProtKB:P12939
      supporting_text: GO; GO:0019369; P:arachidonate metabolic process; IBA:GO_Central.
    - reference_id: file:rat/Cyp2d10/Cyp2d10-deep-research-falcon.md
      supporting_text: |-
        CYP2D enzymes catalyze multiple oxidative reactions (hydroxylation, N-dealkylation, oxidation) and are known to metabolize substrates including **debrisoquine** and **codeine** among others.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000670525
        source_label: PANTHER:PTN000670525
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: In the current PTHR24300 PAINT slice this node carries the GO:0019369 IBD with a single seed
          (RGD:620640, dated 2017); placing a member-specific substrate at this deep node lets it descend to
          CYP2D members like Cyp2d10 with no arachidonate evidence of their own.
      - source_id: RGD:620640
        source_label: rat Cyp2d4
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The sole experimental seed is the rat CYP2D-subfamily paralog Cyp2d4, whose RGD record enables
          arachidonate monooxygenase activity. The source annotation is sound for Cyp2d4, but it licenses the
          process only for that paralog's branch; arachidonate handling is not established for Cyp2d10.
