id: P12939
gene_symbol: Cyp2d10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Cyp2d10 encodes rat cytochrome P450 2D10, a microsomal heme-thiolate monooxygenase of the CYP2D
  family. Anchored in the endoplasmic reticulum membrane and using a heme iron centre together with electrons
  delivered from NADPH by cytochrome P450 reductase, it inserts one atom of molecular oxygen into a substrate
  while reducing the other to water. CYP2D enzymes carry out aromatic and aliphatic hydroxylation,
  N-dealkylation and hydroxyl oxidation of basic, drug-like xenobiotics such as debrisoquine, codeine,
  imipramine and thioridazine, and Cyp2d10 was historically annotated as a debrisoquine 4-hydroxylase; direct
  enzymology defining its own substrate specificity and kinetic constants has not been reported, so its
  catalytic profile rests on CYP2D family inference rather than on protein-specific measurement. The protein is
  expressed in liver, where it is detectable in hepatocyte-derived extracellular vesicles and responds to
  hepatotoxic challenge, and CYP2D-family enzymes are also present in brain, where they are proposed to
  contribute to local detoxification of neurotoxicants.
