- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P54852
  - ensembl:ENSP00000270221
  review:
    summary: apoptotic process projected from human EMP3, whose source is an IDA from an overexpression
      study (PMID:12107182).
    action: MARK_AS_OVER_ANNOTATED
    reason: The human source annotation rests on constitutive overexpression in HEK-293 cells, where every
      EMP family member tested (EMP-1, -2, -3, PMP-22) produced blebbing, annexin V binding and caspase-dependent
      death. A shared overexpression phenotype of a family of tetraspans does not show that endogenous
      Emp3 carries out apoptotic process; no loss-of-function or physiological-level evidence places Emp3
      in this process, and the rat literature (dome formation in LA7 cells) does not address it. Mammalian
      EMP3 knockout/MAM-null phenotypes concern receptor (EGFR, CD44) handling and erythropoiesis rather
      than apoptosis execution. Only the abstract of PMID:12107182 is cached, so the human source annotation
      itself is not challenged; the transfer to a rat process claim is judged over-annotated.
    supported_by: &id002
    - reference_id: PMID:12107182
      supporting_text: the constitutive overexpression of any of the EMPs in HEK-293 cells led to cell
        blebbing, annexin V binding, and cell death, by a caspase-dependent pathway
