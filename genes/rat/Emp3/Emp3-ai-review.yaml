core_functions:
- description: Tetraspan glycoprotein of the plasma membrane that, by analogy with human EMP3, organises
    and stabilises cell-surface receptors (EGFR, CD44) and modulates their trafficking; no molecular activity
    has been defined, so no molecular_function term is asserted.
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id003
  - *id004
  - reference_id: PMID:37936247
    supporting_text: EMP3 promotes EGFR/CDK2 signaling by regulating the trafficking and enhancing the
      stability of EGFR
suggested_questions:
- question: Does endogenous Emp3 in rat epithelia or blood cells regulate surface levels or endosomal
    sorting of EGFR or CD44, as reported for human EMP3 in glioblastoma and erythroid cells?
- question: Is the blebbing/apoptosis caused by EMP overexpression a physiological activity or a consequence
    of overloading the membrane with a tetraspan protein?
suggested_experiments:
- description: Generate Emp3-null rat epithelial (e.g. LA7) cells and measure EGFR/CD44 surface levels,
    internalisation and degradation kinetics, and apoptosis under basal and stress conditions.
