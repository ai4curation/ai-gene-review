taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Epithelial membrane protein 3 (Emp3) is a small N-glycosylated tetraspan integral membrane
  protein of the PMP-22/EMP/MP20 (claudin-like) family, with four transmembrane helices and two predicted
  N-glycosylation sites on its first extracellular loop. It resides at the plasma membrane and in intracellular
  endomembrane compartments. No enzymatic or transport activity is known. In rat it was cloned from the
  LA7 mammary epithelial line as gene 133, whose expression negatively controls DMSO-induced dome formation,
  apparently by repressing amiloride-sensitive Na+ channel expression. Work on the human ortholog indicates
  roles in organising and stabilising cell-surface receptors: EMP3 sustains EGFR signalling by limiting
  its traffic to late endosomes for degradation, is needed for normal CD44 levels on erythroid cells (it
  carries the MAM blood group antigen), and associates with the P2X7 receptor C terminus. Overexpression
  of EMP3 or any other EMP family member in cultured cells causes membrane blebbing and caspase-dependent
  cell death.'
