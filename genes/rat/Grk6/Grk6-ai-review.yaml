gene_symbol: Grk6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Grk6 encodes G protein-coupled receptor kinase 6, a member of the GRK4/5/6 subfamily of AGC serine/threonine
  protein kinases, with an N-terminal RGS-homology domain, a central protein kinase domain and a C-terminal AGC-kinase
  extension. It is widely expressed, including all brain regions, smooth muscle and lymphoid tissue. Palmitoylation
  of a C-terminal cysteine cluster anchors GRK6 to membranes and increases its catalytic activity; the non-palmitoylated
  pool is cytosolic. GRK6 phosphorylates agonist-occupied G protein-coupled receptors, which promotes arrestin binding,
  receptor uncoupling from G proteins and internalization, producing homologous desensitization. In rat cells it
  mediates desensitization of beta-adrenergic receptors in uterine smooth muscle and contributes to desensitization
  of M1 muscarinic receptors in hippocampal neurons; in mice it limits D2-like dopamine receptor signaling in striatum
  and regulates CXCR4 signaling and chemotaxis in T cells. It binds the ARF GAP GIT1.
