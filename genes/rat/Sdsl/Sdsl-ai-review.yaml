id: A0A6N3IN21
gene_symbol: Sdsl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Sdsl encodes serine dehydratase-like protein (SDHL, also called STDHgr),
  a pyridoxal 5'-phosphate (PLP)-dependent fold-type II enzyme of the serine/threonine
  dehydratase family, about 60% identical to L-serine dehydratase (Sds). Recombinant
  rat SDSL deaminates L-serine and L-threonine to pyruvate and 2-oxobutanoate with
  ammonia release, and also interconverts L- and D-glutamate, making it the first
  mammalian enzyme shown to have glutamate racemase activity; in cultured mammalian
  cells it supports D-glutamate synthesis and degradation of L-serine and L-threonine
  and influences homeostasis of several other amino acids. Free D-glutamate occurs
  in mammalian tissues and has been linked to cardiac function. Recombinant rat SDSL
  behaves as a monomer, whereas the human ortholog crystallizes as a dimer. Human
  SDSL is upregulated in heart failure and has been linked to cardiomyocyte apoptosis.
  Its subcellular localization has not been established.
