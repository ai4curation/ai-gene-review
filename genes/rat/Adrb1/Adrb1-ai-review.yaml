- term:
    id: GO:0001996
    label: positive regulation of heart rate by epinephrine-norepinephrine
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:87937
  review:
    summary: Beta1-AR mediates the sympathetic catecholamine-driven increase in heart rate; core physiological
      role.
    action: ACCEPT
    reason: Donor mouse Adrb1-null hearts lack the chronotropic response to beta agonists and double-knockout
      analysis attributes beta-agonist chronotropy almost exclusively to beta1. Rat pharmacology agrees
      (atenolol bradycardia, PMID:9089896). This is the principal physiological output of the receptor.
    supported_by:
    - &id001
      reference_id: PMID:8693001
      supporting_text: Beta l-AR -/- mice that do survive to adulthood appear normal, but lack the chronotropic
        and inotropic responses seen in wild-type mice when beta-AR agonists such as isoproterenol are
        administered
    - &id002
      reference_id: PMID:10358009
      supporting_text: beta-AR stimulation of cardiac inotropy and chronotropy is mediated almost exclusively
        by the beta1-AR, whereas vascular relaxation and metabolic rate are controlled by all three beta-ARs
        (beta1-, beta2-, and beta3-AR)
    - &id003
      reference_id: PMID:9089896
      supporting_text: beta 1-adrenergic receptor blockade with atenolol (Aten) lowered pre-exercise fH
        and (fHmax) to comparable values in A and in NA rats
