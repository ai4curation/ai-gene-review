  supporting_entities:
  - UniProtKB:Q9JK71
  review:
    summary: Interaction with MAGI-3 is via the receptor's C-terminal PDZ ligand binding MAGI-3 PDZ1.
    action: MODIFY
    reason: Bare protein binding is uninformative. The cited study maps the interaction to the receptor's
      E-S-K-V C-terminus binding the first PDZ domain of MAGI-3 (V466A abolishes it), so PDZ domain binding
      captures the function.
    supported_by:
    - &id020
      reference_id: PMID:16316992
      supporting_text: The beta1AR carboxyl terminus was found to bind specifically to the first PDZ domain
        of MAGI-3, with the last four amino acids (E-S-K-V) of beta1AR being the key determinants of the
        interaction.
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
