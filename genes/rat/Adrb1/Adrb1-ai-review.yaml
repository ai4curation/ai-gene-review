- term:
    id: GO:0002024
    label: diet induced thermogenesis
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:87937
  review:
    summary: Beta1-AR is required for diet-induced thermogenesis in mouse brown fat; non-core physiological
      role.
    action: KEEP_AS_NON_CORE
    reason: Beta1-knockout mice fail to develop diet-induced thermogenesis (PMID:22728333), consistent
      with the beta-less mouse (PMID:12161655). The receptor acts upstream as the sympathetic signal transducer
      in brown adipocytes; the thermogenic process is downstream, so the term is kept as non-core.
    supported_by:
    - reference_id: PMID:22728333
      supporting_text: β(1)KO mice were more susceptible to obesity than WT controls and failed to develop
        diet-induced thermogenesis
    - reference_id: PMID:12161655
      supporting_text: These findings establish that betaARs are necessary for diet-induced thermogenesis
- term:
    id: GO:0002025
    label: norepinephrine-epinephrine-mediated vasodilation involved in regulation of systemic arterial
      blood pressure
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:87937
  - PANTHER:PTN002798485
  review:
    summary: Beta1-AR contributes modestly to catecholamine-mediated vasodilation; vascular relaxation
      is shared with beta2/beta3.
    action: KEEP_AS_NON_CORE
    reason: Knockout analysis attributes vascular relaxation to all three beta-AR subtypes, not predominantly
      beta1 (PMID:10358009). The IBA node (PTN002798485) is the ADRB1 subfamily seeded by mouse Adrb1;
      the rat protein is inside that clade, so the inheritance is sound, but the process is peripheral
      to the cardiac core role.
    supported_by:
