  review:
    summary: 'Core molecular function: Gs-coupled beta1-adrenergic receptor activity.'
    action: ACCEPT
    reason: Expressed rat Adrb1 binds beta ligands and stimulates adenylyl cyclase with the beta1 agonist
      rank order (PMID:1695899); native rat beta1 in chromaffin cells potentiates L-type Ca2+ current
      via PKA (PMID:12514203); mouse knockouts lose cardiac AC stimulation (PMID:8693001). IBA node placement
      in the ADRB1 clade is consistent.
    supported_by:
    - *id006
    - &id008
      reference_id: PMID:12514203
      supporting_text: suggesting that potentiation is associated with a PKA-mediated phosphorylation
        of L-channels (approximately 40% L-current increase) through beta(1)-ARs
    - &id009
      reference_id: PMID:8693001
      supporting_text: this lack of responsiveness is accompanied by markedly reduced stimulation of adenylate
        cyclase in cardiac membranes from beta 1-AR -/- mice
    - *id007
