id: P18090
gene_symbol: Adrb1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Adrb1 encodes the beta-1 adrenergic receptor, a class A (rhodopsin-like) seven-transmembrane
  G protein-coupled receptor for the catecholamines norepinephrine and epinephrine. At the plasma membrane
  it couples to Gs to stimulate adenylyl cyclase, raising cAMP and activating protein kinase A, which
  phosphorylates targets such as L-type Ca2+ channels. A C-terminal class I PDZ ligand (E-S-K-V) binds
  scaffolds including MAGI-2, MAGI-3, PSD-95, GOPC and the cAMP-dependent Ras exchange factor RAPGEF2
  (CNrasGEF), which shapes receptor trafficking and couples cAMP to Ras activation. After agonist stimulation
  the receptor is phosphorylated, internalized through early endosomes and recycled. Beta1 is the predominant
  beta-adrenoceptor of the heart, where it mediates sympathetic increases in heart rate and contractile
  force, and its chronic stimulation drives cardiomyocyte hypertrophy and apoptosis. Outside the heart
  it contributes to sympathetic activation of brown-fat thermogenesis, and in the brain (cortex, hippocampus,
  amygdala, pons) it modulates synaptic plasticity, memory retrieval and sleep/wake behaviour.
