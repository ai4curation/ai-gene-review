- term:
    id: GO:0005980
    label: glycogen catabolic process
  evidence_type: IDA
  original_reference_id: PMID:17911346
  qualifier: involved_in
  review:
    summary: Beta1 stimulation drives glycogenolysis in perfused rat heart; the receptor regulates rather
      than performs glycogen breakdown.
    action: MODIFY
    reason: The receptor does not catalyse glycogen catabolism; it promotes it through cAMP/PKA activation
      of phosphorylase kinase. The observation supports positive regulation of glycogen catabolic process
      (non-core metabolic output).
    supported_by:
    - reference_id: PMID:17911346
      supporting_text: The greater glycogenolysis was observed during beta(1)- than beta(2)-AR stimulation
    proposed_replacement_terms:
    - id: GO:0045819
      label: positive regulation of glycogen catabolic process
