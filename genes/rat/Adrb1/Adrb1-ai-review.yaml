- term:
    id: GO:0003084
    label: positive regulation of systemic arterial blood pressure
  evidence_type: IMP
  original_reference_id: PMID:18931026
  qualifier: involved_in
  review:
    summary: Chronic beta1 blockade with atenolol lowers mean arterial pressure in rats.
    action: KEEP_AS_NON_CORE
    reason: Pharmacological loss-of-function supports a role in maintaining arterial pressure, largely
      via cardiac output (and renal renin release, not assayed here). Systemic blood pressure is an organismal
      outcome downstream of the receptor's cardiac role, so non-core.
    supported_by:
    - reference_id: PMID:18931026
      supporting_text: Five days of atenolol treatment decreased MAP similarly in SGX and Sham rats.
