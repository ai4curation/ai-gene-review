core_functions:
- description: Plasma-membrane Gs-coupled receptor for norepinephrine and epinephrine that activates adenylyl
    cyclase and cAMP/PKA signalling (beta1 pharmacological profile).
  molecular_function:
    id: GO:0004940
    label: beta1-adrenergic receptor activity
  directly_involved_in:
  - id: GO:0071880
    label: adenylate cyclase-activating adrenergic receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:1695899
    supporting_text: adenylylcyclase was stimulated by beta-adrenergic receptor agonists with the rank
      order of potency of isoproterenol greater than norepinephrine = epinephrine, consistent with properties
      expected of the beta 1-AR subtype
  - reference_id: PMID:8693001
    supporting_text: this lack of responsiveness is accompanied by markedly reduced stimulation of adenylate
      cyclase in cardiac membranes from beta 1-AR -/- mice
  - reference_id: PMID:12514203
    supporting_text: suggesting that potentiation is associated with a PKA-mediated phosphorylation of
      L-channels (approximately 40% L-current increase) through beta(1)-ARs
  - reference_id: PMID:21177871
    supporting_text: Stimulation of EPs with PGE1 or of β-adrenoceptors (β-AR) with adrenergic agonists,
      such as norepinephrin (NE) or isoproterenol, activates the G protein Gs, which in turn stimulates
      adenylyl cyclase (AC).
- description: 'Mediates sympathetic (catecholamine) stimulation of the heart: positive chronotropy and
    inotropy.'
  molecular_function:
    id: GO:0004940
    label: beta1-adrenergic receptor activity
  directly_involved_in:
  - id: GO:0001996
    label: positive regulation of heart rate by epinephrine-norepinephrine
  - id: GO:0001997
    label: positive regulation of the force of heart contraction by epinephrine-norepinephrine
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8693001
    supporting_text: Beta l-AR -/- mice that do survive to adulthood appear normal, but lack the chronotropic
      and inotropic responses seen in wild-type mice when beta-AR agonists such as isoproterenol are administered
  - reference_id: PMID:10358009
    supporting_text: beta-AR stimulation of cardiac inotropy and chronotropy is mediated almost exclusively
      by the beta1-AR, whereas vascular relaxation and metabolic rate are controlled by all three beta-ARs
      (beta1-, beta2-, and beta3-AR)
  - reference_id: PMID:19133992
    supporting_text: PDE4 blunts the beta(1)-adrenoceptor-mediated inotropic effects.
- description: C-terminal PDZ ligand binds PDZ scaffolds (MAGI-3, MAGI-2, PSD-95, GOPC) and RAPGEF2, controlling
    receptor trafficking and coupling cAMP to Ras activation.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:16316992
    supporting_text: The beta1AR carboxyl terminus was found to bind specifically to the first PDZ domain
      of MAGI-3, with the last four amino acids (E-S-K-V) of beta1AR being the key determinants of the
      interaction.
  - reference_id: PMID:12391161
    supporting_text: The beta1 adrenergic receptor (beta1-AR) binds to the PDZ domain of the cyclic AMP
      (cAMP)-dependent Ras exchange factor, CNrasGEF, via its C-terminal SkV motif.
suggested_questions:
- question: Is the landiolol-induced, Rho-kinase-dependent tracheal contraction (PMID:18306009) mediated
    by Adrb1 at all, given the 700 microM concentration? If not, the Rho signal transduction and smooth-muscle-contraction
    rows should be removed.
- question: Should the human/mouse UniProt IMP annotations to GO:0045187 be re-keyed from PMID:25083013
    (BHLHE41) to PMID:31473062 (ADRB1 short-sleep variant)?
- question: Does PMID:11408541 contain beta1-specific data on L-type Ca2+ current that justifies the rat
    IDA to GO:1905665, or was the row intended for Adrb2?
suggested_experiments:
- hypothesis: In rat cardiomyocytes, the PDZ ligand-dependent beta1-RAPGEF2 interaction routes cAMP to
    Ras/ERK activation and contributes to beta1-specific hypertrophy.
  description: Knock in a C-terminal V466A mutation in rat Adrb1 (abolishing PDZ binding) and compare
    isoproterenol-induced Ras-GTP, ERK1/2 activation, cAMP and hypertrophy in neonatal cardiomyocytes
    and in vivo.
  experiment_type: genetic perturbation with signalling readouts
