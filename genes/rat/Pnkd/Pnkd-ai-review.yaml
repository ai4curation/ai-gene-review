      supporting_text: introduction of a human PNKD-L transgene into the same null background
        shows no rescue of SLG metabolism
    - &id002
      reference_id: file:rat/Pnkd/Pnkd-bioinformatics/RESULTS-rereview.md
      supporting_text: '| Q69ZP3 | 385 | 336 | 1-340 : 1-340 (328); 341-352 : 356-367 (6);
        353-369 : 369-385 (2) |'
    - reference_id: file:rat/Pnkd/Pnkd-bioinformatics/RESULTS-rereview.md
      supporting_text: '| B4F7D2 | PF16123 | 292 | 329 |'
    - reference_id: file:rat/Pnkd/Pnkd-deep-research-falcon.md
