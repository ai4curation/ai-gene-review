- term:
    id: GO:0051596
    label: methylglyoxal catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR017782
  review:
    action: REMOVE
    summary: >-
      InterPro2GO propagation of the glyoxalase-II pathway role to a PNKD-subfamily
      protein. PNKD-L does not perform the glyoxalase-II step of methylglyoxal
      detoxification in vivo, and PAINT did not propagate any glyoxalase-pathway
      process term to the PNKD branch.
    reason: >-
      The pathway step this term implies is S-D-lactoylglutathione hydrolysis, which
      HAGH performs and PNKD-L does not: a human PNKD-L transgene fails to restore SLG
      metabolism in HAGH-null flies, and the authors conclude PNKD-L does not use SLG as
      an in vivo substrate. In PTHR11935 the only process IBD (GO:0006749 glutathione
      metabolic process) sits on the HAGH-specific node PTN002631193, not on the PNKD
      subfamily. B4F7D2 belongs to the PNKD-related subfamily SF116, and its divergent
      C-terminus makes HAGH-like substrate handling less, not more, likely. A possible
      role of PNKD-L in detoxifying an unknown alpha-hydroxythioester is a hypothesis,
      not a methylglyoxal catabolic process.
    supported_by:
    - *id001
    - reference_id: PMID:21487022
      supporting_text: further supporting the idea that PNKD-L does not use SLG as an
        in vivo substrate
    - *id002
    - reference_id: file:rat/Pnkd/Pnkd-deep-research-falcon.md
      supporting_text: PNKD may contribute indirectly to neuronal glutathione/redox homeostasis,
        but it is not established as a canonical methylglyoxal-detoxifying glyoxalase II.
