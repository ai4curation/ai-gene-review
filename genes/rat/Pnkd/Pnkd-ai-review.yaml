core_functions:
- description: >-
    Probable thioesterase with a zinc-dependent metallo-beta-lactamase active site and unknown
    physiological substrate. It is related to glyoxalase II but is not a physiological
    hydroxyacylglutathione hydrolase. B4F7D2 retains the complete catalytic domain and all zinc
    ligands but lacks the conserved C-terminal segment, so substrate binding by this product is
    unverified.
  molecular_function:
    id: GO:0016790
    label: thiolester hydrolase activity
  supported_by:
  - reference_id: PMID:21487022
    supporting_text: PNKD-L has extremely low but consistent SLG hydrolysis activity
  - reference_id: file:rat/Pnkd/Pnkd-bioinformatics/RESULTS.md
    supporting_text: B4F7D2 is identical to rat RefSeq NP_001128222.1 (isoform 1, 385 aa) over residues
      1-328; after that the two C-termini are unrelated.
suggested_questions:
- question: Is the BC168228 retained-intron transcript that encodes B4F7D2 translated in rat tissues,
    or is it removed by nonsense-mediated decay?
- question: What is the physiological thioester substrate of the PNKD metallo-beta-lactamase domain,
    and does PNKD-L hydrolyse an alpha-hydroxythioester other than S-D-lactoylglutathione?
- question: Should the mitochondrion placement for PNKD (PAINT node PTN000940186) be reconciled with
    the synaptic plasma-membrane localization of neuronal PNKD-L?
suggested_experiments:
- hypothesis: The PNKD metallo-beta-lactamase domain hydrolyses an unidentified cellular thioester.
  description: Purify zinc-loaded rat PNKD isoform 1 and the B4F7D2 variant, then screen glutathione and
    CoA thioesters and run untargeted metabolomics on Pnkd-null versus wild-type brain to identify an
    accumulating substrate.
  experiment_type: enzyme substrate screen and metabolomics
