id: B4F7D2
gene_symbol: Pnkd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Pnkd encodes PNKD (myofibrillogenesis regulator 1), a member of the glyoxalase II-related
  branch of the metallo-beta-lactamase fold family (PANTHER PTHR11935:SF116, PNKD-related
  subfamily) that is distinct from hydroxyacylglutathione hydrolase (HAGH). The long neural
  isoform carries a unique N-terminal region followed by a zinc-binding metallo-beta-lactamase
  domain. Studies of the human and mouse orthologs show that PNKD hydrolyses
  S-D-lactoylglutathione only at a very low rate and cannot substitute for glyoxalase II, so it is
  regarded as a thioesterase whose physiological substrate is unknown. In neurons PNKD is
  membrane-associated and synaptic. It binds the active-zone scaffolds RIM1 and RIM2 and
  suppresses synaptic vesicle exocytosis, and mutations in its N-terminus cause paroxysmal
  non-kinesigenic dyskinesia. The B4F7D2 product (369 residues) is identical to rat PNKD isoform 1
  over residues 1-328, including all zinc ligands. Its last 41 residues are encoded by a retained
  intron and replace the conserved 57-residue C-terminus.
existing_annotations:
- term:
    id: GO:0004416
    label: hydroxyacylglutathione hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017782
  review:
    action: MODIFY
    summary: >-
      The InterPro2GO mapping from the glyoxalase II family signature IPR017782 cannot tell the
      PNKD subfamily apart from true HAGH enzymes. Human PNKD-L turns over S-D-lactoylglutathione
      only at a very low rate and does not rescue HAGH-null flies. The authors conclude that it
      does not catalyse the glyoxalase II reaction. In PAINT, PTHR11935 places GO:0004416 at a
      HAGH-type node (PTN000232795) that human and mouse PNKD do not inherit. The parent term
      GO:0016790 thiolester hydrolase activity is placed at the deeper node PTN004322580, which
      PNKD orthologs in the same subfamily (SF116) do inherit. B4F7D2 keeps the full catalytic
      domain and all seven zinc ligands. The function supported for this product is therefore
      the generic thioesterase activity, not the specific glyoxalase II activity.
    reason: >-
      Over-specific family transfer. The PAINT phylogeny excludes PNKD from the glyoxalase II
      clade, and direct biochemistry shows that PNKD-L is not a physiological HAGH. Generalize
      to the parent activity, thiolester hydrolase activity, which PAINT assigns to the PNKD
      subfamily and which is consistent with the low measured thioester turnover.
    proposed_replacement_terms:
    - id: GO:0016790
      label: thiolester hydrolase activity
