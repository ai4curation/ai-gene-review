- term:
    id: GO:0051596
    label: methylglyoxal catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR017782
  review:
    action: REMOVE
    summary: >-
      Methylglyoxal catabolism here would mean that PNKD performs the glyoxalase II step,
      hydrolysing S-D-lactoylglutathione. Human PNKD-L fails to do this in a physiologically
      meaningful way and does not restore SLG metabolism in a HAGH-null background. PAINT assigns
      the HAGH pathway-level term (GO:0006749 glutathione metabolic process, node PTN002631193)
      only to the HAGH clade and not to PNKD. Knockout mice have lower cortical glutathione, but
      that is a downstream redox phenotype. It does not show that PNKD catalyses a step of
      methylglyoxal breakdown.
    reason: >-
      The IEA is an InterPro2GO family-level mapping, and both direct biochemistry and the PAINT
      tree placement contradict it for the PNKD subfamily. No evidence shows that PNKD performs
      any step of methylglyoxal catabolism.
    supported_by:
    - reference_id: PMID:21487022
      supporting_text: does not catalyze the same reaction
    - reference_id: PMID:21487022
      supporting_text: introduction of a human PNKD-L transgene into the same null background
        shows no rescue of SLG metabolism
    - reference_id: file:rat/Pnkd/Pnkd-deep-research-falcon.md
      supporting_text: PNKD may contribute indirectly to neuronal glutathione/redox homeostasis,
        but it is not established as a canonical methylglyoxal-detoxifying glyoxalase II.
