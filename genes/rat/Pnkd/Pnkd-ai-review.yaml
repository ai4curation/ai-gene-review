id: B4F7D2
gene_symbol: Pnkd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Rat Pnkd (paroxysmal nonkinesigenic dyskinesia protein, also called myofibrillogenesis
  regulator 1) encodes a glyoxalase-II-related metallo-beta-lactamase-fold protein of the
  PNKD-related subfamily, distinct from the canonical hydroxyacylglutathione hydrolase
  HAGH. The 369-residue B4F7D2 product is an alternatively spliced Pnkd isoform (identical
  to the Ensembl model A0A0G2JTS8) that is collinear with the brain-enriched long isoform
  PNKD-L over residues 1-340, including the N-terminal region that carries the
  disease-mutated alanines and the hydrophobic segment, and the complete
  metallo-beta-lactamase domain with all seven zinc ligands; its last 29 residues are a
  divergent tail that replaces the C-terminal half of the HAGH_C helical domain. PNKD-L
  proteins are probable zinc-dependent thioesterases: they hydrolyse the glyoxalase-II
  substrate S-D-lactoylglutathione only at a very low rate and cannot replace HAGH in
  vivo, so the physiological substrate, probably another alpha-hydroxythioester, is
  unknown. In neurons PNKD-L is membrane-associated at synapses, binds the active-zone
  proteins RIM1 and RIM2 and restrains synaptic-vesicle exocytosis; mitochondrial
  versus plasma-membrane localization of the long isoform is disputed. Whether this
  particular alternative product is expressed as protein, folds and shares these
  properties has not been tested.
existing_annotations:
- term:
    id: GO:0004416
    label: hydroxyacylglutathione hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017782
  review:
    action: MODIFY
    summary: >-
      Over-specific substrate assignment from the InterPro HAGH signature. The PNKD
      fold retains the zinc ligands and supports a generic thiolester hydrolase
      activity, but S-D-lactoylglutathione is not a physiological substrate of PNKD-L.
    reason: >-
      In PAINT (PTHR11935) the curator placed GO:0016790 thiolester hydrolase activity
      at the family root node PTN004322580, so it descends to the PNKD-related subfamily
      (SF116, which contains B4F7D2, mouse Q69ZP3 and human Q8N490; human and mouse PNKD
      carry that IBA), whereas GO:0004416 was placed at PTN000232795, a node that does
      not include the PNKD branch (neither human nor mouse PNKD receives the GO:0004416
      IBA). That omission is a deliberate phylogenetic decision and matches the
      biochemistry: human PNKD-L turns S-D-lactoylglutathione over only at a very low
      rate and a PNKD-L transgene does not rescue SLG metabolism in HAGH-null flies.
      B4F7D2 is collinear with PNKD-L through residue 340 and keeps all seven Zn(2+)
      ligands (H172, H174, D176, H177, H229, D253, H291), so the parent thiolester
      hydrolase activity is the defensible term. Caveat: the divergent C-terminal tail
      truncates the HAGH_C helical domain (Pfam PF16123 292-329 versus 292-380 in PNKD-L),
      the region that in HAGH contributes to substrate binding, and no activity has been
      measured for this isoform.
    proposed_replacement_terms:
    - id: GO:0016790
      label: thiolester hydrolase activity
    supported_by:
    - reference_id: PMID:21487022
      supporting_text: We show that PNKD-L recognizes the same substrate in this pathway
        (SLG), but catalyzes the same reaction as HAGH at a very low level
    - reference_id: PMID:21487022
      supporting_text: PNKD-L has extremely low but consistent SLG hydrolysis activity
    - &id001
