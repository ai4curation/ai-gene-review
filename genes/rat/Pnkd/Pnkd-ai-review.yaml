- term:
    id: GO:0051596
    label: methylglyoxal catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR017782
  review:
    action: UNDECIDED
    summary: 'The best direct paralog comparison argues against treating PNKD-L as the glyoxalase-II step
      of methylglyoxal detoxification: it fails HAGH complementation. However, the exact rat product has
      different internal and terminal sequence, and a contribution to redox or methylglyoxal responses
      through another mechanism is not resolved. It is not assigned this pathway as a core function.'
    supported_by:
