  findings: []
- id: PMID:21487022
  title: Mutations in PNKD causing paroxysmal dyskinesia alters protein cleavage and stability.
  findings:
  - statement: Human PNKD-L has weak measurable S-D-lactoylglutathione hydrolysis in vitro, rather than
      the robust HAGH activity; no complete absence of hydrolysis is claimed.
    supporting_text: PNKD-L has extremely low but consistent SLG hydrolysis activity
  - statement: Human PNKD-L does not restore lactoylglutathione metabolism in HAGH-null flies, arguing
      against physiological equivalence to glyoxalase II.
    supporting_text: introduction of a human PNKD-L transgene into the same null background shows no rescue
      of SLG metabolism
  - statement: Tagged and untagged human PNKD-L in neuronal-derived cells support membrane association;
      this finding does not resolve localization of the altered rat B4F7D2 product.
    supporting_text: the results suggest that PNKD-L is a membrane-associated protein.
  - statement: The physiological PNKD-L substrate is proposed to be an unknown alpha-hydroxythioester.
    supporting_text: Sequence alignment and enzyme kinetics suggest that PNKD-L substrate may be an (as
      yet, unknown) α-hydroxythioester
  - statement: Overexpressed PNKD-L did not co-localize with mitochondria in Cos7 cells, contradicting
      the mitochondrial localization reported by Ghezzi et al.
    supporting_text: When overexpressed, both PNKD-L–FLAG and PNKD-L–GFP fusion proteins show strong cellular
      membrane-localization patterns in Cos7 cells, and no co-localization with mitochondria was found
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary report checked against the cached full text; it is the direct HAGH/PNKD-L biochemical
      and complementation comparison and also addresses the localization dispute.
