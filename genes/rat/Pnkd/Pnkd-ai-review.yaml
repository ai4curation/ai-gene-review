core_functions:
- description: >-
    Probable zinc-dependent thiolester hydrolase of the PNKD-related branch of the
    glyoxalase-II family. The conserved metallo-beta-lactamase domain and binuclear zinc
    site support thioester hydrolysis, with only trace activity on
    S-D-lactoylglutathione; the physiological substrate is unknown, and the activity of
    this C-terminally divergent splice product has not been measured.
  molecular_function:
    id: GO:0016790
    label: thiolester hydrolase activity
  supported_by:
  - reference_id: PMID:21487022
    supporting_text: We show that PNKD-L recognizes the same substrate in this pathway (SLG), but catalyzes
      the same reaction as HAGH at a very low level
  - reference_id: file:rat/Pnkd/Pnkd-bioinformatics/RESULTS-rereview.md
    supporting_text: '| 253 | D | D |'
  - reference_id: file:rat/Pnkd/Pnkd-bioinformatics/RESULTS-rereview.md
    supporting_text: '| 291 | H | H |'
suggested_questions:
- question: Does the 369-residue rat product retain a physiological thioesterase substrate or interact
    with synaptic release proteins, and where does the endogenous product localize?
- question: Is the B4F7D2 / A0A0G2JTS8 transcript, with its alternative 3' coding sequence, translated
    in rat brain, and does the truncated HAGH_C domain still fold and bind zinc?
- question: Is PNKD-L mitochondrial (Ghezzi et al. 2009, and the PAINT mitochondrion IBD on PTN000940186)
    or plasma-membrane/synaptic (Shen et al. 2011; Shen et al. 2015)? The answer determines whether the
    IBA mitochondrion annotation on the PNKD clade should stand.
suggested_experiments:
- description: Express and purify B4F7D2 alongside rat PNKD-L, measure metal content and thioesterase
    activity against a panel of alpha-hydroxythioesters, and use untargeted metabolomics of Pnkd-null
    rat brain to identify the accumulating substrate.
