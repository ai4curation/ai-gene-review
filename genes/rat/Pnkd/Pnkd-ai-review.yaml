id: B4F7D2
gene_symbol: Pnkd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Rat Pnkd encodes a metallo-beta-lactamase-fold protein related to hydroxyacylglutathione
  hydrolase. The 369-residue B4F7D2 product retains the PNKD catalytic-domain fold but differs internally
  and at its C-terminus from the longer rat product. PNKD proteins have isoform-dependent localization
  and a neuronal role in regulating synaptic release; the physiological hydrolytic substrate and the function
  of this particular product are unresolved.
