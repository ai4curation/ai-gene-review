  - InterPro:IPR017782
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The conserved PNKD fold is not sufficient for a physiological HAGH substrate assignment.
      Human PNKD-L has extremely weak lactoylglutathione hydrolysis and fails to rescue HAGH-null fly
      extracts. Thus the reaction is not absolutely absent in vitro, but using it as the functional annotation
      of this altered rat product overstates substrate and biological-role evidence.
    supported_by:
    - reference_id: PMID:21487022
      supporting_text: PNKD-L has extremely low but consistent SLG hydrolysis activity
    - &id001
      reference_id: PMID:21487022
      supporting_text: introduction of a human PNKD-L transgene into the same null background shows no
        rescue of SLG metabolism
    - &id002
      reference_id: file:rat/Pnkd/Pnkd-bioinformatics/RESULTS.md
