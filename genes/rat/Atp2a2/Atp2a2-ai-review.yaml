    label: autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002871902
  - UniProtKB:P16615
  review:
    summary: IBA for autophagosome assembly from the PAINT node shared with human SERCA2.
    action: KEEP_AS_NON_CORE
    reason: Human SERCA2 (P16615) is the donor. In mammalian cells VMP1 binds SERCA, keeps PLN/SLN off it and so
      promotes its Ca2+-pump activity, which controls the dissociation of ER-isolation membrane contacts during
      autophagosome formation (PMID:28890335). SERCA2 therefore contributes its pump activity to a step of autophagosome
      biogenesis, but this is a regulatory, context-specific role beside its housekeeping Ca2+-loading function;
      kept as non-core. The IBA node is seeded by human P16615 (UniProt IDA, PMID:28890335); rat Atp2a2 lies inside
      that clade with no evidence of divergence.
    supported_by:
    - &id001
      reference_id: PMID:28890335
      supporting_text: VMP1 controls contact formation by promoting SERCA
    - &id002
      reference_id: PMID:28890335
      supporting_text: During autophagosome formation in mammalian cells, isolation membranes (IMs; autophagosome
        precursors) dynamically contact the ER.
