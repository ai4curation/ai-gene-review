id: P11507
gene_symbol: Atp2a2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Atp2a2 encodes SERCA2, the sarco/endoplasmic reticulum Ca2+-ATPase 2, a P-type (type IIA) ion pump
  with ten transmembrane helices that couples the hydrolysis of ATP, via a phosphorylated aspartate intermediate,
  to the transport of Ca2+ from the cytosol into the lumen of the endoplasmic and sarcoplasmic reticulum. Alternative
  splicing gives SERCA2b, the ubiquitous housekeeping ER Ca2+ pump that maintains the ER Ca2+ store in all cells,
  and SERCA2a, the isoform of heart and slow-twitch skeletal muscle. In cardiomyocytes SERCA2a re-sequesters Ca2+
  released during each beat, so its activity sets the rate of relaxation and the SR Ca2+ load available for the
  next contraction. Activity is regulated by the transmembrane micropeptide phospholamban, whose inhibition is relieved
  by PKA phosphorylation within an AKAP18delta signalling complex, and by sarcolipin, S100A1, oxidative modifications
  and other partners. SERCA2 expression is induced by ER stress through ATF6 and repressed by inflammatory NF-kB
  signalling. Beyond store loading, SERCA2 activity, promoted by VMP1, helps resolve ER-isolation membrane contacts
  during autophagosome formation, and SERCA2b associates with nascent G protein-coupled receptors during their biogenesis.
