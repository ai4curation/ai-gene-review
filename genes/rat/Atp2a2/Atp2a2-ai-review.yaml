    summary: ISO from human SERCA2 (ARUK-UCL IMP, PMID:18068335, platelet store-operated Ca2+ entry).
    action: MARK_AS_OVER_ANNOTATED
    reason: The donor study shows that SERCA2b/3 activity influences store-operated Ca2+ entry in human platelets.
