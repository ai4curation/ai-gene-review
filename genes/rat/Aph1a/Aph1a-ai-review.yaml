core_functions:
- description: Non-catalytic gamma-secretase subunit that scaffolds assembly of the presenilin/nicastrin/PEN-2
    complex and engages substrates, enabling presenilin-catalysed intramembrane cleavage of APP C-terminal
    fragments, Notch and other type I membrane proteins.
