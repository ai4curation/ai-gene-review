- id: PMID:20126630
  title: Synaptic and endosomal localization of active gamma-secretase in rat brain.
  findings:
  - statement: Aph-1aL co-fractionates with gamma-secretase components and activity in rat brain endosome-enriched
      fractions, synaptic membranes and purified synaptic vesicles.
    supporting_text: We conclude that both the synaptic membrane and the synaptic vesicle fractions have
      high γ-secretase activity and that the γ-secretase components are found also in highly pure synaptic
      vesicles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; rat brain fractionation with an Aph-1aL antibody; imaging uses an active-site
      inhibitor (labels the complex, not Aph1a specifically).
- id: PMID:20145246
  title: Aph-1 associates directly with full-length and C-terminal fragments of gamma-secretase substrates.
  findings:
  - statement: Endogenous rat Aph-1 co-immunoprecipitates with endogenous Jagged-1 in E13 rat embryo microsomes;
      Aph-1 binds APP holoprotein and CTFs, requiring His-171/His-197.
    supporting_text: we were able to observe an interaction between endogenous Jagged-1 and endogenous
      Aph-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; experiments in HEK/CHO cells, mouse brain and rat embryo microsomes;
      supports a substrate-binding/scaffold role for Aph-1.
- id: PMID:15665098
  title: Differential contribution of the three Aph1 genes to gamma-secretase activity in vivo.
  findings:
  - statement: Mouse Aph1a knockout is embryonic lethal with Notch-like defects; Aph1b/c are dispensable
      for viability.
    supporting_text: Aph1A-/- embryos show a lethal phenotype characterized by angiogenesis defects in
      the yolk sac, neuronal tube malformations, and mild somitogenesis defects.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; mouse genetics.
- id: PMID:19028695
  title: S-palmitoylation of gamma-secretase subunits nicastrin and APH-1.
  findings:
  - statement: APH-1 is S-palmitoylated, affecting stability and raft association but not substrate processing.
    supporting_text: APH-1 is S-palmitoylated at Cys(182) and Cys(245)
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only; post-translational modification context.
