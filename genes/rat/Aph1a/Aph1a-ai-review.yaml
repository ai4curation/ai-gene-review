suggested_questions:
- question: Should GO provide an informative MF term for substrate recruitment by non-catalytic intramembrane-protease
    subunits (Aph-1 binding of APP and Jagged CTFs), rather than leaving it as protein binding?
- question: Should the rat ISO transfer of endopeptidase activator activity to a constitutive gamma-secretase
    subunit be replaced by contributes_to aspartic endopeptidase activity, intramembrane cleaving?
suggested_experiments:
- description: Knock down Aph1a versus Aph1b/Aph1c in rat primary neurons and quantify synaptic versus
    endosomal gamma-secretase activity (AICD, Abeta40/42) to test whether Aph1a-containing complexes account
    for the synaptic pool.
