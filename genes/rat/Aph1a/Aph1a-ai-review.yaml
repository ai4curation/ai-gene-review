id: A0ABK0KYA7
gene_symbol: Aph1a
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Aph1a encodes gamma-secretase subunit APH-1A, a seven-pass integral membrane protein and
  essential non-catalytic subunit of the gamma-secretase intramembrane protease, together with a presenilin
  catalytic subunit, nicastrin and PEN-2. APH-1A binds nicastrin early in assembly in the endoplasmic
  reticulum and acts as a scaffold for the complex; it also associates with full-length and C-terminal
  fragments of substrates such as APP and Jagged, using conserved intramembrane histidines (His-171, His-197).
  The complex cleaves type I membrane proteins within the membrane after ectodomain shedding, releasing
  intracellular domains (AICD, NICD) and generating amyloid-beta from APP. In rat brain APH-1A is found
  with active gamma-secretase in endosome-enriched fractions, synaptic membranes and synaptic vesicles.
  Mouse Aph1a loss is embryonic
  lethal with Notch-like defects.
