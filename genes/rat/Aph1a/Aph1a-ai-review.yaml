      supporting_text: In both cases, the APP intracellular domain (AICD) is released into the cytosol
        upon γ-secretase cleavage.
    proposed_replacement_terms:
    - id: GO:0031293
      label: membrane protein intracellular domain proteolysis
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:Q96BI3
        source_status: SOURCE_BAD
        comment: Human APH1A IDA row (PMID:15274632) to ectodomain proteolysis; gamma-secretase performs
          the intramembrane cleavage after shedding, so the donor term is wrong; the human review MODIFIES
          it to GO:0031293.
