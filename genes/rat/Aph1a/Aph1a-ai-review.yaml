    label: metanephros development
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:2385110
  review:
    summary: Mouse Aph1a-derived acts-upstream annotation to metanephros development; reflects requirement
      of Aph1a-containing gamma-secretase for Notch-dependent development rather than a step Aph1a performs.
    action: KEEP_AS_NON_CORE
    reason: 'The acts_upstream_of_or_within qualifier correctly frames this as an indirect, genetic requirement:
      Aph1a null mice have pleiotropic Notch-like developmental defects, and nephrogenesis depends on
      gamma-secretase-mediated Notch signalling. Aph1a contributes through gamma-secretase, so the claim
      is true but peripheral; it is not a core process of the protein.'
    supported_by:
    - &id005
      reference_id: PMID:15665098
      supporting_text: Aph1A-/- embryos show a lethal phenotype characterized by angiogenesis defects
        in the yolk sac, neuronal tube malformations, and mild somitogenesis defects.
    - &id002
      reference_id: file:rat/Aph1a/Aph1a-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Potential subunit of the gamma-secretase complex, an endoprotease complex that
        catalyzes the intramembrane cleavage of integral proteins such as Notch receptors.
