      resource: OTHER
      requested_change: CHECK
      asserted_value: GO:0006509
      corrected_value: GO:0031293
      corrected_label: membrane protein intracellular domain proteolysis
      confidence: PROBABLE
      explanation: The source human APH1A annotation (HGNC-UCL, IDA, PMID:15274632) to GO:0006509 membrane
        protein ectodomain proteolysis is propagated to rat Aph1a by RGD ISO. Gamma-secretase performs
        intramembrane cleavage of already-shed C-terminal stubs, releasing intracellular domains; ectodomain
