- term:
    id: GO:0006509
    label: membrane protein ectodomain proteolysis
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q96BI3
  review:
    summary: Ectodomain proteolysis transferred from a human IDA; gamma-secretase cleaves within the membrane
      after ectodomain shedding by other proteases and releases intracellular domains, not ectodomains.
    action: MODIFY
    reason: GO:0006509 is defined as cleavage releasing the ectodomain, which is performed by alpha/beta-secretases
      (sheddases), not by gamma-secretase. The intended process is intramembrane cleavage releasing the
      intracellular domain (AICD, NICD), GO:0031293, which the gene already carries. The human source
      row (HGNC-UCL, PMID:15274632) appears to use the wrong term.
