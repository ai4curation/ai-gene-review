core_functions:
- description: Pore-forming subunit (isoform ASIC2a) of trimeric proton-gated, Na+-selective cation channels
    at the neuronal plasma membrane, alone or with ASIC1/ASIC3, depolarizing cells on extracellular acidification.
  molecular_function: *id001
  directly_involved_in:
  - *id005
  - id: GO:0071468
    label: cellular response to acidic pH
  locations:
  - *id007
  supported_by:
  - *id002
  - *id004
  - reference_id: PMID:19074149
    supporting_text: Substitution of either one the aromatic residues by Ala or Gly in rat ASIC2a and
      ASIC3 also produced non-functional channels.
- description: Through its C-terminal PDZ-binding motif, ASIC2a binds the PDZ scaffold PSD-95 and thereby
    targets ASIC1a-containing channels to dendritic spines (inferred from mouse); the binding, not the
    conductance, carries out this targeting.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  directly_involved_in:
  - id: GO:0035418
    label: protein localization to synapse
  locations:
  - id: GO:0043197
    label: dendritic spine
  supported_by:
  - *id010
  - reference_id: PMID:19571134
    supporting_text: These data indicate that ASIC2a associates with PSD-95, at least in part, through
      its PDZ-binding motif.
  - reference_id: PMID:19571134
    supporting_text: Our data indicate that ASIC2a binds PSD-95 through its C-terminal PDZ-binding motif.
suggested_questions:
- question: Does ASIC2 contribute directly to mechanotransduction (touch, baroreceptors, myogenic tone),
    or do knockout phenotypes reflect loss of acid-evoked modulation or of ASIC1a/ASIC3 trafficking?
- question: What is the in vivo subunit stoichiometry of ASIC2b-containing heteromers in rat DRG and taste
    cells?
suggested_experiments:
- hypothesis: ASIC2a targeting of ASIC1a to spines requires its C-terminal PDZ-binding motif.
  description: Express PDZ-motif-truncated rat ASIC2a in Asic2-null hippocampal neurons and measure spine
    ASIC1a and acid-evoked spine Ca2+ responses.
