id: Q62962
gene_symbol: Asic2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Acid-sensing ion channel 2 (ASIC2; MDEG/BNC1), a two-transmembrane subunit of the DEG/ENaC
  family that assembles into trimeric proton-gated, Na+-selective cation channels at the neuronal plasma
  membrane. Isoform ASIC2a forms homomeric channels activated only by strong acidification (pH50 around
  4-5) and heteromers with ASIC1 and ASIC3 with distinct pH sensitivity, kinetics and pharmacology; isoform
  ASIC2b is not proton-gated alone but acts as a modulatory subunit, e.g. of ASIC3 in sensory neurons,
  where PICK1 binding to its C terminus mediates PKC upregulation. Through PSD-95 binding ASIC2a targets
  ASIC1a-containing channels to dendritic spines. ASIC2 is widely expressed in brain, sensory ganglia,
  retina and taste cells, and knockout studies implicate it in touch sensation, the arterial baroreceptor
  reflex, myogenic arterial tone and retinal function.
