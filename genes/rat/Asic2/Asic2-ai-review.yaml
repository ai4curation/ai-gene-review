- term:
    id: GO:0030165
    label: PDZ domain binding
  evidence_type: IC
  original_reference_id: PMID:19571134
  qualifier: enables
  review:
    summary: ASIC2a binds the PDZ scaffold PSD-95 through its C-terminal PDZ-binding motif, which is how
      it targets ASIC1a-containing channels to dendritic spines (shown for mouse ASIC2a).
    action: NEW
    reason: In the mouse study PSD-95 co-immunoprecipitated ASIC2a, and replacing the C-terminal Ile-Ala-Cys
      with Gly-Ala-Ala reduced both the interaction and PSD-95-driven spine enrichment. The rat ASIC2a sequence
      (Q62962-1) ends in the same Ile-Ala-Cys motif, so the binding activity is inferred for rat. This is
      the molecular activity behind the spine-targeting core function, which the ISO process rows
      (protein localization to synapse) already capture; the channel conductance does not do the targeting.
    supported_by:
    - reference_id: PMID:19571134
      supporting_text: These data indicate that ASIC2a associates with PSD-95, at least in part, through
        its PDZ-binding motif.
    - reference_id: PMID:19571134
      supporting_text: Our data indicate that ASIC2a binds PSD-95 through its C-terminal PDZ-binding motif.
