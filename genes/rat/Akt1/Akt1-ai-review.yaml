    reason: 'The abstract''s finding runs opposite to the annotated direction: Akt mediates the statin-induced,
      NO-dependent reduction of vasoconstrictor responses. That affirmatively supports negative regulation
      of vasoconstriction, so the row is modified to GO:0045906 rather than removed. The pan-Akt1/2 inhibitor
      caveat applies either way; a curator should confirm against the full text.'
    proposed_replacement_terms:
