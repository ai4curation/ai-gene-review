        source_status: SUPPORTS_TRANSFER
        comment: 'Traced against the mouse Akt1 GOA record (UniProtKB/P31750, QuickGO retrieved 2026-09-01):
          donor support is IMP from PMID:15937334, so the donor annotation is experimentally grounded. Transfers
          to rat as a regulatory role.'
      - source_id: UniProtKB:P31749
        source_label: human AKT1
        source_status: SUPPORTS_TRANSFER
        comment: 'Traced against the human AKT1 GOA record (UniProtKB/P31749, QuickGO retrieved 2026-09-01):
          donor support is IDA from PMID:23512198, so the donor annotation is experimentally grounded. Transfers
          to rat as a regulatory role.'
    reason: 'Re-reviewed 2026-10-17: a regulation term is the right way to record the effect of AKT1 on
