core_functions:
- description: AKT1 is the rat RAC-alpha/PKB alpha serine/threonine kinase that transduces
    phosphatidylinositol 3-kinase signals to regulate insulin-responsive metabolism,
    growth, and survival programs through phosphorylation of downstream substrates.
  supported_by:
  - reference_id: UniProtKB:P47196
    supporting_text: AKT1 is one of 3 closely related serine/threonine-protein kinases
      (AKT1, AKT2 and AKT3) called the AKT kinase, and which regulate many processes
      including metabolism, proliferation, cell survival, growth and angiogenesis
      (PubMed:9228007, PubMed:11882383, PubMed:21432781, PubMed:21620960).
  - reference_id: UniProtKB:P47196
    supporting_text: AKT is responsible of the regulation of glucose uptake by mediating
      insulin-induced translocation of the SLC2A4/GLUT4 glucose transporter to the
      cell surface (PubMed:10400692, PubMed:9632753).
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0043491
    label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  - id: GO:0008286
    label: insulin receptor signaling pathway
suggested_questions:
- question: 'GO:0045907 positive regulation of vasoconstriction (rat IMP, PMID:21532183): the abstract
    reports that Akt mediates the statin-induced, NO-dependent reduction of constrictor responses. Should
    RGD replace the term with GO:0045906 negative regulation of vasoconstriction?'
- question: 'PMID:7488143 protein kinase C binding (IPI): the WITH/FROM fields resolve to RGD:62390 (rat
    Akt3, the kinase cloned in that paper) and RGD:2802 (Hmgb1) rather than to a PKC isoform. Should RGD
    correct the WITH entities to the PKC subspecies actually pulled down?'
- question: 'GO:0045792 negative regulation of cell size (IDA, PMID:16286931): this conflicts with the
    growth-promoting role of AKT1. Does the full text support the negative direction, or is the annotation
    a direction error?'
