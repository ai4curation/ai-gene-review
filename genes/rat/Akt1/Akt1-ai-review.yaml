core_functions:
- description: AKT1 is the rat RAC-alpha/PKB alpha serine/threonine kinase that transduces
    phosphatidylinositol 3-kinase signals to regulate insulin-responsive metabolism,
    growth, and survival programs through phosphorylation of downstream substrates.
  supported_by:
  - reference_id: UniProtKB:P47196
    supporting_text: AKT1 is one of 3 closely related serine/threonine-protein kinases
      (AKT1, AKT2 and AKT3) called the AKT kinase, and which regulate many processes
      including metabolism, proliferation, cell survival, growth and angiogenesis
      (PubMed:9228007, PubMed:11882383, PubMed:21432781, PubMed:21620960).
  - reference_id: UniProtKB:P47196
    supporting_text: AKT is responsible of the regulation of glucose uptake by mediating
      insulin-induced translocation of the SLC2A4/GLUT4 glucose transporter to the
      cell surface (PubMed:10400692, PubMed:9632753).
