- term:
    id: GO:0070585
    label: protein localization to mitochondrion
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P31749
  review:
    summary: 'New ISO row: protein localization to mitochondrion from human AKT1, whose annotation
      rests on IMP in PMID:23962723. That study found that parkin recruitment to depolarized mitochondria
      was reduced by pharmacological AKT inhibition, proposing Akt-dependent hexokinase recruitment
      as a step.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The donor evidence uses a pan-AKT inhibitor in a mitophagy context and places AKT
      upstream of hexokinase localization; AKT1 does not itself carry out protein localization
      to mitochondria, and the transfer to rat overstates a narrow indirect effect.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:P31749
        source_label: human AKT1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human AKT1 carries this term by IMP (PMID:23962723) (QuickGO, checked 2026-10-10);
          the experiment used AKT inhibition, not isoform-specific loss.
    supported_by:
    - reference_id: PMID:23962723
      supporting_text: Mitochondrial parkin recruitment was attenuated with AKT inhibition
