- term:
    id: GO:0110099
    label: negative regulation of calcium import into the mitochondrion
  evidence_type: IMP
  original_reference_id: PMID:24601882
  review:
    summary: 'Rat IMP (PMID:24601882): in cardiomyocytes under ischemia-reperfusion, mitochondria-targeted
      AKT1 signaling suppressed mitochondrial calcium overload.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The abstract supports the term in this stress model, so REMOVE is not justified. It
      is a downstream consequence of mitochondrial AKT1 signaling observed with targeted constructs
      during injury, and generalizing it to a regulatory role in mitochondrial calcium import
      overshoots the evidence. UniProt describes AKT1 phosphorylation of MICU1 as regulating mitochondrial
      calcium uptake in another context, so the direction may depend on context. Treated like
      the sibling rows from this paper.
    supported_by:
    - reference_id: PMID:24601882
      supporting_text: Mitochondrial AKT1 signaling played a protective role against apoptosis
        and necrosis during ischemia-reperfusion stress, suppressed mitochondrial calcium overload,
        and alleviated mitochondrial membrane depolarization.
    - reference_id: UniProtKB:P47196
      supporting_text: Acts as a regulator of mitochondrial calcium uptake by mediating phosphorylation
        of MICU1 in the mitochondrial intermembrane space
  qualifier: involved_in
