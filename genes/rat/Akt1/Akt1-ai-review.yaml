    id: GO:0051897
    label: positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal
      transduction
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: The rat ISO traces to human AKT1, where this term carries direct experimental
      support (IDA PMID:40285646). The biology is real, but AKT1 is itself the effector
