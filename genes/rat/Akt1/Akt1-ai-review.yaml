- term:
    id: GO:0099104
    label: potassium channel activator activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: 'The rat ISS transfers from human AKT1, where the term rests on IDA (PMID:33505021): AKT and
      the pore protein TMEM175 form the growth-factor-activated lysosomal K+ channel complex lysoK(GF),
      and AKT opens the channel.'
    action: KEEP_AS_NON_CORE
    reason: 'Re-reviewed 2026-10-17 on re-grounding: the earlier over-annotation call said the term recasts
      a kinase-substrate event as an activator activity, but the donor paper shows the opposite: TMEM175
      is opened by conformational changes in AKT, not by its catalytic activity, and UniProt records this
      for rat AKT1 by similarity. Potassium channel activator activity is therefore the accurate MF for
      this non-catalytic role. Kept as non-core, because AKT1''s defining activity is protein serine/threonine
      kinase activity.'
    supported_by:
    - reference_id: PMID:33505021
      supporting_text: TMEM175 is opened by conformational changes in, but not the catalytic activity of,
        AKT
    - reference_id: UniProtKB:P47196
      supporting_text: acts by promoting TMEM175 channel activation, independently of its protein kinase
        activity
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:P31749
        source_label: human AKT1
        source_status: SUPPORTS_TRANSFER
        comment: Human AKT1 carries the term by IDA (PMID:33505021); the paper also measured native lysosomal
          K+ currents in mouse neurons, so the role is not human-specific.
  qualifier: enables
  supporting_entities:
  - UniProtKB:P31749
