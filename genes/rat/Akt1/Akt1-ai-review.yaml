- id: UniProtKB:P47196
  title: UniProt entry for rat AKT1 (RAC-alpha serine/threonine-protein kinase)
  findings: []
- id: file:rat/Akt1/Akt1-deep-research-falcon.md
  title: Falcon deep research report on rat Akt1 (RAC-alpha Ser/Thr kinase / PKB alpha,
    UniProt P47196)
  findings:
  - statement: AKT1/PKBalpha is an AGC-family serine/threonine protein kinase that
      acts as a central node downstream of growth factor and insulin signaling, exerting
      its effects by phosphorylating protein substrates. This is the defining core
      molecular function.
    supporting_text: AKT1 (Protein kinase B alpha; PKBα) is a **serine/threonine protein
      kinase** in the **AGC kinase family** that functions as a central signaling
      node downstream of growth factor/insulin pathways, regulating survival, growth,
      metabolism, and cytoskeletal programs by **phosphorylating protein substrates**.
    reference_section_type: OTHER
  - statement: AKT1 catalyzes ATP-dependent phosphorylation of Ser/Thr residues on
      protein substrates (EC 2.7.11.1), with representative substrates including GSK3
      and FOXO transcription factors.
    supporting_text: AKT1 catalyzes **ATP-dependent phosphorylation of serine/threonine
      residues** in protein substrates (EC **2.7.11.1**, protein-serine/threonine
      kinase).
    reference_section_type: OTHER
  - statement: AKT1 is recruited to membranes via its PH domain binding PIP3 and PI(3,4)P2
      generated by PI3K, then is activated by PDK1 phosphorylation of Thr308 and mTORC2
      phosphorylation of Ser473.
    supporting_text: '**PDK1 phosphorylates Thr308** in the activation loop for partial
      activation; **mTORC2 phosphorylates Ser473** in the hydrophobic motif for full
      activation/substrate tuning. **Thr450** turn-motif phosphorylation contributes
      to folding/stability.'
    reference_section_type: OTHER
  - statement: In unstimulated cells AKT1 is held in an autoinhibited PH-in conformation
      by an intramolecular PH-kinase domain interface; full activation requires both
      phosphoinositide binding and regulatory phosphorylation.
    supporting_text: In unstimulated cells, AKT1 adopts a **PH-in autoinhibited conformation**
      in which a **PH–kinase domain interface** masks the active state and sequesters
      the lipid-binding site.
    reference_section_type: OTHER
  - statement: AKT1 sits in the canonical PI3K-AKT-mTOR axis; activated AKT1 phosphorylates
      substrates such as GSK3 and FOXO1/3a to promote survival, proliferation, metabolism,
      and anabolic growth.
    supporting_text: Activated AKT1 phosphorylates substrates including **GSK3** and
      **FOXO1/3a**, thereby promoting cell survival, proliferation, metabolism, and
      anabolic growth programs.
    reference_section_type: OTHER
  - statement: AKT1 is largely cytosolic and can be nuclear in quiescent cells, with
      active signaling concentrated at membrane compartments, especially the plasma
      membrane following PH-domain-dependent recruitment.
    supporting_text: AKT1 is largely **cytosolic (and can be nuclear) in quiescent
      cells**, but active signaling is concentrated at **membrane-associated compartments**,
      especially the **plasma membrane** and, in some models, **endosomal membranes**.
    reference_section_type: OTHER
  - statement: AKT signaling is terminated by PTEN (which removes the PIP3 membrane
      recruitment signal) and by phosphatases PP2A and PHLPP that dephosphorylate
      AKT regulatory residues.
    supporting_text: 'AKT signaling is terminated at two levels: **PTEN** removes
      the lipid signal by dephosphorylating **PIP3 to PI(4,5)P2**, preventing membrane
      recruitment; **PP2A** and **PHLPP** dephosphorylate AKT at key regulatory residues,
      especially after membrane dissociation.'
    reference_section_type: OTHER
- id: file:rat/Akt1/Akt1-hypotheses/prediction-kinase-inhibitor-activity/openscientist.md
  title: OpenScientist focused review of the GO:0030291 kinase-inhibitor prediction for rat Akt1
  findings:
  - statement: The GO:0030291 kinase-inhibitor prediction is a mechanism mistyping of Akt1's phosphorylation-dependent inhibition of GSK3.
    supporting_text: Akt1 reduces GSK3 activity enzymatically, by phosphorylation.
    reference_section_type: OTHER
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reviewed the focused OpenScientist report. It correctly treats GO:0030291 as a
      binding-based kinase-inhibitor molecular function and identifies rat Akt1 as a
      catalytic AGC-family kinase whose GSK3 inhibition is mediated by phosphorylation,
      not by a separate stoichiometric inhibitor activity.
