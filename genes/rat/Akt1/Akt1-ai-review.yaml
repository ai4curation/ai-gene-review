id: P47196
gene_symbol: Akt1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Akt1 encodes RAC-alpha serine/threonine-protein kinase (protein kinase B alpha,
  PKBalpha), an AGC-family kinase with an N-terminal pleckstrin homology (PH) domain, a central
  catalytic domain and a C-terminal regulatory tail. Downstream of growth factor and insulin
  receptors, PI3K-generated PI(3,4,5)P3 binds the PH domain and recruits Akt1 to the plasma
  membrane, where phosphorylation at Thr-308 by PDK1 and Ser-473 by mTORC2 activates it. Active
  Akt1 phosphorylates serine/threonine residues on many substrates, including GSK3, FOXO
  transcription factors, TSC2, PDE3B and BAD, thereby mediating insulin effects on glucose uptake,
  glycogen and protein synthesis, and promoting cell survival, growth and proliferation. It is
  mainly cytoplasmic and can also translocate to the nucleus and mitochondria. In rat cells and
  tissues it is activated by insulin in adipocytes and skeletal muscle, by NGF in PC12 cells and
  by IGF-1 in neurons.
