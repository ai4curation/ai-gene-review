    label: kinase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: The rat ISO traces to mouse Akt1 and human AKT1, and donor experiments
      support kinase function, but this GO term is either overly broad or chemically
      inaccurate for AKT1. AKT1 is a serine/threonine kinase, not a generic or tyrosine
      kinase.
    action: MODIFY
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: MGI:MGI:87986
        source_label: mouse Akt1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse Akt1 carries kinase activity by IDA (PMID:23886629) (QuickGO, checked
          2026-10-10); its characterised activity is protein serine/threonine kinase activity.
      - source_id: UniProtKB:P31749
        source_label: human AKT1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human AKT1 carries kinase activity by IDA (PMID:14749367) (QuickGO, checked
          2026-10-10); its characterised activity is protein serine/threonine kinase activity.
    reason: Replace the transferred ISO term with the specific serine/threonine kinase
      activity term used for AKT-family biochemistry.
    proposed_replacement_terms:
    - id: GO:0004674
      label: protein serine/threonine kinase activity
    supported_by:
    - reference_id: UniProtKB:P47196
      supporting_text: GO; GO:0016301; F:kinase activity; ISO:RGD.
  qualifier: enables
  supporting_entities:
  - MGI:MGI:87986
