description: >-
  ProTrek sequence-to-text retrieval for rat Akt1. The list is identical to mouse Akt1's - same five
  terms, same order, scores within 0.06 units - completing a three-species comparison in which the
  mouse and rat orthologs behave identically and the Drosophila ortholog fails completely. Ranks 1
  and 3 are exact GOA matches; the protein serine/threonine kinase activity that is this review's
  core function is absent, as it was for mouse. Assessment: 2 correct not novel (CNN), 1 uncertain
  (UNC).
