id: P04468
gene_symbol: Csn3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Csn3 encodes rat kappa-casein, the calcium-insensitive member of the mammal-specific
  casein family. It is a 178-residue precursor with a 21-residue signal peptide whose
  mature sequence is poorly conserved with ruminant kappa-caseins, although the signal
  peptide is highly conserved. Expression is restricted to the lactating mammary
  epithelium, rises during functional differentiation of the gland and is induced by
  prolactin; the protein is secreted into milk. Unlike the calcium-sensitive alpha-
  and beta-caseins, kappa-casein lacks a phosphate centre and does not precipitate
  with calcium; instead it sits predominantly at the surface of casein micelles, where
  its glycosylated, phosphorylated C-terminal segment provides the steric stabilization
  that keeps the calcium-sensitive caseins and their bound calcium phosphate in a
  stable colloidal suspension. The micelle surface layer is released by chymosin-type
  cleavage at a site near residue 115, which triggers micelle aggregation (clotting).
  Mouse kappa-casein knockouts fail to lactate because micelles destabilize in the
  lumen of the mammary alveoli, making kappa-casein essential for milk secretion.
