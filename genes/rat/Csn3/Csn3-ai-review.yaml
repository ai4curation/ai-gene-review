  review:
    summary: Kappa-casein stabilizes the casein micelle (a protein-calcium phosphate
      assembly) from its surface.
    action: NEW
    reason: Adopted as the closest available molecular function for kappa-casein's
      micelle surface stabilization, for consistency across the casein family reviews.
      The fit is imperfect, since GO:0140777 is defined as binding a complex subunit to
      block a dissociation factor, whereas kappa-casein provides a steric/electrostatic
