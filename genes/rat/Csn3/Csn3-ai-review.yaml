proposed_new_terms:
- proposed_name: casein micelle stabilizing activity
  proposed_definition: Binding to the surface of a casein micelle and preventing
    aggregation and precipitation of the calcium-sensitive caseins and their bound
    calcium phosphate, thereby maintaining the micelle as a stable colloidal
    suspension.
  justification: GO:0140777 protein-containing complex stabilizing activity is defined
    by blocking a dissociation factor, which does not describe kappa-casein's steric
    surface stabilization of a protein-mineral colloid against aggregation; no existing
    term captures it. Would apply to kappa-casein orthologs across mammals.
  supported_by:
  - reference_id: PMID:7979373
    supporting_text: Since kappa-casein also stabilizes the micelles against
      precipitation by Ca2+ ions, a surface position for most of the kappa-casein is
      implied.
suggested_questions:
- question: Is GO:0140777 an acceptable home for kappa-casein micelle surface
    stabilization, or should a dedicated casein micelle stabilizing activity term be
    created?
- question: Given the low sequence conservation of mature rat kappa-casein with
    ruminant kappa-caseins, does rat milk clot by chymosin-type cleavage at the
    predicted 115-116 site, and does the released C-terminal segment carry the same
    glycosylation as bovine caseinomacropeptide?
suggested_experiments:
- description: Reconstitute micelles from rat alpha- and beta-casein with calcium
    phosphate in the presence and absence of rat kappa-casein (wild type and a
    C-terminally truncated form) and measure micelle size and calcium-induced
    precipitation.
  experiment_type: in vitro reconstitution
