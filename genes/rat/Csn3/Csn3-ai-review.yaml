core_functions:
- description: Secreted casein that localizes to the surface of casein micelles and,
    through its glycosylated and phosphorylated C-terminal segment, stabilizes the
    micelle against calcium-induced aggregation of the calcium-sensitive caseins, so
    that micelles remain soluble in the mammary lumen and milk can be secreted.
