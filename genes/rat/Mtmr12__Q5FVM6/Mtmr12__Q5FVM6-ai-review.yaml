suggested_questions:
- question: Should MTMR12's noncatalytic maintenance of MTM1 be captured by a regulator MF term
    (a phosphatase-stabilizing or adaptor activity) rather than phosphatase binding plus protein
    stabilization, given that the evidence argues against an effect on MTM1 catalytic activity and
    so against GO:0019211 phosphatase activator activity (asserted by TAS for human MTMR12)?
- question: Does MTMR12 stabilize MTMR2 as it does MTM1, and is the MTMR2-MTMR12 complex relevant in
    Schwann cells or other non-muscle tissues?
suggested_experiments:
- description: Knock down or knock out Mtmr12 in rat L6 myotubes or rat skeletal muscle and measure
    MTM1 protein half-life (cycloheximide chase) and PI3P levels, to test directly in rat the
    stabilizing role shown in zebrafish and mouse cells.
- description: Immunolocalize endogenous MTMR12 with RyR1, DHPR and alpha-actinin in rat skeletal
    muscle to confirm triad/SR localization in this species.
