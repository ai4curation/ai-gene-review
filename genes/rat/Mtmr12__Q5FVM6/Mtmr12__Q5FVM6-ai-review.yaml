core_functions:
- description: >-
    Catalytically inactive myotubularin-family adapter that binds the active lipid phosphatase MTM1
    (and MTMR2), keeps MTM1 in the cytoplasm and maintains its protein abundance; in skeletal muscle
    the complex sits at triads and the sarcoplasmic reticulum. Established experimentally for the
    human, mouse and zebrafish orthologs; inferred for rat Q5FVM6 by one-to-one orthology within
    PANTHER PTHR10807:SF37, with the catalytic cysteine and arginine absent as in human MTMR12.
  supported_by:
  - reference_id: PMID:23818870
    supporting_text: suggesting myotubularin and MTMR12 interact with each other by direct
      protein-protein interactions
  - reference_id: PMID:23818870
    supporting_text: MTMR12 primarily regulates the function of myotubularin protein by affecting
      protein levels instead of modulating the enzymatic activity
  - reference_id: PMID:12847286
    supporting_text: coexpression of 3-PAP with myotubularin led to attenuation of the plasma membrane
      phenotype, associated with myotubularin relocalization to the cytosol
  - reference_id: file:rat/Mtmr12/Mtmr12-bioinformatics/RESULTS-rereview.md
    supporting_text: the catalytic cysteine and arginine are absent in every MTMR12 product
