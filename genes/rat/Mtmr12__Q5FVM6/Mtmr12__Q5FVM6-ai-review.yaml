  label: Rattus norvegicus
description: >-
  Myotubularin-related protein 12 (MTMR12; also called 3-phosphatase adapter protein, 3-PAP) is a
  748-residue catalytically inactive member of the myotubularin family of phosphoinositide
  3-phosphatases. It has an N-terminal PH-GRAM-like region, a myotubularin-like phosphatase fold
  in which the catalytic cysteine and arginine of the CX5R motif are replaced, and a C-terminal
  MTMR12-specific region. It therefore has no intrinsic lipid phosphatase activity and instead acts
  as a noncatalytic partner of active family members: it binds the lipid phosphatase MTM1
  (myotubularin) directly, also associates with MTMR2, shifts MTM1 from the plasma membrane to the
  cytoplasm, and maintains MTM1 protein abundance. In skeletal muscle the MTM1-MTMR12 complex lies
  at triads, where the sarcoplasmic reticulum meets the T-tubules, and loss of MTMR12 lowers MTM1
  levels and produces a centronuclear-myopathy-like muscle defect. These functions have been shown
  for the human, mouse and zebrafish proteins; the rat protein has not itself been assayed beyond
  proteomic detection of phosphorylation, and its functions are inferred from these orthologs in
  the same PANTHER subfamily (PTHR10807:SF37).
