- term:
    id: GO:0030017
    label: sarcomere
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0313
  review:
    summary: >-
      UniProt SubCell mapping of "Cytoplasm, myofibril, sarcomere", based on the striated staining
      of MTMR12 in mouse muscle.
    action: MODIFY
    reason: >-
      The striated pattern reflects triads, not the sarcomeric filament array: the mouse study
      reports MTMR12 restricted to triads with no colocalization with the Z-line marker
      alpha-actinin [PMID:23818870]. GO sarcomere is the filament array between Z discs, and
      GO:0030314 junctional membrane complex (synonym triad junction) is not under sarcomere in GO
      (its ancestors are sarcoplasm and protein-containing complex), so this is a lateral
      correction to the structure where the protein was actually seen. MGI curators annotated the
      same paper to sarcoplasmic reticulum, not sarcomere.
    proposed_replacement_terms:
    - id: GO:0030314
      label: junctional membrane complex
    supported_by:
    - reference_id: PMID:23818870
      supporting_text: The expression of MTMR12 was restricted to triads as no co-localization was
        observed with α-actinin at Z-lines
- term:
    id: GO:0019902
    label: phosphatase binding
  evidence_type: ISS
  original_reference_id: PMID:23818870
  review:
    summary: >-
      Proposed molecular function: direct binding of the active lipid phosphatase MTM1, and
      association with MTMR2, shown for human MTMR12 and for endogenous mouse MTMR12 in muscle.
    action: NEW
    reason: >-
      MTMR12 binding to MTM1 is direct (GST pull-down of human proteins), occurs in mouse muscle
      (endogenous co-IP), and human 3-PAP also coprecipitates MTMR2 but not MTMR6
      [PMID:23818870, PMID:12847286]. Human MTMR12 carries this only as uninformative GO:0005515
      IPI rows; phosphatase binding is the informative term. Comparator: the other inactive
      adapter subunit in the family, human MTMR9 (Q96QG7), carries GO:0019903 protein phosphatase
      binding by IPI and IBA (QuickGO, 2026-10-21), so the convention is to annotate inactive
      partners with phosphatase binding. PAINT did not place a phosphatase-binding node over
      SF37, but no MTMR12 has an experimental phosphatase-binding annotation that could seed one,
      so this absence is a missing donor rather than a curatorial exclusion. Transfer to rat is
      within PTHR10807:SF37 (one-to-one ortholog); the rat protein itself has not been tested.
    supported_by:
    - reference_id: PMID:23818870
      supporting_text: suggesting myotubularin and MTMR12 interact with each other by direct
        protein-protein interactions
    - reference_id: PMID:23818870
      supporting_text: Antibody against myotubularin co-immunoprecipitated endogenous MTMR12 protein
        showing that myotubularin and MTMR12 interact in skeletal muscles
    - reference_id: PMID:12847286
      supporting_text: 3-PAP coimmunoprecipitated with MTM1 and MTMR2 but not MTMR6
- term:
    id: GO:0050821
    label: protein stabilization
  evidence_type: ISS
  original_reference_id: PMID:23818870
  review:
    summary: >-
      Proposed process: MTMR12, by forming a complex with MTM1, maintains MTM1 protein levels;
      MTMR12 depletion lowers MTM1 protein in zebrafish and in mouse C2C12 cells, and disruption of
      the interaction by XLMTM mutations lowers both proteins.
    action: NEW
    reason: >-
      Participation test: MTMR12 is not the substrate of a stabilizing process run by another
      protein; it is the binding partner whose complex formation is itself what protects MTM1, and
      MTM1 mutations that abolish binding to MTMR12 reduce both proteins [PMID:23818870]. The
      authors conclude MTMR12 acts on MTM1 protein levels rather than on its enzymatic activity,
      which argues against GO:0019211 phosphatase activator activity. Comparator: human MTMR9
      (Q96QG7), the inactive partner of MTMR6/MTMR8, carries GO:0050821 protein stabilization by
      IDA (QuickGO, 2026-10-21). Evidence is from zebrafish, mouse cells and human patient cells,
      transferred within PTHR10807:SF37; the muscle phenotypes of zebrafish morphants are not
      annotated as processes.
    supported_by:
    - reference_id: PMID:23818870
      supporting_text: deficiency of MTMR12 results in reduced levels of myotubularin protein in
        zebrafish and mammalian C2C12 cells
    - reference_id: PMID:23818870
      supporting_text: interactions between myotubularin and MTMR12 are required for the stability of
        their functional protein complex in normal skeletal muscles
    - reference_id: PMID:23818870
      supporting_text: MTMR12 primarily regulates the function of myotubularin protein by affecting
        protein levels instead of modulating the enzymatic activity
