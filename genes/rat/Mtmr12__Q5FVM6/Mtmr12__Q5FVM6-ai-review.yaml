  review:
    summary: >-
      Membrane, propagated by PAINT from PTN000086845, an ancestral myotubularin node whose donors
      are active phosphatases (MTM1, MTMR1, MTMR2, MTMR3/4 and relatives); no MTMR12 is among the
      donors. MTMR12 has no transmembrane segment; the human protein is found on punctate
      cytoplasmic vesicles and the mouse protein partly overlaps sarcoplasmic-reticulum markers at
      triads.
    action: KEEP_AS_NON_CORE
    reason: >-
      The same node also carries GO:0004438 phosphatidylinositol-3-phosphate phosphatase activity,
      which MTMR12 orthologs do not receive, so PAINT curators pruned the catalytic term from the
      inactive branch but let the membrane term descend; that is consistent with myotubularins
      (active and inactive) acting at membrane surfaces through their PH-GRAM regions. For MTMR12
      the membrane association is peripheral and indirect (punctate vesicles in human cells,
      partial colocalization with the SR marker RyR1 in mouse muscle). No more specific membrane
      term (for example sarcoplasmic reticulum membrane) is demonstrated, so the general term is as
      precise as the evidence allows, and it is not central to the stabilizing-partner function.
    supported_by:
    - reference_id: PMID:12847286
      supporting_text: FLAG-3-PAP and FLAG-3-PAPΔSID localized in the cytosol in punctuate vesicles
    - reference_id: PMID:23818870
      supporting_text: partial co-localization of MTMR12 was observed with ryanodine receptors, a
        sarcoplasmic reticulum marker
