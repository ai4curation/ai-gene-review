suggested_questions:
- question: Rat CYP4B1 carries both omega (GO:0140981) and omega-1 (GO:0120503) medium-chain fatty acid
    hydroxylase annotations by IDA. What is the omega to omega-1 product ratio for the rat enzyme across chain
    lengths, and is either regiochemistry physiologically dominant, or should both simply be retained?
- question: Is there an endogenous medium-chain fatty acid or fatty alcohol substrate whose turnover by
    CYP4B1 matters for rat lung lipid homeostasis, or is the fatty acid oxidation role essentially a
    family-level capability while the physiologically consequential activity is protoxin bioactivation?
- question: CYP4B1 activity toward 4-ipomeanol varies enormously between species. What is the structural
    basis of that difference, and does the rat enzyme resemble the highly active rabbit form or the largely
    inactive human one?
- question: Rat Cyp4b1 transcription is androgen responsive and the enzyme is present in bladder mucosa. Does
    this sex-dependent expression translate into a measurable sex difference in susceptibility to
    CYP4B1-activated bladder carcinogens in vivo?
suggested_experiments:
- hypothesis: Rat CYP4B1 hydroxylates medium-chain fatty acids at both the omega and omega-1 positions with a
    chain-length-dependent regiochemical preference, as reported for the rabbit orthologue.
  description: Reconstitute purified recombinant rat CYP4B1 with NADPH--cytochrome P450 reductase and lipid,
    incubate with a homologous series of medium-chain fatty acids and n-alkanes (C7 to C12), and quantify the
    omega and omega-1 hydroxy products by GC-MS or LC-MS/MS to obtain the rat regioselectivity profile
    directly rather than by inference from the rabbit enzyme.
  experiment_type: reconstituted P450 assay with regiochemical product quantification
- hypothesis: The lung- and bladder-restricted toxicity of 4-ipomeanol and of aromatic-amine bladder
    carcinogens in rat is driven by local CYP4B1 rather than by hepatic P450s.
  description: Compare 4-ipomeanol and 2-aminofluorene bioactivation, adduct burden, and tissue damage in
    wild-type versus Cyp4b1-knockout rats, quantifying CYP4B1 protein in lung, bladder mucosa, and liver by
    targeted proteomics so that the damage distribution can be matched against local enzyme abundance.
  experiment_type: knockout bioactivation and adduct-burden study
- hypothesis: The species difference in 4-ipomeanol activation maps to a small number of active-site or
    heme-anchoring residues, so rat CYP4B1 can be shifted toward or away from the human activity level by
    reciprocal substitution.
  description: Express rat, rabbit, and human CYP4B1 side by side under identical conditions, measure
    4-ipomeanol turnover for each, and then test reciprocal mutants at the residues that differ between the
    active and inactive orthologues to identify which substitutions carry the activity difference.
  experiment_type: cross-species reciprocal mutagenesis with matched activity assays
