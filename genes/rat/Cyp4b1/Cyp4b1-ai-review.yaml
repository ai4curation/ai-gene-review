id: P15129
gene_symbol: Cyp4b1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Cyp4b1 encodes rat cytochrome P450 4B1 (EC 1.14.14.1), a heme-thiolate monooxygenase of the CYP4
  family that sits as a peripheral protein on the endoplasmic reticulum and microsomal membrane. Drawing
  electrons from NADPH via NADPH--cytochrome P450 reductase, it activates molecular oxygen at its heme iron
  and inserts one oxygen atom into the substrate. In keeping with CYP4 chemistry it hydroxylates medium-chain
  fatty acids, fatty alcohols, and hydrocarbons at the terminal (omega) and subterminal (omega-1) positions,
  placing it in fatty acid oxidation. Its toxicologically prominent role is the opposite of detoxification,
  as it bioactivates protoxins into reactive species. It oxygenates the furan ring of the pneumotoxin
  4-ipomeanol to a metabolite that alkylates macromolecules and causes DNA-protein cross-links, strand breaks,
  and apoptosis, and it converts aromatic amines and related bladder procarcinogens to DNA-binding
  metabolites. Unlike most drug-metabolising P450s the enzyme is predominantly extrahepatic, with highest
  expression in lung and detectable levels in bladder mucosa, and in rat its transcription is androgen
  responsive. Activity toward 4-ipomeanol differs strikingly across mammals, so rat and rabbit data do not
  extrapolate to human.
