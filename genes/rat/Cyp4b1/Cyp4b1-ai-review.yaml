core_functions:
- description: As an ER-membrane heme-thiolate cytochrome P450 of the CYP4 family, accepts electrons from
    NADPH--cytochrome P450 reductase and inserts one atom of molecular oxygen at the terminal carbon of
    medium-chain fatty acids, the omega-hydroxylation that is the defining chemistry of the CYP4 family. The
    same active site also attacks the adjacent subterminal carbon, so the enzyme yields a mixture of
    omega- and (omega-1)-hydroxy products whose ratio depends on chain length, and the hydroxy acids it
    produces feed into fatty acid oxidation.
  supported_by:
  - reference_id: UniProtKB:P15129
    supporting_text: 'FUNCTION: Cytochromes P450 are a group of heme-thiolate monooxygenases. In liver microsomes,
      this enzyme is involved in an NADPH-dependent electron transport pathway. It oxidizes a variety of structurally
      unrelated compounds, including steroids, fatty acids, and xenobiotics.'
  - reference_id: file:rat/Cyp4b1/Cyp4b1-deep-research-falcon.md
    supporting_text: |-
      In the CYP4 family, a common role is **terminal (ω) hydroxylation** of lipids/hydrocarbons, positioning these enzymes at the interface of **lipid homeostasis** and **xenobiotic clearance/toxicity**.
    reference_section_type: OTHER
  molecular_function:
    id: GO:0140981
    label: medium-chain fatty acid omega-hydroxylase activity
  directly_involved_in:
  - id: GO:0019395
    label: fatty acid oxidation
- description: Acting on structurally unrelated foreign compounds rather than on lipids, oxidises xenobiotic
    substrates by the same NADPH- and O2-dependent, carbon-monoxide-inhibitable P450 mechanism. For this
    enzyme the outcome is frequently bioactivation rather than clearance, since oxygenation of the furan ring
    of 4-ipomeanol, and oxidation of aromatic amines and related biphenyl-type bladder procarcinogens, produce
    reactive electrophiles that alkylate DNA and protein. Because the enzyme is concentrated in lung and
    bladder mucosa rather than liver, this chemistry determines where the resulting damage occurs.
  supported_by:
