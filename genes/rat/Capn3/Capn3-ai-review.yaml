id: P16259
gene_symbol: Capn3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Calpain-3 (p94) is a skeletal muscle-enriched, calcium-activated, non-lysosomal cysteine endopeptidase
  of the peptidase C2 (calpain) family. It has a calpain catalytic domain with a Cys/His/Asn triad, unique NS, IS1
  and IS2 insertions, and a penta-EF-hand domain that binds Ca2+ and mediates homodimerization. In muscle fibres
  it is held in an inactive form by binding to the N2A and M-line regions of titin within the myofibril, and it
  undergoes rapid intramolecular autolysis when resting cytosolic Ca2+ rises; autolysed enzyme becomes diffusible.
  It cleaves sarcomeric and cytoskeletal substrates such as titin, filamin C, fodrin and Ankrd2, and contributes
  to sarcomere remodeling and muscle maintenance. It also has a non-proteolytic role at the triad, where it recruits
  aldolase A and supports sarcoplasmic reticulum Ca2+ release. Splice variants are expressed in lens and other eye
  tissues, and protein is also found in brain astrocytes. Loss of function in humans causes limb-girdle muscular
  dystrophy type 2A (calpainopathy).
