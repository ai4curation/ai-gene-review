suggested_questions:
- question: Does Na+ bind calpain-3 directly at the proposed Ca2+-binding sequence under physiological K+, or is
    the Na+-dependent autolysis an artefact of K+-free conditions?
- question: Which endogenous substrates does rat calpain-3 cleave in muscle fibres when resting Ca2+ is raised,
    as after eccentric exercise?
- question: Does calpain-3 assemble or only maintain the triad aldolase/RyR complex, and does it contact RyR1 directly?
suggested_experiments:
- description: Measure Na+ and Ca2+ binding to purified (autolysis-resistant) rat calpain-3 by isothermal titration
    calorimetry in physiological K+ buffers, with CBS mutants as controls.
- description: Quantitative N-terminomics of rat muscle fibres exposed to 200 nM Ca2+ in wild-type versus protease-dead
    calpain-3 to define in situ substrates.
