      supporting_text: |-
        Alpha-class GSTs, including GSTA2-like proteins, belong to the **cytosolic GST family** (distinct from microsomal and mitochondrial GSTs), indicating a **primarily cytosolic intracellular site of action**.
      reference_section_type: OTHER
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: MGI:MGI:1095417
        source_label: mouse Gsta1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Cluster-level ISO transfer across the expanded rodent alpha-class family. UniProt
          records only "SUBCELLULAR LOCATION - Cytoplasm" for P04903, and alpha-class GSTs
          are the cytosolic branch of the GST superfamily, distinct from the mitochondrial
          (kappa) and microsomal (MAPEG) branches, so the compartment does not transfer
