      - source_id: MGI:MGI:95863
        source_label: mouse Gsta2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Shares the symbol with the target, but this same mouse donor seeds ISO onto
          both rat Gsta1 and rat Gsta2 for the identical five terms (GO:0005739,
          GO:0005829, GO:0004364, GO:0009617, GO:0035634; compare Gsta1-goa.tsv with
          Gsta2-goa.tsv). One mouse gene feeding two rat genes the same term set is
          cluster-level transfer, not the demonstrated 1:1 orthology that would license
          a compartment assignment.
