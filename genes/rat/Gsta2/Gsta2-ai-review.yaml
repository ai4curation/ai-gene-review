suggested_questions:
- question: Rat Gsta1 (Ya-1) and Gsta2 (Ya-2) are near-identical Ya-type subunits that form both homodimers
    and A1-A2 heterodimers. Which substrates, if any, are handled preferentially by the A2-2 homodimer rather
    than by A1-1 or the A1-2 heterodimer in rat liver cytosol?
- question: Rodent alpha-class GST symbols are not 1:1 orthologous between rat and mouse (mouse Gsta2 is a
    Yc2-type subunit, whereas rat Gsta2 is Ya-2). Which mouse gene, if any, should be treated as the ISO
    donor for rat Gsta2, and should the existing symbol-matched ISO transfers be retracted?
- question: Is the tight binding of the dinitrosyl-diglutathionyl-iron complex by alpha-class GSTs a
    physiological nitric-oxide storage/transport function of Gsta2 in hepatocytes, or an in vitro affinity
    property of the G-site?
suggested_experiments:
- hypothesis: The A2-2 homodimer has a distinct electrophile preference from the A1-1 homodimer, so the
    apparent redundancy of rat Ya-type subunits reflects substrate-range broadening rather than duplication.
  description: Express and purify recombinant rat GSTA1-1, GSTA2-2, and reconstituted A1-2 heterodimer, then
    determine kcat/Km across a panel of electrophiles (CDNB, 4-hydroxynonenal, bromobenzene-3,4-oxide, cumene
    hydroperoxide, and steroid double-bond isomerisation substrates) to define subunit-specific activity
    profiles.
  experiment_type: comparative enzyme kinetics on recombinant dimers
- hypothesis: Gsta2 is a downstream ARE/Nrf2 target whose induction protects against bromobenzene
    hepatotoxicity, rather than a driver of the differentiation and stimulus-response processes transferred
    to it by ISO.
  description: Compare Gsta2 transcript and protein induction, protein-arylation burden, and glutathione-conjugate
    output in hepatocytes from wild-type versus Nrf2-deficient rats challenged with bromobenzene, and test
    whether Gsta2 knockdown in wild-type cells increases arylation without altering epithelial differentiation
    markers.
  experiment_type: Nrf2-dependence and knockdown challenge in primary hepatocytes
- hypothesis: Rat Gsta2 protein is confined to the cytosol and the perinuclear face of the nuclear envelope,
    and is absent from the mitochondrial matrix.
  description: Perform quantitative subcellular fractionation of rat liver (cytosol, purified mitochondria
    with proteinase-K shaving, nuclei/nuclear envelope) followed by targeted proteomics for the Ya-2 tryptic
    peptides that distinguish GSTA2 from GSTA1, to test the ISO-derived mitochondrion assignment directly.
  experiment_type: subcellular fractionation with paralog-discriminating targeted proteomics
