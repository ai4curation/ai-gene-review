- term:
    id: GO:0061771
    label: response to caloric restriction
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  review:
    summary: ISO seeded from mouse Gsta1 (MGI:MGI:1095417) onto rat Gsta2 (P04903), qualified
      acts_upstream_of_or_within. The objection is to the cluster-level transfer of a diet-specific donor
      observation, not to the directness of the claim, which the qualifier already scopes.
    action: MARK_AS_OVER_ANNOTATED
    reason: The earlier rationale, that the term is context rather than a direct Gsta2 role, is withdrawn,
      since acts_upstream_of_or_within already limits the claim to upstream or within action. The call stands
      on the propagation grounds recorded below. Rodent alpha-class GSTs form an expanded cluster rather than
      a 1:1 orthologue set, and Gsta2-goa.tsv shows two different mouse donors seeding ISO onto this single rat
      gene, so the mapping is many-to-one. The donor observation is a dietary-regimen-specific expression
      response, and which alpha-class member responds to caloric restriction is member- and species-specific,
      so it does not transfer across the cluster even as an upstream claim.
    supported_by:
    - reference_id: UniProtKB:P04903
      supporting_text: GO; GO:0061771; P:response to caloric restriction; ISO:RGD.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: MGI:MGI:1095417
        source_label: mouse Gsta1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Rodent alpha-class GST genes are an expanded cluster rather than a 1:1
          orthologue set, so RGD's mouse-to-rat ISO here is cluster-level. Verifiable
          in Gsta2-goa.tsv itself: two different mouse donors, Gsta1 (MGI:MGI:1095417)
          and Gsta2 (MGI:MGI:95863), both seed ISO onto this one rat gene, so the
          mapping RGD applied is many-to-one rather than 1:1. Independently of that,
          the donor term records a dietary/physiological expression response rather
          than a Gsta2 activity, which is the primary reason it does not transfer.
