id: P52631
gene_symbol: Stat3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Signal transducer and activator of transcription 3 (Stat3) is a latent cytoplasmic transcription
  factor of the STAT family (N-terminal, coiled-coil, DNA-binding, linker, SH2 and transactivation domains).
  Binding of cytokines of the gp130 family (IL-6, IL-11, LIF, OSM, CNTF), IL-10, IL-23, leptin and several
  growth factors to their receptors activates receptor-associated JAK kinases, which phosphorylate Stat3
  on Tyr705; phosphorylated Stat3 dimerises through reciprocal SH2-phosphotyrosine contacts, accumulates
  in the nucleus and binds GAS-type and IL-6 response elements to activate RNA polymerase II transcription
  of target genes, with Ser727 phosphorylation and acetylation enhancing activity. In rat it was purified
  from acute-phase liver nuclei bound to the IL-6 response element of the alpha2-macroglobulin gene, and
  drives acute-phase, cardioprotective (alphaB-crystallin, with NFAT), prosurvival (survivin) and proliferative
  (cyclin D1) gene programmes. Non-nuclear pools have been described in the mitochondrial inner membrane,
  where STAT3 supports respiratory function, and in the postsynaptic density, where it is required for
  NMDA receptor-dependent long-term depression independently of transcription.
