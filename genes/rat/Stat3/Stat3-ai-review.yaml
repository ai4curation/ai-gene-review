suggested_questions:
- question: Should GO:0099527 postsynapse to nucleus signaling pathway be retained for Stat3 when PMID:22284190
    shows the STAT3 requirement in NMDAR-LTD is independent of nuclear action and transcription?
- question: Is GO:0004879 nuclear receptor activity appropriate for any STAT protein, given STATs are
    activated by receptor-associated kinases rather than by direct ligand binding? Which source annotation
    (in human/mouse) seeds the ISO/IEA propagation?
- question: 'What does mitochondrial STAT3 do at the inner membrane: is it a structural/regulatory component
    of complex I, and is any of the Stattic-based evidence independent of Stattic off-target effects?'
suggested_experiments:
- description: 'Genetic (not pharmacological) test of mitochondrial STAT3 in rat cardiomyocytes: rescue
    STAT3-deficient cells with a mitochondria-targeted, DNA-binding-dead STAT3 and measure complex I respiration,
    ATP production and MPTP sensitivity.'
  experiment_type: genetic rescue / respirometry
- description: Identify the cytoplasmic/PSD targets of STAT3 during NMDAR-LTD (e.g. proximity labelling
    of PSD-localised STAT3 during LTD induction) to define its non-transcriptional molecular activity
    at synapses.
  experiment_type: proximity proteomics
