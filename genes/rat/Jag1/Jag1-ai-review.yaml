suggested_questions:
- question: Should the rat cochlear antisense data (PMID:10887092), where Jag1 knock-down increases hair cell number,
    be captured as negative regulation of inner ear auditory receptor cell differentiation (GO:0045608) rather than
    the unsigned differentiation term?
- question: Is the soluble Jagged1 ectodomain used in PMID:11549580 rat or human Jagged1, and should annotations
    from a secreted, antagonist-like fragment be propagated to native Jag1 at all?
- question: Does rat Jag1 participate in liver regeneration through hepatocyte-autonomous Notch activation or via
    biliary/endothelial Notch signalling, and should GO:0097421 liver regeneration be annotated from the siRNA data
    in PMID:15057910?
suggested_experiments:
- description: Hepatocyte-specific conditional deletion of Jag1 in rat (or mouse) followed by partial hepatectomy,
    measuring hepatocyte proliferation and NICD/HES1 induction, to distinguish a hepatocyte-autonomous ligand role
    from niche effects seen with whole-liver siRNA.
- description: Co-culture signalling assays with rat Jag1 mutants in the MIB1-binding intracellular region and the
    DSL domain (residues 199-207) to test which surfaces are required for NOTCH1 versus NOTCH2/3 activation in rat
    cells.
