    summary: Negative regulation of cell-matrix adhesion, transferred from human JAG1, whose source is a soluble
      Jagged1 ectodomain overexpressed in NIH3T3 cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only experimental source (PMID:11549580) expressed a secreted, truncated Jagged1 extracellular domain
      in fibroblasts and observed altered adhesion and migration. Soluble Jagged1 fragments typically antagonise
