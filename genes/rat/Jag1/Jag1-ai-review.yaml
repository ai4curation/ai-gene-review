id: Q63722
gene_symbol: Jag1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Jagged-1 (Jag1) is a single-pass type I transmembrane ligand of the Serrate/Jagged class of DSL Notch
  ligands. Its extracellular region carries an N-terminal MNNL domain, the DSL domain, 16 EGF-like repeats (many
  calcium-binding) and a cysteine-rich region; the DSL domain and adjacent EGF repeats bind the ligand-binding EGF
  repeats of NOTCH1, NOTCH2 and NOTCH3 on neighbouring cells. Rat Jagged was the first mammalian Notch ligand identified:
  Jagged-expressing cells activate Notch1 in co-culture and keep myoblasts undifferentiated. Fringe glycosylation
  of NOTCH1 reduces its activation by Jagged1. After ectodomain shedding, the membrane-anchored C-terminal fragment
  of Jagged-1 is a gamma-secretase substrate and associates with the Aph-1 subunit. Through juxtacrine Notch activation
  Jag1 controls cell fate and differentiation in many tissues, including cochlear hair cell patterning, cardiovascular
  (outflow tract, valve, vessel) development, kidney and eye development, and hepatocyte proliferation during liver
  regeneration; heterozygous loss of human JAG1 causes Alagille syndrome.'
