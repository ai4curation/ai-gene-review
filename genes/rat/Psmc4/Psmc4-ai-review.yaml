- term:
    id: GO:2000311
    label: regulation of AMPA receptor activity
  evidence_type: IDA
  original_reference_id: PMID:37228199
  qualifier: involved_in
  review:
    action: UNDECIDED
    summary: Regulation of AMPA receptor activity attributed to free 19S particles in rat neurons; only
      the abstract is accessible.
    reason: The abstract attributes the AMPA-receptor effect to inhibition of 19S deubiquitylase activity,
      which is a lid/associated DUB function, not a property of the base ATPase Psmc4. The effect reported
      is reduced synaptic availability of receptors, which concerns receptor trafficking rather than receptor
      channel activity. The full text (not in PMC) may contain Psmc4-specific data, so this is left undecided
      rather than removed. It is a likely over-annotation and is flagged for expert review.
    supported_by:
    - reference_id: PMID:37228199
      supporting_text: Inhibition of the 19S deubiquitylase activity significantly altered excitatory
        synaptic transmission and reduced the synaptic availability of AMPA receptors at multiple trafficking
        points in a proteasome-independent manner.
