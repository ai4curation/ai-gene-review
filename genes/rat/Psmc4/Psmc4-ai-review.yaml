id: Q63570
gene_symbol: Psmc4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Psmc4 (26S proteasome regulatory subunit 6B; also called TBP7, S6b or Rpt3) is one of the
  six AAA+ ATPases that form the heterohexameric base of the 19S regulatory particle of the 26S proteasome.
  Its Walker A/B AAA module binds and hydrolyses ATP. Within the ring it helps unfold ubiquitinated substrates
  and thread them into the 20S core particle, and its C-terminal HbYX-type tail docks into the 20S alpha
  ring to open the substrate-entry gate. The protein acts in the cytosol and nucleus, and it is essential:
  mouse Psmc4-null embryos die before implantation. In neurons, Rpt3 is also found in free 19S-like particles
  and is recruited to polyglutamine inclusions in disease models.'
