core_functions:
- description: Psmc4/Rpt3 is an AAA+ ATPase of the 19S base heterohexamer. It uses ATP binding and hydrolysis
    to unfold ubiquitinated substrates, translocate them into the 20S core and open the 20S gate, so it
    directly carries out 26S-proteasome-mediated degradation of ubiquitinated proteins in the cytosol
    and nucleus. Rpt3 is one of six ATPases in the base hexamer, so it contributes to the hexamer's
    proteasome-activating activity rather than carrying it out alone; its own activity is ATP hydrolysis.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  contributes_to_molecular_function:
