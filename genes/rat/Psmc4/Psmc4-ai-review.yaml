suggested_questions:
- question: 'PMID:37228199 (rat synaptic free 19S): does the full text contain Psmc4-specific evidence
    for synaptic vesicle localisation and for regulation of AMPA receptor activity, or were the 19S-wide
    (deubiquitylase-dependent) results propagated to every 19S subunit? Would regulation of receptor trafficking
    or localisation be a more accurate process than receptor activity?'
- question: 'PMID:18986984: the gradient and co-immunoprecipitation data for Rpt3 come from human 293T
    cells, while the rat data are immunostaining at huntingtin inclusions. Is the rat cytosolic proteasome
    complex IDA intended to rest on the neuronal staining?'
suggested_experiments:
- hypothesis: Psmc4 is a component of free 19S particles at synapses, but the AMPA receptor phenotype
    depends on the 19S deubiquitylase rather than on Psmc4 ATPase activity.
  description: In rat cortical neurons, compare Psmc4 Walker-B (ATPase-dead) or HbYX-tail mutants with
    DUB inhibition, and measure synaptic AMPA receptor surface levels, K63-ubiquitin deubiquitylation
    and free-19S abundance by super-resolution imaging.
  experiment_type: mutant rescue with electrophysiology and imaging
