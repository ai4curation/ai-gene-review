- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000940351
  - PANTHER:PTN008986528
  review:
    summary: >-
      Core molecular function at the level the PAINT curator chose for the ACTL7 clade: a structural
      component of the perinuclear theca, not a filament-forming actin.
    action: ACCEPT
    reason: >-
      The IBA comes from the PANTHER node that carries the ACTL7 proteins (PTN008986528), placed below
      the ancestral actin node (PTN000940351). The PAINT curator gave the clade the general structural
      term rather than the actin-specific structural constituent of cytoskeleton, which matches the
      biology: Actl7a is an architectural component of the acroplaxome and is needed for its
      subacrosomal F-actin, but it does not form filaments when expressed in somatic cells, and no
      nucleotide binding or ATPase activity has been measured. Rat Actl7a is inside the clade and has
      no evidence of divergence from its orthologs, so the inherited function stands.
    supported_by:
    - reference_id: PMID:36734600
      supporting_text: we propose that ACTL7A forms a unique testis-specific protein complex to anchor and
        stabilize acrosomal adherence to the acroplaxome at least in part by facilitating the presence of
        F-actin in the subacrosomal space
    - reference_id: PMID:21278383
      supporting_text: In contrast, when expressed in HeLa cells, GFP-Arp7A is cytoplasmic and does not assemble
        into filaments or co-localize with and/or affect the localization of Tes and Mena at focal adhesions
        (data not shown).
    - reference_id: file:rat/Actl7a/Actl7a-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the actin family.
