core_functions:
- description: >-
    Architectural component of the acroplaxome, the subacrosomal layer of the perinuclear theca, needed
    for the spatially restricted F-actin of the subacrosomal space and for anchoring the developing
    acrosome and its granule to the nuclear envelope during spermiogenesis, and thereby for normal sperm
    head shaping. Stated at the level of structural molecule activity because the actin fold is not
    shown to polymerise, bind nucleotide or form part of actin filaments.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0001675
    label: acrosome assembly
  - id: GO:0007286
    label: spermatid development
  locations:
  - id: GO:0033011
    label: perinuclear theca
  supported_by:
  - reference_id: PMID:36734600
    supporting_text: we propose that ACTL7A forms a unique testis-specific protein complex to anchor and
      stabilize acrosomal adherence to the acroplaxome at least in part by facilitating the presence of
      F-actin in the subacrosomal space
  - reference_id: PMID:37667331
    supporting_text: Immunofluorescence and TEM analyses revealed that the deletion of ACTL7A damaged the
      formation of acrosome-acroplaxome-manchette complex, leading to abnormalities in the shaping of
      sperm heads.
  knowledge_gaps:
  - gap_statement: It is not known whether Actl7a is itself a filament-forming subunit of the subacrosomal
      actin network or instead nucleates, stabilises or anchors filaments built from conventional actin.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    provenance:
    - reference_id: PMID:36734600
      supporting_text: it is not yet clear whether ACTL7A may be the filament-forming actin in the acroplaxome,
        or whether its role is to nucleate, stabilize formation, and/or anchor F-actin formed by conventional
        ARPs to the nuclear surface
- description: >-
    Tandem-LIM-domain ligand. The N-terminal extension, not the actin fold, binds the LIM2-3 domains of
    testin (TES), and the Actl7a-TES pair recruits Mena (ENAH) into a heterotrimer present in rat testis
    and located in the acroplaxome.
  molecular_function:
    id: GO:0030274
    label: LIM domain binding
  locations:
  - id: GO:0033011
    label: perinuclear theca
  supported_by:
  - reference_id: PMID:21278383
    supporting_text: The N-terminal 65-residue extension to the actin-like fold of Arp7A interacts directly
      with Tes.
  - reference_id: PMID:21278383
    supporting_text: immunoblot analysis of Tes immunoprecipitations (IP) with the indicated antibodies reveals
      that Arp7A, Tes, and Mena are complexed to each other in rat testes extracts
suggested_questions:
- question: Does the actin fold of Actl7a bind ATP or ADP, and does it hydrolyse it? No measurement exists
    for any ACTL7 protein, and the answer decides whether a nucleotide-binding function belongs on the
    gene.
- question: Should GO add an acroplaxome (subacrosomal layer) term under perinuclear theca? Curators
    currently choose between acrosomal vesicle, which is the wrong compartment, and perinuclear theca,
    which merges the subacrosomal and postacrosomal pools that Actl7a moves between.
- question: Is the 2003 report of T-actin 2 in sperm tails a flagellar pool, the connecting piece, or
    background? The motile cilium annotation inherited by rat depends on it.
suggested_experiments:
- description: Purify recombinant full-length rat Actl7a and an N-terminal-deletion construct; measure
    nucleotide binding (ITC, etheno-ATP fluorescence), phosphate release, and pyrene-actin polymerisation
    alone and with conventional actin.
  hypothesis: Actl7a binds nucleotide but does not homopolymerise, and acts on subacrosomal F-actin by
    nucleating, capping or anchoring conventional actin.
  experiment_type: biochemistry
- description: Immunogold electron microscopy or expansion microscopy of rat round spermatids with
    antibodies against Actl7a, TES, Mena and beta-actin, to determine the composition of subacrosomal
    filaments and confirm the rat localization directly.
  hypothesis: Actl7a, TES and Mena co-assemble in the rat acroplaxome with or without conventional actin.
  experiment_type: imaging
