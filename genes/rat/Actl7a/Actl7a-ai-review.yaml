- term:
    id: GO:0001675
    label: acrosome assembly
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1343051
  review:
    summary: >-
      Core process. Transferred from mouse Actl7a, which carries two independent IMP annotations; the
      protein is a structural component of the acroplaxome that anchors the developing acrosome.
    action: ACCEPT
    reason: >-
      Actl7a passes the participation test for this process: it is itself a component of the
      acroplaxome, the structure that anchors the forming acrosome to the nuclear envelope, and it is
      required for the subacrosomal F-actin of that structure. Knock-out mice show abnormal acrosomal
      granule migration and acrosomes peeling from the nucleus. The rat protein is a one-to-one
      ortholog with an identical TES-binding segment, so the transfer is sound.
    supported_by:
    - reference_id: PMID:36734600
      supporting_text: Through the generation of an Actl7a knock-out mouse model, we consistently observed
        disruption of acrosomal biogenesis with abnormal migration of the acrosomal granule and peeling
        acrosomes during spermatid elongation.
    - reference_id: PMID:36734600
      supporting_text: In addition to the acrosomal granule displacement defects, we also observed acrosomes
        peeling off in Actl7a KO spermatids, suggesting that ACTL7A-dependent F-actins also play a structural
        role for acrosomal anchoring and development
    - reference_id: PMID:41169243
      supporting_text: ACTL7A, another essential PT protein, is required for acrosome biogenesis and mediates
        the tethering of the acrosomal outer membrane to the nucleus.
