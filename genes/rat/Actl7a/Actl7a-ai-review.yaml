id: Q641W9
gene_symbol: Actl7a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Actl7a (actin-like protein 7A, Arp7A, T-actin 2) is a testis-specific actin-related protein of
  spermatids. It combines an actin fold with a unique N-terminal extension of about 70 residues, and
  the extension carries its best-defined activity: it binds the tandem LIM2-3 domains of testin (TES),
  and the resulting Arp7A-TES pair recruits the EVH1 domain of Mena (ENAH) into a heterotrimer whose
  structure has been solved. In rat testis extracts Actl7a co-immunoprecipitates with TES and Mena.
  In developing spermatids the protein is found on the Golgi apparatus during acrosome biogenesis, in
  the germ-cell nucleus, and above all in the subacrosomal layer (acroplaxome) of the perinuclear
  theca, the cytoskeletal plate that attaches the acrosome to the nuclear envelope; in later
  spermatids and sperm it moves to postacrosomal regions of the head. Work on the mouse ortholog shows
  that it is needed for the F-actin of the subacrosomal space, for anchoring the acrosome and its
  granule, and for normal sperm head shaping. Loss of the protein leaves sperm unable to fertilize
  and mislocalizes the oocyte-activating phospholipase C zeta. The actin fold does not form filaments
  in somatic cells, and whether Actl7a binds or hydrolyses nucleotide is unknown, so its structural
  role is best described as scaffolding the perinuclear theca rather than as a conventional actin.
