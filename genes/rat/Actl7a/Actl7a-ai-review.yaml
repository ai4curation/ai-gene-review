      GO:0001669 is the lysosome-related, hydrolase-containing vesicle itself. The study that resolved
      Actl7a's position at confocal resolution placed it, with TES and Mena, in the subacrosomal layer
      that links the acrosome to the nuclear envelope, and explicitly corrected earlier coarser
      readings. GO's perinuclear theca (GO:0033011) definition includes that subacrosomal layer, and
      GO:0033011 is already on this gene by ISS and ISO. Light-microscope acrosomal signal in the mouse
      donor is consistent with the acroplaxome immediately beneath the acrosome, so the essence of the
      row (acrosome-associated location) is sound and only the term is wrong. GO has no acroplaxome
      term, which is why curators fall back to the acrosome term.
