- term:
    id: GO:0030274
    label: LIM domain binding
  evidence_type: ISS
  original_reference_id: PMID:21278383
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9Y615
  review:
    summary: >-
      Proposed new molecular function. The N-terminal extension of Arp7A binds the tandem LIM2-3 domains
      of TES; the binding segment is identical in rat, and rat Actl7a is in complex with TES in rat
      testis.
    action: NEW
    reason: >-
      Direct binding, mapping, mutagenesis, isothermal titration calorimetry and the crystal structure
      used human Arp7A residues 1-65; the contact segment (human residues 28-45, LQTASLRDGPAKRAVWVR) is
      identical in rat Actl7a at residues 33-50 (reviewer comparison of the UniProt sequences), retaining
      both apolar-pocket alanines and the GPAK linker that the paper shows are critical. The rat protein
      co-immunoprecipitates with TES from rat testis. This is the gene's best-characterised molecular
      activity and is not an ancestor or descendant of any term on the gene; rat has no protein-binding
      row that it would replace. It is a molecular function, so the process-term bar does not apply.
    supported_by:
    - reference_id: PMID:21278383
      supporting_text: The N-terminal 65-residue extension to the actin-like fold of Arp7A interacts directly
        with Tes.
    - reference_id: PMID:21278383
      supporting_text: Two alanine residues from Arp7A that occupy equivalent apolar pockets in both LIM
        domains as well as an intervening GPAK linker that binds the LIM2-3 junction are critical for the
        Arp7A-Tes interaction.
    - reference_id: file:rat/Actl7a/Actl7a-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts (via N-terminus) with TES (via LIM domain 2).
    - reference_id: file:rat/Actl7a/Actl7a-deep-research-manual.md
      supporting_text: human residues 28-45
        (LQTASLRDGPAKRAVWVR) are identical in rat at residues 33-50
