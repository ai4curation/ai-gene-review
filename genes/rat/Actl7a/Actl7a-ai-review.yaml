    summary: >-
      Core process. Mouse Actl7a loss disrupts the acrosome-acroplaxome-manchette complex and sperm head
      shaping, which is spermatid development beyond acrosome assembly alone.
    action: ACCEPT
    reason: >-
      Acrosome assembly is part_of spermatid development, but this row is not redundant with it: the
      mouse knock-out also produces small, malformed sperm heads through defects of the
      acrosome-acroplaxome-manchette complex, a head-shaping role that acrosome assembly does not
      cover. Actl7a contributes structurally to the acroplaxome, which is itself one of the spermatid
      structures being built, so it does part of the work of the process.
    supported_by:
