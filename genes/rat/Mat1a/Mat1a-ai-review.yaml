id: P13444
gene_symbol: Mat1a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Mat1a encodes the catalytic subunit of liver-type methionine adenosyltransferase (S-adenosylmethionine
  synthase isoform type-1; EC 2.5.1.6). The enzyme synthesizes S-adenosyl-L-methionine (SAM), the principal
  biological methyl donor, from L-methionine and ATP in a two-step reaction that also hydrolyses the tripolyphosphate
  intermediate, requiring Mg2+ and K+. Identical subunits assemble into a homotetramer (MAT I) and a homodimer
  (MAT III) that are in equilibrium and differ in kinetics; the active sites lie at the dimer interface.
  Expressed mainly in adult liver hepatocyte cytosol, where it accounts for most SAM synthesis and methionine
  clearance, it is also found in nuclei (nuclear matrix) of several tissues. Activity is regulated by
  redox state: GSSG-induced disulfide formation and S-nitrosylation of Cys121 inactivate the enzyme.'
