  review:
    summary: Rat Aldh1l1 catalyzes NADP-dependent oxidation of free short-chain aldehydes as a
      secondary in-vitro capability.
    action: KEEP_AS_NON_CORE
    reason: The NADP-dependent aldehyde reaction is experimentally real, and the broad NAD(P)+
      term permits NADP+ usage without requiring both cofactors. Its free-aldehyde substrate context
      is secondary to the established folate-formyl oxidation of the intact enzyme. The independent
      report supports this core/secondary distinction; retain the chemistry as non-core rather
      than remove or incorrectly replace a valid broader term.
