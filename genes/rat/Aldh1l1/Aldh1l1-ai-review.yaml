- id: file:rat/Aldh1l1/Aldh1l1-hypotheses/cofactor-specificity-and-mitochondrial-localization/openscientist.md
  title: OpenScientist assessment of rat Aldh1l1 cofactor specificity and mitochondrial localization
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The report recommends rejecting both claims, but explicitly acknowledges that
      no NAD+ kinetics were available and that the negative cofactor claim is not a formal negative
      result.
    supporting_text: no NAD⁺ kinetics given (absence of evidence, not a formal negative)
  - statement: The report identifies the ALDH1L2 N-terminal targeting extension absent from
      ALDH1L1; its sequence table and the primary localization paper support paralog-specific
      mitochondrial targeting.
    supporting_text: ALDH1L1 has no equivalent segment.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Read the complete output and inspected its N-terminal CSV. The mitochondrial
      targeting distinction was verified against the rat P28037 N terminus and primary PMID:20498374/21238436.
      The report headline overstates NAD+ refutation: its own limitations acknowledge no NAD+
      kinetics, and the structural study says NADP preference rather than zero NAD usage. Its
      repeated weaker-evidence-code framing and untraced generic-ALDH ISO explanation are not
      adopted; the actual ISO donor is mouse Aldh1l1 MGI:MGI:1340024. This report was incorporated
      substantively rather than accepted wholesale.'
