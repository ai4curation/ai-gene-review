id: P28037
gene_symbol: Aldh1l1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Aldh1l1 encodes cytosolic 10-formyltetrahydrofolate dehydrogenase, a multidomain
  enzyme that converts 10-formyltetrahydrofolate to tetrahydrofolate and carbon dioxide while
  generating NADPH. Its N-terminal folate-binding and C-terminal aldehyde-dehydrogenase domains
  are connected by a phosphopantetheinylated carrier domain that transfers the formyl group
  between catalytic sites. The enzyme regulates the folate one-carbon pool and has secondary
  NADP-dependent aldehyde dehydrogenase activity. Its principal established compartment is the
  cytosol.

existing_annotations:
- term:
    id: GO:0004029
    label: aldehyde dehydrogenase (NAD+) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Aldh1l1 clearly supports NADP-dependent aldehyde oxidation, but exclusion of all
      NAD+-dependent activity remains unresolved.
    action: UNDECIDED
    reason: The PAINT GO:0004029 assertion is at PTN000192666 and includes mouse Aldh1l1 among
      experimental descendants. NADP+ preference alone does not prove complete loss of NAD+ turnover,
      and the NADP-specific term is a different cofactor reaction rather than a more specific
      child of the NAD+ reaction. The available rat studies establish NADP-dependent chemistry.
      Leave this cofactor-specific assertion unresolved pending intact-enzyme NAD+/NADP+ comparisons
      and inspection of the ortholog evidence; do not diagnose paralog error from family breadth.
      The independent OpenScientist report recommends rejection, but its own limitations explicitly
      acknowledge the absence of NAD+ kinetics rather than a formal negative result. PMID:17302434
      explains NADP preference through a phosphate contact; this also does not establish zero
      NAD+ turnover. Retain UNDECIDED after adjudication, pending a direct cofactor assay.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000192666
        source_label: PTN000192666
        source_status: UNRESOLVED
        comment: The NAD+-dependent ancestor includes mouse Aldh1l1 experimental evidence. Direct
          comparison of rat NAD+ and NADP+ turnover is needed to assess reaction retention; preference
          alone is not absence.
    supported_by:
    - reference_id: file:rat/Aldh1l1/Aldh1l1-hypotheses/cofactor-specificity-and-mitochondrial-localization/openscientist.md
      supporting_text: no NAD⁺ kinetics given (absence of evidence, not a formal negative)
    - reference_id: PMID:17302434
      supporting_text: may contribute to the specificity of the enzyme for NADP over NAD.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The mitochondrial ancestor is supported by ALDH1L2, whose added targeting presequence
      distinguishes it from rat cytosolic ALDH1L1.
    action: REMOVE
    reason: 'The mitochondrial IBD at PTN008524390 in PTHR11699 is supported by human ALDH1L2
      (Q3SY69). The independent report adds a concrete targeting comparison: rat ALDH1L1 begins
      MKIAVIGQSL and lacks the additional N-terminal segment present in ALDH1L2. This was checked
      against the P28037 sequence and the primary full-text paralog comparison in PMID:20498374,
      which characterizes an additional 22-residue ALDH1L2 leader and demonstrates mitochondrial
      localization of its fusion construct. PMID:21238436 independently describes this targeting
      distinction. The challenge is thus a paralog-specific targeting acquisition extending across
      the broad ancestor, not merely absence of a rat mitochondrial experiment or prevalence of
      cytosolic observations. A rare noncanonical secondary pool is not formally excluded, but
      the demonstrated targeting divergence supports removing this general mitochondrial inference.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN008524390
        source_label: PTN008524390
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The source ALDH1L2 has an additional, experimentally characterized mitochondrial
          targeting leader. Rat ALDH1L1 starts directly in the conserved catalytic sequence and
          lacks that paralog-specific segment.
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
    supported_by:
    - reference_id: PMID:20498374
      supporting_text: This protein has an extra N-terminal sequence of 22 amino acid residues,
        predicted to be a mitochondrial translocation signal.
    - reference_id: file:rat/Aldh1l1/Aldh1l1-hypotheses/cofactor-specificity-and-mitochondrial-localization/openscientist.md
      supporting_text: ALDH1L1 has no equivalent segment.
