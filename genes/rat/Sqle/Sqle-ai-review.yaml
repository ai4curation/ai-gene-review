id: P52020
gene_symbol: Sqle
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Sqle encodes squalene epoxidase (squalene monooxygenase, EC 1.14.14.17), a
  FAD-dependent flavoenzyme that is a peripheral membrane protein of the endoplasmic reticulum,
  anchored by C-terminal amphipathic helices with its catalytic domain facing the cytosol. Using
  electrons supplied by NADPH-cytochrome P450 reductase and molecular oxygen, it oxidizes squalene
  to (S)-2,3-epoxysqualene, the first oxygenation step and a rate-limiting step of sterol and
  cholesterol synthesis, providing the substrate for lanosterol synthase. Its N-terminal regulatory
  region senses cholesterol and promotes MARCHF6-dependent ubiquitination and proteasomal
  degradation when sterol levels are high. Unlike fungal squalene epoxidases, the mammalian enzyme
  is only weakly inhibited by terbinafine but is inhibited by NB-598.
