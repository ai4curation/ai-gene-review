- term:
    id: GO:1904614
    label: response to biphenyl
  evidence_type: IDA
  original_reference_id: PMID:11520216
  review:
    summary: Response to biphenyl, based on in vitro inhibition of recombinant rat squalene
      epoxidase by ellagitannins and hexahydroxydiphenyl (HHDP) esters.
    action: REMOVE
    reason: >-
      HHDP is a hexahydroxy-biphenyl dicarboxylic acid, so the annotation evidently records
      that biphenyl-containing compounds inhibit the enzyme. The paper measures IC50 values
      for inhibition of recombinant rat Sqle. Being inhibited by a compound in an enzyme
      assay is a property of the enzyme, not a cellular or organismal process that responds
      to a biphenyl stimulus, which is what GO:1904614 describes. Even if the full text has
      more inhibitor data, inhibition of Sqle would not make Sqle a participant in a response
      process. The term misrepresents the finding and is removed; the inhibition data themselves
      are not in question. (Earlier review text said the paper does not mention biphenyl; that
      was incorrect, since HHDP esters are biphenyl derivatives.)
    supported_by:
    - reference_id: PMID:11520216
      supporting_text: Ellagitannins isolated from various plant sources as well as newly
        synthesized n-alkyl (C(1)-C(18)) esters of hexahydroxydiphenyl (HHDP) dicarboxylic
        acid were evaluated as enzyme inhibitors of recombinant rat squalene epoxidase
  qualifier: involved_in
