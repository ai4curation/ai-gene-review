- term:
    id: GO:0001889
    label: liver development
  evidence_type: IEP
  original_reference_id: PMID:710385
  review:
    summary: liver development is treated as over-annotation because it is contextual
      or downstream of Qdpr's direct role (IEP, PMID:710385).
    action: MARK_AS_OVER_ANNOTATED
    reason: The IEP rests on the observation that hepatic dihydropteridine reductase
      activity rises during development (the "developmental upsurge" begins earlier
      than that of phenylalanine hydroxylase). That is an expression/activity pattern
      of a cofactor-regenerating enzyme in maturing liver; nothing in the study shows
      Qdpr contributing to the morphogenesis or differentiation that constitute liver
      development, so the process term overshoots the evidence.
    supported_by:
    - reference_id: PMID:710385
      supporting_text: Optimal conditions for the assay of dihydropteridine reductase
        in crude tissue extracts have been developed. Among adult rat tissues, liver
        and kidney had the highest activity followed by thymus, lung, cerebellum and
        cerebrum.
      reference_section_type: ABSTRACT
    - reference_id: PMID:710385
      supporting_text: In both liver and kidney the developmental upsurge of dihydropteridine
        reductase, which produces the cofactor necessary for the hydroxylation of aromatic
        amino acids, begins earlier than does that of phenylalanine hydroxylase.
      reference_section_type: ABSTRACT
  qualifier: involved_in
- term:
    id: GO:0010044
    label: response to aluminum ion
  evidence_type: IEP
  original_reference_id: PMID:3477172
  review:
    summary: response to aluminum ion (IEP, PMID:3477172) cannot be adjudicated; the
      cached record for this short proceedings paper has a title but no abstract.
    action: UNDECIDED
    reason: The title ("The effect of lead and aluminium on rat dihydropteridine reductase")
      indicates that aluminium exposure altered Qdpr activity, but the cached record
      has no abstract or full text, so it is not possible to see whether the observation
      was enzyme inhibition by the metal in vitro or a regulated change in expression
      in vivo. An earlier version marked this row over-annotated; that verdict rested
      on a study that could not be read, so the row is left for a curator with access
      to the paper. If the observation was direct enzyme inhibition, the term would
      overshoot (the enzyme is the target of the metal rather than a participant in
      a cellular response).
    supported_by:
    - reference_id: PMID:3477172
      supporting_text: The effect of lead and aluminium on rat dihydropteridine reductase
      reference_section_type: TITLE
  qualifier: involved_in
- term:
    id: GO:0010288
    label: response to lead ion
  evidence_type: IEP
  original_reference_id: PMID:3815851
  review:
    summary: response to lead ion is treated as over-annotation because it is contextual
      or downstream of Qdpr's direct role (IEP, PMID:3815851).
    action: MARK_AS_OVER_ANNOTATED
    reason: The study shows that low-level lead in vivo inhibits dihydropteridine
      reductase, with a secondary rise in tetrahydrobiopterin synthesis. Inhibition
      of the enzyme by the metal makes Qdpr a target of lead toxicity; it does not
      show Qdpr carrying out a cellular response to lead, so the response-process
      term overshoots what was observed. Retained as a documented sensitivity rather
      than removed.
    supported_by:
    - reference_id: PMID:3815851
      supporting_text: The use of low levels of lead in vivo in rats has been found
        to inhibit dihydropteridine reductase and cause an apparent increase in tetrahydrobiopterin
        biosynthesis.
      reference_section_type: ABSTRACT
  qualifier: involved_in
- term:
    id: GO:0033762
    label: response to glucagon
  evidence_type: IEP
  original_reference_id: PMID:4155291
  review:
    summary: response to glucagon is treated as over-annotation because it is contextual
      or downstream of Qdpr's direct role (IEP, PMID:4155291).
    action: MARK_AS_OVER_ANNOTATED
    reason: Glucagon treatment for 10 days induced hepatic dihydropteridine reductase
      more than twofold. That is a genuine expression-pattern observation, but the
      enzyme is a downstream induced output; there is no evidence that Qdpr activity
      mediates any part of the glucagon response (signalling or metabolic outcome),
      so the process term overshoots the induction data.
    supported_by:
    - reference_id: PMID:4155291
      supporting_text: Glucagon administered subcutaneously to rats for 10 days had
        no significant effect on liver phenylalanine hydroxylase activity, but induced
        liver dihydropteridine reductase more than twofold.
      reference_section_type: ABSTRACT
  qualifier: involved_in
- term:
    id: GO:0071466
    label: cellular response to xenobiotic stimulus
  evidence_type: IEP
  original_reference_id: PMID:2484967
  review:
    summary: cellular response to xenobiotic stimulus is treated as over-annotation
      because it is contextual or downstream of Qdpr's direct role (IEP, PMID:2484967).
    action: MARK_AS_OVER_ANNOTATED
    reason: In PC12 cells, cAMP-raising agents and forskolin left dihydropteridine
      reductase activity unchanged; only theophylline lowered it, and only at 96 h.
      A single late decrease with one compound (while GTP cyclohydrolase I was the
      responsive enzyme) does not establish that Qdpr participates in a cellular response
      to xenobiotics, so the term overshoots the data.
    supported_by:
    - reference_id: PMID:2484967
      supporting_text: The addition of 8-bromo cyclic AMP, forskolin, theophylline,
        and 3-isobutyl-1-methylxanthine to the medium of PC 12 cells resulted in an
        increase in GTP cyclohydrolase I activity, but had no effect on dihydropteridine
        reductase activity, except theophylline which caused a decrease in dihydropteridine
        reductase activity at 96 h.
      reference_section_type: ABSTRACT
  qualifier: involved_in
