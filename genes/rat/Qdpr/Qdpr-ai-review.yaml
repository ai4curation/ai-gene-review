references:
- id: file:rat/Qdpr/Qdpr-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report on rat Qdpr (DHPR/QDPR, UniProt
    P11348)
  findings:
  - statement: Falcon confirms gene identity and the core reaction; rat Qdpr is an
      NAD(H)-dependent oxidoreductase that regenerates tetrahydrobiopterin from quinonoid
      dihydrobiopterin.
    supporting_text: an NAD(H)-dependent oxidoreductase that catalyzes regeneration
      of **tetrahydrobiopterin (BH4)** from **quinonoid dihydrobiopterin (qBH2)**
    reference_section_type: OTHER
  - statement: Falcon places Qdpr as the terminal BH4-recycling enzyme that maintains
      reduced cofactor supply for the aromatic amino acid hydroxylases, the primary
      function for annotation.
    supporting_text: Qdpr functions in **BH4 recycling**, complementing BH4 de novo
      synthesis and maintaining reduced cofactor supply for **PAH, TH, and TPH**.
      This is the primary function most relevant for annotation.
    reference_section_type: OTHER
  - statement: Falcon corroborates NADH as the directly observed, physiologic cofactor
      for rat DHPR.
    supporting_text: Direct structural evidence shows **NADH bound** in the rat DHPR
      crystal structure and supports NADH as the physiologic electron donor.
    reference_section_type: OTHER
  - statement: Falcon notes NADH is kinetically preferred over NADPH in vitro for
      the rat enzyme, with NADPH a possible contributor in vivo, supporting both nucleotide-binding
      annotations as cofactor context.
    supporting_text: Older rat biochemical work indicates **NADH is more effective
      than NADPH in vitro**, while allowing that NADPH may contribute in vivo depending
      on cellular redox pools.
    reference_section_type: OTHER
  - statement: Falcon corroborates the homodimeric quaternary structure underlying
      the identical protein binding annotation.
    supporting_text: The protein exists as a **dimer in solution**; dimerization is
      mediated by a **four-helix bundle** formed by helices contributed from each
      protomer.
    reference_section_type: OTHER
  - statement: Falcon supports a predominantly cytosolic localization consistent with
      soluble BH4 recycling.
    supporting_text: a cell-based study reported wild-type QDPR is mainly **cytoplasmic**
      (with a mutant showing altered localization)
    reference_section_type: OTHER
