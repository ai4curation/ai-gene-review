id: P11348
gene_symbol: Qdpr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Qdpr encodes rat dihydropteridine reductase (DHPR), a cytosolic short-chain
  dehydrogenase/reductase-family homodimer with a Rossmann-fold dinucleotide-binding
  domain. It reduces quinonoid dihydrobiopterin (qBH2) back to tetrahydrobiopterin
  (BH4), using NADH as the preferred electron donor (NADPH is a much poorer substrate),
  and so regenerates the BH4 cofactor consumed by phenylalanine, tyrosine and tryptophan
  hydroxylases and by nitric oxide synthases. The enzyme is most active in liver and
  kidney and is also present in brain, where BH4 recycling supports catecholamine and
  serotonin synthesis; in humans, loss of DHPR causes a severe BH4-deficient form of
  hyperphenylalaninemia.
