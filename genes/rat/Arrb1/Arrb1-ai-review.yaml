- term:
    id: GO:0004869
    label: cysteine-type endopeptidase inhibitor activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - MGI:MGI:99473
  review:
    summary: Cysteine-type endopeptidase inhibitor activity, propagated from a mouse IMP (PMID:19915011)
      on GLP-1 anti-apoptotic signaling in beta-cells.
    action: REMOVE
    reason: The source paper shows that beta-arrestin-1 mediates GLP-1 anti-apoptotic signaling through
      ERK1/2-p90RSK phosphorylation of Bad. That is an upstream signaling effect, not direct inhibition
      of caspases; arrestins have no protease-inhibitor activity. A phenotype was mapped to a molecular
      function the protein does not have, and the error propagates to rat by ISO.
    supported_by:
    - &id032
      reference_id: PMID:19915011
      supporting_text: beta-Arrestin 1 is further found to mediate the antiapoptotic effect of GLP-1 in
        beta-cells through the ERK1/2-p90RSK-phosphorylation of Bad.
    source_defects:
    - defect_type: WRONG_TERM
      resource: MGI
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0004869
      confidence: PROBABLE
      explanation: Mouse Arrb1 IMP row from PMID:19915011 asserts cysteine-type endopeptidase inhibitor
        activity. The paper shows Arrb1-dependent ERK1/2-p90RSK phosphorylation of Bad, an upstream anti-apoptotic
        signal, not caspase inhibition; the rat ISO row inherits the error.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:99473
        source_status: SOURCE_BAD
        comment: Mouse IMP (PMID:19915011) maps an anti-apoptotic signaling phenotype (ERK-p90RSK-Bad)
          to caspase inhibitor activity.
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - UniProtKB:P49407
  review:
    summary: GTPase activator activity, propagated from human ARRB1 (IMP, PMID:15611106, RhoA activation
      with Galpha q/11).
    action: MARK_AS_OVER_ANNOTATED
    reason: The underlying finding is that beta-arrestin-1 cooperates with Galpha q to activate RhoA for
      stress-fiber formation. RhoA activation means GTP loading (GEF-type), which is the opposite of what
      GTPase activator (GAP) activity means. The cellular effect is captured by the Rho signal transduction
      and stress fiber rows; no GAP activity has been shown.
    supported_by:
    - &id037
      reference_id: file:rat/Arrb1/Arrb1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Involved in AGTR1-mediated stress fiber formation by acting together with GNAQ
        to activate RHOA.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P49407
        source_status: SOURCE_BAD
        comment: Human IMP (PMID:15611106) shows RhoA activation with Galpha q, not GAP activity.
