suggested_questions:
- question: The mouse Arrb1 IMP to phototransduction (PMID:11853756) appears to describe rod arrestin
    (Sag) knockout mice. Should MGI move it to Sag, so the rat and human ISO/IEA rows stop propagating?
- question: Should 'cysteine-type endopeptidase inhibitor activity' on mouse Arrb1 (PMID:19915011) be
    re-curated as regulation of apoptotic process, given that the mechanism is ERK1/2-p90RSK phosphorylation
    of Bad?
- question: For which rat receptors does beta-arrestin-1 promote and for which does it oppose ERK1/2 activation
    (reciprocal versus codependent regulation), and what structural features of the receptor set this?
- question: The GO:0030331 nuclear estrogen receptor binding row from PMID:19339617 uses an obsolete term;
    which current term should RGD use for the membrane ER-alpha/beta-arrestin-1 interaction?
suggested_experiments:
- description: In rat vascular smooth muscle cells, compare beta-arrestin-1 and beta-arrestin-2 knockouts
    (CRISPR) with rescue by AP-2/clathrin-binding-deficient and phosphate-sensor mutants of beta-arrestin-1,
    to separate its desensitization, internalization and ERK-opposing roles downstream of AT1R.
- description: Reconstitute AIP4-mediated TRPV4 ubiquitination in vitro with purified beta-arrestin-1
    (wild type and activation-deficient mutants), to test whether the ligase-substrate bridge needs receptor-induced
    beta-arrestin activation.
