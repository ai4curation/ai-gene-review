core_functions:
- description: Binds agonist-activated, GRK-phosphorylated GPCRs through its N-domain phosphate sensor,
    sterically blocking G protein coupling and desensitizing receptor signaling (beta2-adrenergic, P2Y2,
    FSH, alpha1B-adrenergic, V2 vasopressin and other receptors).
