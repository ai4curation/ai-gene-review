    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:20650893
  qualifier: enables
  review:
    summary: 'Proposed: beta-arrestin-1 bridges the HECT E3 ligase AIP4 (ITCH) to the TRPV4 channel, which
      lacks a PY motif, after AT1aR activation.'
    action: NEW
    reason: 'Direct-participation MF shown in rat vascular smooth muscle cells and HEK-293 cells: beta-arrestin-1
      interacts constitutively with AIP4, is recruited to the AT1aR/TRPV4 complex, and its knockdown blocks
      the angiotensin-induced TRPV4-AIP4 interaction and TRPV4 ubiquitination. This is the activity itself,
      not a downstream phenotype, and is consistent with ortholog data (ARRDC1/ITCH-Notch, MDM2-p53).
      It is a sibling of clathrin-cargo adaptor activity, not an ancestor or descendant of any term on
      the gene.'
    supported_by:
    - *id024
    - *id029
    - *id025
