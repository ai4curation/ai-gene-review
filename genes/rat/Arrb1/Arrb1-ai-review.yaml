id: P29066
gene_symbol: Arrb1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Arrb1 encodes beta-arrestin-1 (arrestin-2), a cytosolic arrestin-family adaptor protein of
  418 residues, expressed mainly in neurons and spleen. When a G protein-coupled receptor is activated
  and phosphorylated by GPCR kinases, beta-arrestin-1 moves from the cytoplasm to the plasma membrane.
  Its N-domain phosphate sensor binds the phosphorylated receptor tail or loops, releasing its C-terminus.
  Bound beta-arrestin-1 sterically blocks G protein coupling (desensitization) and, through clathrin and
  AP-2 beta2-appendage binding, acts as a clathrin-associated sorting protein that carries receptors into
  clathrin-coated pits and endosomes. It also recruits PDE4 to limit local cAMP. Receptor-beta-arrestin-1
  complexes act as signaling scaffolds for Src, Raf-MEK-ERK1/2, AKT and cofilin-pathway enzymes; for some
  receptors, such as AT1R in vascular smooth muscle, beta-arrestin-1 opposes the beta-arrestin-2 pathway.
  Beta-arrestin-1 also bridges E3 ubiquitin ligases to substrates (AIP4/ITCH to TRPV4 and, with ARRDC1,
  to Notch; MDM2 to p53), promoting their ubiquitination and down-regulation. A nuclear pool recruits
  p300 to target promoters and interacts with CREB and Dishevelled to regulate transcription.
