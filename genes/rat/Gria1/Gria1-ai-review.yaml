  review:
    summary: Cytosol (IDA), from GluR1 detected in the "cytosolic" fraction of a Syn-PER synaptosome preparation
      from amygdala.
    action: REMOVE
    reason: Full text read. The "cytosolic" fraction is simply the non-synaptosomal supernatant of the
      Syn-PER kit, normalised to actin; it contains non-synaptic membranes. GluA1 is a four-segment integral
