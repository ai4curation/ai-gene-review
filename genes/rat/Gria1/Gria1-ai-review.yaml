id: P19490
gene_symbol: Gria1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Gria1 encodes GluA1 (GluR1, GluR-A), a pore-forming subunit of AMPA-type ionotropic glutamate
  receptors. GluA1 assembles with GluA2 (most commonly), GluA3 or GluA4, or as homomers, into tetrameric
  glutamate-gated cation channels together with auxiliary TARP and cornichon subunits; GluA1/GluA2 receptors
  with TARP gamma-8 are the principal AMPA receptors at hippocampal synapses, where they mediate fast
  excitatory transmission from the postsynaptic density membrane of dendritic spines. GluA1 is not edited
  at the pore Q/R site, so GluA1 homomers and other GluA2-lacking receptors are Ca2+-permeable and inwardly
  rectifying. Flip/flop splicing tunes desensitization. The cytoplasmic C-terminal tail carries a type
  I PDZ ligand that binds SAP97 and phosphorylation sites (Ser831 for CaMKII/PKC, Ser845 for PKA in mature
  numbering) plus a Loop1 CaMKII site, palmitoylation and ubiquitination sites that control surface delivery,
  synaptic insertion and endocytosis. Activity-dependent insertion of GluA1-containing receptors into
  synapses is a principal expression mechanism of long-term potentiation, and their removal contributes
  to long-term depression; GluA1 trafficking is also remodelled in drug-, stress- and learning-related
  plasticity.
