    reason: Generic protein binding is uninformative and is removed under the protein-binding policy;
      this does not mean the reported interaction is false. The informative content of GluA1 interactions
      (PDZ domain binding by the C-terminal ligand, AMPA receptor complex assembly with GluA2 and auxiliary
      TARP/cornichon subunits) is captured elsewhere in this review.
