- term:
    id: GO:0001919
    label: regulation of receptor recycling
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00091234
  review:
    summary: Regulation of receptor recycling, based on subunit-specific rules of AMPA receptor delivery
      to synapses.
    action: MARK_AS_OVER_ANNOTATED
    reason: GluA1 is the recycling cargo. Its C-terminal motifs recruit PDZ proteins, which (with the
      trafficking machinery) do the regulating; the GluA1 tail being needed for its own trafficking does
      not make GluA1 a regulator of receptor recycling as a process. The trafficking role is captured
      by PDZ domain binding.
    supported_by:
    - reference_id: PMID:11348590
      supporting_text: GluR1/GluR2 receptors are added to synapses during plasticity; this requires interactions
        between GluR1 and group I PDZ domain proteins.
