core_functions:
- description: 'Glutamate-gated cation channel subunit: binds L-glutamate (and AMPA) and forms, with GluA2-4
    and auxiliary TARP/cornichon subunits, the pore of AMPA receptors that depolarize the postsynaptic
    density membrane of dendritic spines at glutamatergic synapses.'
  molecular_function:
    id: GO:0004971
    label: AMPA glutamate receptor activity
  directly_involved_in:
  - id: GO:0035249
    label: synaptic transmission, glutamatergic
  - id: GO:0060078
    label: regulation of postsynaptic membrane potential
  locations:
  - id: GO:0098839
    label: postsynaptic density membrane
  - id: GO:0043197
    label: dendritic spine
  in_complex:
    id: GO:0032281
    label: AMPA glutamate receptor complex
  supported_by:
  - reference_id: PMID:2166337
    supporting_text: Functional expression of the cDNAs in cultured mammalian cells generated receptors
      displaying alpha-amino-3-hydroxy-5-methyl-4-isoxazole propionic acid (AMPA)-selective binding pharmacology
  - reference_id: PMID:30872532
    supporting_text: Here, we present a cryo-electron microscopy structure of the heteromeric GluA1/2
      receptor associated with two transmembrane AMPAR regulatory protein (TARP) γ8 auxiliary subunits,
      the principal AMPAR complex at hippocampal synapses.
  - reference_id: PMID:19265014
    supporting_text: Here, we show by proteomic analysis that the majority of AMPARs in the rat brain
      are coassembled with two members of the cornichon family of transmembrane proteins, rather than
      with the TARPs.
  - reference_id: file:rat/Gria1/Gria1-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Ionotropic glutamate receptor that functions as a ligand-gated cation channel, gated
      by L-glutamate and glutamatergic agonists such as alpha-amino-3-hydroxy-5-methyl-4-isoxazolepropionic
      acid (AMPA), quisqualic acid, and kainic acid
- description: 'Ca2+-permeable AMPA receptor channel activity: GluA1 is not Q/R-edited, so GluA1 homomers
    and other GluA2-lacking receptors conduct Ca2+; such receptors are transiently inserted at synapses
    after LTP-inducing stimuli.'
  molecular_function:
    id: GO:0022849
    label: glutamate-gated calcium ion channel activity
  locations:
  - id: GO:0045211
    label: postsynaptic membrane
  supported_by:
  - reference_id: PMID:1709304
    supporting_text: At physiological resting potentials, KA and AMPA elicited inward calcium currents
      in oocytes expressing GluR1, GluR3, and GluR1 plus GluR3.
  - reference_id: PMID:11773314
    supporting_text: For GluR-A(Q) channels, P(Ca)/P(Na) derived from all three approaches was concentration
      independent
  - reference_id: PMID:22915106
    supporting_text: Here, we show that endogenous GluA1 is rapidly inserted at the synaptic plasma membrane
      of rat hippocampal neurons immediately after stimulation with elevated glycine, a treatment known
      to induce LTP.
- description: C-terminal type I PDZ ligand binds SAP97 PDZ domains; this interaction, together with CaMKII
    and PKA phosphorylation of the GluA1 tail, is required for activity-dependent delivery of GluA1-containing
    receptors into synapses during LTP.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  directly_involved_in:
  - id: GO:0060291
    label: long-term synaptic potentiation
  locations:
  - id: GO:0098839
    label: postsynaptic density membrane
  supported_by:
  - reference_id: PMID:16634638
    supporting_text: Synaptic delivery of GluR-A (GluR1) subunit-containing glutamate receptors depends
      on a C-terminal type I PDZ binding motif in GluR-A.
  - reference_id: PMID:10731148
    supporting_text: These results show that LTP and CaMKII activity drive AMPA-Rs to synapses by a mechanism
      that requires the association between GluR1 and a PDZ domain protein.
  - reference_id: PMID:12536214
    supporting_text: We found that PKA phosphorylation of the AMPA receptor subunits GluR4 and GluR1 directly
      controlled the synaptic incorporation of AMPA receptors in organotypic slices from rat hippocampus.
suggested_questions:
- question: Should RGD and SynGO rows that place GluA1 at cellular components with IEP or IMP evidence
    (presynaptic membrane, postsynaptic membrane, glutamatergic synapse, synapse, synaptic membrane) be
    re-coded as IDA where the papers localise GluA1 directly?
- question: Do presynaptic GluA1-containing AMPA receptors in corticostriatal and thalamostriatal terminals
    regulate presynaptic membrane potential or glutamate release, which would be needed to justify GO:0099507
    for GluA1?
- question: Is the beta2-adrenergic receptor/Gs/adenylyl cyclase/PKA association with GluA1 direct for
    any component, or entirely bridged by stargazin, PSD-95 and AKAP150, which would make the G-protein,
    adenylate cyclase and PKA binding rows complex-membership statements?
suggested_experiments:
- hypothesis: Presynaptic GluA1-containing AMPA receptors depolarize striatal glutamatergic terminals
    and modulate release.
  description: Use terminal-specific Gria1 deletion (cortical or thalamic Cre lines) and measure paired-pulse
    ratio, presynaptic Ca2+ imaging and terminal membrane potential at corticostriatal and thalamostriatal
    synapses after AMPA application.
- hypothesis: Gs, adenylyl cyclase and PKA reach GluA1 only through stargazin/PSD-95/AKAP150 scaffolds.
  description: Reconstitute beta2AR, Gs, adenylyl cyclase and GluA1 in heterologous cells with or without
    stargazin, PSD-95 and AKAP150, and test pairwise binding by co-immunoprecipitation and proximity labelling,
    alongside in vitro binding with purified GluA1 C-tail.
