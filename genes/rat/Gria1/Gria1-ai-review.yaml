      resource: RGD
      requested_change: DELETE_ROW
      asserted_value: GO:0005829
      confidence: PROBABLE
      explanation: GO:0005829 cytosol for rat Gria1 rests on GluR1 detected in the "cytosolic" fraction
        of a Syn-PER synaptosome extraction (non-synaptosomal supernatant, normalised to actin). That
        fraction contains non-synaptic membranes; GluA1 is an integral multi-pass membrane protein, so
        a cytosol location is not supported.
