- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11348590
  qualifier: enables
  supporting_entities:
  - UniProtKB:P19491
  review:
    summary: Bare protein binding (IPI). GluA1 interacts with GluA2, TARPs (stargazin/gamma-2, gamma-5),
      cornichon-2, PSD-95, SAP97, myosin Vb, KLC2, CaMKII, beta2AR, GEF-H1, IgSF11 and others.
