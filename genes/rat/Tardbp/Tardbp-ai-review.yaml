id: A0A8I6GLU8
gene_symbol: Tardbp
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Tardbp encodes TDP-43 (TAR DNA-binding protein 43), a ubiquitously expressed, predominantly nuclear
  hnRNP-like RNA-binding protein with an N-terminal self-association domain carrying a nuclear localization signal,
  two RNA recognition motifs that bind UG/TG-rich RNA and single-stranded DNA, and a glycine-rich C-terminal low-complexity
  domain that drives phase separation. In rat cortical neurons it binds thousands of transcripts at (UG)n motifs
  in introns, exons and 3'-UTRs and localizes to perichromatin fibrils, the sites of transcription and co-transcriptional
  splicing. TDP-43 regulates alternative pre-mRNA splicing, notably repressing non-conserved cryptic exons, and
  controls mRNA stability through 3'-UTR binding, including negative autoregulation of its own transcript. It shuttles
  to the cytoplasm, where it joins RNP granules, and its nuclear loss with cytoplasmic aggregation is the hallmark
  pathology of ALS and frontotemporal lobar degeneration.
