suggested_questions:
- question: Does RGD:1310906 carry the positive regulation of insulin secretion IMP (PMID:21127054) in error for
    Pik3c2a?
- question: Which rat neuronal transcripts contain TDP-43-repressed cryptic exons, and do they overlap the human
    STMN2/UNC13A set given poor intronic conservation?
- question: Is endogenous rat TDP-43 present inside mitochondria under physiological conditions, or only after overexpression
    or in disease models?
suggested_experiments:
- description: iCLIP or eCLIP of endogenous TDP-43 in rat cortical neurons combined with TDP-43 knockdown RNA-seq
    to map binding sites to cryptic exon repression and 3'-UTR-mediated decay targets at nucleotide resolution.
