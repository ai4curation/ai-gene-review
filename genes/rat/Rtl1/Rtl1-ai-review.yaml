  label: Rattus norvegicus
description: Rtl1 (retrotransposon-like 1; also Peg11, SIRH2) is a eutherian-specific, paternally expressed
  imprinted gene in the Dlk1-Dio3 cluster, domesticated from a Ty3/gypsy (sushi-ichi) LTR retrotransposon.
  It encodes a full-length Gag-Pol-like polyprotein with a capsid/nucleocapsid region, a retropepsin aspartic-protease
  domain (DSG motif), reverse-transcriptase-like and RNase-H-like regions, and predicted transmembrane
  helices. Based on its mouse ortholog, RTL1 is essential for dosage-sensitive maintenance of the fetal
  capillary network of the labyrinthine placenta (both loss and overproduction are lethal) and is a major
  driver of fetal/neonatal skeletal-muscle development, localizing beside the sarcomeric Z-disc in muscle.
  Rtl1 dosage is controlled in trans by microRNAs from the reciprocally imprinted maternal antisense transcript
  Rtl1as. The rat annotations are transferred by orthology (ISO) from mouse.
