suggested_questions:
- question: Should rat Tbc1d4 carry a 14-3-3 protein binding MF row? PMID:21454690 shows insulin-dependent binding
    of rat adipocyte AS160 to GST-14-3-3 isoforms and to 14-3-3gamma on GLUT4 vesicles.
- question: Which Rab is the physiological AS160 target on rat adipocyte GLUT4 vesicles (Rab10, as in 3T3-L1) versus
    rat muscle (Rab8A/Rab13)?
suggested_experiments:
- hypothesis: Tbc1d4 GAP activity, not only its phosphorylation, controls GLUT4 vesicle fusion in rat adipocytes.
  description: Reconstitute the rat adipocyte cell-free GLUT4 vesicle fusion assay with vesicles from cells expressing
    GAP-dead (arginine-finger R919K) versus wild-type rat Tbc1d4, and measure Rab10/Rab8A GTP loading alongside
    fusion.
  experiment_type: in vitro reconstitution with mutagenesis
