- description: Rab GTPase-activating protein that, in unstimulated adipocytes and muscle, keeps GLUT4-vesicle Rabs
    (Rab8A/Rab10/Rab13/Rab14 class) GDP-bound and thereby restrains GLUT4 vesicle fusion with the plasma membrane;
    insulin/Akt phosphorylation and 14-3-3 binding inactivate the GAP to release GLUT4 translocation.
