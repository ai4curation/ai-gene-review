  label: Rattus norvegicus
description: Tbc1d4 (AS160, Akt substrate of 160 kDa) is a large cytosolic Rab GTPase-activating protein with two
  N-terminal phosphotyrosine-binding (PTB) domains and a C-terminal TBC Rab-GAP domain that retains both catalytic
  fingers. In adipocytes and skeletal muscle it associates with GLUT4 (insulin-responsive) vesicles and, in the
  unstimulated state, keeps vesicle Rabs of the Rab8A/Rab10/Rab13/Rab14 class in their GDP-bound form, restraining
  GLUT4 vesicle docking and fusion with the plasma membrane. Insulin-activated Akt (and contraction/AMPK signalling
  in muscle) phosphorylates Tbc1d4 on multiple sites; phosphorylation and 14-3-3 binding inactivate the GAP, allowing
  Rab activation, GLUT4 vesicle fusion and increased glucose uptake. It is thus a key signal-to-trafficking node
  in insulin- and exercise-stimulated glucose transport.
