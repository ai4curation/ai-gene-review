  review:
    summary: 'Proposed: Rab GTPase-activating protein activity of the TBC domain, transferred from human AS160 and
      supported by rat cell data.'
    action: NEW
    reason: The rat entry has no molecular-function row, although Rab GAP activity is the activity through which
      Tbc1d4 acts. The recombinant human AS160 TBC domain stimulates GTP hydrolysis by Rab2A, Rab8A, Rab10 and Rab14
      and is inactivated by mutation of the catalytic arginine; the arginine (ILVDLGR, R919) and glutamine (YCQ,
      Q956) fingers are conserved in rat Tbc1d4 within the PS50086 TBC domain (local motif check). In rat L6 myotubes
      constitutively active AS160 lowered surface GLUT4 in a manner reversed by Rab8A or Rab13, and in rat adipocytes
      the GAP-active form keeps the vesicle Rab GDP-bound. Molecular function, not a process, so the process NEW
      bar does not apply; not an ancestor or descendant of any term on the gene.
