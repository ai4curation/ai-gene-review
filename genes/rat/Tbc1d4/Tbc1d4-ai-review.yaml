  review:
    summary: Negative regulation of vesicle fusion, from rat adipocyte GLUT4 vesicle fusion assays.
    action: ACCEPT
    reason: Full text read. Rat AS160 PTB-domain constructs inhibited insulin-stimulated GLUT4 vesicle fusion in
      a cell-free assay from rat adipocyte fractions and blocked insulin-stimulated GLUT4 translocation in intact
      rat adipocytes; the authors interpret this as the constructs preventing 14-3-3 binding so that AS160 remains
      GAP-active and fusion stays low. Together with the ortholog data (phosphosite mutants inhibit GLUT4 translocation
      through the GAP function) this supports AS160 as a negative regulator of GLUT4 vesicle fusion. Core regulatory
      process.
    supported_by:
