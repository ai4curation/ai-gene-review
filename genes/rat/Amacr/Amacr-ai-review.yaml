id: P70473
gene_symbol: Amacr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Amacr encodes alpha-methylacyl-CoA racemase, a peroxisomal and mitochondrial
  enzyme that interconverts stereoisomers of alpha-methyl-branched acyl-CoA esters,
  including pristanoyl-CoA and bile-acid intermediates. Only (2S)-methyl-branched
  acyl-CoAs can be degraded by beta-oxidation, so by converting (2R)-isomers to their
  (2S)-epimers the enzyme makes branched-chain fatty acids derived from phytanic and
  pristanic acid, and the C27 bile acid intermediates di- and trihydroxycholestanoyl-CoA,
  available to peroxisomal and mitochondrial beta-oxidation, the latter step being
  required for cholic and chenodeoxycholic acid synthesis. A single gene product
  carries both a C-terminal PTS1-like peroxisomal targeting signal and N-terminal
  mitochondrial targeting information, giving a bimodal peroxisomal/mitochondrial
  distribution (the rat liver enzyme is predominantly mitochondrial). It is also the
  2-arylpropionyl-CoA epimerase that inverts (R)-ibuprofenoyl-CoA during the chiral
  inversion of ibuprofen.
