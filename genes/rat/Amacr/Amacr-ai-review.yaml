- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: signaling receptor binding misdescribes the only receptor interaction
      reported for AMACR, the binding of its C-terminal PTS1 to the peroxisomal import
      receptor Pex5p, which is a cargo-import receptor rather than a signaling receptor;
      the human source annotation is also no longer present in QuickGO (ISO, GO_REF:0000121).
    action: REMOVE
    reason: 'GO:0005102 is defined as binding to a receptor that combines with a hormone,
      neurotransmitter, drug or intracellular messenger to initiate a change in cell
      function. The human AMACR evidence that most plausibly underlies this transfer
      is the in vitro interaction of recombinant racemase with the PTS1 receptor Pex5p
      (PMID:11060344), i.e. a targeting signal being recognised by the peroxisomal
      protein-import machinery. That is a property of the cargo''s sorting signal,
      not a signaling-receptor-binding activity, and peroxisomal localization is already
      captured by the peroxisome annotations. A QuickGO query (2026-10-04) finds no
      GO:0005102 annotation on human AMACR (Q9UHK6 or Q9UHK6-1), so the donor annotation
      appears to have been withdrawn. Removal does not dispute the Pex5p interaction itself.'
    supported_by:
    - reference_id: PMID:11060344
      supporting_text: From the in vitro interaction between recombinant racemase and
        recombinant human PTS1 receptor (Pex5p), and the peroxisomal localization of
        green fluorescent protein (GFP) fused to the N terminus of full-length racemase
        or its last six amino acids in tranfected Chinese hamster ovary (CHO) cells,
        we concluded that ASL is a new PTS1 variant.
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: SOURCE_STALE_OR_MISSING
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:Q9UHK6
        source_label: AMACR
        source_status: SOURCE_STALE_OR_MISSING
        comment: Human AMACR donor (cited as Q9UHK6 and isoform Q9UHK6-1). QuickGO
          no longer returns a GO:0005102 annotation for either identifier; the only
          receptor interaction in the human literature is PTS1 recognition by the
          Pex5p import receptor, which this term misdescribes.
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UHK6
  - UniProtKB:Q9UHK6-1
