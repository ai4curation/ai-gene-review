- id: PMID:11060344
  title: Mitochondrial and peroxisomal targeting of 2-methylacyl-CoA racemase in humans.
  findings:
  - statement: Human AMACR carries a C-terminal PTS1 variant recognised by Pex5p and
      N-terminal mitochondrial targeting information; basis of the human-donor localization
      transfers and the likely source of the (removed) signaling receptor binding transfer.
    supporting_text: The enzyme activity is found not only in peroxisomes but also
      is present in mitochondria of human liver and fibroblasts.
    reference_section_type: ABSTRACT
- id: PMID:11060359
  title: Subcellular localization and physiological role of alpha-methylacyl-CoA racemase.
  findings:
  - statement: AMACR localizes to peroxisomes and mitochondria and has physiological
      roles in branched-chain lipid metabolism.
    supporting_text: Subcellular localization and physiological role of alpha-methylacyl-CoA
      racemase.
    reference_section_type: TITLE
- id: PMID:11964182
  title: The role of alpha-methylacyl-CoA racemase in bile acid synthesis.
  findings:
