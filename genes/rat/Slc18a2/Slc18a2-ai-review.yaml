- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:1438304
  qualifier: located_in
  review:
    summary: The cited paper concludes the transporter sequesters amines into an intracellular
      compartment; ultrastructural work explicitly finds no VMAT2 on the plasma membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: VMAT2 is a vesicle-membrane protein. In the cited expression-cloning study the
      accumulation kinetics indicated an intracellular compartment, and immunogold electron
      microscopy of rat midbrain dopamine neurons found no detectable VMAT2 along perikaryal
      plasma membranes. Transient appearance at the surface during vesicle recycling is not a
      steady-state plasma-membrane location. Only the abstract of PMID:1438304 was read, so the
      assay behind the IDA cannot be checked; the row is marked over-annotated, not removed, and
      the curator is asked to check it.
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      record: RGD:3694
      slot: GO ID
      requested_change: CHECK
      asserted_value: GO:0005886
      corrected_value: GO:0030672
      cause: OTHER
      confidence: PROBABLE
      explanation: The IDA to GO:0005886 plasma membrane cites PMID:1438304, which reports that
        serotonin accumulation characteristics indicated sequestration into an intracellular
        compartment and provides no plasma-membrane localization; PMID:8753875 reports no
        detectable VMAT2 immunolabeling along plasma membranes. The supported location is the
        synaptic vesicle or secretory vesicle membrane.
      supported_by:
      - reference_id: PMID:8753875
        supporting_text: In contrast, there was no detectable immunolabeling for VMAT2 along the
          nuclear or plasma membranes of perikarya in either region, and only rare immunogold
