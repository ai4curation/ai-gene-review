      vesicles (LDCVs), and we now show that cytoplasmic signals target VMAT2 directly to LDCVs
      within the biosynthetic pathway.
    reference_section_type: ABSTRACT
  - statement: In neurons VMAT2 marks a dendritic vesicle population that undergoes regulated
      exocytosis, providing the mechanism for somatodendritic monoamine release.
    supporting_text: In neurons, VMAT2 localizes to a population of vesicles that we now find
      undergo regulated exocytosis in dendrites.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
