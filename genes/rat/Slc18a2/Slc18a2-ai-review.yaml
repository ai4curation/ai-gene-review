proposed_new_terms:
- proposed_name: serotonin loading into synaptic vesicle
  proposed_definition: The active transport of serotonin into a synaptic vesicle, fuelled by the
    electrochemical proton gradient across the vesicle membrane established by proton pumps.
  proposed_parent:
    id: GO:0015842
    label: aminergic neurotransmitter loading into synaptic vesicle
  justification: GO provides substrate-specific vesicle-loading terms for dopamine (GO:0160310),
    tyramine (GO:0160311) and octopamine (GO:0160312) but none for serotonin or histamine, the two
    substrates for which rat VMAT2 has the best-characterized vesicular transport kinetics. In
    their absence, serotonin-specific claims fall back on GO:0051610 serotonin uptake, whose
    definition is movement into a cell and therefore describes plasma-membrane reuptake rather than
    vesicular loading. A sibling term for serotonin (and, by the same argument, for histamine)
    would let curators state the vesicular process precisely for VMAT1, VMAT2 and their
    invertebrate orthologues.
  supported_by:
  - reference_id: PMID:8125935
    supporting_text: SVAT has a higher affinity than CGAT for monoamine substrates, in particular
      for histamine.
  - reference_id: PMID:1438304
    supporting_text: Direct comparison of [3H]monoamine uptake indicated that serotonin was the
      preferred substrate.
suggested_questions:
- question: Should GO:0015311 monoamine:proton antiporter activity be classified under GO:0005275
    amine transmembrane transporter activity? Monoamines are amines, yet GO:0015311 is currently
    not an is_a descendant of GO:0005275, which makes refinements of the generic amine-transporter
    term look lateral rather than hierarchical.
  experts:
  - GO ontology editors
- question: Are the amine uptake terms (GO:0051610, GO:0051615, GO:0051620, GO:0090494), whose
    definitions specify movement into a cell, intended to cover transport into intracellular
    vesicles by VMAT1 and VMAT2, or should vesicular transporters use loading terms under
    GO:0015842 only?
  experts:
  - GO ontology editors
  - RGD curators
- question: Do rat tissue mast cells express VMAT2? The mouse knockout loses vesicular histamine
    and serotonin in mast cells, but the rat antibody study reports apparent absence of both VMAT
    isoforms there, which leaves the two ISO mast-cell secretion annotations on rat Slc18a2 without
    a verified rat cellular context.
  experts:
  - RGD curators
  - mast cell biologists
- question: The IDA annotation of rat Slc18a2 to GO:0005275 cites PMID:1505023, whose characterized
    clone is the adrenal (VMAT1) transporter, with the brain protein described only as distinct but
    highly related; UniProt nonetheless lists that paper as a nucleotide-sequence source for
    Q01827. Which sequence in that paper does the rat VMAT2 entry rest on?
  experts:
  - UniProt curators
  - RGD curators
suggested_experiments:
- hypothesis: VMAT2 loads histamine into gastric ECL cell secretory vesicles, and the
    fasting-induced fall in VMAT2 is sufficient to shrink the releasable histamine pool.
  description: Conditionally delete Slc18a2 in rat (or mouse) ECL cells and measure vesicular
    versus cytosolic histamine, gastrin-stimulated histamine release and acid secretion, comparing
    the knockout with 24-hour fasted wild-type animals.
- hypothesis: The first luminal loop of VMAT2 is the sensor that couples vesicular amine filling to
    G-protein-dependent inhibition of further uptake.
  description: Reconstitute purified wild-type and luminal-loop-truncated rat VMAT2 with defined
    G-protein subunits into proteoliposomes preloaded with graded monoamine concentrations, and
    measure transport rate as a function of luminal filling to test whether the loop alone is
    sufficient for feedback inhibition.
- hypothesis: Whether rat mast cells store monoamines in a VMAT2-dependent manner can be settled
    with modern isoform-specific reagents.
  description: Use isoform-specific antibodies plus single-cell RNA sequencing of purified rat
    peritoneal and tissue mast cells, with reserpine- and tetrabenazine-sensitivity of histamine and
    serotonin loading in isolated granules as the functional read-out.
