core_functions:
- description: Electrogenic monoamine/proton antiporter of the synaptic-vesicle and dense-core
    vesicle membrane that exchanges one cytosolic cationic monoamine (serotonin, dopamine,
    noradrenaline, adrenaline or histamine) for two luminal protons, converting the V-ATPase
    proton-motive force into a steep luminal amine gradient and thereby loading releasable
    vesicles and setting quantal size.
  molecular_function:
    id: GO:0015311
    label: monoamine:proton antiporter activity
  directly_involved_in:
  - id: GO:0015842
    label: aminergic neurotransmitter loading into synaptic vesicle
  - id: GO:1902600
    label: proton transmembrane transport
  locations:
  - id: GO:0030672
    label: synaptic vesicle membrane
  - id: GO:0099012
    label: neuronal dense core vesicle membrane
  - id: GO:0030667
    label: secretory granule membrane
  supported_by:
  - reference_id: PMID:1438304
    supporting_text: In cells permeabilized with digitonin, uptake was ATP dependent with an
      apparent Km of 1.3 microM.
  - reference_id: PMID:1438304
    supporting_text: Uptake was abolished by the proton-translocating ionophore carbonylcyanide
      p-trifluoromethoxyphenylhydrazone and with tri-(n-butyl)tin, an inhibitor of the vacuolar
      H(+)-ATPase.
  - reference_id: PMID:8125935
    supporting_text: SVAT has a higher affinity than CGAT for monoamine substrates, in particular
      for histamine.
  - reference_id: PMID:8860238
    supporting_text: Transport of (3)H-histamine by both VMAT1 and VMAT2 was reserpine-sensitive
      but only transport by VMAT2 was inhibited by tetrabenazine.
  - reference_id: UniProtKB:Q01827
    supporting_text: Electrogenic antiporter that exchanges one cationic monoamine with two
      intravesicular protons across the membrane of secretory and synaptic vesicles.
    record_section:
    - CC:FUNCTION
- description: Fills the dendritic and somatic large dense-core vesicles of midbrain dopamine
    neurons, which its cytoplasmic sorting signals direct into the regulated secretory pathway,
    thereby enabling activity-dependent somatodendritic dopamine release.
  molecular_function:
    id: GO:0015311
    label: monoamine:proton antiporter activity
  directly_involved_in:
  - id: GO:0099123
    label: somato-dendritic dopamine secretion
  locations:
  - id: GO:0099012
    label: neuronal dense core vesicle membrane
  supported_by:
