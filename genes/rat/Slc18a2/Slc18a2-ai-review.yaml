id: Q01827
gene_symbol: Slc18a2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Rat Slc18a2 encodes VMAT2 (synaptic vesicular amine transporter), a 515-residue
  12-transmembrane member of the SLC18 family within the major facilitator superfamily. VMAT2
  is an electrogenic antiporter in the membrane of synaptic vesicles and large dense-core
  vesicles that exchanges one cytosolic cationic monoamine for two luminal protons, using the
  proton-motive force generated by the vesicular V-type ATPase to build a steep luminal amine
  gradient. Its substrates are serotonin (the highest-affinity substrate, sub-micromolar Km),
  dopamine, noradrenaline, adrenaline and histamine; polyamines are not substrates. By loading
  these amines into releasable vesicles it sets the vesicular monoamine store and hence the
  quantal size of monoaminergic transmission, and because VMAT2 defines which vesicles can
  release monoamines it also underlies dendritic, non-synaptic (somatodendritic) dopamine
  release in midbrain dopamine neurons. VMAT2 is expressed in central serotonergic,
  dopaminergic, noradrenergic, adrenergic (C1) and histaminergic neurons, and peripherally in
  gastric enterochromaffin-like cells and pancreatic beta cells, where vesicular monoamine
  handling modulates histamine release and insulin secretion respectively. Transport activity
  is tuned by luminal amine content through a G-protein-dependent mechanism involving the first
  luminal loop, inhibited by Hsc70, promoted by CAPS1/CAPS2, and physically coupled to dopamine
  synthesis through a complex with tyrosine hydroxylase and aromatic amino acid decarboxylase.
  VMAT2 is the target of reserpine (a substrate-site blocker) and of the selective
  non-competitive inhibitor tetrabenazine, and by sequestering cationic xenobiotics such as
  MPP+ into vesicles it protects monoaminergic cells from their toxicity.
