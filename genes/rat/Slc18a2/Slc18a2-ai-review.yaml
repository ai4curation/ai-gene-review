- id: PMID:1438304
  title: Expression cloning of a reserpine-sensitive vesicular monoamine transporter.
  findings:
  - statement: Expression of the rat VMAT2 (MAT) cDNA in CV-1 cells confers serotonin accumulation
      into an intracellular compartment; in digitonin-permeabilized cells uptake is ATP dependent
      with a Km of 1.3 micromolar and is abolished by a protonophore or a V-ATPase inhibitor.
    supporting_text: In cells permeabilized with digitonin, uptake was ATP dependent with an
      apparent Km of 1.3 microM.
    reference_section_type: ABSTRACT
  - statement: Serotonin is the preferred substrate, with dopamine, noradrenaline and adrenaline
      also competing; reserpine and tetrabenazine are the most potent inhibitors.
    supporting_text: The rank order of potency to inhibit uptake was reserpine > tetrabenazine >
      serotonin > dopamine > norepinephrine > epinephrine.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached PubMed record matches the GOA title; this is the founding functional
      characterization of rat VMAT2 and UniProt cites it for FUNCTION and TRANSPORT ACTIVITY.
      Abstract-only in the cache.
