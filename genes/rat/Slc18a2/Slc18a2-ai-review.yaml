- term:
    id: GO:0005335
    label: serotonin:sodium:chloride symporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000607052
  - RGD:3693
  - WB:WBGene00000295
  review:
    summary: The mechanism is wrong, because VMAT2 is a proton-coupled antiporter of the SLC18/MFS
      family, not a Na+/Cl--coupled symporter of the SLC6 family.
    action: REMOVE
    reason: Serotonin transport by rat VMAT2 is driven by the vesicular proton gradient, is
      abolished by protonophores and by V-ATPase inhibition, and requires no sodium or chloride;
      Na+/Cl--coupled serotonin symport is the activity of the plasma-membrane transporter SERT
      (Slc6a4). The donors on this PANTHER node (rat Slc18a1, C. elegans cat-1) are themselves
      vesicular H+ antiporters, so the node is mis-typed rather than mis-propagated, and the
      claim is false for every member it reaches.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000607052
        source_status: SOURCE_BAD
        comment: The ancestral node is the vesicular monoamine/acetylcholine transporter clade;
          assigning it a sodium/chloride-coupled symporter activity contradicts the mechanism of
          every characterized member.
      - source_id: RGD:3693
        source_status: SOURCE_BAD
        comment: Rat Slc18a1 (VMAT1) is also a proton-coupled vesicular antiporter, not a
          Na+/Cl- symporter.
      - source_id: WB:WBGene00000295
        source_status: SOURCE_BAD
        comment: C. elegans cat-1 is the worm vesicular monoamine transporter, same mechanism.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000607052
      slot: GO ID
      requested_change: DELETE_ROW
      asserted_value: GO:0005335
      corrected_value: GO:0015311
      cause: OTHER
      confidence: CONFIRMED
      explanation: The PAINT node for the vesicular monoamine/acetylcholine transporter clade
        carries GO:0005335 serotonin:sodium:chloride symporter activity, an SLC6-family
        plasma-membrane activity. SLC18 transporters are proton-coupled vesicular antiporters, and
        rat VMAT2 serotonin uptake is ATP-dependent and abolished by a protonophore and by a
        V-ATPase inhibitor. The IBA rows derived from this node should be retracted (or retyped
