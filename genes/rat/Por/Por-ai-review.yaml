  qualifier: involved_in
  review:
    summary: IDA positive regulation of steroid hormone biosynthetic process.
    action: KEEP_AS_NON_CORE
    reason: >-
      POR is rate-limiting for the steroidogenic P450s: hypophysectomy lowers reductase protein and
