id: P00388
gene_symbol: Por
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Rat Por encodes NADPH--cytochrome P450 reductase (CPR/POR), a 678-residue diflavin flavoprotein anchored
  in the endoplasmic reticulum membrane by a single N-terminal transmembrane helix, with its catalytic
  body facing the cytosol. It binds one FMN in an N-terminal flavodoxin-like domain and one FAD plus
  NADP(H) in C-terminal ferredoxin-NADP+ reductase-like domains; electrons from NADPH pass FAD to FMN,
  and a hinge-mediated opening of the FMN domain lets it dock onto partner hemoproteins. POR is the
  obligate electron donor for all microsomal cytochromes P450 and therefore underpins xenobiotic and
  drug oxidation, fatty acid and sterol hydroxylation, and steroid hormone synthesis; it also reduces
  heme oxygenase-1, cytochrome b5 and, in vitro, cytochrome c. Secondary redox chemistry includes reduction
  of organic nitrates such as glyceryl trinitrate to nitrite, generation of hydrogen peroxide, and participation
  with a partner hemoprotein in NADPH-dependent nitric oxide consumption by brain membranes. The rat
  protein was the first diflavin reductase to be solved crystallographically and is the prototype of
  the NOS reductase-domain fold. Hepatic Por levels are hormonally and xenobiotically regulated (pituitary/thyroid
  hormones, gonadotropins in ovary, glucocorticoid and PXR ligands), and because POR is rate-limiting
  for P450 catalysis, loss of its activity lowers sterol and steroid output, which in cartilage reduces
  cholesterol-dependent Indian hedgehog signalling.
