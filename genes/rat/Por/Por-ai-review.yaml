- term:
    id: GO:0046210
    label: nitric oxide catabolic process
  evidence_type: IDA
  original_reference_id: PMID:19152507
  qualifier: involved_in
  review:
    summary: IDA nitric oxide catabolic process in rat brain membranes and purified CYPOR.
    action: KEEP_AS_NON_CORE
    reason: >-
      POR is required for NADPH-dependent NO consumption by rat brain membranes (antibody and DPI inhibition,
      and the amount of CYPOR correlates with the consumption rate), and it performs the reducing step
      of the cycle, so participation in NO breakdown holds. It is a peripheral role: the oxygen chemistry
      is done by a partner hemoprotein, and this activity has been characterised only in brain membranes.
    supported_by:
    - reference_id: PMID:19152507
      supporting_text: Antibodies against CYPOR inhibited NO consumption by brain membranes
    - reference_id: PMID:19152507
      supporting_text: >-
        Hence, it appears that, during the purification process, CYPOR becomes separated from a partner
        needed for NO consumption.
