core_functions:
- description: >-
    NADPH-dependent diflavin reductase of the endoplasmic reticulum membrane that transfers electrons
    from NADPH through FAD and FMN to microsomal cytochromes P450 and to other hemoprotein acceptors
    (heme oxygenase-1, cytochrome b5), supporting the monooxygenase reactions of xenobiotic, fatty acid,
    sterol and steroid metabolism.
  supported_by:
  - reference_id: UniProtKB:P00388
    supporting_text: >-
      This enzyme is required for electron transfer from NADP to cytochrome P450 in microsomes. It can
      also provide electron transfer to heme oxygenase and cytochrome B5.
  - reference_id: PMID:9237990
    supporting_text: CPR is a membrane-bound protein and catalyzes electron transfer from NADPH to all
      known microsomal cytochromes P450.
  - reference_id: PMID:19171935
    supporting_text: >-
      NADPH-cytochrome P450 oxidoreductase (CYPOR) catalyzes the transfer of electrons to all known
      microsomal cytochromes P450.
  - reference_id: PMID:15823091
    supporting_text: CPR is the main electron transfer component of hydroxylation reactions catalyzed
      by microsomal cytochrome P450s.
  molecular_function:
    id: GO:0003958
    label: NADPH-hemoprotein reductase activity
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  substrates:
  - id: CHEBI:57783
    label: NADPH
suggested_questions:
- question: >-
    Which hemoprotein is the CYPOR partner that performs the oxygen chemistry of NADPH-dependent NO
    consumption in brain membranes, and should the nitric oxide dioxygenase activity then be annotated
    to that protein with POR annotated as its electron donor?
- question: >-
    Should POR carry a cholesterol/sterol biosynthetic process term for its role as electron donor to
    CYP51A1 and squalene monooxygenase? Neither rat nor human POR carries one, and the available evidence
    here is a knockdown phenotype, so a convention decision is needed on whether the electron donor
    participates in the pathways of the monooxygenases it reduces.
- question: >-
    Is 'enzyme binding' the best available term for POR's docking onto P450s and heme oxygenase-1, or
    would a cytochrome-P450-binding child term be worth requesting?
suggested_experiments:
- description: >-
    Reconstitute purified rat POR with individual brain cytochrome P450s (e.g. CYP2D- and CYP1A-class)
    in defined phospholipid vesicles and measure NADPH-dependent NO consumption and nitrate formation,
    to identify the partner and establish whether the system is a true NO dioxygenase.
- description: >-
    Measure sterol and steroid flux in rat granulosa cells and chondrocytes after graded POR knockdown
    while clamping cholesterol, to separate POR's electron-donor contribution to sterol synthesis from
    downstream hedgehog-dependent phenotypes.
- description: >-
    Compare the subcellular distribution of endogenous rat POR by fractionation plus protease-protection
    and by immunofluorescence, to test whether the cytosolic and nucleoplasmic signals reported for
    the human ortholog reflect genuine soluble pools.
