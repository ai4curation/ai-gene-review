- term:
    id: GO:0047726
    label: iron-cytochrome-c reductase activity
  evidence_type: IDA
  original_reference_id: PMID:15823091
  qualifier: enables
  review:
    summary: IDA iron-cytochrome-c reductase activity, from characterisation of a proteolytically stable
      CPR mutant.
    action: MODIFY
    reason: >-
      The assay is NADPH-dependent reduction of cytochrome c by CPR. GO:0047726 (EC 1.16.2.1) is the
      reduction of free ferric iron by reduced cytochrome c, which runs the other way and is not what
      CPR does; the correct term for NADPH-dependent cytochrome c reduction is NADPH-hemoprotein reductase
      activity, which this gene already carries.
    supported_by:
    - reference_id: PMID:15823091
      supporting_text: CPR is the main electron transfer component of hydroxylation reactions catalyzed
        by microsomal cytochrome P450s.
    - reference_id: PMID:9237990
      supporting_text: CPR is a membrane-bound protein and catalyzes electron transfer from NADPH to
        all known microsomal cytochromes P450.
    proposed_replacement_terms:
    - id: GO:0003958
      label: NADPH-hemoprotein reductase activity
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      requested_change: REPOINT
      asserted_value: GO:0047726
      corrected_value: GO:0003958
      corrected_label: NADPH-hemoprotein reductase activity
      confidence: PROBABLE
      explanation: >-
        PMID:15823091 measures NADPH-cytochrome c reductase activity of rat CPR. GO:0047726 iron-cytochrome-c
        reductase activity (EC 1.16.2.1) describes reduction of Fe(3+) by reduced cytochrome c, the
        opposite direction; the row should be repointed to GO:0003958 NADPH-hemoprotein reductase activity.
