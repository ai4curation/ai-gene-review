  review:
    summary: IEA (Ensembl Compara) from human POR enzyme activator activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      POR donates electrons to P450s as their redox partner; it is a co-substrate enzyme in the reaction
