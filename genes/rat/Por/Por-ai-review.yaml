      inhibitors block membrane NO consumption, and nitrate was not measured. The NO dioxygenase chemistry
      is attributed to a partner, most likely a P450 heme reduced by CYPOR; CYPOR's own activity in
      this system is NADPH-hemoprotein reductase activity. Assigning the whole NOD reaction (EC 1.14.12.17)
      to the reductase over-annotates it.
    supported_by:
    - reference_id: PMID:19152507
      supporting_text: >-
        Hence, it appears that, during the purification process, CYPOR becomes separated from a partner
        needed for NO consumption.
    - reference_id: PMID:19152507
      supporting_text: Cytochrome P450 inhibitors inhibited NO consumption by brain membranes, making
        these proteins likely candidates.
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      requested_change: CHECK
      asserted_value: GO:0008941
      confidence: PROBABLE
      explanation: >-
        PMID:19152507 shows that purified CYPOR requires a partner (likely a cytochrome P450, or Trolox
        in vitro) to consume NO, and does not measure nitrate. The NO dioxygenase reaction belongs to
        the CYPOR/P450 system; for Por the supported MF is NADPH-hemoprotein reductase activity (already
        annotated). Consider removing GO:0008941 or using contributes_to.
