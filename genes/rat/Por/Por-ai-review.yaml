- term:
    id: GO:0006809
    label: nitric oxide biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0011676
  - MGI:MGI:97360
  - MGI:MGI:97361
  - MGI:MGI:97362
  - PANTHER:PTN002322100
  - RGD:3184
  - RGD:3185
  - RGD:3186
  - UniProtKB:P29473
  - UniProtKB:P29474
  - UniProtKB:P35228
  review:
    summary: IBA nitric oxide biosynthesis from PTN002322100, seeded only by nitric oxide synthases.
    action: REMOVE
    reason: >-
      NO synthesis is performed by the heme oxygenase domain of NOS. POR is homologous only to the NOS
      reductase moiety and has no oxygenase domain, so it cannot synthesize NO. The IBD node is placed
      too deep and sweeps in the animal CPRs. The organic nitrate reduction POR catalyses yields nitrite,
      not NO.
    supported_by:
    - reference_id: PMID:9237990
      supporting_text: >-
        Microsomal NADPH-cytochrome P450 reductase (CPR) is one of only two mammalian enzymes known
        to contain both FAD and FMN, the other being nitric-oxide synthase.
    - reference_id: PMID:9237990
      supporting_text: >-
        The molecule is composed of four structural domains: (from the N- to C- termini) the FMN-binding
        domain, the connecting domain, and the FAD- and NADPH-binding domains.
    - reference_id: PMID:16527817
      supporting_text: >-
        Therefore, CPR catalyzes organic nitrate reduction, producing nitrite, whereas CP can mediate
        further nitrite reduction to NO.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002322100
        source_label: PANTHER:PTN002322100
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          All seeds are NOS1/2/3 and Drosophila Nos; the PTHR19384 family review rates this node TOO_DEEP
          because it also covers the animal microsomal CPRs (SF17), which lack the oxygenase domain.
    source_defects:
    - defect_type: OTHER
      resource: GO_CENTRAL
      requested_change: CHECK
      asserted_value: PANTHER:PTN002322100
      confidence: PROBABLE
      explanation: >-
        The GO:0006809 IBD at PTN002322100 propagates to animal NADPH-cytochrome P450 reductases (PTHR19384:SF17),
        which have no NOS oxygenase domain. The IBD should be moved to the NOS clade or blocked with
        an IRD at the CPR branch.
