        all known microsomal cytochromes P450.
    - reference_id: PMID:15823091
      supporting_text: CPR is the main electron transfer component of hydroxylation reactions catalyzed
        by microsomal cytochrome P450s.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P16435
        source_label: human POR
        source_status: SOURCE_BAD
        comment: Donor IDA (BHF-UCL, PMID:19448135) treats electron donation to P450 as enzyme activation.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      requested_change: REPOINT
      asserted_value: GO:0008047
      corrected_value: GO:0003958
      corrected_label: NADPH-hemoprotein reductase activity
      confidence: PROBABLE
      explanation: >-
        Human POR (P16435) GO:0008047 enzyme activator activity (BHF-UCL, PMID:19448135) describes POR
        as the electron donor in a reconstituted CYP2C9/CYP2D6 system. Electron donation is the reductase's
        catalytic activity (GO:0003958), not activator activity; please check the donor annotation,
        which is propagated to rat by Ensembl and RGD ISO.
