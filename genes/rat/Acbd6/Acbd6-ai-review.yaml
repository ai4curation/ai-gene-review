id: Q5RJK8
gene_symbol: Acbd6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Rat Acbd6 encodes a soluble 282-residue monomeric acyl-CoA-binding protein that is the
  one-to-one mammalian ortholog of human ACBD6 and mouse Acbd6, combining an N-terminal
  four-helix acyl-CoA-binding (ACB) domain (residues 42-127) with two C-terminal ankyrin
  (ANK) repeats (residues 191-220 and 224-253) and lacking any transmembrane segment.
  Quantitative multi-organ phosphoproteomics in rat directly detects endogenous
  phosphorylation of Acbd6 at Ser41 immediately upstream of the ACB domain, alongside
  conserved Ser106/Ser108 loop sites and complete preservation of the acyl-CoA binding
  pocket (Phe46, Tyr69, Lys73, Lys95, Tyr114). In mammalian cells, Acbd6 localizes to the
  cytosol and nucleus, selectively binds medium- and long-chain unsaturated fatty-acyl-CoA
  thioesters without binding unesterified fatty acids, modulates acyl-CoA delivery to
  membrane lysophospholipid acyltransferases, and binds cytosolic N-myristoyltransferases
  via its C-terminal ANK module to stimulate protein N-myristoylation while preventing
  competitive inhibition by palmitoyl-CoA. A back-spliced non-coding circular RNA derived
  from the rat locus (circAcbd6) independently acts as a cytoplasmic miR-320-5p sponge in
  hippocampal neural stem cells, an RNA-mediated activity distinct from the Q5RJK8 protein.
