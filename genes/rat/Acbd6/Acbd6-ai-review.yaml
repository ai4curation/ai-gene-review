- id: PMID:18268358
  title: Characterization of an acyl-coenzyme A binding protein predominantly expressed
    in human primitive progenitor cells.
  findings:
  - statement: >-
      Human ACBD6 binds long-chain unsaturated fatty-acyl-CoAs via its N-terminal ACB
      domain.
    supporting_text: >-
      ACBD6 binds long-chain acyl-CoAs with a strong preference for unsaturated, C18:1-CoA
      and C20:4-CoA, over saturated, C16:0-CoA, acyl species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary biochemical characterization of human ACBD6 (full text read), grounding
      orthologous acyl-CoA binding on rat Q5RJK8.
- id: PMID:22673903
  title: Quantitative maps of protein phosphorylation sites across 14 different rat
    organs and tissues.
  findings:
  - statement: >-
      Large-scale quantitative phosphoproteomics across 14 rat organs catalogued in vivo
      tissue phosphoproteins, providing the direct rat evidence curated on Q5RJK8 for
      endogenous Ser41 phosphorylation.
    supporting_text: >-
      Here we present the broadest tissue catalogue of phosphoproteins to date, covering
      31,480 phosphorylation sites on 7,280 proteins quantified across 14 rat organs and
      tissues.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read; rat Acbd6 Ser41 phosphorylation is recorded in supplementary dataset
      tables and curated in UniProtKB:Q5RJK8 FT MOD_RES 41.
- id: PMID:26621918
  title: Association of NMT2 with the acyl-CoA carrier ACBD6 protects the N-myristoyltransferase
    reaction from palmitoyl-CoA.
  findings:
  - statement: >-
      Human ACBD6 associates with NMT2 and NMT1 via its C-terminal domain and requires
      Tyr114-dependent acyl-CoA binding to stimulate NMT2 catalysis.
    supporting_text: >-
      Compared with ACBD6, two ACBD6 mutant forms, Y 114 A and FKKY-AAAA (dubbed FKKY mut
      ), with defects in acyl-CoA binding ( 19 ) failed to stimulate the reaction in the
      presence of C 14 -CoA, thus acyl-CoA binding of ACBD6 is required for the stimulatory
      effect on NMT2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read; grounds GO:0008047 enzyme activator activity transferred to rat Q5RJK8.
- id: PMID:35305988
  title: circRNA Acbd6 promotes neural stem cell differentiation into cholinergic
    neurons via the miR-320-5p-Osbpl2 axis.
  findings:
  - statement: >-
      In rat hippocampal exosomes and neural stem cells, a non-coding circular RNA derived
      from the Acbd6 locus (circAcbd6) sponges miR-320-5p to elevate Osbpl2 expression and
      promote cholinergic differentiation—a non-coding RNA function distinct from the Q5RJK8
      protein.
    supporting_text: >-
      By luciferase reporter assay, we demonstrated that circAcbd6 functioned as an
      endogenous miR-320-5p sponge to inhibit miR-320-5p activity, resulting in increased
      oxysterol-binding protein-related protein 2 expression with subsequent facilitation of
      NSC differentiation.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text read. Characterizes a rat circular RNA (circAcbd6) rather than the Q5RJK8
      protein; included to ensure miRNA-sponge/cholinergic differentiation claims are not
      misattributed to the Acbd6 protein product.
- id: PMID:37951597
  title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive
    and complex movement disorders.
  findings:
  - statement: >-
      Mammalian ACBD6 localizes to the cytosol and nucleus and is absent from peroxisomes.
    supporting_text: >-
      This protein is detected in the cytosol and nuclei of cells and modulates the
      acylation of lipids and proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read; establishes mammalian cytosolic and nuclear localization of ACBD6.
