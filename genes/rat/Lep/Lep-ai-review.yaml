- term:
    id: GO:0033210
    label: leptin-mediated signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:11677594
  qualifier: involved_in
  review:
    summary: Leptin initiates the leptin-mediated signaling pathway via LEPR.
    action: ACCEPT
    reason: Core process. Rat leptin activates STAT3 and MAPK via rat OBRb, induces immediate early genes via OBRb
      and OBRa, and activates hypothalamic JAK-STAT signalling in vivo.
    supported_by:
    - reference_id: PMID:9618284
      supporting_text: As the result of leptin stimulation, enhanced levels of tyrosine phosphorylation of STAT3
        and MAPK were detected in CHO-OBRb cells.
    - reference_id: PMID:9070213
      supporting_text: which are induced by leptin addition, not only in CHO cells expressing the OBRb, but also
        in cells expressing one of the short form receptors, OBRa.
    - reference_id: PMID:21250909
      supporting_text: Systemically administered PEG-MLA effectively blocks leptin signal induction of hypothalamic
        JAK-STAT signaling.
