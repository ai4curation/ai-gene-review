- term:
    id: GO:0046627
    label: negative regulation of insulin receptor signaling pathway
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - RGD:13902885
  review:
    summary: Negative regulation of insulin receptor signaling pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: Leptin modulates insulin signalling in some peripheral tissues, but the effect is indirect and context
      dependent (rat hepatic stellate cell data report leptin promoting IRS/PI3K/AKT signalling). Leptin acts on
      this process only indirectly, as an extracellular ligand that activates LEPR signalling in target cells (or
      centrally via the hypothalamus). The effect is real but is one of many pleiotropic downstream consequences
      of receptor activation, and the term describes the process rather than the hormone's own activity.
    supported_by:
    - reference_id: PMID:20977462
      supporting_text: Curcumin suppressed the leptin-induced membrane translocation of GLUT4 by interrupting the
        insulin receptor substrates/phosphatidyl inositol 3-kinase/AKT signalling pathway.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: RGD:13902885
        source_status: SUPPORTS_TRANSFER
        comment: Source is an RGD-held entity; effect is indirect and of uncertain direction.
