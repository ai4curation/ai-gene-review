      record_section: ["FT:SIGNAL"]
      supporting_text: FT   SIGNAL          1..21
- term:
    id: GO:0006006
    label: glucose metabolic process
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:104663
  review:
    summary: Broad metabolic-process term.
    action: MARK_AS_OVER_ANNOTATED
    reason: Leptin regulates lipid and glucose metabolism systemically through LEPR signalling but does not catalyse
      or participate in the metabolic pathways named. Leptin acts on this process only indirectly, as an extracellular
      ligand that activates LEPR signalling in target cells (or centrally via the hypothalamus). The effect is real
      but is one of many pleiotropic downstream consequences of receptor activation, and the term describes the
      process rather than the hormone's own activity.
    supported_by:
    - reference_id: file:rat/Lep/Lep-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Key player in the regulation of energy balance and body weight control.
    - reference_id: file:rat/Lep/Lep-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: In the periphery, increases basal metabolism, influences reproductive function, regulates
        pancreatic beta-cell function and insulin secretion, is pro-angiogenic for endothelial cell and affects
        innate and adaptive immunity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes: &id002
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:104663
        source_status: SUPPORTS_TRANSFER
        comment: Leptin regulates this metabolism indirectly; the process term conflates regulation with participation.
