suggested_questions:
- question: Does signalling through the short OBRa isoform (MAPK only) mediate any physiological leptin action in
    rat tissues in vivo, or is it confined to transport and clearance roles?
- question: Which of leptin's reported peripheral effects in rat (cardiac hypertrophy, cartilage catabolism, hepatic
    stellate cell activation, intestinal ion and nutrient transport) occur at physiological leptin concentrations
    rather than only at supraphysiological doses in vitro?
suggested_experiments:
- description: Compare tissue-specific Lepr isoform knockout rats (OBRb-only vs OBRa-only deletion) for leptin-induced
    STAT3 and MAPK activation and for feeding, renal clearance and blood-brain transport of leptin.
  hypothesis: OBRa contributes to leptin transport and peripheral MAPK signalling but not to appetite suppression.
