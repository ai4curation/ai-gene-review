- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IDA
  original_reference_id: PMID:17324488
  qualifier: located_in
  review:
    summary: Cytosol (IDA) from a study of megalin-mediated leptin transport.
    action: MARK_AS_OVER_ANNOTATED
    reason: The study shows leptin binding megalin and transcytosis across the choroid plexus epithelium; internalised
      leptin travels in endocytic/transcytotic vesicles, not free in the cytosol, and leptin carries a signal peptide.
      The full text was not available to us, so the precise observation behind 'cytosol' cannot be checked; the
      location is at best a transient trafficking compartment and not where leptin functions.
    supported_by:
    - reference_id: PMID:17324488
      supporting_text: We demonstrate that circulating leptin is transported into the brain by binding to megalin
        at the choroid plexus epithelium.
