- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: IPI
  original_reference_id: PMID:15131016
  qualifier: enables
  supporting_entities:
  - RGD:68407
  review:
    summary: Signaling receptor binding (IPI) based on leptin binding to megalin in kidney.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IPI partner in PMID:15131016 is megalin (LRP2), an endocytic cargo receptor that internalises and
      degrades filtered leptin in proximal tubules; the same paper argues that leptin receptors are not involved
      in renal uptake. Leptin is cargo for megalin rather than a signalling ligand, so 'signaling receptor binding'
      over-states this interaction. Leptin's genuine signalling-receptor binding is captured by leptin receptor
      binding (GO:1990460).
    supported_by:
    - reference_id: PMID:15131016
      supporting_text: Megalin bound leptin in the presence of Ca(2+) and mediated its cellular internalization
        and degradation.
- term:
    id: GO:0005125
    label: cytokine activity
  evidence_type: TAS
  original_reference_id: PMID:11829746
  qualifier: enables
  review:
    summary: Cytokine activity (TAS).
    action: KEEP_AS_NON_CORE
    reason: Leptin is a four-helix-bundle long-chain cytokine-like protein that signals through a class I cytokine
      receptor and has immunomodulatory actions, so 'cytokine activity' is defensible. Its principal activity is
      endocrine (hormone activity, accepted), so this term is kept as non-core. The cited paper is about leptin
      production by fa/fa adipose cells rather than cytokine activity per se.
    supported_by:
    - reference_id: file:rat/Lep/Lep-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the leptin family.
    - reference_id: PMID:36959263
      supporting_text: Leptin induces type I cytokine receptor assemblies featuring 3:3 stoichiometry
    - reference_id: PMID:11829746
      supporting_text: A marked and co-ordinate increase in leptin mRNA, gene transcription and promoter activity
        was observed in obese compared with lean (Fa/fa) rat adipose cells, and this resulted in increased leptin
        release in culture.
