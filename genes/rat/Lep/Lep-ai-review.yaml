- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P41160
  - ensembl:ENSMUSP00000067046
  review:
    summary: Negative regulation of transcription by RNA polymerase II.
    action: MARK_AS_OVER_ANNOTATED
    reason: Leptin is a secreted hormone without nuclear function; transcriptional changes are mediated by LEPR-activated
      STAT3 in target cells. Leptin acts on this process only indirectly, as an extracellular ligand that activates
      LEPR signalling in target cells (or centrally via the hypothalamus). The effect is real but is one of many
      pleiotropic downstream consequences of receptor activation, and the term describes the process rather than
      the hormone's own activity.
    supported_by:
    - reference_id: file:rat/Lep/Lep-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Once released into the circulation, has central and peripheral effects by binding LEPR
    - reference_id: file:rat/Lep/Lep-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: increases expression of genes involved in cell cycle regulation such as CCND1, via JAK2-STAT3
        pathway
