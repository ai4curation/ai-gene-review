- term:
    id: GO:0002021
    label: response to dietary excess
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00087859
  review:
    summary: Response to dietary excess.
    action: KEEP_AS_NON_CORE
    reason: A central leptin antagonist exacerbated food intake and weight gain on a high-fat diet in rats, showing
      that endogenous leptin signalling restrains the response to dietary excess. A genuine physiological role,
      but a context of its core energy-homeostasis function rather than a separate core role.
    supported_by:
    - reference_id: PMID:19726711
      supporting_text: Food consumption and body weight gain were exacerbated in the antagonist group during both
        chow and high-fat feeding periods
    - reference_id: PMID:19726711
      supporting_text: These data indicate that submaximal central leptin receptor blockade promotes obesity and
        diminishes WR activity.
