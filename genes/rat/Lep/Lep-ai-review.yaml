- term:
    id: GO:0060587
    label: regulation of lipoprotein lipid oxidation
  evidence_type: IDA
  original_reference_id: PMID:21068181
  qualifier: involved_in
  review:
    summary: Regulation of lipoprotein lipid oxidation (IDA).
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited abstract concerns leptin effects on lipolysis, NEFA oxidation and glyceroneogenesis in white
      adipose tissue; it does not address oxidation of lipoprotein lipids (e.g. LDL oxidation), which is what this
      term describes. The full text was not available, so this is flagged rather than removed.
    supported_by:
    - reference_id: PMID:21068181
      supporting_text: Leptin is secreted by white adipose tissue (WAT) and induces lipolysis and nonesterified
        fatty acid (NEFA) oxidation.
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      requested_change: CHECK
      asserted_value: GO:0060587
      cause: UNKNOWN
      confidence: SUSPECTED
      explanation: Rat Lep (RGD:3000) is annotated by IDA from PMID:21068181 to GO:0060587 regulation of lipoprotein
        lipid oxidation. The paper studies leptin-induced, NO-mediated inhibition of lipolysis and glyceroneogenesis
        in rat white adipose tissue and mentions NEFA oxidation; lipoprotein lipid oxidation is not described in
        the abstract. A term such as regulation of fatty acid oxidation or regulation of lipolysis may have been
        intended.
- term:
    id: GO:0060612
    label: adipose tissue development
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:104663
  review:
    summary: Regulation of lipid biosynthesis / adipocyte differentiation / adipose development.
    action: MARK_AS_OVER_ANNOTATED
    reason: Transferred from mouse leptin-deficiency or treatment phenotypes. These reflect secondary effects of
      leptin deficiency (obesity, altered sympathetic tone) on adipose tissue rather than a direct regulatory role
      of the hormone. Leptin acts on this process only indirectly, as an extracellular ligand that activates LEPR
      signalling in target cells (or centrally via the hypothalamus). The effect is real but is one of many pleiotropic
      downstream consequences of receptor activation, and the term describes the process rather than the hormone's
      own activity.
    supported_by:
    - reference_id: file:rat/Lep/Lep-uniprot.txt
