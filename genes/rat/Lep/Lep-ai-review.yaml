- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P41160
  - ensembl:ENSMUSP00000067046
  review:
    summary: DNA binding transferred from mouse Lep.
    action: REMOVE
    reason: Leptin is a secreted four-helix hormone with an N-terminal signal peptide and no DNA-binding domain
      or nuclear role. The mouse source annotation (MGI IDA, PMID:29519872) reflects a DNA-DNA contact between the
      Lnc-leptin enhancer locus and the Lep gene locus, i.e. a property of the gene's chromatin, misattributed to
      the protein.
    supported_by:
    - reference_id: file:rat/Lep/Lep-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: FT   SIGNAL          1..21
    - reference_id: file:rat/Lep/Lep-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Secreted'
    - reference_id: PMID:29519872
      supporting_text: Direct interaction was detected between DNA loci of Lnc-leptin and Lep in mature adipocytes
    source_defects: &id001
    - defect_type: WRONG_TERM
      resource: MGI
      record: MGI:MGI:104663
      requested_change: DELETE_ROW
      asserted_value: GO:0003677
      cause: OTHER
      confidence: PROBABLE
      explanation: Mouse Lep (MGI:104663, UniProtKB:P41160) carries an MGI IDA annotation to GO:0003677 DNA binding
        from PMID:29519872. That paper reports a chromatin contact between the DNA loci of the enhancer-derived
        lncRNA Lnc-leptin and the Lep gene; it does not show that the leptin protein binds DNA. Leptin is a signal-peptide
        secreted hormone with no DNA-binding domain. The mouse row should be deleted, which would also remove the
        propagated rat ISO (GO_REF:0000121) and Ensembl Compara IEA (GO_REF:0000107) rows.
