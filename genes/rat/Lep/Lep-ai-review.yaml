id: P50596
gene_symbol: Lep
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Leptin is a 167-residue secreted four-helix-bundle cytokine-like peptide hormone (146-residue mature
  chain after removal of a 21-residue signal peptide) produced mainly by white adipocytes, with circulating levels
  that track fat mass and nutritional state. It binds the class I cytokine receptor LEPR (OB-R), assembling ligand-receptor
  complexes that activate JAK2-STAT3, MAPK and PI3K-AKT signalling; in rat, signalling occurs through both the long
  OBRb and the short OBRa isoforms. Its principal role is as the afferent signal of energy stores to the hypothalamus,
  where it suppresses food intake and supports energy expenditure, so that loss of leptin signalling causes hyperphagia
  and obesity. Leptin is also required permissively for reproductive neuroendocrine function, and peripheral LEPR
  signalling mediates pleiotropic effects on immune cells, endothelium, heart, intestine, adipose tissue, bone and
  cartilage. Circulating leptin is cleared by the kidney and transported into the brain in part by the endocytic
  receptor megalin (LRP2).
