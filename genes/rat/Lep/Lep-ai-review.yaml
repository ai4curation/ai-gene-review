- term:
    id: GO:0001542
    label: ovulation from ovarian follicle
  evidence_type: IDA
  original_reference_id: PMID:17071778
  qualifier: involved_in
  review:
    summary: Ovulation from ovarian follicle (IDA).
    action: MODIFY
    reason: The paper shows that acute leptin treatment inhibits gonadotrophin-induced ovulation in rats, while
      leptin deficiency in mice causes sterility corrected by leptin. Leptin therefore regulates ovulation (in both
      directions depending on dose and context) rather than participating in follicle rupture; regulation of ovulation
      (GO:0060278) is the correct claim.
    proposed_replacement_terms:
    - id: GO:0060278
      label: regulation of ovulation
    supported_by:
    - reference_id: PMID:17071778
      supporting_text: the ovulatory process was significantly inhibited in response to an acute treatment with
        leptin
    - reference_id: PMID:8589726
      supporting_text: recombinant human ob protein, leptin, into homozygous female ob/ob mice can correct their
        sterility
