- term:
    id: GO:0006112
    label: energy reserve metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002620302
  - RGD:3000
  review:
    summary: Energy reserve metabolic process.
    action: MODIFY
    reason: Leptin does not catalyse storage or mobilisation of energy reserves; it signals the size of the reserves
      and regulates intake and expenditure. In perfused rat hearts leptin increased fatty acid oxidation and lowered
      TG content, a downstream regulatory effect. Energy homeostasis (GO:0097009) states leptin's role correctly.
    proposed_replacement_terms:
    - id: GO:0097009
      label: energy homeostasis
    supported_by:
    - reference_id: PMID:12058043
      supporting_text: Leptin (60 ng/ml) significantly increased palmitate oxidation rates 60% above control hearts
    - reference_id: PMID:7624777
      supporting_text: These data suggest that the OB protein serves an endocrine function to regulate body fat
        stores.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002620302
        source_status: SUPPORTS_TRANSFER
        comment: Leptin family node; the conserved ancestral role is endocrine control of energy stores, better
          captured by energy homeostasis.
