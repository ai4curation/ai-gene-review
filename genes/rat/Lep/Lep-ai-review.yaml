- term:
    id: GO:0033686
    label: positive regulation of luteinizing hormone secretion
  evidence_type: IEP
  original_reference_id: PMID:19112389
  qualifier: involved_in
  review:
    summary: Positive regulation of LH secretion.
    action: KEEP_AS_NON_CORE
    reason: Third-ventricle leptin increased serum LH in female rats, consistent with leptin's permissive neuroendocrine
      role in reproduction. Non-core. (Evidence code IEP is weak but the paper is an intervention study.)
    supported_by:
    - reference_id: PMID:19112389
      supporting_text: The results showed that serum LH levels increased dramatically in group B, six hours after
        leptin administration.
- term:
    id: GO:0035360
    label: positive regulation of peroxisome proliferator activated receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:20738325
  qualifier: involved_in
  review:
    summary: Positive regulation of PPAR signaling (IDA).
    action: MARK_AS_OVER_ANNOTATED
    reason: Leptin increased PPARalpha expression and activity in cultured cardiomyocytes. This is a downstream,
      cell-type specific in vitro effect of LEPR signalling. Leptin acts on this process only indirectly, as an
      extracellular ligand that activates LEPR signalling in target cells (or centrally via the hypothalamus). The
      effect is real but is one of many pleiotropic downstream consequences of receptor activation, and the term
      describes the process rather than the hormone's own activity.
    supported_by:
    - reference_id: PMID:20738325
      supporting_text: these findings show that leptin induces hypertrophy through the activation of the PPAR
- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IDA
  original_reference_id: PMID:12130569
  qualifier: involved_in
  review:
    summary: Intracellular signal transduction.
    action: MARK_AS_OVER_ANNOTATED
    reason: Leptin is an extracellular ligand; intracellular signal transduction is carried out by LEPR, JAK2, STAT3
      and other intracellular components of target cells. The cited studies show leptin-induced intracellular signalling
      (persistent hypothalamic pSTAT3), which is captured by the accepted leptin-mediated signaling pathway term.
    supported_by:
    - reference_id: PMID:12130569
      supporting_text: phosphorylated signal transducer and activator of transcription-3 remained elevated for the
        duration of the study
    - reference_id: PMID:11829746
      supporting_text: A marked and co-ordinate increase in leptin mRNA, gene transcription and promoter activity
        was observed in obese compared with lean (Fa/fa) rat adipose cells, and this resulted in increased leptin
        release in culture.
