  review:
    summary: Broad metabolic-process term.
    action: MARK_AS_OVER_ANNOTATED
    reason: Leptin regulates lipid and glucose metabolism systemically through LEPR signalling but does not catalyse
      or participate in the metabolic pathways named. Leptin acts on this process only indirectly, as an extracellular
