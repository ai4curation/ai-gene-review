- term:
    id: GO:0097696
    label: cell surface receptor signaling pathway via STAT
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P41159
  - ensembl:ENSP00000312652
  review:
    summary: Generic or receptor-side signalling term.
    action: MODIFY
    reason: Leptin is the extracellular ligand that initiates LEPR-JAK2-STAT signalling. The informative, specific
      term for this is leptin-mediated signaling pathway (GO:0033210, accepted on this gene); 'cellular response
      to leptin stimulus' describes the responding cell rather than the hormone, and the generic JAK-STAT/STAT terms
      lose the pathway identity.
    proposed_replacement_terms:
    - id: GO:0033210
      label: leptin-mediated signaling pathway
    supported_by:
    - reference_id: PMID:9618284
      supporting_text: As the result of leptin stimulation, enhanced levels of tyrosine phosphorylation of STAT3
        and MAPK were detected in CHO-OBRb cells.
    - reference_id: PMID:21250909
      supporting_text: Systemically administered PEG-MLA effectively blocks leptin signal induction of hypothalamic
        JAK-STAT signaling.
