- term:
    id: GO:0032310
    label: prostaglandin secretion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P41159
  - ensembl:ENSP00000312652
  review:
    summary: Prostaglandin secretion.
    action: MODIFY
    reason: Leptin promotes PGE2 production (via NOS2, with IL1B) but is not itself part of prostaglandin secretion;
      positive regulation of prostaglandin secretion (GO:0032308) states the claim. In rat ovary leptin instead
      reduced PGE, so the effect is tissue dependent.
    proposed_replacement_terms:
    - id: GO:0032308
      label: positive regulation of prostaglandin secretion
    supported_by:
    - reference_id: file:rat/Lep/Lep-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Plays a pro-inflammatory role, in synergy with IL1B, by inducing NOS2 which promotes the
        production of IL6, IL8 and Prostaglandin E2
