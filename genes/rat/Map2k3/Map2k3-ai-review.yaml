- term:
    id: GO:0043410
    label: positive regulation of MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027228
  review:
    summary: ARBA machine-learning assignment of positive regulation of MAPK cascade.
    action: MODIFY
    reason: >-
      MKK3 does not regulate a MAPK cascade from outside; it is the MAP2K member of the p38 cascade
      itself, phosphorylating p38 directly. The membership term GO:0038066 p38MAPK cascade (already on
      this gene) describes its role; GO:0043410 is a regulation term that conflates membership with
