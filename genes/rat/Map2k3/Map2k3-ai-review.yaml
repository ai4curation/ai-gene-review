core_functions:
- description: >-
    Dual-specificity MAP kinase kinase of the p38 stress-activated cascade: activated by MAP3Ks (such as
    ASK1) in response to ischaemia, osmotic stress, LPS and cytokines, it phosphorylates the Thr and Tyr
    of the TGY activation motif of p38 MAP kinases, selectively over JNK and ERK.
  molecular_function:
    id: GO:0004708
    label: MAP kinase kinase activity
  directly_involved_in:
  - id: GO:0038066
    label: p38MAPK cascade
  - id: GO:0031098
    label: stress-activated protein kinase signaling cascade
  supported_by:
  - reference_id: PMID:20550965
    supporting_text: No MKK activity was detected in immunoprecipitates using control antibody, or
      in assays lacking GST-MAPK or substrate (Fig. 3E).
  - reference_id: PMID:20550965
    supporting_text: Both of the known p38 activators MKK3 and MKK6 were activated by ischaemia but
      with different time courses (Fig. 3A and B).
  - reference_id: PMID:10097111
    supporting_text: The MKK3 and MKK6 protein kinases are specific for p38 MAP kinase, whereas
      the MKK4 protein kinase can activate both p38 MAP kinase and JNK.
  - reference_id: file:human/MAP2K3/MAP2K3-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Catalyzes the concomitant phosphorylation of a threonine and a tyrosine residue
      in the MAP kinase p38.
suggested_questions:
- question: Is the 87-residue N-terminal extension of the Ensembl model F7EXM7 (absent from the
    347-residue B1H230/AAI60839 form and from human MAP2K3) translated in rat tissues, or is it an
    artefact of gene-model extension?
- question: In rat heart, which p38 isoforms does MKK3 (high basal, sustained activity) activate during
    ischaemia, as opposed to the ASK1-coupled MKK6 that is activated later?
suggested_experiments:
- description: N-terminal proteomics or 5' RACE plus western blotting of rat heart and brain lysates to
    determine whether the F7EXM7 N-terminal extension is expressed.
- description: Immune-complex kinase assays of MKK3 from ischaemic Mkk3-silenced versus control rat
    cardiomyocytes, with each recombinant p38 isoform as substrate, to define MKK3's isoform preference
    in heart.
