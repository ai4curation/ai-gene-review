id: F7EXM7
gene_symbol: Map2k3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Map2k3 (MKK3, MEK3) is a dual-specificity protein kinase of the STE group that forms the MAP
  kinase kinase tier of the p38 stress-activated MAPK cascade. It is activated by environmental
  stresses (ischaemia, osmotic shock), bacterial lipopolysaccharide and proinflammatory cytokines
  through phosphorylation of its activation loop (Ser305/Thr309 in this entry, equivalent to human
  Ser218/Thr222) by MAP3Ks such as ASK1, and in turn phosphorylates the threonine and tyrosine of
  the Thr-Gly-Tyr motif of p38 MAP kinases, being selective for p38 over JNK and ERK. In rat heart
  endogenous MKK3 has high basal activity and is further and persistently activated during
  ischaemia, alongside the partially redundant MKK6. Through p38 it contributes to stress- and
  cytokine-induced gene expression, including TNF-induced inflammatory cytokine production
  (shown in mouse knockouts), LPS-induced CYP2E1 expression in astrocytes and VEGF-induced
  endothelial migration. This UniProt entry (F7EXM7) is an Ensembl model with an 87-residue
  N-terminal extension relative to the 347-residue form (B1H230) that matches human MAP2K3.
