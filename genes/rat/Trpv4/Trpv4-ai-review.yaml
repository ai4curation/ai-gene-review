suggested_questions:
- question: Is rat TRPV4 directly gated by membrane stretch, or does swelling activate it indirectly through
    aquaporin-4-mediated water flux and the actin cytoskeleton?
- question: Does the GO:0045989 (positive regulation of striated muscle contraction) annotation from rat
    diaphragmatic lymphatics (PMID:32706268) use the correct muscle-type term, given that lymphatic vessel
    wall muscle is generally smooth muscle?
- question: Do the NOT annotations for regulation of heart rate and blood pressure (PMID:23136043) hold,
    and what is the direct cardiovascular readout, given that systemic TRPV4 activation can cause circulatory
    collapse?
suggested_experiments:
- description: Patch-clamp of rat TRPV4 in excised, cytoskeleton-free membrane patches with calibrated
    pressure steps to test direct mechanical gating independent of AQP4.
- description: Cell-type-specific (endothelial vs neuronal) conditional Trpv4 knockout in rat to separate
    the lung vascular-permeability role from the CNS osmoregulatory role in vivo.
