- term:
    id: GO:0007204
    label: positive regulation of cytosolic calcium ion concentration
  evidence_type: IDA
  original_reference_id: PMID:20650893
  qualifier: involved_in
  review:
    summary: Opening TRPV4 raises cytosolic Ca2+ in rat cells (VSMC, PASMC, astrocytes).
    action: ACCEPT
    reason: 'Direct consequence of the channel activity: 4alpha-PDD raises [Ca2+]i in rat PASMC and VSMC,
      and TRPV4 knockdown abolishes the hypotonicity-evoked Ca2+ rise in rat astrocytes.'
    supported_by:
    - reference_id: PMID:22962011
      supporting_text: Activation of TRPV4 with the specific agonist 4α-phorbol-12,13-didecanoate (4α-PDD,
        5 μM) increased the intracellular calcium concentration ([Ca(2+)](i)).
    - reference_id: PMID:20650893
      supporting_text: 4-α-PDD stimulation resulted in a strong Ca2+ influx, as expected, in PBS-treated
        cells
    - reference_id: PMID:21262839
      supporting_text: showed that TRPV4 is necessary for hypotonicity-elicited [Ca 2+ ] o influx ( Fig.
        2 B – D ) and RVD ( Fig. 2 E )
