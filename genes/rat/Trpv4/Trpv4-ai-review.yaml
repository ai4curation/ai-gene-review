- term:
    id: GO:1904669
    label: ATP export
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - RGD:13967072
  review:
    summary: ATP export (pig ISO).
    action: MARK_AS_OVER_ANNOTATED
    reason: TRPV4 is a Ca2+-permeable cation channel, and TRPV4-dependent (Ca2+-triggered) ATP release from cells
      is real, so the term is not entirely wrong as a description of the process TRPV4 activity drives. It overstates
      the role, though, because the ATP is released by other pathways downstream of TRPV4 Ca2+ entry rather than
      moved by TRPV4 itself. The pig source was not inspected, hence over-annotation rather than removal.
    supported_by:
    - reference_id: file:rat/Trpv4/Trpv4-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Non-selective calcium permeant cation channel involved in osmotic sensitivity and
        mechanosensitivity
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
      source_entities:
      - source_id: RGD:13967072
        source_status: SOURCE_WEAK_OR_INFERRED
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      requested_change: CHECK
      asserted_value: GO:1904669
      confidence: SUSPECTED
      explanation: TRPV4 is a Ca2+-permeable cation channel and does not transport ATP, so GO:1904669
        (ATP export) is likely wrong for it. The rat row is an ISO transfer from pig TRPV4 (RGD:13967072);
        the annotation appears to conflate TRPV4-dependent, Ca2+-triggered ATP release with ATP transport/export
        by the channel itself. Curator should confirm whether an ATP transport term is intended for TRPV4
        or should be dropped (and check the pig source).
