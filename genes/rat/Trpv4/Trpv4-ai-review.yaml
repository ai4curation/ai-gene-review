- term:
    id: GO:0002024
    label: diet induced thermogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9EPK8
  - ensembl:ENSMUSP00000071859
  review:
    summary: 'diet induced thermogenesis: TRPV4-null / antagonist-treated mice are protected from diet-induced
      obesity and insulin resistance.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Organism-level metabolic phenotypes of TRPV4 loss arise from its adipocyte signalling role;
      they are downstream systemic consequences, not processes TRPV4 directly participates in.
    supported_by:
    - reference_id: PMID:23021218
      supporting_text: Mice with a null mutation for TRPV4 or wild-type mice treated with a TRPV4 antagonist
        showed elevated thermogenesis in adipose tissues and were protected from diet-induced obesity,
        adipose inflammation, and insulin resistance.
    - reference_id: PMID:23021218
      supporting_text: TRPV4 negatively regulated the expression of PGC1α, UCP1, and cellular respiration.
