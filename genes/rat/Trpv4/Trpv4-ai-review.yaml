- term:
    id: GO:0005034
    label: osmosensor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9EPK8
  - ensembl:ENSMUSP00000071859
  review:
    summary: 'Osmosensor: TRPV4 detects decreases in extracellular osmolarity and converts them into Ca2+
      entry.'
    action: ACCEPT
    reason: Rat VR-OAC responds to hypotonicity as small as 1% within the physiological range, and knockout
      mice show defective central osmosensing. This is the defining sensory activity of the channel.
    supported_by:
    - reference_id: PMID:11081638
      supporting_text: VR-OAC is therefore capable of detecting small osmotic-pressure changes under physiological
        conditions.
    - reference_id: PMID:11081638
      supporting_text: This novel cation-selective channel is gated by exposure to hypotonicity within
        the physiological range.
    - reference_id: PMID:14581612
      supporting_text: TRPV4 is necessary for the normal response to changes in osmotic pressure and functions
        as an osmotic sensor in the CNS
