      supporting_text: Our experiments establish that osmotic stimuli, presumably acting through membrane
        stretch, efficiently gate VR-OAC.
    - reference_id: PMID:11081638
      supporting_text: This novel cation-selective channel is gated by exposure to hypotonicity within
        the physiological range.
    - reference_id: file:rat/Trpv4/Trpv4-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Non-selective calcium permeant cation channel involved in osmotic sensitivity and
        mechanosensitivity
