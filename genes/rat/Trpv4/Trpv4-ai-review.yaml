- term:
    id: GO:0006874
    label: intracellular calcium ion homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9EPK8
  - ensembl:ENSMUSP00000071859
  - UniProtKB:Q9HBA0
  - ensembl:ENSP00000261740
  review:
    summary: TRPV4-mediated Ca2+ influx contributes to cellular Ca2+ homeostasis.
    action: KEEP_AS_NON_CORE
    reason: Ca2+ entry through TRPV4 shapes cytosolic Ca2+ (and is restrained by beta-arrestin-dependent
      internalization to avoid excessive Ca2+ signalling); homeostasis is a broad systemic outcome rather
      than the channel activity itself.
    supported_by:
    - reference_id: PMID:20650893
      supporting_text: 4-α-PDD stimulation resulted in a strong Ca2+ influx, as expected, in PBS-treated
        cells
    - reference_id: PMID:20650893
      supporting_text: angiotensin-induced ubiquitination of TRPV4 serves as a signal for its internalization
        but not its degradation
