  - UniProtKB:Q9HBA0
  - UniProtKB:Q9NQA5
  - WB:WBGene00003889
  - ZFIN:ZDB-GENE-040624-12
  review:
    summary: Rat TRPV4 is a Ca2+-permeable cation channel; Ca2+ entry through the channel is shown directly
      for the rat clone.
    action: ACCEPT
    reason: Rat VR-OAC conducts Ca2+ from the extracellular medium (no response without external Ca2+;
      Ca2+ entry necessary and sufficient), and UniProt records the Ca2+ transport reaction from this
      paper. 4alpha-PDD evokes TRPV4-dependent Ca2+ influx in rat VSMC and blockers inhibit Ca2+ influx
      through recombinant TRPV4. Because the channel is polymodal (hypotonicity, warmth, ligands), this
      general Ca2+ channel term is the appropriate core activity.
    supported_by:
    - reference_id: PMID:11081638
      supporting_text: These control experiments establish that Ca 2+ entry through VR-OACs is both necessary
        and sufficient to evoke internal Ca 2+ release
    - reference_id: PMID:11081638
      supporting_text: No change in fluorescence was apparent upon substitution of hypotonic solution
        lacking Ca 2+ ; subsequent addition of 2 mM Ca 2+ led within a few seconds to a strong increase
        of intracellular fluorescence.
    - reference_id: file:rat/Trpv4/Trpv4-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=Ca(2+)(in) = Ca(2+)(out)
    - reference_id: PMID:20650893
      supporting_text: 4-α-PDD stimulation resulted in a strong Ca2+ influx, as expected, in PBS-treated
        cells
    - reference_id: PMID:23136043
      supporting_text: inhibits Ca(2+) influx through recombinant TRPV4 channels and native endothelial
        TRPV4 currents
