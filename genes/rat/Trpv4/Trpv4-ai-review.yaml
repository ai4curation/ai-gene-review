  review:
    summary: Ca2+ entry from the extracellular space across the plasma membrane through TRPV4.
    action: ACCEPT
    reason: Most specific transport term in this set; rat TRPV4 Ca2+ signals require extracellular Ca2+
      and are evoked by hypotonicity or 4alpha-PDD.
    supported_by:
    - reference_id: PMID:11081638
      supporting_text: No change in fluorescence was apparent upon substitution of hypotonic solution
        lacking Ca 2+ ; subsequent addition of 2 mM Ca 2+ led within a few seconds to a strong increase
        of intracellular fluorescence.
    - reference_id: PMID:11081638
      supporting_text: These control experiments establish that Ca 2+ entry through VR-OACs is both necessary
        and sufficient to evoke internal Ca 2+ release
    - reference_id: PMID:20650893
      supporting_text: 4-α-PDD stimulation resulted in a strong Ca2+ influx, as expected, in PBS-treated
        cells
    - reference_id: PMID:21262839
      supporting_text: showed that TRPV4 is necessary for hypotonicity-elicited [Ca 2+ ] o influx ( Fig.
        2 B – D ) and RVD ( Fig. 2 E )
