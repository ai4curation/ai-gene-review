id: Q9ERZ8
gene_symbol: Trpv4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'TRPV4 is a Ca2+-permeable, non-selective cation channel of the TRP vanilloid subfamily that
  assembles as a homotetramer in the plasma membrane, each subunit contributing an N-terminal ankyrin-repeat
  domain, six transmembrane helices and a pore loop. It is a polymodal sensor: it is gated by cell swelling
  / hypotonicity (and the attendant membrane stretch), by warmth, by acidic pH and by phorbol-ester and
  endogenous lipid ligands, and opening admits extracellular Ca2+ (and other cations) into the cytosol,
  where the Ca2+ signal can be amplified by release from internal stores. Through this activity TRPV4
  acts as an osmosensor and mechanosensor: it is expressed in circumventricular-organ and hypothalamic
  neurons that regulate systemic osmolality and drinking, in kidney tubule and airway epithelia, in vascular
  and lymphatic endothelium and smooth muscle, in chondrocytes, keratinocytes, sensory (DRG) neurons and
  astrocytes. Its C-terminus binds the actin and microtubule cytoskeleton directly, coupling channel gating
  to cytoskeletal remodelling, and it partners with aquaporin-4 to drive regulatory volume decrease. Channel
  surface levels and signalling are tuned by interacting kinases, calmodulin and, after angiotensin-receptor
  activation, by beta-arrestin-1/AIP4-mediated ubiquitination and internalization. Physiological roles
  span osmotic and fluid-volume homeostasis, endothelial barrier/permeability and vascular tone, thermosensation,
  skeletal development, and metabolic and inflammatory signalling in adipose tissue.'
