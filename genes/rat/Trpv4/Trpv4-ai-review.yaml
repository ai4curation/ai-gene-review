- term:
    id: GO:0015275
    label: stretch-activated, monoatomic cation-selective, calcium channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9HBA0
  - ensembl:ENSP00000261740
  review:
    summary: Mechanosensitive (osmotic swelling / membrane stretch) gating of the TRPV4 Ca2+-permeable
      cation channel.
    action: ACCEPT
    reason: TRPV4 is gated by hypotonic cell swelling, presumably through membrane stretch, and conducts
      Ca2+. This descendant of calcium channel activity describes the osmo/mechanically gated mode; it
      is accepted alongside the general term because the channel is polymodal and the direct-stretch mechanism
      remains debated.
