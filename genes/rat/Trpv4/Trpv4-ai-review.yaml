- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9EPK8
  - ensembl:ENSMUSP00000071859
  review:
    summary: Negative regulation of Pol II transcription (Pgc1a/Ucp1 repression).
    action: MARK_AS_OVER_ANNOTATED
    reason: TRPV4 represses Pgc1a/Ucp1 indirectly via ERK1/2 signalling; it is not a transcriptional regulator
      acting at Pol II promoters, so a direct transcription term over-annotates the indirect effect.
    supported_by:
    - reference_id: PMID:23021218
      supporting_text: TRPV4 negatively regulated the expression of PGC1α, UCP1, and cellular respiration.
    - reference_id: PMID:23021218
      supporting_text: These data strongly suggest that the ERK1/2 protein kinases mediate much of the
        effect of TRPV4 activation on both the repression of Pgc1α expression and the induction of many
        chemokines/cytokines in adipocytes.
