- term:
    id: GO:0002031
    label: G protein-coupled receptor internalization
  evidence_type: IMP
  original_reference_id: PMID:12519791
  qualifier: involved_in
  review:
    summary: Antisense knockdown of GRK4 in cultured cerebellar Purkinje cells reduced agonist-dependent mGlu1 receptor
      internalization.
    action: ACCEPT
    reason: GRK phosphorylation of the agonist-occupied receptor is the step that recruits arrestin and initiates
      receptor internalization; Grk4 performs that step for mGlu1 (PMID:11099476, PMID:12519791). The knockdown
      is perturbation evidence, but the mechanism (receptor phosphorylation by the kinase) is direct work in the
      process, consistent with how GRKs are annotated.
    supported_by:
    - &id012
      reference_id: PMID:12519791
      supporting_text: A major involvement of GRK4 and of beta-arrestin in agonist-dependent receptor internalization
        and MAP kinase activation, respectively, was documented in cerebellar Purkinje cells using an antisense
        treatment to knock down GRK4
    - &id011
      reference_id: PMID:11099476
      supporting_text: In transfected HEK293 and in cultured Purkinje cells, the exposure to glutamate agonists
        induced internalization of the receptor and redistribution of GRK4.
