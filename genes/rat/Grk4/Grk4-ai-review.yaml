- term:
    id: GO:0050254
    label: rhodopsin kinase activity
  evidence_type: IDA
  original_reference_id: PMID:9607785
  qualifier: enables
  review:
    summary: Rat GRK4A and GRK4B phosphorylated rhodopsin in vitro.
    action: MODIFY
    proposed_replacement_terms:
    - *id013
    reason: The assay used rhodopsin as the standard surrogate GRK substrate to show the two splice variants are
      functional kinases. Rhodopsin is a photoreceptor GPCR and is not a physiological substrate of Grk4 (testis,
      kidney, brain). The assay supports the parent GO:0004703 G protein-coupled receptor kinase activity (GO:0050254
      is_a GO:0004703, checked with OAK); annotating rhodopsin kinase activity implies a retinal role not claimed.
    supported_by:
    - *id005
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0050254
      corrected_value: GO:0004703
      corrected_label: G protein-coupled receptor kinase activity
      confidence: SUSPECTED
      explanation: PMID:9607785 used rhodopsin phosphorylation only as a generic assay to show rat GRK4A/GRK4B are
        active kinases; rhodopsin is not a physiological Grk4 substrate. GO:0004703 G protein-coupled receptor kinase
        activity represents the finding without implying a phototransduction role.
      supported_by:
      - *id005
