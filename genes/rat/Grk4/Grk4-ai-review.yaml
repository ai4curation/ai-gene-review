id: P70507
gene_symbol: Grk4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Grk4 encodes G protein-coupled receptor kinase 4, a member of the GRK4 subfamily (GRK4/5/6) of AGC
  serine/threonine kinases with an N-terminal RGS-homology domain, a central kinase domain and a palmitoylated C-terminal
  region that anchors it at the cell surface. It phosphorylates agonist-occupied G protein-coupled receptors, which
  promotes arrestin binding, homologous desensitization and receptor internalization. In rat it acts on the mGlu1
  metabotropic glutamate receptor in cerebellar Purkinje cells and on renal and intestinal dopamine receptors (D1,
  D3). Two splice variants are produced: GRK4A, abundant in testis spermatocytes and spermatids, and GRK4B, enriched
  in the kidney outer medulla. Elevated renal Grk4 in spontaneously hypertensive rats increases D1 receptor serine
  phosphorylation and contributes to impaired natriuresis and hypertension.'
