- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:17659301
  qualifier: enables
  review:
    summary: KLF4 activates Pol II promoters by binding cis-elements; in rat VSMCs it activates the 
      p53 promoter and in mesangial cells the LAMC1 promoter (in synergy with Sp1).
    action: ACCEPT
    reason: Core activity with direct rat evidence (reporter assays with intact activation and 
      DNA-binding domains).
    supported_by:
    - reference_id: PMID:17659301
      supporting_text: GKLF overexpression led to an enhanced p53 promoter activity and increased 
        p53 mRNA and protein expression
    - reference_id: PMID:12034813
      supporting_text: the synergistic action of GKLF and Sp1 is dependent on the promoter context 
        and the integrity of GKLF activation and DNA-binding domain
    - reference_id: PMID:10749849
      supporting_text: GKLF activates p21(WAF1/Cip1) through a specific Sp1-like cis-element in the 
        p21(WAF1/Cip1) proximal promoter
