id: Q923V7
gene_symbol: Klf4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Klf4 (Kruppel-like factor 4, GKLF) encodes a nuclear C2H2 zinc-finger transcription 
  factor of the KLF family. Its three C-terminal zinc fingers bind GC-rich/CACCC elements in RNA 
  polymerase II promoters, and its N-terminal region mediates transcriptional activation or 
  repression in a target- and context-dependent manner, partly through the coactivator p300 and the 
  corepressor HDAC2, which acetylate and deacetylate KLF4 respectively. In rat, KLF4 activates the 
  laminin gamma1 (with Sp1), p53 and SM22alpha promoters and assembles with CREB and p53 on the 
  bradykinin B2 receptor enhancer, and it represses RARalpha and PDGFRbeta. Its best-characterised 
  role is growth inhibition of vascular smooth muscle cells via induction of p53/p21 and attenuation
  of PDGFR-PI3K/ERK signalling, limiting neointima formation. Klf4 is an immediate-early gene 
  induced by endothelin-1, oxidative stress, retinoic acid and PDGF-BB. Orthologous data from mouse 
  and human establish further roles in epidermal barrier formation, pluripotency (as a reprogramming
  factor) and endothelial anti-inflammatory gene expression.
