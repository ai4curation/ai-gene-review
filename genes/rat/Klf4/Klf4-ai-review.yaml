suggested_questions:
- question: Does the PI3K-inhibitory effect of KLF4 in rat VSMCs reported in PMID:19531492 involve 
    any direct interaction of KLF4 with PI3K subunits, or is it entirely explained by 
    transcriptional repression of RARA and PDGFRB (which would make the GO:0035014 
    molecular-function annotation unwarranted)?
- question: How do the opposing roles of KLF4 on SM22alpha (activation after ATRA in rat VSMCs 
    versus repression of SMC markers after PDGF-BB or injury in mouse) map onto specific 
    cis-elements and acetylation states, and should regulation of smooth muscle cell differentiation
    be annotated with a direction?
suggested_experiments:
- description: Co-immunoprecipitation and in vitro kinase assays with recombinant KLF4 and PI3K 
    p85/p110 in rat VSMCs, compared with RARA/PDGFRB knockdown, to test whether KLF4 regulates PI3K 
    directly or only through receptor expression.
  experiment_type: biochemical interaction assay
- description: Genome-wide ChIP-seq of KLF4 in rat aortic VSMCs under ATRA versus PDGF-BB treatment,
    with acetylation-site mutants, to define activated versus repressed direct targets.
  experiment_type: ChIP-seq
