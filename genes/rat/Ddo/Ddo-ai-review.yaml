id: D3ZDM7
gene_symbol: Ddo
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Ddo encodes D-aspartate oxidase (DDO; EC 1.4.3.1), a peroxisomal-matrix
  FAD flavoprotein that oxidatively deaminates acidic D-amino acids, converting D-aspartate
  to oxaloacetate with production of hydrogen peroxide and ammonium. It is stereospecific
  for D-aspartate and N-methyl-D-aspartate, with much weaker activity on D-glutamate,
  and is the only known mammalian enzyme that degrades D-aspartate. DDO is imported
  into peroxisomes via PEX5 and is expressed in kidney, liver and brain (mainly neurons),
  where it controls levels of D-aspartate, an endogenous NMDA-receptor agonist that
  also influences neuroendocrine and reproductive hormone signaling. The rat enzyme
  is a tetramer whose kinetic properties resemble human DDO more closely than mouse
  DDO.
