- term:
    id: GO:0006533
    label: L-aspartate catabolic process
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: Ddo is a D-aspartate oxidase that is stereospecific for acidic D-amino
      acids; the L-aspartate catabolic process transfer is contradicted by the enzyme's
      substrate specificity.
    action: REMOVE
    reason: DDO is stereospecific for D-aspartate (and other acidic D-amino acids)
      and acts on the D-enantiomer only; it does not oxidize L-aspartate, so a role in
      L-aspartate catabolism is contradicted rather than merely broad. The human donor
      (DDO, Q99489 and isoform Q99489-1) does not carry this term on its canonical
      record in QuickGO, so the source cannot be traced. Changed from MARK_AS_OVER_ANNOTATED
      to REMOVE because the claim is wrong, not just overstated.
    supported_by:
    - reference_id: PMID:29292239
      supporting_text: d-Aspartate oxidase (DDO) is a degradative enzyme that is stereospecific
        for the acidic amino acid d-aspartate
    - reference_id: UniProtKB:D3ZDM7
      supporting_text: 'FUNCTION: Selectively catalyzes the oxidative deamination of acidic amino acids'
    propagation_review:
      root_cause: SOURCE_STALE_OR_MISSING
      source_entities:
      - source_id: UniProtKB:Q99489
        source_label: human DDO
        source_status: SOURCE_STALE_OR_MISSING
        comment: The canonical human DDO record in QuickGO carries no L-aspartate catabolic
          process annotation, and isoform-level tracing (Q99489-1) did not recover
          a source; the claim also conflicts with DDO's stereospecificity for D-aspartate.
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q99489
  - UniProtKB:Q99489-1
