    label: positive regulation of inclusion body assembly
  evidence_type: IMP
  original_reference_id: PMID:18986984
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: siRNA against rat Rpt6 reduced mutant huntingtin inclusion formation in rat hippocampal neurons.
    reason: Full text read. Two siRNAs against rat Rpt6 in primary hippocampal neurons decreased inclusion formation
      without toxicity, and overexpression increased aggregation without impairing proteasomal degradation; purified
