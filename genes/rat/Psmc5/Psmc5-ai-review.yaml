  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000553037
  - SGD:S000002165
  - UniProtKB:P35998
  review:
    action: ACCEPT
    summary: ATP-driven proteasome activation (substrate unfolding, translocation and 20S gate opening), the activity
      of the base ATPase ring.
    reason: PAINT placed this at the 26S regulatory ATPase family node with yeast and human experimental seeds,
      and rat Psmc5 is the Rpt6 ortholog with an intact AAA module; its C-terminal tail inserts into an alpha-ring
      pocket in substrate-engaged 26S structures. The activity is a property of the heterohexamer, so in core_functions
      it is recorded as contributes_to, with ATP hydrolysis as the subunit's own activity.
    supported_by:
