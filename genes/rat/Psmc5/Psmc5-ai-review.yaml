id: P62198
gene_symbol: Psmc5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Psmc5 (26S proteasome regulatory subunit 8; also Rpt6, SUG1, p45, TRIP1) is one of the six AAA+ ATPases
  that form the heterohexameric base of the 19S regulatory particle of the 26S proteasome, where it sits between
  Rpt2 and Rpt3. Its Walker A/B AAA module binds and hydrolyses ATP, and together with the other base ATPases it
  unfolds ubiquitinated substrates, threads them into the 20S core particle and helps open the core gate, so it
  carries out ubiquitin-dependent protein degradation in the cytosol and nucleus. Psmc5 also occurs in free 19S
  and ATPase-only assemblies and has been reported to bind TBP, the TFIIH subunit XPB and ligand-bound nuclear receptors
  such as the thyroid hormone receptor. In neurons it is phosphorylated by CaMKIIalpha on Ser120 in an activity-dependent
  manner, it is recruited to polyglutamine inclusions in disease models, and loss-of-function variants in human
  PSMC5 cause a neurodevelopmental proteasomopathy.
