  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Negative regulation of transcription transferred from an overexpression phenotype in fibroblasts.
    reason: The mouse source (IDA, PMID:9173976) rests on the observation that overexpressing SUG1 in fibroblasts
      caused arrest of transcription and chromatin collapse. A global shutdown on overexpression of a proteasome
      ATPase is an artefact-prone gain-of-function phenotype, not evidence that Psmc5 normally represses transcription,
      and the paper's physiological finding is binding to the XPB subunit of TFIIH. Over-annotation of the overexpression
      result.
