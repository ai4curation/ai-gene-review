- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P62196
  - ensembl:ENSMUSP00000021049
  review:
    action: MODIFY
    summary: Ligand-dependent binding of SUG1 to nuclear receptors (RARalpha, TR, ER, VDR); signaling receptor binding
      is the wrong branch.
    reason: Both rows trace to mouse P62196 IPI from PMID:8598193, a yeast two-hybrid and in vitro study of mSUG1
      binding to the AF-2 domain of nuclear receptors. The partners are nuclear receptors, and GO:0016922 nuclear
      receptor binding is the accurate term; in current GO it is not a descendant of GO:0005102 (checked with OAK),
      so this is a lateral correction. The With/From partner RXRA (P28700) is contradicted by the abstract, which
      reports that RXRalpha does not interact efficiently with mSUG1; RARalpha is the main partner studied. Peripheral
      to proteasome function, so non-core.
    proposed_replacement_terms:
    - id: GO:0016922
      label: nuclear receptor binding
    supported_by:
    - reference_id: PMID:8598193
      supporting_text: we report the isolation of a novel mouse protein, mSUG1, that interacts with retinoic acid
        receptor alpha (RAR alpha) both in yeast cells and in vitro in a ligand- and AF-2 activating domain (AF-2
        AD)-dependent manner
    - &id001
      reference_id: PMID:8598193
      supporting_text: RXR alpha efficiently interacts with TIF1, but not with mSUG1
    source_defects:
    - defect_type: WRONG_WITH_FROM
      resource: UNIPROT
      record: UniProtKB:P62196
      slot: With/From
      requested_change: CHECK
      asserted_value: UniProtKB:P28700
      cause: OTHER
      confidence: PROBABLE
      explanation: Mouse Psmc5 (P62196) enables GO:0005102 (IPI, PMID:8598193) with RXRA (P28700). The abstract
        states that RXRalpha interacts efficiently with TIF1 but not with mSUG1; the receptor isolated and characterised
        as the mSUG1 partner is RARalpha (mouse P11416). The With/From should be checked against the full text and
        probably repointed to RARA; the term would also be better as GO:0016922 nuclear receptor binding.
      supported_by:
      - *id001
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:P62196
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0005102
      corrected_value: GO:0016922
      corrected_label: nuclear receptor binding
      cause: OTHER
      confidence: PROBABLE
      explanation: The partners of mSUG1 in PMID:8598193 are nuclear receptors (RARalpha, TR, ER, VDR), which are
        transcription factors rather than signalling receptors at the cell surface; GO:0016922 nuclear receptor
        binding is the precise term.
      supported_by:
      - reference_id: PMID:8598193
        supporting_text: mSUG1 also efficiently interacts with other nuclear receptors, including oestrogen (ER),
          thyroid hormone (TR), Vitamin D3 (VDR) and retinoid X (RXR) receptors.
