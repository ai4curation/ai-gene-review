      supporting_text: PSMC5 belongs to the heterohexameric ring of AAA (ATPases associated with diverse cellular
        activities) proteins that unfolds ubiquitinated target proteins that are concurrently translocated into
        a proteolytic chamber and degraded into peptides.
    - reference_id: PMID:29636472
      supporting_text: the carboxyl (C)-terminal tails of Rpt subunits, with the exception of Rpt4, were inserted
        into the corresponding α-pockets
