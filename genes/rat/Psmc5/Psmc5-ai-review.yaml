- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003959
  - InterPro:IPR003960
  review:
    action: ACCEPT
    summary: ATP binding through the AAA-domain Walker A P-loop (residues 190-197).
    reason: Psmc5 has an intact AAA+ module (InterPro IPR003959/IPR003960) with the GPPGTGKT P-loop, and recombinant
      rat SUG1 binds and hydrolyses ATP. ATP binding drives its unfoldase role, and the term is as specific as warranted.
    supported_by:
    - reference_id: file:rat/Psmc5/Psmc5-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR003959; ATPase_AAA_core.
    - reference_id: PMID:9287326
      supporting_text: The rSUG1 exhibited a Mg2+-dependent ATPase activity.
