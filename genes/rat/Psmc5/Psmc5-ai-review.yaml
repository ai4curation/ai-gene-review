- id: file:rat/Psmc5/Psmc5-deep-research-manual.md
  title: Manual literature summary for rat Psmc5
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Hand-compiled summary of cached publications for this review.
core_functions:
- description: Psmc5/Rpt6 is an AAA+ ATPase of the 19S base heterohexamer (between Rpt2 and Rpt3). It binds and
    hydrolyses ATP, and as one of six ring ATPases contributes to the hexamer's proteasome-activating activity,
    unfolding ubiquitinated substrates, translocating them into the 20S core and helping open the gate, so it directly
    carries out 26S-proteasome-mediated degradation of ubiquitinated proteins in the cytosol and nucleus. It cannot
    perform the activating activity alone.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  contributes_to_molecular_function:
    id: GO:0036402
    label: proteasome-activating activity
  directly_involved_in:
  - id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0008540
    label: proteasome regulatory particle, base subcomplex
  supported_by:
  - reference_id: PMID:9287326
    supporting_text: The rSUG1 exhibited a Mg2+-dependent ATPase activity.
  - reference_id: file:rat/Psmc5/Psmc5-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: PSMC5 belongs to the heterohexameric ring of AAA (ATPases associated with diverse cellular
      activities) proteins that unfolds ubiquitinated target proteins that are concurrently translocated into a
      proteolytic chamber and degraded into peptides.
  - reference_id: file:rat/Psmc5/Psmc5-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: a base containing 6 ATPases including PSMC5 and few additional components
  - reference_id: PMID:23495936
    supporting_text: 'The six ATPases adopt a single arrangement in normal cells: Rpt1-Rpt2-Rpt6-Rpt3-Rpt4-Rpt5'
  - reference_id: PMID:41298377
    supporting_text: Psmc5 KD by shRNA significantly increased ubiquitin-positive protein levels throughout the
      cells, particularly in the soma
suggested_questions:
- question: 'PMID:37228199 (rat synaptic free 19S): does the full text contain Psmc5-specific evidence for synaptic
    vesicle localisation and regulation of AMPA receptor activity, or were 19S-wide (deubiquitylase-dependent) results
    propagated to every 19S subunit? Would regulation of receptor trafficking be more accurate than receptor activity?'
- question: Should the human PSMC5 GO:0031531 (TRH receptor binding) IPI with THRB (PMID:7870181) be repointed to
    GO:0046966 nuclear thyroid hormone receptor binding, and should the mouse GO:0005102 IPI (PMID:8598193) With/From
    be RARA rather than RXRA?
- question: Is CaMKIIalpha phosphorylation of Rpt6 Ser120, which tethers proteasomes in dendritic spines, best captured
    on the kinase (has input Psmc5) or in a GO-CAM of activity-dependent proteasome regulation, rather than as a
    synaptic process term on Psmc5?
suggested_experiments:
- hypothesis: The synaptic AMPA receptor phenotype of free 19S particles depends on the 19S deubiquitylase, not
    on Psmc5 ATPase activity.
  description: In rat cortical neurons, replace endogenous Psmc5 with Walker-B (ATPase-dead) or Ser120A/D mutants
    and compare with DUB inhibition, measuring surface AMPA receptor levels, K63-ubiquitin deubiquitylation and
    free-19S abundance near synapses.
  experiment_type: mutant rescue with imaging and electrophysiology
