- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P62195
  - ensembl:ENSP00000310572
  review:
    action: KEEP_AS_NON_CORE
    summary: Transcriptional regulation role of SUG1/TRIP1 transferred from human PSMC5.
    reason: The human source (PMID:7870181) shows that TRIP1 substitutes for the yeast transcriptional mediator
      Sug1 and binds the thyroid-hormone receptor and activation domains. Proteasomal ATPases associate with TBP
      and TFIIH outside the 26S particle, and Sp1 turnover depends on SUG1 ATPase activity, so a role in Pol II
      transcription regulation is plausible but rests largely on binding and yeast complementation and is likely
      mediated through proteolytic or free-ATPase-complex mechanisms. Peripheral to the core proteasome function;
      kept as non-core.
    supported_by:
    - reference_id: PMID:7870181
      supporting_text: Here we show that Trip1 can functionally substitute for Sug1 in yeast, and that both proteins
        interact in vitro with the thyroid-hormone receptor, and with the transcriptional activation domains of
        yeast GAL4 and of herpes virus VP16.
    - reference_id: PMID:10526239
      supporting_text: We present evidence that TBP and at least SUG1, MSS1, and S4 form a complex in the cell.
