- id: file:rat/Spr/Spr-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: rat Spr (sepiapterin reductase,
    P18297)'
  findings:
  - statement: Falcon confirms gene identity (rat Spr / SPR, EC 1.1.1.153) and that
      SPR catalyzes the terminal reductive steps completing BH4 biosynthesis, corroborating
      sepiapterin reductase (NADP+) activity and tetrahydrobiopterin biosynthetic
      process.
    supporting_text: A central concept for functional annotation is that **SPR catalyzes
      terminal reduction steps that complete BH4 production**, and it also participates
      in a **BH4 salvage route**.
    reference_section_type: OTHER
  - statement: Falcon documents the salvage-pathway reaction (NADPH-dependent reduction
      of sepiapterin to 7,8-dihydrobiopterin), supporting sepiapterin reductase (NADP+)
      activity.
    supporting_text: In the **salvage pathway**, SPR catalyzes **NADPH-dependent reduction
      of sepiapterin to 7,8-dihydrobiopterin (BH2)**, which can then be reduced further
      to BH4 by other cellular reductases.
    reference_section_type: OTHER
  - statement: Falcon confirms strict NADPH cofactor dependence of the canonical sepiapterin
      reduction, supporting the NADP+-specific molecular function term.
    supporting_text: Canonical SPR catalysis for sepiapterin reduction is **strictly
      NADPH-dependent** in experimental assays (NADH does not support the sepiapterin→BH2
      reaction in a detailed enzymology study).
    reference_section_type: OTHER
  - statement: Falcon confirms SPR is a homodimeric SDR enzyme, corroborating protein
      homodimerization activity as contextual (non-core) support.
    supporting_text: A high-resolution (1.25 Å) crystal structure of mammalian SPR
      shows a **homodimeric SDR enzyme** in which substrate pterins and the NADP(H)
      cofactor bind from opposite sides into a deep active-site pocket.
    reference_section_type: OTHER
  - statement: Falcon reports direct experimental evidence for cytosolic localization
      of SPR activity, supporting cytosol/cytoplasm as contextual (non-core) localization.
    supporting_text: Direct experimental fractionation in lung epithelial cells detected
      SPR activity in **cytosolic fractions** (post-microsomal supernatant/cytosol),
      supporting a primarily **cytosolic** localization for SPR enzymatic activity
      in that context.
    reference_section_type: OTHER
  - statement: Falcon frames dopamine, serotonin and nitric-oxide processes as indirect
      downstream consequences of SPR controlling BH4 availability, supporting these
      as non-core context rather than the direct molecular function.
    supporting_text: By controlling BH4 availability, SPR indirectly supports the
      activity of BH4-dependent enzymes
    reference_section_type: OTHER
