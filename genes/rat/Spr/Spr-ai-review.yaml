- term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  evidence_type: IMP
  original_reference_id: PMID:12604243
  review:
    summary: positive regulation of cell population proliferation is treated as over-annotation
      because it is contextual or downstream of Spr's direct role (IMP, PMID:12604243).
    action: MARK_AS_OVER_ANNOTATED
    reason: The study measured PC12 cell number only in the presence of the toxic carbonyl
      phenylpropanedione, where SPR antisense or inhibition lowered cell number; the
      authors interpret this as SPR's SDR carbonyl-reductase activity detoxifying the
      exogenous compound. That supports a protective metabolic role under xenobiotic
      stress, not a role for Spr in regulating the proliferation machinery, so the term
      overshoots the evidence. The experimental observation itself is not disputed.
    supported_by:
    - reference_id: PMID:12604243
      supporting_text: Sepiapterin reductase (SPR) is known as an essential enzyme
        for the biosynthesis of tetrahydrobiopterin. SPR belongs to the short-chain
        dehydrogenase/reductase (SDR) family and also reduces various exogenous carbonyl
        compounds including phenylpropanedione.
      reference_section_type: ABSTRACT
    - reference_id: PMID:12604243
      supporting_text: Thus, the SDR activity of SPR in PC12 cells may serve for detoxification
        of exogenous carbonyl compounds besides functioning as a specific enzyme for
        the formation of tetrahydrobiopterin.
  qualifier: involved_in
