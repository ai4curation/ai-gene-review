id: P18297
gene_symbol: Spr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Spr encodes sepiapterin reductase (EC 1.1.1.153), a homodimeric cytoplasmic
  NADPH-dependent enzyme of the short-chain dehydrogenase/reductase (SDR) family. It
  catalyzes the final one or two reductions of de novo tetrahydrobiopterin (BH4) biosynthesis,
  converting 6-pyruvoyl-tetrahydropterin to BH4, and in the salvage route reduces sepiapterin
  to 7,8-dihydrobiopterin. By supplying BH4, the obligate cofactor of the aromatic amino
  acid hydroxylases and nitric oxide synthases, it indirectly supports catecholamine and
  serotonin synthesis, phenylalanine hydroxylation and nitric oxide production. Like
  other SDR enzymes it can also reduce some exogenous carbonyl compounds.
