- term:
    id: GO:0141151
    label: negative regulation of nitric oxide-cGMP mediated signal transduction
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:103078
  review:
    summary: Negative regulation of nitric oxide-cGMP signaling transferred from a mouse
      Spr IMP annotation (PMID:19429835). The cited study shows the opposite direction
      of effect - SPR raises endothelial BH4 and NO production - and any effect on NO
      signaling is indirect, through BH4 supply to NOS.
    action: REMOVE
    reason: The source paper (full text cached) reports that SPR overexpression increases
      endothelial BH4, NO production and NO-dependent vasorelaxation, and that SPR knockdown
      decreases BH4 and NO; it does not measure cGMP signaling or show that SPR attenuates
      it. A negative-regulation term therefore inverts the reported sign. Even a positive-regulation
      term would describe an indirect consequence of BH4 cofactor supply to nitric oxide
      synthase, which is already represented by the non-core nitric oxide biosynthetic
      process row.
    supported_by:
    - reference_id: PMID:19429835
      supporting_text: In cells transiently transfected with SPR gene, SPR activity
        (HPLC) was dramatically increased by 19-fold, corresponding to a significant
        increase in endothelial H(4)B content (HPLC) and NO(*) production (electron
        spin resonance).
    - reference_id: PMID:19429835
      supporting_text: In endothelial cells transfected with small interfering RNA
        specific for SPR, approximately 87% of mRNA were attenuated (real-time
        quantitative RT-PCR), corresponding to a significant reduction in SPR protein
        expression and activity, which was associated with decreases in both
        intracellular H(4)B content and NO(*) level.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:103078
        source_label: mouse Spr
        source_status: SOURCE_BAD
        comment: The mouse IMP (PMID:19429835) asserts negative regulation, but the
          paper shows SPR increases BH4 and NO bioavailability; the sign appears inverted
          at the source and the effect is cofactor supply rather than signal regulation.
