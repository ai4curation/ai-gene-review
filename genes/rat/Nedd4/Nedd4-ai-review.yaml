suggested_questions:
- question: Which of the many reported Nedd4-1 substrates (ENaC, IGF1R, FGFR1, GluA1, Rap2A, MTMR4) are
    physiologically ubiquitinated by Nedd4-1 rather than by its paralog Nedd4-2 in rat tissues?
- question: Is MTMR4 ubiquitinated and degraded by endogenous rat Nedd4 in denervated skeletal muscle,
    and does this contribute to atrophy?
- question: What is the experimental basis of the mouse phosphoserine/phosphothreonine residue binding
    annotations transferred to rat Nedd4 (GO:0050815, GO:0050816)?
suggested_experiments:
- description: Muscle-specific Nedd4 knockdown or knockout in rat denervation atrophy, measuring endogenous
    MTMR4 ubiquitination, MTMR4 levels and fibre cross-sectional area.
- description: Quantitative ubiquitin-remnant proteomics in Nedd4-1 versus Nedd4-2 depleted rat neurons
    to define paralog-specific synaptic substrates.
