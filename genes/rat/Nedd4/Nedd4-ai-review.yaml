core_functions:
- description: HECT-type E3 ubiquitin ligase that recognizes PY-motif substrates through its WW domains
    and transfers ubiquitin (mono- and K63-linked) to them, driving endocytosis and lysosomal degradation
    of plasma-membrane proteins such as ENaC, receptor tyrosine kinases and AMPA receptors.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0016567
    label: protein ubiquitination
  - id: GO:0031623
    label: receptor internalization
  - id: GO:0043162
    label: ubiquitin-dependent protein catabolic process via the multivesicular body sorting pathway
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:rat/Nedd4/Nedd4-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: E3 ubiquitin-protein ligase which accepts ubiquitin from an E2 ubiquitin-conjugating
      enzyme in the form of a thioester and then directly transfers the ubiquitin to targeted substrates
  - reference_id: PMID:8665844
    supporting_text: the rNedd4-WW domains mediate this association by binding to the P2 regions, which
      include the PY motifs (XPPXY)
  - reference_id: file:rat/Nedd4/Nedd4-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Monoubiquitinates IGF1R at multiple sites, thus leading to receptor internalization
      and degradation in lysosomes
  - reference_id: PMID:21148011
    supporting_text: ubiquitination of GluA1-containing AMPARs by Nedd4-1 mediates their endocytosis and
      trafficking to the lysosome
- description: In developing neurons, forms a complex with TNIK and Rap2A and mono-ubiquitinates Rap2A,
