id: Q62940
gene_symbol: Nedd4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Nedd4 (neural precursor cell expressed developmentally down-regulated 4, Nedd4-1) encodes
  a HECT-type E3 ubiquitin-protein ligase composed of an N-terminal Ca2+/lipid-binding C2 domain, three
  WW domains and a C-terminal HECT catalytic domain. The WW domains recognize proline-rich PY motifs (L/PPxY)
  in substrates, first shown for the epithelial Na+ channel (ENaC) subunits, and the HECT domain accepts
  ubiquitin from an E2 as a thioester on its catalytic cysteine and transfers it to substrate lysines,
  favouring monoubiquitination and K63-linked chains. Nedd4 is predominantly cytoplasmic and is recruited
  to the plasma membrane and endosomes, where ubiquitination of membrane proteins such as ENaC, receptor
  tyrosine kinases (IGF1R, FGFR1) and the AMPA receptor subunit GluA1 drives their endocytosis and lysosomal
  degradation. In neurons Nedd4 mono-ubiquitinates the small GTPase Rap2A in a complex with TNIK, promoting
  dendrite growth and arborization, and it controls activity-dependent internalization and lysosomal sorting
  of AMPA receptors. Nedd4 is broadly expressed (highest in lung, kidney and brain) and developmentally
  down-regulated in brain; mouse knockouts reveal requirements in heart and vascular development, neuromuscular
  junction formation and T-cell activation. Its protein level rises in denervated, atrophying skeletal
  muscle.
