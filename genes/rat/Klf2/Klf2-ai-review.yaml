id: Q9ET58
gene_symbol: Klf2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Klf2 (lung Krueppel-like factor, LKLF) is a C2H2 zinc-finger transcription factor of the Krueppel-like
  factor family. Three C-terminal zinc fingers bind CACCC/GC-rich elements in RNA polymerase II promoters, and an
  N-terminal transactivation region recruits coactivators such as CBP/p300; the protein is nuclear and is degraded
  after WWP1-mediated ubiquitination. Klf2 mainly activates transcription of its targets, for example the cytosolic
  phospholipase A2 (Pla2g4a) promoter in rat lung epithelial cells, the endothelial nitric oxide synthase gene,
  the S1pr1 gene in T cells and embryonic beta-like globin genes, and it represses some genes such as VEGFA. It
  is expressed in lung, endothelium, lymphocytes and erythroid cells. In endothelium its expression is induced by
  laminar flow and lowered by inflammatory cytokines, and it promotes a quiescent, anti-inflammatory and anti-thrombotic
  phenotype. In cardiac myocytes it is an immediate-early gene induced by endothelin-1 and H2O2. In mouse, Klf2
  is required for blood vessel stabilization (tunica media formation), primitive erythropoiesis, late lung development
  and T-cell egress from the thymus.
