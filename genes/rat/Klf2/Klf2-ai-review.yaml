- term:
    id: GO:0000902
    label: cell morphogenesis
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:1342772
  review:
    summary: Acts upstream of or within cell morphogenesis (abnormal primitive erythrocyte shape in Klf2-/- yolk
      sac).
    action: KEEP_AS_NON_CORE
    reason: Phenotype-based mouse IMP from PMID:15947087 (irregular primitive red cells); mouse vascular smooth
      muscle cells are also cuboidal in Klf2-/- aortae. Peripheral developmental consequence.
    supported_by:
    - reference_id: PMID:15947087
