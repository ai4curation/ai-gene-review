  review:
    summary: Kir5.1 contributes to inward rectifier K+ channel activity as a subunit of heteromeric Kir4.1/Kir5.1
      and Kir4.2/Kir5.1 channels (PAINT, contributes_to).
    action: ACCEPT
    reason: Kir5.1 does not form functional channels alone but co-assembles with Kir4.1 or Kir4.2 into pore-forming
      heterotetramers whose conductance, pH sensitivity and gating it shapes. The contributes_to qualifier is exactly
      right; rat Kir5.1 sits inside the Kir family clade and the selectivity filter and pore helix are conserved.
      This is the core molecular function.
    supported_by:
    - &id001
      reference_id: PMID:11306656
      supporting_text: The inwardly rectifying potassium channel Kir5.1 appears to form functional channels only
        by coexpression with either Kir4.1 or Kir4.2.
    - &id002
      reference_id: PMID:8973378
      supporting_text: Two other members of this family (Kir5.1 and Kir3.4) did not produce macroscopic currents,
        when expressed by themselves, yet both subunits modified the currents when coexpressed with other specific
        members of the Kir family.
    - &id004
