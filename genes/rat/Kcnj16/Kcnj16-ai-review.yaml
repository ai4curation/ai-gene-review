- term:
    id: GO:0006885
    label: regulation of pH
  evidence_type: IMP
  original_reference_id: PMID:30605394
  qualifier: involved_in
  review:
    summary: Kcnj16 knockout Dahl SS rats develop chronic metabolic acidosis and altered arterial pH.
    action: KEEP_AS_NON_CORE
    reason: The knockout phenotype supports a role in systemic acid-base balance, most plausibly through the renal
      basolateral K+ conductance and its effect on tubular H+/HCO3- handling. This is an organism-level downstream
      role of the channel, not its direct activity, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:30605394
      supporting_text: SS Kcnj16−/− rats hyperventilated at rest, likely compensating for a chronic metabolic acidosis.
    - reference_id: PMID:30605394
      supporting_text: We conclude that Kir5.1 is a key regulator of renal H+ handling and essential for acute and
        chronic regulation of arterial pH as determinants of the ventilatory CO2 chemoreflex.
- term:
    id: GO:0010037
    label: response to carbon dioxide
  evidence_type: IMP
  original_reference_id: PMID:30605394
  qualifier: involved_in
  review:
    summary: Kcnj16 knockout rats show a blunted ventilatory response to hypercapnic acidosis.
    action: KEEP_AS_NON_CORE
    reason: The reduced hypercapnic ventilatory response is a knockout phenotype; Kir4.1/Kir5.1 is a pH-sensitive
      K+ channel proposed to contribute to intrinsic chemosensitivity of central respiratory chemoreceptor neurons,
      which makes a role in the CO2 response plausible, but the systemic acidosis of the knockout confounds it.
      Kept as non-core physiological context.
    supported_by:
    - reference_id: PMID:30605394
      supporting_text: Despite their resting hyperventilation, SS Kcnj16−/− rats showed up to 45% reduction in the
        ventilatory response to graded hypercapnic acidosis vs. controls.
    - reference_id: PMID:30605394
      supporting_text: We previously identified genes that encode pH-sensitive ion channels in serotonin neurons
        ( 6 ), a subpopulation of central respiratory chemoreceptors with an intrinsic pH sensitivity ( 7 , 8 ).
    - *id008
