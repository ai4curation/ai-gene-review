      supporting_text: Fig. 2C shows that ratKir4.1/XtKir5.1 heteromeric channels also exhibited markedly long S1
        sublevels, but that XtKir4.1/ratKir5.1 channels behaved like rat Kir4.1/Kir5.1 channels (Fig. 2D).
    - &id008
