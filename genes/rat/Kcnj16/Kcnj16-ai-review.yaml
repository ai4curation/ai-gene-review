id: P52191
gene_symbol: Kcnj16
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Kcnj16 encodes Kir5.1, a two-transmembrane inward rectifier potassium channel subunit (M1, pore helix
  with K+ selectivity filter, M2 and a large cytoplasmic domain). Kir5.1 does not form functional channels on its
  own; it co-assembles with Kir4.1 (Kcnj10) or Kir4.2 (Kcnj15) into heterotetrameric channels with a larger (~45-55
  pS) conductance, characteristic subconductance states and a markedly increased sensitivity to intracellular acidification,
  and channel gating is regulated by PIP2. In the kidney, Kir4.1/Kir5.1 channels form the basolateral K+ conductance
  of distal tubules and collecting ducts, where they recycle K+ and set the basolateral membrane potential that
  drives Na+ reabsorption and K+ secretion. Kcnj16 knockout rats show hypokalemia, renal salt wasting with lethality
  on a high-salt diet, chronic metabolic acidosis and blunted ventilatory chemoreflexes. Kir5.1 is also expressed
  in brain (including pH-sensitive brainstem neurons), pancreas, liver and other tissues.
