- term:
    id: GO:0030833
    label: regulation of actin filament polymerization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2677850
  - PANTHER:PTN000342113
  review:
    summary: Regulation of actin filament polymerization (IBA); core cytoskeletal regulatory role.
    action: ACCEPT
    reason: Purified recombinant Simiate reduces spontaneous G-actin polymerization by 29% in cell-free
      ultracentrifugation cosedimentation assays while binding F-actin laterally without depolymerizing
      filaments, and in living cells and developing neurons (IMP) narrows filopodial F-actin FRAP turnover
      variance and stabilizes proximal dendritic branches via F-actin interaction (PMID:24782708). Retaining
      unsigned GO:0030833 rather than narrowing to negative regulation GO:0030837 captures both cell-free
      attenuation of spontaneous G-actin assembly and cellular F-actin stabilization/remodeling.
    supported_by:
    - reference_id: PMID:24782708
      supporting_text: Here, we demonstrate that Simiate, a protein previously indicated to activate transcription,
        directly associates with both, G- and F-Actin and in doing so, affects Actin polymerization and
        Actin turnover in living cells.
    - reference_id: PMID:24782708
      supporting_text: A quantification (Figure 2B) revealed that the amount of Actin polymerized after
        a period of 3 h is reduced by 29% in the presence of Simiate
    - reference_id: PMID:24782708
      supporting_text: While there is a significantly elevated number of branches present at proximal dendrites,
        distal dendrites are unaffected, hence suggesting that Simiate stabilizes existing branches via
        its interaction with F-Actin following a rearrangement toward proximal dendrites.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000342113
        source_label: PTN000342113
        source_status: SUPPORTS_TRANSFER
        comment: Bilaterian ABITRAM node supported by direct G-actin polymerization attenuation and cellular
          F-actin stabilization assays (PMID:24782708).
