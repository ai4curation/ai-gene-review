core_functions:
- description: 'JNK-specific dual-specificity MAP2K: after activation-loop phosphorylation by stress- and cytokine-responsive
    MAP3Ks (docked via its DVD site), MKK7 docks JNK1-3 through N-terminal D-sites and phosphorylates the JNK Thr-Pro-Tyr
    motif, preferentially the Thr, in the cytoplasm.'
  molecular_function: *id004
  directly_involved_in:
  - id: GO:0007254
    label: JNK cascade
  - id: GO:0051403
    label: stress-activated MAPK cascade
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - *id003
  - *id002
  - *id006
  - *id023
  - *id005
  - *id019
  - *id008
suggested_questions:
- question: Which MAP3K (MLK3, ASK1, DLK, MEKK1) is the predominant physiological activator of MKK7 in rat neurons during
    trophic-deprivation versus ischaemic apoptosis, and does each use the DVD docking site?
- question: Should the mouse UniProt IDA for MAP kinase activity (GO:0004707) on Q8CE90 be repointed to JUN kinase kinase
    activity, and should "positive regulation of JNK cascade" be retired for core cascade components such as MKK4/MKK7?
- question: Is the non-canonical DLK-MKK7-ERK1/2 cascade reported in human neurons conserved in rat neurons, and does MKK7
    phosphorylate ERK1/2 directly?
suggested_experiments:
- description: In rat cerebellar granule neurons, knock down Map2k7 (versus Map2k4) and measure JNK Thr/Tyr phosphorylation
    and apoptosis after potassium withdrawal, rescuing with D-site or DVD-site mutants to test docking requirements.
- description: In vitro kinase assays of purified rat MKK7 against JNK1-3, p38alpha and ERK2 to confirm substrate specificity
    and test the reported ERK-directed activity.
