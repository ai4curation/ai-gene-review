id: Q4KSH7
gene_symbol: Map2k7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Map2k7 encodes MKK7 (MEK7, JNKK2), a dual-specificity protein kinase of the STE MAP kinase kinase subfamily that
  is a dedicated activator of the c-Jun N-terminal kinases JNK1-3. Activated by phosphorylation on Ser271/Thr275 by upstream
  MAP3Ks (MLK3, DLK, ASK1, MEKK1), which it docks through a C-terminal DVD site, MKK7 binds JNKs through N-terminal D-site
  docking motifs and phosphorylates the JNK activation loop, preferring the Thr of the Thr-Pro-Tyr motif and cooperating with
  MKK4 (which prefers the Tyr) for full JNK activation; it does not activate p38 or, canonically, ERK. MKK7 is cytoplasmic
  and nuclear and is assembled with JNK pathway components on scaffolds such as JIP and POSH. It is required for JNK activation
  by pro-inflammatory cytokines (TNF, IL-1) and is also activated by environmental stresses such as hyperosmolarity. In rat
  neurons it is activated during trophic-deprivation and ischaemia-induced apoptosis, and MKK7-JNK signalling promotes neuronal
  and axotomy-induced motoneuron death.
