- term:
    id: GO:0004713
    label: protein tyrosine kinase activity
  evidence_type: EXP
  original_reference_id: PMID:10051439
  qualifier: enables
  review:
    summary: Protein tyrosine kinase activity, EXP from PMID:10051439 (UniProt catalytic activity, Tyr reaction).
    action: MODIFY
    reason: MKK7 is a dual-specificity MAP2K, but its tyrosine phosphotransferase activity is restricted to the JNK activation
      loop and is weak (MKK7 prefers the Thr of the Thr-Pro-Tyr motif; MKK4 prefers the Tyr). The generic protein tyrosine
      kinase term misrepresents it. In GO, MAP kinase kinase activity sits under protein serine/threonine/tyrosine kinase
      activity, not under protein tyrosine kinase activity, so this is a lateral refinement to JUN kinase kinase activity
      (GO:0008545).
    supported_by:
    - &id006
      reference_id: PMID:11390361
      supporting_text: JNK is phosphorylated preferentially on Tyr by MKK4 and on Thr by MKK7.
    - *id002
    proposed_replacement_terms:
    - *id004
