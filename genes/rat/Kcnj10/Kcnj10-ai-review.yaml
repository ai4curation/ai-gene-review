  review:
    summary: Kir4.1 co-immunoprecipitates reciprocally with the Ca2+-sensing receptor (CaR, Casr) in HEK
      cells and rat kidney extracts.
    action: KEEP_AS_NON_CORE
    reason: 'The interaction with CaR is well documented in the full text, including reciprocal co-IP
      from rat kidney, so binding to a signalling receptor is true. In this interaction Kir4.1 is the
      regulated target: CaR signalling through Galphaq and caveolin-1 lowers Kir4.1 surface expression.
      Kir4.1 is not a ligand that activates the receptor, so the term records a real but peripheral interaction,
      not a core function.'
