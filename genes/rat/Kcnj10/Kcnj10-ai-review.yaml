id: P49655
gene_symbol: Kcnj10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Kcnj10 encodes Kir4.1, a weakly inward-rectifying potassium channel subunit of the Kir family
  (two transmembrane helices flanking a K+-selective pore loop, cytoplasmic N- and C-termini). Four subunits
  form a homotetrameric channel, and Kir4.1 also co-assembles with Kir5.1 (Kcnj16) into heteromeric channels
  with larger conductance and steep sensitivity to intracellular pH. Channel opening requires PtdIns(4,5)P2
  and is inhibited by intracellular acidification and by extracellular Ba2+ and Cs+. Kir4.1 is the dominant
  K+ conductance of astrocytes, retinal Müller cells and oligodendrocytes, where it sets the very negative
  glial resting potential and mediates spatial buffering of extracellular K+ released during neuronal
  activity; it is concentrated in perivascular end-feet and perisynaptic processes, tethered with aquaporin-4
  to the dystrophin-glycoprotein complex through PDZ interactions. In the distal nephron the basolateral
  Kir4.1/Kir5.1 channel recycles K+ for the Na+/K+-ATPase and lets the distal convoluted tubule sense
  plasma K+; it is scaffolded by MAGI-1 and downregulated by the Ca2+-sensing receptor. Kir4.1 is also
  found in gastric parietal cells and the inner ear. Loss of function causes EAST/SeSAME syndrome (epilepsy,
  ataxia, sensorineural deafness, salt-wasting tubulopathy) in humans, and knockout mice show glial depolarisation,
  impaired K+ and glutamate clearance, dysmyelination, seizures and early death.
