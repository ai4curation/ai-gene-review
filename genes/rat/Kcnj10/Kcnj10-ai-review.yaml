- term:
    id: GO:0009637
    label: response to blue light
  evidence_type: IEP
  original_reference_id: PMID:18450590
  qualifier: involved_in
  review:
    summary: Blue light injury of rat retina decreases and dislocates Kir4.1 protein in Müller cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: Expression and localisation change after light damage is an injury response of the tissue.
      It does not show that Kir4.1 carries out a response to blue light; the channel is a target of the
      injury, not a participant in light sensing or response signalling.
    supported_by:
    - reference_id: PMID:18450590
      supporting_text: Blue light treatment resulted in a decrease and a dislocation of the Kir4.1 protein
        in the whole retinal tissue and a decrease in the potassium conductance of Müller cells.
