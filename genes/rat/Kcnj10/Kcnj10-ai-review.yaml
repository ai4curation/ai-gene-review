  - *id009
suggested_questions:
- question: What fraction of astrocytic Kir4.1 in each rat brain region is homomeric versus Kir4.1/Kir5.1
    heteromeric, and does the heteromer's steep pH sensitivity couple K+ buffering to activity-dependent
    acidification?
- question: Should the GO_REF:0000108 rule that infers presynapse from glutamate reuptake be suppressed
    when the glutamate reuptake annotation is acts_upstream_of_or_within on a glial channel?
- question: Does PMID:20466875 test a glucocorticoid itself, or only aldosterone acting via GR, as the
    basis of the response to glucocorticoid IEP?
suggested_experiments:
- description: Astrocyte-specific Kcnj10 versus Kcnj16 deletion in rat, with ion-selective microelectrode
    measurement of extracellular K+ clearance and astrocyte patch clamp, to separate homomeric and heteromeric
    contributions to spatial buffering.
- description: Test whether the ciliogenesis effect of Kcnj10 knockdown in renal epithelial cells depends
    on the PDZ-binding C-terminus (MAGI-1/syntrophin scaffolding) rather than on K+ conduction, using
    C-terminal truncation and pore-dead rescue constructs.
