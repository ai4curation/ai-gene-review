- term:
    id: GO:0007601
    label: visual perception
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:1194504
  review:
    summary: ISO from mouse Kcnj10 knockout retina (ERG) to visual perception.
    action: MARK_AS_OVER_ANNOTATED
    reason: In Kir4.1-/- mouse retina the slow PIII ERG component, generated by K+ fluxes through Müller
      cells, is lost, but the b-wave is spared. This shows that Kir4.1 carries the Müller cell K+ current
      that shapes field potentials and buffers retinal K+, not that the channel performs a step of visual
      perception. The supported claim is captured by the potassium transport and homeostasis terms.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:1194504
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Donor IMP (PMID:10908613, PMID:15359216) rests on ERG changes in knockout retina; it
          records a glial K+ current contribution to field potentials, not a step of visual perception.
        source_label: Kcnj10 (mouse)
    supported_by:
    - reference_id: PMID:10908613
      supporting_text: The slow PIII response of the light-evoked electroretinogram (ERG), which is generated
        by K(+) fluxes through Müller cells, was totally absent in retinas from Kir4.1 -/- mice.
    - reference_id: PMID:10908613
      supporting_text: The b-wave of the ERG, in contrast, was spared in the null mice.
