core_functions:
- description: Pore-forming subunit of a PIP2-gated, pH-sensitive inward rectifier K+ channel, as a homotetramer
    and in heteromers with Kir5.1, conducting K+ across the glial and distal-nephron plasma membrane.
  molecular_function:
    id: GO:0005242
    label: inward rectifier potassium channel activity
  directly_involved_in:
  - id: GO:1990573
    label: potassium ion import across plasma membrane
  - id: GO:0071805
    label: potassium ion transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016323
    label: basolateral plasma membrane
  in_complex:
    id: GO:0034705
    label: potassium channel complex
  supported_by:
  - *id001
  - *id012
  - *id013
  - *id005
  - *id014
- description: In astrocytes, Müller glia and oligodendrocytes, the Kir4.1 K+ conductance holds the resting
    membrane potential near EK and clears extracellular K+ released by active neurons (spatial K+ buffering)
    through perivascular end-feet and perisynaptic processes.
  molecular_function:
    id: GO:0005242
    label: inward rectifier potassium channel activity
  directly_involved_in:
  - id: GO:0060075
    label: regulation of resting membrane potential
  - id: GO:0055075
    label: potassium ion homeostasis
  locations:
