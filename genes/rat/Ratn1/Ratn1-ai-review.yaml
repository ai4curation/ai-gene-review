- term:
    id: GO:0045892
    label: negative regulation of DNA-templated transcription
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      Negative regulation of DNA-templated transcription transferred by sequence similarity
      from mouse MUP1 (UniProtKB:P11588), based on reduced hepatic gluconeogenic and lipogenic
      gene expression after MUP1 overexpression.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The donor observation is a change in liver mRNA levels after raising circulating MUP1.
      It does not show that the secreted lipocalin acts on transcription, which would require
      nuclear action by a protein that functions in plasma and urine. Transferring this to the
      rat urinary protein overstates the evidence.
    supported_by:
    - reference_id: PMID:19258313
      supporting_text: >-
        MUP1 inhibited the expression of both gluconeogenic genes and lipogenic genes in the
        liver.
  supporting_entities:
