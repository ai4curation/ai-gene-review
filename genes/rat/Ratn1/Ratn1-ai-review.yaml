- term:
    id: GO:0005009
    label: insulin receptor activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Insulin receptor activity transferred by sequence similarity from mouse MUP1
      (UniProtKB:P11588).
    action: REMOVE
    reason: >-
      A secreted lipocalin of about 19 kDa has no transmembrane or tyrosine kinase domain and
      cannot carry out insulin receptor activity. The mouse source study itself
      (PMID:19258313) found that MUP1 overexpression did not change insulin-stimulated insulin
      receptor phosphorylation, and concluded that MUP1 does not act through hepatic insulin
      sensitivity. The transferred activity is contradicted, so the row is removed (earlier
      review: MARK_AS_OVER_ANNOTATED).
    supported_by:
    - reference_id: PMID:19258313
      supporting_text: >-
        Therefore, it is unlikely that MUP1 inhibits the hepatic gluconeogenic program by
        increasing insulin sensitivity in the liver.
    - reference_id: file:rat/Ratn1/Ratn1-uniprot.txt
      supporting_text: >-
        Belongs to the calycin superfamily. Lipocalin family.
  supporting_entities:
  - UniProtKB:P11588
