- term:
    id: GO:0006112
    label: energy reserve metabolic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      Energy reserve metabolic process transferred by sequence similarity from mouse MUP1
      (UniProtKB:P11588), whose source annotation comes from systemic delivery of recombinant
      MUP1 to diabetic mice (PMID:19336396).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The mouse experiments raised circulating MUP1 by adenovirus or osmotic pump in obese or
      diabetic mice and measured downstream metabolic outcomes. Even for mouse MUP1 these are
      systemic effects of a pharmacologically raised protein, not an activity of the lipocalin
      itself. Rodent MUP genes form species-specific clusters, so the mouse donor is a family
      member rather than a demonstrated one-to-one ortholog of rat P02761, and no comparable
      metabolic role has been shown for the rat urinary protein. The transfer overstates what
      is known for this protein, whose established function is pheromone binding and
      transport.
    supported_by:
    - reference_id: PMID:19336396
      supporting_text: >-
        Chronic elevation of circulating MUP-1 in db/db mice, using an osmotic pump-based
        protein delivery system, increased energy expenditure and locomotor activity, raised
        core body temperature, and decreased glucose intolerance as well as insulin resistance.
  supporting_entities:
  - UniProtKB:P11588
