- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Cytosol, mapped from the UniProt subcellular location of the processed 15.5 kDa fatty
      acid-binding protein form.
    action: KEEP_AS_NON_CORE
    reason: >-
      UniProt places a 15.5 kDa processed form of the protein in the cytosol, probably after
      endocytic uptake from the urinary lumen in the kidney. This location reflects
      degradation and reuptake after secretion, not the site where the protein acts as a
      pheromone carrier, so it is kept as non-core. (Earlier review text attributed the
      cytosolic signal to the biosynthetic route, which is not correct for a secreted
      protein.)
    supported_by:
    - reference_id: file:rat/Ratn1/Ratn1-uniprot.txt
      supporting_text: >-
        Cytoplasm, cytosol. Note=It is probably taken up from the urinary lumen by endocytosis.
  supporting_entities:
  - UniProtKB-SubCell:SL-0091
- term:
    id: GO:0008286
    label: insulin receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      Insulin receptor signaling pathway, inferred automatically from the insulin receptor
      activity (GO:0005009) row through an inter-ontology link.
    action: REMOVE
    reason: >-
      This row only restates the transferred insulin receptor activity, which is removed: a
      secreted lipocalin cannot be an insulin receptor, and the mouse source study found no
      effect of MUP1 on insulin receptor phosphorylation. With its premise removed, the
      derived process annotation has no support (earlier review: MARK_AS_OVER_ANNOTATED).
    supported_by:
    - reference_id: PMID:19258313
      supporting_text: >-
        Therefore, it is unlikely that MUP1 inhibits the hepatic gluconeogenic program by
        increasing insulin sensitivity in the liver.
  supporting_entities:
  - GO:0005009
