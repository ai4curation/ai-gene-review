suggested_questions:
- question: What is the specific volatile pheromone/odorant carried by this MUP, and
    how does ligand identity relate to its behavioural (and kairomone) effects?
  experts: []
- question: Are the ISS-propagated metabolic roles (insulin-receptor/glucose-lipid
    regulation) genuine for any MUP, or an artifact of family-level transfer from
    one studied paralog? They are not supported for this secreted lipocalin.
  experts: []
suggested_experiments:
- hypothesis: This MUP binds and slowly releases a specific volatile pheromone in
    its lipocalin calyx.
  description: Identify endogenous ligands co-purifying with the native protein by
    GC-MS and confirm binding/release kinetics of candidate volatiles to the recombinant
    protein by fluorescent-probe displacement.
  experiment_type: ligand identification / biophysical binding assay
- hypothesis: The metabolic phenotypes attributed to MUPs are not a function of this
    secreted lipocalin.
  description: Test recombinant protein for direct insulin-receptor engagement and
    for effects on hepatocyte glucose/lipid metabolism, with appropriate paralog and
    endotoxin controls.
  experiment_type: receptor-binding / cell-based metabolic assay
