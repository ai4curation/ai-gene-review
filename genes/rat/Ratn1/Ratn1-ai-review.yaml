- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:6886376
  qualifier: located_in
  review:
    summary: >-
      Extracellular region, from detection of the Mup-1 protein in male and female rat urine
      (PMID:6886376).
    action: ACCEPT
    reason: >-
      The protein is secreted by the liver and excreted in urine, where it carries pheromones.
      Its detection in urine directly supports the extracellular location, which is where it
      functions.
    supported_by:
    - reference_id: PMID:6886376
      supporting_text: >-
        the Mup-1 gene was clearly detected on agarose gel electrophorograms of not only intact
        male but also intact female urine.
    - reference_id: file:rat/Ratn1/Ratn1-uniprot.txt
      supporting_text: >-
        SUBCELLULAR LOCATION: Secreted.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: >-
      Nucleus, transferred by sequence similarity from mouse MUP1 (UniProtKB:P11588).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The rat protein is a secreted lipocalin. UniProt records it as secreted, with a
      processed form in the cytosol, and does not list a nuclear location. No nuclear function
      is known for it, and the mouse source record (PMID:6643987) is an electrophoretic survey
      of urinary, serum and liver MUPs whose abstract does not address nuclear localization.
      Transferring a nuclear location overstates the evidence.
    supported_by:
    - reference_id: file:rat/Ratn1/Ratn1-uniprot.txt
      supporting_text: >-
        SUBCELLULAR LOCATION: Secreted.
  supporting_entities:
  - UniProtKB:P11588
