- term:
    id: GO:0016407
    label: acetyltransferase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9BUJ0
  review:
    summary: >-
      UniProt sequence-similarity transfer of acetyltransferase activity from
      human ABHD14A (Q9BUJ0), resting on in vitro CoA-enhanced p-nitrophenyl
      acetate turnover by an engineered soluble N-terminally truncated human
      ABHD14A construct (PMID:42469586).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMID:42469586 showed real in vitro turnover of synthetic short-chain
      p-nitrophenyl esters with CoA enhancement using a truncated soluble human
      construct while explicitly noting that physiological substrates remain
      undiscovered; real in vitro surrogate-substrate activity of unknown
      physiological relevance is marked as over-annotated consistently with
      mouse Abhd14a.
    supported_by:
    - reference_id: PMID:42469586
      supporting_text: >-
        Notably, ABHD14A exhibits a coenzyme A-dependent enhancement of p-nitrophenyl
        acetate hydrolysis, indicative of a ping-pong type acetyltransferase mechanism
        similar to that previously described for another homologous ABHD14 enzyme,
        ABHD14B.
    - reference_id: PMID:42469586
      supporting_text: >-
        Together, these findings establish the enzymatic
        activity, mechanistic features, and subcellular localization of ABHD14A while
        providing essential biochemical tools that can now enable the systematic
        discovery of its physiological substrates and regulatory contexts.
