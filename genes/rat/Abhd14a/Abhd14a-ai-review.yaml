      slot: DB_Object_ID
      requested_change: CHECK
      asserted_value: UniProtKB:Q5I0C4
      corrected_value: UniProtKB:Q9BUJ0
      cause: UNKNOWN
      confidence: PROBABLE
      explanation: >-
        PMID:42469586 abstract explicitly states 'Here, we provide the first
        functional characterization of the human enzyme ABHD14A' and describes
        ABHD14A-GFP overexpression in human HEK293T cells, yet UniProt entered
        GO:0000139 (Golgi membrane) as IDA on rat Q5I0C4 (and propagated ISS
        from Q5I0C4 to human Q9BUJ0 and mouse Q922Q6) while entering GO:0016407
