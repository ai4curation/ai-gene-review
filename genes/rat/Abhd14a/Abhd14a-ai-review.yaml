- id: PMID:37974539
  title: Identification of sequence determinants for the ABHD14 enzymes.
  findings:
  - statement: >-
      Sequence determinants separate membrane-anchored ABHD14A from its soluble
      lysine deacetylase paralog ABHD14B across organisms.
    supporting_text: >-
      Given 
      their high sequence similarity, automated databases often wrongly assign ABHD14A 
      and ABHD14B as the same enzyme, and therefore, annotating functions to them in 
      various organisms has been problematic.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Documents paralog-conflation risk between ABHD14A (SF1) and ABHD14B (SF2).
- id: PMID:42469586
  title: Biochemical Characterization of ABHD14A, an Outlying Member of the Metabolic
    Serine Hydrolase Family.
  findings:
  - statement: >-
      Human ABHD14A-GFP localizes to the Golgi apparatus in HEK293T cells and
      truncated soluble human ABHD14A turns over p-nitrophenyl esters with CoA
      enhancement in vitro, while native substrates remain to be discovered.
    supporting_text: >-
      Here, we provide
      the first functional characterization of the human enzyme ABHD14A.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cited by UniProt on rat Q5I0C4 for Golgi membrane (IDA) and
      acetyltransferase activity (ISS from Q9BUJ0); abstract explicitly states
      characterization of human ABHD14A, motivating a CHECK source defect on
      the rat IDA row while full text is unavailable.
