knowledge_gaps:
- gap_statement: >-
    The native physiological substrates and lumenal vs cytosolic reaction
    chemistry of rat Golgi-membrane ABHD14A are unknown.
  boundary: >-
    Rat ABHD14A retains a conserved Ser142-Asp193-His220 catalytic triad and
    type II transmembrane signal-anchor (residues 6-26), and truncated human
    ABHD14A turns over synthetic p-nitrophenyl acetate in vitro (PMID:42469586).
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: NARROWING
  significance: >-
    Required to assign a physiological molecular function without over-reading
    surrogate esterase assays or conflating ABHD14A with paralog ABHD14B.
  resolution: >-
    Identify endogenous Golgi substrates using catalytically inactive S142A
    trapping or comparative lipidomics/acylomics.
  provenance:
  - reference_id: PMID:42469586
    supporting_text: >-
      Together, these findings establish the enzymatic
      activity, mechanistic features, and subcellular localization of ABHD14A while
      providing essential biochemical tools that can now enable the systematic
      discovery of its physiological substrates and regulatory contexts.
- gap_statement: >-
    No physiological biological process has been experimentally demonstrated for
    rat Abhd14a.
  boundary: >-
    UniProt's 'Possible role in granule neuron development' is transferred by
    similarity from Zic1-dependent mRNA expression of mouse Dorz1
    (PMID:14667578).
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Distinguishes regulated transcript expression from demonstrated pathway
    participation.
  resolution: >-
    Perform genetic perturbation of rodent Abhd14a in developing cerebellar
    granule neurons and secretory tissues.
  provenance:
  - reference_id: PMID:14667578
    supporting_text: >-
      These results suggest that 
      Dorz1 expression is positively regulated by Zic1 during cerebellar development.
suggested_questions:
- question: >-
    Did Gupta, Dhaware & Kamat 2026 (PMID:42469586) assay a rat Abhd14a
    construct alongside human ABHD14A-GFP, or was UniProt's IDA on rat Q5I0C4 a
    species-accession transposition from human Q9BUJ0?
- question: >-
    What physiological ester or acyl-donor substrate is processed by rat
    ABHD14A in Golgi membranes?
suggested_experiments:
- hypothesis: >-
    Endogenous rat ABHD14A is a type II Golgi-resident enzyme with a lumenally
    oriented catalytic domain in brain and kidney.
  description: >-
    Perform subcellular fractionation, glycosidase (Endo H / PNGase F)
    sensitivity, and protease-protection assays on endogenous rat brain and
    kidney membranes.
  experiment_type: biochemical fractionation and topology assay
