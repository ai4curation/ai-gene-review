  review:
    summary: >-
      UniProt IDA annotation to Golgi membrane citing PMID:42469586 (Gupta,
      Dhaware & Kamat 2026); biologically plausible for conserved single-pass
      type II membrane ABHD14A, though the cached abstract describes
      heterologous human ABHD14A-GFP in HEK293T cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      Full text of PMID:42469586 is unavailable in cache; per review policy we
      never REMOVE an experimental IDA solely because the abstract foregrounds
      the human ortholog, and Golgi membrane localization fits rat ABHD14A's
      conserved type II signal-anchor helix (residues 6-26) and lumenal Asn38
      glycosylation site. Kept as non-core pending endogenous validation and
      flagged with a PROBABLE CHECK source defect for UniProt to verify whether
      rat Q5I0C4 was directly assayed in PMID:42469586 or should be ISS from
      human Q9BUJ0.
    supported_by:
    - reference_id: PMID:42469586
      supporting_text: >-
        Here, we found that the ABHD14A-GFP fusion protein is catalytically active and
        localizes specifically to the Golgi apparatus, suggesting a specialized role in
        the secretory pathway biology.
    - reference_id: file:rat/Abhd14a/Abhd14a-uniprot.txt
