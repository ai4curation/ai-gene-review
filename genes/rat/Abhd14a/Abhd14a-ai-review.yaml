  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Single-pass type II membrane alpha/beta-hydrolase (242 aa) containing an
  N-terminal signal-anchor transmembrane helix (residues 6-26), predicted
  lumenal N-glycosylation at Asn38, and a conserved Ser142-Asp193-His220
  catalytic triad whose endogenous substrate and physiological role remain
  uncharacterized. Orthologous to mouse Dorz1 (Abhd14a) and human ABHD14A and
  paralogous to the soluble cytosolic/nuclear lysine deacetylase ABHD14B;
  overexpressed human ABHD14A-GFP localizes to the Golgi apparatus and an
  engineered soluble human construct exhibits CoA-enhanced turnover of synthetic
  short-chain p-nitrophenyl esters in vitro, while native substrates are unknown.
