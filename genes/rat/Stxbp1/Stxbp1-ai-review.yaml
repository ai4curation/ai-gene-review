core_functions:
- description: Binds syntaxin-1 (closed conformation and N-peptide) and syntaxin-1-containing SNARE assemblies
    at the presynaptic plasma membrane, controlling syntaxin-1 availability for SNARE complex formation
    during synaptic vesicle priming.
  molecular_function:
    id: GO:0017075
    label: syntaxin-1 binding
  directly_involved_in:
  - id: GO:0016082
    label: synaptic vesicle priming
  - id: GO:0035493
    label: SNARE complex assembly
  locations:
  - id: GO:0098888
    label: extrinsic component of presynaptic membrane
  - id: GO:0098831
    label: presynaptic active zone cytoplasmic component
  supported_by:
  - reference_id: PMID:10746715
    supporting_text: Syntaxin 1a and neuronal Sec1 (nSec1) form an evolutionarily conserved heterodimer
      that is essential for vesicle trafficking and membrane fusion
  - reference_id: PMID:18337752
    supporting_text: When the syntaxin 1a N-peptide is bound to Munc18a, SNARE complex formation is blocked
  - reference_id: PMID:19255244
    supporting_text: Lentiviral rescue experiments reveal that such disruption selectively impairs synaptic
      vesicle priming but not Ca(2+)-triggered fusion of primed vesicles
  - reference_id: PMID:19255244
    supporting_text: These results suggest that Munc18-1 binding to SNARE complexes mediates synaptic
      vesicle priming and that the resulting primed state involves a Munc18-1-SNARE-complexin macromolecular
      assembly that is poised for Ca(2+) triggering of fusion
- description: Template (adaptor) that binds syntaxin-1 and VAMP2 simultaneously and accelerates trans-SNARE
    complex (SNAREpin) assembly and SNARE-mediated membrane fusion.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0035493
    label: SNARE complex assembly
  - id: GO:0031629
    label: synaptic vesicle fusion to presynaptic active zone membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:24532794
    supporting_text: the data suggest that helix 12 provides a folding template for VAMP2, accelerating
      SNAREpin assembly and membrane fusion
  - reference_id: PMID:24532794
    supporting_text: A single point mutation (L348R) within helix 12 selectively abolishes VAMP2 binding
      and the stimulatory function of Munc18-1 in membrane fusion
  - reference_id: PMID:22810233
    supporting_text: vesicle docking by synaptotagmin 1 is a prerequisite for Munc18-1 to accelerate trans-SNARE
      complex (SNAREpin) assembly and membrane fusion
  - reference_id: PMID:26876096
    supporting_text: the results indicate that a syntaxin/SNAP25:Munc18-1 complex is a likely starting
      point for SNARE assembly
- description: Required for docking and Ca2+-triggered exocytosis of neuroendocrine dense-core vesicles;
    its syntaxin N-peptide interaction raises the fusion probability of a post-docking vesicle pool.
  molecular_function:
    id: GO:0000149
    label: SNARE binding
  directly_involved_in:
  - id: GO:1990504
    label: dense core granule exocytosis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:20801887
    supporting_text: In the absence of munc18, stimulated exocytosis was not significantly different from
      basal secretion
  - reference_id: PMID:20801887
    supporting_text: Exocytosis in silenced PC-12 cells was fully rescued (to levels observed in native
      PC12 cells) by introducing a fluorescent fusion of wild type munc18
  - reference_id: PMID:20801887
    supporting_text: We conclude that the presence of munc18 molecules, engaged in regulated mode 2/3
      interaction with syntaxin, exerts a strong positive effect on a specific postdocking pool of vesicles,
      increasing the probability of fusion by a factor of 5
suggested_questions:
- question: Should the Munc18-1 template role in SNARE assembly have a dedicated MF term (SNARE complex
    assembly template/chaperone activity) rather than protein-macromolecule adaptor activity?
- question: Were the RGD rows from PMID:22810233 (vesicle membrane tethering activity, vesicle tethering
    complex, calcium activated phospholipid scrambling) intended for SNARE complex assembly or synaptic
    vesicle fusion?
- question: Does Munc18-1 contribute to platelet granule secretion independently of Munc18b/Munc18c?
suggested_experiments:
- description: Platelet-specific Stxbp1 deletion in mice, with and without Stxbp3 deletion, to test whether
    Munc18-1 contributes to platelet granule exocytosis.
- description: Single-vesicle TIRF fusion assays in Munc18-1-silenced PC12 cells rescued with the L348R
    helix-12 mutant, to test whether the VAMP2 template function is required for the high fusion-probability
    vesicle pool.
