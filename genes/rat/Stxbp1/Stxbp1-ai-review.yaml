id: P61765
gene_symbol: Stxbp1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Stxbp1 encodes Munc18-1 (nSec1, rbSec1), the neuronal Sec1/Munc18 (SM) protein of the STXBP/unc-18/SEC1
  family. It is a soluble cytosolic protein that associates peripherally with the plasma membrane by binding
  the t-SNARE syntaxin-1. Munc18-1 binds syntaxin-1 in two modes: tightly to its closed conformation,
  a binary complex that chaperones and stabilizes syntaxin-1 and blocks premature SNARE assembly, and
  through the syntaxin N-peptide to syntaxin-1/SNAP-25 acceptor complexes and assembled SNARE complexes.
  After Munc13 opens syntaxin-1, domain 3a of Munc18-1 binds VAMP2 and acts as a template that aligns
  syntaxin-1 and VAMP2 and accelerates trans-SNARE complex assembly and membrane fusion. In neurons it
  is essential for synaptic vesicle priming and neurotransmitter release; in neuroendocrine cells (PC12,
  chromaffin) it is required for docking and Ca2+-triggered exocytosis of dense-core vesicles, and its
  syntaxin N-peptide interaction raises vesicle fusion probability. It also contributes to regulated exocytosis
  in mast cells and the sperm acrosome. Other reported partners include Mint1/2, Cdk5, phospholipase D
  and Rab3A.'
