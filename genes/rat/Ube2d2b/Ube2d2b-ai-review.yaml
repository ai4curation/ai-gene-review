- term:
    id: GO:0035519
    label: protein K29-linked ubiquitination
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: protein K29-linked ubiquitination is transferred (ISO) from human UBE2D4
      (Q9Y2X8), whose only experimental support for this linkage is an E3-free in vitro
      survey of chain topology formed by purified E2s (PMID:20061386). It reflects the
      linkage promiscuity of UBE2D enzymes rather than a defined K29-chain pathway.
    action: KEEP_AS_NON_CORE
    reason: The ortholog evidence is sound as far as it goes (UBE2D4 assembles K29
      linkages in vitro), and UBE2D-family E2s make several linkage types depending
      on the partner E3, so the annotation is not wrong. But no physiological K29-linked
      ubiquitination process has been shown for UBE2D4 or rat Ube2d2b, so the term is
      contextual rather than core. Previously ACCEPT; changed for consistency with the
      other linkage terms that rest on the same E3-free survey. The earlier review named
      the donor as UBE2D2; the WITH/FROM accession Q9Y2X8 is UBE2D4.
    supported_by:
    - reference_id: UniProtKB:P70711
      supporting_text: 'FUNCTION: Catalyzes the covalent attachment of ubiquitin to
        other proteins. Mediates the selective degradation of short-lived and abnormal
        proteins.'
    - reference_id: PMID:20061386
      supporting_text: Because this study was performed in the absence of an E3 enzyme, our data indicate
        that the E2 enzymes are capable of directing the ubiquitination process to distinct subsets of
        ubiquitin lysines, depending on the specific E2 utilized.
    - reference_id: file:rat/Ube2d2b/Ube2d2b-deep-research-falcon.md
      supporting_text: UBE2D family members are widely described as **promiscuous
        E2s** that can work with many E3 ligases and can support either monoubiquitination
        or polyubiquitin chain building depending strongly on the **E3 partner and
        reaction context**, rather than having a strict intrinsic linkage specificity.
      reference_section_type: OTHER
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q9Y2X8
        source_label: human UBE2D4
        source_status: SUPPORTS_TRANSFER
        comment: Human UBE2D4 carries an IDA for this linkage from the E3-free in vitro
          E2 survey (PMID:20061386); UBE2D paralogs are near-identical, so the transfer
          is valid, but the evidence describes in vitro linkage capacity, not a pathway.
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9Y2X8
