core_functions:
- description: Ube2d2b is an E2 ubiquitin-conjugating enzyme that transfers ubiquitin
    to protein substrates in ubiquitination and ubiquitin-dependent protein catabolism.
    As a UBE2D (UbcH5) family member, it acts as a promiscuous E2 donor whose linkage
    outcome and biological specificity are conferred by its partner E3 ligases rather
    than an intrinsic substrate or linkage specificity. Among substrate pathways,
    Ube2d family enzymes promote p53 ubiquitination and proteasomal degradation, and
    their down-regulation under metal/metalloid stress leads to p53 accumulation and
    apoptosis in rat proximal tubular cells.
