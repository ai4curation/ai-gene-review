- term:
    id: GO:0070979
    label: protein K11-linked ubiquitination
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: protein K11-linked ubiquitination is marked as over-annotated for Ube2d2b;
      UBE2D-family E2s provide monoubiquitination priming in the APC/C context, whereas
      the K11 chains that define this term are assembled by dedicated chain-elongating
      E2s (UBE2C/UBE2S), so the linkage-specific claim overstates the UBE2D role (IBA,
      GO_REF:0000033).
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0070979 denotes formation of polyubiquitin chains linked through ubiquitin
      Lys11. The UBE2D family evidence indicates UBE2D contributes the initial monoubiquitination
      (priming) step in APC/C-mediated ubiquitination, while K11 chain elongation
      is carried out by other E2s (UBE2C/UBE2S). The K11-specific term therefore over-attributes
      direct K11 chain assembly to Ube2d2b; the general ubiquitination and E2 activity
      terms (GO:0016567, GO:0061631) capture its actual role.
    supported_by:
    - reference_id: UniProtKB:P70711
      supporting_text: 'FUNCTION: Catalyzes the covalent attachment of ubiquitin to
        other proteins. Mediates the selective degradation of short-lived and abnormal
        proteins.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002374325
        source_label: PANTHER:PTN002374325
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The IBD for GO:0070979 at PTN002374325 (PTHR24068, snapshot 20171201)
          is seeded by a single experimental member, human UBE2D3 (UniProtKB:P61077).
          Evidence tracing in the family review (interpro/panther/PTHR24068/PTHR24068-review.yaml)
          shows UBE2D3's only experimental K11 annotation is the E3-free in-vitro
          linkage survey of David et al. (PMID:20061386), which for a promiscuous
          UbcH5 demonstrates linkage promiscuity, not K11 dedication; physiological
          K11 chain assembly belongs to APC/C with UBE2C and the dedicated elongator
          UBE2S. The linkage-specific term over-attributes chain assembly to the node
          and hence to rat Ube2d2b; the family review grades this node/term pair WRONG_NODE.
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002374325
  - UniProtKB:P61077
