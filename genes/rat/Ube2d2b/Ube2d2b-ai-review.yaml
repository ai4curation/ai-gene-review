id: P70711
gene_symbol: Ube2d2b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Ube2d2b encodes a ubiquitin-conjugating enzyme E2 D family member that
  transfers ubiquitin in protein ubiquitination reactions and supports ubiquitin-dependent
  protein catabolism. As a promiscuous UBE2D (UbcH5) family E2, it accepts ubiquitin
  from E1 onto its catalytic cysteine and donates it to substrates in conjunction
  with numerous E3 ligases, which confer the linkage and substrate specificity of
  the reaction.
