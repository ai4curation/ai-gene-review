- id: PMID:20061386
  title: The E2 ubiquitin-conjugating enzymes direct polyubiquitination to preferred lysines.
  findings:
  - statement: Purified human E2s, including the UBE2D enzymes, were assayed for polyubiquitin
      linkage formation in vitro without an E3; this is the source of the human UBE2D4 linkage-specific
      IDA annotations that are transferred to rat Ube2d2b by ISO.
    supporting_text: Because this study was performed in the absence of an E3 enzyme, our data indicate
      that the E2 enzymes are capable of directing the ubiquitination process to distinct subsets of
      ubiquitin lysines, depending on the specific E2 utilized.
