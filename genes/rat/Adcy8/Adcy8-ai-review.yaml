      supporting_text: Membrane depolarisation-induced Ca(2+) influx caused an increase in cytosolic PKA
        activity via activating a Ca(2+)-sensitive adenylyl cyclase 8 (ADCY8) subpool.
    - &id020
      reference_id: PMID:25403481
      supporting_text: These agents also inhibited glucose-induced increase in cytosolic calcium and electrical
        activity in primary beta cells and similar effects were observed after ADCY8 knock-down.
    proposed_replacement_terms: &id019
    - id: GO:0071333
      label: cellular response to glucose stimulus
    source_defects:
    - defect_type: WRONG_TERM
      requested_change: CHECK
      asserted_value: GO:0010255
      corrected_value: GO:0071333
      corrected_label: cellular response to glucose stimulus
      confidence: PROBABLE
      resource: RGD
      explanation: RGD IDA (PMID:13680124) to GO:0010255 glucose mediated signaling pathway for rat Adcy8.
        The paper shows Ca2+/CaM- and Gs-synergised cAMP production underlying glucose/GLP-1 synergy in
        beta cells; it does not address glucose-triggered gene expression, which is what GO:0010255 defines.
        GO:0071333 cellular response to glucose stimulus (or a positive regulation of insulin secretion
        term) would fit.
      supported_by:
      - *id017
