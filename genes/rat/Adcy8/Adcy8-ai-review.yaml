suggested_questions:
- question: Should the mouse Adcy8 IMP annotations to GO:0150076 neuroinflammatory response (PMID:12441059)
    and GO:0080135 regulation of cellular response to stress (PMID:27234425) be re-termed to pain- and
    behaviour-related terms, removing the rat ISS/ISO propagations?
- question: What does PMID:14585998 show for apical and basolateral cell membrane localisation of AC8
    (polarised epithelial cells, or neuronal compartments)?
- question: Does AC8 contact the PKA RII subunit directly, or only through AKAP79/150?
suggested_experiments:
- hypothesis: Direct N-terminal Orai1 binding, not raft residence alone, determines AC8 selectivity for
    store-operated Ca2+ entry in native cells.
  description: In primary beta cells or hippocampal neurons, express AC8 mutants lacking the Orai1-binding
    N-terminal segment but retaining glycosylation/raft targeting, and measure SOCE- versus ionophore-evoked
    cAMP with AC8-tethered sensors.
  experiment_type: mutagenesis with live-cell cAMP imaging
