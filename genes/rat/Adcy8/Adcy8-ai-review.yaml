id: P40146
gene_symbol: Adcy8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Adcy8 encodes adenylyl cyclase type 8 (AC8), a 12-transmembrane, plasma membrane adenylyl
  cyclase of the class-4 nucleotide cyclase family that converts ATP to cAMP. AC8 is a dedicated Ca2+
  sensor: calmodulin pre-bound at an N-terminal 1-5-8-14 motif and Ca2+-saturated calmodulin binding a
  C-terminal IQ-like motif relieve an N/C-terminal autoinhibitory interaction, giving strong Ca2+/calmodulin
  stimulation with Gs-alpha synergy in vitro. In non-excitable cells it resides in N-glycosylation-dependent
  plasma membrane lipid rafts/caveolae and responds selectively to store-operated Ca2+ entry through direct
  association with Orai1; in excitable cells it is activated by L-type channel Ca2+ entry. AKAP79/150
  tethers PKA to AC8, which phosphorylates Ser-112 as negative feedback, and PP2A and cortical actin bind
  its N-terminus. AC8 is expressed in hippocampus and cortex, where it is enriched at presynaptic active
  zones and contributes to mossy fiber LTP, CA1 LTD and memory, and in pancreatic beta cells, where it
  couples glucose-evoked Ca2+ influx and GLP-1 signalling to cAMP/PKA-dependent amplification of insulin
  secretion.'
