      sensing). AC8's role is to generate cAMP in response to glucose-evoked Ca2+ influx and Gs-coupled
      hormones in beta cells, which fits its parent context GO:0071333 cellular response to glucose stimulus
      (GO:0010255 part_of GO:0071333).
