id: Q00238
gene_symbol: Icam1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Icam1 encodes intercellular adhesion molecule 1 (ICAM-1, CD54), a single-pass type I transmembrane
  glycoprotein of the immunoglobulin superfamily (ICAM family) with five extracellular Ig-like domains.
  It is expressed at low levels on vascular endothelium, epithelia and leukocytes and is strongly induced
  by inflammatory cytokines (IL-1, TNF, IFN-gamma) and LPS. ICAM-1 is the counter-receptor for the beta2
  integrins LFA-1 (ITGAL:ITGB2), bound by Ig domain 1, and Mac-1 (ITGAM:ITGB2), bound by Ig domain 3.
  On endothelium it mediates firm adhesion, crawling and transendothelial migration of neutrophils, monocytes,
  T cells and NK cells into inflamed tissues, and on antigen-presenting cells it stabilises the immunological
  synapse with T cells. Engagement of endothelial ICAM-1 also triggers outside-in signalling (Src-dependent
  cortactin phosphorylation, RhoA activation and actin stress fibre formation) that prepares the endothelium
  for leukocyte passage. A soluble form circulates in serum, and in the testis ICAM-1 contributes to blood-testis
  barrier function.
existing_annotations:
- term:
    id: GO:0001541
    label: ovarian follicle development
  evidence_type: IEP
  original_reference_id: PMID:20591976
  qualifier: involved_in
  review:
    summary: Icam1 mRNA rises in the periovulatory ovary after hCG, correlating with leukocyte infiltration;
      this is regulated expression, not a role in follicle development.
    action: MARK_AS_OVER_ANNOTATED
    reason: This IEP row records that Icam1 expression changes under this condition. Induced expression
      shows that Icam1 is regulated by the stimulus (largely via NF-kappaB-driven transcription), not
      that the ICAM-1 protein executes the response; expression evidence alone does not establish participation
      in the response process. Any ICAM-1 contribution in the ovary would be to leukocyte transmigration
      (already captured by leukocyte migration terms), not to follicle development itself.
    supported_by:
    - reference_id: PMID:20591976
      supporting_text: Here, we demonstrate that increased leukocyte infiltration corresponds to increased
        ICAM-1 and PECAM-1expression immediately before ovulation.
