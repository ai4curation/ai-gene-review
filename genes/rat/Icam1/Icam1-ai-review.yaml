- term:
    id: GO:0007249
    label: canonical NF-kappaB signal transduction
  evidence_type: IMP
  original_reference_id: PMID:9062344
  qualifier: involved_in
  review:
    summary: Antibodies to CD18 and ICAM-1 prevent hepatoma-induced oxidative NF-kappaB activation in
      Kupffer cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: The antibody blockade shows that CD18/ICAM-1-dependent cell-cell contact is upstream of NF-kappaB
      activation, but ICAM-1 is not a component of the canonical NF-kappaB signalling machinery; its contribution
      is the adhesive contact (and possibly outside-in signalling) that triggers it. This is an indirect
      upstream effect.
    supported_by:
    - reference_id: PMID:9062344
      supporting_text: Monoclonal antibodies directed against rat CD18 and ICAM-1, as well as TMB-8, a
        calcium inhibitor, prevented the calcium mobilization, active oxygen production, and NF-kappaB
        activation in addition to the increased production of NO.
