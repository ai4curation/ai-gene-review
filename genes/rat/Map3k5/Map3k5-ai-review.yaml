id: A0A8I6AEL0
gene_symbol: Map3k5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Map3k5 encodes rat ASK1 (apoptosis signal-regulating kinase 1), a 1381-residue serine/threonine MAP kinase kinase
  kinase of the STE kinase group. A central kinase domain is flanked by an N-terminal thioredoxin-binding region with the
  ASK-specific TRAF-binding, PH-like and DRHyd domains, and a C-terminal coiled coil that holds the kinase in an inactive
  homo-oligomer. Reduced thioredoxin keeps ASK1 silent; oxidative stress, reactive nitrogen species, ER stress (through an
  IRE1-TRAF2-ASK1 complex) and TNF signalling (through TRAF2/TRAF6) release it, leading to activation-loop autophosphorylation.
  Active ASK1 phosphorylates the MAP2Ks MKK3/MKK6 and MKK4/MKK7, driving the p38 and JNK stress-activated MAPK cascades in
  the cytoplasm, which promotes mitochondria-dependent apoptosis and other stress responses. Activity is restrained by 14-3-3
  binding, Akt phosphorylation and phosphatases such as PP5. In rat tissues ASK1 is activated during cardiac ischaemia, where
  it couples preferentially to p38 via MKK6, during hippocampal ischaemia and seizures, where it signals to MKK4-JNK, and
  by TNF in intestinal epithelial cells. It contributes to cardiomyocyte apoptosis after ischaemia/reperfusion, endothelial
  apoptosis and vascular smooth muscle proliferation after arterial injury.
