  review:
    summary: Transferred from mouse Mena localisation data (PMID:8861907). Ena/VASP proteins decorate
      stress fibers as well as focal adhesions; a genuine but peripheral location.
    action: KEEP_AS_NON_CORE
    reason: The mouse donor is an IDA from Gertler et al. 1996; rat and mouse Mena are orthologous and
      the localisation is conserved for Ena/VASP proteins. Stress-fiber association is secondary to the
      leading-edge and focal-adhesion sites where Mena's barbed-end elongation activity is exerted.
    supported_by:
