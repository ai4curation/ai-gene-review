suggested_questions:
- question: Does rat Mena contribute to the gephyrin-actin link at inhibitory synapses through its own
    barbed-end elongation activity, or mainly as an EVH1/proline-rich scaffold for gephyrin?
- question: What is the function of Mena in the acroplaxome of round spermatids, where it forms a complex
    with Tes and Arp7A but apparently without actin or profilin?
- question: GO has no specific molecular function term for processive actin filament barbed-end elongation
    (anti-capping polymerase activity); should one be created for Ena/VASP and formin-type elongators?
suggested_experiments:
- hypothesis: Mena barbed-end elongation activity is needed for gephyrin cluster formation in developing
    rat hippocampal neurons.
  description: Knock down Enah in cultured rat hippocampal neurons and rescue with wild-type Mena or EVH2
    F-actin-binding/WH2 mutants; quantify gephyrin and GABA-A receptor clusters.
  experiment_type: knockdown and rescue with imaging
- hypothesis: Mena is required for acroplaxome integrity and acrosome anchoring in spermatids.
  description: Germ-cell-specific deletion of Enah (or Enah/Vasp) in rodents with analysis of acrosome
    morphology and the subacrosomal Tes-Arp7A complex.
  experiment_type: conditional knockout
