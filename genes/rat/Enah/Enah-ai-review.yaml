core_functions:
- description: Ena/VASP actin filament elongation factor. Mena tetramers bind actin filament barbed ends,
    shield them from capping protein and processively add profilin-actin, producing long, less branched
    filaments at lamellipodial edges and filopodium tips; EVH1-mediated binding to FPPPP-motif proteins
    targets it to focal adhesions and the leading edge.
