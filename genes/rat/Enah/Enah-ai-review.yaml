  review:
    summary: ARBA machine-learning transfer of neural tube closure. Rests on mouse genetics in which
      Mena-null mice heterozygous for profilin I, or Mena/VASP double nulls, show neurulation defects.
    action: KEEP_AS_NON_CORE
    reason: The genetic requirement is real (mouse compound mutants fail neurulation), but it is a
      phenotype of losing a general actin regulator, not a step Mena performs specifically in neural tube
      closure. Kept as non-core developmental context, consistent with the ISO row for the same term.
    supported_by:
    - reference_id: PMID:10069337
      supporting_text: Mena-deficient mice that are heterozygous for a Profilin I deletion die in utero
        and display defects in neurulation
    - reference_id: PMID:15371503
      supporting_text: Mena-/-VASP-/- double mutants die perinatally and display defects in neurulation,
        craniofacial structures, and the formation of several fiber tracts in the CNS and peripheral nervous
        system.
