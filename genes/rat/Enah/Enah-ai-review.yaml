id: A0A8I6GMP8
gene_symbol: Enah
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Enah (Mena, protein enabled homolog) is a member of the Ena/VASP family of actin
  regulatory proteins. It has an N-terminal EVH1 (WH1) domain that binds FPPPP-type proline-rich
  motifs in focal adhesion and leading-edge proteins (zyxin, vinculin, lamellipodin, Fat1, Abi-1,
  Tes), a central proline-rich region that binds profilin and SH3/WW-domain proteins (IRSp53/BAIAP2,
  FE65), and a C-terminal EVH2 region with G-actin and F-actin binding motifs and a coiled-coil
  tetramerisation domain. Ena/VASP tetramers associate with actin filament barbed ends, protect them
  from capping protein and processively elongate them, producing longer, less branched filaments in
  lamellipodia and promoting filopodium formation. Mena concentrates at focal adhesions, stress
  fibers, lamellipodial edges and filopodium tips, including growth cone filopodia in neurons. Mouse
  genetics shows it is needed for forebrain commissure formation and, together with profilin I or
  VASP, for neurulation. In rat neurons it associates with gephyrin at inhibitory postsynaptic sites,
  and in rat testis it forms a complex with Tes and Arp7A in the subacrosomal layer of round
  spermatids.
