  review:
    summary: ARBA machine-learning assignment of positive regulation of MAPK cascade.
    action: MODIFY
    reason: MKK6 is the MAP2K of the p38 cascade and drives p38 activation, a role captured by GO:0038066 p38MAPK
      cascade, which the gene carries. Read as MKK6 driving p38 activation, the term is true but general, so it
      is refined to its descendant GO:1900745 positive regulation of p38MAPK cascade (checked with OAK), matching
      the treatment in the rat Map2k3 review.
    proposed_replacement_terms:
    - id: GO:1900745
      label: positive regulation of p38MAPK cascade
