core_functions:
- description: 'Dual-specificity MAP kinase kinase of the p38 stress-activated cascade: activated by MAP3Ks (ASK1,
    TAK1, TAO2) in response to ischaemia, osmotic stress and cytokines, it phosphorylates the Thr and Tyr of the
    TGY activation motif of p38 MAP kinases, selectively over JNK and ERK.'
  molecular_function:
    id: GO:0004708
    label: MAP kinase kinase activity
  directly_involved_in:
  - id: GO:0038066
    label: p38MAPK cascade
  - id: GO:0051403
    label: stress-activated MAPK cascade
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:20550965
    supporting_text: 1 μg GST-p38 and 4 μg GST-ATF2 for MKK3 and MKK6
  - reference_id: PMID:20550965
    supporting_text: No MKK activity was detected in immunoprecipitates using control antibody, or in assays lacking
      GST-MAPK or substrate
  - reference_id: PMID:20550965
    supporting_text: activation of ASK1 leads to preferential activation of MKK6 and consequent activation of p38
  - reference_id: PMID:10097111
    supporting_text: The MKK3 and MKK6 protein kinases are specific for p38 MAP kinase, whereas the MKK4 protein
      kinase can activate both p38 MAP kinase and JNK.
  - reference_id: file:human/MAP2K6/MAP2K6-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: catalyzes the concomitant phosphorylation of a threonine and a tyrosine residue in the MAP
      kinases p38 MAPK11, MAPK12, MAPK13
  - reference_id: PMID:9768359
    supporting_text: The p38 activators MKK3 and MKK6 were present in both the nucleus and the cytoplasm, consistent
      with a role in activating p38 in the nucleus.
suggested_questions:
- question: During cardiac ischaemia in rat, which p38 isoforms does the late, ASK1-coupled MKK6 activate, as distinct
    from the early, high-basal MKK3?
- question: The automatic TrEMBL name for A0ABK0M3C5 ("Serine/threonine-protein", EC 2.7.11.1 from a PROSITE rule)
    is truncated and generic; should the entry carry the dual specificity MAPKK 6 name and EC 2.7.12.2 used for
    the human ortholog?
suggested_experiments:
- description: Immune-complex kinase assays of MKK6 from ischaemic rat cardiomyocytes after Map2k6 knockdown, with
    each recombinant p38 isoform as substrate, to define MKK6 isoform preference and its contribution to late-ischaemic
    p38 activation.
