- term:
    id: GO:0072709
    label: cellular response to sorbitol
  evidence_type: IEP
  original_reference_id: PMID:20550965
  qualifier: involved_in
  review:
    summary: Hyperosmolar sorbitol, used as a positive control, robustly activated MKK6 and the other MKKs in perfused
      rat hearts.
    action: KEEP_AS_NON_CORE
    reason: Full text read. Sorbitol is an osmotic stress used to activate all MKKs; activation of MKK6 by it is
      a stress-response context of the core function, appropriately captured by IEP and kept as non-core.
    supported_by:
    - reference_id: PMID:20550965
      supporting_text: In control experiments in which hearts were perfused with sorbitol, we saw robust activation
        of all MKK isoforms assayed showing that all of the MKKs were present and could be activated by osmotic
        shock
