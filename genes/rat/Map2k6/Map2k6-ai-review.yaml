id: A0ABK0M3C5
gene_symbol: Map2k6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Map2k6 (MKK6, MEK6) is a dual-specificity protein kinase of the STE group that forms the MAP kinase
  kinase tier of the p38 stress-activated MAPK cascade. It is activated by phosphorylation of its activation loop
  (Ser208/Thr212 in this entry, equivalent to human Ser207/Thr211) by MAP3Ks such as ASK1, TAK1 and TAO2, which
  it binds through a C-terminal docking domain, and it docks onto p38 MAP kinases and phosphorylates the threonine
  and tyrosine of their Thr-Gly-Tyr activation motif, selectively over JNK and ERK. Unphosphorylated MKK6 forms
  an autoinhibitory homodimer. It is present in both cytoplasm and nucleus. In rat heart endogenous MKK6 is activated
  by osmotic shock and, later than MKK3, during ischaemia, when it is preferentially coupled to ASK1. Through p38
  it mediates stress- and cytokine-induced responses, including interleukin-1beta-induced COX-2 expression and prostaglandin
  E2 release in cardiomyocytes and TGF-beta1-induced apoptosis in hepatoma cells; mouse genetics implicate it, with
  MKK3, in osteoblast differentiation and bone mass, and in restraining white adipose tissue browning.
