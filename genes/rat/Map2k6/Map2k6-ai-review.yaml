    label: p38MAPK cascade
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P52564
  review:
    summary: RGD transfer from human MAP2K6 (IDA, PMID:11460167).
    action: ACCEPT
    reason: Core process. MKK6 directly phosphorylates and activates p38, so it performs a step of the cascade;
      rat MKK6 activity toward p38 is shown in heart, where ASK1 couples to p38 primarily via MKK6 (PMID:20550965).
    supported_by:
    - reference_id: PMID:8622669
      supporting_text: Expression of activated MKK3 and MKK6 in cultured cells caused a selective increase in p38
        MAP kinase activity
    - reference_id: PMID:20550965
      supporting_text: activation of ASK1 leads to preferential activation of MKK6 and consequent activation of
        p38
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: enables
  supporting_entities:
  - UniProtKB:P52564
  - UniProtKB:P52564-1
  review:
    summary: RGD transfer from human MAP2K6 self-interaction (IPI, PMID:19141286; IntAct).
    action: MODIFY
    reason: The self-interaction is a specific homodimer of unphosphorylated MKK6 with a proposed autoinhibitory
      role (crystal structure, gel filtration, SAXS), better described by GO:0042803 protein homodimerization activity,
      an is_a descendant (checked with OAK), as in the human MAP2K6 review. It is a regulatory feature, not the
      core catalytic function.
    proposed_replacement_terms:
    - id: GO:0042803
      label: protein homodimerization activity
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:P52564
        source_status: SUPPORTS_TRANSFER
        comment: Human MEK6 dimer is structurally defined; the rat kinase domain is nearly identical, so the homodimer
          transfers.
    supported_by:
    - reference_id: PMID:19141286
      supporting_text: The dimer may also serve the function in unphosphorylated MEK6 of preventing activation loop
        phosphorylation by inappropriate kinases.
- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:12029621
  qualifier: involved_in
  review:
    summary: 'Park et al.: dominant-negative MKK6 suppressed mitochondrial cytochrome c release and TGF-beta1-induced
      apoptosis in FaO rat hepatoma cells (abstract only).'
    action: KEEP_AS_NON_CORE
    reason: Rat cell-line experimental evidence, curated from the full text. MKK6-p38 signalling promotes TGF-beta1-induced
      apoptosis in this context; a context-dependent downstream outcome rather than a core function, kept as non-core.
    supported_by:
    - reference_id: PMID:12029621
      supporting_text: both interfering with p38 activity by overexpression of the dominant negative (DN) MKK6 mutant
        and inhibition of the JNK pathway by overexpression of the DN SEK1 mutant resulted in suppression of mitochondrial
        cytochrome c release, abrogating TGF-beta1-induced apoptosis
- term:
