      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: ARBA:ARBA00027228
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Machine-learned rule; the generic MAPK-cascade term is true but less specific than the evidence
          supports.
    supported_by:
    - reference_id: PMID:8622669
      supporting_text: Expression of activated MKK3 and MKK6 in cultured cells caused a selective increase in p38
        MAP kinase activity
