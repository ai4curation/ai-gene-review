- term:
    id: GO:0009410
    label: response to xenobiotic stimulus
  evidence_type: IEP
  original_reference_id: PMID:16755153
  qualifier: involved_in
  review:
    summary: Umemoto et al. reported higher MKK6 protein levels in aortas of stroke-prone hypertensive rats, reduced
      by amlodipine or enalapril treatment (abstract only).
    action: MARK_AS_OVER_ANNOTATED
    reason: The observation is a change in MKK6 protein level in the aorta of drug-treated hypertensive rats, which
      may reflect the lowered blood pressure and remodelling rather than a response of MKK6 to the drugs. The paper
      attributes the drug effect to the MEK-ERK pathway, not to MKK6. A level change does not show that MKK6 takes
      part in a response to xenobiotic stimulus; the full text was not available, so the row is marked rather than
      removed.
    supported_by:
    - reference_id: PMID:16755153
      supporting_text: The levels of MKK6, p38 MAPK, MEK1 and p-42/44 ERK were significantly higher in the vehicle-treated
        SHRSP than in the WKY.
    - reference_id: PMID:16755153
      supporting_text: Thus, the MEK-ERK pathway might be one of the crucial determinants of the aortic SMC phenotype
        activated by amlodipine treatment of hypertension in vivo.
    - reference_id: file:rat/Map2k6/Map2k6-deep-research-manual.md
      supporting_text: (correlative; the paper's conclusions concern MEK-ERK)
