- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IDA
  original_reference_id: PMID:9183013
  review:
    summary: IDA annotation from Bruce and Churchich (1997). The paper showed that
      Hip binds specifically to reduced, carboxymethylated alpha-lactalbumin (a non-native
      protein) but not the native form. However, Hip was unable to facilitate refolding
      and actually inhibited it. GO:0051082 is now formally obsolete. Hip functions
      as a co-chaperone rather than as an independent chaperone that productively
      handles unfolded substrates.
    action: MODIFY
    reason: GO:0051082 (unfolded protein binding) is now formally obsolete. While
      Bruce and Churchich (PMID:9183013) did show binding to denatured protein, Hip
      functions as a co-chaperone that stabilizes the Hsc70-substrate complex rather
      than as an independent unfolded protein handler. The appropriate replacement
      is GO:0044183 (protein folding chaperone), which captures the co-chaperone role
      in the protein folding machinery. GOA no longer carries this row; the same
      paper is now annotated to GO:0044183 (protein folding chaperone) by IDA.
    proposed_replacement_terms:
    - id: GO:0044183
      label: protein folding chaperone
    supported_by:
    - reference_id: PMID:9183013
      supporting_text: The role of Hip as a molecular chaperone has been confirmed
        by its ability to strongly bind to the reduced, carboxymethylated form of
        alpha-lactalbumin. This interaction is specific for non-native domains since
        native alpha-lactalbumin fails to interact with Hip.
  retired: true
