    label: negative regulation of protein refolding
  evidence_type: IDA
  original_reference_id: PMID:9183013
  review:
    summary: IDA annotation from Bruce and Churchich (1997). The paper showed that
      Hip inhibited the refolding of alkaline phosphatase and malate dehydrogenase
      at near stoichiometric levels, and this inhibition could not be reversed by
      ATP addition. This is an in vitro observation with purified Hip alone; in the
      context of the Hsc70 system, Hip actually promotes protein folding by stabilizing
      the Hsc70-substrate complex.
    action: ACCEPT
    reason: The experimental evidence clearly shows Hip inhibits protein refolding
      in vitro when acting alone (without Hsc70). This is a direct assay result that
      is correctly annotated. The annotation captures the intrinsic holdase-like activity
      of Hip, distinct from its positive role in the Hsc70 chaperone cycle.
