    label: protein folding chaperone
  evidence_type: IDA
  original_reference_id: PMID:9183013
  qualifier: enables
  review:
    summary: New GOA row from Bruce and Churchich (1997), replacing the retired GO:0051082
      (unfolded protein binding) IDA row from the same paper. Recombinant Hip bound
      reduced, carboxymethylated alpha-lactalbumin but not the native protein (Kd
      about 5 microM), which the authors take as confirming its role as a molecular
      chaperone; alone it could not refold denatured substrates.
    action: ACCEPT
    reason: This is the replacement that the earlier review proposed when GO:0051082
      was obsoleted (the obsoletion note points to protein folding chaperone or unfolded
      protein holdase activity). Selective binding of a non-native protein is direct
      evidence of chaperone-type client binding, and in vivo Hip acts within the Hsc70
      folding machinery. GO:0140309 (unfolded protein holdase activity) would also
      fit the isolated, refolding-inhibiting behaviour, but the curator's choice is
      consistent with the paper and is accepted. Hsp70 binding (GO:0030544) remains
      the primary core activity.
    supported_by:
    - reference_id: PMID:9183013
      supporting_text: The role of Hip as a molecular chaperone has been confirmed
        by its ability to strongly bind to the reduced, carboxymethylated form of
        alpha-lactalbumin. This interaction is specific for non-native domains since
        native alpha-lactalbumin fails to interact with Hip.
    - reference_id: PMID:7585962
      supporting_text: Through its own chaperone activity, Hip may contribute to the
        interaction of Hsc70 with various target proteins.
core_functions:
- description: Hip/St13 functions as a co-chaperone that stabilizes the ADP-bound
    state of Hsc70, promoting substrate retention and enhancing the productive protein
    folding cycle. It binds the ATPase domain of Hsc70 via its TPR domain, attenuating
    the Hsp70 ATPase cycle and competing with nucleotide exchange factors.
  molecular_function:
