  findings:
  - statement: Hip/ST13 is a co-chaperone that acts via protein-protein interaction
      and does not catalyze a chemical reaction, supporting a non-catalytic, Hsp70-binding
      core molecular function.
    supporting_text: ST13/Hip is a **cytosolic Hsp70/Hsc70 co-chaperone** that promotes
      productive protein folding by stabilizing chaperone-client complexes; it is
      not an enzyme or transporter and does not catalyze a chemical reaction.
    reference_section_type: OTHER
  - statement: Hip binds the Hsp70 nucleotide-binding domain preferentially in the
      ADP-bound state, stabilizing the high substrate-affinity conformation and delaying
      client release.
    supporting_text: Hip preferentially binds **ADP-bound Hsp70** (reported **KD ≈
      8 µM**) and binds more weakly to apo Hsp70 (**KD ≈ 51 µM**), with no detectable
      binding to ATP-bound Hsp70 under the conditions described; this explains why
      Hip acts as an **ADP-state stabilizer**.
    reference_section_type: OTHER
  - statement: Hip binds the Hsp70 NBD through a central TPR domain, consistent with
      the domain-specific binding annotations.
    supporting_text: A **central TPR domain** that mediates Hsp70 NBD binding
    reference_section_type: OTHER
  - statement: Rat Hip TPR region forms a structural bracket over the Hsp70 NBD, locking
      it in the ADP state and delaying substrate release.
    supporting_text: A rat Hip TPR-containing region forms a **structural “bracket”
      over the Hsp70 NBD**, obstructing NBD dynamics and thereby **locking Hsp70 in
      an ADP-bound state and delaying substrate release**.
    reference_section_type: OTHER
  - statement: Hip stabilizes the ADP-bound conformation, increasing Hsp70 dwell time
      on substrates and supporting folding, counterbalancing nucleotide exchange factors.
    supporting_text: stabilizing the ADP-bound conformation, Hip effectively increases
      the dwell time of Hsp70 on substrates, supporting folding/holding functions
      and counterbalancing NEF-driven acceleration of nucleotide exchange
    reference_section_type: OTHER
  - statement: Hip and nucleotide exchange factors bind Hsp70 mutually exclusively;
      Hip competes with BAG1 and other NEFs.
    supporting_text: Hip binding and NEF binding are **mutually exclusive**
    reference_section_type: OTHER
  - statement: Hip/ST13 is a cytosolic co-chaperone acting in the cytosolic Hsp70
      cycle.
    supporting_text: Hip/ST13 is described as a **cytosolic** co-chaperone in reviews
      and mechanistic summaries, consistent with its role in the cytosolic Hsp70 cycle
    reference_section_type: OTHER
  - statement: Hip has an N-terminal dimerization region involved in homo-oligomerization
      and forms a dimer in solution.
    supporting_text: An **N-terminal dimerization region** involved in homo-oligomerization
    reference_section_type: OTHER
