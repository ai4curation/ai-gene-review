gene_symbol: St13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Hsc70-interacting protein (Hip/ST13) is a TPR-containing co-chaperone
  that regulates the Hsp70 chaperone cycle. Hip self-associates through an N-terminal
  dimerization domain (reported as a tetramer by size-exclusion chromatography and
  as a dimer in structural studies) and
  binds the ATPase domain of Hsc70, stabilizing the ADP-bound state which has high
  affinity for substrate proteins (PMID:7585962). By slowing ADP dissociation from
  Hsc70, Hip attenuates active cycling and enhances aggregation prevention (PMID:23812373).
  Hip possesses its own chaperone activity, binding non-native proteins but unable
  to facilitate their refolding independently (PMID:9183013). Hip competes with BAG-1
  (a nucleotide exchange factor) for binding to the Hsc70 ATPase domain (PMID:9528774).
