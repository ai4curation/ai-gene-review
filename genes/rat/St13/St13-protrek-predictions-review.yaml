  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Rank 2 (score 13.60). Hip has its own chaperone activity toward non-native proteins, which it
      binds but cannot refold (PMID:9183013); GOA records this as unfolded protein binding (GO:0051082,
      IDA). Denatured protein binding is the sibling term for once-folded, aggregation-prone clients.
      Correct in substance, and covered by the existing annotation rather than adding to it.
