  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 3 (score 13.52) and absent from GOA, which stops at the generic protein-containing complex
      (IDA). Hip is a bona fide component of the Hsc70 chaperone machine, binding the ATPase domains
      of at least two HSC70 molecules per oligomer, so protein folding chaperone complex is both correct
      and a genuine refinement of what is currently annotated. The one novel call in the rat set that
      a curator could act on directly.
    supported_by:
