description: >-
  ProTrek sequence-to-text retrieval for rat St13 (Hip, Hsc70-interacting protein). The best-ordered
  result in the rat set: rank 1 is the sole curated core molecular function with a 2.0-unit gap to
  rank 2, the largest top-1/top-2 margin among the eight rat genes, and all three reviewed calls are
  defensible. Absolute scores are low (15.59 down to 12.78 across the five) - Hip is a small non-catalytic
  co-chaperone with no enzymology to latch onto - which is a reminder that raw score is comparable
  across ranks for one protein but not across proteins. Rank 4 (bent DNA binding) shows the drift
  starting immediately below. The free-text channel returns Hip's own UniProt comment verbatim at
  19.54. Assessment: 2 correct-not-novel, 1 correct novel. Assessment: 1 correct novel (COR), 2 correct
  not novel (CNN).
