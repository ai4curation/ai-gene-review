id: P17945
gene_symbol: Hgf
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Hgf encodes hepatocyte growth factor (scatter factor), a secreted plasminogen-related growth
  factor made mainly by mesenchymal and stromal cells. It is synthesised as a 728-residue pre-pro single-chain
  precursor that is activated by proteolytic cleavage (by HGFAC or TMPRSS13) into a disulfide-linked heterodimer:
  an alpha chain with an N-terminal PAN domain and four kringle domains, and a beta chain with a serine-protease-like
  domain that lacks catalytic activity. Mature HGF binds and activates the MET receptor tyrosine kinase
  on epithelial, endothelial, muscle precursor and neural cells, triggering MAPK and PI3K/AKT signalling
  that drives proliferation, survival, motility (scattering) and branching morphogenesis. It is a major
  hepatocyte mitogen in liver regeneration, activates skeletal muscle satellite cells when released from
  the extracellular matrix, and is essential for embryonic liver and placenta development.'
