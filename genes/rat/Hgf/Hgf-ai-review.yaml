core_functions:
- description: Secreted growth factor that binds and activates the MET receptor tyrosine kinase, acting
    as a mitogen, motogen and survival factor for MET-expressing target cells (hepatocytes, epithelial
    cells, muscle satellite cells).
  molecular_function:
    id: GO:0008083
    label: growth factor activity
  directly_involved_in:
  - id: GO:0048012
    label: hepatocyte growth factor receptor signaling pathway
  locations:
  - id: GO:0005615
    label: extracellular space
  supported_by:
  - reference_id: PMID:1846706
    supporting_text: Covalent cross-linking of 125I-labeled ligand to cellular proteins of appropriate
      size that were recognized by antibodies to c-met directly established the c-met product as the cell-surface
      receptor for HGF
  - reference_id: PMID:1826679
    supporting_text: A hepatocyte growth factor (HGF)-like substance that strongly stimulated DNA synthesis
      of adult rat hepatocytes in primary culture
  - reference_id: file:rat/Hgf/Hgf-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Activating ligand for the receptor tyrosine kinase MET by binding to it and promoting
      its dimerization
  - reference_id: PMID:19638569
    supporting_text: These effects were also accompanied for a long-lasting increase of serum and liver
      levels of HGF
suggested_questions:
- question: Should the rat ISO row for 'cellular response to hepatocyte growth factor stimulus' (from
    human HGF) be retracted at source, given that the ligand is the stimulus and the responding entity
    is the MET-expressing cell?
- question: What evidence in the full text of PMID:1826679 underlies the 'protein-containing complex binding'
    IDA, and is a more informative term (e.g. receptor tyrosine kinase binding or heparin binding) intended?
- question: Does the full text of PMID:17549731 contain direct evidence of enhanced remyelination by HGF,
    as opposed to oligodendrocyte survival?
suggested_experiments:
- description: Test direct binding of recombinant rat pro-HGF and two-chain HGF to rat MET ectodomain
    and to heparan sulfate (SPR or BLI) to quantify ligand affinity and the contribution of the PAN/kringle
    domains.
- description: Hepatocyte- or satellite-cell co-culture with anti-HGF or MET inhibitor to distinguish
    HGF-dependent proliferation from survival outputs in rat cells.
