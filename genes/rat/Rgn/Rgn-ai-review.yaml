- id: file:rat/Rgn/Rgn-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report on rat Rgn (regucalcin /
    SMP-30 / gluconolactonase, UniProt Q03336)
  findings:
  - statement: 'The core biochemical function of rat Rgn is a metal-dependent gluconolactonase

      (EC 3.1.1.17) with a six-bladed beta-propeller fold whose central cavity

      coordinates a divalent metal at the active site (Glu18, Asn154, Asp204, with

      Asn103 important for catalysis).

      '
    reference_section_type: OTHER
    supporting_text: 1. **Primary biochemical function:** Rat Rgn encodes regucalcin/SMP30,
      a **metal-dependent gluconolactonase/lactonase (EC 3.1.1.17)** with a **six-bladed
      β‑propeller** active site coordinating a divalent metal (Glu18/Asn154/Asp204;
      Asn103 important for catalysis).
  - statement: 'In non-primate mammals SMP30/GNL supports ascorbic acid (vitamin C)
      biosynthesis

      by forming the gamma-lactone ring from L-gulonate, and SMP30/GNL knockout mice

      develop scurvy on vitamin C-deficient diets.

      '
    reference_section_type: OTHER
    supporting_text: '**Ascorbate/vitamin C pathway role (in non‑primates):** SMP30/GNL
      is implicated in the ascorbic acid biosynthesis pathway by catalyzing formation
      of the **γ‑lactone ring** from **L‑gulonate** (i.e., producing **L‑gulono‑γ‑lactone**,
      which is then converted to ascorbic acid by downstream enzymes). Genetic/physiological
      support includes **SMP30/GNL knockout mice** developing **scurvy** on vitamin
      C‑deficient diets.'
  - statement: 'The enzyme requires a divalent metal ion (Zn2+ and Mn2+ cited as activators)

      and hydrolyzes multiple aldonolactones in vitro, including D/L-glucono-,

      gulono-, and galactono-lactones.

      '
    reference_section_type: OTHER
