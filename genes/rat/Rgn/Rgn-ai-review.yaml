- term:
    id: GO:0030234
    label: enzyme regulator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: Enzyme regulator activity from the InterPro regucalcin family mapping. Regucalcin
      has been reported to modulate many enzymes in rat liver and kidney extracts, activating
      Ca2+-ATPases and suppressing aminoacyl-tRNA synthetase, kinases, phosphatases and
      nitric oxide synthase, so the generic term is consistent with the literature but
      uninformative.
    action: KEEP_AS_NON_CORE
    reason: The term does not overshoot the evidence; it is simply generic. Regucalcin
      acts on targets in both directions (activation of Ca2+-ATPases, inhibition of
      others), so neither enzyme inhibitor activity nor enzyme activator activity alone
      fits, and whether these in vitro effects are direct protein-enzyme regulation
      or a consequence of Ca2+ binding is unresolved. Changed from MARK_AS_OVER_ANNOTATED
      at the 2026 re-review; the previously proposed NEW enzyme inhibitor activity row
      was withdrawn because it is a descendant of this term and the mechanism is unsettled.
    supported_by:
    - reference_id: PMID:2280766
      supporting_text: the protein (1.0-2.0 microM) caused a remarkable decrease in
        the enzyme activity.
    - reference_id: PMID:16786169
      supporting_text: Regucalcin increases Ca2+-ATPase activity in the heart mitochondria
        of normal and regucalcin transgenic rats.
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008367
