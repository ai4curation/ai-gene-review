- term:
    id: GO:1903011
    label: negative regulation of bone development
  evidence_type: IMP
  original_reference_id: PMID:11129957
  review:
    summary: This IMP annotation cites PMID:11129957, whose cached abstract concerns
      regucalcin regulation of protein tyrosine phosphatase activity in cloned rat
      hepatoma cells (H4-II-E) and does not mention bone; the cache is abstract-only,
      so the specific supporting evidence cannot be re-verified from the accessible
      text and the curator's full-text reading is deferred to. The term itself is
      genuinely established for Rgn by the parallel IDA annotation citing PMID:12239582
      (bone loss induced in regucalcin transgenic rats), so the annotation is kept,
      but as a secondary systemic phenotype rather than a core function, consistent
      with the treatment of the IDA row for the same term.
    action: KEEP_AS_NON_CORE
    reason: The bone-loss phenotype of regucalcin overexpression is real but is a
      downstream physiological consequence of regucalcin's Ca2+-homeostasis and signaling-suppressor
      roles, not a core molecular function; aligned with the KEEP_AS_NON_CORE call
      on the IDA annotation of the same term. The abstract-only cache of PMID:11129957
      prevents verifying this row's specific assay, so per curation guidelines the
      curator is not overruled.
    supported_by:
    - reference_id: PMID:11129957
      supporting_text: Role of endogenous regucalcin in protein tyrosine phosphatase
        regulation in the cloned rat hepatoma cells (H4-II-E).
  qualifier: involved_in
