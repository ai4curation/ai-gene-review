id: Q03336
gene_symbol: Rgn
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Regucalcin (SMP30) is a multifunctional calcium-binding protein and gluconolactonase
  enzyme that catalyzes the penultimate step in vitamin C biosynthesis. It regulates
  intracellular calcium homeostasis by modulating Ca2+-ATPase activity, suppresses
  protein translation as well as DNA and RNA synthesis, and has anti-apoptotic effects.
  Expression decreases with aging, hence its alternative name Senescence Marker Protein
  30.
existing_annotations:
- term:
    id: GO:0004341
    label: gluconolactonase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: IBA annotation correctly identifies the core enzymatic function. Strongly
      supported by experimental evidence in PMID:16585534 showing gluconolactonase
      activity is essential for vitamin C biosynthesis. This is a primary molecular
      function of the protein.
    action: ACCEPT
    supported_by:
    - reference_id: file:rat/Rgn/Rgn-deep-research-falcon.md
      supporting_text: 1. **Primary biochemical function:** Rat Rgn encodes regucalcin/SMP30,
        a **metal-dependent gluconolactonase/lactonase (EC 3.1.1.17)** with a **six-bladed
        β‑propeller** active site coordinating a divalent metal (Glu18/Asn154/Asp204;
        Asn103 important for catalysis).
    - reference_id: file:rat/Rgn/Rgn-deep-research-falcon.md
      supporting_text: A central, experimentally supported biochemical activity of
        regucalcin/SMP30 is **gluconolactonase (EC 3.1.1.17)** activity, requiring
        a **divalent metal ion** (e.g., **Zn2+** and **Mn2+** are cited as activators)
        and showing activity on multiple **aldonolactones** in vitro (e.g., D/L‑glucono‑γ‑lactone,
        D/L‑gulono‑γ‑lactone, D/L‑galactono‑γ‑lactone).
  qualifier: enables
  supporting_entities:
  - MGI:MGI:108024
  - PANTHER:PTN004208435
  - RGD:3560
  - UniProtKB:Q15493
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: IBA annotation correctly identifies calcium binding as a core function.
      Strongly supported by experimental evidence dating back to PMID:699201 and confirmed
      by structural studies. Essential for both its enzymatic activity and calcium
      homeostasis regulatory functions. Falcon deep research notes regucalcin is a
      Ca2+-binding/Ca2+-signaling protein but is explicitly NOT an EF-hand protein;
      the divalent metal (including Ca2+/Mg2+) is coordinated at the catalytic active
      site (Glu18/Asn154/Asp204).
    action: ACCEPT
    reason: Calcium binding is retained on direct biochemical/structural evidence
      (classic rat regucalcin Ca2+-binding studies; active-site divalent-metal coordination);
      note that the IBA itself is stale — the current PANTHER PAINT release no longer
      carries an IBD for this term in PTHR10907. GOA no longer carries this row.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTHR10907
        source_label: regucalcin/SMP30 family (PAINT)
        source_status: SOURCE_STALE_OR_MISSING
        comment: No IBD for GO:0005509 remains in the current PTHR10907 PAINT slice
          (snapshot 20251127); the remaining IBDs at PTN004208435 are GO:0004341,
          nucleus, cytoplasm, and GO:0050848 only. PAINT has withdrawn or re-scoped
          this function assertion; the ACCEPT here rests on the direct rat biochemical
          evidence, not on the IBA.
    supported_by:
    - reference_id: file:rat/Rgn/Rgn-deep-research-falcon.md
      supporting_text: Regucalcin is also widely described as a **multifunctional
        Ca2+-signaling regulator** (not an EF‑hand protein), acting as a cytoplasmic
        regulator and capable of **nuclear translocation**, with inhibitory effects
        on multiple kinases/phosphatases and on DNA/RNA/protein synthesis, thereby
        influencing cell-cycle progression and apoptosis sensitivity in various rat
        cell systems.
  retired: true
