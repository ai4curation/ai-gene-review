  label: Rattus norvegicus (Rat)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for rat Rgn (regucalcin/SMP30). Rank 1 is a clean hit on the
  core enzymatic function at 18.65, the highest GO-channel score in the rat set, and the free-text
  channel independently returns the correct gluconolactonase comment at 18.67 - the two channels agreeing
  for once. Below that the retrieval settles into a cluster of hepatic metabolic-regulator terms that
  nothing in the available material supports. Rank 3 is of separate interest: positive regulation
  of cyclic-nucleotide phosphodiesterase activity is obsolete in the current GO release and is also
  the top-ranked call ProTrek returns for worm calmodulin (cmd-1) in this same cohort, where it is
  correct. Regucalcin and calmodulin are unrelated families that share only calcium binding, so this
  looks like a calcium-binding-protein attractor rather than a regucalcin finding. Assessment: 1 correct-not-novel,
  2 uncertain. Assessment: 1 correct not novel (CNN), 2 uncertain (UNC).
