description: >-
  ProTrek sequence-to-text retrieval for rat Rgn (regucalcin/SMP30). Rank 1 is a clean hit on the
  core enzymatic function at 18.65, the highest GO-channel score in the rat set, and the free-text
  channel independently returns the correct gluconolactonase comment at 18.67 - the two channels agreeing
  for once. Below that the retrieval drifts into a cluster of hepatic carbohydrate-metabolism regulatory
  terms that no evidence available here supports. Rank 3 (positive regulation of cyclic-nucleotide
  phosphodiesterase activity) is obsolete in the current GO release and has no resolvable identifier,
  so rank 4 was reviewed in its place; both fall in the same unsupported regulatory cluster. Assessment:
  1 correct-not-novel, 2 uncertain. Assessment: 1 correct not novel (CNN), 2 uncertain (UNC).
