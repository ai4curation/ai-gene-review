    summary: >-
      Rank 3 (score 17.16), absent from GOA and obsolete in the current GO release, so it could not
      be entered even if it were right. Calmodulin, not regucalcin, is the canonical activator of
      cyclic-nucleotide phosphodiesterase, and ProTrek returns this same term as the top hit for worm
