- term:
    id: GO:0006605
    label: protein targeting
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:1891917
  review:
    summary: Client targeting is a downstream consequence of phospho-client binding.
    action: KEEP_AS_NON_CORE
    reason: The source is the mouse Ywhab annotation (MGI, acts_upstream_of_or_within). Binding of 14-3-3 beta to phosphorylated
      clients controls where they reside (e.g. cytoplasmic retention of HDAC4/5 and SRPK2), so influence on protein targeting
      is plausible, but it is a consequence of the core binding activity rather than a targeting mechanism of its own.
