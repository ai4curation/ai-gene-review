id: P35213
gene_symbol: Ywhab
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 14-3-3 protein beta/alpha (Ywhab) is a dimeric phosphoserine/phosphothreonine-binding adapter of the 14-3-3 family,
  expressed broadly and abundantly in brain. It forms homodimers and heterodimers with other 14-3-3 isoforms and binds phosphorylated
  motifs on many signalling proteins, modulating their activity, interactions or location. Binding inhibits client kinases
  such as TESK1 and holds ASK1 in an inactive cytoplasmic complex in hippocampal neurons; it shields phosphorylated clients
  such as AANAT and retains others (class II HDACs, SRPK2, YAP) in the cytoplasm away from the nucleus. It acts mainly in
  the cytosol, and with its partner FBI1 it also occupies the MKP-1 promoter as part of a transcriptional repressor complex
  that sustains ERK signalling in hepatoma cells.
