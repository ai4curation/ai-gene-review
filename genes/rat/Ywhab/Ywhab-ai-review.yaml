  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P31946
  - ensembl:ENSP00000300161
  review:
    summary: Indirect effect of cytoplasmic sequestration of HDAC4/5.
    action: MARK_AS_OVER_ANNOTATED
    reason: The human source (BHF-UCL IDA, PMID:10869435) shows that 14-3-3 retains HDAC4/5 in the cytoplasm, so that loss
      of binding lets the HDACs enter the nucleus and repress genes. Any increase in transcription is an indirect result of
      sequestering a repressor; 14-3-3 beta does not act at RNA polymerase II promoters, and rat data place it in a repressor
      complex (PMID:18460465). The process term over-states its role; the mechanism is captured by protein sequestering activity.
    supported_by:
    - reference_id: PMID:10869435
