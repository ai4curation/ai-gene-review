core_functions:
- description: Dimeric phosphoserine/phosphothreonine-motif reader that binds phosphorylated client proteins (TESK1, ASK1,
    HCV core, AANAT, AS160) and thereby modulates their activity, interactions or location in signal transduction.
  molecular_function:
    id: GO:0140031
    label: phosphorylation-dependent protein binding
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:rat/Ywhab/Ywhab-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Binds to a large number of partners, usually by recognition of a phosphoserine or phosphothreonine motif.
  - reference_id: PMID:10644344
    supporting_text: 14-3-3 protein bound to HCV core protein in a phosphoserine-dependent manner
  - reference_id: PMID:11555644
    supporting_text: 14-3-3beta interacts with TESK1 through the C-terminal region of TESK1 and in a manner dependent on the
      phosphorylation of Ser-439
- description: Sequesters phosphorylated clients away from their sites of action, e.g. holding ASK1 in an inactive complex
    in hippocampal neurons and retaining class II HDACs and SRPK2 in the cytoplasm, preventing their nuclear entry.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  directly_involved_in:
  - id: GO:0042308
    label: negative regulation of protein import into nucleus
  - id: GO:0008104
    label: intracellular protein localization
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:12786973
    supporting_text: Apoptosis signal-regulating kinase 1 was sequestered in a complex that contained the molecular chaperone
      14-3-3beta and protein phosphatase 5
  - reference_id: PMID:10869435
    supporting_text: The association of 14-3-3 with HDAC4 and HDAC5 results in the sequestration of these proteins in the
      cytoplasm.
  - reference_id: file:rat/Ywhab/Ywhab-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Blocks the nuclear translocation of the phosphorylated form (by AKT1) of SRPK2
- description: Inhibits client protein kinases on binding their phosphorylated motifs, as for TESK1, whose kinase activity
    is suppressed by 14-3-3 beta until integrin signalling releases it.
  molecular_function:
    id: GO:0004860
    label: protein kinase inhibitor activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11555644
    supporting_text: Binding of 14-3-3beta inhibited the kinase activity of TESK1.
suggested_questions:
- question: Does 14-3-3 beta inhibit any protein phosphatase directly, or should the human YWHAB protein phosphatase inhibitor
    activity annotation (PMID:17255105, PDE3B shielding) be replaced by phosphorylation-dependent protein binding?
- question: Is the vacuolar membrane location of human YWHAB, derived from recruitment to the Chlamydia trachomatis inclusion
    membrane, suitable for propagation to uninfected orthologs?
- question: Which 14-3-3 beta-specific clients in rat (e.g. FBI1) are not shared with other isoforms, and what determines
    this specificity?
suggested_experiments:
- hypothesis: 14-3-3 beta, rather than other 14-3-3 isoforms, is required for FBI1-mediated repression of MKP-1 and sustained
    ERK1/2 activation in rat hepatoma cells.
  description: Isoform-selective knockdown of Ywhab in K2 hepatoma cells with rescue by wild-type versus phospho-groove mutant
    14-3-3 beta, measuring FBI1 promoter occupancy (ChIP), MKP-1 expression and ERK1/2 activation kinetics.
  experiment_type: genetic perturbation with ChIP and reporter assays
