- term:
    id: GO:0005774
    label: vacuolar membrane
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P31946
  review:
    summary: Rests on recruitment to the Chlamydia inclusion membrane; not a native location.
    action: MARK_AS_OVER_ANNOTATED
    reason: The human source (UniProt EXP, PMID:11260479) shows 14-3-3 beta recruited to the Chlamydia trachomatis inclusion
      membrane through the bacterial protein IncG in infected HeLa cells. A pathogen-built vacuole is not a host vacuolar
      membrane, and no evidence places uninfected 14-3-3 beta on a vacuolar or lysosomal membrane. Transferring this infection-specific
      observation to rat as a general location over-annotates it.
    supported_by:
    - reference_id: PMID:11260479
      supporting_text: One protein, 14-3-3beta, was identified that interacted specifically with IncG.
    - reference_id: PMID:11260479
      supporting_text: 14-3-3beta interacts with Chlamydia trachomatis inclusions but not C. psittaci or C. pneumoniae inclusions
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: CHECK
      asserted_value: GO:0005774
      confidence: PROBABLE
      explanation: Human YWHAB EXP to vacuolar membrane (PMID:11260479) records recruitment of host 14-3-3 beta to the Chlamydia
        trachomatis inclusion membrane by IncG; the term asserts a native vacuolar membrane location. Propagated to rat by
        RGD ISO.
    propagation_review:
      root_cause: SOURCE_BAD
      source_entities:
      - source_id: UniProtKB:P31946
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Infection-specific recruitment to a pathogen vacuole in human cells; not transferable as a native rat location.
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
