  review:
    summary: 14-3-3 beta can act in the nucleus; peripheral to its mainly cytosolic role.
    action: KEEP_AS_NON_CORE
    reason: In rat hepatoma cells ChIP places 14-3-3 beta with FBI1 on the MKP-1 promoter (PMID:18460465), and 14-3-3 proteins
      shuttle between nucleus and cytoplasm. Nuclear location is real but secondary to the predominantly cytosolic phospho-client
      binding and sequestration.
    supported_by:
    - reference_id: PMID:18460465
      supporting_text: chromatin immunoprecipitation analysis demonstrated that FBI1 and 14-3-3beta were presented on the
        MKP-1 promoter
