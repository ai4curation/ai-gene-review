- term:
    id: GO:0004864
    label: protein phosphatase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P31946
  - ensembl:ENSP00000300161
  review:
    summary: Source study shows substrate shielding, not phosphatase inhibition.
    action: MARK_AS_OVER_ANNOTATED
    reason: The human source annotation (BHF-UCL IDA, PMID:17255105) is from a study showing that 14-3-3 binding to PKA-phosphorylated
      PDE3B protects PDE3B from phosphatase-dependent dephosphorylation. That is protection of a phosphorylated client (substrate
      shielding), not binding to and inhibiting a protein phosphatase, which is what GO:0004864 asserts. No study inspected
      here shows 14-3-3 beta inhibiting a phosphatase enzyme directly, so the rat transfer over-states the evidence; the shielding
      is captured by phosphorylation-dependent protein binding.
    supported_by:
    - reference_id: PMID:17255105
      supporting_text: the PKA-phosphorylated, 14-3-3 protein-bound, form of HSPDE3B is protected from phosphatase-dependent
        dephosphorylation and inactivation
    - reference_id: PMID:17255105
      supporting_text: phosphorylation of HSPDE3B at Ser-318 activates this PDE and stimulates its interaction with 14-3-3
        proteins
    source_defects:
    - defect_type: WRONG_TERM
      resource: ARUK_UCL
      requested_change: CHECK
      asserted_value: GO:0004864
      corrected_value: GO:0140031
      corrected_label: phosphorylation-dependent protein binding
      confidence: PROBABLE
      explanation: Human YWHAB IDA to protein phosphatase inhibitor activity (PMID:17255105) rests on 14-3-3 binding protecting
        phospho-PDE3B from dephosphorylation (substrate shielding), not on inhibition of a phosphatase; propagated to rat
        by IEA/ISO.
    propagation_review:
      root_cause: SOURCE_BAD
      source_entities:
      - source_id: UniProtKB:P31946
        source_status: SOURCE_BAD
        comment: Human IDA (PMID:17255105, abstract) describes shielding of phospho-PDE3B, not phosphatase inhibition.
      failure_modes:
      - ROLE_CONFLATION
