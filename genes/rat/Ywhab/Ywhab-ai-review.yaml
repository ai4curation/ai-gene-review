  review:
    summary: 14-3-3 beta binding inhibits client kinases.
    action: ACCEPT
    reason: 14-3-3 beta binds TESK1 in a phospho-Ser-439-dependent manner and inhibits its kinase activity (PMID:11555644,
      the paper behind the human IDA and cited in the rat UniProt entry), and in rat hippocampus it holds ASK1 in an inactive
      complex released on seizure (PMID:12786973). Client-kinase inhibition through phospho-motif binding is a recurrent,
      core consequence of 14-3-3 beta function; the ortholog transfer is sound.
    supported_by:
