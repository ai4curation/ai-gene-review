  label: Rattus norvegicus (Rat)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for rat Hspa8 (HSC70), the constitutively expressed cytosolic
  HSP70-family chaperone. All three reviewed calls are correct and already in GOA, but none of them
  is a core function: the retrieval returns a cargo-transport process, a substrate-binding term and
  an interaction-partner-domain term, while the three curated core functions - protein folding chaperone
  activity, clathrin-uncoating ATPase activity and the chaperone-mediated-autophagy adaptor role -
  are absent from the entire top five. The free-text Function channel, by contrast, returns the correct
  HSC70 comment ('Molecular chaperone implicated in a wide variety of cellular processes...') at 17.61,
  so the two text channels again disagree with the GO channel on the losing side. Assessment: 3 correct
  not novel (CNN).
