suggested_questions:
- question: Should RGD revisit the GO:0051452 intracellular pH reduction annotation from PMID:22147702, given the
    paper shows alpha-TTP preserves low organelle pH only by preventing chloroquine accumulation?
- question: What late-endosomal partner recruits alpha-TTP to the cytoplasmic surface of late endosomes (the target
    implied by the residue 21-50 requirement), and how does alpha-TTP receive tocopherol there?
- question: How does alpha-TTP promote NPC1-dependent clearance of lysosomotropic amines without detectable binding
    to NPC1?
suggested_experiments:
- description: Proximity labelling (e.g. APEX2/TurboID) of wild-type versus residue 21-50 deleted alpha-TTP in primary
    rat hepatocytes to identify the late-endosomal binding partner.
- description: In vitro tocopherol transfer assays from NPC1/NPC2-containing donor liposomes to PI(4,5)P2 acceptor
    liposomes to test whether alpha-TTP extracts tocopherol directly from late-endosome-like membranes.
