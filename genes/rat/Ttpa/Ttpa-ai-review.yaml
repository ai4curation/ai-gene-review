- term:
    id: GO:0051452
    label: intracellular pH reduction
  evidence_type: IDA
  original_reference_id: PMID:22147702
  qualifier: involved_in
  review:
    summary: The paper shows Ttpa prevents chloroquine-induced neutralisation of acidic organelles; it does not
      reduce pH.
    action: MARK_AS_OVER_ANNOTATED
    reason: Full text read. In Ttpa-expressing cells the lumenal pH of acidic compartments stayed low in the presence
      of CQ, because CQ did not accumulate; the authors explicitly state Ttpa did not affect organelle pH, unlike
      bafilomycin. "Intracellular pH reduction" (a process that lowers pH) reads the result in the wrong direction
      and attributes to Ttpa what is an indirect effect of NPC1-dependent CQ clearance.
    supported_by:
    - reference_id: PMID:22147702
      supporting_text: α-TTP prevents CQ accumulation in acidic organelles, thus preserving their low pH
    - reference_id: PMID:22147702
      supporting_text: In sharp contrast, the expression of α-TTP did not affect the pH in the acidic organelles.
    - reference_id: file:rat/Ttpa/Ttpa-deep-research-manual.md
      supporting_text: the RGD IDA "intracellular pH reduction" reads the result in the wrong direction
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      requested_change: CHECK
      asserted_value: GO:0051452
      confidence: SUSPECTED
      explanation: PMID:22147702 shows alpha-TTP prevents CQ-induced pH rise by limiting CQ accumulation; it does
        not lower pH. Consider removing or replacing with a term describing protection against lysosomotropic drug
        toxicity.
      supported_by:
      - reference_id: PMID:22147702
        supporting_text: In sharp contrast, the expression of α-TTP did not affect the pH in the acidic organelles.
