id: P41034
gene_symbol: Ttpa
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Alpha-tocopherol transfer protein (alpha-TTP), a cytosolic Sec14/CRAL-TRIO lipid-binding protein expressed
  mainly in hepatocytes. It selectively binds RRR-alpha-tocopherol (vitamin E) in a hydrophobic pocket and transfers
  it between membranes, carrying tocopherol taken up with lipoproteins from the endocytic compartment (it associates
  transiently with the cytoplasmic surface of late endosomes) to the plasma membrane, where binding of phosphatidylinositol
  4,5-bisphosphate opens the lid of the pocket and releases the vitamin for secretion into plasma lipoproteins.
  It is therefore a major determinant of plasma and tissue alpha-tocopherol; loss of the orthologous human gene
  causes ataxia with vitamin E deficiency. Alpha-TTP also protects hepatocytes and retina against chloroquine toxicity
  by limiting drug accumulation in acidic organelles through an NPC1-dependent mechanism distinct from vitamin E
  transport.
