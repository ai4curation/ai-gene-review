  review:
    summary: Action potential, by ISO from the human IKs reconstitution data, which are actually on the short-isoform entry
      O43687.
    action: UNDECIDED
    reason: The human source is the IDA from PMID:11299204 on O43687 (the alpha/beta entry), not on Q9P0M2 as the With/From
      says. That study showed that co-expressed AKAP15/18 can confer cAMP regulation on KvLQT1/IsK currents in heterologous
      cells, and the effect was attributed to PKA anchoring by any AKAP. The cached abstract reports voltage-clamp currents
      only and does not mention action potentials, and the human review of that row is itself UNDECIDED for that reason. Nothing
      from rat, or from the long gamma/delta forms, connects Akap7 to action potentials. Without the source full text I can
      neither confirm nor reject the claim.
