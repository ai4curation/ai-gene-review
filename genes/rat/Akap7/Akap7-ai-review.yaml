- id: AKAP7_ALPHA
  name: AKAP18alpha / AKAP15 (short lipid-anchored isoform)
  type: SPLICE_VARIANT
  description: The 81-residue short isoform of rat Akap7, myristoylated at Gly1 and palmitoylated at Cys5 and Cys6 (MGQLCC...).
    It shares its C-terminal 57 residues, including the PKA-RII-binding helix, with Q6JP77, but has an N-terminus that targets
    it to the plasma membrane. This is the form studied as AKAP15 at CaV1.2 channels (PMID:14569017). Neither isoform of the
    Swiss-Prot entry Q6JP77 (delta, gamma) is this sequence. In human the short forms have their own Swiss-Prot entry (O43687).
  maps_to:
  - type: UNIPROTKB_UNREVIEWED
    ids:
    - A0ABK0LH41
  - type: REFSEQ_PROTEIN
    ids:
    - XP_038937088.1
  source_defects:
