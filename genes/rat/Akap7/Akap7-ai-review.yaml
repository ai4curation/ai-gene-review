- id: file:rat/Akap7/Akap7-uniprot.txt
  title: UniProt entry Q6JP77 (AKA7G_RAT)
core_functions:
- description: PKA-anchoring adaptor at the cardiac sarcoplasmic reticulum. AKAP18delta binds PKA RII through its C-terminal
    amphipathic helix and binds unphosphorylated phospholamban, which places PKA beside its substrate in the SERCA2/PLN complex.
    This promotes PLN phosphorylation and Ca2+ re-uptake after beta-adrenergic stimulation.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0141156
    label: cAMP/PKA signal transduction
  locations:
  - id: GO:0016529
    label: sarcoplasmic reticulum
  supported_by:
  - *id024
  - *id005
  - *id011
  - *id025
  - *id008
  knowledge_gaps:
  - gap_statement: Whether AKAP7 long isoforms are required for adrenergic PLN phosphorylation in vivo is unresolved.
    boundary: 'Established: AKAP18delta/gamma binds PLN and PKA, and peptide or small-molecule disruption alters PLN phosphorylation
      in rat cardiomyocytes. Also established: a mouse lacking every AKAP7 isoform has normal adrenergic Ca2+ handling and
      PLN phosphorylation. Open: whether other AKAPs compensate, or whether the disruptors act beyond AKAP7.'
    gap_kind:
    - BIOLOGY
    provenance:
    - *id026
    - reference_id: PMID:23035250
      supporting_text: KO cardiomyocytes responded normally to adrenergic stimulation, as measured by whole-cell patch clamp
        or a fluorescent intracellular Ca(2+) indicator.
- description: 'Binding to the regulatory subunits of PKA: high-affinity RII binding through the amphipathic helix shared
    by all AKAP7 isoforms, with an overlapping RI-binding region. Cyclic AMP releases the kinase.'
  molecular_function:
    id: GO:0034237
    label: protein kinase A regulatory subunit binding
  locations:
