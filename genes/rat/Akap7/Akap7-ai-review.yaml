suggested_questions:
- question: Rat Akap7 annotations from AKAP15 (alpha isoform) studies, such as T-tubule, land on Q6JP77, which lists only
    the delta and gamma isoforms. Should UniProt add the alpha isoform (A0ABK0LH41 sequence) or create a reviewed rat alpha
    entry as for human O43687?
- question: Should GO record the direct, high-affinity binding of AKAP7gamma/delta to PKC (PMID:22670899) as protein kinase
    C binding for rat Akap7? That depends on the species of the constructs used.
- question: Does AMP binding to the central domain change RII binding or PLN binding of AKAP18delta?
suggested_experiments:
- description: Delete only the long AKAP7 isoforms in rat cardiomyocytes, where the delta form predominates, and measure isoproterenol-induced
    PLN Ser16 phosphorylation and SR Ca2+ re-uptake, to test the scaffold in a species that expresses delta rather than gamma.
  experiment_type: conditional knockout with physiology
- description: Screen the AKAP18delta central domain against 2',3'-cyclic nucleotides and RNA substrates of 2H phosphoesterases,
    and measure whether AMP occupancy changes RII affinity by fluorescence polarization.
  experiment_type: enzymology / binding assays
