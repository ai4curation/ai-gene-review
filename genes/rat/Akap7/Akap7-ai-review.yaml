    resource: UNIPROT
    record: UniProtKB:Q6JP77
    slot: ALTERNATIVE PRODUCTS
    requested_change: ADD
    asserted_value: UniProtKB:Q6JP77
    corrected_value: UniProtKB:A0ABK0LH41
    confidence: PROBABLE
    explanation: Rat Akap7 produces the short myristoylated/palmitoylated alpha isoform (AKAP15), represented only by the
      unreviewed entry A0ABK0LH41 (81 aa; RefSeq XP_038937088.1). Rat GO annotations made to the gene, including IDA rows
      from AKAP15 studies (PMID:14569017), land on Q6JP77, which lists only delta and gamma. Either add alpha as an isoform,
      or make a reviewed rat counterpart of human O43687.
