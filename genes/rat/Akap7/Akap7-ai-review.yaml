id: Q6JP77
gene_symbol: Akap7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Akap7 (AKAP18, AKAP15) encodes a family of PKA-anchoring proteins made by alternative splicing. This entry covers
  the two long isoforms, AKAP18delta (353 aa, the main form in rat) and AKAP18gamma. Both share with the short lipid-anchored
  AKAP18alpha a C-terminal amphipathic helix that binds the dimerization/docking domain of the PKA regulatory subunits, RII
  with high affinity and RI more weakly. The long forms also carry a central domain with the fold of a 2H phosphoesterase,
  which binds 5'AMP and 5'CMP but has no known catalytic activity, and a polybasic nuclear localization signal that is masked
  when PKA is bound. They are mostly soluble but are recruited to specific membranes. In cardiomyocytes AKAP18delta sits at
  the sarcoplasmic reticulum in a complex with SERCA2, phospholamban (PLN) and PKA. It binds unphosphorylated PLN and tethers
  PKA to it, which promotes the PLN phosphorylation that relieves SERCA2 inhibition and speeds Ca2+ re-uptake after beta-adrenergic
  stimulation. In renal collecting-duct principal cells it is on AQP2-bearing vesicles with PKA and PDE4D, and it moves with
  AQP2 to the apical plasma membrane on vasopressin stimulation. AKAP7 long isoforms also bind PKC. In mouse, a knockout of
  all isoforms leaves adrenergic Ca2+ handling in cardiomyocytes intact, so whether the PLN scaffold is needed in vivo is
  unresolved.
