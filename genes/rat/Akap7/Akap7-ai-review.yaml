  - *id014
  - *id018
- description: Nucleotide binding by the central 2H phosphoesterase-like domain, which binds 5'AMP and 5'CMP at physiological
    affinity. No catalytic activity or physiological role has been demonstrated.
  molecular_function:
    id: GO:0016208
    label: AMP binding
  supported_by:
  - *id028
  - *id029
  - *id030
  knowledge_gaps:
  - gap_statement: Whether the AKAP18 central domain is a phosphoesterase or an AMP sensor that couples AMP levels to PKA
      signalling is unknown.
    boundary: 'Established: the fold, two conserved His-x-Thr motifs, and AMP/CMP binding. Unknown: any substrate, catalytic
      rate, or effect of AMP binding on PKA anchoring.'
    gap_kind:
