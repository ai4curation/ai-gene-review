  review:
    summary: AMP binding, from crystal structures of the rat AKAP18delta central domain.
    action: ACCEPT
    reason: Co-crystal structures of rat residues 88-292 (PDB 2VFK, 2VFL, 2VFY) show 5'AMP and 5'CMP in the groove of the
      2H phosphoesterase-like central domain, with an AMP affinity in the physiological range. UniProt lists AMP-binding residues
      134 and 224-226 from this paper. This is a direct structural observation on this protein. Whether the binding has a
      physiological role, as an AMP sensor or for a still-unidentified phosphoesterase activity, is unknown and is recorded
      as a knowledge gap.
