- term:
    id: GO:0002020
    label: protease binding
  evidence_type: IPI
  original_reference_id: PMID:17518537
  qualifier: enables
  supporting_entities:
  - RGD:620945
  review:
    summary: Protease binding from co-precipitation of Fas with caspase-8 (and caspase-3) in the spinal-cord
      DISC after injury.
    action: MARK_AS_OVER_ANNOTATED
    reason: The paper shows Fas in a raft-associated DISC containing FADD, caspase-8, cFLIP-L and caspase-3.
      Caspase-8 binds FADD, not Fas, so the Fas-caspase association is indirect complex co-membership.
      That is captured by the CD95 death-inducing signaling complex (part_of) annotation from the same
      paper; a protease-binding MF over-states a direct interaction.
    supported_by:
    - &id012
      reference_id: PMID:17518537
      supporting_text: SCI resulted in FasL and Fas translocation into membrane raft microdomains where
        Fas associates with the adaptor proteins Fas-associated death domain (FADD), caspase-8, cellular
        FLIP long form (cFLIPL ), and caspase-3, forming a death-inducing signaling complex (DISC).
- term:
    id: GO:0002931
    label: response to ischemia
  evidence_type: IEP
  original_reference_id: PMID:30301943
  qualifier: involved_in
  review:
    summary: Fas up-regulated in the ischemic rat brain; a Fas-blocking peptide reduced apoptosis and
      infarct.
    action: KEEP_AS_NON_CORE
    reason: In addition to expression, Fas blockade by intranasal FBP attenuated Fas-mediated apoptosis
      after MCAO, so Fas participates in the apoptotic response to ischemia. Non-core.
