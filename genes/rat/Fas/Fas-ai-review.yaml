      supporting_text: FBP, upon intranasal administration, specifically binds Fas-expressing apoptotic
        regions in the brain in a rat ischemia model and effectively blocks Fas-mediated apoptosis resulting
        in recovery from ischemic stroke.
- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008063
  review:
    summary: Transmembrane signaling receptor activity for rat Fas, from the InterPro Fas receptor family
      mapping (IEA) or a statement in the rat variant-transcript paper (NAS).
    action: MODIFY
    reason: Fas is a single-pass type I receptor that transmits a FASLG signal across the membrane, so
      the term is correct but less specific than warranted. The specific supported activity is death receptor
      activity (GO:0005035), a descendant term; Fas binds FASLG and recruits FADD through its death domain.
      PMID:7507668 itself only describes a truncated soluble variant transcript, so it adds no functional
      evidence beyond the family assignment.
