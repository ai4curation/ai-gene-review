      cellular FLIP long form (cFLIPL ), and caspase-3, forming a death-inducing signaling complex (DISC).
  - reference_id: PMID:23940767
    supporting_text: Anti-Fas antibody prevents caspase-8 and caspase-3 activation by phenylalanine.
suggested_questions:
- question: Which rat Fas transcripts encode soluble receptor forms beyond the 65-residue variant described
    in PMID:7507668, and do they antagonize FasL in vivo (e.g. in castrated prostate, where secretory-granule
    Fas is abundant)?
- question: The IMP annotations of Schwann-cell proliferation and migration to rat Fas cite a Faslg-only
    knockdown study (PMID:29970988); should RGD move them to Faslg or delete them?
- question: What determines whether Fas engagement in rat cardiomyocytes, PC12 cells and gastric mucosal
    cells yields non-apoptotic outputs (AP-1, JNK-driven neurite regrowth, ERK proliferation) instead
    of apoptosis?
suggested_experiments:
- hypothesis: Fas itself, not only its ligand, restrains Schwann cell proliferation and migration after
    sciatic nerve injury.
  description: Knock down Fas (siRNA or AAV-shRNA) in cultured rat Schwann cells and in the injured sciatic
    nerve, with Faslg knockdown as comparator, and measure EdU incorporation, transwell migration and
    TUNEL.
  experiment_type: Loss-of-function with ligand comparator
- hypothesis: Rat Fas assembles a DISC through its death domain at the plasma membrane of hepatocytes
    after ligand engagement.
  description: Express wild-type and death-domain point-mutant rat Fas in Fas-null cells, stimulate with
    FasL, and immunoprecipitate receptor complexes to quantify FADD, caspase-8 and cFLIP recruitment and
    caspase-8 processing.
  experiment_type: Structure-function reconstitution
