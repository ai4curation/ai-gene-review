- term:
    id: GO:0001552
    label: ovarian follicle atresia
  evidence_type: IEP
  original_reference_id: PMID:8612534
  qualifier: involved_in
  review:
    summary: Fas expressed in granulosa cells of early atretic follicles; IFN-gamma-primed granulosa cells
      undergo oocyte (FasL)-induced apoptosis.
    action: KEEP_AS_NON_CORE
    reason: Beyond expression, the paper links Fas-FasL co-localization to granulosa apoptosis and shows
      FasL-bearing oocytes induce apoptosis of Fas-up-regulated granulosa cells, supporting a Fas-mediated
      contribution to follicle atresia. Physiological context, non-core.
    supported_by:
    - reference_id: PMID:8612534
      supporting_text: Colocalization of Fas and Fas ligand in certain follicles intimately correlated
        with granulosa cell apoptosis
- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IEP
  original_reference_id: PMID:16870148
  qualifier: involved_in
  review:
    summary: Reduced fas expression in IL-6-rescued hypoxic IEC-6 cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Expression-change (IEP) evidence only: the paper shows Fas mRNA/protein levels change but
