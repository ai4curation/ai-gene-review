id: Q63199
gene_symbol: Fas
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Fas (TNFRSF6, CD95, APO-1) is a single-pass type I transmembrane death receptor of the TNF
  receptor superfamily. Its extracellular region carries three cysteine-rich domains that bind the trimeric
  ligand FasL (FASLG/TNFSF6); its cytoplasmic death domain recruits the adaptor FADD, which brings in
  caspase-8 (and cFLIP) to form the CD95 death-inducing signaling complex (DISC) at the plasma membrane,
  often within membrane rafts. DISC-mediated caspase-8 activation initiates extrinsic apoptosis. In rat,
  Fas-dependent apoptosis has been shown in hepatocytes, cortical neurons, oligodendrocytes, alveolar
  epithelial and nucleus pulposus cells, and after spinal cord injury and brain ischemia. Depending on
  context, Fas engagement can instead activate non-apoptotic outputs such as AP-1, JNK-dependent neurite
  regrowth, or ERK/NF-kB proliferative signaling. Soluble forms arise by ectodomain shedding and alternative
  splicing. Physiologically, Fas-mediated deletion is central to lymphocyte homeostasis and peripheral
  tolerance.
