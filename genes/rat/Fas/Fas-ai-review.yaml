  - RGD:619831
  - UniProtKB:P25445
  review:
    summary: Phylogenetic inference of tumor necrosis factor receptor activity across the TNFRSF6 clade.
    action: MODIFY
    reason: GO:0005031 is defined as combining with tumor necrosis factor. Fas does not bind TNF; its
      ligand is FASLG (TNFSF6). The PAINT node correctly captures that the clade has a ligand-activated
      death-receptor activity, so the claim is sound in essence but uses a ligand-specific term for the
      wrong ligand. Replace with death receptor activity (GO:0005035), as in the human FAS review.
    proposed_replacement_terms:
    - id: GO:0005035
      label: death receptor activity
    supported_by:
    - *id001
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002930185
        comment: Source supports a ligand-activated death-receptor activity, but the TNF-specific term
          names the wrong ligand for Fas (FASLG receptor).
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:P25445
        comment: Source supports a ligand-activated death-receptor activity, but the TNF-specific term
