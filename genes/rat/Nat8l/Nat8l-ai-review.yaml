- term:
    id: GO:0051586
    label: positive regulation of dopamine uptake involved in synaptic transmission
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: The positive regulation of dopamine uptake involved in synaptic transmission
      annotation reflects an indirect link (mouse Shati/Nat8l promotes dopamine uptake
      via TNF expression), not a direct molecular activity. Nat8l has no transporter
      or signaling activity at the synapse; its established biochemical role is NAA
      synthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: Nat8l does not act in the dopamine uptake machinery. UniProt (by similarity
      to mouse Shati/Nat8l) records that it promotes dopamine uptake by regulating
      TNF expression, i.e. an indirect effect mediated by a cytokine; the term, which
      specifies a role in synaptic transmission, overstates this upstream influence
      relative to the enzyme's established NAA-synthesis activity.
    supported_by:
    - reference_id: UniProtKB:D3ZVU9
      supporting_text: 'Promotes dopamine uptake by regulating TNF expression (By similarity).'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:2447776
        source_label: mouse Nat8l
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The mouse Nat8l (Shati) donor annotation reflects increased dopamine
          uptake mediated through TNF expression, an indirect effect; the mouse experiment
          itself is not adjudicated here, but the term overstates the mechanism when
          transferred to rat Nat8l.
