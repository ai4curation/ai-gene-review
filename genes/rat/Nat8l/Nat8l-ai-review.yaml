id: D3ZVU9
gene_symbol: Nat8l
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Nat8l encodes N-acetylaspartate synthetase (aspartate N-acetyltransferase,
  Asp-NAT; EC 2.3.1.17), a NAT8-family GNAT acetyltransferase that transfers the acetyl
  group of acetyl-CoA to L-aspartate to form N-acetyl-L-aspartate (NAA). Nat8l is
  expressed mainly in neurons, where NAA reaches very high concentrations; NAA is
  exported to oligodendrocytes and hydrolysed by aspartoacylase (ASPA) to supply
  acetate for myelin lipid synthesis, and is also the precursor of the neuropeptide
  NAAG. The enzyme is a membrane-associated protein found in microsomal/ER and mitochondrial
  fractions, with most brain activity in mitochondria. In mice, Nat8l (also called
  Shati) also influences dopamine uptake indirectly through TNF expression.
