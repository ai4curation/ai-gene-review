id: O08769
gene_symbol: Cdkn1b
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Cdkn1b encodes p27Kip1, a largely intrinsically disordered Cip/Kip-family cyclin-dependent kinase inhibitor.
  Its N-terminal kinase-inhibitory (CDI) domain binds the cyclin and CDK subunits of G1/S cyclin E-CDK2 and cyclin
  A-CDK2 complexes and blocks the catalytic cleft, restraining Rb phosphorylation and the G1/S transition; it also
  acts as an assembly factor for cyclin D-CDK4 complexes. In the rat, p27 is bound to cyclin E-CDK2 while CDK2 activity
  is held low early in liver regeneration, its knockdown drives proliferation in the cochlear sensory epithelium,
  and a germ-line frameshift causes the MENX multiple endocrine neoplasia syndrome. p27 acts mainly in the nucleus;
  a cytoplasmic pool binds stathmin and influences microtubule stability and motility. Its abundance is controlled
  by mitogenic signalling, FOXO-driven transcription, phosphorylation-dependent SCF(Skp2) and CUL4 ubiquitination,
  CRM1-mediated export, calpain cleavage and endolysosomal turnover.
