  review:
    summary: Phylogenetic inference of CDK inhibitor activity for the Cip/Kip clade.
    action: ACCEPT
    reason: 'p27Kip1 is the founding Kip inhibitor: its N-terminal CDI domain (present in rat O08769, Pfam PF02234,
      residues 31-79) binds cyclin and CDK and inserts into the CDK catalytic cleft as an ATP mimic. In rat liver
      regeneration p27 is bound to cyclin E-CDK2 exactly when CDK2 activity is low. This is the core activity of
      the gene. The IBD node (PTN004142838) spans the Cip/Kip family, and rat p27 sits squarely inside it.'
