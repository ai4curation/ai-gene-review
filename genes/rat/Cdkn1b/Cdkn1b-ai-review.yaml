suggested_questions:
- question: Does rat p27 act as an assembly factor that also permits CDK4 activity when tyrosine-phosphorylated,
    as shown for human p27, and is this relevant to MENX tumorigenesis?
- question: Should ubiquitin ligase activator activity, positive regulation of protein catabolic process and nuclear
    export be retired from the human CDKN1B donor rows, since p27 is the substrate/cargo in each experiment, so
    that RGD ISO transfers stop propagating them?
- question: What antibiotic stimulus underlies the mouse Cdkn1b IDA to cellular response to antibiotic from PMID:19056892?
suggested_experiments:
- description: Reconstitute rat cyclin E-CDK2 with wild-type rat p27 and the MENX frameshift product and measure
    inhibition constants, to test whether the MENX allele retains any residual CDK-inhibitory activity.
- description: Endogenous co-immunoprecipitation from rat cells of p27 with CUL4A/DDB1 versus SCF(Skp2), with substrate-trapping
    controls, to separate complex membership from substrate encounter.
