- term:
    id: GO:0016791
    label: phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:8633035
  qualifier: enables
  review:
    summary: Phosphatase activity reported for CA III purified from rat liver, later shown by the same laboratory
      to be a contaminating phosphatase.
    action: REMOVE
    reason: The claim is genuinely contradicted. Kim, Selengut and Levine (PMID:10845711, the same laboratory as
      PMID:8633035) expressed recombinant rat liver CA III, found full CO2 hydratase activity but virtually no phosphatase
      activity, and separated the phosphatase from CA III by further purification. The Car3 knockout paper restates
      this (PMID:15509796). Full text of PMID:8633035 was not read, but its own authors withdrew the conclusion.
    supported_by:
    - reference_id: PMID:10845711
      supporting_text: We conclude that the phosphatase activity previously considered to be intrinsic to carbonic
        anhydrase III is actually extrinsic.
    - reference_id: PMID:15509796
      supporting_text: Car3 had been thought to also possess intrinsic tyrosine phosphatase activity, but that was
        subsequently found to be due to a contaminating phosphatase
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      requested_change: DELETE_ROW
      asserted_value: GO:0016791
      cause: CONTAMINANT
      confidence: CONFIRMED
      explanation: 'RGD IDA for GO:0016791 phosphatase activity on rat Ca3 (PMID:8633035) is refuted by PMID:10845711
        from the same laboratory: recombinant rat CA III has virtually no phosphatase activity and the activity
        is a separable contaminant. The mouse ISO/IEA rows to GO:0016791 derive from this rat row and should also
        be withdrawn.'
      supported_by:
      - reference_id: PMID:10845711
        supporting_text: We conclude that the phosphatase activity previously considered to be intrinsic to carbonic
          anhydrase III is actually extrinsic.
