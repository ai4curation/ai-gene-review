- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IMP
  original_reference_id: PMID:10900145
  qualifier: involved_in
  review:
    summary: Response to oxidative stress, attributed to a study of CA III suppression by the toxicant PenCB.
    action: KEEP_AS_NON_CORE
    reason: The cited abstract reports suppression of CA III expression by PenCB and only speculates that this weakens
      oxidative-stress defence; full text was not available. A role for CA III in protecting cells from oxidative
      stress is independently supported for rat CA III by overexpression (PMID:10064618) and knockdown (PMID:29559661),
      but Car3-null mice respond normally to hyperoxia (PMID:15509796), so the role is kept as non-core. The IMP
      code is doubtful for a toxicant-suppression study and is flagged for RGD to check.
    supported_by:
    - reference_id: PMID:10900145
      supporting_text: Dramatic decrease of CAIII in rat liver by PenCB could account for the suppression of the
        defense system for oxidative stress.
    - reference_id: PMID:29559661
      supporting_text: These results showed that CAIII silenced cells were highly susceptible to cell death in presence
        of H2O2 at both concentrations used
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: RGD
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000315
      confidence: SUSPECTED
      explanation: RGD IMP for GO:0006979 response to oxidative stress on rat Ca3 cites PMID:10900145, which (from
        its abstract) measures suppression of CA III expression by PenCB and does not assay an oxidative-stress
        response after CA III loss. IEP (for the expression change) or a different reference may be intended; please
        check against the full text.
