id: P14141
gene_symbol: Ca3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Carbonic anhydrase III (CA III), encoded by Ca3, is a cytosolic zinc metalloenzyme of the alpha-carbonic
  anhydrase family that catalyses the reversible hydration of carbon dioxide to bicarbonate and a proton, with a
  specific activity only a few percent of that of CA II. It is among the most abundant soluble proteins of slow-twitch
  skeletal muscle, adipocytes and liver, and its hepatic and adipose levels fall sharply in obesity, ethanol exposure
  and toxicant exposure. Two surface cysteines are readily S-glutathionylated under oxidative stress, and gain-
  and loss-of-function studies in cultured cells indicate that CA III lowers reactive oxygen species and protects
  cells from hydrogen-peroxide-induced, caspase-3-mediated apoptosis; however, Car3-null mice are viable with normal
  fat stores and hyperoxia responses, so its physiological role remains unclear. A previously reported tyrosine
  phosphatase activity was shown to come from a contaminating protein.
