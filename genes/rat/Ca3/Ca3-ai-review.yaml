core_functions:
- description: Low-turnover cytosolic carbonic anhydrase that reversibly hydrates CO2 to bicarbonate using a zinc
    ion bound by three histidines.
  molecular_function:
    id: GO:0004089
    label: carbonate dehydratase activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:10845711
    supporting_text: The purified recombinant had the same specific activity as the carbonic anhydrase purified
      from rat liver, but it had virtually no phosphatase activity.
  - reference_id: PMID:15509796
    supporting_text: Carbonic anhydrase III is a cytosolic protein which is particularly abundant in skeletal muscle,
      adipocytes, and liver.
  - reference_id: PMID:8476041
    supporting_text: CA III enzyme activity measurements made by 18O mass spectrometry
suggested_questions:
- question: Given its very low CO2 hydratase turnover and extreme abundance in adipocytes and slow muscle, is the
    physiological role of CA III catalytic, or is it a redox buffer acting through its reactive glutathionylatable
    cysteines?
- question: Why do cell-culture knockdown and overexpression studies show strong protection from H2O2-induced apoptosis
    while Car3-null mice respond normally to hyperoxia?
- question: Should the mouse ISO/IEA GO:0016791 phosphatase activity rows derived from the rat PMID:8633035 annotation
    be withdrawn together with it?
suggested_experiments:
- description: Express Cys-to-Ser mutants of the two glutathionylatable cysteines in rat CA III knockdown NP cells
    and test whether rescue of H2O2-induced apoptosis requires the cysteines or the zinc-site histidines.
- description: Challenge Car3-null mice with tissue-specific oxidative stress (e.g. eccentric exercise, ethanol
    or CCl4 liver injury) rather than whole-body hyperoxia to test for a context-dependent protective role.
