  review:
    summary: RyR2 is a multi-pass integral membrane protein of the SR, so an extrinsic (peripherally
      attached) component of the cytoplasmic face of the plasma membrane is the wrong topology and 
      the wrong membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0031234 is defined as gene products 'loosely bound to its cytoplasmic surface, but 
      not integrated into the hydrophobic region' (OLS/OAK definition), whereas UniProt types RyR2 
      as a multi-pass SR membrane protein. The cited rat pulmonary-artery study places RyR2 
      labelling in an intermediate SR region, with the subplasmalemmal compartment occupied by RyR1,
      so it does not support a plasma-membrane location for RyR2 either. Marked as over-annotated 
      rather than removed, as the large cytoplasmic cap of RyR2 does extend toward the dyadic 
      junctional membrane.
    source_defects:
    - defect_type: WRONG_TERM
      requested_change: REPOINT
      asserted_value: GO:0031234
      corrected_value: GO:0033017
      corrected_label: sarcoplasmic reticulum membrane
      confidence: PROBABLE
      resource: RGD
      explanation: RGD IDA from PMID:20177054 to GO:0031234 extrinsic component of cytoplasmic side 
        of plasma membrane for rat Ryr2. The paper's Fig. 3 places RyR2 labelling in the 
        intermediate (extraperinuclear) region of pulmonary arterial smooth muscle cells, with the 
        subplasmalemmal store occupied by RyR1/SERCA2b, so it does not support a plasma-membrane 
        assignment; and RyR2 is a multi-pass SR membrane protein, so 'extrinsic component' is the 
        wrong topology class in any case.
      supported_by:
      - reference_id: PMID:20177054
        supporting_text: majority of labeling for RyR2 lay in between these two regions of the cell
      - reference_id: UniProtKB:B0LPN4
        supporting_text: Sarcoplasmic reticulum membrane
