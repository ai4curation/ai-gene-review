    label: cardiac muscle hypertrophy
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:99685
  review:
    summary: 'RyR2 contributes to pro-hypertrophic signalling: blocking RyR within the mAKAP complex reduces
      adrenergic hypertrophy of rat cardiomyocytes.'
    action: KEEP_AS_NON_CORE
    reason: Direct rat cell evidence that RyR inhibition and disruption of mAKAP-PKA anchoring blunt
      hypertrophic signalling; RyR2's role is to supply the Ca2+ signal that feeds calcineurin/NFAT,
      a downstream consequence rather than the core function.
    supported_by:
