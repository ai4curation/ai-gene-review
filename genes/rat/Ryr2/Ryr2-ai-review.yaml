- term:
    id: GO:0042383
    label: sarcolemma
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:99659
  - PANTHER:PTN000346461
  - RGD:1586637
  - RGD:620314
  review:
    summary: RyR2 sits in the SR membrane apposed to the sarcolemma/T-tubule across the dyadic 
      cleft, not in the sarcolemma itself.
    action: MARK_AS_OVER_ANNOTATED
    reason: In cardiomyocytes RyR2 is an integral SR-membrane protein; the dyad places it within ~15
      nm of the sarcolemma, which is how a sarcolemmal annotation arises, but co-localization across
      a junction is not residence in the plasma membrane. Small numbers of RyR2 are integral to the 
      plasma membrane of rat insulinoma/beta cells, which are not muscle cells, so that does not 
      support a sarcolemma term either. Kept as an over-annotation rather than removed, because 
      junctional apposition is real and the row may reflect a curator's reading of dyadic 
      co-staining.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: MGI:MGI:99659
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse Ryr1 sits in the triad junction apposed to the sarcolemma/T-tubule; the 
          junctional relationship does not make the receptor a sarcolemmal protein, and it transfers
          poorly to RyR2's SR location.
      - source_id: RGD:620314
        source_status: CIRCULAR_OR_REDUNDANT
        comment: The rat Ryr2 sarcolemma IDA (PMID:21474431) is itself the row questioned here, so 
          it cannot independently support the IBA.
    supported_by:
    - reference_id: UniProtKB:B0LPN4
      supporting_text: Sarcoplasmic reticulum membrane
    - reference_id: PMID:11053140
      supporting_text: dyads contained only ryanodine receptors, L-type Ca(2+) channels, and 
        calsequestrin
- term:
    id: GO:0042383
    label: sarcolemma
  evidence_type: IDA
  original_reference_id: PMID:21474431
  qualifier: located_in
  review:
    summary: RyR2 sits in the SR membrane apposed to the sarcolemma/T-tubule across the dyadic 
      cleft, not in the sarcolemma itself.
    action: MARK_AS_OVER_ANNOTATED
    reason: "In cardiomyocytes RyR2 is an integral SR-membrane protein; the dyad places it within ~15
      nm of the sarcolemma, which is how a sarcolemmal annotation arises, but co-localization across a
      junction is not residence in the plasma membrane. Small numbers of RyR2 are integral to the plasma
      membrane of rat insulinoma/beta cells, which are not muscle cells, so that does not support a sarcolemma
      term either. Kept as an over-annotation rather than removed, because junctional apposition is real
      and the row may reflect a curator's reading of dyadic co-staining. The cited paper is a study of
      critical illness myopathy in rat skeletal muscle: its RyR2 data are Western-blot and immunostaining
      levels, and its conclusions concern RYR1 and CaV1.1; the full text (available in the cache) contains
      no demonstration of RyR2 in the sarcolemma."
    source_defects:
    - defect_type: WRONG_TERM
      requested_change: CHECK
      asserted_value: GO:0042383
      corrected_value: GO:0033017
      corrected_label: sarcoplasmic reticulum membrane
      confidence: SUSPECTED
      resource: RGD
      explanation: RGD IDA from PMID:21474431 to GO:0042383 sarcolemma for rat Ryr2. The paper 
        reports increased RYR1/RYR2 and CaV1.1 levels in critical illness myopathy skeletal muscle; 
        the RyR2 data are expression levels and the increase is attributed to the skeletal RYR1 
        isoform. The cached full text shows no sarcolemmal localization experiment for RyR2, so the 
        compartment assignment should be rechecked against the figure the curator used.
      supported_by:
      - reference_id: PMID:21474431
        supporting_text: the majority of the increase was due to increased expression of the 
          skeletal muscle-specific RYR1 isoform
    supported_by:
    - reference_id: UniProtKB:B0LPN4
      supporting_text: Sarcoplasmic reticulum membrane
    - reference_id: PMID:11053140
      supporting_text: dyads contained only ryanodine receptors, L-type Ca(2+) channels, and 
        calsequestrin
