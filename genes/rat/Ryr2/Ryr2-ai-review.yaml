suggested_questions:
- question: GO places GO:1990425 ryanodine receptor complex as a subclass of GO:0005891 
    voltage-gated calcium channel complex, which makes every RyR2 annotation entail a voltage-gated 
    complex although RyR2 is gated by cytosolic Ca2+, not membrane potential. Should GO:1990425 be 
    re-parented under GO:0034704 calcium channel complex (or an intracellularly-gated sibling) 
    instead?
- question: Rat Ryr2 carries GO:0031234 extrinsic component of cytoplasmic side of plasma membrane 
    (ARBA IEA and an IDA from PMID:20177054), yet UniProt types the protein as multi-pass in the SR 
    membrane. Should both rows be withdrawn, and should the ARBA rule behind ARBA:ARBA00028967 be 
    re-examined for the whole RyR family?
- question: Is the GO:0042383 sarcolemma IDA from PMID:21474431 based on an RyR2 figure we could not
    find in the full text, or does it reflect the dyadic apposition of junctional SR to the 
    T-tubule? If the latter, is a sarcolemma annotation ever appropriate for an SR channel?
- question: Should the small plasma-membrane RyR2 population of pancreatic beta cells 
    (PMID:19116207) be annotated with a plasma membrane location and a cell-surface Ca2+ entry 
    process, or treated as an experimental-system property of insulinoma lines?
- question: Is the islet-type RyR2 splice variant (exons 4 and 75, PMID:20471962, isoform B0LPN4-2) 
    functionally distinct enough in its cADPR response to warrant isoform-specific annotation of 
    that cADPR sensitivity?
suggested_experiments:
- description: Immuno-electron microscopy or expansion microscopy of rat ventricular myocytes with 
    SR-membrane and sarcolemmal markers, quantifying the fraction of RyR2 label in junctional SR, 
    extradyadic (A-band) SR, perinuclear SR and the nuclear envelope.
  experiment_type: quantitative super-resolution immunolocalization
  hypothesis: All RyR2 label is in SR or nuclear-envelope membrane, with none integral to the 
    sarcolemma, which would settle the GO:0042383 and GO:0031234 rows.
- description: Patch-clamp plus surface biotinylation of primary rat beta cells (not insulinoma 
    lines) with RyR2 knockdown, testing whether ryanodine- and 4CmC-activated plasma-membrane 
    currents survive in native islet cells.
  experiment_type: electrophysiology with surface labelling and knockdown
  hypothesis: A small, genuinely cell-surface RyR2 population conducts divalent cations in primary 
    beta cells, justifying a plasma membrane annotation separate from the SR/ER release function.
- description: Compare the islet-type (exon 4/75 skipped) and authentic RyR2 variants side by side 
    in single-channel bilayer recordings with cADPR, luminal Ca2+ and FKBP12.6, using rat 
    constructs.
  experiment_type: single-channel reconstitution of defined splice variants
  hypothesis: cADPR sensitivity is conferred by the islet-type splice, making it an isoform-specific
    molecular function rather than a property of the gene product in general.
