  review:
    summary: RyR2 is the ryanodine-sensitive, Ca2+-activated Ca2+ release channel of the 
      sarcoplasmic reticulum; this is its core molecular function.
    action: ACCEPT
    reason: "Direct rat evidence: single-channel recordings of RyR2 in planar bilayers show Ca2+-dependent
      gating and ryanodine sensitivity, and [3H]ryanodine binding to rat cardiac SR vesicles is Ca2+-dependent.
      UniProt's curated FUNCTION describes the same activity. This is the core function and is retained
      on every row that asserts it."
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities: &id006
      - source_id: PANTHER:PTN000346461
        source_status: SUPPORTS_TRANSFER
        comment: Ancestral ryanodine receptor node; rat Ryr2 (RGD:620314) appears among the 
          descendant evidences, which marks experimental grounding on the target itself.
    supported_by:
    - reference_id: UniProtKB:B0LPN4
      supporting_text: Cytosolic calcium-activated calcium channel that mediates the release of 
        Ca(2+) from the sarcoplasmic reticulum into the cytosol and thereby plays a key role in 
        triggering cardiac muscle contraction
