  - UniProtKB:Q92736
  review:
    summary: RyR2 performs the step that releases sequestered Ca2+ from the SR lumen into the 
      cytosol.
    action: ACCEPT
    reason: 'The channel itself conducts the released Ca2+, so RyR2 executes this process rather than
      merely being required for it. Rat evidence: Ca2+-activated single-channel activity of SR/ER-derived
      RyR2, Ca2+ sparks and waves whose frequency tracks RyR2 oxidation state, and antisense knockdown
      abolishing RyR2-dependent Ca2+ oscillations. Core.'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities: *id006
