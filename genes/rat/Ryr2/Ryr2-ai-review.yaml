- term:
    id: GO:0030018
    label: Z disc
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:99685
  - PANTHER:PTN000346461
  - RGD:620314
  - UniProtKB:Q92736
  review:
    summary: RyR2 clusters at the Z-line level of the sarcomere, where junctional SR abuts the 
      T-tubules.
    action: KEEP_AS_NON_CORE
    reason: Multiple independent rat immunofluorescence studies place RyR2 puncta at Z-lines/dyads, 
      and FKBP12.6 co-concentrates there with Ca2+ spark initiation sites. The Z disc is a landmark 
      for the junctional SR rather than the compartment in which the channel sits, so it is kept as 
      a non-core location.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities: *id006
    supported_by:
    - reference_id: PMID:11053140
      supporting_text: dyads contained only ryanodine receptors, L-type Ca(2+) channels, and 
        calsequestrin
    - reference_id: PMID:20431056
      supporting_text: Both FKBP12.6 and FKBP12 concentrate at Z-lines, consistent with RyR2 and Ca 
        spark initiation sites
    - reference_id: PMID:15010472
      supporting_text: the NR2B antigen was localized at the sarcomeric Z-bands
