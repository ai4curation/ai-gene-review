  review:
    summary: RyR2-dependent Ca2+ release is required during embryonic heart tube morphogenesis.
    action: KEEP_AS_NON_CORE
    reason: Rests on the mouse Ryr2-null phenotype (embryonic lethality with cardiac defects), which
      UniProt records as 'Required for embryonic heart development'. The requirement is for the Ca2+
      release function in embryonic cardiomyocytes rather than a distinct morphogenetic activity, so
      it is kept as a non-core developmental context.
