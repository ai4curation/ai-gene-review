- term:
    id: GO:0051481
    label: negative regulation of cytosolic calcium ion concentration
  evidence_type: IDA
  original_reference_id: PMID:18799678
  qualifier: involved_in
  review:
    summary: 'The direction is inverted: RyR2 opening releases Ca2+ into the cytosol and raises cytosolic
      Ca2+.'
    action: MODIFY
    reason: The cited rat study shows ischemia/S-glutathionylation shifting RyR2 toward 
      high-activity channels that sustain Ca2+-induced Ca2+ release, i.e. more cytosolic Ca2+, and 
      UniProt describes release into the cytosol. The negative-regulation term states the opposite 
      sign, so this is a sign correction (a sanctioned lateral MODIFY) to the positive term; the 
      inversion is also recorded as a source defect.
    proposed_replacement_terms:
    - id: GO:0007204
      label: positive regulation of cytosolic calcium ion concentration
    source_defects:
    - defect_type: WRONG_TERM
      requested_change: REPOINT
      asserted_value: GO:0051481
      corrected_value: GO:0007204
      corrected_label: positive regulation of cytosolic calcium ion concentration
      confidence: PROBABLE
      resource: RGD
      explanation: RGD IDA from PMID:18799678 to GO:0051481 negative regulation of cytosolic calcium
        ion concentration for rat Ryr2. The paper reports that ischemia increases RyR2 
        S-glutathionylation and the frequency of high-activity channels, allowing RyR2 to sustain 
        Ca2+-induced Ca2+ release, which raises cytosolic Ca2+. The sign of the regulation term 
        appears inverted; GO:0007204 fits the reported direction.
      supported_by:
      - reference_id: PMID:18799678
        supporting_text: ischemia, by enhancing RyR2 S-glutathionylation, allows RyR2 to sustain 
          CICR
    supported_by:
    - reference_id: PMID:18799678
      supporting_text: ischemia, by enhancing RyR2 S-glutathionylation, allows RyR2 to sustain CICR
    - reference_id: UniProtKB:B0LPN4
      supporting_text: Cytosolic calcium-activated calcium channel that mediates the release of 
        Ca(2+) from the sarcoplasmic reticulum into the cytosol and thereby plays a key role in 
        triggering cardiac muscle contraction
