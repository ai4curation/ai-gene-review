        Ca(2+) from the sarcoplasmic reticulum into the cytosol and thereby plays a key role in 
        triggering cardiac muscle contraction
    - reference_id: PMID:21807619
      supporting_text: the CG digitoxin (DGT) increased the incidence of arrhythmogenic spontaneous 
        Ca(2+) waves, decreased the sarcoplasmic reticulum (SR) Ca(2+) load, and increased both ROS 
        and RyR2 thiol oxidation
    - reference_id: PMID:15870112
      supporting_text: an antisense strategy revealed that the ryanodine receptor subtype 2 alone 
        was required to initiate the Ca2+ oscillations induced by acetylcholine
