      supporting_text: the CG digitoxin (DGT) increased the incidence of arrhythmogenic spontaneous 
        Ca(2+) waves, decreased the sarcoplasmic reticulum (SR) Ca(2+) load, and increased both ROS 
        and RyR2 thiol oxidation
    - reference_id: PMID:20431056
      supporting_text: Both FKBP12.6 and FKBP12 concentrate at Z-lines, consistent with RyR2 and Ca 
        spark initiation sites
