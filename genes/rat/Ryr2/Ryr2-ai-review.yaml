- term:
    id: GO:0014701
    label: junctional sarcoplasmic reticulum membrane
  evidence_type: IC
  original_reference_id: PMID:11053140
  qualifier: located_in
  review:
    summary: In cardiomyocytes the RyR2 pool that performs excitation-contraction coupling is in the
      junctional SR membrane facing the T-tubule across the dyadic cleft.
    action: NEW
    reason: "Added as a sub-compartment beside the accepted GO:0033017 row rather than replacing it. GO:0014701
      is_a GO:0033017 (checked with OAK). Two independent lines agree: deconvolved immunofluorescence
      of rat ventricular myocytes shows dyads containing RyR together with the L-type channel and calsequestrin
      and nothing else, and Ca2+ spark mapping assigns the large majority of functional RyR2 clusters
      to the junctional (Z-line) SR, with only ~20% elsewhere. This is an inference the reviewer draws
      from those two assays, hence IC."
    supported_by:
    - reference_id: PMID:11053140
      supporting_text: dyads contained only ryanodine receptors, L-type Ca(2+) channels, and 
        calsequestrin
    - reference_id: PMID:17627991
      supporting_text: about 20% of Ca2+ sparks were not colocalized with the zone of the junctional
        or corbular SR (Z-line zone)
    - reference_id: UniProtKB:B0LPN4
      supporting_text: In cardiac myocytes, calcium release is triggered by increased Ca(2+) 
        cytosolic levels due to activation of the L-type calcium channel CACNA1C.
