core_functions:
- description: 'Ca2+-activated (ryanodine-sensitive) Ca2+ release channel: as a homotetramer in the junctional
    sarcoplasmic reticulum membrane of cardiomyocytes, RyR2 opens in response to the local cytosolic Ca2+
    rise produced by CACNA1C, conducting Ca2+ from the SR lumen into the cytosol and thereby producing
    the Ca2+ transient that triggers and grades each cardiac contraction.'
