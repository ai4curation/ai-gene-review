id: B0LPN4
gene_symbol: Ryr2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: 'Ryr2 encodes the cardiac ryanodine receptor, the Ca2+-activated Ca2+ release channel of
  the sarcoplasmic reticulum (SR). Four identical ~5000-residue subunits assemble into a homotetramer
  (heterotetramers with RYR3 also occur) whose transmembrane pore lies in the C-terminal region, while
  the bulk of each subunit forms a large cytoplasmic cap that carries the Ca2+-sensing, nucleotide, calmodulin,
  FKBP12.6 and phosphorylation sites. In cardiomyocytes RyR2 sits in junctional SR membrane at the dyads,
  where Ca2+ entering through the L-type channel CACNA1C triggers Ca2+-induced Ca2+ release; the resulting
  Ca2+ transient activates the contractile apparatus, so RyR2 is the release step of cardiac excitation-contraction
  coupling and a determinant of contractile force, pacemaker rate and action-potential shape. Smaller
  RyR2 pools occur in extradyadic SR at the middle of the sarcomere, around perinuclear mitochondria and
  in the nuclear envelope, where the channel is scaffolded with PKA, PP2A and PDE4D3 by AKAP6/mAKAP. Channel
  gating is tuned by cytosolic and luminal Ca2+, Mg2+, ATP, caffeine, calmodulin, FKBP12.6 binding, PKA
  phosphorylation and thiol oxidation/S-glutathionylation, and excessive opening produces diastolic Ca2+
  leak and arrhythmia. RyR2 is not restricted to heart: it also releases Ca2+ from smooth ER in smooth
  muscle (where it supports cADPR- and TRPV4-coupled Ca2+ oscillations and waves), in brain neurons, and
  in pancreatic islet cells, where an alternatively spliced islet-type variant is cADPR-responsive and
  a small number of channels reach the plasma membrane and mediate divalent cation entry.'
