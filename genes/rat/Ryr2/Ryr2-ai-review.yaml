- term:
    id: GO:0051480
    label: regulation of cytosolic calcium ion concentration
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027370
  review:
    summary: By gating Ca2+ release, RyR2 sets and shapes the cytosolic Ca2+ concentration.
    action: ACCEPT
    reason: 'RyR2 opening is the step that raises cytosolic Ca2+ in both muscle and non-muscle cells,
      and its closure/leak state sets resting cytosolic Ca2+: antisense knockdown removes the oscillations
      in duodenal myocytes and RyR2 oxidation changes diastolic leak in ventricular myocytes. Accepted
      as a core regulatory process of the channel rather than a downstream consequence.'
    supported_by:
    - reference_id: PMID:15870112
      supporting_text: an antisense strategy revealed that the ryanodine receptor subtype 2 alone 
        was required to initiate the Ca2+ oscillations induced by acetylcholine
    - reference_id: PMID:21807619
      supporting_text: the CG digitoxin (DGT) increased the incidence of arrhythmogenic spontaneous 
        Ca(2+) waves, decreased the sarcoplasmic reticulum (SR) Ca(2+) load, and increased both ROS 
        and RyR2 thiol oxidation
