- term:
    id: GO:0019722
    label: calcium-mediated signaling
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:E9Q401
  - ensembl:ENSMUSP00000021750
  - UniProtKB:Q92736
  - ensembl:ENSP00000355533
  review:
    summary: RyR2-dependent Ca2+ release is the signal in agonist-evoked Ca2+ oscillations and 
      waves, e.g. the M2 muscarinic/cADPR pathway of rat duodenal myocytes.
    action: ACCEPT
    reason: 'The channel itself produces the Ca2+ signal: antisense knockdown of RyR2 (and not RyR1 or
      RyR3) abolishes the ACh/M2/cADPR-triggered Ca2+ oscillations of rat duodenal myocytes, so RyR2 performs
      the release step of this signalling pathway rather than merely being required downstream. Accepted
      as the core process of the non-cardiac function.'
    supported_by:
    - reference_id: PMID:15870112
      supporting_text: an antisense strategy revealed that the ryanodine receptor subtype 2 alone 
        was required to initiate the Ca2+ oscillations induced by acetylcholine
