id: P14942
gene_symbol: Gsta4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Gsta4 encodes rat glutathione S-transferase alpha-4 (GSTA4-4), an alpha-class
  cytosolic GST that conjugates reduced glutathione to hydrophobic electrophiles.
  Among the alpha-class paralogs (Gsta1/2/3/4), Gsta4 is functionally distinguished
  by its high catalytic efficiency toward lipid peroxidation-derived alpha,beta-unsaturated
  aldehydes, especially 4-hydroxynonenal (4-HNE), which it detoxifies by GSH conjugation
  (Michael addition). The enzyme is a homodimer found mainly in the cytosol, with
  a stress-inducible mitochondrial pool that protects mitochondria from reactive lipid
  aldehydes. Its expression in rat brain, liver and other tissues is induced by
  toxicants and oxidative stress (e.g. nicotine, NNK, paraquat/zinc, lithium). Much
  of the detailed kinetic and loss-of-function evidence for GSTA4-4 comes from the
  human enzyme and mouse Gsta4-null models.
