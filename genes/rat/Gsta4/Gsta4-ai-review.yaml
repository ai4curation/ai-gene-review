suggested_questions:
- question: Falcon deep research highlights Scian et al. 2023 (Biomolecules, DOI:10.3390/biom13020329)
    showing GSTA4-4 catalyzes the retro-Michael reaction (GS-alkenal -> GSH + alkenal)
    with low commitment to forward catalysis, supporting a homeostatic/regulatory
    role in setting steady-state lipid alkenal pools rather than purely unidirectional
    detoxification. Does this reversibility/set-point framing warrant a new or modified
    BP annotation (e.g., capturing alkenal homeostasis or regulation of reactive lipid
    signaling) beyond the current detoxification/xenobiotic-metabolism terms?
  experts:
  - William M. Atkins
