core_functions:
- description: 'Gsta4 encodes rat glutathione S-transferase alpha-4 (GSTA4-4). FUNCTION:
    Conjugation of reduced glutathione to a wide number of exogenous and endogenous
    hydrophobic electrophiles, with characteristic high catalytic efficiency toward
    lipid peroxidation-derived alpha,beta-unsaturated aldehydes, especially 4-hydroxynonenal
    (4-HNE), which it clears by GSH conjugation (Michael addition).'
  supported_by:
  - reference_id: UniProtKB:P14942
    supporting_text: 'FUNCTION: Conjugation of reduced glutathione to a wide number
      of exogenous and endogenous hydrophobic electrophiles.'
  - reference_id: file:rat/Gsta4/Gsta4-deep-research-falcon.md
    supporting_text: GSTA4-4 is repeatedly characterized as unusually efficient for
      **lipid-derived α,β-unsaturated aldehydes**, especially **4-HNE**
    reference_section_type: OTHER
  molecular_function:
    id: GO:0004364
    label: glutathione transferase activity
  directly_involved_in:
