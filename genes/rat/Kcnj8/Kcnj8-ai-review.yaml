core_functions:
- description: 'Pore-forming subunit of the vascular-type KATP channel: four Kir6.1 subunits with four
    SUR2B (or SUR1) subunits form a nucleotide-regulated, glibenclamide-sensitive inward-rectifier K+
    channel at the plasma membrane that conducts K+ and couples metabolic state to membrane potential.'
  molecular_function:
    id: GO:0015272
    label: ATP-activated inward rectifier potassium channel activity
  directly_involved_in:
  - id: GO:0071805
    label: potassium ion transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0008282
    label: inward rectifying potassium channel
  supported_by:
  - reference_id: PMID:7890693
    supporting_text: indicating that uKATP-1 is an ATP-sensitive inward rectifier K+ channel
  - reference_id: PMID:34711681
    supporting_text: Vascular tone is dependent on smooth muscle KATP channels comprising 
      pore-forming Kir6.1 and regulatory SUR2B subunits
  - reference_id: PMID:9130167
    supporting_text: the K+ channel composed of SUR2B and Kir6.1 is not a classical ATP-sensitive K+
      channel but closely resembles the nucleotide diphosphate-dependent K+ channel in vascular 
      smooth muscle cells
  - reference_id: PMID:11956191
    supporting_text: We show direct binding of TNP-ATP to the COOH termini of all three known K(ATP)
      channels
- description: In vascular smooth muscle (notably coronary arteries) Kir6.1/SUR2B channel opening 
    hyperpolarizes the cell and promotes vasodilation, setting vascular tone; loss of Kir6.1 
    abolishes opener-induced VSMC K+ current and vasodilation.
  molecular_function:
    id: GO:0015272
    label: ATP-activated inward rectifier potassium channel activity
  directly_involved_in:
  - id: GO:0042311
    label: vasodilation
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0008282
    label: inward rectifying potassium channel
  supported_by:
  - reference_id: PMID:11984590
    supporting_text: The K(+) channel opener pinacidil did not induce K(+) currents in vascular 
      smooth-muscle cells of Kir6.1-null mice, and there was no vasodilation response to pinacidil
  - reference_id: PMID:11984590
    supporting_text: The Kir6.1-containing K(+) channel is critical in the regulation of vascular 
      tonus, especially in the coronary arteries
suggested_questions:
- question: How much of the native KATP current in rat ventricular myocytes and renal pericytes is 
    carried by Kir6.1 homomeric versus Kir6.1/Kir6.2 heteromeric pores, and does this matter for 
    ventricular repolarization under metabolic stress?
- question: Should RGD re-assign the GO:0017098 sulfonylurea receptor binding IPI from PMID:20123112
    to Kcnj11, given that the co-IP in that paper used anti-Kir6.2?
- question: Does the phospho-dependent Kir6.1-Cx43 interaction alter channel trafficking or gating 
    during ischemic preconditioning?
suggested_experiments:
- description: Smooth-muscle-specific conditional Kcnj8 deletion in rat, with patch clamp of 
    coronary and renal microvascular smooth muscle and pericytes, to separate Kir6.1-dependent 
    vascular tone from cardiomyocyte and neuronal effects.
- description: Single-channel recordings of native rat ventricular KATP channels after Kir6.1 versus
    Kir6.2 knockdown to assign the 21 pS and 57 pS channel types to defined pore compositions.
