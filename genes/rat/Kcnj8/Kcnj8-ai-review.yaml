- term:
    id: GO:0019829
    label: ATPase-coupled monoatomic cation transmembrane transporter activity
  evidence_type: IGI
  original_reference_id: PMID:28842488
  qualifier: enables
  supporting_entities:
  - UniProtKB:A0A1S4NYG1
  - UniProtKB:A0A1U7R319
  review:
    summary: ATPase-coupled monoatomic cation transmembrane transporter activity.
    action: MODIFY
    reason: Mis-typed activity. Kir6.1 is a passive K+ channel pore subunit; it does not couple ATP 
      hydrolysis to cation transport (ATP regulates gating; hydrolysis occurs on SUR NBDs). 
      PMID:28842488 characterized Kir6.1 slide-helix mutants coexpressed with SUR2 by ion flux and 
      patch clamp, which supports channel activity. Replace with GO:0015272.
    proposed_replacement_terms:
    - id: GO:0015272
      label: ATP-activated inward rectifier potassium channel activity
    supported_by:
    - reference_id: PMID:28842488
      supporting_text: methionine substitution, but not leucine substitution, results in increased 
        open state stability and hence significantly reduced ATP sensitivity
