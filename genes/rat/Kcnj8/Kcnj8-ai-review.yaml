  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:1100508
  review:
    summary: reactive gliosis transferred from mouse Kcnj8 knockout/phenotype data.
    action: MARK_AS_OVER_ANNOTATED
    reason: This ISO row is transferred by RGD from a mouse Kcnj8 (MGI:1100508) knockout or 
      pharmacological phenotype annotated with acts_upstream_of_or_within. There is no evidence that
      Kir6.1 performs any step of this process; the annotation reflects an indirect phenotype of 
      losing a K+ channel (for calcium transport, the channel hyperpolarizes the membrane and so 
      only indirectly reduces Ca2+ entry through other channels). Kir6.1 is a K+ channel pore 
      subunit; this process is at most a downstream consequence of altered vascular tone or membrane
      potential in knockout animals, and the channel does not itself execute a step of it.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
