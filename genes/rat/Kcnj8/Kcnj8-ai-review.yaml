- term:
    id: GO:0015272
    label: ATP-activated inward rectifier potassium channel activity
  evidence_type: IDA
  original_reference_id: PMID:17097686
  qualifier: enables
  review:
    summary: ATP-activated (KATP-type) inward rectifier potassium channel activity.
    action: ACCEPT
    reason: Core molecular function. Rat Kir6.1 expressed in oocytes/HEK293 forms a weakly 
      inward-rectifying, Ba2+-blocked K+ channel closed by 1 mM ATP and opened by diazoxide 
      (PMID:7890693); native rat ventricular myocytes carry Kir6.1-type KATP channels 
      (PMID:17097686). With SUR2B it forms the nucleotide-diphosphate-activated vascular KATP 
      channel (PMID:9130167, PMID:34711681).
    supported_by:
    - reference_id: PMID:7890693
      supporting_text: uKATP-1 closes in response to 1 mM ATP and has a single channel conductance 
        of 70 +/- 2 picosiemens
    - reference_id: PMID:7890693
      supporting_text: indicating that uKATP-1 is an ATP-sensitive inward rectifier K+ channel
    - reference_id: PMID:34711681
      supporting_text: Vascular tone is dependent on smooth muscle KATP channels comprising 
        pore-forming Kir6.1 and regulatory SUR2B subunits
    - reference_id: PMID:9130167
      supporting_text: the K+ channel composed of SUR2B and Kir6.1 is not a classical ATP-sensitive 
        K+ channel but closely resembles the nucleotide diphosphate-dependent K+ channel in vascular
        smooth muscle cells
