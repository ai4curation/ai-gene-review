  review:
    summary: Inward rectifier potassium channel activity.
    action: MODIFY
    reason: 'Correct but less specific than supported: Kir6.1 is a nucleotide-regulated (KATP-type) inward
      rectifier, annotated elsewhere in this review to GO:0015272 ATP-activated inward rectifier potassium
      channel activity (IDA, PMID:7890693, PMID:17097686), a descendant of this term. The contributes_to
      qualifier on the IBA/ISO rows is appropriate since the functional channel is a Kir6.1 tetramer with
      SUR subunits.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000205946
        source_status: SUPPORTS_TRANSFER
        comment: Family-level inward rectifier channel activity is correctly inherited by Kir6.1; 
          the KATP-specific child term GO:0015272 is better supported for this gene.
    proposed_replacement_terms:
    - id: GO:0015272
      label: ATP-activated inward rectifier potassium channel activity
    supported_by:
    - reference_id: PMID:7890693
      supporting_text: indicating that uKATP-1 is an ATP-sensitive inward rectifier K+ channel
    - reference_id: file:rat/Kcnj8/Kcnj8-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the inward rectifier-type potassium channel (TC 1.A.2.1) family. 
        KCNJ8 subfamily.
