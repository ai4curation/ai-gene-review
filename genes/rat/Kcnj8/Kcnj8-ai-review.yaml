    action: MARK_AS_OVER_ANNOTATED
    reason: This ISO row is transferred by RGD from a mouse Kcnj8 (MGI:1100508) knockout or 
      pharmacological phenotype annotated with acts_upstream_of_or_within. Kir6.1 knockout mice 
      develop grossly normally and their dominant phenotype is coronary vasospasm and sudden death. 
