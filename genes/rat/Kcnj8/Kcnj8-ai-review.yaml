id: Q63664
gene_symbol: Kcnj8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Kcnj8 encodes Kir6.1, an inward rectifier potassium channel subunit (KCNJ8 subfamily) 
  that forms the K+-selective pore of ATP-sensitive potassium (KATP) channels. Four Kir6.1 subunits 
  assemble with four sulfonylurea receptor subunits (ABCC9/SUR2B in vascular smooth muscle, also 
  SUR1 in some neurons) to give a hetero-octameric channel at the plasma membrane. Unlike 
  Kir6.2-based KATP channels, Kir6.1/SUR2B channels show little spontaneous activity and are 
  activated by intracellular Mg-nucleotides (nucleotide diphosphates) and by KATP openers such as 
  pinacidil, and are blocked by glibenclamide; ATP binding to the Kir6.1 cytoplasmic domains 
  contributes to nucleotide gating. By coupling cellular metabolic state to membrane potential, 
  Kir6.1-containing channels hyperpolarize vascular smooth muscle and pericytes and thereby promote 
  vasodilation and set vascular tone, particularly in coronary arteries; loss in mice causes 
  coronary vasospasm and sudden death, and gain-of-function variants cause Cantu syndrome in humans.
  Kir6.1 is widely expressed, including in cardiomyocyte sarcolemma, kidney epithelia and 
  hippocampal presynaptic terminals, where Kir6.1/SUR1 channels restrain glutamate release.
