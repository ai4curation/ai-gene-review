          left this a blanket assertion: six descendant nodes (PTN000153528, PTN000153549,
          PTN000153564, PTN001350298, PTN002605957, PTN008968103) carry negated IKR
          records that prune the activity from branches judged to have lost the key
          catalytic residues. Rat Rnase1 lies outside all six pruned branches and
          retains the intact His-Lys-His catalytic set, so the transfer to this target
          is precisely what the node placement asserts.'
