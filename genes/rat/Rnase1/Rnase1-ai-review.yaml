    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: 'The extracellular region is the primary functional compartment for Rnase1:
      as a signal-peptide-bearing secreted

      ptRNase it is routed through the secretory pathway and carries out its physiological
      RNA-degrading activity

      extracellularly, where it is not constrained by the cytosolic ribonuclease inhibitor.
