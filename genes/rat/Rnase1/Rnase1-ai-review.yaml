id: P00684
gene_symbol: Rnase1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Rnase1 encodes rat pancreatic ribonuclease (RNase 1), the rat member
  of the pancreatic-type, RNase A family of vertebrate secreted endoribonucleases.
  It carries a signal peptide, is secreted (abundantly by the pancreas), and cleaves
  RNA on the 3' side of pyrimidine nucleotides through a His-Lys-His catalytic triad
  via a 2',3'-cyclic phosphodiester intermediate, acting on single- and double-stranded
  RNA. Its physiological activity is extracellular, where it is not inhibited by
  the cytosolic ribonuclease inhibitor; in the gut it digests dietary RNA, and in
  the circulation and vasculature it degrades extracellular RNA released from damaged
  cells, which otherwise acts as a pro-inflammatory, pro-coagulant danger signal.
  Intracellularly, RNase A-family proteins bearing a KFERQ-like motif are classic
  substrates of chaperone-mediated autophagy.
