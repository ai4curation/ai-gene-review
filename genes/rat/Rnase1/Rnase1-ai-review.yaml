        comment: 'In the current PTHR11437 PAINT slice the GO:0004540 IBD sits at
          this un-taxon-scoped family node, seeded by twenty experimentally annotated
          members spanning the whole RNase A family - human RNASE1 (P07998), bovine
          seminal ribonuclease (P00669), angiogenin (P03950), the host-defence ribonucleases
