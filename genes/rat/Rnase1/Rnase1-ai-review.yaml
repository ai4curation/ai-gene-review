- term:
    id: GO:0043202
    label: lysosomal lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-RNO-9625160
  review:
    summary: Reactome places Rnase1 in the lysosomal lumen as the unfolded substrate
      of chaperone-mediated autophagy, delivered there for degradation; kept as non-core
      context because it describes the protein's catabolic fate rather than its site
      of action.
    action: KEEP_AS_NON_CORE
    reason: The rat Reactome chaperone-mediated autophagy events (inferred from the
      RNase A model-substrate studies) translocate Hspa8-bound substrate across the
      lysosomal membrane via Lamp2a, after which it is degraded in the lumen. The
      localization is real for that substrate pool but reflects degradation, not
      the secreted enzyme's extracellular ribonuclease function.
    supported_by:
    - reference_id: Reactome:R-RNO-9625160
      supporting_text: Hspa8 facilitates the transport of the unfolded substrate to
        the lumen where it is then degraded
    - reference_id: Reactome:R-RNO-9615712
      supporting_text: Heat shock cognate 71 kDa protein (Hspa8) acts as the constitutive
        chaperone that binds Ribonuclease pancreatic beta-type (Rnase1) in the cytosol.
  qualifier: located_in
