- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-RNO-9615712
  review:
    summary: Reactome places Rnase1 in the cytosol as a chaperone-mediated autophagy
      (CMA) substrate bound by Hspa8; this records where the protein sits while being
      routed for lysosomal degradation, not where the secreted enzyme acts, so it is
      kept as non-core context.
    action: KEEP_AS_NON_CORE
    reason: The rat Reactome chaperone-mediated autophagy events are inferred from
      the classic RNase A model-substrate work (Chiang et al. 1989), in which Hspa8
      recognises a KFERQ-like motif on cytosolic RNase A and delivers it to Lamp2a
      for lysosomal uptake. The cytosolic pool is therefore the substrate state of
      a degradation pathway; endogenous Rnase1 is a secreted enzyme whose ribonuclease
      activity is exerted extracellularly. Retained as non-core localization context.
    supported_by:
    - reference_id: Reactome:R-RNO-9615712
      supporting_text: Heat shock cognate 71 kDa protein (Hspa8) acts as the constitutive
        chaperone that binds Ribonuclease pancreatic beta-type (Rnase1) in the cytosol.
    - reference_id: UniProtKB:P00684
      supporting_text: 'SUBCELLULAR LOCATION: Secreted.'
  qualifier: located_in
