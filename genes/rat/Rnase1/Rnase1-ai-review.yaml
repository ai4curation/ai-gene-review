- term:
    id: GO:0009617
    label: response to bacterium
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: 'The link between Rnase1 and bacteria is indirect: bacterial extracellular
      vesicles repress endothelial RNASE1

      expression via LPS/TLR4 signaling, and RNase1 degrades extracellular RNA released
      during inflammation, rather

      than acting as a direct effector against bacteria. The broad ''response to bacterium''
      term is contextual and is

      retained as non-core.'
    action: KEEP_AS_NON_CORE
    reason: The donor is mouse Rnase1 (MGI:97919), whose response to bacterium annotation
      is an IEP from an intestinal transcriptomic study of oral Listeria monocytogenes
      infection in gnotobiotic mice (PMID:23012479 per QuickGO); it records a change
      in Rnase1 expression during infection, not a role for the enzyme in an antibacterial
      response. Kept as non-core context, consistent with the broader eRNA-clearance
      and inflammatory biology of RNase 1, but it is not part of the core ribonuclease
      function.
    supported_by:
    - reference_id: PMID:23012479
      supporting_text: A whole genome intestinal transcriptomic analysis revealed
        that each Lactobacillus changes expression of a specific subset of genes during
        infection
      reference_section_type: ABSTRACT
    - reference_id: file:rat/Rnase1/Rnase1-deep-research-falcon.md
      supporting_text: extracellular RNAs (often ribosomal RNA released from damaged
        cells) can act as **damage-associated molecular patterns (DAMPs)** that promote
