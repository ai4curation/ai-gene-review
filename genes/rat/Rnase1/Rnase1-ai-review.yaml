- term:
    id: GO:0050830
    label: defense response to Gram-positive bacterium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'This IBA term propagates a direct antibacterial defense role across
      the RNase A family tree, but the documented

      immune function of RNase1 specifically is degradation of extracellular RNA (eRNA),
      a damage-associated molecular

      pattern that drives sterile inflammation, rather than direct killing of Gram-positive
      bacteria. Direct

      antimicrobial/bactericidal activity is the hallmark of distinct RNase A-family
      members (e.g. RNase3/ECP, RNase7),

      not pancreatic RNase1. The falcon deep research, which surveys RNase1''s immune
      biology in detail, describes its

      role as an eRNA-degrading counter-regulator of inflammation and provides no
      evidence for direct Gram-positive

      bactericidal activity. This term is therefore an over-annotation likely arising
      from family-level IBA transfer.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Direct antibacterial defense is not an established function of pancreatic
      RNase1; its documented immune role is

      degrading extracellular RNA (a DAMP). The Gram-positive defense term appears
      to be a family-level IBA

      over-annotation more appropriate to bactericidal RNase A members (RNase3/RNase7).'
    supported_by:
    - reference_id: file:rat/Rnase1/Rnase1-deep-research-falcon.md
      supporting_text: extracellular RNAs (often ribosomal RNA released from damaged
        cells) can act as **damage-associated molecular patterns (DAMPs)** that promote
        inflammation, endothelial barrier disruption, and coagulation-related signaling.
        RNase1 is positioned as a high-activity extracellular RNase that **degrades
        eRNA**, thereby limiting these downstream pathologies.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008517922
        source_label: PANTHER:PTN008517922
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: 'The current PTHR11437 PAINT slice puts the GO:0050830 IBD at the
          same un-taxon-scoped family node that carries the catalytic GO:0004540 assertion,
          but with a strictly host-defence seed set - human RNASE3/ECP (P12724), RNASE6
          (Q93091), RNASE7 (Q9H1E1), RNASE8 (Q8TDE3), angiogenin (P03950), the chicken
          RNase homolog (P30374), one mouse member and three zebrafish members. No
          pancreatic-type RNase1 seeds it: neither rat Rnase1 (P00684) nor human RNASE1
          (P07998) nor bovine RNase A appears, although all three do seed or descend
          from the catalytic-activity assertion at the same node. The antibacterial
          biology therefore belongs to the vertebrate host-defence branch of the family
          and is placed too deep, sweeping in the digestive branch; rat Rnase1''s
          documented immune role is extracellular-RNA (DAMP) degradation, not bacterial
          killing.'
