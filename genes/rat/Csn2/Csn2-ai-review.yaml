- term:
    id: GO:0140314
    label: calcium ion sequestering activity
  evidence_type: ISS
  original_reference_id: PMID:6283475
  review:
    summary: Rat beta-casein carries the conserved N-terminal cluster of casein-kinase
      phosphorylation sites (a phosphate centre) that, in caseins, binds and sequesters
      amorphous calcium phosphate.
    action: NEW
    reason: The calcium-sensitive caseins share the phosphate-centre mechanism of
      calcium phosphate sequestration, and rat beta-casein retains the conserved
      N-terminal phosphorylation cluster (phosphoserines at 29, 31 and 32 by
      similarity, in the SISSEE motif). Rat Csn1s1 carries the same molecular function
      (via its sequestering annotation). This is a molecular function claim about the
      protein's own binding of calcium phosphate, not a process-participation claim,
      so the substrate caveat does not apply; mouse milk data show beta-casein
      contributes one phosphate centre.
    supported_by:
    - reference_id: PMID:6283475
      supporting_text: One such cluster containing the majority of the potential
        casein phosphorylation sites was located near the amino terminus.
    - reference_id: PMID:21789179
      supporting_text: In mouse milk, 3 of the phosphate centres are in present α-casein
        and only one in β-casein.
    - reference_id: PMID:21789179
      supporting_text: Phosphate centres can sequester amorphous calcium phosphate,
        probably in the Golgi vesicles of mammary secretory cells, to form
        thermodynamically stable complexes of defined chemical composition which are
        then secreted through the apical membrane of the mammary epithelial cells
    - reference_id: PMID:34717964
      supporting_text: "a single β-casein monomer is unfolded, which creates a high structural flexibility, which is supposed to play a major role in preventing the precipitation of calcium phosphate particles."
    - reference_id: PMID:38318529
      supporting_text: "Unlike κ-casein, β- and αS-caseins are highly effective mineral chaperones that prevent ectopic and pathological calcification of the mammary gland."
    - reference_id: file:rat/Csn2/Csn2-deep-research-openscientist.md
      supporting_text: "it uses an acidic N-terminal cluster of phosphoserines to chelate calcium, and co-assembles with the other caseins (αS- and κ-casein) and colloidal calcium phosphate (CCP) to build **casein micelles**"
