suggested_questions:
- question: GO:0140314 calcium ion sequestering activity is an approximation for caseins,
    which sequester nanoclusters of amorphous calcium phosphate (calcium together with
    phosphate) via phosphate centres rather than free calcium ions. Should GO add a
    child term such as "calcium phosphate nanocluster sequestering activity"?
- question: Is the cysteine protease inhibition reported for milk beta-casein and its
    L133-Q151 peptide observable at physiological concentrations in milk, and is the
    corresponding region conserved in rodent beta-caseins?
- question: How much of the calcium phosphate sequestering capacity of rat milk is
    contributed by beta-casein relative to alpha- and gamma-casein?
suggested_experiments:
- description: Test purified rat milk beta-casein and the orthologous rat C-terminal
    peptide for inhibition of papain and cathepsins L and B in solution assays,
    determining Ki values and comparing with milk concentrations.
  experiment_type: enzyme inhibition kinetics
