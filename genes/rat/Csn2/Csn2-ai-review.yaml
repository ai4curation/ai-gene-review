id: P02665
gene_symbol: Csn2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Csn2 encodes rat beta-casein, a calcium-sensitive casein of the mammal-specific
  casein family (part of the secretory calcium-binding phosphoprotein gene cluster).
  It is synthesized as a 231-residue precursor with a highly conserved 15-residue
  signal peptide, is expressed specifically in the lactating mammary epithelium under
  lactogenic hormone control, and is secreted into milk. The mature protein is an
  intrinsically disordered, amphipathic phosphoprotein: a cluster of phosphorylated
  serines near the N-terminus forms a phosphate centre that binds amorphous calcium
  phosphate, while a hydrophobic C-terminal region drives self-association. With the
  other caseins it assembles into casein micelles that carry calcium phosphate and
  protein to the suckling young and influences micelle size and surface properties.
  Mouse beta-casein knockouts lactate and rear young but have smaller casein micelles,
  lower milk protein and reduced pup growth, showing that beta-casein contributes to
  milk protein supply and micelle structure without being essential for lactation.
  In vitro, purified beta-casein and a C-terminal-region peptide inhibit cysteine
  proteases, but a physiological role for this activity has not been shown.
