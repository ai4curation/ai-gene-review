  review:
    summary: Phylogenetic propagation from bovine and human beta-casein, whose
      experimental annotations come from a single reverse-zymography study in which
      milk beta-casein and a synthetic internal peptide inhibited cysteine proteases.
    action: MARK_AS_OVER_ANNOTATED
    reason: The source experiment is real but limited (in vitro reverse zymography with
      purified protein and a synthetic 19-residue peptide), with no inhibition constants
      under physiological conditions, no target protease in milk, and no in vivo
      evidence. Beta-casein is an intrinsically disordered, protease-sensitive protein
      that is readily digested, and the activity has not been tested for rat
      beta-casein. Asserting cysteine-type endopeptidase inhibitor activity as an
      inherited molecular function of the whole beta-casein clade overstates what the
      evidence shows; it is at most a minor, unconfirmed in vitro property and not part
      of the core calcium phosphate sequestering and nutritional role.
