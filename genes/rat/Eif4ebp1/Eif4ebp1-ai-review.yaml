- term:
    id: GO:0002931
    label: response to ischemia
  evidence_type: IEP
  original_reference_id: PMID:20736160
  qualifier: involved_in
  review:
    summary: 'IEP from rat brain (PMID:20736160): 15 min global ischemia dephosphorylates 4E-BP1, increasing
      its association with eIF4E, and reperfusion re-phosphorylates it, releasing eIF4E for eIF4G.'
    action: KEEP_AS_NON_CORE
    reason: Full text read. The paper documents that 4E-BP1 phosphorylation and eIF4E binding change in
      response to ischemia-reperfusion, consistent with 4E-BP1 acting as the effector of stress-induced
      translational repression. This is a context of the core repressor function rather than a separate
      function, so it is kept as non-core.
    supported_by:
    - &id007
      reference_id: PMID:20736160
      supporting_text: In the I15 group, the α form of 4E-BP1 associated with eIF4E was marked.
    - reference_id: PMID:20736160
      supporting_text: R30 induced a significant decrease in 4E-BP1 bound to eIF4E when compared with
        the SHC control or I15 condition, and accordingly, induced a significant increase in eIF4G/eIF4E
        association
    - &id014
      reference_id: PMID:20736160
      supporting_text: Our results demonstrate that Thr69 phosphorylation alone allows binding to eIF4E,
        and subsequent Thr36/Thr45 phosphorylation is sufficient to dissociate 4E-BP1 from eIF4E.
