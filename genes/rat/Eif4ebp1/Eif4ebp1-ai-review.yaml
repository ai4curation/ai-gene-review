    summary: ISO transfer from human EIF4EBP1 of involvement in the G1/S transition of the mitotic cell
      cycle.
    action: MARK_AS_OVER_ANNOTATED
    reason: 4E-BP1 is an eIF4E-sequestering translational repressor. Cell-cycle effects reported for it
