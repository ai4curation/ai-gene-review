core_functions:
- description: Hypophosphorylated 4E-BP1 binds eIF4E and competitively blocks its association with eIF4G,
    preventing eIF4F assembly and repressing cap-dependent translation initiation in the cytosol; mTORC1/MAPK
    phosphorylation releases eIF4E.
  molecular_function:
    id: GO:0030371
    label: translation repressor activity
  directly_involved_in:
  - id: GO:0045947
    label: negative regulation of translational initiation
  - id: GO:1905536
    label: negative regulation of eukaryotic translation initiation factor 4F complex assembly
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id001
  - *id008
  - *id014
  - *id011
suggested_questions:
- question: 'PMID:11865047 translation initiation factor binding (IPI): the WITH entity RGD:732833 resolves
    to human EIF4E. Should RGD annotate the more specific GO:0008190 eukaryotic initiation factor 4E binding,
    which the rest of the gene''s annotations use?'
- question: Should a GO cellular component term exist for the eIF4E-4E-BP heterodimer (cf. PR:000028454),
    so that the generic protein-containing complex IDA from m7GTP pulldowns can be made specific?
- question: Does the nuclear pool of 4E-BP1 have a function distinct from cytosolic eIF4E sequestration
    (for example, retaining eIF4E in the nucleus), and is it regulated in rat tissues?
suggested_experiments:
- description: Express phospho-site mutants (T36A/T45A versus T69A, S64A) of rat 4E-BP1 in primary cortical
    neurons subjected to oxygen-glucose deprivation and reoxygenation, and measure eIF4E-eIF4G association
    and polysome profiles to test the hierarchical phosphorylation model of PMID:20736160 functionally.
