- term:
    id: GO:0002192
    label: IRES-dependent translational initiation of linear mRNA
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:103267
  review:
    summary: ISO transfer from mouse Eif4ebp1 of involvement in IRES-dependent translational initiation
      of linear mRNA.
    action: MARK_AS_OVER_ANNOTATED
    reason: IRES-dependent initiation is carried out by the IRES RNA, IRES trans-acting factors and eIF4G/eIF4A/eIF3,
      not by 4E-BP1. By sequestering eIF4E, 4E-BP1 represses cap-dependent initiation and can thereby
      shift the balance toward cap-independent translation, which is an indirect effect. The direct role
      is captured by negative regulation of translational initiation.
