id: Q62622
gene_symbol: Eif4ebp1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Eif4ebp1 encodes 4E-BP1 (PHAS-I), a small, largely disordered eIF4E-binding protein that
  represses cap-dependent translation initiation. In its hypophosphorylated state it binds the cap-binding
  factor eIF4E through a conserved YXXXXLphi motif shared with eIF4G, competitively preventing eIF4E-eIF4G
  association and assembly of the eIF4F complex in the cytosol. Insulin, growth factors and nutrients
  signal through mTORC1 (docked via a C-terminal TOS motif) and MAP kinase to phosphorylate 4E-BP1 hierarchically
  (Thr36/Thr45, Thr69, then Ser64 in the rat numbering); phosphorylation at Thr36/Thr45 releases eIF4E
  and allows translation initiation. Conversely, energy, oxygen or amino-acid deprivation and ischemia
  dephosphorylate 4E-BP1, sequestering eIF4E and restraining protein synthesis. It is expressed widely,
  most highly in adipose tissue and skeletal muscle, and is found in the cytoplasm, including neuronal
  dendrites and postsynaptic sites, and in the nucleus.
