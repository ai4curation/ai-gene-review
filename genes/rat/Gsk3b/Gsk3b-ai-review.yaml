suggested_questions:
- question: Which of the many tissue-level rat GSK3B annotations (bone, liver, heart, testis) rest on
    GSK3B-selective manipulation rather than lithium or pan-GSK3 inhibitors that also hit GSK3A?
- question: Does PMID:8576078 show any microtubule association of TPKI/GSK-3beta, or should the RGD row
    be repointed to mitochondrion?
- question: In PMID:20007479, does GSK-3beta activity raise or lower NMDA receptor-mediated EPSCs, i.e.
    is the positive-regulation row sign-inverted?
suggested_experiments:
- hypothesis: The mitochondrial pool of GSK3B in rat neurons resides on the outer membrane and regulates
    the permeability transition via VDAC phosphorylation.
  description: Protease-protection and submitochondrial fractionation of rat cerebellar mitochondria with
    ER-marker controls, combined with phospho-VDAC measurement after GSK3B-selective knockdown or analog-sensitive
    GSK3B.
  experiment_type: subcellular fractionation and phosphorylation assay
- hypothesis: GSK3B, not GSK3A, is the kinase for PSD-95 Thr-19 during hippocampal LTD.
  description: Isoform-specific knockdown or knock-in of kinase-dead GSK3B vs GSK3A in rat hippocampal
    slices, measuring PSD-95 pT19, AMPA receptor internalisation and LTD.
  experiment_type: isoform-specific loss-of-function electrophysiology
