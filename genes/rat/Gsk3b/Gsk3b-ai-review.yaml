id: P18266
gene_symbol: Gsk3b
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Glycogen synthase kinase-3 beta (GSK-3beta, also tau protein kinase I) is a constitutively
  active, proline-directed serine/threonine protein kinase that prefers substrates pre-phosphorylated
  (primed) at a site four residues C-terminal to the target. Its activity is switched off by phosphorylation
  of Ser-9 by AKT/PKB, PKA, CaMKII and other kinases downstream of insulin, growth factors, depolarisation
  and mechanical strain, and supported by Tyr-216 phosphorylation. GSK3B inhibits glycogen synthase and
  so restrains glycogen synthesis; in the Axin/APC beta-catenin destruction complex it phosphorylates
  beta-catenin, targeting it for SCF(beta-TrCP) ubiquitination and proteasomal degradation, which keeps
  canonical Wnt signalling off. It also phosphorylates microtubule-associated proteins (tau, CRMP2, APC,
  MACF1), shaping microtubule organisation, axon-dendrite polarity and dendrite growth, and at glutamatergic
  synapses it phosphorylates PSD-95 Thr-19 to enable AMPA receptor removal during NMDA receptor-dependent
  long-term depression. Further substrates include transcription factors (JUN, NFATC1, SNAI1, GLI2/3),
  circadian clock proteins and apoptosis regulators, giving context-dependent pro- or anti-apoptotic effects.
  GSK3B is mainly cytosolic, with nuclear, centrosomal, membrane-associated and mitochondrial pools, and
  is abundant in brain.
