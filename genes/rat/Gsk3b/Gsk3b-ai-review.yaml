- term:
    id: GO:0045886
    label: negative regulation of synaptic assembly at neuromuscular junction
  evidence_type: IMP
  original_reference_id: PMID:25764078
  qualifier: involved_in
  review:
    summary: The rat experiments in this paper were in cultured hippocampal neurons, not at the neuromuscular
      junction.
    action: MODIFY
    reason: PMID:25764078 (full text read) compares the Drosophila larval neuromuscular junction with
      cultured rat hippocampal neurons; all NMJ data are from Drosophila shaggy mutants. In rat hippocampal
      cultures, GSK3 inhibition increased synapse density at 3 weeks but decreased it at 12 days. The
      rat finding is regulation of (CNS) synapse assembly; the NMJ-specific term is wrong for rat. Generalise
      to GO:0051963 regulation of synapse assembly (an ancestor of the NMJ terms).
    proposed_replacement_terms:
    - id: GO:0051963
      label: regulation of synapse assembly
    supported_by:
    - reference_id: PMID:25764078
      supporting_text: a comparative study between the neuromuscular junction of Drosophila larvae and
        cultured hippocampal rat neurons
    - reference_id: PMID:25764078
      supporting_text: the pharmacological inhibition of GSK3β increases synapse density and Synapsin
        expression
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0045886
      corrected_value: GO:0051963
      corrected_label: regulation of synapse assembly
      confidence: PROBABLE
      explanation: Assigned by CACAO. PMID:25764078 studies the neuromuscular junction only in Drosophila;
        the rat data are from cultured hippocampal neurons (CNS synapses), where GSK3 inhibition increased
        (21 DIV) or decreased (12 DIV) synapse density. A rat annotation to regulation of synaptic assembly
        at the neuromuscular junction is not supported; regulation of synapse assembly fits the rat data.
      supported_by:
      - reference_id: PMID:25764078
        supporting_text: a comparative study between the neuromuscular junction of Drosophila larvae and
          cultured hippocampal rat neurons
