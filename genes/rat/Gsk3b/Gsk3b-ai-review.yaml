- term:
    id: GO:0001837
    label: epithelial to mesenchymal transition
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P49841
  review:
    summary: GSK3B restrains EMT (via SNAI1 degradation); the sign-neutral EMT term should be the negative-regulation
      term.
    action: MODIFY
    reason: GSK3B does not execute EMT; it phosphorylates SNAI1, leading to its ubiquitination and degradation,
      which inhibits EMT. The gene already carries GO:0010719 negative regulation of epithelial to mesenchymal
      transition from the same donor. Lateral correction from the process to its negative regulation.
    proposed_replacement_terms:
    - id: GO:0010719
      label: negative regulation of epithelial to mesenchymal transition
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P49841
        source_label: human GSK3B
        source_status: SUPPORTS_TRANSFER
        comment: Donor annotation is sound; the term is less precise than the gene-level evidence supports.
    supported_by:
