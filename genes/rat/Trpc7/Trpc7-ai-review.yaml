suggested_questions:
- question: Is store-operated activation of TRPC7 a physiological gating mode in any native rat cell, or an artefact
    of stable heterologous expression?
- question: Does the Golgi/TGN pool of TRPC7 conduct Ca2+ from the Golgi lumen and contribute to constitutive secretion
    at endogenous expression levels, or is the secretion effect an overexpression phenotype?
- question: Does DAG bind TRPC7 directly at a conserved lipid site (as proposed for TRPC3/TRPC6), which would justify
    a ligand-gated channel term?
suggested_experiments:
- description: Knock down or knock out Trpc7 in GH4C1 pituitary cells and measure OAG- and receptor-evoked currents,
    store-operated entry and constitutive secretion at endogenous expression levels.
- description: Mutate candidate DAG-binding residues in rat TRPC7 (by homology to TRPC3/TRPC6 lipid sites) and test
    OAG activation by patch clamp.
