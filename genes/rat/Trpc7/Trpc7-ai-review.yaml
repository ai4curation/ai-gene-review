gene_symbol: Trpc7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Short transient receptor potential channel 7 (TRPC7), a member of the TRPC3/6/7 subfamily of canonical
  TRP channels. It is a six-transmembrane, pore-forming subunit with N-terminal ankyrin repeats and a C-terminal
  TRP domain that assembles into homo- or heterotetrameric (with TRPC3/TRPC6) Ca2+-permeable nonselective cation
  channels in the plasma membrane. TRPC7 channels show constitutive activity and are opened downstream of Gq/phospholipase
  C-coupled receptors by diacylglycerol, independently of protein kinase C, and are inactivated by the entering
  Ca2+; store-depletion gating has been seen only in some expression systems. A large intracellular pool resides
  in the Golgi and trans-Golgi network, and overexpression enhances constitutive secretion. In rat, TRPC7 is expressed
  in brain (including aminergic neurons) and in pituitary cells; orthologs are expressed in heart, lung, eye and
  keratinocytes, where TRPC7 mediates receptor-operated Ca2+ entry.
