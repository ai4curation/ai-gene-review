- term:
    id: GO:0004321
    label: fatty-acyl-CoA synthase activity
  evidence_type: IDA
  original_reference_id: PMID:12709059
  qualifier: enables
  review:
    summary: >-
      Wrong reaction. The paper reports acyl-CoA synthetase (fatty acid
      activation, ligase) activity of recombinant O-MACS, which RGD appears to
      have mapped to the similarly named fatty-acyl-CoA synthase term, the fatty
      acid synthase reaction (EC 2.3.1.86).
    action: REMOVE
    reason: >-
      The abstract states that recombinant O-MACS "demonstrated an acyl-CoA
      synthetase activity for fatty acid activation". UniProt, citing the same
      paper as experimental evidence (ECO:0000269), records the activity as the
      ATP-dependent ligation of medium-chain fatty acids to CoA (EC 6.2.1.2) with
      a C6-C12 preference. GO:0004321 instead describes de novo fatty acid
      synthesis from acetyl-CoA and malonyl-CoA, which requires fatty acid
      synthase domains Acsm4 lacks. The term is not a broader version of the
      ligase activity, so MODIFY does not apply; the experimentally supported
      activity is already present on this gene as GO:0031956 and GO:0102391 rows
      from the same paper. Only the abstract was read, but the reaction measured
      (fatty acid activation) is unambiguous and the protein's domain
      architecture excludes the synthase reaction. This row is the sole seed of
      the PAINT IBD that spreads GO:0004321 across PTHR43605.
    supported_by:
    - reference_id: PMID:12709059
      supporting_text: Recombinant O-MACS protein tagged with c-Myc and His6
        demonstrated an acyl-CoA synthetase activity for fatty acid activation
    - reference_id: file:rat/Acsm4/Acsm4-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Catalyzes the activation of fatty acids by CoA to produce an
        acyl-CoA, the first step in fatty acid metabolism (PubMed:12709059).'
    - reference_id: file:rat/Acsm4/Acsm4-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: DR   Pfam; PF00501; AMP-binding; 1.
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0004321
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The IDA annotation of rat Acsm4 (O-MACS, RGD:727928) to GO:0004321
        fatty-acyl-CoA synthase activity from PMID:12709059 appears to confuse
        acyl-CoA synthetase (an ATP-dependent ligase, EC 6.2.1) with
        fatty-acyl-CoA synthase (the fatty acid synthase reaction, EC 2.3.1.86).
        The abstract reports "an acyl-CoA synthetase activity for fatty acid
        activation". The ligase activity is already captured by GO:0031956 and
        GO:0102391 from the same paper, so this row can be deleted. Confidence is
        PROBABLE because only the abstract was read. The row seeds PAINT IBD
        PTN001944787, which spreads the error across the PTHR43605 family.
- term:
    id: GO:0005549
    label: odorant binding
  evidence_type: NAS
  original_reference_id: PMID:12709059
  qualifier: enables
  review:
    summary: >-
      Speculative. The paper's only statement about odorants is that O-MACS "may
      play important roles in processing odorants"; no binding of any odorant was
      reported in the abstract.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This is a curator NAS based on the authors' closing hypothesis, which is
      offered as one of two alternatives (odorant processing, or zonal
      patterning of the olfactory epithelium during development). The
      demonstrated activity is fatty acid activation by CoA ligation. Some short
      and medium-chain fatty acids are odorous and could be substrates, but GO
      does not capture an enzyme's substrate engagement as a separate binding
      function; that is covered by the catalytic activity term. Odorant binding
      in GO denotes proteins such as odorant-binding proteins and receptors whose
      function is binding the odorant. The row is not removed because the RGD
      curator read the full text and the olfactory-specific expression makes an
      odorant-related role a reasonable, if untested, hypothesis; it is marked as
      an over-annotation of a speculative statement.
    supported_by:
    - reference_id: PMID:12709059
      supporting_text: The present study indicates that this novel protein may play
        important roles in processing odorants in a zone-specific manner, or the
        zonal patterning of the OE during development.
