- id: PMID:12709059
  title: O-MACS, a novel member of the medium-chain acyl-CoA synthetase family, specifically
    expressed in the olfactory epithelium in a zone-specific manner.
  findings:
  - statement: Recombinant O-MACS has acyl-CoA synthetase (fatty acid activation,
      ligase) activity, not fatty acid synthase activity.
    supporting_text: Recombinant O-MACS protein tagged with c-Myc and His6 demonstrated
      an acyl-CoA synthetase activity for fatty acid activation
  - statement: O-MACS localizes to mitochondria.
    supporting_text: protein localization to mitochondria like other MACS family proteins
  - statement: o-macs expression is restricted to the olfactory epithelium, in a zone-specific
      pattern.
    supporting_text: RT-PCR analysis demonstrated that the o-macs gene is expressed
      only in the OE, unlike other MACS family genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; title and content match the UniProt RN [1] reference
      for Q7TN78. The only experimental paper on Acsm4. It supports ligase activity
      and mitochondrial location; the odorant role is a hypothesis.
- id: PMID:11470804
  title: Molecular identification and characterization of two medium-chain acyl-CoA
    synthetases, MACS1 and the Sa gene product.
  findings:
  - statement: The paralogs MACS1 (Acsm1) and Sa (Acsm3) are mitochondrial matrix
      medium-chain acyl-CoA synthetases whose products are used mainly for oxidation;
      they seed the PTHR43605 IBDs for fatty acid biosynthetic process and mitochondrial
      matrix.
    supporting_text: (14)C-Fatty acid incorporation studies indicated that acyl-CoAs
      produced by MACS1 and Sa protein are utilized mainly for oxidation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Paper on mouse paralogs, cited only to examine
      the seeds of PAINT IBDs inherited by Acsm4.
