    label: mitochondrial matrix
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:99538
  - PANTHER:PTN001292823
  - UniProtKB:Q08AH1
  review:
    summary: >-
      Inherited from PAINT node PTN001292823, seeded by mouse Acsm3 (Sa protein)
      and bovine ACSM1, both shown by subcellular fractionation to be in the
      mitochondrial matrix.
    action: ACCEPT
    reason: >-
      Acsm4 sits inside the clade that inherited this location, and nothing
      specific to Acsm4 argues for divergence. Independent lines agree: Acsm4
      carries a cleavable N-terminal mitochondrial transit peptide (residues
      1-22), it is experimentally mitochondrial, and closely related family
      members (MACS1 and Sa protein) were fractionated to the matrix, where
      medium-chain fatty acids are activated and oxidised. The matrix location
      for Acsm4 itself has not been tested directly, so the core function
      location is kept at the organelle level.
