suggested_questions:
- question: What are the physiological substrates of Acsm4 in the olfactory epithelium,
    and does it activate odorous carboxylic acids or xenobiotic acids in addition
    to medium-chain fatty acids?
- question: What is the biological role of the zone-1 restricted expression of Acsm4
    in the olfactory epithelium, and is the acyl-CoA product used for oxidation, glycine
    conjugation or another fate?
suggested_experiments:
- description: Kinetic profiling of purified Acsm4 against C2-C16 fatty acids and
    odorous or xenobiotic carboxylic acids (e.g. benzoate, branched-chain acids), and
    fate tracing of the acyl-CoA product in olfactory epithelium explants.
  experiment_type: enzyme kinetics and metabolic tracing
- description: Acsm4 knockout in rodents with odor-detection behavioural tests and
    zonal marker analysis of the olfactory epithelium.
