id: Q7TN78
gene_symbol: Acsm4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: >-
  Acsm4 (O-MACS, olfactory-specific medium-chain acyl-CoA synthetase) encodes a
  mitochondrial AMP-forming acyl-CoA synthetase of the medium-chain (ACSM)
  subfamily of the ANL adenylate-forming enzyme superfamily. It carries an
  N-terminal mitochondrial transit peptide and the AMP-binding and AMP-binding C
  domains, and catalyses the ATP-dependent ligation of free medium-chain fatty
  acids (C6-C12, e.g. hexanoate, octanoate, decanoate, dodecanoate) to coenzyme A,
  forming the acyl-CoA thioester with release of AMP and diphosphate. This
  activation step precedes the use of the fatty acid in downstream metabolism.
  Recombinant tagged protein localizes to mitochondria. In rat, expression is
  restricted to the olfactory epithelium, where the transcript is found in a
  dorso-medial zone (zone 1) in olfactory sensory neurons, supporting cells and
  basal cells, and is already present in the olfactory placode at embryonic day
  11.5. Its physiological substrates in the olfactory epithelium and its
  biological role there are not known.
