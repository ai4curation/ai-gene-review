      supporting_text: GO; GO:0035634; P:response to stilbenoid; ISO:RGD.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: MGI:MGI:95863
        source_label: mouse Gsta2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Transcriptional induction by a stilbenoid is legitimately what a "response to X"
          term denotes, so the donor annotation itself is not misconceived. The problem is
          the transfer: rodent alpha-class GST symbols are not 1:1 orthologous between
          mouse and rat, so the symbol-matched step from mouse Gsta2 to rat Gsta1 (P00502)
          crosses paralogues, and stilbenoid induction has not been demonstrated for rat
          Gsta1 itself. Alpha-class GSTs also differ markedly in inducer responsiveness,
          so induction of one family member is weak grounds for annotating another.
