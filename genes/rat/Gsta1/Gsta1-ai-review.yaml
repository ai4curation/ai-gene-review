suggested_questions:
- question: UniProt records prostaglandin A2/J2 conjugation, D5-androstene-3,17-dione isomerisation, and
    13-HPODE peroxidase activity for rat GSTA1 largely by similarity to human GSTA1 (P08263). Which of these
    secondary activities have been measured directly on purified rat GST A1-1, and at what catalytic
    efficiency relative to the canonical CDNB-type conjugation?
- question: Rat Gsta1 (Ya-1) and Gsta2 (Ya-2) are near-identical Ya-type subunits that also form A1-2
    heterodimers. Is there a substrate or hydroperoxide class handled specifically by the A1-1 homodimer, or
    is the pair functionally redundant in liver?
- question: Rodent alpha-class GST symbols are not 1:1 orthologous between rat and mouse, so mouse Gsta2
    (MGI:MGI:95863) is not necessarily the counterpart of rat Gsta1. Which mouse gene is the true orthologue
    and should serve as the ISO donor, and should the current symbol-matched ISO transfers be retracted?
- question: How much of the hepatic ligandin (non-catalytic hydrophobic-ligand binding) capacity attributed
    to alpha-class GSTs is contributed by GSTA1 specifically, and is that binding physiologically important
    for bilirubin or steroid handling in vivo?
suggested_experiments:
- hypothesis: The steroid isomerase, prostaglandin-conjugating, and hydroperoxide-reducing activities
    currently annotated to rat GSTA1 by similarity are genuine but minor side activities of the same
    glutathione-binding site, not independent physiological functions.
  description: Purify recombinant rat GST A1-1 and determine kcat/Km in parallel for CDNB conjugation,
    prostaglandin A2 and J2 conjugation, D5-androstene-3,17-dione isomerisation, and 13-HPODE reduction; then
    repeat with an active-site Tyr-to-Phe mutant to test whether all four activities depend on the same
    thiolate-stabilising residue.
  experiment_type: comparative enzyme kinetics with active-site mutagenesis
- hypothesis: Rat GSTA1 and GSTA2 are not functionally redundant, and the A1-1 homodimer has a distinct
    electrophile and hydroperoxide preference from A2-2 and from the A1-2 heterodimer.
  description: Reconstitute rat A1-1, A2-2, and A1-2 dimers from recombinant subunits and profile each against
    a panel of electrophiles and lipid hydroperoxides, then compare the profiles against glutathione-conjugate
    output measured in liver cytosol from wild-type and Gsta1-knockdown rats.
  experiment_type: reconstituted-dimer substrate profiling with in vivo cross-check
- hypothesis: Rat GSTA1 is confined to the cytosol and does not localise to the mitochondrial matrix, so the
    ISO-derived mitochondrion annotation reflects symbol-matched transfer rather than rat biology.
  description: Fractionate rat liver into cytosol, proteinase-K-shaved mitochondria, and nuclear envelope, and
    quantify GSTA1 by targeted proteomics using tryptic peptides that discriminate Ya-1 from Ya-2, so the
    compartment call is made on a paralog-resolved basis.
  experiment_type: subcellular fractionation with paralog-discriminating targeted proteomics
