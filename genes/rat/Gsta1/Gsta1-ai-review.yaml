    action: MARK_AS_OVER_ANNOTATED
    reason: mitochondrion was not observed for rat Gsta1; it enters solely by ISO transfer from mouse
      MGI:MGI:95863, and UniProt records only Cytoplasm as the subcellular location for P00502.
    supported_by:
    - reference_id: UniProtKB:P00502
      supporting_text: GO; GO:0005739; C:mitochondrion; ISO:RGD.
    - reference_id: UniProtKB:P00502
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: MGI:MGI:95863
        source_label: mouse Gsta2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Rodent alpha-class GST symbols are not 1:1 orthologous between mouse and rat, so
          symbol-matched transfer from mouse Gsta2 to rat Gsta1 (P00502) is unsafe, and a
          compartment call is the kind of claim least likely to survive that step. The rat
          record carries only Cytoplasm as its subcellular location, and no rat experiment
          places GSTA1 in mitochondria. Note that this same donor is trusted elsewhere in
          this file for GO:0004364 and GO:0005829: those two are independently confirmed
          for rat by direct assay (IDA, PMID:15152091 and PMID:17112229 respectively), so
          the transfer is not load-bearing there. For mitochondrion there is no such
          independent rat evidence, and the donor is the sole support.
