id: P00502
gene_symbol: Gsta1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Gsta1 encodes rat glutathione S-transferase alpha-1 (GST A1-1, also called GST Ya-1 or
  ligandin), a cytosolic alpha-class glutathione transferase (EC 2.5.1.18) that works as a homodimer or as a
  heterodimer with GSTA2. Its principal activity is phase II detoxification, in which it catalyses
  nucleophilic attack by the sulfur of reduced glutathione on the electrophilic centres of a wide range of
  exogenous and endogenous compounds, producing more soluble S-substituted glutathione conjugates that are
  exported and processed through the mercapturic acid pathway. The same active site supports several
  secondary, glutathione-dependent activities of the alpha class, including conjugation of the cyclopentenone
  prostaglandins A2 and J2, isomerisation of D5-androstene-3,17-dione to D4-androstene-3,17-dione, and
  glutathione peroxidase activity toward fatty acid hydroperoxides such as 13-HPODE, linking the enzyme to
  prostaglandin turnover, steroid metabolism, and oxidised-lipid clearance. Independently of catalysis, the Ya
  homodimer is the classical hepatic ligandin, binding organic anions, bilirubin, steroid hormones,
  carcinogens, and azo dyes, and it sequesters the dinitrosyl-diglutathionyl-iron complex. Gsta1 is most
  abundant in liver cytosol and is induced with the wider Nrf2/antioxidant-response-element electrophile
  defence programme.
