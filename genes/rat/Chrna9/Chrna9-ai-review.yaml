core_functions:
- description: 'Rat alpha9 contributes to the alpha9/alpha10 receptor pore and ACh-dependent gating. Native
    auditory inhibition results from coupling this cation current to a separate potassium conductance;
    the receptor is not itself a potassium channel or primary mechanical sound sensor. Rat alpha9 can
    form functional homomers in oocytes, but the native auditory receptor includes alpha10. '
