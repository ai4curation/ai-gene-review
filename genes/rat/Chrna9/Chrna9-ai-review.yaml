  review:
    summary: The live GO definition specifies receipt of sound vibration and conversion into a molecular
      signal.
    action: MARK_AS_OVER_ANNOTATED
    reason: Alpha9/alpha10 instead receives efferent acetylcholine and modulates the sensory cell through
      ion-channel signaling. Native comparison and mouse knockout experiments support efferent control
      and synaptic integrity, not assignment of this receptor as the mechanical stimulus detector. This
      is a role-scope correction, not a claim of absent auditory function or an invented loss in the PAINT
      lineage.
