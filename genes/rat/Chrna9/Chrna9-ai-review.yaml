id: P43144
gene_symbol: Chrna9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Chrna9 encodes the alpha9 subunit of an acetylcholine-gated cation channel associated with
  efferent signaling to inner-ear hair cells. Rat alpha9 can form functional homomers in oocytes, but
  the native auditory receptor includes alpha10. Calcium entry through the receptor recruits calcium-dependent
  potassium channels, allowing a cation channel to mediate net inhibition of hair cells. Rat alpha9/alpha10
  receptors have high relative calcium permeability compared with chicken; choline is a partial agonist
  in rat. Nicotine antagonizes the ordinary alpha9/alpha10 channel rather than serving as its canonical
  activating agonist.
