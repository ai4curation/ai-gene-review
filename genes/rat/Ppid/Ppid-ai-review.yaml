- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q08752
  review:
    summary: ISO transfer from human PPID of negative regulation of transcription by RNA polymerase II;
      the human source annotation (IMP, PMID:18708059) reports the opposite direction.
    action: MODIFY
    reason: 'The only experimental basis for this term on human PPID is the AHR study PMID:18708059, in
      which CyP40 knockdown reduced 3MC-induced CYP1A1/CYP1B1 expression and CyP40 promoted formation
      of the DNA-binding AhR/Arnt/DRE complex: a positive contribution to AHR-dependent transcription.
      The direction is therefore inverted; the claim is replaced with positive regulation of transcription
      by RNA polymerase II (a sign correction, not a refinement). This is a peripheral, context-specific
      role and is not a core function. Cyp40 inhibition of c-Myb DNA binding (PMID:9659917) is a separate
      in vitro finding and is captured by the transcription factor binding row.'
    proposed_replacement_terms: &id001
    - id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
    propagation_review: &id002
      root_cause: SOURCE_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      source_entities:
      - source_id: UniProtKB:Q08752
        source_status: SOURCE_BAD
        comment: 'Human IMP annotation from PMID:18708059 has the wrong sign: knockdown reduced AHR target-gene
          induction.'
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:Q08752
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0000122
      corrected_value: GO:0045944
      corrected_label: positive regulation of transcription by RNA polymerase II
      confidence: PROBABLE
      explanation: The human PPID IMP annotation to GO:0000122 cites PMID:18708059, which shows that reducing
        CyP40 reduces 3MC-induced CYP1A1/CYP1B1 up-regulation (CyP40 is required for maximal AHR function).
        The phenotype supports positive, not negative, regulation of RNA polymerase II transcription.
        The rat ISO/ISS copies inherit the inverted sign.
      supported_by: &id003
      - reference_id: PMID:18708059
        supporting_text: When the CyP40 content in MCF-7 cells is reduced, up-regulation of cyp1a1 and
          cyp1b1 by 3-methylchloranthrene (3MC) is also reduced, suggesting that CyP40 is essential for
          maximal AhR function.
    supported_by: &id004
