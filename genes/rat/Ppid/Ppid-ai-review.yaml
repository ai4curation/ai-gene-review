id: Q6DGG0
gene_symbol: Ppid
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Ppid encodes cyclophilin 40 (CyP40, PPIase D), a ubiquitously expressed 40 kDa immunophilin
  that combines an N-terminal cyclophilin-type peptidyl-prolyl cis-trans isomerase domain, a linker region
  with intrinsic chaperone (holdase) activity, and three C-terminal tetratricopeptide (TPR) repeats. The
  TPR domain binds the C-terminal EEVD motif of Hsp90 (two CyP40 monomers per Hsp90 dimer) and, more weakly,
  Hsc70, so that CyP40 acts as an Hsp90 co-chaperone that competes with FKBP52 and FKBP51 for incorporation
  into Hsp90 client complexes, including unliganded estrogen and other steroid receptor heterocomplexes.
  Its isomerase domain binds cyclosporin A only weakly. Additional reported roles include inhibition of
  c-Myb DNA binding, promotion of AhR/ARNT complex formation for maximal aryl hydrocarbon receptor signaling,
  and promotion of UVA-induced apoptosis. It is found in the cytosol and nucleus, with a prominent nucleolar
  pool that redistributes to the nucleoplasm after heat stress. Ppid is distinct from the mitochondrial
  cyclophilin D (Ppif), with which it is often confused. Functional data come almost entirely from the
  human, bovine and mouse orthologs.
