core_functions:
- description: Cyclophilin-type peptidyl-prolyl cis-trans isomerase (EC 5.2.1.8) of the N-terminal cyclophilin
    domain, weakly inhibited by cyclosporin A, acting on client proteins within Hsp90 chaperone complexes.
  molecular_function:
    id: GO:0003755
    label: peptidyl-prolyl cis-trans isomerase activity
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:7744028
    supporting_text: The recombinant CyP-40 showed peptidyl-prolyl cis-trans isomerase activity
  - reference_id: PMID:11350175
    supporting_text: the catalytic activity of prolyl isomerization corresponds well to that of the respective
      small PPIases
- description: 'TPR-domain Hsp90 co-chaperone: binds the Hsp90 C-terminus (two monomers per Hsp90 dimer),
    competing with FKBP52/FKBP51, and is incorporated into Hsp90 client heterocomplexes such as unliganded
    steroid receptors; its linker region supplies holdase-type chaperone activity.'
  molecular_function:
    id: GO:0051879
    label: Hsp90 protein binding
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:7657624
    supporting_text: Both purified CyP-40 and hsp56 bind directly to purified hsp90
  - reference_id: PMID:11350175
    supporting_text: two PPIase monomers bind to an Hsp90 dimer
  - reference_id: PMID:8939864
    supporting_text: both proteins interacted with the substrate to maintain a nonnative folding-competent
      intermediate
suggested_questions:
- question: Should RGD move the PMID:12077116 and PMID:19832699 annotations (PPIase IDA, cyclosporin A
    binding IDA, oxidative stress, apoptosis and mitochondrial membrane potential IMPs) from Ppid to Ppif,
    given both papers study mitochondrial cyclophilin D?
- question: Which Hsp90 clients in vivo depend specifically on CyP40 (rather than FKBP51/FKBP52), and
    does its PPIase activity act on the client or on Hsp90 itself?
- question: Is the human GO:0000122 annotation from PMID:18708059 an inverted sign, and should the AHR
    role be captured as positive regulation of transcription instead?
suggested_experiments:
- description: Knock out or knock down Ppid in rat cells and profile Hsp90 client stability and steroid/AHR
    receptor signaling, comparing PPIase-dead (e.g. active-site) and TPR-clamp mutants to separate catalytic
    and co-chaperone roles.
