  evidence_type: IDA
  original_reference_id: PMID:12077116
  qualifier: enables
  review:
    summary: RGD IDA for PPIase activity citing PMID:12077116, a study of mitochondrial cyclophilin D
      (Ppif), not cyclophilin 40.
    action: ACCEPT
    reason: 'The claim itself is correct for Ppid and is independently established by enzymology of recombinant
      CyP-40 (PMID:7744028, PMID:11350175), so the claim is accepted, consistent with the other PPIase
      rows. The cited evidence, however, concerns a different protein: the abstract of PMID:12077116 describes
      CyPD as the mPTP sensitizer that binds ANT, i.e. mitochondrial PPIF, and UniProt warns that PPID
      should not be confused with PPIF. Full text was not available, so the gene mis-attribution is recorded
      as probable.'
    supported_by:
    - reference_id: PMID:7744028
      supporting_text: The recombinant CyP-40 showed peptidyl-prolyl cis-trans isomerase activity
    - reference_id: PMID:11350175
      supporting_text: the catalytic activity of prolyl isomerization corresponds well to that of the
        respective small PPIases
    - reference_id: PMID:12077116
      supporting_text: Cyclophilin D (CyPD) is thought to sensitize opening of the mitochondrial permeability
        transition pore (mPTP)
    - reference_id: file:rat/Ppid/Ppid-uniprot.txt
      record_section:
      - CC:CAUTION
      supporting_text: This protein should not be confused with mitochondrial peptidyl-prolyl cis-trans
        isomerase F (PPIF) which is often referred to as cyclophilin D or CypD.
    - reference_id: file:rat/Ppid/Ppid-deep-research-manual.md
      supporting_text: Two of the three rat experimental papers annotated to Ppid by RGD are CypD (Ppif)
