- term: *id011
  evidence_type: IDA
  original_reference_id: PMID:18385140
  qualifier: located_in
  review:
    summary: Mitochondrial intermembrane space, from rat kidney mitochondrial subfractionation and protease protection
      (Rardin et al. 2008).
    action: NEW
    reason: Full text read. Endogenous rat kidney DSP18 is trypsin-accessible in mitoplasts but protected in inverted
      submitochondrial particles and is a peripheral protein of the inner membrane, placing it on the intermembrane-space
      face; it is released from the IMS to the cytosol on apoptotic outer-membrane permeabilization, as IMS proteins
      are. Two lines (protease protection and apoptotic release) agree. GOA carries only mitochondrial inner membrane
      and cytoplasm for rat, so the sub-compartment is added beside them.
