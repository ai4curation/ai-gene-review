suggested_questions:
- question: What are the physiological substrates of DUSP18 in the mitochondrial intermembrane space?
- question: 'How does a mitochondrial IMS phosphatase reach GPR54 and Src at the osteoclast plasma membrane: is
    there a non-mitochondrial pool, or is the bone phenotype secondary to release during stress?'
- question: Should the human nuclear/nucleoplasm annotations from tagged overexpression and HPA staining be retained
    given the endogenous mitochondrial localization?
suggested_experiments:
- description: Substrate-trapping (C104S/D73A) Dusp18 pulldowns from purified rat kidney mitochondrial intermembrane-space
    fractions followed by mass spectrometry, compared with phosphoproteomics of Dusp18-null mitochondria.
- description: Endogenous Dusp18 localization (fractionation with ER/plasma-membrane markers and immuno-EM) in osteoclasts
    to test for a non-mitochondrial pool that could engage GPR54/Src.
