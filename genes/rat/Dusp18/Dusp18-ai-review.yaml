    action: MARK_AS_OVER_ANNOTATED
    reason: The human source is an HPA immunofluorescence call that cannot be inspected here; it conflicts with
      the rigorous endogenous localization of DSP18 to the mitochondrial intermembrane space (gradient-purified
      rat kidney mitochondria, immuno-EM, subfractionation). No rodent evidence supports a nucleoplasmic pool, so
      transferring it to rat over-reaches.
