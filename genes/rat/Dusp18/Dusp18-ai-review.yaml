  review:
    summary: Negative regulation of bone resorption, transferred from mouse Dusp18 (IMP, PMID:38346942).
    action: KEEP_AS_NON_CORE
    reason: Mouse Dusp18 knockouts show osteoclast hyperactivation and bone loss, Dusp18-null osteoclasts escape
      Kp-10 suppression of resorption, and DUSP18 dephosphorylates the Src activation-loop Tyr416 downstream of
