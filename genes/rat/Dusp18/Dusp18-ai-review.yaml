id: Q6AXW7
gene_symbol: Dusp18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Rat Dusp18 encodes a small (204 aa) atypical dual-specificity protein phosphatase of the DUSP18/DUSP21
  subfamily, consisting of a single DSPc catalytic domain with the CX5R P-loop and a phosphocysteine active site
  (Cys104) but no MAPK-docking or CH2 domain. Orthologous enzymes hydrolyse phosphotyrosine and, less efficiently,
  phosphothreonine substrates, including Src pTyr416 and USF1 pThr100 in vitro. Unlike its testis-specific paralog
  DUSP21, it is widely expressed. In rat kidney the endogenous protein is imported into mitochondria through an
  internal targeting region and is a peripheral protein of the inner membrane facing the intermembrane space; it
  is released to the cytosol when the outer membrane is permeabilized during apoptosis. In mouse, Dusp18 loss causes
  osteoclast hyperactivation and bone loss, attributed to failure to dephosphorylate Src downstream of the kisspeptin
  receptor GPR54. Physiological substrates within mitochondria are unknown.
