- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: Nucleus, from UniProt SubCell mapping or transfer from human DUSP18 (Q8NEJ0).
    action: MARK_AS_OVER_ANNOTATED
    reason: The nuclear location rests on transient overexpression of tagged human DUSP18 in COS cells. Endogenous
      DSP18 in gradient-purified rat kidney mitochondria, and in COS-7, HEK293 and HeLa cells, is mitochondrial,
      and N-terminal tags were shown to block mitochondrial import, providing an explanation for nuclear/cytoplasmic
      signals. No endogenous rat or mouse evidence places Dusp18 in the nucleus.
    supported_by:
    - &id008
      reference_id: PMID:12408986
      supporting_text: Transfection into COS cells indicates that both proteins are expressed in the nucleus and
        the cytoplasm.
    - &id007
      reference_id: PMID:18385140
      supporting_text: However, these were overexpression experiments utilizing N-terminal tags which have been
        shown to commonly disrupt the localization of mitochondrial proteins
    - &id009
      reference_id: PMID:18385140
      supporting_text: these results suggest that DSP18 is a mitochondrial IMS protein, which is peripherally associated
        with the IM predominantly along the cristae
    source_defects: &id010
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:Q8NEJ0
      slot: GO_Term
      requested_change: CHECK
      asserted_value: GO:0005634
      confidence: SUSPECTED
      explanation: Human DUSP18 (Q8NEJ0) carries located_in GO:0005634 nucleus by IDA from PMID:12408986, which
        used transient overexpression of tagged constructs in COS cells. Rardin et al. 2008 (PMID:18385140) showed
        that N-terminal tags block mitochondrial import of DSP18 and that the endogenous protein (rat kidney, COS-7,
        HEK293, HeLa) is mitochondrial, in the intermembrane space. Please check whether the nuclear annotation
        should be kept; it propagates to rat (Q6AXW7) by ISS/ISO and to the rat UniProt subcellular location line.
      supported_by:
      - *id007
