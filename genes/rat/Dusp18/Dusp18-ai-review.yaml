- id: PMID:18385140
  title: Dual specificity phosphatases 18 and 21 target to opposing sides of the mitochondrial inner membrane.
  findings:
  - statement: Endogenous rat kidney DSP18 is a peripheral inner-membrane protein facing the mitochondrial intermembrane
      space.
    supporting_text: these results suggest that DSP18 is a mitochondrial IMS protein, which is peripherally associated
      with the IM predominantly along the cristae
  - statement: Recombinant murine DSP18 is an active phosphatase dependent on its active-site cysteine.
    supporting_text: Mutation of the catalytic active site cysteine to serine abolished phosphatase activity of
      both DSP18 and DSP21
  - statement: SAPK/JNK is not present in mitochondria and is unlikely to be a physiological DSP18 substrate.
    supporting_text: Collectively these data demonstrate the MAPK SAPK/JNK is not localized to the same subcellular
      compartment as DSP18 and, therefore, is highly unlikely to be its in vivo substrate under physiological conditions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text read. Only rat experimental paper: endogenous rat kidney DSP18 localization by gradient
      purification, immuno-EM, subfractionation, trypsin protection and carbonate extraction; murine DSP18 pNPP
      kinetics; apoptotic release.'
- id: PMID:12591617
  title: Molecular cloning and characterization of a novel dual-specificity phosphatase18 gene from human fetal
    brain.
  findings:
  - statement: Human DUSP18 is a dual-specificity protein phosphatase in vitro.
    supporting_text: GST-DUSP18 fusion protein showed distinctive phosphatase activity toward p-nitrophenyl phosphate
      (pNPP), as well as oligopeptides containing pThr and pTyr, indicating that DUSP18 is a protein phosphatase
      with dual substrate specificity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract only. Cloning and enzymology of human DUSP18: pNPP, pThr and pTyr peptides; Asp73, Cys104,
      Arg110, Ser111 required.'
- id: PMID:12408986
  title: Identification and characterization of two novel low-molecular-weight dual specificity phosphatases.
  findings:
  - statement: No detectable activity against co-expressed MAPKs in cells.
    supporting_text: However, when co-transfected with MAPKs into COS cells, the novel DSPs exhibited no detectable
      in vivo activity against MAPKs under our conditions.
  reference_review:
