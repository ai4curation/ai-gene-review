  review:
    summary: Protein serine/threonine phosphatase activity, inferred from the human/mouse orthologs or EC/Rhea mapping.
    action: ACCEPT
    reason: 'DUSP18 is an atypical dual-specificity phosphatase: the human protein dephosphorylates pThr-containing
      peptides and the pThr100 site of USF1 in vitro, and both catalytic halves depend on the active-site Cys (Cys104
      in rat). Serine/threonine phosphatase activity is one half of the core dual-specificity activity (GO:0008138),
      which is not an is_a parent or child of this term (checked with OAK), so the term is kept as accurate.'
    supported_by:
    - &id001
      reference_id: PMID:12591617
      supporting_text: GST-DUSP18 fusion protein showed distinctive phosphatase activity toward p-nitrophenyl phosphate
        (pNPP), as well as oligopeptides containing pThr and pTyr, indicating that DUSP18 is a protein phosphatase
        with dual substrate specificity
    - &id002
      reference_id: PMID:38992029
      supporting_text: In vitro dephosphorylation experiments showed that Lumacaftor inhibited the ability of purified
        DUSP18 to dephosphorylate WT USF1 but had no effect on USF1T100A
    - &id003
      reference_id: PMID:18385140
      supporting_text: Mutation of the catalytic active site cysteine to serine abolished phosphatase activity of
        both DSP18 and DSP21
