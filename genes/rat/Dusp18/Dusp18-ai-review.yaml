  review:
    summary: Cytoplasm (IBA, UniProt SubCell IEA, ISO from human, ISS from mouse).
    action: MODIFY
    reason: 'Cytoplasm is true only as an ancestor: the mitochondrial intermembrane space is part_of mitochondrion,
      part_of cytoplasm. The endogenous rat protein is a peripheral inner-membrane protein on the IMS side, and
      it moves to the cytosol only after outer-membrane permeabilization in apoptosis. The specific supported location
      is GO:0005758 mitochondrial intermembrane space (added here as a NEW IDA row from PMID:18385140); the gene
      also carries GO:0005743 mitochondrial inner membrane.'
