      domains, whereas Bsep was expressed at the apical domains.
  - reference_id: PMID:1961729
    supporting_text: Liver parenchymal cells continuously extract high amounts of bile acids from portal
      blood plasma.
  - reference_id: PMID:15297262
    supporting_text: Basal-to-apical transport of taurocholate across the monolayer expressing only Ntcp
      and that coexpressing Ntcp/Bsep was observed, whereas the flux across the monolayer of control and
      Bsep-expressing cells was symmetrical.
  - reference_id: PMID:28827769
    supporting_text: The transport of bile acids across the basolateral membrane of the hepatocytes is
      mainly mediated by the NTCP.
proposed_new_terms: []
suggested_questions:
- question: Rat Ntcp mediates sodium-dependent uptake of estrone 3-sulfate [PMID:9486191], a curated UniProt
    reaction (RHEA:71083), but the generic organic anion transport and organic anion transmembrane transporter
    activity terms are obsolete. Is there a non-obsolete GO molecular function that captures sulfated-steroid
    uptake, or should substrate scope for multispecific carriers be recorded as has_input extensions on
    the transporter activity annotation instead?
- question: Hepatic Ntcp expression is suppressed by inflammation, synthetic estrogen, ethanol and bile-acid
    overload in at least five independent rat studies. Would GO prefer these relationships to be represented
    from the regulator's side, for instance as regulation of transmembrane transporter expression by the
    nuclear receptors and kinases concerned, so that response-to-X process terms are not accumulated on
    the regulated transporter?
- question: Should IEP evidence be admissible for involved_in process annotations at all, given that an
    expression change establishes regulation rather than participation? All four response-to-X rows on
    this gene arise from IEP, and the same pattern propagated to human SLC10A1 by GO_REF:0000107.
- question: Rodent Ntcp does not support hepatitis B or D virus entry, whereas human NTCP does and is
    annotated for it. Is the species restriction documented well enough that a NOT annotation for virus
    receptor activity on rat Slc10a1 would be useful, or is absence of annotation sufficient?
suggested_experiments:
- description: Reconstitute purified rat Ntcp in proteoliposomes and measure sodium-to-substrate stoichiometry
    and kinetics separately for each bile salt class and for estrone 3-sulfate, to test whether the two-sodium-per-substrate
    stoichiometry curated in UniProt from the human orthologue holds for the rat protein and for non-bile-acid
    substrates.
- description: Test whether rat Ntcp transports drug xenobiotics such as rosuvastatin, which human NTCP
    carries, in a side-by-side assay with the human orthologue in the same expression system. This would
    settle whether the human xenobiotic transport annotation reflects a species difference or an untested
    rat activity, which is the one point where the rat and human reviews of this gene diverge.
- description: Hepatocyte-specific conditional Slc10a1 deletion in rat with bile salt flux measurements
    under high-fat feeding, ethinylestradiol challenge and chronic ethanol exposure, to determine whether
    the reported nutrient-, estrogen- and ethanol-responsiveness of the transporter has any consequence
    for those responses beyond the transcriptional regulation of Ntcp itself.
- description: Promoter-level dissection of which nuclear receptors and kinases account for the AMPK/FXR-independent
    component of ethinylestradiol-mediated Ntcp suppression reported in PMID:27090119, to identify the
    entities that actually perform the xenobiotic response in which Ntcp is only the target.
