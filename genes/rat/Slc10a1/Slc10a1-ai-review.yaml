id: P26435
gene_symbol: Slc10a1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Slc10a1 (Ntcp, Na+/taurocholate cotransporting polypeptide) is the principal sodium-dependent
  bile salt uptake carrier of the rat liver and the founding member of the bile acid:sodium symporter
  (BASS) family. It is a 362-residue, N-glycosylated, multi-pass membrane protein that resides in the
  basolateral (sinusoidal) plasma membrane of hepatocytes, where it imports bile salts from portal blood
  into the cell in co-transport with sodium, driven by the inward sodium gradient. Transport is strictly
  sodium-dependent, and the carrier accepts all physiological bile salts - taurocholate, taurochenodeoxycholate,
  tauroursodeoxycholate, glycocholate, cholate and related conjugates - as well as the sulfated steroid
  estrone 3-sulfate, making it multispecific with a preference for bile salts and other anionic steroidal
  compounds. Together with the canalicular bile salt export pump (Bsep/Abcb11) it establishes the vectorial
  basal-to-apical bile salt flux across the hepatocyte that drives the enterohepatic circulation of bile
  salts, and hence the intestinal solubilization and absorption of dietary fat and fat-soluble vitamins.
  The gene is expressed predominantly in liver, with low-level expression in kidney, and its hepatic expression
  is strongly down-regulated at the transcriptional level during inflammation, cholestasis and bile-acid
  overload.
