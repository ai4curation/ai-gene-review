  review:
    summary: The original functional expression cloning of rat Ntcp. Expression of the cDNA in Xenopus
      laevis oocytes conferred strictly sodium-dependent bile acid uptake, directly demonstrating bile
      acid:sodium symporter activity [PMID:1961729].
