- term:
    id: GO:0031667
    label: response to nutrient levels
  evidence_type: IEP
  original_reference_id: PMID:25612518
  qualifier: involved_in
  review:
    summary: Rats fed a high-fat diet for 13 weeks were surveyed for hepatic expression of nuclear receptors
      and their transporter target genes [PMID:25612518]. Ntcp appears in that expression panel; the annotation
      records that its transcript level changed with diet.
    action: REMOVE
    reason: 'This is a regulation observation promoted to a participation claim. IEP means the inference
      rests on an expression pattern - here, hepatic Ntcp mRNA moving when dietary fat is raised - and
      the study''s own stated design is transcriptional: it asks whether high-fat feeding alters transporter
      gene expression through nuclear-receptor dysregulation [PMID:25612518]. Under the repo rule, involved_in
      requires that the gene product do some of the work of the process, catalysing a step or supplying
      structure or cofactor activity a step depends on. Ntcp does none of the work of sensing or responding
      to nutrient levels. The entities that perform those steps are the nuclear receptors themselves -
      PXR, CAR, LXR and FXR, whose expression and target-gene output the paper measures - and Ntcp is
      a downstream transcriptional target, i.e. the thing the response acts on. Being regulated by a stimulus
      is not participating in the response to it. On the human side this same claim exists only as a GO_REF:0000107
      transfer from this gene (UniProtKB:P26435), so removing the rat row removes the donor rather than
      just a copy.'
    supported_by:
    - reference_id: PMID:25612518
      supporting_text: We hypothesised that high fat feeding would alter the gene expression of major
        hepatic transporters through a dysregulation of the expression of the nuclear receptors.
    - reference_id: PMID:25612518
      supporting_text: This suggests that a HFD may induce changes in the hepatobiliary transport and
        metabolism of endogenous and exogenous compounds.
- term:
    id: GO:0043627
    label: response to estrogen
  evidence_type: IEP
  original_reference_id: PMID:27090119
  qualifier: involved_in
  review:
    summary: In the rat 17alpha-ethinylestradiol (EE) cholestasis model, hepatic Ntcp mRNA and protein
      were dose-dependently suppressed along with Bsep, Mrp2 and Oatp2 [PMID:27090119]. The annotation
      records that expression change.
    action: REMOVE
    reason: 'An expression-change (IEP) observation that does not establish participation. This is the
      best-documented of the four "response to X" rows because the cached record is full text, and the
      full text is decisive in the opposite direction: the paper''s mechanism is AMPKalpha1 signalling
      and FXR, and Ntcp is a readout at the end of it - suppressed by EE [PMID:27090119], and conspicuously
      not rescued by the interventions (compound C pretreatment, FXR overexpression, the GW4064 agonist)
      that restore Bsep, Mrp2 and Oatp2 [PMID:27090119]. Ntcp therefore performs no step of estrogen perception
      or signalling; it is a transcriptional target whose promoter is acted upon. Note separately that
      rat Ntcp does transport the sulfated steroid estrone 3-sulfate [PMID:9486191], but a substrate relationship
      to a steroid conjugate is a transporter-activity claim, not a response to estrogen process claim,
      and EE is in any case acting here as a cholestatic xenobiotic rather than as a substrate. The matching
      human annotation is a GO_REF:0000107 transfer from this gene, so the defect originates here.'
    additional_reference_ids:
    - PMID:9486191
    supported_by:
    - reference_id: PMID:27090119
      supporting_text: Furthermore, the mRNA and protein levels of bile acid transporters, Bsep, Mrp2,
