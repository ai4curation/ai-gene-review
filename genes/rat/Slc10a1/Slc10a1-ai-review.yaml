core_functions:
- description: 'Sodium-coupled import of bile salts across the hepatocyte basolateral (sinusoidal) plasma
    membrane. Rat Ntcp co-transports a bile salt with sodium down the inward sodium gradient, with an
    apparent Km of 13-34 uM for taurocholate, and accepts all physiological bile salts - taurocholate,
    taurochenodeoxycholate, tauroursodeoxycholate, glycocholate, cholate and related conjugates - plus
    the sulfated steroid estrone 3-sulfate. Transport is strictly sodium-dependent. This activity is the
    hepatic uptake leg of the enterohepatic circulation: positioned on the sinusoidal face of the hepatocyte,
    Ntcp performs the blood-to-cell translocation step that, paired with canalicular export by Bsep/Abcb11,
    produces vectorial transcellular bile salt flux from portal plasma into bile, returning bile salts
    to the liver for re-secretion.'
  molecular_function:
    id: GO:0008508
    label: bile acid:sodium symporter activity
  directly_involved_in:
  - id: GO:0015721
    label: bile acid and bile salt transport
  locations:
