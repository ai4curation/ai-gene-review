    - reference_id: PMID:27090119
      supporting_text: However, the expression of Oatp2 and Ntcp were not significantly up-regulated by
        pretreatment with CC or over expression of FXR, which indicates other mechanisms might be involved
        in EE-mediated Oatp2 and Ntcp expression.
- term:
    id: GO:0045471
    label: response to ethanol
  evidence_type: IEP
  original_reference_id: PMID:27939985
  qualifier: involved_in
  review:
    summary: Study of dihydroartemisinin (DHA) protection against alcoholic liver injury in rats, concluding
      that the effect is FXR-dependent [PMID:27939985]. Ntcp appears within an FXR-target expression panel;
      the annotation records that its expression changed in alcohol-exposed livers.
    action: REMOVE
    reason: Another regulation-for-participation substitution. The paper's own conclusion locates the
      mechanism in FXR activation and hepatocyte lipid handling [PMID:27939985], with the measured effects
      being FXR expression and activity, serum injury markers, inflammation genes and lipogenesis/lipolysis
      genes [PMID:27939985]. Ntcp is a bile-acid transporter whose level tracks that FXR axis; it carries
      out no step of ethanol oxidation, acetaldehyde handling, or any other part of a cellular response
      to ethanol. The entities performing the response are ADH/ALDH and CYP2E1 for the chemistry and FXR
      for the transcriptional arm. Necessity-style and expression-style evidence cannot substitute for
      an answer to the question of which entity performs the step, and here the answer is not Ntcp. As
      with the other two, the human orthologue's copy of this term is a GO_REF:0000107 transfer from this
      gene.
    supported_by:
    - reference_id: PMID:27939985
      supporting_text: In summary, DHA significantly improved alcoholic liver injury by inhibiting hepatic
        steatosis, which was dependent on its activation of FXR in hepatocytes.
    - reference_id: PMID:27939985
      supporting_text: In addition, DHA not only attenuated hyperlipidemia but also reduced hepatic steatosis
        through regulating lipogenesis and lipolysis genes.
- term:
    id: GO:0071466
    label: cellular response to xenobiotic stimulus
  evidence_type: IEP
  original_reference_id: PMID:27090119
  qualifier: involved_in
  review:
    summary: The same EE cholestasis dataset as the response-to-estrogen row, read instead as a xenobiotic
      response. Ntcp expression falls when rats or primary hepatocytes are exposed to the synthetic estrogen
      17alpha-ethinylestradiol [PMID:27090119].
    action: REMOVE
    reason: 'Removed rather than redirected. The IEP evidence shows only that Ntcp is transcriptionally
      suppressed by EE [PMID:27090119] and that this suppression is not mediated by the AMPK/FXR axis
      the paper dissects [PMID:27090119]; the sensing and signalling steps of the xenobiotic response
      are performed by nuclear receptors and the kinases upstream of the Ntcp promoter, not by the transporter.
      The human review of SLC10A1 modified its equivalent row to GO:0042908 xenobiotic transport, on the
      grounds that the human carrier really does transport drug xenobiotics (rosuvastatin). That escape
      route is not available for rat: the definitive rat substrate-specificity study tested two xenobiotics
      and found both to be inhibitors rather than substrates [PMID:9486191], concluding that rat Ntcp
      is multispecific for bile salts and other anionic steroidal compounds [PMID:9486191]. With no demonstrated
      rat xenobiotic-transport activity and no participation in the response itself, the row has no defensible
      replacement.'
    additional_reference_ids:
