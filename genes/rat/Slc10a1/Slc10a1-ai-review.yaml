- term:
    id: GO:0015721
    label: bile acid and bile salt transport
  evidence_type: IEP
  original_reference_id: PMID:28827769
  qualifier: involved_in
  review:
    summary: Geniposide hepatotoxicity study in rats in which hepatic Ntcp mRNA was measured alongside
      bile acid profiles; Ntcp expression fell at the hepatotoxic dose and rose at the low dose [PMID:28827769].
      The paper also states plainly that basolateral hepatic bile acid transport is mainly mediated by
      Ntcp.
    action: ACCEPT
    reason: The evidence code is weak for the claim - IEP records that expression changed, not that the
      gene did the work - but unlike the four "response to X" IEP rows on this gene, the term here names
      a process that Ntcp genuinely executes, and the participation test is satisfied by independent direct
      evidence [PMID:1961729, PMID:15297262]. The cited paper itself asserts the transport role [PMID:28827769],
      and the observed expression change is interpreted as feedback modulation of that very transport
      step. Keeping a correct term supported by a weak code alongside the IDA and IBA rows for the same
      term is acceptable per CLAUDE.md; the term, not the code, is what the annotation asserts.
    additional_reference_ids:
    - PMID:1961729
    supported_by:
    - reference_id: PMID:28827769
      supporting_text: The transport of bile acids across the basolateral membrane of the hepatocytes
        is mainly mediated by the NTCP.
    - reference_id: PMID:28827769
      supporting_text: Geniposide at 300 mg/kg also suppressed hepatic NTCP mRNA expression which could
        be a negative feedback mechanism to reduce bile acid entry in response to elevated hepatocyte
        bile acid concentrations
