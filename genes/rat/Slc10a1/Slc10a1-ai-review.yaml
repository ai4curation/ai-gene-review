  review:
    summary: PAINT places plasma-membrane activity at an ancestral SLC10 node (PANTHER:PTN000040759) covering
      the NTCP/ASBT transporters, and rat Ntcp inherits it. This agrees with the direct rat evidence that
      Ntcp is expressed and functions at the cell surface of polarized epithelia [PMID:15297262].
    action: ACCEPT
    reason: 'The node placement is sound and the term is the right level for the clade: sodium-coupled
      bile salt uptake is by definition a plasma-membrane activity, and the clade members differ only
      in which membrane domain they occupy (basolateral for Ntcp, apical for the ileal Asbt), which is
      exactly why the ancestral node carries the generic plasma-membrane term while the NTCP-specific
      sub-node carries GO:0016323. Rat Ntcp''s surface residence is directly shown by immunohistochemistry
      in MDCK monolayers [PMID:15297262]. The target''s own RGD:3681 entry appearing in the WITH/FROM
      is the expected marker that experimental grounding exists on the target itself, not circularity.'
    supported_by:
    - reference_id: PMID:15297262
