suggested_questions:
- question: >-
    Does the 36-residue N-terminal extension annotated in unreviewed rat TrEMBL
    entry A0A8I6AS56 reflect genuine upstream translation initiation in Rattus
    norvegicus or an upstream start-codon gene-model prediction analogous to the
    9-residue N-terminal extension corrected between Q8NFV4 sv=1 and sv=2 in
    human ABHD11?
suggested_experiments:
- hypothesis: >-
    Endogenous rat Abhd11 initiates at the conserved Met37 start site matching
    canonical mouse Q8K4F5 (307 aa) and human Q8NFV4 (306 aa) and undergoes
    mitochondrial matrix transit-peptide cleavage.
  description: >-
    Perform N-terminal Edman/LC-MS/MS terminomics on immunoprecipitated
    endogenous Abhd11 from isolated rat liver mitochondria to determine both the
    translation initiation site and mature matrix N-terminus, supporting
    promotion of A0A8I6AS56 to a reviewed Swiss-Prot entry.
  experiment_type: proteomics
