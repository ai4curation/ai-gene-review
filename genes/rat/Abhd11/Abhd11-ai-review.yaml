  label: Rattus norvegicus
description: >-
  Abhd11 is a 342-residue rat mitochondrial matrix serine hydrolase of the
  alpha/beta-hydrolase superfamily and the 1:1 Rattus norvegicus ortholog of
  human ABHD11 and mouse Abhd11. Relative to the 306-residue human precursor,
  the unreviewed rat isoform carries a 36-residue N-terminal extension upstream
  of the mitochondrial targeting region while conserving the entire cap-covered
  alpha/beta-hydrolase catalytic core, including the 101-HGLGG-105 oxyanion-hole
  motif and the Ser168-Asp192-His323 charge-relay triad. By 1:1 mammalian
  orthology (~95% mature-chain identity with mouse Abhd11), rat Abhd11 resides
  in the mitochondrial matrix in association with the 2-oxoglutarate
  dehydrogenase complex (OGDHc), where mammalian ABHD11 functions as a
  glutaryl-lipoyl thioesterase removing inhibitory S-glutaryl adducts from
  lipoylated DLST to sustain 2-oxoglutarate oxidative decarboxylation and
  tricarboxylic acid cycle flux, alongside generic carboxylic-ester hydrolase
  activity in vitro.
