  review:
    action: NEW
    summary: protein-folding chaperone binding.
    reason: Cryo-EM of the full-length complex and SEC-MALS directly demonstrate physical association.
      The deposited DafA chain contains the exact 78-residue HB8 reference sequence after an N-terminal
      affinity-tag prefix; the HB27 SIFTS mapping is retained as a database source distinction, not a
      sequence mismatch. The assay therefore supports IPI for the physical interaction, with the tag/complex
      context explicit. This PR-authored proposal previously used IC; its exact earlier row is archived.
    supported_by:
    - reference_id: PMID:41092901
      supporting_text: We have used SEC-MALS to show that the complex has a molecular mass of 210 kDa
        consisting of a 2:2:2 stoichiometry.
