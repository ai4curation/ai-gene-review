id: P77527
gene_symbol: dafA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:300852
  label: Thermus thermophilus HB8
description: DafA is a small regulatory assembly protein of the Thermus DnaK-DnaJ2 chaperone system. It
  forms an inhibited complex by occupying the DnaK client-binding pocket and contacting the J domain in
  a way that prevents productive docking. The structurally characterized complex contains two copies each
  of DnaK, DnaJ2 and DafA. DafA regulates access to the folding machinery rather than supplying ATPase
  or nucleotide-exchange activity.
proposed_new_terms:
- proposed_name: DnaK-DnaJ chaperone inhibitor activity
  proposed_definition: Binding to the DnaK-DnaJ chaperone machinery and reducing its productive protein-folding
    activity by blocking client access and productive J-domain docking.
  justification: The characterized inhibitory assembly acts on a chaperone system; direct autonomous ATPase
    inhibition is not assumed from inhibition of client folding.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  supported_by:
  - &id001
    reference_id: PMID:41092901
    supporting_text: 'DafA inhibits the Hsp70-Hsp40 machinery through two distinct mechanisms: it blocks
      access of protein clients to Hsp70 and it prevents the docking of the J domain onto Hsp70'
  - &id002
    reference_id: PMID:41092901
    supporting_text: We have used SEC-MALS to show that the complex has a molecular mass of 210 kDa consisting
      of a 2:2:2 stoichiometry.
core_functions:
- description: Inhibits productive DnaK-DnaJ2 client processing by occupying the client pocket and blocking
    J-domain docking.
  proposed_molecular_function: DnaK-DnaJ chaperone inhibitor activity
