- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000740
  review:
    summary: GrpE functions as a homodimer.
    action: ACCEPT
    reason: GrpE homodimerization supplies the asymmetric two-subunit architecture that engages DnaK during
      nucleotide exchange. It is a functionally integral binding property of the exchange factor, not
      peripheral merely because nucleotide exchange is the terminal activity. The cited biochemical or
      structural evidence supports the dimer, without implying identical kinetics across taxa.
    supported_by:
    - reference_id: PMID:11724541
      supporting_text: Using a C-terminally truncated version of GrpE(Tth) it was possible to assign the
        second thermal transition to the dimerisation of GrpE(Tth)
