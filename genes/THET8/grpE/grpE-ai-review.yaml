id: Q56236
gene_symbol: grpE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:300852
  label: Thermus thermophilus HB8
description: GrpE is a soluble dimeric nucleotide-exchange factor for the Hsp70 chaperone DnaK. It binds
  DnaK and accelerates nucleotide release, allowing ATP rebinding and continuation of client folding cycles.
  Thermus GrpE efficiently stimulates nucleotide exchange even under conditions where DnaJ does not measurably
  stimulate DnaK ATP hydrolysis.
