  review:
    summary: DnaK nucleotide-exchange factor activity.
    action: ACCEPT
    reason: GrpE binds DnaK and accelerates adenyl-nucleotide release/exchange. Increased cycle turnover
      does not make GrpE the ATP-hydrolyzing enzyme.
    supported_by:
    - reference_id: PMID:11162122
      supporting_text: Kinetic experiments indicate that the maximal acceleration of nucleotide release
        by GrpE is 80,000-fold at a saturating GrpE concentration.
