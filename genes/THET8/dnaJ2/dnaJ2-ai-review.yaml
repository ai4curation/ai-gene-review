id: Q56237
gene_symbol: dnaJ2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:300852
  label: Thermus thermophilus HB8
description: DnaJ2 is a J-domain cochaperone that binds non-native clients and assists their transfer
  to DnaK during protein folding. Its glycine/phenylalanine-rich region controls J-domain accessibility
  and contributes to client handoff. DafA can occupy the machinery and block productive J-domain docking.
