id: Q56237
gene_symbol: dnaJ2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:300852
  label: Thermus thermophilus HB8
description: DnaJ2 is a J-domain cochaperone that assists DnaK-dependent protein folding. The Thermus
  operon protein binds nonnative clients and participates in their transfer to DnaK. Its G/F region regulates
  J-domain accessibility, and DafA can block productive docking. Historical kinetic experiments did not
  detect autonomous stimulation of DnaK ATP hydrolysis under the tested conditions.
