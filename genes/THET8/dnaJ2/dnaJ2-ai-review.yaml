  review:
    summary: dnaJ2 participates in the cytoplasmic chaperone machinery.
    action: ACCEPT
    reason: Retain the cytoplasmic assignment at the resolution supported by curated localization or conserved
      DnaK-cycle architecture. Purified refolding, ATPase and nucleotide-release assays establish molecular
      activity but do not themselves resolve cytosol from other cytoplasmic associations. No direct target
      compartment-resolved localization assay is claimed.
