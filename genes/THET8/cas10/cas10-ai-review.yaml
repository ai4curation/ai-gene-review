proposed_new_terms:
- proposed_name: cyclic oligoadenylate synthase activity
  proposed_definition: >-
    Catalysis of the polymerisation and cyclisation of ATP into a cyclic oligoadenylate
    with release of diphosphate, for example 4 ATP = cyclic tetraadenylate + 4
    diphosphate, or 6 ATP = cyclic hexaadenylate + 6 diphosphate. The product is a closed
    ring of three to six adenosine 5'-monophosphate units joined by 3'-5' phosphodiester
    bonds, which acts as a second messenger. The activity resides in the Palm
    (GGDEF-like) domains of the Cas10/Csm1 subunit of type III CRISPR-Cas effector
    complexes, where it is licensed by binding of a target RNA complementary to the
    complex's CRISPR RNA.
  justification: >-
    No GO molecular-function term describes the synthesis of cyclic oligoadenylate
    (cA3-cA6) second messengers, which is one of the two catalytic outputs of Cas10 and
    the step that makes type III CRISPR immunity a two-tier, amplifying response.
    GO:0001730 2'-5'-oligoadenylate synthetase activity must not be reused for it: that
    term is defined as "Catalysis of the reaction: ATP = pppA(2'p5'A)n oligomers. This
    reaction requires the binding of double-stranded RNA", which is the metazoan
    interferon-induced OAS enzyme. Its product is a linear 2'-5'-linked oligomer that
    retains a 5'-triphosphate, its trigger is free double-stranded RNA, and it sits under
    GO:0070566 adenylyltransferase activity. Cas10 instead makes a covalently closed ring
    of 3'-5'-linked AMP units, releases diphosphate at every step, and is triggered by
    crRNA-guided recognition of a target RNA inside a ribonucleoprotein complex; the
    chemistry, the product and the regulation all differ. The natural placement is
    alongside the bacterial cyclic-dinucleotide synthases, which GO already distinguishes
    at this granularity and places as direct children of GO:0016779 nucleotidyltransferase
    activity: GO:0106408 diadenylate cyclase activity ("Catalysis of the reaction: 2 ATP =
    3',3'-c-di-AMP + 2 diphosphate") and GO:0052621 diguanylate cyclase activity. A cyclic
    oligoadenylate synthase term is the missing member of that series. UniProt already
    records the reaction for this family with Rhea cross-references (RHEA:58280 for cA4,
    RHEA:58276 for cA6) and ChEBI entities for the products, so the term can be given
    exact external mappings on creation. The module
    modules/crispr_cas_adaptive_immunity.yaml carries the Cas10 Palm-domain annoton with
    no GO id and records the gap, but a module cannot propose a term; this is that
    proposal. A matching biological-process term for cyclic oligoadenylate signalling,
    and a cyclic oligoadenylate ring nuclease activity term for the enzymes that destroy
    the signal, are the companion requests.
  proposed_parent:
    id: GO:0016779
    label: nucleotidyltransferase activity
  proposed_mappings:
  - predicate: skos:closeMatch
    target_term:
      id: RHEA:58280
      label: 4 ATP = cyclic tetraadenylate + 4 diphosphate
  - predicate: skos:closeMatch
    target_term:
      id: RHEA:58276
      label: 6 ATP = cyclic hexaadenylate + 6 diphosphate
  supported_by:
  - reference_id: PMID:28663439
    supporting_text: >-
      target RNA binding by the Csm effector complex of Streptococcus thermophilus
      triggers Cas10 to synthesize cyclic oligoadenylates
    full_text_unavailable: true
  - reference_id: PMID:28722012
    supporting_text: >-
      Upon target RNA binding by the interference complex, its Cas10 subunit converts ATP
      into a cyclic oligoadenylate product, which allosterically activates Csm6 by binding
      to its CRISPR-associated Rossmann fold (CARF) domain.
    full_text_unavailable: true
suggested_questions:
- question: >-
    Has cyclic oligoadenylate synthesis been measured directly on T. thermophilus HB8
    Cas10, or is cA4 production in this organism still inferred from the activation of
    TtCsm6 by chemically supplied cA4? UniProt codes the reaction ECO:0000305 for this
    entry, and the distinction decides whether the annotation should remain ISS.
- question: >-
    Which cyclic oligoadenylate species does TtCas10 actually make? The S. thermophilus
    enzyme produces a cA3-cA6 mixture, whereas TtCsm6 responds specifically to cA4, so
    either the Thermus cyclase is more selective or the cell contains a ring nuclease
    that trims the mixture.
- question: >-
    Should GO acquire a cellular-component term for the Csm/Cmr effector complex?
    Complex membership for every curated Cas subunit currently collapses onto the root
    term GO:0032991, which loses the distinction between Cascade, Csm and Cmr.
- question: >-
    Is a biological-process term for cyclic oligoadenylate signalling warranted, parallel
    to GO:0061939 c-di-GMP signaling, so that the producer (Cas10), the receiver (Csm6)
    and the ring nucleases that terminate the signal can be linked in the ontology?
suggested_experiments:
- description: >-
    Reconstitute the T. thermophilus HB8 Csm complex with mature crRNA and assay cOA
    synthesis directly on TtCas10 by thin-layer chromatography or LC-MS of the ATP
    reaction products, in the presence and absence of a cognate target RNA, to replace the
    ECO:0000305 inference with a measurement in this organism.
- description: >-
    Mutate the Thermus GGDEF-domain catalytic aspartate pair, the residues equivalent to
    the S. thermophilus D575/D576 whose substitution abolishes cOA synthesis while leaving
    the ssDNase intact, and confirm the two activities are separable in TtCas10 as they
    are in the Streptococcus enzyme.
- description: >-
    Delete cas10 and the HD-domain catalytic residue separately in T. thermophilus HB8 and
    challenge with a phage carrying a protospacer, distinguishing the contribution of DNA
    degradation from that of cOA-driven Csm6 activation to the immunity phenotype.
- description: >-
    Determine the stoichiometry and structure of the Thermus Csm complex by cryo-EM with a
    bound target RNA, to establish whether the Palm domains adopt the same
    target-RNA-licensed conformation seen in other type III-A systems.
