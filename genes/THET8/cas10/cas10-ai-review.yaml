core_functions:
- description: >-
    Metal-dependent, single-strand-specific deoxyribonuclease housed in the N-terminal HD
    domain of Cas10. Within the ternary Csm complex, base-pairing of the crRNA to a
    nascent invader transcript activates the nuclease, which then degrades the
    single-stranded DNA exposed in the transcription bubble of the locus being
    transcribed. Activity decays as the target RNA is cleaved and dissociates, and is
    suppressed when the crRNA 5' handle pairs with the target's 3' flank, so the nuclease
    acts on actively transcribed invader DNA and not on the host genome.
