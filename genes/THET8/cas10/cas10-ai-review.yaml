- description: >-
    Nucleotidyltransferase housed in the C-terminal Palm domain, annotated by InterPro
    and PROSITE as a GGDEF-like fold (residues 542-702). On target-RNA binding by the Csm
    complex it polymerises and cyclises ATP into cyclic oligoadenylate with release of
    diphosphate; cyclic tetraadenylate is the active species in this organism. The
    product leaves the complex and allosterically activates the standalone ribonuclease
    Csm6 through its CARF domain, converting a single target-recognition event into an
    amplified, cell-wide RNA-degrading response. GO has no term for this activity, so the
    proposed term is named here instead of forcing an ill-fitting id.
