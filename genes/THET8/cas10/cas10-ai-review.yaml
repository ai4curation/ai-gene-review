id: Q53W19
gene_symbol: cas10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:300852
  label: Thermus thermophilus HB8
description: >-
  Cas10 (Csm1) is the large catalytic subunit of the type III-A Csm effector complex
  encoded in the CRISPR-Cas locus on plasmid pTT27 of Thermus thermophilus HB8. The
  Csm complex assembles around a mature CRISPR RNA together with Csm2, Csm3, Csm4 and
  Csm5, and is licensed by base-pairing of its crRNA to a nascent transcript of the
  invading element rather than by the invader's DNA. Cas10 is bifunctional and its two
  activities sit in different domains. An N-terminal HD domain is a metal-dependent,
  single-strand-specific deoxyribonuclease with both endo- and exonuclease activity
  that degrades the single-stranded DNA exposed at the locus being transcribed,
  destroying the invading genome only where it is actively expressed and sparing silent
  and host DNA. A C-terminal Palm domain, recognised by InterPro and PROSITE as a
  GGDEF-like fold, polymerises and cyclises ATP into cyclic oligoadenylates, releasing
  diphosphate; cyclic tetraadenylate is the active species in this organism. The cyclic
  oligoadenylate is a diffusible second messenger that leaves the effector complex and
  allosterically switches on the standalone ribonuclease Csm6, so target detection by a
  small number of complexes is amplified into a cell-wide antiviral state. Both outputs
  decay as the bound target RNA is cleaved and dissociates, which limits the response in
  time; the signal itself is removed by cellular and viral ring nucleases.
