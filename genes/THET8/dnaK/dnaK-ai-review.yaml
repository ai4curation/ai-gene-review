gene_symbol: dnaK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:300852
  label: Thermus thermophilus HB8
description: DnaK is an Hsp70 chaperone that couples ATP binding and hydrolysis to binding and release
  of nonnative protein clients. DnaJ cochaperones assist client handling and GrpE promotes nucleotide
  exchange, enabling repeated folding cycles. In Thermus, productive folding is supported by DnaJ2 and
  GrpE; DafA can trap an inhibited assembly through client-pocket and J-domain interactions.
