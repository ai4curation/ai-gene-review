id: Q56222
gene_symbol: nqo1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:300852
  label: Thermus thermophilus HB8
description: >-
  Nqo1 is the NADH-oxidising flavoprotein subunit (51 kDa subunit family) of the
  proton-pumping NADH:quinone oxidoreductase NDH-1 (respiratory complex I) of Thermus
  thermophilus. It sits at the tip of the peripheral arm on the cytoplasmic side of the
  membrane, binds NADH and the primary electron acceptor FMN, and passes electrons through
  its [4Fe-4S] cluster N3 into the iron-sulfur chain that ends at the quinone site. In this
  organism the complex reduces menaquinone and couples the reaction to proton translocation
  across the cytoplasmic membrane.
