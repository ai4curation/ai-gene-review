    NADH-oxidising flavoprotein subunit of T. thermophilus NDH-1. It binds NADH and FMN,
    oxidises NADH on the flavin and passes electrons via cluster N3 into the peripheral-arm
    iron-sulfur chain, the entry step of the proton-coupled NADH:menaquinone
    oxidoreduction catalysed by the complex.
