  review:
    summary: >-
      ARBA prediction of hydrogenase chemistry (H2 donor, NAD(P) acceptor), which Nqo1 does not perform.
    action: REMOVE
    reason: >-
      The term describes NAD(P)-reducing hydrogenases, which oxidise molecular hydrogen. Nqo1 is the NADH-oxidising subunit of complex I: NADH is its electron donor and quinone the final acceptor of the complex, and no hydrogenase activity is reported. The ARBA rule probably reflects the family's hydrogenase flavoprotein members (HoxF-type), so it is wrong for this protein.
