      corrected_value: contributes_to
      confidence: PROBABLE
      explanation: >-
        The NADH:quinone oxidoreductase reaction is catalysed by the assembled NDH-1 complex.
        Nqo1 is a subunit that contributes to it, so by the GO convention for complex
        subunits this InterPro2GO row should carry contributes_to rather than enables.
