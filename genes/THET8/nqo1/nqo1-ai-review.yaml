  review:
    summary: >-
      InterPro2GO assigns the ubiquinone-specific complex I activity; in T. thermophilus the acceptor is menaquinone.
    action: MODIFY
    reason: >-
      GO:0008137 names ubiquinone as the acceptor, but UniProt states, with experimental evidence, that the immediate electron acceptor of this species' NDH-1 is menaquinone. The quinone-generic parent GO:0016655 is the honest existing term for the complex reaction, and a proton-coupled menaquinone-specific term is proposed under proposed_new_terms, and Nqo1 contributes to it as one subunit rather than catalysing it alone, which the core function records with contributes_to. The wrong enables qualifier is recorded as a source defect.
    proposed_replacement_terms:
    - id: GO:0016655
      label: oxidoreductase activity, acting on NAD(P)H, quinone or similar compound as acceptor
    - id: NTR
      label: NADH dehydrogenase (menaquinone) activity
