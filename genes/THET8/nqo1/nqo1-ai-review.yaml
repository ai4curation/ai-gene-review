proposed_new_terms:
- proposed_name: NADH dehydrogenase (menaquinone) activity
  proposed_definition: >-
    Catalysis of the reaction: NADH + a menaquinone + 5 H+(in) = NAD+ + a menaquinol +
    4 H+(out), in which the oxidation of NADH and reduction of menaquinone are coupled to
    the translocation of protons across the membrane. The menaquinone counterpart of
    GO:0008137 NADH dehydrogenase (ubiquinone) activity, carried out by the complex I of
    menaquinone-using bacteria.
  justification: >-
    GO has an electrogenic NADH dehydrogenase term only for ubiquinone (GO:0008137,
    RHEA:29091, EC 7.1.1.2). The quinone-generic GO:0016655 does not capture the coupled
    proton translocation, and GO:0050136 is non-electrogenic. T. thermophilus NDH-1 reduces
    menaquinone and pumps protons; UniProt records its reaction against the quinone-generic,
    proton-coupled RHEA:57888.
  proposed_parent:
    id: GO:0016655
    label: oxidoreductase activity, acting on NAD(P)H, quinone or similar compound as acceptor
  supported_by:
  - reference_id: file:THET8/nqo1/nqo1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: The immediate electron acceptor for the enzyme in this species is menaquinone.
  - reference_id: file:THET8/nqo1/nqo1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Couples the redox reaction to proton translocation
suggested_questions:
- question: >-
    Should the menaquinone-reducing complex I of Thermus and other menaquinone users get a
    quinone-specific complex-level GO activity term, as ubiquinone users have GO:0008137?
suggested_experiments:
- description: >-
    Measure NADH oxidation by isolated Nqo1 (or the Nqo1/Nqo2 flavoprotein subcomplex) with an
    artificial acceptor such as ferricyanide to confirm the subunit-level NADH dehydrogenase
    activity outside the assembled complex.
