- id: PMID:26763118
  title: Structural basis for the endoribonuclease activity of the type III-A
    CRISPR-associated protein Csm6.
  findings:
  - statement: >-
      The crystal structure of Thermus thermophilus Csm6 shows that the protein is a
      single-strand-RNA-specific endoribonuclease.
    supporting_text: >-
      Here we report the crystal structure of Csm6 from Thermus thermophilus and show that
      the protein is a ssRNA-specific endoribonuclease.
    reference_section_type: ABSTRACT
  - statement: >-
      The catalytic centre is composite, built only when the two HEPN domains of the dimer
      come together.
    supporting_text: >-
      HEPN domain dimerization leads to the formation of a composite ribonuclease active
      site.
    reference_section_type: ABSTRACT
  - statement: >-
      The active-site floor is formed by the invariant R-X4-6-H motif residues Arg415,
      Asn416 and His422.
    supporting_text: >-
      In the TtCsm6 structure, the floor of the HEPN domain cleft is lined with side chains
      of the invariant residues Arg415, Asn416, and His422 from the R-X4-6-H motif.
    reference_section_type: RESULTS
  - statement: >-
      Substituting the HEPN-domain residues abolishes catalysis whereas substituting CARF
      residues does not, so the CARF domain is regulatory rather than catalytic.
    supporting_text: >-
      Individual substitutions of the HEPN domain residues led to near-complete loss of
      ribonuclease activity, whereas mutations in the CARF domain had little effect
    reference_section_type: RESULTS
  - statement: >-
      The CARF domain is not merely dispensable for catalysis but can be deleted outright
      with no loss of activity.
    supporting_text: >-
      This protein was as active as full-length TtCsm6, showing that the CARF domain is not
      required for enzymatic activation
    reference_section_type: RESULTS
  - statement: The enzyme requires no divalent metal cofactor.
    supporting_text: >-
      ssRNA cleavage by TtCsm6 was not perturbed by the addition of EDTA, indicating that
      the activity of TtCsm6 does not require divalent metals.
    reference_section_type: RESULTS
  - statement: >-
      Cleavage leaves a free 5'-hydroxyl, implying transesterification by the ribose
      2'-hydroxyl and a 2',3'-cyclic phosphate on the other product.
    supporting_text: >-
      The observation that TtCsm6 is a metal-independent ribonuclease that generates
      products containing a free 5′-hydroxyl group suggests that RNA hydrolysis involves a
      nucleophilic attack by the 2′-hydroxyl group to yield a 2′,3′ cyclic phosphate
    reference_section_type: DISCUSSION
  - statement: >-
      The paper predicted, before the ligand was known, that the CARF dimer interface is an
      allosteric ligand-binding site.
    supporting_text: >-
      The dimer interface of the CARF domains features a conserved electropositive pocket
      that may function as a ligand-binding site for allosteric control of ribonuclease
      activity.
    reference_section_type: ABSTRACT
  - statement: >-
      Efficient type III-A anti-plasmid immunity requires Csm6 in addition to the Csm
      complex.
    supporting_text: >-
      In addition to the Csm complex, efficient anti-plasmid immunity mediated by type
      III-A systems also requires the CRISPR-associated protein Csm6.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached from PMC. This is the primary characterisation of the protein under
      review: the crystallised and assayed protein is TtCsm6 itself, so all catalytic
      annotations here rest on direct assays of Q53W17 rather than on transfer.
