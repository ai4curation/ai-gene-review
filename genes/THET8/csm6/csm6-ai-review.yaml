proposed_new_terms:
- proposed_name: cyclic oligoadenylate binding
  proposed_definition: >-
    Binding to a cyclic oligoadenylate, a closed ring of three to six adenosine
    5'-monophosphate units joined by 3'-5' phosphodiester bonds, such as cyclic
    tetraadenylate or cyclic hexaadenylate. Cyclic oligoadenylates are second messengers
    synthesised from ATP by the Cas10 subunit of type III CRISPR-Cas effector complexes,
    and are bound by the CRISPR-associated Rossmann fold (CARF) domains of accessory
    effectors and of the ring nucleases that degrade them.
  justification: >-
    GO discriminates cyclic-nucleotide ligands at exactly this granularity and already has
    the two bacterial cyclic-dinucleotide cases, both as children of GO:0030551 cyclic
    nucleotide binding: GO:0035438 cyclic-di-GMP binding and GO:0180001 cyclic-di-AMP
    binding. There is no term for cyclic oligoadenylate, the ligand of every CARF-domain
    effector in type III CRISPR systems, so the series is simply missing its third member.
    The parent cannot be used in its place: GO:0030551 is defined as "Binding to a cyclic
    nucleotide, a nucleotide in which the phosphate group is in diester linkage to two
    positions on the sugar residue", which describes an intramolecular ring on a single
    ribose as in cAMP and cGMP. In a cyclic oligoadenylate each phosphate bridges two
    different riboses, so the molecule no more satisfies that definition than c-di-GMP
    does, which is precisely why GO:0035438 exists as a term rather than as an annotation
    at the parent. The function is the defining property of this gene product: the CARF
    domain performs no catalysis, can be deleted without loss of nuclease activity, and
    exists solely to recognise this ligand and transmit the signal to the HEPN active site,
    a roughly thousandfold stimulation that is specific for the cyclic and not the linear
    oligoadenylate. Note what is deliberately not proposed: the activated state itself
    needs no term, because the chemistry Csm6 performs once switched on is ordinary RNA
    endonuclease activity (GO:0004521) and allosteric activation is a property of the
    regulation rather than a distinct molecular function. The companion request is a cyclic
    oligoadenylate synthase activity term for the Cas10 Palm domain that makes the ligand
    (see genes/STRTR/cas10 and genes/THET8/cas10), and a cyclic oligoadenylate ring
    nuclease activity term for the enzymes that destroy it.
  proposed_parent:
    id: GO:0030551
    label: cyclic nucleotide binding
  supported_by:
  - reference_id: PMID:28722012
    supporting_text: >-
      Upon target RNA binding by the interference complex, its Cas10 subunit converts ATP
      into a cyclic oligoadenylate product, which allosterically activates Csm6 by binding
      to its CRISPR-associated Rossmann fold (CARF) domain.
    full_text_unavailable: true
  - reference_id: PMID:28663439
    supporting_text: >-
      Acting as signaling molecules, cyclic oligoadenylates bind Csm6 to activate its
      nonspecific RNA degradation.
    full_text_unavailable: true
  - reference_id: PMID:26763118
    supporting_text: >-
      The dimer interface of the CARF domains features a conserved electropositive pocket
      that may function as a ligand-binding site for allosteric control of ribonuclease
      activity.
suggested_questions:
- question: >-
    Is the cyclic tetraadenylate site of TtCsm6 the CARF dimer-interface pocket seen in the
    apo structure? UniProt codes the domain assignment for this protein ECO:0000305, and a
    co-crystal or cryo-EM structure with cA4 bound would convert it to direct evidence.
- question: >-
    Can the two reports be reconciled, one finding that only cyclic and not linear
    tetraadenylate activates TtCsm6 and the other finding stimulation by linear
    tetraadenylate at very high concentration without testing cA4? UniProt records both
    without choosing between them.
- question: >-
    Does GO need a mechanistic child of GO:0004521 for HEPN-type cleavage, which leaves a
    free 5'-hydroxyl and a 2',3'-cyclic phosphate by transesterification? Neither existing
    child fits: GO:0016891 names 5'-phosphomonoesters, which is excluded here, and
    GO:0016892 names 3'-phosphomonoesters and a hydrolytic mechanism, neither of which is
    what the paper reports.
- question: >-
    Does T. thermophilus encode a ring nuclease that terminates the cyclic oligoadenylate
    signal? Without one, an activated Csm6 would be expected to degrade host RNA
    indefinitely, and the self-limiting character of the response would be unexplained in
    this organism.
suggested_experiments:
- description: >-
    Determine the structure of TtCsm6 in complex with cyclic tetraadenylate, and compare it
    with the apo form, to establish the binding site and the conformational route from the
    CARF interface to the HEPN active site.
- description: >-
    Repeat the activation assay side by side with chemically defined cA3, cA4, cA5, cA6 and
    the corresponding linear oligoadenylates across a wide concentration range, resolving
    the discordance between PMID:28663439 and PMID:28722012 on linear ligands.
- description: >-
    Introduce CARF-pocket substitutions that abolish cA4 binding but leave the dimer intact,
    and test whether they uncouple nuclease activity from target recognition in vivo, as the
    equivalent mutations do in other type III-A systems.
- description: >-
    Measure host transcriptome decay by RNA-seq after triggering the Thermus Csm system with
    a cognate target, to determine how indiscriminate the activated Csm6 really is and
    whether and how quickly the cell recovers.
