- id: PMID:28722012
  title: Type III CRISPR-Cas systems produce cyclic oligoadenylate second messengers.
  full_text_unavailable: true
  findings:
  - statement: >-
      Csm6 contributes to interference as a standalone RNase degrading invader transcripts,
      with the link from sensing to activity previously unknown.
    supporting_text: >-
      The CRISPR-associated protein Csm6 additionally contributes to interference by
      functioning as a standalone RNase that degrades invader RNA transcripts, but the
      mechanism linking invader sensing to Csm6 activity is not understood.
    reference_section_type: ABSTRACT
  - statement: >-
      A cyclic oligoadenylate made by Cas10 allosterically activates Csm6 by binding its
      CARF domain.
    supporting_text: >-
      Upon target RNA binding by the interference complex, its Cas10 subunit converts ATP
      into a cyclic oligoadenylate product, which allosterically activates Csm6 by binding
      to its CRISPR-associated Rossmann fold (CARF) domain.
    reference_section_type: ABSTRACT
  - statement: >-
      CARF-domain mutations that block allosteric activation inhibit Csm6 activity in vivo,
