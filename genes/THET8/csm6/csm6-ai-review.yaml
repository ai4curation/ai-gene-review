  - reference_id: PMID:26763118
    supporting_text: >-
      ssRNA cleavage by TtCsm6 was not perturbed by the addition of EDTA, indicating that
      the activity of TtCsm6 does not require divalent metals.
- description: >-
    Second-messenger receptor function of the N-terminal CARF domain, which is what couples
    this standalone enzyme to a sensing complex it is not part of. The two CARF domains of
    the dimer form a conserved electropositive pocket at their shared interface, predicted
    from the apo structure to be an allosteric ligand site and subsequently shown to be the
    cyclic oligoadenylate site. Binding of cyclic tetraadenylate, made from ATP by the Cas10
    subunit of the Csm effector complex once that complex has engaged a target transcript,
    stimulates the ribonuclease roughly a thousandfold; linear oligoadenylates of the same
    length do not, so the recognised feature is the closed ring. The domain contributes no
    catalysis of its own and can be deleted entirely without loss of nuclease activity, so
    its whole function is ligand recognition and signal transduction. GO has no term for
    binding a cyclic oligoadenylate, so the proposed term is named here rather than forcing
    GO:0030551, whose definition covers only intramolecular cyclic mononucleotides.
  proposed_molecular_function: cyclic oligoadenylate binding
