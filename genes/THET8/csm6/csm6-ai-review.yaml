id: Q53W17
gene_symbol: csm6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:300852
  label: Thermus thermophilus (strain ATCC 27634 / DSM 579 / HB8)
description: >-
  Csm6 is an accessory ribonuclease of the type III-A CRISPR-Cas locus carried on plasmid
  pTT27 of Thermus thermophilus HB8. Unlike the Cas proteins encoded alongside it, Csm6 is
  not a subunit of the Csm effector complex: it is a free, twisted head-to-head homodimer
  that is physically uncoupled from the machinery that recognises invading nucleic acid,
  and it learns that a target has been detected only through a diffusible chemical signal.
  The protein has two domains with distinct jobs. The C-terminal HEPN domain carries the
  catalysis; dimerisation juxtaposes the two HEPN domains and builds a single composite
  active site at their interface, whose floor is lined by the invariant arginine,
  asparagine and histidine of the R-X4-6-H motif. The enzyme is a single-strand-specific
  endoribonuclease that needs no metal cofactor and cleaves by transesterification, the
  ribose 2'-hydroxyl attacking the scissile phosphate to leave a free 5'-hydroxyl on one
  product and a 2',3'-cyclic phosphate on the other. The N-terminal CARF domain carries no
  catalysis at all and can be deleted entirely without loss of nuclease activity; instead
  the two CARF domains form a conserved electropositive pocket at their shared interface
  that binds the second messenger. Cyclic tetraadenylate, synthesised from ATP by the Cas10
  subunit of the effector complex once that complex has engaged a target transcript, binds
  this pocket and allosterically stimulates the nuclease roughly a thousandfold; linear
  oligoadenylates of the same length do not, so recognition is of the closed ring rather
  than of adenylate as such. The consequence is an amplifier with a safety catch: on its
  own Csm6 is nearly inert, and only in the presence of the signal does it begin cleaving
  RNA indiscriminately, degrading invader transcripts and host RNA alike to impose a
  transient antiviral state. The response is self-terminating because ring nucleases, both
  cellular and virus-encoded, destroy the signal.
