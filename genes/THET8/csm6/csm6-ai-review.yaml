core_functions:
- description: >-
    Metal-independent, single-strand-specific endoribonuclease. The protein is an obligate
    head-to-head homodimer and the active site is composite, assembled at the interface of
    the two C-terminal HEPN domains, with the invariant R-X4-6-H residues Arg415, Asn416
    and His422 lining the cleft floor; substituting any of them, or the nearby Glu332,
    abolishes activity. Cleavage proceeds by transesterification, the ribose 2'-hydroxyl
    attacking the scissile phosphate to leave a free 5'-hydroxyl on one product and a
    2',3'-cyclic phosphate on the other, which is why no divalent metal is needed and why
    EDTA does not inhibit. The activity is non-specific with respect to sequence and acts
    on host as well as invader RNA, and in the resting protein it is essentially held off:
    it is the cyclic-oligoadenylate-bound state, not the apo state, that does the work in
    vivo.
  molecular_function:
    id: GO:0004521
    label: RNA endonuclease activity
  directly_involved_in:
  - id: GO:0099048
    label: CRISPR-cas system
  - id: GO:0051607
    label: defense response to virus
  supported_by:
