taxon:
  id: NCBITaxon:300852
  label: Thermus thermophilus HB8
description: GlyQS is the homodimeric glycyl-tRNA synthetase of Thermus thermophilus HB8. Its class II
  catalytic domain activates glycine with ATP and transfers it to tRNA(Gly). Each identical polypeptide
  contributes to the dimeric enzyme, an architecture distinct from the bacterial GlyQ–GlyS heterotetramer.
  Structural and biochemical studies establish glycine and ATP recognition and relatively broad recognition
  of heterologous tRNA(Gly).
