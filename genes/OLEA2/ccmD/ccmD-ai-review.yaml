taxon:
  id: NCBITaxon:207559
  label: Oleidesulfovibrio alaskensis G20
description: CcmD is a small single-pass membrane protein of the System I* cytochrome c maturation apparatus
  in Oleidesulfovibrio alaskensis G20. It belongs to an alternate CcmD family and supports the heme-handling
  assembly. Removing it from an otherwise active CcmI-deficient cassette eliminates detectable cytochrome
  c550 maturation in E. coli; its precise molecular action and native substrate dependence remain unresolved.
