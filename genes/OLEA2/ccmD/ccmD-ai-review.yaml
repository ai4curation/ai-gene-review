  review:
    action: NEW
    summary: Participates in cytochrome c maturation as a component of the heme-handling machinery.
    reason: Small membrane component supporting heme handling in the maturation apparatus. Its biochemical
      role is inferred from alternate CcmD membership and the selective reconstruction defect; no standalone
      catalytic activity is assigned. The same-role check found GO1903607 on E. coli CcmD/P0ABM5 (including
      PMID10339610 and18326572) and P. putida Q88EX8. These accessory components contribute to heme handling,
      rather than being substrates consumed by maturation; their annotation state is a convention check,
      not evidence for G20. GO1903607 describes biosynthetic work; no existing or proposed ancestor/descendant
      BP duplicates this claim here, and no G20 GO-CAM entry was found. The primary evidence is heterologous
      reconstruction rather than native flux.
    supported_by:
    - &id002
      reference_id: file:OLEA2/ccmE/ccmE-source-analysis/primary-evidence.md
      supporting_text: Further removal of CcmD from the active ccmEFABCD cassette gives no detectable
        c550; this sequential comparison supports CcmD requirement in the tested reconstruction, while
        not measuring a purified molecular activity or every native substrate.
