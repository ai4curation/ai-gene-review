gene_symbol: ccmB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:207559
  label: Oleidesulfovibrio alaskensis G20
description: CcmB is a polytopic membrane subunit of the System I* cytochrome c maturation apparatus in
  Oleidesulfovibrio alaskensis G20. Its conserved CcmB architecture supports a role coupling the CcmA
  ATPase to membrane heme-handling components. The G20 operon supports heterologous cytochrome maturation,
  but CcmB-specific transport chemistry has not been demonstrated.
existing_annotations:
- term:
    id: GO:0015232
    label: heme transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003544
  review:
    action: UNDECIDED
    summary: A transmembrane heme-transport activity is unresolved for G20 CcmB.
    reason: G20 CcmB-specific membrane-crossing flux was not assayed in the System I* operon reconstruction.
      PMID:24044352 rejects an older general CcmABC model but cannot establish absence of transport in
      this target. Later canonical-system studies propose CcmB-associated efflux and alternatively map
      a CcmCD heme channel. Those distinct organisms, constructs and whole-cell readouts leave the G20
      molecular transporter claim unresolved; the separate intracellular heme-handoff process remains
      supported by conserved machinery role.
    supported_by:
    - reference_id: file:OLEA2/ccmE/ccmE-source-analysis/primary-evidence.md
      supporting_text: CcmB's mechanical coupling role is inferred from its conserved membrane-subunit
        architecture and the reconstructed operon, not individually assayed here.
    - reference_id: PMID:40026579
      supporting_text: Similar results were obtained from E. coli CcmB expressed from the same expression
        system
    - reference_id: PMID:40167305
      supporting_text: Thus, CcmAB, and consequently ATP hydrolysis, are not required for heme transport
        to the CcmC WWD domain.
- term:
    id: GO:0015886
    label: heme transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003544
  review:
    action: ACCEPT
    summary: Participates in directed heme trafficking within the maturation apparatus.
    reason: GO0015886 includes directed movement within a cell and does not require crossing a membrane.
      Membrane coupling component of the ATP-dependent heme-handling apparatus; the individual coupling
      assignment is inferred from CcmB family architecture and the functional operon. For this protein,
      heme delivery is the supported process; the separate transmembrane transporter claim is not inferred
      from it.
    supported_by:
    - &id001
      reference_id: file:OLEA2/ccmE/ccmE-source-analysis/primary-evidence.md
      supporting_text: CcmB's mechanical coupling role is inferred from its conserved membrane-subunit
        architecture and the reconstructed operon, not individually assayed here.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR003544
  - UniProtKB-SubCell:SL-0162
  review:
    action: MODIFY
    summary: The supported membrane context is the bacterial plasma membrane.
    reason: The G20 operon encodes an inner-membrane maturation apparatus; topology/domain architecture
      and the heterologous membrane system support plasma membrane as the informative descendant. This
      refinement names the membrane containing the maturation machinery.
    supported_by:
    - *id001
    proposed_replacement_terms:
    - &id002
      id: GO:0005886
      label: plasma membrane
- term:
    id: GO:0017004
    label: cytochrome complex assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003544
  review:
    action: MODIFY
    summary: The supported maturation step is cytochrome c-heme linkage.
    reason: Current GO0018063 is an is_a/part_of descendant of GO:0017004 and captures the covalent-heme
      maturation step supported by the G20 reconstruction. Membrane coupling component of the ATP-dependent
      heme-handling apparatus; the individual coupling assignment is inferred from CcmB family architecture
      and the functional operon. This is a refinement of the existing process claim, not a claim that
      Ccm proteins assemble a respiratory-chain complex. The protein contributes heme handling or the
      reaction machinery rather than merely serving as the substrate.
    supported_by:
    - *id001
    proposed_replacement_terms:
    - id: GO:0018063
      label: cytochrome c-heme linkage
