    summary: ABC-family ATP hydrolysis powers the heme-handling apparatus.
    reason: The CcmA ATPase assignment is supported by its conserved ABC catalytic architecture and ortholog
      mechanism; G20 Lys41 mutation disrupts maturation and lowers holo-CcmE. This is an informed family-based
      catalytic assignment with target functional support, not a measured purified G20 hydrolysis rate
      or a claim of heme translocation.
