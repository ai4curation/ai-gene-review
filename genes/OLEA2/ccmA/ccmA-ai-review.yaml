  evidence_type: IC
  original_reference_id: PMID:24044352
  review:
    action: NEW
    summary: Participates in cytochrome c maturation as a component of the heme-handling machinery.
    reason: ATP-hydrolyzing subunit supplying conformational work for heme trafficking; the G20-specific
      functional test is Walker-A mutagenesis in a heterologous operon, not a purified ATPase-rate assay.
      The same-role check found GO1903607 on E. coli CcmA/P33931 (including PMID10339610 and16824107),
      but not on P. putida Q88EX5. This supports the appropriateness of the process for an ATPase doing
      mechanochemical work; it does not supply evidence for this target. GO1903607 describes biosynthetic
      work; no existing or proposed ancestor/descendant BP duplicates this claim here, and no G20 GO-CAM
      entry was found. The primary evidence is heterologous reconstruction rather than native flux.
    supported_by:
    - *id001
    - *id002
