id: Q311X1
gene_symbol: ccmA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:207559
  label: Oleidesulfovibrio alaskensis G20
description: CcmA is the cytoplasmic ATPase subunit associated with the System I* membrane apparatus of
  Oleidesulfovibrio alaskensis G20. ATP-dependent conformational work promotes heme delivery from CcmC
  toward CcmE and subsequent cytochrome maturation. Walker-A substitution impairs CcmE loading and abolishes
  detectable mature cytochrome in the reconstructed system, consistent with a requirement before or during
  covalent CcmE loading.
