  label: Oleidesulfovibrio alaskensis G20
description: CcmI is a membrane-anchored tetratricopeptide-repeat protein associated with the System I*
  cytochrome c maturation apparatus in Oleidesulfovibrio alaskensis G20. It enhances maturation efficiency
  in a heterologous reconstruction, consistent with an accessory assembly or substrate-handling role.
  Deletion retains approximately20% of cytochrome c550 production, so CcmI is not essential under those
  assay conditions.
