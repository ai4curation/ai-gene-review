  review:
    action: NEW
    summary: Participates in cytochrome c maturation as a component of the heme-handling machinery.
    reason: Accessory membrane-associated TPR component supporting efficient cytochrome maturation; a
      substrate-binding or assembly role is inferred, while direct G20 binding partners and native essentiality
      remain unestablished. Separate CcmI/CycH comparators D5ALI6 and A0ACT3PRX1 returned no annotations
      in the QuickGO query; no overlooked annotation is inferred from their absence. This conservative
      IC proposal instead treats the experimentally identified membrane-anchored TPR protein as an accessory
      maturation-machine participant, supported by its defined operon context and enhancement of correctly
      matured product. A direct G20 apocytochrome-binding assay is still missing, so no specific binding
      MF or native essentiality is asserted. GO1903607 describes biosynthetic work; no existing or proposed
      ancestor/descendant BP duplicates this claim here, and no G20 GO-CAM entry was found. The primary
      evidence is heterologous reconstruction rather than native flux.
    supported_by:
    - &id002
      reference_id: file:OLEA2/ccmE/ccmE-source-analysis/primary-evidence.md
      supporting_text: CcmI deletion leaves approximately20% of the complete-cassette c550 yield, with
        an unchanged product spectrum.
core_functions:
- description: Accessory membrane-associated TPR component supporting efficient cytochrome maturation;
    a substrate-binding or assembly role is inferred, while direct G20 binding partners and native essentiality
    remain unestablished. The target Phobius membrane anchor and TPR architecture support membrane association,
    with inner-membrane context inferred from the G20 maturation cassette and characterized CcmI proteins.
    Rhodobacter CcmI has two membrane helices whereas this target has one predicted helix; no identical
    topology, direct native G20 localization or target periplasmic orientation is asserted from this comparison.
