  review:
    action: ACCEPT
    summary: Membrane-anchored component of the bacterial maturation machinery.
    reason: The current G20 reference protein has 6 Phobius-predicted transmembrane helices. These target-specific
      features support membrane insertion; conserved CcmC architecture and characterized ortholog topology
      support assignment to the bacterial inner membrane. This is a topology/ortholog inference, not a
      direct native G20 localization experiment or an exact experimental map of every predicted helix.
      The evidence does not establish periplasmic orientation from transmembrane segments alone. ARBA-only
      location prose and heme-chemistry phenotypes are not used as location evidence.
