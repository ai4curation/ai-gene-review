  review:
    action: UNDECIDED
    summary: G20 CcmC membrane-crossing activity is unresolved beyond its established heme-loading role.
    reason: G20 operon histidine mutagenesis establishes heme loading and presentation, not isolated membrane-crossing
      flux. PMID:40167305 subsequently maps a CcmCD channel in canonical E. coli System I; this positive
      comparator makes the blanket 2013 transporter rejection inadequate as evidence of absence. Its transfer
      to the divergent G20 System I* apparatus is not demonstrated. Retain uncertainty about this exact
      molecular activity while accepting heme binding and intracellular trafficking. Experimental histidine
      numbering remains subject to the documented 18-residue construct/reference offset.
    supported_by:
    - reference_id: file:OLEA2/ccmE/ccmE-source-analysis/primary-evidence.md
      supporting_text: CcmC histidine variants in the experimental operon abolish detectable holo-CcmE
        and cytochrome production.
    - reference_id: PMID:40167305
      supporting_text: 'A structure-function analysis via cysteine/heme crosslinking

        identified a heme acceptance domain and heme transport channel in CcmCD.'
