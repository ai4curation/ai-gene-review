  review:
    action: MODIFY
    summary: The supported maturation step is cytochrome c-heme linkage.
    reason: Current GO0018063 is an is_a/part_of descendant of GO:0017004 and captures the covalent-heme
      maturation step supported by the G20 reconstruction. Binds and presents heme for CcmE loading. The
      exact current locus is established, but the experimental histidine numbering is not equated with
      reference residue numbers. This is a refinement of the existing process claim, not a claim that
      Ccm proteins assemble a respiratory-chain complex. The protein contributes heme handling or the
      reaction machinery rather than merely serving as the substrate.
