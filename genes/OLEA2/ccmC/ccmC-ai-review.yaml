  review:
    action: ACCEPT
    summary: Membrane-anchored component of the bacterial maturation machinery.
    reason: CcmC is a membrane heme-handling protein in the System I* cytochrome c maturation apparatus
      of Oleidesulfovibrio alaskensis G20. It presents heme upstream of the cysteine-bearing CcmE chaperone.
      Conserved histidine substitutions in the experimental G20 operon disrupt heme loading and cytochrome
      maturation; the published mutant numbering differs from the current reference sequence by18 residues.
      Direct transmembrane heme transport by CcmC has not been established. The compartment assignment
      concerns the cytoplasmic membrane and its periplasm-facing machinery, not a soluble periplasmic
      location inferred from a mature cytochrome substrate.
    supported_by:
    - &id001
      reference_id: file:OLEA2/ccmE/ccmE-source-analysis/primary-evidence.md
      supporting_text: CcmC histidine variants in the experimental operon abolish detectable holo-CcmE
        and cytochrome production.
    - &id002
      reference_id: PMID:24044352
      supporting_text: CcmC* ligates heme via H68 and H192.
