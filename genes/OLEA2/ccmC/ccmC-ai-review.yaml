  label: Oleidesulfovibrio alaskensis G20
description: CcmC is a membrane heme-handling protein in the System I* cytochrome c maturation apparatus
  of Oleidesulfovibrio alaskensis G20. It binds and presents heme upstream of the cysteine-bearing CcmE
  chaperone. Conserved histidines support heme loading and cytochrome maturation, while its precise contribution
  to heme passage across the membrane remains unresolved.
