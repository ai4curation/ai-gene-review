    label: heme transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003567
  review:
    action: ACCEPT
    summary: System I* CcmF participates in heme delivery at the terminal attachment machinery.
    reason: The broad heme-transport process includes intracellular directed handoff. G20 operon mutagenesis
      places CcmF downstream of CcmE loading, and comparative CcmFH work supports transfer into the ligation
      machinery. This supports the inferred heme-delivery process without requiring CcmF to move heme
      across the membrane. The System I* reconstruction does not establish an isolated G20 ligase or channel.
    supported_by:
    - reference_id: file:OLEA2/ccmE/ccmE-source-analysis/primary-evidence.md
      supporting_text: CcmF H173A/H263A variants abolish cytochrome maturation; changes in holo-CcmE accumulation
        distinguish upstream loading from downstream ligation effects.
    - reference_id: PMID:24397552
      supporting_text: Heme in “holo” (heme bound) CcmE is transferred to the apocytochrome (putatively,
        by the action of CcmFH)
    - reference_id: PMID:24397552
      supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
- term:
