    label: heme transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003567
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: G20 CcmF heme handling does not establish a membrane-crossing transporter.
    reason: The G20 CcmF histidine variants and maturation readout support its heme-handling role at ligation,
      not autonomous movement from one membrane side to the other. The electronic domain mapping exceeds
      that established activity. The older rejection of a CcmABC transporter model is not a target-specific
      negative transport assay on CcmF, so REMOVE was too categorical. This assessment does not exclude
      every possible membrane-access or transport activity.
    supported_by:
    - reference_id: file:OLEA2/ccmE/ccmE-source-analysis/primary-evidence.md
      supporting_text: CcmF H173A/H263A variants abolish cytochrome maturation; changes in holo-CcmE accumulation
        distinguish upstream loading from downstream ligation effects.
    - reference_id: PMID:24397552
      supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
- term:
