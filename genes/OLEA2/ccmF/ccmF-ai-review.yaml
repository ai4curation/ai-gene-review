    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR003567
  review:
    action: MODIFY
    summary: The supported membrane context is the bacterial plasma membrane.
    reason: The current G20 reference protein has 14 Phobius-predicted transmembrane helices. These target-specific
      features support membrane insertion; conserved CcmF architecture and characterized ortholog topology
      support assignment to the bacterial inner membrane. This is a topology/ortholog inference, not a
      direct native G20 localization experiment or an exact experimental map of every predicted helix.
      The evidence does not establish periplasmic orientation from transmembrane segments alone. ARBA-only
      location prose and heme-chemistry phenotypes are not used as location evidence. The supported inner
      membrane is the more specific replacement for generic membrane.
    supported_by:
