gene_symbol: ccmF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:207559
  label: Oleidesulfovibrio alaskensis G20
description: CcmF is a polytopic membrane component of the System I* cytochrome c maturation apparatus
  in Oleidesulfovibrio alaskensis G20. It handles heme downstream of CcmE and contributes to its covalent
  attachment to apocytochrome c. Conserved histidines are required in the reconstructed system, whereas
  substitution at the proposed quinone-binding motif retains activity. The tested system functions without
  CcmH; its electron donor and isolated ligation mechanism remain unresolved.
