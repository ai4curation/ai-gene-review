  review:
    action: MODIFY
    summary: The supported maturation step is cytochrome c-heme linkage.
    reason: Current GO0018063 is an is_a/part_of descendant of GO:0017004 and captures the covalent-heme
      maturation step supported by the G20 reconstruction. Heme-handling membrane component that contributes
      to the terminal heme-attachment machinery of System I*, without an obligatory CcmH partner in the
      tested reconstruction. This is a refinement of the existing process claim, not a claim that Ccm
      proteins assemble a respiratory-chain complex. The protein contributes heme handling or the reaction
      machinery rather than merely serving as the substrate.
    supported_by:
