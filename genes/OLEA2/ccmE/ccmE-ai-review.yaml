- term:
    id: GO:0017003
    label: protein-heme linkage
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004329
  - InterPro:IPR036127
  review:
    action: MODIFY
    summary: The supported maturation step is cytochrome c-heme linkage.
    reason: Current GO0018063 is an is_a/part_of descendant of GO:0017003 and captures the covalent-heme
      maturation step supported by the G20 reconstruction. Covalently carries heme through Cys127 and
      participates in its delivery to apocytochrome c; membrane anchoring places the heme-handling domain
      on the periplasmic side. This is a refinement of the existing process claim, not a claim that Ccm
      proteins assemble a respiratory-chain complex. The protein contributes heme handling or the reaction
      machinery rather than merely serving as the substrate.
    supported_by:
    - *id001
    - *id002
