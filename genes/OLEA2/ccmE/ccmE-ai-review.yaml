gene_symbol: ccmE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:207559
  label: Oleidesulfovibrio alaskensis G20
description: CcmE is the membrane-anchored heme chaperone of System I* in Oleidesulfovibrio alaskensis
  G20. Its heme-handling domain is inferred to face the periplasm. It forms a transient covalent heme
  bond through Cys127 and delivers heme for cytochrome c maturation. Its cysteine-bearing binding site
  differs from the histidine-bearing canonical CcmE and is not functionally interchangeable with the
  E. coli protein.
