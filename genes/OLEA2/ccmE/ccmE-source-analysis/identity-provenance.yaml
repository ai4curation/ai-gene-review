donor_evidence: PMID20466730 acknowledgments explicitly identify G20 genomic DNA; methods identify genomic
  operon amplification into pDD86. PMID24044352 identifies the same plasmid and subsequent species rename.
  Current UniProt taxonomy is Oleidesulfovibrio alaskensis G20/OLEA2.
construct_limit: All seven current reference translations match ENA CP000112. The sequenced experimental
  pDD86 insert was not deposited or recovered; exact plasmid-wide equality is not asserted. CcmC paper
  H68/H192 differs from reference H50/H174 by18 residues; E C127/Y131, A K41, and F P147/H173/H263 match.
