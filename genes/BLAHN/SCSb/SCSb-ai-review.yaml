  review:
    summary: EXP from Hamblin et al. 2008, read in full. The paper locates the SCS alpha subunit, in a subtype 4 isolate,
      in the mitochondrion-like organelle by confocal microscopy and reports that the antibodies against the beta subunit
      did not work; the beta subunit is placed there by inference. The paper calls the organelle mitochondrion-like and
      never a hydrogenosome.
    action: ACCEPT
    reason: 'The claim that the protein is in the organelle of Blastocystis is sound, and hydrogenosome is the term GO
      provides for it. The usage comment of GO:0005739 directs locations in mitochondrion-related organelles to GO:0042566
      hydrogenosome or GO:0032047 mitosome, the review it cites lists Blastocystis hominis among the organisms with such
      organelles, the paper on this enzyme excludes a mitosome because the organelle takes part in energy metabolism,
      and an [FeFe] hydrogenase localises to the organelle. The term is used as the location of the core function, as
      in the review of the alpha subunit SCSa. Limits: the definition of the term includes formation of molecular hydrogen,
      which has not been shown for Blastocystis, the organelle has a genome, cristae and a membrane potential, and GO
      has no term for the mitochondrion-like kind of organelle that the cited review sets beside mitosomes and hydrogenosomes.
      For this subunit the location is an inference and the evidence code is recorded as a source defect: the experiment
      was on the alpha subunit of a subtype 4 isolate.'
