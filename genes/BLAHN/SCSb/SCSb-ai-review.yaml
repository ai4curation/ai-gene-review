- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN000212530
  review:
    summary: TreeGrafter IEA from PTN000212530, the node where PAINT places mitochondrion for the eukaryotic beta subunits.
      The organelle that holds the enzyme in Blastocystis is a mitochondrion-related organelle, which the usage comment
      of GO:0005739 directs to hydrogenosome or mitosome; the gene already carries hydrogenosome. The paper on this enzyme
      locates the alpha subunit, in a subtype 4 isolate, with a mitochondrial stain.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Root organelle policy: the row is a synthesis row, so what it rests on was checked. The PAINT origin of the
      term is the duplication node at the base of the eukaryotic beta subunits, seeded from both daughter clades by whole-organelle
      assays, which is why the term stops at the organelle. Whether B3FHP0 belongs to the clade that inherited the location
      is a question about the organelle of Blastocystis. The usage comment of GO:0005739 (QuickGO, 2026-11-18) says that
      some anaerobic or microaerophilic organisms do not have mitochondria and contain mitochondrion-related organelles,
      called mitosomes or hydrogenosomes, and that gene products located there are to be annotated to GO:0032047 mitosome
      or GO:0042566 hydrogenosome; the review it cites for the list of species (PMID:24316280) names Blastocystis hominis.
      The Blastocystis organelle lacks complexes III and IV and an F1Fo ATPase and has an [FeFe] hydrogenase. GO does
      not class the hydrogenosome under mitochondrion, so this row and the hydrogenosome rows name one organelle under
      two unrelated terms, and the hydrogenosome rows are the ones that follow the usage comment. The row is not removed
      and not treated as plainly wrong: unlike the Trichomonas hydrogenosome, the Blastocystis organelle keeps a genome,
      cristae, a membrane potential and complexes I and II, its investigators call it a mitochondrion-like organelle or
      an anaerobic mitochondrion, the paper on this enzyme uses a mitochondrial stain and the word mitochondria, and hydrogen
      production has not been shown. It is not modified to hydrogenosome, which is not a descendant of mitochondrion
      and is not what the graft supports. For the beta subunit the location in the organelle is itself an inference:
      the experiment localised the alpha subunit of a subtype 4 isolate with an antiserum against the pig protein, the
      antibodies against the beta subunit failed, and the two recombinant subunits co-purify. No sub-compartment row
      is added. No assay resolves one for either subunit, and cleavage of the predicted presequence has not been shown.
      The same action is taken on the mitochondrion row of the alpha subunit SCSa.'
