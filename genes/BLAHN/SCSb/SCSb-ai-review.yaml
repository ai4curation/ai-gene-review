core_functions:
- description: Beta subunit of the ATP-specific succinyl-CoA synthetase of the Blastocystis mitochondrion-related organelle.
    With the alpha subunit it interconverts succinyl-CoA, ADP and phosphate with succinate, ATP and CoA; the subunit carries
    the nucleotide site, and the enzyme has no detectable activity with GTP. The activity was measured with the recombinant
    alpha/beta enzyme; the location of the beta subunit is inferred from the alpha subunit (located in a subtype 4 isolate), the complex and a predicted presequence, and the activity has not been measured in the organelle of this strain.
