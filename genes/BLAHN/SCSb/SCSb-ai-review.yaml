gene_symbol: SCSb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:478820
  label: Blastocystis sp. ATCC 50177/Nand II
description: Beta subunit of the succinyl-CoA synthetase (succinate--CoA ligase, EC 6.2.1.5) of Blastocystis, an anaerobic
  stramenopile of the human gut. With the alpha subunit SCSa it forms an enzyme that interconverts succinyl-CoA, ADP and
  phosphate with succinate, ATP and CoA. The beta subunit carries the ATP-grasp nucleotide site. The recombinant enzyme
  is specific for ATP and has no detectable activity with GTP, although the subunit has glutamine at position 20 of the
  mature chain, the residue that contacts the guanine base in GTP-specific enzymes of animals. In crystal structures of
  the nucleotide-binding domain this glutamine hydrogen-bonds the adenine base, and exchanging two lysines at the entrance
  of the nucleotide site for acidic residues lets the enzyme use GTP. The protein is made with an N-terminal targeting sequence.
  The alpha subunit has been located, in a subtype 4 isolate, in the mitochondrion-related organelle of Blastocystis, which has cristae, a membrane
  potential and a genome but lacks a complete tricarboxylic acid cycle and oxidative phosphorylation, and the beta subunit
  is inferred to be there with it. In this organelle the enzyme is thought to form ATP by substrate-level phosphorylation
  from succinyl-CoA supplied by acetate:succinate CoA-transferase; this role has not been measured in the organism. Blastocystis
  has a single type of beta subunit, and its position relative to the two beta-subunit lineages of other eukaryotes is unresolved.
