    acid cycle; a transcript for acetate:succinate CoA-transferase exists, and that activity and succinate thiokinase activity
    are present in organelle fractions of another subtype. Not established: formation of ATP by the enzyme in the organelle,
    acetate as an end product of this strain, and the share of cellular ATP that comes from this step.'
