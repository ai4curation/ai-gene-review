  - UniPathway:UPA00223
  review:
    summary: IEA combining InterPro IPR005809, the UniRule, UniPathway UPA00223 and a TreeGrafter placement. Blastocystis
      has no complete tricarboxylic acid cycle, and the paper that characterised this enzyme says it is not part of the
      route that the remaining enzymes form.
    action: REMOVE
    reason: An electronic inference that the biology of the organism contradicts, argued from papers read in full. GO:0006099
      is the cycle in which the acetyl group of acetyl-CoA is oxidised. No transcripts were found for citrate synthase,
      aconitase, isocitrate dehydrogenase or 2-oxoglutarate dehydrogenase in this organism; the subtype 7 genome paper predicts
      a partial Krebs cycle, and enzyme assays on subtype 7 organelles (abstract) describe an incomplete one. The enzymes
      that are present are read as malate dismutation, which runs from malate to succinate, and the authors state that SCS
      is outside that route. Its proposed role is ATP formation from succinyl-CoA supplied by acetate:succinate CoA-transferase.
      The absence of the four enzymes rests on transcript and genome surveys, not on a demonstration, so the two source
      defects ask for a check. GO:0006104 succinyl-CoA metabolic process, accepted in this review, records what the enzyme
      does without asserting the cycle.
    supported_by:
