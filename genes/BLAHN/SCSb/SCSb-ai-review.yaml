suggested_questions:
- question: How should the organelle of Blastocystis be annotated in GO? It has a genome, cristae and a membrane potential,
    and also an [FeFe] hydrogenase, with no hydrogen production demonstrated. UniProt records it as a hydrogenosome and TreeGrafter adds mitochondrion. The usage comment of GO:0005739 directs gene products of mitochondrion-related organelles to GO:0032047 mitosome or GO:0042566 hydrogenosome, and this review follows it; the review that the comment cites (PMID:24316280) names mitochondrion-like organelles as a third kind beside mitosomes and hydrogenosomes. Is hydrogenosome the intended term for an organelle of that kind in which hydrogen production has not been shown, and can TreeGrafter withhold mitochondrion from such organisms?
- question: The hydrogenosome annotation on this entry has an experimental evidence code from PMID:18452512, which localised
    the alpha subunit in a subtype 4 isolate and reports that the antibodies against the beta subunit failed. Should the beta entry carry a curator-inference
    code instead?
- question: UniProt states that the protein is found in the matrix of the organelle and cites PMID:18452512. The main text
    of that paper does not mention a matrix. Does the statement rest on a supplementary figure or on another source?
- question: Should the UniRule and UniPathway statements that place succinyl-CoA synthetase in the tricarboxylic acid cycle
    exclude organisms without a complete cycle, such as Blastocystis and Trichomonas?
- question: Is there a place in GO for the cycle of acetate:succinate CoA-transferase and succinyl-CoA synthetase that conserves
    the energy of acetyl-CoA as ATP in anaerobic mitochondria and hydrogenosomes? No term for it, or for substrate-level
    phosphorylation, was found.
- question: TreeGrafter places this sequence at the eukaryotic duplication node PTN000212530, and sequence trees do not
    resolve whether the single stramenopile-type beta subunit of Blastocystis descends from the SUCLA2-type or the SUCLG2-type
    copy. Does PANTHER regard the placement at the duplication node as a statement that the sequence could not be assigned
    to either daughter?
suggested_experiments:
- hypothesis: The beta subunit is in the lumen of the organelle after removal of a 14-residue presequence.
  description: Raise an antibody against the Blastocystis beta subunit, or express an epitope-tagged copy, and locate it
    by immunogold electron microscopy. Determine the N-terminus of the organellar protein. Fractionate purified organelles
    by protease protection and carbonate extraction.
- hypothesis: In the organelle the enzyme runs from succinyl-CoA to succinate and forms ATP, with succinyl-CoA supplied
    by acetate:succinate CoA-transferase.
  description: Incubate isolated organelles of subtype 1 with acetyl-CoA, succinate, ADP and phosphate and measure ATP and
    acetate. Follow labelled glucose or pyruvate to acetate and succinate in culture.
- hypothesis: GTP is excluded both by the two lysines at the entrance of the nucleotide site and by the conformation of
    the site around Gln20.
  description: Solve structures of the alpha/beta enzyme, wild type and the Lys46Glu/Lys114Asp mutant, with ATP and GTP
    analogues. Measure kinetics with both nucleotides for Gln20 exchanged for Pro and for each lysine exchanged singly.
- hypothesis: The native enzyme of Blastocystis, like the recombinant one, does not use GDP.
  description: Assay succinyl-CoA synthetase in organelle fractions of subtype 1 in both directions with ATP/ADP and GTP/GDP,
    with controls for nucleoside diphosphate kinase.
- hypothesis: Succinyl-CoA synthetase is required for normal growth of Blastocystis.
  description: Deplete or inhibit the enzyme in culture and measure growth, ATP content and the end products acetate and
    succinate.
