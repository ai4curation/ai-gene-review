- id: PMID:18452512
  title: Localization and nucleotide specificity of Blastocystis succinyl-CoA synthetase.
  findings:
  - statement: The recombinant alpha/beta enzyme of strain NandII, expressed without targeting sequences, is ATP-specific
      with no detectable activity with GTP; Km for ATP 68 uM.
    supporting_text: the recombinant Blastocystis SCS showed no detectable activity with GTP
  - statement: Gln at position 20 does not make the enzyme GTP-specific.
    supporting_text: the appearance of Gln at position 20 in Blastocystis SCS coupled with its ATP specificity indicates
      that it is not this residue that dictates nucleotide specificity
    residue_mappings:
    - as_reported:
        accession: MatureChain:B3FHP0_15-416
        position: 20
        residue: Q
      canonical:
        accession: UniProtKB:B3FHP0
        position: 34
        residue: Q
        sequence_version: 1
      note: Numbering of the mature beta subunit, as in pig SCS. The UniProt record predicts a 14-residue transit peptide
        (CHAIN 15..416), so mature position n is precursor position n + 14; the surrounding sequence is GRA[Q]SGE.
  - statement: A homology model, docking and molecular dynamics suggest that two lysines at the rim of the nucleotide site,
      in place of Glu42 and Asp110 of the pig enzyme, keep GTP out. This is a computational result.
    supporting_text: The rim surrounding the binding site in Blastocystis SCS thus acts as an electrostatic gatekeeper that
      prevents GTP from orienting in the bound conformation.
  - statement: Tagged alpha and beta subunits co-purify.
    supporting_text: Affinity purification of the expressed proteins showed the co-purification of the α–β complex
  - statement: The alpha subunit colocalises with MitoTracker in cells of isolate DMP/02-328 (subtype 4; the entry is from subtype 1 strain NandII). The beta subunit was not detected, and its location is inferred.
    supporting_text: Unfortunately, neither the anti-pig-SCSβ antibody nor the anti-Neocallimastix-SCSβ antibody recognized
      Blastocystis SCSβ. However, given the presence of a typical targeting signal and the presence of the alpha subunit
      in the mitochondria, the beta subunit is likely to be localized to the mitochondria as well.
  - statement: Blastocystis does not have a normal TCA cycle, and SCS is not part of the malate dismutation route; it is
      proposed to form ATP from succinyl-CoA supplied by acetate:succinate CoA-transferase.
    supporting_text: The end-product of this pathway is succinate and SCS is not part of this route.
  - statement: Only one type of beta subunit was found, and the trees do not resolve its position.
    supporting_text: fail to resolve the position of Blastocystis within the eukaryotes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read in the cache; supplementary figures and tables not read. The only reference of the UniProt
      entry and the source of both experimental GO rows. The activity row is supported directly. The location row is supported for the alpha subunit only, in a subtype 4 isolate and with an antiserum against the pig protein; for the beta subunit the paper states an inference. The paper does not call the organelle
      a hydrogenosome and does not mention a matrix in its main text. Its concluding remarks write Glu 20 where Gln 20 is
      meant.
