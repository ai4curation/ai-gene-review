- id: PMID:18452512
  title: Localization and nucleotide specificity of Blastocystis succinyl-CoA synthetase.
  findings:
  - statement: The recombinant alpha/beta enzyme of strain NandII, expressed without targeting sequences, forms succinyl-CoA
      with ATP and has no detectable activity with GTP; Km for ATP 68 uM, kcat 133 per min.
    supporting_text: the recombinant Blastocystis SCS showed no detectable activity with GTP, but a rate of 0.028 nmol s−1
      with ATP
  - statement: The His-tagged alpha subunit and the S-tagged beta subunit co-purify; the stoichiometry is not reported.
    supporting_text: Affinity purification of the expressed proteins showed the co-purification of the α–β complex
  - statement: An antiserum against pig SCS alpha detects a band of about 32 kDa and colocalises with MitoTracker. The cells
      were a subtype 4 isolate, not the strain of the sequence.
    supporting_text: Confocal microscopy showed the pig anti-SCSα colocalized with Mitotracker orange, a mitochondrion-specific
      stain
  - statement: Both subunits have a predicted N-terminal targeting sequence; cleavage was not shown.
    supporting_text: The Blastocystis SCS leader sequences also have arginine at position −2 from the putative cleavage
      site
  - statement: Blastocystis does not have a normal TCA cycle, and SCS is not part of the malate dismutation route; it is
      proposed to form ATP from succinyl-CoA supplied by acetate:succinate CoA-transferase.
    supporting_text: The end-product of this pathway is succinate and SCS is not part of this route.
  - statement: Only one type of beta subunit was found among the transcripts.
    supporting_text: only one type of SCSβ was found among the Blastocystis ESTs
  - statement: In a homology model on pig SCS the alpha subunit is 70% identical to its template.
    supporting_text: the sequence identities of the alpha and beta subunits were 70% and 49%
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read in the cache; supplementary figures and tables not read. The only literature reference
      of the UniProt entry and the source of both experimental GO rows. The activity row is supported directly for the
      alpha/beta enzyme. The location row is supported for the alpha subunit of a subtype 4 isolate detected with an antiserum
      against the pig protein. The paper does not call the organelle a hydrogenosome and does not mention a matrix in its
      main text. Its concluding remarks write Glu 20 where Gln 20 of the beta subunit is meant.
