id: B3FHT4
gene_symbol: SCSa
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:478820
  label: Blastocystis sp. ATCC 50177/Nand II
description: Alpha subunit of the succinyl-CoA synthetase (succinate--CoA ligase, EC 6.2.1.5) of Blastocystis, an anaerobic
  stramenopile of the human gut. With the beta subunit SCSb it forms an enzyme that interconverts succinyl-CoA, ADP and
  phosphate with succinate, ATP and CoA. In enzymes of this family the alpha subunit binds CoA and carries the histidine
  that is transiently phosphorylated during the reaction, and the beta subunit binds the nucleotide; for the Blastocystis
  alpha subunit these roles are inferred from sequence conservation, and the histidine is His271 of the precursor. The
  recombinant alpha/beta enzyme is specific for ATP and has no detectable activity with GTP. The alpha subunit also forms
  an active ATP-using enzyme with the beta subunit of Plasmodium falciparum, as expected for the subunit that does not
  select the nucleotide. The protein is made with an N-terminal targeting sequence, and an antiserum against the alpha
  subunit stains the mitochondrion-related organelle of Blastocystis, which has cristae, a membrane potential, a genome
  and an [FeFe] hydrogenase but lacks a complete tricarboxylic acid cycle and oxidative phosphorylation. In this organelle
  the enzyme is thought to form ATP by substrate-level phosphorylation from succinyl-CoA supplied by acetate:succinate
  CoA-transferase; this role has not been measured in the organism.
