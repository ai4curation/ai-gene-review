core_functions:
- description: Alpha subunit of the ATP-specific succinyl-CoA synthetase of the Blastocystis mitochondrion-related organelle.
    With the beta subunit SCSb it interconverts succinyl-CoA, ADP and phosphate with succinate, ATP and CoA. By conservation
    with other enzymes of the family it supplies the CoA site and the phosphohistidine (His271), and the beta subunit supplies
    the nucleotide site; neither role has been tested on this protein. The activity was measured with the recombinant alpha/beta
    enzyme in the direction of succinyl-CoA formation. The location was shown for the orthologous alpha subunit of a subtype
    4 isolate, and the activity has not been measured in the organelle of this strain.
