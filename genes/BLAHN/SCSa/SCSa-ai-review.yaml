- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN000874228
  review:
    summary: TreeGrafter IEA through PTN000874228. The term comes from the eukaryotic node PTN000122014, where PAINT places
      mitochondrion for the alpha subunits. The organelle that holds this protein in Blastocystis is a mitochondrion-related
      organelle, which GO's usage comment on this term directs to hydrogenosome or mitosome; the gene already carries hydrogenosome
      on experimental evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Root organelle policy: the row is a synthesis row, so what it rests on was checked. The PAINT origin is the
      eukaryotic node, seeded by whole-organelle evidence from plants, animals, yeast and a trypanosome, and the question
      for B3FHT4 is whether its organism belongs to the clade that kept a mitochondrion in the sense of the term. The usage
      comment on GO:0005739 says that organisms with mitochondrion-related organelles do not have mitochondria and that
      gene products in those organelles are to be annotated to GO:0042566 hydrogenosome or GO:0032047 mitosome, and the
      review it cites lists Blastocystis among such organisms. The Blastocystis organelle lacks complexes III and IV and
      an F1Fo ATPase and has the [FeFe] hydrogenase. GO does not class the hydrogenosome under mitochondrion, so the two
      rows on this gene name the same organelle under two unrelated terms, and the experimental one follows the usage comment.
      The row is not removed and not treated as plainly wrong: the organelle is a mitochondrial derivative with cristae,
      a membrane potential, a genome and complexes I and II, the paper on this protein uses a mitochondrial stain and the
      word mitochondria, some authors call it an anaerobic mitochondrion, and hydrogen production has not been shown. It
      is not modified to hydrogenosome either: that term is not a descendant, the row''s own evidence is the graft, and
      the class of the organelle is contested. The alpha family review proposes pruning this term for the Trichomonas
      clade on the same ground. The review of the beta subunit SCSb takes the same action on its mitochondrion row.'
    supported_by:
    - reference_id: PMID:24316280
      supporting_text: mitochondrion-related organelles (MROs), such as mitosomes, hydrogenosomes, and mithochondrion-like
        organelles, which are found in a wide range of anaerobic/microaerophilic eukaryotes that include several medically
