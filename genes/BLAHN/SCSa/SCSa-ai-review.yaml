      and showed no detectable activity in either.
    action: REMOVE
    reason: An over-propagated electronic inference that assays on this gene product contradict; both papers were read
      in the cache with full text. Whether an alpha subunit takes part in GDP-forming activity is decided by its beta partner.
      The node placement is defensible for the family, because animal and Dictyostelium genomes supply a GTP-using beta
      subunit and the E. coli enzyme accepts both nucleotides. Blastocystis does not meet the condition. Only one type of
      beta subunit was found among its transcripts, and the enzyme made from that subunit and this alpha subunit had no
      detectable activity with GTP when the two were co-expressed (PMID:18452512) and when they were refolded from separately
      expressed subunits (PMID:27478903). The enzyme of this alpha subunit with the Plasmodium falciparum beta subunit is
      also ADP-forming. The alpha family review lists B3FHT4 as a member exception for this term, and S. cerevisiae LSC1,
      an assayed ATP-specific enzyme, has the same action. The removal says nothing against the node. B3FHT4 is not a leaf of the tree, so a loss annotation in PAINT would not
      by itself stop this TreeGrafter row; the source defect asks how such sequences are handled. The residual possibility
      is an activity with GTP below the detection limit of the two assays.
