  qualifier: involved_in
  review:
    summary: Proposed row. The recombinant enzyme made of this alpha subunit and the beta subunit converts succinate, ATP
      and CoA to succinyl-CoA.
    action: NEW
    reason: 'The gene has no process annotation that survives this review, and the assay of the enzyme supports this one
      directly. The term names the metabolite and no pathway or direction, which fits: the enzyme was assayed toward succinyl-CoA
      formation, and its proposed direction in the cell is cleavage of succinyl-CoA with formation of ATP. The alpha subunit
      does part of the work of the reaction, so the term is not proposed for a mere requirement. Comparator check by gene
      product and term id in QuickGO on 2026-11-18, a query that returns positives: the alpha subunits S. cerevisiae LSC1
      (IDA), S. pombe SPAC16E8.17c (ISS) and Dictyostelium scsA (TAS) carry GO:0006104, and so does the partner B3FHP0 (TreeGrafter
      IEA), so the absence here reflects the PAINT tree of the alpha family, which has no such term, and not a convention.
      A more specific process is not supported: the cell-level role is a proposal, and GO has no term for the cycle of
      acetate:succinate CoA-transferase and succinyl-CoA synthetase. The term is used as the process of the core function.'
