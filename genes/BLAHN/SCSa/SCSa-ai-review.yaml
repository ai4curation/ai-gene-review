- term:
    id: GO:0042566
    label: hydrogenosome
  evidence_type: EXP
  original_reference_id: PMID:18452512
  qualifier: located_in
  review:
    summary: EXP from Hamblin et al. 2008, read in full. An antiserum against pig SCS alpha recognises one band of the size
      of the processed alpha subunit in a Blastocystis lysate and colocalises with MitoTracker in the cells. The paper calls
      the organelle mitochondrion-like and never a hydrogenosome.
    action: ACCEPT
    reason: The experiment is on the alpha subunit, and the claim that the protein is in the organelle of Blastocystis is
      sound. Hydrogenosome is the term GO provides for it. The usage comment on GO:0005739 directs locations in mitochondrion-related
      organelles to hydrogenosome or mitosome, the paper excludes a mitosome because the organelle takes part in energy
      metabolism, and an [FeFe] hydrogenase localises to the organelle. The term is used as the location of the core function.
      Three limits are recorded. First, the definition of the term includes formation of molecular hydrogen, which has not
      been shown for Blastocystis, and the organelle has a genome and cristae; GO has no term for a mitochondrion-related
      organelle as a class. Second, the cells were a subtype 4 isolate and the antiserum was raised against the pig protein,
      so the observation is of the orthologous protein of another subtype; it is recorded as a source defect with a request
      to check the evidence code, not to remove the location. Third, the assay does not resolve a compartment within the
      organelle. The review of the beta subunit SCSb accepts its hydrogenosome rows on the same ground; there the location is an inference from this subunit.
