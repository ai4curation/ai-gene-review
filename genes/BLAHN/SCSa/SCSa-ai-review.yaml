suggested_questions:
- question: How should the organelle of Blastocystis be annotated in GO? It has a genome, cristae and a membrane potential,
    and also an [FeFe] hydrogenase, with no hydrogen production demonstrated. The usage comment on GO:0005739 sends mitochondrion-related
    organelles to hydrogenosome or mitosome, and neither definition fits fully. Should GO add a grouping term for mitochondrion-related
    organelles, and should the two subunits carry mitochondrion, hydrogenosome, or both?
- question: TreeGrafter gives this entry GO:0004776 succinate-CoA ligase (GDP-forming) activity although the enzyme has
    no detectable activity with GTP in two studies. The sequence is grafted at PTN000874228 and is not a leaf of the tree,
    so a PAINT loss would not reach it. Is there a mechanism to stop an experimentally contradicted term on a grafted sequence?
- question: The hydrogenosome annotation on this entry has an experimental evidence code from PMID:18452512, whose cells
    were a subtype 4 isolate and whose antiserum was raised against the pig protein. Is an experimental code on the subtype
    1 entry intended?
- question: UniProt states that the protein is found in the matrix of the organelle and cites PMID:18452512. The main text
    of that paper does not mention a matrix. Does the statement rest on a supplementary figure or on another source?
- question: Should the UniRule and UniPathway statements that place succinyl-CoA synthetase in the tricarboxylic acid cycle
    exclude organisms without a complete cycle, such as Blastocystis and Trichomonas?
- question: The SUBUNIT comment of the UniProt entry (heterodimer) carries only the HAMAP rule, although PMID:18452512 shows
    co-purification of the tagged subunits. Should the comment cite the paper, and is the stoichiometry known?
suggested_experiments:
- hypothesis: The alpha subunit is in the lumen of the organelle after removal of an 18-residue presequence.
  description: Raise an antibody against the Blastocystis alpha subunit and locate it in cells of subtype 1 by immunogold
    electron microscopy. Determine the N-terminus of the organellar protein. Fractionate purified organelles by protease
    protection and carbonate extraction.
- hypothesis: In the organelle the enzyme runs from succinyl-CoA to succinate and forms ATP, with succinyl-CoA supplied
    by acetate:succinate CoA-transferase.
  description: Assay the purified enzyme with succinyl-CoA, ADP and phosphate. Incubate isolated organelles of subtype 1
    with acetyl-CoA, succinate, ADP and phosphate and measure ATP and acetate. Follow labelled glucose or pyruvate to acetate
    and succinate in culture.
- hypothesis: His271 of the alpha subunit is the phosphorylated intermediate, and the alpha subunit binds CoA without the
    beta subunit.
  description: Exchange His271 and measure activity and phosphorylation of the enzyme by labelled ATP. Measure CoA binding
    by the isolated alpha subunit. Solve a structure of the alpha/beta enzyme and determine its native mass by size exclusion
    with light scattering.
- hypothesis: The alpha subunit imposes no nucleotide preference, so its enzyme with a GTP-specific beta subunit forms GTP.
  description: Refold the Blastocystis alpha subunit with a GTP-specific beta subunit, such as pig or human SUCLG2, and
    with the gatekeeper mutants of the Blastocystis beta subunit, and measure kinetics with ATP and GTP.
- hypothesis: Succinyl-CoA synthetase is required for normal growth of Blastocystis.
  description: Deplete or inhibit the enzyme in culture and measure growth, ATP content and the end products acetate and
    succinate.
