  label: Enterobacteria phage PRD1
description: Protein P32 (gene XXXII) is a 54-residue single-pass integral membrane protein of the Enterobacteria phage PRD1
  viral inner membrane (`Pfam:PF11087`, `InterPro:IPR020085`) containing an N-terminal transmembrane helix (residues 4-24).
  Related to PRD1 protein P34 (gene XXXIV), P32 is a component of the phage DNA injection machinery required for the spherical-to-tubular
  transformation of the internal viral membrane vesicle and formation of the membrane tail tube that delivers the viral dsDNA
  genome into the host bacterial cytosol.
