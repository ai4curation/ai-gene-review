suggested_questions:
- question: To what extent are paralogous viral inner-membrane proteins P32 (single-pass, 54 aa) and P34 (two-pass, 68 aa)
    functionally redundant during PRD1 membrane tail-tube assembly and host envelope penetration?
  experts:
  - Dennis H. Bamford
  - Hanna M. Oksanen
suggested_experiments:
- description: Construct single and double knockout mutants of genes XXXII (P32) and XXXIV (P34) in PRD1 and assay virion
    assembly, membrane tube formation, and single-step DNA entry kinetics into Salmonella enterica and Escherichia coli hosts.
  hypothesis: P32 and P34 share a conserved N-terminal transmembrane helix (`Pfam:PF11087`) that allows partial functional
    compensation in single mutants, whereas loss of both proteins abolishes membrane tube extension and DNA delivery.
  experiment_type: Double-mutant genetic epistasis and cryo-EM tube formation assay
