suggested_questions:
- question: What is the molecular interaction partner of homotetrameric P17 during late procapsid assembly, and does it act as a chaperone for P3 trimers or for the P10-coated membrane vesicle?
suggested_experiments:
- description: Perform co-immunoprecipitation and cross-linking mass spectrometry of P17 during PRD1 infection to identify transient interactions with P3, P10, or viral inner membrane proteins.
