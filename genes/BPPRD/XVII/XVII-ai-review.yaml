id: P27383
gene_symbol: XVII
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Nonstructural homotetrameric assembly factor (protein P17, 86 amino acids) required late in bacteriophage PRD1 procapsid morphogenesis inside the bacterial host cell. Acts together with the major coat protein P3 and the membrane scaffold factor P10 so that capsid protein multimers enclose the host-derived viral lipid membrane containing virus-encoded membrane proteins.
references:
- id: file:BPPRD/XVII/XVII-uniprot.txt
  title: UniProtKB entry for P27383 (VP17_BPPRD)
  findings:
  - statement: P17 is a homotetrameric assembly protein that acts late in phage assembly, after capsid protein folding/multimerization and membrane protein sorting, working with P3 and P10 to enclose the host-derived membrane within the capsid inside the host cell.
    supporting_text: Assembly protein that acts late in phage assembly, after capsid protein folding and multimerization, and sorting of membrane proteins has occurred. The major coat protein P3 and two assembly factors (P10 and P17) are needed during the assembly of the virus particle inside the host cell, when the capsid protein multimers are capable of enclosing the host-derived membrane, containing the virus- encoded membrane-associated proteins.
