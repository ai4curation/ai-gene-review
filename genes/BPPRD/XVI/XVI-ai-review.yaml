suggested_questions:
- question: How does the conformational transition of the disordered segments of P16 (`DP01012`) couple receptor-triggered
    vertex uncapping (loss of P31/P5/P2) to the destabilization and tubular transformation of the underlying viral inner membrane?
  experts:
  - Nicola G. A. Abrescia
  - Dennis H. Bamford
  - David I. Stuart
suggested_experiments:
- description: Compare thermal and mechanical vertex stability and in vitro heat/pH-triggered membrane tube formation between
    wild-type PRD1 virions and P16-deficient mutant particles using atomic force microscopy (AFM) nanoindentation and cryo-EM.
  hypothesis: Loss of P16 uncouples the penton vertex from the underlying viral lipid vesicle, reducing the mechanical stiffness
    of the fivefold vertices and impairing coordinated membrane tube extrusion upon vertex opening.
  experiment_type: Atomic force microscopy nanoindentation and cryo-EM
