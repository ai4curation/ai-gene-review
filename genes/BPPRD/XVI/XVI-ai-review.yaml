  label: Enterobacteria phage PRD1
description: Protein P16 (gene XVI) is a 117-residue single-pass integral membrane protein of the Enterobacteria phage PRD1
  viral inner membrane (`Pfam:PF09301`, `PDB:1W8X`). Located at the fivefold icosahedral vertices via an N-terminal transmembrane
  helix (residues 7-24) and a structured C-terminal vertex-interacting region (residues 34-93), P16 anchors the capsid vertex
  complex to the underlying viral lipid membrane, increases vertex stability, and is essential for viral infectivity.
