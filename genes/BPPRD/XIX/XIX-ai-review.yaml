id: P17638
gene_symbol: XIX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Nonstructural single-stranded DNA-binding protein (protein P19) of bacteriophage PRD1 that binds unpackaged viral DNA in the bacterial host cytoplasm and is displaced from the viral genome during DNA packaging into the procapsid.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:17202207
  title: Efficient DNA packaging of bacteriophage PRD1 requires the unique vertex protein P6.
  findings:
  - statement: P19 is a nonstructural single-stranded DNA-binding protein (~10.5 kDa) that associates with unpackaged viral DNA and is normally removed during the genome packaging process, but remains attached to empty particles resulting from abortive packaging in P6-deficient (Sus621) mutant infections.
    supporting_text: The identity of this band was confirmed by N-terminal amino acid sequencing to be PRD1 single-stranded DNA binding protein P19, which is a nonstructural protein and not seen in empty or filled wt PRD1 particles ( 57 , 73 ).
  - statement: P19 is associated with unpackaged viral DNA in the infected host cell and is stripped off during successful DNA packaging.
    supporting_text: Since no P19 was observed in filled or empty wt particles, we assume that P19 is normally associated with unpackaged DNA and is removed during the packaging process.
- id: file:BPPRD/XIX/XIX-uniprot.txt
  title: UniProtKB entry for P17638 (VP19_BPPRD)
  findings:
  - statement: Protein P19 binds to single-stranded DNA (ssDNA).
    supporting_text: Binds to single-stranded DNA (ssDNA).
