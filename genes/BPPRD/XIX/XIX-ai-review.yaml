  review:
    summary: Spurious keyword-derived annotation; P19 binds single-stranded DNA, not free nucleotides.
    action: REMOVE
    reason: Derived from an erroneous UniProt keyword mapping (KW-0547 Nucleotide-binding). P19 is a single-stranded DNA-binding protein and does not bind monomeric nucleotides.
