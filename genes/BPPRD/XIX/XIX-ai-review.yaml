suggested_questions:
- question: What is the precise biological role of P19 binding to unpackaged PRD1 DNA prior to packaging, and how is P19 stripped from the genome at the P6/P9 packaging vertex?
suggested_experiments:
- description: Perform in vitro DNA packaging assays with varying concentrations of purified P19 to test whether P19 stimulates or regulates P9-dependent DNA translocation into empty procapsids.
