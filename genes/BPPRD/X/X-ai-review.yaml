id: P28732
gene_symbol: X
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Nonstructural membrane-scaffolding assembly protein (protein P10, 203 amino acids) essential for bacteriophage PRD1 procapsid morphogenesis inside the host cell. Coats virus-specific lipid vesicles pinched off from the host cytoplasmic membrane to form a membrane-vesicle scaffold on top of which the major coat protein P3 and capsid proteins assemble.
references:
- id: PMID:17202207
  title: Efficient DNA packaging of bacteriophage PRD1 requires the unique vertex protein P6.
  findings:
  - statement: Empty PRD1 procapsids are formed by assembling the coat protein onto a membrane vesicle coated with the nonstructural membrane scaffold protein P10, which is essential for the formation of virus-specific lipid vesicles.
    supporting_text: However, in PRD1, the empty procapsids are not formed by assembly of the coat protein on top of a protein scaffold but rather by using a membrane vesicle coated with PRD1 protein P10 as a scaffold ( 78 ).
  - statement: Protein P10 is a nonstructural protein essential for forming the virus-specific lipid vesicles on which PRD1 capsid proteins assemble.
    supporting_text: Protein P10 is a nonstructural protein that is essential in the formation of virus-specific lipid vesicles, on top of which the PRD1 capsid proteins are assembled ( 78 ).
- id: file:BPPRD/X/X-uniprot.txt
  title: UniProtKB entry for P28732 (VP10_BPPRD)
  findings:
  - statement: P10 is an assembly factor needed together with P17 and the major coat protein P3 during assembly of the virus particle inside the host cell to enclose the host-derived membrane containing virus-encoded membrane proteins.
    supporting_text: Assembly protein. The major coat protein P3 and two assembly factors (P10 and P17) are needed during the assembly of the virus particle inside the host cell, when the capsid protein multimers are capable of enclosing the host-derived membrane, containing the virus- encoded membrane-associated proteins.
