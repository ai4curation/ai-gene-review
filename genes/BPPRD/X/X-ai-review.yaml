suggested_questions:
- question: How does P10 induce curvature and budding of virus-specific lipid vesicles from the bacterial host cytoplasmic membrane, and how is P10 displaced as the P3 capsid shell closes?
suggested_experiments:
- description: Perform cryo-electron tomography of PRD1-infected Escherichia coli cells to visualize P10-coated membrane vesicle budding and P3 coat assembly intermediates in situ.
