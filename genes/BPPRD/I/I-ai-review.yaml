- id: PMID:1655759
  title: Overexpression, purification, and characterization of Escherichia coli bacteriophage PRD1 DNA polymerase. In vitro synthesis of full-length PRD1 DNA with purified proteins.
  findings:
  - statement: Purified 65 kDa PRD1 DNA polymerase (P1) possesses DNA-directed DNA polymerase activity, single-stranded DNA-specific 3'-5' proofreading exonuclease activity, and P8-dGMP replication initiation complex formation activity, and synthesizes full-length PRD1 genomic DNA in vitro.
    supporting_text: DNA polymerase, 3'-5'-exonuclease, and P8-dGMP replication initiation complex formation activities cosedimented in glycerol gradient with a protein of 65 kDa, the size expected for PRD1 DNA polymerase.
  - statement: The 3'-5' exonuclease activity of P1 specifically degrades single-stranded DNA and releases mononucleotides, with no 5'-3' exonuclease activity detected.
    supporting_text: The 3'-5'-exonuclease activity was specific for single-stranded DNA and released mononucleotides. No 5'-3'-exonuclease activity was detected.
  - statement: Formation of the P8-dGMP initiation complex by P1 is required for protein-primed synthesis of genome-length PRD1 DNA.
    supporting_text: Formation of the P8-dGMP replication initiation complex was a prerequisite for phage DNA replication, which proceeded from the initiation complex and yielded genome length replication products.
- id: file:BPPRD/I/I-uniprot.txt
  title: UniProtKB entry for P10479 (DPOL_BPPRD)
  findings:
  - statement: P1 is a type-B family DNA-directed DNA polymerase with an N-terminal 3'-5' proofreading exonuclease domain and a C-terminal polymerase domain that replicates viral genomic DNA using a terminal protein primer.
    supporting_text: "Replicates the viral genomic DNA. This polymerase possesses two enzymatic activities: DNA synthesis (polymerase) and an exonucleolytic activity that degrades single-stranded DNA in the 3'- to 5'-direction for proofreading purpose."
