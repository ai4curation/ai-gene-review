suggested_questions:
- question: How does the TPR2 insertion subdomain of PRD1 DNA polymerase P1 coordinate strand displacement synthesis without an accessory helicase, and how does it transition from terminal protein P8 priming to processive elongation?
suggested_experiments:
- description: Determine high-resolution cryo-EM structures of the PRD1 P1-P8-template DNA initiation complex and early elongation intermediates to resolve the conformational transition of P1 during protein-primed initiation.
