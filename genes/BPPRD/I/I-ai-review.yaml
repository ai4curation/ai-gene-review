id: P10479
gene_symbol: I
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Protein-primed family B DNA-directed DNA polymerase (protein P1) that replicates the linear double-stranded DNA genome of bacteriophage PRD1 in the bacterial host cytoplasm. Possesses a C-terminal polymerase domain that initiates replication by catalyzing formation of the terminal protein P8-dGMP initiation complex and elongating full-length viral DNA, as well as an N-terminal 3'-5' exonuclease domain that degrades single-stranded DNA for proofreading.
