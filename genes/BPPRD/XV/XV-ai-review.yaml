id: P13559
gene_symbol: XV
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: >-
  Endolysin (protein P15) of the lipid-containing, broad-host-range tectivirus
  bacteriophage PRD1, a 149-residue, 17.3 kDa glycosyl hydrolase family 24 enzyme
  encoded by gene XV. P15 is a beta-1,4-N-acetylmuramidase (lysozyme, EC 3.2.1.17)
  that hydrolyses the glycosidic bond between N-acetylmuramic acid and
  N-acetylglucosamine in bacterial peptidoglycan. Its principal role is in the
  terminal, lytic stage of infection: acting together with the phage holin P35,
  which permeabilizes the host cytoplasmic membrane and allows the endolysin to
  reach the murein sacculus, P15 degrades the host cell wall, lysing the cell and
  releasing progeny virions. P15 is additionally a minor structural component of
  the virion, where it is peripherally associated with the internal phage membrane
  in a manner dependent on the small integral membrane proteins P20 and P22. It is
  not, however, the muralytic enzyme responsible for penetrating the peptidoglycan
  during genome entry: that role belongs to the separate PRD1 protein P7, and
  P15-deficient particles initiate DNA replication normally.
