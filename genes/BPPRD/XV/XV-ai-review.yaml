suggested_questions:
- question: >-
    How do the small integral viral membrane proteins P20 and P22 recruit a fraction of
    soluble endolysin P15 onto the PRD1 virion inner membrane during assembly, and why
    are P2+ P15- virions partially compromised in initiating infection despite having
    intact transglycosylase P7?
  experts:
  - Dennis H. Bamford
  - Pia S. Rydman
suggested_experiments:
- description: >-
    Perform pull-down and surface plasmon resonance (SPR) binding assays with purified
    recombinant P15 and nanodisc-reconstituted P20, P22, and P20/P22 complexes, coupled
    with cryo-EM reconstruction of the vertex-adjacent inner membrane in P15-null vs
    wild-type virions.
  hypothesis: >-
    A heterodimer of integral membrane proteins P20 and P22 at the vertex base provides a
    specific cytoplasmic/inner-membrane docking site for P15 that stabilizes the
    infection vertex complex for signal transduction from receptor-binding protein P2.
  experiment_type: Nanodisc reconstitution, SPR binding assay, and cryo-EM
