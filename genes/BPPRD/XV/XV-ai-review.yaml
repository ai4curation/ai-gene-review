- id: PMID:2651121
  title: Comparison of the amino acid sequence of the lytic enzyme from broad-host-range
    bacteriophage PRD1 with sequences of other cell-wall-peptidoglycan lytic enzymes.
  findings:
  - statement: >-
      Gene XV encodes a 149-residue, 17.3 kDa lytic enzyme whose sequence is
      distinctive among characterised cell-wall lytic enzymes, with only short
      regions of similarity to phage lysozymes.
    supporting_text: >-
      The gene for the lytic enzyme of the lipid-containing, broad-host-range bacteriophage PRD1 codes for a protein of 149 amino acids (17271 Da).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; this is UniProt reference [1] for the entry's sequence. Used
      here only for the protein's size and family placement, not for function.
- id: PMID:7925454
  title: Gene XV of bacteriophage PRD1 encodes a lytic enzyme with muramidase activity.
  findings:
  - statement: >-
      Purified recombinant P15 cleaves the beta-1,4 bond between N-acetylmuramic
      acid and N-acetylglucosamine in bacterial cell walls, establishing muramidase
      (lysozyme, EC 3.2.1.17) activity.
    supporting_text: >-
      The analysis of cell wall digests indicated that P15 is a glycosidase that cleaves the beta (1-4) linkage between N-acetylmuramic acid and N-acetylglucosamine, thus displaying muramidase activity.
  - statement: >-
      P15 lyses chloroform-treated Gram-negative cells and showed no detectable
      activity against Gram-positive species in this assay.
    supporting_text: >-
      The purified protein P15, identified by N-terminal sequence analysis, showed a strong lytic activity against chloroform-treated Gram-negative cells. No activity against Gram-positive bacterial species could be detected.
  - statement: >-
      The host-lysing lytic enzyme of PRD1 had previously been assigned to gene XV by
      complementation and mutant-phage analysis, which this paper confirms by
      expressing the cloned gene.
    supporting_text: >-
      The phage lyses its host by virtue of a virally-encoded lytic enzyme, the synthesis of which has been assigned to gene XV on the basis of complementation analysis and experiments with mutant phages.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the primary characterisation of this gene product, and the
      source UniProt cites with ECO:0000269 for both the function and the EC number.
      The cached record is abstract-only, but the abstract itself states the
      enzymology and the gene assignment, so the three CACAO rows citing it can be
      judged without the full text.
- id: PMID:10931330
  title: Bacteriophage PRD1 DNA entry uses a viral membrane-associated transglycosylase
    activity.
  findings:
  - statement: >-
      The virion-associated glycolytic activity characterised in this paper belongs
      to PRD1 protein P7, a lytic transglycosylase with an accessory role in DNA
      entry, not to the gene XV product P15.
    supporting_text: >-
      We analysed wild-type PRD1 and different mutant particles in zymograms and found a glycolytic activity that was associated with protein P7.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      PubMed-verified as the paper its title and PMID claim, so not a wrong
      identifier. It is cited for a CACAO IDA row asserting lysozyme activity for
      P15, but its subject is P7 (and the mapping of P14); P15 appears only as
      context. The zymograms it presents do also contain the faster-migrating P15
      band later identified in PMID:11741849, so a figure-level reading may be
      defensible - this could not be checked, since the cached record is
      abstract-only and the GONUTS page was offline. Flagged MISCITED while the row
      itself is accepted, the claim being independently established.
- id: PMID:11741849
  title: The lytic enzyme of bacteriophage PRD1 is associated with the viral membrane.
  findings:
  - statement: >-
      P15 is a structural component of the PRD1 virion associated with the internal
      phage membrane, with its incorporation modulated by the small integral membrane
      proteins P20 and P22.
    supporting_text: >-
      We demonstrate here that P15 is also a structural component of the PRD1 virion and that it is connected to the phage membrane.
  - statement: >-
      The ~15 kDa muralytic activity of PRD1 particles in peptidoglycan zymograms is
      due to P15 and is lost in gene XV amber mutants and in P20-deficient particles.
    supporting_text: >-
      Thus, we concluded that the appearance of the faster-moving clear zone in zymograms was due to the enzymatic activity of protein P15.
  - statement: >-
      P15 activity is detectable in isolated, capsid-free phage membrane vesicles and
      in both empty and DNA-filled membranes released by guanidine treatment.
    supporting_text: >-
      Zymogram analysis revealed the presence of proteins P7 and P15 in both DNA-filled and empty phage membranes
  - statement: >-
      Unlike P7, P15 degrades Gram-positive (Micrococcus lysodeikticus) peptidoglycan
      in zymograms, consistent with the broad host range of tectiviruses.
    supporting_text: >-
      Protein P7 was found to be inactive, while protein P15 degraded peptidoglycan obtained from M. lysodeikticus and caused the appearance of a clear zone in zymograms.
  - statement: >-
      P15 is not the principal muralytic enzyme of genome entry: particles lacking it
      show no delay in the initiation or rate of phage DNA replication, which instead
      depends on P7.
    supporting_text: >-
      However, in the absence of protein P15 no delay in phage DNA replication was detected, suggesting that protein P7 is the main muralytic enzyme involved in bacteriophage PRD1 DNA entry into Salmonella cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text available in the cache (PMC134774) and read for this
      review. Supports both the virion-membrane location and the enzymology, and is
      the source of the negative result that keeps P15 out of the DNA-entry role.
- id: PMID:16030234
  title: The Holin protein of bacteriophage PRD1 forms a pore for small-molecule and
    endolysin translocation.
  findings:
  - statement: >-
      PRD1 lyses its host with a two-component holin (P35) / endolysin (P15) system
      that releases progeny phage particles.
    supporting_text: >-
      Using infected cells and plasmid-borne lysis genes, we demonstrated that a two-component lysis system (holin-endolysin) operates to release progeny phage particles from the host cell.
  - statement: >-
      The gene XV endolysin amber mutant sus232 fails to lyse the host with or without
      arsenate induction, as does the holin mutant, so both proteins are required.
    supporting_text: >-
      The same result was observed in the case of the endolysin sus232 mutant.
  - statement: >-
      Plasmid-borne expression separates the two activities: potassium leakage and
      loss of membrane voltage are functions of holin, while the endolysin is what is
      needed for lysis itself.
    supporting_text: >-
      that endolysin was needed for cell lysis
  - statement: >-
      Holin permeabilizes the cytoplasmic membrane so that the cytosolic endolysin can
      reach and attack the peptidoglycan.
    supporting_text: >-
      Holins are small hydrophobic integral membrane proteins that permeabilize the cytoplasmic membrane (CM) and allow the endolysins to attack the peptidoglycan
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text available in the cache (PMC1196050) and read for
      this review. Directly supports the CACAO GO:0044659 row: both the infection
      mutant and the reconstituted plasmid system assay the gene XV product.
suggested_questions:
- question: >-
    GO holds both GO:0003796 lysozyme activity (the EC 3.2.1.17-equivalent term) and
    GO:0033922 peptidoglycan beta-N-acetylmuramidase activity as siblings under
    GO:0004553, and PRD1 P15 carries both. Should they be merged, or is the intended
    distinction that GO:0003796 additionally covers chitodextrin hydrolysis?
- question: >-
    Does the UniProt Antimicrobial keyword (KW-0081) need splitting, or its GO mapping
    restricting, so that bacteriophage and plasmid lysis enzymes are no longer mapped
    to GO:0042742 defense response to bacterium?
- question: >-
    What, if anything, does the virion-associated copy of P15 do? It is packaged in a
    P20/P22-dependent manner and is enzymatically active in isolated phage membranes,
    yet its absence does not delay DNA entry; is it simply carried over for lysis in
    the next host, or does it contribute to penetrating the walls of the
    Gram-positive and more distant hosts of the tectiviruses?
- question: >-
    Is P15 the signal, or merely a neighbour of it, in the P2-dependent initiation of
    genome delivery? Particles supplied with P2 in trans but lacking P15 adsorb
    normally yet are compromised in initiating infection, which the authors read
    either as mispositioning of P2 or as a direct role for P15 in signalling.
suggested_experiments:
- description: >-
    Construct and propagate a P7-/P15- double mutant (so far unobtainable) using
    suppressor hosts or trans-complementation, and assay genome entry kinetics,
    peptidoglycan penetration and infectivity against Gram-negative and Gram-positive
    tectivirus hosts.
  hypothesis: >-
    The two virion-associated muralytic enzymes are partially redundant for entry,
    with P15 providing the activity needed on Gram-positive or otherwise atypical
    peptidoglycan, which is why PRD1 carries both.
- description: >-
    Cryo-electron tomography with immunolabelling or activity-based labelling of
    wild-type, P20- and P22-deficient PRD1 particles to localise P15 within the
    virion, together with a quantitative measurement of copy number per particle.
  hypothesis: >-
    P15 occupies a defined, P20/P22-tethered site at or near the special vertex of the
    internal membrane rather than being distributed over the membrane.
- description: >-
    Reconstitute the holin-endolysin step in vitro with purified P35 in proteoliposomes
    and purified P15, measuring P15 translocation across the membrane and subsequent
    sacculus digestion as a function of membrane voltage and ATP level.
  hypothesis: >-
    P15 crosses the cytoplasmic membrane only through the collapsed,
    endolysin-permeable state of the holin complex, and the ATP drop seen in infected
    cells is what gates that transition.
- description: >-
    Determine the structure of P15 by crystallography or cryo-EM, using the AlphaFold
    model as a starting point, and test the predicted catalytic residues of the
    glycosyl hydrolase 24 fold by site-directed mutagenesis, assaying turbidimetric
    lysis, zymogram activity and the enzyme's thermal and ionic-strength lability.
  hypothesis: >-
    P15 adopts a GH24 phage-lysozyme fold whose catalytic machinery is conserved
    despite low sequence similarity, and its instability maps to a small number of
    surface or packing residues that can be engineered out.
