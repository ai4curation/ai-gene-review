      This is the gene's demonstrated catalytic activity, matching EC 3.2.1.17. In
      PMID:11741849 the faster-migrating clear zone in peptidoglycan zymograms is
      lost in sus174, sus232 and sus240 (P15-) particles and its mass matches P15,
