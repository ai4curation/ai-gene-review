- term:
    id: GO:0055036
    label: virion membrane
  evidence_type: IDA
  original_reference_id: PMID:11741849
  qualifier: part_of
  review:
    summary: >-
      CACAO row. P15 is a structural component of the PRD1 virion, peripherally
      associated with the internal phage membrane; supported by several independent
      assays, not a single image.
    action: KEEP_AS_NON_CORE
    reason: >-
      CACAO assignment, experimental (IDA), and the term matches what the paper
      shows. This is not the single-assay localization pattern: PMID:11741849
      detects P15 activity by zymography in capsid-free phage membrane vesicles and
      in both empty and DNA-filled GuHCl-released membranes (Fig. 3a), shows a
      roughly fivefold rise in particle-associated lytic activity when the capsid is
      partly dissociated by freeze-thaw, and makes the association dependent on the
      small integral membrane proteins P20 and P22 (Fig. 1, Fig. 2). UniProt curates
      the same location as virion membrane, peripheral membrane protein. It is kept
      as non-core rather than accepted because the enzyme's demonstrated role is in
      lysis from within the infected cell at the end of the cycle, whereas the
      virion-associated copy has no established function - P15-deficient particles
      initiate DNA replication on schedule, so packaged P15 is not the entry
      muralytic enzyme. The location is as precise as the evidence allows: the data
      place P15 on the membrane peripherally, probably near a vertex, but do not
      resolve a sub-structure.
    supported_by:
    - reference_id: PMID:11741849
      supporting_text: >-
        We demonstrate here that P15 is also a structural component of the PRD1 virion and that it is connected to the phage membrane.
    - reference_id: PMID:11741849
      supporting_text: >-
        Zymogram analysis revealed the presence of proteins P7 and P15 in both DNA-filled and empty phage membranes
    - reference_id: PMID:11741849
      supporting_text: >-
        Small viral membrane proteins P20 and P22 modulate incorporation of P15 into the virion and may connect it to the phage membrane.
    - reference_id: file:BPPRD/XV/XV-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: >-
        May be associated with the viral membrane via P20 and P22.
