core_functions:
- description: >-
    Beta-1,4-N-acetylmuramidase (lysozyme) that hydrolyses the MurNAc-GlcNAc
    glycosidic bond of host peptidoglycan. Acting after the holin P35 has
    permeabilized the host cytoplasmic membrane, it degrades the murein sacculus,
    disrupting the host cell wall and lysing the cell to release progeny virions.
  molecular_function:
    id: GO:0003796
    label: lysozyme activity
  directly_involved_in:
  - id: GO:0044659
    label: viral release from host cell by cytolysis
  - id: GO:0052009
    label: symbiont-mediated disruption of host cell wall
  supported_by:
  - reference_id: PMID:7925454
    supporting_text: >-
      The analysis of cell wall digests indicated that P15 is a glycosidase that cleaves the beta (1-4) linkage between N-acetylmuramic acid and N-acetylglucosamine, thus displaying muramidase activity.
  - reference_id: PMID:16030234
    supporting_text: >-
      Using infected cells and plasmid-borne lysis genes, we demonstrated that a two-component lysis system (holin-endolysin) operates to release progeny phage particles from the host cell.
  - reference_id: PMID:16030234
    supporting_text: >-
      These observations confirm that both the phage holin and endolysin proteins are necessary for premature lysis.
  - reference_id: file:BPPRD/XV/XV-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Endolysin involved in host peptidoglycan digestion after permeabilization of the cytoplasmic membrane by holin. Involved in host cell lysis and liberation of progeny phages.
  knowledge_gaps:
  - gap_statement: >-
      It is not known what the virion-packaged copy of P15 does. It is incorporated in
      a P20/P22-dependent way and is enzymatically active in isolated phage membranes,
      yet particles lacking it initiate DNA replication on schedule, so it is not the
      entry muralytic enzyme.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether the virion-membrane location is a second functional context for
      this enzyme or merely carriage of a late-expressed lysis protein.
    resolution: >-
      Assay entry kinetics and peptidoglycan penetration of P15-deficient particles in
      hosts across the tectivirus range, including Gram-positive hosts, and in a
      P7-/P15- double mutant background.
  - gap_statement: >-
      How P15's pronounced instability in vitro (inactivation above 4 degrees Celsius,
      loss of activity at raised ionic strength) is compatible with efficient lysis at
      host growth temperature is unexplained; no stabilising phage or host factor has
      been identified.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      Bears on whether full in vivo activity needs a partner or a particular
      periplasmic environment, and on engineering the enzyme as an antibacterial.
    resolution: >-
      Measure activity and thermal stability of purified P15 in the presence of
      candidate partners (P20, P22, holin-permeabilized membranes) and of
      periplasm-like solute conditions.
