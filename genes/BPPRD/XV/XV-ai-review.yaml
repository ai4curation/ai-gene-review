  evidence_type: IDA
  original_reference_id: PMID:7925454
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. The assay - digestion of bacterial cell walls by purified P15 - is
      right, but GO:0044277 is a cellular process term for an organism taking apart
      its own cell wall, which a phage protein acting on its host's sacculus is not.
    action: MODIFY
    reason: >-
      CACAO assignment, experimental (IDA), and the paper genuinely shows cell-wall
      degradation by this gene product: P15 lyses chloroform-treated Gram-negative
      cells and its digests reveal cleavage of the MurNAc-GlcNAc bond. So the
      substance is supported. The term is the wrong one in sense, not in strength:
      GO:0044277 sits under cellular process and cell wall organization, describing
      the breakdown of the annotated organism's own wall, whereas PRD1 has no cell
      wall at all and P15 acts across a species boundary. GO has the matching
      host-directed term, GO:0052009 symbiont-mediated disruption of host cell wall,
      under the interspecies-interaction branch. Replacing the term keeps the
      student's observation and places it in the right branch. This is a recurring
      risk for phage and pathogen proteins: a process term that is structurally
      correct but chosen without its taxon-directed counterpart.
