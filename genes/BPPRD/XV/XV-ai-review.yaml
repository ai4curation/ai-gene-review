- id: PMID:10931330
  title: Bacteriophage PRD1 DNA entry uses a viral membrane-associated transglycosylase
    activity.
  findings:
  - statement: >-
      Zymogram analysis of wild-type and mutant PRD1 virions detects two virion-associated
      peptidoglycan-degrading enzymes: transglycosylase P7 and endolysin P15.
    supporting_text: >-
      We analysed wild-type PRD1 and different mutant particles in zymograms and found a
      glycolytic activity that was associated with protein P7.
    reference_section_type: ABSTRACT
- id: PMID:11741849
  title: The lytic enzyme of bacteriophage PRD1 is associated with the viral membrane.
  findings:
  - statement: >-
      Endolysin P15 is both the soluble beta-1,4-N-acetylmuramidase responsible for
      phage-induced host cell lysis and a peripheral structural component of the PRD1
      virion membrane whose incorporation depends on small integral membrane proteins P20
      and P22.
    supporting_text: >-
      Protein P15 is a soluble beta-1,4-N-acetylmuramidase that causes phage-induced host
      cell lysis. We demonstrate here that P15 is also a structural component of the PRD1
      virion and that it is connected to the phage membrane. Small viral membrane
      proteins P20 and P22 modulate incorporation of P15 into the virion and may connect
      it to the phage membrane.
    reference_section_type: ABSTRACT
- id: PMID:16030234
  title: The Holin protein of bacteriophage PRD1 forms a pore for small-molecule and
    endolysin translocation.
  findings:
  - statement: >-
      Host cell lysis and progeny phage release in PRD1 require both holin P35 and
      endolysin P15; holin permeabilizes and depolarizes the cytoplasmic membrane to
      allow P15 translocation to the peptidoglycan layer.
    supporting_text: >-
      The data on electrochemical properties of the cells carrying recombinant proteins
      revealed that the K + leakage and loss of ΔΨ were functions of the holin protein
      and that endolysin was needed for cell lysis.
    reference_section_type: RESULTS
- id: PMID:7925454
  title: Gene XV of bacteriophage PRD1 encodes a lytic enzyme with muramidase activity.
  findings:
  - statement: >-
      Purified recombinant P15 is a soluble glycosidase with strong lytic activity
      against chloroform-treated Gram-negative cells that hydrolyzes the beta-(1->4)
      bond between N-acetylmuramic acid and N-acetylglucosamine in peptidoglycan.
    supporting_text: >-
      The purified protein P15, identified by N-terminal sequence analysis, showed a
      strong lytic activity against chloroform-treated Gram-negative cells. No activity
      against Gram-positive bacterial species could be detected. The pH optimum of the
      enzyme was between 7.0-8.0. Protein P15 was readily inactivated at temperatures
      above 4 degrees C, as well as by increasing the ionic strength of the buffers. The
      analysis of cell wall digests indicated that P15 is a glycosidase that cleaves the
      beta (1-4) linkage between N-acetylmuramic acid and N-acetylglucosamine, thus
      displaying muramidase activity.
    reference_section_type: ABSTRACT
- id: file:BPPRD/XV/XV-uniprot.txt
  title: UniProtKB record for Enterobacteria phage PRD1 Endolysin P15 (P13559)
  findings:
  - statement: >-
      P15 is an endolysin (EC 3.2.1.17) that digests host peptidoglycan after cytoplasmic
      membrane permeabilization by holin to lyse the host cell and is also peripherally
      associated with the virion membrane via P20 and P22.
    supporting_text: >-
      FUNCTION: Endolysin involved in host peptidoglycan digestion after
      permeabilization of the cytoplasmic membrane by holin. Involved in host cell lysis
      and liberation of progeny phages. Displays strong lytic activity against
      chloroform-treated Gram-negative cells.
    reference_section_type: DATABASE_ENTRY
core_functions:
- description: >-
    Peptidoglycan beta-1,4-N-acetylmuramidase (lysozyme, EC 3.2.1.17) that hydrolyzes
    beta-(1->4)-glycosidic bonds between N-acetylmuramic acid and N-acetyl-D-glucosamine
    in the host bacterial cell wall after holin-mediated cytoplasmic membrane
    permeabilization, driving cell wall disassembly and host cytolysis for progeny phage
    release; also peripherally anchored to the internal virion membrane via P20 and P22.
