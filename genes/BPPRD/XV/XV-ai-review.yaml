- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0081
  review:
    summary: >-
      Keyword KW-0081 (Antimicrobial) mapped to a host-defence process term. The
      direction of the interaction is inverted: PRD1 is the attacker of the
      bacterium, not an organism defending itself against one.
    action: REMOVE
    reason: >-
      GO:0042742 denotes a reaction mounted to protect the annotated organism from a
      bacterium. A phage endolysin degrades the peptidoglycan of its own host in
      order to release progeny virions; there is no defence, and no bacterium is
      being resisted by PRD1. This is a demonstrably wrong electronic keyword-to-GO
      mapping - the Antimicrobial keyword is applied both to host antimicrobial
      peptides and to phage lysis enzymes, and only the former fits the defence
      framing - which the guidelines list as legitimate ground for REMOVE. The real
      claim behind the keyword is already carried, correctly, by GO:0031640 and
      GO:0044659. Worth reporting upstream as a keyword-mapping defect affecting
      phage-encoded lytic enzymes generally.
    supported_by:
    - reference_id: file:BPPRD/XV/XV-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Endolysin involved in host peptidoglycan digestion after permeabilization of the cytoplasmic membrane by holin. Involved in host cell lysis and liberation of progeny phages.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      asserted_value: >-
        GO:0042742 defense response to bacterium, IEA from UniProtKB-KW:KW-0081
      corrected_value: >-
        no GO:0042742 annotation; the antimicrobial keyword on a phage endolysin
        denotes killing of the host (GO:0031640, GO:0044659), not defence against a
        bacterium
      confidence: CONFIRMED
      requested_change: DELETE_VALUE
      explanation: >-
        The UniProtKB keyword-to-GO mapping used by GO_REF:0000043 maps KW-0081
        (Antimicrobial) to GO:0042742 defense response to bacterium. For a
        bacteriophage- or plasmid-encoded bacteriolytic enzyme such as PRD1 endolysin
        P15 this inverts the direction of the interspecies interaction: the phage
        kills the bacterium, it does not mount a defence against one. The intended
        content of the keyword is already captured for these proteins by GO:0031640
        killing of cells of another organism (also mapped from KW-0081) and, for
        phage lysis proteins, GO:0044659 viral release from host cell by cytolysis.
        Suggest restricting the GO:0042742 mapping to non-viral taxa, or splitting
        the keyword.
- term:
