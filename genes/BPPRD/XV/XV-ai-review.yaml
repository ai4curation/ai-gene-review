- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IDA
  original_reference_id: PMID:16030234
  qualifier: involved_in
  review:
    summary: >-
      CACAO row on the PRD1 lysis-system paper, which establishes a two-component
      holin-endolysin system releasing progeny phage, with P15 as the endolysin
      indispensable for lysis.
    action: ACCEPT
    reason: >-
      CACAO assignment, experimental (IDA), and the term matches the paper's central
      result for this gene. PMID:16030234 shows that the gene XV amber mutant sus232
      does not lyse, with or without arsenate (Fig. 1B), and separates the two
      proteins' contributions by plasmid-borne expression: holin alone gives
      potassium leakage and membrane-voltage loss but no lysis, endolysin alone gives
      neither, and only coexpression lyses the culture (Fig. 5). That is
      participation, not mere necessity - P15 performs the peptidoglycan hydrolysis
      step that ruptures the cell - and the cytolytic release of virions is the
      process that step serves. Not a phenotype read as a process: the molecular step
      and the process term coincide here.
    supported_by:
    - reference_id: PMID:16030234
      supporting_text: >-
        Using infected cells and plasmid-borne lysis genes, we demonstrated that a two-component lysis system (holin-endolysin) operates to release progeny phage particles from the host cell.
    - reference_id: PMID:16030234
      supporting_text: >-
        The same result was observed in the case of the endolysin sus232 mutant.
    - reference_id: PMID:16030234
      supporting_text: >-
        that endolysin was needed for cell lysis
