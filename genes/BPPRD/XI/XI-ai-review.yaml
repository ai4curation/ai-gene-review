  label: Enterobacteria phage PRD1
description: Infectivity protein P11 (gene XI) is the major viral inner-membrane protein (207 residues) of Enterobacteria
  phage PRD1 and an essential pilot component of the phage DNA ejection machinery. Anchored in the internal virion membrane
  via an N-terminal transmembrane helix (residues 13-28) and containing a central coiled-coil domain (residues 64-95), P11
  participates in assembling the tubular membrane structure that conducts the linear dsDNA genome into the host cell, likely
  mediating penetration of the bacterial outer membrane so that the host peptidoglycan layer becomes accessible to the virion-associated
  transglycosylase P7.
