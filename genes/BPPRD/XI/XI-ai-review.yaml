suggested_questions:
- question: How does the coiled-coil domain of P11 (residues 64-95) oligomerize at the tip of the emerging PRD1 membrane tube,
    and does P11 directly insert into the host bacterial outer membrane to breach the outer permeability barrier?
  experts:
  - Dennis H. Bamford
  - Hanna M. Oksanen
  - Nicola G. A. Abrescia
suggested_experiments:
- description: Perform liposome and isolated Gram-negative outer-membrane vesicle (OMV) binding and permeabilization assays
    using purified recombinant P11 and coiled-coil deletion mutants.
  hypothesis: Oligomerization of P11 via its coiled-coil domain enables direct insertion into and local disruption of the
    bacterial outer membrane, granting the vertex-associated transglycosylase P7 access to the periplasmic peptidoglycan sacculus.
  experiment_type: Membrane permeabilization and liposome flotation assay
