  review:
    summary: Plausible computational prediction based on a canonical transmembrane helix, retained as non-core for this uncharacterized ORF.
    action: KEEP_AS_NON_CORE
    reason: P27386 contains a predicted transmembrane helix (residues 10-30), making host membrane localization plausible, but expression and biological function of this putative intergenic ORF have not been experimentally established.
