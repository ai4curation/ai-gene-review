core_functions: []
suggested_questions:
- question: Is the putative ORF P27386 in the gene IX-XX intergenic region translated during PRD1 infection, and if so, does it insert into the host cytoplasmic membrane or the viral inner membrane?
suggested_experiments:
- description: Perform ribosome profiling (Ribo-seq) and targeted LC-MS/MS membrane proteomics of PRD1-infected Escherichia coli cells to test whether P27386 is expressed in vivo.
