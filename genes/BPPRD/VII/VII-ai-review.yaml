suggested_questions:
- question: How is the stoichiometry between full-length Transglycosylase P7 and the nested C-terminal isoform P14 regulated
    at the vertex complex, and how does P14 promote the vesicle-to-tube membrane transformation while P7 itself is dispensable
    for tube formation?
  experts:
  - Dennis H. Bamford
  - Pia S. Rydman
  - Hanna M. Oksanen
- question: Should the `FunctionalIsoformTypeEnum` schema be extended with an `ALTERNATIVE_INITIATION` value for prokaryotic
    and bacteriophage nested in-frame translational start products (such as PRD1 P7/P14, which currently use `SPLICE_VARIANT`
    as a schema proxy)?
  experts:
  - Gene Ontology Consortium
suggested_experiments:
- description: Perform cryo-electron tomography and subtomogram averaging of wild-type, P7-null (P14+), and P7-/P14- mutant
    PRD1 virions attached to host cells to visualize how the P7/P14 heteromultimer localizes at the vertices and transitions
    into the peptidoglycan-crossing membrane tail tube during DNA ejection.
  hypothesis: The shared C-terminal transmembrane and periplasmic region present in both P7 and P14 forms the structural scaffold
    of the membrane conduit, whereas the N-terminal SLT domain of P7 projects outward from the advancing tube tip to clear
