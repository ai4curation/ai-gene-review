  review:
    summary: 'Inaccurate reaction class: P7 is a non-hydrolytic lytic transglycosylase (EC 4.2.2.n1), whereas lysozyme activity
      (GO:0003796, EC 3.2.1.17) describes hydrolytic muramidase cleavage.'
    action: MODIFY
    reason: Although both lysozymes and lytic transglycosylases cleave the beta-(1->4) glycosidic bond between MurNAc and
      GlcNAc in peptidoglycan, `GO:0003796` (lysozyme activity, EC 3.2.1.17) is a hydrolase activity (which in PRD1 is catalyzed
      by endolysin P15, gene `XV`), whereas P7 carries an SLT-type domain (`Pfam:PF01464`, `InterPro:IPR000189`) that catalyzes
      non-hydrolytic exolytic transglycosylation forming a 1,6-anhydrobond in MurNAc (`EC:4.2.2.n1`). This annotation should
      be replaced by `GO:0140100` (lytic exotransglycosylase activity) and `GO:0008933` (peptidoglycan lytic transglycosylase
      activity), which are already present on the record.
