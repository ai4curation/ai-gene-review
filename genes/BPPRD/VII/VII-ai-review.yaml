id: P27380
gene_symbol: VII
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: 'Gene VII of Enterobacteria phage PRD1 encodes two structural viral inner-membrane proteins via nested in-frame
  translational initiation: full-length transglycosylase P7 (265 residues) and the N-terminally truncated protein P14 (150
  residues, corresponding to residues 116-265 of P7). Isoform P7 contains an N-terminal soluble lytic transglycosylase (SLT)
  catalytic domain (residues 19-98, active site Glu32) and a C-terminal transmembrane helix (residues 219-239), and acts as
  a virion-associated muralytic exolysin (EC 4.2.2.n1) that locally cleaves beta-1,4-glycosidic bonds in the host peptidoglycan
  sacculus to facilitate viral DNA entry into the Gram-negative host cell. Isoform P14 lacks the N-terminal SLT domain and
  has no muralytic activity, but forms a vertex-associated heteromultimer with P7 in the viral inner membrane and is essential
  for viral infectivity and membrane tail-tube formation during genome injection.'
alternative_products:
- name: Transglycosylase P7
  id: P27380-1
  description: Full-length 265-residue isoform containing an N-terminal soluble lytic transglycosylase (SLT) domain (residues
    19-98, catalytic Glu32) and a C-terminal single-pass transmembrane helix (residues 219-239). Acts as a virion-associated
    muralytic exolysin (EC 4.2.2.n1) that locally digests host peptidoglycan during phage DNA delivery; its absence delays
    initiation of viral DNA replication and host lysis but does not abolish infectivity.
- name: Protein P14
  id: P27380-2
  sequence_note: VSP_022588
  description: Nested C-terminal 150-residue isoform translated from an internal in-frame start site at the 3' end of gene
    VII (missing residues 1-115, encoded by nested gene XIV). Lacks the N-terminal SLT transglycosylase domain and displays
    no enzymatic activity, but retains the C-terminal transmembrane helix, forms a vertex-associated heteromultimeric complex
    with P7 in the viral inner membrane, and is essential for viral infectivity and membrane tail-tube formation during DNA
    injection.
