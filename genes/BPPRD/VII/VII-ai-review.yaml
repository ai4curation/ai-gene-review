- id: PMID:10931330
  title: Bacteriophage PRD1 DNA entry uses a viral membrane-associated transglycosylase activity.
  findings:
  - statement: Structural protein P7 carries an N-terminal conserved transglycosylase domain and exhibits peptidoglycan-degrading
      glycolytic activity in zymograms; its absence delays phage DNA replication and host cell lysis.
    supporting_text: Amino acid sequence analyses have indicated that the amino-terminal part of bacteriophage PRD1 structural
      protein P7 carries a conserved transglycosylase domain. We analysed wild-type PRD1 and different mutant particles in
      zymograms and found a glycolytic activity that was associated with protein P7. This is the first time a putative bacteriophage
      or plasmid lytic transglycosylase has been shown to have an enzymatic activity. In the absence of protein P7, the phage
      DNA replication and host cell lysis were delayed.
    reference_section_type: ABSTRACT
  - statement: Gene VII encodes both P7 and P14 (mapped to the 3' end of gene VII), which form a heteromultimeric complex
      at the particle vertices involved in early infection steps.
    supporting_text: Gene VII of PRD1 is known to encode proteins P7 and P14. In this investigation, the open reading frame
      coding for P14 was mapped to the 3' end of gene VII. Proteins P7 and P14 probably form a heteromultimeric complex, which
      is located at the particle vertices and is involved in the early steps of the PRD1 life cycle
    reference_section_type: ABSTRACT
- id: PMID:11741849
  title: The lytic enzyme of bacteriophage PRD1 is associated with the viral membrane.
  findings:
  - statement: Protein P7 is localized in the PRD1 viral inner membrane and serves as the principal muralytic enzyme involved
      in PRD1 DNA entry into Gram-negative host cells.
    supporting_text: The principal muralytic protein involved in PRD1 DNA entry seems to be the putative lytic transglycosylase
      protein P7, as the absence of protein P15 did not delay initiation of phage DNA replication in the virus-host system
      used.
    reference_section_type: ABSTRACT
  - statement: Zymogram analysis of isolated PRD1 membranes demonstrates that P7 is associated with both DNA-filled and empty
      phage membranes and degrades E. coli peptidoglycan but not Gram-positive Micrococcus lysodeikticus peptidoglycan.
    supporting_text: Zymogram analysis revealed the presence of proteins P7 and P15 in both DNA-filled and empty phage membranes
      (Fig. 3a ).
    reference_section_type: RESULTS
