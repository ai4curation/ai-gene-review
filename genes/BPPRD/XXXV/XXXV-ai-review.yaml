- id: PMID:16030234
  title: The Holin protein of bacteriophage PRD1 forms a pore for small-molecule and
    endolysin translocation.
  findings:
  - statement: >-
      Holin P35 (gene XXXV) is a class I holin that inserts into the host cytoplasmic
      membrane, induces K+ leakage at ~35-40 min postinfection followed by membrane
      depolarization, and forms pores for endolysin P15 translocation in an ATP-depletion
      and GroEL/GroES-dependent manner.
    supporting_text: >-
      The data on electrochemical properties of the cells carrying recombinant proteins
      revealed that the K + leakage and loss of ΔΨ were functions of the holin protein
      and that endolysin was needed for cell lysis.
    reference_section_type: RESULTS
  - statement: >-
      Nonsense mutation sus715 in the holin gene XXXV abolishes K+ leakage, membrane
      depolarization, and both normal and arsenate-induced premature host cell lysis.
    supporting_text: >-
      Nonsuppressor DS88 cells infected with the PRD1 sus715 holin mutant did not show
      any signs of lysis, with or without addition of arsenate, at any time point (Fig.
      1B ).
    reference_section_type: RESULTS
- id: file:BPPRD/XXXV/XXXV-uniprot.txt
  title: UniProtKB record for Enterobacteria phage PRD1 Holin P35 (Q3T4L9)
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: >-
      The UniProtKB record Q3T4L9 includes `Isoform Holin:` and `Isoform Antiholin:`
      headers in `CC -!- FUNCTION` and `CC -!- SUBUNIT` transferred `By similarity` from
      Escherichia phage lambda holin S (`{ECO:0000250|UniProtKB:P03705}`), even though
      Q3T4L9 has no `CC -!- ALTERNATIVE PRODUCTS` section and no experimental confirmation
      of a dual-start antiholin isoform in PRD1 (`PMID:16030234`).
  findings:
  - statement: >-
      P35 is a three-pass host inner-membrane class I holin (Pfam PF16083, InterPro
      IPR032126) that forms pores in the cytoplasmic membrane to allow endolysin escape
      into the periplasm and programmed host cell lysis.
    supporting_text: >-
      FUNCTION: Isoform Holin: Accumulates harmlessly in the cytoplasmic membrane until
      it reaches a critical concentration that triggers the formation of micron-scale
      pores (holes) causing host cell membrane disruption and endolysin escape into the
      periplasmic space (PubMed:12813073, PubMed:16030234).
    reference_section_type: DATABASE_ENTRY
core_functions:
- description: >-
    Class I three-pass transmembrane holin that inserts into the host bacterial plasma
    (inner) membrane, mediates early potassium ion leakage, and upon intracellular ATP
    depletion forms transmembrane lesions that depolarize the membrane and allow soluble
    endolysin P15 to cross into the periplasm to lyse the host cell and release progeny
    virions.
