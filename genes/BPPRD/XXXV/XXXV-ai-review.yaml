suggested_questions:
- question: >-
    Does gene XXXV produce a functional N-terminally extended antiholin isoform in vivo
    that delays pore formation until intracellular ATP drops, and how does the host
    GroEL/GroES chaperonin system regulate P35 membrane insertion or gating?
  experts:
  - Dennis H. Bamford
  - Rimantas Daugelavicius
  - Ry Young
suggested_experiments:
- description: >-
    Mutate the putative alternative translational start codons at the 5' end of gene XXXV
    and measure lysis timing, K+ efflux kinetics, and arsenate sensitivity during PRD1
    infection, alongside co-immunoprecipitation of P35 with GroEL before and after ATP
    depletion.
  hypothesis: >-
    Translation from the first start codon produces an antiholin state stabilized by the
    charged C-terminus and/or GroEL until ATP depletion triggers conformational conversion
    into the endolysin-permeable holin lesion.
  experiment_type: Site-directed start-codon mutagenesis and electrochemical lysis timing assay
