  - UniProtKB-KW:KW-0081
  review:
    summary: >-
      False automated keyword mapping from KW-0081 (Bacteriolytic enzyme); holin P35 is a
      non-catalytic transmembrane pore-forming protein, not an enzyme.
    action: REMOVE
    reason: >-
      This IEA annotation derives from the UniProt keyword `KW-0081` (Bacteriolytic
      enzyme), which was erroneously attached to the holin entry. Unlike endolysin P15
      (gene XV), holin P35 has no enzymatic or catalytic domain; it is a 117-residue
      three-pass transmembrane protein that oligomerizes to form pores in the host
      cytoplasmic membrane (`PMID:16030234`, `file:BPPRD/XXXV/XXXV-uniprot.txt`).
    supported_by:
    - reference_id: PMID:16030234
      supporting_text: >-
        Holins are small hydrophobic integral membrane proteins that permeabilize the
        cytoplasmic membrane (CM) and allow the endolysins to attack the peptidoglycan (
        20 , 38 , 39 ).
