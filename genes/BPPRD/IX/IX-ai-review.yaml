id: P27381
gene_symbol: IX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Viral DNA packaging ATPase (protein P9) that assembles with the packaging efficiency factor P6 into a ring-shaped heterododecamer at the unique vertex of the bacteriophage PRD1 capsid, anchored to the inner membrane portal proteins P20 and P22. Powers ATP-dependent translocation of the unit-length P8-linked double-stranded DNA genome into the preformed lipid-containing procapsid and remains bound at the vertex of the mature virion as a structural plug.
references:
- id: PMID:17202207
  title: Efficient DNA packaging of bacteriophage PRD1 requires the unique vertex protein P6.
  findings:
  - statement: Packaging ATPase P9 localizes to the unique packaging vertex together with minor capsid protein P6 and small membrane proteins P20 and P22, drives ATP-dependent viral DNA packaging into empty procapsids, and remains attached to the mature virion after packaging.
    supporting_text: This unique packaging vertex contains, at least, minor capsid protein P6, packaging ATPase P9 and two small membrane proteins, P20 and P22.
  - statement: Absence of P9 leads to the production of empty particles devoid of genomic DNA, and in vitro packaging requires ATP and P9.
    supporting_text: The absence of either P9 or P20 leads to the production of particles devoid of DNA, but in P22 − mutants, a small number of packaged particles can be detected in infected cells, where the majority of the particles are empty ( 57 , 89 ).
  - statement: After packaging the unit-length PRD1 genome, ATPase P9 remains bound to the virion where it may act as a vertex plug.
    supporting_text: It was suggested that the packaging ATPase P9, which stays bound to the PRD1 particles after packaging the DNA, could act as a plug ( 89 ).
- id: file:BPPRD/IX/IX-uniprot.txt
  title: UniProtKB entry for P27381 (VP09_BPPRD)
  findings:
  - statement: P9 is the DNA packaging ATPase that forms a ring-shaped heterododecamer with P6 at the external part of the portal vertex and plays critical roles in genome packaging and ejection.
    supporting_text: Together with the packaging efficiency factor P6, forms the external part of the portal vertex that is embeded in the capsid and which plays critical roles in genome packaging and genome ejection. Both proteins multimerize as a single ring-shaped heterdodecamer arranged around a central channel.
