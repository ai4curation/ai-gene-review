suggested_questions:
- question: How does the P6-P9 heterododecameric ring couple ATP hydrolysis by P9 to directional translocation of the P8-linked dsDNA genome across the P20/P22 inner membrane portal channel?
suggested_experiments:
- description: Determine the high-resolution cryo-EM structure of the active P6-P9-P20-P22 portal vertex complex engaged with DNA and nucleotide analogs to define the mechanochemical translocation cycle.
