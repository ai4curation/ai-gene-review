  review:
    summary: P8 primes viral DNA replication in the cytoplasm of the infected Gram-negative bacterial host.
    action: NEW
    reason: PRD1 infects Gram-negative bacteria lacking a nucleus; protein-primed DNA replication occurs in the host cell cytoplasm. (Note that the UniProt Subcellular Location annotation to host nucleus from PMID:23091024 reflects heterologous expression of YFP-P8 in mammalian COS-7 cells rather than natural phage infection.)
