  evidence_type: ISS
  original_reference_id: file:BPPRD/VIII/VIII-uniprot.txt
  review:
    summary: P8 primes viral DNA replication in the cytoplasm of the infected Gram-negative bacterial host.
    action: NEW
    reason: PRD1 infects Gram-negative bacteria lacking a nucleus; protein-primed DNA replication occurs in the host cell cytoplasm (GO:0030430). (Note that the UniProt Subcellular Location annotation to host nucleus from PMID:23091024 reflects heterologous expression of YFP-P8 in mammalian COS-7 cells rather than natural phage infection.)
core_functions:
- description: Serves as the covalent 5'-terminal protein primer (P8-dGMP) that recruits DNA polymerase P1 to initiate protein-primed viral DNA replication in the host cell cytoplasm and remains covalently bound to the packaged genome inside the mature virion.
