id: P09009
gene_symbol: VIII
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Genome terminal protein (protein P8) covalently linked via a phosphodiester bond between a tyrosine residue and 5'-dGMP to both 5' ends of the linear double-stranded DNA genome of bacteriophage PRD1. Serves as the protein primer for initiation of viral DNA replication by DNA polymerase P1 in the bacterial host cytoplasm and remains covalently attached to the packaged viral genome inside the mature virion.
references:
- id: PMID:1655759
  title: Overexpression, purification, and characterization of Escherichia coli bacteriophage PRD1 DNA polymerase. In vitro synthesis of full-length PRD1 DNA with purified proteins.
  findings:
  - statement: Terminal protein P8 forms the covalent P8-dGMP replication initiation complex with PRD1 DNA polymerase P1, which serves as the obligatory primer for synthesis of full-length PRD1 genomic DNA.
    supporting_text: Formation of the P8-dGMP replication initiation complex was a prerequisite for phage DNA replication, which proceeded from the initiation complex and yielded genome length replication products.
- id: PMID:17202207
  title: Efficient DNA packaging of bacteriophage PRD1 requires the unique vertex protein P6.
  findings:
  - statement: Terminal protein P8 is covalently attached to the packaged genomic DNA in mature PRD1 virions and forms part of the P9-DNA-P8 complex that docks onto the procapsid during DNA packaging.
    supporting_text: No additional stabilizing components are added to the virion after packaging; the ATPase P9 and the genome terminal protein P8 are the only differences in the protein compositions of procapsids and DNA-filled mature particles ( 89 ).
- id: PMID:23091024
  title: Functional eukaryotic nuclear localization signals are widespread in terminal proteins of bacteriophages.
  findings:
  - statement: When heterologously expressed as a YFP fusion in mammalian COS-7 cells, PRD1 terminal protein P8 localizes to the eukaryotic cell nucleus due to a positively charged sequence motif.
    supporting_text: Here we report a widespread occurrence of predicted NLSs in phage TPs and show that the TPs of Φ29, Nf, PRD1, Bam35, and Cp-1 localize to the mammalian cell nucleus.
- id: file:BPPRD/VIII/VIII-uniprot.txt
  title: UniProtKB entry for P09009 (TERM_BPPRD)
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The UniProt CC FUNCTION text for P09009 states by similarity that PRD1 P8 is linked to the 5'-phosphate of a terminal deoxyadenylate (copied from Bacillus phage phi29 gp3), whereas biochemical characterization of PRD1 (PMID:1655759) established that P8 is covalently linked via Tyr-190 to 5'-dGMP (deoxyguanylate). Furthermore, the SUBCELLULAR LOCATION annotation to host nucleus from PMID:23091024 reflects heterologous YFP-P8 expression in mammalian COS-7 cells rather than natural prokaryotic phage infection.
  findings:
  - statement: P8 acts as a protein primer for viral genomic replication and is covalently linked via a tyrosine residue to the 5'-ends of both strands of the genome (note that the UniProt text erroneously states deoxyadenylate by similarity to phi29, whereas PRD1 P8 is linked to 5'-dGMP per PMID:1655759).
    supporting_text: Acts as a primer for viral genomic replication. DNA terminal protein is covalently linked to the 5'-ends of both strands of the genome through a phosphodiester bond between the beta-hydroxyl group of a tyrosine residue and the 5'-phosphate of the terminal deoxyadenylate.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:1655759
      supported_by:
      - reference_id: PMID:1655759
        supporting_text: Formation of the P8-dGMP replication initiation complex was a prerequisite for phage DNA replication, which proceeded from the initiation complex and yielded genome length replication products.
      review_notes: UniProt P09009 erroneously names deoxyadenylate by similarity; PMID:1655759 demonstrates that PRD1 P8 forms a covalent P8-dGMP (deoxyguanylate) initiation complex.
  - statement: P8 is localized to the mature virion as the genome-linked terminal protein.
    supporting_text: 'SUBCELLULAR LOCATION: Virion.'
