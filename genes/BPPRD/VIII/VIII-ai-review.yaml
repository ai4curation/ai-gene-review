core_functions:
- description: Serves as the covalent 5'-terminal protein primer (P8-dGMP) that recruits DNA polymerase P1 to initiate protein-primed viral DNA genome replication in the host cell cytoplasm and accompanies the genomic DNA into the procapsid during virion assembly.
