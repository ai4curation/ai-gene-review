suggested_questions:
- question: How does the five-fold symmetric P31 penton accommodate the symmetry mismatch
    with both the homotrimeric P5 spike and the single monomeric P2 adsorption spike
    at each vertex?
suggested_experiments:
- description: Perform high-resolution cryo-EM with symmetry-expanded localized classification
    of native PRD1 vertices containing P31, P5, and P2.
  hypothesis: Specific N-terminal extensions of three of the five P31 subunits engage
    the P5 trimer base, while the remaining two P31 subunits cradle the monomeric
    P2 tail off the five-fold axis.
