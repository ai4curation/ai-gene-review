taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Penton protein P31 (14 kDa, 126 residues) of Enterobacteria phage PRD1.
  P31 adopts a single eight-stranded jelly-roll beta-barrel fold and assembles into
  homopentamers that occupy the five-fold vertices of the pseudo T=25 icosahedral
  capsid. At each vertex, the P31 penton interlocks with peripentonal major capsid
  protein P3 trimers, the tape-measure protein P30, and the inner-membrane vertex
  protein P16, and serves as the structural base that anchors the homotrimeric P5
  spike and the monomeric P2 receptor-binding spike.
