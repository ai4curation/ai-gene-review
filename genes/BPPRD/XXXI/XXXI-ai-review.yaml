  review:
    summary: P31 forms the homopentameric penton base at the five-fold vertices of
      the PRD1 icosahedral capsid, so the general viral capsid term should be refined
      to GO:0019030 (icosahedral viral capsid).
    action: MODIFY
    reason: Cryo-EM and X-ray crystallographic studies establish that P31 homopentamers
      occupy the five-fold vertices of the PRD1 icosahedral capsid lattice, where
      they interlock with P3 and P16 and anchor the P5 and P2 vertex spikes [PMID:17416681].
      Refining GO:0019028 to GO:0019030 (icosahedral viral capsid) captures this specific
      capsid architecture.
    proposed_replacement_terms:
