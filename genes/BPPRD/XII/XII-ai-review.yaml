id: P17637
gene_symbol: XII
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Single-stranded DNA-binding protein (protein P12) of bacteriophage PRD1 that binds single-stranded DNA intermediates generated during protein-primed strand-displacement viral DNA replication and regulates phage DNA metabolism and early gene transcription in the host cell cytoplasm.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: file:BPPRD/XII/XII-uniprot.txt
  title: UniProtKB entry for P17637 (SSB_BPPRD)
  findings:
  - statement: P12 binds single-stranded DNA (ssDNA) and participates in phage DNA metabolism and regulation of early gene transcription.
    supporting_text: Binds to single-stranded DNA (ssDNA). Has a regulatory effect on phage DNA metabolism and transcription of early genes.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Spurious keyword-derived annotation; P12 binds single-stranded DNA polymers, not monomeric nucleotides.
    action: REMOVE
    reason: Annotated via automated mapping from UniProt keyword KW-0547 (Nucleotide-binding), which is misapplied to this single-stranded DNA-binding protein. P12 binds polynucleotide ssDNA rather than free nucleoside phosphates.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: True but overly general; P12 is specifically a single-stranded DNA-binding protein.
    action: MODIFY
    reason: P12 specifically binds single-stranded DNA (ssDNA) intermediates during protein-primed replication, so GO:0003677 should be refined to GO:0003697 (single-stranded DNA binding).
    proposed_replacement_terms:
    - id: GO:0003697
      label: single-stranded DNA binding
    supported_by:
    - reference_id: file:BPPRD/XII/XII-uniprot.txt
      supporting_text: Binds to single-stranded DNA (ssDNA). Has a regulatory effect on phage DNA metabolism and transcription of early genes.
- term:
    id: GO:0039693
    label: viral DNA genome replication
  evidence_type: ISS
  original_reference_id: file:BPPRD/XII/XII-uniprot.txt
  review:
    summary: P12 coats and stabilizes displaced single-stranded DNA during protein-primed viral DNA replication.
    action: NEW
    reason: Single-stranded DNA-binding protein P12 functions in phage PRD1 protein-primed DNA replication by binding displaced ssDNA strands and regulating phage DNA metabolism.
    supported_by:
    - reference_id: file:BPPRD/XII/XII-uniprot.txt
      supporting_text: Binds to single-stranded DNA (ssDNA). Has a regulatory effect on phage DNA metabolism and transcription of early genes.
- term:
    id: GO:0030430
    label: host cell cytoplasm
  evidence_type: ISS
  original_reference_id: file:BPPRD/XII/XII-uniprot.txt
  review:
    summary: P12 acts in the bacterial host cell cytoplasm where viral DNA replication and transcription take place.
    action: NEW
    reason: Phage PRD1 infects Gram-negative bacterial hosts lacking a nucleus; viral DNA replication and early transcription mediated by P12 occur in the host cell cytoplasm (GO:0030430).
core_functions:
- description: Binds single-stranded DNA intermediates in the host cell cytoplasm during protein-primed viral DNA replication.
  molecular_function:
