suggested_questions:
- question: How do the two PRD1 single-stranded DNA-binding proteins P12 and P19 partition their roles between DNA replication, transcription regulation, and genome packaging?
suggested_experiments:
- description: Measure the cooperative ssDNA-binding thermodynamics and stimulation of P1-catalyzed strand-displacement DNA synthesis by purified P12 versus P19 in vitro.
