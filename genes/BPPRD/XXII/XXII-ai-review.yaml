  findings: []
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping, accompanied by conservative
    changes to GO terms applied by UniProt.
  findings: []
- id: PMID:17202207
  title: Efficient DNA packaging of bacteriophage PRD1 requires the unique vertex protein P6.
  findings:
  - statement: Small membrane protein P22 localizes to the unique packaging vertex with P20, P6, and P9; P22-deficient mutants
      lack P6 and P9 on procapsids and produce predominantly empty particles with only a minute fraction packaged.
    supporting_text: The absence of either P9 or P20 leads to the production of particles devoid of DNA, but in P22 − mutants,
      a small number of packaged particles can be detected in infected cells, where the majority of the particles are empty
      ( 57 , 89 ).
- id: file:BPPRD/XXII/XXII-uniprot.txt
  title: UniProtKB entry for P27388 (VP22_BPPRD)
  findings:
  - statement: Together with P20, P22 forms a ring-shaped heterododecamer embedded in the virion internal membrane that serves
      as the internal part of the portal complex and interacts with the P6/P9 external portal ring.
    supporting_text: Together with P22, forms the internal part of the portal complex embeded in the virion internal membrane
      and which plays critical roles in genome packaging and genome ejection. Both proteins multimerize as a single ring-shaped
      heterdodecamer arranged around a central channel and interact with the P6/P9 external part of the portal.
