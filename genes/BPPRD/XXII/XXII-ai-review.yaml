suggested_questions:
- question: Why does loss of P22 still permit a trace level of DNA packaging in vivo whereas loss of its heterodimeric partner
    P20 completely abolishes packaging?
suggested_experiments:
- description: Test whether P20 can form homododecameric membrane pores with low residual affinity for P6/P9 in the absence
    of P22 using cryo-EM and liposome reconstitution.
