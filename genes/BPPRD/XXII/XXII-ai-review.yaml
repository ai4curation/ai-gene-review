id: P27388
gene_symbol: XXII
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Small single-pass integral viral inner membrane protein (packaging protein P22, 47 amino acids) that co-assembles
  with P20 into a ring-shaped heterododecamer embedded in the internal lipid membrane at the unique packaging vertex of bacteriophage
  PRD1. Anchors the external P6/P9 portal ring to the viral inner membrane and is required for efficient viral DNA genome
  packaging and virion maturation.
references:
- id: GO_REF:0000043
