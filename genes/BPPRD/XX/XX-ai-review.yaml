  label: Enterobacteria phage PRD1
description: Small single-pass integral viral inner membrane protein (packaging protein P20, 42 amino acids) that heteromultimerizes
  with P22 into a ring-shaped heterododecamer spanning the internal lipid membrane at the unique packaging vertex of bacteriophage
  PRD1. Forms the membrane-spanning portal channel and anchors the external P6/P9 packaging complex to the procapsid for viral
  DNA genome packaging and ejection.
