- id: PMID:17202207
  title: Efficient DNA packaging of bacteriophage PRD1 requires the unique vertex protein P6.
  findings:
  - statement: Small integral membrane protein P20 is located at the unique packaging vertex together with P22, P6, and P9;
      absence of P20 completely abolishes DNA packaging and results in empty particles lacking both P6 and P9.
    supporting_text: The absence of either P9 or P20 leads to the production of particles devoid of DNA, but in P22 − mutants,
      a small number of packaged particles can be detected in infected cells, where the majority of the particles are empty
      ( 57 , 89 ).
  - statement: P20 is the primary candidate for the membrane-spanning portal pore through which the viral dsDNA genome is
      translocated into the internal lipid vesicle inside the capsid.
    supporting_text: Since the lack of P20 totally abolishes packaging ( 89 ) but the lack of P22 still allows for a minute
      amount of the procapsids to be packaged ( 58 ), it can be suggested that P20 is the main candidate for a pore, or membrane-spanning
      “portal,” through which DNA can be transported into the lipid vesicle inside the capsid.
- id: file:BPPRD/XX/XX-uniprot.txt
  title: UniProtKB entry for P27387 (VP20_BPPRD)
  findings:
  - statement: Together with P22, P20 forms a ring-shaped heterododecamer embedded in the virion internal membrane that serves
      as the internal part of the portal complex and interacts with the P6/P9 external portal ring.
    supporting_text: Together with P22, forms the internal part of the portal complex embeded in the virion internal membrane
      and which plays critical roles in genome packaging and genome ejection. Both proteins multimerize as a single ring-shaped
      heterdodecamer arranged around a central channel and interact with the P6/P9 external part of the portal.
