suggested_questions:
- question: How do the transmembrane helices of P20 and P22 arrange within the heterododecameric ring to gate the inner membrane
    channel before and during DNA translocation?
suggested_experiments:
- description: Reconstitute purified P20/P22 complexes into lipid nanodiscs for single-particle cryo-EM and planar lipid bilayer
    conductance measurements to characterize pore dimensions and gating.
