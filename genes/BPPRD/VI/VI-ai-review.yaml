id: P27379
gene_symbol: VI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Minor capsid vertex protein and packaging efficiency factor (protein P6) located exclusively at the unique packaging vertex of bacteriophage PRD1. Multimerizes with the DNA packaging ATPase P9 into a ring-shaped heterododecamer anchored to the inner membrane portal proteins P20 and P22, stabilizing P9 association with the procapsid and promoting efficient ATP-driven viral DNA genome packaging.
references:
- id: PMID:17202207
  title: Efficient DNA packaging of bacteriophage PRD1 requires the unique vertex protein P6.
  findings:
  - statement: Protein P6 is an essential component of the PRD1 packaging machinery at the unique vertex; P6-deficient (sus621) mutant infections produce normal amounts of procapsids that are mostly empty due to a severe defect in DNA packaging efficiency and altered binding of ATPase P9.
    supporting_text: Protein P6 was found to be an essential part of the PRD1 packaging machinery; its absence leads to greatly reduced packaging efficiency. Lack of P6 was not found to affect particle assembly, because in the P6-deficient mutant infection, wild-type (wt) amounts of particles were produced, although most were empty.
  - statement: P6 is localized at the unique packaging vertex where it connects to the capsid via the small membrane proteins P20 and P22 and promotes productive binding of the P9-DNA-P8 complex to the procapsid.
    supporting_text: Here, the presence of P6 in the procapsid is crucial, and without it, the affinity of the procapsid to the P8-DNA-P9 complex is lower and the complex may not bind properly, and/or binding does not lead to successful packaging.
- id: file:BPPRD/VI/VI-uniprot.txt
  title: UniProtKB entry for P27379 (VP06_BPPRD)
  findings:
  - statement: Together with the packaging ATPase P9, P6 forms the external part of the portal vertex embedded in the capsid as a ring-shaped heterododecamer and is necessary for attachment of P9 to the capsid via P20 and P22.
    supporting_text: Together with the packaging ATPase P9, forms the external part of the portal vertex that is embeded in the capsid and which plays critical roles in genome packaging and genome ejection. Both proteins multimerize as a single ring-shaped heterdodecamer arranged around a central channel.
