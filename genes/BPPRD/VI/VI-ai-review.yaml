suggested_questions:
- question: Does P6 allosterically stimulate the ATPase activity of P9 upon binding the P8-DNA complex at the unique vertex, or does it act purely as a structural adaptor between P20/P22 and P9?
suggested_experiments:
- description: Compare the basal and DNA-stimulated ATPase rates of purified P9 alone versus reconstituted P6-P9 heterododecamers in vitro.
