taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Monomeric receptor-binding adsorption spike protein P2 (63.8 kDa, 591
  residues) of Enterobacteria phage PRD1. P2 folds into an elongated club-shaped architecture
  comprising a distal pseudo-beta-propeller receptor-binding head and an extended
  beta-sheet shaft anchored at the five-fold capsid vertices through interactions
  with the P31 penton base and the P5 trimeric spike. At the onset of infection, P2
  recognizes and binds the host cell conjugative plasmid-encoded mating pair formation
  receptor complex, triggering a conformational switch in the P5-P31 vertex complex
  that initiates vertex disassembly, membrane tube formation, and viral genome delivery.
