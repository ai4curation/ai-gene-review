suggested_questions:
- question: Which specific surface-exposed outer membrane or periplasmic subunit of
    the IncP (RP4/RK2) Trb mating pair formation complex forms the direct binding
    interface with the pseudo-beta-propeller head of P2?
suggested_experiments:
- description: Perform cryo-EM single-particle reconstruction and cross-linking mass
    spectrometry of purified P2 bound to isolated RP4-encoded Trb mating pair formation
    complexes.
  hypothesis: The pseudo-beta-propeller head of P2 binds a surface-exposed loop of
    the outer-membrane-associated Trb complex, inducing a mechanical pull on the P2
    beta-sheet shaft that releases P2 from the P31-P5 vertex.
