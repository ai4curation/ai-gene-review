- id: PMID:17416681
  title: Tale of two spikes in bacteriophage PRD1.
  findings:
  - statement: P5 forms a homotrimeric vertex spike bound directly to the penton base protein P31 and interacts near the capsid
      shell with the separate P2 receptor-binding spike.
    supporting_text: We determined the architecture of the PRD1 spike complex by using electron microscopy and three-dimensional
      image reconstruction of a series of PRD1 mutants. We constructed an atomic model for the full-length P5 spike protein
      by using comparative modeling. P5 was shown to be bound directly to the penton base protein P31. P5 and the receptor-binding
      protein P2 form two separate spikes, interacting with each other near the capsid shell.
  - statement: Incorporation of the receptor-binding protein P2 into the virion strictly requires P5.
    supporting_text: A virus mutant deficient in pentameric vertex protein P31 lacks both proteins P2 and P5 ( 3 ). Furthermore,
      the presence of P2 depends on the presence of P5 ( 20 ).
