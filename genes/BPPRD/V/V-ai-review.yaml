  review:
    summary: P5 specifically forms the trimeric spike complex at the five-fold vertices of the PRD1 icosahedral capsid, so
      the general viral capsid term should be refined to GO:0098029 (icosahedral viral capsid, spike).
    action: MODIFY
    reason: Cryo-EM three-dimensional reconstructions and X-ray fitting demonstrate that P5 forms a homotrimeric spike bound
      directly to the penton base protein P31 at the five-fold vertices of the icosahedral capsid [PMID:17416681]. Refining
      GO:0019028 to its already-annotated specific descendant GO:0098029 (icosahedral viral capsid, spike) captures this precise
      localization.
    proposed_replacement_terms:
    - id: GO:0098029
      label: icosahedral viral capsid, spike
    supported_by:
    - reference_id: PMID:17416681
      supporting_text: We determined the architecture of the PRD1 spike complex by using electron microscopy and three-dimensional
        image reconstruction of a series of PRD1 mutants. We constructed an atomic model for the full-length P5 spike protein
        by using comparative modeling. P5 was shown to be bound directly to the penton base protein P31. P5 and the receptor-binding
        protein P2 form two separate spikes, interacting with each other near the capsid shell.
