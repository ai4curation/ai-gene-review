suggested_questions:
- question: Does the C-terminal beta-propeller knob of P5 mediate reversible primary adhesion to Gram-negative cell surface
    lipopolysaccharides or outer membrane proteins before P2 locks onto the IncP conjugative mating pore?
suggested_experiments:
- description: Measure host cell binding kinetics of purified P2-deficient (P5+P2-) versus P5/P2-deficient (P5-P2-) PRD1 particles
    and soluble recombinant P5 C-terminal knob trimers on IncP+ and IncP- Salmonella and Escherichia coli cells.
  hypothesis: The C-terminal knob of P5 mediates low-affinity reversible scanning along the bacterial cell surface to facilitate
    subsequent high-affinity engagement of the IncP receptor by P2.
