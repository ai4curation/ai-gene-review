suggested_questions:
- question: >-
    Does the second transmembrane helix of P34 (residues 41-61), which is absent from its
    single-pass paralog P32, confer a distinct topological or curvature-stabilizing role
    in the PRD1 viral inner membrane during procapsid assembly or DNA delivery?
  experts:
  - Dennis H. Bamford
  - Hanna M. Oksanen
suggested_experiments:
- description: >-
    Determine the membrane topology of P34 in isolated PRD1 membrane vesicles using
    substituted-cysteine accessibility method (SCAM) labeling and test whether P34 forms
    homo- or hetero-oligomers with P32 by chemical cross-linking and mass spectrometry.
  hypothesis: >-
    P34 adopts a hairpin-like two-helix transmembrane topology in the viral inner
    membrane and hetero-oligomerizes with P32 via their shared N-terminal PF11087
    transmembrane helix to facilitate membrane remodeling during DNA ejection.
  experiment_type: Substituted-cysteine accessibility topology mapping and cross-linking MS
