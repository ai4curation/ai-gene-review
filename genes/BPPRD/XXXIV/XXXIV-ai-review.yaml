  label: Enterobacteria phage PRD1
description: >-
  Protein P34 (gene XXXIV, also known as ORFO) is a 68-residue multi-pass integral
  membrane protein of the Enterobacteria phage PRD1 viral inner membrane containing two
  transmembrane helices (residues 4-24 and 41-61). It belongs to the conserved
  tectiviral DNA delivery protein P32/P34 family (`Pfam:PF11087`, `InterPro:IPR020085`)
  and is a structural component of the internal virion lipid membrane alongside its
  single-pass paralog P32 (gene XXXII).
