suggested_questions:
- question: Does P30 dimerize on the surface of the nascent viral membrane vesicle prior to recruiting P3 capsomers, or does
    it co-polymerize with peripentonal P3 trimers nucleated at the vertices?
suggested_experiments:
- description: Construct PRD1 gene XXX mutants with internal proline-rich linker insertions or deletions and analyze assembled
    particles by cryo-EM.
  hypothesis: Altering the contour length of the extended P30 tape-measure arm perturbs facet termination at five-fold vertices
    and produces aberrant triangulation numbers or incomplete shells.
