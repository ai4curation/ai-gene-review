taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Minor capsid tape-measure and cementing protein P30 (9 kDa, 84 residues) of Enterobacteria phage PRD1. P30 forms
  extended homodimers (60 copies per capsid) that span the 30 icosahedral two-fold edges from one five-fold vertex to the
  next beneath the major capsid protein P3 lattice, defining the dimensions of the pseudo T=25 capsid and cementing adjacent
  P3 facets onto the internal viral lipid membrane vesicle. In the absence of P30, P3 trimers fail to assemble into a stable
  capsid shell and only empty phage-specific membrane vesicles are produced.
