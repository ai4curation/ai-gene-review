- id: file:BPPRD/III/III-uniprot.txt
  title: UniProtKB record for III (P22535)
  findings:
  - statement: P3 homotrimers self-assemble to form a pseudo T=25 icosahedral capsid
      that encapsulates an inner membrane and dsDNA genome.
    supporting_text: 'FUNCTION: Major capsid protein self-assembles to form an icosahedral
      capsid with a pseudo T=25 symmetry, about 66 nm in diameter, and consisting
      of 240 capsid proteins trimers. The capsid encapsulates an inner membrane and
      the genomic dsDNA genome.'
suggested_questions:
- question: How do the N-terminal amphipathic helices of quasi-equivalent P3 trimers
    sense membrane curvature on the nascent lipoprotein vesicle to nucleate facet
    polymerization?
suggested_experiments:
- description: Perform cryo-EM single-particle analysis of in vitro liposome-binding
    assays with wild-type P3 trimers and N-terminal helix deletion variants.
  hypothesis: The N-terminal alpha-helices of P3 insert into the outer leaflet of
    phosphatidylglycerol-rich membranes to orient pseudohexameric capsomers for cooperative
    P30-guided facet assembly.
