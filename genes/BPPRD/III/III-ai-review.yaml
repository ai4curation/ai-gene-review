id: P22535
gene_symbol: III
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10658
  label: Enterobacteria phage PRD1
description: Major capsid protein P3 of the lipid-containing tectivirus Enterobacteria
  phage PRD1. P3 folds into a tandem double-jelly-roll (two eight-stranded beta-barrel)
  architecture and forms pseudohexameric homotrimers that assemble in 240 copies
  (720 subunits) onto the outer surface of the internal viral lipid membrane vesicle
  to construct the pseudo T=25 icosahedral capsid shell. Within the capsid lattice,
  P3 facets are cemented along icosahedral edges by the tape-measure protein P30
  and interlock at the five-fold vertices with the P31 penton base and the integral
  membrane vertex protein P16.
existing_annotations:
- term:
    id: GO:0019028
    label: viral capsid
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: located_in
  supporting_entities:
  - UniProtKB-KW:KW-0167
  review:
    summary: P3 is the major structural protein that forms the 240 pseudohexameric
      trimers of the PRD1 pseudo T=25 icosahedral capsid shell, so the general viral
      capsid term should be refined to GO:0019030 (icosahedral viral capsid).
    action: MODIFY
    reason: X-ray crystallography and cryo-EM reconstructions demonstrate that 240
      copies of P3 pseudohexameric trimers assemble on an icosahedral lattice with
      pseudo T=25 triangulation [PMID:17416681]. Refining GO:0019028 (viral capsid)
      to its specific descendant GO:0019030 (icosahedral viral capsid) captures the
      established capsid geometry.
    proposed_replacement_terms:
    - id: GO:0019030
      label: icosahedral viral capsid
    supported_by:
    - reference_id: PMID:17416681
      supporting_text: The capsid (70 nm in diameter) is composed mainly of one protein,
        the major capsid protein P3 (43 kDa), which forms pseudohexameric trimers.
        Two hundred forty copies of these trimers are organized on an icosahedral
        lattice with pseudo T = 25 triangulation
core_functions:
- description: Assembles as 240 pseudohexameric homotrimers on a pseudo T=25 icosahedral
    lattice over the internal phage membrane vesicle, interlocking with P30 along
    facet edges and with P31 and P16 at five-fold vertices to form the outer proteinaceous
    capsid shell.
  supported_by:
  - reference_id: PMID:17416681
    supporting_text: The capsid (70 nm in diameter) is composed mainly of one protein,
      the major capsid protein P3 (43 kDa), which forms pseudohexameric trimers. Two
      hundred forty copies of these trimers are organized on an icosahedral lattice
      with pseudo T = 25 triangulation
  - reference_id: PMID:17416681
    supporting_text: The linear tape-measure protein P30 defines the size of the virus
      and cements the P3 facets together. At the vertex, P31 constitutes the base
      of the spike complex, interlocking with P3 and P16
  - reference_id: PMID:11697904
    supporting_text: In addition to the major capsid protein P3, the capsid contains
      a 9 kDa protein P30. Protein P30 is proposed to be located between the adjacent
      facets of the icosahedral capsid and is required for stable capsid assembly.
