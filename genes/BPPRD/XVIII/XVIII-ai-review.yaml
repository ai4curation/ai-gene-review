suggested_questions:
- question: How do the three closely spaced transmembrane helices of P18 generate or stabilize the high positive membrane
    curvature required to remodel the spherical PRD1 lipid vesicle into a ~14 nm cylindrical tail tube?
  experts:
  - Dennis H. Bamford
  - Hanna M. Oksanen
  - Nicola G. A. Abrescia
suggested_experiments:
- description: Reconstitute purified P18 (alone and in combination with P14, P32, and P34) into proteoliposomes mimicking
    the PRD1 inner membrane lipid composition and analyze membrane tubulation by cryo-EM.
  hypothesis: P18 oligomers act as intrinsic wedge-like curvature generators in the phosphatidylethanolamine-rich viral membrane,
    driving spontaneous tubulation once vertex constraints are released.
  experiment_type: Proteoliposome reconstitution and cryo-EM tubulation assay
