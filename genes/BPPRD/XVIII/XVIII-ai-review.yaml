  label: Enterobacteria phage PRD1
description: Protein P18 (gene XVIII) is a 90-residue multi-pass integral membrane protein of the Enterobacteria phage PRD1
  viral inner membrane containing three transmembrane helices (residues 1-21, 37-57, and 60-80). It is an essential component
  of the phage DNA injection machinery required for the spherical-to-tubular transformation of the internal viral membrane
  vesicle, forming the tail-like membrane conduit that connects the virion interior with the host bacterial cytosol to deliver
  the viral dsDNA genome.
