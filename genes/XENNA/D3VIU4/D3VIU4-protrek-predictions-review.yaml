id: D3VIU4
gene_symbol: fliY
taxon:
  id: NCBITaxon:406817
  label: Xenorhabdus nematophila ATCC 19061
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for FliY, the periplasmic substrate-binding
  component of the FliY-YecSC (TcyJLN) high-affinity L-cystine ABC importer of
  Xenorhabdus nematophila. The protein has no GOA annotations. ProTrek gets the substrate
  right at rank 2: L-cystine transport is an exact match to this review's core biological
  process, reached from sequence alone despite the misleading "fliY" gene name that
  derives only from chromosomal proximity to flagellar genes. Rank 1 and rank 3 are the
  characteristic failures - a mechanism the protein does not use (ligand-gated ion channel
  activity; a periplasmic binding protein is not a channel) and the wrong amino acid
  (L-histidine, the substrate of the HisJ paralog that dominates SBP family 3 in
  SwissProt). ProtNLM2 made no GO prediction for this protein.
  Assessment: 1 correct novel (COR), 1 incorrect (NPI), 1 incorrect (PLI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/XENNA/D3VIU4/D3VIU4-uniprot.txt
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0015276
      label: ligand-gated monoatomic ion channel activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 14.64). FliY is a soluble periplasmic binding protein: it
        captures L-cystine and hands it to the inner-membrane YecSC components, and has no
        membrane-spanning region and no conductance pathway. The prediction comes from the
        type II periplasmic-binding-protein fold, which is genuinely shared with the
        extracellular ligand-binding domains of ionotropic glutamate receptors - a fold-level
        match that is structurally real and functionally wrong. It would also be a taxon
        oddity: ligand-gated ion channels of this type are eukaryotic.
      supported_by:
        - reference_id: file:XENNA/D3VIU4/D3VIU4-deep-research-falcon.md
          supporting_text: >-
            [Inferred from E. coli ortholog characterization] FliY serves as the periplasmic
            substrate-binding component of an ATP-binding cassette (ABC) transporter complex designated FliY-YecSC
            (also known as TcyJLN). This system functions as a high-affinity importer of L-cystine. The FliY-YecSC
            system achieves half-maximal transport at approximately 30 nanomolar cystine concentration.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0015811
      label: L-cystine transport
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 2 (score 13.82) and an exact match to this review's core biological process.
        Correct, specific, novel with respect to GOA (which is empty for this entry), and
        arrived at despite the gene name pointing at flagellar biology - the model names the
        actual substrate of the transporter rather than inheriting the misleading label. The
        strongest novel-correct call in the bacterial half of the benchmark.
      supported_by:
        - reference_id: file:XENNA/D3VIU4/D3VIU4-deep-research-falcon.md
          supporting_text: >-
