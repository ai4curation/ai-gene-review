            (also known as TcyJLN). This system functions as a high-affinity importer of L-cystine. The FliY-YecSC
            system achieves half-maximal transport at approximately 30 nanomolar cystine concentration.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1902024
      label: L-histidine transport
    predicted_term_type: GO_BP
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 3 (score 13.59), only 0.23 score units below the correct rank-2 call. Histidine
        transport is the function of HisJ, the best-characterised member of solute-binding
        protein family 3 and the one with the most SwissProt text behind it; this protein is
        the cystine-specific paralog. The pair is a compact demonstration that ProTrek's
        score ordering does not separate the right substrate from the family's most-annotated
        substrate, so a user taking the top hit or the top three without checking would
        annotate both.
      supported_by:
        - reference_id: file:XENNA/D3VIU4/D3VIU4-deep-research-falcon.md
          supporting_text: >-
