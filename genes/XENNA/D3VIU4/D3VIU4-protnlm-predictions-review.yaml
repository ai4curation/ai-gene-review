id: D3VIU4
gene_symbol: D3VIU4
taxon:
  id: NCBITaxon:406817
  label: Xenorhabdus nematophila ATCC 19061
status: COMPLETE
description: >-
  D3VIU4 (XNC1_0570, submitter name fliY) is a 262-residue protein with an N-terminal signal peptide
  and a single family-3 solute-binding domain, the architecture of a soluble periplasmic substrate-binding
  subunit of an ABC importer, most likely for L-cystine. It has no transmembrane segments, so it cannot
  form an ion-conducting pore, and the one ProtNLM2 prediction (ligand-gated monoatomic ion channel
  activity) is refuted by the domain architecture. No experimental study of D3VIU4 was found in PubMed.
source_documents:
  - genes/XENNA/D3VIU4/D3VIU4-uniprot.txt
  - genes/XENNA/D3VIU4/D3VIU4-goa.tsv
  - genes/XENNA/D3VIU4/D3VIU4-hypotheses/prediction-ligand-gated-ion-channel/openscientist.md
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0015276
      label: ligand-gated monoatomic ion channel activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      confidence_score: 0
      summary: >-
        The 262-residue target has an N-terminal signal peptide (1-28) followed by a solute-binding protein
        family 3 domain covering residues 40-259, and the record has no transmembrane segments. This is
        the architecture of an exported periplasmic binding protein, not a pore-forming channel. Family-3
        binding modules resemble the ligand-binding lobes of ionotropic glutamate receptors, but in those
        channels the module is fused to a transmembrane pore domain that D3VIU4 lacks. In the characterised
        E. coli cystine importer (FliY, a sister subfamily) the binding protein hands its ligand to separate
        membrane-spanning and ATPase partners (YecS, YecC), which is the role the gene review assigns to
        D3VIU4 alongside its neighbouring ATPase and permease genes. The gene review carries no channel
        annotation, the PANTHER PTHR35936 family review records that the target lacks the pore architecture
        required for this activity, and the OpenScientist investigation of this prediction reached the
        same conclusion from domain and structural analysis. Binding a transported ligand does not make
        the binding component a ligand-gated ion channel.
      supported_by:
        - reference_id: file:XENNA/D3VIU4/D3VIU4-uniprot.txt
          supporting_text: 'FT   SIGNAL          1..28'
        - reference_id: file:XENNA/D3VIU4/D3VIU4-uniprot.txt
          supporting_text: 'FT   DOMAIN          40..259'
        - reference_id: file:XENNA/D3VIU4/D3VIU4-uniprot.txt
          supporting_text: 'DR   InterPro; IPR001638; Solute-binding_3/MltF_N.'
        - reference_id: file:XENNA/D3VIU4/D3VIU4-uniprot.txt
          supporting_text: 'Belongs to the bacterial solute-binding protein 3 family.'
        - reference_id: PMID:26350134
          supporting_text: >-
            inspection suggested that YecS and YecC were likely to be the ATPase and membrane-spanning
            partners of FliY in an ATP-binding cassette (ABC) transport system
        - reference_id: file:XENNA/D3VIU4/D3VIU4-hypotheses/prediction-ligand-gated-ion-channel/openscientist.md
          supporting_text: >-
            D3VIU4 has the binding clamshell but **none of the channel/pore module**
