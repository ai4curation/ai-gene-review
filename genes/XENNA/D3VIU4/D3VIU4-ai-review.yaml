- term:
    id: GO:0016597
    label: amino acid binding
  evidence_type: ISS
  original_reference_id: file:XENNA/D3VIU4/D3VIU4-bioinformatics/RESULTS-rereview.md
  qualifier: enables
  review:
    summary: >-
      D3VIU4 is in PANTHER PTHR35936:SF34 with B. subtilis TcyA, the binding protein of an
      L-cystine uptake ABC system, and conserves the two binding-pocket residues (Tyr49 and
      Trp87, equivalent to Ngo0372 Tyr59/Trp97) that line the L-cystine site of the
      N. gonorrhoeae receptor Ngo0372 (Kd 21 nM). PAINT places GO:0016597 as an IBD at the
      PTHR35936 node PTN000438641. GO has no L-cystine binding term, so amino acid binding is
      the most specific available MF term. This does not rely on the E. coli FliY/TcyJ
      ortholog claim of the earlier draft: E. coli TcyJ is in subfamily SF35, not SF34.
    action: NEW
    reason: >-
      Ligand-binding function of a family-3 SBP, inferred from subfamily membership with
      TcyA, conserved pocket residues and conserved operon context; no direct binding assay
      exists for D3VIU4.
    supported_by:
    - reference_id: file:XENNA/D3VIU4/D3VIU4-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        Ngo0372 Tyr58 and Trp96 (UniProt SV2 numbering; Tyr59/Trp97 in PMID:22138345, where
        Tyr59 is crucial for L-cystine binding) align to D3VIU4 Tyr49 and Trp87.
    - reference_id: PMID:22138345
      supporting_text: >-
        Dissociation constants of 21 and 33 nM for L-cystine and
        L-selenocystine, respectively, were determined by isothermal titration
        calorimetry.
    - reference_id: file:XENNA/D3VIU4/D3VIU4-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'DR   PANTHER; PTHR35936:SF34; ABC TRANSPORTER EXTRACELLULAR-BINDING PROTEIN YCKB-RELATED; 1.'
- term:
    id: GO:0015811
    label: L-cystine transport
  evidence_type: ISS
  original_reference_id: file:XENNA/D3VIU4/D3VIU4-bioinformatics/RESULTS-rereview.md
  qualifier: involved_in
  review:
    summary: >-
      As the substrate-binding subunit of an ABC importer, the SBP does part of the work of
      transport (capturing substrate and delivering it to the permease), so process
      participation is appropriate if the substrate assignment holds. The cystine assignment
      rests on subfamily membership with B. subtilis TcyA (TcyABC mediates L-cystine uptake),
      conserved Ngo0372 pocket residues, and an adjacent ATPase/permease pair matching the
      E. coli tcyJ-tcyN-tcyL arrangement. The substrate range has not been tested, and the
      E. coli work cautions that similarity to FliY does not guarantee cystine use.
    action: NEW
    reason: >-
      Reasonable homology- and synteny-based inference with an explicit caveat on ligand
      specificity; kept, but no longer grounded on direct E. coli FliY orthology or its
      kinetics.
    supported_by:
    - reference_id: PMID:15262924
      supporting_text: >-
        The symporter YhcL and two ATP binding cassette transporters, YtmJKLMN and
        YckKJI, were shown to mediate L-cystine uptake in Bacillus subtilis.
    - reference_id: file:XENNA/D3VIU4/D3VIU4-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        the same SBP-ATPase-permease arrangement as the E. coli fliY(tcyJ)-yecC(tcyN)-yecS(tcyL) cluster
- term:
    id: GO:0055052
    label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
  evidence_type: ISS
  original_reference_id: file:XENNA/D3VIU4/D3VIU4-bioinformatics/RESULTS-rereview.md
  qualifier: part_of
  review:
    summary: >-
      D3VIU4 is the predicted substrate-binding subunit of the ABC importer encoded with the
      adjacent ATPase (XNC1_0571) and permease (XNC1_0572). The earlier draft proposed the
      parent GO:0043190 ABC transporter complex; the specific child for complexes containing
      a substrate-binding subunit is the more informative choice for an SBP.
    action: NEW
    reason: >-
      Refined from the previously proposed GO:0043190 to its descendant GO:0055052, which
      describes exactly this kind of complex (SBP free in the periplasm, joining the
      membrane subunits when loaded).
    supported_by:
    - reference_id: file:XENNA/D3VIU4/D3VIU4-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        XNC1_0570 (D3VIU4, SBP) is followed by XNC1_0571 (D3VIU5, yecC, ABC ATPase, PTHR43166)
