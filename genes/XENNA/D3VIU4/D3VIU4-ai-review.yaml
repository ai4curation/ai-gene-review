suggested_questions:
- question: >-
    Does D3VIU4 bind L-cystine with nanomolar affinity like Ngo0372, or does it prefer a
    related sulfur amino acid (cystathionine, djenkolate, cysteine)?
- question: >-
    Which of the two adjacent SF34 binding proteins (D3VIU4/XNC1_0570 and D3VIU8/XNC1_0574)
    delivers substrate to the XNC1_0571-0572 permease/ATPase?
suggested_experiments:
- description: >-
    Isothermal titration calorimetry or intrinsic tryptophan fluorescence of purified mature
    D3VIU4 (residues 29-262) with L-cystine and related sulfur amino acids; test the Tyr49Ala
    mutant.
- description: >-
    Growth of X. nematophila XNC1_0570 and XNC1_0574 single and double deletions on L-cystine
    as sole sulfur source, with radiolabelled cystine uptake.
