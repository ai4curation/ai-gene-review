- id: file:XENNA/D3VIU4/D3VIU4-deep-research-falcon.md
  title: Deep research report on D3VIU4 fliY from Xenorhabdus nematophila
  publication_type: DEEP_RESEARCH
  findings:
  - statement: >-
      The report treats D3VIU4 as the ortholog of E. coli FliY/TcyJ and transfers E. coli
      kinetics. Subfamily placement does not support that orthology (D3VIU4 is SF34, E. coli
      TcyJ SF35).
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: >-
      Retained for provenance; no longer used as support in this re-review because its
      central inference (direct E. coli FliY orthology) conflicts with the PANTHER subfamily
      placement.
- id: file:XENNA/D3VIU4/D3VIU4-bioinformatics/RESULTS-rereview.md
  title: "D3VIU4 re-review: placement among family-3 cystine-binding proteins"
  findings:
  - statement: >-
      D3VIU4 is in SF34 with TcyA, is 48% identical to TcyA and Ngo0372 versus 39% to E. coli
      TcyJ, conserves the Ngo0372 pocket Tyr/Trp, and sits in a conserved SBP-ATPase-permease
      cluster.
core_functions:
- description: >-
    Periplasmic substrate-binding subunit of an ABC importer, predicted to capture L-cystine
    in the periplasm and deliver it to the adjacent YecSC-type (TcyLN-type) permease and
    ATPase for ATP-driven uptake. Inferred from PANTHER subfamily membership with B. subtilis
    TcyA, conservation of the Ngo0372 cystine-pocket residues and operon context; ligand
    specificity is untested.
  supported_by:
  - reference_id: file:XENNA/D3VIU4/D3VIU4-bioinformatics/RESULTS-rereview.md
    supporting_text: >-
      L-cystine-binding SBP function is therefore a reasonable inference, but it rests on
      subfamily membership with TcyA, conserved pocket residues and synteny, not on
      orthology to E. coli FliY.
  - reference_id: PMID:15262924
    supporting_text: >-
      The symporter YhcL and two ATP binding cassette transporters, YtmJKLMN and
      YckKJI, were shown to mediate L-cystine uptake in Bacillus subtilis.
