gene_symbol: D3VIU4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:406817
  label: Xenorhabdus nematophila ATCC 19061
description: >-
  D3VIU4 (locus XNC1_0570, submitter gene name fliY) is a 262-residue periplasmic
  solute-binding protein of bacterial solute-binding protein family 3 (SBP_bac_3, PF00497)
  from the Gram-negative entomopathogenic bacterium Xenorhabdus nematophila. It has an
  N-terminal signal peptide (residues 1-28) and a single type II periplasmic-binding-protein
  fold (residues 40-259), and is predicted to act in the periplasm as the substrate-capture
  subunit of an ABC importer for L-cystine. The gene lies immediately upstream of an ABC
  ATPase (XNC1_0571, yecC) and a permease (XNC1_0572, yecS/TcyL-type), the same
  binding protein-ATPase-permease arrangement as the cystine uptake operons of other
  bacteria, and a second, related binding protein (XNC1_0574) lies just downstream. Within
  the PANTHER family it groups with Bacillus subtilis TcyA, the binding protein of the TcyABC
  L-cystine uptake system, rather than with the Escherichia coli high-affinity cystine-binding
  protein TcyJ/FliY, which belongs to a sister subfamily. It conserves the tyrosine and
  tryptophan binding-pocket residues of the structurally characterised L-cystine receptor
  Ngo0372 of Neisseria gonorrhoeae. Cystine binding by D3VIU4 itself, its affinity, and
  its exact ligand range (cystine versus related sulfur amino acids) have not been tested.
  Despite the fliY name, it has no known role in flagellar assembly or motility.
