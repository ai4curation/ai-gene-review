  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Cell envelope is true for a periplasmic binding protein but is a general term
      covering the outer membrane, periplasm, cell wall and inner membrane. The evidence
      (signal peptide, soluble SBP architecture) supports the more specific periplasmic
      space term, which the gene already carries.
    action: MODIFY
    reason: >-
      Correct but less specific than the evidence supports; refine to outer
      membrane-bounded periplasmic space (GO:0030288, a part_of descendant already asserted
      on this gene) rather than keeping the general term as non-core.
