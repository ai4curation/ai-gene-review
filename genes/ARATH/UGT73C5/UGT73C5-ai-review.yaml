gene_symbol: UGT73C5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  UGT73C5 (At2g36800; also DOGT1, ZOG3) is a family 1 UDP-glycosyltransferase (GT1,
  PANTHER PTHR48047:SF153) of the UGT73C group, a seven-member clade of Arabidopsis
  thaliana in which six genes lie in a tandem array on chromosome 2. It uses UDP-glucose
  to glucosylate hydroxyl groups on structurally diverse small molecules. In planta it is
  the enzyme responsible for 23-O-glucosylation of the brassinosteroids brassinolide and
  castasterone in seedlings: silencing abolishes detectable brassinolide-23-O-glucoside,
  and overexpression lowers endogenous brassinosteroid levels and produces a
  brassinosteroid-deficient dwarf phenotype that is rescued by applied brassinosteroid,
  consistent with a role in hormone inactivation and homeostasis. It also glucosylates
  the C-3 hydroxyl of the Fusarium trichothecene mycotoxin deoxynivalenol (and
  15-acetyl-deoxynivalenol), which inactivates the toxin, and overexpression increases
  deoxynivalenol tolerance; the gene is induced by deoxynivalenol and weakly by salicylic
  acid, jasmonate and ethylene precursor. In vitro screens show additional, weaker
  O-glucosylation of trans-zeatin, dihydrozeatin, cis-zeatin and quercetin (7-O and
  4'-O). Expression is highest in the vasculature and root tip of young seedlings and
  increases in elongating hypocotyls. Its subcellular location has not been determined
  directly; the predicted single transmembrane helix sits within the soluble GT-B fold
  typical of the family, and the protein has been detected in leaf microsomal fractions.
