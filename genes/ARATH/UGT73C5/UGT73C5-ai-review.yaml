proposed_new_terms:
- proposed_name: brassinosteroid 23-O-glucosyltransferase activity
  proposed_definition: Catalysis of the transfer of a glucosyl group from UDP-glucose to
    the 23-hydroxy group of a brassinosteroid such as brassinolide or castasterone,
    forming a brassinosteroid 23-O-beta-D-glucoside.
  justification: UGT73C5 is the principal brassinolide/castasterone 23-O-glucosyltransferase
    in Arabidopsis seedlings, and no GO molecular function term describes brassinosteroid
    glucosylation.
suggested_questions:
- question: Does loss of UGT73C5 (or combined loss of UGT73C5 and UGT73C6) alter
    endogenous brassinosteroid levels and growth, given that single RNAi lines show only
    subtle hypocotyl phenotypes?
- question: Does endogenous UGT73C5 contribute to deoxynivalenol detoxification during
    Fusarium infection, or only when overexpressed?
- question: Is UGT73C5 cytosolic, peripherally associated with the ER, or integral to a
    membrane via the predicted 146-162 helix?
suggested_experiments:
- hypothesis: UGT73C5 and UGT73C6 act redundantly in brassinosteroid inactivation.
  description: Generate ugt73c5 ugt73c6 CRISPR double mutants and measure endogenous
    brassinosteroids, brassinosteroid glucosides after feeding, and hypocotyl and rosette
    growth.
  experiment_type: genetic and metabolite profiling
- hypothesis: UGT73C5 is a soluble cytosolic enzyme.
  description: Image a functional UGT73C5-fluorescent protein fusion with ER and cytosolic
    markers and test carbonate/detergent extraction of microsomal UGT73C5.
  experiment_type: subcellular localization
- hypothesis: Endogenous UGT73C5 limits deoxynivalenol damage during infection.
  description: Infect ugt73c5 mutants with a deoxynivalenol-producing Fusarium strain and
    quantify deoxynivalenol-3-O-glucoside and disease symptoms.
  experiment_type: pathogen assay
