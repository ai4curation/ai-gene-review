- term:
    id: GO:0098754
    label: detoxification
  evidence_type: IDA
  original_reference_id: PMID:12970342
  qualifier: involved_in
  review:
    summary: UGT73C5 glucosylates deoxynivalenol at C-3; the glucoside no longer inhibits
      in vitro translation, and overexpression in Arabidopsis increases tolerance to
      deoxynivalenol.
    action: ACCEPT
    reason: UGT73C5 itself catalyses the inactivating conjugation, so it performs the
      detoxification step rather than being merely required for it. The activity was
      shown biochemically, in yeast and by overexpression in planta, and the gene is
      rapidly induced by the toxin. The contribution of endogenous UGT73C5 to resistance
      during Fusarium infection has not been tested genetically.
    supported_by:
    - reference_id: PMID:12970342
      supporting_text: Using a wheat germ extract-coupled transcription/translation
        system we have shown that this enzymatic reaction inactivates the mycotoxin
    - reference_id: PMID:12970342
      supporting_text: Constitutive overexpression in Arabidopsis leads to enhanced
        tolerance against deoxynivalenol
