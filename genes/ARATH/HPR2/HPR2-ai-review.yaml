      moderate growth conditions whereas HPR2 provides an overflow mechanism for the
      utilization of excess hydroxypyruvate leaking from peroxisomes under conditions of
      very high photorespiratory flow.
proposed_new_terms: []
suggested_questions:
- question: >-
    Under which natural conditions (light intensity, temperature, peroxisomal NADH supply)
    does the cytosolic HPR2 route carry a substantial fraction of photorespiratory
    hydroxypyruvate flux in wild-type plants?
- question: >-
    Does salicylic acid binding alter HPR2 catalytic activity at physiological SA
    concentrations, and is this relevant to SA-regulated photorespiratory or redox
    processes?
- question: >-
    How much of the in vivo 4-hydroxyphenyllactate formation depends on HPR2 relative to
    HPPR3, and does this have any physiological function in Arabidopsis, which does not
    accumulate rosmarinic acid?
suggested_experiments:
- description: >-
    13C or 14C flux analysis of hydroxypyruvate reduction in wild type, hpr1 and hpr2 under
    high light and high temperature to quantify the share of photorespiratory flux passing
    through cytosolic HPR2.
- description: >-
    Steady-state kinetics of recombinant HPR2 in the presence of salicylic acid to test
    whether SA binding inhibits or activates hydroxypyruvate reduction.
