id: Q9CA90
gene_symbol: HPR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  HPR2 (At1g79870; also called HPPR2) is a cytosolic NAD(P)H-dependent hydroxypyruvate
  reductase of the D-isomer specific 2-hydroxyacid dehydrogenase family (GyaR subfamily).
  It reduces 3-hydroxypyruvate to D-glycerate, preferring NADPH over NADH, and also reduces
  glyoxylate to glycolate and 4-hydroxyphenylpyruvate to 4-hydroxyphenyllactate with lower
  efficiency; its activity is strongly inhibited by oxalate. In leaves HPR2 provides a
  cytosolic bypass to the peroxisomal NADH-dependent hydroxypyruvate reductase HPR1 in the
  photorespiratory C2 cycle, converting hydroxypyruvate that leaves the peroxisome into
  glycerate for return to the chloroplast. hpr2 single mutants are nearly wild type, but
  hpr1 hpr2 double mutants are air-sensitive and recover at elevated CO2, showing that at
  least one of the two enzymes is needed for normal growth in air. HPR2 also contributes to
  formation of the tyrosine-derived metabolite 4-hydroxyphenyllactate, and binds salicylic
  acid in vitro.
