gene_symbol: CDF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  CYCLING DOF FACTOR 1 (CDF1; DOF5.5; At5g62430) is a nuclear Dof-type zinc-finger transcriptional
  repressor whose mRNA and protein peak around dawn. CDF1 binds AAAG-containing Dof sites
  in the CONSTANS (CO) and FLOWERING LOCUS T (FT) promoters in leaf vascular (phloem) tissue
  and represses their transcription in the morning, in part by recruiting the TOPLESS (TPL)
  co-repressor through a conserved non-EAR N-terminal motif. CDF1 is a substrate of the blue-light-activated
  FKF1-GIGANTEA complex: in long afternoons FKF1 and its LKP2/ZTL paralogs bind CDF1 and target
  it for proteasomal degradation, relieving repression of CO and FT and thereby coupling day
  length to flowering time. CDF1 acts redundantly with CDF2, CDF3 and CDF5, and the CDF module
  downstream of GI also influences freezing tolerance and hypocotyl growth.
