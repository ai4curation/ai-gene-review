- term:
    id: GO:0048579
    label: negative regulation of long-day photoperiodism, flowering
  evidence_type: IMP
  original_reference_id: PMID:16002617
  review:
    summary: >-
      CDF1 directly represses the floral activators CO and FT in the morning; its FKF1-GI-dependent
      removal in long days is the mechanism that converts day length into CO/FT induction.
      CDF1 does the regulatory work itself (binding the CO and FT promoters and recruiting
      TPL).
    action: NEW
    reason: >-
      No existing annotation captures CDF1's specific role in photoperiodic flowering; the
      existing flowering terms are generic timing terms. CDF1 is the effector that directly
      represses CO and FT, so the regulation term belongs to it (cf. CO carries positive regulation
      of long-day photoperiodism, flowering).
    supported_by:
    - reference_id: PMID:16002617
      supporting_text: >-
        Plants with elevated levels of CDF1 flower late and have reduced expression of CO.
    - reference_id: PMID:16002617
      supporting_text: >-
        Thus, FKF1 controls daily CO expression in part by degrading CDF1, a repressor of
        CO transcription.
    - reference_id: PMID:22628657
      supporting_text: >-
        These results indicate that CDF1 protein represses FT transcription independently
        of CO transcription.
    - reference_id: PMID:19619493
      supporting_text: >-
        Combining mutations in four of these, including CYCLING DOF FACTOR 2 (CDF2), caused
        photoperiod-insensitive early flowering by increasing CO mRNA levels.
