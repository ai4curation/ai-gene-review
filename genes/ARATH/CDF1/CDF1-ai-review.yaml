core_functions:
- description: >-
    Morning-phased nuclear Dof transcriptional repressor that binds Dof sites in the CO and
    FT promoters and represses their transcription, thereby preventing photoperiodic induction
    of flowering until it is removed by FKF1-GI-mediated degradation in long-day afternoons.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0048579
    label: negative regulation of long-day photoperiodism, flowering
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:16002617
    supporting_text: >-
      CDF1 and CO are expressed in the same tissues, and CDF1 binds to the CO promoter.
  - reference_id: PMID:16002617
    supporting_text: >-
      Thus, FKF1 controls daily CO expression in part by degrading CDF1, a repressor of CO
      transcription.
  - reference_id: PMID:22628657
    supporting_text: indicating that CDF1 binds to the FT promoter regions in the morning.
  - reference_id: PMID:22628657
    supporting_text: >-
      These results indicate that CDF1 protein represses FT transcription independently of
      CO transcription.
  - reference_id: PMID:40263610
    supporting_text: >-
      Here we present the crystal structure of the Dof domain of CYCLING DOF FACTOR 1 (CDF1),
      a well-characterized Dof protein acting as a transcriptional repressor by binding to
      the CONSTANS promoter to regulate photoperiodic flowering, in complex with DNA containing
      two cis elements.
- description: >-
    Recruits the TOPLESS co-repressor to CO and FT promoters through a conserved N-terminal
    non-EAR motif; this interaction is required for full CDF1 repressive activity.
  molecular_function:
    id: GO:0001222
    label: transcription corepressor binding
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:28752516
    supporting_text: >-
      Here we demonstrate that Arabidopsis CDF proteins contain non-EAR motif-like conserved
      domains required for interaction with the TOPLESS (TPL) co-repressor protein.
  - reference_id: PMID:28752516
    supporting_text: >-
      This TPL interaction confers a repressive function on CDF1, as mutations of the N-terminal
      TPL binding domain largely impair the ability of CDF1 protein to repress its targets.
suggested_questions:
- question: >-
    Is CDF1 polyubiquitinated directly by SCF(FKF1) in vivo, and which lysines are used, or
    does GI/FKF1 binding also inhibit CDF1 activity independently of degradation?
- question: >-
    Does the CDF1-TPL complex also act on the GI-CDF targets implicated in freezing tolerance
    and hypocotyl growth, or are those outputs mediated through different co-regulators?
suggested_experiments:
- description: >-
    In vitro ubiquitination of CDF1 with reconstituted SCF(FKF1) plus GI under blue light
    versus dark, combined with lysine-to-arginine CDF1 mutants expressed from the native promoter
    in a cdf1 cdf2 cdf3 cdf5 background, to test whether FKF1-dependent degradation is necessary
    for long-day induction of CO and FT.
