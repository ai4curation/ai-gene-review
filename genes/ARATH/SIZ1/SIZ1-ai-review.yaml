gene_symbol: SIZ1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'SIZ1 (SAP AND MIZ1 DOMAIN-CONTAINING LIGASE 1, At5g60410) is the principal SP-RING-type
  SUMO E3 ligase of Arabidopsis thaliana and the sole plant member of the Siz/PIAS family, orthologous
  to yeast Siz1/Siz2 and mammalian PIAS proteins. It contains an N-terminal SAP (scaffold attachment)
  domain, a plant-specific PHD zinc finger, a PINIT motif, a zinc-coordinating SP-RING (MIZ-type) domain
  and an SXS motif. The SP-RING is required for catalytic activity and nuclear localization, while the
  PHD finger binds the SUMO E2 SCE1 and is needed for efficient substrate sumoylation. Acting with SCE1,
  SIZ1 catalyses conjugation of SUMO1 and SUMO2 to lysines of many, mostly nuclear, proteins and drives
  most of the heat- and drought-induced increase in SUMO conjugates; it localizes to nuclear foci/speckles.
  Through substrate-specific sumoylation it modulates a range of signaling pathways: it sumoylates the
  MYB factor PHR1 in phosphate-starvation responses, the bHLH factor ICE1 (K393) to promote CBF3/DREB1A
  expression and freezing tolerance, the bZIP factor ABI5 (K391) and MYB30 (K283) to attenuate abscisic
  acid signaling, the autonomous-pathway protein FLD to maintain FLC expression and repress flowering,
  and the nitrate reductases NIA1/NIA2 to stimulate nitrate assimilation; it also sumoylates bromodomain
  GTE proteins, NF-YC10 during heat stress, and itself. Loss of SIZ1 causes salicylic acid hyperaccumulation
  with constitutive PAD4-dependent systemic acquired resistance, dwarfism, early flowering under short
  days, basal (but not acquired) thermosensitivity, drought and freezing sensitivity, ABA hypersensitivity,
  exaggerated phosphate-starvation root remodeling and reduced female fertility.'
