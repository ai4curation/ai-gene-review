  review:
    summary: PAINT IBA placing SIZ1 on chromatin, inherited from the Siz/PIAS node (yeast Siz1/Siz2, fly
      Su(var)2-10, worm GEI-17). SIZ1 carries the N-terminal SAP (scaffold attachment) DNA/chromatin-binding
      domain typical of the family and sumoylates chromatin-associated substrates such as the bromodomain
      protein GTE3 and the FLC regulator FLD, but no study in the cache directly shows plant SIZ1 bound
      to chromatin.
    action: KEEP_AS_NON_CORE
    reason: The family-level inference is phylogenetically reasonable (SAP domain conserved; chromatin
      substrates) and there is no evidence of loss in the plant clade, so the IBA is retained. It is non-core
      because the primary, experimentally established compartment is nuclear foci/speckles, and chromatin
      association has not been tested directly for AtSIZ1.
