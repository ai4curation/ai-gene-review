- term:
    id: GO:0002758
    label: innate immune response-activating signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:17163880
  qualifier: acts_upstream_of_or_within
  review:
    summary: Lee et al. 2007 showed siz1 mutants have constitutive SA accumulation, elevated PR gene expression
      and enhanced resistance to Pst DC3000, reverted by NahG; SIZ1 acts epistatically with PAD4. This
      places SIZ1 as a regulator (in loss-of-function, a repressor) of SA/PAD4-dependent immune signaling,
      not as a component of a receptor-to-response activating pathway.
    action: MODIFY
    reason: The original term (a ligand-receptor signaling pathway that activates innate immunity) does
      not match the data, which show that SIZ1 loss derepresses SA-dependent immunity. The evidence supports
      regulation of salicylic acid mediated signaling. GO has no "negative regulation of SA mediated signaling
      pathway" term, so the regulation parent GO:2000031 is proposed. Later work (PMID:41986387) shows
      SIZ1 overaccumulation can also potentiate immune condensate signaling, further favouring a neutral
      "regulation" term over a directional or pathway-component term.
    proposed_replacement_terms:
    - id: GO:2000031
      label: regulation of salicylic acid mediated signaling pathway
    additional_reference_ids:
    - PMID:41986387
    supported_by:
    - reference_id: PMID:17163880
      supporting_text: Mutant siz1 plants exhibit constitutive systemic-acquired resistance (SAR) characterized
        by elevated accumulation of salicylic acid (SA), increased expression of pathogenesis-related
        (PR) genes
    - reference_id: PMID:17163880
      supporting_text: SIZ1 interacts epistatically with PAD4 to regulate PR expression and disease resistance.
    - reference_id: PMID:41986387
      supporting_text: SIZ1 overaccumulation unexpectedly activates robust immune responses and cell death,
        dependent on its E3 ligase activity
    - reference_id: file:ARATH/SIZ1/SIZ1-deep-research-openscientist.md
      supporting_text: SIZ1 therefore both restrains basal SA immunity and reinforces activated immune
        condensates in a dose- and context-dependent manner.
