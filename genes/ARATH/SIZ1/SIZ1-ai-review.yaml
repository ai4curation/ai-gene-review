- term:
    id: GO:0009826
    label: unidimensional cell growth
  evidence_type: IMP
  original_reference_id: PMID:20007967
  qualifier: acts_upstream_of_or_within
  review:
    summary: Miura et al. 2010 attributed the siz1 dwarf shoot to reduced leaf cell volume and number;
      these defects, and reduced XTH8/XTH31 expression, are suppressed by NahG, i.e. they are secondary
      to SA hyperaccumulation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The phenotype is leaf cell expansion that is reversed by removing SA, so it is an indirect
      consequence of the autoimmune SA accumulation of siz1 rather than SIZ1 acting in cell growth. Moreover
      "unidimensional cell growth" (polarized, single-axis growth as in root hairs or pollen tubes) is
      a poor fit for leaf cell volume. Not core.
    supported_by:
    - reference_id: PMID:20007967
      supporting_text: Mature siz1-2 and siz1-3 plants exhibited a dwarf-like shoot phenotype that is
        attributable to decreased leaf cell volume and number relative to the wild type. Cell division
        and expansion defects caused by siz1 were also suppressed by the expression of nahG.
