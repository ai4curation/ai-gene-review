suggested_questions:
- question: Which SIZ1 substrates account for the repression of salicylic acid accumulation and constitutive
    SAR in siz1, and how is this reconciled with the immune-potentiating effect of SIZ1 overaccumulation
    in MAC-dependent nuclear condensates?
- question: Does SIZ1 bind chromatin through its SAP domain in planta, and does this target it to specific
    loci such as FLC or stress-responsive promoters?
- question: What determines whether SIZ1-mediated sumoylation stabilizes (ICE1, FLC) or destabilizes (HAT1)
    a substrate, and which SUMO-targeted ubiquitin ligases read these marks?
- question: Which SUMO-interacting motif(s) in SIZ1 mediate the SUMO1 interaction reported in yeast two-hybrid
    screens, and are they required for E3 activity as in mammalian PIAS proteins?
- question: Which substrates mediate SIZ1's role in maintaining the mature female gametophyte, and is
    the phenotype independent of salicylic acid?
suggested_experiments:
- hypothesis: SIZ1 has a defined, condition-specific substrate repertoire that accounts for its stress
    phenotypes.
  description: Quantitative site-specific SUMO proteomics (SUMO remnant or His-SUMO1/2 enrichment) in
    wild type, siz1-2 and SP-RING catalytic-mutant complemented lines under heat, cold, drought and phosphate
    starvation.
  experiment_type: proteomics
- hypothesis: SA-dependent and SA-independent siz1 phenotypes are separable by substrate.
  description: Combine siz1 with NahG/sid2 and express non-sumoylatable alleles of candidate substrates
    (PHR1, ICE1, ABI5, FLD, NIA1/2, TPR1) to determine which phenotypes are restored by SA removal versus
    substrate sumoylation.
  experiment_type: genetic interaction
- hypothesis: The plant-specific PHD finger presents substrates and SCE1 to the SP-RING catalytic core.
  description: Determine a structure of the SIZ1 PHD-PINIT-SP-RING region bound to SCE1~SUMO1 and a substrate
    (e.g. GTE3) by cryo-EM or crystallography, and test interface mutants in vitro and in complementation.
  experiment_type: structural biology
