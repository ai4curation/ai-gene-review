  evidence_type: IPI
  original_reference_id: PMID:28825728
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT4G18960
  review:
    summary: >-
      Xiao et al. 2017 show that PRE-binding transcription factors physically interact with and recruit
      PRC2. The GOA row records VRN2 binding to the MADS-box transcription factor AGAMOUS (AT4G18960).
    action: MODIFY
    reason: >-
      The interacting partner given in GOA is AGAMOUS, a DNA-binding MADS-box transcription factor, not
      a transcriptional corepressor. The supported claim is that a PRC2 Su(z)12 subunit binds a sequence-specific
      transcription factor that recruits it, so DNA-binding transcription factor binding is the more accurate
      term. The full text was not available, so the specific assay is not re-adjudicated.
    proposed_replacement_terms:
    - id: GO:0140297
      label: DNA-binding transcription factor binding
    supported_by:
    - reference_id: PMID:28825728
      supporting_text: >-
        We identify transcription factor families that bind to these PREs, colocalize with PRC2 on chromatin,
        physically interact with and recruit PRC2, and are required for PRC2-mediated gene silencing in
        vivo.
- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: ISS
  original_reference_id: PMID:11118137
  qualifier: enables
  review:
    summary: >-
      Assignment of VRN2 as a DNA-binding transcription factor in a genome-wide transcription-factor catalog,
      based on its zinc finger.
    action: REMOVE
    reason: >-
      VRN2 is a Su(z)12/VEFS-family Polycomb group protein that acts as a core PRC2 subunit. No evidence
      shows sequence-specific DNA-binding transcription factor activity. Its C2H2-type zinc finger is
      the conserved SUZ12 zinc-finger module, not a TF DNA-binding domain. PRC2 is recruited to targets
      by separate sequence-specific transcription factors.
    supported_by:
