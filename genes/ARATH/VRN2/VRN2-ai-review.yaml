  review:
    summary: >-
      IBA DNA methylation-dependent constitutive heterochromatin formation, seeded from FIS2 (AT2G35670).
    action: MODIFY
    reason: >-
      VRN2-PRC2 represses developmental genes such as FLC by H3K27 trimethylation. This is facultative
      heterochromatin, and the DNA-methylation dependence seen for the seed-specific FIS2-PRC2 at imprinted
      loci is not established for VRN2. The process inherited by the VEFS family is Polycomb facultative
