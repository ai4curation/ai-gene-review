suggested_questions:
- question: >-
    What distinguishes VRN2-PRC2 from EMF2-PRC2 in target specificity, and why is VRN2 specifically required
    at FLC?
- question: >-
    Does VRN2 contact the VRN5 PHD-FNIII module directly, and is this the sole route by which VEL proteins
    join PRC2?
suggested_experiments:
- hypothesis: >-
    VRN2-specific sequences outside the VEFS box confer FLC targeting and VEL-protein binding.
