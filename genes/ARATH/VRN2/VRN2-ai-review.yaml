id: Q8W5B1
gene_symbol: VRN2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  VRN2 (VERNALIZATION 2) is a nuclear Polycomb group protein of Arabidopsis, one of three Su(z)12 homologs
  (with EMF2 and FIS2) with a SUZ12-type zinc finger and a VEFS box. It is a core subunit of VRN2-PRC2
  complexes, together with the E(z) methyltransferases CLF or SWN, the ESC homolog FIE and the p55 homolog
  MSI1. VRN2 associates with the FLC locus independently of cold. During prolonged cold it joins the VEL-family
  accessories VIN3, VRN5 and VEL1 to form PHD-PRC2, which nucleates H3K27me3 in a small region of FLC;
  after return to warmth the mark spreads over the locus. VRN2 is therefore needed for FLC to stay repressed
  after winter, the cellular memory of vernalization, rather than for its initial cold-dependent down-regulation.
  VRN2 acts partly redundantly with EMF2 in vegetative Polycomb silencing more generally.
