      supporting_text: >-
        MEA and FIS2 act specifically in seed, whereas CLF and SWN show overlapping and partially redundant
        roles in the plant body as do EMF2 and VRN2
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
