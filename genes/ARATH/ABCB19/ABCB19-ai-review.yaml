core_functions:
- description: ATP-driven plasma-membrane exporter of auxin (IAA) that sustains long-distance
    polar auxin transport streams (basipetal in shoots, acropetal in the root central cylinder),
    acting together with PIN efflux carriers.
  molecular_function:
    id: GO:0010329
    label: auxin efflux transmembrane transporter activity
  directly_involved_in:
  - id: GO:0010315
    label: auxin export across the plasma membrane
  - id: GO:0010540
    label: basipetal auxin transport
  - id: GO:0010541
    label: acropetal auxin transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:39497419
    supporting_text: Auxin efflux activities of ABCB1 and ABCB19 have been demonstrated by
      either the reduced indole-3-acetic acid (IAA) export in Arabidopsis protoplasts isolated
      from abcb1, abcb19, and abcb1 abcb19 mutants or the increased IAA export in heterologous
      systems
  - reference_id: PMID:11701880
    supporting_text: Auxin transport activity was greatly impaired in atmdr1 and atmdr1 atpgp1
      double mutant plants.
  - reference_id: PMID:11701880
    supporting_text: Epinastic cotyledons and reduced apical dominance were mutant phenotypes
      consistent with the disrupted basipetal flow of auxin.
  - reference_id: PMID:17557805
    supporting_text: Mutations in Multidrug Resistance-Like1 (MDR1) reduced acropetal auxin
      transport in roots by 80% without affecting basipetal transport.
  - reference_id: PMID:21666806
    supporting_text: phosphorylation of ABCB19 by phot1 inhibits its efflux activity
- description: ABC-type (ATPase-coupled) transporter activity that exports bioactive brassinosteroids
    to the apoplast, supplying ligand to the cell-surface BRI1 receptor.
  molecular_function:
    id: GO:0140359
    label: ABC-type transporter activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:38513023
    supporting_text: a member of the ATP-binding cassette (ABC) transporter superfamily, ABCB19,
      functions as a brassinosteroid exporter
  - reference_id: PMID:38513023
    supporting_text: Bioactive brassinosteroids are potent activators of ABCB19 ATP hydrolysis
      activity, and transport assays showed that ABCB19 transports brassinosteroids.
suggested_questions:
- question: How does a single ABCB19 binding cavity accommodate both IAA and brassinosteroids,
    and is there competition between the two substrates in planta?
  experts:
  - ABC transporter structural biologists
  - Plant hormone transport researchers
- question: A GO process term for brassinosteroid export/transport does not exist; should
    one be requested so that ABCB19/ABCB1 BR export can be annotated precisely?
  experts:
  - GO editors
suggested_experiments:
- hypothesis: IAA and brassinolide compete for the same ABCB19 binding site.
  description: Measure brassinolide-stimulated ATPase and IAA transport of purified ABCB19
    (with TWD1) in proteoliposomes in the presence of increasing concentrations of the other
    substrate, and test binding-pocket mutants.
