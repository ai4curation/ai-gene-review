- question: How does a single ABCB19 binding cavity accommodate both IAA and brassinosteroids, and is
    there competition between the two substrates in planta?
  experts:
  - ABC transporter structural biologists
  - Plant hormone transport researchers
- question: A GO process term for brassinosteroid export/transport does not exist; should one be requested
    so that ABCB19/ABCB1 BR export can be annotated precisely?
  experts:
  - GO editors
suggested_experiments:
- hypothesis: IAA and brassinolide compete for the same ABCB19 binding site.
  description: Measure brassinolide-stimulated ATPase and IAA transport of purified ABCB19 (with TWD1)
    in proteoliposomes in the presence of increasing concentrations of the other substrate, and test binding-pocket
    mutants.
