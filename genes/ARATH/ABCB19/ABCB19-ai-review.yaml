- term:
    id: GO:0043481
    label: anthocyanin accumulation in tissues in response to UV light
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00085884
  review:
    summary: UV-specific anthocyanin involvement remains unresolved despite established pigment responses
      to other wavelengths.
    action: UNDECIDED
    reason: 'Full PMID:15908594 Fig.3C now resolves the cited assay: anthocyanin was measured after continuous
      far-red or blue light, and Methods specifies far-red/red/blue LEDs. The UV-A mention describes photoreceptors
      in the introduction, not a target UV experiment. GO:0043481 requires a UV stimulus. Other reviewed
      ABCB19 evidence establishes auxin/BR transport and blue-light-dependent physiology but does not
      independently resolve the UV-specific pigment response. A genuine pigment phenotype under other
      wavelengths neither establishes nor contradicts UV involvement; retain UNDECIDED for the biological
      claim, without treating this source limitation as evidence of absence.'
    supported_by:
    - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC1150410_.md
      supporting_text: Seedlings (approximately 100) were grown in continuous far-red or blue light for
        4 d before anthocyanin extraction.
