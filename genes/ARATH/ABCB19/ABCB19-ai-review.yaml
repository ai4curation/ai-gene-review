- term:
    id: GO:0048229
    label: gametophyte development
  evidence_type: IMP
  original_reference_id: PMID:35512423
  qualifier: acts_upstream_of_or_within
  review:
    summary: ABCB19 contributes with ABCB1 to the auxin-distribution context of male gametophyte development.
    action: KEEP_AS_NON_CORE
    reason: 'Full PMID:35512423 Fig.5 tests abcb1 abcb19 as well as twd1: the double mutant has reduced
      pollen number and viability and abnormal nuclei. This supports a contextual reproductive contribution
      of the transporters, not exclusive ABCB19 necessity or a direct pollen-mitosis enzyme. Failed cell
      plates/callose aggregation are TWD1-specific and are not assigned to ABCB19.'
    supported_by:
    - *id001
- term:
    id: GO:0048364
    label: root development
  evidence_type: IMP
  original_reference_id: PMID:17557805
  qualifier: acts_upstream_of_or_within
  review:
    summary: mdr1 roots grow with exaggerated waving/curvature. The phenotype reflects altered auxin (or
      brassinosteroid) distribution caused by loss of ABCB19 transport activity.
    action: KEEP_AS_NON_CORE
    reason: Native mdr1 mutations reduce root acropetal auxin transport and alter straight growth and
      auxin distribution. The primary study reports normal reorientation gravitropism in its tested background;
      this root-development role is retained without making all gravitropic phenotypes universal.
    supported_by:
    - reference_id: PMID:17557805
      supporting_text: Vertically grown mdr1 roots produced positive and negative curvatures threefold
        greater than the wild type
