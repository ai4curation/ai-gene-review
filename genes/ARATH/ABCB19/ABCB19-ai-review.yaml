id: Q9LJX0
gene_symbol: ABCB19
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ABCB19 is a full-size ABCB transporter with two nucleotide-binding and two transmembrane
  domains. At the plasma membrane it supports cellular auxin export and long-distance auxin distribution,
  including basipetal transport in shoots and acropetal transport through roots. Where ABCB19 and PIN1
  overlap, their interaction can stabilize PIN1 and alter transport efficiency; ABCB19 also acts outside
  those overlapping domains. ABCB19 directly exports bioactive brassinosteroids, supplying extracellular
  hormone for BR signaling. Purified-protein studies readily demonstrate BR transport but did not detect
  IAA transport under the same reconstitution conditions, whereas cells expressing ABCB19 with TWD1 show
  IAA export. Its physiological effects include light-dependent growth, lateral-root elongation, organ-boundary
  formation, late stamen elongation and shoot branching.
