    label: auxin efflux transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:38513023
  qualifier: enables
  review:
    summary: Cellular auxin export remains supported alongside direct brassinosteroid transport.
    action: ACCEPT
    reason: The full 2024 primary includes HEK293F cells coexpressing ABCB19 and TWD1 with lower radiolabeled
      IAA accumulation than the TWD1-only control (Fig.S3F), consistent with export. Purified ABCB19 lacked
      detectable IAA binding, ATPase stimulation and active proteoliposome accumulation under the tested
      conditions; those negative assays constrain reconstitution, not the independently supported cellular
      transport function.
    supported_by:
    - reference_id: PMID:39497419
      supporting_text: Auxin efflux activities of ABCB1 and ABCB19 have been demonstrated by either the
        reduced indole-3-acetic acid (IAA) export in Arabidopsis protoplasts isolated from abcb1, abcb19,
        and abcb1 abcb19 mutants or the increased IAA export in heterologous systems
