  review:
    summary: Interaction of SLAC1 with the weakly rectifying K+ channel AKT2; UniProt curators
      record from the same paper that SLAC1 binds and inhibits AKT2.
    action: MODIFY
    reason: Bare protein binding is uninformative. The functional content of the interaction is
      inhibition of the K+ channel, which is captured by potassium channel inhibitor activity
      (GO:0019870). Evidence is from a single study and the cached text is abstract-only, so this
      is non-core. PMID:23126621 instead finds reduced inward potassium currents in slac1 loss-of-function
      guard cells, rescued by lowering cytosolic calcium. These results support feedback regulation
      and leave the physiological contribution of the direct inhibitory interaction unresolved;
      it is not promoted to a core function. AKT2 has inward-rectifying and nonrectifying gating
      modes (PMID:16316977); the available SLAC1 evidence does not resolve the inhibited gating
      mode, so the broader potassium-channel inhibitor term is retained for this target.
