- question: Is potassium channel inhibitor activity (KAT1, AKT2) a physiologically
    significant SLAC1 function, given that it rests on a single study, and should
    GO:0019870 be annotated to SLAC1 by TAIR?
- question: How does SLAC1 integrate phosphorylation by multiple kinases (OST1, CPK6/21/23,
    SIF2, and the GHR1 pseudokinase scaffold) at distinct N-terminal sites to set
    channel open probability?
