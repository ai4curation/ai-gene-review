core_functions:
- description: Phosphorylation-activated, anion-selective (NO3- > Cl- >> malate),
    weakly voltage-dependent S-type anion channel in the guard-cell plasma membrane.
    Each protomer of the SLAC1 homotrimer forms a five-helix pore gated by Phe450;
    phosphorylation of the cytosolic N-terminus by OST1, CPKs or SIF2 releases an
    inhibitory cytosolic plug, allowing anion efflux that depolarizes the guard cell
    and drives K+ efflux, turgor loss and stomatal closure.
  molecular_function:
    id: GO:0008308
    label: voltage-gated monoatomic anion channel activity
  directly_involved_in:
  - id: GO:0090332
    label: stomatal closure
  - id: GO:1902476
    label: chloride transmembrane transport
  - id: GO:0015706
    label: nitrate transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  anatomical_locations:
  - id: PO:0000293
    label: guard cell
  supported_by:
  - reference_id: PMID:19955405
    supporting_text: Our studies demonstrate that SLAC1 represents the slow, deactivating,
      weak voltage-dependent anion channel of guard cells controlled by phosphorylation/dephosphorylation.
  - reference_id: PMID:18305484
    supporting_text: The plasma membrane protein SLAC1 is essential for stomatal closure
      in response to CO2, abscisic acid, ozone, light/dark transitions, humidity change,
      calcium ions, hydrogen peroxide and nitric oxide.
  - reference_id: PMID:20981093
    supporting_text: SLAC1 is a symmetrical trimer composed from quasi-symmetrical
      subunits, each having ten transmembrane helices arranged from helical hairpin
      pairs to form a central five-helix transmembrane pore that is gated by an extremely
      conserved phenylalanine residue.
  - reference_id: PMID:35523967
    supporting_text: An inhibition-release model is proposed for SLAC1 activation by
      phosphorylation that the cytosolic plug dissociates from the transmembrane domain
      upon phosphorylation, and induces conformational changes to open the pore.
