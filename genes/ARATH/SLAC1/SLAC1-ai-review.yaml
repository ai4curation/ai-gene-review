core_functions:
- description: Phosphorylation-activated, weakly voltage-dependent S-type anion channel in the guard-cell plasma
    membrane. It mediates nitrate and chloride efflux that depolarises guard cells and drives stomatal closure downstream
    of OST1, CPKs and other kinases.
