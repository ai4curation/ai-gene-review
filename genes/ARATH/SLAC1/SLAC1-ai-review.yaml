gene_symbol: SLAC1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'SLAC1 (SLOW ANION CHANNEL-ASSOCIATED 1, At1g12480) is the guard-cell S-type anion channel of Arabidopsis.
  It is a plasma-membrane protein of the SLAC1/TehA family: each protomer has ten transmembrane helices forming
  a five-helix anion pore gated by a conserved phenylalanine (Phe450), and the channel assembles as a trimer. SLAC1
  is electrically silent until protein kinases phosphorylate its cytosolic N-terminal tail. The kinases are the
  ABA-activated SnRK2 OST1 (Ser120), calcium-dependent kinases CPK6/21/23, and the receptor-like kinases GHR1 and
  SIF2; clade A PP2Cs such as ABI1 and PP2CA antagonise them. Activated SLAC1 carries a slow, weakly voltage-dependent
  efflux of nitrate and chloride. The resulting guard-cell depolarisation drives K+ efflux, loss of turgor and stomatal
  closure in response to ABA, elevated CO2, ozone, darkness, low humidity, reactive oxygen species and pathogen
  signals. SLAC1 also binds the inward K+ channel KAT1 and inhibits it, coupling closure to suppression of opening.
  Loss of SLAC1 leaves stomata open, causes anion over-accumulation in guard cells and increases ozone sensitivity
  and water loss.'
