id: Q9LD83
gene_symbol: SLAC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SLAC1 (SLOW ANION CHANNEL-ASSOCIATED 1, At1g12480) is the guard-cell
  slow (S-type) anion channel of Arabidopsis thaliana, a 556-residue plasma-membrane
  protein with ten transmembrane helices and long cytosolic N- and C-terminal tails.
  It is a distant homologue of bacterial TehA and fungal Mae1/Ssu1 transporters and
  founds the plant SLAC/SLAH family. SLAC1 assembles as a homotrimer in which each
  protomer forms its own five-helix anion pore, gated by a conserved phenylalanine
  (Phe450). The channel is selective for anions, preferring nitrate and chloride
  over malate, sulfate and bicarbonate, and is weakly voltage dependent. It is
  electrically silent until phosphorylated on its cytosolic N-terminus by protein
  kinases, chiefly the ABA-activated SnRK2 kinase OST1 (Ser120), calcium-dependent
  protein kinases (CPK6, CPK21, CPK23) and the receptor kinase SIF2 (Ser65);
  phosphorylation releases a cytosolic plug from the transmembrane domain and opens
  the pore, whereas clade A PP2C phosphatases (ABI1, ABI2, PP2CA) keep it inactive.
  SLAC1 is expressed predominantly in guard cells, where anion efflux through it
  depolarises the plasma membrane, drives K+ efflux and loss of turgor, and so
  closes the stomatal pore. It is therefore the terminal effector of stomatal
  closure triggered by abscisic acid, elevated CO2, ozone, low humidity, darkness,
  calcium, reactive oxygen species and nitric oxide, and loss-of-function mutants
  have constitutively open stomata, excess guard-cell anion content, high water
  loss and ozone sensitivity. SLAC1 also binds and inhibits the inward-rectifying
  K+ channel KAT1, coupling closure to suppression of stomatal opening.
