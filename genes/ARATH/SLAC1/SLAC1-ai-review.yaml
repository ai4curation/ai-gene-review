suggested_questions:
- question: How does N-terminal phosphorylation (Ser59 by CPK6, Ser120 by OST1, Ser65 by SIF2) open the Phe450 gate,
    given that the Ser120 phosphomimic alone does not activate SLAC1?
- question: Does the SLAC1-KAT1 inhibitory interaction operate in intact guard cells at native expression levels,
    and is it regulated by the same kinases that activate SLAC1?
- question: What are the relative in vivo contributions of nitrate versus chloride efflux through SLAC1 to stomatal
    closure under different nitrogen conditions?
suggested_experiments:
- hypothesis: OST1 phosphorylation causes a conformational change in the SLAC1 trimer that releases the Phe450 gate.
  description: Determine cryo-EM structures of Arabidopsis SLAC1 in non-phosphorylated and OST1-phosphorylated (or
    multi-site phosphomimetic) states, and test gating with single-channel recordings.
  experiment_type: structural biology / electrophysiology
- hypothesis: SLAC1-mediated KAT1 inhibition contributes to drought-induced suppression of stomatal opening in planta.
  description: Complement slac1 with SLAC1 variants that retain anion conductance but cannot bind KAT1 (C-terminal
    mutants), and measure guard-cell K+in currents and light-induced opening under drought.
  experiment_type: genetic complementation / patch clamp
