core_functions:
- description: Multifunctional cytochrome P450 (CYP701A3) that oxidizes the C-19 methyl of ent-kaur-16-ene
    in three successive steps (ent-kaurenol, ent-kaurenal) to ent-kaur-16-en-19-oate (RHEA:32323), the
    first oxidative step of gibberellin biosynthesis; associated with the outer chloroplast envelope,
    linking plastid and ER steps.
