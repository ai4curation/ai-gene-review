taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GA3 (ent-kaurene oxidase, KO, CYP701A3; At5g25900) is the sole Arabidopsis ent-kaurene oxidase,
  a multifunctional cytochrome P450 that catalyses three sequential oxidations of the C-19 (C4-alpha)
  methyl group of ent-kaur-16-ene via ent-kaurenol and ent-kaurenal to ent-kaurenoic acid, with intermediates
  retained in the active site and the first hydroxylation rate-limiting. KO is targeted to the outer face
  of the plastid envelope (organelle proteomics also co-fractionate it with the ER), where it is thought
  to connect the plastid-localized cyclase steps (GA1/CPS, GA2/KS) to the ER-localized KAO step. It is
  broadly expressed, most strongly in inflorescences and in the cortex/endodermis of germinating embryos.
  ga3 nonsense mutants lack KO activity and are gibberellin-responsive dwarfs.
