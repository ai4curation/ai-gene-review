suggested_questions:
- question: Is KO located on the plastid outer envelope, the ER, or at plastid-ER contact sites in vivo,
    and how is hydrophobic ent-kaurene delivered from the stroma to the enzyme?
suggested_experiments:
- description: Image endogenous-promoter KO-fluorescent protein fusions alongside plastid envelope and
    ER markers at high resolution, and test whether KO co-purifies with plastid-ER contact-site proteins.
