  - *id007
suggested_questions:
- question: >-
    How does a PPP-family phosphatase achieve selectivity for the phosphotyrosine of BIN2, and is pTyr
    dephosphorylation a general property of the Kelch-phosphatase (BSL) family?
- question: >-
    Which of BSU1's two pools (plasma membrane vs nucleus) carries out BIN2 inactivation in vivo?
suggested_experiments:
- description: >-
    Phosphatase assays of recombinant BSU1, BSL1-3 against phospho-Tyr and phospho-Ser/Thr peptides from
    GSK3-like kinases and BZR1/BES1, to define substrate preference quantitatively.
