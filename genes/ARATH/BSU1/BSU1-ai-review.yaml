core_functions:
- description: >-
    Kelch-repeat PPP-family protein phosphatase that, once activated by BRI1-phosphorylated BSK1 and by
    CDG1-mediated Ser764 phosphorylation, dephosphorylates the conserved phospho-Tyr200 of the GSK3-like
    kinase BIN2, inactivating it and allowing accumulation of unphosphorylated BZR1/BES1.
