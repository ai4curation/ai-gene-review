  label: Arabidopsis thaliana
description: >-
  BSU1 (BRI1 SUPPRESSOR 1, At1g03445) is a plant-specific phosphoprotein phosphatase of the PPP family
  with an N-terminal Kelch-repeat domain and a C-terminal PP1-like catalytic domain; it is the founding
  member of a small family (BSU1, BSL1, BSL2, BSL3) with overlapping functions. In brassinosteroid signalling,
  BRI1-phosphorylated BSK1 binds BSU1, and the RLCK CDG1 phosphorylates BSU1 on Ser764, enhancing its
  activity. Activated BSU1 dephosphorylates the conserved phospho-tyrosine (pTyr200) in the activation
  loop of the GSK3-like kinase BIN2, inactivating BIN2 so that the BZR1 and BES1 transcription factors
  accumulate in their unphosphorylated, active form in the nucleus. BSU1 can also dephosphorylate BES1
  directly. It was identified as the dominant bsu1-1D suppressor of bri1, is preferentially expressed
  in elongating cells, and is found in nuclear and plasma-membrane-associated pools.
