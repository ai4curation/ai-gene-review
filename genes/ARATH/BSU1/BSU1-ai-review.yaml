- id: PMID:14977918
  title: >-
    Nuclear protein phosphatases with Kelch-repeat domains modulate the response to brassinosteroids in
    Arabidopsis.
  findings:
  - statement: >-
      BES1 is subject to antagonistic phosphorylation (by BIN2) and dephosphorylation (by BSU1) in the
      nucleus, i.e. BSU1 acts on BES1 as a phosphatase substrate.
    supporting_text: >-
      Our data indicate that BES1 is subject to antagonistic phosphorylation and dephosphorylation reactions
      in the nucleus
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:19734888
      review_notes: >-
        The in planta observation that BSU1 increases dephosphorylated BES1 stands, but Kim et al. 2009
        showed that BSU1 does not bind or effectively dephosphorylate BES1/BZR1 in vitro; instead BSU1
        dephosphorylates pTyr200 of BIN2 and thereby inhibits BIN2 kinase activity. The direct-substrate
        interpretation is therefore not used in this review.
      supported_by:
      - reference_id: PMID:19734888
        supporting_text: >-
          However, BSU1 does not interact with or effectively dephosphorylate BZR2/BES1 in vitro and the
          biochemical function of BSU1 remains unknown
      - reference_id: PMID:19734888
        supporting_text: >-
          These results indicate that BSU1 inhibits BIN2 kinase activity but does not dephosphorylate pre-phosphorylated
          BZR1 in vitro.
