    label: plasma membrane
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id004
  - *id005
  - *id003
- description: >-
    Mn2+-dependent serine/threonine protein phosphatase activity of the PP1-like catalytic domain (which
    also acts on phospho-Tyr); its in planta effect on BES1/BZR1 phosphorylation is mediated through BIN2
    inactivation rather than direct dephosphorylation of the transcription factors.
  molecular_function:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
