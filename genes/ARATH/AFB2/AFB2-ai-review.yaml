    functions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full native receptor study inspected; AFB2 localization is nuclear and cytoplasmic in
      examined root epidermal cells. This is positive localization evidence, not exclusion of vacuolar
      residence.
