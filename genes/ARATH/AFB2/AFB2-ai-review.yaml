suggested_questions:
- question: >-
    Does the substantial cytoplasmic pool of AFB2 (unlike nuclear TIR1) have a distinct function,
    e.g. in rapid non-transcriptional auxin responses, or is it a reservoir?
- question: >-
    Which Aux/IAA partners are preferentially degraded by SCF(AFB2) versus SCF(TIR1) in vivo,
    given their different auxin-dependent affinities in yeast and in vitro assays?
suggested_experiments:
- description: >-
    Compare Aux/IAA degradation kinetics (e.g. ratiometric degron reporters for IAA12/BDL,
    IAA17, IAA7) in tir1 versus afb2 backgrounds to resolve receptor-specific substrate preferences
    in planta.
  hypothesis: >-
    AFB2 and TIR1 differ in substrate preference and auxin sensitivity, contributing to tissue-specific
    auxin responses.
- description: >-
    Express nucleus-restricted versus cytoplasm-restricted AFB2 in tir1 afb2 mutants and score
    complementation of root growth and rapid root growth inhibition.
  hypothesis: Cytoplasmic AFB2 contributes to fast, non-transcriptional auxin responses.
