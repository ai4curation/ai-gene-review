id: Q9LW29
gene_symbol: AFB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  AFB2 (AUXIN SIGNALING F-BOX 2; At3g26810) is a leucine-rich-repeat F-box protein of the
  TIR1/AFB auxin receptor family. As the substrate-recognition subunit of an SCF(ASK-cullin-F-box)
  E3 ubiquitin ligase, it binds auxin in a pocket of its LRR domain and, with auxin acting
  as molecular glue, captures the degron (domain II) of Aux/IAA transcriptional repressors,
  forming a TIR1/AFB-Aux/IAA co-receptor. This targets Aux/IAAs for ubiquitination and proteasomal
  degradation, releasing AUXIN RESPONSE FACTOR transcription factors to activate auxin-responsive
  genes. AFB2 belongs to the AFB2/AFB3 clade and acts redundantly with TIR1 and AFB3; together
  with TIR1 it is one of the dominant auxin receptors in the seedling root, and quadruple
  tir1 afb1 afb2 afb3 loss causes auxin insensitivity and embryonic patterning defects resembling
  monopteros/bodenlos. AFB2 is found in the nucleus and the cytoplasm, and its transcript
  is targeted by miR393.
existing_annotations:
- term:
    id: GO:0000325
    label: plant-type vacuole
  evidence_type: HDA
  original_reference_id: PMID:17151019
  qualifier: located_in
  review:
    summary: >-
      Detected in a proteomic inventory of vacuoles isolated from Arabidopsis cell culture.
      AFB2 is an F-box auxin receptor that acts with SCF and Aux/IAA substrates in the nucleus
      and, to a lesser extent, the cytoplasm; there is no functional evidence for a vacuolar
      role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      High-throughput organelle proteomics of isolated vacuoles readily captures cytosolic/nuclear
      contaminants. The localization reported by targeted imaging is nuclear plus cytoplasmic
      (Prigge et al. 2020), and no vacuolar function for AFB2 has been described. The annotation
      is retained as a reported detection but should not be used to describe AFB2 function.
    supported_by:
    - &id001
      reference_id: PMID:32067636
      supporting_text: >-
        We find that AFB2 through AFB5 are distributed between the nucleus and the cytoplasm,
        at least in epidermal cells of the root
- term:
    id: GO:0000822
    label: inositol hexakisphosphate binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q570C0
  review:
    summary: >-
      Inositol hexakisphosphate binding transferred from TIR1, whose crystal structure revealed
      an InsP6 cofactor buried in the LRR domain beneath the auxin-binding pocket. AFB2 is
      a close TIR1 paralog (TIR1/AFB1 and AFB2/AFB3 clades) and the InsP6-coordinating basic
      residues are characteristic of the family.
    action: KEEP_AS_NON_CORE
    reason: >-
      Reasonable structural inference from the TIR1 structure; InsP6 is a structural cofactor
      of the receptor fold rather than the signalling activity itself, so it is retained as
      non-core. No AFB2-specific structure has been reported.
    supported_by:
    - reference_id: PMID:17410169
      supporting_text: >-
        These structures show that the leucine-rich repeat domain of TIR1 contains an unexpected
        inositol hexakisphosphate co-factor
