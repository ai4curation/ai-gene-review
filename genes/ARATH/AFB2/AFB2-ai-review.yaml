id: Q9LW29
gene_symbol: AFB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: AFB2 (AUXIN SIGNALING F-BOX 2; At3g26810) is a leucine-rich-repeat F-box protein of the TIR1/AFB
  auxin receptor family. As the substrate-recognition subunit of an SCF(ASK-cullin-F-box) E3 ubiquitin
  ligase, it binds auxin in a pocket of its LRR domain and, with auxin acting as molecular glue, captures
  the degron (domain II) of Aux/IAA transcriptional repressors, forming a TIR1/AFB-Aux/IAA co-receptor.
  This targets Aux/IAAs for ubiquitination and proteasomal degradation, releasing AUXIN RESPONSE FACTOR
  transcription factors to activate auxin-responsive genes. AFB2 belongs to the AFB2/AFB3 clade and acts
  redundantly with TIR1 and AFB3; together with TIR1 it is one of the dominant auxin receptors in the
  seedling root, and quadruple tir1 afb1 afb2 afb3 loss causes auxin insensitivity and embryonic patterning
  defects resembling monopteros/bodenlos. AFB2 is found in the nucleus and the cytoplasm, and its transcript
  is targeted by miR393. The InsP6 cofactor-binding assignment is inferred from the conserved TIR1 receptor
  fold; direct adenylate cyclase activity has not been established for AFB2 by the available receptor
  assays.
