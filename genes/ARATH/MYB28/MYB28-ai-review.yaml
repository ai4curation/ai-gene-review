id: Q9SPG2
gene_symbol: MYB28
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: MYB28 (HAG1/PMG1, At5g61420) is a nuclear R2R3-MYB transcription factor of Arabidopsis thaliana
  that is the dominant positive regulator of methionine-derived (aliphatic) glucosinolate biosynthesis.
  Through its two N-terminal Myb DNA-binding repeats it binds promoters of aliphatic glucosinolate genes
  (side-chain elongation, core-structure and side-chain modification enzymes) and transactivates them,
  acting together with the paralogs MYB29 and MYB76 and with the jasmonate-responsive bHLH factors MYC2,
  MYC3 and MYC4. MYB28 is required for basal and especially long-chain aliphatic glucosinolate production
  and is sufficient to drive glucosinolate synthesis when overexpressed; MYB28/MYB29 double mutants lack
  aliphatic glucosinolates entirely. Its expression in leaves, inflorescences and trichomes responds to
  wounding, glucose, sulfur status, hormones and herbivory, and via its glucosinolate output it contributes
  to resistance against generalist insects, necrotrophic fungi and bacteria.
