core_functions:
- description: Nuclear R2R3-MYB DNA-binding transcription activator that binds promoters of aliphatic
    (methionine-derived) glucosinolate biosynthetic genes and activates their transcription, acting as
    the dominant regulator of basal and long-chain aliphatic glucosinolate production together with MYB29,
    MYB76 and MYC2/3/4.
  molecular_function:
    id: GO:0001216
    label: DNA-binding transcription activator activity
  directly_involved_in:
  - id: GO:0010439
    label: regulation of glucosinolate biosynthetic process
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id002
  - *id004
  - *id001
  - reference_id: PMID:18446225
    supporting_text: in the absence of both, the synthesis of all aliphatic glucosinolates is blocked
  - reference_id: PMID:23792303
    supporting_text: transgenic MYB28 expression activated AGSL biosynthetic genes and restored accumulation
      of AGSLs with short side chains
suggested_questions:
- question: Does MYB28 expression go up or down under sulfur deficiency? PMID:17420480 reports down-regulation
    and PMID:23792303 induction; does this depend on tissue, duration or sulfur regime?
- question: Is MYB28 binding to the secondary cell wall and nitrogen-network promoters found by Y1H (PMID:25533953,
    PMID:30356219) functional in planta?
suggested_experiments:
- description: ChIP-seq or DAP-seq of MYB28 in leaves (with and without MYC2/3/4) to define direct aliphatic
    glucosinolate target promoters and the MYB28 cis-element, and test whether repression of indolic glucosinolate
    genes is direct.
