suggested_questions:
- question: >-
    How does Arabidopsis PMK reach the peroxisome when it has no PTS1 and its proposed PTS2-like
    motif (residues 57-65) does not match the PTS2 consensus? Is import PEX7-dependent, or does
    PMK enter with a PTS-bearing partner?
- question: >-
    PAINT node PTN000781523 places peroxisome at eukaryote level from the Arabidopsis PMK
    annotation alone; should the IBD move to a plant node so that fungal ERG8 proteins, which are
    cytosolic, stop inheriting it?
suggested_experiments:
- hypothesis: >-
    Endogenous Arabidopsis PMK is a peroxisomal matrix protein, and its import depends on the
    57-65 segment and on PEX7.
  description: >-
    Express PMK-YFP from its native promoter in Arabidopsis (or tag the endogenous gene), image
    with a peroxisomal marker in wild type, pex7 and pex5 mutants, and test deletion or
    substitution of residues 57-65; confirm with protease protection of isolated peroxisomes
    and immunoblots of purified peroxisome fractions alongside cytosolic markers.
  experiment_type: localisation and import genetics
knowledge_gaps:
- gap_statement: >-
    The import signal and pathway that deliver PMK (and MVD) to plant peroxisomes are unknown,
    and the localisation of the endogenous Arabidopsis protein has not been tested.
  boundary: >-
    YFP fusions of the Arabidopsis protein and of the periwinkle ortholog are peroxisomal in
    plant cells, and the periwinkle ortholog stays exclusively peroxisomal when new synthesis is
    blocked. The protein has no PTS1, and the segment proposed as a PTS2 is not a consensus PTS2.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Whether the second and third steps of IPP synthesis happen in the peroxisome or the cytosol
    decides how mevalonate 5-phosphate and IPP move between compartments and where the pathway
    can be engineered or regulated.
  resolution: >-
    Native-promoter fusions or endogenous tagging with peroxisome markers, import-mutant
    (pex7, pex5) backgrounds, motif mutagenesis and protease-protection assays.
  provenance:
  - reference_id: file:ARATH/PMK/PMK-bioinformatics/RESULTS.md
    supporting_text: The sequence analysis neither confirms nor refutes peroxisomal import.
  - reference_id: PMID:21655959
    supporting_text: These compartmentalisation results were confirmed using the Arabidopsis
      thaliana MVK, PMK and MVD sequences fused to YFP.
