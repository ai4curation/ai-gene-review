- At1g31910
- AtPMK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PMK (At1g31910) encodes the phosphomevalonate kinase of Arabidopsis thaliana, a 505-residue
  GHMP-superfamily kinase of the fungal and plant (ERG8) type, unrelated in fold to the animal
  phosphomevalonate kinase. It phosphorylates (R)-mevalonate 5-phosphate with ATP to give
  (R)-mevalonate 5-diphosphate, the second of the three ATP-dependent steps that convert
  mevalonate to isopentenyl diphosphate in the mevalonate pathway, which supplies sterols,
  brassinosteroids, triterpenes, sesquiterpenes, dolichols and protein prenyl groups. The
  recombinant enzyme has a Km of about 12 uM for mevalonate 5-phosphate and, together with
  Arabidopsis diphosphomevalonate decarboxylase, converts mevalonate 5-phosphate to isoprenoid
  product in a reconstituted pathway. A YFP fusion of the Arabidopsis protein localises to
  peroxisomes, as do the periwinkle ortholog and the downstream decarboxylase, whereas the
  upstream mevalonate kinase is cytosolic; this places the last steps of isopentenyl diphosphate
  synthesis in plant peroxisomes. The protein has no PTS1, and the PTS2-like motif proposed as
  its targeting signal does not match the PTS2 consensus, so how it is imported is not known.
  Work in tobacco suggests that the PMK step limits flux through the plant mevalonate pathway. A
  second splice form lacks the C-terminal part of the GHMP C-terminal domain. No pmk mutant has
  been described.
