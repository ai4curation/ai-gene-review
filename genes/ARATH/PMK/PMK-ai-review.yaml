- id: PMID:21655959
  title: Peroxisomal localisation of the final steps of the mevalonic acid pathway in planta.
  findings:
  - statement: YFP fusions of periwinkle and Arabidopsis PMK and MVD are peroxisomal in C. roseus
      cells; MVK fusions are cytosolic.
    supporting_text: These compartmentalisation results were confirmed using the Arabidopsis
      thaliana MVK, PMK and MVD sequences fused to YFP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only (Planta 234:903). The only localisation of the Arabidopsis protein. Transient
      overexpression in a heterologous plant cell; the peroxisome marker and Arabidopsis images
      could not be checked. The UniProt PTS2 motif (57-65) is a curator inference from this paper
      and does not match the PTS2 consensus.
