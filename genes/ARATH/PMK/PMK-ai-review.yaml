      (R/K)(L/V/I/Q)X5(H/Q)(L/A/F) consensus that the annotated motifs do not match.
- id: PMID:22459325
  title: 'Cycloheximide as a tool to investigate protein import in peroxisomes: a case study of the
    subcellular localization of isoprenoid biosynthetic enzymes.'
  findings:
  - statement: With cycloheximide to clear newly made cytosolic fusion protein, periwinkle PMK and
      MVD fusions are exclusively peroxisomal.
    supporting_text: allowing us to clearly demonstrate that 5-phosphomevalonate kinase, mevalonate
      5-diphosphate decarboxylase and a short isoform of farnesyl diphosphate synthase from
      Catharanthus roseus are exclusively localized to peroxisomes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Ortholog (Catharanthus roseus) evidence; addresses the cytosolic background
