taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SMAX1-LIKE6 (SMXL6; D53-like 2) is a nuclear Clp-ATPase-related (double Clp-N / P-loop NTPase
  domain) protein that, together with its close paralogs SMXL7 and SMXL8, acts as the transcriptional
  co-repressor targeted by strigolactone (SL) signalling. In the absence of SL SMXL6 represses target
  genes, including BRANCHED1 (BRC1), by recruiting TOPLESS-related co-repressors (TPR2) through a C-terminal
  EAR motif, and promotes PIN1 accumulation and auxin transport in the stem, thereby allowing axillary
  bud outgrowth. SL perceived by D14 triggers SMXL6 association with D14 and SCF(MAX2), rapid polyubiquitination
  and proteasomal degradation (an RGKT-region deletion stabilises the protein). SMXL6 can also bind DNA
  directly, repressing the SMXL6/7/8 promoters as an autoregulated transcription factor, and the SMXL6/7/8
  group negatively affects drought tolerance and promotes rounder leaves. SMXL6 acts redundantly with
  SMXL7 and SMXL8; single mutants have little phenotype.
