  review:
    summary: SMXL6 interacts with the SL receptor D14 in a GR24-enhanced manner (Y2H/co-IP).
    action: REMOVE
    reason: The interaction is real and central to SL signalling (SMXLs are the receptor's targets), but
      protein binding conveys no functional information about SMXL6 itself; its activity is represented
      by transcription corepressor activity. Removal does not imply the interaction is false.
