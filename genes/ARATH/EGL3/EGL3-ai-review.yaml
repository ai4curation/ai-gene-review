id: Q9CAD0
gene_symbol: EGL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ENHANCER OF GLABRA3 (EGL3; AtbHLH2; UniProt name EGL1) is a nuclear subgroup IIIf bHLH transcription
  factor of Arabidopsis that acts, partially redundantly with its paralog GLABRA3 (GL3), as the bHLH component
  of MYB-bHLH-WD40 (MBW) transcriptional complexes. EGL3 binds the WD40 protein TTG1, R2R3-MYB activators
  (GL1 in the shoot epidermis, WEREWOLF in the root epidermis, PAP1/PAP2 in anthocyanin regulation) and
  forms heterodimers with GL3. In leaf epidermis the GL1-GL3/EGL3-TTG1 complex specifies trichome fate;
  in the root epidermis WER-GL3/EGL3-TTG1 specifies non-hair cell fate by activating GLABRA2. The single-repeat
  R3 MYB inhibitors CPC and TRY bind EGL3 and compete with the R2R3-MYB activators, which underlies lateral
  inhibition in epidermal patterning. gl3 egl3 double mutants are glabrous and have ttg1-like defects
  in anthocyanin, seed coat mucilage and root hair patterning. EGL3 activity is modulated by JAZ and DELLA
  repressors (jasmonate and gibberellin control of trichome initiation) and by BIN2 phosphorylation in
  the root.
