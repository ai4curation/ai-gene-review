- id: file:ARATH/EGL3/EGL3-deep-research-falcon.md
  title: Falcon deep research for Arabidopsis EGL3
  findings: []
core_functions:
- description: bHLH DNA-binding transcription factor partner (redundant with GL3) in MYB-bHLH-WD40 complexes;
    with GL1 and TTG1 it specifies leaf trichome fate, and with WER and TTG1 it specifies root non-hair
    fate. R3 MYB inhibitors (CPC, TRY) bind EGL3 and compete with the R2R3-MYB activators.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
  - id: GO:0010026
    label: trichome differentiation
  - id: GO:0090628
    label: plant epidermal cell fate specification
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12917293
    supporting_text: Yeast two-hybrid and plant overexpression studies show that EGL3, like GL3, interacts
      with TTG1, the myb proteins GL1, PAP1 and 2, CPC and TRY, and it will form heterodimers with GL3.
  - reference_id: PMID:12917293
    supporting_text: When mutated, egl3 gives totally glabrous plants only in the gl3 mutant background.
  - reference_id: PMID:14627722
    supporting_text: Plants homozygous for mutations in both genes fail to specify the non-hair cell type,
      whereas plants overexpressing either gene produce ectopic non-hair cells.
  - reference_id: PMID:18766177
    supporting_text: These inhibitors can compete with the R2R3 MYB factor for binding to GL3/EGL3 in
      yeast three-hybrid assays
  - reference_id: PMID:17885086
    supporting_text: we show that EGL3 shares some direct targets with GL3
suggested_questions:
- question: Does EGL3 bind DNA directly at MBW target promoters (GL2, CPC, TRY) in leaf primordia, or
    is its promoter association entirely dependent on the R2R3-MYB partner, as reported for GL3 at some
    targets?
- question: How much of EGL3's in vivo trichome contribution reflects intercellular movement or nucleo-cytoplasmic
    redistribution (as reported for BIN2-phosphorylated EGL3 in the root)?
suggested_experiments:
- description: ChIP-seq or CUT&RUN of tagged EGL3 in gl3 and gl3 gl1 backgrounds in young leaf primordia
    to test GL1-dependent versus GL1-independent promoter occupancy.
  experiment_type: Chromatin occupancy profiling
  hypothesis: EGL3 occupancy at GL2/CPC/ETC1 promoters requires GL1, whereas TRY promoter occupancy does
    not.
