id: Q9S814
gene_symbol: EIN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  EIN2 is a central signal transducer in Arabidopsis ethylene responses. Its NRAMP-like N-terminal
  membrane domain anchors full-length EIN2 to the endoplasmic reticulum, while its large cytosolic
  C-terminal domain is controlled by the CTR1 kinase. Ethylene relieves CTR1-mediated inhibition,
  permitting C-terminal processing and signaling in the nucleus and cytoplasmic P-bodies. EIN2
  promotes translational repression of EBF1/EBF2 mRNAs and EIN3/EIL1 accumulation, and associates
  with ENAP1 and chromatin to promote histone acetylation and ethylene-responsive transcription.
  These activities connect ethylene perception to development and stress responses; the transport
  or sensing function of the NRAMP-like domain remains unresolved.
