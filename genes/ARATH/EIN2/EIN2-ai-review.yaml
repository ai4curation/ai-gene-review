- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: TAS
  original_reference_id: PMID:23132950
  review:
    summary: >-
      Full-length EIN2 couples ethylene receptor/CTR1 regulation at the ER
      membrane to downstream nuclear and cytoplasmic signaling through its
      processed C-terminal domain.
    action: NEW
    reason: >-
      CTR1 binds and phosphorylates EIN2 (PMID:23132950), while activated EIN2 associates with
      EBF1/2 3' UTRs and P-body proteins EIN5/PABs (PMID:26496607), and with ENAP1 in nuclear
      signaling (PMID:27694846). Together these support the non-catalytic coordination of signaling
      partners required by the QuickGO definition of signaling adaptor activity.
    supported_by:
    - reference_id: PMID:23132950
      supporting_text: Here we demonstrate that CTR1 interacts with and directly
        phosphorylates the cytosolic C-terminal domain of EIN2. Mutations that block the
        EIN2 phosphorylation sites result in constitutive nuclear localization of the EIN2
        C terminus, concomitant with constitutive activation of ethylene responses in
        Arabidopsis.
      reference_section_type: ABSTRACT
    - reference_id: PMID:26496607
      supporting_text: Furthermore, we demonstrate that ethylene induces EIN2 to associate
        with 3' UTRs and target EBF1/2 mRNA to cytoplasmic processing-body (P-body)
        through interacting with multiple P-body factors, including EIN5 and PABs.
      reference_section_type: ABSTRACT
    - reference_id: PMID:27694846
      supporting_text: Both EIN2 and EIN3 interact with a SANT domain protein named EIN2
        nuclear associated protein 1 (ENAP1), overexpression of which results in elevation
        of histone acetylation and enhanced ethylene-inducible gene expression in an
        EIN2-dependent manner.
      reference_section_type: ABSTRACT
