      phosphorylates the cytosolic C-terminal domain of EIN2. Mutations that block the
      EIN2 phosphorylation sites result in constitutive nuclear localization of the EIN2 C
      terminus, concomitant with constitutive activation of ethylene responses in
      Arabidopsis.
    reference_section_type: ABSTRACT
