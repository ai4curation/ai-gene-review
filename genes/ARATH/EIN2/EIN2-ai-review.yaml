  findings: []
- id: PMID:10381874
  title: EIN2, a bifunctional transducer of ethylene and stress responses in Arabidopsis.
  findings:
  - statement: EIN2 CEND activates ethylene responses and restores jasmonate and
      oxidative-stress responsiveness.
    supporting_text: Expression of the EIN2 CEND is sufficient to constitutively activate
      ethylene responses and restores responsiveness to jasmonic acid and paraquat-induced
      oxygen radicals to mutant plants.
    reference_section_type: ABSTRACT
- id: PMID:10899978
  title: Regulation of abscisic acid signaling by the ethylene response pathway in
    Arabidopsis.
  findings:
  - statement: Ethylene signaling can promote ABA effects on root growth despite
      antagonism during germination.
    supporting_text: In contrast, the ethylene response pathway positively regulates some
      aspects of ABA action that involve root growth in the absence of ethylene.
    reference_section_type: ABSTRACT
- id: PMID:11418339
  title: Genes controlling expression of defense responses in Arabidopsis--2001 status.
  findings: []
- id: PMID:12663220
  title: Sugar and hormone connections.
  findings: []
- id: PMID:15923322
  title: Heat stress phenotypes of Arabidopsis mutants implicate multiple signaling
    pathways in the acquisition of thermotolerance.
  findings:
  - statement: ein2 and etr1 mutants have basal thermotolerance defects.
    supporting_text: Ethylene signaling mutants (ein2 and etr1) and reactive oxygen
      metabolism mutants (vtc1, vtc2, npq1, and cad2) were more defective in basal than
      acquired thermotolerance, especially under high light.
    reference_section_type: ABSTRACT
- id: PMID:16732289
  title: Conserved requirement for a plant host cell protein in powdery mildew
    pathogenesis.
  findings: []
- id: PMID:16961732
  title: Ethylene-induced stomatal closure in Arabidopsis occurs via AtrbohF-mediated
    hydrogen peroxide synthesis.
  findings:
  - statement: ein2-1 stomata fail to close after ethylene or hydrogen peroxide challenge.
    supporting_text: Stomata of the ethylene signalling ein2-1 and arr2 mutants do not
      close in response to either ethylene or H(2)O(2) but do generate H(2)O(2) following
      ethylene challenge.
    reference_section_type: ABSTRACT
- id: PMID:17084699
  title: Vectorial information for Arabidopsis planar polarity is mediated by combined
    AUX1, EIN2, and GNOM activity.
  findings:
  - statement: EIN2 contributes with AUX1 and GNOM to coordinate root hair positioning.
    supporting_text: Here, we report that combinatorial action of the auxin influx carrier
      AUX1, ETHYLENE-INSENSITIVE2 (EIN2) , and GNOM genes mediates the vector for
      coordinate hair positioning.
    reference_section_type: ABSTRACT
- id: PMID:17513501
  title: ABA is an essential signal for plant resistance to pathogens affecting JA
    biosynthesis and the activation of defenses in Arabidopsis.
  findings:
  - statement: >-
      The pathogen studied is the damping-off oomycete Pythium irregulare; this establishes
      the taxonomic scope of the defense annotation.
    supporting_text: Analyses of Arabidopsis thaliana defense response to the damping-off
      oomycete pathogen Pythium irregulare show that resistance to P. irregulare requires
      a multicomponent defense strategy.
    reference_section_type: ABSTRACT
- id: PMID:17533512
  title: Arabidopsis EIN2 modulates stress response through abscisic acid response
    pathway.
  findings:
  - statement: An EIN2 null mutant is hypersensitive to osmotic and salt stress.
    supporting_text: An Arabidopsis EIN2 null mutant was supersensitive to both salt and
      osmotic stress conditions.
    reference_section_type: ABSTRACT
- id: PMID:19095898
  title: Glucosinolate metabolites required for an Arabidopsis innate immune response.
  findings: []
- id: PMID:19196655
  title: Interplay between ethylene, ETP1/ETP2 F-box proteins, and degradation of EIN2
    triggers ethylene responses in Arabidopsis.
  findings:
  - statement: >-
      EIN2-CEND physically interacts with ETP1 and ETP2, which mediate EIN2
      turnover in the absence of ethylene.
    supporting_text: We identified two F-box proteins, EIN2 TARGETING PROTEIN1 (ETP1) and
      EIN2 TARGETING PROTEIN2 (ETP2), that interact with the EIN2 C-terminal domain
      (EIN2-CEND), which is highly conserved and sufficient to activate most ethylene
      responses.
    reference_section_type: ABSTRACT
- id: PMID:19229035
  title: Trifurcate feed-forward regulation of age-dependent cell death involving miR164
    in Arabidopsis.
  findings:
  - statement: EIN2 regulates the ORE1/miR164 aging-induced leaf cell-death circuit.
    supporting_text: ORE1 expression is up-regulated concurrently with leaf aging by EIN2
      but is negatively regulated by miR164. miR164 expression gradually decreases with
      aging through negative regulation by EIN2, which leads to the elaborate
      up-regulation of ORE1 expression. However, EIN2 still contributes to aging-induced
      cell death in the absence of ORE1.
    reference_section_type: ABSTRACT
- id: PMID:19769567
  title: EIN2, the central regulator of ethylene signalling, is localized at the ER
    membrane where it interacts with the ethylene receptor ETR1.
  findings:
  - statement: EIN2 resides at the ER membrane and interacts specifically with ETR1.
    supporting_text: Here we show, by an integrated approach using in vivo and in vitro
      fluorescence techniques, that EIN2 is localized at the ER (endoplasmic reticulum)
      membrane where it shows specific interaction with the ethylene receptor protein
      ETR1.
    reference_section_type: ABSTRACT
- id: PMID:19889874
  title: Disruption of poly(ADP-ribosyl)ation mechanisms alters responses of Arabidopsis
    to biotic stress.
  findings: []
- id: PMID:20592040
  title: Ethylene signaling regulates accumulation of the FLS2 receptor and is required
    for the oxidative burst contributing to plant immunity.
  findings:
  - statement: ein2 has reduced FLS2 accumulation in the ethylene-dependent immune
      response.
    supporting_text: The oxidative burst was diminished in ethylene-insensitive mutants.
      Flagellin Sensitive2 (FLS2) accumulation was reduced in etr1 and ein2, indicating a
      requirement of ethylene signaling for FLS2 expression.
    reference_section_type: ABSTRACT
- id: PMID:21631530
  title: EIN2 regulates salt stress response and interacts with a MA3 domain-containing
    protein ECIP1 in Arabidopsis.
  findings:
  - statement: EIN2 C-terminal expression suppresses the salt-sensitive ein2 phenotype.
    supporting_text: Mutation of EIN2 led to extreme salt sensitivity as revealed by
      phenotypic and physiological changes, and overexpression of C-terminus of EIN2
      suppressed salt sensitivity in ein2-5, indicating that EIN2 is required for salt
      tolerance.
    reference_section_type: ABSTRACT
- id: PMID:22936567
  title: Processing and subcellular trafficking of ER-tethered EIN2 control response to
    ethylene gas.
  findings:
  - statement: Ethylene triggers EIN2 dephosphorylation, cleavage and nuclear
      translocation.
    supporting_text: Ethylene triggers dephosphorylation at several sites and proteolytic
      cleavage at one of these sites, resulting in nuclear translocation of a
      carboxyl-terminal EIN2 fragment (EIN2-C').
    reference_section_type: ABSTRACT
- id: PMID:23070300
  title: Activation of ethylene signaling is mediated by nuclear translocation of the
    cleaved EIN2 carboxyl terminus.
  findings:
  - statement: Ethylene promotes trafficking of EIN2 from the ER membrane to the nucleus.
    supporting_text: Taken together, these results indicate that ethylene treatment
      facilitates the translocation of EIN2-GFP from ER membrane into the nucleus.
    reference_section_type: RESULTS
- id: PMID:23132950
  title: CTR1 phosphorylates the central regulator EIN2 to control ethylene hormone
    signaling from the ER membrane to the nucleus in Arabidopsis.
  findings:
  - statement: CTR1 directly phosphorylates EIN2 and phosphosite mutations activate
      nuclear signaling.
    supporting_text: Here we demonstrate that CTR1 interacts with and directly
      phosphorylates the cytosolic C-terminal domain of EIN2. Mutations that block the
      EIN2 phosphorylation sites result in constitutive nuclear localization of the EIN2 C
      terminus, concomitant with constitutive activation of ethylene responses in
      Arabidopsis.
    reference_section_type: ABSTRACT
- id: PMID:23166504
  title: Plant vascular cell division is maintained by an interaction between PXY and
    ethylene signalling.
  findings:
  - statement: EIN2-dependent ethylene signaling supports vascular cell division in pxy
      mutants.
    supporting_text: Furthermore, blocking ethylene signalling using a variety of ethylene
      insensitive mutants such as ein2 enhances the cell division defect of pxy.
    reference_section_type: ABSTRACT
- id: PMID:25822663
  title: Unsaturation of very-long-chain ceramides protects plant from hypoxia-induced
    damages by modulating ethylene signaling in Arabidopsis.
  findings:
  - statement: Ceramide inhibition of CTR1 is associated with ER-to-nucleus EIN2
      trafficking.
    supporting_text: Evidence that C24:1-ceramide interacted with recombinant CTR1 protein
      and inhibited its kinase activity in vitro, enhanced ER-to-nucleus translocation of
      EIN2-GFP and stabilization of EIN3-GFP in vivo, suggests a role of ceramides in
      modulating CTR1-mediated ethylene signaling.
    reference_section_type: ABSTRACT
- id: PMID:25843012
  title: Targeting Plant Ethylene Responses by Controlling Essential Protein-Protein
    Interactions in the Ethylene Pathway.
  findings:
  - statement: EIN2 is an ER-localized membrane component of ethylene signaling.
    supporting_text: A central element in ethylene signaling is the endoplasmic reticulum
      (ER)-localized membrane protein ethylene insensitive2 (EIN2).
    reference_section_type: ABSTRACT
- id: PMID:26496607
  title: EIN2-directed translational regulation of ethylene signaling in Arabidopsis.
  findings:
  - statement: EIN2 associates with EBF1/2 3' UTRs and P-body factors during translational
      repression.
    supporting_text: Furthermore, we demonstrate that ethylene induces EIN2 to associate
      with 3' UTRs and target EBF1/2 mRNA to cytoplasmic processing-body (P-body) through
      interacting with multiple P-body factors, including EIN5 and PABs.
    reference_section_type: ABSTRACT
- id: PMID:26496608
  title: Gene-specific translation regulation mediated by the hormone-signaling molecule
    EIN2.
  findings:
  - statement: EIN2 and UPF proteins mediate ethylene-dependent EBF2 translational
      control.
    supporting_text: Characterization of one of the targets of this translation regulatory
      machinery, the ethylene signaling component EBF2, indicates that the signaling
      molecule EIN2 and the nonsense-mediated decay proteins UPFs play a central role in
      this ethylene-induced translational response.
    reference_section_type: ABSTRACT
- id: PMID:26507893
  title: Mitogen-activated protein kinase 6 mediates nuclear translocation of ORE3 to
    promote ORE9 gene expression in methyl jasmonate-induced leaf senescence.
  findings:
  - statement: Methyl jasmonate-induced senescence involves EIN2 CEND cleavage and nuclear
      movement.
    supporting_text: The C-terminal end of ORE3/EIN2 (CEND) was cleaved from ORE3/EIN2
      located in the endoplasmic reticulum and then transferred to the nucleus during
      MeJA-induced senescence.
    reference_section_type: ABSTRACT
- id: PMID:27694846
  title: EIN2-dependent regulation of acetylation of histone H3K14 and non-canonical
    histone H3K23 in ethylene signalling.
  findings:
  - statement: EIN2 interacts with ENAP1 in the histone acetylation response to ethylene.
    supporting_text: Both EIN2 and EIN3 interact with a SANT domain protein named EIN2
      nuclear associated protein 1 (ENAP1), overexpression of which results in elevation
      of histone acetylation and enhanced ethylene-inducible gene expression in an
      EIN2-dependent manner.
    reference_section_type: ABSTRACT
- id: PMID:27729395
  title: In Planta Determination of the mRNA-Binding Proteome of Arabidopsis Etiolated
    Seedlings.
  findings: []
- id: PMID:28874528
  title: EIN2 mediates direct regulation of histone acetylation in the ethylene response.
  findings:
  - statement: EIN2-C associates with histone-containing chromatin partly through ENAP1.
    supporting_text: Chromatin immunoprecipitation followed by deep sequencing (ChIP-seq)
      and ChIP-reChIP-seq analyses revealed that EIN2-C associates with histone partially
      through an interaction with EIN2 nuclear-associated protein1 (ENAP1), which
      preferentially binds to the genome regions that are associated with actively
      expressed genes both with and without ethylene treatments.
    reference_section_type: ABSTRACT
- id: PMID:30630869
  title: Extracellular ATP Shapes a Defense-Related Transcriptome Both Independently and
    along with Other Defense Signaling Pathways.
  findings:
  - statement: EIN2-dependent ethylene signaling contributes to the ATP-responsive defense
      transcriptome.
    supporting_text: In conclusion, we present a model ( Fig. 10 ) in which ATP binding to
      P2K1 results in defense gene activation, where more than half of ATP-responsive
      genes required signaling by one or more of the pathways through EIN2, NPR1, and
      COI1, but with a more substantial reliance on COI1.
    reference_section_type: DISCUSSION
- id: PMID:32344669
  title: Discovering the RNA-Binding Proteome of Plant Leaves with an Improved RNA
    Interactome Capture Method.
  findings: []
- id: PMID:9032965
  title: Genetic analysis of the effects of polar auxin transport inhibitors on root
    growth in Arabidopsis thaliana.
  findings: []
- id: PMID:33573082
  title: Comparative Study of Several Fe Deficiency Responses in the Arabidopsis thaliana
    Ethylene Insensitive Mutants ein2-1 and ein2-5.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier and title verified through Europe PMC DOI lookup; PubMed/PMC
      cache fetched with repository tooling. Read primary experiments and conclusions.
      Supports EIN2-dependent iron-deficiency signaling, not direct metal transport or
      validation of an ancestral IBD placement.
  findings:
  - statement: EIN2 contributes to ethylene/nitric-oxide regulation of iron-acquisition
      genes; ein2 mutants retain iron-deficiency induction, showing partial and
      context-dependent involvement.
    supporting_text: The results obtained clearly support the participation of ET and NO,
      through EIN2, in the regulation of the Fe acquisition genes FRO2 and IRT1.
    reference_section_type: CONCLUSIONS
core_functions:
- description: >-
    ER membrane EIN2 acts as the central ethylene signaling adaptor downstream
    of ethylene receptors and CTR1. Ethylene relieves CTR1 phosphorylation,
    enabling EIN2 C-terminal processing and movement of the C-terminal signaling
    domain to downstream nuclear and cytoplasmic signaling sites.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
