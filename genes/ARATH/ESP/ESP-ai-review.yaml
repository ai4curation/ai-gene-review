- id: PMID:30900313
  title: 'Structural diversification during glucosinolate breakdown: mechanisms of thiocyanate,
    epithionitrile and simple nitrile formation.'
  findings:
  - statement: >-
      Specifier proteins are proposed to be Fe(2+)-dependent lyases (catalysts). AtESP
      and TaTFP are homodimers, and ESPs evolved from NSPs.
    supporting_text: Based on these insights, we propose that specifier proteins are
      catalysts that might be classified as Fe2+ -dependent lyases.
    reference_section_type: ABSTRACT
  - statement: >-
      ESPs make epithionitriles from terminally unsaturated glucosinolates and simple
      nitriles from others.
    supporting_text: ESPs have acquired the ability to produce epithionitriles upon
      hydrolysis of glucosinolates with a terminally unsaturated side chain, but also
      possess NSP activity on glucosinolates without a terminal double bond
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available. Basis for the lyase reclassification.
- id: PMID:30395611
  title: Iron is a centrally bound cofactor of specifier proteins involved in glucosinolate
    breakdown.
  findings:
  - statement: >-
      Purified AtESP contains iron. Its iron-binding residues E260/D264 are required
      for full activity.
    supporting_text: Substitution of the corresponding iron binding residues of AtESP,
      E260 and D264, by Gln and Asn, respectively, resulted in strongly diminished
      activity
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available. Supports the NEW iron ion binding annotation and the lyase
      interpretation.
- id: PMID:27990154
  title: NSP-Dependent Simple Nitrile Formation Dominates upon Breakdown of Major Aliphatic
    Glucosinolates in Roots, Seeds, and Seedlings of Arabidopsis thaliana Columbia-0.
  findings:
  - statement: >-
      Col-0 is a natural ESP knockout in leaves; ESP activity is undetectable in
      Col-0 leaf extracts.
    supporting_text: Due to an insertion upstream of the ESP coding sequence, Col-0 is
      a natural knockout of ESP and ESP activity is not detectable in leaf extracts
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available. Provides accession context for interpreting
      Col-0 esp phenotypes.
- id: PMID:17390109
  title: Cell- and tissue-specific localization and regulation of the epithiospecifier
    protein in Arabidopsis thaliana.
  findings:
  - statement: >-
      In Ler, ESP is found in epidermal cells of aerial organs (except anthers) and
      in S-cells. It is regulated transcriptionally and post-transcriptionally.
    supporting_text: In the ecotype Landsberg erecta, ESP was found to be consistently
      present in the epidermal cells of all aerial parts except the anthers and in
      S-cells of the stem below the inflorescence.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in cache.
- id: PMID:15845404
  title: Characterisation of recombinant epithiospecifier protein and its over-expression
    in Arabidopsis thaliana.
  findings:
  - statement: >-
      Ectopic ESP expression in Col-5 shifts glucosinolate breakdown from
      isothiocyanates toward nitriles.
    supporting_text: Ectopic expression of ESP in Arabidopsis thaliana Col-5 under
      control of the strong viral CaMV 35S promoter altered the glucosinolate product
      profile from isothiocyanates towards the corresponding nitriles.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in cache.
- id: PMID:19224919
  title: Nitrile-specifier proteins involved in glucosinolate hydrolysis in Arabidopsis
    thaliana.
  findings:
  - statement: >-
      Among Arabidopsis specifier proteins, only ESP generates epithionitriles; ESP
      and NSPs both redirect myrosinase breakdown to nitriles.
    supporting_text: Although AtESP and AtNSP proteins can switch myrosinase-catalyzed
      degradation of 2-propenylglucosinolate from isothiocyanate to nitrile, only
      AtESP generates the corresponding epithionitrile.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available.
suggested_questions:
- question: >-
    How can the WRKY53-dependent senescence and pathogen phenotypes reported for ESR/ESP
    knockouts in Col-0 be reconciled with Col-0 being a natural leaf ESP knockout
    with no detectable ESP activity? Are these phenotypes independent of specifier
    activity?
- question: >-
    Does ESP physically associate with myrosinase (TGG1/TGG2) in vivo to capture the
    short-lived aglucone, or does it act on freely diffusing aglucone released after
    tissue disruption?
- question: >-
    What is the net ecological effect of ESP-mediated epithionitrile/nitrile formation,
    given that it increases feeding by the generalist T. ni but may reduce
    attraction of glucosinolate-specialist herbivores?
suggested_experiments:
- description: >-
    Compare Ler and Col-0 backgrounds carrying esp null alleles and catalytically dead
    ESP variants (iron-triad E260Q/D264N) for leaf senescence, WRKY53 target
    expression and P. syringae growth. This separates specifier-activity-dependent
    from WRKY53-interaction-dependent phenotypes.
- description: >-
    Run no-choice and choice bioassays with generalist (T. ni) and specialist
    (Pieris rapae, Plutella xylostella) herbivores on near-isogenic ESP-functional vs
    esp lines to test the specialist-crypsis hypothesis for ESP.
