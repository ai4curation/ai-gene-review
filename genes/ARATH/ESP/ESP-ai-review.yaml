- term:
    id: GO:0030234
    label: enzyme regulator activity
  evidence_type: IDA
  original_reference_id: PMID:11752388
  qualifier: enables
  review:
    summary: >-
      Based on the 2001 biochemical characterization, in which ESP required
      myrosinase for activity. The authors discussed whether ESP acts as an
      independent enzyme on the aglucone or as a proteinaceous cofactor of
      myrosinase.
    action: MODIFY
    reason: >-
      The experiment is sound, but the interpretation is superseded. Later
      structural, iron-quantification and mutagenesis work showed that ESP has its
      own iron-containing active site that converts the myrosinase-released
      aglucone. Mutating the AtESP iron-binding residues strongly reduces activity.
      The activity is therefore a lyase activity on the aglucone (EC 4.8.1.6 /
      4.8.1.5), best captured by carbon-sulfur lyase activity, and not regulation of
      myrosinase.
    proposed_replacement_terms:
    - id: GO:0016846
      label: carbon-sulfur lyase activity
    supported_by:
    - reference_id: PMID:11752388
      supporting_text: Because myrosinase is required for activity, ESP may simply
        use the aglycone produced by myrosinase as a direct substrate for nitrile
        formation
    - reference_id: PMID:30395611
      supporting_text: Substitution of the corresponding iron binding residues of
        AtESP, E260 and D264, by Gln and Asn, respectively, resulted in strongly
        diminished activity
    - reference_id: PMID:30900313
      supporting_text: Based on these insights, we propose that specifier proteins
        are catalysts that might be classified as Fe2+ -dependent lyases.
