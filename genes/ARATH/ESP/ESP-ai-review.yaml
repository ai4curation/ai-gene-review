proposed_new_terms:
- proposed_name: epithionitrile-forming sulfolyase activity
  proposed_definition: >-
    Catalysis of the reaction: a (Z)-N-(sulfonatooxy)alkenimidothioate (a
    glucosinolate aglucone with a terminally unsaturated side chain) = an
    epithionitrile + sulfate (EC 4.8.1.6; RHEA:69228). The thiol sulfur is
    transferred intramolecularly to the terminal double bond of the side chain.
  justification: >-
    Epithiospecifier proteins are characterized Fe(II)-dependent catalysts with a
    curated EC number and Rhea reaction. GO currently stops at the carbon-sulfur lyase
    parent (GO:0016846), so the specific epithionitrile-forming activity that defines
    ESP cannot be expressed. A sibling term for thiocyanate-forming activity was
    proposed in the Thlaspi TFP review.
  proposed_parent:
    id: GO:0016846
    label: carbon-sulfur lyase activity
