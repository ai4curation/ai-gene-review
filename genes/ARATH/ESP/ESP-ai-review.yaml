  review:
    summary: >-
      IPI with WRKY53 (Q9SUP6) from yeast two-hybrid, BiFC and EMSA work in
      Miao and Zentgraf 2007. The paper goes beyond binding: ESP (called ESR there)
      inhibits WRKY53 DNA binding in vitro and antagonises WRKY53 in leaf
      senescence.
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative. The cited paper supports a more
      specific molecular function, which is inhibition of a transcription factor
      (WRKY53) by direct binding. EMSA showed that increasing amounts of ESR protein
      block WRKY53 DNA binding. GO:0140416 transcription regulator inhibitor activity
      ("inhibits the activity of a transcription regulator via direct binding")
      captures this. It is a non-core, moonlighting-type function. It has not been
      independently replicated and is hard to reconcile with Col-0 being a natural
      leaf ESP knockout (PMID:27990154).
