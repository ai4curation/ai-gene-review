- id: PMID:11752388
  title: The Arabidopsis epithiospecifier protein promotes the hydrolysis of glucosinolates
    to nitriles and influences Trichoplusia ni herbivory.
  findings:
  - statement: >-
      ESP (At1g54040) underlies the major QTL for nitrile vs isothiocyanate
      formation. Recombinant ESP converts alkenyl glucosinolates to epithionitriles
      and non-alkenyl glucosinolates to simple nitriles, only in the presence of
      myrosinase.
    supporting_text: The heterologously expressed Arabidopsis ESP was able to convert
      glucosinolates both to epithionitriles and to simple nitriles in the presence of
      myrosinase
    reference_section_type: ABSTRACT
  - statement: >-
      ESP activity is stimulated by, but not strictly dependent on, added Fe(2+).
    supporting_text: Thus, the activity of the Arabidopsis ESP protein appears not to
      depend on added Fe 2+ , although supplemental Fe 2+ can increase nitrile
      formation
    reference_section_type: RESULTS
  - statement: >-
      Nitrile-producing (ESP-functional) lines suffered more T. ni feeding, which
      makes ESP's defensive role uncertain.
    supporting_text: The role of ESP in plant defense is uncertain, because the
      generalist herbivore Trichoplusia ni (the cabbage looper) was found to feed more
      readily on nitrile-producing than on isothiocyanate-producing Arabidopsis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Founding functional characterization of Arabidopsis ESP. Full text available.
      It does not mention jasmonate, so the TAS response-to-JA row citing it is
      unsupported.
- id: PMID:17369373
  title: The antagonist function of Arabidopsis WRKY53 and ESR/ESP in leaf senescence
    is modulated by the jasmonic and salicylic acid equilibrium.
  findings:
  - statement: >-
      ESR/ESP interacts with WRKY53, inhibits its DNA binding, and is recruited to
      the nucleus by WRKY53. It is otherwise cytoplasmic.
    supporting_text: ESR inhibits WRKY53 DNA binding in vitro, and their interaction
      is localized to the nucleus in vivo; however, ESR is exclusively in the
      cytoplasm in W53-KO cells, indicating that ESR is brought to the nucleus by the
      interaction.
    reference_section_type: ABSTRACT
  - statement: >-
      ESR knockout accelerates and overexpression delays leaf senescence.
      Overexpression increases resistance to bacterial and fungal pathogens.
    supporting_text: Leaf senescence is accelerated in ESR knockout plants (ESR-KO)
      but retarded in ESR overexpressors (ESR-OE), with the reverse true for WRKY53.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Full text available. Experiments (Y2H, BiFC, EMSA, complemented T-DNA mutant)
      appear sound, but they were done in Col-0, which the glucosinolate field
      regards as a natural leaf ESP knockout (PMID:27990154). The WRKY53-linked
      senescence role has not been independently replicated, so it is treated as
      non-core.
- id: PMID:23999604
  title: Molecular models and mutational analyses of plant specifier proteins suggest
    active site residues and reaction mechanism.
  findings:
  - statement: >-
      Homology models and mutational analysis of two TFPs and one ESP define an
      active site and aglucone docking arrangements that explain product
      specificity.
    supporting_text: We have used two thiocyanate-forming proteins and one
      epithiospecifier protein with different substrate/product specificities to
      develop molecular models that, in conjunction with mutational analyses, allow
      us to propose an active site
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in cache. Source of the IMP rows.
- id: PMID:27498030
  title: Crystal structure of the Epithiospecifier Protein, ESP from Arabidopsis thaliana
    provides insights into its product specificity.
  findings:
  - statement: >-
      The 2.3 A crystal structure of AtESP shows a dimer whose interface differs from
