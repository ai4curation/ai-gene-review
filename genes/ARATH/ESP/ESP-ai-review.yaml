core_functions:
- description: >-
    ESP is an Fe(II)-dependent carbon-sulfur lyase (specifier protein) that acts on
    the thiohydroximate-O-sulfate aglucone released by myrosinase and eliminates
    sulfate. With alkenyl glucosinolates it forms epithionitriles by intramolecular
    sulfur transfer to the terminal double bond (EC 4.8.1.6). With other
    glucosinolates it forms simple nitriles (EC 4.8.1.5). This diverts
    glucosinolate breakdown away from isothiocyanates in the cytoplasm of damaged
    cells.
  molecular_function:
    id: GO:0016846
    label: carbon-sulfur lyase activity
  directly_involved_in:
  - id: GO:0019762
    label: glucosinolate catabolic process
  - id: GO:0080028
    label: nitrile biosynthetic process
  locations:
  - id: GO:0005737
    label: cytoplasm
