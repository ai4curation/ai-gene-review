id: Q8RY71
gene_symbol: ESP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  ESP (epithiospecifier protein; also called ESR, EPITHIOSPECIFYING SENESCENCE
  REGULATOR; At1g54040) is a cytoplasmic Kelch-repeat protein that folds as a
  six-bladed beta-propeller, forms homodimers, and binds an iron cofactor through
  a conserved EXXXDXXXH-type triad in the loops at the base of the propeller. It
  belongs to the specifier-protein family of the glucosinolate-myrosinase defence
  system. ESP has no hydrolytic activity on intact glucosinolates; instead, when
  tissue damage brings glucosinolates into contact with myrosinase, ESP acts on the
  unstable thiohydroximate-O-sulfate aglucone released by myrosinase and redirects
  its breakdown away from the default isothiocyanate. With alkenyl glucosinolates
  that carry a terminal double bond (e.g. allylglucosinolate) it forms
  epithionitriles by intramolecular sulfur transfer to the terminal alkene, and with
  other aliphatic and indolic glucosinolates it forms simple nitriles. It is now
  regarded as an Fe(II)-dependent sulfolyase (EC 4.8.1.6 epithionitrile-forming;
  EC 4.8.1.5 nitrile-forming) rather than a myrosinase cofactor. ESP is expressed
  in the epidermis of aerial organs and in glucosinolate-rich S-cells, is induced by
  jasmonate, and is a major natural polymorphism among accessions: Landsberg erecta
  expresses functional ESP and produces mainly nitriles, whereas Columbia-0 is a
  natural ESP knockout in leaves and produces mainly isothiocyanates. Its
  ecological role is ambiguous, as ESP-derived nitriles increased feeding by the
  generalist Trichoplusia ni compared with isothiocyanates. A second, WRKY53-linked
  role has been reported, in which ESP is recruited to the nucleus by WRKY53,
  inhibits WRKY53 DNA binding and delays leaf senescence, and in which
  overexpression increases resistance to bacterial and fungal pathogens.
