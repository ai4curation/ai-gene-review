    reason: Following the GO convention that a peptide-hormone/cytokine precursor gene product carries the activity
      of its mature peptide, cytokine activity is the best-supported molecular function of PR1. The CAPE9 receptor
      has not been identified, so the receptor-interaction part of the definition is inferred rather than shown.
