taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'PATHOGENESIS-RELATED PROTEIN 1 (PR1, At2g14610) is a small secreted CAP-superfamily (CRISP/PR-1) protein
  with a 26-residue signal peptide that accumulates to high levels in the leaf apoplast after salicylic acid (SA)
  signalling, pathogen infection or treatment with SA analogues, and is the classical marker of SA-dependent systemic
  acquired resistance (SAR). PR1 acts as the pro-protein of a phytocytokine: the apoplastic papain-like cysteine
  protease XCP1 cleaves PR1 after its C-terminal CNYD motif to release the 11-residue peptide CAPE9, which raises
  SA levels and activates systemic immunity; the pr1 mutant lacks pathogen-associated systemic immunity unless complemented
  with cleavable PR1 or supplied with CAPE9. Members of the PR-1 family from other plants bind sterols and inhibit
  sterol-auxotrophic oomycetes, a possible additional antimicrobial activity not yet demonstrated for Arabidopsis
  PR1.'
