suggested_questions:
- question: What is the receptor for AtCAPE9, and does PR1-derived CAPE9 signal through a cell-surface receptor
    kinase like other plant phytocytokines?
- question: Does Arabidopsis PR1 itself bind sterols and have direct antimicrobial activity, as shown for tobacco
    and tomato PR-1, independently of CAPE9 release?
- question: Should the CAPE9 peptide (residues 151-161, after the CNYD cleavage site) be recorded as a PEPTIDE feature/cleavage
    product in UniProt P33154?
- question: Should the XCP1-PR1 substrate relationship be captured as has_input on XCP1 peptidase activity (GO-CAM)
    rather than as any processing term on PR1?
suggested_experiments:
- description: Identify the CAPE9 receptor by forward genetics or receptor-kinase mutant screens for loss of CAPE9-induced
    SA accumulation and systemic resistance.
- description: Test purified Arabidopsis PR1 and PR1-deltaCAPE9 for sterol binding and inhibition of Phytophthora/Hyaloperonospora
    growth to separate a CAPE9-independent antimicrobial function.
