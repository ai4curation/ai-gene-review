    label: activation of immune response
  evidence_type: IMP
  original_reference_id: PMID:37542077
  qualifier: involved_in
  review:
    summary: The pr1 CRISPR mutant fails to mount Agrobacterium-induced systemic immunity, which is restored by
      local expression of native PR1 or by local application of the PR1-derived peptide AtCAPE9, which itself elevates
      SA levels.
    action: ACCEPT
    reason: 'Direct mutant and complementation evidence from the full text of PMID:37542077: PR1, through release
      of its C-terminal CAPE9 peptide, activates SA-dependent systemic immunity. Activation of immune response is
      an appropriate description of what the released cytokine does; systemic acquired resistance (carried by other
      rows) is the specific downstream process.'
    supported_by:
    - &id008
      reference_id: PMID:37542077
      supporting_text: Relative to the mock treatment, the local infiltration of the Agrobacterium carrying P19
        plasmid only (P19) can trigger systemic immunity to reduce the disease severity of the systemic leaves infected
        by Pst DC3000 in wild-type Arabidopsis (WT), but not in pr1 (Fig. 2b).
    - &id001
      reference_id: PMID:37542077
      supporting_text: both CNYD and CAPE domains for proteolytic production of AtCAPE9 from PR1 are crucial for
        eliciting Arabidopsis systemic immunity
    - &id002
      reference_id: PMID:37542077
      supporting_text: Compared to the plants treated with water, the AtCAPE9-treated plants displayed an increased
        level of SA (2.1-fold) (Fig. 1a).
- term:
