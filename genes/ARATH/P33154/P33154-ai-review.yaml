    label: cytokine activity
  evidence_type: IMP
  original_reference_id: PMID:37542077
  qualifier: enables
  review:
    summary: PR1 is the pro-protein of the phytocytokine AtCAPE9 (PRGNYVNEKPY), released by XCP1 cleavage after
      the CNYD motif; synthetic AtCAPE9 raises SA and confers resistance, and the cleavage site and CAPE9 region
      are both required for PR1 to restore systemic immunity in pr1.
