id: P29383
gene_symbol: SEP4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SEPALLATA4 (SEP4; AGL3; At2g03710; UniProt P29383) is a MIKC-type MADS-box transcription
  factor of the SEPALLATA subfamily. AGL3/SEP4 binds CArG-box DNA sequences resembling SRF/MCM1 sites.
  Unlike SEP1-3 it is also expressed in vegetative above-ground organs, as well as in flowers. sep4 single
  mutants are near wild type, but sep1 sep2 sep3 sep4 quadruple mutants convert all floral organs, sepals
  included, into leaf-like organs. SEP4 therefore contributes, redundantly with SEP1-3, to the identity
  of all four floral organ types. SEP4 also acts with AP1, CAL and FUL in floral meristem identity. SEP4
  forms heteromeric complexes with other MADS proteins and is one of the host MADS proteins targeted for
  degradation by the phytoplasma effector SAP54.
