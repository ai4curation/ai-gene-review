suggested_questions:
- question: Which MIR loci require HYL1-dependent cleavage-site selection versus increased
    processing efficiency, and what precursor features determine this dependence?
- question: How does HYL1 association with Pol II distinguish its transcriptional role from its role
    in precursor processing?
- question: Should the RNase III ancestral assertion be restricted to catalytic-domain-containing
    descendants rather than propagated into dsRBD-only proteins?
suggested_experiments:
- description: Quantify processing accuracy of DCL1 on pri-miRNA substrates with DRB1/HYL1 dsRBD
    mutants that separate RNA binding from DCL1/SERRATE interaction.
  experiment_type: Reconstituted miRNA processing with separation-of-function variants
  hypothesis: RNA-substrate binding and DCL1 association make separable contributions to cleavage
    efficiency and accuracy.
- description: Map DRB1/HYL1 nuclear dicing body, nucleoplasmic, and cytoplasmic pools under stress
    to determine which pools support processing versus translational repression.
  experiment_type: Localization and acute perturbation of HYL1 pools
  hypothesis: Nuclear HYL1 pools differ in their association with Pol II and DCL1 and contribute
    differently to transcription and processing.
