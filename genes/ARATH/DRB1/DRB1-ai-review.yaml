- id: PMID:18632569
  title: The RNA-binding proteins HYL1 and SE promote accurate in vitro processing of pri-miRNA by
    DCL1.
  findings:
  - statement: Purified HYL1 increases DCL1 cleavage rate and accuracy without providing RNase III
      catalysis.
    supporting_text: "We show that recombinant HYL1 and SE proteins accelerate the\nrate of DCL1-mediated
      cleavage of pre- and pri-miR167b substrates and promote\naccurate processing."
    reference_section_type: ABSTRACT
  - statement: Adding HYL1 to DCL1 increased precise pri-miR167b processing from 11% to 22% in the
      reconstituted assay.
    supporting_text: HYL1 increased the accuracy from 11% to 22%, whereas SE increased the accuracy
      to 41%.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Re-read cached full Results: recombinant DCL1 cleaves substrate, while added HYL1 increases
      rate and fidelity. This supports activation rather than assigning intrinsic nuclease catalysis to
      HYL1; an explicit HYL1-alone negative cleavage control was not located.'
