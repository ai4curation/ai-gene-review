- term:
    id: GO:0004525
    label: ribonuclease III activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: DRB1/HYL1 binds RNA and stimulates the catalytic RNase III DCL1; it does not itself
      carry out RNase III cleavage.
    action: REMOVE
    reason: The PAINT table places GO:0004525 at PTN000129453, but HYL1 has tandem dsRNA-binding
      domains rather than an RNase III catalytic domain. Recombinant processing assays assign
      cleavage to DCL1 and increased rate/accuracy to HYL1 (PMID:18632569). This target-specific
      domain architecture contradicts transfer of catalysis; donor count is not the issue. The
      completed OpenScientist hypothesis report independently agrees with this catalytic/cofactor
      distinction. Primary Results show that adding HYL1 alone to DCL1 increases cleavage rate and
      precise processing; they are not an explicit negative HYL1-alone nuclease assay. The report
      does not establish an exact SF0-to-SF1 propagation path or a de novo catalytic-domain scan;
      neither claim is needed for this decision.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      residue_claims_not_applicable: DRB1/HYL1 lacks the RNase III catalytic domain entirely; this
        is a whole-domain absence rather than a residue substitution, so no point-residue claim
        applies.
      source_entities:
      - source_id: PANTHER:PTN000129453
        source_label: PTN000129453
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The cached PTHR11207 PAINT table directly records a GO:0004525 IBD at this node
          with experimentally grounded nuclease seeds. HYL1 lacks the catalytic RNase III domain.
          This challenges scope of the ancestral assertion for a dsRBD-only target; it does not
          claim that the listed seeds are wrong or infer an unverified history of domain loss. The
          local entries table confirms O04492 in SF1 and P0A7Y0/Q9NRR4 in SF0, but subfamily
          membership does not locate the ancestral assertion or its pruning boundaries. The PAINT
          table also contains RNase III IRD exclusions at other nodes; no family-wide unrestricted
          propagation is asserted here.
    supported_by:
    - &id002
      reference_id: PMID:18632569
      supporting_text: "We show that recombinant HYL1 and SE proteins accelerate the\nrate of DCL1-mediated
        cleavage of pre- and pri-miR167b substrates and promote\naccurate processing."
      reference_section_type: ABSTRACT
    - reference_id: PMID:18632569
      supporting_text: Addition of either recombinant HYL1 or recombinant SE significantly increased
        the initial rate of DCL1-mediated cleavage of pre-miR167b to 21-nt small RNAs
      reference_section_type: RESULTS
    additional_reference_ids:
    - PMID:18632569
