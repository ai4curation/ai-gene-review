id: O04492
gene_symbol: DRB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: DRB1/HYL1 is a nuclear double-stranded RNA-binding protein that promotes efficient and
  accurate microRNA biogenesis in Arabidopsis. Its tandem dsRNA-binding domains recognize structured
  miRNA precursors and support protein assembly; HYL1 cooperates with DCL1 and SERRATE to stimulate
  DCL1-mediated cleavage without supplying RNase III catalysis. HYL1 occupies nuclear dicing bodies
  and nucleoplasm, and its activity is controlled by phosphorylation and protein stability. It also
  associates with RNA polymerase II and supports MIR gene transcription. Its miRNA-regulatory
  functions contribute to leaf patterning, hormone responses and reproductive development.
