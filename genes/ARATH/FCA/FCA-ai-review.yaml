core_functions:
- description: RRM-containing RNA-binding protein that binds nascent transcripts (its own pre-mRNA and
    the FLC antisense COOLAIR lncRNA) and, via its WW domain interaction with the CPSF subunit FY, directs
    cleavage and polyadenylation to promoter-proximal poly(A) sites in nuclear bodies.
  molecular_function:
    id: GO:0106222
    label: lncRNA binding
  directly_involved_in:
  - id: GO:0110104
    label: mRNA alternative polyadenylation
  locations:
  - id: GO:0016604
    label: nuclear body
  supported_by:
  - reference_id: PMID:31032401
    supporting_text: We report that the RNA binding protein FCA interacts with the PRC2 subunit CURLY
      LEAF (CLF) and binds nascent COOLAIR transcripts to allow deposition of H3K27me3 at FLC.
  - reference_id: PMID:19965720
    supporting_text: A specific RNA-binding protein directs their activity to a proximal antisense polyadenylation
      site.
  - reference_id: PMID:12809608
    supporting_text: FCA expression is autoregulated through the use of different polyadenylation sites
      within the FCA pre-mRNA, and the FCA/FY interaction is required for efficient selection of the promoter-proximal
      polyadenylation site.
- description: Promotes the floral transition in the autonomous pathway by triggering co-transcriptional,
    FLD-dependent H3K4 demethylation and PRC2-mediated silencing of FLC following proximal polyadenylation
    of COOLAIR.
  molecular_function:
    id: GO:0003723
    label: RNA binding
  directly_involved_in:
  - id: GO:0009909
    label: regulation of flower development
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:17996704
    supporting_text: These data support a close association of FCA and FLD in mediating H3K4 demethylation
      and thus transcriptional silencing of FLC and reveal roles for antisense RNA processing and DCL3
      function in this regulation.
  - reference_id: PMID:32541063
    supporting_text: Proximal polyadenylation of the antisense transcripts by FCA, an RNA-binding protein
      that physically interacts with RNA 3' processing factors, reduces FLC transcription.
suggested_questions:
- question: What RNA sequence or structural features does FCA recognise to select proximal poly(A) sites,
    and how is specificity for COOLAIR versus its own intron 3 achieved?
- question: How does FCA-mediated proximal termination physically hand over to the FLD/LD/SDG26 chromatin
    module (via FY-SDG26 contacts or via the CPF-like APRF1/LD phosphatase module)?
suggested_experiments:
- description: Map FCA RNA-binding sites genome-wide by iCLIP or HyperTRIBE in wild type and RRM point
    mutants, and correlate with proximal poly(A) site usage measured by direct RNA sequencing.
  hypothesis: FCA binds specific motifs upstream of proximal poly(A) sites that it promotes.
  experiment_type: iCLIP / direct RNA sequencing
