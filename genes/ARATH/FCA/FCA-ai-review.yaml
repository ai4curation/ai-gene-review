id: O04425
gene_symbol: FCA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FCA is a nuclear RNA-binding regulator with two RNA recognition motifs and a WW protein-interaction
  domain. It promotes flowering in Arabidopsis by limiting expression of the floral repressor FLC. FCA
  binds COOLAIR antisense RNAs and helps couple RNA processing to chromatin regulation, including association
  with the PRC2 subunit CLF. Its interaction with the CPSF component FY controls proximal polyadenylation,
  including autoregulatory processing of FCA pre-mRNA. FCA forms dynamic nuclear bodies whose assembly
  is promoted by FLL2. FCA and FPA have overlapping requirements in reproductive development but distinct
  molecular interactions. FCA is not an abscisic-acid receptor.
