id: O04425
gene_symbol: FCA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FCA is a plant-specific nuclear RNA-binding protein with two RNA recognition motifs (RRMs)
  and a C-terminal WW protein-interaction domain that promotes the floral transition in Arabidopsis as
  a founding member of the autonomous flowering pathway. FCA binds nascent RNA co-transcriptionally and,
  through its WW domain, transiently engages the conserved cleavage and polyadenylation specificity factor
  (CPSF) subunit FY/WDR33, thereby directing 3'-end processing to promoter-proximal poly(A) sites. This
  activity negatively autoregulates FCA itself (promoting cleavage and polyadenylation within FCA intron
  3 to give the truncated FCA-beta transcript) and promotes proximal polyadenylation of the FLOWERING
  LOCUS C (FLC) antisense transcripts (COOLAIR), which in turn triggers FLD-dependent H3K4 demethylation,
  PRC2/H3K27me3 deposition and transcriptional repression of the floral repressor FLC. FCA localizes to
  liquid-like nuclear bodies whose formation is promoted by the coiled-coil protein FLL2, and acts redundantly
  with the spen-family RNA-binding protein FPA. FCA also promotes proximal polyadenylation and silencing
  at other loci genome-wide and, together with FPA, is required during female gametophyte and early embryo
  development. FCA does not bind abscisic acid, contrary to an earlier (retracted) proposal.
