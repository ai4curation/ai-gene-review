taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: HSK, also called DMR1, is a chloroplast homoserine kinase that uses Mg-ATP to generate O-phosphohomoserine.
  This metabolite supplies both threonine synthase and the cystathionine gamma-synthase branch toward
  methionine. HSK activity and homoserine availability influence amino-acid metabolism; reduced-function
  alleles accumulate homoserine and alter susceptibility to downy mildew and certain fungal pathogens
  in tissue- and allele-dependent ways.
