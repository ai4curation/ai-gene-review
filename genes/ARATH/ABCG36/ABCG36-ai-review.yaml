id: Q9XIE2
gene_symbol: ABCG36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'ABCG36 (PENETRATION3/PEN3, PLEIOTROPIC DRUG RESISTANCE8/PDR8) is a full-size pleiotropic
  drug resistance-type ABC transporter of the ABCG subfamily that acts as an ATP-dependent exporter of
  small molecules across the plasma membrane. In leaves it is uniformly distributed in the epidermal plasma
  membrane and, after perception of fungal or bacterial molecular patterns, is focally recruited to sites
  of attempted pathogen penetration where it accumulates in papillae; there it exports tryptophan-derived
  defense metabolites, including the phytoalexin camalexin and products of the PEN2 myrosinase-dependent
  indole glucosinolate pathway, contributing to pre-invasive nonhost resistance against powdery mildews
  and other fungi, and to defense against oomycetes and bacteria. In roots it occupies the outer lateral
  plasma-membrane domain of epidermal cells, where, redundantly with ABCG37, it exports the auxin precursor
  indole-3-butyric acid (but not IAA), influencing auxin homeostasis and root and cotyledon growth. It
  also mediates cadmium extrusion and contributes to heavy-metal tolerance. Its substrate preference is
  regulated by phosphorylation: the receptor kinase QSK1 represses IBA export in favor of camalexin export,
  and the transporter interacts with calmodulin Ca2+ sensors. PEN3 cycles between the plasma membrane
  and the trans-Golgi network.'
