proposed_new_terms: []
suggested_questions:
- question: GO:0160080 'ABC-type indole transporter activity' is defined with indole itself as substrate,
    but wild-type ABCG36 exports indole derivatives (camalexin, IBA, 4-methoxyindol-3-ylmethanol). Should
    GO broaden the definition to indole-containing compounds, or create camalexin / indole glucosinolate-product
    exporter terms?
- question: Which chemical species does ABCG36 actually translocate in cadmium tolerance (free Cd2+ or
    a glutathione/phytochelatin conjugate), and is cadmium ion transmembrane transporter activity the
    right MF?
- question: Is there a single molecular substrate of PEN3 in nonhost resistance to powdery mildew (4MeOI3M,
    4MeOI3Cys or camalexin), and how is substrate choice regulated by PAMP-induced phosphorylation and
    calmodulin binding?
suggested_experiments:
- description: Vesicular or proteoliposome transport assays with purified ABCG36 to test direct transport
    of candidate PEN2-pathway products (4MeOI3M, 4MeOI3Cys) and Cd-glutathione conjugates, with kinetic
    constants.
- description: Phospho-mimic/phospho-dead ABCG36 variants expressed in abcg36 backgrounds, combined with
    leaf-surface metabolomics after Blumeria inoculation, to link specific phosphosites to substrate export
    at penetration sites.
