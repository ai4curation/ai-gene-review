- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: ISM
  original_reference_id: GO_REF:0000122
  qualifier: located_in
  review:
    summary: AtSubP sequence-based prediction of mitochondrial localization.
    action: REMOVE
    reason: The prediction is most likely triggered by the hydrophobic N-terminal signal anchor (TM 2-20)
      typical of microsomal P450s. Experimental data place CYP71A13 at the ER, where it colocalizes with
      an ER marker and with the other camalexin P450s, and recombinant enzyme is recovered in microsomes
      with P450 reductase. There is no evidence for a mitochondrial pool.
    supported_by:
    - &id005
      reference_id: file:ARATH/CYP71A13/CYP71A13-deep-research-falcon.md
      supporting_text: colocalized with the ER marker
