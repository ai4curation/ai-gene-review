- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: IDA
  original_reference_id: PMID:33831160
  qualifier: located_in
  review:
    summary: IDA for ER lumen. The cited PMID:33831160 is a deleted PubMed duplicate of PMID:31511315 (Mucha
      et al. 2019, camalexin metabolon); only its abstract is available, so the imaging behind this row
      could not be read.
    action: UNDECIDED
    reason: The ER part of this annotation is well supported (ER-marker colocalization in the metabolon
      paper, microsomal recovery). The lumen part is not. CYP71A13 is a type-I microsomal P450 with a single
      N-terminal transmembrane anchor (residues 2-20); in such proteins the catalytic domain faces the
      cytosol, where it meets NADPH-P450 reductase. The resolved source itself reports CYP71A13 binding
      the P450 reductase ATR1 and recruiting the soluble GSTU4, both of which fit a cytosol-facing enzyme.
      Because the full text could not be read, this row stays UNDECIDED rather than REMOVE, as for the
      equivalent CYP71B15 row. Endoplasmic reticulum membrane (GO:0005789) is the expected location.
    supported_by:
    - &id007
      reference_id: PMID:31511315
      supporting_text: Furthermore, the interaction of CYP71A13 and Arabidopsis P450 Reductase1 was observed.
    - *id004
    - &id008
      reference_id: file:ARATH/CYP71A13/CYP71A13-deep-research-falcon.md
      supporting_text: As a membrane-associated plant P450, its catalytic site is expected to face the
        cytosolic side of the ER
