id: O49342
gene_symbol: CYP71A13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: CYP71A13 (At2g30770) is an ER-anchored cytochrome P450 of the CYP71 family in Arabidopsis
  thaliana that commits indole-3-acetaldoxime (IAOx), made from tryptophan by CYP79B2 and CYP79B3, to
  the biosynthesis of the indole phytoalexin camalexin. It dehydrates IAOx to indole-3-acetonitrile (IAN;
  indoleacetaldoxime dehydratase, EC 4.8.1.3) and, using O2 and electrons from NADPH-P450 reductase, also
  converts IAOx to a reactive alpha-hydroxy-IAN (indole-3-cyanohydrin) or dehydro-IAN electrophile. This
  intermediate is captured by glutathione or cysteine, and the conjugate is processed to Cys(IAN) and
  converted to camalexin by CYP71B15 (PAD3). Its tandem paralog CYP71A12 can perform the same reactions
  but channels more of the intermediate into indole-3-carbaldehyde and indole-3-carboxylic acid derivatives.
  CYP71A13 is expressed at low levels in healthy plants and is strongly induced by pathogens, flagellin,
  UV-C and silver nitrate, partly through WRKY33. In infected cells it associates with CYP79B2, CYP71B15,
  P450 reductase ATR1 and the glutathione transferase GSTU4 in an ER-associated biosynthetic complex.
  cyp71a13 mutants make much less camalexin, are more susceptible to Alternaria brassicicola, lose UV-C-induced
  resistance to Botrytis cinerea, and are impaired in restricting post-invasive growth of some other
  filamentous fungi.
