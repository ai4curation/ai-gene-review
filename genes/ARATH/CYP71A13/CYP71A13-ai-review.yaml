core_functions:
- description: Dehydration of indole-3-acetaldoxime to indole-3-acetonitrile, the committed step of camalexin
    biosynthesis, followed by reductase- and O2-dependent oxidation to the cyanohydrin electrophile that
    is captured by glutathione, at the cytosolic face of the ER membrane.
