suggested_questions:
- question: CYP71A13 also oxidizes IAOx/IAN to an alpha-hydroxy-IAN (cyanohydrin) or dehydro-IAN electrophile
    that is conjugated to glutathione or cysteine (Klein et al. 2013), the step that actually feeds camalexin
    synthesis. GO and Rhea have no term for this oxidation. Should a term be created, so that the CYP71A13
    activity is not represented only by the dehydratase (EC 4.8.1.3) reaction?
- question: What is the experimental basis for the ER lumen (GO:0005788) IDA attributed to PMID:33831160
    (deleted duplicate of PMID:31511315)? For a type-I ER-anchored P450 that binds ATR1, the catalytic
    domain is expected on the cytosolic face.
- question: How much does CYP71A12 compensate for CYP71A13 in camalexin synthesis in different tissues,
    given that CYP71A12 favours the indole-3-carbaldehyde/ICA branch?
suggested_experiments:
- description: Protease-protection or split-GFP topology assays on ER microsomes from elicited leaves,
    to establish which face of the ER the CYP71A13 catalytic domain sits on.
- description: Kinetic comparison of purified CYP71A13 and CYP71A12 with IAOx and IAN, with and without
    glutathione transferases, to define how product partitioning between Cys/GS-IAN and indole-3-carbaldehyde
    is controlled.
