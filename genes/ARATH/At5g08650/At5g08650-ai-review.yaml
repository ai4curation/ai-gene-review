    summary: GTPase activity inferred from the tr-type G domain (InterPro IPR000795), the
      HAMAP MF_03138 rule and the RHEA GTP hydrolysis reaction.
    action: ACCEPT
    reason: Q9FNM5 sits in PANTHER PTHR43512:SF4 with E. coli LepA, whose ribosome-dependent
