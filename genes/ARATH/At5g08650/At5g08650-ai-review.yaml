    label: mRNA binding
  evidence_type: IDA
  original_reference_id: PMID:32344669
  qualifier: enables
  review:
    summary: Detected as an RNA-interacting protein in a leaf-wide RNA interactome capture
      (oligo-dT pull-down after UV crosslinking) screen.
    action: KEEP_AS_NON_CORE
    reason: The RIC screen shows that cpLEPA is crosslinked to polyadenylated RNA in vivo,
      which is consistent with its expected position on translating chloroplast ribosomes, where
      it would sit next to mRNA and tRNA. The screen does not separate direct sequence-specific
      mRNA binding from proximity to RNA within ribosomes, and no RNA-binding activity has been
      described for LepA proteins beyond their ribosome interaction. The annotation is kept as
      experimental but is not treated as a core activity.
    supported_by:
