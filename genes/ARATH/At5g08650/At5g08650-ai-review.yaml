  review:
    summary: Ribosome binding propagated from PAINT node PTN002460656, seeded by yeast Guf1
      and E. coli LepA.
    action: ACCEPT
    reason: PTN002460656 is a deep node spanning both the LepA/chloroplast subfamily (SF4,
      which contains Q9FNM5 and E. coli LepA) and the mitochondrial GUF1 subfamily (SF7). E. coli
      LepA binds and back-translocates ribosomes, and yeast Guf1 binds mitochondrial ribosomes
      in a GTP-dependent manner. Q9FNM5 is inside the clade, retains all G-domain motifs, and
      its loss reduces ribosome loading of plastid mRNAs, consistent with action on plastid
      ribosomes. Direct ribosome binding by cpLEPA has not been shown, so this rests on the
      phylogenetic inference.
