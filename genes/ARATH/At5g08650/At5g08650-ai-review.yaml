      during elongation, so it does some of the work of translation rather than being required
      upstream. Comparator check - other plastid translation factors acting on the ribosome,
      such as chloroplast ribosome recycling factor (Q9M1X0), carry GO:0032544 by IMP in
      Arabidopsis. This term is neither an ancestor nor a descendant of positive regulation of
      translation.
