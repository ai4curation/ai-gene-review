suggested_questions:
- question: Does cpLEPA bind plastid 70S ribosomes and back-translocate them in a GTP-dependent
    manner, as E. coli LepA does, or has the chloroplast form diverged in mechanism?
- question: Is the reduced ribosome loading of plastid mRNAs in cplepa mutants a direct
    initiation defect, or a secondary effect of elongation infidelity and reduced transcript
    levels?
- question: Does the thylakoid-bound pool of cpLEPA act on membrane-associated ribosomes that
    co-translationally insert photosystem proteins, and does it relocate to the stroma under
    stress?
suggested_experiments:
- hypothesis: cpLEPA is a ribosome-dependent GTPase that binds plastid ribosomes.
  description: Purify mature recombinant cpLEPA and measure GTP hydrolysis with and without
    isolated chloroplast 70S ribosomes; test ribosome co-sedimentation in GTP, GDP and GDPNP,
    and include a P-loop mutant as a negative control.
  experiment_type: in vitro biochemistry
- hypothesis: cpLEPA associates with translating thylakoid-bound ribosomes.
  description: Use ribosome profiling or polysome fractionation of membrane and stromal
    fractions in wild type and cplepa-1, plus immunoblotting of cpLEPA across polysome
    gradients, under normal and high-light conditions.
  experiment_type: ribosome profiling
