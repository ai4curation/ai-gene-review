  review:
    summary: cplepa null mutants show reduced in vivo synthesis of plastid-encoded proteins
      and reduced ribosome loading of plastid mRNAs.
    action: NEW
    reason: In pulse labelling with cycloheximide blocking cytosolic translation, synthesis of
      plastid-encoded PsaA/B, D1, D2, CP47, CP43 and CF1 alpha/beta fell to 60-70% of wild type
