id: Q9FNM5
gene_symbol: At5g08650
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  At5g08650 encodes cpLEPA, the chloroplast-targeted member of the LepA/EF4 family of
  translational GTPases (Translation factor GUF1 homolog, chloroplastic). The 681-residue
  precursor carries a predicted 51-residue chloroplast transit peptide followed by a
  translation-factor (tr-type) G domain with intact P-loop, G3 and G4 nucleotide-binding
  motifs, EF-G-like domains II, III and V, and the LepA-specific C-terminal domain. It
  belongs to the same PANTHER subfamily as bacterial LepA, separate from the mitochondrial
  GUF1 proteins. In chloroplasts the protein is found mainly peripherally associated with
  thylakoid membranes, with a smaller stromal pool. Null mutants are pale, grow poorly on
  soil, without sucrose and under high light, and show reduced in vivo synthesis of
  plastid-encoded photosynthetic proteins with reduced ribosome loading of plastid mRNAs,
  so cpLEPA is needed for efficient plastid protein synthesis. By homology to E. coli LepA,
  it is expected to be a ribosome-binding GTPase that can back-translocate ribosomes and
  act as a fidelity factor in translation elongation; these biochemical activities have
  not been tested for the Arabidopsis protein.
