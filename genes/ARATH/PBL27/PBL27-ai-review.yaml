- term:
    id: GO:0090333
    label: regulation of stomatal closure
  evidence_type: IDA
  original_reference_id: PMID:31524595
  review:
    summary: PBL27 directly phosphorylates the S-type anion channel SLAH3 at Ser-127 and Ser-189, activating
      anion currents; pbl27 stomata do not close in response to chitin, and SLAH3 S127A/S189A variants
      fail to restore chitin-induced closure.
    action: NEW
    reason: 'Participation test: PBL27 performs the regulatory step itself by phosphorylating and activating
      the channel that drives closure, rather than being merely required. Comparator check: the related
      RLCK VII kinase BIK1, which phosphorylates the calcium channel OSCA1.3 in stomatal immunity, carries
      regulation of stomatal movement. No GOA annotation captures this experimentally established PBL27
      function.'
    supported_by:
    - reference_id: PMID:31524595
      supporting_text: PBL27 has the capacity to phosphorylate SLAH3, of which S127 and S189 are required
        to activate SLAH3.
    - reference_id: PMID:31524595
      supporting_text: We conclude that PBL27 is the primary kinase that directly phosphorylates SLAH3
        for the release of anions and functions in an activation status-dependent manner regulated by
        CERK1.
    - reference_id: PMID:31524595
      supporting_text: consistently stomata of pbl27 mutants showed no closure to chitin either
