    label: defense response to fungus
  evidence_type: IDA
  original_reference_id: PMID:27679653
  qualifier: involved_in
  review:
    summary: IDA defense response to fungus from Yamada et al. 2016. The full text cites, rather than
      re-tests, the pbl27 Alternaria brassicicola phenotype (Shinya et al. 2014) and tests mapkkk5 mutants
      directly.
    action: KEEP_AS_NON_CORE
    reason: Reduced resistance to A. brassicicola in pbl27 shows that PBL27 is needed for full antifungal
      defence, but PBL27 acts upstream as a signalling kinase rather than carrying out a defence response
      itself; the mechanistic terms are the receptor signalling pathway and the kinase activity. Liu et
      al. 2019 also found that pbl27 did not show increased Botrytis lesions, suggesting redundancy. Kept
      as a non-core phenotype-level process.
