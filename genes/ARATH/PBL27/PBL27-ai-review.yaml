gene_symbol: PBL27
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: PBL27 (AVRPPHB SUSCEPTIBLE1-LIKE 27; At5g18610) is a receptor-like cytoplasmic kinase of
  subfamily VII (RLCK VII-1) in Arabidopsis thaliana and the counterpart of rice OsRLCK185. It is a catalytically
  active serine/threonine protein kinase held at the inner face of the plasma membrane, where it associates
  with the chitin receptor kinase CERK1 in the LYK5-CERK1 receptor complex. After chitin perception CERK1
  phosphorylates PBL27 in its activation-loop region, and PBL27 in turn phosphorylates downstream targets.
  In the chitin-to-MAPK route it phosphorylates the C-terminal domain of the MAP kinase kinase kinase
  MAPKKK5 (strongest at Ser-622), with which it is pre-associated at the plasma membrane and from which
  it dissociates upon chitin treatment, contributing to activation of the MKK4/MKK5-MPK3/MPK6 cascade;
  independent genetic work indicates that RLCK VII-4 members act redundantly or predominantly in this
  step. In guard cells PBL27 phosphorylates the S-type anion channel SLAH3 at Ser-127 and Ser-189, activating
  anion efflux required for chitin-induced stomatal closure. PBL27 is not needed for the chitin-induced
  ROS burst, which runs through BIK1-type kinases, and contributes little to flagellin signalling. Loss
  of PBL27 reduces resistance to the necrotrophic fungus Alternaria brassicicola and to non-virulent Pseudomonas
  syringae, and PBL27 also acts with the receptor kinase HAK1 in responses to insect oral-secretion polysaccharides.
