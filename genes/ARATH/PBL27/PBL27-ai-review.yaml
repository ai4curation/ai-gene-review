- term:
    id: GO:0043410
    label: positive regulation of MAPK cascade
  evidence_type: IMP
  original_reference_id: PMID:24750441
  qualifier: involved_in
  review:
    summary: 'IMP from Shinya et al. 2014: pbl27 knockouts show reduced chitin-induced MPK3/6 activation.
      Yamada et al. 2016 supplied the mechanism: PBL27 phosphorylates MAPKKK5, the MAP3K upstream of MKK4/MKK5-MPK3/MPK6.'
    action: ACCEPT
    reason: 'PBL27 performs a step in the activation of the MAPK cascade (phosphorylation of MAPKKK5),
      so positive regulation of MAPK cascade is an appropriate process term and matches the module annoton.
      The quantitative genetic requirement is disputed: Rao et al. 2018 and Bi et al. 2018 attribute chitin-induced
      MAPKKK5 phosphorylation and MAPK activation mainly to RLCK VII-4 members (e.g. PBL19 at MAPKKK5
      Ser-599). Those papers are abstract-only in the cache and do not contradict the biochemical activity,
      so the curator-made annotation is kept, with the dispute recorded.'
    additional_reference_ids:
    - PMID:29907700
    - PMID:29871986
    supported_by:
    - reference_id: PMID:24750441
      supporting_text: Knockout of PBL27 resulted in the suppression of several chitin-induced defense
        responses, including the activation of MPK3/6 and callose deposition as well as in disease resistance
        against fungal and bacterial infections.
    - reference_id: PMID:27679653
      supporting_text: PBL27 phosphorylates MAPKKK5 in a CERK1‐dependent manner.
    - reference_id: PMID:29907700
      supporting_text: RLCK VII-4 members were required for the chitin-triggered activation of MAPK, demonstrating
        that these kinases link a PRR to MAPK activation
    - reference_id: PMID:29871986
      supporting_text: directly phosphorylate MAPKKK5 Ser-599, which is required for pattern-triggered
        MPK3/6 activation
    - reference_id: file:ARATH/PBL27/PBL27-deep-research-falcon.md
      supporting_text: The claim that PBL27 is the uniquely required chitin-to-MAPK connector remains
        contested.
