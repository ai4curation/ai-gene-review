id: Q9SQR3
gene_symbol: D14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: DWARF14 (AtD14) is the strigolactone (SL) receptor of Arabidopsis, a 267-residue alpha/beta-hydrolase-fold
  protein with a Ser97-His247-Asp218 catalytic triad in a hydrophobic ligand pocket. Binding of SL (and
  of the synthetic analog GR24) triggers a conformational change of the lid domain that allows D14 to
  associate with the F-box protein MAX2 (SCF(MAX2)/ASK1) and with the SMXL6/SMXL7/SMXL8 transcriptional
  co-repressors, leading to their polyubiquitination and proteasomal degradation. D14 also slowly hydrolyses
  the butenolide D-ring of SLs; whether hydrolysis (and a covalently linked D-ring intermediate) is required
  to activate signalling or mainly deactivates the hormone after signalling remains debated. D14 is found
  in the nucleus and cytoplasm, acts locally in the shoot rather than as a mobile signal, and is itself
  degraded in an SL- and MAX2-dependent manner as negative feedback. Loss of D14 causes increased shoot
  branching, altered leaf shape and insensitivity to SL; its paralog KAI2 mediates karrikin responses
  through the same F-box protein.
