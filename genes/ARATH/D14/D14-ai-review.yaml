proposed_new_terms:
- proposed_name: strigolactone receptor activity
  proposed_definition: Combining with a strigolactone and transmitting the signal, typically by an SL-induced
    conformational change that promotes association with an F-box protein (MAX2/D3) and SMXL/D53-family
    co-repressors, leading to their ubiquitin-dependent degradation.
  justification: D14 orthologs in Arabidopsis, rice, petunia and pea are bona fide SL receptors, but GO
    has no SL-specific receptor MF; analogous terms exist for auxin (GO:0038198). The term would be a
    child of GO:0038023 signaling receptor activity.
  supported_by:
  - reference_id: PMID:27479325
    supporting_text: define AtD14 as a non-canonical hormone receptor with dual functions to generate
      and sense the active form of strigolactone
- proposed_name: strigolactone hydrolase activity
  proposed_definition: Catalysis of the hydrolysis of the butenolide D-ring (a cyclic carboxylic ester)
    of a strigolactone, releasing the ABC-ring moiety and a hydroxy-butenolide D-ring product, typically
    via a Ser-His-Asp catalytic triad.
  justification: D14 hydrolyses GR24 and natural SLs; GO has only substrate-specific lactonase children
    of GO:0052689 carboxylic ester hydrolase activity (e.g. limonin-D-ring-lactonase activity) and none
    for strigolactone. The term would be a child of GO:0052689.
  supported_by:
  - reference_id: PMID:23381136
    supporting_text: only the D14 proteins were able to hydrolyze GR24, demonstrating hormone substrate
      specificity for this class of signaling hydrolases
suggested_questions:
- question: Is D14 catalysis required for signalling in planta (CLIM model, Yao et al. 2016) or is intact
    SL binding sufficient, with hydrolysis serving mainly to deactivate the hormone (Seto et al. 2019)?
- question: What did the Alder et al. 2012 carlactone paper (PMID:22422982) assay on Arabidopsis D14 that
    underlies the UniProt IMP annotation to strigolactone biosynthetic process (GO:1901601), and should
    that result instead be captured as a response/signalling term (e.g. response to strigolactone), given
    that d14 mutants are SL-insensitive rather than SL-deficient?
suggested_experiments:
- description: Knock-in catalytic-triad mutants (S97A, H247A, D218A) at the endogenous AtD14 locus, combined
    with quantitative SMXL7 degradation reporters and BRC1 expression, to separate binding-driven from
    hydrolysis-driven receptor activation.
  experiment_type: genetic complementation with biochemical readout
