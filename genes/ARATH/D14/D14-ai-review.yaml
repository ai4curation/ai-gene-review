- term:
    id: GO:1901601
    label: strigolactone biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:22422982
  qualifier: involved_in
  review:
    summary: UniProt IMP annotation of strigolactone biosynthetic process citing the carlactone paper
      (Alder et al. 2012).
    action: REMOVE
    reason: D14 performs no step of strigolactone biosynthesis. The pathway that forms SL from beta-carotene
      is catalysed by D27, CCD7 and CCD8 (to carlactone) and then MAX1 and downstream oxidases/methyltransferases,
      as the cited paper's own abstract states; D14 acts downstream as the receptor, d14 mutants are SL-insensitive
      rather than SL-deficient, and D14's hydrolase converts SL into a covalently bound intermediate and
      inactive products (perception/deactivation, not formation of strigolactone). The full text of PMID:22422982
      is not in the cache and is not open access (no PMC copy; publisher page paywalled), so the exact assay
      the UniProt curator used could not be inspected. The same paper also supports the IMP secondary shoot
      formation row above, which indicates the D14 assay was a branching phenotype (consistent with SL
      insensitivity of d14), not a biosynthetic measurement. In any case no d14 phenotype could show that D14 does
      any of the work of SL formation - a branching or SL-level phenotype in d14 reflects loss of perception
      or feedback on SL levels - so the assertion is contradicted on the same biological grounds as the
      IBA row above, independent of evidence code.
    supported_by:
    - reference_id: PMID:22422982
      supporting_text: Strigolactones derive from carotenoids via a pathway involving the carotenoid cleavage
        dioxygenases 7 and 8 (CCD7 and CCD8) and the iron-binding protein D27.
    - reference_id: PMID:22357928
      supporting_text: AtD14, is also necessary for normal strigolactone responses in seedlings and adult
        plants
    - reference_id: PMID:30643123
      supporting_text: We also demonstrate that D14 can deactivate SLs by hydrolytic degradation after
        signal transmission.
