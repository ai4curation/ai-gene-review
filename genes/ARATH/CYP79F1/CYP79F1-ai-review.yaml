  review:
    summary: >-
      PAINT-level P450 monooxygenase annotation for the CYP79 clade (CYP79F1 itself is a
      donor, as expected). The monooxygenase assertion is correct, but the electron-donor
      branch is not: microsomal P450s such as CYP79F1 receive electrons from NADPH via the
      flavoprotein NADPH-cytochrome P450 reductase (EC 1.14.14.-), and GO places the
      CYP79F1 activity GO:0120526 under GO:0016712 (reduced flavin or flavoprotein as one
      donor), not under GO:0016709.
    action: MODIFY
    reason: >-
      The catalytic reaction (UniProt/Rhea) uses reduced [NADPH--hemoprotein reductase] as
      the donor, i.e. EC 1.14.14.42, which corresponds to the flavoprotein-donor branch
      GO:0016712. The node-level function (P450 monooxygenase) is sound, so the correction
      is a sibling-branch swap rather than a removal.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN001210282
        source_label: PTN001210282
        source_status: SUPPORTS_TRANSFER
        comment: The P450 monooxygenase function at this node is sound and CYP79F1 is inside
          the clade; only the electron-donor branch of the asserted term (NAD(P)H rather than
          flavoprotein reductase) is mis-scoped for microsomal P450s.
    proposed_replacement_terms:
    - id: GO:0016712
      label: oxidoreductase activity, acting on paired donors, with incorporation or reduction
        of molecular oxygen, reduced flavin or flavoprotein as one donor, and incorporation
        of one atom of oxygen
