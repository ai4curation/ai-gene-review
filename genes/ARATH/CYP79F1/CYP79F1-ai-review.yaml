  review:
    summary: The microsome experiment does not independently establish nucleus localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: Full-text inspection of PMID:28887381 shows that washed microsomes were profiled by chromatography
      and sucrose gradients, while subcellular labels were taken from SUBAcon and prior GFP data. The
      authors explicitly report that no organelle occupied a single gradient cluster. Detection or membrane
      association is meaningful, but assigning CYP79F1 specifically to nucleus exceeds the spatial resolution
      of this experiment. This is not a claim that the detected protein is absent or that all additional
      localization is impossible; the unsupported compartment assignment, rather than the proteomic observation,
      is marked as over-annotated.
    supported_by:
