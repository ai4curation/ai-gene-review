- question: What structural features of the CYP79F1 substrate pocket allow it to accept short-chain (di-/trihomomethionine)
    homologues that CYP79F2 cannot, and do these residues predict chain-length specificity of CYP79F orthologs
    in Brassica and Camelina oilseeds?
- question: Is the cyp79f1 bushy/supershoot phenotype caused by accumulating short-chain methionine homologues,
    by diversion of flux to indole glucosinolates and auxin, or by altered cytokinin homeostasis?
suggested_experiments:
- hypothesis: A small set of active-site residues determines CYP79F1 versus CYP79F2 chain-length specificity.
  description: Swap candidate substrate-recognition-site residues between CYP79F1 and CYP79F2, express
    in yeast with ATR1, and measure kinetics on mono- to hexahomomethionine.
  experiment_type: site-directed mutagenesis and enzyme kinetics
- hypothesis: Accumulation of unconverted chain-elongated methionines drives the bushy phenotype.
  description: Combine cyp79f1 with mutants blocking chain elongation (e.g. bcat4 or mam1) and test whether
    shoot branching and hormone levels revert to wild type.
  experiment_type: genetic epistasis
