references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: InterPro2GO maps generic cytochrome P450 signatures to monooxygenase,
      heme binding, iron ion binding and paired-donor oxidoreductase terms; all correct
      but non-core relative to the specific homomethionine N-monooxygenase activity.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT IBA annotations place ER/membrane localization, P450 monooxygenase
      activity and glucosinolate biosynthetic process on the CYP79F clade; CYP79F1 is
      itself an experimental donor. The NAD(P)H-donor oxidoreductase term is better
      replaced by the flavoprotein-donor branch (GO:0016712).
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: Maps the UniProt 'Endoplasmic reticulum membrane; single-pass membrane
      protein' location (from PMID:11226190) to GO:0005789.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Rhea/EC 1.14.14.42 based assignment of homomethionine N-monooxygenase
      activity (GO:0120526), matching the experimentally characterized reactions.
- id: GO_REF:0000122
  title: AtSubP analysis
  findings:
  - statement: AtSubP predicts chloroplast localization, contradicted by experimental
      ER targeting; removed in this review.
- id: PMID:11133994
  title: Cytochrome p450 CYP79F1 from arabidopsis catalyzes the conversion of dihomomethionine
    and trihomomethionine to the corresponding aldoximes in the biosynthesis of aliphatic
    glucosinolates.
  findings:
  - statement: Recombinant CYP79F1 (E. coli) converts dihomomethionine and trihomomethionine
      to 5-methylthiopentanaldoxime and 6-methylthiohexanaldoxime; cosuppression lines have
      reduced aliphatic glucosinolates, accumulate the substrates, and are bushy.
    supporting_text: >-
      Using recombinant CYP79F1 functionally expressed in Escherichia coli, we show that
      both dihomomethionine and trihomomethionine are metabolized by CYP79F1 resulting in
      the formation of 5-methylthiopentanaldoxime and 6-methylthiohexanaldoxime,
      respectively.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: CYP79F1 cosuppression causes loss of apical dominance and multiple axillary
      shoots, an indirect developmental consequence of the metabolic block.
    supporting_text: >-
      The transgenic plants have a morphological phenotype showing loss of apical dominance
      and formation of multiple axillary shoots.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary biochemical identification of CYP79F1 activity; abstract only
      in cache, consistent with UniProt ECO:0000269 citations for EC 1.14.14.42.
- id: PMID:11226190
  title: Bus, a bushy Arabidopsis CYP79F1 knockout mutant with abolished synthesis
    of short-chain aliphatic glucosinolates.
  findings:
  - statement: bus1-1f null mutants completely lack short-chain methionine-derived
      glucosinolates and overexpression increases them; N-terminal GFP fusions of CYP79F1
      and CYP79F2 localize to the ER.
    supporting_text: >-
      Short-chain glucosinolates derived from methionine were completely lacking in the
      null mutant and showed increased levels in the overexpressing plant
    reference_section_type: ABSTRACT
  - statement: The bushy phenotype is attributed to altered methionine-derived intermediates
      or to increased indole glucosinolates/IAA, i.e. indirect effects of the metabolic block.
    supporting_text: >-
      The bus phenotype may result from either an altered content of methionine-derived
      glucosinolates and their biosynthetic intermediates or from an increase of indolyl
      glucosinolates and IAA concentrations.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; source of IDA ER localization and genetic evidence.
- id: PMID:12609033
  title: CYP79F1 and CYP79F2 have distinct functions in the biosynthesis of aliphatic
    glucosinolates in Arabidopsis.
  findings:
  - statement: CYP79F1 metabolizes mono- to hexahomomethionine whereas CYP79F2 only
      metabolizes penta- and hexahomomethionine; cyp79f1 knockout lacks short-chain
      aliphatic glucosinolates.
    supporting_text: >-
      we show that CYP79F1 metabolizes mono- to hexahomomethionine, resulting in both
      short- and long-chain aliphatic glucosinolates.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source of IDA and IMP annotations; abstract only in cache.
- id: PMID:15194821
  title: Functional analysis of the tandem-duplicated P450 genes SPS/BUS/CYP79F1 and
    CYP79F2 in glucosinolate biosynthesis and plant development by Ds transposition-generated
