id: Q949U1
gene_symbol: CYP79F1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: CYP79F1 (BUS1/SPS/SUPERSHOOT; dihomomethionine N-hydroxylase) is an endoplasmic reticulum
  membrane-anchored cytochrome P450 monooxygenase that catalyzes the entry step of core structure formation
  in methionine-derived (aliphatic) glucosinolate biosynthesis. Using O2 and electrons from NADPH-cytochrome
  P450 reductase, it performs two successive N-hydroxylations of chain-elongated methionine homologues,
  followed by dehydration and decarboxylation, to yield the corresponding omega-(methylthio)alkanaldoximes
  (EC 1.14.14.42). CYP79F1 has a broad chain-length range, converting mono- to hexahomomethionine, but
  is the main or only enzyme for the short-chain homologues (di- and trihomomethionine) that give rise
  to the predominant leaf glucosinolates 4-methylthiobutyl and 4-methylsulfinylbutyl glucosinolate; its
  tandem paralog CYP79F2 is restricted to long-chain substrates. CYP79F1 is expressed in vascular tissue
  of cotyledons, leaves, stems and siliques and is induced by methyl jasmonate. Null mutants lack short-chain
  aliphatic glucosinolates and, together with cyp79f2, abolish aliphatic glucosinolate synthesis. The
  striking bushy/supershoot phenotype of cyp79f1 mutants (loss of apical dominance, shoot overproliferation,
  altered auxin/cytokinin levels) accompanies altered glucosinolate and hormone metabolism; these phenotypes
  do not make CYP79F1 a dedicated developmental regulator.
