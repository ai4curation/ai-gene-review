id: O80931
gene_symbol: AS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ASYMMETRIC LEAVES1 (AS1, MYB91, PHAN ortholog) is a nuclear R2R3-type MYB-domain transcriptional regulator
  of Arabidopsis, orthologous to Antirrhinum PHANTASTICA and maize ROUGH SHEATH2. Expressed in leaf founder cells
  and organ primordia, AS1 heterodimerizes with the LOB-domain protein AS2 (LBD6); the AS1-AS2 complex, but neither
  protein alone, binds paired cis-motifs (CWGTTD and KMKTTGAHW) in the promoters of the class I KNOX genes BREVIPEDICELLUS/KNAT1
  and KNAT2, and also occupies KNATM. Together with the histone deacetylase HDA6 and the histone chaperone HIRA
  it establishes a stable, repressive chromatin state at these loci, confining KNOX expression to the shoot apical
  meristem and allowing leaf determinacy and differentiation. AS1-AS2 also repress abaxial determinants (ETT/ARF3,
  ARF4, KAN2, YAB5) to promote adaxial leaf identity, act with auxin in leaf initiation and shape, and function
  as a lateral factor in fruit mediolateral patterning. Outside development, AS1 associates with CONSTANS and binds
  the FT promoter to promote photoperiodic flowering, damps jasmonate-dependent resistance to necrotrophic fungi
  while promoting defense against bacteria (an AS2-independent role), and is targeted by the geminivirus betaC1
  pathogenicity protein. AS1 homodimerizes through a conserved C-terminal domain and is found in the nucleoplasm,
  nucleolus-associated bodies and on mitotic chromosomes.
