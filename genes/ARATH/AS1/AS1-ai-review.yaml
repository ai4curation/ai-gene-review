core_functions:
- description: As the MYB-domain partner of the AS1-AS2 heterodimer, AS1 contributes to sequence-specific DNA-binding
    transcription factor activity at paired CWGTTD/KMKTTGAHW motifs in class I KNOX promoters (BP/KNAT1, KNAT2,
    KNATM), recruiting HDA6 and HIRA to repress KNOX and abaxial genes in leaf primordia, which underlies leaf morphogenesis
    and adaxial-abaxial polarity. AS1 alone does not bind DNA in vitro.
  contributes_to_molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:18203921
    supporting_text: When translated separately, neither AS1 nor AS2 was able to bind fragment X in vitro
  - reference_id: PMID:18203921
    supporting_text: AS1 and AS2 form a repressor complex that binds directly to the regulatory motifs CWGTTD and
      KMKTTGAHW present at two sites in the promoters of the KNOX genes BREVIPEDICELLUS ( BP ) and KNAT2
  - reference_id: PMID:23271976
    supporting_text: Chromatin immunoprecipitation assays revealed that HDA6 and AS1 bound directly to KNAT1, KNAT2,
      and KNATM chromatin
  - reference_id: PMID:27334696
    supporting_text: the epigenetic repressor complex of ASYMMETRIC-LEAVES1 (AS1) and AS2 (AS1-AS2) is critical
      to repress abaxial (ventral) genes ETT/ARF3 and ARF4
- description: In the phloem, AS1 forms a complex with CONSTANS and binds the FT promoter, contributing to transcriptional
    activation of FT and photoperiodic flowering.
  contributes_to_molecular_function:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  directly_involved_in:
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:21950734
    supporting_text: Moreover, AS1 bound directly to the specific regions of the FT promoter in vivo.
  - reference_id: PMID:21950734
    supporting_text: These results indicate that CO forms a functional complex with AS1 to regulate FT expression
suggested_questions:
- question: Does AS1 contact DNA directly through its diverged R2R3 MYB domain within the AS1-AS2 heterodimer (motif
    I, CWGTTD), with AS2 recognising motif II, or does AS2 provide all base-specific contacts?
- question: Should GO represent the AS1-AS2 heterodimer as a named transcription regulator complex so that the shared
    DNA-binding activity can be attributed with contributes_to to each subunit?
- question: Are the high-throughput Y1H promoter hits for AS1 (glucosinolate, secondary cell wall, nitrogen and
    vascular genes) bound in planta, and do they depend on AS2?
- question: Which partner (CO, or another factor) supplies DNA specificity when AS1 binds the FT promoter independently
    of AS2?
suggested_experiments:
- experiment_type: EMSA / structural biology
  hypothesis: Motif I is contacted by the AS1 MYB domain and motif II by the AS2 LOB domain within the heterodimer.
  description: Determine a structure or perform EMSA with AS1 MYB-domain point mutants (R3 helix residues) co-expressed
    with AS2 on motif I/II variants.
- experiment_type: ChIP-seq
  hypothesis: AS1 genome-wide occupancy is largely AS2-dependent at developmental targets but AS2-independent at
    JA-responsive and FT promoters.
  description: Compare AS1 ChIP-seq in wild type, as2 and co mutants in seedlings and in leaf primordia.
