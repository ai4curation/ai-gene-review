  review:
    summary: Phylogenetic inference that AS1 binds transcription cis-regulatory regions.
    action: ACCEPT
    reason: 'Consistent with experimental data on AS1 itself: the AS1-AS2 complex binds defined motifs in the BP
      and KNAT2 promoters (EMSA, ChIP) and AS1 occupies KNAT1, KNAT2, KNATM and FT promoters in vivo. Binding requires
      AS2, so in core_functions this is recorded as contributes_to. The IBA family-level placement (PTN005337045,
      PHAN/RS2/AS1 clade) is sound; AS1 appearing in its own With/From reflects its own experimental grounding.'
    supported_by:
    - &id002
      reference_id: PMID:18203921
      supporting_text: AS1 and AS2 form a repressor complex that binds directly to the regulatory motifs CWGTTD
        and KMKTTGAHW present at two sites in the promoters of the KNOX genes BREVIPEDICELLUS ( BP ) and KNAT2
    - &id003
      reference_id: PMID:18203921
      supporting_text: However, when AS1 and AS2 were cotranslated, these proteins were able to bind as a complex
        to site X of the BP promoter
    - &id006
      reference_id: PMID:23271976
      supporting_text: Chromatin immunoprecipitation assays revealed that HDA6 and AS1 bound directly to KNAT1,
        KNAT2, and KNATM chromatin
    - &id004
