  evidence_type: IPI
  original_reference_id: PMID:25352272
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT3G49680
  review:
    summary: High-throughput yeast one-hybrid hit of AS1 on a non-developmental promoter.
    action: ACCEPT
    reason: High-throughput (e)Y1H screen in which an AS1-GAL4 activation-domain fusion activated a reporter driven
      by a promoter outside AS1's characterised regulon. The claim made by the term (AS1 binds transcription cis-regulatory
      regions) is well established for AS1 as part of the AS1-AS2 complex at KNOX promoters (ChIP, EMSA) and at
      the FT promoter, so the row is accepted for the term; the particular target reported here is unvalidated,
