id: P27900
gene_symbol: GL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GLABRA1 (GL1/AtMYB0) is a nuclear R2R3-MYB transcription factor that specifies shoot
  epidermal trichome fate in Arabidopsis. With GL3/EGL3 bHLH partners and the WD40 protein TTG1, GL1
  activates developmental regulators including GL2 and TTG2 and mobile R3-MYB inhibitors including
  CPC and ETC1, coupling trichome differentiation to spacing. DELLA and JAZ repressors modulate this
  transcriptional module in response to gibberellin and jasmonate.
