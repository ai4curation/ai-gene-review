- term:
    id: GO:0051707
    label: response to other organism
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00029118
  review:
    summary: ARBA machine-learning transfer of the broad biotic-response term.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      MYB34 contributes indirectly to antimicrobial and anti-herbivore defence by
      supporting indolic glucosinolate production. The myb34 myb51 myb122 triple mutant
      is more susceptible to Plectosphaerella cucumerina (PMID:26802248). MYB34 itself
      is not a pathogen-responsive gene. In a single-cell atlas of Colletotrichum
      higginsianum infection, only MYB51 and MYB122 among the three indolic regulators
