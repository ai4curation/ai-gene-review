    - reference_id: PMID:26379682
      supporting_text: However, the expression of MYB34 was reduced, indicating that it
        plays a less important role in phytoalexin regulation.
    - reference_id: PMID:17461791
      supporting_text: Mechanical stimuli such as touch or wounding transiently induced
