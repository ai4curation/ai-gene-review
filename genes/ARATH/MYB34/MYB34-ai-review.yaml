- id: PMID:15579661
  title: The Arabidopsis ATR1 Myb transcription factor controls indolic glucosinolate
    homeostasis.
  findings:
  - statement: atr1-2 loss of function lowers CYP79B2/B3/CYP83B1 transcripts and
      indolic glucosinolates (about 20%) in adult leaves; overexpression raises
      indolic glucosinolates and IAA.
    supporting_text: Correspondingly, IG measurements showed approximately 20% reduced
      IG accumulation in atr1-2 adult leaves
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; key loss- and gain-of-function characterization
      of ATR1/MYB34.
