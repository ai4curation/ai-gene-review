- id: PMID:24431192
  title: MYB34, MYB51, and MYB122 distinctly regulate indolic glucosinolate biosynthesis
    in Arabidopsis thaliana.
  findings:
  - statement: MYB34 controls indolic glucosinolates mainly in roots and under ABA/JA
      signalling; the triple myb34 myb51 myb122 mutant lacks indolic glucosinolates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache; PubMed-verified metadata.
- id: PMID:23943862
  title: Arabidopsis basic helix-loop-helix transcription factors MYC2, MYC3, and MYC4
    regulate glucosinolate biosynthesis, insect performance, and feeding behavior.
  findings:
  - statement: MYC2/3/4 interact directly with glucosinolate-related MYBs including
      MYB34 and are required for glucosinolate gene activation.
- id: PMID:23580754
  title: BZR1 and BES1 participate in regulation of glucosinolate biosynthesis by
    brassinosteroids in Arabidopsis.
  findings:
  - statement: Brassinosteroid repression of glucosinolate levels is lost in myb34
      mutants.
- id: PMID:26802248
  title: Regulation of Pathogen-Triggered Tryptophan Metabolism in Arabidopsis thaliana
    by MYB Transcription Factors and Indole Glucosinolate Conversion Products.
  findings:
  - statement: myb34/51/122 triple mutant is more susceptible to Plectosphaerella
      cucumerina through loss of indolic glucosinolates.
- id: PMID:25049362
  title: bHLH05 is an interaction partner of MYB51 and a novel regulator of glucosinolate
    biosynthesis in Arabidopsis.
  findings:
  - statement: MYB34 interacts with bHLH04 and bHLH05 (BiFC, LUMIER); MYB34-1D combined
      with bHLH05D94N gives about 20-fold more indolic glucosinolates.
    supporting_text: Furthermore, we have uncovered the interactions of MYB34, MYB122,
      MYB28, and MYB29 with both bHLH05 and bHLH04 using BiFC
- id: PMID:37741284
  title: Cell-type-specific responses to fungal infection in plants revealed by
    single-cell transcriptomics.
  findings:
  - statement: Of the three indolic glucosinolate MYB regulators, only MYB51 (vasculature)
      and MYB122 (epidermis) were induced at C. higginsianum infection sites; MYB34
      was not.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached abstract only; MYB34 statement verified against the full-text
      PDF (Results section on Figure 6) supplied by the user.
- id: PMID:24368794
  title: Arabidopsis phosphoglycerate dehydrogenase1 of the phosphoserine pathway is
    essential for development and required for ammonium assimilation and tryptophan
    biosynthesis.
  findings:
  - statement: PGDH1 and PSAT1 expression is regulated by MYB51 and MYB34, linking the
      phosphoserine pathway to tryptophan biosynthesis.
- id: PMID:31776183
  title: Brassinosteroids Antagonize Jasmonate-Activated Plant Defense Responses through
    BRI1-EMS-SUPPRESSOR1 (BES1).
  findings:
  - statement: BES1 interacts with MYB34, MYB51 and MYB122 and suppresses CYP79B3 and
      UGT74B1 expression, reducing herbivory-induced indolic glucosinolates.
    supporting_text: BES1 inhibited biosynthesis of the JA-induced insect defense-related
      metabolite indolic glucosinolate by interacting with transcription factors MYB
      DOMAIN PROTEIN34 (MYB34), MYB51, and MYB122
- id: PMID:26379682
  title: The role of MYB34, MYB51 and MYB122 in the regulation of camalexin biosynthesis
    in Arabidopsis thaliana.
  findings:
  - statement: MYB34 trans-activates the CYP79B2 promoter but not the camalexin-specific
      CYP71B15/CYP71A13 promoters. Unlike MYB51 and MYB122, it is not induced by AgNO3
      or wounding. It affects camalexin only indirectly, through the supply of IAOx.
    supporting_text: However, the expression of MYB34 was reduced, indicating that it
      plays a less important role in phytoalexin regulation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; direct MYB34 trans-activation and expression data.
- id: PMID:17461791
  title: The transcription factor HIG1/MYB51 regulates indolic glucosinolate biosynthesis
    in Arabidopsis thaliana.
  findings:
  - statement: ATR1/MYB34 overexpression partially rescues hig1-1 (myb51) and causes a
      high-auxin phenotype; touch and wounding induce MYB51 but not MYB34.
    supporting_text: Mechanical stimuli such as touch or wounding transiently induced
      the expression of HIG1/MYB51 but not of ATR1/MYB34
