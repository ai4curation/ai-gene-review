- term:
    id: GO:0002213
    label: defense response to insect
  evidence_type: IMP
  original_reference_id: PMID:18346197
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      The atr1D overexpression mutant overproduces indole glucosinolates and is more
      resistant to green peach aphid (Myzus persicae). The defensive effect comes from
      post-ingestive breakdown products of indole glucosinolates.
    action: KEEP_AS_NON_CORE
    reason: >-
      The phenotype is a gain-of-function effect that works through MYB34's metabolic
      output, the indole glucosinolates. The defence is carried out by indole
      glucosinolate breakdown products. The acts_upstream_of_or_within qualifier fits
      this indirect relationship. This is a real physiological consequence of MYB34
      activity, but it is downstream and not a core function.
    supported_by:
    - reference_id: PMID:18346197
      supporting_text: A defensive role for indole glucosinolates is suggested by the
        observation that atr1D mutant plants, which overproduce indole glucosinolates,
        are more resistant to M. persicae
