id: O64399
gene_symbol: MYB34
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MYB34 (ALTERED TRYPTOPHAN REGULATION 1, ATR1; At5g60890) is a nuclear R2R3-MYB
  transcription factor of subgroup 12, the small clade that also contains the
  aliphatic glucosinolate regulators MYB28, MYB29 and MYB76 and its two indolic
  paralogs MYB51 and MYB122. Its two N-terminal Myb-type HTH repeats bind promoter
  DNA, and MYB34 acts as a transcriptional activator of tryptophan-pathway and
  indolic glucosinolate biosynthetic genes, most strongly the tryptophan-metabolizing
  genes CYP79B2, CYP79B3 and CYP83B1, and more modestly the tryptophan synthesis genes
  ASA1 and TSB1. It was identified through the dominant atr1D allele, which disrupts
  an upstream ORF in the 5' leader and causes overexpression, raising indolic
  glucosinolate levels about ten-fold and also elevating free IAA. Loss-of-function
  mutants have no visible phenotype but contain modestly reduced indolic glucosinolates,
  and the myb34 myb51 myb122 triple mutant contains no detectable indolic
  glucosinolates. Among the three paralogs, MYB34 controls indolic glucosinolate
  production mainly in roots and young seedlings, and acts mainly under abscisic acid
  and jasmonate signalling, whereas MYB51 dominates in shoots and under salicylic acid
  and ethylene signalling. MYB34 forms complexes with the jasmonate-regulated bHLH
  factors MYC2, MYC3, MYC4 (bHLH04/05/06), which are required for glucosinolate gene
  activation. Its outputs, indolic glucosinolates and their PEN2-dependent breakdown
  products, contribute to defence against aphids and fungal pathogens. Unlike MYB51
  and MYB122, MYB34 is not transcriptionally induced in leaf cells at sites of
  Colletotrichum higginsianum infection.
existing_annotations:
- term:
    id: GO:0000162
    label: L-tryptophan biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:9576939
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Based on the dominant atr1D allele, which overexpresses ATR1/MYB34 and increases
      transcription of ASA1, the gene encoding the first and rate-limiting enzyme of
      tryptophan synthesis. MYB34 is a transcription factor that activates
      tryptophan-pathway genes. It does not carry out any enzymatic step of tryptophan
      biosynthesis.
    action: MODIFY
    reason: >-
      A transcription factor that raises expression of ASA1 (and, more weakly, TSB1)
      regulates tryptophan biosynthesis. It does not take part in the biosynthetic
      process itself. The phenotype comes from a gain-of-function allele. In atr1-2
      loss-of-function mutants, Trp synthesis gene transcripts were not significantly
      changed in seedlings or adult leaves (PMID:15579661), so the Trp-synthesis effect
      is modest and partly redundant. GO has no tryptophan-specific regulation term.
      The closest existing term is positive regulation of amino acid biosynthetic
      process.
    proposed_replacement_terms:
    - id: GO:2000284
      label: positive regulation of amino acid biosynthetic process
    supported_by:
    - reference_id: PMID:9576939
      supporting_text: ATR1 encodes a Myb-like transcription factor that modulates ASA1
        expression.
    - reference_id: PMID:15579661
      supporting_text: Steady-state transcript levels of the primary Trp synthesis genes
        ASA1 and TSB1 were not significantly different between wild-type and atr1-2
        adult leaves
