- term:
    id: GO:0010439
    label: regulation of glucosinolate biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:24431192
  review:
    summary: >-
      Analysis of myb34 single, myb34 myb51 double and myb34 myb51 myb122 triple
      mutants shows that MYB34 regulates indolic glucosinolate biosynthesis, mainly in
      roots and under ABA/JA signalling. In the absence of all three MYBs, no indolic
      glucosinolates are made.
    action: NEW
    reason: >-
      This is the correct process term for MYB34's core role, and it matches the MODIFY
      replacement for the indole glucosinolate biosynthetic process row. It passes the
      participation test for a regulation term: MYB34 binds and activates promoters of
      the biosynthetic genes. The best-characterized regulators carry the equivalent
      term, so this keeps MYB34 consistent with them.
    supported_by:
    - reference_id: PMID:24431192
      supporting_text: MYB34 controlling biosynthesis of IGs mainly in the roots
    - reference_id: PMID:24431192
      supporting_text: MYB34 is the key regulator upon ABA and JA signaling
    - reference_id: PMID:15579661
      supporting_text: this work implicates ATR1 as a key homeostatic regulator of Trp
        metabolism
