core_functions:
- description: >-
    Nuclear R2R3-MYB transcriptional activator that binds promoters of
    tryptophan-pathway and indolic glucosinolate biosynthetic genes (CYP79B2, CYP79B3,
    CYP83B1, and more weakly ASA1 and TSB1) and activates their expression. It acts
    with bHLH IIIe partners (MYC2/3/4) and redundantly with MYB51 and MYB122, and is the
    main indolic glucosinolate regulator in roots and under ABA/JA signalling.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0010439
    label: regulation of glucosinolate biosynthetic process
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15579661
    supporting_text: The simplest model is that ATR1 serves as a direct transcriptional
      activator of both Trp synthesis genes and Trp secondary metabolism genes
  - reference_id: PMID:23580754
    supporting_text: MYB34, MYB51, and MYB122, identified as regulators of the indolic
      glucosinolate biosynthetic pathway, exclusively trans-activate the promoters of
      TSB1, CYP79B2, and CYP79B3
  - reference_id: PMID:24431192
    supporting_text: The myb34 myb51 myb122 triple mutant is devoid of IGs, indicating
      that these three MYB factors are indispensable for IG production under standard
      growth conditions.
  - reference_id: PMID:26379682
    supporting_text: The activity of pCYP79B2:uidA increased, whereas that of
      pCYP71B15:uidA was not affected by all three MYB factors
proposed_new_terms:
- proposed_name: positive regulation of indole glucosinolate biosynthetic process
  proposed_definition: >-
    Any process that activates or increases the frequency, rate or extent of the
    chemical reactions and pathways resulting in the formation of indole
    glucosinolates.
  justification: >-
    GO has only the generic GO:0010439 regulation of glucosinolate biosynthetic process.
    The R2R3-MYB subgroup 12 regulators are split by substrate class: MYB34, MYB51 and
    MYB122 activate the tryptophan-derived (indolic) branch, while MYB28, MYB29 and MYB76
    activate the methionine-derived (aliphatic) branch. Indole- and aliphatic-specific
    positive-regulation children would capture this well-established distinction.
suggested_questions:
- question: >-
    Does MYB34 bind specific MYB-core cis-elements in the CYP79B2, CYP79B3 and CYP83B1
    promoters in planta (ChIP), and are the aliphatic-pathway promoters bound in Y1H
    screens (FMO GS-OX1, BCAT3) also regulated by MYB34 in vivo?
- question: >-
    Why is MYB34, unlike MYB51 and MYB122, not induced at Colletotrichum higginsianum
    infection sites? Does its predominantly root- and ABA/JA-linked activity reflect a
    division of labour in which MYB34 sets basal or root indolic glucosinolate pools
    while MYB51/MYB122 handle localized pathogen-induced synthesis?
- question: >-
    Should the GO:0010438 sulfur-starvation and GO:0000162 tryptophan biosynthesis
    annotations, which rest on expression change or gain-of-function data, be retracted
    in favour of regulation terms?
suggested_experiments:
- experiment_type: ChIP-seq / DAP-seq
  hypothesis: MYB34 binds directly to promoters of CYP79B2, CYP79B3, CYP83B1 and ASA1.
  description: >-
    Profile genome-wide MYB34 occupancy with an epitope-tagged MYB34 expressed from its
    native promoter in roots, with and without MeJA or ABA treatment, and compare it with
    MYB51 occupancy.
- experiment_type: cell-type-specific genetics
  hypothesis: >-
    MYB34 contributes little to localized antifungal indolic glucosinolate production
    in leaves compared with MYB51 and MYB122.
  description: >-
    Inoculate myb34, myb51, myb122 and higher-order mutants with Colletotrichum
    higginsianum and quantify indolic glucosinolates and their PEN2-dependent products
    at infection sites. Use single-cell or spatial transcriptomics to check whether MYB34
    expression changes in any cell type.
