  review:
    summary: ARBA machine-learning transfer of the very general term response to stress.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The term is too general to be informative. MYB34 regulates indolic glucosinolate
      and tryptophan-pathway gene expression. Its effects on stress, such as defence
      against insects and fungi or ABA/JA-dependent induction of indolic
      glucosinolates, are better captured by the regulation of glucosinolate
      biosynthesis annotation and the specific non-core terms.
- term:
    id: GO:0009759
    label: indole glucosinolate biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:15579661
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      In atr1-2 loss-of-function plants, CYP79B2, CYP79B3 and CYP83B1 transcripts are
      reduced and indolic glucosinolates fall by about 20% in adult leaves.
      Overexpression (atr1D, 35S-ATR1) raises indolic glucosinolate levels, by roughly
      an order of magnitude in atr1D.
    action: MODIFY
    reason: >-
      The evidence is strong, but MYB34 controls indolic glucosinolate biosynthesis by
      activating transcription of the biosynthetic genes. The enzymatic steps are
      carried out by CYP79B2/B3, CYP83B1, SUR1, UGT74B1 and SOT16. Under the
      participation test, a transcription factor gets the regulation term, not the
      biosynthetic process term. GO has no indole-specific regulation term, so the
      replacement is GO:0010439 regulation of glucosinolate biosynthetic process. A
      more specific positive-regulation term for indole glucosinolates is proposed in
      proposed_new_terms. The myb34 myb51 myb122 triple mutant, which lacks indolic
      glucosinolates (PMID:24431192), confirms the regulatory role.
    proposed_replacement_terms:
    - id: GO:0010439
      label: regulation of glucosinolate biosynthetic process
    supported_by:
    - reference_id: PMID:15579661
      supporting_text: However, adult leaves of atr1-2 mutant plants contained reduced
        transcript levels of CYP79B2 , CYP79B3 , and CYP83B1 relative to parental Ws
    - reference_id: PMID:15579661
      supporting_text: Correspondingly, IG measurements showed approximately 20% reduced
        IG accumulation in atr1-2 adult leaves
    - reference_id: PMID:24431192
      supporting_text: The myb34 myb51 myb122 triple mutant is devoid of IGs, indicating
        that these three MYB factors are indispensable for IG production under standard
        growth conditions.
    - reference_id: file:ARATH/MYB34/MYB34-deep-research-falcon.md
      supporting_text: MYB34 is neither a biosynthetic enzyme nor a glucosinolate transporter
- term:
    id: GO:0010438
    label: cellular response to sulfur starvation
  evidence_type: TAS
  original_reference_id: PMID:17420480
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Hirai et al. 2007 report that MYB28, MYB29 and ATR1/MYB34 transcripts are
      down-regulated under sulfur deficiency. The authors suggest this shuts down
      glucosinolate synthesis to save sulfur.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only evidence is that MYB34 expression falls under sulfur starvation. That
      makes MYB34 a responsive gene. It does not show that MYB34 carries out the
      cellular response. No mutant evidence links MYB34 to sulfur-starvation responses,
      and the study's functional work concerned MYB28/MYB29 and aliphatic
      glucosinolates. At most, glucosinolate downregulation under S deficiency is a
      consequence of reduced MYB34 expression.
    supported_by:
    - reference_id: PMID:17420480
      supporting_text: Under sulfur-deficiency conditions, the expression of PMG1 /
        Myb28 , PMG2 / Myb29 , and ATR1 / Myb34 was down-regulated, presumably to shut
        down GSL biosynthesis
