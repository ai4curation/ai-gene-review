  review:
    summary: Ortega-Martinez et al. (Science 2007) show that ethylene modulates quiescent-center
      division in the post-embryonic root stem-cell niche; the ctr1 loss-of-function mutant, with
      constitutive ethylene signalling, phenocopies the extra QC divisions of the
      ethylene-overproducing eto1 mutant.
    action: KEEP_AS_NON_CORE
    reason: The cached PMID:17656722 entry is abstract-only (Science; no open-access copy) and
      establishes the ethylene effect on QC division without naming ctr1. The CTR1-specific
      phenotype underlying the IMP is recorded in the reference_review of PMID:17656722 - it is
      reported by an independent review of this work (PMID:23183258, Lee et al. 2013 J Exp Bot,
      read from the publisher full text; its cache entry is also abstract-only) as "the mutant of
      CONSTITUTIVE TRIPLE RESPONSE 1 (CTR1), a negative regulator of ethylene action, phenocopied the
      eto1 mutant". This is a downstream developmental output of CTR1's negative control of ethylene
      signalling, not its core kinase function.
    supported_by:
