core_functions:
- description: Hydrolysis of the inactive storage conjugate abscisic acid glucose ester to release
    free, active ABA in the ER lumen, activated by dehydration-induced polymerisation and
    redistribution from ER bodies, providing a rapid source of ABA for stress responses.
  molecular_function:
    id: GO:0051993
    label: abscisic acid glucose ester beta-glucosidase activity
  directly_involved_in:
  - id: GO:0009687
    label: abscisic acid metabolic process
  locations:
  - id: GO:0005788
    label: endoplasmic reticulum lumen
  - id: GO:0010168
    label: ER body
  supported_by:
  - reference_id: PMID:16990135
    supporting_text: Here we report that AtBG1, a beta-glucosidase, hydrolyzes glucose-conjugated,
      biologically inactive ABA to produce active ABA.
  - reference_id: PMID:31761937
    supporting_text: Collectively, these results uncover a direct relationship between ER body number
      and BGLU18-mediated ABA-GE hydrolysis activity.
  - reference_id: file:ARATH/BGLU18/BGLU18-uniprot.txt
    record_section: ["FT:MUTAGEN"]
    supporting_text: 'E->Q: Loss of activity towards ABA-GE.'
suggested_questions:
- question: Does purified BGLU18 hydrolyse 4-methoxyindol-3-ylmethyl glucosinolate or other
    glucosinolates, or is the 4MI3G defect of bglu18 pyk10 attributable to PYK10 alone?
- question: Is the With/From partner AT1G54200 on the identical protein binding row (PMID:16990135)
    a transposition of AT1G52400?
- question: How does ABA-GE, which is stored mainly in the vacuole and apoplast, reach BGLU18 in the
    ER lumen under dehydration?
suggested_experiments:
- hypothesis: BGLU18 has intrinsic thioglucosidase (myrosinase) activity on 4MI3G.
  description: Express and purify BGLU18 and PYK10 separately and measure kinetics on ABA-GE,
    4MI3G and glucobrassicin; compare bglu18 and pyk10 single mutants for 4MI3G breakdown in leaf
    homogenates.
- hypothesis: Polymerisation is required for stress activation of BGLU18 in planta.
  description: Identify interface residues needed for polymerisation and test non-polymerising
    variants for ABA-GE hydrolysis and dehydration-induced ABA accumulation in bglu18 complemented
    lines.
