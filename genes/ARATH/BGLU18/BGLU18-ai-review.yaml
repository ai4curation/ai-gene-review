id: Q9SE50
gene_symbol: BGLU18
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  BGLU18 (AtBG1, BGL1; At1g52400) is a glycoside hydrolase family 1 beta-glucosidase of
  Arabidopsis thaliana with an N-terminal signal peptide and a C-terminal ER-retention motif.
  It is retained in the lumen of the endoplasmic reticulum and is the main cargo of the wound-
  and jasmonate-inducible ER bodies and, together with PYK10/BGLU23, of the leaf ER bodies of
  rosette leaves. Its best-characterised activity is hydrolysis of the inactive storage conjugate
  abscisic acid glucose ester (ABA-GE) to free, active ABA. Dehydration triggers polymerisation of
  the enzyme into higher-order, more active forms and shifts it from ER bodies into the general ER,
  giving a rapid route to ABA that complements de novo biosynthesis. Loss of BGLU18 lowers ABA
  levels and impairs stomatal closure, germination control and tolerance of drought and salt stress.
  BGLU18 is also needed to form wound-inducible ER bodies, and with PYK10 it is required to
  hydrolyse the indole glucosinolate 4-methoxyindol-3-ylmethyl glucosinolate in damaged leaves,
  which points to a second role in ER-body-based chemical defence against herbivores.
