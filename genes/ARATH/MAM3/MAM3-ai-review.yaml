- term:
    id: GO:0009098
    label: L-leucine biosynthetic process
  evidence_type: TAS
  original_reference_id: PMID:12432038
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Traceable author statement from Junk & Mourad (2002) assigning the IPMS-family gene to
      leucine biosynthesis. MAM3 has only low IPMS activity (at least 40-fold below IPMS1/IPMS2);
      its in planta role is glucosinolate chain elongation, and Leu biosynthesis is carried
      out by IPMS1/IPMS2.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      No in planta evidence that MAM3 contributes to Leu biosynthesis; the assignment rests
      on family membership and heterologous complementation. Not removed outright because a
      minor contribution cannot be excluded (it has not been tested in an ipms1 ipms2 background).
    supported_by:
    - reference_id: PMID:17369439
      supporting_text: >-
        However, because the specific activity of the IPMSs for 2-oxoisovalerate is at least
        40 times higher than those of MAM3, it appears very unlikely that this enzyme is active
        as IPMS under normal growth conditions
    - reference_id: PMID:17369439
      supporting_text: However, it is not clear if MAM3 participates in Leu biosynthesis in
        planta.
