  - UniProtKB:P15875
  - UniProtKB:Q8F445
  - UniProtKB:Q8F8T4
  - UniProtKB:Q9JZG1
  review:
    summary: >-
      PAINT IBA transferring IPMS activity from the ancestral IPMS node (PTN000031336). MAM3
      retains this ancestral activity at a low level: recombinant MAM3 converts 2-oxoisovalerate
      to isopropylmalate and complements IPMS-deficient E. coli at 28 C, although its Met-derived
      2-oxo acids are strongly preferred.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBA is not wrong for MAM3 - there is target-specific experimental evidence that the
      ancestral activity is retained - but it is a residual promiscuous activity rather than
      MAM3 core function, and MAM3 is considered unlikely to act as an IPMS in planta.
    supported_by:
    - reference_id: PMID:17369439
      supporting_text: >-
        MAM3 was able to convert 2-oxoisovalerate (to isopropylmalate) and pyruvate (to citramalate),
        but based on their kinetic parameters, these were less preferred substrates than the
        Met-derived 2-oxo acids involved in glucosinolate formation
    - reference_id: PMID:17369439
      supporting_text: >-
        Hence, the Arabidopsis MAM3 was able to complement the mutant in the gene encoding IPMS
        and restored autotrophic growth.
    - reference_id: PMID:17369439
      supporting_text: >-
        However, because the specific activity of the IPMSs for 2-oxoisovalerate is at least
        40 times higher than those of MAM3, it appears very unlikely that this enzyme is active
        as IPMS under normal growth conditions
