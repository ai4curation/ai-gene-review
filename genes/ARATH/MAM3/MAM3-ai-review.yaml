core_functions:
- description: >-
    Chloroplast methylthioalkylmalate synthase with broad chain-length specificity that catalyzes
    the committed acetyl-CoA condensation of all rounds of methionine chain elongation, generating
    the full range (C3-C8) and especially the long-chain aliphatic glucosinolates.
