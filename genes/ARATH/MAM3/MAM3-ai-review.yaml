id: Q9FN52
gene_symbol: MAM3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MAM3 (METHYLTHIOALKYLMALATE SYNTHASE 3, formerly MAM-L; At5g23020) is a chloroplast-localized
  2-oxo-acid/acetyl-CoA condensing enzyme of the isopropylmalate synthase (LeuA-like) family
  that catalyzes the committed condensation step of the methionine chain-elongation cycle in
  aliphatic glucosinolate biosynthesis. Unlike MAM1, which handles only the first two cycles,
  MAM3 accepts all six omega-methylthio-2-oxoalkanoates (C4 to C9 2-oxo acids) used in Arabidopsis
  and is therefore the principal generator of long-chain (C6-C8) aliphatic glucosinolates and
  of glucosinolate chain-length diversity; MAM3 loss-of-function mutants lack or are strongly
  depleted in long-chain glucosinolates, and the defect is complemented by MAM3. MAM3 has broad
  substrate promiscuity, also condensing 2-oxoisovalerate (isopropylmalate synthase activity),
  pyruvate (citramalate), phenylpyruvate and the 2-oxo acids of leucine/isoleucine elongation,
  and can weakly complement an IPMS-deficient E. coli strain, but its IPMS activity is far below
  that of the dedicated IPMS1/IPMS2 enzymes and it is not thought to contribute materially to
  leucine biosynthesis. It requires a divalent metal ion and, in contrast to MAM1, is not activated
  by ATP.
