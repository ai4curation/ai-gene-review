suggested_questions:
- question: >-
    What structural features give MAM3 its broad acceptance of long omega-methylthio-2-oxo acids
    compared with MAM1, and how does competition between MAM3 and the downstream CYP79F1/F2
    for each chain-length intermediate set the final glucosinolate profile?
- question: >-
    Does MAM3 contribute measurably to leucine or citramalate formation in planta, e.g. in ipms1
    ipms2 backgrounds?
suggested_experiments:
- description: >-
    Test whether MAM3 supports Leu synthesis in vivo by combining mam3 with ipms1 ipms2 mutations
    (or by expressing MAM3 in an ipms1 ipms2 background) and measuring Leu, isopropylmalate
    and citramalate pools.
- description: >-
    Engineer MAM3 active-site variants guided by the Brassica juncea MAM structure and express
    them in mam3 plants to shift glucosinolate chain-length profiles, relevant to tuning glucosinolate
    content of oilseed Brassicaceae.
