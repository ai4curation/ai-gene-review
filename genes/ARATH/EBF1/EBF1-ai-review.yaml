suggested_questions:
- question: What residues or degrons in EIN3/EIL1 does the EBF1 LRR domain recognize, and is recognition
    regulated by phosphorylation or other modifications?
- question: What E3 or other mechanism drives the ethylene-induced proteasomal turnover of EBF1 itself?
suggested_experiments:
- description: Map the EBF1-EIN3 interface by structural analysis (cryo-EM or crystallography of the EBF1
    LRR with EIN3 degron peptides) and test interface mutants for EIN3 stabilization in planta.
