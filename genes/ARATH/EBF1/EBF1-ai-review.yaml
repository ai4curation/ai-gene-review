  review:
    summary: The interactor is recorded as P43291 (SRK2A/SnRK2.4), whose UniProt synonyms include 'ASK1'.
      The Cell 2003 EBF1 papers study EBF1 binding to the SKP1-like ASK1 (SKP1A, Q39255) as part of SCF
      assembly; the SnRK2 kinase is not discussed in the abstracts, so this row may reflect an identifier
      mapping between the two 'ASK1' names.
