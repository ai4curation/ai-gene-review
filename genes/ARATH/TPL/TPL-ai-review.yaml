core_functions:
- description: >-
    Groucho/Tup1-type transcriptional co-repressor. TPL is recruited via its TOPLESS domain
    by EAR-motif repressors and adaptors, including Aux/IAAs in auxin signalling, and represses
    target genes through Mediator binding and histone deacetylase recruitment.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  - id: GO:0009733
    label: response to auxin
  - id: GO:0009867
    label: jasmonic acid mediated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id001
  - *id011
  - *id012
  - *id002
  - *id004
suggested_questions:
- question: >-
    TPL is involved in auxin-activated signaling as the co-repressor bound by Aux/IAAs; should
    GO capture this as auxin-activated signaling pathway (GO:0009734) rather than only response
    to auxin, as for Aux/IAAs?
- question: >-
    To what extent do TPL tetramerization, Mediator binding and HDA19 recruitment contribute
    separately to repression at auxin-responsive versus jasmonate-responsive loci?
suggested_experiments:
- description: >-
    Use TPL variants defective in Mediator binding (CRA helix 8) or HDA19 association in a
    tpl tpr quintuple-mutant background to test which repression mechanism is required at
    ARF-bound auxin-responsive promoters.
  hypothesis: >-
    Repression of ARF targets by Aux/IAA-TPL relies predominantly on Mediator engagement rather
    than histone deacetylation.
