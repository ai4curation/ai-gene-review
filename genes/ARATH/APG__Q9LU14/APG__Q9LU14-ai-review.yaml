  review:
    summary: >-
      The sound IBD at PTN005219546, with two experimentally grounded esterase
      seeds and an intact SGNH catalytic triad in this sequence. The core molecular
      function, at the only granularity the evidence allows.
    action: ACCEPT
    reason: >-
      Unlike the GO:0008610 IBD at the same node, this one is seeded by measured
      catalysis - EstA's surface esterase activity on short-chain p-nitrophenyl
      esters, with a known KM, and ChoE/PA4921's cholinesterase IDA - and ester
      hydrolysis is the conserved chemistry of the SGNH/GDSL fold across the whole
      clade, bacterial and plant. This sequence retains the fold and the complete
      triad (Ser37 nucleophile, Asp328, His331) and matches Pfam PF00657 and CDD
      cd01837. The term is kept at this level deliberately, because no substrate
      has ever been assayed for AT3G16370, so no descendant (lipase, cutinase,
      acylhydrolase, thioesterase) is warranted and GO:0052689 is as precise as the
      evidence supports.
