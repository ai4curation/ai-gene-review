        leaf IBAs in 48 taxa, overwhelmingly plant GELPs. One correction to the
        estA report is needed, because the clade is not entirely without
        biosynthetic evidence - OSP1/AT2G04570 (Q9SJB4) is a leaf of this node and
        is experimentally required for cuticular wax biosynthesis (PMID:32542680).
        That evidence is angiosperm-specific, is not what the seed asserts, and
