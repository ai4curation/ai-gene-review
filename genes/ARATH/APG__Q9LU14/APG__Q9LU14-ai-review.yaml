        comment: >-
          LUCA node, 960 leaves. The sole seed for the GO:0008610 IBD is
          P. aeruginosa EstA, whose supporting row is a rhamnolipid-deficient
          deletion phenotype of unknown mechanism, so a bacterial necessity
          phenotype is projected across the prokaryote/plant boundary.
      - source_id: UniProtKB:O33407
        source_label: estA (P. aeruginosa PAO1)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The seed's GO:0008610 IMP (PMID:17631636) records that an estA mutant
          makes little rhamnolipid; UniProt itself states that the role of EstA in
          these processes is unclear.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN005219546
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0008610
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        Reported from the leaf side as a test of the same node-level defect raised
        in genes/PSEAE/estA. The GO:0008610 lipid biosynthetic process IBD at
        PTN005219546 (PTHR45642) is placed at a LUCA SPECIATION node with 960
        leaves and has one seed, UniProtKB:O33407 (EstA), whose evidence is an estA
        deletion producing little rhamnolipid. Checked on two Arabidopsis leaves,
        APG/AT3G16370 (Q9LU14) and AT5G03810 (Q9FFN0). Neither has any
        experimental function annotation, neither appears in any functional study,
        and TAIR has recorded a biological_process ND on Q9FFN0, a curator
