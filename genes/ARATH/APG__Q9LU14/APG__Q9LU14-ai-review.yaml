  findings:
  - statement: >-
      AT3G16370 is GGL19/AtGELP67. Its promoter is active in cotyledons, roots,
      pavement and mesophyll cells as well as guard cells, trichomes, filaments,
      sepals and siliques. The study reports expression only for this gene - GGL19
      was not among the 13 GGLs whose localisation was tested, nor among the
      mutants phenotyped.
    supporting_text: >-
