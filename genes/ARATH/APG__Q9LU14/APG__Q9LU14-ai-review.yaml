- id: PMID:33686223
  title: GDSL-domain proteins have key roles in suberin polymerization and degradation.
  findings:
  - statement: >-
      Five auxin-repressed Arabidopsis GELPs (GELP22/AT1G54000, GELP38/AT1G74460,
      GELP49/AT2G19050, GELP51/AT2G23540 and GELP96/AT5G37690) are redundantly
      required for root suberin synthesis, the quintuple mutant losing about 85
      percent of suberin monomers. All five belong to PANTHER families PTHR45966,
      PTHR45648 and PTHR45650 rather than PTHR45642, and none of them carries a
      GO:0008610 IBA, so they lie outside the clade under review.
    supporting_text: >-
      One is required for suberin synthesis, while the other can drive suberin
      degradation.
    reference_section_type: ABSTRACT
  reference_review:
