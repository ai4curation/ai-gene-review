id: Q9LU14
gene_symbol: APG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  AT3G16370, also catalogued as GGL19 or AtGELP67 and carried in UniProt under the
  gene name APG ("GDSL esterase/lipase APG"), is one of roughly a hundred
  Arabidopsis GDSL (GELP) enzymes. It is a 353-residue precursor with a cleavable
  N-terminal signal peptide and a single SGNH/GDSL hydrolase domain whose
  Ser-Asp-His triad is intact, so it is predicted to be a secreted carboxylic ester
  hydrolase; the EC number 3.1.1.- and the "lipase" in its name are family
  assignments rather than measurements, and no substrate, kinetic parameter or
  catalytic assay has been reported for the protein. The mature protein is
  recovered from leaf apoplastic fluid in several quantitative proteomic studies,
  so it is a genuine extracellular enzyme of the cell wall space. Its promoter is
  active in cotyledons, roots, leaf pavement, mesophyll and guard cells, trichomes,
  filaments, sepals and siliques, and transcript levels fall under dehydration. No
  mutant phenotype, substrate or biological process has been established for it,
  and the gene has not been separated functionally from its many close paralogues.
