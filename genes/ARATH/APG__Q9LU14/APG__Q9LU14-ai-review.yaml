- term:
    id: GO:0008610
    label: lipid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN005219546
  - UniProtKB:O33407
  review:
    summary: >-
      IBA from a LUCA-level IBD whose single seed is the rhamnolipid-deficient
      phenotype of a Pseudomonas estA deletion; nothing in this gene's own
      literature or curated record supports a biosynthetic role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Tested directly rather than assumed. (i) On the gene itself there is no
      support. The protein has no experimental function annotation of any kind, no
      enzyme assay, no substrate and no mutant phenotype; PubMed and Europe PMC
      searches for AT3G16370 and Q9LU14 (2026-11-06) return only transcriptome and
      apoplast-proteome surveys plus one expression study (PMID:34621289), which
      reports promoter activity for GGL19 and nothing else. Its EC 3.1.1.- and
      "lipase" name are family-derived predictions, and they point at ester
      hydrolysis, not synthesis. (ii) The node placement does not support it
      either. PTN005219546 is a SPECIATION node at LUCA with 960 leaves (952
      eukaryotic, of which 940 Viridiplantae, and 8 eubacterial; topology
      re-checked with projects/PSEUDOCAP/panther_tree.py, 2026-11-06), and the
      GO:0008610 IBD at it has the single seed UniProtKB:O33407, whose own
      evidence is that an estA deletion makes little rhamnolipid, a necessity
      phenotype of unknown mechanism, since rhamnolipid is assembled by
      RhlA/RhlB/RhlC. One indirect bacterial phenotype is projected to 885 leaf
      IBAs in 48 taxa, overwhelmingly plant GELPs. (iii) The clade is nevertheless
      not devoid of biosynthetic evidence, which is why this is not a REMOVE.
      OSP1/AT2G04570 (UniProtKB:Q9SJB4, PTHR45642:SF32) is a leaf of this same
      node and is experimentally required for cuticular wax synthesis, with
      thioesterase activity on C22:0 and C26:0 acyl-CoAs (PMID:32542680; TAIR
      curated it as GO:0016297 IDA and added no biological-process term). That
      lineage-specific angiosperm wax role is unrelated to the bacterial
      glycolipid phenotype that seeded the node, and the smallest clade containing
      OSP1 and this gene is PTN008693276 with 892 leaves, the base of the plant
      radiation, so it cannot license the IBD as placed, nor a transfer to this
      gene. A survey of all 39 Arabidopsis leaves of the node (QuickGO,
      2026-11-06) finds no experimental biological-process annotation anywhere in
      the clade. The term is therefore kept only as an over-annotation on this
      gene, and the node annotation is reported upstream.
    supported_by:
    - reference_id: file:ARATH/APG__Q9LU14/APG__Q9LU14-uniprot.txt
      record_section: [PE]
      supporting_text: '2: Evidence at transcript level'
    - reference_id: PMID:34621289
      supporting_text: GGL19 was expressed in filaments and sepals
    - reference_id: file:PSEAE/estA/estA-notes.md
      supporting_text: A necessity phenotype is not participation.
