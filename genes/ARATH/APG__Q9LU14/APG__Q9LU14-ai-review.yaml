core_functions:
- description: >-
    Secreted carboxylic ester hydrolase of the apoplast. The SGNH/GDSL domain, with
    an intact Ser-Asp-His triad, is delivered to the cell wall space by a cleavable
    signal peptide and hydrolyses carboxylic esters there; the physiological
    substrate and the process it serves are unknown.
  molecular_function:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  locations:
  - id: GO:0048046
    label: apoplast
  supported_by:
  - reference_id: file:ARATH/APG__Q9LU14/APG__Q9LU14-uniprot.txt
    record_section: ["DR:CDD"]
    supporting_text: CDD; cd01837; SGNH_plant_lipase_like; 1.
  - reference_id: PMID:37876907
    supporting_text: >-
      We detected five GDSL lipases that accumulated differentially in the apoplast
  knowledge_gaps:
  - gap_statement: >-
      No substrate has ever been assayed for AT3G16370. Whether it hydrolyses
      acylglycerols, short-chain esters, cell-wall acetyl esters, cutin or suberin
      oligomers, or acyl thioesters is unknown, and the activity cannot be narrowed
      below the family level until a purified-enzyme substrate panel is run.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
knowledge_gaps:
- gap_statement: >-
    What biological process AT3G16370 serves is unknown. No mutant phenotype has
    been reported, its apoplastic substrate is unidentified, and the extensive
    paralogy of the Arabidopsis GELP family means single knockouts may be silent.
    Its expression in trichomes, epidermis, sepals and filaments, and its
    repression by dehydration, suggest a surface or water-relations role that has
    never been tested.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    AT3G16370 is one of about 40 Arabidopsis leaves receiving a lipid biosynthetic
    process IBA from a single bacterial seed; resolving what these enzymes actually
    do would settle a large block of unsupported plant annotation.
suggested_questions:
- question: >-
    Should PAINT withdraw the GO:0008610 lipid biosynthetic process IBD at
    PTN005219546, given that it is placed at a LUCA node, has a single bacterial
    seed resting on a necessity phenotype, and reaches 885 leaves that are mostly
    plant GELPs with no experimental biological-process evidence among them?
- question: >-
    Would a narrow, plant-restricted IBD seeded from OSP1/AT2G04570 (PMID:32542680)
    be the right way to capture the one real biosynthetic role in PTHR45642, and
    does that need a biological-process annotation on Q9SJB4 first, since TAIR
    curated only the molecular function?
- question: >-
    Is UniProt's gene name APG for Q9LU14 correct? The name belongs to AT1G20130
    (P40602, the anther-specific proline-rich protein of PMID:8401599), whereas
    TAIR and the GDSL literature call AT3G16370 GGL19 or AtGELP67.
suggested_experiments:
- description: >-
    Express and purify the mature protein with the signal peptide removed and run a
    substrate panel - p-nitrophenyl esters C2 to C16, Tween detergents, mono- and
    triacylglycerol, acyl-CoA and acyl-ACP thioesters, cutin and suberin oligomers,
    and cell-wall acetyl esters - alongside an active-site Ser37-to-Ala variant as a
    negative control. This is the one experiment that would turn the family-level
    molecular function into a substrate-level one, and it would test directly
    whether the protein does anything that could feed a biosynthetic pathway.
- description: >-
    Build a higher-order mutant of AT3G16370 with its closest relatives in the
    171-leaf clade PTN008145211 (which also contains AT5G03810) by CRISPR, and
    profile cuticular wax, cutin and apoplastic lipids plus epidermal permeability
    and transpiration, the assays that revealed the OSP1 phenotype. Redundancy is
    the norm in this family, so a single knockout is unlikely to be informative.
