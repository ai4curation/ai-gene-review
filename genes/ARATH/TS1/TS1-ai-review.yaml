id: Q9S7B5
gene_symbol: TS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: TS1, also called MTO2, is a chloroplast pyridoxal-phosphate-dependent threonine synthase
  that converts O-phosphohomoserine and water to threonine and phosphate. The homodimeric enzyme is allosterically
  activated by S-adenosylmethionine and competes with the methionine branch for O-phosphohomoserine. TS1-dependent
  threonine metabolism supports root meristem growth; impaired TS1 can alter threonine and methionine
  pools without establishing that the enzyme is itself a transcriptional regulator.
