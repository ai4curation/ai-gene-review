suggested_questions:
- question: Which tissue-specific phenotypes follow from local metabolite pools rather than a separate
    regulatory activity?
suggested_experiments:
- experiment_type: compartment-resolved isotope flux and enzyme kinetics
  description: Combine endogenous localization and fraction purity controls with isotope tracing and matched
    purified-enzyme substrate/cofactor measurements; distinguish shared precursor supply, net flux and
    secondary developmental or pathogen phenotypes.
