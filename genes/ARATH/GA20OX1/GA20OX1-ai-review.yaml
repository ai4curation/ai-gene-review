core_functions:
- description: Cytosolic 2-oxoglutarate/Fe(II)-dependent dioxygenase that oxidizes C-20 of GA12 (and GA53)
    in successive steps via GA15 and GA24 to the C19-gibberellin GA9 (and GA20), with loss of C-20 as
    CO2 (RHEA:60772); a major rate-limiting, feedback-regulated step in bioactive GA formation, acting
    partially redundantly with GA20ox2.
