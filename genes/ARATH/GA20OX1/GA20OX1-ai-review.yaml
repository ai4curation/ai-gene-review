- term:
    id: GO:0048575
    label: short-day photoperiodism, flowering
  evidence_type: IEP
  original_reference_id: PMID:7604047
  qualifier: acts_upstream_of_or_within
  review:
    summary: GA5 expression increases on transfer from short to long days; GA20ox1 contributes redundantly
      to flowering time.
    action: KEEP_AS_NON_CORE
    reason: The supporting observation is transcript-level (GA5 induction on short-to-long-day transfer),
      which does not by itself place GA20ox1 in either short-day or long-day photoperiodic flowering. The
      curator's short-day term is consistent with the classical finding that GA is required for Arabidopsis
      flowering specifically under short days (GA-deficient ga1 mutants fail to flower in short days but
      flower in long days; Wilson, Heckman and Somerville 1992, Plant Physiol, not in the local publication
      cache), and GA20ox1/GA20ox2 act redundantly to promote flowering time (PMID:18069939, photoperiod
      not stated in the cached abstract). The short-day-specific ga5-3 phenotype in PMID:15923331 concerns
      end-of-day far-red petiole elongation, not flowering, so it does not adjudicate this term. Retained
      as non-core because GA20ox1 supplies GA precursors and the flowering role is a downstream consequence of
      GA biosynthesis.
    supported_by:
    - reference_id: PMID:7604047
      supporting_text: Expression of the GA5 gene in Ara-bidopsis leaves was enhanced after plants were
        transferred from short to long days; it was reduced by GA4 treatment, suggesting end-product repression
        in the GA biosynthetic pathway.
    - reference_id: PMID:18069939
      supporting_text: AtGA20ox1 and AtGA20ox2 act redundantly to promote hypocotyl and internode elongation,
        flowering time, elongation of anther filaments, the number of seeds that develop per silique and
        elongation of siliques
