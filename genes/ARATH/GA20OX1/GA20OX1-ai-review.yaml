id: Q39110
gene_symbol: GA20OX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'GA20OX1 (GA5, AtGA20ox1; At4g25420) encodes a gibberellin 20-oxidase, a soluble 2-oxoglutarate-
  and Fe(II)-dependent dioxygenase that catalyses the successive oxidation of C-20 of GA12 and GA53 (via
  the alcohol and aldehyde) and its removal to form the C19-gibberellins GA9 and GA20, the immediate precursors
  of bioactive GA4 and GA1. It is one of five Arabidopsis GA20ox genes and, with GA20ox2, is the main
  paralog in vegetative and early reproductive development; the two act partially redundantly to promote
  hypocotyl and internode elongation, flowering, anther filament and silique growth. ga5 mutants are semi-dwarfs.
  GA20OX1 transcription is a major control point of GA levels: it is repressed by bioactive GA through
  DELLA-dependent feedback, induced by long days and far-red-rich light, and subject to circadian and
  auxin regulation.'
