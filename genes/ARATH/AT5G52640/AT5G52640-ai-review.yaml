- id: file:ARATH/AT5G52640/AT5G52640-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: Arabidopsis thaliana HSP90-1 (AT5G52640;
    UniProt P27323) functional annotation'
  findings:
  - reference_section_type: OTHER
    supporting_text: Arabidopsis **HSP90-1** (AtHSP90.1; AT5G52640; UniProt P27323) encodes a **cytosolic
      Hsp90-family molecular chaperone** that uses an ATP-driven conformational cycle and co-chaperones
      to **stabilize and mature specific client proteins** in multiple pathways.
  - reference_section_type: OTHER
    supporting_text: The best-supported primary functions are (i) **innate immunity**, where AtHSP90.1
      forms functionally critical complexes with cochaperones **RAR1** and **SGT1** to support NLR-mediated
      effector-triggered immunity; and (ii) **proteostasis and developmental plasticity**, where
      recent work implicates cytosolic HSP90 (including HSP90.1) in **heat acclimation networks**
      and in **stabilizing plasma-membrane ABCB auxin transporters** through interaction with the
      immunophilin **TWD1**.
  - reference_section_type: OTHER
    supporting_text: 'Arabidopsis AtHSP90.1 is described with the **canonical three-domain architecture**:
      an **N-terminal ATPase domain**, a **middle domain** implicated in client interactions, and
      a **C-terminal dimerization region** containing a conserved **MEEVD motif** that binds many
      TPR-domain cochaperones.'
  - reference_section_type: OTHER
    supporting_text: AtHSP90.1 is consistently described as a **cytosolic/cytoplasmic HSP90 isoform**.
  - reference_section_type: OTHER
    supporting_text: A landmark Arabidopsis study demonstrated AtHSP90.1 is required for full **RPS2-mediated
      resistance** and contributes to **RPM1 resistance**, acting with cochaperones **RAR1** and
      **SGT1**.
  - reference_section_type: OTHER
    supporting_text: '**athsp90.1** loss-of-function mutants showed **~5–20×** higher bacterial growth
      by **3 dpi** under RPS2-dependent conditions, with differences reported as significant at **P
      < 0.05**.'
  - reference_section_type: OTHER
    supporting_text: '*athsp90.1* loss-of-function mutants show no obvious morphology under normal
      growth but are compromised in effector-triggered immunity; pharmacological HSP90 inhibition
      similarly impairs HR and resistance. This supports a specialized stress/immune buffering role
      rather than a strong constitutive developmental defect'
  - reference_section_type: OTHER
    supporting_text: Recent work proposes that HSP90 (including **HSP90.1**) contributes to developmental
      plasticity by stabilizing plasma membrane presence of **ABCB-type auxin transporters**, through
      interaction with the immunophilin cochaperone **FKBP42/TWD1**.
  - reference_section_type: OTHER
    supporting_text: Cytosolic HSP90 participates in a pathway for **post-translational chloroplast
      preprotein targeting** to the TOC import machinery.
  - reference_section_type: OTHER
    supporting_text: the **rof1/rof2 double mutant** accumulates significantly higher levels of many
      HSPs than WT following acclimation, including **HSP90-1** as a heat-induced “large HSP”.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read scientific body, tables and limitations. Immune and membrane-client synthesis
      retained; preprint ABCB findings checked against 2025 publication. Detailed TWD1 FRET uses
      HSP90.3, while target HSP90.1 has separate co-IP, localization and mutant evidence. Missing
      ZTL retrieval is an access limit, not a negative result.
