id: P27323
gene_symbol: AT5G52640
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: HSP90.1 is a stress-inducible cytosolic Hsp90 chaperone of Arabidopsis thaliana. It
  binds and hydrolyzes ATP and has both holdase and ATP-dependent foldase activity. With cochaperones
  such as ROF1, RAR1 and SGT1 it supports client-protein function, heat acclimation and innate immune
  signaling; hsp90.1 mutations compromise RPS2-mediated antibacterial resistance. HSP90.1 has cytoplasmic
  and heat-induced nuclear pools and associates with plasma-membrane client machinery. It interacts
  with ABCB1 and contributes to the stability and regulation of auxin-transporter systems. HSP90.1
  can also enhance COP1–ELF3 association, providing a protein-interaction contribution to developmental
  regulation; combined cytosolic-HSP90 experiments connect this module to dark- and warm-temperature
  hypocotyl growth.
