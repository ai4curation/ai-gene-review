- id: PMID:21800258
  title: Arabidopsis mutants lacking asparaginases develop normally but exhibit enhanced root inhibition
    by exogenous asparagine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cache is abstract-only or bibliographic; exact access limitations are retained in the
      annotation reasons. UniProt Q8GXG1 has no GN primary symbol; ASPGB1 is mapped explicitly to At3g16150
      in primary21800258. Primary16705405 directly demonstrates K+-enhanced asparaginase activity and
      autocatalytic cleavage exposing catalytic Thr. Primary22127737 revises the original no-dipeptidase
      claim: ASPGB1 hydrolyzes beta-Asp-His as well as Asn, while showing much greater Asn activity than
      ASPGA1. Thus retain beta-aspartyl-peptidase capacity without inventing a native protein-degradation
      pathway. Full21800258 author-uploaded primary reproduction inspected at https://www.researchgate.net/publication/51531651_Arabidopsis_mutants_lacking_asparaginases_develop_normally_but_exhibit_enhanced_root_inhibition_by_exogenous_asparagine
      : independent single mutants enhance root inhibition by Asn; many seed/pool phenotypes concern the
      double mutant. Normal growth under tested conditions does not establish absent catabolic function.'
