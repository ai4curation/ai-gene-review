id: Q8GXG1
gene_symbol: Q8GXG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ASPGB1 is a potassium-activated N-terminal-nucleophile asparaginase encoded by At3g16150.
  Autocatalytic processing produces alpha and beta chains and exposes the catalytic threonine. The enzyme
  hydrolyzes asparagine to aspartate and ammonium and also accepts beta-aspartyl-histidine, contributing
  to asparagine turnover with context-dependent effects on seed metabolites and root responses to exogenous
  asparagine.
