- term:
    id: GO:0019761
    label: glucosinolate biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:18162591
  review:
    summary: >-
      BCAT3 has no glucosinolate-biosynthesis annotation in GOA, although Knill et al. (2008)
      show it transaminates methionine chain-elongation intermediates, that bcat3-1 alters the
      aliphatic glucosinolate chain-length profile, and that bcat3 bcat4 double mutants lose
      substantially more methionine-derived glucosinolate than bcat4 alone.
    action: NEW
    reason: >-
      Participation: BCAT3 catalyzes transamination steps within the methionine chain-elongation
      phase of aliphatic glucosinolate biosynthesis (terminal conversion of elongated 2-oxo
      acids to homomethionine/dihomomethionine, and backup Met deamination). Comparator check:
      the paralog doing the equivalent step, BCAT4, carries GO:0019761 (IMP), as do the elongation-cycle
      MAM1/MAM3 synthases, so the term is applied to catalysts of the cycle and its absence
      for BCAT3 is a gap rather than a convention.
    supported_by:
    - reference_id: PMID:18162591
      supporting_text: >-
        In summary these data show that this enzyme does not participate exclusively in one
        of the two pathways. BCAT3 is clearly active in both the BCAA and the Met-derived glucosinolate
        biosyntheses.
    - reference_id: PMID:18162591
      supporting_text: >-
        Third, in the bcat3-1/bcat4-2 double mutant ( Tables IX and X ), the knockout of BCAT3
        has a striking additive effect on the reduction of total Met-derived glucosinolate content
        in comparison to the bcat4-1 or bcat4-2 single knockout mutants.
- term:
    id: GO:0033322
    label: L-homomethionine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:18162591
  review:
    summary: >-
      GO:0033322 (formation of L-homomethionine from L-methionine via chain elongation) describes
      the methionine chain-elongation cycle; BCAT3 is proposed to catalyze its terminal transamination,
      producing homomethionine and dihomomethionine.
    action: NEW
    reason: >-
      Participation: the product-forming transamination of the cycle is catalyzed by BCAT3 (inferred
      from mutant chemotype plus in vitro activity with the chain-elongation 2-oxo acids). Comparator
      check: GO:0033322 has no annotations to any gene product (QuickGO, 2026), so no curator
      convention excludes the catalysts of the cycle. Not redundant with GO:0019761 (different
      branch: carboxylic acid biosynthetic process).
    supported_by:
    - reference_id: PMID:18162591
      supporting_text: >-
        The changes in glucosinolate proportions suggest that BCAT3 most likely catalyzes the
        terminal steps in the chain elongation process leading to short-chain glucosinolates:
        the conversion of 5-methylthiopentyl-2-oxo and 6-methylthiohexyl-2-oxo acids to their
        respective Met derivatives, homomethionine and dihomo-methionine, respectively.
