suggested_questions:
- question: Which transamination steps of the methionine chain-elongation cycle does BCAT3 catalyze in
    planta versus BCAT4, and which amino donor (Glu or a BCAA) is used in the plastid?
- question: How is BCAT3 partitioned between BCAA biosynthesis and glucosinolate chain elongation, and
    do Ser/Thr-derived imines that inhibit BCAT3 regulate this balance?
- question: 'GO has an unused term, GO:0033322 L-homomethionine biosynthetic process, whose definition
    (formation of L-homomethionine from L-methionine by chain elongation) matches the methionine chain-elongation
    cycle this enzyme catalyzes. GO obsoleted the related terms GO:0033506 (glucosinolate biosynthetic
    process from homomethionine; a pathway variant out of scope, replaced by GO:0019761) and GO:0033321
    (homomethionine metabolic process; unnecessary grouping), and no gene product in any species carries
    GO:0033322. Should the chain-elongation enzymes (BCAT4, MAM1/MAM3, IPMI, IPMDH1, BCAT3) be annotated
    to it, or should GO obsolete it in favour of glucosinolate biosynthetic process?

    '
suggested_experiments:
- description: Assay recombinant BCAT3 with the complete series of chain-elongated omega-methylthio-2-oxo
    acids (C5-C9) in the reverse (amination) direction with glutamate to test the proposed terminal transamination
    role.
- description: Profile chain-elongated methionine homologs (homo-, dihomo-, trihomomethionine) in bcat3,
    bcat4 and bcat3 bcat4 plants to directly measure the products of the elongation cycle rather than
    downstream glucosinolates.
proposed_new_terms:
- proposed_name: chain-elongated methionine:2-oxoglutarate transaminase activity
  proposed_definition: Catalysis of reversible amino-group transfer between a chain-elongated L-methionine
    derivative and 2-oxoglutarate, yielding the corresponding omega-methylthio-2-oxoalkanoate and L-glutamate.
    In methionine chain elongation, the reverse reaction produces homomethionine or longer methionine
    homologues from their 2-oxo acids.
  justification: GO:0010326 describes L-methionine itself and its corresponding unelongated 2-oxo acid.
    It does not describe the distinct elongated substrates assayed with BCAT3; the proposed term captures
    terminal transamination rather than backup initiation.
  proposed_parent:
    id: GO:0008483
    label: transaminase activity
  supported_by:
  - reference_id: PMID:18162591
    supporting_text: The recombinant enzyme converts MTOP to homo-Met and MTOH to dihomo-Met
