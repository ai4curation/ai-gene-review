- term:
    id: GO:0019761
    label: glucosinolate biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:18162591
  review:
    summary: BCAT3 has no glucosinolate-biosynthesis annotation in GOA, although Knill et al. (2008) show
      it transaminates methionine chain-elongation intermediates, that bcat3-1 alters the aliphatic glucosinolate
      chain-length profile, and that bcat3 bcat4 double mutants lose substantially more methionine-derived
      glucosinolate than bcat4 alone.
    action: NEW
    reason: 'BCAT3 itself performs transamination, established by recombinant activity plus metabolite
      genetics (PMID:18162591), rather than being consumed or merely required. Live QuickGO comparator
      audit: equivalent methionine-chain transaminase BCAT4 has GO:0019761 (PMID:17056707), while BCAT6
      lacks it; this mixed pattern is not a systematic substrate-exclusion convention and absence alone
      is not evidence of a gap. The term is under biosynthesis/sulfur-compound metabolism, fitting this
      catalytic role. No Q9M401 activity occurs in gocams/index.tsv. No existing or proposed ancestor/descendant
      BP duplicates this proposal. Direct target activity, not pathway completeness, justifies retaining
      this pre-existing NEW row.'
    supported_by:
    - reference_id: PMID:18162591
      supporting_text: In summary these data show that this enzyme does not participate exclusively in
        one of the two pathways. BCAT3 is clearly active in both the BCAA and the Met-derived glucosinolate
        biosyntheses.
    - reference_id: PMID:18162591
      supporting_text: Third, in the bcat3-1/bcat4-2 double mutant ( Tables IX and X ), the knockout of
        BCAT3 has a striking additive effect on the reduction of total Met-derived glucosinolate content
        in comparison to the bcat4-1 or bcat4-2 single knockout mutants.
