- id: PMID:18162591
  title: >-
    Arabidopsis branched-chain aminotransferase 3 functions in both amino acid and glucosinolate
    biosynthesis.
  findings:
  - statement: >-
      Recombinant BCAT3 prefers the 2-oxo acids of Leu, Ile and Val but also converts MTOB,
      MTOP and MTOH.
    supporting_text: >-
      In vitro activity tests with the recombinant protein identified highest activities with
      the 2-oxo acids of leucine, isoleucine, and valine, but also revealed substantial conversion
      of intermediates of the Met chain elongation pathway.
    reference_section_type: ABSTRACT
  - statement: >-
      bcat3-1 has reduced Val and altered aliphatic glucosinolate chain-length profile; bcat3
      bcat4 double mutant has strongly reduced Met-derived glucosinolates.
    supporting_text: >-
      This strongly suggests that BCAT3 can act as a backup of BCAT4 by transaminating Met to
      MTOB and thus contributes to the overall biosynthesis of Met-derived aliphatic glucosinolates,
      which is probably localized in plastids.
    reference_section_type: RESULTS
  - statement: >-
      BCAT3 most likely catalyzes terminal transamination of the chain-elongation cycle to homomethionine
      and dihomomethionine.
    supporting_text: >-
      The changes in glucosinolate proportions suggest that BCAT3 most likely catalyzes the
      terminal steps in the chain elongation process leading to short-chain glucosinolates:
      the conversion of 5-methylthiopentyl-2-oxo and 6-methylthiohexyl-2-oxo acids to their
      respective Met derivatives, homomethionine and dihomo-methionine, respectively.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC2259058); primary source for BCAT3 dual function; supports EXP activity
      annotations.
