id: Q9M401
gene_symbol: BCAT3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: BCAT3 (BRANCHED-CHAIN AMINOTRANSFERASE 3, At3g49680) is a plastid-targeted, pyridoxal 5'-phosphate-dependent
  class-IV aminotransferase with a dual role in primary and specialized metabolism. As a canonical branched-chain
  aminotransferase it catalyzes the final, reversible transamination steps of branched-chain amino acid
  biosynthesis in the chloroplast, converting 4-methyl-2-oxopentanoate, (S)-3-methyl-2-oxopentanoate and
  3-methyl-2-oxobutanoate to leucine, isoleucine and valine using glutamate/2-oxoglutarate; it complements
  the BCAA auxotrophy of a yeast bat1/bat2 mutant, and bcat3 knockouts have reduced free valine. BCAT3
  also transaminates the omega-methylthio-2-oxo acids of the methionine chain-elongation cycle and is
  thought to catalyze the terminal transamination that converts chain-elongated 2-oxo acids to homomethionine
  and dihomomethionine for aliphatic glucosinolate biosynthesis; it can partly substitute for the cytosolic
  BCAT4 in the initial deamination of methionine, as shown by the strong additive loss of methionine-derived
  glucosinolates in bcat3 bcat4 double mutants. BCAT3 is expressed in the phloem, is wound-inducible and
  is co-expressed with BCAT4 and MAM1.
