suggested_questions:
- question: >-
    Which transamination steps of the methionine chain-elongation cycle does BCAT3 catalyze
    in planta versus BCAT4, and which amino donor (Glu or a BCAA) is used in the plastid?
- question: >-
    How is BCAT3 partitioned between BCAA biosynthesis and glucosinolate chain elongation, and
    do Ser/Thr-derived imines that inhibit BCAT3 regulate this balance?
suggested_experiments:
- description: >-
    Assay recombinant BCAT3 with the complete series of chain-elongated omega-methylthio-2-oxo
    acids (C5-C9) in the reverse (amination) direction with glutamate to test the proposed terminal
    transamination role.
- description: >-
    Profile chain-elongated methionine homologs (homo-, dihomo-, trihomomethionine) in bcat3,
    bcat4 and bcat3 bcat4 plants to directly measure the products of the elongation cycle rather
    than downstream glucosinolates.
