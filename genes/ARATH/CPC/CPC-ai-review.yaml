core_functions:
- description: Mobile single-repeat R3 MYB inhibitor of MYB-bHLH-WD40 activator complexes. CPC moves between
    epidermal cells, binds GL3/EGL3 and competes with WER (root) or GL1 (leaf), preventing GL2 activation;
    this promotes root hair (trichoblast) fate and restricts trichome initiation in cells neighbouring
    a trichome (lateral inhibition).
  molecular_function:
    id: GO:0140416
    label: transcription regulator inhibitor activity
  directly_involved_in:
  - id: GO:0010063
    label: positive regulation of trichoblast fate specification
  - id: GO:0090627
    label: plant epidermal cell differentiation
  - id: GO:1900032
    label: regulation of trichome patterning
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:14627722
    supporting_text: they interact with the incomplete MYB protein CPC in the H position, which blocks
      the non-hair pathway and leads to the hair cell fate
  - reference_id: PMID:21914815
    supporting_text: WER and CPC compete with one another to define cell fates in the Arabidopsis root
      epidermis
  - reference_id: PMID:16291794
    supporting_text: CPC is transported from atrichoblasts (hairless cells), where it is expressed, to
      trichoblasts, and generally accumulates in their nuclei.
  - reference_id: PMID:12356720
    supporting_text: Both genes are expressed in trichomes and act together during lateral inhibition.
  - reference_id: PMID:18766177
    supporting_text: TRIPTYCHON and CAPRICE but not GLABRA1 and GLABRA3 can move between cells
  - reference_id: PMID:18644155
    supporting_text: all single-repeat R3 MYBs examined interact with GL3
suggested_questions:
- question: Does CPC retain any sequence-specific DNA-binding capacity with its single R3 repeat, or is
    its activity entirely through bHLH sequestration/competition?
suggested_experiments:
- description: EMSA/DAP-seq with recombinant CPC alone versus CPC-GL3 heterocomplex, compared with WER-GL3,
    on GL2 promoter fragments.
  experiment_type: In vitro DNA binding
  hypothesis: CPC alone does not bind GL2 promoter DNA, and CPC-GL3 complexes bind with reduced affinity
    relative to WER-GL3.
