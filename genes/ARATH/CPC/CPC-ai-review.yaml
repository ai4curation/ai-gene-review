- term:
    id: GO:1900032
    label: regulation of trichome patterning
  evidence_type: IMP
  original_reference_id: PMID:12356720
  review:
    summary: CPC acts with TRY as a mobile lateral inhibitor in leaf trichome spacing; try cpc double
      mutants convert all cells contacting a trichome into trichomes.
    action: NEW
    reason: 'CPC itself performs the inhibitory step of the patterning mechanism (binding GL3 and competing
      with GL1 in neighbouring cells), so this is participation rather than mere necessity. Comparator:
      the paralog TRY carries GO:1900032 by IMP in GOA (PMID:21951724). Not an ancestor/descendant of
      other CPC terms.'
    supported_by:
    - reference_id: PMID:12356720
      supporting_text: Both genes are expressed in trichomes and act together during lateral inhibition.
    - reference_id: PMID:12356720
      supporting_text: In try cpc double mutants, all cells in immediate contact with an already existing
        trichome started to bulge out and developed into trichomes
    - reference_id: PMID:12356720
      supporting_text: An attractive explanation for this finding is that CPC competes with the R gene
        homolog GL3 in Arabidopsis and, depending on their balance, trichome cell fate is promoted when
        more GL3 is available, while an excess of CPC promotes the epidermal cell fate.
