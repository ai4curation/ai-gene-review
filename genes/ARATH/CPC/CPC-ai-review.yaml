gene_symbol: CPC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'CAPRICE (CPC) is a small (94 aa) single-repeat R3-type MYB protein of Arabidopsis that lacks
  an R2 repeat and a transcriptional activation domain. CPC is transcribed in non-hair (atrichoblast)
  cells of the root epidermis under control of the WER-GL3/EGL3-TTG1 MYB-bHLH-WD40 complex, moves through
  plasmodesmata into neighbouring hair-position cells and accumulates in their nuclei, where it binds
  the bHLH proteins GL3/EGL3 and competes with the R2R3-MYB WEREWOLF. This blocks activation of GLABRA2
  and allows root hair (trichoblast) fate, making CPC a positive regulator of root hair cell specification.
  In the shoot epidermis CPC is likewise induced by GL1-GL3 and acts with TRIPTYCHON (TRY) and other R3
  MYBs (ETC1-3, TCL1) as a mobile lateral inhibitor of trichome initiation: cpc mutants have increased
  trichome density, try cpc double mutants form large trichome clusters, and CPC overexpression abolishes
  trichomes. CPC also promotes stomatal formation in the hypocotyl redundantly with TRY.'
