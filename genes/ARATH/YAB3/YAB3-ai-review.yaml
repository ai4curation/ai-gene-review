gene_symbol: YAB3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: YABBY-family transcription factor (YABBY3) with an N-terminal C2C2 zinc finger and a C-terminal HMG-like YABBY
  domain, closely related to and largely redundant with FILAMENTOUS FLOWER (FIL/YAB1). YAB3 is a nuclear protein expressed
  in the abaxial domain of all aerial lateral organ primordia (cotyledons, leaves, floral organs, stamens and carpel valves)
  but not in meristems or roots. It can activate transcription in planta and, through interaction with the LEUNIG/LEUNIG_HOMOLOG
  co-repressors and SEUSS/SEUSS-LIKE adaptors, participates in repression, for example of the class I KNOX genes STM, BP and
  KNAT2 in leaves. Together with FIL, YAB2 and YAB5 it specifies abaxial cell fate and adaxial/abaxial polarity of lateral
  organs and promotes lamina growth. Acting from organ primordia it non-cell-autonomously promotes embryonic shoot apical
  meristem initiation and meristem maintenance and influences phyllotaxy; with FIL and JAGGED it promotes valve and valve-margin
  identity of the fruit and restricts BP expression to the replum. YAB3 also interacts with NOZZLE/SPOROCYTELESS and SPL8,
  and has been implicated in anther and vascular cell differentiation.
