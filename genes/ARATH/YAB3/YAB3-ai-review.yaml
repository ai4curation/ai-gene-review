suggested_questions:
- question: Does YAB3 bind DNA in a sequence-specific manner (as reported for FIL binding elements), or non-specifically as
    UniProt states? The UniProt statement cites papers whose abstracts do not report YAB3 DNA-binding assays.
- question: Which YAB3 target genes are activated directly and which are repressed via the LUG/LUH-SEUSS complex, and does
    YAB3 differ from FIL in this balance (YAB3 activates in planta but not in yeast)?
- question: Is the YAB3 role in anther development (SPL8-YAB3/TCP19 module) supported by loss-of-function alleles, or only
    by dominant SRDX repressor chimeras?
suggested_experiments:
- experiment_type: ChIP-seq / DAP-seq
  hypothesis: YAB3 directly occupies promoters of polarity genes and KNOX genes in vivo, at the same motifs as FIL.
  description: Perform YAB3-GFP ChIP-seq in shoot apices of a complemented fil yab3 line and compare with DAP-seq of the YAB3
    YABBY domain and FIL datasets.
- experiment_type: Co-repressor dependence assay
  hypothesis: Repression of KNOX targets by YAB3 requires LUG/LUH recruitment, whereas activation does not.
  description: Measure target expression after YAB3-GR induction in wild type and lug luh/+ backgrounds, and with YAB3 variants
    unable to bind LUG/SEU.
