core_functions:
- description: Sequence-specific binding of plastid mRNA 5' UTRs and intercistronic regions by the
    PPR tract of PGR3 in the chloroplast stroma, which protects processed transcript termini
    (petL operon 5' end; rpl16-rpl14 3' end) from exonucleolytic decay and activates translation
    of petL, ndhG and rps8 by counteracting inhibitory RNA structure near the ribosome-binding
    region.
  molecular_function:
    id: GO:0048027
    label: mRNA 5'-UTR binding
  directly_involved_in:
  - id: GO:0048255
    label: mRNA stabilization
  - id: GO:0045727
    label: positive regulation of translation
  locations:
  - id: GO:0009507
    label: chloroplast
  supported_by:
  - reference_id: PMID:21457370
    supporting_text: Our results fully support the model in which PGR3
      recognizes two target sequences and is involved in multiple functions, i.e.
      stabilizing RNA and activating translation.
  - reference_id: PMID:33439244
    supporting_text: Here, we show that PGR3 facilitates
      the translation from ndhG, in addition to petL, through binding to their 5'
      untranslated regions (UTRs).
  - reference_id: PMID:30125002
    supporting_text: We conclude, therefore, that the binding of PGR3 in the rpl14-rps8
      intergenic region simultaneously stabilizes a processed 3′-RNA terminus and stimulates
      rps8 translation.
suggested_questions:
- question: How do the C-terminal PPR motifs of PGR3 activate translation once bound - by remodelling
    inhibitory 5' UTR structure alone, or by recruiting ribosomes or other factors?
- question: Does maize PGR3 have an additional target involved in ribosome biogenesis (for example
    23S rRNA precursors), and is that target shared by Arabidopsis PGR3?
- question: Which ndh mRNA (ndhG, ndhE or ndhA) accounts for the NDH deficiency of pgr3 mutants, given
    the conflicting reports?
suggested_experiments:
- description: In vivo crosslinking and immunoprecipitation (CLIP/RIP-seq) of epitope-tagged
    Arabidopsis PGR3 to map all binding sites, including any rRNA or ndh targets.
  experiment_type: RIP-seq
- description: Toeprinting or in vitro translation with structure-probing (SHAPE) of petL and ndhG 5'
    UTRs with wild-type PGR3 versus C-terminally truncated (pgr3-3-like) protein to separate binding
    from translational activation.
  experiment_type: in vitro translation and RNA structure probing
