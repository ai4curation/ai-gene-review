description: >-
  PROTON GRADIENT REGULATION 3 (PGR3, At4g31850) is a nucleus-encoded, chloroplast-targeted
  P-class pentatricopeptide repeat (PPR) protein of about 1100 residues with an N-terminal
  transit peptide and 27 tandem PPR motifs. It is a sequence-specific RNA-binding protein that
  acts on plastid mRNAs in the chloroplast stroma. PGR3 binds a site in the petL 5' untranslated
  region, where it protects the processed 5' terminus of petL operon transcripts from
  exonucleolytic decay (leaving a small-RNA footprint) and activates petL translation, which is
  needed for accumulation of the cytochrome b6f complex. It also binds the ndhG 5' UTR and
  activates ndhG translation, contributing to accumulation of the chloroplast NADH
  dehydrogenase-like (NDH) complex, and binds the rpl14-rps8 intercistronic region, where,
  together with the PPR-SMR protein ATP4/SVR7, it stabilizes a processed rpl14 3' end and
  stimulates rps8 translation; reduced expression of these ribosomal protein genes contributes
  to the loss of plastid ribosomes in pgr3 mutants. The N-terminal PPR motifs mediate RNA
  stabilization through sequence-specific binding, whereas the C-terminal motifs are required for
  translational activation, apparently by counteracting inhibitory RNA secondary structure at
  the ribosome-binding region. Mutants show high chlorophyll fluorescence, reduced cytochrome
  b6f and NDH activity, slight chlorophyll deficiency and slower growth; functions are conserved
  in the maize ortholog.
