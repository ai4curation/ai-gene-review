- id: PMID:15053768
  title: PPR motifs of the nucleus-encoded factor, PGR3, function in the selective and
    distinct steps of chloroplast gene expression in Arabidopsis.
  findings:
  - statement: Founding genetic study; pgr3 alleles with single PPR-motif substitutions separate
      the cytochrome b6f and NDH phenotypes, all complemented by PGR3.
    supporting_text: Both
      phenotypes were complemented by the introduction of a single gene, PGR3,
      encoding a protein containing 27 pentatrico-peptide repeat (PPR) motifs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache; matches UniProt RN [5] (PubMed 15053768).
- id: PMID:21457370
  title: PROTON GRADIENT REGULATION 3 recognizes multiple targets with limited similarity
    and mediates translation and RNA stabilization in plastids.
  findings:
  - statement: Recombinant PGR3 binds 5' UTR elements of petL; pgr3-2 alters binding specificity;
      the C-terminus is needed for translation but not binding.
    supporting_text: suggesting that the C-terminal end of
      PGR3 is not required for binding to targets but is essential for translation of
      petL and probably also ndhA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache. The ndhA target proposed here was later not supported by
      ribosome profiling (PMID:30125002), which found ndhG instead (PMID:33439244); an erratum
      (2022) exists.
- id: PMID:22156165
  title: Protein-mediated protection as the predominant mechanism for defining processed
    mRNA termini in land plant chloroplasts.
  findings:
  - statement: The PGR3 binding site upstream of petL is represented by an sRNA footprint,
      consistent with PGR3 protecting the processed petL 5' end from exonucleases.
    supporting_text: the binding site of PGR3, a PPR protein that stabilizes the petL 5′-terminus
      in Arabidopsis (14,29), is represented by an sRNA in these same datasets
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read; mainly about HCF152 and PPR10, PGR3 discussed as a P-class
      example of protein-mediated protection.
- id: PMID:23975900
  title: Mutagenesis of individual pentatricopeptide repeat motifs affects RNA binding
    activity and reveals functional partitioning of Arabidopsis PROTON gradient regulation3.
  findings:
  - statement: The 16 N-terminal PPRs suffice for RNA stabilization via sequence-specific binding;
      the 11 C-terminal motifs are required for translational activation.
    supporting_text: we showed that the 16 N-terminal PPRs were
      sufficient for function (1) via sequence-specific RNA binding, whereas the 11
      C-terminal motifs were essential for functions (2) and (3) by activating
      translation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache.
- id: PMID:30125002
  title: Unexpected functional versatility of the pentatricopeptide repeat proteins
    PGR3, PPR5 and PPR10.
  findings:
  - statement: PGR3 binds the rpl14-rps8 intercistronic region, stabilizes a processed 3' end and
      stimulates rps8 translation; it does not activate ndhA translation.
    supporting_text: In addition, our results show that PGR3 does not activate ndhA translation,
      as had previously been suggested.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC6212717). Uses pgr3-4 null allele and maize RIP-seq.
