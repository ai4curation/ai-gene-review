- term:
    id: GO:0006412
    label: translation
  evidence_type: IMP
  original_reference_id: PMID:30125002
  qualifier: acts_upstream_of_or_within
  review:
    summary: Ribosome profiling of the pgr3-4 null mutant showed reduced ribosome footprints on rpl14
      and rps8 (and petL), and reduced plastid rRNA, which the authors attribute to PGR3 binding in the
      rpl14-rps8 intergenic region and stimulation of rps8 translation.
    action: MODIFY
    reason: Under acts_upstream_of_or_within the row is not wrong, but it is uninformative. PGR3
      is not a component of the translation machinery; it activates translation of specific plastid
      mRNAs by binding near their translation initiation regions, and the broader loss of plastid
      ribosomes is a secondary consequence of reduced rpl14/rps8 expression. Positive regulation of
      translation captures what PGR3 does. GO has no plastid-specific regulation of translation
      term.
    proposed_replacement_terms:
    - id: GO:0045727
      label: positive regulation of translation
    supported_by:
    - reference_id: PMID:30125002
      supporting_text: We conclude, therefore, that the binding of PGR3 in the rpl14-rps8
        intergenic region simultaneously stabilizes a processed 3′-RNA terminus and stimulates
        rps8 translation.
    - reference_id: PMID:30125002
      supporting_text: PGR3’s stimulatory effect on the expression of two genes that encode ribosomal
        proteins (rpl14 and rps8) likely contributes to the loss of plastid ribosomes in maize and
        Arabidopsis pgr3 mutants.
