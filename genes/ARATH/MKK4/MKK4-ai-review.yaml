suggested_questions:
- question: How is output specificity achieved when the same MKK4/MKK5 pair relays YODA (stomata, embryo,
    inflorescence), HAE/HSL2 (abscission) and immune-receptor signals to MPK3/MPK6?
- question: Are MKK4 and MKK5 fully redundant in the stomatal lineage, or do expression-level or docking
    differences give one paralog a predominant role?
- question: Should the MAPK-cascade members downstream of pattern recognition receptors (MKK4, MKK5, MPK3,
    MPK6) carry cell surface pattern recognition receptor signaling pathway (GO:0002752)? MAPKKK5 carries
    it via a curator IGI row, but no same-role MAP2K or MAPK currently does, so it is not proposed here.
- question: Camalexin induction by MKK4 is supported mainly by gain-of-function (GVG-MKK4DD) data; does
    mkk4 mkk5 loss of function compromise pathogen-induced camalexin, which would justify positive regulation
    of camalexin biosynthetic process (GO:1901183) as on MPK3?
- question: Is the pollen-pistil interaction IGI (PMID:32890733) correctly attributed to MKK4? The abstract
    names MKK1/2/3/7/9, and the WITH/FROM list contains the MKK4 locus (AT1G51660) but not MKK3 (AT5G40440),
    suggesting a possible MKK3/MKK4 identifier swap.
- question: Does chloroplast-imported MKK4 have a physiological stromal substrate or function, or is the
    in vitro import a minor pool without signaling consequence?
suggested_experiments:
- description: Generate clean mkk4 mkk5 CRISPR double mutants with cell-type-specific complementation
    (SPCH or MUTE promoters) to test where in the stomatal lineage MKK4/5 activity is required, avoiding
    RNAi silencing variability.
  experiment_type: genetics / cell-type-specific complementation
- description: Conditional (estradiol-inducible amiRNA) depletion of MKK4 in an mkk5 null background to
    separate immune (chitin, flg22, Botrytis) from developmental requirements, assaying MPK3/MPK6 activation,
    camalexin accumulation and resistance.
- description: Live-cell imaging of functional MKK4-fluorescent protein fusions in stable Arabidopsis lines
    under oxidative stress to test whether a chloroplast stromal pool exists in vivo.
