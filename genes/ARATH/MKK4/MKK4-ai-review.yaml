id: O80397
gene_symbol: MKK4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'MAP KINASE KINASE 4 (MKK4; At1g51660) is a group C plant MAPK kinase (MAP2K) of 366 aa that,
  redundantly with its close paralog MKK5, phosphorylates the activation-loop Thr and Tyr of MPK3 and
  MPK6. MKK4/MKK5 are the shared middle tier of several MAPK modules: downstream of the MAPKKK YODA they
  repress stomatal lineage entry and spacing (and, downstream of ERECTA, promote localized cell proliferation
  in inflorescences); downstream of IDA-HAE/HSL2 they control floral organ abscission; and downstream
  of pattern-recognition receptors (via MAPKKK5/MEKK-type kinases) they activate MPK3/MPK6 for immune
  gene expression, camalexin and ethylene production. Upstream kinases such as YODA and MAPKKK5 phosphorylate
  its activation loop, and its own activity is inhibited indirectly by BIN2 acting on YODA. MKK4 is mainly
  cytoplasmic/nuclear, with a minor chloroplast-stromal pool.'
