id: O80397
gene_symbol: MKK4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'MKK4 (At1g51660) is a group C plant dual-specificity MAP kinase kinase that, largely redundantly with its paralog
  MKK5, forms the middle tier of MAPK cascades that activate MPK3 and MPK6. It is activated by phosphorylation of activation-loop
  Thr-224/Ser-230 by context-specific MAP3Ks: MAPKKK3/MAPKKK5 downstream of cell surface pattern recognition receptors (including
  the CERK1-PBL27 chitin pathway and the flagellin receptor FLS2), and YODA downstream of ERECTA-family and other developmental
  receptors. Activated MKK4 phosphorylates the TEY activation motif of MPK3/MPK6, mainly in the cytoplasm; a pool can also
  be imported into chloroplasts. Through MPK3/MPK6 the cascade promotes resistance to bacterial and fungal pathogens, camalexin
  and wound- or pathogen-induced ethylene production, and regulates stomatal development and patterning, inflorescence architecture,
  floral organ abscission and lateral root emergence. Its activity is inhibited by phosphorylation by brassinosteroid-regulated
  GSK3-like kinases and targeted by the Pseudomonas syringae effector HopF2.'
