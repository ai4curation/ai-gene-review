suggested_questions:
- question: Should the MAPK-cascade members downstream of pattern recognition receptors (MKK4, MKK5, MPK3, MPK6) carry cell
    surface pattern recognition receptor signaling pathway (GO:0002752)? MAPKKK5 carries it via a curator IGI row, but no
    same-role MAP2K or MAPK currently does.
- question: Camalexin induction by MKK4 is supported only by gain-of-function (GVG-MKK4DD) data; does mkk4 mkk5 loss of function
    compromise pathogen-induced camalexin, which would justify positive regulation of camalexin biosynthetic process (GO:1901183)
    as on MPK3?
- question: Is the pollen-pistil interaction IGI (PMID:32890733) correctly attributed to MKK4? The abstract names MKK1/2/3/7/9,
    and the WITH list contains the MKK4 locus (AT1G51660) but not MKK3 (AT5G40440), suggesting a possible MKK3/MKK4 identifier
    swap.
- question: Does chloroplast-imported MKK4 have a physiological stromal substrate or function, or is the in vitro import a
    minor pool without signaling consequence?
suggested_experiments:
- description: Conditional (estradiol-inducible amiRNA) depletion of MKK4 in an mkk5 null background to separate immune (chitin,
    flg22, Botrytis) from developmental requirements, assaying MPK3/MPK6 activation, camalexin accumulation and resistance.
- description: Live-cell imaging of functional MKK4-fluorescent protein fusions in stable Arabidopsis lines under oxidative
    stress to test whether a chloroplast stromal pool exists in vivo.
