  review:
    summary: Stigma receptivity study placing a highly redundant MKK-MPK3/MPK4 cascade in compatible pollination.
      The abstract names MKK1/2/3/7/9 (quintuple mutant) and MPK3/MPK4, not MKK4; the WITH/FROM list contains
