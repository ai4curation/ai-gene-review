- description: Dual-specificity MAP2K that, redundantly with MKK5, phosphorylates and activates MPK3/MPK6 after activation
    by MAPKKK3/MAPKKK5 downstream of cell surface pattern recognition receptors (including chitin via CERK1-PBL27-MAPKKK5
    and flagellin via FLS2).
