taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  EIP9 (At5g64360), also called SDJ1 or DNAJ1, is a 464-residue nuclear protein with a
  single J domain (residues 79-144) that belongs to the plant-specific PTHR45496 family
  (subfamily SF19). It is the transcription-enhancing subunit of the SUVH-SDJ methylation
  reader complex. The SRA-domain proteins SUVH1 and SUVH3 bind RdDM-deposited methylated
  DNA and recruit SDJ1 together with its paralogs SDJ2 and SDJ3. SDJ1 itself has no
  methyl-DNA or sequence-specific DNA-binding activity. Once recruited, it raises
  transcription of nearby, already expressed genes, including genes with methylated
  promoters such as ROS1. When tethered artificially to DNA, SDJ1 activates reporter
  transcription in plants, yeast and mammalian cells. Its J domain lacks the HPD tripeptide
  needed to stimulate Hsp70, so it is unlikely to work as a classical Hsp70 co-chaperone.
  SDJ1 also binds the homeodomain transcription factor WUSCHEL and enhances WUS promoter
  activity. It interacts with EMF1, and its loss changes flowering time. Genetic data
  further suggest a contributory role, through the DDR complex, in RdDM-dependent DNA
  methylation at a subset of loci.
