  title: EIP9/SDJ1 J-domain HPD motif check
  findings:
  - statement: The EIP9/SDJ1 J domain lacks the HPD tripeptide needed to stimulate Hsp70. SDJ3
      also lacks it, while SDJ2 retains it.
    supporting_text: EIP9/SDJ1 lacks the HPD motif within its J domain
core_functions:
- description: >-
    Transcription coactivator subunit of the SUVH-SDJ methylation reader complex. SUVH1/SUVH3
    bind RdDM-methylated DNA and recruit SDJ1, which enhances transcription of nearby,
    already expressed genes (including methylated-promoter genes such as ROS1). SDJ1 has no
    DNA-binding activity of its own. These functions are established experimentally in
    Arabidopsis (IDA/IPI/IMP, PMID:30523112, PMID:30589221).
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:30523112
    supporting_text: Together, these data indicate that DNAJ1 and DNAJ2 interact with SUVH1 and
      SUVH3, are recruited to sites of RdDM, and promote the expression of proximal genes.
  - reference_id: PMID:30523112
    supporting_text: Thus, SUVH1 and SUVH3 are required to recruit DNAJ1 and DNAJ2 to methylated
      DNA.
  - reference_id: PMID:30589221
    supporting_text: We demonstrate that the SUVH-SDJ complex components have transcriptional
      activation activity.
  - reference_id: PMID:33445404
    supporting_text: These results demonstrated a positive role of WUS-SDJ1/SDJ3/At5g09540 complex
      in WUS promoter activity.
suggested_questions:
- question: >-
    How does SDJ1 enhance transcription mechanistically? Its J domain lacks the HPD motif,
    so does it recruit Hsp70 or another chaperone at all, or does it act through
    general-transcription or Mediator contacts?
  experts:
  - plant epigenetics researchers
  - J-domain protein biochemists
- question: >-
    Why does DNA methylation stay unchanged in dnaj1 dnaj2 double mutants (PMID:30523112)
    yet fall in sdj1/2/3 triple mutants (PMID:34185870)? Is the RdDM effect a redundancy
    effect or a feedback effect, for example through reduced ROS1 expression?
  experts:
  - RdDM researchers
- question: >-
    Should GO have a cellular-component term for the SUVH-SDJ methylation reader complex, so
    that its subunits can be annotated to it?
  experts:
  - GO editors
suggested_experiments:
- hypothesis: SDJ1 coactivation is independent of Hsp70 binding.
  description: >-
    Restore the HPD motif in the SDJ1 J domain (NPS to HPD) and, separately, delete the J
    domain. Test both versions for Hsp70 ATPase stimulation in vitro and for ZF108-tethered
    transcription activation and complementation of dnaj1 dnaj2 in planta.
- hypothesis: SDJ1 promotes RdDM-dependent methylation through direct contact with the DDR complex.
  description: >-
    Map the SDJ1 surfaces that bind RDM1/DMS3, make point mutants that keep SUVH1/SUVH3
    binding but lose DDR binding, and assay DNA methylation (WGBS) and target-gene expression
    in sdj1/2/3 complementation lines.
