- id: PMID:30523112
  title: A DNA methylation reader complex that enhances gene transcription.
  findings:
  - statement: SDJ1 (DNAJ1) forms a complex with SUVH1/SUVH3, which recruit it to methylated
      DNA. It promotes expression of nearby genes and activates transcription when tethered
      to DNA.
    supporting_text: Together, these data indicate that DNAJ1 and DNAJ2 interact with SUVH1
      and SUVH3, are recruited to sites of RdDM, and promote the expression of proximal genes.
  - statement: SDJ1 has no methyl-binding domain and depends on SUVH1/SUVH3 to reach DNA.
    supporting_text: DNAJ1 and DNAJ2 lack any discernible methyl-binding domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. This is the primary mechanistic paper. DNAJ1 here is At5g64360
      (TAIR attributes the IDA/IPI rows to this locus, and PMID:33445404 confirms that SDJ1 is
      At5g64360).
