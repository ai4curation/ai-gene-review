  title: Roles of IDM3 and SDJ1/2/3 in Establishment and/or Maintenance of DNA Methylation
    in Arabidopsis.
  findings:
  - statement: sdj1/2/3 triple mutants show DNA hypomethylation at a subset of RdDM loci, and
      SDJ1 interacts with the DDR components RDM1 and DMS3.
    supporting_text: SDJ1 and SDJ3 is capable of interacting separately with RDM1 and DMS3
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Abstract-only cache. Its methylation-establishment role contrasts with the
      unchanged methylation in dnaj1 dnaj2 reported by PMID:30523112. The two results may
      reflect genetic redundancy (triple versus double mutant) or locus-specific effects.
- id: PMID:33445404
  title: DnaJ Proteins Regulate WUS Expression in Shoot Apical Meristem of Arabidopsis.
  findings:
  - statement: SDJ1 (At5g64360) binds WUS (Y2H, BiFC, pull-down and co-IP) and enhances WUS
      promoter activity. It does not bind promoter DNA on its own, and it is nuclear.
    supporting_text: These results demonstrated a positive role of WUS-SDJ1/SDJ3/At5g09540 complex
      in WUS promoter activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. It confirms that At5g64360 is SDJ1. The SRDX dominant-repressor
      phenotypes are not used as evidence for process participation.
