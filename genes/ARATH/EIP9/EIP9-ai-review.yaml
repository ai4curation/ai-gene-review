  title: A methylated-DNA-binding complex required for plant development mediates transcriptional
    activation of promoter methylated genes.
  findings:
  - statement: SUVH1/SUVH3 interact with SDJ1, SDJ2 and SDJ3 to form the SUVH-SDJ complex,
      which has transcriptional activation activity.
    supporting_text: We demonstrate that the SUVH-SDJ complex components have transcriptional
      activation activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. It is independent confirmation of the SUVH-SDJ complex
