- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:30523112
  qualifier: enables
  review:
    summary: >-
      Harris et al. (2018) showed that SDJ1 (DNAJ1) fused to a heterologous DNA-binding
      domain stimulates reporter transcription. They used yeast one-hybrid assays, a
      ZF108 fusion in N. benthamiana and stable Arabidopsis lines, and a Gal4BD fusion in
      mouse N2a cells. In planta, SDJ1 is recruited to methylated DNA by SUVH1/SUVH3 and
      promotes expression of nearby genes.
    action: MODIFY
    reason: >-
      The experiments establish transcription-activating activity, but not DNA binding.
      DNA binding came from the fused ZF108 or Gal4 domain, and in vivo SDJ1 depends on
      SUVH1/SUVH3 to reach DNA. The authors also point out that SDJ1, unlike classical
      activators such as VP16, only enhances genes that are already expressed. A
      coactivator recruited by a DNA-binding partner fits GO:0003713 transcription
      coactivator activity, not a DNA-binding transcription factor term.
    proposed_replacement_terms:
    - id: GO:0003713
      label: transcription coactivator activity
    supported_by:
    - reference_id: PMID:30523112
      supporting_text: This suggested that DNAJ1 alone may be sufficient to stimulate expression
        of the reporter, which we confirmed in a yeast one hybrid assay
    - reference_id: PMID:30523112
      supporting_text: we transfected N2a cells and found that Gal4 DNA-binding domain (Gal4BD)–fused
        DNAJ1 was able to stimulate transcription of the reporter by 5- to 10-fold
    - reference_id: PMID:30523112
      supporting_text: Thus, SUVH1 and SUVH3 are required to recruit DNAJ1 and DNAJ2 to methylated
        DNA.
    - reference_id: PMID:30523112
      supporting_text: We reasoned that the transcriptional enhancement effect of DNAJ1 may be
        limited to genes that are already expressed, as opposed to traditional transcriptional
        activator proteins, such as VP16, that can activate transcription of stably silent genes
