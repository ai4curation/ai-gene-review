  review:
    action: UNDECIDED
    summary: The ASP5 localization exclusion remains unresolved.
    reason: The seeded annotation explicitly excludes cytosolic localization. Plastid/chloroplast targeting
      of ASP5 supports its principal organellar location, but does not alone establish absence of a minor
