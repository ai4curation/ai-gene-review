id: P46248
gene_symbol: ASP5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ASP5 is a plastid pyridoxal-phosphate-dependent aspartate aminotransferase that reversibly
  interconverts aspartate and 2-oxoglutarate with oxaloacetate and glutamate. It contributes to plastid
  amino-acid and organic-acid metabolism. Unlike the distinct plastid class-Ib enzyme PAT, recombinant
  ASP5 lacks detectable prephenate aminotransferase activity under the tested conditions.
