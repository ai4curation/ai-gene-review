  - id: GO:0006536
    label: glutamate metabolic process
suggested_questions:
- question: Which minor compartment assignments represent a stable active enzyme pool rather than transient
    association or proteomic co-purification?
suggested_experiments:
- experiment_type: native localization and isotope flux
  description: Combine endogenous tagging and controlled fractionation with labeled-substrate/product
    measurements in wild type, loss-of-function and complemented lines to resolve active compartment pools
    and physiological reaction direction.
