id: Q2LAE1
gene_symbol: SDG8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  SDG8/ASHH2/EFS/LAZ2 is a nuclear SET2-family histone lysine
  methyltransferase that maintains H3K36 di- and trimethylation on active
  Arabidopsis chromatin. It promotes transcription of FLC-clade flowering
  regulators, reproductive-development genes, brassinosteroid-responsive genes,
  immune-receptor genes and nitrate-responsive genes, and its H3K36me3 mark can
  recruit MRG-domain readers to flowering-gene loci.
