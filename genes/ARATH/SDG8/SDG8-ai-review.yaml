- id: PMID:25183522
  title: >-
    Arabidopsis MRG domain proteins bridge two histone modifications to elevate
    expression of flowering genes.
  findings:
  - statement: >-
      SDG8-dependent H3K36me3 recruits MRG1/MRG2 readers, which connect the mark
