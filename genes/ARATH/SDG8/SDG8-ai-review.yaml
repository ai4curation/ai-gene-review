- term:
    id: GO:0042800
    label: histone H3K4 methyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:16258034
  qualifier: enables
  review:
    summary: Reduced H3K4me3 in efs/sdg8 is not enough to prove direct H3K4 methylation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The 2005 FLC study observed lower H3K4me3 in efs/sdg8 but explicitly left
      open that the H3K4 change could be indirect or that EFS might methylate a
      different histone residue. Later locus-specific work found H3K36me3 to be
      the more consistent ASHH2-dependent mark, so the direct H3K4
      methyltransferase activity assertion overstates the evidence.
    supported_by:
    - reference_id: PMID:16258034
      supporting_text: >-
        EFS may act as an H3-K4 methyltransferase at FLC. We cannot rule out the
        possibility, however, that the primary target(s) of EFS is located
        elsewhere in the genome and the reduction in H3-K4 methylation seen at
        the FLC locus in efs mutants might be an indirect effect.
