- term:
    id: GO:0140954
    label: histone H3K36 dimethyltransferase activity
  evidence_type: IMP
  original_reference_id: PMID:18070919
  qualifier: enables
  review:
    summary: SDG8 is required for normal H3K36 dimethylation.
    action: NEW
    reason: >-
      SDG8 methylates oligonucleosomes in vitro, and 2008 bulk histone assays
      showed globally reduced H3K36me2 as well as H3K36me3 in sdg8 mutants.
      Later locus-specific ChIP studies found contexts where H3K36me3 is the
      main SDG8-dependent mark, so exact state-specific kinetics remain
      unresolved; nevertheless, the combined biochemical and mutant evidence
      supports production of H3K36me2 by SDG8.
    supported_by:
    - &sdg8_oligo
      reference_id: PMID:18070919
      supporting_text: >-
        The SET2 homologs SDG8 and SDG26 each can methylate oligonucleosomes in
        vitro, and both proteins are localized in the nucleus.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - &sdg8_di_tri
      reference_id: PMID:18070919
      supporting_text: >-
        The sdg8 but not the sdg26 mutant plants show a dramatically reduced
        level of both di- and trimethyl-H3K36 and an increased level of
        monomethyl-H3K36. SDG8 is thus specifically required for di- and
        trimethylation of H3K36.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    additional_reference_ids:
    - PMID:16299497
    - PMID:25183522
- term:
    id: GO:0140955
    label: histone H3K36 trimethyltransferase activity
  evidence_type: IMP
  original_reference_id: PMID:18070919
  qualifier: enables
  review:
    summary: SDG8 is the major Arabidopsis H3K36 trimethyltransferase.
    action: NEW
    reason: >-
      Loss of SDG8 markedly reduces H3K36me3 globally and at several endogenous
      target loci, and the 2014 MRG paper shows that this SDG8-dependent
      H3K36me3 is the mark read by MRG2. This agrees with the GO-CAM's SDG8
      H3K36 trimethyltransferase activity.
    supported_by:
    - *sdg8_di_tri
    - reference_id: PMID:25183522
      supporting_text: >-
        mutation of the Arabidopsis H3K36 methyltransferase SDG8 leads to a
        near complete abolishment of H3K36me3 and a slight reduction in H3K36me2
    - &sdg8_repro_chromatin
      reference_id: PMID:19915673
      supporting_text: >-
        This suggests that ASHH2 controls development of Arabidopsis
        reproductive organs via H3K36 trimethylation.
