- id: PMID:10518493
  title: >-
    The early-flowering mutant efs is involved in the autonomous promotion
    pathway of Arabidopsis thaliana.
  full_text_unavailable: true
  findings:
  - statement: >-
      The original efs mutant showed early flowering, small plants, reduced
      fertility and reduced apical dominance before EFS was mapped to
      At1g77300/SDG8.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached abstract inspected; useful for the phenotype history but not for
      assigning the molecular H3K36 methyltransferase activity.
- id: PMID:16258034
  title: >-
    Establishment of the vernalization-responsive, winter-annual habit in
    Arabidopsis requires a putative histone H3 methyl transferase.
  findings:
  - statement: >-
      EFS was mapped to At1g77300 and shown to be required for FLC-clade gene
      expression and for H3K4me3 at FLC chromatin, but the full text explicitly
      left open whether H3K4 was the direct SDG8 substrate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache. This paper supports chromatin regulation of FLC-clade
      transcription by EFS/SDG8; it does not directly establish SDG8 as an H3K4
      methyltransferase, and later work centers the direct catalytic role on
      H3K36.
- id: PMID:16299497
  title: >-
    Prevention of early flowering by expression of FLOWERING LOCUS C requires
    methylation of histone H3 K36.
  full_text_unavailable: true
  findings:
  - statement: >-
      Loss of SDG8 reduced FLC-associated H3K36 dimethylation and FLC
      expression, establishing SDG8-mediated H3K36 methylation as a chromatin
      requirement for FLC expression.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract inspected; the finding supports the H3K36me2 side of SDG8
      function but remains abstract-only after fallback retrieval.
- id: PMID:18070919
  title: >-
    Di- and tri- but not monomethylation on histone H3 lysine 36 marks active
    transcription of genes involved in flowering time regulation and other
    processes in Arabidopsis thaliana.
  full_text_unavailable: true
  findings:
  - statement: >-
      SDG8 methylates oligonucleosomes in vitro, localizes to the nucleus, and
      is required for normal H3K36me2 and H3K36me3 levels in Arabidopsis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract inspected. This is the central publication for the broad
      SDG8 H3K36 methyltransferase assignment, but exact state-specific kinetics
      remain unavailable from the abstract.
- id: PMID:19174535
  title: >-
    Regulation of carotenoid composition and shoot branching in Arabidopsis by a
    chromatin modifying histone methyltransferase, SDG8.
  findings:
  - statement: >-
      The ccr1/sdg8 mutant has altered carotenoid composition and increased
      shoot branching, correlated with low CRTISO expression and chromatin-mark
      changes around the CRTISO translation start site.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache. This paper links SDG8 chromatin activity to carotenoid
      composition and branching phenotypes, not to a separate catalytic
      function in carotenoid biosynthesis.
- id: PMID:19915673
  title: >-
    The ASH1 HOMOLOG 2 (ASHH2) histone H3 methyltransferase is required for
    ovule and anther development in Arabidopsis.
  findings:
  - statement: >-
      ashh2/sdg8 mutants reduce H3K36me3, but not H3K4me3 or H3K36me2, at
      selected reproductive-development genes.
    finding_review:
      finding_status: CURRENT
      review_notes: >-
        This locus-specific conclusion holds for AP1, AtDMC1 and MYB99 and
        reinforces H3K36me3 as the SDG8-dependent mark at those
        reproductive-development targets. It does not overturn the earlier
        bulk-histone result showing a global H3K36me2 defect in sdg8 plants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache. The paper reinforces H3K36me3 as the locus-specific mark
      most consistently tied to SDG8 at AP1, AtDMC1 and MYB99.
- id: PMID:20711170
  title: Growth habit determination by the balance of histone methylation activities in Arabidopsis.
  full_text_unavailable: true
  findings:
  - statement: >-
      SDG8/EFS acts with the FRI complex at FLC chromatin and was reported as a
      dual H3K4/H3K36 histone methyltransferase in the abstract.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract inspected. The FRI complex provides FLC recruitment
      context; the H3K4 side is treated cautiously because ASHH2-dependent
      H3K4me3 effects alone do not prove that SDG8 directly methylates H3K4.
- id: PMID:20949080
  title: Autoimmunity in Arabidopsis acd11 is mediated by epigenetic regulation of an immune receptor.
  findings:
  - statement: >-
      The laz2 suppressor is SDG8, and functional LAZ2/SDG8 is required for
      normal H3K36me3 at LAZ5 and RPM1 immune-receptor chromatin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache. The LAZ5/RPM1 data support SDG8-dependent H3K36me3 at
      immune loci rather than a distinct immune-receptor function of the SDG8
      protein.
- id: PMID:21282526
  title: >-
    The FRIGIDA complex activates transcription of FLC, a strong flowering
    repressor in Arabidopsis, by recruiting chromatin modification factors.
  findings:
  - statement: >-
      SDG8 co-purifies with FRI-C/SWR1-C components at FLC, providing
      recruitment context for its FLC chromatin role.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached paper retained from main; useful as chromatin-recruitment context
      rather than direct enzyme evidence.
