core_functions:
- description: >-
    H3K36 dimethyltransferase activity at Arabidopsis chromatin, supported by
    recombinant oligonucleosome methylation and by global loss of H3K36me2 in
    sdg8 mutants. Bulk-histone and locus-specific studies indicate that SDG8
    contributes to this step in a context-dependent way, with residual H3K36me2
    supplied by additional writer activity.
