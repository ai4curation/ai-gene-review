- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000719
  review:
    summary: This IEA comes from the generic protein kinase domain signature. In CRN the glycine-rich
      loop that positions ATP has diverged from GXGXXG to GXDXXG, and the catalytic loop lacks the active-site
      Asp. CRN shows no kinase activity.
    action: REMOVE
    reason: The domain-based ATP binding inference is contradicted by the pseudokinase features of CRN.
      No ATP binding has been shown, and its kinase-like function is catalysis-independent.
    supported_by:
    - reference_id: PMID:21398569
      supporting_text: The G-loop, GXGXXG, which binds and positions ATP, has diverged in CRN to GXDXXG.
    - reference_id: PMID:21398569
      supporting_text: CRN contains a His-Tyr-Asn (HYN) motif in the presumed catalytic loop instead of
        the His-Arg-Asp (HRD) motif typical of functional kinases and therefore lacks the critical active-site
        Asp
    - reference_id: PMID:21398569
      supporting_text: No activity was seen for either CRN protein, suggesting that wild-type CRN lacks
        autokinase activity under standard conditions.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: ISM
  original_reference_id: GO_REF:0000122
  qualifier: located_in
  review:
    summary: This is a sequence-based prediction of mitochondrial targeting. CRN is a single-pass plasma
      membrane protein that passes through the ER.
    action: REMOVE
    reason: It is contradicted by many experimental localization studies (plasma membrane and ER).
    supported_by:
    - reference_id: PMID:19843317
      supporting_text: Fluorescence targeting showed that CRN was localized to the plasma membrane.
    - reference_id: PMID:19933383
      supporting_text: We found that CLV2 and CRN require each other for export from the endoplasmic reticulum
        and localization to the plasma membrane (PM).
