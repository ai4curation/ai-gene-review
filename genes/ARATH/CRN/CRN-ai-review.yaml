id: Q9LYU7
gene_symbol: CRN
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'CORYNE (CRN; also SUPPRESSOR OF LLP1 2, SOL2) is a plasma membrane protein with a short
  extracellular region, a single transmembrane helix and a cytoplasmic kinase-like domain. The kinase-like
  domain is a pseudokinase: it has an HYN instead of an HRD catalytic loop and a degenerate glycine-rich
  loop, shows no autophosphorylation in vitro, and a kinase-dead variant fully complements crn-1. CRN
  associates with the receptor-like protein CLAVATA2 (CLV2) through transmembrane and juxtamembrane contacts,
  and the two proteins require each other to leave the endoplasmic reticulum and reach the plasma membrane.
  The CLV2/CRN complex acts in parallel with, and can associate with, CLV1/BAM receptor kinases and CIK
  co-receptor kinases to transmit the CLV3 peptide signal that restricts WUSCHEL expression and stem cell
  number in shoot and floral meristems. In roots, CRN is required in the protophloem for responses to
  root-active CLE peptides, partly by stabilizing the CLE45 receptor BAM3. Its kinase-like domain contributes
  to shoot but not root signalling. CRN is also needed for floral organ development and for perception
  of nematode CLE-like effectors.'
