core_functions:
- description: Plasma membrane pseudokinase that forms an obligate heteromeric receptor complex with CLV2,
    allowing ER export and surface delivery of both proteins. It serves as the kinase-like intracellular
    module of the kinase-less CLV2 co-receptor, which transmits the CLV3/CLE signal that restricts WUS
    expression and meristem size. In roots it stabilizes the BAM3 receptor.
  molecular_function:
    id: GO:0030159
    label: signaling receptor complex adaptor activity
  directly_involved_in:
  - id: GO:0010075
    label: regulation of meristem growth
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19933383
    supporting_text: We found that CLV2 and CRN require each other for export from the endoplasmic reticulum
      and localization to the plasma membrane (PM).
  - reference_id: PMID:21398569
    supporting_text: The additive nature of crn and clv1 alleles suggests that CRN may play a scaffolding
      role, perhaps to aid export of CLV2 to the plasma membrane
  - reference_id: PMID:21398569
    supporting_text: indicating that CRN does not require kinase activity for wild-type function
  - reference_id: PMID:18381924
    supporting_text: We show here that the novel receptor kinase CORYNE (CRN) and CLV2 act together, and
      in parallel with CLV1, to perceive the CLV3 signal.
  - reference_id: PMID:28607033
    supporting_text: CRN stabilizes BAM3 expression and thus is required for BAM3-mediated CLE45 signaling
suggested_questions:
- question: The CRN kinase-like domain is required for CLV3 signalling in the shoot but not in the root,
    even though it lacks catalytic activity. Does it act as an allosteric activator of a partner kinase
    (for example a CIK or CLV1) or as a docking site for RLCKs such as MAZZA?
suggested_experiments:
- description: Map CRN pseudokinase-domain interactors in shoot apex cells by TurboID proximity labelling
    with and without CLV3 peptide. Then test whether CRN pseudokinase-domain mutants that do not complement
    in the shoot lose specific interactors or reduce CIK/PBL phosphorylation.
  hypothesis: The CRN pseudokinase domain allosterically activates or recruits a catalytically active
    partner kinase during CLV3 signalling in the shoot.
  experiment_type: proximity labeling proteomics
