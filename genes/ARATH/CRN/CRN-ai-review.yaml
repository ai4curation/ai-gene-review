  original_reference_id: PMID:21398569
  qualifier: enables
  negated: true
  review:
    summary: Purified CRN kinase domain shows no autophosphorylation, while CLV1 does under the same conditions.
      A CRN K146E variant fully complements crn-1. CRN lacks the catalytic Asp of the HRD motif.
    action: ACCEPT
    reason: The NOT annotation is well supported by biochemistry, sequence and in vivo complementation.
