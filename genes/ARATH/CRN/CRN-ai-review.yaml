- term:
    id: GO:0001653
    label: peptide receptor activity
  evidence_type: IMP
  original_reference_id: PMID:28607033
  qualifier: enables
  review:
    summary: crn mutants are resistant to root-active CLE peptides, and protophloem-specific CRN restores
      sensitivity. CRN has essentially no ectodomain and is not thought to bind the peptide. It contributes
      by forming the CLV2/CRN complex, by trafficking CLV2 to the plasma membrane and by stabilizing BAM3.
    action: MODIFY
    reason: The IMP shows that CRN is required for CLE perception, not that it binds peptide. A receptor-complex
      scaffold activity describes the pseudokinase role better.
    proposed_replacement_terms:
    - id: GO:0030159
      label: signaling receptor complex adaptor activity
    supported_by:
    - reference_id: PMID:28607033
      supporting_text: the receptor-like protein CLAVATA 2 (CLV2) and the pseudokinase CORYNE (CRN) are
        necessary to fully sense root-active CLE peptides
    - reference_id: PMID:28607033
      supporting_text: CRN stabilizes BAM3 expression and thus is required for BAM3-mediated CLE45 signaling
    - reference_id: PMID:21398569
      supporting_text: The additive nature of crn and clv1 alleles suggests that CRN may play a scaffolding
        role, perhaps to aid export of CLV2 to the plasma membrane
    - reference_id: file:ARATH/CRN/CRN-deep-research-falcon.md
      supporting_text: short extracellular segment rather than an extracellular leucine-rich-repeat binding
        domain
