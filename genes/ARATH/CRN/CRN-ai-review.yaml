- term:
    id: GO:0010075
    label: regulation of meristem growth
  evidence_type: IDA
  original_reference_id: PMID:20697738
  qualifier: involved_in
  review:
    summary: crn mutants accumulate stem cells, like clv mutants, and CRN acts with CLV2 to restrict WUS
      and meristem size. In the root, CLV2/CRN mediate CLE14/CLE20-triggered root meristem reduction.
    action: ACCEPT
    reason: This is the central physiological output of CLV2/CRN signalling.
    supported_by:
    - reference_id: PMID:18381924
      supporting_text: Mutations in CRN cause stem cell proliferation, similar to clv1, clv2, and clv3
        mutants.
    - reference_id: PMID:21705761
      supporting_text: The CLAVATA1 (CLV1), CLV2, and CORYNE (CRN) receptors in Arabidopsis thaliana maintain
        cell proliferation in shoot apical meristems by restricting expression of the transcription factor
        WUSCHEL (WUS).
    - reference_id: PMID:20697738
      supporting_text: synthetic 12-amino-acid CLE14 and CLE20 peptides inhibit, irreversibly, root growth
        by reducing cell division rates in the root apical meristem
