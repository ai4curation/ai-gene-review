taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  SSU3 (IPMI SSU3, AtLeuD2, IPMI1; At3g58990) is one of three small subunits (LeuD family)
  of the plastid heterodimeric isopropylmalate isomerase (IPMI) in Arabidopsis. It pairs with
  the single large subunit IIL1 (LeuC), supplying the aconitase domain-4-like region that
  forms the substrate recognition site, and thereby determines the substrate preference of
  the heterodimer. Together with its close paralog SSU2, SSU3 is specialized for the methionine
  chain-elongation pathway of aliphatic glucosinolate biosynthesis, where the LSU1:SSU2/3
  isomerase converts 2-(omega-methylthio)alkylmalates into the corresponding 3-alkylmalates
  in successive elongation cycles; SSU2/SSU3 are required for the formation of the longest
  (C7, C8) aliphatic glucosinolates. The SSU3-containing enzyme can also isomerize 2-isopropylmalate,
  but SSU3 contributes little to leucine biosynthesis under normal conditions, a role filled
  by the essential SSU1. SSU3 is co-regulated with other aliphatic glucosinolate genes by
  MYB28, is expressed in and around the vasculature (phloem- and xylem-associated cells) of
  roots, hypocotyls, leaves and inflorescence stems, and localizes to chloroplasts (stroma).
  Single ssu3 mutants have no visible phenotype because of redundancy with SSU2.
