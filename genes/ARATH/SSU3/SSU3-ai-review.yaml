    summary: PAINT inference that the LeuD family acts in L-leucine biosynthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The ancestral LeuD function is Leu biosynthesis, but SSU3 is a Brassicaceae-specific
      paralog that has been recruited to Met chain elongation. Target-specific evidence shows
      divergence: the ssu2 ssu3 double knockout does not accumulate IPM and has normal Leu
      synthesis, whereas SSU1 (LeuD3) is the essential Leu-pathway small subunit. SSU3 can
      contribute only residually to Leu synthesis when SSU1 is depleted. Not strictly wrong,
      but it misrepresents the in vivo role of this paralog.
    supported_by:
    - &id003
