suggested_questions:
- question: >-
    What are the kinetic preferences of reconstituted LSU1:SSU3 versus LSU1:SSU2 heterodimers
    across the C3-C8 2-(omega-methylthio)alkylmalate series, and do the different SRR sequences
    (YGTLI vs AACTF) confer distinct chain-length preferences?
- question: >-
    Is SSU3 a true functional duplicate of SSU2, or do subtle expression (hypocotyl, epidermal)
    or kinetic differences give it a distinct role?
- question: >-
    Should the SSU2/SSU3 contribution to Leu synthesis under SSU1 deficiency be captured in
    GO, or is L-leucine biosynthesis properly restricted to SSU1 for these paralogs?
suggested_experiments:
- description: >-
    Purify recombinant LSU1:SSU3 heterodimer and determine kcat/Km with 2-IPM and each 2-(omega-methylthio)alkylmalate
    (C1-C6 side-chain homologues).
  experiment_type: in vitro enzyme kinetics
- description: >-
    Generate ssu3 single mutants in Col-0 (CRISPR) to remove the Ws background confound and
    profile aliphatic glucosinolates and chain-elongation intermediates alone and in combination
    with ssu2.
  experiment_type: reverse genetics/metabolomics
- description: >-
    Co-IP of tagged SSU3 from chloroplasts to test in vivo heterodimerization with IIL1 and
    possible association with IPMDH1/MAM1.
  experiment_type: protein interaction
