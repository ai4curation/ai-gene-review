      Three mutants of the crucifer Arabidopsis thaliana (Linnaeus) Heynhold were isolated that are
      completely lacking in activity catalyzed by serine-glyoxylate aminotransferase (EC 2.6.1.45), a
      peroxisomal enzyme involved in photorespiratory carbon metabolism.
suggested_questions:
- question: >-
    How much of the in vivo SGAT flux uses alanine rather than serine as amino donor, given the
    divergent recombinant and native-enzyme kinetics?
- question: >-
    Does AGT1-mediated asparagine transamination in roots contribute measurably to nitrogen
    remobilization, independently of photorespiration?
suggested_experiments:
- description: >-
    Feed 15N-asparagine and 15N-alanine to wild type and sat/agt1 knockout roots and leaves at
    ambient and high CO2 to quantify AGT1-dependent asparagine and alanine transamination in vivo.
