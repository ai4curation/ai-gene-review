core_functions:
- description: >-
    Peroxisomal serine:glyoxylate aminotransferase of the photorespiratory C2 cycle, converting serine
    to hydroxypyruvate while aminating glyoxylate to glycine; the single, non-redundant SGAT whose loss
    (sat mutants) is lethal in air.
