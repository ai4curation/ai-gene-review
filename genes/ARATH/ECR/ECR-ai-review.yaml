- id: file:ARATH/ECR/ECR-deep-research-falcon.md
  title: Falcon deep research report for ECR (At3g55360)
  findings:
  - statement: Synthesizes ECR/CER10 as the ER membrane very-long-chain enoyl-CoA reductase catalyzing
      the final step of each elongation cycle, with broad chain-length specificity.
    supporting_text: This localization was demonstrated through GFP fusion studies showing that functional
      GFP-ECR labels a reticulate network characteristic of the ER
suggested_questions:
- question: Why is loss of ECR/CER10 viable in Arabidopsis whereas loss of KCR1 or PAS2 is embryo lethal?
    Which enzyme (e.g. a steroid 5-alpha-reductase-like paralog) provides residual enoyl-CoA reductase
    activity?
- question: Do the cell-expansion and endocytic trafficking defects of cer10 arise specifically from altered
    sphingolipid acyl-chain length, and which sphingolipid species are responsible?
suggested_experiments:
- description: Measure residual microsomal enoyl-CoA reductase activity and enoyl-CoA intermediates in
    cer10 null mutants, and test candidate paralogs by yeast tsc13 complementation and higher-order mutant
    analysis.
- description: Rescue cer10 with epidermis-, seed- or sphingolipid-relevant tissue-specific promoters
    and profile sphingolipid species to link specific VLCFA-containing lipids to the cell-expansion phenotype.
