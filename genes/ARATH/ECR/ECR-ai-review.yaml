taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ECR (very-long-chain enoyl-CoA reductase; also ECERIFERUM10/CER10, AtTSC13, AOD2; At3g55360)
  is the enoyl reductase of the endoplasmic reticulum fatty acid elongase in Arabidopsis and the ortholog
  of yeast TSC13 and animal TECR. A member of the steroid 5-alpha-reductase-like family, it is a multi-pass
  integral ER membrane protein distributed uniformly over the ER. ECR catalyzes the fourth and final step
  of each very-long-chain fatty acid (VLCFA) elongation cycle, the NADPH-dependent reduction of trans-2,3-enoyl-CoA
  (produced by the dehydratase PAS2, with which it interacts) to a saturated acyl-CoA two carbons longer
  than the primer. As a shared, broadly expressed elongase subunit it participates in all VLCFA elongation
  reactions, supplying VLCFAs for cuticular waxes, seed triacylglycerols and sphingolipids. cer10 mutants
  are glossy (reduced wax), have altered sphingolipid and seed VLCFA composition, and show reduced organ
  size, organ fusion and defective cell expansion and endocytic trafficking attributed to abnormal sphingolipids;
  unlike KCR1 and PAS2 null mutants they are viable.
