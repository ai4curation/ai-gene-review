core_functions:
- description: Nuclear bHLH DNA-binding transcription factor that binds G-box-type cis-elements and activates
    jasmonate-responsive genes, acting additively with MYC2 and MYC4. Its activity is repressed by JAZ
    proteins binding the N-terminal JID and released upon JA-Ile-triggered JAZ degradation.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
