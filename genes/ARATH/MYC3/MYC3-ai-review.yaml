  review:
    summary: Interaction reported in a study of MYC3 repression of the florigen gene FT.
    action: REMOVE
    reason: The cached record is abstract-only; the abstract describes MYC3 binding to the ACGGAT motif
      in the FT locus and stabilization by DELLAs, and the specific protein-protein assay behind this
      row is not visible. Generic protein binding adds no functional information, and removal does not
      imply the interaction is false; the FT-regulatory role is better captured by transcription factor
      and flowering annotations.
