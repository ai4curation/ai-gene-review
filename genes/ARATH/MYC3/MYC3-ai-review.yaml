    label: positive regulation of DNA-templated transcription
  - id: GO:0009867
    label: jasmonic acid mediated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:21335373
    supporting_text: They both are nuclear proteins that bind DNA with sequence specificity similar to
      that of MYC2.
  - reference_id: PMID:21321051
    supporting_text: MYC2, MYC3, and MYC4 were all capable of inducing expression of JAZ::GUS reporter
      constructs following transfection of carrot protoplasts.
  - reference_id: PMID:21335373
    supporting_text: Our results show that MYC3 and MYC4 are activators of JA-regulated programs that
      act additively with MYC2 to regulate specifically different subsets of the JA-dependent transcriptional
      response.
  - reference_id: PMID:26258305
    supporting_text: In this position, the Jas helix competitively inhibits MYC3 interaction with the
      MED25 subunit of the transcriptional Mediator complex.
proposed_new_terms: []
suggested_questions:
- question: Which jasmonate-responsive targets are preferentially controlled by MYC3 rather than MYC2
    or MYC4, given their nearly identical DNA-binding specificity?
- question: Is MYC3 repression of FT mechanistically linked to JAZ-MYC3 regulation, i.e. does jasmonate
    signaling affect flowering time through MYC3?
suggested_experiments:
- description: Genome-wide binding (ChIP-seq/DAP-seq) of MYC2, MYC3 and MYC4 in matched tissues with and
    without JA-Ile, combined with single and higher-order mutant transcriptomes.
  hypothesis: MYC3 shares most binding sites with MYC2 but contributes uniquely to specific target subsets
    through tissue-specific expression and partner availability.
