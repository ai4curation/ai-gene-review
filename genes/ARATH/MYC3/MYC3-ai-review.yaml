gene_symbol: MYC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: MYC3 (bHLH005, ATR2) is a nuclear basic helix-loop-helix transcription factor of the subgroup
  IIIe MYC clade that acts with its paralogs MYC2 and MYC4 as a master activator of jasmonate-responsive
  gene expression in Arabidopsis. MYC3 binds G-box (CACGTG) and related cis-elements with a specificity
  nearly identical to MYC2, forms homo- and heterodimers with MYC2 and MYC4, and recruits the Mediator
  subunit MED25 through its N-terminal JAZ-interaction domain (JID). In the resting state, the Jas motif
  of JAZ repressors binds the JID, displacing the MYC N-terminal helix and competitively blocking MED25
  recruitment; JA-Ile-triggered degradation of JAZ proteins by SCF(COI1) releases MYC3. MYC3 acts additively
  with MYC2 and MYC4 to control defense against bacteria and insect herbivores, glucosinolate and anthocyanin
  production, jasmonate-mediated growth responses and stomatal development, and also represses the florigen
  gene FT in photoperiodic flowering.
