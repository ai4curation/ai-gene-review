suggested_questions:
- question: Which enzymes account for the residual JA-Ile (about 10-15% of wild type) that accumulates
    in jar1 null mutants, and do they contribute in specific tissues?
- question: Is the far-red/phytochrome A phenotype of fin219 explained entirely by reduced JA-Ile production,
    or does FIN219 have a JA-Ile-independent light-signaling function?
suggested_experiments:
- description: Complement fin219/jar1 null mutants with a catalytically dead JAR1 (acyl-adenylate motif
    mutant) and test far-red hypocotyl and jasmonate phenotypes in parallel with JA-Ile quantification.
  hypothesis: All FIN219/JAR1 phenotypes, including far-red light responses, require its JA-conjugating
    activity.
