core_functions:
- description: Jasmonoyl-L-amino acid synthetase that adenylates jasmonic acid and conjugates it to L-isoleucine,
    producing the bioactive hormone JA-Ile that is perceived by the COI1-JAZ co-receptor. Acts in the
    cytoplasm; required for most JA-Ile accumulation in seedlings and after wounding.
  molecular_function:
    id: GO:0080123
    label: jasmonoyl-L-amino acid ligase activity
  directly_involved_in:
  - id: GO:0009694
    label: jasmonic acid metabolic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15258265
    supporting_text: analysis of products produced in vitro by recombinant JAR1 demonstrated that this
      enzyme forms JA-amido conjugates with several amino acids, including JA-Ile.
  - reference_id: PMID:15258265
    supporting_text: JA-Ile was found at 29.6 pmole g(-1) fresh weight (FW) in the wild type but was more
      than sevenfold lower in two jar1 alleles.
  - reference_id: PMID:18247047
    supporting_text: Kinetic analysis showed that JAR1 had a K (m) of 0.03 mM for Ile, which was 60-80-fold
      lower than for Leu, Val and Phe.
  - reference_id: PMID:22628555
    supporting_text: Here, we report the crystal structures of benzoate-specific Arabidopsis thaliana
      AtGH3.12/PBS3 and jasmonic acid-specific AtGH3.11/JAR1.
  - reference_id: PMID:10921909
    supporting_text: GUS–FIN219 was located in the cytoplasm both in darkness and in the light
