taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  LCYB (lycopene beta cyclase, chloroplastic; EC 5.5.1.19; also LCY1, LYC and SZL1)
  is the single major nuclear-encoded, plastid-targeted lycopene beta-cyclase of
  Arabidopsis. It is a flavoprotein (FAD/NAD(P)-binding fold) of the lycopene cyclase
  family that folds the psi end groups of all-trans-lycopene into six-membered
  beta-ionone rings. Two successive beta-cyclizations convert lycopene, via
  gamma-carotene, to beta-carotene; acting on the monocyclic delta-carotene made by
  lycopene epsilon cyclase (LCYE), LCYB adds the beta ring that completes alpha-carotene.
  The enzyme thus sits at the first committed branch point of cyclic-carotenoid
  biosynthesis, partitioning flux between the beta,beta-carotenoid branch (beta-carotene
  and the beta,beta-xanthophylls zeaxanthin, violaxanthin and neoxanthin) and the
  beta,epsilon branch (alpha-carotene and lutein). Ring formation is redox-neutral: the
  reduced FAD cofactor assists catalysis rather than being consumed, so LCYB is an
  intramolecular lyase/isomerase, not an oxidoreductase. The protein carries an
  N-terminal chloroplast transit peptide and functions as a membrane-associated enzyme
  of the chloroplast. Cyclic carotenoids made downstream of LCYB are essential
  structural and photoprotective pigments of the photosynthetic apparatus, and altered
  LCYB flux changes the carotenoid pigment composition of the plant.
