    label: carotenoid biosynthetic process
  - id: GO:1901812
    label: beta-carotene biosynthetic process
  - id: GO:0016123
    label: xanthophyll biosynthetic process
  locations:
  - id: GO:0009507
    label: chloroplast
  substrates:
  - id: CHEBI:15948
    label: lycopene
  supported_by:
