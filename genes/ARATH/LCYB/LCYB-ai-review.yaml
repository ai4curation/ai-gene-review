suggested_questions:
- question: >-
    What is the sub-plastidial location and membrane topology of Arabidopsis LCYB in
    vivo, and does it act at the chloroplast envelope, the thylakoid, or both? Chloroplast
    localization is well supported, but the exact intraplastid site of the
    membrane-associated cyclase for Q38933 is unresolved.
  experts:
  - Barry J. Pogson
  - Manuel Rodriguez-Concepcion
- question: >-
    How is carbon partitioning at the lycopene branch point controlled between LCYB
    (beta,beta) and LCYE (beta,epsilon), and what determines whether LCYB adds one or
    two beta rings? The 1996 work established the branch point but the kinetic and
    regulatory basis of partitioning in planta is not quantified.
  experts:
  - Francis X. Cunningham
suggested_experiments:
- hypothesis: >-
    Arabidopsis LCYB is an FAD-dependent, redox-neutral lycopene beta-cyclase that
    converts all-trans-lycopene to beta-carotene via gamma-carotene and adds the beta
    ring to delta-carotene to form alpha-carotene.
  description: >-
    Express and purify mature His-tagged Arabidopsis LCYB, reconstitute in
    liposomes with FAD, and assay against all-trans-lycopene and against delta-carotene
    (with LCYE) following gamma-carotene, beta-carotene and alpha-carotene intermediates
    and products by C30 reversed-phase HPLC-PDA/MS; test FAD dependence and confirm the
    absence of net redox change and oxygen consumption.
  experiment_type: in vitro enzyme assay with purified recombinant protein
- hypothesis: >-
    LCYB resides in a specific chloroplast membrane compartment and its loss reduces
    beta,beta-xanthophylls while redirecting flux to the lutein branch.
  description: >-
    Localize a native-promoter LCYB-GFP fusion (complementing szl1) by confocal imaging
    and by immunoblot of purified envelope/stroma/thylakoid fractions; compare carotenoid
    profiles (beta-carotene, zeaxanthin, violaxanthin, neoxanthin, lutein, alpha-carotene)
    in wild type, szl1 and LCYB-overexpression backgrounds by HPLC.
  experiment_type: subcellular localization plus metabolite profiling of mutant and
    overexpression lines
