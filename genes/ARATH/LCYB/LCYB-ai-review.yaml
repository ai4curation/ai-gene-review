core_functions:
- description: >-
    Lycopene beta cyclase activity: folds the psi end groups of all-trans-lycopene into
    beta-ionone rings, converting lycopene via gamma-carotene to bicyclic beta-carotene
    (and adding the beta ring to delta-carotene to complete alpha-carotene in
    cooperation with LCYE). A membrane-associated, FAD-dependent, redox-neutral
    intramolecular lyase of the chloroplast; the committed branch point of cyclic
    carotenoid biosynthesis.
  molecular_function:
    id: GO:0045436
    label: lycopene beta cyclase activity
  directly_involved_in:
