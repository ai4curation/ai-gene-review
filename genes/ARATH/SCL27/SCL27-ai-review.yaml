suggested_questions:
- question: >-
    Which direct SCL27 target promoters mediate its shoot- and
    root-meristem-maintenance phenotypes, and do SCL22 and SCL6 bind the same
    sites or a partially distinct HAM regulon?
- question: >-
    The GO-CAM model 67e5e74400000148 enables H4K5 acetyltransferase activity
    with AT2G45160/SCL27, but the reviewed AT2G45160 product is a GRAS-family
    transcription factor. Should that activity be repointed to the unrelated
    MYST-family histone acetyltransferase HAM1 encoded by AT5G64610?
suggested_experiments:
- description: >-
    Perform SCL27 ChIP-seq in young leaves and shoot apices under wild-type,
    MIR171c-overexpressing and DELLA-stabilized backgrounds to separate direct
    PORC/MIR171 feedback targets from meristem maintenance targets.
  experiment_type: ChIP-seq
  hypothesis: >-
    DELLA binding attenuates a subset of SCL27 chromatin interactions,
    including PORC, while redundant HAM targets in the meristem require SCL22
    and SCL6 compensation or additional tissue-specific partners.
