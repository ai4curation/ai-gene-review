gene_symbol: SCL27
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  SCL27, also called AtHAM1 and SCL6-II, is an Arabidopsis GRAS-family nuclear
  transcription factor. Its variable N-terminal region and C-terminal GRAS
  domain place it in the HAM/LOM clade of miR171-targeted regulators, together
  with the partially redundant Arabidopsis proteins SCL22/AtHAM2/SCL6-III and
  SCL6/AtHAM3/SCL6-IV. Genetic analyses of higher-order ham/lom mutants show
  that this clade maintains indeterminate shoot and root meristems, supports
  shoot branching, and helps keep root hair growth polarized. SCL27 also binds
  GT cis-elements in the PORC and MIR171a promoters, represses
  protochlorophyllide oxidoreductase gene expression in the light, and forms a
  gibberellin-regulated module with DELLA proteins that tunes chlorophyll
  biosynthesis and early leaf growth.
