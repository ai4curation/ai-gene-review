gene_symbol: FKBP62
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ROF1 (ROTAMASE FKBP 1, AtFKBP62) is a large cytosolic immunophilin of the FKBP4/FKBP5 (FKBP52/FKBP51)
  type, with three N-terminal FK506-binding domains (only the first predicted to be an active peptidyl-prolyl cis-trans
  isomerase), a C-terminal tetratricopeptide repeat (TPR) domain and a putative calmodulin-binding region. Through
  its TPR domain it binds HSP90.1 and acts as an HSP90 co-chaperone. Under normal conditions ROF1 is cytoplasmic;
  after heat stress the ROF1-HSP90.1 complex moves to the nucleus in an HsfA2-dependent manner, and ROF1 is required
  to sustain HsfA2-regulated small HSP expression and long-term acquired thermotolerance. During recovery from heat
  stress ROF1 and HSP90.1 are targeted for selective autophagy by NBR1, resetting heat stress memory. ROF1 heterodimerizes
  with its paralog ROF2/FKBP65, which acts antagonistically in the heat response. ROF1 also binds PI(3)P and PI(3,5)P2
  through its first FKBP domain in vitro, associates with the cell periphery, and contributes to germination under
  salt and osmotic stress. Its expression is induced by heat, salt, wounding and high light.
