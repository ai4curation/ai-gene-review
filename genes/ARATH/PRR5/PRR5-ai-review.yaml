- term:
    id: GO:0009414
    label: response to water deprivation
  evidence_type: IEP
  original_reference_id: PMID:41566362
  qualifier: involved_in
  review:
    summary: >-
      Expression-pattern annotation from a GWAS of seedling root growth under PEG-simulated drought (Marik
      et al. 2026). The cached abstract does not mention PRR5, and the full text is not available in the
      cache. The specific basis of the annotation (an expression change or a GWAS association) cannot
      be seen, and the cited study's focus is on other loci.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      An expression-level (IEP) or GWAS-association signal does not establish that PRR5 itself functions
      in a water-deprivation response; this is the same standard applied to the ELF3 auxin/ABA IEP rows in
      this review. In addition, the candidate genes the study validated by reverse genetics are listed
      explicitly in the abstract and PRR5 is not among them (quoted below). The full text is not cached,
      so the exact basis of the TAIR row could not be inspected; the over-annotation call rests on the
      evidence-type argument plus the visible candidate list, not on unseen data. PRR5's established role
      is as a clock transcriptional repressor.
    supported_by:
    - reference_id: PMID:41566362
      supporting_text: >-
        Reverse genetic evaluation using T-DNA insertion knockout/knockdown mutants confirmed the involvement
        of candidate genes: AT1G06690 (PLP pathway), AT4G26990, RBP45C (stress granules), ACD55.5 (protein
        folding), PCMP-A4 (AT1G14470; RNA editing), SKS6, ANAC094 (cell wall remodelling) and INCENP (cell
        cycle), with seedling drought tolerance.
