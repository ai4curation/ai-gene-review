id: Q6LA42
gene_symbol: PRR5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PSEUDO-RESPONSE REGULATOR 5 (PRR5, APRR5) is a nuclear transcriptional repressor of the Arabidopsis
  circadian oscillator whose expression and protein peak in the afternoon to early evening, after PRR9
  and PRR7. It has an N-terminal pseudo-receiver (PR) domain, which lacks the phospho-accepting aspartate,
  and a C-terminal CCT motif through which it associates with target promoters, which are enriched in
  G-box-like elements. PRR5 represses CCA1 and LHY, acting with PRR9 and PRR7 and recruiting TOPLESS/TPR
  corepressors. It also directly represses many clock-output transcription factors that control flowering
  time (CDFs), hypocotyl elongation (PIF4/PIF5) and cold-stress responses. PRR5 heterodimerizes with TOC1
  through their PR domains, promoting TOC1 phosphorylation, nuclear accumulation and recruitment to subnuclear
  foci. PRR5 protein is rhythmically turned over: its phosphorylated form is recognised through the PR
  domain by the F-box photoreceptor ZEITLUPE (SCF-ZTL) and degraded by the 26S proteasome, mainly in the
  dark, and O-fucosylation by SPINDLY also promotes its proteolysis. prr5 mutants have a shortened period,
  and in combination with prr7/prr9 they lose rhythmicity.
