suggested_questions:
- question: >-
    How do PRR5 phosphorylation (which favours ZTL binding) and SPY-mediated O-fucosylation combine to
    set the timing of PRR5 degradation in the evening?
- question: >-
    Does the PRR5-TOC1 heteromer bind DNA as a unit, and does it repress a different target set from either
    protein alone?
suggested_experiments:
- description: >-
    Map PRR5 phosphosites and O-fucosylation sites, and test non-modifiable mutants for ZTL binding, half-life
    and period in prr5 complementation lines.
  hypothesis: >-
    Site-specific phosphorylation and O-fucosylation of PRR5 are each required for timely SCF-ZTL-mediated
    degradation.
