suggested_questions:
- question: >-
    Which vernalization-specific factors target the sequence-nonspecific VRN1 to FLC, and does VRN1 physically
    associate with PRC2, LHP1 or VAL1 at the nucleation region?
- question: >-
    What essential developmental processes are revealed by VRN1-SRDX, and which B3 paralogs act redundantly
    with VRN1?
suggested_experiments:
- hypothesis: >-
    VRN1 is recruited to FLC after cold by interaction with Polycomb maintenance factors.
  description: >-
    Profile VRN1 genome-wide by ChIP-seq before, during and after vernalization in wild type, vrn2 and
    lhp1 backgrounds. Use IP-MS of VRN1 to identify partners and test whether the DNA-binding-dead R249E/R289E/R296E
    mutant complements vrn1.
