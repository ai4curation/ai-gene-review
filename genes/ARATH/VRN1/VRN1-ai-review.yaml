taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  VRN1 (VERNALIZATION 1) is a nuclear Arabidopsis protein with two plant-specific B3 DNA-binding domains.
  Unlike most B3 proteins, it binds DNA without sequence specificity, through a defined positively charged
  surface on the second B3 domain. VRN1 associates broadly with euchromatic chromosomes (not chromocenters)
  in interphase and mitosis, but not in meiosis, independently of vernalization or VRN2. It is required
  to maintain the stable repression of the floral repressor FLC after winter cold: in vrn1 mutants FLC
  is down-regulated in the cold but reactivated afterwards. It needs vernalization-specific factors to
  act at FLC. VRN1 also has vernalization-independent roles in flowering (through FT, seen on overexpression)
  and, judging from dominant repressor fusions that overcome redundancy, in essential developmental processes.
