- term:
    id: GO:0046294
    label: formaldehyde catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:87929
  - PANTHER:PTN000191653
  - SGD:S000002327
  - UniProtKB:P25437
  review:
    summary: A class-III ancestral function has propagated into the derived plant class-P ADH1 branch.
    action: REMOVE
    reason: The PTHR43880 family review identifies PTN000191653 as a defensible ancestral class-III node
      but calls for pruning of plant class-P SF26, including P06525. Primary evolutionary work establishes
      duplication and new substrate specificity; direct ADH1 biochemistry establishes alcohol/aldehyde
      chemistry. This is a target-branch divergence argument, not criticism of donor count or ancestral
      class-III evidence. The ethanol-versus-GSNO comparison is corroborating evidence of specialization,
      not a direct negative assay of S-(hydroxymethyl)glutathione oxidation.
    supported_by:
    - reference_id: file:ARATH/ADH1/ADH1-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PTHR43880:SF26; ALCOHOL DEHYDROGENASE CLASS-P; 1.
    - reference_id: PMID:9215914
      supporting_text: plant class P genes have evolved from class III genes by gene duplication and acquisition
        of new substrate specificities.
    - reference_id: file:interpro/panther/PTHR43880/PTHR43880-review.yaml
      supporting_text: Plant class P ADHs (SF26, SF9, SF40, SF59) and vertebrate class II ADH4 (SF14)
        inherit formaldehyde catabolism without any evidence that they act on formaldehyde.
    - reference_id: PMID:38308388
      supporting_text: ADH1 and GSNOR showed strict specificity for their substrates (ethanol and GSNO,
        respectively)
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000191653
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Class-III source evidence supports the ancestral function. The existing family phylogeny
          review requires pruning the derived plant class-P SF26 branch containing this target, rather
          than relocating or discarding the valid ancestral assertion.
      residue_claims_not_applicable: The evidence concerns documented class-level evolutionary and substrate
        divergence, not an asserted loss of a particular residue.
