    label: response to cold
  evidence_type: IEP
  original_reference_id: PMID:11987307
  qualifier: involved_in
  review:
    summary: Cold induces ADH transcript accumulation.
    action: KEEP_AS_NON_CORE
    reason: Retain the experimentally observed response as contextual. The cold study explicitly found
      ADH activity unnecessary for acquisition of freezing tolerance, so induction is not evidence that
      ADH1 drives freezing protection.
    supported_by:
    - reference_id: PMID:12231733
      supporting_text: mRNA encoding alcohol dehydrogenase (ADH) increases in etiolated seedlings and
        leaves of Arabidopsis thaliana (L.) Heynh. upon exposure to low temperature.
