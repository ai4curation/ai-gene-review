id: P06525
gene_symbol: ADH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ADH1 is a cytosolic zinc-dependent class-P alcohol dehydrogenase of Arabidopsis thaliana.
  Its homodimeric enzyme catalyzes NAD(H)-dependent interconversion of alcohols and aldehydes, including
  reduction of acetaldehyde to ethanol during oxygen limitation. This reaction contributes to cellular
  redox balance and hypoxic adaptation, especially in roots. Purified ADH1 accepts a range of primary
  and secondary alcohols and is functionally distinct from the class-III glutathione-dependent enzyme
  GSNOR. ADH1 expression responds to hypoxia and several other stresses, but mutant seedlings can retain
  ethanol production through incompletely defined alternative activity.
