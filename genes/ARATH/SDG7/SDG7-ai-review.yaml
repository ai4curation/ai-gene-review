core_functions:
- description: >-
    Probable chromatin H3K36 methyltransferase activity that contributes to the
    residual H3K36me2/H3K36me3 present in sdg8 mutants. This activity is
    inferred from the sdg7 sdg8 double-mutant mark phenotype and remains weaker
    than the direct SDG8 H3K36 methyltransferase assignment.
