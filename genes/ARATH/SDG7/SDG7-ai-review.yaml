suggested_questions:
- question: >-
    Does purified SDG7 methylate H3K36 on nucleosomes, and does it preferentially
    mono-, di-, or trimethylate that residue?
- question: >-
    How does the ER-associated AtPIP2;1 lysine methyltransferase activity of
    SDG7 relate to the genetically inferred chromatin H3K36 methyltransferase
    activity?
