- id: PMID:21062871
  title: O-carboxyl- and N-methyltransferases active on plant aquaporins.
  findings:
  - statement: >-
      Recombinant Arabidopsis SDG7 methylates Lys3 in the AtPIP2;1 aquaporin
      N-terminal tail, and SDG7 was associated with the endoplasmic reticulum by
      confocal microscopy.
    supporting_text: >-
      SDG7 was shown to almost exclusively mono- or di-methylate Lys3.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. This is the primary direct biochemical and
      localization evidence for SDG7 as an AtPIP2;1 protein-lysine
      methyltransferase rather than a histone methyltransferase.
- id: PMID:21533090
  title: Arabidopsis plasmodesmal proteome.
  findings:
  - statement: >-
      A high-throughput plasmodesmatal proteome detected many Arabidopsis
      proteins, but the cached text does not expose the supplemental row for
      SDG7/At2g44150.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Full-text cache, but the SDG7-specific evidence is in a supplemental
      protein table that is not present in the cache; the plasmodesma row is
      therefore left undecided.
- id: PMID:25183522
  title: >-
    Arabidopsis MRG domain proteins bridge two histone modifications to elevate
    expression of flowering genes.
  findings:
  - statement: >-
      Xu et al. implicated SDG7 only genetically: loss of SDG7 in the sdg8
      background eliminates the residual H3K36me2/H3K36me3 marks that remain
      when SDG8 alone is mutated.
    supporting_text: >-
      The double mutant with another close homologue of SDG8, sdg7 sdg8 fully
      abolishes both the di- and tri-methylation marks at H3K36
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache. The paper supports SDG7 as a plausible residual
      Arabidopsis H3K36 methyltransferase, but it does not purify SDG7 or show
      that SDG7 alone catalyzes the exact H3K36 dimethyltransferase reaction
      used in GO-CAM 67e5e74400000148.
