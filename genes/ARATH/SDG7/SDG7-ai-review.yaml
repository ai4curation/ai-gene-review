id: Q945S8
gene_symbol: SDG7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  SDG7/ASHH3 is an Arabidopsis SET-domain lysine methyltransferase with two
  incompletely reconciled functional contexts. Recombinant SDG7 methylates the
  N-terminal Lys3 of the aquaporin AtPIP2;1 and a fluorescent SDG7 fusion was
  associated with the endoplasmic reticulum. SDG7 is also an ASH1/SET2-family
  homolog that is inferred to contribute to nuclear H3K36 methylation because
  the sdg7 sdg8 double mutant eliminates the H3K36me2/H3K36me3 signal that
  persists after loss of SDG8 alone.
