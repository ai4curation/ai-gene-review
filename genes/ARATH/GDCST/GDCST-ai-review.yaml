- term:
    id: GO:0009853
    label: photorespiration
  evidence_type: IMP
  original_reference_id: PMID:28866761
  review:
    summary: The glycine cleavage T protein catalyses a step of the photorespiratory
      conversion of glycine to serine in leaf mitochondria. A T-protein knockdown accumulates
      glycine in air.
    action: NEW
    reason: >-
      Participation test: GDCST does work in the pathway, because it catalyses
      the aminomethyl transfer that produces the 5,10-methylene-THF used by SHM1
      in the photorespiratory glycine-to-serine conversion. It is not merely
      required for the pathway. Comparator check: the other enzymes of the C2
      cycle that catalyse a step (SHM1, GGAT1, AGT1, HPR, GLYK) all carry
      GO:0009853 in GOA. The glycine decarboxylase subunits have no
      photorespiration annotation, but no convention excludes catalytic
      subunits, so this absence looks like a curation gap. The knockdown
      phenotype (glycine accumulation, delayed growth in air) is consistent.
      Knockout lethality at high CO2 shows a further essential non-photorespiratory
      role in one-carbon metabolism.
    supported_by:
    - reference_id: PMID:28866761
      supporting_text: T-protein is the aminomethyltransferase of the glycine cleavage
        multienzyme system (GCS), also known as the glycine decarboxylase complex,
        and essential for photorespiration and one-carbon metabolism
    - reference_id: PMID:28866761
      supporting_text: displayed only some minor changes, such as a moderate glycine
        accumulation in combination with somewhat delayed growth
    - reference_id: PMID:22303256
      supporting_text: The combined reaction of glycine decarboxylase (GLD) and serine
        hydroxymethyltransferase (SHM) represents the mitochondrial part of the major
        photorespiratory pathway.
core_functions:
- description: Glycine cleavage system T protein (aminomethyltransferase). It takes
    the aminomethyl group from the lipoyl arm of the H protein, releases NH3 and transfers
    the methylene unit to tetrahydrofolate to form 5,10-methylenetetrahydrofolate.
    This step of mitochondrial glycine decarboxylation feeds the SHM1 reaction in photorespiration
    and supplies one-carbon units.
  supported_by:
  - reference_id: PMID:22303256
    supporting_text: The amino methylene group bound to the H-protein is further metabolized
      by the monomeric aminomethyltransferase T-protein (EC 2.1.2.10)
  - reference_id: PMID:28866761
    supporting_text: T-protein is the aminomethyltransferase of the glycine cleavage
      multienzyme system (GCS), also known as the glycine decarboxylase complex, and
      essential for photorespiration and one-carbon metabolism
  molecular_function:
