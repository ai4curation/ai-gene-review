id: O65396
gene_symbol: GDCST
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  GDCST (At1g11860; synonym GDT1) encodes the T protein (aminomethyltransferase,
  EC 2.1.2.10) of the mitochondrial glycine cleavage system, also called the
  glycine decarboxylase complex, and is the only T-protein gene in Arabidopsis.
  The nuclear-encoded precursor carries an N-terminal mitochondrial transit
  peptide, and the mature GcvT-family enzyme acts in the mitochondrial matrix
  with the P, H and L proteins. After the P protein decarboxylates glycine and
  loads the aminomethyl group onto the lipoyl arm of the H protein, the T protein
  releases ammonia and transfers the one-carbon unit to tetrahydrofolate, forming
  5,10-methylenetetrahydrofolate and leaving the H-protein lipoyl arm reduced.
  Mitochondrial serine hydroxymethyltransferase (SHM1) then uses this
  5,10-methylenetetrahydrofolate to convert a second glycine to serine. Together
  the two enzymes make up the mitochondrial part of the photorespiratory C2
  cycle, and they also supply one-carbon units. T protein is far more abundant in
  leaves than the other glycine cleavage proteins. Plants with about 5% of
  normal T protein grow in air with only moderate glycine accumulation, but
  knockout plants die even in CO2-enriched air. This shows that the enzyme is
  essential beyond photorespiration, most likely for one-carbon metabolism.
