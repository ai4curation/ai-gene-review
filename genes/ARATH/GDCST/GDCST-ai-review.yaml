suggested_questions:
- question: Why is GDCST knockout lethal even in CO2-enriched air when a knockdown
    with about 5% residual T protein grows almost normally in air? Which one-carbon
    sinks (for example in vascular tissue) depend on glycine cleavage-derived 5,10-methylene-THF?
- question: GDCST, GLDP1/2, GDCH and the mitochondrial LPDs lack photorespiration
    (GO:0009853) annotations in GOA, but SHM1 and the other C2-cycle enzymes have them.
    Should the GDC catalytic subunits be annotated to photorespiration consistently?
suggested_experiments:
- description: Tissue-specific complementation of the lethal gdcst knockout, using
    a mesophyll-specific promoter versus a vascular promoter, to separate the photorespiratory
    and non-photorespiratory requirements for T protein.
  experiment_type: genetic complementation
