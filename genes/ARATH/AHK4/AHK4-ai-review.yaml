core_functions:
- description: 'AHK4 is a CHASE-domain cytokinin receptor: binding of cytokinin to its extracytosolic
    sensor domain activates autophosphorylation of the transmitter-domain histidine and phosphotransfer,
    via its receiver domain, to AHP histidine phosphotransfer proteins, initiating the multistep
    phosphorelay that activates type-B ARR transcription factors.'
  supported_by:
  - reference_id: PMID:11234017
    supporting_text: CRE1 expression conferred a cytokinin-dependent growth phenotype on a
      yeast mutant that lacked the endogenous histidine kinase SLN1 (ref. 10), providing direct
      evidence that CRE1 is a cytokinin receptor
  - reference_id: PMID:21964459
    supporting_text: Crystal structures of the Arabidopsis thaliana histidine kinase 4 sensor
      domain in complex with different cytokinin ligands now rationalize the hormone-binding
      specificity of the receptor
  - reference_id: PMID:16753566
