core_functions:
- description: Extrinsic subunit of the photosystem II oxygen-evolving complex. PsbP1
    docks on the lumenal face of PSII as one of the three plant OEC extrinsic proteins
    (with PsbO and PsbQ), optimizing calcium and chloride retention at the Mn4CaO5
    cluster and thereby stabilizing PSII and supporting its water-splitting, oxygen-evolving
    activity during the light reactions of photosynthesis.
  contributes_to_molecular_function:
    id: GO:0010242
    label: oxygen evolving activity
  directly_involved_in:
  - id: GO:0019684
    label: photosynthesis, light reaction
  locations:
  - id: GO:0009543
    label: chloroplast thylakoid lumen
  in_complex:
    id: GO:0009654
    label: photosystem II oxygen evolving complex
  supported_by:
  - reference_id: PMID:16049782
    supporting_text: PsbP is a membrane extrinsic subunit of Photosystem II (PS II),
      which is involved in retaining Ca2+ and Cl-, two inorganic cofactors for the
      water-splitting reaction.
  - reference_id: PMID:16244145
    supporting_text: PsbP and PsbQ proteins are extrinsic subunits of photosystem
      II (PSII) and participate in the normal function of photosynthetic water oxidation.
suggested_questions:
- question: The only BP row for the specific light-reaction term (GO:0019684, TAS
    from PMID:9039496) carries the acts_upstream_of_or_within qualifier, whereas the
    general GO:0015979 photosynthesis row carries involved_in. Should the GO:0019684
    annotation be restated as involved_in, given that PsbP1 is a structural OEC subunit
    that retains the Ca2+ and Cl- cofactors of water oxidation rather than acting
    upstream of the process?
