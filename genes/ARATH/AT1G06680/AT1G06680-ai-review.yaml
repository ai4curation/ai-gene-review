  review:
    summary: PsbP1 is an extrinsic component of PSII located in the thylakoid lumen,
      docking on the lumenal face of the membrane-embedded PSII complex.
    action: ACCEPT
    reason: The thylakoid association is sound - PsbP1 docks on the lumenal face of
      the membrane-embedded PSII complex, and the PAINT IBD at PTN001584458 is seeded
      by AT3G55330 (PPL1), a lumen-facing PsbP-family protein associated with the
      thylakoid membrane. By GO convention a peripheral protein is located in the
      membrane it is peripheral to, so this term states the same fact as GO:0019898
      extrinsic component of membrane with the membrane specified, and it is consistent
      with the two experimental HDA rows for the same term. The precise functional
      compartment, chloroplast thylakoid lumen (GO:0009543), is already annotated
      separately. The retired duplicate review of the same protein (genes/ARATH/AAU94417)
      had proposed MODIFY to GO:0009543; that is not adopted, since it would only
      duplicate an existing annotation and discard the membrane-association information.
