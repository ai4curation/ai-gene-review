  review:
    summary: PsbP1 is an extrinsic component of PSII located in the thylakoid lumen,
      docking on the lumenal face of the membrane-embedded PSII complex.
    action: MODIFY
    reason: The thylakoid association is sound - PsbP1 docks on the lumenal face of
      the membrane-embedded PSII complex, and the PAINT IBD at PTN001584458 is seeded
      by AT3G55330 (PPL1), itself a thylakoid-lumen protein. But for an extrinsic
      lumenal OEC subunit the precise compartment term is chloroplast thylakoid lumen,
      which is also the location asserted in this file's core_functions; membrane
      association is already captured by the extrinsic-component and OEC-complex annotations,
      so the membrane term overstates the compartment rather than being outright wrong.
      The retired duplicate review of the same protein (genes/ARATH/AAU94417) reached
      the same verdict.
    proposed_replacement_terms:
