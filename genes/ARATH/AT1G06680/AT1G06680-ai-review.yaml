- term:
    id: GO:0048564
    label: photosystem I assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: PsbP1 is a photosystem II (PSII) oxygen-evolving complex extrinsic protein,
      not a photosystem I (PSI) protein. Falcon deep research unambiguously and repeatedly
      assigns At1g06680/PsbP1 to PSII/OEC, with no evidence for any role in PSI assembly.
      This IBA annotation appears to be an erroneous phylogenetic/paralog propagation
      (photosystem I rather than photosystem II) and should be removed.
    action: REMOVE
    supported_by:
    - reference_id: file:ARATH/AT1G06680/AT1G06680-deep-research-falcon.md
      supporting_text: a curated thylakoid-lumen protein table explicitly lists **At1g06680
        = PsbP1** and assigns it to **PSII/OEC**
    - reference_id: file:ARATH/AT1G06680/AT1G06680-deep-research-falcon.md
      supporting_text: PSBP1/PsbP1 functions as an **extrinsic lumenal PSII subunit**
        associated with the **oxygen-evolving complex**
    reason: Removed because PsbP1 is a PSII/OEC subunit; falcon deep research provides
      no support for photosystem I assembly and the PSII evidence contradicts a PSI
      role.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN001584458
        source_label: PsbP/PPL/PPD family node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The photosystem I assembly IBD at this node is seeded only by the
          divergent PPD1 subclade; the node also spans true PSII PsbP subunits that
          do not share the function.
      - source_id: AGI_LocusCode:AT4G15510
        source_label: PPD1 (PsbP domain protein 1)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: PPD1 is a genuine PSI assembly factor, but that function is subfamily-specific
          and does not transfer to the PSII OEC subunit PsbP1.
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT4G15510
  - PANTHER:PTN001584458
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: InterPro2GO mapping from the PsbP domain (IPR002683). PsbP helps retain
      Ca2+ and Cl- at the Mn4CaO5 cluster of the oxygen-evolving complex, but that
      is a retention role within the complex, not a demonstrated calcium-binding activity
      of PsbP1 itself.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:16049782
      supporting_text: PsbP is a membrane extrinsic subunit of Photosystem II (PS II),
        which is involved in retaining Ca2+ and Cl-, two inorganic cofactors for the
        water-splitting reaction.
    - reference_id: PMID:36741451
      supporting_text: although PsbP is also important for Ca2+ retention, the PsbP-D139N
        mutation did not affect the Ca2+ dependence of the oxygen-evolving activity
    reason: 'The calcium connection is real but indirect. In vitro reconstitution work
      on higher-plant PsbP (tobacco/spinach PSII) shows that PsbP is needed to retain
      Ca2+ and Cl- as cofactors of the water-splitting reaction; the Ca2+ itself is
      ligated in the Mn4CaO5 cluster of the OEC, and the evidence describes PsbP as
      a retention factor for that site rather than as a calcium-binding protein. The
      Ca2+ dependency is a property of the OEC, so the OEC complex term and the core
      function capture this more accurately than a calcium ion binding activity on
      PsbP1. Reconciled with the retired duplicate review genes/ARATH/AAU94417 (same
      protein, Q42029), which proposed KEEP_AS_NON_CORE.'
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002683
