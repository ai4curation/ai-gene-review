id: Q944I4
gene_symbol: GLYK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  GLYK (D-glycerate 3-kinase; At1g80380) is the single-copy ATP-dependent glycerate kinase
  of Arabidopsis, which phosphorylates D-glycerate to 3-phospho-D-glycerate (EC 2.7.1.31).
  This is the concluding reaction of the photorespiratory C2 cycle: glycerate formed in
  peroxisomes from serine is imported into the chloroplast, and the 3-phosphoglycerate made
  by GLYK re-enters the Calvin-Benson cycle. GLYK has a P-loop NTPase fold related to
  phosphoribulokinase and uridine kinase but has neither of those activities, and it
  founded a glycerate kinase family, present in plants, fungi and some cyanobacteria, that is
  unrelated to the bacterial and animal glycerate kinases. The main isoform carries a
  chloroplast transit peptide and acts in the stroma. Knockout mutants lack leaf glycerate
  kinase activity, accumulate glycerate and cannot survive in normal air but grow in
  CO2-enriched air. Phytochrome-controlled use of an alternative promoter produces a
  shorter, cytoplasmic GLYK isoform in shade, which provides a cytosolic photorespiratory
  bypass that reduces photoinhibition under fluctuating light.
