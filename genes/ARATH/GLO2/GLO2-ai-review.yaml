taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GLO2 (GOX2, At3g14415) encodes one of the two major leaf glycolate oxidases of Arabidopsis,
  a peroxisomal FMN-dependent (S)-2-hydroxy-acid oxidase that oxidizes glycolate to glyoxylate with O2,
  producing H2O2. Recombinant GOX2 prefers glycolate and oxidizes L-lactate, hydroxypyruvate and glycerate
  only weakly in vitro; it uses O2 and not NAD(P)+ as electron acceptor, and it restores growth of a cyanobacterial
  glycolate dehydrogenase mutant in low CO2. In the photorespiratory C2 cycle it catalyzes the peroxisomal
  glycolate-to-glyoxylate step together with its tandem paralog GLO1 (GOX1, At3g14420); the two genes
  are co-regulated with other photorespiratory genes and largely redundant, so single mutants grow normally
  in air whereas combined knock-down causes a severe photorespiratory phenotype. Loss of GOX2, unlike
  loss of GOX1, does not suppress the catalase-deficient cat2 phenotype. H2O2 from glycolate oxidase also
  contributes to defence signalling during nonhost resistance. The GOX1/GOX2 names for At3g14420/At3g14415
  are crossed in part of the literature.
