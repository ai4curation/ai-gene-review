suggested_questions:
- question: Hackenberg et al. 2011 describe GOX2 (At3g14415) as the main photorespiratory isoform, whereas
    Kerchev et al. 2016 find that GOX1 (At3g14420), not GOX2, matters most under severe photorespiration
    and in cat2. Given the crossed GOX1/GOX2 naming in parts of the literature (e.g. PMID:17951448), which
    locus is quantitatively dominant in leaf peroxisomes?
suggested_experiments:
- description: Measure glycolate oxidase activity and isoform-specific protein abundance in gox1 and gox2
    single mutants side by side under ambient and high-light conditions, using AGI-locus-verified alleles.
