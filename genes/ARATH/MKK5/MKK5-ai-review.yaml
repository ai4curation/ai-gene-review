gene_symbol: MKK5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'MKK5 (MEK5, At3g21220) is a group C plant dual-specificity MAP kinase kinase that, largely redundantly with
  its paralog MKK4, forms the middle tier of MAPK cascades that activate MPK3 and MPK6. It is activated by phosphorylation
  of activation-loop Thr-215/Ser-221 by context-specific MAP3Ks: MAPKKK3/MAPKKK5 downstream of cell surface pattern recognition
  receptors (including the CERK1-PBL27 chitin pathway and FLS2), YODA downstream of ERECTA-family receptors in development,
  and AIK1/MAPKKK20 in abscisic acid signaling. Activated MKK5 phosphorylates the TEY activation motif of MPK3/MPK6 in the
  cytoplasm. Through MPK3/MPK6 the cascade promotes pathogen resistance, camalexin and ethylene production and hypersensitive-response-like
  cell death, and regulates stomatal development and patterning, inflorescence architecture, floral organ abscission and ABA
  responses in roots and guard cells.'
