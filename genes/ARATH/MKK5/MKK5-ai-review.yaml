suggested_questions:
- question: Should the MAPK-cascade members downstream of pattern recognition receptors (MKK4, MKK5, MPK3, MPK6) carry cell
    surface pattern recognition receptor signaling pathway (GO:0002752)? MAPKKK5 carries it via a curator IGI row (modified
    from GO:0002221), but no same-role MAP2K or MAPK currently does.
- question: Camalexin induction by MKK5 is supported only by gain-of-function (GVG-MKK5DD) data; does mkk4 mkk5 loss of function
    (e.g. conditional or amiRNA lines) compromise pathogen-induced camalexin, which would justify positive regulation of camalexin
    biosynthetic process (GO:1901183) as on MPK3?
- question: Is the MKK5 contribution to ABA root and guard-cell responses (mkk5 single mutant phenotype, mkk4 not) a genuine
    non-redundant function, and how is it insulated from the immune and developmental uses of the same MAP2K?
- question: Should EC 2.7.12.2-derived protein serine kinase activity rows be suppressed for MAP2Ks whose physiological substrates
    are the Thr/Tyr of MAPK TEY motifs?
suggested_experiments:
- description: Phosphosite mapping (LC-MS/MS) of MPK3/MPK6 phosphorylated by MAPKKK5-activated wild-type MKK5 to confirm dual
    Thr/Tyr specificity and test for any serine phosphorylation of physiological substrates.
- description: Conditional (estradiol-inducible amiRNA) depletion of MKK4 in mkk5 backgrounds to separate immune (chitin,
    flg22) from developmental requirements, assaying MPK3/MPK6 activation, camalexin accumulation and resistance to Botrytis
    cinerea.
