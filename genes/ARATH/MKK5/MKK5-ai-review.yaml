gene_symbol: MKK5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: MAP KINASE KINASE 5 (MKK5/MEK5; At3g21220) is a group C plant MAPK kinase (MAP2K) of 348
  aa that, redundantly with its paralog MKK4, phosphorylates and activates MPK3 and MPK6. Downstream of
  the MAPKKK YODA, MKK4/MKK5 repress stomatal lineage entry and spacing and, downstream of ERECTA, promote
  localized cell proliferation in inflorescences; downstream of IDA-HAE/HSL2 they control floral organ
  abscission; and downstream of pattern-recognition receptors (via MAPKKK5 and related MAPKKKs) they drive
  immune responses, ethylene and camalexin production and, when constitutively active, hypersensitive-response-like
  cell death. It is activated by MAPKKK phosphorylation of activation-loop Thr-215/Ser-221; in immunity, MAPKKK3/MAPKKK5
  head the cascade downstream of receptors such as the CERK1-PBL27 chitin pathway and FLS2. MKK5 also relays
  ABA signals from the MAPKKK AIK1 to MPK6. It is a soluble cytoplasmic/nuclear
  kinase and is recruited to stress granules under stress.
