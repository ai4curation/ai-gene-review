  original_reference_id: GO_REF:0000122
  qualifier: located_in
  review:
    summary: Sequence-model (AtSubP) prediction of mitochondrion.
    action: MARK_AS_OVER_ANNOTATED
    reason: No experimental support for a mitochondrial pool; MKK5 interacts with its MAPKKK activator
      and acts on MPK3/MPK6 mainly in the cytosol. The N-terminal extension, which ChloroP predicts as
      a chloroplast transit sequence (the paralog MKK4 is imported into the plastid stroma in vitro),
      likely drove the organellar prediction; nothing points to mitochondria. One independent review
      proposed REMOVE; kept as over-annotated because an N-terminal organellar targeting signal is
      genuinely predicted and organellar import of MKK5 has not been tested.
    supported_by:
    - reference_id: PMID:19516975
      supporting_text: at least two members, MKK4 and MKK5, were predicted to contain a chloroplast transit
        sequence
    - reference_id: PMID:27679653
      supporting_text: MAPKKK5 interacts with MKK2, MKK4, and MKK5 mainly in the cytosol
