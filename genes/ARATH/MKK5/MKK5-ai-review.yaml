suggested_questions:
- question: How is output specificity achieved when the same MKK4/MKK5 pair relays YODA (stomata, embryo,
    inflorescence), HAE/HSL2 (abscission) and immune-receptor signals to MPK3/MPK6?
- question: Are MKK4 and MKK5 fully redundant in the stomatal lineage, or do expression-level or docking
    differences give one paralog a predominant role?
- question: Should the MAPK-cascade members downstream of pattern recognition receptors (MKK4, MKK5, MPK3,
    MPK6) carry cell surface pattern recognition receptor signaling pathway (GO:0002752)? MAPKKK5 carries
    it via a curator IGI row, but no same-role MAP2K or MAPK currently does, so it is not proposed here.
- question: Camalexin induction by MKK5 is supported only by gain-of-function (GVG-MKK5DD) data; does mkk4
    mkk5 loss of function (conditional or amiRNA lines) compromise pathogen-induced camalexin, which would
    justify positive regulation of camalexin biosynthetic process (GO:1901183) as on MPK3?
- question: Is the MKK5 contribution to ABA root and guard-cell responses (mkk5 single mutant phenotype,
    mkk4 not) a genuine non-redundant function, and how is it insulated from the immune and developmental
    uses of the same MAP2K?
- question: Should EC 2.7.12.2-derived protein serine kinase activity (GO:0106310) rows be suppressed for
    MAP2Ks whose physiological substrates are the Thr/Tyr of MAPK TEY motifs?
- question: Two independent reviews disagreed on the MPK3/MPK6 and MAPKKK interaction rows (MODIFY to
    MAP kinase binding / MAPKKK binding versus REMOVE as kinase-substrate interactions already captured
    by MAP kinase kinase activity). Should docking interactions of a MAP2K with its MAPKKK activator and
    MAPK substrates be captured as specific binding terms, or only via the catalytic activity?
suggested_experiments:
- description: Generate clean mkk4 mkk5 CRISPR double mutants with cell-type-specific complementation
    (SPCH or MUTE promoters) to test where in the stomatal lineage MKK4/5 activity is required, avoiding
    RNAi silencing variability.
  experiment_type: genetics / cell-type-specific complementation
- description: Phosphosite mapping (LC-MS/MS) of MPK3/MPK6 phosphorylated by MAPKKK5-activated wild-type
    MKK5 to confirm dual Thr/Tyr specificity and test for any serine phosphorylation of physiological substrates.
- description: Conditional (estradiol-inducible amiRNA) depletion of MKK4 in mkk5 backgrounds to separate
    immune (chitin, flg22) from developmental requirements, assaying MPK3/MPK6 activation, camalexin accumulation
    and resistance to Botrytis cinerea.
