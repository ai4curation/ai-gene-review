id: Q944A7
gene_symbol: BSK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  BSK1 (BRASSINOSTEROID-SIGNALING KINASE 1, At4g35230) is a receptor-like cytoplasmic kinase of the RLCK-XII
  family with an N-terminal kinase domain and a C-terminal tetratricopeptide-repeat (TPR) domain. It is
  anchored to the cytoplasmic face of the plasma membrane by N-myristoylation and S-acylation (by PAT19/20/22).
  In brassinosteroid signalling the activated receptor BRI1 phosphorylates BSK1 at Ser230, which promotes
  BSK1 binding to the BSU1 phosphatase; BSU1 then dephosphorylates and inactivates the GSK3-like kinase
  BIN2, allowing BZR1/BES1 accumulation. BSK1 belongs to a family of twelve partially redundant BSKs,
  and structural work on BSK8 suggests that BSKs may function largely as allosteric pseudokinase scaffolds,
  although BSK1 shows in vitro kinase activity. BSK1 also associates with the immune receptor FLS2 and
  contributes to pattern-triggered immunity and resistance to bacterial, fungal and oomycete pathogens.
