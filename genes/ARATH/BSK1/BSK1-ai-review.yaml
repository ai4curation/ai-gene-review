core_functions:
- description: >-
    Plasma-membrane-anchored receptor-like cytoplasmic kinase (RLCK-XII) that is phosphorylated by the
    activated BR receptor BRI1 (Ser230) and, once phosphorylated, binds the BSU1 phosphatase, relaying
    the BR signal from the receptor complex toward inactivation of BIN2. Its catalytic contribution is
    debated (paralog structures suggest pseudokinase behaviour), but in vitro kinase activity has been
    reported and is required for its immune function.
  molecular_function:
    id: GO:0004672
    label: protein kinase activity
  directly_involved_in:
  - id: GO:0009742
    label: brassinosteroid mediated signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id005
  - *id006
  - reference_id: PMID:19734888
    supporting_text: >-
      We show that phosphorylation of BSK1 (BR-signalling kinase 1) by the BR receptor kinase BRI1 (BR-insensitive
      1) promotes BSK1 binding to the BSU1 (BRI1 suppressor 1) phosphatase
  - *id001
suggested_questions:
- question: >-
    Is BSK1 catalytic activity required for BR signal relay to BSU1, or does BSK1 act as an allosteric
    pseudokinase scaffold as suggested for BSK8?
- question: >-
    How does BSK1 promote BSU1 activity in vivo when no direct effect of BSK1 on BSU1 phosphatase activity
    was detected in vitro?
suggested_experiments:
- description: >-
    Complement a bsk multiple mutant with catalytically dead BSK1 (e.g. K104E or D-to-N catalytic loop
    mutant) and assay BR responses and BIN2 Tyr200 phosphorylation.
