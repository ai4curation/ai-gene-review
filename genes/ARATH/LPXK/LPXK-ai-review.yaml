  review:
    summary: Lipid A biosynthetic process from the InterPro2GO mapping of IPR003758 (LpxK). This is part
      of the plant lipid A set flagged by Wei et al. 2020 (RAR), and the flag is refuted.
    action: ACCEPT
    reason: AtLpxK catalyses the 4'-phosphorylation step of the lipid A precursor pathway, so it does
      the work of the process. In planta, lpxk nulls accumulate its substrate DS-1-P, and lipid X rises
      2.6-fold, as expected for a block downstream of LpxB. The UniProt pathway line (step 6/6 of lipid
      IV(A) biosynthesis) rests on this experiment. This row also carries the experimental (IMP) evidence,
      which in GOA is attached only to the obsolete lipid X term.
    supported_by:
