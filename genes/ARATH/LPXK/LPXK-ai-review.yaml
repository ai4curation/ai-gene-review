  review:
    summary: Lipid-A 4'-kinase activity by IMP. Three independent lpxk null alleles accumulate the LpxK
      substrate, disaccharide 1-phosphate, which is undetectable in wild type.
    action: ACCEPT
    reason: Loss of AtLpxK causes accumulation of DS-1-P, the substrate of the LpxK reaction. Its product,
      lipid IVA, is seen only when the next enzyme (KdtA) is missing. This is strong genetic evidence
      for the 4'-kinase step. No in vitro assay has been reported, but together with orthology the IMP
      is sound. Core function.
