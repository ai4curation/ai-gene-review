gene_symbol: LPXK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: LPXK (At3g20480) is a nuclear-encoded, mitochondrially targeted tetraacyldisaccharide 4'-kinase
  of the LpxK family, the single Arabidopsis ortholog of E. coli LpxK. By orthology it uses ATP to phosphorylate
  the 4'-position of the lipid A disaccharide 1-phosphate (DS-1-P), forming lipid IVA. This is the sixth
  step of a plant lipid A precursor pathway that mirrors the E. coli Raetz pathway (LpxA, LpxC, LpxD,
  LpxB, LpxK, KdtA). Three independent lpxk null alleles accumulate DS-1-P, which is undetectable in
  wild type, but the plants have no visible phenotype. An N-terminal GFP fusion is targeted to mitochondria.
  The final plant lipid A-like product and its physiological role, possibly a mitochondrial membrane
  component or a signalling lipid, are unknown.
