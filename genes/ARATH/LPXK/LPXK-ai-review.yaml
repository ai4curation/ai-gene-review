suggested_questions:
- question: Does recombinant mature AtLpxK phosphorylate DS-1-P in vitro, and does it complement an E.
    coli lpxK mutant despite its low (26%) identity?
- question: Is AtLpxK an integral membrane protein of the mitochondrial inner membrane, as E. coli LpxK
    is anchored in the inner membrane by an N-terminal helix?
- question: Which of the several EST-supported splice isoforms of At3g20480 encode an active, mitochondrially
    targeted kinase?
suggested_experiments:
- experiment_type: in vitro enzyme assay and heterologous complementation
  hypothesis: AtLpxK is a functional ATP-dependent tetraacyldisaccharide 4'-kinase.
  description: Express mature AtLpxK in E. coli membranes, assay DS-1-P phosphorylation with [gamma-32P]ATP
    by TLC or LC-ESI/MS, and test rescue of an E. coli lpxK depletion strain.
- experiment_type: sub-mitochondrial fractionation
  hypothesis: AtLpxK is anchored in a mitochondrial membrane.
  description: Carbonate extraction and protease protection of mitochondria from lines expressing full-length
    tagged LPXK under its native promoter.
