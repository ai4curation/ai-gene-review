core_functions:
- description: >-
    Lipoyl-arm carrier of the mitochondrial glycine decarboxylase complex: the covalently lipoylated H
    protein accepts the aminomethyl group of glycine from the P protein, delivers it to the T protein
    and is reoxidised by the L protein, without catalytic activity of its own. Leaf isoform H1, redundant
    with H3, supporting photorespiratory glycine decarboxylation.
  molecular_function:
    id: GO:0140104
    label: molecular carrier activity
  directly_involved_in:
  - id: GO:0019464
    label: glycine decarboxylation via glycine cleavage system
  - id: GO:0009853
    label: photorespiration
  in_complex:
    id: GO:0005960
    label: glycine cleavage complex
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - *id006
  - *id004
  - *id007
  - *id003
proposed_new_terms:
- proposed_name: lipoyl-dependent carrier activity
  proposed_definition: >-
    Binding a substrate or reaction intermediate via a covalently attached lipoyl (lipoamide) prosthetic
    group and delivering it between cognate enzymes, as the H protein of the glycine cleavage system does
    between the P, T and L proteins.
  justification: >-
    GO has GO:0140414 phosphopantetheine-dependent carrier activity for ACP-type carriers but no equivalent
    for lipoyl carriers. H proteins have no catalytic activity, so they currently receive either no MF,
    the generic GO:0140104 molecular carrier activity, or GO:0031405 lipoic acid binding, which describes
    cofactor attachment rather than the carrier function.
  proposed_parent:
    id: GO:0140104
    label: molecular carrier activity
  supported_by:
  - *id004
  - reference_id: PMID:11286922
    supporting_text: the lipoate-dependent H-protein that plays a pivotal role, acting as a mobile substrate that commutes successively between the other three proteins
suggested_questions:
- question: >-
    Which molecular-function term should GO use for glycine cleavage H proteins: GO:0140104 molecular
    carrier activity (PomBase GO-CAM), GO:0031405 lipoic acid binding (human GCSH review, glycine cleavage
    module), or a new lipoyl-dependent carrier term?
- question: >-
    Are GDCH (H1) and At1g32470 (H3) fully interchangeable in vivo, and does the root/non-photosynthetic
    one-carbon role of GDC rely on a particular H isoform?
- question: >-
    Does the Arabidopsis H protein, like human GCSH, also serve as a lipoyl donor for the E2 subunits
    of mitochondrial 2-oxoacid dehydrogenases?
suggested_experiments:
- hypothesis: >-
    GDCH and the H3 isoform are redundant for photorespiratory GDC activity.
  description: >-
    Generate gdch1 single and gdch1 h3 double mutants (e.g. CRISPR) and test growth in air versus high
    CO2, leaf glycine/serine ratios and GDC activity of isolated mitochondria.
  experiment_type: genetics / metabolite profiling
