id: P25855
gene_symbol: GDCH
product_type: PROTEIN
status: COMPLETE
aliases:
- GDH1
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  GDCH (UniProt gene name GDH1; At2g35370) encodes glycine cleavage system H protein 1, one of three Arabidopsis
  H proteins of the mitochondrial glycine decarboxylase complex (GDC; not to be confused with glutamate
  dehydrogenase). The small protein carries a lipoyl group covalently attached to a conserved lysine in
  its lipoyl-binding domain. It has no catalytic activity of its own: the lipoyl arm acts as a mobile
  carrier that accepts the aminomethyl group of glycine from the P protein, delivers it to the T protein
  (which releases NH3 and forms 5,10-methylene-tetrahydrofolate), and is then reoxidised by the L protein
  with formation of NADH. H protein is the most abundant GDC component; in Arabidopsis leaves the H1 (this
  gene) and H3 isoforms are present in about equal amounts and appear redundant. Expression is light-induced
  and highest in leaves, consistent with the central role of GDC in the photorespiratory C2 cycle, and
  GDC also supplies one-carbon units for metabolism. The precursor is imported into mitochondria, where
  its presequence is removed and the N terminus trimmed by ICP55. GDC activity is inhibited by S-nitrosylation
  and glutathionylation, which affect the H protein as well.
