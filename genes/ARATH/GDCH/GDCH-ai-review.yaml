- term:
    id: GO:0140104
    label: molecular carrier activity
  evidence_type: TAS
  original_reference_id: PMID:22303256
  review:
    summary: >-
      The H protein has no catalytic activity; its covalently attached lipoyl arm carries the glycine-derived
      aminomethyl group (and then the reducing equivalents) between the P, T and L proteins of the glycine
      decarboxylase complex.
    action: NEW
    reason: >-
      GOA has no molecular-function annotation for GDCH. GO:0140104 (directly binding a molecule and delivering
      it to an acceptor; a carrier moves with its cargo) describes the swinging-arm role exactly and is
      the term PomBase uses for the S. pombe H protein gcv3 in its GO-CAM. No catalytic MF should be assigned,
      because the plant literature is explicit that the H protein is a cofactor/mobile substrate, not
      an enzyme. GO:0031405 lipoic acid binding (used for the H-protein role in modules/glycine_cleavage_system.yaml)
      is not proposed: the lipoate is a covalently attached prosthetic group (N6-lipoyllysine), so binding
      describes cofactor attachment rather than the activity. A more specific lipoyl-dependent carrier
      term is proposed under proposed_new_terms. Evidence is from plant GDC biochemistry and family membership
      rather than an assay of At2g35370 itself; recorded as TAS from the Arabidopsis Book review.
    supported_by:
    - *id006
    - *id004
    - reference_id: PMID:19860829
      supporting_text: H-protein has no catalytic activity itself but is a substrate of the three enzymatically active subunits, P-, T- and L-protein.
    - *id007
    - reference_id: file:ARATH/GDCH/GDCH-uniprot.txt
      supporting_text: Binds 1 lipoyl cofactor covalently.
- term:
    id: GO:0009853
    label: photorespiration
  evidence_type: IC
  original_reference_id: PMID:32311173
  review:
    summary: >-
      GCS-H1 (At2g35370) is one of the two H isoforms of the leaf glycine decarboxylase complex, which
      performs the mitochondrial glycine-to-CO2/NH3 step of the photorespiratory C2 cycle.
    action: NEW
    reason: >-
      Participation test: this is the cofactor case described in CLAUDE.md. The H protein does part of
      the work of the photorespiratory glycine decarboxylation step by carrying the reaction intermediate
      between the three GDC enzymes; it is not merely required for, or a substrate of, the process. Comparator
      check (QuickGO, Arabidopsis, GO:0009853): enzymes for other C2-cycle steps carry the term (SHM1,
      GLYK, HPR, GGAT1, PLGG1), but no GDC subunit does. Direct genetic evidence for At2g35370 itself
      is lacking (H1 and H3 are redundant in leaves, and the overexpression studies used a Flaveria H
      protein), so this rests on the protein's presence in the leaf complex and the established role of
      GDC. Not an ancestor or descendant of GO:0019464.
    supported_by:
    - *id003
    - reference_id: PMID:32311173
      supporting_text: Photorespiring plant mitochondria contain very high levels of GCS proteins organised as a fragile glycine decarboxylase complex (GDC).
    - reference_id: PMID:22303256
      supporting_text: The combined reaction of glycine decarboxylase (GLD) and serine hydroxymethyltransferase (SHM) represents the mitochondrial part of the major photorespiratory pathway.
    - reference_id: PMID:7480320
      supporting_text: Glycine decarboxylase is a mitochondrial enzyme complex, which is the site of photorespiratory CO2 and NH3 release.
