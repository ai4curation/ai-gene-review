gene_symbol: GGAT2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  GGAT2 (glutamate:glyoxylate aminotransferase 2; also AOAT2/GGT2; At1g70580) is a peroxisomal,
  pyridoxal 5'-phosphate-dependent class-I aminotransferase of the alanine aminotransferase
  subfamily, 93% identical to its segmentally duplicated paralog GGAT1 (At1g23310). Purified
  recombinant GGAT2 transaminates glyoxylate to glycine with glutamate as amino donor (Km for
  glyoxylate 0.14 mM) and also catalyses alanine:glyoxylate, alanine:2-oxoglutarate and
  glutamate:pyruvate transaminations, but not serine:glyoxylate or aspartate transamination.
  It ends in a type 1 peroxisomal targeting signal and is detected by isoform-specific peptides
  in the mature leaf peroxisome proteome. GGAT2 is expressed at much lower levels than GGAT1,
  in leaves, roots, siliques and light-grown seedlings; its promoter is active in leaves and its
  mRNA rises at the start of the light period while GGAT1 mRNA falls. It is considered a minor,
  partially redundant photorespiratory GGAT isoform that contributes to the residual leaf GGAT
  activity of ggat1 knockouts; no ggat2 mutant has been described.
