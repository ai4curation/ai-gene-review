- term:
    id: GO:0009853
    label: photorespiration
  evidence_type: IC
  original_reference_id: PMID:16950862
  review:
    summary: >-
      Proposed process annotation: GGAT2 is a leaf-expressed, light-induced peroxisomal enzyme that
      catalyses the photorespiratory glutamate:glyoxylate transamination itself, as a minor isoform
      partially redundant with GGAT1.
    action: NEW
    reason: >-
      GOA has photorespiration for GGAT1 but no process annotation for GGAT2 other than
      L-alanine catabolism. The GGAT2-specific evidence is (1) the purified recombinant protein
      catalyses the photorespiratory GGT reaction with a glyoxylate Km of 0.14 mM; (2) GGAT2 is
      identified by isoform-specific peptides in mature leaf peroxisomes, the compartment of this
      step; (3) its promoter is strongly active in leaves and its mRNA rises at the start of the
      light period while GGAT1 mRNA falls, yet leaf GGAT activity stays constant through the day.
      Participation test: GGAT2 does the work of the step (it is the catalyst, not a substrate).
      Comparator: the term is carried by the other catalysts of the C2 cycle, including GGAT1.
      Caveat: there is no ggat2 mutant, ggat1 knockouts lose most leaf GGAT activity and still
      accumulate glyoxylate in air, so GGAT2's contribution in vivo is minor and inferred from
      expression and biochemistry rather than genetics; hence IC rather than IMP.
    supported_by:
    - reference_id: PMID:16950862
      supporting_text: >-
        GUS stain was strongly detected in leaves of both GGAT1 - and GGAT2-GUS seedlings ( Fig. 1A ),
        which suggests that GGAT1 and GGAT2 function as photorespiratory GGAT enzymes.
    - reference_id: PMID:16950862
      supporting_text: >-
        However, the enzymatic activity of GGAT remained constant during the day ( Fig. 2A ),
        suggesting that GGAT1 and GGAT2 may function redundantly in leaf photorespiration.
    - reference_id: PMID:22303256
      supporting_text: >-
        Whereas Ggat 2 is induced at the beginning of the photoperiod, Ggat 1 is rather repressed.
        However, GGAT activity in leaves remains constant during the day ( Igarashi et al., 2006 )
        suggesting that both loci contribute to the total leaf GGAT content.
    - reference_id: PMID:17951448
      supporting_text: >-
        Of the two isoforms each of Glu-glyoxylate aminotransferase (GGT) and peroxisomal malate
        dehydrogenase (pMDH), GGT1 (At1g23310; SKM>) and pMDH2 (At5g09660; RIx 5 HL) dominated over
        the second isoform, both of which were identified as well
    - reference_id: PMID:12529529
      supporting_text: >-
        The GGT activity observed in Arabidopsis peroxisomes is likely the sum of the contributions
        from GGT1 and GGT2 because both catalyze this reaction.
    additional_reference_ids:
    - PMID:12529529
    - PMID:22303256
    - PMID:17951448
core_functions:
- description: >-
    Peroxisomal glutamate:glyoxylate aminotransferase that transaminates glyoxylate to glycine with
    glutamate as amino donor in the photorespiratory C2 cycle; a minor, light-induced isoform that is
    partially redundant with the main leaf enzyme GGAT1.
