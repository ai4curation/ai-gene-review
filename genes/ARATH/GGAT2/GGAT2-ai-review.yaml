suggested_questions:
- question: >-
    How much of the residual leaf GGAT activity in ggat1 knockouts is due to GGAT2, and does GGAT2
    make a measurable contribution to photorespiratory glycine formation in wild-type leaves?
- question: >-
    Is GGAT2 the main GGAT isoform in roots, as the RT-PCR data of Liepman and Olsen (2003) suggest,
    or is GGAT1 also strongly expressed there, as GGAT1 promoter-GUS staining indicates?
suggested_experiments:
- description: >-
    Isolate ggat2 single and ggat1 ggat2 double mutants and compare air-sensitivity, high-CO2 rescue,
    leaf GGAT/AGT activities and glyoxylate, glycine and serine levels, to quantify GGAT2's in vivo
    contribution to photorespiration.
- description: >-
    Express GGAT2-GFP (with and without its C-terminal SRM tripeptide) in planta to confirm
    PTS1-dependent peroxisomal import of GGAT2 itself.
