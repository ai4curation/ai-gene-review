taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'PDC1 is a cytosolic thiamine diphosphate- and magnesium-dependent pyruvate decarboxylase
  of Arabidopsis thaliana. It converts pyruvate to acetaldehyde and carbon dioxide, providing the first
  reaction of the conventional ethanol fermentation route. PDC1 contributes to adaptation to oxygen deprivation:
  loss reduces anoxia tolerance and overexpression can increase fermentative flux and hypoxic survival.
  Other PDC paralogs and residual ethanol production in mutant backgrounds preclude assigning all plant
  ethanol formation to PDC1 alone.'
