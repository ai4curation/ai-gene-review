  title: The pyruvate decarboxylase1 gene of Arabidopsis is required during anoxia but not other environmental
    stresses.
  findings:
  - statement: PDC1 loss compromises anoxia tolerance; the study distinguishes this phenotype from responses
      to other stresses.
    supporting_text: a pdc1 null mutant is comprised in anoxia tolerance but not other environmental stresses.
  full_text_unavailable: false
  reference_review:
