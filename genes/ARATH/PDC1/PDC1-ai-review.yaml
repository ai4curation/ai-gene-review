    correctness: VERIFIED
    review_notes: Target-specific supplemental measurements were not individually re-extracted; the claim
      is corroborated by direct PDC1 studies. Full text cached and consulted.
- id: PMID:38165809
  title: Reciprocal modulation of responses to nitrate starvation and hypoxia in roots and leaves of Arabidopsis
    thaliana.
  findings:
  - statement: Nitrate availability modulates PDC1/ADH1 induction during hypoxia, establishing a physiological
      context rather than nitrate catalysis.
    supporting_text: three genes involved in fermentation (SUS4, PDC1, ADH1) were ~10- to 100-fold upregulated
      by simultaneous hypoxia and nitrate starvation
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Root-versus-leaf and combined-stress experiment. Full text cached and consulted.
- id: PMID:12857811
  title: Enhanced low oxygen survival in Arabidopsis through increased metabolic flux in the fermentative
    pathway.
  findings:
  - statement: Manipulating PDC1/PDC2 activity changes fermentative flux and hypoxic survival; ADH1 overexpression
      does not produce the same benefit.
    supporting_text: Overexpression of either Arabidopsis PDC1 or PDC2 resulted in improved plant survival.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct pathway flux study. Full text cached and consulted.
- id: PMID:30861072
  title: Conservation of ethanol fermentation and its regulation in land plants.
  findings:
  - statement: Ethanol fermentation is widespread in land plants, but pdc1 pdc2 seedlings retain residual
      ethanol output; the canonical two-enzyme implementation is not exclusive.
    supporting_text: Hypoxic adh1, adh1adh2, and pdc1pdc2 seedlings leaked significantly more alcohol
      than their aerobic counterpart plants
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mutant and cross-species evidence bounds pathway exclusivity. Full text cached and consulted.
