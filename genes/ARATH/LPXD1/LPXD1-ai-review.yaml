- term:
    id: GO:0009245
    label: lipid A biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR007691
  review:
    summary: Lipid A biosynthetic process from the InterPro2GO mapping of IPR007691 (LpxD family). This
      term on plant LpxD proteins was flagged by Wei et al. 2020 as a probable misannotation.
    action: UNDECIDED
    reason: The pathway itself is real in Arabidopsis (the RAR flag is refuted at the pathway level, and
      for the paralog LPXD2), but there is no evidence that LPXD1 does any of the work. In atlpxd1-1 null
      plants lipid X is not reduced, and adding atlpxd1-1 to atlpxb-1 does not lower the elevated lipid
      X. Residual lipid X in atlpxd2 atlpxb plants leaves open a minor LPXD1 contribution, and the authors
      also raise the possibility that LPXD1 is an LpxA-like enzyme, which would still place it in this
      pathway but at a different step. LPXD1 also carries substitutions at substrate-binding residues.
      Family membership alone does not settle it for a paralog that has diverged at these positions,
      so the claim can be neither accepted nor removed on current evidence.
    supported_by:
