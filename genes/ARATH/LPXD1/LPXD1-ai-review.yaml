      reference_id: PMID:21709257
      supporting_text: The lipid X level in the atlpxd1-1 mutant was not reduced from that of wild type
    - &d1lpxb
      reference_id: PMID:21709257
      supporting_text: Introducing the atlpxd1-1 mutation into the atlpxb-1 mutant background did not lower
        its elevated lipid X levels
    - &residual
      reference_id: PMID:21709257
      supporting_text: The presence of some residual lipid X in this setting leaves open the possibility
        that AtLpxD1 generates a small portion of the lipid X pool.
    - &lpxa
      reference_id: PMID:21709257
      supporting_text: At present, we cannot exclude the intriguing possibility that AtLpxD1 has LpxA activity
    - reference_id: PMID:21709257
