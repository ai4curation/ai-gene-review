  review:
    summary: LpxD activity propagated by PAINT from node PTN000501148, seeded by E. coli LpxD (P21645)
      and the two Arabidopsis LpxD paralogs.
    action: UNDECIDED
    reason: The node placement is sound for the family, and LPXD1 lies inside the clade. However, there
      is target-specific evidence of divergence. The R293 residue implicated in acyl-ACP binding is lysine
      in LPXD1 (confirmed on the current gene model), two aromatic acceptor-binding residues are missing,
      and loss of LPXD1 does not change lipid X levels. The authors conclude that LPXD2 is the primary
      LpxD and leave open both a minor LpxD role and an LpxA-like activity for LPXD1. No in vitro assay
      or E. coli complementation of LPXD1 exists. The inherited activity is plausible but neither shown
      nor excluded, so the row is left undecided rather than accepted or removed.
