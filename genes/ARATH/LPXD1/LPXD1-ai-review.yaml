id: F4JGP6
gene_symbol: LPXD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: LPXD1 (At4g05210) is one of two Arabidopsis paralogs of the bacterial UDP-3-O-acylglucosamine
  N-acyltransferase LpxD, the third enzyme of the lipid A precursor pathway, which adds an (R)-3-hydroxyacyl
  chain from acyl carrier protein to the glucosamine amine of UDP-3-O-acyl-GlcN. It is a nuclear-encoded
  hexapeptide-repeat (left-handed beta-helix) acyltransferase with an N-terminal mitochondrial transit
  peptide, and an N-terminal GFP fusion is targeted to mitochondria. The catalytic histidine is conserved,
  but an arginine implicated in acyl-ACP binding is replaced by lysine and two aromatic acceptor-binding
  residues are missing. Unlike its paralog LPXD2, loss of LPXD1 does not lower the pathway intermediate
  lipid X (2,3-diacylglucosamine 1-phosphate), and null plants have no visible phenotype. LPXD1 is therefore
  at most a minor contributor to lipid X synthesis, and whether it has LpxD activity, a different acyltransferase
  activity (such as LpxA-like UDP-GlcNAc acylation) or no catalytic role is unknown.
