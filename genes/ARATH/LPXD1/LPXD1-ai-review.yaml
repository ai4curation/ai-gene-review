core_functions:
- description: Mitochondrially targeted LpxD-subfamily hexapeptide-repeat acyltransferase, paralog of
    the predominant Arabidopsis LpxD (LPXD2). Its catalytic histidine is conserved but residues for acyl-ACP
    and acceptor binding have diverged, and its loss does not affect lipid X, so its acyl acceptor and
    any contribution to the lipid A precursor pathway are unresolved.
  molecular_function:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:21709257
    supporting_text: However, 5′-terminal fusions of AtLpxD1, AtLpxD2, AtLpxB, and AtLpxK to GFP showed
      the same mitochondrial pattern as full-length AtLpxA and AtLpxC
  - reference_id: PMID:21709257
    supporting_text: The lipid X level in the atlpxd1-1 mutant was not reduced from that of wild type
  - reference_id: PMID:21709257
    supporting_text: R293 is conserved between E. coli LpxD and AtLpxD2, but is replaced by lysine in
      AtLpxD1.
  - reference_id: file:ARATH/LPXD1/LPXD1-uniprot.txt
    supporting_text: Belongs to the transferase hexapeptide repeat family. LpxD subfamily.
  knowledge_gaps:
  - gap_statement: The acyl acceptor of LPXD1 is unknown. It may be a weak or conditional LpxD (UDP-3-O-acyl-GlcN),
      an LpxA-like UDP-GlcNAc acyltransferase accounting for residual lipid X in atlpxa mutants, or catalytically
      inactive.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Does recombinant LPXD1 acylate UDP-3-O-acyl-GlcN (LpxD activity), UDP-GlcNAc (LpxA-like
    activity) or neither, and does the R293K substitution change its acyl-ACP chain-length preference?
- question: Is LPXD1 expressed at a level, tissue or condition where it could contribute to lipid X synthesis,
    given that LPXD2 provides nearly all of it in seedlings?
- question: Is the 2011 claim that only LPXD2 has the N-terminal nucleotide-binding domain an artefact
    of the gene model used at the time?
suggested_experiments:
- experiment_type: in vitro enzyme assay and bacterial complementation
  hypothesis: LPXD1 has weak LpxD activity or LpxA-like activity.
  description: Express mature LPXD1 (without transit peptide) and assay with R-3-hydroxymyristoyl-ACP
    and either UDP-3-O-acyl-GlcN or UDP-GlcNAc; test complementation of E. coli lpxD and lpxA conditional
    mutants alongside LPXD2.
- experiment_type: double mutant lipid profiling
  hypothesis: LPXD1 accounts for the residual lipid X in atlpxa or atlpxd2 mutants.
  description: Generate atlpxd1 atlpxd2 and atlpxa atlpxd1 double mutants in a matched background and
    quantify lipid X by LC-MRM.
