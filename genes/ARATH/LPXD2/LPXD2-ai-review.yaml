- description: Mitochondrial UDP-3-O-acylglucosamine N-acyltransferase (LpxD) that transfers an (R)-3-hydroxyacyl
    chain from acyl carrier protein to UDP-3-O-acyl-glucosamine, the third step of the plant lipid A precursor
    pathway. It supplies nearly all LpxD activity in Arabidopsis seedlings, since lipid X is undetectable
    in its null mutant.
