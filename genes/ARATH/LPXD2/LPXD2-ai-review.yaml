id: F4JIP6
gene_symbol: LPXD2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: LPXD2 (At4g21220) encodes the predominant Arabidopsis UDP-3-O-acylglucosamine N-acyltransferase
  (LpxD), the third enzyme of a plant lipid A precursor pathway that mirrors the Escherichia coli Raetz
  pathway (LpxA, LpxC, LpxD, LpxB, LpxK, KdtA). By orthology to bacterial LpxD it transfers an (R)-3-hydroxyacyl
  chain from acyl carrier protein to the 2-amino group of UDP-3-O-acyl-glucosamine, forming UDP-2,3-diacylglucosamine,
  the precursor of lipid X (2,3-diacylglucosamine 1-phosphate). It is a nuclear-encoded hexapeptide-repeat
  (left-handed beta-helix) acyltransferase with an N-terminal mitochondrial transit peptide, and an N-terminal
  GFP fusion is targeted to mitochondria. Lipid X is undetectable in atlpxd2 null seedlings, whereas loss
  of the paralog LPXD1 has no effect, so LPXD2 supplies nearly all LpxD activity in seedlings. Null plants
  grow normally under laboratory conditions. The plant lipid A-like end product and its role, possibly
  in mitochondrial or chloroplast outer membranes or in signalling, are unknown.
