  review:
    summary: Lipid A biosynthetic process from the InterPro2GO mapping of IPR007691 (LpxD family). Flagged
      by Wei et al. 2020 (RAR) as a probable plant misannotation; that flag is refuted for this gene.
    action: ACCEPT
    reason: 'Core process, and the only GOA row for it rests on InterPro2GO, but gene-specific experimental
      evidence supports it directly. LPXD2 catalyses a step of the pathway itself (participation, not
      mere requirement): in atlpxd2-1 null seedlings lipid X, the intermediate two steps downstream, is
      undetectable, and atlpxd2-1 strongly lowers the lipid X that accumulates in atlpxb-1. This places
      LPXD2 between LpxC and LpxB, as for E. coli LpxD. The comparator check is satisfied because the
      term''s members are the pathway enzymes themselves (E. coli LpxA, LpxC, LpxD, LpxB, LpxK, KdtA),
      and the Arabidopsis LpxA and KdtA reviews accept it on the same kind of evidence. The plant end
      product is unknown, but the precursor steps are shared with E. coli, so the RAR flag reflected
      sparse plant curation rather than absence of the pathway.'
    supported_by:
    - &d2null
      reference_id: PMID:21709257
      supporting_text: lipid X was undetectable in the atlpxd2-1 mutant compared with its parental plant
    - &d2pred
      reference_id: PMID:21709257
      supporting_text: indicating that AtLpxD2 is the predominant UDP-3- O -acyl-GlcN N -acyltransferase
    - &d2lpxb
      reference_id: PMID:21709257
      supporting_text: Introducing the atlpxd2-1 mutation into the atlpxb-1 mutant background significantly
        lowered lipid X levels
    - &pathway
