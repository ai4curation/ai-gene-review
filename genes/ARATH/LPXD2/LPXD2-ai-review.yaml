  title: Pathway for lipid A biosynthesis in Arabidopsis thaliana resembling that of Escherichia coli.
  findings:
  - statement: Lipid X is undetectable in the atlpxd2-1 null mutant and lowered when atlpxd2-1 is combined
      with atlpxb-1; LPXD2 is the predominant Arabidopsis LpxD.
    supporting_text: lipid X was undetectable in the atlpxd2-1 mutant compared with its parental plant
  - statement: A 5'-terminal LPXD2-GFP fusion shows a mitochondrial pattern in root cells.
    supporting_text: However, 5′-terminal fusions of AtLpxD1, AtLpxD2, AtLpxB, and AtLpxK to GFP showed
      the same mitochondrial pattern as full-length AtLpxA and AtLpxC
  - statement: atlpxd2 null plants have no obvious phenotype under laboratory conditions.
    supporting_text: Null mutants of AtLpxA , AtLpxD2 , AtLpxB , AtLpxK , and AtKdtA , as well as AtLpxC-RNAi
      knock-down plants, show no obvious phenotypic differences compared to wild type under laboratory
      conditions
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC3136250). Primary genetic and LC-MS evidence for LPXD2 as the main
      Arabidopsis LpxD, plus GFP localisation; refutes the RAR lipid A misannotation flag for this gene.
      The atlpxd2-1 line is a gene-trap insertion in Landsberg erecta and was compared with its matched
      Ler parent. Its statement that only AtLpxD2 has the N-terminal nucleotide-binding domain is not
      borne out by the current gene models (see the LPXD1 bioinformatics RESULTS.md).
