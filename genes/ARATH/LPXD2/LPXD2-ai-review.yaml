- term:
    id: GO:0009507
    label: chloroplast
  evidence_type: ISM
  original_reference_id: GO_REF:0000122
  qualifier: located_in
  review:
    summary: Chloroplast predicted by AtSubP sequence analysis (TAIR).
    action: REMOVE
    reason: Contradicted by experiment. In mesophyll cells the Lpx-GFP fusions formed punctate signals
      that did not colocalise with chloroplasts, and in roots the LPXD2 fusion showed the mitochondrial
      pattern. The N-terminal presequence is a predicted mitochondrial transit peptide. Some lipid X is
      found in chloroplasts, which the authors interpret as transport of the lipid, not as a chloroplast
      location for the enzymes.
    supported_by:
    - reference_id: PMID:21709257
      supporting_text: In mesophyll cells, GFP signals were shown as 1 μm dots, but were not colocalized
        with chloroplasts
    - *gfp
    - reference_id: PMID:21709257
      supporting_text: These findings suggest that lipid A precursors are synthesized in mitochondria and
        may be transported from mitochondria to chloroplasts.
