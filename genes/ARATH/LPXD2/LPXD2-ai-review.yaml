suggested_questions:
- question: What is the acyl-ACP donor and chain-length preference of LPXD2 in mitochondria, given that
    the mitochondrial fatty acid synthase is the likely source of (R)-3-hydroxyacyl-ACP?
- question: Why does loss of LPXD2, which removes detectable lipid X, cause no visible phenotype; is the
    pathway needed only under stress, during pathogen challenge or in specific tissues?
- question: Does LPXD2 form a homotrimer, like bacterial LpxD, and does it hetero-oligomerise with the
    closely related LPXD1?
suggested_experiments:
- experiment_type: in vitro enzyme assay and bacterial complementation
  hypothesis: LPXD2 is a functional LpxD that N-acylates UDP-3-O-(R-3-hydroxymyristoyl)-GlcN using R-3-hydroxyacyl-ACP.
  description: Express mature LPXD2 (without transit peptide), assay with UDP-3-O-acyl-GlcN and R-3-hydroxymyristoyl-ACP,
    and test complementation of an E. coli lpxD conditional mutant.
- experiment_type: complementation in planta
  hypothesis: Loss of lipid X in atlpxd2-1 is caused by the LPXD2 insertion and not by background effects.
  description: Transform atlpxd2-1 with a genomic LPXD2 construct and quantify lipid X by LC-MRM; isolate
    a second, Col-0 background atlpxd2 allele.
- experiment_type: stress and pathogen phenotyping
  hypothesis: The LPXD2-dependent lipid A-like product has a conditional role in mitochondrial membrane
    function or defence.
  description: Challenge atlpxd2 mutants with bacterial pathogens and mitochondrial stressors and measure
    growth, respiration and immune outputs.
