- id: PMID:17785527
  title: Arabidopsis JACKDAW and MAGPIE zinc finger proteins delimit asymmetric cell division and stabilize
    tissue boundaries by restricting SHORT-ROOT action.
  findings:
  - statement: MGP expression depends on SHR and SCR; JKD and MGP regulate the SHR/SCR range of action.
    supporting_text: JACKDAW expression is initiated independent of SHORT-ROOT and regulates the SCARECROW
      expression domain outside the stele, while MAGPIE expression depends on SHORT-ROOT and SCARECROW
  - statement: JKD and MGP regulate tissue boundaries and asymmetric cell division.
    supporting_text: JACKDAW and MAGPIE regulate tissue boundaries and asymmetric cell division and can
      control SHORT-ROOT and SCARECROW activity in a transcriptional and protein interaction network
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding JKD/MGP paper; abstract-only cache.
