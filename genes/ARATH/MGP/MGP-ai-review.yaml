taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: MAGPIE (MGP; INDETERMINATE DOMAIN 3, IDD3) is a nuclear BIRD/IDD-family C2H2 zinc-finger
  transcription factor of Arabidopsis. MGP is a direct transcriptional target of the SHORT-ROOT (SHR)-SCARECROW
  (SCR) complex and is expressed in the ground tissue, including the cortex/endodermis initials. Like
  its paralog JACKDAW, MGP uses zinc fingers ZF1-ZF3 to bind the IDD consensus DNA motif with high affinity
  and ZF3-ZF4 to dock the GRAS-domain SHR-SCR heterodimer, binding SHR-SCR in a manner mutually exclusive
  with JKD. Through these interactions MGP forms part of a SHR-dependent feed-forward loop that sets the
  range of SHR/SCR action; together with other BIRD proteins (JKD, BLJ, NUC) it contributes to the formative
  asymmetric division of the ground-tissue initials, to cortex identity and to stabilization of tissue
  boundaries. MGP/IDD3 also binds DELLA and SCL3 coregulators at gibberellin-responsive promoters and
  acts positively in gibberellin signalling.
