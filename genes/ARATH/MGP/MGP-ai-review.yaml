  findings:
  - statement: JKD activates the MGP promoter with SHR and SCR.
    supporting_text: Our findings suggest that JKD directly regulates SCR and MGP expression in cooperation
      with SHR, SCR and MGP
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache.
- id: PMID:24821766
  title: DELLA protein functions as a transcriptional activator through the DNA binding of the indeterminate
    domain family proteins.
  findings:
  - statement: IDDs (including AtIDD3/MGP) bind DELLA and the SCL3 promoter.
    supporting_text: we identified five members of indeterminate domain (IDD) protein family which bind
      physically to both DELLA and the promoter sequence of the GA-positive regulator SCARECROW-LIKE 3
      (SCL3)
  - statement: AtIDD3 acts positively in GA signalling (IDD3-SRDX).
    supporting_text: supported the possibility that AtIDD3 is positively involved in GA signaling
  - statement: IDDs are DNA-binding scaffolds for the DELLA and SCL3 coregulators.
    supporting_text: These results suggest that the coregulators DELLA and SCL3, using IDDs as transcriptional
      scaffolds for DNA binding, antagonistically regulate the expression of their downstream targets
      to control the GA signaling pathway
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Partial full text.
- id: PMID:25829440
  title: Arabidopsis BIRD Zinc Finger Proteins Jointly Stabilize Tissue Boundaries by Confining the Cell
    Fate Regulator SHORT-ROOT and Contributing to Fate Specification.
  findings:
  - statement: BIRDs retain SHR in nuclei and regulate SCR and CYCD6.
    supporting_text: constraining SHORT-ROOT spread through nuclear retention and transcriptional regulation
      of key downstream SHORT-ROOT targets, including SCARECROW and CYCLIND6
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache.
- id: PMID:26494755
  title: Transcriptional control of tissue formation throughout root development.
  findings:
  - statement: MGP, with JKD, BIB and NUC, is required for formative ground-tissue divisions.
    supporting_text: JKD and BALD-IBIS regulate SHR movement by promoting its nuclear retention, and cooperatively
      with MAGPIE (MGP) and NUTCRACKER (NUC) are required for the formative divisions that pattern the
      ground tissue into cortex and endodermis
  - statement: MGP is a direct SHR target.
    supporting_text: Our network indicated that SCR, BLJ, JKD, MGP, and NUC are direct targets of SHR
  - statement: Cortex marker expression requires JKD, MGP and NUC.
    supporting_text: Expression of cortex-specific markers required at least JKD, MGP, and NUC
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:28211915
  title: Structure of the SHR-SCR heterodimer bound to the BIRD/IDD transcriptional factor JKD.
  findings:
  - statement: MGP ZF1-ZF3 bind DNA, ZF3-ZF4 bind SHR-SCR.
    supporting_text: of the four ZFs of MGP and possibly JKD, ZF1, ZF2 and ZF3 are responsible for DNA
      binding, while ZF3 and ZF4 are involved in SHR binding
  - statement: MGP ZF1-4 binds the IDD consensus with 50 nM affinity.
    supporting_text: Our DNA binding assay using this consensus sequence with ZFs of MGP showed high affinity
      (KD value of 50 nM) for ZF1-4 (all four ZFs)
  - statement: SHR-SCR binds MGP ZF3-ZF4 with 36 nM affinity.
