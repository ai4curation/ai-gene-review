id: Q4V3E2
gene_symbol: MRG2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MRG2 is an Arabidopsis MRG-domain chromatin effector whose N-terminal
  chromodomain reads active histone H3K36me3 and H3K4me3 marks. MRG2 is
  partially redundant with MRG1 and binds euchromatic target loci, including
  flowering-time genes, where it helps connect methylated H3 tails to
  transcriptional activation by recruiting MYST histone acetyltransferases and
  by cooperating with CONSTANS at the FT promoter.
