- id: PMID:25183522
  title: >-
    Arabidopsis MRG domain proteins bridge two histone modifications to elevate
    expression of flowering genes.
  findings:
  - statement: >-
      Xu et al. showed that MRG2 localizes to euchromatin, binds
      H3K36me3/H3K4me3 peptides, is recruited to FT chromatin in an
      SDG8/H3K36me3-dependent manner, and physically couples HAM1/HAM2 MYST
      acetyltransferases to methylated H3 chromatin.
    supporting_text: >-
      MRG1/2 binds to H3K36me3 with their chromodomain and interact with the
      histone H4-specific acetyltransferases (HAM1 and HAM2)
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache. This paper directly supports MRG2 nuclear euchromatin
      localization, H3K36me3/H3K4me3 reader activity, FT/FLC transcriptional
      regulation, and the interaction between MRG2 and the MYST
      acetyltransferases HAM1/AT5G64610 and HAM2/AT5G09740.
- id: PMID:25211338
  title: >-
    Regulation of arabidopsis flowering by the histone mark readers MRG1/2 via
    interaction with CONSTANS to modulate FT expression.
  findings:
  - statement: >-
      Bu et al. identified MRG1/MRG2 as H3K36me3/H3K4me3 readers, solved MRG2
      chromodomain structures bound to trimethylated H3K4 and H3K36 peptides,
      and showed that MRG2 and CONSTANS reinforce each other's binding at FT
      promoter chromatin.
    supporting_text: >-
      MRG2 associates with the chromatin of FT promoter in a way dependent of
      both CO and H3K4me3/H3K36me3.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache. This paper is the strongest direct source for the dual
      H3K36me3/H3K4me3 reader activity of MRG2 and for its CO-linked FT
      promoter binding.
- id: PMID:32324922
  title: >-
    The histone methylation readers MRG1/MRG2 and the histone chaperones
    NRP1/NRP2 associate in fine-tuning Arabidopsis flowering time.
  findings:
  - statement: >-
      MRG2 binds NRP1/NRP2-family histone chaperones, and the two protein
      families cooperate in fine-tuning FT and FLC transcription.
    supporting_text: >-
      MRG2 binds histone chaperones belonging to the NUCLEOSOME ASSEMBLY
      PROTEIN 1 (NAP1) family, including NAP1-RELATED PROTEIN (NRP)1 and NRP2
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. The paper supports the TAIR NRP1/NRP2 IPI row, but
      the broad protein-binding annotation itself is removed under the
      GO:0005515 policy.
