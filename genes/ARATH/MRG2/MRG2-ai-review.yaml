suggested_questions:
- question: >-
    What are the direct MRG2-containing complexes at flowering-gene chromatin,
    and which plant NuA4 or non-NuA4 subunits are required for HAM1/HAM2
    recruitment?
- question: >-
    How do H3K36me3, H3K4me3 and CONSTANS binding combine to determine MRG2
    residence time at individual target promoters and gene bodies?
