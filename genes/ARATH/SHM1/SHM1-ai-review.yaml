core_functions:
- description: Mitochondrial serine hydroxymethyltransferase that converts glycine and GDC-derived
    5,10-methylene-THF into L-serine and THF in the photorespiratory C2 cycle of leaf mesophyll
    mitochondria.
  supported_by:
  - reference_id: PMID:16339799
    supporting_text: Mitochondrial serine hydroxymethyltransferase (SHMT), combined with glycine
      decarboxylase, catalyzes an essential sequence of the photorespiratory C2 cycle, namely,
      the conversion of two molecules of glycine into one molecule each of CO2, NH4+, and serine.
  - reference_id: PMID:22303256
    supporting_text: The photorespiratory SHM enzyme (EC. 2.1.2.1) is encoded by a single gene
      (At4g37930) in Arabidopsis.
