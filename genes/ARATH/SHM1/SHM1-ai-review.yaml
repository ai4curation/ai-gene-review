id: Q9SZJ5
gene_symbol: SHM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SHM1 (At4g37930; synonyms SHMT1 and STM) encodes the mitochondrial serine hydroxymethyltransferase
  that acts in the photorespiratory C2 cycle. The nuclear-encoded precursor carries an N-terminal
  mitochondrial presequence, and the mature enzyme is a pyridoxal 5'-phosphate-dependent SHMT-family
  protein. In the mitochondrial matrix of leaf mesophyll cells it transfers the one-carbon unit
  of 5,10-methylenetetrahydrofolate, produced by the glycine decarboxylase complex, to a second
  glycine. This forms L-serine and regenerates tetrahydrofolate, so the two enzymes together
  convert two glycines into serine, CO2 and NH4+. SHM1 is the only SHMT that serves photorespiration.
  The paralog SHM2 is largely excluded from mesophyll mitochondria, but SHM1 and SHM2 act redundantly
  in one-carbon metabolism of vascular cells. shm1 null mutants lack mitochondrial SHMT activity,
  accumulate glycine, and are conditionally lethal in ambient air but grow normally at elevated
  CO2. SHM1 activity is supported by physical interaction with mitochondrially targeted Fd-GOGAT
  (GLU1). SHM1 protein levels are controlled by ubiquitin- and proteasome-dependent turnover,
  opposed by the deubiquitinase UBP16, and by phosphorylation (including by FERONIA). Weak alleles
  accumulate reactive oxygen species and show lesions, salt sensitivity and greater susceptibility
  to pathogens, consistent with a protective role of photorespiratory flux.
