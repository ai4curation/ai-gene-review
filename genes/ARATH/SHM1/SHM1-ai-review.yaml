  qualifier: involved_in
  review:
    summary: Glycine metabolic process, based on the SHMT activity and the glycine accumulation
      of shm mutants.
    action: ACCEPT
    reason: SHMT reversibly interconverts glycine and serine. SHM1 consumes glycine in photorespiration
      and works with SHM2 in one-carbon metabolism of vascular cells. Because the reaction runs
      in different directions in different cell types, glycine metabolic process is as precise
      as the evidence warrants.
    supported_by:
