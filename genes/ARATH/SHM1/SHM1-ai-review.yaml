suggested_questions:
- question: Does the GLU1 (Fd-GOGAT) interaction regulate SHM1 catalysis directly (for example
    kinetics or folate channelling), or does it act through SHM1 stability or assembly?
- question: How do the UBP16 deubiquitination and FERONIA/Ser31 phosphorylation controls on
    SHM1 stability fit together, and where (cytosolic precursor or mitochondrial pool) does
    SHM1 turnover occur?
suggested_experiments:
- description: Compare SHM1 kinetic constants and oligomeric state with and without purified
    mitochondrial Fd-GOGAT, and test for folate channelling between GDC and SHM1.
  hypothesis: GLU1 binding stimulates SHM1 catalysis or stabilises its active tetramer.
  experiment_type: enzyme kinetics
