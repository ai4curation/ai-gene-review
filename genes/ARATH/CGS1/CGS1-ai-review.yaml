proposed_new_terms:
- proposed_name: O-phospho-L-homoserine-dependent cystathionine gamma-synthase activity
  proposed_definition: 'Catalysis of the reaction: O-phospho-L-homoserine + L-cysteine = L,L-cystathionine + phosphate
    (RHEA:80891, EC 2.5.1.160).'
  justification: GO:0003962 is defined only with O-succinyl-L-homoserine (RHEA:20397). Plant cystathionine gamma-synthases
    use O-phospho-L-homoserine as the physiological substrate (PMID:9531508), and EC and Rhea now distinguish this
    reaction, but GO has no term for it. A child of GO:0003962 (or a broadened GO:0003962 with substrate-specific
    children for O-succinyl, O-acetyl and O-phospho esters) would let plant CGS be annotated to its actual reaction.
  supported_by:
  - reference_id: file:ARATH/CGS1/CGS1-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=O-phospho-L-homoserine + L-cysteine = L,L-cystathionine +
  - reference_id: PMID:9531508
    supporting_text: the gamma-replacement of the phosphoryl substituent of O-phosphohomoserine by cysteine
suggested_questions:
- question: Should GO broaden GO:0003962 or add substrate-specific children so that plant CGS (O-phospho-L-homoserine)
    and fungal CGS (O-acetyl-L-homoserine) are not annotated to an O-succinyl-defined reaction?
- question: Does the paralog CGS2 contribute measurable cystathionine synthesis in vivo, or is CGS1
    the sole plastidial CGS?
suggested_experiments:
- description: Measure CGS1 kinetics with O-phospho-L-homoserine, O-succinyl-L-homoserine and O-acetyl-L-homoserine
    in the same assay to quantify substrate preference, and compare with CGS2.
