- description: Plastid-stromal PLP-dependent cystathionine gamma-synthase that condenses O-phospho-L-homoserine
    with L-cysteine to L-cystathionine and phosphate, the first committed step of de novo methionine biosynthesis
    in plants (branch point with threonine synthase).
