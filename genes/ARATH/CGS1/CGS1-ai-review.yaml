taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: CGS1 (MTO1, At3g01120) encodes cystathionine gamma-synthase 1, a nuclear-encoded, chloroplast-targeted,
  pyridoxal 5'-phosphate-dependent enzyme of the trans-sulfuration family that catalyses the first committed step
  of methionine biosynthesis in plants. In the plastid stroma it replaces the phosphate of O-phospho-L-homoserine
  (also the substrate of threonine synthase, making this a branch point) with L-cysteine to form L-cystathionine;
  O-succinyl-L-homoserine is also accepted in vitro, O-acetyl-L-homoserine only poorly. Cystathionine is then cleaved
  by cystathionine beta-lyase to homocysteine, which is methylated to methionine. Unlike the enterobacterial enzyme,
  CGS1 has almost no gamma-elimination side activity. The mature enzyme is a homotetramer with one PLP per subunit.
  The N-terminal extension encoded by exon 1 contains the chloroplast transit peptide and the MTO1 region, a conserved
  plant-specific motif that acts on the nascent peptide to destabilise CGS1 mRNA in response to methionine (via
  S-adenosylmethionine); mto1 point mutations in this region abolish the feedback and cause methionine over-accumulation.
  CGS also accepts selenocysteine, and its overexpression increases selenium volatilisation.
