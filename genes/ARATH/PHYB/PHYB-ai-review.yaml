proposed_new_terms:
- proposed_name: photobody assembly
  proposed_definition: The formation of discrete nuclear foci containing photoactivated
    phytochrome and associated signaling proteins that serve as platforms for light-responsive
    transcriptional regulation
  proposed_parent:
    id: GO:0065003
    label: protein-containing complex assembly
  justification: PHYB forms specialized nuclear photobodies upon light activation
    - discrete subnuclear foci that coordinate light signaling. This represents a
    unique nuclear organization not captured by existing GO terms
  supported_by:
  - reference_id: file:ARATH/PHYB/PHYB-deep-research-falcon.md
    supporting_text: '**Photobodies** are subnuclear compartments enriched in phyB
      that form upon activation. Recent reviews frame photobody formation as **phase
      separation**, where dense phyB-enriched assemblies form within a less dense
      nucleoplasmic phase.'
- proposed_name: light-dependent protein photoconversion
  proposed_definition: The reversible light-induced conformational change in a photoreceptor
    protein between distinct photoactive forms that differ in their absorption spectra
    and signaling activities
  proposed_parent:
    id: GO:0009416
    label: response to light stimulus
  justification: PHYB undergoes reversible photoconversion between Pr and Pfr forms
    - a unique light-sensing mechanism that represents the fundamental basis of phytochrome
    signal transduction
  supported_by:
  - reference_id: file:ARATH/PHYB/PHYB-deep-research-falcon.md
    supporting_text: PHYB is a **red/far-red photoreceptor** that reversibly interconverts
      between inactive **Pr** and active **Pfr** states. Red light generates the biologically
      active Pfr state that accumulates in the nucleus, while far-red light drives
      reversion toward Pr; this photoreversibility underlies canonical red/far-red
      signaling.
core_functions:
- description: Functions as reversible red/far-red light photoreceptor that undergoes
    Pr-to-Pfr photoconversion to transduce light signals through nuclear photobody
    assembly and PIF transcription factor interactions
  supported_by:
  - reference_id: PMID:24982198
    supporting_text: Many aspects of plant photomorphogenesis are controlled by the
      phytochrome (Phy) family of bilin-containing photoreceptors that detect red
      and far-red light
  - reference_id: PMID:23321421
    supporting_text: Phytochromes ( phys ) encompass a diverse collection of biliproteins
      that enable cellular light perception by photoconverting between a red-light-absorbing
      ground state (Pr) and a far-red light-absorbing active state (Pfr)
  - reference_id: file:ARATH/PHYB/PHYB-deep-research-falcon.md
    supporting_text: In dark-grown seedlings PHYB is largely cytosolic/inactive; upon
      photoactivation it accumulates in the **nucleus** and condenses into **photobodies
      (PBs)**, subnuclear membraneless compartments. Recent work supports that PBs
      form by **liquid-liquid phase separation (LLPS)** and function as dynamic biochemical
      hubs rather than passive aggregates.
  molecular_function:
