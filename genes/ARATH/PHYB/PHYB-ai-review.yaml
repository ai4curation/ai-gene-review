    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0016604
    label: nuclear body
- description: 'PHYB acts as a thermosensor: the active Pfr state reverts thermally
    to inactive Pr at a rate that rises with temperature, so PHYB activity integrates
    temperature as well as light and controls thermoresponsive growth through PIF4-dependent
    transcription.'
  supported_by:
  - reference_id: PMID:27789797
    supporting_text: thermal timers that integrate temperature information over the
      course of the night
  - reference_id: PMID:30635559
    supporting_text: Daytime temperature is sensed by phytochrome B in Arabidopsis
      through a transcriptional activator HEMERA
