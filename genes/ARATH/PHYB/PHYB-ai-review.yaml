    label: nucleus
suggested_questions:
- question: What are the precise molecular mechanisms governing photobody assembly
    and disassembly kinetics in different light conditions?
  experts:
  - Plant photobiology researchers
  - Protein complex assembly specialists
- question: How do different phosphorylation sites on PHYB differentially regulate
    PIF interaction specificity and nuclear body formation?
  experts:
  - Plant protein modification experts
  - Phytochrome signaling researchers
- question: The plant HKRD lacks residues required for histidine kinase activity; does
    the OPM support the Ser/Thr protein kinase activity that has been proposed, but
    not firmly established, for plant phytochromes, and if so what are its structural
    determinants and in vivo substrates?
  experts:
  - Structural biologists
  - Plant kinase researchers
- question: How does the PSM-OPM inter-domain communication regulate light-dependent
    conformational changes?
  experts:
  - Protein conformational dynamics researchers
  - Phytochrome structural biologists
suggested_experiments:
- hypothesis: PHYB phosphorylation status controls the formation and dissolution of
    nuclear photobodies
  description: Generate phosphomimetic and phosphodeficient mutants of key PHYB phosphorylation
    sites and analyze nuclear body formation using live-cell imaging under different
    light conditions. Compare photobody dynamics, size, and PIF sequestration capacity.
- hypothesis: The PSM and OPM domains undergo conformational coupling during Pr-to-Pfr
    photoconversion
  description: Use FRET-based biosensors with fluorophores positioned in PSM and OPM
    domains to monitor real-time conformational changes during red/far-red light treatments.
    Combine with hydrogen-deuterium exchange mass spectrometry to map conformational
    flexibility.
- hypothesis: If the Ser/Thr protein kinase activity proposed for plant phytochromes
    is real (histidine kinase activity is excluded by the HKRD sequence), it contributes to PHYB-dependent
    chromatin organization and gene expression regulation
  description: Generate PHYB mutants defective in the proposed Ser/Thr kinase activity and analyze genome-wide chromatin
    accessibility changes using ATAC-seq and RNA-seq under different light conditions.
    Compare with wild-type PHYB to identify kinase-dependent vs. kinase-independent
    functions.
- hypothesis: Different PIF family members have distinct binding affinities and residence
    times with PHYB in photobodies
  description: Use single-molecule tracking and fluorescence recovery after photobleaching
    (FRAP) to measure binding kinetics of different PIF proteins to PHYB photobodies.
    Correlate binding dynamics with transcriptional output of PIF target genes.
