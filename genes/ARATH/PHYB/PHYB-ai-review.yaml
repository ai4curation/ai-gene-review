  review:
    summary: IBA from PTN000703785, a deep histidine kinase node. Plant phytochromes
      carry a C-terminal histidine kinase-related domain (HKRD) that lacks residues
      critical to histidine kinase activity, so PHYB does not autophosphorylate on
      histidine or pass a phosphate to an aspartate. Both the GO definition of phosphorelay
      sensor kinase activity and that of phosphorelay signal transduction system require
      that His-to-Asp phosphotransfer.
