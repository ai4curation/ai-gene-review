id: P14713
gene_symbol: PHYB
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: PHYB (PHYTOCHROME B, also known as HY3/OOP1) is the predominant red/far-red
  light photoreceptor in Arabidopsis that functions as a master regulator of photomorphogenesis,
  thermomorphogenesis, and circadian entrainment. The protein exists as a homodimer
  with a modular architecture comprising an N-terminal photosensory module (PSM) containing
  PAS, GAF, and PHY domains, and a C-terminal output module (OPM) carrying two PAS domains and
  a histidine kinase-related domain (HKRD) that lacks residues critical to histidine
  kinase activity. PHYB undergoes reversible photoconversion between the inactive cytoplasmic
  Pr form (red light-absorbing) and the active nuclear Pfr form (far-red light-absorbing)
  through conformational changes in its covalently-attached linear tetrapyrrole chromophore.
  Upon red light activation, the Pfr form rapidly translocates to the nucleus where
  it assembles into discrete nuclear photobodies and interacts with Phytochrome Interacting
  Factors (PIFs) including PIF3, PIF4, PIF5, and PIF8 to regulate gene expression.
  Key structural features include an N-terminal extension (NTE) essential for nuclear
  localization and transcriptional activity, and a light-sensing knot crucial for
  PIF binding specificity. PHYB functions as a thermal integrator, associating with
  target gene promoters in a temperature-dependent manner to control thermomorphogenic
  responses through PIF4-mediated transcriptional repression. The protein exhibits
  negative autoregulation of its own expression and controls diverse developmental
  processes including de-etiolation, hypocotyl elongation, flowering time, stomatal
  regulation, and circadian phase control. Additionally, PHYB destabilizes specific
  PIFs (like UNE10/PIF8) in response to red light and coordinates complex signaling
  networks through interactions with co-regulators, chromatin remodeling factors,
  and post-translational modification enzymes.
