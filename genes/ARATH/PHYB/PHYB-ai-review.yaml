    label: phosphorelay sensor kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: InterPro2GO mapping from the histidine kinase domain signature. Plant
      phytochromes carry a C-terminal histidine kinase-related domain (HKRD) that
      lacks residues critical to histidine kinase activity, so PHYB does not autophosphorylate
      on histidine or pass a phosphate to an aspartate. Both the GO definition of
      phosphorelay sensor kinase activity and that of phosphorelay signal transduction
      system require that His-to-Asp phosphotransfer.
    action: REMOVE
    supported_by: &id001
    - reference_id: PMID:19286967
      supporting_text: plant phys have unique C termini that contain two PAS domains
        and a region homologous to two-component histidine kinases but lacking residues
        critical to HK activity
    reason: An electronic domain-to-function mapping contradicted by the known divergence
      of the plant phytochrome HKRD. Reconciled with the retired duplicate review
      genes/ARATH/P14713 (same protein), which had KEEP_AS_NON_CORE; this file previously
      had ACCEPT, supported only by a photosensory-module crystal structure quote
      that does not address kinase activity. Neither verdict fits once the missing
      catalytic residues are taken into account.
