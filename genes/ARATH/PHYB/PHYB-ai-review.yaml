  review:
    summary: This annotation is based on the landmark study demonstrating light-dependent
      binding of PHYB to PIF3. This represents a core regulatory interaction where
      light-activated PHYB binds to PIF transcription factors. However, the generic
      protein binding term is less informative than specific transcription factor
      binding. Note that PHYB itself is not a DNA-binding transcription factor; it
      binds PIF transcription factors, so the informative replacement is transcription
      factor binding (GO:0008134), not DNA-binding transcription factor activity.
    action: MODIFY
    reason: While the interaction is fundamental, generic protein binding is less
      informative. PHYB does not bind DNA directly as a transcription factor; rather,
      photoactivated PHYB binds the bHLH PIF transcription factors. The informative
      molecular function is therefore transcription factor binding (GO:0008134).
