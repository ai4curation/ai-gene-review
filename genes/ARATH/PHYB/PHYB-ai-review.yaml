      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN000703785
        source_label: histidine kinase superfamily node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The GO:0000155 IBD at this deep node is seeded only by canonical
          two-component histidine kinases (E. coli, S. pombe, Dictyostelium, Arabidopsis
          cytokinin/ethylene-pathway HKs); no phytochrome is among the seeds, and
          the plant phytochrome clade lost the catalytic residues.
