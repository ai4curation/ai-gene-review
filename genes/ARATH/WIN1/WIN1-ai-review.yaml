id: Q9M8M7
gene_symbol: WIN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: WIN1 (At1g80600), also known as TUMOR PRONE5 (TUP5), is a pyridoxal-phosphate-dependent acetylornithine
  aminotransferase of Arabidopsis arginine biosynthesis. It converts N-acetylglutamate semialdehyde and
  glutamate to N-acetylornithine and 2-oxoglutarate. Functional GFP experiments demonstrate chloroplast
  localization. Arginine deficiency in tup5 mutants causes a blue-light-dependent loss of root meristem
  maintenance, while null alleles impair gametophytes and embryos. WIN1 also interacts with the bacterial
  effector HopW1-1, and its overexpression modifies pathogen responses and salicylic-acid accumulation.
