suggested_questions:
- question: Which genes do NF-YA3/NF-YA8-containing NF-Y complexes bind and regulate in the early embryo, and are
    PIN or other auxin-pathway genes direct targets?
- question: Which NF-YB and NF-YC subunits partner with NF-YA3 in planta, and does NF-YA3 activate or repress transcription
    at its targets?
- question: Should the double-mutant embryo arrest support a process annotation such as embryo development ending
    in seed dormancy (GO:0009793), given that the direct mechanism is unknown?
suggested_experiments:
- description: ChIP-seq of native-promoter tagged NF-YA3 in developing seeds combined with transcriptome profiling
    of nf-ya3 nf-ya8 (or inducible RNAi) globular embryos to define direct targets.
- description: Co-immunoprecipitation or yeast three-hybrid screens to identify the NF-YB/NF-YC partners of NF-YA3
    and test their CCAAT binding by EMSA; GFP-NF-YA3 imaging to confirm nuclear localization.
