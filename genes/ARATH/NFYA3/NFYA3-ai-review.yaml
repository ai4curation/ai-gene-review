core_functions:
- description: NF-YA subunit of the nuclear NF-Y heterotrimer; associates with an NF-YB/NF-YC histone-fold dimer
    to form a complex that recognizes CCAAT boxes in promoters and regulates RNA polymerase II transcription. Acts
    redundantly with NF-YA8 in early embryogenesis; direct targets are unknown.
  contributes_to_molecular_function:
