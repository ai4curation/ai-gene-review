  title: Interactions and CCAAT-binding of Arabidopsis thaliana NF-Y subunits.
  findings:
  - statement: Recombinant AtNF-YA3 forms CCAAT-binding NF-Y complexes with mouse NF-YB/NF-YC and with an Arabidopsis
      NF-YB/NF-YC dimer in EMSA.
    supporting_text: Figure 5B shows that an NF-Y complex was obtained with AtNF-YA3, AtNF-YA6, AtNF-YA8 and AtNF-YA9.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; the only direct biochemical evidence for NF-YA3 (in vitro).
- id: PMID:24303077
  title: The Arabidopsis NF-YA3 and NF-YA8 genes are functionally redundant and are required in early embryogenesis.
  findings:
  - statement: nf-ya3 nf-ya8 double mutants are embryo lethal, arresting at an abnormal globular stage; single mutants
      are normal.
    supporting_text: Plants from single nf-ya3 and nf-ya8 mutants are similar to wild-type plants, whereas nf-ya3
      nf-ya8 double mutants are embryo lethal.
  - statement: Double-mutant embryos lose DR5rev::GFP auxin response; regulation of PIN genes is speculative.
    supporting_text: Promoter-reporter gene studies using DR5rev::GFP revealed that the GFP signal was completely
      absent in nf-ya3 nf-ya8 defective embryos, except at proembryo stage when they displayed a normal embryo phenotype.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; main genetic study of NF-YA3. No target genes identified.
- id: PMID:23118940
  title: Functional and transcriptome analysis reveals an acclimatization strategy for abiotic stress tolerance
    mediated by Arabidopsis NF-YA family members.
  findings:
  - statement: NF-YA3 is induced by low N, low P and high sucrose and is most responsive to low N.
    supporting_text: under low N NF-YA3 was the most responsive (19-fold induction at 14dag)
  - statement: 35S:NF-YA3 plants resemble wild type, unlike NF-YA2, 7 and 10 overexpressors.
    supporting_text: P35S:NF-YA3 plants developed in a similar fashion to WT controls
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Expression and overexpression data for NF-YA3; stress-tolerance and transcriptome
      conclusions are pooled across NF-YA members.
- id: PMID:42171007
  title: 'Context matters: coordinated transcriptional regulation and root plasticity under multinutrient conditions.'
  findings:
  - statement: nf-ya3 mutants show altered root responses to combined N and Zn deficiency; NF-YA3 lies in a suberin-enriched
      co-expression module.
    supporting_text: nf‐ya3 displayed broad responses to N | Zn across all measured traits
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached; network and mutant phenotyping only, no mechanism.
