description: 'NF-YA3 (HAP2C, At1g72830) is one of ten Arabidopsis NF-YA (HAP2/CBF-B) subunits of the nuclear factor
  Y (NF-Y) CCAAT-box binding heterotrimer. It carries the conserved NFYA/HAP2 subunit-association domain and the
  C-terminal NFYA-type DNA-binding segment; recombinant NF-YA3 assembles with NF-YB/NF-YC histone-fold dimers (mouse
  or Arabidopsis) into complexes that bind a CCAAT-box probe in vitro. NF-YA3 is broadly expressed, is a target
  of miR169, and is induced by nutrient stresses, most strongly by low nitrogen. Genetically it is redundant with
  its close paralog NF-YA8: single mutants are normal, whereas nf-ya3 nf-ya8 double mutants arrest as abnormal globular
  embryos with loss of the DR5 auxin-response signal, so the pair is required for early embryogenesis. Its direct
  target genes and in planta NF-YB/NF-YC partners are not known.'
