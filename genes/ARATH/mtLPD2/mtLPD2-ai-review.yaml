description: >-
  At3g17240 encodes mtLPD2, one of two mitochondrial dihydrolipoyl dehydrogenases
  (lipoamide dehydrogenase, E3, EC 1.8.1.4) in Arabidopsis. It should not be
  confused with the chloroplastic LPD2 encoded by At4g16155. mtLPD2 is a
  homodimeric FAD-containing flavoprotein of the class-I pyridine
  nucleotide-disulfide oxidoreductase family. It has a redox-active disulfide
  and uses NAD+ to reoxidize dihydrolipoyl groups that are covalently attached
  to the lipoyl domains of its partner enzymes, producing NADH. After import via
  an N-terminal transit peptide it resides in the mitochondrial matrix. There
  mitochondrial E3 serves the 2-oxoacid dehydrogenase complexes (pyruvate,
  2-oxoglutarate and branched-chain 2-oxoacid dehydrogenases), and it serves as
  the L protein of the glycine decarboxylase complex. mtLPD2 transcripts are
  more abundant in roots and less light-responsive than those of its paralog
  mtLPD1 (At1g48030). On this basis mtLPD2 is proposed to work mainly in the
  2-oxoacid dehydrogenase complexes, while mtLPD1 is the main L protein for
  photorespiratory glycine decarboxylation in leaves. The two proteins are
  thought to be interchangeable. An mtlpd2 knockout has no visible phenotype
  under laboratory conditions, but loss-of-function analysis of both genes
  shows that both mtLPDs contribute to photorespiration, with mtLPD1
  predominant, and the leaf glycine decarboxylase complex contains about four
  times more L1 than L2 protein.
