core_functions:
- description: Mitochondrial dihydrolipoyl dehydrogenase (E3). This FAD flavoprotein
    reoxidizes the dihydrolipoyl arms of 2-oxoacid dehydrogenase complexes with NAD+,
    producing NADH. It is proposed to act mainly in these complexes, including the
    2-oxoglutarate dehydrogenase complex of the TCA cycle.
  supported_by:
  - reference_id: file:ARATH/mtLPD2/mtLPD2-uniprot.txt
    supporting_text: Reaction=N(6)-[(R)-dihydrolipoyl]-L-lysyl-[protein] + NAD(+) =
      N(6)-[(R)-lipoyl]-L-lysyl-[protein] + NADH + H(+)
  - reference_id: PMID:11598235
    supporting_text: mtLPD2 encodes the protein incorporated into alpha-ketoacid dehydrogenase
      complexes
  molecular_function:
    id: GO:0004148
    label: dihydrolipoyl dehydrogenase (NADH) activity
  directly_involved_in:
