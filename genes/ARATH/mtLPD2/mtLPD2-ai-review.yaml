  review:
    summary: Retained on Cu2+-charged immobilized metal affinity chromatography (IMAC)
      of mitochondrial proteins.
    action: MARK_AS_OVER_ANNOTATED
    reason: IMAC retention shows surface affinity for an immobilized metal, which is
      often due to exposed histidine or cysteine residues. It does not show physiological
      copper binding. LPD is an FAD/NAD flavoprotein with no known metal cofactor. The
      study was designed to find proteins susceptible to metal-catalysed oxidative
      damage, not to define metal-binding functions.
    supported_by:
    - reference_id: PMID:20018591
      supporting_text: Immobilized metal affinity chromatography charged with Cu(2+),
        Zn(2+), and Co(2+) was used to identify over 100 mitochondrial proteins with
        metal-binding properties.
