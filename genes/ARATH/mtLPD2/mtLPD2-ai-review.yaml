suggested_questions:
- question: Both mtLPDs contribute to photorespiration, with mtLPD1 predominant
    (PMID:41990722), and the leaf GDC holds about four times more L1 than L2
    (PMID:32311173). Does mtLPD2 occupy GDC in proportion to its abundance, or is it
    preferentially assembled into the 2-oxoacid dehydrogenase complexes?
- question: Is the proposed division of labour (mtLPD1 for GDC, mtLPD2 for the 2-oxoacid
    dehydrogenase complexes) reflected at the protein level, or only in transcript
    abundance?
suggested_experiments:
- description: Isoform-specific peptide quantification of the E3 bound to purified
    GDC versus PDC/OGDC/BCKDC from leaf and root mitochondria.
  hypothesis: mtLPD2 is enriched in the 2-oxoacid dehydrogenase complexes and in root
    mitochondria, while mtLPD1 dominates leaf GDC.
  experiment_type: quantitative proteomics
- description: Phenotype the mtlpd1 mtlpd2 combination (for example mtlpd1 knockdown
    in the mtlpd2 knockout) under ambient and high CO2.
  hypothesis: Combined loss impairs both photorespiration and TCA-cycle 2-oxoacid
    oxidation, showing redundancy between the two isoforms.
  experiment_type: genetic analysis
