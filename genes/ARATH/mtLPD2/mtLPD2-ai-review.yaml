- term:
    id: GO:0009853
    label: photorespiration
  evidence_type: IMP
  original_reference_id: PMID:41990722
  review:
    summary: Loss-of-function analysis of both Arabidopsis mtLPDs shows that mtLPD2
      contributes to photorespiration, though less than mtLPD1.
    action: NEW
    reason: 'Participation test: as the L protein of the glycine decarboxylase complex, mtLPD2
      reoxidizes the H-protein lipoyl arm in the photorespiratory glycine decarboxylation step,
      so it does part of the work of the process. The mutant study reports that both mtLPDs
      contribute to photorespiration, with mtLPD1 predominant; this matches the NEW
      photorespiration rows on mtLPD1 and on the minor P-protein isoform GLDP2, and the about
      4:1 L1:L2 leaf stoichiometry explains why mtLPD2 is the minor contributor. The earlier
      mtlpd2 single mutant without a visible phenotype (PMID:11598235) is consistent with
      redundancy. Abstract-only cache; the abstract states the result directly.'
    supported_by:
    - reference_id: PMID:41990722
      supporting_text: >-
        While the two mtLPDs both contribute to photorespiration, mtLPD1 plays a more
        predominant role, especially under high-light stress.
    - reference_id: PMID:32311173
      supporting_text: >-
        The Arabidopsis GDC contains four times more of the isoforms GCS-P1 and GCS-L1 in
        comparison with GCS-P2 and GCS-L2
