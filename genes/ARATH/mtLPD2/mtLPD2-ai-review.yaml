    label: oxoglutarate dehydrogenase complex
- description: Minor L protein of the mitochondrial glycine decarboxylase complex,
    reoxidizing the H-protein dihydrolipoyl arm with NAD+ in photorespiratory glycine
    decarboxylation, at about a quarter of the level of mtLPD1 in leaves.
  supported_by:
  - reference_id: PMID:32311173
    supporting_text: >-
      The Arabidopsis GDC contains four times more of the isoforms GCS-P1 and GCS-L1 in
      comparison with GCS-P2 and GCS-L2
  - reference_id: PMID:41990722
    supporting_text: >-
      While the two mtLPDs both contribute to photorespiration, mtLPD1 plays a more
      predominant role, especially under high-light stress.
  molecular_function:
