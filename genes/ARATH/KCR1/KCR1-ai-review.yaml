gene_symbol: KCR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: KCR1 (beta-ketoacyl-CoA reductase 1; also GLOSSY8-like, At1g67730) is the 3-ketoacyl-CoA
  reductase of the endoplasmic reticulum fatty acid elongase in Arabidopsis. It is a short-chain dehydrogenase/reductase
  family enzyme anchored in the ER membrane by an N-terminal transmembrane segment and retained there
  by a C-terminal dilysine motif. KCR1 catalyzes the second step of each very-long-chain fatty acid (VLCFA)
  elongation cycle, the NADPH-dependent reduction of the 3-ketoacyl-CoA produced by a condensing enzyme
  (KCS) to a (3R)-3-hydroxyacyl-CoA, which is then dehydrated by PAS2 and reduced by ECR/CER10. Unlike
  the many substrate-specific KCS isoforms, KCR1 is a shared, broadly expressed core subunit and is the
  only functional microsomal KCR in Arabidopsis (the paralog KCR2 is inactive). Consequently it supplies
  VLCFAs for sphingolipids, seed triacylglycerols, cuticular waxes, suberin and root glycerolipids; loss
  of KCR1 is embryo lethal, and partial suppression causes organ fusion, reduced wax load and altered
  VLCFA composition of multiple lipid classes.
