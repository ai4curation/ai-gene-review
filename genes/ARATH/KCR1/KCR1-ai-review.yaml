    elongase, catalyzing the NADPH-dependent reduction of very-long-chain 3-oxoacyl-CoAs to (3R)-3-hydroxyacyl-CoAs
    in every elongation cycle, thereby supplying VLCFAs for sphingolipids, storage lipids and cuticular
    waxes.
