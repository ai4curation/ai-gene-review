suggested_questions:
- question: Does KCR1 abundance limit flux through the elongase when several KCS isoforms compete for
    it, as proposed to explain fiddlehead-like phenotypes without glossiness in KCR1-RNAi lines?
- question: Is KCR2 a pseudo-enzyme or does it reduce a non-VLCFA 3-oxo substrate, given that it lacks
    KCR activity in yeast yet is conserved and ER-localized?
suggested_experiments:
- description: Assay NADPH-dependent reduction of C18-C28 3-oxoacyl-CoAs by purified or microsomal KCR1
    (and KCR2) to define chain-length kinetics and test whether KCR2 retains any activity.
- description: Titrate KCR1 expression (inducible RNAi / overexpression) in lines expressing different
    KCS isoforms and measure acyl-CoA and 3-oxo/3-hydroxy intermediates to test whether KCR1 is rate-limiting
    for specific elongase complexes.
