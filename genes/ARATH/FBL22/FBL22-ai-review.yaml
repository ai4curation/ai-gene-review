- term:
    id: GO:0005634
    label: nucleus
  evidence_type: ISM
  original_reference_id: GO_REF:0000122
  review:
    summary: Nuclear localization comes from an AtSubP sequence-based prediction. FBL22 is a soluble
      F-box/LRR protein with no signal peptide, transmembrane segment or organellar targeting feature,
      and no localization experiment has been reported.
    action: MARK_AS_OVER_ANNOTATED
    reason: The prediction is not contradicted, since F-box proteins and SCF complexes act in the nucleus
      as well as the cytosol, and a soluble protein lacking targeting signals could be in either. But
      AtSubP selects one compartment for a protein whose location is unknown, and SCF family membership
      does not establish a nuclear-specific site of action. Removal would overstate the case against
      an uncontradicted prediction, while acceptance would overstate an unverified single-compartment
      assignment. Marking it as an over-annotation records that the nuclear assertion goes beyond the
      evidence.
    supported_by:
    - reference_id: file:ARATH/FBL22/FBL22-uniprot.txt
      supporting_text: 'PE   4: Predicted;'
    additional_reference_ids:
    - file:ARATH/FBL22/FBL22-deep-research-falcon.md
- term:
    id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  evidence_type: TAS
  original_reference_id: PMID:11019805
  review:
    summary: This TAS row was assigned from Callis and Vierstra (2000), a review of the ubiquitin/proteasome
      pathway in plant signaling, as part of early family-wide annotation of Arabidopsis F-box proteins.
      FBL22 has a PROSITE-defined F-box (residues 24-71) followed by five LRRs, the architecture of
      SCF substrate-recognition subunits.
    action: KEEP_AS_NON_CORE
    reason: The claim is that FBL22 takes part in ubiquitin-dependent protein degradation as an F-box
      substrate adaptor. This follows from the same F-box architecture and phylogenetic inference that
      support the accepted core SCF ubiquitin ligase complex binding (IBA) row. An F-box/LRR protein
      recruits substrates to the SCF ligase, so it does part of the work of the process rather than
      being a substrate. Nothing contradicts the claim, but nothing gene-specific supports it either, so it is retained as non-core rather than accepted as a core function (core_functions lists only the SCF-binding MF). The evidence is family-level, as no FBL22 substrate,
      SCF assembly or degradation assay exists, and the full review text was not accessible. The term
      is kept at this general level rather than refined to SCF-dependent proteasomal catabolism, so
      that it does not go beyond the predicted evidence.
    supported_by:
    - reference_id: PMID:11019805
      supporting_text: Recent studies have linked proteolysis by the ubiquitin/proteasome pathway to
        a variety of signaling pathways in higher plants.
    - reference_id: file:ARATH/FBL22/FBL22-uniprot.txt
      supporting_text: 'PE   4: Predicted;'
    additional_reference_ids:
    - file:ARATH/FBL22/FBL22-deep-research-falcon.md
- term:
    id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  evidence_type: TAS
  original_reference_id: PMID:11077244
  review:
    summary: Xiao and Jang (2000) classified the Arabidopsis F-box protein family, and UniProt cites
      this paper for FBL22 gene-family assignment and nomenclature. The TAS row records the expected
      role of a family member in ubiquitin-dependent protein turnover.
    action: KEEP_AS_NON_CORE
    reason: This row shares its claim with the PMID:11019805 TAS row and is consistent with the accepted
      SCF-binding IBA. UniProt confirms that the paper places FBL22 in the F-box family, which is the
      basis of the TAS. The local record has no abstract and the publisher full text was not accessible,
      but the family assignment it supports is verified through UniProt. The F-box/LRR architecture
      makes participation in ubiquitin-dependent protein catabolism as a substrate adaptor the expected
      function, and no contrary evidence exists. The claim remains a family-level prediction without
      a gene-specific assay, so it is kept as non-core, matching the PMID:11019805 row.
    supported_by:
    - reference_id: file:ARATH/FBL22/FBL22-uniprot.txt
      supporting_text: GENE FAMILY, AND NOMENCLATURE.
    - reference_id: file:ARATH/FBL22/FBL22-uniprot.txt
      supporting_text: 'PE   4: Predicted;'
    additional_reference_ids:
    - file:ARATH/FBL22/FBL22-deep-research-falcon.md
