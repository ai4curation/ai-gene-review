id: Q9C587
gene_symbol: RFC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: RFC1 (At5g22010) is the large subunit of the heteropentameric replication factor C (RFC) clamp loader
  of Arabidopsis thaliana. It has an N-terminal disordered region, a BRCT domain and an AAA+ ATPase module with
  a Walker A ATP-binding motif, and assembles with the four small subunits RFC2-RFC5. As part of RFC it uses ATP
  to open the PCNA sliding clamp and load it at primer-template junctions, enabling processive DNA synthesis by
  replicative polymerases during replication and repair. The protein is nuclear and associates with meiotic chromosomes
  at zygotene and pachytene. Null alleles are embryo or seed lethal; a weak allele (rfc1-1) is hypersensitive to
  MMS and cisplatin, has elevated somatic homologous recombination, shorter telomeres and partial release of transcriptional
  gene silencing, while the partial loss-of-function allele rfc1-2 is largely fertile in vegetative growth but defective
  in meiosis, where RFC1 acts after RAD51 in the MSH4-dependent pathway that forms interference-sensitive (class
  I) crossovers.
existing_annotations:
- term:
    id: GO:0000712
    label: resolution of meiotic recombination intermediates
  evidence_type: IMP
  original_reference_id: PMID:23144629
  qualifier: acts_upstream_of_or_within
  review:
    summary: rfc1-2 partial loss-of-function meiocytes form multivalents and fragmented chromosomes and lose interference-sensitive
      (class I) crossovers; RFC1 acts after RAD51 in the MSH4/PTD pathway.
    action: ACCEPT
    reason: 'The acts_upstream_of_or_within qualifier fits the genetics in PMID:23144629 (full text read): RFC1
      is required downstream of RAD51 for the formation of class I COs from recombination intermediates, which the
      authors model as lagging-strand synthesis needed for double Holliday junction formation. RFC1 is not itself
      a resolvase, so the term is read as RFC1 acting upstream of resolution, which the qualifier permits. A meiosis-specific
      RNAi line reproduced the defect, supporting a direct meiotic role rather than a mitotic side effect.'
    supported_by:
    - &id009
      reference_id: PMID:23144629
      supporting_text: Therefore, these results support the hypothesis that RFC1 acts after RAD51 to promote recombination.
    - &id011
      reference_id: PMID:23144629
      supporting_text: Our analyses demonstrate that the rfc1−/− plants form multivalents and are defective in CO
        formation via the interference-sensitive pathway (Type I), supporting the idea that lagging strand synthesis
        is probably important for dHJ formation.
