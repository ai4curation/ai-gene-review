suggested_questions:
- question: UniProt's FUNCTION text lists the hypersensitive response among RFC1 roles; is there experimental evidence
    for a defence (HR cell death) phenotype in rfc1 mutants, or does 'HR' there refer to homologous recombination?
- question: Does Arabidopsis RFC1 load PCNA1/PCNA2 in vitro, and does meiotic recombination require RFC1-RFC2-5
    specifically or also the alternative RFC-like complexes (CTF18, ELG1, RAD17 clamp loaders)?
suggested_experiments:
- description: Reconstitute Arabidopsis RFC1-5 and measure ATP-dependent PCNA loading on primer-template DNA, including
    a Walker A mutant of RFC1.
- description: Physically monitor meiotic recombination intermediates (joint molecules, dHJs) in rfc1-2 versus wild
    type to test whether RFC1-dependent DNA synthesis is needed for dHJ formation.
