- term:
    id: GO:0048046
    label: apoplast
  evidence_type: HDA
  original_reference_id: PMID:18538804
  review:
    summary: >-
      High-throughput proteomic detection of CSD2 in apoplastic wash fluid.
    action: REMOVE
    reason: >-
      CSD2 possesses a canonical 62-residue N-terminal chloroplast transit
      peptide (uniprot:O78310), lacks a secretory signal peptide, and is
      imported into the chloroplast stroma (PMID:9765550; PMID:15772282;
      PMID:18431481). Unlike peripheral association with thylakoid membranes
      inside the plastid (GO:0009579), a plastid-imported stromal protein has no
      secretory route across the chloroplast envelope and plasma membrane into
      the extracellular apoplast; detection in whole-leaf apoplastic wash fluid
      reflects plastid lysis contamination.
    supported_by:
    - reference_id: PMID:15772282
      supporting_text: "CSD1 encodes a Cu/ZnSOD active in the cytosol, and CSD2 encodes a Cu/ZnSOD active in the chloroplast stroma."
- term:
    id: GO:0009579
    label: thylakoid
  evidence_type: HDA
  original_reference_id: PMID:16648217
  review:
    summary: >-
      Proteomic identification of CSD2 in the peripheral thylakoid proteome
      released from purified thylakoid membranes.
    action: KEEP_AS_NON_CORE
    reason: >-
      Giacomelli et al. (2006, PMID:16648217) identified Cu,Zn-SOD (spot 390) in
      the peripheral/lumenal thylakoid proteome released by mild sonication of
      Percoll-purified thylakoids. While CSD2's primary compartment is the
      chloroplast stroma (GO:0009570), peripheral association with the stromal
      face of thylakoid membranes near Photosystem I (where superoxide is
      photoproduced in the water-water cycle) is biologically plausible within
      the plastid, unlike the extracellular apoplast HDA artifact (GO:0048046).
    supported_by:
    - reference_id: PMID:16648217
      supporting_text: "The soluble thylakoid proteome (lumen and peripherally attached proteins) were released by mild sonication (three times for 20 s at 10 W) with a Fisher Scientific membrane dismembrator (model 100) from a 3 mL thylakoid suspension at 1 mg chlorophyll mL −1 ."
    - reference_id: PMID:16648217
      supporting_text: "Spot 390 contained Cu,Zn SOD that was consistently more abundant in vtc2 ."
