- term:
    id: GO:0035195
    label: miRNA-mediated post-transcriptional gene silencing
  evidence_type: IEP
  original_reference_id: PMID:16861386
  review:
    summary: >-
      Mis-annotation of an mRNA target substrate (CSD2) to the miRNA-mediated
      post-transcriptional gene silencing pathway.
    action: REMOVE
    reason: >-
      A gene product is involved_in a biological process only if it performs
      part of the work of that process. Sunkar et al. (2006, PMID:16861386)
      showed that CSD2 mRNA is cleaved as a target substrate of miR398-loaded
      RISC; the chloroplastic CSD2 superoxide dismutase enzyme plays no role in
      executing miRNA-mediated gene silencing.
    supported_by:
    - reference_id: PMID:16861386
      supporting_text: "After 2 d of coexpression with miR398, CSD1 and CSD2 mRNA decreased substantially, which demonstrated that the miR398 can direct the degradation of CSD1 and CSD2 mRNAs in vivo"
