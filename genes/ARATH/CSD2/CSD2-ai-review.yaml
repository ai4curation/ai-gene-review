      released by mild sonication of purified thylakoids and is upregulated in
      the ascorbate-deficient vtc2 mutant.
    supporting_text: "Spot 390 contained Cu,Zn SOD that was consistently more abundant in vtc2 ."
    full_text_unavailable: false
- id: PMID:16861386
  title: Posttranscriptional induction of two Cu/Zn superoxide dismutase genes in Arabidopsis is mediated by downregulation of miR398 and important for oxidative stress tolerance.
  findings:
  - statement: >-
      miR398 directs cleavage of CSD1 and CSD2 mRNAs, and oxidative stress
      downregulates miR398 to promote CSD1 and CSD2 accumulation and oxidative
      stress tolerance.
    supporting_text: "Here, we show that miR398 expression is downregulated transcriptionally by oxidative stresses, and this downregulation is important for posttranscriptional CSD1 and CSD2 mRNA accumulation and oxidative stress tolerance."
    full_text_unavailable: false
- id: PMID:18275461
  title: Long-term effects of mild salt stress on growth, ion accumulation and superoxide dismutase expression of Arabidopsis rosette leaves.
  findings:
  - statement: >-
      Mild long-term salt treatment lowers CSD2 transcript expression in
      Arabidopsis rosette leaves.
    supporting_text: "In both accessions, the expression of CSD2 and CSD3 was lowered by salt."
    full_text_unavailable: true
- id: PMID:18392778
  title: Sucrose induction of Arabidopsis miR398 represses two Cu/Zn superoxide dismutases.
  findings:
  - statement: >-
      Sucrose induces miR398 and decreases CSD1 and CSD2 mRNA and protein
      accumulation.
    supporting_text: "Here we show that miR398 is positively regulated by sucrose, resulting in decreased CSD1 and CSD2 mRNA and protein accumulation."
    full_text_unavailable: true
