- term:
    id: GO:0035195
    label: miRNA-mediated post-transcriptional gene silencing
  evidence_type: IEP
  original_reference_id: PMID:16861386
  review:
    summary: >-
      Mis-annotation of an mRNA target substrate (CSD2) to the miRNA-mediated
      post-transcriptional gene silencing pathway.
    action: REMOVE
    reason: >-
      A gene product is involved_in a biological process only if it performs
      part of the work of that process. Sunkar et al. (2006, PMID:16861386)
      showed that CSD2 mRNA is cleaved as a target substrate of miR398-loaded
      RISC; the chloroplastic CSD2 superoxide dismutase enzyme plays no role in
      executing miRNA-mediated gene silencing. Most comparator miRNA targets in
      Arabidopsis (e.g., SPLs, ARFs, AP2, APS1, LAC4) are not annotated to
      GO:0035195, and the two other TAIR protein-coding targets carrying
      GO:0035195 (CSD1 and PXMT1/AT1G66700) reflect the same substrate-vs-actor
      curation error.
    supported_by:
    - reference_id: PMID:16861386
      supporting_text: "After 2 d of coexpression with miR398, CSD1 and CSD2 mRNA decreased substantially, which demonstrated that the miR398 can direct the degradation of CSD1 and CSD2 mRNAs in vivo"
    - reference_id: file:projects/THLAR_OILSEED/mirna_targets/goa_tair_mirna_annotations.tsv
      supporting_text: "tair.gaf.gz\tAGI_LocusCode\tAT2G28190\tCSD2\tinvolved_in\tGO:0035195\tPMID:16861386\tIEP\t\tP\tSuperoxide dismutase [Cu-Zn] 2, chloroplastic\tprotein"
    source_defects:
    - defect_type: WRONG_TERM
      resource: TAIR
      requested_change: DELETE_ROW
      asserted_value: GO:0035195
      confidence: CONFIRMED
      explanation: >-
        CSD2 mRNA is the cleaved target substrate of miR398-guided RISC
        (PMID:16861386), not an actor in miRNA-mediated post-transcriptional
        gene silencing (GO:0035195).
