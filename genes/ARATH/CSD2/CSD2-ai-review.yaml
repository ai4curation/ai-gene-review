id: O78310
gene_symbol: CSD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  Superoxide dismutase [Cu-Zn] 2, chloroplastic (CSD2, AT2G28190) is the
  plastid-localized copper/zinc superoxide dismutase in Arabidopsis thaliana.
  Synthesized with a 62-residue N-terminal chloroplast transit peptide, mature
  CSD2 functions in the chloroplast stroma (with peripheral association reported
  at the stromal surface of thylakoid membranes) as part of the water-water
  (Mehler-peroxidase) cycle, catalyzing the disproportionation of
  photochemically generated superoxide radicals into molecular oxygen and
  hydrogen peroxide. Plastidic CSD2 activation depends on copper import across
  the chloroplast envelope and thylakoid membranes by the P-type ATPases PAA1
  and PAA2, while CSD2 mRNA abundance is post-transcriptionally controlled by
  miR398-guided cleavage in response to copper availability, sucrose, and
  oxidative stress.
