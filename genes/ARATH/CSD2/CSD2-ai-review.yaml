core_functions:
- description: >-
    Catalyzes the copper- and zinc-dependent disproportionation of superoxide
    radicals into hydrogen peroxide and molecular oxygen in the chloroplast
    stroma and at the thylakoid surface during the photosynthetic water-water
    cycle.
  molecular_function:
    id: GO:0004784
    label: superoxide dismutase activity
  directly_involved_in:
  - id: GO:0019430
    label: removal of superoxide radicals
  - id: GO:0034599
    label: cellular response to oxidative stress
  locations:
  - id: GO:0009570
    label: chloroplast stroma
  - id: GO:0009579
    label: thylakoid
  supported_by:
  - reference_id: PMID:9765550
    supporting_text: "Subcellular fractionation studies confirmed the presence of CSD2 and FeSOD protein within Arabidopsis chloroplasts."
  - reference_id: PMID:15772282
    supporting_text: "CSD1 encodes a Cu/ZnSOD active in the cytosol, and CSD2 encodes a Cu/ZnSOD active in the chloroplast stroma."
  - reference_id: PMID:16861386
    supporting_text: "Posttranscriptional induction of two Cu/Zn superoxide dismutase genes in Arabidopsis is mediated by downregulation of miR398 and important for oxidative stress tolerance."
suggested_questions:
- question: >-
    What molecular mechanism governs the partitioning of mature CSD2 between the
    soluble chloroplast stroma and the stromal surface of thylakoid membranes
    near Photosystem I under high-light stress?
suggested_experiments:
- description: >-
    Quantify the ratio of thylakoid-associated to soluble stromal CSD2 protein
    and specific activity across a light-intensity gradient in wild-type, paa2,
    and ccs mutants using rapid subplastidial fractionation.
  hypothesis: >-
    High-light-driven electron transport promotes transient electrostatic
    recruitment of holo-CSD2 to the stromal face of PSI-enriched thylakoid
    membranes where superoxide is generated.
