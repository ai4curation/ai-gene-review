id: Q9SSD1
gene_symbol: TMM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: TOO MANY MOUTHS (TMM; RLP17) is a plasma-membrane leucine-rich-repeat receptor-like protein
  (RLP) with an extracellular LRR domain and a single transmembrane segment but no cytoplasmic kinase
  domain. It is expressed in proliferating stomatal-lineage (postprotodermal) cells and functions as a
  co-receptor for the ERECTA-family receptor kinases (ERECTA, ERL1, ERL2). TMM forms constitutive heteromeric
  complexes with ERECTA and ERL1 (and associates with SERK co-receptor kinases), and the TMM-ERf complex
  creates the binding pocket that recognizes the inhibitory EPF1 and EPF2 peptides and the competing positive
  peptide stomagen/EPFL9, while excluding the stem-growth EPFL4/EPFL6 peptides. TMM therefore acts as
  a specificity switch that directs ERECTA-family signalling, via the YODA-MKK4/5-MPK3/6 cascade, toward
  inhibition of stomatal development and the orientation of spacing divisions. Loss of TMM randomizes
  the orientation of asymmetric spacing divisions and permits entry divisions next to existing stomata,
  producing stomatal clusters in leaves, whereas stomata are absent from some organs such as inflorescence
  stems, reflecting region-specific positive and negative effects mediated through different EPF/EPFL
  ligands.
