core_functions:
- description: Non-catalytic LRR receptor-like co-receptor that forms constitutive complexes with ERECTA-family
    receptor kinases at the plasma membrane and, together with them, creates the binding site for the
    inhibitory EPF1/EPF2 peptides (and the competing stomagen), conferring ligand specificity on ERECTA-family
    signalling that orients spacing divisions and prevents stomatal clustering.
  molecular_function:
    id: GO:0015026
    label: coreceptor activity
  directly_involved_in:
  - id: GO:0010375
    label: stomatal complex patterning
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:28536146
    supporting_text: TMM interaction with ERL1 creates a binding pocket for recognition of EPF1 and EPF2,
      indicating that the constitutive TMM-ERf complexes function as the receptors of EPF1 and EPF2.
  - reference_id: PMID:22241782
    supporting_text: Our results place the ERECTA family as the primary receptors for EPFs with TMM as
      a signal modulator
  - reference_id: PMID:11090210
    supporting_text: tmm randomizes this orientation and releases a prohibition on asymmetric division
      in cells at specific locations, resulting in stomatal clusters.
suggested_questions:
- question: How does a single co-receptor produce opposite, organ-specific effects on stomatal initiation
    (clusters in leaves, no stomata in stems), and is this fully explained by TMM's exclusion of EPFL4/EPFL6
    from ERECTA-family receptors?
- question: Is TMM localization or abundance itself regulated during stomatal lineage progression (e.g.
    by SPCH-dependent transcription or endocytosis), providing feedback on EPF sensitivity?
suggested_experiments:
- description: Structure-guided TMM interface mutants that abolish ERf binding but preserve folding, tested
    for complementation of tmm leaf clustering and stem stomatal absence, to separate ligand-pocket formation
    from EPFL4/6 exclusion in vivo.
  experiment_type: structure-function genetics
