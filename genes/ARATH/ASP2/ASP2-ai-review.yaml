id: P46645
gene_symbol: ASP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ASP2 encodes the major cytosolic aspartate aminotransferase activity AAT2 in Arabidopsis.
  This pyridoxal-phosphate enzyme reversibly transfers nitrogen between glutamate and aspartate, coupling
  oxaloacetate and 2-oxoglutarate metabolism to nitrogen assimilation and the supply of aspartate for
  asparagine formation.
