suggested_questions:
- question: Which BRC1 direct targets besides HB21/HB40/HB53 mediate cell-cycle and ribosome gene repression
    in dormant buds, and does BRC1 repress them directly or by competing with class I TCPs?
- question: How is BRC1 protein activity (not only transcript level) regulated, e.g. by interaction with
    FT/TSF florigens or SMXL-associated factors, given that high BRC1 transcript can coexist with active
    buds?
suggested_experiments:
- description: Bud-specific ChIP-seq of tagged BRC1 under SL treatment and shade, combined with RNA-seq
    of brc1 brc2 buds, to define direct BRC1 targets and their SL dependence.
  experiment_type: genomics (ChIP-seq/RNA-seq)
