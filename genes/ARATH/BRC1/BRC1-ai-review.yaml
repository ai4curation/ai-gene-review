id: A1YKT1
gene_symbol: TCP18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'BRANCHED1 (BRC1; TCP18, TEOSINTE BRANCHED1-LIKE1) is a class II (CYC/TB1-type) TCP-domain
  transcription factor expressed mainly in axillary buds, where it promotes bud dormancy and suppresses
  bud outgrowth; it is the Arabidopsis counterpart of maize TEOSINTE BRANCHED1. BRC1 is nuclear, binds
  GC-rich TCP-type sites (consensus GGgcCCmc) and directly activates the class I HD-ZIP genes HB21, HB40
  and HB53, which in turn promote NCED3 expression and abscisic acid accumulation inside the bud; it also
  down-regulates cell-cycle and ribosome gene networks. BRC1 transcription integrates branching signals:
  it is raised by strigolactone (via SL-triggered degradation of the SMXL6/7/8 co-repressors), shade (low
  R:FR) and apical dominance, and lowered by decapitation and sugar/cytokinin signals. brc1 mutants are
  highly branched and show reduced responses to strigolactone, shade and auxin-mediated apical dominance,
  although BRC1 expression sets bud activation potential rather than being strictly necessary or sufficient
  for bud arrest.'
