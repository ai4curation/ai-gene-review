- description: Bud-expressed TCP transcription factor that integrates branching signals (strigolactone,
    shade, apical dominance) and keeps axillary buds dormant, in part by directly activating HD-ZIP genes
    HB21/HB40/HB53 that boost ABA synthesis in the bud.
