taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: At1g14810 encodes the Arabidopsis aspartate-semialdehyde dehydrogenase, a homodimeric enzyme
  detected in the chloroplast stroma. It uses NADPH to reduce aspartyl phosphate to aspartate semialdehyde,
  providing the common intermediate for the diaminopimelate lysine branch and for homoserine-derived threonine
  and methionine synthesis. Purified recombinant enzyme exhibits cooperative dependence on aspartyl phosphate.
  The experimentally demonstrated NADPH reaction does not establish an equivalent native NADH-dependent
  route.
