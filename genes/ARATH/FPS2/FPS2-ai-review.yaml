taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: Farnesyl diphosphate synthase 2 (FPS2, At4g17190) of Arabidopsis thaliana is a 342-residue Mg2+-dependent
  trans-prenyltransferase of the FPP/GGPP synthase family. It catalyses the two successive head-to-tail condensations
  of isopentenyl diphosphate (IPP) with dimethylallyl diphosphate (DMAPP) and then with the resulting geranyl
  diphosphate (GPP), producing (2E,6E)-farnesyl diphosphate (FPP), the branch-point precursor of sterols,
  brassinosteroids, triterpenoids, sesquiterpenoids, polyprenols, the ubiquinone side chain and farnesylated
  proteins. FPS2 has no organellar targeting signal and localizes to the cytosol. It shares about 90% identity
  with FPS1; compared with FPS1S it is a faster, more thermostable but more salt-sensitive catalyst. FPS2 is the
  predominant FPS isozyme in mature seeds and early seedlings, where loss of FPS2 lowers sitosterol content; the
  two FPS genes are functionally redundant for growth, and loss of both arrests embryo development.
