suggested_questions:
- question: Does the higher thermostability of FPS2 relative to FPS1S matter for seed FPP supply under heat or
    other stress, and why is FPS2 the predominant seed isozyme if the two are interchangeable under normal conditions?
- question: Does FPS2 release appreciable free GPP in vivo, or is GPP strictly an enzyme-bound intermediate?
suggested_experiments:
- description: Compare germination and seed sterol content of fps2 lines complemented with FPS2 versus FPS1S under
    heat and salt stress to test whether FPS2 thermostability is physiologically relevant.
