- id: PMID:23145086
  title: Characterization of Arabidopsis FPS isozymes and FPS gene expression analysis provide insight into the
    biosynthesis of isoprenoid precursors in seeds.
  findings:
  - statement: Purified recombinant FPS2 shows Michaelis-Menten kinetics with IPP, DMAPP and GPP and higher kcat
      than FPS1S
    supporting_text: FPS2 showed catalytic rate constant (kcat) values for IPP, DMAPP, and GPP that were 3.2-, 2.7-
      and 2.7-fold higher, respectively, than FPS1S
  - statement: GFP fusions of FPS2 localize exclusively to the cytosol
    supporting_text: Under our experimental conditions all the four fusion proteins localized exclusively in the
      cytosol (Figure 5).
  - statement: FPS2 is more sensitive to NaCl inhibition than FPS1S
    supporting_text: At all NaCl concentrations tested, FPS2 was markedly more sensitive to the inhibitory effect
      of NaCl than FPS1S.
  - statement: FPS1S and FPS2 are functionally interchangeable in seeds under normal conditions
    supporting_text: This finding demonstrated that under normal conditions FPS1S and FPS2 are completely functionally
      interchangeable
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; source of the TAIR IDA rows (activities, FPP biosynthesis); also shows GFP cytosol
      localization of FPS2.
- id: PMID:8631820
  title: Arabidopsis thaliana contains two differentially expressed farnesyl-diphosphate synthase genes.
  findings:
  - statement: FPS2 cDNA rescues an erg20 yeast mutant and the enzyme catalyses both condensations to FPP
    supporting_text: We demonstrate that FPS2 catalyzes the two successive condensations of IPP with both DMAPP
      and geranyl diphosphate leading to FPP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only (cached); original cloning and functional characterisation of FPS2.
- id: PMID:20497375
  title: The Arabidopsis thaliana FPP synthase isozymes have overlapping and specific functions in isoprenoid biosynthesis,
    and complete loss of FPP synthase activity causes early developmental arrest.
  findings:
  - statement: FPS2 has a major role in seeds and early seedlings; fps1 fps2 double knockout is embryo lethal
    supporting_text: FPS2 appears to have a major role in seeds and during the early stages of seedling development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only (cached); genetics of FPS1/FPS2 redundancy. Phenotypes used as context only.
