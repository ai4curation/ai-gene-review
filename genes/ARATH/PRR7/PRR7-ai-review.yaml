  supporting_entities:
  - InterPro:IPR001789
  review:
    summary: >-
      InterPro2GO mapping from the response-regulator receiver domain (IPR001789). PRR7 is a pseudo-response
      regulator: its N-terminal pseudo-receiver domain lacks the conserved phospho-accepting aspartate,
      and no His-to-Asp phosphotransfer to any PRR has been demonstrated.
    action: REMOVE
    reason: >-
      Domain-based mapping that ignores the defining loss of the phosphorylatable Asp in pseudo-receivers.
      The PRR family acts as clock transcriptional repressors, not as phosphorelay components; the inference
      is contradicted on biological grounds.
    supported_by:
