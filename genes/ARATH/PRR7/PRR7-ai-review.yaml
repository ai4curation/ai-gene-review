gene_symbol: PRR7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PSEUDO-RESPONSE REGULATOR 7 (PRR7, APRR7) is a nuclear transcriptional repressor of the Arabidopsis
  circadian oscillator. Its transcript and protein peak from midday into the afternoon, after PRR9 and
  before PRR5/TOC1. Like other PRRs, it has an N-terminal pseudo-receiver domain, which lacks the phospho-accepting
  aspartate, and a C-terminal CCT domain that mediates promoter association. PRR7 binds the CCA1 and LHY
  promoters and represses them together with PRR9 and PRR5, recruiting TOPLESS/TPR corepressors. This
  forms part of the daytime negative arm of the CCA1/LHY-PRR feedback loop. PRR7 also directly represses
  many morning-expressed output genes, including master regulators of growth, light signalling and abiotic-stress
  responses. prr7 mutants have a lengthened period and an altered clock phase, prr5 prr7 double mutants
  are nearly arrhythmic, and PRR7 is needed for clock entrainment by sugars (its promoter is a target
  of the sugar-responsive bZIP63) and for red/far-red light responses during seedling de-etiolation.
