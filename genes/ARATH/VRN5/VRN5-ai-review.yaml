gene_symbol: VRN5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  VRN5 (VERNALIZATION 5; also VIN3-LIKE 1, VIL1) is a constitutively expressed nuclear VEL-family protein
  of Arabidopsis with an atypical PHD superdomain, a fibronectin III domain and a C-terminal VEL polymerization
  domain. It is an accessory subunit of plant Polycomb Repressive Complex 2. VRN5 binds the PRC2 core
  (via VRN2) through its compact PHD-superdomain/FNIII module and heterodimerizes with the cold-induced
  paralog VIN3 through the VEL domain, so it bridges VIN3 to PRC2. During prolonged cold, VRN5 associates,
  in a VIN3-dependent way, with a small nucleation region in FLC intron 1, where the resulting PHD-PRC2
  complex deposits H3K27me3. After return to warmth, VRN5 spreads across the FLC locus as H3K27me3 increases,
  stably silencing FLC. VRN5 also contributes to Polycomb silencing of the related floral repressor FLM,
  which promotes flowering in short days.
