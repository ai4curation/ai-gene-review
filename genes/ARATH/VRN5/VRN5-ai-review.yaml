core_functions:
- description: >-
    PRC2 accessory adaptor that binds the PRC2 core (VRN2) and heterodimerizes with VIN3 via the VEL domain,
    recruiting the cold-induced VIN3 into a PHD-PRC2 complex that nucleates and then spreads H3K27me3
    at FLC during and after vernalization. VRN5 is an accessory subunit of the PHD-PRC2, not a core
    ESC/E(Z) subunit, so its complex is recorded as chromatin silencing complex (as in its IDA and IBA
    annotations); the catalytic core subunits (VRN2, SWN, CLF, FIE, MSI1) carry ESC/E(Z) complex.
