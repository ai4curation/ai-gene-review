suggested_questions:
- question: >-
    Which VRN5 surface contacts VRN2 in the PRC2 core, and is this interaction cold-regulated or constitutive?
- question: >-
    How is VRN5 targeted to FLM and other Polycomb targets independently of VIN3 (e.g. in short days)?
suggested_experiments:
- hypothesis: >-
    The VRN5 PHD-FNIII interface is required for PRC2 binding and FLC silencing, but not for VIN3 heterodimerization.
  description: >-
    Map the VRN5-VRN2 interface by crosslinking-MS or structure prediction plus mutagenesis. Complement
    vrn5 with interface mutants and test PRC2 co-IP, VIN3 co-IP and FLC H3K27me3 nucleation after cold.
