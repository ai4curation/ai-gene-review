- term:
    id: GO:0140006
    label: histone H3 reader activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT4G30200
  - PANTHER:PTN008198652
  review:
    summary: IBA histone H3 reader activity for the VEL clade, seeded from VEL1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Structural work shows that the VEL PHD finger sits inside a tripartite PHD superdomain that lacks
      the canonical H3-binding pocket. The VIN3 superdomain bound no H3 tails by ITC/NMR. The VRN5 superdomain
      itself was not assayed, but in VRN5 this module packs against the FNIII domain and mediates binding
      to PRC2 core (VRN2), not to histones. H3-reader activity is therefore unlikely to be a VRN5 function.
    supported_by:
    - reference_id: PMID:36174674
      supporting_text: >-
        This VEL PHD superdomain neither binds to unmodified nor variously modified histone H3 tails,
        as demonstrated by isothermal calorimetry and NMR spectroscopy.
    - reference_id: PMID:40858112
      supporting_text: >-
        specifically in VRN5, there is a close packing of the central PHD superdomain and FNIII domain,
        and this mediates its interaction with a PRC2 core complex with the core subunit VRN2
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008198652
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          VEL-clade node; the H3-reader IBD rests on VEL1 pull-down data, while VEL PHD superdomains lack
          the H3-binding architecture.
