core_functions:
- description: WDR33/Pfs2p-type core subunit of the CPSF 3'-end processing complex, required for pre-mRNA
    cleavage and polyadenylation (essential function).
  in_complex:
    id: GO:0005847
    label: mRNA cleavage and polyadenylation specificity factor complex
  directly_involved_in:
  - id: GO:0031124
    label: mRNA 3'-end processing
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:19439664
    supporting_text: AtCPSF100 and AtCPSF160, but not FCA, are stably associated with FY in vivo and form
      a range of different-sized complexes.
  - reference_id: PMID:16033802
    supporting_text: Hence, FY may mediate both regulated and constitutive RNA 3'-end processing.
- description: Docking platform through which FCA (via its WW domain binding FY PPLPP motifs) and the
    FLD-complex subunit SDG26 engage CPSF, directing proximal polyadenylation of FCA pre-mRNA and COOLAIR
    and coupling it to FLC chromatin silencing, thereby promoting flowering.
  directly_involved_in:
  - id: GO:0110104
    label: mRNA alternative polyadenylation
  - id: GO:0009909
    label: regulation of flower development
  supported_by:
  - reference_id: PMID:16033802
    supporting_text: The FY C-terminal domain binds FCA and in vitro assays demonstrate a requirement
      for both C-terminal FY-PPLPP repeats during this interaction.
  - reference_id: PMID:32541063
    supporting_text: SDG26 interacts with the RNA 3' processing factor FY (WDR33), thus linking activities
      for proximal polyadenylation of the antisense transcripts to FLD/LD/SDG26-associated H3K4 demethylation.
suggested_questions:
- question: Does plant FY, like human WDR33, directly contact the poly(A) signal RNA, and does FCA binding
    to the FY C terminus alter this recognition at proximal sites?
suggested_experiments:
- description: Cryo-EM or crosslinking mass spectrometry of Arabidopsis CPSF with and without the FCA
    WW domain bound to FY PPLPP motifs, combined with in vitro cleavage/polyadenylation assays on COOLAIR
    proximal and distal poly(A) sites.
  hypothesis: FCA binding remodels FY/CPSF to favour cleavage at proximal poly(A) sites.
  experiment_type: Structural biology / in vitro 3'-processing reconstitution
