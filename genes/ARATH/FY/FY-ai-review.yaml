id: Q6NLV4
gene_symbol: FY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FY is a nuclear WD-repeat protein of the conserved WDR33/Pfs2 family and a component of the
  Arabidopsis mRNA cleavage and polyadenylation specificity factor complex. It associates stably with
  CPSF100 and CPSF160 and supports essential RNA 3-prime end formation. Its C-terminal proline-rich motifs
  engage the RNA-binding regulator FCA, linking alternative RNA processing to repression of FLC and promotion
  of flowering. FY also interacts with SDG26, connecting RNA processing with chromatin regulation. Association
  with DDB1/CUL4-containing immunocomplexes has been detected, but an FY-specific ubiquitination substrate
  remains unresolved.
