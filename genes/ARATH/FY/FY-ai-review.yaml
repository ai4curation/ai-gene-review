gene_symbol: FY
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FY is the Arabidopsis ortholog of yeast Pfs2p and human WDR33, a WD40-repeat core subunit
  of the cleavage and polyadenylation specificity factor (CPSF) complex that is required for pre-mRNA
  3'-end cleavage and polyadenylation. FY associates stably in vivo with CPSF100 and CPSF160 and carries
  a plant-specific C-terminal domain with two PPLPP motifs that bind the WW domain of the RNA-binding
  protein FCA. This transient FCA-FY interaction changes FY/CPSF complex composition and directs 3'-end
  processing to promoter-proximal poly(A) sites, both in the FCA pre-mRNA (negative autoregulation of
  FCA) and in the FLC antisense COOLAIR transcripts, leading to repression of the floral repressor FLC
  and promotion of flowering through the autonomous pathway. FY also contacts the SET-domain protein SDG26,
  physically linking proximal polyadenylation to the FLD/LD/SDG26 H3K4 demethylation module. Null fy alleles
  are embryo lethal, reflecting an essential general role in mRNA 3'-end formation, whereas hypomorphic
  alleles that lose the FCA-binding C terminus are late flowering. FY is a nuclear protein that colocalizes
  with FCA in nuclear condensates.
