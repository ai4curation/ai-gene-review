core_functions:
- description: Cell-surface LRR receptor kinase that binds the EPF2 peptide (with co-receptor TMM), recruits
    SERK co-receptor kinases and activates the YODA-MKK4/5-MPK3/6 cascade to inhibit stomatal lineage
    entry (SPEECHLESS destabilization), with its paralogs ERL1/ERL2 enforcing stomatal spacing.
  molecular_function:
    id: GO:0004675
    label: transmembrane receptor protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:2000122
    label: negative regulation of stomatal complex development
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:22241782
    supporting_text: Our results place the ERECTA family as the primary receptors for EPFs with TMM as
      a signal modulator and establish EPF2-ERECTA and EPF1-ERL1 as ligand-receptor pairs specifying two
      steps of stomatal development
  - reference_id: PMID:26320950
    supporting_text: SERK family RLKs regulate stomatal patterning downstream of EPF ligands and upstream
      of a MAP kinase cascade
- description: In stems, pedicels and lateral organs, perceives EPFL peptides and signals through the
    YODA-MKK4/5-MPK3/6 module to promote localized cell proliferation that shapes inflorescence architecture
    and organ morphology.
  molecular_function:
    id: GO:0004675
    label: transmembrane receptor protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0048281
    label: inflorescence morphogenesis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:23263767
    supporting_text: YODA (YDA), a MAPKK kinase, was shown to be upstream of MKK4/MKK5 and downstream
      of ER in regulating inflorescence architecture
  - reference_id: PMID:8624444
    supporting_text: Phenotypic characterization of the mutant alleles suggests a role for the ER gene
      in regulating the shape of organs originating from the shoot apical meristem.
suggested_questions:
- question: Which residues/phosphorylation events link EPF2-ERECTA-SERK activation to YODA, and is the
    BIN2/brassinosteroid input acting at the receptor or at YODA?
- question: How does ERECTA discriminate agonist (EPF2) from antagonist (stomagen) occupancy, given that
    both bind the same TMM-ERECTA complex but only EPF2 triggers MAPK activation?
suggested_experiments:
- description: Phosphoproteomics of ERECTA and SERK kinase domains after MEPF2 versus stomagen treatment
    in seedlings, combined with kinase-dead ERECTA complementation, to define the activation-specific
    phosphosites.
  experiment_type: phosphoproteomics / genetic complementation
