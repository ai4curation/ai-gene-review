    label: selenium compound metabolic process
  evidence_type: IMP
  original_reference_id: PMID:15941393
  qualifier: acts_upstream_of_or_within
  review:
    summary: APS1 supports selenium assimilation in transgenic plant experiments.
    action: KEEP_AS_NON_CORE
    reason: The original Astragalus paper also assays transgenic Arabidopsis; its title is not a reason
      to reject the annotation. Independent PMID:9880353 specifically expresses Arabidopsis APS1 in Indian
      mustard and observes enhanced selenate reduction. This supports a peripheral substrate capability,
      without confusing ATP-dependent activation with reductase catalysis.
    supported_by:
    - reference_id: PMID:9880353
      supporting_text: 'the Arabidopsis APS1 gene, encoding a plastidic ATP

        sulfurylase, was constitutively overexpressed in Indian mustard'
    - reference_id: PMID:9880353
      supporting_text: 'The APS plants showed increased

        selenate reduction'
