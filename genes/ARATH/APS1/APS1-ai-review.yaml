  review:
    summary: APS1 is a monofunctional ATP sulfurylase, not an APS kinase.
    action: REMOVE
    reason: The existing family review scopes kinase activity away from SF46 and flags PTN000114732 for
      pruning on plant sulfurylases. APS1 has sulfurylase/PUA architecture without the kinase domain,
      and target complementation/activity establishes sulfate adenylation. The challenge is to ancestral-node
      propagation across distinct domain architectures, not to the number or identity of donor annotations.
    supported_by:
    - *id001
    - reference_id: file:ARATH/APS1/APS1-uniprot.txt
      record_section:
      - DR:Pfam
      supporting_text: Pfam; PF01747; ATP-sulfurylase; 1.
    - reference_id: file:ARATH/APS1/APS1-uniprot.txt
      record_section:
      - DR:Pfam
      supporting_text: Pfam; PF14306; PUA_2; 1.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000114732
        source_label: APS kinase ancestral assertion
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Existing PTHR11055 family review flags this node for pruning on SF46/SF37/SF77/SF39 plant
          ATP sulfurylases; the donor enzymes have APS-kinase domains, APS1 does not.
      residue_claims_not_applicable: Whole APS-kinase domain architecture is absent, not a point-residue
        substitution; APS1 contains ATP-sulfurylase and PUA domains.
