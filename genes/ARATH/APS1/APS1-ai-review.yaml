taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: APS1 (At3g22890), also called ATPS1, is a plastid ATP sulfurylase that activates sulfate
  with ATP to form APS and pyrophosphate. Its abundance contributes to control of sulfate assimilation
  and leaf sulfate pools. APS1 also supports selenate assimilation when expressed in transgenic plants.
  It is a monofunctional sulfurylase, distinct from the plant APS kinases that phosphorylate APS to PAPS.
