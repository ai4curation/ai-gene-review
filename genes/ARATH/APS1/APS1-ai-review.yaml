  negated: true
  review:
    summary: The cytosolic proteomic assignment requires target-specific fractionation evidence.
    action: UNDECIDED
    reason: APS1 has directly demonstrated chloroplast import, but that does not exclude a cytosolic pool.
      The accessible PMID:21166475 abstract does not resolve APS1-specific peptides, fraction purity or
      dual targeting. Retain uncertainty rather than asserting contamination or rejecting a curator’s
      experiment from its title.
