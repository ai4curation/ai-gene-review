suggested_questions:
- question: Should the A1-C4-B'eta/zeta holoenzyme role in limiting BAK1 phosphorylation and pattern-triggered
    immunity (PMID:25085430) be annotated to PP2AA1 (e.g. GO:0045824 negative regulation of innate immune
    response), given that TAIR annotated only B'zeta from this paper although rcn1-1 was complemented
    and RCN1 co-immunoprecipitates BAK1?
- question: Which substrates (PIN proteins, BAK1, CTR1-pathway components, ABA-pathway kinases) are dephosphorylated
    by RCN1-containing PP2A in vivo, and which B subunit directs each?
- question: What sequence or expression features make RCN1 non-substitutable by PP2AA3 in root meristem
    organisation, given that both have similar localization?
suggested_experiments:
- description: Phosphoproteomics of rcn1 versus complemented roots, combined with B-subunit-specific co-immunoprecipitation,
    to identify the direct substrates of RCN1-containing PP2A holoenzymes.
- description: Domain-swap chimeras between RCN1 and PP2AA3 (coding sequence only, under the RCN1 promoter)
    to map the HEAT repeats that confer RCN1-specific root meristem function and B-subunit preference.
