id: Q38845
gene_symbol: PP2AA1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'PP2AA1 (also known as RCN1, ROOTS CURL IN NAPHTHYLPHTHALAMIC ACID1, and EER1) encodes one
  of the three 65 kDa A (scaffolding) subunits of serine/threonine protein phosphatase 2A in Arabidopsis
  thaliana. The protein is a solenoid of 12 HEAT repeats with no catalytic activity of its own; it binds
  a PP2A catalytic C subunit and one of several B-type regulatory subunits (B55, B'', B'''' including
  TONNEAU2) to build heterotrimeric holoenzymes. RCN1 is the dominant A subunit in seedlings: rcn1 null
  mutants have reduced PP2A activity without loss of catalytic subunit, and RCN1 complements a yeast A-subunit
  mutant. The paralogs PP2AA2 and PP2AA3 are largely redundant with RCN1, but RCN1-containing PP2A has
  functions in root meristem organisation that PP2AA3 cannot replace. RCN1 is found in the cytosol and
  nucleus and associates with membranes. Genetic studies of rcn1 show that RCN1-containing PP2A modulates
  polar auxin transport and PIN auxin-efflux carrier trafficking, root gravitropism and lateral root growth;
  acts as a positive regulator of early abscisic acid signalling in guard cells and seeds; dampens ethylene
  responses; and, as part of an A1-C4-B''eta/zeta holoenzyme bound to the co-receptor BAK1, negatively
  regulates pattern-triggered immunity by limiting basal BAK1 phosphorylation. PP2AA1 is in PANTHER subfamily
  PTHR10648:SF29 and descends from the eukaryotic PP2A A-subunit PAINT nodes PTN000068663 and PTN000068596.'
