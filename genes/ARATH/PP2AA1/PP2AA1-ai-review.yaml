    label: protein phosphatase regulator activity
  description: Positive regulator of PP2A holoenzyme activity in vivo. Through RCN1-containing PP2A it
    modulates polar auxin transport and PIN trafficking, early ABA signalling in guard cells, and ethylene
    responsiveness. These process roles are established genetically in Arabidopsis; the dephosphorylated
    substrates are largely unidentified.
