suggested_questions:
- question: >-
    Which NF-YB/NF-YC partners does NF-YA2 assemble with in planta under each condition, and
    does trimer composition explain the opposite flowering-time (early vs late) and
    heat-tolerance outcomes reported for NF-YA2 overexpression?
- question: >-
    Does NF-YA2 bind the non-CCAAT NFYBE element in the SOC1 promoter directly, and how does
    this sequence specificity differ from canonical CCAAT recognition?
suggested_experiments:
- description: >-
    In planta ChIP-seq of tagged, miR169-resistant NF-YA2 expressed from its native promoter
    under control, heat and low-phosphate conditions, combined with co-IP/mass spectrometry
    of associated NF-YB/NF-YC subunits, to map condition-specific targets and trimer partners.
- description: >-
    Characterize the reproductive defect of nf-ya2 null alleles (reciprocal crosses,
    embryo-sac and seed development phenotyping) to determine whether NF-YA2 acts in the
    female gametophyte or maternally after fertilization.
