taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  NFYA2 (NF-YA2, AtHAP2b, At3g05690) is one of ten Arabidopsis NF-YA subunits of the
  heterotrimeric NUCLEAR FACTOR Y (NF-Y/HAP) CCAAT-box binding transcription factor. The
  295-aa protein carries a conserved C-terminal NF-YA/HAP2 core consisting of a subunit
  association domain that docks onto an NF-YB/NF-YC histone-fold dimer and a DNA-binding
  segment that confers CCAAT sequence specificity on the trimer; the isolated subunit does
  not bind CCAAT by itself. It functionally replaces yeast HAP2. NF-YA2 is nuclear, broadly
  expressed (strongest in vasculature, shoot apex and young leaves) and strongly controlled
  post-transcriptionally by miR169. Within different NF-Y trimers it regulates
  transcription of developmental and stress-responsive genes, both positively and
  negatively: with NF-YB3 and DPB3-1/NF-YC10 it co-activates DREB2A-dependent
  heat-inducible genes (e.g. HsfA3); with NF-YB2/NF-YC3 or NF-YC9 it binds the FT and SOC1
  promoters and modulates flowering time; and it represses YUC2 and ARGOS, limiting auxin
  synthesis, leaf and organ growth. It also contributes to root architecture, nutrient and
  temperature responses, and its loss impairs reproduction.
