    label: regulation of timing of transition from vegetative to reproductive phase
  evidence_type: IMP
  original_reference_id: PMID:27977687
  qualifier: involved_in
  review:
    summary: >-
      NF-YA2 directly controls flowering time: in complex with NF-YB2/NF-YC3 it binds the
      CCAAT element of the FT promoter, NF-YA2 overexpression upregulates FT and accelerates
      flowering, and an NF-YA2-EDLL activator fusion causes FT-dependent early flowering.
      Hou et al. 2014 independently show NF-YA2-containing NF-Y regulates SOC1.
    action: NEW
    reason: >-
      NF-YA2 itself performs the regulatory step (sequence-specific promoter binding of FT
      and SOC1 as part of NF-Y), with genetic support from three independent groups, so this
      is participation rather than necessity. A direction-neutral term is chosen because
      Xu et al. 2014 report late flowering upon overexpression of miR169-resistant NF-YA2.
    additional_reference_ids:
    - PMID:25105952
    - PMID:24336445
    supported_by:
    - reference_id: PMID:27977687
      supporting_text: We provide a compelling body of evidence that NF-YA2 and NF-YA6, and perhaps other NF-YAs, can activate FT expression, and are FT-dependent, positive regulators of flowering.
    - reference_id: PMID:24336445
      supporting_text: overexpression of the miR169d target gene, AtNF-YA2, especially a
        miR169d-resistant version of AtNF-YA2, results in late flowering
