- description: >-
    CCAAT-box sequence-specific DNA-binding subunit of NF-Y heterotrimers; together with an
    NF-YB/NF-YC histone-fold dimer it binds CCAAT elements in promoters of Pol II target genes
    and activates (FT, HsfA3) or represses (YUC2, ARGOS) their transcription.
