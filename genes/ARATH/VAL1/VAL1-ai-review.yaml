core_functions:
- description: Sequence-specific Sph/RY (CATGCA) DNA binding by the B3 domain, targeting VAL1 to the FLC
    nucleation region (cold memory element) and to seed-maturation gene loci, where it recruits Polycomb
    silencing machinery for vernalization-induced FLC silencing.
