gene_symbol: VAL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: VAL1 (VIVIPAROUS1/ABI3-LIKE 1; also HSI2) is a nuclear B3-domain transcriptional repressor.
  It combines a B3 DNA-binding domain that recognizes the Sph/RY element (CATGCA), a PHD-like domain implicated
  in reading H3K27 methylation, a CW-type zinc finger and a C-terminal EAR repression motif. VAL1 binds
  RY elements in target loci and recruits repressive chromatin machinery, including the Polycomb proteins
  LHP1/PRC1 and the PRC2 methyltransferases CLF and SWN, as well as the ASAP complex and histone deacetylase
  activity. Redundantly with VAL2, it represses the seed-maturation program (LEC1, ABI3, FUS3, DOG1) after
  germination, and during vernalization it binds two RY elements in the FLC intragenic nucleation region
  to trigger Polycomb (PHD-PRC2) nucleation and epigenetic silencing of FLC.
