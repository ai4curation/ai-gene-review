suggested_questions:
- question: Does the VAL1 PHD-like domain directly read H3K27me3 in vivo at FLC, and is this reading required
    for maintenance or only nucleation of silencing?
suggested_experiments:
- description: Complement val1 with B3 DNA-binding-dead (structure-guided), PHD-L and EAR-motif mutants
    and measure FLC nucleation-region H3K27me3 and H2Aub during and after cold, separating DNA targeting
    from co-repressor recruitment.
