id: O81852
gene_symbol: AKHSDH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: AKHSDH2 is a plastid bifunctional aspartate kinase/homoserine dehydrogenase. Its kinase domain
  supplies aspartyl phosphate to the shared aspartate-family amino-acid pathway, and its dehydrogenase
  domain reduces aspartate semialdehyde to homoserine for threonine and methionine synthesis. Threonine
  and several other amino acids regulate the enzyme. Compared with AKHSDH1, its homoserine dehydrogenase
  activity is much less inhibited by threonine at concentrations measured in leaf chloroplasts.
