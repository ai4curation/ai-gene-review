  review:
    action: ACCEPT
    summary: The enzyme executes the shared aspartate-derived biosynthetic route.
    reason: Its kinase consumes aspartate upstream of the lysine versus homoserine branch, whereas its
      HSDH domain forms homoserine for threonine and methionine. These are actual catalytic steps in the
      annotated processes; the lysine assignment concerns kinase activity, not a claim that homoserine
      is a lysine intermediate. Isoform-specific evidence comes from PMID:16216875 and PMID:12602885.
