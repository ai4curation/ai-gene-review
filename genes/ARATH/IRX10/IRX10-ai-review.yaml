description: 'IRX10 (IRREGULAR XYLEM 10, At1g27440; also called GUT2) is a glycosyltransferase
  family 47 (GT47) enzyme that elongates the beta-1,4-linked xylose backbone of xylan. It
  transfers D-xylose from UDP-xylose onto the non-reducing end of the growing xylan chain,
  and recombinant IRX10 shows this beta-1,4-xylosyltransferase activity in vitro. The protein
  has an N-terminal hydrophobic signal/signal-anchor segment followed by a lumenal GT-B-type
  catalytic domain. It acts in the Golgi apparatus with the GT43 proteins IRX9 and IRX14,
  which anchor it in a xylan synthase complex. IRX10 is expressed in cells forming secondary
  walls, mainly xylem vessels and fibres, and it is the main secondary-wall member of the
  IRX10/IRX10L pair. It is redundant with IRX10L: irx10 single mutants have a mild irregular-xylem
  phenotype with less, shorter-chain glucuronoxylan, and irx10 irx10l double mutants nearly
  lack secondary-wall xylan, with collapsed xylem, dwarfing and sterility. IRX10 is not needed
  for the GUX3-decorated xylan of primary walls, which depends on IRX10L, although IRX10 can
  substitute for IRX10L when expressed in the same cells.'
