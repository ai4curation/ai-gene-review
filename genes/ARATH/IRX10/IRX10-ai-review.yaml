suggested_questions:
- question: Is IRX10 tethered to the Golgi membrane by its own N-terminal hydrophobic segment
    (type II signal anchor) or only through IRX9/IRX14, and is any IRX10 secreted when IRX9/IRX14
    are absent?
- question: 'Why is Arabidopsis IRX10 much less active than the moss and psyllium orthologs
    in heterologous assays: missing partners (IRX9/IRX14), folding, or a lower intrinsic rate?'
suggested_experiments:
- description: Purify Arabidopsis IRX10 alone and co-expressed with IRX9 and IRX14, and compare
    kinetics on xylohexaose with UDP-Xyl.
  hypothesis: IRX10 is intrinsically a xylan synthase like IRX10L, and its low activity in
    isolation reflects missing complex partners.
  experiment_type: in vitro enzyme assay
