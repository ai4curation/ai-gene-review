gene_symbol: SERK2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'SERK2 (SOMATIC EMBRYOGENESIS RECEPTOR KINASE 2, At1g34210) is a leucine-rich repeat receptor-like
  kinase of the five-member SERK family, closely related (90% identity) to SERK1. It is a single-pass type I plasma
  membrane protein with a short LRR ectodomain and an active cytoplasmic Ser/Thr kinase domain. Like other SERKs
  it acts as a ligand-recruited co-receptor: peptide ligands bound by LRR receptor kinases create a docking surface
  for the SERK2 ectodomain, and the two kinase domains then transphosphorylate. SERK2 is a co-receptor of EMS1 in
  the TPD1-EMS1 pathway that specifies the anther tapetum, acting redundantly with SERK1, so serk1 serk2 double
  mutants are male sterile. With BAK1 it is a major SERK in ERECTA-family signalling for stomatal patterning, and
  it also associates with the phytosulfokine receptor PSKR1, RGF receptors and the TDIF receptor PXY. SERK2 can
  support brassinosteroid signalling when overexpressed, but associates only weakly with BRI1 and contributes little
  to BR responses in vivo.'
