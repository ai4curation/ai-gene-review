  review:
    summary: Inter-ontology IEA from GO:0004675.
    action: ACCEPT
    reason: 'SERK2 acts as a kinase-active co-receptor in several cell-surface LRR receptor kinase pathways initiated
      by extracellular peptide ligands: TPD1-EMS1, EPF-ERECTA family, PSK-PSKR1, RGF-RGFR and TDIF-PXY. GO:0007178
      is the appropriate umbrella process for this co-receptor role.'
    supported_by:
    - &id008
      reference_id: PMID:27920157
      supporting_text: Our results suggest that SERK1 and SERK2 may function redundantly as coreceptors of EMS1
        during anther development in Arabidopsis.
    - &id011
      reference_id: PMID:26320950
      supporting_text: Importantly, EPF2 induced the association of ER with SERK1, SERK2, BAK1 and SERK4 (Figure
        5B), and EPF1 induced the association of ERL1 with different SERKs (Figure 5C).
    - &id013
      reference_id: PMID:26308901
      supporting_text: PSK binding enhances PSKR heterodimerization with the somatic embryogenesis receptor-like
        kinases (SERKs).
    - reference_id: PMID:27229311
      supporting_text: We also offer evidence showing that SERKs function as co-receptors for RGFs.
    - &id014
      reference_id: PMID:27449136
      supporting_text: Crystal structure of the PXY-TDIF-SERK2 complex reveals that the last amino acid of TDIF
        conserved among CLEs and other evolutionary-related peptides is important for the interaction between SERK2
        and PXY.
