suggested_questions:
- question: Should the stomatal patterning role of SERK2 (higher-order serk mutants with bak1-5 cluster stomata;
    EPF-induced association with ERECTA/ERL1) be captured with a process term such as stomatal complex patterning,
    given that SERK2 acts as a kinase-active co-receptor in that pathway rather than only being required for it?
- question: What distinguishes SERK2 from SERK1 and BAK1 in its weak association with BRI1 while it binds EMS1,
    ERECTA and PXY efficiently? Is it ectodomain sequence or kinase-domain properties?
- question: Does the nuclear HDA row from membrane protein correlation profiling (PMID:28887381) reflect a real
    nuclear pool of SERK2 or a fractionation or classification artefact?
suggested_experiments:
- description: Domain-swap SERK2 and BAK1 ectodomains and kinase domains and test complementation of BR signalling
    in serk1 bak1 bkk1 and of fertility in serk1 serk2, to define which domain sets pathway specificity.
- description: Phosphoproteomics of EMS1 and SERK2 in anthers of wild type and serk1 serk2 to identify the in vivo
    transphosphorylation sites required for tapetum specification.
