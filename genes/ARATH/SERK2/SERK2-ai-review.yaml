core_functions:
- description: Kinase-active plasma-membrane co-receptor recruited by ligand-bound LRR receptor kinases (EMS1, ERECTA/ERL1,
    PSKR1, RGF receptors, PXY); forms heteromers with them and transphosphorylates their kinase domains to initiate
    peptide-hormone signalling.
  molecular_function: *id001
  directly_involved_in:
