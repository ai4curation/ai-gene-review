    label: defense response to insect
  evidence_type: IMP
  original_reference_id: PMID:16640593
  qualifier: involved_in
  review:
    summary: tgg1 tgg2 double mutants lacking myrosinase activity supported increased weight
      gain of the generalist Trichoplusia ni and of Manduca sexta.
    action: ACCEPT
    reason: Myrosinase-dependent hydrolysis of glucosinolates releases isothiocyanates and other
      toxic products; this is the defining biological role of the glucosinolate-myrosinase ("mustard
      oil bomb") system. TGG1 acts redundantly with TGG2, so the phenotype is seen in the double
      mutant. TGG1 does the enzymatic work that generates the defensive products, satisfying
      participation.
