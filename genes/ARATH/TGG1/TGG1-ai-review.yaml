  review:
    summary: TGG1 (At5g26000) was identified in the proteome of purified vegetative vacuoles
      from rosette-leaf protoplasts.
    action: ACCEPT
    reason: Consistent with the known storage of myrosinase in vacuole-derived myrosin grains
      of myrosin cells and with the signal-peptide-directed, N-glycosylated secretory-pathway
      biogenesis of the enzyme; UniProt also annotates a vacuolar location. The vacuolar proteome
      authors explicitly list the myrosinase gene products. This is the physiologically relevant
      storage compartment that keeps the enzyme separated from its glucosinolate substrates
      until tissue damage.
    supported_by:
    - reference_id: PMID:15539469
      supporting_text: we also identified five additional MAP gene products (At1g54000, At1g54010,
        At1g54020, At1g54030, and At1g14220) and the corresponding myrosinase gene products
        (At5g25980 and At5g2600)
    - reference_id: PMID:11950967
      supporting_text: Our results suggest a cellular separation of myrosinase enzyme and glucosinolate
        substrate, and that myrosinase is contained in distinct cells.
- term:
