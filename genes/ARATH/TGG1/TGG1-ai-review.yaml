gene_symbol: TGG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'TGG1 (THIOGLUCOSIDE GLUCOHYDROLASE 1, BGLU38; At5g26000) is one of the two classical
  myrosinases of Arabidopsis shoots, a glycoside hydrolase family 1 beta-thioglucosidase (EC
  3.2.1.147) that hydrolyzes the thioglucosidic bond of glucosinolates, releasing glucose and
  an unstable aglucone that rearranges to isothiocyanates or, with specifier proteins, to nitriles,
  epithionitriles or thiocyanates. Like other myrosinases it lacks the catalytic acid/base glutamate
  of O-glucosidases, and it retains only weak O-beta-glucosidase activity. It is a signal-peptide-bearing
  glycoprotein stored in vacuole-derived compartments of phloem-associated myrosin idioblasts
  and in guard cells, spatially separated from its glucosinolate substrates, so that hydrolysis
  occurs on tissue damage (the "mustard oil bomb"). TGG1 acts redundantly with TGG2: the double
  mutant lacks detectable leaf myrosinase activity and damage-induced breakdown of aliphatic
  glucosinolates, and is more susceptible to generalist lepidopteran herbivores. TGG1 is also
  one of the most abundant proteins of guard cells, where TGG1 and TGG2 are required, by an
  as yet undefined mechanism, for ABA-, methyl jasmonate- and isothiocyanate-induced stomatal
  closure.'
