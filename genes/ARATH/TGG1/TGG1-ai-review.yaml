suggested_questions:
- question: Does the guard-cell role of TGG1 in ABA/MeJA/isothiocyanate-induced stomatal closure
    require its thioglucosidase activity, and if so which glucosinolate pool is hydrolyzed in
    intact guard cells, or does TGG1 act non-catalytically?
- question: How is TGG1 retained in vacuole-derived myrosin grains, and what triggers its release
    upon tissue damage versus in guard-cell signaling?
- question: Do the proteomics-derived plastid, thylakoid, ribosome and peroxisome localizations
    of TGG1 reflect genuine minor pools or contamination by an extremely abundant protein?
suggested_experiments:
- description: Complement tgg1 tgg2 double mutants with catalytically inactive TGG1 (nucleophile
    Glu mutant) versus wild-type TGG1 under the guard-cell TGG1 promoter and test ABA-, MeJA-
    and AITC-induced stomatal closure.
- description: Use native-promoter TGG1-fluorescent protein fusions with organelle markers and
    immunogold EM to test the peroxisomal and apoplastic pools reported by proteomics.
- description: Profile glucosinolate hydrolysis products in isolated guard cells of wild type
    and tgg mutants after ABA treatment to test whether stomatal signaling involves in situ
    glucosinolate hydrolysis.
