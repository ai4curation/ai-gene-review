id: Q6S591
gene_symbol: JAG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: JAGGED (JAG, At1g68480) is a nuclear transcriptional repressor of the plant-specific SUPERMAN-like (C1-1i)
  family, with a single C2H2 zinc finger, a proline-rich region and a short EAR-type leucine-rich repressor motif. It is
  expressed in the growing regions of lateral organ primordia (leaves, sepals, petals, stamens, carpels) but not in the
  shoot apical meristem. JAG binds the upstream regions of target genes in vivo and directly represses meristem and
  boundary regulators (BREVIPEDICELLUS, BELL1, CLAVATA1, HANABA TARANU, PETAL LOSS, BLADE-ON-PETIOLE2) and the cell cycle
  inhibitors KRP2 and KRP4, thereby promoting the transition from meristem to primordium identity, S-phase entry, anisotropic
  and distal growth of organs. Loss of JAG gives serrated leaves and narrow, jagged floral organs; misexpression drives
  ectopic leaf-like outgrowths and bract formation. JAG acts redundantly with its paralog NUBBIN in stamens and carpels,
  with AS1/AS2 to repress boundary genes in sepals and petals, and with FIL/YAB3 as a lateral factor that patterns the
  fruit valve and valve margin and restricts BP to the replum. JAG interacts with the GATA factor HANABA TARANU, which
  also promotes its expression.
