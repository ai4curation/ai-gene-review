suggested_questions:
- question: Does JAG bind DNA directly through its single SUPERMAN-type C2H2 zinc finger, and what is its preferred binding
    motif? Current evidence is ChIP, which cannot exclude recruitment by a DNA-binding partner.
- question: Is JAG repression mediated by its EAR-type motif recruiting TOPLESS/TPR co-repressors?
- question: Does the HAN-JAG interaction modulate JAG target selection or repressor activity, given that JAG also directly
    represses HAN?
- question: Is the TAIR IMP annotation to abaxial cell fate specification (PMID:16192305) supported by data in the full
    text, given that JAG and NUB promote adaxial cell types in carpel walls?
suggested_experiments:
- experiment_type: EMSA / DAP-seq
  hypothesis: The JAG zinc finger binds a specific DNA motif present in the ChIP-seq peaks at KRP4, BP and BEL1.
  description: Test recombinant JAG and zinc-finger point mutants for in vitro binding to ChIP-seq peak fragments, and
    derive a binding motif by DAP-seq.
