taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  At3g08840 (At-DDL) encodes a 949-residue chloroplast stromal protein of the
  D-alanine--D-alanine ligase (Ddl) family, made of two tandem Ddl modules, each with a
  Ddl N-terminal region and an ATP-grasp domain. The same fused two-module architecture
  occurs in the moss Physcomitrium patens DDL, which acts as a D-Ala:D-Ala ligase in
  plastid peptidoglycan synthesis needed for chloroplast division. The Arabidopsis protein
  keeps the D-Ala-D-Ala ligase signature motifs, the active-site glutamate and the Mg2+
  ligands in its C-terminal module, so it is predicted to be an ATP-dependent
  D-Ala:D-Ala ligase. Its activity has never been tested. Arabidopsis has lost most of the
  plastid peptidoglycan pathway, including the penicillin-binding protein, and At-DDL
  T-DNA mutants have normal chloroplasts. The physiological role of the protein in
  angiosperms is unknown; a role in D-amino acid metabolism has been suggested.
