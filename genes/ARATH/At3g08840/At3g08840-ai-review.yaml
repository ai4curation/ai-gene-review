core_functions:
- description: >-
    Predicted ATP-dependent D-alanine:D-alanine ligase in the chloroplast stroma, formed
    by two fused Ddl modules; the C-terminal module keeps the canonical catalytic and
    Mg2+-binding residues. Inherited from the plastid peptidoglycan pathway, which in
    moss is required for chloroplast division. In Arabidopsis the downstream pathway is
    incomplete and the mutant has no plastid-division phenotype, so the product and its
    physiological use are unknown (possibly D-amino acid metabolism). The activity has not
    been assayed biochemically.
