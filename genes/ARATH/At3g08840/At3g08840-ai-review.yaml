suggested_questions:
- question: >-
    Does recombinant At3g08840 (full-length or the C-terminal module) catalyse ATP-dependent
    D-Ala-D-Ala formation? Is the diverged N-terminal module catalytic, or does it act as
    a structural pseudo-dimer partner?
- question: >-
    In angiosperms, what does At-DDL do in the plastid without the PBP-dependent wall
    steps? Possibilities include D-Ala detoxification or D-amino acid dipeptide
    metabolism, or a moonlighting role analogous to that of AtMurE.
- question: >-
    Should PAINT/GO restrict the peptidoglycan biosynthetic process IBA within the plant
    DDL clade, for example with an IRD at the angiosperm node, while keeping the MF IBA?
    The MF is well supported by the moss member, whereas the BP holds only for lineages
    that retain the full Mur set (bryophytes, lycophytes, gymnosperms).
suggested_experiments:
- hypothesis: At3g08840 retains D-Ala:D-Ala ligase activity.
  description: >-
    Express the mature protein (without its transit peptide) and each module separately
    in E. coli, then assay D-Ala-D-Ala formation (ADP/Pi release coupled assay or LC-MS)
    with D-Ala and ATP/Mg2+. Include Glu/Asn-to-Ala mutants of the module-2 Mg2+ ligands as
    negative controls. In parallel, test whether At3g08840 complements an E. coli ddlA
    ddlB double mutant, or the moss delta-Pp-ddl macrochloroplast phenotype.
  experiment_type: biochemical assay / heterologous complementation
- hypothesis: At-DDL contributes to D-alanine metabolism or tolerance in Arabidopsis.
  description: >-
    Measure free D-Ala and D-Ala-D-Ala in wild type and in the at-ddl-1/at-ddl-2 T-DNA
    lines (SALK_092419, SAIL_906_E06), and compare their growth on D-Ala, which is known
    to be toxic to seed plants.
  experiment_type: metabolomics / mutant phenotyping
