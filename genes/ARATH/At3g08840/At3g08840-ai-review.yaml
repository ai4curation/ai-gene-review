- term:
    id: GO:0008716
    label: D-alanine-D-alanine ligase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000566166
  - UniProtKB:P07862
  - UniProtKB:P0A6J8
  - UniProtKB:P9WP31
  review:
    summary: >-
      PAINT IBA from node PTN000566166, seeded by the experimentally characterized E. coli
      DdlB and DdlA and M. tuberculosis Ddl. The Arabidopsis protein sits inside the plant
      fused-DDL clade. Its moss member (Pp-DDL) is supported genetically as a D-Ala:D-Ala
      ligase: the knockout accumulates D-Ala, and D-Ala-D-Ala dipeptide, but not the other
      dipeptides tested, rescues it. Wei et al. 2020 flagged the companion peptidoglycan
      biosynthesis IBA on this protein, but not this MF row. Our residue check finds no
      Arabidopsis-specific loss of catalytic residues. The C-terminal module carries both
      PROSITE Ddl signatures, the active-site Glu and all three Mg2+ ligands. The
      N-terminal module has a diverged Mg2+ loop, but moss Pp-DDL shares the same pattern.
      The activity has not been assayed for the Arabidopsis protein.
    action: ACCEPT
    reason: >-
      To challenge an IBA, one has to show that the target lies outside the clade that
      inherited the function, or that the target has lost or changed it. Neither applies
      to the molecular function. At3g08840 groups with the plant fused DDLs, including the
      moss enzyme, whose ligase function is genetically supported. Its active-site and
      Mg2+-binding residues are conserved to the same extent as in the moss enzyme. The
      evidence for divergence in Arabidopsis comes from the process level: there is no
      PBP, the Mur pathway is incomplete, and ddl mutants have no plastid phenotype. That
      argues against a peptidoglycan biosynthesis role, which is why the BP IBA has rightly
      gone, but it does not argue against the enzyme activity. The AtMurE precedent shows
      that an enzymatically competent gymnosperm MurE can fulfil the repurposed Arabidopsis
      role, so losing the pathway does not imply losing catalysis. ACCEPT, noting that the
      activity has not been tested biochemically (Hirano et al. 2016).
    additional_reference_ids:
    - PMID:32470107
    - PMID:16618924
    supported_by:
    - reference_id: PMID:27325639
      supporting_text: "These results confirm that Pp-DDL functions as a d -Ala: d -Ala ligase."
    - reference_id: PMID:27325639
      supporting_text: DDL genes with two Ddl regions each encoding the Ddl_N and ATP-grasp_4
        domains are also found in the genomes of many sequenced plants, including the
        spikemoss S . moellendorffii ( XP_002983726 ) ( Banks et al., 2011 ) and Arabidopsis
        (At3g08840)
    - reference_id: PMID:27325639
      supporting_text: "The d -Ala: d -Ala ligase activity of At-DDL also remains unconfirmed."
    - reference_id: file:ARATH/At3g08840/At3g08840-bioinformatics/RESULTS.md
      supporting_text: The Arabidopsis protein shows no lineage-specific loss of catalytic or
        Mg2+-binding residues relative to the moss DDL
    - reference_id: PMID:41351887
      supporting_text: Enzymatic assay of recombinant PaMurE proteins revealed they catalyze
        the same reaction performed by their bacterial MurE homologs.
