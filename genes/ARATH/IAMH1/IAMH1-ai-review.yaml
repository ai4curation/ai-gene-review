gene_symbol: IAMH1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: IAMH1 (INDOLE-3-ACETAMIDE HYDROLASE 1, AT4G37550) is a soluble amidohydrolase of the
  acetamidase/formamidase (FmdA_AmdA) family, encoded in tandem with its 90%-identical paralog IAMH2
  (AT4G37560) on chromosome 4. IAMH1-like genes are present across the green lineage, from Chlamydomonas
  and Physcomitrella to flowering plants. IAMH1 was identified in a forward-genetic screen for mutants
  insensitive to indole-3-acetamide (IAM) but with normal auxin responses. Loss-of-function alleles resist
  exogenous IAM, and complementation, including with a functional IAMH1-GFP fusion, restores IAM sensitivity.
  Together with IAMH2, IAMH1 is required to convert exogenous or bacterial iaaM-derived IAM into the auxin
  indole-3-acetic acid (IAA), and iamh1 iamh2 double mutants suppress iaaM-driven auxin overproduction.
  The double mutants develop normally and keep wild-type IAA levels, so the IAM route seems to contribute
  little to bulk auxin under standard conditions. IAMH1 is broadly expressed in seedlings and flowers.
  An IAMH1-GFP fusion is excluded from the nucleus, and proteomic studies place the protein in the cytosol.
