- id: PMID:32327358
  title: Two homologous INDOLE-3-ACETAMIDE (IAM) HYDROLASE genes are required for the auxin effects of
    IAM in Arabidopsis.
  findings:
  - statement: IAMH1 (At4g37550) was isolated as an IAM-insensitive mutant and confirmed by a T-DNA allele
      and complementation.
    supporting_text: We renamed #483 mutant iamh1–1 (IAM hydrolase 1) and At4g37550 gene IAMH1.
  - statement: IAMH1 is broadly expressed and the IAMH1-GFP fusion is excluded from the nucleus.
    supporting_text: At seedling stage, the GUS expression was broadly distributed in cotyledons, true
      leaves, and root tips
  - statement: The iamh1 iamh2 double mutants suppress iaaM-induced auxin overproduction but show no developmental
      defects under normal conditions.
    supporting_text: The iamh1 iamh2 double mutants did not display obvious developmental defects under
      our normal growth conditions, suggesting that auxin synthesized from the IAM pathway may not play
      critical roles in Arabidopsis development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text (PMC7231657) read. Founding functional paper. The enzymatic activity is inferred
      from genetics and auxin metabolite profiling; I found no in vitro assay of purified protein.
- id: PMID:42844995
  title: Structural variation in the IAMH2 3' UTR underlies hypocotyl elongation during light adaptation
    in Arabidopsis thaliana.
  findings:
  - statement: Describes IAMH1 and IAMH2 as tandem IAM hydrolases catalysing the terminal IAM-to-IAA step;
      its experiments address IAMH2 only.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read; relevant to IAMH1 only as background.
suggested_questions:
- question: Does purified IAMH1 hydrolyse IAM in vitro, with what kinetics, and does it retain the formamidase
    or acetamidase activity of its bacterial and fungal family members?
- question: The iamh1 single mutant was isolated as IAM-insensitive even though IAMH2 is 90% identical,
    so what determines the non-redundant contribution of IAMH1 (expression level, tissue pattern or catalytic
    efficiency)?
- question: Does the residual IAM-to-IAA conversion in iamh1 iamh2 double mutants depend on AMI1 or other
    amidase-signature enzymes?
suggested_experiments:
- description: Purify recombinant IAMH1 and IAMH2 and compare kinetic parameters with IAM, formamide,
    acetamide and phenylacetamide.
- description: Generate iamh1 iamh2 ami1 triple mutants and test residual IAM sensitivity and IAM-derived
    IAA formation.
- description: Determine the subcellular localization of IAMH1-GFP at higher resolution, with organelle
    markers, to test the chloroplast prediction and the vacuolar and membrane proteomic detections.
