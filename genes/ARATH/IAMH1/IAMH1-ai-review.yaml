- term:
    id: GO:0009684
    label: indoleacetic acid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:32327358
  review:
    summary: IAMH1, redundantly with IAMH2, is required to convert IAM into IAA in planta. Disrupting both
      genes abolishes iaaM-driven auxin overproduction and most of the IAM-induced rise in IAA and IAA
      conjugates.
    action: NEW
    reason: |-
      IAMH1 is proposed to catalyse the hydrolytic step of the IAM branch of IAA biosynthesis (IAM to IAA), so it performs a step of the process.
      The IMP code rests on the iamh1 single mutants: both iamh1-1 and the T-DNA allele iamh1-2 are IAM-resistant, and the IAMH1 genomic fragment restores IAM sensitivity. The iamh1 iamh2 double-mutant data (suppression of iaaM-driven auxin overproduction and of the IAM-induced rise in IAA conjugates) would be IGI with IAMH2.
      Comparator check (QuickGO, taxon 3702): AMI1, which catalyses the same IAM to IAA step, carries GO:0009684 by IDA.
      Caveats: the in vivo evidence concerns IAM supplied exogenously or made by the bacterial iaaM transgene. Steady-state IAA and development are normal in the double mutant, so this route contributes little to endogenous auxin under standard conditions. Moya-Cuevas et al. (PMID:41362017) further propose that IAM acts as a signalling molecule in its own right, inducing ABA biosynthesis, and describe the IAM pathway as contributing to IAA only under specific conditions; X. Gao et al. (PMID:42844995) cite that work as questioning whether the pathway contributes to auxin biosynthesis under standard conditions. Neither paper disputes that IAMH1 converts IAM to IAA, so the annotation is kept, but its physiological weight is limited.
    additional_reference_ids:
    - PMID:41362017
    - PMID:42844995
    supported_by:
    - reference_id: PMID:32327358
      supporting_text: Neither iamh1–1 nor iamh1–2 showed obvious developmental defects under normal growth
        conditions, despite that both mutant alleles were resistant to IAM.
    - reference_id: PMID:32327358
      supporting_text: the IAMH1 genomic fragment fully restored the IAM sensitivity of the iamh1–1 mutant.
    - reference_id: PMID:32327358
      supporting_text: Disruption of the IAMH genes also suppressed the developmental abnormalities caused
        by overexpression of the iaaM gene, suggesting that the IAMHs are the main enzymes in converting
        IAM into IAA in Arabidopsis.
    - reference_id: PMID:32327358
      supporting_text: In contrast, IAM treatment in iamh1 iamh2 double mutants did not induce a substantial
        increase in IAA-Asp and IAA-Glu conjugates
core_functions:
- description: Cytosolic amidohydrolase that converts indole-3-acetamide (IAM) to the auxin indole-3-acetic
    acid (IAA). It acts redundantly with its tandem paralog IAMH2 in converting exogenous or iaaM-derived
    IAM; under low light IAMH2 has a non-redundant role in hypocotyl elongation that the partial upregulation
    of IAMH1 in iamh2 mutants does not compensate.
