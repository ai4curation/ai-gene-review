- id: PMID:32327358
  title: Two homologous INDOLE-3-ACETAMIDE (IAM) HYDROLASE genes are required for the auxin effects of
    IAM in Arabidopsis.
  findings:
  - statement: IAMH1 (At4g37550) was isolated as an IAM-insensitive mutant and confirmed by a T-DNA allele
      and complementation.
    supporting_text: We renamed #483 mutant iamh1–1 (IAM hydrolase 1) and At4g37550 gene IAMH1.
  - statement: IAMH1 is broadly expressed and the IAMH1-GFP fusion is excluded from the nucleus.
    supporting_text: At seedling stage, the GUS expression was broadly distributed in cotyledons, true
      leaves, and root tips
  - statement: The iamh1 iamh2 double mutants suppress iaaM-induced auxin overproduction but show no developmental
      defects under normal conditions.
    supporting_text: The iamh1 iamh2 double mutants did not display obvious developmental defects under
      our normal growth conditions, suggesting that auxin synthesized from the IAM pathway may not play
      critical roles in Arabidopsis development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text (PMC7231657) read. Founding functional paper. The enzymatic activity is inferred
      from genetics and auxin metabolite profiling; I found no in vitro assay of purified protein.
- id: PMID:42844995
  title: Structural variation in the IAMH2 3' UTR underlies hypocotyl elongation during light adaptation
    in Arabidopsis thaliana.
  findings:
  - statement: IAMH1 is upregulated in iamh2 mutants under low light (partial compensation), but only IAMH2
      is light-responsive in Col-0, and the compensation does not restore hypocotyl elongation.
    supporting_text: IAMH1 was upregulated in the iamh2 mutant under low light (Figure S8A), indicating
      partial compensation.
  - statement: The authors conclude that IAMH2 is non-redundant with IAMH1 for low-light hypocotyl elongation.
    supporting_text: However, only IAMH2 was light‐responsive in Col‐0 (Figure S8B), and this compensation
      did not restore hypocotyl elongation, suggesting that IAMH2 plays a non‐redundant role in this context.
  - statement: The paper cites work questioning whether the IAM pathway contributes to auxin biosynthesis
      under standard conditions.
    supporting_text: recent studies have questioned whether this pathway contributes to auxin biosynthesis
      under standard conditions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Mainly about IAMH2, but includes IAMH1-specific data (Figure S8, expression
      analysis of IAMH1; Figure S3A, At4g37550 allelic variation between the Sichuan and Tibet ecotypes).
      It does not establish IAMH1 function.
- id: PMID:41362017
  title: Identification of a novel link connecting indole-3-acetamide with abscisic acid biosynthesis and
    signaling.
  findings:
  - statement: IAM-triggered root growth inhibition depends on ABA biosynthesis (ABA3) and signalling, so
      IAM may act as a signalling molecule beyond its role as an auxin precursor.
    supporting_text: These results imply that IAM may have a function beyond its role as an intermediate
      in a secondary pathway of auxin biosynthesis, potentially acting as an independent signaling molecule
  - statement: Describes the IAM pathway as contributing to IAA biosynthesis only under specific conditions.
    supporting_text: the indole‐3‐acetamide (IAM) pathway, are also considered to contribute to IAA biosynthesis
      under specific conditions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Resolved via PubMed from the Moya-Cuevas et al. 2026 citation in PMID:42844995 (New Phytol
      249:2452-2466; PubMed lists the online date as 2025-12-08). Full text read. Does not mention IAMH1
      or IAMH2; its experiments concern AMI1 and IAM signalling. It qualifies, but does not refute, the
      IAM-to-IAA role of the IAMHs.
suggested_questions:
- question: Does purified IAMH1 hydrolyse IAM in vitro, with what kinetics, and does it retain the formamidase
    or acetamidase activity of its bacterial and fungal family members?
- question: The iamh1 single mutant was isolated as IAM-insensitive even though IAMH2 is 90% identical,
    and conversely only IAMH2 is light-responsive and required for low-light hypocotyl elongation. What
    determines the non-redundant contribution of each paralog (expression level, tissue pattern or catalytic
    efficiency)?
- question: Does the residual IAM-to-IAA conversion in iamh1 iamh2 double mutants depend on AMI1 or other
    amidase-signature enzymes?
suggested_experiments:
- description: Purify recombinant IAMH1 and IAMH2 and compare kinetic parameters with IAM, formamide,
    acetamide and phenylacetamide.
- description: Generate iamh1 iamh2 ami1 triple mutants and test residual IAM sensitivity and IAM-derived
    IAA formation.
- description: Determine the subcellular localization of IAMH1-GFP at higher resolution, with organelle
    markers, to test the chloroplast prediction and the vacuolar and membrane proteomic detections.
