suggested_questions:
- question: >-
    How does ELF3 binding reduce LUX DNA-binding affinity while ELF4 restores it, and is this switch the
    basis of the temperature sensitivity of EC occupancy?
- question: >-
    Does the LUX paralog NOX/BOA partially substitute for LUX within the evening complex, and at which
    targets?
suggested_experiments:
- description: >-
    Genome-wide LUX ChIP-seq in elf3 and elf4 backgrounds at different temperatures, compared with in
    vitro LUX/LUX-ELF3/EC binding to the same sites.
  hypothesis: >-
    LUX occupancy in vivo depends on the ELF3-ELF4 composition of the complex in a temperature-dependent
    way.
