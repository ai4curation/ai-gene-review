id: Q9SNB4
gene_symbol: LUX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  LUX ARRHYTHMO (LUX; also PHYTOCLOCK 1, PCL1) is a nuclear GARP-family single-MYB-domain transcription
  factor and the DNA-binding subunit of the evening complex (EC) of the Arabidopsis circadian clock, made
  up of LUX, ELF3 and ELF4. LUX binds the LUX binding site (LBS; consensus GAT(A/T)CG) through its MYB
  DNA-binding domain and recruits ELF3, and through ELF3 also ELF4, to target promoters. At dusk and in
  the early night the EC represses the morning-loop gene PRR9, LUX itself (a negative autoregulatory loop),
  and growth regulators such as PIF4 and PIF5, which couples the oscillator to diurnal gating of hypocotyl
  growth. LUX expression is circadian, peaking in the evening, and is repressed in the morning by CCA1
  and LHY through evening elements in its promoter. lux loss-of-function mutants are arrhythmic in continuous
  light and darkness, have elongated hypocotyls and flower early. The EC's DNA binding is temperature-dependent,
  which contributes to thermoresponsive growth.
