- term:
    id: GO:2000028
    label: regulation of photoperiodism, flowering
  evidence_type: IMP
  original_reference_id: PMID:32392578
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: The photoperiod-specific component of the DA flowering response remains unresolved.
    action: UNDECIDED
    reason: The available PMID:32392578 abstract establishes a DA-dependent flowering response through
      FVE and FLC, but does not resolve the daylength-dependence required to adjudicate this specific
      photoperiodism assertion. Autonomous-pathway membership alone is not evidence against an overlapping
      role in photoperiod-dependent flowering.
    supported_by:
    - reference_id: PMID:14745447
      supporting_text: The vernalization and autonomous pathways converge on the negative regulation of
        FLC, a gene encoding a MADS-box protein that inhibits flowering.
    additional_reference_ids:
    - PMID:32392578
