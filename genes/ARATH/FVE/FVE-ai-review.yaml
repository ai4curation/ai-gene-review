id: O22607
gene_symbol: FVE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FVE (MSI4/ACG1) is a histone-binding MSI1-like WD40 protein that participates in nuclear
  chromatin regulatory assemblies. It associates with histone deacetylase machinery, CUL4-DDB1 and CLF/PRC2-associated
  factors, supporting repression of FLOWERING LOCUS C (FLC) and flowering-time regulation. Its molecular
  role is noncatalytic histone/complex association; the partner enzymes carry out deacetylation and methylation.
  FVE also contributes to regulation of FT, cold-responsive genes, RNA-directed DNA methylation at a subset
  of loci, UV-B damage responses and systemic acquired resistance. These functions need not all operate
  through the same assembly or through FLC.
