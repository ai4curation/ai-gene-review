core_functions:
- description: Histone-binding WD40 factor associated with CLF/PRC2-related chromatin assemblies, supporting
    repressive H3K27 methylation at FLC. The reported interactions and chromatin phenotypes support this
    context-specific complex role without establishing universal stoichiometric PRC2 membership.
  molecular_function:
    id: GO:0042393
    label: histone binding
  in_complex:
    id: GO:0035098
    label: ESC/E(Z) complex
  directly_involved_in:
  - id: GO:0045814
    label: negative regulation of gene expression, epigenetic
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:21282611
    supporting_text: Here we report that the MSI4 protein is a DDB1 and CUL4-associated factor that represses
      FLC expression through its association with a CLF-Polycomb Repressive Complex 2 (PRC2) in Arabidopsis.
  - reference_id: PMID:29314758
    supporting_text: The H3K27me3 level on FLC was decreased in the pdp mutants as well as in the fve/msi5
      double mutant.
- description: Histone-binding component of histone-deacetylase-associated assemblies that support repression
    of FLC and additional target genes. HDA5/HDA6 and FLD are reported partners; the evidence does not
    require all partners to occur in one invariant complex.
  molecular_function:
    id: GO:0042393
    label: histone binding
  in_complex:
    id: GO:0000118
    label: histone deacetylase complex
  directly_involved_in:
  - id: GO:0045814
    label: negative regulation of gene expression, epigenetic
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:14745447
    supporting_text: We conclude that FVE participates in a protein complex repressing FLC transcription
      through a histone deacetylation mechanism.
  - reference_id: PMID:25922987
    supporting_text: Bimolecular fluorescence complementation assays and co-immunoprecipitation assays
      showed that HDA5 interacts with FVE, FLD and HDA6, indicating that these proteins are present in
      a protein complex involved in the regulation of flowering time.
suggested_questions:
- question: How is FVE partitioned between its PRC2, HDAC and CUL4-DDB1 complexes, and which of these
    is limiting for FLC repression versus thermosensory flowering and cold-gene repression?
suggested_experiments:
- description: Use separation-of-function FVE variants (histone-binding pocket mutants; DDB1-binding WDxR
    mutants) in fve backgrounds and profile FLC H3K27me3, H3 acetylation and flowering time.
  hypothesis: Histone binding by FVE is required for both PRC2 and HDAC function at FLC, whereas DDB1
    binding is specific to the CUL4-dependent arm.
  experiment_type: Genetic complementation with ChIP-qPCR
