id: O22607
gene_symbol: FVE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FVE (MSI4/ACG1) is one of five Arabidopsis MSI1-like WD40-repeat proteins, a homolog of the
  mammalian retinoblastoma-associated histone-binding proteins RbAp46/RbAp48 (RBBP7/RBBP4) and Drosophila
  p55/NURF55. These seven-bladed beta-propeller proteins bind histones H3/H4 and act as shared scaffolding
  subunits that bring chromatin-modifying enzymes to their nucleosomal substrates. FVE is a nuclear protein
  that is a subunit of RPD3-type histone deacetylase complexes (with HDA6, HDA5 and the LSD1 homolog FLD)
  and of a CLF-containing Polycomb Repressive Complex 2 (PRC2), and also associates with the CUL4-DDB1
  ubiquitin ligase as a DDB1-binding WD40 protein. Through these complexes FVE promotes histone deacetylation
  and H3K27 trimethylation at the floral repressor FLOWERING LOCUS C (FLC), repressing FLC and promoting
  flowering as part of the autonomous pathway; it also mediates thermosensory (ambient temperature) regulation
  of flowering. FVE has additional roles in repressing cold-responsive (CBF/DREB) genes, in RNA-directed
  DNA methylation at a subset of loci (via SUVH9 and Pol V association), in DNA repair after UV-B, and
  in systemic acquired resistance.
