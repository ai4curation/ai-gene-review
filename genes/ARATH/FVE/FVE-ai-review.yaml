  review:
    summary: FVE co-purifies with HDA6/HDA19-containing plant histone deacetylase complexes.
    action: ACCEPT
    reason: Consistent with independent evidence that FVE forms a deacetylase complex with HDA5, HDA6
      and FLD and is required for histone deacetylation at FLC. Core complex membership.
    supported_by:
    - reference_id: PMID:34144927
      supporting_text: Here, we perform affinity purification followed by mass spectrometry and demonstrate
        that the Arabidopsis RPD3-type histone deacetylases HDA6 and HDA19 interact with several previously
        uncharacterized proteins, thereby forming three types of plant-specific histone deacetylase complexes,
        which we named SANT, ESANT, and ARID.
    - reference_id: PMID:14745447
      supporting_text: We conclude that FVE participates in a protein complex repressing FLC transcription
        through a histone deacetylation mechanism.
