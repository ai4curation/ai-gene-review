    label: nucleolus
  evidence_type: HDA
  original_reference_id: PMID:15496452
  qualifier: located_in
  review:
    summary: Detected in the nucleolar proteome.
    action: KEEP_AS_NON_CORE
    reason: High-throughput proteomic detection; the nucleolus is a nuclear sub-compartment,
      consistent with FVE's nuclear chromatin role, but no nucleolar function is known. FVE is not
      named in the cached text (identifications are in supplementary tables), so no supporting
      sentence is cited; we defer to the curator's reading of the dataset. Localization principle
      applied uniformly across this module - HDA proteome rows are curator-made experimental
      annotations and are never REMOVEd; a nuclear sub-compartment, or a soluble compartment
      (cytoplasm/cytosol) that a nuclear protein lacking targeting signals transits after
      translation and that is corroborated by independent datasets, is KEEP_AS_NON_CORE; an
      organelle requiring import (mitochondrion) supported by a single fractionation dataset and no
      targeting signal is MARK_AS_OVER_ANNOTATED. Purely computational (ISM/AtSubP) predictions
      contradicted by experimental nuclear localization (FLD mitochondrion/chloroplast, FCA
      cytoplasm) are REMOVEd.
