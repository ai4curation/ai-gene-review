  review:
    summary: fve/msi5 mutants have reduced H3K27me3 on FLC (IMP).
    action: MODIFY
    reason: The process is sound, but the evidence is directional. Loss of FVE (with MSI5) lowers
      H3K27me3 at FLC and derepresses FLC, so FVE's role is repression. As a histone-binding
      subunit of CLF-PRC2 and of the HDA5/HDA6-FLD deacetylase complex, FVE contributes structurally
      to the chromatin modifications that silence FLC. GO:0045814 (negative regulation of gene
      expression, epigenetic) is the more informative child of GO:0040029. The ARBA IEA row is kept
      at the parent term.
    proposed_replacement_terms:
