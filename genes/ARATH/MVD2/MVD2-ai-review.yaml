core_functions:
- description: >-
    Diphosphomevalonate decarboxylase: ATP-dependent decarboxylation of (R)-mevalonate
    5-diphosphate to isopentenyl diphosphate, step 3 of 3 of IPP synthesis from mevalonate,
    specific for the diphosphate substrate. Presumed peroxisomal by similarity to MVD1.
  molecular_function:
