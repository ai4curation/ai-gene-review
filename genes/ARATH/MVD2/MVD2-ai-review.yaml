description: >-
  MVD2 (At3g54250; TAIR symbol MDD2) encodes the second diphosphomevalonate decarboxylase of
  Arabidopsis thaliana, a 419-residue GHMP-superfamily enzyme 89% identical to MVD1. It converts
  (R)-mevalonate 5-diphosphate, with ATP, to isopentenyl diphosphate, ADP, phosphate and CO2,
  the last of the ATP-dependent steps that convert mevalonate to isopentenyl diphosphate in the
  mevalonate pathway feeding sterol and terpenoid synthesis. The recombinant enzyme is specific
  for mevalonate 5-diphosphate (Km about 26 uM) and decarboxylates mevalonate 5-phosphate some
  10,000-fold less efficiently. Its localisation has not been tested; by similarity to MVD1,
  whose fluorescent fusion is peroxisomal, it is presumed to be peroxisomal. Its contribution
  relative to MVD1 in planta is unknown, although the mild sterol phenotype of mvd1 mutants
  suggests that MVD2 supplies part of the activity.
