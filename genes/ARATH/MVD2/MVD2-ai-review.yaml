suggested_questions:
- question: >-
    Which Arabidopsis MVD paralog was fused to YFP in the 2011 periwinkle-cell localisation, and
    does the other paralog localise the same way?
- question: >-
    TAIR lists At3g54250 as MDD2 while UniProt uses MVD2; which symbol should be the standard one?
suggested_experiments:
- hypothesis: >-
    MVD2 is peroxisomal like MVD1 and contributes part of the plant's MVAPP decarboxylase activity.
  description: >-
    Native-promoter MVD2-YFP with peroxisome markers; mvd2 and mvd1 mvd2 mutant analysis (sterol
    and sesquiterpene profiles, viability, gametophyte transmission) to measure the paralogs'
    relative contributions; tissue expression of MVD2 versus MVD1.
  experiment_type: localisation and genetic redundancy analysis
knowledge_gaps:
- gap_statement: >-
    The subcellular location and in planta contribution of MVD2 are unknown; only its in vitro
    kinetics have been measured.
  boundary: >-
    Recombinant MVD2 is an active, MVAPP-specific decarboxylase, and its 89% identical paralog
    MVD1 is peroxisomal as a YFP fusion; mvd1 mutants retain most of their sterols.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Whether the two paralogs are redundant, divided by tissue, or targeted differently determines
    how the last step of plant IPP synthesis is supplied and regulated.
  resolution: >-
    MVD2 localisation with native-promoter fusions, and single and double mutant analysis.
  provenance:
  - reference_id: file:ARATH/MVD2/MVD2-uniprot.txt
    supporting_text: 'SUBCELLULAR LOCATION: Peroxisome {ECO:0000250|UniProtKB:O23722}.'
