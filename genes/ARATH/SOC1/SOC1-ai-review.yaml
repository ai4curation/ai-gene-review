    label: maintenance of inflorescence meristem identity
  evidence_type: IGI
  original_reference_id: PMID:20626659
  review:
    summary: >-
      IGI (with BOP1/BOP2) for maintenance of inflorescence meristem identity,
      from a study showing that BOP1/2, LFY and AP1 converge to down-regulate
      flowering-time MADS genes in floral meristems. The cached abstract names
      AGL24 rather than SOC1; the genetic interaction with soc1 is in the full
      text, which is not cached.
    action: KEEP_AS_NON_CORE
    reason: >-
      SOC1, with AGL24 and SVP, promotes inflorescence (shoot) character and must
      be repressed in floral primordia for floral meristem identity, so a role
      in maintaining inflorescence meristem identity is biologically consistent.
      The quoted abstract sentence gives the pathway context but does not name
      SOC1; the SOC1 genetic interaction is in the full text, which is not
      cached. The experimental curator saw the full text; the annotation is
      retained but treated as non-core relative to SOC1's floral-integrator role
      in the vegetative-to-reproductive transition.
