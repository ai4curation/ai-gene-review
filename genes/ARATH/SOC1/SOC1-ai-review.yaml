  title: The AGAMOUS-LIKE 20 MADS domain protein integrates floral inductive pathways in
    Arabidopsis.
  findings:
  - statement: >-
      Activation tagging identifies AGL20/SOC1 as a dominant suppressor of FRI-associated late flowering.
      AGL20 overexpression suppresses late flowering, while its expression integrates vernalization,
      autonomous and photoperiod pathway inputs; this is positive developmental regulation rather
      than a structural floral-organ activity.
    supporting_text: >-
      Overexpression of AGL20 suppresses not only the late flowering of plants that have functional
      FRI and FLC alleles but also the delayed phase transitions during the vegetative stages of
      plant development.
  reference_review:
