  original_reference_id: PMID:16507079
  review:
    summary: >-
      The source supports SOC1 transcript induction by vernalization/cold in
      reciprocal relationship to FLC repression. This is useful evidence that
      SOC1 is an output of cold-dependent flowering regulation, but it does not
      make cold response the core function of the protein.
    action: KEEP_AS_NON_CORE
    reason: >-
      PMID:16507079 directly reports quantitative and acute SOC1 induction after cold exposure. Expression
      change is a valid response claim; direct temperature sensing or a generalized freezing-tolerance
      role is not required or inferred. Retain as non-core input/context relative to transcriptional control
      of flowering.
