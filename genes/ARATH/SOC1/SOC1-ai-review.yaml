suggested_questions:
- question: >-
    Which cold- and gibberellin-responsive SOC1 outputs reflect upstream control of flowering, and
    which involve additional physiological responses? How should those contexts be distinguished
    while retaining the supported response annotations?
  experts:
  - Coupland G
  - Lee I
  - Yu H
- question: >-
    Which SOC1 genotypes and meristem stages in PMID:20626659 support maintenance of inflorescence
    meristem identity, and how do they distinguish maintenance of shoot identity from promotion
    of the initial floral transition?
  experts:
  - Hepworth SR
  - Yu H
- question: >-
    Do native SOC1/AGL24 and related MIKC-type MADS assemblies have sufficiently stable composition
    and distinct functions to warrant more specific transcription-factor-complex terms beyond their
    established heterodimerization activity?
  experts:
  - Angenent GC
  - Immink RG
  - Coupland G
- question: >-
    Does the 2024 SOC1/AGL24 root-development study identified in the research report establish
    a direct regulatory contribution warranting a separate non-core annotation, and how does it
    distinguish root-specific activity from systemic flowering effects?
  experts:
  - Alvarez-Buylla ER
  - Garay-Arroyo A
- question: How do native SOC1 partner composition and cell type determine transcriptional
    activation versus repression during floral transition?
- question: Does the partner-dependent cytoplasmic-to-nuclear redistribution observed in
    transient protoplast assays occur with endogenous SOC1 in intact shoot meristems?
suggested_experiments:
- hypothesis: >-
    SOC1 partner identity determines which floral-transition targets are
    activated at distinct shoot-apex stages.
  description: >-
    Perform native-promoter SOC1 CUT&RUN or ChIP-seq together with
    partner-specific perturbations of AGL24, SVP, AP1, and SPL factors, paired
    with nascent RNA-seq across the floral transition.
  experiment_type: chromatin binding and transcriptional profiling
- hypothesis: >-
    The cytoplasmic SOC1 pool is a regulated reservoir that becomes nuclear
    only after partner availability or signaling-dependent modification.
  description: >-
    Quantify native SOC1-GFP localization dynamics under long-day, short-day,
    vernalization, and gibberellin treatments in wild type and agl24 mutants.
  experiment_type: live imaging
- hypothesis: >-
    SOC1's root-development role uses a subset of the same MADS partner and
    chromatin-recruitment mechanisms used at the shoot apex.
  description: >-
    Map SOC1 binding and transcriptomic effects in roots of soc1, agl24, xal2,
    and higher-order mutant backgrounds, with rescue by DNA-binding and
    partner-interaction mutant SOC1 alleles.
  experiment_type: genetics and functional genomics
