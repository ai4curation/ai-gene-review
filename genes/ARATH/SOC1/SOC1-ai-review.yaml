      establishes their positive contribution to CO-mediated flowering. The accessible abstract
      also reports regulation by a CO-independent pathway.
    supporting_text: >-
      Two of these genes, SUPPRESSOR OF OVEREXPRESSION OF CO 1 (SOC1) and FLOWERING LOCUS T (FT),
      are required for CO to promote flowering; the others are involved in proline or ethylene biosynthesis.
