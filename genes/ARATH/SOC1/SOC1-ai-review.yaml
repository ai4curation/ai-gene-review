core_functions:
- description: >-
    SOC1 is a nuclear MADS-box RNA polymerase II transcription factor that
    binds cis-regulatory regions of floral-transition genes and activates
    transcriptional programs promoting the vegetative-to-reproductive meristem
    transition. Direct targets and outputs include AGL24 positive feedback,
    LFY promoter activation, and TFS1 activation with recruitment of chromatin
    regulators REF6 and BRM.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0010228
    label: vegetative to reproductive phase transition of meristem
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:18466303
    supporting_text: >-
      SOC1 directly binds to the distal and proximal region of the LFY promoter
      where critical cis-elements are located.
  - reference_id: PMID:18339670
    supporting_text: >-
      positive-feedback loop conferred by direct transcriptional regulation
      between AGL24 and SOC1 at the shoot apex integrates flowering signals.
  - reference_id: PMID:30946745
    supporting_text: >-
      SOC1 opposes PRC function at TFS1 through recruitment of the histone
      demethylase RELATIVE OF EARLY FLOWERING 6 (REF6) and the SWI/SNF
      chromatin remodeler ATPase BRAHMA (BRM).
- description: >-
    SOC1 forms MADS-domain partner complexes, most clearly a SOC1-AGL24
    heterodimer, that regulate SOC1 nuclear accumulation and enable floral
    transition target activation. This dimerization/heterodimerization is a
    core mechanism but should be interpreted in the context of SOC1's
    transcription factor activity, not as generic protein binding.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  directly_involved_in:
  - id: GO:0010228
    label: vegetative to reproductive phase transition of meristem
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:18466303
    supporting_text: >-
      heterodimerization of SOC1 and AGL24 is a key mechanism in activating LFY
      expression.
  - reference_id: file:ARATH/SOC1/SOC1-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: >-
      Forms a heterodimer with AGL24 through MADS-box domain.
proposed_new_terms: []
suggested_questions:
- question: How do native SOC1 partner composition and cell type determine transcriptional
    activation versus repression during floral transition?
- question: Does the partner-dependent cytoplasmic-to-nuclear redistribution observed in transient
    protoplast assays occur with endogenous SOC1 in intact shoot meristems?
suggested_experiments:
- hypothesis: >-
    SOC1 partner identity determines which floral-transition targets are
    activated at distinct shoot-apex stages.
  description: >-
    Perform native-promoter SOC1 CUT&RUN or ChIP-seq together with
    partner-specific perturbations of AGL24, SVP, AP1, and SPL factors, paired
    with nascent RNA-seq across the floral transition.
  experiment_type: chromatin binding and transcriptional profiling
- hypothesis: >-
    The cytoplasmic SOC1 pool is a regulated reservoir that becomes nuclear
    only after partner availability or signaling-dependent modification.
  description: >-
    Quantify native SOC1-GFP localization dynamics under long-day, short-day,
    vernalization, and gibberellin treatments in wild type and agl24 mutants.
  experiment_type: live imaging
- hypothesis: >-
    SOC1's root-development role uses a subset of the same MADS partner and
    chromatin-recruitment mechanisms used at the shoot apex.
  description: >-
    Map SOC1 binding and transcriptomic effects in roots of soc1, agl24, xal2,
    and higher-order mutant backgrounds, with rescue by DNA-binding and
    partner-interaction mutant SOC1 alleles.
  experiment_type: genetics and functional genomics
