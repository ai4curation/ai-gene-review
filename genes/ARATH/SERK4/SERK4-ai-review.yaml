  review:
    summary: EC 2.7.10.1 mapping gives transmembrane receptor protein tyrosine kinase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: SERK4 is a transmembrane receptor kinase that can autophosphorylate on tyrosine in vitro,
      but the receptor-tyrosine-kinase term implies that the receptor transduces its signal by tyrosine
      phosphorylation. For SERK4 the signalling output is established only as Ser/Thr transphosphorylation
      within LRR-RK complexes; tyrosine autophosphorylation has not been shown to be the signalling mechanism.
      The tyrosine activity is captured by GO:0004713 and the receptor activity by GO:0004675; this combined
      term over-reaches the evidence.
