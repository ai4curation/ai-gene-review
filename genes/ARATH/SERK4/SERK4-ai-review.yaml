  review:
    summary: HDA from a size-exclusion/LC-MS profiling dataset of Arabidopsis leaf membrane fractions.
    action: MARK_AS_OVER_ANNOTATED
    reason: The study profiled detergent-solubilized membrane fractions to estimate complex sizes and
      relied on SUBAcon predictions for organelle categories; it was not designed to localise proteins
      to mitochondria and no ER/PM marker separation for SERK4 is reported. SERK4 has a cleavable secretory
      signal peptide and a single TM and is a plasma-membrane co-receptor; there is no independent evidence
      for mitochondrial localisation. The organelle claim does not hold for this protein.
