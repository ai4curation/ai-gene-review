core_functions:
- description: Kinase-active plasma-membrane co-receptor (dual-specificity LRR receptor kinase) recruited
    by ligand-bound LRR receptor kinases. SERK4 forms ligand-induced heteromers with BRI1, FLS2, EFR,
    MIK2 and ERECTA/ERL1 and transphosphorylates with them, initiating brassinosteroid and pattern-recognition
    receptor signalling.
  molecular_function: *id001
