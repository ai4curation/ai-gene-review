  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id002
  - *id003
  - *id012
  - *id014
  - *id007
  - *id013
- description: Together with BAK1, SERK4 negatively regulates a brassinosteroid-independent, light-dependent
    cell-death pathway; bak1 bkk1 double null seedlings die with spontaneous cell death and constitutive
    defence activation. The mechanism (e.g. guarding of BAK1/SERK4 complexes by immune receptors) is unresolved.
  molecular_function: *id001
  directly_involved_in:
  - *id008
  locations:
  - id: GO:0005886
    label: plasma membrane
