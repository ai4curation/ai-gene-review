id: Q9SKG5
gene_symbol: SERK4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'SERK4 (SOMATIC EMBRYOGENESIS RECEPTOR KINASE 4; also BKK1/BAK1-LIKE 1 and BAK7) is one of
  five Arabidopsis SERK leucine-rich repeat receptor-like kinases (LRR-RLK subfamily II). It is a single-pass
  plasma-membrane protein with a short LRR ectodomain and an active cytoplasmic dual-specificity kinase
  domain that autophosphorylates on Ser/Thr and Tyr. SERK4 does not appear to act as a primary ligand
  receptor; instead, like its closest paralog BAK1/SERK3, it is recruited in a ligand-induced manner as
  a co-receptor by ligand-binding LRR receptor kinases and transphosphorylates with them to initiate signalling.
  With BAK1 and SERK1 it is required for brassinosteroid signalling through BRI1 (serk1 bak1 bkk1 triple
  null mutants are BR-blind); with BAK1 it forms ligand-induced complexes with the immune receptors FLS2,
  EFR and MIK2 and is needed for full responses to bacterial PAMPs, the AtPep1 DAMP and SCOOP phytocytokines,
  and for disease resistance. Together with BAK1 it also restrains a BR-independent, light-dependent cell-death/autoimmune
  pathway: bak1 bkk1 double null mutants are seedling lethal with spontaneous cell death and constitutive
  defence activation. SERK4 makes a minor contribution, with other SERKs, to EPF-ERECTA signalling in
  stomatal patterning, and its loss with BAK1 is associated with early senescence.'
