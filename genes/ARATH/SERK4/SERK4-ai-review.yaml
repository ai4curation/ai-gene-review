      resource: TAIR
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0005739
      cause: CONTAMINANT
      confidence: SUSPECTED
      explanation: HDA mitochondrion row for AT2G13790 (SERK4) from PMID:28887381, a membrane-fraction
        SEC/LC-MS profiling study. SERK4 is a signal-peptide, single-pass plasma membrane LRR receptor
        kinase; detection in a crude membrane fraction does not establish mitochondrial location. Please
        check whether the dataset actually assigns SERK4 to mitochondria; otherwise delete the row.
    supported_by:
    - *id006
