suggested_questions:
- question: Is the spontaneous cell death of bak1 serk4 double mutants caused by immune receptors that
    guard BAK1/SERK4-containing complexes (autoimmunity), and if so which NLRs mediate it?
- question: Does tyrosine autophosphorylation of SERK4 contribute to its co-receptor signalling in vivo,
    as shown for BRI1 Tyr831 and BAK1?
- question: Should the plant-type hypersensitive response IBA at PTN005392389 be replaced by a negative-regulation-of-cell-death
    term, given that the BAK1 and SERK4 seed phenotypes are loss-of-function cell death?
suggested_experiments:
- description: Suppressor screen or targeted knockouts of candidate TIR-NLRs (and EDS1/PAD4/SAG101 helper
    pathway components) in a conditional bak1 serk4 background to test whether the cell death is NLR-dependent
    autoimmunity.
- description: Phosphoproteomics of SERK4 in planta after BL, flg22 and SCOOP12 treatment, with Tyr-to-Phe
    mutants complementing bak1 serk4, to test whether tyrosine phosphorylation is required for SERK4 co-receptor
    signalling.
