suggested_questions:
- question: 'What explains the functional specialisation of SnRK2.2/2.3 (seeds, seedlings, roots) versus
    OST1 (guard cells): expression pattern alone, as Fujii et al. 2007 proposed, or differences in substrate
    preference or in PP2C/receptor pairing?'
- question: Does SnRK2.2 directly phosphorylate RaptorB and FREE1 in vivo, given that the RaptorB phosphorylation
    was shown only for SnRK2.6 and the FREE1 work used the SnRK2 family? Which substrates are specific
    to SnRK2.2?
- question: Root hydrotropism requires SnRK2.2 acting in elongation-zone cortical cells (PMID:28481327).
    Which cortical substrates mediate this, and should SnRK2.2 carry a hydrotropism (GO:0010274) annotation
    once the full text is reviewed?
suggested_experiments:
- hypothesis: SnRK2.2 phosphorylates a substrate set in seeds and root cortex that differs from the guard-cell
    substrates of OST1.
  description: Cortex- or seed-specific phosphoproteomics comparing wild type, snrk2.2 and snrk2.2 snrk2.3
    after ABA treatment, to define the SnRK2.2-dependent substrate set outside guard cells.
  experiment_type: phosphoproteomics
- hypothesis: Expression domain, rather than intrinsic kinase properties, determines the SnRK2.2 versus
    OST1 specialisation.
  description: Promoter-swap complementation (SnRK2.2 coding sequence expressed from the OST1 promoter
    in ost1, and the reverse) to test whether expression domain or protein-intrinsic properties underlie
    the SnRK2.2 versus OST1 specialisation.
  experiment_type: genetic complementation
