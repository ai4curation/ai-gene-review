    summary: PAINT IBA placing protein serine/threonine kinase activity on the ancestral node of the SNF1/AMPK-related
      CAMK-like kinase clade that contains the SnRK2s.
    action: ACCEPT
    reason: SnRK2.2 retains an intact kinase domain (active-site Asp-142, ATP-binding Lys-52) and is an
      ABA- and osmotic stress-activated Ser/Thr kinase that phosphorylates ABF/AREB/ABI5 bZIPs and AKS1.
      This is the core molecular function and the right level of specificity.
