    reason: 'Protein kinase activity is correct but less specific than the evidence supports: SnRK2.2
      is an EC 2.7.11.1 Ser/Thr kinase phosphorylating Ser/Thr sites of ABF/AREB bZIPs. Replace with protein
      serine/threonine kinase activity (GO:0004674), which the gene already carries by IBA and IEA. (The
      OST1 review accepted this general term; refined here per the correct-but-general MODIFY rule.)'
