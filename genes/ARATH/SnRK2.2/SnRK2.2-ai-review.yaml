core_functions:
- description: ABA- and osmotic stress-activated protein serine/threonine kinase (subclass III SnRK2).
    Released from clade A PP2C inhibition by ABA-bound PYR/PYL receptors, SnRK2.2 autophosphorylates and
    phosphorylates ABRE-binding bZIP transcription factors (ABF1, ABF2/AREB1, ABI5) and other substrates
    (AKS1, FREE1), transducing the ABA signal to gene expression.
