id: Q39192
gene_symbol: SnRK2.2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SnRK2.2 (SRK2D; SNF1-related protein kinase 2.2, At3g50500) is a subclass III SnRK2 serine/threonine
  protein kinase of Arabidopsis thaliana and one of the three core positive transducers of abscisic acid
  (ABA) signaling, acting redundantly with SnRK2.3/SRK2I and SnRK2.6/OST1. The 362-residue protein consists
  of an N-terminal protein kinase domain and a short acidic C-terminal regulatory region. In the absence
  of ABA, clade A type 2C protein phosphatases (ABI1, ABI2, HAB1, PP2CA/AHG3, AHG1, HAI1) bind SnRK2.2
  and dephosphorylate its activation loop, keeping it inactive. ABA-bound PYR/PYL/RCAR receptors inhibit
  these phosphatases, allowing SnRK2.2 to become active by autophosphorylation. SnRK2.2 is also activated
  by hyperosmotic and saline stress. Active SnRK2.2 phosphorylates the ABRE-binding bZIP transcription
  factors ABF1, ABF2/AREB1 and ABI5, the bHLH factor AKS1 and the ESCRT component FREE1, driving ABA-responsive
  gene expression in the nucleus and cytoplasm. SnRK2.2 is expressed in all tissues. With SnRK2.3 it is
  the main kinase mediating ABA control of seed dormancy, germination, seedling and root growth, proline
  accumulation and ABRE-dependent gene induction, whereas its contribution to stomatal closure is minor
  compared with OST1. Together with SnRK2.3 and OST1 it is required for drought and osmotic stress tolerance,
  seed development, and growth and fertility. In roots, SnRK2.2 acting in elongation-zone cortical cells
  is required for hydrotropism.
