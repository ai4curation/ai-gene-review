id: Q9SAK2
gene_symbol: GA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GA2 (ent-kaurene synthase, KS; At1g79460) is a plastid-targeted class I diterpene synthase
  of the terpene synthase family that converts ent-copalyl diphosphate, the product of GA1/CPS, into the
  tetracyclic hydrocarbon ent-kaur-16-ene with release of diphosphate, the second committed reaction of
  gibberellin biosynthesis. Catalysis uses Mg2+ bound by DDXXD-type motifs to ionize the diphosphate.
  The protein is imported into chloroplasts/plastids, where it is a soluble stromal enzyme, and is expressed
  throughout the plant. ga2 mutants (e.g. ga2-1, carrying a premature stop that removes the C-terminal
  catalytic region) are gibberellin-deficient dwarfs. A single active-site residue change converts land-plant
  KS enzymes into pimaradiene synthases, illustrating how specialized diterpene metabolism derives from
  this enzyme.
