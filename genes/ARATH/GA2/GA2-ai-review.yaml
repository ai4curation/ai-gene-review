suggested_questions:
- question: Do CPS and KS physically associate in the plastid stroma to channel ent-CPP, and does such
    association affect flux into gibberellin versus other diterpenoids?
suggested_experiments:
- description: Test CPS-KS proximity in planta (e.g. BiFC or proximity labelling in plastids) and measure
    ent-CPP leakage in lines with altered CPS:KS stoichiometry.
