core_functions:
- description: Acts as the high-affinity ligand-binding pattern-recognition receptor for fungal chitin
    oligomers at the plasma membrane. Its LysM ectodomain binds chitooctaose, and chitin binding drives
    formation of the LYK5-CERK1 complex that activates CERK1 kinase signalling for chitin-triggered immunity.
