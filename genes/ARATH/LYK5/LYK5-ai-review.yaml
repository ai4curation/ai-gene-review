  - PANTHER:PTN001232170
  - UniProtKB:Q0GXS4
  review:
    summary: IBA from the PANTHER LysM-RLK node (PTN001232170) to response to molecule of bacterial origin.
      LYK5 is a chitin (fungal MAMP) receptor; there is no evidence that LYK5 perceives a bacterial molecule.
      Untreated lyk5-2 plants had wild-type resistance to Pst DC3000; the only bacterial phenotype is
      loss of chitin-induced priming against Pst. Bacterial peptidoglycan perception in Arabidopsis is
      attributed to LYM1/LYM3 with CERK1, not LYK5.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The family node includes CERK1 (peptidoglycan co-receptor) and LYK4 (bacterial susceptibility
      phenotype), so the term may be valid for some members, but LYK5-specific evidence argues against
      direct involvement: lyk5-2 shows wild-type basal resistance to Pst DC3000, and its ligand is fungal
      chitin. Not removed outright because the IBA reflects a PAINT node judgment and LYK5 contributes
      indirectly through chitin-primed resistance.'
    supported_by:
    - reference_id: PMID:25340959
      supporting_text: Untreated Atcerk1 and Atlyk5-2 mutant plants showed wild-type levels of resistance
        to the bacterial pathogen Pseudomonas syringae pv. tomato DC3000.
    - reference_id: PMID:25340959
      supporting_text: In this model, AtLYK5 (or AtLYK4) serves as a chitin perception, while AtCERK1
        is responsible for chitin signaling transduction due to lack of kinase activity of AtLYK5 (or
        AtLYK4).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001232170
        source_label: LysM receptor-like kinase family node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node spans CERK1, LYK4 and LYK5. The bacterial-molecule response fits members that
          are peptidoglycan co-receptors or have bacterial phenotypes. LYK5 is a chitin-specific receptor
          with wild-type basal resistance to Pst.
      - source_id: AGI_LocusCode:AT2G23770
        source_label: LYK4
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: lyk4 mutants are more susceptible to Pst DC3000 (Wan et al. 2012). There is no equivalent
