- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: ISM
  original_reference_id: GO_REF:0000122
  qualifier: located_in
  review:
    summary: ISM (AtSubP) prediction of extracellular region, presumably driven by the N-terminal signal
      peptide (residues 1-26). LYK5 is a single-pass type I plasma membrane protein whose LysM ectodomain
      faces the apoplast; the mature protein is not secreted.
    action: REMOVE
    reason: Experimental localization (GFP fusions; native-promoter LYK5-mCitrine) places LYK5 at the
      plasma membrane and in endosomes after chitin, never free in the extracellular space. A transmembrane
      receptor whose ectodomain faces the apoplast should be annotated to plasma membrane, not extracellular
      region. This is a signal-peptide localization default.
    supported_by:
    - reference_id: PMID:25340959
      supporting_text: Confocal microscopy showed that AtLYK5-GFP co-localized with the plasma membrane
        dye, FM4-64
    - reference_id: PMID:28513921
      supporting_text: Both CERK1 and LYK5 localized to the plasma membrane and showed constitutive endomembrane
        trafficking.
