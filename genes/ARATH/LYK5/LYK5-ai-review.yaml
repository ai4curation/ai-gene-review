proposed_new_terms: []
suggested_questions:
- question: LYK5 is a non-catalytic, ligand-binding receptor subunit that recruits an active kinase (CERK1).
    Is GO:0038187 pattern recognition receptor activity the right MF for such subunits, or should a co-receptor
    / ligand-binding receptor-subunit term be used, with CERK1 carrying the signalling kinase activity?
- question: The PAINT node PTN001232170 propagates response to molecule of bacterial origin to LYK5, but
    lyk5-2 has wild-type basal resistance to Pst DC3000. Should this IBA be restricted to the CERK1 lineage
    (the peptidoglycan co-receptor)?
- question: Is the ligand-independent, DTT-sensitive LYK5 homodimer functionally required for chitin perception,
    or is it an artefact of overexpression?
- question: Does chitin-induced, CERK1-dependent endocytosis of LYK5 attenuate signalling (receptor removal),
    or is it needed for signalling from endosomes?
suggested_experiments:
- description: Structural determination (cryo-EM or crystallography) of the LYK5 ectodomain bound to chitooctaose,
    alone and in complex with the CERK1 ectodomain, to define binding residues and complex stoichiometry.
- description: Test nucleotide binding by the purified LYK5 pseudokinase domain (e.g. thermal shift or
    MANT-ATP assays) to resolve whether the ATP binding annotation has any basis.
- description: Complement lyk4 lyk5 double mutants with LYK5 variants defective in homodimerization (cysteine
    mutants) to test whether the pre-formed homodimer is required for chitin signalling.
