id: O22808
gene_symbol: LYK5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'LYK5 (LysM-containing receptor-like kinase 5, At2g33580) is a single-pass type I plasma
  membrane receptor of the LysM receptor-like kinase family. It has an N-glycosylated extracellular region
  with three LysM motifs and an intracellular pseudokinase domain that lacks the P-loop, RD and DFG catalytic
  residues and shows no detectable kinase activity. LYK5 is the main high-affinity receptor for fungal
  chitin in Arabidopsis: its ectodomain binds long-chain chitin oligomers (chitooctaose, Kd about 1.7
  uM), much more tightly than CERK1. Chitin binding drives formation of a LYK5-CERK1 complex, which leads
  to CERK1 homodimerization and phosphorylation. CERK1 supplies the active kinase that triggers downstream
  responses: ROS burst, calcium influx, MPK3/MPK6 activation, defense gene expression and resistance to
  fungi such as Alternaria brassicicola. The pseudokinase domain is needed for association with CERK1
  but not for catalysis. LYK5 forms ligand-independent homodimers. It overlaps in function with its paralog
  LYK4: lyk4 lyk5 double mutants lose all chitin responses. After chitin perception, CERK1 phosphorylates
  LYK5, which is then internalized into late endosomes. CPK5 also phosphorylates LYK5. Its basal abundance
  is limited by the U-box E3 ligase PUB13.'
