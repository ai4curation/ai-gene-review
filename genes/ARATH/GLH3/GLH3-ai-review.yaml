description: GLASSY HAIR 3 (GLH3; At5g55720, also called PLL14) is a secreted member of the polysaccharide
  lyase 1 (PL1) pectate lyase family. It is needed to form papillae, the small raised cell-wall protrusions
  on the surface of Arabidopsis leaf trichomes that make the trichomes reflect light. The 392-residue
  precursor has an N-terminal signal peptide and a right-handed beta-helix pectate lyase domain. It keeps
  the catalytic arginine and the Ca2+-binding aspartates of characterized PL1 enzymes, so it is predicted
  to cleave de-esterified homogalacturonan (pectate) by beta-elimination. In leaves GLH3 is expressed
  only in trichomes, before papillae appear. Its expression is switched on by the Mediator complex through
  the tail subunits MED25 (GLH1) and MED16 (GLH2). The protein is secreted through the canonical pathway
  into the apoplast, where a GFP fusion accumulates in the papillae. glh3 mutants lack or have fewer papillae
  and so have glassy (transparent) trichomes. Trichome cellulose is unaffected, so the defect is limited
  to papillae. These data support a model in which focal, GLH3-mediated pectin breakdown in the trichome
  wall reshapes the cell surface into papillae. Pectate lyase activity has not been demonstrated directly
  on GLH3 protein.
