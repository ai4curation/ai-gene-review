- term:
    id: GO:1905499
    label: trichome papilla formation
  evidence_type: IMP
  original_reference_id: PMID:42555921
  review:
    summary: glh3 mutants fail to form trichome papillae, and GLH3 protein accumulates in the papillae
      it is required to build.
    action: NEW
    reason: The glh3 loss-of-function phenotype is a specific lack of papillae, with no change in trichome
      cellulose. GLH3 is expressed only in trichomes, before papillae appear, and the secreted protein accumulates
      in the papillae. Participation test, which asks who does the work of forming the structure, is met.
      GLH3 is the enzyme present at the site and is proposed to remodel the wall by focal pectin hydrolysis,
      so it is more than a necessary upstream factor. For the comparator check, GO:1905499 is already annotated
      (IMP, PMID:24014871) to MED25/GLH1 and MED16/GLH2, the Mediator subunits that activate GLH3 expression,
      and to ECR/GLH6. Those comparators are more indirect than GLH3. The Mediator subunits regulate transcription,
      and for ECR the authors suggest the papilla defect may follow from developmental arrest (kept as
      non-core in the ECR review). The comparators therefore show that GO uses this term for papilla
      phenotypes, not that an effector already carries it. GLH3's case is stronger than any of them,
      with trichome-specific expression that precedes papillae and accumulation of the protein in the
      structure itself. GLH3 had not been cloned when PMID:24014871 was curated.
    supported_by:
    - reference_id: PMID:42555921
      supporting_text: Papillae do not develop in the Arabidopsis glassy hair3 (glh3) mutant.
    - reference_id: PMID:42555921
      supporting_text: Cloning of the GLH3 gene revealed that a member of the pectate lyase gene family
        is required for papillae formation.
    - reference_id: PMID:42555921
      supporting_text: GLH3 pectate lyase expression is trichome-specific in leaves, and it precedes the
        appearance of papillae.
    - reference_id: PMID:24014871
      supporting_text: Trichomes in glh1 and glh3 mutants displayed cell-wall defects restricted to papillae
        formation.
core_functions:
- description: Secreted PL1 family pectate lyase, expressed in trichomes downstream of the Mediator subunits
    MED25 and MED16, that accumulates in papillae of the leaf trichome cell wall. There it is proposed to
    cleave de-esterified homogalacturonan locally, remodelling the wall to form the papillae that make
    trichomes reflect light.
