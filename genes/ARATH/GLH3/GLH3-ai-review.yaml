suggested_questions:
- question: Does recombinant GLH3 have pectate lyase activity in vitro, and what are its substrate preferences
    (degree of homogalacturonan methylesterification), pH optimum and Ca2+ dependence?
- question: How does local pectin breakdown produce raised wall protrusions rather than wall thinning?
    For example, does it release turgor-driven local expansion, or change how other wall polymers are deposited?
- question: Is the extra trichome branching reported for glh3 in the original screen caused by the GLH3
    lesion itself, or by a linked mutation?
- question: Is the antagonism with the pectin methylesterase QRT1 explained by QRT1 de-esterifying more
    homogalacturonan, which should create more pectate lyase substrate, or by Ca2+ crosslinking of de-esterified
    pectin making it resistant to GLH3?
suggested_experiments:
- hypothesis: GLH3 is a catalytically active pectate lyase, and its activity is needed for papilla formation.
  description: Express GLH3 and a catalytic-arginine mutant (R269A) in a heterologous host. Measure eliminative
    cleavage of polygalacturonate (A235 for unsaturated products) at a range of pH and Ca2+ levels. Test
    whether the R269A variant, expressed from the GLH3 promoter, rescues papillae in glh3.
  experiment_type: enzyme assay and genetic complementation
- hypothesis: Pectin in the papillae is selectively depolymerized during papilla development.
  description: Immunolabel trichome walls of wild type and glh3 with homogalacturonan epitope antibodies
    (LM19 for low-esterified, LM20 for high-esterified, 2F4 for Ca2+-crosslinked HG) over the time course
    of papilla formation.
  experiment_type: immunohistochemistry / cell wall imaging
