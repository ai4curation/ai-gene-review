    summary: PAINT inference of pectate lyase activity from node PTN001271105, seeded by the biochemically
      characterized Aspergillus nidulans pectate lyases plyB (Q00645) and plyA (Q5AVN4).
    action: ACCEPT
    reason: GLH3 is a PL1 family member with a full pectate lyase domain. It keeps the catalytic arginine
      (R269) and all three Ca2+-binding aspartates found in the two seed enzymes, so nothing suggests
      it has lost catalytic function and become a pseudoenzyme. The 2026 cloning study describes GLH3
