core_functions:
- description: Nuclear YABBY-family DNA-binding transcription factor that binds promoter cis-regulatory elements
    (FIL binding elements) and either activates targets (e.g. MYB75, KAN1, AS1) or, with LEUNIG/LEUNIG_HOMOLOG co-repressors,
    represses them (e.g. KNOX genes), thereby specifying abaxial cell fate and adaxial/abaxial polarity of lateral
    organs.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
