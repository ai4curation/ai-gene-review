suggested_questions:
- question: Is FIL DNA binding genuinely sequence-specific in vivo (FBE motif), reconciling the early non-sequence-specific
    gel-shift data (PMID:11812777) with the FBE-specific EMSA (PMID:26530088)?
- question: Which FIL targets are activated directly and which are repressed via the LUG/LUH-SEUSS complex, and
    what determines the switch between activator and repressor output?
- question: What is the mobile signal through which FIL in organ primordia non-autonomously regulates SAM activity
    and phyllotaxy (LAS-dependent)?
suggested_experiments:
- experiment_type: ChIP-seq with DAP-seq comparison
  hypothesis: FIL occupies FBE-containing promoters of polarity genes (KAN1, ARF4, AS1) and KNOX genes in vivo.
  description: Perform FIL-GFP ChIP-seq in shoot apices of a complemented fil yab3 line and compare with in vitro
    DAP-seq of the FIL YABBY domain.
- experiment_type: Co-repressor dependence assay
  hypothesis: Repression of KNOX targets by FIL requires LUG/LUH recruitment, whereas activation of MYB75 does not.
  description: Measure target expression after FIL-GR induction in lug luh/+ and wild type backgrounds, and with
    FIL variants unable to bind LUG/SEU.
