id: O22152
gene_symbol: YAB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'YABBY-family transcription factor (FILAMENTOUS FLOWER, FIL; also AFO/YAB1) with an N-terminal C2C2
  zinc finger that binds two Zn(2+) ions and a C-terminal HMG-like YABBY DNA-binding domain. FIL is a nuclear protein
  expressed in the abaxial domain of all aerial lateral organ primordia (cotyledons, leaves, floral organs, carpel
  valves). It binds promoter DNA (including FIL binding elements in the MYB75 promoter) and acts as a bifunctional
  transcriptional regulator: as an activator of targets such as MYB75, KAN1, ARF4 and AS1, and, together with the
  LEUNIG/LEUNIG_HOMOLOG co-repressors and SEUSS adaptors, as a repressor (e.g. of KNOX genes STM, BP and KNAT2).
  With its paralogs YAB2, YAB3 and YAB5 it specifies abaxial cell fate and adaxial/abaxial polarity of lateral organs
  and promotes lamina growth. Acting from organ primordia, it also non-cell-autonomously influences shoot apical
  meristem initiation and maintenance, phyllotaxy, inflorescence and floral meristem organization, floral organ
  number and identity, and, with YAB3 and JAG, valve and valve-margin patterning of the fruit. JAZ3 binding attenuates
  its activation function, linking FIL to jasmonate-induced anthocyanin accumulation.'
