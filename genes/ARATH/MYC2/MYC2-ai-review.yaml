      reporter constructs following transfection of carrot protoplasts.
  - reference_id: PMID:17637675
    supporting_text: Moreover, JAI3 negatively regulates the key transcriptional activator of
      jasmonate responses, MYC2.
  - reference_id: PMID:28514654
