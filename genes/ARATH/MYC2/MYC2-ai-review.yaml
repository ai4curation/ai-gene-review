  title: Structural basis of JAZ repression of MYC transcription factors in jasmonate signalling.
  findings:
  - statement: The study directly maps a JAZ9-interacting region in MYC2 as well as MYC3/MYC4;
      MYC3-focused structural results do not imply MYC2 was untested.
    supporting_text: A conserved ~200 amino acid (aa 55-259, aa 44-234 and aa 55-253 in MYC2, MYC3
