id: Q39204
gene_symbol: MYC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: MYC2/JIN1/rd22BP1 is an Arabidopsis nuclear basic helix-loop-helix transcription factor
  that binds cis-regulatory DNA motifs and controls jasmonate-responsive transcription. JAZ
  repressors restrain MYC2 activity until jasmonate signaling promotes their degradation. MYC2
  coordinates defense, secondary metabolism and growth, including insect resistance,
  tryptophan-derived and flavonoid metabolism, and root development. Its activity is also modulated
  by ABA and ethylene signaling partners. MYC2 forms homotetramers that enhance DNA binding and
  transcriptional regulation.
