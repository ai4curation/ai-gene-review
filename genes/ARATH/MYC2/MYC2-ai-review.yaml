    reference_section_type: ABSTRACT
core_functions:
- description: Nuclear bHLH transcription factor activity in jasmonate signaling. MYC2 binds
    cis-regulatory promoter elements and regulates expression of jasmonate-responsive defense,
    metabolism, growth, and stress genes.
