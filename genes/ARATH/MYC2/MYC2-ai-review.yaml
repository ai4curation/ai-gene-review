- id: PMID:17616737
  title: MYC2 differentially modulates diverse jasmonate-dependent functions in Arabidopsis.
  findings:
  - statement: MYC2 negatively regulates tryptophan and indole-glucosinolate metabolism during
      jasmonate signaling.
    supporting_text: We found that MYC2 negatively regulates Trp and Trp-derived secondary
      metabolism such as indole glucosinolate biosynthesis during JA signaling.
    reference_section_type: ABSTRACT
- id: PMID:17637675
  title: The JAZ family of repressors is the missing link in jasmonate signalling.
  findings:
  - statement: JAZ/JAI3 repression regulates MYC2 within the core jasmonate pathway.
    supporting_text: Moreover, JAI3 negatively regulates the key transcriptional activator of
      jasmonate responses, MYC2.
    reference_section_type: ABSTRACT
- id: PMID:17675405
  title: A downstream mediator in the growth repression limb of the jasmonate pathway.
  findings: []
- id: PMID:18547396
  title: A critical role of two positively charged amino acids in the Jas motif of Arabidopsis JAZ
    proteins in mediating coronatine- and jasmonoyl isoleucine-dependent interactions with the COI1
    F-box protein.
  findings:
  - statement: JAZ1 and JAZ9 interact with MYC2 even when residues required for COI1 recognition are
      mutated.
    supporting_text: Mutations of these two residues did not affect the ability of JAZ1 and JAZ9 to
      interact with the transcription factor AtMYC2.
    reference_section_type: ABSTRACT
- id: PMID:19309455
  title: The ZIM domain mediates homo- and heteromeric interactions between Arabidopsis JAZ
    proteins.
  findings:
  - statement: Pull-down and yeast two-hybrid assays establish JAZ-MYC2 binding.
    supporting_text: we show that interaction with MYC2 is a common feature of the JAZ family, as
      most JAZ proteins can bind MYC2 in pull-down and yeast two-hybrid assays.
    reference_section_type: ABSTRACT
- id: PMID:21242320
  title: The bHLH transcription factor MYC3 interacts with the Jasmonate ZIM-domain proteins to
    mediate jasmonate response in Arabidopsis.
  findings:
  - statement: MYC2 mediates jasmonate responses including inhibition of root growth.
    supporting_text: The bHLH transcription factor MYC2 was found to interact with JAZs and mediate
      JA responses including JA-inhibitory root growth.
    reference_section_type: ABSTRACT
- id: PMID:21321051
  title: Characterization of JAZ-interacting bHLH transcription factors that regulate jasmonate
    responses in Arabidopsis.
  findings:
  - statement: MYC2 directly activates a JAZ promoter reporter in transfected protoplasts.
    supporting_text: MYC2, MYC3, and MYC4 were all capable of inducing expression of JAZ::GUS
      reporter constructs following transfection of carrot protoplasts.
    reference_section_type: ABSTRACT
- id: PMID:21737749
  title: Derepression of ethylene-stabilized transcription factors (EIN3/EIL1) mediates jasmonate
    and ethylene signaling synergy in Arabidopsis.
  findings: []
- id: PMID:23169619
  title: Transcription factor-dependent nuclear localization of a transcriptional repressor in
    jasmonate hormone signaling.
  findings:
  - statement: MYC2 interaction contributes to nuclear targeting of JAZ repressors.
    supporting_text: physical interaction with MYC2 appears to play an active role in the nuclear
      targeting of JAZ1 and JAZ9, and the nuclear localization of JAZ9 was compromised in myc2
      mutant plants.
    reference_section_type: ABSTRACT
- id: PMID:24399301
  title: Interaction between MYC2 and ETHYLENE INSENSITIVE3 modulates antagonism between jasmonate
    and ethylene signaling in Arabidopsis.
  findings:
  - statement: MYC2 binds EIN3 and represses its transcriptional activity, mediating JA/ET
      antagonism.
    supporting_text: MYC2 interacts with EIN3 to attenuate the transcriptional activity of EIN3 and
      repress ET-enhanced apical hook curvature.
    reference_section_type: ABSTRACT
