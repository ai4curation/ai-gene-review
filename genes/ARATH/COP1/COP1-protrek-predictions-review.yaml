  predicted_term:
    id: GO:0009640
    label: photomorphogenesis
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Rank 2 (score 15.98), an exact GOA match (IGI and TAS) and a core process in this review. Correct
      but unsigned - photomorphogenesis alone does not say whether COP1 promotes or represses it -
      and already annotated. GO-GPT and BioReason-SFT both return the same term, so all three models
      agree at this level of resolution and only ProTrek attempts the directional refinement, which
      it then gets wrong.
    supported_by:
