      supporting_text: >-
        Annotation inferences using phylogenetic trees
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0031465
    label: Cul4B-RING E3 ubiquitin ligase complex
  predicted_term_type: GO_CC
  review:
    assessment: PLI
    confidence_score: 0
    error_type: TAXON_CONSTRAINT_VIOLATION
    summary: >-
      Rank 3 (score 15.75), scored MORE_SPECIFIC because GOA carries the parent Cul4-RING E3 ubiquitin
      ligase complex by ISS. The refinement is not available to a plant: CUL4B is one of two vertebrate
      CUL4 paralogs (CUL4A/CUL4B), whereas Arabidopsis encodes a single CUL4. COP1 does act in a CUL4-DDB1
      context, so the parent is right and the child is a vertebrate-specific over-refinement - a closure-based
      score would credit this as a correct narrowing.
    supported_by:
    - reference_id: file:ARATH/COP1/COP1-uniprot.txt
      supporting_text: >-
        E3 ubiquitin-protein ligase COP1
