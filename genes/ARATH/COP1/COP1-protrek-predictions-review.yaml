id: P43254
gene_symbol: COP1
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana (Mouse-ear cress)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for COP1, the master E3 ubiquitin ligase that represses photomorphogenesis
  in darkness. The model finds the right process and then gets its sign backwards: rank 1 asserts
  positive regulation of photomorphogenesis, while the correct negative regulation sits at rank 5.
  Rank 3 refines GOA's Cul4-RING complex to the vertebrate-specific Cul4B version. The free-text channel
  is correct at rank 2 ('a repressor of photomorphogenesis and as an activator of etiolation in darkness').
  Assessment: 1 correct not novel (CNN), 1 paralog incorrect (PLI), 1 nonparalog incorrect (NPI).
source_documents:
- projects/PROTREK_EVALUATION/argo139_protrek_hits.tsv
- genes/ARATH/COP1/COP1-uniprot.txt
- genes/ARATH/COP1/COP1-goa.tsv
predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:2000306
    label: positive regulation of photomorphogenesis
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 16.07) and the exact opposite of COP1's function. COP1 is the central
      negative regulator of photomorphogenesis: in darkness it ubiquitinates HY5, HYH, LAF1 and other
      light-responsive transcription factors for proteasomal degradation, and cop1 mutants are constitutively
      photomorphogenic. The correctly-signed term, negative regulation of photomorphogenesis, is present
      in this same top five at rank 5, 0.47 score units below the wrong one. Directional inversion
      at the top of the list is the single most damaging error mode for a curator taking rank 1.
    supported_by:
    - reference_id: file:ARATH/COP1/COP1-uniprot.txt
      supporting_text: >-
        E3 ubiquitin-protein ligase COP1
