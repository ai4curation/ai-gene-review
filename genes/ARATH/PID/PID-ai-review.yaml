  review:
    summary: 'NEW annotation. PID phosphorylation of PIN hydrophilic loops is the step that
      sorts PINs to the apical plasma membrane: PID overexpression shifts PINs basal-to-apical
      and pid loss shifts PIN1 apical-to-basal at the inflorescence apex. PID thus catalyses
      the regulatory step of PIN polar targeting that determines auxin flow direction.'
    action: NEW
    reason: PID performs the phosphorylation that determines PIN polar localization (it does
      the work of the step rather than being a substrate). This process term is more specific
      than the existing acts_upstream_of_or_within auxin polar transport annotations.
