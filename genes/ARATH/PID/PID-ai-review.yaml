- term:
    id: GO:0009734
    label: auxin-activated signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:10693763
  qualifier: acts_upstream_of_or_within
  review:
    summary: Based on 35S::PID shoot and root phenotypes resembling auxin-insensitive plants,
      the original paper proposed that PID negatively regulates auxin signaling. Subsequent
      work showed that PID acts on auxin transport (PIN phosphorylation/polarity, enhanced
      efflux), and the phenotypes are explained by altered auxin distribution rather than
      a role in the TIR1/AFB signaling pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: PID is not a component of the auxin-activated signaling pathway; the interpretation
      has been superseded by its established role as a regulator of PIN-mediated transport.
    supported_by:
    - reference_id: PMID:10693763
      supporting_text: implying that PID, which encodes a serine-threonine protein kinase,
        negatively regulates auxin signaling
    - reference_id: PMID:11641228
      supporting_text: The results presented here indicate that PINOID functions as a positive
        regulator of polar auxin transport.
    - reference_id: PMID:16731587
      supporting_text: we demonstrate that the protein kinase PINOID (PID) positively regulates
        auxin efflux
