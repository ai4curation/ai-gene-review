core_functions:
- description: Secreted cysteine-rich peptide ligand (mature MEPF2) that binds the LRR ectodomain of ERECTA
    (and ERL1) in complex with the co-receptor TMM and activates the YODA-MKK4/5-MPK3/6 cascade, thereby
    inhibiting meristemoid mother cell fate and limiting entry of protodermal cells into the stomatal
    lineage.
