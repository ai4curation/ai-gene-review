- term:
    id: GO:0010052
    label: guard cell differentiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G34245
  - PANTHER:PTN002104517
  review:
    summary: PAINT inference of involvement in guard cell differentiation from the EPF/EPFL family node.
    action: MODIFY
    reason: EPF2 does not drive guard cell differentiation; it acts as an inhibitory cue that limits entry
      of protodermal cells into the stomatal lineage (MMC fate) and asymmetric entry divisions. The family-level
      process is better and more accurately expressed for EPF2 by its regulatory role, negative regulation
      of stomatal complex development. The IBA is not wrong about the family being stomatal regulators,
      but 'guard cell differentiation' places EPF2 at the wrong step and in the wrong direction.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002104517
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node covers EPF-family peptides; for EPF2 the only experimental evidence is inhibitory
          and acts at stomatal lineage entry, so a positive guard cell differentiation process overstates
          the role.
