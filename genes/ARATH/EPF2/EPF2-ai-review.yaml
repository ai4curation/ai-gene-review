gene_symbol: EPF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: EPIDERMAL PATTERNING FACTOR 2 (EPF2) is a small secreted cysteine-rich peptide hormone of
  the EPF/EPFL family (120-aa precursor with a signal peptide; the mature C-terminal peptide MEPF2 is
  held in a scaffold by three/four disulfide bonds and a functional loop). It is produced by meristemoid
  mother cells (MMCs) and their early stomatal-lineage descendants and acts non-cell-autonomously on neighbouring
  protodermal cells to limit how many cells enter, and remain in, the stomatal lineage. MEPF2 binds directly
  to the leucine-rich-repeat ectodomain of the receptor kinase ERECTA (its principal receptor; ERL1 is
  also bound) in a complex with the receptor-like co-receptor TOO MANY MOUTHS (TMM), and triggers rapid
  activation of the YODA-MKK4/5-MPK3/6 MAP kinase cascade that phosphorylates and destabilizes the stomatal-entry
  bHLH SPEECHLESS. EPF2 is antagonized by the positive peptide stomagen/EPFL9, which competes for the
  same ERECTA-TMM receptor, and is inactivated by cleavage by the CO2-induced secreted protease CRSP.
  Loss of EPF2 produces excess small stomatal-lineage cells and higher stomatal density, whereas overexpression
  nearly abolishes stomata; EPF2 is required for the reduction of stomatal development at elevated CO2.
