suggested_questions:
- question: What is the processed, bioactive form of EPF2 in planta, and which proteases (besides CRSP,
    which inactivates it) generate or degrade MEPF2 in the apoplast?
- question: How does EPF2 binding to the ERECTA-TMM complex recruit SERK co-receptors and activate the
    receptor kinase, given that stomagen binds the same receptor without activating MAPKs?
suggested_experiments:
- description: Quantify in-planta MEPF2 levels and processing (e.g. targeted peptidomics of apoplastic
    fluid) in wild type, crsp and elevated-CO2 conditions to link CO2-dependent EPF2 abundance to ERECTA
    signalling output.
  experiment_type: peptidomics / mass spectrometry
