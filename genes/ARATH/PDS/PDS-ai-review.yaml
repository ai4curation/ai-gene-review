id: Q07356
gene_symbol: PDS
product_type: PROTEIN
aliases:
- PDS3
- AT4G14210
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PDS (15-cis-phytoene desaturase, EC 1.3.5.5; also PDS3, locus At4g14210) is a
  nuclear-encoded, plastid-targeted FAD-containing flavoenzyme that performs the
  first of the two desaturation steps of the plant/cyanobacterial poly-cis
  carotene-desaturation route (PDS -> Z-ISO -> ZDS -> CRTISO) that converts
  15-cis-phytoene into lycopene. PDS introduces two double bonds symmetrically at
  the C-11 and C-11' positions of 15-cis-phytoene, proceeding through the
  intermediate phytofluene, and with concomitant trans-to-cis isomerization of
  the neighbouring C-9 and C-9' double bonds, to yield 9,15,9'-tri-cis-zeta-carotene;
  the two desaturations are coupled to the reduction of two molecules of the
  lipophilic quinone plastoquinone, so the enzyme is a quinone-dependent
  oxidoreductase acting on the CH-CH group. Its tri-cis-zeta-carotene product is
  subsequently isomerized by Z-ISO and further desaturated by ZDS, and the
  resulting poly-cis-lycopene is isomerized to all-trans-lycopene by CRTISO
  before ring cyclization. The protein carries an N-terminal transit peptide and
  functions as a peripheral-membrane enzyme of plastid membranes, localizing to
  the chloroplast (including the chloroplast envelope and thylakoid) and to the
  chromoplast, and it forms a homotetramer. PDS catalyses one of the earliest and
  rate-influencing steps of carotenoid biosynthesis and is the molecular target
  of the bleaching herbicides norflurazon and fluridone, which compete at its
  quinone-binding site.
