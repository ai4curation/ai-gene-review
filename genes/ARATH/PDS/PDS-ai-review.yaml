suggested_questions:
- question: >-
    What is the physiological electron acceptor and the sub-plastidial membrane environment of
    Arabidopsis PDS in vivo? The reaction uses plastoquinone in vitro, but whether PDS feeds
    electrons into the photosynthetic plastoquinone pool (via the plastid terminal oxidase to
    reoxidize plastoquinol) and whether it acts predominantly at the envelope or the thylakoid
    is not resolved.
  experts:
  - Peter Beyer
  - Barry J. Pogson
- question: >-
    Does Arabidopsis PDS3 have functions or phenotypes beyond its catalytic step - for example
    in plastid development or apocarotenoid-mediated retrograde signalling - that are
    separable from the loss of downstream carotenoids, and are these attributable to
    accumulated phytoene/phytofluene substrates rather than to the enzyme itself?
  experts:
  - Manuel Rodríguez-Concepción
suggested_experiments:
- hypothesis: >-
    Arabidopsis PDS is a plastoquinone-dependent desaturase that acts on 15-cis-phytoene and
    produces 9,15,9'-tri-cis-zeta-carotene via phytofluene, and is inhibited at its quinone
    site by norflurazon/fluridone.
  description: >-
    Express and purify mature His-tagged Arabidopsis PDS, reconstitute in
    plastoquinone-loaded liposomes, and assay against 15-cis-phytoene, following intermediates
    (phytofluene) and product (tri-cis-zeta-carotene) by C30 reversed-phase HPLC-PDA/MS; test
    decyl-plastoquinone versus decyl-ubiquinone as acceptor and measure competitive inhibition
    by norflurazon and fluridone at the quinone-binding region.
  experiment_type: in vitro enzyme assay with purified recombinant protein
- hypothesis: >-
    PDS resides in the chloroplast envelope/thylakoid membranes and its cytosolic detection
    reflects the pre-import precursor rather than a functional cytosolic pool.
  description: >-
    Localize a native-promoter PDS-GFP fusion (complementing a pds3 mutant) by confocal
    imaging and by immunoblot of purified envelope/stroma/thylakoid fractions; combine with
    pulse-chase import assays into isolated chloroplasts to test whether the cytosolic signal
    corresponds to unprocessed precursor.
  experiment_type: subcellular localization plus in vitro chloroplast import assay
