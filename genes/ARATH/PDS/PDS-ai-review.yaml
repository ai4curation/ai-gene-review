core_functions:
- description: >-
    15-cis-phytoene desaturase (phytoene dehydrogenase) activity: introduces two double bonds
    at the C-11 and C-11' positions of 15-cis-phytoene, via phytofluene, with concomitant
    trans-to-cis isomerization of the neighbouring C-9 and C-9' bonds, to give
    9,15,9'-tri-cis-zeta-carotene, coupled to reduction of two molecules of the lipophilic
    quinone plastoquinone. Membrane-associated, FAD-containing plastid enzyme performing the
    first desaturation of the poly-cis carotene desaturation route.
