  review:
    summary: >-
      High-throughput protein-correlation-profiling (size-exclusion chromatography plus
      LC/MS) of Arabidopsis leaf fractions detected PDS in the cytosolic pool. The same
      study explicitly reports that many proteins are dual-localized and partition between
      cytosolic and membrane-associated pools.
    action: KEEP_AS_NON_CORE
