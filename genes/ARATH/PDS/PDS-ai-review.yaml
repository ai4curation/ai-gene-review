- term:
    id: GO:1901177
    label: lycopene biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:9914519
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. Reconstitution of the plant poly-cis desaturation pathway in
      E. coli (GGPP synthase, phytoene synthase, PDS and ZDS) yields pro-lycopene as the main
      end product; PDS performs the first two of the four desaturations required to convert
      phytoene to lycopene, and UniProt curates PDS in the "lycopene biosynthesis" pathway.
    action: NEW
    reason: >-
      PDS does part of the work of lycopene biosynthesis (it catalyses two committed
      desaturations of the phytoene-to-lycopene route), so it participates in the process
      rather than merely being required for it. Comparator check: its sibling desaturase ZDS,
      standing in the same role in the same pathway and characterized in the same paper,
      carries GO:1901177 (IDA); PDS is not annotated to it, which is a genuine gap. Both the
      participation and comparator tests are satisfied. Proposed conservatively as a
      well-grounded process term already curated for the downstream partner.
    supported_by:
    - reference_id: PMID:9914519
      supporting_text: >-
        We show that pro-lycopene (7,9,7',9'-tetra-cis)-lycopene is the main end product of
        the plant desaturation pathway in these cells.
      reference_section_type: ABSTRACT
    - reference_id: file:ARATH/PDS/PDS-uniprot.txt
      supporting_text: 'PATHWAY: Carotenoid biosynthesis; lycopene biosynthesis.'
