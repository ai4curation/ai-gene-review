- id: PMID:9914519
  title: Two Arabidopsis thaliana carotene desaturases, phytoene desaturase and zeta-carotene
    desaturase, expressed in Escherichia coli, catalyze a poly-cis pathway to yield
    pro-lycopene.
  findings:
  - statement: >-
      Recombinant Arabidopsis phytoene desaturase and zeta-carotene desaturase, reconstituted
      with GGPP synthase and phytoene synthase in E. coli, produce pro-lycopene
      (7,9,7',9'-tetra-cis-lycopene) as the main end product of the plant poly-cis pathway.
    supporting_text: >-
