core_functions:
- description: >-
    Sequence-specific MADS-domain transcription factor that, at the shoot apex, promotes the vegetative-to-reproductive
    transition (partially redundantly with SOC1, downstream of FT/FD and SPL inputs) and acts redundantly
    with AP1 and CAL to establish floral meristem identity by up-regulating LEAFY and confining TERMINAL
    FLOWER1 to the inflorescence meristem.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  - id: GO:0010228
    label: vegetative to reproductive phase transition of meristem
  - id: GO:0009911
    label: positive regulation of flower development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:10648231
    supporting_text: >-
      Our results suggest that the FUL, AP1 and CAL genes act redundantly to control inflorescence architecture
      by affecting the domains of LFY and TFL1 expression as well as the relative levels of their activities.
  - reference_id: PMID:24465009
    supporting_text: >-
      Our results suggest a prominent role of FUL in promoting reproductive transition when photoinductive
      signalling is suppressed by short-day conditions or by high levels of FLC expression
  - reference_id: PMID:9367440
    supporting_text: >-
      Expression of LEAFY and AGAMOUS-LIKE8 in the shoot apex at the time of floral determination is also
      consistent with genetic data indicating that these genes are involved in the first steps of the
      transition from vegetative to reproductive development.
- description: >-
    Transcription factor in the carpel valves required for valve cell elongation and differentiation,
    and thus for silique (fruit) growth after fertilization.
  molecular_function:
    id: GO:0000981
