id: Q38876
gene_symbol: FUL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  FRUITFULL (FUL; AGL8, At5g60910) is a MIKC-type MADS-domain transcription factor of the SQUAMOSA/AP1
  clade. FUL is induced early at the shoot apex during the floral transition (by FT/FD, miR156-regulated
  SPL factors and other flowering signals) and accumulates in the inflorescence meristem, inflorescence
  stem and cauline leaves, but is excluded from young floral primordia by APETALA1. It promotes the reproductive
  transition partially redundantly with SOC1, and acts redundantly with AP1 and CAULIFLOWER in floral
  meristem identity: ap1 cal ful triple mutants never form flowers because LEAFY is not up-regulated and
  TERMINAL FLOWER1 is ectopically expressed. Later, FUL is expressed in the carpel valves, where it is
  required for valve cell elongation and differentiation and for silique growth; it also regulates stem
  growth and branch angle (for example by repressing SAUR10), and in the inflorescence meristem it directly
  represses APETALA2 and AP2-like genes to bring about the end-of-flowering proliferative arrest. FUL
  binds CArG boxes and forms heterodimers with other MADS proteins such as SOC1, SVP, AGL24 and SEP3.
