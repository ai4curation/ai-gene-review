- term:
    id: GO:0010228
    label: vegetative to reproductive phase transition of meristem
  evidence_type: IGI
  original_reference_id: PMID:24465009
  review:
    summary: >-
      FUL promotes the conversion of the shoot apical meristem from vegetative to reproductive (inflorescence)
      identity, partially redundantly with SOC1.
    action: NEW
    reason: >-
      Genetic analysis of ful soc1 combinations shows FUL acts in the meristem identity transition itself
      (cauline leaf / inflorescence phase), and FUL is among the first genes induced at the apex at floral
      determination. FUL is a transcription factor acting in the meristem, so it performs part of the
      process rather than being a substrate or upstream signal.
    supported_by:
    - reference_id: PMID:24465009
      supporting_text: >-
        suggesting that FUL would have a predominant effect in the control of meristem identity transition
    - reference_id: PMID:9367440
      supporting_text: >-
        Expression of LEAFY and AGAMOUS-LIKE8 in the shoot apex at the time of floral determination is
        also consistent with genetic data indicating that these genes are involved in the first steps
        of the transition from vegetative to reproductive development.
