suggested_questions:
- question: >-
    Which FUL-containing MADS complexes (FUL-SOC1, FUL-SVP, FUL-SEP3) are responsible for LFY up-regulation
    in floral primordia versus AP2 repression at the end of flowering?
suggested_experiments:
- description: >-
    Tissue-specific FUL ChIP-seq in inflorescence apices of soc1 and svp backgrounds to resolve which
    heterodimer partner determines target selection during the floral transition.
