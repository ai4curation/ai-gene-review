# Query loci for the WRKY70 DAP-seq promoter analysis.
# AGI codes are the input; the script re-reads the symbol from the TAIR GAF so that a
# wrong AGI code would show up as a symbol mismatch in the output table.
# category is a grouping label only.
tf_locus: AT3G56400   # WRKY70
genes:
  - {agi: AT1G74710, label: ICS1/SID2, category: SA_biosynthesis}
  - {agi: AT1G18870, label: ICS2, category: SA_biosynthesis}
  - {agi: AT4G39030, label: EDS5, category: SA_biosynthesis}
  - {agi: AT5G13320, label: PBS3, category: SA_biosynthesis}
  - {agi: AT1G73805, label: SARD1, category: SA_biosynthesis_regulator}
  - {agi: AT5G26920, label: CBP60G, category: SA_biosynthesis_regulator}
  - {agi: AT3G48090, label: EDS1, category: SA_biosynthesis_regulator}
  - {agi: AT3G52430, label: PAD4, category: SA_biosynthesis_regulator}
  - {agi: AT1G64280, label: NPR1, category: SA_signalling}
  - {agi: AT2G14610, label: PR1, category: SA_responsive_marker}
  - {agi: AT3G57260, label: PR2/BGL2, category: SA_responsive_marker}
  - {agi: AT1G75040, label: PR5, category: SA_responsive_marker}
  - {agi: AT5G45890, label: SAG12, category: senescence_marker}
  - {agi: AT2G29350, label: SAG13, category: senescence_marker}
  - {agi: AT4G35770, label: SEN1, category: senescence_marker}
  - {agi: AT5G39610, label: ORE1/NAC092, category: senescence_regulator}
  - {agi: AT3G56400, label: WRKY70, category: self}
  - {agi: AT3G18780, label: ACT2, category: housekeeping_control}

# Curated GO BP gene sets (term + is_a/part_of descendants) used for the enrichment test.
go_sets:
  - {id: "GO:0009751", label: response to salicylic acid}
  - {id: "GO:0009863", label: salicylic acid mediated signaling pathway}
  - {id: "GO:0009697", label: salicylic acid biosynthetic process}
  - {id: "GO:0010150", label: leaf senescence}
  - {id: "GO:0006952", label: defense response}
  - {id: "GO:0015979", label: photosynthesis}
