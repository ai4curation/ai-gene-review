gene_symbol: FPA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FPA is a nuclear RNA-binding protein with RNA recognition motifs and a SPOC domain that regulates
  alternative cleavage and polyadenylation in Arabidopsis. It associates with chromatin near transcribed
  gene ends and controls termination and the production of read-through and chimeric RNAs. FPA promotes
  flowering by limiting FLC expression and also affects the processing of other transcripts, including
  immune-receptor genes. Its genetic overlap with FCA contributes to female gametophyte development, while
  their biochemical interactions are distinct.
