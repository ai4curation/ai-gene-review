  label: Arabidopsis thaliana
description: 'FPA is a nuclear spen-family RNA-binding protein with three N-terminal RNA recognition motifs
  (RRMs) and a C-terminal SPOC domain that promotes flowering in Arabidopsis through the autonomous pathway.
  FPA is a trans-acting regulator of RNA 3''-end formation: it promotes cleavage and polyadenylation at
  promoter-proximal or intronic poly(A) sites, thereby controlling alternative polyadenylation, preventing
  transcriptional read-through and chimeric RNA formation, and mediating premature termination of transcripts
  such as those of NLR immune receptor genes. FPA negatively autoregulates its own pre-mRNA processing
  and acts redundantly with FCA to promote proximal polyadenylation of the FLC antisense COOLAIR transcripts,
  which contributes to repression of the floral repressor FLC. FPA does not act as a core component of
  the cleavage and polyadenylation machinery. Together with FCA, FPA is required for silencing at several
  loci and for female gametophyte and early embryo development.'
