core_functions:
- description: Spen-family RRM RNA-binding protein that acts as a trans-acting regulator of poly(A) site
    choice, promoting proximal/premature cleavage and polyadenylation (including COOLAIR at FLC, redundantly
    with FCA), thereby limiting read-through transcription. Through COOLAIR 3'-end formation it acts upstream
    of FLC repression in the autonomous pathway; loss of FPA strongly delays flowering and overexpression
    accelerates flowering.
  molecular_function:
    id: GO:0003723
    label: RNA binding
  directly_involved_in:
  - id: GO:0110104
    label: mRNA alternative polyadenylation
  - id: GO:0009911
    label: positive regulation of flower development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:24204292
    supporting_text: The Arabidopsis thaliana protein FPA is a rare example of a trans-acting regulator
      of poly(A) site choice.
  - reference_id: PMID:20079695
    supporting_text: We show that FPA functions redundantly with FCA, another RNA binding protein that
      controls flowering and RNA silencing, to control the expression of alternatively polyadenylated
      antisense RNAs at the locus encoding the floral repressor FLC.
  - reference_id: PMID:11402170
    supporting_text: FPA is a gene that regulates flowering time in Arabidopsis via a pathway that is
      independent of daylength (the autonomous pathway).
  - reference_id: PMID:11402170
    supporting_text: Overexpression of FPA in Arabidopsis causes early flowering in noninductive short
      days and creates plants that exhibit a more day-neutral flowering behavior.
  - reference_id: PMID:20079695
    supporting_text: The spen family protein FPA is required for flowering time control and has been implicated
      in RNA silencing.
suggested_questions:
- question: How does FPA, which is not a stable component of CPSF/CstF, recruit or activate the cleavage
    and polyadenylation machinery at proximal sites, and is its SPOC domain the key interaction module
    (e.g. with RNA Pol II CTD or 3'-end factors)?
suggested_experiments:
- description: Proximity labelling (TurboID-FPA) and SPOC-domain mutants combined with Nanopore direct
    RNA sequencing to identify the partners required for FPA-dependent proximal polyadenylation.
  hypothesis: The FPA SPOC domain recruits 3'-end processing/termination factors to nascent transcripts.
  experiment_type: Proximity proteomics / direct RNA sequencing
