- term:
    id: GO:0005829
    label: cytosol
  evidence_type: RCA
  original_reference_id: PMID:21166475
  qualifier: located_in
  negated: true
  review:
    summary: SIR is a plastid-stromal enzyme and not a cytosolic protein; the NOT-cytosol assertion is
      consistent with all target-specific localization evidence.
    action: ACCEPT
    reason: The curator assigned NOT cytosol from the Arabidopsis cytosolic-proteome study (PMID:21166475),
      whose purpose was to define proteins that are not targeted to organelles. Every independent
      target-specific observation places SIR in the plastid. Full-length AtSiR-YFP is mainly stromal in
      stable lines (PMID:27189994), and SIR is detected in the chloroplast stroma proteome (UniProt,
      PMID:18431481). No study reports a cytosolic SIR isoform or alternative translation start; the
      single gene encodes a transit-peptide-bearing precursor. The negative claim is accepted, consistent
      with the NOT-cytosol rows for other plastid enzymes from this study in sibling reviews (GLO1, GGAT1,
      PGLP1). Fluorescence imaging cannot exclude a trace cytosolic pool, but no evidence for one exists.
    supported_by:
    - *id001
    - reference_id: PMID:21166475
      supporting_text: defines an experimental set of plant protein sequences that are not targeted to
        subcellular locations following translation and folding
    - reference_id: file:ARATH/SIR/SIR-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: Plastid, chloroplast stroma {ECO:0000269|PubMed:18431481}.
