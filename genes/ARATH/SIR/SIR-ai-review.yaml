- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:O23813
  review:
    summary: DNA binding is a demonstrated property of pea and maize sulfite reductases, but its transfer
      to Arabidopsis SIR over-annotates a nucleoid-compaction role that AtSiR does not show in vivo.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ISS rows transfer DNA binding from the pea (O23813) and maize (Q9AWB2) enzymes. Maize SiR
      binds DNA in vitro even though it is not preferentially nucleoid-localized, so some DNA affinity may
      be a conserved property of plant sulfite reductases and the term is not judged false. In pea, DNA
      binding underlies nucleoid compaction, and nucleoid-type SiRs carry a C-terminal peptide predicted
      to form a ribbon-helix-helix DNA-binding motif that the non-nucleoid land-plant SiRs, including
      AtSiR, lack. AtSiR-YFP is mainly stromal and not nucleoid-associated, and no DNA-binding assay has
      been reported for the Arabidopsis protein. DNA binding is therefore an untested, peripheral
      transfer for this gene, not part of its sulfite-reductase function. The residual question is
      recorded as a knowledge gap with a proposed direct assay.
    supported_by:
    - &id001
      reference_id: PMID:27189994
      supporting_text: The DAPI staining of isolated cps showed that AtSiR-YFP is not preferentially colocalized
        with cp nucleoids, indicating that AtSiR is mainly localized to the stroma
    - &id002
      reference_id: PMID:17371503
      supporting_text: ZmSiR does indeed have DNA-binding activity
