  review:
    summary: SIR catalyzes the sulfite-to-sulfide step of sulfate assimilation.
    action: ACCEPT
    reason: Native reduction of SIR activity strongly reduces sulfur flux into cysteine, glutathione and
      protein; the enzyme itself performs the reduction step.
    supported_by:
    - &id003
      reference_id: PMID:23221833
      supporting_text: 'Plant sulfite reductase (SiR; Enzyme Commission 1.8.7.1) catalyzes the reduction

        of sulfite to sulfide in the reductive sulfate assimilation pathway.'
    - &id004
      reference_id: PMID:20424176
      supporting_text: 'The 28-fold decrease of

        incorporation of (35)S label into Cys, glutathione, and protein in sir1-1 showed

        that the decreased activity of SiR generated a severe bottleneck in the

        assimilatory sulfate reduction pathway.'
- term:
