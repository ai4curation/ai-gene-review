    label: DNA binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:O23813
  review:
    summary: DNA binding cannot be settled solely from the loss of nucleoid localization.
    action: UNDECIDED
    reason: The manual transfer derives from pea SiR. Arabidopsis lacks the C-terminal extension associated
      with nucleoid localization, and direct AtSiR-YFP imaging is predominantly stromal. However, the
      maize comparator still binds DNA despite lacking preferential nucleoid localization. The target-specific
      DNA-affinity claim therefore remains unresolved; localization divergence does not prove no DNA contact.
