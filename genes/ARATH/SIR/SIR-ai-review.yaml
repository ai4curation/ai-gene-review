    label: copper ion binding
  evidence_type: HDA
  original_reference_id: PMID:20018591
  qualifier: enables
  review:
    summary: Retention on Cu2+-IMAC resin in a mitochondrial metal-affinity proteomic screen; not a
      physiological copper-binding function of a siroheme/[4Fe-4S] enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:20018591 captured proteins from Arabidopsis mitochondrial extracts on immobilized-metal
      affinity resin. The curator's identification of SIR in that screen is not disputed, but retention
      on Cu2+-IMAC reflects surface histidine or cysteine affinity for an immobilized ion, not a copper
      cofactor or a copper-dependent activity. The authors themselves treat IMAC binding as an in vitro
      proxy for susceptibility to metal-induced damage. SIR's cofactors are siroheme and a [4Fe-4S]
      cluster. The same judgement is applied to the other proteins annotated from this screen in sibling
      reviews (mtLPD1, mtLPD2, CAT2).
