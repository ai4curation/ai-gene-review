- term:
    id: GO:0010319
    label: stromule
  evidence_type: IDA
  original_reference_id: PMID:16923014
  qualifier: located_in
  review:
    summary: The paper measured the stromal fraction of isolated chloroplasts; stromule is a mapping of
      that fraction, and the location the evidence supports is chloroplast stroma.
    action: MODIFY
    reason: PMID:16923014 fractionated isolated chloroplasts into stroma and lumen and compared them by
      DIGE. Stromules cannot be separated from bulk stroma by that fractionation, and the abstract does
      not mention them. As documented in the RCA review, TAIR applied this IDA stromule annotation to
      all proteins curated from the paper, including peroxisomal and mitochondrial ones, so the term
      records the stromal fraction rather than an observation of stromules. A stromal protein will also
      occupy stromules, which are stroma-filled, so the claim is not false. The supported location is
      chloroplast stroma (GO:0009570), which SIR already carries from imaging and stromal proteomics.
    proposed_replacement_terms:
    - id: GO:0009570
      label: chloroplast stroma
    supported_by:
    - reference_id: PMID:16923014
      supporting_text: To understand how the stroma and the lumen proteomes adapt to low temperatures,
        we have taken a proteomic approach (difference gel electrophoresis)
    - *id001
