- id: PMID:26920048
  title: Structural and mutational studies of an electron transfer complex of maize sulfite reductase
    and ferredoxin.
  findings:
  - statement: Maize SiR–ferredoxin co-crystals and interface mutants provide comparative plant evidence
      for Fd-dependent activity; these are not Arabidopsis pairing experiments.
    supporting_text: 'Mutational analysis of a total of seven basic residues of SiR distributed widely

      at the interface of the complex showed their importance for supporting an

      efficient Fd-dependent activity and a strong physical binding to Fd.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract explicitly reports maize co-crystals, binding and Fd-dependent activity. Used
      as comparative plant donor evidence only; not a native Arabidopsis assay.
