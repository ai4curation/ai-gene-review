  review:
    summary: A change in stromal SIR abundance during cold acclimation is an expression response, not
      evidence that SIR participates in the cold response.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:16923014 compared stromal and lumenal proteomes by DIGE during cold shock and short- and
      long-term acclimation, and the TAIR curator recorded SIR among the proteins whose abundance changed
      (IEP). That observation is not disputed. But an abundance change of a sulfate-assimilation enzyme
      during acclimation shows that its level responds to cold, not that SIR performs any step of the
      cold response; no cold-related phenotype of sir mutants is reported. The same IEP set from this
      paper is treated as over-annotation in sibling reviews (CAT2, SHM1).
