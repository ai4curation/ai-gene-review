id: Q9LZ66
gene_symbol: SIR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SIR (At5g04590) is the plastid siroheme/[4Fe-4S] sulfite reductase that converts sulfite
  to sulfide for assimilatory sulfur metabolism. Reducing its activity limits sulfur flux and growth,
  while altered expression also changes resistance to excess sulfite. The enzyme is assigned to the ferredoxin-dependent
  class and is predominantly stromal. Unlike pea and bean sulfite reductases, native Arabidopsis SIR lacks
  preferential chloroplast-nucleoid localization in the tested imaging experiments.
