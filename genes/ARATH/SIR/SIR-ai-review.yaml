    label: chloroplast envelope
  evidence_type: HDA
  original_reference_id: PMID:12938931
  qualifier: located_in
  review:
    summary: Detection of a soluble stromal enzyme in a "mixed" chloroplast envelope preparation; the
      envelope is not a functional location of SIR.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:12938931 identified 392 proteins in "mixed" envelope fractions prepared on sucrose step
      gradients. The detection of SIR in that preparation is not disputed. SIR has no transmembrane
      segment or envelope-targeting signal, full-length AtSiR-YFP is diffusely stromal
      (PMID:27189994), and no envelope-associated role is known; abundant stromal enzymes routinely
      co-purify with envelope membranes. The envelope term therefore over-annotates a soluble stromal
      protein, as judged for other stromal enzymes from this proteome in sibling reviews (GLDP1, GLN2,
      GLU1).
    supported_by:
    - reference_id: PMID:12938931
      supporting_text: '"mixed" envelopes were subsequently isolated using sucrose step

        gradients'
