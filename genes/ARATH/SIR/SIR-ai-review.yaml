- term:
    id: GO:0050311
    label: sulfite reductase (ferredoxin) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G04590
  - PANTHER:PTN008519198
  - UniProtKB:O23813
  review:
    summary: SIR is the ferredoxin-type assimilatory sulfite reductase.
    action: ACCEPT
    reason: Native Arabidopsis perturbation and sulfite-turnover assays establish the catalytic role.
      The donor class is supported by conserved plant enzyme architecture and curated function; reduced-methyl-viologen
      assays should not be recast as direct native ferredoxin-pairing experiments. Independent maize SiR–Fd
      co-crystals and interface mutants (PMID:26920048) provide primary comparative support for the plant
      donor class.
    supported_by:
    - *id003
    - *id004
    - &id005
      reference_id: PMID:26920048
      supporting_text: 'Mutational analysis of a total of seven basic residues of SiR distributed widely

        at the interface of the complex showed their importance for supporting an

        efficient Fd-dependent activity and a strong physical binding to Fd.'
