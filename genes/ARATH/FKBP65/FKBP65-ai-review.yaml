suggested_questions:
- question: Does ROF2 have measurable PPIase activity, and which of its three FKBP domains is catalytic, given that
    only FKBD1 of ROF1 is active?
- question: Is the PPIase activity required for ROF2's repression of HsfA2-dependent small-HSP transcription, or does
    ROF2 act purely as a scaffold through ROF1 heterodimerisation?
- question: How does ROF2 overexpression activate K+ uptake during intracellular acid stress, and is this linked to
    its nuclear role?
- question: Should GO add a "negative regulation of cellular heat acclimation" term to capture ROF2-type modulators
    of acquired thermotolerance?
suggested_experiments:
- description: Assay recombinant ROF2 and FKBD point mutants for PPIase activity (chymotrypsin-coupled assay with FK506
    inhibition), and test whether PPIase-dead ROF2 complements the rof2 thermotolerance and sHSP phenotypes.
- description: Co-immunoprecipitate ROF2 from heat-stressed rof1 and wild-type nuclei to test whether its association
    with HSP90.1-HsfA2 requires ROF1, and ChIP HsfA2 at sHSP promoters in rof2 versus wild type.
