core_functions:
- description: FKBP-type peptidyl-prolyl cis-trans isomerase and TPR co-chaperone that heterodimerises with ROF1/FKBP62
    and, after heat stress, moves to the nucleus where it acts as a negative feedback modulator of the HsfA2-driven
    small-HSP response during acquired thermotolerance.
  molecular_function:
    id: GO:0003755
    label: peptidyl-prolyl cis-trans isomerase activity
  directly_involved_in:
