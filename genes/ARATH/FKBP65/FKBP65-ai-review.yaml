gene_symbol: FKBP65
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FKBP65 (ROF2, ROTAMASE FKBP 2; At5g48570) is a large multidomain FK506-binding protein of Arabidopsis
  thaliana with three FKBP-type peptidyl-prolyl cis-trans isomerase (PPIase) domains, a tetratricopeptide repeat
  (TPR) domain and a predicted C-terminal calmodulin-binding region. It is closely related (85% identity) to ROF1/FKBP62,
  with which it forms heterodimers. ROF2 is a bona fide heat-stress protein, undetectable at normal temperature and
  induced by heat in an HsfA2-dependent manner; after heat stress it relocates from the cytoplasm to the nucleus.
  Unlike ROF1, which supports HsfA2-driven expression of small heat shock proteins during acquired thermotolerance,
  ROF2 acts as a negative feedback modulator - via its ROF1 partner it is proposed to join the ROF1-HSP90.1-HsfA2
  complex and dampen small-HSP transcription, so rof2 knockouts are more heat tolerant. ROF2 is also induced by intracellular
  acidification and by Pseudomonas syringae infection, and loss- and gain-of-function lines affect acid tolerance
  (through enhanced K+ uptake and indirect activation of the plasma membrane H+-ATPase), callose deposition and bacterial
  resistance, although the molecular basis of these effects is unknown.
