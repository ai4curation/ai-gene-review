  review:
    summary: YODA acts as a negative switch on stomatal fate in the epidermis.
    action: NEW
    reason: Loss of YODA yields excess clustered stomata and constitutive activation eliminates them;
      MPK3/6 downstream of YODA phosphorylate SPEECHLESS. This replaces stomatal complex morphogenesis.
    supported_by:
    - reference_id: PMID:15178800
      supporting_text: Null mutations in YODA lead to excess stomata, whereas constitutive activation
        of YODA eliminated stomata.
    - reference_id: PMID:19008449
      supporting_text: We found that a unique domain in a basic helix-loop-helix (bHLH) stomatal initiating
        factor, SPEECHLESS, renders it a MAPK phosphorylation target in vitro and modulates its function
        in vivo.
