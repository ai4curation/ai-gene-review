- description: Relays EPF-ERECTA signalling in the leaf epidermis to repress stomatal lineage entry and
    enforce spacing (via MPK3/6-mediated SPEECHLESS phosphorylation), acting in a BASL-polarized cortical
    module during asymmetric division.
  molecular_function:
    id: GO:0004709
    label: MAP kinase kinase kinase activity
