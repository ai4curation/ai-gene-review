gene_symbol: YDA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: YODA (YDA; MAPKKK4) is a large Raf-like/MEKK-type mitogen-activated protein kinase kinase
  kinase with an N-terminal autoinhibitory regulatory domain, a central Ser/Thr kinase domain and a C-terminal
  extension. It is the MAPKKK that relays signals from cell-surface receptors to the MKK4/MKK5-MPK3/MPK6
  module during development. In the leaf epidermis YODA acts downstream of the EPF2/EPF1 peptides perceived
  by ERECTA-family receptor kinases with TMM and SERK co-receptors, phosphorylating and activating MKK4/MKK5,
  whose targets MPK3/MPK6 phosphorylate and destabilize the bHLH transcription factor SPEECHLESS and its
  partner SCREAM, thereby repressing stomatal lineage entry and enforcing stomatal spacing; null yda mutants
  form epidermes composed almost entirely of clustered stomata, while constitutively active YODA eliminates
  stomata. YODA is recruited to the cell cortex of asymmetrically dividing stomatal precursors by the
  polarity scaffold BASL, forming a polarized BASL-YODA-MPK3/6 feedback module, and is inhibited by the
  brassinosteroid-regulated GSK3 kinase BIN2. The same cascade controls elongation of the zygote and extra-embryonic
  suspensor fate downstream of SHORT SUSPENSOR, and inflorescence architecture downstream of ERECTA.
