    label: negative regulation of stomatal complex development
  locations:
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:15178800
    supporting_text: Null mutations in YODA lead to excess stomata, whereas constitutive activation of
      YODA eliminated stomata.
  - reference_id: PMID:25843888
    supporting_text: Phosphorylated BASL functions as a scaffold and recruits the MAPKKK YODA and MPK3/6
      to spatially concentrate signaling at the cortex.
- description: Promotes zygote elongation and extra-embryonic suspensor fate in the early embryo as part
    of a MAP kinase switch.
  molecular_function:
    id: GO:0004709
    label: MAP kinase kinase kinase activity
  directly_involved_in:
  - id: GO:0010098
    label: suspensor development
  supported_by:
  - reference_id: PMID:14718171
    supporting_text: Our results imply that a MAP kinase cascade acts as a molecular switch promoting
      extra-embryonic fate.
suggested_questions:
- question: How is YODA activated by ERECTA-family receptors - is there a receptor-associated kinase (e.g.
    BSK/SSP-like) that relieves YODA N-terminal autoinhibition in the epidermis, as SSP does in the zygote?
- question: How is signalling specificity maintained when the same YDA-MKK4/5-MPK3/6 module controls stomatal
    fate, embryo patterning, inflorescence growth and immunity-related outputs?
suggested_experiments:
- description: Identify YODA-activating partners in stomatal lineage cells by proximity labelling (TurboID-YDA)
    with and without EPF2 treatment, followed by genetic tests of candidate BSK-family kinases.
  experiment_type: proximity proteomics / genetics
