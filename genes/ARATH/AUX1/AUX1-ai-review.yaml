- term:
    id: GO:0015293
    label: symporter activity
  evidence_type: IEA
  original_reference_id: PMID:18614710
  qualifier: enables
  review:
    summary: AUX1 mediates proton-coupled auxin uptake; exact coupling stoichiometry is not assigned.
    action: NEW
    reason: Retain the inherited proposal for proton-coupled symport as a distinct coupling property of
      auxin uptake. The oocyte assay establishes pH-dependent IAA influx, and the 2025 structures, pH-dependent
      binding and His249 mutagenesis support the coupling model. PMID:40720658 treats His249 protonation
      as a mechanistic model; it does not measure an integer H+:IAA stoichiometry.
    supported_by:
    - reference_id: PMID:16677815
      supporting_text: Upon expression of AUX1 in Xenopus oocytes, saturable, pH-dependent uptake of 3H-IAA
        was measured.
    - reference_id: PMID:40720658
      supporting_text: These findings support a model where protonation and deprotonation of the Nδ1 atom
        of His249 are coupled to the binding and release of IAA, respectively.
