- term:
    id: GO:0010311
    label: lateral root formation
  evidence_type: IGI
  original_reference_id: PMID:18622388
  qualifier: acts_upstream_of_or_within
  review:
    summary: AUX1 functions with its paralog LAX3 in auxin influx that promotes lateral root development;
