      label: plasma membrane
    supported_by:
    - reference_id: PMID:11641271
      supporting_text: AUX1, asymmetrically localized to the plasma membrane of root protophloem cells,
        is proposed to promote the acropetal, post-phloem movement of auxin to the root apex.
- term:
    id: GO:0005768
    label: endosome
  evidence_type: IDA
  original_reference_id: PMID:17114355
  qualifier: located_in
  review:
    summary: Live-cell imaging shows AUX1 resides at the apical plasma membrane and at highly dynamic
