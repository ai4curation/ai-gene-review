- term:
    id: GO:0009926
    label: auxin polar transport
  evidence_type: TAS
  original_reference_id: PMID:16839804
  qualifier: acts_upstream_of_or_within
  review:
    summary: AUX1 is one of the carrier proteins that mediate carrier-based polar auxin transport, contributing
      the influx (uptake) component alongside PIN efflux carriers. The review (TAS) places AUX1 within
      the polar auxin transport system that establishes directional auxin fluxes in the root apex.
    action: ACCEPT
    reason: The auxin import activity of AUX1 is an integral part of carrier-mediated polar auxin transport;
