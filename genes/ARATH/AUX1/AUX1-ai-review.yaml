- term:
    id: GO:0009958
    label: positive gravitropism
  evidence_type: IMP
  original_reference_id: PMID:8688077
  qualifier: acts_upstream_of_or_within
  review:
    summary: aux1 mutations abolish root gravitropic curvature and confer auxin-resistant root growth;
      AUX1 is expressed in root apical tissues that regulate gravitropic curvature. AUX1-facilitated auxin
      uptake into distal elongation zone tissues is required for the differential growth underlying root
      gravitropism.
    action: ACCEPT
    reason: Strong mutant-phenotype evidence establishes that AUX1 is required for root (positive) gravitropism,
      the phenotype for which the gene was named. This is a well-characterized, biologically central output
      of AUX1 auxin transport and is appropriately retained as a core process annotation.
    supported_by:
    - reference_id: PMID:8688077
