proposed_new_terms:
- proposed_name: auxin:proton symporter activity
  proposed_definition: Enables the transfer of auxin (indole-3-acetic acid) from one side of a membrane
    to the other, coupled to the transport of a proton in the same direction, driven by the transmembrane
    proton-motive force.
  proposed_parent:
    id: GO:0015293
    label: symporter activity
  justification: AUX1 mediates proton-driven, pH-dependent auxin uptake and AUX/LAX proteins act as IAA-H+
    symporters; a substrate-specific symporter term would capture both the mechanism (proton coupling)
    and the substrate (auxin), which neither GO:0010328 (substrate-specific, mechanism-agnostic) nor GO:0015293
    (mechanism only) fully expresses.
  supported_by:
  - reference_id: PMID:18614710
    supporting_text: Members of the AUX/LAX family of membrane transporters, conserved in all higher plant
      species, are believed to act as IAA-H + symporters.
suggested_questions:
