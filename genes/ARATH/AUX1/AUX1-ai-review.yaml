id: Q96247
gene_symbol: AUX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: AUX1 is a plasma-membrane auxin influx carrier of the AUX1/LAX branch of the amino acid/auxin
  permease superfamily. It imports indole-3-acetic acid through a proton-coupled mechanism and binds auxin
  in a central pocket of an 11-transmembrane-helix, monomeric LeuT-fold architecture. Polar and tissue-specific
  AUX1 distribution supports auxin delivery through the root apex and epidermis, root gravitropism, lateral-root
  development and root-hair positioning. AUX1 traffics through intracellular membrane compartments and
  acts redundantly with LAX carriers in some developmental and nematode-infection contexts. His249 is
  implicated in substrate binding, release and proton coupling; a fixed proton-to-auxin stoichiometry
  has not been established by the structural studies.
existing_annotations:
- term:
    id: GO:0003333
    label: amino acid transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: Amino-acid substrate assignment remains unresolved for AUX1.
    action: UNDECIDED
    reason: AUX1 is an AAAP-family carrier with directly demonstrated IAA uptake. The recovered 2025 target
      structures and uptake assays establish auxin recognition but do not test and exclude amino-acid
      turnover. Neither broad family membership nor preference for IAA settles this separate substrate
      claim. Retain uncertainty rather than inferring loss of amino-acid transport from its auxin role.
    supported_by:
    - reference_id: PMID:40720658
      supporting_text: These results confirm AUX1 as a direct mediator of active auxin influx.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: AUX1 is a multi-pass integral plasma membrane protein, established by experimental localization
      in root cells. This UniProt subcellular-location mapping is consistent with the curated Cell membrane
      location.
    action: ACCEPT
    reason: Plasma membrane localization is well supported experimentally (PMID 11641271, PMID 16690816,
      PMID 17114355) and is the functional compartment where AUX1 imports auxin. The IEA mapping is correct.
    supported_by:
    - reference_id: PMID:11641271
      supporting_text: AUX1, asymmetrically localized to the plasma membrane of root protophloem cells,
