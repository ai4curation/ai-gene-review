- term:
    id: GO:0009986
    label: cell surface
  evidence_type: IDA
  original_reference_id: PMID:11641271
  qualifier: located_in
  review:
    summary: AUX1 is an integral plasma membrane protein, asymmetrically localized to the plasma membrane
      of root protophloem cells. The cited study establishes plasma membrane localization; cell surface
      (GO:0009986) is a less precise rendering of the curated plasma membrane location.
    action: MODIFY
    reason: The experimental evidence supports plasma membrane localization rather than the more generic/loosely
      defined cell surface term. GO:0009986 (cell surface) refers to the external side/region of the cell
      surface and is not the most accurate description of a multi-pass integral membrane transporter.
      Replace with the plasma membrane term that the same data support.
    proposed_replacement_terms:
