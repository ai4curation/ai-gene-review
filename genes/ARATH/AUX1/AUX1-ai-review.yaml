    - reference_id: file:ARATH/AUX1/AUX1-deep-research-falcon.md
      supporting_text: AUX1 localizes to the **plasma membrane** in heterologous expression (EYFP-AUX1
        in oocytes), where it mediates pH-dependent, saturable IAA uptake.
- term:
    id: GO:0060919
    label: auxin import into cell
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: This biological-process term is inferred from the molecular function GO:0010328 (auxin influx
      transmembrane transporter activity) and exactly captures the core role of AUX1 - importing auxin
      (IAA) into cells. It is strongly supported by direct experimental transport data.
    action: ACCEPT
    reason: Auxin import into cells is the defining function of AUX1, demonstrated by saturable pH-dependent
      3H-IAA uptake in AUX1-expressing oocytes and by impaired IAA accumulation in aux1 mutant root apices.
      The inter-ontology inference is biologically accurate and represents a core function.
    supported_by:
    - reference_id: PMID:16677815
      supporting_text: Upon expression of AUX1 in Xenopus oocytes, saturable, pH-dependent uptake of 3H-IAA
        was measured.
    - reference_id: PMID:11641271
      supporting_text: MS analysis shows that IAA accumulation in aux1 mutant root apices is impaired,
        consistent with an AUX1 phloem unloading function.
    - reference_id: file:ARATH/AUX1/AUX1-deep-research-falcon.md
      supporting_text: the dominant **regulated cellular uptake** is via **influx carriers** such as AUX1/LAX
        proteins. Reviews emphasize that AUX1/LAX transporters are **major auxin influx carriers** required
        to establish auxin gradients that drive development.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32612234
  qualifier: enables
  review:
    summary: This generic protein binding annotation derives from a large-scale phytohormone interactome
      screen; the WITH/FROM partner is UniProtKB:Q9FZ33 (AXR4), the ER accessory protein required for
      AUX1 trafficking to the plasma membrane. The term protein binding is uninformative about molecular
      function.
    action: REMOVE
    reason: GO:0005515 protein binding is too generic to convey a meaningful molecular function and is
      discouraged as a core annotation. The biologically relevant interaction (AUX1 with AXR4) reflects
      a chaperone/trafficking relationship rather than the activity of AUX1 itself, and is better represented
      by the trafficking biology described in PMID:16690816 than by a bare binding term.
    supported_by:
    - reference_id: PMID:32612234
      supporting_text: we experimentally generated a systems-level map of the Arabidopsis phytohormone
        signalling network, consisting of more than 2,000 binary protein-protein interactions.
    - reference_id: PMID:16690816
      supporting_text: AXR4 is a previously unidentified accessory protein of the endoplasmic reticulum
        (ER) that regulates localization of AUX1 but not of PIN proteins.
    - reference_id: file:ARATH/AUX1/AUX1-deep-research-falcon.md
      supporting_text: The 2024 study provides biochemical evidence that AXR4 **physically interacts**
        with AUX1 and **reduces AUX1 aggregation in a dose-dependent fashion**, supporting a model in
        which AXR4 functions as an **ER accessory/chaperone-like factor** enabling proper folding/ER exit
        and plasma-membrane targeting of AUX1.
- term:
    id: GO:0010262
    label: somatic embryogenesis
  evidence_type: IEP
  original_reference_id: PMID:36345646
  qualifier: acts_upstream_of_or_within
  review:
    summary: AUX1 (as part of the AUX1/LAX influx carrier system together with PIN efflux carriers) contributes
      to polar auxin transport required for somatic embryo development. This is an auxin-transport-dependent
      developmental process, peripheral to the core transport function of AUX1 and involving redundancy
      with LAX/PIN family members.
    action: KEEP_AS_NON_CORE
    reason: The paper shows that polar auxin transport, with AUX1/LAX influx and PIN1 efflux carriers
      as drivers, is required for the transition of embryonic cells to proembryos and later differentiation.
      This is a legitimate downstream developmental role but is a pleiotropic consequence of AUX1 transport
      activity rather than a core molecular function, and is shared redundantly across the family.
    supported_by:
    - reference_id: PMID:36345646
      supporting_text: polar auxin transport, with AUXIN/LIKE-AUX influx and PIN-FORMED1 efflux carriers
        as important drivers, is required for the transition of embryonic cells to proembryos and, later,
        for correct cell fate specification and differentiation.
- term:
