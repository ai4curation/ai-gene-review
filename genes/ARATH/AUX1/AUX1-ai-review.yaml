        and abolish root gravitropic curvature.
    - reference_id: PMID:11641271
      supporting_text: AUX1 is necessary for root gravitropism by facilitating basipetal auxin transport
        to distal elongation zone tissues.
    - reference_id: file:ARATH/AUX1/AUX1-deep-research-falcon.md
      supporting_text: AUX1 is essential for gravitropism and mediates auxin movement from the **lateral
        root cap to the epidermis of the elongation zone**, enabling differential growth during bending
