- term:
    id: GO:0048829
    label: root cap development
  evidence_type: IMP
  original_reference_id: PMID:19952011
  qualifier: acts_upstream_of_or_within
  review:
    summary: aux1 lax mutants have enlarged radicle root caps with altered columella cell number, size
      and organization, indicating that AUX1/LAX auxin influx carriers act redundantly in establishing
      embryonic root cap cell pattern. AUX1 contributes within this auxin-transport-dependent developmental
      process.
    action: KEEP_AS_NON_CORE
    reason: Mutant phenotype evidence supports a role in root cap / embryonic root organization, but the
      effect is largely redundant within the AUX1/LAX family (strong defects require quadruple mutants)
