- term:
    id: GO:0009624
    label: response to nematode
  evidence_type: HEP
  original_reference_id: PMID:16478044
  qualifier: acts_upstream_of_or_within
  review:
    summary: AUX1 contributes redundantly to the host auxin-transport response during cyst-nematode infection.
    action: KEEP_AS_NON_CORE
    reason: The original expression survey alone does not establish a transport contribution to infection.
      Independent native genetics in PMID:21156858 shows reduced cyst-nematode infectivity in aux1 lax3
      and quadruple influx-carrier mutants, although the aux1 single mutant is unaffected. This supports
      a redundant, contextual role in auxin delivery during feeding-site formation, not direct nematode
      recognition or an AUX1-specific effector interaction.
    supported_by:
    - reference_id: PMID:21156858
      supporting_text: We observed no decrease in H. schachtii infectivity in aux1 and lax3 single mutants.
        However, a decrease was observed in both the aux1lax3 double mutant and the aux1lax1lax2lax3 quadruple
        mutant.
