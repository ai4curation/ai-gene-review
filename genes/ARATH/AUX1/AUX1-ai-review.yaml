- term:
    id: GO:0010328
    label: auxin influx transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:16677815
  qualifier: enables
  review:
    summary: Heterologous expression of AUX1 in Xenopus oocytes confers saturable, pH-dependent high-affinity
      3H-IAA uptake that is reduced by 2,4-D and 1-NOA and by mutations that abrogate AUX1 function in
      planta. This directly demonstrates that AUX1 is an auxin influx transmembrane transporter and is
      the core molecular function.
    action: ACCEPT
    reason: This is the central, experimentally validated molecular function of AUX1. Direct transport
      assays in a heterologous system, plus the genotype-phenotype concordance of transport-abrogating
      mutations, provide strong IDA support. Represents the core function of the gene.
    supported_by:
    - reference_id: PMID:16677815
      supporting_text: Mutations in AUX1 that abrogate physiological responses to IAA in planta resulted
        in loss or reduction of 3H-IAA uptake in AUX1-expressing oocytes.
    - reference_id: PMID:16677815
      supporting_text: The measured Km for AUX1-mediated uptake of 3H-IAA was at concentrations at which
        physiological responses are observed for exogenously added IAA and 2,4-D.
    - reference_id: file:ARATH/AUX1/AUX1-deep-research-falcon.md
      supporting_text: Direct functional evidence from heterologous expression in **Xenopus oocytes**
        demonstrates that AUX1 transports **IAA** with high affinity and saturable kinetics.
