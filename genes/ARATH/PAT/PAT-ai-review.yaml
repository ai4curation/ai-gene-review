id: Q9SIE1
gene_symbol: PAT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: PAT is a plastid class-Ib aminotransferase that catalyzes both aspartate/2-oxoglutarate transamination
  and formation of arogenate from prephenate using aspartate or glutamate as amino donor. These pyridoxal-phosphate-dependent
  activities connect central nitrogen metabolism with the arogenate route of aromatic amino-acid biosynthesis.
  The gene is also known as AAT or MEE17.
