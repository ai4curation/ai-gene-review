- term:
    id: GO:1901592
    label: negative regulation of double-strand break repair via break-induced replication
  evidence_type: IMP
  original_reference_id: PMID:20551348
  qualifier: involved_in
  review:
    summary: Whirly proteins, including plastid WHY1, suppress the error-prone microhomology-mediated break-induced
      replication pathway in organelles.
    action: NEW
    reason: 'why1 why3 plastids accumulate microhomology-mediated rearrangements after ciprofloxacin-induced breaks.
      WHY1 does part of the work: it binds the resected ssDNA and, by the structural mechanism, renders it unavailable
      for duplex formation at microhomologies. This is the specific regulatory role behind the generic DNA repair
      rows. The comparator, plastid RECA1/POLIB loss, also gives rearrangements, but WHY1 is the ssDNA-binding protein
      that physically sequesters the substrate.'
    additional_reference_ids:
    - PMID:19666500
    - PMID:21911368
    supported_by:
    - *id013
    - *id002
    - reference_id: PMID:19666500
      supporting_text: Here, we report that the plastid-localized Whirly ssDNA-binding proteins are required for
        plastid genome stability in Arabidopsis.
      reference_section_type: ABSTRACT
