id: Q9M9S3
gene_symbol: WHY1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: WHY1 (WHIRLY1, PTAC1) is a plant-specific Whirly-family single-stranded nucleic-acid-binding protein
  that forms tetramers and acts in two compartments. In chloroplasts it is a component of the plastid nucleoid,
  where it binds single-stranded DNA without sequence specificity and, redundantly with WHY3, maintains plastid
  genome stability by suppressing microhomology-mediated, error-prone repair of DNA double-strand breaks. A nuclear
  pool binds single-stranded telomeric repeats and restrains telomerase, limiting telomere length, and binds promoter
  elements of target genes (AtKP1, WRKY53, and senescence and flowering genes), repressing them partly by recruiting
  the histone deacetylase HDA15. WHY1 also associates with RNA, is required for full salicylic acid-dependent disease
  resistance, and modulates leaf senescence and seed ABA responsiveness, roles thought to reflect plastid-to-nucleus
  communication.
