suggested_questions:
- question: WHY1 binds promoter DNA directly and recruits HDA15; should its nuclear repressor role be annotated
    as DNA-binding transcription repressor activity rather than transcription corepressor activity?
- question: How does WHY1 move from plastids to the nucleus, and is the nuclear pool derived from plastid-imported
    protein or from non-imported precursor?
- question: Does WHY1's RNA binding in chloroplasts serve a defined function (e.g. intron splicing, as for maize
    WHY1), or is it incidental to nucleoid association?
suggested_experiments:
- hypothesis: The nuclear WHY1 pool alone is sufficient to restrain telomerase.
  experiment_type: genetic complementation
  description: Compare telomeric ssDNA binding and telomerase restraint by a nucleus-only (transit-peptide-deleted)
    WHY1 versus full-length WHY1 in why1 to test whether the nuclear pool alone controls telomere length.
- hypothesis: WHY1 accumulates on resected ssDNA at plastid double-strand breaks.
  experiment_type: ChIP-seq
  description: Map WHY1 binding sites on plastid DNA after ciprofloxacin treatment (ChIP-seq) to test whether WHY1
    accumulates at resected break sites and microhomology junctions.
