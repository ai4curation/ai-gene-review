  review:
    summary: Phylogenetic transfer of a DNA-binding transcription factor function from the
      response-regulator family node.
    action: REMOVE
    reason: ARR5 is a type-A ARR that consists essentially of a receiver domain and lacks
      the Myb-related GARP (B-motif) DNA-binding output domain of type-B ARRs; there is no
      evidence that it binds DNA. Type-A ARRs act as negative feedback regulators of the phosphorelay,
      not as DNA-binding transcription factors.
    supported_by:
    - reference_id: PMID:14973166
      supporting_text: double and higher order arr mutants showed progressively increasing
        sensitivity to cytokinin, indicating functional overlap among type-A ARRs and that
        these genes act as negative regulators of cytokinin responses
    - reference_id: PMID:16965536
      supporting_text: Interaction of A-type response regulators with Arabidopsis histidine
        phosphotransfer proteins but not with B-type response regulators suggests that their
        known activity in feedback regulation may be realized by interfering at the level
        of Arabidopsis histidine phosphotransfer protein-mediated signaling.
    propagation_review: &id001
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008123536
        source_label: PTN008123536
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node's IBD is seeded by type-B ARRs (e.g. ARR1 AT3G16857, ARR2 Q9ZWJ9),
          which carry a GARP/B-motif DNA-binding output domain. ARR5 is a 184-residue type-A
          ARR consisting of a receiver domain with a short C-terminal extension and lacks
          the DNA-binding output domain, so the DNA-binding transcription factor function
          does not transfer.
