      to cytokinin, indicating functional overlap among type-A ARRs and that these genes act
      as negative regulators of cytokinin responses
  - reference_id: PMID:11574878
    supporting_text: The cytokinin-inducible ARR4, ARR5, ARR6 and ARR7 genes encode transcription
      repressors that mediate a negative feedback loop in cytokinin signalling.
