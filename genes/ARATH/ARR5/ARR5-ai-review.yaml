core_functions:
- description: ARR5 is a cytokinin-induced type-A response regulator whose receiver domain
    accepts phosphoryl groups from the AHP phosphorelay; phosphorylated ARR5 is stabilized
    and acts as a negative feedback regulator that attenuates cytokinin signaling.
  supported_by:
  - reference_id: PMID:18065689
