id: Q9SB04
gene_symbol: ARR5
product_type: PROTEIN
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'ARR5 (ARABIDOPSIS RESPONSE REGULATOR 5; IBC6, ATRR2) is a type-A response regulator
  of Arabidopsis thaliana. It is a small (184 aa) protein consisting of a two-component receiver
  domain with a conserved phospho-accepting aspartate (Asp87) and a short C-terminal extension,
  without a DNA-binding output domain. ARR5 is a primary cytokinin-response gene: its transcription
  is induced within minutes of cytokinin treatment by type-B ARRs, with highest expression
  in root and shoot apical meristems. ARR5 protein is phosphorylated through the AHK-AHP phosphorelay,
  which is required for its activity and stabilizes the protein in response to cytokinin;
  it is otherwise turned over by the proteasome in an AXR1/RUB-dependent manner. Acting redundantly
  with other type-A ARRs, ARR5 provides negative feedback on cytokinin signaling, probably
  by competing with type-B ARRs for phosphoryl groups from AHPs and through phosphorylation-dependent
  interactions; higher-order type-A arr mutants are hypersensitive to cytokinin and show altered
  red light responses. ARR5 is found in the nucleus and cytoplasm.'
