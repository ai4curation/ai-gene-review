id: Q9LSE2
gene_symbol: ICE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'ICE1 (INDUCER OF CBF EXPRESSION 1; also SCREAM/SCRM, bHLH116) is a constitutively expressed
  nuclear MYC-type (group IIIb) basic helix-loop-helix transcription factor. In the stomatal lineage it
  is the obligate heterodimerization partner, redundantly with its paralog SCRM2, of the stage-specific
  bHLHs SPEECHLESS, MUTE and FAMA, specifying the three successive transitions of lineage entry/asymmetric
  division, meristemoid-to-guard-mother-cell differentiation and guard cell differentiation; scrm scrm2
  loss sequentially phenocopies fama, mute and spch. ICE1 also acts as a scaffold that couples the MAP
  kinases MPK3/MPK6 to SPEECHLESS: a bipartite MAPK-docking/KRAAM (KiDoK) motif binds MPK3/6, promoting
  phosphorylation and degradation of SCRM and SPCH, and the dominant scrm-D (R236H) mutation in this motif
  abolishes MAPK binding and converts the whole epidermis into stomata. In the endosperm ICE1 heterodimerizes
  with ZHOUPI to control endosperm breakdown and seed dormancy (repressing ABI3), and it modulates ABA
  responses during germination through interactions with ABI5 and DELLA proteins. ICE1 was originally
  identified as an activator of CBF3/DREB1A and freezing tolerance; it binds MYC elements in CBF promoters
  and is regulated by HOS1-mediated ubiquitination and SIZ1-mediated sumoylation, but its requirement
  for cold-induced CBF expression has been disputed because the original ice1-1 CBF3 phenotype was shown
  to arise from transgene-induced silencing.'
