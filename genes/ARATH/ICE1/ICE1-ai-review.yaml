  review:
    summary: Annotation of response to cold based on the ICE1 cold-signalling study.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited abstract states that ICE1 itself is expressed constitutively, so an expression-pattern
      (IEP) response to cold is not supported for the gene; moreover, ICE1's requirement for cold-induced
      CBF3 expression has been disputed (the ice1-1 CBF3 phenotype arose from transgene-induced silencing).
      The dispute is itself contested (PMID:32068336 reports ICE1 ChIP-seq binding at CBF/COR promoters),
      which is why response to freezing, backed by the independent ICE1(K393R) transgene, is kept as non-core
      while this IEP-based cold row is marked as over-annotated.
    supported_by:
    - reference_id: PMID:12672693
      supporting_text: ICE1 is expressed constitutively, and its overexpression in wild-type plants enhances
        the expression of the CBF regulon in the cold and improves freezing tolerance of the transgenic
        plants.
    - reference_id: PMID:32034036
      supporting_text: We showed that DREB1A repression in ice1-1 results from transgene-induced silencing
        and not genetic regulation by ICE1.
