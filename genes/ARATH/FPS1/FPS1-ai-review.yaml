id: Q09152
gene_symbol: FPS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: Farnesyl diphosphate synthase 1 (FPS1, At5g47770) of Arabidopsis thaliana is a Mg2+-dependent trans-prenyltransferase
  of the FPP/GGPP synthase family that catalyses the two successive head-to-tail condensations of isopentenyl diphosphate
  (IPP) with dimethylallyl diphosphate (DMAPP) and then with the resulting geranyl diphosphate (GPP), producing
  (2E,6E)-farnesyl diphosphate (FPP). FPP is the branch-point precursor of sterols and brassinosteroids, triterpenoids,
  sesquiterpenoids, polyprenols, the ubiquinone side chain and farnesylated proteins. Alternative translation initiation
  produces a cytosolic short isoform (FPS1S) and a long isoform (FPS1L) whose 41-residue N-terminal transit peptide
  targets it to mitochondria. FPS1 is broadly expressed and provides most FPS activity through the plant life cycle;
  it is functionally redundant with the cytosolic paralog FPS2, and loss of both genes arrests embryo development.
