  findings:
  - statement: Purified recombinant FPS1S shows Michaelis-Menten kinetics with IPP, DMAPP and GPP (Km 8.3-31.5 uM)
    supporting_text: Both enzymes displayed typical Michaelis-Menten behaviour, as observed for other FPSs, and
      exhibited similar K m values in the µmolar range (from 8.3 to 31.5 µM) for both IPP and the allylic substrates
      DMAPP and GPP.
  - statement: GFP fusions of FPS1S localize exclusively to the cytosol
    supporting_text: Under our experimental conditions all the four fusion proteins localized exclusively in the
      cytosol (Figure 5).
  - statement: FPS1S expressed from the FPS2 promoter rescues fps2 seed phenotypes
    supporting_text: Altogether, these results demonstrated that FPS1S is able to functionally replace FPS2.
