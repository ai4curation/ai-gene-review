suggested_questions:
- question: Does FPS1L form a distinct pool of FPP inside mitochondria that is used for ubiquinone side-chain synthesis,
    and in which sub-compartment (matrix or inner-membrane surface) does it act?
- question: Is the plastid HDA detection of FPS1 (PMID:28887381) a co-fractionation artefact, or is there a minor
    plastid-associated FPS1 pool?
suggested_experiments:
- description: Express FPS1L-GFP from its native promoter in Arabidopsis and combine with submitochondrial fractionation
    (protease protection, carbonate extraction) to define where FPS1L resides and test complementation of ubiquinone
    levels by FPS1L versus FPS1S alone.
