proposed_new_terms: []
suggested_questions:
- question: How does CASPL1D1 organize pathogen-induced lignified barriers, and which membrane
    partners distinguish this function from canonical Casparian-strip scaffolding?
- question: Which native cell types express CASPL1D1, and how does its individual loss contribute to
    the caspl1d1 caspl1d2 suberization phenotype?
- question: Do the proteomic endomembrane assignments represent stable localization, trafficking, or
    an unresolved fractionation signal?
suggested_experiments:
- description: Compare caspl1d1, caspl1d2 and the double mutant with native-promoter
    complementation, measuring root suberization under control and NaCl conditions.
  hypothesis: CASPL1D1 makes a condition-dependent contribution to the double-mutant suberization
    phenotype.
  experiment_type: genetic complementation and root phenotyping
- description: Image a functional endogenous CASPL1D1 tag with plasma-membrane, Golgi and TGN
    markers across root cell types.
  hypothesis: Endogenous imaging can resolve the relationship between ectopic plasma-membrane
    targeting and proteomic endomembrane assignments.
  experiment_type: endogenous tagging and confocal colocalization
- description: Test independent CASPL1D1 null alleles with native-promoter complementation, alone
    and with caspl4d1, for infection-induced lignin distribution, bacterial spread and localized
    cell death.
  hypothesis: CASPL1D1 itself contributes to immune-barrier organization, independently of
    artificial-miRNA off-target effects.
  experiment_type: genetics and infection-site imaging
