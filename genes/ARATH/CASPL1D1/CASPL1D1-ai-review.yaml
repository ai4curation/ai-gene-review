- term:
    id: GO:0005802
    label: trans-Golgi network
  evidence_type: HDA
  original_reference_id: PMID:22923678
  qualifier: located_in
  review:
    summary: LOPIT placed CASPL1D1 in the combined Golgi/TGN class, which GOA represents in part as
      the trans-Golgi network.
    action: KEEP_AS_NON_CORE
    reason: The LOPIT classifier assigns proteins to a joint Golgi/TGN class, so the TGN row is a faithful
      rendering of that classification, even though it does not discriminate TGN from Golgi cisternae.
      The TGN is the sorting station for plasma-membrane cargo in plants, so detection there fits secretory
      transit of this plasma-membrane protein. The supplementary row was not retrievable, but nothing
      contradicts the curated classification. Kept as non-core, consistent with the Golgi rows.
