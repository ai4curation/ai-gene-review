    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:24920445
  qualifier: located_in
  review:
    summary: CASPL1D1 reaches the lateral plasma membrane under ectopic endodermal expression and is
      excluded from the Casparian strip domain.
    action: ACCEPT
    reason: PMID:24920445 Figure 4A explicitly labels AtCASPL1D1 among the plasma-membrane proteins
      excluded from the CSD (asterisk); Figure 4B places it in the non-CSD group. The experiment
      used the CASP1 promoter, so it demonstrates subcellular targeting capacity rather than
      endogenous endodermal expression. PMID:36959183 subsequently detected no endodermal expression
      of its native-promoter fusion under the tested conditions.
    additional_reference_ids:
    - PMID:36959183
    supported_by:
    - reference_id: PMID:24920445
      supporting_text: AtCASPL1s excluded from the CSD but present at the lateral plasma membrane
        contain in the corresponding position an Ile (versus AtCASP1 Leu-140; one methyl group
        missing) and Tyr (versus AtCASP1 Phe-171; one extra hydroxyl group).
    - reference_id: PMID:36959183
      supporting_text: However, expression analysis, using fluorescent CASPL fusion proteins in both
        wild-type and caspQ mutant background revealed either no endodermal expression (1D1) or an
        onset of expression too late to be responsible for the initiation of the lignin microdomains
        seen in caspQ mutants (Supplementary Fig. 3).
- term:
