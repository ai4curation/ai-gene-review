gene_symbol: CASPL1D1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: CASP-like protein 1D1 (CASPL1D1; At4g15610) is a four-transmembrane protein in the
  CASPL1 clade of the MARVEL-related CASP family. When expressed from the CASP1 promoter, it
  localizes to the lateral plasma membrane and is excluded from the Casparian strip membrane domain.
  In leaves, CASPL1D1 knockdown impairs pathogen-induced lignification and confinement of avirulent
  Pseudomonas syringae; combined disruption with CASPL4D1 increases these defects. A later
  native-promoter fusion study detected no endodermal expression under the conditions tested. The
  caspl1d1 caspl1d2 double mutant shows a small, condition-dependent enlargement of the continuous
  root suberization zone, without a detectable root hydraulic conductivity phenotype. CASPL1D1 has
  been reported among PIP2;1 interactors, but its individual biochemical function and contribution
  to the double-mutant phenotype remain unresolved.
