- id: file:ARATH/CASPL1D1/CASPL1D1-hypotheses/immune-barrier-mechanism/openscientist.md
  title: 'OpenScientist hypothesis adjudication: CASPL1D1 immune-barrier mechanism'
  findings:
  - statement: Independent hypothesis analysis supports immune-barrier participation but leaves the
      specific membrane-organizing molecular activity unresolved. Primary gene-specific knockdown
      evidence agrees with the retained bacterial-defense process.
    supporting_text: None of these establishes the *direct molecular activity*.
  - statement: The study distinguishes CASPL1D1 knockdown from CASPL4D1-specific localization and
      complementation; a CASPL1D1 null and functional tagged rescue would test the proposed
      mechanism.
    supporting_text: CASPL1D1 evidence is knockdown-only.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Mechanistic scope checked against full PMID:31559647 Results and Figure 6 description:
      localization and rescue concern CASPL4D1, while CASPL1D1 has artificial-miRNA phenotypes. The report
      supplies hypotheses, not new experimental observations. Claimed sequence analyses lack executable
      artifacts in the delivered bundle and are not treated as independently reproduced; percentage identity
      alone is not a rule against functional conservation. The stronger ranking of the root double-mutant
      phenotype over single-gene leaf evidence is not adopted.'
