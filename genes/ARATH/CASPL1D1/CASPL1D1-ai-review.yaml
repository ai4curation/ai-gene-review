- term:
    id: GO:0005768
    label: endosome
  evidence_type: HDA
  original_reference_id: PMID:22923678
  qualifier: located_in
  review:
    summary: The LOPIT study (Nikolovski et al. 2012) classified 197 previously unlocalized proteins
      into a combined Golgi/TGN class. GOA represents that class as Golgi apparatus, trans-Golgi network
      and endosome rows for CASPL1D1.
    action: KEEP_AS_NON_CORE
    reason: LOPIT did not resolve endosomes as a separate class, so this row reflects the combined Golgi/TGN
      assignment. In plants the trans-Golgi network acts as the early endosome, so an endosome annotation
      follows from a Golgi/TGN assignment and is not contradicted by it. The exact At4g15610 supplementary
      row could not be inspected, but the curated HDA rows record its classification. Endosome is retained
      as a non-core endomembrane location, consistent with the Golgi and TGN rows from the same dataset.
      The steady-state functional site is the plasma membrane.
    supported_by:
    - reference_id: PMID:22923678
      supporting_text: The application of the classification procedure to the proteins with unknown
        localization resulted in a list of 197 proteins classified as Golgi/ TGN localized ( Supplemental
        Table S2 ).
