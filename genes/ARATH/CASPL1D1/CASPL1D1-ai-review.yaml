- term:
    id: GO:0005794
    label: Golgi apparatus
  evidence_type: HDA
  original_reference_id: PMID:22430844
  qualifier: located_in
  review:
    summary: Parsons et al. (2012) purified Arabidopsis Golgi membranes by density centrifugation and
      free-flow electrophoresis and defined a reproducible Golgi proteome. TAIR's HDA row records CASPL1D1
      (At4g15610) in that dataset.
    action: KEEP_AS_NON_CORE
    reason: The At4g15610 entry is in the supplementary table, which could not be retrieved. The HDA
      row itself records that the curators found it there, and nothing contradicts the identification.
      Three independent Golgi proteomics methods from this paper, PMID:25122472 and PMID:22923678 (purification
      by surface charge, label-free gradient profiling, and LOPIT isotope tagging) all place CASPL1D1
      in the Golgi. That convergence makes a Golgi pool credible. For a multi-pass plasma-membrane protein,
      a Golgi pool is expected during biosynthetic transit, and the LOPIT authors note that the Golgi
      contains proteins en route to other organelles. The steady-state functional location established
      by imaging is the plasma membrane (PMID:24920445), so the Golgi location is retained as non-core.
    supported_by:
    - reference_id: PMID:22430844
      supporting_text: A collection of 371 proteins consistently identified in all replicates has been
        proposed to represent the Golgi proteome, marking an appreciable advancement in numbers of Golgi-localized
        proteins.
    - reference_id: PMID:22923678
      supporting_text: Furthermore, the Golgi apparatus contains proteins en route to other organelles
        because of anterograde and retrograde trafficking in the endomembrane system.
    - reference_id: PMID:24920445
      supporting_text: AtCASPL1s excluded from the CSD but present at the lateral plasma membrane
