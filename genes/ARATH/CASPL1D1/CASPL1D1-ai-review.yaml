    label: defense response to bacterium
  evidence_type: IMP
  original_reference_id: PMID:31559647
  review:
    summary: CASPL1D1 contributes to pathogen-induced lignified barriers that restrict avirulent
      Pseudomonas in leaves.
    action: NEW
    reason: PMID:31559647 Figure 5 shows that artificial-miRNA CASPL1D1 knockdown reduces induced
      lignification and permits greater bacterial growth and spread of hypersensitive cell death;
      combined CASPL4D1 disruption worsens the phenotype. This supports a defense process
      independently of the root double-mutant suberization observation. The evidence is knockdown
      rather than a clean null with complementation, and does not establish catalytic activity or
      the exact membrane-organizing mechanism.
    supported_by:
    - &id001
      reference_id: PMID:31559647
      supporting_text: AvrRpm1 ‐induced lignification was largely reduced in amiCASPL1D1 and
        caspl4d1 plants but was not affected in casp1‐1 and caspl5b3‐1 plants
    - &id002
      reference_id: PMID:31559647
      supporting_text: The restricted growth of Pst DC3000 ( AvrRpm1 ) and Pst DC3000 ( AvrRpt2 ) in
        wild‐type plants was alleviated in amiCASPL1D1 and caspl4d1 plants
