  - AGI_LocusCode:AT1G51850
  - PANTHER:PTN009179558
  review:
    summary: Phylogenetically inferred Ser/Thr protein kinase activity for this LRR receptor-like kinase.
    action: ACCEPT
    reason: FRK1 sits within the PANTHER PTHR45631 malectin-like/LRR-RLK family and retains a canonical Ser/Thr kinase domain
      (STKc_IRAK-like) with all catalytic motifs intact (GKGGFG loop, VAVK Lys601, alphaC Glu617, HRD catalytic loop with
      Asp697, DFG), i.e. an RD-type kinase predicted to be catalytically competent rather than a pseudokinase. There is no
      evidence of loss of catalytic residues that would argue against the PAINT node placement. This is the best-supported
      molecular function for FRK1, although no in vitro kinase assay or substrate has been published.
    supported_by:
    - reference_id: file:ARATH/FRK1/FRK1-bioinformatics/RESULTS.md
      supporting_text: all canonical catalytic motifs of a eukaryotic protein kinase are intact
    - reference_id: file:ARATH/FRK1/FRK1-notes.md
      supporting_text: 'MF: protein Ser/Thr kinase activity (IBA + domain/catalytic residues) is the only defensible activity'
    - reference_id: file:ARATH/FRK1/FRK1-deep-research-falcon.md
      supporting_text: It would therefore be unjustified to assign cellotriose, flg22, or IDA as its substrate or ligand.
