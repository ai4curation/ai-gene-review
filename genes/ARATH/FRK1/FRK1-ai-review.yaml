gene_symbol: FRK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'FRK1 (FLG22-INDUCED RECEPTOR-LIKE KINASE 1; also SIRK, SENESCENCE-INDUCED RECEPTOR-LIKE KINASE; At2g19190) is
  a single-pass type I transmembrane receptor-like kinase of Arabidopsis thaliana belonging to the malectin-like/LRR receptor-like
  kinase group (LRR-RLK subfamily I, IOS1-like). It has an N-terminal signal peptide, an extracellular ectodomain composed
  of a malectin-like domain followed by three leucine-rich repeats, a transmembrane helix, and a cytoplasmic Ser/Thr protein
  kinase domain that retains the canonical ATP-binding and catalytic residues. FRK1 is best known as a transcriptional marker:
  its expression is rapidly induced by the bacterial MAMP flg22 downstream of the FLS2 receptor, the MEKK1-MKK4/5-MPK3/6 MAP
  kinase cascade and WRKY22/WRKY29, and it is induced by bacteria, leaf-microbiota colonization and fungal infection (strongest
  in cells in direct contact with Colletotrichum hyphae). It is also strongly induced during leaf senescence as a direct target
  of WRKY6. Its own biochemical activity, ligand, substrates and physiological role remain essentially uncharacterized; no
  loss-of-function phenotype in immunity or senescence has been reported.'
