- term:
    id: GO:0009617
    label: response to bacterium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G51800
  - AGI_LocusCode:AT1G51890
  - AGI_LocusCode:AT2G19190
  - PANTHER:PTN005216631
  review:
    summary: Phylogenetically propagated response to bacterium; FRK1 itself is among the experimental sources (its TAIR IEP
      annotation).
    action: KEEP_AS_NON_CORE
    reason: FRK1 transcription is strongly induced by bacteria and bacterial MAMPs, so a 'response to' annotation is appropriate
      under GO conventions for expression evidence. It describes regulation of FRK1, not an activity FRK1 performs, so it
      is kept as non-core. FRK1 appearing in its own WITH/FROM reflects experimental grounding on the target and is not circular;
      another donor, the paralog IOS1 (At1g51800), has genuine loss-of-function evidence in antibacterial PTI, but that participation
      should not be transferred to FRK1, for which no such evidence exists.
    additional_reference_ids:
    - PMID:27317676
    supported_by:
