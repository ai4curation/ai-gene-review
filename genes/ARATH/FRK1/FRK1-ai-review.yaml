- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IDA
  original_reference_id: PMID:16678099
  qualifier: acts_upstream_of_or_within
  review:
    summary: TAIR annotation from He et al. 2006, a study that used early MAMP marker genes (FRK1 among them) as transcriptional
      readouts to identify bacterial effectors suppressing MAMP signalling.
    action: UNDECIDED
    reason: The abstract describes FRK1-type genes as MAMP marker genes whose activation is sustained by nonpathogenic and
      suppressed by pathogenic P. syringae, which suggests the observation is induction of FRK1 expression by bacteria. No
      evidence found elsewhere shows that FRK1 itself executes a step of the defence response, and no frk1 loss-of-function
      immunity phenotype has been reported, so the likely correct term is response to bacterium (GO:0009617). However, this
      is an experimental (IDA) TAIR annotation with the weak acts_upstream_of_or_within qualifier, and the full text of He et
      al. 2006 is not available; the curator may have relied on an FRK1-specific experiment not described in the abstract.
      Per project guidance the annotation is left UNDECIDED rather than modified until the full text can be checked.
    supported_by:
    - reference_id: PMID:16678099
      supporting_text: nonhost/nonpathogenic Pseudomonas syringae sustains but pathogenic P. syringae suppresses early MAMP
        (microbe-associated molecular pattern) marker-gene activation
    - reference_id: file:ARATH/FRK1/FRK1-notes.md
      supporting_text: FRK1 appears in the literature almost exclusively as a transcriptional marker
    - reference_id: file:ARATH/FRK1/FRK1-deep-research-falcon.md
      supporting_text: No cognate extracellular ligand has been established for FRK1.
