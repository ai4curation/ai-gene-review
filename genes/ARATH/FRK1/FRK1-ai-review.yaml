core_functions:
- description: Plasma-membrane receptor-like Ser/Thr protein kinase (malectin-like/LRR ectodomain, cytoplasmic kinase domain)
    whose transcription is rapidly induced by bacterial MAMPs, microbes and senescence; its catalytic activity, ligand and
    substrates are inferred from domain architecture and phylogeny and have not been experimentally characterized.
  supported_by:
  - reference_id: file:ARATH/FRK1/FRK1-notes.md
    supporting_text: 'MF: protein Ser/Thr kinase activity (IBA + domain/catalytic residues) is the only defensible activity'
  - reference_id: file:ARATH/FRK1/FRK1-notes.md
    supporting_text: signal peptide 1-24; extracellular domain 25-517; TM helix 518-538; cytoplasmic 539-876
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
suggested_questions:
- question: Is FRK1 a catalytically active kinase, and if so what are its substrates and does its activity change after flg22
    perception?
  experts:
  - Plant receptor kinase biochemists
- question: Does FRK1 contribute functionally to pattern-triggered immunity or senescence, or is it solely a transcriptional
    output? Are single frk1 mutants phenotypically silent because of redundancy with paralogous malectin-like LRR-RLKs (e.g.
    At1g51800, At1g51850, At1g51890 in the same PANTHER clade)?
  experts:
  - Plant immunity geneticists
- question: Does the FRK1 malectin-like/LRR ectodomain bind a ligand (e.g. a cell-wall-derived or microbial glycan) and are
    the CSILRR ectodomain interactions (At1g12460, At3g28040, PXC2) relevant in planta?
  experts:
  - Structural biologists
  - Plant cell-surface receptor researchers
suggested_experiments:
- hypothesis: FRK1 contributes to PTI redundantly with its closest paralogues.
  description: Generate CRISPR higher-order mutants of FRK1 and its closest malectin-like LRR-RLK paralogues; assay flg22-induced
    ROS, MAPK activation, callose deposition, and growth of Pseudomonas syringae and Colletotrichum higginsianum.
- hypothesis: FRK1 is an active Ser/Thr kinase.
  description: Express the cytoplasmic domain (WT and D697N/K601E mutants) and test autophosphorylation and transphosphorylation
    of generic and candidate substrates in vitro; map in vivo phosphosites after flg22 treatment.
