      supporting_text: nonhost/nonpathogenic Pseudomonas syringae sustains but pathogenic P. syringae suppresses early MAMP
        (microbe-associated molecular pattern) marker-gene activation
    - reference_id: PMID:27317676
      supporting_text: ios1 mutants showed defective PTI responses, notably delayed upregulation of the PTI marker gene FLG22-INDUCED
        RECEPTOR-LIKE KINASE1
