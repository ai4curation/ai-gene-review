- term:
    id: GO:0005829
    label: cytosol
  evidence_type: HDA
  original_reference_id: PMID:28887381
  qualifier: located_in
  review:
    summary: The native biochemical localization is chloroplast stroma, and the cited fractionation study
      itself classifies NAGK as a plastid protein, so the cytosol assignment over-states the data.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:28887381 is a protein-correlation-profiling study of soluble and microsomal fractions from
      whole leaves, an assay that cannot resolve whether a soluble protein came from cytosol or from broken
      plastids. In the paper's own supplement, NAGK is classified as plastid and membrane-associated, with
      no dual-localization flag, so the paper does not itself assign NAGK to cytosol. Direct biochemical localization
      places NAGK in the chloroplast stroma (PMID:16377628, curated in UniProt). An additional small cytosolic
      pool is not excluded, so the row is marked as an over-annotation rather than removed.
    supported_by:
    - reference_id: file:ARATH/NAGK/NAGK-source-analysis/README.md
      supporting_text: Subacon localization is plastid, True membrane is True, and Dual Localized is empty.
    - reference_id: file:ARATH/NAGK/NAGK-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: Plastid, chloroplast stroma {ECO:0000269|PubMed:16377628}.
