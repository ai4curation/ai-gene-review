- term:
    id: GO:0009534
    label: chloroplast thylakoid
  evidence_type: HDA
  original_reference_id: PMID:20061580
  qualifier: located_in
  review:
    summary: AT_CHLORO subfraction proteomics assigns a NAGK pool to thylakoids; an independent study also
      detects a membrane-associated NAGK pool, so the curated HDA row is retained as a non-core location.
    action: KEEP_AS_NON_CORE
    reason: AT_CHLORO (PMID:20061580) assigned subplastidial localization by spectral counting across stroma,
      thylakoid and envelope fractions of purified chloroplasts. The NAGK-specific counts are in the database
      rather than the cached text, so the TAIR curator's experimental call is deferred to rather than overruled.
      That call is consistent with independent evidence for a membrane-associated plastid NAGK pool in PMID:28887381.
      The catalytic and PII-regulated function of NAGK is stromal (PMID:16377628), so thylakoid association
      is kept as non-core and not used as the site of the core activity.
    supported_by:
    - reference_id: PMID:20061580
      supporting_text: We assessed the partitioning of each protein in the three chloroplast compartments
        by using a semiquantitative proteomics approach (spectral count).
    - reference_id: file:ARATH/NAGK/NAGK-source-analysis/README.md
      supporting_text: These data support a membrane-associated pool but do not independently identify a cytosolic
        compartment or a particular chloroplast membrane.
