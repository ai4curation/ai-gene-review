- description: NAGK (At3g57560) is a chloroplast-stromal N-acetylglutamate kinase that phosphorylates
    N-acetylglutamate with ATP in Arabidopsis arginine biosynthesis. Its hexameric enzyme is inhibited
    by arginine; binding of the PII signal protein GLB1 relieves that inhibition under appropriate metabolite
    conditions. NAGK-dependent arginine supply supports gametophyte function and embryo development. A
    proteomic study also detects a membrane-associated pool, without establishing a separate cytosolic
    biosynthetic route.
