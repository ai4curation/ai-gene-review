- term:
    id: GO:0060090
    label: molecular adaptor activity
  evidence_type: EXP
  original_reference_id: PMID:11402193
  qualifier: enables
  review:
    summary: DisProt-assigned EXP annotation to molecular adaptor activity, citing the CBL crystal structure
      paper. Molecular adaptor activity means bringing together two or more molecules through selective
      non-covalent binding so that they function in a coordinated way. Neither the abstract nor the UniProt
      curation of this paper (homodimer, PLP binding, substrate specificity) describes CBL bridging other
      molecules. The DisProt entry is presumably about a disordered region, such as the N-terminal extension
      not resolved in the structure.
    action: MARK_AS_OVER_ANNOTATED
    reason: CBL is a homodimeric enzyme; no evidence in our sources shows it scaffolding or bridging distinct
      partners. The full text and the DisProt entry were not accessible, so the row is marked over-annotated
      rather than removed, and a query is recorded for DisProt.
    supported_by:
    - reference_id: file:ARATH/AT3G57050/AT3G57050-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Forms homodimers (PubMed:11402193).
    source_defects:
    - defect_type: WRONG_TERM
      resource: DISPROT
      requested_change: CHECK
      asserted_value: GO:0060090
      cause: UNKNOWN
      confidence: SUSPECTED
      explanation: GO:0060090 molecular adaptor activity is attached to Arabidopsis cystathionine beta-lyase
        (P53780, AT3G57050) with EXP evidence from PMID:11402193, a crystal structure and substrate-specificity
        study of this homodimeric PLP enzyme. Nothing in that paper as curated by UniProt describes bridging
        of distinct molecules. Please check whether a disorder-function term (or no MF term) was intended
        for the disordered region.
