- id: PMID:35472754
  title: Identification and functional characterization of a cystathionine β-lyase (CBL) enzyme for H(2)S
    production in Arabidopsis thaliana.
  findings:
  - statement: Recombinant CBL releases H2S from L-cysteine, and cbl mutants have lower endogenous H2S.
    supporting_text: The recombinant CBL activity in vitro revealed that CBL produced H2S using L-cysteine
      as a substrate.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Not in GOA. Arabidopsis has dedicated L-cysteine desulfhydrases (e.g. cytosolic DES1),
      and the physiological weight of plastidial CBL in H2S production is unresolved, so no NEW cysteine
      desulfhydrase row is proposed.
