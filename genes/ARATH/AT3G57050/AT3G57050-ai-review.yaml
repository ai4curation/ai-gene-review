gene_symbol: CBL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: AT3G57050 (TAIR symbol CBL; not to be confused with the CALCINEURIN B-LIKE CBL1-10 proteins)
  encodes the chloroplastic cystathionine beta-lyase of Arabidopsis thaliana, a nuclear-encoded pyridoxal
  5'-phosphate-dependent enzyme of the trans-sulfuration enzyme family. It is imported into plastids via
  an N-terminal transit peptide and resides in the chloroplast stroma, where it cleaves L-cystathionine
  (made by cystathionine gamma-synthase from cysteine and O-phosphohomoserine) to L-homocysteine, pyruvate
  and ammonium, the penultimate step of de novo methionine synthesis; homocysteine is then methylated
  to methionine. It is encoded by a single-copy gene. The mature enzyme forms homodimers, possibly homotetramers,
  with PLP bound to Lys278. Its larger substrate pocket than the E. coli enzyme lets it bind L-cystathionine
  and L-djenkolate similarly, consistent with a broad cysteine-S-conjugate beta-lyase specificity. Loss
  of CBL impairs embryo patterning, the root stem-cell niche and root growth, with reduced PLETHORA and
  PIN protein levels and lower H3K4me3 and DNA methylation, defects rescued by exogenous methionine. The
  recombinant enzyme also releases H2S from L-cysteine, and cbl mutants have lower H2S content.
