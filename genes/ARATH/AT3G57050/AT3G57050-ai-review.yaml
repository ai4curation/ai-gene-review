- id: PMID:31002461
  title: Cystathionine beta-lyase is crucial for embryo patterning and the maintenance of root stem cell
    niche in Arabidopsis.
  findings:
  - statement: cbl mutants have embryo and root stem-cell niche defects that are rescued by methionine.
    supporting_text: Moreover, exogenous supplementation of Met also restores the impaired QC activity
      and the root growth defects of cbl.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The developmental phenotypes are downstream consequences of methionine/SAM limitation
      (reduced H3K4me3 and DNA methylation), not separate functions of the enzyme, so no developmental
      process terms are proposed.
