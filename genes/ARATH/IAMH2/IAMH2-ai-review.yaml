- id: PMID:32327358
  title: Two homologous INDOLE-3-ACETAMIDE (IAM) HYDROLASE genes are required for the auxin effects of
    IAM in Arabidopsis.
  findings:
  - statement: Names At4g37560 as IAMH2, the 90%-identical tandem paralog of IAMH1.
    supporting_text: IAMH2 and IAMH1 share 90% amino acid sequence identity.
  - statement: An iamh2 T-DNA single mutant is resistant to exogenous IAM.
    supporting_text: demonstrating that disruption of IAMH2 also led to IAM resistance
  - statement: CRISPR iamh1 iamh2 double mutants suppress iaaM-induced auxin overproduction and fail to
      raise IAA conjugates after IAM treatment, but show no developmental defects under normal conditions.
    supporting_text: The iamh1 iamh2 double mutants did not display obvious developmental defects under
      our normal growth conditions, suggesting that auxin synthesized from the IAM pathway may not play
      critical roles in Arabidopsis development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text (PMC7231657) read. Founding functional paper for IAMH1/IAMH2. The enzymatic
      activity is inferred from genetics and auxin metabolite profiling; I found no in vitro assay of purified
      protein. Expression and GFP localization data are for IAMH1 only.
- id: PMID:42844995
  title: Structural variation in the IAMH2 3' UTR underlies hypocotyl elongation during light adaptation
    in Arabidopsis thaliana.
  findings:
  - statement: The iamh2 mutant SALK_208590C has short hypocotyls and significantly lower hypocotyl IAA
      under low light; hypocotyl IAM is significantly elevated under normal light.
    supporting_text: These data indicate that IAMH2 contributes to the hypocotyl IAA pool, particularly
      under low light.
  - statement: IAMH1 is upregulated in iamh2 under low light, but only IAMH2 is light-responsive and the
      compensation does not restore hypocotyl elongation, so IAMH2 is non-redundant in this context.
    supporting_text: IAMH1 was upregulated in the iamh2 mutant under low light (Figure S8A), indicating
      partial compensation.
  - statement: The authors cite work questioning whether the IAM pathway contributes to auxin biosynthesis
      under standard conditions, and propose that it is conditionally recruited under low light.
    supporting_text: recent studies have questioned whether this pathway contributes to auxin biosynthesis
      under standard conditions
  - statement: C3H14 and C3H15 bind a poly(U) motif in the IAMH2 3' UTR and repress IAMH2 mRNA; IAMH2
      is epistatic to C3H14/C3H15 for hypocotyl length.
    supporting_text: Under low light, the triple mutant exhibited hypocotyl lengths comparable to those
      of the iamh2 single mutant (Figure 4I, J), indicating that IAMH2 is epistatic to C3H14 and C3H15.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text (PMC13646855) read; matches the publisher PDF supplied by the user. Provides
      the only in vivo evidence that IAMH2 affects endogenous IAM/IAA levels without exogenous IAM.
- id: PMID:41362017
  title: Identification of a novel link connecting indole-3-acetamide with abscisic acid biosynthesis and
    signaling.
  findings:
  - statement: IAM-triggered root growth inhibition depends on ABA biosynthesis (ABA3) and signalling, so
      IAM may act as a signalling molecule beyond its role as an auxin precursor.
    supporting_text: These results imply that IAM may have a function beyond its role as an intermediate
      in a secondary pathway of auxin biosynthesis, potentially acting as an independent signaling molecule
  - statement: Describes the IAM pathway as contributing to IAA biosynthesis only under specific conditions.
    supporting_text: the indole‐3‐acetamide (IAM) pathway, are also considered to contribute to IAA biosynthesis
      under specific conditions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Resolved via PubMed from the Moya-Cuevas et al. 2026 citation in PMID:42844995 (New Phytol
      249:2452-2466; PubMed lists the online date as 2025-12-08). Full text read. Does not mention IAMH1
      or IAMH2; its experiments concern AMI1 and IAM signalling. It qualifies, but does not refute, the
      IAM-to-IAA role of the IAMHs.
suggested_questions:
- question: Does purified recombinant IAMH2 hydrolyse IAM in vitro, with what kinetic parameters, and does
    it also act on formamide, acetamide or other aryl/alkyl amides, as its acetamidase/formamidase family
    membership would suggest?
- question: What is the endogenous source of IAM in Arabidopsis hypocotyls under low light, and how much
    of the IAMH2-dependent IAA pool derives from it relative to the IPyA (TAA1/YUC) pathway?
- question: Only IAMH2 is light-responsive and required for low-light hypocotyl elongation, while IAMH1
    is upregulated in iamh2 without restoring it. Is the non-redundancy explained by expression level and
    pattern alone, or also by differences in catalytic efficiency or localization?
suggested_experiments:
- description: Express and purify IAMH2 (and IAMH1) and measure steady-state kinetics with IAM, formamide,
    acetamide and phenylacetamide, with active-site mutants as controls.
- description: Quantify IAM and IAA in hypocotyls of iamh2, iamh1, iamh1 iamh2 and iamh1 iamh2 ami1 mutants
    under normal and low light, combined with stable-isotope-labelled IAM feeding, to measure the flux
    through the IAM branch.
