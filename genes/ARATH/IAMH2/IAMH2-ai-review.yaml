- term:
    id: GO:0009684
    label: indoleacetic acid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:42844995
  review:
    summary: Loss of IAMH2 lowers endogenous IAA and raises IAM in hypocotyls. Together with IAMH1, IAMH2
      is required to convert exogenous and iaaM-derived IAM into IAA.
    action: NEW
    reason: |-
      IAMH2 is proposed to catalyse the final hydrolytic step of the IAM branch of IAA biosynthesis (IAM to IAA), so it performs a step of the process; it is not merely required for it.
      The in vivo support comes from two sources. The iamh2 single mutant has altered endogenous IAM and IAA levels without any exogenous IAM (PMID:42844995). The iamh1 iamh2 double mutant suppresses the IAA rise and the auxin-overproduction phenotype caused by IAM or iaaM (PMID:32327358).
      Comparator check (QuickGO, taxon 3702): AMI1, the amidase-signature enzyme that catalyses the same IAM to IAA step, carries GO:0009684 by IDA. Upstream enzymes of other IAA routes (TAA1, YUC7, CYP79B2) carry it by IMP.
      The IAM route appears to be a minor contributor under standard growth conditions, so this is a real but non-dominant biosynthetic role. X. Gao et al. (PMID:42844995) note that Moya-Cuevas et al. (PMID:41362017) questioned whether the pathway contributes to auxin biosynthesis under standard conditions; that paper proposes that IAM also acts as a signalling molecule through ABA, but does not dispute that the IAMHs convert IAM to IAA. X. Gao et al. propose instead that the IAM pathway is conditionally recruited under low light, which is the condition in which the iamh2 IAA deficit is significant.
    additional_reference_ids:
    - PMID:32327358
    - PMID:41362017
    supported_by:
    - reference_id: PMID:42844995
      supporting_text: Under low‐light conditions, IAA levels were significantly lower in iamh2 than in
        Col‐0, whereas under normal light, the reduction was not statistically significant (Figure 2H).
    - reference_id: PMID:42844995
      supporting_text: These data indicate that IAMH2 contributes to the hypocotyl IAA pool, particularly
        under low light.
    - reference_id: PMID:42844995
      supporting_text: We therefore propose that the IAM pathway is not essential for basal auxin homeostasis,
        but is conditionally recruited under low‐light stress to provide local IAA for adaptive growth.
    - reference_id: PMID:32327358
      supporting_text: Disruption of the IAMH genes also suppressed the developmental abnormalities caused
        by overexpression of the iaaM gene, suggesting that the IAMHs are the main enzymes in converting
        IAM into IAA in Arabidopsis.
core_functions:
- description: Cytosolic amidohydrolase that converts indole-3-acetamide (IAM) to the auxin indole-3-acetic
    acid (IAA). It acts redundantly with its tandem paralog IAMH1 in converting exogenous or iaaM-derived
    IAM, but has a non-redundant, light-responsive role in supplying the hypocotyl IAA pool and supporting
    hypocotyl elongation under low light.
