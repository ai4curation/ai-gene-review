  review:
    summary: IAMH2 was detected in a size-exclusion chromatography proteomic profiling of the crude
      cytosolic fraction of Arabidopsis leaves.
    action: ACCEPT
    reason: A cytosolic location fits a soluble amidohydrolase with no annotated signal peptide or transmembrane
      segment. The 90%-identical paralog IAMH1 is non-nuclear as a GFP fusion, and the substrate IAM
      and product IAA are metabolised in the cytosol. This is the only localization evidence for IAMH2
      itself, and it is high-throughput; the per-protein identification was not examined (the quote below
      describes the dataset, not IAMH2 specifically), so the ACCEPT rests on this orthogonal corroboration.
      Nothing contradicts it.
