taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: IAMH2 (INDOLE-3-ACETAMIDE HYDROLASE 2, AT4G37560; also mapped as the natural-variation
  locus LA1) is a soluble amidohydrolase of the acetamidase/formamidase (FmdA_AmdA) family, encoded
  in tandem with its 90%-identical paralog IAMH1 (AT4G37550) on chromosome 4. Genetic and metabolite
  evidence indicates that IAMH1 and IAMH2 are the main Arabidopsis enzymes converting indole-3-acetamide
  (IAM) into the auxin indole-3-acetic acid (IAA). iamh2 mutants resist exogenous IAM, iamh1 iamh2 double
  mutants suppress the auxin-overproduction phenotype of bacterial iaaM expression, and iamh2 hypocotyls
  contain less IAA under low light and accumulate IAM under normal light. The double mutant has no obvious
  developmental defect under standard conditions, so the IAM route seems to make a minor contribution
  to bulk auxin. IAMH2 nevertheless supports hypocotyl elongation in low light, a role in which it is
  non-redundant; only IAMH2 is light-responsive, and upregulation of IAMH1 in iamh2 mutants does not
  restore hypocotyl elongation. Its mRNA is destabilised through a
  poly(U) motif in the 3' UTR bound by the CCCH zinc-finger proteins C3H14 and C3H15, and a natural
  3' UTR structural variant common in high-altitude accessions escapes this repression, raises IAMH2
  expression and lengthens hypocotyls. The protein has been detected in the cytosolic fraction of leaves.
