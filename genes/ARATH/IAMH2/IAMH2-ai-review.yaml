      family signature (IPR004304); correct but unspecific.
- id: PMID:25293756
  title: A proteomic strategy for global analysis of plant protein complexes.
  findings:
  - statement: High-throughput size-exclusion chromatography proteomics of the leaf cytosolic fraction;
      source of the HDA cytosol annotation.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Proteome-wide dataset; IAMH2 is not discussed in the main text (identification presumably
