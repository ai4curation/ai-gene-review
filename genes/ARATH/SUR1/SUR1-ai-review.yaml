suggested_questions:
- question: Which enzyme provides the residual C-S lyase activity for indolic glucosinolates
    in sur1 mutants, and is it a paralog in the PTHR45744 family?
- question: Is the physiological SUR1 substrate the Cys-Gly or the Cys conjugate produced
    after GGP1 action, and does SUR1 retain any aminotransferase side activity?
- question: How much of the sur1 lethality is due to auxin excess versus accumulation
    of toxic glucosinolate intermediates?
suggested_experiments:
- description: Assay recombinant SUR1 kinetically with synthetic S-(alkylacetohydroximoyl)-L-cysteine
    and -cysteinylglycine conjugates of methionine-, phenylalanine- and tryptophan-derived
    precursors, and with tyrosine/2-oxoglutarate, to define its native substrate and exclude
    residual transaminase activity.
- description: Profile glucosinolates and intermediates in sur1 myb34 and sur1 combined
    with candidate PTHR45744 paralog mutants to identify the additional indolic C-S lyase.
