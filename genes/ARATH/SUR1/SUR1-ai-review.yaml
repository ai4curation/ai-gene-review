id: Q9SIV0
gene_symbol: SUR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SUR1 (SUPERROOT1; also ALF1/HLS3/RTY1, At2g20610) is the pyridoxal
  5'-phosphate-dependent C-S lyase of core glucosinolate biosynthesis. It belongs to
  the class-I (tyrosine aminotransferase-like) fold of PLP enzymes but has diverged to
  cleave the C-S bond of S-(alkylacetohydroximoyl)-L-cysteine conjugates, derived from
  the glutathione conjugates of aldoxime-derived aci-nitro/nitrile oxide intermediates,
  releasing the thiohydroximate that UGT74 enzymes then S-glucosylate. It is a
  cytosolic, largely single-copy function in Arabidopsis; loss-of-function sur1 mutants
  lack aliphatic and most indole glucosinolates and accumulate C-S lyase substrates.
  Because indole-3-acetaldoxime is then shunted into indole-3-acetic acid, sur1
  mutants overproduce auxin and show the pleiotropic "superroot" phenotype (excess
  adventitious and lateral roots, epinastic cotyledons, no apical hook, sterility), so
  SUR1 indirectly buffers auxin homeostasis at the IAOx branch point.
