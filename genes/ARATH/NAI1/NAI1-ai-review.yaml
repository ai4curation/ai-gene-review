  review:
    summary: InterPro2GO mapping from the bHLH domain.
    action: KEEP_AS_NON_CORE
    reason: bHLH proteins bind DNA as dimers, and UniProt records NAI1 as a homodimer by curator
      inference only. Dimerization through the HLH region is very likely, but no NAI1 dimer or
      partner has been demonstrated, and dimerization is a component of DNA binding rather than a
      distinct function. Kept as non-core at the level the domain evidence warrants.
