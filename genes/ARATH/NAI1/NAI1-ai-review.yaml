taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  NAI1 (bHLH020, At2g22770) is a nuclear basic helix-loop-helix transcription activator of
  Arabidopsis thaliana and the master transcriptional regulator of constitutive endoplasmic
  reticulum (ER) bodies, the Brassicaceae-specific ER-derived compartments that store
  beta-glucosidases/myrosinases used in chemical defense. NAI1 binds G-box and E-box motifs in
  the promoters of its targets and activates expression of the ER-body gene battery, including
  NAI2, PYK10/BGLU23, MEB1/MEB2, jacalin-related lectins (PBP1/JAL30) and GDSL lipase-like
  proteins. Loss of NAI1 abolishes ER bodies in seedlings, roots and leaf margins (leaf ER bodies),
  whereas jasmonate- and wound-inducible ER bodies are largely NAI1-independent and controlled by
  MYC2/3/4. Through its target PYK10, NAI1 influences root interactions with the endophyte
  Piriformospora indica, and NAI1 is also required for the abnormal ER aggregation seen in ermo3
  mutants.
