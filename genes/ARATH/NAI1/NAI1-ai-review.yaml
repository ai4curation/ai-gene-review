proposed_new_terms:
- proposed_name: positive regulation of ER body organization
  proposed_definition: Any process that activates or increases the frequency, rate or extent of ER body
    organization.
  justification: GO:0080119 ER body organization has no regulation children. NAI1 is a transcription
    activator of the ER-body gene battery (NAI2, PYK10, MEB1/2) whose loss abolishes constitutive ER
    bodies; a regulation term would capture this role without asserting that NAI1 participates in ER
    body assembly itself.
  proposed_parent:
    id: GO:0080119
    label: ER body organization
  supported_by:
  - reference_id: PMID:15155889
    supporting_text: The NAI1 gene regulates the development of ER bodies because mutation of NAI1 abolishes
      the formation of ER bodies.
  - reference_id: PMID:33315514
    supporting_text: NAI1 binds to the promoter region of NAI2 and activates the NAI2 promoter.
suggested_questions:
- question: Should GO add regulation children of GO:0080119 ER body organization, so that transcriptional
    regulators such as NAI1 (and MYB47/MYB95 for inducible ER bodies) can be annotated without being
    placed in ER body organization itself?
- question: Does NAI1 act as a homodimer, or does it heterodimerize with its close paralogs bHLH019/bHLH025
    or other bHLH proteins to regulate ER-body genes?
- question: Which NAI1-regulated protein mediates the NAI1-dependent ER aggregation in ermo3 mutants, given
    that NAI2 and PYK10 are not required?
suggested_experiments:
- description: Genome-wide ChIP-seq or DAP-seq of NAI1 in seedling roots to define direct targets and
    test whether MEB1/2, JALs and GLLs are bound directly or indirectly.
  experiment_type: ChIP-seq
- description: Co-immunoprecipitation or yeast two-hybrid of NAI1 with bHLH019, bHLH025 and itself to test
    homo- versus heterodimer formation, with E-box/G-box EMSA of the resulting dimers.
  experiment_type: protein interaction assay
