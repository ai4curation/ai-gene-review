- term:
    id: GO:0007029
    label: endoplasmic reticulum organization
  evidence_type: IMP
  original_reference_id: PMID:23155454
  qualifier: acts_upstream_of_or_within
  review:
    summary: TAIR IMP from the ermo3-1 nai1-1 double mutant, in which loss of NAI1 suppressed the
      ER aggregation of ermo3.
    action: KEEP_AS_NON_CORE
    reason: The full text supports the row as stated with the acts_upstream_of_or_within qualifier -
      NAI1 is genetically required for abnormal ER aggregation in ermo3 cells and, more generally,
      for formation of ER bodies, which are ER subdomains. NAI1 is a nuclear transcription activator
      and does not itself remodel the ER; its effect is mediated by NAI1-regulated proteins (the
      authors propose PYK10-complex components). The upstream qualifier is therefore appropriate,
      and the term is kept as a downstream consequence of the core transcriptional function rather
      than a core role. GO:0080119 ER body organization is not a descendant of GO:0007029 (its only
      GO parent is organelle organization), so it is not offered as a refinement here.
    supported_by:
    - reference_id: PMID:23155454
      supporting_text: Depletion of NAI1 from ermo3-1 resulted in a total loss of ER-aggregates from
        whole-plant tissues (Figure 8).
    - reference_id: PMID:23155454
      supporting_text: Because NAI1 is a transcription factor, protein(s) expressed under the positive
        control of NAI1 might be crucial for ER disorganization in ermo3 cells.
