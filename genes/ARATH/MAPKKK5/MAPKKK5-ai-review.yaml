suggested_questions:
- question: Yamada et al. (2016) found strong chitin-signaling defects and enhanced flg22-induced MAPK activation
    in mapkkk5 single mutants, whereas Bi et al. (2018) found near-normal single-mutant responses and a positive
    requirement for MAPKKK3/MAPKKK5 downstream of FLS2. Is the flg22 effect positive or negative, and does the discrepancy
    reflect alleles, growth conditions or tissue?
- question: 'Which RLCK is the physiological activator of MAPKKK5 after chitin perception: PBL27 (C-terminal sites
    S617-S685) or RLCK VII-4 members such as PBL19 (Ser-599)? Bi et al. reported normal chitin-induced MAPKKK5 phosphorylation
    in pbl27.'
- question: Should the MPK6-mediated feedback phosphorylation of MAPKKK5 (Ser-682/Ser-692) be represented in GO-CAM
    as a positive feedback edge in the chitin perception and other PRR modules?
suggested_experiments:
- description: Side-by-side analysis of mapkkk5 single and mapkkk3 mapkkk5 double mutants (both labs' alleles) for
    chitin- and flg22-induced MPK3/MPK6 activation under identical conditions to resolve the single-mutant discrepancy.
- description: Phosphosite complementation of mapkkk3 mapkkk5 with combined PBL27-site (6xA) and Ser-599 mutations
    to test whether the two RLCK inputs are additive or alternative routes to MAPKKK5 activation after chitin perception.
