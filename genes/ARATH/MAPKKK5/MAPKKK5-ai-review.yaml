taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'MAPKKK5 (MEKK1-subfamily MAP kinase kinase kinase, At5g66850; also MAP3Kgamma) is a cytosolic and
  plasma membrane-associated serine/threonine protein kinase that forms the MAP3K tier of the MAPKKK3/MAPKKK5-MKK4/MKK5-MPK3/MPK6
  cascade activated by cell surface pattern recognition receptors. Its central kinase domain phosphorylates the
  activation-loop Ser/Thr residues of MKK4 and MKK5 (and weakly MKK2). MAPKKK5 is itself activated by phosphorylation
  by receptor-like cytoplasmic kinases downstream of PRRs: PBL27 phosphorylates its C-terminal region in a CERK1-dependent
  manner after chitin perception, RLCK VII kinases such as PBL19 phosphorylate Ser-599, and BSK1 phosphorylates
  Ser-289; MPK6 phosphorylates Ser-682/Ser-692 in a positive feedback loop. MAPKKK5 acts largely redundantly with
  MAPKKK3 in MPK3/MPK6 activation triggered by chitin, flg22, elf18 and Pep peptides, contributing to defense gene
  expression, chitin-induced callose deposition and resistance to bacterial and fungal pathogens, but it is not
  required for the PAMP-induced ROS burst. Together with YODA it also contributes to gamete transmission and embryogenesis.'
