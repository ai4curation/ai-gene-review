suggested_questions:
- question: >-
    Does Arabidopsis Z-ISO (Q9SAC0) itself, rather than the maize ortholog,
    bind a ferrous heme b cofactor and use the same redox-regulated
    axial-ligand-switching mechanism, and which residues (e.g. the candidate
    histidines) provide the axial ligands?
  experts:
  - Eleanore T. Wurtzel
- question: >-
    In which plastid membrane (inner envelope versus thylakoid) does Arabidopsis
    Z-ISO reside, and does it associate physically with PDS/ZDS in a
    desaturation complex? The current 'chloroplast membrane' annotation rests on
    UniProt similarity and proteomics rather than direct sub-plastid
    localization of the Arabidopsis protein.
  experts:
  - Barry J. Pogson
- question: >-
    What is the in vivo electron/redox donor that keeps the Z-ISO heme in the
    active ferrous state within the plastid membrane, and how is this coordinated
    with the plastoquinone pool used by the flanking desaturases?
  experts:
  - Eleanore T. Wurtzel
suggested_experiments:
- hypothesis: >-
    Arabidopsis Z-ISO is a ferrous-heme-b-dependent integral-membrane isomerase
    that converts 9,9',15-tri-cis-zeta-carotene to 9,9'-di-cis-zeta-carotene.
  description: >-
    Express and purify recombinant mature Arabidopsis Z-ISO (residues 59-367) as
    a cleavable MBP fusion, confirm bound heme b by pyridine-hemochrome and
    UV-visible/EPR spectroscopy, and assay isomerization in phosphatidylcholine
    liposomes loaded with purified 9,9',15-tri-cis-zeta-carotene under reducing
    (dithionite) versus oxidizing conditions; follow substrate-to-product
    conversion by C30 reversed-phase HPLC with photodiode-array detection.
  experiment_type: in vitro enzyme assay with purified recombinant protein
- hypothesis: >-
    Z-ISO is a peripheral or integral protein of a specific plastid membrane and
    is co-located with the poly-cis desaturases.
  description: >-
    Combine native-promoter Z-ISO-GFP complementation of an Arabidopsis z-iso
    mutant (checking rescue of the dark carotenoid phenotype) with immunoblotting
    of purified envelope, stroma and thylakoid fractions and carbonate/salt-wash
    tests of membrane association; probe PDS/ZDS co-migration by blue-native PAGE.
  experiment_type: subcellular localization by fluorescence microscopy and fractionation
- hypothesis: >-
    The NnrU ancestry of Z-ISO is not sufficient for carotenoid-isomerase
    activity; the acquired heme-based isomerase function is lineage-specific.
  description: >-
    Complement an Arabidopsis z-iso null and a cyanobacterial z-iso deletion with
    plant Z-ISO versus a bacterial NnrU protein, scoring restoration of
    di-cis-zeta-carotene formation and downstream carotenoids; test structure-
    guided heme-ligand mutants for loss of activity.
  experiment_type: cross-complementation with structure-guided mutagenesis
