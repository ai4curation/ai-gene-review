- id: PMID:20335404
  title: Isolation and characterization of the Z-ISO gene encoding a missing component
    of carotenoid biosynthesis in plants.
  findings:
  - statement: >-
      Z-ISO was identified from maize and Arabidopsis mutants, and functional
      expression in E. coli demonstrated isomerization of the 15-cis bond of
      9,15,9'-tri-cis-zeta-carotene, proving it encodes the missing pathway step.
    supporting_text: >-
      Functional testing of the gene product in Escherichia coli showed
      isomerization of the 15-cis double bond in 9,15,9'-tri-cis-zeta-carotene,
      proving that Z-ISO encoded the missing step.
    reference_section_type: ABSTRACT
  - statement: >-
      Z-ISO is required for carotenoid biosynthesis in both illuminated and dark
      tissues, i.e. the enzymatic step cannot be fully replaced by light-driven
      photoisomerization.
    supporting_text: >-
      Z-ISO was found to be important for both light-exposed and "dark" tissues.
    reference_section_type: ABSTRACT
  - statement: >-
      Z-ISO is conserved across plants, algae, diatoms and cyanobacteria and
      evolved from an NnrU-related bacterial ancestor.
    supporting_text: >-
      Z-ISO evolved from an ancestor related to the NnrU (for nitrite and nitric
      oxide reductase U) gene required for bacterial denitrification
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary identification paper (Chen, Li, Wurtzel 2010); the
      source of the TAIR IDA (GO:0090471) and IMP (GO:0016120) rows. Cached
      record is abstract-only, but the abstract states the enzymatic result and
      the requirement in dark tissue explicitly.
- id: PMID:26075523
  title: Control of carotenoid biosynthesis through a heme-based cis-trans isomerase.
  findings:
  - statement: >-
      Plant Z-ISO is a bona fide enzyme and integral membrane protein that
      independently catalyses the 15-15' cis-trans isomerization.
    supporting_text: Z-ISO is a bona fide enzyme and integral membrane protein.
    reference_section_type: ABSTRACT
  - statement: >-
      Z-ISO isomerization requires a ferrous heme b cofactor with
      redox-regulated axial-ligand switching, an unprecedented heme b chemistry.
    supporting_text: >-
      isomerization depends upon a ferrous heme b cofactor that undergoes
      redox-regulated ligand switching between the heme iron and alternate Z-ISO
      amino acid residues.
    reference_section_type: ABSTRACT
  - statement: >-
      The decisive in vitro biochemistry was performed with Z-ISO isolated from
      Zea mays.
    supporting_text: isolated Z-ISO from Zea mays
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (PMID confirmed by exact-title search); full text cached.
      Establishes the integral-membrane character and the ferrous-heme-b
      dependence of plant Z-ISO. Experiments used the maize ortholog, so the
      heme-binding and membrane conclusions are transferred to Arabidopsis
      Q9SAC0 by orthology (basis for the NEW heme binding ISS annotation).
