    summary: >-
      Proposed process annotation at the carotenoid-pathway level. Z-ISO
      catalyses a committed step of the route that builds carotenoids, and its
      loss abolishes carotenoids in the dark.
    action: NEW
    reason: >-
      Participation test passed: Z-ISO itself performs a catalytic step of
      carotenoid biosynthesis. Comparator check passed: the sibling pathway
      enzyme CRTISO carries GO:0016117 and the carotene backbone module uses
      GO:0016117 as the module-level process. Not redundant with the existing
      GO:0016120 carotene biosynthetic process: in the current ontology
      GO:0016120 is not a descendant of GO:0016117, so a GO:0016117 query
