description: >-
  Z-ISO (15-cis-zeta-carotene isomerase, EC 5.2.1.12; At1g10830) is a
  nuclear-encoded, plastid-targeted integral membrane enzyme of the poly-cis
  branch of carotenoid biosynthesis found in plants, algae, diatoms and
  cyanobacteria. It catalyses the cis-to-trans isomerization of the central
  15-cis (15-15') double bond of 9,9',15-tri-cis-zeta-carotene to give
  9,9'-di-cis-zeta-carotene (Rhea:30967). In the plastid poly-cis desaturation
  route it acts between the two plastoquinone-dependent desaturases: phytoene
  desaturase (PDS) produces the tri-cis-zeta-carotene substrate, Z-ISO
  isomerizes its 15-cis bond, and zeta-carotene desaturase (ZDS) then converts
  the product toward prolycopene, which prolycopene isomerase (CRTISO)
  isomerises to all-trans-lycopene, the precursor of all cyclic carotenes and
  xanthophylls. Isomerization of the 15-cis bond can also occur photochemically
  in the light, so Z-ISO is strictly required for carotenoid formation in the
  dark and in poorly illuminated plastids (endosperm, roots, etiolated
  seedlings) and enhances pathway efficiency in illuminated tissue; loss of
  function abolishes carotenoids in the dark and delays greening. The protein
  carries an N-terminal chloroplast transit peptide and multiple transmembrane
  helices, resides in plastid (chloroplast) membranes, and is an unusual
  heme-b-dependent isomerase whose activity requires the reduced (ferrous) heme
  cofactor. Its NnrU domain (Pfam PF07298) reflects an evolutionary origin from
  a bacterial NnrU-related membrane protein recruited into carotenogenesis.
