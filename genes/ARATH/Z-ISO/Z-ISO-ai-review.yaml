  evidence_type: IMP
  original_reference_id: PMID:20335404
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Chen et al. isolated maize and Arabidopsis Z-ISO mutants and identified
      the gene, showing that the enzyme performs the 15-cis isomerization step
      required to convert 15-cis-phytoene toward all-trans-lycopene; the mutant
      lacks carotenoids in the dark. Z-ISO's substrate and product are both
      zeta-carotenes (carotenes), and it catalyses a step of the carotene
      backbone route, so carotene biosynthetic process is the correct process.
      Cached record is abstract-only (full_text_available: false) but states the
      functional and phenotypic result explicitly.
    action: ACCEPT
    reason: >-
      Core biological process: Z-ISO itself performs a catalytic step of
      carotene biosynthesis, not merely a requirement for it. Curator use of the
      acts_upstream_of_or_within qualifier does not weaken the term choice, which
      is well matched to the enzyme's product (a carotene).
    supported_by:
    - reference_id: PMID:20335404
      supporting_text: >-
        Functional testing of the gene product in Escherichia coli showed
        isomerization of the 15-cis double bond in 9,15,9'-tri-cis-zeta-carotene,
        proving that Z-ISO encoded the missing step.
      reference_section_type: ABSTRACT
    - reference_id: PMID:20335404
