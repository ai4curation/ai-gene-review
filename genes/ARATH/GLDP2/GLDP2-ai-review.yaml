    label: glycine cleavage complex
  evidence_type: IDA
  original_reference_id: PMID:32311173
  review:
    summary: >-
      Mass-spectrometric stoichiometry of the Arabidopsis leaf glycine decarboxylase complex detects both
      P-protein isoforms (GCS-P1 = GLDP1, GCS-P2 = GLDP2) as components of the complex.
    action: NEW
    reason: >-
      GLDP2 has no cellular-component annotation to the glycine cleavage complex in GOA, although its
      paralogous H protein (GDCH) does. The P protein is a defining subunit of the P/H/T/L complex, all
      four proteins are required for activity, and the Arabidopsis leaf GDC contains GLDP1 and GLDP2 in
      a 4:1 ratio. Abstract-only cache, but the abstract states the measurement directly.
    supported_by:
