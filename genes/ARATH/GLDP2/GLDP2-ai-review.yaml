- term:
    id: GO:0005773
    label: vacuole
  evidence_type: HDA
  original_reference_id: PMID:28887381
  qualifier: located_in
  review:
    summary: >-
      High-throughput proteomic detection of GLDP2 in a washed microsomal (membrane-associated) fraction
      assigned to vacuole preparation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GLDP2 is an abundant mitochondrial matrix enzyme with a mitochondrial transit peptide and an experimentally established mitochondrial location. A single bulk-proteomics detection in a washed microsomal (membrane-associated) fraction assigned to vacuole fraction is best explained by carry-over of this very abundant leaf protein, and no targeted study places the P protein in this compartment. The study itself notes that abundant soluble complexes contaminate the washed microsomes. Under the ARATH corpus convention (projects/ARATH/organelle-audit.md, rule 3) a high-throughput proteomics hit for a protein localized elsewhere is marked as over-annotated rather than removed: the detection is a real observation, most likely contamination, but no targeted experiment excludes the compartment.
    supported_by:
    - reference_id: PMID:28887381
      supporting_text: The uncapped proteasome is an abundant, predominantly cytosolic complex that is a likely contaminant in the washed microsomes.
    - *id004
