- term:
    id: GO:0009853
    label: photorespiration
  evidence_type: IGI
  original_reference_id: PMID:17496108
  review:
    summary: >-
      GLDP2 is the minor P protein of the leaf GDC; it substitutes for GLDP1 in gldp1 mutants, and the
      gldp1 gldp2 double mutant lacks GDC entirely.
    action: NEW
    reason: >-
      Participation test: GLDP2 catalyses a step of the photorespiratory C2 cycle (mitochondrial glycine
      decarboxylation), so it does part of the work of the process rather than being required for or consumed
      by it. Comparator check (QuickGO, Arabidopsis, GO:0009853): enzymes catalysing other C2-cycle steps
      carry the term (SHM1 IMP, GLYK IMP/IBA, HPR TAS, GGAT1 TAS, PLGG1 IMP), whereas none of the GDC
      subunits (GLDP1, GLDP2, GDCH, GDCST) do; this absence looks like a gap rather than a convention.
      The term is not an ancestor or descendant of GO:0019464.
    supported_by:
    - &id010
      reference_id: PMID:22303256
      supporting_text: The combined reaction of glycine decarboxylase (GLD) and serine hydroxymethyltransferase (SHM) represents the mitochondrial part of the major photorespiratory pathway.
    - *id008
    - *id009
