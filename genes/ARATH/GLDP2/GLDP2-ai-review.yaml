id: O80988
gene_symbol: GLDP2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  GLDP2 (At2g26080) encodes the second Arabidopsis P protein (glycine dehydrogenase (decarboxylating),
  EC 1.4.4.2) of the mitochondrial glycine decarboxylase complex (GDC, glycine cleavage system). Like
  its 91%-identical paralog GLDP1, it is a PLP-dependent enzyme that decarboxylates glycine and transfers
  the aminomethyl group to the lipoyl arm of the H protein, the first step of the GDC reaction that, with
  the T and L proteins, converts glycine to 5,10-methylene-tetrahydrofolate, CO2, NH3 and NADH in the
  mitochondrial matrix. GLDP2 is the minor leaf isoform (about one quarter of GLDP1 in the leaf complex),
  has weaker catalytic activity than GLDP1 and is relatively more expressed in roots. It is redundant
  with GLDP1 for photorespiration and one-carbon metabolism: single mutants are near wild type, while
  loss of both P proteins is seedling lethal even under non-photorespiratory conditions. GLDP2 can form
  heterodimers with GLDP1 and is selectively degraded via the F-box protein InLYP1.
