  original_reference_id: PMID:32344669
  qualifier: enables
  review:
    summary: >-
      Leaf RNA interactome capture (ptRIC) recovered glycine dehydrogenase among UV-crosslinked poly(A)
      RNA-associated proteins.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper reports the protein only as one of several metabolic enzymes newly captured in the leaf
      RBPome, with no follow-up validation, no mapped RNA-binding region and no defined mRNA target. The
      P protein is a mitochondrial matrix enzyme, and the observation does not establish a biological
      mRNA-binding function. The detection may be real but is not informative about gene function, so
      the annotation is kept but flagged as an over-interpretation of a screen.
