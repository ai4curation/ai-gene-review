core_functions:
- description: LSD1-type histone H3K4 demethylase that, in a complex with LD and SDG26, removes H3K4me1
    from the FLC gene body (and other convergently transcribed genes) downstream of FCA/FY-mediated proximal
    polyadenylation of antisense transcripts, leading to reduced FLC transcription, PRC2 silencing and
    promotion of flowering.
  molecular_function:
    id: GO:0032453
    label: histone H3K4 demethylase activity
  directly_involved_in:
  - id: GO:0045814
    label: negative regulation of gene expression, epigenetic
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:32541063
    supporting_text: Here, we show that FLD tightly associates with LUMINIDEPENDENS (LD) and SET DOMAIN
      GROUP 26 (SDG26) in vivo, and, together, they prevent accumulation of monomethylated H3K4 (H3K4me1)
      over the FLC gene body.
  - reference_id: PMID:33649596
    supporting_text: Our genome-wide chromatin profiling revealed that FLD, as well as its associating
      factor LUMINIDEPENDENS9, downregulates histone H3K4me1 in regions with convergent overlapping transcription.
  - reference_id: PMID:17921315
    supporting_text: Two of the homologs, LSD1-LIKE1 ( LDL1 ) and LSD1-LIKE2 ( LDL2 ), act in partial
      redundancy with FLOWERING LOCUS D ( FLD ; an additional homolog of LSD1 ) to repress FLC expression.
suggested_questions:
- question: Does purified FLD (alone or with LD/SDG26) demethylate H3K4me1/me2 nucleosomes in vitro, and
    does it require a CoREST-like partner as human LSD1 does?
- question: Is FLD recruited to FLC by FY-SDG26 contacts during proximal termination, by the APRF1/LD
    phosphatase module, or by elongating Pol II directly?
suggested_experiments:
- description: Reconstitute recombinant FLD (with or without LD/SDG26) and test FAD-dependent demethylation
    of H3K4me1/me2 nucleosomes; complement fld with catalytic-dead FLD (FAD-binding or active-site lysine
    mutants) and measure FLC H3K4me1 and flowering time.
  hypothesis: FLD catalytic activity is required for FLC repression and directly demethylates H3K4me1.
  experiment_type: In vitro enzymology + genetic complementation
