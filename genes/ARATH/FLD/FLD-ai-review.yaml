taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FLOWERING LOCUS D (FLD) is a nuclear, chromatin-associated LSD1-family protein with SWIRM
  and flavin amine-oxidase domains. Conserved architecture and target-specific chromatin experiments support
  histone H3K4 demethylase activity, particularly removal of H3K4me1, although the cited studies do not
  establish a purified FLD catalytic reaction. FLD associates with LD and SDG26 and participates in repression
  of FLOWERING LOCUS C (FLC), promoting the floral transition. RNA processing and termination are linked
  to this chromatin regulation through FY-associated machinery and an APRF1/LD/TOPP4 module. FLD also
  regulates genes with convergent overlapping transcription and interacts with histone deacetylases. Additional
  genetic roles include systemic acquired resistance and dehydroabietinal-responsive flowering.
