id: Q9CAE3
gene_symbol: FLD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FLOWERING LOCUS D (FLD) is a plant homolog of the human lysine-specific demethylase LSD1
  (KDM1A), with an N-terminal SWIRM domain and a C-terminal FAD-dependent amine oxidase domain. FLD is
  a chromatin-associated histone H3K4 demethylase that promotes flowering in the autonomous pathway by
  repressing the floral repressor FLOWERING LOCUS C (FLC). FLD tightly associates in vivo with LUMINIDEPENDENS
  (LD) and the SET-domain protein SDG26, forming a co-transcriptional chromatin module that removes H3K4me1
  over the FLC gene body; SDG26 contacts the CPSF subunit FY, coupling FCA/FY-mediated proximal polyadenylation
  of FLC antisense (COOLAIR) transcripts to FLD-dependent demethylation, reduced H3K36me3 and increased
  PRC2-mediated H3K27me3. Genome-wide, FLD localizes to actively transcribed genes with elongating RNA
  polymerase II and removes H3K4me1 at loci with convergent overlapping (antisense) transcription. FLD
  also interacts with the histone deacetylases HDA6 and HDA5 and is required for histone deacetylation
  at FLC, and acts partially redundantly with its paralogs LDL1 and LDL2. FLD is additionally required
  for systemic acquired resistance and for dehydroabietinal-promoted flowering.
