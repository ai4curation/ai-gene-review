    label: UDP-glucosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00029194
  review:
    summary: >-
      ARBA machine-learning assignment of UDP-glucosyltransferase activity. Correct, and the
      direct parent of the specific activity demonstrated for UGT74C1: glucosylation of
      thiohydroximates to desulfoglucosinolates (thiohydroximate beta-D-glucosyltransferase
      activity, GO:0047251, EC 2.4.1.195).
    action: MODIFY
    reason: >-
      The annotation is sound but too general; UGT74C1 expresses thiohydroximate UGT
      activity in planta and complements ugt74b1, so the specific term GO:0047251 should be
      used. The comparator paralog UGT74B1 carries GO:0047251 by IDA.
    proposed_replacement_terms:
