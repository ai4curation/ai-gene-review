gene_symbol: UGT74C1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  UGT74C1 (At2g31790) is a soluble family 1 UDP-glycosyltransferase of the UGT74 clade
  that acts as a thiohydroximate S-glucosyltransferase in glucosinolate core structure
  biosynthesis. It transfers glucose from UDP-glucose to the sulfur of thiohydroximates
  (produced by the C-S lyase SUR1), forming desulfoglucosinolates that are then sulfated
  by desulfoglucosinolate sulfotransferases. UGT74C1 is specialized for, and co-expressed
  with, the methionine-derived (aliphatic) branch, whereas its paralog UGT74B1 is the
  principal enzyme of the core pathway and particularly of the tryptophan-derived (indole)
  branch; UGT74C1 functions as an accessory enzyme that can complement the chemotypes and
  phenotypes of ugt74b1 mutants when expressed and shows thiohydroximate glucosyltransferase
  activity in planta. Like other family 1 UGTs, it lacks a membrane anchor or targeting
  peptide and is expected to act in the cytosol.
