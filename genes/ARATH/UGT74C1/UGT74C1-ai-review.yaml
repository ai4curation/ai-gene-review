- term:
    id: GO:0019761
    label: glucosinolate biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:24779768
  review:
    summary: >-
      UGT74C1 catalyzes the S-glucosylation step of glucosinolate core structure formation
      (thiohydroximate to desulfoglucosinolate). Genetic analysis of the UGT74 clade shows
      a special role in aliphatic glucosinolate synthesis, and UGT74C1 complements ugt74b1
      glucosinolate chemotypes.
    action: NEW
    reason: >-
      Participation test: UGT74C1 itself catalyzes a step of the pathway (S-glucosylation of
      the thiohydroximate), so it is not merely a substrate or regulator. Comparator check:
      the other enzymes in the same role and pathway position carry this term - the
      paralog UGT74B1 (IMP and IBA), and CYP83A1, CYP79F1/F2 and SUR1 at adjacent steps -
      so its absence for UGT74C1 is a gap rather than a convention.
    supported_by:
    - reference_id: PMID:24779768
      supporting_text: >-
        Systematic genetic analysis of this clade indicates that UGT74C1 plays a special
        role in the synthesis of aliphatic glucosinolates, a conclusion strongly supported
        by phylogenetic and gene expression analyses.
    - reference_id: PMID:24779768
      supporting_text: >-
        provides conclusive evidence for UGT74C1 being an accessory enzyme in glucosinolate
        biosynthesis
core_functions:
- description: >-
    UGT74C1 is a cytosolic thiohydroximate S-glucosyltransferase that glucosylates
    methionine-derived thiohydroximates with UDP-glucose to form desulfoglucosinolates,
    acting as an aliphatic-branch-specialized accessory enzyme alongside UGT74B1 in
    glucosinolate core structure biosynthesis.
