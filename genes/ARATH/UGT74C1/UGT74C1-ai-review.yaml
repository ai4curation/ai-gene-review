  review:
    summary: >-
      PAINT placement of flavonol 3-O-glucosyltransferase activity at a deep family 1 UGT
      node (donors from the UGT76E group). UGT74C1 has no reported flavonol activity; its
      demonstrated and physiologically relevant activity is S-glucosylation of
      thiohydroximates, and the UGT74 clade analysis singled out glucosinolate synthesis as
