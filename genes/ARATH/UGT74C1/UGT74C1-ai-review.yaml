suggested_questions:
- question: What are the kinetic parameters and chain-length preferences of recombinant
    UGT74C1 toward short- versus long-chain methylthioalkyl thiohydroximates compared with
    UGT74B1?
- question: Under which environmental conditions does UGT74C1 contribute measurably to
    aliphatic glucosinolate flux in wild-type plants where UGT74B1 is present?
suggested_experiments:
- hypothesis: UGT74C1 prefers methionine-derived over tryptophan-derived thiohydroximates.
  description: Express recombinant UGT74C1 and UGT74B1 and determine kinetics on a panel
    of synthetic aliphatic, benzyl and indolyl thiohydroximates.
  experiment_type: enzyme kinetics
- hypothesis: UGT74C1 becomes limiting for aliphatic glucosinolate synthesis under stress.
  description: Profile aliphatic glucosinolates in ugt74c1 and ugt74b1 ugt74c1 lines under
    jasmonate treatment, herbivory and sulfur limitation.
  experiment_type: genetic and metabolite profiling
