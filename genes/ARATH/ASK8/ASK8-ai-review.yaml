  title: Autophosphorylation profiling of Arabidopsis protein kinases using the cell-free system.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; a large-scale cell-free autophosphorylation screen, the source of the
      HDA rows. The ASK8-specific result could not be inspected.
- id: PMID:17427040
  title: The Arabidopsis thaliana GSK3/Shaggy like kinase AtSK3-2 modulates floral cell expansion.
  findings:
  - statement: AtSK3-2 (ASK8; K167 and R178 numbering matches Q96287) K167A is inactive; R178A loses
      most primed activity, and its overexpression reduces floral organ cell size.
    supporting_text: However, the mutant protein AtSK3-2-K167A showed no activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. The gene identity was checked by matching the mutated residues (Lys167,
      Arg178) to the Q96287 sequence; cited by PMID:20128883 as the ASK-theta knockout source.
