gene_symbol: ASK8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  ASK8 (ASK-theta, AtSK32/AtSK3-2; At4g00720) is a group-III GSK3/SHAGGY-like serine/threonine
  protein kinase of Arabidopsis thaliana, one of ten plant GSK3 homologues. It has a canonical
  CMGC kinase domain (ATP-binding Lys167, catalytic Asp263, activation-loop Tyr298) and
  autophosphorylates. ASK-theta acts in brassinosteroid (BR) signalling downstream of the BRI1
  receptor: its in vivo kinase activity is suppressed by BR and by BRI1, and it directly
  phosphorylates the BES1/BZR1-family transcription factors BES1, BZR1 and BEH2 in vitro and in
  plant cells, with which it also interacts. Overexpression of active (but not kinase-dead) ASK-theta
  produces a bri1-like, BR-insensitive dwarf that accumulates BRs, consistent with an inhibitory,
  BIN2-like role on BR-responsive transcription. The protein is mainly nuclear with some cytoplasmic
  signal. Single knockouts have no obvious growth phenotype, indicating redundancy with the group-II
  kinases BIN2, ASK-iota and ASK-zeta. A partially inactive R178A mutant reduces floral organ cell
  expansion when overexpressed.
