- id: PMID:20128883
  title: ASKtheta, a group-III Arabidopsis GSK3, functions in the brassinosteroid signalling pathway.
  findings:
  - statement: ASK-theta activity is suppressed by BR and BRI1; it directly phosphorylates BES1, BZR1
      and BEH2 in vitro and in protoplasts; it is mainly nuclear; overexpression gives a bri1-like
      BR-insensitive dwarf.
    supporting_text: Overall, these data provide strong evidence that ASKtheta is a novel component
      of the BR signalling cascade, targeting the transcription factors BES1, BZR1 and BEH2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; it is the primary experimental paper for At4g00720 (ASK-theta) and
      the source of the IDA/IMP GOA rows.
