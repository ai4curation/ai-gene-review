suggested_questions:
- question: Does endogenous ASK8 negatively regulate brassinosteroid signalling (GO:1900458), as its
    overexpression phenotype suggests, or is its physiological contribution to BES1/BZR1 phosphorylation
    negligible relative to BIN2, ASK-iota and ASK-zeta?
- question: How is ASK8 activity repressed by BR - via BSU1-family dephosphorylation of the activation-loop
    tyrosine (Tyr298), proteasomal turnover, or another mechanism?
- question: Does ASK8 require priming phosphorylation of its substrates, as suggested by the R178A
    mutant, and what are its in planta substrates beyond the BES1/BZR1 family?
suggested_experiments:
- description: Test whether BES1/BZR1 phosphorylation and BR responses are further reduced in a bin2 askι askζ
    askθ (ask8) quadruple mutant compared with the triple mutant.
  experiment_type: genetic interaction analysis
- description: Map ASK8-dependent phosphosites on BEH2, BES1 and BZR1 by phosphoproteomics, and test the
    effect of Tyr298 mutation and BSU1 co-expression on ASK8 activity.
  experiment_type: phosphoproteomics
