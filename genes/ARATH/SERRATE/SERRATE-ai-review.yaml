    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: TAS
  original_reference_id: PMID:11402159
  qualifier: acts_upstream_of_or_within
  review:
    summary: The original TAS came from the cloning paper's speculation that SE acts
      through chromatin modification. Later ChIP and proteomic work shows that
      chromatin-bound SE associates with paused and elongating Pol II and promotes Pol II
      occupancy on more than 1000 mainly intronless genes.
    action: MODIFY
    reason: SE does have a transcriptional role, but the evidence supports a more specific
      term. SE positively regulates Pol II transcription of intronless target genes
      (PMID:30152752). The 2001 speculation about chromatin modification has not been
      borne out. This role is non-core compared with miRNA processing.
    proposed_replacement_terms:
    - id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
    supported_by:
    - reference_id: PMID:30152752
      supporting_text: Chromatin-bound SE liaised with paused and elongating polymerase II
        complexes and promoted their association with intronless target genes.
- term:
    id: GO:0008380
    label: RNA splicing
  evidence_type: IMP
  original_reference_id: PMID:18550839
  qualifier: involved_in
  review:
    summary: se mutants accumulate many partially spliced transcripts, as do cbp20 and
      cbp80 mutants. These defects are not caused by reduced miRNA processing.
    action: MODIFY
    reason: The defects concern Pol II pre-mRNA introns spliced by the spliceosome, so
      mRNA splicing, via spliceosome is the supported specific term. Tiling-array
      evidence (abstract only here) shows intron retention shared with CBC mutants and
      not seen in other miRNA-pathway mutants. This indicates a direct, CBC-linked role.
    proposed_replacement_terms:
    - id: GO:0000398
      label: mRNA splicing, via spliceosome
    supported_by:
    - reference_id: PMID:18550839
      supporting_text: Whole-genome tiling array analyses reveal that se, abh1/cbp80, and cbp20
        mutants also share similar splicing defects, leading to the accumulation of many
        partially spliced transcripts.
    - reference_id: PMID:18550839
      supporting_text: introns retained in se, abh1/cbp80, and cbp20 mutants are not affected
        by mutations in other genes required for miRNA processing or for nonsense-mediated
