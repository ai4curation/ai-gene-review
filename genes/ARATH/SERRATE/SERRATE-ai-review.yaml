- term:
    id: GO:0010267
    label: ta-siRNA processing
  evidence_type: IMP
  original_reference_id: PMID:16889646
  qualifier: acts_upstream_of_or_within
  review:
    summary: se mutants have less ta-siRNA. ta-siRNA biogenesis is triggered by
      miRNA-directed cleavage of TAS transcripts (miR173, miR390), so the effect follows
      from the SE requirement for miRNA production.
    action: KEEP_AS_NON_CORE
    reason: The phenotype is real, but the most likely explanation is indirect, through
      production of the initiating miRNAs. DCL4/DRB4 process ta-siRNA precursors, not
      DCL1/SE. This matches the DRB1/HYL1 review, which keeps the same row as non-core.
