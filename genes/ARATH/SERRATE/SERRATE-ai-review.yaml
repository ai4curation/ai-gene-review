- term:
    id: GO:0000381
    label: regulation of alternative mRNA splicing, via spliceosome
  evidence_type: IMP
  original_reference_id: PMID:24137006
  qualifier: acts_upstream_of_or_within
  review:
    summary: SE mutants (se-1) show alternative splicing changes that overlap those of
      cbp20/cbp80 mutants, mainly in 5' splice site choice of first introns. SE binds both
      CBC subunits and acts with CBC in this role, separately from its role in miRNA
      processing.
    action: ACCEPT
    reason: High-resolution RT-PCR splicing panels in se-1 (full text available) show
      CBC-like changes in alternative splicing that differ from those in hyl1-2 or dcl1-7.
      So this is a direct SE/CBC function, not a downstream effect of reduced miRNA
      levels. It is part of the conserved CBC-associated role of SE/ARS2 in RNA
      processing.
    supported_by:
    - reference_id: PMID:24137006
      supporting_text: AtSE influences AS in a similar way to the cap-binding complex (CBC),
        preferentially affecting selection of 5' splice site of first introns
    - reference_id: PMID:24137006
      supporting_text: Thus, the role of SERRATE in AS regulation is distinct from that of
        HYL1 and DCL1, and is similar to the regulation of AS in which CBC is involved.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: ISS
  original_reference_id: PMID:11402159
  qualifier: enables
  review:
    summary: This ISS annotation comes from the original cloning paper. That paper
      noticed a C2H2 zinc finger and speculated that SE acts through chromatin
      modification. No later work has shown that SE binds DNA directly.
    action: REMOVE
    reason: The single SE zinc finger is non-canonical. Structural and biochemical work
      shows that it, together with the N-terminal and core regions, binds RNA and the
      protein DCL1. It does not bind DNA. SE does associate with chromatin, but through
      RNA polymerase II complexes rather than direct DNA binding (PMID:30152752). The
      inference from the zinc-finger motif is not supported by later evidence.
    supported_by:
    - reference_id: PMID:11402159
      supporting_text: suggests a role for the SE gene product in regulating changes in gene
        expression via chromatin modification
    - reference_id: PMID:23921632
      supporting_text: SE uses its N-terminal domain to bind to RNA and requires both N-terminal
        and ZnF domains to bind to DCL1.
    - reference_id: PMID:30152752
      supporting_text: Chromatin-bound SE liaised with paused and elongating polymerase II
        complexes and promoted their association with intronless target genes.
    source_defects:
    - defect_type: WRONG_TERM
      resource: TAIR
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: ECO:0000250
      confidence: PROBABLE
      explanation: >-
        This 2003 TAIR row asserts DNA binding for SERRATE (Q9ZVD0, AT2G27100)
        by ISS, citing the SE cloning paper (PMID:11402159), but has no
        With/From entry naming a characterized homolog. The cloning paper noted
        a single C2H2-type zinc finger and speculated about chromatin
        modification; a motif observation of this kind is not a
        sequence-similarity transfer. Later biochemical work shows that the SE
        N-terminal and zinc-finger regions bind RNA and DCL1, and SE associates
        with chromatin through RNA polymerase II complexes rather than by
        binding DNA itself. We suggest withdrawing the row.
      supported_by:
