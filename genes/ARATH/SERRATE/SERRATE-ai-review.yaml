- term:
    id: GO:0170054
    label: ribonuclease activator activity
  evidence_type: IDA
  original_reference_id: PMID:18632569
  qualifier: enables
  review:
    summary: Purified recombinant SE increases the rate and accuracy of DCL1 cleavage of
      pri- and pre-miRNA substrates. Stimulation depends on SE binding DCL1 through its
      zinc finger and does not require SE binding to RNA.
    action: NEW
    reason: SE is a non-catalytic cofactor that binds DCL1 and increases its activity.
      This matches the definition of ribonuclease activator activity. Two independent
      reconstitution studies show it, and domain mapping shows that DCL1 stimulation by SE
      can happen without SE binding RNA. This is SE's own activity on the nuclease, not a
      necessity phenotype. DCL1 performs the cleavage, and SE's activity is to activate
      DCL1. The comparator check passes. HYL1/DRB1, the other DCL1 cofactor, is given the
      same MF in its review and in the plant_mirna_biogenesis module, which already
      asserts GO:0170054 for SE. The term does not duplicate any existing SE annotation.
    supported_by:
    - reference_id: PMID:18632569
      supporting_text: We show that recombinant HYL1 and SE proteins accelerate the rate of
        DCL1-mediated cleavage of pre- and pri-miR167b substrates and promote accurate processing.
    - reference_id: PMID:23921632
      supporting_text: the interaction with the ZnF domain of SE becomes indispensible and
        stimulates the activity of DCL1 without requiring SE binding to RNA
- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  evidence_type: IDA
  original_reference_id: PMID:33288888
  qualifier: enables
  review:
    summary: SE forms droplets in vitro and draws DCL1, HYL1 and pri/pre-miRNAs into them.
      SE mutation abolishes D-body formation in vivo, and disrupting SE phase separation
      reduces miRNA processing.
    action: NEW
    reason: This is an activity of SE itself. SE is the component that drives
      condensation, and the other microprocessor components are recruited into the SE
      droplets. Both in vitro reconstitution and in vivo loss-of-function show that SE
      organizes the D-body condensate, which fits the term definition. The cached source is
      abstract-only, but the abstract states the key findings explicitly. The term is not
      an ancestor or descendant of any other SE term.
    supported_by:
    - reference_id: PMID:33288888
      supporting_text: SE forms droplets and drives DCL1, HYL1 and pri/pre-miRNAs into the
        droplets in vitro, and mutation of SE abrogates the formation of D-bodies in vivo
    - reference_id: PMID:33288888
      supporting_text: Disruption of SE phase separation greatly reduces its activity in
        promoting miRNA processing both in vitro and in vivo.
