  review:
    summary: SE is needed to produce miRNAs, which then guide AGO1-mediated silencing.
      SE itself does not take part in the silencing step, and it is not needed for
      sense-transgene PTGS.
    action: MARK_AS_OVER_ANNOTATED
    reason: In GO, miRNA processing (GO:0035196) is a separate process under regulatory
      ncRNA processing, not a part of ncRNA-mediated gene silencing. SE contributes to
