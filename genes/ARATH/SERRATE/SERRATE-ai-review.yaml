id: Q9ZVD0
gene_symbol: SERRATE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  SERRATE (SE, At2g27100) is a 720-residue nuclear protein of the conserved ARS2
  family (metazoan ortholog ARS2/SRRT). It has a structured core (roughly residues
  194-543) carrying a single non-canonical C2H2-type zinc finger, flanked by long
  intrinsically disordered N- and C-terminal regions. SE is a cofactor of the
  plant microprocessor. It binds the RNase III enzyme DICER-LIKE1 (DCL1) and the
  dsRNA-binding protein HYPONASTIC LEAVES1 (HYL1/DRB1), and it binds RNA. With
  these partners it raises the rate and accuracy of DCL1 cleavage of primary and
  precursor miRNAs. SE is required for the accumulation of most miRNAs and,
  indirectly, of miRNA-triggered trans-acting siRNAs. SE forms liquid-like
  condensates that recruit DCL1, HYL1 and pri-miRNAs, and it is needed to form
  nuclear dicing bodies. It also acts as a scaffold that brings other proteins to
  the processing complex or its RNA substrates: the phosphatase CPL1 (to
  dephosphorylate HYL1), the chromatin remodeler CHR2/BRM, and the NEXT
  exosome-targeting complex that degrades pri-miRNAs. Like ARS2, SE associates
  with the nuclear cap-binding complex (CBP20/CBP80). Together with this complex
  it promotes pre-mRNA splicing and affects alternative 5' splice site choice in
  first introns. Chromatin-bound SE also associates with RNA polymerase II and
  promotes transcription of many intronless, stress-responsive genes. SE is
  located in the nucleoplasm, mainly in nuclear speckles, and transiently in
  dicing bodies. Null alleles are embryo-lethal. Weak alleles (se-1 to se-3)
  have serrated, curled or polarity-defective leaves, altered phyllotaxy and
  altered phase transitions. These defects largely reflect reduced miRNA
  regulation of developmental regulators such as the HD-ZIP III genes.
