- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: ISS
  original_reference_id: PMID:11118137
  qualifier: enables
  review:
    summary: The genome-wide transcription-factor census counted SE as a transcription
      factor because it has a C2H2 zinc finger. SE is an RNA-processing cofactor and
      has never been shown to be a sequence-specific DNA-binding transcription factor.
    action: REMOVE
    reason: The cited paper is a motif-based genome census (abstract only). It does not
      report any experiment on SE. Later work places SE in pri-miRNA processing, CBC-linked
      splicing and Pol II-associated transcription of intronless genes. In none of these
      does SE act as a sequence-specific DNA-binding transcription factor.
    supported_by:
    - reference_id: PMID:11118137
      supporting_text: Arabidopsis transcription factors that belong to families common to all
        eukaryotes do not share significant similarity with those of the other kingdoms
        beyond the conserved DNA binding domains
    - reference_id: PMID:18632569
      supporting_text: We show that recombinant HYL1 and SE proteins accelerate the rate of
        DCL1-mediated cleavage of pre- and pri-miR167b substrates and promote accurate processing.
    source_defects:
    - defect_type: WRONG_TERM
      resource: TAIR
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: ECO:0000250
      confidence: PROBABLE
      explanation: >-
        This 2003 TAIR row asserts DNA-binding transcription factor activity for
        SERRATE (Q9ZVD0, AT2G27100) by ISS, but it has no With/From entry, so no
        characterized homolog is named and the sequence-similarity inference
        cannot be checked. The cited reference (Riechmann et al. 2000) is a
        genome-wide census of Arabidopsis transcription-factor families, not a
        characterization of an SE homolog; SE was presumably counted because of
        its single C2H2-type zinc finger. SE belongs to the ARS2 family of RNA
        effector proteins, whose characterized members act in RNA processing,
        not as sequence-specific DNA-binding transcription factors, so no valid
        ISS source for this activity exists. We suggest deleting the row (or,
        if TAIR wishes to keep it, supplying the With/From homolog so it can be
        assessed).
      supported_by:
