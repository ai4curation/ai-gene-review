core_functions:
- description: SE is a non-catalytic cofactor of the plant microprocessor. It binds DCL1
    and increases the rate and accuracy of DCL1 cleavage of primary and precursor miRNAs,
    so that correct miRNA/miRNA* duplexes are produced.
  molecular_function:
    id: GO:0170054
    label: ribonuclease activator activity
  directly_involved_in:
  - id: GO:0031053
    label: primary miRNA processing
  locations:
  - id: GO:0010445
    label: nuclear dicing body
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:18632569
    supporting_text: We show that recombinant HYL1 and SE proteins accelerate the rate of
      DCL1-mediated cleavage of pre- and pri-miR167b substrates and promote accurate processing.
  - reference_id: PMID:23921632
    supporting_text: the interaction with the ZnF domain of SE becomes indispensible and
      stimulates the activity of DCL1 without requiring SE binding to RNA
- description: SE drives phase separation that assembles nuclear dicing bodies. It
    concentrates DCL1, HYL1 and pri/pre-miRNAs into condensates where processing takes
    place.
  molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
  directly_involved_in:
  - id: GO:0031053
    label: primary miRNA processing
  locations:
  - id: GO:0010445
    label: nuclear dicing body
  supported_by:
  - reference_id: PMID:33288888
    supporting_text: SE forms droplets and drives DCL1, HYL1 and pri/pre-miRNAs into the
      droplets in vitro, and mutation of SE abrogates the formation of D-bodies in vivo
- description: SE is an RNA-binding adaptor associated with the nuclear cap-binding
    complex. It recruits regulatory and effector proteins to Pol II transcripts and to the
    processing complex, including CPL1 for HYL1 dephosphorylation, CHR2 for pri-miRNA
    remodeling and the NEXT complex for pri-miRNA decay. It acts with CBC in pri-miRNA
    processing and in pre-mRNA splicing, including alternative 5' splice site choice.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0031053
    label: primary miRNA processing
  - id: GO:0000381
    label: regulation of alternative mRNA splicing, via spliceosome
  locations:
  - id: GO:0016607
    label: nuclear speck
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:23141542
    supporting_text: In the miRNA processing complex, SE functions as a scaffold to mediate
      CPL1 interaction with HYL1
  - reference_id: PMID:32449937
    supporting_text: pri-miRNA degradation through the recruitment of the NEXT complex
  - reference_id: PMID:24137006
    supporting_text: both subunits of AtCBC, AtCBP20 and AtCBP80 interact with AtSE
suggested_questions:
- question: Should the CBC association of SE/ARS2 be captured as part_of the nuclear
    cap binding complex (GO:0005846, defined as the CBP20/CBP80 heterodimer), or should
    a separate CBC-ARS2/CBC-SE complex term be used, with SE given mRNA cap binding
    complex binding (GO:0140262)?
- question: Which MIR loci depend most on SE-driven condensation, compared with direct
    stimulation of DCL1 by SE, and do the two activities need different SE regions
    (disordered regions versus the zinc finger)?
- question: Is the transcriptional role of SE at intronless genes a direct effect of
    recruiting Pol II, or does it follow from SE binding nascent capped RNA together
    with CBC?
suggested_experiments:
- description: Reconstitute DCL1 processing with SE separation-of-function variants
    (disordered-region deletions that abolish phase separation but keep DCL1 binding,
    and zinc-finger mutants that keep condensation but lose DCL1 binding), and test
    rescue of se null embryos.
  experiment_type: In vitro reconstitution and genetic complementation
  hypothesis: DCL1 activation and condensate scaffolding are separable activities of SE,
    and both contribute to miRNA output in vivo.
- description: Map SE-dependent splicing events against CBP20/CBP80 binding and SE
    CLIP sites to find out whether SE affects first-intron 5' splice site selection by
    binding RNA directly or only through CBC.
  experiment_type: CLIP-seq combined with splicing profiling in se and cbp mutants
  hypothesis: SE controls first-intron 5' splice site choice through CBC-bound transcripts
    and needs its own RNA-binding surface to do so.
