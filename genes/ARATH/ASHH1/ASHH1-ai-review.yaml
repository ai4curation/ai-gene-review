suggested_questions:
- question: Which histone lysine residues and methylation states are directly produced by purified SDG26
    under conditions reproducing its oligonucleosome activity?
- question: How are the SOC1-activating and FLC-repressing functions of SDG26 partitioned among complexes
    and developmental conditions?
