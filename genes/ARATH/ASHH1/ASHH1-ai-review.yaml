    action: MODIFY
    reason: The cited SDG25-focused paper explicitly discusses recombinant SDG26 methylation of oligonucleosomes,
      so its title is not evidence of a wrong-gene attribution. That broad substrate assay supports histone
      methyltransferase activity but does not resolve the lysine. The existing SET2/H3K36 ancestral assignment,
      together with SDG26-dependent H3K36me3 at SOC1 in PMID:25409787, supports refinement to GO:0046975
      as a combined biochemical and conserved-function inference. This is not described as a purified
      SDG26 residue-specific assay; catalytic dispensability in the separate FLC-AuPC rescue experiment
      does not negate the reported capacity.
