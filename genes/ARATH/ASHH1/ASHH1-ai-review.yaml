gene_symbol: ASHH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ASHH1 (SDG26) is a nuclear SET2-family chromatin protein with separable histone-methylation
  and DNA-binding functions. Recombinant SDG26 methylates oligonucleosomal histones, and conserved SET2-family
  evidence supports H3K36 methyltransferase activity. At SOC1, SDG26 occupancy and SDG26-dependent H3K4/H3K36
  trimethylation have been reported, although chromatin dependence does not alone identify the directly
  methylated lysine. In the autonomous-pathway complex with FLD, LD, APRF1 and EFL proteins, its C-terminal
  coiled-coil region binds double-stranded DNA and supports association with FLC chromatin and transcriptional
  repression. A conserved SET-domain mutant rescues the tested FLC/flowering phenotype, supporting a noncatalytic
  role for SDG26 in that particular complex. Additional phenotypes implicate SDG26 in UV-B DNA-damage
  responses.
