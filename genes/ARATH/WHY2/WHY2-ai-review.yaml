taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: WHIRLY2 (WHY2, At1g71260) is a mitochondrially targeted member of the plant-specific Whirly family
  of single-stranded DNA-binding proteins. The mature protein assembles into a tetramer of Whirly domains that binds
  ssDNA with nanomolar affinity and little sequence specificity, holding the strand between adjacent subunits so
  it cannot anneal. In mitochondria WHY2 binds mtDNA along the entire genome and is associated with nucleoids. Loss
  of WHY2 causes microhomology-mediated rearrangements of the mitochondrial genome after double-strand breaks, and
  the protein blocks microhomology-mediated end-joining by organellar DNA polymerases in vitro, consistent with
  a role in protecting resected DNA ends and favouring accurate repair. why2 mutants also show disorganised nucleoids,
  altered mitochondrial ultrastructure and reduced seed germination, while overexpression lowers mtDNA content and
  mitochondrial function.
