    supporting_text: >-
      Mutation of interface residues in the ARF7 PB1 domain yields monomeric protein and abolishes
      interaction with both itself and IAA17
  - *id003
  - reference_id: PMID:14729917
    supporting_text: >-
      MSG2/IAA19 protein binds to the C-terminal domain of NPH4/ARF7 in a Saccharomyces cerevisiae
      (yeast) two-hybrid assay and to the whole latter protein in vitro by pull-down assay
suggested_questions:
- question: >-
    How does partitioning of ARF7 into cytoplasmic condensates interact with Aux/IAA-mediated
    repression in determining tissue-specific auxin competence?
suggested_experiments:
- description: >-
    Genome-wide ARF7 DAP-seq/ChIP-seq in lateral root founder cells with and without auxin,
    combined with Aux/IAA (IAA14) stabilization, to separate auxin-dependent from constitutive
    ARF7 occupancy.
  hypothesis: ARF7 occupies AuxREs constitutively and auxin acts primarily by removing Aux/IAA-TPL
    repression.
