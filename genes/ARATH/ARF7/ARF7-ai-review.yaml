core_functions:
- description: >-
    Auxin-regulated DNA-binding transcriptional activator. ARF7 binds AuxREs in target promoters
    (e.g. LBD16, LBD29) via its B3 domain and activates their transcription once Aux/IAA repressors
    are degraded in response to auxin.
