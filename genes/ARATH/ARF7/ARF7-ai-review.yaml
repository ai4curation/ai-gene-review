    label: nucleus
  supported_by:
  - *id015
  - *id001
  - *id007
  - reference_id: file:ARATH/ARF7/ARF7-uniprot.txt
    supporting_text: Regulates lateral root formation through direct regulation
- description: >-
    PB1-mediated binding of Aux/IAA co-repressors, the interaction through which Aux/IAAs
    (and recruited TOPLESS) repress ARF7 at low auxin.
  molecular_function:
    id: GO:0001222
    label: transcription corepressor binding
  directly_involved_in:
