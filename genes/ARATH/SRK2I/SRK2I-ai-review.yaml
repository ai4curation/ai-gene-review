id: Q39193
gene_symbol: SRK2I
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SRK2I (SnRK2.3) is an abscisic acid (ABA)- and hyperosmotic stress-activated serine/threonine
  protein kinase of the plant-specific SNF1-related kinase 2 (SnRK2) subclass III in Arabidopsis thaliana,
  together with its close paralog SRK2D (SnRK2.2) and with SRK2E/OST1 (SnRK2.6). In the absence of ABA
  it forms complexes with clade A type 2C protein phosphatases (ABI1, ABI2, HAB1, AHG1) that dephosphorylate
  its activation loop and keep it inactive, and it is also restrained by the type one protein phosphatase
  TOPP1 and its regulator AtI-2, which bind SnRK2s and repress SnRK2-driven ABA-responsive transcription;
  ABA-bound PYR/PYL/RCAR receptors inhibit the phosphatases,
  after which the kinase becomes partially active through intramolecular stabilization by a conserved
  regulatory-domain helix and fully active by activation-loop autophosphorylation, which is less efficient
  in SnRK2.3 than in OST1. Active SnRK2.3 phosphorylates ABRE-binding bZIP transcription factors (AREB/ABF
  and ABI5) and the bHLH factor AKS1 to drive ABA-responsive gene expression, and phosphorylates the
  ESCRT-I component FREE1, which is required for its ABA-induced nuclear import; it is found in the nucleus
  and cytoplasm. SnRK2.3 acts redundantly with SnRK2.2, mainly in seeds and roots, in ABA control of seed
  germination, dormancy, seedling growth and root growth inhibition, and with OST1 it contributes to drought
  and osmotic stress tolerance; plants lacking all three subclass III kinases are almost completely ABA-insensitive.
