- id: PMID:19420218
  title: Arabidopsis mutant deficient in 3 abscisic acid-activated protein kinases reveals critical roles
    in growth, reproduction, and stress.
  findings:
  - statement: The snrk2.2/2.3/2.6 triple mutant lacks all ABA-activated kinase activity.
    supporting_text: In-gel kinase assays showed that all ABA-activated protein kinase activities are
      eliminated in the triple mutant
  - statement: OST1 acts mainly in guard cells, SnRK2.2/2.3 in seeds and seedlings.
