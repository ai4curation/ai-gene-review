core_functions:
- description: ABA-activated Ser/Thr protein kinase. Once clade A PP2Cs are inhibited by ABA-bound PYR/PYL
    receptors, SnRK2.3 becomes active and phosphorylates ABRE-binding bZIP (AREB/ABF, ABI5) and bHLH (AKS1)
    transcription factors, transducing the ABA signal into gene expression. It also phosphorylates the
    ESCRT-I component FREE1, required for FREE1's ABA-induced nuclear import. Besides the clade A PP2Cs,
    the PP1-type phosphatase TOPP1 and its regulator AtI-2 bind SnRK2s and negatively regulate them.
