      and seedling growth regulation
- id: PMID:19541597
  title: Three Arabidopsis SnRK2 protein kinases, SRK2D/SnRK2.2, SRK2E/SnRK2.6/OST1 and SRK2I/SnRK2.3,
    involved in ABA signaling are essential for the control of seed development and dormancy.
  findings:
  - statement: SRK2D/E/I are essential for seed development and dormancy.
