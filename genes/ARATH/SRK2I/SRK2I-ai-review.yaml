suggested_questions:
- question: Which substrates distinguish SnRK2.2/2.3 from OST1 in seeds and roots, and is the functional
    split between the paralogs due to expression domain alone or also to differences in substrate preference
    or activation efficiency?
- question: Is the plastid HDA call (PMID:28887381) for SnRK2.3 reproducible, or a fractionation artefact?
    Should the 2011 NOT cytosol RCA row be retired given direct cytoplasmic localization data?
suggested_experiments:
- experiment_type: tissue-specific complementation
  hypothesis: SnRK2.2/2.3 and OST1 are interchangeable at the protein level, and their distinct physiological
    roles reflect expression domain.
  description: Express SnRK2.2, SnRK2.3 or OST1 coding sequences from each other's promoters in the snrk2.2/2.3/2.6
    triple mutant and score germination, root growth, hydrotropism and stomatal closure.
- experiment_type: seed phosphoproteomics
  hypothesis: SnRK2.2/2.3 phosphorylate a seed-specific substrate set beyond ABI5 and ABFs.
  description: Compare ABA-treated imbibed-seed phosphoproteomes of wild type, snrk2.2/2.3 and kinase-dead
    complemented lines.
