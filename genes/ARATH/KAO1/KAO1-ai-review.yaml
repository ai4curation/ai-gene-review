core_functions:
- description: ER-membrane cytochrome P450 (CYP88A) that oxidizes ent-kaur-16-en-19-oate in three steps
    (via ent-7alpha-hydroxykaurenoic acid and GA12-aldehyde) to GA12 (RHEA:33219), the common precursor
    of all gibberellins; acts redundantly with KAO2.
