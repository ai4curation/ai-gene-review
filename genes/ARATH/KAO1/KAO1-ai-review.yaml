suggested_questions:
- question: Do KAO1 and KAO2 differ in substrate kinetics, ER subdomain or cell-type expression in a way
    that explains why both paralogs are retained?
suggested_experiments:
- description: Compare recombinant KAO1 and KAO2 kinetics in a common microsomal system and map promoter
    activities at cellular resolution in germinating seeds and inflorescences.
