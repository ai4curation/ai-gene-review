  review:
    summary: Pollen tube development, propagated from rice KAO/RPE1 (REDUCED POLLEN ELONGATION 1).
    action: KEEP_AS_NON_CORE
    reason: GA is required for pollen tube elongation and the rice KAO mutant shows a pollen-tube defect,
      so the inference is biologically plausible for Arabidopsis KAOs, but it is a downstream consequence
      of GA supply rather than a distinct molecular role; in Arabidopsis the redundant KAO1/KAO2 pair
      has only been shown to be required for GA production throughout development.
    supported_by:
