taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'KAO1 (ent-kaurenoic acid oxidase, CYP88A3; At1g05160) is an endoplasmic reticulum membrane-anchored
  cytochrome P450 that catalyses three successive oxidations of ent-kaurenoic acid (ent-7alpha-hydroxylation,
  then formation of GA12-aldehyde with B-ring contraction, then oxidation to the C-7 carboxylic acid)
  to produce GA12, the first gibberellin and common precursor of all bioactive GAs. KAO1 and its paralog
  KAO2 are expressed mainly in germinating seeds and young developing organs and act redundantly: single
  mutants are wild-type, whereas the kao1 kao2 double mutant is a non-germinating, severely GA-deficient
  dwarf resembling ga1-3.'
