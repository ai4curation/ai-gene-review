  review:
    summary: Iron ion binding from InterPro P450 signatures; reflects the heme iron.
    action: KEEP_AS_NON_CORE
    reason: The P450 coordinates the heme iron through its proximal cysteine thiolate, so iron binding is
      not wrong. GO:0020037 heme binding is not a descendant of GO:0005506, so the two terms are not redundant.
      Iron is a catalytic cofactor rather than the core function (consistent with other ARATH P450 reviews
      and with magnesium ion binding on the GA1/GA2 terpene cyclases); retained as non-core.
    supported_by:
