core_functions:
- description: 'ARR12 receives the cytokinin phosphorelay signal: its receiver domain is phosphorylated
    on a conserved aspartate by AHP histidine phosphotransfer proteins, which activates the
    protein.'
  supported_by:
  - reference_id: PMID:18723577
    supporting_text: Our results support a model in which cytokinin regulates a wide array
      of downstream responses through the action of a multistep phosphorelay that culminates
      in transcriptional regulation by ARR1, ARR10, and ARR12.
  - reference_id: PMID:16227453
    supporting_text: These results indicate that there is functional overlap among the type-B
      ARRs and that they act as positive regulators of cytokinin signal transduction.
