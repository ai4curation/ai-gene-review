  review:
    summary: ARR12 is a type-B response regulator whose N-terminal receiver domain accepts
      a phosphoryl group on a conserved aspartate from AHP phosphotransfer proteins, activating
      its C-terminal Myb-related (GARP) DNA-binding/transactivation output.
    action: ACCEPT
    reason: Phosphorelay response regulator activity is the defining signalling activity of
      type-B ARRs.
    supported_by:
    - reference_id: PMID:18723577
      supporting_text: Our results support a model in which cytokinin regulates a wide array
        of downstream responses through the action of a multistep phosphorelay that culminates
        in transcriptional regulation by ARR1, ARR10, and ARR12.
    - reference_id: PMID:12068096
      supporting_text: nuclear AHP translocation enables the activation of B-type ARR proteins,
        which in turn activate the transcription of A-type ARRs
