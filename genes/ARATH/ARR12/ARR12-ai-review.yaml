id: P62598
gene_symbol: ARR12
product_type: PROTEIN
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ARR12 (ARABIDOPSIS RESPONSE REGULATOR 12) is a subfamily-1 type-B response regulator
  of Arabidopsis thaliana that functions, together with ARR1 and ARR10, as a principal transcriptional
  effector of cytokinin signaling. It contains an N-terminal phospho-accepting receiver domain,
  a Myb-related GARP (B-motif) DNA-binding domain and a C-terminal transactivation region,
  and localizes to the nucleus. Upon phosphotransfer from AHP proteins, ARR12 binds AGATT-type
  promoter motifs and activates cytokinin-responsive genes, including type-A ARRs. Genetically,
  arr1 arr12 double and arr1 arr10 arr12 triple mutants show strongly reduced cytokinin sensitivity,
  enlarged root meristems, reduced shoot growth, altered chlorophyll/anthocyanin content,
  defective shoot regeneration and callus formation, and enhanced drought tolerance; ARR12
  also regulates submergence-induced hypoxia responses via ETP1/ETP2.
