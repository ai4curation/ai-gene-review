suggested_questions:
- question: Which target genes are bound by ARR1 versus ARR12 in different tissues, and does
    ARR12 contribute distinct targets or only dosage to the subfamily-1 type-B ARR output?
- question: How does receiver-domain phosphorylation relieve autoinhibition of type-B ARR
    DNA binding or transactivation at the structural level?
suggested_experiments:
- hypothesis: ARR1 and ARR12 share most cytokinin-induced binding sites but differ in tissue-specific
    targets.
  description: Perform cytokinin-time-course ChIP-seq/DAP-seq for tagged ARR1 and ARR12 expressed
    from native promoters in the arr1 arr12 background, and compare binding sites and target
    gene sets.
  experiment_type: ChIP-seq
