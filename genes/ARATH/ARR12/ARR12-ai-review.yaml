- term:
    id: GO:0009414
    label: response to water deprivation
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028094
  review:
    summary: ARR12 contributes to 'response to water deprivation' as a downstream output of
      type-B ARR-mediated cytokinin transcriptional signaling.
    action: KEEP_AS_NON_CORE
    reason: Supported by mutant/genetic interaction data, often in redundant higher-order
      arr mutants; this is a pleiotropic developmental/physiological output rather than the
      core molecular role. The electronic annotation is consistent with the experimental data.
    supported_by:
    - reference_id: PMID:26884175
      supporting_text: Further drought-tolerance tests of lower-order double and single mutants
        indicated that ARR1, ARR10, and ARR12 negatively and redundantly control plant responses
        to drought, with ARR1 appearing to bear the most critical function among the three
        proteins.
    - reference_id: PMID:26884175
      supporting_text: Expression of all three ARR genes was repressed by dehydration and
        ABA treatments
