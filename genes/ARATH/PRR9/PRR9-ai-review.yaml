id: Q8L500
gene_symbol: PRR9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PSEUDO-RESPONSE REGULATOR 9 (PRR9, APRR9) is a nuclear transcriptional repressor of the Arabidopsis
  circadian oscillator and the earliest-phased member of the PRR1/TOC1 family, whose transcripts peak
  sequentially through the day (PRR9, PRR7, PRR5, PRR3, TOC1). PRR9 has an N-terminal pseudo-receiver
  domain, which resembles a two-component receiver but lacks the phospho-accepting aspartate, and a C-terminal
  CCT domain that mediates promoter association. Its expression is rapidly induced by light via phytochrome
  signalling and is directly repressed at night by the evening complex (LUX/ELF3/ELF4). In the morning
  PRR9 binds the CCA1 and LHY promoters, together with PRR7 and PRR5, and represses them by recruiting
  TOPLESS/TPR corepressors and histone deacetylase (HDA6). This forms the daytime negative arm of the
  CCA1/LHY-PRR feedback loop. prr9 mutants have a lengthened period, and prr9 prr7 prr5 triple mutants
  are arrhythmic in continuous light. PRR9 also represses clock-output genes, contributing to photoperiodic
  flowering (via CDF1/CO) and to red-light responses during seedling de-etiolation.
