  title: Aluminum induces oxidative stress genes in Arabidopsis thaliana.
  findings:
  - statement: An aluminium-induced GST cDNA (identified by sequence identity to a Kiyosue
      et al. 1993 GST) is reported; its link to oxidative stress is by citation.
    supporting_text: The genes encoded peroxidase, glutathione-S-transferase, blue copper-binding
