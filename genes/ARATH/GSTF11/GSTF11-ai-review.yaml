      not assayed.
    supporting_text: GSTF11, GSTF12, and GSTF13 could not be cloned, or only expressed
      as insoluble proteins
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available; explains the absence of direct biochemical data
      for GSTF11.
- id: PMID:20457641
  title: Production of the cancer-preventive glucoraphanin in tobacco.
  findings:
  - statement: Engineering of the glucoraphanin pathway into tobacco by coupling chain-elongation
      enzymes to glucosinolate core-pathway enzymes; cited by Zhang et al. 2022 as showing
      GSTF11 can increase, but is not essential for, heterologous glucosinolate production.
    supporting_text: by coupling the five enzymes of the chain-elongation pathway to eight
      enzymes of the glucosinolate pathway, we show production of glucoraphanin
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Abstract-only cache; the abstract does not name GSTF11, so its specific
      contribution in this study could not be checked.
- id: PMID:34961200
  title: The Role of the GSTF11 Gene in Resistance to Powdery Mildew Infection and Cold
    Stress.
  findings:
  - statement: Constitutive expression of Arabidopsis GSTF11 in Brassica napus increased
      total leaf GST activity by about 30%.
    supporting_text: A higher GSTF11 mRNA content in transgenic plants was accompanied
      by an increase in the activity of the GST enzyme by an average of 30%
  - statement: Transgenic plants were more resistant to powdery mildew and the transgene
      was cold-responsive.
    supporting_text: In most of transgenic plants, mycelium growth was inhibited
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Full text available; heterologous overexpression in B. napus with correlative
      physiology, not evidence for a native Arabidopsis role in defense or cold response.
- id: PMID:29122987
  title: Glutathione Transferase U13 Functions in Pathogen-Triggered Glucosinolate Metabolism.
  findings:
  - statement: Comparator for the NEW-term decision. GSTU13 is required for the PEN2 indole
      glucosinolate pathway and carries a TAIR IMP annotation to indole glucosinolate catabolic
      process (acts_upstream_of_or_within), a precedent for mutant-based glucosinolate
      process annotations on GSTs.
    supporting_text: Glutathione-S-Transferase class-tau member 13 (GSTU13) as an indispensable
      component of the PEN2 immune pathway for IG metabolism
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only cache; used only as a comparator, not as evidence for this gene.
- id: PMID:35145536
  title: Arabidopsis Glutathione-S-Transferases GSTF11 and GSTU20 Function in Aliphatic
    Glucosinolate Biosynthesis.
  findings:
  - statement: CRISPR gstf11 knockouts reduce several aliphatic, but not indolic, glucosinolates;
      effects are weaker than gstu20 and additive in the double mutant.
    supporting_text: no significant changes in the abundance of indolic GSLs were noted
      in gstf11 (Figures 4A,B) and gstu20 (Figures 5A,B) mutants
  - statement: GSTF11 enzymatic activity was not measured because the protein could not
      be purified.
    supporting_text: The enzymatic activity of GSTF11 was undetectable because of the
      protein could not be isolated and purified in vitro due to the rare abundance.
  - statement: The double mutant still makes aliphatic glucosinolates.
    supporting_text: the double mutation of GSTF11 and GSTU20 caused a dramatic decrease
      but did not completely abolish the formation of aliphatic GSLs
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; genetic (necessity) evidence only; not reflected
      in GOA. Judged insufficient for a NEW involved_in glucosinolate biosynthetic process
      annotation (see notes).
suggested_questions:
- question: Does GSTF11 have catalytic activity toward the CYP83A1-derived aci-nitro/nitrile
    oxide intermediate, or does the gstf11 glucosinolate phenotype arise indirectly (e.g.
    via GSH homeostasis or transcriptional effects)?
- question: Is the mild gstf11 phenotype explained by the C-terminal location of the
    CRISPR lesions (possible partially functional truncated protein), as the authors
    suggest?
- question: Should GO carry an acts_upstream_of_or_within IMP annotation to glucosinolate
    biosynthetic process (GO:0019761) for GSTF11 from PMID:35145536, analogous to the
    GSTU13 IMP annotation to indole glucosinolate catabolic process (PMID:29122987)?
suggested_experiments:
- description: Obtain soluble recombinant GSTF11 (e.g. with solubility tags or plant/insect-cell
    expression) and assay GSH conjugation of CDNB, isothiocyanates and CYP83A1-generated
    aliphatic aldoxime intermediates, versus spontaneous conjugation.
- description: Generate a full-length deletion null of GSTF11 and measure aliphatic glucosinolates
    and GSH-conjugate intermediates alone and with gstu20 to define its quantitative contribution.
