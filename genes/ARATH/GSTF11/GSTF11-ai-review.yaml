  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Full text available, but the GST locus is not named, so the assignment
      to GSTF11 could not be verified.
- id: PMID:17420480
  title: Omics-based identification of Arabidopsis Myb transcription factors regulating
    aliphatic glucosinolate biosynthesis.
  findings:
  - statement: GSTF11 (At3g03190) and GSTU20 (At1g78370) are MYB28-regulated together
      with aliphatic glucosinolate pathway genes.
    supporting_text: Transcriptome analyses of myb28 and Myb28 -overexpressing cell cultures
      indicated that both of them are regulated by Myb28
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available; co-regulation evidence.
- id: PMID:19174456
  title: Enzyme activities and subcellular localization of members of the Arabidopsis
    glutathione transferase superfamily.
  findings:
