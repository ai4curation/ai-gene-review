- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IEP
  original_reference_id: PMID:9449849
  qualifier: acts_upstream_of_or_within
  review:
    summary: Richards et al. 1998 isolated an aluminium-induced GST cDNA clone identified
      by >98% identity to a previously published Arabidopsis GST (Kiyosue et al. 1993),
      and argued that Al induces oxidative-stress genes. The ozone (oxidative stress) response
      of the GST was cited from earlier work rather than tested for this clone.
    action: UNDECIDED
    reason: The paper does not name the GST locus, so its correspondence to GSTF11 (rather
      than another phi GST) cannot be confirmed from the text, and the experimental treatment
      was aluminium, with the oxidative-stress link inferred. Stress inducibility of GSTF11
      is plausible (it is cold- and pathogen-inducible in B. napus [PMID:34961200]), but
      without being able to verify the gene assignment the annotation is left undecided
      rather than accepted or removed.
    supported_by:
    - reference_id: PMID:9449849
      supporting_text: Four of the sequences show >98% identity over this region to the
        published A. thaliana sequences for the BCB ( van Gysel et al., 1993 ), GST ( Kiyosue
        et al., 1993 )
    - reference_id: PMID:9449849
      supporting_text: GST ( Sharma and Davis, 1994 ; Conklin and Last, 1995 ) and peroxidase
        ( Sharma and Davis, 1994 ) were already known to be induced in plants by ozone
        treatment
