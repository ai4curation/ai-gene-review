core_functions:
- description: Phi-class glutathione S-transferase acting in the cytosol. Genetic evidence
    implicates it, secondary to GSTU20, in the glutathione-conjugation step of aliphatic
    glucosinolate core structure formation, but catalysis on the native CYP83A1 intermediate
    has not been shown and recombinant GSTF11 has not been characterised, so no glucosinolate
    process term is asserted here.
