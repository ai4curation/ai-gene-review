id: Q96324
gene_symbol: GSTF11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GSTF11 (At3g03190) is a phi-class glutathione S-transferase of Arabidopsis,
  a plant-specific soluble cytosolic enzyme family that conjugates reduced glutathione
  to electrophilic metabolites and xenobiotics. Its catalytic activity is inferred from
  its conserved phi-class GST fold and G-site; recombinant GSTF11 could not be obtained
  as soluble protein in systematic surveys, so no in vitro kinetics exist, although constitutive
  expression of Arabidopsis GSTF11 in Brassica napus raised total leaf GST activity.
  GSTF11 is co-expressed with the aliphatic (methionine-derived) glucosinolate pathway
  and regulated by MYB28, and CRISPR gstf11 knockouts have reduced levels of several
  aliphatic glucosinolates in leaves and seeds, with no change in indolic glucosinolates;
  the effect is weaker than that of gstu20 and additive with it in the double mutant.
  GSTF11 is therefore a candidate, together with GSTU20, for the glutathione-conjugation
  step that supplies the thioglucoside sulfur of aliphatic glucosinolates, although conjugation
  of the native CYP83A1-derived intermediate by GSTF11 has not been demonstrated. The
  gene is stress-inducible, and heterologous overexpression has been reported to increase
  tolerance to powdery mildew and abiotic stresses.
