id: Q9SAJ3
gene_symbol: FTSH12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FTSH12 (At1g79560) is a nuclear-encoded, chloroplast-targeted FtsH-family AAA+ protein of
  Arabidopsis thaliana. After cleavage of its transit peptide it is integrated into the chloroplast inner
  envelope membrane by two transmembrane helices, with its AAA+ ATPase and M41 zinc-metalloprotease domains
  facing the stroma; it is present in proplastids, leaves and root plastids. FTSH12 is one of six AAA+
  subunits (with Ycf2 and FtsHi1, FtsHi2, FtsHi4 and FtsHi5) of the ~2-MDa heterohexameric Ycf2/FtsHi
  complex, which also contains plastid NAD-malate dehydrogenase and acts as the ATP-driven import motor
  that pulls nucleus-encoded preproteins through the TIC translocon into the stroma. It is the only subunit
  that retains the HExxH zinc-binding site of FtsH proteases, but this site is dispensable for its essential
  function and no proteolytic activity or substrate has been demonstrated. Loss of FTSH12 arrests embryo
  development at the heart stage, and reduced FTSH12 levels cause pale cotyledons, small deformed chloroplasts
  and altered TIC complex composition.
