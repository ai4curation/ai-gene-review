      manner.'
    action: ACCEPT
    reason: 'This is the core activity of the Ycf2/FtsHi motor, of which FTSH12 is one of six AAA+ subunits.
      The evidence is at the level of the complex: ATP-dependent association of FTSH12 with translocating
