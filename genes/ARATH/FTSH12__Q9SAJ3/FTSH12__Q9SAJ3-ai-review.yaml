  review:
    summary: ATP-dependent peptidase activity, inferred from the FtsH (M41) domain architecture via InterPro
    action: KEEP_AS_NON_CORE
    reason: FTSH12 is the only subunit of the Ycf2/FtsHi motor that retains the M41 zinc site (HEAGH 769-773
      plus D849), so peptidase activity is sequence-compatible, but it has never been measured for FTSH12
      and no substrate is known. The H769Y zinc-site mutant fully complements the embryo-lethal knockout,
