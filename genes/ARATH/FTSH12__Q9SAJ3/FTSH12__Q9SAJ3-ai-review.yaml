suggested_questions:
- question: Does FTSH12 hydrolyse ATP within the Ycf2/FtsHi heterohexamer, or is its contribution mainly
    structural (assembly of the hexamer), given that it lacks conserved pore-loop residues and cross-links
    weakly to preproteins?
- question: Does the retained FTSH12 zinc site support any conditional proteolytic or quality-control
    activity at the inner envelope, even though it is dispensable for viability?
- question: Should the PTN000554085 m-AAA complex and mitochondrial protein processing IBAs be pruned
    from the plastid FTSH12 branch (PTHR43655:SF19)?
suggested_experiments:
- description: Introduce Walker A (K539) or Walker B (E592) substitutions into FTSH12 and test complementation
    of the embryo-lethal ftsh12 knockout and import efficiency in isolated chloroplasts, to determine
    whether FTSH12 ATP hydrolysis is required for motor function.
- description: Assay purified Ycf2/FtsHi complexes containing wild-type versus H769Y FTSH12 for peptidase
    activity on unfolded model substrates.
