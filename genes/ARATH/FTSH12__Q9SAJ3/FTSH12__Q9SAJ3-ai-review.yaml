core_functions:
- description: AAA+ subunit of the Ycf2/FtsHi chloroplast import motor in the inner envelope membrane,
    contributing to ATP-driven translocation of nucleus-encoded preproteins into the stroma. Established
    experimentally in Arabidopsis at the level of the complex (complex membership, ATP-dependent association
    with translocation intermediates, motor structure); the specific mechanical contribution of FTSH12
    is not resolved.
  contributes_to_molecular_function:
