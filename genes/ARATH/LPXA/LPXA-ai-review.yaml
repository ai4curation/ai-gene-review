suggested_questions:
- question: Which enzyme accounts for the roughly 21% residual lipid X in atlpxa null mutants; does AtLpxD1,
    which lacks key LpxD residues, have UDP-GlcNAc acyltransferase activity?
- question: What is the acyl donor for AtLpxA in mitochondria, given that mitochondrial fatty acid synthase
    is the likely source of (R)-3-hydroxymyristoyl-ACP?
- question: Is the plant enzyme's tenfold lower in vitro specific activity intrinsic, or a consequence of
    heterologous expression or non-native acyl-ACP?
suggested_experiments:
- experiment_type: double mutant lipid profiling
  hypothesis: AtLpxD1 provides the residual UDP-GlcNAc acylation activity in atlpxa mutants.
  description: Construct atlpxa atlpxd1 double mutants and quantify lipid X by LC-MRM; assay recombinant
    AtLpxD1 with UDP-GlcNAc and R-3-hydroxymyristoyl-ACP.
- experiment_type: in vitro enzyme assay with plant ACP
  hypothesis: AtLpxA uses mitochondrial ACP-bound R-3-hydroxyacyl chains as its native donor.
  description: Assay AtLpxA with Arabidopsis mitochondrial ACP charged with R-3-hydroxyacyl chains of varying
    length to define donor and chain-length specificity.
