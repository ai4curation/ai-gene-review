- term:
    id: GO:0009245
    label: lipid A biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:22545860
  qualifier: involved_in
  review:
    summary: NEW. Lipid A biosynthetic process, supported by direct enzymology of AtLpxA (first step of
      the pathway) and by restoration of lipid A synthesis in an E. coli lpxA deletion.
    action: NEW
    reason: AtLpxA performs the first step of lipid A biosynthesis itself (catalysis demonstrated in vitro),
      so it passes the participation test; the comparator check is satisfied because the term's canonical
      members are exactly the pathway enzymes (E. coli LpxA, LpxC, LpxD, LpxB, LpxK, KdtA). Expressed in
      an E. coli lpxA knockout, AtLpxA supports synthesis of normal lipid A, and in planta its loss lowers
      the pathway intermediate lipid X. GOA currently has no lipid A biosynthetic process row for this
      gene (only the obsolete lipid X term). The plant end product is unknown, but the precursor steps
      are shared with the E. coli pathway, and the Wei et al. 2020 misannotation flag on plant lipid A
      terms is refuted by this evidence.
    supported_by:
    - *activity
    - *complement
    - *lipidx
    - reference_id: PMID:21709257
      supporting_text: our work demonstrates that plants synthesize lipid A precursors using the same enzymatic
        pathway present in E. coli
