id: Q9SU91
gene_symbol: LPXA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: LPXA (At4g29540) encodes the Arabidopsis ortholog of bacterial LpxA, a nuclear-encoded,
  mitochondrially targeted UDP-N-acetylglucosamine acyltransferase that catalyses the first step of the
  lipid A precursor pathway, transferring an (R)-3-hydroxymyristoyl chain from acyl carrier protein to
  the 3-OH of UDP-GlcNAc. The purified enzyme is a homotrimer with the left-handed parallel beta-helix
  fold and conserved active site of E. coli LpxA, catalyses the same reaction in vitro, and complements
  an E. coli lpxA deletion, restoring normal lipid A synthesis. A GFP fusion localises to mitochondria.
  Null mutants have no visible phenotype but contain reduced amounts of the downstream intermediate lipid
  X (2,3-diacylglucosamine 1-phosphate); residual lipid X suggests a second UDP-GlcNAc acylation route.
  It is one of six enzymes (LpxA, LpxC, LpxD, LpxB, LpxK, KdtA) of a plant pathway that mirrors the E.
  coli Raetz pathway. The final plant lipid A-like product and its physiological role are unknown.
