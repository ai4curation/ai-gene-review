  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: No molecular function has been experimentally defined for ACD6. Its ankyrin domain is proposed
      to act as a protein-complex assembly platform, and its C-terminal multipass transmembrane (PGG)
      region has no demonstrated transport or catalytic activity.
    action: ACCEPT
    reason: The literature through the 2014 biochemical study (which characterised complexes with HSP70,
      BIP, FLS2 and BAK1) describes ACD6 only as a defense signaling component with an ankyrin domain
      that may scaffold complexes; no activity was measured. ND remains correct, and an MF term from scaffolding
      speculation would be unsupported.
    supported_by:
