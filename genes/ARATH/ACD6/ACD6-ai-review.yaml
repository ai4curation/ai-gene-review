id: Q8LPS2
gene_symbol: ACD6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'ACCELERATED CELL DEATH 6 (ACD6, At4g14400) is an Arabidopsis thaliana integral multipass
  membrane protein with an N-terminal cytoplasmic ankyrin-repeat domain and a C-terminal PGG-domain transmembrane
  region. It localizes to the plasma membrane and endoplasmic reticulum; a fraction is retrotranslocated,
  bound by cytosolic HSP70, ubiquitinated and degraded by the proteasome via ER-associated degradation.
  ACD6 is a dose-dependent positive regulator of salicylic acid (SA)-dependent defense that acts in a
  positive feedback loop with SA: SA signaling induces ACD6 transcription (which also requires light)
  and increases the plasma membrane pool of ACD6, while ACD6 promotes SA accumulation, defense priming
  and SA-dependent cell death. ACD6 forms complexes with the immune receptor FLS2 and with BAK1, both
  of which need ACD6 for maximal SA-induced accumulation at the plasma membrane. Loss of ACD6 increases
  susceptibility to Pseudomonas syringae; the gain-of-function acd6-1 allele (L591F in a transmembrane
  helix) and hyperactive natural alleles such as that of Est-1 confer broad resistance to bacteria, fungi,
  oomycetes and aphids at the cost of reduced growth and spontaneous necrosis. No biochemical activity
  has been defined; the ankyrin domain is proposed to act as a platform for assembling membrane protein
  complexes.'
