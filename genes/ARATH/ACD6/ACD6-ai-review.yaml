core_functions:
- description: Plasma membrane-localized ankyrin-repeat/PGG multipass membrane protein that positively
    and dose-dependently regulates SA-mediated defense signaling, in a positive feedback loop with SA,
    and promotes resistance to biotrophic and hemibiotrophic bacteria, fungi and oomycetes. Its molecular
    activity is unknown; the ankyrin domain is required for assembly of ACD6-containing complexes that
    include FLS2 and BAK1.
  directly_involved_in:
  - *id011
  - id: GO:1900426
    label: positive regulation of defense response to bacterium
  - id: GO:1902290
    label: positive regulation of defense response to oomycetes
  locations:
  - *id005
  - *id006
  supported_by:
  - *id010
  - *id008
  - *id002
  - *id007
  - reference_id: PMID:24923602
    supporting_text: FLS2 forms complexes ACD6; both FLS2 and BAK1 require ACD6 for maximal accumulation
      at the PM in response to SA signaling.
  - *id012
suggested_questions:
- question: Does ACD6 have a biochemical activity of its own (for example ion or small-molecule transport
    through its PGG transmembrane region), or is it purely a scaffold that assembles FLS2/BAK1-containing
    immune complexes?
- question: Should the ACD6 requirement for SA-induced FLS2 and BAK1 plasma membrane accumulation be represented
    in GO (for example as a regulation of protein localization to plasma membrane term), or is it necessity
    evidence that does not show ACD6 doing the trafficking?
- question: Was ACD6 induction by Beet severe curly top virus infection itself shown in PMID:20042021,
    which would support the response to virus IEP annotation?
- question: Which of the ~34 ACD6-like Arabidopsis PGG/ankyrin proteins (for example ACL1 At4g14390 and
    ACL2 At4g05040) share the defense-regulatory role, and do they act redundantly with ACD6?
suggested_experiments:
- experiment_type: electrophysiology / reconstitution
  hypothesis: The ACD6 transmembrane (PGG) region forms a channel or transporter whose activity is increased
    by the acd6-1 L591F substitution.
  description: Express ACD6, ACD6-1 and the S638F loop variant in Xenopus oocytes or HEK cells and measure
    ion currents and small-molecule uptake.
- experiment_type: proximity labeling proteomics
  hypothesis: The ACD6 ankyrin domain directly binds specific immune receptor or co-receptor components
    at the plasma membrane.
  description: Use TurboID-ACD6 and ankyrin-variant (G303E, E348K) fusions with and without BTH to map
    direct partners and test FLS2/BAK1 binding with purified domains.
