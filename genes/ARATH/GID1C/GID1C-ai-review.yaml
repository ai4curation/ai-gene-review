- term:
    id: GO:0009739
    label: response to gibberellin
  evidence_type: IGI
  original_reference_id: PMID:24961590
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9LYC1
  negated: true
  review:
    summary: NOT involved in response to gibberellin (IGI, with Q9LYC1), based on the absence
      of a pistil/fruit phenotype in a gid1c single or double mutant in which another GID1
      paralog remains.
    action: REMOVE
    reason: 'The negation is contradicted by direct evidence that GID1C is a functional GA
      receptor: recombinant GID1C binds GA and interacts with DELLAs only in the presence
      of GA, and it rescues the rice gid1 mutant. Lack of a phenotype in a mutant retaining
      a redundant paralog (the paper itself reports compensatory GID1A up-regulation) reflects
      genetic redundancy, not absence of involvement in GA responses.'
    supported_by:
    - &id006
      reference_id: PMID:16709201
      supporting_text: These results demonstrate that all three AtGID1s functioned as GA receptors
        in Arabidopsis
    - reference_id: PMID:24961590
      supporting_text: Elimination of two out of the three GA receptors in each double mutant
        combination may cause up-regulated expression of the remaining GID1 gene, which may
