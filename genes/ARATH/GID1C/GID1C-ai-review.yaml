core_functions:
- description: 'Soluble gibberellin receptor: binds bioactive GAs (preferentially GA4) in
    its hydrolase-fold pocket; the GA-bound receptor then engages the DELLA domain of DELLA
    repressors, initiating GA signaling. Positive regulator of GA signaling: by forming the
    GA-GID1-DELLA complex it promotes SCF(SLY1)-mediated DELLA ubiquitination and proteasomal
    degradation and also inhibits DELLA repression without proteolysis, partially redundantly
    with the other GID1 receptors.'
  molecular_function:
    id: GO:0010331
    label: gibberellin binding
  directly_involved_in:
  - id: GO:0010476
    label: gibberellin mediated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id008
  - *id001
  - *id009
  - *id010
  - reference_id: PMID:17194763
    supporting_text: the GA-GID1 complex promotes the interaction between RGA and the F-box
      protein SLY1
  - reference_id: PMID:18827182
    supporting_text: GA-bound GID1 can block DELLA repressor activity by direct protein-protein
      interaction with the DELLA domain
proposed_new_terms:
- proposed_name: gibberellin receptor activity
  proposed_definition: Binding to a gibberellin and, as a result, undergoing a conformational
    change that promotes gibberellin-dependent binding of DELLA repressor proteins, thereby
    transducing the gibberellin signal.
  justification: GID1 proteins, including GID1C, are bona fide soluble GA receptors but GO
    has no gibberellin receptor activity term (checked in GO via OAK/OLS); gibberellin binding
    (GO:0010331) captures ligand binding but not signal transduction. Same proposal as in
    the GID1A review.
  supported_by:
  - *id006
suggested_questions:
- question: What structural features of GID1C reduce its affinity for RGL2 relative to GID1A
    and GID1B, and does this DELLA preference shape tissue-specific GA responses?
- question: Do GID1A and GID1C have any non-redundant roles in stem elongation, or does GID1C
    act only as a dosage contributor?
suggested_experiments:
- description: Measure GID1C affinity for each of the five DELLA proteins at physiological
    GA4 concentrations (e.g. quantitative yeast three-hybrid or purified-protein binding)
    to define its DELLA preference profile.
- description: Express GID1C from the GID1B promoter in gid1a gid1b to test whether its low
    RGL2 affinity prevents rescue of stamen elongation.
