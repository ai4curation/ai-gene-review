    label: nucleus
  in_complex:
    id: GO:0035098
    label: ESC/E(Z) complex
  supported_by:
  - reference_id: PMID:23778966
    supporting_text: >-
      This work established the fact that all known plant PRC2 complexes contain MSI1, a homologue of
      Drosophila p55.
  - reference_id: PMID:23778966
    supporting_text: >-
      plant MSI1 was required for the functions of the EMBRYONIC FLOWER and the VERNALIZATION PRC2 complexes
      including trimethylation of histone H3 Lys27 (H3K27) at the target chromatin, as well as gene repression
      and establishment of competence to flower.
  - reference_id: PMID:23778966
    supporting_text: >-
      We found that MSI1 serves to link PRC2 to LIKE HETEROCHROMATIN PROTEIN 1 (LHP1), a protein that
      binds H3K27me3 in vitro and in vivo and is required for a functional plant PcG system.
  - reference_id: PMID:12970192
    supporting_text: >-
      Here we show that the Arabidopsis WD-40 domain protein MSI1 is present together with MEA and FIE
      in a 600 kDa complex and interacts directly with FIE.
  - reference_id: PMID:18854416
    supporting_text: >-
      during prolonged cold a PHD-PRC2 complex forms composed of core PRC2 components (VRN2, SWINGER ...
      and three related PHD finger proteins, VRN5, VIN3, and VEL1.
