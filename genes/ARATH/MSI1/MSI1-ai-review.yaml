    label: negative regulation of gene expression, epigenetic
  evidence_type: IMP
  original_reference_id: PMID:23778966
  review:
    summary: >-
      MSI1 is required for PRC2 H3K27me3 deposition and target gene repression by EMF- and VRN-PRC2.
    action: NEW
    reason: >-
      MSI1 is a PRC2 core subunit that does part of the silencing work (histone binding and LHP1 bridging).
    supported_by:
    - reference_id: PMID:23778966
      supporting_text: >-
        plant MSI1 was required for the functions of the EMBRYONIC FLOWER and the VERNALIZATION PRC2 complexes
        including trimethylation of histone H3 Lys27 (H3K27) at the target chromatin, as well as gene
        repression and establishment of competence to flower.
- term:
    id: GO:0035098
    label: ESC/E(Z) complex
  evidence_type: IDA
  original_reference_id: PMID:23778966
  review:
    summary: MSI1 is present in all known plant PRC2 complexes (FIS, EMF and VRN).
    action: NEW
    reason: Core complex membership.
    supported_by:
    - reference_id: PMID:23778966
      supporting_text: >-
        This work established the fact that all known plant PRC2 complexes contain MSI1, a homologue of
        Drosophila p55.
- term:
    id: GO:0033186
    label: CAF-1 complex
  evidence_type: TAS
  original_reference_id: PMID:17021044
  review:
    summary: MSI1 forms CAF-1 with FAS1 and FAS2.
    action: NEW
    reason: >-
      This is the established second complex of MSI1, the p48 subunit of chromatin assembly factor 1.
    supported_by:
    - reference_id: PMID:17021044
      supporting_text: >-
        Biochemical evidence suggests that FASCIATA1, FASCIATA2 and MSI1 form CAF-1 in Arabidopsis thaliana.
