id: O22467
gene_symbol: MSI1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MSI1 (MULTICOPY SUPPRESSOR OF IRA1) is an Arabidopsis WD40-repeat histone-binding protein of the p55/RbAp48
  (RBBP4/7) family. It is a shared subunit of several chromatin complexes. MSI1 is present in all plant
  Polycomb Repressive Complex 2 variants: FIS-PRC2 in the female gametophyte and endosperm, EMF-PRC2 and
  VRN-PRC2 in the sporophyte, and the cold-formed PHD-PRC2 at FLC. It is required for PRC2-mediated H3K27
  trimethylation, repression of seed development before fertilization, and competence to flower after
  vernalization. MSI1 binds LHP1, linking PRC2 to H3K27me3-marked chromatin in a positive feedback loop.
  MSI1 is also the p48 subunit of chromatin assembly factor CAF-1 (with FAS1 and FAS2), a component of
  the RBR1-associated DREAM complex, and a DDB1-binding CUL4 substrate receptor. With RBR1 it represses
  MET1 during female gametogenesis.
