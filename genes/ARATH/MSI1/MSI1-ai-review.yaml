core_functions:
- description: >-
    Histone-binding WD40 subunit of all plant PRC2 complexes. It is required for PRC2 H3K27me3 deposition
    at targets including FLC, and it bridges PRC2 to the H3K27me3-binding protein LHP1.
  molecular_function:
    id: GO:0042393
    label: histone binding
  contributes_to_molecular_function:
    id: GO:0046976
    label: histone H3K27 methyltransferase activity
