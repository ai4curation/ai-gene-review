id: Q9FG74
gene_symbol: D6PK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: D6PK is a plant AGCVIII protein serine/threonine kinase that activates PIN-mediated auxin
  efflux by phosphorylating PIN cytoplasmic loops. It occupies the basal plasma membrane in many cells
  and cycles through intracellular trafficking compartments; during root-hair formation it can move into
  a planar polar membrane domain. Membrane recruitment involves polyacidic-phospholipid binding through
  a polybasic motif, S-acylated middle-domain cysteine motifs and PDK1-dependent regulation. D6PK and
  PID have overlapping but different PIN phosphosite preferences. D6PK activation of transport does not
  by itself establish a PIN polarity switch. Together with D6PK-like paralogs, it contributes to auxin
  transport, tropic growth and root-hair positioning.
