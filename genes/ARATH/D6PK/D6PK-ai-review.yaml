id: Q9FG74
gene_symbol: D6PK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: D6 PROTEIN KINASE (D6PK; AGC1-1) is a plant AGCVIII-family serine/threonine protein
  kinase that activates PIN-FORMED auxin efflux carriers. D6PK is associated with the basal
  (rootward) plasma membrane of many cell types, where it colocalizes with PIN1, PIN2, PIN3
  and PIN4. Membrane association depends on binding of polyacidic phospholipids, notably PI4P
  and PI(4,5)P2 made by PIP5K1/PIP5K2, through a polybasic lysine-rich motif in its middle
  domain, and D6PK cycles between the membrane and endosomes in a GNOM/BFA-sensitive manner.
  D6PK directly phosphorylates serines in the PIN central hydrophilic loop, with site preferences
  that differ from PINOID, and this phosphorylation activates PIN-mediated auxin efflux without,
  by itself, switching PIN polarity. With its paralogs D6PKL1-3, D6PK is required for efficient
  basipetal auxin transport, lateral root initiation, root and hypocotyl gravitropism and
  phototropic hypocotyl bending (via PIN3/4/7), and it modulates planar polarity of root hair
  positioning.
