suggested_questions:
- question: How is D6PK basal polarity maintained independently of PIN polarity, given its rapid BFA-sensitive
    endosomal cycling?
  experts:
  - Plant cell polarity researchers
suggested_experiments:
- hypothesis: D6PK-specific phosphosites on PINs increase transport turnover rather than PIN abundance
    at the membrane.
  description: Reconstitute PIN1 or PIN3 with D6PK in proteoliposomes and compare transport kinetics of
    phosphomimic and phosphodead PIN variants at D6PK-preferred sites.
