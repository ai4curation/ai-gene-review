id: Q708Y0
gene_symbol: EBF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: EBF2 (EIN3-BINDING F-BOX PROTEIN 2, At5g25350) is a leucine-rich-repeat F-box protein, paralogous
  to EBF1, that acts as the substrate-recognition subunit of an SCF (SKP1-CUL1-F-box) E3 ubiquitin ligase.
  SCF(EBF2) binds the ethylene-responsive transcription factors EIN3 and EIL1 and directs their ubiquitination
  and 26S proteasome-dependent degradation, so negatively regulating ethylene signalling. ebf2 mutants
  are ethylene-hypersensitive and ebf1 ebf2 double mutants show constitutive ethylene responses and severe
  growth arrest. Unlike EBF1, EBF2 is transcriptionally induced by ethylene through direct binding of
  EIN3 to its promoter, forming a negative feedback loop; EBF2 acts mainly in the later phase of the ethylene
  response and in growth recovery after ethylene removal. Ethylene lowers EBF2 levels by promoting EBF2
  protein turnover and by EIN2-directed translational repression mediated by the EBF2 mRNA 3' UTR. EBF2
  is nuclear.
