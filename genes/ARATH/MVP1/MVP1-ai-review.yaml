core_functions:
- description: >-
    Catalytically inactive GDSL-lipase-like secretory protein that acts in the early
    secretory pathway (ER/Golgi) to maintain ER network morphology and normal organelle
    distribution, preventing NAI1-dependent aggregation of the ER and enmeshed organelles in
    ER-body-forming cells. It associates with PYK10 complex components and the myrosinase
    TGG2 and is required for ER export of cargo such as GLL23; its molecular activity is
    unknown and does not need the GDSL catalytic serine.
  directly_involved_in:
