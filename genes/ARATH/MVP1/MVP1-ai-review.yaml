id: Q7XA74
gene_symbol: MVP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MVP1 (MODIFIED VACUOLE PHENOTYPE 1; also ERMO3, GOLD36, NUC, GLL25; At1g54030) is a
  catalytically inactive member of the GDSL lipase/esterase (SGNH hydrolase) family, related
  to the myrosinase-associated proteins of Brassicaceae such as ESM1 and GLL23. Its block-I
  motif reads GDGL instead of GDSL and the recombinant protein shows no esterase or lipase
  activity. MVP1 is a soluble, N-glycosylated secretory protein with an N-terminal signal
  peptide; it is translated into the endoplasmic reticulum (ER), passes through the
  ER/Golgi and accumulates in the lumen of the vacuole. Loss-of-function alleles, isolated
  independently in four forward-genetic screens, cause the ER to collapse into large
  perinuclear aggregates and bulges that entangle Golgi stacks, vacuolar membranes and
  other organelles, with secondary defects in ER export and in delivery of secretory,
  vacuolar and plasma-membrane cargo, including the myrosinase TGG2, the GDSL protein GLL23
  and the PEN3 ABC transporter. The aggregation is confined to ER-body-forming cells and
  depends on the ER-body transcription factor NAI1. MVP1 co-purifies with components of the
  PYK10 beta-glucosidase complex and binds the myrosinase TGG2. A version retained by
  ER/Golgi cycling (HDEL tag) is sufficient for function, so it acts early in the secretory
  pathway to keep ER morphology and organelle distribution normal. Mutants are
  salt-sensitive, release more nitriles during glucosinolate hydrolysis and are less
  resistant to fungal pathogens.
