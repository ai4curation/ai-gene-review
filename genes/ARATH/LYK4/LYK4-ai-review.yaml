  review:
    summary: InterPro2GO mapping from the Ser/Thr/Tyr kinase catalytic domain signature (IPR001245). The
      LYK4 intracellular domain has the kinase fold but lacks key catalytic residues, and recombinant LYK4
      failed to phosphorylate myelin basic protein; LYK4 is treated as a pseudokinase whose signalling
      partner CERK1 supplies the kinase activity.
    action: REMOVE
    reason: Domain-based mapping that ignores loss of catalytic residues. Wan et al. 2012 report missing
      key residues (domain VII, needed to align ATP for phosphotransfer) and no activity in an in vitro
      kinase assay, and Cao et al. 2014 model LYK4 and LYK5 as kinase-inactive receptors with CERK1 as
      the signalling kinase. A catalytic activity term is therefore not supported for LYK4.
    supported_by:
    - reference_id: PMID:22744984
      supporting_text: LYK4 also appears to be an inactive kinase, since the comparison of the LYK4 kinase
        domain with other typical kinases revealed that certain key residues are missing
    - reference_id: PMID:22744984
      supporting_text: kinase assays using recombinant LYK4 protein isolated after expression in Escherichia
        coli failed to show phosphorylation of the common kinase substrate Myelin Basic Protein
    - reference_id: PMID:25340959
      supporting_text: In this model, AtLYK5 (or AtLYK4) serves as a chitin perception, while AtCERK1 is
        responsible for chitin signaling transduction due to lack of kinase activity of AtLYK5 (or AtLYK4).
