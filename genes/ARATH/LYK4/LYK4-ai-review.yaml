id: O64825
gene_symbol: LYK4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'LYK4 (LysM-containing receptor-like kinase 4, At2g23770) is a single-pass type I plasma
  membrane protein of the Arabidopsis LysM receptor-like kinase family. It has a signal peptide, an extracellular
  region with three LysM motifs, a transmembrane helix and an intracellular kinase-like domain. The kinase
  domain lacks key catalytic residues and recombinant LYK4 shows no detectable kinase activity, so LYK4
  is best regarded as a pseudokinase. LYK4 is the closest paralog of LYK5 and acts with it as a chitin-binding
  co-receptor of the active kinase CERK1 in fungal chitin perception. LYK4 is recovered with chitin beads,
  although soluble chitin oligomers compete its binding only weakly. Its ectodomain homodimerizes and
  binds the LYK5 ectodomain, and LYK4 associates with CERK1 independently of chitin, consistent with a
  LYK5-associated co-receptor or scaffold role in a CERK1-LYK5-LYK4 receptor complex. lyk4 mutants show
  reduced chitin-induced gene expression, calcium elevation and ROS, and are more susceptible to Alternaria
  brassicicola and Pseudomonas syringae; lyk4 lyk5 double mutants lose all tested chitin responses, like
  cerk1. LYK4 is also present in the plasmodesmal plasma membrane, where it associates with the GPI-anchored
  chitin-binding protein LYM2, and both LYK4 and LYK5 are required for chitin-triggered, CERK1-independent
  callose deposition and closure of plasmodesmata.'
