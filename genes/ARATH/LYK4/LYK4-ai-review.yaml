suggested_questions:
- question: Should LYK4 carry coreceptor activity (GO:0015026) or pattern recognition receptor activity
    (GO:0038187) like LYK5? LYK4 binds chitin weakly, interacts with CERK1 independently of chitin, and
    is described as a LYK5-associated co-receptor or scaffold.
- question: Does LYK4 bind chitin directly with measurable affinity, or is its recovery on chitin beads
    mediated by LYK5 or CERK1 in the same membrane complex?
- question: Is there a bacterial ligand (for example peptidoglycan) for LYK4 that explains the enhanced
    susceptibility of lyk4 to Pseudomonas syringae, given that flg22 and elf26 responses are unaffected?
- question: Once GO has a term for regulation of plasmodesmata-mediated intercellular transport (proposed
    in the LYM2 review), should LYK4 be annotated to it given its plasmodesmal localization and association
    with LYM2?
suggested_experiments:
- description: Measure chitooctaose binding by the purified LYK4 ectodomain (ITC or microscale thermophoresis)
    alongside LYK5 and CERK1 to establish whether LYK4 binds chitin directly and with what affinity.
- description: Complement lyk4 lyk5 double mutants with LYK4 variants carrying LysM mutations or lacking
    the ectodomain-ectodomain interaction with LYK5 to test which LYK4 property restores chitin signalling.
- description: Test nucleotide binding by the purified LYK4 pseudokinase domain (thermal shift or MANT-ATP)
    to resolve whether the ATP binding annotation has any basis.
