- term:
    id: GO:0015026
    label: coreceptor activity
  evidence_type: IPI
  original_reference_id: PMID:31270545
  review:
    summary: LYK4 ectodomains homodimerize and bind LYK5 ectodomains, LYK4 co-immunoprecipitates with LYK5
      and CERK1 after chitin treatment, and LYK4 associates with CERK1 independently of chitin. LYK4 binds
      chitin but lacks kinase activity and is partially redundant with LYK5, which is the main chitin
      receptor.
    action: NEW
    reason: LYK4 does part of the work of chitin perception (it is a chitin-binding receptor subunit of
      the CERK1-LYK5 complex) rather than being a downstream requirement, so a receptor-type MF is warranted
      to capture its role beyond chitin binding. Coreceptor activity (combining with a messenger in cooperation
      with a nearby primary receptor) matches the authors' conclusion that LYK4 is a LYK5-associated co-receptor
      or scaffold, better than pattern recognition receptor activity, which is used for LYK5 as the main
      high-affinity chitin receptor. Comparator check - LYK5 (GO:0038187, NEW in its review) and CERK1 carry
      receptor-type MFs; no LYK4 MF beyond chitin binding is in GOA because the relevant interaction papers
      have not been curated.
    supported_by:
    - reference_id: PMID:31270545
      supporting_text: our data suggest that LYK4 functions as a LYK5-associated co-receptor or scaffold
        protein that enhances chitin-induced signaling in Arabidopsis
