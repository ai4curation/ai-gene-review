    kinase CERK1 at the plasma membrane. LYK4 associates with LYK5 and CERK1 in a tripartite chitin receptor
    complex, enhancing chitin-induced signalling (ROS, calcium, MAPK activation, defense gene expression)
    for pattern-triggered immunity; CERK1 provides the kinase activity.
