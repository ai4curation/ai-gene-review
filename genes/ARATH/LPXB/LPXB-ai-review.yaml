- description: Mitochondrial lipid-A-disaccharide synthase that condenses UDP-2,3-diacylglucosamine and
    lipid X (2,3-diacylglucosamine 1-phosphate) to the disaccharide 1-phosphate in the plant lipid A
    precursor pathway; loss of LPXB causes accumulation of both substrates.
