id: F4IF99
gene_symbol: LPXB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: LPXB (At2g04560) is a nuclear-encoded, mitochondrially targeted lipid-A-disaccharide synthase
  of the LpxB (glycosyltransferase family 19) family, the single Arabidopsis ortholog of E. coli LpxB.
  By orthology it condenses UDP-2,3-diacylglucosamine with 2,3-diacylglucosamine 1-phosphate (lipid
  X) to form the beta-1',6-linked lipid A disaccharide 1-phosphate, the fifth step of the plant lipid
  A precursor pathway that mirrors the E. coli Raetz pathway (LpxA, LpxC, LpxD, LpxB, LpxK, KdtA).
  Null lpxb mutants accumulate both LpxB substrates, lipid X (about 40-fold) and UDP-2,3-diacylglucosamine,
  and lack downstream intermediates, but grow normally. An N-terminal GFP fusion is targeted to mitochondria,
  where the lipid X pool of lpxb mutants is concentrated. The final plant lipid A-like product and its
  physiological role, possibly a component of mitochondrial membranes or a signalling lipid, are unknown.
