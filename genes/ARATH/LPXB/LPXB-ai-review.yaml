  review:
    summary: Lipid A biosynthetic process from PAINT node PTN000769503 (E. coli LpxB). Wei et al. 2020
      (RAR) flagged this as a probable plant misannotation, but for LPXB the flag is refuted.
    action: ACCEPT
    reason: 'The node placement is sound, and gene-specific experiments support the inherited process.
      AtLpxB catalyses a step of the lipid A precursor pathway, so it does the work of the process. lpxb
      nulls accumulate the two LpxB substrates, lipid X and UDP-2,3-diacyl-GlcN. Epistasis with LpxC-RNAi
      and lpxd2 orders LpxB after LpxC and LpxD, as in E. coli. The LpxB product is found downstream in
      lpxk and kdta mutants. The plant end product is unknown, but this does not weaken involvement in
      the lipid A precursor pathway. The low taxon rate-ratio reflected sparse plant curation, not absence
      of the pathway. This row also carries the experimental (IMP) evidence, which in GOA is attached
      only to the obsolete lipid X term.'
    propagation_review:
