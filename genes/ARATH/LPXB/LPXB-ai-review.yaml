suggested_questions:
- question: Does recombinant mature AtLpxB condense UDP-2,3-diacyl-GlcN and lipid X in vitro, and does
    it complement an E. coli lpxB mutant?
- question: Is AtLpxB a peripheral membrane protein of the mitochondrial inner or outer membrane, as E.
    coli LpxB is peripheral to the inner membrane?
- question: Why does lipid X from lpxb-1 plants also appear in chloroplast fractions? Is there lipid
    trafficking from mitochondria to plastids?
suggested_experiments:
- experiment_type: in vitro enzyme assay and heterologous complementation
  hypothesis: AtLpxB is a functional lipid-A-disaccharide synthase.
  description: Express mature AtLpxB (without the 58-residue transit peptide) in E. coli, assay with UDP-2,3-diacyl-GlcN
    and lipid X, identify the disaccharide 1-phosphate by LC-ESI/MS, and test rescue of a conditional
    E. coli lpxB mutant.
- experiment_type: sub-mitochondrial fractionation
  hypothesis: AtLpxB is associated with a mitochondrial membrane where its lipid acceptor resides.
  description: Protease protection and carbonate extraction of mitochondria from lines expressing full-length
    tagged LPXB under its native promoter.
- experiment_type: stress and pathogen phenotyping
  hypothesis: The plant lipid A-like product has a conditional role in mitochondrial membrane function
    or defence.
  description: Challenge lpxb null mutants with bacterial pathogens and mitochondrial stressors, and compare
    mitochondrial membrane lipid profiles with wild type.
