  evidence_type: IMP
  original_reference_id: PMID:21709257
  qualifier: enables
  review:
    summary: Lipid-A-disaccharide synthase activity by IMP. In two independent null alleles (atlpxb-1,
      atlpxb-2), both LpxB substrates accumulate (lipid X 42-fold; UDP-2,3-diacyl-GlcN detectable only
      in lpxb).
    action: ACCEPT
    reason: Loss of the gene causes accumulation of both the donor and acceptor substrates of the LpxB
      reaction, while the LpxB product (disaccharide 1-phosphate) is found only in mutants of the next
      steps (lpxk, kdta). This is strong genetic evidence for the activity. No in vitro assay has been
      reported, but together with orthology the IMP is sound. Core function.
    supported_by:
    - reference_id: PMID:21709257
      supporting_text: Lipid X accumulates 42-fold in the atlpxb-1 mutant compared to the Col-0 wild type
        by this criterion
    - *substrates
    - reference_id: PMID:21709257
      supporting_text: The independently isolated atlpxb-2 , atlpxk-2 , and atlpxk-3 mutants showed similar
        lipid accumulation patterns as the atlpxb-1 and atlpxk-1 mutants.
