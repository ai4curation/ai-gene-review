proposed_new_terms: []
suggested_questions:
- question: >-
    Is 3-dehydroshikimate transferred between the two active sites without release in vivo, or
    does the proximity effect only raise its local concentration? Does any DHS escape to
    competing reactions (for example, the plant quinate dehydrogenase paralogs or
    protocatechuate formation)?
suggested_experiments:
- description: >-
    Run steady-state and transient-kinetic assays of wild-type DHQ-SDH and of an interdomain
    linker or orientation mutant, adding exogenous DHS trap enzymes. This tests whether the
    intermediate is channelled between the DHQase and SDH sites.
