gene_symbol: EMB3004
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  EMB3004 (At3g06350, DHQ-SDH) is the bifunctional 3-dehydroquinate dehydratase / shikimate
  dehydrogenase of the Arabidopsis plastid shikimate pathway. It carries out pathway steps 3
  and 4. It is a nuclear-encoded, 603-residue precursor with an N-terminal chloroplast transit
  peptide, and the mature enzyme is a soluble monomer in the chloroplast stroma. An N-terminal
  type I dehydroquinase domain dehydrates 3-dehydroquinate to 3-dehydroshikimate through a
  Schiff-base lysine intermediate. A C-terminal shikimate dehydrogenase domain then reduces
  3-dehydroshikimate to shikimate with NADPH, using Lys385 and Asp423 as catalytic residues and
  Ser336 for substrate binding. Crystal structures with shikimate, 3-dehydroshikimate and NADP(H)
  show the two active sites facing each other, which raises the local concentration of the
  shared intermediate 3-dehydroshikimate. The shikimate it produces feeds chorismate synthesis
  and hence aromatic amino acid, folate and phenylpropanoid metabolism. Loss of the gene causes
  early embryo lethality (embryo defective 3004).
