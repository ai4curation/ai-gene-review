  evidence_type: RCA
  original_reference_id: PMID:21166475
  qualifier: located_in
  negated: true
  review:
    summary: >-
      NOT cytosol, based on the Ito et al. (2011) cytosolic proteome of Arabidopsis cell
      suspensions. The study defines a set of proteins that are not targeted to organelles.
      EMB3004 has a chloroplast transit peptide and is found in chloroplast and stromal
      proteomes.
    action: ACCEPT
    reason: >-
      The negative statement is consistent with all other evidence: a predicted 66-residue
      transit peptide and repeated detection in purified chloroplasts and stroma. The precursor
      is made in the cytosol, but the enzyme does not reside or act there. Accepting the NOT
      annotation does not conflict with any positive cytosol row, because none exists.
    supported_by:
