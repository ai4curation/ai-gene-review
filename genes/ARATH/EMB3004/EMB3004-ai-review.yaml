    reason: >-
      The mutant phenotype is real but indirect. The enzyme catalyses two steps of the only
      route to aromatic amino acids in the plant, so embryo lethality reflects metabolic
      necessity rather than a developmental activity. The acts_upstream_of_or_within IMP
      statement is acceptable as non-core context, but it is not a process the enzyme carries
      out.
    supported_by:
    - reference_id: PMID:15634699
      supporting_text: Unexpectedly, nearly half of the mutants isolated in this study were found to
        be primarily defective in post-fertilization processes dependent on the maternal allele
