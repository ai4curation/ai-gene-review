- term:
    id: GO:0009793
    label: embryo development ending in seed dormancy
  evidence_type: IMP
  original_reference_id: PMID:15634699
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Pagnussat et al. (2005) recovered an insertion in this gene in a large Ds screen for female
      gametophyte and early embryo defects. The gene is listed as EMBRYO DEFECTIVE 3004.
