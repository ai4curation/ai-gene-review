id: P93831
gene_symbol: CLF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  CLF (CURLY LEAF) is one of three Arabidopsis homologs of Drosophila Enhancer of zeste. It is a SET-domain
  histone H3 lysine 27 methyltransferase and a catalytic subunit of sporophytic Polycomb Repressive Complex
  2, in EMF2-PRC2 and VRN2-PRC2 together with FIE and MSI1. CLF acts partly redundantly with SWINGER to
  deposit H3K27me3 and silence developmental regulators, including the floral homeotic gene AGAMOUS, class
  I KNOX genes, FT, FLC and senescence-associated genes. Loss of CLF gives curled leaves and early flowering.
  During vernalization, CLF is required to spread H3K27me3 from the FLC nucleation region over the whole
  locus after return to warmth, turning metastable silencing into long-term epigenetic memory.
