core_functions:
- description: >-
    Catalytic E(z)-type subunit of sporophytic PRC2 (with EMF2 or VRN2, FIE and MSI1) that trimethylates
    H3K27 to silence developmental genes. It spreads H3K27me3 over FLC after vernalization.
  molecular_function:
    id: GO:0046976
    label: histone H3K27 methyltransferase activity
  directly_involved_in:
  - id: GO:0045814
    label: negative regulation of gene expression, epigenetic
  - id: GO:0010048
    label: vernalization response
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0035098
    label: ESC/E(Z) complex
  supported_by:
  - reference_id: PMID:17881378
    supporting_text: >-
      Disrupted ATX1 or CLF function results in misexpression of AG, recognizable phenotypes and loss
      of H3K4me3 or H3K27me3 histone H3-tail marks, respectively.
  - reference_id: PMID:26642436
    supporting_text: >-
      Using tagged CLF we identified EMF2 and VRN2 ... confirming that CLF occurs in both VRN2-PRC2 and
      EMF2-PRC2 complexes in vivo.
  - reference_id: PMID:40858112
    supporting_text: >-
      can be separated from the stable spread H3K27me3 state in mutants defective in one of the PRC2 methyltransferases
      genes, CURLY LEAF (CLF) or LIKE HETEROCHROMATIN PROTEIN 1, required to maintain long-term silencing.
suggested_questions:
- question: >-
    What determines whether CLF or SWN occupies VRN2-PRC2 at FLC during nucleation versus spreading?
