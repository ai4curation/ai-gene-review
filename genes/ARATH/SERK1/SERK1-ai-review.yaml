  - InterPro:IPR008271
  review:
    summary: InterPro-based IEA for protein kinase activity.
    action: MODIFY
    reason: True but general. SERK1 is a single-pass type I receptor with an active cytoplasmic kinase domain (K330E abolishes
      activity) that acts as a ligand-recruited co-receptor kinase. The supported specific term, already carried by the IBA
      and IDA rows, is GO:0004675, an is_a descendant of GO:0004672 via GO:0004674 and GO:0019199 (checked in OLS).
    proposed_replacement_terms:
    - &id001
      id: GO:0004675
      label: transmembrane receptor protein serine/threonine kinase activity
    supported_by:
    - &id004
      reference_id: PMID:11509554
      supporting_text: A K330E substitution in the kinase domain of AtSERK1 abolishes all kinase activity.
    - &id002
      reference_id: PMID:11509554
      supporting_text: The active AtSERK1(kin) can phosphorylate inactive AtSERK1(K330E) protein, suggesting an intermolecular
        mechanism of autophosphorylation.
    - &id003
      reference_id: file:ARATH/SERK1/SERK1-uniprot.txt
      supporting_text: Single-pass type I membrane protein
