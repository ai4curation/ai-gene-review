suggested_questions:
- question: Does SERK1 participate in zygotic embryo development (it is expressed in all embryo cells up to heart stage),
    or is its embryo role limited to somatic embryogenesis competence in culture? Which SERK combinations underlie the embryo
    lethality of the quadruple mutant?
- question: How is the early negative effect of SERK1 on abscission in nev flowers (Lewis et al. 2010) reconciled with its
    role as a positive HAESA co-receptor (Santiago et al. 2016)?
- question: Should the SERK1 BRI1 co-receptor role be modelled with the SERK1 LRR contribution to brassinolide binding (UniProt
    BINDING 61-62), and is a steroid-binding MF term warranted for a co-receptor that contacts the ligand only in the complex?
suggested_experiments:
- description: Phenotype serk1 single and higher-order mutants (serk1 serk2 bak1 bkk1 with conditional complementation) for
    zygotic embryo patterning defects, to test whether SERK1 contributes to embryogenesis in planta.
- description: Map in vivo SERK1 and HAESA transphosphorylation sites in abscission zones and test phospho-dead SERK1 variants
    for complementation of the serk1 abscission delay.
