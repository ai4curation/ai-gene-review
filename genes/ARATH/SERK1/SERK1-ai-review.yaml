id: Q94AG2
gene_symbol: SERK1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'SERK1 (SOMATIC EMBRYOGENESIS RECEPTOR KINASE 1, At1g71830) is a leucine-rich repeat receptor-like kinase of
  the five-member SERK family. It is a single-pass type I plasma membrane protein with a short LRR ectodomain and an active
  cytoplasmic kinase domain that autophosphorylates intermolecularly, mainly on threonines, and phosphorylates partner proteins
  on serine and threonine (and tyrosine in vitro). SERK1 acts as a shared, ligand-recruited co-receptor: ligand binding to
  an LRR receptor kinase creates a docking surface for the SERK1 ectodomain, and the two kinase domains then transphosphorylate.
  SERK1 is a major co-receptor of the brassinosteroid receptor BRI1, redundantly with BAK1 and BKK1 (serk1 bak1 bkk1 triple
  mutants are blind to brassinosteroids), a co-receptor of EMS1 redundantly with SERK2 in tapetum specification during anther
  development (serk1 serk2 is male sterile), and the co-receptor of HAESA that enables high-affinity IDA peptide sensing in
  floral organ abscission. It also associates with ERECTA-family, PSK, RGF, FLS2 and EFR receptors, with minor roles in those
  pathways. SERK1 overexpression enhances somatic embryogenesis in culture, the property that gave the gene its name.'
