- term:
    id: GO:0004675
    label: transmembrane receptor protein serine/threonine kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G71830
  - PANTHER:PTN008264361
  review:
    summary: PAINT IBA for transmembrane receptor Ser/Thr kinase activity from SERK clade node PTN008264361; the donor is
      SERK1 itself (AT1G71830).
    action: ACCEPT
    reason: SERK1 has its own IDA for this term (PMID:11509554), which is the descendant evidence behind the node; its appearance
      in With/From is expected, not circular. The type I topology, active kinase domain and ligand-dependent co-receptor function
      support the term as the core activity.
    supported_by:
    - *id004
    - *id002
    - *id003
    - &id019
      reference_id: PMID:27058169
      supporting_text: Consistently, the HAESA kinase domain can transphosphorylate SERK1 and vice versa in in vitro transphosphorylation
        assays
- term:
    id: GO:0004675
    label: transmembrane receptor protein serine/threonine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:11509554
  qualifier: enables
  review:
    summary: 'IDA (Shah et al. 2001): recombinant SERK1 kinase domain autophosphorylates intermolecularly, mainly on Thr;
      K330E is kinase dead.'
    action: ACCEPT
    reason: Abstract states the kinase biochemistry clearly and UniProt curates the mutagenesis and kinetics (Km ATP 4 uM)
      from this paper. Combined with the type I receptor topology and later evidence that SERK1 transphosphorylates partner
      receptors (EMS1, HAESA), this is the core molecular function.
    supported_by:
    - *id004
    - *id002
    - &id007
      reference_id: file:ARATH/SERK1/SERK1-uniprot.txt
      supporting_text: KM=4 uM for ATP
      record_section:
      - CC:BIOPHYSICOCHEMICAL PROPERTIES
    - *id003
- term:
    id: GO:0004713
    label: protein tyrosine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:10596
  review:
    summary: Rhea-based IEA (RHEA:10596, protein tyrosine phosphorylation).
    action: KEEP_AS_NON_CORE
    reason: SERK1 phosphorylates tyrosine on artificial substrates in vitro and is described as a dual specificity kinase,
      so the term is true; but tyrosine phosphorylation has no demonstrated signalling role for SERK1, whose physiological
      outputs are Ser/Thr transphosphorylation of partner receptors and CDC48A.
    supported_by:
    - &id005
      reference_id: PMID:11509554
      supporting_text: AtSERK1 phosphorylation on myelin basic protein and casein showed tyrosine, serine, and threonine as
        targets, demonstrating that AtSERK1 is a dual specificity kinase.
- term:
    id: GO:0004714
    label: transmembrane receptor protein tyrosine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:2.7.10.1
  review:
    summary: EC 2.7.10.1 mapping gives transmembrane receptor protein tyrosine kinase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The receptor-tyrosine-kinase term asserts that SERK1 transmits its signal by tyrosine phosphorylation. Tyrosine
      phosphorylation by SERK1 is shown only on artificial substrates in vitro, and the co-receptor output that is established
      (BRI1, EMS1, HAESA, CDC48A) is Ser/Thr phosphorylation; GO:0004675 is the receptor kinase term that fits. Same decision
      as for SERK4.
    supported_by:
    - *id005
    - *id006
