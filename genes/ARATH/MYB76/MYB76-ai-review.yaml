  evidence_type: ISS
  original_reference_id: PMID:11118137
  qualifier: enables
  review:
    summary: >-
      Sequence-based assignment from the genome-wide catalogue of Arabidopsis
      transcription factors.
    action: MODIFY
    reason: >-
      Correct but less specific than the evidence supports. MYB76 trans-activates
      glucosinolate gene promoters and is a positive regulator of their transcription
      [PMID:18042203, PMID:20348214]; no repressor activity on its direct targets has been
      shown (the downregulation of indolic regulators is not shown to be direct). The
      core function is therefore DNA-binding transcription activator activity, RNA
      polymerase II-specific (GO:0001228, an is_a descendant of GO:0003700).
    proposed_replacement_terms:
