suggested_questions:
- question: >-
    Why does 35S-driven MYB76 induce aliphatic glucosinolates in myb28 myb29 leaves
    (PMID:20348214) while native-promoter MYB76 does not (PMID:23792303)? Is this purely
    an expression-level effect or does MYB76 require partner proteins expressed only in
    some cells?
- question: >-
    Is the effect of MYB76 on leaf spatial distribution of aliphatic glucosinolates due to
    regulation of glucosinolate transporters (e.g. GTR1/GTR2) or of local synthesis?
- question: >-
    Is the down-regulation of indolic glucosinolate regulators by MYB76 direct
    (repressor activity) or indirect?
suggested_experiments:
- description: >-
    DAP-seq or ChIP-seq of tagged MYB76 in planta to define direct target promoters and
    its binding motif, with and without MYC2/3/4.
  hypothesis: MYB76 directly binds promoters of FMO GSOX1, AOP2 and SOT17.
- description: >-
    Leaf-section glucosinolate profiling of myb76 combined with transporter mutants
    (gtr1 gtr2) and expression analysis of GTR genes in myb76.
  hypothesis: MYB76 affects spatial glucosinolate distribution via transporter gene
    expression.
