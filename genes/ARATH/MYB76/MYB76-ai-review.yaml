      label: DNA-binding transcription activator activity, RNA polymerase II-specific
    supported_by:
    - reference_id: PMID:18042203
      supporting_text: Both HAG2/MYB76 and HAG3/MYB29 were shown to be positive regulators
        of aliphatic glucosinolate biosynthesis.
    - reference_id: PMID:20348214
      supporting_text: Based on data from overexpression lines, clearly all three genes,
        MYB28 , MYB29 , and MYB76 , were capable of inducing aliphatic GLSs, and they
        seemed to confer their regulation by positively regulating the transcription of
        aliphatic biosynthetic genes
