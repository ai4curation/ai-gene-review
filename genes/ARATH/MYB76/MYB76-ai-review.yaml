taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MYB76 (HIGH ALIPHATIC GLUCOSINOLATE 2, HAG2; At5g07700) is a nuclear R2R3-MYB
  transcription factor of subgroup 12 that, together with its paralogs MYB28/HAG1 and
  MYB29/HAG3, positively regulates the genes of methionine-derived (aliphatic)
  glucosinolate biosynthesis. It carries two N-terminal HTH Myb-type DNA-binding repeats
  followed by a disordered C-terminal region. Overexpression raises aliphatic
  glucosinolates and trans-activates biosynthetic gene promoters, while knockdown lowers
  short-chain aliphatic glucosinolates and transcripts of FMO GSOX1, AOP2, SOT17 and
  MYB29. MYB76 can induce aliphatic glucosinolates when overexpressed in the absence of
  MYB28 and MYB29, but from its native promoter it depends on these paralogs for normal
  leaf expression. It has a distinctive role in shaping the spatial distribution of
  aliphatic glucosinolates within the leaf, and the three HAG factors cross-activate each
  other and repress indolic glucosinolate regulators. MYB76 interacts with the bHLH
  factors MYC2, MYC3 and MYC4. It is expressed in vegetative and reproductive organs,
  around leaf veins and in trichomes, is induced by wounding and drought, reduced by aphid
  feeding, and its expression tracks sulfur availability.
