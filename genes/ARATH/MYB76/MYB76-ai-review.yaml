- description: >-
    Nuclear R2R3-MYB transcriptional activator that, together with MYB28 and MYB29 and
    bHLH partners MYC2/3/4, binds and activates promoters of aliphatic glucosinolate
    biosynthetic genes (core-structure and side-chain modification enzymes such as FMO
    GSOX1, AOP2 and SOT17), contributing to the profile and leaf spatial distribution of
    aliphatic glucosinolates.
