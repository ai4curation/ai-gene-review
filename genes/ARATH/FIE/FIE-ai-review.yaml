id: Q9LT47
gene_symbol: FIE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  FIE (FERTILIZATION-INDEPENDENT ENDOSPERM) is the single Arabidopsis homolog of Drosophila Extra sex
  combs (ESC/EED), a WD40-repeat propeller protein that is a core subunit of all plant Polycomb Repressive
  Complex 2 variants. It partners with the E(z) methyltransferases MEA, CLF or SWN, the Su(z)12 homologs
  FIS2, EMF2 or VRN2, and MSI1. In the female gametophyte, FIS-PRC2 (MEA-FIS2-FIE-MSI1) represses central-cell
  proliferation before fertilization and controls endosperm development and imprinting. In the sporophyte,
  FIE-containing PRC2 complexes repress flowering and floral homeotic genes from embryo and seedling stages
  onward. FIE is also part of the cold-formed PHD-PRC2 that nucleates H3K27me3 at FLC during vernalization.
