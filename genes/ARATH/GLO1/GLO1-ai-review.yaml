  review:
    summary: Detected in a 2-D gel/MALDI-TOF survey of the Arabidopsis nuclear proteome.
    action: MARK_AS_OVER_ANNOTATED
    reason: Glycolate oxidase is a soluble peroxisomal matrix enzyme with a C-terminal PTS1 and is one
      of the most abundant proteins of photosynthetic leaves; it was identified in purified leaf peroxisomes
      (PMID:17951448) and acts there in the C2 cycle (PMID:22303256). Detection in a bulk organelle or
      fraction proteome of this kind is most simply explained by carry-over of peroxisomes or peroxisomal
      matrix protein (peroxisomes are physically appressed to chloroplasts in leaf cells), and no targeted
      study shows a functional pool of GOX in this compartment. The high-throughput detection is not contradicted,
      but it does not describe where the enzyme acts. Action follows the ARATH convention for single high-throughput
      proteomics location hits (projects/ARATH/organelle-audit.md, rule 3). There is no nuclear-localization
      signal or nuclear role reported for glycolate oxidase.
