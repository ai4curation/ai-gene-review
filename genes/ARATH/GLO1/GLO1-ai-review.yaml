taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GLO1 (GOX1, At3g14420) encodes one of the two major leaf glycolate oxidases of Arabidopsis,
  a peroxisomal FMN-dependent (S)-2-hydroxy-acid oxidase that oxidizes glycolate to glyoxylate with O2,
  producing H2O2. The recombinant enzyme has glycolate oxidase activity with kinetics close to those of
  its tandem paralog GLO2 (GOX2, At3g14415). In the photorespiratory C2 cycle it catalyzes the peroxisomal
  glycolate-to-glyoxylate step, and its H2O2 product is removed by catalase (CAT2). GOX1 and GOX2 are
  co-regulated with other photorespiratory genes and are largely redundant in air, so single mutants grow
  normally while combined knock-down causes a severe photorespiratory phenotype; GOX1 is the more important
  isoform under high photorespiratory flux and in a catalase-deficient background. H2O2 generated by glycolate
  oxidase also contributes to defence signalling during nonhost and gene-for-gene resistance. Note that
  the GOX1/GOX2 names for At3g14420/At3g14415 are crossed in part of the literature.
