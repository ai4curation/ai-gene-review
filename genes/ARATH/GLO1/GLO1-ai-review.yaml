suggested_questions:
- question: GOA has an EXP (S)-2-hydroxy-acid oxidase activity row for GLO2 from PMID:25416784 but none
    for GLO1, although the same paper purified and assayed recombinant GOX1 (At3g14420). Should a matching
    experimental annotation be added to GLO1, and was the omission caused by the crossed GOX1/GOX2 naming
    in the literature?
- question: GOX1 and GOX2 are described as nearly identical (PMID:27225899) and are kinetically similar
    in vitro (PMID:25416784), yet loss of GOX1 but not GOX2 suppresses the cat2 phenotype (PMID:27225899).
    Is this difference due to expression level, protein abundance in peroxisomes, or regulation such as
    the reported S-nitrosylation of GOX1?
suggested_experiments:
- description: Quantify GOX1 and GOX2 protein abundance separately in leaf peroxisomes (isoform-specific
    peptides) under low and high light, and test whether a Cys-343 non-nitrosylatable GOX1 variant changes
    the cat2 suppression phenotype.
