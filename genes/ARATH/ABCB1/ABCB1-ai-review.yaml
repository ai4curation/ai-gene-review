- term:
    id: GO:0005634
    label: nucleus
  evidence_type: ISM
  original_reference_id: GO_REF:0000122
  qualifier: located_in
  review:
    summary: The AtSubP nuclear assignment overextends sequence prediction for the intact ABCB1 membrane
      transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: AtSubP is an ISM compartment prediction; experimental-curator deference does not apply. Native
      PGP1/ABCB1 imaging supports a plasma-membrane pool; its experimentally curated multipass topology
      and the ABCB1 structure in PMID:39497419 establish an integral membrane transporter, not a soluble
      nuclear protein. Assigning the intact carrier to the nucleus from the sequence classifier alone
      exceeds the target-specific localization evidence and does not account for the established membrane
      architecture and trafficking. MARK_AS_OVER_ANNOTATED reflects that unsupported compartment assignment,
      not a demonstrated absence from every nuclear-envelope pool. A hypothetical nuclear membrane pool
      or cleaved fragment is not positive support for this row; no such target-specific mechanism is established
      by the cited studies.
    supported_by:
    - reference_id: PMID:17237354
      supporting_text: PGP1 and PGP19 colocalized with PIN1 in the shoot apex in Arabidopsis thaliana
        and with PIN1 and PIN2 in root tissues
    - reference_id: file:ARATH/ABCB1/ABCB1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Multi-pass membrane protein {ECO:0000255, ECO:0000269|PubMed:14517332, ECO:0000269|PubMed:16212599,
        ECO:0000269|PubMed:9761790}.
- term:
