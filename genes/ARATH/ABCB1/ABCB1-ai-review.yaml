id: Q9ZR72
gene_symbol: ABCB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ABCB1/PGP1 is an ATP-binding cassette transporter that exports auxin and bioactive brassinosteroids
  across the Arabidopsis plasma membrane. It contributes to tissue auxin movement and shares developmental
  functions with ABCB19, including cell elongation, light-dependent growth and stamen and pollen development.
  TWD1 regulates its membrane localization and auxin transport activity. Purified ABCB1 directly transports
  brassinolide in proteoliposomes, and structural studies resolve hormone and nucleotide binding. Auxin
  export is supported by native and heterologous cell assays, including TWD1 coexpression, but was not
  detected in the same purified proteoliposome system; the molecular basis of this assay dependence remains
  incompletely resolved.
