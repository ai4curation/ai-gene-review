    label: endoplasmic reticulum
  evidence_type: HDA
  original_reference_id: PMID:28887381
  qualifier: located_in
  review:
    summary: ABCB1 can reside in the ER during defective TWD1-dependent trafficking.
    action: ACCEPT
    reason: The 2017 HDA supplements place ABCB1 in sucrose-gradient/raw-peptide data but do not independently
      resolve an ER assignment. Separate direct native-promoter fusion imaging in PMID20971896 documents
      ABCB1 ER retention in twd1. Retain the informative root-organelle claim with this perturbation context;
      this does not make the ER the established site of normal hormone export or claim the HDA study directly
      showed ER residence.
    supported_by:
