    label: positive regulation of brassinosteroid mediated signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00093743
  review:
    summary: ABCB1 supports BR signaling by controlling extracellular ligand availability.
    action: KEEP_AS_NON_CORE
    reason: GO:1900459 denotes positive regulation of BR signaling, not BR homeostasis or receptor activity.
      PMID:38513023 establishes altered BES1 activation in abcb19 and abcb1 abcb19 mutants and enhanced
      signaling in ABCB1/ABCB19 overexpression lines; PMID:39497419 establishes ABCB1 BR export and includes
      ABCB19 comparisons. Thus the regulatory claim is supported, rather than contradicted because the
      transporter acts upstream of BRI1. Retain it as a non-core signaling consequence of the directly
      established BR-export activity, consistently for both paralogs; the transport molecular function
      remains core. This does not assign BRI1 signal-transduction chemistry to ABCB1, nor resolve the
      BR-versus-auxin contribution to every growth phenotype.
    supported_by:
    - *id007
    - reference_id: PMID:38513023
      supporting_text: ABCB19 and its close homolog, ABCB1, positively regulate brassinosteroid responses
