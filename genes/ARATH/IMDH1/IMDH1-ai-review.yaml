- id: PMID:33568694
  title: >-
    Protein complex formation in methionine chain-elongation and leucine biosynthesis.
  findings:
  - statement: >-
      IMDH1 interacts with the IPMI large subunit LeuC (Y2H, BiFC, Co-IP); IMDH1 is the major
      Met chain-elongation IPMDH.
    supporting_text: >-
      we identified an unprecedented interaction of the IPMI large subunit (LeuC) with IPMDH1
      or IPMDH2, and a weaker interaction with IPMDH3 in both Y2H and BiFC experiments.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; interaction data not yet independently replicated.
- id: PMID:27137927
  title: >-
    Structure and Mechanism of Isopropylmalate Dehydrogenase from Arabidopsis thaliana: INSIGHTS
    ON LEUCINE AND ALIPHATIC GLUCOSINOLATE BIOSYNTHESIS.
  findings:
  - statement: >-
      Structures of AtIPMDH2 define a common mechanism for Leu- and glucosinolate-pathway
      IPMDHs.
    supporting_text: >-
      This study suggests that IPMDH-like enzymes in both leucine and glucosinolate biosynthesis
      pathways use a common mechanism
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text; paralog structure, mechanistic context.
