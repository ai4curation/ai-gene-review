core_functions:
- description: >-
    Chloroplast-stromal NAD+-dependent 3-alkylmalate (isopropylmalate) dehydrogenase specialized
    for the oxidative decarboxylation step of methionine chain elongation in aliphatic glucosinolate
    biosynthesis, with a secondary contribution to L-leucine biosynthesis.
  molecular_function:
    id: GO:0003862
    label: 3-isopropylmalate dehydrogenase activity
  directly_involved_in:
  - id: GO:0019761
    label: glucosinolate biosynthetic process
  - id: GO:0009098
    label: L-leucine biosynthetic process
  locations:
  - id: GO:0009570
    label: chloroplast stroma
  supported_by:
  - *id002
  - *id005
  - *id008
  - *id015
suggested_questions:
- question: >-
    GO obsoleted the methylthioalkylmalate dehydrogenase activity terms into GO:0003862; should
    a specific 3-(omega-methylthio)alkylmalate dehydrogenase term (analogous to GO:0120528
    for the isomerase) be reinstated to distinguish IMDH1 from the Leu-pathway paralogs?
- question: >-
    How does thiol-based redox regulation of IMDH1 couple Met chain elongation to chloroplast
    redox/light status in vivo?
- question: >-
    Does the reported IIL1 (LeuC)-IMDH1 interaction form a channeling metabolon in the chloroplast
    stroma, and does it influence glucosinolate chain-length distribution?
suggested_experiments:
- description: >-
    Determine kcat/Km of IMDH1 with the full series of 3-(omega-methylthio)alkylmalates (C1-C6
    side chains) to test whether IMDH1 contributes to chain-length specificity.
  experiment_type: in vitro enzyme kinetics
- description: >-
    Identify the redox-sensitive cysteines of IMDH1 by mutagenesis and test thioredoxin-dependent
    activation in chloroplast extracts and in planta glucosinolate profiles.
  experiment_type: biochemistry/reverse genetics
- description: >-
    Solve a crystal structure of IMDH1 with a methylthioalkylmalate ligand to define how Phe-137
    accommodates the methylthioalkyl side chain.
  experiment_type: structural biology
