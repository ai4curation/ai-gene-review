- id: PMID:19493961
  title: >-
    Omics-based approaches to methionine side chain elongation in Arabidopsis: characterization
    of the genes encoding methylthioalkylmalate isomerase and methylthioalkylmalate dehydrogenase.
  findings:
  - statement: atimd1 knockouts have reduced Met-derived glucosinolates; gene named MAM-D1.
    supporting_text: >-
      In this study we found that knocking out either of the candidate genes, AtleuC1 or AtIMD1
      , reduced the level of Met-GSLs, indicating that both genes are actually involved in
      Met-GSL biosynthesis.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:19674406
  title: >-
    A redox-active isopropylmalate dehydrogenase functions in the biosynthesis of glucosinolates
    and leucine in Arabidopsis.
  findings:
  - statement: >-
      IMDH1 functions in both glucosinolate and leucine biosynthesis; mutant has reduced leucine
      and C4+ glucosinolates; stromal; redox regulated.
    supporting_text: >-
      We report a detailed functional characterization of an Arabidopsis isopropylmalate dehydrogenase
      (AtIPMDH1) that is involved in both glucosinolate biosynthesis and leucine biosynthesis.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache; primary characterization of IMDH1.
