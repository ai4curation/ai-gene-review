- id: PMID:20840499
  title: >-
    Functional characterization of Arabidopsis thaliana isopropylmalate dehydrogenases reveals
    their important roles in gametophyte development.
  findings:
  - statement: >-
      IPMDH2/3 have higher 3-IPM activity than IPMDH1 and are the principal Leu-pathway IPMDHs,
      essential for gametophyte development.
    supporting_text: >-
      IPMDH2 and IPMDH3 proteins exhibited significantly higher activity toward 3-IPM than
      IPMDH1, which is indicative of a pivotal role in leucine biosynthesis.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only; mainly about IPMDH2/3; IMDH1-specific data (transmission, triple mutant)
      not visible in cache.
- id: PMID:21697089
  title: >-
    Structural and functional evolution of isopropylmalate dehydrogenases in the leucine and
    glucosinolate pathways of Arabidopsis thaliana.
  findings:
  - statement: >-
      IMDH1 is ~500-fold more efficient with the glucosinolate substrate than IMDH2/3; Phe-137
      determines specificity in vitro and in vivo.
    supporting_text: >-
      AtIPMDH1 accepts both substrates with comparable k cat / K m values, but was ∼500-fold
      more efficient with the glucosinolate substrate than the other two isoforms.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; key kinetic/structure-function evidence.
