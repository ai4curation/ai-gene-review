id: Q9SYH4
gene_symbol: NFYA5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: NFYA5 (At1g54160) is one of ten Arabidopsis NF-YA (HAP2/CBF-B) subunits
  of the heterotrimeric Nuclear Factor Y transcription factor. Through its subunit-association
  domain it docks onto the NF-YB/NF-YC histone-fold dimer, and its conserved NFYA/HAP2
  segment recognizes the CCAAT box, so it provides CCAAT sequence specificity to the
  nuclear NF-Y trimer but does not bind DNA alone. NFYA5 is the best-characterized
  drought-responsive NF-YA. Its transcript is induced by drought and ABA, partly transcriptionally
  and partly through drought-repression of miR169, which targets the NFYA5 mRNA; a
  cis-natural antisense gene, NERF, also raises NFYA5 transcript levels. NFYA5 is expressed
  in vascular tissue and guard cells. Knockout plants lose more leaf water and are
  drought sensitive, overexpressors are drought resistant, and NFYA5 is needed for
  expression of a set of drought-responsive genes. NFYA5 has also been placed in an
  NF-Y complex with NF-YB9 acting downstream of GCR1, GPA1 and PRN1 in blue-light and
  ABA control of LHCB expression. Overexpression, together with the paralogs NF-YA1,
  6 and 9, perturbs gametogenesis, embryogenesis and seed development and can induce
  somatic embryos; single mutants show no developmental phenotype, consistent with
  redundancy.
