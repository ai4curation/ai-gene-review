  review:
    summary: nfya5 knockouts lose more leaf water and are drought sensitive; NFYA5 overexpressors
      are drought resistant; NFYA5 is induced by drought and needed for drought-gene expression.
    action: ACCEPT
    reason: This is the best-established physiological role of NFYA5, supported by loss-
      and gain-of-function phenotypes in opposite directions, drought/ABA induction of
