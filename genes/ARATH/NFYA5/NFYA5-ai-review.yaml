suggested_questions:
- question: Which NF-YB/NF-YC partners does NFYA5 assemble with in guard cells and vascular
    tissue under drought, and is the NF-YB9-containing trimer proposed for blue-light
    signalling the same complex?
- question: Should NF-YA family members carry contributes_to rather than enables for DNA-binding
    transcription factor activity, given that NF-YA binds DNA only within the NF-Y trimer?
- question: Are the drought-responsive genes that require NFYA5 direct CCAAT-box targets
    of an NFYA5-containing trimer, or indirect targets?
suggested_experiments:
- description: ChIP-seq of tagged NFYA5 expressed from its native, miR169-resistant
    promoter construct under drought, combined with RNA-seq of nfya5, to distinguish
    direct CCAAT-box targets from indirect drought-responsive genes.
  experiment_type: ChIP-seq / RNA-seq
- description: Guard-cell-specific complementation of nfya5 and stomatal aperture assays
    to test whether the drought phenotype reflects a guard-cell-autonomous role.
  experiment_type: genetic complementation / physiology
