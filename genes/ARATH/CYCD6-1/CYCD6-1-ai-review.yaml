  title: A bistable circuit involving SCARECROW-RETINOBLASTOMA integrates cues to inform asymmetric stem
    cell division.
  findings:
  - statement: CYCD6;1-CDKB1 complexes phosphorylate RBR.
    supporting_text: Based on our genetic and biochemical data, RBR phosphorylation is carried out by
      a complex of CYCD6;1 with either CDKB1;1 or CDKB1;2
  - statement: CYCD6;1 binding increases CDKB1 activity.
    supporting_text: revealed that CYCD6;1 binding increased basal activity of CDKB1
  - statement: CYCD6;1-YFP is nuclear in some endodermal cells, cytoplasmic in others.
    supporting_text: fluorescence was detected in the nucleus of some endodermis cells and in the cytoplasm
      of others
  - statement: Auxin induction of CYCD6;1 requires SHR and SCR.
    supporting_text: We concluded that auxin-mediated induction of the CYCD6;1 promoter requires SHR and
      SCR activity
  - statement: Nested feed-forward loops with SCR-RBR position the asymmetric divisions.
    supporting_text: We demonstrate that this interaction, together with the activity of the RBR regulator
      CYCD6;1, defines the precise position of ACDs in the stem cell area through two nested feedforward
      loops
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cell 2012; full text cached.
