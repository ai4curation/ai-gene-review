suggested_questions:
- question: Which RBR phosphosites does CYCD6;1-CDKB1 target, and is relief of RBR-SCR binding sufficient
    to explain the feed-forward positioning of the formative division?
- question: Which other D-type cyclins provide the redundancy implied by the milder cycd6;1 phenotype
    compared with shr?
suggested_experiments:
- description: Compare formative divisions in cycd6;1 combined with other CYCD mutants, and express a
    CDKB1-binding-deficient CYCD6;1 in the CEI to test whether kinase activation is required.
