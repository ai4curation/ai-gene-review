gene_symbol: CYCD6-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'CYCLIN D6;1 (CYCD6;1, At4g03270) is a D-type cyclin of Arabidopsis that acts as the regulatory
  subunit of cyclin-dependent kinases in a small set of formative (asymmetric, periclinal) cell divisions.
  CYCD6;1 is a direct transcriptional target of the SHORT-ROOT (SHR)-SCARECROW (SCR) complex: its promoter
  is bound by SHR and SCR and is switched on in the cortex/endodermis initial (CEI) and its daughter at
  the onset of the division that separates the endodermis and cortex layers, and later in a subset of
  endodermal cells that form middle cortex and in lateral root primordia. Expression is enhanced by auxin
  in a SHR/SCR-dependent manner, restricted by RETINOBLASTOMA-RELATED (RBR) and repressed by NAC1-TOPLESS.
  CYCD6;1 binds and stimulates B-type CDKs (CDKB1;1/CDKB1;2), and the CYCD6;1-CDKB1 kinase phosphorylates
  RBR, relieving RBR inhibition of SCR and so forming a feed-forward loop that positions the asymmetric
  division. The protein is found in the nucleus and cytoplasm and is turned over by the proteasome. cycd6;1
  mutants show fewer CEI-daughter periclinal divisions and reduced middle-cortex formation without general
  proliferation defects, and ectopic CYCD6;1 partially restores formative divisions in shr.'
