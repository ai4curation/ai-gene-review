- id: PMID:20596025
  title: Spatiotemporal regulation of cell-cycle genes by SHORTROOT links patterning and growth.
  findings:
  - statement: SHR and SCR directly activate CYCD6;1 at the formative division.
    supporting_text: Coincident with the onset of a specific formative division, SHR and SCR directly
      activate a D-type cyclin
  - statement: SHR and SCR bind the CYCD6;1 promoter (ChIP-qPCR).
    supporting_text: We found significant enrichment for both SHR and SCR binding around 1 kilo-base (kb)
      upstream of the CYCD6;1 promoter
  - statement: cycd6;1 mutants have fewer CEI-daughter periclinal divisions.
    supporting_text: cycd6;1 CEI-daughter cells showed significantly fewer periclinal divisions than wild
      type at both early heart and torpedo embryo stages
  - statement: CYCD6;1 is specific to formative, not proliferative, divisions.
    supporting_text: These results indicate that CYCD6;1 is not required for proliferative cell divisions
      but is specifically involved in formative divisions needed for proper ground tissue patterning
  - statement: Ectopic CYCD6;1 partially rescues shr formative divisions.
    supporting_text: Both CYCD6;1 and CDKB2;1 were able to partially complement the shr formative division
      phenotype
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Nature 2010; full text cached.
