  review:
    summary: TAP co-purification with the CDK inhibitor KRP7 (AT1G49620).
    action: REMOVE
    reason: Removed under the bare protein-binding policy, because the term carries no functional information.
      The interaction is not in doubt; ICK/KRP inhibitors can bind D-type cyclins directly through their
      C-terminal domain. TAP-MS resolves complex membership rather than binary contacts, so the row records
      co-membership of a CDK-cyclin-KRP complex. That membership is captured by the CDK holoenzyme complex
      annotation, and the inhibitory relationship belongs on the KRP (cyclin-dependent protein kinase
      inhibitor activity), not as protein binding on the cyclin.
    supported_by:
    - reference_id: PMID:20706207
      supporting_text: bait–prey interactions discovered by TAP that were negative in this split-LUC
        assay might represent indirect interactions
