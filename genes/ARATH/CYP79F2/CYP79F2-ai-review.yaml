core_functions:
- description: >-
    CYP79F2 is an ER-membrane cytochrome P450 homomethionine N-monooxygenase specific for
    long-chain methionine homologues (penta- and hexahomomethionine), converting them to
    the corresponding omega-(methylthio)alkanaldoximes as the entry step of long-chain
    aliphatic glucosinolate core structure biosynthesis, mainly in hypocotyl and roots.
