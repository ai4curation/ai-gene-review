  title: UniProtKB entry Q9FUY7 (CYP79F2, Hexahomomethionine N-hydroxylase)
  findings:
  - statement: EC 1.14.14.42 reactions for penta- and hexahomomethionine with reduced [NADPH--hemoprotein
