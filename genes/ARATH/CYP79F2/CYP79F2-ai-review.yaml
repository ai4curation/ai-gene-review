- id: PMID:11226190
  title: Bus, a bushy Arabidopsis CYP79F1 knockout mutant with abolished synthesis of short-chain aliphatic
    glucosinolates.
  findings:
  - statement: Identifies CYP79F2 as the tandem neighbour of CYP79F1 and shows that the N-terminal 62
      residues of each target GFP to the ER; CYP79F2 cannot compensate for loss of CYP79F1 in short-chain
      glucosinolate synthesis.
    supporting_text: Comparison of the fluorescence patterns between the controls and the fusion proteins
      revealed that the GFP fusions of CYP79F1 and CYP79F2 were both located in the ER
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; source of IDA ER localization for CYP79F2.
- id: PMID:12609033
  title: CYP79F1 and CYP79F2 have distinct functions in the biosynthesis of aliphatic glucosinolates in
    Arabidopsis.
  findings:
  - statement: Recombinant CYP79F2 (yeast) exclusively metabolizes penta- and hexahomomethionine; cyp79f2
      knockouts have reduced long-chain but unaffected short-chain aliphatic glucosinolates; CYP79F2 is
      highly expressed in hypocotyl and roots.
    supporting_text: CYP79F2 is highly expressed in hypocotyl and roots, whereas CYP79F1 is strongly expressed
      in cotyledons, rosette leaves, stems, and siliques.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source of IDA and IMP annotations; abstract only in cache.
- id: PMID:15194821
  title: Functional analysis of the tandem-duplicated P450 genes SPS/BUS/CYP79F1 and CYP79F2 in glucosinolate
    biosynthesis and plant development by Ds transposition-generated double mutants.
  findings:
  - statement: cyp79f2 Ds gene-trap mutants are affected mainly in the root system; the cyp79f1 cyp79f2
      double knockout completely lacks aliphatic glucosinolates.
    supporting_text: and find these mutants to be defective mainly in the root system, consistent with
      a root-specific expression pattern
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Retrieved via PubMed/PMC during this review; full text available.
- id: PMID:12529537
  title: Modulation of CYP79 genes and glucosinolate profiles in Arabidopsis by defense signaling pathways.
  findings:
  - statement: CYP79F1 and CYP79F2 are induced by methyl jasmonate.
    supporting_text: CYP79F1 and CYP79F2 , which are involved in biosynthesis of aliphatic glucosinolates,
      were induced by MeJA.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Regulation context; cited by UniProt for induction.
- id: PMID:40546745
  title: Impact of Lepidopteran Oral Secretions on the Transcriptome of Arabidopsis thaliana.
