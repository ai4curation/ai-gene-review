suggested_questions:
- question: Which residues restrict CYP79F2 to long-chain methionine homologues, and is
    the short-chain activity of CYP79F1 the derived or ancestral state in the Brassicaceae
    CYP79F duplication?
- question: Does the root-biased expression of CYP79F2 reflect a specific defensive role
    of long-chain aliphatic glucosinolates in roots?
suggested_experiments:
- hypothesis: Long-chain aliphatic glucosinolates made by CYP79F2 contribute to
    root defence against soil herbivores or pathogens.
  description: Compare root glucosinolate profiles and performance of root-feeding insects
    or root pathogens on cyp79f2 single, cyp79f1 single and double mutants.
  experiment_type: genetic and bioassay
- hypothesis: CYP79F2 substrate specificity is set by a small number of residues.
  description: Chimeras and point mutants between CYP79F1 and CYP79F2 assayed on mono- to
    hexahomomethionine in yeast microsomes.
  experiment_type: site-directed mutagenesis and enzyme kinetics
