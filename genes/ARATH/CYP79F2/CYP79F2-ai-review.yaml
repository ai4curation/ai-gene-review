id: Q9FUY7
gene_symbol: CYP79F2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: CYP79F2 (hexahomomethionine N-hydroxylase) is an endoplasmic reticulum membrane-anchored
  cytochrome P450 monooxygenase that catalyzes the aldoxime-forming entry step of core structure formation
  for long-chain methionine-derived (aliphatic) glucosinolates. Using O2 and electrons from NADPH-cytochrome
  P450 reductase it converts the long-chain methionine homologues penta- and hexahomomethionine to 8-methylthiooctanaldoxime
  and 9-methylthiononanaldoxime (EC 1.14.14.42). It arose by tandem duplication with CYP79F1 (about 89%
  amino-acid identity) but, unlike CYP79F1, does not accept short-chain homologues, so it cannot substitute
  for CYP79F1 in short-chain glucosinolate synthesis. CYP79F2 is expressed mainly in hypocotyl and root
  vasculature and is induced by methyl jasmonate. Loss of CYP79F2 substantially reduces long-chain aliphatic
  glucosinolates without affecting short-chain ones, and cyp79f1 cyp79f2 double mutants lack aliphatic
  glucosinolates entirely; the mild lateral-root phenotype of cyp79f2 mutants is regarded as a secondary
  consequence of the metabolic block.
