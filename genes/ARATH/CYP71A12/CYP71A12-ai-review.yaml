  evidence_type: IDA
  original_reference_id: PMID:33831160
  qualifier: located_in
  review:
    summary: TAIR IDA (2022) for ER lumen from PMID:33831160. This PMID could not be resolved
      (NCBI esummary "cannot get document summary"; Europe PMC zero hits), so the supporting
      evidence cannot be examined. The same IDA is present on paralog CYP71A13.
    action: UNDECIDED
    reason: The reference is not accessible (likely a deleted or remapped PMID), so per curation
      guidelines this experimental annotation cannot be adjudicated. Biologically, CYP71A12
      has an N-terminal single-pass anchor (aa 4-24) typical of microsomal plant P450s whose
      catalytic domain faces the cytosol, so endoplasmic reticulum membrane would be the expected
      compartment and a lumenal location is topologically unexpected. The canonical PMID should
      be identified before deciding whether to keep, or modify to endoplasmic reticulum membrane.
