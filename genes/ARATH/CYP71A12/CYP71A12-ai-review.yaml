core_functions:
- description: ER-anchored heme-thiolate P450 that oxidizes indole-3-acetaldoxime via an
    indole cyanohydrin (alpha-hydroxy-IAN) intermediate, feeding the inducible indole-3-carboxylic
    acid and cyanogenic 4-OH-ICN branches and, partially redundantly with CYP71A13, camalexin
    biosynthesis. The net IAOx-to-IAN conversion is captured by indoleacetaldoxime dehydratase
    activity; mechanistically it is an O2-dependent monooxygenation.
  molecular_function:
    id: GO:0047720
    label: indoleacetaldoxime dehydratase activity
  directly_involved_in:
  - id: GO:0010120
    label: camalexin biosynthetic process
  - id: GO:0106148
    label: 4-hydroxyindole-3- carbonyl nitrile biosynthesis
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:24151049
    supporting_text: Although CYP71A12 turned over IAOx at a rate comparable to that of CYP71A13,
      the final products IAL and Cys-IAN accumulated in different ratios with these two enzymes
  - reference_id: PMID:25953104
    supporting_text: CYP71A12 catalyzed two consecutive reactions, the dehydration of IAOx to IAN ,
      which is then further converted to ICHO and cyanide
  - reference_id: PMID:26352477
    supporting_text: A combination of yeast microsomal CYP71A12 and CYP82C2 and N. benthamiana-expressed
      FOX1 was sufficient to catalyze the conversion of IAOx to ICN
  - reference_id: PMID:25953104
    supporting_text: A major role of CYP71A12 was identified for the inducible biosynthesis
      of ICOOH .
  - reference_id: PMID:26352477
    supporting_text: Correlation analysis implicated CYP71A12, a P450 linked to camalexin biosynthesis18,
      as the most likely candidate gene for the cyanohydrin formation step (SI Table 3).
  - reference_id: PMID:20348432
    supporting_text: Indeed, a cyp71A12 insertion mutant was dramatically impaired for camalexin
      accumulation in the roots ( Figure 3 ).
- description: Production of inducible antifungal indolic metabolites (ICA derivatives, partly
    camalexin) contributing to post-invasion resistance to filamentous fungi. The same metabolites
    also restrict Pseudomonas syringae and leaf microbiota colonization (defense response to bacterium
    is retained as a non-core annotation).
  molecular_function:
    id: GO:0047720
    label: indoleacetaldoxime dehydratase activity
  directly_involved_in:
  - id: GO:0050832
    label: defense response to fungus
  supported_by:
  - reference_id: PMID:31411742
    supporting_text: We also show that both enzymes are key players in the resistance of Arabidopsis
      against selected filamentous pathogens after they invade.
  - reference_id: PMID:31411742
    supporting_text: Our results indicate that CYP71A12, but not CYP71A13, is the major enzyme
      responsible for the accumulation of ICA in Arabidopsis in response to pathogen ingression.
suggested_questions:
- question: Should TAIR revise the ER lumen (GO:0005788) IDA rows from Mucha et al. 2019 (cited under
    the deleted duplicate PMID:33831160) on CYP71A12, CYP71A13 and CYP71B15 to endoplasmic reticulum
    membrane, given that the evidence is colocalization with a lumenal marker and the paper itself
    describes these P450s as membrane-anchored and cytosol-facing?
- question: Should CYP71A12 and CYP71A13 be described by indoleacetaldoxime dehydratase activity
    (GO:0047720, IAOx = IAN + H2O; net conversion shown and called dehydration by Müller et al. 2015)
    or by a cyanohydrin-forming monooxygenase term, given that 18O2 labelling shows O2-derived oxygen
    in the products via an alpha-hydroxy-IAN intermediate (PMID:24151049)? The two independent reviews
    disagreed here; modules/camalexin_biosynthesis.yaml currently uses monooxygenase activity only.
- question: Should GO gain a specific term for indole-3-carboxylic acid biosynthesis, the in vivo
    process for which CYP71A12 is non-redundant, and should the definition of GO:0106148
    4-hydroxyindole-3-carbonyl nitrile biosynthesis be corrected (it calls 4-OH-ICN a cyanogenic
    glucoside; it is an aglycone alpha-ketonitrile) and its label spacing fixed?
- question: How much of the pathogen-induced ICOOH/ICA pool depends on CYP71A12 producing it directly
    (via indole-3-carbaldehyde), and how much comes from non-enzymatic hydrolysis of ICN?
- question: Is defense response to fungus appropriate for CYP71A12 on the strength of mutant phenotypes
    that are largely shown in a pen2 background (PMID:31411742, abstract-only here), or is that necessity
    evidence that should be left to the metabolite biosynthesis terms? The two independent reviews
    disagreed; the combined review follows the CYP71A13/CYP71B15 convention.
- question: Is the PAINT node carrying induced systemic resistance for CYP71A12/CYP71A13 justified,
    given that the only descendant evidence concerns a salicylic acid-dependent rhizobacterial
    response?
- question: Does epidermis-biased induction of CYP71A12 at fungal infection sites (versus vascular
    CYP71A13) translate into cell-type-specific ICA versus camalexin output?
suggested_experiments:
- experiment_type: subcellular localization
  hypothesis: CYP71A12 is anchored in the ER membrane with its catalytic domain facing the cytosol.
  description: Express CYP71A12-fluorescent protein fusions with ER membrane and lumen markers,
    and test catalytic-domain topology by protease protection of microsomes.
- experiment_type: cell-type-specific metabolite profiling
  hypothesis: Epidermal CYP71A12 induction at Colletotrichum higginsianum infection sites drives
    local ICA/4-OH-ICN accumulation, whereas vascular CYP71A13 supports camalexin.
  description: Use cell-type-specific promoters to complement cyp71a12 cyp71a13 double mutants
    and quantify ICA derivatives, 4-OH-ICN and camalexin, plus fungal resistance, after infection.
- experiment_type: enzyme kinetics and product trapping
  hypothesis: CYP71A12 forms indole-3-cyanohydrin by monooxygenation, and IAN arises from its dehydration
    rather than by a direct hydro-lyase reaction.
  description: Steady-state kinetics of purified, reconstituted CYP71A12 and CYP71A13 with IAOx under 16O2
    and 18O2, trapping the cyanohydrin and quantifying IAN, to give product partitioning and settle the
    dehydratase versus monooxygenase assignment.
proposed_new_terms:
- proposed_name: indole-3-acetaldoxime monooxygenase (indole-3-cyanohydrin-forming) activity
  proposed_definition: Catalysis of the NADPH-P450 reductase- and O2-dependent alpha-hydroxylation
    of (E)-indol-3-ylacetaldoxime to 2-hydroxy-2-(1H-indol-3-yl)acetonitrile (indole-3-cyanohydrin).
  justification: 18O2 labelling shows that CYP71A12 and CYP71A13 incorporate O2-derived oxygen via an
    alpha-hydroxy-IAN intermediate, so GO:0047720 (IAOx = IAN + H2O) describes the net conversion but
    not the chemistry. CYP71A12 releases mostly the cyanohydrin breakdown products indole-3-carbaldehyde
    and cyanide, and UniProt describes its function as conversion of IAOx to indole cyanohydrin.
  supported_by:
  - reference_id: PMID:24151049
    supporting_text: With 97% 18O2, both CYP71A13 and CYP71A12 catalyze incorporation of
      the isotopic label into IAL (74% and 81% 18O incorporation, respectively, Figure S10),
      providing clear evidence for an α-hydroxy-IAN intermediate.
  - reference_id: PMID:25953104
    supporting_text: for CYP71A12, indole-3-carbaldehyde and cyanide were identified as major reaction
      products.
