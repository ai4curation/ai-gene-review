- term:
    id: GO:0047720
    label: indoleacetaldoxime dehydratase activity
  evidence_type: IDA
  original_reference_id: PMID:25953104
  review:
    summary: Recombinant CYP71A12 (yeast microsomes) converts indole-3-acetaldoxime with a catalytic
      efficiency slightly higher than CYP71A13, the enzyme that carries this activity in GO (IDA,
      PMID:17573535); both paralogs release IAN, and CYP71A12 further converts the cyanohydrin/IAN to
      indole-3-carbaldehyde and cyanide.
    action: NEW
    reason: >-
      The core catalytic activity of CYP71A12 is absent from its GO annotations, which carry only generic
      P450 activities. Two primary full-text studies assayed CYP71A12 directly. Klein et al. 2013 report
      persistent production of the dehydration product IAN from IAOx by these enzymes and, by 18O2
      labelling, an O2-derived alpha-hydroxy-IAN (cyanohydrin) intermediate. Müller et al. 2015
      measured kinetics for both enzymes and conclude that both efficiently dehydrate IAOx, and that
      CYP71A12 catalyses dehydration of IAOx to IAN followed by conversion to indole-3-carbaldehyde and
      cyanide. The overall IAOx-to-IAN conversion is therefore demonstrated for CYP71A12, and the
      comparator CYP71A13 carries GO:0047720 by IDA and IEA. Caveat (from the independent review): the
      18O2 data show that the reaction is a monooxygenation via a cyanohydrin rather than a simple
      hydro-lyase reaction, so GO:0047720 describes the net conversion, not the mechanism; a more exact
      monooxygenase term is proposed in proposed_new_terms and the question is raised in
      suggested_questions. Monooxygenase activity is accepted alongside.
    supported_by:
    - reference_id: PMID:25953104
      supporting_text: For the reaction with IAOx , catalytic efficiency was approximately 0.066 µ m −1
        s −1 for CYP71A12 and approximately 0.029 µ m −1 s −1 for CYP71A13. Besides the limitations
        regarding comparisons between catalytic efficiencies of different enzymes ( Eisenthal et al.,
        2007 ), it is clear that both enzymes are efficiently dehydrating IAOx .
    - reference_id: PMID:25953104
      supporting_text: CYP71A12 catalyzed two consecutive reactions, the dehydration of IAOx to IAN ,
        which is then further converted to ICHO and cyanide
    - reference_id: PMID:24151049
      supporting_text: The persistent production of the dehydration product IAN alongside oxidized
        products from IAOx led us to examine whether IAN is an intermediate en route to camalexin or
        an off-pathway product.
    - reference_id: PMID:24151049
      supporting_text: Although CYP71A12 turned over IAOx at a rate comparable to that of CYP71A13,
        the final products IAL and Cys-IAN accumulated in different ratios with these two enzymes
- term:
    id: GO:0106148
    label: 4-hydroxyindole-3- carbonyl nitrile biosynthesis
  evidence_type: IMP
  original_reference_id: PMID:26352477
  review:
    summary: CYP71A12 catalyses the first oxidation (IAOx to indole-3-cyanohydrin) of the cyanogenic
      4-OH-ICN pathway, upstream of FOX1 and CYP82C2; cyp71A12 mutants have about 10% of wild-type ICN
      derivatives and the pathway is reconstituted with CYP71A12, FOX1 and CYP82C2.
    action: NEW
    reason: >-
      Participation test - CYP71A12 performs a step of this pathway (the cyanohydrin-forming oxidation),
      shown by in vitro reconstitution as well as by the mutant metabolite profile, so it does part of the
      work rather than being merely required. GO:0106148 was created from this same paper (definition xref
      PMID:26352477) but currently has no annotations at all, including the downstream enzymes CYP82C2
      (which carries only the GO:0106149 ICN 4-hydroxylase MF) and FOX1, so its absence on CYP71A12 reflects
      an unused new term rather than a curatorial convention. It is not an ancestor or descendant of
      camalexin biosynthetic process. This replaces the independent review's NEW GO:0042435
      indole-containing compound biosynthetic process, which was dropped because it is an ancestor of the
      already-accepted GO:0010120, and its proposed new term for ICN biosynthesis, which already exists as
      GO:0106148. Note that the GO definition calls 4-OH-ICN a cyanogenic glucoside, which it is not (see
      suggested_questions).
    supported_by:
    - reference_id: PMID:26352477
      supporting_text: all ICN derivatives with the exception of A6 are at ~10% of WT levels in the
        cyp71A12 mutant, but unaffected in the cyp71A13 and cyp71A18 mutants
    - reference_id: PMID:26352477
      supporting_text: A combination of yeast microsomal CYP71A12 and CYP82C2 and N. benthamiana-expressed
        FOX1 was sufficient to catalyze the conversion of IAOx to ICN
- term:
    id: GO:0050832
    label: defense response to fungus
  evidence_type: IMP
  original_reference_id: PMID:31411742
  review:
    summary: cyp71A12 mutant combinations (with pen2) show defects in post-invasion resistance
      to the filamentous fungi Plectosphaerella cucumerina and Colletotrichum tropicale, and
      CYP71A12 is the major enzyme for pathogen-induced ICA accumulation.
    action: NEW
    reason: >-
      CYP71A12 does part of the work of this defense response - it catalyses the IAOx oxidation step that
      produces the inducible antifungal indolics (ICA derivatives and, partly, camalexin) - so it passes the
      participation test in the sense GO applies to phytoalexin biosynthetic enzymes. Comparator check - the
      paralog CYP71A13 and the downstream camalexin P450 PAD3/CYP71B15 both carry defense response to fungus
      (IMP), and both are accepted as core in their reviews. Its paralog-specific role in ICA (not shared by
      CYP71A13) means the contribution is not redundant. The independent review declined this row as
      necessity-only evidence, and the CYP71A12-specific data are abstract-only (phenotypes largely in a
      pen2 background); the row is kept on the comparator convention but the disagreement is recorded in
      suggested_questions. Fungal-infection expression data (epidermal induction at Colletotrichum infection
      sites) are consistent but are not used as evidence.
    supported_by:
    - reference_id: PMID:31411742
      supporting_text: We also show that both enzymes are key players in the resistance of Arabidopsis
        against selected filamentous pathogens after they invade.
    - reference_id: PMID:31411742
      supporting_text: Our results indicate that CYP71A12, but not CYP71A13, is the major enzyme
        responsible for the accumulation of ICA in Arabidopsis in response to pathogen ingression.
