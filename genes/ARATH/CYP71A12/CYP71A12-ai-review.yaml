  review:
    summary: CYP71A12 catalyzes the IAOx-to-indole-cyanohydrin/IAN step of camalexin biosynthesis,
      partially redundant with CYP71A13 in leaves and a major contributor in roots.
    action: ACCEPT
    reason: Directly supported by multiple primary studies - in vitro reconstitution (CYP71A12
      can substitute for CYP71A13), the cyp71a12 cyp71a13 double mutant (only traces of camalexin),
      and the strong root camalexin defect of the cyp71A12 single mutant. CYP71A12 catalyses
      a step of the pathway, so involved_in is appropriate, though its quantitative role in
      leaf camalexin is minor relative to CYP71A13.
    supported_by:
    - reference_id: PMID:25953104
      supporting_text: Based on the comparison of cyp71a13 and cyp71a12 cyp71a13 phenotypes,
        the contribution of CYP71A12 to camalexin formation in leaves is significant but minor
        in relation to CYP71A13.
    - reference_id: PMID:20348432
      supporting_text: Indeed, a cyp71A12 insertion mutant was dramatically impaired for camalexin
        accumulation in the roots ( Figure 3 ).
    - reference_id: PMID:24151049
      supporting_text: Substituting CYP71A12 in place of CYP71A13 also resulted in camalexin
        production, albeit at lower levels (Figure S11).
