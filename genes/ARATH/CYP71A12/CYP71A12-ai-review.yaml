- term:
    id: GO:0047720
    label: indoleacetaldoxime dehydratase activity
  evidence_type: IDA
  original_reference_id: PMID:24151049
  review:
    summary: Recombinant CYP71A12 converts indole-3-acetaldoxime at a rate comparable to CYP71A13,
      the enzyme that carries this activity in GO (IDA, PMID:17573535), and can replace CYP71A13
      in a reconstituted camalexin pathway.
    action: NEW
    reason: The core catalytic activity of CYP71A12 (IAOx turnover to the IAN/indole cyanohydrin
      level) is absent from its GO annotations, which carry only generic P450 activities. Its
      paralog CYP71A13 carries GO:0047720 by IDA and by IEA. Caveat - CYP71A12 releases mainly
      indole-3-carbaldehyde plus cyanide from the cyanohydrin intermediate rather than stable
      IAN, so the GO reaction (IAOx = IAN + H2O) is the closest available description rather
      than an exact match.
    supported_by:
    - reference_id: PMID:24151049
      supporting_text: Although CYP71A12 turned over IAOx at a rate comparable to that of CYP71A13,
        the final products IAL and Cys-IAN accumulated in different ratios with these two enzymes
    - reference_id: PMID:25953104
      supporting_text: The CYP71A13 gene is located in tandem with its close homolog CYP71A12,
        also encoding an IAOx dehydratase.
    - reference_id: PMID:23830903
      supporting_text: This has provided biochemical evidence for CYP71A12 conducting same
        reaction as CYP71A13 in the pathway.
- term:
    id: GO:0050832
    label: defense response to fungus
  evidence_type: IMP
  original_reference_id: PMID:31411742
  review:
    summary: cyp71A12 mutant combinations (with pen2) show defects in post-invasion resistance
      to the filamentous fungi Plectosphaerella cucumerina and Colletotrichum tropicale, and
      CYP71A12 is the major enzyme for pathogen-induced ICA accumulation.
    action: NEW
    reason: CYP71A12 does part of the work of this defense response - it catalyses the IAOx
      oxidation step that produces the inducible antifungal indolics (ICA derivatives and,
      partly, camalexin) - so it passes the participation test rather than being merely required.
      Comparator check - the paralog CYP71A13 and the downstream camalexin P450 PAD3/CYP71B15
      both carry defense response to fungus, so the term is used for biosynthetic enzymes
      in this branch. Its paralog-specific role in ICA (not shared by CYP71A13) means the
      contribution is not redundant. Fungal-infection expression data (e.g. epidermal induction
      at Colletotrichum infection sites) are consistent but are not used as evidence.
    supported_by:
    - reference_id: PMID:31411742
      supporting_text: We also show that both enzymes are key players in the resistance of Arabidopsis
        against selected filamentous pathogens after they invade.
    - reference_id: PMID:31411742
      supporting_text: Our results indicate that CYP71A12, but not CYP71A13, is the major enzyme
        responsible for the accumulation of ICA in Arabidopsis in response to pathogen ingression.
