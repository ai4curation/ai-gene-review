id: O49340
gene_symbol: CYP71A12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  CYP71A12 (At2g30750) is a membrane-anchored heme-thiolate cytochrome P450 monooxygenase
  of the CYP71 clan that metabolizes the tryptophan-derived intermediate indole-3-acetaldoxime
  (IAOx). It is the tandem paralog of CYP71A13 (about 89% identity) and, like CYP71A13,
  oxidizes IAOx via an alpha-hydroxy-indole-3-acetonitrile (indole cyanohydrin) intermediate,
  but it partitions products differently, releasing mainly indole-3-carbaldehyde and cyanide
  rather than the cysteine-indole-3-acetonitrile adduct that is channelled to camalexin.
  In vivo CYP71A12 is the principal enzyme for pathogen- and stress-inducible indole-3-carboxylic
  acid derivatives and the first enzyme of the cyanogenic 4-hydroxyindole-3-carbonyl nitrile
  (4-OH-ICN) pathway, acting upstream of the flavin oxidase FOX1 and CYP82C2, whereas its contribution to camalexin is minor in leaves but substantial in
  flagellin-elicited roots; it associates with CYP71B15 (PAD3) and the other camalexin P450s
  in an ER-associated metabolon. The gene is strongly induced by pathogens, microbe-associated
  molecular patterns and leaf microbiota (a general non-self response gene); loss of
  CYP71A12 increases susceptibility to Pseudomonas syringae and, together with CYP71A13,
  alters leaf microbiota colonization. In fungus-infected leaves it is induced at infection
  sites mainly in epidermal cells, in contrast to the vasculature-restricted induction of
  CYP71A13.
