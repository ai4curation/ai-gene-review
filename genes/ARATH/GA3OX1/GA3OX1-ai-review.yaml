core_functions:
- description: Cytosolic 2-oxoglutarate/Fe(II)-dependent dioxygenase that 3beta-hydroxylates GA9 to bioactive
    GA4 (RHEA:68996; preferred substrate) and GA20 to GA1 (RHEA:10104), the final step of bioactive gibberellin
    formation; with GA3ox2 supplies bioactive GA during vegetative growth and is under DELLA-mediated
    negative feedback.
