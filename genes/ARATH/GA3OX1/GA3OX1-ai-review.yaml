id: Q39103
gene_symbol: GA3OX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GA3OX1 (GA4, AtGA3ox1; At1g15550) encodes a gibberellin 3beta-hydroxylase (GA 3-oxidase),
  a soluble 2-oxoglutarate- and Fe(II)-dependent dioxygenase that catalyses the final step of bioactive
  gibberellin biosynthesis, converting GA9 to GA4 (preferred substrate) and GA20 to GA1 by regiospecific
  3beta-hydroxylation. ga4 mutants are semi-dwarfs that accumulate GA9 and lack 3beta-hydroxylated GAs.
  With its paralog GA3ox2, GA3OX1 supplies bioactive GA during vegetative growth and seed germination,
  where both are expressed in the cortex and endodermis of the embryo axis. GA3OX1 transcription is strongly
  feedback-repressed by bioactive GA (a direct DELLA target; requires the AT-hook protein AGF1) and induced
  by red light in imbibed seeds via phytochrome-dependent removal of the repressor PIL5.
