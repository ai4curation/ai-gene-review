suggested_questions:
- question: Do the nuclear regulators detected as GA3ox1 interactors in high-throughput yeast two-hybrid
    screens (e.g. BRX, TCP23, IAA28) affect GA3ox1 localization or activity in planta, or are these interactions
    non-physiological?
suggested_experiments:
- description: Test selected Y2H partners by co-immunoprecipitation from native tissues and measure GA4
    formation in corresponding mutant backgrounds.
