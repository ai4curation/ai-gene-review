core_functions:
- description: >-
    PIF1 is a nuclear bHLH transcription factor that binds G-box cis-regulatory elements,
    as homodimers or heterodimers with other PIFs, to activate or repress target genes. Targets
    include the DELLA genes GAI and RGA, SOMNUS, PORC and many hormone-signaling regulators;
    through them PIF1 represses seed germination and chlorophyll biosynthesis in darkness.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
  - id: GO:0006355
    label: regulation of DNA-templated transcription
  - id: GO:0010187
    label: negative regulation of seed germination
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:19244139
    supporting_text: PIL5 regulates 166 genes by directly binding to their promoters
  - reference_id: PMID:17449805
    supporting_text: >-
      PIL5 binds directly to GAI and RGA promoters but not to GA and ABA metabolic gene promoters
  - reference_id: PMID:18591656
    supporting_text: >-
      PIF1 directly binds to a G-box (CACGTG) DNA sequence element present in the PORC promoter
- description: >-
    PIF1 binds the Pfr forms of phyA and phyB; this binding leads to light-induced phosphorylation,
    CUL4-COP1-SPA-dependent ubiquitination and rapid proteasomal degradation of PIF1. Removal
    of PIF1 relieves its repression of photomorphogenesis and germination in the red/far-red
    light signaling pathway. In darkness PIF1 also acts as a cofactor that enhances COP1 E3
    activity.
  molecular_function:
    id: GO:0010313
    label: phytochrome binding
  directly_involved_in:
  - id: GO:0010017
    label: red or far-red light signaling pathway
  - id: GO:0010100
    label: negative regulation of photomorphogenesis
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15448264
    supporting_text: >-
      PIF1 interacts specifically with the photoactivated conformer of phytochromes A and
      B
  - reference_id: PMID:18539749
    supporting_text: >-
      PIF1 is rapidly phosphorylated and ubiquitinated under red and far-red light before
      being degraded with a half-life of approximately 1 to 2 min under red light
  - reference_id: PMID:26037329
    supporting_text: >-
      The light-induced ubiquitylation and subsequent degradation of PIF1 is reduced in the
      cop1, spaQ and cul4 backgrounds
suggested_questions:
- question: >-
    Which kinase(s) perform the rapid light-induced PIF1 phosphorylation in vivo: phytochrome
    itself, SPA1, CK2 or PPKs? What is the relative contribution of each?
- question: >-
    How does PIF1 switch between activator (SOM, GAI/RGA, PORC) and repressor (GA3ox, photosynthesis
    genes) roles at different targets?
suggested_experiments:
- description: >-
    Map in vivo PIF1 phosphosites under red light in spaQ, ck2 and ppk mutant backgrounds
    by targeted phosphoproteomics, and test phospho-null/phospho-mimic PIF1 variants for degradation
    kinetics and germination phenotypes.
