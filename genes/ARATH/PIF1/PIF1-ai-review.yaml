description: >-
  PIF1 (PHYTOCHROME INTERACTING FACTOR 1; also PIL5, PIF3-LIKE 5, bHLH015; At2g20180) is a
  nuclear basic helix-loop-helix transcription factor of the Arabidopsis thaliana PIF family
  (bHLH subgroup 15). It forms homodimers and heterodimers with other PIFs and with HFR1,
  binds G-box (CACGTG) elements in target promoters, and can activate or repress transcription.
  PIF1 is the PIF with the highest affinity for phytochromes: it binds the photoactivated
  Pfr forms of phyA and phyB through APA and APB motifs. Light-activated phytochromes trigger
  rapid PIF1 phosphorylation (with contributions from CK2, phytochromes and SPA1), followed
  by ubiquitination by CUL4-COP1-SPA and proteasomal degradation; under red light the half-life
  is about 1-2 min. In darkness PIF1 represses photomorphogenesis together with COP1-SPA,
  whose E3 ligase activity it enhances. It also restrains chlorophyll biosynthesis (regulating
  PORC, FeChII, HO3 and HEMB1), which prevents protochlorophyllide over-accumulation and photobleaching.
  PIF1 is the principal repressor of phytochrome-mediated seed germination: in imbibed seeds
  it binds the promoters of the DELLA genes GAI and RGA and of SOMNUS, and it acts indirectly
  on gibberellin and abscisic acid metabolism genes. It also inhibits hypocotyl negative gravitropism
  in darkness.
