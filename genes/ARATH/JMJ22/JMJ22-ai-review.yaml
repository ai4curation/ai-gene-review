gene_symbol: JMJ22
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  JMJ22 (JUMONJI 22, At5g06550) is a nuclear Fe(II)/2-oxoglutarate-dependent JmjC-domain
  protein with an N-terminal F-box, belonging to the JMJD6/JMJD8-related PANTHER family
  PTHR12480 (subfamily SF21). It acts as a histone arginine demethylase that removes the
  repressive H4R3me2 mark. Its expression is repressed in darkness or far-red light by the
  zinc-finger protein SOMNUS and released when phytochrome B is activated by red light.
  Together with its paralog JMJ20, with which it is genetically redundant, JMJ22 then
  demethylates histone arginines at the gibberellin biosynthesis genes GA3ox1 and GA3ox2.
  This raises bioactive gibberellin levels and promotes light-induced seed germination.
  JMJ22 also has a role that JMJ20 does not share: loss-of-function alleles partially
  suppress the dwarf phenotype of the thermospermine-deficient acl5 mutant and stabilise
  mRNAs of the SAC51 family. The mechanism of that role is unknown. No DNA-binding domain
  is present, and the F-box has not been shown to work in an SCF ubiquitin ligase.
