  evidence_type: IPI
  original_reference_id: PMID:25533953
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G49720
  review:
    summary: >-
      This comes from a high-throughput yeast one-hybrid (Y1H) screen of secondary
      cell wall gene promoters against a library of transcription factor clones. JMJ22
      was recovered as binding the KOR1 (AT5G49720) promoter. JMJ22 is not discussed in
      the main text, and the interaction was not validated.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      JMJ22 has only an F-box and a JmjC/cupin demethylase domain, with no recognisable
      DNA-binding domain. Its characterised function is enzymatic, at chromatin
      (H4R3me2 removal at GA3ox1/GA3ox2). A single unvalidated Y1H hit from a screen
      that is prone to false positives is weak support for cis-regulatory DNA binding as
      an enabled molecular function. I do not REMOVE it, because the Y1H readout is real
      data, but it should not be read as evidence that JMJ22 is a transcription factor.
    supported_by:
