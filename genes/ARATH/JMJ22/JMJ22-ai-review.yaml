- term:
    id: GO:0032452
    label: histone demethylase activity
  evidence_type: IGI
  original_reference_id: PMID:22483719
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G63080
  review:
    summary: >-
      Cho et al. 2012 identify JMJ20/JMJ22 as histone arginine demethylases. UniProt
      curates H4R3me2-specific demethylation and the RHEA:58352 reaction
      (dimethyl-Arg to monomethyl-Arg) as experimental (ECO:0000269) from this paper.
    action: MODIFY
    reason: >-
      The activity is right, but the experimentally supported specificity is for
      histone H4 Arg3 (H4R3me2), so the more specific child term GO:0033749 histone
      H4R3 demethylase activity is warranted. The JmjC domain keeps the Fe(II)-binding
      triad (H324, D326, H407), consistent with catalytic competence. PAINT did not
      propagate this term from JMJ22 at PTN001753861, although it propagated nucleus
      and DNA binding from the same donor. I take that as a deliberate decision not to
      treat histone demethylase activity as an inherited SF21-wide function. It is
      established for JMJ22 itself.
    proposed_replacement_terms:
    - id: GO:0033749
      label: histone H4R3 demethylase activity
    supported_by:
    - reference_id: file:ARATH/JMJ22/JMJ22-uniprot.txt
      supporting_text: Histone demethylase that demethylates 'Arg-3' (H4R3me) of histone H4 with a specific activity for H4R3me2
