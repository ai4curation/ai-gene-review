- term:
    id: GO:0000987
    label: cis-regulatory region sequence-specific DNA binding
  evidence_type: IDA
  original_reference_id: PMID:22483719
  qualifier: enables
  review:
    summary: >-
      TAIR IDA from Cho et al. 2012. The cached record is abstract-only, and the
      abstract places JMJ22's action at the GA3ox1/GA3ox2 loci; the paper's MeSH terms
      list chromatin immunoprecipitation and EMSA. The assay behind this annotation
      could not be inspected.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Occupancy of the GA3ox1/GA3ox2 regulatory regions by JMJ22 is consistent with its
      role as a histone arginine demethylase acting there. However, the protein
      (F-box plus JmjC) has no sequence-specific DNA-binding domain, and the abstract
      says JMJ22 acts by removing histone methylation, not by recognising a DNA
      sequence. Most likely JMJ22 is recruited to these loci, so "sequence-specific DNA
      binding" over-states the molecular function. The full text was not readable, so
      I flag the row as an over-annotation rather than removing it.
    supported_by:
    - reference_id: PMID:22483719
      supporting_text: removal of repressive histone arginine methylations at GA3ox1/GA3ox2
