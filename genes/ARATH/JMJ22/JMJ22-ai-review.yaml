suggested_questions:
- question: >-
    How is JMJ22 recruited to GA3ox1/GA3ox2 chromatin, given that it lacks a DNA-binding
    domain? Is the TAIR "sequence-specific DNA binding" IDA based on ChIP occupancy
    rather than direct, sequence-specific binding?
  experts:
  - Plant chromatin biologists
  - TAIR curators
- question: >-
    Does the N-terminal F-box of JMJ22 assemble into an SCF E3 ligase (binding ASK/SKP1)?
    If so, does that function bear on its histone demethylase or thermospermine-related
    roles?
  experts:
  - Plant ubiquitin-proteasome researchers
- question: >-
    What is the molecular basis of the JMJ22-specific (not JMJ20/JMJ21) role in
    thermospermine signalling and SAC51-family mRNA stability? Is it histone
    demethylation, or a different JmjC hydroxylase/demethylase activity on RNA-associated
    proteins?
  experts:
  - Polyamine and vascular development researchers
- question: >-
    Is H4R3me2 demethylase activity conserved across the F-box-containing SF21 orthologs
    (for example in cereals), given that PAINT did not propagate the activity from JMJ22?
  experts:
  - PAINT/PANTHER curators
suggested_experiments:
- hypothesis: JMJ22 demethylates H4R3me2 directly and requires its Fe(II)-binding triad.
  description: >-
    Assay recombinant wild-type JMJ22 and an H324A/D326A mutant on H4R3me2 peptides and
    nucleosomes by mass spectrometry, and test whether the mutant fails to complement the
    jmj20 jmj22 germination defect.
  experiment_type: in vitro enzyme assay plus genetic complementation
- hypothesis: JMJ22 is recruited to GA3ox promoters through a partner protein rather than by binding DNA directly.
  description: >-
    Compare EMSA/DAP-seq of purified JMJ22 with ChIP-seq of tagged JMJ22, and identify
    chromatin partners by IP-MS.
  experiment_type: biochemistry and ChIP-seq
- hypothesis: The thermospermine-related phenotype of jmj22 reflects a catalytic activity of JMJ22.
  description: >-
    Test whether catalytically dead JMJ22 complements sac59/jmj22-2 suppression of acl5,
    and measure SAC51 mRNA stability and translation.
  experiment_type: genetic complementation
