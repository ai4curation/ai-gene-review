core_functions:
- description: >-
    Nuclear Fe(II)/2-oxoglutarate-dependent histone arginine demethylase that removes
    repressive H4R3me2 at the GA biosynthesis genes GA3ox1 and GA3ox2 after phyB
    activation. Acting redundantly with JMJ20, it raises gibberellin levels and promotes
    light-induced seed germination. The activity and the germination role are
    experimentally established in Arabidopsis (Cho et al. 2012).
  supported_by:
  - reference_id: PMID:22483719
    supporting_text: increased gibberellic acid levels through the removal of repressive histone arginine methylations at GA3ox1/GA3ox2
  - reference_id: file:ARATH/JMJ22/JMJ22-uniprot.txt
    supporting_text: Histone demethylase that demethylates 'Arg-3' (H4R3me) of histone H4 with a specific activity for H4R3me2
