gene_symbol: SYP121
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SYP121 (also PEN1, SYR1) is a plasma-membrane Qa-SNARE (syntaxin) of Arabidopsis thaliana,
  a C-terminally tail-anchored protein with an N-terminal Habc regulatory domain and a SNARE motif. It
  contributes the Qa helix to ternary SNARE complexes with the Qbc-SNARE SNAP33 and the vesicular R-SNAREs
  VAMP721/VAMP722, driving fusion of secretory vesicles with the plasma membrane; assembly is regulated
  by the SM protein SEC11/KEULE and coordinated with the exocyst (EXO70A1). Partly redundantly with its
  paralog SYP122, it supports constitutive secretion for growth and delivers membrane cargo such as PIP
  aquaporins (with SYP61) and KAT1 K+ channels. Upon attack by powdery mildew fungi it is recruited beneath
  appressoria and mediates the focal secretion that builds papillae and confers pre-invasive (penetration)
  resistance to non-adapted fungi such as Blumeria graminis f. sp. hordei. Independently of fusion, its
  N-terminal FxRF motif binds the K+ channel subunit KC1 (and KAT1), promoting AKT1/KC1 channel gating
  for K+ uptake and contributing to guard-cell K+ channel recycling and stomatal reopening.
