suggested_questions:
- question: What cargo is delivered by PEN1-dependent focal secretion at papillae (callose synthase PMR4,
    cell-wall material, antimicrobial compounds, extracellular vesicles), and is any of it uniquely PEN1-dependent
    rather than shared with the PEN3/PEN2 pathway?
- question: Is the negative regulation of SA/JA/cell-death pathways seen in syp121 syp122 double mutants
    a direct signalling function or an indirect consequence of impaired secretion/membrane homeostasis?
- question: Should the SYP121 K+ channel interaction be modelled as potassium channel regulator activity
    at the plasma membrane, and does the SEC11-K+ channel binding exchange link it causally to SNARE assembly
    in planta?
suggested_experiments:
- description: Proteomic profiling of PEN1-positive secretory vesicles/extracellular vesicles isolated
    from Bgh-challenged wild-type versus pen1 leaves to identify the defense cargo delivered by PEN1-dependent
    exocytosis.
- description: Express SNARE-motif or FxRF-motif SYP121 variants in syp121 syp122 backgrounds to separate
    fusion-dependent secretion, K+ channel gating and suppression of SA-dependent cell death.
