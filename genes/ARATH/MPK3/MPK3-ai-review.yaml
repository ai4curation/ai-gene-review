id: Q39023
gene_symbol: MPK3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: MPK3 (AtMPK3, At3g45640) is a TEY-motif, group A mitogen-activated protein kinase of the CMGC family
  and the closest paralog of MPK6, with which it is largely functionally redundant. It is activated by dual phosphorylation
  of its activation loop by the MAP kinase kinases MKK4 and MKK5 (and also MKK7/MKK9), downstream of MAPKKKs such
  as MAPKKK3/5, MEKK1 and YODA. Upon activation it phosphorylates proline-directed Ser/Thr-Pro motifs on substrates
  and moves from the cytoplasm into the nucleus. In pattern-triggered immunity MPK3 acts downstream of pattern recognition
  receptors including the flagellin receptor FLS2 and the chitin receptor CERK1 (via RLCKs such as PBL27); it phosphorylates
  the transcription factor WRKY33, which drives expression of camalexin biosynthetic genes, together with ERF6/ERF104,
  VQ-motif proteins, VIP1 and LIP5, and with MPK6 contributes to stabilization of the ethylene biosynthetic enzymes
  ACS2/ACS6 (direct phosphorylation of which is best documented for MPK6). The YODA-MKK4/MKK5-MPK3/MPK6 module restricts
  stomatal lineage entry by phosphorylating SPEECHLESS and is recruited to the cell cortex by BASL; the same module
  downstream of ERECTA shapes inflorescence architecture, and MPK3/MPK6 are needed for ovule integument development,
  pollen tube funicular guidance and stigma receptivity. MPK3 is also activated by abiotic stresses (H2O2/ozone,
  osmotic stress, cold, UV-B) and phosphorylates ICE1 to reduce freezing tolerance. MPK3 activity is turned off
  by MAPK phosphatases such as MKP1 and MKP2.
