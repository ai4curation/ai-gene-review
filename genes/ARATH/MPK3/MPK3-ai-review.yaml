suggested_questions:
- question: Is MPK3 itself a direct kinase of ACS2/ACS6 in vivo, or is its contribution to pathogen-induced ethylene
    mainly via MPK6 and WRKY33-driven ACS transcription?
- question: Should MPK3 carry a regulation of stomatal complex development term (YDA-MKK4/5-MPK3/6 phosphorylation
    of SPEECHLESS), as is it lacks any stomatal development annotation despite strong genetic and biochemical evidence
    (PMID:17259259)?
- question: Which outputs are non-redundant between MPK3 and MPK6 (e.g. distinct SCRM-binding properties, VIP1,
    AZI1), and should these be reflected in gene-specific annotations?
suggested_experiments:
- description: Analog-sensitive MPK3 (in mpk6 background) with phosphoproteomics after chitin treatment to define
    MPK3-specific direct substrates downstream of CERK1.
