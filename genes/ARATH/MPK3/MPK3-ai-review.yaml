- term:
    id: GO:0002221
    label: pattern recognition receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:11875555
  review:
    summary: MPK3 (with MPK6) is the terminal kinase of the PRR-triggered MAPK cascade downstream of FLS2 and of
      the CERK1-PBL27 chitin receptor complex; it phosphorylates WRKY33, ERF6/ERF104 and other substrates to execute
      pattern-triggered immunity outputs.
    action: NEW
    reason: 'Participation test: MPK3 catalyses a phosphorylation step within the PRR signalling pathway itself,
      so it does part of the work of the pathway (unlike a substrate or an output enzyme). Comparator: the RLCK
      BIK1, which transduces PRR signals in the same pathway, carries GO:0002221 (IMP, IBA); the MPK3 GOA set otherwise
      has no immune signalling term at all, only expression-based response terms. Proposed in place of broad defense
      response terms.'
    additional_reference_ids:
    - PMID:24750441
    - PMID:21498677
    supported_by:
    - *id014
    - *id015
    - &id016
      reference_id: PMID:21498677
      supporting_text: Using a phospho-protein mobility shift assay, we demonstrate that WRKY33 is phosphorylated
        by MPK3/MPK6 in vivo in response to Botrytis cinerea infection.
