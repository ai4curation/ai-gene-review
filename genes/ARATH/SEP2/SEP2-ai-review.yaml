suggested_questions:
- question: Which floral MADS tetramers incorporate SEP2 rather than SEP3 in vivo, and do any target genes
    depend specifically on SEP2-containing complexes?
suggested_experiments:
- experiment_type: paralog-specific ChIP-seq and complex proteomics
  hypothesis: SEP2 occupies a subset of SEP3 target sites and forms distinct tetramers.
  description: Profile native-promoter tagged SEP2 by ChIP-seq and IP-MS in staged inflorescences, and
    compare its occupancy and partners with SEP3 to test for sub-functionalization within the redundant
    SEP subfamily.
