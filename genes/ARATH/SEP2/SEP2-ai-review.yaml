status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'SEPALLATA2 (SEP2; AGL4; At3g02310; UniProt P29384) is a MIKC-type MADS-box transcription
  factor of the E-class (SEPALLATA) subfamily, closely related to SEP1. Its MADS domain binds CArG-box
  regulatory DNA, and its K-box mediates heterodimerization and higher-order complex formation with other
  floral MADS proteins, including AG (originally isolated as an AG K-domain interactor) and ABS/TT16.
  SEP2 is expressed in floral meristems and organ primordia. Its function is masked by redundancy: sep2
  single mutants are near wild type, but sep1 sep2 sep3 triple mutants convert petals, stamens and carpels
  into sepals. SEP2 therefore acts as an E-class partner that lets B- and C-class proteins specify organ
  identity within floral quartet MADS complexes, and SEP dosage also contributes to ovule identity.'
