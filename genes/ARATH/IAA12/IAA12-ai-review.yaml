id: Q38830
gene_symbol: IAA12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: IAA12 (BODENLOS, BDL; At1g04550) is an Aux/IAA transcriptional repressor of
  auxin-responsive gene expression. It is a short-lived nuclear protein with an N-terminal domain I
  carrying an EAR (LxLxL) motif that recruits the TOPLESS co-repressor, a domain II degron that
  binds the TIR1/AFB auxin receptors in an auxin-dependent manner, and a C-terminal PB1 domain
  (domains III/IV) through which it heterodimerizes with AUXIN RESPONSE FACTOR proteins, principally
  the activator ARF5/MONOPTEROS. At low auxin, IAA12 binds MP and recruits TPL to repress MP target
  genes; auxin promotes IAA12 binding to SCF(TIR1/AFB), ubiquitination and proteasomal degradation,
  relieving this repressive input to MP-dependent transcription. The bdl gain-of-function mutation
  in domain II stabilizes IAA12 and blocks MP-dependent specification of the hypophysis and
  embryonic root meristem, and causes apical-basal patterning and vascular defects; these are
  suppressed by tpl-1.
