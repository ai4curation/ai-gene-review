- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: ISS
  original_reference_id: PMID:11118137
  qualifier: enables
  review:
    action: MODIFY
    summary: Refine the historical transcription-factor classification to corepressor activity.
    reason: PMID:11118137 is a genome-wide regulator classification, not a IAA12-specific
      DNA-binding/transactivation assay. The specific functional evidence supports repression
      through ARF association. Refine to transcription corepressor activity. The separately retained
      promoter-association term does not by itself establish an autonomous DNA-binding
      transcription-factor activity.
    supported_by:
    - reference_id: PMID:18258861
      supporting_text: TPL can repress transcription in vivo and is required for IAA12/BDL
        repressive activity
    proposed_replacement_terms:
    - id: GO:0003714
      label: transcription corepressor activity
