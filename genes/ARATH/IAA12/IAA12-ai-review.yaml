    summary: >-
      NEW annotation. IAA12/BDL is an Aux/IAA co-receptor/substrate of the TIR1/AFB auxin
      receptors: all TIR1/AFB proteins bind BDL, BDL is stabilized when the receptors are
      lost, and stabilized bdl blocks MP-dependent auxin responses. IAA12 does part of the
      work of the pathway (its degron completes the auxin-binding co-receptor and its degradation
      is the signalling step), so this is participation rather than mere requirement.
