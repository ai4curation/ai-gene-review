- term:
    id: GO:0009734
    label: auxin-activated signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:15992545
  review:
    summary: 'NEW annotation. IAA12/BDL is an Aux/IAA co-receptor/substrate of the TIR1/AFB auxin receptors:
      all TIR1/AFB proteins bind BDL, BDL is stabilized when the receptors are lost, and stabilized bdl
      blocks MP-dependent auxin responses. IAA12 does part of the work of the pathway (its degron completes
      the auxin-binding co-receptor and its degradation is the signalling step), so this is participation
      rather than mere requirement.'
    action: NEW
    reason: Aux/IAA proteins are integral components of the nuclear auxin signalling pathway; the
      existing GOA set lacks this process for IAA12. This is an inherited NEW proposal, preserved
      from the baseline rather than added in this audit. IAA12 performs the repressive signaling
      step and binds the substrate-recognition receptor; being degraded does not itself justify a
      protein-catabolic-process annotation.
    supported_by:
    - reference_id: PMID:15992545
      supporting_text: all TIR1/AFB proteins interact with BDL, and BDL is stabilized in triple
        mutant plants
    - reference_id: PMID:22466420
      supporting_text: IAA12 interacted specifically with TIR1 and AFB2 at 100 μM IAA
    - reference_id: PMID:22466420
      supporting_text: TIR1 and the Aux/IAA are both necessary and sufficient for auxin binding and
        act as auxin co-receptors
