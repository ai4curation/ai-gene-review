core_functions:
- description: Auxin-labile transcriptional co-repressor of ARF5/MONOPTEROS. IAA12 binds MP via PB1
    heterodimerization and recruits TOPLESS through its EAR motif, repressing MP target genes until
    auxin-triggered SCF(TIR1/AFB)-mediated degradation.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0009734
    label: auxin-activated signaling pathway
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:18258861
    supporting_text: We show that TOPLESS (TPL) can physically interact with IAA12/BODENLOS
      (IAA12/BDL)
  - reference_id: PMID:18258861
    supporting_text: is required for IAA12/BDL repressive activity
  - reference_id: PMID:12101120
    supporting_text: suggesting that BODENLOS inhibits MONOPTEROS action in root meristem initiation
  - reference_id: PMID:15889151
    supporting_text: stabilization of BDL/IAA12 or its sister protein IAA13 prevents
      MP/ARF5-dependent embryonic root formation
  - reference_id: PMID:14742873
    supporting_text: Results reported here indicate that domain I in Aux/IAA proteins is an active
      repression domain that is transferable and dominant over activation domains
- description: Binding of the DNA-binding transcription factor ARF5/MONOPTEROS (and other ARFs)
    through the PB1 domain, the interaction that brings IAA12 to ARF-occupied auxin-responsive
    promoters.
  molecular_function:
    id: GO:0140297
    label: DNA-binding transcription factor binding
  directly_involved_in:
  - id: GO:0009734
    label: auxin-activated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12101120
    supporting_text: BODENLOS and MONOPTEROS interact in the yeast two-hybrid assay
  - reference_id: PMID:16459305
    supporting_text: This event critically requires the antagonistic auxin response regulators
      MONOPTEROS and BODENLOS
- description: Auxin-dependent binding of the IAA12 domain II degron to the SCF(TIR1/AFB) receptor
    F-box proteins, which makes IAA12 part of the auxin co-receptor and targets it for
    ubiquitination and proteasomal degradation; the bdl mutation in this degron stabilizes the
    protein.
  molecular_function:
    id: GO:0031625
    label: ubiquitin protein ligase binding
  directly_involved_in:
  - id: GO:0009734
    label: auxin-activated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15992545
    supporting_text: all TIR1/AFB proteins interact with BDL, and BDL is stabilized in triple mutant
      plants
  - reference_id: PMID:22466420
    supporting_text: IAA12 interacted specifically with TIR1 and AFB2 at 100 μM IAA
  - reference_id: PMID:12101120
    supporting_text: the bodenlos phenotype results from an amino-acid exchange in the conserved
      degradation domain of IAA12
suggested_questions:
- question: Should Aux/IAA proteins carry contributes_to auxin receptor activity / auxin binding,
    given that the TIR1/AFB-Aux/IAA pair forms the high-affinity auxin co-receptor (Calderon
    Villalobos et al. 2012)?
- question: What determines the preference of BDL/IAA12 for MP/ARF5 over other activator ARFs in the
    embryo, and how much is due to co-expression versus PB1 affinity?
- question: Does Aux/IAA regulatory-DNA association observed in yeast one-hybrid assays involve
    direct sequence-specific DNA contacts or an unidentified bridging component in that assay, and
    what is its native significance?
suggested_experiments:
- description: Measure IAA12 degron affinity for each TIR1/AFB receptor in purified co-receptor
    assays across auxin concentrations.
  hypothesis: IAA12 is a relatively low-affinity co-receptor substrate, requiring high auxin levels
    for degradation, which shapes MP activity in the embryo.
