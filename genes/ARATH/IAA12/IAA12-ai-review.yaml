  - AGI_LocusCode:AT5G43700
  - AGI_LocusCode:AT5G65670
  - PANTHER:PTN001272225
  review:
    summary: >-
      Phylogenetic propagation of transcription cis-regulatory region binding across the Aux/IAA
      clade (PTN001272225), seeded largely from yeast one-hybrid promoter-binding data for
      Aux/IAA family members.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Aux/IAA proteins lack a DNA-binding domain; the βαα fold once proposed for domain III
      is now known to be a PB1 protein-protein interaction domain. Aux/IAAs reach auxin-responsive
      promoters indirectly by heterodimerizing with DNA-bound ARFs. Yeast one-hybrid positives
      for Aux/IAAs most plausibly reflect such indirect recruitment, so direct cis-regulatory
      region binding over-states the evidence. The family-level function is transcription
      corepressor activity.
    supported_by:
    - &id001
      reference_id: PMID:11752389
      supporting_text: >-
        These results suggested that Aux/IAA proteins function as active repressors by dimerizing
        with auxin response factors bound to auxin response elements
    - &id002
      reference_id: PMID:14742873
      supporting_text: >-
        Results reported here indicate that domain I in Aux/IAA proteins is an active repression
        domain that is transferable and dominant over activation domains
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001272225
        source_label: PTN001272225
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The Aux/IAA node is supported by yeast one-hybrid promoter hits for Aux/IAA members;
          Aux/IAAs have no DNA-binding domain and are recruited to promoters indirectly through
          ARF heterodimerization, so direct cis-regulatory region binding conflates indirect
          promoter association with DNA binding.
- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: IPI
  original_reference_id: PMID:25533953
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G12870
  review:
    summary: >-
      Yeast one-hybrid detection of IAA12 at the MYB46 promoter in a large protein-DNA network
      for secondary cell wall genes.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      IAA12 has no DNA-binding domain; association with promoters is expected to occur indirectly
      via ARF heterodimerization. A single yeast one-hybrid hit in a network screen does not
      establish direct cis-regulatory region binding by IAA12 and has no in planta follow-up
      for IAA12.
    supported_by:
    - reference_id: PMID:25533953
      supporting_text: >-
        Here we present a protein-DNA network between Arabidopsis thaliana transcription factors
        and secondary cell wall metabolic genes
- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: ISS
  original_reference_id: PMID:11118137
  qualifier: enables
  review:
    summary: >-
      DNA-binding transcription factor activity transferred in a genome-wide transcription
      factor catalogue that included the Aux/IAA family.
    action: MODIFY
    reason: >-
      Aux/IAAs regulate transcription but do not bind DNA themselves; they repress ARF transcription
      factors via PB1-mediated heterodimerization and recruit TOPLESS through the domain I
      EAR motif. The appropriate MF is transcription corepressor activity.
    proposed_replacement_terms:
    - id: GO:0003714
      label: transcription corepressor activity
    supported_by:
    - *id001
    - *id002
