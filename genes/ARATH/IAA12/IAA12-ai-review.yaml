- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21734647
  qualifier: enables
  supporting_entities:
  - UniProtKB:O24407
  review:
    summary: >-
      IAA12 heterotypic interaction with the Aux/IAA protein IAA16 reported by systematic
      yeast two-hybrid Aux/IAA-ARF interactome (Vernoux et al. 2011). Aux/IAA proteins homo-
      and hetero-oligomerize through their PB1 domains (domains III/IV).
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative; the PB1-mediated Aux/IAA-Aux/IAA association
      is better described as protein heterodimerization activity. Its physiological significance
      is less clear than Aux/IAA-ARF binding, so it is not considered a core function.
    proposed_replacement_terms:
    - id: GO:0046982
      label: protein heterodimerization activity
    supported_by:
    - reference_id: PMID:21734647
      supporting_text: >-
        In this network, the vast majority of the Aux/IAAs interact with all the ARF activators,
        suggesting that most Aux/IAAs have the potential to act as repressors of the transcriptional
        activity of ARF activators
    - reference_id: PMID:11283339
      supporting_text: proteins that are capable of homodimerizing and heterodimerizing
