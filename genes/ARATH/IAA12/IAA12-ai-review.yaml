  - UniProtKB:P93024
  review:
    summary: >-
      IAA12/BDL interaction with ARF5/MONOPTEROS in yeast two-hybrid assays; the two proteins
      are co-expressed in the early embryo, and BDL inhibits MP-dependent root meristem initiation.
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative. Binding of an Aux/IAA repressor to a DNA-binding
