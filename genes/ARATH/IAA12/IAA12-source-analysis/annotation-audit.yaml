  action: MODIFY
  reason: PMID:11118137 is a genome-wide regulator classification, not a IAA12-specific 
    DNA-binding/transactivation assay. The specific functional evidence supports repression through 
    ARF association. Refine to transcription corepressor activity. The separately retained 
    promoter-association term does not by itself establish an autonomous DNA-binding 
