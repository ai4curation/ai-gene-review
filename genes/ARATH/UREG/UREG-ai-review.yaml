- term:
    id: GO:0016151
    label: nickel cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004400
  review:
    summary: InterPro2GO mapping from the UreG family signature.
    action: ACCEPT
    reason: Nickel binding is central to UREG function. Arabidopsis UREG becomes
      activation-competent only after contact with nickel in vivo and then transfers
      nickel to urease; its conserved N-terminal HXH motifs are required for activation;
      soybean UreG (Eu3) binds Ni2+; and UreGs generally bind at least one nickel per
      monomer. (Recombinant soybean UreG bound zinc more tightly than nickel, so metal
      selectivity in vitro remains unresolved.) Core function.
    supported_by:
    - reference_id: PMID:28710280
      supporting_text: These data demonstrate that extract components were not required
        but that activation competence lay within the UreG protein itself after coming
        into contact with nickel in vivo .
    - reference_id: PMID:28710280
      supporting_text: UreGs from different sources bind at least one nickel ion per monomer
        ( 35 , 36 , 19 , 31 ) consistent with the idea that a UreG dimer would be capable
        of delivering the two Ni 2+ ions required in each active center of urease.
    - reference_id: PMID:10652150
      supporting_text: p32 is identical to UreG by the criteria of size, antigenicity,
        and its ability to bind Ni2+, a trait expected from the deduced histidine-rich
        N-terminus of UreG.
