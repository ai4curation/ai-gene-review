id: O64700
gene_symbol: UREG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  UREG (At2g34470) is the Arabidopsis ortholog of the bacterial urease accessory protein
  UreG, a SIMIBI-class G3E P-loop GTPase. With URED and UREF it is required and
  sufficient for nickel-dependent activation of plant urease. UREG binds the URED-UREF
  complex (not URED or UREF alone) and thereby joins urease in a
  urease-URED-UREF-UREG activation complex. Plants lack UreE, and plant UreGs carry a
  plant-specific N-terminal extension with a His- and Asp/Glu-rich hypervariable segment
  and two conserved HXH motifs; the region up to the second HXH motif is essential for
  urease activation in vivo. UREG that has encountered nickel in planta can transfer
  nickel to a purified urease-URED-UREF complex and activate urease without added
  nickel, establishing UREG as the nickel-delivering component of plant urease
  maturation. GTP hydrolysis by plant UreG has been shown for the soybean protein and
  is the conserved mechanism of the bacterial orthologs, although GTP did not stimulate
  Arabidopsis urease activation in vitro. ureg mutants lack urease activity and cannot
  grow on urea as sole nitrogen source.
