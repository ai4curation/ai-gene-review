  supporting_entities:
  - InterPro:IPR004400
  review:
    summary: InterPro2GO mapping from the UreG family signature. UREG belongs to the
      SIMIBI class G3E GTPase family, UreG subfamily, with a conserved P-loop GTP-binding
      motif.
    action: ACCEPT
    reason: GTPase activity is the conserved catalytic activity of the UreG family -
      bacterial UreG GTP hydrolysis is required for urease maturation - and GTP
      hydrolysis has been demonstrated for a plant UreG (soybean). Arabidopsis UREG
      retains the G3E family architecture and GTP-binding P-loop. Caveat - GTPase
      activity has not been measured for the Arabidopsis protein, and GTP did not
      accelerate (and inhibited) Arabidopsis urease activation in vitro, which the
      authors attribute to the lack of an activation-competent, nickel-loaded UREG in
      their in vitro set-up. On family-level and plant-ortholog evidence the term is
      accepted as a core function.
    supported_by:
    - reference_id: file:ARATH/UREG/UREG-uniprot.txt
      supporting_text: Belongs to the SIMIBI class G3E GTPase family. UreG subfamily.
    - reference_id: PMID:28710280
      supporting_text: That plant UreG hydrolyzes GTP in principle was shown for the soybean
        enzyme ( 19 ).
    - reference_id: PMID:24115911
      supporting_text: Its GTPase activity is essential for urease maturation as either
        the substitution of GTPase P-loop motif or the use of nonhydrolyzable GTP analog
        during urease activation resulted in inactive urease
    - reference_id: PMID:10500143
      supporting_text: Based on studies involving a nonhydrolyzable analog of GTP, we conclude
        that nucleotide hydrolysis, not just binding, is required for this process.
