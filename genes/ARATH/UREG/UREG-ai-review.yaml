  review:
    summary: PAINT inference of urease activator activity at the UreG family node
      (PTHR31715), seeded by the Arabidopsis UREG experimental annotation.
    action: ACCEPT
    reason: Node placement is sound - UreG is a conserved, essential urease activation
      component from bacteria to plants (potato UreG partially complements a K.
      aerogenes ureG mutant) - and UREG's own IMP annotation is among the descendant
      evidence (expected, not circular). Core function.
    supported_by:
