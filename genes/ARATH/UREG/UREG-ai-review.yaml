        plant accessory genes were coexpressed together with the plant urease gene.
    - reference_id: PMID:11289508
      supporting_text: The plant gene complements the K. aerogenes ureG mutation, demonstrating
        that it encodes a urease accessory protein and indicating a structural conservation
        between the plant and the bacterial urease activation complexes.
