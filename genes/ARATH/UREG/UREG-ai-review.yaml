suggested_questions:
- question: Does Arabidopsis UREG hydrolyse GTP, and is GTP hydrolysis required for nickel
    delivery in planta, given that GTP inhibited activation in vitro?
  experts:
  - Urease metallocenter assembly biochemists
- question: What loads nickel onto plant UREG in vivo, given that UREG could not be made
    activation-competent in vitro by nickel, bicarbonate and GTP?
suggested_experiments:
- hypothesis: Arabidopsis UREG is a functional GTPase and GTP hydrolysis is required for
    urease activation in vivo.
  description: Measure GTP hydrolysis by purified nickel-loaded Arabidopsis UREG alone and
    with URED-UREF, and complement ureg-1 with P-loop (G1 motif) mutants of UREG, assaying
    nickel-dependent urease activity.
  experiment_type: Enzyme kinetics, mutagenesis, complementation
- hypothesis: A cellular factor loads nickel onto UREG.
  description: Pull down UREG from nickel-fertilized versus unfertilized plants and
    identify nickel-dependent interactors by mass spectrometry.
  experiment_type: Affinity purification-mass spectrometry
