- term:
    id: GO:0170061
    label: nickel chaperone activity
  evidence_type: IDA
  original_reference_id: PMID:28710280
  review:
    summary: Arabidopsis UREG that has contacted nickel in planta delivers nickel to a
      purified urease-URED-UREF complex, activating urease with no nickel, bicarbonate
      or GTP added; the plant-specific His-rich N-terminal extension (HXH motifs) is
      required. Plants lack UreE, and UREG appears to combine UreG and UreE-like
      nickel-delivery roles.
    action: NEW
    reason: GO:0170061 is defined as directly binding to and delivering nickel ions to a
      target protein. Myrach et al. 2017 show exactly this for Arabidopsis UREG with
      purified proteins - activation competence resides in nickel-exposed UREG itself and
      is transferred to the urease complex in the absence of free nickel. This is a
      molecular function of UREG itself (not a substrate/necessity inference) and adds
      information not captured by urease activator activity or nickel cation binding.
    supported_by:
    - reference_id: PMID:28710280
      supporting_text: These data demonstrate that extract components were not required
        but that activation competence lay within the UreG protein itself after coming
        into contact with nickel in vivo .
    - reference_id: PMID:28710280
      supporting_text: Similarly, Arabidopsis UreG activated in vivo in nickel-fertilized
        plants is capable of transferring Ni 2+ to a urease–UreD–UreF complex in vitro
        leading to urease activation without the addition of any nickel and bicarbonate
        and in the presence of EDTA ( Fig. 6 ).
