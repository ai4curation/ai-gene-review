- term:
    id: GO:0043419
    label: urea catabolic process
  evidence_type: IDA
  original_reference_id: PMID:28710280
  qualifier: involved_in
  review:
    summary: UREG delivers nickel to urease in the activation complex; activation was
      assayed as urease-catalysed urea hydrolysis.
    action: ACCEPT
    reason: >-
      UREG does not hydrolyse urea itself; it delivers the active-site nickel
      that the reaction depends on, during activation of the enzyme that does.
      GO relates the urease activator complex to this process directly
      (GO:0150006 capable of part of GO:0043419), so urea catabolic process is
      the core process for urease accessory proteins, applied the same way in
      the bacterial UreD/UreF/UreG/UreE reviews.
    supported_by:
    - reference_id: PMID:28710280
      supporting_text: UreG is crucial for nickel delivery because UreG-dependent urease
        activation in vitro was observed only with UreG obtained from nickel-sufficient
        plants.
