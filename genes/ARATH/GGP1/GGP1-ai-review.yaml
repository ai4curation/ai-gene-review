- id: PMID:35932489
  title: Glutathione degradation activity of γ-glutamyl peptidase 1 manifests its dual
    roles in primary and secondary sulfur metabolism in Arabidopsis.
  findings:
  - statement: GGP1 (and GGP3) degrade reduced GSH in vitro with physiological Km; ggp1
      mutants accumulate more GSH and have lower glucosinolates, indicating a dual role
      in primary and secondary sulfur metabolism.
    supporting_text: we suggest that GGP1 and possibly GGP3 play vital roles in both primary
      and secondary sulfur metabolism
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; basis for the NEW glutathione catabolic process
      annotation. Not yet reflected in GOA.
- id: PMID:41176694
  title: 'Crystal structure of plant γ-glutamyl peptidase 1: implications for sulfur metabolism
    and secondary metabolite biosynthesis.'
  findings:
  - statement: Crystal structures of GGP1 reveal a Cys100/His192 catalytic dyad forming
      a covalent gamma-glutamyl intermediate and an open S1' pocket explaining dual activity
      on GSH and GSH conjugates.
    supporting_text: An open pocket is present beyond the thiol side chain of cysteine in
      the S1' subsite, which contributed to the dual activity of GGP1 toward GSH and the
      GSH conjugates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; structural basis for the catalytic mechanism.
suggested_questions:
- question: In vivo, which fraction of GGP1 flux goes to free GSH turnover versus glucosinolate/camalexin
    GSH conjugates, and does substrate competition in the cytosol (millimolar GSH vs
    micromolar conjugates) limit glucosinolate throughput?
- question: Which carboxypeptidase (if any) removes glycine from the Cys-Gly conjugates
    in the glucosinolate and camalexin pathways, or does SUR1 act directly on Cys-Gly
    conjugates?
- question: Does the redox-sensitive Cys100-Cys154 disulfide observed in crystals regulate
    GGP1 activity in planta under oxidative stress?
suggested_experiments:
- description: Quantify glucosinolate-related GSH conjugates, Cys-Gly conjugates and free
    GSH in ggp1, ggp3 and ggp1 ggp3 null (CRISPR) lines across sulfur supply to partition
    GGP1 flux between primary and secondary sulfur metabolism.
- description: Test recombinant SUR1 with Cys-Gly versus Cys conjugates of glucosinolate
    precursors to determine whether a carboxypeptidase step is needed between GGP1 and
    SUR1.
- description: Express the C154S GGP1 variant in ggp1 plants and assay activity and GSH
    levels under oxidative stress to test redox regulation via the Cys100-Cys154 disulfide.
