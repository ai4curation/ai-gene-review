gene_symbol: GGP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GGP1 (gamma-glutamyl peptidase 1, At4g30530) is a cytosolic class-I
  glutamine amidotransferase-like (peptidase C26 family) cysteine hydrolase that cleaves
  the gamma-glutamyl isopeptide bond of glutathione (GSH) and of GSH S-conjugates,
  releasing L-glutamate and the corresponding cysteinylglycine species. In the core
  glucosinolate pathway it processes the S-(alkyl/aryl-acetohydroximoyl)-GSH conjugates
  formed after GSH donates the thioglucoside sulfur, producing the Cys-Gly conjugates
  that feed the C-S lyase SUR1; it acts redundantly with the tandem paralog GGP3 on
  aliphatic, indolic and aromatic conjugates. It performs the same reaction on GS-IAN in
  biosynthesis of the indole phytoalexin camalexin. GGP1 also hydrolyzes free reduced
  GSH (but not GSSG) with a Km in the physiological cytosolic range and is highly
  expressed in rosette leaves, so it contributes to cytosolic GSH turnover and sulfur
  reallocation. Crystal structures show a Cys100/His192 catalytic dyad that forms a
  covalent gamma-glutamyl-enzyme intermediate.
