- term:
    id: GO:0006751
    label: glutathione catabolic process
  evidence_type: IDA
  original_reference_id: PMID:35932489
  review:
    summary: Proposed new annotation. GGP1 complements a yeast GSH-degradation assay,
      recombinant GGP1 hydrolyzes reduced GSH (not GSSG) with a Km (5 mM) matching
      cytosolic GSH concentrations, and ggp1 mutants constantly accumulate more GSH.
    action: NEW
    reason: GGP1 itself catalyzes the committing hydrolysis of GSH to glutamate and
      Cys-Gly, so it performs a step of GSH catabolism (participation test passes, not
      merely necessity). Comparator check - the other Arabidopsis enzymes that cleave
      GSH in its degradation (GGCT2;1, GGCT2;2, GGCT2;3, GGT1-GGT4) carry GO:0006751 in
      QuickGO; GGP1 lacks it only because PMID:35932489 has not yet been curated.
    supported_by:
    - reference_id: PMID:35932489
      supporting_text: Recombinant proteins of GGP1, as well as GGP3, showed high degradation
        activity of GSH, but not of oxidized glutathione (GSSG), in vitro. Notably, the
        GGP1 transcripts were highly abundant in rosette leaves, in agreement with the
        ggp1 mutants constantly accumulating more GSH regardless of nutritional conditions.
    - reference_id: PMID:41176694
      supporting_text: During glutathione (GSH) turnover, GGP1 hydrolyzes the isopeptide
        bond of GSH to degrade the tripeptide into glutamate and cysteinylglycine.
