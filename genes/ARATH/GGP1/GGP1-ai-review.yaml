    review_notes: Abstract-only in cache; source of the IDA gamma-glutamyl-peptidase and
      glucosinolate annotations.
- id: PMID:21712415
  title: Cytosolic γ-glutamyl peptidases process glutathione conjugates in the biosynthesis
    of glucosinolates and camalexin in Arabidopsis.
  findings:
  - statement: ggp1 ggp3 knockdowns accumulate up to ten glucosinolate-related GSH conjugates
      and GS-IAN, are reduced in camalexin, and recombinant GGP1/GGP3 hydrolyze these
      conjugates; both proteins are cytosolic.
    supporting_text: Our results demonstrate that GSH is the sulfur donor in the biosynthesis
      of glucosinolates and establish an in vivo function for the only known cytosolic
      plant γ-glutamyl peptidases
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; key primary paper for localization, activity and
      in planta pathway role.
