description: >-
  ZDS (zeta-carotene desaturase, EC 1.3.5.6; also ZDS1, CLB5, SPC1, PDE181) is a
  nuclear-encoded, plastid-targeted flavoenzyme that performs the third of the four
  backbone steps of the plant/cyanobacterial poly-cis carotene-desaturation route
  (PDS -> Z-ISO -> ZDS -> CRTISO) leading from 15-cis-phytoene to lycopene. ZDS
  introduces two double bonds at the C-7 and C-7' positions of 9,9'-di-cis-zeta-carotene,
  proceeding through the intermediate 7,9,9'-tri-cis-neurosporene, to yield
  7,7',9,9'-tetra-cis-lycopene (pro-lycopene); the two desaturations are coupled to the
  reduction of two molecules of a lipophilic quinone (plastoquinone), so the enzyme is an
  oxidoreductase acting on the CH-CH group with a quinone acceptor. Because its substrate
  must first have its central 15-cis bond isomerised (by Z-ISO), ZDS acts on the
  di-cis-zeta-carotene rather than on the PDS product directly, and its own poly-cis
  product is subsequently isomerised to all-trans-lycopene by CRTISO before ring cyclisation.
  The protein carries an N-terminal transit peptide and functions as a membrane-associated
  enzyme of plastids, localising to the chloroplast (including the chloroplast envelope) and
  chromoplast. ZDS is essential for carotenoid biosynthesis: loss-of-function alleles are
  seedling-lethal albinos with growth arrest, and carotenoid deficiency additionally causes
  photoprotection loss, ABA deficiency, altered leaf development and disrupted
  plastid-to-nucleus retrograde signalling, the latter mediated by an apocarotenoid signal
  formed by cleavage of the phytoene/zeta-carotene intermediates that accumulate when ZDS
  is absent.
