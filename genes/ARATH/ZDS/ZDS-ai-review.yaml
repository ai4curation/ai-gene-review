suggested_questions:
- question: >-
    What is the physiological electron acceptor and the sub-plastidial membrane environment
    of Arabidopsis ZDS in vivo? The reaction uses a lipophilic quinone (plastoquinone) in
    vitro, but whether ZDS feeds electrons into the photosynthetic plastoquinone pool and
    whether it works from the envelope, thylakoid or both is not resolved.
  experts:
  - Peter Beyer
  - Barry J. Pogson
- question: >-
    Which apocarotenoid, produced by CCD4 cleavage of the phytoene/zeta-carotene that
    accumulates when ZDS is absent, is the retrograde/leaf-development signal, and how does
    it act? This would separate ZDS's catalytic role from the indirect signalling phenotypes
    of zds/clb5 mutants.
  experts:
  - Patricia León
  - Manuel Rodríguez-Concepción
suggested_experiments:
- hypothesis: >-
    Arabidopsis ZDS is a quinone-dependent desaturase that acts specifically on
    9,9'-di-cis-zeta-carotene (requiring prior Z-ISO isomerization) and produces
    7,7',9,9'-tetra-cis-lycopene via 7,9,9'-tri-cis-neurosporene.
  description: >-
    Express and purify mature His-tagged Arabidopsis ZDS, reconstitute in plastoquinone-
    loaded liposomes, and assay against 9,15,9'-tri-cis-zeta-carotene versus
    9,9'-di-cis-zeta-carotene (with/without Z-ISO), following intermediates and products by
    C30 reversed-phase HPLC-PDA/MS; test decyl-plastoquinone versus decyl-ubiquinone as
    acceptor.
  experiment_type: in vitro enzyme assay with purified recombinant protein
- hypothesis: >-
    ZDS resides in the chloroplast envelope/plastid membranes and its loss, not the loss of
    all-trans carotenoids per se, drives the retrograde-signalling phenotype through
    substrate-derived apocarotenoids.
  description: >-
    Localise a native-promoter ZDS-GFP fusion (complementing spc1/clb5) by confocal imaging
    and by immunoblot of purified envelope/stroma/thylakoid fractions; then compare
    carotenoid profiles, retrograde marker-gene expression and leaf morphology in zds, zds
    ziso and zds ccd4 backgrounds to test the substrate-cleavage signal model.
  experiment_type: subcellular localization plus genetic epistasis with metabolite and
    transcript profiling
