core_functions:
- description: >-
    9,9'-di-cis-zeta-carotene desaturase activity: introduces two double bonds (at C-7 and
    C-7') into 9,9'-di-cis-zeta-carotene, via 7,9,9'-tri-cis-neurosporene, to give
    7,7',9,9'-tetra-cis-lycopene (pro-lycopene), coupled to reduction of two molecules of a
    lipophilic quinone (plastoquinone). Membrane-associated, FAD-containing, plastid enzyme
    of the poly-cis carotene desaturation route.
