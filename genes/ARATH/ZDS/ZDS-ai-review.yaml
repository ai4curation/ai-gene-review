- id: PMID:9914519
  title: Two Arabidopsis thaliana carotene desaturases, phytoene desaturase and zeta-carotene
    desaturase, expressed in Escherichia coli, catalyze a poly-cis pathway to yield
    pro-lycopene.
  findings:
  - statement: >-
      Recombinant Arabidopsis phytoene desaturase and zeta-carotene desaturase, reconstituted
      with GGPP synthase and phytoene synthase in E. coli, produce pro-lycopene
      (7,9,7',9'-tetra-cis-lycopene) as the main end product of the plant poly-cis pathway.
    supporting_text: >-
      We show that pro-lycopene (7,9,7',9'-tetra-cis)-lycopene is the main end product of the
      plant desaturation pathway in these cells.
    reference_section_type: ABSTRACT
  - statement: >-
      ZDS is stereospecific: it acts on zeta-carotene only after photoisomerization/Z-ISO
      provides the correct configuration, then forms pro-lycopene.
    supporting_text: >-
      zeta-Carotene then meets the stereospecific requirements of zeta-carotene desaturase
      and pro-lycopene is formed.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary biochemical paper establishing ZDS molecular function (EC 1.3.5.6,
      ECO:0000269|PubMed:9914519 in UniProt). Cached record is abstract-only, but the
      abstract states the reconstitution result and stereospecificity explicitly.
- id: PMID:17468780
  title: The Arabidopsis Spontaneous Cell Death1 gene, encoding a zeta-carotene desaturase
    essential for carotenoid biosynthesis, is involved in chloroplast development,
    photoprotection and retrograde signalling.
  findings:
  - statement: >-
      The spc1 mutants map to ZDS, and downstream carotenoids are reduced in the weak
      allele, showing SPC1 is a functional zeta-carotene desaturase essential for carotenoid
      biosynthesis.
    supporting_text: >-
      several major carotenoid compounds downstream of SPC1/ZDS were substantially reduced in
      spc1-1, suggesting that SPC1 is a functional ZDS
    reference_section_type: ABSTRACT
  - statement: >-
      Loss of ZDS also disrupts plastid-to-nucleus retrograde signalling (loss of Lhcb1.1,
      Lhcb1.4, RbcS expression in spc1-2), an indirect consequence of carotenoid deficiency.
    supporting_text: >-
      expression of Lhcb1.1, Lhcb1.4 and RbcS was absent in spc1-2, suggesting the possible
      involvement of carotenoids in the plastid-to-nucleus retrograde signaling
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary genetics paper (spc1 alleles) supporting the IMP carotenoid-biosynthesis
      annotation. Abstract-only cache; the mapping to ZDS and the reduced downstream
      carotenoids are stated in the abstract.
- id: PMID:24907342
  title: An Uncharacterized Apocarotenoid-Derived Signal Generated in ζ-Carotene Desaturase
    Mutants Regulates Leaf Development and the Expression of Chloroplast and Nuclear
    Genes in Arabidopsis.
  findings:
  - statement: >-
      Carotenoid biosynthesis and the downstream leaf-development/gene-expression phenotypes
      depend on ZDS/CLB5 activity; the phenotypes are rescued by blocking upstream phytoene
      desaturase.
    supporting_text: >-
      Biosynthesis of the signal depends on ζ-carotene desaturase activity encoded by the
      ζ-CAROTENE DESATURASE (ZDS)/CHLOROPLAST BIOGENESIS5 (CLB5) gene in Arabidopsis thaliana
    reference_section_type: ABSTRACT
  - statement: >-
      The leaf-development and gene-expression alterations of zds mutants are caused by an
      apocarotenoid signal made from the accumulated ZDS substrates (phytofluene/zeta-carotene)
      via CCD4, not by ZDS catalysis itself.
    supporting_text: >-
      phytofluene and/or ζ-carotene are substrates for an unidentified signaling molecule
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary paper (clb5/zds alleles) supporting the second IMP carotenoid-biosynthesis
      annotation and clarifying that the developmental/retrograde phenotypes are downstream,
      substrate-derived effects rather than ZDS activities. Abstract-only cache.
