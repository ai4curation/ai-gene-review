suggested_questions:
- question: Which of the five identical AtLpxC loci are transcribed and translated in planta, and in which
    tissues? With identical coding sequences, does the activity come from one copy or several?
- question: Do the AtLpxC copies differ in UTRs or promoters in ways that separate their expression, or
    are they kept identical by gene conversion?
- question: Does recombinant mature AtLpxC deacetylate UDP-3-O-[(3R)-3-hydroxymyristoyl]-GlcNAc, and is
    it sensitive to LpxC inhibitors such as CHIR-090?
suggested_experiments:
- experiment_type: in vitro enzyme assay and complementation
  hypothesis: The 326-aa AtLpxC product is an active Zn-dependent UDP-3-O-acyl-GlcNAc deacetylase.
  description: Express the mature protein (without residues 1-21) and assay deacetylation of UDP-3-O-(R-3-hydroxymyristoyl)-GlcNAc
    by LC-MS. Test complementation of a conditional E. coli lpxC strain; use the AtLpxC1.2-type truncation
    (lacking H281/D285/D289/H313) as a negative control.
- experiment_type: locus-resolved expression and genome editing
  hypothesis: Only a subset of the five tandem AtLpxC loci contributes lipid X synthesis in vivo.
  description: Use long-read RNA-seq with UTR-anchored, locus-specific primers to assign transcripts to
    loci. Delete individual loci and the whole 68-kb cluster with CRISPR/Cas9, then measure lipid X and
    lipid IVA by LC-ESI/MS.
