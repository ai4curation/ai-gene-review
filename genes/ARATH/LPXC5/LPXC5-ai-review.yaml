id: F4IAW1
gene_symbol: LPXC5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: LPXC5 (At1g25210) is one of five tandem, near-identical Arabidopsis genes for UDP-3-O-acyl-N-acetylglucosamine
  deacetylase (LpxC). LpxC is the zinc-dependent enzyme that removes the N-acetyl group from UDP-3-O-[(3R)-3-hydroxyacyl]-GlcNAc,
  the committed step of the bacterial-type (Raetz) lipid A pathway. Its 326-aa canonical product is identical
  in sequence to AtLpxC1.1 (LPXC1). It has a mitochondrial transit peptide and conserves every E. coli
  LpxC zinc ligand and catalytic residue. No experiment has targeted LPXC5 on its own. RNAi against all
  five cluster genes lowers the lipid A precursor lipid X, and the identical AtLpxC1.1 protein localises
  to mitochondria. Which copy contributes the activity in vivo is unknown. Knock-down plants grow normally,
  and the final plant lipid A-like product and its role are unknown.
