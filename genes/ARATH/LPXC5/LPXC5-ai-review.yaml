core_functions:
- description: Mitochondrial zinc-dependent UDP-3-O-acyl-N-acetylglucosamine deacetylase that catalyses
    the committed step of the plant lipid A precursor (Raetz) pathway upstream of LpxD/LpxB. Inferred
    from full active-site conservation with E. coli LpxC and supported in planta by family-wide RNAi,
    which lowers lipid X. The product is identical to AtLpxC1.1; the contribution of this particular locus
    is unknown.
  molecular_function:
    id: GO:0103117
    label: UDP-3-O-acyl-N-acetylglucosamine deacetylase activity
