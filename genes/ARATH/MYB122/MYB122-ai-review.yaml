gene_symbol: MYB122
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MYB122 (At1g74080) is a nuclear R2R3-MYB transcription factor of subgroup 12, the
  glucosinolate-regulating MYB clade that also contains MYB28, MYB29 and MYB76 (aliphatic
  glucosinolates) and MYB34/ATR1 and MYB51/HIG1 (indolic glucosinolates). Its N-terminal
  R2R3 MYB repeats bind cis-regulatory promoter elements, and it positively regulates
  transcription of tryptophan-derived indolic glucosinolate (IG) biosynthetic genes such as
  CYP79B2/CYP79B3 and TSB1. Overexpression raises IG levels and causes high-auxin phenotypes,
  whereas loss of function lowers IG content; MYB122 acts partly redundantly with MYB34 and
  MYB51 (the triple mutant lacks IGs), with MYB122 playing an accessory role under standard
  conditions and a larger contribution under jasmonate/ethylene induction. By controlling
  CYP79B2/CYP79B3-dependent indole-3-acetaldoxime supply it also influences camalexin
  levels. Its expression is induced by pathogen-activated MPK3/MPK6-ERF6 signalling,
  camalexin-inducing stimuli, aphid feeding and copper; it associates with the
  jasmonate-regulated bHLH activators MYC2/MYC3/MYC4 and with the brassinosteroid-regulated
  repressor BES1. During infection by the hemibiotrophic fungus Colletotrichum higginsianum,
  MYB122 is induced specifically in epidermal cells at infection sites, and myb122 mutants
  are hypersusceptible, with larger lesions and accelerated branching of invasive hyphae,
  indicating a role in epidermal antifungal defense, presumably via IG-derived antimicrobial
  metabolites.
