- term:
    id: GO:0010439
    label: regulation of glucosinolate biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:24431192
  qualifier: involved_in
  review:
    summary: MYB122 positively regulates indolic glucosinolate biosynthesis. Overexpression
      increases IG levels; myb122 single mutants have reduced IG levels and lose BR-mediated
      repression of IGs; the myb34 myb51 myb122 triple mutant is devoid of IGs.
    action: NEW
    reason: The TF itself performs the regulatory step (trans-activation of IG biosynthetic
      gene promoters such as CYP79B2/B3 and TSB1), so the participation test for a
      regulation term is met. Comparator check (QuickGO, Arabidopsis) - the subgroup-12
      aliphatic glucosinolate regulators MYB28, MYB29 and MYB76 carry GO:0010439 by IMP,
      whereas MYB34 and MYB51 carry GO:0009759 indole glucosinolate biosynthetic process
      (acts_upstream_of_or_within, IMP); MYB122 has neither despite equivalent genetic
      evidence. No more specific "regulation of indole glucosinolate biosynthetic process"
      term exists in GO. MYB122's contribution is accessory relative to MYB34 and MYB51,
      but it is genetically demonstrable in single and combinatorial mutants.
    additional_reference_ids:
    - PMID:17461791
    - PMID:23580754
    supported_by:
    - reference_id: PMID:24431192
      supporting_text: MYB34, MYB51, and MYB122 act together to control the biosynthesis of
        I3M in shoots and roots, with MYB34 controlling biosynthesis of IGs mainly in the
        roots, MYB51 regulating biosynthesis in shoots, and MYB122 having an accessory role
        in the biosynthesis of IGs.
    - reference_id: PMID:24431192
      supporting_text: The myb34 myb51 myb122 triple mutant is devoid of IGs, indicating that
        these three MYB factors are indispensable for IG production under standard growth
        conditions.
    - reference_id: PMID:17461791
      supporting_text: Overexpression of MYB122, another close homologue of HIG1/MYB51, did not
        rescue the hig1-1 chemotype, but caused a high-auxin phenotype and increased levels of
        indolic glucosinolates in the wild-type.
    - reference_id: PMID:23580754
      supporting_text: MYB34, MYB51 and MYB122 loss-of-function mutation all conferred reduced
        indolic glucosinolate levels.
    - reference_id: file:ARATH/MYB122/MYB122-deep-research-falcon.md
      supporting_text: primary function is positive transcriptional regulation of
        tryptophan-derived indole glucosinolate biosynthesis
