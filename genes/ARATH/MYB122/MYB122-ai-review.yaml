suggested_questions:
- question: Does MYB122 promote epidermal resistance to C. higginsianum through indolic
    glucosinolate (PEN2/PEN3-dependent) products, camalexin, or other IAOx-derived
    metabolites, given that only the susceptibility phenotype (not metabolite levels) was
    measured in myb122 mutants?
- question: Is the C. higginsianum TAIR annotation (GO:0050832, IDA) better coded as IMP,
    since the evidence is a mutant susceptibility phenotype?
- question: Should a more specific GO term "regulation of indole glucosinolate biosynthetic
    process" be created to capture the distinct roles of MYB34, MYB51 and MYB122 versus the
    aliphatic regulators MYB28/MYB29/MYB76?
- question: Should MYB122 carry GO:1901183 positive regulation of camalexin biosynthetic
    process? Camalexin is reduced in myb51 myb122 and triple mutants via reduced IAOx supply
    (Frerigmann et al. 2015) and MYB122 promotes camalexin at P. syringae sites (Stahl et al.
    2016), yet pathogen-induced camalexin is unaltered in the triple mutant (Frerigmann et al.
    2016) and no single-mutant effect is reported.
- question: Which promoters does MYB122 bind directly in vivo, and how do its targets differ
    from MYB51, which is induced in vasculature rather than epidermis at infection sites?
suggested_experiments:
- experiment_type: cell-type-specific metabolite profiling
  hypothesis: myb122 mutants fail to accumulate indolic glucosinolates and their PEN2-dependent
    breakdown products in epidermal cells at C. higginsianum infection sites.
  description: Compare IG, 4MI3G, camalexin and ICA levels in wild type, myb122 and
    complemented lines in infected leaf epidermis (epidermal peels or spatial metabolomics).
- experiment_type: genetic complementation and epistasis
  hypothesis: The myb122 hypersusceptibility to C. higginsianum depends on IG metabolism.
  description: Complement myb122 with an epidermis-specific promoter-driven MYB122 and test
    myb122 pen2 and myb122 cyp79b2 cyp79b3 combinations for additive versus epistatic
    susceptibility.
- experiment_type: ChIP-seq / DAP-seq
  hypothesis: MYB122 directly binds promoters of CYP79B2, CYP79B3, TSB1 and CYP83B1 in
    infected epidermal cells.
  description: Profile MYB122 genome-wide binding (tagged MYB122 under native promoter) in mock
    and C. higginsianum infected leaves.
