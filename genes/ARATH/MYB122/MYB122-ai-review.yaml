  review:
    summary: Single-cell transcriptomics of Arabidopsis leaves infected by Colletotrichum
      higginsianum showed MYB122 induced specifically in epidermal cells at infection sites;
      two independent myb122 T-DNA mutants were hypersusceptible, with larger lesions at
      5 dpi and accelerated formation of branched secondary invasive hyphae in epidermal
      cells at 36-42 hpi.
    action: ACCEPT
    reason: The full text (read from the article PDF; cache is abstract-only) shows a
      reproducible loss-of-function susceptibility phenotype with two alleles plus
      infection-site-specific induction, supporting involvement of MYB122 in antifungal
      defense. The evidence is really a mutant phenotype (IMP would be more apt than IDA),
      and the mechanism (elevated IG-derived antimicrobials in epidermis) is inferred, not
      measured. Consistent with the earlier finding that the myb34 myb51 myb122 triple
      mutant is susceptible to Plectosphaerella cucumerina via loss of IGs. This is the main
      biological process outcome of MYB122 activity and is retained as core.
    additional_reference_ids:
