gene_symbol: IIL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  IIL1 (IPMI LSU1, LeuC; At4g13430) is the single large subunit of the plastid-localized,
  bacterial-type heterodimeric isopropylmalate isomerase (IPMI) of Arabidopsis. A member of
  the aconitase superfamily, it carries aconitase domains 1-3 and the [4Fe-4S] cluster, while
  one of three small subunits (SSU1-3, LeuD) supplies domain 4 and determines substrate specificity.
  The heterodimer catalyzes the reversible dehydration/rehydration that converts a 2-alkylmalate
  to the corresponding 3-alkylmalate via an alkylmaleate intermediate. Paired with SSU1, IIL1
  isomerizes 2-isopropylmalate in L-leucine biosynthesis; paired with SSU2 or SSU3, it isomerizes
  2-(omega-methylthio)alkylmalates in each cycle of methionine chain elongation, the first
  phase of aliphatic glucosinolate biosynthesis. Consistent with this dual role, reduction
  of IIL1 causes accumulation of 2-isopropylmalate and methylthioalkylmalate intermediates,
  lower levels of long-chain aliphatic glucosinolates and increased short-chain (C3) glucosinolates.
  IIL1 is expressed mainly in and along the vasculature and is located in the chloroplast
  stroma. A triplet-repeat expansion in an IIL1 intron underlies the temperature-dependent
  growth defect of accession Bur-0.
