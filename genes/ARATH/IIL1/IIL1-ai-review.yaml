- term:
    id: GO:0009316
    label: 3-isopropylmalate dehydratase complex
  evidence_type: IPI
  original_reference_id: PMID:20663849
  review:
    summary: >-
      IIL1 (LeuC) physically interacts with the small subunits (LeuD1-3 = SSU2, SSU3, SSU1)
      to form functional heterodimeric IPMIs in the chloroplast stroma.
    action: NEW
    reason: >-
      The isomerase activity is a property of the LeuC:LeuD heterodimer (GO:0009316 is defined
      as the leuC/leuD heterodimer). He et al. 2010 demonstrated the physical interaction
      and functionality of the heterodimers; Knill et al. 2009 and Lachler et al. 2020 show
      the small subunit defines pathway specificity. The complex term records the subunit
      semantics that the 'enables' MF annotations cannot. IIL1 is a structural and catalytic
      component of the complex, so this is a direct part_of relationship, not a substrate/necessity
      inference. (Chen et al. 2021 did not detect LeuC-LeuD interaction by Y2H, which is noted
      as a caveat.)
    supported_by:
    - *id003
    - reference_id: PMID:24608865
      supporting_text: >-
        Isopropylmalate isomerase (IPMI), an enzyme usually involved in Leu biosynthesis,
        is a heterodimer consisting of a large and a small subunit.
    - reference_id: PMID:33568694
      supporting_text: >-
        However, no interactions could be found between LeuC and any of the LeuDs in our Y2H
        experiments
