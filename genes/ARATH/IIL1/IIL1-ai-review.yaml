    Protein complex formation in methionine chain-elongation and leucine biosynthesis.
  findings:
  - statement: >-
      LeuC interacts with IPMDH1 and IPMDH2 (Y2H, BiFC, Co-IP) but no LeuC-LeuD interaction
      was detected by Y2H; leuc ipmdh1 double mutant enhances the GSL chain-length phenotype.
    supporting_text: >-
      It has been demonstrated that LeuC plays dual roles in both GLS and Leu biosynthesis
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; interaction and double-mutant data.
- id: PMID:32612621
  title: >-
    In Arabidopsis thaliana Substrate Recognition and Tissue- as Well as Plastid Type-Specific
    Expression Define the Roles of Distinct Small Subunits of Isopropylmalate Isomerase.
  findings:
  - statement: >-
      The small subunit defines IPMI function; SSU1 serves Leu biosynthesis, SSU2/SSU3 Met
      chain elongation.
    supporting_text: The function of IPMI is defined by the small subunits.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; context on small-subunit specialization.
- id: PMID:20663849
  title: >-
    Functional specification of Arabidopsis isopropylmalate isomerases in glucosinolate and
    leucine biosynthesis.
  findings:
  - statement: >-
      LeuC physically interacts with LeuD proteins forming functional IPMIs in the chloroplast
      stroma.
    supporting_text: >-
      We demonstrate here that AtLeuC physically interacts with AtLeuD proteins to form functional
      IPMIs. The IPMIs are localized to chloroplast stroma.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache; supports heterodimer formation and stromal localization.
