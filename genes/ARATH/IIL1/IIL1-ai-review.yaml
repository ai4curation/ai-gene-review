  review:
    summary: >-
      Intramolecular hydroxytransferase (isomerase class) activity was assigned on the basis
      of reduced Met-derived glucosinolates in atleuc1 knockouts.
    action: MODIFY
    reason: >-
      The reaction (2-alkylmalate to 3-alkylmalate via the maleate intermediate) is classified
      by EC and GO as a hydro-lyase (EC 4.2.1.33 / EC 4.2.1.170), not as an intramolecular
      hydroxytransferase (EC 5.4.4.-). GO now has a specific term for the Met chain-elongation
      isomerization, GO:0120528 2-(omega-methylthio)alkylmalate dehydratase activity, which
      captures what Sawada et al. showed (the gene encodes the MAM-isomerase large subunit).
      Note Sawada et al. had no in vitro assay; the MF is inferred from mutant metabolite
      phenotypes.
    proposed_replacement_terms:
    - id: GO:0120528
      label: 2-(omega-methylthio)alkylmalate dehydratase activity
    supported_by:
