- id: PMID:19597944
  title: >-
    Arabidopsis thaliana encodes a bacterial-type heterodimeric isopropylmalate isomerase
    involved in both Leu biosynthesis and the Met chain elongation pathway of glucosinolate
    formation.
  findings:
  - statement: >-
      IIL1 is the single IPMI large subunit; lsu1 mutants accumulate 2-IPM and Met chain-elongation
      intermediates and shift aliphatic glucosinolates toward shorter chains, establishing
      a dual role in Leu and glucosinolate biosynthesis.
    supporting_text: >-
      Metabolic profiling of large subunit mutants revealed accumulation of intermediates
      of both Leu biosynthesis and Met chain elongation, and an altered composition of aliphatic
      glucosinolates demonstrating the function of this gene in both pathways.
    reference_section_type: ABSTRACT
  - statement: >-
      Small subunits are proposed to determine substrate specificity; the heterodimer is pathway-specific
      even though the large subunit is not.
    supporting_text: >-
      Thus, the resulting IPMI heterodimer is pathway-specific even if the large subunit per
      se is not.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read; primary source of EXP annotations. No in vitro enzyme assay; functions
      inferred from mutant metabolite profiles.
