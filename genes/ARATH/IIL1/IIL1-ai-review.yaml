- term:
    id: GO:0003861
    label: 3-isopropylmalate dehydratase activity
  evidence_type: EXP
  original_reference_id: PMID:19597944
  qualifier: enables
  review:
    summary: >-
      IIL1 (IPMI LSU1, LeuC) is the sole large subunit of the plastid heterodimeric isopropylmalate
      isomerase. Knockdown/knockout lines accumulate the IPMI substrate 2-isopropylmalate,
      showing the large subunit is required for isomerization of 2-IPM in Leu biosynthesis.
    action: ACCEPT
    reason: >-
      Core catalytic function. Strictly, the activity is exerted by the LSU1:SSU heterodimer
      (LSU1 carries aconitase domains 1-3 and the [4Fe-4S] cluster, the SSU supplies domain
      4), so the most precise representation is contributes_to at the complex level; however
      the large subunit carries the catalytic cluster and is part of every IPMI isoform, so
      'enables' is acceptable. Knill et al. 2009 show 2-IPM accumulation in lsu1 lines; He
      et al. 2010 show LeuC-LeuD heterodimers are functional IPMIs.
    supported_by:
    - &id001
      reference_id: PMID:19597944
      supporting_text: >-
        The IPMI substrate, 2-IPM, accumulates when transcript of IPMI LSU1 is reduced sufficiently.
    - &id002
      reference_id: PMID:19597944
      supporting_text: >-
        Metabolic profiling of large subunit mutants revealed accumulation of intermediates
        of both Leu biosynthesis and Met chain elongation, and an altered composition of aliphatic
        glucosinolates demonstrating the function of this gene in both pathways.
    - &id006
      reference_id: PMID:19597944
      supporting_text: >-
        However, in IPMIs of bacteria, archaea and plants domains 1–3 are found in a large
        subunit, while domain 4 is found in a small subunit.
    - &id003
      reference_id: PMID:20663849
      supporting_text: >-
        We demonstrate here that AtLeuC physically interacts with AtLeuD proteins to form
        functional IPMIs. The IPMIs are localized to chloroplast stroma.
