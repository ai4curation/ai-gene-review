suggested_questions:
- question: >-
    Does IIL1 form stable heterodimers with each of SSU1, SSU2 and SSU3 in planta (He et al.
    2010 report interaction, whereas Chen et al. 2021 saw none by Y2H), and what is the relative
    occupancy of each heterodimer in vascular versus mesophyll plastids?
- question: >-
    What are the kinetic parameters of reconstituted LSU1:SSU1, LSU1:SSU2 and LSU1:SSU3 heterodimers
    toward 2-isopropylmalate and each chain-length 2-(omega-methylthio)alkylmalate?
- question: >-
    Is the reported association of IPMI (LeuC) with IPMDH1 part of a functional metabolon
    that channels methylthioalkylmalates through the chain-elongation cycle?
suggested_experiments:
- description: >-
    Co-express IIL1 with each small subunit in E. coli leuC/leuD mutants or purify reconstituted
    heterodimers and measure isomerase kinetics with 2-IPM and 2-(2'-methylthio)ethylmalate
    / longer homologues.
  experiment_type: in vitro enzyme kinetics
- description: >-
    Native co-immunoprecipitation or affinity purification-MS of tagged IIL1 from leaf chloroplasts
    to determine which small subunits and other chain-elongation enzymes (e.g. IPMDH1) it
    associates with in vivo.
  experiment_type: protein interaction proteomics
- description: >-
    Verify [4Fe-4S] cluster content of recombinant IIL1 (EPR/UV-vis) and test oxygen/redox
    sensitivity of IPMI activity in chloroplast extracts.
  experiment_type: biochemistry/spectroscopy
