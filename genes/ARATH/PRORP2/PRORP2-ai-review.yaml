gene_symbol: PRORP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PRORP2 (At2g16650) is one of two nuclear protein-only ribonuclease P (PRORP) enzymes of
  Arabidopsis thaliana, the other being PRORP3; PRORP1 is the organellar
  (mitochondrial/plastid) paralog. Land plants have no RNase P RNA, and PRORP2 works as a
  single polypeptide, with no RNA subunit and no protein partners required for catalysis.
  It removes the 5' leader from nuclear-encoded precursor tRNAs by endonucleolytic
  cleavage immediately upstream of position +1 (EC 3.1.26.5). The 528-residue protein
  has an N-terminal pentatricopeptide repeat (PPR) domain that binds the pre-tRNA elbow
  and drives substrate affinity, a central domain with a structural zinc site, and a
  C-terminal NYN/PIN-like metallonuclease domain. Catalysis needs Mg2+ (Mn2+ also works)
  and the conserved aspartates (D343, D421, D422, D440) and H445. Crystal and SAXS
  structures (PDB 5DIZ, 5FT9) show a V-shaped protein, monomeric in solution, that hinges
  open to accommodate tRNA. The recombinant enzyme processes nuclear pre-tRNAs in vitro,
  and it restores viability to Escherichia coli lacking its own RNA-based RNase P. In
  planta, YFP fusions and immunodetection place PRORP2 in the nucleus. Single prorp2
  mutants have no visible phenotype, but prorp2 prorp3 double mutants are lethal at the
  gametophyte/seed stage. Silencing PRORP2 in a prorp3 background lowers nuclear tRNA
  levels and causes 5'-leader-containing precursors to accumulate. It also lowers
  levels of the C/D-box snoRNA snoR43, which is released from a dicistronic tRNA(Gly)-snoRNA
  precursor, and that precursor accumulates. In vivo, PRORP2 co-purifies with the
  m2,2G26 tRNA methyltransferases TRM1A and TRM1B, which help nuclear RNase P process a
  subset of tRNAs.
