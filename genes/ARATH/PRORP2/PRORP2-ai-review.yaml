core_functions:
- description: >-
    Single-subunit, protein-only nuclear RNase P that removes the 5' leader from
    nuclear-encoded precursor tRNAs. It cleaves endonucleolytically at position +1 with
    a Mg2+-dependent NYN/PIN-like metallonuclease domain, and its PPR domain mediates
    pre-tRNA binding. PRORP2 is redundant with PRORP3, and the two together are
    essential. The activity and its nuclear localisation are established experimentally
    for PRORP2 itself, by in vitro assays and structures of the purified protein and by
    in planta silencing in a prorp3 background.
  molecular_function:
    id: GO:0004526
    label: ribonuclease P activity
  directly_involved_in:
  - id: GO:0001682
    label: tRNA 5'-leader removal
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:22549728
    supporting_text: PRORP proteins whose localization is strictly restricted to nuclei in Arabidopsis have canonical RNase P activity as single-protein enzymes
  - reference_id: PMID:26655022
    supporting_text: Our biochemical studies indicate that PRORP2 requires Mg(2+) for catalysis
  - reference_id: PMID:22549728
    supporting_text: This result shows that PRORP2 and PRORP3 have redundant functions in the nucleus and that this function is essential.
  - reference_id: PMID:20473316
    supporting_text: PRORP2 and PRORP3, two paralogs of PRORP1, are both localized in the nucleus
suggested_questions:
- question: >-
    Do the supplementary data of Gutmann et al. 2012 (PMID:22549728) show any nuclear mRNA
    defect in PRORP2/3-silenced plants? If not, should the TAIR mRNA processing IMP move
    from PRORP2 (AT2G16650) to PRORP1 (AT2G32230), whose silencing reduced nad6 mRNA?
  experts:
  - TAIR curators
  - Philippe Giegé lab (IBMP Strasbourg)
- question: >-
    Are there nuclear substrates other than pre-tRNAs and tRNA-snoRNA dicistrons, for
    example tRNA-like structures in nuclear mRNAs or lncRNAs, that PRORP2 and PRORP3
    process, and do the two paralogs have different substrate preferences in vivo?
  experts:
  - plant RNA processing biologists
suggested_experiments:
- description: >-
    Transcriptome-wide 5'-end mapping (for example, Cap/5'-monophosphate sequencing) in
    inducible prorp2 prorp3 knockdown lines, to define the full set of nuclear PRORP
    cleavage sites beyond pre-tRNAs and to test whether any nuclear mRNA or snoRNA
    precursors are direct substrates.
  experiment_type: transcriptomics
- description: >-
    In vitro cleavage of a tRNA(Gly)-snoR43 dicistronic transcript by purified PRORP2 and
    its D421A/D422A catalytic mutant, to show directly that PRORP2 performs the first step
    of snoR43 release.
  experiment_type: biochemical assay
