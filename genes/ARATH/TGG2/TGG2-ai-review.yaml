suggested_questions:
- question: How does TGG2 contribute to ABA- and MeJA-induced stomatal closure if it is not
    detectably expressed in guard cells - low guard-cell expression, a non-cell-autonomous effect,
    or indirect effects of altered glucosinolate levels in the double mutant?
- question: Do TGG1 and TGG2 differ in substrate preference, ascorbate activation or complex
    formation with myrosinase-associated/binding proteins (e.g. MVP1) in a way that shapes hydrolysis
    product profiles?
suggested_experiments:
- description: Express and purify recombinant TGG2 and compare its kinetics on aliphatic, indole
    and benzyl glucosinolates, ascorbate activation and O-beta-glucosidase activity with TGG1.
- description: Use cell-type-specific complementation of tgg1 tgg2 (TGG2 under a guard-cell
    versus a myrosin-idioblast promoter) to test where TGG2 must act to restore stomatal responses
    and herbivore resistance.
