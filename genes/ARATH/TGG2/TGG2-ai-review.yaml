taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'TGG2 (THIOGLUCOSIDE GLUCOHYDROLASE 2, BGLU37; At5g25980) is one of the two classical
  shoot myrosinases of Arabidopsis, a glycoside hydrolase family 1 beta-thioglucosidase (EC
  3.2.1.147) that hydrolyzes the thioglucosidic bond of glucosinolates, releasing glucose and
  an unstable aglucone that rearranges to isothiocyanates or, with specifier proteins, to nitriles,
  epithionitriles or thiocyanates. TGG2 is encoded next to TGG1 in an inverted tandem arrangement
  and is expressed in myrosin idioblasts associated with the phloem, where the signal-peptide-bearing
  glycoprotein is stored in vacuole-derived compartments separated from glucosinolates until
  tissue damage. Its correct trafficking depends on the myrosinase-associated protein MVP1,
  which binds TGG2 specifically. TGG2 acts redundantly with TGG1: either enzyme alone supports
  normal damage-induced glucosinolate breakdown, whereas the tgg1 tgg2 double mutant lacks detectable
  leaf myrosinase activity, fails to hydrolyze aliphatic glucosinolates on damage and is more
  susceptible to generalist lepidopteran herbivores. The double mutant is also impaired in ABA-
  and methyl jasmonate-induced stomatal closure.'
