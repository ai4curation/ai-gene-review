description: 'JACKDAW (JKD; INDETERMINATE DOMAIN 10, IDD10) is a nuclear BIRD/IDD-family C2H2 zinc-finger
  transcription factor of Arabidopsis that acts in the root meristem ground tissue and quiescent centre.
  Its four N-terminal zinc fingers have separable roles: ZF1-ZF3 bind the IDD consensus DNA motif while
  ZF3-ZF4 form the docking surface for the GRAS-domain SHORT-ROOT (SHR)-SCARECROW (SCR) heterodimer, so
  that JKD provides the sequence-specific DNA contact for the SHR-SCR coregulator complex. JKD is expressed
  independently of SHR, helps retain mobile SHR in the nucleus of the endodermis/QC layer (confining SHR
  action to a single cell layer), and activates SCR and MAGPIE transcription with SHR-SCR. Together with
  other BIRD proteins (BLJ, MGP, NUC) it is required for the formative asymmetric division of the cortex/endodermis
  initial daughter, for stabilizing the stele/ground-tissue boundary and for ground-tissue identity. JKD
  acting in the cortex also influences position-dependent hair/non-hair patterning of the overlying epidermis
  non-cell-autonomously, and like other IDDs it can bind DELLA and SCL3 coregulators at gibberellin-responsive
  promoters.'
