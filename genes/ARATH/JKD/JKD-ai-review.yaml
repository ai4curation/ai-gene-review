suggested_questions:
- question: How do JKD and MGP, which bind the SHR groove mutually exclusively, partition SHR-SCR complexes
    between endodermis and cortex, and does this explain the cell-type-specific complex conformations
    seen by FRET-FLIM?
- question: What is the non-cell-autonomous signal by which cortical JKD patterns hair and non-hair epidermal
    cells?
suggested_experiments:
- description: Express JKD carrying ZF4 mutations that abolish SHR-SCR binding but preserve DNA binding
    in jkd blj backgrounds to separate the SHR-retention and transcriptional functions in vivo.
