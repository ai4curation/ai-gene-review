- id: PMID:17785527
  title: Arabidopsis JACKDAW and MAGPIE zinc finger proteins delimit asymmetric cell division and stabilize
    tissue boundaries by restricting SHORT-ROOT action.
  findings:
  - statement: JKD and MGP act in a SHR-dependent feed-forward loop restricting SHR/SCR range of action.
    supporting_text: JACKDAW and MAGPIE genes, which encode members of a plant-specific family of zinc
      finger proteins, act in a SHR-dependent feed-forward loop to regulate the range of action of SHORT-ROOT
      and SCARECROW
  - statement: JKD expression is SHR-independent and it regulates the SCR domain; MGP expression is SHR/SCR-dependent.
    supporting_text: JACKDAW expression is initiated independent of SHORT-ROOT and regulates the SCARECROW
      expression domain outside the stele, while MAGPIE expression depends on SHORT-ROOT and SCARECROW
  - statement: JKD and MGP regulate tissue boundaries and asymmetric cell division.
    supporting_text: JACKDAW and MAGPIE regulate tissue boundaries and asymmetric cell division and can
      control SHORT-ROOT and SCARECROW activity in a transcriptional and protein interaction network
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding JKD/MGP paper (Genes Dev 2007); abstract-only cache.
- id: PMID:20356954
  title: JACKDAW controls epidermal patterning in the Arabidopsis root meristem through a non-cell-autonomous
    mechanism.
  findings:
  - statement: JKD acts non-cell-autonomously from the cortex in epidermal patterning.
    supporting_text: Tissue-specific induction experiments indicate non-cell-autonomous action of JKD
      from the underlying cortex cell layer to specify epidermal cell fate
  - statement: JKD localizes to QC and ground tissue and delimits SHR movement.
    supporting_text: JACKDAW (JKD), a zinc finger protein, localizes in the quiescent centre and the ground
      tissue, and regulates tissue boundaries and asymmetric cell division by delimiting SHORT-ROOT movement
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache.
- id: PMID:21935722
  title: Activity of transcription factor JACKDAW is essential for SHR/SCR-dependent activation of SCARECROW
    and MAGPIE and is modulated by reciprocal interactions with MAGPIE, SCARECROW and SHORT ROOT.
  findings:
  - statement: JKD activates SCR and MGP promoter reporters in protoplasts.
    supporting_text: Transient expression of LUC reporter genes with the proximal sequences upstream from
      the ATG codon of SCR and MGP in protoplasts were activated by JKD
  - statement: JKD binds SCR and MGP promoter sequences in yeast one-hybrid.
    supporting_text: Yeast one-hybrid analysis showed that JKD binds to the SCR and MGP promoter sequences
  - statement: JKD directly regulates SCR and MGP with SHR, SCR and MGP.
    supporting_text: Our findings suggest that JKD directly regulates SCR and MGP expression in cooperation
      with SHR, SCR and MGP
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; direct evidence for JKD transcription activator function.
- id: PMID:24821766
  title: DELLA protein functions as a transcriptional activator through the DNA binding of the indeterminate
    domain family proteins.
  findings:
  - statement: IDDs bind DELLA and the SCL3 promoter.
    supporting_text: we identified five members of indeterminate domain (IDD) protein family which bind
      physically to both DELLA and the promoter sequence of the GA-positive regulator SCARECROW-LIKE 3
      (SCL3)
  - statement: IDDs act as transcriptional scaffolds for the DELLA and SCL3 coregulators.
    supporting_text: These results suggest that the coregulators DELLA and SCL3, using IDDs as transcriptional
      scaffolds for DNA binding, antagonistically regulate the expression of their downstream targets
      to control the GA signaling pathway
  - statement: Loss of AtIDD10 (JKD) increases endodermal periclinal division.
    supporting_text: lack of AtIDD10 causes a defect in DELLA-mediated feedback, thus resulting in increased
      cell division
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Partial full text (discussion); IDD10 = JKD.
- id: PMID:25829440
  title: Arabidopsis BIRD Zinc Finger Proteins Jointly Stabilize Tissue Boundaries by Confining the Cell
    Fate Regulator SHORT-ROOT and Contributing to Fate Specification.
  findings:
  - statement: BIRDs constrain SHR spread via nuclear retention and regulate SHR targets SCR and CYCD6.
    supporting_text: constraining SHORT-ROOT spread through nuclear retention and transcriptional regulation
      of key downstream SHORT-ROOT targets, including SCARECROW and CYCLIND6
  - statement: BIRDs tether and regulate transcriptional competence of SHR complexes.
    supporting_text: BIRD proteins promote formative divisions and tissue specification in the Arabidopsis
      thaliana root meristem ground tissue by tethering and regulating transcriptional competence of SHORT-ROOT
      complexes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache.
- id: PMID:26494755
  title: Transcriptional control of tissue formation throughout root development.
  findings:
  - statement: JKD and BIB promote SHR nuclear retention and, with MGP and NUC, are required for formative
      divisions.
    supporting_text: JKD and BALD-IBIS regulate SHR movement by promoting its nuclear retention, and cooperatively
      with MAGPIE (MGP) and NUTCRACKER (NUC) are required for the formative divisions that pattern the
      ground tissue into cortex and endodermis
  - statement: BLJ, JKD and SCR are essential for SHR to carry out ground tissue patterning.
    supporting_text: These results indicate that BLJ, JKD, and SCR are essential for SHR to carry out
      ground tissue patterning
  - statement: JKD direct targets were identified by ChIP-seq.
    supporting_text: Among the BIRDs, we focused on BLJ and JKD because they have a specific role in ground
      tissue establishment and identified their direct targets through chromatin immunoprecipitation (ChIP)
      followed by sequencing
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available (Science 2015).
- id: PMID:28211915
  title: Structure of the SHR-SCR heterodimer bound to the BIRD/IDD transcriptional factor JKD.
  findings:
  - statement: SHR-SCR bind JKD ZF3-ZF4 and function as transcription cofactors.
    supporting_text: SHR-SCR function as transcription cofactors by binding to the third and fourth ZFs,
      (ZF3-ZF4) of JKD
  - statement: JKD ZF1-ZF3 mediate DNA binding within the JKD-SHR-SCR complex.
    supporting_text: the ZF1-ZF2-ZF3 of JKD in the JKD-SHR-SCR complex is involved in DNA binding
  - statement: SHR-SCR binds JKD ZF3-ZF4 with 124 nM affinity.
    supporting_text: relatively high affinity of the SHR-SCR complex to MGP ZF3-ZF4 (the KD value of 36
      nM) and JKD ZF3-ZF4 (124 nM)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Crystal structure of JKD-SHR-SCR ternary complex; full text.
- id: PMID:28746306
  title: In vivo FRET-FLIM reveals cell-type-specific protein interactions in Arabidopsis roots.
