  review:
    summary: ABCB4 binds ATP through the nucleotide-binding apparatus that powers transport.
    action: ACCEPT
    reason: Recombinant PGP4 shows nucleotide photoaffinity labeling and Mg/vanadate-dependent nucleotide
      trapping. ATP binding is an integral mechanistic property of the ABC carrier, not a peripheral incidental
      ligand interaction.
    supported_by:
