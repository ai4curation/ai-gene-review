- term:
    id: GO:0008559
    label: ABC-type xenobiotic transporter activity
  evidence_type: IDA
  original_reference_id: PMID:16243904
  qualifier: enables
  review:
    summary: The cited substrate screen does not demonstrate ABC-type xenobiotic export.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID16243904 measures vanadate trapping stimulated by candidate compounds and direct IAA uptake;
      stimulation is not itself translocation of those compounds. GO:0008559 specifically encodes ATP-coupled
      xenobiotic movement from inside to outside. Later direct 2,4-D uptake supports xenobiotic transport
      as a process but explicitly not its efflux, so it cannot rescue this directional molecular-function
      assertion.
    supported_by:
    - *id003
    - &id007
      reference_id: PMID:21992190
      supporting_text: ABCB4 mediates uptake, but not efflux, of the synthetic auxin 2,4-D in cells lacking
        AUX1 activity.
