      reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC1276020/
      supporting_text: this basal level of PGP4 ATPase activity required both Mg2+ and vanadate
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: ISM
  original_reference_id: GO_REF:0000122
  qualifier: located_in
  review:
    summary: The AtSubP nuclear assignment overextends sequence prediction for the intact ABCB4 membrane
      transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: AtSubP is an ISM compartment prediction; experimental-curator deference does not apply. ABCB4
      live-cell imaging and photobleaching directly support strong plasma-membrane retention and slow
      endocytosis toward the lytic vacuolar pathway (PMID:22492845), consistent with its multipass carrier
      topology. Assigning the intact carrier to the nucleus from the sequence classifier alone exceeds
      the target-specific localization evidence and does not account for the established membrane architecture
      and trafficking. MARK_AS_OVER_ANNOTATED reflects that unsupported compartment assignment, not a
      demonstrated absence from every nuclear-envelope pool. A hypothetical nuclear membrane pool or cleaved
      fragment is not positive support for this row; no such target-specific mechanism is established
      by the cited studies.
    supported_by:
    - &id001
      reference_id: PMID:22492845
      supporting_text: Fluorescence recovery after photobleaching analysis revealed that ABCB4 is strongly
        retained in the plasma membrane
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: HDA
  original_reference_id: PMID:28887381
  qualifier: located_in
  review:
    summary: The cited detergent-solubilized microsomal experiment does not establish a soluble cytosolic
      ABCB4 pool.
    action: MARK_AS_OVER_ANNOTATED
    reason: Inspection of all PMID28887381 supplements identifies ABCB4 in the Mapp multi-protein group
      as a true membrane protein with a plasma-membrane SUBAcon assignment and no dual-location flag.
      Cholate solubility describes extraction of microsomal membranes, not cytosolic localization. The
      cytosol claim exceeds that evidence; this is not a categorical exclusion based only on transmembrane
      topology.
    supported_by:
    - reference_id: PMID:28887381
    - *id001
    - reference_id: file:ARATH/ABCB19/ABCB19-bioinformatics/README.md
      supporting_text: ABCB4 occurs in a multigene protein group in S1 row 631, likewise with `True membrane
        = True` and blank `Dual Localized`.
