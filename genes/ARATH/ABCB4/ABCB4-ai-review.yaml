    label: gravitropism
  evidence_type: IMP
  original_reference_id: PMID:17557805
  qualifier: acts_upstream_of_or_within
  review:
    summary: ABCB4-dependent basipetal auxin flow modulates root gravitropic curvature.
    action: KEEP_AS_NON_CORE
    reason: The mdr4 mutants have enhanced gravitropic curvature in this study, despite reduced basipetal
      flow. Retain gravitropism without converting the phenotype into an invariant positive-promoting
      role or conflating acropetal and basipetal streams.
