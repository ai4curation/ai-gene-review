    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15889151
  review:
    summary: ARF19 interaction with the Aux/IAA protein IAA3/SHY2 (UniProtKB:Q38822) from a study of matched
      ARF-Aux/IAA pairs (stabilized shy2-2 inhibits ARF7/ARF19-dependent gravitropism and auxin-induced
      root gene expression).
    action: MODIFY
    reason: Generic protein binding is uninformative. Aux/IAA proteins act as transcriptional co-repressors
      of activator ARFs (heterodimerizing with the ARF PB1 domain and recruiting TOPLESS), so the ARF19
      side of this interaction is transcription corepressor binding. The partner is identified by the
