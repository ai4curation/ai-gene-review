id: Q8RYC8
gene_symbol: ARF19
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ARF19 is a class-A auxin response factor that binds AuxRE-containing cis-regulatory
  DNA and activates target transcription. Together with ARF7 it directly regulates LBD genes
  during lateral-root formation and contributes to leaf expansion, root responses to ethylene
  and auxin-induced callus formation. Its B3-containing DNA-binding domain, middle activation
  region and C-terminal PB1 interaction domain couple DNA recognition to partner-dependent regulation.
  Canonical Aux/IAA proteins repress its activity, whereas noncanonical Aux/IAA interactions
  need not confer the same regulatory mechanism. ARF19 partitions between nuclei of meristematic
  root cells and cytoplasmic condensates in mature root cells; PB1 interactions and the disordered
  middle region contribute to this partitioning.
