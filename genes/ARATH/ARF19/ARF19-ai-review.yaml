    label: callus formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: ARF19 together with ARF7 is required for callus formation during cellular dedifferentiation.
      They recruit ATXR2 to deposit H3K36me3 at LBD gene promoters [PMID:29184030].
    action: KEEP_AS_NON_CORE
    reason: Callus formation is a specialized developmental process that occurs in tissue culture conditions.
