  - TAIR:locus:2202205
- term:
    id: GO:0048366
    label: leaf development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: ARF7 and ARF19 together promote leaf cell expansion. The arf7 arf19 double mutant shows decreased
      leaf cell expansion [PMID:15960621].
    action: KEEP_AS_NON_CORE
    reason: While ARF7/ARF19 do contribute to leaf development, this is a secondary pleiotropic effect.
      The primary core function is in lateral root formation and auxin-mediated transcription. Leaf development
      is a downstream consequence of their transcriptional activity.
    supported_by:
    - reference_id: PMID:15960621
      supporting_text: in combination with mutations in NPH4/ARF7, encoding the most closely related ARF,
        they cause several phenotypes including a drastic decrease in lateral and adventitious root formation
        and a decrease in leaf cell expansion
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN004816699
  - TAIR:locus:2180469
  - TAIR:locus:2202205
