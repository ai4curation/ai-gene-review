- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: ARF19 binds specifically to auxin response elements (AuxREs) containing the TGTCTC
      motif in promoters of target genes. This is a core molecular function well supported by
      phylogenetic inference and experimental data from the ARF family [PMID:15659631, PMID:17259263].
    action: ACCEPT
    reason: ARF transcription factors bind to cis-regulatory AuxRE sequences. This is the fundamental
      molecular function of the ARF family and has been directly demonstrated for ARF7/ARF19.
      IBA annotation is appropriate given the conserved function across the ARF family.
    supported_by:
    - reference_id: PMID:17259263
      supporting_text: ARF7 and ARF19 directly regulate the auxin-mediated transcription of
        LATERAL ORGAN BOUNDARIES-DOMAIN16/ASYMMETRIC LEAVES2-LIKE18 (LBD16/ASL18) and/or LBD29/ASL16
        in roots
    - reference_id: PMID:15659631
      supporting_text: The AUXIN RESPONSE FACTOR (ARF) gene family products, together with the
        AUXIN/INDOLE-3-ACETIC ACID proteins, regulate auxin-mediated transcriptional activation/repression
