- term:
    id: GO:0009733
    label: response to auxin
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: ARF19 mediates cellular responses to auxin by activating transcription of auxin-responsive
      genes upon release from AUX/IAA repression. This is a core function shared across ARF
      family members [PMID:15659631, PMID:16461383].
    action: ACCEPT
    reason: ARF19 is a key effector of auxin responses. Its transcriptional activity is released
      when auxin triggers degradation of AUX/IAA repressors. This is a core biological process
      annotation.
    supported_by:
    - reference_id: PMID:16461383
      supporting_text: Both arf19 and arf7 mutants isolated from our forward genetic screens
        are auxin resistant
    - reference_id: PMID:15659631
      supporting_text: Global gene expression analysis revealed that auxin-induced gene expression
        is severely impaired in the arf7 single and arf7 arf19 double mutants
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN004816699
  - TAIR:locus:2180469
  - TAIR:locus:2202205
- term:
    id: GO:0010311
    label: lateral root formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: ARF19 together with ARF7 is essential for lateral root formation in Arabidopsis.
      The arf7 arf19 double mutant is severely impaired in lateral root formation [PMID:15659631,
      PMID:17259263].
    action: ACCEPT
    reason: Direct activation of LBD16/LBD29 and mutant/induction evidence place this ARF in
      the execution of lateral-root formation, not simply as a gene whose absence causes nonspecific
      growth failure. This is a major shared native role of ARF7 and ARF19.
    supported_by:
    - reference_id: PMID:15659631
      supporting_text: arf7 arf19 has a strong auxin-related phenotype not observed in the arf7
        and arf19 single mutants, including severely impaired lateral root formation
    - reference_id: PMID:17259263
      supporting_text: The arf7 arf19 double knockout mutant is severely impaired in lateral
        root formation
  qualifier: involved_in
  supporting_entities:
