id: Q8RYC8
gene_symbol: ARF19
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ARF19 is an A-class Auxin Response Factor transcription factor that binds to auxin-responsive
  promoter elements (AuxREs; consensus TGTCTC) and activates transcription of downstream target genes
  including LBD16 and LBD29. It functions redundantly with ARF7 in lateral root formation, gravitropism,
  leaf expansion, and callus formation. ARF19 activity is regulated by AUX/IAA repressor proteins that
  are degraded via the SCFTIR1/AFB ubiquitin ligase complex upon auxin perception, releasing ARFs to activate
  transcription. ARF19 also integrates ethylene signaling in roots. The protein contains an N-terminal
  B3-type DNA binding domain, a glutamine-rich middle activation domain, and a C-terminal PB1 domain for
  homo/heterodimerization and interaction with AUX/IAA proteins.
existing_annotations:
- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: ARF19 binds specifically to auxin response elements (AuxREs) containing the TGTCTC motif
      in promoters of target genes. This is a core molecular function well supported by phylogenetic inference
      and experimental data from the ARF family [PMID:15659631, PMID:17259263].
    action: ACCEPT
    reason: ARF transcription factors bind to cis-regulatory AuxRE sequences. This is the fundamental
      molecular function of the ARF family and has been directly demonstrated for ARF7/ARF19. IBA annotation
      is appropriate given the conserved function across the ARF family.
    supported_by:
    - reference_id: PMID:17259263
      supporting_text: ARF7 and ARF19 directly regulate the auxin-mediated transcription of LATERAL ORGAN
        BOUNDARIES-DOMAIN16/ASYMMETRIC LEAVES2-LIKE18 (LBD16/ASL18) and/or LBD29/ASL16 in roots
    - reference_id: PMID:15659631
      supporting_text: The AUXIN RESPONSE FACTOR (ARF) gene family products, together with the AUXIN/INDOLE-3-ACETIC
        ACID proteins, regulate auxin-mediated transcriptional activation/repression
    - reference_id: file:ARATH/ARF19/ARF19-deep-research-falcon.md
      supporting_text: ARF19 (At1g19220) is a nuclear A-class ARF transcription factor that binds composite
        AuxREs to regulate auxin-responsive gene expression, acting redundantly with ARF7 to control lateral
        root initiation via LBD/LOB genes and integrating ethylene signaling in roots.
