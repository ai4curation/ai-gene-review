- term:
    id: GO:0009734
    label: auxin-activated signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: GO:0009734 includes the auxin-signaling series that begins with auxin perception and ends
      with modulation of downstream cellular processes such as transcription. ARF19 is a canonical downstream
      transcriptional effector in this pathway.
    action: ACCEPT
    reason: ARF19 does not bind auxin directly, but the GO term explicitly covers the pathway through
      transcriptional output. Mutant and transcriptomic evidence show that auxin-induced gene expression
      is impaired when ARF7/ARF19 function is lost, supporting ARF19's participation in auxin-activated
      signaling and avoiding an overly narrow receptor/proximal-transduction interpretation of this GO
      term.
    supported_by:
    - reference_id: PMID:15659631
      supporting_text: Global gene expression analysis revealed that auxin-induced gene expression is
        severely impaired in the arf7 single and arf7 arf19 double mutants
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0927
