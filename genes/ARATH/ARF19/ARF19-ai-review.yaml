  - TAIR:locus:2180469
  - TAIR:locus:2202205
- term:
    id: GO:0010311
    label: lateral root formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: ARF19 together with ARF7 is essential for lateral root formation in Arabidopsis. The arf7
      arf19 double mutant is severely impaired in lateral root formation [PMID:15659631, PMID:17259263].
    action: ACCEPT
    reason: Lateral root formation is a well-established core function of ARF19. This is supported by
      extensive genetic evidence showing the arf7 arf19 double mutant phenotype.
    supported_by:
    - reference_id: PMID:15659631
      supporting_text: arf7 arf19 has a strong auxin-related phenotype not observed in the arf7 and arf19
        single mutants, including severely impaired lateral root formation
    - reference_id: PMID:17259263
      supporting_text: The arf7 arf19 double knockout mutant is severely impaired in lateral root formation
  qualifier: involved_in
