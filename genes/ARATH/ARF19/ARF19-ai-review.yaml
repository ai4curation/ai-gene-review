suggested_questions:
- question: What is the precise mechanism by which ARF19 recruits chromatin modifiers (ATXR2, JMJ30) to
    target promoters?
- question: Are there ARF19-specific target genes distinct from ARF7, or do they regulate entirely overlapping
    gene sets?
- question: What post-translational modifications regulate ARF19 activity beyond AUX/IAA binding?
- question: GO has histone methyltransferase binding (GO:1990226) and histone deacetylase binding (GO:0042826)
    but no histone demethylase binding term; should one be created to capture the ARF7/ARF19-JMJ30 interaction
    (currently GO:0019899 enzyme binding)?
suggested_experiments:
- description: ChIP-seq comparing ARF19 and ARF7 binding sites genome-wide to identify shared vs. unique
    target genes
  hypothesis: ARF19 and ARF7 have largely overlapping but not identical target gene sets
- description: Structure-function analysis of ARF19 domains to determine requirements for chromatin modifier
    recruitment
  hypothesis: Specific regions of ARF19 beyond the PB1 domain mediate ATXR2/JMJ30 recruitment
- description: Time-resolved transcriptomics in arf19 single mutants vs. arf7 arf19 double mutants to
    dissect redundant vs. unique functions
  hypothesis: Some genes are uniquely regulated by ARF19 while others require both ARF7 and ARF19
