- term:
    id: GO:0009733
    label: response to auxin
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: ARF19 mediates cellular responses to auxin by activating transcription of auxin-responsive
      genes upon release from AUX/IAA repression. This is a core function shared across ARF family members
      [PMID:15659631, PMID:16461383].
    action: ACCEPT
    reason: ARF19 is a key effector of auxin responses. Its transcriptional activity is released when
      auxin triggers degradation of AUX/IAA repressors. This is a core biological process annotation.
    supported_by:
    - reference_id: PMID:16461383
      supporting_text: Both arf19 and arf7 mutants isolated from our forward genetic screens are auxin
        resistant
    - reference_id: PMID:15659631
      supporting_text: Global gene expression analysis revealed that auxin-induced gene expression is
        severely impaired in the arf7 single and arf7 arf19 double mutants
  qualifier: involved_in
  supporting_entities:
