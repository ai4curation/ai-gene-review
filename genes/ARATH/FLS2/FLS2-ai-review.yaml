suggested_questions:
- question: Should GO add or use a ligand-specific "bacterial flagellin receptor activity" child
    of pattern recognition receptor activity for FLS2-like receptors, or is GO:0038187 intentionally
    the desired granularity?
- question: Should CLV3p-FLS2 signaling be curated as a noncanonical FLS2 function for Arabidopsis
    stem-cell immunity, or treated only as context for the canonical flagellin receptor pathway?
suggested_experiments:
- experiment_type: structure-function genetics
  hypothesis: FLS2 ligand binding, kinase activity, and endocytosis make separable contributions
    to early PTI signaling and later receptor attenuation.
  description: Compare endogenous-locus FLS2 variants defective in flg22 binding, kinase-catalytic
    activity, BAK1 recruitment, or endocytic sorting for restoration of calcium influx, ROS burst,
    MAPK activation, callose deposition, bacterial resistance, and receptor turnover in fls2 null
    plants.
