    reference_section_type: ABSTRACT
- description: The cytoplasmic kinase domain of FLS2 functions as a transmembrane receptor protein
    serine/threonine kinase in the activated immune receptor complex, coordinating phosphorylation-dependent
    signaling through BIK1/PBL kinases and downstream calcium, ROS, MAPK, transcriptional, stomatal,
    and callose defense outputs. FLS2 also traffics through endosomal membranes after ligand perception;
    this location records receptor trafficking without assigning a separately demonstrated endosomal
    kinase reaction.
