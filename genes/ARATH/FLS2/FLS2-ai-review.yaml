- id: PMID:21726371
  title: Physical association of pattern-triggered immunity (PTI) and effector-triggered immunity
    (ETI) immune receptors in Arabidopsis.
  findings:
  - statement: FLS2 was reported to physically associate with several ETI immune receptors, suggesting
      early PTI/ETI receptor proximity.
    supporting_text: "Here, we \nprovide evidence that FLS2 is physically associated with all three\
      \ R proteins."
    reference_section_type: ABSTRACT
- id: PMID:22087006
  title: Brassinosteroids inhibit pathogen-associated molecular pattern-triggered immune signaling
    independent of the receptor kinase BAK1.
  findings:
  - statement: The study examines FLS2-mediated immune signaling and BAK1-related pathway context
      during brassinosteroid crosstalk.
    supporting_text: BAK1 recruited by FLS2 seems to be different from that recruited by BRI1, as
      BL did not displace the amount of BAK1 immunoprecipitated with FLS2.
    reference_section_type: DISCUSSION
- id: PMID:23085733
  title: Spatio-temporal cellular dynamics of the Arabidopsis flagellin receptor reveal activation
    status-dependent endosomal sorting.
  findings:
  - statement: FLS2 is ligand-dependently internalized after flg22 perception, and activation-state-dependent
      endosomal sorting is well supported. This describes receptor trafficking and signal attenuation
      rather than the core receptor activity itself.
    supporting_text: "FLS2 localizes to bona fide endosomes via two \ndistinct endocytic trafficking\
      \ routes depending on its activation status."
    reference_section_type: ABSTRACT
- id: PMID:23250427
  title: CRT1 is a nuclear-translocated MORC endonuclease that participates in multiple levels of
