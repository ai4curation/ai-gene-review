  - statement: BIK1 and related PBL kinases interact with FLS2 and are rapidly phosphorylated after
      FLS2 activation.
    supporting_text: "In unstimulated plants, BIK1 and PBL1 interact with FLS2 and are rapidly \n\
      phosphorylated upon FLS2 activation by its ligand flg22."
    reference_section_type: ABSTRACT
- id: PMID:20472560
  title: Novel functions of Stomatal Cytokinesis-Defective 1 (SCD1) in innate immune responses against
    bacteria.
  findings:
  - statement: SCD1 co-immunoprecipitates with FLS2-containing microsomal material independently
      of elicitation.
    supporting_text: Here, we used the same approach to identify a protein with an apparent molecular
      mass of about 140 kDa that immunoprecipitated with the αFLS2 antibody in a PF22-independent
      manner from solubilized microsomal membranes of La-er cell culture
    reference_section_type: RESULTS
- id: PMID:21499263
  title: Stem-cell-triggered immunity through CLV3p-FLS2 signalling.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Original CLV3p-FLS2 claim is challenged by the independent primary experiments
