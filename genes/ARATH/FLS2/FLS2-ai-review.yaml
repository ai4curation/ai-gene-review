    reference_section_type: ABSTRACT
- id: PMID:24114786
  title: Structural basis for flg22-induced activation of the Arabidopsis FLS2-BAK1 immune complex.
  findings:
  - statement: FLS2 recognizes the conserved flagellin epitope flg22.
    supporting_text: "Flagellin perception in Arabidopsis is through recognition of its highly \n\
