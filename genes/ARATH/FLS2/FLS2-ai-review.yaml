- id: PMID:10911994
  title: 'FLS2: an LRR receptor-like kinase involved in the perception of the bacterial elicitor
    flagellin in Arabidopsis.'
  findings:
  - statement: The flagellin-insensitive locus FLS2 encodes a putative receptor kinase.
    supporting_text: "The \nFLS2 gene is ubiquitously expressed and encodes a putative receptor kinase."
    reference_section_type: ABSTRACT
- id: PMID:16510871
  title: Ligand-induced endocytosis of the pattern recognition receptor FLS2 in Arabidopsis.
  findings:
  - statement: FLS2-GFP resides at the cell membrane and moves into intracellular vesicles after
      flg22 stimulation.
    supporting_text: "Stimulation with the flagellin \nepitope flg22 induces its transfer into intracellular\
      \ mobile vesicles, followed \nby degradation."
    reference_section_type: ABSTRACT
- id: PMID:17625569
  title: A flagellin-induced complex of the receptor FLS2 and BAK1 initiates plant defence.
  findings:
  - statement: The publication shows ligand-dependent FLS2 association with BAK1 during flagellin
      signaling.
    supporting_text: "We provide evidence that FLS2 and BAK1 form a complex in \nvivo, in a specific\
      \ ligand-dependent manner, within the first minutes of \nstimulation with flagellin."
    reference_section_type: ABSTRACT
- id: PMID:17626179
  title: The receptor-like kinase SERK3/BAK1 is a central regulator of innate immunity in plants.
  findings:
  - statement: SERK3/BAK1 rapidly enters an elicitor-dependent complex with FLS2 during flg22-triggered
      PTI.
    supporting_text: "AtSERK3/BAK1 rapidly enters an elicitor-dependent complex \nwith FLAGELLIN\
      \ SENSING 2 (FLS2)"
    reference_section_type: ABSTRACT
- id: PMID:17644812
  title: A high content in lipid-modified peripheral proteins and integral receptor kinases features
    in the arabidopsis plasma membrane proteome.
  findings: []
- id: PMID:18158241
  title: Pseudomonas syringae effector AvrPto blocks innate immunity by targeting receptor kinases.
  findings:
  - statement: FLS2-dependent PAMP perception contributes to antibacterial defense, and AvrPto suppresses
      this immunity by targeting receptor kinases including FLS2.
    supporting_text: "AvrPto binds receptor kinases, including Arabidopsis FLS2 and EFR and tomato\
      \ \nLeFLS2, to block plant immune responses in the plant cell."
    reference_section_type: ABSTRACT
- id: PMID:19062288
  title: Plant pattern-recognition receptor FLS2 is directed for degradation by the bacterial ubiquitin
    ligase AvrPtoB.
  findings:
  - statement: AvrPtoB associates with FLS2 and promotes ubiquitination/degradation of the receptor
      as a pathogen virulence mechanism.
    supporting_text: "We show that AvrPtoB, through its N \nterminus, associates with FLS2 and BAK1,\
      \ of which interaction with FLS2 is \nenhanced by flg22 activation."
    reference_section_type: ABSTRACT
- id: PMID:19095898
  title: Glucosinolate metabolites required for an Arabidopsis innate immune response.
  findings:
  - statement: FLS2 is required for flg22-induced callose and contributes to antibacterial resistance.
    supporting_text: Mutants lacking the functional Flg22 receptor encoded by the FLS2 gene (11)
      or the functional callose synthase encoded by the PMR4 gene (12) did not respond to Flg22 treatment
    reference_section_type: RESULTS
- id: PMID:20018686
  title: A receptor-like cytoplasmic kinase, BIK1, associates with a flagellin receptor complex to
    initiate plant innate immunity.
  findings:
  - statement: BIK1 associates with the FLS2/BAK1 receptor complex and is phosphorylated upon flagellin
      perception.
    supporting_text: "BIK1 \nassociates with FLS2 and BAK1 in vivo and in vitro."
    reference_section_type: ABSTRACT
- id: PMID:20113440
  title: Early signaling through the Arabidopsis pattern recognition receptors FLS2 and EFR involves
    Ca-associated opening of plasma membrane anion channels.
  findings:
  - statement: FLS2-dependent flg22 perception activates early plasma-membrane electrical and calcium-associated
      signaling through the PAMP receptor pathway.
    supporting_text: "activation of FLS2 and EFR lead to \nBAK1-dependent, calcium-associated plasma\
      \ membrane anion channel opening as an \ninitial step in the pathogen defense pathway."
    reference_section_type: ABSTRACT
- id: PMID:20404519
  title: Phosphorylation of receptor-like cytoplasmic kinases by bacterial flagellin.
  findings:
  - statement: The cited report reviews BIK1 and related RLCK association with the flagellin receptor
      complex downstream of FLS2/BAK1.
    supporting_text: "We recently identified a receptor-like cytoplasmic \nkinase (RLCK) BIK1 that\
      \ associates with flagellin receptor complex to initiate \nplant innate immunity."
    reference_section_type: ABSTRACT
- id: PMID:20413097
  title: Receptor-like cytoplasmic kinases integrate signaling from multiple plant immune receptors
