      HopU1 disrupts RNA binding rather than the GRP7-FLS2 protein association.
    supporting_text: "Here, we show that GRP7 associates with translational \ncomponents, as well\
      \ as with the pattern recognition receptors FLS2 and EFR."
    reference_section_type: ABSTRACT
- id: PMID:23532072
  title: BR-SIGNALING KINASE1 physically associates with FLAGELLIN SENSING2 and regulates plant innate
