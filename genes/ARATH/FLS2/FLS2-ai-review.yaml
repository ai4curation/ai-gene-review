id: Q9FL28
gene_symbol: FLS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: Arabidopsis FLS2 (At5g46330; UniProt Q9FL28) is the FLAGELLIN-SENSING 2 leucine-rich
  repeat receptor-like serine/threonine kinase. FLS2 is a plasma-membrane pattern-recognition receptor
  that detects bacterial flagellin, especially the flg22 epitope, recruits SERK-family co-receptors
  such as BAK1/SERK3 and receptor-like cytoplasmic kinases including BIK1/PBL proteins, and initiates
  pattern-triggered immunity. Ligand perception drives receptor complex phosphorylation, calcium/anion
  channel and ROS signaling, MAP kinase activation, defense gene expression, callose deposition,
  stomatal defense, and regulated receptor endocytosis/turnover.
