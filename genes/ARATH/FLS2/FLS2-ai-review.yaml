  findings:
  - statement: CRT1/MORC1 was reported to interact with FLS2 in immunity-related assays.
    supporting_text: "Consistent with its role in PAMP-triggered immunity, CRT1 \ninteracted with\
      \ the PAMP recognition receptor FLS2."
    reference_section_type: ABSTRACT
- id: PMID:23395902
  title: Pseudomonas HopU1 modulates plant immune receptor levels by blocking the interaction of
