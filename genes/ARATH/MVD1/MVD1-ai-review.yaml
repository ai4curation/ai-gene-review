  review:
    summary: >-
      IBA (is_active_in cytosol) from PTN000104601, seeded only by mouse and human MVD, which are
      cytosolic. The node spans every eukaryotic member of the family, so the plant MVDs inherit it.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The animal localisation is sound for the donors but conflicts with the plant evidence:
      Arabidopsis and periwinkle MVD fusions are peroxisomal (PMID:21655959, PMID:22459325), and
      the only cytosolic data for MVD1 come from a fraction that also contains peroxisomal matrix.
      The cytosolic site of activity is a lineage-specific property that the plant clade does not
      appear to share; a PAINT loss or a lower node for the cytosol IBD would fix it.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
