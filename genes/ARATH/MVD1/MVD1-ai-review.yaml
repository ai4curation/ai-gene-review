        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Cytosol IBD seeded by human and mouse MVD only; the plant members' own fusion data place
          them in peroxisomes.
    supported_by:
    - reference_id: PMID:21655959
      supporting_text: Transient transformations of C. roseus cells with yellow fluorescent protein
        (YFP)-fused constructs reveal that PMK and MVD are localised to the peroxisomes, while MVK
        was cytosolic.
    - reference_id: PMID:22459325
