  review:
    summary: >-
      Cordier et al. 1999 tested homodimer formation of Arabidopsis MVD in a yeast two-hybrid
      assay; UniProt records the result as homodimer (ECO:0000269).
    action: MODIFY
    reason: >-
      The row's own evidence is a homodimerisation assay, so the specific child term
      GO:0042803 protein homodimerization activity fits better than identical protein binding.
      MDDs are obligate homodimers and the dimer is the catalytic unit; this is structural rather
      than a separate function, so not core.
    proposed_replacement_terms:
