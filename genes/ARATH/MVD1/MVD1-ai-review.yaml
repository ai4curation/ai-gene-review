- At2g38700
- MDD1
- AtMVD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MVD1 (At2g38700) encodes one of the two diphosphomevalonate decarboxylases of Arabidopsis
  thaliana, a 412-residue GHMP-superfamily enzyme that converts (R)-mevalonate 5-diphosphate,
  with ATP, to isopentenyl diphosphate, ADP, phosphate and CO2. This is the third and last of the
  ATP-dependent steps that convert mevalonate to isopentenyl diphosphate in the mevalonate
  pathway, which supplies sterols, brassinosteroids, triterpenes, sesquiterpenes, dolichols and
  protein prenyl groups. The cDNA rescues yeast mutants lacking the enzyme, and the recombinant
  protein is specific for mevalonate 5-diphosphate (Km about 16-26 uM), decarboxylating
  mevalonate 5-phosphate some 10,000-fold less efficiently, so plants have no alternative
  mevalonate 5-phosphate decarboxylase route. The protein forms homodimers, and its crystal
  structure has been solved with bound substrate. A YFP fusion localises to peroxisomes, as does
  the upstream phosphomevalonate kinase, placing the final steps of isopentenyl diphosphate
  synthesis in plant peroxisomes; the protein has no canonical peroxisomal targeting signal.
  mvd1 mutants have about half the normal campesterol and less sitosterol and
  beta-caryophyllene, a mild phenotype consistent with partial redundancy with the 89%
  identical paralog MVD2.
