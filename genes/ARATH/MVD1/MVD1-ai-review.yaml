- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: IDA
  original_reference_id: PMID:21655959
  qualifier: located_in
  review:
    summary: >-
      Simkin et al. 2011: YFP fusions of periwinkle and Arabidopsis MVD localise to peroxisomes in
      transiently transformed C. roseus cells (MVK fusions are cytosolic). UniProt attributes the
      Arabidopsis result to MVD1.
    action: ACCEPT
    reason: >-
      Direct evidence (fluorescent fusion) that cannot resolve a sub-compartment, so ACCEPT under
      rule 2 of the root-organelle policy. Caveats recorded rather than acted on: abstract only;
      overexpression in a heterologous cell type; the endogenous protein has not been localised;
      and the segment annotated as a PTS2 (40-48) is not a consensus PTS2, is conserved in the
      cytosolic human and yeast enzymes and overlaps a beta-strand of the crystal structure
      (file:ARATH/PMK/PMK-bioinformatics/RESULTS.md). The periwinkle ortholog stays exclusively
      peroxisomal when new synthesis is blocked (PMID:22459325). No sub-compartment row is added
      because only one line (a soluble enzyme) points to the matrix.
    supported_by:
    - reference_id: PMID:21655959
      supporting_text: These compartmentalisation results were confirmed using the Arabidopsis
        thaliana MVK, PMK and MVD sequences fused to YFP.
    - reference_id: PMID:22459325
      supporting_text: allowing us to clearly demonstrate that 5-phosphomevalonate kinase,
        mevalonate 5-diphosphate decarboxylase and a short isoform of farnesyl diphosphate synthase
        from Catharanthus roseus are exclusively localized to peroxisomes.
