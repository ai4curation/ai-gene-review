- term:
    id: GO:0005829
    label: cytosol
  evidence_type: HDA
  original_reference_id: PMID:25293756
  qualifier: located_in
  review:
    summary: >-
      Aryal et al. 2014 detected MVD1 in the crude cytosolic (soluble) fraction of leaf extracts.
      The same cytosol HDA set contains the major leaf peroxisomal matrix enzymes (catalases CAT1,
      CAT2 and CAT3, glycolate oxidase GLO1, hydroxypyruvate reductase HPR), so peroxisomal matrix
      released during homogenisation is present in this fraction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      What the experiment shows is that MVD1 is soluble; it cannot show that MVD1 is cytosolic,
      because the fraction was not cleared of peroxisomal matrix (file:ARATH/MVD1/MVD1-bioinformatics/RESULTS.md).
      The only localisation of the Arabidopsis protein places it in peroxisomes (PMID:21655959),
      and cytosolic signal from overexpressed fusions of the periwinkle ortholog disappears when
      new synthesis is blocked (PMID:22459325). Not REMOVE: a minor cytosolic pool is not
      excluded.
    supported_by:
    - reference_id: PMID:25293756
      supporting_text: Applying this approach to the crude cytosolic fraction of Arabidopsis
        thaliana leaves using size exclusion chromatography, we identified hundreds of cytosolic
        proteins
    - reference_id: file:ARATH/MVD1/MVD1-bioinformatics/RESULTS.md
      supporting_text: The crude cytosolic fraction contains peroxisomal matrix proteins released
        during homogenisation
    - reference_id: PMID:21655959
      supporting_text: These compartmentalisation results were confirmed using the Arabidopsis
        thaliana MVK, PMK and MVD sequences fused to YFP.
