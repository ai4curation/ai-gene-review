suggested_questions:
- question: What fraction of cytokinin perception occurs at the ER versus the plasma membrane
    in intact tissues, and does the site of perception differ among AHK2, AHK3 and AHK4?
- question: How are receptor-specific outputs (e.g. AHK3-ARR2 in leaf senescence) achieved
    given that all three receptors converge on the same AHP pool?
suggested_experiments:
- hypothesis: Cytokinin signaling output is initiated predominantly from the ER-resident receptor
    pool.
  description: Use receptor variants tethered to ER or plasma membrane in the ahk2 ahk3 cre1
    triple mutant background to test which pool restores cytokinin-dependent transcription.
  experiment_type: genetic complementation
