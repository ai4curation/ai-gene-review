  evidence_type: ISM
  original_reference_id: GO_REF:0000122
  qualifier: located_in
  review:
    summary: Sequence-model (ISM) prediction of an extracellular location, likely triggered
      by the N-terminal hydrophobic segment.
    action: REMOVE
    reason: AHK3 is a polytopic membrane receptor whose CHASE sensor domain faces the ER lumen/apoplast;
      the protein is not secreted into the extracellular region.
    supported_by:
    - reference_id: PMID:21709172
      supporting_text: Cytokinin-binding assays, fluorescent fusion proteins, and biochemical
        fractionation all showed that the large majority of cytokinin receptors are localized
        to the ER, suggesting a central role of this compartment in cytokinin signaling.
