id: Q9C5U1
gene_symbol: AHK3
product_type: PROTEIN
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'AHK3 (ARABIDOPSIS HISTIDINE KINASE 3; ORE12) is one of three CHASE-domain hybrid
  sensor histidine kinases that act as cytokinin receptors in Arabidopsis thaliana. It is
  an integral membrane protein found mainly in the endoplasmic reticulum, with a minor plasma-membrane
  pool; cytokinin binding to its extracytosolic CHASE domain activates histidine autophosphorylation
  and phosphotransfer via its receiver domain to AHP histidine phosphotransfer proteins, which
  deliver the signal to nuclear type-B ARR transcription factors. AHK3 is the dominant receptor
  in leaves: it mediates cytokinin-dependent delay of leaf senescence through phosphorylation
  of ARR2 (a gain-of-function ore12 allele delays senescence), and with AHK2 it controls leaf
  cell number, chlorophyll content, shoot growth and secondary growth. It also contributes
  to repression of phosphate-starvation and iron-uptake genes by cytokinin, to sugar sensitivity,
  and acts as a negative regulator of drought, salt, cold and abscisic-acid responses.'
