id: O04379
gene_symbol: AGO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: AGO1 is the principal Arabidopsis Argonaute effector of miRNA- and siRNA-guided
  post-transcriptional gene silencing. It binds small-RNA guides and complementary target RNAs,
  using its PIWI domain to cleave targets and also participating in translational repression. AGO1
  acts in cytoplasmic and ER-associated silencing complexes and can enter nuclear and cytoplasmic
  condensate-associated pools. It participates in secondary-siRNA production and antiviral RNA
  interference, while its regulation of endogenous transcripts controls leaf and meristem
  development, auxin responses and immunity.
