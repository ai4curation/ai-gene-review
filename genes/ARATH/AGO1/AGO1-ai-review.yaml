proposed_new_terms: []
suggested_questions:
- question: How do AGO1 target cleavage, translational repression and secondary-siRNA production
    partition between ER-associated and siRNA-body pools?
- question: Which viral contexts allow AGO1 to restrict infection despite viral suppressors, given
    the distinction between CMV and suppressor-competent PVX?
- question: Can the source-specific AGO1 RNA-binding and localization experiments in PMID:35137215,
    PMID:16998468, PMID:17442570 and the proteomics source tables be made available for direct
    inspection?
suggested_experiments:
- experiment_type: AGO1 compartment-specific activity measurements
  hypothesis: AGO1 condensate recruitment alters spatial organization more strongly than its
    immediate catalytic activity.
  description: Measure guide loading, cleavage and translation of defined targets in matched
    cytosolic, ER-associated and heat-induced condensate fractions, with localization and
    fraction-purity controls.
- experiment_type: AGO1 guide and target reconstitution
  hypothesis: Guide and target configuration distinguishes direct cleavage from SGS3-dependent
    ribosome stalling and secondary-siRNA initiation.
  description: Compare defined AGO1-guide-target complexes in cleavage and translation assays with
    and without SGS3, separating target slicing from effects on secondary-siRNA production.
