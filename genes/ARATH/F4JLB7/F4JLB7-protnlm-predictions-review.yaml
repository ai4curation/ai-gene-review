id: F4JLB7
gene_symbol: F4JLB7
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
status: COMPLETE
description: >-
  F4JLB7 is a 450-residue LRR-containing receptor-like protein without a protein kinase domain. Kinase
  activity is incompatible with this architecture, while participation in phosphorylation remains unresolved.
