      label: phosphorylation
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The OpenScientist investigation integrates LRR domain architecture, catalytic-motif analysis,
        and predicted structure to argue against intrinsic protein kinase activity. Those findings do
        not exclude participation in phosphorylation through an associated kinase or signaling complex.
        The cached IBA signaling receptor annotation is compatible with such a role, but does not establish
        it. No target-specific pathway evidence establishes or excludes participation in phosphorylation,
        so this biological-process prediction remains uncertain.
