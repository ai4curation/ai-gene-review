id: F4JLB7
gene_symbol: F4JLB7
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
status: COMPLETE
description: >-
  F4JLB7 (At4g28560) is a 450-residue noncatalytic leucine-rich-repeat receptor-like protein with
  an N-terminal signal peptide, an extracellular LRR solenoid and a C-terminal hydrophobic anchor. In
  the PANTHER PTHR48004 tree it is sister to the TMM/RLP29 clade, and PAINT assigns the family
  signaling receptor activity at the plasma membrane. It has no protein kinase domain, so the ProtNLM2
  kinase activity prediction is rejected. Participation in phosphorylation through a partner receptor
  kinase is neither established nor excluded, and no publication reports experiments on this locus.
source_documents:
  - genes/ARATH/F4JLB7/F4JLB7-uniprot.txt
  - genes/ARATH/F4JLB7/F4JLB7-goa.tsv
  - genes/ARATH/F4JLB7/F4JLB7-ai-review.yaml
  - genes/ARATH/F4JLB7/F4JLB7-bioinformatics/RESULTS-rereview.md
  - genes/ARATH/F4JLB7/F4JLB7-hypotheses/prediction-kinase-activity/openscientist.md
  - interpro/panther/PTHR48004/PTHR48004-review.yaml
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0016310
      label: phosphorylation
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        No GOA annotation on F4JLB7 covers phosphorylation, so the prediction would be novel. The
        protein lacks a protein kinase domain (OpenScientist domain and motif analysis), so it cannot
        phosphorylate a substrate itself. A noncatalytic LRR receptor-like protein could still take
        part in phosphorylation-based signaling with a partner receptor kinase, as its sister-clade
        paralog TMM does with ERECTA-family kinases, but that relative is in a different subfamily and
        its specific functions are not transferable. The gene review accepts only broad signaling
        receptor activity and signal transduction, with no known ligand, partner or pathway. A PubMed
        search for At4g28560 returns no experimental papers. Nothing on the target establishes or
        excludes a role in phosphorylation, so the prediction remains uncertain.
      supported_by:
        - reference_id: file:ARATH/F4JLB7/F4JLB7-hypotheses/prediction-kinase-activity/openscientist.md
          supporting_text: >-
            no protein-kinase Pfam (PF00069) and no InterPro protein-kinase domain is present anywhere
            in the sequence.
        - reference_id: file:ARATH/F4JLB7/F4JLB7-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            The nearest experimentally characterised relative is therefore TMM, a paralog in a different
            subfamily.
        - reference_id: file:ARATH/F4JLB7/F4JLB7-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            TMM-specific functions (EPF-peptide recognition with ERECTA-family receptors in
            stomatal patterning) are not transferable to F4JLB7 on this basis.
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0016301
      label: kinase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      confidence_score: 0
      summary: >-
        Kinase activity is refuted by the protein's architecture. The 450-residue sequence carries only
        LRR signatures (InterPro IPR001611, IPR032675; Pfam LRR_1, LRR_8), a signal peptide and a
        C-terminal hydrophobic anchor with essentially no cytoplasmic tail, leaving no room for a
        cytoplasmic kinase domain. The OpenScientist analysis finds no protein-kinase Pfam or InterPro
        domain and no ordered catalytic motifs; the isolated DFG-like tripeptide lies within the LRR
        solenoid. This is a computational assessment, not a biochemical assay. The re-reviewed gene
        review treats F4JLB7 as a noncatalytic cell-surface receptor-like protein, and neither GOA nor
        the PAINT node for PTHR48004 assigns any kinase activity. The prediction is NPI.
      supported_by:
        - reference_id: file:ARATH/F4JLB7/F4JLB7-hypotheses/prediction-kinase-activity/openscientist.md
          supporting_text: >-
            Second, a **direct motif scan** of the sequence recovered 9 canonical LRR cores but found
            no ordered kinase catalytic triad; the isolated "DFG" (position 149, inside PEDFGSV) and a
            "GNGFHG" hit (position 186) are coincidental tripeptides embedded within the LRR solenoid,
            not part of a folded catalytic cleft.
        - reference_id: file:ARATH/F4JLB7/F4JLB7-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            F4JLB7, like TMM, ends in a hydrophobic segment with essentially no cytoplasmic tail.
        - reference_id: file:ARATH/F4JLB7/F4JLB7-uniprot.txt
          supporting_text: DR   InterPro; IPR001611; Leu-rich_rpt.
        - reference_id: file:ARATH/F4JLB7/F4JLB7-uniprot.txt
          supporting_text: DR   Pfam; PF13855; LRR_8; 1.
references:
  - id: file:ARATH/F4JLB7/F4JLB7-hypotheses/prediction-kinase-activity/openscientist.md
    title: 'OpenScientist investigation: F4JLB7 kinase activity'
    reference_review:
      relevance: HIGH
      review_notes: >-
        Substantive computational synthesis directly addressing the kinase prediction. Domain assignments
        agree with the cached UniProt cross-references. Motif and structural findings contribute to the
        combined case against protein kinase activity; motif absence alone is insufficient to exclude all
        kinase mechanisms. The artifacts contain the final report without executed analysis code. Its
        rejection of phosphorylation exceeds the evidence against intrinsic catalysis, and its proposed
        frequency-bias mechanism is a hypothesis, not an established cause of the prediction.
  - id: file:ARATH/F4JLB7/F4JLB7-bioinformatics/RESULTS-rereview.md
    title: F4JLB7 re-review analyses (PANTHER placement, C-terminal anchor, CRIB scan)
    reference_review:
      relevance: HIGH
      review_notes: >-
        Reproducible gene-review analysis placing F4JLB7 in PTHR48004 sister to TMM/RLP29 and showing a
        C-terminal hydrophobic anchor with no cytoplasmic tail. Independent of ProtNLM2.
  - id: file:ARATH/F4JLB7/F4JLB7-uniprot.txt
    title: F4JLB7-uniprot.txt
