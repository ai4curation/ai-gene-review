      label: signaling receptor activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    review:
      summary: >-
        PAINT propagated signaling receptor activity from CLV2 at the PTHR48004 root node. F4JLB7 has the
        noncatalytic extracellular-LRR receptor-like architecture shared by CLV2 and TMM.
      action: ACCEPT
      reason: >-
        Accept the curated node placement. The PAINT curator put this broad MF at the family root, not
        only on the CLV2 clade, and F4JLB7 descends from that node. Nothing specific to the target argues
        for loss: the LRR solenoid is intact and the protein is anchored at the cell surface. The curator
        did not propagate CLV2- or TMM-specific terms such as coreceptor activity, CLE or EPF peptide
        recognition, or stomatal and meristem processes, and this review treats that omission as
        deliberate. F4JLB7 is in its own subfamily (SF38), not in SF42 with TMM or SF9 with CLV2. The term
        is kept at this general level, and the ligand and partner kinases are unresolved.
      supported_by:
        - reference_id: file:ARATH/F4JLB7/F4JLB7-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            The nearest experimentally characterised relative is therefore TMM, a paralog in a different
            subfamily.
