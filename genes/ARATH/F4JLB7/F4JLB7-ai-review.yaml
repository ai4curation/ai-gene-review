suggested_questions:
  - question: >-
      Published RIC7 primers match AT4G28556/Q1G3K8 rather than AT4G28560/F4JLB7. At which stage of
      source curation or AGI-to-UniProt export were the three PMID:11752391 experimental annotations
      associated with F4JLB7, and what source-level correction preserves the original assay provenance?
