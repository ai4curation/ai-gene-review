  - term:
      id: GO:0038023
      label: signaling receptor activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    review:
      summary: >-
        The signaling-receptor IBA agrees with the target LRR receptor-like architecture; F4JLB7 is not
        established as an intracellular CRIB-domain effector.
      action: ACCEPT
      reason: >-
        Retain the curated phylogenetic inference. Absence of an intrinsic kinase domain does not contradict
        a noncatalytic signaling receptor, and the deposited sequence supplies no evidence of a switch
        to CRIB-mediated ROP binding. The precise ligand and pathway remain unresolved.
      supported_by: *id001
