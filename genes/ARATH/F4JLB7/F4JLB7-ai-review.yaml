    qualifier: is_active_in
    review:
      summary: >-
        The curated plasma-membrane IBA is consistent with the signal peptide, LRR domain architecture,
        and hydrophobic C terminus of the deposited F4JLB7 sequence.
      action: ACCEPT
      reason: >-
        Retain the PAINT localization inference. The target architecture supports membrane association,
        and there is no target-specific contrary evidence. The RIC7 guard-cell literature is not required
        to support this IBA.
