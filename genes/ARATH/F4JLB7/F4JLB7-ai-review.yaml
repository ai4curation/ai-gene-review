      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:11752391
    qualifier: enables
    review:
      summary: >-
        The experimental annotation cites the RIC-family study PMID:11752391. The deposited F4JLB7 sequence
        is an LRR protein and does not have the CRIB-domain architecture studied for RIC effectors.
      action: UNDECIDED
      reason: >-
        The mapping between the paper's RIC7 construct and the current At4g28560/F4JLB7 sequence needs
        resolution. Preserve the curator-supplied annotation and evidence metadata, but do not use the
        name match to assert a target-specific ROP interaction, pollen phenotype, or apical localization.
        The available abstract does not resolve the construct identity.
