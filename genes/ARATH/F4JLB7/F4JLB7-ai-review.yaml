  - term:
      id: GO:0009507
      label: chloroplast
    evidence_type: ISM
    original_reference_id: GO_REF:0000122
    qualifier: located_in
    review:
      summary: >-
        The chloroplast assignment is a computational AtSubP prediction. It conflicts with the N-terminal
        signal peptide (residues 1-22), the extracellular-type LRR region, the hydrophobic C terminus and the
        curated plasma-membrane IBA of the deposited F4JLB7 sequence.
      action: REMOVE
      reason: >-
        This is an unreviewed electronic localization prediction, and it is contradicted by the protein's own
        architecture. An N-terminal signal peptide directs proteins into the secretory pathway, not to
        plastids, and the LRR receptor-like organization matches the plasma-membrane localization accepted
        from the PAINT IBA in this review. No experiment places F4JLB7 in chloroplasts. The RIC7 localization
        literature concerns the adjacent CRIB locus AT4G28556 and cannot be used for this protein in either
        direction. Removing an electronic prediction that is contradicted on sequence grounds follows the
        project's guidance for IEA/ISM inferences.
      supported_by: *id001
  - term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:11752391
    qualifier: enables
    review:
      summary: >-
        The published RIC7 cloning primers in PMID:11752391 match the adjacent AT4G28556 CRIB gene,
        supporting probable wrong-gene attribution of ROP binding to F4JLB7.
      action: REMOVE
      reason: >-
        This experimental row was assigned to the wrong gene product. A reproducible sequence analysis maps
        all published RIC7 cloning and RT-PCR primers from this study (and two later RIC7 studies) to the
        adjacent, oppositely oriented locus AT4G28556, which encodes the 216-residue CRIB protein Q1G3K8.
        None of the primers matches the AT4G28560 transcript that encodes F4JLB7. Both loci carry the TAIR
        symbol RIC7, which explains the attribution.
        The paper's ROP-binding assay concerns a CRIB-motif protein, and the CRIB motif is required for
        binding GTP-bound Rop1. F4JLB7 has no CRIB motif, only LRRs and a signal peptide, so it cannot be the
        ROP effector assayed. The interaction partner in the GOA row (AT3G51300, ROP1) fits the CRIB protein
        Q1G3K8.
        This removal rests on positive sequence evidence about which locus was assayed, not on the
        abstract's gene focus. The function itself is not disputed and belongs on Q1G3K8.
      supported_by:
        - reference_id: file:ARATH/Q1G3K8/Q1G3K8-bioinformatics/RESULTS.md
          supporting_text: >-
            None of the six primers has an exact
            3′ match of 14 or more bases in the AT4G28560 transcript NM_118998.1.
        - reference_id: file:ARATH/Q1G3K8/Q1G3K8-bioinformatics/RESULTS.md
          supporting_text: >-
            The comparison strongly assigns these experimental targets to the CRIB locus.
        - reference_id: PMID:11752391
          supporting_text: >-
            contain a CRIB (for Cdc42/Rac-interactive
            binding) motif required for their specific interaction with GTP-bound Rop1.
      additional_reference_ids:
        - file:projects/PROTNLM_EVALUATION/F4JLB7-RIC7-locus-identity.md
      source_defects:
      - defect_type: WRONG_GENE_PRODUCT
        resource: TAIR
        asserted_value: UniProtKB:F4JLB7
        corrected_value: UniProtKB:Q1G3K8
        corrected_label: RIC7 CRIB-motif protein encoded by AT4G28556
        cause: SYMBOL_COLLISION
        confidence: PROBABLE
        explanation: >-
          This PMID:11752391 (Wu et al. 2001, RIC7) annotation is attached to
          F4JLB7 (AT4G28560), an LRR protein without a CRIB motif. The paper's RIC7
          is a CRIB-motif ROP effector. All published RIC7 cloning and RT-PCR
          primers from this and two later RIC7 studies map to the adjacent,
          oppositely oriented locus AT4G28556 (UniProtKB:Q1G3K8) and to none of the
          AT4G28560 transcript. Both loci carry the TAIR symbol RIC7. Please move
          the annotation to AT4G28556 / Q1G3K8.
        supported_by:
        - reference_id: file:ARATH/Q1G3K8/Q1G3K8-bioinformatics/RESULTS.md
          supporting_text: >-
            None of the six primers has an exact
            3′ match of 14 or more bases in the AT4G28560 transcript NM_118998.1.
        - reference_id: PMID:11752391
          supporting_text: >-
