id: F4JLB7
gene_symbol: RIC7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  F4JLB7 is a 450-residue leucine-rich-repeat receptor-like protein (RLP) encoded by the Arabidopsis
  thaliana At4g28560 locus. It has an N-terminal signal peptide, an extracellular LRR solenoid, and a
  C-terminal hydrophobic segment with almost no cytoplasmic tail. That segment could be a single-pass
  anchor or a GPI-attachment signal. The protein has no protein kinase domain and no CRIB motif. In the
  PANTHER PTHR48004 tree it is sister to the clade containing TOO MANY MOUTHS (TMM) and RLP29, within a
  family of noncatalytic cell-surface LRR receptor-like proteins that includes CLAVATA2. Like its
  relatives it is expected at the plasma membrane and to act in receptor-mediated signaling, but its
  ligand, receptor-kinase partners and biological role are unknown. Despite sharing the TAIR symbol RIC7,
  it is not the CRIB-motif ROP effector RIC7, which is encoded by the adjacent locus At4g28556.
