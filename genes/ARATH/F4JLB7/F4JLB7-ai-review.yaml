    review:
      summary: >-
        PAINT places plasma-membrane localization at the root node of PTHR48004 (PTN008274137), with
        CLV2, TMM, PII-2 and AT4G28560 as seeds. F4JLB7 is inside that family, and its signal peptide,
        extracellular LRR region and C-terminal hydrophobic anchor fit a cell-surface protein.
      action: ACCEPT
      reason: >-
        Accept the phylogenetic inference. F4JLB7 sits within the family clade that inherited the term
        (PANTHER 19.0 places it sister to TMM/RLP29), and its own architecture is that of a
        secretory-pathway, cell-surface LRR protein. One of the four seeds is AT4G28560 itself. That seed
        may come from the apical-plasma-membrane IDA from PMID:11752391, which this review removes as a
        wrong-gene attribution. The node is still well grounded by the CLV2, TMM and PII-2 seeds, so the
        IBA does not depend on the disputed row.
