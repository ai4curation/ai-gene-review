core_functions:
  - description: >-
      Noncatalytic cell-surface LRR receptor-like protein. It is predicted, from PAINT inference at the
      PTHR48004 family root and from its signal peptide, extracellular LRR solenoid and C-terminal anchor,
      to act as a signaling receptor at the plasma membrane. Its ligand, partner receptor kinases and
      biological process are unknown. It lies in its own subfamily, sister to the TMM/RLP29 clade.
    molecular_function:
      id: GO:0038023
      label: signaling receptor activity
    locations:
      - id: GO:0005886
        label: plasma membrane
    supported_by: *id001
suggested_questions:
  - question: >-
      Published RIC7 primers match AT4G28556/Q1G3K8 rather than AT4G28560/F4JLB7. At which stage of
      source curation or AGI-to-UniProt export were the three PMID:11752391 experimental annotations
      associated with F4JLB7, and what source-level correction preserves the original assay provenance?
    experts:
      - TAIR curators
  - question: >-
      Is the C-terminal hydrophobic segment of F4JLB7 (residues ~431-450, with no cytoplasmic tail) a
      transmembrane anchor or a GPI-attachment signal? Was At4g28560 among the four receptor-like proteins
      recovered from PI-PLC-sensitive fractions by Borner et al. (2003)?
    experts:
      - TAIR curators
      - plant GPI-anchored protein researchers
  - question: >-
      Should the UniProt SubName "ROP-interactive CRIB motif-containing protein 7" and the RIC7 gene name on
      F4JLB7 be revised? F4JLB7 has no CRIB motif and the CRIB-motif RIC7 is encoded by At4g28556 (Q1G3K8).
    experts:
      - UniProt curators
      - TAIR curators
suggested_experiments:
  - description: >-
      Express a fluorescent-protein fusion of F4JLB7 placed after the signal peptide in Arabidopsis. Test
      plasma-membrane localization, and test release by phosphatidylinositol-specific phospholipase C to
      distinguish GPI anchoring from a transmembrane anchor.
    experiment_type: subcellular localization and PI-PLC sensitivity assay
  - description: >-
      Use co-immunoprecipitation or proximity labelling to look for receptor-kinase partners of F4JLB7.
      Test LRR-RLKs that partner TMM and CLV2 (ERECTA family, CORYNE/CRN). Phenotype at4g28560 loss-of-function
      lines for stomatal patterning and meristem traits, where its paralogs act.
    experiment_type: protein interaction and genetic analysis
