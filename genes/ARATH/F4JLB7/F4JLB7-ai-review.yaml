      id: GO:0009507
      label: chloroplast
    evidence_type: ISM
    original_reference_id: GO_REF:0000122
    qualifier: located_in
    review:
      summary: >-
        The chloroplast assignment is a computational AtSubP inference, whereas the SignalP feature and
        LRR receptor-like architecture suggest secretory-pathway targeting.
      action: UNDECIDED
      reason: >-
        The conflicting targeting predictions do not establish chloroplast localization or conclusively
        exclude it. Direct localization of the deposited F4JLB7 product is needed; RIC7 localization findings
        cannot be transferred solely by the shared database name.
      supported_by: *id001
  - term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:11752391
    qualifier: enables
    review:
      summary: >-
        The published RIC7 cloning primers in PMID:11752391 match the adjacent AT4G28556 CRIB gene,
        supporting probable wrong-gene attribution of ROP binding to F4JLB7.
      action: UNDECIDED
      reason: >-
        The sequence analysis maps both Wu RIC7 primers to AT4G28556 and finds no qualifying matches
        in AT4G28560. The locus-identity report therefore recommends correction of the experimental
        gene-product association. Retain UNDECIDED pending reconciliation of the source AGI-to-UniProt
        mapping and physical clone provenance; the primer evidence strongly favors the CRIB locus.
        This experiment should not support the LRR protein's core function through its shared RIC7 name.
      supported_by:
