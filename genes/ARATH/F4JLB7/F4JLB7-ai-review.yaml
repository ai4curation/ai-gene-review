        Membrane association is consistent with the target signal peptide, hydrophobic C terminus, and
        curated plasma-membrane IBA.
      action: KEEP_AS_NON_CORE
      reason: >-
        The broad membrane term is compatible with the sequence but less informative than the existing
        plasma-membrane annotation. Specific GPI anchoring and the correspondence of constructs in the
        cited literature to the deposited sequence are not established here.
      supported_by: *id001
