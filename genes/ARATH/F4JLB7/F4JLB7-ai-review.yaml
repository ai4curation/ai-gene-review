id: F4JLB7
gene_symbol: RIC7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  F4JLB7 is a 450-residue leucine-rich-repeat protein encoded at the Arabidopsis thaliana At4g28560 locus.
  Its N-terminal signal peptide, LRR-rich region, and hydrophobic C-terminal sequence are consistent with
  a membrane-associated receptor-like protein. The domain architecture supports a noncatalytic cell-surface
  signaling role, without a protein kinase domain. Its ligand specificity and downstream signaling partners
  remain unresolved.
existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: is_active_in
    review:
      summary: >-
        The curated plasma-membrane IBA is consistent with the signal peptide, LRR domain architecture,
        and hydrophobic C terminus of the deposited F4JLB7 sequence.
      action: ACCEPT
      reason: >-
        Retain the PAINT localization inference. The target architecture supports membrane association,
        and there is no target-specific contrary evidence. The RIC7 guard-cell literature is not required
        to support this IBA.
      supported_by: &id001
        - reference_id: file:ARATH/F4JLB7/F4JLB7-uniprot.txt
          supporting_text: |-
            DR   InterPro; IPR001611; Leu-rich_rpt.
            DR   InterPro; IPR032675; LRR_dom_sf.
            ...
            FT   SIGNAL          1..22
            FT                   /evidence="ECO:0000256|SAM:SignalP"
            ...
                 GRALYSSARK VLPLIYFPAT LLALYISITQ
  - term:
      id: GO:0038023
      label: signaling receptor activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    review:
      summary: >-
        The signaling-receptor IBA agrees with the target LRR receptor-like architecture; F4JLB7 is not
        established as an intracellular CRIB-domain effector.
      action: ACCEPT
      reason: >-
        Retain the curated phylogenetic inference. Absence of an intrinsic kinase domain does not contradict
        a noncatalytic signaling receptor, and the deposited sequence supplies no evidence of a switch
        to CRIB-mediated ROP binding. The precise ligand and pathway remain unresolved.
      supported_by: *id001
