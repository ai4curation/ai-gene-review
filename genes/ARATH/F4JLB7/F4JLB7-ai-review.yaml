    evidence_type: ISM
    original_reference_id: GO_REF:0000122
    qualifier: located_in
    review:
      summary: >-
        The chloroplast assignment is a computational AtSubP prediction. It conflicts with the N-terminal
        signal peptide (residues 1-22), the extracellular-type LRR region, the hydrophobic C terminus and the
        curated plasma-membrane IBA of the deposited F4JLB7 sequence.
      action: REMOVE
      reason: >-
        This is an unreviewed electronic localization prediction, and it is contradicted by the protein's own
        architecture. An N-terminal signal peptide directs proteins into the secretory pathway, not to
        plastids, and the LRR receptor-like organization matches the plasma-membrane localization accepted
        from the PAINT IBA in this review. No experiment places F4JLB7 in chloroplasts. The RIC7 localization
        literature concerns the adjacent CRIB locus AT4G28556 and cannot be used for this protein in either
        direction. Removing an electronic prediction that is contradicted on sequence grounds follows the
        project's guidance for IEA/ISM inferences.
