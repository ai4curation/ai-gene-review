suggested_questions:
  - question: >-
      F4JLB7 carries the submitted name RIC7 but has a signal peptide and LRR domains. The OpenScientist
      investigation identifies a neighboring CRIB-domain RIC7 locus; experimental annotation transfer
      and any gene-model reconciliation require the actual construct sequences and annotation provenance.
      How do the At4g28560/F4JLB7 LRR sequence, the adjacent At4g28556 CRIB-domain RIC7 product, and the
      RIC7 constructs used in PMID:11752391 map to one another?
    experts:
      - TAIR curators
