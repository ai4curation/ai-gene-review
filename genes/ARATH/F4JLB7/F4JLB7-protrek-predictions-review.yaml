  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1902288
      label: regulation of defense response to oomycetes
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Top-ranked hit (score 15.66). RIC7 is a ROP effector acting in guard-cell stomatal
        signalling; no role in oomycete defense is reported for it or for any characterised
        RIC family member. The prediction comes from the LRR repeats, which dominate the
        plant NLR/RLP immune-receptor entries in SwissProt, and ignores the CRIB motif that
        actually defines the family. Ranks 1-3 and 5 are four graded variants of the same
        oomycete-response concept, so the model's entire top-5 commits to one wrong theme.
      supported_by:
        - reference_id: PMID:11752391
          supporting_text: >-
            we have identified 11 Arabidopsis genes encoding novel proteins, termed RICs (for
            Rop-interactive CRIB motif-containing proteins), that contain a CRIB (for Cdc42/Rac-interactive
            binding) motif required for their specific interaction with GTP-bound Rop1
