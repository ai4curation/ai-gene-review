id: F4JLB7
gene_symbol: RIC7
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Arabidopsis RIC7 (At4g28560), a ROP-GTPase
  effector carrying a CRIB motif and leucine-rich repeats. All three top-ranked GO
  sentences are oomycete defense-response terms, and the free-text Function hits are
  CLV3-perceiving LRR receptor kinases. Both channels are reading the leucine-rich
  repeats and landing in the plant LRR immune-receptor/receptor-kinase neighbourhood,
  which is where LRR density is highest in SwissProt. RIC7's actual biology - binding
  activated ROP2 through the CRIB motif and inhibiting the exocyst subunit Exo70B1 to
  restrain stomatal opening - is nowhere in the retrieved set. This is the same
  multidomain-leakage failure ProtNLM2 shows on this protein (it predicted kinase
  activity from an LRRK2 phmmer hit), reached by a different route and with a different
  wrong answer.
  Assessment: 0 correct (COR/CNN/LSP), 0 uncertain (UNC), 3 incorrect (NPI).
source_documents:
