        same reason. Its presence alongside the opposite-signed term at rank 3 shows the
        retrieval is matching the topic of the sentence rather than a directional claim
        about the protein, so the ranked list carries less information than its length
        suggests.
      supported_by:
        - reference_id: file:ARATH/F4JLB7/F4JLB7-deep-research-falcon.md
          supporting_text: >-
            RIC7 functions downstream of ROP2 and inhibits the positive stomatal-opening factor
            Exo70B1, thereby restraining excess opening
