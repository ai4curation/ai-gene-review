suggested_questions:
- question: Do SOT16, SOT17 and SOT18 act redundantly in planta, and does loss of SOT17 alone shift the
    aliphatic glucosinolate chain-length profile?
- question: Which structural features of SOT17 underlie its increasing activity with longer methylthioalkyl
    side chains?
suggested_experiments:
- description: Generate sot17 single and sot16 sot17 sot18 higher-order CRISPR mutants and profile desulfoglucosinolate
    accumulation and glucosinolate chain-length distribution in roots and leaves.
- description: Solve the crystal structure of SOT17 with PAP and a long-chain desulfoglucosinolate and
    test binding-pocket mutants for chain-length preference.
