taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SOT17 (AtSOT17, AtST5c, At1g18590) is a cytosolic PAPS-dependent sulfotransferase that catalyzes
  the final step of core glucosinolate structure formation, transferring a sulfate group from 3'-phosphoadenosine
  5'-phosphosulfate to the thiohydroximate N-hydroxyl of desulfoglucosinolates to yield glucosinolates
  and adenosine 3',5'-bisphosphate. Together with its paralogs SOT16 (ST5a) and SOT18 (ST5b) it accepts
  a broad range of aromatic, indolic and aliphatic desulfoglucosinolates in vitro, but SOT17 shows increasing
  specific activity with increasing side-chain length of methionine-derived substrates, preferring long-chain
  methylthioalkyl desulfoglucosinolates such as 8-methylthiooctyl. It is expressed mainly in roots, stems
  and mature leaves and is inhibited by the reaction product PAP.
