    label: DNA-binding transcription factor activity
  evidence: ISS
  original_reference: PMID:11118137
  source_entities: []
  negated: false
  action: MODIFY
  reason: PMID:11118137 is a genome-wide regulator classification, not a IAA19-specific 
    DNA-binding/transactivation assay. The specific functional evidence supports repression through 
    ARF association. Refine to transcription corepressor activity. The separately retained 
    promoter-association term does not by itself establish an autonomous DNA-binding 
    transcription-factor activity.
  assessed_support:
  - reference_id: PMID:14729917
    supporting_text: These results suggest that MSG2/IAA19 and NPH4/ARF7 may constitute a negative 
      feedback loop
