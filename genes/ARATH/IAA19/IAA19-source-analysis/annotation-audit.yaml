    label: protein binding
  evidence: IPI
  original_reference: PMID:17675404
  source_entities:
  - UniProtKB:Q9SN12
  negated: false
  action: REMOVE
  reason: 'PMID:17675404 is the MYB77 pull-down study: IAA19 binding was detected in vitro but not in
    four BiFC experiments. This row identifies UniProtKB:Q9SN12. The measured interaction is not declared
    false. Bare GO:0005515 does not specify the regulatory function, so it is removed under the repository
    protein-binding exception. A physical interaction alone does not establish an endogenous obligatory
    complex, a partner-specific physiological output, or a new biological process. Pair provenance remains
    in this reason and the unchanged source fields. Specifically, PMID:17675404 reports MYB77–IAA19 binding
    in vitro but fails to detect it in four BiFC experiments; native functional coupling of this pair
    remains unresolved, rather than disproved.'
  assessed_support:
  - reference_id: PMID:17675404
    supporting_text: In vitro MYB77 also binds to IAA19
