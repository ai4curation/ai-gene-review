core_functions:
- description: IAA19 represses ARF-dependent auxin transcriptional output. Gene-specific ARF7 binding,
    msg2 dominant-repressor phenotypes and ARF7-dependent IAA19 induction support the negative-feedback
    mechanism; the corepressor assignment is a functional synthesis, not a claim that IAA19 directly recognizes
