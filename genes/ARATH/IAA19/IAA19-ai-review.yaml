id: O24409
gene_symbol: IAA19
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: IAA19 (MASSUGU2/MSG2; At3g15540) is an Arabidopsis Aux/IAA transcriptional repressor that
  interacts with ARF transcription factors, especially ARF7/NPH4. Its conserved repression region, domain-II
  degron and C-terminal PB1 interaction region couple auxin-regulated stability to transcriptional control.
  Dominant domain-II msg2 alleles impair hypocotyl gravitropism and phototropism, apical-hook maintenance,
  lateral-root formation and stamen-filament growth. ARF7 contributes to auxin induction of IAA19 expression,
  creating a contextual negative-feedback circuit. IAA19–ARF7 fusion-pair fluorescence is nuclear; biochemical
  interaction with MYB77 has not been confirmed by the reported BiFC tests.
