  review:
    action: KEEP_AS_NON_CORE
    summary: IAA19 regulates stamen-filament growth kinetics in Arabidopsis.
    reason: The dominant msg2-1 mutant has a reduced transient filament-growth increase and inefficient
      pollination. PMID:19719484 measures filament growth and expression and attributes the defect to
      altered cell elongation. Preserve this native developmental role while distinguishing a stabilized
      repressor phenotype from loss of the gene and from a direct cell-wall catalytic function.
