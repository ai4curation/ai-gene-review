gene_symbol: HPR
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  HPR (HPR1, At1g68010) encodes the peroxisomal NADH-dependent hydroxypyruvate reductase (glycerate
  dehydrogenase, EC 1.1.1.29), a member of the D-isomer specific 2-hydroxyacid dehydrogenase family.
  It reduces hydroxypyruvate, formed by serine:glyoxylate aminotransferase, to D-glycerate in the
  photorespiratory C2 cycle, oxidizing NADH supplied to the peroxisome by the malate shuttle. HPR1
  carries a C-terminal microbody targeting signal and is found only in leaf peroxisomes. It is
  among the most abundant leaf peroxisomal matrix proteins and is expressed mainly in
  photosynthetic tissues, where it is induced by light. Knockout of HPR1 removes about 95% of
  leaf NADH-dependent hydroxypyruvate reductase activity. Growth defects in air are only mild,
  because cytosolic HPR2 and plastidic HPR3 provide bypass reactions, but hpr1 hpr2 double mutants
  are strongly air-sensitive. In germinating seeds lacking peroxisomal malate dehydrogenase, HPR1
  can also reoxidize peroxisomal NADH to sustain fatty acid beta-oxidation.
