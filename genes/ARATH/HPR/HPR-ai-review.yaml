core_functions:
- description: >-
    Peroxisomal NADH-dependent hydroxypyruvate reductase of the photorespiratory C2 cycle, reducing
    hydroxypyruvate (from serine:glyoxylate transamination) to D-glycerate; the dominant HPR in leaves,
    backed up by cytosolic HPR2 and plastidic HPR3.
