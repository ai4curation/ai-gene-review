  - reference_id: PMID:18952776
    supporting_text: showing that HPR1 plays the dominant role in photorespiration
suggested_questions:
- question: >-
    Does HPR1 have a physiologically relevant NADPH- or NADH-dependent glyoxylate reductase activity,
    as implied by its family placement, or is it specific for hydroxypyruvate in vivo?
- question: >-
    Under which light and temperature conditions does flux through the cytosolic HPR2 bypass become
    significant relative to peroxisomal HPR1?
suggested_experiments:
- description: >-
    Determine full steady-state kinetics of purified recombinant HPR1 with hydroxypyruvate and glyoxylate
    using NADH and NADPH, and test whether hpr1 leaves accumulate glyoxylate or glycolate under high
    photorespiratory flux.
