id: Q9SSE9
gene_symbol: JMJ25
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  JMJ25, better known as IBM1 (INCREASE IN BONSAI METHYLATION 1), is a nuclear JmjC-domain
  histone demethylase of the JHDM2/KDM3-like clade. It is an Fe(II)/2-oxoglutarate-dependent
  dioxygenase that removes di- and mono-methyl groups from histone H3 lysine 9 (H3K9me2/me1),
  with no activity on H3K9me3 or on H3K4, H3K27 or H3K36 methylation. IBM1 associates with the
  bodies of transcribed genes and keeps them free of H3K9me2; in its absence the KYP/SUVH4-CMT3
  feedback loop that normally silences transposons spreads into thousands of genes, causing
  ectopic H3K9me2 and CHG DNA methylation and gene silencing. Targets include RDR2 and DCL3
  (so IBM1 indirectly influences RNA-directed DNA methylation) and the ERECTA-family receptor
  genes that restrain stomatal lineage divisions. Loss of IBM1 causes pleiotropic, progressive
  developmental defects (narrow leaves, abnormal flowers, defective pollen, reduced fertility)
  that are suppressed by kyp or cmt3 mutations. IBM1 expression itself depends on DNA methylation
  of a large heterochromatic intron and on factors (EDM2, IBM2/ASI1/SG1) that promote production
  of the long, functional transcript.
