core_functions:
- description: Nuclear Fe(II)/2-oxoglutarate-dependent JmjC histone demethylase that removes di-
    and mono-methyl groups from H3K9 on the bodies of transcribed genes, preventing KYP/CMT3-dependent
    ectopic H3K9me2 and CHG DNA methylation and thereby keeping thousands of genes (including RDR2,
    DCL3 and the ERECTA-family receptor genes) in an active epigenetic state.
  molecular_function:
    id: GO:0140683
    label: histone H3K9me/H3K9me2 demethylase activity
