suggested_questions:
- question: How is IBM1 targeted to transcribed gene bodies - through recognition of transcription-coupled
    histone marks, association with elongating Pol II, or reading of H3K9me2 itself?
- question: Do the degenerate RING and B-box zinc-finger regions of IBM1 contribute to chromatin targeting
    or protein interactions, given that they lack an intact zinc-binding consensus?
- question: Does the UniProt statement that IBM1 contributes to transposable-element silencing (citing
    PMID:41036628) reflect IBM1 data, or the GyrB3/HDA6 findings of that paper?
suggested_experiments:
- description: In vitro demethylation assays with purified full-length IBM1 on nucleosomes carrying
    H3K9me1/2/3 to confirm specificity and test whether nucleosomal context or DNA is required, which
    would also address whether IBM1 binds DNA directly.
  experiment_type: biochemical assay
- description: Proximity labelling or IP-mass spectrometry of complementing tagged IBM1 to identify
    partners that recruit it to transcribed genes (e.g. elongation factors, histone readers).
  experiment_type: proteomics
