gene_symbol: RDR2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: RNA-DEPENDENT RNA POLYMERASE 2 is a nuclear RdRP-family RNA-templated RNA polymerase of
  Arabidopsis that physically associates with DNA-dependent RNA polymerase IV (Pol IV). Pol IV transcribes
  short single-stranded RNAs at heterochromatic loci (transposons and repeats); upon Pol IV arrest and
  backtracking the transcript 3' end is channelled to the RDR2 active site, and RDR2 synthesizes the
  complementary strand, generating double-stranded RNA precursors that DCL3 dices into 24-nt siRNAs. These
  siRNAs, loaded into AGO4/AGO6, guide de novo DNA methylation (RNA-directed DNA methylation) and
  transcriptional silencing. RDR2 has a catalytic double-psi beta-barrel core with an Asp triad
  homologous to multisubunit RNA polymerases and an N-terminal ssRNA-binding RRM. It localizes to the
  nucleoplasm and nucleolus. rdr2 mutants lack nearly all 24-nt heterochromatic siRNAs, lose non-CG
  methylation at RdDM targets, fail to receive long-distance mRNA silencing in grafted shoots and are
  more susceptible to necrotrophic fungi.
