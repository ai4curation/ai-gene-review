suggested_questions:
- question: Free recombinant RDR2 transcribes ssRNA (PMID:34903670), yet RDR2 purified from nrpd1 plants
    is inactive on the coupled template (PMID:23142082) and UniProt states RDR2 is non-functional without
    Pol IV. Is the Pol IV dependence a property of template access (requiring Pol IV arrest and backtracking)
    rather than of the enzyme itself?
- question: Does the reported JMJ24-RDR2 association have a molecular consequence (recruitment of RDR2 to
    JMJ24-transcribed loci) that could be captured by a more specific function than protein binding?
