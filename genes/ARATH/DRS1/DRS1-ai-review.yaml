suggested_questions:
- question: Which biochemical partners link DRS1 to ABA-dependent water retention, and is the DWD motif required
    for that function?
- question: Does DRS1 bind DDB1 and assemble into a CUL4-DDB1 ligase in planta, and if so what are its substrates?
- question: Has DRS1 retained the DNA-binding and DNA-damage-response activities of yeast CMR1 and human WDR76,
    or has the plant lineage diverged?
suggested_experiments:
- description: Co-immunoprecipitation or yeast two-hybrid of DRS1 with Arabidopsis DDB1A/B, with and without mutation
    of the DWD motif, and complementation of drs1 with the DWD mutant.
- description: Test drs1-1 and drs1-2 for sensitivity to UV, MMS or replication stress, and measure DNA binding
    of recombinant DRS1 to undamaged and UV-damaged DNA.
- description: Stomatal aperture and conductance measurements in drs1 with and without ABA to locate the transpiration
    defect.
