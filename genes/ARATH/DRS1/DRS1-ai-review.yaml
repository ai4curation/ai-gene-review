- term:
    id: GO:0009414
    label: response to water deprivation
  evidence_type: IMP
  original_reference_id: PMID:20118918
  qualifier: acts_upstream_of_or_within
  review:
    action: ACCEPT
    summary: drs1-1 plants retained about 80% of wild-type water under drought, the defect co-segregated
      with the T-DNA as a single recessive locus, and an independent allele (drs1-2) reproduced it. The
      paper explicitly identifies At1g80710 as DRS1.
    reason: Direct target-specific genetic evidence with two alleles. The gene was chosen from an AraNet
      network prediction, but the annotation rests on the mutant experiments, not the prediction. The
      molecular step DRS1 performs in the response is unknown, which the acts_upstream_of_or_within
      qualifier appropriately reflects. This is the defining physiological role of DRS1.
    supported_by:
    - reference_id: PMID:20118918
      supporting_text: Under drought, mutant plants retained ~80% of the water of wild type
    - reference_id: PMID:20118918
      supporting_text: An independent T-DNA allele (Salk_149366C) that we designate as drs1-2 exhibited
        the same phenotypes in relative water content following drought and ABA-insensitive water transpiration
- term:
    id: GO:0009737
    label: response to abscisic acid
  evidence_type: IMP
  original_reference_id: PMID:20118918
  qualifier: acts_upstream_of_or_within
  review:
    action: ACCEPT
    summary: Detached drs1 leaves were insensitive to the ABA-induced reduction in water loss, confirmed
      in a second allele, whereas ABA inhibition of germination was unaffected.
    reason: Direct two-allele genetic evidence for a defect in one ABA response (leaf transpiration).
      The germination result shows that not all ABA responses depend on DRS1, so this annotation should
      not be expanded to ABA signaling generally or to an ABA receptor or signal-transduction activity.
    supported_by:
    - reference_id: PMID:20118918
      supporting_text: The mutant was insensitive to ABA on water loss whereas the wild type lost significantly
        less water in the presence of 10 μM ABA
    - reference_id: PMID:20118918
      supporting_text: ABA showed no effect on germination rate in the mutant (data not shown), indicating
        that not all ABA-mediated processes are affected in the mutant.
- term:
    id: GO:0080008
    label: Cul4-RING E3 ubiquitin ligase complex
  evidence_type: ISS
  original_reference_id: PMID:18223036
  qualifier: part_of
  supporting_entities:
  - AGI_LocusCode:AT4G15900
  review:
    action: KEEP_AS_NON_CORE
    summary: This ISS rests on DRS1 carrying the DWD (DDB1-binding WD40) motif that Lee et al. (2008)
      used to define candidate CUL4-DDB1 substrate receptors, with PRL1 (AT4G15900), a DWD protein shown
      to bind DDB1, as the comparator. The human ortholog WDR76 (same PANTHER subfamily) has been reported
      to associate with Cul4-DDB1.
    reason: Two consistent lines support the inference, the conserved DWD motif stated for DRS1 in its
      primary paper and the reported Cul4-DDB1 association of the orthologous human WDR76. PRL1 is not
      a DRS1 ortholog (it is in a different WD40 family), so the ISS transfers a motif-defined property,
      not a family function. Lee et al. confirmed DDB1 binding for only 11 Arabidopsis DWD proteins, and
      no DRS1-DDB1 or DRS1-CUL4 experiment exists. Nothing contradicts the inference, so it is retained
      as non-core; the substrate and any link to the drought phenotype are unknown.
    supported_by:
    - reference_id: PMID:20118918
      supporting_text: Drs1 is a WD-40 repeat family protein containing a DWD (DDB1 binding WD40) motif
    - reference_id: PMID:18223036
      supporting_text: We show by yeast two-hybrid and in vivo coimmunoprecipitation that 11 Arabidopsis
        DWD proteins directly interact with DDB1 and thus may serve as substrate receptors for the DDB1–CUL4
        machinery.
    - reference_id: PMID:27248496
      supporting_text: Intriguingly WDR76 was found to associate with the Cul4-DDB1 ubiquitin ligase complex
- term:
    id: GO:2000001
    label: regulation of DNA damage checkpoint
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000381277
  - SGD:S000002315
  review:
    action: KEEP_AS_NON_CORE
    summary: Seeded from yeast Cmr1, whose deletion causes a defect in DNA-damage checkpoint adaptation.
      Human WDR76 is rapidly recruited to sites of laser-induced DNA damage. DRS1 inherits the process
      from the WDR76/CMR1 node (PTHR14773:SF0).
    reason: The PAINT node is grounded in yeast experimental data, and a single seeding organism is not
      weak support for an IBA. DRS1 is in the same ortholog subfamily with no evidence of divergence;
      the drought/ABA phenotype neither supports nor contradicts a checkpoint role. Retained as non-core
      because no plant DNA-damage or checkpoint assay has been reported for DRS1 and its characterized
      role is physiological.
    supported_by:
    - reference_id: PMID:25817432
      supporting_text: Deletion of CMR1 causes increased chromosome loss and mutation rates, a defect in
        DNA-damage checkpoint adaptation
    - reference_id: PMID:27248496
      supporting_text: Here we report that WDR76 is rapidly and intensely recruited to regions of localized
        DNA damaged induced by UV-laser microirradiation.
