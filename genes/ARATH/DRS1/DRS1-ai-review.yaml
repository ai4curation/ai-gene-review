- term:
    id: GO:0080008
    label: Cul4-RING E3 ubiquitin ligase complex
  evidence_type: ISS
  original_reference_id: PMID:18223036
  qualifier: part_of
  supporting_entities:
  - AGI_LocusCode:AT4G15900
  review:
    action: KEEP_AS_NON_CORE
    summary: DRS1 carries the 16-residue DWD (DDB1-binding WD40) motif that Lee et al. (2008) used to define
      candidate substrate receptors of CUL4-DDB1 E3 ligases. The ISS row is anchored on PRL1 (AT4G15900),
      which that study showed binds DDB1. Independently, the human DRS1 homolog WDR76 has been found
      associated with the Cul4-DDB1 ubiquitin ligase complex.
    reason: The inference rests on two consistent lines of evidence. First, the conserved DWD motif is
      stated explicitly for DRS1 in the primary DRS1 paper. Second, the orthologous human WDR76 associates
      with Cul4-DDB1. Lee et al. confirmed DDB1 binding for only 11 Arabidopsis DWD proteins, and no direct
      DRS1-DDB1 or DRS1-CUL4 experiment exists, so this remains a sequence-based inference. Nothing
      contradicts it, so it is retained. It is non-core because the substrate and any link to the drought
      phenotype are unknown.
    supported_by:
    - *id002
    - reference_id: PMID:18223036
      supporting_text: We show by yeast two-hybrid and in vivo coimmunoprecipitation that 11 Arabidopsis
        DWD proteins directly interact with DDB1 and thus may serve as substrate receptors for the DDB1–CUL4
        machinery.
    - reference_id: PMID:27248496
      supporting_text: Intriguingly WDR76 was found to associate with the Cul4-DDB1 ubiquitin ligase complex
- term:
    id: GO:2000001
    label: regulation of DNA damage checkpoint
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000381277
  - SGD:S000002315
  review:
    action: KEEP_AS_NON_CORE
    summary: The IBA is seeded from yeast CMR1 (SGD:S000002315), which an in-depth study linked to a
      DNA damage checkpoint. Human WDR76 is rapidly recruited to sites of DNA damage. DRS1 inherits this
      process from the WDR76/CMR1 ancestral node, and no Arabidopsis checkpoint assay has been reported.
    reason: The PAINT node is grounded in experimental data from yeast CMR1, and DRS1 sits in the same
      WDR76/CMR1 clade. No target-specific evidence of loss or divergence exists, and the drought/ABA
      phenotype neither supports nor contradicts a DNA-damage-checkpoint role. A single seeding organism is
      not weak support for an IBA. The row is retained but kept as non-core because it has not been tested
      in plants and the characterized DRS1 phenotype is physiological.
    supported_by:
    - reference_id: PMID:27248496
      supporting_text: Recently, an in depth investigation of CMR1/YDL156w revealed links to chromatin,
        localization into foci, a response to replication stress, and involvement in a DNA damage checkpoint
    - reference_id: PMID:27248496
      supporting_text: Here we report that WDR76 is rapidly and intensely recruited to regions of localized
        DNA damaged induced by UV-laser microirradiation.
    - *id001
    - *id003
