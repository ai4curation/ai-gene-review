id: Q9SAI7
gene_symbol: DRS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: DRS1 is an Arabidopsis WDR76/CMR1-related WD40 protein required for normal water retention
  during drought and for the ABA-dependent reduction of leaf water loss. Two independent drs1 insertion
  alleles support this role. Its DWD-containing repeat architecture suggests protein-complex interactions,
  while the biochemical partners linking it to drought physiology and the specificity of any chromatin
  or DNA binding remain unresolved.
