- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000381277
  - SGD:S000002315
  review:
    action: ACCEPT
    summary: The IBA is seeded from yeast Cmr1 (SGD:S000002315), which binds DNA in vitro and accumulates
      on chromatin after UV irradiation. DRS1 sits in the same PTHR14773:SF0 ortholog subfamily, so the
      PAINT placement applies to it.
    reason: DNA binding is the only molecular function the WDR76/CMR1 ancestral node carries, and it is
      consistent with the chromatin association of both yeast and human orthologs. There is no Arabidopsis
      evidence of loss or divergence. The term is kept at the broad level asserted by PAINT; it does not
      imply recognition of UV-damaged DNA or of a particular modified base (such as 5hmC), for which no
      plant evidence exists and genomic 5hmC is barely detectable in Arabidopsis. Accepted as the conserved
      core activity, recognising that it is phylogenetically inferred rather than measured for DRS1.
    supported_by:
    - reference_id: PMID:25817432
      supporting_text: Cmr1 was described as a histone-related protein11, with DNA-binding capacity in
        vitro and with the ability to accumulate on chromatin in response to ultraviolet irradiation
    - reference_id: PMID:25817432
      supporting_text: WDR76 is the closest orthologue of Cmr1 in higher eukaryotes
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
