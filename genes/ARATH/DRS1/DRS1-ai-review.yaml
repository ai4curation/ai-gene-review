id: Q9SAI7
gene_symbol: DRS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: DRS1 (DROUGHT SENSITIVE 1, At1g80710) encodes a 516-residue WD40-repeat protein that is
  the Arabidopsis member of the WDR76/CMR1 subfamily (PANTHER PTHR14773:SF0), the same subfamily as
  human WDR76 and budding-yeast Cmr1. In those orthologs the protein is nuclear and chromatin-associated,
  binds DNA in vitro, relocalizes to nuclear foci under genotoxic stress and is linked to DNA-damage
  checkpoint adaptation; these properties are inherited by DRS1 phylogenetically but have not been tested
  in plants. DRS1 also carries a DWD (DDB1-binding WD40) motif, suggesting that it may act as a substrate
  receptor of CUL4-DDB1 ubiquitin ligases, although no DRS1 partner has been demonstrated. Genetically,
  two independent drs1 T-DNA alleles retain less water under drought and fail to reduce detached-leaf
  water loss in response to ABA, while ABA inhibition of germination is unaffected. The biochemical link
  between the conserved nuclear WD40 activity and this drought/ABA phenotype is unknown.
