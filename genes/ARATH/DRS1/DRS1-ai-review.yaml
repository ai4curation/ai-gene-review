suggested_questions:
- question: Which biochemical partners link DRS1 to ABA-dependent water retention, and is the DWD motif
    required for that function?
- question: Does DRS1, like yeast Cmr1 and human WDR76, bind DNA and relocalize to nuclear foci under
    genotoxic or proteotoxic stress, and is this conserved activity connected to the drought phenotype?
suggested_experiments:
- description: Native-promoter DRS1-fluorescent protein fusion that complements drs1-1, imaged in roots
    and guard cells with and without genotoxic stress (MMS, UV) or proteasome inhibition, to test nuclear
    localization and stress-induced focus formation.
- description: Affinity purification-mass spectrometry or yeast two-hybrid of DRS1 with DDB1A/DDB1B,
    and complementation of drs1 with a DWD-motif mutant, to test whether DRS1 acts as a CUL4-DDB1 substrate
    receptor in drought responses.
