- id: PMID:25817432
  title: Cmr1/WDR76 defines a nuclear genotoxic stress body linking genome integrity and protein quality
    control.
  findings:
  - statement: Yeast Cmr1 is a nuclear WD40 protein with in vitro DNA-binding capacity whose deletion
      impairs DNA-damage checkpoint adaptation; human WDR76 is its ortholog and is chromatin-associated.
    supporting_text: Deletion of CMR1 causes increased chromosome loss and mutation rates, a defect in
      DNA-damage checkpoint adaptation
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Added in the full re-review. Primary yeast/human ortholog study grounding the DNA binding,
      nucleus and checkpoint IBAs seeded from SGD:S000002315 and Q9H967.
- id: PMID:25380728
  title: 5-hydroxymethylcytosine is not present in appreciable quantities in Arabidopsis DNA.
  findings:
  - statement: Sensitive assays constrain the amount of genomic 5hmC in the Arabidopsis tissues and genotypes
      tested, arguing against an assumed abundant canonical 5hmC signaling system.
    supporting_text: 'Enzymatic radiolabeling and mass spectrometry, the most

      sensitive methods for detection that we used, failed to detect

      5-hydroxymethylcytosine in A. thaliana genomic DNA'
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Context for not refining DNA binding to a 5hmC-reader activity in Arabidopsis; does
      not test DRS1 itself.
