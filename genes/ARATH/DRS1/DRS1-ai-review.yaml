  supporting_entities:
  - PANTHER:PTN000381277
  - SGD:S000002315
  - UniProtKB:Q9H967
  review:
    action: ACCEPT
    summary: Nuclear localization is experimentally established for both seeding orthologs, yeast Cmr1
      and human WDR76, and the PAINT node places it at the WDR76/CMR1 ancestor from which DRS1 descends.
    reason: Two experimentally characterized orthologs from different eukaryotic supergroups (opisthokont
      fungi and animals) are nuclear, which supports placement of this localization at the ancestral node;
      DRS1 has no evidence of divergence. The deep-research report's statement that localization is unknown
      reflects the absence of a plant-specific experiment, not evidence against the inference.
    supported_by:
