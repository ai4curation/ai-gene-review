- id: PMID:20118918
  title: Rational association of genes with traits using a genome-scale gene network for Arabidopsis thaliana.
  findings:
  - statement: Two independent Arabidopsis drs1 alleles have deficient water retention and ABA-insensitive
      transpiration, establishing the target-specific phenotype.
    supporting_text: An independent T-DNA allele (Salk_149366C) that we designate as drs1-2 exhibited
      the same phenotypes in relative water content following drought and ABA-insensitive water transpiration
  - statement: The target mutation affects ABA-dependent leaf water loss; this does not establish an ABA
      receptor or a universal effect on all ABA responses.
    supporting_text: The mutant was insensitive to ABA on water loss whereas the wild type lost significantly
      less water in the presence of 10 μM ABA
  - statement: The primary DRS1 study identifies a DWD motif but presents DDB1-CUL4 substrate-receptor
      function as a family-based hypothesis rather than a demonstrated DRS1 complex.
    supporting_text: Drs1 is a WD-40 repeat family protein containing a DWD (DDB1 binding WD40) motif
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary and only target-specific report; re-checked against the cached full text (DRS1
      section explicitly names At1g80710 and both SALK alleles).
