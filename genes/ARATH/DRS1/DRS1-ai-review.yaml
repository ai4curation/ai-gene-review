  label: Arabidopsis thaliana
description: DRS1 (DROUGHT SENSITIVE 1, At1g80710) is a 516-residue nuclear WD40-repeat protein of the WDR76/CMR1
  family (PANTHER PTHR14773:SF0), the plant member of a lineage that includes yeast CMR1 and human WDR76. Loss-of-function
  drs1 mutants retain less water under drought and fail to reduce leaf transpiration in response to abscisic acid,
  while ABA-dependent germination is unaffected. By descent from the WDR76/CMR1 ancestor DRS1 is inferred to be
  a nuclear, chromatin-associated DNA-binding protein; its WD40 repeats carry a DWD (DDB1-binding) motif suggesting
  that it may act as a substrate receptor of a CUL4-DDB1 ubiquitin ligase. Its biochemical partners, any DNA substrate
  preference and the mechanism linking it to drought tolerance have not been determined in plants.
