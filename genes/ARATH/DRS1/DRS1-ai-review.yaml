  - UniProtKB:Q9H967
  review:
    action: KEEP_AS_NON_CORE
    summary: The PAINT node PTN000381277 propagates heterochromatin from human WDR76 (Q9H967), which
      co-localizes with the heterochromatin proteins CBX1 and CBX5. DRS1, human WDR76 and yeast Cmr1
      are all members of PANTHER subfamily PTHR14773:SF0, so DRS1 lies inside the inheriting clade.
    reason: Challenging an IBA requires evidence that the target is outside the clade or has diverged.
      DRS1 is in the same SF0 subfamily as the human donor, and nothing in the Arabidopsis literature
      bears on its subnuclear localization in either direction, so the propagated localization is retained.
      It is non-core because the donor evidence is a co-localization with heterochromatin proteins in
      human cells, a sub-compartment that has not been examined for any plant member, and because the
      characterized DRS1 role is physiological.
    supported_by:
