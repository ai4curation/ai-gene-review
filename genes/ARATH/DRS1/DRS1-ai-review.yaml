- id: PMID:20118918
  title: Rational association of genes with traits using a genome-scale gene network for Arabidopsis thaliana.
  findings:
  - statement: Two independent Arabidopsis drs1 alleles have deficient water retention and ABA-insensitive transpiration,
      establishing the target-specific phenotype.
    supporting_text: An independent T-DNA allele (Salk_149366C) that we designate as drs1-2 exhibited the same phenotypes
      in relative water content following drought and ABA-insensitive water transpiration
  - statement: The target mutation affects ABA-dependent leaf water loss; this does not establish an ABA receptor
      or a universal effect on all ABA responses.
    supporting_text: The mutant was insensitive to ABA on water loss whereas the wild type lost significantly less
      water in the presence of 10 μM ABA
  - statement: The primary DRS1 study identifies a DWD motif but presents DDB1-CUL4 substrate-receptor function
      as a family-based hypothesis rather than a demonstrated DRS1 complex.
    supporting_text: Drs1 is a WD-40 repeat family protein containing a DWD (DDB1 binding WD40) motif
  - statement: ABA-dependent germination is unaffected in drs1, so the ABA defect is restricted to leaf water loss.
    supporting_text: ABA showed no effect on germination rate in the mutant (data not shown), indicating that not
      all ABA-mediated processes
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary DRS1 paper (full text cached); explicitly names At1g80710 as Drs1 and tests two insertion
      alleles.
- id: PMID:27248496
  title: WDR76 Co-Localizes with Heterochromatin Related Proteins and Rapidly Responds to DNA Damage.
  findings:
  - statement: Human WDR76 has chromatin-associated localization and a rapid DNA-damage response; these observations
      define homolog evidence, not an Arabidopsis assay.
    supporting_text: 'WDR76 co-localizes to puncta with the heterochromatin

      proteins CBX1 and CBX5'
  - statement: Yeast CMR1, in the same PANTHER subfamily as DRS1, binds DNA with higher affinity for UV-damaged
      DNA and is recruited to chromatin after UV.
    supporting_text: Additional studies on yeast CMR1/YDL156w have demonstrated that the protein had higher affinity
      for UV-damaged DNA and had increased localization to chromatin upon UV treatment
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human WDR76 study (full text cached); provides the ortholog evidence behind the IBA rows, not
      a plant assay.
- id: PMID:25380728
  title: 5-hydroxymethylcytosine is not present in appreciable quantities in Arabidopsis DNA.
  findings:
  - statement: Sensitive assays constrain the amount of genomic 5hmC in the Arabidopsis tissues and genotypes tested,
      arguing against an assumed abundant canonical 5hmC signaling system.
    supporting_text: 'Enzymatic radiolabeling and mass spectrometry, the most

      sensitive methods for detection that we used, failed to detect

      5-hydroxymethylcytosine in A. thaliana genomic DNA'
  full_text_unavailable: false
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Background constraint arguing against transferring an animal-type 5hmC reader function to Arabidopsis
      DRS1.
