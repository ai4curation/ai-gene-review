  - UniProtKB:Q9H967
  review:
    action: KEEP_AS_NON_CORE
    summary: Human WDR76, a member of the PAINT clade that includes DRS1, co-localizes with the heterochromatin
      proteins CBX1 and CBX5. Its yeast homolog CMR1 is chromatin-associated. The IBA places this localization
      at the WDR76/CMR1 ancestral node, and no Arabidopsis localization experiment contradicts it.
    reason: An IBA reflects a PAINT curator's placement of the function at an ancestral node, so challenging
      it requires evidence that DRS1 lies outside the inheriting clade or has diverged. Neither is available.
      DRS1 is the Arabidopsis WDR76/CMR1-related protein, and its drought/ABA phenotype says nothing about
      subnuclear localization in either direction. The localization is therefore retained. It is non-core
      because the established DRS1 role is physiological (water retention, ABA-dependent reduction of water
      loss) and the heterochromatin association has not been tested in plants.
