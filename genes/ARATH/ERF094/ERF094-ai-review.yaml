core_functions:
- description: Nuclear GCC-box/ERE-binding transcriptional activator that integrates JA and ethylene inputs
    to switch on a subset of defense genes (PDF1.2, HEL, ChiB, AtACT, GLIP1), contributing to resistance
    against necrotrophic fungi such as Botrytis cinerea.
