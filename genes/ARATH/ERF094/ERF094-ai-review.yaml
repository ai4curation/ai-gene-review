  - *id004
suggested_questions:
- question: Which kinase(s) phosphorylate ORA59 in response to JA versus ethylene, and which phosphosites
    switch its preference between GCC-box and ERELEE4 elements?
- question: To what extent are ORA59, ERF1 and AtERF15 redundant for PDF1.2 expression and Botrytis resistance
    in stable knockout combinations?
- question: Does ORA59 interact with JAZ repressors directly, or is its JA dependence entirely transcriptional
    and via EIN3/EIL1?
suggested_experiments:
- description: Genome-wide ChIP-seq/DAP-seq of ORA59 under JA, ACC and JA+ACC treatment to separate direct
    targets from the larger ORA59-dependent transcriptome.
- description: Botrytis infection assays on ora59 erf1 erf15 higher-order CRISPR mutants, including systemic
    resistance assays to test any role in JA/ET-dependent systemic resistance.
