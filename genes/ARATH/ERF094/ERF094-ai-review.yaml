        of JA- and ethylene-responsive genes, including PDF1.2 and HEL
    - reference_id: PMID:18467450
      supporting_text: Induction of the PDF1.2 and HEL genes in response to 8 h of JA treatment was severely
        compromised in those ORA59 -silenced lines with undetectable ORA59 mRNA
