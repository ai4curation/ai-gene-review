- term:
    id: GO:0009861
    label: jasmonic acid and ethylene-dependent systemic resistance
  evidence_type: IMP
  original_reference_id: PMID:18467450
  qualifier: acts_upstream_of_or_within
  review:
    summary: Pre et al. 2008 showed that ORA59 overexpression increases and RNAi silencing decreases resistance
      to Botrytis cinerea in inoculated leaves. The assay measured local resistance; no systemic (ISR-type)
      resistance assay was performed, although ORA59 transcript was induced in distal leaves.
    action: MODIFY
    reason: GO:0009861 describes broad-spectrum systemic resistance (ISR). The IMP evidence is local resistance
      to a necrotrophic fungus, and ORA59 silencing did not affect basal resistance to Alternaria brassicicola,
      so a broad systemic claim is not supported. ORA59 contributes directly by transcribing antifungal
      effector genes (PDF1.2, HEL, ChiB), so defense response to fungus is the appropriate process term.
    proposed_replacement_terms:
    - id: GO:0050832
      label: defense response to fungus
    supported_by:
    - &id008
      reference_id: PMID:18467450
      supporting_text: overexpression of ORA59 caused increased resistance against the fungus Botrytis
        cinerea, whereas ORA59-silenced plants were more susceptible
    - reference_id: PMID:18467450
      supporting_text: 'Mature leaves of soil-grown wild-type plants, JA-insensitive coi1-1 mutant plants,
        and transgenic 35S: ORA59 and RNAi- ORA59 plants at comparable developmental stages were inoculated
        at the same time with B. cinerea'
    - reference_id: PMID:18467450
      supporting_text: the level of basal resistance against A. brassicicola in ORA59 -silenced plants
        did not differ from that of wild-type plants
