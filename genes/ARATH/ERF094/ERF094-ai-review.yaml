gene_symbol: ERF094
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ERF094, better known as ORA59 (OCTADECANOID-RESPONSIVE ARABIDOPSIS AP2/ERF 59), is a nuclear
  group IX AP2/ERF-domain transcription factor that integrates jasmonic acid (JA) and ethylene (ET) signals
  in defense against necrotrophic pathogens. Its single AP2/ERF domain binds GCC-box (GCCGCC) elements
  and, in an ethylene-favoured manner, ERELEE4-type ethylene-responsive elements in target promoters;
  ORA59 activates transcription through an EDLL motif and the Mediator subunit MED25. It is the key activator
  of PLANT DEFENSIN1.2 (PDF1.2), binding two GCC boxes in its promoter, and also activates HEL, basic
  chitinase, GLIP1 and AtACT, the last driving biosynthesis of antimicrobial hydroxycinnamic acid amides.
  ORA59 expression is induced by JA and ET in a COI1- and EIN2-dependent manner, and the protein accumulates
  in the nucleus in response to ethylene, where it interacts with RAP2.3 and EIN3. ORA59 acts downstream
  of COI1 as the terminal regulator of a subset of JA/ET-responsive genes; overexpression confers resistance
  to Botrytis cinerea while silencing increases susceptibility. Salicylic acid antagonizes this branch
  by reducing ORA59 protein levels through EIN3-dependent 26S proteasome degradation.
