  review:
    summary: 'ORA59 is the terminal transcriptional component of the ERF branch of JA signalling: it acts
      downstream of COI1 and is required for JA-induced expression of PDF1.2 and HEL.'
    action: NEW
    reason: 'Participation test: ORA59 performs a step of the pathway (the transcriptional output step)
      rather than being a target of it; ORA59 overexpression activates PDF1.2/HEL independently of COI1,
      and RNAi abolishes JA-induced expression. This parallels the existing ethylene-activated signaling
      pathway annotation and the treatment of MYC2 as the effector of the MYC branch.'
    supported_by:
