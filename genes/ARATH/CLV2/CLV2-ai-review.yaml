id: O80809
gene_symbol: CLV2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: CLAVATA2 (CLV2) is a single-pass type I transmembrane receptor-like protein (AtRLP10) with
  an extracellular leucine-rich repeat domain and a short cytoplasmic tail that lacks a kinase domain.
  CLV2 forms a heteromeric receptor complex with the membrane pseudokinase CORYNE (CRN); the two proteins
  associate through their transmembrane/juxtamembrane regions and require each other for export from the
  endoplasmic reticulum to the plasma membrane. The CLV2/CRN complex perceives CLV3 and other CLE peptides,
  in parallel with and partly in cooperation with the CLV1/BAM receptor kinases and CIK co-receptor kinases,
  to restrict WUSCHEL expression and stem cell number in shoot and floral meristems. Whether CLV2 binds
  CLE peptides directly is contested (radioligand binding versus photoaffinity labelling), so it is best
  viewed as a CLE co-receptor. CLV2/CRN is also needed for responses to many root-active CLE peptides
  in the protophloem and proximal root meristem (including CLE14-triggered root meristem differentiation
  under phosphate starvation), for gynoecium and floral organ development, and for perception of CLE-like
  effectors secreted by cyst nematodes.
existing_annotations:
- term:
    id: GO:0001653
    label: peptide receptor activity
  evidence_type: IMP
  original_reference_id: PMID:28607033
  qualifier: enables
  review:
    summary: 'clv2 and crn mutants are resistant to many root-active CLE peptides, which shows that CLV2
      is required for CLE perception (Hazak et al. 2017). The IMP evidence shows the requirement, but
      not that CLV2 by itself binds the ligand and starts signalling. Direct CLE binding by CLV2 is contested:
      it was reported by radioligand assays and not detected by photoaffinity labelling. CLV2 works with
      CRN and with the CLV1/BAM/CIK receptor kinases.'
    action: MODIFY
    reason: Coreceptor activity (combining with the messenger in cooperation with a nearby primary receptor)
      fits the role of the kinase-less CLV2/CRN complex better than a stand-alone peptide receptor activity.
      It is the best available term, although its definition (combining with the messenger) leans toward
      the radioligand-binding side of the dispute over direct CLE binding.
    proposed_replacement_terms:
    - id: GO:0015026
      label: coreceptor activity
    supported_by:
    - reference_id: PMID:28607033
      supporting_text: the receptor-like protein CLAVATA 2 (CLV2) and the pseudokinase CORYNE (CRN) are
        necessary to fully sense root-active CLE peptides
    - reference_id: PMID:25754504
      supporting_text: In contrast, the CLV2/CRN complex and RPK2 are not involved in direct ligand interactions
        but may act as co-receptors.
    - reference_id: PMID:20626648
      supporting_text: 'Binding was saturable for all receptors with a very similar Kd for each receptor:
        30 nM for CLV1, 32 nM for CLV2, 26 nM for BAM1, and 36 nM for BAM2'
    - reference_id: file:ARATH/CLV2/CLV2-deep-research-falcon.md
      supporting_text: direct binding of CLV3 *or another CLE peptide* by the physiological CLV2–CRN heteromer
        has not been established
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19843317
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9LYU7
  review:
    summary: CLV2 interacts with the pseudokinase CRN through the transmembrane and juxtamembrane regions.
      The interaction is shown by luciferase complementation and co-IP, and by co-IP in stable Arabidopsis
      lines. It forms the CLV2/CRN receptor complex needed for ER export of both proteins.
    action: MODIFY
    reason: Generic protein binding is uninformative. CRN is a receptor-like (pseudo)kinase, and the CLV2-CRN
      association is a receptor-complex interaction.
    proposed_replacement_terms:
    - id: GO:0005102
      label: signaling receptor binding
    supported_by:
    - reference_id: PMID:19843317
      supporting_text: CLV2 can directly interact with CRN in the absence of CLV3
    - reference_id: PMID:20626648
      supporting_text: Transgenic Arabidopsis plants stably expressing CLV2-MYC and CRN-GFP were used
        to assess interactions in vivo. Here we also observed robust co-IP between the two proteins
    - reference_id: PMID:19933383
      supporting_text: CRN readily forms homomers and interacts with CLV2 through the transmembrane domain
        and adjacent juxtamembrane sequences.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20626648
  qualifier: enables
  supporting_entities:
  - UniProtKB:O04547
  review:
    summary: CLV2 shows saturable radioligand binding of the CLV3 CLE peptide (Kd about 32 nM) and competition
      by several other CLE peptides in membrane fractions and immunoprecipitates (Guo et al. 2010). This
      is a ligand-binding interaction with a CLE peptide, not generic protein binding. Direct binding
      was not reproduced by photoaffinity labelling (Shinohara and Matsubayashi 2015), so the claim is
      contested.
    action: MODIFY
    reason: The curator's evidence is saturable, competable radioligand binding of CLE peptides by CLV2
      (Kd about 32 nM), which is a ligand-binding measurement, so peptide hormone binding is the specific
      term for what was assayed; generic protein binding is uninformative. The replacement records the
      reported interaction only. Because photoaffinity labelling did not detect it (see summary), it
      is not used as a core function, which is coreceptor activity.
    proposed_replacement_terms:
    - id: GO:0017046
      label: peptide hormone binding
    supported_by:
    - reference_id: PMID:20626648
      supporting_text: 'Binding was saturable for all receptors with a very similar Kd for each receptor:
        30 nM for CLV1, 32 nM for CLV2, 26 nM for BAM1, and 36 nM for BAM2'
    - reference_id: PMID:20626648
      supporting_text: CLV1 and CLV2 displayed similar binding affinities for a number of CLEs, including
        CLE1, CLE5, CLE18, CLE22, CLE26, CLE41 and CLE42
