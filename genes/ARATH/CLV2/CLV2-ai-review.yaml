- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IDA
  original_reference_id: PMID:21051944
  qualifier: located_in
  review:
    summary: CLV2 is detected in the endoplasmic reticulum, especially when CRN is absent or limiting,
      because the CLV2/CRN complex must form before it can leave the ER. The ER is a transit compartment,
      not the site of signalling.
    action: KEEP_AS_NON_CORE
    reason: The localization is real, but it is a biosynthetic and quality-control location rather than
      the functional one.
    supported_by:
    - reference_id: PMID:19933383
      supporting_text: We found that CLV2 and CRN require each other for export from the endoplasmic reticulum
        and localization to the plasma membrane (PM).
    - reference_id: PMID:21051944
      supporting_text: CLV2 shows greater co-localization with an endoplasmic reticulum (ER) marker.
