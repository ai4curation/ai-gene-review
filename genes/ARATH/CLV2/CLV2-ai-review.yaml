core_functions:
- description: Kinase-less LRR receptor-like protein that, as an obligate heteromer with the pseudokinase
    CRN at the plasma membrane, acts as a co-receptor for CLV3 and other CLE peptides. It cooperates with
    CLV1/BAM receptor kinases and CIK co-receptor kinases to restrict WUS expression and stem cell number
    in the shoot meristem, and mediates responses to root-active CLE peptides.
  molecular_function:
    id: GO:0015026
    label: coreceptor activity
  directly_involved_in:
  - id: GO:0010075
    label: regulation of meristem growth
  - id: GO:0007166
    label: cell surface receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:18381924
    supporting_text: We show here that the novel receptor kinase CORYNE (CRN) and CLV2 act together, and
      in parallel with CLV1, to perceive the CLV3 signal.
  - reference_id: PMID:25754504
    supporting_text: In contrast, the CLV2/CRN complex and RPK2 are not involved in direct ligand interactions
      but may act as co-receptors.
  - reference_id: PMID:29581511
    supporting_text: CIKs function as co-receptors of CLV1, CLV2/CRN and RPK2 to mediate CLV3 signalling
      through phosphorylation.
  - reference_id: PMID:20626648
    supporting_text: 'Binding was saturable for all receptors with a very similar Kd for each receptor:
      30 nM for CLV1, 32 nM for CLV2, 26 nM for BAM1, and 36 nM for BAM2'
  - reference_id: PMID:19933383
    supporting_text: We found that CLV2 and CRN require each other for export from the endoplasmic reticulum
      and localization to the plasma membrane (PM).
  - reference_id: PMID:21705761
    supporting_text: The CLAVATA1 (CLV1), CLV2, and CORYNE (CRN) receptors in Arabidopsis thaliana maintain
      cell proliferation in shoot apical meristems by restricting expression of the transcription factor
      WUSCHEL (WUS).
suggested_questions:
- question: Does CLV2 bind CLV3 and other CLE peptides directly? Radioligand binding (Guo et al. 2010)
    and photoaffinity labelling with arabinosylated CLV3 (Shinohara and Matsubayashi 2015) give conflicting
    answers. Could binding depend on CRN, on CLV1/BAM, or on ligand arabinosylation?
- question: 'How does the kinase-less CLV2/CRN complex relay signal: through CIK co-receptor kinases,
    through association with CLV1/BAM complexes, or through the CRN pseudokinase domain acting as an allosteric
    scaffold?'
suggested_experiments:
- description: Purify CLV2 ectodomain alone and the CLV2/CRN ectodomain-transmembrane complex, and measure
    binding of arabinosylated and non-arabinosylated CLV3 by ITC/GCI, with CLV1 and BAM1 ectodomains as
    positive controls.
  hypothesis: CLV2 binds CLE peptides with low affinity on its own and needs a partner receptor for high-affinity
    binding.
  experiment_type: biophysical binding assay
