suggested_questions:
- question: Does ZFP7 act as a transcriptional repressor through its C-terminal LxLxL
    (LTLRL) EAR-like motif, and does it recruit TOPLESS-type co-repressors?
- question: Which of the many eY1H promoter interactions of ZFP7 occur in planta, and
    what DNA sequence does its QALGGH finger recognise?
- question: Is the ABA-insensitivity caused by ZFP7 overexpression a physiological role,
    given that ZFP7 silencing alone has little phenotype? Does a zfp7 zfp4 or higher-order
    zfp mutant show ABA hypersensitivity?
- question: The PANTHER family assignment of ZFP7 differs between UniProt's HMM
    cross-reference (PTHR47593:SF8) and the PANTHER 19 tree (PTHR45730:SF104). Which is
    correct, and which proteins inherit the PTN008158895 ABA annotation?
suggested_experiments:
- description: Test ZFP7 in a protoplast GAL4-DBD/LUC reporter assay with and without the
    C-terminal LTLRL motif.
  hypothesis: ZFP7 represses transcription through its EAR-like motif.
  experiment_type: transcription factor activity assay
- description: ChIP-qPCR or DAP-seq of ZFP7 to test in planta binding at eY1H target
    promoters and to define its binding motif.
  hypothesis: ZFP7 binds a subset of its eY1H target promoters in planta.
  experiment_type: chromatin immunoprecipitation
- description: Germination assays on ABA with zfp7 CRISPR mutants combined with zfp3 and
    zfp4 mutants.
  hypothesis: ZFP7 contributes redundantly to limiting ABA sensitivity at germination.
  experiment_type: loss-of-function genetics
