    summary: >-
      Estradiol-inducible overexpression of ZFP7 confers ABA insensitivity to seed
      germination, as for ZFP1, ZFP3, ZFP4 and ZFP6.
    action: ACCEPT
    reason: >-
      Gain-of-function evidence for ZFP7. Loss-of-function evidence for the role is from
