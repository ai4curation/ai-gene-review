- term:
    id: GO:0019760
    label: glucosinolate metabolic process
  evidence_type: IMP
  original_reference_id: PMID:25352272
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      From a high-throughput validation of eY1H hits, in which TF mutants were profiled
      for aliphatic glucosinolate accumulation; ZFP7 bound four glucosinolate-pathway
      promoters in the same study.
    action: KEEP_AS_NON_CORE
    reason: >-
      The curator recorded a mutant glucosinolate phenotype with acts_upstream_of_or_within,
      which is appropriate: the effect is conditional on tissue and environment, and ZFP7
      does not catalyse any glucosinolate step. Plausible as a regulatory role of a
      promoter-binding TF, but peripheral and screen-level.
    supported_by:
    - reference_id: PMID:25352272
      supporting_text: These glucosinolate phenotypes were conditional upon the environment
        and tissue type, suggesting that these TFs may allow the plant to tune its defenses
        to the local environment.
