gene_symbol: ZFP7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  ZFP7 (At1g24625) is a 209-residue plant protein with a single C2H2 zinc finger of
  the plant Q-type (QALGGH) class, belonging to the C1-1i group of single-finger zinc
  finger proteins that includes ZFP1-ZFP8, KNUCKLES and GIS-like factors. It is a
  predicted nuclear sequence-specific DNA-binding transcription factor. A C-terminal
  LxLxL EAR-like motif suggests repressor activity, but this has not been tested.
  In yeast one-hybrid screens ZFP7 binds the promoters of many Arabidopsis genes,
  including vascular, secondary cell wall, glucosinolate and nitrogen-metabolism
  genes. Inducible overexpression of ZFP7, like that of its paralogs ZFP1, ZFP3, ZFP4
  and ZFP6, makes seed germination insensitive to abscisic acid (ABA), so ZFP7 is
  considered a negative regulator of ABA signalling during germination and early
  seedling development. Loss-of-function evidence for this role comes from the
  paralogs (zfp3 zfp4 double mutant), not from ZFP7; silencing ZFP7 alone or with ZFP4
  has little effect on vegetative growth. ZFP7 overexpression changes fewer genes
  than ZFP3 overexpression and does not repress the cell-wall and root-hair genes
  that ZFP3 represses. It interacts with TCP13 and bZIP1 in yeast two-hybrid assays.
