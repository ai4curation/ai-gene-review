  knowledge_gaps:
  - gap_statement: >-
      The substrate and reaction of At4g38370, and of PANTHER family PTHR47821
      as a whole, are unknown; no member of the family has been assayed.
    boundary: >-
      Membership of histidine phosphatase superfamily branch 1 and retention of
      its catalytic histidine/glutamate/histidine apparatus are established by
      sequence. Characterised branch-1 enzymes in other PANTHER families act on
      different substrates (cofactor-dependent phosphoglycerate mutases,
      fructose-2,6-bisphosphatases, broad-specificity phosphatases), so the fold
      does not identify a substrate.
    gap_kind:
    - BIOLOGY
    provenance:
    - reference_id: file:ARATH/AT4G38370/AT4G38370-deep-research-falcon.md
      supporting_text: Exact searches for AT4G38370 and Q0WW53 found no gene-specific biochemical study.
  - gap_statement: >-
      The subcellular location of the At4g38370 protein is unknown; the only
      assignment (nucleus) is a classifier prediction and the sequence has no
      targeting signal.
    gap_kind:
    - BIOLOGY
    provenance:
    - reference_id: file:ARATH/AT4G38370/AT4G38370-deep-research-falcon.md
      supporting_text: No gene-specific fluorescent-protein imaging, immunolocalization, organellar proteomics,
        or biochemical fractionation evidence was identified.
suggested_questions:
- question: Which phosphomonoester substrates, if any, are turned over by purified At4g38370 protein?
- question: >-
    Is the PTHR47821 lineage a phosphatase (hydrolase) or a cofactor-dependent
    mutase, and is its substrate conserved between the plant, algal, fungal and
    bacterial members?
- question: >-
    F4JTN4 and Q0WW53 are identical-sequence UniProt entries for the same locus;
    should UniProt merge them so that TAIR annotation and cDNA evidence sit on a
    single entry?
suggested_experiments:
- hypothesis: >-
    At4g38370 is an active histidine-dependent phosphatase or mutase whose
    activity depends on His17.
  description: >-
    Express recombinant protein and an H17A mutant; screen a phosphometabolite
    panel (2,3-bisphosphoglycerate, 2-/3-phosphoglycerate with and without
    2,3-BPG cofactor, sugar phosphates and bisphosphates, phosphoserine,
    glycerol phosphates, nucleotides, p-nitrophenyl phosphate) across a pH
    range, measuring phosphate release and products by LC-MS, and compare wild
    type and mutant kinetics.
  experiment_type: in vitro enzyme activity screen with catalytic mutant
- hypothesis: The protein is nucleocytosolic rather than targeted to an organelle or secreted.
  description: >-
    Native-promoter fluorescent-protein fusions (N- and C-terminal) in stable
    Arabidopsis lines, imaged with nuclear, plastid and mitochondrial markers,
    complemented by subcellular fractionation and immunoblotting.
  experiment_type: subcellular localization
- hypothesis: The physiological substrate of At4g38370 accumulates in loss-of-function plants.
  description: >-
    Targeted and untargeted phosphometabolite profiling of independent null
    alleles versus wild type, with complementation by the wild type and the
    H17A allele.
  experiment_type: metabolomics of loss-of-function mutants
