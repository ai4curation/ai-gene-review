    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      TAIR root-level ND annotation recording that no molecular function of
      At4g38370 has been determined experimentally.
    action: ACCEPT
    reason: >-
      Literature searches (falcon report for the same locus, and PubMed/Europe
      PMC for At4g38370, Q0WW53 and F4JTN4 on 2026-10-21) found no biochemical
      study of this protein or of any PTHR47821 member. Sequence analysis
      predicts histidine-dependent phosphotransfer catalysis from retained
      branch-1 catalytic residues, but the substrate and reaction class are
      unknown, so no experimentally grounded or specific molecular function can
      replace the ND statement. The ND row remains an accurate statement of the
      experimental record.
    supported_by:
