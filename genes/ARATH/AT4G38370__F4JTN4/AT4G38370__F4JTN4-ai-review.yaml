- term:
    id: GO:0005634
    label: nucleus
  evidence_type: ISM
  original_reference_id: GO_REF:0000122
  qualifier: located_in
  review:
    summary: >-
      Nuclear location predicted by the AtSubP sequence-based classifier; no
      experimental localisation exists for this protein.
    action: UNDECIDED
    reason: >-
      The only basis for this row is a single machine-learning localisation
      prediction. The protein has no classical monopartite or bipartite NLS and
      no signal peptide or hydrophobic N-terminal targeting region, so the
      sequence offers no positive signal for active nuclear import. A ~25 kDa
      soluble protein could still enter the nucleus passively, and nothing
      contradicts the prediction, so it is neither supported nor refuted. No
      fluorescent-protein, fractionation or organellar proteomics evidence was
      found. Without experimental localisation, the row is left undecided rather
      than accepted or removed.
