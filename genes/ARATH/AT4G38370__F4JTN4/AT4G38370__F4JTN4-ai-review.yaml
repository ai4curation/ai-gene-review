id: F4JTN4
gene_symbol: AT4G38370
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  At4g38370 encodes a 225-residue protein consisting of a single histidine
  phosphatase superfamily branch-1 domain (the phosphoglycerate-mutase-like
  fold, Pfam PF00300, CDD HP_PGM_like). It belongs to PANTHER family PTHR47821,
  a lineage of land plants, green and other algae, diatoms, choanoflagellates,
  fungi and some bacteria in which no member has been characterised
  experimentally. The protein retains the catalytic apparatus of the fold: the
  RHG-motif histidine (His17) that forms the phosphohistidine intermediate, the
  glutamate proton donor/acceptor (Glu109) and a C-terminal histidine (His173)
  aligned with the transition-state stabiliser of characterised branch-1
  enzymes, so it is probably an active histidine-dependent phosphotransfer
  enzyme (a phosphomonoesterase or a mutase). Its substrate, reaction type,
  subcellular location and biological role have not been determined
  experimentally. It has no signal peptide or classical nuclear localisation
  signal, and the protein has been detected in large-scale proteomics.
