core_functions:
- description: >-
    Predicted histidine-dependent phosphotransfer catalysis by a histidine
    phosphatase superfamily branch-1 domain. The catalytic residues of the fold
    are retained (RHG-motif His17 nucleophile, Glu109 proton donor/acceptor,
    His173 aligned with the transition-state stabiliser), but the substrate and
    whether the reaction is a hydrolysis or a mutase-type transfer are unknown.
    This is a sequence-based inference only; no activity has been measured for
    this protein or any PTHR47821 member, so no GO molecular function more
    specific than catalytic activity is justified and none is asserted.
  supported_by:
