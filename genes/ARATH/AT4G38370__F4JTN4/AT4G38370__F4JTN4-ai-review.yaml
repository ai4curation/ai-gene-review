- id: file:ARATH/AT4G38370/AT4G38370-bioinformatics/RESULTS-rereview.md
  title: Re-review entry identity and catalytic-residue mapping for AT4G38370
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analysis made for the identical-sequence entry Q0WW53 of the same locus,
      so it applies residue-for-residue to F4JTN4. Maps the curated active sites
      of human PGAM1, E. coli GpmA and human TIGAR (all in other PANTHER
      families) onto His17, Glu109 and His173 by local alignment; fold-level
      evidence for retained catalytic residues, not for a substrate.
