id: Q84JP1
gene_symbol: NFYA7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: NFYA7 (At1g30500) is one of ten Arabidopsis NF-YA (HAP2/CBF-B) subunits of
  the heterotrimeric Nuclear Factor Y transcription factor. As an NF-YA protein it carries
  a subunit-association domain that docks onto the NF-YB/NF-YC histone-fold dimer and a
  conserved segment that recognizes the CCAAT box, so it confers CCAAT sequence specificity
  to the NF-Y trimer in the nucleus but cannot bind DNA alone. NFYA7 lacks the miR169 target
  site present in most NF-YA transcripts, and its expression rises under phosphate and
  nitrogen limitation and high sucrose. Constitutive overexpression produces dwarf,
  late-senescing, starch-accumulating plants with improved tolerance to several abiotic
  stresses, attributed to growth restraint rather than direct activation of stress genes.
  Its physiological targets and loss-of-function phenotype are not known.
