- id: PMID:23118940
  title: Functional and transcriptome analysis reveals an acclimatization strategy for
    abiotic stress tolerance mediated by Arabidopsis NF-YA family members.
  findings:
  - statement: NF-YA7 transcripts increase under low phosphate, low nitrogen and high
      sucrose, and NF-YA7 lacks a miR169 target site.
    supporting_text: An increase in NF-YA2, NF-YA7 and NF-YA10 transcript levels was
      detected 4 days after germination (dag) in low P, low N and high Suc treatments
  - statement: Overexpression of NF-YA7 causes dwarfism, delayed senescence and enhanced
      abiotic stress tolerance, attributed to growth arrest.
    supporting_text: Overexpression of NF-YA2, 7 and 10 resulted in dwarf late-senescent
      plants with enhanced tolerance to several types of abiotic stress.
  - statement: Stress tolerance appears only after growth arrest, not directly upon NF-YA
      induction.
    supporting_text: stress tolerance is not observed upon NF-YA induction but rather
      at later stages when growth arrest is observed
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3485258). The only NFYA7-specific experimental study
      found; gain-of-function only, with pleiotropic growth phenotypes.
