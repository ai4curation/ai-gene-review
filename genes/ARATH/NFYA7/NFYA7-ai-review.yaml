core_functions:
- description: CCAAT-box sequence-specificity subunit of the nuclear NF-Y heterotrimer.
    NFYA7 docks on the NF-YB/NF-YC histone-fold dimer through its subunit-association
    domain and contributes the CCAAT-recognition segment, so it contributes to, but cannot
    alone provide, the RNA polymerase II-specific DNA-binding transcription factor activity
    of NF-Y.
  contributes_to_molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *uni_family
  - *uni_subunit
  - *nfya_spec
  - *trimer_needed
suggested_questions:
- question: Which NF-YB/NF-YC partners does NFYA7 assemble with in vivo, and which promoters
    does the NFYA7-containing trimer occupy under phosphate or nitrogen limitation?
- question: Should NF-YA family members carry contributes_to rather than enables for DNA-binding
    transcription factor activity, given that NF-YA binds DNA only within the NF-Y trimer?
- question: Is the repression of non-CCAAT genes in NF-YA overexpressors due to NF-YA
    sequestering NF-YB/YC from other partners (for example the LEC1/L1L-bZIP67 module),
    and does this occur at physiological NFYA7 levels?
suggested_experiments:
- description: ChIP-seq of tagged NFYA7 expressed from its native promoter under low phosphate
    and low nitrogen, combined with RNA-seq of nf-ya7 single and higher-order nf-ya mutants,
    to define direct targets and a loss-of-function phenotype.
  experiment_type: ChIP-seq / RNA-seq
- description: EMSA with recombinant NFYA7 plus candidate NF-YB/NF-YC dimers, and with
    a CCAAT-mutated probe, to establish trimer-dependent CCAAT binding by NFYA7.
  experiment_type: EMSA
