id: Q9C6B8
gene_symbol: PIN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: PIN1 (PIN-FORMED 1, AtPIN1) is a plasma-membrane-localized, polytopic (ten-transmembrane)
  secondary transporter of the auxin efflux carrier (PIN/AEC, TC 2.A.69.1) family that mediates cellular
  efflux of the phytohormone auxin (indole-3-acetic acid and related indolic auxins). The transmembrane
  domain adopts a NhaA fold composed of two inverted five-helix repeats, with an intracellular substrate-binding
  pocket that coordinates IAA, and PIN1 assembles as a homodimer. Auxin efflux activity is enhanced by
  AGC-kinase (e.g. D6PK) phosphorylation and competitively inhibited by the synthetic inhibitor N-1-naphthylphthalamic
  acid (NPA). The defining feature of PIN1 is its polar (apical or basal) localization within the plasma
  membrane, which is established and maintained by reversible phosphorylation of its central hydrophilic
  loop (by PINOID/PID and related AGC kinases, counteracted by PP2A/PP6-type phosphatases) and by GNOM-dependent
  endosomal recycling, together with MAB4/MEL adaptor proteins that limit lateral diffusion. Because the
  orientation of PIN1 in the membrane dictates the direction of intercellular (polar) auxin flow, PIN1
  generates the local auxin gradients and maxima that pattern plant development. It controls vascular
  tissue formation, embryonic apical-basal axis and cotyledon formation, leaf shaping and venation, shoot
  apical meristem organ initiation and phyllotaxis, inflorescence and flower formation, gravitropism and
  photomorphogenic growth. Loss of PIN1 produces naked, pin-shaped inflorescences and broad defects in
  lateral organ number, size, shape and position.
