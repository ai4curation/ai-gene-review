suggested_questions:
- question: >-
    Where within the chloroplast does LCYE act (envelope versus thylakoid membrane), and does
    it function as a monomer or an oligomer? The single-residue ring-number switch and the
    membrane orientation of lycopene suggest subunit interactions may set mono- versus
    bi-cyclization, but no LCYE-specific fractionation, structure, or complex has been reported.
  experts:
  - Francis X. Cunningham Jr.
  - Barry J. Pogson
- question: >-
    Should Arabidopsis LCYE carry a more specific process annotation, alpha-carotene
    biosynthetic process (GO:1901824)? LCYE forms the epsilon ring of alpha-carotene, but that
    term is a descendant of carotenoid biosynthetic process (GO:0016117) which LCYE already
    carries, so it was not proposed here to avoid redundancy; a curator may wish to add the
    more specific term.
  experts:
  - Joseph Hirschberg
suggested_experiments:
- hypothesis: >-
    Arabidopsis LCYE is a strictly mono-epsilon-cyclase that converts all-trans-lycopene to
    delta-carotene using reduced FAD, and Leu-448 alone determines the single-ring outcome.
  description: >-
    Express and purify the mature (transit-peptide-cleaved) His-tagged Arabidopsis LCYE and
    the L448H/L448R variants, reconstitute in liposomes with reduced FAD, and assay against
    all-trans-lycopene (and neurosporene); follow delta-carotene versus epsilon-carotene
    product ratios and determine Km/kcat by C30 reversed-phase HPLC-PDA/MS. Complements the
    prior E. coli color-complementation data with quantitative in vitro kinetics.
  experiment_type: in vitro enzyme assay with purified recombinant protein
- hypothesis: >-
    LCYE resides in a specific plastid membrane subcompartment and channels lycopene toward
    the beta,epsilon branch in coordination with LCYB and the downstream ring hydroxylases.
  description: >-
    Localise a native-promoter LCYE-GFP fusion (complementing lut2) by confocal imaging and by
    immunoblot of purified envelope/stroma/thylakoid fractions, and test physical/functional
    interaction with LCYB and the LUT1/LUT5/CHY hydroxylases by co-immunoprecipitation and by
    carotenoid profiling of the corresponding higher-order mutants.
  experiment_type: subcellular localization plus interaction and metabolite profiling
