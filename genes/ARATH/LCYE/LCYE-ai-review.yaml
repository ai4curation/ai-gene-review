taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  LCYE (lycopene epsilon cyclase, also LUT2/LUTEIN DEFICIENT 2; EC 5.5.1.18) is a
  nuclear-encoded, plastid-targeted, membrane-associated flavoenzyme of the lycopene
  cyclase family that acts at the central branch point of carotenoid biosynthesis. It
  forms a single epsilon ring at one psi-end of all-trans-lycopene, converting the
  symmetrical linear lycopene into the monocyclic delta-carotene (and, correspondingly,
  neurosporene into alpha-zeacarotene). Together with the related lycopene beta cyclase
  (LCYB), which forms beta rings, LCYE commits carotenoid flux into the beta,epsilon
  (alpha-carotene) branch: delta-carotene is beta-cyclized by LCYB to alpha-carotene,
  which is then hydroxylated on both rings to give zeinoxanthin and ultimately lutein,
  the most abundant xanthophyll of the photosynthetic light-harvesting antenna. Unlike
  the bicyclic beta cyclase, plant LCYE normally adds only one ring; a single residue
  (Arabidopsis Leu-448) acts as a molecular switch, and its substitution to His or Arg
  converts the enzyme into a bi-epsilon-cyclase. The mature protein carries an N-terminal
  chloroplast transit peptide and functions as a multi-pass membrane protein of the
  plastid (chloroplast) membrane, where its hydrophobic carotenoid substrates reside.
  Loss of LCYE (the lut2 mutant) abolishes lutein, redirecting flux to beta,beta
  xanthophylls (violaxanthin, antheraxanthin), and impairs the rapid induction of
  nonphotochemical quenching, though single mutants remain viable with near-wild-type
  photosynthesis.
