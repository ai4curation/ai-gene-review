core_functions:
- description: >-
    Lycopene epsilon cyclase activity: forms a single epsilon ring at one psi-end of
    all-trans-lycopene, converting it to the monocyclic delta-carotene (EC 5.5.1.18). This
    commits carotenoid flux into the beta,epsilon (alpha-carotene/lutein) branch, as opposed
    to the beta,beta branch formed by the lycopene beta cyclase. A membrane-associated,
    plastid-localised flavoenzyme; Arabidopsis Leu-448 acts as a molecular switch restricting
    it to a single (mono-) epsilon-cyclization.
  molecular_function:
    id: GO:0045435
    label: lycopene epsilon cyclase activity
