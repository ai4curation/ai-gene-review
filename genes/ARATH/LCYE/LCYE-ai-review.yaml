    supporting_text: 'epsilon-cyclization reaction which converts lycopene to delta-carotene'
  - reference_id: file:ARATH/LCYE/LCYE-uniprot.txt
    supporting_text: 'EC=5.5.1.18'
  - reference_id: PMID:11226339
