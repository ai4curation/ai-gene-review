    in animals, but the best-characterized plant SUN-WIP-WIT2-myosin XI-i bridge engages actomyosin. Should
    GO have a cytoskeleton-neutral LINC complex term (sibling of GO:1990612 Sad1-Kms1 LINC complex) so
    plant SUN-KASH complexes can be annotated to a complex term?
