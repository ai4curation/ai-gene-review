    summary: SUN1 binds the plant KASH-domain protein WIP1 (PMID:22270916).
    action: MODIFY
    reason: Generic protein binding is uninformative. WIP1 is a plant outer-nuclear-membrane KASH protein
      whose C-terminal KASH tail is bound in the perinuclear space by the SUN domain (the conserved KASH-binding
      pocket, H/Y mutations of which abolish binding). This is the SUN side of a plant SUN-KASH bridge
      (SUN-WIP-WIT2-myosin XI-i connecting to the actomyosin cytoskeleton), which is captured by GO:0140444
      cytoskeleton-nuclear membrane anchor activity, the term used for human SUN1/SUN2 KASH-binding rows.
      GO has no KASH-domain-binding MF term.
