core_functions:
- description: 'Inner-nuclear-membrane SUN anchor of plant LINC complexes: the SUN domain of SUN1 binds
    KASH tails of WIP/SINE/TIK proteins in the perinuclear space, retaining them at the outer nuclear
    membrane and, via WIP-WIT2-myosin XI-i, coupling the actin cytoskeleton to the nucleus to determine
    nuclear shape (redundantly with its paralog).'
  molecular_function:
    id: GO:0140444
    label: cytoskeleton-nuclear membrane anchor activity
