taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  SWN (SWINGER; also EZA1, SDG10) is one of three Arabidopsis Enhancer of zeste homologs. It is a SET-domain
  histone H3K27 methyltransferase and catalytic subunit of Polycomb Repressive Complex 2, acting largely
  redundantly with CURLY LEAF in sporophytic Polycomb silencing (clf swn double mutants lose H3K27me3
  and fail to maintain differentiated identity) and with MEDEA in the female gametophyte. During vernalization,
  SWN is the E(z) subunit of the cold-formed PHD-PRC2 (with VRN2, FIE, MSI1 and the VEL proteins VIN3,
  VRN5 and VEL1), which deposits H3K27me3 at the FLC nucleation region. SWN also interacts with HEXOKINASE1
  to repress glucose-responsive genes.
