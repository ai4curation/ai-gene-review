gene_symbol: SE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'SERRATE (SE, At2g27100) is the Arabidopsis member of the conserved ARS2 family of nuclear RNA effector
  proteins. It has a single C2H2 zinc finger flanked by largely disordered N- and C-terminal regions. SE is an essential
  scaffold of the plant microprocessor. It binds the dsRNA-binding protein HYL1 and the RNase III enzyme DCL1, increases
  the rate and accuracy of DCL1 cleavage of primary and precursor miRNAs, and undergoes phase separation that assembles
  nuclear dicing bodies and concentrates DCL1, HYL1 and pri-miRNAs. SE also recruits regulators to pri-miRNAs: the
  phosphatase CPL1 that activates HYL1, the chromatin remodeller CHR2 that restrains processing, and the NEXT complex
  that directs unprocessed transcripts to the nuclear exosome. SE resides mainly in nuclear speckles and the nucleoplasm.
  It also binds the nuclear cap-binding complex and contributes to pre-mRNA splicing and alternative splicing. Loss
  of SE is embryo lethal. Weak alleles reduce miRNA and ta-siRNA levels and cause serrated leaves, altered phase
  change and phyllotaxy, and defects in meristem function and leaf polarity.'
