core_functions:
- description: Phase-separating scaffold of nuclear dicing bodies. SE condensates concentrate DCL1, HYL1 and pri/pre-miRNA
    substrates, which increases the rate and accuracy of DCL1 processing of miRNA precursors.
  molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
  directly_involved_in:
  - *id015
  locations:
  - *id020
  supported_by:
  - *id011
  - reference_id: PMID:33288888
    supporting_text: Disruption of SE phase separation greatly reduces its activity in promoting miRNA processing
      both in vitro and in vivo.
  - *id018
  - *id012
- description: Adaptor of the DCL1-HYL1 microprocessor. It bridges HYL1 and DCL1 and recruits regulators (CPL1 phosphatase,
    CHR2 remodeller, NEXT exosome-targeting complex) to the processing machinery and pri-miRNA substrates, controlling
    both processing and decay of pri-miRNAs.
  molecular_function: *id004
  directly_involved_in:
  - *id015
  locations:
  - *id021
  supported_by:
  - *id005
  - *id014
  - *id022
  - *id008
  - *id017
proposed_new_terms: []
suggested_questions:
- question: How does SE partition between nuclear speckles, where it mostly resides, and dicing bodies, and is the
    partitioning regulated by phosphorylation or by its intrinsically disordered regions?
- question: Does SE bind pri-miRNA directly and with structural specificity, or mainly through HYL1/DCL1 and the
    cap-binding complex?
- question: Which SE functions (miRNA processing, splicing, NEXT-dependent decay) depend on the cap-binding complex,
    as for animal CBC-ARS2?
suggested_experiments:
- hypothesis: SE phase separation and SE adaptor interactions are separable, and both are required for efficient
    processing.
  description: Make SE variants that lose condensate formation but keep HYL1/DCL1 binding, and the reverse. Test
    them in in-vitro processing assays and in se-2 complementation, with D-body imaging and small-RNA sequencing.
  experiment_type: biochemical reconstitution / genetic complementation
- hypothesis: SE recruits NEXT selectively to pri-miRNAs that stall in processing.
  description: Map SE, HEN2 and DCL1 occupancy on pri-miRNAs by RIP-seq or CLIP in wild type and processing-defective
    backgrounds, and relate it to pri-miRNA half-lives.
  experiment_type: RNA-protein interaction profiling
