proposed_new_terms:
- proposed_name: dihydrocamalexate synthase activity
  proposed_definition: 'Catalysis of the reaction: 2-(L-cystein-S-yl)-2-(1H-indol-3-yl)-acetonitrile +
    reduced [NADPH--hemoprotein reductase] + O2 = (R)-dihydrocamalexate + hydrogen cyanide + oxidized
    [NADPH--hemoprotein reductase] + 2 H2O + 2 H+ (RHEA:10452).'
  justification: This is the first of the two experimentally demonstrated CYP71B15 reactions (thiazoline
    ring closure and cyanide release from Cys(IAN)). It is in Rhea and UniProt (EC 1.14.19.52) but GO
    has no term for it, so the PAD3 activity is only half represented.
  supported_by:
  - *id008
suggested_questions:
- question: GO:0010298 dihydrocamalexic acid decarboxylase activity is placed under carboxy-lyase activity
    (GO:0016831), and its definition (dihydrocamalexic acid = camalexin + CO2 + H+) leaves out O2 and
    the reductase. Rhea:34807 and EC 1.14.19.52 describe an O2- and NADPH-hemoprotein-reductase-dependent
    oxidative decarboxylation. Should the term be redefined and moved under oxidoreductase activity (e.g.
    GO:0016705)?
- question: PAD3 catalyses two reactions (Cys(IAN) -> DHCA -> camalexin). Should GO add a dihydrocamalexate
    synthase activity term, or a single overall camalexin synthase activity term matching Rhea:52776?
- question: What is the experimental basis for the ER lumen (GO:0005788) IDA attributed to PMID:33831160,
    a PMID that does not currently resolve? For a type-I ER-anchored P450 the catalytic domain is expected
    on the cytosolic face.
suggested_experiments:
- description: Protease-protection or split-GFP topology assays on ER microsomes from infected leaves,
    to establish which face of the ER the CYP71B15 catalytic domain sits on.
- description: Steady-state kinetics of purified, reconstituted CYP71B15 with NADPH-P450 reductase for
    both Cys(IAN) and DHCA, measuring O2 consumption and cyanide release, to settle the reaction stoichiometry
    and the EC/GO placement.
