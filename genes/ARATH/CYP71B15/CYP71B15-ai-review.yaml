id: Q9LW27
gene_symbol: CYP71B15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: CYP71B15, encoded by the PHYTOALEXIN DEFICIENT 3 (PAD3) locus, is an ER-anchored cytochrome
  P450 (CYP71 family) of Arabidopsis thaliana that catalyses the last two steps in biosynthesis of camalexin,
  the main indole phytoalexin of Arabidopsis. Using O2 and electrons from NADPH-P450 reductase, it first
  closes the thiazoline ring of the cysteine-indole-3-acetonitrile conjugate Cys(IAN), releasing cyanide
  and forming dihydrocamalexic acid (DHCA). It then oxidatively decarboxylates DHCA to camalexin (EC 1.14.19.52).
  PAD3 is expressed at low levels in healthy leaves and is strongly induced at infection sites by fungal
  and bacterial pathogens and elicitors, partly through WRKY33. In infected cells it associates with the
  upstream P450s CYP71A12, CYP71A13 and CYP79B2 in an ER-associated biosynthetic assembly. pad3 mutants
  make no camalexin and are more susceptible to necrotrophic fungi such as Alternaria brassicicola and
  some Botrytis cinerea isolates, but resist Pseudomonas syringae normally.
