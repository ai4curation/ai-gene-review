- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: IDA
  original_reference_id: PMID:33831160
  qualifier: located_in
  review:
    summary: IDA for ER lumen. The cited PMID:33831160 is a deleted PubMed duplicate of PMID:31511315 (Mucha
      et al. 2019, camalexin metabolon); only its abstract is available, so the assay behind this row
      could not be read.
    action: UNDECIDED
    reason: PAD3 is a type-I microsomal P450 with only one predicted transmembrane anchor, at the N terminus
      (residues 1-21). In such proteins the heme catalytic domain faces the cytosol, where it meets NADPH-P450
      reductase. A location in the ER lumen would not fit this topology or the reductase-dependent chemistry.
      The deep research also notes that active-site orientation was not shown directly. The resolved
      source points the same way. The metabolon paper places PAD3 in a complex with CYP71A13 (which
      binds P450 reductase ATR1) and with GSTU4, a soluble glutathione transferase, which fits a
      cytosol-facing PAD3 rather than a luminal one. Because the full text could not be read, this row stays UNDECIDED
      rather than REMOVE. Endoplasmic reticulum membrane (GO:0005789) is the expected location.
    supported_by:
    - reference_id: PMID:31511315
      supporting_text: FRET-FLIM and co-IP demonstrated that the glutathione transferase GSTU4, which
        is coexpressed with Trp- and camalexin-specific enzymes, is physically recruited to the complex.
    - reference_id: file:ARATH/CYP71B15/CYP71B15-deep-research-falcon.md
      supporting_text: A cytosol-facing catalytic site is plausible from general ER-anchored P450 architecture,
        but orientation of PAD3’s active site was not directly demonstrated by this imaging experiment.
