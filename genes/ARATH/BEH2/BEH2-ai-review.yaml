  - *id006
  - *id007
  - *id008
  - *id002
  - *id003
suggested_questions:
- question: Does BEH2 bind BRRE and E-box elements directly, and does it act predominantly as an activator or repressor
    of its targets?
- question: How does the constitutive nuclear localization of BEH2 (despite a conserved 14-3-3 site) affect nuclear
    retention of BZR1/BES1 heterodimer partners in planta?
- question: Is the AT3G61140 (CSN1) With/From partner in the TAIR IPI row for PMID:37926922 an error for AT3G61160
    (ASK-beta)?
suggested_experiments:
- description: EMSA and ChIP-seq of BEH2 (wild type and BEH2m) to define direct targets and binding motifs, compared
    with BZR1/BES1.
- description: CRISPR null alleles of BEH2 in combination with the qui-1 quintuple mutant to test whether BEH2 contributes
    to the residual BR/anther phenotypes of the family.
