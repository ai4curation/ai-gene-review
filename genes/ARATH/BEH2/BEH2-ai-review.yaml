id: Q94A43
gene_symbol: BEH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: BEH2 (BES1/BZR1 HOMOLOG 2, At4g36780) is one of six members of the plant-specific BZR1/BES1 family
  of transcription factors (BZR1, BES1, BEH1-BEH4) that act as the nuclear output of brassinosteroid (BR) signalling.
  It carries the conserved N-terminal BES1_N DNA-binding domain through which family members bind BRRE and E-box
  promoter elements. BEH2 interacts with and is phosphorylated by GSK3-like kinases (ASKtheta, BIN2); it shifts
  to a dephosphorylated form in response to BR, and a stabilizing Pro222Leu substitution (BEH2m, equivalent to bzr1-1D/bes1-D)
  confers a constitutive BR response. Unlike BZR1 and BES1, BEH2 is constitutively nuclear regardless of its phosphorylation
  state and can promote nuclear accumulation of other family members by heterodimerization. Overexpression rescues
  the bri1-5 receptor mutant, enhances BR responses and alters expression of more than a thousand genes, many of
  them BR-independent. BEH2 is expressed mainly in roots and leaf margins and its own transcription is repressed
  by BR via BES1. No loss-of-function phenotype has been described, consistent with redundancy within the family.
