core_functions:
- description: BZR1/BES1-family DNA-binding transcription factor acting as a nuclear effector of brassinosteroid
    signalling; its activity and stability are controlled by GSK3-like kinase phosphorylation (ASKtheta/BIN2) and
    BR-induced dephosphorylation, and it regulates BR-responsive and BR-independent target genes.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
  - id: GO:0009742
    label: brassinosteroid mediated signaling pathway
  - id: GO:0006355
    label: regulation of DNA-templated transcription
  locations:
