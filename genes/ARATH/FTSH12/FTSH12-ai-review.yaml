  review:
    action: MODIFY
    summary: >-
      Cytoplasm is imprecise. FTSH12 has been shown by fractionation and protease protection to be an
      integral protein of the chloroplast inner envelope.
    reason: >-
      The ARBA-derived cytoplasm term is technically compatible with a plastid protein, but it is far
      less specific than the evidence allows. The selected product keeps the full reference chloroplast
      transit peptide and both transmembrane segments. Replace it with chloroplast inner membrane.
    supported_by:
    - &id006
      reference_id: PMID:33216923
      supporting_text: this unambiguously confirms the localization of FtsH12 in the inner chloroplast
