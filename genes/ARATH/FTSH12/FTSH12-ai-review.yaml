- term:
    id: GO:0045037
    label: protein import into chloroplast stroma
  evidence_type: IDA
  original_reference_id: PMID:30309901
  qualifier: involved_in
  review:
    action: NEW
    summary: >-
      FTSH12 is a subunit of the import motor that drives preprotein translocation across the inner
      envelope into the stroma. It does part of the work of the process, so it is not merely needed
      for it.
    reason: >-
      Participation test: the Ycf2/FtsHi complex, which includes FTSH12, performs the ATP-driven pulling
      step of stromal import. FTSH12 associates with translocating precursors of several stromal and
      thylakoid proteins, but not with an outer-envelope integration substrate. The canonical locus
      carries an IMP for this process from the same paper. Embryo lethality and pale knock-down
      phenotypes are not used as evidence.
    supported_by:
    - reference_id: PMID:30309901
      supporting_text: Thus, the transient associations with Ycf2 and FtsHi/FtsH12 proteins are specific
        to preproteins destined to be translocated across the inner envelope membrane.
    - *id004
