id: A0A1P8ARD2
gene_symbol: FTSH12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  FTSH12 (At1g79560, EMB1047) is a nuclear-encoded FtsH-like AAA+ protein of the chloroplast inner
  envelope membrane. It is anchored by two transmembrane segments, with its AAA ATPase and M41
  metalloprotease-like domains facing the stroma. FTSH12 is a subunit of the ~2-MDa Ycf2/FtsHi
  complex (Ycf2, FtsHi1, FtsHi2, FtsHi4, FtsHi5, FTSH12 and plastid NAD-malate dehydrogenase). This
  complex associates with the TIC translocon and acts as the ATP-driven import motor that pulls
  nucleus-encoded preproteins across the inner envelope into the stroma. FTSH12 is the only subunit
  that retains the HEXXH zinc-binding motif, but a zinc-site mutant (H769Y) fully rescues the
  embryo-lethal null, and no proteolytic substrate has been identified. Its pore-loop region lacks the
  aromatic residues that grip substrates in canonical FtsH, which suggests that it contributes to motor
  assembly more than to substrate threading. Loss of FTSH12 arrests embryos at the heart stage, and
  knock-down impairs chloroplast and thylakoid development. The A0A1P8ARD2 entry is a 991-residue
  alternative gene model of the locus. It differs from the reviewed 1008-residue product (Q9SAJ3) only
  at the extreme C terminus.
existing_annotations:
- term:
    id: GO:0004176
    label: ATP-dependent peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000642
  - InterPro:IPR037219
  review:
    action: KEEP_AS_NON_CORE
    summary: >-
      FtsH-family ATP-dependent peptidase activity is structurally plausible for FTSH12, because
      FTSH12 is the only Ycf2/FtsHi subunit that keeps the complete HEXXH zinc site. It has never been
      measured, and the zinc site is not needed for the essential import function.
    reason: >-
      The selected product keeps every reference zinc-site and active-site residue (H769, E770, H773
      and D849 in RESULTS.md). The motif has been kept in land-plant FTSH12 while the FtsHi paralogs
      lost it (PMID:30309901), which argues that some proteolytic capacity may be retained. Against
      this, no cleavage of any substrate by FTSH12 has been demonstrated. H769Y complements the
      embryo-lethal null with wild-type growth. N-terminomics of knock-down and overexpressor lines
      found normal maturation of imported proteins and no FTSH12-generated termini (PMID:33216923).
      The activity is therefore possible but unproven, and it is peripheral to the import-motor role.
      It is kept as non-core, not removed. The prior over-annotation call was softened because the
      catalytic motif is intact. The metalloendopeptidase and proteolysis rows get the same treatment
      because they make the same claim.
    supported_by:
    - &id001
      reference_id: PMID:30309901
      supporting_text: Furthermore, even the FtsH12 zinc binding site is dispensable for its essential
        function.
    - &id002
      reference_id: file:ARATH/FTSH12/FTSH12-bioinformatics/RESULTS.md
      supporting_text: '| Binding site:  | 769–769 | 1 / 1 | 1 |'
    - &id003
      reference_id: PMID:33216923
      supporting_text: 'N-terminome analyses further demonstrated normal proteolytic maturation of

        plastid-imported proteins irrespective of FTSH12 abundance.'
- term:
    id: GO:0004222
    label: metalloendopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000642
  - InterPro:IPR037219
  review:
    action: KEEP_AS_NON_CORE
    summary: >-
      FTSH12 has an intact M41 zinc-metalloprotease motif, so metalloendopeptidase activity is
      plausible. No substrate or activity has been demonstrated, and zinc-site catalysis is dispensable
      for its essential function.
    reason: >-
      Same claim as the ATP-dependent peptidase row. The InterPro2GO mapping is supported by an intact
      HEXXH motif and the downstream glutamate. FTSH12-specific proteolysis is not shown. The canonical
      Q9SAJ3 entry also carries an IBA for this term, propagated with human m-AAA donors (AFG3L2,
      SPG7). Kikuchi et al. place FTSH12 in the cyanobacterium-derived Ycf2/FtsHi clade and not with
      mitochondrial m-AAA proteases, so that propagation route is questionable for this lineage (see
      notes). The term is kept as non-core.
    supported_by:
    - *id001
    - *id002
    - *id003
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000642
  - InterPro:IPR003959
  - InterPro:IPR037219
  review:
    action: ACCEPT
    summary: >-
      FTSH12 keeps a canonical Walker A motif (GPPGTGKT) and Walker B motif (VDEID) in its AAA module.
      It belongs to the ATP-dependent Ycf2/FtsHi import motor. ATP binding is well supported.
    reason: >-
      The Walker A interval (reference 533–540) is identical in the selected product. The complex
      associates with translocating preproteins in an ATP-dependent way.
