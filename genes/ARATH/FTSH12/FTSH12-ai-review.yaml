  review:
    action: ACCEPT
    summary: The P-loop (GPPGTGKT, 533-540) and Walker B (FVFVDE, 587) of the AAA+ module are intact in
      this gene model. FTSH12 is a subunit of the ATP-driven Ycf2-FtsHi import motor.
    reason: >-
      An intact Walker A/B pair in an AAA+ domain is strong structural evidence for nucleotide binding.
      FTSH12 sits within the experimentally defined heterohexameric AAA+ ATPase motor module. ATP binding
      is part of the core motor mechanism. The 8-residue C-terminal tail that differs between this gene
      model and Q9SAJ3 lies well outside the AAA+ domain.
