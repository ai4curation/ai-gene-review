  label: Arabidopsis thaliana
description: Arabidopsis FTSH12 is an AAA-type ATPase component of the Ycf2-FtsHi chloroplast protein-import
  motor at the inner envelope. It retains a zinc-metalloprotease motif, but disruption of that site preserves
  its essential import-associated function. Its best-supported role is ATP-dependent preprotein translocation
  and plastid development; a physiological proteolytic substrate has not been established.
