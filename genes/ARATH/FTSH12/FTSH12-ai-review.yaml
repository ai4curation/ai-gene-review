- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003959
  review:
    action: ACCEPT
    summary: >-
      FTSH12 keeps intact Walker A and Walker B motifs and both arginine-finger arginines in the second
      region of homology (RSGR, versus canonical RPGR). As an AAA subunit of the import motor, it is
      expected to hydrolyse ATP.
    reason: >-
      ATP hydrolysis is required for translocation through the Ycf2/FtsHi motor. FTSH12-specific
      turnover has not been measured. Mielke et al. suggest that substitutions in the Walker B and
      second-region-of-homology segments may impair ATPase activity. However, the catalytic glutamate
      (VDEID) and the arginine fingers are retained in the sequence. On balance the domain-based
      assignment stands. The more informative complex-level activity is captured by the NEW
      contributes_to GO:0016464 row.
    supported_by:
    - *id004
    - *id005
    - reference_id: PMID:30309901
      supporting_text: this import was completely blocked, indicating that ATP hydrolysis is required
        during this translocation step
