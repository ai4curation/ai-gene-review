suggested_questions:
- question: Does FTSH12 cleave any physiological substrate under specific plastid conditions, even though
    zinc-dependent proteolysis is dispensable for its essential import function?
- question: Given that FTSH12 lacks the substrate-gripping pore-loop residues and cross-links only weakly
    to translocating preproteins, is its role in the heterohexamer structural or regulatory (for example
    ring assembly or anchoring) rather than direct substrate pulling?
- question: Should the PAINT node PTN008683692 (metalloendopeptidase activity, seeded by mitochondrial
    m-AAA proteases) and PTN000554085 (m-AAA complex, mitochondrial protein processing) exclude the plastid
    FTSH12 subfamily PTHR43655:SF19, which has been recruited into a chloroplast import motor?
suggested_experiments:
- description: Purify the Ycf2-FtsHi complex from FTSH12 Walker B (E592Q) and H769Y complementation
    lines and compare ATP turnover and in organello import rates. This would separate the contribution
    of FTSH12 ATP hydrolysis from that of its zinc site.
