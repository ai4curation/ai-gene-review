- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000642
  - InterPro:IPR037219
  review:
    action: KEEP_AS_NON_CORE
    summary: >-
      Participation in proteolysis follows only if the retained metalloprotease site is active, and
      this has not been shown. It is kept as non-core, consistent with the peptidase rows.
    reason: >-
      No physiological substrate of FTSH12 is known. Its essential role is in import and does not need
      the zinc site, and import-associated maturation is normal when FTSH12 levels are altered.
      The process term is kept as non-core and is not treated as part of FTSH12's established function.
    supported_by:
