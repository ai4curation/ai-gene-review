- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003959
  review:
    action: ACCEPT
    summary: Walker A and Walker B are intact, so FTSH12 is expected to be a catalytically competent
      AAA+ subunit of the ATP-hydrolysing import motor. Turnover by the individual subunit has not been
      measured.
    reason: >-
      Both Walker A (GPPGTGKT) and Walker B (FVFVDE, with the catalytic Glu) are conserved. The
      Ycf2-FtsHi complex couples ATP hydrolysis to preprotein translocation: inhibiting ATP hydrolysis
      traps preproteins on the complex. ATPase activity has not been assayed for FTSH12 alone; a
      recombinant FtsHi1 AAA domain alone showed none. The InterPro-based molecular-function claim is
      still the right granularity for an AAA+ subunit with intact catalytic motifs. The complex-level
      transport activity is captured in core_functions as a contributes-to function.
    supported_by:
