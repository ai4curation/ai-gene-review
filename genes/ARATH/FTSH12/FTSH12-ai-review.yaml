- term:
    id: GO:0016464
    label: chloroplast protein-transporting ATPase activity
  evidence_type: IDA
  original_reference_id: PMID:30309901
  qualifier: contributes_to
  review:
    action: NEW
    summary: >-
      FTSH12 contributes to the ATP-driven protein-translocating activity of the Ycf2/FtsHi import
      motor. It associates ATP-dependently with inner-envelope translocation intermediates.
    reason: >-
      The motor activity belongs to the heteromeric complex. FTSH12 lacks the conserved hydrophobic
      pore-loop residues, and it cross-links only weakly to translocating preprotein. Kikuchi et al.
      therefore propose a different, possibly assembly-related contribution. The contributes_to
      qualifier fits a subunit of a complex-level activity better than enables.
    supported_by:
