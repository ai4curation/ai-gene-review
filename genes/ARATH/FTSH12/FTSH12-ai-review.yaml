suggested_questions:
- question: Does FTSH12 cleave any physiological substrate, for example misfolded or stalled import
    intermediates, under specific plastid conditions, given that its zinc site is conserved across land
    plants but dispensable for viability?
- question: The canonical FTSH12 entry (Q9SAJ3) receives IBA annotations for mitochondrial m-AAA complex
    and mitochondrial protein processing from PTN000554085. Is SF19 correctly placed under that
    eukaryotic m-AAA node, given that Kikuchi et al. derive FTSH12 from the cyanobacterial FtsH lineage
    with the FtsHi proteins?
- question: Does FTSH12 itself hydrolyse ATP within the Ycf2/FtsHi ring, or does it serve mainly as an
    assembly subunit?
suggested_experiments:
- description: Purify Ycf2/FtsHi complexes carrying FTSH12 Walker B (E->Q) or pore-loop variants, and
    measure complex ATPase rates and import efficiency in complemented ftsh12 lines.
- description: Test recombinant or complex-bound FTSH12 for zinc-dependent proteolysis of model
    substrates such as casein or stalled import intermediates, comparing wild type with H769Y.
