id: A0A1P8ARD2
gene_symbol: FTSH12
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  FTSH12 (At1g79560, EMB1047) is a nuclear-encoded, membrane-anchored FtsH-like AAA+ ATPase of the
  chloroplast inner envelope. It is an essential subunit of the 2-MD Ycf2-FtsHi complex, a heteromeric
  AAA+ ATPase motor that associates with the TIC translocon and drives ATP-dependent import of
  preproteins into the stroma. Its N-terminal transmembrane segments anchor it in the inner envelope,
  and its AAA+ ATPase and M41 metalloprotease domains face the stroma. Null mutants are embryo lethal,
  and reduced FTSH12 levels impair chloroplast development. FTSH12 is the only subunit of the complex
  that keeps the HEXXH zinc-binding motif of FtsH proteases, but a zinc-site mutant (H769Y) fully
  complements the null mutant. No physiological proteolytic substrate has been identified. FTSH12 also
  lacks the pore-loop hydrophobic residues that grip substrates in FtsH proteases and in the FtsHi
  subunits. Its precise role in the motor therefore remains unresolved. This accession is the 991-residue
  AT1G79560 gene model. It shares residues 1-983 with the 1008-residue canonical product (Q9SAJ3) and
  differs only in a short C-terminal tail beyond the protease domain.
