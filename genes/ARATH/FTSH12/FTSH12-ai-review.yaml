    action: MARK_AS_OVER_ANNOTATED
    summary: Ancestral FtsH protease activity transferred from domain signatures. FTSH12 activity has
      never been assayed, and the zinc site is dispensable for its essential function.
    reason: >-
      This InterPro2GO row transfers the ancestral FtsH ATP-dependent protease function from the peptidase
      M41 and FtsH signatures. FTSH12 keeps the motifs: in this gene model the HEAGH zinc site is at
      769-773, Walker A at 533 and Walker B at 587 (RESULTS-rereview.md). It is also the only Ycf2/FtsHi
      subunit that retains the zinc site. However, three lines of evidence argue against treating
      proteolysis as an established FTSH12 activity. First, the H769Y mutant fully complements the
      embryo-lethal null, with normal growth and import. Second, FTSH12 lacks the pore-loop hydrophobic
      residues that FtsH proteases use to thread substrates into the protease chamber. Third,
      N-terminomics shows normal maturation of imported proteins regardless of FTSH12 abundance. No
      substrate or in vitro activity has been reported. Curated sources on the canonical entry Q9SAJ3
      differ in what they assert: TAIR gives an ISS for this term, and PAINT propagates metalloendopeptidase
      activity (IBA from node PTN008683692, seeded by the human mitochondrial m-AAA proteases AFG3L2 and
      SPG7). These are homology-based judgements about a plausible activity, not measurements. The term
      is therefore kept but marked as an over-annotation, not removed: the catalytic motif is intact and
      a minor or conditional activity cannot be excluded. The same action applies to the
      metalloendopeptidase and proteolysis rows, which make the same claim.
