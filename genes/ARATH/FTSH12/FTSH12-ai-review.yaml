    reason: >-
      This makes the same claim as the ATP-dependent peptidase row, so it gets the same action. The zinc
      site (HEAGH 769-773) and the third zinc ligand (Asp849) are retained. However, H769Y complementation
      and the missing substrate-gripping pore-loop residues show that FTSH12's essential function does
      not depend on zinc-dependent cleavage, and no cleaved substrate is known. The PAINT IBA for this
      term on the canonical Q9SAJ3 comes from a node seeded only by mitochondrial m-AAA proteases. It
      carries an ancestral catalytic state into a lineage that was recruited into a chloroplast import
      motor, so it does not count as direct support for this subunit.
