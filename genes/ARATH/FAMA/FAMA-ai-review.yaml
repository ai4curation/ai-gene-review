id: Q56YJ8
gene_symbol: FAMA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FAMA (bHLH097) is a nuclear basic helix-loop-helix transcription factor of the stomatal-lineage
  subgroup Ia (with SPEECHLESS and MUTE) that acts at the final step of stomatal development. Expressed
  transiently in guard mother cells (GMCs) and young guard cells, FAMA heterodimerizes with the broadly
  expressed group IIIb bHLHs SCREAM/ICE1 and SCRM2 to drive guard cell differentiation and to halt proliferative
  divisions so that each GMC divides only once, symmetrically, to form a pair of guard cells. FAMA acts
  as a transcriptional activator of guard-cell genes and also represses cell-cycle genes; through an LxCxE
  motif it binds RETINOBLASTOMA-RELATED (RBR), recruiting RBR and Polycomb-associated repression to the
  promoters of stomatal stem-cell regulators (such as SPCH) to make guard cell fate irreversible. fama
  mutants form tumour-like stacks of small, undifferentiated guard-cell-like cells, while ectopic FAMA
  expression confers guard cell character. FAMA acts redundantly with the MYB factors FOUR LIPS and MYB88
  in restricting GMC division.
