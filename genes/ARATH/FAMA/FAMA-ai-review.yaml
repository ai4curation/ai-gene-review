suggested_questions:
- question: Which FAMA target genes are directly activated versus repressed, and does the FAMA-SCRM heterodimer
    bind a distinct E-box variant from SPCH-SCRM and MUTE-SCRM?
- question: Is FAMA itself a target of MPK3/MPK6 phosphorylation via SCRM's KiDoK docking motif, as SPCH
    is?
suggested_experiments:
- description: ChIP-seq of FAMA in a fama mutant complemented with an LxCxE-mutant FAMA to separate RBR-dependent
    stable repression of stem-cell genes from FAMA's direct transcriptional activation of guard-cell genes.
  experiment_type: ChIP-seq / genetic complementation
