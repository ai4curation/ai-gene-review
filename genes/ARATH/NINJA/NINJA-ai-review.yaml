suggested_questions:
- question: Do JAZ proteins that lack NINJA binding (e.g. JAZ7, JAZ8 with their own EAR motifs) define
    a NINJA-independent TPL-recruitment route, and how much of JA repression is NINJA-dependent in different
    tissues?
- question: Should NINJA be modeled with a dedicated 'transcription corepressor adaptor' MF, distinct
    from corepressor activity, to capture its bridging role between TIFY proteins and TOPLESS?
suggested_experiments:
- description: Compare transcriptomes of ninja null, NINJA-mEAR complemented and wild-type plants with
    and without JA-Ile, in roots and shoots.
  hypothesis: The EAR motif is required for all NINJA-dependent repression, and NINJA dependence of JA-responsive
    genes differs between roots and shoots.
