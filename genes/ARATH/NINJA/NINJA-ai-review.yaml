core_functions:
- description: 'Nuclear transcriptional corepressor adaptor in jasmonate signaling: binds the TIFY motif
    of JAZ (and other group-II TIFY) proteins and recruits the TOPLESS/TPR corepressors via its EAR motif,
    repressing MYC-dependent transcription in the absence of JA-Ile.'
