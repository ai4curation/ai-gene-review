- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20360743
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G30135
  review:
    summary: The partner here is JAZ8/TIFY5A (AT1G30135), one of the JAZ proteins for which the
      assays of PMID:20360743 disagree about NINJA binding (pull-down positive, Y2H negative; JAZ11
      and JAZ12 disagree the other way), whose NINJA binding is weak in a later pull-down, and whose
      repression does not use NINJA.
    action: MARK_AS_OVER_ANNOTATED
    reason: The interaction rests on an in vitro MBP pull-down (NINJA was pulled down by all JAZ-MBP
      fusions except JAZ7, JAZ11 and JAZ12), while the same paper's systematic Y2H found NINJA binding
      most JAZ proteins "except JAZ7 and JAZ8", and UniProt's curated NINJA interactor list omits
      TIFY5A/JAZ8. The binding is therefore not refuted, but generic protein binding is uninformative,
      and the functional reading used for the other JAZ partners (NINJA as the corepressor adaptor that
      bridges the JAZ ZIM domain to TOPLESS, hence transcription corepressor binding) does not apply to
      JAZ8. JAZ8 carries its own N-terminal EAR motif that recruits TOPLESS directly, and JAZ8-mediated
      repression does not require the ZIM domain that recruits NINJA in other JAZ proteins
      (PMID:22327740). That paper's own pull-down recovered much less NINJA with JAZ8 than with
      JAZ10.1, though more than with the MBP control. The row is kept as the curator's observation but marked as an over-annotation
      rather than converted to transcription corepressor binding.
    supported_by:
    - reference_id: PMID:20360743
      supporting_text: NINJA was pulled-down by all JAZ-MBP fusion proteins, except JAZ7, JAZ11 and JAZ12
    - reference_id: PMID:20360743
      supporting_text: Systematic Y2H analysis of the specificity of NINJA for JAZ proteins revealed interactions
        with most JAZ proteins, except JAZ7 and JAZ8
    - reference_id: PMID:22327740
      supporting_text: JAZ8-mediated repression does not require the ZIM domain, which, in other JAZ proteins,
        recruits TOPLESS through the EAR motif-containing adaptor protein NINJA.
    - reference_id: PMID:22327740
      supporting_text: the amount of HA-NINJA recovered by JAZ8-His was much less than that associated
        with JAZ10.1-His
