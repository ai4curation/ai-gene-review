id: Q9SV55
gene_symbol: NINJA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: NINJA (NOVEL INTERACTOR OF JAZ; UniProt name AFPH2, AFP homolog 2) is a nuclear transcriptional
  repressor adaptor of the ABI five-binding protein (AFP) family that links JAZ repressors to the Groucho/Tup1-type
  corepressor TOPLESS (TPL) and the TPL-related proteins TPR2 and TPR3. Its C-terminal region binds the
  TIFY motif in the ZIM domain of most JAZ proteins and of other group-II TIFY proteins such as PEAPOD1/2
  and TIFY8, while an N-terminal EAR (ethylene-responsive element binding factor-associated amphiphilic
  repression) motif in domain A binds TPL. In the resting state this JAZ-NINJA-TPL assembly represses
  MYC-dependent transcription; NINJA overexpression reduces and NINJA knockdown enhances jasmonate responses.
  Through its interaction with PEAPOD2, NINJA also restricts cell proliferation in the leaf blade, controlling
  leaf flatness, and it has been implicated in root stem cell niche maintenance through interaction with
  PAT1H1.
