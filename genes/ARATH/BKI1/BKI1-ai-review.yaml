- term:
    id: GO:0010423
    label: negative regulation of brassinosteroid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:16857903
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Phenotype-based link between BKI1 and negative regulation of BR biosynthesis (acts_upstream_of_or_within).
    action: KEEP_AS_NON_CORE
    reason: >-
      Deferred to the curator, who read the full text (the cached record is abstract-only; Europe PMC
      has no open-access full text). BKI1 is a direct inhibitor of the BRI1 receptor kinase, not a biosynthetic
      component, so any effect on BR biosynthesis is an indirect feedback output of BR signalling and
      is non-core. Caveat: the sign is questionable. A web search (Wang et al. 2011 Dev Cell, PMID:22075146)
      reports that BKI1-YFP overexpression increases CPD and DWF4 expression, which would put BKI1 upstream
      of positive, not negative, regulation of biosynthetic gene expression. The underlying data were
      not seen directly, so the row is kept as non-core and the sign is flagged in suggested_experiments.
    supported_by:
    - *id004
