id: Q9FMZ0
gene_symbol: BKI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  BKI1 (BRI1 KINASE INHIBITOR 1, At5g42750) is a small, largely intrinsically disordered protein of the
  plant-specific BKI1/MAKR family. In resting cells it is tethered to the inner face of the plasma membrane
  by a reiterated polybasic [KR][KR] motif, where it binds the cytoplasmic kinase domain of the brassinosteroid
  receptor BRI1 and prevents BRI1 from associating with its coreceptor BAK1, keeping the receptor inactive.
  Brassinosteroid binding activates BRI1, which phosphorylates BKI1 on a tyrosine within the membrane-targeting
  motif and on serines in its C-terminal region; phosphorylated BKI1 is released into the cytosol, allowing
  formation of the active BRI1-BAK1 complex. Cytosolic phospho-BKI1 binds 14-3-3 proteins, which may relieve
  14-3-3-mediated cytoplasmic retention of the BZR1/BES1 transcription factors. BKI1 therefore acts as
  a receptor-level negative regulator (and, after release, a modest positive modulator) of brassinosteroid
  signalling.
