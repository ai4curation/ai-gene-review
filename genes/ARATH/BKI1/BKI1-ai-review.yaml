suggested_questions:
- question: >-
    Does the 14-3-3-binding (positive) role of released BKI1 make a quantitatively important contribution
    to BZR1/BES1 nuclear accumulation in vivo, relative to BIN2 inactivation?
- question: >-
    How redundant is BKI1 with MAKR family members (e.g. MAKR2-MAKR5) in restraining BRI1 and related
    LRR receptor kinases?
suggested_experiments:
- description: >-
    Measure BR-biosynthetic feedback gene expression (CPD, DWF4) in bki1 loss-of-function and BKI1 overexpression
    lines side by side, to resolve the sign of BKI1's indirect effect on BR biosynthesis.
