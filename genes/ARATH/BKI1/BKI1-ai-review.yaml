core_functions:
- description: >-
    Plasma-membrane-anchored intrinsically disordered inhibitor of the BRI1 receptor kinase: binds the
    BRI1 kinase domain and blocks BRI1 association with its coreceptor BAK1, keeping the receptor quiescent
    in the absence of brassinosteroid. BR-activated BRI1 phosphorylates BKI1 (including a tyrosine in
    its polybasic membrane-targeting motif), releasing it into the cytosol.
