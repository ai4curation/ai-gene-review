- term:
    id: GO:0072593
    label: reactive oxygen species metabolic process
  evidence_type: IMP
  original_reference_id: PMID:16377568
  qualifier: acts_upstream_of_or_within
  review:
    summary: P5CDH limits ROS production through control of proline/P5C metabolism.
    action: MODIFY
    reason: Full PMID:16377568 and PMID:19635803 connect P5CDH loss to increased ROS and P5C-Pro cycling.
      P5CDH oxidizes GSA/P5C rather than directly consuming ROS; negative regulation of ROS metabolism
      expresses this supported causal role more precisely than direct ROS metabolism.
    supported_by:
