id: Q8VZC3
gene_symbol: ALDH12A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ALDH12A1/P5CDH is a mitochondrial aldehyde dehydrogenase that oxidizes glutamate semialdehyde,
  in equilibrium with pyrroline-5-carboxylate, to glutamate. This completes proline degradation and provides
  a catabolic outlet for ornithine-derived intermediates. By controlling P5C metabolism it influences
  mitochondrial redox balance and sensitivity to excess proline, and it supports carbon and nitrogen remobilization
  during seed filling.
