taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  URED (At2g35035) is the Arabidopsis ortholog of the bacterial urease accessory
  protein UreD (UreH in Helicobacter), one of three accessory proteins (with UREF and
  UREG) that are required and sufficient for activation of plant urease by insertion of
  nickel into the urease active site. URED is the accessory protein that binds urease
  directly; it also binds UREF to form a URED-UREF scaffold that recruits UREG, giving a
  urease-URED-UREF-UREG activation complex in the cytoplasm. ured mutants lack urease
  activity and cannot grow on urea as sole nitrogen source, although they have no
  visible phenotype under normal conditions.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: ISM
  original_reference_id: GO_REF:0000122
  qualifier: located_in
  review:
    summary: AtSubP prediction of cytoplasmic localization.
    action: ACCEPT
    reason: URED acts on its client urease, a soluble cytosolic enzyme, and was
      co-purified with urease from plant leaf extracts; there is no targeting signal and
      no experimental localization more specific than cytoplasm for URED itself, so
      cytoplasm is as precise as the evidence allows.
    supported_by:
    - reference_id: PMID:28710280
      supporting_text: Using affinity pulldowns of Strep-tagged UAPs from Arabidopsis
        and rice transiently expressed in planta , we demonstrate that a urease–UreD–UreF–UreG
        complex exists in plants and show its stepwise assembly.
    - reference_id: PMID:23940254
      supporting_text: It is possible that the UAH reaction is bypassed if the ER -born
        urea from nonenzymatic ureidoglycolate decay can reach the cytosol, where it
        is hydrolyzed by urease ( URE ) to carbon dioxide and ammonia
- term:
    id: GO:0016151
    label: nickel cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002669
  review:
    summary: InterPro2GO mapping from the UreD family signature.
    action: MARK_AS_OVER_ANNOTATED
    reason: No nickel binding has been shown for any plant UreD. For bacterial UreD the
      only measurement (an MBP fusion of Klebsiella aerogenes UreD) found weak,
      zinc-competed binding (Kd about 50 uM for Ni, tenfold tighter for Zn), and in the
      plant system the nickel-carrying accessory protein is UREG. The family-wide
      mapping therefore overstates nickel binding as a function of URED.
    supported_by:
    - reference_id: PMID:20207756
      supporting_text: MBP-UreD was purified as a large multimer (> 670 kDa) that bound
        approximately 2.5 Ni2+ ions (K(d) of approximately 50 microM, where K(d) is the
        dissociation constant) per UreD protomer according to equilibrium dialysis measurements.
    - reference_id: PMID:20207756
      supporting_text: Zn2+ directly competes with 10-fold higher affinity (approximately
        4 Zn2+ ions per protomer; K(d) of 5 microM) for the Ni2+ binding sites.
    - reference_id: PMID:28710280
      supporting_text: Our data uncover the crucial role of UreG for nickel delivery during
        eukaryotic urease activation, inciting further investigations of the details of
        this process.
