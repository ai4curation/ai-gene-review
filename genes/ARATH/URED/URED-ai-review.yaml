- term:
    id: GO:0018237
    label: urease activator activity
  evidence_type: IMP
  original_reference_id: PMID:16244137
  qualifier: enables
  review:
    summary: ured insertion mutants lack urease activity, and URED is one of three plant
      accessory proteins whose co-expression is needed to activate plant urease in E.
      coli and in cell-free extracts.
    action: ACCEPT
    reason: Genetic (mutant) and heterologous reconstitution evidence that URED is
      required for nickel-dependent activation of urease, matching the term definition
      (promoting incorporation of nickel into the urease active site). URED binds
      urease directly (PMID:28710280), consistent with a direct activator role. Core
      function.
    supported_by:
    - reference_id: PMID:16244137
      supporting_text: Plants bearing T-DNA or Ds element insertions in either the structural
        gene for urease or in any of the three putative urease accessory genes AtureD,
        AtureF, and AtureG lacked the corresponding mRNAs and were defective in urease
        activity.
    - reference_id: PMID:16244137
      supporting_text: Remarkably, plant urease activation occurred as well in cell-free
        E. coli extracts, but only in extracts from cells that had expressed all three
        accessory proteins.
- term:
    id: GO:0019627
    label: urea metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT2G35035
  - PANTHER:PTN008658292
  - PomBase:SPAC3A12.09c
  review:
    summary: PAINT inference of urea metabolic process at the UreD family node.
    action: TOO_GENERAL
    reason: True but uninformative here; URED acts specifically in activating urease,
      i.e. in urea catabolism, and the more specific GO:0043419 urea catabolic process
      (IDA, PMID:28710280) is kept elsewhere in this review and entails this term. The
      PAINT node placement itself is not disputed.
    supported_by:
    - reference_id: PMID:16244137
      supporting_text: In contrast to wild-type plants, the mutant lines were not able
        to support growth with urea as the sole nitrogen source.
- term:
    id: GO:0043419
    label: urea catabolic process
  evidence_type: IDA
  original_reference_id: PMID:28710280
  qualifier: involved_in
  review:
    summary: URED is part of the urease activation complex whose activity was assayed
      as urease-catalysed urea hydrolysis.
    action: KEEP_AS_NON_CORE
    reason: URED does not hydrolyse urea; it contributes upstream by activating the
      enzyme that does (the GO activator complex term is itself defined as
      capable-of-part-of urea catabolic process). The annotation is acceptable, but
      URED's core role is urease maturation (urease activator activity / protein
      maturation), so the urea catabolic process is kept as non-core.
    supported_by:
    - reference_id: PMID:28710280
      supporting_text: Urease from the urease–UreD and urease–UreD–UreF complexes was
        activated to a higher extent than urease from the urease–UreD–UreF–UreG complex.
- term:
    id: GO:0051604
    label: protein maturation
  evidence_type: IMP
  original_reference_id: PMID:16244137
  qualifier: involved_in
  review:
    summary: URED is required for maturation of urease apoprotein into active,
      nickel-containing urease.
    action: ACCEPT
    reason: URED participates directly in urease maturation - it binds the urease
      apoprotein and scaffolds UREF and UREG for nickel insertion - so it does part of
      the work of the process rather than merely being required. No more specific GO
      process for nickel-dependent enzyme maturation is available (GO:0110147 protein
      maturation by nickel ion transfer is obsolete), so protein maturation is the
      appropriate term.
    supported_by:
    - reference_id: file:ARATH/URED/URED-uniprot.txt
      supporting_text: Required for the maturation and activation of urease via the
        functional incorporation of the urease nickel metallocenter.
    - reference_id: PMID:28710280
      supporting_text: When studying the binding of urease to the UAPs, a direct interaction
        with urease was only observed for UreD but not for UreF or UreG ( lanes 20–22
        ).
