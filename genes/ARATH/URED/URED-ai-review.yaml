- hypothesis: Arabidopsis URED does not itself bind nickel tightly and acts only as a
    structural adaptor between urease and UREF-UREG.
  description: Measure nickel and zinc binding of purified Arabidopsis URED (or URED-UREF)
    by ITC/equilibrium dialysis and test interface mutants for urease activation in
    ured complementation lines.
