id: Q9LXW7
gene_symbol: DCL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: DICER-LIKE 3 (DCL3) is a nuclear, nucleolus-enriched Dicer-family endoribonuclease of Arabidopsis thaliana
  with DExH helicase, PAZ, tandem RNase III and dsRNA-binding domains. It cleaves short double-stranded RNAs, made
  by RNA polymerase IV and RNA-dependent RNA polymerase 2 (RDR2), into 24-nt (and some 23-nt) heterochromatic siRNAs,
  preferring precursors with a 5'-phosphorylated A/U and a 1-nt 3' overhang and measuring product length from the
  5'-phosphorylated end. These siRNAs load into AGO4-clade Argonautes and guide RNA-directed DNA methylation and
  heterochromatin formation at transposons and repeats. DCL3 interacts with dsRNA-binding proteins DRB3 (in methylation-mediated
  defense against geminiviruses), DRB2 and DRB5. It acts partially redundantly with DCL2 and DCL4 in siRNA, tasiRNA
  and viral siRNA production, and with DCL1 to repress FLC and promote flowering. DCL3 expression is itself protected
  from silencing by the H3K9 demethylase IBM1.
