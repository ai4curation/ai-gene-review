- term:
    id: GO:0044027
    label: negative regulation of gene expression via chromosomal CpG island methylation
  evidence_type: IMP
  original_reference_id: PMID:16699516
  qualifier: acts_upstream_of_or_within
  review:
    summary: TAIR IMP from dcl mutant DNA methylation analysis (Henderson et al. 2006).
    action: MODIFY
    reason: The essence (DCL3 contributes to siRNA-guided DNA methylation that silences loci) is sound, but the
      term describes CpG-island methylation at gene promoters. DCL3-dependent methylation is RNA-directed, largely
      non-CG methylation at repeats and transposons; the specific term is gene silencing by siRNA-directed DNA methylation,
      whose definition includes the siRNA biogenesis phase DCL3 catalyses.
    supported_by:
    - reference_id: PMID:15024409
      supporting_text: In the dcl3-1 mutant, however, cytosine methylation was decreased only at asymmetric sites
    - reference_id: PMID:16699516
      supporting_text: DCL2, DCL3 and DCL4 showed functional redundancy in siRNA and tasiRNA production and in the
        establishment and maintenance of DNA methylation.
    - reference_id: PMID:15024409
      supporting_text: unique functions for three DCL proteins in miRNA (DCL1), endogenous siRNA (DCL3), and viral
        siRNA (DCL2) biogenesis were identified
    proposed_replacement_terms:
    - id: GO:0080188
      label: gene silencing by siRNA-directed DNA methylation
    source_defects:
    - defect_type: WRONG_TERM
      resource: TAIR
      requested_change: REPOINT
      asserted_value: GO:0044027
      corrected_value: GO:0080188
      corrected_label: gene silencing by siRNA-directed DNA methylation
      confidence: PROBABLE
      explanation: GO:0044027 describes repression via methylation of chromosomal CpG islands near transcription
        start sites. The dcl mutant phenotype in PMID:16699516 concerns siRNA-directed (RdDM) methylation, largely
        asymmetric non-CG, at repeats/transposons; GO:0080188 fits the biology.
      supported_by:
      - reference_id: PMID:15024409
        supporting_text: In the dcl3-1 mutant, however, cytosine methylation was decreased only at asymmetric sites
