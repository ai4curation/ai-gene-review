core_functions:
- description: Nuclear/nucleolar RNase III-type dicing of Pol IV-RDR2 double-stranded RNA precursors into 24-nt
    heterochromatic siRNAs that guide RNA-directed DNA methylation of transposons and repeats.
  molecular_function:
    id: GO:0004525
    label: ribonuclease III activity
  directly_involved_in:
  - id: GO:0030422
    label: siRNA processing
  - id: GO:0080188
    label: gene silencing by siRNA-directed DNA methylation
  locations:
  - id: GO:0005730
    label: nucleolus
  supported_by:
  - reference_id: PMID:24214956
    supporting_text: Dicer-like 3 (DCL3) and Dicer-like 4 (DCL4) cleave long, perfect double-stranded RNAs (dsRNAs)
      into 24 and 21 nucleotides (nt) small interfering RNAs
  - reference_id: PMID:34648373
    supporting_text: confirming that RNaseIIIa and RNaseIIIb are responsible for complementary strand and guide
      strand cleavage, respectively
  - reference_id: PMID:31398324
    supporting_text: The dicer endonuclease DCL3 cuts resulting duplexes to generate 24- and 23-nt siRNAs.
  - reference_id: PMID:15024409
    supporting_text: unique functions for three DCL proteins in miRNA (DCL1), endogenous siRNA (DCL3), and viral
      siRNA (DCL2) biogenesis were identified
  - reference_id: PMID:16839878
    supporting_text: We show that RDR2, DCL3, AGO4, and NRPD1b (the largest subunit of Pol IVb) colocalize with
      siRNAs within the nucleolus.
suggested_questions:
- question: Is the helicase/ATP-binding module of DCL3 functionally required in vivo, given conflicting reports
    of ATP dependence (PMID:24214956 vs PMID:34648373)?
- question: Which sequence numbering does PMID:34648373 use for active-site residues, given the ~10-residue offset
    from the current UniProt canonical sequence?
suggested_experiments:
- description: Complement dcl3 (or dcl2 dcl3 dcl4) with DCL3 carrying DECH-box/Walker A mutations and measure 24-nt
    siRNA accumulation and RdDM-target methylation to test whether helicase ATPase activity contributes in vivo.
