- term:
    id: GO:0009885
    label: transmembrane histidine kinase cytokinin receptor activity
  evidence_type: IMP
  original_reference_id: PMID:15155880
  review:
    summary: AHK2 is a membrane-spanning CHASE-domain histidine kinase that perceives cytokinin
      and signals by histidine autophosphorylation; the specific receptor-kinase term is more
      precise than the existing generic cytokinin receptor activity annotations.
    action: NEW
    reason: Genetic and biochemical evidence establishes the CRE-family receptors as transmembrane
      histidine kinase cytokinin receptors; AHK4 already carries this term by IDA, and AHK2/AHK3
      share the same domain architecture and mechanism.
    supported_by:
    - reference_id: PMID:15155880
      supporting_text: Application of exogenous cytokinins to the resultant strains revealed
        that both AHK2 and AHK3 function as positive regulators for cytokinin signaling similar
        to AHK4.
    - reference_id: PMID:14503005
      supporting_text: Cytokinins are perceived by three histidine kinases--CRE1/WOL/AHK4,
        AHK2, and AHK3--which initiate intracellular phosphotransfer.
    - reference_id: PMID:21709172
      supporting_text: Cytokinin-binding assays, fluorescent fusion proteins, and biochemical
        fractionation all showed that the large majority of cytokinin receptors are localized
        to the ER, suggesting a central role of this compartment in cytokinin signaling.
core_functions:
- description: 'AHK2 is a CHASE-domain cytokinin receptor: binding of cytokinin to its extracytosolic
    sensor domain activates autophosphorylation of the transmitter-domain histidine and phosphotransfer,
    via its receiver domain, to AHP histidine phosphotransfer proteins, initiating the multistep
    phosphorelay that activates type-B ARR transcription factors.'
  supported_by:
  - reference_id: PMID:15155880
    supporting_text: Application of exogenous cytokinins to the resultant strains revealed
      that both AHK2 and AHK3 function as positive regulators for cytokinin signaling similar
      to AHK4.
  - reference_id: PMID:14503005
    supporting_text: Cytokinins are perceived by three histidine kinases--CRE1/WOL/AHK4, AHK2,
      and AHK3--which initiate intracellular phosphotransfer.
  - reference_id: PMID:21709172
    supporting_text: Cytokinin-binding assays, fluorescent fusion proteins, and biochemical
      fractionation all showed that the large majority of cytokinin receptors are localized
      to the ER, suggesting a central role of this compartment in cytokinin signaling.
  molecular_function:
    id: GO:0009885
    label: transmembrane histidine kinase cytokinin receptor activity
  directly_involved_in:
  - id: GO:0009736
    label: cytokinin-activated signaling pathway
  locations:
