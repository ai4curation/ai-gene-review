- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0097
  review:
    summary: AHK2 is an integral membrane receptor; the bulk of cytokinin binding and receptor-fluorescent
      protein fusions reside in the endoplasmic reticulum membrane.
    action: ACCEPT
    reason: ER-membrane localization of the CRE-family receptors is supported by cytokinin-binding,
      fluorescence and fractionation data.
    supported_by:
    - reference_id: PMID:21709172
      supporting_text: Cytokinin-binding assays, fluorescent fusion proteins, and biochemical
        fractionation all showed that the large majority of cytokinin receptors are localized
        to the ER, suggesting a central role of this compartment in cytokinin signaling.
