- term:
    id: GO:0006970
    label: response to osmotic stress
  evidence_type: IMP
  original_reference_id: PMID:18077346
  qualifier: acts_upstream_of_or_within
  review:
    summary: AHK2 contributes to 'response to osmotic stress' as one of the downstream physiological/developmental
      outputs of cytokinin perception.
    action: KEEP_AS_NON_CORE
    reason: Supported by mutant or expression data, but this is a pleiotropic output of cytokinin
      signaling rather than the receptor's core function.
    supported_by:
    - reference_id: PMID:18077346
      supporting_text: AHK2 and AHK3 also negatively control osmotic stress responses in Arabidopsis
        because ahk2, ahk3, and ahk2 ahk3 mutants were strongly tolerant to drought and salt
        stress due to up-regulation of many stress- and/or ABA-inducible genes.
