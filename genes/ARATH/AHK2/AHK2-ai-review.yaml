  review:
    summary: Interaction of AHK2 with the phosphotransfer protein AHP4.
    action: REMOVE
    reason: Generic protein binding is uninformative. The interaction is the physical basis
      of phosphotransfer to AHPs, which is already captured by phosphorelay sensor kinase
      activity (GO:0000155); GO has no specific term for binding a histidine phosphotransfer
      protein. Removal does not imply the interaction is false.
    supported_by:
    - reference_id: PMID:16965536
      supporting_text: An interaction map of this signaling pathway shows the Arabidopsis
        histidine phosphotransfer proteins as hubs, which interact with members from all other
        protein families, mostly in a redundant fashion.
