  review:
    summary: AHK2 was originally modelled as a plasma-membrane receptor; a minor plasma-membrane
      pool is reported, but most receptor protein and cytokinin binding are in the ER.
    action: KEEP_AS_NON_CORE
    reason: Plasma membrane localization is plausible for a minor fraction but is not the
      principal site of the receptor; ER membrane is the better-supported location.
    supported_by:
    - reference_id: PMID:21709172
      supporting_text: Cytokinin-binding assays, fluorescent fusion proteins, and biochemical
        fractionation all showed that the large majority of cytokinin receptors are localized
        to the ER, suggesting a central role of this compartment in cytokinin signaling.
