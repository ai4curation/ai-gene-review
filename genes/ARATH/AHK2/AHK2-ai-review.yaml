    summary: AHK2 is a CHASE-domain hybrid sensor histidine kinase that autophosphorylates
      on its conserved transmitter-domain histidine and relays the phosphoryl group via its
      receiver domain to AHP phosphotransfer proteins.
    action: ACCEPT
