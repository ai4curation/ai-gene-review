id: Q9C5U2
gene_symbol: AHK2
product_type: PROTEIN
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: AHK2 (ARABIDOPSIS HISTIDINE KINASE 2) is one of three CHASE-domain hybrid sensor
  histidine kinases that serve as cytokinin receptors in Arabidopsis thaliana, together with
  AHK3 and CRE1/AHK4. It is an integral membrane protein, located mainly in the endoplasmic
  reticulum membrane with a smaller plasma-membrane pool, whose extracytosolic CHASE domain
  binds cytokinins. Ligand binding activates autophosphorylation of a conserved histidine
  in the cytoplasmic transmitter domain, and the phosphoryl group is relayed through the receiver
  domain to histidine phosphotransfer proteins (AHPs), which carry it to nuclear type-B response
  regulators (ARRs) that activate cytokinin-responsive transcription. In replacement experiments
  AHK2 favours the kinase over the phosphatase mode. Acting partially redundantly with AHK3,
  AHK2 promotes shoot and leaf growth, cambial activity and secondary growth, and inhibits
  root growth and branching; it also modulates seed germination and size, chlorophyll retention,
  and responses to drought, salt, cold and abscisic acid.
