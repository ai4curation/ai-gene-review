core_functions:
- description: >-
    Nuclear sequence-specific DNA-binding transcription activator of the EIN3
    family that binds EIN3-binding sites (primary ethylene response elements) in
    target promoters such as ERF1 and activates ethylene-responsive transcription;
    stabilized by ethylene when EBF1/EBF2-mediated degradation is relieved, and
    acting redundantly with EIN3.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0009873
    label: ethylene-activated signaling pathway
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:9851977
    supporting_text: EIN3 and EILs comprise a family of novel sequence-specific
      DNA-binding proteins that regulate gene expression by binding directly to a
      primary ethylene response element (PERE)
  - reference_id: PMID:9215635
    supporting_text: Overexpression of EIN3 or EIL1 in wild-type or
      ethylene-insensitive2 plants conferred constitutive ethylene phenotypes
  - reference_id: PMID:20647342
    supporting_text: the level of EIL1 protein is upregulated by ethylene through an
      EBF1/2-dependent pathway
suggested_questions:
- question: >-
    What determines the differential contribution of EIL1 versus EIN3 to adult
    leaf expansion and stem elongation compared with seedling responses: target
    specificity, expression pattern, or differential protein stability?
suggested_experiments:
- description: >-
    Compare genome-wide EIL1 and EIN3 binding (ChIP-seq or DAP-seq) in adult
    leaves with and without ethylene, in ein3 and eil1 single mutant backgrounds,
    to identify EIL1-specific targets.
