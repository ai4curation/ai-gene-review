id: Q9SLH0
gene_symbol: EIL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  EIL1 (ETHYLENE INSENSITIVE3-LIKE 1, At2g27050) is a nuclear, plant-specific
  EIN3-family transcription factor that, together with its closest paralog EIN3,
  is one of the two master transcription factors of the ethylene response. EIN3/EIL
  proteins bind as sequence-specific DNA-binding proteins to primary ethylene
  response elements (EIN3-binding sites) in target promoters such as ERF1 and
  activate their transcription; EIL1 can complement ein3 and, when overexpressed,
  confers constitutive ethylene responses. In the absence of ethylene EIL1 protein
  is continuously degraded by the 26S proteasome via the F-box proteins EBF1 and
  EBF2; ethylene signalling through EIN2 inhibits EBF1/EBF2 and stabilizes EIL1
  in the nucleus. EIL1 acts redundantly but differentially with EIN3 (EIL1 mainly
  in leaf expansion and stem elongation of adult plants) and the ein3 eil1 double
  mutant is almost completely ethylene-insensitive. EIL1 also integrates
  ethylene with jasmonate (repression by JAZ and MYC2/MYC-type proteins), iron
  uptake (interaction with FIT), photomorphogenic greening (PORA/PORB activation),
  salicylic-acid-mediated immunity (repression of SID2) and the sulfur-deficiency
  response.
