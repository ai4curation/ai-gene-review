core_functions:
- description: 'PP1-type serine/threonine protein dephosphorylation with substrate-specific developmental
    consequences: DELLA turnover in GA signaling, PIF5 stabilization in red-light signaling, PIN1 polarity/trafficking
    and ATG13a regulation in autophagy. Regulatory subunits specify context; TOPP4 is also associated
    with a flowering-related termination module whose substrate remains unresolved.'
