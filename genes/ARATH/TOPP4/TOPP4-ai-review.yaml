gene_symbol: TOPP4
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'TYPE ONE PROTEIN PHOSPHATASE 4 (TOPP4) is a PP1-family serine/threonine protein phosphatase
  whose regulatory partners and substrates connect it to several developmental and stress responses. TOPP4
  dephosphorylates DELLA proteins RGA and GAI in gibberellin signaling, PIF5 during red-light responses,
  PIN1 in pavement-cell polarity and trafficking, and ATG13a during carbon-starvation-induced autophagy.
  It has nuclear, cytoplasmic and plasma-membrane-associated pools. TOPP4 also associates with APRF1 and
  LD in a transcription-termination-linked module involved in FLC chromatin repression, although that
  module''s direct phosphatase substrate has not been established. Substrate dephosphorylation has different
  consequences in different pathways: it promotes DELLA turnover but stabilizes PIF5.'
