  review:
    summary: TOPP4 removes phosphate from PIF5 rather than catalyzing phosphate addition.
    action: MODIFY
    reason: The original PMID:26704640 phosphorylation study explicitly establishes direct PIF5 dephosphorylation
      by TOPP4 and consequent inhibition of PIF5 degradation. The role-specific process is protein dephosphorylation,
      already present elsewhere in this review. This correction concerns the measured chemical step, not
      a claim that a phosphatase can never regulate a broader phosphorylation pathway.
    supported_by:
