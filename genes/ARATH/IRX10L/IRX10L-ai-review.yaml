taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'IRX10L (IRX10-LIKE, At5g61840; also called GUT1 and XYLAN SYNTHASE-1, XYS1)
  is a glycosyltransferase family 47 (GT47) xylan synthase. The purified catalytic domain
  uses UDP-xylose to add multiple beta-1,4-linked xylosyl residues to the non-reducing end
  of xylooligosaccharide acceptors, polymerising xylan chains in vitro in a distributive manner
  without other proteins; it uses no other UDP-sugar donor and needs no divalent cation. The
  protein has an N-terminal hydrophobic signal/signal-anchor segment and a lumenal catalytic
  domain, and Golgi proteomics places it in the Golgi, enriched in medial cisternae. IRX10L
  is the main xylan backbone synthase in primary-wall tissues, where with IRX9L and IRX14
  it makes the regularly substituted, GUX3-decorated primary-wall xylan; irx10l single mutants
  lose this xylan and most microsomal xylosyltransferase activity in callus. In secondary
  walls it is the minor partner of IRX10: irx10l alone has no visible phenotype, but irx10
  irx10l double mutants nearly lack secondary-wall xylan, with collapsed xylem and severe
  dwarfing.'
