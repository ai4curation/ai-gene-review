  review:
    summary: Golgi membrane from the UniProt subcellular location (by similarity to IRX7).
    action: ACCEPT
    reason: Xylan backbone synthesis takes place in the Golgi, and the IRX10 clade acts with
      the membrane-anchored GT43 proteins IRX9 and IRX14 in a Golgi xylan synthase complex.
      The N terminus is a single hydrophobic segment that UniProt models as a type II signal
      anchor, while the original characterisation called it a signal peptide; either way the
      catalytic domain faces the Golgi lumen and the protein is held at the Golgi membrane,
      directly or through IRX9/IRX14. The ISS row is transferred from IRX7/FRA8 (Q9ZUV3),
      a GT47 type II protein, which is a reasonable donor for location. Golgi membrane is
      as precise as the evidence allows. Same action as the IRX10 review.
