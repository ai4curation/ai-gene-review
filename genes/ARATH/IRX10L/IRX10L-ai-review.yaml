      confidence: PROBABLE
      explanation: UniProtKB:Q940Q8 (IRX10L) carries the alternative names 'Glucuronoxylan
        glucuronosyltransferase 1' (AtGUT1) and 'Glucuronoxylan glucuronosyltransferase 2',
        from the tobacco NpGUT1 hypothesis. Purified IRX10L and recombinant IRX10 are UDP-xylose-dependent
        beta-1,4-xylan synthases (PMID:25141999, PMID:25139408), and GlcA is added to xylan
        by GT8 GUX enzymes (PMID:26043357). The glucuronosyltransferase alternative names
        should be dropped or marked as historical.
