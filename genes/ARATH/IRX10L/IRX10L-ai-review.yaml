- term:
    id: GO:0080116
    label: glucuronoxylan glucuronosyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G61840
  - PANTHER:PTN001667002
  review:
    summary: Glucuronoxylan glucuronosyltransferase activity inherited from PANTHER node PTN001667002,
      seeded only by IRX10L's own IMP row.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001667002
        source_label: PTN001667002
        source_status: SOURCE_BAD
        comment: The only listed descendant evidence is AT5G61840 itself, i.e. the IMP row
          from PMID:18980662. That row reads a backbone xylosyltransferase defect (with secondary
          loss of GlcA side chains) as glucuronosyltransferase activity. The node placement
          is sound for xylan synthase activity, which the clade carries; the MF on this node
          should be replaced, not the node moved.
    action: MODIFY
    reason: GO:0080116 means transfer of glucuronate onto the xylan backbone. That reaction
      belongs to the GT8 GUX enzymes, not to IRX10/IRX10L. The term reflects the early 'GUT'
      (glucuronyltransferase) naming that came from the tobacco homolog NpGUT1, and the irx10
      loss of GlcA side chains, which is secondary to the shortened backbone. The cited mutant
      paper itself reports a loss of beta-1,4-xylosyltransferase activity in irx10 irx10-L
      and concludes a role in backbone elongation. Purified IRX10L transfers xylose from UDP-Xyl
      and does not use UDP-GlcA, and GUX3 is the sole glucuronyltransferase for primary wall
      xylan. The underlying claim (an MF in glucuronoxylan synthesis, from the double-mutant
      phenotype) is right, so the row is redirected to xylan synthase activity rather than
      removed.
    proposed_replacement_terms: &id004
