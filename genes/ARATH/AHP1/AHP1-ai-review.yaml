id: Q9ZNV9
gene_symbol: AHP1
product_type: PROTEIN
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: AHP1 (ARABIDOPSIS HISTIDINE-CONTAINING PHOSPHOTRANSFER PROTEIN 1; ATHP3) is a
  small (154 aa) histidine-containing phosphotransfer (HPt) protein of Arabidopsis thaliana
  that acts as the mobile intermediate of the multistep His-Asp phosphorelay. It receives
  a phosphoryl group on a conserved histidine from the receiver domains of hybrid sensor histidine
  kinases - the cytokinin receptors AHK2, AHK3 and CRE1/AHK4, and also CKI1 and ETR1 in interaction
  assays - and transfers it to the receiver aspartate of response regulators, including the
  nuclear type-B ARR transcription factors and the type-A ARR feedback regulators. AHP1 complements
  a yeast ypd1 HPt mutant and is distributed between the cytosol and nucleus. Acting redundantly
  with AHP2, AHP3 and AHP5, it is a positive regulator of cytokinin signaling; higher-order
  ahp mutants are cytokinin-insensitive and show defects in growth and, through the CKI1 pathway,
  in female gametophyte development.
