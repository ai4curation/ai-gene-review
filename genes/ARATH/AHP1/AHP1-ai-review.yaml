suggested_questions:
- question: Given that AHP localization is constitutively nucleocytosolic, how is the phosphorylated
    AHP pool partitioned between cytosolic receptors and nuclear type-B ARRs, and does phosphorylation
    alter AHP nuclear residence time?
- question: Does AHP1 show any receptor preference (AHK2/3/4 versus CKI1 or ETR1) in planta
    that could explain pathway-specific outputs?
suggested_experiments:
- hypothesis: Phospho-His occupancy of AHP1 is the rate-limiting signal reaching nuclear type-B
    ARRs.
  description: Quantify phospho-histidine AHP1 in nuclear and cytosolic fractions after cytokinin
    treatment using phospho-His-specific antibodies or Phos-tag gels, in wild type and receptor
    mutants.
  experiment_type: biochemical fractionation
