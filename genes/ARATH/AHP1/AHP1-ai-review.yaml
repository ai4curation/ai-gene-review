  review:
    summary: ahp quintuple mutants show severe megagametogenesis defects; AHPs act downstream
      of the cytokinin-independent histidine kinase CKI1 in female gametophyte development.
    action: KEEP_AS_NON_CORE
    reason: Genetic evidence (higher-order mutant) supports involvement, but this is a developmental
      output of CKI1-AHP-ARR signaling rather than AHP1's specific core function, and AHP1
      acts redundantly with other AHPs.
    supported_by:
    - reference_id: PMID:20363773
      supporting_text: These results define a genetic pathway consisting of CKI1, AHPs, and
        type-B ARRs in the regulation of female gametophyte development and vegetative growth.
    - reference_id: PMID:20363773
      supporting_text: Consistently, an ahp1,2-2,3,4,5 quintuple mutant, which contains an
        ahp2-2 null mutant allele, exhibits severe defects in megagametogenesis
