  review:
    summary: AHP1 is a histidine-containing phosphotransfer (HPt) protein that relays phosphoryl
      groups from hybrid histidine kinases to response regulators in the multistep His-Asp
      phosphorelay.
    action: ACCEPT
    reason: Core process of AHP1, supported by phosphorelay complementation in E. coli and
      yeast and by in vitro phosphotransfer to ARRs.
    supported_by:
    - reference_id: PMID:10050311
      supporting_text: Both in vivo and in vitro evidence that each AHP can function as a
        phospho-transmitting HPt domain with an active histidine site was obtained by employing
        both the Escherichia coli and yeast His-Asp phosphorelay systems.
    - reference_id: PMID:10050311
      supporting_text: It was also demonstrated that AHPs can interact in vitro with ARRs
        through the His-Asp phosphotransfer reaction.
