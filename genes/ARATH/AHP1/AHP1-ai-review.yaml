core_functions:
- description: AHP1 shuttles phosphoryl groups from activated cytokinin receptor histidine
    kinases to nuclear type-B response regulators, acting as a redundant positive component
    of the cytokinin phosphorelay.
  supported_by:
  - reference_id: PMID:10050311
    supporting_text: Both in vivo and in vitro evidence that each AHP can function as a phospho-transmitting
      HPt domain with an active histidine site was obtained by employing both the Escherichia
      coli and yeast His-Asp phosphorelay systems.
  - reference_id: PMID:17122069
    supporting_text: These observations provide evidence that AHP1, AHP2, AHP3, and AHP5 each
      act as a positive regulator of cytokinin signaling and that they act partially redundantly.
  - reference_id: PMID:20484973
    supporting_text: revealed that the subcellular localization of the AHPs is persistently
      nucleo-cytosolic and non-responsive to the state of the cytokinin response pathway
