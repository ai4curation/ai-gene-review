core_functions:
- description: >-
    Plastid methylthioalkylmalate synthase that catalyzes the committed condensation of acetyl-CoA
    with 4-methylthio-2-oxobutanoate and 5-methylthio-2-oxopentanoate in the first two rounds
    of methionine chain elongation, determining the C4 side-chain length that dominates aliphatic
    glucosinolates in Col-0.
