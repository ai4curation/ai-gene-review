id: Q9FG67
gene_symbol: MAM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MAM1 (METHYLTHIOALKYLMALATE SYNTHASE 1, At5g23010; the GSL-ELONG / GSM1 locus) is a plastid-targeted
  2-oxo-acid/acetyl-CoA condensing enzyme of the DRE-TIM metallolyase (LeuA-like) family that
  catalyzes the committed step of each turn of the methionine side-chain elongation cycle in
  aliphatic glucosinolate biosynthesis: condensation of an omega-methylthio-2-oxoalkanoate with
  acetyl-CoA to form a 2-(omega-methylthio)alkylmalate. MAM1 evolved from isopropylmalate synthase
  of leucine biosynthesis by gene duplication and neofunctionalization but has lost IPMS activity;
  it acts on 4-methylthio-2-oxobutanoate and 5-methylthio-2-oxopentanoate (first and second
  elongation cycles; trace activity on the C6 acid), requires a divalent metal ion and is activated
  by ATP. MAM1 therefore determines the predominance of 4-carbon side-chain (C4) aliphatic glucosinolates
  in Col-0; missense or insertion mutants shift the profile from C4 to C3 glucosinolates. Natural
  presence/absence and allelic variation at the MAM1/MAM2 locus underlies much of the side-chain-length
  diversity of glucosinolates among Arabidopsis accessions and Brassica crops. MAM1 expression
  is co-regulated with BCAT4, is wound-, light- and drought-responsive, and is controlled by
  the MYB28/MYB29 transcription factors.
