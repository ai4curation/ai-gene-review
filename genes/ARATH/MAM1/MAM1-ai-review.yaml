  review:
    summary: >-
      PAINT IBA transferring 2-isopropylmalate synthase activity from the ancestral IPMS node
      (PTN000031336; donors include Arabidopsis IPMS1/IPMS2 and bacterial/yeast LeuA). MAM1
      is a neofunctionalized, glucosinolate-specialized descendant: recombinant MAM1 shows no
      activity with the IPMS substrate 2-oxoisovalerate, is chromatographically separable from
      plant IPMS, and does not complement an IPMS-null E. coli strain.
    action: REMOVE
    reason: >-
      Target-specific evidence of loss of the ancestral function. The node placement is correct
      for the family, but MAM1 lies in a lineage (MAM1/MAM2/MAMa) that underwent biochemical
      neofunctionalization toward methionine-derived 2-oxo acids, and direct assays show MAM1
      lacks IPMS activity. This is a paralog over-propagation of a leucine-biosynthesis function
      onto a specialized-metabolism enzyme.
    supported_by:
