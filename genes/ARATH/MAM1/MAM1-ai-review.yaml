- id: PMID:16668374
  title: >-
    Biochemical Genetics of Plant Secondary Metabolites in Arabidopsis thaliana: The Glucosinolates.
  findings:
  - statement: gsm1 (TU1) mutant reduces aliphatic glucosinolates; GSM1 = MAM1.
    supporting_text: >-
      Mutants of Arabidopsis thaliana with a glucosinolate content different from wild type
      were isolated by screening a mutagenized population of plants.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Classic mutant study; allele identity with MAM1 established later (Textor et al. 2004/2007).
- id: PMID:18431481
  title: >-
    Sorting signals, N-terminal modifications and abundance of the chloroplast proteome.
  findings:
  - statement: Large-scale chloroplast proteome; source of HDA chloroplast annotation.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: High-throughput proteomics; protein list in supplementary data.
- id: PMID:23144921
  title: >-
    Water stress and aphid feeding differentially influence metabolite composition in Arabidopsis
    thaliana (L.).
  findings:
  - statement: MAM1 transcripts up-regulated by drought and down-regulated by aphid feeding.
    supporting_text: >-
      Under drought stress, MAM1 and two transcription factors involved in aliphatic glucosinolate
      biosynthesis - MYB29 and MYB76 - were up-regulated two-fold
    reference_section_type: RESULTS
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached; expression data only (IEP).
- id: PMID:15155874
  title: Glucosinolate and amino acid biosynthesis in Arabidopsis.
  findings:
  - statement: >-
      Of the four Col-0 MAM-like genes, only MAML-3 (an IPMS) complemented an IPMS-null E. coli;
      MAM1 did not.
    supporting_text: >-
      Only the expression of MAML-3 restored the ability of the mutant to grow in the absence
      of Leu.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached; note that this paper swaps the AGI codes of MAM1 and MAML in its introduction.
- id: PMID:17369439
  title: >-
    MAM3 catalyzes the formation of all aliphatic glucosinolate chain lengths in Arabidopsis.
  findings:
  - statement: >-
      mam1 mutants shift the profile from C4 to C3 glucosinolates; the paralog MAM3 is immunolocalized
      to chloroplasts.
    supporting_text: >-
      Plant lines with mutations in MAM1 showed a decrease in C 4 glucosinolates and a corresponding
      increase in C 3 glucosinolates.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:16754868
  title: Positive selection driving diversification in plant secondary metabolism.
  findings:
  - statement: >-
      MAM1 acquired the ability to catalyze the second elongation cycle (biochemical neofunctionalization)
      after duplication from MAMa.
    supporting_text: >-
      Thus, Col-0 MAM1 controls the committed step in both the first and second round of methionine
      carbon chain elongation, ultimately leading to the formation of aliphatic glucosinolates
      with four methylene groups (4C) in their side chain.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC1482576).
- id: PMID:17189332
  title: >-
    Two Arabidopsis genes (IPMS1 and IPMS2) encode isopropylmalate synthase, the branchpoint
    step in the biosynthesis of leucine.
  findings:
  - statement: >-
      IPMS1 and IPMS2, not MAM1, are the Arabidopsis isopropylmalate synthases of Leu biosynthesis.
    supporting_text: >-
      These enzymes catalyze the first dedicated step in leucine (Leu) biosynthesis, an aldol-type
      condensation of acetyl-coenzyme A (CoA) and 2-oxoisovalerate yielding isopropylmalate.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; defines the true IPMS paralogs.
suggested_questions:
- question: >-
    Which N-terminal active-site residues of MAM1 restrict it to the C4/C5 omega-methylthio-2-oxo
    acids while excluding 2-oxoisovalerate, and can these be engineered to tune glucosinolate
    chain length in Brassica oilseeds?
- question: >-
    How does ATP activation of MAM1 (absent in MAM3) regulate flux into the first elongation
    cycles in vivo?
suggested_experiments:
- description: >-
    Solve the structure of Arabidopsis MAM1 with bound substrate and compare with IPMS1/2 and
    Brassica juncea MAM to map residues responsible for loss of IPMS activity; test by reciprocal
    mutagenesis and E. coli leuA complementation.
- description: >-
    Generate mam1 mam3 double mutants by CRISPR (previously unobtainable by crossing) to test
    whether any aliphatic glucosinolate synthesis persists without MAM activity.
