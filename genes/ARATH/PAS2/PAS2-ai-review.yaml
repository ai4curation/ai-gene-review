      PAS2:GFP appears cytosolic in dividing cells and partly nuclear in differentiated cells.
    supporting_text: Loss of the PAS2 function dephosphorylated Arabidopsis thaliana CDKA;1 and upregulated
      its kinase activity.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Full text cached. The antiphosphatase/cell-cycle model and nuclear localization were
      later reinterpreted in light of PAS2's dehydratase function (PMID:18799749).
