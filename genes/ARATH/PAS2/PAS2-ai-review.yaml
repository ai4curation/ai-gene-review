id: Q8VZB2
gene_symbol: PAS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: PASTICCINO2 (PAS2; also PEPINO, At5g10480) is the very-long-chain (3R)-3-hydroxyacyl-CoA
  dehydratase (HCD) of the endoplasmic reticulum fatty acid elongase in Arabidopsis, the plant ortholog
  of yeast PHS1 and animal HACD/PTPLA proteins. It is a multi-pass integral ER membrane protein that catalyzes
  the third step of each very-long-chain fatty acid (VLCFA) elongation cycle, dehydrating the 3-hydroxyacyl-CoA
  produced by KCR1 to a trans-2,3-enoyl-CoA that is reduced by ECR/CER10, with which PAS2 physically associates.
  PAS2 is encoded by a single functional gene, is essential (null alleles are embryo lethal) and is rate-limiting
  for VLCFA production; hypomorphic pas2 mutants accumulate 3-hydroxyacyl-CoA intermediates, have reduced
  VLCFAs in seed triacylglycerols, cuticular waxes and sphingolipids, and show fused organs and ectopic,
  cytokinin-enhanced cell proliferation. Despite its historical classification as a protein tyrosine phosphatase-like
  protein, PAS2 carries a degenerate PTP motif and lacks phosphatase activity; an interaction with Tyr-phosphorylated
  CDKA;1 has been reported, but its developmental phenotypes are complemented by the yeast dehydratase
  and are largely attributable to VLCFA deficiency.
