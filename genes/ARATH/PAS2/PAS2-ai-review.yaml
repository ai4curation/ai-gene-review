  evidence_type: ISS
  original_reference_id: PMID:12472687
  qualifier: enables
  review:
    summary: Assigned by sequence similarity to protein tyrosine phosphatases (the PTPL family).
    action: REMOVE
    reason: PAS2 belongs to the PTP-like (PTPLA/HACD) family defined by a mutated, non-catalytic PTP active
      site; recombinant PAS2 has no phosphatase activity, and the conserved catalytic residues of the
      family serve 3-hydroxyacyl-CoA dehydratase activity, not the PTP motif. The ISS phosphatase annotation
      is contradicted.
    supported_by:
    - reference_id: PMID:12472687
      supporting_text: characterized by a mutated PTP active site
    - reference_id: PMID:16698944
      supporting_text: The recombinant PAS2 had no phosphatase activity
    - reference_id: PMID:18799749
      supporting_text: recent structure/function analysis of Phs1p identified the catalytic residues involved
        in the dehydratase activity, and they do not belong to the PTP motif
