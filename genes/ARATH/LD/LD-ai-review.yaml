taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: LUMINIDEPENDENS (LD) is a large, largely disordered nuclear protein of the Arabidopsis autonomous
  flowering pathway, with an N-terminal homeodomain-like/TFIIS-type four-helix-bundle region, a glutamine-rich
  region and a prion-like domain. LD promotes flowering by repressing the floral repressor FLOWERING LOCUS
  C (FLC). LD associates tightly in vivo with the LSD1-type histone H3K4 demethylase FLD and the SET-domain
  protein SDG26 (an autonomous pathway complex that also contains APRF1 and EFL proteins); this complex
  removes H3K4me1 over the FLC gene body and at genes with convergent antisense transcription, antagonizing
  active transcription marks and favouring Polycomb (H3K27me3) silencing. LD is structurally related to
  yeast Ref2 and mammalian PNUTS, regulatory subunits of the CPF phosphatase module, and interacts with
  the WDR82/Swd2 homolog APRF1 and with PP1-type phosphatase TOPP4, linking RNA 3'-processing/termination
  at FLC to FLD-dependent chromatin changes. LD also binds the zinc-finger protein SUF4, suppressing its
  FRIGIDA-independent activation of FLC, and is expressed mainly in proliferating regions such as shoot
  and root apices. No sequence-specific DNA-binding activity has been demonstrated for LD.
