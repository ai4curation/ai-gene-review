core_functions:
- description: Scaffold subunit of the FLD/LD/SDG26 autonomous pathway chromatin complex and of an APRF1/TOPP4
    CPF-like phosphatase module (Ref2/PNUTS-like), coupling RNA 3'-processing and transcription termination
    at FLC to FLD-mediated H3K4me1 removal and Polycomb silencing, thereby promoting flowering.
  directly_involved_in:
  - id: GO:0045814
    label: negative regulation of gene expression, epigenetic
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:32541063
    supporting_text: Here, we show that FLD tightly associates with LUMINIDEPENDENS (LD) and SET DOMAIN
      GROUP 26 (SDG26) in vivo, and, together, they prevent accumulation of monomethylated H3K4 (H3K4me1)
      over the FLC gene body.
  - reference_id: PMID:38851185
    supporting_text: Ref2/PNUTS act in yeast/mammalian complexes as the regulatory subunit of the CPF
      phosphatase module.
  - reference_id: PMID:38851185
    supporting_text: We were able to show that APRF1-LD-TOPP4 form a CPF phosphatase sub-module
suggested_questions:
- question: Which direct substrate is dephosphorylated by the APRF1/LD/TOPP4 module, and how does LD determine
    substrate recruitment?
- question: How does the LD prion-like region influence assembly and persistence of transcriptional repression
    in native developmental contexts?
suggested_experiments:
- description: Mutate a putative PP1-docking (RVxF-type) motif in LD, test TOPP4 binding and complementation
    of ld, and measure FLC proximal termination, H3K4me1 and flowering time.
  hypothesis: LD recruits PP1/TOPP4 via a PNUTS-like docking motif, and this is required for FLC repression.
  experiment_type: Mutagenesis + co-IP + genetic complementation
