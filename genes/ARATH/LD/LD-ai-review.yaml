  label: Arabidopsis thaliana
description: LUMINIDEPENDENS (LD) is a largely disordered nuclear regulatory protein that promotes flowering
  by repressing FLOWERING LOCUS C (FLC). It associates with FLD and SDG26 in an autonomous-pathway chromatin
  complex and with APRF1 and TOPP4 in a transcription-termination-associated phosphatase module. Structural
  and interaction evidence links LD to the Ref2/PNUTS family of phosphatase regulatory scaffolds. LD thereby
  connects RNA processing with FLD-dependent histone H3K4me1 regulation and a repressive FLC chromatin
  state. LD also binds the FLC activator SUF4, with genetic evidence for antagonistic regulation. The
  available studies support a scaffold/regulatory role rather than an established sequence-specific DNA-binding
  transcription-factor activity.
