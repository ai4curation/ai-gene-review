- id: PMID:34145662
  title: The jasmonoyl-isoleucine receptor CORONATINE INSENSITIVE1 suppresses defense gene
    expression in Arabidopsis roots independently of its ligand.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: DOI 10.1111/tpj.15372 resolved to this identifier in Europe PMC; PubMed record
      fetched with repository tooling and abstract read. Direct root transcriptome/complementation
      evidence supports an additional COI1 regulatory role; the authors frame the independent
      molecular mechanism as a proposed moonlighting function.
  findings:
  - statement: A COI1 variant impaired in JAZ interaction retains repression of a JA-Ile-independent
      root gene set, suggesting a separable regulatory function.
    supporting_text: On the other hand, genes affected by COI1 but not by JA-Ile were still strongly
      repressed by COI1AA .
    reference_section_type: ABSTRACT
- id: PMID:39945499
  title: CORONATINE INSENSITIVE 1-mediated repression of immunity-related genes in Arabidopsis roots
    is lifted upon infection with Verticillium longisporum.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record and PMC12116175 full text fetched with repository publication
      tooling; abstract, genetic comparisons, expression assays and Discussion checked. Direct
      evidence supports JA-Ile-independent root defense regulation. Mobile defense compounds and
      direct COI1 inactivation at promoters remain models, not demonstrated molecular activities.
  findings:
  - statement: COI1 represses a root immunity-related gene set independently of JA-Ile synthesis.
    supporting_text: The biggest difference between the transcriptomes was due to 316
      immunity-related genes that were constitutively higher expressed in coi1 as compared to the
      susceptible genotypes.
    reference_section_type: ABSTRACT
  - statement: Disrupting a subgroup of the derepressed genes partially suppresses the coi1
      tolerance phenotype, linking expression regulation to defense.
    supporting_text: Interfering with the expression of a sub-group of these genes partially
      suppressed the coi1-mediated tolerance phenotype.
    reference_section_type: ABSTRACT
