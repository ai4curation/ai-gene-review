id: O04197
gene_symbol: COI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: COI1 is the F-box/LRR substrate-recognition subunit of the Arabidopsis SCF(COI1)
  ubiquitin ligase and a hormone-binding component of the COI1-JAZ jasmonate co-receptor. Bioactive
  jasmonate conjugates such as JA-Ile, and the bacterial mimic coronatine, promote association with
  JAZ repressors. COI1 recruits these repressors for SCF-dependent ubiquitylation and proteasomal
  degradation, releasing transcription factors to activate jasmonate responses. Inositol phosphate
  supports high-affinity co-receptor assembly. This mechanism controls defense, wound responses,
  root growth and reproductive development and integrates jasmonate signaling with light responses.
  In roots, COI1 also represses immunity-related gene expression independently of JA-Ile and
  promotes susceptibility to Verticillium longisporum. Complementation with a COI1 variant impaired
  in JAZ interaction supports separation of this repression from canonical JAZ perception. The
  molecular partners and requirement for SCF assembly in this root function remain unresolved.
