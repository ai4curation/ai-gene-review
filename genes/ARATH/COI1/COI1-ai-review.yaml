suggested_questions:
- question: How do different JAZ degrons and inositol-phosphate cofactors alter the ligand
    selectivity of the COI1-JAZ co-receptor?
- question: Which COI1 developmental/defense outputs should be modeled as downstream targets rather
    than direct gene annotations?
- question: Which molecular partners mediate JA-Ile-independent root defense-gene repression by
    COI1, does it require SCF assembly, and can a residual contribution from JAZ proteins be
    excluded?
suggested_experiments:
- description: Map COI1-dependent JAZ degradation and transcriptional release across developmental
    and defense contexts using matched proteomics and RNA-seq.
  hypothesis: JAZ degradation and transcriptional release differ in timing across developmental and
    defense contexts.
- description: Test whether eATP, far-red, and shade annotations require canonical JA-Ile/COI1/JAZ
    signaling or separate COI1 functions.
  hypothesis: COI1-dependent ATP and light responses require canonical ligand-dependent JAZ
    turnover.
- description: Compare root complementation of coi1 with wild-type COI1, the
    JAZ-interaction-impaired COI1 variant, and an SCF-assembly-defective COI1 variant while matching
    protein abundance and localization; assay root defense-gene expression and Verticillium
    tolerance, and verify SCF and JAZ interactions directly.
  hypothesis: JA-Ile-independent root repression is separable from canonical JAZ perception; testing
    SCF assembly distinguishes a noncanonical ubiquitin-ligase pathway from an SCF-independent
    function.
