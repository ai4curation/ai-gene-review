      the callose deposition machinery, so the annotation is retained as non-core with
      its acts_upstream_of_or_within qualifier.
    supported_by:
    - reference_id: PMID:19095898
      supporting_text: as well as two transcription factor mutants myb51-1 and myb51-2,
        were impaired in the Flg22-induced callose response
    - reference_id: PMID:19095898
      supporting_text: Since ASA1 expression is Et-inducible, these data suggest that MYB51
        functions downstream of Et signaling and that MYB51 most likely mediates at least
        some transcriptional responses to Et signaling.
- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:25049362
  review:
    summary: >-
      MYB51 trans-activates promoters of glucosinolate biosynthetic genes (ASA1, CYP79B3,
      CYP83B1) in cultured Arabidopsis cells, and gain of function increases expression
      of these genes and indolic glucosinolate levels.
    action: NEW
    reason: >-
      The existing annotations record only the generic DNA-binding transcription factor
      activity. Trans-activation assays and the activation-tagging phenotype show that
      MYB51 is a transcriptional activator of its targets, and no repressor activity
      has been reported.
    supported_by:
    - reference_id: PMID:25049362
      supporting_text: The MYBs could induce the transcription of all tested promoters of
        GSL biosynthetic pathway in trans, indicating a direct role of MYB51 in the binding
        and activation of GSL biosynthesis genes.
    - reference_id: PMID:17461791
      supporting_text: HIG1/MYB51 was shown to activate promoters of indolic glucosinolate
        biosynthetic genes leading to increased accumulation of indolic glucosinolates.
