    supporting_text: HIG1/MYB51 was shown to activate promoters of indolic glucosinolate
      biosynthetic genes leading to increased accumulation of indolic glucosinolates.
  - reference_id: PMID:25049362
    supporting_text: The MYBs could induce the transcription of all tested promoters of
      GSL biosynthetic pathway in trans, indicating a direct role of MYB51 in the binding
      and activation of GSL biosynthesis genes.
  - reference_id: PMID:24431192
    supporting_text: MYB51 is the central regulator of IG synthesis upon SA and ET signaling
