core_functions:
- description: >-
    Nuclear R2R3-MYB transcriptional activator, acting with subgroup IIIe bHLH partners
    (bHLH04, bHLH05, MYC2/3/4), that binds and activates promoters of tryptophan- and
    indolic glucosinolate-pathway genes and is the main shoot regulator of indolic
    glucosinolate production, including under SA/ET and MAMP signalling.
