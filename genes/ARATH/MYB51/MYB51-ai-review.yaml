- term:
    id: GO:0009617
    label: response to bacterium
  evidence_type: IMP
  original_reference_id: PMID:23073694
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      myb51 mutants were among glucosinolate/camalexin pathway mutants that failed to
      mount Pseudomonas fluorescens SS101-induced resistance to P. syringae pv. tomato.
    action: KEEP_AS_NON_CORE
    reason: >-
      The mutant phenotype is genuine, and MYB51 acts upstream of the response by
      controlling supply of indolic glucosinolates. This is an indirect, downstream
      physiological consequence of MYB51's core regulatory function, so it is kept as
      non-core.
    supported_by:
    - reference_id: PMID:23073694
      supporting_text: Subsequent bioassays with seven Arabidopsis mutants ( myb51 , cyp79B2cyp79B3
        , cyp81F2 , pen2 , cyp71A12 , cyp71A13 , and myb28myb29 ) disrupted in the biosynthesis
        pathways for these plant secondary metabolites showed that camalexin and glucosinolates
        are indeed required for the induction of Pst resistance by Pf .SS101 .
