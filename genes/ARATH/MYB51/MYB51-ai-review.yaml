      IPI annotation from the enhanced yeast one-hybrid (eY1H) nitrogen-associated
      transcriptional regulatory network of Gaudinier et al. 2018, recording binding of
      MYB51 to the promoter of locus AT3G61830 (WITH/FROM).
    action: ACCEPT
    reason: >-
      The cached publication is abstract-only, so the specific MYB51-promoter interaction
      cannot be checked here; the curator saw the network data. Binding to
      cis-regulatory regions of target genes is the expected molecular function of an
      R2R3-MYB with two intact HTH Myb repeats, and is independently supported by the
