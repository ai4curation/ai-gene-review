id: O49782
gene_symbol: MYB51
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MYB51 (HIGH INDOLIC GLUCOSINOLATE 1, HIG1; At1g18570) is a nuclear R2R3-MYB
  transcription factor of subgroup 12 that activates the genes of tryptophan-derived
  (indolic) glucosinolate biosynthesis, including tryptophan-pathway genes such as ASA1
  and the core-structure genes CYP79B2/B3 and CYP83B1. It acts together with bHLH
  partners of subgroup IIIe (MYC2/bHLH06, MYC3, MYC4, bHLH04, bHLH05), which are
  required for its activity. Among the three indolic glucosinolate MYBs (MYB34, MYB51,
  MYB122) MYB51 is the main regulator in shoots and the central one under salicylic
  acid and ethylene signalling; the triple mutant lacks indolic glucosinolates. MYB51
  is induced by touch, wounding, MAMPs (flg22), insects and pathogens, and acts
  downstream of ethylene signalling to supply the 4-methoxy-indol-3-ylmethyl
  glucosinolate needed for PEN2-dependent, flg22-triggered callose deposition and for
  antibacterial, antifungal and anti-herbivore defenses. Its promoter is active in
  rosette leaves and trichomes, and during Colletotrichum higginsianum infection its
  induction at infection sites is confined to vasculature cells.
