- term:
    id: GO:0009682
    label: induced systemic resistance
  evidence_type: IMP
  original_reference_id: PMID:23073694
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      myb51 mutants failed to show rhizobacterium (P. fluorescens SS101)-induced
      resistance to P. syringae pv. tomato.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The GO definition of induced systemic resistance specifies a response to
      non-pathogenic bacteria that does not depend upon salicylic acid signalling,
      whereas the same paper explicitly shows that the Pf.SS101-induced response is
      salicylic-acid dependent and not JA/ET dependent. MYB51's contribution is also
      indirect, through indolic glucosinolate supply. The phenotype is better covered
      by the retained (non-core) response to bacterium annotation from the same
      paper.
    supported_by:
    - reference_id: PMID:23073694
      supporting_text: Transcriptomic analysis and bioassays with specific Arabidopsis mutants
        revealed that, unlike many other rhizobacteria, the Pf .SS101 -induced resistance
        response to Pst is dependent on salicylic acid signaling and not on jasmonic acid
        and ethylene signaling.
- term:
    id: GO:0009759
    label: indole glucosinolate biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:17461791
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Loss of HIG1/MYB51 lowers glucosinolate levels and gain of function raises indolic
      glucosinolates; MYB51 trans-activates promoters of indolic glucosinolate pathway
      genes.
    action: MODIFY
    reason: >-
      The phenotype is robust and central to MYB51 biology, but MYB51 is a transcription
      factor and does not catalyse any step of indolic glucosinolate biosynthesis; the
      enzymes (CYP79B2/B3, CYP83B1, SUR1, UGT74B1, SOT16) carry the biosynthetic process
      term. The appropriate process for MYB51 is regulation of glucosinolate
      biosynthetic process (GO:0010439); GO currently has no positive or
      indole-specific child of this term.
    proposed_replacement_terms:
    - id: GO:0010439
      label: regulation of glucosinolate biosynthetic process
    supported_by:
    - reference_id: PMID:17461791
      supporting_text: HIG1/MYB51 was shown to activate promoters of indolic glucosinolate
        biosynthetic genes leading to increased accumulation of indolic glucosinolates.
    - reference_id: PMID:17461791
      supporting_text: The corresponding loss-of-function mutant hig1-1 contained low levels
        of glucosinolates.
    - reference_id: PMID:24431192
      supporting_text: MYB51 is the central regulator of IG synthesis upon SA and ET signaling
- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IMP
  original_reference_id: PMID:19095898
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Clay et al. 2009 placed MYB51 downstream of ethylene signalling and upstream of
      indolic glucosinolate biosynthesis in flg22-triggered immunity;
      glucosinolate-dependent callose deposition contributes to restriction of P. syringae growth.
    action: KEEP_AS_NON_CORE
    reason: >-
      Bacterial growth data for myb51 are in the supplementary figures, which the
      curator had; the cached text supports MYB51 being required for the flg22-induced,
      glucosinolate-dependent callose response that restricts bacterial growth. MYB51
      acts upstream by supplying 4-methoxy-indol-3-ylmethyl glucosinolate, so this is a
      genuine but indirect, non-core annotation.
    supported_by:
    - reference_id: PMID:19095898
      supporting_text: S1) was significantly reduced in myb51 mutants (Table 1A), indicating
        that MYB51 up-regulates IGS biosynthesis in response to Flg22.
    - reference_id: PMID:19095898
      supporting_text: suggesting that glucosinolate-dependent callose deposition most likely
        contributes to MAMP-induced growth suppression of PtoDC3000
- term:
    id: GO:0052544
    label: defense response by callose deposition in cell wall
  evidence_type: IMP
  original_reference_id: PMID:19095898
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      myb51-1 and myb51-2 mutants are impaired in flg22-induced callose deposition.
    action: KEEP_AS_NON_CORE
    reason: >-
      Directly supported by mutant phenotypes. MYB51 acts upstream (ethylene -> MYB51 ->
