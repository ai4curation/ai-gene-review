suggested_questions:
- question: >-
    Does MYB51 directly regulate camalexin biosynthesis under specific conditions (UV,
    AgNO3), given that camalexin is reduced in myb51-containing double mutants but
    pathogen-induced camalexin is not compromised in the myb34/51/122 triple mutant?
- question: >-
    What is the function of vasculature-restricted MYB51 induction at fungal infection
    sites (C. higginsianum), compared with the epidermal induction of MYB122?
- question: >-
    Which cis-element does MYB51 bind in indolic glucosinolate gene promoters, and is
    DNA binding dependent on its bHLH partners?
suggested_experiments:
- description: >-
    ChIP-seq or DAP-seq of MYB51 (alone and with bHLH05) to define its direct target
    promoters and binding motif.
  hypothesis: MYB51 directly binds promoters of ASA1, CYP79B2/B3 and CYP83B1.
- description: >-
    Cell-type-specific complementation of myb51 (vasculature vs epidermis promoters) and
    infection with C. higginsianum and P. cucumerina, measuring fungal growth and
    indolic glucosinolate levels.
  hypothesis: Vascular MYB51 contributes to restricting fungal spread independently of
    epidermal MYB122.
