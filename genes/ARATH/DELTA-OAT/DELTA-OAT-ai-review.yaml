  evidence_type: IDA
  original_reference_id: PMID:18419821
  qualifier: involved_in
  review:
    summary: The experiment localizes OAT protein, not mitochondria within the cell.
    action: REMOVE
    reason: The current GO:0051646 definition concerns transport or maintenance of mitochondria at cellular
