- term:
    id: GO:0009626
    label: plant-type hypersensitive response
  evidence_type: TAS
  original_reference_id: PMID:22321246
  qualifier: involved_in
  review:
    summary: OAT contributes to non-host bacterial resistance and the associated hypersensitive response.
    action: KEEP_AS_NON_CORE
    reason: The target Arabidopsis mutant evidence in PMID:22321246 links altered P5C metabolism to diminished
      pathogen-induced ROS and compromised resistance; Nicotiana silencing supplies complementary evidence.
      Retain this contextual defense role without claiming that OAT directly synthesizes ROS or operates
      as an immune receptor.
    supported_by:
    - reference_id: PMID:22321246
      supporting_text: 'Arabidopsis mutants for

        these genes compromised non-host resistance and showed a decrease in non-host

        pathogen-induced ROS.'
- term:
    id: GO:0009651
    label: response to salt stress
  evidence_type: IDA
  original_reference_id: PMID:9576796
  qualifier: involved_in
  review:
    summary: OAT expression and extract activity respond to salinity in young plantlets.
    action: KEEP_AS_NON_CORE
    reason: PMID:9576796 directly observes age-dependent salt-induced expression and activity; the adult
      response is weaker. Response to a stimulus does not require a knockout fitness defect. The later
      null-mutant experiment rules against a major contribution to stress-induced proline accumulation
      under its conditions, not against the measured biochemical response.
    supported_by:
    - &id004
      reference_id: PMID:9576796
      supporting_text: 'In young plantlets, free Pro content, Delta1-pyrroline-5-carboxylate

        synthase mRNA, delta-OAT activity, and delta-OAT mRNA were all increased by

        salt-stress treatment.'
    - &id005
      reference_id: PMID:18419821
      supporting_text: These findings indicate that δOAT does not contribute significantly to stress-induced
        Pro biosynthesis in vivo during salt stress.
    additional_reference_ids:
    - PMID:18419821
