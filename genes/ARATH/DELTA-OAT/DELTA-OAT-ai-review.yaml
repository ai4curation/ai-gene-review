id: Q9FNK4
gene_symbol: DELTA-OAT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: DELTA-OAT is a mitochondrial pyridoxal-phosphate-dependent ornithine aminotransferase that
  converts ornithine to glutamate semialdehyde/P5C during arginine and ornithine degradation. It enables
  nitrogen recycling from these amino acids and contributes to P5C-dependent metabolic responses during
  non-host pathogen resistance. Its expression and activity respond to salinity in young seedlings, whereas
  native knockout studies do not support a major role in salt-induced proline synthesis.
