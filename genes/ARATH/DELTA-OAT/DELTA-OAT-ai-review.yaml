- term:
    id: GO:0055129
    label: L-proline biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:9576796
  qualifier: acts_upstream_of_or_within
  review:
    summary: The early inference of native proline synthesis was superseded by direct loss-of-function
      tests.
    action: REMOVE
    reason: Full PMID:9576796 links coincident OAT activity/transcript and proline increases after salt,
      without demonstrating OAT-dependent flux into proline. Full PMID:18419821 then tests that inference
      using two null mutants and finds normal proline accumulation while demonstrating defective Arg/Orn
      catabolism. Retain the source measurements and salt-response rows, but reject the positive physiological
      biosynthesis claim rather than simultaneously accepting it and the NOT annotation.
    supported_by:
    - *id004
    - *id005
    additional_reference_ids:
    - PMID:18419821
- term:
    id: GO:0055129
    label: L-proline biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:18419821
  qualifier: involved_in
  negated: true
  review:
    summary: Retain the explicit NOT annotation for native proline biosynthesis in the tested conditions.
    action: ACCEPT
    reason: Full PMID:18419821 shows unchanged basal and salt-induced proline accumulation in two null
      lines despite loss of OAT activity, plus mitochondrial catabolic targeting. This negative result
      concerns the tested Arabidopsis physiological role, not the chemical impossibility of converting
      ornithine-derived carbon into proline in every engineered or nutritional context.
    supported_by:
    - *id005
