suggested_questions:
- question: Does ALAAT1 have a minor cytosolic or nuclear pool in addition to the directly imaged mitochondrial
    pool, and can target-specific localization resolve the shared ALAAT1/ALAAT2 proteomic identification?
suggested_experiments:
- experiment_type: isoform-specific localization
  description: Use endogenous ALAAT1 tagging with mitochondrial, nuclear and cytosolic markers and appropriate
    tag-position controls, together with isoform-resolving peptides where possible. Test the actual alternative
    pools without treating predominant mitochondrial localization as exclusion from the others.
