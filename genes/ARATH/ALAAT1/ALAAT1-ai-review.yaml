taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ALAAT1 is a mitochondrial pyridoxal-phosphate-dependent alanine aminotransferase. It reversibly
  interconverts alanine and 2-oxoglutarate with pyruvate and glutamate and is especially important for
  alanine utilization during recovery from low oxygen. It also contributes to mitochondrial glyoxylate
  transamination in a conditional photorespiratory side pathway.
