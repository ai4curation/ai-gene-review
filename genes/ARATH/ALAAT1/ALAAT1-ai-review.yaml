  findings:
  - statement: ATP binding remains unresolved at the target level.
    supporting_text: 'captured using immobilized

      ATP'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The cached abstract reports ATP-affinity capture of soluble mitochondrial proteins.
      Publisher and supplementary access attempts did not recover the ALAAT1-specific assignment
      needed to distinguish direct ATP binding from co-capture. The direct-binding claim remains
      unresolved; PLP-dependent aminotransferase chemistry alone does not exclude an auxiliary ATP
      interaction.
- id: PMID:17319845
  title: Alanine aminotransferase catalyses the breakdown of alanine after hypoxia in Arabidopsis thaliana.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The cached abstract explicitly reports native alaat1-1 loss of enzyme activity, increased
      early hypoxic alanine accumulation and delayed alanine removal during recovery. These
      results support alanine breakdown when it is in excess. The barley-overexpression experiment
      is distinguished from the Arabidopsis loss-of-function data. Full text is unavailable in
      this cache; kinetic or localization results from other papers are not attributed to this
      reference.
