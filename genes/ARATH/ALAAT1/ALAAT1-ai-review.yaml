- id: PMID:22268146
  title: Two alanine aminotranferases link mitochondrial glycolate oxidation to the major photorespiratory
    pathway in Arabidopsis and rice.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache contains full text. PMID:17319845 supports native alanine breakdown during post-hypoxia
      recovery; enzyme induction alone is not evidence for obligatory alanine synthesis during hypoxia.
      Full text of PMID:22268146 distinguishes ALAAT1 RFP mitochondrial localization/native RNAi/activity-loss
      and tobacco overexpression from the purified multisubstrate assays, which used ALAAT2. No ALAAT2
      kinetic values are assigned to ALAAT1. Cytosolic classification and ATP-affinity capture are not
      negated by mitochondrial localization or PLP dependence. Exact ALAAT1 ATP-capture evidence could
      not be resolved after publisher/supplement 403 attempts. UniProt C4-pathway statement is not used
      as proof that Arabidopsis performs canonical C4 photosynthesis.
  findings:
  - statement: ALAAT1 is targeted to mitochondria.
    supporting_text: Targeting of both enzymes to mitochondria was verified by C-terminal fusion to RFP
