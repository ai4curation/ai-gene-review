  review:
    summary: Lipid A biosynthetic process, propagated by PAINT from node PTN000602593 seeded by E. coli
      WaaA/KdtA (P0AC75). Flagged by Wei et al. 2020 (RAR) as a probable plant misannotation; that flag
      is refuted for this gene.
    action: ACCEPT
    reason: 'The node placement is sound: AtKdtA is a full-length single-copy GT30 ortholog of E. coli
      KdtA (34% identity), and gene-specific mutant chemistry supports the inherited function. In atkdta-1
      null plants the KdtA acceptor lipid IVA accumulates (detected in no other line) together with the
      upstream disaccharide 1-phosphate, as predicted for loss of the step after LpxK. Seveno et al. 2010
      excluded the alternative RG-II role. The plant end product is still unknown and Kdo-containing intermediates
      were not detected, but this does not undermine involvement in the lipid A precursor pathway. The
      low taxon rate-ratio reflected sparse plant curation of a minor, non-essential pathway, not absence
      of the pathway.'
