id: Q8VZA5
gene_symbol: KDTA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: KDTA (At5g03770) is a nuclear-encoded, mitochondrially targeted 3-deoxy-D-manno-octulosonic
  acid (Kdo) transferase of the glycosyltransferase GT30 family, orthologous to the bacterial bifunctional
  enzyme WaaA/KdtA that transfers two Kdo residues from CMP-Kdo onto the lipid A precursor lipid IVA.
  It is the single Arabidopsis KdtA and acts in a plant lipid A precursor pathway that mirrors the E.
  coli Raetz pathway (LpxA, LpxC, LpxD, LpxB, LpxK, KdtA). kdta null mutants accumulate lipid IVA and
  the upstream disaccharide 1-phosphate but have no visible phenotype. KDTA is not required for incorporation
  of Kdo into the cell-wall pectin rhamnogalacturonan II. The final plant lipid A-like product and its
  physiological role, possibly a mitochondrial membrane component or a signalling lipid, remain unknown.
