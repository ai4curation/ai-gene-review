core_functions:
- description: Mitochondrial Kdo transferase that, by orthology to bacterial WaaA/KdtA, transfers Kdo
    residues from CMP-Kdo onto the tetraacyldisaccharide 1,4'-bisphosphate lipid IVA in the plant lipid
    A precursor pathway; loss of KDTA causes accumulation of lipid IVA and upstream precursors. Not involved
    in Kdo incorporation into RG-II pectin.
