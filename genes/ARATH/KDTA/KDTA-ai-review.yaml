suggested_questions:
- question: Does recombinant AtKdtA transfer one or two Kdo residues to lipid IVA in vitro (mono- versus
    bifunctional), given that Kdo-lipid IVA and Kdo2-lipid IVA were not detected in planta?
- question: What is the final structure of the plant lipid A-like molecule downstream of KdtA, given that
    LpxL/LpxM orthologs are absent from Arabidopsis?
- question: Should TAIR add experimental annotations for KDTA (IMP for lipid A biosynthetic process from
    PMID:21709257; IDA for mitochondrion from PMID:20124190), so the lipid A annotation no longer rests
    only on IBA and IEA, which made it vulnerable to RAR-style misannotation flags?
- question: Where does AtKdtA sit within mitochondria (outer membrane, inner membrane or matrix face),
    and does the pathway product reach chloroplast membranes?
suggested_experiments:
- experiment_type: in vitro enzyme assay
  hypothesis: AtKdtA is a bifunctional Kdo transferase that adds two Kdo residues to lipid IVA using CMP-Kdo.
  description: Express mature AtKdtA (without transit peptide), assay with lipid IVA and CMP-Kdo and identify
    products by LC-ESI/MS; complement an E. coli waaA (kdtA) depletion strain.
- experiment_type: sub-mitochondrial fractionation
  hypothesis: AtKdtA is membrane-associated in mitochondria, where its lipid substrate resides.
  description: Protease protection and carbonate extraction of isolated mitochondria from tagged KDTA
    lines to place the enzyme at the outer or inner membrane.
- experiment_type: stress and pathogen phenotyping
  hypothesis: The plant lipid A-like product has a conditional role in mitochondrial membrane function
    or defence signalling.
  description: Challenge kdta null mutants with bacterial pathogens and mitochondrial stressors, and profile
    Kdo-containing lipids by targeted MS in isolated mitochondria.
