    supporting_text: The result showed that FIP1 can use GSH and 1-chloro-2,4-dinitrobenzene
      (CDNB) as substrates
  - reference_id: PMID:28223489
    supporting_text: FIP1 showed lower GST activity than Schistosoma japonicum GST (SjGST)
  - reference_id: PMID:35145536
    supporting_text: the loss of GSTF11 or GSTU20 could result in reduced GST activity
      required for the GSH-conjugation step
- description: Binds the jasmonoyl-amino acid synthetase FIN219/JAR1 and stimulates its
    adenylation activity, modulating far-red light and jasmonate signalling.
  molecular_function:
    id: GO:0008047
    label: enzyme activator activity
