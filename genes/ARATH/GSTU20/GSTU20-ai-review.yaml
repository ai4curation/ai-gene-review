core_functions:
- description: Tau-class glutathione S-transferase that conjugates reduced glutathione
    to electrophilic substrates in the cytosol. Genetic evidence implicates this activity
    in the glutathione-conjugation step of aliphatic glucosinolate core structure formation,
    but conjugation of the native CYP83A1 product by GSTU20 has not been shown biochemically,
    so no glucosinolate process term is asserted here.
  molecular_function:
    id: GO:0004364
    label: glutathione transferase activity
