- id: PMID:28223489
  title: Structural basis of jasmonate-amido synthetase FIN219 in complex with glutathione
    S-transferase FIP1 during the JA signal regulation.
  findings:
  - statement: FIP1 has a canonical homodimeric GST fold with GSH bound in the G-site.
    supporting_text: FIP1 possesses a canonical, homodimerized GST protein fold.
  - statement: FIP1 binding roughly doubles FIN219 adenylation activity.
    supporting_text: the adenylation activity per mole of FIN219–FIP1 was approximately
      double the adenylation activity per mole of FIN219 alone
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; structural and kinetic basis for the FIN219 activator
      role and for GSH binding.
