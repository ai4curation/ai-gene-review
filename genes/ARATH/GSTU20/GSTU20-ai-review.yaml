    aliphatic glucosinolate biosynthesis.
  findings:
  - statement: GSTU20 (At1g78370) and GSTF11 (At3g03190) are regulated by MYB28 together
      with the aliphatic glucosinolate pathway genes.
    supporting_text: Transcriptome analyses of myb28 and Myb28 -overexpressing cell cultures
      indicated that both of them are regulated by Myb28
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available; co-regulation evidence that first placed GSTU20
      in the aliphatic glucosinolate module.
