- id: PMID:29122987
  title: Glutathione Transferase U13 Functions in Pathogen-Triggered Glucosinolate Metabolism.
  findings:
  - statement: Comparator for the NEW-term decision. GSTU13 is required for the PEN2 indole
      glucosinolate pathway and carries a TAIR IMP annotation to indole glucosinolate catabolic
      process (acts_upstream_of_or_within), a precedent for mutant-based glucosinolate
      process annotations on GSTs.
    supporting_text: Glutathione-S-Transferase class-tau member 13 (GSTU13) as an indispensable
      component of the PEN2 immune pathway for IG metabolism
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only cache; used only as a comparator, not as evidence for this gene.
- id: PMID:35145536
  title: Arabidopsis Glutathione-S-Transferases GSTF11 and GSTU20 Function in Aliphatic
    Glucosinolate Biosynthesis.
  findings:
  - statement: CRISPR gstu20 and gstf11 knockouts reduce almost all aliphatic glucosinolates
      in leaves and seeds, with no effect on indolic glucosinolates; gstu20 is stronger.
    supporting_text: both gstf11 and gstu20 mutants exhibited substantial reduction in
      almost all categories of aliphatic GSLs with different side chain lengths
  - statement: The double mutant is additive but not null, implying other GSTs or non-enzymatic
      conjugation contribute.
    supporting_text: the double mutation of GSTF11 and GSTU20 caused a dramatic decrease
      but did not completely abolish the formation of aliphatic GSLs
  - statement: Enzyme activity on the native intermediate was not tested; authors call
      for validation.
    supporting_text: the levels of protein and its derived enzymatic activity should
      be validated in future studies
  - statement: gstu20 mutation causes broad transcriptome changes (1,232 DEGs).
    supporting_text: In gstu20, 1,232 genes were identified as DEGs
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; genetic (necessity) evidence only. Not reflected
      in GOA. Basis for the glucosinolate context in the description but judged insufficient
      for a NEW involved_in annotation (see notes).
suggested_questions:
- question: Does recombinant GSTU20 conjugate glutathione to the CYP83A1 product (the
    aci-nitro/nitrile oxide derived from aliphatic aldoximes) faster than the spontaneous
    reaction, i.e. is it the enzyme of the GSH-conjugation step or does it act indirectly
    on aliphatic glucosinolate accumulation?
- question: Should GO carry an acts_upstream_of_or_within IMP annotation to glucosinolate
    biosynthetic process (GO:0019761) for GSTU20 from PMID:35145536, analogous to the
    GSTU13 annotation to indole glucosinolate catabolic process from PMID:29122987, pending
    biochemical confirmation of its catalytic role?
- question: Is the FIN219/JAR1-activating role of FIP1 independent of its GST catalytic
    activity, and does FIN219 binding alter GSTU20 activity toward glucosinolate intermediates?
suggested_experiments:
- description: Couple CYP83A1 microsomes with recombinant GSTU20 (and GSTF11) and GSH
    using methionine-derived aldoximes, and measure S-(alkylacetohydroximoyl)-GSH formation
    against enzyme-free controls to test catalysis of the native conjugation step.
- description: Profile GSH conjugate and aldoxime-derived intermediates (and core pathway
    transcript levels) in gstu20 and gstf11 gstu20 null lines to distinguish a catalytic
    block from indirect regulatory effects on aliphatic glucosinolate biosynthesis.
- description: Complement gstu20 with a catalytically impaired G-site mutant (e.g. at
    the GSH-contacting residues K40/E66/S67) to test whether GST activity is required
    for the glucosinolate phenotype and for the FIN219-related far-red phenotype.
