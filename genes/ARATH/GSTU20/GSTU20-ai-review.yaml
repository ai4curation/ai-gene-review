gene_symbol: GSTU20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GSTU20 (At1g78370; also FIP1, FIN219-interacting protein 1) is a 217-residue
  tau-class glutathione S-transferase of Arabidopsis. It forms a canonical homodimeric
  GST fold with glutathione bound in the G-site and catalyses conjugation of glutathione
  to electrophiles such as 1-chloro-2,4-dinitrobenzene (Km 0.47 mM for GSH). It is a
  soluble protein found in the cytosol and, as a GUS fusion, also in the nucleus, and
  is expressed mainly in vascular tissues. Two functional contexts are documented. First,
  FIP1 binds the jasmonoyl-amino acid synthetase FIN219/JAR1 (GH3.11); the crystal
  structure of the complex shows that FIP1 binding reorganises the FIN219 C-terminal
  domain and roughly doubles its adenylation activity, and fip1 gain- and loss-of-function
  lines are hyposensitive to continuous far-red light and late flowering, linking FIP1
  to the interplay of phytochrome A and jasmonate signalling. Second, GSTU20 is co-expressed
  with and regulated by MYB28 together with the aliphatic glucosinolate core pathway,
  and CRISPR gstu20 knockouts lose most methionine-derived (aliphatic) glucosinolates
  in leaves and seeds without affecting indolic glucosinolates, more strongly than gstf11
  and additively with it. It is therefore considered the main candidate enzyme for glutathione
  conjugation of the CYP83A1-activated aldoxime, although catalysis on that native intermediate
  has not been demonstrated biochemically.
