- id: PMID:19174456
  title: Enzyme activities and subcellular localization of members of the Arabidopsis
    glutathione transferase superfamily.
  findings:
  - statement: Systematic assay of recombinant Arabidopsis phi and tau GSTs with CDNB,
      BITC and cumene hydroperoxide; BITC (a glucosinolate breakdown product) is a preferred
      substrate of tau GSTs.
    supporting_text: BITC was a more discriminating GST substrate, being acted on by most
      tau class enzymes but rarely by the GSTFs.
  - statement: Notes the proteomic detection of GSTU20 in chloroplast preparations.
    supporting_text: GSTs F2, F8, F9, F10, U19, U20, L2, and DHAR3 in the chloroplast
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available; family-wide biochemistry including GSTU20.
