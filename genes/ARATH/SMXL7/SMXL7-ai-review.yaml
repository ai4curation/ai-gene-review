  review:
    summary: SMXL7 interacts with the SL receptor D14 in a GR24-enhanced manner (Y2H/co-IP).
    action: REMOVE
    reason: The interaction is real and central to SL signalling (SMXLs are the receptor's targets), but
      protein binding conveys no functional information about SMXL7 itself; its activity is represented
