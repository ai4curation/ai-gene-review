suggested_questions:
- question: Does the Clp-ATPase-like region of SMXL proteins bind or hydrolyse ATP, and does nucleotide
    state influence D14-SCF(MAX2) recognition?
- question: Which DNA-binding transcription factors (e.g. SPL, BES1, TCP partners) tether SMXL6/7/8 to
    BRC1 and other targets in axillary buds?
suggested_experiments:
- description: In vitro ATPase assays with purified SMXL7 (wild type versus Walker-motif mutants), combined
    with complementation of smxl6/7/8, to test whether ATPase activity contributes to repression.
  experiment_type: biochemistry and genetic complementation
