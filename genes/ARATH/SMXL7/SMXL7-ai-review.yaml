  label: Arabidopsis thaliana
description: SMAX1-LIKE7 (SMXL7; D53-like 1) is a nuclear Clp-ATPase-related (double Clp-N / P-loop NTPase
  domain) protein and the most influential member of the SMXL6/7/8 clade of strigolactone (SL)-regulated
  transcriptional co-repressors. Through an EAR motif it recruits TOPLESS/TPR co-repressors and represses
  target genes such as BRANCHED1 (BRC1), and it promotes PIN1 accumulation and auxin transport in the
  stem, allowing axillary bud outgrowth. SL perceived by the receptor D14 triggers SL-dependent association
  of nuclear SMXL7 with D14 and SCF(MAX2), followed by rapid polyubiquitination and proteasomal degradation;
  deletion of the conserved RGKT (P-loop) motif stabilises SMXL7 and confers a highly branched phenotype.
  SMXL7 functions in the nucleus, and part of its activity is independent of the EAR motif. It acts redundantly
  with SMXL6 and SMXL8 and also influences leaf shape, lateral root density and drought tolerance.
