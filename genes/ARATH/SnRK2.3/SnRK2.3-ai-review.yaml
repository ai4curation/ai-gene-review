core_functions:
- description: ABA- and osmotic-stress-activated serine/threonine protein kinase (subclass III SnRK2).
    Released from clade A PP2C inhibition when ABA-bound PYR/PYL receptors sequester the phosphatases,
    SnRK2.3 autophosphorylates its activation loop and phosphorylates ABRE-binding bZIP transcription
    factors (ABF1, ABF2/AREB1, ABI5) and other nuclear regulators (AKS bHLH factors, HAT1), transducing
    the ABA signal into ABRE-dependent gene expression.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0009738
    label: abscisic acid-activated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - *id001
  - *id012
  - *id006
  - *id004
  - *id017
- description: Redundantly with SnRK2.2, mediates ABA repression of seed germination, seed dormancy and
    seedling growth in seeds and seedlings, by phosphorylating and activating ABI5 and related ABFs; together
    with SnRK2.2 and SnRK2.6 it is required for drought and osmotic-stress tolerance.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0010187
    label: negative regulation of seed germination
  - id: GO:0009414
    label: response to water deprivation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
