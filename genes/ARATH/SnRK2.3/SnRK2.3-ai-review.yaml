  - reference_id: PMID:19541597
    supporting_text: SRK2D, SRK2E and SRK2I protein kinases involved in ABA signaling are essential for
      the control of seed development and dormancy
  - *id010
suggested_questions:
- question: Beyond expression differences, does SnRK2.3 differ from SnRK2.2 and SnRK2.6 in substrate preference
    in vivo (e.g. HAT1, FREE1), given that AtPP2-B11 selectively degrades SnRK2.3?
- question: Should SnRK2 substrate relationships (ABFs, ABI5, AKS1, HAT1, FREE1) be captured as has_input
    on the SnRK2.3 kinase activity in a GO-CAM rather than as interaction-based protein binding annotations?
suggested_experiments:
- description: Quantitative in vivo phosphoproteomics comparing snrk2.2 snrk2.6 (SnRK2.3 only) with snrk2.2
    snrk2.3 snrk2.6 seeds and roots, to define the substrates that SnRK2.3 alone can phosphorylate.
