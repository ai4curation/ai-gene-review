id: Q39193
gene_symbol: SnRK2.3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SnRK2.3 (SRK2I, At5g66880) is an ABA- and osmotic-stress-activated serine/threonine protein
  kinase of the plant-specific subclass III SnRK2 (SNF1-related protein kinase 2) family, closely related
  to SnRK2.2 (SRK2D) and SnRK2.6/OST1 (SRK2E). In the absence of ABA it is held inactive by clade A type
  2C protein phosphatases (ABI1, ABI2, HAB1, AHG1) that bind it and dephosphorylate its activation loop;
  when ABA-bound PYR/PYL/RCAR receptors inhibit these phosphatases, SnRK2.3 autophosphorylates its activation
  loop and becomes fully active. Active SnRK2.3 phosphorylates RXXS/T motifs in transcription factors,
  including the ABRE-binding bZIP factors ABF1, ABF2/AREB1 and ABI5, bHLH AKS factors and the HD-ZIP factor
  HAT1, as well as the ESCRT component FREE1, thereby driving ABA-responsive gene expression. It is expressed
  at low levels in most organs, particularly root tips, and acts in the nucleus and cytoplasm. Acting
  redundantly with SnRK2.2, it mediates ABA inhibition of seed germination and seedling root growth, seed
  dormancy and ABA-induced proline accumulation, with only a minor role in stomatal control; together
  with SnRK2.2 and SnRK2.6 it is required for essentially all ABA-activated kinase activity, drought and
  osmotic-stress tolerance, seed development and normal growth. Its abundance is limited by SCF(AtPP2-B11)-mediated
  proteasomal degradation, and its activity is also restrained by TOPP1/AtI-2.
