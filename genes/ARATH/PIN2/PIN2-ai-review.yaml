gene_symbol: PIN2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'PIN2 (PIN-FORMED 2; also EIR1, AGR1, WAV6) is a root-expressed member of the
  long PIN auxin efflux carrier family: a ten-transmembrane secondary transporter that exports
  indole-3-acetic acid (IAA) across the plasma membrane. PIN2 is expressed in the lateral
  root cap, epidermis and cortex of the root meristem and transition/elongation zones. In
  epidermal and lateral root cap cells it localizes to the apical (shootward) plasma membrane,
  and in young cortex cells to the basal (rootward) side, so it carries auxin from the root
  tip shootward through the outer tissues. This shootward stream, together with the AUX1 influx
  carrier, redistributes auxin to the lower flank of gravistimulated roots, and pin2 mutants
  are therefore root-agravitropic, wavy and ethylene-insensitive in the root. PIN2 polarity
  is set by phosphorylation of its central hydrophilic loop by PINOID/WAG AGC kinases, opposed
  by PP2A/PP6 phosphatases, and stabilized by NPH3-family MAB4/MEL proteins that limit lateral
  diffusion. Its abundance is controlled by endocytic recycling, ubiquitination and retromer-dependent
  vacuolar degradation, which is modulated asymmetrically during gravitropism.'
