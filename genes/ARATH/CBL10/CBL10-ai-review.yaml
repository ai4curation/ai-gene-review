gene_symbol: CBL10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: CBL10/SCaBP8 (SOS3-LIKE CALCIUM BINDING PROTEIN 8; At4g33000) is a calcineurin
  B-like (CBL) EF-hand calcium sensor of Arabidopsis thaliana, expressed mainly in shoots,
  with an extended N-terminal region that carries membrane-targeting information. CBL10 binds
  Ca2+ and interacts with the NAF domain of the protein kinase CIPK24/SOS2, enhancing SOS2
  activity in a Ca2+-dependent manner. A plasma-membrane pool recruits SOS2 to activate the
  Na+/H+ antiporter SOS1 in the shoot salt-stress response; CBL10 is itself phosphorylated
  by SOS2 (Ser237 in the paper's numbering), which stabilizes the complex. A tonoplast pool,
  targeted by S-acylation (PAT10), associates with CIPK24 at vacuolar membranes and is linked
  to Na+ sequestration; cbl10 mutants are salt hypersensitive but, unusually, accumulate less
  Na+. CBL10 also partners CIPK8 to activate SOS1, and has kinase-independent roles, binding
  and inhibiting the inward-rectifying K+ channel AKT1 and binding the chloroplast outer-envelope
  GTPase TOC34. CBL10 and CBL4/SOS3 are only partially redundant and mediate separable salt
  tolerance pathways.
