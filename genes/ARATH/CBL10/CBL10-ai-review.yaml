suggested_questions:
- question: Does the CBL10-CIPK24 complex regulate a tonoplast Na+ transporter (e.g. NHX-type antiporters or V-ATPase) directly,
    given that tonoplast Na+/H+ exchange was reported unaltered in scabp8 while cbl10 shows altered Na+ accumulation?
- question: Which of the dual localizations (plasma membrane versus tonoplast/endosomes) predominates in shoot cells in vivo,
    and does the N-terminal isoform difference (isoform 1 versus isoform 2) bias targeting?
- question: Is CBL10 inhibition of AKT1 physiologically relevant at native expression levels in roots, where CBL10 expression
    is low?
- question: Which partner kinase or effector mediates the SOS2/SOS3-independent role of CBL10 in reproductive development
    under salt?
suggested_experiments:
- description: Compare Na+/H+ exchange and Na+ content in tonoplast versus plasma-membrane vesicles from cbl10 lines complemented
    with compartment-restricted CBL10 variants (N-terminal targeting swaps) to separate the two branches.
- description: Test AKT1 inhibition in planta with native-promoter CBL10 complementation and AKT1-binding-deficient CBL10
    mutants under low-K+ conditions.
- description: Identify CBL10 interactors in flowers under salt (e.g. proximity labelling) to find the SOS-independent reproductive
    partner.
