core_functions:
- description: Shoot-predominant Ca2+ sensor that binds and activates CIPK24/SOS2 in a Ca2+-dependent
    manner and recruits it to the plasma membrane to activate the Na+/H+ antiporter SOS1;
    SOS2 phosphorylation of CBL10 stabilizes the complex.
  molecular_function:
    id: GO:0043539
    label: protein serine/threonine kinase activator activity
