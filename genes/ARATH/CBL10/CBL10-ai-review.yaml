suggested_questions:
- question: Are the plasma-membrane (Quan et al. 2007) and tonoplast (Kim et al. 2007; Batistic
    et al. 2010) localizations of CBL10 distinct pools with separable functions, and what
    controls partitioning between them?
- question: Which tonoplast transport process does the CBL10-CIPK24 complex regulate, given
    that cbl10 mutants accumulate less, not more, Na+?
- question: Is the AKT1 inhibition by CBL10 relevant in roots, where CBL10 expression is low?
suggested_experiments:
- description: Identify tonoplast phosphorylation targets of CBL10-CIPK24 by phosphoproteomics
    of tonoplast fractions from wild type, cbl10 and cipk24 under salt stress.
- description: Express CBL10 variants restricted to the plasma membrane or the tonoplast in
    cbl10 to test which pool rescues shoot salt sensitivity and Na+ accumulation.
