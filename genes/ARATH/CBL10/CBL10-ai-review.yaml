    supporting_text: SCABP8 is further shown to bind calcium, interact with SOS2 both in vitro
      and in vivo, recruit SOS2 to the plasma membrane, enhance SOS2 activity in a calcium-dependent
      manner, and activate SOS1 in yeast.
  - reference_id: PMID:19448033
    supporting_text: In vivo, this phosphorylation was induced by salt stress, occurred at
      the membrane, stabilized the SCaBP8-SOS2 interaction, and enhanced plasma membrane Na+/H+
      exchange activity.
- description: Tonoplast-associated Ca2+ sensor (targeted by S-acylation) that forms a CBL10-CIPK24
    complex at vacuolar membranes and is required for normal Na+ accumulation and salt tolerance.
    As a membrane-anchored partner of CIPK24, it acts as the adaptor that places the kinase at
    the tonoplast.
  molecular_function:
