  label: Arabidopsis thaliana
description: CBL10 (CALCINEURIN B-LIKE PROTEIN 10; also SCaBP8, SOS3-LIKE CALCIUM BINDING PROTEIN 8) is a four-EF-hand calcium
  sensor of the plant calcineurin B-like family. Unlike CBL4/SOS3 it is not N-myristoylated; instead an N-terminal hydrophobic
  extension anchors it to membranes, placing it at the plasma membrane and at the tonoplast and endosomes. Upon salt-induced
  Ca2+ signals, Ca2+-bound CBL10 binds the NAF/FISL motif of the CBL-interacting protein kinase CIPK24/SOS2 (and of CIPK8),
  relieves kinase autoinhibition, and recruits the kinase to membranes. At the plasma membrane the CBL10-CIPK24 complex activates
  the Na+/H+ antiporter SOS1 for Na+ extrusion, mainly in shoots, complementing the root-predominant CBL4/SOS3 branch; at
  the tonoplast the complex has been proposed to regulate vacuolar Na+ sequestration. CIPK24 phosphorylates CBL10 at a C-terminal
  serine (Ser-247 in isoform 1), which stabilizes the complex at the membrane and is required for full salt tolerance. Independently
  of CIPKs, CBL10 binds the K+ channel AKT1 and inhibits its inward K+ currents. Loss of CBL10 causes salt hypersensitivity
  in vegetative tissues with altered Na+ accumulation, and impairs reproductive development under salt.
