    supporting_text: This study shows that Arabidopsis CBL10, through protein S-acylation
      by protein S-acyl transferase10, targets to the vacuolar membrane to confer salt tolerance.
  - reference_id: PMID:19832944
    supporting_text: distinct targeting signals located in the N-terminal domain of CBL proteins
