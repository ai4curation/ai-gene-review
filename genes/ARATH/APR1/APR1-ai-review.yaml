- term:
    id: GO:0004604
    label: phosphoadenylyl-sulfate reductase (thioredoxin) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004511
  review:
    action: REMOVE
    summary: Shared reductase-domain homology does not confer PAPS/thioredoxin specificity on APR1.
    reason: The InterPro IPR004511 assignment is family/domain context, not proof of a common substrate
      and electron donor. Direct APR1 experiments distinguish APS turnover from apparent PAPS turnover
      caused by conversion to APS; the purified enzyme uses GSH, and the tested NADPH/thioredoxin/thioredoxin-reductase
      systems fail to sustain APR activity. This electronic substrate/donor claim is contradicted by target
      biochemistry, not rejected because of its evidence code. The correct APS/GSH activity is separately
      retained.
    supported_by:
    - reference_id: PMID:8917600
      supporting_text: This lag period is an indication that PAPS is not used directly by the APR1 enzyme,
        but must first be converted to APS.
    - *id001
