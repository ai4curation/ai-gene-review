id: P92979
gene_symbol: APR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: APR1 is a chloroplast-targeted Arabidopsis adenylyl-sulfate reductase that converts activated
  sulfate in APS to sulfite for assimilatory sulfur metabolism. Its reductase domain is fused to a C-terminal
  glutaredoxin-like redox domain, allowing glutathione to supply reducing equivalents without an external
  thioredoxin. APR1 belongs to a small plant APR family whose abundance and activity respond to sulfur
  and nitrogen supply.
