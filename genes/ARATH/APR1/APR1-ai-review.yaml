  - AGI_LocusCode:AT4G04610
  - AGI_LocusCode:AT4G21990
  - PANTHER:PTN008207357
  - UniProtKB:O05927
  review:
    action: ACCEPT
    summary: APR1 directly reduces activated sulfate in assimilatory sulfur metabolism.
    reason: Arabidopsis APR1 is a catalyst of the APS-to-sulfite step, not merely a sulfur substrate or
      a regulator. Recombinant APR1 activity and complementation of sulfate-assimilation-defective E.
      coli establish this direct participation (PMID:8917600, PMID:9653199). The IBA node is consistent
      with direct target biochemistry; occurrence of APR1 among descendant evidence is not circular.
    supported_by:
    - &id001
      reference_id: PMID:9653199
      supporting_text: The purified recombinant enzyme (APR1p) can use GSH efficiently as a hydrogen donor
        in vitro
    - &id002
      reference_id: PMID:8917600
      supporting_text: functionally complement a cysH, PAPS reductase mutant strain of Escherichia coli.
