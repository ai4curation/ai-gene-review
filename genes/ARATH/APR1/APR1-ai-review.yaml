      source_entities:
      - source_id: InterPro:IPR004511
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The shared PAPS/APS reductase domain occurs in APR1, but its target-specific substrate
          and reductant differ from the PAPS/thioredoxin annotation propagated from the signature.
