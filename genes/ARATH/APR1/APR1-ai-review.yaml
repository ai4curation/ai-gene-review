- term:
    id: GO:0033741
    label: adenylyl-sulfate reductase (glutathione) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:14141
  - EC:1.8.4.9
  review:
    action: ACCEPT
    summary: Glutathione-dependent APS reductase is APR1's core activity.
    reason: Purified recombinant APR1 uses GSH for APS reduction. Its C-terminal glutaredoxin-like domain
      transfers reducing equivalents to the catalytic domain; neither separated domain alone efficiently
      performs APS reduction, and mixing reconstitutes activity. This target-specific chemistry supports
      the electronic EC/Rhea mapping independently of database labels. Detached-domain insulin or ribonucleotide-reductase
      activities are not treated as whole-protein core functions.
    supported_by:
    - *id001
