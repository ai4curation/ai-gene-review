id: Q9LR30
gene_symbol: GGAT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  GGAT1 (glutamate:glyoxylate aminotransferase 1; also AOAT1/GGT1; At1g23310) is a peroxisomal,
  pyridoxal 5'-phosphate-dependent class-I aminotransferase of the alanine aminotransferase
  subfamily. It is the major leaf glutamate:glyoxylate aminotransferase of the photorespiratory C2
  cycle, transaminating glyoxylate (produced by glycolate oxidase) to glycine with glutamate as amino
  donor and releasing 2-oxoglutarate. The recombinant enzyme also catalyses alanine:glyoxylate,
  alanine:2-oxoglutarate and glutamate:pyruvate transaminations, but not serine:glyoxylate or
  aspartate transamination. GGAT1 carries a C-terminal type 1 peroxisomal targeting signal, and
  its activity is confined to peroxisomes. Knockout plants lose most leaf GGAT activity and show
  a mild, high-CO2-rescuable photorespiratory growth defect with altered glutamate and serine
  levels; the closely related GGAT2 (At1g70580) supplies residual activity. GGAT1 is also expressed in
  roots, and overexpression raises leaf serine, glycine and citrulline, indicating a wider role in
  amino acid metabolism.
