core_functions:
- description: >-
    Peroxisomal glutamate:glyoxylate aminotransferase of the photorespiratory C2 cycle, transaminating
    glyoxylate to glycine with glutamate as amino donor (the main leaf GGAT, with GGAT2 as partially
    redundant paralog).
  molecular_function:
    id: GO:0047958
    label: glycine:2-oxoglutarate transaminase activity
  directly_involved_in:
  - id: GO:0009853
    label: photorespiration
  - id: GO:0006545
    label: glycine biosynthetic process
  locations:
  - id: GO:0005777
    label: peroxisome
  supported_by:
  - reference_id: PMID:12529529
    supporting_text: >-
      Four aminotransferase activities were specifically associated with GGT1 and GGT2, using the
      substrate pairs glutamate (Glu):glyoxylate, Ala:glyoxylate, Glu:pyruvate, and
      Ala:2-oxoglutarate.
  - reference_id: PMID:12631323
    supporting_text: >-
      Based on these results, it was concluded that AOAT1 is targeted to peroxisomes, functions as a
      photorespiratory GGAT, plays a markedly important role for plant growth and the metabolism of
      amino acids.
  - reference_id: PMID:22303256
    supporting_text: >-
      In Arabidopsis, two loci encode peroxisomal glutamate:glyoxylate aminotransferases (At1g23310
      encoding GGAT1 and At1g70580 encoding GGAT2)
suggested_questions:
- question: >-
    What fraction of photorespiratory glycine in leaves is formed with alanine rather than glutamate as
    amino donor by GGAT1/GGAT2, given that the enzyme catalyses both reactions in vitro?
- question: >-
    What is the metabolic role of GGAT1 in roots and in darkness, where photorespiratory flux is
    absent?
suggested_experiments:
- description: >-
    Construct ggat1 ggat2 double mutants and measure air-sensitivity, leaf GGAT/AGT activities and
    15N-labelling of glycine from glutamate versus alanine, to quantify the contribution of each
    amino donor and test for further glyoxylate aminotransferases.
