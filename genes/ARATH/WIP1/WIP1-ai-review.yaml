core_functions:
- description: 'Plant KASH-side LINC anchor: WIP1 in the outer nuclear membrane binds SUN1/SUN2 through
    its perinuclear KASH-like tail and, via WIT2, connects the SUN-WIP bridge to the actin motor myosin
    XI-i, transmitting cytoplasmic force to the nuclear envelope to shape the nucleus.'
  molecular_function:
    id: GO:0140444
    label: cytoskeleton-nuclear membrane anchor activity
  directly_involved_in:
  - id: GO:0006997
    label: nucleus organization
  locations:
  - id: GO:0005640
    label: nuclear outer membrane
  supported_by:
  - reference_id: PMID:22270916
    supporting_text: we report that AtWIPs are plant-specific KASH proteins interacting with Arabidopsis
      SUN proteins (AtSUNs). The interaction is required for both AtWIP1 and AtRanGAP1 NE localization.
  - reference_id: PMID:25759303
    supporting_text: We show that WIT2, but not WIT1, plays an essential role in nuclear shape determination
      by recruiting myosin XI-i to the SUN-WIP NE bridges.
  - reference_id: PMID:22270916
    supporting_text: AtWIPs and AtSUNs are necessary for maintaining the elongated nuclear shape of Arabidopsis
      epidermal cells.
  - reference_id: PMID:26409047
    supporting_text: These data support a model where LINC complexes formed by SUN, WIP, and WIT at the
      VNE are responsible for VN migration
- description: 'RanGAP1 anchoring: with WIT proteins, WIP1 tethers the WPP-domain RanGAP1 to the nuclear
    envelope in undifferentiated root-tip cells.'
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  locations:
  - id: GO:0005640
    label: nuclear outer membrane
  supported_by:
  - reference_id: PMID:17600715
    supporting_text: In a wip1-1/wip2-1/wip3-1 triple mutant, RanGAP1 is dislocated from the NE in undifferentiated
      root-tip cells
  - reference_id: PMID:18591351
    supporting_text: the existence of a WIP-WIT heterocomplex required for anchoring RanGAP1 to the root
      tip NE is strongly supported
suggested_questions:
- question: The plant SUN-WIP(-WIT-myosin XI-i) bridge couples the nucleus to actin rather than microtubules.
    Should it be annotated to GO:0106094 nuclear membrane microtubule tethering complex, or does GO need
    a generic LINC complex term (not microtubule-specific) that plant SUN-WIP complexes can use?
  experts:
  - GO cellular component editors
  - TAIR curators
- question: SUN-anchored WIP-WIT complexes are required for pollen vegetative-nucleus migration (PMID:26409047),
    but the evidence is from dominant-negative SUN2 and wip1 wip2 wip3 wit1 wit2 quintuple mutants. Should
    WIP1 carry a nuclear migration process term (e.g. GO:0007097), or should this wait for paralog-resolved
    evidence?
  experts:
  - plant nuclear envelope biologists
- question: Is WIP1 homodimerization real in planta, given conflicting two-hybrid and co-IP results?
  experts:
  - Meier lab
  - TAIR curators
suggested_experiments:
- description: Structure or crosslinking analysis of AtSUN2 SUN domain with the WIP1 perinuclear tail
    (ending in VVPT) to compare with the canonical SUN-KASH PPPX groove interaction.
  hypothesis: The WIP KASH-like tail binds the SUN groove analogously to animal KASH peptides despite
    divergent sequence.
  experiment_type: structural biology
