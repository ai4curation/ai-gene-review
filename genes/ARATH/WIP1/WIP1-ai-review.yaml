gene_symbol: WIP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'WIP1 (WPP domain-interacting protein 1) is a plant-specific, tail-anchored protein of the
  outer nuclear membrane in Arabidopsis thaliana and one of three redundant WIP paralogs (WIP1, WIP2,
  WIP3). It has a cytoplasmic N-terminal region with a coiled-coil domain, a single C-terminal transmembrane
  segment, and a short perinuclear-space tail that functions as a KASH-like domain. Through this tail
  WIP1 binds the SUN domain of the inner-nuclear-membrane proteins SUN1 and SUN2 (and the mid-SUN proteins),
  forming the plant SUN-WIP LINC bridge; SUN binding is required for WIP1 retention at the nuclear envelope.
  On the cytoplasmic side WIP1 partners with the tail-anchored WIT proteins: WIT2 recruits the actin motor
  myosin XI-i, so the SUN-WIP-WIT2-myosin XI-i complex transmits cytoplasmic force to the nuclear envelope
  and is required for the elongated shape of epidermal nuclei. WIPs, together with WIT1/WIT2, also anchor
  RanGAP1 (via its plant-specific WPP domain) at the nuclear envelope of undifferentiated root-tip cells.
  WIP1 also colocalizes with RanGAP1 at the cell plate, and binds the kinesin AtPSS1 in two-hybrid and
  BiFC assays. In pollen, SUN-anchored WIP-WIT complexes at the vegetative nuclear envelope are needed
  for vegetative nucleus migration, pollen tube guidance and reception, and male fertility; most phenotypes
  are seen only when WIP1, WIP2 and WIP3 are lost together.'
