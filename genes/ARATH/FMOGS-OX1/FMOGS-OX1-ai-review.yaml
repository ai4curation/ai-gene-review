  review:
    summary: >-
      Phylogenetic (PAINT) inference of generic monooxygenase activity across the
      flavin-containing monooxygenase family. FMO GS-OX1 is a bona fide FAD/NADPH
      monooxygenase that inserts one oxygen atom into the thioether sulfur of
      methylthioalkyl glucosinolates.
    action: ACCEPT
    reason: >-
      Correct but general. The FMO family node is well placed and FMO GS-OX1, together
      with its characterized paralogs FMO GS-OX2 to GS-OX5 (among the donors), has
      demonstrated S-oxygenase activity. The specific glucosinolate S-oxygenase terms
      (GO:0080102-GO:0080107) are the informative descendants-in-spirit and are
      annotated separately with experimental evidence.
    supported_by:
