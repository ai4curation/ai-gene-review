  review:
    summary: >-
      AtSubP sequence-based subcellular prediction of nuclear localization.
    action: REMOVE
    reason: >-
      No experimental evidence places FMO GS-OX1 in the nucleus, UniProt records no
      nuclear localization signal or subcellular location, and a nuclear location is
      biologically implausible for a biosynthetic flavin monooxygenase acting on
      glucosinolates, which are synthesized by cytosolic/ER-associated enzymes. This is
      an unsupported machine prediction rather than an experimental annotation.
