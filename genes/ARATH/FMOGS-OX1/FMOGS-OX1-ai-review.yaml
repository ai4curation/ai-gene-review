- id: PMID:17461789
  title: Identification of a flavin-monooxygenase as the S-oxygenating enzyme in aliphatic glucosinolate
    biosynthesis in Arabidopsis.
  findings:
  - statement: Identifies FMO GS-OX1 as the enzyme converting methylthioalkyl to methylsulfinylalkyl glucosinolates,
      by recombinant enzyme assays, overexpression (near-complete conversion; ~5-fold more 4-methylsulfinylbutyl
      glucosinolate in seeds) and knockout analysis.
    supporting_text: We report the identification of an Arabidopsis flavin-monooxygenase (FMO) enzyme,
      FMO(GS-OX1), which catalyzes the conversion of methylthioalkyl GSLs into methylsulfinylalkyl GSLs.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterization paper; abstract only in cache. Source of all IDA/IMP S-oxygenase
      annotations.
- id: PMID:18799661
  title: Subclade of flavin-monooxygenases involved in aliphatic glucosinolate biosynthesis.
  findings:
  - statement: Defines the crucifer-specific FMO GS-OX1-5 subclade; FMO GS-OX1-4 have broad chain-length
      specificity (4-MTB and 8-MTO), GS-OX5 is 8-MTO-specific; FMO GS-OX1 requires the S-glucosyl group
      of its substrate; FMO GS-OX1 and GS-OX2 control 8-MSO production in planta.
    supporting_text: Interestingly, all five recombinant proteins converted 8-MTO to 8-MSO
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; independently reproduces FMO GS-OX1 activity and establishes paralog
      redundancy.
suggested_questions:
- question: Should GO:0080103–GO:0080107 replace the current longer-chain methylthiopropyl wording with
    methylthiobutyl, -pentyl, -hexyl, -heptyl and -octyl, and gain a substrate-class parent corresponding
    to EC 1.14.13.237/RHEA:42208? The current review proposes that parent activity and preserves all original
    sourced terms.
- question: Where in the cell does FMO GS-OX1 act (cytosol or ER surface), and does it physically associate
    with the ER-anchored cytochrome P450s of the glucosinolate core pathway?
- question: How is the S-oxygenation workload partitioned in planta among the redundant FMO GS-OX1-5 paralogs
    across tissues and developmental stages?
suggested_experiments:
- description: Determine subcellular localization of FMO GS-OX1 using a functional fluorescent-protein
    fusion expressed from its native promoter, co-imaged with ER and cytosolic markers.
- description: Generate higher-order fmo gs-ox1/2/3/4/5 mutants (e.g. by CRISPR) to test whether S-oxygenation
    of methylthioalkyl glucosinolates is fully abolished and to assign each paralog's in planta contribution
    by chain length and tissue.
- description: Obtain steady-state kinetic parameters for purified FMO GS-OX1 across C3-C8 methylthioalkyl
    glucosinolates and solve its structure to define the S-glucosyl recognition determinants.
proposed_new_terms:
- proposed_name: methylthioalkyl glucosinolate S-oxygenase activity
  proposed_definition: Catalysis of NADPH- and oxygen-dependent S-oxygenation of an omega-(methylsulfanyl)alkyl
    glucosinolate to the corresponding omega-(methylsulfinyl)alkyl glucosinolate.
  justification: The substrate-class reaction is EC 1.14.13.237 and RHEA:42208. Current GO chain-specific
    entries GO:0080103–GO:0080107 have chemically inconsistent propyl wording for longer chains; preserve
    those sourced annotations, but use this explicitly defined proposed activity for the broad-specificity
    core. The enzyme also accepts corresponding desulfoglucosinolates.
  proposed_parent:
    id: GO:0004497
    label: monooxygenase activity
  supported_by:
  - reference_id: PMID:17461789
    supporting_text: We report the identification of an Arabidopsis flavin-monooxygenase (FMO) enzyme,
      FMO(GS-OX1), which catalyzes the conversion of methylthioalkyl GSLs into methylsulfinylalkyl GSLs.
  - reference_id: PMID:18799661
    supporting_text: FMO GS-OX1 S -oxygenated desulfo and intact GSLs, but not the structurally related
      Met and aldoxime that do not contain an S -Glc group.
