- term:
    id: GO:0019761
    label: glucosinolate biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:17461789
  review:
    summary: >-
      FMO GS-OX1 catalyzes a step of aliphatic glucosinolate biosynthesis (side-chain
      S-oxygenation), but no biological process term is currently annotated in GOA.
    action: NEW
    reason: >-
      Participation test: FMO GS-OX1 itself catalyzes the conversion of methylthioalkyl
      to methylsulfinylalkyl glucosinolates, the first side-chain modification step of
      the pathway, so it performs part of the work of glucosinolate biosynthesis rather
      than merely being required for it. Comparator check: other enzymes catalyzing
      individual steps of aliphatic glucosinolate biosynthesis, e.g. the downstream
      side-chain-modifying dioxygenase AOP2 (Q945B5, IDA GO:0019761 from PMID:11251105),
      carry this term, and the process term is not an ancestor/descendant of the
      molecular function terms already present. The more specific child terms do not
      cover S-oxygenated aliphatic glucosinolates, so the general term is appropriate.
    supported_by:
    - reference_id: PMID:17461789
      supporting_text: >-
        Identification of a flavin-monooxygenase as the S-oxygenating enzyme in aliphatic
        glucosinolate biosynthesis in Arabidopsis.
    - reference_id: PMID:18799661
      supporting_text: >-
        This suggests that this cluster of FMOs is involved in GSL biosynthesis and that
        the enzymes have evolved different substrate specificities.
