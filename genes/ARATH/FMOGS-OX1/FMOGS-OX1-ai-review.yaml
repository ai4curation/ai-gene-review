  - statement: Defines the crucifer-specific FMO GS-OX1-5 subclade; FMO GS-OX1-4 have
      broad chain-length specificity (4-MTB and 8-MTO), GS-OX5 is 8-MTO-specific; FMO
      GS-OX1 requires the S-glucosyl group of its substrate; FMO GS-OX1 and GS-OX2 control
      8-MSO production in planta.
    supporting_text: >-
      Interestingly, all five recombinant proteins converted 8-MTO to 8-MSO
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; independently reproduces FMO GS-OX1 activity and
      establishes paralog redundancy.
suggested_questions:
- question: The GO labels for GO:0080103-GO:0080107 read "N-methylthiopropyl glucosinolate
    S-oxygenase" for chain lengths 4-8, although the substrates are methylthiobutyl,
    -pentyl, -hexyl, -heptyl and -octyl glucosinolates. Should these labels be corrected,
    or the chain-length-specific terms be merged under a single "methylthioalkyl
    glucosinolate S-oxygenase activity" (EC 1.14.13.237) term? The chain-length terms fit a
    broad-specificity enzyme poorly; GO:0080103 is used as the core MF here only as one
    representative of GO:0080102-GO:0080107, all of which GOA carries for this protein, and a
    single parent term would serve better.
- question: Where in the cell does FMO GS-OX1 act (cytosol or ER surface), and does it
    physically associate with the ER-anchored cytochrome P450s of the glucosinolate core
    pathway?
- question: How is the S-oxygenation workload partitioned in planta among the redundant
    FMO GS-OX1-5 paralogs across tissues and developmental stages?
suggested_experiments:
- description: Determine subcellular localization of FMO GS-OX1 using a functional
    fluorescent-protein fusion expressed from its native promoter, co-imaged with ER and
    cytosolic markers.
- description: Generate higher-order fmo gs-ox1/2/3/4/5 mutants (e.g. by CRISPR) to test
    whether S-oxygenation of methylthioalkyl glucosinolates is fully abolished and to
    assign each paralog's in planta contribution by chain length and tissue.
- description: Obtain steady-state kinetic parameters for purified FMO GS-OX1 across C3-C8
    methylthioalkyl glucosinolates and solve its structure to define the S-glucosyl
    recognition determinants.
