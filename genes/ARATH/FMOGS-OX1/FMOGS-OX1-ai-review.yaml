gene_symbol: FMOGS-OX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  FMO GS-OX1 (At1g65860) is a FAD- and NADPH-dependent flavin-containing monooxygenase
  of the crucifer-specific FMO GS-OX subclade (clade III plant FMOs) that catalyzes the
  S-oxygenation of methylthioalkyl glucosinolates to methylsulfinylalkyl glucosinolates
  in methionine-derived (aliphatic) glucosinolate biosynthesis. This side-chain
  modification converts, for example, 4-methylthiobutyl glucosinolate (glucoerucin)
  into 4-methylsulfinylbutyl glucosinolate (glucoraphanin), the precursor of the
  isothiocyanate sulforaphane, and supplies the methylsulfinylalkyl substrates that
  2-oxoglutarate-dependent dioxygenases (AOP2/AOP3) further convert to alkenyl or
  hydroxyalkyl glucosinolates. The enzyme acts on both desulfo- and intact
  glucosinolates independent of side-chain length (C3 to C8) and requires the
  S-glucosyl moiety, as it does not oxygenate methionine, chain-elongated methionines
  or the aldoxime intermediate. It is expressed mainly in leaves and acts redundantly
  with the paralogs FMO GS-OX2 to GS-OX5; overexpression drives almost complete
  conversion of methylthioalkyl to methylsulfinylalkyl glucosinolates.
