      supporting_text: >-
        We report the identification of an Arabidopsis flavin-monooxygenase (FMO)
        enzyme, FMO(GS-OX1), which catalyzes the conversion of methylthioalkyl GSLs
        into methylsulfinylalkyl GSLs.
    - reference_id: PMID:18799661
      supporting_text: >-
        FMO GS-OX2 to FMO GS-OX4 are able to catalyze the S -oxygenation independent of
        chain length, as was observed for FMO GS-OX1
- term:
    id: GO:0004499
    label: N,N-dimethylaniline monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR020946
  review:
    summary: >-
      InterPro2GO mapping from the flavin monooxygenase-like domain (IPR020946) to the
      mammalian xenobiotic FMO activity (N,N-dimethylaniline N-oxygenation, EC
      1.14.13.8).
    action: MODIFY
    reason: >-
      The domain-based mapping transfers the mammalian drug-metabolizing FMO reaction,
      which has never been shown for FMO GS-OX1. The plant enzyme has a restricted
      substrate specificity requiring the S-glucosyl group of glucosinolates, and it
      S-oxygenates (rather than N-oxygenates) its substrates. The essence (NADPH/FAD
      flavin monooxygenase) is correct, so the annotation should be replaced by the
      experimentally supported glucosinolate S-oxygenase activity.
    proposed_replacement_terms:
    - id: GO:0080103
      label: 4-methylthiopropyl glucosinolate S-oxygenase activity
    supported_by:
    - reference_id: PMID:18799661
      supporting_text: >-
        The enzyme FMO GS-OX1 was shown to have substrate specificity in that it
        required an S -Glc group on its substrates ( Hansen et al., 2007 ). FMO GS-OX1
        S -oxygenated desulfo and intact GSLs, but not the structurally related Met and
        aldoxime that do not contain an S -Glc group.
    - reference_id: PMID:18799661
      supporting_text: >-
        In animals, there are five functionally expressed FMO genes that detoxify a vast
        spectrum of xenobiotics.
