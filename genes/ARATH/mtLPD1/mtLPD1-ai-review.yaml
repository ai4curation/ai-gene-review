core_functions:
- description: L protein of the mitochondrial glycine decarboxylase complex. This
    FAD flavoprotein reoxidizes the dihydrolipoyl arm of the H protein with NAD+,
    producing NADH and completing each glycine cleavage cycle. mtLPD1 is the main
    L isoform of the leaf complex and the predominant mtLPD in photorespiration.
  supported_by:
  - reference_id: PMID:22303256
    supporting_text: This reaction is catalyzed by L-protein, a homodimeric dihydrolipoamide
      dehydrogenase (EC 1.8.1.4).
  - reference_id: PMID:32311173
    supporting_text: The Arabidopsis GDC contains four times more of the isoforms GCS-P1
      and GCS-L1 in comparison with GCS-P2 and GCS-L2
  - reference_id: PMID:41990722
    supporting_text: While the two mtLPDs both contribute to photorespiration, mtLPD1
      plays a more predominant role, especially under high-light stress.
