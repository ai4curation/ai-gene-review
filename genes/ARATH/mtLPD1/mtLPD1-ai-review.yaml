suggested_questions:
- question: Does the Liu et al. (2026) mtlpd1 mutant analysis include a complete loss
    of mtLPD1, or only knockdown alleles? If complete loss is viable and only conditionally
    photorespiratory, what level of GDC L-protein activity does mtLPD2 provide in leaves?
- question: Should TAIR or GO capture the branched-chain 2-oxoacid dehydrogenase role
    of mtLPD1 (redundant with mtLPD2 in BCAA degradation during carbon starvation)
    once the full text of PMID:41990722 is available?
- question: Do the Timm et al. (2015) L-protein overexpression lines (PsL-L2, PsL-L3)
    carry the Arabidopsis mtLPD1 cDNA or the pea mitochondrial LPD? Later papers call
    them mtLPD1 overexpressors.
suggested_experiments:
- description: Isoform-specific peptide quantification of the E3 bound to purified
    GDC versus PDC, OGDC and BCKDC from leaf and root mitochondria.
  hypothesis: mtLPD1 dominates the leaf GDC, while the 2-oxoacid dehydrogenase complexes
    use both isoforms in proportion to their abundance in the tissue.
  experiment_type: quantitative proteomics
- description: Measure leaf glycine decarboxylation and photorespiratory CO2 release
    in mtlpd1 and mtlpd2 single mutants and in mtlpd1 complemented with mtLPD2 driven
    by the mtLPD1 promoter.
  hypothesis: The photorespiratory deficit of mtlpd1 reflects the dose of L protein
    in leaf mitochondria, not an isoform-specific property, so mtLPD2 at mtLPD1 levels
    rescues it.
  experiment_type: genetic complementation
