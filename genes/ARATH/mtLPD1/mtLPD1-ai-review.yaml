taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  At1g48030 encodes mtLPD1, one of two mitochondrial dihydrolipoyl dehydrogenases
  (lipoamide dehydrogenase, E3, L protein, EC 1.8.1.4) in Arabidopsis. It should
  not be confused with the plastid lipoamide dehydrogenases. mtLPD1 is a
  homodimeric FAD flavoprotein of the class-I pyridine nucleotide-disulfide
  oxidoreductase family. It has a redox-active disulfide and uses NAD+ to
  reoxidize the dihydrolipoyl groups carried on the lipoyl domains of partner
  proteins, producing NADH. After import via an N-terminal transit peptide it
  resides in the mitochondrial matrix. There the mitochondrial E3 serves the
  glycine decarboxylase complex (GDC), where it is the L protein that reoxidizes
  the H-protein lipoyl arm, and the pyruvate, 2-oxoglutarate and branched-chain
  2-oxoacid dehydrogenase complexes. mtLPD1 is the main L protein of the leaf
  GDC. Its transcript is abundant in green leaves and strongly light-induced, the
  leaf GDC contains about four times more mtLPD1 than its 94%-identical paralog
  mtLPD2 (At3g17240), and loss-of-function mutants show that mtLPD1 has the
  predominant role in photorespiration, especially under high light. The two
  paralogs are partly redundant: they overlap in branched-chain 2-oxoacid
  degradation and together are needed for gametophyte development. The activity
  of mtLPD1 is inhibited by NADH and is redox-regulated by mitochondrial
  thioredoxins.
