- term:
    id: GO:0019464
    label: glycine decarboxylation via glycine cleavage system
  evidence_type: TAS
  original_reference_id: PMID:22303256
  review:
    summary: As the GDC L protein, mtLPD1 catalyses the last step of the glycine cleavage
      cycle, the NAD+-dependent reoxidation of the reduced lipoyl arm of the H protein.
    action: NEW
    reason: Participation test - the L protein catalyses one of the three enzymatic
      steps of the glycine cleavage system and so does part of the work of the process.
      It is not merely required for it. Comparator check (QuickGO) - pea mitochondrial
      LPD P31023 carries GO:0019464 by IDA and yeast LPD1 by RCA, and the sibling GDC
      subunit reviews (GLDP1, GLDP2, GDCST, GDCH) accept the term. GOA has no glycine
      cleavage process annotation for either Arabidopsis mitochondrial LPD. mtLPD1-specific
      support comes from its predominance in the leaf GDC (PMID:32311173) and its predominant
      role in photorespiration in mutants (PMID:41990722). The term is not an ancestor
      or descendant of GO:0009853 photorespiration, which is proposed separately.
    supported_by:
    - reference_id: PMID:22303256
      supporting_text: This reaction is catalyzed by L-protein, a homodimeric dihydrolipoamide
        dehydrogenase (EC 1.8.1.4).
    - reference_id: PMID:22303256
      supporting_text: two genes each for P-protein (At4g33010 and At2g26080) and L-protein
        (At3g17240 and At1g48030)
    - reference_id: PMID:32311173
      supporting_text: The Arabidopsis GDC contains four times more of the isoforms
        GCS-P1 and GCS-L1 in comparison with GCS-P2 and GCS-L2
- term:
    id: GO:0009853
    label: photorespiration
  evidence_type: IMP
  original_reference_id: PMID:41990722
  review:
    summary: Loss-of-function mutant analysis of the two Arabidopsis mtLPDs shows
      that both contribute to photorespiration and that mtLPD1 has the predominant
      role, especially under high light.
    action: NEW
    reason: Participation test - mtLPD1 catalyses a step of the photorespiratory C2
      cycle (reoxidation of the H-protein lipoyl arm in mitochondrial glycine decarboxylation),
      so it does part of the work of the process. It is not merely required for it.
      Comparator check (QuickGO, Arabidopsis, GO:0009853) - enzymes for other C2-cycle
      steps carry the term (SHM1, GLYK, HPR, GGAT1, PLGG1), whereas no GDC subunit does
      in GOA. The sibling reviews GLDP1, GLDP2, GDCST and GDCH each add this term as
      NEW. Unlike mtLPD2, for which no NEW photorespiration row was proposed, mtLPD1
      has gene-specific evidence - mutant analysis showing it is the predominant isoform
      for photorespiration, the 4-fold excess of L1 over L2 in the leaf GDC, and strong
      leaf and light-induced expression. The mutant paper is abstract-only, so allele
      details and assays could not be checked; the claim is stated directly in the
      abstract. Not an ancestor or descendant of GO:0019464.
    supported_by:
    - reference_id: PMID:41990722
      supporting_text: While the two mtLPDs both contribute to photorespiration, mtLPD1
        plays a more predominant role, especially under high-light stress.
    - reference_id: PMID:38861078
      supporting_text: in illuminated, photosynthesizing tissue a vast amount of mtLPD1
        is necessary for glycine decarboxylase (GDC), the key enzyme of photorespiration
    - reference_id: PMID:32311173
      supporting_text: The Arabidopsis GDC contains four times more of the isoforms
        GCS-P1 and GCS-L1 in comparison with GCS-P2 and GCS-L2
