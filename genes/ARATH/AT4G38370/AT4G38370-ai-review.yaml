suggested_questions:
- question: Does purified AT4G38370 have phosphatase or phosphotransferase activity, and on which phosphomonoester
    substrates (sugar bisphosphates, phosphoglycerates, phosphopeptides)?
- question: Is the PTHR47821 family, shared by plants, algae and halophilic bacteria, functionally uniform,
    and was it acquired in plants by horizontal transfer?
suggested_experiments:
- description: Express recombinant AT4G38370 and its H17A mutant and screen a phosphometabolite panel
    for phosphate release or phosphotransfer, followed by kinetic analysis of any active substrate.
- description: Determine subcellular localization with a C-terminal fluorescent-protein fusion under
    the native promoter, and characterize T-DNA null alleles.
