  label: Arabidopsis thaliana
description: >-
  AT4G38370 encodes a 225-residue protein of the histidine phosphatase superfamily, branch (clade) 1,
  the structural class that includes cofactor-dependent phosphoglycerate mutases, fructose-2,6-bisphosphatases
  and several protein and small-molecule phosphatases. It carries a single His_Phos_1 domain spanning
  most of the chain, with the N-terminal RHG motif (His17) that contains the nucleophilic histidine in
  active members of this class, and a second conserved histidine-containing segment near the C terminus
  (SHGD, His173). It belongs to PANTHER family PTHR47821, a family of uncharacterized proteins found in
  land plants, algae and some bacteria that is distinct from the PANTHER families containing the
  characterized phosphoglycerate mutases, TIGAR or other clade-1 enzymes. No member of this family has
  been characterized experimentally, and the substrate, catalytic activity, subcellular location and
  biological role of AT4G38370 are unknown. The protein has been detected in proteomic surveys.
