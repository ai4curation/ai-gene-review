id: Q0WW53
gene_symbol: AT4G38370
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  AT4G38370 encodes a 225-residue protein made of a single histidine-phosphatase
  superfamily branch-1 domain (the phosphoglycerate-mutase-like fold, Pfam
  PF00300). It belongs to PANTHER family PTHR47821, a lineage found in land
  plants, green and other algae, choanoflagellates, fungi and some bacteria that
  has no experimentally characterised member. The protein retains the catalytic
  apparatus of the fold: the N-terminal RHG motif histidine (His17) that forms
  the phosphohistidine intermediate, the glutamate proton donor/acceptor (Glu109)
  and the C-terminal histidine (His173) that stabilises the transition state, so
  it is probably an active phosphotransfer enzyme (a phosphomonoesterase or
  mutase). Its substrate, its reaction (hydrolysis versus intramolecular
  transfer), its subcellular location and its biological role have not been
  established experimentally. The protein has been detected by proteomics.
references:
- id: PMID:19015259
  title: Structural and biochemical studies of TIGAR (TP53-induced glycolysis and apoptosis regulator).
  findings:
  - statement: Direct TIGAR biochemistry establishes donor activity and substrate discrimination, not
      the substrate of the Arabidopsis protein.
    supporting_text: 'The

      recombinant human and zebra fish enzymes hydrolyze fructose-2,6-bisphosphate as

      well as fructose-1,6-bisphosphate but not fructose 6-phosphate in vitro.'
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Primary TIGAR enzymology, checked against the cached abstract. TIGAR sits in
      a different PANTHER family (PTHR46517) from AT4G38370 (PTHR47821), so it is a
      fold-level comparator only and is not used to support any function of
      AT4G38370 in the 2026-10-21 re-review. Relevance lowered from HIGH to LOW
      for that reason; the reference is retained for provenance. It illustrates
      that branch-1 histidine phosphatases discriminate among phosphosugar
      substrates, which is why no substrate is transferred here.
- id: PMID:22223895
  title: Comparative large scale characterization of plant versus mammal proteins reveals similar and
    idiosyncratic N-α-acetylation features.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
