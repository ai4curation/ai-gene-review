existing_annotations: []
core_functions:
- description: >-
    Predicted histidine-dependent phosphotransfer catalysis by a histidine
    phosphatase superfamily branch-1 domain. The fold's catalytic residues are
    retained (RHG-motif His17 nucleophile, Glu109 proton donor/acceptor, His173
    transition-state stabiliser), but the substrate and whether the reaction is a
    hydrolysis or a mutase-type transfer are unknown, so no GO molecular function
    more specific than catalytic activity can be justified. No molecular function
    term is asserted.
  supported_by:
  - reference_id: file:ARATH/AT4G38370/AT4G38370-bioinformatics/RESULTS-rereview.md
    supporting_text: "| Active site: Tele-phosphohistidine intermediate |  | H11 | H17 |"
  - reference_id: file:ARATH/AT4G38370/AT4G38370-bioinformatics/RESULTS-rereview.md
    supporting_text: "| Active site: Proton donor/acceptor |  | E89 | E109 |"
  - reference_id: file:ARATH/AT4G38370/AT4G38370-uniprot.txt
    record_section: ["DR:Pfam"]
    supporting_text: "DR   Pfam; PF00300; His_Phos_1; 1."
  knowledge_gaps:
  - gap_statement: >-
      The substrate and reaction of AT4G38370, and of PANTHER family PTHR47821 as
      a whole, are unknown; no member of the family has been assayed.
    boundary: >-
      Membership of the histidine phosphatase superfamily branch 1 and retention
      of its catalytic histidine/glutamate/histidine apparatus are established by
      sequence. Characterised branch-1 enzymes in other families act on different
      substrates (2,3-bisphosphoglycerate-dependent phosphoglycerate mutases,
      fructose-2,6-bisphosphatases, broad-specificity phosphatases), so the fold
      does not identify a substrate.
    gap_kind:
    - BIOLOGY
    provenance:
    - reference_id: file:ARATH/AT4G38370/AT4G38370-deep-research-falcon.md
      supporting_text: Exact searches for AT4G38370 and Q0WW53 found no gene-specific biochemical study.
suggested_questions:
- question: Which phosphomonoester substrates, if any, are turned over by purified AT4G38370?
- question: >-
    Is the PTHR47821 lineage a phosphatase (hydrolase) or a cofactor-dependent
    mutase, and is its substrate conserved between the plant, algal, fungal and
    bacterial members?
- question: >-
    The TAIR GO rows for this locus (ND molecular function, ND biological
    process, nucleus by ISM) sit on the reference-proteome entry F4JTN4, which is
    identical in sequence to Q0WW53; should annotation for At4g38370 be
    consolidated on F4JTN4?
suggested_experiments:
- hypothesis: >-
    AT4G38370 is an active histidine-dependent phosphatase or mutase whose
    activity depends on His17.
  description: >-
    Express recombinant AT4G38370 and an H17A mutant; screen a phosphometabolite
    panel (2,3-bisphosphoglycerate and 2-/3-phosphoglycerate with and without
    2,3-BPG cofactor, sugar phosphates and bisphosphates, phosphoserine,
    glycerol phosphates, nucleotides, p-nitrophenyl phosphate) across a pH range,
    measuring phosphate release and products by LC-MS, and compare kinetics of
    wild type and mutant.
  experiment_type: in vitro enzyme activity screen with catalytic mutant
- hypothesis: The physiological substrate of AT4G38370 accumulates in loss-of-function plants.
  description: >-
    Untargeted and targeted phosphometabolite profiling of independent
    AT4G38370 null alleles versus wild type, with complementation by the wild
    type and the H17A allele; determine subcellular location with a native
    promoter fluorescent fusion.
  experiment_type: metabolomics of loss-of-function mutants with localization
