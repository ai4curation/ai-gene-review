    summary: Catalytic activity is a novel term for this gene, whose only molecular-function annotation
      (on the identical entry F4JTN4) is ND. Local alignment maps the curated phosphohistidine nucleophile,
      proton donor/acceptor and transition-state stabilizer of human PGAM1 and E. coli GpmA onto His17,
      Glu109 and His173 of Q0WW53, so the catalytic apparatus of the histidine-phosphatase fold is retained
      and enzymatic activity is plausible. However, these comparators lie outside PANTHER PTHR47821, no
      member of that family has been assayed, and PubMed searches for At4g38370, Q0WW53 and F4JTN4 return
      no functional study. Residue retention does not prove activity, and both gene reviews decline to
      assert any molecular-function term, so the prediction can be neither validated nor refuted.
