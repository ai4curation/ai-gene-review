id: Q0WW53
gene_symbol: AT4G38370
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
status: COMPLETE
description: AT4G38370 (Q0WW53, sequence-identical to F4JTN4) is a single-domain histidine-phosphatase
  superfamily branch-1 protein in PANTHER family PTHR47821, which has no experimentally characterized
  member. It retains the RHG-motif nucleophile histidine, the proton donor/acceptor glutamate and the
  C-terminal transition-state histidine of the fold, so catalytic activity is plausible, but no assay of
  the protein or of any family member establishes it, and the gene carries only an ND molecular-function
  annotation.
