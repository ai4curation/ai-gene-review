taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'WHIRLY3 (WHY3) is a nuclear-encoded member of the plant-specific Whirly family of single-stranded
  DNA-binding proteins. It carries an N-terminal chloroplast transit peptide and is located in chloroplasts, where
  it associates with plastid nucleoids; in organello import shows it can also enter mitochondria. Like its plastid
  paralog WHY1, it folds into the Whirly domain and assembles into tetramers that bind ssDNA without sequence specificity.
  WHY1 and WHY3 act redundantly to maintain plastid genome stability: plants lacking both accumulate plastid DNA
  rearrangements generated by recombination between short direct repeats (microhomology-mediated break-induced replication),
  especially after double-strand breaks are induced, leading to maternally inherited leaf variegation. WHY3 is also
  captured in RNA-interactome studies, and a nuclear pool has been reported to bind, with WHY1, an upstream element
  of the kinesin gene AtKP1 and repress its transcription.'
