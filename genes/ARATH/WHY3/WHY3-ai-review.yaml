core_functions:
- description: Plastid single-stranded DNA-binding Whirly tetramer that, redundantly with WHY1, binds plastid DNA
    at nucleoids and protects the plastid genome against microhomology-mediated illegitimate recombination during
    double-strand break repair, favouring accurate repair.
  molecular_function: *id019
  directly_involved_in:
  - *id011
  locations:
  - id: GO:0042644
    label: chloroplast nucleoid
  supported_by:
  - *id001
  - reference_id: PMID:19666500
    supporting_text: We suggest that AtWhy1 and AtWhy3 function as antirecombination proteins, contributing to safeguard
      plastid genome integrity.
  - *id009
  - *id010
  - *id016
suggested_questions:
- question: Should WHY1/WHY3 carry negative regulation of DNA recombination (GO:0045910), given that they are proposed
    to act as antirecombination factors by coating ssDNA, or is the double-strand break repair term sufficient?
- question: Does WHY3 have a physiologically meaningful nuclear pool, and does it act in the nucleus independently
    of WHY1 (e.g. at the AtKP1 element)?
- question: Does WHY3 compensate for WHY2 in mitochondria in vivo, given its in organello import into mitochondria?
suggested_experiments:
- description: Complement why1 why3 with WHY3 alone (wild type and a KGKAAL second-lysine mutant) to test whether
    WHY3 by itself restores ciprofloxacin resistance and plastid genome stability, independent of WHY1.
- description: Use endogenous-promoter WHY3-tagged lines with chloroplast, mitochondrial and nuclear fractionation
    (with cross-contamination markers) to quantify the WHY3 pool in each compartment.
