- term:
    id: GO:1901347
    label: negative regulation of secondary cell wall biogenesis
  evidence_type: IMP
  original_reference_id: PMID:25228083
  qualifier: acts_upstream_of_or_within
  review:
    summary: TAIR IMP from Kim et al. 2014. The paper's secondary-wall result
      (overexpression, full text via Wiley passages) is "early and aberrant phloem fiber
      development", and its Figure 7 is titled "Enhanced phloem fiber formation in
      35S::AtC3H14 plants". Chai et al. 2015 show thinner stem secondary walls in
      c3h14 c3h15 and thicker, ectopic walls on overexpression.
    action: MODIFY
    reason: The process is right, but the sign is reversed. The source paper itself
      reports enhanced, ectopic phloem-fiber secondary walls on overexpression (Results,
      Figure 7). Its knockdown (AtC3H14-RNAi/atc3h15-1) had no phenotype. The independent
      loss- and gain-of-function study PMID:25732536 shows that C3H14/C3H15 promote
      secondary wall thickening. No data in either paper show C3H14 reducing secondary
      wall formation. The corrected term is positive regulation of secondary cell wall
      biogenesis (GO:1901348). This is a lateral sign correction, not a refinement.
    proposed_replacement_terms:
    - id: GO:1901348
      label: positive regulation of secondary cell wall biogenesis
    supported_by:
    - reference_id: PMID:25228083
      supporting_text_fulltext: Enhanced phloem fiber formation in 35S::AtC3H14 plants
      full_text_unavailable: true
    - reference_id: PMID:25228083
      supporting_text_fulltext: plants had early and aberrant phloem fiber development
      full_text_unavailable: true
    - reference_id: PMID:25732536
      supporting_text: Plants with double, but not single, T-DNA mutants for C3H14 or
        C3H15 have few pollen grains and thinner stem secondary walls than the wild type.
    - reference_id: PMID:25732536
      supporting_text: Overexpression of C3H14 or C3H15 led to increased secondary wall
        thickness in stems and the ectopic deposition of secondary walls in various
        tissues
    source_defects:
    - defect_type: WRONG_TERM
      resource: TAIR
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:1901347
      corrected_value: GO:1901348
      corrected_label: positive regulation of secondary cell wall biogenesis
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The TAIR IMP row for AT1G66810 from PMID:25228083 (Kim et al. 2014) asserts
        negative regulation of secondary cell wall biogenesis. The paper's only
        secondary-wall phenotype is from 35S::AtC3H14 overexpression: early and aberrant
        phloem fiber development in stems and roots (Figure 7, "Enhanced phloem fiber
        formation in 35S::AtC3H14 plants"). Its AtC3H14-RNAi/atc3h15-1 lines showed no
        phenotypic change. Chai et al. 2015 (PMID:25732536) show thinner stem secondary
        walls in c3h14 c3h15 double mutants and increased, ectopic secondary walls on
        overexpression. Positive regulation (GO:1901348) appears to be intended. The
        paper's cell-elongation phenotype (GO:0051511) is a separate annotation and is
        not affected. Confidence is PROBABLE because Figure 7 itself was not viewed; the
        text was read through publisher full-text passages.
      supported_by:
      - reference_id: PMID:25732536
        supporting_text: Overexpression of C3H14 or C3H15 led to increased secondary wall
          thickness in stems and the ectopic deposition of secondary walls in various
          tissues
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:35736512
  review:
    summary: Subcellular fractionation detects both phosphorylated and dephosphorylated
      Myc-C3H14 in the cytoplasm. MPK4 interacts with C3H14 in the cytoplasm (BiFC), and
      At1g66810-GFP forms cytoplasmic foci in protoplasts.
    action: NEW
    reason: Two independent experiments place C3H14 in the cytoplasm, where TTP-family
      proteins carry out mRNA decay. The foci resemble P-bodies, but colocalization of
      C3H14 itself with a P-body marker has not been shown in the sources available
      (the DCP1/P-body result in PMID:41758611 is stated for C3H15). For that reason
      cytoplasm is proposed rather than P-body.
    supported_by:
    - reference_id: PMID:35736512
      supporting_text: both phosphorylated and dephosphorylated forms of C3H14 protein were
        detected in the cytoplasm, but only the dephosphorylated form was detected in the
        nucleus
    - reference_id: PMID:19897605
      supporting_text: the two closest hTTP homologs, At1g66810 and At1g68200, were also
        localized in cytoplasmic foci
- term:
    id: GO:0061158
    label: 3'-UTR-mediated mRNA destabilization
  evidence_type: IMP
  original_reference_id: PMID:42844995
  review:
    summary: C3H14 binds a poly(U) motif in the IAMH2 3' UTR and represses a LUC reporter
      carrying that 3' UTR. IAMH2 mRNA is elevated in c3h14 c3h15. Two independent 2026
      studies show that C3H14/C3H15 are required for programmed mRNA clearance in male
      meiocytes and associate with P-body proteins and CCR4-NOT.
    action: NEW
    reason: >-
      C3H14 passes the participation test. It is the RNA-binding component that
      recognises the 3' UTR element and links the transcript to the decay machinery
      (P-body proteins, CCR4-NOT; PMID:42711403), as for its family comparators: human
      ZFP36/TTP is the archetype for this term. Three groups support decay of bound
      targets (PMID:42844995, PMID:41758611, PMID:42711403). Two limits apply. No source
      available here reports a direct C3H14-specific mRNA half-life measurement, and
      PMID:41758611 and PMID:42711403 are abstract-only in the cache. If a stricter
      reading is wanted, regulation of mRNA stability (GO:0043488) is the fallback.
    supported_by:
    - reference_id: PMID:42844995
      supporting_text: bind directly to this region to enhance posttranscriptional
        repression
    - reference_id: PMID:42844995
      supporting_text: IAMH2 expression was significantly elevated in the mutant compared
        with Col
    - reference_id: PMID:41758611
      supporting_text: Our findings establish mRNA decay mediated by C3H14/15 as a
        critical regulatory mechanism safeguarding meiosis in plants
    - reference_id: PMID:42711403
      supporting_text: C3H14/C3H15 interacts with processing-body proteins and the CCR4-NOT
        deadenylase complex, and is required for eliminating unwanted transcripts
- term:
