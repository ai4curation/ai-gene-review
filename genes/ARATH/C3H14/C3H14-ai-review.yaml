- term:
    id: GO:1900425
    label: negative regulation of defense response to bacterium
  evidence_type: IMP
  original_reference_id: PMID:35736512
  review:
    summary: c3h14 c3h15 double mutants are more resistant to Pst DC3000 and show
      stronger SAR, while C3H14 or C3H15 overexpressors are more susceptible. MPK4
      phosphorylation relieves the repression.
    action: NEW
    reason: Loss and gain of function give opposite phenotypes consistently. The
      mechanism is supported by the MPK4-C3H14 interaction, by phosphosite mutants, and
      by C3H14 activating the SAR repressors NIMIN1/NIMIN2. C3H14 acts as a regulator
      here, so a regulation term is appropriate. It is non-core.
    supported_by:
    - reference_id: PMID:35736512
      supporting_text: the c3h14c3h15 double mutant plants exhibited enhanced resistance
        against Pst DC3000
    - reference_id: PMID:35736512
      supporting_text: These results indicated that C3H14 and C3H15 play negative and
        redundant roles in SAR
