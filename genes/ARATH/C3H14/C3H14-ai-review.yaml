  review:
    summary: PAINT inference of mRNA binding for the ZFP36/TIS11 TZF clade, which
      includes C3H14 and its paralog C3H15. C3H14's own RIP, RNA-EMSA and
      domain-deletion data are among the descendant evidence. Experiments show that
      C3H14 binds 3' UTR elements of target mRNAs.
    action: MODIFY
    reason: The node placement is sound. C3H14 has the TTP-type tandem zinc fingers and
      binds target mRNAs directly through the TZF domain (PMID:25228083). Its own
      appearance among the IBA sources reflects that experimental grounding and is not
      circular. The term is correct but less specific than the evidence. The bound
      elements characterised so far are in 3' UTRs (the ADPG1 and DUF1218 3' UTR
      fragments in PMID:25228083, read via full-text passages; the IAMH2 3' UTR poly(U)
      motif in PMID:42844995). The refinement is mRNA 3'-UTR binding (GO:0003730), an
      is_a descendant of mRNA binding and the same replacement used for the IEA and IPI
      rows. GO:0035925 (AU-rich region binding) is not used, although the ADPG1 and DUF1218
      probes in PMID:25228083 contained an ARE motif and human ZFP36 carries that term.
      No ARE-mutant probe or competitor shows that binding depends on the AU-rich
      element itself. The other specificity data point to U-rich rather than AU-rich
      recognition. GST-C3H14 binds poly(rU) but not poly(rC) (PMID:25732536), and the
      IAMH2 element is described mainly as poly(U) (PMID:42844995).
    proposed_replacement_terms:
    - id: GO:0003730
      label: mRNA 3'-UTR binding
    supported_by:
