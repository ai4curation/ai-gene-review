product_type: PROTEIN
status: COMPLETE
aliases:
- AtC3H14
- AT1G66810
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  C3H14 (AT1G66810) is a 310-residue tandem CCCH zinc-finger (TZF) protein of the
  ZFP36/tristetraprolin-like family. It carries two C-terminal C3H1-type zinc fingers
  (residues 232-298) spaced as in animal TTP, and it acts largely redundantly with its
  paralog C3H15. Its best-supported activity is sequence-specific binding of target mRNAs
  through the TZF domain, including 3' UTR elements of the polygalacturonase ADPG1 mRNA
  and a poly(U)-rich motif in the IAMH2 3' UTR. Binding represses target expression
  post-transcriptionally. C3H14/C3H15 associate with processing-body proteins and the
  CCR4-NOT deadenylase, and they clear abundant mRNAs from male meiocytes at the
  zygotene-pachytene transition, which is needed for meiotic progression and meiocyte
  identity. C3H14 localizes to cytoplasmic foci and is also found in the nucleus. In the
  nucleus it binds G-rich promoter elements and activates target genes such as NIMIN1
  and NIMIN2. C3H14 is a direct MYB46 target expressed in secondary-wall-forming
  tissues. It promotes secondary wall thickening, restrains cell elongation, promotes
  basal defense against Botrytis cinerea through WRKY33, and acts as an MPK4-inactivated
  negative regulator of PAMP-triggered immunity and systemic acquired resistance
  against Pseudomonas syringae.
