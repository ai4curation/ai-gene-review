- term:
    id: GO:1900425
    label: negative regulation of defense response to bacterium
  evidence_type: IMP
  original_reference_id: PMID:35736512
  review:
    summary: In infected leaves, c3h14 c3h15 double mutants are more resistant to Pst
      DC3000, while C3H14 or C3H15 overexpressors are more susceptible. C3H14 represses
      PTI-related genes, and flg22- or Pst-activated MPK4 phosphorylation relieves this
      repression.
    action: NEW
    reason: Loss and gain of function give opposite local basal-defense phenotypes. The
      mechanism is supported by the MPK4-C3H14 interaction, by phosphosite mutants, and
      by release of C3H14-repressed PTI-related gene expression. C3H14 acts as a
      regulator here, so a regulation term is appropriate. It is non-core. The
      systemic (SAR) phenotypes are covered separately by GO:0010113.
    supported_by:
    - reference_id: PMID:35736512
      supporting_text: the c3h14c3h15 double mutant plants exhibited enhanced resistance
        against Pst DC3000
    - reference_id: PMID:35736512
