- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:35736512
  review:
    summary: Subcellular fractionation detects both phosphorylated and dephosphorylated
      Myc-C3H14 in the cytoplasm, and MPK4 interacts with C3H14 in the cytoplasm (BiFC).
      At1g66810-GFP forms cytoplasmic foci in protoplasts and tobacco epidermis.
      Native-promoter C3H14-VENUS in microspore mother cells shows diffuse cytoplasmic
      and nuclear signal plus cytoplasmic foci.
    action: NEW
    reason: Four independent experiments place C3H14 in the cytoplasm, where TTP-family
      proteins carry out mRNA decay. One of them uses the native promoter in the cells
      where C3H14 functions in meiosis (PMID:41758611). The foci resemble P-bodies, but
      the DCP1 colocalization, FRET-FLIM and DCP1 binding in PMID:41758611 were done only
      with C3H15. For that reason cytoplasm is proposed rather than P-body.
    supported_by:
