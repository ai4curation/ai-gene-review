- term:
    id: GO:1901347
    label: negative regulation of secondary cell wall biogenesis
  evidence_type: IMP
  original_reference_id: PMID:25228083
  qualifier: acts_upstream_of_or_within
  review:
    summary: TAIR IMP from Kim et al. 2014. The paper's Results section is headed
      "Overexpression of AtC3H14 results in cell elongation defect and ectopic secondary
      wall formation". Its Figure 7 ("Enhanced phloem fiber formation in 35S::AtC3H14
      plants") shows precocious stem phloem fibers and extra lignified phloem fibers in
      roots. Chai et al. 2015 show that c3h14 c3h15 stems have thinner fiber and vessel
      walls with less cellulose, xylose and lignin, while overexpressors have thicker,
      ectopic walls.
    action: MODIFY
    reason: The process is right, but the sign is reversed. The source paper itself
      reports enhanced, ectopic phloem-fiber secondary walls on overexpression (Results,
      Figure 7). Its knockdown (AtC3H14-RNAi/atc3h15-1) had no phenotype. The independent
      loss- and gain-of-function study PMID:25732536 shows that C3H14/C3H15 promote
      secondary wall thickening. No data in either paper show C3H14 reducing secondary
      wall formation. The corrected term is positive regulation of secondary cell wall
      biogenesis (GO:1901348). This is a lateral sign correction, not a refinement. For
      the upstream TAIR row the curator prefers the unsigned parent GO:2000652 regulation
      of secondary cell wall biogenesis with the relation
      acts_upstream_of_or_within_positive_effect (RO:0004032). The annotation rests on
      phenotypes (overexpression and double mutant), so the relation carries the
      direction, and the regulation process term is not asserted directly. That
      correction is recorded under source_defects. GO:1901348 is kept here because this
      review's replacement terms carry no relation. The two source_defects entries, not
      this replacement term, are the authoritative record of the requested TAIR change.
    proposed_replacement_terms:
    - id: GO:1901348
      label: positive regulation of secondary cell wall biogenesis
    supported_by:
    - reference_id: PMID:25228083
      supporting_text_fulltext: Overexpression of AtC3H14 results in cell elongation
        defect and ectopic secondary wall formation
      full_text_unavailable: true
    - reference_id: PMID:25228083
      supporting_text_fulltext: Enhanced phloem fiber formation in 35S::AtC3H14 plants
      full_text_unavailable: true
    - reference_id: PMID:25228083
      supporting_text_fulltext: plants had early and aberrant phloem fiber development
      full_text_unavailable: true
    - reference_id: PMID:25732536
      supporting_text_fulltext: the c3h14 c3h15 double mutant stems exhibited a significant
        reduction in secondary wall thickness of fibres or vessels
      full_text_unavailable: true
    - reference_id: PMID:25732536
      supporting_text_fulltext: the cellulose, xylose, and lignin contents were visibly
        decreased in the three c3h14 c3h15 mutant combinations
      full_text_unavailable: true
    - reference_id: PMID:25732536
      supporting_text: Plants with double, but not single, T-DNA mutants for C3H14 or
        C3H15 have few pollen grains and thinner stem secondary walls than the wild type.
    - reference_id: PMID:25732536
      supporting_text: Overexpression of C3H14 or C3H15 led to increased secondary wall
        thickness in stems and the ectopic deposition of secondary walls in various
        tissues
    source_defects:
    - defect_type: WRONG_TERM
      resource: TAIR
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:1901347
      corrected_value: GO:2000652
      corrected_label: regulation of secondary cell wall biogenesis
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The TAIR IMP row for AT1G66810 from PMID:25228083 (Kim et al. 2014) asserts
        negative regulation of secondary cell wall biogenesis. Requested correction
        (agreed by a TAIR curator): re-point the term to GO:2000652 regulation of
        secondary cell wall biogenesis and change the relation to
        acts_upstream_of_or_within_positive_effect (RO:0004032; see the companion
        Qualifier defect on this row). The paper's only
        secondary-wall phenotype is from 35S::AtC3H14 overexpression, reported under the
        Results heading "Overexpression of AtC3H14 results in cell elongation defect and
        ectopic secondary wall formation". Figure 7 ("Enhanced phloem fiber formation in
        35S::AtC3H14 plants") shows precocious stem phloem fibers and extra lignified
        phloem fibers in roots. The paper's AtC3H14-RNAi/atc3h15-1 lines showed no
        phenotypic change. Chai et al. 2015 (PMID:25732536) show reduced fiber and vessel
        wall thickness and lower cellulose, xylose and lignin in c3h14 c3h15 double
        mutants, and increased, ectopic secondary walls on overexpression. The effect is
        positive, so negative regulation is wrong. The paper's cell-elongation phenotype
        (GO:0051511, negative regulation of unidimensional cell growth) is a separate
        annotation with the correct sign and is not affected. Verified against the full
        text and Figure 7 of the accepted manuscript.
      supported_by:
      - reference_id: PMID:25732536
        supporting_text: Overexpression of C3H14 or C3H15 led to increased secondary wall
          thickness in stems and the ectopic deposition of secondary walls in various
          tissues
    - defect_type: WRONG_QUALIFIER
      resource: TAIR
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: acts_upstream_of_or_within
      corrected_value: acts_upstream_of_or_within_positive_effect
      corrected_label: acts upstream of or within, positive effect
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Companion to the GO_ID correction on the same TAIR IMP row (AT1G66810,
        PMID:25228083). Once the term is re-pointed to GO:2000652 regulation of secondary
        cell wall biogenesis, the relation should be
        acts_upstream_of_or_within_positive_effect to state the direction. Overexpression
        gives enhanced, ectopic secondary walls (PMID:25228083 Figure 7), and the c3h14
        c3h15 double mutant has thinner walls with less cellulose, xylose and lignin
