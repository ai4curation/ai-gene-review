- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: IDA
  original_reference_id: PMID:35736512
  review:
    summary: EMSA with recombinant C3H14 shows specific binding to CHRE-containing
      fragments of the NIMIN1 and NIMIN2 promoters. ChIP-qPCR shows in vivo enrichment of
      Myc-C3H14 at the same fragments, and the enrichment falls after Pst DC3000
      infection.
    action: NEW
    reason: Direct in vitro and in vivo evidence of binding to promoter cis-regulatory
      regions underlies the transcriptional-activation role kept as non-core above.
      DNA-binding transcription factor activity is not proposed. The evidence comes from
      one group, and a CCCH TZF acting as a sequence-specific TF is unusual and would need
      independent confirmation (see suggested_questions).
    supported_by:
