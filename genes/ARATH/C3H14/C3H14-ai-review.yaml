  qualifier: located_in
  review:
    summary: AtSubP sequence-based prediction of nuclear localization. Subcellular
      fractionation confirms a nuclear pool of C3H14 (dephosphorylated form), and ChIP
      places it on target promoters.
    action: ACCEPT
    reason: The prediction is borne out experimentally. Wang et al. 2022 detected Myc-C3H14
      in nuclear fractions and showed ChIP enrichment at the NIMIN1/NIMIN2 promoters, so
      the nucleus is where its transcriptional role operates. C3H14 is also, and
      prominently, cytoplasmic (added below as NEW), consistent with TTP-like
      nucleocytoplasmic shuttling.
    supported_by:
    - reference_id: PMID:35736512
      supporting_text: both phosphorylated and dephosphorylated forms of C3H14 protein were
        detected in the cytoplasm, but only the dephosphorylated form was detected in the
        nucleus
