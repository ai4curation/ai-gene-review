- term:
    id: GO:0045893
    label: positive regulation of DNA-templated transcription
  evidence_type: IDA
  original_reference_id: PMID:25228083
  qualifier: acts_upstream_of_or_within
  review:
    summary: TAIR IDA from a yeast assay in which GAL4-BD-AtC3H14 activated the ADE2
      reporter in AH109 (Kim et al. 2014). The transactivation is also supported by
      protoplast assays on secondary-wall gene promoters (Ko et al. 2009). In planta,
      C3H14 binds the NIMIN1/NIMIN2 promoters and activates their expression (Wang et al.
      2022).
    action: KEEP_AS_NON_CORE
    reason: The yeast GAL4-fusion assay shows only that C3H14 carries a transactivation
      capacity when tethered to DNA; on its own it is weak evidence of a role in planta.
      Independent work adds protoplast promoter-reporter activation (PMID:19674407) and
      ChIP/EMSA evidence of direct promoter binding with target activation
      (PMID:35736512), so the term is retained. It is kept as non-core because the
      conserved, best-characterised activity of this TTP-family protein is
      post-transcriptional mRNA repression, and the transcriptional role comes mostly
      from one group's work.
    supported_by:
    - reference_id: PMID:25228083
      supporting_text: yeast activation assay showed that AtC3H14 also function as a
        transcriptional activator
    - reference_id: PMID:19674407
      supporting_text: AtC3H14 activated the transcription of all of the secondary wall
        biosynthesis genes tested
    - reference_id: PMID:35736512
      supporting_text: C3H14 was significantly enriched in fragment P7 covering the CHRE
        site (GGGACA) of the NIMIN1 promoter
