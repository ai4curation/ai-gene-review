- term:
    id: GO:0010113
    label: negative regulation of systemic acquired resistance
  evidence_type: IMP
  original_reference_id: PMID:35736512
  review:
    summary: After a primary Pst DC3000/avrRpt2 infection, distal leaves of c3h14 c3h15
      double mutants restrict bacterial growth more strongly than wild type and express
      more PR1 and PR2. C3H14 or C3H15 overexpressors show weaker SAR. C3H14 directly
      binds and activates NIMIN1 and NIMIN2, which negatively regulate SAR.
    action: NEW
    reason: The SAR assays (distal-leaf bacterial growth plus systemic PR1/PR2 expression)
      test a different process from the local basal-defense phenotype behind GO:1900425.
      Loss and gain of function give opposite results. GO:0010113 and GO:1900425 are
      siblings under GO:0031348 negative regulation of defense response (OLS4
      hierarchy, 2026-10-23), so neither entails the other. Non-core.
    supported_by:
