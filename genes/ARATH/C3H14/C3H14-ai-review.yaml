  evidence_type: IMP
  original_reference_id: PMID:25228083
  qualifier: acts_upstream_of_or_within
  review:
    summary: 35S::AtC3H14 plants are dwarf, with shorter pith, vessel and fiber cells and
      short stamens (Kim et al. 2014). In that paper the AtC3H14-RNAi/atc3h15-1 lines
      showed no cell-elongation change. Gao et al. 2026 provide genetic support from
      hypocotyl elongation under low light, acting through repression of IAMH2 mRNA.
    action: KEEP_AS_NON_CORE
    reason: In PMID:25228083 the phenotype comes from ectopic overexpression, which on
      its own is weak support. Loss-of-function data now exist. The c3h14 c3h15 double
      mutant is taller than wild type (PMID:25732536, full text), and PMID:42844995 adds
      loss-of-function and epistasis data.
      IAMH2 mRNA is elevated in c3h14 c3h15, iamh2 is epistatic for low-light hypocotyl
      length, and overexpression of C3H14 shortens hypocotyls. The term is retained as a
      downstream developmental outcome of the core RNA-repression activity.
    supported_by:
