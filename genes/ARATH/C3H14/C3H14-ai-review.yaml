core_functions:
- description: Sequence-specific binding of target mRNA 3' UTRs through the tandem CCCH
    zinc-finger domain, which leads to post-transcriptional repression and decay of the
    bound transcripts. Characterised C3H14 targets include ADPG1 and IAMH2. Together with
    C3H15, it is required for clearing abundant transcripts from male meiocytes. It acts
    in the cytoplasm, redundantly with C3H15. The C3H14/C3H15 pair associates with
    P-body proteins and the CCR4-NOT deadenylase, but DCP1 binding and P-body
    colocalization have been shown only for C3H15.
  supported_by:
  - reference_id: PMID:25228083
    supporting_text: RNA electrophoretic mobility shift assays (RNA-EMSA) were used to
      confirm the RIP results and demonstrate that the TZF domain of AtC3H14 is required
      for the target RNA binding.
  - reference_id: PMID:42844995
    supporting_text: directly bind this poly(U)-rich region to posttranscriptionally
      downregulate IAMH2 mRNA levels
  - reference_id: PMID:42711403
    supporting_text: C3H14/C3H15 interacts with processing-body proteins and the CCR4-NOT
      deadenylase complex, and is required for eliminating unwanted transcripts
  molecular_function:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  directly_involved_in:
  - id: GO:0061158
    label: 3'-UTR-mediated mRNA destabilization
  locations:
  - id: GO:0005737
    label: cytoplasm
suggested_questions:
- question: Native-promoter C3H14-VENUS forms cytoplasmic foci in meiocytes
    (PMID:41758611), but DCP1 colocalization and binding were tested only for C3H15. Does
    C3H14 itself colocalize with or bind DCP1? If so, P-body (GO:0000932) would be a
    justified location.
- question: In meiocytes, C3H15 binds its targets mainly in coding regions
    (PMID:41758611), whereas C3H14's characterised targets (ADPG1, DUF1218, IAMH2) are
    bound in 3' UTRs. Do the paralogs differ in binding-site preference, or does it depend
    on cell type?
- question: Is the DNA-binding and transcriptional-activation role of C3H14 (CHRE
    elements, NIMIN1/2, WRKY33) reproducible outside the group that reported it? How
    does a TTP-type tandem zinc finger discriminate DNA from RNA targets?
- question: Given the 2026 meiocyte data, should male meiosis or meiocyte-identity
    process terms be annotated to C3H14? Is the RNA-clearance role better captured as
    regulation of a meiotic process than as participation in it?
suggested_experiments:
- description: Measure mRNA half-lives of IAMH2, ADPG1 and meiocyte targets in wild type
    and c3h14 c3h15 (for example after cordycepin or actinomycin D treatment, or by
    metabolic labelling).
  hypothesis: C3H14/C3H15 shorten the half-lives of their 3'-UTR-bound targets, rather
    than repressing them only at the transcriptional or translational level.
  experiment_type: mRNA stability assay
- description: Map C3H14 binding sites genome-wide by iCLIP or eCLIP and ChIP-seq in the
    same tissue (inflorescence stem or anther).
  hypothesis: RNA targets are enriched for 3'-UTR poly(U)/ARE motifs, and any DNA binding
    is limited to a small set of CHRE-containing promoters.
  experiment_type: CLIP-seq and ChIP-seq
- description: Mutate the zinc-coordinating cysteines of one or both CCCH fingers and
    test complementation of c3h14 c3h15 for meiosis, secondary-wall and Pst phenotypes.
  hypothesis: All phenotypes depend on the RNA-binding TZF domain; any TZF-independent
    phenotype would point to a separate nuclear function.
  experiment_type: genetic complementation
