core_functions:
- description: Nuclear bZIP transcription factor that binds ABA-responsive promoter
    elements and controls the transcriptional program for seed maturation, ABA-dependent
    germination repression and the postgermination growth-arrest checkpoint. Activation of
    target genes is its predominant characterized output; some targets, including ABR in
    senescence, are negatively regulated.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  - id: GO:0010187
    label: negative regulation of seed germination
  - id: GO:0009737
    label: response to abscisic acid
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:10760247
    supporting_text: it encodes a member of the basic leucine zipper transcription factor
      family. The previously characterized abi5-1 allele encodes a protein that lacks the
      DNA binding and dimerization domains required for ABI5 function
  - reference_id: PMID:16463099
    supporting_text: ABI3, ABI5 and AREB1 activated transcription of a GUS reporter gene
      driven by the RD29B promoter strongly
  - reference_id: PMID:18941053
    supporting_text: ABI5 acts as the final common repressor of germination in response to
      changes in ABA and GA levels
  - reference_id: PMID:11287670
    supporting_text: ABI5 is necessary to maintain germinated embryos in a quiescent state
      thereby protecting plants from drought
proposed_new_terms: []
suggested_questions:
- question: Through which specific molecular mechanism does ABI5 switch from a repressor
    of germination to an activator of LEA gene transcription, and how is this controlled
    by SnRK2 phosphorylation versus its many interacting regulators (KEG, SIZ1, AFP,
    TAP46/PP2A)?
- question: Are the genome-scale yeast one-hybrid interactions of ABI5 with cell-wall,
    nitrogen, and vascular gene promoters biologically relevant in planta, given that ABI5
    is predominantly seed-expressed?
- question: Recent studies show ABI5 can act as a direct transcriptional repressor (e.g.
    of PME31 and growth/photosynthesis/cell-wall genes via the ABI5-FLZ13 module), in
    addition to its classical activator role on LEA/ABRE genes. Does ABI5 warrant a
    separate negative regulation of transcription (GO:0045892) annotation, and what
    determines whether ABI5 activates versus represses a given target (cofactor identity
    such as FLZ13, promoter context, or ABA level)?
