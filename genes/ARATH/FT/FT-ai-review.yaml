id: Q9SXZ2
gene_symbol: FT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FT is an Arabidopsis PEBP-family protein that acts as a mobile flowering signal and
  transcriptional coactivator. It is produced in leaf phloem companion cells and moves through the
  phloem to the shoot apex, where association with FD-class bZIP transcription factors promotes
  expression of floral identity genes such as AP1. Its movement is regulated by proteins including
  FTIP1; FT is the transported signal rather than the transporter. FT occurs in nuclear and
  cytoplasmic pools, and ER-associated FT has been observed in transient localization experiments.
  Biochemical lipid-overlay and liposome assays show preferential binding to phosphatidylcholine
  rather than phosphatidylethanolamine, despite the historical PEBP family name. PC-binding-site
  mutations and changes in PC composition affect flowering activity. FT also has a cell-autonomous
  role in guard-cell stomatal opening, distinct from its long-distance floral signaling role.
