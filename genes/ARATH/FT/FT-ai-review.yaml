suggested_questions:
- question: How do the PC molecular species bound to native FT affect its transport versus
    transcriptional coactivation at the meristem?
- question: What is the native stoichiometry and partner composition of Arabidopsis FT
    transcriptional complexes across leaf and shoot-apex cell types?
suggested_experiments:
- hypothesis: PC-binding-site changes affect FT coactivation independently of long-distance
    transport.
  description: Compare native-expression PC-binding mutants for graft-transmissible movement,
    FD-complex association, target transcription and flowering, while measuring PC species in
    matched tissues.
