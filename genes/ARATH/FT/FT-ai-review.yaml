- term:
    id: GO:0008429
    label: phosphatidylethanolamine binding
  evidence_type: ISS
  original_reference_id: PMID:10583961
  review:
    summary: Correct the lipid specificity from phosphatidylethanolamine to phosphatidylcholine.
    action: MODIFY
    reason: The original 1999 ISS claim reflects PEBP-family similarity, not a direct FT lipid
      assay. Purified Arabidopsis FT binds PC in lipid-overlay and liposome assays, whereas PE gives
      no significant binding under those tested conditions (PMID:24698997). Binding-site mutagenesis
      corroborates PC recognition (PMID:31726375). Replace the substrate-specific activity with
      GO:0031210; the family name is not evidence of PE specificity.
    supported_by:
    - reference_id: PMID:24698997
      supporting_text: In particular no signals were found for binding to PE, even if PE was spotted
        at higher concentrations
    - &id007
      reference_id: PMID:24698997
      supporting_text: We concluded that FT is a PC-binding protein in vitro.
    - reference_id: PMID:31726375
      supporting_text: PC binding was significantly compromised for FTm1 and FTm3 but not FTm2 and
