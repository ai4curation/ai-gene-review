suggested_questions:
- question: >-
    Is BSU1-mediated dephosphorylation of pTyr200 or KIB1-mediated degradation the predominant mode of
    BIN2 inactivation in different tissues and BR concentrations?
- question: >-
    How do scaffolds (POLAR, OPS, BASL) and receptors (TDR) partition the BIN2 pool among its many substrates?
suggested_experiments:
- description: >-
    Quantify BIN2 pTyr200 and total BIN2 protein over a BR dose-time course in bsu1 bsl1 bsl2 bsl3 and
    kib1 kib2 kib3 backgrounds to separate the contributions of dephosphorylation and degradation.
