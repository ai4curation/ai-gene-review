core_functions:
- description: >-
    Constitutively active GSK3/SHAGGY-like serine/threonine kinase that, in the absence of brassinosteroid,
    phosphorylates BZR1 and BES1, inhibiting their DNA binding, promoting 14-3-3 binding, nuclear export
    and degradation; thereby negatively regulating BR-responsive transcription. BR signalling inactivates
    BIN2 through BSU1-mediated dephosphorylation of pTyr200 and KIB1-mediated degradation.
