id: Q38846
gene_symbol: ERS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  ERS1 (ETHYLENE RESPONSE SENSOR 1, At2g40940) is one of the five Arabidopsis
  ethylene receptors and, with ETR1, makes up receptor subfamily 1. It is a
  multi-pass endoplasmic reticulum membrane protein with an N-terminal
  three-helix ethylene-binding sensor domain (copper-dependent by analogy with
  ETR1), a GAF domain and a histidine-kinase-like domain, but it lacks the
  C-terminal receiver domain found in ETR1. ERS1 forms disulfide-linked
  homodimers and heteromeric receptor complexes at the ER and binds ethylene
  with an affinity similar to ETR1. In the absence of ethylene the receptors
  keep the Raf-like kinase CTR1 active and thereby repress the pathway; ethylene
  binding inactivates this output, allowing EIN2-dependent signalling. ERS1 acts
  redundantly with ETR1 as a negative regulator of ethylene responses (etr1 ers1
  double null mutants show a strong constitutive ethylene response), although
  genetic studies indicate it can also promote ethylene responses in some
  receptor-mutant backgrounds. ERS1 is transcriptionally induced by ethylene,
  providing negative feedback on signalling. In vitro it autophosphorylates on
  serine and, only with Mn2+, on histidine.
