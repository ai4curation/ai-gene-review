    ER-membrane ethylene sensor of receptor subfamily 1 that binds ethylene in its
    N-terminal transmembrane domain and, in the absence of ethylene, keeps the
    downstream CTR1 kinase active, thereby repressing the ethylene response
    redundantly with ETR1.
