suggested_questions:
- question: >-
    Does ERS1 transmit its signal to CTR1 through direct stable association, or
    mainly through heteromeric complexes with receiver-domain receptors such as
    ETR1, given that ERS1 co-purifies weakly with CTR1?
- question: >-
    Under what conditions, and by what mechanism, does ERS1 promote rather than
    inhibit ethylene responses, as proposed from receptor-mutant genetics?
suggested_experiments:
- description: >-
    Quantitative in planta proximity labelling or single-molecule pull-down of
    ERS1-CTR1 versus ETR1-CTR1 complexes in etr1 and wild-type backgrounds, with
    and without ethylene.
- description: >-
    Test whether serine autophosphorylation of ERS1 changes with ethylene in vivo
    by phosphoproteomics of ERS1 from ethylene-treated and untreated seedlings.
