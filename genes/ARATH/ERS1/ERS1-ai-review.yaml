      Replace uninformative protein binding with the informative signalling MF;
      the receptor-CTR1 association is how ERS1 transmits the ethylene receptor
      signal. GO:0038199 is already carried by ERS1 on a separate ACCEPTed row
      (IBA), so this MODIFY is a merge into that existing annotation, not a
      request to mint a new one.
