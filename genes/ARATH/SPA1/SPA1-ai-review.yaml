id: Q9SYX2
gene_symbol: SPA1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  SPA1 (SUPPRESSOR OF PHYA-105 1; At2g46340) is a nuclear repressor of light signaling in
  Arabidopsis thaliana and the founding member of the four-member SPA family (SPA1-SPA4).
  The protein has an N-terminal kinase-like domain, a central coiled-coil domain that binds
  the coiled-coil of the RING E3 ubiquitin ligase COP1, and a C-terminal WD40-repeat domain
  that resembles the COP1 WD40 domain and contains DDB1-binding (DWD/WDXR) motifs. SPA proteins
  form stable tetrameric COP1-SPA complexes that associate with CUL4-DDB1 to make CUL4-DDB1-COP1-SPA
  E3 ligases. In darkness, SPA1 enhances COP1-mediated ubiquitination and proteasomal degradation
  of photomorphogenesis-promoting transcription factors (HY5, HFR1, LAF1) and of the flowering
  regulator CONSTANS, repressing seedling de-etiolation and, in adult plants, short-day flowering.
  Photoactivated phytochromes (phyA in far-red, phyB in red light) and cryptochromes (CRY1,
  CRY2 in blue light) bind SPA1 and disrupt or reorganize the COP1-SPA1 interaction, inactivating
  the ligase so that its substrates accumulate. The N-terminal domain has been reported to
  act as a Ser/Thr kinase that phosphorylates PIF1 in a phyB-enhanced complex, promoting light-induced
  PIF1 degradation, and that also phosphorylates HY5 at Ser36; SPA1 thus acts at both arms
  of phytochrome signaling, COP1 inhibition and PIF turnover.
