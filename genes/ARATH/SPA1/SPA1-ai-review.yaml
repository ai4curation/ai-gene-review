core_functions:
- description: >-
    SPA1 binds COP1 through its coiled-coil domain and stimulates COP1 E3 ubiquitin ligase
    activity towards photomorphogenesis-promoting transcription factors (HY5, HFR1, LAF1)
    and CONSTANS, acting as a subunit of nuclear CUL4-DDB1-COP1-SPA E3 ligase complexes that
    repress photomorphogenesis in darkness.
  molecular_function:
    id: GO:0097027
    label: ubiquitin-protein transferase activator activity
  directly_involved_in:
  - id: GO:0010100
    label: negative regulation of photomorphogenesis
  - id: GO:0010017
    label: red or far-red light signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0016604
    label: nuclear body
  in_complex:
    id: GO:0080008
    label: Cul4-RING E3 ubiquitin ligase complex
  supported_by:
  - reference_id: PMID:12827204
    supporting_text: SPA1 stimulates the E3 activity of residual nuclear COP1 to ubiquitinate
      LAF1
  - reference_id: PMID:14597662
    supporting_text: >-
      We further demonstrate the E3 ubiquitin ligase activity of COP1 on HY5 in vitro and
      the alteration of that activity by SPA1
  - reference_id: PMID:16813572
    supporting_text: >-
      both COP1 and SPA1 are each dependent on the presence of the other for their repressive
      effect on light signaling
  - reference_id: PMID:20061554
    supporting_text: >-
      a series of CUL4-DDB1-COP1-SPA E3 ligase complexes may mediate the repression of photomorphogenesis
- description: >-
    The SPA1 N-terminal kinase-like domain phosphorylates PIF1 in a phyB-enhanced phyB-PIF1-SPA1
    complex, a prerequisite for light-induced CUL4-COP1-SPA-mediated ubiquitination and degradation
    of PIF1. SPA1 kinase activity has also been reported towards HY5 (Ser36) and the eIF2alpha
    C-terminus, from the same research group and collaborators; see questions.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0010017
    label: red or far-red light signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:31527679
    supporting_text: >-
      SPA1 acts as a serine/threonine kinase and directly phosphorylates PIF1 in vitro and
      in vivo
  - reference_id: PMID:31527679
    supporting_text: >-
      phyB interacts with SPA1 through its C-terminus and enhances the recruitment of PIF1
      for phosphorylation
  - reference_id: PMID:33686674
    supporting_text: >-
      We show that SPA proteins are the missing kinases necessary for HY5 phosphorylation
suggested_questions:
- question: >-
    Is the SPA1 N-terminal domain a bona fide protein kinase in vivo, given that Holtkotte
    et al. (2016) found deletion of the conserved kinase-like region tolerated while missense
    mutations were deleterious, suggesting a structural role?
- question: >-
    How do photoactivated phyA and phyB binding to SPA1 reorganize the tetrameric COP1-SPA
    complex, and is SPA1 the primary phytochrome contact in vivo?
suggested_experiments:
- description: >-
    Quantitative phosphoproteomics of PIF1 in spaQ seedlings complemented with wild-type versus
    catalytically dead (ATP-binding lysine) SPA1 under red light pulses, to test whether SPA1
    catalytic activity per se is required for PIF1 phosphorylation in vivo.
