suggested_questions:
- question: How does mitochondrial Fd-GOGAT increase SHMT1 activity mechanistically (allosteric activation,
    complex stabilization, substrate channelling), and is the effect reproducible with purified proteins?
- question: How large is the mitochondrial pool of GLU1 in wild-type leaves, given that it is undetectable
    in FFE-purified mitochondria?
- question: Does ACR11 regulate Fd-GOGAT activity directly (allosterically, via glutamine binding) as
    well as its protein level?
suggested_experiments:
- description: Reconstitute purified SHMT1 with wild-type, L1270F and catalytically dead Fd-GOGAT in vitro
    and measure SHMT kinetics to test direct activation.
- description: Native-promoter epitope-tagged GLU1 in glu1 background, with FFE-purified mitochondria
    and protease-protection assays, to quantify the mitochondrial pool and its sub-mitochondrial location.
