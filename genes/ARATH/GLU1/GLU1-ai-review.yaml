gene_symbol: GLU1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'GLU1 (At5g04140; Fd-GOGAT1, GLS1) encodes the major ferredoxin-dependent glutamate synthase
  of Arabidopsis leaves, a large (about 1600 residue) FMN- and iron-sulfur-containing enzyme with an N-terminal
  chloroplast transit peptide. In the chloroplast stroma it transfers the amide nitrogen of glutamine
  to 2-oxoglutarate using electrons from reduced ferredoxin, producing two glutamate; together with plastidic
  glutamine synthetase GS2 it forms the GS/GOGAT cycle. GLU1 is the Fd-GOGAT isoform required for photorespiration:
  gls/glu1 mutants are chlorotic and accumulate ammonium and glutamine in air but are rescued by elevated
  CO2, while the paralog GLU2 acts mainly in roots. GLU1 also contributes to primary nitrogen assimilation
  in leaves, and its expression is highest in leaves and induced by light and sucrose. A small fraction
  of GLU1 is reported to be targeted to mitochondria, where it interacts with serine hydroxymethyltransferase
  SHM1 and is required, independently of its catalytic activity, for wild-type photorespiratory SHMT activity.
  In chloroplasts its abundance is controlled post-transcriptionally through interaction with the ACT-domain
  protein ACR11.'
