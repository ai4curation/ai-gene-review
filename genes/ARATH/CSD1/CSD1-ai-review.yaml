      AtDJ-1a physically interacts with CSD1 (SOD1) and promotes its cytosolic
      activation in a copper-dependent manner.
    supporting_text: "We further identify superoxide dismutase 1 (SOD1) and glutathione peroxidase 2 (GPX2) as interaction partners of both AtDJ-1a and human DJ-1, and show that this interaction results in AtDJ-1a- and DJ-1-mediated cytosolic SOD1 activation in a copper-dependent fashion."
    full_text_unavailable: true
- id: PMID:21897129
  title: Effect of Cu content on the activity of Cu/ZnSOD1 in the Arabidopsis SUMO E3 ligase siz1 mutant.
