      Oxidative stress-related genes including CSD1 are upregulated during plant
      programmed cell death.
    supporting_text: "We show that certain oxidative stress-related genes, including CSD1, CSD3, and GPX, in addition to cysteine proteinases, some transcription factors, and HR-related genes may serve as markers of a core plant cell death programme."
    full_text_unavailable: true
- id: PMID:15772282
  title: Two P-type ATPases are required for copper delivery in Arabidopsis thaliana chloroplasts.
  findings:
  - statement: >-
      CSD1 encodes the cytosolic Cu/ZnSOD in Arabidopsis whose expression and
      activity increase with copper feeding.
    supporting_text: "CSD1 encodes a Cu/ZnSOD active in the cytosol, and CSD2 encodes a Cu/ZnSOD active in the chloroplast stroma."
    full_text_unavailable: false
- id: PMID:16861386
  title: Posttranscriptional induction of two Cu/Zn superoxide dismutase genes in Arabidopsis is mediated by downregulation of miR398 and important for oxidative stress tolerance.
  findings:
  - statement: >-
      miR398 directs cleavage and degradation of CSD1 and CSD2 mRNAs; oxidative
      stresses downregulate miR398 to allow post-transcriptional CSD1 and CSD2
      mRNA accumulation.
    supporting_text: "Here, we show that miR398 expression is downregulated transcriptionally by oxidative stresses, and this downregulation is important for posttranscriptional CSD1 and CSD2 mRNA accumulation and oxidative stress tolerance."
    full_text_unavailable: false
