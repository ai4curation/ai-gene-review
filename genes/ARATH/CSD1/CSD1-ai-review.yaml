suggested_questions:
- question: >-
    How do the copper chaperone CCS and AtDJ-1a partition copper delivery to
    CSD1 between the cytosolic and nuclear pools during acute oxidative stress?
suggested_experiments:
- description: >-
    Perform compartment-resolved in vivo copper-loading and SOD activity assays
    in ccs and dj1a single and double mutants using nuclear vs. cytosolic
    fractionation under high-light and methyl viologen stress.
  hypothesis: >-
    CCS mediates baseline cytosolic and nuclear CSD1 metallation, whereas
    AtDJ-1a provides rapid stress-inducible activation of pre-existing apo-CSD1.
