- term:
    id: GO:0035195
    label: miRNA-mediated post-transcriptional gene silencing
  evidence_type: IEP
  original_reference_id: PMID:16861386
  review:
    summary: >-
      Mis-annotation of an mRNA target substrate (CSD1) to the miRNA-mediated
      post-transcriptional gene silencing machinery.
    action: REMOVE
    reason: >-
      A gene product is involved_in a biological process only if it performs
      part of the work of that process. Sunkar et al. (2006, PMID:16861386) and
      degradome sequencing (TarDB) show that CSD1 mRNA is the cleaved substrate
      of miR398-guided ARGONAUTE1 RISC; the CSD1 superoxide dismutase protein
      plays no role in executing miRNA-mediated post-transcriptional gene
      silencing. Most comparator miRNA targets in Arabidopsis (e.g., SPLs, ARFs,
      AP2, APS1, LAC4) are not annotated to GO:0035195, and the two other TAIR
      protein-coding targets carrying GO:0035195 (CSD2 and PXMT1/AT1G66700)
      reflect the same substrate-vs-actor curation error.
    supported_by:
    - reference_id: PMID:16861386
      supporting_text: "After 2 d of coexpression with miR398, CSD1 and CSD2 mRNA decreased substantially, which demonstrated that the miR398 can direct the degradation of CSD1 and CSD2 mRNAs in vivo"
    - reference_id: file:projects/THLAR_OILSEED/mirna_targets/tardb_ath_degradome.tsv
      supporting_text: "ath-miR398a-3p\tmiR398\tAT1G08830.1\tAT1G08830\tCSD1\t0\t0.00494\ttar 5' AAGGGGUUUCCUGAGAUCACA 3' | |||||||xx|||||||x|||| | miR 3' UUCCCCACUGGACUCUUGUGU 5'"
    source_defects:
    - defect_type: WRONG_TERM
      resource: TAIR
      requested_change: DELETE_ROW
      asserted_value: GO:0035195
      confidence: CONFIRMED
      explanation: >-
        CSD1 mRNA is the cleaved target substrate of miR398-guided RISC
        (PMID:16861386), not an actor in miRNA-mediated post-transcriptional
        gene silencing (GO:0035195).
