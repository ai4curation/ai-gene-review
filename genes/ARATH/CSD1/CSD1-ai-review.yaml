      rosette leaves.
    supporting_text: "In Col, salt treatments inhibited the expression of FSD1 and strongly stimulated that of CSD1 and MSD."
    full_text_unavailable: true
- id: PMID:18392778
  title: Sucrose induction of Arabidopsis miR398 represses two Cu/Zn superoxide dismutases.
  findings:
  - statement: >-
      Sucrose positively regulates miR398, resulting in decreased CSD1 and CSD2
      mRNA and protein accumulation.
    supporting_text: "Here we show that miR398 is positively regulated by sucrose, resulting in decreased CSD1 and CSD2 mRNA and protein accumulation."
    full_text_unavailable: true
- id: PMID:19148671
  title: Biotic and abiotic stress down-regulate miR398 expression in Arabidopsis.
  findings:
  - statement: >-
      CSD1 mRNA levels negatively correlate with miR398 during ozone, salinity,
      and avirulent Pseudomonas syringae stress.
    supporting_text: "CSD1, but not CSD2, mRNA levels were negatively correlated with miR398 levels during ozone, salinity and biotic stress, suggesting that CSD2 regulation is not strictly under miR398 control during diverse stresses."
    full_text_unavailable: true
