      Excess copper induces shoot CSD1 protein level and enzymatic activity in
      wild-type Arabidopsis.
    supporting_text: "We further examined the expression and enzymatic activity of Cu/ZnSOD1 (CSD1) in shoots of the siz1 mutant under excess Cu. Shoot CSD1 protein level and activity were reduced in siz1 with excess Cu but induced in the wild type."
