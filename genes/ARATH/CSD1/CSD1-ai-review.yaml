id: P24704
gene_symbol: CSD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  Superoxide dismutase [Cu-Zn] 1 (CSD1, AT1G08830) is the major cytosolic and
  nuclear copper/zinc superoxide dismutase in Arabidopsis thaliana. It functions
  as a homodimer that binds one catalytic copper ion and one structural zinc ion
  per subunit to catalyze the disproportionation of superoxide radicals into
  molecular oxygen and hydrogen peroxide, providing frontline antioxidant defense
  against oxidative stress triggered by high light, ozone, UV-B radiation,
  salinity, and pathogen challenge. Its copper-dependent enzymatic activation in
  the cytosol is facilitated by the copper chaperone for superoxide dismutase
  (CCS) and the stress-protective protein DJ-1a, while its transcript abundance
  is post-transcriptionally repressed by miR398-directed mRNA cleavage in
  response to copper limitation and sucrose levels.
