id: P93830
gene_symbol: IAA17
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  IAA17 (AUXIN RESISTANT 3, AXR3; At1g04250) is an Aux/IAA transcriptional repressor of auxin-responsive
  genes. Like other canonical Aux/IAAs it is a short-lived nuclear protein with an EAR-motif
  domain I that recruits TOPLESS-family co-repressors, a domain II degron recognized by the
  SCF(TIR1/AFB) auxin receptors in an auxin-dependent manner, and a C-terminal PB1 domain
  that mediates homo-oligomerization and heterodimerization with AUXIN RESPONSE FACTORs, including
  the activators ARF5, ARF7 and ARF19. At low auxin IAA17 represses ARF-dependent transcription;
  auxin promotes SCF(TIR1)-dependent ubiquitination and proteasomal degradation of IAA17 (half-life
  of minutes), releasing ARFs. The semidominant axr3-1 mutation in domain II stabilizes the
  protein and causes pleiotropic auxin-related phenotypes including altered root growth, root
  hair and gravitropic defects, and increased apical dominance. IAA17 is itself rapidly induced
  by auxin, forming part of the negative feedback in the pathway.
