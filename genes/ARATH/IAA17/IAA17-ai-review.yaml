  - AGI_LocusCode:AT4G29080
  - AGI_LocusCode:AT5G25890
  - AGI_LocusCode:AT5G43700
  - AGI_LocusCode:AT5G65670
  - PANTHER:PTN001272225
  review:
    summary: >-
      Phylogenetic propagation of transcription cis-regulatory region binding across the Aux/IAA
      clade (PTN001272225), seeded largely from yeast one-hybrid promoter-binding data for
      Aux/IAA family members.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Aux/IAA proteins lack a DNA-binding domain; the βαα fold once proposed for domain III
      is now known to be a PB1 protein-protein interaction domain. Aux/IAAs reach auxin-responsive
      promoters indirectly by heterodimerizing with DNA-bound ARFs. Yeast one-hybrid positives
      for Aux/IAAs most plausibly reflect such indirect recruitment, so direct cis-regulatory
      region binding over-states the evidence. The family-level function is transcription
      corepressor activity.
    supported_by:
    - &id001
      reference_id: PMID:11752389
      supporting_text: >-
        These results suggested that Aux/IAA proteins function as active repressors by dimerizing
        with auxin response factors bound to auxin response elements
    - &id002
      reference_id: PMID:14742873
      supporting_text: >-
        Results reported here indicate that domain I in Aux/IAA proteins is an active repression
        domain that is transferable and dominant over activation domains
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001272225
        source_label: PTN001272225
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The Aux/IAA node is supported by yeast one-hybrid promoter hits for Aux/IAA members;
          Aux/IAAs have no DNA-binding domain and are recruited to promoters indirectly through
          ARF heterodimerization, so direct cis-regulatory region binding conflates indirect
          promoter association with DNA binding.
- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: ISS
  original_reference_id: PMID:11118137
  qualifier: enables
  review:
    summary: >-
      DNA-binding transcription factor activity transferred in a genome-wide transcription
      factor catalogue that included the Aux/IAA family.
    action: MODIFY
    reason: >-
      Aux/IAAs regulate transcription but do not bind DNA themselves; they repress ARF transcription
      factors via PB1-mediated heterodimerization and recruit TOPLESS through the domain I
      EAR motif. The appropriate MF is transcription corepressor activity.
    proposed_replacement_terms:
    - id: GO:0003714
      label: transcription corepressor activity
    supported_by:
    - *id001
    - *id002
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11713520
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q570C0
  review:
    summary: >-
      IAA17 interaction with the SCF F-box auxin receptor TIR1. The Aux/IAA domain II degron
      binds the TIR1/AFB auxin pocket in an auxin-dependent manner, making the Aux/IAA both
      co-receptor and ubiquitination substrate.
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative; the Aux/IAA binds the SCF(TIR1) E3 ubiquitin
      ligase as its substrate, captured by ubiquitin protein ligase binding.
    proposed_replacement_terms:
    - id: GO:0031625
      label: ubiquitin protein ligase binding
    supported_by:
    - &id007
      reference_id: PMID:11713520
      supporting_text: >-
        We demonstrate that SCF(TIR1) interacts with AXR2/IAA7 and AXR3/IAA17, and that domain
        II of these proteins is necessary and sufficient for this interaction
    - &id003
      reference_id: PMID:11713520
      supporting_text: auxin stimulates binding of SCF(TIR1) to the AUX/IAA proteins, and
        their degradation
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21734647
  qualifier: enables
  supporting_entities:
  - UniProtKB:O24407
  review:
    summary: >-
      IAA17 heterotypic interaction with the Aux/IAA protein IAA16 reported by systematic
      yeast two-hybrid Aux/IAA-ARF interactome (Vernoux et al. 2011). Aux/IAA proteins homo-
      and hetero-oligomerize through their PB1 domains (domains III/IV).
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative; the PB1-mediated Aux/IAA-Aux/IAA association
      is better described as protein heterodimerization activity. Its physiological significance
      is less clear than Aux/IAA-ARF binding, so it is not considered a core function.
    proposed_replacement_terms:
    - id: GO:0046982
      label: protein heterodimerization activity
    supported_by:
    - reference_id: PMID:21734647
      supporting_text: >-
        In this network, the vast majority of the Aux/IAAs interact with all the ARF activators,
        suggesting that most Aux/IAAs have the potential to act as repressors of the transcriptional
        activity of ARF activators
    - reference_id: PMID:11283339
      supporting_text: proteins that are capable of homodimerizing and heterodimerizing
