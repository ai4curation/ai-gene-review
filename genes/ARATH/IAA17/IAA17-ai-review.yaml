  review:
    action: KEEP_AS_NON_CORE
    summary: Regulatory-DNA association is retained with yeast one-hybrid and phylogenetic scope
      limits.
    reason: Publisher Supplementary Table 2 of PMID:25533953 contains the exact
      IAA12/AT1G04550–AT5G12870 (MYB46 promoter) positive (Sheet1 row445; reproduced in
      IAA12-source-analysis). Table5 confirms the AUX-IAA clone, and the Methods report repeated
      screens and sequence confirmation. This is heterologous yeast one-hybrid evidence for
      regulatory-DNA association, not a demonstrated endogenous MYB46 regulatory function or
      purified-protein DNA-contact mechanism. The previous explanation that an ARF must tether IAA12
      in this assay was not demonstrated and is withdrawn. Absence of a recognized sequence-specific
      DNA-binding domain does not by itself negate the positive assay. For IAA17, retain the PAINT
      inherited-node judgment as non-core; the reviewed IAA12 experiment is a family experimental
      anchor, not a new direct assay on IAA17. No target-specific loss or defective ancestral-node
      placement has been established.
    supported_by:
    - reference_id: PMID:25533953
      supporting_text: All interacting transcription factors were assembled into a cell wall
        interaction library and the screen was repeated to confirm the results and each clone was
        sequenced to reconfirm identity.
    - reference_id: file:ARATH/IAA12/IAA12-source-analysis/README.md
      supporting_text: PMID:25533953 publisher Supplementary Table 2, Sheet1, row 445 contains
        transcription factor AT1G04550 (IAA12), promoter AT5G12870 (MYB46), expression fields `ppp,
        x`, and one reporter activated.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN001272225
        source_status: SUPPORTS_TRANSFER
        comment: PAINT ancestral assertion retained; lack of a conventional DNA-binding domain alone
          is not evidence of lineage-specific loss. Native DNA-contact mechanism remains unresolved.
