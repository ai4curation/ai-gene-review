    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32612234
  qualifier: enables
  supporting_entities:
  - UniProtKB:O24408
  review:
    summary: >-
      IAA17 heterotypic interaction with the Aux/IAA protein IAA18 reported by high-throughput
      yeast two-hybrid phytohormone interactome (Altmann et al. 2020). Aux/IAA proteins homo-
      and hetero-oligomerize through their PB1 domains (domains III/IV).
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative; the PB1-mediated Aux/IAA-Aux/IAA association
      is better described as protein heterodimerization activity. Its physiological significance
      is less clear than Aux/IAA-ARF binding, so it is not considered a core function.
    proposed_replacement_terms:
    - id: GO:0046982
      label: protein heterodimerization activity
    supported_by:
    - reference_id: PMID:32612234
      supporting_text: >-
        we experimentally generated a systems-level map of the Arabidopsis phytohormone signalling
        network, consisting of more than 2,000 binary protein-protein interactions
    - reference_id: PMID:11283339
      supporting_text: proteins that are capable of homodimerizing and heterodimerizing
