- id: file:ARATH/IAA12/IAA12-source-analysis/README.md
  title: IAA12 publisher-supplement promoter-hit analysis
core_functions:
- description: Auxin-labile transcriptional co-repressor of ARF activators. IAA17 heterodimerizes
    with ARFs via its PB1 domain and represses their target genes through its domain I repression
    (EAR) motif until auxin-triggered SCF(TIR1/AFB)-mediated degradation.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0009734
    label: auxin-activated signaling pathway
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:14742873
    supporting_text: A mutation in domain II of the effector gene containing only domain I and II
      (GD-IAA17[I/mII]) functioned like the GD-IAA17mII effector gene, causing nearly complete
      repression in an auxin-independent manner
  - reference_id: PMID:11752389
    supporting_text: These results suggested that Aux/IAA proteins function as active repressors by
      dimerizing with auxin response factors bound to auxin response elements
  - reference_id: PMID:11283339
    supporting_text: the biochemical effect of this gain-of-function mutation is to increase the
      half-life of the iaa17/axr3-1 protein by sevenfold
- description: Binding of ARF transcription factors through the PB1 interaction surface; direct ARF7
    interface experiments and IAA17–ARF1/ARF5 interaction assays support this regulatory
    partnership. Family network interactions do not imply identical physiological regulation of
    every ARF.
  molecular_function:
    id: GO:0140297
    label: DNA-binding transcription factor binding
  directly_involved_in:
  - id: GO:0009734
    label: auxin-activated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:24706860
    supporting_text: Mutation of interface residues in the ARF7 PB1 domain yields monomeric protein
      and abolishes interaction with both itself and IAA17
  - reference_id: PMID:11283339
    supporting_text: ARF1 or ARF5/MP proteins
- description: Auxin-dependent binding to the SCF(TIR1) E3 ubiquitin ligase via the domain II
    degron, the step that targets IAA17 for ubiquitination and proteasomal degradation and makes
    IAA17 part of the auxin co-receptor.
  molecular_function:
    id: GO:0031625
    label: ubiquitin protein ligase binding
  directly_involved_in:
  - id: GO:0009734
    label: auxin-activated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:11713520
    supporting_text: We demonstrate that SCF(TIR1) interacts with AXR2/IAA7 and AXR3/IAA17, and that
      domain II of these proteins is necessary and sufficient for this interaction
  - reference_id: PMID:11713520
    supporting_text: auxin stimulates binding of SCF(TIR1) to the AUX/IAA proteins, and their
      degradation
suggested_questions:
- question: Should Aux/IAA proteins carry contributes_to auxin binding / auxin receptor activity,
    given that the Aux/IAA degron completes the auxin-binding pocket of TIR1/AFB?
- question: Is the reported role of IAA17 in leaf senescence a direct consequence of ARF repression
    in leaves, and which ARFs mediate it?
- question: Does Aux/IAA regulatory-DNA association observed in yeast one-hybrid assays involve
    direct sequence-specific DNA contacts or an unidentified bridging component in that assay, and
    what is its native significance?
suggested_experiments:
- description: Map in planta IAA17-ARF partner preference (e.g. ARF7/ARF19 in lateral root founder
    cells versus ARF5) using tissue-specific proximity labelling or FRET-FLIM.
  hypothesis: IAA17 preferentially represses specific activator ARFs in the root, explaining axr3-1
    root phenotypes.
