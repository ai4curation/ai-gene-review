core_functions:
- description: >-
    Auxin-labile transcriptional co-repressor of ARF activators. IAA17 heterodimerizes with
    ARFs via its PB1 domain and represses their target genes through its domain I repression
    (EAR) motif until auxin-triggered SCF(TIR1/AFB)-mediated degradation.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0009734
    label: auxin-activated signaling pathway
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id005
  - reference_id: PMID:11752389
    supporting_text: >-
      These results suggested that Aux/IAA proteins function as active repressors by dimerizing
      with auxin response factors bound to auxin response elements
  - *id006
- description: >-
    Auxin-dependent binding to the SCF(TIR1) E3 ubiquitin ligase via the domain II degron,
    the step that targets IAA17 for ubiquitination and proteasomal degradation and makes IAA17
    part of the auxin co-receptor.
  molecular_function:
    id: GO:0031625
    label: ubiquitin protein ligase binding
  directly_involved_in:
  - id: GO:0009734
    label: auxin-activated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id007
  - *id003
suggested_questions:
- question: >-
    Should Aux/IAA proteins carry contributes_to auxin binding / auxin receptor activity,
    given that the Aux/IAA degron completes the auxin-binding pocket of TIR1/AFB?
- question: >-
    Is the reported role of IAA17 in leaf senescence a direct consequence of ARF repression
    in leaves, and which ARFs mediate it?
suggested_experiments:
- description: >-
    Map in planta IAA17-ARF partner preference (e.g. ARF7/ARF19 in lateral root founder cells
    versus ARF5) using tissue-specific proximity labelling or FRET-FLIM.
  hypothesis: >-
    IAA17 preferentially represses specific activator ARFs in the root, explaining axr3-1
    root phenotypes.
