suggested_questions:
- question: Is PLGG1 a strict 1:1 glycolate/glycerate antiporter, or can it also catalyse
    unidirectional glycolate efflux (e.g. proton-coupled), given that two glycolate molecules
    leave the chloroplast for every glycerate that returns?
- question: Are the ABA-related phenotypes of plgg1 mutants (lateral roots, stomata,
    germination) caused by photorespiratory metabolite accumulation, and are they suppressed
    by elevated CO2?
- question: Does the bacterial LrgB/CidB homolog family also transport glycolate or related
    small organic acids, and does that underlie its reported role in bacterial cell lysis?
suggested_experiments:
- description: Measure glycolate and glycerate transport by purified, reconstituted PLGG1
    in proteoliposomes under defined counter-substrate and proton gradients, to determine
    stoichiometry, coupling and kinetics without the high diffusion background reported
    in earlier liposome assays.
  experiment_type: biochemical transport assay
- description: Test whether ABA-dependent lateral root, stomatal and germination phenotypes
    of plgg1 mutants persist when plants are grown in elevated CO2.
  experiment_type: genetic/physiological
