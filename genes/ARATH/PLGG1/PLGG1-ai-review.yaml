taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PLGG1 (plastidal glycolate/glycerate translocator 1; also AtLrgB; At1g32080) is a
  polytopic membrane protein of the chloroplast envelope, with twelve predicted
  transmembrane helices, belonging to the LrgB/CidB family that is shared with bacteria,
  archaea and fungi. It moves the photorespiratory intermediates glycolate and glycerate
  across the envelope, exporting glycolate made from 2-phosphoglycolate in the stroma and
  importing glycerate returning from the peroxisome for phosphorylation by glycerate
  kinase. It behaves as a glycolate/glycerate exchanger and shares glycolate export with
  the bile acid sodium symporter BASS6, whereas glycerate import depends on PLGG1 alone.
  Loss of PLGG1 causes accumulation of glycolate and glycerate, interveinal leaf chlorosis
  and cell death, and reduced photosynthesis in normal air, all suppressed by elevated CO2.
  The leaf phenotypes first led to proposals that it controls chloroplast development or
  cell death. Mutants are also reported to respond differently to abscisic acid in lateral
  root growth, stomatal movement and drought tolerance. PLGG1 is expressed in leaves,
  stems and flowers but not roots.
