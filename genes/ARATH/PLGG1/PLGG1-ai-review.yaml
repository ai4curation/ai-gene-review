- term:
    id: GO:0009658
    label: chloroplast organization
  evidence_type: IMP
  original_reference_id: PMID:21916894
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Based on the interveinal chlorosis, premature necrosis and delayed greening of AtLrgB
      T-DNA mutants and overexpressors, which led the authors to propose a role in
      chloroplast development.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The phenotype is real, but its interpretation has been superseded. The authors
      themselves state that the molecular mechanism was unknown. The later study that
      identified the transport activity showed that the chlorosis is suppressed by
      elevated CO2, that photorespiratory metabolites accumulate before visible symptoms,
      and that chloroplasts isolated from mutants grown in high CO2 are biochemically
      active, so the defect in chloroplasts is a secondary consequence of glycolate and
      glycerate toxicity rather than a role in chloroplast organization. UniProt carries
      a corresponding CAUTION. The acts_upstream_of_or_within phrasing does not make the
      claim false, but it is an indirect consequence of the transport function.
    supported_by:
    - reference_id: PMID:21916894
      supporting_text: >-
        Our work indicates that AtLrgB is a new player in chloroplast development, carbon
        partitioning and leaf senescence, although its molecular mechanism remains to be
        established.
    - reference_id: PMID:23382251
      supporting_text: >-
        Because the phenotype can be suppressed with high CO 2 ( Fig. 1 ) and
        biochemically active chloroplasts can be isolated from plgg1-1 mutant plants grown
        in high CO 2 ( Table 2 ), we posit that the visible symptoms are due to the
        accumulation of toxic concentrations of glycolate and glycerate.
