proposed_new_terms:
- proposed_name: glycolate:glycerate antiporter activity
  proposed_definition: >-
    Enables the transfer of a solute or solutes from one side of a membrane to the other
    according to the reaction: glycolate(in) + D-glycerate(out) = glycolate(out) +
    D-glycerate(in).
  justification: >-
    The chloroplast glycolate/glycerate carrier was characterized biochemically as an
    exchanger before its gene was known, and PLGG1 is described as a glycolate/glycerate
    antiporter, but GO only has separate glycolate and glycerate transporter activity terms
    (OLS search found no glycolate or glycerate antiporter term). A coupled exchange term
    would capture the stoichiometric link between the export and import legs of the C2
    cycle. Besides the asserted parent GO:0043879, the term belongs under GO:0015297
    antiporter activity, where GO places its other antiporter terms; proposed_parent holds
    only one term.
  proposed_parent:
    id: GO:0043879
    label: glycolate transmembrane transporter activity
  supported_by:
  - reference_id: PMID:28351992
    supporting_text: >-
      BASS6 is a member of the family of sodium-dependent symporters, which are
      unidirectional in transport, whereas PLGG1 is a glycolate/glycerate antiporter.
  - reference_id: PMID:22303256
    supporting_text: >-
      The transporter exchanged glycolate for glycerate ( Howitz and McCarty, 1991 ).
