    Chloroplast envelope glycolate/glycerate exchanger that exports photorespiratory
    glycolate from the stroma and imports glycerate for the final glycerate kinase step of
    the C2 cycle; glycolate export is shared with BASS6, and glycerate import depends on
    PLGG1 alone.
