- term:
    id: GO:0004620
    label: glycerophospholipase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT4G37050
  - AGI_LocusCode:AT4G37060
  - AGI_LocusCode:AT4G37070
  - PANTHER:PTN001282408
  review:
    summary: >-
      Phylogenetic inference from PAINT node PTN001282408 (eukaryote-level, seeded by three
      Arabidopsis pPLAII paralogs). PLP2 lies inside this clade (PTHR32176:SF109), and its own
      purified recombinant protein hydrolyses all major glycerophospholipid classes at sn-1 and sn-2.
    action: ACCEPT
    reason: >-
      This is the right level for PLP2's catalytic activity. Direct biochemistry on PLP2
      (PMID:22259021) shows deacylation of PC, PE, PG, PA, PS and PI at both acyl positions, so a
      single positional term (phospholipase A1 or A2) would be too narrow. The deep IBD node
      placement agrees with the conserved Ser-Asp patatin dyad. Nothing suggests PLP2 has lost
      the ancestral activity.
    supported_by:
    - reference_id: PMID:22259021
      supporting_text: Because the fluorescent label was at the sn -2 position, the detection of both
        the NBD-lysophospholipids and NBD-free fatty acid indicates that the enzyme releases fatty acids
        at both the sn -1 and sn -2 positions.
    - reference_id: PMID:22259021
      supporting_text: Phospholipids are cleaved by pPLAIIα at the sn -1 and sn -2 positions, and galactolipids,
        including those containing oxophytodienoic acids, can also serve as substrates.
