- term:
    id: GO:0012501
    label: programmed cell death
  evidence_type: IGI
  original_reference_id: PMID:19271961
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - AGI_LocusCode:AT1G02120
  review:
    summary: >-
      Genetic interaction with the lesion-mimic mutant vad1 (AT1G02120). PLP2 overexpression
      strongly promotes, and silencing reduces, necrotic lesions in vad1. PLP2 levels also
      correlate with cell death after paraquat or avirulent bacteria.
    action: ACCEPT
    reason: >-
      PLP2 promotes cell death in several independent settings: genetically controlled (vad1),
      chemically induced (paraquat) and pathogen-induced. The authors describe it as "an integral
      component of the plant cell death execution machinery". PLP2 plausibly does part of the work:
      as a membrane-lipid acyl hydrolase it degrades membrane glycerolipids during cell death,
      rather than only signalling upstream. The full text is not cached, so the exact mechanism
      rests on the curators' reading and the authors' interpretation.
    supported_by:
    - reference_id: PMID:19271961
      supporting_text: Phenotypic analysis of double-mutant progeny showed that PLP2 expression strongly
        promotes necrotic symptoms in vad1 leaves
    - reference_id: PMID:19271961
