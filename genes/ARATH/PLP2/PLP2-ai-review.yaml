  findings: []
core_functions:
- description: >-
    Broad-specificity patatin-type lipid acyl hydrolase (Ser66-Asp215 dyad). It releases fatty
    acids from the sn-1 and sn-2 positions of membrane glycerophospholipids. Knockout leaves contain
    less lysophosphatidylcholine and lysophosphatidylethanolamine. This catalytic activity
    is shown for PLP2 itself and is inherited from the deep pPLAII PAINT node PTN001282408.
  molecular_function:
    id: GO:0004620
    label: glycerophospholipase activity
  directly_involved_in:
  - id: GO:0009395
    label: phospholipid catabolic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:22259021
    supporting_text: Because the fluorescent label was at the sn -2 position, the detection of both the
      NBD-lysophospholipids and NBD-free fatty acid indicates that the enzyme releases fatty acids at
      both the sn -1 and sn -2 positions.
  - reference_id: PMID:22259021
    supporting_text: pPLAIIα KO leaves contained approximately 30 and 15% less LPC and LPE, respectively
  - reference_id: PMID:16297072
    supporting_text: PLP2 encodes a cytoplasmic lipid acyl hydrolase with wide substrate specificity
- description: >-
    Galactolipid acyl hydrolase activity on MGDG and DGDG, including OPDA-containing arabidopsides,
    producing lyso-galactolipids. Shown in vitro for PLP2.
  molecular_function:
    id: GO:0047714
    label: galactolipase activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:22259021
    supporting_text: pPLAIIα also acted on nearly every species of MGDG and DGDG ( Figure 3A ), including
      those containing OPDA ( Figure 3B ), resulting in the production of corresponding lysogalactolipids
      monogalactosyl monoacylglyceride and digalactosyl monoacylglyceride
- description: >-
    A stress- and pathogen-induced lipolytic activity that promotes the execution of cell death
    (genetically, chemically and pathogen-triggered). Through this activity PLP2 shapes the outcome
    of interactions with necrotrophic fungi, avirulent bacteria and CMV. This role is established
    experimentally only in Arabidopsis and is specific to PLP2 (Brassicaceae PAINT node
    PTN004927362).
  molecular_function:
    id: GO:0004620
    label: glycerophospholipase activity
  directly_involved_in:
  - id: GO:0012501
    label: programmed cell death
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:19271961
    supporting_text: PLP2 is an integral component of the plant cell death execution machinery
  - reference_id: PMID:16297072
    supporting_text: We also established a positive correlation between the level of PLP2 expression in
      transgenic plants and cell death or damage in response to paraquat treatment or infection by avirulent
      P. syringae
suggested_questions:
- question: >-
    Which membrane lipid species does PLP2 hydrolyse in vivo during cell death, and does its lipolytic
    activity drive membrane breakdown directly or by supplying fatty-acid precursors for
    alpha-dioxygenase-derived oxylipins?
- question: >-
    How can loss of PLP2 raise basal JA and OPDA (PMID:22259021) while PLP2 is required for
    alpha-DOX oxylipin accumulation in Botrytis-infected leaves (PMID:19271961)? Is the preference
    for oxidised acyl chains condition-dependent?
- question: >-
    Do the grass pPLAII-like paralogs (PTHR32176 SF103/SF26) keep PLP2's broad sn-1/sn-2 and
    galactolipid specificity, given that they are out-paralogs separated at duplication node
    PTN009133995?
suggested_experiments:
- description: >-
    Make a catalytically dead PLP2 (S66A or D215N) and test whether it complements the knockout or
    overexpression phenotypes: vad1 lesion enhancement, paraquat cell death, Botrytis
    susceptibility and leaf water loss. This would show whether the cell-death role needs acyl
    hydrolase activity.
- description: >-
    Run lipidomics on oxidised and unoxidised membrane lipids in plp2 knockout and catalytic-mutant
    lines during Botrytis infection and vad1 lesion formation, to identify the in vivo substrates.
