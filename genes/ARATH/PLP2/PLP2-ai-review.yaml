  review:
    summary: >-
      Based on lipid acyl hydrolase activity of recombinant PLP2 and on lipid changes in transgenic
      plants.
    action: MODIFY
    reason: >-
      The term is correct but too general. PLP2 breaks down membrane glycerolipids. The knockout
      has less LPC and LPE (PMID:22259021), so PLP2 deacylates phospholipids in vivo. Phospholipid
      catabolic process is the precise term these data support. Galactolipid hydrolysis has been
      shown only in vitro, so galactolipid catabolic process is not proposed here.
