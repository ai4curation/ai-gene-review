- term:
    id: GO:0009626
    label: plant-type hypersensitive response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT2G26560
  - PANTHER:PTN004927362
  review:
    summary: >-
      PAINT IBD at the Brassicaceae node PTN004927362, seeded by PLP2's own experimental
      annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      PLP2 appearing in its own WITH/FROM is expected: its experimental HR data seeded the node.
      Biologically, PLP2 modulates HR-type cell death. It potentiates cell death after avirulent
      P. syringae infection while weakening bacterial restriction, and it contributes to
      HR-associated resistance to CMV. The plausible mechanism is lipolytic execution of cell death
      (see the programmed cell death row). The HR outcome is pathogen-dependent and a step removed
      from PLP2's catalytic role, so this term is kept as non-core. The PAINT curator limited the
      node to Brassicaceae (taxon:3700), not the deep pPLAII node, so the claim should not be
      transferred to grass paralogs.
    supported_by:
    - reference_id: PMID:16297072
      supporting_text: PLP2 potentiates plant cell death inflicted by Botrytis and reduces the efficiency
        of the hypersensitive response in restricting the multiplication of avirulent bacteria
    - reference_id: PMID:19271961
      supporting_text: PLP2 contributes to resistance to Cucumber mosaic virus, an obligate parasite inducing
        the hypersensitive response
