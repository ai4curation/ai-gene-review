- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: HDA
  original_reference_id: PMID:28887381
  qualifier: located_in
  review:
    summary: >-
      High-throughput assignment from a leaf membrane-fraction SEC/LC-MS profiling study. The
      organelle call for PLP2 sits in supplemental tables that are not in the cached text.
    action: UNDECIDED
    reason: >-
      The study's own point is that many soluble proteins partition between cytosolic and
      membrane-associated pools. A peroxisomal call in fractionation data could therefore reflect
      membrane association or co-fractionation rather than residence in peroxisomes. PLP2 has no
      PTS1/PTS2 signal annotated, and no targeted study places it in peroxisomes. The specific
      assignment cannot be verified, so this row is left undecided rather than removed.
    supported_by:
    - reference_id: PMID:28887381
      supporting_text: Over 150 proteins had a complicated localization pattern, and were clearly partitioned
        between cytosolic and membrane-associated pools.
- term:
