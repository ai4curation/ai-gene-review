id: O48723
gene_symbol: PLP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PLP2 (patatin-like protein 2; also called pPLAIIalpha or AtPLA IIA; At2g26560) is a 407-residue
  soluble patatin-related phospholipase A of Arabidopsis thaliana. It has a PNPLA (patatin) domain
  with a GXSXG serine nucleophile (Ser66) and a DGA/G aspartate (Asp215) that form the patatin
  catalytic dyad, and it has no signal peptide. Purified recombinant PLP2 is a broad-specificity
  lipid acyl hydrolase. It releases fatty acids from both the sn-1 and sn-2 positions of
  phosphatidylcholine, phosphatidylethanolamine, phosphatidylglycerol, phosphatidic acid,
  phosphatidylserine and phosphatidylinositol. It also deacylates monogalactosyl- and
  digalactosyldiacylglycerol, including OPDA-containing arabidopsides, to the corresponding
  lyso-galactolipids. Knockout leaves contain less lysophosphatidylcholine and
  lysophosphatidylethanolamine, which shows that PLP2 hydrolyses membrane phospholipids in vivo.
  GFP fusions locate the protein to the cytoplasm. The gene is expressed mainly in roots and is
  strongly induced in leaves by pathogens and by abiotic stresses. Induction by Botrytis cinerea
  and avirulent Pseudomonas syringae depends on jasmonate and ethylene signalling. PLP2 promotes
  cell death: its level correlates with cell death after paraquat treatment or avirulent bacterial
  infection, and it strongly enhances lesion formation in the vad1 lesion-mimic mutant. As a result,
  PLP2 increases susceptibility to necrotrophic B. cinerea and weakens the hypersensitive-response
  restriction of avirulent P. syringae, but it contributes to resistance to Cucumber mosaic virus.
  PLP2 also affects oxylipin levels. Under basal conditions the knockout has more jasmonic acid,
  OPDA and 13-HPOT, whereas in Botrytis-challenged leaves alpha-dioxygenase-derived oxylipins
  accumulate in a PLP2-dependent manner. Knockout plants also lose water faster than wild type,
  through an ABA-independent mechanism.
