- term:
    id: GO:0031408
    label: oxylipin biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:19271961
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      In Botrytis-infected leaves, alpha-dioxygenase-pathway oxylipins accumulate in a
      PLP2-dependent manner.
    action: KEEP_AS_NON_CORE
    reason: >-
      PLP2 affects oxylipin levels, but the sign depends on context. In infected leaves some
      alpha-DOX products depend on PLP2 (PMID:19271961), consistent with PLP2 releasing fatty-acid
      precursors, which would be participation in the first step. In unchallenged leaves the
      knockout has more JA, MeJA, OPDA and 13-HPOT (PMID:22259021), and those authors conclude that
      PLP2 negatively regulates oxylipin production. Because the role differs by condition and the
      precursor-supply mechanism has not been shown directly, the term is kept as non-core.
    supported_by:
    - reference_id: PMID:19271961
      supporting_text: Several compounds previously described as modulating plant tissue damage and issued
        from the alpha-dioxygenase pathway were found to accumulate in a PLP2-dependent manner
    - reference_id: PMID:22259021
      supporting_text: These results indicate that pPLAIIα negatively regulates oxylipin production and
        suggest a role in the removal of oxidatively modified fatty acids from membranes.
