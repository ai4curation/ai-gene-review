- term:
    id: GO:0016760
    label: cellulose synthase (UDP-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005150
  review:
    summary: >-
      InterPro2GO mapping from the cellulose synthase catalytic domain. For CSLD3 this has
      been confirmed directly by biochemistry.
    action: ACCEPT
    reason: >-
      GO:0016760 is defined as UDP-glucose + (1,4)-beta-D-glucan(n) = UDP +
      (1,4)-beta-D-glucan(n+1). Purified CSLD3 reconstituted in proteoliposomes used
      UDP-Glc, not GDP-Man, and made a product digested only by a beta-1,4-specific
      glucanase (PMID:32169960). The CSLD3 catalytic domain in CESA6 rescued the cesa6
      mutant, but a TED-motif-dead version did not (PMID:32169960). The reverse chimera
      rescued csld3 root hairs (PMID:21765420). This is CSLD3's core molecular function, and
      it is established experimentally in Arabidopsis, not inferred. PAINT did not propagate
      cellulose synthase activity to the CSLD lineage (the GO:0016759 IBD sits on
      PTN000999295, which CSLD3 does not descend from). The activity here therefore rests on
      CSLD3's own biochemistry and should not be read as a family-wide transfer to other
      CSLD clades.
    supported_by:
    - reference_id: PMID:32169960
      supporting_text: Taken together, these results strongly support the conclusion that
        CSLD3 utilizes UDP-Glc as a substrate and synthesizes β-1,4-glucan and not β-1,4-mannan.
    - reference_id: PMID:21765420
      supporting_text: we provide evidence that CSLD3 represents a distinct (1→4)-β-glucan
        synthase activity in apical plasma membranes during tip growth in root-hair cells
- term:
    id: GO:0030244
    label: cellulose biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005150
  review:
    summary: InterPro2GO mapping. It fits the experimentally shown beta-1,4-glucan synthase activity.
    action: ACCEPT
    reason: >-
      CSLD3 polymerises beta-1,4-glucan from UDP-Glc (PMID:32169960). In root hairs it is
      needed for de novo synthesis of cellulose-like polysaccharides at the tip
      (PMID:21765420), and csld3 root-hair walls have disorganised cellulose
      (PMID:21279381). When its catalytic domain is placed in CESA6, it supports crystalline
      cellulose accumulation (PMID:32169960). CSLD3 catalyses the polymerisation step, so it
      takes part in the process. Whether the native CSLD3 polymer forms microfibrils like
      CESA cellulose is still open, but the polymer is chemically beta-1,4-glucan.
    supported_by:
    - reference_id: PMID:32169960
      supporting_text: These studies further support the synthesis of β-1,4-glucan polymers
        that can integrate into crystalline cellulose.
    - reference_id: PMID:21765420
      supporting_text: We show that cellulose-like polysaccharides are present in root-hair
        tips, and de novo synthesis of these polysaccharides is required for tip growth.
- term:
    id: GO:0051753
    label: mannan synthase activity
  evidence_type: IDA
  original_reference_id: PMID:21904114
  qualifier: enables
  review:
    summary: >-
      Based on the Yin et al. 2011 / Verhertbruggen et al. 2011 tobacco microsome assays,
      in which GDP-Man mannosyltransferase activity was seen when CSLD2 and CSLD3 were
      co-expressed.
    action: REMOVE
    reason: >-
      The original data showed no mannan synthase activity for CSLD3 expressed on its own.
      Activity was seen only when it was co-expressed with CSLD2, in crude microsomes that
      already contain endogenous mannan synthase (PMID:21471331). Purified, reconstituted
      CSLD3 did not use GDP-Man and made beta-1,4-glucan from UDP-Glc, with CSLA9 as the
      positive control for mannan synthesis (PMID:32169960). The authors of that study noted
      the conflict with the microsome data and explained it as endogenous activity. Direct
      biochemistry contradicts CSLD3 having this activity, so the annotation is removed. The
      PTHR13301 family review reaches the same conclusion.
    supported_by:
    - reference_id: PMID:21471331
      supporting_text: The same activity was detected when CSLD2 and CSLD3 were co-expressed
        but not when they were expressed separately.
    - reference_id: PMID:32169960
      supporting_text: Taken together, these results strongly support the conclusion that
        CSLD3 utilizes UDP-Glc as a substrate and synthesizes β-1,4-glucan and not β-1,4-mannan.
    - reference_id: PMID:32169960
      supporting_text: However, it should be noted that mannan synthesis in these studies
        was assessed in plant membranes overexpressing CSLD proteins that contained endogenous
        β-1,4-mannan activity
