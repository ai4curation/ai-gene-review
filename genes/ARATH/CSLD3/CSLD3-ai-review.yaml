- term:
    id: GO:0048767
    label: root hair elongation
  evidence_type: IMP
  original_reference_id: PMID:11156607
  review:
    summary: >-
      Proposed new annotation. kjk/csld3 mutants start root hairs normally, but the hairs
      burst at the tip and fail to elongate. CSLD3 supplies beta-1,4-glucan at the apical
      plasma membrane during tip growth.
    action: NEW
    reason: >-
      Participation test: the phenotype alone would only show necessity. Here CSLD3 also
      does part of the work: it makes the cellulose-like wall polysaccharide laid down at the
      growing tip (PMID:21765420), and de novo synthesis of that polysaccharide is needed for
      tip growth. Comparator check: the paralog CSLD2, which has the same role in the same
      cells, carries GO:0048767 (IMP, PMID:18768911). The term is absent for CSLD3, the
      founding mutant of this phenotype, so this looks like a gap rather than a deliberate
      convention. Two independent alleles show that elongation, not initiation, is affected
      (PMID:11156607, PMID:11402188).
    supported_by:
    - reference_id: PMID:11156607
      supporting_text: Plants homozygous for kojak (kjk) mutations initiate root hairs that
        rupture at their tip soon after initiation.
    - reference_id: PMID:11402188
      supporting_text: In the mutant, root hairs were initiated at the correct position and
        grew into a bulge, but their elongation was severely reduced.
    - reference_id: PMID:21765420
      supporting_text: We show that cellulose-like polysaccharides are present in root-hair
        tips, and de novo synthesis of these polysaccharides is required for tip growth.
