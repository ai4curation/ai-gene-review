id: Q9M9M4
gene_symbol: CSLD3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  CSLD3 (KOJAK/RHD7, At3g03050) is a cellulose synthase-like D (CSLD) glycosyltransferase of
  the GT2 family. It has eight predicted transmembrane helices and a cytosolic catalytic domain
  with a conserved TED motif. Purified CSLD3 reconstituted into proteoliposomes uses
  UDP-glucose, not GDP-mannose, and makes beta-1,4-glucan. It assembles into large complexes
  with threefold-symmetric particles like those formed by CESA cellulose synthases, and its
  catalytic domain can replace that of CESA6 in vivo. A functional fluorescent CSLD3 fusion
  accumulates in a polarized apical plasma-membrane domain of growing root hairs, where CESAs
  are absent. There it makes cellulose-like beta-1,4-glucan needed for tip growth. The protein
  also passes through the Golgi and trans-Golgi network. Loss of CSLD3 lets root hairs form a
  bulge, but the hairs burst at the tip and fail to elongate, and their walls show disorganised
  cellulose and xyloglucan. CSLD3 shares partly redundant roles with CSLD2 (root hairs, female
  gametophyte) and with CSLD5 (whole-plant growth).
