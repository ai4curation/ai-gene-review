- id: file:interpro/panther/PTHR13301/PTHR13301-paint.tsv
  title: PAINT annotations for PANTHER family PTHR13301
  findings: []
- id: UniProtKB:Q9M9M4
  title: UniProtKB entry Q9M9M4 (CSLD3_ARATH)
  findings: []
core_functions:
- description: >-
    UDP-glucose-dependent beta-1,4-glucan (cellulose-like) synthase acting at the apical
    plasma membrane of tip-growing root hairs. It polymerises the wall glucan needed for root
    hair elongation and for primary wall integrity at the tip. The activity, the donor
    specificity (UDP-Glc, not GDP-Man) and the plasma-membrane site of action are
    established experimentally for Arabidopsis CSLD3 itself, by reconstitution, chimera
    complementation and functional-fusion imaging. Its assembly into ~700 kD
    threefold-symmetric complexes resembles CESA complexes.
  molecular_function:
    id: GO:0016760
    label: cellulose synthase (UDP-forming) activity
  directly_involved_in:
  - id: GO:0030244
    label: cellulose biosynthetic process
  - id: GO:0009833
    label: plant-type primary cell wall biogenesis
  - id: GO:0048767
    label: root hair elongation
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:32169960
    supporting_text: Taken together, these results strongly support the conclusion that
      CSLD3 utilizes UDP-Glc as a substrate and synthesizes β-1,4-glucan and not β-1,4-mannan.
  - reference_id: PMID:32169960
    supporting_text: both CSLD3 and CESA6 were present in particles of ∼10- to 12-nm diameter
      with an apparent threefold symmetry
  - reference_id: PMID:21765420
    supporting_text: we provide evidence that CSLD3 represents a distinct (1→4)-β-glucan synthase
      activity in apical plasma membranes during tip growth in root-hair cells
  - reference_id: PMID:11402188
    supporting_text: In the mutant, root hairs were initiated at the correct position and
      grew into a bulge, but their elongation was severely reduced.
suggested_questions:
- question: >-
    Should cellulose synthase (UDP-forming) activity be placed on a PAINT node covering the
    CSLD clade? CSLD3 is the only member characterised biochemically. Whether CSLD5 and the
    pollen CSLD1/CSLD4 share UDP-Glc specificity is untested, so a family-wide propagation
    would currently rest on one member.
  experts:
  - PAINT/PANTHER curators
- question: >-
    What makes the CSLD3 beta-1,4-glucan structurally different from CESA cellulose in tip
    walls, given that its catalytic domain can replace that of CESA6? Is the difference in
    complex architecture, in microtubule independence, or in co-polymerisation with other
    wall components?
  experts:
  - Plant cell wall biochemists (e.g. Nielsen lab)
suggested_experiments:
- hypothesis: CSLD2 and CSLD5 share CSLD3's UDP-Glc-dependent beta-1,4-glucan synthase activity.
  description: >-
    Express and purify CSLD2, CSLD5 and CSLD1 from yeast, reconstitute them into
    proteoliposomes as for CSLD3, and assay UDP-Glc and GDP-Man incorporation, with
    linkage-specific glucanase/mannanase product analysis.
- hypothesis: Native CSLD3 complexes at the root hair tip are homo-oligomeric.
  description: >-
    Use native-promoter tagged CSLD3 with CSLD2 co-immunoprecipitation and single-particle
    imaging of root-hair plasma membranes to find whether CSLD2 or CESAs co-assemble with
    CSLD3.
