    summary: >-
      Favery et al. 2001 saw a GFP-KOJAK fusion in the ER and from this argued for a
      non-cellulosic product.
    action: KEEP_AS_NON_CORE
    reason: >-
      The observation is experimental. A multi-pass membrane protein will pass through the
      ER on its way out, so the term is not wrong. Later work with a functional,
      complementing eYFP-CSLD3 found the protein at the apical plasma membrane of root hairs
      (PMID:21765420), and purified CSLD3 makes beta-1,4-glucan (PMID:32169960). This
