gene_symbol: ISPG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ISPG (HDS, GCPE; CLB4/CSB3) is the chloroplast 4-hydroxy-3-methylbut-2-enyl diphosphate synthase of
  Arabidopsis thaliana, the penultimate enzyme of the methylerythritol 4-phosphate (MEP) pathway that supplies isopentenyl
  and dimethylallyl diphosphate for plastid isoprenoids. A nuclear-encoded protein with an N-terminal transit peptide,
  it resides in the chloroplast stroma, where its [4Fe-4S] cluster catalyses two one-electron reductions that open
  2-C-methyl-D-erythritol 2,4-cyclodiphosphate to (E)-4-hydroxy-3-methylbut-2-enyl diphosphate. Unlike bacterial
  IspG, which uses flavodoxin, the plant enzyme is reduced by ferredoxin, either directly from the photosynthetic
  electron transport chain in the light or via NADPH and ferredoxin-NADP+ reductase in the dark. It belongs to the
  long plant-type IspG with an extra central domain of about 30 kDa. Null alleles (clb4) are albino and seedling
  lethal because chloroplast differentiation arrests without plastid isoprenoids, whereas the hypomorphic csb3 allele
  causes enhanced salicylic acid-dependent resistance to biotrophic pathogens that is reversed by the MEP pathway
  inhibitor fosmidomycin.
