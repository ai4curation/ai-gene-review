  review:
    summary: AtSubP sequence-based prediction of nuclear location.
    action: REMOVE
    reason: HDS has a chloroplast transit peptide that targets it to chloroplasts in vivo, GFP fusions place the
      MEP enzymes in chloroplasts, and stromal proteomics repeatedly identify it in purified stroma. No experiment
      places it in the nucleus, and the activity needs plastid-supplied MEcPP and reduced ferredoxin. The prediction
      is contradicted by the localization evidence.
