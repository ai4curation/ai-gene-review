    reason: The cited identifier resolves to an unrelated bacterial paper (correctness WRONG_IDENTIFIER;
      the same erroneous PMID is attached to a GL1 fruit development row). The only fruit-related TRY
      biology known is suppression of trichome formation on siliques by redundant R3 MYBs, which is epidermal
      trichome patterning on the fruit surface, not fruit development. Marked as over-annotation rather
