suggested_questions:
- question: How much of WRKY33-dependent resistance to Botrytis is explained by camalexin, given that wrky33 shows
    only delayed camalexin induction in some studies, and which other direct targets are critical?
- question: Should defense response to fungus be kept for transcription factors such as WRKY33, or replaced by positive
    regulation of defense response to fungus once the regulated effector genes are annotated?
suggested_experiments:
- description: Genome-wide ChIP-seq of phospho-null and phospho-mimic WRKY33 after Botrytis infection, combined
    with targeted rescue of individual direct targets in wrky33, to determine which targets account for resistance.
