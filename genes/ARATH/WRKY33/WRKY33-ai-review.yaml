      supporting_text: mutations of the Arabidopsis WRKY33 gene encoding a WRKY transcription factor cause enhanced
        susceptibility to the necrotrophic fungal pathogens Botrytis cinerea and Alternaria brassicicola concomitant
        with reduced expression of the jasmonate-regulated plant defensin PDF1.2 gene
    - reference_id: PMID:17059405
      supporting_text: Ectopic over-expression of WRKY33, on the other hand, increases resistance to the two necrotrophic
        fungal pathogens
    - reference_id: PMID:22392279
