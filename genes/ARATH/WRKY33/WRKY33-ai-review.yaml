id: Q8S8P5
gene_symbol: WRKY33
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: WRKY33 is a nuclear group I WRKY transcription factor of Arabidopsis thaliana with two WRKY zinc-finger
  DNA-binding domains that bind the W-box cis-element (TTGAC[C/T]). It is strongly induced by pathogens, PAMPs and
  abiotic stresses and is a central transcriptional regulator of defense against necrotrophic fungi such as Botrytis
  cinerea and Alternaria brassicicola. In resting cells WRKY33 is held in a nuclear complex with MPK4 and the VQ
  protein MKS1; pathogen-triggered MPK4 activation releases it. It is phosphorylated on N-terminal serines by MPK3
  and MPK6 (and on Thr229 by CPK5/CPK6), which enhances its transactivation capacity, and its DNA-binding activity
  is stimulated by the VQ coactivators SIB1 and SIB2. WRKY33 binds the promoters of the camalexin biosynthetic genes
  PAD3 (CYP71B15) and CYP71A13, its own promoter (positive feedback) and ALD1, and activates their expression, driving
  phytoalexin camalexin and pipecolic acid production. It also shapes salicylate/jasmonate/ethylene crosstalk during
  infection. With WRKY25 and WRKY26 it contributes to thermotolerance, and it has more modest roles in salt tolerance,
  systemic acquired resistance, pathogen-induced autophagy and phosphate-status-dependent repression of anthocyanin
  genes.
