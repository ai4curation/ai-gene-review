- term:
    id: GO:0010120
    label: camalexin biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:18650934
  qualifier: acts_upstream_of_or_within
  review:
    summary: 'IMP: wrky33 mutants are impaired in PAD3 induction and camalexin accumulation; WRKY33 binds the PAD3
      promoter.'
    action: MODIFY
    reason: WRKY33 does not catalyse any step of camalexin biosynthesis; the enzymes CYP79B2/B3, CYP71A13 and PAD3
      (CYP71B15) do. WRKY33 binds the PAD3 and CYP71A13 promoters and activates their transcription downstream of
      MPK3/MPK6. The process it participates in is therefore positive regulation of camalexin biosynthesis, matching
      the term used for MPK3 in this repository.
