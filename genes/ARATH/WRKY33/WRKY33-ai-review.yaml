  review:
    summary: 'IMP: wrky33 mutants are highly susceptible to Botrytis cinerea and Alternaria brassicicola; overexpression
      increases resistance.'
    action: ACCEPT
    reason: Strongest and best-replicated phenotype of WRKY33, and the gene product does work in this response as
      the transcription factor that reprograms defense gene expression (camalexin genes, redox, hormone crosstalk
      genes) after infection. Camalexin regulation explains only part of the resistance, so the broader process
      term is warranted alongside positive regulation of camalexin biosynthesis.
