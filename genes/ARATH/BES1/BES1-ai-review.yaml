core_functions:
- description: >-
    Plant-specific BZR-family DNA-binding transcription factor that, when dephosphorylated in response
    to brassinosteroid, accumulates in the nucleus and binds BRRE (CGTGT/CG) and E-box (CANNTG) elements,
    alone or with partners such as BIM1, to activate BR-induced genes and repress BR-repressed genes (e.g.
    BRAVO, MYB11/12/111).
