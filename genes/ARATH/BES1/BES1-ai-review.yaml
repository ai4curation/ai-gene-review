suggested_questions:
- question: >-
    To what extent are BES1 and BZR1 functionally interchangeable in vivo, given their differing preference
    for activation versus repression?
- question: >-
    What is the functional significance of the accession-specific BES1-L isoform for BR responses in natural
    populations?
suggested_experiments:
- description: >-
    ChIP-seq of BES1-S and BES1-L in bes1 bzr1 backgrounds with and without BR to compare their target
    repertoires and BIM1 dependence.
