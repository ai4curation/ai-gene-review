core_functions:
- description: Nuclear TALE homeodomain transcription factor that binds cis-regulatory DNA (TGAC core) and regulates target
    gene transcription (e.g. LOB, lignin-related genes, FIL/JAG) to maintain a growth-competent, less differentiated state
    in the inflorescence stem, pedicel and replum.
  molecular_function: *id004
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id003
  - *id009
  - *id001
  - *id008
- description: Heterodimerizes through its MEINOX domain with BEL1-like TALE homeodomain proteins (BEL1, PNY/BLH9, BLR/VAN,
    SAW1/SAW2 and others); the heterodimer is the transcriptionally active unit and promotes nuclear localisation of the partner.
  molecular_function: *id005
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id007
  - *id003
  - *id010
  - *id011
suggested_questions:
- question: Which direct target promoters does the BP-PNY heterodimer bind in the inflorescence stem and pedicel (e.g. lignin
    biosynthesis genes, FIL/JAG), and which BELL partner is used in the replum?
- question: Is the reported KNAT1 self-interaction (Y2H) a functional homodimer in planta, or a screen artefact?
suggested_experiments:
- description: ChIP-seq or DAP-seq of KNAT1/BP in inflorescence stems, with and without pny, to define direct targets and
    the dependence of DNA binding on BELL partners.
