id: P46639
gene_symbol: KNAT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: KNAT1, also called BREVIPEDICELLUS (BP), is a class I KNOTTED1-like (KNOX) TALE homeodomain transcription factor
  of Arabidopsis thaliana. It carries the MEINOX (KNOX1/KNOX2) interaction domain, an ELK domain and a TALE-type homeodomain,
  and acts in the nucleus as a heterodimer with BEL1-like (BELL/BLH) TALE partners such as PENNYWISE (BLH9), BELLRINGER/VAAMANA
  and BEL1; BELL partnering is required for transcriptional activation and nuclear accumulation. KNAT1 is expressed in the
  shoot apical meristem, is down-regulated in leaf primordia by AS1, YABBY, SAW1/SAW2 and HAN, and after the floral transition
  is expressed in the cortex of the inflorescence stem and pedicels and at stem/lateral organ boundaries. Loss of function
  causes short, downward-pointing pedicels and compact internodes with defects in cell division and cortical/epidermal differentiation,
  altered vascular patterning and, with BLR and REV, defective xylem differentiation. In the gynoecium BP, with REPLUMLESS,
  promotes replum identity and limits expression of the lateral factors FILAMENTOUS FLOWER and JAGGED. KNAT1 overexpression
  produces lobed leaves, and the protein can move between meristem cell layers.
