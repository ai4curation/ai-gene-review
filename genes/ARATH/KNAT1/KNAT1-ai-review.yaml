  review:
    summary: Cell fate specification based on the 1994 cloning paper, in which 35S::KNAT1 misexpression produced lobed leaves.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited evidence (abstract-only in cache) is ectopic overexpression altering leaf morphology. Misexpression
      phenotypes show what KNAT1 can do outside its domain, not that it specifies cell fates during normal development; loss-of-function
      data instead point to roles in pedicel/internode growth and differentiation, captured by other rows.
