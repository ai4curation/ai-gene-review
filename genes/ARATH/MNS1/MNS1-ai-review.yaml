core_functions:
- description: Golgi class I (GH47) alpha-1,2-mannosidase that trims Man8GlcNAc2 (and,
    less completely, Man9GlcNAc2) on newly synthesized glycoproteins to Man5GlcNAc2,
    acting first on the A-branch. Redundantly with MNS2, it supplies the substrate for
    hybrid and complex N-glycan formation in the Golgi.
  molecular_function:
    id: GO:0004571
    label: mannosyl-oligosaccharide 1,2-alpha-mannosidase activity
  directly_involved_in:
  - id: GO:0006491
    label: N-glycan processing
  locations:
  - id: GO:0000139
    label: Golgi membrane
  - id: GO:0000137
    label: Golgi cis cisterna
  supported_by:
  - reference_id: PMID:19914916
    supporting_text: both AtMANI isoforms encode 1-deoxymannojirimycin-sensitive alpha-mannosidase
      I and act on Man(8)GlcNAc(2) and Man(9)GlcNAc(2) structures to yield Man(5)GlcNAc(2)
  - reference_id: PMID:19914916
    supporting_text: either AtMANIa or AtMANIb can function as the Golgi alpha-mannosidase
      I that produces the Man(5)GlcNAc(2) N-glycan structure necessary for complex N-glycan
      synthesis
  - reference_id: PMID:20023195
    supporting_text: Man(8)GlcNAc(2) accumulation in the mns1 mns2 double mutant
  - reference_id: PMID:24737672
    supporting_text: MNS1 and MNS2 preferentially cleave off a terminal α1,2-linked Man residue
      from the A-branch
suggested_questions:
- question: PAINT places ER (GO:0005783) and ERAD (GO:0036503) at the PTHR11742 root, and they
    propagate into the Golgi clade (PTN000201534). Arabidopsis MNS1/MNS2 are experimentally
    dispensable for ERAD. Should these IBDs be blocked at the Golgi node?
- question: Isoform 2 (Q9C512-2) lacks residues 1-104, including the cytoplasmic tail and
    signal-anchor transmembrane segment. Is it expressed as a protein, and if so is it
    secreted or misrouted, and is it active?
- question: Plant MNS1 trims Man9GlcNAc2 only to Man6GlcNAc2, by a route distinct from
    mammalian MANI. Is this branch preference shared by insect SF6 members such as Drosophila
    alpha-Man-Ia, or is it specific to plants?
suggested_experiments:
- description: Test single-residue variants of the predicted catalytic acid/base residues
    (positions 179, 312, 423, 445) and the Ca2+-binding residue 529 on recombinant MNS1. Use
    defined Man9 isomers to map which residues set the A-branch preference and the poor
    B-branch activity.
- description: Use cisternal-resolution imaging (e.g. super-resolution colocalization with cis
    and trans Golgi markers) of MNS1 expressed from its native promoter, to confirm the cis
    cisterna assignment and rule out residence in the TGN or early endosome.
