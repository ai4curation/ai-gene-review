  review:
    summary: PAINT placed ER at the family root PTN000201533, seeded only by ER-type class I
      mannosidases (human MAN1B1, yeast Mns1, Htm1/Mnl1 and a Candida ortholog). MNS1 is in
      the Golgi clade PTN000201534, which carries a separate Golgi membrane IBD.
