    label: Golgi cis cisterna
  evidence_type: HDA
  original_reference_id: PMID:31266899
  qualifier: located_in
  review:
    summary: Cisternal-resolution proteomics (free-flow separation of early to late Golgi
      subcompartments) assigned MNS1 to the cis cisterna. This matches the early position
      of class I mannosidase trimming, before the medial/trans glycosyltransferases that
      build complex glycans.
    action: ACCEPT
    reason: Fits the enzyme's place in the N-glycan maturation pathway. Its Man5GlcNAc2
      product is the substrate for GnTI and later Golgi enzymes. The cached paper is
      abstract-only, so I cannot check the MNS1-specific assignment and defer to the TAIR
      curator. A cis-cisterna location is compatible with the experimentally established
      Golgi membrane residence.
    supported_by:
    - reference_id: PMID:31266899
      supporting_text: we exploit differences in surface charge of intact cisternae to perform
        separation of early to late Golgi subcompartments
    - reference_id: PMID:19914916
      supporting_text: Golgi alpha-mannosidase I hydrolases (MANI) are key enzymes that play
        a role in the early N-glycan modification pathway in the Golgi apparatus.
