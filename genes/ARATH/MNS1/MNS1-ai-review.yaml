id: Q9C512
gene_symbol: MNS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: MNS1 (At1g51590; also called AtMANIb or alpha-mannosidase IB) is one of two
  redundant Golgi class I alpha-1,2-mannosidases (glycoside hydrolase family 47) in Arabidopsis.
  It is a type II single-pass membrane protein with a short cytoplasmic tail, a signal-anchor
  transmembrane segment and a lumenal GH47 catalytic domain. It depends on Ca2+ or Mn2+. Recombinant
  MNS1 trims alpha-1,2-linked mannose residues from oligomannosidic N-glycans. It converts Man8GlcNAc2,
  the product of the ER/early-Golgi mannosidase MNS3, to Man5GlcNAc2, starting on the A-branch.
  From Man9GlcNAc2 it yields only Man6GlcNAc2, because it acts poorly on the terminal mannose of
  the B-branch. Together with its paralog MNS2 it produces the Man5GlcNAc2 substrate needed to
  make hybrid and complex plant N-glycans in the Golgi. Fluorescent fusions localize to Golgi
  stacks, and proteomic fractionation places it in early (cis) Golgi cisternae. Single mutants
  have normal glycans. mns1 mns2 double mutants accumulate Man8GlcNAc2 and lack complex N-glycans.
  They have root-growth and cell-wall defects that become severe under salt stress, when the
  abundance of glycoproteins such as the cellulose-related endoglucanase KORRIGAN/RSW2 falls.
  MNS1 is not needed for glycan-dependent ER-associated degradation, which in plants uses the
  ER-resident MNS4 and MNS5.
