  review:
    summary: The LOPIT analysis classified MNS1 into a combined Golgi/TGN class. Endosome
      appears to come from the plant TGN/early-endosome identity, not from a separate
      endosomal assignment.
    action: MARK_AS_OVER_ANNOTATED
