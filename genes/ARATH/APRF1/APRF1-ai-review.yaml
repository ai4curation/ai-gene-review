  - *id002
suggested_questions:
- question: Which direct substrate is dephosphorylated by the APRF1/LD/TOPP4 module, and how does APRF1
    couple the reaction to chromatin repression?
- question: Does the capacity of APRF1 to complement yeast Swd2 correspond to any native Arabidopsis methylating
    complex, or is that capacity separable from its termination-associated role?
