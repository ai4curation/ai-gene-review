  review:
    summary: The ancestral COMPASS assignment is too strong for native APRF1 complex membership.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'PANTHER:PTN000458398 propagates the Swd2/WDR82 COMPASS role. Full PMID:38851185 directly
      compares Arabidopsis APRF1 and S2LB: their opposing FLC and chromatin phenotypes support functional
      partitioning, with APRF1 in the termination/repression branch. Earlier yeast complementation establishes
      cross-species functional capacity, not native Arabidopsis COMPASS membership. The native complex
      claim is therefore over-propagated relative to the target-specific evidence; no universal absence
      of every methylation-associated interaction is asserted.'
