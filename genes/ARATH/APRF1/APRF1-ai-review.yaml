description: ANTHESIS PROMOTING FACTOR 1 (APRF1/S2LA) is a WD40 scaffold associated with chromatin and
  RNA-processing machinery. It participates with LD, FLD, SDG26 and EFL proteins in repression of FLOWERING
  LOCUS C (FLC), and associates with LD and the PP1-family phosphatase TOPP4 in a termination-linked module.
  Its nuclear function couples RNA 3′ processing and transcription termination to a repressive chromatin
  state; the direct phosphatase substrate is unresolved. APRF1 also has a cytoplasmic pool and compartment-specific
  HSP90 associations. Although APRF1 can functionally complement yeast Swd2, native Arabidopsis evidence
  distinguishes its FLC-repressing role from the COMPASS-associated activating role of the related S2LB
  protein. APRF1 itself is not established as a histone methylation catalyst.
