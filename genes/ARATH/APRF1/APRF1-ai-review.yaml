core_functions:
- description: Chromatin-associated WD40 scaffold supporting FLC repression through the autonomous-pathway
    and APRF1/LD/TOPP4 termination modules. This is a noncatalytic contribution; the phosphatase substrate
    and any native COMPASS function are not assumed.
  molecular_function:
    id: GO:0003682
    label: chromatin binding
