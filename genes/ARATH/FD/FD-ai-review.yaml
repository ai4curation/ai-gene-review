id: Q84JK2
gene_symbol: FD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  FD (bZIP14; At4g35900) is a group A basic leucine-zipper (bZIP) transcription factor expressed
  in the shoot apex before and during the floral transition. FD binds G-box (CACGTG) and related
  ACGT-containing elements in the nucleus and is the DNA-binding partner of the mobile florigen
  FLOWERING LOCUS T (FT): FT protein produced in leaf phloem companion cells moves to the
  shoot apical meristem, where it associates with FD through 14-3-3 proteins that recognize
  FD phosphorylated at its C-terminal SAP motif (Thr282, a target of the calcium-dependent
  kinases CPK6 and CPK33). The resulting florigen activation complex activates floral integrator
  and floral meristem identity genes such as SOC1, LEAFY, APETALA1 and SEPALLATA genes, promoting
  the transition to flowering; in floral meristems FD with its paralog FDP also supports floral
  homeotic gene expression. FD is also recruited by the antagonistic PEBP protein TERMINAL
  FLOWER 1, which competes with FT for chromatin-bound FD to repress the same targets, and
  FD/FDP contribute to abscisic acid responses in seedlings.
