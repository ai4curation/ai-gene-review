suggested_questions:
- question: >-
    Is FT binding required for FD to bind its flowering targets in vivo, or does FT mainly
    convert pre-bound FD (also used by TFL1) from a repressive to an activating complex?
- question: >-
    What is the in vivo dimerization partner of FD at the shoot apex, given that FDP is expressed
    in largely complementary domains?
suggested_experiments:
- description: >-
    Compare FD ChIP-seq in wild type, ft tsf and tfl1 apices with phospho-null (T282A) and
    phosphomimic FD alleles to separate the contributions of FT/TFL1 and 14-3-3 binding to
    FD occupancy and target activation.
