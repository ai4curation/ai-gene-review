- term:
    id: GO:0009737
    label: response to abscisic acid
  evidence_type: IEP
  original_reference_id: PMID:10571046
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      This row rests on decreased PYK20 transcript after ABA treatment in a single study. Later work gives
      a functional link: ELF3, ELF4 and LUX attenuate ABA signalling during seed germination by physically
      interacting with ABI3 and ABI5 and repressing their function and accumulation (Tang et al. 2025).
    action: MODIFY
    reason: >-
      The transcript change alone would not justify the term. Tang et al. 2025, however, shows that ELF3
      acts upstream of ABA signalling as a negative regulator, so the claim is sound but better stated
      as negative regulation of abscisic acid-activated signaling pathway. This rests on the cached abstract
      only. The abstract names ELF3 in both the physical-interaction and the ABI3/ABI5 repression statements;
      what it does not state is whether the elf3 single mutant alone shows the ABA germination phenotype.
    proposed_replacement_terms:
    - id: GO:0009788
      label: negative regulation of abscisic acid-activated signaling pathway
    supported_by:
    - reference_id: PMID:10571046
      supporting_text: >-
        IAA and kinetin treatment increased the level of the pyk20 transcript in the plant, whereas ABA
        treatment and temperature stress reduced the pyk20 transcript level.
    - reference_id: PMID:40737553
      supporting_text: >-
        the evening complex (EC) components EARLY FLOWERING 3 (ELF3), ELF4, and LUX ARRHYTHMO (LUX) attenuate
        ABA signaling
    - reference_id: PMID:40737553
