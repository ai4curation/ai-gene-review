id: O82804
gene_symbol: ELF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  EARLY FLOWERING 3 (ELF3; also PYK20) is a large (695 aa) nuclear protein with no recognisable enzymatic
  or DNA-binding domain. It is the central scaffold of the evening complex (EC), a dusk-phased transcriptional
  repressor complex of the Arabidopsis circadian clock made up of ELF3, ELF4 and the MYB-family DNA-binding
  protein LUX ARRHYTHMO. ELF3 is necessary and sufficient to bridge ELF4 and LUX. LUX targets the complex
  to promoters, and the EC then represses evening and midday clock genes (PRR9, PRR7, GI, LUX) and growth
  regulators such as PIF4 and PIF5, gating hypocotyl elongation to the end of the night. At PIF4, PIF5
  and GI, repression has been shown to involve chromatin modification: ELF3 recruits the H3K4me3 demethylases
  JMJ17 and JMJ18 to the PIF4 and PIF5 loci, acts with PRR5, TOC1 and the SWR1 complex to deposit H2A.Z
  at PIF4, and modulates H2A.Z at GI. ELF3 is required for sustained rhythms
  in continuous light and under temperature cycles. It acts as a zeitnehmer that antagonises light input
  to the clock during the night, and it also delivers temperature input to the clock, a role that appears
  not to require the rest of the EC. A C-terminal polyglutamine-containing prion-like domain lets ELF3
  sense ambient temperature: warmth drives reversible phase separation into nuclear speckles and reduces
  EC binding to its targets, which links the clock to thermomorphogenesis. ELF3 also binds phytochrome
  B and acts as a substrate adaptor that lets COP1 ubiquitinate GIGANTEA. With ELF4 and LUX it attenuates
  abscisic acid signalling in seeds by repressing the function and accumulation of ABI3 and ABI5. A shorter
  ELF3β product, from an alternative promoter in intron 2, binds full-length ELF3 and disrupts EC formation.
  Loss of ELF3 causes photoperiod-insensitive early flowering, long hypocotyls and arrhythmia in the light.
