  review:
    summary: >-
      The original PYK20 report assumed a transcription-factor role from the glutamine-rich domain alone.
      ELF3 has no DNA-binding domain; it represses transcription as the scaffold of the evening complex,
      in which LUX supplies the DNA binding.
    action: MODIFY
    reason: >-
      DNA-binding transcription factor activity is incorrect for ELF3. Its contribution to transcription
      is as a non-DNA-binding corepressor subunit of the EC, so transcription corepressor activity is
      the appropriate term.
    proposed_replacement_terms:
