core_functions:
- description: >-
    Scaffold of the evening complex. ELF3 bridges the DNA-binding protein LUX and ELF4 into a dusk-phased
    nuclear repressor complex, which LUX targets to promoters of clock genes (PRR9, PRR7, GI, LUX) and
    of growth regulators (PIF4/PIF5).
