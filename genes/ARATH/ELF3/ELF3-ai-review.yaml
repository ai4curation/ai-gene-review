suggested_questions:
- question: >-
    How does phase separation of the ELF3 prion-like domain mechanistically reduce EC occupancy at target
    promoters: by sequestering ELF3 away from LUX, or by altering the conformation of the bound complex?
- question: >-
    Does ELF3's COP1 substrate-adaptor role in GI degradation operate within the evening complex or in
    a separate, EC-independent pool of ELF3?
- question: >-
    Salicylic acid reduces ELF3 condensation yet increases ELF3 binding at the PIF4 promoter. Is the condensed
    pool of ELF3 the inactive one, and is condensation itself the switch that releases EC repression at
    warm temperature?
- question: >-
    Which partners carry ELF3's EC-independent temperature input to the oscillator, given that the rest
    of the evening complex appears not to be required?
- question: >-
    ELF3β (from an alternative promoter in intron 2) is not represented in UniProt. Should it be added as
    an alternative product, and does it have functions beyond antagonising full-length ELF3?
- question: >-
    TAIR annotates PHYB, the canonical plant thermosensor, to GO:0009266 response to temperature stimulus,
    whereas the C. elegans AFD thermoreceptor guanylyl cyclases (gcy-8, gcy-18, gcy-23) carry GO:0016048
    detection of temperature stimulus. Should direct plant thermosensors such as PHYB and ELF3 also be
    annotated to GO:0016048?
- question: >-
    ELF3 targets the JMJ17/JMJ18 H3K4me3 demethylases to PIF4 and PIF5 but the JMJs perform the catalysis.
    Does this targeting role warrant a histone H3K4 demethylation process annotation for ELF3 (the former
    process term GO:0034720 is obsolete), or is it fully captured by transcription corepressor activity?
suggested_experiments:
- description: >-
    Temperature-shift ChIP-seq of LUX and ELF3 in lines expressing PrD-deleted or PrD-swapped ELF3 variants,
    combined with in vitro EC DNA-binding at varying temperatures.
  hypothesis: >-
    PrD-driven ELF3 condensation is sufficient to release the EC from target promoters at warm temperature.
