suggested_questions:
- question: >-
    How does phase separation of the ELF3 prion-like domain mechanistically reduce EC occupancy at target
    promoters: by sequestering ELF3 away from LUX, or by altering the conformation of the bound complex?
- question: >-
    Does ELF3's COP1 substrate-adaptor role in GI degradation operate within the evening complex or in
    a separate, EC-independent pool of ELF3?
suggested_experiments:
- description: >-
    Temperature-shift ChIP-seq of LUX and ELF3 in lines expressing PrD-deleted or PrD-swapped ELF3 variants,
    combined with in vitro EC DNA-binding at varying temperatures.
  hypothesis: >-
    PrD-driven ELF3 condensation is sufficient to release the EC from target promoters at warm temperature.
