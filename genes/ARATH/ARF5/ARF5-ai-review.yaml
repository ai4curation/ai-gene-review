  review:
    summary: ARF5/MP binds DNA via its N-terminal B3-type DNA-binding domain (UniProt DNA_BIND
      158-260), recognizing auxin response elements. While correct, the bare "DNA binding" term
      is less informative than the sequence-specific DNA-binding transcription factor activity
      that is independently annotated and well supported for this protein.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0000987
      label: cis-regulatory region sequence-specific DNA binding
    reason: ARF5 recognizes AuxRE sequences in regulatory DNA. Sequence-specific cis-regulatory
      DNA binding is supported by the target-gene/biochemical evidence and is more precise than
      unrestricted DNA binding.
    supported_by:
    - reference_id: PMID:24485461
      supporting_text: We show that ARF DNA-binding domains also homodimerize to generate cooperative
        DNA binding, which is critical for in vivo ARF5/MP function.
