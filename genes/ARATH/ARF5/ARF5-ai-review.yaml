- term:
    id: GO:0009733
    label: response to auxin
  evidence_type: IEP
  original_reference_id: PMID:11283339
  qualifier: acts_upstream_of_or_within
  review:
    summary: 'ARF5/MP is a central effector of auxin response: it binds auxin response elements
      and, when released from Aux/IAA repression upon auxin perception, activates auxin-responsive
      target genes. Core to its biology; auxin response / auxin-activated signaling is its defining
      process.'
    action: ACCEPT
    supported_by:
    - reference_id: PMID:11283339
      supporting_text: the ARFs are capable of binding synthetic and natural auxin responsive
        promoter elements through a VP1-B3 DNA binding domain located at their N termini
    reason: 'ARF5/MP is a central effector of auxin response: it binds auxin response elements
      and, when released from Aux/IAA repression upon auxin perception, activates auxin-responsive
      target genes. Core to its biology; auxin response / auxin-activated signaling is its defining
      process.'
- term:
    id: GO:0009942
    label: longitudinal axis specification
  evidence_type: IMP
  original_reference_id: PMID:8904808
  qualifier: acts_upstream_of_or_within
  review:
    summary: mp mutant embryos fail to initiate the hypocotyl/root (body) axis; MP is required
      for apical-basal axis formation in the early embryo. This is the classic mp loss-of-function
      phenotype and a well-supported downstream developmental role. Kept as non-core relative
      to the molecular activator function.
    action: KEEP_AS_NON_CORE
    reason: Strongly supported developmental patterning role, but a downstream output of the
      transcriptional-activator activity in a pleiotropic gene.
    supported_by:
    - reference_id: PMID:8904808
      supporting_text: The process depends on the activity of the gene MONOPTEROS (MP); mp mutant
        embryos fail to produce hypocotyl and radicle.
- term:
    id: GO:0010051
    label: xylem and phloem pattern formation
  evidence_type: IMP
  original_reference_id: PMID:8904808
  qualifier: acts_upstream_of_or_within
  review:
    summary: mp mutants show distorted vascular strands in all organs at all stages; MP is required
      for vascular tissue patterning and continuity. A well-supported downstream developmental
      role of this pleiotropic regulator.
    action: KEEP_AS_NON_CORE
    reason: Genuine, strongly supported vascular patterning role; non-core relative to the molecular
      function.
    supported_by:
    - reference_id: PMID:8904808
      supporting_text: the vascular strands in all analyzed organs are distorted
