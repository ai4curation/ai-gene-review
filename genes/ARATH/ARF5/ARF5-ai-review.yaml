core_functions:
- description: Sequence-specific activator of AuxRE-containing target genes; DBD dimerization
    promotes cooperative recognition of paired sites and is important for native MP function.
  molecular_function:
    id: GO:0001216
    label: DNA-binding transcription activator activity
  directly_involved_in:
