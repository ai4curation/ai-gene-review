id: P93024
gene_symbol: ARF5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ARF5 (MONOPTEROS/MP) is a class-A auxin response factor that binds AuxRE-containing
  regulatory DNA and activates developmental target genes. Its N-terminal B3-containing DNA-binding
  domain forms dimers that support cooperative recognition of paired sites, while its C-terminal
  PB1 domain mediates interactions with Aux/IAA repressors and other ARFs. Aux/IAA-dependent
  repression couples its activity to auxin perception; recruitment of SWI/SNF chromatin remodelers
  contributes to target activation during flower initiation. ARF5 acts in embryonic apical-basal
  patterning, root meristem initiation, vascular development and organ initiation. These outputs
  depend on cell context and partner availability rather than a single invariant promoter motif
  or chromatin complex.
