    label: nucleus
  supported_by:
  - reference_id: PMID:24485461
    supporting_text: We show that ARF DNA-binding domains also homodimerize to generate cooperative
      DNA binding, which is critical for in vivo ARF5/MP function.
  - reference_id: PMID:19369397
    supporting_text: Chromatin immunoprecipitation experiments show that MP binds in vivo to
      two AuxRE-spanning fragments in the DRN promoter
- description: Binds Aux/IAA corepressors through PB1-domain interactions, providing an auxin-sensitive
    regulatory interface. Direct BODENLOS binding and IAA17 domain perturbation support this
    role; interaction assays do not imply every partner recruits an identical repression complex.
  molecular_function:
    id: GO:0001222
    label: transcription corepressor binding
  directly_involved_in:
  - id: GO:0009734
    label: auxin-activated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12101120
    supporting_text: BODENLOS and MONOPTEROS interact in the yeast two-hybrid assay and the
      two genes are coexpressed in early embryogenesis, suggesting that BODENLOS inhibits MONOPTEROS
      action in root meristem initiation.
  - reference_id: PMID:11283339
    supporting_text: heterodimerization of the revertant forms of IAA17/AXR3 with IAA3/SHY2,
      another Aux/IAA protein, and ARF1 or ARF5/MP proteins is affected only by changes in domain
      III.
- description: Binds cis-regulatory promoter regions of auxin-responsive target genes (e.g.
    DORNROSCHEN, LEAFY, ANT, FIL, TMO3) and, upon auxin signaling, recruits SWI/SNF chromatin-remodeling
    ATPases (BRAHMA/SPLAYED) to open chromatin and activate these genes during embryonic axis,
    vascular and flower primordium patterning.
  molecular_function:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  directly_involved_in:
  - id: GO:0009734
    label: auxin-activated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:19369397
    supporting_text: MP binds in vivo to two AuxRE-spanning fragments in the DRN promoter, and
      that MP is required for expression of DRN in cotyledon tips.
  - reference_id: PMID:26460543
    supporting_text: the MONOPTEROS transcription factor recruits SWI/SNF chromatin remodeling
      ATPases to increase accessibility of the DNA for induction of key regulators of flower
      primordium initiation
proposed_new_terms:
- proposed_name: transcription factor activity sequestered by Aux/IAA repressor
  proposed_definition: A transcription regulator activity in which an auxin response factor
    is held transcriptionally inactive through binding of an Aux/IAA repressor protein at its
    PB1 domain, and is released to activate target genes upon auxin-triggered degradation of
    the Aux/IAA partner.
  proposed_parent:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  justification: The auxin-gated activator function of ARF5 (activation contingent on Aux/IAA
    removal and SWI/SNF recruitment) is a distinctive regulatory mode not fully captured by
    existing MF terms; recorded here as a candidate for a more specific term.
  supported_by:
  - reference_id: PMID:26460543
    supporting_text: In the absence of the hormonal cue, auxin sensitive Aux/IAA proteins bound
      to MONOPTEROS block recruitment of the SWI/SNF chromatin remodeling ATPases in addition
      to recruiting a co-repressor/histone deacetylase complex.
suggested_questions:
- question: Does ARF5/MP function as a classical transcription coactivator recruiter (via SWI/SNF)
    at all target loci, or does it primarily act through direct AuxRE binding and activation
    domain activity?
- question: Which of ARF5's developmental roles (embryo axis, vascular patterning, flower primordium
    initiation) reflect distinct sets of direct target genes versus the same core regulatory
    module deployed in different tissues?
