    label: DNA-binding transcription factor activity
  evidence_type: ISS
  original_reference_id: PMID:9482737
  qualifier: enables
  review:
    summary: The cloning of MP established it as a transcription factor with a DNA binding domain
      similar to auxin-promoter-binding domains and functional NLSs. Core molecular function;
      duplicate of the other GO:0003700 annotations, which is acceptable.
    action: MODIFY
    supported_by:
    - reference_id: PMID:9482737
      supporting_text: a DNA binding domain highly similar to a domain shown to bind to control
        elements of auxin inducible promoters
    proposed_replacement_terms:
    - id: GO:0001216
      label: DNA-binding transcription activator activity
    reason: ARF5 is an experimentally characterized transcriptional activator. Refine the true
      general DNA-binding transcription-factor activity to its demonstrated activating function;
      this does not classify every ARF family member as an activator.
