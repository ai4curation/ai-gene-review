- term:
    id: GO:0019904
    label: protein domain specific binding
  evidence_type: IPI
  original_reference_id: PMID:12101120
  qualifier: enables
  review:
    summary: 'Existing proposed annotation retained: ARF5 binds Aux/IAA proteins through conserved
      C-terminal interaction domains, independently supported by domain-III perturbation in
      IAA17 and by BODENLOS binding. This domain-level property is distinct from the partner-role
      refinement of the existing bare-binding rows.'
    action: NEW
    supported_by:
    - reference_id: PMID:12101120
      supporting_text: BODENLOS and MONOPTEROS interact in the yeast two-hybrid assay and the
        two genes are coexpressed in early embryogenesis, suggesting that BODENLOS inhibits
        MONOPTEROS action in root meristem initiation.
    - reference_id: PMID:11283339
      supporting_text: heterodimerization of the revertant forms of IAA17/AXR3 with IAA3/SHY2,
        another Aux/IAA protein, and ARF1 or ARF5/MP proteins is affected only by changes in
        domain III.
    reason: 'Existing proposed annotation retained: ARF5 binds Aux/IAA proteins through conserved
      C-terminal interaction domains, independently supported by domain-III perturbation in
      IAA17 and by BODENLOS binding. This domain-level property is distinct from the partner-role
      refinement of the existing bare-binding rows.'
- term:
