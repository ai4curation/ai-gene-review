- id: file:ARATH/SLY1/SLY1-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report for SLY1
  findings:
  - statement: 'Falcon synthesis: SLY1 is the F-box substrate adaptor of SCF(SLY1), linking
      DELLA repressors to ASK1/CUL1 for ubiquitination and proteasomal degradation.'
    reference_section_type: OTHER
    supporting_text: SLY1 is a substrate-recognition adaptor, not a gibberellin-metabolizing
      enzyme or transporter
core_functions:
- description: 'F-box substrate adaptor of the SCF(SLY1) E3 ubiquitin ligase: binds the DELLA
    GRAS domain (enhanced when DELLA is bound by GA-GID1) and links it, via ASK1/2, to CUL1,
    enabling DELLA polyubiquitination and 26S proteasomal degradation, which derepresses gibberellin
    signaling.'
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0009740
    label: gibberellic acid mediated signaling pathway
  - id: GO:0031146
    label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
  locations:
