suggested_questions:
- question: How much of SLY1-dependent GA signaling in seeds and stems is mediated by proteasomal
    DELLA degradation versus SLY1-independent, proteolysis-independent GID1 inhibition of
    DELLA?
- question: Does SLY1 show preference among the five DELLA proteins (e.g. RGL2 versus RGA)
    that explains the different abilities of SLY1 and SNE to rescue sly1 phenotypes?
- question: Which RING-box and neddylation components are required for SCF(SLY1) activity
    on DELLAs in vivo?
suggested_experiments:
- description: Reconstitute SCF(SLY1) (SLY1, ASK1, CUL1, RBX1) with E1/E2 in vitro and measure
    GA- and GID1-dependent polyubiquitination of each DELLA protein to define substrate preference
    quantitatively.
- description: Introduce structure-guided point mutations in the SLY1 GRAS-binding surface
    identified by cryo-EM and test DELLA turnover and growth rescue in sly1-10.
