id: Q9STX3
gene_symbol: SLY1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: SLY1 (SLEEPY1; UniProt name GID2; locus At4g24210) is a small F-box protein that
  serves as the substrate-recognition subunit of the SCF(SLY1) E3 ubiquitin ligase, together
  with the SKP1-like proteins ASK1/ASK2, CULLIN1 and a RING-box protein. It is the Arabidopsis
  ortholog of rice GID2. Its N-terminal F-box binds ASK proteins, and its C-terminal region
  (GGF and LSL motifs) binds the GRAS domain of the nuclear DELLA growth repressors (GAI,
  RGA, RGL2 and others). When bioactive gibberellin binds the GID1 receptor and the GA-GID1
  complex captures the DELLA N-terminal domain, DELLA binding to SLY1 is strongly enhanced;
  SCF(SLY1) then polyubiquitinates the DELLA, which is degraded by the 26S proteasome, relieving
  DELLA repression of growth. Cryo-EM structures of GA3-GID1A-RGA-SLY1-ASK complexes show
  that GID1A and SLY1 bind RGA through separate surfaces. sly1 loss-of-function mutants over-accumulate
  DELLAs and are GA-insensitive semi-dwarfs with reduced fertility, delayed flowering and
  strong seed dormancy, whereas gain-of-function alleles (sly1-d, sly1gar2-1) bind DELLAs
  more strongly and enhance GA signaling. The paralog SNEEZY/SLY2 can partly substitute when
  overexpressed. SLY1 is nuclear and widely expressed.
