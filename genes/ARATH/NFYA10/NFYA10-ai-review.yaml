suggested_questions:
- question: Which NF-YB and NF-YC subunits partner with NF-YA10 in roots and leaves, and does NF-YA10 act on LAZY
    and YUC2 promoters as an intact CCAAT-bound trimer or by sequestering NF-YB/NF-YC dimers?
- question: Is NF-YA10 a direct repressor at its known targets (supporting a negative regulation of Pol II transcription
    annotation), or is repression an indirect consequence of overexpression?
- question: Why do NF-YA10 overexpressors appear dwarf in one study (PMID:23118940) but show enlarged leaves in another
    (PMID:28469131)?
suggested_experiments:
- description: Genome-wide ChIP-seq of native-promoter tagged NF-YA10 combined with RNA-seq of nf-ya10 (and nf-ya2
    nf-ya10) loss-of-function mutants under phosphate deprivation to define direct targets and the sign of regulation.
- description: Co-immunoprecipitation or yeast three-hybrid assays to identify the NF-YB/NF-YC partners of NF-YA10
    and test trimer-dependent CCAAT binding in EMSA.
