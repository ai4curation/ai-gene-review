id: Q8LFU0
gene_symbol: NFYA10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: NF-YA10 (At5g06510) is one of ten Arabidopsis NF-YA (HAP2/CBF-B) subunits of the nuclear
  factor Y (NF-Y) CCAAT-box binding heterotrimer. It carries the conserved NFYA/HAP2 subunit-association
  domain and the C-terminal NFYA-type DNA-binding domain, and, once associated with an NF-YB/NF-YC dimer,
  confers sequence-specific recognition of CCAAT boxes in promoters. GFP-tagged NF-YA10 is nuclear in root
  vasculature, endodermis and cortex, and ChIP shows it occupies CCAAT-containing promoter regions of LAZY1,
  LAZY2 and the auxin biosynthesis gene YUC2, whose expression falls when NF-YA10 levels are raised. NF-YA10
  is post-transcriptionally controlled by the miR169defg isoform and is strongly induced by phosphate and
  nitrogen deprivation and high sucrose. Gain-of-function lines show altered growth (dwarfism or enlarged
  leaves depending on the study), delayed senescence, abiotic stress tolerance and altered lateral-root
  gravitropic angle, consistent with a role in regulating growth-related target genes under nutrient stress.
