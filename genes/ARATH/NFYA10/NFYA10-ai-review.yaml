  title: Functional and transcriptome analysis reveals an acclimatization strategy for abiotic stress tolerance mediated
    by Arabidopsis NF-YA family members.
  findings:
  - statement: NF-YA10 transcripts are induced by low Pi, low N and high sucrose, most strongly by low Pi.
    supporting_text: NF-YA10 under low P (51-fold induction at 14 dag)
  - statement: Overexpression of NF-YA10 causes dwarfism, delayed senescence and abiotic stress tolerance.
    supporting_text: Overexpression of NF-YA2, 7 and 10 resulted in dwarf late-senescent plants with enhanced tolerance
      to several types of abiotic stress.
  reference_review:
