  review:
    summary: Arginase supplies the arginine-cleavage arm of ornithine/arginine recycling.
    action: KEEP_AS_NON_CORE
    reason: The current GO urea-cycle definition does not require ureotelic nitrogen excretion. Arginase
      chemistry plus the native ornithine/citrulline/arginine recycling observed in OAT mutants supports
      a contextual cycle annotation. Catabolic nitrogen mobilization is the core function; this does not
      assert mammalian hepatic detoxification or a quantitatively demonstrated closed cycle in every tissue.
    supported_by:
    - reference_id: PMID:18419821
      supporting_text: Accumulation of Cit indicated that Orn and Arg were metabolised after uptake, most
        likely by enzymes of the urea cycle.
