gene_symbol: ARGAH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ARGAH1 is a manganese-dependent arginase/agmatinase that hydrolyzes arginine to ornithine
  and urea and can hydrolyze agmatine to putrescine. It forms a homohexamer with contributions from neighboring
  subunits to substrate recognition. A mitochondrial matrix pool supports amino-acid nitrogen mobilization;
  its tissue expression differs from ARGAH2, including detectable pollen enzyme activity. Its agmatinase
  capacity has been demonstrated by heterologous complementation, while the relative endogenous flux through
  the two reactions remains context dependent.
