id: P49597
gene_symbol: ABI1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ABI1 is an Arabidopsis clade A PP2C protein serine/threonine phosphatase that acts in
  the nucleus and cytoplasm as a negative regulator of abscisic acid signaling. Its
  Mg2+/Mn2+-dependent catalytic domain dephosphorylates and inhibits SnRK2 kinases. ABA-bound
  PYR/PYL/RCAR receptors inhibit ABI1, releasing kinase activity and promoting ABA-responsive
  transcription and stomatal responses. ABI1 also regulates SnRK1 energy signaling and MAPKKK18
  activity, connecting hormone signaling with growth and stress responses.
