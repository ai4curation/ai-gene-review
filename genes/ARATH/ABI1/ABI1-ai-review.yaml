  - statement: PYR1 and PYL1-6 were tested for interaction with ABI1 as well as other PP2Cs.
    supporting_text: Each of these family members was capable of interacting with the ABA-signaling
      PP2Cs HAB1, ABI1, and ABI2
    reference_section_type: RESULTS
- id: PMID:19924127
  title: In vitro reconstitution of an abscisic acid signalling pathway.
  findings:
  - statement: Reconstitution establishes direct phosphatase control of SnRK2 activity.
    supporting_text: the SnRK2 kinases are kept inactive by the PP2Cs through physical interaction
      and dephosphorylation.
    reference_section_type: ABSTRACT
- id: PMID:19955405
  title: Activity of guard cell anion channel SLAC1 is controlled by drought-stress signaling
    kinase-phosphatase pair.
  findings:
  - statement: ABI1 binds OST1 in the guard-cell channel regulatory system.
    supporting_text: Using split YFP assays, we identified OST1 as an interaction partner of SLAC1
      and ABI1.
    reference_section_type: ABSTRACT
- id: PMID:19955427
  title: A protein kinase-phosphatase pair interacts with an ion channel to regulate ABA signaling
    in plant guard cells.
  findings: []
- id: PMID:20385816
  title: Guard cell anion channel SLAC1 is regulated by CDPK protein kinases with distinct Ca2+
    affinities.
  findings:
  - statement: ABI1 suppresses CPK-dependent SLAC1 activation; the abstract alone does not resolve
      the direct kinase-binding assay.
    supporting_text: In line with activation by OST1, CPK activation of the guard cell anion channel
      was suppressed by ABI1.
    reference_section_type: ABSTRACT
- id: PMID:20729862
  title: Identification and mechanism of ABA receptor antagonism.
  findings:
  - statement: The PYL1-pyrabactin-ABI1 complex supports receptor interaction.
    supporting_text: Crystal structures of the PYL2-pyrabactin and PYL1-pyrabactin-ABI1 complexes
      reveal the mechanism responsible for receptor-selective activation and inhibition
    reference_section_type: ABSTRACT
- id: PMID:21436041
  title: Jasmonate signaling involves the abscisic acid receptor PYL4 to regulate metabolic
    reprogramming in Arabidopsis and tobacco.
  findings: []
- id: PMID:21658606
  title: The molecular basis of ABA-independent inhibition of PP2Cs by a subclass of PYL proteins.
  findings: []
- id: PMID:21798944
  title: Evidence for network evolution in an Arabidopsis interactome map.
  findings: []
- id: PMID:22090030
  title: Molecular mechanism for inhibition of a critical component in the Arabidopsis thaliana
    abscisic acid signal transduction pathways, SnRK2.6, by protein phosphatase ABI1.
  findings:
  - statement: ABI1 recognizes the SnRK2.6 activation loop for dephosphorylation.
    supporting_text: Structural modeling suggested that the two interfaces lock SnRK2.6 and ABI1 in
      an orientation such that the activation loop of SnRK2.6 is posited to the catalytic site of
      ABI1 for dephosphorylation.
    reference_section_type: ABSTRACT
- id: PMID:24165892
  title: Molecular basis for the selective and ABA-independent inhibition of PP2CA by PYL13.
  findings: []
- id: PMID:24179127
  title: ABI1 and PP2CA phosphatases are negative regulators of Snf1-related protein kinase1
    signaling in Arabidopsis.
  findings:
  - statement: ABI1 and PP2CA couple ABA and energy signaling by inhibiting SnRK1.
    supporting_text: two clade A type 2C protein phosphatases (PP2Cs), established repressors of the
      abscisic acid (ABA) hormonal pathway, interact with the SnRK1 catalytic subunit causing its
      dephosphorylation and inactivation.
    reference_section_type: ABSTRACT
  - statement: ABI1 binds the SnRK1.1 regulatory domain, supporting kinase recognition.
    supporting_text: SnRK1.1 interacted with ABI1 and PP2CA in yeast cells, and deletion of its
      regulatory domain (RD) abolished this interaction
    reference_section_type: RESULTS
- id: PMID:25680457
  title: An abscisic acid inducible Arabidopsis MAPKKK, MAPKKK18 regulates leaf senescence via its
    kinase activity.
  findings: []
- id: PMID:26443375
  title: Arabidopsis ABA-Activated Kinase MAPKKK18 is Regulated by Protein Phosphatase 2C ABI1 and
    the Ubiquitin-Proteasome Pathway.
  findings:
  - statement: ABI1 interacts with and inhibits MKKK18.
    supporting_text: Notably, we identified abscisic acid insensitive 1 (ABI1) PP2C as a
      MKKK18-interacting protein, and demonstrated that ABI1 inhibited its activity.
    reference_section_type: ABSTRACT
- id: PMID:27192441
  title: Release of GTP Exchange Factor Mediated Down-Regulation of Abscisic Acid Signal
    Transduction through ABA-Induced Rapid Degradation of RopGEFs.
  findings:
  - statement: ABI1 directly interacts with RopGEF1.
    supporting_text: RopGEF1 directly interacts with several clade A PP2C protein phosphatases,
      including ABI1.
    reference_section_type: ABSTRACT
- id: PMID:27923613
  title: Arabidopsis thaliana RECEPTOR DEAD KINASE1 Functions as a Positive Regulator in Plant
    Responses to ABA.
  findings:
  - statement: RDK1 recruits ABI1 to the plasma membrane.
    supporting_text: RDK1 interacted in the plasma membrane with type 2C protein phosphatase
      ABSCISIC ACID INSENSITIVE1 (ABI1)
    reference_section_type: ABSTRACT
- id: PMID:29928509
  title: CARK1 mediates ABA signaling by phosphorylation of ABA receptors.
  findings:
  - statement: RCAR3 phosphorylation strengthens binding to ABI1.
    supporting_text: Surface plasmon resonance (SPR) assay further demonstrated the phosphorylation
      of RCAR3 by CARK1 could distinctly enhance its interaction with ABI1 in vitro.
    reference_section_type: RESULTS
- id: PMID:32490347
  title: A point-to-point protein-protein interaction assay reveals the signaling interplays among
    plant hormones and environmental cues.
  findings:
  - statement: JAZ1-ABI1 interaction contributes to hormone signaling cross-talk.
    supporting_text: we next revealed the signaling cross talk between jasmonate and abscisic acid
      by characterizing the JAZ1-PYL4 and JAZ1-ABI1 interactions.
    reference_section_type: ABSTRACT
- id: PMID:32612234
  title: Extensive signal integration by the phytohormone protein network.
  findings: []
- id: PMID:7910981
  title: 'Arabidopsis ABA response gene ABI1: features of a calcium-modulated protein phosphatase.'
  findings:
  - statement: An early sequence analysis proposed an EF-hand calcium-binding site; this was not a
      direct calcium-binding assay.
    supporting_text: the ABI1 protein has a unique amino-terminal extension containing an EF hand
      calcium-binding site.
    reference_section_type: ABSTRACT
- id: PMID:8197457
  title: A protein phosphatase 2C involved in ABA signal transduction in Arabidopsis thaliana.
  findings:
  - statement: The original cloning paper proposed a putative calcium-binding site from sequence.
    supporting_text: The ABI1 gene encodes a protein with high similarity to protein serine or
      threonine phosphatases of type 2C with the novel feature of a putative Ca2+ binding site.
    reference_section_type: ABSTRACT
- id: PMID:8492808
  title: Abscisic acid-insensitive mutations provide evidence for stage-specific signal pathways
    regulating expression of an Arabidopsis late embryogenesis-abundant (lea) gene.
  findings:
  - statement: ABI1 affects ABA inducibility in a developmental-stage-dependent manner.
    supporting_text: the abi1 and abi2 mutants showed a very slight reduction of ABA inducibility in
      8-day-old plants
    reference_section_type: ABSTRACT
- id: PMID:8898906
  title: Protein phosphatase activity of abscisic acid insensitive 1 (ABI1) protein from Arabidopsis
    thaliana.
  findings:
  - statement: ABI1 has Mg/Mn-dependent PP2C catalytic activity.
    supporting_text: recombinant proteins that contained the ABI1 C-terminal domain displayed in
      vitro phosphatase activity towards 32P-labelled casein, and this activity displayed Mg2+ or
      Mn2+ dependence and okadaic acid insensitivity typical of protein phosphatases 2C.
    reference_section_type: ABSTRACT
- id: PMID:9537523
  title: ABI1 of Arabidopsis is a protein serine/threonine phosphatase highly regulated by the
    proton and magnesium ion concentration.
  findings:
  - statement: ABI1 is a magnesium-sensitive protein serine/threonine phosphatase.
    supporting_text: The ABI1 protein (ABI1p) has been characterized as a protein serine/threonine
      phosphatase of type 2C that is highly affected in its activity by changes in the proton and
      magnesium ion concentrations.
    reference_section_type: ABSTRACT
- id: PMID:9869399
  title: Protein phosphatase 2C (PP2C) function in higher plants.
  findings:
  - statement: ABI1/ABI2 are central PP2Cs in ABA signaling.
    supporting_text: the ABI1/ABI2 PP2Cs are central components in abscisic acid (ABA) signal
      transduction.
    reference_section_type: ABSTRACT
core_functions:
- description: Clade A PP2C protein serine/threonine phosphatase activity that negatively regulates
    abscisic acid signaling by dephosphorylating and inhibiting ABA-activated SnRK kinases until
    ABA-bound PYR/PYL/RCAR receptors inhibit ABI1.
  molecular_function:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
  directly_involved_in:
  - id: GO:0009788
    label: negative regulation of abscisic acid-activated signaling pathway
  - id: GO:0006470
    label: protein dephosphorylation
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:8898906
    supporting_text: recombinant proteins that contained the ABI1 C-terminal domain displayed in
      vitro phosphatase activity towards 32P-labelled casein, and this activity displayed Mg2+ or
      Mn2+ dependence and okadaic acid insensitivity typical of protein phosphatases 2C.
  - reference_id: PMID:19924127
    supporting_text: the SnRK2 kinases are kept inactive by the PP2Cs through physical interaction
      and dephosphorylation.
  - reference_id: PMID:18298671
    supporting_text: Application of a proteosomal inhibitor led to both a preferential nuclear
      accumulation of ABI1 and an enhancement of PP2C-dependent inhibitory action on the ABA
      response.
suggested_questions:
- question: Which generic ABI1 protein-binding annotations should be split into specific ABA
    receptor binding, SnRK kinase binding, or other regulatory-complex terms?
- question: Are calcium/cation-binding annotations appropriate for ABI1, or should they be removed
    in favor of PP2C phosphatase activity only?
- question: Does wild-type ABI1 localize to the nucleus under ABA signaling conditions, distinct
    from abi1-G180D gain-of-function localization?
suggested_experiments:
- experiment_type: substrate phosphoproteomics
  hypothesis: ABI1 directly dephosphorylates a defined subset of SnRK2 and ABA-response substrates
    in vivo.
  description: Compare ABA time-course phosphoproteomes in abi1 loss-of-function, catalytic-dead
    rescue, and receptor-resistant ABI1 backgrounds.
- experiment_type: complex reconstitution
  hypothesis: ABA-bound PYR/PYL receptors switch off ABI1 phosphatase activity toward SnRK2
    substrates.
  description: Reconstitute ABI1, ABA receptors, ABA, and SnRK2 substrates in vitro and quantify
    substrate dephosphorylation and receptor-dependent inhibition.
proposed_new_terms: []
