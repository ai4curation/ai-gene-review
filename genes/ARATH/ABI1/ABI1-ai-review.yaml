- term:
    id: GO:0009409
    label: response to cold
  evidence_type: IMP
  original_reference_id: PMID:1834244
  review:
    summary: Gilmour and Thomashow (1991) found that abi1 impaired ABA-induced, but not cold-induced, expression
      of three cor genes, and that abi mutations had no apparent effect on freezing tolerance. Response to
      cold remains a supported peripheral claim for ABI1 from other work (row from PMID:12228349, and cold
      induction of ABI1 transcripts recorded in UniProt).
    action: KEEP_AS_NON_CORE
    reason: This row shares its term with the PMID:12228349 IMP row, which is kept as non-core, and the review
      judges the claim rather than the individual paper. The 1991 abstract mainly separates the ABA-dependent
      and cold-dependent control of cor genes, with abi1 affecting the ABA branch only, so on its own it is
      weak support for a cold-response role. It does not contradict the later freezing-tolerance phenotype
      or the cold induction of ABI1. The curators had the full text, which may include data not summarized
      in the abstract, so the row is not removed. Response to cold is an output of ABA signaling rather than
      the core PP2C function, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:1834244
      supporting_text: Our data indicate that the ABA-induced expression of three ABA-regulated Arabidopsis
        cor genes was unaffected in the abi2, abi3, and aba-1 mutants, but was dramatically impaired in the
        abi1 mutant.
    - reference_id: PMID:1834244
      supporting_text: Cold-regulated expression of all three cor genes, however, was nearly the same in wild-type
        and abi1 mutant plants.
    - reference_id: PMID:12228349
