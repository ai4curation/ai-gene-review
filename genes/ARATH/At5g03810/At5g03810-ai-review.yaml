- term:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN005219546
  - UniProtKB:O33407
  - UniProtKB:Q9HUP2
  review:
    summary: >-
      The sound IBD at PTN005219546, with two experimentally grounded esterase
      seeds and an intact SGNH triad plus the GDSL serine motif in this sequence.
      The core molecular function, at the only granularity the evidence allows.
    action: ACCEPT
    reason: >-
      Unlike the GO:0008610 IBD at the same node, this one is seeded by measured
      catalysis - EstA's surface esterase activity on short-chain p-nitrophenyl
      esters and ChoE/PA4921's cholinesterase IDA - and ester hydrolysis is the
      conserved chemistry of the SGNH/GDSL fold throughout the clade, bacterial and
      plant alike. This sequence retains the fold, the complete triad (Ser37
      nucleophile, Asp328, His331), the PROSITE GDSL serine motif and matches to
      Pfam PF00657 and CDD cd01837, with no sign of catalytic degeneration. The
      term is kept at this level deliberately, because no substrate has ever been
      assayed for AT5G03810, so no descendant is warranted and GO:0052689 is as
      precise as the evidence supports.
    supported_by:
    - reference_id: file:ARATH/At5g03810/At5g03810-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: 'PROSITE; PS01098; LIPASE_GDSL_SER; 1.'
    - reference_id: file:ARATH/At5g03810/At5g03810-uniprot.txt
      record_section: ["DR:CDD"]
      supporting_text: CDD; cd01837; SGNH_plant_lipase_like; 1.
    - reference_id: file:PSEAE/estA/estA-notes.md
