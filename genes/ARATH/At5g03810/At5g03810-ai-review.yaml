- term:
    id: GO:0008610
    label: lipid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN005219546
  - UniProtKB:O33407
  review:
    summary: >-
      IBA from a LUCA-level IBD whose single seed is the rhamnolipid-deficient
      phenotype of a Pseudomonas estA deletion. Nothing on this gene supports a
      biosynthetic role, and TAIR has recorded a process ND for it.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Tested rather than assumed. (i) On the gene itself there is no support of any
      kind. No publication mentions AT5G03810 or Q9FFN0 (searches of 2026-11-06,
      recorded in the notes file), there is no experimental annotation, protein
      existence is only inferred from homology, and TAIR has placed a
      biological_process ND on the entry - a curator statement that the literature
      was searched and no process was found. The EC 3.1.1.- and the "lipase" in the
      protein name are family predictions, and they point at ester hydrolysis
      rather than synthesis. (ii) The node placement does not support it either.
      PTN005219546 is a SPECIATION node at LUCA with 960 leaves, splitting into 952
      eukaryotic (940 of them Viridiplantae) and 8 eubacterial leaves (topology
      re-checked with projects/PSEUDOCAP/panther_tree.py, 2026-11-06), and the
      GO:0008610 IBD at it has the single seed UniProtKB:O33407, whose evidence is
      that an estA deletion makes little rhamnolipid. That is necessity, not
      participation, since rhamnolipid is assembled by RhlA/RhlB/RhlC and UniProt
      states that the role of EstA is unclear. The IBD reaches 885 leaf IBAs in 48
      taxa, overwhelmingly plant GELPs. (iii) The clade does nevertheless contain
      one real biosynthetic member, which is why this is MARK_AS_OVER_ANNOTATED and
      not REMOVE. OSP1/AT2G04570 (UniProtKB:Q9SJB4, PTHR45642:SF32) is a leaf of
      this node and is experimentally required for cuticular wax synthesis, with
      thioesterase activity on C22:0 and C26:0 acyl-CoAs (PMID:32542680), curated
      by TAIR as GO:0016297 IDA with no process term. That role is angiosperm
      specific, is unrelated to the bacterial glycolipid phenotype that seeded the
      node, and arises on the far side of PTN008693276, an 892-leaf duplication
      node at the base of the plant radiation, so it cannot license the IBD as
      placed nor a transfer to this gene. Across all 39 Arabidopsis leaves of the
      node (QuickGO, 2026-11-06) there is no experimental biological-process
      annotation at all. The node defect is reported in the review of the paralog
      APG/AT3G16370.
    supported_by:
    - reference_id: file:ARATH/At5g03810/At5g03810-uniprot.txt
      record_section: [PE]
      supporting_text: '3: Inferred from homology'
    - reference_id: file:ARATH/At5g03810/At5g03810-notes.md
      supporting_text: >-
        Europe PMC `"Q9FFN0"` → **0 hits**
    - reference_id: file:PSEAE/estA/estA-notes.md
      supporting_text: A necessity phenotype is not participation.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN005219546
        source_label: PTN005219546
        source_status: SOURCE_BAD
        comment: >-
          LUCA node, 960 leaves, 8 of them bacterial. The sole seed for the
