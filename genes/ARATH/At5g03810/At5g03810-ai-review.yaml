  knowledge_gaps:
  - gap_statement: >-
      No catalytic activity has ever been measured for AT5G03810, so the molecular
      function rests entirely on fold and motif. Whether it hydrolyses
      acylglycerols, short-chain esters, cell-wall acetyl esters, cutin or suberin
      oligomers, or acyl thioesters is unknown, and whether the protein is made at
      all is not established, since the entry carries no cDNA, EST or proteomic
      evidence.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
knowledge_gaps:
- gap_statement: >-
    What AT5G03810 does in the plant is entirely unknown, which is what TAIR's
    biological_process ND records. No publication mentions the gene, no mutant has
    been described, there is no expression or localisation experiment, and no
    substrate has been assayed. Its tandem neighbour AT5G03820 is equally
    uncharacterised, so redundancy within the pair may be why no phenotype has been
    found.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    Only root terms, family-level electronic rows and two IBAs survive review, so
    this is a genuinely dark member of one of the largest and least-resolved plant
    enzyme families; it is also one of about 40 Arabidopsis leaves taking a lipid
    biosynthetic process IBA from a single bacterial seed.
suggested_questions:
- question: >-
    Should PAINT withdraw the GO:0008610 lipid biosynthetic process IBD at
    PTN005219546, given that it is placed at a LUCA node, has a single bacterial
    seed resting on a necessity phenotype, and reaches 885 leaves that are mostly
    plant GELPs with no experimental biological-process evidence among them?
- question: >-
    Is a protein product of AT5G03810 made at all? The entry is PE 3, inferred from
    homology, with no cDNA, EST or proteomic evidence, while its paralogs are
    detected repeatedly in apoplast proteomes.
- question: >-
    Should UniProt's ARBA-derived acyltransferase activity rule be narrowed? It
    assigns acyl transfer across the GDSL family, including to members whose only
    other annotations assert ester hydrolysis.
suggested_experiments:
- description: >-
    Establish whether and where the gene is expressed, by RT-qPCR across tissues,
    developmental stages and stress treatments, a promoter-GUS or promoter-VENUS
    reporter line, and a targeted search of apoplastic and single-cell proteomic
    and transcriptomic datasets. If no product is detectable the right record is an
    existence question rather than a function gap, and that distinction should be
    settled before any further functional work.
- description: >-
    Express and purify the mature protein with the signal peptide removed and run a
    substrate panel - p-nitrophenyl esters C2 to C16, Tween detergents, mono- and
    triacylglycerol, acyl-CoA and acyl-ACP thioesters, cutin and suberin oligomers,
    and cell-wall acetyl esters - with an active-site Ser37-to-Ala variant as the
    negative control, to test whether the enzyme has any activity and, if so,
    whether it is a lipase at all.
- description: >-
    Generate a CRISPR double mutant of AT5G03810 and its tandem neighbour AT5G03820
    and phenotype it for cuticle and cell-wall traits, including cuticular wax and
    cutin composition, epidermal permeability, transpiration and salt sensitivity,
    the assays that revealed phenotypes for OSP1 and for the suberin GELPs.
    Redundancy is the norm in this family, so single knockouts are unlikely to be
    informative.
