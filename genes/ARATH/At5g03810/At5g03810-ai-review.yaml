gene_symbol: At5g03810
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  AT5G03810 encodes one of roughly a hundred Arabidopsis GDSL (GELP) enzymes and
  is among the least characterised of them. The 353-residue precursor carries a
  cleavable N-terminal signal peptide, five predicted N-glycosylation sites and a
  single SGNH/GDSL hydrolase domain with an intact Ser-Asp-His triad, so the
  protein is predicted to be a secreted carboxylic ester hydrolase of the cell wall
  space. The names "GDSL esterase/lipase At5g03810" and "Extracellular lipase
  At5g03810" and the EC number 3.1.1.- are family assignments, not measurements. No
  catalytic assay, substrate, interaction partner, localisation experiment or
  mutant phenotype has been reported, no publication discusses the gene, and
  protein existence is only inferred from homology, with no cDNA, EST or proteomic
  evidence in the record. It sits in a tandem pair with the equally uncharacterised
  AT5G03820 and, more distantly, with AT3G16370, whose product is detected in leaf
  apoplastic fluid.
