core_functions:
- description: Peroxisomal catalase that disproportionates hydrogen peroxide to water and O2, removing
    the H2O2 produced by glycolate oxidase in the photorespiratory C2 cycle; the major leaf catalase isoform.
  molecular_function:
    id: GO:0004096
    label: catalase activity
  directly_involved_in:
  - id: GO:0042744
    label: hydrogen peroxide catabolic process
  locations:
  - id: GO:0005782
    label: peroxisomal matrix
  supported_by:
  - *id003
  - *id002
  - *id005
  - reference_id: PMID:22303256
    supporting_text: only one gene ( Cat 2, At4g35090) encodes the major enzyme involved in photorespiration
  - *id016
suggested_questions:
- question: No catalase in GO carries photorespiration (GO:0009853), although CAT2 is the major photorespiratory
    catalase and cat2 is a high-CO2-rescuable mutant, so this review links CAT2 to the pathway only through
    hydrogen peroxide catabolic process and GO-CAM causal links from glycolate oxidase. Should the
    H2O2-removal step instead be annotated as part of photorespiration?
- question: What fraction of CAT2 resides in the cytosol at steady state, and does the NCA1-bound cytosolic
    pool contribute to H2O2 removal outside peroxisomes?
suggested_experiments:
- description: Quantify CAT2 in cytosolic versus peroxisomal fractions with CAT2-specific antibodies or
    tagged lines, in wild type and nca1, and measure cytosolic H2O2 with a genetically encoded sensor.
