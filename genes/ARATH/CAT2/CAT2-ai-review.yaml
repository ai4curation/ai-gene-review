  label: Arabidopsis thaliana
description: 'CAT2 (CATALASE2, At4g35090) encodes the major leaf catalase of Arabidopsis, a heme-containing
  monofunctional catalase that disproportionates hydrogen peroxide to water and O2. It accounts for most
  leaf catalase activity and acts mainly as a tetramer in the peroxisomal matrix, where it removes the
  H2O2 generated by glycolate oxidase in the photorespiratory C2 cycle; a cytosolic pool is folded and
  activated by the chaperone NCA1 before or during peroxisomal import. cat2 knockouts are conditional
  photorespiratory mutants: in air they show reduced rosette growth, intracellular redox perturbation,
  activation of oxidative and salicylic acid-dependent signalling and day length-dependent lesions, all
  suppressed by high CO2 and attenuated by loss of GOX1. CAT2 is therefore the main sink for photorespiratory H2O2
  and a key regulator of intracellular H2O2-dependent stress signalling. Its expression is light-stimulated
  and circadian, and it is also induced by several abiotic stresses.'
