- id: PMID:37276398
  title: Constitutively active B2 Raf-like kinases are required for drought-responsive gene expression
    upstream of ABA-activated SnRK2 kinases.
  findings:
  - statement: RAF11 directly phosphorylates kinase-inactive SRK2D.
    supporting_text: SRK2DKN-MBP was phosphorylated by RAF7-MBP, RAF10-MBP, RAF11-MBP, and RAF12-MBP
  - statement: RAF11 activity is constitutive under tested conditions.
    supporting_text: B2-RAF RAF11 was constitutively active regardless of stress conditions or the presence
      of ABA
  - statement: B2 RAFs are cytosolic rather than nuclear under the tested conditions.
    supporting_text: The B2-RAFs were observed to localize in the cytosol but not in the nuclei
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read, including co-IP/BiFC, kinase-inactive substrate assays, activation assays
      and mutant physiology. Evidence applies to At1g67890; precise alternative protein isoform used by
      the experiments was not independently resolved.
core_functions:
- description: Constitutively active cytosolic B2 Raf-like serine/threonine kinase that directly phosphorylates
    and activates subclass III SnRK2 proteins, positively regulating ABA-responsive transcription and
    drought responses. ABA inhibits opposing PP2C activity, allowing RAF-mediated SnRK2 activation; RAF11
    itself need not be activated by ABA. Biochemical and genetic evidence is assigned at the At1g67890
    locus, without asserting that the assayed isoform is uniquely F4HVH9 rather than Q9C9V5.
