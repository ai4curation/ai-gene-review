id: F4HVH9
gene_symbol: RAF11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: RAF11 is a B2 Raf-like serine/threonine protein kinase encoded by Arabidopsis At1g67890.
  It acts predominantly in the cytosol and directly phosphorylates and activates ABA-responsive subclass
  III SnRK2 kinases, including SRK2D/SnRK2.2. RAF11 is constitutively active under the tested conditions;
  ABA permits sustained SnRK2 activation by suppressing clade A PP2C phosphatases through ABA-bound PYR/PYL
  receptors. Thus RAF11 provides upstream phosphorylation rather than becoming an ABA-activated kinase
  itself. Together with RAF7, RAF10 and RAF12 it supports ABA-responsive transcription and responses to
  mild drought. RAF11 also acts redundantly with RAF10 in seed dormancy and ABA sensitivity.
