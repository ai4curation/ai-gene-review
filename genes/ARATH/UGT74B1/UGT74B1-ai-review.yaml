id: O48676
gene_symbol: UGT74B1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: UGT74B1 is a soluble UDP-glucose-dependent thiohydroximate S-glucosyltransferase that produces
  desulfoglucosinolates in Arabidopsis. It contributes to the shared core pathway for aliphatic and indolic
  glucosinolates and overlaps functionally with other UGT74 enzymes, including UGT74C1. Its catalytic
  specificity is for the thiohydroximate group, rather than direct glucosylation of indole-3-acetic acid.
  Loss of UGT74B1 reduces glucosinolate accumulation and perturbs auxin homeostasis; indolic glucosinolate
  deficiency also impairs elicitor-triggered callose deposition.
