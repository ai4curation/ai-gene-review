core_functions:
- description: Transfers glucose from UDP-glucose to thiohydroximate sulfur to produce desulfoglucosinolates
    in the shared glucosinolate core pathway. This activity overlaps with other UGT74 enzymes and is distinct
    from direct auxin glucosylation.
