    CC   -!- FUNCTION: Required for the regulation of flowering time in the
    CC       late-flowering phenotype. Involved in the enrichment of a WDR5A-
    CC       containing COMPASS-like complex at the 'FLOWERING LOCUS C' that
    CC       trimethylates histone H3 'Lys-4', leading to FLC up-regulation and
    CC       RNA levels increase (PubMed:19567704). Variants with an early-
    CC       flowering phenotype (Including cv. Columbia, cv. Landsberg Erecta
    CC       and cv. Wassilewskija) show loss-of-function mutations of FRI.
    CC       Able to delay flowering independently of FRL1 activity.
    CC       Dispensable for the reactivation of FLC in early embryogenesis,
    CC       but required to maintain high levels of FLC expression in later
    CC       embryonic and vegetative development. Suppresses the repression of
    CC       FLC by the autonomous pathway, but has no effect on the expression
    CC       of the genes involved in this pathway.
    CC       {ECO:0000269|PubMed:14973192, ECO:0000269|PubMed:19121105,
    CC       ECO:0000269|PubMed:19567704, ECO:0000269|PubMed:21282526}.
    CC   -!- SUBUNIT: Homodimer. Component of the transcription activator
    CC       complex FRI-C composed of FRI, FRL1, SUF4, FLX and FES1. Interacts
    CC       (via N-terminus) with FRL1 and (via C-terminus) with FLX (via N-
    CC       terminus), SUF4 (via C-terminus) and FES1 (via C-terminus).
    CC       Interacts with ASHH2 and RIN1, a component of the SWR1 chromatin-
    CC       remodeling complex. {ECO:0000269|PubMed:17138694,
    CC       ECO:0000269|PubMed:20711170, ECO:0000269|PubMed:21282526}.
    CC   -!- SUBCELLULAR LOCATION: Nucleus speckle
    CC       {ECO:0000269|PubMed:17138694}.
    CC   -!- TISSUE SPECIFICITY: Expressed in ovules, but not in stamens.
    CC       {ECO:0000269|PubMed:19121105}.
    CC   -!- INDUCTION: Not regulated by vernalization.
    CC       {ECO:0000269|PubMed:19121105}.
    CC   -!- SIMILARITY: Belongs to the Frigida family. {ECO:0000305}.
    CC   -!- CAUTION: Has been shown to be inactive in cv. Columbia (AC
    CC       Q67Z93), cv. Landsberg Erecta and cv. Wassilewskija due to loss-
    CC       of-function mutations. The sequence shown is from strain cv. H51.
    CC       {ECO:0000305}.
