taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  FRI (FRIGIDA) is a plant-specific nuclear coiled-coil protein of Arabidopsis, the founding member of
  the Frigida family, and the major determinant of natural variation between the winter-annual and rapid-cycling
  habits. Functional FRI alleles, as in winter-annual accessions such as H51 or Sf-2, up-regulate the
  floral repressor FLC to levels that block flowering before winter, creating a vernalization requirement.
  Most rapid-cycling accessions, including Col-0 and Ler, carry independent loss-of-function deletions.
  FRI has no DNA-binding domain. It acts as a scaffold of the FRI-C transcription activator complex with
  FRL1, FES1, FLX and the FLC-promoter-binding zinc-finger protein SUF4. It recruits chromatin modifiers
  (SWR1/H2A.Z exchange, SDG8 H3K36 methylation and a WDR5a-containing COMPASS-like H3K4 methyltransferase)
  and interacts with the nuclear cap-binding complex (CBP20) to promote co-transcriptional FLC expression.
  In the cold, FRI quickly partitions into nuclear condensates away from the active FLC locus, lowering
  FRI occupancy at FLC as a first step in its shutdown.
