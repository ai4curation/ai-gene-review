    action: REMOVE
    reason: >-
      GO:0005515 protein binding is uninformative. FIP2 has no identifiable functional domains, and fip
      mutants do not affect FLC, so the interaction does not point to a specific activity. Removing the
      generic term does not mean the interaction is false.
    supported_by:
