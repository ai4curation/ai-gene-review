core_functions:
- description: >-
    Scaffold/coactivator of the FRI-C transcription activator complex (with SUF4, FLX, FES1, FRL1). It
    recruits chromatin modifiers and the cap-binding complex to up-regulate FLC, establishing the winter-annual
    vernalization requirement.
