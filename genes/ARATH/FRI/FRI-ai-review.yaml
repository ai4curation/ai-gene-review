suggested_questions:
- question: >-
    What is the structural basis of FRI scaffolding (coiled-coil versus disordered C-terminus), and is
    FRI-C a stable stoichiometric complex or a dynamic condensate?
- question: >-
    How does cold-induced partitioning of FRI into condensates relate mechanistically to COOLAIR induction
    and to the later VIN3-dependent Polycomb nucleation?
suggested_experiments:
- hypothesis: FRI scaffolding of SUF4 and FLX is necessary and sufficient to activate FLC.
  description: >-
    Tether FRI (or FRI deletion variants) to the FLC promoter in fri suf4 backgrounds using a dCas9 fusion.
    Measure FLC transcription, H3K4me3/H3K36me3 and H2A.Z, and test which FRI-C partners are required.
