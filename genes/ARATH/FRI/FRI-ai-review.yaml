- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:21282526
  review:
    summary: >-
      FRI has no DNA-binding domain. It acts as the scaffold of the FRI-C transcription activator complex,
      bridging the FLC-promoter-binding zinc-finger protein SUF4 with FLX/FES1, and recruits chromatin
      modifiers (SWR1 complex, SDG8/SET2, COMPASS-like WDR5a) and the nuclear cap-binding complex to activate
      FLC.
    action: NEW
    reason: >-
      This is the best-supported molecular function of FRI. FRI itself does the work of coactivation by
      assembling the activator complex; sequence-specific DNA binding is supplied by SUF4.
    supported_by:
    - reference_id: PMID:21282526
      supporting_text: >-
        Here, we report that FRI acts as a scaffold protein interacting with FRL1, FES1, SUF4, and FLX
        to form a transcription activator complex (FRI-C).
    - reference_id: PMID:21282526
      supporting_text: >-
        SUF4 binds to a cis-element of the FLC promoter, FLX and FES1 have transcriptional activation
        potential, and FRL1 and FES1 stabilize the complex.
    - reference_id: PMID:21282526
      supporting_text: >-
        FRI-C recruits a general transcription factor, a TAF14 homolog, and chromatin modification factors,
        the SWR1 complex and SET2 homolog.
    - reference_id: PMID:19567704
      supporting_text: >-
        FRI mediates WDR5a enrichment at the FLC locus, leading to increased H3K4me3 and FLC upregulation.
