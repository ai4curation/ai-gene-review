core_functions:
- description: Sequence-specific mRNA 3'-UTR-binding adaptor of the TTP/TIS11 family. It binds target
    transcripts (for example, a poly(U) motif in the IAMH2 3' UTR) and directs them to decay through P-body
    decapping (DCP1) and CCR4-NOT deadenylation. Acting redundantly with C3H14, this activity clears unwanted
    and highly expressed transcripts from male meiocytes and is needed for meiotic progression and microsporogenesis.
