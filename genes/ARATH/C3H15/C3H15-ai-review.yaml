  review:
    summary: The cdm1 T-DNA mutant is completely male sterile. Microspores form and then degenerate, with
      callose and exine defects. In c3h14 c3h15 double mutants, meiocytes arrest at pachytene and lose
      meiocyte identity.
    action: NEW
    reason: C3H15 is expressed in meiocytes and tapetum at anther stages 4-7, so the requirement is cell-autonomous
      in microsporocytes. There the 2026 studies show it binding and clearing transcripts. This is the
      developmental context of its RNA-decay activity, not a downstream pleiotropic effect. Caveat - Lu
      et al. report a single-mutant sterile phenotype from an allele predicted to make a truncated protein
      lacking the second finger. Chai et al. 2015 report that single T-DNA mutants are fertile and that
      the pollen defect needs both C3H14 and C3H15. The requirement is therefore best read as redundant
      with C3H14. microsporogenesis is chosen over the broader pollen development because the defects
      arise in meiocytes and tetrads.
    supported_by:
    - reference_id: PMID:24567187
      supporting_text: In addition, a transfer DNA insertional cdm1 mutant was completely male sterile.
    - reference_id: PMID:25732536
