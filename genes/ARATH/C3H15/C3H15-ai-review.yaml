    supporting_text: With BR treatment, the GFP-C3H15 signal was rapidly enhanced in the nucleus within
      1 h but weakened in the cytoplasm
  - statement: C3H15 binds G-rich CHRE elements (EMSA, ChIP-qPCR) and represses transcription of targets,
