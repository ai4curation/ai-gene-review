    summary: This annotation comes from the genome-wide catalogue of Arabidopsis transcription factors,
      which classified C3H proteins as transcription factors by their domain. C3H15 is not individually
      characterized in that paper.
    action: MODIFY
    reason: The domain-based basis is weak, because CCCH TZF domains are best known as mRNA-binding modules
      (TTP family). There is now direct experimental evidence, though, that C3H15 is a sequence-specific
      DNA-binding transcriptional regulator, and that it acts as a repressor. EMSA and ChIP-qPCR show
      C3H15 binding to CHRE elements, and C3H15 represses a proSAUR15:GUS reporter in protoplasts. The
      authors conclude that C3H15 "acts as a transcriptional repressor" (PMID:35139225). The more specific
      child term DNA-binding transcription repressor activity is therefore the supported claim. C3H15
      overexpression also activates secondary-wall genes (PMID:25732536), but that study did not show
      direct activation at a bound promoter, so activator activity is not proposed.
