taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: C3H15 (AtC3H15; also CALLOSE DEFECTIVE MICROSPORE 1, CDM1; At1g68200) is a plant
  tandem CCCH zinc-finger (TZF) protein of the TTP/TIS11-related family, with two C-X8-C-X5-C-X3-H
  fingers near its C-terminus. Its closest relative is the duplicated paralog C3H14, and most mutant
  phenotypes appear only in c3h14 c3h15 double mutants. C3H15 has two biochemical activities. (1) Like
  animal TTP proteins, it binds target mRNAs and promotes their decay. Recombinant C3H15 binds a poly(U)
  region in the IAMH2 3' UTR and represses a reporter carrying that UTR. C3H15 also localizes to P-bodies,
  interacts with the decapping enzyme DCP1, and associates with the CCR4-NOT deadenylase complex. In male
  meiocytes, C3H14 and C3H15 clear highly expressed and identity-inappropriate transcripts around the
  zygotene-pachytene transition; without both proteins, meiocytes arrest and degenerate. An earlier
  cdm1 T-DNA allele (SALK_065040), predicted to make a truncated protein lacking the second finger,
  was male sterile with defective callose metabolism around the tetrad. (2) C3H15 also binds G-rich
  DNA elements (CHRE, typically GGGAGA) in promoters and acts as a transcriptional repressor. In the
  absence of brassinosteroid (BR), the kinase BIN2 phosphorylates C3H15 at Ser111 and C3H15 stays in
  the cytoplasm. BR leads to its dephosphorylation and nuclear accumulation, where it antagonizes
  BZR1/BES1 at shared targets such as SAUR15, and so negatively regulates BR-induced cell elongation.
  C3H14 and C3H15 are also required for normal secondary wall thickening. C3H15 is expressed strongly
  in meiocytes and tapetum and in tissues forming secondary walls. Under heat stress, it moves to stress
  granules and is degraded via the E3 ligase MBR2.
