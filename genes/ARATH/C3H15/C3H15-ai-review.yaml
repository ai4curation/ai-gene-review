- id: PMID:41758611
  title: CCCH-type zinc finger proteins are required for meiotic progression and RNA clearance in Arabidopsis.
  findings:
  - statement: C3H14/15 bind highly expressed mRNAs in microspore mother cells. Their loss causes DNA:RNA
      hybrids and pachytene arrest. C3H15 localizes to P-bodies through DCP1.
    supporting_text: Moreover, we show that C3H15 accumulates in P-bodies through its interaction with
      the decapping enzyme DCP1 for RNA degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only (2026, no PMC record at caching).
- id: PMID:42711403
  title: Zinc-finger proteins C3H14 and C3H15 maintain meiocyte identity in flowering plants.
  findings:
  - statement: C3H14/C3H15 redundantly maintain meiocyte identity by eliminating archesporial and tapetal
      transcripts. They interact with P-body proteins and CCR4-NOT. The function is conserved in soybean
      and rice.
    supporting_text: Moreover, C3H14/C3H15 interacts with processing-body proteins and the CCR4-NOT deadenylase
      complex, and is required for eliminating unwanted transcripts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only (2026).
- id: PMID:42844995
  title: Structural variation in the IAMH2 3' UTR underlies hypocotyl elongation during light adaptation
    in Arabidopsis thaliana.
  findings:
  - statement: Recombinant C3H15 binds the poly(U) region of the IAMH2 3' UTR (RNA-EMSA) and represses
      a 3' UTR reporter. IAMH2 is epistatic to C3H14/C3H15 for hypocotyl length.
    supporting_text: The results confirmed specific binding of both C3H14 and C3H15 proteins to the IAMH2
      RNA probe of Col‐0/Sic
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text (PMC13646855) read. This is the most direct published evidence for C3H15 3'
      UTR binding.
suggested_questions:
- question: Does the SALK_065040 cdm1 allele, which is predicted to make a C3H15 fragment lacking the second
    zinc finger, cause male sterility as a single mutant because it behaves differently from a null (for
    example, by interfering with C3H14)? Later studies found single c3h15 T-DNA mutants fertile.
- question: Are the transcriptional (nuclear CHRE binding) and RNA-decay (cytoplasmic 3' UTR binding)
    activities carried out by the same TZF domain? Does BIN2 phosphorylation at Ser111 switch C3H15
    between them?
- question: What sequence does C3H15 recognize in RNA (poly(U), AU-rich, or other), and does it overlap
    with the G-rich CHRE DNA motif?
- question: Which of the C3H15-dependent phenotypes (secondary wall thickness, thermotolerance, defence,
    copper/zinc status) depend on mRNA decay, and which depend on transcriptional repression?
suggested_experiments:
- description: Genome-wide in vivo RNA-binding mapping (e.g. CLIP or HyperTRIBE) of C3H15 in meiocytes
    and stems, compared with ChIP-seq of C3H15. This would define the RNA and DNA targets and test whether
    they overlap.
- description: Express C3H15 zinc-finger point mutants (cysteine-to-alanine in finger 1 or 2) and a non-phosphorylatable
    S111A variant in the c3h14 c3h15 background. Score complementation of meiosis, secondary wall and
    BR phenotypes to assign each phenotype to RNA or DNA binding.
- description: Characterize additional c3h15 null alleles (e.g. CRISPR deletions) alongside SALK_065040
    to resolve whether single-mutant male sterility is allele-specific.
