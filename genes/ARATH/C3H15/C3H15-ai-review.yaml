  title: The CCCH zinc finger protein C3H15 negatively regulates cell elongation by inhibiting brassinosteroid
    signaling.
  findings:
  - statement: BIN2 phosphorylates C3H15 at Ser111 in the cytoplasm. BR leads to its dephosphorylation
