- id: file:ARATH/UFO/UFO-notes.md
  title: UFO curation notes
  findings: []
core_functions:
- description: >-
    Transcriptional cofactor of LEAFY: UFO binds LEAFY and DNA, forming a LEAFY-UFO-DNA complex that redirects
    LEAFY to new cis-elements and activates region-specific floral targets such as APETALA3, thereby contributing
    to floral meristem identity and floral patterning downstream of LEAFY.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0006355
    label: regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:36732360
    supporting_text: >-
      we establish that UFO instead acts by forming an active transcriptional complex with LFY at newly
      discovered regulatory elements.
  - reference_id: PMID:9016705
    supporting_text: >-
      We conclude that UFO is not a simple mediator between meristem- and organ-identity genes, but is
      likely to be a partially dispensable co-regulator that acts together with LFY.
  - reference_id: PMID:7780306
    supporting_text: >-
      UFO is required for the proper identity of the floral meristem and acts in three different aspects
      of the process that distinguishes flowers from shoots.
- description: >-
    F-box substrate-adaptor subunit of an SCF(UFO) ubiquitin ligase that binds SKP1-like ASK proteins
    and associates with the COP9 signalosome; substrates are unknown and this activity is largely dispensable
    for the LEAFY cofactor function.
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  in_complex:
    id: GO:0019005
    label: SCF ubiquitin ligase complex
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:10607296
    supporting_text: >-
      we show here that UFO is an F-box protein that interacts with Arabidopsis SKP1-like proteins, both
      in the yeast two-hybrid system and in vitro.
  - reference_id: PMID:12724534
    supporting_text: >-
      We show that UNUSUAL FLORAL ORGANS (UFO) forms a SCF(UFO) complex, which is associated with CSN
      in vivo.
suggested_questions:
- question: >-
    Does UFO have any bona fide ubiquitination substrate in the flower, or is its SCF association a vestige
    given that the F-box is largely dispensable for LFY cofactor activity?
- question: >-
    Which LEAFY targets beyond AP3 depend on the LFY-UFO complex in floral meristem identity, and does
    UFO contribute to LFY-dependent AP1 activation?
suggested_experiments:
- description: >-
    Compare LFY ChIP-seq in wild-type, ufo and 35S::UFO inflorescences, and in ufo complemented with an
    F-box-deleted UFO, to separate cofactor-dependent from SCF-dependent targets.
  experiment_type: ChIP-seq
