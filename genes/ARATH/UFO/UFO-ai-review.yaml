- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:36732360
  review:
    summary: >-
      UFO forms an active transcriptional complex with LEAFY on DNA, redirecting LEAFY to new cis-elements;
      cryo-EM shows UFO contacting both LFY and DNA.
    action: NEW
    reason: >-
      Biochemical, genome-wide and structural data show UFO is a non-DNA-binding (on its own) cofactor
      that increases LFY-dependent activation at specific elements. This MF is not represented in GOA;
      existing transcription regulation BP annotations imply it.
    supported_by:
    - reference_id: PMID:36732360
      supporting_text: >-
        we establish that UFO instead acts by forming an active transcriptional complex with LFY at newly
        discovered regulatory elements.
    - reference_id: PMID:18287201
      supporting_text: >-
        These results define an unexpected role for an F-box protein in functioning as a DNA-associated
        transcriptional co-factor in regulating floral homeotic gene expression.
