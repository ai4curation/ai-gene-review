- term:
    id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  evidence_type: TAS
  original_reference_id: PMID:11019805
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Ubiquitin-dependent protein catabolic process (TAS) from a review of proteolysis in plant signalling.
    action: KEEP_AS_NON_CORE
    reason: >-
      UFO is an SCF F-box subunit, and proteasome activity contributes to LFY-dependent AP3 activation,
      but no UFO substrate has been identified and the ubiquitination link is largely dispensable for
