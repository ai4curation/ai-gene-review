id: Q39090
gene_symbol: UFO
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  UNUSUAL FLORAL ORGANS (UFO; FBX1, At1g30950) is a nuclear F-box protein expressed in shoot apical meristems
  and in a specific domain of young flowers. Genetically it acts together with the floral meristem identity
  transcription factor LEAFY: ufo mutants show partial loss of floral meristem identity and determinacy,
  abnormal whorl patterning, and reduced activation of the B-class organ identity gene APETALA3, whereas
  ectopic UFO activates AP3 only where LEAFY is present. UFO binds SKP1-like proteins (ASK1, ASK2) through
  its F-box and assembles an SCF(UFO) ubiquitin ligase that associates with the COP9 signalosome, but
  its principal mechanism is as a transcriptional cofactor of LEAFY: UFO binds LEAFY and DNA directly,
  forming a LEAFY-UFO-DNA complex that redirects LEAFY to new cis-elements (for example in the AP3 promoter)
  and activates them. In this way UFO restricts LEAFY's broad meristem-identity activity to region-specific
  floral programs.
