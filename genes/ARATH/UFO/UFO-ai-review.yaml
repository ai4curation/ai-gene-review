- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G30950
  - PANTHER:PTN001281291
  review:
    summary: >-
      Ubiquitin-protein transferase activity inferred by PAINT (PTN001281291, seeded by UFO).
    action: MODIFY
    reason: >-
      An F-box protein is the substrate-recognition subunit of an SCF E3; it does not itself transfer
      ubiquitin (the RING subunit RBX1 and the E2 do). Assigning the catalytic E3 activity to the adaptor
      subunit is a complex-activity transfer. The adaptor activity term is the appropriate MF.
    proposed_replacement_terms:
    - id: GO:1990756
      label: ubiquitin-like ligase-substrate adaptor activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001281291
        source_label: UFO F-box node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Node seeded by UFO's own IMP for ubiquitin-protein transferase activity; the seed itself conflates
          the SCF complex's catalytic activity with the F-box adaptor subunit.
    supported_by:
    - reference_id: PMID:10607296
      supporting_text: >-
        we show here that UFO is an F-box protein that interacts with Arabidopsis SKP1-like proteins,
        both in the yeast two-hybrid system and in vitro.
- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IMP
  original_reference_id: PMID:18287201
  qualifier: enables
  review:
    summary: >-
      Ubiquitin-protein transferase activity (IMP) from the study of UFO as a LEAFY cofactor.
    action: MODIFY
    reason: >-
      The paper shows proteasome activity is needed for LFY-dependent AP3 activation, which supports UFO
      acting in an SCF-dependent pathway, but not UFO itself catalysing ubiquitin transfer. Later work
      found the F-box connection to ubiquitination mostly dispensable for UFO-LFY function. Replace with
      the adaptor activity.
    proposed_replacement_terms:
    - id: GO:1990756
      label: ubiquitin-like ligase-substrate adaptor activity
    supported_by:
    - reference_id: PMID:18287201
      supporting_text: >-
        Moreover, chemical or genetic disruption of proteasome activity compromises LFY-dependent AP3
        activation, indicating that protein degradation is required to promote LFY activity.
    - reference_id: PMID:36732360
      supporting_text: >-
        Here we show in transient assays and stable transgenic plants that the connection to ubiquitination
        pathways suggested by the UFO F-box domain is mostly dispensable.
