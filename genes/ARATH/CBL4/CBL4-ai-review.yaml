taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: CBL4/SOS3 (SALT OVERLY SENSITIVE 3; At5g24270) is a 222-residue calcineurin B-like
  (CBL) calcium sensor of Arabidopsis thaliana with four EF-hand motifs. It is N-myristoylated
  at Gly2, which anchors it to the plasma membrane, and S-acylated at Cys3, which redirects
  a pool to the nucleus. Calcium binding induces its dimerization and a conformational change.
  Upon salt-induced Ca2+ signals, CBL4 binds the NAF/FISL autoinhibitory motif of the CBL-interacting
  protein kinase CIPK24/SOS2, relieving autoinhibition, activating the kinase in a Ca2+-dependent
  manner and recruiting it to the plasma membrane, where the CBL4-CIPK24 complex phosphorylates
  and activates the Na+/H+ antiporter SOS1 to export Na+. CBL4 acts mainly in roots; sos3
  mutants are hypersensitive to Na+ and Li+, accumulate more Na+ and less K+, and are rescued
  by high external Ca2+. CBL4 also binds other CIPKs, including CIPK6, with which it targets
  the K+ channel AKT2 to the plasma membrane, and has been reported to bind SOS1 and HKT1;1
  directly. Despite its name and sequence similarity to calcineurin B, it regulates a protein
  kinase rather than a protein phosphatase.
existing_annotations:
- term:
    id: GO:0004723
    label: calcium-dependent protein serine/threonine phosphatase activity
  evidence_type: ISS
  original_reference_id: PMID:9632394
  qualifier: enables
  review:
    summary: Sequence-similarity transfer of the catalytic activity of calcineurin (a phosphatase
      holoenzyme) to SOS3 on the basis of its similarity to the regulatory calcineurin B subunit.
    action: REMOVE
    reason: CBL4 is a small EF-hand regulatory protein with no phosphatase domain; even in
      animals and yeast calcineurin B is the regulatory, non-catalytic subunit, so its similarity
      cannot support a catalytic phosphatase activity. Later work showed that the SOS3 target
      is the SOS2 protein kinase, not a phosphatase. This is a wrong ISS transfer, not an
      experimental annotation.
    supported_by:
    - reference_id: PMID:9632394
      supporting_text: SOS3 encodes a protein that shares significant sequence similarity
        with the calcineurin B subunit from yeast and neuronal calcium sensors from animals.
    - reference_id: PMID:10725350
      supporting_text: Our results imply that plant salt tolerance may be mediated not by
        a calcineurin-like protein phosphatase but, rather, by the SOS3/SOS2 kinase complex.
