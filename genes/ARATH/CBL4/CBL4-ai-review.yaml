- term:
    id: GO:0006883
    label: intracellular sodium ion homeostasis
  evidence_type: IMP
  original_reference_id: PMID:9405721
  qualifier: acts_upstream_of_or_within
  review:
    summary: Proposed annotation. sos3 seedlings accumulate excess Na+ under salt stress, and SOS3 is
      the Ca2+-sensing subunit of the SOS2-SOS3 kinase complex that activates the plasma-membrane
      Na+/H+ exchanger SOS1.
    action: NEW
    reason: CBL4 does part of the work of the pathway, not merely being required for it. It senses the
      Ca2+ signal, activates CIPK24, and recruits it to the plasma membrane next to SOS1; a
      constitutively active SOS2 cannot fully replace the SOS2/SOS3 complex in vivo. Plasma-membrane
      Na+/H+ exchange is reduced in sos3 vesicles. The existing IMP row from the same paper already
      covers K+ homeostasis but not the primary Na+ defect. This matches the module-level process of
      the SOS pathway and the NEW row proposed for CIPK24.
    supported_by:
    - reference_id: PMID:9405721
      supporting_text: Under NaCl stress, sos3 seedlings accumulated more Na+ and less K+ than the wild
        type.
    - reference_id: PMID:12034882
      supporting_text: These results demonstrate that SOS1 contributes to plasma membrane Na(+)/H(+)
        exchange and that SOS2 and SOS3 regulate SOS1 transport activity.
    - reference_id: PMID:12070350
      supporting_text: We propose a model in which SOS3 activates and directs SOS2 to the plasma
        membrane for the stimulatory phosphorylation of the Na+ transporter SOS1.
- term:
    id: GO:0043495
    label: protein-membrane adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:12070350
  qualifier: enables
  review:
    summary: Proposed annotation. In the yeast SOS Recruitment System, SOS3 brings SOS2 to the plasma
      membrane. Recruitment is a separate essential contribution of SOS3, because a hyperactive,
      SOS3-independent SOS2 cannot fully replace the SOS2/SOS3 complex for SOS1 activation in vivo.
    action: NEW
    reason: CBL4 carries the membrane anchor (N-myristoylation at Gly-2 and S-acylation at Cys-3) for
      the CBL-CIPK complex, which matches the definition of bringing a protein or complex to a membrane.
      The same lipid-anchor-dependent mechanism moves the CIPK6-AKT2 complex to the plasma membrane
      (PMID:21445098). Kinase activation (GO:0043539) does not capture this second activity.
    supported_by:
    - reference_id: PMID:12070350
      supporting_text: SOS3 is essential for both the kinase activity of SOS2 and its recruitment to the
        plasma membrane.
    - reference_id: file:ARATH/CBL4/CBL4-uniprot.txt
      supporting_text: The N-terminal 18 amino acids are sufficient for the cell membrane targeting of a
        heterologous protein.
- term:
    id: GO:0072659
    label: protein localization to plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:21445098
  qualifier: involved_in
  review:
    summary: Proposed annotation. CBL4, through its myristoyl and palmitoyl anchors, brings its CIPK
      partners to the plasma membrane. It recruits SOS2/CIPK24 there in a yeast reconstitution, and with
      CIPK6 it drives Ca2+-dependent translocation of the AKT2 K+ channel from the ER to the plasma
      membrane in plant cells.
    action: NEW
    reason: CBL4 performs the targeting step itself. Its dual lipid modification provides the
      membrane-targeting signal, and the AKT2 translocation is kinase-interaction-dependent but
      phosphorylation-independent, so the effect is not just a downstream result of kinase activation.
      No existing row captures this experimentally established role.
    supported_by:
    - reference_id: PMID:21445098
      supporting_text: the isolated regulatory C-terminal domain of CIPK6 is sufficient for mediating
        CBL4- and Ca(2+)-dependent channel translocation from the endoplasmic reticulum membrane to the
        PM by a novel targeting pathway that is dependent on dual lipid modifications of CBL4 by
        myristoylation and palmitoylation
    - reference_id: PMID:12070350
      supporting_text: SOS3 is essential for both the kinase activity of SOS2 and its recruitment to the
        plasma membrane.
core_functions:
- description: Ca2+-dependent activator of the SOS2/CIPK24 protein kinase. Ca2+ binding to the EF
    hands of CBL4 promotes binding to the NAF/FISL autoinhibitory motif of CIPK24, relieving
    autoinhibition and switching on the kinase that phosphorylates and activates the Na+/H+ antiporter
    SOS1, thereby keeping cytosolic Na+ low under salt stress, mainly in roots.
  supported_by:
  - reference_id: PMID:10725350
    supporting_text: SOS3 activates SOS2 protein kinase activity in a Ca 2+ -dependent manner
  - reference_id: PMID:11402167
    supporting_text: Removal of the regulatory domain of SOS2, including the SOS3 binding motif,
      resulted in constitutive activation of the protein kinase, indicating that the SOS3 binding
      motif can serve as a kinase autoinhibitory domain
  - reference_id: PMID:21262798
    supporting_text: The SOS2–SOS3 calcium-dependent protein kinase complex up-regulates SOS1 activity
  molecular_function:
