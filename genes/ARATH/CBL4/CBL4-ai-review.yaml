suggested_questions:
- question: Is CBL4 the only Ca2+ sensor needed to activate CIPK24 in the root epidermis and the
    sodium-sensing niche, or do CBL8 and CBL10 share this role in particular root cell types?
- question: Do the weak CBL4 interactions with CIPK1, CIPK10, CIPK11 and CIPK15 seen in yeast
    two-hybrid assays have physiological roles in planta?
- question: The TAIR ISS annotations to calcium-dependent protein serine/threonine phosphatase
    activity and to calcineurin complex (PMID:9632394) and the IMP annotation to hypotonic salinity
    response (PMID:9405721) look like legacy or direction errors. Should they be retired or
    corrected to hyperosmotic salinity response?
suggested_experiments:
- description: Cell-type-specific complementation of sos3 (for example epidermis vs stele promoters)
    combined with Ca2+ and pH imaging, to map where CBL4-dependent CIPK24 activation is needed for root
    salt tolerance.
- description: Test whether the low-affinity EF hands of CBL4 set the Ca2+ threshold for SOS pathway
    activation, by engineering higher-affinity EF-hand variants and measuring CIPK24 activation, SOS1
    phosphorylation and salt tolerance in planta.
