- term:
    id: GO:0004723
    label: calcium-dependent protein serine/threonine phosphatase activity
  evidence_type: ISS
  original_reference_id: PMID:9632394
  qualifier: enables
  review:
    summary: Sequence-similarity transfer from the yeast calcineurin B regulatory subunit made when
      SOS3 was cloned. CBL4 is a small non-catalytic EF-hand protein with no phosphatase domain, and
      the identified effector is a protein kinase, not a phosphatase.
    action: REMOVE
    reason: Even in fungi and animals the calcium-dependent phosphatase activity belongs to the
      catalytic calcineurin A subunit, not to the regulatory B subunit, so the transfer is wrong even
      for an orthologous calcineurin B. In addition, plants have no calcineurin A homolog and no
      phosphatase partner of SOS3 has been found; SOS3 instead binds and activates the SOS2/CIPK24
      kinase (PMID:10725350). The real activity is captured by protein serine/threonine kinase
      activator activity (GO:0043539) elsewhere in this review.
    supported_by:
    - reference_id: PMID:10725350
      supporting_text: However, as yet, no protein phosphatase has been found to interact with SOS3.
        Instead, SOS3 was found to interact with and activate a protein kinase encoded by SOS2.
