id: O81223
gene_symbol: CBL4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  CBL4 (CALCINEURIN B-LIKE PROTEIN 4), also known as SOS3 (SALT OVERLY SENSITIVE 3), is a small
  (222 aa) EF-hand calcium sensor of the plant calcineurin B-like (CBL) family that decodes
  salt-induced cytosolic Ca2+ signals. It is N-myristoylated at Gly-2 and S-acylated at Cys-3,
  which anchor it to the cytoplasmic face of the plasma membrane. Its EF hands bind Ca2+ (and Mn2+)
  with unusually low affinity, and Ca2+ binding drives dimerization and a conformational change.
  Ca2+-loaded CBL4 binds the C-terminal NAF/FISL motif of CBL-interacting protein kinases (CIPKs),
  relieving autoinhibition and activating the kinase. Its principal partner is CIPK24/SOS2: the
  CBL4-CIPK24 complex is recruited to the plasma membrane by CBL4, where CIPK24 phosphorylates the
  autoinhibitory C-terminus of the Na+/H+ antiporter SOS1, increasing Na+ extrusion. This SOS3-SOS2-SOS1
  relay acts mainly in roots and is required for intracellular Na+/K+ homeostasis and tolerance to high
  NaCl; sos3 loss-of-function plants are salt hypersensitive, fail to grow on low K+, and are partly
  rescued by high external Ca2+. With CIPK6, CBL4 also promotes Ca2+-dependent translocation of the
  K+ channel AKT2 from the endoplasmic reticulum to the plasma membrane by a phosphorylation-independent
  mechanism that requires both of its lipid modifications. Despite its name and sequence similarity to
  calcineurin B, plants lack a calcineurin A catalytic subunit and CBL4 has no phosphatase partner;
  it signals through CIPK kinases instead.
