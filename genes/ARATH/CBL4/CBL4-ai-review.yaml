core_functions:
- description: Calcium sensor that, upon binding Ca2+, binds the NAF/FISL autoinhibitory motif
    of CIPK24/SOS2 and activates the kinase, recruiting it to the plasma membrane (via N-myristoylation)
    where the CBL4-CIPK24 complex phosphorylates and activates the Na+/H+ antiporter SOS1
    for Na+ efflux, mainly in roots.
  molecular_function:
    id: GO:0043539
    label: protein serine/threonine kinase activator activity
  directly_involved_in:
  - id: GO:0019722
    label: calcium-mediated signaling
  - id: GO:0042538
    label: hyperosmotic salinity response
  - id: GO:0006883
    label: intracellular sodium ion homeostasis
  - id: GO:0030007
    label: intracellular potassium ion homeostasis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:10725350
    supporting_text: SOS3 activates SOS2 protein kinase activity in a Ca(2+)-dependent manner.
  - reference_id: PMID:12070350
    supporting_text: We propose a model in which SOS3 activates and directs SOS2 to the plasma
      membrane for the stimulatory phosphorylation of the Na+ transporter SOS1.
  - reference_id: PMID:12034882
    supporting_text: These results demonstrate that SOS1 contributes to plasma membrane Na(+)/H(+)
      exchange and that SOS2 and SOS3 regulate SOS1 transport activity.
  - reference_id: PMID:17449811
    supporting_text: We show that SOS3 acts primarily in roots under salt stress.
- description: EF-hand calcium binding; Ca2+ binding drives SOS3 dimerization and a conformational
    change required for function (the sos3-1 EF-hand mutation reduces Ca2+ binding and abolishes
    SOS2 interaction).
  molecular_function:
    id: GO:0005509
    label: calcium ion binding
  directly_involved_in:
  - id: GO:0005513
    label: detection of calcium ion
  supported_by:
  - reference_id: PMID:11006339
    supporting_text: Gel mobility shift and (45)Ca(2)+ overlay assays demonstrated that SOS3
      is a unique calcium binding protein and that the sos3-1 mutation substantially reduced
      the capacity of SOS3 to bind calcium.
  - reference_id: PMID:15644219
    supporting_text: calcium binding is responsible for the dimerization of SOS3
suggested_questions:
- question: Does the direct, SOS2-independent binding of SOS3 to SOS1 and HKT1;1 reported
    in 2024 warrant a distinct molecular-function annotation (e.g. transporter regulator activity),
    and how does it contribute relative to SOS2 activation?
- question: Is the CBL4-CIPK6-AKT2 plasma-membrane targeting module physiologically important
    in planta, or mainly a heterologous-system observation?
- question: What specific role does the S-acylated nuclear pool of SOS3 play, given its limited
    contribution to salt tolerance?
suggested_experiments:
- description: Compare salt tolerance and SOS1 activity in sos3 lines complemented with SOS3
    variants that bind SOS2 but not SOS1/HKT1;1 (and vice versa) to separate kinase-dependent
    and kinase-independent functions.
- description: Measure SOS3 Ca2+ affinity and SOS2 activation kinetics in vitro alongside
    CBL10 to test whether the two sensors decode different Ca2+ signatures in roots and shoots.
