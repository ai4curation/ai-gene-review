id: Q570C0
gene_symbol: TIR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'TIR1 is a predominantly nuclear Arabidopsis F-box/leucine-rich-repeat auxin receptor and
  the substrate-recognition subunit of SCF(TIR1). Auxin stabilizes association with Aux/IAA transcriptional
  repressors, allowing their ubiquitination and proteasomal degradation and changing ARF-dependent gene
  expression. Its receptor fold binds an inositol hexakisphosphate cofactor. TIR1 also catalyzes cAMP
  production: separation-of-function mutants retain Aux/IAA recruitment and degradation but impair transcriptional
  auxin responses. Receptor redundancy and tissue context shape its effects on lateral roots, reproductive
  development and phosphate-starvation responses.'
