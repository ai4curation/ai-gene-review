- id: PMID:40044868
  title: TIR1-produced cAMP as a second messenger in transcriptional auxin signalling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article inspected. TIR1 ACm1/ACm3 retain ASK1 binding and Aux/IAA degradation
