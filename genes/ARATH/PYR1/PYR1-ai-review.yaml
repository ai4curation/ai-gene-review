id: O49686
gene_symbol: PYR1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PYR1 (PYRABACTIN RESISTANCE 1; RCAR11) is an intracellular abscisic acid (ABA) receptor in
  Arabidopsis. Its START/Bet v1-like fold forms a homodimer and binds ABA in an internal cavity.
  Hormone binding closes the receptor gate and creates a surface that binds and inhibits clade-A
  type-2C protein phosphatases, including ABI1 and HAB1. This relieves phosphatase suppression
  of downstream SnRK2 signaling and promotes ABA-responsive transcription and physiological
  responses. PYR1 acts in the cytosol and nucleus. CAR proteins recruit receptor pools to the
  plasma membrane, while RSL1 and FREE1 participate in receptor turnover through the vacuolar
  pathway. CARK1-mediated phosphorylation also regulates PYR1 activity.
