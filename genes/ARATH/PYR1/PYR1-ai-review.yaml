core_functions:
- description: >-
    Functions as a direct intracellular hormone receptor: ABA binding triggers a
    gate-latch-lock conformational change that converts the receptor into its
    PP2C-inhibitory state, transducing the hormone signal into the cell.
  molecular_function:
    id: GO:0038023
    label: signaling receptor activity
  directly_involved_in:
  - id: GO:0009738
    label: abscisic acid-activated signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:19407142
    supporting_text: Addition of (+)-ABA alters the HSQC signals for many PYR1 and
      PYR1P88S residues (Figure 4C, SOM Figures 4 and 5), which shows that ABA binds PYR1
  - reference_id: PMID:19933100
    supporting_text: Site-directed PYR1 mutants designed to disrupt hormone binding lose
      ABA-triggered interactions with type 2C protein phosphatase partners in planta
- description: >-
    Upon ABA binding, PYR1 binds to and inhibits clade-A type-2C protein phosphatases
    (ABI1, ABI2, HAB1, AHG3/PP2CA), the negative regulators of ABA signaling; this
    ABA-dependent phosphatase inhibition is the central signal-transduction output of
    the receptor and de-represses downstream SnRK2 kinases.
  molecular_function:
    id: GO:0004864
    label: protein phosphatase inhibitor activity
  directly_involved_in:
  - id: GO:0009738
    label: abscisic acid-activated signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:19407142
    supporting_text: (+)-ABA acts as a potent saturable inhibitor of phosphatase activity
      in the presence of PYR1 (IC50 = 125 nM)
suggested_questions:
- question: >-
    Is PYR1's nuclear pool functionally distinct from its cytosolic pool, and does it
    regulate a distinct set of nuclear PP2Cs or downstream targets?
- question: >-
    How do the multiple regulatory routes (CARK phosphorylation, RSL1/FREE1-mediated
    ubiquitylation and vacuolar degradation, CAR-mediated membrane recruitment)
    integrate to set PYR1 abundance and ABA sensitivity in vivo?
