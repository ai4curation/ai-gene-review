      source of this row cannot be verified here.
    action: REMOVE
    reason: 'Generic protein binding is uninformative and is removed under the protein-binding
      policy. The GID1B-RGA interaction itself is real (GA-dependent binding shown in PMID:16709201
      and PMID:17194763) and is already covered by gibberellin binding (GO:0010331), the GA
      signaling process terms and the proposed gibberellin receptor activity term. Separately,
      the cited reference looks mismatched: the cached full text of PMID:19429606 (FRIGIDA
      and the nuclear cap-binding complex) does not mention GID1 or DELLA proteins, so this
      is probably an IntAct reference error. Removal does not mean the interaction is false.'
