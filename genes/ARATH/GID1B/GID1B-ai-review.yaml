- id: file:ARATH/GID1B/GID1B-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report for GID1B
  findings:
  - statement: 'Falcon synthesis: GID1B is a soluble GA receptor with a non-catalytic hydrolase
      fold, unusually high GA4 affinity, detectable GA-independent DELLA interaction in yeast,
      and a root-biased contribution to GA perception.'
    reference_section_type: OTHER
    supporting_text: GID1B is a soluble gibberellin (GA) receptor, not an established GA-metabolizing
      enzyme
core_functions:
- description: 'Soluble gibberellin receptor: binds bioactive GAs (preferentially GA4) in
    its hydrolase-fold pocket; the GA-bound receptor then engages the DELLA domain of DELLA
    repressors, initiating GA signaling. Positive regulator of GA signaling: by forming the
    GA-GID1-DELLA complex it promotes SCF(SLY1)-mediated DELLA ubiquitination and proteasomal
    degradation and also inhibits DELLA repression without proteolysis, partially redundantly
    with the other GID1 receptors.'
  molecular_function:
    id: GO:0010331
    label: gibberellin binding
  directly_involved_in:
  - id: GO:0010476
    label: gibberellin mediated signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id009
  - *id001
  - *id010
  - *id011
  - reference_id: PMID:17194763
    supporting_text: the GA-GID1 complex promotes the interaction between RGA and the F-box
      protein SLY1
  - reference_id: PMID:18827182
    supporting_text: GA-bound GID1 can block DELLA repressor activity by direct protein-protein
      interaction with the DELLA domain
  - reference_id: PMID:23818171
    supporting_text: GID1b overexpression rescues sly1-2 germination through proteolysis-independent
      DELLA down-regulation
  - reference_id: file:ARATH/GID1B/GID1B-deep-research-falcon.md
    supporting_text: GID1B is a soluble gibberellin (GA) receptor, not an established GA-metabolizing
      enzyme
proposed_new_terms:
- proposed_name: gibberellin receptor activity
  proposed_definition: Binding to a gibberellin and, as a result, undergoing a conformational
    change that promotes gibberellin-dependent binding of DELLA repressor proteins, thereby
    transducing the gibberellin signal.
  justification: GID1 proteins, including GID1B, are bona fide soluble GA receptors but GO
    has no gibberellin receptor activity term (checked in GO via OAK/OLS); gibberellin binding
    (GO:0010331) captures ligand binding but not signal transduction. Same proposal as in
    the GID1A review.
  supported_by:
  - *id007
suggested_questions:
- question: Does GID1B bind DELLA proteins at physiologically meaningful levels in the absence
    of GA in planta, and does this GA-independent binding contribute to signaling in seeds?
- question: Is the narrow pH optimum of GID1B GA binding relevant to its function in ovules
    and imbibed seeds, where it is preferentially expressed?
- question: 'Why is GID1B not sufficient to sustain stem elongation in gid1a gid1c, given
    that its mRNA is detectable in stems: is the protein unstable there, or is it limited
    by DELLA preference?'
suggested_experiments:
- description: Compare GA-dependent and GA-independent GID1B-DELLA complex formation in imbibed
    seeds by co-immunoprecipitation in ga1-3 versus wild type, with GID1A as control.
- description: Swap the N-terminal lid region between GID1B and GID1A and test GA affinity,
    pH dependence and rescue of gid1a gid1c to map the determinants of GID1B-specific properties.
