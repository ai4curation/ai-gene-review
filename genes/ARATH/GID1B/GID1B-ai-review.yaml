id: Q9LYC1
gene_symbol: GID1B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'GID1B (GA INSENSITIVE DWARF1B; locus At3g63010) is one of three soluble gibberellin
  (GA) receptors in Arabidopsis thaliana, together with GID1A and GID1C. Like its paralogs
  it has the alpha/beta-hydrolase fold of the hormone-sensitive lipase (GDXG) family but is
  not a hydrolase; the fold forms a pocket that binds bioactive GAs, after which an N-terminal
  lid closes over the hormone and creates a surface that binds the N-terminal DELLA domain
  of the DELLA growth repressors (GAI, RGA, RGL1, RGL2, RGL3). The GA-GID1-DELLA complex is
  recognized by the SCF(SLY1) E3 ubiquitin ligase, leading to DELLA polyubiquitination and
  proteasomal degradation; GA-GID1 binding can also inhibit DELLA activity without proteolysis.
  GID1B differs biochemically from GID1A and GID1C: it has about ten-fold higher affinity
  for GA4, binds GA over a narrow pH range, and needs less GA to engage DELLAs, suggesting
  it acts as a receptor at low GA levels. GID1B belongs to a separate eudicot GID1b clade
  and is expressed mainly in ovules, seeds and roots, where it contributes to GA-dependent
  root growth when GA is limiting; its transcript rises during seed after-ripening, and its
  overexpression relieves DELLA repression of germination. Single gid1b mutants have no obvious
  phenotype, but GID1B contributes, redundantly with GID1A, to stamen elongation, male fertility
  and seed set, and the gid1a gid1b gid1c triple mutant is a GA-insensitive dwarf.'
