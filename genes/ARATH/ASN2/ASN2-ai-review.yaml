- id: PMID:22789031
  title: Arabidopsis thaliana ASN2 encoding asparagine synthetase is involved in the control of nitrogen
    assimilation and export during vegetative growth.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cache is abstract-only or bibliographic; exact access limitations are retained in the
      annotation reasons. PMID9881155 complements a yeast asparagine auxotroph with ASN2/ASN3 and identifies
      the glutamine-binding architecture. This supports the conserved glutamine-hydrolyzing ASNS class,
      but is not a purified donor-selectivity measurement. Full22789031 publisher text was inspected at
      https://onlinelibrary.wiley.com/doi/full/10.1111/j.1365-3040.2012.02576.x : native knockout/knockdown,
      phloem-companion-cell immunolocalization and15N remobilization support asparagine synthesis. Its
      recombinant Cys2Gly protein was an antibody antigen, not a native glutaminase kinetic assay. The
      proposed GABA-shunt compensation is a metabolite-based interpretation, not measured flux. Salt response21478030
      remains contextual. Full30664249 publisher text was inspected; target-specific SG supplement download
      returned403, so ASN2 sequestration remains unresolved here, without asserting absence.'
  findings:
  - statement: ASN2 directly supplies asparagine for plant nitrogen allocation.
    supporting_text: 'The asn2 mutant leaves

      displayed a depleted asparagine'
