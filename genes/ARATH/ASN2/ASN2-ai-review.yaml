  label: Arabidopsis thaliana
description: ASN2 is a glutamine-dependent asparagine synthetase that couples ATP-dependent amidation
  of aspartate to glutamine hydrolysis. It supplies asparagine for nitrogen assimilation and redistribution
  during vegetative growth, with prominent expression in leaf phloem companion cells and contributions
  to nitrogen metabolism under salt stress.
