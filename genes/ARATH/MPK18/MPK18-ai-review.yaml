suggested_questions:
- question: Does MPK18 phosphorylate microtubule-associated proteins directly, and which proteins are
    its substrates?
- question: Is MKKK20-to-MPK18 phosphorylation a genuine MAPKK-independent route in vivo, or does another
    MKK activate MPK18 in planta? This decides whether the MAPK cascade (GO:0000165) term applies.
- question: Are the MPK18-specific findings (PHS1 regulation, the microtubule phenotype) shared by MPK19
    and MPK20, which sit in different PANTHER subfamilies?
suggested_experiments:
- hypothesis: MPK18 is a catalytically active MAP kinase once its TDY motif is phosphorylated.
  description: Activate recombinant MPK18 with MKKK20 (or a constitutively active upstream kinase), then
    measure phosphorylation of MBP and of candidate MAPs. Include a kinase-dead K54R or D151A MPK18 control.
- hypothesis: MPK18 phosphorylates specific microtubule-associated proteins in vivo.
  description: Run phosphoproteomics on wild-type and mpk18 seedlings treated with oryzalin, and test
    the candidates with in vitro MPK18 kinase assays and phospho-site mutant complementation.
knowledge_gaps:
- gap_statement: No substrate of MPK18 is known, and its kinase activity has not been demonstrated biochemically.
    The mechanism by which it modulates microtubule stability is therefore unknown.
  gap_kind:
  - BIOLOGY
