- term:
    id: GO:0043622
    label: cortical microtubule organization
  evidence_type: IMP
  original_reference_id: PMID:19392697
  qualifier: acts_upstream_of_or_within
  review:
    summary: IMP cortical microtubule organization from mpk18 mutant phenotypes.
    action: MODIFY
    reason: 'The mutant evidence is sound: mpk18 seedlings have defects in microtubule-related functions
      and moderately stabilized microtubules, and mpk18 partially suppresses phs1-1 root phenotypes. MPK18
      is a signalling kinase, and the authors propose a PHS1-MPK18 phosphorylation switch that regulates
      cortical microtubule functions. It modulates microtubule organization or dynamics rather than doing
      the assembly or arrangement itself. GO has no regulation-of-cortical-microtubule-organization term,
      so the closest regulatory term is proposed. The direction of regulation, and whether MPK18 acts
      through microtubule-associated proteins, are not known.'
    proposed_replacement_terms:
    - id: GO:0070507
      label: regulation of microtubule cytoskeleton organization
    supported_by:
    - &id009
      reference_id: PMID:19392697
      supporting_text: Mutant mpk18 seedlings show defects in microtubule-related functions, and have
        moderately stabilized microtubules.
    - &id010
      reference_id: PMID:19392697
      supporting_text: We propose a model whereby the PHS1-MPK18 signalling module is involved in a phosphorylation/dephosphorylation
        switch that regulates cortical microtubule functions.
    - *id006
