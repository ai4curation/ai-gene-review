- term:
    id: GO:0004707
    label: MAP kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003527
  - EC:2.7.11.24
  review:
    summary: IEA (InterPro/EC combined) assignment of MAP kinase activity.
    action: ACCEPT
    reason: 'MPK18 belongs to the MAP kinase subfamily of CMGC kinases (PANTHER PTHR24055:SF420), carries
      the catalytic Asp151, the ATP-binding Lys54 and the TDY activation-loop motif, and MKKK20 phosphorylates
      its TXY motif in vitro (PMID:28848569). This is a strong family-level inference and is retained
      as the core activity. It is, however, inferred: recombinant MPK18 showed no autophosphorylation
      and did not phosphorylate MBP in the only published kinase assay, and no MPK18 substrate is known,
      so the catalytic activity itself has not been experimentally shown for MPK18.'
    supported_by:
    - *id001
    - &id002
      reference_id: file:ARATH/MPK18/MPK18-uniprot.txt
      supporting_text: The TXY motif contains the threonine and tyrosine residues whose phosphorylation
        activates the MAP kinases.
    - &id003
      reference_id: PMID:28848569
      supporting_text: MPK18 activation loop phosphorylation by MKKK20 as observed with an anti-p-ERK
        antibody
    - reference_id: PMID:28848569
      supporting_text: MPK18 alone did not display autophosphorylation activity but was a good substrate
        for the MKKK20
