id: Q9C5C0
gene_symbol: MPK18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: MPK18 (At1g53510) is a group D (TDY-motif) mitogen-activated protein kinase of Arabidopsis
  thaliana, a CMGC-family serine/threonine protein kinase with an N-terminal kinase domain and a long,
  partly disordered C-terminal extension. It is regulated by two partners. The dual-specificity MAPK phosphatase
  PHS1 binds MPK18 in the cytoplasm and dephosphorylates it. The MAP kinase kinase kinase MKKK20 binds
  MPK18 and phosphorylates its activation loop directly, apparently without a MAP kinase kinase intermediate.
  mpk18 mutants have moderately stabilized cortical microtubules and altered root growth and skewing on
  microtubule-disrupting drugs, and loss of MPK18 partially suppresses phs1 root phenotypes. Together
  these data place MPK18 in a phosphorylation switch that regulates cortical microtubule functions. Its
  catalytic activity is inferred from family membership and conserved catalytic residues; no MPK18 substrate
  has yet been identified. GFP-MPK18 is found in the cytoplasm and nucleus.
