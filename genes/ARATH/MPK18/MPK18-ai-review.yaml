    summary: IBA intracellular signal transduction from PTN000622075.
    action: ACCEPT
    reason: The PAINT node covers MAP kinases from yeasts to plants, and MPK18 is inside that clade with
      intact kinase motifs. Experimentally, MPK18 is phosphorylated on its activation loop by MKKK20 and
      dephosphorylated by PHS1, consistent with acting as a signalling kinase within the cell. This is
