core_functions:
- description: Inferred serine/threonine MAP kinase activity. MPK18 is activated by phosphorylation of
    its TDY activation-loop motif, which MKKK20 phosphorylates directly, and is inactivated by dephosphorylation
    by PHS1. The catalytic activity and substrates have not been demonstrated experimentally.
