  review:
    summary: Electronic inference of MAPK cascade from the MAP kinase activity term.
    action: UNDECIDED
    reason: 'GO:0000165 is defined as a three-tier MAP3K -> MAP2K -> MAPK cascade. For MPK18 no activating
      MAPKK is known: MKK3 neither interacts with nor phosphorylates MPK18, while MKKK20 binds and phosphorylates
      MPK18 directly, which the authors interpret as a non-canonical module that bypasses the MAPKK tier
      (PMID:28848569). Family membership makes cascade participation plausible, but the only experimental
      pathway data for MPK18 do not fit the term definition, so the claim can be neither accepted nor
      rejected on current evidence.'
    supported_by:
    - reference_id: PMID:28848569
      supporting_text: a non-canonical MAPK cascade made of MKKK20 and MPK18 that bypasses the need for
        an MKK intermediate
    - reference_id: PMID:28848569
      supporting_text: When incubated together, MKK3 and MPK18 did not show any reciprocal kinase activity
        nor did they phosphorylate MBP
