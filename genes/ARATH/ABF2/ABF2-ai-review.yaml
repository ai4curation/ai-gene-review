  review:
    summary: ABF2 participates in ABA-responsive transcription during vegetative drought
      responses.
    action: ACCEPT
    reason: 'Induction and transactivation are supported by primary studies; activated AREB1
      enhances drought tolerance and a dominant repressor reduces dehydration survival. These
      results support the process without claiming that a single abf2 null always has a drought
      defect: PMID:15361142 reported no such single-mutant defect in its conditions.'
