- id: PMID:15361142
  title: ABF2, an ABRE-binding bZIP factor, is an essential component of glucose signaling
    and its overexpression affects multiple stress tolerance.
  findings:
  - statement: ABF2 single-mutant glucose defects are distinct from ABF3/4 stress
      phenotypes; overexpression effects do not establish obligatory single-gene drought
      function.
    supporting_text: ABF2 overexpression promoted glucose-induced inhibition of seedling
      development, whereas its mutation impaired glucose response.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ABF2 single-mutant glucose defects are distinct from ABF3/4 stress
      phenotypes; overexpression effects do not establish obligatory single-gene drought
      function.
- id: PMID:15516505
  title: ARIA, an Arabidopsis arm repeat protein interacting with a transcriptional
    regulator of abscisic acid-responsive gene expression, is a novel abscisic acid
    signaling component.
