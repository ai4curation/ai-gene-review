id: Q9M7Q4
gene_symbol: ABF2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ABF2 (AREB1) is a nuclear group-A bZIP transcription factor in Arabidopsis
  that binds ABA-responsive elements in target promoters. ABA-dependent multisite
  phosphorylation, including phosphorylation by SnRK2 kinases, activates its
  transcriptional output. It contributes to vegetative drought responses through
  ABA-responsive gene expression and also regulates glucose responses and specific
  leaf-senescence and root-response targets. Its activities overlap with other ABF/AREB
  factors, so stress phenotypes depend on tissue, activation state and genetic background.
  ABF2 activates transcription of genes such as RD29B, TPPE and chlorophyll-catabolic
  regulators.
