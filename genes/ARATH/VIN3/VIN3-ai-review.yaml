- term:
    id: GO:0140006
    label: histone H3 reader activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT4G30200
  - PANTHER:PTN008198652
  review:
    summary: IBA histone H3 reader activity for the VEL clade, seeded from VEL1 (AT4G30200).
    action: REMOVE
    reason: >-
      Direct structural and biophysical work contradicts this for VIN3. Crystal structures show that the
      VEL PHD finger is part of a tripartite PHD superdomain with no canonical three-pronged histone-binding
      pocket. ITC and NMR detected no binding of the Arabidopsis VIN3 PHD superdomain, or of its minimal
      PHD finger, to unmodified or modified H3 tails. An earlier pull-down result suggesting H3 binding
      is superseded by these quantitative assays. VIN3 is therefore outside the clade that inherited H3-reader
      activity, despite the PHD signature.
    supported_by:
    - reference_id: PMID:36174674
      supporting_text: >-
        This VEL PHD superdomain neither binds to unmodified nor variously modified histone H3 tails,
        as demonstrated by isothermal calorimetry and NMR spectroscopy.
    - reference_id: PMID:36174674
      supporting_text: >-
        Indeed, using ITC and NMR spectroscopy, we were unable to detect binding of the purified VIN3
        PHD superdomain nor of its minimal PHD finger to various modified and unmodified histone H3 tail
        peptides.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008198652
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          VEL-clade node; H3-reader IBD seeded only from VEL1 (AT4G30200). Structural and ITC/NMR data
          show the VEL PHD superdomain, including that of At VIN3, does not bind H3 tails.
      - source_id: AGI_LocusCode:AT4G30200
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          VEL1 seed; the H3-binding claim for VEL PHD fingers rests on earlier pull-down assays that later
          quantitative ITC/NMR could not reproduce for VIN3.
