- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  evidence_type: IDA
  original_reference_id: PMID:40858112
  review:
    summary: >-
      VIN3 VEL-domain head-to-tail polymerization assembles dynamic biomolecular condensates (in heterologous
      cells) and higher-order nuclear VIN3 assemblies in planta that are required for efficient H3K27me3
      nucleation.
    action: NEW
    reason: >-
      Molecular condensate scaffold activity describes how the VEL domain works: it self-assembles and
      recruits PRC2 accessories into multivalent assemblies. Polymerization-blocking mutations abolish
      FLC silencing.
    supported_by:
    - reference_id: PMID:36351412
      supporting_text: >-
        VEL proteins contain a domain related to an atypical four-helix bundle that engages in spontaneous
        concentration-dependent head-to-tail polymerization to assemble dynamic biomolecular condensates.
    - reference_id: PMID:40858112
      supporting_text: >-
        We show that VIN3 VEL polymerization produces higher-order nuclear VIN3 assemblies in vivo, which
        promote multivalent chromatin association and efficient H3K27me3 nucleation.
    - reference_id: PMID:36351412
      supporting_text: >-
        Mutations blocking polymerization of this VEL domain prevent Polycomb silencing at FLC.
