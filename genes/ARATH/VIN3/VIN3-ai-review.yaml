- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IMP
  original_reference_id: PMID:19392705
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Hypoxia induces VIN3, and vin3 seedlings survive 72 h of low oxygen less well; complementation rescues
      this.
    action: KEEP_AS_NON_CORE
    reason: >-
      The survival phenotype is real and was complemented, but the mechanism is unknown, and loss of VIN3
      does not change the known hypoxia-responsive transcripts. This is a secondary stress role, separate
      from VIN3's core role in FLC silencing.
    supported_by:
    - reference_id: PMID:19392705
      supporting_text: >-
        Without VIN3 activity, fewer seedlings survived following a 72-h period of hypoxic treatment,
        indicating that VIN3 is required for the survival of Arabidopsis thaliana in response to hypoxic
        stress.
