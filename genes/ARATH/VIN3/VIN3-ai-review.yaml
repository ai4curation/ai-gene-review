id: Q9FIE3
gene_symbol: VIN3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  VIN3 (VERNALIZATION INSENSITIVE 3) is a nuclear PHD-superdomain/fibronectin III/VEL-domain protein of
  Arabidopsis whose transcription is induced only slowly during prolonged cold. This makes VIN3 accumulation
  a molecular readout of the length of winter. VIN3 forms a heterodimer with its constitutively expressed
  paralog VRN5/VIL1 and joins a PHD-PRC2 complex (VRN2, SWN/CLF, FIE, MSI1, VRN5, VEL1) at a small nucleation
  region near the first exon-intron boundary of the floral repressor FLC. There it is required for histone
  deacetylation and local H3K27me3 nucleation, which switches FLC alleles into a metastable silenced state
  that is later spread and maintained by other Polycomb factors. Its VEL domain undergoes head-to-tail
  polymerization that builds dynamic nuclear assemblies, and this is needed for multivalent chromatin
  association and efficient nucleation. Its PHD superdomain does not bind histone H3 tails. VIN3 also
  contributes to survival under hypoxia.
