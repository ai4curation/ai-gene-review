id: Q9SR52
gene_symbol: URE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  URE (At1g67550) is the single urease of Arabidopsis thaliana, an 838-residue
  single-chain enzyme in which the regions corresponding to the bacterial urease
  gamma, beta and alpha subunits are fused into one polypeptide that assembles into a
  homo-oligomer (hexamer by similarity to jack bean urease). It is a nickel
  metalloenzyme with a carbamylated-lysine-bridged dinickel active site that hydrolyses
  urea to ammonia and bicarbonate in the cytosol. Urea arises in plants from arginine
  catabolism (arginase), from non-enzymatic decay of ureide intermediates of purine
  catabolism, and from external sources, so urease is required for nitrogen recycling
  and for growth on urea as sole nitrogen source. URE is synthesized as an inactive
  apoenzyme and requires the three plant urease accessory proteins URED, UREF and UREG
  (plants lack UreE) for nickel insertion and activation; it forms a
  urease-UreD-UreF-UreG activation complex in planta, and full activation in vivo is
  slow and limited by nickel availability.
