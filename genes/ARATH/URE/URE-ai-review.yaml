- term:
    id: GO:0150006
    label: urease activator complex
  evidence_type: IPI
  original_reference_id: PMID:16244137
  qualifier: part_of
  review:
    summary: URE is the client protein in the plant urease activation complex; Myrach
      et al. 2017 co-purified a urease-UreD-UreF-UreG complex from plants and mapped its
      stepwise assembly, with UreD as the accessory protein that binds urease directly.
    action: KEEP_AS_NON_CORE
    reason: The cited Witte 2005 paper is abstract-only in our cache, but the
      urease-UreD-UreF-UreG complex is independently demonstrated by PMID:28710280, and
      the GO term definition cites both papers. URE is the client of the activation
      complex rather than an activator subunit; its membership is real but transient
      (activator subunits dissociate before catalysis), so it is kept as non-core for
      URE, whose core function is urea hydrolysis.
    supported_by:
    - reference_id: PMID:28710280
      supporting_text: Using affinity pulldowns of Strep-tagged UAPs from Arabidopsis
        and rice transiently expressed in planta , we demonstrate that a urease–UreD–UreF–UreG
        complex exists in plants and show its stepwise assembly.
    - reference_id: PMID:28710280
      supporting_text: When studying the binding of urease to the UAPs, a direct interaction
        with urease was only observed for UreD but not for UreF or UreG ( lanes 20–22
        ).
