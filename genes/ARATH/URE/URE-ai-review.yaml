- id: PMID:28710280
  title: The assembly of the plant urease activation complex and the essential role
    of the urease accessory protein G (UreG) in delivery of nickel to urease.
  findings:
  - statement: A urease-UreD-UreF-UreG activation complex exists in plants; UreD is
      the accessory protein that binds urease directly.
    supporting_text: Using affinity pulldowns of Strep-tagged UAPs from Arabidopsis
      and rice transiently expressed in planta , we demonstrate that a urease–UreD–UreF–UreG
      complex exists in plants and show its stepwise assembly.
  - statement: In vivo urease activation takes days after nickel supply.
    supporting_text: These data show that in vivo the process of urease activation is
      rather a matter of days than of hours.
  reference_review:
