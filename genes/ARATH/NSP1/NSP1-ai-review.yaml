- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: HDA
  original_reference_id: PMID:27729395
  qualifier: enables
  review:
    summary: >-
      High-throughput mRNA interactome capture from etiolated seedlings. It
      identified more than 700 proteins, many of them enzymes without known RNA
      biology. The cached reference is abstract-only, so NSP1's inclusion and
      confidence tier cannot be checked.
    action: UNDECIDED
    reason: >-
      There is no biological or structural reason to expect mRNA binding by a
      Kelch/jacalin specifier protein. Capture of abundant metabolic enzymes in
      interactome screens often does not reflect a physiological RNA-binding
      function. Without the full text and supplementary tables, the capture
      evidence for NSP1 cannot be judged, so the annotation is left undecided
      rather than removed. It is not a core function in any case.
    supported_by:
    - reference_id: PMID:27729395
      supporting_text: Other At-RBP set proteins include major signaling proteins,
        cytoskeleton-associated proteins, membrane transporters, and enzymes,
        suggesting the scope and function of RNA-protein interactions within a plant
        cell is much broader than previously appreciated.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT1G54040
  - PANTHER:PTN002355837
  review:
    summary: >-
      IBA from the specifier-protein node PTN002355837. The sole experimental donor
      is ESP (AT1G54040), whose nuclear pool depends on interaction with WRKY53.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only grounding for this node is ESP's WRKY53-dependent nuclear import. In
      wrky53 knockout cells ESP is exclusively cytoplasmic. That is a conditional,
      interaction-specific localization of one paralog, not an ancestral property
      of the family. No WRKY53 interaction or nuclear localization has been
      reported for NSP1. Proteomics places NSP1 in the cytosol, where it meets
      myrosinase-released aglucones. The nucleus is therefore an over-propagation
      to NSP1. The action is MARK_AS_OVER_ANNOTATED rather than REMOVE because a
      minor nuclear pool of a soluble ~50 kDa protein cannot be excluded.
    supported_by:
    - reference_id: PMID:17369373
      supporting_text: ESR is exclusively in the cytoplasm in W53-KO cells,
        indicating that ESR is brought to the nucleus by the interaction
    - reference_id: PMID:25293756
      supporting_text: we identified hundreds of cytosolic proteins that appeared to
        exist as components of stable protein complexes
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002355837
