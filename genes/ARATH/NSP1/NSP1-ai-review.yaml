- term:
    id: GO:0030246
    label: carbohydrate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR033734
  review:
    summary: >-
      InterPro2GO mapping from the plant jacalin-like lectin domain (IPR033734) in
      the N-terminal ~145 residues of NSP1 (JAL28). This is separate from the
      specifier activity, which lies in the Kelch propeller. ESP lacks the JAL
      domain yet has the same class of activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Structurally plausible: NSP1 has a jacalin beta-prism domain, and jacalin
      domains typically bind mannose or galactose. Sugar binding by NSP1 has not
      been tested, and its authors state the domain's role is unknown. The domain is
      not required for nitrile-specifier activity, since ESP and NSP5 lack it. The
      domain-based inference is kept as non-core, pending experimental glycan
      binding data.
    supported_by:
    - reference_id: PMID:30395611
      supporting_text: In addition, AtNSP1 possesses an N-terminal JAL domain
    - reference_id: PMID:19224919
      supporting_text: Although Kelch repeats are involved in protein-protein
        interactions ( 24 ) and lectins are known to bind carbohydrates ( 40 ), the
        role of these domains in AtESP and homologous proteins is not yet known.
