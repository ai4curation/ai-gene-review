- id: PMID:31850033
  title: Glucosinolate Content in Dormant and Germinating Arabidopsis thaliana Seeds
    Is Affected by Non-Functional Alleles of Classical Myrosinase and Nitrile-Specifier
    Protein Genes.
  findings:
  - statement: >-
      nsp1 mutants have altered glucosinolate content in seeds and during
      germination, which suggests a role in glucosinolate turnover.
    supporting_text: The time course of total glucosinolate content during ten days
      of germination depended on functional NSP1.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. The abstract describes glucosinolate-content
      phenotypes, not germination or dormancy phenotypes.
- id: PMID:27990154
  title: NSP-Dependent Simple Nitrile Formation Dominates upon Breakdown of Major Aliphatic
    Glucosinolates in Roots, Seeds, and Seedlings of Arabidopsis thaliana Columbia-0.
  findings:
  - statement: >-
      NSP1 provides most nitrile-forming activity in seedlings and, with NSP3, in
      roots of Col-0.
    supporting_text: simple nitrile formation upon tissue disruption depended almost
      entirely on NSP2 in seeds and mainly on NSP1 in seedlings.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available.
- id: PMID:28479247
  title: Crystal structure of the nitrile-specifier protein NSP1 from Arabidopsis thaliana.
  findings:
  - statement: >-
      Crystal structure of AtNSP1. Docking suggests that R292 contributes to its
      nitrile-only product specificity.
    supporting_text: we solved the crystal structure of the NSP1 protein from
      Arabidopsis thaliana (AtNSP1).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache (PDB 5GQT).
- id: PMID:30900313
  title: 'Structural diversification during glucosinolate breakdown: mechanisms of thiocyanate,
    epithionitrile and simple nitrile formation.'
  findings:
  - statement: >-
      Specifier proteins are proposed to be Fe(2+)-dependent lyases. NSPs form simple
      nitriles irrespective of side chain, and AtNSP1 is a monomer.
    supporting_text: NSPs promote simple nitrile formation irrespective of the
      glucosinolate side chain
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available.
- id: PMID:30395611
  title: Iron is a centrally bound cofactor of specifier proteins involved in glucosinolate
    breakdown.
  findings:
  - statement: >-
      Iron is bound by specifier proteins through an EXXXDXXXH triad. This was shown
      for the paralog At3g16390 (called AtNSP3 here), not directly for NSP1. The
      paper notes AtNSP1's N-terminal JAL domain.
    supporting_text: In addition, AtNSP1 possesses an N-terminal JAL domain
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available. Its AtNSP3 is At3g16390, a tandem paralog. The iron triad
      of Q9SDM9 (E386/D390/H394 in UniProt) is inferred by similarity.
- id: PMID:17369373
  title: The antagonist function of Arabidopsis WRKY53 and ESR/ESP in leaf senescence
    is modulated by the jasmonic and salicylic acid equilibrium.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      About the paralog ESP. Cited only to show that the ESP nuclear localization
      behind the IBA nucleus annotation depends on WRKY53.
suggested_questions:
- question: >-
    Does the N-terminal jacalin-related lectin domain of NSP1 bind carbohydrates
    (or glycosylated myrosinase), and does it contribute to capturing the aglucone
    by bringing NSP1 close to myrosinase?
- question: >-
    Is NSP1 truly Fe(II)-dependent in vivo? Recombinant NSP1 was insensitive to EDTA
    in one study, while paralogs bind iron through a conserved EXXXDXXXH triad.
- question: >-
    Is the seed and germination glucosinolate phenotype of nsp1 a direct turnover role
    of NSP1 in intact tissue, or an indirect result of feedback on hydrolytic enzymes?
suggested_experiments:
- description: >-
    Glycan-array or affinity binding assays with the isolated NSP1 JAL domain, and
    pull-down/proximity labelling with TGG1/TGG2 and PYK10-type myrosinases, to test
    lectin function and myrosinase association.
- description: >-
    ICP-MS/Ferene S iron quantification and E386Q/D390N/H394A mutagenesis of purified
    NSP1, to confirm the iron cofactor and its requirement for nitrile formation.
- description: >-
    Germination-rate and dormancy assays (after-ripening, stratification response)
    on nsp1 alleles and complemented lines, to test whether any developmental phenotype
    exists beyond altered glucosinolate content.
