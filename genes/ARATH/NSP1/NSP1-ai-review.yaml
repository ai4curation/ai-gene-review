proposed_new_terms:
- proposed_name: nitrile-forming thiohydroximate-O-sulfate sulfolyase activity
  proposed_definition: >-
    Catalysis of the reaction: a (Z)-N-(sulfonatooxy)alkanimidothioate (a
    glucosinolate aglucone) = a nitrile + sulfur + sulfate (EC 4.8.1.5;
    RHEA:59956). Converts myrosinase-released glucosinolate aglucones to simple
    nitriles instead of isothiocyanates.
  justification: >-
    Nitrile-specifier proteins are characterized catalysts with a curated EC number
    and Rhea reaction. GO has no term below carbon-sulfur lyase activity
    (GO:0016846) for this reaction. It is the sister activity of the
    epithionitrile-forming (ESP) and thiocyanate-forming (TFP) sulfolyases proposed
    in those reviews.
  proposed_parent:
    id: GO:0016846
    label: carbon-sulfur lyase activity
