core_functions:
- description: >-
    NSP1 is a nitrile-forming specifier protein, a carbon-sulfur lyase. It acts in
    the cytosol on the thiohydroximate-O-sulfate aglucone released by myrosinase
    and converts it to a simple nitrile with release of sulfur and sulfate
    (EC 4.8.1.5). It does this with aliphatic, aromatic and indolic
    glucosinolates, but it does not form epithionitriles or thiocyanates. It is the
    main source of constitutive and herbivore-induced simple-nitrile formation in
    Col-0 rosette leaves and of nitrile formation in seedlings and roots.
