gene_symbol: NSP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  NSP1 (nitrile-specifier protein 1; At3g16400; also called JAL28, and AtNSP3 in
  the nomenclature of Kissen and Bones) is a cytosolic specifier protein of the
  glucosinolate-myrosinase defence system. It has two parts: an N-terminal
  jacalin-related lectin (JAL) domain with a beta-prism fold, and a C-terminal
  Kelch-repeat six-bladed beta-propeller that carries the active site, including a
  predicted EXXXDXXXH-type iron-binding triad. The protein is a monomer. NSP1 has
  no activity on intact glucosinolates. After tissue damage it acts on the unstable
  aglucone released by myrosinase and converts it to a simple nitrile (with release
  of sulfur and sulfate; EC 4.8.1.5) instead of the default isothiocyanate. It does
  this with aliphatic, aromatic (benzyl) and indolic glucosinolates, but it does not
  form epithionitriles or thiocyanates. In Columbia-0, which lacks functional ESP in
  leaves, NSP1 accounts for most constitutive simple-nitrile formation in rosette
  leaves and for the rise in nitrile formation after feeding by Pieris rapae
  larvae; its transcript is induced by that herbivory. It is also the main
  nitrile-forming activity in seedlings and, together with NSP3, in roots. nsp1
  mutants show altered glucosinolate content in seeds and during germination,
  which suggests an additional role in glucosinolate turnover. No function of the
  lectin domain, such as carbohydrate or myrosinase binding, has been demonstrated
  experimentally.
