- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:21655959
  qualifier: located_in
  review:
    summary: >-
      Simkin et al. 2011 expressed YFP fusions of the periwinkle and Arabidopsis enzymes in
      Catharanthus roseus cells: PMK and MVD were peroxisomal, MVK was cytosolic, and the
      Arabidopsis sequences gave the same result. Cho et al. 2022 confirmed a cytosolic YFP
      signal for Arabidopsis MK in Arabidopsis protoplasts.
    action: MODIFY
    reason: >-
      The assay reported a cytosolic signal, so this row's own evidence supports the more
      specific GO:0005829 cytosol, a part_of descendant of cytoplasm that the gene already
      carries (HDA, IBA). The cytoplasm term loses the distinction that matters here, because
      the next two enzymes of the pathway are reported in peroxisomes, which are also part of the
      cytoplasm.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    supported_by:
    - reference_id: PMID:21655959
      supporting_text: while MVK was cytosolic. These compartmentalisation results were confirmed
        using the Arabidopsis thaliana MVK, PMK and MVD sequences fused to YFP.
    - reference_id: PMID:35064110
      supporting_text: we expressed a YFP fluorophore tagged version of MVK in Arabidopsis
        protoplasts, MVK was confined to the cytosol
