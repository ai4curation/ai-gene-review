suggested_questions:
- question: >-
    Does P2K1 phosphorylation of MK at Ser329/Thr342 change its kinetic constants (kcat, Km for
    mevalonate or ATP) or its sensitivity to feedback inhibition by prenyl diphosphates, and is
    this regulation relevant outside the extracellular-ATP response?
- question: >-
    mvk mutants lose the extracellular-ATP calcium response and show altered defence and
    anthocyanin responses; which downstream isoprenoid (sterol, cytokinin, prenylated protein)
    mediates each effect? These phenotypes describe what MK supplies, not steps MK performs, so
    they do not by themselves justify process annotations to signalling or defence.
- question: >-
    Should the UniProt subcellular-location keyword for P46086 be Cytosol (SL-0091) rather than
    Cytoplasm (SL-0086), given two independent YFP studies showing a cytosolic signal?
suggested_experiments:
- hypothesis: >-
    P2K1 phosphorylation increases MK catalytic efficiency rather than only its amount or
    stability.
  description: >-
    Steady-state kinetics (mevalonate and ATP) of recombinant MK, phosphomimetic S329D/T342D and
    phospho-null S329A/T342A variants, and MK pre-phosphorylated by the P2K1 kinase domain,
    with feedback-inhibition curves for GPP and FPP.
  experiment_type: enzyme kinetics
