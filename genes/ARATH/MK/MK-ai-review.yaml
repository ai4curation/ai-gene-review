gene_symbol: MK
aliases:
- MVK
- At5g27450
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  MK (At5g27450) is the single mevalonate kinase of Arabidopsis thaliana, a 378-residue
  GHMP-family kinase that phosphorylates (R)-mevalonate with ATP to give (R)-mevalonate
  5-phosphate. This is the first of the three ATP-dependent steps that convert mevalonate to
  isopentenyl diphosphate in the mevalonate pathway, which supplies the precursors of sterols,
  brassinosteroids, triterpenes, sesquiterpenes, dolichols and protein prenyl groups. The cDNA
  was isolated by complementing the yeast erg12 mevalonate kinase mutation, and the recombinant
  protein converts mevalonate to mevalonate 5-phosphate. MK is a soluble cytosolic enzyme, in
  contrast to the downstream phosphomevalonate kinase and diphosphomevalonate decarboxylase,
  which are reported in peroxisomes. The gene is expressed throughout the plant, most strongly in
  roots and inflorescences. Loss-of-function mvk mutants accumulate mevalonate, have less
  mevalonate 5-phosphate and isopentenyl diphosphate, and are small with short roots;
  mevalonate 5-phosphate partly rescues their growth. MK binds the plasma-membrane
  extracellular-ATP receptor P2K1, which phosphorylates it on Ser329 and Thr342 and raises its
  activity, linking purinergic signalling to isoprenoid supply. mvk mutants lose the
  ATP-induced calcium response and show altered pathogen defence and sucrose-induced
  anthocyanin accumulation, effects attributed to downstream isoprenoid metabolites.
