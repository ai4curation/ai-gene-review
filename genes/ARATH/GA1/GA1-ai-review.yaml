  review:
    summary: Mg2+ binding by CPS. Class II diterpene cyclases use a DXDD general acid rather than a Mg2+-dependent
      diphosphate ionization, but AtCPS activity depends on and is regulated by Mg2+ (synergistic substrate
      inhibition with GGPP).
    action: KEEP_AS_NON_CORE
    reason: Mg2+ binding is real and has a regulatory role (feed-forward inhibition at high plastid Mg2+),
      but it is a cofactor/regulatory property rather than the core catalytic function, which is ent-CPP
      synthase activity.
    supported_by:
    - reference_id: PMID:17384166
      supporting_text: demonstrating that Mg(2+) and GGPP exert synergistic substrate inhibition effects
        on CPS activity
    - reference_id: PMID:20430888
      supporting_text: Notably, this residue is conserved as a histidine in enzymes involved in gibberellin
        biosynthesis
