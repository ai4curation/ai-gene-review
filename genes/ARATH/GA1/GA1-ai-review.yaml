id: Q38802
gene_symbol: GA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GA1 (ent-copalyl diphosphate synthase, CPS; At4g02780) is a plastid-targeted class II diterpene
  cyclase of the terpene synthase family that catalyses the protonation-initiated cyclization of (E,E,E)-geranylgeranyl
  diphosphate to ent-copalyl diphosphate, the first committed step of gibberellin biosynthesis. Catalysis
  uses a DXDD motif as general acid in an active site at the interface of the beta and gamma domains;
  activity is inhibited synergistically by Mg2+ and GGPP, a property suggested to limit flux into the
  GA pathway when plastid Mg2+ rises during de-etiolation. The enzyme is imported into chloroplasts/plastids,
  and its promoter is active mainly in provascular tissue of germinating seeds and in growing organs.
  ga1 null mutants (e.g. ga1-3) are severely GA-deficient, non-germinating, male-sterile dwarfs rescued
  by exogenous GA.
