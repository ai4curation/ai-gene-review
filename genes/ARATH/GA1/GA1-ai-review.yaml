  review:
    summary: Terpene synthase activity propagated at a PANTHER node shared by CPS and KS. In GO, terpene
      synthase activity is classified under lyase activity (diphosphate-releasing class I cyclases), whereas
      ent-CPP synthase is a class II cyclase classified as an intramolecular isomerase (EC 5.5.1.13) and
      is not a descendant of GO:0010333.
    action: MODIFY
    reason: The GO definition of terpene synthase activity (cyclization of linear prenyl diphosphates)
      loosely covers CPS, but its placement under lyase activity misrepresents the class II isomerase
      chemistry; the precise term GO:0009905 should be used.
    proposed_replacement_terms:
    - id: GO:0009905
      label: ent-copalyl diphosphate synthase activity
    supported_by:
    - reference_id: PMID:20430888
      supporting_text: Class II diterpene cyclases mediate the acid-initiated cycloisomerization reaction
        that serves as the committed step in biosynthesis of the large class of labdane-related diterpenoid
        natural products, which includes the important gibberellin plant hormones.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001272394
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node spanning CPS and KS clades; terpene synthase activity (a lyase-branch term) fits
          the class I KS descendants, while the CPS descendants are class II isomerases better described
          by GO:0009905.
      - source_id: AGI_LocusCode:AT1G79460
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: GA2/KS, a genuine class I ent-kaurene synthase (terpene synthase activity), is the Arabidopsis
          seed; its chemistry differs from CPS.
