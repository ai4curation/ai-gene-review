suggested_questions:
- question: Is CPS the main flux-controlling step of GA biosynthesis in vivo, and how important is Mg2+/GGPP
    substrate inhibition relative to transcriptional control of GA1?
- question: How is ent-CPP or a downstream early intermediate moved from provascular cells (where GA1
    is expressed) to the cortex/endodermis cells that express late GA biosynthetic genes in germinating
    seeds?
suggested_experiments:
- description: Express GA1 variants with altered Mg2+ sensitivity (His/Arg switch residue) in the ga1-3
    background and measure GA levels and de-etiolation phenotypes to test the physiological relevance
    of Mg2+ inhibition.
