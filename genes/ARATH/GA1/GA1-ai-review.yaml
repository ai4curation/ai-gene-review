- description: Plastid class II diterpene cyclase that converts (E,E,E)-geranylgeranyl diphosphate to
    ent-copalyl diphosphate (RHEA:14841), the first committed step of gibberellin biosynthesis; activity
    is feed-forward limited by Mg2+/GGPP substrate inhibition.
