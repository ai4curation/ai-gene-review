id: P37271
gene_symbol: PSY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PSY (PSY1, At5g17230) is the single phytoene synthase of Arabidopsis thaliana,
  a nuclear-encoded, plastid-imported enzyme of the phytoene/squalene synthase
  family (EC 2.5.1.32). It catalyses the first committed step of carotenoid
  biosynthesis, the head-to-head condensation of two molecules of the C20
  isoprenoid geranylgeranyl diphosphate via prephytoene diphosphate to give the
  C40 carotene 15-cis-phytoene and two diphosphate. Phytoene is then desaturated,
  isomerised and cyclised by PDS, Z-ISO, ZDS, CRTISO and the lycopene cyclases
  to the carotenes and xanthophylls that serve as photosynthetic accessory
  pigments and photoprotectants and as precursors of abscisic acid and
  strigolactones. PSY is synthesised as a 422-residue precursor with an
  N-terminal chloroplast transit peptide and functions as a peripheral
  membrane protein of the chloroplast; active PSY is membrane associated and
  its in vitro activity depends on a supply of GGPP from a separate GGPP
  synthase. PSY is the main flux-controlling enzyme of the pathway: seed- or
  tissue-specific overexpression drives massive carotenoid accumulation in
  non-photosynthetic tissues, whereas leaf carotenoid content is buffered. The
  amount and activity of PSY protein are regulated post-transcriptionally: the
  ORANGE proteins OR and OR-like bind PSY directly and are required to maintain
  active PSY protein levels, and FIBRILLIN6 binds PSY and stimulates its
  catalytic activity in chloroplasts, especially during de-etiolation and
  high-light acclimation.
existing_annotations:
- term:
    id: GO:0004311
    label: geranylgeranyl diphosphate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR044843
  review:
    summary: >-
      InterPro2GO transfer from IPR044843 (trans-isoprenyl diphosphate synthases,
      bacterial-type), a superfamily-level entry whose GO mapping describes the
      head-to-tail prenyl elongation (FPP + IPP -> GGPP) carried out by GGPP
      synthases. PSY is a head-to-head condensing enzyme that consumes GGPP as
      its substrate; it does not synthesise GGPP.
    action: REMOVE
    reason: >-
      The mapped activity is that of a different enzyme class within the
      isoprenoid synthase fold. The Rhea reaction curated for P37271 (RHEA:34475,
      2 GGPP = 15-cis-phytoene + 2 diphosphate) has GGPP as substrate, not
      product, and the direct Arabidopsis assay in PMID:25675505 had to add
      recombinant GGPP synthase because PSY in chloroplast membranes cannot make
      GGPP itself. This is an over-broad InterPro family mapping assigning a
      paralogous activity the protein does not have.
    supported_by:
    - reference_id: PMID:25675505
      supporting_text: Here PSY activity was exclusively found membrane bound and required addition of active GGPP synthase for in vitro assay.
    - reference_id: PMID:26224804
      supporting_text: The first committed step in the carotenoid biosynthesis pathway is the condensation of two geranylgeranyl diphosphate molecules to phytoene catalyzed by phytoene synthase (PSY).
    - reference_id: file:ARATH/PSY/PSY-uniprot.txt
      supporting_text: Xref=Rhea:RHEA:34475, ChEBI:CHEBI:27787,
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: InterPro:IPR044843
        source_label: Trans-isoprenyl diphosphate synthases, bacterial-type
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The entry spans head-to-tail prenyltransferases (true GGPP synthases)
          and head-to-head synthases (squalene/phytoene synthases); the GO:0004311
          mapping is correct for the former and wrong for PSY.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25675505
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8VYD8
  review:
    summary: >-
      Direct physical interaction of PSY with the ORANGE protein AtOR (At5g61670,
      UniProtKB:Q8VYD8) shown by co-IP/MS, split-ubiquitin yeast two-hybrid,
      co-IP in N. benthamiana and BiFC in chloroplasts. OR and OR-like act as
      post-transcriptional regulators that maintain the level of enzymatically
      active PSY.
    action: REMOVE
    reason: >-
      The interaction is real and biologically important, but a bare protein
      binding term carries no functional information about PSY. On the PSY side
      the interaction represents PSY being stabilised/regulated; the paper
      explicitly states that OR proteins are not molecular chaperones, so no more
      informative molecular-function term (e.g. chaperone binding) is licensed for
      PSY from this evidence. The informative annotation belongs on OR (the
      regulator). Removal does not deny the interaction.
    supported_by:
    - reference_id: PMID:25675505
      supporting_text: Both Arabidopsis OR proteins interacted directly with PSY ( Fig. 1 A ).
    - reference_id: PMID:25675505
      supporting_text: Although the OR proteins carry a DnaJ cysteine-rich zinc figure domain, they are not molecular chaperones due to the lack of the DnaJ-like defining J domain.
