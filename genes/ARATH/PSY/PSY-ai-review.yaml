- term:
    id: GO:0010287
    label: plastoglobule
  evidence_type: IDA
  original_reference_id: PMID:23023170
  qualifier: located_in
  review:
    summary: >-
      Transiently expressed At-PSY-RFP in cowpea leaf protoplasts localised to
      fixed speckles attached to thylakoid/prolamellar-body regions; the speckles
      were identified as plastoglobules by co-localisation with a maize fibrillin
      (shown directly for maize PSY2/PSY3 and extended to the Arabidopsis
      protein). The authors note that PSY had not been detected in any
      sub-plastid proteome at the time.
    action: KEEP_AS_NON_CORE
    reason: >-
      A genuine direct observation, but from an overexpressed fluorescent fusion
      in a heterologous protoplast, and the assignment of the puncta to
      plastoglobules rests on co-localisation with a fibrillin marker. Later work
      shows that PSY-GFP forms identical puncta together with FBN6, a protein
      that proteomics places in thylakoid and envelope membranes rather than
      plastoglobules, and envelope proteome studies detect PSY. The membrane-associated pool (chloroplast membrane, peripheral) is the functionally
      characterised location; plastoglobule association is plausible but
      unresolved, so the row is retained as a non-core, uncertain sub-plastid
      location rather than accepted as the core site of activity.
    supported_by:
    - reference_id: PMID:23023170
      supporting_text: Arabidopsis PSY localized to plastoglobules (as did maize PSY2 and 3 and rice PSY1, 2, and 3).
    - reference_id: PMID:23023170
      supporting_text: Merging of both signals confirmed colocalization of PSYs with Zm-PG2; thus, we consider the speckles to be plastoglobuli.
    - reference_id: PMID:37966976
      supporting_text: FBN6 is the only FBN enriched in purified envelope fractions where PSY is also found (Ferro et al. 2010; Bouchnak et al. 2019).
    knowledge_gaps:
    - gap_statement: >-
        The sub-plastid compartment in which Arabidopsis PSY is catalytically
        active (plastoglobule, envelope membrane, or thylakoid-associated
        membrane) has not been resolved by fractionation of native, untagged
        protein.
      boundary: >-
        PSY is unambiguously chloroplast-localised, its activity is recovered
        from chloroplast membrane fractions and requires membrane association,
        and fluorescent fusions form puncta that co-localise with a plastoglobule
        fibrillin in one study and with the non-plastoglobule FBN6 in another.
      provenance:
      - reference_id: PMID:23023170
        supporting_text: Chloroplast suborganellar localization of the key pathway enzyme, PSY , has yet to be detected by proteomic analysis.
      - reference_id: PMID:25675505
        supporting_text: Here PSY activity was exclusively found membrane bound and required addition of active GGPP synthase for in vitro assay.
