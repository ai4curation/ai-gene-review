core_functions:
- description: >-
    15-cis-phytoene synthase activity: head-to-head condensation of two
    (2E,6E,10E)-geranylgeranyl diphosphate molecules via prephytoene
    diphosphate to 15-cis-phytoene and two diphosphate (phytoene biosynthesis),
    the committed step that channels plastidial GGPP into carotene and
    carotenoid biosynthesis. Active as a peripheral membrane-associated enzyme
    in the chloroplast, dependent on GGPP supplied by a separate GGPP synthase,
    stabilised by the OR/OR-like proteins and catalytically stimulated by FBN6.
  molecular_function:
    id: GO:0046905
    label: 15-cis-phytoene synthase activity
