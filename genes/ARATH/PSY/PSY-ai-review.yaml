suggested_questions:
- question: >-
    In which chloroplast sub-compartment is native Arabidopsis PSY catalytically
    active - the envelope membrane, thylakoid-associated membrane domains, or
    plastoglobules? Fluorescent fusions form puncta that co-localise with a
    plastoglobule fibrillin in one study and with the non-plastoglobule protein
    FBN6 in another, while envelope proteomics detects PSY and activity is
    recovered only from membrane fractions.
  experts:
  - plastid proteomics groups
  - carotenoid biochemistry groups
- question: >-
    Does the OR/OR-like-PSY interaction act by holding PSY in a folded,
    membrane-competent state (holdase-like activity), and should OR therefore
    carry a molecular-function term such as protein stabilisation or unfolded
    protein binding, rather than the interaction being recorded as bare protein
    binding on PSY?
  experts:
  - GO curators for plastid proteostasis
  - OR/Clp protease biochemists
- question: >-
    By what mechanism does FBN6 increase PSY turnover without changing PSY
    abundance or protease accessibility - product (phytoene) removal via its
    lipocalin motif, substrate channelling from GGPP synthase, or altered
    membrane partitioning?
  experts:
  - carotenoid enzymology groups
suggested_experiments:
- hypothesis: >-
    Native PSY is enriched in the chloroplast envelope rather than in
    plastoglobules.
  description: >-
    Immunoblot untagged PSY across purified envelope, thylakoid, stroma and
    plastoglobule fractions from wild-type Arabidopsis chloroplasts (with
    fibrillin, TIC/TOC and LHC markers), alongside in vitro phytoene synthase
    assays of each fraction supplemented with recombinant GGPP synthase, to
    assign the catalytically active pool to a defined sub-compartment.
  experiment_type: subcellular fractionation with activity assay
- hypothesis: >-
    FBN6 stimulates PSY catalysis directly by relieving product inhibition or
    accelerating phytoene release.
  description: >-
    Reconstitute purified recombinant mature PSY with and without FBN6 in
    liposomes and measure steady-state kinetics (kcat, Km for GGPP) and phytoene
    partitioning into the lipid phase; compare with a lipocalin-motif mutant of
    FBN6 and with the bacterial CrtB control, which FBN6 does not stimulate.
  experiment_type: in vitro enzyme kinetics with reconstituted proteins
