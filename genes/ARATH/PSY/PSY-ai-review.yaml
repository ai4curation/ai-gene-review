- id: PMID:37966976
  title: Arabidopsis FIBRILLIN6 influences carotenoid biosynthesis by directly promoting
    phytoene synthase activity.
  findings:
  - statement: FBN6 co-immunoprecipitates with PSY.
    supporting_text: Arabidopsis FBN6 was found to be among the proteins co-immunoprecipitated with a GFP-tagged version of phytoene synthase (PSY), the first and main rate-determining enzyme of the carotenoid pathway (Welsch et al. 2018).
    reference_section_type: INTRODUCTION
  - statement: PSY is detected in envelope proteomes together with FBN6.
    supporting_text: FBN6 is the only FBN enriched in purified envelope fractions where PSY is also found (Ferro et al. 2010; Bouchnak et al. 2019).
    reference_section_type: INTRODUCTION
  - statement: PSY-GFP forms puncta in chloroplasts.
    supporting_text: When analyzing the co-immunoprecipitation assays, we noticed that the PSY-GFP protein concentrated in fluorescent dots within chloroplasts (Fig. 2A).
    reference_section_type: RESULTS
  - statement: FBN6 and PSY co-localise in chloroplasts.
    supporting_text: indicating that FBN6 and PSY co-localize within chloroplasts, as expected for interacting proteins.
    reference_section_type: RESULTS
  - statement: Arabidopsis PSY complements a crtB-deficient E. coli carotenoid operon and is stimulated by FBN6.
    supporting_text: Strains co-transformed with such constructs harboring Arabidopsis PSY and FBN6 sequences were found to produce significantly more β-carotene than those expressing only PSY or co-expressing PSY and FBN4 (Fig. 3, B and C), despite that PSY protein levels remained very similar in all the cases (Fig. 3D).
    reference_section_type: RESULTS
  - statement: PSY expression produces phytoene in planta, enhanced by FBN6.
    supporting_text: While phytoene was not detected in control or FBN6 samples, it was present in PSY samples, and it increased in samples agroinfiltrated with both FBN6 and PSY (Fig. 4A).
    reference_section_type: RESULTS
  - statement: FBN6 binds PSY to promote its enzymatic activity.
    supporting_text: our data support the conclusion that FBN6 plays a physiologically relevant role in carotenoid biosynthesis in Arabidopsis chloroplasts by physically binding to PSY to promote its enzymatic activity.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; source of the FBN6 IPI and a chloroplast IDA row, and an
      independent demonstration of P37271 phytoene synthase activity by bacterial
      complementation.
