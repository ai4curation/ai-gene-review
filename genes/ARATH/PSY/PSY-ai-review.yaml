- term:
    id: GO:0051996
    label: squalene synthase [NAD(P)H] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR033904
  review:
    summary: >-
      InterPro2GO transfer from IPR033904 (trans-isoprenyl diphosphate synthases,
      head-to-head), the domain shared by squalene synthase and phytoene
      synthase. Squalene synthase condenses two FPP molecules and reduces the
      presqualene intermediate with NAD(P)H; PSY condenses two GGPP molecules to
      15-cis-phytoene with no reductive step.
    action: REMOVE
    reason: >-
      The mapping assigns the activity of the sterol-pathway paralog to a
      carotenoid-pathway enzyme. PSY's substrate is C20 GGPP (not C15 FPP), its
      product is the C40 carotene phytoene (not the C30 triterpene squalene), and
      RHEA:34475 involves no NAD(P)H. The shared head-to-head fold does not imply
      shared substrate specificity or the reductase half-reaction.
    supported_by:
    - reference_id: PMID:12805607
      supporting_text: Phytoene synthase catalyzes the dimerization of two molecules of geranylgeranyl pyrophosphate to phytoene and has been shown to be rate limiting for the synthesis of carotenoids.
    - reference_id: file:ARATH/PSY/PSY-uniprot.txt
      supporting_text: Xref=Rhea:RHEA:34475, ChEBI:CHEBI:27787,
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: InterPro:IPR033904
        source_label: Trans-isoprenyl diphosphate synthases, head-to-head
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The domain is genuinely present in PSY, but the GO:0051996 mapping
          describes the squalene synthase members of the domain family, not the
          phytoene synthases.
