- id: PMID:12805607
  title: Seed-specific overexpression of an endogenous Arabidopsis phytoene synthase
    gene results in delayed germination and increased levels of carotenoids, chlorophyll,
    and abscisic acid.
  findings:
  - statement: Phytoene synthase condenses two GGPP molecules to phytoene and is rate limiting for carotenoid synthesis.
    supporting_text: Phytoene synthase catalyzes the dimerization of two molecules of geranylgeranyl pyrophosphate to phytoene and has been shown to be rate limiting for the synthesis of carotenoids.
    reference_section_type: ABSTRACT
  - statement: Seed-specific overexpression of the endogenous Arabidopsis PSY gene strongly increases seed carotenoids.
    supporting_text: In the present paper, we show that seed-specific overexpression of an endogenous Arabidopsis phytoene synthase gene results in significant increases of the levels of β-carotene, luteins, and violaxanthin.
    reference_section_type: DISCUSSION
  - statement: The overexpressed gene is the At5g17230 phytoene synthase cDNA of Scolnik and Bartley.
    supporting_text: An endogenous phytoene synthase was sequenced and cloned by RT-PCR from Arabidopsis homologous to the gene cloned by Scolnik and Bartley ( 1994 ).
    reference_section_type: METHODS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; the gene overexpressed is the endogenous Arabidopsis PSY
      (At5g17230). Supports the IMP carotenoid biosynthesis row and the TAS
      activity statement. Germination and ABA phenotypes are downstream
      consequences.
