- id: PMID:23023170
  title: Plastid localization of the key carotenoid enzyme phytoene synthase is altered
    by isozyme, allelic variation, and activity.
  findings:
  - statement: Arabidopsis has a single PSY.
    supporting_text: Arabidopsis has only one At-PSY.
    reference_section_type: RESULTS
  - statement: Transiently expressed PSY fusions form speckles interpreted as plastoglobules.
    supporting_text: These PSYs localized to chloroplasts in specific fixed speckles, distributed inside the plastid and attached to areas that displayed red chlorophyll fluorescence indicative of prolamellar bodies or thylakoids.
    reference_section_type: RESULTS
  - statement: Speckles assigned to plastoglobules by co-localisation with a maize fibrillin.
    supporting_text: Merging of both signals confirmed colocalization of PSYs with Zm-PG2; thus, we consider the speckles to be plastoglobuli.
    reference_section_type: RESULTS
  - statement: The authors extend plastoglobule localisation to Arabidopsis PSY.
    supporting_text: Arabidopsis PSY localized to plastoglobules (as did maize PSY2 and 3 and rice PSY1, 2, and 3).
    reference_section_type: DISCUSSION
  - statement: Sub-plastid location of PSY had not been detected by proteomics.
    supporting_text: Chloroplast suborganellar localization of the key pathway enzyme, PSY , has yet to be detected by proteomic analysis.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. The Arabidopsis PSY-RFP fusion was expressed in cowpea
      protoplasts (heterologous host); the plastoglobule assignment relies on
      co-localisation with a fibrillin marker and is in tension with later
      envelope-proteome and FBN6 co-localisation data.
- id: PMID:25675505
  title: Arabidopsis OR proteins are the major posttranscriptional regulators of phytoene
    synthase in controlling carotenoid biosynthesis.
  findings:
  - statement: PSY catalyses the committed step of carotenoid biosynthesis.
    supporting_text: Phytoene synthase (PSY) catalyzes the first committed step in carotenoid biosynthesis and controls carbon flux into the carotenoid biosynthetic pathway
    reference_section_type: INTRODUCTION
  - statement: PSY localises exclusively to chloroplasts.
    supporting_text: Among these proteins, PSY was the only one exclusively localized in chloroplasts as shown in a previous report ( 27 ) and the current study ( SI Appendix , Fig. S1 ).
    reference_section_type: RESULTS
  - statement: PSY interacts directly with AtOR and AtOR-like.
    supporting_text: Both Arabidopsis OR proteins interacted directly with PSY ( Fig. 1 A ).
    reference_section_type: RESULTS
  - statement: PSY activity is measurable in isolated chloroplast membranes and is increased by OR overexpression.
    supporting_text: PSY activity was about 50% higher in the AtOR -overexpressing lines than in WT.
    reference_section_type: RESULTS
  - statement: PSY-GFP is active in vivo, doubling phytoene in norflurazon-treated seedlings.
    supporting_text: Overexpression of PSY – GFP led to about a twofold increase of phytoene in NFZ-treated etiolated seedlings ( Fig. 4 C ), indicating that PSY – GFP functioned properly in the transgenic lines.
    reference_section_type: RESULTS
  - statement: Active PSY is membrane bound and depends on a separate GGPP synthase for substrate.
    supporting_text: Here PSY activity was exclusively found membrane bound and required addition of active GGPP synthase for in vitro assay.
    reference_section_type: DISCUSSION
  - statement: OR proteins are not molecular chaperones.
    supporting_text: Although the OR proteins carry a DnaJ cysteine-rich zinc figure domain, they are not molecular chaperones due to the lack of the DnaJ-like defining J domain.
    reference_section_type: DISCUSSION
  - statement: OR and OR-like are redundantly required for PSY protein accumulation.
    supporting_text: The results indicated that AtOR and AtOR-like were sufficient and required to regulate PSY protein levels in vivo, and that AtOR and AtOR-like were functionally redundant.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; the primary experimental source for the IDA activity,
      process and localisation rows and for the UniProt EC/Rhea assignment.
