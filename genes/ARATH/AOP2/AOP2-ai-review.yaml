  review:
    summary: Heterologously expressed AOP2 (thioredoxin fusion in E. coli), assayed with 2-oxoglutarate
      and ascorbate, converted 3-methylsulfinylpropyl and 4-methylsulfinylbutyl glucosinolates to allyl
      and 3-butenyl glucosinolates.
    action: ACCEPT
    reason: Correct and experimentally supported. GO has no specific term for the alkenyl glucosinolate-forming
      reaction, so the 2-oxoglutarate-dependent dioxygenase activity class term is the most specific existing
      MF term; a more precise new term is proposed (see proposed_new_terms). The assay included 2-oxoglutarate,
      and the protein contains the conserved Fe(II)/2OG-binding residues of the 2OG-FeII oxygenase domain.
    supported_by:
    - reference_id: PMID:11251105
