id: Q945B5
gene_symbol: AOP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: AOP2 (ALKENYL HYDROXALKYL PRODUCING 2; At4g03060) is an Fe(II)- and 2-oxoglutarate-dependent
  dioxygenase (2-ODD) that catalyzes a side-chain modification in methionine-derived (aliphatic) glucosinolate
  biosynthesis, converting methylsulfinylalkyl glucosinolates into alkenyl glucosinolates (e.g. 3-methylsulfinylpropyl
  to allyl/2-propenyl glucosinolate, and 4-methylsulfinylbutyl glucoraphanin to 3-butenyl glucosinolate).
  It underlies the GS-ALK locus. AOP2 arose by tandem duplication with AOP3, which instead forms hydroxyalkyl
  glucosinolates, and the two are expressed in a mutually exclusive manner across accessions. This entry
  is the functional allele from the Cape Verde Islands (Cvi) accession (432 aa, AOP2-1); the Columbia
  allele carries a 5-bp deletion causing a frameshift and a non-functional truncated protein, so Col-0
  accumulates methylsulfinylalkyl glucosinolates. AOP2 is expressed most strongly in leaves and stems
  in a light-dependent manner, and its activity shapes the glucosinolate profile and thus the isothiocyanate
  breakdown products that mediate defense against herbivores.
