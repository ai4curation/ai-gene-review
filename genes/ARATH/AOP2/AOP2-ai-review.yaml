core_functions:
- description: The functional AOP2 allele represented by Q945B5 catalyzes Fe(II)/2-oxoglutarate-dependent
    conversion of methylsulfinylalkyl glucosinolates to alkenyl glucosinolates, including allyl and 3-butenyl
    products. This activity is not attributed to the frameshifted, nonfunctional endogenous Col-0 allele.
  proposed_molecular_function: alkenyl glucosinolate synthase activity
  directly_involved_in:
  - id: GO:0019761
    label: glucosinolate biosynthetic process
  supported_by:
  - reference_id: PMID:11251105
    supporting_text: This finding shows that AOP2 is capable of catalyzing the GS-ALK reaction with both
      the 3-methylsulfinylalkyl and 4-methylsulfinylalkyl glucosinolates.
  - reference_id: PMID:20699011
    supporting_text: showed that the AOP2-2 allele catalysed the conversion of the two precursor methylsulfinylalkyl
      glucosinolates to 2-propenyl and 3-butenyl glucosinolates
proposed_new_terms:
- proposed_name: alkenyl glucosinolate synthase activity
  proposed_definition: Catalysis of the Fe(II)- and 2-oxoglutarate-dependent conversion of an omega-(methylsulfinyl)alkyl
    glucosinolate to the corresponding omega-alkenyl glucosinolate with loss of the methylsulfinyl group,
    e.g. 3-methylsulfinylpropyl glucosinolate to allyl (2-propenyl) glucosinolate, or 4-methylsulfinylbutyl
    glucosinolate (glucoraphanin) to 3-butenyl glucosinolate (gluconapin).
  justification: AOP2 (GS-ALK) has a biochemically demonstrated, substrate-defined activity that determines
    alkenyl glucosinolate accumulation across Arabidopsis accessions and Brassica crops (BoGSL-ALK), but
    GO only offers the generic class term GO:0016706. The paralog AOP3 forms hydroxyalkyl glucosinolates
    from the same substrates, so a specific term would distinguish these neofunctionalized duplicates.
    Should be placed under 2-oxoglutarate-dependent dioxygenase activity (GO:0016706).
  proposed_parent:
    id: GO:0016706
    label: 2-oxoglutarate-dependent dioxygenase activity
  supported_by:
  - reference_id: PMID:11251105
    supporting_text: induced AOP2 bacterial extracts catalyzed the conversion of the 3-methylsulfinylpropyl
      to the allyl glucosinolate and the 4-methylsulfinylbutyl to the 3-butenyl glucosinolate
  - reference_id: PMID:20699011
    supporting_text: The AOP2 homologue (BoGSL-ALK) from collard (Brassica oleracea) has been cloned and
      characterised and it was found that the gene product is able to catalyse the conversion of methylsulfinylalkyl
      glucosinolate to the alkenyl form in planta
