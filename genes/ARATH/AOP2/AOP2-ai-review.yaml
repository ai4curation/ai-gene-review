core_functions:
- description: >-
    Fe(II)/2-oxoglutarate-dependent conversion of methylsulfinylalkyl glucosinolates
    (3-methylsulfinylpropyl, 4-methylsulfinylbutyl) to the corresponding alkenyl
    glucosinolates (allyl/2-propenyl, 3-butenyl) in aliphatic glucosinolate side-chain
    modification. No GO term exists for this specific reaction; the general
    2-oxoglutarate-dependent dioxygenase activity (GO:0016706) is annotated in GOA.
  proposed_molecular_function: alkenyl glucosinolate synthase activity
  directly_involved_in:
  - id: GO:0019761
    label: glucosinolate biosynthetic process
  supported_by:
  - reference_id: PMID:11251105
    supporting_text: >-
      This finding shows that AOP2 is capable of catalyzing the GS-ALK reaction with both
      the 3-methylsulfinylalkyl and 4-methylsulfinylalkyl glucosinolates.
  - reference_id: PMID:20699011
    supporting_text: >-
      showed that the AOP2-2 allele catalysed the conversion of the two precursor
      methylsulfinylalkyl glucosinolates to 2-propenyl and 3-butenyl glucosinolates
proposed_new_terms:
- proposed_name: alkenyl glucosinolate synthase activity
  proposed_definition: >-
    Catalysis of the Fe(II)- and 2-oxoglutarate-dependent conversion of an
    omega-(methylsulfinyl)alkyl glucosinolate to the corresponding omega-alkenyl
    glucosinolate with loss of the methylsulfinyl group, e.g. 3-methylsulfinylpropyl
    glucosinolate to allyl (2-propenyl) glucosinolate, or 4-methylsulfinylbutyl
    glucosinolate (glucoraphanin) to 3-butenyl glucosinolate (gluconapin).
  justification: >-
    AOP2 (GS-ALK) has a biochemically demonstrated, substrate-defined activity that
    determines alkenyl glucosinolate accumulation across Arabidopsis accessions and
    Brassica crops (BoGSL-ALK), but GO only offers the generic class term GO:0016706.
    The paralog AOP3 forms hydroxyalkyl glucosinolates from the same substrates, so a
    specific term would distinguish these neofunctionalized duplicates. Should be placed
    under 2-oxoglutarate-dependent dioxygenase activity (GO:0016706).
  proposed_parent:
    id: GO:0016706
    label: 2-oxoglutarate-dependent dioxygenase activity
  supported_by:
  - reference_id: PMID:11251105
    supporting_text: >-
      induced AOP2 bacterial extracts catalyzed the conversion of the
      3-methylsulfinylpropyl to the allyl glucosinolate and the 4-methylsulfinylbutyl to
      the 3-butenyl glucosinolate
  - reference_id: PMID:20699011
    supporting_text: >-
      The AOP2 homologue (BoGSL-ALK) from collard (Brassica oleracea) has been cloned and
      characterised and it was found that the gene product is able to catalyse the
      conversion of methylsulfinylalkyl glucosinolate to the alkenyl form in planta
references:
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA rules assign 2-oxoglutarate-dependent dioxygenase activity and
      glucosinolate biosynthetic process, both consistent with experimental evidence.
- id: PMID:11251105
  title: 'Gene duplication in the diversification of secondary metabolism: tandem
    2-oxoglutarate-dependent dioxygenases control glucosinolate biosynthesis in Arabidopsis.'
  findings:
  - statement: Identifies AOP2 and AOP3 as tandem 2-ODDs at the GS-AOP locus; AOP2
      expressed in E. coli converts 3-methylsulfinylpropyl and 4-methylsulfinylbutyl
      glucosinolates to allyl and 3-butenyl glucosinolates; Col-0 carries a frameshifted
      non-functional AOP2; no ecotype co-expresses AOP2 and AOP3.
    supporting_text: >-
      we show that AOP2 catalyzes the conversion of methylsulfinylalkyl glucosinolates to
      alkenyl glucosinolates
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; source of IDA MF and BP annotations.
- id: PMID:20699011
  title: 'The characterisation of AOP2: a gene associated with the biosynthesis of aliphatic
    alkenyl glucosinolates in Arabidopsis thaliana.'
  findings:
  - statement: Defines three AOP2 alleles (AOP2-1 Cvi/St, AOP2-2 Pi, AOP2-3 Col/Ler with
      5-bp frameshift); AOP2 is light-regulated and most expressed in leaf and stem;
      overexpression of AOP2-2 in Col-0 converts methylsulfinylalkyl glucosinolates to
      2-propenyl and 3-butenyl glucosinolates in planta.
    supporting_text: >-
      The over-expression of a functional AOP2 allele was found to successfully convert
      the precursor methylsulfinyl alkyl glucosinolate into the alkenyl form.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; in planta confirmation of AOP2 activity.
- id: PMID:20303821
  title: Biosynthesis of glucosinolates--gene discovery and beyond.
  findings:
  - statement: Review placing AOP2 in the side-chain decoration phase of glucosinolate
      biosynthesis.
    supporting_text: >-
      Recent progress includes genes in all three phases of the pathway, i.e. side-chain
      elongation of precursor amino acids, formation of the core glucosinolate structure
      and side-chain decoration.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only review, used for pathway context.
suggested_questions:
- question: What is the chemical mechanism and by-product of AOP2-catalyzed alkenyl
    formation (loss of methanesulfenic acid?), and does AOP2 retain the canonical
    hydroxylation chemistry of 2-ODDs as a cryptic activity?
- question: Which active-site residues distinguish AOP2 (alkenyl-forming) from AOP3
    (hydroxyalkyl-forming), given that the two arose by recent tandem duplication?
- question: Does AOP2 have glucosinolate-independent regulatory effects (e.g. on
    jasmonate signaling, circadian or flowering-time traits) reported for AOP2 alleles,
    and are they mediated by its enzymatic products?
suggested_experiments:
- description: Purify recombinant AOP2 and AOP3 and perform steady-state kinetics with
    C3-C8 methylsulfinylalkyl glucosinolates, including product and by-product
    identification by LC-MS, to define specificity and mechanism.
- description: Swap residues between AOP2 and AOP3 guided by homology models or crystal
    structures to identify determinants of alkenylation versus hydroxylation.
- description: Complement a Col-0 background (non-functional AOP2) with catalytically
    dead AOP2 (Fe-binding His mutants) versus wild-type AOP2 to separate enzymatic from
    possible non-enzymatic effects on glucosinolate accumulation and downstream traits.
