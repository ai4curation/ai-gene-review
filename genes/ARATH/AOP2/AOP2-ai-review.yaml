suggested_questions:
- question: What is the chemical mechanism and by-product of AOP2-catalyzed alkenyl formation (loss of
    methanesulfenic acid?), and does AOP2 retain the canonical hydroxylation chemistry of 2-ODDs as a
    cryptic activity?
- question: Which active-site residues distinguish AOP2 (alkenyl-forming) from AOP3 (hydroxyalkyl-forming),
    given that the two arose by recent tandem duplication?
- question: AOP2 expression raises MYB28/MYB29 transcripts and alters jasmonate signaling independently
    of MYB28/MYB29 (PMID:25758208), and AOP2 alters flowering time in a background-dependent way (PMID:26442014).
    Are these effects mediated by alkenyl glucosinolates or their breakdown products, or by the AOP2 protein
    itself?
suggested_experiments:
- description: Purify recombinant AOP2 and AOP3 and perform steady-state kinetics with C3-C8 methylsulfinylalkyl
    glucosinolates, including product and by-product identification by LC-MS, to define specificity and
    mechanism.
- description: Swap residues between AOP2 and AOP3 guided by homology models or crystal structures to
    identify determinants of alkenylation versus hydroxylation.
- description: Complement a Col-0 background (non-functional AOP2) with catalytically dead AOP2 (Fe-binding
    His mutants) versus wild-type AOP2 to separate enzymatic from possible non-enzymatic effects on glucosinolate
    accumulation and downstream traits.
