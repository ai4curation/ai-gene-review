id: Q945B5
gene_symbol: AOP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  AOP2 (ALKENYL HYDROXALKYL PRODUCING 2; At4g03060) is an Fe(II)- and
  2-oxoglutarate-dependent dioxygenase (2-ODD) that catalyzes a side-chain modification
  in methionine-derived (aliphatic) glucosinolate biosynthesis, converting
  methylsulfinylalkyl glucosinolates into alkenyl glucosinolates (e.g.
  3-methylsulfinylpropyl to allyl/2-propenyl glucosinolate, and 4-methylsulfinylbutyl
  glucoraphanin to 3-butenyl glucosinolate). It underlies the GS-ALK locus. AOP2 arose by
  tandem duplication with AOP3, which instead forms hydroxyalkyl glucosinolates, and the
  two are expressed in a mutually exclusive manner across accessions. This entry is the
  functional allele from the Cape Verde Islands (Cvi) accession (432 aa, AOP2-1); the
  Columbia allele carries a 5-bp deletion causing a frameshift and a non-functional
  truncated protein, so Col-0 accumulates methylsulfinylalkyl glucosinolates. AOP2 is
  expressed most strongly in leaves and stems in a light-dependent manner, and its
  activity shapes the glucosinolate profile and thus the isothiocyanate breakdown
  products that mediate defense against herbivores.
existing_annotations:
- term:
    id: GO:0016706
    label: 2-oxoglutarate-dependent dioxygenase activity
  evidence_type: IDA
  original_reference_id: PMID:11251105
  qualifier: enables
  review:
    summary: >-
      Heterologously expressed AOP2 (thioredoxin fusion in E. coli), assayed with
      2-oxoglutarate and ascorbate, converted 3-methylsulfinylpropyl and
      4-methylsulfinylbutyl glucosinolates to allyl and 3-butenyl glucosinolates.
    action: ACCEPT
    reason: >-
      Correct and experimentally supported. GO has no specific term for the alkenyl
      glucosinolate-forming reaction, so the 2-oxoglutarate-dependent dioxygenase
      activity class term is the most specific existing MF term; a more precise new term
      is proposed (see proposed_new_terms). The assay included 2-oxoglutarate, and the
      protein contains the conserved Fe(II)/2OG-binding residues of the 2OG-FeII
      oxygenase domain.
    supported_by:
    - reference_id: PMID:11251105
      supporting_text: >-
        induced AOP2 bacterial extracts catalyzed the conversion of the
        3-methylsulfinylpropyl to the allyl glucosinolate and the 4-methylsulfinylbutyl
        to the 3-butenyl glucosinolate
    - reference_id: PMID:11251105
      supporting_text: >-
        with the addition of 200 mM sucrose and the use of 10 mM oxoglutarate and 10 mM
        ascorbate instead of 40 mM of each of these
