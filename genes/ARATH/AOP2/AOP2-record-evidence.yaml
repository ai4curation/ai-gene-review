unisave_records:
- entry_version: 46
  url: https://rest.uniprot.org/unisave/Q945B5?format=txt&versions=46
  entry_date: 24-JUN-2015, entry version 46.
  proteomes: []
  reference_proteome_keyword: false
  record_text: |
    CC   -!- CAUTION: AOP1, AOP2 and AOP3 are found in tandem and inverted
    CC       duplications on chromosome IV and encode 2-oxoglutarate-dependent
    CC       dioxygenases involved in glucosinolates biosynthesis. In cv.
    CC       Columbia, AOP2 (AC Q9ZTA2) cDNA contains a 5-bp deletion that
    CC       leads to a non-functional protein and AOP3 (AC Q9ZTA1) is not
    CC       expressed. The functional and expressed alleles for AOP2 (AC
    CC       Q945B5) and AOP3 (AC Q945B4) are found in cv. Cvi and cv.
    CC       Landsberg erecta, respectively. No ecotype coexpresses both AOP2
    CC       and AOP3 genes. The catalytic role of AOP1 is still uncertain
    CC       (PubMed:11251105). {ECO:0000305|PubMed:11251105}.
    CC   ---------------------------------------------------------------------------
