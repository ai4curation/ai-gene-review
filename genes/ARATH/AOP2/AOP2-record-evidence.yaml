reference_proteome_record:
  id: UP000006548
  description: "Arabidopsis thaliana (Mouse-ear cress) is a flowering plant belonging to the family Brassicaceae\
    \ which contains economically important brassica and mustard species. Arabidopsis thaliana was the first plant\
    \ to have its genome sequenced. \n\nArabidopsis thaliana is not of economic value itself, but has risen to prominence\
    \ because of its small size, short generation time and small genome, which make it an ideal plant to use for\
    \ research. \n\nThe Arabidopsis thaliana genome has a haploid chromosome number of 5, containing 135 Mb with\
    \ about 27,000 protein-coding genes encoding around 35,000 proteins. The reference proteome is derived from\
    \ the genome sequence published in 2000 for the ecotype Columbia (http://www.nature.com/nature/journal/v408/n6814/full/408796a0.html)."
