  - texts:
    - evidences:
      - evidenceCode: ECO:0000305
        source: PubMed
        id: '11251105'
      value: AOP1, AOP2 and AOP3 are found in tandem and inverted duplications on chromosome IV and encode 2-oxoglutarate-dependent
        dioxygenases involved in glucosinolates biosynthesis. In cv. Columbia, AOP2 (AC Q9ZTA2) cDNA contains a
        5-bp deletion that leads to a non-functional protein and AOP3 (AC Q9ZTA1) is not expressed. The functional
        and expressed alleles for AOP2 (AC Q945B5) and AOP3 (AC Q945B4) are found in cv. Cvi and cv. Landsberg erecta,
        respectively. No ecotype coexpresses both AOP2 and AOP3 genes. The catalytic role of AOP1 is still uncertain
        (PubMed:11251105)
    commentType: CAUTION
