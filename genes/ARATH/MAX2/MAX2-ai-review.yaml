gene_symbol: MAX2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'MORE AXILLARY GROWTH2 (MAX2; also ORE9, PPS, KAI1) is a nuclear F-box/leucine-rich-repeat
  protein that serves as the substrate-recognition subunit of an SCF(MAX2) E3 ubiquitin ligase (with ASK1/SKP1
  and CUL1). MAX2 is shared by two butenolide signalling pathways: with the strigolactone receptor D14
  it targets the SMXL6/SMXL7/SMXL8 transcriptional co-repressors for SL-induced polyubiquitination and
  proteasomal degradation, de-repressing BRC1 and suppressing axillary bud outgrowth; with the karrikin/KAI2-ligand
  receptor KAI2 it targets SMAX1 and SMXL2, controlling seed germination, seedling photomorphogenesis
  and leaf shape. MAX2 acts locally at the node, is expressed most highly in vasculature, and loss-of-function
  mutants are highly branched, have elongated hypocotyls, enhanced seed dormancy, delayed leaf senescence,
  altered auxin transport and drought hypersensitivity. Additional substrates (e.g. WRKY41 in freezing
  tolerance) have been proposed.'
