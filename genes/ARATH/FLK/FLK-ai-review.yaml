- term:
    id: GO:1990247
    label: N6-methyladenosine-containing RNA reader activity
  evidence_type: IDA
  original_reference_id: PMID:37050878
  review:
    summary: FLK recognizes an m6A-modified site in FLC mRNA.
    action: NEW
    reason: The primary abstract explicitly reports direct recognition of the m6A site in the FLC 3′ untranslated
      region, loss of FLC binding in the vir-1 writer mutant, and failure of the reader-defective FLK
      construct to rescue late flowering. These target-specific observations support modification-reader
      activity, not just generic KH-domain RNA binding. Normal PMID refresh and publisher HTML/PDF attempts
      did not recover the full article, so no uninspected assay details, mutant residues or quantitative
      specificity are asserted. GO:1990247 is a live adaptor-activity term with no is_a/part_of ancestry
      relationship to the existing mRNA-binding term; this single proposal adds modification-recognition
      coverage without proposing a redundant binding ancestor.
    supported_by:
    - &id004
      reference_id: PMID:37050878
      supporting_text: FLK as a novel mRNA m6A reader protein that directly binds the m6A site in the
        3'-untranslated region of FLC transcripts
