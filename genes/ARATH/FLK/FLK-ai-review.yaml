  label: Arabidopsis thaliana
description: 'FLOWERING LOCUS K (FLK) is a K-homology-domain RNA-binding protein found in the nucleus
  and cytoplasm. It promotes floral transition by post-transcriptionally repressing FLOWERING LOCUS C
  (FLC): FLK recognizes an N6-methyladenosine site in the FLC transcript 3′ untranslated region and affects
  transcript stability and splicing. FLK also associates with PEP, HUA1 and HEN4 in regulation of AGAMOUS
  pre-mRNA processing and floral organ identity. Its RNA-processing functions therefore extend beyond
  FLC, and its FLC RNA recognition is distinct from the FCA-associated COOLAIR pathway.'
