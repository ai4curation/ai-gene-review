- id: PMID:37050878
  title: FLK is an mRNA m(6)A reader that regulates floral transition by modulating the stability and
    splicing of FLC in Arabidopsis.
  findings:
  - statement: The primary abstract reports FLC 3′-UTR m6A-site recognition, vir-1-dependent binding and
      failed complementation by reader-defective FLK. These findings support m6A reader activity; full-text
      recovery remained unsuccessful in the PR follow-up.
    supporting_text: FLK as a novel mRNA m6A reader protein that directly binds the m6A site in the 3'-untranslated
      region of FLC transcripts
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Target-specific primary abstract explicitly supports modification-reader activity. Normal
      PMID force refresh returned abstract only; publisher HTML and PDF recovery attempts were blocked.
      The full assay methods and individual mutant residues were not inspected. Live GO:1990247 was verified
      independently, including its adaptor-branch ancestry.
