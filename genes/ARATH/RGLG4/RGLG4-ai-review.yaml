suggested_questions:
- question: >-
    Is RGLG4 itself (not only RGLG3) active with UBC30 in vitro on GRXS17, and is GRXS17
    turnover proteasome-dependent? If so, should RGLG4 carry proteasome-mediated
    ubiquitin-dependent protein catabolic process (GO:0043161)? No RGLG paralog currently
    carries that term despite comparable PP2CA-degradation evidence for RGLG1/RGLG5.
  experts:
  - Arabidopsis ubiquitin/E3 ligase biologists
  - TAIR curators
- question: >-
    What linkage types does RGLG4 form with its cognate E2s, given the hedged K48-only
    statement and the K63 activity of RGLG1/RGLG2 with UBC35/MMZ2?
  experts:
  - Ubiquitin biochemists
suggested_experiments:
- hypothesis: RGLG4 modulates JA signalling by ubiquitinating an as-yet unidentified negative regulator of the pathway.
  description: >-
    Substrate trapping (RING-dead RGLG4 TAP or TurboID) in MeJA- or wound-treated
    seedlings, followed by in vitro ubiquitination with UBC30 and stability assays of
    candidates in rglg3 rglg4 versus wild type.
- hypothesis: RGLG4 forms K48-linked chains exclusively.
  description: >-
    In vitro ubiquitination with UBC30 and other E2s (including UBC35/MMZ2) using
    lysine-less and single-lysine ubiquitin mutants, or linkage-specific antibodies/MS.
