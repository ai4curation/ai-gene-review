- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IMP
  original_reference_id: PMID:22898498
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      rglg3 rglg4 double mutants were more resistant to coronatine-secreting Pst DC3000;
      RGLG3/4 promote JA-mediated susceptibility.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      RGLG4 does not execute antibacterial defense; loss of RGLG3/RGLG4 increases
      resistance, because the pathogen's coronatine hijacks the JA pathway that RGLG3/4
      promote and JA antagonizes SA-dependent defense. The phenotype is a downstream
      organismal consequence of RGLG4's modulation of JA signalling (captured by
      GO:2000022) and of redundant double-mutant genetics, so a defense process term
      over-states RGLG4's direct role.
    supported_by:
    - reference_id: PMID:22898498
      supporting_text: rglg3 rglg4 was resistant to the coronatine-secreting pathogen Pseudomonas syringae pv tomato DC3000, suggesting that RGLG3 and RGLG4 acted in response to the coronatine and promoted JA-mediated pathogen susceptibility
