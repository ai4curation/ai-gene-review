  - reference_id: PMID:25788731
    supporting_text: RGLG3 and RGLG4 are localized in both the cytoplasm and nucleus
- description: >-
    Positive modulator, redundantly with RGLG3, of jasmonate signalling upstream of COI1,
    contributing to JA-dependent root growth inhibition, wound responses, coronatine
    responsiveness and FB1-triggered cell death; the ligase activity is required, but the
    JA-relevant substrates are unknown.
  molecular_function:
    id: GO:0061630
