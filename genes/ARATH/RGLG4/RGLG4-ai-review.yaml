gene_symbol: RGLG4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  RGLG4 (RING DOMAIN LIGASE 4, At1g79380) is a 401-residue soluble RING-type E3
  ubiquitin-protein ligase of the plant RGLG/copine-like family, built from a central
  von Willebrand factor A (VWFA) domain and a C-terminal C3HC4-type RING finger. It
  has in vitro E3 ligase activity, forms K48-type chains like its closest paralog RGLG3,
  and is distributed between the cytoplasm and the nucleus. RGLG4 and RGLG3 act
  redundantly as positive modulators of jasmonate (JA) signalling upstream of the
  COI1 receptor: rglg3 rglg4 double mutants show reduced JA- and coronatine-inhibited
  root growth, reduced JA-responsive and wound-responsive gene expression, reduced
  wound-induced JA biosynthesis, resistance to coronatine-producing Pseudomonas
  syringae, and reduced fumonisin B1-triggered programmed cell death, the last
  requiring an intact RING domain. RGLG3/RGLG4 work with the E2 UBC30 and
  mediate ubiquitination and degradation of the monothiol glutaredoxin GRXS17; the
  truncated hemoglobin GLB3 binds them but appears to inhibit rather than serve as a
  substrate. The substrates that link RGLG4 to JA signalling are unknown.
