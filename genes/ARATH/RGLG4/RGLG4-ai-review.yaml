core_functions:
- description: >-
    RING-type E3 ubiquitin-protein ligase that, with the E2 UBC30, ubiquitinates target
    proteins in the cytoplasm and nucleus; GRXS17 is an identified substrate degraded in
    an RGLG3/RGLG4-dependent manner. Ligase activity is shown experimentally for RGLG4
    itself; chain linkage is reported as K48-type for RGLG3/RGLG4, distinguishing them
    from the K63-forming, membrane-associated RGLG1/RGLG2.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0016567
    label: protein ubiquitination
