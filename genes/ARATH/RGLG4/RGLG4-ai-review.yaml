- term:
    id: GO:0009867
    label: jasmonic acid mediated signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:22898498
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Altered RGLG3/RGLG4 expression changes MeJA root inhibition and JA-induced gene
      expression in a COI1-dependent manner; the authors call RGLG3/4 upstream
      modulators of JA signalling.
    action: MODIFY
    reason: >-
      RGLG4 is not a component of the core COI1-JAZ-MYC pathway: it does not interact with
      COI1, AXR1, MYC2/3/4 or CYP94B3, and its ligase activity is proposed to act on an
      unidentified negative regulator. Its effect is to modulate the pathway, positively
      (overexpression enhances, the double mutant attenuates responses). GO has no
      "positive regulation" child of GO:2000022, so the replacement is GO:2000022
      regulation of jasmonic acid mediated signaling pathway.
    proposed_replacement_terms:
    - id: GO:2000022
      label: regulation of jasmonic acid mediated signaling pathway
    supported_by:
    - reference_id: PMID:22898498
      supporting_text: these results indicate that the ubiquitin ligases RGLG3 and RGLG4 are essential upstream modulators of JA signaling in response to various stimuli
    - reference_id: PMID:23073017
      supporting_text: RGLG3 and RGLG4 didn't interact with known key factors of the core JA pathway, rather, it might target on unknown protein that negatively regulated JA signaling
