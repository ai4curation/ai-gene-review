  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      rglg3 rglg4 reduced wound-stunted growth, wound-induced JA-responsive gene expression
      and wound-induced JA biosynthesis; RGLG4 expression responds to wounding.
    action: KEEP_AS_NON_CORE
    reason: >-
      The double-mutant phenotype supports a role in the JA-dependent wound response, but
      it is one output of RGLG4's modulation of JA signalling and rests on redundant
      RGLG3/RGLG4 genetics; the mechanism (substrate) is unknown. Retained as a
      non-core, JA-mediated process.
