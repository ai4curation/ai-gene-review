  review:
    summary: AtSubP sequence-based prediction of nuclear localization. No experimental
      data place MTHFR2 in the nucleus; the protein lacks targeting sequences and is
      recovered in cytosolic fractions by proteomics.
    action: MARK_AS_OVER_ANNOTATED
    reason: A machine-learning localization prediction for a cytosolic metabolic enzyme
      that functions with cytosolic methionine synthase. Roje et al. found no targeting
      sequences, and two independent proteomic studies (HDA) place the protein in the
      cytosol. Without any nuclear assay the nucleus claim is not supported; it is not
      demonstrably impossible, so it is marked as over-annotated rather than removed.
