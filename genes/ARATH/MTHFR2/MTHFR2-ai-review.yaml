core_functions:
- description: NADH-dependent, S-adenosylmethionine-insensitive 5,10-methylenetetrahydrofolate
    reductase in the cytosol, using bound FAD to convert 5,10-methylene-THF to 5-methyl-THF
    (possibly reversibly), thereby supplying the methyl group for methionine synthesis
    and linking the folate one-carbon pool with the methionine/S-adenosylmethionine
    cycle.
  molecular_function:
    id: GO:0106312
    label: methylenetetrahydrofolate reductase (NADH) activity
