suggested_questions:
- question: Does MTHFR2 operate in the reverse (5-methyl-THF oxidation) direction
    in vivo, and under which conditions, given the low cytosolic NADH/NAD ratio?
- question: How is flux through plant MTHFR controlled in the absence of AdoMet feedback
    inhibition, and do MTHFR1 and MTHFR2 differ in kinetics or expression?
- question: PANTHER places O80585 (MTHFR2) in PTHR45754:SF3 "METHYLENETETRAHYDROFOLATE
    REDUCTASE (NADPH)" but its paralog MTHFR1 (Q9SE60) in SF4; does the split of the two
    Arabidopsis paralogs reflect real divergence, and should the SF3 name be revised given
    its NADH-preferring bacterial and plant members?
suggested_experiments:
- description: Purify recombinant MTHFR1 and MTHFR2 separately and measure kinetic
    constants for NADH, NADPH and both directions of the reaction; complement with
    13C-methyl-THF tracing in mthfr2 and mthfr1 mutants.
  hypothesis: MTHFR2 runs reversibly in vivo and the two isozymes differ in direction
    or cofactor preference.
