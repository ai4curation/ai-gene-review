id: O80585
gene_symbol: MTHFR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: MTHFR2 (At2g44160) is one of two Arabidopsis methylenetetrahydrofolate
  reductases, a ~66 kDa FAD-containing flavoprotein that forms a homodimer and catalyses
  the reduction of 5,10-methylenetetrahydrofolate to 5-methyltetrahydrofolate, the
  methyl donor used by methionine synthase to remethylate homocysteine. Unlike the
  NADPH-dependent, S-adenosylmethionine-inhibited mammalian and yeast enzymes, plant
  MTHFRs strongly prefer NADH and are not inhibited by S-adenosylmethionine or methionine;
  given the low NADH/NAD ratio of the plant cytosol the reaction may be reversible,
  allowing methyl groups of 5-methyltetrahydrofolate to be returned to the one-carbon
  pool. The protein lacks targeting sequences and is found in the cytosol. Loss-of-function
  mthfr2 mutants have altered methionine and homocysteine levels and reduced nonhost
  resistance to rice blast, consistent with MTHFR2 supplying one-carbon units for methionine
  and S-adenosylmethionine synthesis.
