id: Q9XHZ3
gene_symbol: UREF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  UREF (At1g21840) is the Arabidopsis ortholog of the bacterial urease accessory protein
  UreF, one of three accessory proteins (with URED and UREG) that are required and
  sufficient for nickel-dependent activation of plant urease. UREF binds URED, and the
  URED-UREF complex forms the docking site for UREG; UREF associates with urease only
  via URED. By analogy with the bacterial system, UreF couples the UreG GTPase cycle to
  metallocenter assembly and increases the fidelity of nickel (versus zinc) insertion.
  uref mutants lack urease activity and cannot grow on urea as sole nitrogen source.
