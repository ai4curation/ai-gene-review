suggested_questions:
- question: Does plant UREF, like bacterial UreF, gate the UREG GTPase cycle to increase
    the fidelity of nickel over zinc insertion, and is the UreF-UreG interface (Phe-35,
    Arg-236 in Arabidopsis UREF) required for this?
  experts:
  - Urease metallocenter assembly biochemists
suggested_experiments:
- hypothesis: The conserved UREF residues Phe-35 and Arg-236 are required for UREG
    recruitment and urease activation in planta.
  description: Complement the uref mutant with F35A and R236A variants and assay UREG
    co-purification and nickel-dependent urease activity, including under zinc excess.
  experiment_type: Mutagenesis, complementation, affinity purification
