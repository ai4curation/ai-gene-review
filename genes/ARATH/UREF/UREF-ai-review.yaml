- term:
    id: GO:0043419
    label: urea catabolic process
  evidence_type: IDA
  original_reference_id: PMID:28710280
  qualifier: involved_in
  review:
    summary: UREF is part of the urease activation complex whose output was assayed as
      urease-catalysed urea hydrolysis.
    action: ACCEPT
    reason: >-
      UREF does not hydrolyse urea itself; it performs the activation step that
      produces the enzyme that does, supplying the active-site nickel the
      reaction depends on. GO relates the urease activator complex to this
      process directly (GO:0150006 capable of part of GO:0043419), so urea
      catabolic process is the core process for urease accessory proteins,
      applied the same way in the bacterial UreD/UreF/UreG/UreE reviews.
    supported_by:
    - reference_id: PMID:28710280
      supporting_text: Urease from the urease–UreD and urease–UreD–UreF complexes was
        activated to a higher extent than urease from the urease–UreD–UreF–UreG complex.
- term:
    id: GO:0051604
    label: protein maturation
  evidence_type: IMP
  original_reference_id: PMID:16244137
  qualifier: involved_in
  review:
    summary: UREF is required for maturation of urease apoprotein into active,
      nickel-containing urease.
    action: KEEP_AS_NON_CORE
    reason: >-
      UREF takes part in urease maturation: it acts in the activation complex
      that inserts nickel into the apoprotein, so it does part of the work of
      the process rather than merely being required. GO:0110147 protein maturation by nickel ion transfer is obsolete, and its GO record names GO:0051604 as the replacement (replaced_by; go-ontology issue 29105), so protein
      maturation is as precise as GO allows. It is kept as non-core because
      urea catabolic process is used as the core process for all urease
      accessory proteins (see the GO:0043419 row).
    supported_by:
