    summary: >-
      Rank 3 (score 16.57). This exact term was also returned for RIC7 (F4JLB7) in the ARGO-ProtNLM-50
      cohort, another Arabidopsis LRR-containing protein with no oomycete biology. Two unrelated LRR
      proteins in two independent cohorts drawing the identical defence-response term marks it as
      a frequency-driven repetition rather than a prediction: plant LRR immune receptors dominate
