  label: Arabidopsis thaliana (Mouse-ear cress)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for BRI1, the Arabidopsis brassinosteroid receptor kinase. The
  top call is exactly right and exactly on-brand for the protein, but ranks 2 and 3 drift into the
  wider LRR receptor-kinase family: meristem maintenance (the CLV1 role) and oomycete defence regulation
  (the generic plant LRR-immunity attractor). The free-text Function channel drifts the same way,
  returning GSO1 and CLV1 descriptions rather than a brassinosteroid receptor, so on this gene the
  GO channel is the better of the two. Assessment: 1 correct not novel (CNN), 1 paralog incorrect
  (PLI), 1 repetition (REP).
