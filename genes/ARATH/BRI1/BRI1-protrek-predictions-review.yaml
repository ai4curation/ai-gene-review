    summary: >-
      Rank 2 (score 16.59). Maintenance of meristem identity is the characterised role of CLV1 and
      the CLV3-perceiving LRR receptor kinases, not of BRI1; brassinosteroid signalling does influence
      meristem activity, but this specific term belongs to a different receptor family branch. ProTrek's
      own Function channel returns the CLV3-perception comment for this query, which is where the
      call comes from. A within-superfamily transfer between LRR-RKs with different ligands.
