id: Q946J8
gene_symbol: LHP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: LHP1 (LIKE HETEROCHROMATIN PROTEIN 1; also TERMINAL FLOWER 2, TFL2) is the single Arabidopsis
  homolog of the HP1 chromodomain family. It carries an N-terminal chromodomain and a C-terminal chromo
  shadow domain, homodimerizes, and is a nuclear protein that associates almost exclusively with histone
  H3 lysine 27 trimethylation (H3K27me3)-marked genes in euchromatin. Its chromodomain binds H3K27me3,
  and LHP1 acts as a subunit of plant PRC1-like Polycomb complexes (with RING1A/B) while also interacting
  with PRC2-associated proteins such as MSI1, thereby helping to maintain and propagate H3K27me3-dependent
  epigenetic repression. Targets include floral regulators (FT, AG, AP3, PI, SEP3), KNOX genes and FLC;
  lhp1/tfl2 mutants flower early, form terminal flowers, are dwarfed, and fail to maintain vernalization-induced
  silencing of FLC after return to warm temperatures.
