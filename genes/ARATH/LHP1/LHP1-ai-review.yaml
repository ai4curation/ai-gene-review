suggested_questions:
- question: Does LHP1 contribute any activity of its own to H3K27me3 spreading or chromatin compaction
    at FLC beyond reading the mark, e.g. by bridging PRC2 (via MSI1) to modified nucleosomes during replication?
- question: The GOA rows for GTP cyclohydrolase II activity, NOT DHBPS activity and chloroplast from PMID:23203051
    appear to belong to RIBA1/RIBA3; can the TAIR curators confirm and correct the gene attribution?
suggested_experiments:
- description: Separation-of-function LHP1 alleles (chromodomain aromatic-cage vs chromo-shadow dimerization
    mutants) introduced into lhp1 to test which interaction is required for maintenance of FLC silencing
    after vernalization, monitored by FLC-Venus imaging and H3K27me3 ChIP.
