    summary: >-
      NOT annotation: TAIR records that PGLP1 is not located in the cytosol, based on
      the Arabidopsis cytosolic proteome study, which separated true cytosolic proteins
      from organelle-targeted ones.
    action: ACCEPT
    reason: >-
      The negative statement agrees with everything else known about PGLP1: it has a
      cleavable chloroplast transit peptide and acts in the stroma, where Rubisco makes
      its substrate. The photorespiratory paper names the paralog PGLP2, not PGLP1, as the
