  review:
    summary: >-
      Phylogenetic inference that PGLP1 is active in the cytoplasm, propagated from a
      PANTHER node whose experimentally characterized members (yeast, E. coli, mammalian
      and Plasmodium HAD phosphatases, Arabidopsis At3g58830) are largely cytosolic.
    action: MODIFY
    reason: >-
      In GO the chloroplast is part of the cytoplasm, so the statement is not false, but it
      is far less specific than the evidence. PGLP1 is a nuclear-encoded precursor with a
      chloroplast transit peptide, is found in the stromal proteome, and acts on the
      2-phosphoglycolate generated by Rubisco in the stroma; TAIR also records it as NOT
      cytosolic. The PAINT node's cytoplasmic placement fits the clade's soluble
      non-plastid members but not this plastid-targeted member. The correct specific
      location, already carried by PGLP1 from several HDA rows, is chloroplast stroma.
    proposed_replacement_terms:
