suggested_questions:
- question: Are At5g36700 (PGLP1A, P0DKC3) and At5g36790 (PGLP1B, P0DKC4) two real loci or a
    genome double annotation of one gene? The PGLP1 paper reports a double annotation in this
    region, and the answer decides whether annotations should be split between two
    accessions.
- question: Does PGLP1 activity in planta depend on chloride and Mg2+ as reported for the
    purified spinach and tobacco enzymes, and is the stromal enzyme regulated by
    ribose-5-phosphate as reported for algal and spinach PGLPs?
suggested_experiments:
- description: Determine the crystal structure of mature Arabidopsis PGLP1 with
    2-phosphoglycolate and Cl-/Mg2+ to define the substrate specificity determinants that
    distinguish it from the broader HAD-IIA phosphatase clade.
  experiment_type: structural biology
- description: Express a Cys86Ser PGLP1 variant in the pglp1 background and test growth,
    2-phosphoglycolate levels and photosynthesis under heat and fluctuating light, to
    separate redox regulation of PGLP1 from its catalytic role.
  experiment_type: genetic complementation
