gene_symbol: PGLP1A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  PGLP1 (2-phosphoglycolate phosphatase 1; UniProt name PGLP1A; At5g36700) is the
  chloroplast-stromal haloacid dehalogenase (HAD)-superfamily phosphatase that hydrolyses
  2-phosphoglycolate to glycolate and phosphate (EC 3.1.3.18). 2-Phosphoglycolate is made
  in large amounts by the oxygenase reaction of Rubisco and inhibits Calvin-Benson cycle
  enzymes such as triose-phosphate isomerase and sedoheptulose-1,7-bisphosphatase, so
  PGLP1 catalyses the entry reaction of the photorespiratory C2 cycle that salvages this
  carbon back to 3-phosphoglycerate. The nuclear-encoded precursor carries an N-terminal
  chloroplast transit peptide that is removed on import. Knockout of PGLP1, like the
  classical EMS mutant CS119 (a splice-site allele of the same gene), abolishes almost all
  leaf phosphoglycolate phosphatase activity and is lethal in normal air but viable in
  CO2-enriched air. The close paralog PGLP2 (At5g47760) is an active, putatively cytosolic
  enzyme without a photorespiratory role. PGLP1 activity is inhibited by H2O2-dependent
  sulfenylation of Cys-86 under heat stress, and altered PGLP1 levels change plant
  thermotolerance through their effect on 2-phosphoglycolate levels.
