        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Cytoplasm fits the soluble non-plastid members of this HAD-IIA phosphatase
          node; PGLP1 is transit-peptide targeted to the chloroplast stroma, which GO places
          within cytoplasm, so the transferred term is only true at a much coarser level.
