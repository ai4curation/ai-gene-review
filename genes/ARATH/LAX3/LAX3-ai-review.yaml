  - PANTHER:PTN001118955
  review:
    summary: The PAINT amino-acid substrate assertion is unresolved for the auxin-specialized LAX3 branch.
    action: UNDECIDED
    reason: PTN001118955 asserts an inherited amino-acid transport function across the broader permease
      lineage. Direct LAX3 uptake, ligand structures and the distinct AUX/LAX clade establish auxin recognition,
      but the examined studies do not directly test exclusion or transport of amino acids. Neither the
      family name nor demonstrated IAA transport settles whether LAX3 retains an additional amino-acid
      activity; the ancestral substrate assignment remains unresolved rather than disproved.
    supported_by:
