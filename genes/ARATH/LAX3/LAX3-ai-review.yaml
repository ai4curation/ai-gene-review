id: Q9CA25
gene_symbol: LAX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: LAX3 is an eleven-transmembrane auxin influx carrier of the Arabidopsis AUX/LAX family. It
  imports indole-3-acetic acid at the plasma membrane and also transports the synthetic auxin 2,4-D in
  heterologous uptake assays. Auxin-induced LAX3 expression in cortical and epidermal cells overlying
  lateral-root primordia reinforces local auxin responses and cell-wall remodeling, facilitating lateral-root
  emergence. LAX3 also contributes redundantly with other AUX/LAX carriers to embryonic root-cap organization.
  Transport is pH dependent; the proposed histidine-mediated proton-coupling mechanism and its stoichiometry
  remain incompletely resolved.
