- id: PMID:40759769
  title: Structures and mechanism of the AUX/LAX transporters involved in auxin import.
  findings:
  - statement: Full-length LAX3 mediates IAA and 2,4-D uptake; truncated structures resolve substrate
      recognition. Proton coupling is proposed, not a measured integer stoichiometry.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct Q9CA25 target study. Full-length oocyte transport and N-terminally truncated
      structural constructs are distinguished; failed electrogenicity measurements and uncoupler results
      limit mechanistic certainty.
- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3426120/
  title: AUX/LAX Genes Encode a Family of Auxin Influx Transporters That Perform Distinct Functions during
    Arabidopsis Development
  findings:
  - statement: Figure4A directly includes LAX3 in the auxin uptake assay.
    supporting_text: Oocytes injected with AUX1, LAX1, and LAX3 cRNAs showed increased [3H]IAA uptake
      when compared with the water-injected control (n = 8).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normally recovered full text of PMID22773749; native versus ectopic promoter-dependent
      localization is distinguished.
- id: PMID:24150423
  title: Sequential induction of auxin efflux and influx carriers regulates lateral root emergence.
  findings:
  - statement: Native localization and time-course experiments, combined with a multicellular model, support
      sequential cortical PIN3 then LAX3 induction during lateral-root emergence.
    supporting_text: we found that auxin induction of LAX3 expression was slower when compared with PIN3
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct native reporter and timing evidence is distinguished from model-predicted flux/patterning.
      This is tissue-level transport coupling, not physical PIN3–LAX3 binding, and differs from endodermal
      initiation-stage PIN3 reflux.
