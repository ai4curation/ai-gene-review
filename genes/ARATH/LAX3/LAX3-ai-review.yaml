      reference_id: PMID:40759769
      supporting_text: AUX/LAX family members share less than 15% sequence identity with any APC transporter
        of known structure, and phylogenetic analysis supports the conclusion that they form a distinct
        clade
    - &id003
      reference_id: PMID:40759769
      supporting_text: we expressed LAX3 from A. thaliana in Xenopus oocytes and monitored the uptake
