- description: ATP-dependent synthesis of L-glutamine from L-glutamate and ammonium in the chloroplast
    stroma, the glutamine synthetase step of the GS/Fd-GOGAT ammonia assimilation cycle that refixes photorespiratory
    ammonia and assimilates primary ammonium.
