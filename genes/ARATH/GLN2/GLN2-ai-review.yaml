suggested_questions:
- question: Is there a functionally relevant mitochondrial pool of GS2 in wild-type leaves, given conflicting
    GFP-fusion and free-flow-electrophoresis proteomic results?
- question: Which enzymes (GS1 isoforms, GDH) refix photorespiratory ammonia in Arabidopsis gln2 knockouts,
    and why is Arabidopsis less dependent on GS2 than barley or Lotus?
- question: Does ACR11-mediated activation of GS2 operate in vivo to coordinate GS2 and Fd-GOGAT with
    photorespiratory flux?
suggested_experiments:
- description: 15NH4+ or 15N-glycine labelling of wild type, gln2 and gln2 gln1 multiple mutants under
    high and low CO2 to quantify the share of photorespiratory ammonia refixed by GS2 versus cytosolic
    GS1.
- description: Free-flow-electrophoresis-purified mitochondria from plants expressing GLN2 under its native
    promoter, probed with GS2-specific antibodies, to test the proposed mitochondrial pool.
