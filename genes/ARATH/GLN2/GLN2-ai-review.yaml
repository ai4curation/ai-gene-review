id: Q43127
gene_symbol: GLN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: GLN2 (At5g35630; GS2) encodes the only plastid-type glutamine synthetase of Arabidopsis,
  a nuclear-encoded, light-induced, leaf-expressed enzyme with an N-terminal chloroplast transit peptide.
  It catalyses the ATP-dependent amidation of L-glutamate with ammonium to form L-glutamine in the chloroplast
  stroma and, together with ferredoxin-dependent glutamate synthase (GLU1), forms the GS/GOGAT cycle that
  assimilates ammonium into glutamate. GS2 refixes the ammonia released by glycine decarboxylation during
  photorespiration and also assimilates primary ammonium from nitrate reduction. In contrast to barley
  and Lotus, Arabidopsis gln2 knockouts are viable in air but are smaller, slightly chlorotic and altered
  in nitrogen metabolism, consistent with partial compensation by cytosolic GS1 isoforms. GLN2 activity
  in shoots under high ammonium supply causes acidification and contributes to ammonium toxicity. A minor
  mitochondrial pool of GS2 has been reported from GFP fusion studies but is disputed. Its activity is
  stimulated in vitro by the ACT-domain protein ACR11.
