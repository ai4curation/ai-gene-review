- term:
    id: GO:0009853
    label: photorespiration
  evidence_type: TAS
  original_reference_id: PMID:22303256
  review:
    summary: GS2 catalyses the first step of chloroplast refixation of the NH3 released by mitochondrial
      glycine decarboxylation, regenerating glutamine for Fd-GOGAT and ultimately glutamate for peroxisomal
      glyoxylate transamination.
    action: NEW
    reason: 'Participation test: GS2 catalyses a step of the photorespiratory nitrogen cycle (ammonia
      refixation), so it does work in the process rather than merely being required for it. Comparator
      check: the partner enzyme in the same cycle, Fd-GOGAT GLU1, carries photorespiration (IMP); GS2
      orthologs in other plants (rice, maize, barley, pea, alfalfa) carry only IEA/IBA glutamine biosynthesis
      in GOA, so the absence reflects missing curation rather than a GO convention. Caveat: unlike barley
      and Lotus GS2 mutants, Arabidopsis gln2 knockouts survive in air, probably because GS1 isoforms
      and GDH partly compensate; GS2 therefore contributes to, but is not indispensable for, Arabidopsis
      photorespiration. GLN2 also acts in primary nitrogen assimilation (ammonia assimilation cycle row).'
    additional_reference_ids:
    - PMID:15273293
    - PMID:31622939
    - PMID:34400629
    - PMID:35279841
    supported_by:
    - *id008
    - reference_id: PMID:15273293
      supporting_text: Therefore, the GLN2 gene product, heretofore labeled plastidic GS-2, functions
        in both leaf mitochondria and chloroplasts to faciliate ammonium recovery during photorespiration.
    - reference_id: PMID:34400629
      supporting_text: Thus, in A. thaliana, GLN2, GLN1s, and GDHs proteins could redundantly contribute
        to the re-assimilation of photorespiratory ammonia.
    - reference_id: PMID:31622939
      supporting_text: It was shown that GS2 mutants although smaller, slightly chlorotic and with the
        nitrogen metabolism impaired, were able to grow and complete their life cycle under ordinary air
        conditions.
    - reference_id: PMID:35279841
      supporting_text: there is no doubt that this enzyme has a central role in photorespiration.
