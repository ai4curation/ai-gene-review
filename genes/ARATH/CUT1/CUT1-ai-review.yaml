- id: PMID:10330468
  title: CUT1, an Arabidopsis gene required for cuticular wax biosynthesis and pollen fertility, encodes
    a very-long-chain fatty acid condensing enzyme.
  findings:
  - statement: CUT1 encodes a VLCFA condensing enzyme; sense suppression gives waxless stems (wax load
      6-7% of wild type) and conditional male sterility, with C24 wax components predominating, indicating
      a role in elongation beyond C24.
    supporting_text: In CUT1-suppressed plants, the C24 chain-length wax components predominate, suggesting
      that CUT1 is required for elongation of C24 VLCFAs.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding functional characterization; abstract-only in cache.
- id: PMID:11041893
  title: Alterations in CER6, a gene identical to CUT1, differentially affect long-chain lipid content
    on the surface of pollen and stems.
  findings:
  - statement: Positional cloning shows CER6 is identical to CUT1; CER6 is required for stem wax and pollen
      coat lipids, and low amounts of VLC lipids suffice for pollen hydration.
    supporting_text: segregation analysis showed that CER6 is identical to CUT1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes CER6 = CUT1 and the pollen-coat role; full text cached.
- id: PMID:12177469
  title: Significance of the expression of the CER6 condensing enzyme for cuticular wax production in
    Arabidopsis.
  findings:
  - statement: CER6 is transcribed in the epidermis (and anther tapetum); transcription requires light
      and is enhanced by osmotic stress and ABA; epidermal overexpression increases stem wax.
    supporting_text: CER6 promoter-driven CER6 overexpression resulted in increased wax deposition in
      Arabidopsis stems.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Expression and regulation of CER6; full text cached.
