id: Q9XF43
gene_symbol: CUT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: CUT1 (also known as CER6/KCS6; At1g68530) is a 3-ketoacyl-CoA synthase (KCS; condensing enzyme)
  of the endoplasmic reticulum fatty acid elongase in Arabidopsis. It catalyzes the first and chain-length-determining
  step of each very-long-chain fatty acid (VLCFA) elongation cycle, condensing a very-long-chain acyl-CoA
  with malonyl-CoA to form a 3-oxoacyl-CoA; the reduction, dehydration and second reduction steps are
  performed by the shared elongase partners KCR1, PAS2 and ECR/CER10. CUT1 is an integral multi-pass ER
  membrane protein that acts on acyl-CoAs of C22 and longer, supplying the C26-C28+ VLCFA precursors that
  are converted into cuticular wax alkanes, ketones, alcohols and wax esters and into the long-chain lipids
  of the pollen coat. The gene is expressed almost exclusively in the epidermis of aerial organs and in
  the anther tapetum, and its transcription is light-dependent and enhanced by osmotic stress and abscisic
  acid. Loss or suppression of CUT1 produces a severely waxless (eceriferum) stem and silique surface
  and conditional male sterility caused by defective pollen-coat lipids and pollen hydration, while epidermis-driven
  overexpression increases stem wax load.
