    non-catalytic CER2-LIKE (BAHD-like) proteins extend its product range beyond C28?
- question: Does CUT1 form distinct elongase complexes with KCR1, PAS2 and ECR in the epidermis versus
    the tapetum, and does complex composition affect product chain length for wax versus pollen-coat lipids?
