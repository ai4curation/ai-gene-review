id: Q39081
gene_symbol: CAL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  CAULIFLOWER (CAL; AGL10) is a MIKC-type MADS-domain transcription factor of the SQUAMOSA/AP1 clade and
  the closest Arabidopsis paralog of APETALA1. It is expressed in young flower primordia, where it acts
  partially redundantly with AP1 (and, more weakly, with FRUITFULL) to assign floral meristem identity
  to the lateral meristems produced by the inflorescence meristem. cal single mutants have essentially
  wild-type flowers, but ap1 cal double mutants convert every flower into a reiterating inflorescence-like
  meristem (the "cauliflower" curd), and ap1 cal ful triple mutants fail to make flowers at all. CAL promotes
  floral fate in part by up-regulating LEAFY and repressing TERMINAL FLOWER1 in floral primordia, and
  it forms heterodimers with other MADS proteins such as SOC1. The cauliflower phenotype of Brassica oleracea
  var. botrytis is associated with a non-functional CAL ortholog.
