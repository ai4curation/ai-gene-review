core_functions:
- description: >-
    Sequence-specific MADS-domain transcription factor that, partially redundantly with AP1 (and FUL),
    promotes floral meristem identity in lateral primordia of the inflorescence by up-regulating LEAFY
    and restricting TERMINAL FLOWER1 expression, so that floral meristems become determinate flowers rather
    than reiterating shoots.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  - id: GO:0010582
    label: floral meristem determinacy
  - id: GO:0009911
    label: positive regulation of flower development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:7824951
    supporting_text: >-
      Genetic studies demonstrate that two Arabidopsis genes, CAULIFLOWER and APETALA1, encode partially
      redundant activities involved in the formation of floral meristems, the first step in the development
      of flowers.
  - reference_id: PMID:10648231
    supporting_text: >-
      Our results suggest that the FUL, AP1 and CAL genes act redundantly to control inflorescence architecture
      by affecting the domains of LFY and TFL1 expression as well as the relative levels of their activities.
  - reference_id: PMID:10368173
    supporting_text: >-
      Assignment of floral fate to lateral meristems is primarily due to the cooperative activity of the
      flower meristem identity genes LEAFY (LFY), APETALA1 (AP1), and CAULIFLOWER.
- description: >-
    Forms heterodimers with other MIKC MADS-domain proteins, including the floral integrator SOC1, as
    the basis of combinatorial MADS complex formation.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15805477
    supporting_text: >-
      A matrix-based yeast two-hybrid screen of >100 members of this family revealed a collection of specific
      heterodimers and a few homodimers.
suggested_questions:
- question: >-
    Does CAL bind the same CArG-box targets as AP1 genome-wide (e.g., at LFY, TFL1, SOC1, AGL24, SVP),
    or does its weaker single-mutant phenotype reflect lower expression rather than distinct target specificity?
- question: >-
    Is a GO process term for floral meristem identity specification (distinct from floral meristem determinacy)
    warranted for the AP1/CAL/FUL clade?
suggested_experiments:
- description: >-
    ChIP-seq of tagged CAL expressed from its native promoter in an ap1 background to determine whether
    CAL occupies AP1 target loci and can explain the partial rescue of floral identity.
  experiment_type: ChIP-seq
