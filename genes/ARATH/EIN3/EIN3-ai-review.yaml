id: O24606
gene_symbol: EIN3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: EIN3 is a nuclear sequence-specific DNA-binding transcription factor that transduces
  Arabidopsis ethylene signaling into gene expression. It binds ethylene-response cis-regulatory
  elements and activates early targets including ERF1 and the feedback regulator EBF2. EIN3 acts
  with EIL1 and cooperates with EIN2-dependent chromatin acetylation through transcriptional
  positive feedback. It also directly represses targets such as SID2 and ABI4, connecting ethylene
  signaling to salicylic-acid immunity and ascorbate/ROS regulation. Its abundance and activity are
  controlled by proteolysis and kinase-dependent regulation. EIN3/EIL1 has also been implicated in
  ethylene-mediated preadaptation to low oxygen through the PGB1/NO/ERFVII pathway.
