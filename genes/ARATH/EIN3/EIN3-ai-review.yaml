  evidence_type: IMP
  original_reference_id: PMID:25284079
  review:
    summary: The original ein3-1 submergence experiment is inconclusive; later
      ethylene-preconditioning evidence suggests an EIN3/EIL1 pathway role but leaves the exact
      hypoxia-response assignment unresolved.
    action: UNDECIDED
    reason: PMID:25284079 reports no significant ein3-1 phenotype under dark or light submergence
      and no modification of ACBP3-overexpression sensitivity. This does not refute a redundant
      function. PMID:31488841 provides an EIN3/EIL1 preadaptation model and names the double mutant
      in Methods, but the genotype-specific survival panel in Supplementary Fig.1 remains
      inaccessible. Its positive quotation describes a model, not a verified EIN3-specific
      phenotype. Ethylene-triggered preconditioning occurs before lowered oxygen; its downstream
      survival benefit does not by itself establish a response elicited by hypoxia in this gene.
      Retain the newer source as a mechanistic lead while withholding a conclusive GO:0001666
      decision pending genotype-specific data and stimulus interpretation.
    supported_by:
    - reference_id: PMID:25284079
      supporting_text: However, the ein3-1 mutant was not significantly different to wild type under
        either DS or LS (Figure 6b), possibly due to the functional redundancy of the EIL1 gene in
        Arabidopsis.
      reference_section_type: RESULTS
    additional_reference_ids:
    - PMID:31488841
