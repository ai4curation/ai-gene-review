suggested_questions:
- question: Which EIN3 chromatin-binding annotations should be represented directly versus as
    part of EIN2/ENAP1-mediated histone acetylation?
- question: Should kinase-binding annotations for KIN10/MPK inputs remain on EIN3 or be captured
    only in pathway models?
suggested_experiments:
- description: Combine native EIN3 ChIP-seq with rapid ethylene treatment and ein2/enap1 perturbation
    to distinguish direct DNA-binding targets from chromatin-state effects.
  hypothesis: EIN2/ENAP1-dependent chromatin changes alter EIN3 occupancy at only a subset of
    ethylene-responsive loci.
- description: Quantitatively test KIN10, MPK3, and MPK6 effects on EIN3 target occupancy and
    transcriptional activation.
  hypothesis: Kinase perturbations change EIN3 promoter occupancy or activation beyond their
    effects on EIN3 abundance.
