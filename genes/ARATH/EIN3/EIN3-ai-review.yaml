core_functions:
- description: Nuclear sequence-specific transcription factor that binds ethylene-response elements
    and regulates target expression, including ERF1 activation and EBF2 negative feedback. EIN3
    also participates in the positive-feedback mechanism required for EIN2-directed histone
    acetylation.
