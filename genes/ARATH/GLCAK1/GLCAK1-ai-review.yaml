- question: >-
    Is GLCAK2 (At5g14470) a true glucuronokinase with the same strict specificity? The 2019
    report of its activity is preliminary, and an earlier paper proposed galactokinase activity.
    This decides whether glucuronokinase activity should be propagated to the whole eudicot
    PTHR38710:SF1 subfamily or only to the GLCAK1 lineage.
