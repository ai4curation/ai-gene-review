core_functions:
- description: >-
    ATP-dependent glucuronokinase. It phosphorylates free D-glucuronic acid at C1 to give
    alpha-D-glucuronate 1-phosphate, with strict specificity for GlcA and ATP and a divalent
    cation (Mg2+, Mn2+ or Co2+) requirement. This is the kinase step of the myo-inositol
    oxygenation route to UDP-glucuronic acid, between MIOX and USP. In planta it carries
    most of the GlcA flux from myo-inositol into nucleotide sugars for cell-wall polymers.
    The activity is experimentally established for this protein. Cytosolic location is
    inferred, not measured.
  molecular_function:
    id: GO:0047940
    label: glucuronokinase activity
