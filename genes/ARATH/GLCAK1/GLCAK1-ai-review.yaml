suggested_experiments:
- hypothesis: GLCAK1 and GLCAK2 together account for all glucuronokinase activity, and
    a double mutant blocks MIOX-pathway flux into cell walls.
  description: >-
    Construct glcak1 glcak2 CRISPR double mutants. Measure extractable GlcAK activity, free
    GlcA, and incorporation of 3H-myo-inositol into wall polymers, and score pollen tube
    growth and seedling wall composition.
- hypothesis: GLCAK1 is cytosolic.
  description: >-
    Express GLCAK1-GFP under its native promoter in Arabidopsis pollen and roots and co-image
