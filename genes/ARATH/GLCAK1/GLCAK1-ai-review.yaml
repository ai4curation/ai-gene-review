suggested_questions:
- question: >-
    Does GLCAK1 also act in a salvage pathway that recycles GlcA released by turnover of
    pectin, arabinogalactan proteins or glucuronoxylan, and how much does salvage contribute
    compared with de novo flux from myo-inositol? The authors proposed salvage but did not
    test it.
