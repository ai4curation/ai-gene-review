- term:
    id: GO:0006020
    label: inositol metabolic process
  evidence_type: TAS
  original_reference_id: PMID:19951951
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Author statement that GLCAK1 is the last missing enzyme of the myo-inositol oxygenation
      pathway to UDP-GlcA.
    action: MODIFY
    reason: >-
      GLCAK1 does not act on inositol. Its substrate is GlcA, which MIOX produces by ring
      cleavage of myo-inositol. The pathway it belongs to is the myo-inositol-derived branch
      of UDP-glucuronate biosynthesis. Inositol metabolic process is therefore an imprecise
      label for the step GLCAK1 catalyses. The step GLCAK1 performs (GlcA to GlcA-1-P, the
      substrate of USP) is a catalytic step of UDP-glucuronate biosynthesis. glcak1 frameshift
      mutants confirm the role in planta: label from myo-inositol builds up as free GlcA
      and less reaches cell-wall polymers. UDP-glucuronate biosynthetic process (GO:0006065)
      is the better term, and it is the term used for the parallel UGD enzymes of the other
      UDP-GlcA route.
    proposed_replacement_terms:
    - id: GO:0006065
      label: UDP-glucuronate biosynthetic process
    supported_by:
    - reference_id: PMID:19951951
      supporting_text: It is the last missing enzyme in the myo-inositol oxygenation pathway
        to UDP-GlcA (11), which was not known at the molecular level so far.
    - reference_id: PMID:30102814
      supporting_text: radiotracer experiments with 3 H-myo-inositol revealed that the mutants
        in glucuronokinase1 accumulate only glucuronic acid and incorporate less metabolite
        into cell wall polymers.
    - reference_id: PMID:30102814
      supporting_text: The data show that myo‐inositol is almost quantitatively converted
        to GlcA, which strongly increases in concentration when the glucuronokinase is
        blocked but a redirection of GlcA into other pathways including the formation of
        AsA does not occur.
- term:
    id: GO:0008266
    label: poly(U) RNA binding
  evidence_type: IDA
  original_reference_id: PMID:17511964
  qualifier: enables
  review:
    summary: >-
      Derived from a proteomics screen in which Arabidopsis leaf proteins were enriched on
      a poly(U)-affinity column before 2-DE/MALDI-TOF identification. The authors describe
      the column as a way to enrich proteins with nucleotide-binding motifs.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Retention on a poly(U) matrix in a whole-proteome enrichment is expected for an ATP-binding
      kinase, and the authors used the column to enrich nucleotide-binding proteins in general.
      Nothing links GLCAK1 to RNA binding as a biological activity. No binding to RNA in
      vivo has been shown, no RNA-related function has been reported, and its GHMP fold
      and assayed activity are those of a sugar kinase. Only the abstract is cached, so I
      cannot see how GLCAK1 behaved in the screen, and the curator's observation of column
      binding is not disputed. The row is marked as over-annotation rather than removed:
      it may record an in vitro binding observation but should not be read as a function.
    supported_by:
    - reference_id: PMID:17511964
      supporting_text: Here we use a polyU-affinity column to enrich proteins with nucleotide-binding
        motifs.
