- term:
    id: GO:0048868
    label: pollen tube development
  evidence_type: TAS
  original_reference_id: PMID:19951951
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Based on the pollen-preferred expression of GLCAK1 and on the authors' speculation
      that germinating pollen tubes may take up myo-inositol from the style and channel
      it through the MIOX pathway into wall precursors.
    action: REMOVE
    reason: >-
      The only basis for this row is expression (pollen-preferred transcript levels in public
      microarray data) and a hypothesis in the Discussion of PMID:19951951. No pollen tube
      germination, growth or wall phenotype has been reported for any glcak1 mutant, and
      the same authors stress that the pathway is not restricted to pollen. High expression
      in a tissue does not show that the gene product takes part in that tissue's
      developmental process. Any pollen-tube defect would in any case be a downstream
      consequence of reduced precursor supply, not participation in pollen tube development.
      Its general role, the UDP-glucuronate precursor supply, is already covered.
    supported_by:
    - reference_id: PMID:19951951
      supporting_text: This suggests that myo-inositol secreted by the style can be taken
        up by pollen through the myo-inositol transporter and metabolized via the MIOX pathway
        into UDP-GlcA
    - reference_id: PMID:19951951
      supporting_text: Although MIOX and GlcAK genes are highly expressed in pollen the
        pathway is clearly not restricted to these specialized cells
