id: Q93ZC9
gene_symbol: GLCAK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: >-
  GLCAK1 (At3g01640) encodes glucuronokinase 1, a 362-residue soluble sugar-1-kinase
  of the GHMP (galacto-, homoserine, mevalonate and phosphomevalonate) kinase superfamily.
  It phosphorylates free D-glucuronic acid (GlcA) at C1 using ATP, giving
  alpha-D-glucuronate 1-phosphate and ADP. This is the kinase step of the myo-inositol
  oxygenation route to UDP-glucuronic acid (UDP-GlcA). In that route myo-inositol
  oxygenase (MIOX) cleaves myo-inositol to GlcA, GLCAK1 phosphorylates the GlcA, and
  UDP-sugar pyrophosphorylase (USP) converts GlcA-1-phosphate to UDP-GlcA, a major
  nucleotide-sugar precursor of pectins and hemicelluloses. The same kinase step also
  lets the plant recycle free GlcA released by cell-wall turnover. The recombinant
  Arabidopsis enzyme is strictly specific. It uses only D-glucuronic acid among the
  monosaccharides tested (no activity on D-glucose, D-xylose, L-arabinose, D-galactose
  or D-galacturonic acid) and only ATP as phosphate donor. It needs a divalent cation:
  Mg2+ is used in the standard assay, and Mn2+ or Co2+ can replace it. The Km values are
  about 0.7 mM for GlcA and 0.56 mM for ATP, and the pH optimum is 7.5. The gene is
  expressed in all tissues and most strongly in pollen. Its partner MIOX and USP genes
  share this pollen-biased expression. CRISPR frameshift glcak1 mutants accumulate GlcA
  made from labelled myo-inositol and put less of the label into cell-wall polymers.
  Their ascorbate levels are unchanged, so GLCAK1 directs MIOX-derived GlcA into
  nucleotide sugars and not into ascorbate. A paralog, GLCAK2 (At5g14470), sits in the
  same PANTHER subfamily and probably accounts for the residual flux in glcak1 mutants.
  The protein has no predicted transit peptide or transmembrane segment and is assumed
  to be cytosolic.
