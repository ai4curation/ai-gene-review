- id: PMID:19951951
  title: Cloning of Glucuronokinase from Arabidopsis thaliana, the last missing enzyme of
    the myo-inositol oxygenase pathway to nucleotide sugars.
  findings:
  - statement: Recombinant At3g01640 (GLCAK1) is an ATP-dependent D-glucuronic acid 1-kinase
      of the GHMP superfamily.
    supporting_text: These experiments confirm that the purified enzyme indeed is a GlcAK.
  - statement: Strict sugar specificity. No activity on D-glucose, D-xylose, L-arabinose,
      D-galactose or D-galacturonic acid.
    supporting_text: The Arabidopsis enzyme only catalyzed the conversion of d-GlcA into
      its corresponding sugar-1-phosphate but failed to utilize any other monosaccharide
      tested in the assays, indicating a very high substrate specificity of AtGlcAK for
      the sugar d-GlcA.
  - statement: ATP is the only phosphate donor accepted (UTP, CTP, GTP, UDP and ADP inactive).
    supporting_text: Apart from ATP none of the nucleotides was able to phosphorylate GlcA.
  - statement: Divalent cation requirement. Mg2+ is used in the standard assay, and Mn2+ or
      Co2+ can replace it.
    supporting_text: AtGlcAK requires Mg2+ but also other divalent cations, like Mn2+ and
      Co2+, were able to substitute for magnesium.
  - statement: Cytosolic location is inferred from the absence of targeting signals, not
      measured.
    supporting_text: The protein is assumed to be localized in the cytosol as no transmembrane
      spanning domains and transit peptides are predicted (iPSORT software).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC2823444). This is the defining biochemical characterisation of
      At3g01640. The kinase identity was established on the recombinant Arabidopsis protein,
      after purification of the native enzyme from Lilium longiflorum pollen. The pollen-tube
      and salvage roles are Discussion hypotheses, not data.
- id: PMID:30102814
  title: The Myo-inositol pathway does not contribute to ascorbic acid synthesis.
  findings:
  - statement: CRISPR/Cas9 frameshift glcak1 mutants accumulate free GlcA derived from myo-inositol
      and incorporate less label into cell-wall polymers.
    supporting_text: Here we show that a knockout in glucuronokinase1 reduces the flux of
      GlcA into cell wall polymers and leads to an accumulation of GlcA.
  - statement: Loss of GLCAK1 does not change ascorbate levels, so GLCAK1-dependent flux
      is not diverted to ascorbate.
    supporting_text: All four mutants in glucuronokinase as well as the wild type have
      the same level of AsA in leaves.
  - statement: The SALK T-DNA lines glcak1-1 and glcak1-2 are not true knockouts (the insertion
      is in the promoter and expression is wild-type-like).
    supporting_text: Two previously described T-DNA insertion lines in the gene coding for
      glucuronokinase1 show wild type-like expression levels of the mRNA in our experiments
  - statement: Residual flux into cell walls in glcak1 mutants is attributed to the paralog
      GLCAK2 (At5g14470).
    supporting_text: which confirms the function of GlcAK2 (At5g14470) as a second isoform
      of GlcAK
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC6492119). Provides the in vivo genetic evidence (IMP-grade) for
      GLCAK1 in UDP-GlcA/cell-wall precursor supply from myo-inositol. It also warns that
      phenotypes reported for the SALK lines (glcak1-1/-2) should not be attributed to loss
      of GLCAK1. The GLCAK2 enzyme confirmation is described only as preliminary.
- id: PMID:23857351
  title: UDP-sugar pyrophosphorylase controls the activity of proceeding sugar-1-kinases
    enzymes.
  findings:
  - statement: Glucuronokinase activity falls together with USP activity in USP-silenced
      Arabidopsis lines, consistent with sequential action of the two enzymes.
    supporting_text: Surprisingly, the miRNA lines with low USP activity have also a low
      glucuronokinase activity, indicating a link between both enzymes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Short communication. It measures total extractable glucuronokinase activity, not an
      activity assigned to a specific isoform. It supports GLCAK1/USP pathway coupling but
      not a physical interaction.
- id: PMID:24586965
  title: Molecular cloning of a novel glucuronokinase/putative pyrophosphorylase from zebrafish
    acting in an UDP-glucuronic acid salvage pathway.
  findings:
  - statement: A bifunctional zebrafish GlcAK/putative pyrophosphorylase in PTHR38710 shares
      GlcA and ATP specificity with the plant enzyme. It is the experimental seed for the
      PAINT glucuronokinase IBD at PTN001475528.
    supporting_text: Glucuronokinase from zebrafish is a member of the GHMP-kinase superfamily
