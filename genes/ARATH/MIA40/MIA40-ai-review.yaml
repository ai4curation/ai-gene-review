suggested_questions:
- question: Is the peroxisomal requirement for MIA40 (CSD3, AIM1) dependent on its CPC redox activity,
    and what reoxidizes MIA40 in the peroxisomal matrix?
- question: Is SLP2 a direct oxidative-folding substrate of MIA40, and do mia40 seeds show the accelerated
    germination of slp2?
- question: Should GO:0015035 be relabelled to avoid the implied direction, given that its definition
    is direction-neutral and Mia40-family enzymes act as disulfide donors?
