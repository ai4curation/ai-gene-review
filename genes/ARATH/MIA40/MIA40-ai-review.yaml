id: Q8GYJ4
gene_symbol: MIA40
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: 'MIA40 (At5g23395) encodes the single Arabidopsis homologue of the Mia40/CHCHD4 oxidoreductase,
  a small (162 aa) protein with an N-terminal CPC redox motif and a twin Cx9C helical-hairpin (CHCH) core.
  It is dual-targeted: it resides in the mitochondrial intermembrane space and, through a C-terminal SKL
  peroxisomal targeting signal, in the peroxisomal matrix. Recombinant AtMIA40 transfers disulfides to
  substrate cysteines (for example COX19) in reconstitution with ERV1. Unlike yeast and animal Mia40 it
  is not essential: mia40 knockout plants have no visible phenotype and import small TIM and carrier proteins
  normally, because plant ERV1, aided by glutathione, can oxidize intermembrane-space substrates directly.
  MIA40 is nonetheless required for accumulation of mitochondrial copper/zinc superoxide dismutase CSD1
  and its copper chaperone CCS, for normal complex I levels, and in peroxisomes for CSD3 and full levels
  of the beta-oxidation multifunctional protein AIM1. It forms a disulfide-dependent complex with the
  intermembrane-space phosphatase SLP2 that is needed for SLP2 activity, linking it to the regulation
  of seed germination.'
