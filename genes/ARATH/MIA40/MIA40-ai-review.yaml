  title: Conserved and novel functions for Arabidopsis thaliana MIA40 in assembly of proteins in mitochondria
    and peroxisomes.
  findings:
  - statement: AtMIA40 is dual-targeted to mitochondria and peroxisomes.
    supporting_text: A. thaliana Mia40 is targeted to and accumulates in mitochondria and peroxisomes.
  - statement: mia40 knockout plants have no detectable phenotype, whereas erv1 knockouts are lethal.
    supporting_text: Although insertional inactivation of Erv1 leads to a lethal phenotype, inactivation
      of Mia40 results in no detectable deleterious phenotype.
  - statement: Loss of MIA40 abolishes mitochondrial CSD1 and CCS and lowers complex I.
    supporting_text: Inactivation of Mia40 results in an alteration of several proteins in mitochondria,
      an absence of copper/zinc superoxide dismutase (CSD1), the chaperone for superoxide dismutase (Ccs1)
      that inserts copper into CSD1, and a decrease in capacity and amount of complex I.
  - statement: Loss of MIA40 abolishes peroxisomal CSD3 and lowers AIM1.
    supporting_text: In peroxisomes the absence of Mia40 leads to an absence of CSD3 and a decrease in
      abnormal inflorescence meristem 1 (Aim1), a β-oxidation pathway enzyme.
