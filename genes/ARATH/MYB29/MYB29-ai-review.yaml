- term:
    id: GO:0010438
    label: cellular response to sulfur starvation
  evidence_type: TAS
  original_reference_id: PMID:17420480
  qualifier: acts_upstream_of_or_within
  review:
    summary: Hirai et al. 2007 note that MYB28, MYB29 and MYB34 are down-regulated under sulfur deficiency,
