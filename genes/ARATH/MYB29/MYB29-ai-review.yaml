id: Q9FLR1
gene_symbol: MYB29
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: MYB29 (HAG3, PMG2; At5g07690) is a nuclear R2R3-MYB transcription factor of subgroup 12 that,
  with its paralogues MYB28 and MYB76, controls biosynthesis of methionine-derived aliphatic glucosinolates
  in Arabidopsis. It binds and transactivates promoters of aliphatic glucosinolate genes (chain elongation
  and core-structure enzymes such as MAM1, CYP79F1 and CYP83A1) and represses indolic glucosinolate regulators.
  MYB28 is the dominant regulator; MYB29 mainly supports short-chain aliphatic glucosinolates and their
  jasmonate-induced accumulation, and the myb28 myb29 double mutant has no aliphatic glucosinolates. MYB29
  interacts with the jasmonate-signalling bHLH factors MYC2, MYC3 and MYC4. Through glucosinolates it
  contributes to defence against insects, fungi and bacteria. MYB29 (RAO7) also represses the mitochondrial
  retrograde stress response, including ALTERNATIVE OXIDASE1a induction, and affects ERF and WRKY gene
  expression and tolerance of combined light and drought stress. Its expression is induced by jasmonate,
  wounding and drought and falls under sulfur deficiency.
