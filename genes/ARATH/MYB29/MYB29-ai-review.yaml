      PMID:23792303). MYB29 transactivates the biosynthetic gene promoters, so it is a direct transcriptional
      regulator of the pathway.
    supported_by:
    - reference_id: PMID:17420480
      supporting_text: In contrast, PMG2/Myb29 plays an accessory role in MeJA-mediated induction of aliphatic
        GSL biosynthesis.
    - reference_id: PMID:18446225
      supporting_text: short-chain aliphatic glucosinolates were reduced by about 50% in both the myb28
        and the myb29 single mutants
    - reference_id: PMID:18446225
      supporting_text: We now show that MYB28 and MYB29 are partially redundant, but in the absence of
        both, the synthesis of all aliphatic glucosinolates is blocked.
    - reference_id: PMID:23792303
      supporting_text: Transgenic MYB29 expression activated the same biosynthetic pathway, but induction
