core_functions:
- description: Nuclear R2R3-MYB transcription factor that binds and activates promoters of aliphatic (methionine-derived)
    glucosinolate biosynthetic genes, acting redundantly with MYB28 and MYB76 and with the bHLH partners
    MYC2/3/4. It mainly supports short-chain aliphatic glucosinolates and their jasmonate-induced accumulation.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
  - id: GO:0010439
    label: regulation of glucosinolate biosynthetic process
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:20348214
    supporting_text: However, previous transactivation assays showed that MYB29 alone activates transcription
      of the promoters of aliphatic biosynthetic genes in cultured Arabidopsis cells
  - reference_id: PMID:18042203
    supporting_text: Both HAG2/MYB76 and HAG3/MYB29 were shown to be positive regulators of aliphatic
      glucosinolate biosynthesis.
  - reference_id: PMID:18446225
    supporting_text: We now show that MYB28 and MYB29 are partially redundant, but in the absence of both,
      the synthesis of all aliphatic glucosinolates is blocked.
  - reference_id: PMID:23792303
    supporting_text: Transgenic MYB29 expression activated the same biosynthetic pathway, but induction
      of the genes involved in side chain elongation was weaker than that by MYB28, resulting in a weaker
      recovery of AGSLs.
  - reference_id: PMID:23943862
    supporting_text: yeast two-hybrid and pull-down experiments indicated that MYC2/MYC3/MYC4 interact
      directly with GS-related MYBs
proposed_new_terms:
- proposed_name: positive regulation of aliphatic glucosinolate biosynthetic process
  proposed_definition: Any process that activates or increases the frequency, rate or extent of the chemical
    reactions and pathways resulting in the formation of aliphatic (methionine-derived) glucosinolates.
  justification: GO has only GO:0010439 regulation of glucosinolate biosynthetic process. MYB28, MYB29
    and MYB76 specifically activate the aliphatic branch while repressing the indolic branch, a distinction
    a substrate-class-specific positive regulation term would capture (cf. the indole counterpart proposed
    in the MYB34 review).
suggested_questions:
- question: Should GO provide a negative-regulation child of GO:0031930 mitochondria-nucleus signaling
    pathway, so that repressors of the retrograde response such as MYB29/RAO7 can be annotated with the
    correct direction?
- question: Does MYB29 repress AOX1a and ERF/WRKY genes by binding their promoters directly, and does
    this depend on the same MYC partners used for glucosinolate gene activation?
- question: Is the GO:0009644 response to high light intensity annotation from PMID:28167700 supported
    by a high-light assay, or should it describe the combined moderate light and drought phenotype?
suggested_experiments:
- experiment_type: ChIP-seq / DAP-seq
  hypothesis: MYB29 binds promoters of aliphatic glucosinolate genes and of AOX1a in vivo.
  description: Profile genome-wide occupancy of epitope-tagged MYB29 expressed from its native promoter,
    with and without MeJA or antimycin A, and compare it with MYB28 occupancy to separate shared and MYB29-specific
    targets.
