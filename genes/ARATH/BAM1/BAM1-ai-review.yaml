- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20626648
  qualifier: enables
  supporting_entities:
  - UniProtKB:O04547
  review:
    summary: In radioligand competition assays, BAM1 binds the CLV3 CLE peptide (Kd about 26 nM) and is
      competed by most other CLE peptides tested. The interaction partners here are CLE peptide ligands.
      Photoaffinity labelling independently confirmed direct CLV3 binding by BAM1.
    action: MODIFY
    reason: A ligand-receptor peptide interaction is better represented as peptide binding than as generic
      protein binding.
    proposed_replacement_terms:
    - id: GO:0017046
      label: peptide hormone binding
    supported_by:
    - reference_id: PMID:20626648
      supporting_text: 'Binding was saturable for all receptors with a very similar Kd for each receptor:
        30 nM for CLV1, 32 nM for CLV2, 26 nM for BAM1, and 36 nM for BAM2'
    - reference_id: PMID:20626648
      supporting_text: This suggests that BAM receptors have a wider range of specificity for CLE binding
        than either CLV1 or CLV2, perhaps related to their broad developmental roles.
    - reference_id: PMID:25754504
      supporting_text: Further analysis showed that the receptor kinase BAM1 directly binds the CLV3 peptide.
