core_functions:
- description: Plasma membrane CLE peptide receptor kinase. The LRR ectodomain binds CLV3 and other CLE
    peptides with broad specificity, and the kinase phosphorylates CIK co-receptors and PBL34/35/36 RLCKs.
    Redundantly with CLV1, this restricts WUS expression and stem cell number in the shoot meristem. BAM1
    also acts in root protophloem and anther development.
  molecular_function:
    id: GO:0004675
    label: transmembrane receptor protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0009934
    label: regulation of meristem structural organization
  - id: GO:0007178
    label: cell surface receptor protein serine/threonine kinase signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:25754504
    supporting_text: Further analysis showed that the receptor kinase BAM1 directly binds the CLV3 peptide.
  - reference_id: PMID:20626648
    supporting_text: 'Binding was saturable for all receptors with a very similar Kd for each receptor:
      30 nM for CLV1, 32 nM for CLV2, 26 nM for BAM1, and 36 nM for BAM2'
  - reference_id: PMID:34935965
    supporting_text: Further biochemical assays revealed that PBL34/35/36 interacted with CLV1, BAM1/3,
      and CIKs, and were phosphorylated by CLV1 and BAM1.
  - reference_id: PMID:34651321
    supporting_text: CLE25/26/45 enhanced the phosphorylation levels of CIKs, which were greatly impaired
      in clv1 bam1 3 mutant
  - reference_id: PMID:25754504
    supporting_text: WUS gene transcripts were up-regulated, and the region of WUS expression was enlarged
      at the SAM in the clv1 bam1 double mutant.
  - reference_id: PMID:18780746
    supporting_text: with bam clv mutants exhibiting severe defects in stem cell specification
suggested_questions:
- question: Is BAM1 in the meristem periphery mainly a signalling receptor or a ligand sink that sequesters
    CLV3/CLE peptides, as suggested by suppression of clv3 by bam1 bam2?
- question: Which CLE ligands activate BAM1 in anther and ovule development?
suggested_experiments:
- description: Express kinase-dead BAM1 (or BAM1 lacking its kinase domain) from the BAM1 promoter in
    clv1 bam1 and clv3 bam1 bam2 backgrounds, and compare rescue of WUS expression and meristem size.
  hypothesis: BAM1 restricts the stem cell niche through kinase-dependent signalling at the centre and
    acts as a kinase-independent ligand sink at the periphery.
  experiment_type: genetic complementation
