  review:
    summary: 'This IBA comes from a PANTHER node seeded by brassinosteroid receptors (BRI1, BRL2, OsBRI1).
      BAM1 sits inside that LRR-RK clade, and it does mediate hormone signalling: it is a receptor for
      CLE peptide hormones. The transfer is therefore technically valid, but the generic term says little
      about BAM1.'
    action: KEEP_AS_NON_CORE
    reason: The inherited term is broadly true for a peptide-hormone receptor kinase. The specific receptor
      activity and meristem processes are the core annotations.
    supported_by:
    - reference_id: PMID:25754504
      supporting_text: Further analysis showed that the receptor kinase BAM1 directly binds the CLV3 peptide.
    - reference_id: PMID:34935965
      supporting_text: Further biochemical assays revealed that PBL34/35/36 interacted with CLV1, BAM1/3,
        and CIKs, and were phosphorylated by CLV1 and BAM1.
