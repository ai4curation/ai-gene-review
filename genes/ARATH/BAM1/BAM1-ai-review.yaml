id: O49545
gene_symbol: BAM1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: BARELY ANY MERISTEM 1 (BAM1) is a plasma membrane leucine-rich repeat receptor-like Ser/Thr
  kinase of the CLAVATA1 clade. Its extracellular LRR domain binds CLV3 and a broad range of other CLE
  peptides, with wider ligand specificity than CLV1, and its cytoplasmic kinase phosphorylates CIK co-receptor
  kinases and the receptor-like cytoplasmic kinases PBL34/35/36. BAM1 forms homomers and heteromers with
  BAM2 and CLV1. In the shoot meristem it acts redundantly with CLV1 as a direct CLV3 receptor that restricts
  WUSCHEL expression. BAM1 is normally expressed in the meristem periphery and is up-regulated in the
  centre when CLV1 is lost, which compensates for clv1 loss. Outside the meristem, BAM1 acts with BAM2
  and BAM3 in early anther cell-layer specification, male gametophyte and ovule development, leaf vascular
  patterning, and CLE25/26/45-triggered suppression of root protophloem differentiation.
