- term:
    id: GO:0050897
    label: cobalt ion binding
  evidence_type: HDA
  original_reference_id: PMID:20018591
  qualifier: enables
  review:
    summary: The metal-affinity screen suggests association, but target-specific direct binding remains
      unresolved.
    action: UNDECIDED
    reason: Full PMID:20018591 uses metal-loaded IMAC on mitochondrial extracts and identifies multiple
      proteins from enriched gel bands. This does not make metal binding false or require a physiological
      cofactor role; however, the exact target rows in supplemental S3/S4 could not be recovered, and
      direct binding versus co-purification is unresolved. Preserve the experimental annotation pending
      target-specific evidence rather than replacing it with the enzyme cofactor.
