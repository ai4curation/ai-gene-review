    id: GO:0050832
    label: defense response to fungus
  evidence_type: IMP
  original_reference_id: PMID:22188168
  qualifier: acts_upstream_of_or_within
  review:
    summary: ARGAH2 overexpression reduces susceptibility to Botrytis in the tested assay.
    action: KEEP_AS_NON_CORE
    reason: The abstract directly states the native transgenic resistance phenotype; simultaneous silencing
      did not increase susceptibility. Retain this contextual defense association without asserting an
      essential antifungal function or direct pathogen toxicity.
