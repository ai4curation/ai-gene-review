- term:
    id: GO:0009445
    label: putrescine metabolic process
  evidence_type: IMP
  original_reference_id: PMID:22188168
  qualifier: acts_upstream_of_or_within
  review:
    summary: The agmatinase reaction directly supplies putrescine.
    action: MODIFY
    reason: Both Arabidopsis paralogs support an ADC-dependent route in yeast, and purified ARGAH2 has
      direct coupled biochemical support. This establishes synthetic capacity, while its fractional contribution
      to endogenous plant putrescine flux and stress-dependent dominance remain unresolved. The older
      simultaneous-silencing study is corroborative metabolic context, not proof that every tissue depends
      on this route.
    supported_by:
    - *id003
    proposed_replacement_terms:
