  review:
    summary: A direct role of ARGAH2 in proline metabolism is unresolved.
    action: UNDECIDED
    reason: PMID:22188168 reports amino-acid pool changes after overexpression or simultaneous arginase
      silencing, but accessible text does not resolve the proline-specific experiment. Native OAT genetics
      limits a simple arginase→OAT→proline synthesis model, without ruling out nutritional or indirect
      effects. Full target-specific flux or mechanistic evidence is needed before accepting this process
      assignment.
