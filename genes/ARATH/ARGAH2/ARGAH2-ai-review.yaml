id: Q9ZPF5
gene_symbol: ARGAH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: ARGAH2 is a manganese-dependent arginase/agmatinase with demonstrated arginine-to-ornithine/urea
  and agmatine-to-putrescine activities. It supplies most measured arginase activity in the examined germinating
  seedlings and can participate with arginine decarboxylase in putrescine production. Mitochondrial matrix
  targeting and a chloroplast pool have been demonstrated in distinct expression systems. Phosphatidic
  acid binds the enzyme and stimulates arginase activity in vitro; effects on defense and amino-acid pools
  depend on tissue and treatment.
