  label: Arabidopsis thaliana (Mouse-ear cress)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for ETR1, the Arabidopsis ethylene receptor. This is the best-behaved
  gene in the ARGO139 cohort: the top four calls are all exact GOA matches and between them cover
  all three of this review's core functions - ethylene receptor activity, ethylene binding, detection
  of ethylene stimulus, and negative regulation of the ethylene-activated signalling pathway - at
  scores from 19.6 to 18.5. Nothing in the top five is wrong. The value is entirely confirmatory:
  every call is already annotated, several by IMP or IDA. Assessment: 3 correct not novel (CNN).
