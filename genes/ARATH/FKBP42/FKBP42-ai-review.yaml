  review:
    summary: The unconditional absence of TWD1 PPIase activity is unresolved in light of new domain-level
      evidence.
    action: UNDECIDED
    reason: This row is negated and asserts absence, not presence. The historical negative assays and
      the 2025 synthesis support failure to detect activity under the tested conditions. The July2026
      preprint instead reports CaM-dependent tetrapeptide isomerization for recombinant FKBD1–180, inhibited
      by FK506/rapamycin and retained with EGTA. Its Figure5 does not establish catalysis by intact membrane-anchored
      TWD1, and Results versus Methods name AFPF versus ALPF substrates. These limits leave the general
      negative claim unresolved. No contextual extension is present, so prose cannot convert this NOT
      into a conditional assertion or justify accepting both signs.
