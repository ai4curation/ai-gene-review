gene_symbol: FKBP42
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
description: FKBP42/TWISTED DWARF1 is a membrane-associated immunophilin-like regulator of selected ABC
  transporters. It binds ABCB1 and ABCB19, promotes their plasma-membrane localization and auxin transport,
  and works with HSP90 in transporter maturation and stability. A separate TPR-mediated interaction with
  vacuolar ABCC transporters modulates conjugate uptake. TWD1 has experimentally demonstrated antiaggregation
  activity and calmodulin binding and occurs at the plasma membrane, endoplasmic reticulum and tonoplast.
  Its transport-regulatory functions influence organ and cell elongation, leaf shape, stamen growth and
  pollen development. Calmodulin-dependent prolyl isomerase activity has recently been reported for its
  isolated FKBP domain in a preprint; activity of intact native TWD1 and direct isomerization of an ABCB
  peptide bond remain unresolved.
