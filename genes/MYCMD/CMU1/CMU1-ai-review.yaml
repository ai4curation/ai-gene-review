- term:
    id: GO:0140502
    label: effector-mediated suppression of host salicylic acid-mediated innate immune signaling
  evidence_type: IDA
  original_reference_id: PMID:30651637
  qualifier: involved_in
  review:
    summary: >-
      Cmu1 lowers host salicylic acid: maize infected with a cmu1 deletion strain accumulates about tenfold more
      SA, and the enzyme is proposed to divert chorismate from plastidic SA synthesis. ZmKWL1 inhibition of
      Cmu1 activity (Han et al. 2019) reinforces that the enzymatic activity is the virulence mechanism.
    action: ACCEPT
    reason: >-
      A symbiont-side effector term, appropriately used instead of a plant-side defense term. Participation
      passes: CMU1 itself catalyses the step (chorismate to prephenate) that drains the SA precursor pool, so
      it does work in the process rather than being required for or acted upon by it. Strictly the documented
      effect is on host SA accumulation (biosynthesis) rather than on SA signalling components, and GO has no
      symbiont-side term for suppression of host SA biosynthesis, so this is the closest available term. The
      primary SA data are from Djamei et al. (2011); the PHI-base curator read the 2019 full text.
    additional_reference_ids:
    - PMID:21976020
    - PMID:34414650
    supported_by:
    - reference_id: PMID:30651637
      supporting_text: The secreted fungal chorismate mutase Cmu1 presumably affects biosynthesis of the plant
        immune signal salicylic acid by channelling chorismate into the phenylpropanoid pathway
    - reference_id: PMID:34414650
      supporting_text: Infecting plants with a Cmu1 deletion mutant of U. maydis resulted in a 10‐fold increase
        of SA compared to infection with the wild type (Djamei et al., 2011).
    - reference_id: PMID:34414650
      supporting_text: It was proposed that Cmu1 acts in conjunction with a cytosolic plant CM, thereby
        extracting more chorismate from the plastids, leading to lower substrate availability for plastidic SA
        biosynthesis.
    - reference_id: file:MYCMD/CMU1/CMU1-deep-research-falcon.md
      supporting_text: Cmu1 is an enzyme that affects SA accumulation, not an SA receptor or a demonstrated
        direct modifier of SA-signalling proteins.
