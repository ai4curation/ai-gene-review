gene_symbol: CMU1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:5270
  label: Mycosarcoma maydis
description: >-
  CMU1 (UMAG_05731) encodes a secreted chorismate mutase (EC 5.4.99.5) of the maize smut fungus Ustilago
  maydis (Mycosarcoma maydis). The 290-residue precursor carries an N-terminal signal peptide and an AroQ-class
  eukaryotic chorismate mutase fold, and forms homodimers. Unlike housekeeping chorismate mutases it is not
  allosterically regulated by tryptophan or tyrosine. CMU1 is strongly induced during biotrophic growth, is
  secreted by hyphae into the maize apoplast, is taken up by plant cells and spreads to neighbouring cells,
  where it acts in the host cytosol. There it converts chorismate to prephenate and heterodimerizes with host
  cytosolic chorismate mutase, which is thought to pull chorismate out of plastids and away from
  isochorismate-dependent salicylic acid synthesis, increasing phenylpropanoid flux. Maize infected with a
  cmu1 deletion strain accumulates about ten times more salicylic acid, and the mutant forms fewer tumours. The
  maize kiwellin ZmKWL1 binds an extended loop region specific to fungal secreted chorismate mutases and
  inhibits CMU1 catalytic activity, acting as a host counter-defence.
