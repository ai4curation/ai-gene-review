  supporting_entities:
  - InterPro:IPR037039
  review:
    summary: >-
      InterPro2GO mapping from the eukaryotic AroQ chorismate mutase superfamily, which is defined by
      housekeeping enzymes of the Phe/Tyr branch of the shikimate pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The domain-based inference assumes the housekeeping role of intracellular chorismate mutases. CMU1 is a
      secreted paralogue that acts in the host cytosol, is insensitive to the Trp/Tyr feedback that regulates
      biosynthetic chorismate mutases, and functions to redirect host chorismate away from salicylic acid
      synthesis, not to supply aromatic amino acids to the fungus. Its prephenate product does enter host
      phenylpropanoid flux, so the term is not strictly wrong, but it misrepresents the gene's biological role.
    supported_by:
    - reference_id: PMID:21976020
      supporting_text: proteins unlikely to act in the fungal-host interface like a chorismate mutase
    - reference_id: PMID:34414650
      supporting_text: These results suggest that Cmu1 increases the virulence of U. maydis by directing the
        metabolite flow into the phenylpropanoid pathway, reducing SA production.
