core_functions:
- description: >-
    Secreted, host-translocated chorismate mutase that converts chorismate to prephenate in the maize cytosol,
    draining the chorismate pool available for salicylic acid biosynthesis and redirecting flux into the
    phenylpropanoid pathway, thereby suppressing salicylic acid-dependent immunity and promoting tumour
    formation.
  molecular_function:
    id: GO:0004106
    label: chorismate mutase activity
  directly_involved_in:
  - id: GO:0140502
    label: effector-mediated suppression of host salicylic acid-mediated innate immune signaling
  locations:
  - id: GO:0044164
    label: host cell cytosol
  - id: GO:0140593
    label: host apoplast
  supported_by:
  - reference_id: PMID:30651637
    supporting_text: The secreted fungal chorismate mutase Cmu1 presumably affects biosynthesis of the plant
      immune signal salicylic acid by channelling chorismate into the phenylpropanoid pathway
  - reference_id: PMID:21976020
    supporting_text: The enzyme is taken up by plant cells, can spread to neighbouring cells and changes the
      metabolic status of these cells through metabolic priming.
  - reference_id: PMID:34414650
    supporting_text: Infecting plants with a Cmu1 deletion mutant of U. maydis resulted in a 10‐fold increase
      of SA compared to infection with the wild type (Djamei et al., 2011).
proposed_new_terms: []
suggested_questions:
- question: >-
    CMU1 and other secreted chorismate mutases and isochorismatases (e.g. Verticillium VdIsc1, Phytophthora
    PsIsc1, nematode Mi-CM-3) lower host salicylic acid by acting on its biosynthetic precursors, not on SA
    signalling components. Should GO add a symbiont-side term such as "symbiont-mediated suppression of host
    salicylic acid biosynthetic process" so these enzymes are not annotated to a signalling term?
- question: >-
    Is the heterodimer with host cytosolic chorismate mutase ZmCM2 required for the virulence function, or does
    CMU1 catalysis alone suffice? This determines whether a modulation-of-host-enzyme activity term is
    warranted in addition to the catalytic activity.
suggested_experiments:
- description: >-
    Isotope-labelled chorismate or shikimate flux tracing in maize leaves infected with wild-type, cmu1 deletion
    and catalytically dead (R183A/K194A) strains, to measure directly the partitioning of chorismate between
    prephenate/phenylpropanoids and isochorismate/salicylic acid.
- description: >-
    Complement the cmu1 deletion with a CMU1 variant lacking the extended loop region (no ZmKWL1 binding but
    catalytically active) and test virulence on wild-type and ZmKWL1-silenced maize, to separate escape from
    kiwellin inhibition from intrinsic catalytic contribution.
