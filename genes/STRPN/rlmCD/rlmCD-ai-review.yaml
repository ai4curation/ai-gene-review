  label: Streptococcus pneumoniae TIGR4
description: RlmCD (SP_1029) is the dual-site S-adenosylmethionine-dependent 23S rRNA uridine-C5 methyltransferase
  of Streptococcus pneumoniae TIGR4. Native SP_1029 disruption abolishes m5U747 and m5U1939, and recombinant
  protein catalyzes methyl transfer to corresponding rRNA substrates. Its TRAM, central and catalytic
  domains recognize the two RNA sequences through distinct contacts while positioning each uridine in
  a shared catalytic pocket. U747 methylation promotes efficient neighboring G748 methylation by RlmAII,
  with an effect on telithromycin susceptibility demonstrated in specific erm(B)-carrying pneumococcal
  backgrounds; RlmCD does not itself catalyze G748 methylation.
