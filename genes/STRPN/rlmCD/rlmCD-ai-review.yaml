    summary: RlmCD directly executes rRNA base methylation in TIGR4.
    action: ACCEPT
    reason: The TreeGrafter process assignment is supported by target-strain chemical measurements in
      PMID:26365244. SP_1029 deletion removes methyl groups from both U747 and U1939, while biochemical
      studies identify methyl transfer by RlmCD itself. This is direct enzymatic participation, not an
      inference from telithromycin susceptibility or an assumption that RlmCD performs the neighboring
      RlmAII reaction.
