core_functions:
- description: SAM-dependent methyl transfer to C5 of U747 and U1939 in 23S rRNA. TIGR4 knockout LC/MS
    establishes native dual-site chemistry; recombinant substrate assays and engineered trapped-intermediate
    structures explain distinct recognition around a shared catalytic pocket. Neighboring G748 methylation
    is performed by RlmAII, not RlmCD.
