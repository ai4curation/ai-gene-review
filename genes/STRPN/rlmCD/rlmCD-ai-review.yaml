- id: PMID:26365244
  title: RlmCD-mediated U747 methylation promotes efficient G748 methylation by methyltransferase RlmAII
    in 23S rRNA in Streptococcus pneumoniae; interplay between two rRNA methylations responsible for telithromycin
    susceptibility.
  findings:
  - statement: Native TIGR4 SP_1029 disruption removes the U1939 methyl group as well as U747 methylation.
    supporting_text: In the SP_1029-disrupted cells, a fragment lacking one methyl group (AAAUUCCUUGp)
      was detected at m/z 1060.45, indicating that SP_1029 can also catalyze methylation at U1939 as well
      as U747.
  - statement: The study identifies SP_1029 as the dual-specific enzyme RlmCD.
    supporting_text: Therefore, we conclude that S. pneumoniae SP_1029 encodes the dual-specific methyltransferase
      RlmCD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Figures 2–3 compare TIGR4 and Sp332 directly; drug-response and
      G748 effects are background-qualified (TIGR4 with erm(B), clinical S1). Methods attribute pTKY1196
      to TIGR4 whereas Results describe S1; the plasmid donor discrepancy does not negate the native knockout
      chemistry and is retained explicitly in notes.
- id: PMID:28949991
  title: Structural insights into substrate selectivity of ribosomal RNA methyltransferase RlmCD.
  findings:
  - statement: Full-length recombinant protein and the 1–454 catalytic construct methylate an rRNA U747
      substrate.
    supporting_text: As summarized in Fig 1B, our results showed that both full-length RlmCD and its shorter
      construct RlmCDs exhibit strong MTase activity when compared with the glutamine mutant of E443 whose
      equivalent residues in RumA and TrmA are proposed to be the general base for the enzymes (S1 Fig),
      indicating that RlmCD can catalyze the methylation of the rRNA helix 35 and RlmCDs alone is sufficient
      for its MTase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected, including U747A/C/G substrate controls, tritiated-SAM assays and
      the absence of the RumA-like iron-sulfur cluster. The 18-nt RNA crystal pose is not treated as productive
      substrate recognition; the later 2018 study explicitly identifies it as physiologically irrelevant.
- id: PMID:30388185
  title: Unveiling the structural features that determine the dual methyltransferase activities of Streptococcus
    pneumoniae RlmCD.
  findings:
  - statement: The recombinant constructs are explicitly derived from locus sp_1029.
    supporting_text: The RlmCD (sp_1029) ORF was amplified from S. pneumoniae genomic DNA via PCR.
  - statement: Separate U747 and U1939 RNA substrates are tested in methyltransferase assays.
    supporting_text: Comparison of MTase activities of wild-type RlmCD and its mutants using an U747-containing
      RNA segment analogous to 23S rRNA hairpin 35 or U1939-containing RNA segment representing 1933–1962
      of 23S rRNA as substrate.
  - statement: The earlier 18-nt RNA-bound structure is a packing interaction rather than a productive
      binding pose.
    supporting_text: In further attempts to explore the specific recognition of RlmCD for the U747 site
      of 23S rRNA, however, the complex structure of RlmCD with S-adenosyl homocysteine (SAH) and an 18-nt
      U747-containing RNA segment that we obtained only reflect a physiologically irrelevant interaction,
      likely due to crystal packing.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. RNA-bound structures use engineered 1–454 E443Q protein and short
      RNA analogues, trapping covalent intermediates rather than depicting unmodified full-length protein
      on an intact ribosome. Native site assignments are independently supported by the 2015 TIGR4 study.
