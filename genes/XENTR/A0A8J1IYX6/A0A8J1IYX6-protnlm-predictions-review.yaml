description: >-
  ProtNLM2 made no predictions (GO or subcellular location) for this Xenopus
  tropicalis protein (LOC101732819) and returned only the generic name "Protein
  kinase domain-containing protein". That name is correct but less specific than
  the gene review, which identifies an uncharacterized AGC-group protein
  serine/threonine kinase of PANTHER family PTHR24351 whose kinase domain is most
  similar to novel PKC isoforms but which lacks the C1 and C2-like regulatory
  domains, retains the ATP-binding lysine, HRD and DFG catalytic residues, and is
  inferred to act in the cytoplasm and possibly the nucleus. The gene already
  carries protein serine/threonine kinase activity, ATP binding, cytoplasm and
  nucleus in GOA, so the name adds no novel function. A PubMed search for
  LOC101732819, A0A8J1IYX6 and its Xenbase gene id returned no papers. With no GO
  or location output there is nothing to score; the absence of predictions is
  recorded as assessed.
