id: A0A8J1IYX6
gene_symbol: prkcd
taxon:
  id: NCBITaxon:8364
  label: Xenopus tropicalis
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a Xenopus tropicalis protein kinase C delta
  ortholog. ProTrek recognises the AGC kinase group and then picks the wrong member of it
  three times: cAMP-dependent (PKA), cGMP-dependent (PKG) and AMP-activated protein kinase
  activities occupy ranks 1-3, with the cAMP-dependent kinase complex at rank 4. PKCdelta
  is a novel-PKC, activated by diacylglycerol and phosphatidylserine and calcium-
  independent, with tandem C1 domains and a degenerate C2 domain - none of which the
  cyclic-nucleotide kinases share. Scores are modest (13.7 to 10.8) and the free-text
  channel is also lost, returning casein kinase and pseudokinase descriptions. The generic
  correct term, protein serine/threonine kinase activity, is already in GOA by IBA and is
  not improved on. ProtNLM2 made no GO prediction for this protein.
  Assessment: 0 correct novel (COR), 0 correct not novel (CNN), 1 less precise (LSP),
  0 uncertain (UNC), 2 incorrect (PLI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/XENTR/A0A8J1IYX6/A0A8J1IYX6-uniprot.txt
  - genes/XENTR/A0A8J1IYX6/A0A8J1IYX6-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 13.67). PKA and PKC are both AGC-group serine/threonine kinases
        with homologous catalytic domains, so the fold-level inference is sound and the term
        is a strict descendant of the protein kinase activity annotated in GOA - a curator
        climbing to the parent gets a correct annotation, which is why this is scored LSP.
        But PKCdelta is not cAMP-regulated: its activators are diacylglycerol and
        phosphatidylserine, and its regulatory region is C1/C2 rather than a cyclic-nucleotide
        binding domain. Naming the second messenger is the whole content of the term, and it
        is wrong.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0004692
      label: cGMP-dependent protein kinase activity
    predicted_term_type: GO_MF
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 12.62). The second cyclic-nucleotide-dependent AGC kinase, offered
        alongside the first and mutually exclusive with it. Together ranks 1-3 propose three
        different regulatory inputs for one kinase within 1.6 score units, which is a clear
        statement that the model has resolved the group and not the subfamily - and the
        subfamily is what distinguishes PKCdelta's DAG-dependent, caspase-cleavable,
        apoptosis-linked biology from PKA's.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0004679
      label: AMP-activated protein kinase activity
    predicted_term_type: GO_MF
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 3 (score 12.08). AMPK is a CAMK-group kinase that functions as a heterotrimer
        with beta and gamma regulatory subunits; PKCdelta is a monomeric AGC kinase. This is
        the third distinct kinase identity proposed for the same sequence. Note that the
        UniProt entry's own PANTHER assignment (PTHR24351, ribosomal protein S6 kinase) is
        also off-target, so the automatic annotation and the retrieval are independently
        confused about this protein - the RefSeq protein name is what identifies it
        correctly.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
