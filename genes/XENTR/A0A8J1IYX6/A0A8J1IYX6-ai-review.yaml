  review:
    summary: >-
      PAINT phylogenetic inference (node PTN008614470) places nuclear activity on
      the family node containing this protein, with descendant experimental
      evidence from fission yeast (PomBase:SPCC24B10.07), budding yeast
      (SGD:S000004710), and other family members. Kinases of the ribosomal
      protein S6 kinase family (notably the RSK and MSK subfamilies) act in the
      nucleus, where they phosphorylate transcription-associated substrates, so
      nuclear activity is a phylogenetically plausible property of this
      uncharacterized family member.
    action: ACCEPT
    reason: >-
      The IBA reflects a considered PAINT judgment placing nuclear activity at an
      ancestral node of the S6-kinase family, supported by experimental
      annotations on descendant members. There is no gene-specific evidence for
      or against nuclear localization of this protein, and no target-specific
      indication of loss, so the phylogenetic inference is retained as the best
      available evidence.
