- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The protein carries a complete protein kinase domain (residues 113-366)
      with the PROSITE serine/threonine-kinase active-site signature (PS00108),
      an ATP-binding-site signature (PS00107) and an AGC-kinase C-terminal
      domain. The PAINT node PTN008614469 covers the whole AGC family PTHR24351
      and is seeded by many experimentally characterized active kinases. These
      include human RSK/MSK/S6K kinases (UniProtKB:Q15418, O75582, O75676,
      P23443, Q9UBS0) and mouse, rat, fly, yeast, fission yeast,
      Dictyostelium, Plasmodium and plant members. Protein serine/threonine
      kinase activity is the shared molecular function of the family, including
      the PKC/PKN branch, which is where the target's catalytic domain is
      closest (RESULTS-rereview.md).
    action: ACCEPT
    reason: >-
      This is the primary molecular function. It is inferred from domain
      architecture, from conserved catalytic motifs and from placement within a
      family in which serine/threonine kinase activity is experimentally
      established in many descendants. The family review (PTHR24351-review.yaml)
      assesses the node as SOUND. The target retains the complete catalytic
      machinery: the VAIK beta-3 lysine (K142, which is its own UniProt
      ATP-binding feature), the HRD catalytic aspartate (D235, in motif
      IHRDLKPDN at 232) and the DFG magnesium-binding aspartate (D253, in motif
      ICDFG at 251). The activation-loop phospho-acceptor threonine of AGC
      kinases (PKC delta T507) is a glycine in the target (G269). This could
      change how the kinase is activated or how active it is. It does not remove
      a catalytic residue, so it is not grounds to reject the inherited
      activity. It is recorded as an open question.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN008614469
        source_label: PTHR24351 AGC-family node for protein Ser/Thr kinase activity
        source_status: SUPPORTS_TRANSFER
        comment: >-
          IBD node (paint snapshot 20241120) seeded by experimentally
          characterized active kinases across the family; assessed SOUND in
          PTHR24351-review.yaml. The target is not among the seeds (it is
          uncharacterized), so there is no self-source to adjudicate.
