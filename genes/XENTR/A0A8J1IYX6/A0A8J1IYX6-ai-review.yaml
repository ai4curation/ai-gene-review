      - source_id: UniProtKB:Q15418
        source_label: human RSK1 (RPS6KA1)
        source_status: SUPPORTS_TRANSFER
        comment: active member; N-terminal kinase-domain HRD aspartate D187 verified.
      - source_id: UniProtKB:O75582
        source_label: human MSK1 (RPS6KA5)
        source_status: SUPPORTS_TRANSFER
      - source_id: UniProtKB:Q8I4W3
        source_label: Plasmodium falciparum RAC-beta (Akt-like) kinase
        source_status: SUPPORTS_TRANSFER
