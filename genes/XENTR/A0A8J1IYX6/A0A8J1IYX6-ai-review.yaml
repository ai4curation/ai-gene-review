gene_symbol: LOC101732819
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:8364
  label: Xenopus tropicalis
description: >-
  A0A8J1IYX6 (LOC101732819) is an uncharacterized 424-residue serine/threonine
  protein kinase of the AGC kinase group in Xenopus tropicalis. Although the
  RefSeq-derived protein name is "Protein kinase C delta type", the protein lacks
  the C1 (diacylglycerol-binding) and C2-like regulatory domains that define PKC
  family kinases; its architecture comprises a long intrinsically disordered
  N-terminal region rich in basic and acidic residues (approximately residues
  1-103), a single protein kinase domain (residues 113-366), and an AGC-kinase
  C-terminal extension (residues 367-424). PANTHER classifies the protein within
  the ribosomal protein S6 kinase family (PTHR24351), a clade of AGC kinases that
  includes the p70/p85 S6 kinases (S6K), p90 ribosomal S6 kinases (RSK),
  mitogen- and stress-activated kinases (MSK), and related fungal and protist
  kinases such as Sch9 and psk1. Members of this family are activated downstream
  of growth factor and nutrient signaling and phosphorylate serine/threonine
  residues on substrates in the cytoplasm and nucleus, regulating protein
  synthesis, cell growth, and transcription. No gene-specific experimental
  characterization of this Xenopus tropicalis protein has been published; its
  molecular function as an ATP-dependent protein serine/threonine kinase is
  inferred from domain architecture, conserved catalytic and ATP-binding motifs,
  and phylogenetic placement.
