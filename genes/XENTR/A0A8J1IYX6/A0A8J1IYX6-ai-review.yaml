id: A0A8J1IYX6
gene_symbol: LOC101732819
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:8364
  label: Xenopus tropicalis
description: >-
  A0A8J1IYX6 (LOC101732819) is an uncharacterized 424-residue protein
  serine/threonine kinase of the AGC kinase group in Xenopus tropicalis. It
  consists of a long intrinsically disordered N-terminal region rich in basic and
  acidic residues (approximately residues 1-103), a single protein kinase domain
  (residues 113-366) and an AGC-kinase C-terminal extension (residues 367-424).
  The catalytic domain is most similar to those of the novel protein kinase C
  isoforms (about 41-43% identity to PKC theta and PKC delta) and, in a distance
  tree, branches at the base of the PKC/PKN clade. It is not a PKC delta
  ortholog: X. tropicalis has separate prkcd and prkcq genes (about 88% identity
  to their human orthologs over the same region), and A0A8J1IYX6 lacks the C1
  diacylglycerol/phorbol-ester-binding and C2-like regulatory domains that define
  PKCs. The automated name "Protein kinase C delta type" therefore reflects
  kinase-domain similarity only. The ATP-binding lysine (K142), the HRD catalytic
  aspartate (D235) and the DFG magnesium-binding aspartate (D253) are retained.
  The activation-loop threonine that PDK1 phosphorylates in most AGC kinases is
  replaced by glycine (G269), and no C-terminal hydrophobic motif is
  recognisable. Regulation of this kinase may therefore differ from canonical
  AGC kinases. No experimental characterization has been published. Its function
  as an ATP-dependent protein serine/threonine kinase, acting in the cytoplasm
  and possibly the nucleus, is inferred from domain architecture, conserved
  catalytic motifs and phylogenetic placement in the broad AGC kinase family
  PTHR24351. That family includes the S6K/RSK/MSK, AKT, SGK, PKN and PKC kinases.
