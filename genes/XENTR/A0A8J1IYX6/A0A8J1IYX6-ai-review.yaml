    label: protein serine/threonine kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The protein carries a complete protein kinase domain (residues 113-366)
      with the PROSITE serine/threonine-kinase active-site signature (PS00108),
      an ATP-binding-site motif, and an AGC-kinase C-terminal domain. The PAINT
      node (PTN008614469) is seeded by extensive experimental annotations across
      the family, including human RSK/MSK/S6K kinases (UniProtKB:Q15418,
      O75582, O75676, P23443, Q9UBS0) and mouse, rat, fly, yeast, fission
      yeast, Dictyostelium, and plant members. Protein serine/threonine kinase
      activity is the core molecular function of the whole family.
    action: ACCEPT
    reason: >-
      This is the primary molecular function inferred from domain architecture,
      conserved catalytic motifs, and phylogenetic placement within a family in
      which serine/threonine kinase activity is experimentally established in
      many descendants. Family-level inspection (PTHR24351-review.yaml) confirms
      the node placement is sound and the target retains the complete catalytic
      machinery: the VAIK beta-3 lysine (K142, its own UniProt ATP-binding
      feature), the HRD catalytic aspartate (D235, motif IHRDLKPDN at 232), and
      the DFG magnesium-binding aspartate (D253, motif ICDFG at 251).
