- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The kinase binds ATP as the phosphate donor for its catalytic reaction. The
      UniProt entry records an ATP-binding site at position 142 within the
      protein kinase domain, supported by the InterPro protein kinase ATP
      binding site signature (IPR017441). ATP binding is mechanistically
      required for kinase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      ATP binding is accurate and mechanistically essential, but it is
      functionally subsumed by the protein serine/threonine kinase activity
      annotation. ATP binding is a cofactor/substrate-binding property inherent
      to kinase function rather than an independent core function.
    supported_by:
    - reference_id: file:XENTR/A0A8J1IYX6/A0A8J1IYX6-uniprot.txt
      supporting_text: "BINDING 142 /ligand=\"ATP\""
    - reference_id: file:XENTR/A0A8J1IYX6/A0A8J1IYX6-uniprot.txt
      supporting_text: "ATP-binding"
- term:
    id: GO:0016301
    label: kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      This is a very broad parent term encompassing all kinase activities
      (protein kinases, lipid kinases, sugar kinases, etc.). The protein is
      specifically a protein serine/threonine kinase, and the more specific term
      GO:0004674 is already annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0016301 kinase activity is too general and is redundant with the more
      specific GO:0004674 protein serine/threonine kinase activity already
      present.
- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      This is the broadest ancestral term for all transferase activities. While
      the protein is technically a transferase (phosphotransferase), this term
      provides essentially no biological specificity and is fully subsumed by
      the more specific kinase and protein serine/threonine kinase activity
      annotations.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0016740 transferase activity is the broadest possible functional
      classification and is entirely redundant with the more informative
      GO:0004674 and GO:0016301 annotations.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: >-
      The InterPro serine/threonine-kinase active-site signature (IPR008271)
      correctly identifies the protein as a protein kinase, but the derived
      protein kinase activity term is less specific than the serine/threonine
      kinase term available from other evidence lines.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PANTHER/PAINT phylogenetic inference places the protein in the ribosomal
      protein S6 kinase family (PTHR24351) and propagates protein
      serine/threonine kinase activity and cytoplasmic/nuclear activity from
      ancestral nodes seeded by experimentally characterized family members
      (human RSK/MSK/S6K kinases, yeast and fission yeast kinases, and others).
- id: GO_REF:0000104
  title: Electronic Gene Ontology annotations created by transferring manual GO annotations
    between related proteins based on shared sequence features
  findings:
  - statement: >-
      Sequence feature-based transfer recovers accurate but overly broad
      functional terms (nucleotide binding, kinase activity, transferase
      activity) that are redundant with the more specific serine/threonine
      kinase annotation.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Combined IEA methods correctly recover the specific protein
      serine/threonine kinase activity and ATP binding annotations from InterPro
      domain architecture.
- id: file:XENTR/A0A8J1IYX6/A0A8J1IYX6-deep-research-falcon.md
  title: Deep research summary for LOC101732819 in Xenopus tropicalis
  findings:
  - statement: >-
      The report accepts the RefSeq-derived protein name "Protein kinase C delta
      type" and summarizes canonical mammalian PKCdelta/PRKCD biology (C1A/C1B
      DAG-binding domains, calcium-independent C2-like domain, caspase-3
      cleavage, apoptotic signaling). This content conflicts with the actual
      sequence features of A0A8J1IYX6, which has no C1 or C2 domains and is
      classified by PANTHER in the ribosomal protein S6 kinase family
      (PTHR24351); the report itself notes that no studies specifically
      investigating LOC101732819 were identified.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      The research report was generated from the RefSeq SubName and describes
      mammalian PKCdelta rather than this protein. A0A8J1IYX6 lacks the C1/C2
      regulatory domains diagnostic of PKC family kinases (UniProt features show
      only a disordered N-terminus, one kinase domain, and an AGC-kinase
      C-terminal domain), and both the PANTHER family assignment (PTHR24351,
      ribosomal protein S6 kinase) and the IBA WITH/FROM donors (RSK/MSK/S6K/
      Sch9-family genes) place it outside the PKC family. PKCdelta-specific
      claims from this file should not be used to support annotations of this
      gene.
- id: file:XENTR/A0A8J1IYX6/A0A8J1IYX6-uniprot.txt
  title: UniProt entry A0A8J1IYX6
  findings:
  - statement: >-
      Identifies the protein as belonging to the protein kinase superfamily with
      a protein kinase domain (residues 113-366) and AGC-kinase C-terminal
      domain (residues 367-424), an ATP-binding site at position 142, and a
      disordered N-terminal region (residues 1-103) enriched in basic and
      acidic residues. No C1 or C2 domains are annotated.
  - statement: >-
      PANTHER classifies the protein in family PTHR24351 (ribosomal protein S6
      kinase), indicating membership of the RSK/MSK/S6K branch of AGC kinases
      rather than the PKC family, despite the RefSeq-derived name "Protein
      kinase C delta type".
core_functions:
- description: >-
    ATP-dependent protein serine/threonine kinase of the AGC group, ribosomal
    protein S6 kinase family, that catalyzes transfer of the gamma-phosphate of
    ATP to serine or threonine residues of substrate proteins. Its physiological
    substrates in Xenopus tropicalis are uncharacterized; by phylogenetic
    inference it acts in the cytoplasm and nucleus, as established for
    experimentally characterized RSK/MSK/S6K family members.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
