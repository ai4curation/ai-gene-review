- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      PAINT phylogenetic inference places nuclear activity on node PTN008614470,
      a Eukaryota-level node of the broad AGC kinase family PTHR24351. The
      descendant experimental evidence comes from fission yeast
      (PomBase:SPCC24B10.07), budding yeast (SGD:S000004710), trypanosome
      (Q582V7) and pig AKT1 (G9BWQ1). Several branches of the family act at
      least partly in the nucleus, including RSK/MSK, AKT and some PKC isoforms.
      Nuclear activity is therefore a plausible inherited property of this
      uncharacterized PKC-like member. The target has no annotated
      nuclear-localization signal, although its basic N-terminal region could
      contain one.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBA is a considered PAINT judgment, and nothing specific to the target
      argues for loss, so the annotation is kept. It is kept as non-core rather
      than accepted. In PTHR24351 nuclear activity is a context-dependent
      property of particular branches, not a defining one: many members act
      mainly at the plasma membrane or in the cytoplasm. The family review
      (PTHR24351-review.yaml) rates this node assessment UNRESOLVED. The target
      also sits on a divergent PKC-like branch, which is not the RSK/MSK or
      fungal lineage behind most of the nuclear evidence. Cytoplasm is the
      better-supported site of action.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN008614470
        source_label: PTHR24351 AGC-family localization node (Eukaryota)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Node asserts is_active_in nucleus (IBD, paint snapshot 20260828); see
          PTHR24351-review.yaml, where this node is assessed UNRESOLVED. Nuclear
          localization is the least conserved of the properties propagated from
          this node, and the target's own clade (PKC-like, per
          A0A8J1IYX6-bioinformatics/RESULTS-rereview.md) is not the source of the
          nuclear evidence.
      - source_id: PomBase:SPCC24B10.07
        source_label: fission yeast PTHR24351-family kinase
        source_status: SUPPORTS_TRANSFER
        comment: nuclear-localized fungal seed of the node.
      - source_id: UniProtKB:Q582V7
        source_label: Trypanosoma brucei Ser/Thr kinase (putative)
        source_status: SUPPORTS_TRANSFER
      - source_id: SGD:S000004710
        source_label: budding yeast PTHR24351-family kinase
        source_status: SUPPORTS_TRANSFER
      residue_claims_not_applicable: >-
        Subcellular localization is not a point-residue property; nuclear activity
        is inferred phylogenetically from the PAINT node and cannot be expressed as
        a catalytic-residue claim. The target retains no nuclear-targeting sequence
