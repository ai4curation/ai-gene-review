references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: >-
      The InterPro serine/threonine-kinase active-site signature (IPR008271)
      correctly identifies the protein as a protein kinase, but the derived
      protein kinase activity term is less specific than the serine/threonine
      kinase term available from other evidence lines.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PANTHER/PAINT phylogenetic inference places the protein in PTHR24351. Despite
      its name ("ribosomal protein S6 kinase"), this is a broad AGC kinase family
      that includes the S6K/RSK/MSK, AKT, SGK, PKN and PKC kinases. The inference
      propagates protein serine/threonine kinase activity and cytoplasmic and
      nuclear activity from Eukaryota-level nodes seeded by experimentally
      characterized family members.
- id: GO_REF:0000104
  title: Electronic Gene Ontology annotations created by transferring manual GO annotations
    between related proteins based on shared sequence features
  findings:
  - statement: >-
      Transfer based on sequence features recovers accurate but overly broad
      functional terms (nucleotide binding, kinase activity, transferase
      activity), each entailed by the more specific serine/threonine kinase or
      ATP binding annotations.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Combined IEA methods correctly recover the specific protein
      serine/threonine kinase activity and ATP binding annotations from InterPro
      domain architecture.
- id: file:XENTR/A0A8J1IYX6/A0A8J1IYX6-deep-research-falcon.md
  title: Deep research summary for LOC101732819 in Xenopus tropicalis
  findings:
  - statement: >-
      The report accepts the RefSeq-derived protein name "Protein kinase C delta
      type" and summarizes canonical mammalian PKCdelta/PRKCD biology (C1A/C1B
      DAG-binding domains, calcium-independent C2-like domain, caspase-3
      cleavage, apoptotic signaling). That content describes the separate
      X. tropicalis prkcd gene and its human ortholog, not A0A8J1IYX6, which
      has no C1 or C2 domains. The report itself notes that no studies
      specifically investigating LOC101732819 were identified.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      The research report was generated from the RefSeq SubName and describes
      mammalian PKCdelta rather than this protein. A0A8J1IYX6 lacks the C1/C2
      regulatory domains of PKCs. UniProt features show only a disordered
      N-terminus, one kinase domain and an AGC-kinase C-terminal domain. Its
      kinase domain is only about 41% identical to PKC delta, against 88% for the
      true frog-human PKC delta ortholog pair (RESULTS-rereview.md). The
      2026-10-21 re-review corrects one point from the earlier re-review. That
      re-review said the PANTHER family places the protein outside the PKC
      group, but PTHR24351 contains all PKC isoforms, so PANTHER membership does
      not argue against a PKC-like kinase domain. The conclusion still holds:
      this is not PKC delta, and PKC delta-specific claims from this file should
      not support annotations of this gene. The file is no longer cited as
      support anywhere in this review.
- id: file:XENTR/A0A8J1IYX6/A0A8J1IYX6-uniprot.txt
  title: UniProt entry A0A8J1IYX6
  findings:
  - statement: >-
      Identifies the protein as belonging to the protein kinase superfamily with
      a protein kinase domain (residues 113-366) and AGC-kinase C-terminal
      domain (residues 367-424), an ATP-binding site at position 142, and a
      disordered N-terminal region (residues 1-103) enriched in basic and
      acidic residues. No C1 or C2 domains are annotated.
  - statement: >-
      PANTHER classifies the protein in family PTHR24351 with no subfamily
      assignment. FunFam assigns the catalytic domain to a "Protein kinase C"
      functional family. The record is a complete 424-aa sequence and is not
      flagged as a fragment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Sole primary record for the gene product; sequence features and family
      cross-references were checked against the live UniProt entry and the
      InterPro API.
- id: file:XENTR/A0A8J1IYX6/A0A8J1IYX6-bioinformatics/RESULTS-rereview.md
  title: AGC kinase placement of A0A8J1IYX6 (re-review analysis)
  findings:
  - statement: >-
      The catalytic region is closest to the novel PKCs (PRKCQ 42.7%, PRKCD 41.0%
      identity), well below the 88.5% of the frog-human PKC delta ortholog pair.
      With the out-of-family RSKR sequence excluded, the target branches at the
      base of the PKC/PKN clade, outside the prkcd and prkcq ortholog clades.
  - statement: >-
      The catalytic K142, D235 and D253 are retained. The activation-loop
      phospho-acceptor (PKC delta T507) is replaced by G269, and no C-terminal
      hydrophobic motif is recognisable.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible scripts (compare_agc_rereview.py, tree_agc_rereview.py)
      with captured outputs in the same folder. The tree is unbootstrapped and
      gives only a rough placement.
core_functions:
- description: >-
    ATP-dependent protein serine/threonine kinase of the AGC group, with a
    catalytic domain related to the PKC/PKN branch, that transfers the
    gamma-phosphate of ATP to serine or threonine residues of substrate
    proteins. Its substrates, upstream activators and biological roles are
    unknown. It lacks the PKC C1/C2 regulatory domains and the activation-loop
    phospho-threonine. By phylogenetic inference it acts in the cytoplasm.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:XENTR/A0A8J1IYX6/A0A8J1IYX6-uniprot.txt
    record_section: ["CC:SIMILARITY"]
    supporting_text: "Belongs to the protein kinase superfamily"
  - reference_id: file:XENTR/A0A8J1IYX6/A0A8J1IYX6-uniprot.txt
    record_section: ["DR:PROSITE"]
    supporting_text: "PROSITE; PS00108; PROTEIN_KINASE_ST"
  - reference_id: file:XENTR/A0A8J1IYX6/A0A8J1IYX6-bioinformatics/RESULTS-rereview.md
    supporting_text: "The HRD catalytic Asp (target D235) and DFG Asp (target D253) are retained"
suggested_questions:
- question: >-
    Is LOC101732819 an active kinase despite having glycine in place of the
    activation-loop phospho-acceptor threonine, and if so, what activates it,
    given that it has no C1/C2 domains to respond to diacylglycerol or calcium?
- question: >-
    How far does this PKC-like single-domain kinase extend across species? Is it
    an amphibian-specific duplicate, or part of an older lineage missing from
    mammals? A curated phylogeny with PANTHER subfamily placement would settle
    which characterized kinases its properties can be inferred from.
suggested_experiments:
- hypothesis: >-
    A0A8J1IYX6 is a catalytically active protein serine/threonine kinase whose
    activity does not depend on activation-loop phosphorylation.
  description: >-
    Express recombinant A0A8J1IYX6, run in vitro kinase assays with generic
    substrates (myelin basic protein, histone H1, PKC substrate peptides), and
    include a K142R kinase-dead control. Then test a G269T/E activation-loop
    variant to see whether the loop limits activity.
  experiment_type: in vitro kinase assay
- hypothesis: >-
    The protein is mainly cytoplasmic, and its basic N-terminal region may
    mediate nuclear entry.
  description: >-
    Determine the subcellular localization of a tagged protein in Xenopus cells,
    with and without the basic N-terminal region, to test cytoplasmic versus
    nuclear localization.
  experiment_type: localization imaging
