suggested_questions:
  - question: >-
      What DNA sequence does the eight-finger array of LOC101732730 recognize, and does
      the protein activate or repress transcription in the absence of a KRAB, SCAN or
      BTB effector domain?
  - question: >-
      Is LOC101732730, a single-exon gene, an expressed functional gene or a
      retrotransposed copy of a multi-exon SF440 paralog, and is it expressed in oocytes
      or early embryos as the X. laevis XlCOF proteins are?
suggested_experiments:
  - description: >-
      Determine the DNA-binding specificity of the zinc finger array (e.g. ChIP-exo or
      ChIP-seq of tagged protein in Xenopus embryos or cells, or in vitro SELEX), and
      test regulatory direction with a GAL4-DBD fusion reporter assay.
  - description: >-
      Measure expression across oogenesis and early development (RNA-seq time-course
      re-analysis or in situ hybridization) to establish where and when the gene acts.
