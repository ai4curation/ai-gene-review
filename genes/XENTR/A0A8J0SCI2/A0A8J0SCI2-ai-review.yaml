  - id: file:XENTR/A0A8J0SCI2/A0A8J0SCI2-deep-research-falcon.md
    title: Deep research summary for LOC101732730 in Xenopus tropicalis
    findings:
      - statement: >-
          The report correctly identifies the target (LOC101732730 / A0A8J0SCI2,
          gastrula zinc finger protein XlCGF17.1-like) and states explicitly that
          direct experimental literature on this specific gene is absent, so all
          functional conclusions are inferred from the C2H2 zinc finger domain
          architecture, Krueppel-family membership, and general C2H2-ZF biology.
          Its high-confidence claims (sequence-specific DNA-binding transcription
          factor, nuclear localization, modular C2H2 DNA recognition) are the ones
          quoted as supporting_text in this review.
      - statement: >-
          The report's developmental inferences (gastrulation, germ layer
          formation, pluripotency exit, BMP/Wnt/Nodal pathway context) are drawn
          by analogy to Xenopus Klf-family factors (Klf2/Klf6/Klf17 etc.). KLFs
          belong to a different PANTHER family than this protein (PTHR24381,
          classical zinc finger proteins), so these analogies are speculative
          context, not evidence; the report itself grades them moderate-to-low
          confidence.
    reference_review:
      relevance: MEDIUM
      correctness: LOW_QUALITY
      review_notes: >-
        Adjudicated against the UniProt record, GOA WITH/FROM donors, and the
        2026-08-29 re-review notes. The report targets the correct gene, is
        candid that no direct experimental studies exist, and its general
        C2H2-ZF mechanism claims (the only parts used as supporting_text here)
        are sound and consistent with UniProt/PANTHER. Marked LOW_QUALITY
        because it is an LLM-generated inference document with no gene-direct
        evidence, and its developmental-role sections rest on Klf-family
        analogies that are family-mismatched (the IBA donors and PANTHER
        assignment place this protein among classical C2H2/KZNF proteins in
        PTHR24381, not KLFs) - the earlier re-review removed a Klf attribution
        from an annotation summary for exactly this reason. Klf-derived claims
        from this file should not be used to support annotations of this gene.
  - id: file:XENTR/A0A8J0SCI2/A0A8J0SCI2-uniprot.txt
    title: UniProt entry A0A8J0SCI2
    findings:
      - statement: >-
          Identifies the protein as a 265-residue member of the krueppel
          C2H2-type zinc-finger protein family (ARBA00006991) with eight tandem
          C2H2-type zinc finger domains spanning residues 37-260 (PROSITE
          PS50157) and a disordered N-terminal region (residues 1-27); no KRAB,
          SCAN, or BTB effector domain is annotated. ARBA rules predict "May be
          involved in transcriptional regulation" and nuclear subcellular
          location. TrEMBL entry, protein existence level 3 (inferred from
          homology).
      - statement: >-
          The GN line gives the gene name LOC101732730 (RefSeq XP_012810399.1,
          Xenbase XB-GENE-29086363), the symbol used by GOA and adopted as
          gene_symbol in this review. PANTHER cross-references place the protein
          in family PTHR24381 (subfamily SF440 in this cached release; the
          current PANTHER release reassigns the accession, a release drift
          documented in the notes file).
core_functions:
  - description: >-
      LOC101732730 is predicted to function as a sequence-specific DNA-binding
      transcription factor that regulates RNA polymerase II-dependent transcription
      from the nucleus. The protein contains 8 tandem C2H2 zinc finger domains that
      mediate sequence-specific DNA recognition. Whether it acts as a transcriptional
      activator or repressor is unknown. By analogy to related Krueppel-like zinc
      finger proteins in Xenopus, it may regulate gene expression programs during
      early embryonic development (gastrulation).
    supported_by:
