        reference_section_type: TITLE
  - id: GO_REF:0000044
    title: >-
      Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
      vocabulary mapping, accompanied by conservative changes to GO terms applied by
      UniProt
    findings:
      - statement: >-
          Maps the UniProt subcellular location line (Nucleus; here an ARBA rule
          prediction) to GO:0005634.
        reference_section_type: TITLE
  - id: file:XENTR/A0A8J0SCI2/A0A8J0SCI2-deep-research-falcon.md
    title: Deep research summary for LOC101732730 in Xenopus tropicalis
    findings:
      - statement: >-
          The report correctly identifies the target (LOC101732730 / A0A8J0SCI2) and
          states explicitly that direct experimental literature on this gene is absent,
          so all functional conclusions are inferred from the C2H2 zinc finger domain
          architecture, Krueppel-family membership, and general C2H2-ZF biology.
      - statement: >-
          The report's developmental inferences (gastrulation, germ layer formation,
          pluripotency exit, BMP/Wnt/Nodal pathway context) rest on the RefSeq-derived
          name "gastrula zinc finger protein XlCGF17.1-like" and on analogy to Xenopus
          Klf-family factors. KLFs belong to a different PANTHER family, and the name is
          an automatic RefSeq similarity name, so these inferences are not evidence and
          are not used in this review.
    reference_review:
      relevance: MEDIUM
      correctness: LOW_QUALITY
      review_notes: >-
        LLM-generated inference document with no gene-direct evidence. Its general
        C2H2-ZF mechanism text (quoted once here, for the GO:0000978 row) is sound. Its
        developmental-role sections are built on Klf-family analogies and on the
        protein's automatic name, both unsuitable as evidence for this PTHR24381:SF440
        protein. In the 2026-10-21 re-review it was dropped as support for the nucleus,
        GO:0006357 and GO:0000981 rows and for the core function, in favour of PANTHER
        family placement and domain signatures.
  - id: file:XENTR/A0A8J0SCI2/A0A8J0SCI2-uniprot.txt
    title: UniProt entry A0A8J0SCI2
    findings:
      - statement: >-
          A 265-residue unreviewed (TrEMBL) entry with eight tandem C2H2-type zinc
          finger domains spanning residues 37-260 (PROSITE PS50157 x8, PS00028 x8;
          SMART SM00355 x8) and a disordered polar N-terminal region (residues 1-27); no
          KRAB, SCAN or BTB effector domain is annotated. Its FUNCTION, SUBCELLULAR
          LOCATION and SIMILARITY comments and keywords are ARBA rule predictions, and
          its protein name is an automatic RefSeq similarity name.
      - statement: >-
          The GN line gives the gene name LOC101732730 (RefSeq XP_012810399.1, Xenbase
          XB-GENE-29086363). PANTHER cross-references place the protein in family
          PTHR24381, subfamily SF440 ("OOCYTE ZINC FINGER PROTEIN XLCOF7.1-LIKE"); a
          live InterPro query on 2026-10-21 returned the same PTHR24381:SF440 match
          (E = 2.9e-63, residues 111-262), contradicting an earlier member-index entry
          that placed the accession in PTHR24377:SF929.
  - id: file:interpro/panther/PTHR24381/PTHR24381-review.yaml
    title: PANTHER PTHR24381 family review (Krueppel C2H2-type zinc-finger family)
    findings:
      - statement: >-
          Assesses the four PTN001225435 IBD assertions inherited by this protein
          (nucleus, GO:0000981, GO:0000978, GO:0006357) as SOUND, notes that the node's
          seeds span both activators and repressors (hence the direction-neutral
          terms), and records the ZNF445-clade IRD as the family's only documented loss
          of cis-regulatory-region binding.
core_functions:
  - description: >-
      Predicted sequence-specific DNA-binding transcription factor that regulates RNA
      polymerase II transcription from the nucleus, through an array of eight tandem
      C2H2 zinc fingers inherited from the PTHR24381 Krueppel zinc finger family. Its
      DNA target motif, target genes, and whether it activates or represses
      transcription are unknown; it has no recognizable effector domain.
    supported_by:
