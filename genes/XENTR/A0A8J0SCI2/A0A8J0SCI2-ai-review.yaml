  label: Xenopus tropicalis
description: >-
  LOC101732730 (UniProt A0A8J0SCI2) is a single-exon Xenopus tropicalis gene on
  chromosome 9 encoding a 265-residue Krueppel-type C2H2 zinc finger protein. Apart from
  a short polar, disordered N-terminal segment (residues 1-27), the protein consists
  entirely of eight tandem C2H2 zinc fingers (residues 37-260) joined by the canonical
  TGEKP-type linkers; it carries no KRAB, SCAN, BTB/POZ or other recognizable effector
  domain. It belongs to the PANTHER Krueppel C2H2 zinc finger family PTHR24381, in the
  small fish/amphibian subfamily SF440 ("oocyte zinc finger protein XlCOF7.1-like")
  whose only Swiss-Prot member is the Xenopus laevis oocyte zinc finger protein XlCOF7.2,
  itself known only from cDNA sequence. Like other members of this family it is expected
  to act in the nucleus as a sequence-specific DNA-binding transcription factor that
  regulates RNA polymerase II transcription; its DNA target sequence, target genes,
  regulatory direction (activation or repression), expression pattern and biological
  role have not been studied experimentally.
