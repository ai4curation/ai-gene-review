  - term:
      id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    review:
      summary: >-
        Phylogenetic (PAINT) annotation from node PTN001225435, a single-seed IBD
        (mouse Zfp932, with IDA for this term from two papers). Sequence-specific binding
        of Pol II cis-regulatory DNA is the mechanistic basis of the transcription factor
        activity above: each C2H2 finger coordinates zinc through two cysteines and two
        histidines and contacts bases in the major groove, and the target retains all
        eight fingers with their zinc ligands. The one documented loss of
        cis-regulatory-region binding in the family (the ZNF445 clade, pruned by PAINT
        with an IRD at PTN008615686) lies on a different branch and does not include
        the target. The actual DNA motif bound by the target is unknown.
      action: ACCEPT
      reason: >-
        A correct and appropriately specific molecular function for an intact tandem
        C2H2 finger protein. Sequence-specific DNA binding is part of the core function
        of a DNA-binding transcription factor, not a peripheral activity, so it is
        accepted alongside GO:0000981 (changed from the earlier KEEP_AS_NON_CORE, which
        treated this core binding activity as peripheral).
      supported_by:
