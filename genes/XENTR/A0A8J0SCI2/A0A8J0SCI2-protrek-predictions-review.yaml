id: A0A8J0SCI2
gene_symbol: A0A8J0SCI2
taxon:
  id: NCBITaxon:8364
  label: Xenopus tropicalis
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a Xenopus tropicalis Krueppel-type C2H2 zinc
  finger protein with eight tandem fingers. ProTrek's calls are correct but conservative:
  DNA binding at rank 1, nucleus at rank 3 and metal ion binding at rank 4 are all right
  and all already covered by the IBA annotations in GOA, at lower resolution than the
  existing RNA polymerase II-specific transcription factor annotation. The specific
  version (GO:0000981, this review's core molecular function) is retrieved, but only at
  rank 8. Scores are low across the board (11.5 to 10.7), which is consistent with the
  model recognising the fold but having nothing subfamily-specific to say - the honest
  outcome for a zinc finger protein with no known target sequence. ProtNLM2 produced four
  predictions here, three exact GOA matches plus a specific activator-activity call.
  Assessment: 0 correct novel (COR), 1 correct not novel (CNN), 1 less precise (LSP),
  1 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/XENTR/A0A8J0SCI2/A0A8J0SCI2-uniprot.txt
  - genes/XENTR/A0A8J0SCI2/A0A8J0SCI2-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0003677
      label: DNA binding
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 11.49). Correct - eight tandem C2H2 fingers are a
        sequence-specific DNA-binding module - but a strict ancestor of the RNA polymerase II
        cis-regulatory region sequence-specific DNA binding already annotated by IBA, and of
        this review's core molecular function. Adds nothing over the existing annotation.
        The specific term GO:0000981 is retrieved at rank 8, so the resolution is available
        but not at the top of the list.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0043035
      label: chromatin insulator sequence binding
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 11.42). Insulator binding is the signature of CTCF and a small number
        of related multi-zinc-finger proteins; it is a specific claim about which DNA elements
        this protein occupies, and there is no evidence for it. The Krueppel C2H2 family is
        one of the largest in vertebrate genomes and its members bind widely different
        sequences, so transferring a specific binding-site class within it is not supportable.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0005634
      label: nucleus
    predicted_term_type: GO_CC
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Rank 3 (score 11.31), an exact match to the existing IBA and IEA nucleus annotations
        and to this review's assigned location. Correct and appropriate, but already
        annotated - for a zinc-finger transcription factor it is also the least informative
        thing that could be said.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
