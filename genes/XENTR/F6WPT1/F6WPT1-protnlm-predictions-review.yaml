description: >-
  ProtNLM2 made no GO or subcellular-location predictions for F6WPT1, the
  Xenopus tropicalis arl5a gene product (ADP-ribosylation factor-like protein
  5A, a trans-Golgi network ARF-family GTPase of the vertebrate ARL5A
  subfamily). The model returned only a protein name, "ADP-ribosylation
  factor-like protein 1", which places the protein in the ARF-like family but
  names the wrong paralog (ARL1 rather than ARL5A). No GO term is predicted, so
  there is nothing to score; this file records an assessed absence of GO
  output. The gene's supported functions (GTP binding, GTPase activity,
  trans-Golgi network localization, protein localization to Golgi membrane,
  vesicle-mediated transport and intracellular protein transport) come from its GOA annotations and the
  ARL5 phylogenetic node, not from ProtNLM2.
