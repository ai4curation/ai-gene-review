- term:
    id: GO:0005525
    label: GTP binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phylogenetic annotation of GTP binding. ARL5A is a small GTPase that cycles
      between GDP-bound and GTP-bound states. GTP binding is an inherent property
      of all ARF-family GTPases and is essential for ARL5A function, as the
      GTP-bound form recruits effectors GARP, ARMH3, and PI4KB. The UniProt entry
      includes a GTP-binding site at residues 23-30, 69, and 125-128.
    action: ACCEPT
    reason: >-
      GTP binding is a fundamental and well-established molecular function of
      ARL5A as a member of the ARF-family small GTPases. The protein contains
      conserved GTP-binding motifs (P-loop, switch regions) confirmed by domain
      analysis. Mutant studies (constitutively active Q70L and dominant-negative
      T30N) confirm the GTP-binding cycle is essential for function.
    supported_by:
    - reference_id: file:XENTR/F6WPT1/F6WPT1-deep-research-falcon.md
      supporting_text: ARL5A functions as a molecular switch that cycles between
        an inactive GDP-bound state and an active GTP-bound state
    - reference_id: file:XENTR/F6WPT1/F6WPT1-uniprot.txt
      supporting_text: Belongs to the small GTPase superfamily. Arf family.
    - reference_id: PMID:22245584
      supporting_text: The constitutively active Arl5b (Q70L)-GFP mutant was
        localised efficiently to the Golgi in HeLa cells whereas the
        dominant-negative Arl5b (T30N)-GFP mutant was dispersed throughout the
        cytoplasm and resulted in perturbation of the Golgi apparatus
    - reference_id: PMID:31575603
      supporting_text: Like other small GTPases, ARL5 and ARFRP1 cycle between
        GTP-bound, active and GDP-bound, inactive forms
    propagation_review:
      root_cause: NO_FAILURE_CORE
