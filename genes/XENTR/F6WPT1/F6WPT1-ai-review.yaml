- id: PMID:25795912
  title: The small G protein Arl5 contributes to endosome-to-Golgi traffic by aiding
    the recruitment of the GARP complex to the Golgi.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Confirmed via NCBI E-utilities (esearch/esummary, 2026-09-05): Rosa-Ferreira,
      Christis, Torres & Munro, Biol Open 2015, PMC4400590; full text cached. This
      is the primary paper establishing that Arl5 interacts with the GARP complex
      and directs its recruitment to the trans-Golgi, conserved between Drosophila
      and human. No Xenopus data; supports this review's orthology-based claims.
  findings:
  - statement: >-
      Using liposome- and column-based affinity chromatography, Arl5 was shown to
      interact with the GARP tethering complex; in Drosophila tissues GARP is
      partially displaced from the Golgi when Arl5 is absent, and in HeLa cells
      GARP becomes cytosolic on Arl5b depletion, establishing Arl5 as one of the
      factors that recruits GARP to the trans-Golgi in both flies and humans.
- id: PMID:22245584
  title: Arl5b is a Golgi-localised small G protein involved in the regulation of
    retrograde transport.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Confirmed via NCBI E-utilities (esearch/esummary, 2026-09-05): Houghton et
      al., Exp Cell Res 2012. Abstract-only cache (no PMC record). Primary paper
      for mammalian trans-Golgi localization of Arl5a/Arl5b and for the behaviour
      of the constitutively active Q70L and dominant-negative T30N mutants; all
      experiments in HeLa cells, no Xenopus data.
  findings:
  - statement: >-
      Arl5a and Arl5b localize to the trans-Golgi in mammalian cells; the
      constitutively active Arl5b(Q70L)-GFP mutant localizes efficiently to the
      Golgi whereas dominant-negative Arl5b(T30N)-GFP is dispersed in the
      cytoplasm; Arl5b depletion alters mannose-6-phosphate receptor distribution
      and reduces endosome-to-TGN transport of TGN38 and Shiga toxin.
- id: PMID:31575603
  title: ARFRP1 functions upstream of ARL1 and ARL5 to coordinate recruitment of
    distinct tethering factors to the trans-Golgi network.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Confirmed via NCBI E-utilities (esearch/esummary, 2026-09-05): Ishida &
      Bonifacino, J Cell Biol 2019; full text cached. Establishes the
      SYS1/ARFRP1-dependent recruitment of ARL5 and GARP to the TGN in human
      (HeLa) cells and the requirement of GTP-bound ARL5 for GARP association.
      No Xenopus data; supports this review's orthology-based claims.
  findings:
  - statement: >-
      ARFRP1 functions upstream of ARL1 and ARL5, which in turn recruit golgins
      and GARP respectively to the TGN; SYS1 regulates the ARFRP1-mediated
      recruitment of GARP; KO of ARL5 or ARFRP1 disperses the retrograde cargo
      TGN46 from the TGN, and GARP association with the TGN depends on the
      GTP-bound, active forms of ARL5 and ARFRP1.
- id: PMID:39580461
  title: ARMH3 is an ARL5 effector that promotes PI4KB-catalyzed PI4P synthesis at
    the trans-Golgi network.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Confirmed via NCBI E-utilities (esearch/esummary, 2026-09-05): Ishida,
      Golding et al., Nat Commun 2024; full text cached. Primary paper for the
      ARL5-ARMH3-PI4KB axis: ARMH3 binds active (not inactive) ARL5, is recruited
      to the TGN in a SYS1-ARFRP1-ARL5-dependent manner, and activates PI4KB to
      generate the main TGN PI4P pool. Human cell work; no Xenopus data.
  findings:
  - statement: >-
      Proximity biotinylation and interaction assays show ARMH3 (C10orf76) binds
      active but not inactive ARL5 and is recruited to the TGN in a
      SYS1-ARFRP1-ARL5-dependent manner; unlike GARP, ARMH3 is dispensable for
      retrograde cargo transport but activates PI4KB, accounting for the main
      pool of PI4P at the TGN.
- id: PMID:30478271
  title: Amino acids stimulate the endosome-to-Golgi trafficking through Ragulator
    and small GTPase Arl5.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Confirmed via NCBI E-utilities (esearch/esummary, 2026-09-05): Shi et al.,
      Nat Commun 2018; full text cached. Primary paper for the amino
      acid-regulated Arl5-Ragulator interaction and its role in endosome-to-Golgi
      trafficking independent of Rag GTPases and mTORC1. Mammalian cell work; no
      Xenopus data.
  findings:
  - statement: >-
      Amino acids stimulate endosome-to-Golgi retrograde trafficking; Arl5
      interacts with Ragulator in an amino acid-regulated manner, SLC38A9,
      v-ATPase and Ragulator (but not Rag GTPases or mTORC1) are essential for
      the stimulated trafficking, and Ragulator may act as a guanine nucleotide
      exchange factor to activate Arl5, which functions with its effector GARP.
- id: file:XENTR/F6WPT1/F6WPT1-deep-research-falcon.md
  title: Deep research summary for arl5a in Xenopus tropicalis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Spot-checked against the primary literature it summarizes, now cached: the
      ARL5-GARP recruitment claim matches PMID:25795912, the ARFRP1-SYS1
      dependence and TGN46 retrograde-cargo claims match PMID:31575603, the
      ARMH3-PI4KB axis claim matches PMID:39580461, the amino acid-sensitive
      Ragulator interaction (Rag/mTORC1-independent) matches PMID:30478271, and
      the trans-Golgi localization and Q70L/T30N mutant behaviour match
      PMID:22245584. Its bibliography DOIs resolve to the intended papers via
      PubMed. The biology summarized is real mammalian/Drosophila ARL5
      literature; the file itself correctly states that no Xenopus
      tropicalis-specific functional studies exist, so all functional claims for
      F6WPT1 are orthology-based inferences.
  findings:
  - statement: >-
      Identifies ARL5A as an ARF-family small GTPase that acts as a molecular
      switch, cycling between inactive GDP-bound and active GTP-bound states,
      with GTP hydrolysis as its enzymatic activity and effector recruitment
      (GARP, ARMH3, PI4KB) as its biological output.
  - statement: >-
      Documents predominant trans-Golgi network localization (strongest overlap
      with TGN46), dependent on the upstream ARFRP1-SYS1 complex, with a
      secondary endolysosomal pool that interacts with Ragulator in an amino
      acid-sensitive manner.
  - statement: >-
      Establishes that ARL5-GARP-mediated endosome-to-TGN retrograde trafficking
      recycles TGN-resident cargo (TGN46, mannose-6-phosphate receptors, furin,
      sortilin), and that ARL5 depletion causes cargo mislocalization and
      endosomal accumulation.
  - statement: >-
      Notes that no Xenopus tropicalis-specific functional studies were
      identified; conclusions rest on deep evolutionary conservation of ARL5
      (present in LECA) and detailed mammalian ARL5A/ARL5B experiments.
- id: file:XENTR/F6WPT1/F6WPT1-uniprot.txt
  title: UniProt entry F6WPT1
  findings:
  - statement: >-
      Assigns the protein to the small GTPase superfamily, Arf family, with
      GTP-binding sites at residues 23-30, 69, and 125-128 and Mg(2+) binding
      at residues 30 and 47.
core_functions:
  - description: >-
      ARL5A is a small GTPase of the ARF family that functions as a molecular switch
      at the trans-Golgi network, regulating endosome-to-TGN retrograde membrane
      trafficking and phosphoinositide metabolism. In its GTP-bound state, ARL5A
      recruits the GARP tethering complex to promote SNARE-dependent fusion of
      endosome-derived transport carriers with the TGN membrane, enabling recycling
      of TGN-resident proteins (TGN46, mannose-6-phosphate receptors, furin,
      sortilin). ARL5A also recruits ARMH3, which activates PI4KB to synthesize
      PI4P at the TGN. TGN localization of ARL5A depends on the upstream ARFRP1-SYS1
      complex. Additionally, ARL5A interacts with the Ragulator complex at
      endolysosomes in an amino acid-sensitive manner, linking nutrient sensing to
      retrograde trafficking independently of the Rag-mTORC1 pathway. No
      Xenopus-specific studies exist; the function is inferred from conserved
      orthology with mammalian ARL5A/ARL5B.
