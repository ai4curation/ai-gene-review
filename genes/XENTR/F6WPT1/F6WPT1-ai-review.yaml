- term:
    id: GO:0005802
    label: trans-Golgi network
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic annotation of trans-Golgi network localization. The TGN is
      the primary site of ARL5A function. In mammalian cells, ARL5A colocalizes
      strongly with the TGN marker TGN46 rather than with cis- or medial-Golgi
      markers. TGN localization is dependent on the upstream ARFRP1-SYS1 complex,
      and it is at the TGN that ARL5A recruits its major effectors GARP, ARMH3,
      and PI4KB.
    action: ACCEPT
    reason: >-
      Trans-Golgi network localization is the primary and best-characterized
      subcellular location for ARL5A function. Immunofluorescence and live-cell
      imaging in mammalian systems demonstrate strong TGN enrichment, and
      genetic studies show TGN localization depends on the upstream ARFRP1-SYS1
      complex. This is a core localization annotation.
    supported_by:
    - reference_id: file:XENTR/F6WPT1/F6WPT1-deep-research-falcon.md
      supporting_text: ARL5A is predominantly localized to the TGN, where it
        colocalizes strongly with the TGN marker TGN46 rather than with cis- or
        medial-Golgi markers
    - reference_id: PMID:22245584
      supporting_text: Here we show that Arl5a and Arl5b are localised to the
        trans-Golgi in mammalian cells
    - reference_id: PMID:39580461
      supporting_text: ARL5 is a member of the ARF family of small GTPases that is
        recruited to the trans-Golgi network (TGN) by another ARF-family member,
        ARFRP1, in complex with the transmembrane protein SYS1
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000195484
        source_label: PAINT node placing trans-Golgi network at the ARL5 clade
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The decisive source, and the reason this row is core rather than generic. This
          is the ARL5-clade node (PAINT snapshot 20171006, taxon Eukaryota), not the
          family root: the family's other compartment assertions sit at separate nodes
          (plasma membrane at PTN000918064 and PTN002619726, Golgi apparatus at
          PTN000195580, lysosomal membrane at PTN000918220, axoneme at PTN000196179), so
          TGN does not descend to ARF6 or ARL6/BBS3. The family review scopes GO:0005802
          SUBFAMILY_ONLY to the three ARL5 subfamilies and assesses this node SOUND.
      - source_id: FB:FBgn0035866
        source_label: Arl5, Drosophila melanogaster
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node's only declared seed for this term, resolved at FlyBase and UniProt as
          Drosophila Arl5 (Q9VSG8, PANTHER PTHR11711:SF31) -- the single-copy invertebrate
          ortholog of this gene, not a distant paralog. A one-seed with-list is not weak
          support: the curator's claim is about where TGN localization arose, and the
          sibling assertion at the same node is additionally seeded by human ARL5A and
          ARL5B, which are likewise TGN-localized downstream of ARFRP1-SYS1.
      residue_claims_not_applicable: >-
        Localization here is set by the upstream ARFRP1-SYS1 recruitment step and by the
        N-terminal amphipathic helix, not by any single curated position, so the
        annotation cannot be expressed as a residue claim in either direction.
- term:
    id: GO:1903292
    label: protein localization to Golgi membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic annotation of involvement in protein localization to Golgi
      membrane. ARL5A promotes retrograde transport of cargo proteins from
      endosomes to the TGN via GARP recruitment, which effectively maintains the
      steady-state localization of TGN-resident membrane proteins at the Golgi.
      Loss of ARL5 causes displacement of proteins such as TGN46 from the Golgi,
      consistent with a role in protein localization to Golgi membrane.
    action: ACCEPT
    reason: >-
      ARL5A-dependent retrograde trafficking is essential for maintaining the
      localization of TGN-resident proteins at the Golgi. When ARL5 is depleted,
      cargo proteins accumulate in endosomes rather than at the TGN. The IBA
      annotation accurately reflects this role. This is a downstream consequence
      of GARP-mediated retrograde transport.
    supported_by:
    - reference_id: file:XENTR/F6WPT1/F6WPT1-deep-research-falcon.md
      supporting_text: Depletion of ARL5 (or its paralogs ARL5A/5B together)
        significantly impairs retrograde trafficking, leading to mislocalization
        and accumulation of cargo proteins in endosomal compartments
    - reference_id: PMID:25795912
      supporting_text: In Drosophila tissues the GARP complex is partially
        displaced from the Golgi when Arl5 is absent, and the late endosomal
        compartment is enlarged. In addition, in HeLa cells GARP also becomes
        cytosolic upon depletion of Arl5b.
    - reference_id: PMID:31575603
      supporting_text: we observed that KO of ARL5 or ARFRP1 caused dispersal of
        TGN46 from the TGN similar to that caused by VPS54 KO
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000195484
        source_label: PAINT node placing protein localization to Golgi membrane at the ARL5 clade
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The ARL5-clade node again (PAINT snapshot 20171006), here seeded by all three
          characterized ARL5 orthologs. Assessed SOUND in the family review. The family
          review leaves this term's family-level scope UNRESOLVED -- it is also grounded
          independently by direct experiment on human ARF1 in a distant branch, so no
          closed subfamily list can be asserted across 77 subfamilies -- but the node
          placement is what governs the transfer to this gene, and it is sound.
      - source_id: UniProtKB:Q9Y689
        source_label: ARL5A, Homo sapiens
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The direct vertebrate ortholog of this gene and the anchor of the family's
          g_domain site. Its GARP-recruitment phenotype -- TGN-resident cargo stranded in
          endosomes when ARL5 is lost -- is the experimental basis for the asserted term.
      - source_id: UniProtKB:Q96KC2
        source_label: ARL5B, Homo sapiens
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The vertebrate paralog, largely redundant with ARL5A; most retrograde phenotypes
          require depleting both, which is why both seed the node.
      residue_claims_not_applicable: >-
        A downstream-maintenance process term. The mechanism is effector recruitment
        (GARP) by the GTP-loaded switch, so the relevant residue-level statement is that
        the G domain is intact, which is recorded on the GTP binding and GTPase activity
        rows rather than duplicated here.
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro-based annotation of GTPase activity derived from the ARF/SAR
      family domain (IPR006689). ARL5A is a small GTPase that hydrolyzes GTP to
      GDP plus inorganic phosphate. The GTPase cycle (GTP-bound active to
      GDP-bound inactive) is the core molecular switch mechanism that controls
      ARL5A effector recruitment and membrane trafficking function.
    action: ACCEPT
    reason: >-
      GTPase activity is a core molecular function of ARL5A. As an ARF-family
      GTPase, the protein hydrolyzes GTP as part of its regulatory cycle. The
      InterPro domain assignment (IPR006689, Small_GTPase_ARF/SAR) is correct,
      and the P-loop NTPase fold with conserved catalytic residues supports
      GTPase activity. This is distinct from but complementary to the GTP binding
      annotation -- together they describe the complete GTPase cycle.
    supported_by:
    - reference_id: file:XENTR/F6WPT1/F6WPT1-deep-research-falcon.md
      supporting_text: The primary enzymatic activity is GTP hydrolysis,
        converting GTP to GDP plus inorganic phosphate
    - reference_id: PMID:31575603
      supporting_text: Like other small GTPases, ARL5 and ARFRP1 cycle between
        GTP-bound, active and GDP-bound, inactive forms
    - reference_id: PMID:30478271
      supporting_text: Ragulator might function as a guanine nucleotide exchange
        factor to activate Arl5
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: InterPro:IPR006689
        source_label: Small GTPase, ARF/SAR type
        source_status: SUPPORTS_TRANSFER
