- term:
    id: GO:0006886
    label: intracellular protein transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic annotation of intracellular protein transport. ARL5A mediates
      retrograde transport of cargo proteins (TGN46, mannose-6-phosphate receptors,
      furin, sortilin) from endosomes back to the TGN. This is a form of
      intracellular protein transport, though the term is broad.
    action: ACCEPT
    reason: >-
      ARL5A is directly involved in intracellular protein transport -- specifically,
      the retrograde transport of TGN-resident membrane proteins from endosomes
      back to the TGN. Loss of ARL5 causes mislocalization and endosomal
      accumulation of these cargo proteins. The IBA annotation is consistent with
      the known function from mammalian orthologs.
    supported_by:
    - reference_id: file:XENTR/F6WPT1/F6WPT1-deep-research-falcon.md
      supporting_text: This pathway is essential for recycling TGN-resident
        membrane proteins, including TGN46, cation-independent mannose-6-phosphate
        receptor (CI-MPR), cation-dependent MPR (CD-MPR), furin, and sortilin,
        which cycle between the TGN, plasma membrane, and endosomes
    - reference_id: PMID:22245584
      supporting_text: Depletion of Arl5b by RNAi resulted in an alteration in the
        intracellular distribution of mannose-6-phosphate receptor, and
        significantly reduced the endosome-to-TGN transport of the membrane cargo
        TGN38 and of Shiga toxin
    - reference_id: PMID:31575603
      supporting_text: We also show that this mechanism is essential for the
        delivery of retrograde cargos to the TGN
    propagation_review:
