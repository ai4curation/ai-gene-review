      label: protein localization to Golgi membrane
    predicted_term_type: GO_BP
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Rank 3 (score 16.17), an exact match to the IBA and IEA annotations and consistent
        with ARL5A's recruitment of effectors to the TGN. Correct, not novel. Three correct
        process calls in the top three is among the better outcomes in this benchmark; the
        limitation is that none of them is the molecular function, which the GO channel
        reaches only at rank 21.
      supported_by:
