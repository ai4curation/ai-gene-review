id: F6WPT1
gene_symbol: arl5a
taxon:
  id: NCBITaxon:8364
  label: Xenopus tropicalis
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Xenopus ARL5A, an ARF-family small GTPase of the
  trans-Golgi network that recruits the GARP tethering complex and the ARMH3-PI4KB module.
  The top three calls are all correct and all in the right compartment: vesicle targeting
  to, from or within Golgi; intracellular protein transport; protein localization to Golgi
  membrane. Two are exact GOA matches and one is a refinement. The model then loses the
  paralog at ranks 4 and 5, offering ARF and Rab signal transduction as alternatives to
  each other - ARL5A is an ARF-family protein, not a Rab, and the two families are
  functionally distinct despite both being Ras-superfamily GTPases. The core molecular
  function, GTPase activity, appears only at rank 21. ProtNLM2 made no GO prediction here.
  Assessment: 2 correct not novel (CNN), 1 correct novel (COR).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/XENTR/F6WPT1/F6WPT1-uniprot.txt
  - genes/XENTR/F6WPT1/F6WPT1-goa.tsv
predictions:
