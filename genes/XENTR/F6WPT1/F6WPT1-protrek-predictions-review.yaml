    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0048199
      label: vesicle targeting, to, from or within Golgi
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 16.32), absent from GOA and a strict descendant of the annotated
        vesicle-mediated transport. It is the correct mechanistic statement for ARL5A: through
        GARP recruitment it promotes fusion of endosome-derived retrograde carriers with the
        TGN. Correct, specific and novel.
      supported_by:
