    original_reference_id: GO_REF:0000033
    review:
      summary: Phylogenetic inference of generic aldehyde metabolism. This is
        true of aldh1a2, whose physiological substrate retinaldehyde is an
        aldehyde, but it is the generic parent process rather than the
        retinoid-specific process the enzyme actually performs.
      action: KEEP_AS_NON_CORE
      reason: This IBA is correctly rather than wrongly conservative and should
        be retained rather than swapped. The node PANTHER:PTN002619055 is seeded
        by the direct mouse ortholog Aldh1a2 (MGI:MGI:107928) together with
        human ALDH1A3, human ALDH2, rat Aldh2 and Drosophila Aldh. Because ALDH2
        and Drosophila Aldh are not retinaldehyde dehydrogenases, the
        retinoid-specific process GO:0002138 could not be asserted at this node,
        and the PAINT curator's placement of the generic aldehyde-metabolism
        term is the correct call for the clade. The specific process is
        therefore proposed separately below as a new annotation supported by
        target-relevant experimental literature, rather than as a replacement
        for this row. An earlier version of this review used MODIFY with
        GO:0002138 as the replacement, which would have pushed a
        subfamily-specific process onto a node that does not support it. A
        family-level pass (interpro/panther/PTHR11699/PTHR11699-review.yaml)
        confirms this judgment. Note that the current cached PAINT slice
        (snapshot 20260409) records the IBD at PANTHER:PTN002619055 as
        GO:0046185 (aldehyde catabolic process) with human ALDH2 as the
        recorded seed, placed at Eumetazoa, i.e. the node assertion has been
