  - term:
      id: GO:0001758
      label: retinal dehydrogenase (NAD+) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    review:
      summary: This is the core molecular function of aldh1a2. The enzyme
        catalyzes the NAD+-dependent oxidation of retinaldehyde to retinoate
        (EC 1.2.1.36), the activity that generates the bioactive retinoid
        signal. The EC-based mapping matches the EC number carried on the
        RefSeq and UniProt records for this protein, and the activity is
        directly demonstrated for the vertebrate RALDH2 enzyme in a Xenopus
        assay system.
      action: ACCEPT
      additional_reference_ids:
        - PMID:10570467
      supported_by:
        - reference_id: PMID:10570467
          supporting_text: injection of Xenopus embryos with mRNAs for either
            mouse Aldh1 or mouse Raldh2 stimulates RA synthesis at low and high
            levels, respectively
        - reference_id: PMID:10570467
          supporting_text: This provides evidence that some members of the ALDH
            gene family can indeed perform RA synthesis in vivo
        - reference_id: file:XENTR/aldh1a2/aldh1a2-deep-research.md
          supporting_text: Biochemical studies have shown that Xenopus (and
            mouse/human) ALDH1A2 efficiently oxidizes retinaldehyde to retinoic
            acid in vitro
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    review:
      summary: Keyword and InterPro driven annotation to a very high-level
        oxidoreductase term. It is a true ancestor of GO:0001758 and is not
        incorrect, but it carries almost no information about what this enzyme
        does.
      action: KEEP_AS_NON_CORE
      reason: GO:0016491 is an is_a ancestor of the core term GO:0001758, so the
        mapping is factually correct and there is no basis for removal; it is
        simply subsumed by the more specific EC-derived annotation. Retained as
        a non-core, uninformative parent rather than deleted, since automated
        pipelines legitimately assert ancestor terms and removing true ancestors
        is not a curation goal.
  - term:
      id: GO:0016620
      label: oxidoreductase activity, acting on the aldehyde or oxo group of
        donors, NAD or NADP as acceptor
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: InterPro2GO mapping from the aldehyde dehydrogenase C-terminal
        domain signature (IPR016163), which the frog protein carries. Correct
        and reasonably informative about the chemistry, but still an ancestor of
        the substrate-specific core term.
      action: KEEP_AS_NON_CORE
      reason: The domain-to-term mapping is sound, since the protein has the
        ALDH C-terminal domain together with the PROSITE aldehyde dehydrogenase
        cysteine and glutamate active-site signatures, and GO:0016620 is an
        is_a ancestor of GO:0001758, so the term is true rather than wrong. It
        is kept as a non-core parent of the retinal-specific activity rather
        than removed.
  - term:
      id: GO:0002138
      label: retinoic acid biosynthetic process
    evidence_type: ISS
    original_reference_id: file:XENTR/aldh1a2/aldh1a2-deep-research.md
    review:
      summary: aldh1a2 catalyzes the second, effectively committed step of
        retinoic acid biosynthesis, oxidizing retinaldehyde to all-trans
        retinoic acid. This is the specific biological process the enzyme
        performs, and the one that the generic IBA to aldehyde metabolic process
        under-calls.
      action: NEW
      reason: Proposed as the substrate-specific process term corresponding to
        the accepted molecular function GO:0001758. It is supported by direct
        demonstration that Raldh2 mRNA injection drives RA synthesis in Xenopus
        embryos, and by loss-of-function evidence in the zebrafish aldh1a2
        (neckless) mutant, where the phenotype tracks a primary defect in
        retinoic acid signalling and is rescued by exogenous RA. The frog
        protein is a one-to-one ortholog of these characterized enzymes and
        retains the complete catalytic machinery.
      additional_reference_ids:
        - PMID:10570467
        - PMID:11688558
      supported_by:
        - reference_id: PMID:10570467
          supporting_text: injection of Xenopus embryos with mRNAs for either
            mouse Aldh1 or mouse Raldh2 stimulates RA synthesis at low and high
            levels, respectively
        - reference_id: PMID:11688558
          supporting_text: it inactivates retinaldehyde dehydrogenase type 2, an
            enzyme involved in retinoic acid biosynthesis
        - reference_id: PMID:11688558
          supporting_text: some of these defects in neckless mutants can be
            rescued by application of exogenous retinoic acid
  - term:
      id: GO:0009952
      label: anterior/posterior pattern specification
    evidence_type: ISS
    original_reference_id: PMID:11688558
    review:
      summary: Retinoic acid generated by RALDH2 in trunk mesoderm acts as a
        posteriorizing signal that positions anteroposterior identity along the
        body axis. Loss of the enzyme in the zebrafish neckless mutant truncates
        the anteroposterior axis and delays and reduces expression of the
        anteroposterior marker hoxb4.
      action: NEW
      reason: Inferred from the orthologous zebrafish aldh1a2 loss-of-function
        phenotype together with the conserved Xenopus expression domain, in
        which aldh1a2 is expressed in the gastrula organizer and then in the
        trunk mesoderm that supplies posteriorizing RA. The zebrafish defects
        are rescued by exogenous RA, tying the patterning role to the enzyme's
        RA-producing activity rather than to an unrelated function.
      additional_reference_ids:
        - PMID:35372345
      supported_by:
        - reference_id: PMID:11688558
          supporting_text: neckless embryos are characterised by a truncation of
            the anteroposterior axis anterior to the somites, defects in midline
            mesendodermal tissues and absence of pectoral fins
        - reference_id: PMID:11688558
          supporting_text: expression of the retinoic acid receptor a and hoxb4
            genes is delayed and significantly reduced
        - reference_id: PMID:35372345
          supporting_text: Two embryonic retinaldehyde dehydrogenases, ALDH1A2
            (RALDH2) and ALDH1A3 (RALDH3) are initially expressed in the
            organizer and subsequently mark the trunk and the migrating leading
            edge mesendoderm, respectively
  - term:
      id: GO:0030902
      label: hindbrain development
    evidence_type: ISS
    original_reference_id: PMID:11688558
    review:
      summary: RALDH2-derived retinoic acid produced in paraxial mesoderm
        signals non-cell-autonomously to the adjacent neural tube to pattern the
        posterior hindbrain, acting through hox gene expression. In the
        zebrafish aldh1a2 mutant, hoxb4 and retinoic acid receptor expression in
        the nervous system are delayed and reduced.
      action: NEW
      reason: Supported by the zebrafish ortholog loss-of-function phenotype and
        by mosaic analysis showing that the neural effect is
        non-cell-autonomous, meaning the enzyme acts by supplying a diffusible
        RA signal from mesoderm to neurectoderm. The authors state the
        conclusion as a conserved vertebrate role, and the Xenopus expression
        domain of organizer followed by trunk mesoderm matches. Note that the
        cached abstract documents altered posterior hox and RAR expression
        rather than a described loss of rhombomere identity, so the summary is
        limited to what is reported.
      supported_by:
        - reference_id: PMID:11688558
          supporting_text: our results demonstrate a conserved role for
            retinaldehyde dehydrogenase type 2 in patterning the posterior
            cranial mesoderm of the vertebrate embryo
        - reference_id: PMID:11688558
          supporting_text: expression of the retinoic acid receptor a and hoxb4
            genes is delayed and significantly reduced
  - term:
      id: GO:0021915
      label: neural tube development
    evidence_type: ISS
    original_reference_id: PMID:11688558
    review:
      summary: Retinoic acid made by RALDH2 in paraxial mesoderm is required for
        signalling to the adjacent neural tube, where it helps set posterior
        neural identity.
      action: NEW
      reason: The zebrafish study provides direct evidence that endogenous
        retinoic acid mediates signalling from paraxial mesoderm to the neural
        tube, and mosaic analysis shows that the effect on neural hoxb4
        expression is non-cell-autonomous. In Xenopus, aldh1a2 is expressed in
        the mesoderm surrounding the neural tube at tailbud stages, consistent
        with the same relationship. Proposed as a non-core, RA-dependent
        developmental role rather than as a core function.
      supported_by:
        - reference_id: PMID:11688558
          supporting_text: provide definitive evidence for an involvement of
            endogenous retinoic acid in signalling between the paraxial mesoderm
            and neural tube
        - reference_id: file:XENTR/aldh1a2/aldh1a2-deep-research.md
          supporting_text: in tailbud-stage Xenopus embryos, aldh1a2 is
            expressed around developing somites and in mesoderm surrounding the
            neural tube
  - term:
      id: GO:0060173
      label: limb development
    evidence_type: ISS
    original_reference_id: PMID:16774994
    review:
      summary: RALDH2-derived retinoic acid from flanking somites is required
        permissively for induction of the forelimb field. Zebrafish aldh1a2
        (neckless) mutants lack pectoral fins, and fin induction is restored by
        exogenous retinoic acid.
      action: NEW
      reason: Inferred from the orthologous zebrafish enzyme, where the
        requirement is mapped precisely, in that RA acts during the six- to
        eight-somite stages for pectoral fin induction, and transplantation
        shows somite-derived RA production is both required and sufficient for
        fin bud initiation. The pectoral fin is the teleost forelimb homolog, so
        the transferable claim is the general limb and appendage initiation role
        rather than a fin-specific one. An earlier version of this review cited
        only the title of PMID:11688558, which concerns hindbrain patterning and
        does not support a limb claim; the supporting text has been replaced
        with the relevant fin-induction and fin-absence statements.
      additional_reference_ids:
        - PMID:11688558
      supported_by:
        - reference_id: PMID:16774994
          supporting_text: By rescuing pectoral fin induction in the
            aldh1a2/neckless mutant with exogenous RA and by blocking RA
            signaling in wild-type embryos, we find that RA acts as a permissive
            signal that is required during the six- to eight-somite stages for
            pectoral fin induction
        - reference_id: PMID:16774994
          supporting_text: Cell-transplantation experiments show that RA
            production is not only crucially required from flanking somites, but
            is sufficient to permit fin bud initiation when the trunk mesoderm
            is genetically ablated
        - reference_id: PMID:11688558
          supporting_text: neckless embryos are characterised by a truncation of
            the anteroposterior axis anterior to the somites, defects in midline
            mesendodermal tissues and absence of pectoral fins
  - term:
      id: GO:0003007
      label: heart morphogenesis
    evidence_type: ISS
    original_reference_id: PMID:34643182
    review:
      summary: aldh1a2 is expressed in foregut lateral plate mesoderm/posterior
        second heart field, where Tbx5 directly maintains its expression via a
        conserved intronic enhancer. Aldh1a2-derived retinoic acid is required
        for posterior second heart field patterning, and both Tbx5 loss (which
        depletes aldh1a2) and direct Aldh1a2 knockdown disrupt this cardiac
        program, with partial rescue by exogenous RA.
      action: NEW
      reason: Supported by direct Xenopus experiments in the now-cached primary
        paper (Rankin et al. 2021, eLife). Tbx5 loss-of-function in both X.
        laevis (morpholino) and X. tropicalis (CRISPR/Cas9) strongly reduces
        aldh1a2 transcript and protein in the foregut lateral plate mesoderm,
        targeted Aldh1a2 morpholino knockdown phenocopies pharmacological RA
        synthesis inhibition with loss of posterior second heart field markers
        and expansion of anterior second heart field gene expression, and
        exogenous RA partially rescues the Tbx5-MO, Aldh1a2-MO and DEAB
        phenotypes. This places the enzyme causally upstream of second heart
        field patterning rather than merely correlated with it. An earlier
        version of this review cited the paper by PMC id only with
        deep-research paraphrases; the PMC id was resolved to PMID:34643182 via
        the NCBI ID converter and the quotes below are verbatim from the cached
        full text. Retained as a proposed non-core developmental role.
      supported_by:
        - reference_id: PMID:34643182
          supporting_text: Both X. laevis Tbx5-MO morphant and X. trop tbx5
            CRISPR/CAS9 mutant embryos exhibited a loss or strong reduction of
            aldh1a2 transcripts and Aldh1a2 protein in the foregut lpm at NF34
        - reference_id: PMID:34643182
          supporting_text: We suppressed endogenous RA synthesis by addition of
            the Aldh enzyme inhibitor DEAB between NF20 and NF34, the time when
            aldh1a2 expression was Tbx5-dependent. This phenocopied the Tbx5
            LOF with loss of pSHF and pulmonary markers and an expansion of
            aSHF gene expression
        - reference_id: PMID:34643182
          supporting_text: "Importantly, we could partially rescue the Tbx5-MO,
            Aldh1a2-MO, and DEAB phenotypes with exogenous RA between NF20 and
            NF34, using a physiological concentration of 25 nM"
        - reference_id: PMID:34643182
          supporting_text: "Specifically, Tbx5 directly maintains expression of
            Aldh1a2 in pSHF via an evolutionarily conserved intronic enhancer"
  - term:
      id: GO:0030324
      label: lung development
    evidence_type: ISS
    original_reference_id: PMID:34643182
    review:
      summary: Aldh1a2-derived retinoic acid, maintained downstream of Tbx5 in
        foregut lateral plate mesoderm, is required for induction of Nkx2-1+
        pulmonary progenitors in the adjacent foregut endoderm. Direct Aldh1a2
        morpholino knockdown in Xenopus disrupts the RA-dependent
        cardiopulmonary signalling cascade and blocks pulmonary specification.
      action: NEW
      reason: Proposed as a non-core organogenesis role on direct Xenopus
        evidence from the now-cached primary paper (Rankin et al. 2021, eLife).
        Targeted Aldh1a2 morpholino injection, like DEAB inhibition of RA
        synthesis, results in failed induction of Nkx2-1+ pulmonary
        progenitors, and exogenous RA rescues the associated gene-expression
        changes; mechanistically, Tbx5/Aldh1a2-dependent RA directly activates
        shh transcription in the foregut endoderm, initiating the
        Hedgehog-Wnt2/2b cascade that induces pulmonary fate. An earlier
        version of this review cited the paper by PMC id only with
        deep-research paraphrases and a truncated quote; the PMC id was
        resolved to PMID:34643182 via the NCBI ID converter and the quotes
        below are verbatim from the cached full text.
      supported_by:
        - reference_id: PMID:34643182
          supporting_text: "Immunostaining of NF34 embryos for Aldh1a2 (red),
            Nkx2-1 (green), and Sox2 (blue) confirms that Aldh1a2-MO injection
            or DEAB treatment disrupts the RA>Tbx5>Aldh1a2>RA positive
            feedback loop (diagrammed in (D)) and results in failed induction
            of Nkx2-1+ pulmonary progenitors"
        - reference_id: PMID:34643182
          supporting_text: We find that Tbx5/Aldh1a2-dependent RA signaling
            directly activates shh transcription in the adjacent foregut
            endoderm through a conserved MACS1 enhancer. Hedgehog signaling
            coordinates with Tbx5 in the mesoderm to activate expression of
            wnt2/2b, which induces pulmonary fate in the foregut endoderm
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: ISS
    original_reference_id: file:XENTR/aldh1a2/aldh1a2-deep-research.md
    review:
      summary: The enzyme is a soluble cytosolic protein in retinoic
