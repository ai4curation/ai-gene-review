      action: NEW
      reason: Proposed as the single, informative cellular-component term for
        this soluble enzyme. It rests on the absence of targeting or
        membrane-anchoring features in the frog protein, whose UniProt record
        annotates only the aldehyde dehydrogenase domain and the catalytic
        residue, together with the established soluble and non-mitochondrial
        character of ALDH1A-subfamily enzymes, which contrasts with the
        mitochondrial ALDH2 branch of the same family. An earlier version of
        this review also proposed the parent term GO:0005737 (cytoplasm) as a
        separate NEW annotation; that was redundant parent-plus-child
        over-proposal (the same argument used to drop GO:0042573 in favour of
        GO:0002138), so only this child term is retained. No direct
        immunolocalization has been performed on the Xenopus tropicalis
        protein, so this remains an inference from sequence and family context
        rather than a demonstrated localization.
      supported_by:
        - reference_id: file:XENTR/aldh1a2/aldh1a2-deep-research.md
          supporting_text: In RA-producing cells (such as specific embryonic
            mesodermal cells), ALDH1A2 localizes to the cytosol
        - reference_id: file:XENTR/aldh1a2/aldh1a2-deep-research.md
          supporting_text: consistent with its role as a soluble metabolic
            enzyme
