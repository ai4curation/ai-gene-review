core_functions:
  - description: NAD+-dependent oxidation of retinaldehyde to all-trans retinoic
      acid, the committed step that generates the bioactive retinoid signal.
      The enzyme performs this single catalytic activity in the cytosol of
      spatially restricted embryonic domains (gastrula organizer, then trunk
      paraxial and lateral plate mesoderm, foregut lateral plate mesoderm
      downstream of Tbx5, and somites flanking the prospective limb field),
      and the locally produced retinoic acid in turn drives anteroposterior
      patterning, hindbrain and neural tube development, and heart, limb and
      lung organogenesis
    molecular_function:
      id: GO:0001758
      label: retinal dehydrogenase (NAD+) activity
    supported_by:
      - reference_id: PMID:10570467
        supporting_text: injection of Xenopus embryos with mRNAs for either
          mouse Aldh1 or mouse Raldh2 stimulates RA synthesis at low and high
          levels, respectively
      - reference_id: PMID:11688558
        supporting_text: it inactivates retinaldehyde dehydrogenase type 2, an
          enzyme involved in retinoic acid biosynthesis
      - reference_id: PMID:35372345
        supporting_text: Two embryonic retinaldehyde dehydrogenases, ALDH1A2
          (RALDH2) and ALDH1A3 (RALDH3) are initially expressed in the organizer
          and subsequently mark the trunk and the migrating leading edge
          mesendoderm, respectively
      - reference_id: PMID:11688558
        supporting_text: provide definitive evidence for an involvement of
          endogenous retinoic acid in signalling between the paraxial mesoderm
          and neural tube
      - reference_id: PMID:16774994
        supporting_text: Cell-transplantation experiments show that RA
          production is not only crucially required from flanking somites, but
          is sufficient to permit fin bud initiation when the trunk mesoderm is
          genetically ablated
      - reference_id: PMID:34643182
        supporting_text: "Specifically, Tbx5 directly maintains expression of
