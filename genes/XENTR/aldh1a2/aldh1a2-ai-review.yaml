suggested_questions:
  - question: Is retinoic acid production in the Xenopus tropicalis trunk
      supplied by aldh1a2 alone, or is there functional redundancy with aldh1a1
      and aldh1a3 that masks the aldh1a2 loss-of-function phenotype?
  - question: What cis-regulatory elements drive the shift of aldh1a2 expression
      from the Spemann-Mangold organizer to trunk paraxial and lateral plate
      mesoderm, and is the Tbx5 intronic enhancer conserved in X. tropicalis?
  - question: Does aldh1a2 protein localize exclusively to the cytosol in frog
      embryonic mesoderm, or is there evidence of association with membranes or
      other compartments?
  - question: How is the balance between aldh1a2-mediated retinoic acid synthesis
      and cyp26-mediated degradation used to shape the posterior retinoic acid
      gradient in the frog embryo?
  - question: Which of the organogenesis phenotypes attributed to aldh1a2 are
      direct consequences of local retinoic acid supply, and which are secondary
      to the earlier axial patterning defect?
suggested_experiments:
  - description: CRISPR/Cas9 F0 knockout of aldh1a2 in X. tropicalis with scoring
      of axial, hindbrain, somite, heart and limb bud phenotypes, and rescue by
      staged all-trans retinoic acid administration to establish which defects
      are retinoic acid dependent and when
  - description: LC-MS/MS quantification of all-trans retinoic acid and
      retinaldehyde in dissected anterior versus trunk regions of wild-type and
      aldh1a2-depleted embryos, to test whether the enzyme is the rate-limiting
      source of trunk retinoic acid
  - description: Double and triple depletion of aldh1a2, aldh1a1 and aldh1a3 to
      test for redundancy in embryonic retinoic acid production, given that
      aldh1a3 rather than aldh1a2 was shown to be the enzyme required for head
      formation
  - description: Enzymatic characterization of recombinant X. tropicalis aldh1a2
      with retinaldehyde and a panel of non-retinoid aldehydes, to determine
      whether the substrate preference matches the retinal-specific EC 1.2.1.36
      assignment or is broader
  - description: Immunostaining and subcellular fractionation of frog embryonic
      mesoderm to test the inferred cytosolic localization directly, together
      with ChIP or reporter assays for Tbx5 occupancy at the X. tropicalis
      aldh1a2 locus
