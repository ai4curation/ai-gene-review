      label: aldehyde dehydrogenase (NAD+) activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: Phylogenetic inference of generic NAD+-dependent aldehyde
        dehydrogenase activity at a deep, pan-eukaryotic ALDH node. The
        assertion is true of aldh1a2, since GO:0001758 (retinal dehydrogenase
        (NAD+) activity) is a direct is_a descendant of this term, but it does
        not convey the retinaldehyde substrate specificity that defines the core
        function of this gene.
      action: KEEP_AS_NON_CORE
      reason: The node placement is sound and the target sits squarely inside
        the clade. The WITH/FROM seeds behind PANTHER:PTN000192421 span human
        ALDH1A1, ALDH2 and ALDH9A1, bovine ALDH1A1, mouse Aldh1a1, Aldh1a3 and
        Aldh1l1, rat Aldh1a1, Aldh2 and Aldh9a1, yeast ALD4 and ALD5,
        Drosophila Aldh, E. coli BetB and maize rf2, a set whose only shared and
        defensible activity is generic NAD+-dependent aldehyde oxidation, so a
        retinal-specific term could not have been asserted at this node. The
        frog protein retains the complete ALDH catalytic machinery, verified
        residue-by-residue against the sequence and recorded as
        machine-checkable residue claims below, anchored on the family review
        interpro/panther/PTHR11699/PTHR11699-review.yaml (node assessment for
        PANTHER:PTN000192666). The general-base glutamate Glu279 sits in the
        invariant LKRVTL[E]LGGKSP block and is the record's single ACT_SITE
        feature (PROSITE-ProRule PRU10007; an earlier version of this review
        mislabelled that feature as a catalytic cysteine at 279), and the
        catalytic nucleophile Cys313 sits in the invariant FNQGQC[C] block,
        corresponding to human ALDH1A2 Cys320. There is therefore no evidence
        of catalytic loss. Retained as a true but uninformative ancestor of the
        core molecular function rather than as the core function itself.
