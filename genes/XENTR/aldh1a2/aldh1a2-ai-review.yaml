id: Q28CC8
gene_symbol: aldh1a2
aliases:
  - raldh2
  - raldh-2
  - XRaldh2
  - retinaldehyde dehydrogenase 2
taxon:
  id: NCBITaxon:8364
  label: Xenopus tropicalis
description: Retinaldehyde dehydrogenase 2 (RALDH2), a cytosolic NAD+-dependent
  aldehyde dehydrogenase of the ALDH1A subfamily (EC 1.2.1.36) that oxidizes
  all-trans-retinaldehyde to all-trans retinoic acid (RA), the bioactive vitamin
  A metabolite. It is the principal source of embryonic RA in the trunk. In
  Xenopus, aldh1a2 is expressed first in the gastrula Spemann-Mangold organizer
  and then shifts laterally and posteriorly into paraxial and lateral plate
  mesoderm of the trunk and tail, so that RA is generated in the tissues that
  supply posteriorizing signals to adjacent neurectoderm. RA made by this enzyme
  acts through RAR/RXR nuclear receptors to set posterior Hox gene expression,
  patterning the hindbrain and spinal cord, and supports heart, forelimb and
  foregut-derived organ development. Loss of the orthologous enzyme in zebrafish
  and mouse truncates the anteroposterior axis, abolishes pectoral fin or
  forelimb induction and reduces posterior Hox expression, defects that
  exogenous RA can rescue. The 511-residue protein has the canonical two-domain
  aldehyde dehydrogenase fold, with a Rossmann-type NAD-binding domain, a
  conserved catalytic cysteine, and no signal peptide, transmembrane segment or
  organellar targeting sequence.
