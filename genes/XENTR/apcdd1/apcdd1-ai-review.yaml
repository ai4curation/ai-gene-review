id: Q6DF34
gene_symbol: apcdd1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8364
  label: Xenopus tropicalis
description: >-
  Single-pass type I plasma-membrane glycoprotein and 1:1 diploid frog ortholog of
  experimentally characterized Xenopus laevis apcdd1 (Q66KI8) and mammalian APCDD1 that
  functions as a cell-surface negative regulator of Wnt signaling. Xenopus tropicalis apcdd1
  retains the cleavable N-terminal signal peptide (aa 1-20), the tandem ABD1/ABD2
  beta-barrel extracellular domain stabilized by all 12 conserved disulfide cysteines
  (including the interdomain Cys46-Cys460 disulfide bridge) and conserved N-glycosylation
  sequons (Asn94, Asn162, Asn313), the ABD2 hydrophobic pocket for palmitoylated WNT ligand
  capture, and the C-terminal single-pass transmembrane helix (aa 489-509).
