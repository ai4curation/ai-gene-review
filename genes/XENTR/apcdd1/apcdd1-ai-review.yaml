proposed_new_terms: []
suggested_questions:
- question: >-
    Does CRISPR/Cas9 null mutation of the single-copy apcdd1 locus in diploid Xenopus
    tropicalis phenocopy both the zygotic Wnt ventralization and the BMP/Smad1 sizzled
    expansion observed upon morpholino knockdown in allotetraploid Xenopus laevis?
suggested_experiments:
- description: >-
    Generate F0/F1 CRISPR/Cas9 loss-of-function mutants of Xenopus tropicalis apcdd1 and
    assay dorsal-anterior axis formation, sizzled/chordin expression, and phospho-Smad1 and
    nuclear beta-catenin levels at gastrula and neurula stages.
