- id: PMID:20393562
  title: APCDD1 is a novel Wnt inhibitor mutated in hereditary hypotrichosis simplex.
  findings:
  - statement: Congeneric Xenopus laevis apcdd1 (Q66KI8) and human APCDD1 (Q8J025) localize to the plasma membrane and cell-autonomously inhibit Wnt signaling upstream of beta-catenin.
    supporting_text: Depletion of Xapcdd1 protein with a specific translation-blocking MO oligonucleotide (Fig. S13) resulted in loss of anterior and dorsal structures (Fig. 4e and Table S1). This phenotype was rescued by either injection of MO-resistant 5’ mutant Xapcdd1 RNA, or by DNWnt8 RNAs (Fig. 4f,g and Table S1), which inhibit zygotic Wnt signaling24.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct experimental characterization of congeneric Xenopus laevis apcdd1 (Q66KI8) and human APCDD1 (Q8J025) underpinning ISS and PAINT IBA projections to Xenopus tropicalis Q6DF34.
- id: PMID:32320685
  title: Apcdd1 is a dual BMP/Wnt inhibitor in the developing nervous system and skin.
  findings:
  - statement: Congeneric Xenopus laevis apcdd1 antagonizes both Wnt and BMP signaling pathways during embryonic patterning.
    supporting_text: APCDD1 blocks BMP signaling by binding to the BmprIa receptor and inhibiting the nuclear localization of Smad1, the main BMP effector.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports conserved amphibian apcdd1 function in congeneric Xenopus laevis.
- id: PMID:37155902
  title: Structure of WNT inhibitor adenomatosis polyposis coli down-regulated 1 (APCDD1), a cell-surface lipid-binding protein.
  findings:
  - statement: Vertebrate APCDD1 ectodomains share two disulfide-bonded beta-barrel domains (ABD1 and ABD2) with an ABD2 hydrophobic pocket that binds palmitoylated WNT ligands.
    supporting_text: ABD1 and ABD2 have, respectively, three and two intradomain disulfide bonds, a large area of interfacial contact, and one interdomain disulfide bond (Cys52–Cys466).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the structural basis of WNT binding conserved across tetrapod SF2 orthologs including Xenopus tropicalis Q6DF34 (Cys46-Cys460).
