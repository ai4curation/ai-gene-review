    label: phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004446
  - InterPro:IPR006543
  review:
    action: MODIFY
    summary: Specify the C7 phosphatase reaction on beta-heptose 1,7-bisphosphate.
    reason: Purified SepL can substitute for E. coli GmhB in the GmhA/HldE reaction mixture, producing
      the authentic beta-ADP-heptose product. This identifies removal of the C7 phosphate, preserving
      C1 phosphate for adenylylation. Alpha-anomer activity is not established by these assays.
    supported_by:
    - reference_id: PMID:29483275
