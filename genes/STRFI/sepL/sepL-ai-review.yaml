id: A0A2P1G6D3
gene_symbol: sepL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:68197
  label: Streptomyces fimbriatus
description: SepL is a heptose bisphosphate phosphatase of the septacidin biosynthetic cluster in Streptomyces
  fimbriatus CGMCC 4.1598. It removes the C7 phosphate from D-glycero-beta-D-manno-heptose 1,7-bisphosphate,
  supplying the heptose 1-phosphate intermediate for SepB-mediated adenylylation. SepB, SepL and SepC
  together produce ADP-L-glycero-beta-D-manno-heptose for secondary-metabolite biosynthesis.
