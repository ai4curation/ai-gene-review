  review:
    action: UNDECIDED
    summary: Cytoplasmic localization is plausible but lacks independently verified localization evidence.
    reason: The UniProt cytoplasm statement is supported only by ARBA. Soluble recombinant expression
      and activity on intracellular precursor metabolites do not independently demonstrate native localization.
      No localization assay was identified in the inspected primary study.
