  review:
    action: MODIFY
    summary: Specify ADP-L-glycero-beta-D-manno-heptose precursor biosynthesis.
    reason: SepL directly hydrolyzes a pathway intermediate rather than merely being required for the
      final product. Recombinant reconstruction with SepB and replacement of E. coli GmhB support the
      precursor chemistry; septacidin is the downstream context.
    supported_by:
    - reference_id: PMID:29483275
      supporting_text: 'SepB, SepL, and SepC can convert

        d-sedoheptulose-7-phosphate (S-7-P) to ADP-l-glycero-β-d-manno-heptose'
    - reference_id: file:STRFI/sepB/sepB-bioinformatics/RESULTS.md
      supporting_text: SepL A0A2P1G6D3 is identical over all 287 residues to AVM80395.1, the sepL translation
