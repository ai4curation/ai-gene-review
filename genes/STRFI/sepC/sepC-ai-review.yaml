- term:
    id: GO:0097171
    label: ADP-L-glycero-beta-D-manno-heptose biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:29483275
  review:
    action: NEW
    summary: SepC catalyzes the final epimerization producing the L-glycero ADP-heptose donor.
    reason: 'SepC itself performs the chemical step: direct substrate-to-product conversion, not necessity
      alone, establishes participation. The proposed process names the product-generating reactions and
      has nucleotide-sugar biosynthesis parents; it does not require an LPS role. The proposal follows
      the purified-enzyme assay, not an assumption that all pathway members must share an annotation.
      No ancestor or descendant process is additionally proposed. QuickGO comparator queries on 2026-10-25
      found GO:0097171 on both E. coli HldD P67910 and P. aeruginosa HldD Q9HYQ8, the same epimerase role;
      this corroborates the annotation convention but is not biological evidence.'
    supported_by:
    - reference_id: PMID:29483275
      supporting_text: 'SepB, SepL, and SepC can convert

        d-sedoheptulose-7-phosphate (S-7-P) to ADP-l-glycero-β-d-manno-heptose'
    - reference_id: file:STRFI/sepB/sepB-bioinformatics/RESULTS.md
      supporting_text: SepC A0A2P1G6C1 is identical over all 321 residues to AVM80386.1, the sepC translation
        in the original MF372757.1 septacidin cluster.
