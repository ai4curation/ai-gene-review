id: A0A2P1G6C1
gene_symbol: sepC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:68197
  label: Streptomyces fimbriatus
description: SepC is an ADP-heptose 6-epimerase of the septacidin biosynthetic cluster in Streptomyces
  fimbriatus CGMCC 4.1598. It converts ADP-D-glycero-beta-D-manno-heptose produced by SepB and SepL into
  ADP-L-glycero-beta-D-manno-heptose, the activated sugar donor used in septacidin biosynthesis. Purified
  recombinant SepC contains tightly bound noncovalent NAD+. Its catalytic role supplies a Gram-positive
  secondary-metabolite pathway.
