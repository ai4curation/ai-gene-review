- id: PMID:29483275
  title: d-Sedoheptulose-7-phosphate is a common precursor for the heptoses of septacidin and hygromycin
    B.
  findings:
  - statement: Recombinant SepB, SepL and SepC reconstruct the ADP-L-glycero-beta-D-manno-heptose pathway
      of the experimentally identified septacidin cluster.
    supporting_text: 'SepB, SepL, and SepC can convert

      d-sedoheptulose-7-phosphate (S-7-P) to ADP-l-glycero-β-d-manno-heptose'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier and title verified. Cache remains abstract-only after supported refresh and
      warm attempts. The full publisher PDF was independently inspected at https://www.pnas.org/content/pnas/115/11/2818.full.pdf,
      especially Results pages 2820–2821 and Figures 3–4. Individual reaction assignments rely on that
      inspected body; the displayed quote is only the cached abstract. The abstract names GmhA in the
      HygP hybrid reaction whereas Results/Figure 4 specify GmhB; the latter is chemically consistent.
