taxon:
  id: NCBITaxon:68197
  label: Streptomyces fimbriatus
description: SepB is a trifunctional heptose precursor biosynthetic enzyme of Streptomyces fimbriatus
  CGMCC 4.1598. Its N-terminal sedoheptulose 7-phosphate isomerase domain and HldE-like kinase and adenylyltransferase
  domains catalyze three reactions that, together with the SepL phosphatase, produce ADP-D-glycero-beta-D-manno-heptose.
  SepC then epimerizes this nucleotide sugar to the L-glycero form used in septacidin biosynthesis. This
  Gram-positive secondary-metabolite pathway uses the same precursor chemistry as bacterial LPS heptose
  synthesis.
