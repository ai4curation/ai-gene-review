knowledge_gaps:
- gap_statement: >-
    The endogenous B. malayi cuticle procollagen substrates of DPY-31 and the
    in-species loss-of-function phenotype have not been directly identified.
  boundary: >-
    Recombinant B. malayi DPY-31 cleaves the C. elegans cuticle collagen SQT-3
    at the expected C-terminal procollagen processing site, and C. elegans
    genetics place DPY-31 in cuticle-collagen maturation and molting.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Direct Brugia substrate and loss-of-function data would test how completely
    the C. elegans SQT-3-centered mechanism explains DPY-31 function in a
    filarial parasite.
  resolution: >-
    Identify endogenous B. malayi cuticle collagens that are cleaved by DPY-31
    and assay dpy-31 knockdown or inhibition in B. malayi larvae for cuticle
    and molting phenotypes.
  provenance:
  - reference_id: file:BRUMA/dpy-31/dpy-31-notes.md
    supporting_text: >-
      Native B. malayi cuticular substrates and an in-species loss-of-function
      phenotype remain inferred from conservation with C. elegans rather than
      assayed directly.
suggested_experiments:
- description: >-
    Use recombinant Bm-DPY-31 and B. malayi cuticle-collagen precursors to map
    parasite-native cleavage sites, then verify candidate substrates by
    targeted peptidomics after DPY-31 inhibition or knockdown.
  hypothesis: >-
    Bm-DPY-31 cleaves a conserved set of B. malayi cuticle procollagens at
    C-terminal processing sites analogous to C. elegans SQT-3.
  experiment_type: substrate mapping
- description: >-
    Deplete dpy-31 in B. malayi larvae, or treat larvae with DPY-31-active
    hydroxamate inhibitors, and score cuticle integrity, collagen maturation,
    body morphology, molting, and viability.
  hypothesis: >-
    Loss of Bm-DPY-31 activity blocks cuticle-collagen maturation and produces
    molting and morphology defects in B. malayi.
  experiment_type: loss of function
