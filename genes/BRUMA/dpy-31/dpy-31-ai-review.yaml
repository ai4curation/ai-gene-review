  label: Brugia malayi
description: Bm-DPY-31 (nematode astacin NAS-35) is a secreted, zinc-dependent metalloendopeptidase
  of the astacin (M12A peptidase) family, structurally related to vertebrate BMP-1/tolloid
  procollagen C-proteinases. The mature enzyme has a multidomain architecture comprising
  an N-terminal signal peptide and propeptide (zymogen), a catalytic astacin/peptidase
  M12A domain bearing the HExxH zinc-binding motif and a downstream zinc-coordinating
  residue, an EGF-like domain, and a C-terminal CUB domain. It binds one catalytic
  zinc ion per subunit and cleaves the C-terminal (carboxyl) propeptide of procollagens
  to generate mature collagen, acting as a procollagen C-proteinase. In nematodes
  this activity is required for processing and assembly of cuticular collagens, and
  the orthologous gene is essential for cuticle integrity and the molting cycle; loss
  of function causes body-morphology and cuticle defects. The enzyme is widely conserved
  across free-living and parasitic nematodes and is inhibited by hydroxamate-based
  metalloprotease inhibitors such as marimastat, making it of interest as a nematode-specific
  anthelmintic target.
