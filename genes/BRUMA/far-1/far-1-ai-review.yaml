knowledge_gaps:
- gap_statement: >-
    The native host or parasite lipid cargoes carried by B. malayi FAR-1, and
    the in vivo developmental or immunomodulatory phenotypes that depend on
    far-1, have not been directly identified.
  boundary: >-
    Recombinant Bm-FAR-1 directly binds all-trans-retinol, DAUDA, and oleic acid
    in vitro, and FAR proteins are secreted by the filarial species and life
    stages assayed.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    Direct ligand recovery and perturbation data would test whether FAR-1
    scavenges retinoids, long-chain fatty acids, or host-derived lipid signals
    during B. malayi infection.
  resolution: >-
    Purify native or secreted Bm-FAR-1 for bound-lipid LC-MS/MS and couple
    far-1 depletion with parasite retinoid/fatty-acid uptake and host-interface
    phenotyping.
  provenance:
  - reference_id: file:BRUMA/far-1/far-1-notes.md
    supporting_text: >-
      Bm-FAR-1 has direct in vitro fatty-acid and retinol binding and secretion
      evidence, but native in vivo cargoes, uptake routes, and
      immunomodulatory phenotypes in B. malayi remain inferred from the FAR
      family model rather than directly assayed for Q93142.
suggested_questions:
- question: >-
    Which retinoids, fatty acids, or host lipid mediators are bound by native
    Bm-FAR-1 during infection, and are the same ligands carried by the C.
    elegans FAR-1 ortholog?
  experts:
  - Filarial nematode lipid biochemists
  - Nematode FAR protein specialists
suggested_experiments:
- description: >-
    Immunopurify native or excretory-secretory Bm-FAR-1 and identify
    co-purifying retinoids, fatty acids, and eicosanoid-like lipid signals by
    untargeted and targeted LC-MS/MS.
  hypothesis: >-
    Bm-FAR-1 carries host-derived retinoids and fatty acids in vivo rather than
    binding them only as a promiscuous recombinant activity.
  experiment_type: native ligand identification
- description: >-
    Deplete far-1 in B. malayi larvae or adults and assay extracellular
    retinoid/fatty-acid uptake, parasite fitness, and host-cell cytokine or
    antigen-presentation responses to excretory-secretory products.
  hypothesis: >-
    FAR-1 contributes to host lipid scavenging and host-interface immune
    modulation in B. malayi.
  experiment_type: loss of function
