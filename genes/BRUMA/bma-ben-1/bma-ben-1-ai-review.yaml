references:
- id: file:BRUMA/bma-ben-1/bma-ben-1-hypotheses/kgap-bmaben1-isotype-target/openscientist.md
  title: OpenScientist analysis of which Brugia beta-tubulin isotype is the benzimidazole target
  findings:
  - statement: >-
      The target isotype is unresolved, with this one weakly to moderately favoured as the only
      candidate in the intersection of the two informative evidence sets. The organism has four
      beta-tubulins; this is the closest relative of C. elegans BEN-1 and its reciprocal best hit, and
      every filarial beta-tubulin used in resistance genotyping is the orthologue of this locus. The
      three canonical resistance codons are identical across all four isotypes and so discriminate
      nothing, a negative the run validated by showing the same alignment separates four outgroup
      tubulins at those positions; widening to 27 pocket positions cuts the field from four to two
      without separating the final pair. Expression excludes nobody, and the run flags its own
      phylogeny as unreliable, so the identity ranking is not a resolved orthology.
    supporting_text: >-
      The 93.69% figure is a distance ranking, not a resolved 1:1 orthology.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Verified against the local records: Phe167, Glu198 and Phe200 in this 448-residue entry. One
      finding of this review's own confirms the run independently: the PE=2 entry it identifies as the
      sole transcript-level B. malayi beta-tubulin, Q66T51, is this same locus rather than a separate
      isotype, the two sequences differing only at position 352 (Ala here, Thr there) for 99.78 per
      cent identity, which reproduces the run's 99.8 per cent figure for the genotyping reference.
      Q66T51 is reviewed in this corpus as its own gene folder carrying the same gap, so the two
      should be read as one locus. Not reproduced here: the four-isotype identity matrix, the
      27-position pocket inventory, the cross-species cDNA comparisons and the transcript assignments.
      The run's two negatives are recorded as limitations rather than findings, which is the correct
      reading: the expression result is a retrieval failure, and the trees are self-flagged as wrong.
