id: A0A1U7F2B2
gene_symbol: bma-ben-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6279
  label: Brugia malayi
description: >-
  BMA-BEN-1 is a Brugia malayi beta-tubulin chain with the conserved
  Tubulin/FtsZ GTPase and C-terminal beta-tubulin architecture needed to
  heterodimerize with alpha-tubulin and form the GTP-binding beta subunits of
  microtubules. It is the B. malayi ortholog of the Caenorhabditis elegans
  BEN-1 beta-tubulin, whose isotype-specific sequence confers benzimidazole
  sensitivity, making BMA-BEN-1 a candidate beta-tubulin target for
  benzimidazole-class antifilarials whose direct genetic contribution in
  Brugia remains untested.
