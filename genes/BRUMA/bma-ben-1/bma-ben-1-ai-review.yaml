- id: PMID:2592410
  title: >-
    Genetic and molecular analysis of a Caenorhabditis elegans beta-tubulin
    that conveys benzimidazole sensitivity.
  full_text_unavailable: true
  findings:
  - statement: >-
      C. elegans ben-1 encodes a beta-tubulin whose deletion confers full
      benzimidazole resistance while leaving animals viable and coordinated.
    supporting_text: >-
      Since the deletion strains appear to be fully resistant to the drugs,
      the ben-1 product appears to be the only benzimidazole-sensitive
      beta-tubulin in C. elegans.
- id: PMID:24780738
  title: In situ imaging in C. elegans reveals developmental regulation of
    microtubule dynamics.
  findings:
  - statement: >-
      Lacroix et al. identified a TBB-5 beta-tubulin RNAi requirement in
      C. elegans uterine-muscle cells during egg laying, consistent with a
      cell-level microtubule requirement rather than direct participation in the
      organism-level egg-laying behavior.
    supporting_text: >-
      Tissue-specific RNAi of 5 of these MAPs induced Egl (Figure 5A; KLP-7,
      KLP-13, CCPP-6, TTLL-15, and TBB-5), confirming that they act in egg
      laying via a role in the non-neuronal cells of the egg-laying apparatus.
- id: PMID:42247472
  title: >-
    Evaluating beta-tubulin variants as predictors of benzimidazole resistance
    across Caenorhabditis nematodes.
  findings:
  - statement: >-
      Shaver et al. list ben-1 among the six C. elegans beta-tubulin genes,
      supporting WormBase's mapping of Lacroix et al.'s TBB-5 RNAi hit to
      ben-1 rather than to a separate tbb-5 locus.
    supporting_text: >-
      the free-living model nematode species C. elegans has six
      beta-tubulin genes (tbb-1, tbb-2, mec-7, tbb-4, ben-1, and tbb-6)
core_functions:
- description: >-
    Brugia beta-tubulin structural subunit that is expected to heterodimerize
    with alpha-tubulin, assemble into the microtubule lattice and bind the
    exchangeable GTP at the beta chain. C. elegans BEN-1 genetically defines a
    benzimidazole-sensitive beta-tubulin isotype, making the WormBase-named
    Brugia bma-ben-1 locus a candidate filarial counterpart, but direct Brugia
    evidence for drug sensitivity or isotype-specific essentiality is missing.
