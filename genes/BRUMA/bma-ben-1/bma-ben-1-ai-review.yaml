- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002453
  review:
    summary: InterPro2GO beta-tubulin GTPase assignment.
    action: ACCEPT
    reason: >-
      BMA-BEN-1 has the conserved beta-tubulin GTPase fold and contributes the
      exchangeable GTP-binding half of the alpha/beta-tubulin heterodimer. The
      domain name is only family evidence because alpha-tubulins carry the same
      fold; the exchangeable-site GTPase is polymer dependent and uses residues
      from the longitudinally adjacent alpha subunit, so this row is accepted as
      the beta-chain contribution to the tubulin nucleotide cycle rather than
      as a standalone monomeric activity.
    supported_by:
    - *uniprot_domains
    - &uniprot_function
      reference_id: file:genes/BRUMA/bma-ben-1/bma-ben-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Microtubules grow by the addition of GTP-tubulin dimers to the
        microtubule end, where a stabilizing cap forms. Below the cap, tubulin
        dimers are in GDP-bound state
