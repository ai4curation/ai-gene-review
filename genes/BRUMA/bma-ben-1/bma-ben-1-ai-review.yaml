core_functions:
- description: >-
    Brugia beta-tubulin structural subunit that is expected to heterodimerize
    with alpha-tubulin, assemble into the microtubule lattice and bind the
    exchangeable GTP at the beta chain. C. elegans BEN-1 genetically defines a
    benzimidazole-sensitive beta-tubulin isotype, making the WormBase-named
    Brugia bma-ben-1 locus a candidate filarial counterpart, but direct Brugia
    evidence for drug sensitivity or isotype-specific essentiality is missing.
