knowledge_gaps:
- gap_statement: >-
    The contribution of BMA-BEN-1 to benzimidazole sensitivity in B. malayi has
    not been genetically separated from the other Brugia beta-tubulin isotypes.
  boundary: >-
    A0A1U7F2B2 is an intact beta-tubulin at the WormBase-named bma-ben-1 locus. Deletion of
    C. elegans BEN-1 confers benzimidazole resistance, but no B. malayi loss-of-function or
    allele-swap assay has tested whether the Bm4733 isotype is the flubendazole or oxfendazole
    response determinant. An OpenScientist run (kgap-bmaben1-isotype-target) leaves the target
    isotype unresolved while favouring this one weakly to moderately, and its four lines do not
    converge. The organism encodes exactly four beta-tubulins. On pairwise identity this isotype is
    the closest Brugia relative of C. elegans BEN-1 at 93.69 per cent, ahead of the next at 89.86,
    and it is the reciprocal best hit, while the other three map onto different C. elegans paralogs;
    one of them carries a WormBase name implying orthology to TBB-6 yet is only 55.3 per cent
    identical to it, which is a caution about reading names as orthology. The pharmacology leg
    returns a clean negative: all four isotypes carry the three canonical resistance codons Phe167,
    Glu198 and Phe200, so those positions discriminate nothing. Crucially the run validated that
    negative rather than resting on it, showing the same alignment separates C. elegans TBB-1 and
    TBB-2, MEC-7 and human TUBB from BEN-1 at these positions, so the method has power where a
    difference exists. Widening the inventory from three codons to 27 colchicine-site pocket
    positions cuts the candidate set from four to two, this isotype and one other matching the
    Haemonchus isotype-1 pocket at all 27 while the remaining two differ at two positions each; the
    pocket therefore narrows the field without separating the final pair. Comparative genomics gives
    the one definite answer: every filarial beta-tubulin actually used in benzimidazole-resistance
    genotyping is the orthologue of this locus, the B. malayi genotyping reference being 99.8 per
    cent identical to it against 85.5 to 87.9 per cent for the other three, and the Onchocerca and
    Dirofilaria cDNAs 98.4 per cent. So the favouring rests on orthology and reagent provenance
    rather than on any functional test in this organism. Two negatives are recorded as limitations
    rather than findings, which is the right reading. No isotype-resolved expression matrix was
    obtained, the expression resource holding no experiments for this organism and the parasite
    database timing out, so expression excludes nobody and this is a retrieval failure. And both
    tree methods fail to nest this isotype inside the ben-1 clade, with one of them placing human
    beta-tubulin inside a nematode paralog clade, which is provably wrong; the run therefore flags
    its own phylogeny as unreliable and states that the 93.69 per cent figure is a distance ranking
    and not a resolved one-to-one orthology. No benzimidazole or drug-response term is supportable
    for this protein and none is proposed. Verified here against the local records: Phe167, Glu198
    and Phe200 in this 448-residue entry, and in passing a finding of this review's own, that the
    PE=2 entry the run identifies as the sole transcript-level B. malayi beta-tubulin, Q66T51, is
    this same locus rather than a separate isotype, the two sequences differing at a single position
    where this entry has Ala352 and that one Thr352, which is 99.78 per cent identity and reproduces
    the run's 99.8 per cent figure for the genotyping reference independently. That matters for this
    corpus because Q66T51 is reviewed here as its own gene folder carrying this same gap, so the two
    records should be read as one locus. Not reproduced here: the four-isotype identity matrix, the
    27-position pocket inventory, the cross-species cDNA comparisons and the transcript assignments.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: >-
    Resolving the sensitive Brugia beta-tubulin isotype would define the
    on-target parasite microtubule species for the benzimidazole drug-target
    lane and would make future resistance-variant interpretation less
    dependent on C. elegans extrapolation.
  resolution: >-
    Knock out or edit bma-ben-1 and the closest paralogous beta-tubulins in
    Brugia, then measure microtubule integrity, worm viability and
    flubendazole or oxfendazole sensitivity relative to edited C. elegans
    ben-1 controls.
  provenance:
  - reference_id: PMID:2592410
    supporting_text: >-
      Since the deletion strains appear to be fully resistant to the drugs,
      the ben-1 product appears to be the only benzimidazole-sensitive
      beta-tubulin in C. elegans.
    full_text_unavailable: true
  - reference_id: file:BRUMA/bma-ben-1/bma-ben-1-hypotheses/kgap-bmaben1-isotype-target/openscientist.md
    supporting_text: >-
      All four Brugia isotypes carry **F167, E198 and F200**, the three canonical resistance codons,
      so those positions discriminate nothing.
  - reference_id: file:BRUMA/bma-ben-1/bma-ben-1-hypotheses/kgap-bmaben1-isotype-target/openscientist.md
    supporting_text: >-
      The 93.69% figure is a distance ranking, not a resolved 1:1 orthology.
suggested_questions:
- question: >-
    Which B. malayi beta-tubulin isotypes are incorporated into adult female
    microtubules exposed to flubendazole, and does BMA-BEN-1 carry the dominant
    benzimidazole-sensitive pool?
  experts:
  - Filarial nematode drug-target biologists
- question: >-
    Should the Q66T51 and A0A1U7F2B2 reviews be cross-referenced or merged? They are the same
    B. malayi beta-tubulin locus under two UniProt entries, differing at a single residue (Ala352
    here against Thr352 in Q66T51) for 99.78 per cent identity, and both are reviewed in this corpus
    as separate gene folders carrying the same benzimidazole-target gap. One folder per accession is
    the project convention, so neither folder is wrong, but a reader comparing them would otherwise
    treat them as two isotypes, which would inflate the apparent size of the Brugia beta-tubulin
    family in exactly the comparison this gap turns on.
suggested_experiments:
- description: >-
    Use CRISPR or RNAi to perturb bma-ben-1 and candidate paralogous
    beta-tubulins in B. malayi, then compare adult female microtubule
    morphology and survival after flubendazole or oxfendazole exposure.
  hypothesis: >-
    BMA-BEN-1-containing microtubules are a benzimidazole-sensitive structural
    pool in B. malayi, and loss or sequence replacement of this isotype lowers
    adult-worm drug susceptibility.
  experiment_type: loss-of-function analysis
