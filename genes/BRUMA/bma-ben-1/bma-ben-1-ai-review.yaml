- term:
    id: GO:0018991
    label: egg-laying behavior
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q18817
  - WormBase:C54C6.2.1
  review:
    summary: >-
      EnsemblMetazoa transfer from the C. elegans ben-1 egg-laying phenotype.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The C. elegans source row records a tissue-specific RNAi effect in
      uterine muscle cells. WormBase maps Lacroix et al.'s TBB-5 hit to
      ben-1, consistent with recent C. elegans literature listing ben-1 rather
      than a separate tbb-5 locus among the six beta-tubulin genes. The RNAi
      result is phenotype-level evidence for a beta-tubulin structural subunit
      rather than evidence that BEN-1 directly executes the organism-level
      egg-laying behavior, and the BRUMA row further transfers that nematode
      behavior phenotype to an unassayed Brugia beta-tubulin, so it should not
      be kept as a direct biological process for BMA-BEN-1.
    supported_by:
    - reference_id: PMID:24780738
      supporting_text: >-
        Tissue-specific RNAi of 5 of these MAPs induced Egl (Figure 5A; KLP-7,
        KLP-13, CCPP-6, TTLL-15, and TBB-5), confirming that they act in egg
        laying via a role in the non-neuronal cells of the egg-laying
        apparatus.
    - reference_id: PMID:42247472
      supporting_text: >-
        the free-living model nematode species C. elegans has six
        beta-tubulin genes (tbb-1, tbb-2, mec-7, tbb-4, ben-1, and tbb-6)
