taxon:
  id: NCBITaxon:6279
  label: Brugia malayi
description: >-
  BMA-BEN-1 is a Brugia malayi beta-tubulin chain with the conserved
  Tubulin/FtsZ GTPase and C-terminal beta-tubulin architecture needed to
  heterodimerize with alpha-tubulin and form the GTP-binding beta subunits of
  microtubules. This Brugia protein is a candidate beta-tubulin target for
  benzimidazole-class antifilarials, but its direct contribution to
  benzimidazole sensitivity remains untested.
