core_functions:
- description: >-
    Brugia beta-tubulin structural subunit that is expected to heterodimerize
    with alpha-tubulin, assemble into the microtubule lattice and bind the
    exchangeable GTP at the beta chain. Its close relationship to C. elegans
    BEN-1 makes it a candidate benzimidazole-target isotype, but direct
    Brugia evidence for drug sensitivity or isotype-specific essentiality is
    missing.
  molecular_function:
