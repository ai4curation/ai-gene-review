taxon:
  id: NCBITaxon:6279
  label: Brugia malayi
description: >-
  GLC-3 is a Brugia malayi 486-residue Cys-loop glutamate-gated chloride
  channel subunit in the nematode inhibitory glutamatergic receptor family
  targeted by macrocyclic lactone anthelmintics. The protein carries
  extracellular ligand-binding and GluCl-family transmembrane signatures and
  corresponds to the cloned Bma-GLC-3 cDNA MW196267. Recombinant Bma-GLC-3 did
  not produce detectable homomeric glutamate-evoked currents in Xenopus
  oocytes under the tested conditions, and the native B. malayi receptor
  composition remains unresolved. Cross-species coexpression with Parascaris
  univalens GLC-2 nevertheless produced microampere-scale glutamate-evoked
  currents, showing that Bma-GLC-3 can contribute to a functional GluCl channel
  when paired with a compatible partner.
