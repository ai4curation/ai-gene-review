core_functions:
- description: >-
    Bma-GLC-3 Cys-loop GluCl subunit that contributes to a recombinant
    extracellularly glutamate-gated chloride channel when paired with the
    compatible Pun-GLC-2 subunit. Bma-GLC-3 alone and the tested all-B. malayi
    Bma-GLC-2/Bma-GLC-3 and Bma-GLC-3/Bma-GLC-4 combinations did not form
    detectable channels in Xenopus oocytes, leaving its native B. malayi
    receptor partner unresolved.
  contributes_to_molecular_function:
