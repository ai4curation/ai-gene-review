- term:
    id: GO:0008068
    label: extracellularly glutamate-gated chloride channel activity
  evidence_type: IC
  original_reference_id: PMID:34623639
  qualifier: contributes_to
  review:
    summary: >-
      New molecular-function annotation from chimeric Pun-GLC-2/Bma-GLC-3
      receptor reconstitution.
    action: NEW
    reason: >-
      Bma-GLC-3 did not form a robust homomeric channel, and Bma-GLC-2/Bma-GLC-3
      and Bma-GLC-3/Bma-GLC-4 coexpression did not produce a B. malayi
      receptor. However, Bma-GLC-3 coexpression with Pun-GLC-2 in Xenopus
      oocytes produced glutamate-elicited microampere currents, showing that
      Bma-GLC-3 can contribute to an extracellularly glutamate-gated Cys-loop
      channel when a compatible partner is present. Chloride selectivity is
      inferred from the conserved GluCl domains and the C. elegans GLC-3
      ortholog's chloride-selective homomeric channel rather than from ion
      replacement in the Bma-GLC-3 chimera. Native B. malayi GLC-3 partners
      remain unresolved.
    supported_by:
    - *bma_glc3_chimera
    - &bma_glc2_glc3_no
      reference_id: PMID:34623639
      supporting_text: >-
        Although the Bma‐GLC‐2 and Bma‐GLC‐3 subunits were shown to be
        functional with Bma‐AVR‐14B and Pun‐GLC‐2, respectively, they did not
        give rise to a heteromeric GluCl
    - &not_homomeric
      reference_id: PMID:34623639
      supporting_text: >-
        none of the GluCl subunits from the parasites B. malayi or from
        P. univalens (i.e., AVR‐14B, GLC‐2, GLC‐3 and GLC‐4) gave rise to
        robust functional channels when expressed in the Xenopus oocytes
    - *glucl_ligand_binding
    - *glucl_tm
    - reference_id: PMID:11250875
      supporting_text: The GLC-3 channels were selective for chloride ions
      full_text_unavailable: true
- term:
    id: GO:1902476
    label: chloride transmembrane transport
  evidence_type: IC
  original_reference_id: PMID:34623639
  qualifier: involved_in
  review:
    summary: >-
      New biological-process annotation from Bma-GLC-3 contribution to a
      recombinant glutamate-gated chloride channel.
    action: NEW
    reason: >-
      The Pun-GLC-2/Bma-GLC-3 Cys-loop receptor opens in response to
      extracellular glutamate, and A0A894KHH9 carries conserved GluCl
      extracellular and transmembrane CDD signatures consistent with a
      chloride-selective Cys-loop pore. Lamassiaude et al. measured
      glutamate-evoked oocyte currents but did not directly establish the
      chimera's chloride selectivity by ion replacement, so this transported-ion
      process is inferred from the assay in combination with conserved GluCl
      domains and the C. elegans GLC-3 ortholog's chloride-selective channel.
    supported_by:
    - *bma_glc3_chimera
    - *glucl_ligand_binding
    - *glucl_tm
    - reference_id: PMID:11250875
      supporting_text: The GLC-3 channels were selective for chloride ions
      full_text_unavailable: true
