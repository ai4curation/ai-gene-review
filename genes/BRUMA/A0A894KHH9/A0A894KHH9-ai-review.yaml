knowledge_gaps:
- gap_statement: >-
    The native B. malayi subunit partner or ancillary factor that allows
    Bma-GLC-3 to form a functional glutamate-gated chloride channel has not
    been identified.
  boundary: >-
    Bma-GLC-3 contributed to glutamate-evoked microampere currents with the P.
    univalens GLC-2 partner in Xenopus oocytes, but the tested Bma-GLC-2/Bma-GLC-3
    and Bma-GLC-3/Bma-GLC-4 combinations were silent.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Identifying the native GLC-3-containing receptor would clarify whether this
    Brugia subunit contributes to macrocyclic lactone sensitivity in vivo and
    would define the all-B. malayi channel composition to model in the GluCl
    module.
  resolution: >-
    Coexpress Bma-GLC-3 with candidate Brugia GluCl subunits and ancillary
    proteins, then test glutamate and macrocyclic lactone responses by
    two-electrode voltage clamp and follow confirmed combinations by in vivo
    loss-of-function assays.
  provenance:
  - *bma_glc2_glc3_no
suggested_questions:
- question: >-
    Which B. malayi GluCl subunit or accessory factor pairs with Bma-GLC-3 in
    the native parasite receptor, and does that receptor mediate macrocyclic
    lactone sensitivity in Brugia neurons or muscle?
  experts:
  - Parasitic nematode neurophysiologists
  - Nematode GluCl pharmacology experts
suggested_experiments:
- description: >-
    Express Bma-GLC-3 with candidate B. malayi GluCl subunits and ancillary
    proteins in Xenopus oocytes, then measure glutamate-gated currents and
    macrocyclic-lactone modulation.
  hypothesis: >-
    Bma-GLC-3 requires a native Brugia partner outside the tested
    Bma-GLC-2/Bma-GLC-3 and Bma-GLC-3/Bma-GLC-4 pairs to form a functional
    GluCl.
  experiment_type: heterologous receptor reconstitution
