- id: PMID:34623639
  title: >-
    Pharmacological characterization of novel heteromeric GluCl subtypes from
    Caenorhabditis elegans and parasitic nematodes.
  findings:
  - statement: >-
      Lamassiaude et al. cloned Bma-GLC-3 and deposited the MW196267 cDNA that
      UniProt cross-references for A0A894KHH9.
    supporting_text: >-
      The sequences used in this study are available on GenBank under the
      following accession numbers: B. malayi (Bma): AVR‐14B (MW196269), GLC‐2
      (MW196266), GLC‐3 (MW196267), GLC‐4 (MW196268)
  - statement: >-
      Bma-GLC-3 did not reconstitute a robust homomeric receptor and did not
      form a functional glutamate-sensitive receptor with Bma-GLC-2 or
      Bma-GLC-4 in the tested Xenopus-oocyte combinations.
    supporting_text: >-
      none of the GluCl subunits from the parasites B. malayi or from
      P. univalens (i.e., AVR‐14B, GLC‐2, GLC‐3 and GLC‐4) gave rise to robust
      functional channels when expressed in the Xenopus oocytes
  - statement: >-
      Cross-species coexpression with Pun-GLC-2 showed that Bma-GLC-3 is a
      functional GluCl subunit.
    supporting_text: >-
      The recordings of glutamate‐elicited currents in the μA range resulting
      from a functional chimeric receptor made of Pun‐GLC‐2 and Bma‐GLC‐3
      confirmed that Bma‐GLC‐3 is a functional subunit
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary full-text support for the cloned Bma-GLC-3 sequence in
      A0A894KHH9 and its recombinant function with Pun-GLC-2. The paper did
      not identify a native B. malayi GLC-3 heteromeric receptor: Bma-GLC-3 was
      nonfunctional alone and with the Bma-GLC-2 and Bma-GLC-4 combinations
      that Lamassiaude et al. tested.
