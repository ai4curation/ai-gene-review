- id: PMID:34623639
  title: >-
    Pharmacological characterization of novel heteromeric GluCl subtypes from
    Caenorhabditis elegans and parasitic nematodes.
  findings:
  - statement: >-
      Lamassiaude et al. cloned Bma-GLC-2 and deposited the MW196266 cDNA that
      UniProt cross-references for A0A894KDR7.
    supporting_text: >-
      The sequences used in this study are available on GenBank under the
      following accession numbers: B. malayi (Bma): AVR‐14B (MW196269), GLC‐2
      (MW196266), GLC‐3 (MW196267), GLC‐4 (MW196268)
  - statement: >-
      Lamassiaude et al. reconstituted a functional heteromeric
      Bma-AVR-14B/Bma-GLC-2 glutamate-gated receptor in Xenopus oocytes.
    supporting_text: >-
      For C. elegans, B. malayi and P. univalens, the combination of
      AVR‐14B/GLC‐2 led to the robust expression of glutamate‐sensitive
      receptors.
  - statement: >-
      Bma-GLC-2 was active as part of the Bma-AVR-14B/Bma-GLC-2 heteromer,
      while B. malayi AVR-14B, GLC-2, GLC-3 and GLC-4 were not robustly active
      as single-subunit recombinant receptors.
    supporting_text: >-
      none of the GluCl subunits from the parasites B. malayi or from
      P. univalens (i.e., AVR‐14B, GLC‐2, GLC‐3 and GLC‐4) gave rise to robust
      functional channels when expressed in the Xenopus oocytes
  - statement: >-
      The Bma-AVR-14B/Bma-GLC-2 receptor was sensitive to ivermectin and
      moxidectin.
    supporting_text: >-
      AVR‐14B/GLC‐2 from C. elegans, B. malayi and P. univalens were sensitive
      to ivermectin and moxidectin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary full-text support for the functional activity of the Bma-GLC-2
      sequence in A0A894KDR7; the Bma-GLC-2 accession from this paper is the
      MW196266/QRW38684.1 EMBL record cross-referenced by UniProt. The
      Bma-AVR-14B/Bma-GLC-2 heteromer assignment is pharmacological rather than
      purified native-receptor or fixed-stoichiometry evidence, and the paper
      treats the proteins as GluCls but does not establish the ion selectivity
      of this heteromer by chloride replacement.
