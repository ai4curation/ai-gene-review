  label: Brugia malayi
description: >-
  GLC-2 is a Brugia malayi 436-residue Cys-loop glutamate-gated chloride
  channel subunit cloned by Lamassiaude et al. The protein has an
  extracellular neurotransmitter-gated ion-channel ligand-binding domain and
  four predicted transmembrane helices. Recombinant Bma-GLC-2 did not form a
  robust glutamate-sensitive homomeric channel in Xenopus oocytes, but
  coexpression of Bma-GLC-2 with Bma-AVR-14B reconstituted a pharmacologically
  inferred heteromeric glutamate-sensitive receptor that responds to the
  macrocyclic lactone anthelmintics ivermectin and moxidectin.
