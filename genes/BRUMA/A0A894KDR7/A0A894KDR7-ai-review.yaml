      Core transport process. The recombinant Bma-AVR-14B/Bma-GLC-2 receptor
      opens in response to extracellular glutamate, and A0A894KDR7 carries
      conserved GluCl extracellular and transmembrane CDD signatures
      consistent with a chloride-selective Cys-loop pore. Lamassiaude et al.
