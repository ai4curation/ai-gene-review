- description: >-
    Bma-GLC-2 Cys-loop pore subunit that contributes with Bma-AVR-14B to a
    heteromeric extracellularly glutamate-gated chloride channel at the plasma
    membrane. Bma-GLC-2 alone did not form a robust homomeric channel in
    Xenopus oocytes.
