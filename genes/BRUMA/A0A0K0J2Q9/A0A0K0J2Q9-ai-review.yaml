taxon:
  id: NCBITaxon:6279
  label: Brugia malayi
description: >-
  A0A0K0J2Q9 is the Brugia malayi AVR-14B splice form of a Cys-loop
  glutamate-gated chloride channel subunit. The 427-residue cloned protein has
  a predicted signal peptide, extracellular ligand-binding domain and four
  transmembrane helices. Recombinant Bma-AVR-14B does not form a robust
  glutamate-sensitive homomeric channel in Xenopus oocytes, but coexpression of
  Bma-AVR-14B with Bma-GLC-2 reconstitutes a pharmacologically inferred
  heteromeric glutamate-sensitive receptor that responds to macrocyclic lactone
  anthelmintics including ivermectin and moxidectin.
