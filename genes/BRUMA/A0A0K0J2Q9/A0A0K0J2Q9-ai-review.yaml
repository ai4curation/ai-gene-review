- id: PMID:21041637
  title: >-
    Ivermectin disrupts the function of the excretory-secretory apparatus in
    microfilariae of Brugia malayi.
  findings:
  - statement: >-
      Moreno et al. localized B. malayi GluCl expression around the
      microfilarial excretory-secretory vesicle.
    supporting_text: >-
      We localized Brugia malayi GluCl expression solely in a muscle structure
      that surrounds the microfilarial excretory-secretory (ES) vesicle
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      UniProt maps this accession to the HQ123447 avr-14 mRNA from Moreno et
      al. The local publication cache contains only the abstract, which
      supports native B. malayi GluCl expression around the ES vesicle but does
      not distinguish the AVR-14 splice form assayed later by Lamassiaude et
      al.
- id: PMID:34623639
  title: >-
    Pharmacological characterization of novel heteromeric GluCl subtypes from
    Caenorhabditis elegans and parasitic nematodes.
  findings:
  - statement: >-
      Lamassiaude et al. cloned Bma-AVR-14B and reconstituted a functional
      heteromeric Bma-AVR-14B/Bma-GLC-2 glutamate-gated chloride channel in
      Xenopus oocytes.
    supporting_text: >-
      For C. elegans, B. malayi and P. univalens, the combination of
      AVR‐14B/GLC‐2 led to the robust expression of glutamate‐sensitive
      receptors.
  - statement: >-
      Bma-AVR-14B was active as part of the Bma-AVR-14B/Bma-GLC-2 heteromer,
      while B. malayi AVR-14B, GLC-2, GLC-3 and GLC-4 were not robustly active
      as single-subunit recombinant receptors.
    supporting_text: >-
      none of the GluCl subunits from the parasites B. malayi or from
      P. univalens (i.e., AVR‐14B, GLC‐2, GLC‐3 and GLC‐4) gave rise to robust
      functional channels when expressed in the Xenopus oocytes
  - statement: >-
      The Bma-AVR-14B/Bma-GLC-2 receptor was sensitive to ivermectin and
      moxidectin.
    supporting_text: >-
      AVR‐14B/GLC‐2 from C. elegans, B. malayi and P. univalens were sensitive
      to ivermectin and moxidectin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary full-text support for the functional activity of the Bma-AVR-14B
      sequence in A0A0K0J2Q9; the Bma-AVR-14B accession from this paper is the
      MW196269/QRW38687.1 EMBL record cross-referenced by UniProt.
