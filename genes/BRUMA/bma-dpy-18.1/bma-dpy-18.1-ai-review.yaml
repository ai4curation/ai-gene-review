- id: PMID:23223450
  title: Prolyl 4-hydroxlase activity is essential for development and cuticle formation
    in the human infective parasitic nematode Brugia malayi.
  findings:
  - statement: >-
      Combined RNAi of Bma-phy-1 and Bma-phy-2 causes a severe first-stage
      larval morphology phenotype.
    supporting_text: >-
      Pronounced mutant body morphology phenotypes of stunted, lumpy immotile
      larvae, were found in first stage larvae when Bma-phy-1 and Bma-phy-2
      were disrupted simultaneously, but not singly
    reference_section_type: DISCUSSION
  - statement: >-
      Bma-PHY-2 is a prolyl 4-hydroxylase alpha-like protein that conserves the
      residues needed for structure, complex formation, and enzyme activity.
    supporting_text: >-
      all residues identified as being required for protein structure, complex
      formation, and enzyme activity
      ... are conserved in Bma-PHY-2
    reference_section_type: RESULTS
  - statement: >-
      Native Bma-PHY-1 and Bma-PHY-2 occur in Bma-PDI-2-containing complexes,
      including a covalently linked parasite-specific form.
    supporting_text: >-
      Our co-IP analysis showed that in vivo Bma-PHY-1 and -2 are each found in
      two types of complex with Bma-PDI-2.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary study that cloned Bma-phy-2/Q68VC1, showed conservation
      of Bma-PHY-2 catalytic and complex-formation residues, assayed
      Bma-phy-1/Bma-phy-2 RNAi in cultured B. malayi adults, and detected
      parasite-native Bma-PHY-2 in covalently linked Bma-PDI-2 complexes.
