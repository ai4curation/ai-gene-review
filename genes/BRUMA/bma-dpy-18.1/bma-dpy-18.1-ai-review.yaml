product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6279
  label: Brugia malayi
description: >-
  bma-dpy-18.1 encodes Bma-PHY-2, a secretory procollagen proline
  4-hydroxylase alpha subunit of the filarial nematode Brugia malayi. The
  protein has an N-terminal signal peptide, a C-terminal Fe(II)- and
  2-oxoglutarate-dependent dioxygenase domain, and the conserved catalytic
  residues required for collagen prolyl 4-hydroxylation. In parasite material,
  Bma-PHY-2 forms endoplasmic-reticulum collagen P4H complexes with Bma-PDI-2,
  including a parasite-specific form with a non-reducible covalent link between
  each PHY alpha subunit and PDI-2. Combined RNAi of bma-dpy-18.1/bma-phy-2
  and bma-phy-1 in cultured adult females produces stunted, lumpy, immotile
  first-stage larvae, supporting a redundant role for the two alpha subunits in
  collagenous cuticle formation during larval development.
