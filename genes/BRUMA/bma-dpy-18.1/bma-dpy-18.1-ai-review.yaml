knowledge_gaps:
- gap_statement: >-
    The enzyme or chemistry that generates the parasite-specific
    non-reducible covalent Bma-PHY/Bma-PDI-2 linkage remains unknown.
  boundary: >-
    Native B. malayi extracts contain covalently linked Bma-PHY-1/PDI-2 and
    Bma-PHY-2/PDI-2 complexes, while recombinant insect-cell expression
    produced analogous complexes with no detectable P4H activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Identifying the modification machinery would explain how filarial collagen
    P4H complexes become active and could reveal a parasite-specific cuticle
    biogenesis target upstream of both Bma-PHY alpha subunits.
  resolution: >-
    Map the covalent adduct in native Bma-PHY-2/PDI-2 by cross-linked peptide
    mass spectrometry and deplete candidate ER modifying enzymes while
    monitoring covalent complex formation and larval morphology.
  provenance:
  - reference_id: PMID:23223450
    supporting_text: >-
      The enzyme generating this modification is currently unknown but could
      potentially be identified by RNAi screening of candidate enzymes to
      identify a similar phenotype to that produced by knockdown of B. malayi
      PHY-1/-2 and PDI-2.
- gap_statement: >-
    The native B. malayi cuticle procollagen substrates of Bma-PHY-2 and any
    Bma-PHY-2-specific in vivo roles have not been identified.
  boundary: >-
    Combined Bma-phy-1/Bma-phy-2 RNAi causes a strong first-stage-larval
    morphology phenotype, whereas single Bma-phy-2 RNAi produced no visible
    larval phenotype under the tested culture conditions.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Resolving substrate selectivity and redundancy will show whether
    Bma-PHY-2 has a unique developmental or tissue role or is primarily a
    redundant catalytic partner of Bma-PHY-1 in filarial cuticle formation.
  resolution: >-
    Use stage- and tissue-resolved phy-1/phy-2 depletion, rescue with
    RNAi-resistant alleles, and hydroxyproline/peptidomics profiling of
    cuticle collagens to assign PHY-2-dependent substrates.
  provenance:
  - reference_id: PMID:23223450
    supporting_text: >-
      Applying either Bma-phy-1 or Bma-phy-2 RNAi singly
      ... produced no visible effects on either the females or the
      microfilaria produced
suggested_questions:
- question: >-
    What is the chemical identity of the non-reducible linkage between
    Bma-PHY-2 and Bma-PDI-2, and which enzyme installs it in the Brugia ER?
  experts:
  - Alan D. Winter
  - Alan P. Page
- question: >-
    Do Bma-PHY-1 and Bma-PHY-2 hydroxylate the same cuticle collagens in vivo,
    or are there stage- or substrate-specific collagen targets for the Q68VC1
    alpha subunit?
  experts:
  - Alan D. Winter
  - Alan P. Page
suggested_experiments:
- description: >-
    Immunopurify the native Bma-PHY-2/Bma-PDI-2 complex from adult worms and
    identify the non-reducible cross-link by intact mass spectrometry and
    cross-linked peptide LC-MS/MS.
  hypothesis: >-
    Bma-PHY-2 is activated by a defined covalent adduct to Bma-PDI-2 that is
    absent from inactive insect-cell recombinant complexes.
  experiment_type: native complex biochemistry
- description: >-
    Perform individual and combined phy-1/phy-2 RNAi across Brugia life stages
    and quantify collagen hydroxyproline, cuticle ultrastructure, and
    procollagen substrates by targeted peptidomics.
  hypothesis: >-
    The Q68VC1 alpha subunit is partly redundant with Bma-PHY-1 but contributes
    measurably to hydroxylation of a subset of cuticle collagens.
  experiment_type: loss of function
