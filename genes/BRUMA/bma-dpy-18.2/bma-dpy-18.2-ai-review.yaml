- id: PMID:12417582
  title: >-
    A hypodermally expressed prolyl 4-hydroxylase from the filarial nematode
    Brugia malayi is soluble and active in the absence of protein disulfide
    isomerase.
  findings:
  - statement: >-
      Recombinant Bma-PHY-1 is an active prolyl 4-hydroxylase without an added
      protein disulfide isomerase beta subunit.
    supporting_text: >-
      The recombinant B. malayi alpha subunit, PHY-1, is a soluble and active
      P4H by itself, and it does not become associated with protein disulfide
      isomerase.
    reference_section_type: ABSTRACT
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:23223450
      review_notes: >-
        The recombinant insect-cell result does not generalize to parasite
        material; the follow-up detected native Bma-PHY-1 in Bma-PDI-2
        complexes.
      supported_by:
      - reference_id: PMID:23223450
        supporting_text: >-
          Our co-IP analysis showed that in vivo Bma-PHY-1 and -2 are each found
          in two types of complex with Bma-PDI-2.
  - statement: >-
      Active recombinant Bma-PHY-1 forms a homotetramer with catalytic
      properties similar to C. elegans prolyl 4-hydroxylases.
    supporting_text: >-
      The active enzyme form is a homotetramer with catalytic and inhibition
      properties similar to those of the C. elegans P4Hs.
    reference_section_type: ABSTRACT
  - statement: >-
      Active recombinant Bma-PHY-1 does not rescue a C. elegans prolyl
      4-hydroxylase mutant.
    supporting_text: >-
      Although active by itself, the B. malayi PHY-1 was not able to replace
      enzyme function in a C. elegans P4H mutant.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only primary study that cloned and characterized the Bma-PHY-1
      prolyl 4-hydroxylase alpha subunit, showing recombinant P4H activity,
      soluble homotetramer formation, developmental transcript expression, and
      hypodermal expression in a C. elegans reporter assay. Its recombinant
      no-PDI-association result must be interpreted in light of the later
      native-parasite co-IP study of PMID:23223450.
- id: PMID:23223450
  title: Prolyl 4-hydroxlase activity is essential for development and cuticle formation
    in the human infective parasitic nematode Brugia malayi.
  findings:
  - statement: >-
      Combined RNAi of Bma-phy-1 and Bma-phy-2 causes a severe first-stage
