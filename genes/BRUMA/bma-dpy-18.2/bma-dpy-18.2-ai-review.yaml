  label: Brugia malayi
description: >-
  bma-dpy-18.2 encodes the Bm3843/A0A1P6BZ71 Brugia malayi procollagen
  proline 4-hydroxylase alpha subunit corresponding to the cloned Bma-PHY-1
  enzyme. The protein has an N-terminal signal peptide, a C-terminal
  Fe(II)- and 2-oxoglutarate-dependent dioxygenase domain, and recombinant
  Bma-PHY-1 is an active collagen prolyl 4-hydroxylase alpha subunit that can
  form a soluble homotetramer in vitro. In parasite material, Bma-PHY-1 forms
  endoplasmic-reticulum collagen P4H complexes with Bma-PDI-2, including a
  parasite-specific form with a non-reducible covalent link between each PHY
  alpha subunit and PDI-2. Combined RNAi of bma-phy-1/bma-dpy-18.2 and
  bma-phy-2 in cultured adult females produces stunted, lumpy, immotile
  first-stage larvae, supporting a redundant role for the two alpha subunits in
  collagenous cuticle formation during larval development.
