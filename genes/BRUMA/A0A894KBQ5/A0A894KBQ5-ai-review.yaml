knowledge_gaps:
- gap_statement: >-
    The native B. malayi subunit partner or ancillary factor that allows
    Bma-GLC-4 to form a functional glutamate-gated chloride channel has not
    been identified.
  boundary: >-
    Bma-GLC-4 has GluCl-family domains and was cloned from B. malayi, and
    C. elegans and P. univalens GLC-4 orthologs supported functional
    heteromeric receptors. Bma-GLC-4 alone and the tested
    Bma-GLC-2/Bma-GLC-4 and Bma-GLC-3/Bma-GLC-4 combinations nevertheless did
    not produce detectable glutamate responses in Xenopus oocytes.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Identifying the native GLC-4-containing receptor would test whether this
    subunit is a functional macrocyclic lactone target in Brugia and would
    define the all-B. malayi channel composition to model in the GluCl module.
  resolution: >-
    Coexpress Bma-GLC-4 with candidate Brugia GluCl subunits and ancillary
    proteins, then test glutamate and macrocyclic lactone responses by
    two-electrode voltage clamp and follow confirmed combinations by in vivo
    localization and loss-of-function assays.
  provenance:
  - *cel_glc24_positive
  - *glc34_ortholog_positive
  - *bma_glc24_no
  - *bma_glc34_no
  - *glucl_ancillary_gap
suggested_questions:
- question: >-
    Which B. malayi GluCl subunit or accessory factor pairs with Bma-GLC-4 in
    the native parasite receptor, and does that receptor mediate macrocyclic
    lactone sensitivity in Brugia neurons or muscle?
  experts:
  - Parasitic nematode neurophysiologists
  - Nematode GluCl pharmacology experts
suggested_experiments:
- description: >-
    Express Bma-GLC-4 with candidate B. malayi GluCl subunits and ancillary
    proteins in Xenopus oocytes, then measure glutamate-gated currents and
    macrocyclic-lactone modulation.
  hypothesis: >-
    Bma-GLC-4 requires a native Brugia partner outside the tested
    Bma-GLC-2/Bma-GLC-4 and Bma-GLC-3/Bma-GLC-4 pairs to form a functional
    GluCl.
  experiment_type: heterologous receptor reconstitution
