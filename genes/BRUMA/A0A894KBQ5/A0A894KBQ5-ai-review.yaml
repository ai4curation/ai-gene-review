taxon:
  id: NCBITaxon:6279
  label: Brugia malayi
description: >-
  GLC-4 is a Brugia malayi 510-residue Cys-loop glutamate-gated chloride
  channel family subunit in the nematode inhibitory glutamatergic receptor
  family targeted by macrocyclic lactone anthelmintics. The protein corresponds
  to the cloned Bma-GLC-4 cDNA MW196268 and carries conserved extracellular
  ligand-binding and GluCl-family transmembrane signatures. Recombinant
  GLC-4 orthologs contributed to functional heteromeric receptors in the same
  study, but Bma-GLC-4 did not form a robust glutamate-sensitive homomeric
  channel in Xenopus oocytes, and the tested Bma-GLC-2/Bma-GLC-4 and
  Bma-GLC-3/Bma-GLC-4 combinations were also silent, leaving the native B.
  malayi receptor composition unresolved.
