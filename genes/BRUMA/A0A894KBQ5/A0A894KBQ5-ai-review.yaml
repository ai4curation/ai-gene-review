- id: PMID:34623639
  title: >-
    Pharmacological characterization of novel heteromeric GluCl subtypes from
    Caenorhabditis elegans and parasitic nematodes.
  findings:
  - statement: >-
      Lamassiaude et al. cloned Bma-GLC-4 and deposited the MW196268 cDNA that
      UniProt cross-references for A0A894KBQ5.
    supporting_text: >-
      The sequences used in this study are available on GenBank under the
      following accession numbers: B. malayi (Bma): AVR‐14B (MW196269), GLC‐2
      (MW196266), GLC‐3 (MW196267), GLC‐4 (MW196268)
  - statement: >-
      Bma-GLC-4 did not reconstitute a robust homomeric receptor and did not
      form a functional glutamate-sensitive receptor with Bma-GLC-2 or
      Bma-GLC-3 in the tested Xenopus-oocyte combinations.
    supporting_text: >-
      none of the GluCl subunits from the parasites B. malayi or from
      P. univalens (i.e., AVR‐14B, GLC‐2, GLC‐3 and GLC‐4) gave rise to robust
      functional channels when expressed in the Xenopus oocytes
  - statement: >-
      C. elegans and P. univalens GLC-4 orthologs contributed to functional
      GLC-2/GLC-4 or GLC-3/GLC-4 heteromeric receptors, supporting GLC-4 as a
      conserved GluCl-family subunit rather than as a Brugia-specific dead
      subunit.
    supporting_text: >-
      No currents could be recorded with 1‐mM glutamate application on oocytes
      injected with Bma‐GLC‐3/GLC‐4 (n = 13), although nA range currents were
      recorded for Cel‐GLC‐3/GLC‐4 and for Pun‐GLC‐3/GLC‐4.
  - statement: >-
      The B. malayi GLC-4 failure should be treated as a heterologous
      expression and composition boundary because the same work explicitly left
      open missing subunits or ancillary proteins as explanations for
      B. malayi GluCl reconstitution failures.
    supporting_text: >-
      Therefore, we can only speculate that additional subunits combining to
      GLC‐3 alone or GLC‐2/GLC‐3 of B. malayi are required to form functional
      receptors. In addition, we cannot exclude that ancillary proteins might be
      required for the functional expression of GluCl receptor in Xenopus
      oocytes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary full-text support for the cloned Bma-GLC-4 sequence in
      A0A894KBQ5 and for the negative recombinant expression boundary. The
      paper did not identify a functional B. malayi GLC-4-containing receptor:
      neither the Bma-GLC-2/Bma-GLC-4 nor Bma-GLC-3/Bma-GLC-4 combination
      produced a detectable glutamate response under the conditions tested.
