core_functions:
- description: >-
    Predicted Bma-GLC-4 Cys-loop GluCl-family receptor subunit with conserved
    extracellular ligand-binding and transmembrane domains. C. elegans and
    P. univalens GLC-4 orthologs contributed to recombinant heteromeric
    receptors, but Bma-GLC-4 alone and the tested Bma-GLC-2/Bma-GLC-4 and
    Bma-GLC-3/Bma-GLC-4 combinations did not form detectable
    glutamate-responsive channels in Xenopus oocytes, leaving its native
    B. malayi receptor composition unresolved.
