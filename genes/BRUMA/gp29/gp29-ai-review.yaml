suggested_questions:
- question: >-
    Does B. malayi GP29 (P67877) preferentially use glutathione, thioredoxin, or another
    reductant, and does the purified mature enzyme reduce phospholipid hydroperoxides
    efficiently enough to support GO:0047066 phospholipid-hydroperoxide glutathione
    peroxidase activity rather than the current GO:0004602 parent term?
  experts:
  - Filarial nematode redox biochemists
suggested_experiments:
- description: >-
    Express mature recombinant B. malayi GP29 and measure reduction of H2O2,
    soluble organic hydroperoxides and phospholipid hydroperoxides in coupled assays
    with glutathione/glutathione reductase/NADPH and thioredoxin/thioredoxin
    reductase/NADPH, including an active-site cysteine mutant.
  hypothesis: >-
    GP29 is a secreted cysteine-type GPx enzyme, and direct reductant/substrate
    measurements will resolve whether the B. malayi protein is glutathione-dependent
    and phospholipid-hydroperoxide specialized.
