id: P67877
gene_symbol: gp29
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6279
  label: Brugia malayi
description: >-
  gp29 encodes a secreted cysteine-type GPx-fold peroxidase and cuticular
  glycoprotein of Brugia malayi. The 223-residue precursor has an N-terminal
  signal peptide, two experimentally mapped N-glycosylation sites, a conserved
  GPx fold and a tetrameric quaternary structure. GP29 is released from the
  cuticle into the extracellular medium and occurs in B. malayi
  excretory-secretory products, placing it at the host-parasite interface where
  it may reduce extracellular hydroperoxides, neutralize products of lipid
  peroxidation, and contribute to peroxidase-mediated cuticular collagen
  cross-linking. Its peroxidatic residue is cysteine rather than selenocysteine,
  and the physiological reductant and hydroperoxide substrate range of the B.
  malayi enzyme remain unresolved.
existing_annotations:
- term:
    id: GO:0004601
    label: peroxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      GP29 is a secreted GPx-fold enzyme with a conserved peroxidatic active site,
      and primary Brugia gp29 studies support a peroxide-reducing role.
    action: ACCEPT
    reason: >-
      Peroxidase activity is the strongest molecular-function claim supported for
      this cysteine-type secretory GPx. GP29 was cloned from lymphatic filariae
      as a secretory homolog of glutathione peroxidase, the Brugia spp. protein
      models onto the GPx fold and forms a tetramer, and the P67877 active site
      maps to Cys74. GPx-fold enzymes reduce peroxide substrates even when
      glutathione is not their physiological reductant, so accept the generic
      peroxidase activity term rather than requiring a glutathione-specific
      assay.
    supported_by:
    - reference_id: PMID:7681545
      supporting_text: >-
        The modelled core of the gp29 structure is conserved compared to the bovine
        enzyme, consisting of a beta-sheet surrounded by alpha-helices.
    - reference_id: file:BRUMA/gp29/gp29-uniprot.txt
      record_section: ["FT:ACT_SITE"]
      supporting_text: |
        FT   ACT_SITE        74
        FT                   /evidence="ECO:0000250"
    - reference_id: file:BRUMA/gp29/gp29-notes.md
      supporting_text: >-
        P67877 has a cysteine-type catalytic center: UniProt marks residue 74 as
        the active site, and the SQ block places residue 74 on the cysteine in
        the local ATYCAYT motif.
- term:
    id: GO:0004602
    label: glutathione peroxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This combined automated row rests on a curated but untagged UniProt catalytic
      activity line and GPx-family signatures. GP29 is a cysteine-type GPx-fold
      peroxidase, but neither the B. malayi protein nor its Brugia ortholog has
      been shown to use glutathione as its physiological reductant.
    action: UNDECIDED
    reason: >-
      GP29 clearly belongs to the GPx family, but glutathione specificity cannot
      be decided from family membership alone. The peroxidatic position is Cys74
      rather than selenocysteine; the PTHR11592 family review explicitly warns
      that glutathione specificity does not transfer to every homolog; and the
      PANTHER tree prunes GO:0004602 while retaining GO:0004601 at several
      divergent GPx branches. P67877's curated EC 1.11.1.9 line is not supported
      by a direct B. malayi reductant assay, and the Brugia pahangi paper in which
      GP29 protects heterologous membranes from lipid peroxidation does not
      establish glutathione dependence from its cached record.
    supported_by:
    - reference_id: PMID:1631065
      supporting_text: >-
        We have cloned and identified the major cuticular glycoprotein (gp29) of
        lymphatic filarial nematode parasites as a homolog of the antioxidant
        enzyme glutathione peroxidase.
    - reference_id: PMID:7681545
      supporting_text: >-
        Experimental data showed that Brugia spp. gp29 has four subunits, and a
        tetrameric form of gp29 has also been modelled.
    - reference_id: file:BRUMA/gp29/gp29-uniprot.txt
      record_section: ["FT:ACT_SITE"]
      supporting_text: |
        FT   ACT_SITE        74
        FT                   /evidence="ECO:0000250"
    - reference_id: file:interpro/panther/PTHR11592/PTHR11592-review.yaml
      supporting_text: >-
        Glutathione specificity must not be inferred for every homolog
    - reference_id: file:interpro/panther/PTHR11592/PTHR11592-paint.tsv
      supporting_text: |
        PTHR11592	PTN002480736	GO:0004602	F	IRD	true	PANTHER:PTN002480721	taxon:9347	20260710
    - reference_id: file:BRUMA/gp29/gp29-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: |
        CC   -!- CATALYTIC ACTIVITY:
        CC       Reaction=2 glutathione + H2O2 = glutathione disulfide + 2 H2O;
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      GP29 is synthesized with an N-terminal signal peptide and UniProt curates
      it as secreted into the cuticle and ultimately into the medium. B. malayi
      proteomics independently identified P67877 in excretory-secretory products
      from microfilariae, adult females and adult males.
    action: ACCEPT
    reason: >-
      Extracellular region is the appropriate Cellular Component term for a
      protein in excretory-secretory products and in the cuticular/external
      medium. The term is broader than the cuticle, but UniProt's note says the
      protein is released from the cuticle into the medium, so a narrower
      cuticle-only term would not capture the full location.
    supported_by:
    - reference_id: PMID:18958170
      supporting_text: >-
        gp29 (P67877), a glutathione peroxidase believed to act as a lipid
        hydroperoxidase, protecting parasite membranes from peroxidation caused by
        oxygen free radicals [66]-[68], was identified in all 3 ESP sets.
    - reference_id: file:BRUMA/gp29/gp29-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: |
        CC   -!- SUBCELLULAR LOCATION: Secreted. Note=Secreted into the cuticle and
        CC       ultimately released into the medium.
    - reference_id: file:BRUMA/gp29/gp29-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: 'FT   SIGNAL          1..19'
- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      This InterPro2GO row transfers response to oxidative stress from the broad
      glutathione-peroxidase family. The term is plausible for a secreted Brugia
      peroxide-reducing enzyme, but existing B. malayi evidence directly
      establishes secretion and supports peroxide detoxification rather than a
      measured oxidative-stress response.
    action: KEEP_AS_NON_CORE
    reason: >-
      P67877 was detected in excretory-secretory products and is plausibly part
      of the parasite antioxidant defense. Still, the B. malayi ESP study
      interprets GP29 abundance as possible oxidative and nitric-oxide evasion
      rather than directly challenging this gene with oxidative stress or
      measuring loss of gp29. UniProt reports L3-to-adult expression rather than
      an oxidative-stress induction experiment. Keep response to oxidative
      stress as a plausible non-core process and treat cellular oxidant
      detoxification as the direct core process.
    supported_by:
    - reference_id: PMID:18958170
      supporting_text: >-
        the markedly higher abundance of gp29 in adult compared to Mf ESP
        suggests that this enzyme may play a more important role in adult survival
        compared to Mf.
    - reference_id: file:interpro/panther/PTHR11592/PTHR11592-review.yaml
      supporting_text: >-
        Secretory and specialized GPX-fold proteins still require physiological
        evidence
- term:
    id: GO:0098869
    label: cellular oxidant detoxification
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      Peroxidase activity reduces hydroperoxides, and secreted B. malayi GP29 is
      positioned to carry out that detoxification extracellularly.
    action: ACCEPT
    reason: >-
      Cellular oxidant detoxification is the direct biological-process
      consequence of the accepted peroxidase activity: GP29 is a secreted GPx-fold
      enzyme predicted to reduce peroxide substrates, and the protein is observed
      among B. malayi excretory-secretory products from mammalian-stage parasites.
      This term does not require the stronger unresolved claim that GP29 uses
      glutathione as its reductant, nor does it require proof that gp29 expression
      is induced by oxidative stress.
    supported_by:
    - reference_id: PMID:1631065
      supporting_text: >-
        A postulated role for this secreted enzyme could be inhibition of the
        oxidative burst of leukocytes and neutralization of secondary products of
        lipid peroxidation,
    - reference_id: PMID:18958170
      supporting_text: >-
        gp29 (P67877), a glutathione peroxidase believed to act as a lipid
        hydroperoxidase, protecting parasite membranes from peroxidation caused by
        oxygen free radicals [66]-[68], was identified in all 3 ESP sets.
    - reference_id: PMID:8631385
      supporting_text: >-
        Brugia pahangi: the cuticular glutathione peroxidase (gp29) protects
        heterologous membranes from lipid peroxidation.
core_functions:
- description: >-
    Secreted cysteine-type GPx-fold peroxidase that is released from the parasite
    cuticle into excretory-secretory products, placing the enzyme in the
    extracellular host-interface compartment where it can detoxify hydroperoxides.
    Its physiological reductant, and whether it is glutathione-dependent, remain
    unresolved.
  molecular_function:
    id: GO:0004601
    label: peroxidase activity
  directly_involved_in:
  - id: GO:0098869
    label: cellular oxidant detoxification
  locations:
