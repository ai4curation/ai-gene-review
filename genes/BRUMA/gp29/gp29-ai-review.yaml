  findings:
  - statement: >-
      P67877 was detected in microfilarial, female-adult and male-adult B. malayi
      excretory-secretory products, with higher relative abundance in adult ESP.
    supporting_text: >-
      gp29 (P67877), a glutathione peroxidase believed to act as a lipid
      hydroperoxidase, protecting parasite membranes from peroxidation caused by
      oxygen free radicals [66]-[68], was identified in all 3 ESP sets.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text proteomic analysis of B. malayi excretory-secretory products. It
