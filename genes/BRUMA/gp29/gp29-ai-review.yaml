  title: Molecular modelling and epitope prediction of gp29 from lymphatic filariae.
  findings:
  - statement: >-
      Experimental Brugia spp. data showed GP29 has four subunits, and modeling
      placed its two N-linked glycosylation sites on the surface of the tetramer.
    supporting_text: >-
      Experimental data showed that Brugia spp. gp29 has four subunits, and a
      tetrameric form of gp29 has also been modelled.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only primary modeling paper. The abstract verifies the GPx-fold
