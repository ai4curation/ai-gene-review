  findings:
  - statement: >-
      The primary gp29 cloning paper identified GP29 as the major cuticular
      glycoprotein of lymphatic filariae, a secreted homolog of glutathione
      peroxidase with a predicted signal peptide and two N-linked glycosylation
      sites.
    supporting_text: >-
      The derived amino acid sequence predicted a protein of 25.8 kDa, with an
      amino-terminal hydrophobic signal peptide and two sites for N-linked
      glycosylation, consistent with the documented properties of gp29.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary Brugia gp29 cloning paper. The local cache is abstract-only but
      the abstract directly supports GP29 family identity, secretion, and
      N-glycosylation-site claims.
