id: P67877
gene_symbol: gp29
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6279
  label: Brugia malayi
description: >-
  gp29 encodes the Brugia malayi cuticular glutathione peroxidase, a secreted
  glutathione-peroxidase-fold enzyme with an N-terminal signal peptide. The protein,
  also called the gp29/gp30 cuticular glycoprotein, is a soluble component of the
  filarial cuticle and was identified in B. malayi excretory-secretory products from
  microfilariae and adult worms. Primary Brugia gp29 studies established GP29 as a
  secretory homolog of glutathione peroxidase and modelled it as a tetrameric
  N-glycosylated protein. UniProtKB/Swiss-Prot curates EC 1.11.1.9 glutathione
  peroxidase activity for B. malayi GP29 and a secreted location in the cuticle and
  external medium; the protein is therefore positioned to reduce extracellular
  hydroperoxides at the parasite-host interface. B. malayi-specific evidence confirms
  secretion and GPx-family architecture, but the reductant preference and the precise
  hydroperoxide substrate range of P67877 still require direct biochemical measurement.
existing_annotations:
- term:
    id: GO:0004601
    label: peroxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      GP29 is a GPx-fold peroxidase and UniProt curates the more specific EC
      1.11.1.9 glutathione peroxidase reaction for this reviewed B. malayi entry.
    action: TOO_GENERAL
    reason: >-
      The peroxidase claim is true: P67877 carries the glutathione peroxidase
      fold and an experimentally studied active-site/tetramer architecture, and
      UniProt curates a hydrogen-peroxide reduction reaction on this accession.
      Because this review also accepts the more specific GO:0004602 glutathione
      peroxidase activity row, the generic peroxidase activity parent is a
      correct but less informative molecular-function annotation.
    supported_by:
    - reference_id: PMID:7681545
      supporting_text: >-
        The modelled core of the gp29 structure is conserved compared to the bovine
        enzyme, consisting of a beta-sheet surrounded by alpha-helices.
    - reference_id: file:BRUMA/gp29/gp29-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: |
        CC   -!- CATALYTIC ACTIVITY:
        CC       Reaction=2 glutathione + H2O2 = glutathione disulfide + 2 H2O;
- term:
    id: GO:0004602
    label: glutathione peroxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This combined automated row rests on the UniProtKB/Swiss-Prot EC 1.11.1.9
      catalytic-activity annotation and GPx-family signatures. Brugia gp29 was
      cloned as a secretory homolog of glutathione peroxidase, and the modelled
      Brugia protein preserves the glutathione-peroxidase fold and tetrameric
      architecture, so glutathione peroxidase activity is accepted as the best
      current molecular-function term for B. malayi GP29.
    action: ACCEPT
    reason: >-
      The EC 1.11.1.9 row is stronger for P67877 than a bare heterogeneous
      family transfer: GP29 was identified in Brugia spp. as a secretory homolog
      of glutathione peroxidase, UniProtKB/Swiss-Prot curates EC 1.11.1.9 on the
      reviewed B. malayi entry, and the protein has a GPx fold that could be
      modelled on bovine glutathione peroxidase with experimentally supported
      tetramer formation. The old Brugia pahangi gp29 paper reports membrane
      lipid-peroxidation protection in its title, and later B. malayi
      proteomics discuss GP29 as a likely lipid hydroperoxidase, but that
      evidence is not sufficient here to refine the B. malayi annotation to
      GO:0047066 phospholipid-hydroperoxide glutathione peroxidase activity.
    supported_by:
    - reference_id: PMID:1631065
      supporting_text: >-
        We have cloned and identified the major cuticular glycoprotein (gp29) of
        lymphatic filarial nematode parasites as a homolog of the antioxidant
        enzyme glutathione peroxidase.
    - reference_id: PMID:7681545
      supporting_text: >-
        Experimental data showed that Brugia spp. gp29 has four subunits, and a
        tetrameric form of gp29 has also been modelled.
    - reference_id: file:BRUMA/gp29/gp29-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: |
        CC   -!- CATALYTIC ACTIVITY:
        CC       Reaction=2 glutathione + H2O2 = glutathione disulfide + 2 H2O;
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      GP29 is synthesized with an N-terminal signal peptide and UniProt curates
      it as secreted into the cuticle and ultimately into the medium. B. malayi
      proteomics independently identified P67877 in excretory-secretory products
      from microfilariae, adult females and adult males.
    action: ACCEPT
    reason: >-
      Extracellular region is the appropriate Cellular Component term for a
      protein in excretory-secretory products and in the cuticular/external
      medium. The term is broader than the cuticle, but UniProt's note says the
      protein is released from the cuticle into the medium, so a narrower
      cuticle-only term would not capture the full location.
    supported_by:
    - reference_id: PMID:18958170
      supporting_text: >-
        gp29 (P67877), a glutathione peroxidase believed to act as a lipid
        hydroperoxidase, protecting parasite membranes from peroxidation caused by
        oxygen free radicals [66]-[68], was identified in all 3 ESP sets.
    - reference_id: file:BRUMA/gp29/gp29-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: |
        CC   -!- SUBCELLULAR LOCATION: Secreted. Note=Secreted into the cuticle and
        CC       ultimately released into the medium.
    - reference_id: file:BRUMA/gp29/gp29-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: 'FT   SIGNAL          1..19'
- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      This InterPro2GO row transfers response to oxidative stress from the broad
      glutathione-peroxidase family. The term is plausible for a secreted
      peroxide-reducing enzyme, but existing B. malayi evidence directly
      establishes secretion and supports peroxide detoxification rather than a
      regulated oxidative-stress response.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      P67877 was detected in excretory-secretory products and has a curated GPx
      catalytic reaction, so its enzyme chemistry fits oxidant detoxification.
      The B. malayi ESP study interprets GP29 abundance as possible oxidative
      and nitric-oxide evasion, but that is a host-interface model rather than a
      direct oxidative-stress challenge, expression response, or loss-of-function
      experiment for this gene. Keep cellular oxidant detoxification as the
      direct process and treat the generic InterPro response-to-stress row as an
      over-propagated family-level assertion.
    supported_by:
    - reference_id: PMID:18958170
      supporting_text: >-
        the markedly higher abundance of gp29 in adult compared to Mf ESP
        suggests that this enzyme may play a more important role in adult survival
        compared to Mf.
    - reference_id: file:interpro/panther/PTHR11592/PTHR11592-review.yaml
      supporting_text: 'functional_coherence: HETEROGENEOUS'
- term:
    id: GO:0098869
    label: cellular oxidant detoxification
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      Glutathione peroxidase activity reduces hydroperoxides, and secreted B. malayi
      GP29 is positioned to carry out that detoxification extracellularly.
    action: ACCEPT
    reason: >-
      Cellular oxidant detoxification is the direct biological-process consequence
      of the accepted peroxidase activity: GP29 is a secreted GPx enzyme that
      reduces peroxide substrates, and the protein is observed among B. malayi
      excretory-secretory products from mammalian-stage parasites. This term does
      not require the stronger unsupported claim that GP29 is itself induced by
      oxidative stress.
    supported_by:
    - reference_id: PMID:1631065
      supporting_text: >-
        A postulated role for this secreted enzyme could be inhibition of the
        oxidative burst of leukocytes and neutralization of secondary products of
        lipid peroxidation,
    - reference_id: PMID:18958170
      supporting_text: >-
        gp29 (P67877), a glutathione peroxidase believed to act as a lipid
        hydroperoxidase, protecting parasite membranes from peroxidation caused by
        oxygen free radicals [66]-[68], was identified in all 3 ESP sets.
    - reference_id: file:BRUMA/gp29/gp29-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: |
        CC   -!- CATALYTIC ACTIVITY:
        CC       Reaction=2 glutathione + H2O2 = glutathione disulfide + 2 H2O;
