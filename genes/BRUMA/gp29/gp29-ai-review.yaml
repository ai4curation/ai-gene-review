    label: extracellular region
  supported_by:
  - reference_id: PMID:1631065
    supporting_text: >-
      We have cloned and identified the major cuticular glycoprotein (gp29) of
      lymphatic filarial nematode parasites as a homolog of the antioxidant enzyme
      glutathione peroxidase.
  - reference_id: PMID:18958170
    supporting_text: >-
      gp29 (P67877), a glutathione peroxidase believed to act as a lipid
      hydroperoxidase, protecting parasite membranes from peroxidation caused by
      oxygen free radicals [66]-[68], was identified in all 3 ESP sets.
  - reference_id: PMID:7681545
    supporting_text: >-
      The modelled core of the gp29 structure is conserved compared to the bovine
      enzyme, consisting of a beta-sheet surrounded by alpha-helices.
suggested_questions:
- question: >-
    Does B. malayi GP29 (P67877) preferentially use glutathione, thioredoxin, or another
    reductant, and does the purified mature enzyme reduce phospholipid hydroperoxides
    efficiently enough to support GO:0004602 glutathione peroxidase activity or
    GO:0047066 phospholipid-hydroperoxide glutathione peroxidase activity?
  experts:
  - Filarial nematode redox biochemists
- question: >-
    Does B. malayi GP29 directly catalyze the dityrosine, trityrosine and
    isotrityrosine cross-links found in filarial cuticular collagen, and is that
    reaction a physiological function of the same secreted GPx-fold enzyme?
  experts:
  - Filarial nematode cuticle biochemists
suggested_experiments:
- description: >-
    Express mature recombinant B. malayi GP29 and measure reduction of H2O2,
    soluble organic hydroperoxides and phospholipid hydroperoxides in coupled assays
    with glutathione/glutathione reductase/NADPH and thioredoxin/thioredoxin
    reductase/NADPH, including an active-site cysteine mutant.
  hypothesis: >-
    GP29 is a secreted cysteine-type GPx enzyme, and direct reductant/substrate
    measurements will resolve whether the B. malayi protein is glutathione-dependent
    and phospholipid-hydroperoxide specialized.
