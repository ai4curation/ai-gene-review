  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q18817
  - WormBase:C54C6.2.1
  review:
    summary: >-
      EnsemblMetazoa transfer from the C. elegans ben-1 egg-laying phenotype.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The C. elegans source row records a tissue-specific RNAi effect in
      uterine muscle cells. WormBase maps Lacroix et al.'s TBB-5 hit to ben-1,
      consistent with recent C. elegans literature listing ben-1 rather than a
      separate tbb-5 locus among the six beta-tubulin genes. The RNAi result is
