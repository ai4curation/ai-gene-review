id: Q66T51
gene_symbol: Q66T51
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6279
  label: Brugia malayi
description: >-
  Q66T51 is a full-length Brugia malayi beta-tubulin chain encoded by a
  filarial cDNA from a benzimidazole-resistance marker study; its sequence is
  447/448 identical to the reviewed BMA-BEN-1 beta-tubulin, differing only by
  T352 in place of A352. Q66T51 therefore likely samples the same Bma-ben-1
  locus as an allelic or sequencing variant. It contains the conserved
  Tubulin/FtsZ GTPase and C-terminal beta-tubulin domains and is expected to
  heterodimerize with alpha-tubulin and supply a beta structural subunit of
  microtubules.
