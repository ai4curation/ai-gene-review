knowledge_gaps:
- gap_statement: >-
    The B. malayi beta-tubulin isotype that forms the drug-engaged
    benzimidazole target has not been experimentally identified.
  boundary: >-
    Q66T51 is a near-identical BMA-BEN-1 cDNA variant and carries the wild-type
    F167/E198/F200 beta-tubulin haplotype. No B. malayi loss-of-function,
    allele-swap, expression or resistance-mapping experiment has tested whether
    the Bma-ben-1/Q66T51 isotype is the flubendazole or oxfendazole response
    determinant.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the sensitive Brugia beta-tubulin isotype would define the
    on-target parasite microtubule species for the benzimidazole drug-target
    lane and would make future resistance-variant interpretation less dependent
    on C. elegans extrapolation.
  resolution: >-
    Perturb or edit bma-ben-1/Q66T51 and the closest paralogous beta-tubulins
    in Brugia, then measure microtubule integrity, worm viability and
    flubendazole or oxfendazole sensitivity.
  provenance:
  - reference_id: PMID:16103581
    supporting_text: >-
      Worms from treated patients had significantly higher frequencies of these
      mutations.
    full_text_unavailable: true
suggested_questions:
- question: >-
    Is the Bma-ben-1/Q66T51 beta-tubulin pool expressed in adult female
    microtubules exposed to flubendazole or oxfendazole, and does perturbing
    this isotype lower benzimidazole susceptibility?
suggested_experiments:
- description: >-
    Measure bma-ben-1/Q66T51 stage and tissue expression against the other
    full-length beta-tubulin paralogs, and reconstitute Q66T51-containing
    alpha/beta-tubulin heterodimers for benzimidazole binding or polymerization
    assays.
  hypothesis: >-
    Q66T51 encodes a benzimidazole-sensitive beta-tubulin sequence, but its
    contribution to B. malayi benzimidazole response depends on isotype usage,
    microtubule assembly context or drug exposure rather than on beta-tubulin
    family membership alone.
  experiment_type: biochemical reconstitution
