- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      Consistent with the biology. The enzyme carries an N-terminal signal
      peptide and Wu et al. localized B. malayi chitinase to the microfilarial
      inner body and pharyngeal thread, consistent with secretion from that store
      during vector transmission and exsheathment. Localization is not the core
      function, so retained as non-core.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: file:BRUMA/mf1/mf1-uniprot.txt
      record_section: ["FT:SIGNAL", "FT:CHAIN"]
      supporting_text: |
        FT   SIGNAL          1..22
        FT   CHAIN           23..504
        FT                   /note="Endochitinase"
    - reference_id: PMID:18611418
      supporting_text: >-
        Observation using the IEM implicates two distinct routes of chitinase
        secretion from the inner body, via either the pharyngeal thread, or
        during transmission of the microfilariae to the vector, contained in
        vesicle-like structures.
- term:
