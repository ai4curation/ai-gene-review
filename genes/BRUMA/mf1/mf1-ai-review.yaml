id: P29030
gene_symbol: mf1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6279
  label: Brugia malayi
description: >-
  Secreted microfilarial endochitinase (EC 3.2.1.14) of the lymphatic filarial
  nematode Brugia malayi, also known historically as the MF1 antigen. The protein
  is a glycosyl hydrolase family 18 (GH18) chitinase with a catalytic GH18 domain
  and a C-terminal type-2 chitin-binding (CBM14) module, and it catalyzes random
  endo-hydrolysis of beta-1,4-linked N-acetylglucosamine in chitin and
  chitodextrins. MF1/chitinase is detected in the microfilarial stage as
  infectivity to the mosquito vector begins, is stored in the microfilarial inner
  body, and is secreted during transmission and exsheathment. Its chitin-degrading
  activity is therefore positioned to act on chitin-containing sheath or
  vector-stage structures as the parasite moves from the vertebrate host into the
  mosquito.
existing_annotations:
- term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Correct but more general than the specific function. This protein is a
      GH18 endochitinase; the broad parent O-glycosyl-hydrolase term should be
      replaced by the specific chitinase activity supported by the catalytic
      activity (EC 3.2.1.14) and experimental chitinolytic data.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0004568
      label: chitinase activity
    reason: >-
      The GO_REF:0000002 row's InterPro:IPR001579 source is a GH18 chitinase
      active-site signature, and the GH18 catalytic domain plus demonstrated
      chitin-degrading activity indicate chitinase activity (GO:0004568, a child
      of GO:0004553) is the informative molecular-function term.
    supported_by:
    - reference_id: PMID:1542646
      supporting_text: >-
        When microfilarial extracts and purified preparations of the MF1 antigen
        were tested for chitinase activity, strong bands of chitin-degrading
        activity comigrated in SDS/PAGE with p70 and p75
    - reference_id: file:BRUMA/mf1/mf1-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: |
