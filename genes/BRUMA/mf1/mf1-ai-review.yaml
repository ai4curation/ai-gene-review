- id: PMID:1542646
  title: Transmission-blocking antibodies recognize microfilarial chitinase in brugian
    lymphatic filariasis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary report (Fuhrman et al., PNAS 1992) that cloned the
      MF1 antigen, showed it is a microfilarial chitinase with chitin-degrading
      activity comigrating with the antigen, and proposed its role in degrading
      chitin-containing structures during development/transmission. Directly
      establishes the chitinase function of P29030. Cached publication text is
      abstract-only, but the abstract contains enough direct evidence for the
      row-local chitinase, endochitinase and chitin catabolism decisions.
- id: PMID:18611418
  title: >-
    Chitinase is stored and secreted from the inner body of microfilariae and has
    a role in exsheathment in the parasitic nematode Brugia malayi.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary report that used immuno-electron microscopy to localize
      B. malayi MF1/chitinase to the microfilarial inner body and pharyngeal
      thread and showed that allosamidin-sensitive chitinase activity
      participates in in vitro microfilarial exsheathment.
- id: file:BRUMA/mf1/mf1-uniprot.txt
  title: UniProtKB flat file for Brugia malayi mf1/Endochitinase P29030
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reviewed UniProtKB entry for P29030, including the EC 3.2.1.14 catalytic
      activity, the predicted signal peptide, the GH18 catalytic domain, the
      C-terminal type-2 chitin-binding domain, and catalytic-site and
      chitin-binding residues. Its EMBL M73689 cross-reference matches the
      B. malayi chitinase accession named by PMID:18611418, and its PANTHER
      cross-reference places P29030 in PTHR11177:SF400.
