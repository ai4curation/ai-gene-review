        FT                   /note="GH18"
        FT                   /evidence="ECO:0000255|PROSITE-ProRule:PRU01258"
- term:
    id: GO:0004568
    label: chitinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Accurate core molecular function. The protein is a GH18-family chitinase
      with the EC 3.2.1.14 catalytic activity; native Brugia malayi MF1 antigen
      has demonstrated chitin-degrading activity, and chitinolytic bands
      comigrate with the MF1 antigen.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:1542646
      supporting_text: >-
        Thus, the MF1 antigen is microfilarial chitinase, which may function to
        degrade chitin-containing structures in the microfilaria or in its
        mosquito vector during parasite development and transmission.
    - reference_id: file:BRUMA/mf1/mf1-uniprot.txt
