id: P10088
gene_symbol: tfdA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:264198
  label: Cupriavidus pinatubonensis JMP134
description: >-
  TfdA is the 2-oxoglutarate-dependent, Fe(2+)-dependent dioxygenase encoded on
  plasmid pJP4 that initiates degradation of the herbicide
  2,4-dichlorophenoxyacetate (2,4-D). It cleaves the ether side chain
  oxidatively, consuming 2-oxoglutarate and O2 to release 2,4-dichlorophenol,
  glyoxylate, succinate and CO2, and defines its own family (TfdA dioxygenase)
  within the Fe(2+)/2-oxoglutarate oxygenase fold. It also accepts
  2-methyl-4-chlorophenoxyacetate and, with the gene transferred to other hosts,
  enables growth on unchlorinated phenoxyacetate. Transposon mutants lacking
  2,4-D monooxygenase activity are complemented by the cloned gene, and transfer
  of tfdA alone confers phenoxyacetate utilization, establishing the enzyme as
  the pathway's committed first step. The enzyme is self-inactivating through
  oxidative hydroxylation of Trp-113.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003819
  review:
    summary: >-
      Root oxidoreductase term from the TfdA-family InterPro signature,
      redundant with the specific dioxygenase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      IPR003819 is the TfdA-family signature itself, so the domain match is
      correct, but it is mapped only to the root of the oxidoreductase branch.
      GO:0016491 is an ancestor of GO:0018602, which is already annotated. The
      InterPro-to-GO mapping is conservative here because the family's members
      vary in substrate; for this gene the specific activity is established and
      the root term adds nothing.
- term:
    id: GO:0018602
    label: 2,4-dichlorophenoxyacetate alpha-ketoglutarate dioxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:48984
  review:
    summary: >-
      Rhea-mapped IEA to the exactly matching specific term; correct, but GOA
      carries no experimental annotation for this well-characterized enzyme.
    action: ACCEPT
    reason: >-
      RHEA:48984 is an exactMatch of GO:0018602, so this automatic annotation
      lands on the right term. It is worth recording that the only MF annotation
      on tfdA is electronic: the gene has a transposon-mutant and
      heterologous-expression history from 1987 and detailed mechanistic
      enzymology, none of which is captured as IDA or IMP. The term is right and
      the evidence code understates what is known, which is a curation gap, not
      an annotation error.
    supported_by:
    - reference_id: PMID:3036764
      supporting_text: >-
        Expression of 2,4-D monooxygenase in Escherichia coli containing a
        1.4-kilobase subfragment was demonstrated by radioisotopic enzyme assay
- term:
    id: GO:0046300
    label: 2,4-dichlorophenoxyacetic acid catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00685
  review:
    summary: >-
      UniPathway-mapped process term, independently supported by mutant
      complementation and gene transfer.
    action: ACCEPT
    reason: >-
      Plasmid pJP4 carries the complete 2,4-D degradation gene set, tfdA was
      located by Tn5 mutagenesis of the 2,4-D-negative phenotype, and the cloned
      fragment complemented those mutants. Transfer of tfdA alone let a cured
      derivative grow on phenoxyacetate as sole carbon and energy source. The
      process annotation would merit IMP from this work.
    supported_by:
    - reference_id: PMID:3036764
      supporting_text: >-
        A 3-kilobase fragment of pJP4 cloned in a broad-host-range vector could
        complement the 2,4-D-negative phenotype of two mutants which lacked
        2,4-D monooxygenase activity.
core_functions:
- description: >-
    TfdA oxidatively cleaves the ether side chain of 2,4-dichlorophenoxyacetate
    using Fe(2+) and 2-oxoglutarate, releasing 2,4-dichlorophenol and glyoxylate
    and committing the herbicide to the pJP4-encoded catabolic pathway that lets
    the host grow on 2,4-D.
  molecular_function:
    id: GO:0018602
    label: 2,4-dichlorophenoxyacetate alpha-ketoglutarate dioxygenase activity
  directly_involved_in:
  - id: GO:0046300
    label: 2,4-dichlorophenoxyacetic acid catabolic process
  supported_by:
  - reference_id: PMID:3036764
    supporting_text: >-
      Gene tfdA, which codes for the 2,4-D monooxygenase, has now been found by
      mutagenesis with transposon Tn5.
  - reference_id: PMID:3036764
    supporting_text: >-
      The recombinant strain could utilize phenoxyacetic acid as a sole source
      of carbon and energy.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is unchlorinated phenoxyacetate, or another natural aryloxyalkanoate such as
    a plant-derived auxin-like compound, the ancestral substrate? tfdA transfer
    confers growth on phenoxyacetate, which suggests the chlorinated herbicide
    is not required for activity.
- question: >-
    Why does GOA carry no experimental annotation for tfdA despite nearly four
    decades of genetics and enzymology? If Rhea-derived IEAs are the only MF
    evidence on well-studied xenobiotic-degradation enzymes generally, that is a
    systematic gap worth quantifying.
- question: >-
    Should the self-inactivating Trp-113 hydroxylation be captured as an
    annotation, and if so under which branch? It is a documented autocatalytic
    modification that limits the enzyme's functional lifetime.
suggested_experiments:
- description: >-
    Assay purified TfdA against a panel of natural aryloxyacetates and
    phenoxyalkanoates, including indole-3-acetate and plant phenolic ethers, and
    compare catalytic efficiencies with 2,4-D.
  experiment_type: enzyme kinetics
  hypothesis: >-
    TfdA's progenitor acted on a naturally occurring aryl ether, and 2,4-D
    activity was recruited from that pre-existing capability rather than arising
    de novo.
