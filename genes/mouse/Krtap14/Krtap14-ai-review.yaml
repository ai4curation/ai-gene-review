  label: Mus musculus
description: Keratin-associated protein 14 (Krtap14; also pmg-1, mKAP13) is a 167-aa glycine-, serine- and tyrosine-rich
  keratin-associated protein of the PMG family. It is expressed at high levels in the keratogenous zone of hair-follicle
  cortical cells during mid and late anagen, peaking in the first postnatal hair cycle, and the protein is found
  in the cytoplasm of keratinizing cortical cells. It is also transiently expressed in mammary epithelium at the
  onset of puberty and in sebaceous and eccrine sweat glands. In the hair cortex it is a matrix protein of the interfilamentous
  material that surrounds and cross-links the hair keratin intermediate filaments; any role in mammary gland development
  has not been established beyond expression.
