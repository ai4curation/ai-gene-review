suggested_questions:
- question: Which keratin residues or domains does Krtap14 cross-link or bind in the fibre, and does it pair preferentially
    with particular type I/type II trichocyte keratins or other KAPs?
- question: Is Krtap14 functionally redundant with its paralogues in the same KAP cluster, or does its loss change
    fibre mechanics, diameter or curvature?
- question: 'HGT KAPs have few cysteines: does this protein link to keratin filaments covalently, by non-covalent
    head-domain binding (as reported for KAP8.1), or both, and does it help set ortho/para-cortex architecture?'
suggested_experiments:
- description: Generate a Krtap14 knockout (CRISPR, ideally together with close paralogues) and measure fibre tensile
    strength, diameter, curvature and ortho/para-cortex organization, with keratin/KAP proteomics of the fibre.
  hypothesis: Krtap14 contributes non-redundantly to fibre mechanics or morphology.
  experiment_type: knockout phenotyping
- description: Map Krtap14-keratin cross-links in native fibres by cross-linking mass spectrometry, and test binding
    of recombinant protein to trichocyte keratin head domains (ITC/pull-down) under non-reducing and reducing conditions.
  hypothesis: Krtap14 associates with specific keratin head/tail domains.
  experiment_type: biochemical binding / XL-MS
