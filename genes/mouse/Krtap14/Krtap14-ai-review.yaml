core_functions:
- description: 'Structural matrix constituent of the keratinized hair shaft: as a glycine/tyrosine-rich PMG-family
    KAP, Krtap14 is deposited in differentiating cortical keratinocytes around the trichocyte keratin intermediate
    filaments and becomes cross-linked (chiefly by disulfide bonds for cysteine-rich KAPs) to keratin head/tail
    domains and to other matrix proteins, forming the interfilamentous matrix that gives the fibre its rigidity
    and mechanical resistance.'
