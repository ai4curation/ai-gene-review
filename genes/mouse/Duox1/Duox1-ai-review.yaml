- id: PMID:20233719
  title: Mammalian numb-interacting protein 1/dual oxidase maturation factor 1 directs neuronal fate in stem cells.
  findings:
  - statement: Mouse Nip1/Duoxa1 interacts with Duox1 to drive Duox1-mediated ROS/H2O2 production during neural stem
      cell differentiation.
    supporting_text: The highest expression of Nip1 was observed in undifferentiated neuronal stem cells and was associated
      with Duox1-mediated reactive oxygen species ROS production.
- id: PMID:25761904
  title: When an Intramolecular Disulfide Bridge Governs the Interaction of DUOX2 with Its Partner DUOXA2.
  findings:
  - statement: Mammalian DUOX enzymes act as H2O2 generators in thyroid hormone biosynthesis and mucosal innate immunity.
    supporting_text: As H2O2 generator, it plays a key role in both thyroid hormone biosynthesis and innate immunity.
- id: PMID:32929281
  title: Structures of mouse DUOX1-DUOXA1 provide mechanistic insights into enzyme activation and regulation.
  findings:
  - statement: Cryo-EM structures of the mouse DUOX1-DUOXA1 complex in NADPH-free, NADPH-bound, and dimer-of-dimer
      states reveal the mechanism of DUOX1-DUOXA1 assembly, cofactor binding, and H2O2 production.
    supporting_text: Here I report cryo-EM structures of mouse DUOX1–DUOXA1 complexes in NADPH-free, NADPH-bound and
      dimer-of-dimer states, providing structural mechanisms underlying DUOX1–DUOXA1 activation and regulation and
      molecular insights into ROS production.
  - statement: The N-terminal peroxidase-homology domain (PHD) of mouse DUOX1 lacks heme and lacks the histidine residues
      that coordinate heme in genuine peroxidases.
    supporting_text: Though the PHD of DUOX1 has an overall architecture of peroxidase with an RMSD of 1.3 Å when
      superimposed with the bovine lactoperoxidase (LPO, PDB 5B72) (Extended Data Fig. 2a)21, the facts that no heme
      density is observed in the cryo-EM map and histidines needed for heme coordination are missing in the putative
      binding pocket strongly suggest that the PHD domain of DUOX1 lacks heme-dependent peroxidase activity.
- id: PMID:34168077
  title: Dual oxidase 1 promotes antiviral innate immunity.
  findings:
  - statement: Duox1 promotes antiviral innate immunity in the mouse airways in vivo, reducing influenza A virus mortality,
      morbidity, and lung viral load.
    supporting_text: Here, we show that Duox1 promotes antiviral innate immunity in vivo. Upon influenza airway challenge,
      Duox1-/- mice have enhanced mortality, morbidity, and impaired lung viral clearance.
