- term:
    id: GO:0042335
    label: cuticle development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9NRD9
  - ensembl:ENSP00000373689
  review:
    summary: Taxonomically invalid propagation of nematode-specific cuticle cross-linking (C. elegans BLI-3) via human
      DUOX1 to mouse Duox1.
    action: REMOVE
    reason: Mammals do not possess an extracellular collagenous cuticle. As documented in the human DUOX1 review,
      human DUOX1 was annotated to GO:0042335 via a cross-species rescue assay in C. elegans bli-3 worms (PMID:11262395),
      and Ensembl Compara (GO_REF:0000107) and MGI ISO (GO_REF:0000119) propagated that erroneous annotation onto
      mouse Duox1. Furthermore, the cryo-EM structure of mouse DUOX1 (PMID:32929281) proves its PHD lacks heme and
      cannot catalyze the peroxidase reaction required for cuticle dityrosine cross-linking.
    supported_by:
    - reference_id: PMID:32929281
      supporting_text: Though the PHD of DUOX1 has an overall architecture of peroxidase with an RMSD of 1.3 Å when
        superimposed with the bovine lactoperoxidase (LPO, PDB 5B72) (Extended Data Fig. 2a)21, the facts that no
        heme density is observed in the cryo-EM map and histidines needed for heme coordination are missing in the
        putative binding pocket strongly suggest that the PHD domain of DUOX1 lacks heme-dependent peroxidase activity.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:Q9NRD9
        source_label: human DUOX1
        source_status: SOURCE_BAD
        comment: Human DUOX1 carries GO:0042335 only from a heterologous C. elegans bli-3 rescue/similarity paper
          (PMID:11262395); neither humans nor mice have a nematode cuticle, and mammalian DUOX1 lacks heme in its
          PHD.
      residue_claims_not_applicable: Mammalian DUOX1 PHD lacks the histidine heme-coordination residues of genuine
        peroxidases, and cuticle development is a clade-restricted ecdysozoan anatomical process absent in vertebrates.
