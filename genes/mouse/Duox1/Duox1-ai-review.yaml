core_functions:
- description: Ca2+-regulated transmembrane NADPH:O2 oxidoreductase that forms an obligate heterodimer (or dimer of
    heterodimers) with DUOXA1 at the apical plasma membrane of airway, urothelial, and thyroid epithelial cells,
    transferring electrons from cytosolic NADPH through FAD and two transmembrane b-type hemes to reduce extracellular
    O2 directly into hydrogen peroxide (H2O2) for mucosal host defense and epithelial redox signaling.
  molecular_function:
    id: GO:0016174
    label: NAD(P)H oxidase H2O2-forming activity
  directly_involved_in:
  - id: GO:0050665
    label: hydrogen peroxide biosynthetic process
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0043020
    label: NADPH oxidase complex
  substrates:
  - id: CHEBI:57783
    label: NADPH(4-)
  - id: CHEBI:15379
    label: dioxygen
  supported_by:
  - reference_id: PMID:32929281
    supporting_text: Here I report cryo-EM structures of mouse DUOX1–DUOXA1 complexes in NADPH-free, NADPH-bound and
      dimer-of-dimer states, providing structural mechanisms underlying DUOX1–DUOXA1 activation and regulation and
      molecular insights into ROS production.
  - reference_id: PMID:32929281
    supporting_text: 'One possible electron transfer pathway was identified as follows: NADPH → FAD → HEME #2 →
      Phe1097 → HEME #1. Accordingly, mutations of Phe1097 reduced H2O2 production (Extended Data Fig. 4f).'
