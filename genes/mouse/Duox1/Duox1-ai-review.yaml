  review:
    summary: Unwarranted InterPro2GO mapping from the haem peroxidase domain superfamily signature (IPR010255); mouse
      DUOX1 PHD lacks heme and peroxidase activity, and DUOX1 generates H2O2 rather than responding to oxidative stress.
    action: REMOVE
    reason: In mouse DUOX1, cryo-EM demonstrates that the N-terminal peroxidase-homology domain matched by IPR010255
      lacks heme-coordinating histidines and binds no heme (PMID:32929281). Moreover, DUOX1 is an oxidant-producing
      NADPH oxidase rather than an enzyme that detoxifies or responds to oxidative stress.
    supported_by:
    - reference_id: PMID:32929281
      supporting_text: Though the PHD of DUOX1 has an overall architecture of peroxidase with an RMSD of 1.3 Å when
        superimposed with the bovine lactoperoxidase (LPO, PDB 5B72) (Extended Data Fig. 2a)21, the facts that no
        heme density is observed in the cryo-EM map and histidines needed for heme coordination are missing in the
        putative binding pocket strongly suggest that the PHD domain of DUOX1 lacks heme-dependent peroxidase activity.
