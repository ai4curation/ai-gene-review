id: A2AQ92
gene_symbol: Duox1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Dual oxidase 1 (Duox1) is a multi-pass transmembrane flavocytochrome that forms an obligate heterodimeric
  and heterotetrameric complex with the maturation factor Duoxa1 at the apical plasma membrane of epithelial cells
  to generate extracellular hydrogen peroxide (H2O2). Its cytosolic dehydrogenase domain binds NADPH and FAD and
  transfers electrons through two transmembrane hemes coordinated within helices S2-S5 (via Phe1097) to reduce extracellular
  O2 to H2O2 in a calcium-regulated manner mediated by intracellular EF-hand domains. Although Duox1 possesses a
  large N-terminal extracellular peroxidase-homology domain, cryo-EM structures of the mouse Duox1-Duoxa1 complex
  demonstrate that this domain lacks heme-coordinating histidines, binds no heme, and has no intrinsic peroxidase
  activity. Duox1-derived H2O2 serves as the substrate for lactoperoxidase-catalyzed hypothiocyanite synthesis in
  airway mucosal antiviral and antibacterial innate immunity, supports thyroid peroxidase-mediated thyroid hormone
  biosynthesis, and acts as a diffusible redox signal in epithelial wound repair, cell motility, and neural stem
  cell differentiation.
existing_annotations:
- term:
    id: GO:0004601
    label: peroxidase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9NRD9
  negated: true
  review:
    summary: Cryo-EM structures of the mouse DUOX1-DUOXA1 complex directly confirm that the extracellular N-terminal
      peroxidase-homology domain (PHD) lacks heme-coordinating histidines, binds no heme, and has no intrinsic peroxidase
      activity.
    action: ACCEPT
    reason: Keep the NOT annotation. In mouse DUOX1, just as in human DUOX1 (UniProtKB:Q9NRD9), the N-terminal PHD
      (residues 26-593) adopts a peroxidase-like fold but lacks the histidines required for heme coordination and
      shows no heme density in high-resolution cryo-EM maps (PMID:32929281). The two catalytic hemes of DUOX1 reside
      in the transmembrane ferric-reductase domain rather than the PHD.
    supported_by:
    - reference_id: PMID:32929281
      supporting_text: Though the PHD of DUOX1 has an overall architecture of peroxidase with an RMSD of 1.3 Å when
        superimposed with the bovine lactoperoxidase (LPO, PDB 5B72) (Extended Data Fig. 2a)21, the facts that no
        heme density is observed in the cryo-EM map and histidines needed for heme coordination are missing in the
        putative binding pocket strongly suggest that the PHD domain of DUOX1 lacks heme-dependent peroxidase activity.
    - reference_id: file:mouse/Duox1/Duox1-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: 'CAUTION: The role of the N-terminal peroxidase-like domain is unclear.'
