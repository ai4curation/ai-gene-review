description: Keratin-associated protein 16-3 (Krtap16-3; also Krtap16-10) is a small (86 aa) high glycine-tyrosine
  (HGT) keratin-associated protein of the Hoxc13-regulated KAP gene complex on mouse chromosome 16. Krtap16 genes
  are strongly expressed in a narrow zone of the lower and middle hair cortex in developing and cycling hair, with
  expression declining in catagen and absent in telogen, and are downregulated when Hoxc13 is overexpressed or Gata3
  is deleted. Like other HGT KAPs, it is a matrix protein of the keratinizing hair cortex that associates with hair
  keratin intermediate filaments and contributes to hair shaft structure.
