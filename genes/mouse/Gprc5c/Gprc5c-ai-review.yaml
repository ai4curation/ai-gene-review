  title: IPR002956 / InterPro2GO check for mouse Gprc5c (Q8K3J9)
  findings:
  - statement: IPR002956 matches only Drosophila BOSS and mouse Gprc5c among Swiss-Prot entries, on TM1/TM6 segments; human GPRC5C does not match.
    supporting_text: 'Q9NQ84 human GPRC5C: IPR002956 match = no'
