gene_symbol: Gprc5c
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
aliases:
- Raig3
- RAIG-3
description: >-
  Gprc5c (retinoic acid-induced gene 3, RAIG-3) encodes an orphan class C (family 3)
  seven-transmembrane G protein-coupled receptor of the chordate-specific GPRC5 group.
  Unlike other class C receptors it has only a short extracellular N-terminus and no
  Venus flytrap ligand-binding domain. It is induced by all-trans retinoic acid and is
  expressed mainly in peripheral tissues, including kidney proximal tubule (apical
  membrane), pancreatic islets, vascular smooth muscle, olfactory sensory neurons and
  dormant haematopoietic stem cells. In bone marrow, hyaluronic acid (and its
  N-acetylglucosamine subunit) signals through GPRC5C to raise intracellular calcium and
  keep haematopoietic stem cells dormant; Gprc5c-deficient stem cells divide faster and
  lose self-renewal under stress. In smooth muscle, GPRC5C dimerizes with the
  angiotensin II receptor AT1 (and with prostanoid receptors EP2 and IP) and facilitates
  angiotensin II binding and AT1-dependent contraction. In olfactory sensory neurons it
  sits at the ciliary transition zone and shapes ciliary composition. Additional roles
  in renal acid-base handling (via NHE3), beta-cell insulin secretion, osteoblast
  differentiation and leukemia stem cell metabolism have been reported. No endogenous
  ligand has been confirmed by direct binding, and there is no evidence that it binds
  the receptor tyrosine kinase ROS1.
