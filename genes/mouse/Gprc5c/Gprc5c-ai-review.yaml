core_functions:
- molecular_function:
    id: GO:0004930
    label: G protein-coupled receptor activity
  description: >-
    Orphan class C GPCR at the plasma membrane that transduces extracellular cues into
    calcium/cAMP signals. In haematopoietic stem cells, hyaluronic acid and NAG signal
    through GPRC5C to maintain dormancy; no ligand has been confirmed by direct binding.
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  - id: GO:1902034
    label: negative regulation of hematopoietic stem cell proliferation
  supported_by:
  - reference_id: PMID:35725769
    supporting_text: Addition of HA and NAG induced an increase in intracellular calcium levels, indicating that both activate GPRC5C signalling
  - reference_id: PMID:35725769
    supporting_text: In vitro single-cell cultivation of HSCs confirmed that Gprc5c KO had an accelerated division rate compared with wild-type (WT) control
- molecular_function:
    id: GO:0001664
    label: G protein-coupled receptor binding
  description: >-
    Heterodimerizes with other GPCRs (AT1, EP2, IP) through a conserved interface shared
    with GPRC5B, facilitating angiotensin II binding to AT1 and AT1-dependent smooth
    muscle contraction.
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:38597112
    supporting_text: GPRC5C and the Ang II receptor AT1 dimerize, and knockdown of GPRC5C resulted in reduced binding of Ang II to AT1 receptors
  - reference_id: PMID:42544579
    supporting_text: The related receptor GPRC5C can also dimerize with prostanoid receptors IP and EP2, and, in addition, it interacts with the Angiotensin II (AngII) receptor AT1, resulting in a facilitation of ligand binding and AT1-dependent signaling (15).
suggested_questions:
- question: >-
    Should InterPro restrict IPR002956 (PRINTS PR01223, Bride of sevenless) so that it
    no longer matches mouse Gprc5c, or should InterPro2GO drop GO:0005118 and
    GO:0007601 from this family entry? The Gprc5c hit is two fingerprint segments on
    TM1 and TM6, and the human ortholog does not match.
- question: >-
    Is hyaluronic acid a direct orthosteric ligand of GPRC5C, or does it act through a
    co-receptor (for example CD44) that brings it close to GPRC5C?
- question: >-
    Does GPRC5C, like GPRC5B, activate Src-family kinases (supporting the inherited
    protein kinase activator activity IBA), or does its divergent C-terminal tail lack
    this function?
suggested_experiments:
- hypothesis: Hyaluronic acid binds GPRC5C directly.
  description: >-
    Measure direct binding of defined-length hyaluronan oligosaccharides and NAG to
    purified GPRC5C (nanodisc SPR or radioligand/fluorescent-ligand binding), with
    mutations at the docking-predicted 7TM pocket and CD44 knockout cells as controls.
- hypothesis: GPRC5C does not bind ROS1.
  description: >-
    Co-express mouse GPRC5C with ROS1 in trans (co-culture of expressing cells) and
    test for ROS1 phosphorylation and co-immunoprecipitation, with NELL2 as positive
    control, to formally exclude a BOSS-like sevenless-binding role.
- hypothesis: GPRC5C couples to Gq in HSCs.
  description: >-
    Use G protein knockout HEK cells or BRET G protein sensors to identify which G
    protein family GPRC5C engages after hyaluronic acid or NAG stimulation.
