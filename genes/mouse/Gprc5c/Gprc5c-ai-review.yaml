- term:
    id: GO:1902034
    label: negative regulation of hematopoietic stem cell proliferation
  evidence_type: IMP
  original_reference_id: PMID:35725769
  review:
    summary: >-
      Gprc5c-KO HSCs divide faster and lose quiescence; GPRC5C overexpression enhances
      quiescence; hyaluronic acid and NAG delay HSC division only when Gprc5c is
      present.
    action: NEW
    reason: >-
      GPRC5C is the receptor in the hyaluronic acid-GPRC5C signalling axis that keeps
      HSCs dormant, so it does part of the work of the process (signal reception), and
      both loss- and gain-of-function data point the same way. Regulation of HSC
      proliferation is a recurring, well-supported finding (also the basis of the
      Gprc5c dormancy reporter).
    supported_by:
    - reference_id: PMID:35725769
      supporting_text: In vitro single-cell cultivation of HSCs confirmed that Gprc5c KO had an accelerated division rate compared with wild-type (WT) control
    - reference_id: PMID:35725769
      supporting_text: However, in vitro HA and NAG treatment of Gprc5c-KO HSCs did not affect quiescence, in vitro self-renewal capacity or in vivo self-renewal capacity compared with WT HSCs
    - reference_id: PMID:35725769
      supporting_text: GPRC5C OE led to enhanced quiescence as indicated by an increase of G0 cells, a slower first division rate and decreased CDK6 expression
- term:
    id: GO:0001664
    label: G protein-coupled receptor binding
  evidence_type: IPI
  original_reference_id: PMID:42544579
  review:
    summary: >-
      GPRC5C co-immunoprecipitates and dimerizes with the GPCRs AT1, EP2 and IP;
      mutating the conserved dimerization interface abolishes this.
    action: NEW
    reason: >-
      Heterodimerization with other GPCRs is the best-characterized mechanism by which
      GPRC5C acts (facilitating angiotensin II binding to AT1 and AT1 signalling in
      smooth muscle). GPCR binding is more informative than generic protein binding and
      is supported by interface-mutation and decoy-peptide data in mouse cells.
    supported_by:
    - reference_id: PMID:42544579
      supporting_text: In summary, GPRC5C displays the same dimerization pattern as GPRC5B in HEK cells, and its inactivation in macrophages reproduces the hyperactivity phenotype observed in GPRC5B-deficient macrophages.
    - reference_id: PMID:38597112
      supporting_text: GPRC5C and the Ang II receptor AT1 dimerize, and knockdown of GPRC5C resulted in reduced binding of Ang II to AT1 receptors
    - reference_id: PMID:42544579
      supporting_text: The related receptor GPRC5C can also dimerize with prostanoid receptors IP and EP2, and, in addition, it interacts with the Angiotensin II (AngII) receptor AT1, resulting in a facilitation of ligand binding and AT1-dependent signaling (15).
