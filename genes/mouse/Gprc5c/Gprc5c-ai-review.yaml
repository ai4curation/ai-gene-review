  title: GPRC5C regulates the composition of cilia in the olfactory system.
  findings:
  - statement: GPRC5C localizes to the ciliary transition zone of olfactory sensory neurons.
    supporting_text: In closer examination, GPRC5C was found in the ciliary transition zone.
- id: PMID:37418589
  title: The G protein-coupled receptor GPRC5C is a saccharide sensor with a novel
    'off' response.
  findings:
  - statement: GPRC5C-expressing cells show calcium 'off' responses to natural sugars.
    supporting_text: Our findings suggest that GPRC5C has receptor properties which lead to novel 'off' responses to saccharide detachment
- id: PMID:38597112
  title: Orphan GPCR GPRC5C Facilitates Angiotensin II-Induced Smooth Muscle Contraction.
  findings:
  - statement: GPRC5C dimerizes with AT1 and facilitates angiotensin II binding and vascular contraction.
    supporting_text: Our data show that GPRC5C regulates Ang II-dependent vascular contraction by facilitating AT1 receptor-ligand binding and signaling.
- id: PMID:42544579
  title: Small molecule inhibitor of orphan GPCR dimerization improves host defense
    and blood pressure control in mice.
  findings:
  - statement: GPRC5C shares the GPRC5B dimerization interface; blocking it alters EP2/AT1 signalling.
    supporting_text: Taken together, GPRC5C and GPRC5B share a partially conserved dimerization interface that can be blocked by decoy peptides to induce macrophage hyperactivity and improve host defense in the fecal peritonitis model.
- id: PMID:37639313
  title: GPRC5C drives branched-chain amino acid metabolism in leukemogenesis.
  findings:
  - statement: Gprc5c promotes AML via NF-kB and BCAA metabolism.
    supporting_text: Ectopic Gprc5c expression increased AML aggression through the activation of NF-κB
- id: PMID:37558192
  title: G-protein coupled receptor 5C (GPRC5C) is required for osteoblast differentiation
    and responds to EZH2 inhibition and multiple osteogenic signals.
  findings:
  - statement: GPRC5C depletion reduces osteoblast mineralization.
    supporting_text: Loss of function analyses revealed that shRNA-mediated depletion of GPRC5C decreases expression of bone markers (e.g., BGLAP and IBSP) and mineral deposition in response to BMP2 or GSK126.
- id: PMID:21827690
  title: Molecular evolution of a chordate specific family of G protein-coupled receptors.
  findings:
  - statement: GPRC5 receptors are chordate-specific; insect BOSS is only distantly related and has a long N-terminus.
    supporting_text: Together our results suggest that GPRC5 receptors seem to be a chordate specific class of GPCRs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Key evidence against transferring BOSS family functions to GPRC5C.
- id: PMID:21840300
  title: Comparative characterization of GPRC5B and GPRC5CLacZ knockin mice; behavioral
    abnormalities in GPRC5B-deficient mice.
  findings:
  - statement: Gprc5c-deficient mice are viable and fertile without behavioral deficits.
    supporting_text: GPRC5C-deficient mice have no apparent behavioral deficits
- id: PMID:32470107
  title: Detecting Gene Ontology misannotations using taxon-specific rate ratio comparisons.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Wei et al. 2020 RAR study; flagged GO:0005118 on Q8K3J9 (see projects/RAR_MISANNOTATION.md).
- id: PMID:39827240
  title: Structural basis for the interaction between the Drosophila RTK Sevenless
    (dROS1) and the GPCR BOSS.
  findings:
  - statement: Sevenless binds a C-terminal peptide of the BOSS extracellular region.
    supporting_text: This includes beta-strands in dROS1's third Fibronectin type III (FNIII) domain and a C-terminal peptide in BOSS' ECR.
- id: PMID:18392882
  title: Fast co-evolution of sevenless and bride of sevenless in endopterygote insects.
  findings:
  - statement: The BOSS extracellular region co-evolves with Sevenless and is not conserved outside Diptera.
    supporting_text: The extracellular region, however, is only detectably conserved within but not outside Diptera.
- id: PMID:32499443
  title: NELL2-mediated lumicrine signaling through OVCH2 is required for male fertility.
  findings:
  - statement: The mammalian ROS1 ligand is the secreted protein NELL2.
    supporting_text: neural epidermal growth factor-like-like 2 (NELL2), specifically binds to an orphan receptor tyrosine kinase, c-ros oncogene 1 (ROS1)
