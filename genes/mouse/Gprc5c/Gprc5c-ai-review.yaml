- term:
    id: GO:0005118
    label: sevenless binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002956
  review:
    summary: >-
      InterPro2GO from IPR002956 "Bride of sevenless protein", a family defined by a
      single PRINTS fingerprint (PR01223). Among Swiss-Prot entries it matches only the
      two Drosophila BOSS proteins and mouse Gprc5c; human GPRC5C and all other GPRC5
      members do not match. On Gprc5c the hits are two fingerprint segments
      (residues 48-73 and 241-265) that lie on TM1 and TM6, i.e. generic 7TM sequence.
      This is the annotation flagged by Wei et al. 2020 (PMID:32470107).
    action: REMOVE
    reason: >-
      Sevenless binding by BOSS is made by its large extracellular region (a C-terminal
      peptide of the BOSS ECR contacts the third FNIII domain of Sevenless/dROS1).
      Gprc5c has a 27-residue extracellular N-terminus and lacks any such domain; the
      GPRC5 group is chordate-specific and only distantly related to insect BOSS, whose
      ECR is not conserved even outside Diptera. Vertebrates do have the Sevenless
      ortholog ROS1, so taxon alone is not the objection, but no study links any GPRC5
      receptor to ROS1 (PubMed search 2026-10-19), and the physiological mammalian ROS1
      ligand is the secreted EGF-like protein NELL2. The annotation rests on a
      species-idiosyncratic PRINTS hit in transmembrane segments that the human
      ortholog does not share, so the InterPro2GO transfer is a false positive. The
      Wei et al. flag holds, for a mapping reason rather than a taxon reason.
    supported_by:
    - reference_id: file:mouse/Gprc5c/Gprc5c-bioinformatics/RESULTS.md
      supporting_text: 'Q9NQ84 human GPRC5C: IPR002956 match = no'
    - reference_id: file:mouse/Gprc5c/Gprc5c-bioinformatics/RESULTS.md
      supporting_text: residues 241-265 (score 32)
    - reference_id: PMID:39827240
      supporting_text: This includes beta-strands in dROS1's third Fibronectin type III (FNIII) domain and a C-terminal peptide in BOSS' ECR.
    - reference_id: PMID:21827690
      supporting_text: The invertebrate receptors have long N-termini, like other class C GPCRs and unlike GPRC5 receptors in Chordata
    - reference_id: PMID:18392882
      supporting_text: The extracellular region, however, is only detectably conserved within but not outside Diptera.
    - reference_id: PMID:32499443
      supporting_text: neural epidermal growth factor-like-like 2 (NELL2), specifically binds to an orphan receptor tyrosine kinase, c-ros oncogene 1 (ROS1)
