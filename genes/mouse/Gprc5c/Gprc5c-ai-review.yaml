  - PANTHER:PTN001025902
  - UniProtKB:Q9NZH0
  review:
    summary: >-
      IBA at the GPRC5 node seeded by human GPRC5B (Q9NZH0), which has an IDA for this
      term (GPRC5B activation of Fyn kinase).
    action: UNDECIDED
    reason: >-
      Gprc5c sits inside the clade, so the node placement is not obviously wrong, but no
      study tests direct kinase activation by GPRC5C. Reported downstream effects
      (increased ERK1/2 activity on overexpression, NF-kB activation in AML) are
      indirect signalling outputs, not evidence that GPRC5C binds and activates a
      kinase. GPRC5A and GPRC5D differ from GPRC5B in partner interactions, while
      GPRC5C resembles GPRC5B in its dimerization pattern, so inheritance is plausible
      but unverified.
    propagation_review:
