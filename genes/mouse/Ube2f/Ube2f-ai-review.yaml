id: Q9CY34
gene_symbol: Ube2f
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Ube2f is a 185-residue E2 enzyme of the ubiquitin-conjugating enzyme (UBC) fold that is specific for the ubiquitin-like
  protein NEDD8. It accepts NEDD8 from the NAE1-UBA3 E1 onto its catalytic cysteine (Cys116) as a thioester, with its N-terminal
  extension mediating E1 binding, and then, together with the RING protein RBX2 (RNF7/SAG), transfers NEDD8 to cullin-5. NEDD8
  modification activates cullin-RING ligase 5 (CRL5) complexes, which ubiquitylate substrates for proteasomal degradation.
  In mouse cells Ube2f is required for cullin-5 neddylation but not for neddylation of cullins 1-4, which depend on the paralogous
  NEDD8 E2 UBE2M with RBX1. Ube2f is a cytosolic enzyme expressed in many tissues. In a mouse model of KRAS-driven pancreatic
  cancer its deletion blocks CRL5-ASB11-dependent ubiquitylation of Diras2 and suppresses tumour progression.
