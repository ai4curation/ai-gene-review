    reason: 'This is the core catalytic activity: NAE1-UBA3-dependent charging of the catalytic cysteine with NEDD8 and transfer
      onward. The biochemistry used the human protein, but the mouse protein is 97% identical, keeps the catalytic Cys116,
      and is in the same PANTHER subfamily and PAINT clade, and the in-cell mouse experiments are consistent. Accepted, noting
      that the strictly mouse-experimental evidence is genetic (knockdown/rescue) rather than biochemical.'
