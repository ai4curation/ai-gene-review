  review:
    summary: EXP from Huang et al. 2009. The E1-dependent formation of a UBE2F~NEDD8 thioester in vitro and in cells was shown
      with human UBE2F (97% identical to mouse); the mouse knockdown/rescue experiments show that endogenous Ube2f is the
