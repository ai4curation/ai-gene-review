suggested_questions:
- question: Which CRL5 substrate adaptors (beyond Asb11) depend on Ube2f-mediated Cul5 neddylation in mouse tissues in vivo,
    and does UBE2M partially substitute for Ube2f when Ube2f is absent?
- question: Does N-terminal acetylation of mouse Ube2f, inferred from the human protein, control its DCUN1D-dependent NEDD8
    transfer to Cul5 in vivo?
suggested_experiments:
- description: In vitro E1 charging and 32P-NEDD8 transfer assays with recombinant mouse Ube2f (wild type and C116A) and mouse
    Rbx2-Cul5, to give species-specific biochemical evidence for the activity.
- description: Quantitative neddylation profiling of cullins 1-5 in tissues from Ube2f-knockout mice to test whether the Cul5
    specificity seen in NIH 3T3 cells holds in vivo.
