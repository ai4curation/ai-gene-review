- term:
    id: GO:0045087
    label: innate immune response
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - UniProtKB:Q969M7
  review:
    summary: ISO (innate immune response, acts upstream of or within) projected from human Q969M7. The current human UBE2F
      GOA set (QuickGO, 2026-10-20) no longer carries this term, so this is a stale projection.
    action: REMOVE
    reason: The only immune-related evidence for UBE2F is that HIV-1 Vif hijacks the UBE2F-RBX2-CUL5 neddylation cascade to
      degrade the host restriction factor APOBEC3G. That is a pro-viral role exploited by the virus; it is not host antiviral
      defense, and knockdown of UBE2F restores restriction. Nothing places mouse Ube2f in a host immune or antiviral process,
      and the human source annotation has been withdrawn.
    supported_by:
    - &id005
      reference_id: PMID:23300442
      supporting_text: conjugation of NEDD8 to Cullin-5 by the NEDD8-conjugating enzyme UBE2F is required for HIV Vif-mediated
        degradation of the host restriction factor APOBEC3G (A3G)
