core_functions:
- description: 'NEDD8-specific E2: accepts NEDD8 from the NAE1-UBA3 E1 on catalytic Cys116 and, paired with the RING protein
    RBX2, transfers it to cullin-5, activating CRL5 ubiquitin ligases. Cul5 neddylation in mouse cells depends on Ube2f, not
    UBE2M.'
