    summary: >-
      Protein-FAD linkage is the conserved role of the Sdh5/SDHAF2 family, shown
      experimentally for yeast and human orthologs, and the gene already carries this term
      on the canonical product Q8C6I2 (ISO/ISS, accepted in that review), so it would not be
