  label: Mus musculus
status: COMPLETE
description: >-
  ProtNLM2 (UniProt API snapshot 2026-09-10) emitted three GO terms for A0A494B8X4, a
  135-residue alternative product of mouse Sdhaf2 that is identical to the canonical Q8C6I2
  over residues 1-121 but replaces the C-terminal part of the Sdh5 domain with an unrelated
  14-residue tail. Mitochondrial matrix is correct and already annotated to this product
  (CNN), supported by the retained transit peptide and the conserved mitochondrial location
  of Sdh5/SDHAF2. Protein-FAD linkage is the established gene-level role of SDHAF2 and is
  carried by the canonical product, but whether this truncated product binds SDHA and
  supports flavinylation is untested (UNC). Succinate-to-ubiquinone electron transport is
  carried out by assembled complex II; Sdhaf2 is an assembly factor upstream of it, and the
  gene review marks the same term an over-annotation on the canonical product (NPI).
