    label: mitochondrial electron transport, succinate to ubiquinone
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: CURATION_MISTAKE
    summary: >-
      Electron transfer from succinate to ubiquinone is performed by assembled complex II
      (SDHA-SDHD). Sdhaf2 is an assembly factor that binds SDHA and promotes its covalent
      flavinylation before complex assembly; it does not transfer electrons and is not part
      of the mature complex. Loss of Sdh5 abolishes SDH-dependent respiration, which shows
      necessity, not participation. The canonical-product review marks every GOA row for
      this term (IBA, UniRule IEA, ISO) as an over-annotation on these grounds, so the
      prediction most likely reproduces that over-propagated annotation. The appropriate
      process terms for the gene are complex II assembly and protein-FAD linkage, and for
      this truncated, unassayed product even those are unconfirmed.
    supported_by:
    - reference_id: PMID:19628817
      supporting_text: Sdh5 is required for SDH-dependent respiration and for Sdh1 flavination
    - reference_id: PMID:38569044
      supporting_text: 'Restoration of Sdhaf2 normalized complex II

        activity, lipid oxidation, and insulin action in Drp1-KD myocytes.'
