- id: PMID:38569044
  title: Drp1 controls complex II assembly and skeletal muscle metabolism by Sdhaf2 action on mitochondria.
  findings:
  - statement: Mouse muscle and myocyte experiments connect mitochondrial Sdhaf2 availability to complex-II
      assembly and activity; they do not isolate the 135-residue alternative product.
    supporting_text: 'Restoration of Sdhaf2 normalized complex II

      activity, lipid oxidation, and insulin action in Drp1-KD myocytes.'
