id: A0A494B8X4
gene_symbol: Sdhaf2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: SDHAF2 is a mitochondrial assembly factor that promotes covalent FAD attachment to the SDHA
  subunit of respiratory complex II. The selected 135-residue mouse product A0A494B8X4 retains the reference
  mitochondrial targeting sequence but has an altered C-terminal region relative to the 164-residue product.
  Mitochondrial import is plausible, while preservation of the complete SDHA-maturation mechanism in this
  product is unresolved.
existing_annotations:
