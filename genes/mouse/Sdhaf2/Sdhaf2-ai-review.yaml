id: A0A494B8X4
gene_symbol: Sdhaf2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Sdhaf2 (succinate dehydrogenase complex assembly factor 2; SDH5/Sdh5/SdhE family,
  PANTHER PTHR12469:SF2) is a nuclear-encoded mitochondrial matrix protein that binds the
  flavoprotein subunit SDHA of respiratory complex II and, acting as a dedicated
  chaperone-like assembly factor rather than an enzyme, promotes covalent attachment of FAD
  to SDHA and thereby assembly of active succinate dehydrogenase. The canonical mouse
  product is Q8C6I2 (164 aa). A0A494B8X4 is a 135-residue alternative product of the same
  gene (Ensembl ENSMUSP00000157391) that is identical to the canonical protein over
  residues 1-121, including the mitochondrial transit peptide, the N-terminal helical bundle
  and the glycine equivalent to human Gly78 that is needed for SDHA binding, but replaces
  canonical residues 122-164 with an unrelated 14-residue tail. It therefore lacks the
  C-terminal part of the Sdh5 domain (Pfam PF03937 66-141 in the canonical product,
  66-124 here), including the helix corresponding to human residues 135-145 and the
  C-terminal helical segment. It is expected to be imported into mitochondria; whether it
  folds, binds SDHA or supports flavinylation has not been tested.
