core_functions:
- description: >-
    Gene-level function of Sdhaf2, inherited from the PTHR12469 eukaryotic node
    PTN000279729: a mitochondrial matrix assembly factor that binds SDHA and licenses
    covalent FAD attachment for complex II assembly. For the A0A494B8X4 alternative product
    only mitochondrial (matrix) targeting is confidently retained; the molecular activity is
    not asserted here because the product lacks the C-terminal part of the Sdh5 domain and
    has not been assayed.
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:19628817
    supporting_text: Sdh5 is required for SDH-dependent respiration and for Sdh1 flavination
  - reference_id: PMID:32887801
    supporting_text: works in synergy with SDHAF2 to properly orient the flavin and
  - reference_id: file:mouse/Sdhaf2/Sdhaf2-bioinformatics/RESULTS-rereview.md
    supporting_text: The product keeps the targeting peptide, the N-terminal helical bundle and the RGxxE
  knowledge_gaps:
  - gap_statement: >-
      Whether the 135-residue A0A494B8X4 product is translated in vivo, folds without the
      C-terminal helices of the Sdh5 domain, and binds SDHA or supports its flavinylation is
      unknown.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Does the 135-residue mouse product bind SDHA and promote covalent FAD attachment after mitochondrial
    import?
- question: >-
    Is the GSK-3-beta/beta-catenin effect of SDH5 loss (PMID:23983127) a direct activity of
    SDHAF2 or a secondary consequence of complex II deficiency (e.g. succinate accumulation)?
suggested_experiments:
- description: >-
    Express A0A494B8X4 and the canonical Q8C6I2 in Sdhaf2-null mouse cells and compare
    mitochondrial import, co-immunoprecipitation with SDHA, covalent flavin content of SDHA
    (in-gel flavin fluorescence) and complex II activity.
