- term:
    id: GO:0010719
    label: negative regulation of epithelial to mesenchymal transition
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00085215
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: >-
      ARBA association rule echoing a single lung-cancer study (PMID:23983127) in which loss
      of SDH5 was followed by EMT marker changes in cell lines, tumour specimens and SDH5
      knockout mouse lung epithelium. That is a downstream cellular phenotype of losing a
      mitochondrial complex II assembly factor, not evidence that the protein performs a step
      in regulating EMT. PAINT curators placed mitochondrial, complex II assembly, TCA-cycle
      and succinate-to-ubiquinone electron-transport terms on the eukaryotic node
      PTN000279729 and did not propagate EMT or Wnt regulation, which is read as a deliberate
      decision. For this alternative product, which lacks the C-terminal part of the Sdh5
      domain and was never assayed, the involved_in claim is an over-annotation.
    reason: >-
      Knockout/knockdown phenotype (necessity) does not establish participation; electronic
      ARBA transfer to a truncated alternative product with no phylogenetic support for the
      term. The experimentally based gene-level association, if any, belongs on the canonical
      product with an acts_upstream_of_or_within qualifier.
    supported_by:
    - reference_id: PMID:23983127
      supporting_text: In SDH5 knock-out mice, lung epithelial cells exhibited elevated mesenchymal
        markers, which is characteristic of EMT.
    - reference_id: file:mouse/Sdhaf2/Sdhaf2-bioinformatics/RESULTS-rereview.md
      supporting_text: '| Helix 135-145 | | No: aligned positions are the unrelated tail (2/11 identical) |'
- term:
    id: GO:0090090
    label: negative regulation of canonical Wnt signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027950
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: >-
      ARBA association rule derived from the same lung-cancer study (PMID:23983127), which
      reported that SDH5 modulates GSK-3-beta/beta-catenin signalling in human lung-cancer
      cells. The claim rests on one cell-context study and has not been placed by PAINT on any
      PTHR12469 node, whereas the conserved, structurally characterised role of the family is
      SDHA flavinylation inside mitochondria. A cytosolic Wnt-regulatory activity for a
      matrix-targeted assembly factor is not established, and nothing is known about it for
      the C-terminally altered A0A494B8X4 product. Over-annotation for this product.
    reason: >-
      Single context-dependent study, no phylogenetic support (absent from PAINT IBD set),
      and the target is an unassayed alternative product lacking part of the Sdh5 domain.
    supported_by:
    - reference_id: PMID:23983127
      supporting_text: SDH5 functions as a negative regulator of Wnt-β-catenin signaling.
