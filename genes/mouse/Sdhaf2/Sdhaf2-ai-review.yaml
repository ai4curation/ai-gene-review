  review:
    action: ACCEPT
    summary: >-
      Matrix localization is well grounded for the gene product. The eukaryotic PAINT node
      PTN000279729 of PTHR12469, which contains this mouse product through subfamily SF2,
      carries an IBD for mitochondrion (GO:0005739) seeded by yeast Sdh5, human SDHAF2 and
      Arabidopsis SDHAF2. SDHAF2 acts on SDHA, a matrix-facing protein, and A0A494B8X4
      keeps the complete 27-residue mouse transit peptide, identical to the canonical Q8C6I2.
      The UniProt SubCell line behind this row is itself an ARBA prediction, so it is not
      quoted here. Mitochondrial matrix is as precise as the evidence allows and is the most
      confidently transferable property of this alternative product.
    reason: >-
      Accepted on the basis of the retained targeting peptide (re-review structural mapping)
      and the PAINT eukaryotic-node placement; no product-specific localization assay
      exists.
