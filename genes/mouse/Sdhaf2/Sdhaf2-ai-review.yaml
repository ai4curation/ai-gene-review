- id: PMID:23983127
  title: Succinate dehydrogenase 5 (SDH5) regulates glycogen synthase kinase 3β-β-catenin-mediated lung
    cancer metastasis.
  findings:
  - statement: The study directly reports a mouse Sdhaf2/SDH5 loss phenotype in lung epithelial cells,
      so the EMT association is not supported solely by an ARBA assertion.
    supporting_text: In SDH5 knock-out mice, lung epithelial cells exhibited elevated mesenchymal markers,
      which is characteristic of EMT.
  - statement: Human lung-cell experiments link SDH5 to GSK3-beta/beta-catenin regulation in a context-dependent
      mechanism, rather than establishing a universal Wnt effect of all products.
    supporting_text: SDH5 functions as a negative regulator of Wnt-β-catenin signaling.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary report checked against the cached abstract/full text; the evidence scope is
      stated in the finding.
