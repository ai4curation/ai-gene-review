      reference_id: file:mouse/Sdhaf2/Sdhaf2-bioinformatics/RESULTS.md
      supporting_text: '| Transit peptide: Mitochondrion | 1–27 | 27 / 27 | 27 |'
- term:
    id: GO:0010719
    label: negative regulation of epithelial to mesenchymal transition
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00085215
  review:
    action: UNDECIDED
    summary: The mouse Sdhaf2 knockout phenotype directly supports negative regulation of EMT at the gene
      level. The selected product has an altered C-terminal region, and the study does not resolve whether
      it preserves the relevant activity. The electronic annotation is not dismissed as ARBA-derived,
      but it cannot be assigned as a core function of this product.
    supported_by:
    - reference_id: PMID:23983127
      supporting_text: In SDH5 knock-out mice, lung epithelial cells exhibited elevated mesenchymal markers,
        which is characteristic of EMT.
    - *id001
- term:
    id: GO:0090090
    label: negative regulation of canonical Wnt signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027950
  review:
    action: UNDECIDED
    summary: The SDH5-GSK3-beta/beta-catenin study supplies genuine primary evidence for negative Wnt
      regulation in the tested lung-cell context. This does not determine whether the alternative 135-residue
      mouse product retains the interaction and activity, so the precise product-level transfer remains
      uncertain.
    supported_by:
    - reference_id: PMID:23983127
      supporting_text: SDH5 functions as a negative regulator of Wnt-β-catenin signaling.
    - *id001
