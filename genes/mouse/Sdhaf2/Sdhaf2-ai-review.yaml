suggested_questions:
- question: Is the ENSMUST00000237827 transcript (A0A494B8X4, novel 14-residue C-terminal tail) expressed
    as a stable protein, and does it bind SDHA and support SDHA flavinylation after mitochondrial import?
- question: Should the PTHR12469 eukaryotic-node IBA terms (complex II assembly, mitochondrion) be propagated
    to non-canonical, C-terminally truncated gene models, or only to the canonical product?
suggested_experiments:
- description: Express A0A494B8X4 and canonical Q8C6I2 in Sdhaf2-null cells and compare SDHA covalent
    flavinylation (anti-FAD fluorescence of SDHA), SDHA co-immunoprecipitation and BN-PAGE complex II
    assembly.
