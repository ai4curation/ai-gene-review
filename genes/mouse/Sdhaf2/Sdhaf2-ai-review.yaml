    supporting_text: Selected A0A494B8X4 has 135 residues; reference Q8C6I2 has 164 residues.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible comparison from UniProt and InterPro REST data (compare_products.py).
core_functions:
- description: >-
    Sdhaf2 gene function, transferred within PANTHER subfamily PTHR12469:SF2 from the human
    ortholog SDHAF2 and from mouse Sdhaf2 studies. Sdhaf2 is a mitochondrial matrix chaperone and
    assembly factor that binds SDHA and enables covalent attachment of FAD to SDHA, which is needed
    to assemble complex II. A0A494B8X4 keeps the targeting peptide and the RGxxE motif but lacks the
    canonical C-terminal 43 residues, including the end of the Sdh5 domain. Whether this alternative
    product performs the function has not been tested.
