id: A0A494B8X4
gene_symbol: Sdhaf2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Sdhaf2 (succinate dehydrogenase complex assembly factor 2; SDH5 in yeast, SdhE in bacteria)
  encodes a mitochondrial matrix assembly factor for succinate dehydrogenase (respiratory
  complex II). The full-length protein binds the flavoprotein subunit SDHA and, together with a
  dicarboxylate, orients the SDHA flavin and capping domains so that FAD becomes covalently
  attached, a step required to assemble an active complex II. It is not a subunit of the mature
  enzyme and has no catalytic activity of its own. In mouse skeletal muscle, the amount of Sdhaf2
  imported into mitochondria, promoted by Drp1, limits complex II assembly and succinate-driven
  respiration. A0A494B8X4 is an Ensembl-predicted 135-residue alternative product of the gene. Its
  first 121 residues are identical to the 164-residue canonical protein (Q8C6I2), including the
  mitochondrial transit peptide and the conserved RGxxE motif. It then ends in a novel 14-residue
  tail, so it lacks canonical residues 122-164, which include the C-terminal 20 residues of the Sdh5
  domain.
existing_annotations:
- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0170
  review:
    summary: >-
      Mitochondrial matrix is the established compartment of SDHAF2-family proteins, where SDHA
      flavinylation takes place. A0A494B8X4 keeps the whole N-terminal transit peptide (residues
      1-27) of the canonical mouse protein, identical in sequence.
    action: ACCEPT
    reason: >-
      The localisation is a family-level property, grounded phylogenetically: PAINT placed
      GO:0005739 mitochondrion at the eukaryotic root node PTN000279729 of PTHR12469 (seeds
      yeast Sdh5, Arabidopsis SDHAF2 and human SDHAF2), and A0A494B8X4 is in subfamily
      PTHR12469:SF2 with the human and canonical mouse orthologs. Mouse Sdhaf2 is imported into
      muscle mitochondria (PMID:38569044). The truncation affects the C-terminus only, so the
      targeting signal is intact and matrix import is expected. No assay has been done on this
      product itself, so the term holds as a location inference. It does not say whether the
      product is active.
    supported_by:
    - reference_id: PMID:38569044
      supporting_text: Although both mouse and human Sdhaf2 proteins have a mitochondrial localization
        signal, we hypothesized that Drp1 interacts with Sdhaf2 and enhances its mitochondrial translocation
    - reference_id: file:mouse/Sdhaf2/Sdhaf2-bioinformatics/RESULTS.md
      supporting_text: Identical prefix with Q8C6I2 | residues 1-121 of both sequences
- term:
    id: GO:0010719
    label: negative regulation of epithelial to mesenchymal transition
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00085215
  review:
    summary: >-
      ARBA machine-learning transfer of a cancer-context phenotype. In one study, loss of SDH5
      caused EMT marker changes in lung-cancer cells, and SDH5-knockout mice showed elevated
      mesenchymal markers in lung epithelium. EMT is a downstream cellular outcome of losing a
      mitochondrial assembly factor. It is not a process that the Sdhaf2 product carries out.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The evidence is necessity evidence: knockdown or knockout changes the EMT state. It does
      not show that Sdhaf2 does any of the work of regulating EMT. The proposed mechanism goes
      through GSK-3beta/beta-catenin, and was shown in human lung-cancer lines. PAINT curators
      placed only mitochondrion, TCA cycle, electron transport and complex II assembly at the
      PTHR12469 eukaryotic node, and propagated no EMT or Wnt terms. Being an ARBA association
      rule, the annotation adds no phylogenetic or product-specific support. It is also applied to
      a C-terminally truncated product whose activity has not been tested. The human ortholog keeps
      the experimental row as non-core (genes/human/SDHAF2). For this alternative product,
      an involved_in participation claim from an electronic rule is an over-annotation.
    supported_by:
    - reference_id: PMID:23983127
      supporting_text: In SDH5 knock-out mice, lung epithelial cells exhibited elevated mesenchymal
        markers, which is characteristic of EMT.
- term:
    id: GO:0090090
    label: negative regulation of canonical Wnt signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027950
  review:
    summary: >-
      ARBA transfer of a single-study finding: in human lung-cancer cells, SDH5 binds GSK-3beta,
      promotes its activation and so lowers beta-catenin signalling. This is a context-specific,
      unreplicated moonlighting role, separate from the conserved SDHA-maturation function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Unlike the EMT phenotype, this is a proposed mechanistic role (direct SDH5-GSK-3beta
      interaction), so the term is not plainly downstream. It is kept, but as non-core, which is
      how the human ortholog review treats the same claim. It was not propagated by PAINT, and
      it rests on one cancer-cell study. Whether a mitochondrial matrix protein meets cytosolic
      GSK-3beta in normal cells, and whether this truncated product does so at all, is unknown.
    supported_by:
    - reference_id: PMID:23983127
      supporting_text: SDH5 functions as a negative regulator of Wnt-β-catenin signaling.
