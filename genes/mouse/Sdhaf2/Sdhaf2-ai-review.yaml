- id: PMID:19628817
  title: SDH5, a gene required for flavination of succinate dehydrogenase, is mutated in paraganglioma.
  findings:
  - statement: Yeast Sdh5 and human SDH5 bind the SDH catalytic subunit and are required for its
      flavination; this defines the family's conserved function.
    supporting_text: Sdh5 is required for SDH-dependent respiration and for Sdh1 flavination (incorporation
      of the flavin adenine dinucleotide cofactor)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding characterisation of the Sdh5/SDHAF2 family (yeast and human). Abstract-only
      in the cache. Does not assay mouse proteins.
- id: PMID:32887801
  title: The roles of SDHAF2 and dicarboxylate in covalent flavinylation of SDHA, the human complex II
    flavoprotein.
  findings:
  - statement: Crystal structure and reconstitution of human SDHA-SDHAF2 show that SDHAF2 and a dicarboxylate
      orient SDHA flavin and capping domains to enable covalent flavinylation.
    supporting_text: works in synergy with SDHAF2 to properly orient the flavin and capping domains of
      SDHA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mechanistic and structural basis of the ortholog activity, from the human protein
      (same PANTHER subfamily SF2). Abstract-only in the cache.
- id: PMID:38569044
  title: Drp1 controls complex II assembly and skeletal muscle metabolism by Sdhaf2 action on mitochondria.
  findings:
  - statement: Mouse Sdhaf2 carries a mitochondrial localisation signal; its Drp1-promoted mitochondrial
      import limits complex II assembly in muscle, and Sdhaf2 restoration rescues complex II activity
      in Drp1-knockdown myocytes.
    supporting_text: 'Restoration of Sdhaf2 normalized complex II

      activity, lipid oxidation, and insulin action in Drp1-KD myocytes.'
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Main mouse functional study. The constructs and antibodies concern the canonical
      gene product; the 135-residue A0A494B8X4 product is not studied separately.
- id: PMID:23983127
  title: Succinate dehydrogenase 5 (SDH5) regulates glycogen synthase kinase 3β-β-catenin-mediated lung
    cancer metastasis.
  findings:
  - statement: SDH5 loss promotes EMT in lung-cancer cells and SDH5-knockout mouse lung; SDH5 is proposed
      to restrain Wnt/beta-catenin signalling via GSK-3beta.
    supporting_text: SDH5 functions as a negative regulator of Wnt-β-catenin signaling.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The only source for the EMT and Wnt claims. It is a single cancer-context study
      that has not been independently replicated, and the mechanism was worked out mainly in human
      lung-cancer cell lines.
- id: file:mouse/Sdhaf2/Sdhaf2-bioinformatics/RESULTS.md
  title: A0A494B8X4 product versus canonical mouse and human SDHAF2
  findings:
  - statement: A0A494B8X4 is identical to canonical Q8C6I2 over residues 1-121 (transit peptide and
