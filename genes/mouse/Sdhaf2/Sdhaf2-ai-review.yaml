    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0170
  review:
    action: ACCEPT
    summary: Mitochondrial-matrix localization is consistent with the experimentally grounded Sdhaf2 mechanism
      and retention of the entire reference targeting peptide. This is a reasonable sequence-supported
      inference for the shorter product, not a localization assay of A0A494B8X4.
    supported_by:
    - reference_id: PMID:38569044
      supporting_text: 'Restoration of Sdhaf2 normalized complex II

        activity, lipid oxidation, and insulin action in Drp1-KD myocytes.'
