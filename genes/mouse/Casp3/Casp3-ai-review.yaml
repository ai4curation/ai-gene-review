id: P70677
gene_symbol: Casp3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mouse Casp3 encodes caspase-3, a cysteine-aspartate effector protease that is activated
  by initiator caspases and executes apoptosis by cleaving many cellular substrates, including PARP1
  and other proteins that drive apoptotic morphology and DNA fragmentation. Its core biology is
  cytoplasmic/cytosolic proteolysis during the execution phase of apoptosis, with additional
  context-specific roles in neuronal remodeling, inflammation, and development. Neural abnormalities
  and survival after Casp3 deletion depend strongly on genetic background. Mouse Casp7 can
  compensate for ICAD cleavage in some contexts, so loss of Casp3 does not establish a universal
  block of apoptosis or DNA fragmentation.
