suggested_questions:
- question: Which mouse Casp3 inflammatory and pyroptotic annotations reflect direct Casp3 substrate cleavage
    versus downstream consequences of apoptosis or gasdermin-E activation?
- question: Which non-lethal neuronal remodeling functions of Casp3 are sufficiently direct and conserved to
    retain as non-core GO annotations?
suggested_experiments:
- description: Use catalytically inactive Casp3 rescue alleles in apoptotic and non-apoptotic mouse cells to
    separate direct protease-dependent functions from downstream phenotypes.
- description: Perform substrate-trapping proteomics for active Casp3 in apoptotic cells, neurons, and
    inflammatory epithelial cells to identify context-specific direct substrates.
