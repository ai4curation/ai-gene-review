core_functions:
- description: Casp3 is the canonical apoptotic effector cysteine protease. After activation by initiator
    caspases, it cleaves many substrates to execute apoptosis and promote apoptotic DNA fragmentation.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0097194
    label: execution phase of apoptosis
  - id: GO:1902512
    label: positive regulation of apoptotic DNA fragmentation
  - id: GO:0006508
    label: proteolysis
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:16469926
  - reference_id: PMID:15525783
- description: The active Casp3 enzyme functions as a caspase complex formed from p17 and p12 subunits;
    this mature complex carries out the proteolytic execution program.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0097194
    label: execution phase of apoptosis
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0008303
    label: caspase complex
  supported_by:
  - reference_id: file:mouse/Casp3/Casp3-uniprot.txt
    record_section:
    - CC:SUBUNIT
    supporting_text: Heterotetramer that consists of two anti-parallel arranged heterodimers, each one
      formed by a 17 kDa (p17) and a 12 kDa (p12) subunit.
- description: Casp3 restrains cytokine production through proteolytic suppression of innate signaling.
    Native mouse macrophage siRNA and Casp3-deficient mice corroborate the function; direct purified NF-kappaB
    substrate cleavage was assayed with human CASP3. Additional murine Casp7 participation in cGAS inactivation
    prevents a claim of identical paralog dependence across species.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0001818
    label: negative regulation of cytokine production
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:36002459
    supporting_text: the deficiency of caspase-3 significantly increased the levels of IFNβ, IL-6, and
      TNFα in sera
  - reference_id: PMID:30878284
- description: Casp3 can proteolytically activate GSDME to promote an inflammatory response in permissive
    cells. This conserved substrate-activation mechanism is conditional on GSDME availability and cellular
    context; chemotherapy protection in Gsdme-null mice and human-GSDME rescue of mouse iBMMs are distinct
    evidence, not identical native mouse assays.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0140639
    label: positive regulation of pyroptotic inflammatory response
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:28459430
    supporting_text: 'GSDME was specifically cleaved by caspase-3 in its linker,

      generating a GSDME-N fragment that perforates membranes and thereby induces

      pyroptosis.'
  - reference_id: PMID:33852854
proposed_new_terms: []
suggested_questions:
- question: Which mouse Casp3 inflammatory and pyroptotic annotations reflect direct Casp3 substrate
    cleavage versus downstream consequences of apoptosis or gasdermin-E activation?
- question: Which non-lethal neuronal remodeling functions of Casp3 are sufficiently direct and
    conserved to retain as non-core GO annotations?
suggested_experiments:
- description: Use catalytically inactive Casp3 rescue alleles in apoptotic and non-apoptotic mouse
    cells to separate direct protease-dependent functions from downstream phenotypes.
- description: Perform substrate-trapping proteomics for active Casp3 in apoptotic cells, neurons,
    and inflammatory epithelial cells to identify context-specific direct substrates.
