- term:
    id: GO:0031264
    label: death-inducing signaling complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: DISC membership traces to an experimental annotation on the rat ortholog, so it is retained as a
      context-specific, non-core localization.
    action: KEEP_AS_NON_CORE
    reason: 'The sole IBD seed at PANTHER node PTN002573018 is RGD:2275, the rat caspase-3 record (P55213, corroborated
      through its UniProt cross-reference), which carries its own IDA to this term from PMID:17518537. That cached
      publication states that after spinal cord injury Fas associates with FADD, caspase-8, cFLIP-long and caspase-3
      to form a DISC, so the source is an experimental annotation on the direct ortholog rather than a paralog or
      family overreach, and there is no mouse evidence of loss. Removing it would overrule a curated experimental
      annotation on the orthologous gene on textbook grounds alone. Retained as non-core: the association is injury-
      and context-specific and is not part of the core effector-protease function. Independent source audit: Rat
      SCI complex association supplies comparative support, not direct binary Fas binding.'
    supported_by:
    - reference_id: PMID:17518537
      supporting_text: caspase-3, forming a death-inducing signaling
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: RGD:2275
        source_label: rat Casp3
        source_status: SUPPORTS_TRANSFER
        comment: Sole IBD seed for this term at the node; corroborated through the UniProt cross-reference for
          this RGD id (P55213, rat caspase-3). Its own GOA carries an IDA to GO:0031264 from PMID:17518537,
          whose abstract places caspase-3 in the Fas/FADD/caspase-8 DISC after spinal cord injury. A single
          well-characterised ortholog seed is not weak support.
      - source_id: PANTHER:PTN002573018
        source_status: SUPPORTS_TRANSFER
        comment: Euteleostomi-level node in PTHR10454 (taxon:117571 in the local PAINT cache); mouse Casp3 is
          an orthologous descendant, so the node placement supports the transfer. The term is contextual
          rather than core, which is a matter for the action, not for the propagation.
