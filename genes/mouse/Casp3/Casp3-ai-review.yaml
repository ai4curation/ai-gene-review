    reason: 'The original PMID:11092819 abstract concerns drug/gamma-irradiation injury in neural precursors
      and shows that death does not require Casp3; it does not demonstrate absence of Casp3 activation/participation
      or settle every tissue. Its full text remains unavailable. Full PMID:16469926 directly tests UV-irradiated
      mouse Casp3/Casp7-deficient MEFs: Casp3 loss impairs nuclear morphology and DNA fragmentation, with
      overlapping survival roles for Casp7. Independent native-mouse PMID:22949508 additionally demonstrates
      a protective Casp3/RasGAP response to UV-B skin injury. These direct target-species data support
      the existing response claim without asserting universal Casp3 necessity, direct UV sensing, or DNA-repair
      enzyme activity.'
