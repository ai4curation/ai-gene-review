  findings:
  - statement: Casp3-null neural abnormalities and survival depend strongly on mouse genetic background.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary mouse study; abstract cached. 129X1/SvJ and C57BL/6J backgrounds differ
      substantially after backcrossing.
- id: PMID:18723680
  title: Executioner caspase-3 and caspase-7 are functionally distinct proteases.
  findings:
  - statement: Human CASP3 and CASP7 have overlapping but different natural-substrate cleavage profiles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative human biochemical substrate study; distinguishes CASP3 and CASP7 rather than
      equating DEVD-peptide activity with identical protein specificity.
