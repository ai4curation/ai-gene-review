- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IDA
  original_reference_id: PMID:21716255
  review:
    summary: Retain the established pro-apoptotic role while distinguishing the original renal marker
      assay.
    action: ACCEPT
    reason: Casp3 performs apoptotic substrate cleavage and can amplify the death pathway. Full native
      mouse PMID:16469926 demonstrates Casp3-dependent PARP cleavage and nuclear fragmentation, with combined
      Casp3/Casp7 loss delaying Bax translocation and cytochrome-c release. The latter is a feedback contribution,
      not a claim that Casp3 alone is obligatory for every mitochondrial event. Retain positive apoptotic
      regulation as core rather than calling the direct effector/amplifier role peripheral. GO:0097194
      execution phase is not an is_a/part_of descendant of GO:0043065 positive regulation, so replacing
      this claim solely as an entailed ancestor would conflate execution with regulation. The original
      PMID:21716255 abstract reports increased cleaved Casp3 in COX-2-deficient mouse renal papillae and
      Bad knockdown in canine MDCK cells; Casp3 cleavage is an apoptosis readout, not a Casp3 knockout/rescue
      experiment. Normal force retrieval remained abstract-only and publisher full-text/PDF retrieval
      returned 403. The core claim is independently supported by 16469926, not by inventing a direct causal
      Casp3 perturbation in 21716255. Full PMID:18723680 independently compares recombinant human and
      murine enzymes and resolves CASP3-driven propagation of the caspase activation cascade, strengthening
      the amplification interpretation beyond a family annotation.
    supported_by:
    - reference_id: PMID:21716255
      supporting_text: 'The abundance of cleaved caspase-3,

        a marker of apoptosis, was significantly higher in papillary homogenates'
    - reference_id: PMID:16469926
      supporting_text: This suggests a pathway from caspase 9 through caspases 3 and 7 that promotes cytochrome
        c release at early time points.
    - reference_id: PMID:18723680
      supporting_text: These data suggest that caspase-3 is a more efficient enzyme than caspase-7 in
        terms of its ability to propagate the caspase activation cascade.
  qualifier: involved_in
