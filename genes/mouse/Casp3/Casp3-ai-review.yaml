  title: UniProt record for mouse Casp3
  findings:
  - statement: Casp3 is the major effector caspase in the execution phase of apoptosis.
    record_section: ["CC:FUNCTION"]
    supporting_text: Thiol protease that acts as a major effector caspase involved in the execution
      phase of apoptosis...mediates execution of apoptosis by catalyzing cleavage of many proteins
  - statement: The active Casp3 enzyme is a heterotetramer with p17 and p12 subunits.
    record_section: ["CC:SUBUNIT"]
    supporting_text: Heterotetramer that consists of two anti-parallel arranged heterodimers, each
      one formed by a 17 kDa (p17) and a 12 kDa (p12) subunit.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated catalytic, domain/family and localization statements used as
      corroboration; electronic GO lines and protein names are not used as functional evidence.
- id: file:mouse/Casp3/Casp3-deep-research-codex.md
  title: Manual deep research synthesis for mouse Casp3
  findings:
  - statement: The strongest curated picture is that Casp3 is a canonical apoptotic effector
      protease, while many orthology-transferred inflammatory and stimulus-specific terms are
      non-core or overextended.
- id: file:mouse/Casp3/Casp3-deep-research-falcon.md
  title: Falcon deep research report on mouse Casp3
  findings:
  - statement: Falcon synthesis identifies mouse Casp3 as a cysteine-aspartate executioner protease
      in apoptotic proteolysis, with context-specific pyroptotic and non-apoptotic outputs.
