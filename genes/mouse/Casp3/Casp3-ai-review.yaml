    review_notes: Curated catalytic, domain/family and localization statements used as corroboration;
      electronic GO lines and protein names are not used as functional evidence.
- id: file:mouse/Casp3/Casp3-deep-research-codex.md
  title: Manual deep research synthesis for mouse Casp3
  findings:
  - statement: The strongest curated picture is that Casp3 is a canonical apoptotic effector protease, while
      many orthology-transferred inflammatory and stimulus-specific terms are non-core or overextended.
- id: file:mouse/Casp3/Casp3-deep-research-falcon.md
  title: Falcon deep research report on mouse Casp3
  findings:
  - statement: Falcon synthesis identifies mouse Casp3 as a cysteine-aspartate executioner protease in
      apoptotic proteolysis, with context-specific pyroptotic and non-apoptotic outputs.
- id: PMID:15525783
  title: Caspase-7 expanded function and intrinsic expression level underlies strain-specific brain phenotype
    of caspase-3-null mice.
  findings:
  - statement: Mouse CASP7 cleaves ICAD comparably to mouse CASP3 in the reported assays; Casp7
      expression/activation differs across resistant and susceptible Casp3-null backgrounds.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary comparative mouse study; abstract cached. Distinguishes mouse and human ICAD
      cleavage and examines strain-dependent compensation, not universal paralog redundancy.
