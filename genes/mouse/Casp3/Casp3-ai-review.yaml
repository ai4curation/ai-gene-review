- term:
    id: GO:0043066
    label: negative regulation of apoptotic process
  evidence_type: ISO
  original_reference_id: GO_REF:0000008
  review:
    summary: Casp3 can limit apoptosis through RasGAP-dependent survival feedback under mild stress.
    action: KEEP_AS_NON_CORE
    reason: The historical human-donor exact-term assertion is not currently recovered, but native
      mouse primary PMID:22949508 independently resolves the biological claim. Casp3-knockout mice
      fail to activate protective Akt signaling under several stresses, and a cleavage-resistant
      RasGAP knock-in phenocopies the defect with increased tissue apoptosis. Casp3 performs the
      proteolytic step generating the protective response; this is participation, not mere
      necessity. Retain a context-dependent anti-apoptotic role as non-core, alongside its principal
      executioner function, without claiming that high caspase-3 activity universally protects
      cells.
    supported_by:
    - *id008
    - reference_id: PMID:22949508
      supporting_text: Defective Akt activation in caspase-3-knockout mice was accompanied by
        increased cell death and impaired survival in some cases.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes: []
      source_entities:
      - source_id: UniProtKB:P42574
        source_status: SOURCE_STALE_OR_MISSING
        comment: The historic human transfer source is not reproduced by the current exact-term
          query. Native mouse Casp3 knockout and RasGAP cleavage-resistant knock-in experiments in
          PMID:22949508 independently support the accepted non-core protective function.
