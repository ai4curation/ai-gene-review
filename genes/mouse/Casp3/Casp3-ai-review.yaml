  - statement: The active Casp3 enzyme is a heterotetramer with p17 and p12 subunits.
    record_section: ["CC:SUBUNIT"]
    supporting_text: Heterotetramer that consists of two anti-parallel arranged heterodimers, each one formed
      by a 17 kDa (p17) and a 12 kDa (p12) subunit.
