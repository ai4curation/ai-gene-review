    action: KEEP_AS_NON_CORE
    reason: 'The sole IBD seed at PANTHER node PTN002573018 is RGD:2275, the rat caspase-3 record (P55213,
      corroborated through its UniProt cross-reference), which carries its own IDA to this term from PMID:17518537.
