    label: negative regulation of cytokine production
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: Casp3 directly suppresses cytokine signaling, supported by native mouse perturbations.
    action: ACCEPT
    reason: Full PMID:36002459 shows increased poly(I:C)-induced cytokine expression after Casp3 siRNA
      in primary mouse peritoneal macrophages and increased serum IFNbeta, IL-6 and TNFalpha in Casp3-deficient
      mice. Purified human CASP3 cleavage of NF-kappaB subunits and cleavage-resistant mutants establish
      the biochemical mechanism in the same paper; these are not mislabeled as purified mouse-protein
      assays. PMID:30878284 independently supports antiviral suppression and explicitly distinguishes
      human CASP3 from additional murine Casp7 participation in cGAS inactivation. Retain this direct
      immunoregulatory protease role as core, not as an unexplained peripheral phenotype or a universal
      anti-inflammatory effect.
