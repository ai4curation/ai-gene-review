id: Q3UU41
gene_symbol: Scimp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Scimp (SLP adaptor and CSK-interacting membrane protein), the mouse ortholog of human SCIMP,
  is a small palmitoylated, single-pass transmembrane adaptor protein (TRAP family) expressed in antigen-presenting
  cells (B cells, dendritic cells, macrophages). It resides in tetraspanin-enriched microdomains of the
  plasma membrane, accumulates at the antigen-presenting-cell side of the immunological synapse and in
  macrophage ruffles and filopodia. Its proline-rich region constitutively binds the SH3 domain of LYN,
  and LYN/SYK-phosphorylated tyrosines recruit SH2-containing effectors (GRB2, SLP65/BLNK-SLP76, CSK,
  SYK). SCIMP acts as a non-TIR adaptor for Toll-like receptors: it binds the TLR4 TIR domain after LPS
  stimulation, scaffolds LYN, SYK and ERK1/2 to the receptor, is required for TLR4 tyrosine phosphorylation
  and selectively drives IL-6 and IL-12p40 production in macrophages. It also contributes to MHC-II reverse
  signalling (ERK activation) in B cell lines and to sustained Dectin-1 signalling in dendritic cells.'
