  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000948237
  - UniProtKB:Q6UWF3
  review:
    summary: SCIMP was discovered as a palmitoylated transmembrane adaptor that localizes to the antigen-presenting-cell
      side of the immunological synapse via tetraspanin-enriched microdomains (PMID:21930792).
    action: ACCEPT
    reason: Direct observation in human APC/B cell lines (PMID:21930792) and restated in the mouse Dectin-1
      study. The IBA places this at the SCIMP clade (PTN000948237) seeded by the human IDA; consistent
      with the experimental record. Mouse rows are by transfer from human; mouse primary data on the synapse
      are lacking, but the transfer is reasonable for a conserved, immune-restricted ortholog.
    supported_by:
    - &id003
      reference_id: PMID:21930792
      supporting_text: SCIMP is expressed in B cells and other professional APCs and is localized in the
        immunological synapse due to its association with tetraspanin-enriched microdomains.
    - &id004
      reference_id: PMID:27288407
      supporting_text: Specifically, it showed that SCIMP accumulates at the APC side of the immunological
        synapse and that shRNA-mediated SCIMP down-regulation results in a defect in ERK signaling downstream
        of MHCIIgp in the K46 murine B cell line.
