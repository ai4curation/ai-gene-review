core_functions:
- description: 'Non-TIR transmembrane signaling adaptor for Toll-like receptors: binds the TLR4 TIR domain
    on LPS stimulation and scaffolds LYN, SYK and ERK1/2 to the receptor at plasma membrane ruffles, enabling
    TLR4 tyrosine phosphorylation and selective IL-6/IL-12p40 production in macrophages.'
  molecular_function:
