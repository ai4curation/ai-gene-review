  review:
    summary: Synaptosomes from Ptprn/Ptprn2 double knockout mice show reduced K+-stimulated release of dopamine,
      GABA and glutamate, with a reduced number of synaptic vesicles.
    action: KEEP_AS_NON_CORE
    reason: The release defect is from double knockouts, but Ptprn2 (not Ptprn) is the family member that
      co-purifies with synaptic vesicles, so it is the more likely contributor. The proposed mechanism is
      maintenance of vesicle number rather than a step of exocytosis itself, and basal release is unaffected.
