id: P80560
gene_symbol: Ptprn2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Ptprn2 (IA-2beta, phogrin, PTP-NP) is a single-pass type I transmembrane protein of the
  IA-2 family of receptor-like protein-tyrosine phosphatases, expressed in brain, pituitary and pancreatic
  islet endocrine cells from early pancreatic development onward. It is an integral membrane protein
  of neuroendocrine dense-core secretory granules and, in neurons, also co-purifies with synaptic vesicles
  and is found in presynaptic terminals. The precursor carries an N-terminal luminal pro-region that
  helps sort it to granules (with carboxypeptidase E) and a cytoplasmic tail with clathrin-adaptor sorting
  signals for recycling after exocytosis; it is cleaved during granule maturation to shorter transmembrane
  forms (IA-2beta71, 64 and 60). The cytoplasmic PTP-like domain has substitutions at conserved catalytic
  positions and lacks meaningful protein-tyrosine phosphatase activity; the orthologous rat protein dephosphorylates
  phosphoinositides through the conserved catalytic cysteine, which is retained in mouse. In mice, loss
  of Ptprn2 reduces dense-core vesicle number, half-life and insulin content and impairs glucose-stimulated
  insulin secretion, and combined loss with Ptprn reduces synaptic vesicle number and stimulated neurotransmitter
  release, brain monoamine content, pituitary LH and plasma renin. The cytoplasmic domain can homo- and
  heterodimerize with Ptprn and some catalytically active receptor PTPs.
