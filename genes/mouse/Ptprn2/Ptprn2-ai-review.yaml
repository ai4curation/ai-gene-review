    label: endoplasmic reticulum lumen
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: located_in
  supporting_entities:
  - RGD:61904
  review:
    summary: Rat-to-mouse ortholog transfer of an endoplasmic reticulum lumen localization from the rat phogrin
      cloning study.
    action: MARK_AS_OVER_ANNOTATED
    reason: The rat donor study (Wasmeier and Hutton 1996, abstract only in cache) characterised phogrin
      as an insulin secretory granule membrane protein that is sorted and processed in a late compartment
      of the secretory pathway. As a single-pass type I membrane protein, Ptprn2 can only be in the ER as
      a biosynthetic intermediate in the ER membrane, with its N-terminal domain facing the lumen; it is
      not a soluble luminal ER resident. Transit through the ER is true of every secretory-pathway membrane
      protein and says nothing about where Ptprn2 functions. The donor full text could not be checked,
      so the row is marked as an over-annotation rather than removed.
    supported_by:
