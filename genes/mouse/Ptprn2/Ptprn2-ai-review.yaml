  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000242
  - RHEA:10684
  - EC:3.1.3.48
  review:
    summary: Domain/EC-based electronic assignment of protein tyrosine phosphatase activity to the PTP-like
      domain of Ptprn2.
    action: REMOVE
    reason: The mouse knockout study and the multimerization study, both on mouse IA-2beta, describe the
      PTP-like domain as enzymatically inactive, and the rat PTP-NP-2/phogrin ortholog (same PANTHER subfamily
      PTHR46106:SF5) showed no measurable activity in a pNPP assay unless a non-consensus aspartate was
      reverted to the consensus alanine. UniProt flags that the protein lacks tyrosine-protein phosphatase
      activity at mildly acidic pH. The catalytic cysteine is conserved, and the activity it supports in
      the rat ortholog is toward phosphoinositides; that is captured by the separate NEW phosphatidylinositol
      phosphate phosphatase activity row. The InterPro/EC mapping to protein tyrosine phosphatase activity
      is therefore demonstrably wrong for this protein. PAINT also did not propagate any phosphatase activity
      to the IA-2 family nodes.
    supported_by:
    - reference_id: PMID:15220191
      supporting_text: is an enzymatically inactive member of the transmembrane protein tyrosine phosphatase
        family and is located in dense-core secretory vesicles
    - reference_id: PMID:12364328
      supporting_text: contain just a single enzymatically inactive PTP-like domain
    - reference_id: PMID:9714834
      supporting_text: Wild-type PTP-NP-2 showed no measurable tyrosine phosphatase activity using an in-vitro
