- term:
    id: GO:0052866
    label: phosphatidylinositol phosphate phosphatase activity
  evidence_type: ISS
  original_reference_id: PMID:20097759
  review:
    summary: Inferred from the rat ortholog. Purified transmembrane rat phogrin dephosphorylates phosphoinositides
      in a catalytic-cysteine-dependent manner, and the cysteine is conserved in mouse Ptprn2. This activity
      has not been assayed for the mouse protein.
    action: NEW
    reason: Rat phogrin (Q63475) and mouse Ptprn2 are orthologs in the same PANTHER subfamily (PTHR46106:SF5)
      with 92.9% identity, and the rat catalytic cysteine C934 aligns to mouse C931 with identical flanking
      sequence (PIIVHCSDGAGR). Purified full-length rat phogrin dephosphorylates PI(3)P and PI(4,5)P2 with
      a specific activity comparable to established PIPases, and the C934S mutant is inactive. The general
      phosphatidylinositol phosphate phosphatase term is used because the phosphate position removed from
      PI(4,5)P2 was not determined. This is not a PAINT omission; no IA-2 family member carries an experimental
      GO annotation for this activity (rat Q63475 has none in QuickGO as of 2026-10-20), so no PAINT decision
      was made either way. The row is evidence-coded ISS to make clear that the activity is inferred, not
      demonstrated, in mouse.
    supported_by:
    - reference_id: PMID:20097759
      supporting_text: phogrin is able to dephosphorylate specific inositol phospholipids, including phosphatidylinositol
        (PI) 3-phosphate and PI 4,5-diphosphate but not PI 3,4,5-trisphosphate.
    - reference_id: PMID:20097759
      supporting_text: Purified phogrin(C934S)-myc had little activity, indicating that the activity of the
        affinity-purified preparation was not likely to be due to contaminating or co-precipitating endogenous
        PIPases.
    - reference_id: file:mouse/Ptprn2/Ptprn2-bioinformatics/RESULTS.md
      supporting_text: aligns to mouse C931, with identical local context PIIVHCSDGAGR in mouse (926-937)
        and rat (929-940).
