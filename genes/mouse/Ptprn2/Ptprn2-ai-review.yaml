core_functions:
- description: Integral membrane protein of neuroendocrine dense-core granules and neuronal synaptic vesicles
    that maintains secretory vesicle number and stability and supports stimulus-coupled secretion, notably
    glucose-stimulated insulin secretion from beta cells. This is established experimentally in mouse
    (knockout and fractionation).
  directly_involved_in:
  - id: GO:0035773
    label: insulin secretion involved in cellular response to glucose stimulus
  - id: GO:0051046
    label: regulation of secretion
  locations:
  - id: GO:0032127
    label: dense core granule membrane
  - id: GO:0030672
    label: synaptic vesicle membrane
  supported_by:
  - reference_id: PMID:21732083
    supporting_text: Islets from single and DKO mice all showed a significant decrease in insulin content,
      insulin secretion and the number and half-life of DCV
  - reference_id: PMID:15220191
    supporting_text: The IA-2beta(-/-) mice, in contrast to wild-type controls, showed mild glucose intolerance
      and impaired glucose-stimulated insulin secretion.
  - reference_id: PMID:19361477
    supporting_text: these findings show that IA-2beta is present in both DCV and SV
- description: Transmembrane phosphatidylinositol phosphate phosphatase whose PTP-like domain lacks conventional
    protein-tyrosine phosphatase activity. The activity is inferred from the rat SF5 ortholog via the conserved
    catalytic cysteine (mouse C931) and has not been assayed for the mouse protein.
  molecular_function:
    id: GO:0052866
    label: phosphatidylinositol phosphate phosphatase activity
  locations:
  - id: GO:0032127
    label: dense core granule membrane
  supported_by:
  - reference_id: PMID:20097759
    supporting_text: phogrin is able to dephosphorylate specific inositol phospholipids, including phosphatidylinositol
      (PI) 3-phosphate and PI 4,5-diphosphate but not PI 3,4,5-trisphosphate.
  - reference_id: file:mouse/Ptprn2/Ptprn2-bioinformatics/RESULTS.md
    supporting_text: aligns to mouse C931, with identical local context PIIVHCSDGAGR in mouse (926-937)
      and rat (929-940).
suggested_questions:
- question: Does mouse Ptprn2 have the phosphoinositide phosphatase activity shown for rat phogrin, and
    is that activity, rather than a structural role in the granule membrane, what maintains dense-core
    vesicle number in mouse islets?
- question: Is the neurotransmitter release defect of Ptprn/Ptprn2 double knockout synaptosomes reproduced
    in Ptprn2 single knockouts, given that only Ptprn2 co-purifies with synaptic vesicles?
suggested_experiments:
- description: Assay purified full-length mouse Ptprn2 and its C931S mutant against PI(3)P, PI(5)P and
    PI(4,5)P2, then rescue Ptprn2-null beta cells with wild-type or C931S protein and measure dense-core
    vesicle number, half-life and glucose-stimulated insulin secretion.
- description: Measure K+-evoked neurotransmitter release and synaptic vesicle number in synaptosomes
    from Ptprn2 single knockout mice to separate the Ptprn2 contribution from that of Ptprn.
