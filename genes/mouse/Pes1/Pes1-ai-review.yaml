id: Q9EQ61
gene_symbol: Pes1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Pes1 (pescadillo homolog; yeast Nop7) is a nucleolar BRCT-domain protein. With Bop1 and Wdr12
  it forms the PeBoW complex, which is needed for 60S ribosomal-subunit biogenesis. Bop1 binds Pes1 and
  brings it into nucleolar pre-60S complexes, where the PeBoW complex drives processing of 36S/32S pre-rRNA
  to mature 28S and 5.8S rRNA. Pes1 defects block large-subunit rRNA maturation, induce p53 and arrest
  the cell cycle. Pes1-null mouse embryos arrest at the morula stage with undifferentiated nucleoli. In
  mitosis Pes1 coats the periphery of the chromosomes. In tumour cells PES1 has also been reported to
  help recruit the helicase DDX21 to R-loops, and its depletion leads to STING-dependent interferon signalling.
