    action: NEW
    reason: >-
      No GO molecular function exists yet for steric stabilization of casein
      micelles. Protein-containing complex stabilizing activity is the closest term
      and is used as the core molecular function of kappa-casein across the casein
      family reviews; it is imperfect because the micelle is a supramolecular
      casein-calcium phosphate assembly rather than a defined protein complex (see
