core_functions:
- description: >-
    Located at the surface of casein micelles, kappa-casein stabilizes the micelles
    formed by the calcium-sensitive caseins and calcium phosphate, preventing their
    calcium-induced aggregation and precipitation and limiting micelle size, which is
    required for milk secretion. Protein-containing complex stabilizing activity is
    an imperfect fit: the micelle is a supramolecular casein-calcium phosphate
    assembly stabilized sterically rather than a defined protein complex.
  molecular_function:
