suggested_questions:
- question: >-
    Should GO add a casein micelle stabilizing (or colloid-stabilizing) molecular
    function, since protein-containing complex stabilizing activity describes
    prevention of dissociation of a defined complex rather than steric stabilization
    of a supramolecular casein-calcium phosphate assembly?
- question: >-
    Is kappa-casein also required intracellularly, for transport of caseins
    through the Golgi and secretory vesicles, or only for stability of micelles once
    in the alveolar lumen?
suggested_experiments:
- description: >-
    Rescue Csn3-null mammary glands with kappa-casein variants lacking the
    glycosylated C-terminal macropeptide or with the chymosin site mutated, and
    measure micelle size, stability and milk secretion.
