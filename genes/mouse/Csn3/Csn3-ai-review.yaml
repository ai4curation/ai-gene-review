description: >-
  Kappa-casein is the calcium-insensitive casein of milk, a secreted
  glycophosphoprotein expressed in the lactating mammary epithelium. Unlike the
  calcium-sensitive alpha-, beta- and gamma-caseins it does not precipitate with
  calcium; it sits mainly at the surface of casein micelles, where its hydrophilic,
  glycosylated C-terminal region stabilizes the micelles against calcium-induced
  aggregation and limits their size. Mice lacking kappa-casein fail to lactate
  because casein micelles destabilize in the alveolar lumen, so kappa-casein is
  essential for milk secretion. Cleavage of kappa-casein at a single bond by gastric
  chymosin (rennin) or pepsin releases the C-terminal caseinomacropeptide and
  destabilizes the micelles, causing milk clotting during digestion.
