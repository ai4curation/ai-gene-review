- question: Should the Map2k4 IMP to neuromuscular junction development (PMID:10521398, with/from Erbb2<tm1Cbm> MGI:1929071)
    be moved to Erbb2, together with the rat ISO copy?
- question: Does the Map2k4 IDA to ERBB signaling pathway (PMID:8702681) rest on an MKK4 assay, or on the ERK-pathway MEK
    described in the abstract?
- question: Under which physiological stimuli does mouse MKK4 make a non-redundant contribution to p38 activation, as opposed
    to JNK activation?
- question: How does loss of MKK4 in cardiomyocytes raise NFAT activity and exacerbate pathological hypertrophy, given that
    rat dominant-negative SEK1 blocks agonist-induced hypertrophy?
suggested_experiments:
- description: Kinase-dead Map2k4 knock-in mice, alone and combined with Map2k7 deletion, to measure MKK4-specific JNK Tyr
    and p38 TGY phosphorylation in neurons and cardiomyocytes across osmotic, oxidative and axotomy stimuli.
- description: In MKK4-deficient cardiomyocytes, test whether JNK-mediated phosphorylation of NFATc3/c4 is lost and whether
    a phospho-mimetic NFAT reverses exacerbated hypertrophy.
