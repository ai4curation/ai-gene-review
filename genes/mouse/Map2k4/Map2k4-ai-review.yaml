id: P47809
gene_symbol: Map2k4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Map2k4 (MKK4, SEK1, JNKK1) encodes a dual-specificity protein kinase of the STE group that, with MKK7, forms
  the MAP kinase kinase tier of the stress-activated JNK cascade and also activates p38 MAPKs. Phosphorylated on its activation
  loop by MAP3Ks such as MEKK1, ASK1, TAK1, DLK, the mixed-lineage kinases and TPL2, it docks JNK1-3 and p38 through an N-terminal
  D domain and phosphorylates the Thr-Pro-Tyr activation motif of JNK, preferring the tyrosine, while MKK7 prefers the threonine;
  it does not activate ERK. It is a soluble cytoplasmic kinase also detected in the nucleus, and in JNK modules it is organised
  by scaffolds such as JSAP1/JIP3. In mouse, Map2k4 is required for embryonic development and, in the nervous system, for
  normal JNK activity, Purkinje cell alignment and cortical radial migration; it mediates axotomy-induced death of neonatal
  motoneurons downstream of DLK, oxidative-stress-induced vascular smooth muscle cell apoptosis, and in cardiomyocytes restrains
  maladaptive hypertrophic remodelling.
