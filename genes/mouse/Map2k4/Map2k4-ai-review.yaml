core_functions:
- description: 'Dual-specificity MAP2K of the JNK cascade: activated by stress-responsive MAP3Ks, MKK4 docks JNK1-3 through
    its N-terminal D domain and phosphorylates the JNK Thr-Pro-Tyr activation motif (preferring the tyrosine), cooperating
    non-redundantly with MKK7 for full JNK activation.'
  molecular_function: *id008
  directly_involved_in:
  - *id001
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id006
  - *id014
  - *id002
  - reference_id: PMID:9891090
    supporting_text: Genetic studies demonstrate that MKK4 and MKK7 serve nonredundant functions as activators of JNK in vivo.
  - *id015
- description: MKK4 also phosphorylates and activates p38 MAPKs, docking them through the same D domain; this contribution
    is stimulus dependent (MKK4 is activated by osmotic shock but not by cardiac ischaemia in rat heart).
  molecular_function: *id009
  directly_involved_in:
  - *id021
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id003
  - *id004
  - reference_id: PMID:20550965
    supporting_text: rule out a role for MKK4 in the activation of p38 during cardiac ischaemia
