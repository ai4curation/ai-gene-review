proposed_new_terms: []
suggested_questions:
- question: Which mouse cytokine and pyroptotic inflammatory response rows should stay as flat Casp8 biological-process
    annotations rather than being represented only through GO-CAM substrate cleavage events?
- question: Should the Casp8/cFLIP survival checkpoint against necroptosis be represented with distinct RIPK1, CYLD, and
    RIPK3 cleavage activities once substrate-specific GO molecular functions exist?
suggested_experiments:
- description: Compare endogenous catalytic-dead, DED-interface, and non-cleavable Casp8 knock-in alleles in mouse cells
    to separate FADD recruitment, RIPK1/CYLD cleavage, gasdermin cleavage, and apoptotic procaspase maturation.
- description: Use acute rescue of Casp8-null mouse macrophages and endothelial cells with wild-type versus
    cFLIP-binding-defective Casp8 to determine which developmental annotations reflect direct necroptosis-checkpoint
    activity.
