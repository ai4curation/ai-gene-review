id: O89110
gene_symbol: Casp8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Casp8 encodes mouse caspase-8, a tandem-death-effector-domain initiator caspase that is recruited to FADD-containing
  death-inducing signaling complexes and cytosolic RIPK1/FADD/cFLIP platforms. Dimerized Casp8 acts as an Asp-directed cysteine
  endopeptidase that initiates death-receptor apoptosis by maturing downstream caspases, restrains RIPK1/RIPK3-dependent necroptosis
  by cleaving death-complex substrates, and connects innate or death-receptor inputs to inflammatory cytokine and pyroptotic
  branches through substrates such as GSDMD and N4BP1. Mouse loss-of-function studies also reveal essential endothelial, yolk-sac,
  hematopoietic, and macrophage contexts for this death-complex checkpoint activity.'
