- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:14663139
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:2179456
  review:
    summary: Dffa supports cell-death execution in defined mouse experimental contexts.
    action: KEEP_AS_NON_CORE
    reason: Full PMID:14663139 includes Dffa-null and compound-mutant mice, despite its EndoG-focused
      title. Dffa-null lymphoid cells show reduced cell death after the tested stimuli. The positive contribution
      is consistent with CAD folding; it does not erase ICAD inhibitory activity or imply that Dffa promotes
      all apoptosis.
    supported_by:
    - reference_id: PMID:14663139
      supporting_text: splenocytes ( Fig. 5 A ) and thymocytes (data not shown) from EndoG +/- , DFF45
        -/- , and EndoG +/- DFF45 -/- mice exhibit comparable levels of cell death that are reduced compared
        with wild-type cells.
    - *id005
