- term:
    id: GO:0006309
    label: apoptotic DNA fragmentation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR017299
  review:
    summary: ICAD contributes through regulation and folding rather than DNA cleavage.
    action: MODIFY
    reason: CAD/Dffb performs phosphodiester cleavage. ICAD supplies a folding-chaperone function and
      then inhibits the nuclease. Refine this broad process assertion to the established negative regulation
      of apoptotic DNA fragmentation, while retaining the separate folding annotations. Caspase-substrate
      necessity alone is not used to manufacture a new execution process.
    supported_by:
    - *id003
    - &id005
      reference_id: PMID:10336474
      supporting_text: ICAD-L but not ICAD-S works as a specific chaperone for CAD, facilitating its correct
        folding during synthesis.
    proposed_replacement_terms:
    - id: GO:1902511
      label: negative regulation of apoptotic DNA fragmentation
