id: O54786
gene_symbol: Dffa
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Dffa encodes ICAD/DFF45, the folding chaperone and inhibitor of the CAD/Dffb endonuclease.
  ICAD-L assists productive CAD folding and remains associated with the nuclease to prevent premature
  DNA fragmentation. Executioner-caspase cleavage removes the inhibitory constraint during apoptosis.
  ICAD isoforms differ in chaperone capacity, and loss of Dffa impairs CAD-dependent DNA fragmentation
  and nuclear remodeling in several mouse cell types. Cytosolic and nuclear DFF complexes provide regulated
  pools of the nuclease and its inhibitor.
