  review:
    summary: Pax6 loss alters orientation of cortical progenitor cell division, mediated by its direct
      target Spag5.
    action: KEEP_AS_NON_CORE
    reason: Pax6 loss-of-function (Small eye) phenotype; Pax6 acts in this process as an upstream transcriptional
      regulator. Legitimate developmental role but downstream of the core TF activity; kept as non-core
      for this highly pleiotropic gene.
    supported_by:
    - reference_id: PMID:22031545
