id: Q14DK4
gene_symbol: Gpat2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Gpat2 encodes glycerol-3-phosphate acyltransferase 2, mitochondrial (GPAT2), an
  ~89 kDa integral protein of the mitochondrial outer membrane with two
  transmembrane segments and cytosol-facing N- and C-terminal regions, including the
  catalytic acyltransferase (HXXXXD) domain. It belongs to the GPAT/DHAPAT family and
  is the paralog of GPAT1 (Gpam). GPAT2 is an N-ethylmaleimide-sensitive
  glycerol-3-phosphate acyltransferase that transfers an acyl group from acyl-CoA to
  the sn-1 position of sn-glycerol 3-phosphate to form lysophosphatidic acid, the first
  step of de novo glycerolipid synthesis; unlike GPAT1 it prefers arachidonoyl-CoA,
  and its overexpression channels arachidonate into triacylglycerol and increases
  phosphatidic acid production (an additional 1-acylglycerol-3-phosphate
  acyltransferase activity has been reported in membranes of overexpressing cells).
  Gpat2 is expressed mainly in the testis, transiently in pachytene spermatocytes,
  under control of promoter methylation and retinoic acid. Separately from its
  catalytic activity, GPAT2 binds the PIWI protein MILI (PIWIL2) and is required for
  primary piRNA biogenesis in male germ cells; catalytically dead HXXXXD mutants still
  support piRNA production, suggesting a scaffolding role on the mitochondrial
  surface. Loss of GPAT2 in mice impairs piRNA production, derepresses IAP and LINE-1
  retrotransposons in fetal testis, and causes germ cell apoptosis and defective
  spermatogenesis.
