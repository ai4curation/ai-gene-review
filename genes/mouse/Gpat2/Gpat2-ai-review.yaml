  qualifier: enables
  review:
    summary: AGPAT activity was increased in total membranes of CHO-K1 cells overexpressing
      mouse GPAT2, most strongly with arachidonoyl-CoA.
    action: KEEP_AS_NON_CORE
    reason: The paper shows increased AGPAT activity and PA formation in crude membranes of
      overexpressing cells. The authors themselves present this as possibly a second activity
      of GPAT2 and could not separate a direct activity from an indirect effect on endogenous
      AGPATs; no purified-protein assay exists. The activity is plausible and is recorded by
      UniProt, but it is secondary to the established GPAT (sn-1 acylation) activity, so it is
      retained as non-core.
    supported_by:
    - reference_id: PMID:22905194
      supporting_text: GPAT2 overexpression increased AGPAT activity ∼50% with oleoyl-CoA and
        2- fold when arachidonoyl-CoA was used as substrate, confirming the preference of GPAT2
        for this fatty acid.
    - reference_id: PMID:22905194
      supporting_text: These findings suggest that the increase in PA may be due to an AGPAT
        activity for this heterologously-expressed protein, but we cannot exclude the possibility
        that the protein has dual enzymatic activities.
