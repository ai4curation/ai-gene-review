- id: PMID:14724270
  title: Identification of a new glycerol-3-phosphate acyltransferase isoenzyme, mtGPAT2,
    in mitochondria.
  findings:
  - statement: An NEM-sensitive GPAT activity, distinct from GPAT1, was detected in liver
      mitochondria of GPAT1-null mice and named mtGPAT2 (before the gene was cloned).
    supporting_text: we detected a novel NEM-sensitive GPAT activity in mitochondrial fractions
      and an anti-mtGPAT immunoreactive protein in liver mitochondria, but not in microsomes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Biochemical detection of the activity; the link to the
      Gpat2 gene product was made later by cloning (PMID:17689486).
- id: PMID:17013544
  title: Molecular cloning of a murine glycerol-3-phosphate acyltransferase-like protein 1
    (xGPAT1).
  findings:
  - statement: Independent cloning of mouse Gpat2 (as xGPAT1), 801 aa, membrane-associated, with
      GPAT activity in CHO-K1 cells.
    supporting_text: xGPAT1 was distributed in the membrane fraction and showed GPAT activity
      when epitope-tagged xGPAT1 was expressed in Chinese hamster ovary (CHO)-K1 cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; cited by UniProt for function and location.
- id: PMID:17689486
  title: Cloning and functional characterization of a novel mitochondrial N-ethylmaleimide-sensitive
    glycerol-3-phosphate acyltransferase (GPAT2).
  findings:
  - statement: Cloned from mouse testis; NEM-sensitive GPAT activity, mitochondrial location, and
      increased TAG synthesis in transfected Cos-7 cells; testis-enriched expression.
    supporting_text: When Cos-7 cells were transiently transfected with GPAT2, NEM-sensitive
      GPAT activity increased 30%.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache.
- id: PMID:18658143
  title: 'Thematic review series: glycerolipids. Mammalian glycerol-3-phosphate acyltransferases:
    new genes for an old activity.'
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Background review of mammalian GPAT isoforms; cached but not used as support.
- id: PMID:22285183
  title: Membrane topology of murine glycerol-3-phosphate acyltransferase 2.
  findings:
  - statement: GPAT2 is an integral membrane protein with two transmembrane segments; N- and
      C-termini and catalytic motifs I-III face the cytosol.
    supporting_text: These results suggest that the GPAT2 protein has two transmembrane segments
      and that the N-terminal and C-terminal regions of this protein face the cytoplasm.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; epitope-tag protease-protection topology in HEK293 cells.
- id: PMID:22905194
  title: Glycerol-3-phosphate acyltransferase-2 is expressed in spermatic germ cells and incorporates
    arachidonic acid into triacylglycerols.
  findings:
  - statement: GPAT2 prefers arachidonoyl-CoA; overexpression increases GPAT and AGPAT activity
      with arachidonoyl-CoA, PA synthesis, and arachidonate-rich TAG; expressed in primary
      spermatocytes.
    supporting_text: we have identified mitochondrial GPAT2 as an acyltransferase that prefers
      arachidonoyl-CoA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Enzyme assays are on total membranes of overexpressing CHO-K1
      cells; the authors could not exclude an indirect basis for the AGPAT increase.
- id: PMID:23611983
  title: GPAT2, a mitochondrial outer membrane protein, in piRNA biogenesis in germline stem
    cells.
  findings:
  - statement: GPAT2 binds MILI and is required for primary piRNA production in germline stem
      cells, independently of its acyltransferase activity.
    supporting_text: These data suggest that the acyltransferase activity of GPAT2 is
      dispensable for the biogenesis of piRNA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; co-IP/mass spectrometry, shRNA knockdown, HXXXXD-mutant rescue.
- id: PMID:26268560
  title: Methylation of the Gpat2 promoter regulates transient expression during mouse
    spermatogenesis.
  findings:
  - statement: Gpat2 expression peaks at 15 dpp, restricted to pachytene spermatocytes, and is
      controlled by promoter methylation and retinoic acid.
    supporting_text: Gpat2 mRNA content and protein expression were maximal at 15 dpp (days
      post-partum) and were restricted to pachytene spermatocytes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Expression/regulation; informs description, not GO terms.
- id: PMID:28729426
  title: Glycerol-3-phosphate acyltransferase 2 is essential for normal spermatogenesis.
  findings:
  - statement: In vivo testicular shRNA silencing of Gpat2 causes pachytene arrest and germ cell
      apoptosis (downstream phenotype; not annotated as process participation).
    supporting_text: Histological and gene expression analysis showed impaired spermatogenesis
      and arrest at the pachytene stage.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache.
- id: PMID:30951587
  title: GPAT2 is required for piRNA biogenesis, transposon silencing, and maintenance of
    spermatogonia in mice†.
  findings:
  - statement: Gpat2-deficient mice have defective piRNA production, retrotransposon
      derepression in fetal testes, and germ cell apoptosis.
    supporting_text: The deficient mice showed defective piRNA production and subsequent
      de-silencing of IAP and Line-1 retrotransposons in fetal testes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Transposon silencing and spermatogonial survival are
      downstream consequences of piRNA loss and are not proposed as GPAT2 process annotations.
