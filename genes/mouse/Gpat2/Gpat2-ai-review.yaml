- term:
    id: GO:0034587
    label: piRNA processing
  evidence_type: IMP
  original_reference_id: PMID:23611983
  qualifier: involved_in
  review:
    summary: GPAT2 knockdown in MILI-rescued germline stem cells severely impaired piRNA
      production; small-RNA profiles resembled MILI-null cells, indicating a defect in primary
      processing.
    action: MODIFY
    reason: Correct, and the paper specifically localises the defect to the primary piRNA
      processing pathway, so the precise term is primary piRNA processing (GO:0140990, is_a
      GO:0034587, checked via OLS). GPAT2 is not merely a substrate or upstream requirement
      here; it binds MILI, a core primary-processing component, and the requirement is
      independent of its acyltransferase activity (HXXXXD mutants rescue), consistent with a
      proposed structural/scaffold contribution on the mitochondrial outer membrane. The
      in vivo knockout (PMID:30951587) confirms defective piRNA production. The exact
      mechanism remains unknown. This role is GPAT2-specific and was not propagated by PAINT
      to the GPAT1/GPAT2 node.
    proposed_replacement_terms:
    - id: GO:0140990
      label: primary piRNA processing
    supported_by:
    - reference_id: PMID:23611983
      supporting_text: These data clearly show that GPAT2 plays a critical role in primary
        processing during piRNA production.
    - reference_id: PMID:23611983
      supporting_text: These data suggest that the acyltransferase activity of GPAT2 is
        dispensable for the biogenesis of piRNA.
    - reference_id: PMID:30951587
      supporting_text: The deficient mice showed defective piRNA production and subsequent
        de-silencing of IAP and Line-1 retrotransposons in fetal testes.
core_functions:
- description: Mitochondrial outer membrane glycerol-3-phosphate acyltransferase that acylates
    sn-glycerol 3-phosphate at sn-1 using acyl-CoA (preferring arachidonoyl-CoA) to form
    lysophosphatidic acid, initiating synthesis of phosphatidic acid and arachidonate-rich
    triacylglycerol in male germ cells. Experimentally established for the mouse protein (in
    transfected cells and membranes); inferred clade-wide by PAINT at PTN000970957.
  molecular_function:
    id: GO:0004366
    label: glycerol-3-phosphate O-acyltransferase activity
  directly_involved_in:
  - id: GO:0006654
    label: phosphatidic acid biosynthetic process
  - id: GO:0019432
    label: triglyceride biosynthetic process
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  substrates:
  - id: CHEBI:57597
    label: sn-glycerol 3-phosphate
  - id: CHEBI:57368
    label: (5Z,8Z,11Z,14Z)-eicosatetraenoyl-CoA
  supported_by:
  - reference_id: PMID:22905194
    supporting_text: GPAT2 overexpression significantly increased GPAT activity only when
      arachidonoyl-CoA was used as a substrate.
  - reference_id: PMID:17689486
    supporting_text: When Cos-7 cells were transiently transfected with GPAT2, NEM-sensitive
      GPAT activity increased 30%.
  - reference_id: PMID:22285183
    supporting_text: These results suggest that the GPAT2 protein has two transmembrane segments
      and that the N-terminal and C-terminal regions of this protein face the cytoplasm.
- description: Catalysis-independent requirement for primary piRNA biogenesis in male germ
    cells. GPAT2 binds the PIWI protein MILI (PIWIL2) on the mitochondrial outer membrane and
    is needed for MILI-bound piRNA production; catalytically inactive HXXXXD mutants still
    rescue, suggesting a scaffold function whose molecular activity is undefined.
    Experimentally established in mouse germline stem cells and knockout mice; GPAT2-specific
    and not inferred for the GPAT1/GPAT2 clade.
  directly_involved_in:
  - id: GO:0140990
    label: primary piRNA processing
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:23611983
    supporting_text: Binding of MILI to GPAT2 was confirmed by coimmunoprecipitation analysis
      of testis samples
  - reference_id: PMID:23611983
    supporting_text: These data suggest that the acyltransferase activity of GPAT2 is
      dispensable for the biogenesis of piRNA.
  - reference_id: PMID:30951587
    supporting_text: The deficient mice showed defective piRNA production and subsequent
      de-silencing of IAP and Line-1 retrotransposons in fetal testes.
proposed_new_terms: []
suggested_questions:
- question: Is the AGPAT (LPA to PA) activity seen in membranes of GPAT2-overexpressing cells
    intrinsic to GPAT2, or due to induced or co-operating endogenous AGPATs?
- question: What molecular activity does GPAT2 contribute to primary piRNA processing
    independently of catalysis? Does it act as an adaptor that recruits MILI or other
    machinery to the mitochondrial outer membrane?
- question: Human GPAT2 annotations are ISS transfers from mouse; should ortholog transfers of
    the piRNA role be limited to the GPAT2 subfamily (PTHR12563:SF15) and not extended to
    GPAT1?
suggested_experiments:
- description: Assay purified or reconstituted recombinant GPAT2 for GPAT and AGPAT activity
    with defined acyl-CoAs (including arachidonoyl-CoA) to determine kinetics and whether it
    has dual activity.
  experiment_type: in vitro enzyme assay
- description: Map the MILI-binding region of GPAT2 by deletion/point mutants and test which
    mutants fail to rescue piRNA production in Gpat2-knockdown germline stem cells, to separate
    a scaffold role from catalysis.
  experiment_type: mutagenesis and rescue
