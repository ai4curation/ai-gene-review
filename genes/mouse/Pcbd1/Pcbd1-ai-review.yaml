id: P61458
gene_symbol: Pcbd1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Pcbd1 (DCoH, PHS) is a small 104-residue bifunctional moonlighting protein that
  assembles as a homodimer and homotetramer and partitions between the cytosol and
  the nucleus. Its two activities are mechanistically unrelated and use different
  surfaces of the same fold. As an enzyme it is pterin-4-alpha-carbinolamine
  dehydratase (PCD; EC 4.2.1.96), dehydrating
  (4aS,6R)-4a-hydroxy-tetrahydrobiopterin to quinonoid-6,7-dihydrobiopterin plus
  water. That carbinolamine substrate is the product formed when tetrahydrobiopterin
  (BH4) serves as cofactor for the aromatic amino acid hydroxylases, most prominently
  phenylalanine hydroxylase during the conversion of phenylalanine to tyrosine; the
  quinonoid product is then reduced back to BH4 by dihydropteridine reductase (Qdpr).
  Pcbd1 therefore works in the regeneration arm of the BH4 cycle, accelerating
  cofactor turnover and suppressing the non-enzymatic rearrangement that yields
  7-substituted (primapterin) pterins. It stimulates phenylalanine hydroxylase
  indirectly, by speeding cofactor recycling, and does not itself hydroxylate
  phenylalanine. As the dimerization cofactor of HNF1 (DCoH) the same protein binds
  the homeodomain transcription factor Hnf1a and selectively stabilises its homodimer;
  it does not bind DNA and does not alter Hnf1a DNA-binding affinity, but the
  resulting tetrameric DCoH-HNF1 complex is transcriptionally more active, and the
  effect is specific to HNF1 rather than a transferable activation domain. Through the
  equivalent interaction with Hnf1b it supports HNF1-dependent transcriptional
  programmes in liver, pancreas and kidney. In human, loss of the orthologous PCBD1
  causes an autosomal-recessive hyperphenylalaninemia with primapterinuria, later
  accompanied by HNF1-associated hypomagnesemia with renal magnesium wasting and
  MODY-type diabetes. Mouse Pcbd1 is mainly expressed in liver, pancreatic cells and
  kidney, and is induced by a low-magnesium diet.
existing_annotations:
- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: ISO
  original_reference_id: PMID:1763325
  qualifier: enables
  supporting_entities:
  - UniProtKB:P61459
  review:
    summary: >-
      The DCoH half of this moonlighting protein. Pcbd1 binds Hnf1a, stabilises its
      homodimer, and increases HNF1-dependent transcription without binding DNA or
      changing Hnf1a DNA-binding affinity. This is a core function, distinct from the
      dehydratase activity.
    action: ACCEPT
    reason: >-
      Mendel et al. define the activity precisely as that of a coactivator: DCoH does
      not contact DNA, it stabilises the HNF1-alpha dimer, and the resulting tetramer
      has enhanced transcriptional output. The specificity control in the same paper -
      DCoH cannot activate transcription when tethered via the GAL4 DNA-binding domain
      - shows this is an HNF1-directed cofactor activity rather than a transferable
      activation domain, which is exactly what GO:0003713 describes. Recorded as ISO
      from rat Pcbd1 (UniProtKB:P61459); the mouse protein is the one cloned in this
      paper, so the evidence may in fact be direct (raised in suggested_questions), but
      the term is right either way.
    supported_by:
    - reference_id: PMID:1763325
      supporting_text: >-
        A dimerization cofactor of HNF-1 alpha (DCoH) was identified that displayed a
        restricted tissue distribution and did not bind to DNA, but, rather,
        selectively stabilized HNF-1 alpha dimers.
    - reference_id: PMID:1763325
      supporting_text: >-
        did not change the DNA binding characteristics of HNF-1 alpha, but enhanced its
        transcriptional activity
    - reference_id: file:mouse/Pcbd1/Pcbd1-uniprot.txt
      supporting_text: Coactivator for HNF1A-dependent transcription.
- term:
    id: GO:0004505
    label: phenylalanine 4-monooxygenase activity
  evidence_type: IDA
  original_reference_id: PMID:15182178
  qualifier: enables
  review:
    summary: >-
      This is the annotation that geneontology/go-annotation#6591 asks to correct.
      GO:0004505 is the activity of phenylalanine hydroxylase (Pah), the enzyme one
      step upstream of Pcbd1 in the BH4 cycle. The assay in PMID:15182178 measured
      pterin-4-alpha-carbinolamine dehydratase activity, which is GO:0008124.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0008124
      label: 4-alpha-hydroxytetrahydrobiopterin dehydratase activity
    reason: >-
      The two terms name consecutive steps of one cycle, which is why they get
      interchanged. GO:0004505 is "Catalysis of the reaction: L-phenylalanine +
      tetrahydrobiopterin + O2 = L-tyrosine + 4-alpha-hydroxytetrahydrobiopterin"
      (synonyms: phenylalanine hydroxylase activity, PAH activity). Pcbd1 catalyses the
      next step instead: it dehydrates that 4a-hydroxy-BH4 product to quinonoid-BH2,
      which is GO:0008124, whose own synonym list contains "pterin-4-alpha-carbinolamine
      dehydratase activity" verbatim. The error almost certainly comes from the
      protein's historical name, phenylalanine hydroxylase-STIMULATING protein: Pcbd1
      stimulates Pah by accelerating cofactor turnover, it does not hydroxylate
      phenylalanine. UniProt independently assigns EC 4.2.1.96 and the Lyase keyword to
      this entry, which is incompatible with a monooxygenase (EC 1.14.16.1). The
      experiment, the evidence code and the reference are all sound - only the term is
      wrong - so this is a MODIFY that keeps IDA and PMID:15182178 and swaps the term.
    supported_by:
    - reference_id: PMID:15182178
      supporting_text: >-
        Like DCoH, DCoH2 forms a tetramer, displays pterin-4alpha-carbinolamine
        dehydratase activity, and binds HNF1alpha in vivo and in vitro.
    - reference_id: file:mouse/Pcbd1/Pcbd1-uniprot.txt
      supporting_text: "AltName: Full=Phenylalanine hydroxylase-stimulating protein"
- term:
    id: GO:0004505
    label: phenylalanine 4-monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00029278
  review:
    summary: >-
      An ARBA machine-learning rule independently assigning phenylalanine
      4-monooxygenase activity. Same wrong term as the IDA above, but reached by a
      different route, so correcting the IDA will not clear it.
    action: REMOVE
    reason: >-
      Pcbd1 has no monooxygenase chemistry: no iron centre, no pterin-dependent
      hydroxylase domain, and a UniProt EC assignment of 4.2.1.96 (a hydro-lyase) with
      the Lyase keyword. ARBA00029278 appears to have learned an association from the
      BH4/phenylalanine-hydroxylation context that surrounds the PCD family rather than
      from the family's own catalytic signature; it fires on both mouse paralogs. This
      is an electronic inference contradicted by the curated EC and reaction, and
      should be removed independently of the MGI correction requested in
      geneontology/go-annotation#6591.
    supported_by:
    - reference_id: file:mouse/Pcbd1/Pcbd1-uniprot.txt
      supporting_text: Direct protein sequencing; Lyase;
- term:
