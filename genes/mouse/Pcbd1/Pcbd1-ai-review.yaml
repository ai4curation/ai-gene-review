- term:
    id: GO:0045893
    label: positive regulation of DNA-templated transcription
  evidence_type: ISO
  original_reference_id: PMID:1763325
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - UniProtKB:P61459
  review:
    summary: >-
      The biological process matching the DCoH coactivator activity: Pcbd1 increases
      HNF1-dependent transcription by stabilising the active HNF1 tetramer.
    action: ACCEPT
    reason: >-
      Pcbd1 performs part of the work of this process - it is a physical component of the
      transcriptionally active tetramer at HNF1 target promoters, not merely an upstream
      requirement - so the process annotation is appropriate and core. The term is right;
      the qualifier is weaker than the evidence warrants. acts_upstream_of_or_within is
      the appropriate hedge when it is unclear whether the gene product is part of the
      process or acts before it, but Mendel et al. show DCoH inside the complex that does
      the activating, so involved_in would be better supported. Flagged rather than
      actioned, since a qualifier change is a curator call and not a term replacement.
    supported_by:
    - reference_id: PMID:1763325
      supporting_text: >-
        These results indicate that DCoH regulates formation of transcriptionally active
        tetrameric complexes
    - reference_id: PMID:1763325
      supporting_text: >-
        did not change the DNA binding characteristics of HNF-1 alpha, but enhanced its
        transcriptional activity
core_functions:
- description: >-
    Pterin-4-alpha-carbinolamine dehydratase (PCD/PHS; EC 4.2.1.96) activity in the
    tetrahydrobiopterin regeneration cycle. Pcbd1 dehydrates
    (4aS,6R)-4a-hydroxy-tetrahydrobiopterin - the carbinolamine intermediate released
    when BH4 serves as cofactor for the aromatic amino acid hydroxylases, chiefly
    phenylalanine hydroxylase - to quinonoid-6,7-dihydrobiopterin plus water, which
    Qdpr then reduces back to BH4. This accelerates cofactor turnover (hence the
    historical name phenylalanine hydroxylase-stimulating protein) and suppresses the
    competing non-enzymatic rearrangement that yields 7-substituted primapterins. It is
    this activity, not phenylalanine hydroxylation, that geneontology/go-annotation#6591
    asks to be recorded for the mouse gene.
  molecular_function:
    id: GO:0008124
    label: 4-alpha-hydroxytetrahydrobiopterin dehydratase activity
  directly_involved_in:
  - id: GO:0006729
    label: tetrahydrobiopterin biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:15182178
    supporting_text: >-
      Like DCoH, DCoH2 forms a tetramer, displays pterin-4alpha-carbinolamine
      dehydratase activity, and binds HNF1alpha in vivo and in vitro.
  - reference_id: file:mouse/Pcbd1/Pcbd1-uniprot.txt
    supporting_text: Involved in tetrahydrobiopterin biosynthesis.
- description: >-
    Dimerization cofactor of HNF1 (DCoH) coactivator activity. The same protein binds
    the homeodomain transcription factor Hnf1a and selectively stabilises its homodimer,
    producing a tetrameric DCoH-HNF1 complex with enhanced transcriptional output. Pcbd1
    contributes no DNA binding of its own and does not change Hnf1a DNA-binding
    affinity, and the effect is HNF1-specific rather than a transferable activation
    domain. The equivalent interaction with Hnf1b extends this to HNF1B-dependent
    programmes in kidney and pancreas.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:1763325
    supporting_text: >-
      A dimerization cofactor of HNF-1 alpha (DCoH) was identified that displayed a
      restricted tissue distribution and did not bind to DNA, but, rather, selectively
      stabilized HNF-1 alpha dimers.
  - reference_id: PMID:1763325
    supporting_text: >-
      However, DCoH did not confer transcriptional activation to the GAL4 DNA binding
      domain.
  - reference_id: file:mouse/Pcbd1/Pcbd1-uniprot.txt
    supporting_text: Coactivator for HNF1A-dependent transcription.
suggested_questions:
- question: >-
    MGI records GO:0003713 and GO:0045893 for mouse Pcbd1 as ISO from rat
    UniProtKB:P61459, citing PMID:1763325 - but UniProt cites that same paper on the
    mouse entry for mouse liver cDNA and partial protein sequence, i.e. Mendel et al.
    cloned mouse DCoH. Were the coactivation assays in that paper performed on the mouse
    protein, in which case the annotations could be upgraded from ISO to a direct
    experimental code?
  experts:
  - MGI curators
- question: >-
    The GO:0045893 annotation uses acts_upstream_of_or_within, yet Pcbd1 is a physical
    subunit of the transcriptionally active HNF1 tetramer rather than an upstream
    effector. Should this be changed to involved_in?
  experts:
  - MGI curators
  - GO editors
- question: >-
    The Pcbd1-Pcbd2 interaction (PMID:15182178, IPI with PR:Q9CZL5) has no good
    molecular function term, since the partner is a paralog rather than an identical
    protein. Would a cellular-component term for the DCoH/HNF1 complex, or a GO-CAM
    representation, be the right home for DCoH-DCoH2 and DCoH-HNF1 stoichiometry?
  experts:
  - GO editors
- question: >-
    ARBA00029278 assigns GO:0004505 phenylalanine 4-monooxygenase activity to both mouse
    PCD paralogs, independently of the MGI annotation that
    geneontology/go-annotation#6591 targets. Can that rule's condition set be revisited,
    since the family's curated EC is 4.2.1.96?
  experts:
  - UniProt ARBA team
- question: >-
    PANTHER node PTN002650414 is placed at Euteleostomi and confers GO:0008124,
    GO:0005654 and GO:0005829 on Pcbd1 but not on Pcbd2, although both descend from the
    vertebrate ancestor of PTHR12599. Is the node intended to sit below the Pcbd1/Pcbd2
    duplication, and should the dehydratase activity be asserted at a deeper node so that
    Pcbd2 inherits it too?
  experts:
  - PANTHER/PAINT curators
suggested_experiments:
- hypothesis: >-
    Mouse Pcbd1 catalyses the dehydration of 4a-hydroxy-tetrahydrobiopterin and has no
    phenylalanine 4-monooxygenase activity, so the GO:0004505 annotations are
    misassignments rather than a second moonlighting activity.
  description: >-
    Assay recombinant mouse Pcbd1 side by side with recombinant mouse Pah in two
    reactions: the PCD reaction, following loss of 4a-hydroxy-BH4 or formation of
    quinonoid-BH2 spectrophotometrically; and the PAH reaction, measuring tyrosine
    formation from phenylalanine with BH4 and O2. Pcbd1 is expected to be active in the
    first and inactive in the second, with Pah showing the converse. Include the
    established PCD-dependence control, accumulation of 7-biopterin, to confirm the
    assigned chemistry.
  experiment_type: enzyme assay
- hypothesis: >-
    The dehydratase and DCoH coactivator functions are separable, so the GO annotations
    describe two independent activities of one protein rather than one activity described
    twice.
  description: >-
    Build catalytically dead Pcbd1 point mutants in the PCD active site that leave the
    tetramer intact, and separately interface mutants that abolish Hnf1a binding without
    affecting catalysis. Score each for dehydratase turnover and for HNF1A-dependent
    reporter activation in a mouse hepatic line. A clean double dissociation establishes
    that GO:0008124 and GO:0003713 are distinct core functions.
  experiment_type: structure-function mutagenesis
- hypothesis: >-
    Loss of mouse Pcbd1 produces the primapterinuria/hyperphenylalaninemia phenotype
    expected of a BH4-regeneration defect, plus HNF1-dependent renal and pancreatic
    phenotypes, confirming both core functions in vivo.
  description: >-
    Phenotype a Pcbd1 knockout mouse for plasma phenylalanine and urinary pterin profile
    (7-biopterin/primapterin versus biopterin) under a phenylalanine load, and in parallel
    for serum magnesium, renal Fxyd2 expression and glucose tolerance. Dissociating the
    pterin phenotype from the HNF1-dependent phenotypes would show which annotations each
    function supports.
  experiment_type: mouse knockout phenotyping
