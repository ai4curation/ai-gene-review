- term:
    id: GO:0006571
    label: L-tyrosine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0004505
  review:
    summary: >-
      An inter-ontology logical inference whose WITH field names GO:0004505 as its
      source. It is a mechanical consequence of the mis-annotated molecular function
      and inherits its error.
    action: REMOVE
    reason: >-
      The inference rule is sound - a phenylalanine 4-monooxygenase does participate in
      tyrosine biosynthesis - but its premise is false for this gene. Tyrosine is made
      by Pah; Pcbd1 acts after the hydroxylation, on the spent cofactor. Under the
      project rule that a gene product is involved_in a process only if it performs some
      of the work of that process, Pcbd1 contributes nothing to tyrosine formation: the
      carbon skeleton of tyrosine is never in its hands. Note the comparator - Qdpr,
      which performs the other regeneration step, is likewise not a tyrosine
      biosynthetic enzyme. This annotation should disappear once GO:0004505 is corrected;
      if the MF is instead left in place, this row still needs removing separately
      because the ARBA-sourced GO:0004505 would keep regenerating it.
- term:
    id: GO:0006729
    label: tetrahydrobiopterin biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001533
  - InterPro:IPR036428
  review:
    summary: >-
      InterPro2GO annotation from the pterin dehydratase domain signatures. Pcbd1
      regenerates BH4 from the 4a-hydroxy-BH4 carbinolamine produced during aromatic
      amino acid hydroxylation.
    action: ACCEPT
    reason: >-
      Strictly, Pcbd1 acts in BH4 regeneration/recycling rather than in de novo
      synthesis from GTP (the Gch1/Pts/Spr route), so the term is broader than the
      precise role. But Pcbd1 does perform a chemical step whose product feeds back into
      the BH4 pool, so it is a genuine participant rather than a substrate or a mere
      requirement, and GO has no separate regeneration child to move to. The InterPro
      signatures IPR001533/IPR036428 are the correct family signatures for this protein
      and the mapping is appropriate at the family level. Accepted as a core process.
    supported_by:
    - reference_id: file:mouse/Pcbd1/Pcbd1-uniprot.txt
      supporting_text: Involved in tetrahydrobiopterin biosynthesis.
