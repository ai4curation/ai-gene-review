    summary: >-
      Interaction with PR:P22361, which is mouse Hnf1a. The binding partner is the
      informative part and the bare protein binding term discards it.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0140297
      label: DNA-binding transcription factor binding
    reason: >-
      Per project curation guidelines, GO:0005515 protein binding carries no functional
      information and should be replaced by a term that states what is bound. The
      partner here is Hnf1a, a sequence-specific DNA-binding transcription factor, so
      GO:0140297 ("Binding to a DNA-binding transcription factor, a protein that
      interacts with a specific DNA sequence ... to modulate transcription") captures
      the experiment exactly. This is the binding event that underlies the GO:0003713
      coactivator activity above; the two are complementary, with GO:0140297 recording
      the molecular recognition and GO:0003713 its functional consequence.
    supported_by:
    - reference_id: PMID:15182178
      supporting_text: >-
        Like DCoH, DCoH2 forms a tetramer, displays pterin-4alpha-carbinolamine
        dehydratase activity, and binds HNF1alpha in vivo and in vitro.
    - reference_id: file:mouse/Pcbd1/Pcbd1-uniprot.txt
      supporting_text: Homotetramer and homodimer.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15182178
  qualifier: enables
  supporting_entities:
  - PR:Q9CZL5
  review:
    summary: >-
      Interaction with PR:Q9CZL5, the paralog Pcbd2 (DCoH2). PMID:15182178 reports that
      the DCoH2 tetramer disproportionates, which is the basis for mixed DCoH/DCoH2
      oligomers; this is a real but supportive observation.
    action: UNDECIDED
    reason: >-
      A bare protein-binding row should be replaced by a term naming what is bound, and
      the obvious candidate here is GO:0046982 protein heterodimerization activity
      ("Binding to a nonidentical protein to form a heterodimer"), since Pcbd2 is a
      paralog rather than the same protein and so GO:0042802 cannot apply. I cannot
      justify that replacement from what I can see. The cached record for PMID:15182178
      is abstract-only, and the abstract describes DCoH2 disproportionating and forming a
      2:2 complex with HNF1 - it says nothing about a mixed DCoH/DCoH2 species. The MGI
      curator read the full text and recorded a Pcbd1-Pcbd2 interaction, so the
      interaction itself is not in doubt; what I cannot determine is whether the data
      show a discrete heterodimer, a mixed tetramer, or subunit exchange between
      separately assembled tetramers, and those map to different terms. UNDECIDED pending
      the full text. If it shows a defined mixed species, MODIFY to GO:0046982; if it
      shows subunit exchange within the oligomer population, the useful representation is
      a complex term or a GO-CAM rather than a molecular function row, which is raised in
      suggested_questions. Do not read this as doubt about the interaction.
    supported_by:
    - reference_id: PMID:15182178
      supporting_text: >-
        In contrast to the hyperstable DCoH tetramer, DCoH2 readily disproportionates
        and forms a 2:2 complex with HNF1 in vitro.
