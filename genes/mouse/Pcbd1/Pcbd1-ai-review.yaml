    summary: Dehydratase activity by curator-judged sequence similarity to rat Pcbd1.
    action: ACCEPT
    reason: >-
      This is the row UniProt's own EC assignment rests on, cited there as
      ECO:0000250|UniProtKB:P61459. Correct; redundant with the three other GO:0008124
      annotations.
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P61457
  - ensembl:ENSP00000299299
  review:
    summary: Self-interaction transferred from human PCBD1 by Ensembl Compara.
    action: KEEP_AS_NON_CORE
    reason: >-
      Pcbd1 is a genuine homodimer and homotetramer, so the term is factually right.
      Self-association is a structural property that enables both functions rather than a
      function in its own right - the catalytic site of PCD is formed at a subunit
      interface and the DCoH-HNF1 tetramer is a dimer of dimers - so it is kept as
      supportive, not core.
    supported_by:
    - reference_id: file:mouse/Pcbd1/Pcbd1-uniprot.txt
      supporting_text: Homotetramer and homodimer.
