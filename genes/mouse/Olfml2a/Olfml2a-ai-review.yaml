  review:
    summary: Family-root IBA for signal transduction, seeded from outside the OLFML2 subfamily; no Olfml2a
      or Olfml2b experiment addresses signaling.
    action: UNDECIDED
    reason: The IBD was placed at PTN000573635, the bilaterian root of PTHR23192, from three donors (human
      myocilin UniProtKB:Q99972 and two mouse genes, MGI:1202864 and MGI:1860437), none in the OLFML2 subfamily,
      and Olfml2a itself is not among the donors for this term. Olfml2a descends from the node and there
      is no evidence of loss in SF29, so the inference is formally valid, but no experiment on Olfml2a
      identifies a receptor, a signaling partner or a downstream pathway; its only established activities
      are glycosaminoglycan binding and matrix deposition. PAINT curators kept other myocilin-derived terms
      at the myocilin-specific node, so the root placement was a deliberate choice that this review neither
      confirms nor refutes. Kept UNDECIDED, consistent with the human OLFML2A review.
    supported_by:
    - reference_id: PMID:15836428
      supporting_text: These results, together, indicate that photomedins are novel olfactomedin-domain-containing
        extracellular proteins capable of binding to proteoglycans containing these glycosaminoglycan chains.
