core_functions:
- description: Secreted, disulfide-linked homodimeric olfactomedin-domain glycoprotein that binds sulfated
    glycosaminoglycans, preferentially chondroitin sulfate E and heparin, and is deposited in extracellular
    matrix, consistent with association with chondroitin-sulfate/heparan-sulfate proteoglycans. These
    binding activities are experimentally established in mouse; any downstream matrix-organizing or signaling
    role is not.
  molecular_function:
    id: GO:0035374
    label: chondroitin sulfate binding
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:15836428
    supporting_text: Among a panel of ECM components, including glycosaminoglycans, photomedins preferentially
      bound to chondroitin sulphate-E and heparin.
  - reference_id: PMID:15836428
    supporting_text: were secreted as disulphide-bonded dimers (photomedin-1)
suggested_questions:
- question: Which region of Olfml2a (the N-terminal cysteine-rich/coiled-coil half or the C-terminal OLF
    domain released by the post-secretion cleavage) carries the chondroitin sulfate E and heparin binding?
- question: Did Olfml2a score positive for ECM-assembling activity in the Manabe et al. 2008 screen, and
    should extracellular matrix organization be extended to the OLFML2 subfamily?
- question: Is the photoreceptor outer-segment signal of Olfml2a in the interphotoreceptor matrix, and
    which proteoglycan carries its chondroitin sulfate E ligand there?
suggested_experiments:
- description: Quantitative binding (SPR or glycan microarray) of full-length Olfml2a and its N- and
    C-terminal cleavage fragments to chondroitin sulfate E, heparin/heparan sulfate and other glycosaminoglycans.
- description: Characterize retinal and podocyte phenotypes of Olfml2a knockout mice (photoreceptor outer-segment
    structure, interphotoreceptor matrix composition, podocyte process morphology).
