gene_symbol: Olfml2a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Olfml2a (olfactomedin-like protein 2A, photomedin-1) is a secreted, O-glycosylated glycoprotein
  of 681 residues with an N-terminal signal peptide (1-32), cysteine-rich CXCXCX9C motifs, a coiled-coil
  segment, a long low-complexity, Pro-rich linker and a C-terminal olfactomedin (OLF) domain (423-681).
  With its paralog Olfml2b (photomedin-2) it forms a distinct subfamily of the olfactomedin family. The
  protein is secreted as a disulfide-bonded homodimer that is not N-glycosylated but carries O-linked
  glycans, and it is cleaved in the middle of the molecule (near Lys-301) after secretion. Among a panel
  of extracellular matrix components it binds sulfated glycosaminoglycans, preferentially chondroitin
  sulfate E and heparin, and it is deposited in extracellular matrix in tissues. It is expressed in lung,
  eye, testis, uterus and ovary; in the retina it is restricted to the photoreceptor outer-segment layer,
  and it has also been reported in the major processes of kidney podocytes. No catalytic activity, cell-surface
  receptor or signaling pathway has been identified, and its physiological role remains unknown.
