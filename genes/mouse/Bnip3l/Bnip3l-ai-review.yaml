  review:
    summary: Nucleus IBA from PANTHER node PTN001032684.
    action: MARK_AS_OVER_ANNOTATED
    reason: Nix is a tail-anchored mitochondrial outer membrane protein. In the original mouse/human Nix
      characterisation, diffuse cytoplasmic and nuclear signal appeared only after deletion of the transmembrane
      domain, so nucleoplasmic localization is an artefact of the truncated protein rather than a site
      of action. Nuclear-envelope localization (reported for human B5) is captured separately. The broad
      nucleus IBA is an over-annotation for NIX.
    supported_by:
    - &id008
      reference_id: PMID:9867803
      supporting_text: Nix colocalizes with the mitochondrial matrix protein HSP60, and removal of the
        putative transmembrane domain (TM) results in general cytoplasmic and nuclear expression.
    - *id006
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001032684
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Bilateria node; nuclear signal for NIX is seen only for TM-deleted protein (PMID:9867803);
          the defensible location is nuclear envelope, annotated separately.
