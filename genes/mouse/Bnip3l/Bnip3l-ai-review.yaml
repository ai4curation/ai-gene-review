  supported_by:
  - reference_id: PMID:20010802
    supporting_text: Here, we show that the mitochondrial protein Nix is a selective autophagy receptor
      by binding to LC3/GABARAP proteins
  - reference_id: PMID:20010802
    supporting_text: Furthermore, ablation of the Nix:LC3/GABARAP interaction retards mitochondrial clearance
      in maturing murine reticulocytes.
  - reference_id: PMID:18048346
    supporting_text: Here, we show that mitochondrial clearance in reticulocytes requires the BCL2-related
      protein NIX (BNIP3L).
  - reference_id: PMID:18454133
    supporting_text: Although the clearance of ribosomes proceeded normally in the absence of Nix, the
      entry of mitochondria into autophagosomes for clearance was defective.
  - reference_id: PMID:22906961
    supporting_text: These findings support an adaptor model of BNIP3L, centered on the MER.
- description: Through its mitophagy-receptor activity NIX carries out the mitochondrial-clearance step
    of reticulocyte-to-erythrocyte maturation; loss of NIX causes mitochondrial retention, shortened red-cell
    lifespan and anaemia in mice.
