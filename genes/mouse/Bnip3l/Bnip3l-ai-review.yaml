id: Q9Z2F7
gene_symbol: Bnip3l
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Bnip3l (NIX) is a tail-anchored member of the BNIP3/NIP3 family that is inserted into the
  mitochondrial outer membrane through its C-terminal transmembrane helix, with a largely disordered N-terminal
  region facing the cytosol and an atypical BH3-like motif. Its principal physiological function is as
  a selective mitophagy receptor: an LC3-interacting region binds Atg8-family proteins (LC3 and GABARAP
  subfamilies) and a nearby minimal essential region engages further autophagy machinery, so that NIX
  tethers mitochondria to forming autophagosomes. Transmembrane-mediated homodimerization strengthens
  this activity. In mouse, NIX is required for programmed elimination of mitochondria during reticulocyte
  maturation; Nix-null mice retain mitochondria in red cells and develop anaemia with reticulocytosis
  and compensatory erythropoiesis. NIX-dependent programmed mitophagy also accompanies retinal ganglion
  cell differentiation and pro-inflammatory macrophage polarization, and NIX is induced by hypoxia. When
  overexpressed or targeted to the endoplasmic reticulum, NIX can promote apoptotic or permeability-transition-dependent
  cell death (for example in cardiomyocytes), but these death-promoting activities are context-dependent
  and separable from its role in physiological mitochondrial clearance.'
