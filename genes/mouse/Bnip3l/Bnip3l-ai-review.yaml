  review:
    summary: Nix binds the scaffold POSH (SH3RF1) in yeast two-hybrid, co-IP and in vitro binding assays;
      the interaction is linked to JNK/c-Jun activation and death in overexpression models.
    action: REMOVE
    reason: GO:0005515 protein binding is uninformative. The POSH interaction was characterised in overexpression/cell-line
      death assays and is tied to the context-dependent pro-death role of Nix rather than its core mitophagy-receptor
      function; the abstract does not identify the binding domains, so no more specific MF (e.g. SH3 domain
      binding) can be asserted. Removal does not mean the interaction is false.
