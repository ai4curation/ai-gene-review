suggested_questions:
- question: Is the erythroid phenotype of Nix-null mice (reticulocytosis, erythroblast expansion) primarily
    a consequence of failed mitophagy (Sandoval/Schweers model) or of loss of Nix-dependent erythroblast
    apoptosis (Diwan model), and can these be separated with LIR/MER mutants that preserve BH3 function?
- question: Should the PAINT IRD that blocks GO:0000423 mitophagy at the vertebrate BNIP3L clade node
    (PTN002689506) be removed, and should GO:0140580 mitochondrion autophagosome adaptor activity be placed
    at the BNIP3/BNIP3L duplication ancestor rather than only on the BNIP3 clade (PTN002689498)?
- question: Does mouse NIX have a physiological role at the ER (reticulophagy, calcium handling) comparable
    to the GO:0061709 reticulophagy assertion for BNIP3, or is ER-localized NIX relevant only to pathological
    death in cardiomyocytes?
suggested_experiments:
- hypothesis: Both the LIR and MER of NIX are required in vivo for programmed mitochondrial clearance,
    independently of its BH3 motif.
  description: Generate knock-in mice carrying LIR (W36A), MER (central leucine) or BH3 mutations in endogenous
    Bnip3l and quantify mitochondrial retention in reticulocytes (MitoTracker/mt-Keima flow cytometry),
    red-cell lifespan and erythroblast apoptosis.
  experiment_type: knock-in mouse genetics and flow cytometry
- hypothesis: NIX and BNIP3 are partially redundant mitophagy receptors in non-erythroid programmed mitophagy.
  description: Compare single and double Bnip3/Bnip3l knockouts in retinal ganglion cell differentiation
    and M1 macrophage polarization using mito-QC reporters and metabolic (glycolytic switch) readouts.
  experiment_type: genetic redundancy analysis with mitophagy reporters
