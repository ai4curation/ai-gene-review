core_functions:
- description: 'Mitophagy receptor in the mitochondrial outer membrane: NIX binds Atg8-family proteins
    (LC3/GABARAP) through its N-terminal LIR, and engages additional autophagy machinery through its minimal
    essential region, tethering mitochondria to forming autophagosomes for selective mitochondrial clearance;
    required for programmed mitochondrial elimination in maturing reticulocytes and for developmental
    mitophagy in other differentiating cells.'
  molecular_function:
    id: GO:0140580
    label: mitochondrion autophagosome adaptor activity
  directly_involved_in:
