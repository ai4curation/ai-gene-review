- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: located_in
  supporting_entities:
  - RGD:621292
  review:
    summary: Peroxisome transferred from rat Mvd.
    action: REMOVE
    reason: >-
      Synthesis row on a root organelle term (projects/ORGANELLES.md rule 3), so the source was examined.
      Both peroxisome rows are MGI transfers from rat Mvd, resting on a Michihara-lab report that rat
      liver peroxisomal fractions contain a small amount of the 45-kDa MPD form, in the matrix (PMID:11767099).
      The same group then found that the peroxisomal enrichment of MPD was lower than that of the cytosolic
      marker LDH and suggested it was not truly peroxisomal (PMID:12081138), and that rat hepatocyte MPD
      is predominantly cytosolic (PMID:11725955). For the mouse there is direct contrary evidence: B16F10
      MPD is in the cytosol and 'did not exist in the peroxisomes' by fractionation and digitonin permeabilisation
      (PMID:12736493), peroxisome proliferators do not induce it, and UniProt Q99JF5 records the revision
      in a CAUTION. The transfer is an over-propagation of a minor, doubted rat fraction and is contradicted
      for the mouse, so REMOVE.
    supported_by:
    - reference_id: PMID:12736493
      supporting_text: >-
        it indicated that MPD was predominantly located in the cytosol and did not exist in the peroxisomes
        of B16F10 cells
    - reference_id: PMID:12736493
      supporting_text: >-
        In permeabilized B16F10 cells treated with digitonin, which lack cytosolic enzymes, 80% and 20%
        of MPD, 75% and 25% of lactate dehydrogenase, or 2% and 98% of catalase, existed in the medium
        and in the cell, respectively
    - reference_id: PMID:12081138
      supporting_text: >-
        The relative enrichment of 45-kDa MPD in peroxisomes was lower than that of LDH, suggesting the
        possibility that 45-kDa MPD of SHRSP did not exist in the peroxisomes
    - reference_id: file:mouse/Mvd/Mvd-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: 'CAUTION: Was originally thought to be located in the peroxisome (By'
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: RGD:621292
        source_label: Mvd (rat)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Rat IDA rows (PMID:11767099, PMID:12081138) report a minor peroxisomal 45-kDa MPD fraction that
          the authors themselves suggested might be contamination.
    source_defects:
    - defect_type: OTHER
      resource: MGI
      requested_change: DELETE_ROW
      asserted_value: GO:0005777
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        MGI ISO (GO_REF:0000096) transfer of 'peroxisome' from rat Mvd (RGD:621292) to mouse Mvd. Mouse-specific
        direct evidence curated by UniProt (PMID:12736493: fractionation and digitonin permeabilisation
        of B16F10 cells) places MPD in the cytosol and not in peroxisomes, and the rat source papers report
        only a minor peroxisomal fraction that their authors doubted (PMID:12081138). Please suppress
        the orthology transfer for mouse. Depth: abstracts of all four papers.
      supported_by:
      - reference_id: PMID:12736493
        supporting_text: >-
          it indicated that MPD was predominantly located in the cytosol and did not exist in the peroxisomes
          of B16F10 cells
      - reference_id: PMID:12081138
        supporting_text: >-
          The relative enrichment of 45-kDa MPD in peroxisomes was lower than that of LDH, suggesting
          the possibility that 45-kDa MPD of SHRSP did not exist in the peroxisomes
