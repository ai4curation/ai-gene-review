core_functions:
- description: >-
    Diphosphomevalonate decarboxylase: ATP-dependent decarboxylation of (R)-5-diphosphomevalonate to isopentenyl
    diphosphate in the cytosol, the final step of isopentenyl diphosphate synthesis via the mevalonate
    pathway.
  molecular_function:
    id: GO:0004163
    label: diphosphomevalonate decarboxylase activity
  directly_involved_in:
  - id: GO:0019287
    label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11913522
    supporting_text: Kinetic analysis revealed an apparent Km value of 10 microm for mevalonate pyrophosphate
  - reference_id: PMID:11913522
    supporting_text: The enzyme required ATP as a phosphate acceptor and Mg as a divalent cation
  - reference_id: PMID:12736493
    supporting_text: >-
      When the subcellular distribution of MPD in mouse melanoma (B16F10) cells was examined by cell fractionation,
      MPD was detected in the cytosol of B16F10 cells, but not in the peroxisomes
suggested_questions:
- question: >-
    Does the porokeratosis phenotype of epidermal Mvd loss come from accumulation of mevalonate-pathway
    intermediates, from lack of cholesterol, or from defective prenylation?
- question: >-
    Is the mortalin (HSPA9) interaction reported for human MVD seen with endogenous mouse proteins, given
    that mortalin is mainly mitochondrial and MVD is cytosolic?
suggested_experiments:
- hypothesis: >-
    Epidermal lesions after Mvd loss are driven by the accumulation of upstream intermediates rather than
    by cholesterol deficiency.
  description: >-
    In K14-CreERT2 Mvd-floxed mice, compare topical cholesterol, a statin (to block the upstream flux)
    and geranylgeraniol supplementation, with metabolite profiling of mevalonate diphosphate and unprenylated
    Rab levels in epidermis.
  experiment_type: in vivo rescue with metabolite profiling
knowledge_gaps:
- gap_statement: >-
    Which product deficit or intermediate excess links epidermal loss of Mvd to the porokeratosis-like
    lesions is unknown.
  boundary: >-
    Keratinocyte-specific Mvd deletion causes cornoid-lamella lesions with IL-17A and IL-1beta elevation
    and activates lipid-metabolism genes; the enzyme's activity and cytosolic location are established.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    MVD is the commonest gene in Chinese porokeratosis patients, and topical statin/cholesterol therapy
    assumes a mechanism that has not been tested in vivo.
  resolution: Metabolite rescue experiments in the epidermal knockout.
  provenance:
  - reference_id: PMID:39323215
    supporting_text: >-
      The pathogenesis of PK may involve both the accumulation of toxic mevalonate metabolites and potential
      cholesterol insufficiency
