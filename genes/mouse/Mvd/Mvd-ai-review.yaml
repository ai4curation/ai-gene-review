  review:
    summary: Ensembl Compara transfer from human MVD.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The human source is an IMP from 6-fluoromevalonate, a chemical inhibitor of MVD, in leukaemia and
      lymphoma cell lines (PMID:9270019). Blocking the enzyme stops growth, but the authors attribute
      this to a mevalonate metabolite proximal to IPP that accumulates, and cell proliferation in general
      needs mevalonate-pathway products. MVD does no work in regulating proliferation; this is an indirect
      consequence of its metabolic role, transferred electronically to the mouse. Flagged as an over-annotation.
