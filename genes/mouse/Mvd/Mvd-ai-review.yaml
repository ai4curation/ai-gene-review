id: Q99JF5
gene_symbol: Mvd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mvd encodes mouse diphosphomevalonate decarboxylase (mevalonate pyrophosphate decarboxylase, MPD; EC
  4.1.1.33), a GHMP-superfamily enzyme that uses ATP to phosphorylate and decarboxylate (R)-5-diphosphomevalonate,
  releasing isopentenyl diphosphate, CO2, ADP and phosphate. This is the last of the three steps from
  mevalonate to isopentenyl diphosphate, the five-carbon unit for cholesterol, dolichol, ubiquinone and
  protein prenyl groups. The enzyme purified from mouse liver is a homodimer of 46-kDa subunits that requires
  ATP and Mg2+, with a micromolar Km for its substrate; a crystal structure of the mouse protein is available.
  It is abundant in liver and kidney, strongly induced in liver by statins, and located in the cytosol,
  not in peroxisomes. Loss of Mvd from keratinocytes causes porokeratosis-like skin lesions with inflammation,
  mirroring human MVD-associated porokeratosis, and homozygous loss appears incompatible with development.
