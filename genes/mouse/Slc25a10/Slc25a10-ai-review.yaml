      - source_id: PANTHER:PTN000756618
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Eukaryotic DIC node carrying the oxaloacetate-specific IBD; the target mouse carrier evidence supports dicarboxylate exchange without direct oxaloacetate support.
