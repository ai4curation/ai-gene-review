id: Q9QZD8
gene_symbol: Slc25a10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Slc25a10 encodes the mitochondrial dicarboxylate carrier DIC, a six-transmembrane SLC25-family antiporter in the mitochondrial inner membrane. DIC exchanges malate, succinate and other dicarboxylates, plus inorganic sulfur-containing anions, for inorganic phosphate, thereby moving mitochondrial dicarboxylates to support carbon flow in gluconeogenesis, fatty-acid synthesis, urea synthesis and sulfur metabolism.
existing_annotations:
- term:
    id: GO:0005310
    label: dicarboxylic acid transmembrane transporter activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UBX3
  review:
    summary: The exact human ortholog evidence supports DIC as a dicarboxylate/phosphate exchanger rather than just a one-substrate dicarboxylic-acid transporter, so refine this ISO row to the coupled antiporter term.
    action: MODIFY
    reason: Human SLC25A10 and mouse Slc25a10 are orthologous mitochondrial DIC carriers; the donor record and mouse UniProt describe exchange of malate/succinate-class dicarboxylates with phosphate across the inner membrane.
    proposed_replacement_terms:
    - id: GO:0015364
      label: dicarboxylate:phosphate antiporter activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q9UBX3
        source_status: SUPPORTS_TRANSFER
        comment: Exact human SLC25A10/DIC ortholog supports dicarboxylate/phosphate antiport, not merely one-substrate dicarboxylic-acid transport.
    supported_by:
    - reference_id: file:mouse/Slc25a10/Slc25a10-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Catalyzes the electroneutral exchange or flux of physiologically important metabolites such as dicarboxylates
- term:
