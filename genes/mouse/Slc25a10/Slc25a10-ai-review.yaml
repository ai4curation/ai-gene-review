    label: phosphate transmembrane transporter activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: enables
  supporting_entities:
  - RGD:621430
  review:
    summary: Phosphate transport is true but is only one side of the DIC exchange reaction. The rat ortholog evidence is better represented as dicarboxylate:phosphate antiporter activity.
    action: MODIFY
    reason: DIC exchanges dicarboxylates such as malate or succinate against inorganic phosphate; GO:0015364 captures both substrates and the antiport mechanism supported by the rat DIC transfer.
    proposed_replacement_terms:
    - id: GO:0015364
      label: dicarboxylate:phosphate antiporter activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: RGD:621430
        source_status: SUPPORTS_TRANSFER
        comment: Rat DIC supports inorganic phosphate as the counter-substrate in dicarboxylate/phosphate antiport, not as a standalone phosphate channel.
    supported_by:
    - reference_id: PMID:9733776
      supporting_text: Both proteins were expressed in bacteria and reconstituted into phospholipid vesicles where their transport characteristics closely resembled those of whole rat mitochondria and of the rat DIC reconstituted into vesicles.
