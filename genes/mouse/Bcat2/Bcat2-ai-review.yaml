core_functions:
- description: PLP-dependent reversible transamination of L-leucine, L-isoleucine and L-valine with 2-oxoglutarate
    in the mitochondrial matrix, producing glutamate and the branched-chain 2-oxo acids; the first step
    of BCAA catabolism, coupled to BCKDH. Loss of activity is shown directly in mouse mutant tissues;
    substrate-level kinetics come from SF39 orthologs.
  molecular_function:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  directly_involved_in:
  - id: GO:0009083
    label: branched-chain amino acid catabolic process
  - id: GO:0006552
    label: L-leucine catabolic process
  - id: GO:0006550
    label: L-isoleucine catabolic process
  - id: GO:0006574
    label: L-valine catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:14755340
    supporting_text: deficiency in both BCAT-2 protein and its enzyme activity
  - reference_id: PMID:36443523
    supporting_text: Loss of BCAT2 but not BCAT1 leads to accumulation of BCAAs and branched-chain α-keto
      acids (BCKAs)
  - reference_id: PMID:36443523
    supporting_text: we provide evidence for the formation of a mitochondrial BCAA metabolon involving
      BCAT2 and branched-chain α-keto acid dehydrogenase
  - reference_id: PMID:17767905
    supporting_text: we disrupted the BCATm gene, which encodes the enzyme catalyzing the first step in
      peripheral BCAA metabolism
proposed_new_terms: []
suggested_questions:
- question: What fraction of whole-body BCKA reamination in mouse is carried by Bcat2 versus Bcat1 in
    each tissue, and does metabolon formation with BCKDH channel the keto acids?
- question: Is the reported nucleoplasmic signal for the human ortholog relevant to mouse Bcat2, e.g.
    from an unprocessed or alternatively initiated product?
suggested_experiments:
- description: Purify recombinant mature mouse Bcat2 and measure kinetics for Leu, Ile and Val in both
    transamination directions, with PLP occupancy and dimer state.
  hypothesis: Mouse Bcat2 has the same substrate specificity and kinetic parameters as rat and human BCAT2,
    so ortholog-derived specificity terms are valid for mouse.
  experiment_type: enzyme kinetics
