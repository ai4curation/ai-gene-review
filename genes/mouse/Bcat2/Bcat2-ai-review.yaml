- term:
    id: GO:0006550
    label: L-isoleucine catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0030482
  - MGI:MGI:104861
  - MGI:MGI:1276534
  - PANTHER:PTN000214535
  - RGD:68948
  - WB:WBGene00001149
  review:
    summary: Bcat2 participates in L-isoleucine catabolic process by catalysing its first, reversible
      transamination step in mitochondria.
    action: ACCEPT
    reason: Bcat2 catalyses the first, transamination step of BCAA catabolism, so it performs part of
      the process (it is not merely required for it). Loss of Bcat2 in mice (ENU splice mutant, targeted
      knockout) raises plasma and tissue BCAAs and BCKAs and blocks reamination flux, establishing the
      role in vivo in this species. Mouse Bcat2 (O35855) is in PANTHER subfamily PTHR11825:SF39 (mitochondrial
      BCAT) together with human BCAT2 (O15382) and rat Bcat2; the cytosolic paralog BCAT1 is in a separate
      subfamily (SF70), so transfer is restricted to SF39 orthologs.
    supported_by:
    - &id007
      reference_id: PMID:17767905
      supporting_text: we disrupted the BCATm gene, which encodes the enzyme catalyzing the first step
        in peripheral BCAA metabolism
    - *id006
    - &id008
      reference_id: PMID:36443523
      supporting_text: Loss of BCAT2 but not BCAT1 leads to accumulation of BCAAs and branched-chain α-keto
        acids (BCKAs)
    - &id009
