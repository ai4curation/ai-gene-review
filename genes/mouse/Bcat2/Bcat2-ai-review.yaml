- term:
    id: GO:0097009
    label: energy homeostasis
  evidence_type: IMP
  original_reference_id: PMID:17767905
  qualifier: involved_in
  review:
    summary: Increased energy expenditure in BCATm knockout mice.
    action: MARK_AS_OVER_ANNOTATED
    reason: The knockout has increased energy expenditure attributed to a futile protein turnover cycle;
      this is an organismal consequence of disrupted BCAA catabolism, not participation of the enzyme
      in an energy-homeostasis mechanism.
    supported_by:
    - reference_id: PMID:17767905
      supporting_text: The increased energy expenditure did not seem to be due to altered locomotor activity,
        uncoupling proteins, sympathetic activity, or thyroid hormones
    - *id010
- term:
    id: GO:1990830
    label: cellular response to leukemia inhibitory factor
  evidence_type: IEP
  original_reference_id: PMID:20439489
  qualifier: acts_upstream_of_or_within
  review:
    summary: Expression change of Bcat2 in ES cells upon LIF withdrawal (transcriptome comparison).
    action: MARK_AS_OVER_ANNOTATED
    reason: IEP from a genome-wide comparison of undifferentiated vs differentiating ES cells. A transcript-level
      change during differentiation does not show that Bcat2 performs any part of a response to LIF; no
      functional role in LIF signalling has been reported.
    supported_by:
    - reference_id: PMID:20439489
      supporting_text: We performed a systematic comparison of miRNA expression in undifferentiated vs.
        differentiating ESCs.
