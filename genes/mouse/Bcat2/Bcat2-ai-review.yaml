- term:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  evidence_type: IDA
  original_reference_id: PMID:14755340
  qualifier: enables
  review:
    summary: Mouse Bcat2 has branched-chain-amino-acid:2-oxoglutarate transaminase activity, the core
      catalytic activity of the mitochondrial branched-chain aminotransferase.
    action: ACCEPT
    reason: 'Experimentally established in mouse: the ENU Bcat2 splice-site mutant lacks BCAT-2 protein
      and BCAT enzyme activity and accumulates all three BCAAs, and Bcat2-/- tissues show the reduced
      glutamate/2-oxoglutarate ratio expected from loss of BCAA:2-oxoglutarate transamination. Direct
      kinetic characterisation of purified mouse protein has not been reported; substrate specificity
      for Leu, Ile and Val rests on the loss-of-function data plus orthology to rat and human BCAT2 (same
      SF39 subfamily, PAINT node PTN000214535). Mouse Bcat2 (O35855) is in PANTHER subfamily PTHR11825:SF39
      (mitochondrial BCAT) together with human BCAT2 (O15382) and rat Bcat2; the cytosolic paralog BCAT1
      is in a separate subfamily (SF70), so transfer is restricted to SF39 orthologs.'
    supported_by: &id002
    - *id001
    - &id006
      reference_id: PMID:14755340
      supporting_text: We identified mice with marked elevation of blood branched-chain amino acids (BCAAs),
        ketoaciduria
    - reference_id: PMID:36443523
      supporting_text: Bcat2−/− mice had significant decreases in the glutamate/α-KG ratios in heart,
        kidney, liver and spleen, consistent with the loss of BCAT2 activity
    - reference_id: PMID:9165094
      supporting_text: When rat BCAT(m) is overexpressed in COS-1 cells, the protein exhibits BCAT activity
