  review:
    summary: Nucleoplasm location transferred from human BCAT2 by orthology.
    action: MARK_AS_OVER_ANNOTATED
    reason: Mouse Bcat2 carries an N-terminal mitochondrial transit peptide, is found in mitochondria
      in mouse fractionation and organelle proteomics, and acts with BCKDH in the mitochondrial matrix.
      No mouse evidence places it in the nucleoplasm; the human source is a single-location observation
      not reflected in the PAINT mitochondrion node (PTN000214536). The nucleoplasm location should not
      be transferred as a property of the mouse protein.
