    label: L-valine:2-oxoglutarate transaminase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: enables
  supporting_entities:
  - UniProtKB:O15382
  review:
    summary: Mouse Bcat2 has L-valine:2-oxoglutarate transaminase activity, the core catalytic activity
      of the mitochondrial branched-chain aminotransferase.
    action: ACCEPT
    reason: 'Experimentally established in mouse: the ENU Bcat2 splice-site mutant lacks BCAT-2 protein
      and BCAT enzyme activity and accumulates all three BCAAs, and Bcat2-/- tissues show the reduced
      glutamate/2-oxoglutarate ratio expected from loss of BCAA:2-oxoglutarate transamination. Direct
      kinetic characterisation of purified mouse protein has not been reported; substrate specificity
      for Leu, Ile and Val rests on the loss-of-function data plus orthology to rat and human BCAT2 (same
      SF39 subfamily, PAINT node PTN000214535). Mouse Bcat2 (O35855) is in PANTHER subfamily PTHR11825:SF39
      (mitochondrial BCAT) together with human BCAT2 (O15382) and rat Bcat2; the cytosolic paralog BCAT1
      is in a separate subfamily (SF70), so transfer is restricted to SF39 orthologs.'
    supported_by: *id002
