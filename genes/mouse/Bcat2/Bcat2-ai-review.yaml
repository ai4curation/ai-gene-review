- term:
    id: GO:0009098
    label: L-leucine biosynthetic process
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: involved_in
  supporting_entities:
  - RGD:68948
  review:
    summary: Leucine biosynthetic process transferred from rat Bcat2.
    action: MARK_AS_OVER_ANNOTATED
    reason: The transamination is reversible, and BCKA reamination by BCAT2 is measurable in mouse tissues
      ([13C]-KIV to labelled valine is reduced in Bcat2-/- tissues). However, leucine is an essential
      amino acid in mammals; reamination only salvages pre-existing carbon skeletons and is not a leucine
      biosynthetic pathway. The reversible reaction is fully captured by the accepted transaminase activity
      terms.
    supported_by:
    - reference_id: PMID:36443523
      supporting_text: Compared to WT tissues, Bcat2−/− had significantly reduced levels of Val_M+5 in
        most tissues, consistent with BCAT2 loss and no or minimal BCAT1 expression in these tissues
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: RGD:68948
        source_status: UNRESOLVED
        comment: Rat Bcat2 donor annotation not inspected in detail; whatever its basis, reamination of
          keto acids in mammals salvages carbon skeletons and is not de novo leucine biosynthesis, so
          the term is mis-scoped for both rodents.
- term:
    id: GO:0010817
    label: regulation of hormone levels
  evidence_type: IMP
  original_reference_id: PMID:17767905
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:3772355
  review:
    summary: Whole-body hormone level changes (insulin sensitivity) in BCATm knockout mice.
    action: MARK_AS_OVER_ANNOTATED
    reason: The knockout shows improved glucose and insulin tolerance, a systemic consequence of elevated
      BCAAs/loss of peripheral BCAA catabolism. Bcat2 is a metabolic enzyme and does no part of hormone
      regulation itself; the phenotype is downstream and organismal.
    supported_by:
    - reference_id: PMID:17767905
      supporting_text: remarkable improvements in glucose and insulin tolerance
    - &id010
      reference_id: PMID:17767905
      supporting_text: BCATm(-/-) mice exhibited elevated plasma BCAAs and decreased adiposity and body
        weight
- term:
    id: GO:0050873
    label: brown fat cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:35075301
  qualifier: acts_upstream_of_negative_effect
  review:
    summary: Adipose Bcat2 deletion increases browning of inguinal WAT.
    action: KEEP_AS_NON_CORE
    reason: 'Experimental in mouse (adipose-specific knockout). The acts_upstream_of_negative_effect qualifier
      is appropriate: Bcat2 supplies BCKAs whose acetyl-CoA is used to acetylate PRDM16, so its metabolic
      activity lies upstream of, rather than within, the differentiation program. Note the cells involved
      are inguinal WAT (beige) adipocytes.'
    supported_by:
    - reference_id: PMID:35075301
      supporting_text: mice with adipose tissue knockout of Bcat2, which converts BCAAs to branched-chain
        keto acids (BCKAs), are resistant to high-fat diet-induced obesity due to increased inguinal WAT
        browning and thermogenesis
    - reference_id: PMID:35075301
      supporting_text: acetyl-CoA derived from BCKA suppresses WAT browning by acetylation of PR domain-containing
        protein 16 (PRDM16) at K915
- term:
    id: GO:0052654
    label: L-leucine:2-oxoglutarate transaminase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0030482
  - PANTHER:PTN000214535
  - PomBase:SPBC428.02c
  - RGD:2195
  - RGD:68948
  - UniProtKB:O15382
  review:
    summary: Mouse Bcat2 has L-leucine:2-oxoglutarate transaminase activity, the core catalytic activity
      of the mitochondrial branched-chain aminotransferase.
    action: ACCEPT
    reason: 'Experimentally established in mouse: the ENU Bcat2 splice-site mutant lacks BCAT-2 protein
      and BCAT enzyme activity and accumulates all three BCAAs, and Bcat2-/- tissues show the reduced
      glutamate/2-oxoglutarate ratio expected from loss of BCAA:2-oxoglutarate transamination. Direct
      kinetic characterisation of purified mouse protein has not been reported; substrate specificity
      for Leu, Ile and Val rests on the loss-of-function data plus orthology to rat and human BCAT2 (same
      SF39 subfamily, PAINT node PTN000214535). Mouse Bcat2 (O35855) is in PANTHER subfamily PTHR11825:SF39
      (mitochondrial BCAT) together with human BCAT2 (O15382) and rat Bcat2; the cytosolic paralog BCAT1
      is in a separate subfamily (SF70), so transfer is restricted to SF39 orthologs.'
    supported_by: *id002
