id: O35855
gene_symbol: Bcat2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Bcat2 encodes the mitochondrial branched-chain amino acid aminotransferase (BCATm), a pyridoxal
  5'-phosphate-dependent class-IV aminotransferase (EC 2.6.1.42). After import into the mitochondrial
  matrix via an N-terminal transit peptide, it reversibly transfers the amino group of leucine, isoleucine
  or valine to 2-oxoglutarate, forming glutamate and the corresponding branched-chain 2-oxo acids. This
  is the first step of BCAA catabolism and feeds the branched-chain 2-oxo acid dehydrogenase complex,
  with which Bcat2 associates in a mitochondrial metabolon. Bcat2 is expressed in most peripheral tissues,
  with skeletal muscle a major site, but is largely absent from hepatocytes. Bcat2-deficient mice accumulate
  BCAAs and branched-chain keto acids in plasma and tissues and develop a maple syrup urine disease-like
  illness that responds to dietary BCAA restriction. Downstream consequences of its loss include increased
  energy expenditure, improved insulin sensitivity, exercise intolerance and, after adipose-specific deletion,
  increased browning of white fat.
