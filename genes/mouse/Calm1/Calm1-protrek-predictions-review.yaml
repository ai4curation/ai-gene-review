id: P0DP26
gene_symbol: Calm1
taxon:
  id: NCBITaxon:10090
  label: Mus musculus (Mouse)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for mouse calmodulin. Three of the five calls are exact GOA matches,
  including detection of calcium ion - one of this review's core processes - and two specific effector
  interactions. Rank 1 is obsolete. Calmodulin is an unusually hard case for a per-protein annotation
  because it regulates over a hundred targets, and the model responds by naming individual effectors
  rather than the calcium-sensor role; the calcium ion binding that is the first core function does
  not appear in the top five. Assessment: 1 correct novel (COR), 1 correct not novel (CNN), 1 uncertain
  (UNC).
