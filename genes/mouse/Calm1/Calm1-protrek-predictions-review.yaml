  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 3 (score 15.41) and absent from GOA, a strict descendant of the annotated protein-containing
      complex. The DAPK1-calmodulin complex is a real and structurally characterised interaction in
      which CaM relieves DAPK1 autoinhibition. Correct, specific and novel - though it is one of very
      many CaM effector complexes, so naming this particular one is more a sampling of the target
      list than an insight. Rank 4 supplies the annotated detection of calcium ion and rank 5 the
      annotated NOS binding.
    supported_by:
    - reference_id: file:mouse/Calm1/Calm1-uniprot.txt
