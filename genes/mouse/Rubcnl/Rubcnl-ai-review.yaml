id: Q3TD16
gene_symbol: Rubcnl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Rubcnl encodes Pacer (Protein associated with UVRAG as autophagy enhancer; Rubicon-like),
  a vertebrate-specific member of the Rubicon homology (RH) domain family that positively regulates late
  autophagy. Pacer is a peripheral membrane protein recruited to STX17-positive autophagosomes, where
  it antagonizes the negative regulator Rubicon, binds UVRAG directly, stimulates class III PI3K (Vps34)
  activity and PtdIns(3)P production, and recruits the PI3KC3 and HOPS tethering complexes to promote
  autophagosome maturation and fusion with late endosomes and lysosomes. It binds phosphoinositides, notably
  PtdIns(3)P. Its activity is switched off by mTORC1 phosphorylation under nutrient-rich conditions and
  enhanced by GSK3-TIP60 acetylation under starvation. In mice, hepatocyte-specific loss of Pacer impairs
  autophagy flux and causes glycogen and lipid accumulation and liver fibrosis; its C-terminal RH domain
  also binds phospho-RAB7A and supports Parkin-dependent mitophagy.
