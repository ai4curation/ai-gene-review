  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9H714
  review:
    summary: Binding to this monophosphoinositide was reported in vitro for human PACER alongside PtdIns(3)P;
      it is plausible but has no demonstrated functional role. (Transferred from human RUBCNL Q9H714.)
    action: KEEP_AS_NON_CORE
    reason: The specificity panel for human PACER included PtdIns(3)P, PtdIns(4)P and PtdIns(5)P (by similarity
      for mouse). Only PtdIns(3)P has a clear functional context (PI3KC3-generated lipid on maturing autophagosomes);
      PtdIns(4)P/PtdIns(5)P binding likely reflects the breadth of an in vitro lipid-binding assay. Retain
      as non-core rather than remove, since the underlying experimental annotation exists for the human
      ortholog.
