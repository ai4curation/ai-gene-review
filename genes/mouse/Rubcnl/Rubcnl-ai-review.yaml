core_functions:
- description: 'Pacer acts as an STX17-anchored adaptor on late autophagosomes: it binds UVRAG directly,
    antagonizes Rubicon, and recruits the UVRAG-containing class III PI3K complex and the HOPS tethering
    complex to STX17-positive autophagosomes, promoting PtdIns(3)P production, autophagosome maturation
    and fusion with late endosomes/lysosomes.'
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
