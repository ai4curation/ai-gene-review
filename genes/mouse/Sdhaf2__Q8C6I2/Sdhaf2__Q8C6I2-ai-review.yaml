    summary: >-
      Automated mouse-human orthology transfer of a nucleolar localization for human SDHAF2.
      The current human GOA set no longer carries a nucleolus annotation; the human review
      records only mitochondrial and matrix locations. Sdhaf2 has a mitochondrial transit
      peptide and works on SDHA inside the matrix. No mouse or family evidence supports a
