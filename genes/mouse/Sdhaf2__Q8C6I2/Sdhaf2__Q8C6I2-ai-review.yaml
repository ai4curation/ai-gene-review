    label: protein dephosphorylation
  evidence_type: IMP
  original_reference_id: PMID:23983127
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      MGI IMP (acts_upstream_of_or_within) from the lung-cancer study. In that study, the
      Sdhaf2-GSK-3beta interaction was associated with loss of the inhibitory phosphate on
      GSK-3beta Ser-9. Sdhaf2 has no phosphatase domain and the phosphatase involved was not
      identified. The effect on GSK-3beta phosphorylation is indirect and context-dependent.
      The cached full text is partial (results and figures are missing), so we cannot see
      which experiment in mouse tissue the curator used.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept, deferring to the MGI curator who read the full paper. The acts_upstream_of_or_within
      qualifier already records that the role is indirect. This is peripheral to the
      mitochondrial assembly-factor function, and the mechanism linking a matrix protein to
      cytosolic GSK-3beta is unresolved.
    supported_by:
    - reference_id: PMID:23983127
      supporting_text: >-
        The physical interaction between SDH5 and GSK-3β facilitates GSK-3β activation through
        Ser-9 dephosphorylation
