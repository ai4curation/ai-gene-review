- id: PMID:23983127
  title: Succinate dehydrogenase 5 (SDH5) regulates glycogen synthase kinase 3β-β-catenin-mediated 
    lung cancer metastasis.
  findings:
  - statement: >-
      SDH5 (Sdhaf2) knockout mice show more mesenchymal markers in lung epithelium. In lung
      cancer cells, loss of SDH5 promotes EMT and metastasis, which the authors attribute to an
      SDH5-GSK-3beta interaction that promotes GSK-3beta Ser-9 dephosphorylation and limits
      nuclear beta-catenin.
    supporting_text: >-
      In SDH5 knock-out mice, lung epithelial cells exhibited elevated mesenchymal markers,
      which is characteristic of EMT.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Source of the MGI IMP rows. The cache holds the abstract, introduction and discussion;
      the results and figure legends are missing. The only mouse-specific statement visible is
      the knockout lung EMT-marker phenotype. The signalling mechanism comes mostly from human
      cell lines. The role is context-dependent and not the core function.
- id: PMID:19628817
  title: SDH5, a gene required for flavination of succinate dehydrogenase, is mutated in 
    paraganglioma.
  findings:
  - statement: >-
      Yeast and human Sdh5/SDHAF2 bind the SDH catalytic subunit and are required for
      flavination of SDHA/Sdh1 and for SDH-dependent respiration. Basis of the human
      flavinylation and matrix annotations transferred to mouse.
    supporting_text: >-
      Sdh5 is required for SDH-dependent respiration and for Sdh1 flavination (incorporation
      of the flavin adenine dinucleotide cofactor)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. Founding study for the family function; ortholog evidence (yeast,
      human), not a mouse experiment.
- id: PMID:32887801
  title: The roles of SDHAF2 and dicarboxylate in covalent flavinylation of SDHA, the human complex 
    II flavoprotein.
  findings:
  - statement: >-
      The human SDHA-SDHAF2 crystal structure shows that SDHAF2 and a dicarboxylate together
      orient the SDHA flavin and capping domains to allow covalent FAD attachment. SDHAF2 acts
      as a non-catalytic chaperone.
    supporting_text: >-
      works in synergy with SDHAF2 to properly orient the flavin and capping domains of
      SDHA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. Human SF2 ortholog; the mechanistic basis for the inferred mouse
      MF.
- id: PMID:38569044
  title: Drp1 controls complex II assembly and skeletal muscle metabolism by Sdhaf2 action on 
    mitochondria.
  findings:
  - statement: >-
      In mouse skeletal muscle and C2C12 myocytes, Drp1 interacts with Sdhaf2 and promotes its
      mitochondrial translocation. Drp1 deficiency lowers mitochondrial (not total) Sdhaf2 and
      selectively reduces complex II assembly and activity. Sdhaf2 overexpression restores
      succinate-dependent respiratory control, fatty-acid oxidation and insulin action in
      Drp1-knockdown myocytes.
    supporting_text: >-
      Muscle Drp1-KD reduced complex II assembly and activity as a
      consequence of diminished mitochondrial translocation of succinate dehydrogenase
      assembly factor 2 (Sdhaf2).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. This is the main mouse-specific functional evidence for Sdhaf2 in
      complex II assembly. The primary perturbation was Drp1; the Sdhaf2 gain-of-function
      rescue was done in cultured murine myocytes. The Drp1-Sdhaf2 binding assay used
      recombinant human proteins, while the proximity ligation was done in mouse C2C12 cells.
