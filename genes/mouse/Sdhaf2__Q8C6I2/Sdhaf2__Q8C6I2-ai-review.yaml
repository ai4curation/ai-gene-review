suggested_questions:
- question: >-
    Does the cytosolic pool of Sdhaf2 seen in mouse myotubes have a function, or is it only
    precursor waiting for import? Is the reported Drp1-Sdhaf2 interaction direct on the outer
    membrane, given that Sdhaf2 has a canonical matrix-targeting presequence?
- question: >-
    Does the EMT/Wnt phenotype of Sdhaf2-knockout mouse lung follow from loss of complex II and
    succinate accumulation (as in other SDHx-deficient tissues), or from a separate
    Sdhaf2-GSK-3beta interaction?
- question: >-
    Is the SDH-independent complex IV assembly role reported for human SDHAF2 conserved in
    mouse tissues?
suggested_experiments:
- description: >-
    Measure covalent SDHA flavinylation (FAD fluorescence of SDHA on SDS-PAGE) and complex II
    assembly by BN-PAGE in tissues from a conditional Sdhaf2-knockout mouse. This would test
    directly, in mouse, the flavinylation role currently inferred from orthologs.
  experiment_type: genetic perturbation with biochemical readout
- description: >-
    Compare wild-type and SDHA-binding-deficient Sdhaf2 (the residue equivalent to human G78R)
    for their ability to rescue lung EMT markers in Sdhaf2-null cells. This would separate
    complex II-dependent effects from the reported GSK-3beta signalling role.
  experiment_type: separation-of-function rescue
