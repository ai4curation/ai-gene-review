core_functions:
- description: >-
    Non-catalytic chaperone and assembly factor for succinate dehydrogenase (respiratory complex
    II). It binds the flavoprotein subunit SDHA in the mitochondrial matrix and, with a
    dicarboxylate, orients the SDHA flavin and capping domains so that FAD can be covalently
    attached. Flavinylated SDHA is required for complex II to assemble into an active enzyme.
    For mouse, the chaperone mechanism and flavinylation are inferred from the PTHR12469:SF2
    subfamily (human SDHAF2 structure, yeast Sdh5 genetics). Mouse muscle and myocyte data
    support the complex II assembly role directly: mitochondrial Sdhaf2 levels track complex II
    assembly, and Sdhaf2 restores succinate-linked respiration.
  molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  directly_involved_in:
  - id: GO:0018293
    label: protein-FAD linkage
  - id: GO:0034553
    label: mitochondrial respiratory chain complex II assembly
