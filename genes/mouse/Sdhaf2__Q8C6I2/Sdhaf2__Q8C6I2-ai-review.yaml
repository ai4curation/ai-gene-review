id: Q8C6I2
gene_symbol: Sdhaf2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Sdhaf2 (also called Sdh5 or Pgl2) encodes succinate dehydrogenase assembly factor 2, a
  small nuclear-encoded protein of the mitochondrial matrix. Isoform 1 (Q8C6I2-1) has 164
  residues with a predicted N-terminal mitochondrial transit peptide (residues 1-27) and a
  single Sdh5/SdhE domain (Pfam PF03937). It belongs to the SDHAF2/Sdh5/SdhE family
  (PANTHER PTHR12469:SF2), shared with human SDHAF2, yeast Sdh5 and bacterial SdhE. Members of
  this family are assembly factors for succinate dehydrogenase (respiratory complex II). They
  bind the flavoprotein subunit SDHA and, together with a dicarboxylate, position the flavin
  and capping domains of SDHA so that FAD can be covalently attached (flavinylation), a step
  needed for a catalytically competent complex II. Sdhaf2 is not a subunit of the mature
  enzyme and has no catalytic activity of its own. The flavinylation mechanism has been shown
  for the human, yeast and bacterial orthologs, not for the mouse protein. Mouse evidence
  places Sdhaf2 in mitochondria, with a cytosolic pre-import pool in myotubes. In mouse
  skeletal muscle and C2C12 myocytes, the mitochondrial fission GTPase Drp1 interacts with
  Sdhaf2 and promotes its mitochondrial translocation. Loss of Drp1 lowers mitochondrial
  Sdhaf2 and selectively reduces complex II assembly, and overexpressing Sdhaf2 restores
  succinate-dependent respiration in Drp1-deficient myocytes. One study of Sdhaf2-knockout
  mice and lung cancer cells linked loss of the protein to epithelial-mesenchymal transition
  through GSK-3beta/beta-catenin signalling. This is a context-dependent role, separate from
  complex II maturation.
