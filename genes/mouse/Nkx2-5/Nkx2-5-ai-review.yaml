id: P42582
gene_symbol: Nkx2-5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Nkx2-5 (Csx) is an NK-2 class homeodomain transcription factor, the vertebrate ortholog of
  Drosophila tinman, and a central regulator of heart development. It binds NK2 elements in RNA polymerase
  II promoters and enhancers as a monomer or homodimer and activates cardiac genes such as Nppa, cardiac
  alpha-actin, myocardin, Mef2c and Id2 in combination with partner transcription factors (GATA4, TBX5,
  TBX20, SRF, MEF2C, HAND2, FOXH1) and coactivators; it also represses targets in a context-dependent
  manner, for example Nppa in the atrioventricular canal with TBX2, the pacemaker genes Hcn4 and Tbx3
  at the atrial/sinoatrial border, and Bmp2/Smad1 signalling in second heart field progenitors. Loss of
  Nkx2-5 in mice arrests heart looping at the linear tube stage with loss of ventricular markers such
  as Mlc2v and embryonic death around E9.5-10. Nkx2-5 controls cardiomyocyte differentiation and proliferation,
  ventricle formation, trabeculation, outflow tract development through the second heart field, and dose-dependent
  development and postnatal maintenance of the cardiac conduction system (atrioventricular node, His-Purkinje
  system). Outside the heart it is required for spleen development (with Pbx1, repressing p15Ink4b) and
  contributes to pharyngeal endoderm and thyroid bud development. Human NKX2-5 mutations cause congenital
  heart disease with atrioventricular conduction block and, rarely, asplenia.
