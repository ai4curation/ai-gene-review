suggested_questions:
- question: Which Nkx2-5 target genes are directly repressed versus activated in vivo, and does repression
    require specific corepressors (HIPK, Groucho/TLE, Jarid2) or partner TFs such as Tbx2/Tbx3?
- question: Is the Nkx2-5 requirement in the postnatal conduction system (Scn5a, Ryr2, Cx40 regulation)
    mechanistically distinct from its embryonic role in conduction lineage specification?
- question: Should 'adult heart development' annotations based on embryonic-lethal null phenotypes be
    revised to 'heart development'?
suggested_experiments:
- description: CUT&RUN/ChIP-seq for endogenous Nkx2-5 in SHF progenitors, ventricular myocardium and conduction
    cells, combined with acute degron depletion and nascent transcription (PRO-seq) to separate direct
    activation from repression targets.
  hypothesis: Nkx2-5 directly represses Bmp2/Isl1/Hcn4 and activates Nppa/Scn5a/Id2 through distinct enhancer
    classes and partner TFs.
  experiment_type: genome-wide binding with acute depletion
- description: Conditional Nkx2-5 deletion in Tlx1-lineage splenic mesenchyme (bypassing cardiac lethality)
    with lineage tracing and p15Ink4b compound deletion.
  hypothesis: Nkx2-5 is cell-autonomously required in splenic mesenchymal progenitors for proliferation
    via p15Ink4b repression.
  experiment_type: conditional mouse genetics
