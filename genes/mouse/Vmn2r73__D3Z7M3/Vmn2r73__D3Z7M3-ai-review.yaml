  review:
    summary: >-
      A receptor with GPCR activity initiates GPCR signaling, so this process follows directly from the
      accepted molecular function and is the receptor's own step, not a downstream consequence. In basal
      vomeronasal neurons the pathway runs through Galpha-o, phospholipase C and TRPC2, but none of
      these links has been tested for Vmn2r73. More specific processes, such as detection of a pheromone
      or sensory perception of smell, would require knowing what the receptor detects and are not
      proposed.
    action: ACCEPT
    reason: >-
      Consistent with the accepted GPCR activity of a full-length class C receptor. The more specific
      chemosensory processes are ligand-dependent and unproven for this orphan receptor.
