- id: PMID:30675062
  title: Structural insights into the activation of metabotropic glutamate receptors.
  findings:
  - statement: In class C receptors the extracellular Venus-flytrap domain holds the orthosteric ligand
      site and the 7TM domain couples to G proteins. The study is on mGlu5, a different PTHR24061
      subfamily; it is used only for the shared domain architecture.
    supporting_text: Family C receptors are unusual in that, besides the GPCR-defining 7TM domain, they
      possess relatively large amino-terminal extracellular domains (ECDs) that form obligate dimers and
      contain the orthosteric ligand binding sites
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Class C architecture only; no mGlu-specific ligand or G-protein
      specificity is transferred to Vmn2r73.
