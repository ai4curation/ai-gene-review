knowledge_gaps:
- gap_statement: The ligand of Vmn2r73 is unknown; it is an orphan receptor, and no response of
    Vmn2r73-expressing neurons to any cue has been recorded.
  boundary: Membership of the V2R clade and an intact class C receptor architecture are established by
    sequence; nothing about its ligand is.
  gap_kind:
  - BIOLOGY
- gap_statement: Whether and where Vmn2r73 is expressed in the vomeronasal epithelium, and which family-C
    V2R (Vmn2r1 or Vmn2r2-7) it is co-expressed with, has not been determined.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: Which chemical cue activates Vmn2r73, and is it a peptide or protein signal like those
    detected by characterised V2Rs?
- question: Is Vmn2r73 a C1-type or C2-type V2R, that is, is it co-expressed with Vmn2r1 or with
    Vmn2r2-Vmn2r7 in basal vomeronasal neurons?
- question: Do the subfamily SF413 receptors share a ligand class, and has any member of SF413 been
    deorphanised?
suggested_experiments:
- description: Identify Vmn2r73-expressing neurons in mouse vomeronasal single-cell data or by RNAscope,
    determine the co-expressed family-C V2R and H2-Mv genes, and record calcium responses of these
    neurons to panels of urine, tear and gland-secreted peptide and protein fractions.
- description: Generate a Vmn2r73 reporter or knockout allele to test whether loss of the receptor
    abolishes responses to any candidate cue identified above, and to trace the axonal projection of
    Vmn2r73 neurons to the accessory olfactory bulb.
