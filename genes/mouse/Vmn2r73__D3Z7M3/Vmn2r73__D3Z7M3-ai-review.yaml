    summary: >-
      The PAINT node PTN002373557 spans the calcium-sensing receptor, GPRC6A and the V2R receptors. Its
      donors are mouse Casr and Gprc6a, human CASR, and eight mouse V2Rs (Vmn2r1, Vmn2r26, Vmn2r65,
      Vmn2r81, Vmn2r82, Vmn2r83, Vmn2r116, Vmn2r120) with experimental (IMP or IGI) annotations to
      descendants of this term, such as G protein-coupled olfactory receptor activity and, for Vmn2r116
      (V2Rp5), pheromone receptor activity. D3Z7M3 descends from that node, and it retains every
      structural element the activity needs: signal peptide, Venus-flytrap domain, nine-cysteine domain
      and seven Phobius-predicted transmembrane helices. None of the donors is in subfamily SF413, and
      the curator propagated only the general GPCR activity, not the olfactory or pheromone receptor
      descendants. That restriction is appropriate, because those descendant terms depend on the
      ligand, which is unknown for Vmn2r73. The term is accepted as the core molecular function, as an
      inference from phylogeny rather than an experimental finding for this gene.
    action: ACCEPT
    reason: >-
      Sound phylogenetic inference: the target lies inside a clade with experimentally characterised
      receptor members and has the intact class C receptor architecture. No Vmn2r73-specific experiment
      exists, so this remains inferred, not experimentally established.
