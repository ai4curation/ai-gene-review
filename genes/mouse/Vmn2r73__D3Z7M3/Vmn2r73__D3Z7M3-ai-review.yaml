id: D3Z7M3
gene_symbol: Vmn2r73
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Vmn2r73 encodes a mouse vomeronasal type-2 receptor (V2R), a member of the class C G protein-coupled
  receptor family that also contains the calcium-sensing receptor, GPRC6A, the sweet and umami taste
  receptors and the metabotropic glutamate receptors (PANTHER PTHR24061, subfamily SF413,
  "vomeronasal 2, receptor 66-related"). This entry, D3Z7M3, is the 851-residue product of the
  Ensembl-canonical transcript. It has the complete class C architecture: an N-terminal signal peptide,
  a large extracellular Venus-flytrap ligand-binding domain, a cysteine-rich nine-cysteine domain and a
  seven-transmembrane domain that in class C receptors couples to heterotrimeric G proteins. By family
  membership it is predicted to be a cell-surface chemosensory receptor of basal, Galpha-o-expressing
  vomeronasal sensory neurons, where V2Rs detect peptide and protein chemical cues and signal through a
  phospholipase C and TRPC2-dependent pathway. No experiment has examined Vmn2r73 itself: its ligand,
  expression pattern, co-expressed family-C V2R partner, G-protein coupling and organismal role are all
  unknown, and it is an orphan receptor. A second gene model of the same locus (A0A3B2WCZ5) skips part of
  the extracellular region and lacks the transmembrane domain.
