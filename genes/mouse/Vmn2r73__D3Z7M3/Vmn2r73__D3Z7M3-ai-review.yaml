core_functions:
- description: >-
    Predicted orphan class C chemosensory G protein-coupled receptor of the vomeronasal organ, expected
    to bind an unidentified extracellular chemical cue with its Venus-flytrap domain and to activate
    heterotrimeric G-protein signaling at the plasma membrane of vomeronasal sensory neurons. Inferred
    from phylogeny and domain architecture; not experimentally established for Vmn2r73.
  molecular_function:
    id: GO:0004930
    label: G protein-coupled receptor activity
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  locations:
