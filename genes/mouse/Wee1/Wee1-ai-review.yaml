id: P47810
gene_symbol: Wee1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Wee1 (Wee1A) is a nuclear, non-receptor protein tyrosine kinase of the WEE1 subfamily that inhibits
  cyclin-dependent kinases by phosphorylating the inhibitory Tyr15 residue, most notably CDK1 in complex with cyclin
  B1, and also CDK2. By holding CDK1 inactive during S and G2 it prevents premature entry into mitosis and enforces
  the DNA-damage G2/M checkpoint. In the mouse, Wee1 is essential for pre-implantation development: knockout embryos
  die before E3.5 with a defective G2/M checkpoint, and acute deletion in embryonic fibroblasts abolishes CDK1 Tyr15
  phosphorylation, causing premature mitosis, aneuploidy and DNA damage. Its activity is switched off at M phase
  by phosphorylation of its long N-terminal regulatory domain. Wee1 binds 14-3-3 zeta through its C-terminal half.
  In postmitotic cortical neurons it is phosphorylated by the Sad kinases (Brsk1/Brsk2) and must be downregulated
  for axon-dendrite polarity to form. Wee1 is distinct from the oocyte-specific paralog Wee2 (Wee1B).'
