- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: IDA
  original_reference_id: PMID:7551544
  qualifier: enables
  review:
    summary: Protein kinase activity of cloned mouse p87wee1, shown to be inactivated by M-phase phosphorylation
      (abstract only).
    action: MODIFY
    reason: 'Honda et al. measured mouse Wee1 kinase activity directly and showed it falls after phosphorylation
      of its N-terminal domain by mitotic extract containing cdc2-cyclin B (PMID:7551544). The activity is real,
      but the specific activity of the WEE1 subfamily is tyrosine phosphorylation of CDK1 Tyr15: mouse Wee1 loss
      abolishes CDK1 Tyr15 phosphorylation (PMID:16810330), and the human SF72 ortholog phosphorylates Cdc2 exclusively
      on Tyr15 (PMID:8428596). GO:0004713 is an is_a descendant already carried by the gene.'
    proposed_replacement_terms:
    - id: GO:0004713
      label: protein tyrosine kinase activity
    supported_by:
    - reference_id: PMID:7551544
      supporting_text: phosphorylation occurs in the N-terminal domain, which is absent from the human wee1 kinase,
        resulting in inactivation of the kinase activity
    - reference_id: PMID:16810330
      supporting_text: Our data revealed a significant reduction of Cdk1 phosphorylation at Tyr15 24 hours after
        4-HT treatment
    - reference_id: PMID:8428596
      supporting_text: purified human Wee1 phosphorylates p34cdc2 exclusively on Tyr15 in vitro; no Thr14 phosphorylation
        was detected
