core_functions:
- description: Nuclear non-receptor tyrosine kinase that phosphorylates CDK1 on the inhibitory Tyr15 residue, holding
    cyclin B1-CDK1 inactive through S/G2 and thereby restraining entry into mitosis and enforcing the DNA-damage
    G2/M checkpoint. Established genetically in mouse (loss of CDK1 Tyr15 phosphorylation and premature mitosis
    on deletion); Tyr15 specificity and nuclear site of action are inferred from the human SF72 ortholog.
  molecular_function:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  directly_involved_in:
  - id: GO:0010972
    label: negative regulation of G2/M transition of mitotic cell cycle
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:16810330
    supporting_text: Our data revealed a significant reduction of Cdk1 phosphorylation at Tyr15 24 hours after 4-HT
      treatment
  - reference_id: PMID:16810330
    supporting_text: murine Wee1 controls mitotic entry and the G2/M cell cycle checkpoint through the regulation
      of Cdk1 activity
  - reference_id: PMID:8428596
    supporting_text: purified human Wee1 phosphorylates p34cdc2 exclusively on Tyr15 in vitro; no Thr14 phosphorylation
      was detected
  - reference_id: PMID:8348613
    supporting_text: the human wee1-like tyrosine kinase is a nuclear protein that ensures the completion of DNA
      replication prior to mitosis
  - reference_id: file:mouse/Wee1/Wee1-uniprot.txt
    record_section: ["DR:PANTHER"]
    supporting_text: PTHR11042:SF72; WEE1-LIKE PROTEIN KINASE
suggested_questions:
- question: Does mouse Wee1 act in postmitotic neurons through CDK inhibition (e.g. of CDK1/CDK5-like targets) or
    through a distinct substrate, and is its effect on neurite formation kinase-dependent?
- question: Should the effector role of WEE1 in the DNA-damage G2/M checkpoint be captured with a checkpoint-signalling
    term (e.g. GO:0007095), given that WEE1 performs the inhibitory CDK1 phosphorylation that implements the arrest,
    or is GO:0010972 the intended convention for checkpoint effector kinases?
- question: Do the early mouse oocyte antibody studies of "wee1" (PMID:15459478, PMID:8886990) detect Wee1 or the
    oocyte paralog Wee2/Wee1B?
suggested_experiments:
- description: Rescue Wee1-knockdown cortical neurons with wild-type versus kinase-dead (catalytic Lys) Wee1 and
    with a CDK1 Y15F-insensitive background to test whether the neuronal polarity role requires Wee1 kinase activity
    toward CDK Tyr15.
- description: Re-examine Wee1 localization in mouse oocytes with antibodies validated against Wee1 and Wee2 knockouts
    to separate the two paralogs.
