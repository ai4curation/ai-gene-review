core_functions:
- description: Nuclear forkhead-domain transcriptional activator that binds forkhead binding sites in RNA polymerase
    II cis-regulatory regions and activates target genes. Mef2c (skeletal-muscle enhancer) is directly shown in
    mouse myoblasts; Pten is a ChIP-seq target in neural cells. Experimentally established in mouse.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id001
  - *id003
  - *id002
  - *id004
- description: Sequence-specific binding to RNA polymerase II cis-regulatory DNA through the forkhead domain. This
    is shown by ChIP of the Mef2c enhancer forkhead site in mouse, and it is shared across the FOXJ2/FOXJ3 clade
    (PAINT PTN002918318).
  molecular_function:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id003
  - *id008
  - reference_id: PMID:15366017
    supporting_text: It is most closely related to FoxJ2 and has been assigned the name FoxJ3.
suggested_questions:
- question: Which Foxj3 functions are conserved within PTHR46078:SF3 and which belong to the whole FOXJ2/FOXJ3 clade?
    The PAINT node carries only generic forkhead TF terms. The germ-cell, muscle, cortical and thermogenic roles
    are each established in mouse only, so should they be transferred to other mammalian SF3 orthologs at all?
- question: Does Foxj3 act directly on the promoters of meiotic genes (Rad51, Dmc1, Hormad1, Rnf212) in spermatocytes,
    or are their reduced levels secondary to meiotic arrest? The answer decides whether a regulation-of-meiosis
    term rather than male meiosis I would be appropriate.
- question: Is mouse Foxj3 also a transcriptional repressor in some contexts, as reported for Xenopus Foxj3 on TGF-beta-responsive
    genes? Or is that effect indirect, via RNF152/beta-catenin?
suggested_experiments:
- description: Endogenous Foxj3 ChIP-seq/CUT&RUN in sorted spermatocytes from wild-type mice, combined with RNA-seq
    of Stra8-Cre Foxj3 cKO spermatocytes, to identify direct meiotic targets.
- description: Foxj3 ChIP-seq in brown adipocytes and in primary myoblasts to test whether Ppargc1a/Ucp1 and Mef2c
    are bound directly by endogenous Foxj3, with forkhead-domain DNA-contact mutants as controls.
