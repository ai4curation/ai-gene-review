  review:
    summary: 'Binding to RNA polymerase II cis-regulatory sequences, propagated by PAINT from the FOXJ2/FOXJ3 clade.
      Mouse Foxj3 shows this activity directly: ChIP places it on the conserved forkhead binding site of the Mef2c
      skeletal-muscle enhancer.'
    action: ACCEPT
    reason: PAINT node PTN002918318 covers the FOXJ2/FOXJ3 clade (PANTHER PTHR46078; FOXJ3 is subfamily SF3 and
      FOXJ2 is SF1). Mouse Foxj3 (Q8BUR3) is in SF3 with human FOXJ3 Q9UPW0, so it is inside the clade that inherits
