id: Q8BUR3
gene_symbol: Foxj3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Foxj3 is a 623-residue forkhead/winged-helix transcription factor of the FOXJ2/FOXJ3 subfamily. Its
  forkhead DNA-binding domain is at residues 78-173, and the long C-terminal region is largely disordered. It is
  a nuclear, sequence-specific DNA-binding transcriptional activator. In skeletal myoblasts it binds a conserved
  forkhead site in the Mef2c skeletal-muscle enhancer and activates Mef2c transcription; Foxj3 mutant mice have
  fewer type I slow-twitch fibres and impaired muscle regeneration. Foxj3 is highly expressed in spermatogonia and
  spermatocytes. Germ-cell conditional deletion causes loss of spermatogonia, meiotic arrest with reduced expression
  of meiotic recombination genes, and male sterility. In the developing cortex, Foxj3 is required for neuronal migration
  and laminar specification, acting partly through its target gene Pten. In brown and beige fat it promotes thermogenic
  gene expression (Ppargc1a, Ucp1).
