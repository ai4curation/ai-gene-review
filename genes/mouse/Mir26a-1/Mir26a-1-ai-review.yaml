gene_symbol: Mir26a-1
product_type: MIRNA
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mir26a-1 is one of two mouse loci encoding the mir-26a precursor, embedded in
  an intron of a CTDSP-family host gene. The mature miR-26a is a guide RNA that
  directs Argonaute/RISC to complementary sites in target mRNA 3' UTRs. Two
  specific roles are well supported: repression of the RSK3 kinase in
  hippocampal neurons, where miR-26a is required for the maintenance phase of
  long-term potentiation and for dendritic spine enlargement; and cooperation
  with its CTDSP host genes to hypophosphorylate pRb and block the G1/S
  transition. miR-26a is also abundant in extracellular vesicles and appears in
  many circulating-miRNA biomarker surveys, which is a property of its abundance
  rather than a separate function.
