- term:
    id: GO:0009617
    label: response to bacterium
  evidence_type: IEP
  original_reference_id: PMID:24205035
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Contradicted by the source paper's own control experiment, which excludes
      bacterium-sensing pathways as the cause of the expression change.
    action: REMOVE
    reason: >-
      This is a circulating-biomarker survey: miR-26a rises in whole blood and
      serum after cecal ligation and puncture. The authors then asked whether
      bacterial sensing drives that rise and concluded it does not - the increase
      persists in Tlr2, Tlr4 and NF-kB knockouts. Annotating miR-26a as acting
      upstream of or within "response to bacterium" therefore asserts exactly what
      the cited paper tested and rejected. This is not a marginal over-annotation
      but a claim the source contradicts, which is the bar for REMOVE. It is also
      one of 58 IEP rows to this term from this single paper.
    supported_by:
    - reference_id: PMID:24205035
      supporting_text: which indicated that the transcription of these miRNAs was
        not directly mediated by the TLR2/NF-κB or TLR4/NF-κB pathway, and pathways
        induced by exposure to the gram-positive or gram-negative bacteria
- term:
    id: GO:0009611
    label: response to wounding
  evidence_type: IEP
  original_reference_id: PMID:24205035
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Reflects the surgical sepsis procedure used to perturb the animals, not a
      function of miR-26a in wound responses.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Cecal ligation and puncture is a surgical injury, so "response to wounding"
      describes the experimental manipulation rather than anything shown about
      miR-26a. The measured quantity is the level of a miRNA circulating in blood
      and serum - a biomarker readout - and no experiment places miR-26a upstream
      of or within a wound response. Retained as over-annotated rather than
      removed because, unlike the bacterium row, the paper does not actively
      argue against it.
    supported_by:
    - reference_id: PMID:24205035
      supporting_text: these miRNA targets were significantly up-regulated in the
        whole blood and serum but not in the WBCs
