suggested_questions:
- question: Do the two mouse loci Mir26a-1 and Mir26a-2 contribute differently to
    the LTP and cell-cycle roles, given their distinct CTDSP host genes?
  experts:
  - microRNA biologists
  - mouse geneticists
- question: Is the rise of circulating miR-26a in sepsis models a passive consequence
    of tissue damage, given that it survives loss of TLR2, TLR4 and NF-kB?
  experts:
  - sepsis researchers
  - extracellular vesicle biologists
suggested_experiments:
- description: Locus-specific deletion of Mir26a-1 versus Mir26a-2 followed by hippocampal
    LTP recording
  experiment_type: mouse genetics
  hypothesis: The two loci are partially redundant for LTP maintenance, with the
    dominant contribution from the more highly expressed locus in CA1
- description: Ago HITS-CLIP in CA1 before and after LTP induction in wild-type and
    Mir26a-null slices
  experiment_type: high-throughput sequencing
  hypothesis: RSK3 is one of a small set of miR-26a-dependent Argonaute targets
    that change occupancy during LTP maintenance
