- id: PMID:22210897
  title: MicroRNA-26a/b and their host genes cooperate to inhibit the G1/S transition
    by activating the pRb protein.
  findings:
  - statement: >-
      miR-26a/b act with their CTDSP host genes to reduce phosphorylated pRb and
      block G1/S progression, via direct target suppression.
    supporting_text: Gain- and loss-of-function studies showed that miR-26a/b and CTDSP1/2/L
      synergistically decreased the phosphorylated form of pRb (ppRb), and blocked
      G1/S-phase progression
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMC full text checked; miR-26a is assayed directly throughout (75
      mentions).
- id: PMID:24205035
  title: Profiling circulating microRNA expression in experimental sepsis using cecal
    ligation and puncture.
  findings:
  - statement: >-
      A circulating-miRNA biomarker survey in a cecal ligation and puncture
      sepsis model. miR-26a is one of 10 miRNAs upregulated in whole blood and
      serum, and one of 6 enriched in exosomes, with Argonaute 2
      immunoprecipitation confirming RISC association.
    supporting_text: the levels of 6 (miR-16, miR-17, miR-20a, miR-20b, miR-26a, and
      miR-26b) of these 10 miRNA targets increased significantly in exosomes
  - statement: >-
      The study's own knockout controls exclude bacterium-sensing pathways as the
      cause of the change, so the observation does not support a role for these
      miRNAs in responding to bacteria.
    supporting_text: which indicated that the transcription of these miRNAs was not
      directly mediated by the TLR2/NF-κB or TLR4/NF-κB pathway, and pathways induced
      by exposure to the gram-positive or gram-negative bacteria
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      The paper genuinely measures miR-26a, so the exosome and RISC rows it
      supports are sound. It does not support the two process rows drawn from it
      (response to bacterium, response to wounding); for the bacterium term it
      argues the opposite.
- id: PMID:25858512
  title: miR-26a and miR-384-5p are required for LTP maintenance and spine enlargement.
  findings:
  - statement: >-
      miR-26a is functionally required for the maintenance phase of LTP and for
      spine enlargement, acting by repressing RSK3 through its 3' UTR.
    supporting_text: we demonstrate that miR-26a and miR-384-5p specifically affect
      the maintenance, but not induction, of LTP and different stages of spine
      enlargement by regulating the expression of RSK3
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMC full text checked; miR-26a is one of the paper's two title
      miRNAs and was tested by electrophysiology, spine imaging and 3' UTR reporter
      assays.
