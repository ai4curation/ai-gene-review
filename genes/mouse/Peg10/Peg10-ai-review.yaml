proposed_new_terms:
- proposed_name: structural constituent of virus-like capsid
  proposed_definition: The action of a molecule that contributes to the structural integrity of a virus-like
    capsid, a non-infectious protein coat encoded by endogenous, non-viral genes that surrounds nucleic
    acid.
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  justification: GO:0039660 structural constituent of virion exists for viral capsid proteins, but Peg10
    is a domesticated, host-encoded Gag-derived protein whose particles are non-infectious, so its capsid
    role can only be annotated to the bare parent GO:0005198. A sibling of GO:0039660 under GO:0005198
    would pair with the existing cellular component GO:0170047 virus-like capsid. The same term is proposed
    in the human ARC review.
  supported_by:
  - reference_id: PMID:34413232
    supporting_text: MmMOAP1, MmZCCHC12, MmRTL1, MmPNMA3, MmPNMA5, MmPNMA6a, and MmPEG10 self-assemble
      into capsid-like particles
suggested_questions:
- question: Which endogenous transcripts are packaged and transferred by physiological PEG10 particles
    in the placenta versus other tissues?
- question: Does the mouse PEG10 aspartic protease cleave host substrates in addition to autoprocessing,
    and what is its cleavage consensus?
suggested_experiments:
- hypothesis: PEG10 aspartic-protease catalysis is required for placental fetal-capillary maintenance,
    not merely protein presence.
  description: Characterize the placental phenotype and autoprocessing in protease active-site (DSG->DAG)
    knock-in versus wild-type mice; identify cleavage products by N-terminomics.
  experiment_type: mutagenesis / in vivo
- hypothesis: PEG10 packages a defined set of trophoblast transcripts needed for stem-cell differentiation.
  description: eCLIP and VLP-RNA-seq in differentiating trophoblast stem cells comparing wild-type and
    Peg10-null cells.
  experiment_type: RNA-binding assay
