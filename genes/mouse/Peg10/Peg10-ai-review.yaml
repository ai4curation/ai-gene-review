- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:34413232
  qualifier: enables
  review:
    summary: The PEG10 Gag capsid domain self-assembles into capsid-like virus-like particles (PMID:34413232)
      and the capsid fold is confirmed structurally (PMID:34357660). This structural (capsid) activity
      is the primary molecular function and is not captured by existing annotations.
    action: NEW
    reason: 'Capsid self-assembly directly demonstrated; the protein is the structural subunit of the
      particle. GO:0039660 structural constituent of virion is not used: a virion is an infectious viral
      particle, and this host-encoded protein assembles non-infectious virus-like capsids. The capsid
      activity is therefore annotated to the parent GO:0005198 structural molecule activity, with the
      specific term proposed as the NTR ''structural constituent of virus-like capsid'' (the same gap
      and proposal recorded for ARC).'
