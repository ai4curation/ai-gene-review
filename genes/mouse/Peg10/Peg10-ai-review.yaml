id: Q7TN75
gene_symbol: Peg10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Peg10 (paternally expressed gene 10; SIRH1) is a therian-specific, paternally expressed
  imprinted gene domesticated from a Ty3/gypsy (sushi-ichi) LTR retrotransposon. The protein retains a
  retroviral Gag/Gag-Pol architecture: an N-terminal capsid domain with a CCHC-type nucleocapsid zinc
  knuckle, and a Pol-like region with an aspartic (retropepsin) protease bearing the DSG active-site motif,
  generated by a highly efficient programmed -1 ribosomal frameshift. The Gag capsid domain promotes membrane
  budding and self-assembles into virus-like particles that preferentially bind and package PEG10''s own
  mRNA (and other cellular transcripts such as Hbegf), which are secreted in extracellular vesicles and
  transferred between cells. The Pol aspartic protease autoprocesses the Gag-Pol polyprotein. PEG10 acts
  mainly in the cytoplasm and extracellularly, with a minor nuclear pool. It is essential and non-redundant
  for placentation: Peg10-null mice die at ~E10.5 from severe placental defects, and the aspartic-protease
  motif is separately required for maintenance of fetal placental capillaries. PEG10 also binds and inhibits
  TGF-beta superfamily type I/II receptors and regulates mRNAs required for trophoblast stem-cell differentiation.'
