      Repression of a direct target promoter is a core transcriptional output of this
      sequence-specific transcription factor. The paper combines loss of function,
      promoter mapping and binding, so it supports Hoxa2 acting directly in negative
      regulation of Pol II transcription. Hoxa2 also activates some targets (see
      GO:0045944), so it is a bifunctional regulator.
