- term:
    id: GO:0032331
    label: negative regulation of chondrocyte differentiation
  evidence_type: IMP
  original_reference_id: PMID:9636074
  review:
    summary: >-
      In the second arch, Hoxa2 prevents chondrogenesis upstream of Sox9 induction.
      In Hoxa2 mutants, cartilage forms ectopically in the Hoxa2 expression domain and
      the Sox9 domain shifts into it.
    action: NEW
    reason: >-
      Hoxa2 is excluded from chondrogenic condensations and acts early in the
      chondrogenic pathway. Loss of Hoxa2 expands Sox9 expression and chondrogenesis,
      and Sox9 misexpression phenocopies the mutant. A sequence-specific transcription
      factor that restricts a differentiation program by controlling the program's
      master regulator does part of the regulatory work (GO's standard treatment of
      TFs), so this is regulation, not mere necessity. It is a non-core,
      tissue-specific role. The claim rests on mouse genetics, and the abstract-only
      cache leaves open whether Sox9 is a direct target.
    supported_by:
    - reference_id: PMID:9636074
      supporting_text: In the absence of Hoxa-2, chondrogenesis is activated ectopically
        within the rostral Hoxa-2 expression domain to form the mutant set of cartilages.
    - reference_id: PMID:9636074
      supporting_text: These results indicate that Hoxa-2 acts at early stages of the
        chondrogenic pathway, upstream of Sox9 induction.
- term:
    id: GO:2001222
    label: regulation of neuron migration
  evidence_type: IMP
  original_reference_id: PMID:18547144
  review:
    summary: >-
      Hoxa2 and Hoxb2 are required intrinsically and extrinsically to maintain normal
      anteroposterior migration of pontine neuron subsets. Hoxa2 binds the Robo2 locus
      and is needed to maintain Robo/Slit expression.
    action: NEW
    reason: >-
      Hoxa2 directly binds a conserved Hox-Pbx site in Robo2 and keeps Robo2/Slit2
      expression high, and Slit-Robo compound mutants phenocopy the migration
      defects. Hoxa2 thus regulates migration by setting the transcriptional level of
      a guidance receptor and ligand. It does not perform the migration itself, so a
      regulation term, rather than neuron migration, is the right claim. This is a
      non-core role.
    supported_by:
    - reference_id: PMID:18547144
      supporting_text: Hoxa2 and Hoxb2 are required both intrinsically and extrinsically
        to maintain normal AP migration of subsets of PN, by preventing their premature
        ventral attraction towards the midline
    - reference_id: PMID:18547144
      supporting_text: Robo2 is a direct target of Hoxa2 in vivo and that maintenance
        of high Robo and Slit expression levels was impaired in Hoxa2 mutant mice
