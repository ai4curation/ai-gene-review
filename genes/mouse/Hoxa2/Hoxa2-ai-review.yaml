  review:
    summary: >-
      Hoxa2 represses Six2 in second-arch neural crest mesenchyme. Six2 is elevated
      in Hoxa2 mutants, and Hoxa2 binds the 0.9 kb Six2 promoter fragment that
      mediates the regulation.
    action: ACCEPT
