core_functions:
- description: >-
    Sequence-specific, Pol II-specific DNA-binding transcription factor that binds
    cis-regulatory modules largely together with Pbx and Meis cofactors in the
    nucleus. It represses some targets (Six2) and activates others (Robo2, the Krox20
    element C enhancer). Experimentally established in mouse by promoter/ChIP binding
    and loss-of-function target derepression. The activity is also inherited
    phylogenetically from the ancestral Hox node PTN005228379 (subfamily
    PTHR45664:SF3).
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15634706
    supporting_text: Hoxa2 regulation of Six2 is confined to a 0.9 kb fragment of the
      Six2 promoter and that Hoxa2 binds to this promoter region
  - reference_id: PMID:22223247
    supporting_text: Sequence analysis of Hoxa2-bound regions identifies high occurrence
      of two main classes of motifs, corresponding to Hox and Pbx-Hox recognition sequences.
  - reference_id: PMID:25640223
    supporting_text: Collectively, these observations indicate that Hoxa2 largely binds
      in combination with Meis and Pbx in the IIBA, and suggest that combinatorial binding
      underlies Hoxa2 function.
- description: >-
    Specifies anteroposterior positional identity as a selector gene, giving second
    pharyngeal arch neural crest mesenchyme and rhombomeres 2/3 their identity. Loss
    of Hoxa2 causes a homeotic transformation of hyoid to mandibular (first-arch)
    skeletal elements, and ectopic Hoxa2 transforms first-arch derivatives toward
    second-arch identity. Experimentally established in mouse.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0009952
    label: anterior/posterior pattern specification
  supported_by:
  - reference_id: PMID:7903601
    supporting_text: second arch mesenchymal NCC identity was changed to first arch
      identity, resulting in homeotic transformation of second to first arch skeletal
      elements
  - reference_id: PMID:25889273
    supporting_text: ectopic Hoxa2 expression is sufficient for the morphological and
      molecular transformation of the first PA (PA1) CNCC derivatives into the second
      PA (PA2)-like structures
  - reference_id: PMID:9367425
    supporting_text: in Hoxa-2(-/-) embryos, the segmental identities of rhombomere
      (r) 2 and r3 are molecularly as well as anatomically altered
proposed_new_terms: []
suggested_questions:
- question: >-
    Which paper did MGI intend for the Hoxa2 rhombomere 2 (IMP) and rhombomere 3 (IGI
    with MGI:96183) annotations now keyed to PMID:7508007, an unrelated SV40 tumour
    study?
- question: >-
    Does the GO:0061061 muscle structure development annotation from PMID:25889273
    reflect a cell-autonomous Hoxa2 function or a secondary effect of crest-derived
    connective tissue repatterning after ectopic expression?
- question: >-
    Are Sox9 and Runx2 direct Hoxa2 targets in second-arch mesenchyme (bound in the
    Hoxa2 ChIP-seq), or are they repressed indirectly through other targets?
suggested_experiments:
- description: >-
    Cross-reference the second-arch Hoxa2 ChIP-seq (PMID:22223247, PMID:25640223) with
    Sox9 and Runx2 regulatory regions, and test candidate elements in reporters with
    Hox-Pbx site mutations, to determine whether chondrogenic and osteogenic
    repression is direct.
- description: >-
    Use a homeodomain DNA-binding mutant (e.g. a helix 3 N51A substitution) knocked
    into the endogenous Hoxa2 locus to separate DNA-binding-dependent selector
    function from possible DNA-binding-independent cofactor roles, such as enhancing
    Meis binding.
