id: P31245
gene_symbol: Hoxa2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Hoxa2 encodes the paralog group 2 Hox homeodomain transcription factor of the HoxA
  cluster (372 aa; Antp-type hexapeptide at 96-101 and a homeodomain at 139-198). It
  is a nuclear, sequence-specific DNA-binding protein that binds cis-regulatory
  elements largely together with the TALE cofactors Pbx and Meis, and it both
  represses targets (for example Six2 in second-arch mesenchyme) and activates them
  (for example the Krox20 element C enhancer in rhombomere 3, and Robo2). Hoxa2 is
  the most anterior Hox gene expressed in cranial neural crest. In the second
  pharyngeal (hyoid) arch it acts as a selector gene that gives postmigratory neural
  crest mesenchyme its second-arch identity. Without it, hyoid skeletal elements are
  replaced by a mirror duplicate of first-arch (mandibular and middle-ear) elements,
  and ectopic Hoxa2 transforms first-arch derivatives toward second-arch identity. It
  limits chondrogenesis upstream of Sox9 and dermal bone formation upstream of
  Runx2/Cbfa1, restrains the neurogenic potential of second-arch crest cells, and in
  the hindbrain specifies rhombomere 2/3 identity along both the anteroposterior and
  dorsoventral axes. Through its target Robo2 it guides trigeminal motor axon exit and
  the anteroposterior migration of pontine neurons.
