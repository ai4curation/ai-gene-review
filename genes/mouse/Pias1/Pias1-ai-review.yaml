core_functions:
- description: 'SP-RING-type SUMO E3 ligase: binds the SUMO E2 Ubc9 through its zinc-coordinating SP-RING
    and recruits nuclear substrates (largely transcription factors such as C/EBPbeta, GATA4, FOXA2, PPARgamma
    and Tr2, plus PML/PML-RARA and DNA repair proteins) to catalyse their SUMO conjugation, thereby altering
    their stability, partner recruitment or activity.'
  molecular_function:
    id: GO:0061665
    label: SUMO ligase activity
  directly_involved_in:
  - id: GO:0016925
    label: protein sumoylation
  locations:
