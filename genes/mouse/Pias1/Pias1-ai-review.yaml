    label: nucleoplasm
  - id: GO:0016605
    label: PML body
  supported_by:
  - reference_id: PMID:24061474
    supporting_text: PIAS1 functions as a SUMO E3 ligase of C/EBPβ to regulate adipogenesis
  - reference_id: PMID:22539995
    supporting_text: our results demonstrate that PIAS1 is a SUMO ligase for GATA4
  - reference_id: PMID:23118920
    supporting_text: FOXA2 sumoylation and FOXA2 protein levels were increased by PIAS1 SUMO ligase but
      not a SUMO ligase activity deficient PIAS1 mutant
  - reference_id: PMID:22406621
    supporting_text: By performing in vitro SUMOylation assays, we discovered that both PIAS1 and PIASxα
      SUMOylate PML.
  - reference_id: PMID:15123625
    supporting_text: we show that the PIAS family proteins, PIAS1 and PIASxbeta, function as E3 ligases
  - reference_id: file:mouse/Pias1/Pias1-uniprot.txt
    supporting_text: Functions as an E3-type small ubiquitin-like modifier (SUMO)
- description: 'Inhibitor of activated transcription factors: Pias1 binds interferon-activated STAT1 and
    nuclear NF-kB p65 and blocks their DNA binding and promoter recruitment, independently of STAT1 sumoylation,
    acting as an inducible brake (switched on by IKKalpha-mediated Ser90 phosphorylation) on interferon-
    and cytokine-induced gene expression; Pias1-null mice show enhanced interferon and inflammatory responses.'
  molecular_function:
