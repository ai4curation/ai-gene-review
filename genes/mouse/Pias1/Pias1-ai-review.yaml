  - ensembl:ENSRNOP00000093422
  review:
    summary: Ensembl Compara projection (from rat Pias1) asserting involvement in the G1/S transition.
      No mouse data show Pias1 executing a cell-cycle step.
    action: MARK_AS_OVER_ANNOTATED
    reason: PIAS1 is a SUMO E3 ligase and inhibitor/coregulator of transcription factors; it does not
      execute steps of this process. Effects on it are downstream consequences of substrate sumoylation
