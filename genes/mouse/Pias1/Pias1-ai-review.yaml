id: O88907
gene_symbol: Pias1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Pias1 (protein inhibitor of activated STAT 1) is a nuclear SP-RING-type SUMO E3 ligase of
  the PIAS family (related to yeast Siz1/Siz2) and a transcriptional coregulator. It has an N-terminal
  SAP domain that binds A/T-rich DNA and chromatin, a PINIT domain, a zinc-coordinating SP-RING that binds
  the SUMO E2 Ubc9 (UBE2I), a SUMO-interacting motif and a Ser/Thr-rich C-terminus. By bridging Ubc9 and
  substrates it catalyses SUMO conjugation to many nuclear proteins, mostly transcription factors, including
  C/EBPbeta (promoting its degradation and restraining adipogenesis), GATA4, FOXA2, PPARgamma (enabling
  PPARgamma transrepression of inflammatory genes in macrophages), the Tr2 nuclear receptor, PML and PML-RARA
  (priming their ubiquitin-mediated degradation), and DNA repair proteins such as MRE11. Independently
  of substrate sumoylation, Pias1 binds activated transcription factors and blocks their DNA binding:
  it inhibits recruitment of interferon-activated STAT1 and of NF-kB p65 to target promoters, so Pias1-deficient
  mice overexpress subsets of interferon- and NF-kB-inducible genes, show elevated proinflammatory cytokines
  and resist some infections. This repression is switched on during inflammation by IKKalpha-mediated
  Ser90 phosphorylation. Depending on the partner Pias1 can also coactivate transcription (e.g. GATA4)
  or act as a cofactor that directs a transcription factor to its targets (tethering Msx1 to the nuclear
  periphery and the MyoD enhancer), and it binds TBP. Pias1 is found in the nucleoplasm, on chromatin,
  in nuclear speckles and in PML nuclear bodies, with a minor pool at hippocampal synapses.'
