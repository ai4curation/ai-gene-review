suggested_questions:
- question: Which phenotypes of Pias1-/- mice (enhanced interferon responses, elevated proinflammatory
    cytokines, pathogen resistance) require PIAS1 SP-RING E3 activity versus binding-based blockade of
    STAT1/p65 DNA binding?
- question: Is PIAS1-mediated tethering of transcription factors to the nuclear periphery (shown for Msx1)
    a general mechanism for directing homeoproteins and other factors to repressed target genes?
- question: What is the functional consequence of the conserved PIAS C-terminal TBP-binding region; does
    PIAS1 dock at TBP to sumoylate promoter-bound factors?
- question: Is the high testis expression of Pias1 associated with specific spermatogenic substrates,
    or is any spermatogenesis phenotype indirect?
suggested_experiments:
- description: Generate knock-in mice carrying an SP-RING catalytic mutant (C351S), a STAT1-binding-deficient
    C-terminal deletion, or S90A, and compare IFN- and TNF/LPS-induced gene expression, STAT1/p65 promoter
    occupancy and infection outcomes with Pias1-/- mice.
  hypothesis: PIAS1 restrains inflammatory gene expression primarily by binding-based inhibition of STAT1/p65,
    with E3 activity required mainly for Ser90 activation.
  experiment_type: genetic separation-of-function
- description: SUMO-site proteomics (K-epsilon-GG/SUMO-remnant enrichment) in wild-type versus Pias1-/-
    macrophages, adipocyte precursors and testis to define endogenous PIAS1 substrates.
  hypothesis: PIAS1 has a tissue-specific substrate repertoire dominated by transcription factors (C/EBPbeta,
    GATA4, PPARgamma).
  experiment_type: proteomics
