  title: The NESH/Abi-3-based WAVE2 complex is functionally distinct from the Abi-1-based WAVE2 complex.
  findings:
  - statement: NESH/Abi3 replaces endogenous Abi1 to form a distinct WAVE2 complex that lacks the c-Abl-binding
      linker, reduces WAVE2 plasma membrane translocation, and impairs lamellipodial protrusions.
