- term:
    id: GO:0061098
    label: positive regulation of protein tyrosine kinase activity
  evidence_type: ISO
  original_reference_id: PMID:17101133
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - UniProtKB:Q9P2A4
  review:
    summary: Defective MGI ISO annotation from PMID:17101133 asserting positive regulation of protein
      tyrosine kinase activity for Abi3.
    action: REMOVE
    reason: Directly contradicted by the cited paper PMID:17101133 ('NESH (Abi-3) is present in the Abi/WAVE
      complex but does not promote c-Abl-mediated phosphorylation'), which explicitly shows that unlike
      Abi1 and Abi2, NESH/Abi3 lacks the c-Abl-activating linker determinants and does NOT promote c-Abl-mediated
      phosphorylation of Mena or WAVE2 (corroborated in PMID:26428302). MGI transferred the positive annotation
      without the required NOT qualifier.
    supported_by:
    - reference_id: PMID:17101133
      supporting_text: Although Abi-2, like Abi-1, promoted the c-Abl-mediated phosphorylation of Mena
        and WAVE2, NESH (Abi-3) had no such effect.
    - reference_id: PMID:26428302
      supporting_text: Structural studies showed that a linker region between the proline-rich regions
        and the Src homology 3 (SH3) domain of Abi-1 is crucial for its interaction with c-Abl and c-Abl-mediated
        phosphorylation of WAVE2.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      - FUNCTIONAL_DIVERGENCE
      residue_claims_not_applicable: Divergence of SF7 (ABI3/Abi3) from ABI1/ABI2 involves multi-residue
        remodeling/shortening of the proline-rich-to-SH3 linker rather than a single catalytic point substitution
        (PMID:26428302).
      source_entities:
      - source_id: UniProtKB:Q9P2A4
        source_label: ABI3
        source_status: SOURCE_BAD
        comment: PMID:17101133 demonstrates that human Q9P2A4 (ABI3/NESH) does NOT promote c-Abl kinase
          activity
    source_defects:
    - defect_type: MISSING_NEGATION
      resource: MGI
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: acts_upstream_of_or_within
      corrected_value: NOT|acts_upstream_of_or_within
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: PMID:17101133 explicitly demonstrates that unlike Abi-1 and Abi-2, NESH (ABI3, UniProtKB:Q9P2A4)
        does NOT bind c-Abl or promote c-Abl-mediated tyrosine phosphorylation of Mena or WAVE2; the MGI
        ISO row on mouse Abi3 (Q8BYZ1) omitted the NOT qualifier (or should be deleted).
      supported_by:
      - reference_id: PMID:17101133
        supporting_text: Although Abi-2, like Abi-1, promoted the c-Abl-mediated phosphorylation of Mena
