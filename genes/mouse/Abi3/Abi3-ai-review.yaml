- id: PMID:11956071
  title: Forced expression of NESH suppresses motility and metastatic dissemination of malignant cells.
  findings:
  - statement: Ectopic expression of NESH/ABI3 markedly reduces cell motility and metastatic dissemination
      without altering intrinsic in vitro proliferation.
    supporting_text: We observed that every clone of NESH transfectants caused a marked reduction in motility,
      although the clones exhibited no significant differences in intrinsic cell growth compared with
      the control cells in vitro.
- id: PMID:15572692
  title: ABI2-deficient mice exhibit defective cell migration, aberrant dendritic spine morphogenesis,
    and deficits in learning and memory.
  findings: []
- id: PMID:17101133
  title: NESH (Abi-3) is present in the Abi/WAVE complex but does not promote c-Abl-mediated phosphorylation.
  findings:
  - statement: NESH/ABI3 incorporates into the Abi/WAVE complex like Abi1 and Abi2, but does not promote
      c-Abl-mediated phosphorylation of Mena or WAVE2.
    supporting_text: Although Abi-2, like Abi-1, promoted the c-Abl-mediated phosphorylation of Mena and
      WAVE2, NESH (Abi-3) had no such effect.
- id: PMID:18480067
  title: Insulin receptor substrate protein 53 (IRSp53) as a binding partner of antimetastasis molecule
    NESH, a member of Abelson interactor protein family.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Brief 2-page Ann Oncol letter (full_text_available: false, no abstract body in PubMed cache;
      only the article title is inspectable locally). Title identifies IRSp53 (BAIAP2) as a binding
      partner of NESH/ABI3, without inspectable domain-level or directionality mapping.
- id: PMID:21223585
  title: ABI3 ectopic expression reduces in vitro and in vivo cell growth properties while inducing senescence.
  findings:
  - statement: Ectopic ABI3 expression suppresses anchorage-independent growth and in vivo tumor formation
      while increasing cellular senescence.
    supporting_text: Ectopic expression of ABI3 was sufficient to lead to a lower transforming activity,
