id: Q8BYZ1
gene_symbol: Abi3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mouse ABI gene family member 3 (Abi3, also known as NESH) is a diverged vertebrate member
  of the Abl-interactor adaptor family (PANTHER subfamily PTHR10460:SF7) that occupies the Abi subunit
  slot within heteropentameric WAVE2 regulatory complexes alongside Wasf2/WAVE2, Cyfip1/2, Nckap1/Nckap1l,
  and Brk1. Unlike its paralogs Abi1 and Abi2, Abi3 lacks the proline-rich-to-SH3 linker determinants
  required to bind c-Abl and does not stimulate c-Abl-mediated tyrosine phosphorylation of WAVE2 or Mena.
  Incorporation of Abi3 displaces endogenous Abi1 to form a functionally distinct WAVE2 complex that attenuates
  WAVE2 translocation to the plasma membrane and suppresses peripheral lamellipodial protrusion and cell
  motility, with prominent physiological expression in microglia, lymphoid cells, and vascular endothelium.
