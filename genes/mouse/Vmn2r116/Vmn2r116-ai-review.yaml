  label: Mus musculus
description: >-
  Vmn2r116 (V2Rp5) is a vomeronasal type-2 receptor, a class C (family 3) G protein-coupled
  receptor expressed in sensory neurons of the mouse vomeronasal organ. Like other class C
  receptors it has a large extracellular N-terminal region (a Venus flytrap ligand-binding
  domain and a nine-cysteine domain) followed by a seven-transmembrane domain. It is the
  receptor for exocrine gland-secreting peptide 1 (ESP1), a 7-kDa peptide pheromone released
  in male tear fluid. ESP1 binds the extracellular region of V2Rp5 directly and specifically,
  through charge-charge interactions; the closely related peptide ESP4 does not bind.
  Activation of V2Rp5-expressing vomeronasal neurons by ESP1 sends a sex-specific signal through
  the accessory olfactory bulb to amygdaloid and hypothalamic nuclei. In females this enhances
  sexual receptivity (lordosis) on male mounting. In V2Rp5-deficient mice ESP1 activates
  neither vomeronasal neurons nor the behavioural response.
