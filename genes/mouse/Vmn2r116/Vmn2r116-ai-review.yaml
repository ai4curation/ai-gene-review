- term:
    id: GO:0016503
    label: pheromone receptor activity
  evidence_type: IGI
  original_reference_id: PMID:20596023
  qualifier: enables
  supporting_entities:
  - MGI:MGI:3645915
  review:
    summary: >-
      MGI IGI with Esp1 (MGI:3645915). Haga et al. identified V2Rp5 as the specific receptor
      for the male tear peptide ESP1, and showed that V2Rp5 knockout abolishes the neural and
      behavioural responses to ESP1. Yoshinaga et al. later showed direct, specific,
      charge-dependent binding of ESP1 to the recombinant V2Rp5 extracellular region, with no
      binding of ESP4.
    action: ACCEPT
    reason: >-
      This is the core, experimentally established function of Vmn2r116 in mouse. The ligand
      (ESP1) is a pheromone, and the genetic and biochemical evidence shows that this receptor
      combines with it to activate vomeronasal sensory neurons. The ESP1 specificity is
      established for this protein only. It should not be transferred to other members of
      PTHR24061:SF398 or to other V2R subfamilies.
    supported_by:
    - reference_id: PMID:20596023
      supporting_text: ESP1 is recognized by a specific vomeronasal receptor, V2Rp5
    - reference_id: PMID:20596023
      supporting_text: In V2Rp5-deficient mice, ESP1 induces neither neural activation nor sexual
        behaviour.
    - reference_id: PMID:23576433
      supporting_text: These results indicate that ESP1 specifically binds to the extracellular
        region of V2Rp5.
    - reference_id: file:mouse/Vmn2r116/Vmn2r116-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Receptor for the Esp1 pheromone.'
- term:
    id: GO:0045925
    label: positive regulation of female receptivity
  evidence_type: IGI
  original_reference_id: PMID:20596023
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:3645915
  review:
    summary: >-
      ESP1 enhances lordosis in females, and this effect is lost in V2Rp5-deficient mice. The
      receptor acts at the sensory input end of a circuit through the accessory olfactory bulb,
      amygdala and hypothalamus that ends in this behaviour.
    action: KEEP_AS_NON_CORE
    reason: >-
      The annotation is supported by the knockout evidence, and its acts_upstream_of_or_within
      qualifier fits a sensory receptor whose effect on behaviour runs through downstream neural
      circuits. It is an organismal behavioural outcome, not the receptor's molecular role, so
      it is kept as non-core and is not taken as evidence that the receptor performs the
      regulatory process itself.
    supported_by:
    - reference_id: PMID:20596023
      supporting_text: Consequently, ESP1 enhances female sexual receptive behaviour upon male
        mounting (lordosis), allowing successful copulation.
    - reference_id: PMID:20596023
      supporting_text: In V2Rp5-deficient mice, ESP1 induces neither neural activation nor sexual
        behaviour.
