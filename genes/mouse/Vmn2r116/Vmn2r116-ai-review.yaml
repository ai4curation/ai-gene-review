core_functions:
- description: >-
    Peptide pheromone receptor. Vmn2r116 (V2Rp5) is the vomeronasal class C GPCR that
    specifically detects the male tear peptide ESP1. ESP1 binds its extracellular region, and
    the receptor activates vomeronasal sensory neurons, starting the signal that enhances
    female sexual receptivity. Ligand identity is established experimentally for this mouse
    protein only. Family-level (PTHR24061 class C GPCR) inheritance supports GPCR activity and
    plasma membrane location, but not ESP1 specificity.
  supported_by:
  - reference_id: PMID:20596023
    supporting_text: ESP1 is recognized by a specific vomeronasal receptor, V2Rp5
  - reference_id: PMID:23576433
    supporting_text: These results indicate that ESP1 specifically binds to the extracellular
      region of V2Rp5.
  molecular_function:
    id: GO:0016503
    label: pheromone receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
suggested_questions:
- question: >-
    Which family-C V2R (Vmn2r1-Vmn2r7) and which H2-Mv molecule are co-expressed with V2Rp5 in
    ESP1-responsive neurons, and are they needed for surface expression of the receptor or for
    ESP1 responses?
- question: >-
    Does ESP1 bind V2Rp5 in a closed-cleft conformation of the Venus flytrap domain, as the
    docking model proposes, and which receptor residues decide that ESP1 binds and ESP4 does
    not?
- question: >-
    Should GO annotate vomeronasal receptors to the process GO:0043695 detection of pheromone?
    No mouse, rat or human gene carries this term at present, and these receptors carry only
    the molecular function pheromone receptor activity.
suggested_experiments:
- description: >-
    Reconstitute V2Rp5 together with candidate family-C V2Rs and H2-Mv in heterologous cells,
    measure ESP1-evoked G protein (Galpha-o) activation, and identify the minimal receptor
    complex.
  experiment_type: heterologous receptor signalling assay
- description: >-
    Mutate charged residues in the modelled VFT cleft of V2Rp5, then test ESP1 binding by
    pulldown and ESP1 responses in reconstituted cells, to map the determinants of ligand
    specificity.
  experiment_type: site-directed mutagenesis and binding assay
