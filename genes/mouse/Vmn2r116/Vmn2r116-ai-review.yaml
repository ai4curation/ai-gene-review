    specific binding to the class C G-protein-coupled vomeronasal receptor.
  findings:
  - statement: ESP1 binds directly and specifically to the recombinant extracellular region
      (residues 19-584) of V2Rp5; ESP4 does not bind, and the binding is salt-sensitive.
