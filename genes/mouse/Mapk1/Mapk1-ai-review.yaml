- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: intracellular signal transduction is a broad parent for ERK1/2 signaling.
    action: MODIFY
    reason: The more specific biological process for these ERK proteins is the ERK1
      and ERK2 cascade.
    supported_by:
    - reference_id: file:mouse/Mapk1/Mapk1-deep-research-falcon.md
      supporting_text: ERK2 is a terminal kinase in the canonical **RAS-RAF-MEK-ERK**
        (ERK1/2 MAPK) cascade
    proposed_replacement_terms:
    - &id001
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000622075
        source_status: SUPPORTS_TRANSFER
        comment: >-
          A deep kinase node, not an ERK-specific one: the local PAINT cache lists PTN000622075 in
          the files of four families - PTHR24055 (PANTHER name "MITOGEN-ACTIVATED PROTEIN KINASE",
          the family UniProt assigns to the target), PTHR24056 ("CELL DIVISION PROTEIN KINASE"),
          PTHR24057 ("GLYCOGEN SYNTHASE KINASE-3 ALPHA") and PTHR44167 - and its IBD seeds span
          fungal, plant, worm, fly and vertebrate kinases of those groups. Across a clade that
          broad the generic parent is the only biological-process term that holds for every member,
          so the node placement is sound and only the term is uninformative for mouse Mapk1.
      - source_id: MGI:MGI:1346858
        source_label: mouse Mapk1 (the review target itself)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target's own MGI record is among the IBD seeds, the expected marker that experimental
          grounding exists on the target itself: Mapk1 carries IDA annotations at GO:0000165 MAPK
          cascade (PMID:8626447, PMID:9064344, PMID:9254656), a descendant of this term, which is
          among the descendant evidences behind the IBD.
      - source_id: MGI:MGI:1346859
        source_label: mouse Mapk3 (ERK1, the target's closest paralog)
        source_status: SUPPORTS_TRANSFER
        comment: ERK1/ERK2 are functionally interchangeable in the cascade; the transfer between them is not at issue.
      - source_id: FB:FBgn0003256
        source_label: Drosophila rolled (rl, the fly ERK)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The single fly ERK ortholog, one of the seeds that anchors the cascade role deep in the
          metazoan tree.
      - source_id: UniProtKB:P28482
        source_label: human MAPK1 (ERK2)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The 1:1 human ortholog seed. Its presence, with the fly and mouse ERK seeds, is why the
          informative claim available here is the ERK1/2 cascade: GO:0070371 is a genuine descendant
          of GO:0035556 (via GO:0000165 MAPK cascade), so the MODIFY is a parent-to-child narrowing
          rather than a change of claim.
