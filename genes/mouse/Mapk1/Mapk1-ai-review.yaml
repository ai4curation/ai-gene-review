      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN008603019
        source_status: SUPPORTS_TRANSFER
        comment: >-
          A different, much shallower node than the one behind the GO:0035556 row: PTN008603019
          appears only in the PTHR24055 PAINT file (PANTHER family name "MITOGEN-ACTIVATED PROTEIN
          KINASE", the target's own family) and its IBD seeds are exactly the ERK orthologs - fly
          rolled, mouse Mapk1 and Mapk3, human MAPK1 and MAPK3. The clade is the right one; what is
          wrong is that GO:0007166 names the upstream receptor pathway that recruits ERK rather than
          ERK's own step in it.
      - source_id: MGI:MGI:1346858
        source_label: mouse Mapk1 (the review target itself)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target's own MGI record is among the IBD seeds, the expected marker that experimental
          grounding exists on the target itself: Mapk1 carries IDA annotations at GO:0000165 MAPK
          cascade (PMID:8626447, PMID:9064344, PMID:9254656) and an IGI at GO:0000165
          (PMID:21220101), which are among the descendant evidences behind the IBD.
      - source_id: MGI:MGI:1346859
        source_label: mouse Mapk3 (ERK1, the target's closest paralog)
        source_status: SUPPORTS_TRANSFER
        comment: Second mouse ERK seed; ERK1 and ERK2 act in the same cascade downstream of the same receptor classes.
      - source_id: FB:FBgn0003256
        source_label: Drosophila rolled (rl, the fly ERK)
        source_status: SUPPORTS_TRANSFER
        comment: The fly ERK ortholog seed; like the vertebrate seeds it acts downstream of RTK input rather than at the receptor itself.
      - source_id: UniProtKB:P28482
        source_label: human MAPK1 (ERK2)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The 1:1 human ortholog seed. Note that GO:0070371 is not a descendant of GO:0007166 - its
          is_a/part_of ancestors run through GO:0000165 and GO:0035556 - so unlike the GO:0035556
          row this MODIFY is a lateral re-scope from the receptor pathway onto the effector cascade
          the seeds actually share, not a narrowing, which is why no granularity failure mode is
          asserted.
- term:
    id: GO:0001784
    label: phosphotyrosine residue binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: ARBA-predicted phosphotyrosine residue binding matches the experimentally
      supported phosphotyrosine-dependent paxillin association of ERK2 (IMP row,
      PMID:14636584).
    action: KEEP_AS_NON_CORE
    reason: Kept consistent with the IMP annotation of this same term; pTyr-dependent
      docking on paxillin is documented for ERK but it is an accessory interaction rather
      than the core catalytic function.
    supported_by:
    - reference_id: PMID:14636584
      supporting_text: this is mediated by the tyrosine phosphorylation-dependent
        association of inactive ERK and the focal adhesion complex protein paxillin
- term:
    id: GO:0001890
    label: placenta development
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: Placenta development is one of the best-genetically-supported in vivo roles
      of mouse ERK2; Erk2-null embryos die from placental failure (PMID:14622137).
    action: KEEP_AS_NON_CORE
    reason: The Erk2 knockout phenotype directly demonstrates a requirement in placental
      development, so the electronically propagated term is retained as a developmental
      (non-core) output of ERK2 signaling.
    supported_by:
    - reference_id: PMID:14622137
      supporting_text: the targeted disruption of the mouse ERK2 gene results in embryonic
        lethality by E11.5 and severe abnormality of the placenta
