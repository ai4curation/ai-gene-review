id: P17751
gene_symbol: Tpi1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Tpi1 encodes the mouse triosephosphate isomerase, a cytosolic homodimeric TIM-barrel enzyme
  that catalyzes the reversible interconversion of dihydroxyacetone phosphate and D-glyceraldehyde 3-phosphate.
  This reaction is the triose-phosphate isomerase step of glycolysis and gluconeogenesis, and loss-of-function
  mouse mutants with reduced TPI activity show that the single structural locus is essential for embryonic
  energy metabolism. The same enediol phosphate intermediate can slowly eliminate phosphate to form methylglyoxal,
  a minor side reaction of the isomerase mechanism.'
