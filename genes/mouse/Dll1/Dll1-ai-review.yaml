core_functions:
- molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  description: >-
    Dll1 is a transmembrane DSL ligand that binds Notch1/Notch2 on adjacent cells and, upon Mib1/Neuralized-dependent
    ubiquitination and endocytosis, activates Notch proteolysis and RBP-J-dependent transcription in the
    receiving cell.
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  - id: GO:0046331
    label: lateral inhibition
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:10958687
    supporting_text: >-
      binding of DSL proteins to Notch2 also activated the transcription of reporter genes driven by the
      RBP-Jkappa-responsive promoter.
  - reference_id: PMID:21985982
    supporting_text: >-
      lysine 613 (K613) in the cytoplasmic tail of Dll1 is a key residue necessary for transcellular activation
      of Notch signaling.
  - reference_id: PMID:18997111
    supporting_text: >-
      different levels of Dll1 expression determine the fate of NPCs through cell-cell interactions, most
      likely through the Notch-Delta lateral inhibitory signaling pathway
- molecular_function:
    id: GO:0005112
    label: Notch binding
  description: >-
    Dll1 binds Notch receptors in trans; binding is enhanced by Fringe glycosylation of Notch and depends
    on ubiquitination-dependent recycling of the ligand.
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:15574878
    supporting_text: >-
      increased Delta1 binding and activation of Notch1 signaling in 293T and NIH 3T3 cells
  - reference_id: PMID:18676613
    supporting_text: >-
      ubiquitination, although not required for endocytosis, is essential for Dll1 recycling and that
      recycling is required to acquire affinity for the receptor.
