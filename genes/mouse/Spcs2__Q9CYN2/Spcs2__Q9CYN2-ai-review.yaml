  review:
    summary: >-
      PAINT propagation from PTN000317824 seeded only by yeast Spc2, whose SGD
      annotation rests on genetic and interaction data showing Spc2 is needed for
      signal peptidase activity at high temperature and is synthetically lethal with
      sec11 (PMID:8910564). The SPC cleaves signal peptides from chains that have
      already been targeted to and are crossing the ER membrane; it does not direct
