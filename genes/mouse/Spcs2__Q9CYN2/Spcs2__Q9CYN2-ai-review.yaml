core_functions:
- description: >-
    Non-catalytic, two-pass transmembrane accessory subunit of the ER signal peptidase
    complex (with Sec11a or Sec11c, Spcs1 and Spcs3). By orthology within
    PTHR13085:SF0, it contributes structure to the membrane-thinning window that
    positions signal peptides, stabilises the complex, enhances cleavage activity and
    cleavage-site fidelity, and links the complex to the Sec61 translocon. Catalysis is
    carried out by Sec11a/Sec11c. None of these roles has been tested directly on the
    mouse protein.
  supported_by:
  - reference_id: PMID:10921929
    supporting_text: Spc2p not only enhances the enzymatic activity of the SPC but also facilitates the interactions between different components of the translocation site
  - reference_id: PMID:34388369
    supporting_text: a transmembrane window collectively formed by all subunits locally thins the bilayer
  - reference_id: PMID:39565596
    supporting_text: membrane thinning at the center of SPC is reduced without Spc2
  - reference_id: file:interpro/panther/PTHR13085/PTHR13085-entries.csv
    supporting_text: Q9CYN2,Signal peptidase complex subunit 2,protein,10090,Mus musculus,Mus musculus (Mouse),Spcs2,226,PTHR13085:SF0
  directly_involved_in:
  - id: GO:0016485
    label: protein processing
  in_complex:
    id: GO:0005787
    label: signal peptidase complex
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
proposed_new_terms: []
suggested_questions:
- question: >-
    PAINT propagates signal peptidase complex membership and protein maturation from
    PTN000317824 but not yeast Spc2's contributes_to peptidase activity (SGD IMP,
    PMID:10921929). Should non-catalytic SPC accessory subunits such as Spcs2 carry
    contributes_to signal peptidase activity (GO:0009003), and if so, at which node?
- question: >-
    Is protein targeting to ER (GO:0045047) on SPC subunits a legacy of the former
    placement of signal peptide processing, and should the PTN000317824 IBD be
    replaced by protein processing (GO:0016485)?
- question: Is Spcs2 required for SPC assembly and stability in mammalian cells, as Spc2 is for Spc1 and Sec11 levels in yeast?
suggested_experiments:
- description: >-
    Acute Spcs2 depletion or knockout in mouse cells, followed by quantitative
    N-terminomics, to measure signal-peptide cleavage efficiency and cleavage-site
    usage across substrates with different h-region lengths, together with
    immunoblotting of Sec11a, Sec11c, Spcs1 and Spcs3 to test complex stability.
  hypothesis: Loss of Spcs2 lowers SPC abundance and cleavage fidelity, as Spc2 loss does in yeast.
  experiment_type: knockout and N-terminal proteomics
