    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Mouse Spcs2 is inside the clade the node covers, so the issue is not node
      placement but what the term asserts. The seed experiments measure signal
      peptidase activity, which is captured by protein processing (GO:0016485, already
      accepted). Spc2 does associate with translocon beta subunits (PMID:10921929)
      and SPCS2 is positioned near Sec61beta (PMID:42173868), so the complex works at
      the translocation site, but that is co-translocational processing, not
      targeting. The row is retained as an over-annotation rather than removed in
      deference to the experimental SGD seed and the curator's node placement.
