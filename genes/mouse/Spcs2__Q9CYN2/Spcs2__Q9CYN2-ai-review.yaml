  title: Structure of the human signal peptidase complex reveals the determinants for signal peptide cleavage.
  findings:
  - statement: Cryo-EM structures of the two human SPC paralogs (SEC11A or SEC11C with SPCS1, SPCS2, SPCS3); all subunits contribute to a transmembrane window that thins the bilayer and sets signal-peptide h-region length specificity.
