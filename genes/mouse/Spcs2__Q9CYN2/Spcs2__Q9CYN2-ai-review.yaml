- id: PMID:42173868
  title: Structural basis of signal peptide recognition by the signal peptidase complex.
  findings:
  - statement: In the signal-peptide-bound human SPC, the SPCS2 transmembrane helix makes few contacts with the signal peptide; SPCS2 lies near Sec61beta, placing the SPC next to the Sec61alpha lateral gate.
    supporting_text: The TM helix of SPCS2 displays a limited set of contacts (Fig. 3D), not appearing as a main contact player
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Human ortholog structural study; clarifies that SPCS2 is not the main signal-peptide contact and is positioned toward the translocon.
- id: PMID:39565596
  title: Spc2 modulates substrate- and cleavage site-selection in the yeast signal peptidase complex.
  findings:
  - statement: Yeast cells depleted of or carrying mutant Spc2 show impaired SPC substrate discrimination and cleavage-site selection; MD shows reduced membrane thinning without Spc2.
    supporting_text: discrimination between substrates and identification of the cleavage site by SPC is compromised when Spc2 is absent or mutated
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. Yeast Spc2 is in the same PANTHER subfamily (PTHR13085:SF0) as mouse Spcs2.
- id: PMID:10921929
  title: Interactions between Spc2p and other components of the endoplasmic reticulum translocation sites of the yeast Saccharomyces cerevisiae.
  findings:
  - statement: Spc2 depletion decreases SPC activity in vitro, causes loss of Spc1 and reduced Sec11/Spc3; the SPC associates with Sbh1 and Sbh2, the beta subunits of the Sec61 and Ssh1 complexes.
