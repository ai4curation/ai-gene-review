gene_symbol: Spcs2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Spcs2 (signal peptidase complex subunit 2, also SPC25, the microsomal signal
  peptidase 25 kDa subunit) encodes a 226-residue polytopic endoplasmic reticulum
  membrane protein that is one of three non-catalytic accessory subunits (with Spcs1
  and Spcs3) of the ER signal peptidase complex (SPC). The SPC removes N-terminal
  signal peptides from secretory and membrane preproteins as they are translocated
  into the ER; the serine-protease catalytic site resides in the Sec11a or Sec11c
  subunit, which defines the two SPC paralogs. Spcs2 crosses the ER membrane twice,
  with both termini and almost all of its mass in the cytosol. In orthologs it helps
  build the transmembrane window of the complex that locally thins the bilayer and
  sets selectivity for short signal-peptide hydrophobic regions, stabilises the other
  SPC subunits, enhances cleavage activity and fidelity, and sits close to the Sec61
  translocon beta subunit. In mouse these roles are inferred from orthologs in the
  same PANTHER subfamily (human, dog and yeast); direct experimental evidence for the
  mouse protein is limited to proteomic detection, including N-terminal acetylation.
