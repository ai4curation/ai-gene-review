core_functions:
- molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  description: >-
    Rbpj (CSL) binds CGTGGGAA elements in Notch target enhancers and acts as a switchable transcription
    factor: a repressor with corepressor complexes in the absence of signal, and an activator when bound
    by NICD and Mastermind-like in the CSL-NICD-MAML ternary complex.
  directly_involved_in:
  - id: GO:0007221
    label: positive regulation of transcription of Notch receptor target
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:1990433
    label: CSL-Notch-Mastermind transcription factor complex
  supported_by:
  - reference_id: PMID:8749394
    supporting_text: >-
      The mammalian transcription factor RBP-J kappa binds to the DNA sequence motif CGTGGGAA and is involved
      in the regulation of gene expression
  - reference_id: PMID:18381292
    supporting_text: >-
      CSL is converted from a repressor to an activator through the formation of the CSL-NotchIC-Mastermind
      ternary complex.
  - reference_id: PMID:16287852
    supporting_text: >-
      In the absence of Notch, RBP-Jkappa represses Notch target genes through the recruitment of a corepressor
      complex.
- molecular_function:
    id: GO:0005112
    label: Notch binding
  description: >-
    Rbpj directly binds the RAM domain (and ankyrin repeats) of the Notch1-4 intracellular domains; RAM
    binding allosterically creates the Mastermind docking site.
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:8749394
    supporting_text: >-
      RBP-J kappa and Su(H) bind directly to the RAM23 regions of mouse Notch1 and Drosophila Notch, respectively.
  - reference_id: PMID:18381292
    supporting_text: >-
      Our structural studies reveal a striking distal conformational change in CSL upon RAM binding, which
      creates a docking site for Mastermind to bind to the complex.
proposed_new_terms: []
suggested_questions:
- question: >-
    To what extent do Notch-independent Rbpj functions (PTF1-J complex in pancreas and neural tube) contribute
    to the pleiotropic Rbpj knockout phenotypes currently annotated as Notch pathway outputs?
suggested_experiments:
- description: >-
    Compare phenotypes of an Rbpj allele selectively defective in NICD binding with one defective in Ptf1a
    binding, to separate Notch-dependent and Notch-independent developmental roles.
