id: P31266
gene_symbol: Rbpj
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Rbpj (RBP-Jkappa; CSL/CBF1, the mammalian Suppressor of Hairless) is a ubiquitously expressed nuclear,
  sequence-specific DNA-binding transcription factor that recognises the CGTGGGAA motif and is the central
  DNA-binding effector of canonical Notch signalling. In the absence of Notch signal it represses target
  genes by recruiting corepressor complexes (e.g. SHARP/MINT with CtIP/CtBP, KyoT2, L3MBTL3 with KDM1A/LSD1).
  On Notch activation, the Notch intracellular domain binds Rbpj through its RAM and ankyrin repeats,
  inducing an allosteric change that recruits Mastermind-like coactivators and converts Rbpj into an activator
  within the CSL-NICD-MAML ternary complex, driving transcription of targets such as Hes and Hey genes.
  Independently of Notch, Rbpj also partners with the bHLH factor Ptf1a in the PTF1-J complex in early
  pancreas and neural tube. Loss of Rbpj abolishes canonical Notch signalling and causes pleiotropic defects
  in somitogenesis, cardiovascular development, neurogenesis, lymphocyte and myeloid differentiation and
  stem-cell maintenance.
