  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: is_active_in
  supporting_entities:
  - RGD:620023
  review:
    summary: Comparative M2 localization supports a secondary excitatory/glutamatergic synaptic pool.
    action: KEEP_AS_NON_CORE
    reason: The rat source establishes M2-positive asymmetric contacts, while PMID8389473 explicitly places
      primate M2 at pre- and postsynaptic compartments of asymmetric pathways using excitatory amino acids.
      Together these support the conserved glutamatergic-synapse assignment as an anatomical and orthology
      inference, not direct glutamate colabeling of mouse M2 in the present sources. A muscarinic receptor
      can modulate a glutamatergic synapse without becoming a glutamate receptor; not every asymmetric
      synapse is being equated with a chemically verified glutamatergic contact.
