id: Q9ERZ4
gene_symbol: Chrm2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Chrm2 encodes the M2 muscarinic acetylcholine receptor, a seven-transmembrane GPCR that couples
  acetylcholine recognition to Gi/o-family signaling. It inhibits adenylyl cyclase in appropriate signaling
  contexts and regulates ion channels through G protein subunits. M2 receptors slow cardiac pacemaker
  activity and act as inhibitory presynaptic autoreceptors in selected brain regions, including hippocampus
  and cerebral cortex. Receptor localization and downstream effects vary by cell type, and M4 has the
  predominant autoreceptor role in mouse striatum.
