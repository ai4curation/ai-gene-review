  - RGD:620023
  review:
    summary: M2 contributes to muscarinic control of smooth-muscle contraction as a Gi/o-coupled receptor;
      the effect is context-dependent and need not be the primary contractile M3 pathway.
    action: KEEP_AS_NON_CORE
    reason: M2 contributes to muscarinic control of smooth-muscle contraction as a Gi/o-coupled receptor;
      the effect is context-dependent and need not be the primary contractile M3 pathway. Retain the conserved
      regulatory role rather than describe M2 as a contractile structural protein. Native tissue specificity
      must be distinguished from a universal receptor hierarchy.
    additional_reference_ids:
    - PMID:9990086
    supported_by:
    - reference_id: PMID:9990086
