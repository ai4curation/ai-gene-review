core_functions:
- description: 'Structural matrix constituent of the keratinized hair shaft: as a high-sulfur (HS) KAP, Krtap12-1
    is deposited in differentiating hair-shaft keratinocytes around the trichocyte keratin intermediate filaments
    and becomes cross-linked (chiefly by disulfide bonds for cysteine-rich KAPs) to keratin head/tail domains and
    to other matrix proteins, forming the interfilamentous matrix that gives the fibre its rigidity and mechanical
    resistance.'
