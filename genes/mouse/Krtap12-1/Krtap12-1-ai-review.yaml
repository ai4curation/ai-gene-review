description: Keratin-associated protein 12-1 (Krtap12-1) is a high-sulfur keratin-associated protein (130 aa, KAP
  domain) encoded by an intronless gene in a KAP cluster on mouse chromosome 10, syntenic with the human 21q22.3
  KAP cluster. It is expressed in the skin of neonatal mice, the period of the first hair growth. As a member of
  the mammal-specific cysteine-rich KAP superfamily, it is a matrix protein of the keratinizing hair fibre that
  becomes disulfide cross-linked with hair keratin intermediate filaments and other matrix proteins, contributing
  to the rigidity of the hair shaft. Its precise compartment within the follicle has not been determined in mouse.
