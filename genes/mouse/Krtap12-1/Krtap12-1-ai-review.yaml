  - UniProtKB:P60328
  review:
    summary: ISO identical protein binding transferred from a HuRI yeast two-hybrid self-interaction of a human
      KAP.
    action: MARK_AS_OVER_ANNOTATED
    reason: The donor is a human KAP (KRTAP6-2 or KRTAP12-3) whose self-interaction was detected in the HuRI all-by-all
      yeast two-hybrid screen. Cysteine-rich KAPs are frequent, promiscuous two-hybrid preys, KAP orthology between
      human and mouse is often one-to-many within rapidly duplicated families, and a reducing yeast nucleus does
      not reproduce the disulfide-mediated assembly of the hair matrix. KAP-KAP association in the matrix is plausible
      (Krtap11-1 self-assembles via disulfide cross-links), but a transferred Y2H homodimer says little about this
      protein's role, and its function is better described as structural.
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: Here we present a human 'all-by-all' reference interactome map of human binary protein interactions,
        or 'HuRI'.
    - reference_id: PMID:24439038
      supporting_text: While the association with keratin as well as the cohesive self-assembly of Krtap11-1 appeared
        to be stabilized by disulfide cross-links
    propagation_review:
