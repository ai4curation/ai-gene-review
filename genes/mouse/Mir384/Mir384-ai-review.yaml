id: URS0000655E35_10090
gene_symbol: Mir384
product_type: MIRNA
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mir384 encodes the mouse mir-384 precursor. Its mature product, miR-384-5p, is
  a guide RNA that directs Argonaute/RISC to complementary sites in target
  mRNAs, the generic molecular role shared by all microRNAs. The best-supported
  specific role is in hippocampal synaptic plasticity: miR-384-5p is
  downregulated during long-term potentiation and is required for the
  maintenance phase of LTP and for dendritic spine enlargement, acting through
  repression of the kinase RSK3.
references:
- id: GO_REF:0000115
  title: Automatic Gene Ontology annotation of non-coding RNA sequences through association
    of Rfam records with GO terms
  findings: []
- id: PMID:20439489
  title: miRNA 34a, 100, and 137 modulate differentiation of mouse embryonic stem
    cells.
  findings:
  - statement: >-
      An expression survey of undifferentiated versus differentiating mouse
      embryonic stem cells. Differentiation was induced by LIF withdrawal, and
      138 miRNAs rose during it; only miR-34a, miR-100 and miR-137 were
      functionally tested. mir-384 is not among the tested miRNAs and is not
      discussed in the paper.
    supporting_text: We report that 138 miRNAs are increased on the induction of differentiation
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Correctly identified paper, but it does not support a mir-384 role in LIF
      response. It is the source of a 291-gene IEP batch in which mir-384 is one
      of the untested members.
- id: PMID:25858512
  title: miR-26a and miR-384-5p are required for LTP maintenance and spine enlargement.
  findings:
  - statement: >-
      miR-384-5p is one of two miRNAs the study functionally establishes as
      required for LTP maintenance and spine enlargement, acting via RSK3.
    supporting_text: we demonstrate that miR-26a and miR-384-5p specifically affect
      the maintenance, but not induction, of LTP and different stages of spine
      enlargement by regulating the expression of RSK3
  - statement: >-
      The same study profiled 372 miRNAs and found only 12 changed during LTP,
      describing the remainder as a candidate list.
    supporting_text: presents a catalogue of candidate 'LTP miRNAs'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMC full text checked. miR-384-5p is named in the title and is one of the
      three miRNAs (with miR-26a and let-7a) shown to be required, by
      electrophysiology and time-lapse spine imaging, not by expression alone.
existing_annotations:
- term:
    id: GO:0035195
    label: miRNA-mediated post-transcriptional gene silencing
  evidence_type: IEA
  original_reference_id: GO_REF:0000115
  qualifier: involved_in
  review:
    summary: Rfam2GO annotation of the generic microRNA process; correct for a mir-384
      precursor.
    action: ACCEPT
    reason: >-
      mir-384 is a bona fide microRNA precursor whose mature product guides RISC
      to target mRNAs. This is the gene's core biological process.
- term:
    id: GO:1990830
    label: cellular response to leukemia inhibitory factor
  evidence_type: IEP
  original_reference_id: PMID:20439489
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Batch expression annotation from an embryonic-stem-cell differentiation
      screen in which mir-384 was never tested.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This row is one of 291 IEP annotations to the same term from a single
      paper. The experiment induced ESC differentiation by withdrawing LIF and
      recorded which miRNAs rose; only miR-34a, miR-100 and miR-137 were then
      functionally tested, and mir-384 is not discussed anywhere in the paper.
      A change in abundance after a cytokine is removed is also a poor match for
      "cellular response to leukemia inhibitory factor", which describes a
      cellular reaction to the presence of LIF. The expression observation may be
      real, but nothing here places mir-384 upstream of or within LIF signaling.
    supported_by:
    - reference_id: PMID:20439489
      supporting_text: These results demonstrate that miR-34a, miR-100, and miR-137
        are required for proper differentiation of mouse ESCs
    - reference_id: PMID:20439489
      supporting_text: The suppression of these three miRNAs by anti-miRs caused the
        block of ESC differentiation induced by LIF withdrawal
- term:
    id: GO:0060291
    label: long-term synaptic potentiation
  evidence_type: IEP
  original_reference_id: PMID:25858512
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Correct and central for mir-384, though the source paper supports it by
      functional perturbation rather than by expression alone.
    action: ACCEPT
    reason: >-
      miR-384-5p is one of the two miRNAs this paper demonstrates are required
      for LTP maintenance and spine enlargement, through repression of RSK3. The
      annotation is therefore right, and this row is the positive control for the
      130-member IEP batch drawn from the same paper: the term is justified here
      precisely because the miRNA was functionally tested, which is not true of
      most of the cohort. The evidence code understates the support - the
      underlying experiments are electrophysiology and time-lapse spine imaging
      after miRNA manipulation, which is IMP rather than IEP.
    supported_by:
    - reference_id: PMID:25858512
      supporting_text: we demonstrate that miR-26a and miR-384-5p specifically affect
        the maintenance, but not induction, of LTP and different stages of spine
        enlargement by regulating the expression of RSK3
    - reference_id: PMID:25858512
      supporting_text: the identification of miR-26a, miR-384-5p and let-7a as essential
        for LTP maintenance and enlargement of dendritic spines
- term:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  evidence_type: IDA
  original_reference_id: PMID:25858512
  review:
    summary: >-
      Added so the core molecular function is represented in the annotation
      block. A 3' UTR reporter assay shows miR-384-5p acts through predicted
      binding sites in the RSK3 3' UTR.
    action: NEW
    reason: >-
      GOA carries no molecular function for mir-384 beyond the generic Rfam
      process term. The source paper tested RSK3 as a direct target using
      mCherry reporters carrying the RSK3 3' UTR binding-site sequences, which
      supports mRNA 3'-UTR binding as the mature miRNA's molecular activity.
    supported_by:
    - reference_id: PMID:25858512
      supporting_text: We generated miR-26a and miR-384-5p reporter constructs by
        inserting the sequences surrounding their predicted binding sites in the
        3′ UTR of RSK3 behind the destabilized mCherry gene
