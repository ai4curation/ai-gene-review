suggested_questions:
- question: Which additional mRNAs besides RSK3 does miR-384-5p repress in hippocampal
    neurons during LTP maintenance?
  experts:
  - synaptic plasticity researchers
  - microRNA biologists
- question: Is the requirement for miR-384-5p specific to the maintenance phase of
    LTP, or does it extend to other forms of long-lasting plasticity?
  experts:
  - electrophysiologists
suggested_experiments:
- description: Ago HITS-CLIP in hippocampal slices before and after LTP induction,
    comparing wild-type with miR-384 knockout
  experiment_type: high-throughput sequencing
  hypothesis: miR-384-5p-dependent Argonaute occupancy changes at a defined target
    set during LTP maintenance
- description: Conditional miR-384 deletion in CA1 followed by behavioural memory
    testing
  experiment_type: mouse genetics
  hypothesis: Loss of miR-384-5p impairs long-term memory consolidation, matching
    its requirement for LTP maintenance
