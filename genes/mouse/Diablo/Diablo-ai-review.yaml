id: Q9JIQ3
gene_symbol: Diablo
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Mouse DIABLO/SMAC is a mitochondrial IAP antagonist whose processed N-terminal
  motif and dimeric binding surfaces engage BIR-containing inhibitor-of-apoptosis proteins.
  Release of mature protein from the mitochondrial intermembrane space permits cytosolic antagonism
  of XIAP and facilitates caspase activation and activity. It does not itself cleave caspase
  substrates. Its contribution is stimulus- and cell-dependent: mouse myogenic and neuronal
  studies support apoptotic roles, while endogenous release is insufficient to overcome XIAP
  in some sympathetic-neuron conditions. SMAC can also associate with activated CD40 complexes
  in B cells.'
