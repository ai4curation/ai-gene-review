core_functions:
- description: Mature mouse DIABLO uses its IAP-binding motif to antagonize BIR-containing
    IAP proteins, relieving XIAP restraint of caspase activity in intrinsic apoptotic signaling.
    Direct mouse discovery/cell evidence and human structural/reconstitution evidence support
    the conserved mechanism; endogenous release is not universally sufficient.
