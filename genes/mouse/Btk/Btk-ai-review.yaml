- term:
    id: GO:0004713
    label: protein tyrosine kinase activity
  evidence_type: EXP
  original_reference_id: PMID:7565679
  qualifier: enables
  review:
    summary: BTK’s non-receptor protein tyrosine kinase identity is supported by phosphorylation/activation
      experiments, autophosphorylation mapping and direct substrate assays.
    action: ACCEPT
    reason: 'BTK’s non-receptor protein tyrosine kinase identity is supported by phosphorylation/activation
      experiments, autophosphorylation mapping and direct substrate assays. PMID:7565679 and PMID:8630736
      distinguish activation-loop phosphorylation from the major SH3-domain autophosphorylation site;
      PMID:11007757 assays regulation by BAM11, and PMID:34554188 directly tests NLRP3 phosphorylation.
      The title of the mouse APS paper PMID:10872802 is not grounds to reject its curator-assigned kinase
      assay. PH-mediated membrane recruitment does not make BTK a membrane-spanning receptor kinase. Original
      source: PMID:7565679.'
    supported_by:
    - reference_id: PMID:8630736
      supporting_text: 'We mapped the major Btk autophosphorylation site to Y223 within the SH3

        domain'
    - reference_id: PMID:34554188
    - reference_id: PMID:11007757
    - reference_id: PMID:7565679
