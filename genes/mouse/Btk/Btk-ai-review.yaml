id: P35991
gene_symbol: Btk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'BTK is a Tec-family non-receptor protein tyrosine kinase that couples immune-receptor activation
  to downstream enzymes and adaptor assemblies. Its PH domain recognizes PIP3, promoting recruitment from
  the cytosol to membrane signaling sites. In B cells, BTK supports PLCgamma2 activation, calcium responses
  and developmental progression; nuclear association with Bright/ARID3A provides an additional contextual
  pool. BTK also regulates innate-cell signaling, including NLRP3 assembly and stimulus-dependent cytokine
  or phagocytic responses. These effects depend on receptor, cell type and activation state: BTK can promote
  one response while restraining another.'
