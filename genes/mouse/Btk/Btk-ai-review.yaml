  review:
    summary: 'The traced rat donor experiment is PMID:12220673: Btk siRNA reduces histamine release in
      RBL-2H3 mast cells, with concordant inhibitor results.'
    action: KEEP_AS_NON_CORE
    reason: 'The traced rat donor experiment is PMID:12220673: Btk siRNA reduces histamine release in
      RBL-2H3 mast cells, with concordant inhibitor results. Native mouse mast-cell receptor-dependent
      BTK activation and membrane redistribution in PMID:7518558 independently support the conserved signaling
      context. Retain the secretion attribution as non-core, without relabeling RBL cells as mouse or
      making BTK the histamine-synthetic enzyme.'
