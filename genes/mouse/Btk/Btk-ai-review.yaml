- term:
    id: GO:0001818
    label: negative regulation of cytokine production
  evidence_type: IMP
  original_reference_id: PMID:23544144
  qualifier: involved_in
  review:
    summary: Native mouse Btk-deficient macrophages secrete more TNF-alpha, IL-6 and IL-12p40 after Listeria
      infection in PMID:23544144.
    action: KEEP_AS_NON_CORE
    reason: Native mouse Btk-deficient macrophages secrete more TNF-alpha, IL-6 and IL-12p40 after Listeria
      infection in PMID:23544144. This directly supports negative cytokine regulation in that intracellular-infection
      context, despite BTK promoting inflammatory signaling in other settings. The distinct heat-killed-bacterium
      and uptake results prevent a universal negative-inflammatory-signaling interpretation.
    supported_by:
    - reference_id: PMID:23544144
      supporting_text: 'Btk (-/-) BMMs showed enhanced TNF-α, IL-6

        and IL-12p40 secretion'
