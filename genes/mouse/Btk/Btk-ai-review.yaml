    action: KEEP_AS_NON_CORE
    reason: The rat donor source is PMID:22228807, which directly reports suppression of type I and type
      III hypersensitivity by selective BTK inhibition in rodents and receptor-response inhibition in
      human cells. This supports the conserved contextual immune-response attribution, distinct from BTK’s
      defining kinase activity; it is pharmacological whole-organism evidence, not a direct mouse genetic
      dissection of each hypersensitivity subtype.
