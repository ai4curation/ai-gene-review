    label: positive regulation of glycogen (starch) synthase activity
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 2 (score 14.80) and absent from GOA. AKT1 phosphorylates and inhibits GSK3beta, which relieves
      inhibition of glycogen synthase, so a positive effect on glycogen synthase activity is a real
      downstream consequence of AKT1 signalling. But the effect is indirect - AKT1 does not activate
      the synthase itself - and the term is not annotated. A defensible pathway-level inference stated
      as a direct regulatory relationship; left uncertain.
    supported_by:
