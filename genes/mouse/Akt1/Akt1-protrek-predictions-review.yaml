description: >-
  ProTrek sequence-to-text retrieval for mouse AKT1. Ranks 1 and 3 are exact GOA matches and the whole
  list stays within insulin/growth-factor and metabolic biology, which is the right neighbourhood
  - a marked contrast with the Drosophila Akt1 ortholog in the same cohort, whose entire top five
  was Torso-pathway terms. The two differ only in species, so the failure there was not a property
  of the AGC kinase fold. What neither recovers is the protein serine/threonine kinase activity that
  is this review's sole core function. Assessment: 2 correct not novel (CNN), 1 uncertain (UNC).
