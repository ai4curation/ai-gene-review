description: Keratin-associated protein 6-5 (Krtap6-5; originally Krtap16-8) is a small (78 aa) high glycine-tyrosine
  (HGT) keratin-associated protein of the KAP6 family, one of the mammal-specific matrix proteins of the hair fibre.
  It belongs to the Hoxc13-regulated KAP gene complex on mouse chromosome 16 and, like the other members of that
  complex, is strongly expressed in a narrow zone of the lower and middle cortex of growing hair, with expression
  lost in catagen and telogen. HGT KAPs are incorporated into the interfilamentous matrix that surrounds hair keratin
  intermediate filaments, where they are thought to associate with keratin head domains and contribute to the mechanical
  properties and shape of the hair shaft; the ovine KAP6-1 orthologue influences wool fibre diameter.
