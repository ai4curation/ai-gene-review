    summary: Root MF placeholder (ND) for Krtap6-5; the structural matrix role of this high glycine-tyrosine (HGT)
      KAP is now describable with a specific term.
    action: MODIFY
    reason: 'The ND row records that no MF was annotated when MGI last searched, but KAP-family literature establishes
      that KAPs are structural matrix components of the hair fibre that cross-link hair keratin intermediate filaments.
      GO:0030281 structural constituent of cutaneous appendage (''contributes to the structural integrity of cutaneous
      epidermal structures such as hairs'') captures this. The root term is replaced rather than kept, and no binding
      term is proposed: KAP-keratin association is the mechanism of the structural role, not a separable activity,
      and keratin-binding data exist only for other family members.'
