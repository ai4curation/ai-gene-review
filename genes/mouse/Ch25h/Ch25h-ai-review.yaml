  - SGD:S000003292
  - UniProtKB:Q15800
  review:
    summary: Family-level IBA that does not hold for this subfamily. The IBD sits on PTN000221246, the
      eukaryote-level node of PTHR11863, and is seeded by bona fide C-4 methylsterol oxidases (human
      MSMO1/Q15800, yeast ERG25, Candida and Arabidopsis sterol methyl oxidases, mouse Msmo1). Mouse
      Ch25h is in PANTHER subfamily PTHR11863:SF213 (CHOLESTEROL 25-HYDROXYLASE), whose own PAINT node
      PTN002627316 carries cholesterol 25-hydroxylase activity, while mouse Msmo1 sits in the separate
      SF225 (METHYLSTEROL MONOOXYGENASE 1). The demonstrated Ch25h reaction is side-chain hydroxylation
      at C-25 of cholesterol, a substrate with no C-4 methyl group to oxidise, and no study reports C-4
      methylsterol oxidase activity for Ch25h.
    reason: The histidine-box diiron architecture is shared across PTHR11863, but substrate and position
      specificity diverged between subfamilies, so the deep-node grant over-reaches onto the C-25 hydroxylase
      branch. The committed family review for PTHR11863 reaches the same conclusion, that C-4 methylsterol
      oxidase activity is not a family-wide grant. The claim is wrong for this gene product rather than
      merely broad, so REMOVE rather than TOO_GENERAL.
    action: REMOVE
