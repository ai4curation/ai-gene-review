- term:
    id: GO:0035754
    label: B cell chemotaxis
  evidence_type: IMP
  original_reference_id: PMID:22999953
  qualifier: involved_in
  review:
    summary: Well-grounded mouse genetic annotation. Lymphoid stromal cells use Ch25h and Cyp7b1 to build
      the 7-alpha,25-dihydroxycholesterol gradient that positions activated B cells through EBI2, and
