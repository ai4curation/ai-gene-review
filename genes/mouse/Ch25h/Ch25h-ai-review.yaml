- id: PMID:22999953
  title: Oxysterol gradient generation by lymphoid stromal cells guides activated
    B cell movement during humoral responses.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mouse primary study (Yi et al., Immunity 2012, full text cached). Establishes that
      Ch25h acts with Cyp7b1 in lymphoid stromal cells to generate the EBI2 ligand gradient that positions
      activated B cells, and that Ch25h-deficient mice lose that positioning. Source of both the cholesterol
      25-hydroxylase IMP and the B cell chemotaxis IMP rows; verified by reading the cached full text.
- id: PMID:23273844
  title: Interferon-inducible cholesterol-25-hydroxylase broadly inhibits viral entry
    by production of 25-hydroxycholesterol.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mouse and human primary study (Liu et al., Immunity 2013, full text cached). Added in
      this review as the mouse-side evidence behind the response to type I interferon and antiviral fusion
      rows, which GOA carries only as ISS, ISO and IEA transfers from human. Shows interferon and TLR
      induction of Ch25h in mouse macrophages, Ifnar dependence of that induction, inhibition of virus-cell
      fusion by the product, and increased susceptibility of Ch25h-deficient mouse cells and mice to
      VSV and MHV68.
- id: PMID:29033131
  title: Oxysterol Restraint of Cholesterol Synthesis Prevents AIM2 Inflammasome Activation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mouse primary study (Dang et al., Cell 2017, full text cached). Shows that Ch25h-deficient
      macrophages lose 25-hydroxycholesterol and accumulate sterol biosynthetic intermediates, that Ch25h
      sustains repression of SREBP2, and that a catalytically dead mutant cannot do so. Supports the
      cholesterol 25-hydroxylase IDA row and the negative regulation of cholesterol metabolic process
      IDA row.
- id: PMID:9852097
  title: cDNA cloning of mouse and human cholesterol 25-hydroxylases, polytopic membrane
    proteins that synthesize a potent oxysterol regulator of lipid metabolism.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original cloning and characterisation of the mouse and human enzymes (Lund et al.,
      JBC 1998). Only the abstract is cached, so quotations here are taken from the abstract. The UniProt
      entry attributes the catalytic activity, Fe cofactor, subcellular location, glycosylation, tissue
      specificity and the His242-His243 mutagenesis to this paper with experimental evidence. Foundational
      for the molecular function, the diiron chemistry, the ER membrane localisation and the SREBP-blocking
      effect.
