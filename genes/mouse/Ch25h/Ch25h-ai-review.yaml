suggested_questions:
- question: GO has molecular function terms for oxysterol-forming hydroxylases but no biological process
    term for oxysterol or 25-hydroxycholesterol metabolism, so the product side of this reaction can
    only be expressed as cholesterol metabolic process or lipid biosynthetic process. Would an oxysterol
    metabolic process branch be useful, given the number of genes (Ch25h, Cyp7b1, Cyp46a1, Cyp27a1, Hsd3b7)
    that act on these metabolites?
- question: Is the C-4 methylsterol oxidase IBD at PTN000221246 intended to reach the cholesterol 25-hydroxylase
    subfamily, or should it be pruned at the node separating SF213 from the methylsterol oxidase branch?
    The same question applies to the zymosterol and cholesterol biosynthesis IBDs at PTN002275159.
- question: Ch25h-deficient mice have no gross defect in bulk cholesterol or bile acid homeostasis, yet
    macrophage sterol homeostasis, B-cell positioning and antiviral resistance are all affected. What
    determines which tissues depend on this enzyme?
suggested_experiments:
- description: Measure sterol flux in Ch25h-deficient and catalytically dead knock-in macrophages by isotope
    labelling, to separate the contribution of 25-hydroxycholesterol as an SREBP co-repressor from any
    non-catalytic role of the protein.
- description: Test whether the enzyme acts on sterol substrates other than cholesterol in vitro, in particular
    desmosterol and 7-dehydrocholesterol, which accumulate in the knockout, using purified microsomes
    and a reconstituted electron donor system.
- description: Determine the structure of the enzyme or a close homolog with substrate bound, to establish
    how the diiron centre is positioned relative to C-25 and why the subfamily hydroxylates the side
    chain rather than the sterol nucleus.
- description: Conditional deletion in lymphoid stromal cells versus macrophages, with quantification
    of 7-alpha,25-dihydroxycholesterol gradients, to test whether the chemotactic and the anti-inflammatory
    roles of the enzyme are separable in vivo.
