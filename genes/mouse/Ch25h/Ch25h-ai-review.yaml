id: Q9Z0F5
gene_symbol: Ch25h
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Cholesterol 25-hydroxylase is an intron-less, polytopic endoplasmic reticulum membrane enzyme
  that hydroxylates cholesterol at carbon 25 to form the oxysterol 25-hydroxycholesterol. Unlike most
  sterol hydroxylases it is not a cytochrome P450 but a member of the histidine-box diiron (sterol desaturase/fatty
  acid hydroxylase) superfamily, and conserved histidine clusters are required for catalysis. Its product
  25-hydroxycholesterol acts as a diffusible regulatory lipid with three well-documented outputs in the
  mouse. It suppresses SREBP processing and sterol biosynthetic gene expression, so that macrophages lacking
  the enzyme accumulate cholesterol biosynthetic intermediates and over-produce IL-1beta through AIM2 inflammasome
  activation. It is the first of two enzymatic steps (with CYP7B1) that generate 7-alpha,25-dihydroxycholesterol,
  the ligand of the chemotactic receptor GPR183/EBI2, and lymphoid stromal cells use this pathway to position
  activated B cells in the follicle. And because the gene is induced by type I interferon and Toll-like
  receptor signalling, its product acts as an interferon effector that restricts enveloped viruses by
  altering host membranes and impairing virus-cell membrane fusion. The enzyme is expressed at low levels
  in many tissues, most strongly in lung, and is strongly induced in activated macrophages and dendritic
  cells; mice lacking it have no gross defect in bulk cholesterol or bile acid homeostasis.
