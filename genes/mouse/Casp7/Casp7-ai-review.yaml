core_functions:
- description: CASP7 cleaves apoptotic protein substrates as a processed cysteine endopeptidase.
    Mouse CASP7 overlaps with CASP3 but is not universally interchangeable with it; ICAD cleavage
    and knockout effects depend on species and genetic background.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0097194
    label: execution phase of apoptosis
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:16469926
  - reference_id: PMID:15525783
- description: In defined infection/pore contexts, CASP7 proteolytically matures SMPD1 to promote
    membrane repair. SMPD1 performs the subsequent lipid hydrolysis; CASP7 performs protein
    cleavage. The extracellular location follows the curated localization and proposed pore-repair
    model; the primary study explicitly leaves the exact CASP7–ASM encounter location to be
    validated, rather than directly demonstrating passage and cleavage outside the cell.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0051604
    label: protein maturation
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:35705808
    supporting_text: Note that additional studies will be needed to validate the location of
      the caspase-7 and ASM interaction.
