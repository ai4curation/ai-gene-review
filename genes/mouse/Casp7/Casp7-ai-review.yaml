id: P97864
gene_symbol: Casp7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Casp7 is an Asp-directed cysteine endopeptidase activated by limited proteolysis.
  It cleaves apoptotic substrates in the cytosol and nucleus, with overlapping but nonidentical
  functions relative to Casp3. Mouse CASP7 can efficiently cleave ICAD, and its expression contributes
  to strain-dependent compensation for Casp3 loss; this differs from the human CASP3/CASP7 substrate
  comparison. During some bacterial infections, CASP7 processes acid sphingomyelinase, promoting
  membrane repair and delaying lysis. Passage through membrane pores to encounter the enzyme
  extracellularly is a proposed mechanism; the precise interaction location remains to be validated.
  It also contributes to LPS-induced lymphocyte apoptosis.
