- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:35705808
  qualifier: is_active_in
  review:
    summary: A conditional extracellular or cell-surface-associated CASP7 pool is supported
      by curation and the pore-repair model, with the precise encounter location unresolved.
    action: ACCEPT
    reason: Retain the curated extracellular annotation, supported by the primary pore-repair
      study and curated UniProt localization. PMID:35705808 establishes CASP7-dependent ASM
      cleavage and repair in defined mouse infection/pore contexts, but explicitly proposes
      diffusion through gasdermin D or perforin pores and says the location of the CASP7–ASM
      interaction still needs validation. This is not a direct localization assay of the proposed
      extracellular encounter.
    supported_by:
    - reference_id: file:mouse/Casp7/Casp7-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: secreted into the extracellular milieu by passing through
    - reference_id: PMID:35705808
      supporting_text: We propose a model where caspase-7 diffuses through the gasdermin D pore,
        thereby entering the extracellular space.
    - reference_id: PMID:35705808
      supporting_text: Note that additional studies will be needed to validate the location
        of the caspase-7 and ASM interaction.
