id: P11438
gene_symbol: Lamp1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Lamp1 encodes lysosome-associated membrane glycoprotein 1 (LAMP-1, CD107a), a heavily N-
  and O-glycosylated single-pass type I membrane protein that is, with LAMP-2, the most abundant protein
  of the lysosomal and late endosomal limiting membrane. Its large luminal region of two beta-prism domains
  forms a glycocalyx lining the lysosome, and its short cytoplasmic tail carries a tyrosine-based lysosomal
  sorting signal; the protein cycles through the plasma membrane and is enriched on lysosome-related organelles
  such as cytolytic granules, melanosomes, phagolysosomes and autolysosomes. Its best-defined molecular
  activity, shown for the human orthologue, is direct inhibition of the lysosomal cation/proton leak channel
  TMEM175, which allows the lysosomal lumen to reach the low pH needed for hydrolase activity. Lamp1 also
  binds and stabilizes the lysosomal peptide transporter TAPL/ABCB9, and in natural killer cells supports
  perforin delivery to lytic granules and protects the cells from their own granule contents when exposed
  on the surface after degranulation. Lamp1-null mice are viable and fertile with near-normal lysosomes,
  whereas Lamp1/Lamp2 double deficiency is embryonic lethal with autophagic vacuole accumulation, indicating
  largely redundant functions with LAMP-2.
