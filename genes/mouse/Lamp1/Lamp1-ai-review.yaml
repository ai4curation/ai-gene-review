- term:
    id: GO:0007042
    label: lysosomal lumen acidification
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P11279
  - ensembl:ENSP00000333298
  review:
    summary: Lysosomal lumen acidification via TMEM175 inhibition.
    action: ACCEPT
    reason: By inhibiting TMEM175 proton leak, LAMP proteins enable the lysosomal lumen to reach a lower
      pH. In mouse, Lamp1 loss alone does not change lysosomal pH, consistent with LAMP-2 redundancy,
      so this is a shared LAMP function.
    supported_by:
    - reference_id: PMID:37390818
      supporting_text: This LAMP inhibition mitigates the proton conduction of TMEM175 and facilitates
        lysosomal acidification to a lower pH environment crucial for optimal hydrolase activity
    - reference_id: file:mouse/Lamp1/Lamp1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: acting as a direct inhibitor of the proton channel TMEM175, facilitating lysosomal
        acidification for optimal hydrolase activity
