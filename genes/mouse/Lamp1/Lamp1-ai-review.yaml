core_functions:
- description: Lysosomal membrane glycoprotein that directly binds and inhibits the TMEM175 cation/proton
    leak channel, limiting proton efflux so the lysosomal lumen reaches an acidic pH (shared with LAMP-2).
  molecular_function:
    id: GO:0008200
    label: ion channel inhibitor activity
  directly_involved_in:
  - id: GO:0007042
    label: lysosomal lumen acidification
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  supported_by:
  - reference_id: PMID:37390818
    supporting_text: LAMP-1 and LAMP-2 directly interact with and inhibit the activity of the lysosomal
      cation channel TMEM175
  - reference_id: PMID:37390818
    supporting_text: This LAMP inhibition mitigates the proton conduction of TMEM175 and facilitates lysosomal
      acidification to a lower pH environment crucial for optimal hydrolase activity
  - reference_id: file:mouse/Lamp1/Lamp1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: acting as a direct inhibitor of the proton channel TMEM175, facilitating lysosomal
      acidification for optimal hydrolase activity
  - reference_id: file:mouse/Lamp1/Lamp1-deep-research-manual.md
    supporting_text: The mouse protein carries this by similarity (UniProt FUNCTION, ECO:0000250 from P11279).
suggested_questions:
- question: Does mouse Lamp1 inhibit mouse Tmem175 to the same extent as the human proteins, and why does
    Lamp1 loss alone leave lysosomal pH unchanged in mouse tissues (LAMP-2 compensation versus a minor
    contribution)?
  experts:
  - Youxing Jiang
  - Paul Saftig
- question: Should GO add a child of ion channel inhibitor activity for inhibition of lysosomal proton/cation
    leak channels, and a negative regulation of proton transport term, to describe LAMP-TMEM175 regulation
    precisely?
- question: Is Lamp1 a genuine synaptic vesicle membrane constituent or a co-fractionating endolysosomal
    contaminant in synaptic vesicle preparations?
suggested_experiments:
- description: Measure lysosomal pH and Tmem175 currents in Lamp1/Lamp2 double-deficient mouse fibroblasts
    rescued with wild-type Lamp1 or Lamp1 mutants that cannot bind Tmem175, with and without Tmem175 deletion.
  experiment_type: genetic rescue / lysosomal patch clamp / ratiometric pH imaging
  hypothesis: Lamp1 lowers lysosomal pH in mouse cells through direct Tmem175 inhibition, and this activity
    is redundant with Lamp2.
- description: Compare degranulation-associated perforin binding and apoptosis of Lamp1-/- NK cells reconstituted
    with hinge-glycosylation mutants of Lamp1.
  experiment_type: NK-cell reconstitution / cytotoxicity and apoptosis assay
  hypothesis: The glycosylated hinge of surface Lamp1 shields NK cells from perforin after degranulation.
