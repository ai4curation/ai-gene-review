id: P98154
gene_symbol: Dgcr2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Dgcr2 (also Sez-12, Idd) encodes integral membrane protein DGCR2/IDD, a
  single-pass type I transmembrane protein whose extracellular region carries an
  LDL-receptor class A module, a C-type lectin-like domain and a von Willebrand
  factor type C domain, followed by a single helix and a largely disordered
  cytoplasmic tail. It is expressed broadly at low levels and is developmentally
  upregulated in brain. In mouse brain DGCR2 is concentrated in the postsynaptic
  density, and loss of Dgcr2 reduces dendritic spine density of hippocampal CA1
  pyramidal neurons, excitatory transmission and long-term potentiation. Studies
  with the human orthologue indicate that its extracellular domain binds the
  presynaptic adhesion molecule neurexin-1 in trans and promotes neurexin-1 /
  neuroligin-1 association, making DGCR2 a postsynaptic adhesion protein for
  spine development. Knockdown in developing cortex also perturbs radial
  migration and laminar positioning of projection neurons, and DGCR2 has been
  reported to associate with the Reelin signalling complex. No carbohydrate
  binding by its C-type lectin-like domain has been demonstrated. Dgcr2 lies in
  the 22q11.2 deletion interval, and knockout mice show motor-coordination
  deficits with sparse cerebellar Purkinje cells.
