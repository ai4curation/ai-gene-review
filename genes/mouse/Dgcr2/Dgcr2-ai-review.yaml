- term:
    id: GO:0014069
    label: postsynaptic density
  evidence_type: IDA
  original_reference_id: PMID:37480133
  review:
    summary: >-
      Subcellular fractionation of adult wild-type mouse brain shows endogenous
      DGCR2 concentrated in the postsynaptic density fraction and not in the
      presynaptic membrane fraction; DGCR2 co-localises with PSD-95 puncta in
      cultured hippocampal neurons.
    action: NEW
    reason: >-
      Direct mouse evidence for the synaptic compartment in which DGCR2 acts,
      not captured by GOA. It is consistent with DGCR2's role as the
      postsynaptic partner of presynaptic neurexin-1.
    supported_by:
    - reference_id: PMID:37480133
      supporting_text: we found DGCR2 concentrated in the PSDs, but not in the presynaptic membrane fraction
    - reference_id: PMID:37480133
      supporting_text: Subcellular fractions of adult wt mouse brains were blotted with anti-DGCR2, anti-PSD-95 and anti-synaptophysin (a presynaptic marker).
- term:
    id: GO:0060996
    label: dendritic spine development
  evidence_type: IMP
  original_reference_id: PMID:37480133
  review:
    summary: >-
      In vivo shRNA knockdown of Dgcr2 by in utero electroporation reduced
      spine density of mouse hippocampal CA1 pyramidal neurons; Dgcr2 mutant
      mice show reduced mEPSC frequency and impaired LTP, and blocking the
      DGCR2-neurexin-1 interaction with soluble DGCR2 ectodomain reduced spines.
    action: NEW
    reason: >-
      DGCR2 does part of the work of spine development rather than merely being
      required: its ectodomain forms a trans-synaptic adhesive contact with
      neurexin-1 and promotes neurexin-1/neuroligin-1 association, and the
      ectodomain competition experiment links that adhesive activity directly
      to spine formation. This parallels the annotation of other trans-synaptic
      adhesion proteins to spine and synapse development. The knockdown and
      mutant phenotypes are in mouse; the binding mechanism was shown with human
      DGCR2. Behavioural consequences (anxiety-like behaviour) are not annotated.
    supported_by:
    - reference_id: PMID:37480133
      supporting_text: 2C-E, sh-540, but not its scramble shRNA (sh-540-scr), reduced the spine density of CA1 pyramidal neurons
    - reference_id: PMID:37480133
      supporting_text: These results suggest that inhibition of DGCR2-NRXN1α interaction disrupted spine development, indicating this interaction promotes dendritic spine formation.
- term:
    id: GO:0050839
    label: cell adhesion molecule binding
  evidence_type: ISO
  original_reference_id: PMID:37480133
  review:
    summary: >-
      FLAG-tagged human DGCR2 co-immunoprecipitates neurexin-1 (preferentially
      over neurexin-2, and not neuroligins 1-4 or N-cadherin) through its
      extracellular domain, and DGCR2-expressing cells aggregate with
      neurexin-1beta-expressing cells in trans.
    action: NEW
    reason: >-
      Molecular function underlying DGCR2's synaptic role. The experiments used
      human DGCR2 (P98153) in HEK293T cells, so for mouse this is an ISO
      transfer; human and mouse DGCR2 are orthologues in the same
      single-subfamily PANTHER family PTHR15256:SF6, and the extracellular
      LDLa / C-type lectin-like / VWFC architecture is conserved. Not yet
      demonstrated with mouse protein.
    supported_by:
    - reference_id: PMID:37480133
      supporting_text: Moreover, the ECD deletion mutant of FLAG-hDGCR2 (ΔECD) abolished its interaction with NRXN1α-CFP, while the ICD deletion mutant (ΔICD) didn’t
    - reference_id: PMID:37480133
      supporting_text: These results suggest that the ECD of DGCR2 mediates its transcellular interaction with NRXN1.
core_functions:
- description: >-
    Postsynaptic transmembrane adhesion protein: the DGCR2 ectodomain binds
    presynaptic neurexin-1 in trans and promotes neurexin-1/neuroligin-1
    association, supporting dendritic spine development, excitatory
    transmission and LTP. Postsynaptic-density localisation and the
    spine/LTP requirement are established in mouse; the neurexin-1 binding
    mechanism was shown with the human orthologue (same PANTHER subfamily).
  molecular_function:
    id: GO:0050839
    label: cell adhesion molecule binding
