suggested_questions:
- question: >-
    Does mouse DGCR2 bind neurexin-1 in trans with the same ectodomain
    requirement shown for human DGCR2, and which of its LDLa, C-type
    lectin-like or VWFC modules makes the contact?
- question: >-
    Which proteins form the Reelin complex that DGCR2 joins in developing
    cortex (Reelin itself, ApoER2/VLDLR, DAB1), and does DGCR2 act as a
    co-receptor in Reelin signalling during neuronal migration?
- question: >-
    Does the DGCR2-like C-type lectin domain bind any carbohydrate, given that
    canonical calcium/sugar-binding residues have not been characterised?
suggested_experiments:
- description: >-
    Cell aggregation and co-immunoprecipitation with mouse Dgcr2 ectodomain
    domain-deletion constructs against mouse Nrxn1 isoforms, followed by
    rescue of spine density in Dgcr2-knockdown CA1 neurons with each construct.
  experiment_type: biochemical binding and genetic rescue
- description: >-
    Proximity labelling or co-immunoprecipitation from embryonic mouse cortex
    to define DGCR2 partners in the Reelin receptor complex, with Reelin
    stimulation and DAB1 phosphorylation readouts in Dgcr2-null neurons.
  experiment_type: interaction proteomics
