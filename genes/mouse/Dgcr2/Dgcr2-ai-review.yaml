- id: PMID:37480133
  title: DiGeorge syndrome critical region gene 2 (DGCR2), a schizophrenia risk gene,
    regulates dendritic spine development through cell adhesion.
  findings:
  - statement: Endogenous DGCR2 is enriched in the postsynaptic density fraction of adult mouse brain.
    supporting_text: we found DGCR2 concentrated in the PSDs, but not in the presynaptic membrane fraction
  - statement: In vivo Dgcr2 knockdown reduces CA1 spine density, and Dgcr2 mutant mice have impaired LTP.
    supporting_text: These results suggest that LTP is impaired in Dgcr2 mt mice.
  - statement: The human DGCR2 ectodomain mediates transcellular interaction with neurexin-1 (HEK293T cells).
    supporting_text: These results suggest that the ECD of DGCR2 mediates its transcellular interaction with NRXN1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
