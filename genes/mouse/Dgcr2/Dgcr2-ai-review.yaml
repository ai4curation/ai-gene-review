    supporting_text: These observations indicate that DGCR2 is a novel cell adhesion molecule required for spine development and synaptic plasticity
  - reference_id: PMID:37480133
    supporting_text: we found DGCR2 concentrated in the PSDs, but not in the presynaptic membrane fraction
