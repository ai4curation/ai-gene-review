  review:
    summary: >-
      Transferred from a human DGCR2 IMP annotation to cognition based on
      PMID:23227193, a copy-number-variation survey of Alzheimer's disease and
      mild cognitive impairment cohorts.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The human source paper (full text cached) lists DGCR2 only as one of many
      genes overlapped by a CNV in a single case sample, and that same CNV also
      overlapped HLA-DRA; the paper's only significant gene-level association is
      CHRFAM7A. This does not show that DGCR2 participates in cognition. In mouse,
      Dgcr2 loss alters spine density, LTP and anxiety-like and motor behaviour,
      but cognition is an organismal process far downstream of DGCR2's
      postsynaptic adhesion role. Not removed outright because a broad
      neural-function role is plausible, but this is an over-annotation and the
      human donor row is flagged upstream. The orthology itself is sound (same
      PANTHER subfamily); the weakness is in the source annotation.
    propagation_review:
