  review:
    summary: >-
      Sez-12/Dgcr2 was isolated as a transcript whose expression changes after
      pentylenetetrazol (PTZ) treatment of cultured cortical neurons and is
      transiently down-regulated in mouse brain after PTZ injection.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only observation is a change in Dgcr2 mRNA level after exposure to a
      convulsant drug. An expression change shows that the gene responds
      transcriptionally; it does not show that the gene product does any of the
      work of a response to a xenobiotic, and no later study links Dgcr2
      function to drug responses. The term is not contradicted, but it is an
      over-interpretation of an expression readout. The cached record is
      abstract-only, so this is marked as over-annotated rather than removed.
    supported_by:
    - reference_id: PMID:8630060
      supporting_text: SEZ-12 expression is transiently down-regulated in the mouse brain by injection of PTZ.
