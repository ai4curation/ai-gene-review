suggested_questions:
- question: Should the MGI IMP GO:1902742 'apoptotic process involved in development' (PMID:27170117)
    be withdrawn? The phenotype (more TUNEL/cleaved-caspase-3 cells in Megf10-/- cerebellum) is an accumulation
    of uncleared corpses, and the authors interpret it that way.
- question: Does Megf10 bind phosphatidylserine directly, or recognize apoptotic cells only through C1q
    and other bridging molecules?
- question: How does Megf10 signal to Notch in satellite cells, and is this related to its engulfment
    signalling through the NPxY tail?
