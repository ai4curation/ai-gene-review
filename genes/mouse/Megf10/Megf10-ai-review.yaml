id: Q6DIB5
gene_symbol: Megf10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Megf10 is the mouse ortholog of the C. elegans engulfment receptor CED-1 and Drosophila Draper.
  It is a single-pass type I transmembrane class F scavenger receptor with an EMI domain, EGF-like repeats
  and an NPxY/YxxL cytoplasmic tail. Glial cells, including astrocytes and satellite glial precursors
  of the dorsal root ganglia, use it to recognize and engulf apoptotic neurons, in part through the eat-me
  signal C1q. Astrocytes also use it to engulf synapses during synapse elimination. In the retina, homotypic
  Megf10 signalling repels neighbouring cells of the same type and so spaces starburst amacrine and horizontal
  cells into mosaics. In skeletal muscle it marks quiescent satellite cells and regulates the balance
  between satellite-cell proliferation and differentiation, in part through Notch signalling.
