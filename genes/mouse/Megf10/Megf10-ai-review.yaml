- term:
    id: GO:1902742
    label: apoptotic process involved in development
  evidence_type: IMP
  original_reference_id: PMID:27170117
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:4454190
  review:
    summary: Apoptotic process involved in development (IMP, Iram et al. 2016).
    action: REMOVE
    reason: The phenotype behind this IMP is more TUNEL- and cleaved-caspase-3-positive cells in the P7
      cerebellum of Megf10-/- and Megf10+/- mice. The authors interpret this as a clearance defect, not
      a change in apoptosis. The Figure 1 title in the full text (PMC4863057, read for this review; not
      in the local cache) says that Megf10 "is necessary for apoptotic cell uptake by astrocytes, and
      its deficiency results in accumulation of apoptotic cells in the developing CB". Uncleared apoptotic
      cells accumulate whether or not more cells die. The same paper shows impaired astrocyte phagocytosis
      ex vivo and gain of phagocytosis on Megf10 expression. Megf10 acts in the engulfing cell and does
      none of the work of the apoptotic program. That role is captured by engulfment of apoptotic cell
      (GO:0043652, rows 31-32), which GO's own usage note separates from processes inside the dying cell.
      This is a recurring pattern in which a clearance-defect readout is annotated as the apoptotic process;
      see projects/SPKW/SPKW-APOPTOSIS.md.
    supported_by:
    - reference_id: PMID:27170117
      supporting_text: Megf10-deficient mice have increased apoptotic cells in the developing cerebellum
        and have impaired phagocytosis of apoptotic cells by astrocytes
    - reference_id: PMID:27170117
      supporting_text: identify a novel role for Megf10 in clearance of apoptotic cells in the mammalian
        developing brain
    - reference_id: PMID:27170117
      supporting_text: cells transfected with Megf10 gain the ability to phagocytose apoptotic neurons
