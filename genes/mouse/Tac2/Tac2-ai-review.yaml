- id: file:mouse/Tac2/Tac2-uniprot.txt
  title: UniProtKB entry P55099 (TKNK_MOUSE), Tachykinin-3
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Source of the sequence, processing features and subcellular location used here. Both
      FUNCTION paragraphs are inferences by similarity from rat P08435 and human Q9UHF0, and
      protein existence is "Inferred from homology", so quotes from them record what UniProt
      asserts rather than a mouse measurement; they are used only beside mouse experimental
      evidence. The primary gene name is Tac3, while the record's own MGI cross-reference
      gives the approved symbol Tac2, which is the name this review and the mouse literature
      use.
- id: file:human/TAC3/TAC3-uniprot.txt
  title: UniProtKB entry Q9UHF0 (TKNK_HUMAN), Tachykinin-3
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited only for the human sequence, to establish by inspection that the mature
      neurokinin B decapeptide is identical in mouse and human. That identity is what lets
      the human structural and signalling data be read as data on the same ligand.
- id: PMID:27549338
  title: High-frequency stimulation-induced peptide release synchronizes arcuate kisspeptin
    neurons and excites GnRH neurons.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The strongest mouse evidence for this gene product's molecular function: photostimulated
      release of the endogenous peptide from arcuate Kiss1 neurons produces a slow EPSP in
      neighbouring Kiss1 neurons that an NK3R antagonist blocks and senktide occludes, with
      co-released dynorphin acting presynaptically to inhibit release, and synchronisation of
      the population as the output. Full text available. Note that the same paper shows the
      three-antagonist cocktail is needed for complete abolition, which is the multi-receptor
      point used elsewhere in this review.
- id: PMID:23744641
  title: Neurokinin B activates arcuate kisspeptin neurons through multiple tachykinin
    receptors in the male mouse.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Applied NKB excites ~95% of mouse arcuate kisspeptin neurons, but NK3R-selective
      antagonists do not block it and a cocktail against all three tachykinin receptors is
      required; individual neurons responded directly to all three tachykinins. Primary basis
      for keeping GO:0031837 as a non-core claim and for accepting the parent pathway term.
      Abstract-only cache, so the whole-cell detail is as the abstract states it.
- id: PMID:11226387
  title: Molecular and pharmacological characterization of the murine tachykinin NK(3)
    receptor.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cloning and pharmacology of the mouse receptor: agonist affinities and functional
      potencies, read out as calcium mobilisation, are similar for the mouse and human
      receptors. Used as mouse-side support for the Gq/PLC pathway. The paper's other main
      result, that non-peptide NK3R antagonists are 10-100-fold weaker at the mouse receptor,
      is a caveat for every mouse antagonist experiment cited here. Abstract-only cache.
- id: PMID:37391393
  title: Structural insights into neurokinin 3 receptor activation by endogenous and
    analogue peptide agonists.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cryo-EM structures of NK3R-Gq bound to neurokinin B, substance P and senktide, with
      IP-one accumulation assays. Human proteins, cited here only because the mature
      decapeptide is identical in mouse and human, so these are measurements of the same
      ligand; the receptor-side conclusions are human. Full text available.
- id: PMID:1370820
  title: Direct linkage of three tachykinin receptors to stimulation of both phosphatidylinositol
    hydrolysis and cyclic AMP cascades in transfected Chinese hamster ovary cells.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Rat tachykinin receptors in CHO cells; tachykinins stimulate phosphoinositide hydrolysis
      and, less efficiently, cAMP formation. The experimental basis of rat Tac3's IDA rows and
      so of the GO:0007189 and one GO:0007209 transfer onto mouse. Abstract-only cache.
- id: PMID:32512561
  title: Tachykinin Signaling Is Required for Induction of the Preovulatory Luteinizing
    Hormone Surge and Normal Luteinizing Hormone Pulses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary support for the proposed GO:0033686 row. Acute NK1R or NK3R blockade each
      abolishes the estradiol-induced LH surge in wild-type females; single Tac1 and Tac2
      knockouts show a trend to smaller surges; the double knockout has no surge, no first
      estrus within 45 days of vaginal opening, low-frequency LH pulses and 80% infertility.
      Also the source of the statement that Tac1 is not expressed in Kiss1 neurons, which is
      what lets the double knockout's ligand loss and the thermoregulatory cocktail
      experiment be attributed to this gene's peptide. Full text available.
- id: PMID:25574869
  title: Neurokinin B is critical for normal timing of sexual maturation but dispensable
    for adult reproductive function in female mice.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The phenotypic evaluation of mice lacking this gene: females show delayed vaginal
      opening and first estrus with recovery of cycling and retained fertility, males are
      unaffected. Also the direct ligand-versus-receptor knockout comparison, from which the
      authors infer that NKB can act through other tachykinin receptors when NK3R is absent.
      Abstract-only cache.
- id: PMID:33839770
  title: Characterization of the Action of Tachykinin Signaling on Pulsatile LH Secretion
    in Male Mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The sign caveat on the proposed GO:0033686 row: in gonad-intact males, deleting this
      gene (or Tac1, or Tacr3) increases basal LH pulse frequency and amplitude, and the
      authors read the individual tachykinin systems as dispensable for LH pulse generation
      with compensation elsewhere. Cited for that result, not against the surge data, which
      concerns a different variable. Abstract-only cache.
- id: PMID:21914775
  title: Regulation of NKB pathways and their roles in the control of Kiss1 neurons
    in the arcuate nucleus of the male mouse.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mouse arcuate KNDy neurons express the receptor while GnRH neurons do not, and NK3R
      agonism stimulates gonadotropin secretion and activates KNDy but not GnRH neurons.
      Receptor-side support for the output of the pathway the peptide drives. Abstract-only
      cache.
- id: PMID:29996088
  title: A Neural Circuit Underlying the Generation of Hot Flushes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary support for the proposed GO:0001659 row. Chemogenetic or optogenetic activation
      of arcuate Kiss1 neurons, and of their preoptic fibres alone, raises tail-skin
      temperature and lowers core temperature; preoptic infusion of a neurokinin receptor
      antagonist cocktail prevents it. The paper states why the cocktail was used rather than
      an NK3R-selective antagonist, which is the limitation recorded on the row. Full text
      available.
- id: PMID:28531316
  title: A Comprehensive Method To Quantify Adaptations by Male and Female Mice With
    Hot Flashes Induced by the Neurokinin B Receptor Agonist Senktide.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Receptor-side mouse evidence for the thermoregulatory arm: systemic senktide produces a
      vasomotor-symptom-like response in unrestrained mice, with a fall in core temperature,
      cold-seeking, a rise in tail-skin temperature and Fos in the median preoptic area.
      Agonist pharmacology, so it stands beside the ligand-release experiment rather than in
      place of it. Abstract-only cache.
- id: PMID:30753503
  title: Glutamatergic Neurokinin 3 Receptor Neurons in the Median Preoptic Nucleus
    Modulate Heat-Defense Pathways in Female Mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Defines the receptor-expressing preoptic population in mouse with a Tacr3 reporter and
      shows that losing it raises core temperature, with the neurons glutamatergic and not
      themselves warm-sensitive. Identifies the target cells the peptide acts on; it says
      nothing about the peptide directly. Abstract-only cache.
- id: PMID:19776272
  title: Regulation of gonadotropin-releasing hormone secretion by kisspeptin/dynorphin/neurokinin
    B neurons in the arcuate nucleus of the mouse.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mouse arcuate Kiss1 neurons co-express this gene, dynorphin and the receptor, and all
      are inhibited by estradiol; source of the autosynaptic model later demonstrated
      physiologically in PMID:27549338. Used for the cellular context in the description, not
      as support for an annotation, since co-expression and steroid regulation are not
      functions of the peptide. Abstract-only cache.
- id: PMID:22893725
  title: Increased neurokinin B (Tac2) expression in the mouse arcuate nucleus is an
    early marker of pubertal onset with differential sensitivity to sex steroid-negative
    feedback than Kiss1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Arcuate Tac2 and Tacr3 transcripts rise across puberty in wild-type and
      GnRH-deficient mice, and Tac2 is less sensitive than Kiss1 to estradiol suppression;
      an NK3R antagonist did not block pubertal onset. Expression data, so background for the
      description rather than support for a process term, and a useful counterweight to
      reading rising expression as a trigger. Abstract-only cache.
- id: PMID:12773411
  title: A role for tachykinins in female mouse and rat reproductive function.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Transcript survey of mouse reproductive cells: of the tachykinin and
      tachykinin-receptor genes assayed, only the NK2 receptor transcript was detected in
      mouse sperm. The basis for marking the transferred sperm-motility row as an
      over-annotation in mouse. Abstract-only cache, and a negative RT-PCR result, so it
      bounds rather than refutes the possibility of peptide in mouse sperm.
- id: PMID:2478257
  title: 'Central pressor actions of neurokinin B: increases in neurokinin B contents
    in discrete nuclei in spontaneously hypertensive rats.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Intracerebroventricular NK3 agonists raise blood pressure in rats, partly through
      peripheral vasopressin receptors. The experimental basis of the rat Tac3 annotation that
      seeds the blood-pressure IBA and ISO rows here; central agonist pharmacology, not
      endogenous peptide physiology, and with no mouse counterpart. Abstract-only cache.
- id: PMID:29775595
  title: The Neuropeptide Tac2 Controls a Distributed Brain State Induced by Chronic
    Social Isolation Stress.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Two weeks of social isolation raises this gene and its peptide brain-wide; an NK3R
      antagonist prevents nearly all the behavioural consequences, and enhancing peptide
      expression and release phenocopies isolation in group-housed mice, with region-specific
      requirements. A genuine mouse function of the gene, recorded in the description. Not
      proposed as a GO row: the readouts are whole-animal behavioural states produced by
      region-specific manipulation, which is the system-level kind of claim the NEW rules
      exclude. A curator with the full text might reasonably propose a behaviour term. Full
      text available.
- id: PMID:24976214
  title: A role for Tac2, NkB, and Nk3 receptor in normal and dysregulated fear memory
    consolidation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      This gene, in centromedial amygdala neurons, is required for normal fear-memory
      consolidation: raising its expression enhances consolidation, an NK3R antagonist blocks
      that, and silencing the Tac2 neurons impairs it. As with the isolation work, recorded in
      the description but not proposed as an annotation; later work reports the effect is
      sex-dependent, which I did not read. Full text available.
core_functions:
- description: >-
    Processed and C-terminally amidated to the decapeptide neurokinin B, which is secreted
    and acts in the extracellular space as the preferred agonist of the neurokinin-3
    receptor (Tacr3), activating Gq/11, phospholipase C and intracellular calcium; in mouse
    neurons it also engages the other two tachykinin receptors, so blocking NK3R alone does
    not abolish its action.
