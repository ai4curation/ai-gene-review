proposed_new_terms: []
suggested_questions:
- question: >-
    Which of the three tachykinin receptors carries which part of this peptide's action in
    the mouse? Its excitation of arcuate kisspeptin neurons survives NK3R blockade, and the
    ligand knockout has a maturation phenotype the receptor knockout lacks, so some of the
    peptide's reproductive signalling must run through NK1R or NK2R; which, and in which
    neurons, is unresolved.
- question: >-
    Do the reproductive and thermoregulatory arms use separate projections of the same
    arcuate neurons, or separate subpopulations? Both arms are driven by activating the same
    Kiss1 population, and a projection-specific manipulation would separate them.
suggested_experiments:
- description: >-
    Delete Tac2 conditionally in arcuate Kiss1 neurons in adulthood, then measure core and
    tail-skin temperature, thermal preference, pulsatile LH and the estradiol-induced LH
    surge, with senktide challenge as a positive control for an intact receptor; compare
    with preoptic infusion of an NK3R-selective antagonist at a dose validated against the
    10-100-fold lower mouse antagonist affinity.
  hypothesis: >-
    The peptide itself, and not merely the integrity of the neurons that make it, is
    required for the heat-loss response and for the preovulatory surge, and the two arms can
    be separated pharmacologically at the receptor level.
- description: >-
    Record from identified arcuate kisspeptin neurons in Tac2-null and wild-type slices and
    ask which tachykinin receptor antagonists abolish the residual response to applied
    substance P and neurokinin A, pairing this with quantification of Tacr1, Tacr2 and Tacr3
    transcripts in those neurons in both genotypes.
  hypothesis: >-
    The mildness of the Tac2-null phenotype comes from the other tachykinins acting on NK1R
    and NK2R in the same neurons, which should be measurable as a residual, NK3R-independent
    slow excitation and, perhaps, as upregulated receptor transcripts.
knowledge_gaps:
- gap_statement: >-
    It is not known whether this peptide is itself required for normal body-temperature
    regulation in the mouse, or which receptor it uses to engage the heat-loss effectors:
    every experiment to date either activates the neurons that release it, blocks all three
    tachykinin receptors at once, or acts on the receptor with an agonist.
  boundary: >-
    What is established: activating arcuate kisspeptin neurons, or only their preoptic
    fibres, raises tail-skin temperature and lowers core temperature; infusing a cocktail of
    antagonists against all three neurokinin receptors into the preoptic area prevents that;
    a selective NK3R agonist reproduces the whole episode in unrestrained mice; and the
    median preoptic NK3R population is glutamatergic and required for normal core
    temperature. What is missing: a loss-of-function test of thermoregulation in mice lacking
    the peptide (the published Tac2-null lines were phenotyped for reproduction), a
    receptor-selective version of the preoptic blockade, and the identity of the efferent
    pathway from the preoptic neurons to the cutaneous vasculature.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This is the arm of the peptide's biology that NK3R antagonists act on clinically, so
    whether the ligand is necessary, and through which receptor, sets what a mouse model of
    that pharmacology can show.
  resolution: >-
    Phenotype Tac2-null and conditionally deleted mice for core and tail-skin temperature and
    thermal preference, repeat the preoptic blockade with receptor-selective antagonists at
    mouse-appropriate doses, and map the output of the median preoptic NK3R neurons to the
    sympathetic premotor nuclei controlling cutaneous vasomotion.
  provenance:
  - reference_id: PMID:29996088
    supporting_text: Because there are three neurokinin receptors (NK1R, NK2R, and NK3R), and NkB has some affinity for all of them, we infused a cocktail of antagonists for all three
  - reference_id: PMID:30753503
    supporting_text: Loss of MnPO NK3R neurons increased the core temperature (TCORE) during the light phase, with the frequency distributions indicating a regulated shift in the balance point.
- gap_statement: >-
    Why loss of this peptide is so much milder in the mouse than in human is unresolved:
    which receptors or circuits substitute for it, and whether the same reserve exists in
    the human hypothalamus.
  boundary: >-
    What is established: Tac2-null females have delayed sexual maturation but recover cycling
    and are fertile, and males are unaffected; the peptide's excitation of arcuate kisspeptin
    neurons is only fully blocked by antagonists against all three tachykinin receptors;
    removing this peptide together with substance P and neurokinin A abolishes the
    preovulatory LH surge and leaves most females infertile; and the ligand knockout has a
    maturation phenotype that the receptor knockout lacks. What is missing: direct evidence
    that NK1R or NK2R on the arcuate neurons carries the load when this peptide is absent,
    and any measurement of that reserve in human tissue, where loss of the orthologous
    peptide causes congenital hypogonadotropic hypogonadism.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The mouse is the main model for the neurokinin B arm of the GnRH pulse generator, so
    knowing what compensates sets the limits of what the mouse null can test, and bears on
    why the human phenotype is severe and often reversible.
  resolution: >-
    Combine Tac2 deletion with NK1R and NK2R blockade or deletion in the arcuate kisspeptin
    neurons and measure pulsatile LH, the surge and the slow excitation; compare tachykinin
    receptor expression in those neurons between mouse and human hypothalamus.
  provenance:
  - reference_id: PMID:23744641
    supporting_text: the activation of kisspeptin neurons by NKB was only blocked completely by a cocktail of antagonists against all 3 tachykinin receptors
  - reference_id: PMID:25574869
    supporting_text: suggesting that in the absence of the NKB receptor, NKB may regulate the timing of sexual maturation through other tachykinin receptors.
