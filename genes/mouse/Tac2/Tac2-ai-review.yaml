- term:
    id: GO:0033686
    label: positive regulation of luteinizing hormone secretion
  evidence_type: IMP
  original_reference_id: PMID:32512561
  qualifier: involved_in
  review:
    summary: >-
      Proposed: the peptide released by arcuate KNDy neurons synchronises that population
      through NK3R and shapes the pulsatile kisspeptin drive onto GnRH neurons, so removing
      it or blocking its receptor reduces or abolishes the preovulatory luteinizing hormone
      surge.
    action: NEW
    reason: >-
      The gene's best-established mouse physiology is not captured by any existing row, all
      of which are signalling-pathway or binding terms. Mechanism: high-frequency activity in
      arcuate Kiss1 neurons releases NKB, which produces a Gq/NK3R-mediated slow EPSP in
      neighbouring Kiss1 neurons and synchronises them, which the authors identify as the
      excitatory drive onto GnRH neurons (PMID:27549338); applied NKB excites ~95% of those
      neurons (PMID:23744641), and NK3R agonism raises gonadotropin secretion
      (PMID:21914775). Loss of function: acute blockade of the peptide's receptor abolishes
      the estradiol-induced LH surge in wild-type females, deleting the gene reduces the
      surge's magnitude, and deleting it together with Tac1 abolishes the surge and leaves
      80% of females infertile (PMID:32512561); Tac2-null females also show delayed sexual
      maturation (PMID:25574869). Participation test: the peptide is the signalling molecule
      that performs the synchronising step on NK3R, so it does part of the work of the
      regulatory process rather than merely being required downstream. Comparator check
      (QuickGO, 2026-11-13): mouse Kiss1, the other KNDy ligand, carries GO:0033686 (IBA and
      ISO), and mouse Tacr3 carries it by transfer from rat, so GO practice puts this term on
      the ligand as well as the receptor; the companion Tacr3 review accepts it, and the
      human TAC3 review proposes it, so the set is annotated consistently. Caveats, stated
      rather than hidden: the single knockout's effect on the surge is a trend, because the
      other tachykinin system compensates; in gonad-intact males deleting the peptide
      increases basal LH pulse frequency and amplitude (PMID:33839770); and in the absence of
      estrogen NK3R activation suppresses LH instead. The positive direction therefore rests
      on the surge experiments and the agonist data, not on basal pulsatility.
    additional_reference_ids:
    - PMID:27549338
    - PMID:23744641
    - PMID:21914775
    - PMID:25574869
    - PMID:33839770
    supported_by:
    - &surge_antagonist
      reference_id: PMID:32512561
      supporting_text: Both antagonists individually were able to block the LH surge
    - &surge_single_ko
      reference_id: PMID:32512561
      supporting_text: The absence of one of the tachykinin systems reduces the magnitude of the LH surge
    - &double_ko
      reference_id: PMID:32512561
      supporting_text: females did not show signs of puberty onset (first estrus) within 45 days after vaginal opening, they displayed a low frequency (but normal amplitude) of LH pulses, and 80% of them remained infertile
    - &synchronization
      reference_id: PMID:27549338
      supporting_text: Therefore, our findings provide the first evidence that Kiss1ARH neurons can synchronize via NKB/Dyn auto-excitation/inhibition to provide an excitatory drive (via Kiss1AVPV/PeN neurons) to GnRH neurons for stimulating GnRH neuronal activity and subsequent GnRH release.
    - &senktide_gonadotropin
      reference_id: PMID:21914775
      supporting_text: senktide, an agonist for the NKB receptor (neurokinin 3 receptor, encoded by Tacr3), stimulates gonadotropin secretion
    - &tac2ko_females
      reference_id: PMID:25574869
      supporting_text: Tac2-/- females had profound delays in sexual maturation, with time to vaginal opening and first estrus occurring significantly later than controls
- term:
    id: GO:0001659
    label: temperature homeostasis
  evidence_type: IDA
  original_reference_id: PMID:29996088
  qualifier: involved_in
  review:
    summary: >-
      Proposed: the peptide released from arcuate kisspeptin-neuron terminals in the preoptic
      area engages heat-loss effectors, so activating those neurons raises cutaneous blood
      flow and lowers core temperature, and blocking neurokinin receptors in the preoptic
      area prevents it.
    action: NEW
    reason: >-
      A second mouse arm of this peptide's physiology, independent of the reproductive one and
      likewise uncaptured by any existing row. Sufficiency, on the peptide side: chemogenetic
      or optogenetic activation of arcuate Kiss1 neurons, and of their fibres in the preoptic
      area alone, raises tail-skin temperature and lowers core temperature, and infusing
      neurokinin receptor antagonists into the preoptic area beforehand prevents the response
      (PMID:29996088). Receptor side, in mouse: a selective NK3R agonist reproduces the whole
      episode in unrestrained mice, and ablating the median preoptic NK3R population raises
      core temperature (PMID:28531316, PMID:30753503). Participation test: the peptide
      performs a signalling step on receptors in the thermoregulatory circuit, so it does part
      of the work rather than being acted upon. Limitation, which is why the row is phrased
      as participation in temperature homeostasis and not as a specific heat-dissipation
      claim: the antagonist infusion used a cocktail against all three tachykinin receptors,
      for the stated reason that NKB binds all three, so it establishes that a tachykinin
      released by these neurons carries the signal rather than isolating NK3R; attribution to
      this gene's product rests on it being the tachykinin those neurons express, Tac1 not
      being expressed in Kiss1 neurons (PMID:32512561). No experiment yet removes the peptide
      and measures temperature, which is recorded as a knowledge gap. Term choice: GO:0001659
      is what the mouse corpus uses for claims of this kind, including GPCRs annotated from
      perturbation data, whereas GO:0031653 heat dissipation and its regulation terms carry no
      annotations in any species (QuickGO, 2026-11-13); the companion Tacr3 review used the
      same term for the receptor.
    additional_reference_ids:
