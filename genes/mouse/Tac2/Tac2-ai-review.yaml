id: P55099
gene_symbol: Tac2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Tac2 encodes preprotachykinin-B, a 116-residue secretory precursor that is cleaved at
  flanking dibasic sites and C-terminally amidated to release neurokinin B (NKB,
  neuromedin K; residues 82-91, DMHDFFVGLM-NH2), a member of the tachykinin neuropeptide
  family defined by the C-terminal Phe-X-Gly-Leu-Met-NH2 motif. The mature decapeptide is
  identical to human neurokinin B. NKB is secreted and acts from the extracellular side on
  the neurokinin-3 receptor (NK3R, the Tacr3 product), its preferred receptor, which it
  couples to Gq/11, phospholipase C and intracellular calcium; in mouse neurons it also
  acts through the other two tachykinin receptors, so NK3R antagonists alone do not
  abolish its effects. The peptide is made by neurons of the hypothalamic arcuate nucleus
  that also make kisspeptin and dynorphin (KNDy neurons): action-potential-driven release
  of NKB from their terminals produces a slow, NK3R- and Gq-mediated excitation of
  neighbouring KNDy neurons, synchronising the population and shaping the pulsatile
  kisspeptin drive onto gonadotropin-releasing hormone neurons. Accordingly, blocking
  NK3R blocks the preovulatory luteinizing hormone surge, and mice lacking the peptide
  mount a smaller surge; Tac2-null females show delayed vaginal opening and first estrus
  with recovery and retained fertility, while Tac2-null males are unaffected, a much
  milder picture than human neurokinin B deficiency and one attributed to the other
  tachykinin ligand-receptor systems carrying part of the load. Arcuate Tac2 expression
  rises across puberty and is suppressed by estradiol. A second, thermoregulatory arm runs
  from the same neurons to the preoptic area: activating arcuate kisspeptin neurons raises
  tail-skin temperature and lowers core temperature, and this is prevented by infusing
  neurokinin receptor antagonists into the preoptic area. The peptide is also expressed
  elsewhere in the brain, where it has distinct roles: Tac2 neurons of the centromedial
  amygdala are required for normal fear-memory consolidation, and chronic social isolation
  raises Tac2 and neurokinin B brain-wide, with an NK3R antagonist preventing most of the
  resulting behavioural changes. A pressor action and a role in sperm motility, reported
  from rat central agonist injection and from human spermatozoa respectively, are not
  established for the mouse peptide.
