  review:
    summary: IMP from the Gata3 conditional-knockout paper (PMID:17151017), attached to Krtap21-1 but with a Gata3
      allele (MGI:3696958) as the mutant; the phenotype is Gata3's.
    action: REMOVE
    reason: PMID:17151017 describes K14-Cre deletion of Gata3; the WITH/FROM MGI:3696958 is a Gata3 targeted (floxed)
      allele, Gata3<tm3Gsv>, at MGI. No Krtap21-1 mutant was made, and Krtap21-1 enters the study only as a Gata3-dependent
      transcript. The defects (delayed hair growth, abnormal follicle organization, irregular pigmentation, aberrant
      postnatal growth, altered proliferation and signalling) therefore cannot be attributed to Krtap21-1, a structural
      hair matrix protein. All nine IMP annotations from this paper are attached to Krtap21-1 and none to Gata3, consistent
      with a DB_Object_ID error.
    supported_by:
    - reference_id: PMID:17151017
      supporting_text: Here, we describe a conditional Gata3-/- mouse (K14-Gata3-/-) in which Gata3 is specifically
        deleted in epidermis and hair follicles.
    - reference_id: PMID:17151017
      supporting_text: K14-Gata3-/- mice show aberrant postnatal growth and development, delayed hair growth and
        maintenance, abnormal hair follicle organization and irregular pigmentation.
