        rows to Gata3 (MGI:95663), checking each term against the Gata3 mutant phenotypes, or delete them.
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: Root MF placeholder (ND) for Krtap21-1; the structural matrix role of this high glycine-tyrosine (HGT)
      KAP is now describable with a specific term.
    action: MODIFY
    reason: 'The ND row records that no MF was annotated when MGI last searched, but KAP-family literature establishes
      that KAPs are structural matrix components of the hair fibre that cross-link hair keratin intermediate filaments.
      GO:0030281 structural constituent of cutaneous appendage (''contributes to the structural integrity of cutaneous
      epidermal structures such as hairs'') captures this. The root term is replaced rather than kept, and no binding
      term is proposed: KAP-keratin association is the mechanism of the structural role, not a separable activity,
      and keratin-binding data exist only for other family members.'
    proposed_replacement_terms:
    - id: GO:0030281
      label: structural constituent of cutaneous appendage
    supported_by:
    - reference_id: file:mouse/Krtap21-1/Krtap21-1-uniprot.txt
      supporting_text: In the hair cortex, hair keratin intermediate filaments are embedded in an interfilamentous
        matrix, consisting of hair keratin-associated proteins (KRTAP), which are essential for the formation of
        a rigid and resistant hair shaft through their extensive disulfide bond cross-linking with abundant cysteine
        residues of hair keratins.
    - reference_id: PMID:16382671
      supporting_text: Hair keratin-associated proteins (KAP) are a major component of the hair fiber, and play
        crucial roles in forming a strong hair shaft through a cross-linked network with keratin intermediate filaments
        (KIF), which are produced from hair keratins.
    - reference_id: PMID:22298953
      supporting_text: These filaments have a matrix surrounding them, that contains the keratin-associated proteins
        (KAPs), which cross-link with the IFs through extensive disulfide bonding
    - reference_id: PMID:29797274
      supporting_text: Thus it is the crosslinking that occurs between the cysteines in the keratins and KAPs that
        is an important determinant in the functionality of wool and hair fibres.
- term:
