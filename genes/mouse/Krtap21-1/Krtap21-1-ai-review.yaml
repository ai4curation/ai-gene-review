    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    summary: Root CC placeholder (ND) for Krtap21-1; KAPs reside in the keratin filament matrix.
    action: MODIFY
    reason: KAPs are synthesized in differentiating hair cortex/cuticle cells and are embedded in, and covalently
      cross-linked to, the hair keratin intermediate filament network. GO keratin filament (GO:0045095), the CC
      used for the KAP family by InterPro2GO, is the appropriate replacement for the uninformative root.
    proposed_replacement_terms:
