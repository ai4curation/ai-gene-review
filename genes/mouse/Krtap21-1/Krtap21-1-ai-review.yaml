id: Q925H4
gene_symbol: Krtap21-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Keratin-associated protein 21-1 (Krtap21-1; originally Krtap16-7) is a 128-aa high glycine-tyrosine
  (HGT) keratin-associated protein of the KAP21 family, encoded in the Hoxc13-regulated KAP gene complex on mouse
  chromosome 16. It is strongly expressed in a narrow zone of the lower and middle cortex of developing and cycling
  hair, with expression lost in catagen and telogen, and is downregulated in hair follicles lacking Gata3. As an
  HGT KAP it is a matrix protein of the keratinizing hair cortex that associates with hair keratin intermediate
  filaments and contributes to hair shaft structure; it is a downstream structural product of the follicle differentiation
  programme rather than a regulator of follicle development.
existing_annotations:
- term:
    id: GO:0001942
    label: hair follicle development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2157767
  - PANTHER:PTN002526071
  review:
    summary: IBA hair follicle development whose only experimental donor is Krtap21-1 itself, i.e. the mis-attached
      Gata3-knockout IMP.
    action: REMOVE
    reason: The PAINT node PTN002526071 lists MGI:2157767 (Krtap21-1) as its experimental donor. That donor annotation
      is the IMP from the Gata3 conditional-knockout study (PMID:17151017) in which the mutant allele is a Gata3
      allele, so the node has no valid experimental grounding. Biologically, KAP21 proteins are structural matrix
      products of differentiated cortical cells, expressed only from mid-anagen in the keratinizing zone; they are
      not known to act in follicle morphogenesis or cycling. Removal is argued on the donor evidence, not on donor
      count.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      source_entities:
      - source_id: PANTHER:PTN002526071
        source_status: SOURCE_BAD
        comment: IBD node whose only listed experimental donor is the mis-attached Krtap21-1 IMP.
      - source_id: MGI:MGI:2157767
        source_label: Krtap21-1
        source_status: SOURCE_BAD
        comment: Donor IMP (PMID:17151017) uses the Gata3 allele MGI:3696958, so it is Gata3 evidence.
    supported_by:
    - reference_id: PMID:17151017
      supporting_text: Here, we describe a conditional Gata3-/- mouse (K14-Gata3-/-) in which Gata3 is specifically
        deleted in epidermis and hair follicles.
    - reference_id: PMID:15385554
      supporting_text: All Krtap16 genes exhibit strong expression in a narrowly defined pattern restricted to the
        lower and middle cortical region of the hair shaft in both developing and cycling hair.
    source_defects:
    - defect_type: OTHER
      resource: GO_CENTRAL
      record: PANTHER:PTN002526071
      requested_change: CHECK
      asserted_value: GO:0001942
      cause: OTHER
      confidence: PROBABLE
      explanation: The IBD for hair follicle development at PTN002526071 appears to rest on the Krtap21-1 IMP from
        PMID:17151017, which uses a Gata3 allele (MGI:3696958) and is a mis-attached annotation. If that is the
        only experimental support, the IBD should be withdrawn.
- term:
    id: GO:0001942
    label: hair follicle development
