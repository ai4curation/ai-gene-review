core_functions:
- description: >-
    Endothelial-autonomous requirement for postnatal retinal sprouting angiogenesis, shown
    experimentally in mouse by inducible endothelial-specific knockout. Capsl is needed for normal
    endothelial proliferation, tip-cell polarity and vascular progression. The molecular activity
    behind this requirement is unknown. Human-cell data point to maintenance of MYC protein levels.
  directly_involved_in:
  - id: GO:0001935
    label: endothelial cell proliferation
  - id: GO:0043542
    label: endothelial cell migration
  supported_by:
  - reference_id: PMID:39264149
    supporting_text: The results showed a strongly reduced proliferation of Capsl-defective ECs compared
      to that of Ctrl (Figure 4A).
  - reference_id: PMID:39264149
    supporting_text: Conversely, in the retinae of iECKO mice, the nuclei of tip ECs appeared more spherical
      and did not orient toward the avascular area (Figure 4C).
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity by which Capsl supports endothelial proliferation and migration is
      unknown. It is not known whether the MYC protein decrease is direct (for example through protein
      stability) or secondary to a cytoskeletal or ciliary role. MYC levels have not been measured in
      mouse retinal endothelium.
    gap_kind:
    - BIOLOGY
- description: >-
    EF-hand protein with two predicted calcium-binding loops (EF-hands 1 and 2). Calcium binding is
    inferred from domain architecture and the calcium-loaded structure of the paralog calcyphosin. It
    has not been measured for Capsl.
  molecular_function:
    id: GO:0005509
    label: calcium ion binding
  supported_by:
  - reference_id: file:mouse/Capsl/Capsl-uniprot.txt
    record_section: ["FT:BINDING"]
    supporting_text: /ligand="Ca(2+)"
  - reference_id: PMID:18775726
    supporting_text: The crystal structure of Ca(2+)-loaded calcyphosine was determined up to 2.65 A resolution
      and reveals a protein containing two pairs of Ca(2+)-binding EF-hand motifs.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is mouse Capsl a lumenal microtubule inner protein of the ciliary transition zone, as reported
    for the bovine ortholog? If so, does its endothelial requirement act through the endothelial
    primary cilium, or through an unrelated cytoplasmic role?
- question: >-
    Does Capsl bind calcium with physiologically relevant affinity, and does calcium change its
    microtubule association?
- question: >-
    Should the MGI vasculogenesis IMP (PMID:39264149) be retired, given that deletion was induced at
    P1-P3 and only postnatal retinal angiogenesis was assessed?
suggested_experiments:
- description: >-
    Immunolocalize endogenous Capsl, or a knock-in tag, in mouse tracheal multiciliated cells and in
    retinal endothelial primary cilia, with transition-zone markers (e.g. CEP290, RPGRIP1L), to test
    the transition-zone localization inferred from the bovine ortholog.
  experiment_type: immunofluorescence localization
- description: >-
    Measure MYC protein and mRNA in sorted retinal endothelial cells from iECKO and control mice, and
    test whether endothelial Myc overexpression rescues the retinal sprouting defect.
  experiment_type: genetic rescue
- description: >-
    Measure calcium binding of recombinant mouse Capsl (ITC or fluorescence titration), using EF-hand
    1 and 2 loop mutants as controls.
  experiment_type: biophysical binding assay
