- id: PMID:39264149
  title: Dysfunction of Calcyphosine-Like gene impairs retinal angiogenesis through
    the MYC axis and is associated with familial exudative vitreoretinopathy.
  findings:
  - statement: Inducible endothelial-specific deletion of Capsl in mouse (Pdgfb-iCreER, tamoxifen
      P1-P3) delays retinal vascular progression, reduces vessel density, branching, tip cells and
      filopodia, and reduces endothelial proliferation.
    supporting_text: the radial vascular growth, vessel density, and vascular branching were dramatically
      reduced in P5 iECKO retina relative to Ctrl mice
  - statement: The retinal phenotype is endothelial-autonomous. Astrocytes, VEGFA, pericytes, barrier
      integrity and ECM are normal.
    supporting_text: In conclusion, EC-specific knockout of Capsl may mainly lead to defects in retinal
      vascular ECs rather than other vascular-associated cells.
  - statement: The vascular defect is transient and largely resolves by P21.
    supporting_text: By P21, EC growth was closely resembling control retinas in iECKO mice when angiogenesis
      almost complete
  - statement: In human retinal endothelial cells, CAPSL knockdown lowers MYC protein but not MYC mRNA.
    supporting_text: Notably, the depletion of CAPSL significantly decreased the protein level of MYC,
      rather than the mRNA level in HRECs (Figure 7G).
  - statement: CAPSL knockdown does not alter Norrin/beta-catenin (TopFlash) reporter activity.
    supporting_text: These results indicated that CAPSL was not a major player in Norrin/β-catenin signaling
      to regulate retinal vascular development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (eLife, PMC11392532). This is the only in vivo mouse study and the source of all
      MGI IMP rows. The mouse data (iECKO retina, lung RT-qPCR) are separated here from the human-cell
      data (HREC knockdown, MYC protein, cytoskeletal proteins, TopFlash). The subcellular localization
      statement cites the Human Protein Atlas, and its ICC used overexpressed human CAPSL in 293T
      cells. Neither is mouse localization evidence.
- id: PMID:31186450
  title: Calcyphosine-like (CAPSL) is regulated in Multiple Symmetric Lipomatosis and is involved in Adipogenesis.
  findings:
  - statement: Capsl knockout and overexpressing mouse 3T3-L1 preadipocyte lines show altered
      adipogenic differentiation, lipid accumulation and autophagy markers.
    supporting_text: CapslKO cells showed enhanced propensity for differentiation, while CapslOE cells showed
      no proper lipid accumulation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. This is the second experimental study of the mouse gene, but it uses a cell
      line (3T3-L1) rather than an animal. The phenotype (more differentiation on knockout) suggests a
      negative effect on adipogenesis, but there is no mechanism and no in vivo confirmation. It is not
      used to propose a GO term: it reports a cell-line phenotype, not an activity, and the direction
      differs between knockout and overexpression readouts.
- id: PMID:18775726
  title: Crystal-structure and biochemical characterization of recombinant human calcyphosine delineates
    a novel EF-hand-containing protein family.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Structure of the paralog calcyphosin (CAPS, PANTHER PTHR34524:SF2), not CAPSL (SF5). Used only
      for the family-level two-EF-hand-pair, calcium-loaded architecture. Not used for any
      subfamily-specific function.
- id: DOI:10.64898/2026.06.11.731632
  title: Structure of the mammalian ciliary transition zone microtubule doublet
  findings:
  - statement: In bovine tracheal cilia, CAPSL is a lumenal microtubule inner protein of the
      transition-zone doublet, and it stabilizes microtubules in vitro.
    supporting_text: We identify the calcium-binding protein CAPSL as a lumenal MIP that forms a pseudo-helical
      spiral and stabilizes microtubules
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      bioRxiv preprint (2026); only the abstract is cached. The native structure is from bovine
      (Bos taurus) tracheal cilia, so this is ortholog evidence, not mouse evidence. Bovine CAPSL
      and mouse Capsl are both classed in PANTHER PTHR34524:SF5. It is used only for the
      description, suggested questions and experiments. It is not used to assert a mouse
      localization or activity, because it is unreviewed, abstract-only, and from another species.
