suggested_questions:
- question: What is the molecular activity of mouse LDOC1 in trophoblast giant cells that restrains placental
    progesterone and placental lactogen 1 production?
- question: Is the mouse protein a nuclear adapter like human LDOC1, and does it inhibit NF-kB in placental
    cells?
suggested_experiments:
- description: Identify LDOC1 interaction partners and transcriptional targets in trophoblast giant cells
    and test whether LDOC1 restrains steroidogenic gene expression (Hsd3b, Hsd20a) in the placenta.
