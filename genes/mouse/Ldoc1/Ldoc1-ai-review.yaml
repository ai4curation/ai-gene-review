gene_symbol: Ldoc1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'LDOC1 (leucine zipper, down-regulated in cancer 1; RTL7/SIRH7, Mart7, BCUR1) is a small
  (about 146-151 residue), X-linked protein domesticated from the gag (capsid) region of a Ty3/gypsy (sushi-ichi-related)
  LTR retrotransposon and the founding member of the LDOC1/RTL capsid-like family. It has a capsid-like
  fold with an N-terminal leucine-zipper/coiled-coil motif, a proline-rich SH3-binding region and an acidic
  C-terminal tail, but no catalytic domain. It is predominantly nuclear. Functionally it behaves as a
  nuclear regulatory adapter that binds partner proteins and promotes their destabilization: it inhibits
  NF-kappaB signaling and favors apoptosis (destabilizing the nucleolar GTPase GNL3L to lower the p65
  subunit, an activity enhanced by the transcription factor MZF-1), restrains JAK2/STAT3 signaling by
  routing phospho-JAK2 for proteasomal degradation via the adaptor LNX1, and modulates histone H2B monoubiquitination.
  LDOC1 is ubiquitously expressed in normal tissues and is frequently silenced by promoter hypermethylation
  in cancers, where its loss is associated with increased aggressiveness, consistent with a context-dependent
  tumor/metastasis-suppressor role. In the mouse, the orthologous gene (Sirh7/Ldoc1) is highly expressed
  in the early placenta, where its knockout causes abnormal trophoblast differentiation, placental progesterone
  overproduction and delayed parturition, showing an additional role in placental endocrine function.'
