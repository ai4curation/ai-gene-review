- id: file:mouse/Ghsr/Ghsr-uniprot.txt
  title: 'UniProtKB Q99P50: mouse Ghsr curated entry'
core_functions:
- description: Ghrelin and growth hormone secretagogue receptor at the plasma membrane, coupling to Gq/11-phospholipase
    C signalling. Its outputs are stimulation of growth hormone release and orexigenic signalling. In
    mouse this is established genetically by Ghsr-null mice; ligand binding and G-protein coupling were
    shown biochemically for the rat and human orthologs, and the activity is placed by PAINT at the GHSR
    node PTN002797666.
  molecular_function:
    id: GO:0001616
    label: growth hormone secretagogue receptor activity
  directly_involved_in:
  - id: GO:0009755
    label: hormone-mediated signaling pathway
  - id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  - id: GO:0060124
    label: positive regulation of growth hormone secretion
  - id: GO:0032100
    label: positive regulation of appetite
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:15070777
    supporting_text: acute treatment of Ghsr-null mice with ghrelin stimulated neither GH release nor
      food intake, showing that the GHSR is a biologically relevant ghrelin receptor
  - reference_id: PMID:16322794
    supporting_text: a novel GHSR-null mouse model, in which ghrelin administration fails to acutely stimulate
      food intake or activate arcuate nucleus neurons
  - reference_id: PMID:10604470
    supporting_text: We now report the purification and identification in rat stomach of an endogenous
      ligand specific for GHS-R.
  - reference_id: PMID:25605885
    supporting_text: This complex is specific of Gq and is not observed with Gi.
- description: Ligand-independent (apo) GHSR acting as a coreceptor for dopamine receptors in neurons.
    With DRD1 in hippocampal neurons it forms heteromers that redirect DRD1 to Gq-PLC-IP3-Ca2+ signalling
    and initiate synaptic plasticity. With DRD2 it is required for DRD2-agonist anorexia, and in spinal
    defecation-centre neurons it reverses DRD2 output. Experimentally established in mouse; PAINT did
    not propagate this activity, so its phylogenetic extent is untested.
  molecular_function:
    id: GO:0015026
    label: coreceptor activity
  directly_involved_in:
  - id: GO:0048167
    label: regulation of synaptic plasticity
  - id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:26590421
    supporting_text: Real-time single-molecule analysis on hippocampal neurons revealed dimerization between
      apo-GHSR1a and DRD1 that is enhanced by DRD1 agonism
  - reference_id: PMID:26590421
    supporting_text: Activation by a DRD1 agonist produced non-canonical signal transduction via Gαq-PLC-IP3-Ca(2+)
      at the expense of canonical DRD1 Gαs cAMP signaling
  - reference_id: PMID:26590421
    supporting_text: In conclusion, we show apo-GHSR1a is fundamentally important for dopamine/DRD1-induced
      initiation of hippocampal synaptic plasticity and formation of hippocampal memory
  - reference_id: PMID:22284186
    supporting_text: Combination of FRET confocal microscopy and Tr-FRET established the presence of GHSR1a:DRD2
      heteromers in hypothalamic neurons
  - reference_id: PMID:40441153
    supporting_text: This reversal is required for the physiological control of defecation, where dopamine
      is the relevant neurotransmitter
suggested_questions:
- question: The spinal DRD2 reversal depends on GHSR constitutive activity without dimerization (PMID:40441153),
    whereas the hippocampal DRD1 effect was attributed to heteromer-dependent allostery (PMID:26590421).
    Are these one mechanism, and should both be captured as coreceptor activity or as distinct GO activities?
- question: PAINT placed only GO:0001616 and GO:0009755 at PTN002797666. Should the mouse-established
    coreceptor activity with dopamine receptors be propagated to other mammalian GHSR orthologs, given
    that the evidence comes from a single species?
suggested_experiments:
- description: Use knock-in mice carrying a GHSR point variant that lacks constitutive activity but keeps
    ghrelin responsiveness (modelled on the human short-stature variant, PMID:16511605) to separate constitutive-activity-dependent
    DRD1/DRD2 effects from ghrelin-dependent ones in hippocampus, hypothalamus and spinal cord.
  experiment_type: genetic knock-in and electrophysiology
