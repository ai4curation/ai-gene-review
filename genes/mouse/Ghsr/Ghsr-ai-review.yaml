- term:
    id: GO:0048167
    label: regulation of synaptic plasticity
  evidence_type: IDA
  original_reference_id: PMID:26590421
  qualifier: involved_in
  review:
    summary: Regulation of synaptic plasticity (IDA, mouse).
    action: ACCEPT
    reason: 'Mouse-established: apo-GHSR1a in DRD1 heteromers is required for dopamine/DRD1-induced CaMKII
      activation, AMPA receptor phosphorylation and exocytosis, and early plasticity markers in hippocampal
      neurons (PMID:26590421). The receptor does part of the work by redirecting DRD1 to Gq. This is the
      process its coreceptor activity directly serves in the hippocampus.'
    supported_by:
    - *id042
    - &id052
      reference_id: PMID:26590421
      supporting_text: to result in CaMKII activation, glutamate receptor exocytosis, synaptic reorganization,
        and expression of early markers of hippocampal synaptic plasticity
