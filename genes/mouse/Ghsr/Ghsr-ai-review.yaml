id: Q99P50
gene_symbol: Ghsr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Ghsr encodes the mouse ghrelin receptor (growth hormone secretagogue receptor type 1a), a
  364-residue class A seven-transmembrane G protein-coupled receptor of the plasma membrane. It is the
  receptor for the acylated stomach hormone ghrelin and for synthetic growth hormone secretagogues, and
  signals mainly through Gq/11, phospholipase C, IP3 and intracellular Ca2+. In mice lacking Ghsr, ghrelin
  no longer stimulates growth hormone release or acute food intake, and the animals resist diet-induced
  obesity, which shows that the receptor mediates the growth hormone-releasing and orexigenic actions
  of ghrelin. In brain regions where ghrelin is essentially absent, the ligand-free receptor acts with
  dopamine receptors in the same neurons. With DRD1 in hippocampal neurons it switches dopamine signalling
  from Gs-cAMP to Gq-Ca2+, which is needed for dopamine-induced synaptic plasticity and hippocampal memory.
  With DRD2 in hypothalamic neurons it is needed for DRD2-agonist anorexia. In the lumbosacral spinal
  defecation centre its constitutive activity reverses DRD2 output from inhibition to excitation, a step
  required for normal defecation. Further reported effects, mostly from rat and human studies, include
  gastrointestinal prokinetic actions, restraint of insulin secretion, and anti-inflammatory signalling
  in immune cells.
