- term:
    id: GO:0015026
    label: coreceptor activity
  evidence_type: IDA
  original_reference_id: PMID:26590421
  qualifier: enables
  review:
    summary: 'Coreceptor activity: ligand-free GHSR (apo-GHSR1a) cooperates with dopamine receptors DRD1
      and DRD2 in neurons and redirects their signaling to Gq-PLC-Ca2+.'
    action: ACCEPT
    reason: Experimentally established in mouse neurons, which is the reference species for this function.
      In hippocampal neurons apo-GHSR1a forms heteromers with DRD1 and switches DRD1 from Gs to Gq signaling
      (PMID:26590421). In hypothalamic neurons GHSR1a:DRD2 heteromers make DRD2-agonist anorexia GHSR-dependent
      but ghrelin-independent (PMID:22284186). In spinal defecation-centre neurons, GHSR reverses DRD2
      output from inhibition to excitation; the 2025 study attributes this to GHSR constitutive activity
      rather than dimerization (PMID:40441153). The cooperation-with-a-primary-receptor sense of GO:0015026
      fits all three cases, although the mechanism differs. PAINT did not propagate this term at PTN002797666,
      so it is a mouse-anchored function, not a tree-wide inference.
    supported_by: &id021
    - *id020
    - *id008
    - reference_id: PMID:22284186
      supporting_text: Combination of FRET confocal microscopy and Tr-FRET established the presence of
        GHSR1a:DRD2 heteromers in hypothalamic neurons
    - &id068
      reference_id: PMID:40441153
      supporting_text: this reversal is a consequence of the ghrelin receptor's constitutive activity,
        where neither its agonism nor dimerization with the D2 receptor is required, in the systems tested
    - reference_id: file:mouse/Ghsr/Ghsr-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts with DRD1; forms a heteromer with DRD1
