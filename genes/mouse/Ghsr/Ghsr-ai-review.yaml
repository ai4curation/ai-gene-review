  review:
    summary: 'Ghrelin receptor (GHS-R1a) activity: binding of acyl-ghrelin and synthetic secretagogues,
      coupling mainly to Gq/11.'
    action: ACCEPT
    reason: 'Core function. In mouse it is established genetically: Ghsr-null mice lose both ghrelin-evoked
      GH release and ghrelin-evoked feeding (PMID:15070777, PMID:16322794). Ligand binding and G-protein
      coupling were shown biochemically for the rat and human orthologs (PMID:10604470, PMID:25605885,
      PMID:35027551). PAINT placed GO:0001616 and GO:0009755 at the GHSR-specific node PTN002797666 (Euteleostomi;
      seeds rat RGD:621397, human Q92847, pig Q95254), and mouse Q99P50 is in PANTHER subfamily PTHR24243:SF7
      below that node, so the transfer is phylogenetically grounded.'
    supported_by: &id001
    - &id002
      reference_id: PMID:15070777
      supporting_text: acute treatment of Ghsr-null mice with ghrelin stimulated neither GH release nor
        food intake, showing that the GHSR is a biologically relevant ghrelin receptor
