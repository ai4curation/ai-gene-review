  label: Mus musculus (Mouse)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for mouse EGFR. The top five is identical in content and ordering
  to the human EGFR result: receptor activity, EGF binding, the ERBB3:ERBB2 complex, the ERBB2-EGFR
  pathway and an obsolete PI3K term, with scores within 0.2 units of the human values. Two exact GOA
  matches recover this review's first core function; rank 3 again names a heterodimer that does not
  contain EGFR. The reproducibility across orthologs is itself informative - the model's output is
  a property of the family embedding, not of the species. Assessment: 2 correct not novel (CNN), 1
  paralog incorrect (PLI).
