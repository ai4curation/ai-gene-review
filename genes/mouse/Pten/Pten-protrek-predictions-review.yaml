id: O08586
gene_symbol: Pten
taxon:
  id: NCBITaxon:10090
  label: Mus musculus (Mouse)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for mouse Pten. The list mirrors human PTEN's, leading with the
  same Schwann cell migration term and reaching PIP3 3-phosphatase activity - the primary core function
  - at rank 5 rather than rank 2. Three of the five calls are neural phenotypes, reflecting the mouse
  Pten literature's emphasis on nervous-system phenotypes. The protein phosphatase activities that
  make PTEN dual-specificity, and that this review lists as two further core functions, are not retrieved.
  Assessment: 2 correct not novel (CNN), 1 less precise (LSP).
