id: Q5Y5T3
gene_symbol: Zdhhc23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Zdhhc23 (DHHC-23; also called NIDD in rat) is a polytopic integral membrane protein S-acyltransferase of the
  DHHC family, with six predicted transmembrane helices and a cytoplasmic DHHC cysteine-rich domain whose cysteine C279 forms
  the acyl-enzyme intermediate. By orthology with human ZDHHC23 it localizes to Golgi and trans-Golgi network membranes, where
  it transfers palmitate from palmitoyl-CoA to cysteines of protein substrates. In mouse, genetic deletion of Zdhhc23 reduces
  S-acylation of the endogenous BK potassium channel alpha subunit (Kcnma1) in aortic smooth muscle cells and lowers BK current,
  without changing channel surface expression in this beta1-containing tissue; in cells lacking beta1, ZDHHC23-mediated acylation
  of the S0-S1 loop instead promotes channel exit from the TGN to the plasma membrane. Knockdown in a mouse astrocyte line
  reduces GFAP palmitoylation, and Zdhhc23 is upregulated in spinal astrocytes in a cancer-pain model. The rat ortholog has
  been reported to bind neuronal nitric oxide synthase. Zdhhc23 is expressed in brain.
