  review:
    action: KEEP_AS_NON_CORE
    summary: Zdhhc23-dependent palmitoylation can promote BK channel alpha-subunit delivery to the plasma membrane, but in
      native mouse tissue this effect was not seen.
    reason: Zdhhc23 contributes the lipid modification that drives BK channel exit from the TGN in HEK293 cells lacking beta1
      subunits (overexpression raised and knockdown lowered surface expression of the S0-S1 reporter and full-length channel).
      In mouse aortic smooth muscle, which expresses beta1, Zdhhc23 deletion reduced BK current but did not change alpha-subunit
      surface expression; the authors conclude that S-acylation controls surface expression only in the absence of beta1.
      The term is therefore true in some cellular contexts but is not a constant feature of the mouse enzyme, and is kept
      as non-core. The IBA comes from the ZDHHC23-specific node PTN008583751 (donors human ZDHHC23 and mouse Zdhhc23), so
      the propagation itself is within the ortholog clade.
