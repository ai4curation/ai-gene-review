- id: PMID:22399288
  title: Distinct acyl protein transferases and thioesterases control surface expression of calcium-activated potassium channels.
  findings:
  - statement: ZDHHC23 (with ZDHHC22) controls palmitoylation of the BK channel S0-S1 loop and promotes its surface expression;
      tagged zDHHC23 localizes mainly to Golgi/TGN. Experiments were in HEK293 cells.
    supporting_text: palmitoylation of the intracellular S0-S1 loop of BK channels is controlled by two of the 23 mammalian
      palmitoyl-transferases, zDHHC22 and zDHHC23.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Knockdown screen in human HEK293 cells; species of the overexpressed zDHHC23 construct
      is not stated in the methods excerpts I read. Treated as orthologous evidence that MGI attached to the mouse gene.
- id: PMID:31213527
  title: S-Acylation controls functional coupling of BK channel pore-forming α-subunits and β1-subunits.
  findings:
  - statement: Global Zdhhc23 knockout (Zdhhc23tm1(KOMP)Vlcg) reduces endogenous BK alpha-subunit S-acylation by ~60% in mouse
      aortic smooth muscle cells and reduces BK current, without changing alpha-subunit surface expression.
    supporting_text: Acyl-RAC performed on VSMCs from Zdhhc23−/− mice displayed a significant (∼60%) reduction in BK channel
      α-subunit S-acylation (Fig. 5A).
  reference_review:
    relevance: HIGH
