  label: Mus musculus (Mouse)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for mouse Notch1. As with human NOTCH1, all five calls are specific
  cardiovascular and endothelial developmental processes and three are exact GOA matches; the receptor
  activity and NICD coactivator role that are this review's first two core functions are absent. At
  2531 residues Notch1 scores 16.10, comparable to the human ortholog and far above the other very
  long proteins in the cohort - consistent with its architecture being many copies of one domain type.
  Assessment: 3 correct not novel (CNN).
