  qualifier: located_in
  review:
    summary: Immunostaining shows XIRP2 throughout the actin-rich stereocilia of cochlear and utricular hair cells,
      with label lost in Xirp2-/- mice (PMID:25772365); the short isoforms are mainly in stereocilia and are enriched
