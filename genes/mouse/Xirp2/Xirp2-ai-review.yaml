suggested_questions:
- question: Does the short XIRP2 isoform do part of the work of stereocilium maintenance (GO:0120045), as the rootlet
    protein Tprn is annotated, or is its knockout degeneration phenotype downstream of actin-core disorganization?
    MGI did not assign this term from PMID:25772365 or PMID:25653358.
- question: Is the interaction of Xirp2 with Nav1.5 and Kv1.5 direct, and which Xirp2 region mediates it? Does Xirp2
    control channel surface localization at the intercalated disc?
- question: Does the long Xin-repeat isoform of mouse Xirp2 bind and bundle F-actin in vitro as human XIRP2 repeats
    and mouse Xirp1 do?
- question: Is the force-sensing C-terminal domain of the short isoform conserved in species whose gene models (e.g.
    bovine E1BL04) lack the C-terminal LIM region, or is it carried by separate short-isoform gene models?
suggested_experiments:
- hypothesis: The Xin-repeat region of mouse Xirp2 binds and cross-links F-actin directly.
  description: Purify recombinant Xin-repeat fragments of mouse Xirp2 and run high- and low-speed actin co-sedimentation
    and negative-stain EM of bundles.
  experiment_type: actin co-sedimentation assay
- hypothesis: The Xirp2 C-terminal domain binds G-actin directly.
  description: Measure binding of purified Xirp2 CTD to latrunculin- or DNase I-sequestered G-actin by ITC or pyrene-actin
    assays, and map the binding residues.
  experiment_type: in vitro binding assay
