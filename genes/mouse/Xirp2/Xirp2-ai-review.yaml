- term:
    id: GO:0110053
    label: regulation of actin filament organization
  evidence_type: IMP
  original_reference_id: PMID:25772365
  qualifier: involved_in
  review:
    summary: Xirp2-null hair cells show irregular actin filament spacing in the stereocilia paracrystalline array,
      altered stereocilia thickness and cuticular plate defects (PMID:25772365).
    action: ACCEPT
    reason: Mouse loss-of-function supports a role for Xirp2 in controlling actin filament organization in hair
      cell stereocilia; Xirp2 binds the filaments whose organization is affected. Consistent with the IBA actin
      filament organization term.
    supported_by:
    - *id017
    - *id005
- term:
    id: GO:1903829
    label: positive regulation of protein localization
  evidence_type: IMP
  original_reference_id: PMID:37294664
  qualifier: involved_in
  review:
    summary: In Xirp2 knockouts, gamma-actin (and to a lesser extent beta-actin and espin) is no longer enriched
      at noise-induced stereocilia gaps; XIRP2 itself is enriched at gaps (PMID:37294664). In heart, Xirp2 is required
      for terminal localization of N-cadherin and Xirp1 (PMID:20360251).
    action: KEEP_AS_NON_CORE
    reason: Mouse loss-of-function and a mechanism (the short isoform's C-terminal domain pulls down monomeric gamma-actin)
      support Xirp2 promoting recruitment of actin to repair sites. The term is broad, but no more specific GO term
      for recruitment to stereocilia F-actin damage sites exists. Kept as non-core.
    supported_by:
    - &id024
      reference_id: PMID:37294664
      supporting_text: In addition to these, we observe the enrichment of XIRP2 immunostaining at gaps
    - &id025
      reference_id: PMID:37294664
      supporting_text: However, in contrast to WT mice, γ-actin no longer appears to be enriched in gaps in Xirp2
        knockouts
    - &id018
      reference_id: PMID:37294664
      supporting_text: The C-terminal domain (CTD) of XIRP2 is sufficient to pull down monomeric γ-actin.
