    - &id013
      reference_id: PMID:20360251
      supporting_text: Complete loss of mXinβ in mice leads to mis-organized myocardium, abnormal heart shape, ventricular
        septal defect, cardiac diastolic dysfunction, severe growth retardation and postnatal lethality.
    - reference_id: PMID:20360251
      supporting_text: A targeting vector was designed to delete the genomic region that encodes the highly conserved
        β-catBD and Xin repeats
