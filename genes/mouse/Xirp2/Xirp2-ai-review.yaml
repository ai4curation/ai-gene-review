- term:
    id: GO:0003785
    label: actin monomer binding
  evidence_type: IDA
  original_reference_id: PMID:37294664
  qualifier: enables
  isoform: Q4U4S6-3
  review:
    summary: Heterologously expressed short XIRP2 pulls down endogenous beta- and gamma-actin and a polymerization-incompetent
      gamma-actin mutant (G13R); the C-terminal domain (present in the short, LIM/CTD isoform) is sufficient (PMID:37294664).
    action: NEW
    reason: 'Binding to the non-polymerizable G13R actin mutant shows monomer binding, mapped to the C-terminal
      domain found in the short isoforms (Q4U4S6-3). This fits the in vivo requirement for XIRP2 in gamma-actin
      enrichment at stereocilia gaps. Pulldowns were from transfected cell lysates, so direct binding is not proven,
      but the term is far more informative than protein binding. Isoform-restricted: the long Xin-repeat isoforms
      lacking the CTD were not shown to bind G-actin.'
    supported_by:
    - *id018
    - reference_id: PMID:37294664
      supporting_text: EGFP-XIRP2 pulls down both the WT and the G13R mutant γ-actin.
