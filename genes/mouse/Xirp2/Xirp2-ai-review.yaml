- description: Binds and cross-links actin filaments through its Xin repeat array, organizing actin in muscle Z
    discs and intercalated discs and in the paracrystalline actin core of hair-cell stereocilia. Binding is inferred
    from same-subfamily (human XIRP2) and family (Xin/XIRP1) assays plus mouse localization and knockout data; no
    assay on the mouse protein itself.
