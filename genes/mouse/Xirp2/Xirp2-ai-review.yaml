  review:
    summary: Xirp2 (mXinbeta) knockout mice show ventricular septal defects in a fraction of animals, along with
      abnormal heart shape and postnatal lethality (PMID:20360251).
    action: MARK_AS_OVER_ANNOTATED
    reason: This is an organismal knockout phenotype. Xirp2 is a structural actin-binding protein of the intercalated
      disc whose demonstrated cellular role is intercalated disc maturation; nothing places it in the septation
      process itself, and the defect is incompletely penetrant. The knockout also deletes the beta-catenin-binding
      and Xin-repeat region, so the phenotype reports loss of the structural protein, not participation in septum
      development.
