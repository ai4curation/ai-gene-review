id: Q4U4S6
gene_symbol: Xirp2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Xirp2 (Xin actin-binding repeat-containing protein 2; also called myomaxin, mXinbeta or Cmya3) is a
  very large actin-associated protein of striated muscle and inner-ear sensory hair cells. Long isoforms carry an
  array of 28 Xin repeats, 16-residue motifs that bind and cross-link actin filaments. Short isoforms lack the repeats
  but carry a C-terminal LIM domain and a force-sensing C-terminal domain. In skeletal and cardiac muscle Xirp2
  is a MEF2A target that binds alpha-actinin-2 at the Z-disc/costamere. In heart it concentrates at intercalated
  discs, where it is required for postnatal disc maturation and the terminal clustering of N-cadherin, beta-catenin
  and Xirp1. It co-immunoprecipitates with the Nav1.5 and Kv1.5 channels, and its loss in mice causes conduction
  defects, misorganized myocardium, growth retardation and early postnatal death. In hair cells Xirp2 is in stereocilia,
  the cuticular plate and apical junctions, and keeps the regular paracrystalline packing of stereocilia actin.
  The short isoform is recruited to sites of noise-induced F-actin damage in stereocilia, where it binds monomeric
  gamma-actin and is needed for its enrichment and for gap repair; loss causes stereocilia degeneration and progressive
  hearing loss.
