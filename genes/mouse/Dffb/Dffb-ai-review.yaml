id: O54788
gene_symbol: Dffb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Dffb encodes CAD/DFF40, the endonuclease that cleaves chromosomal DNA during apoptotic execution.
  CAD folds in association with ICAD/Dffa and remains inhibited until executioner-caspase cleavage of
  ICAD releases nuclease activity. Cytosolic and nuclear pools can participate, with localization and
  activation timing dependent on cell context. Active CAD produces apoptotic DNA fragments and can contribute
  to chromatin remodeling; this DNA-degradation branch is not required for every route to cell death.
