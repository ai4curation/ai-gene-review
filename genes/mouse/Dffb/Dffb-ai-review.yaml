  review:
    summary: The narrowly specified nucleolar localization transfer is not independently resolved.
    action: UNDECIDED
    reason: The donor is the correct human DFFB ortholog O76075, whose existing review retains a curated
      immunofluorescence observation. The underlying nucleolar image/source was not recovered, and nuclear
      localization alone does not establish a nucleolar pool in mouse. Preserve uncertainty rather than
      reject the donor or present generic nuclear localization as evidence for nucleolus.
    supported_by:
