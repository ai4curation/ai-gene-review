- term:
    id: GO:0097718
    label: disordered domain specific binding
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: enables
  supporting_entities:
  - UniProtKB:O76075
  review:
    summary: Conservation of binding to a specifically disordered inhibitor domain remains unresolved.
    action: UNDECIDED
    reason: Human DFF40 folds the otherwise disordered DFF45 N-terminal domain in PMID:11371636. Mouse
      CAD/ICAD has a homologous domain interface, but the available evidence does not independently resolve
      the unbound disorder state of the exact mouse ICAD construct. Retain uncertainty for this narrowly
      specified transfer rather than declaring the correct human donor unrelated.
    supported_by:
    - *id005
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:O76075
        source_status: UNRESOLVED
        comment: The inherited claim concerns disordered domain specific binding. The verified ortholog/source
          chain does not resolve the specific scope discussed in the review reason; no wrong-paralog or
          functional-loss conclusion is established.
- term:
    id: GO:1902511
    label: negative regulation of apoptotic DNA fragmentation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O76075
  - ensembl:ENSP00000367454
  review:
    summary: The negative-regulatory role of CAD requires separation from inhibitor-assisted maturation.
    action: UNDECIDED
    reason: The human donor DFFB O76075 performs nuclease catalysis but also folds the DFF45 inhibitory
      domain. The donor review now leaves this negative-regulation process unresolved after reading the
      complete mutual-chaperoning study. Transfer to mouse does not resolve whether CAD supplies negative-regulatory
      work beyond maturation of the inhibited complex; no inhibitor activity is assigned to CAD.
    supported_by:
