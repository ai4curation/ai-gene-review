  review:
    summary: CAD can associate with identical CAD molecules after ICAD removal.
    action: ACCEPT
    reason: The full human structural paper reports DFF40 regulatory-domain oligomerization and explicitly
      compares mouse CAD aggregation at NMR concentrations. Together with the conserved activation mechanism
      this supports homomeric association, without treating high-concentration aggregates as a uniquely
      resolved physiological oligomer.
