id: Q9EQK5
gene_symbol: Mvp
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Major vault protein (Mvp; also called lung resistance-related protein, LRP) is the principal
  structural protein of vaults, barrel-shaped cytoplasmic ribonucleoprotein particles of about 13 MDa
  that are widespread in eukaryotes and thought to be ancestral to them. Each vault is a dimer of half-vaults,
  each built from 39 identical MVP chains; every chain has nine N-terminal repeat domains that form the
  barrel wall (the structure of the first seven repeats was solved with the mouse protein), a stomatin-like
  shoulder domain, a long cap-helix and a cap-ring. MVP alone is sufficient to assemble vault-like particles.
  The cage holds the minor vault components PARP4, TEP1 and vault RNAs; in mouse, TEP1 is required for
  stable association of the vault RNA with the particle. Vaults are mostly cytosolic, with small fractions
  at the nuclear envelope and nuclear pore and near microtubules, and vault levels are controlled by p62/NBR1-dependent
  selective autophagy. Mvp-deficient mice are viable and healthy, are not sensitised to cytostatic drugs
  and have normal dendritic cell function, and their cells show normal nucleocytoplasmic transport, so
  the physiological function of the vault remains unclear. Mouse knockout studies attribute modulatory
  roles to MVP, mainly in myeloid cells: it restrains TRAF6-dependent NF-kappaB activation in macrophages
  (knockouts show worse diet-induced obesity, insulin resistance and atherosclerosis), inhibits ASK1-JNK
  signalling and plaque destabilisation, limits calcineurin-NFATc1-driven osteoclastogenesis and bone
  loss, and supports antiviral cytokine and antibody responses to influenza A virus. Phosphorylated MVP
  also binds the SH2 domains of SHP-2 and SRC and modulates EGF-ERK signalling.'
