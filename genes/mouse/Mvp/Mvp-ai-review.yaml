    label: cell population proliferation
  evidence_type: IMP
  original_reference_id: PMID:15133037
  qualifier: involved_in
  review:
    summary: Mouse IMP from Kolli et al. 2004, using MVP-deficient fibroblasts.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cached record is abstract-only, so the curator may have seen a proliferation or survival
      measurement in the full text. What the abstract reports is that MVP is required for cell survival
      and for optimal EGF-induced Elk-1 activation in MVP-deficient fibroblasts; it does not show that
      MVP does any of the work of cell proliferation, and MVP-/- mice are viable and healthy. A survival/proliferation
      defect in knockout cells is an indirect effect. The row is not called wrong (not REMOVE, out of
      deference to the full-text curator) but is over-annotated; this matches the human review of the
      projected row.
    supported_by:
    - reference_id: PMID:15133037
      supporting_text: Using MVP-deficient fibroblasts, we demonstrate that MVP cooperates with Ras for
        optimal EGF-induced Elk-1 activation and is required for cell survival
    - reference_id: PMID:12499273
      supporting_text: The MVP(-/-) mice are viable, healthy, and show no obvious abnormalities
