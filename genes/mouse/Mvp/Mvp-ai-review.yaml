- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000366423
  - UniProtKB:Q14764
  review:
    summary: PAINT IBA for signal transduction at PTN000366423; the experimental grounding is human MVP.
    action: KEEP_AS_NON_CORE
    reason: 'MVP has repeated links to signalling, and mouse knockout data add to them: MVP-deficient
      macrophages show heightened TRAF6/NF-kappaB signalling, and MVP binds TRAF6 and prevents its recruitment
      to IRAK1. With the human SRC/ERK and STAT1 data these are modulatory, mostly inhibitory effects,
      so MVP regulates several pathways rather than transducing a signal. The broad term is true but not
      the structural function of MVP; kept as non-core, matching human. No PAINT loss is recorded on this
      lineage.'
    supported_by:
    - reference_id: PMID:16441665
      supporting_text: MVP overexpression downregulates EGF-dependent ERK activation in Src overexpressing
        cells
    - reference_id: PMID:16418217
      supporting_text: MVP-mediated IFN-gamma insensitivity was accompanied by significantly reduced STAT1
        phosphorylation at Y701 and diminished translocation of STAT1 into the nucleus
    - reference_id: PMID:30996248
      supporting_text: MVP interacts with TRAF6 preventing its recruitment to IRAK1 and subsequent oligomerization
        and ubiquitination
- term:
