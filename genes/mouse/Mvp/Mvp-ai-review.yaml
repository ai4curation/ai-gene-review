- term:
    id: GO:0072376
    label: protein activation cascade
  evidence_type: IMP
  original_reference_id: PMID:15133037
  qualifier: involved_in
  review:
    summary: Mouse IMP from Kolli et al. 2004 (MVP-deficient fibroblasts), the source of the Ensembl projection
      reviewed on human MVP.
    action: REMOVE
    reason: GO:0072376 protein activation cascade is defined as "a sequential series of modifications
      to a set of proteins where the product of one reaction catalyzes the following reaction, ultimately
      leading to the generation of a mature protein" (zymogen cascades such as complement and coagulation).
      The paper reports that MVP is a SHP-2 substrate and cooperates with Ras for EGF-induced Elk-1 activation,
      i.e. an effect on Ras/ERK kinase signalling, for which GO has separate signalling terms already
      represented here (ERBB signaling pathway). Although the full text is not cached, the mismatch is
      between the term definition and the biology the curator annotated, which can be judged from the
      definition; MVP itself catalyses no step of any activation cascade. Removed, with the same source
      defect as recorded on the human projection.
    supported_by:
    - reference_id: PMID:15133037
      supporting_text: Using MVP-deficient fibroblasts, we demonstrate that MVP cooperates with Ras for
        optimal EGF-induced Elk-1 activation and is required for cell survival
    - reference_id: PMID:15133037
      supporting_text: We propose that MVP functions as a novel scaffold protein for both SHP-2 and Erk
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:Q9EQK5 GO:0072376 IMP PMID:15133037
      requested_change: DELETE_ROW
      asserted_value: GO:0072376 protein activation cascade
      confidence: PROBABLE
      explanation: The mouse Mvp IMP from PMID:15133037 uses protein activation cascade (a cascade in
        which each product catalyses the next activation step, as in complement or coagulation) for an
        effect on EGF-induced Ras/ERK/Elk-1 signalling. No such cascade is studied in that paper. The
        row also propagates to human MVP by Ensembl Compara (GO_REF:0000107).
- term:
