core_functions:
- description: Structural shell protein of the vault. MVP self-assembles into the 78-mer barrel-shaped
    cage (two half-vaults of 39 chains) whose lumen houses PARP4, TEP1 and vault RNAs. This is the one
    function of MVP established beyond doubt; what the assembled vault does for the cell is unknown.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:19150846
    supporting_text: the cage structure consists of a dimer of half-vaults, with each half-vault comprising
      39 identical major vault protein (MVP) chains
  - reference_id: PMID:19779459
    supporting_text: together with the 2.1-A structure of the seven N-terminal domains (R1-R7) of MVP,
      reveal the interactions governing vault association
  - reference_id: PMID:11349122
    supporting_text: the expression of the rat MVP alone can direct the formation of particles that have
      biochemical characteristics similar to endogenous rat vaults
  - reference_id: PMID:11149928
    supporting_text: we have uncovered a novel role for TEP1 in vivo as an integral vault protein important
      for the stabilization and recruitment of the vault RNA to the vault particle
  knowledge_gaps:
  - gap_statement: 'The physiological function of the vault particle is unknown: no cargo, transport activity
      or enzymatic role of the assembled cage has been demonstrated, and Mvp-null mice are viable and
      healthy.'
    boundary: Structure, composition and assembly of the cage are known in atomic detail; Mvp knockout
      mice show phenotypes mainly in myeloid-driven inflammation, bone remodelling and antiviral immunity,
      explained so far by MVP binding to signalling proteins (TRAF6, ASK1, Fas) rather than by a vault
      activity.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: Without a defined function, process annotations for MVP rest on modulatory knockout
      phenotypes, and the reason the vault is conserved across eukaryotes remains unexplained.
proposed_new_terms:
- proposed_name: vault complex
  proposed_definition: A barrel-shaped cytoplasmic ribonucleoprotein complex of about 13 MDa, formed by
    two half-vaults each made of multiple copies of the major vault protein, and containing the minor
    vault components such as vault poly(ADP-ribose) polymerase, TEP1 and vault RNAs.
  justification: GO has no term for the vault; MVP, PARP4, TEP1 and the vault RNAs can only be annotated
    to the generic ribonucleoprotein complex. Proposed identically in the human MVP review.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:19150846
    supporting_text: the cage structure consists of a dimer of half-vaults, with each half-vault comprising
      39 identical major vault protein (MVP) chains
  - reference_id: PMID:11149928
    supporting_text: we have uncovered a novel role for TEP1 in vivo as an integral vault protein important
      for the stabilization and recruitment of the vault RNA to the vault particle
suggested_questions:
- question: Are the anti-inflammatory effects of MVP seen in Mvp knockout mice (TRAF6/NF-kappaB, ASK1-JNK,
    calcineurin-NFATc1) properties of assembled vaults or of free MVP, and do they share a mechanism?
    If one mechanism is established, should a regulation term such as negative regulation of NF-kappaB
    signalling be annotated from PMID:30996248?
- question: Kolli et al. (PMID:15133037) found that MVP supports EGF-induced Elk-1 activation in MVP-deficient
    fibroblasts, whereas Kim et al. (PMID:16441665) found that MVP dampens EGF-dependent ERK activation;
    which direction holds for endogenous MVP?
- question: The mouse IMP for protein activation cascade (GO:0072376) from PMID:15133037 appears to describe
    Ras/ERK signalling; could UniProt confirm what the curator intended and replace or delete the row?
suggested_experiments:
- hypothesis: MVP's anti-inflammatory activity in macrophages requires assembled vaults.
  description: Re-express wild-type MVP or assembly-defective MVP mutants (cap-helix or shoulder mutations
    that block cage formation) in Mvp-/- bone marrow-derived macrophages and compare TRAF6 ubiquitination,
    NF-kappaB activation and osteoclast differentiation.
  experiment_type: genetic complementation
- hypothesis: Vaults carry a defined cargo in mouse tissues.
  description: Purify vaults from wild-type and vault-phagy-deficient mouse liver and identify lumenal
    proteins and RNAs by proximity labelling from inside the cage, then test whether candidate cargo mislocalises
    in Mvp-/- tissue.
  experiment_type: proteomics
