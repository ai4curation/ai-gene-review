    summary: Vaults purified from mouse liver contain MVP, TEP1 and vault RNA; TEP1 is needed for vRNA
      association with the mouse vault.
    action: NEW
    reason: 'Mouse vaults are ribonucleoprotein particles: Kickhoefer et al. purified vaults from mouse
      liver, imaged them by cryo-EM and showed that the vault RNA associates with them through TEP1. MVP
      is the main structural protein of this complex. GO has no vault-specific complex term, so ribonucleoprotein
      complex is the most specific available (a vault complex term is proposed, as in the human review,
