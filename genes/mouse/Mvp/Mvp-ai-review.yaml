  review:
    summary: MVP is the structural shell protein of the vault; the 2.1 A crystal structure of mouse MVP
      repeats R1-R7 and the 8 A vault structure define how the chains assemble the barrel.
    action: NEW
    reason: 'The only activity of MVP established beyond doubt is structural: 78 MVP chains (two half-vaults
