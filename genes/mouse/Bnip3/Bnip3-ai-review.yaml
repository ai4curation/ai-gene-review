id: O55003
gene_symbol: Bnip3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Bnip3 (BCL2/adenovirus E1B 19 kDa protein-interacting protein 3; Nip3) is an atypical BH3-only member
  of the BCL-2 family and the paralog of BNIP3L/NIX. It is a 187-residue tail-anchored membrane protein. Its C-terminal
  transmembrane helix inserts it into the mitochondrial outer membrane, and a smaller pool into the endoplasmic
  reticulum; the same helix drives homodimerization. The cytosolic N-terminal region carries an LC3-interacting
  region (LIR), whose binding to LC3B and GABARAP-family proteins is enhanced by phosphorylation of flanking serines.
  Through it, Bnip3 acts as a selective autophagy receptor that delivers mitochondria (mitophagy) and ER (ER-phagy)
  to autophagosomes. Bnip3 is induced by HIF-1 under hypoxia and other stresses. With NIX it limits mitochondrial
  mass: Bnip3-null mouse liver accumulates dysfunctional mitochondria and develops steatosis, and Bnip3 or Nix deletion
  rescues the excessive mitophagy and lethality of Fbxl4-null mice. Basal levels are kept low by SCF(FBXL4)/PPTC7-dependent
  ubiquitination. Bnip3 also inhibits OPA1-mediated fusion and takes part in Mieap-dependent intramitochondrial
  quality control. When overexpressed, or under some stresses such as post-ischaemic myocardium or nitric-oxide-treated
  macrophages, it promotes mitochondrial, often necrosis-like cell death.'
