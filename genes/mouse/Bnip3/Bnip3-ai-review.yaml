core_functions:
- description: Selective autophagy receptor for mitochondria. Bnip3 in the mitochondrial outer membrane homodimerizes
    through its TM helix and binds LC3/GABARAP via its N-terminal LIR, tethering mitochondria to autophagosomes
    during hypoxia- and stress-induced mitophagy. This limits mitochondrial mass in vivo.
  molecular_function:
    id: GO:0140580
    label: mitochondrion autophagosome adaptor activity
  directly_involved_in:
  - id: GO:0000423
    label: mitophagy
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - *id054
  - *id041
  - *id055
  - *id058
  - *id061
- description: Selective autophagy receptor for the ER. An ER-membrane pool of Bnip3 uses the same LIR to target
    ER for autophagic degradation (ER-phagy).
  molecular_function:
    id: GO:0140506
    label: endoplasmic reticulum-autophagosome adaptor activity
  directly_involved_in:
  - id: GO:0061709
    label: reticulophagy
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - *id009
  - *id040
- description: Hypoxia-induced promotion of macroautophagy. HIF-1-induced Bnip3, redundantly with BNIP3L, is required
    for hypoxia-induced autophagy. Its atypical BH3 domain can release Beclin 1 from BCL-2 without triggering death.
  directly_involved_in:
  - id: GO:0016239
    label: positive regulation of macroautophagy
  - id: GO:0071456
    label: cellular response to hypoxia
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - *id018
  - *id036
  - *id044
suggested_questions:
- question: Is the deep (Bilateria) PAINT placement of nucleus (PTN001032684) and the root placement of nuclear
    envelope/ER (PTN000795991) justified, given that the nuclear-envelope signal largely reflects E1B-19K co-expression
    and nuclear BNIP3 is cell-type-restricted?
- question: Should GO:0140580 mitochondrion autophagosome adaptor activity be placed at the Bilateria node (with
    mitophagy), given LIR-dependent receptor activity of worm DCT-1 and fly BNIP3, instead of at Euteleostomi?
- question: Which signals decide whether Bnip3 drives protective mitophagy/ER-phagy or cell death in vivo, for example
    in post-infarct myocardium compared with fasting liver?
suggested_experiments:
- hypothesis: In vivo, Bnip3's role in limiting mitochondrial mass needs its LIR but not its BH3 or pro-death activity.
  description: Generate Bnip3 LIR-mutant (core LIR residue, or the flanking phosphoserines) knock-in mice and compare
    them with Bnip3-null mice for liver mitochondrial mass (mt-Keima), steatosis, rescue of Fbxl4-/- lethality and
    post-infarct cardiomyocyte death.
  experiment_type: knock-in mouse structure-function analysis
