- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: ISO
  original_reference_id: PMID:7954800
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - UniProtKB:Q12983
  review:
    summary: Bnip3 (Nip3) was identified as an E1B-19K/BCL2-interacting protein and can promote cell death when
      overexpressed.
    action: KEEP_AS_NON_CORE
    reason: Cell death roles are real but context-dependent and secondary to the receptor function. The cited paper
      (PMID:7954800) shows the E1B-19K/BCL2 interaction rather than a death phenotype; pro-death activity is from
      later work.
    supported_by:
    - reference_id: PMID:7954800
      supporting_text: We have isolated cDNAs for three different proteins, designated Nip1, Nip2, and Nip3, that
        interact with the 19 kDa protein.
    - &id025
      reference_id: PMID:9396766
      supporting_text: In conclusion, Nip3 is an apoptosis-inducing dimeric mitochondrial protein that can overcome
        Bcl-2 suppression.
