- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0037007
  - PANTHER:PTN001032684
  - UniProtKB:Q12983
  - WB:WBGene00015776
  review:
    summary: Bnip3 mediates selective autophagy of mitochondria, acting as an LC3/GABARAP-binding receptor in the
      mitochondrial outer membrane.
    action: ACCEPT
    reason: Core process. LIR-dependent mitophagy is shown directly, and Bnip3-null mouse liver accumulates mitochondrial
      mass. Bnip3 deletion also rescues the hyperactive mitophagy of Fbxl4-/- mice. The IBA (PTN001032684, Bilateria)
      agrees with fly BNIP3 and worm DCT-1 evidence.
    supported_by: &id001
    - &id055
      reference_id: PMID:23209295
      supporting_text: The BH3-only protein Bnip3 is an autophagy receptor that signals autophagic degradation of
        mitochondria (mitophagy) via interaction of its LC3-interacting region (LIR) with Atg8 proteins.
    - &id041
      reference_id: PMID:22505714
      supporting_text: Although ablation of the Bnip3-LC3 interaction by mutating the LC3 binding site did not impair
        the prodeath activity of Bnip3, it significantly reduced both mitophagy and ERphagy.
    - &id058
      reference_id: PMID:22547685
      supporting_text: These results identify a role for BNip3 in limiting mitochondrial mass and maintaining mitochondrial
        integrity in the liver
    - &id061
      reference_id: PMID:36896912
      supporting_text: Fbxl4-/- mice exhibit elevated BNIP3 and NIX proteins, hyperactive mitophagy, and perinatal
        lethality. Importantly, knockout of either Bnip3 or Nix rescues metabolic derangements and viability of
        the Fbxl4-/- mice.
