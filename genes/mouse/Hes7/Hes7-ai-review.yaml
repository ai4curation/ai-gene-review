core_functions:
- molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  description: >-
    Hes7 is a Notch-target bHLH-Orange repressor that binds N-boxes in the Lfng promoter and its own promoter
    and represses them. Its extreme protein instability and negative autoregulation generate the oscillating
    segmentation clock in the presomitic mesoderm and periodic repression of Lfng (negative feedback on
    Notch activity).
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0001756
    label: somitogenesis
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:16342160
    supporting_text: >-
      Hes7, another cyclically expressed protein, can bind to the N-boxes on both Lfng and its own promoters
      and repress their activity.
  - reference_id: PMID:12783854
    supporting_text: >-
      periodic repression by Hes7 protein is critical for the cyclic transcription of Hes7 and Lfng, and
      this negative feedback represents a molecular basis for the segmentation clock.
proposed_new_terms: []
suggested_questions:
- question: >-
    Does Hes7 act as a homodimer or as a heterodimer (e.g. with Hes1/Hey proteins) at the Lfng and Hes7
    N-boxes in the PSM, and is Groucho/TLE recruitment through WRPW required for clock repression in vivo?
suggested_experiments:
- description: >-
    Knock in a WRPW-deleted Hes7 allele and assay oscillation of Hes7/Lfng reporters in PSM explants to
    test whether Groucho/TLE recruitment is required for clock repression.
