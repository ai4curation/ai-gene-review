id: Q8BKT2
gene_symbol: Hes7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Hes7 is a Hairy/Enhancer-of-split-related basic helix-loop-helix (bHLH-Orange) transcriptional repressor
  carrying a C-terminal WRPW Groucho/TLE-recruitment motif. It is a direct Notch-signalling target expressed
  specifically and dynamically in the presomitic mesoderm (PSM), where it binds N-box elements in its
  own promoter and in the Lunatic fringe (Lfng) promoter and represses their transcription. Hes7 protein
  is extremely short-lived, and this instability together with negative autoregulation generates the ~2-hour
  oscillation of the mouse somite segmentation clock; Hes7 thereby periodically represses Lfng and other
  cyclic Notch-pathway genes, providing negative feedback on Notch activity. Loss of Hes7 in mouse disrupts
  somite segmentation and somite rostro-caudal polarity, producing fused and disorganised vertebrae and
  ribs and a shortened tail; HES7 missense mutation in human causes spondylocostal dysostosis.
