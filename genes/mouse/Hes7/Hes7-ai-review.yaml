      supporting_text: >-
        instability of Hes7 is essential for sustained oscillation and for its function as a segmentation
        clock.
    - reference_id: PMID:19779553
      supporting_text: >-
        Thus, in the absence of Lfng or Hes7 the process of somitogenesis is not properly regulated.
