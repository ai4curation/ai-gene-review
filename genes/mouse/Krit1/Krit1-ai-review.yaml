id: Q6S5J6
gene_symbol: Krit1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Krit1 (Ccm1) is a non-enzymatic adaptor protein of endothelial cells, made of an N-terminal
  pseudo-Nudix domain with NPX(Y/F) motifs, four ankyrin repeats and a C-terminal FERM domain. At endothelial
  cell-cell junctions it binds the cytoplasmic tail of the transmembrane receptor HEG1 and recruits CCM2,
  and through it PDCD10, forming the HEG1-KRIT1-CCM2 complex; CCM2L competes with CCM2 for Krit1. By analogy
  with human KRIT1, the FERM domain binds GTP-Rap1, which releases Krit1 from microtubules to PI(4,5)P2-containing
  junctional membrane, and an N-terminal NPXY motif binds ICAP1. Junctional Krit1 stabilizes VE-cadherin
  adherens junctions and endothelial polarity, holds RhoA/ROCK activity down to preserve barrier function,
  and with CCM2 restrains MEKK3-KLF2/KLF4 signalling to keep endothelium quiescent. Krit1 also limits
  intracellular ROS through FoxO1 and SOD2. Krit1-null embryos die in mid-gestation from primary vascular
  defects, and endothelial loss in postnatal mice produces cavernous-malformation-like brain vascular
  lesions.
