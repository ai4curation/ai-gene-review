  review:
    summary: Krit1 holds RhoA/ROCK signalling down in mouse endothelium, shown with Krit1+/- cells and
      mice.
    action: NEW
    reason: 'Krit1+/- mouse endothelial cells from several organs have raised pMLC and stress fibres and
      twofold higher monolayer permeability, and Krit1+/- mice have increased brain and lung vascular
      leak that the ROCK inhibitor fasudil reverses (PMID:20308363). Krit1 does part of this work: the
