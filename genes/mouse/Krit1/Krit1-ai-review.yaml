suggested_questions:
- question: Does mouse Krit1 bind GTP-Rap1 and microtubules with the same FERM F1/F2 and N/C-terminal
    surfaces as human KRIT1, or are these activities only transferred by similarity?
- question: Is the increase in ROS in Krit1-null MEFs a direct consequence of junctional CCM signalling
    (for example via KLF2/4 or FoxO1), or a separate Krit1 function?
suggested_experiments:
- description: Test GTP-dependent binding of purified mouse Krit1 FERM domain to Rap1A/Rap1B and the R452E-equivalent
    mutant, and its microtubule co-sedimentation, so that the effector and microtubule activities are
    shown in this species.
- description: In Krit1 endothelial-knockout mouse cells, re-express wild-type Krit1 or a HEG1-binding-deficient
    FERM mutant and measure junctional CCM2 recruitment, RhoA-GTP and pMLC to tie the adaptor activity
    to Rho suppression.
