- term:
    id: GO:0009948
    label: anterior/posterior axis specification
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002665063
  - ZFIN:ZDB-GENE-030131-555
  review:
    summary: A/P axis specification is not a Krit1 process; the IBA rests on a knockdown body-axis phenotype.
    action: REMOVE
    reason: The only seed for this PTN002665063 assertion is zebrafish krit1, from PMID:26540726, where
      combined ccm2l/ccm2 knockdown caused cardiac and circulation defects with secondary body-axis abnormalities.
      That is a downstream organismal phenotype of vascular/cardiac CCM-MEKK3 dysregulation, not patterning
      of the A/P axis. No mouse Krit1 study implicates axis specification; Krit1-null mouse embryos have
      exclusively vascular primary defects (PMID:14993192). Removed on biological grounds, consistent
      with the human KRIT1 review.
    supported_by:
    - reference_id: PMID:26540726
      supporting_text: A knockdown of ccm2l and ccm2 in zebrafish leads to a more severe "big heart" and
        circulation defects compared with loss of function of ccm2 alone, and also leads to substantial
        body axis abnormalities.
    - *id011
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN002665063
        source_label: bilaterian KRIT1 clade node
        source_status: SOURCE_WEAK_OR_INFERRED
