  review:
    summary: Krit1 restrains endothelial proliferation; a downstream quiescence output.
    action: KEEP_AS_NON_CORE
    reason: The row is a transfer from human KRIT1 (O00522), which sits with mouse Krit1 in PANTHER subfamily
      PTHR13283:SF11; the transfer is evolutionarily sound but the claim has not been tested with mouse
      Krit1 itself. Human CCM1 depletion increases endothelial proliferation (PMID:20616044), and Krit1-null
      mouse embryos show increased endothelial proliferation in the caudal dorsal aorta (PMID:14993192).
      The effect is a downstream output of the junctional adaptor role, so it is kept as non-core.
