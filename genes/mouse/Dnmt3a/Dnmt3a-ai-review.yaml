- term:
    id: GO:0003886
    label: DNA (cytosine-5-)-methyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1261827
  - PANTHER:PTN000552637
  - UniProtKB:Q9Y6K1
  review:
    summary: Dnmt3a is a de novo DNA cytosine-5 methyltransferase.
    action: ACCEPT
    reason: This is the core catalytic activity, established in mouse. Recombinant mouse Dnmt3a transfers methyl
      groups from AdoMet to cytosine C5 in unmethylated and hemimethylated DNA (PMID:11399089). Gene targeting abolishes
      de novo methylation in ES cells and embryos (PMID:10555141), and Dnmt3a re-expression restores methylation
      in Dnmt3a/3b-null ES cells (PMID:12897133). The IBA places this function at the PTN000552637 node; mouse Dnmt3a
      (MGI:1261827) is itself one of the experimental donors, which is expected rather than circular.
    supported_by:
    - *id014
    - &id016
      reference_id: PMID:10555141
      supporting_text: Inactivation of both genes by gene targeting blocks de novo methylation in ES cells and early
        embryos
    - &id017
      reference_id: PMID:12897133
      supporting_text: introduction of the Dnmt3a, Dnmt3a2, and Dnmt3b1 isoforms back into highly demethylated mutant
        ES cells restores genomic methylation patterns
