id: O88508
gene_symbol: Dnmt3a
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Dnmt3a is a mouse de novo DNA methyltransferase that transfers a methyl group from S-adenosyl-L-methionine
  to the C5 position of cytosine. It methylates unmethylated and hemimethylated CpG sites with similar efficiency
  and also methylates CpA. It establishes DNA methylation patterns in early embryos, in embryonic stem cells and
  in germ cells. In the germline it acts with the noncatalytic activator Dnmt3L to set maternal imprints and most
  paternal imprints, and it methylates retrotransposons in prospermatogonia. In somatic stem cells, including hematopoietic
  and postnatal neural stem cells, it silences or tunes genes during differentiation. Targeting to chromatin comes
  from its PWWP domain, which reads methylated H3K36 and directs Dnmt3a to pericentric heterochromatin and intergenic
  euchromatin, and from its ADD domain and partner proteins. Dnmt3a and Dnmt3b form a native complex and stimulate
  each other. MeCP2 binding to the ADD domain inhibits Dnmt3a, and sumoylation disrupts its interaction with HDAC1/2.
  The full-length product and the shorter Dnmt3a2, made from an alternative promoter, differ in their amino termini.
  Dnmt3a2 predominates in germ cells and in ES cells.
alternative_products:
- name: '1'
  id: O88508-1
  description: Full-length Dnmt3a (908 residues), expressed ubiquitously at low levels, with the N-terminal region,
    PWWP, ADD and catalytic domains.
- name: '2'
  id: O88508-2
  sequence_note: VSP_009423
  description: Dnmt3a2, made from an intronic alternative promoter, lacks residues 1-219 of the full-length product
    (689 residues) and keeps the PWWP, ADD and catalytic domains. It predominates in germ cells, ES cells and tissues
    undergoing de novo methylation.
