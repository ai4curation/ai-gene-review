  - ensembl:ENSP00000324375
  review:
    summary: Repression by Dnmt3a is mediated by promoter and CpG-island DNA methylation; the methylation-specific
      term is more precise.
    action: MODIFY
    reason: Transferred from human DNMT3A. Mouse experiments show that Dnmt3a silences genes by methylating promoter
      DNA (Oct4/Nanog promoters in differentiating ES cells, CpG islands at HSC regulatory genes, CpG islands of
      repressed genes when DNMT3A2 is overexpressed). Dnmt3a is not itself a transcription factor; the repressive
      activity is methylation-dependent, which GO:0044027 captures.
