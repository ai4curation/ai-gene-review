core_functions:
- description: De novo DNA cytosine-5 methyltransferase. Mouse Dnmt3a transfers methyl groups from AdoMet to cytosine
    C5 in unmethylated and hemimethylated DNA, mainly at CpG and also at CpA. It establishes methylation patterns
    in early embryos and ES cells, together with Dnmt3b.
  molecular_function: *id042
  directly_involved_in:
  - id: GO:0043045
    label: epigenetic programming of gene expression
  locations:
  - *id025
  in_complex: *id041
  supported_by:
  - *id014
  - *id035
  - *id016
  - *id017
  - *id040
- description: Germline imprint establishment. Working with the noncatalytic activator Dnmt3L, Dnmt3a lays down
    the de novo methylation of maternally imprinted loci in oocytes and of paternal DMRs (H19, IG-DMR, Zdbf2) in
    prospermatogonia. It also methylates SineB1, IAP and Line1 retrotransposons.
  molecular_function: *id042
  directly_involved_in:
  - *id043
  - *id029
  locations:
  - *id025
  in_complex: *id041
  supported_by:
  - *id030
  - *id031
  - *id036
  - *id044
  - *id045
- description: Methylation-dependent gene silencing during differentiation. Dnmt3a methylates promoter DNA and CpG
    islands of pluripotency and stem-cell regulatory genes (Oct4, Nanog, HSC multipotency genes), so that differentiation
    can proceed.
  molecular_function: *id042
  directly_involved_in:
  - *id001
  locations:
  - *id025
  supported_by:
  - *id002
  - *id003
  - *id004
- description: Chromatin targeting by histone reading. The PWWP domain of mouse Dnmt3a reads H3K36me3 and H3K36me2,
    which directs the enzyme to pericentric heterochromatin, to intergenic euchromatin and to gene bodies, and stimulates
    methylation of nucleosomal DNA.
  molecular_function:
    id: GO:0140003
    label: histone H3K36me3 reader activity
  locations:
  - *id025
  supported_by:
  - *id013
