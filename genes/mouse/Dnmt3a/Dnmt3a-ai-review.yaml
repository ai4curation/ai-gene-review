- term:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9Y6K1
  - ensembl:ENSP00000324375
  review:
    summary: Dnmt3a is recruited to promoters and chromatin by partners and histone readers; it has no sequence-specific
      DNA-binding domain.
    action: MODIFY
    reason: Dnmt3a contains PWWP, ADD and catalytic MTase domains and no sequence-specific DNA-binding module. Its
      occupancy at regulatory regions depends on chromatin recognition (the PWWP domain reading H3K36me3, nucleosome
      pulldown) and on recruiting factors, not on sequence-specific binding. The mouse PWWP domain itself has little
      DNA-binding ability (PMID:15456878). Chromatin binding states the supported activity, as in the human ortholog
      review.
    proposed_replacement_terms:
    - &id011
      id: GO:0003682
      label: chromatin binding
    supported_by:
    - &id012
      reference_id: PMID:20547484
      supporting_text: pulldown experiments with native histones and purified native nucleosomes
    - &id013
      reference_id: PMID:20547484
      supporting_text: specifically recognizes the histone 3 lysine 36 trimethylation mark
