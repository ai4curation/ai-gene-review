  - *id027
  - *id008
suggested_questions:
- question: Which paternally imprinted DMR fails to depend on Dnmt3a in germline knockouts, and which factor (Dnmt3b,
    Dnmt3c) compensates there?
- question: Does Dnmt3a contribute catalytically to piRNA-directed methylation of young transposons, or is DNMT3C
    sufficient once SPOCD1 recruits the machinery?
- question: Is cysteine auto-methylation of Dnmt3a a physiological way of turning off unused enzyme in cells, or
    only an in vitro side reaction?
suggested_experiments:
- hypothesis: Dnmt3a contributes catalytically to methylation of some piRNA-targeted transposon families in addition
    to DNMT3C.
  description: Map Dnmt3a-dependent methylation in germline cKO prospermatogonia by whole-genome bisulfite sequencing,
    with and without Dnmt3c loss, to separate Dnmt3a and Dnmt3c contributions at piRNA-targeted transposons.
  experiment_type: genetic interaction / methylome profiling
- hypothesis: Cys706 auto-methylation occurs on endogenous Dnmt3a when DNA substrate is limiting.
  description: Detect S-methylcysteine at Cys706 of endogenous Dnmt3a in ES cells or oocytes by targeted mass spectrometry
    to test whether auto-methylation happens in vivo.
  experiment_type: mass spectrometry
