- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:9488663
  review:
    summary: Nore1/RASSF5 (WITH/FROM Q5EBH1) binds Ras directly in a GTP- and effector-domain-dependent manner and associates with Ras after EGF receptor activation.
    action: REMOVE
    reason: NORE1 is a non-catalytic Ras-association-domain effector; no more specific H-Ras molecular function term applies (consistent with the human HRAS review). Removal does not mean the reported interaction is false; the bare protein binding term simply carries no functional information about H-Ras.
    supported_by:
    - reference_id: PMID:9488663
      supporting_text: We show that Nore1 directly interacts with Ras in vitro in a GTP-dependent manner, and the interaction requires an intact Ras effector domain
