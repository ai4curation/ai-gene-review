    label: circadian behavior
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Rank 3 (score 16.03), an exact GOA match. p53 does influence circadian behaviour through Per2
      regulation in mouse. Correct and already annotated, and another peripheral phenotype. Rank 5
      returns to the thymocyte apoptosis theme that dominated human p53's list, so between the two
      orthologs the model produces eight distinct correct-but-peripheral terms and no statement of
      what p53 does.
    supported_by:
    - reference_id: file:mouse/Trp53/Trp53-uniprot.txt
