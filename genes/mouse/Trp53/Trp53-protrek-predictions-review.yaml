  predicted_term:
    id: GO:0072716
    label: response to actinomycin D
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: FREQUENCY_BIAS
    summary: >-
      Rank 2 (score 16.26), with the cellular form of the same term at rank 4. Actinomycin D is a
      transcription inhibitor used to induce and study p53 stabilisation; two of the top four calls
      being one experimental reagent's response terms is the same artefact seen for MYC in both species.
      Mechanically these are GOA matches, but they describe the assay rather than the biology, and
      returning both the general and cellular variants adds nothing.
    supported_by:
