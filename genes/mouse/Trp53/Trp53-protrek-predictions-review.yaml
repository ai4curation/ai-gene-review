id: P02340
gene_symbol: Trp53
taxon:
  id: NCBITaxon:10090
  label: Mus musculus (Mouse)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for mouse p53. Four of the five calls are exact GOA matches,
  but the list has drifted away from the human p53 result: instead of cell-type apoptosis terms it
  leads with an ATP-dependent DNA/DNA annealing activity and two actinomycin D response terms. None
  of this review's core functions - sequence-specific DNA binding and RNA polymerase II transcription
  factor activity - is retrieved, which repeats the human outcome by a different route. Assessment:
  2 correct not novel (CNN), 1 nonparalog incorrect (NPI).
source_documents:
- projects/PROTREK_EVALUATION/argo139_protrek_hits.tsv
- genes/mouse/Trp53/Trp53-uniprot.txt
- genes/mouse/Trp53/Trp53-goa.tsv
predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0036310
    label: ATP-dependent DNA/DNA annealing activity
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 16.43), an exact GOA match. p53 does have documented DNA reannealing and
      strand-transfer activity through its C-terminal domain, so the call is on the record and correct
      - but it is an in vitro biochemical property, not the transcriptional activity that defines
      the protein, and it is the sort of narrow, rare annotation the GO index appears to favour over
      common central ones.
    supported_by:
    - reference_id: file:mouse/Trp53/Trp53-uniprot.txt
      supporting_text: >-
        Cellular tumor antigen p53
