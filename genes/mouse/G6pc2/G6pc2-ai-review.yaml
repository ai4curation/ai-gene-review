  review:
    summary: >-
      Recombinant IGRP overexpressed in insect cells hydrolyses glucose 6-phosphate with Km
      0.29-0.45 mM; a selective small-molecule inhibitor distinguishes it from the liver enzyme.
    action: ACCEPT
    reason: >-
      Direct enzymology of the target protein: the abstract reports Michaelis-Menten parameters
      for G6P hydrolysis and an inhibitor that blocks IGRP but not liver G6Pase, ruling out a
      contaminating phosphatase. It overturned the earlier failure to detect activity
      (PMID:10078553) and is corroborated by loss of islet activity in knockout mice
      (PMID:23274894) and by microsomal assays of transfected mouse G6PC2 (PMID:34954144). The
      abstract does not name the species of the construct; UniProt attributes the catalytic
      activity of the mouse entry to this paper (ECO:0000269), and mouse and human G6PC2 are
      84% identical, so the claim is sound for mouse either way. Turnover is far below G6pc1
      (PMID:34954144, PMID:38431189), but the low rate is what lets G6pc2 modulate rather than
      abolish glucokinase flux in beta cells, which is its physiological role.
    supported_by:
    - reference_id: PMID:14722102
      supporting_text: IGRP overexpressed in insect cells possesses enzymatic activity
        comparable to the previously described G-6-Pase activity in islets.
    - reference_id: PMID:14722102
      supporting_text: Interestingly, this inhibitor did not affect LG-6-Pase activity, while
        conversely LG-6-Pase inhibitors did not affect IGRP activity.
    - reference_id: PMID:34954144
      supporting_text: Higher G6Pase activity was detected following transient expression of
        His tagged mouse G6PC2 compared with His-tagged human G6PC2
