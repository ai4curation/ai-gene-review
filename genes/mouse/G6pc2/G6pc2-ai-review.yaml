description: >-
  G6pc2 (glucose-6-phosphatase 2, also called IGRP, islet-specific glucose-6-phosphatase
  catalytic subunit-related protein) is a multi-pass, N-glycosylated integral membrane protein
  of the endoplasmic reticulum with nine transmembrane helices, a C-terminal ER-retention
  motif and a luminal-facing PAP2-type phosphatase active site (His115, His174). It is
  expressed in pancreatic islet endocrine cells from late embryogenesis onwards, about
  twenty-fold more in beta cells than in alpha cells, and is essentially absent elsewhere.
  It hydrolyses glucose 6-phosphate to glucose and inorganic phosphate with a Km of about
  0.3-0.45 mM but a much lower turnover than the hepatic paralog G6pc1. In both islet cell
  types this activity opposes the glucose sensor glucokinase, creating a
  glucose/glucose-6-phosphate substrate cycle that lowers glycolytic and citric acid cycle
  flux and so sets the glucose concentration at which the cell changes its hormone output. In
  beta cells G6pc2 thereby shifts the glucose dose-response of glucose-stimulated insulin
  secretion to the right, acting as a negative regulator of insulin secretion at submaximal
  glucose and setting the fasting blood glucose level without changing fasting insulin; mice
  lacking G6pc2 globally or only in beta cells have lower fasting glucose, and become
  hypoglycaemic on prolonged fasting or a ketogenic diet. In alpha cells it raises the glucose
  set point at which glucagon secretion is suppressed, so alpha-cell-specific deletion lowers
  fasting and glucose-suppressed glucagon without altering insulin, islet hormone content or
  islet morphology. Unlike G6pc1 it does not contribute to hepatic or renal glucose
  production. G6pc2 is also a major beta-cell autoantigen targeted by pathogenic CD8+ T cells
  in autoimmune diabetes of NOD mice.
