- term:
    id: GO:0050796
    label: regulation of insulin secretion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9NQR9
  - ensembl:ENSP00000364512
  review:
    summary: >-
      Ensembl Compara transfer from human G6PC2; correct but less specific than the mouse data
      support: G6pc2 negatively regulates glucose-stimulated insulin secretion.
    action: MODIFY
    reason: >-
      Mouse experiments establish the direction and the stimulus. G6pc2 deletion enhances
      insulin secretion from perfused pancreas and isolated islets about 2-fold at submaximal
      glucose (5-11 mM) but not at 16.7 mM, i.e. a leftward shift of the glucose dose-response
      (PMID:23274894); CRISPR deletion in a mouse beta-cell line raises glycolytic and citric
      acid cycle flux and doubles GSIS (PMID:35176280). G6pc2 does part of the work: its own
      G6P hydrolysis opposes glucokinase at the entry to glycolysis, which is the step that sets
      the glucose sensitivity of insulin release. Refine to GO:0061179 negative regulation of
      insulin secretion involved in cellular response to glucose stimulus (an is_a descendant of
      GO:0050796 via GO:0046676 and GO:0061178).
    proposed_replacement_terms:
    - id: GO:0061179
      label: negative regulation of insulin secretion involved in cellular response to glucose
        stimulus
    supported_by:
    - reference_id: PMID:23274894
      supporting_text: G6pc2 deletion resulted in a leftward shift in the dose-response curve for
        glucose-stimulated insulin secretion (GSIS).
    - reference_id: PMID:23274894
      supporting_text: These data suggest that G6pc2 represents a novel, negative regulator of
        basal GSIS that acts by hydrolyzing glucose-6-phosphate, thereby reducing glycolytic
        flux.
    - reference_id: PMID:35176280
      supporting_text: Furthermore, intracellular insulin content and GSIS were enhanced by
        approximately two-fold
