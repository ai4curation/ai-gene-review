- term:
    id: GO:0070094
    label: positive regulation of glucagon secretion
  evidence_type: IMP
  original_reference_id: PMID:39742505
  qualifier: involved_in
  review:
    summary: >-
      Inducible alpha-cell-specific deletion of G6pc2 shifts the glucose set point for
      suppression of amino-acid-stimulated glucagon secretion leftward, so mutant islets
      release less glucagon at submaximal glucose and mutant mice have lower fasting and
      glucose-suppressed plasma glucagon with insulin unchanged.
    action: NEW
    reason: >-
      This is the alpha-cell arm of G6pc2 function, demonstrated after the first version of
      this review was written and not covered by any existing row. Bahl et al. 2025 crossed a
      new G6pc2 conditional allele to Gcg-CreERT2 and ablated G6pc2 in 88% of alpha cells.
      Glucagon was stimulated with a 4 mM amino acid mixture and then suppressed with rising
      glucose; secretion at zero glucose was the same in both genotypes, but knockout islets
      secreted significantly less glucagon at 0.5, 1, 3 and 5 mM glucose, a leftward shift of
      the glucose response curve. In vivo both sexes had lower glucagon before and after a
      glucose load, with no difference in insulin, and the same during an insulin tolerance
      test and under phloridzin, which excludes a paracrine insulin explanation. Islet
      composition, alpha and beta cell proportions, proliferation and hormone content were
      unaffected, and 2-NBDG efflux assays confirmed the loss of futile cycling in the mutant
      alpha cells. Sign: losing G6pc2 lowers glucagon output at a given glucose, so G6pc2 is a
      positive regulator of glucagon secretion (GO:0070094, verified in OLS; is_a GO:0070092
      and GO:0090277, no children). Participation: the regulated step is alpha-cell glycolytic
      flux and G6pc2's own G6P hydrolysis is what lowers it, opposing glucokinase, so the gene
      product does the work rather than merely being required. Comparator check:
      cell-intrinsic regulators of alpha-cell glucagon release carry these terms (Pask
      GO:0070092 IMP PMID:21181396, Kcnk16 GO:0070092 IMP PMID:29402588, Syt7 GO:0070092 IMP
      PMID:19171650, Ffar4 GO:0070094 IMP PMID:24742677; QuickGO annotation search by
      reference, re-run 2026-11-10), so there is no convention against
      annotating an intracellular islet enzyme here. This supersedes the expectation recorded
      in the earlier version of this review, which cited the roughly 20-fold beta-cell bias of
      mouse G6pc2 (PMID:39121091) and the unchanged fasting glucagon of germline knockouts as
      reasons not to annotate a mouse alpha-cell role: a cell-autonomous effect is demonstrable
      in mouse despite the low expression, and the same effect was reproduced in primary human
      alpha cells. The matching row is in the human G6PC2 review.
    additional_reference_ids:
    - PMID:39121091
    supported_by:
    - reference_id: PMID:39742505
      supporting_text: when incubated in the presence of 0.5mM, 1mM, 3mM, or 5mM glucose,
        α-G6PC2KO islets secreted significantly (P < 0.0001) less glucagon relative to
        control islets, confirming a left shift in the glucose response curve for glucagon
        release
    - reference_id: PMID:39742505
      supporting_text: Using inducible, cell type-specific gene ablation of G6pc2 in mice we
        document a dramatic shift in the set-point for glucose suppression of glucagon
        secretion, resulting in more than half-maximal reduction in glucagon release from
        isolated islets at 1 mM glucose.
    - reference_id: PMID:39742505
      supporting_text: revealed lower glucagon concentrations in both male and female
        α-G6PC2KO mice relative to controls
    - reference_id: PMID:39742505
      supporting_text: We observed no changes in proliferation of α or β cells, nor in their
        relative proportions in islets of 12-week-old α-G6PC2KO versus age-matched control
        mice
    - reference_id: PMID:39742505
      supporting_text: G6pc2 expression was ablated in 88% of α cells
