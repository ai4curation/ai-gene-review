- id: PMID:14722102
  title: Enzymatic characterization of the pancreatic islet-specific glucose-6-phosphatase-related
    protein (IGRP).
  findings:
  - statement: Recombinant IGRP hydrolyses glucose 6-phosphate with Km 0.29-0.45 mM.
    supporting_text: The K(m) and V(max) values determined using glucose-6-phosphate as the
      substrate were 0.45 mm and 32 nmol/mg/min by malachite green assay, and 0.29 mm and 77
      nmol/mg/min by glucose oxidase/peroxidase coupling assay, respectively.
  - statement: A selective inhibitor distinguishes IGRP from liver G6Pase.
    supporting_text: Interestingly, this inhibitor did not affect LG-6-Pase activity, while
      conversely LG-6-Pase inhibitors did not affect IGRP activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; the species of the expressed IGRP is not stated in the abstract.
      Primary enzymology for the MF. A later study found the same compound (VU0945627) inhibits
      human but not mouse G6PC2 (PMID:38431189), a hint that the construct may have been human;
      the catalytic claim holds for mouse on the knockout islet data.
- id: PMID:23274894
