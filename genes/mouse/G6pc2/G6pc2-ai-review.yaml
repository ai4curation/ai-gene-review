    supporting_text: Fig. 1A shows that glucose-6-phosphatase activity is reduced in islets
      isolated from G6pc2 KO mice.
  - statement: G6pc2 deletion shifts the glucose dose-response of GSIS to the left and lowers
      fasting glucose without changing fasting insulin.
    supporting_text: As a consequence, under fasting conditions in which plasma insulin levels
      were identical, blood glucose levels were reduced in G6pc2 KO mice, again consistent with
      human GWAS data.
  - statement: Deletion does not change the maximal rate of GSIS.
    supporting_text: This observation suggests that the absence of G6pc2 does not affect the
      Vmax of GSIS.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Key mouse paper for the activity (IMP), the futile-cycle model and the
      negative regulation of basal GSIS.
