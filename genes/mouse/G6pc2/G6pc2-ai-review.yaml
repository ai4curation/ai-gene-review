core_functions:
- description: >-
    Integral ER-membrane glucose-6-phosphatase of pancreatic islet endocrine cells. G6pc2
    hydrolyses glucose 6-phosphate delivered to the ER lumen back to glucose, opposing
    glucokinase in a glucose/glucose-6-phosphate substrate cycle. The cycle lowers glycolytic
    and citric acid cycle flux at submaximal glucose and so sets the glucose concentration at
    which the cell changes its hormone output: in beta cells it shifts the glucose
    dose-response of insulin secretion to the right, and in alpha cells it raises the glucose
    set point for suppression of glucagon secretion. Through the beta-cell arm it sets the
    fasting blood glucose level.
  molecular_function:
    id: GO:0004346
    label: glucose-6-phosphatase activity
  directly_involved_in:
  - id: GO:0061179
    label: negative regulation of insulin secretion involved in cellular response to glucose
      stimulus
  - id: GO:0070094
    label: positive regulation of glucagon secretion
  - id: GO:0042593
    label: glucose homeostasis
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  anatomical_locations:
  - id: CL:0000169
    label: type B pancreatic cell
  - id: CL:0000171
    label: pancreatic A cell
  substrates:
  - id: CHEBI:61548
    label: D-glucopyranose 6-phosphate(2-)
  supported_by:
  - reference_id: PMID:14722102
    supporting_text: The K(m) and V(max) values determined using glucose-6-phosphate as the
      substrate were 0.45 mm and 32 nmol/mg/min by malachite green assay, and 0.29 mm and 77
      nmol/mg/min by glucose oxidase/peroxidase coupling assay, respectively.
  - reference_id: PMID:25552595
    supporting_text: glucose cycling was abolished in G6pc2 KO mouse islets, confirming that
      G6pc2 opposes the action of the glucose sensor glucokinase by hydrolyzing G6P
  - reference_id: PMID:23274894
    supporting_text: These data suggest that G6pc2 represents a novel, negative regulator of
      basal GSIS that acts by hydrolyzing glucose-6-phosphate, thereby reducing glycolytic
      flux.
  - reference_id: PMID:15044018
    supporting_text: IGRP is a glycoprotein, held in the endoplasmic reticulum by nine
      transmembrane domains
  - reference_id: PMID:39742505
    supporting_text: Using inducible, cell type-specific gene ablation of G6pc2 in mice we
      document a dramatic shift in the set-point for glucose suppression of glucagon
      secretion, resulting in more than half-maximal reduction in glucagon release from
      isolated islets at 1 mM glucose.
  knowledge_gaps:
  - gap_statement: Which ER glucose-6-phosphate transporter supplies substrate to G6pc2 in beta
      cells is not established genetically.
    boundary: Islets express the hepatic G6P transporter G6PT1/SLC37A4 (PMID:12878201), and an
      inhibitor that also blocks SLC37A4 suppresses glucose cycling in a mouse beta-cell line
      (PMID:38431189), but no beta-cell deletion of the transporter has tested whether it is
      required for G6pc2-dependent cycling.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: The cycle's rate, and hence the glucose set point, could be limited by substrate
      import rather than by G6pc2 itself, which matters for designing G6PC2 inhibitors to lower
      fasting glucose.
    resolution: Beta-cell-specific Slc37a4 deletion with stable-isotope glucose-cycling and GSIS
      measurements in islets.
    provenance:
    - reference_id: PMID:12878201
      supporting_text: the expression of islet-specific G6Pase-related protein (IGRP) in
        pancreatic islets was confirmed and its expression in liver was also observed
suggested_questions:
- question: Should PAINT add an IRD for gluconeogenesis (GO:0006094) at the mammalian G6PC2
    node PTN000287500 of PTHR12591, given that mammalian G6PC2 is beta-cell restricted and its
    knockout phenotype is mediated by insulin secretion rather than by islet glucose output, and
    is there non-mammalian evidence (bird, reptile or fish G6PC2 tissue distribution) to decide
    whether the loss belongs at the Euteleostomi G6PC2 node PTN002650241 instead?
  experts:
  - O'Brien RM
- question: What structural features make G6PC2 turnover so much lower than G6PC1 at similar Km,
    and is the low rate selected to tune rather than abolish glucokinase flux?
  experts:
  - O'Brien RM
  - Young JD
- question: Does G6PC2 hydrolyse luminal sugar phosphates other than glucose 6-phosphate, or is
    glucose 6-phosphate its only physiological substrate?
- question: >-
    Alpha-cell-specific deletion changes glucagon secretion in mouse (PMID:39742505) even
    though mouse G6pc2 is about 20-fold beta-cell biased (PMID:39121091). How much of the
    whole-animal fasting-glucose phenotype of a global knockout comes from the alpha-cell arm
    rather than the beta-cell arm, and does the balance differ in human, where the bias is
    only about five-fold?
  experts:
  - Martin CC
  - O'Brien RM
  - Kaestner KH
suggested_experiments:
- hypothesis: G6pc2 does not contribute to endogenous glucose production.
  description: Measure endogenous glucose production and gluconeogenic flux (stable-isotope
    tracers, with a pyruvate tolerance test and a hyperinsulinaemic-euglycaemic clamp) in global
    and beta-cell-specific G6pc2 knockout mice and littermate controls, fed and fasted. Equal
    production would rule out a measurable extra-islet contribution, which no published study
    has tested directly.
  experiment_type: in vivo metabolic flux analysis
- hypothesis: SLC37A4 is required to deliver glucose 6-phosphate to G6pc2 in beta cells.
  description: Delete Slc37a4 specifically in beta cells and measure islet glucose cycling by
    stable-isotope flux analysis, glucose-6-phosphatase activity in islet microsomes, GSIS at
    submaximal glucose, and fasting blood glucose, compared with beta-cell G6pc2 knockouts.
  experiment_type: conditional knockout with metabolic flux analysis
- hypothesis: G6PC2 has a narrower substrate range than its paralogs G6PC1 and G6PC3.
  description: Express purified mouse G6pc2, G6pc1 and G6pc3 and compare their activity against a
    panel of sugar phosphates (including 1,5-anhydroglucitol 6-phosphate) to test whether G6pc2
    is specialised for glucose 6-phosphate.
  experiment_type: comparative enzyme kinetics
- hypothesis: The low catalytic rate of G6pc2 is tuned to its modulatory role.
  description: Create knock-in mice carrying a high-activity G6pc2 variant and measure the glucose
    dose-response of insulin secretion and fasting blood glucose to test whether raising turnover
    shifts the glucose set point.
  experiment_type: knock-in allelic series with physiology
