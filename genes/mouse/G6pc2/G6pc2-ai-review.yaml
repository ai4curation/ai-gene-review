- id: PMID:39742505
  title: G6PC2 controls glucagon secretion by defining the set point for glucose in pancreatic
    α cells.
  findings:
  - statement: >-
      Inducible alpha-cell-specific deletion of G6pc2 shifts the glucose set point for
      suppression of amino-acid-stimulated glucagon secretion leftward, so mutant islets
      secrete less glucagon at 0.5-5 mM glucose although secretion at zero glucose is
      unchanged.
    supporting_text: when incubated in the presence of 0.5mM, 1mM, 3mM, or 5mM glucose,
      α-G6PC2KO islets secreted significantly (P < 0.0001) less glucagon relative to control
      islets, confirming a left shift in the glucose response curve for glucagon release
  - statement: >-
      Fasting and glucose-suppressed plasma glucagon are lower in alpha-cell-specific
      knockouts of both sexes, with insulin unchanged.
    supporting_text: revealed lower glucagon concentrations in both male and female α-G6PC2KO
      mice relative to controls
  - statement: >-
      Islet composition, alpha and beta cell proportions and proliferation are unaffected by
      alpha-cell deletion.
    supporting_text: We observed no changes in proliferation of α or β cells, nor in their
      relative proportions in islets of 12-week-old α-G6PC2KO versus age-matched control mice
  - statement: >-
      The same effect on glucose suppression of glucagon secretion was reproduced by shRNA
      knockdown in sorted primary human alpha cells.
    supporting_text: we normalized the results to the KCl response, and found the
      shG6PC2-exressing α cell pseudoislets to be significantly (P < 0.05 at 1mM glucose, P <
      0.01 at 3, 5 and 9 mM glucose) more sensitive to glucose
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text. The basis of the NEW positive-regulation-of-glucagon-secretion row and the
      only functional study of G6pc2 in alpha cells. A new conditional allele crossed to
      Gcg-CreERT2 ablated G6pc2 in 88% of alpha cells; phloridzin treatment and insulin
      tolerance tests exclude a paracrine insulin explanation, and 2-NBDG efflux assays show
      loss of futile cycling in the mutant alpha cells. Limitations the authors state are that
      islet numbers precluded perifusion assays and that no pharmacological G6PC2 inhibitor
      was available.
