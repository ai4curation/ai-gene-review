  review:
    summary: >-
      Gluconeogenesis propagated from the root G6PC node to the islet paralog. G6pc2 is a
      beta-cell enzyme that cycles glucokinase-derived glucose 6-phosphate back to glucose to
      tune insulin secretion; it does not take part in glucose production from non-carbohydrate
      precursors.
    action: REMOVE
    reason: >-
      The IBD for gluconeogenesis was placed at PTN000971890, the eumetazoan node ancestral to
      G6PC1, G6PC2 and G6PC3, and is seeded only by G6PC1 (human, mouse, rat), G6pc3 (mouse,
      rat) and a Drosophila member; no G6PC2 is a seed. `just paint-losses mouse G6pc2` finds no
      IRD or IKR on the lineage, so the row is current and the disagreement is with the node
      reaching the G6PC2 clade. Target-specific evidence shows the process role diverged in that
      clade while the catalytic machinery was retained. (1) G6pc2 is restricted to islet beta
      cells; the cloning paper found no other major tissue source, and the Vanderbilt group
      concluded that G6PC2 is highly unlikely to act in peripheral tissues, where G6pc1 and
      G6pc3 are far more abundant and more active. (2) In beta cells its substrate is G6P made
      from glucose by glucokinase, so its activity forms a futile substrate cycle that lowers
      glycolytic flux, not a route from pyruvate, lactate, glycerol or amino acids to glucose
      (the GO definition of gluconeogenesis). (3) The knockout phenotype is explained by insulin
      secretion: beta-cell-specific deletion alone is sufficient to lower fasting glucose, and
      the hypoglycaemia seen on prolonged fasting or a ketogenic diet is therefore a beta-cell
      effect on insulin output, not reduced glucose production, since islets do not supply
      blood glucose. Bgee expression, used here only as a
      paralog-controlled consistency check, agrees: in the gluconeogenic tissues (liver, kidney
      cortex, small intestine) G6pc2 has 10 absent calls and only low-scoring present calls
      (best 55), with one of its top-10 tissues in that context, whereas the sister paralog
      G6pc1 is present at scores near 98 and has six of its top-10 tissues there. G6pc2 does
      have low present calls in adult liver (scores 46-60), matching the trace extra-islet
      expression reported in PMID:12878201 and PMID:32213654, so expression alone could not
      carry this decision. Taken together the inherited process term is an over-propagation to a
      paralog that was co-opted for beta-cell glucose sensing; the electronic UniPathway row is
      removed for the same reason.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000971890
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Root eumetazoan G6PC node. Its gluconeogenesis seeds are G6PC1 and G6pc3
          orthologs plus a fly member; the G6PC2 clade below it is islet-restricted and acts in a
          beta-cell glucose/G6P cycle, so the process does not descend to it.
      residue_claims_not_applicable: The argument is a change of pathway role and tissue context
        with the catalytic site retained (UniProt active sites His115 and His174), not a loss of
        catalytic residues, so no residue claim applies.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      requested_change: CHECK
      asserted_value: GO:0006094
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        The gluconeogenesis IBD at PTN000971890 (PTHR12591) propagates to the G6PC2 subfamily
        (PTHR12591:SF1), none of whose members is a seed. G6PC2 is islet beta-cell restricted
        and hydrolyses glucokinase-derived G6P in a substrate cycle that sets the glucose
        sensitivity of insulin secretion; beta-cell-specific deletion is sufficient for its
        fasting-glucose phenotype (PMID:32213654). Consider an IRD for GO:0006094 at the node
        that founds the G6PC2 clade.
      supported_by:
      - reference_id: PMID:32213654
        supporting_text: In adult mice, beta cell-specific deletion of G6pc2 was sufficient to
          reduce FBG without changing FPI.
    supported_by:
    - reference_id: file:mouse/G6pc2/G6pc2-deep-research-claude-code.md
      supporting_text: Its main physiological role is not gluconeogenesis, as it is in liver.
    - reference_id: PMID:32213654
      supporting_text: Even if G6pc2 is expressed at trace levels in these non-pancreatic
        tissues, because both G6PC1 (Lei, et al. 1993) and G6PC3 (Shieh et al. 2003) have much
        higher catalytic activity than G6PC2 (Petrolonis, et al. 2004), these results suggest that
