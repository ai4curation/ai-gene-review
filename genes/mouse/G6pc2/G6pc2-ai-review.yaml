- term:
    id: GO:0042593
    label: glucose homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9NQR9
  - ensembl:ENSP00000364512
  review:
    summary: >-
      Ensembl Compara transfer from human G6PC2; G6pc2 sets the fasting blood glucose level in
      mice.
    action: ACCEPT
    reason: >-
      Directly supported by mouse genetics, independent of the human source. Global G6pc2
      deletion lowers fasting blood glucose by 11-16% with unchanged fasting insulin
      (PMID:17265032, PMID:23274894), beta-cell-specific deletion is sufficient for this
      (PMID:32213654), and knockout mice become hypoglycaemic on prolonged fasting or a ketogenic
      diet (PMID:32569842). The activity is the mechanism: by cycling G6P back to glucose in the
      beta cell, G6pc2 shifts the glucose threshold for insulin secretion and hence the blood
      glucose level at which the system settles. GO:0042593 has only one child (intracellular
      glucose homeostasis), which does not apply, so this term is as precise as warranted.
    supported_by:
    - reference_id: PMID:23274894
      supporting_text: Fig. 4B shows that, following a 6- h fast, blood glucose levels were
        indeed reduced in both male and female G6pc2 KO mice relative to their WT littermates
        (16.4 and 14.4%, respectively), whereas fasting insulin levels were unchanged
    - reference_id: PMID:32569842
      supporting_text: When challenged with either a ketogenic diet or 24 hr fasting, blood
        glucose fell to 70 mg/dl or less in G6pc2 KO but not WT mice, suggesting that G6PC2 may
        have evolved, in part, to prevent hypoglycemia.
