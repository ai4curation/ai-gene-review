- id: PMID:10078553
  title: Molecular cloning of a pancreatic islet-specific glucose-6-phosphatase catalytic
    subunit-related protein.
  findings:
  - statement: IGRP is a 355-residue protein 50% identical to liver G6Pase with similar predicted
      transmembrane topology, conserved catalytic residues and an ER retention signal; it is
      translocated and glycosylated in a microsomal system.
    supporting_text: structurally related (50% overall identity) to the liver
      glucose-6-phosphatase and exhibited similar predicted transmembrane topology,
      conservation of catalytically important residues, and the presence of an endoplasmic
      reticulum retention signal.
  - statement: Expression is islet-specific and parallels insulin during development.
    supporting_text: During development, it was expressed in parallel with insulin mRNA.
  - statement: No phosphatase activity was detected in transfected cells in this first study, a
      result superseded by PMID:14722102.
    supporting_text: the IGRP failed to show glucose phosphotransferase or phosphatase activity
      with p-nitrophenol phosphate, inorganic pyrophosphate, or a range of sugar phosphates
      hydrolyzed by the liver enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Defines the gene, its topology and islet-restricted expression.
      Its negative activity result was overturned by later enzymology and knockout islet assays.
