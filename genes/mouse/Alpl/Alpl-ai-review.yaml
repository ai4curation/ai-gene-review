core_functions:
- description: TNAP is a GPI-anchored, homodimeric, Zn/Zn/Mg-dependent phosphomonoesterase
    on the outer face of the plasma membrane and on matrix vesicle membranes, where it hydrolyses
    extracellular inorganic pyrophosphate. Destroying this inhibitor of hydroxyapatite propagation,
    while raising local inorganic phosphate, is what permits mineral seeded inside matrix
    vesicles to propagate into the collagenous matrix of bone and tooth. Loss of function
    reproduces human hypophosphatasia, and compound ablation with Phospho1 shows the two enzymes
    act non-redundantly at successive steps.
  molecular_function:
    id: GO:0004427
    label: inorganic diphosphate phosphatase activity
  directly_involved_in:
  - id: GO:0030282
    label: bone mineralization
  - id: GO:0071529
    label: cementum mineralization
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0065010
    label: extracellular membrane-bounded organelle
  supported_by:
  - reference_id: PMID:19874193
    supporting_text: We conclude that TNAP is the enzyme that hydrolyzes both ATP and PP(i)
      in the MV compartment.
- description: 'The same active site dephosphorylates extracellular pyridoxal 5''-phosphate
    to pyridoxal, the membrane-permeant vitamin B6 vitamer. This is the gateway for cellular
    B6 uptake, and its loss is directly lethal in this organism: Alpl-null mice die from seizures
    caused by defective vitamin B6 metabolism, which is the mechanism behind pyridoxine-responsive
    seizures in infantile hypophosphatasia.'
  molecular_function:
    id: GO:0033883
    label: pyridoxal phosphatase activity
  directly_involved_in:
  - id: GO:0042822
    label: pyridoxal 5'-phosphate metabolic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:7550313
    supporting_text: Mice lacking tissue non-specific alkaline phosphatase die from seizures
      due to defective metabolism of vitamin B-6.
- description: 'In thermogenic fat cells TNAP is localised to mitochondria rather than the
    cell surface, where it hydrolyses N-phosphocreatine to initiate the futile creatine cycle:
    creatine is rephosphorylated and the phosphate bond energy dissipated as heat without
    mechanical or chemical work. Cold exposure powerfully induces the enzyme, inhibition abolishes
    futile cycling in isolated mitochondria, and adipocyte-specific ablation reduces whole-body
    energy expenditure and causes rapid-onset obesity. This is a distinct role from the mineralization
    function, in a different compartment and cell type.'
  molecular_function:
    id: GO:0050187
    label: phosphoamidase activity
  directly_involved_in:
  - id: GO:0140651
    label: futile creatine cycle
  - id: GO:0120162
    label: positive regulation of cold-induced thermogenesis
  locations:
  - id: GO:0005758
    label: mitochondrial intermembrane space
  supported_by:
  - reference_id: PMID:33981039
    supporting_text: Thermogenic fat cells have robust phosphocreatine phosphatase activity,
      which is attributed to tissue-nonspecific alkaline phosphatase (TNAP).
  - reference_id: PMID:33981039
    supporting_text: Unlike in other cells, TNAP in thermogenic fat cells is localized to
      the mitochondria, where futile creatine cycling occurs.
proposed_new_terms:
- proposed_name: promotion of non-skeletal tissue mineralization
  proposed_definition: A process in which a gene product increases the deposition of calcium
    phosphate mineral in tissue that is not normally mineralized, for example by degrading
    extracellular inorganic pyrophosphate or other endogenous inhibitors of hydroxyapatite
    propagation in vascular or soft tissue.
  justification: 'GO offers GO:0140928 for the inhibiting direction but nothing for the promoting
    one, which forces curators of pyrophosphate-degrading enzymes into a directionally incorrect
    annotation. Mouse Alpl is the clearest case and the origin of the problem: its GO:0140928
    rows trace to an experiment in which TNAP overexpression increased aortic calcification.
    A term in the promoting direction would let this well-supported biology be recorded correctly
    rather than dropped or expressed as a NOT annotation. Enpp1 and Ank, the other arms of
    the same paper, would keep GO:0140928.'
  supported_by:
  - reference_id: PMID:21490328
    supporting_text: Overexpression of TNAP increased calcification of cultured aortas.
suggested_questions:
- question: Is mitochondrial localisation of TNAP in thermogenic adipocytes reproducible in
    human cells? Every human annotation for this compartment and for phosphocreatine hydrolysis
    is an orthology transfer from the mouse work, and a GPI-anchored ectoenzyme reaching the
    mitochondrial intermembrane space is topologically unusual enough that independent confirmation
    would be valuable.
- question: How is the substrate hierarchy set in vivo? Recombinant enzyme hydrolyses phosphocholine
    and phosphoethanolamine about as efficiently as pyrophosphate, yet the knockout phenotype
    is dominated by skeletal disease and B6-dependent seizures. Is the ordering set by local
    substrate concentration, by compartmentalisation on matrix vesicles versus the hepatocyte
    surface, or by competition with other ectophosphatases?
- question: How many species carry the directionally inverted GO:0140928 annotation propagated
    from this gene, and does correcting it here propagate the fix? The term currently reaches
    more than thirty organisms by orthology from these two mouse rows, so the mouse record
    is the leverage point.
suggested_experiments:
- hypothesis: TNAP promotes rather than prevents ectopic mineralization, so the GO:0140928
    annotation on this gene is directionally wrong.
  description: Test the direction explicitly in mouse vascular smooth muscle by overexpressing
    and separately inhibiting TNAP under calcifying conditions and measuring both mineral
    deposition and extracellular pyrophosphate, alongside Enpp1-null and ank/ank controls
    from the same study design. This restates the original experiment with the direction as
    the primary readout rather than as a secondary observation, and would settle the annotation
    on its own evidence.
  experiment_type: cell and tissue calcification assay
- hypothesis: The mineralization, vitamin B6 and futile creatine cycle roles can be separated
    genetically.
  description: Build knock-in mice carrying substitutions that impair one substrate branch
    while sparing the others, guided by the human hypophosphatasia alleles that already dissociate
    pyrophosphate from pyridoxal phosphate activity, and phenotype for skeletal mineralization,
    seizure susceptibility, hepatic lipid handling and cold-induced energy expenditure. Separating
    the branches in one organism would show whether the three core functions recorded here
    are truly independent or share a rate-limiting step.
  experiment_type: knock-in mouse allelic series
