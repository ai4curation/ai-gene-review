    label: bone mineralization
  evidence_type: IMP
  original_reference_id: PMID:26457330
  qualifier: involved_in
  review:
    summary: 'Bone mineralization, the best-supported process annotation for this gene and
      the one with the deepest evidence base: eleven rows drawn from eight separate mouse
      studies, including single and compound knockouts with Phospho1 and Enpp1.'
    action: ACCEPT
    reason: Core, and this is the organism in which the causal chain was established. Alpl-null
      mice reproduce hypophosphatasia, and the compound ablations dissect the division of
      labour between TNAP and PHOSPHO1 in initiating versus propagating mineral. The family
      review scopes this term to Euteleostomi on a PAINT node seeded from this very gene.
    supported_by:
    - reference_id: PMID:26457330
      supporting_text: Tissue-nonspecific alkaline phosphatase (TNAP) and PHOSPHO1 are indispensable
        for bone and cartilage mineralization but their functional relationship in the mineralization
        process remains unclear.
