- term:
    id: GO:0008253
    label: 5'-nucleotidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: 5'-nucleotidase activity, the AMP-to-adenosine step completing the stepwise ectonucleotidase
      cascade.
    action: KEEP_AS_NON_CORE
    reason: A real catalytic capability, but in most tissues this step is dominated by the
      dedicated ecto-5'-nucleotidase NT5E, so the quantitative contribution of TNAP is context-dependent.
- term:
    id: GO:0016791
    label: phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: InterPro2GO mapping to the generic parent term, discarding the alkaline pH optimum
      that the source signature itself names.
    action: MODIFY
    reason: The InterPro entries behind this row are the alkaline phosphatase domain and its
      active site, which license GO:0004035, a descendant that is directly supported here
      many times over. Applied consistently across all six alkaline phosphatase reviews in
      this set.
    proposed_replacement_terms:
    - id: GO:0004035
      label: alkaline phosphatase activity
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: ATP hydrolysis activity. The enzyme does hydrolyse ATP, and in osteoblast-derived
      matrix vesicles ATP was the main substrate hydrolysed, with TNAP the responsible enzyme.
    action: KEEP_AS_NON_CORE
    reason: 'The chemistry is real but the term carries an unhelpful connotation: it normally
      labels ATPases that couple hydrolysis to work, whereas TNAP strips the terminal phosphate
      as a promiscuous phosphomonoesterase with no energy coupling. Retained as non-core to
      record the ectonucleotidase capability without implying it is an ATPase.'
    supported_by:
    - reference_id: PMID:19874193
      supporting_text: The lack of TNAP had the most pronounced effect on the hydrolysis of
        all physiologic substrates.
- term:
    id: GO:0031966
    label: mitochondrial membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Mitochondrial membrane, the companion localisation from the same study, with
      TNAP described as tethered to mitochondrial membranes in thermogenic adipocytes.
    action: ACCEPT
    reason: 'Same basis and same assessment as the intermembrane space row: direct evidence
      in this organism, restricted to one cell type but not therefore doubtful.'
- term:
    id: GO:0043262
    label: ADP phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: ADP phosphatase activity, the middle step of stepwise extracellular ATP degradation,
      measured in matrix vesicles.
    action: KEEP_AS_NON_CORE
    reason: 'Genuine but ancillary: purinergic nucleotide turnover is shared with the ENPP,
      CD39 and CD73 systems and is not the reaction whose loss produces the knockout phenotype.'
- term:
    id: GO:0050187
    label: phosphoamidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: 'Phosphoamidase activity, defined narrowly as hydrolysis of N-phosphocreatine
      to creatine and phosphate. In mouse this is directly demonstrated: thermogenic fat cells
      have robust phosphocreatine phosphatase activity attributable to TNAP.'
    action: ACCEPT
    reason: Accepted here on direct evidence, in contrast to the human record where the same
      term rests only on similarity to this gene. This is the annotation that grounds the
      whole futile creatine cycle story, and the mouse is where it was established.
    supported_by:
    - reference_id: PMID:33981039
      supporting_text: Thermogenic fat cells have robust phosphocreatine phosphatase activity,
        which is attributed to tissue-nonspecific alkaline phosphatase (TNAP).
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: Calcium ion binding, corresponding to the mammalian-specific structural calcium
      site that has no counterpart in the bacterial enzyme.
    action: KEEP_AS_NON_CORE
    reason: 'Real and structurally located: the family review confirms the four calcium ligands
      are present as an invariant Glu-Phe-Glu-Asp set in all eight animal members examined
      and absent from all three microbial ones. Non-core because the site is structural rather
      than catalytic and does not influence phosphatase activity.'
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: Extracellular region, reached when the GPI anchor is cleaved and catalytically
      active enzyme is released into extracellular fluid and serum.
    action: KEEP_AS_NON_CORE
    reason: True but unspecific, and downstream of where the enzyme does its defining work.
      Worth keeping because circulating alkaline phosphatase is the standard clinical readout,
      but it is a released form rather than a functional compartment.
- term:
    id: GO:0016462
    label: pyrophosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: The broad parent term covering hydrolysis of any pyrophosphate bond, which also
      spans nucleoside triphosphatases. The experiments behind these rows measured hydrolysis
      of inorganic pyrophosphate specifically.
    action: MODIFY
    reason: GO:0004427 is a descendant of this term and is already annotated to mouse Alpl
      from the same experiments. Using the parent understates what was measured and blurs
      the distinction between destroying inorganic PPi, which is what governs mineralization,
      and hydrolysing a nucleotide anhydride bond. The same modification is applied in the
      human ALPL review.
    proposed_replacement_terms:
    - id: GO:0004427
      label: inorganic diphosphate phosphatase activity
- term:
    id: GO:0032496
    label: response to lipopolysaccharide
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Response to lipopolysaccharide. TNAP can dephosphorylate the lipid A moiety of
      LPS, though in the gut that role belongs mainly to the intestinal isozyme.
    action: KEEP_AS_NON_CORE
    reason: Plausible and consistent with the enzyme's broad substrate tolerance, but peripheral
      here. Note that a response-to term describes the cell's reaction to a stimulus, which
      is a weaker and different claim than dephosphorylating LPS, and should not be read as
      supporting the catalytic claim.
- term:
    id: GO:0032868
    label: response to insulin
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Response to insulin, an expression-response annotation transferred by orthology.
    action: KEEP_AS_NON_CORE
    reason: Regulation of the gene rather than a function of the protein, and not demonstrated
      in this organism. Retained because there is no positive evidence against it.
- term:
    id: GO:0033280
    label: response to vitamin D
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Response to vitamin D, transferred by orthology from the human osteoblast studies
      in which 1,25-dihydroxyvitamin D3 induces alkaline phosphatase activity.
    action: KEEP_AS_NON_CORE
    reason: A real and well-documented regulatory relationship, but it records that Alpl is
      a vitamin D-responsive gene rather than anything about the enzyme's activity.
- term:
    id: GO:0033883
    label: pyridoxal phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: 'Pyridoxal 5''-phosphate phosphatase activity. In mouse this is not an incidental
      substrate preference: Alpl-null mice die of seizures caused by defective vitamin B6
      metabolism, which is the cleanest in vivo demonstration of the reaction''s importance
      in the whole family.'
    action: ACCEPT
    reason: Core, and the mouse is where the causal evidence lives. Because PLP cannot cross
      the plasma membrane, extracellular dephosphorylation by TNAP is the obligatory step
      supplying cells with usable vitamin B6.
- term:
    id: GO:0036005
    label: response to macrophage colony-stimulating factor
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Response to macrophage colony-stimulating factor, an orthology- transferred stimulus-response
      annotation from a bone-cell culture context.
    action: KEEP_AS_NON_CORE
    reason: Weakly informative and at the far periphery of what is known about this gene.
      Retained rather than removed because there is no positive evidence against it.
- term:
    id: GO:0051384
    label: response to glucocorticoid
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Response to glucocorticoid. Glucocorticoids are classical inducers of alkaline
      phosphatase in osteoblastic culture systems.
    action: KEEP_AS_NON_CORE
    reason: Describes regulation of the gene rather than the function of the protein. Not
      wrong, but carries no information about what the enzyme does.
- term:
    id: GO:0052731
    label: phosphocholine phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: Phosphocholine phosphatase activity, demonstrated on recombinant enzyme and supported
      in mouse by the liver steatosis and reduced serum triglyceride phenotype of TNAP-knockout
      animals.
    action: ACCEPT
    reason: A genuinely new addition to the accepted substrate repertoire of this enzyme,
      established in 2025 with kinetics comparable to PPi hydrolysis and structural identification
      of the binding residues. The mouse knockout supplies the physiological readout.
    supported_by:
    - reference_id: PMID:41145834
      supporting_text: Recombinant TNAP hydrolyzes phosphocholine and phosphoethanolamine
        with similar efficiency than PPi.
- term:
    id: GO:0052732
    label: phosphoethanolamine phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Phosphoethanolamine phosphatase activity. Long inferred from the accumulation
      of phosphoethanolamine in hypophosphatasia, and now measured directly on purified enzyme.
    action: ACCEPT
    reason: Correct and well supported. Together with the phosphocholine row this establishes
      that the enzyme feeds cellular choline and ethanolamine uptake for phospholipid synthesis,
      a function separate from mineralization.
- term:
    id: GO:0055074
    label: calcium ion homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Calcium ion homeostasis, drawn from vascular calcification studies in which TNAP
      activity determines whether calcium phosphate mineral is deposited in soft tissue.
    action: KEEP_AS_NON_CORE
    reason: Indirect. TNAP acts on phosphate-containing substrates, not on calcium; any effect
      on calcium is a consequence of altered calcium-phosphate deposition. Retained because
      the causal link to mineral deposition is real, but this is not a calcium-handling protein.
- term:
    id: GO:0065010
    label: extracellular membrane-bounded organelle
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: is_active_in
  review:
    summary: 'Extracellular membrane-bounded organelle, which for this gene means the matrix
      vesicle: the membrane-limited vesicle released by osteoblasts and chondrocytes in which
      hydroxyapatite seed crystals first form.'
    action: ACCEPT
    reason: A genuine second site of action alongside the cell surface, and the is_active_in
      qualifier is apt. Kinetic analysis of TNAP- deficient matrix vesicles shows the enzyme's
      loss dominates substrate hydrolysis in that compartment.
    supported_by:
    - reference_id: PMID:19874193
      supporting_text: Comparison of the catalytic efficiencies identified ATP as the main
        substrate hydrolyzed by WT MVs.
- term:
    id: GO:0071529
    label: cementum mineralization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Cementum mineralization, the dental counterpart of the skeletal phenotype. Acellular
      cementum failure is what produces premature tooth loss in hypophosphatasia.
    action: ACCEPT
    reason: Specific and well founded. Dental mineralization is not a peripheral aspect of
      this gene's biology but the presenting feature of the mildest human disease form, and
      the mouse is where the tissue-level defect was characterised.
