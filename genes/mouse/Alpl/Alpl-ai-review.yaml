- term:
    id: GO:0005758
    label: mitochondrial intermembrane space
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Mitochondrial intermembrane space. Unlike in other cells, TNAP in thermogenic
      fat cells localises to mitochondria, which is where futile creatine cycling occurs.
    action: ACCEPT
    reason: 'Topologically unusual for a GPI-anchored protein and therefore worth stating
      carefully, but this is the direct observation on which the human ISS and IEA rows depend.
      Accepting it here while keeping the human rows non-core is the correct asymmetry: the
      evidence is in this organism.'
    supported_by:
    - reference_id: PMID:33981039
      supporting_text: Unlike in other cells, TNAP in thermogenic fat cells is localized to
        the mitochondria, where futile creatine cycling occurs.
    - reference_id: file:mouse/Alpl/Alpl-deep-research-falcon.md
      supporting_text: Biochemical purification found Alpl/TNAP **sevenfold enriched** in
        the active mitochondrial phosphocreatine-phosphatase fraction.
