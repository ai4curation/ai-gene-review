id: P09242
gene_symbol: Alpl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Alpl encodes mouse tissue-nonspecific alkaline phosphatase (TNAP), the rodent
  orthologue of human ALPL and the organism in which most of what is believed about this enzyme
  was actually established. It is a homodimeric, GPI-anchored Zn/Zn/Mg metalloenzyme displayed
  on the outer leaflet of the plasma membrane and on osteoblast- and chondrocyte-derived matrix
  vesicles, hydrolysing phosphate monoesters at alkaline pH through a covalent phosphoseryl
  intermediate at Ser110. Its principal substrate is extracellular inorganic pyrophosphate,
  the endogenous inhibitor of hydroxyapatite propagation, and the Alpl-null mouse reproduces
  hypophosphatasia: defective skeletal and dental mineralization, with compound ablation alongside
  Phospho1 separating the initiation of crystal formation inside matrix vesicles from its
  propagation into the extracellular matrix. The enzyme also dephosphorylates pyridoxal 5''-phosphate,
  and knockout mice die of seizures from defective vitamin B6 metabolism, which is the clearest
  in vivo evidence anywhere in the family that this reaction matters.

  Two further roles were discovered in this organism and are the reason its record matters
  for the human gene. TNAP dephosphorylates phosphocholine and phosphoethanolamine, enabling
  hepatocyte choline uptake, and knockouts develop liver steatosis. And in thermogenic fat
  cells TNAP is localised to mitochondria, where it acts as the phosphocreatine phosphatase
  of the futile creatine cycle; adipocyte-specific ablation reduces energy expenditure and
  causes rapid-onset obesity. Almost every non-core annotation on human ALPL is an orthology
  transfer of one of these mouse observations.

  The mouse record also carries the family''s most consequential annotation error. Two rows
  assert that Alpl is involved in inhibiting non-skeletal tissue mineralization, from a study
  that in fact showed the opposite, and those rows are the source of the same claim in human
  and in more than thirty other species.'
existing_annotations:
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: The core molecular function. Mouse Alpl is one of the seeds behind the family-wide
      PAINT node for this term, and the activity is directly measured in several of the cited
      studies.
    action: ACCEPT
    reason: Correct and ancestral. The family review (PANTHER:PTHR11596) found the catalytic
      serine and the Zn/Zn/Mg ligands conserved in all twenty-seven reviewed members, with
      mouse Alpl carrying serine at position 110, so the term is safe here on residue grounds
      as well as experimental ones.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Plasma membrane. TNAP is GPI-anchored on the outer leaflet with its catalytic
      domain facing outward, so this is genuinely where the enzyme acts.
    action: ACCEPT
    reason: 'Correct. The family review records the PAINT node for this term as scoped to
      Eumetazoa and seeded partly from this gene, which is the right boundary: the bacterial
      members are periplasmic and the fungal ones vacuolar.'
- term:
    id: GO:0030282
    label: bone mineralization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Bone mineralization, the best-supported process annotation for this gene and
      the one with the deepest evidence base: eleven rows drawn from eight separate mouse
      studies, including single and compound knockouts with Phospho1 and Enpp1.'
    action: ACCEPT
    reason: Core, and this is the organism in which the causal chain was established. Alpl-null
      mice reproduce hypophosphatasia, and the compound ablations dissect the division of
      labour between TNAP and PHOSPHO1 in initiating versus propagating mineral. The family
      review scopes this term to Euteleostomi on a PAINT node seeded from this very gene.
