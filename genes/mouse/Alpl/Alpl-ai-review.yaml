- term:
    id: GO:0140928
    label: inhibition of non-skeletal tissue mineralization
  evidence_type: IDA
  original_reference_id: PMID:21490328
  qualifier: involved_in
  review:
    summary: 'This is the source annotation behind the directionally inverted transfers into
      human, and reviewing it here is the point of doing the mouse gene. The term asserts
      a homeostatic process that acts by preventing mineralization of non-skeletal tissue.
      The cited paper shows the opposite for TNAP: overexpressing it increased calcification
      of cultured aortas, and inhibiting it reduced pyrophosphate hydrolysis by half. The
      only inhibitory role the paper attributes is to pyrophosphate itself, not to the enzyme
      that destroys it.'
    action: REMOVE
    reason: 'TNAP degrades extracellular pyrophosphate, the endogenous inhibitor of hydroxyapatite
      propagation, so it promotes rather than prevents ectopic mineralization. The genes that
      genuinely perform this process, ENPP1 and ANK, are the other arms of the same paper
      and are correctly annotated to it. The likely origin of the error is the abstract''s
      closing sentence, which credits an inhibitory role to locally produced pyrophosphate;
      read quickly, that can be taken as crediting TNAP. Independent human-relevant evidence
      points the same way: a selective TNAP inhibitor attenuates ectopic calcification in
      Abcc6-null mice. Either a NOT qualifier or a new term for the promoting direction would
      capture the real relationship. The human IEA that descends from this row was removed
      in the ALPL review, and the family review records the term as NOT_APPLICABLE across
      PANTHER:PTHR11596.'
    supported_by:
    - reference_id: PMID:21490328
      supporting_text: Overexpression of TNAP increased calcification of cultured aortas.
    - reference_id: PMID:21490328
      supporting_text: The results show that smooth muscle NPP1 and TNAP control vascular
        calcification through effects on synthesis and hydrolysis of ePP i , indicating an
        important inhibitory role of locally produced PP i .
