- term:
    id: GO:0004427
    label: inorganic diphosphate phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: Hydrolysis of inorganic pyrophosphate, measured directly in mouse matrix vesicles
      and in further studies of skeletal mineralization. This is the reaction that links Alpl
      to bone.
    action: ACCEPT
    reason: Core. Removing extracellular PPi lifts the brake on hydroxyapatite propagation,
      and the mouse knockout phenotype is the strongest evidence anywhere that this reaction
