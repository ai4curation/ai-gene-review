- term:
    id: GO:0016462
    label: pyrophosphatase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000008
  qualifier: enables
  review:
    summary: The broad parent term covering hydrolysis of any pyrophosphate bond, which also
      spans nucleoside triphosphatases. The experiments behind these rows measured hydrolysis
      of inorganic pyrophosphate specifically.
    action: MODIFY
    reason: GO:0004427 is a descendant of this term and is already annotated to mouse Alpl
      from the same experiments. Using the parent understates what was measured and blurs
      the distinction between destroying inorganic PPi, which is what governs mineralization,
      and hydrolysing a nucleotide anhydride bond. The same modification is applied in the
      human ALPL review.
    proposed_replacement_terms:
    - id: GO:0004427
      label: inorganic diphosphate phosphatase activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:P05186
        source_label: ALPL
        source_status: SUPPORTS_TRANSFER
        comment: 'Human ALPL genuinely hydrolyses inorganic pyrophosphate, so the transfer
          itself is sound and the source is not at fault. The problem is the term chosen:
          GO:0016462 is the broad pyrophosphate-bond parent, while the measured reaction on
          both the human and the mouse protein is hydrolysis of inorganic diphosphate, which
          has its own descendant term. The human review modifies the same rows the same way.'
