  qualifier: acts_upstream_of_or_within
  review:
    summary: G6pc1 is coupled to ER glucose-6-phosphate transport but is not the transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The substrate-transport phenotype is real: G6pc1 hydrolysis and Slc37a4 transport are tightly
      coupled in the ER G6Pase system. The transport step itself, however, is executed by Slc37a4/G6PT,
      while G6pc1 catalyzes hydrolysis after luminal import. A GO-CAM should model G6pc1 downstream of
      the antiporter, as the gluconeogenesis model does, not annotate the phosphatase to the transport
      process.'
    supported_by:
    - reference_id: PMID:8640227
      supporting_text: glucose-6-P transport and hydrolysis are performed by separate proteins which
        are tightly coupled
    - reference_id: PMID:11121425
