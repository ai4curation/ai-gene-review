  review:
    summary: ER glucose 6-phosphate availability can modulate glucocorticoid metabolism.
    action: KEEP_AS_NON_CORE
    reason: G6pc1 and H6pd compete for ER glucose 6-phosphate; changing G6Pase or Slc37a4 therefore
      changes 11beta-HSD1 reductase activity by altering the luminal NADPH supply. This is
      mechanistic crosstalk through the shared ER substrate pool, not a core steroid-conversion
      activity of G6pc1 itself.
