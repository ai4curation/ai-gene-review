core_functions:
- description: Hydrolyzes glucose 6-phosphate to glucose and inorganic phosphate at the luminal face
    of the endoplasmic reticulum membrane, completing glucose production from gluconeogenic
    precursors and glycogen-derived glucose 6-phosphate.
  molecular_function:
    id: GO:0004346
    label: glucose-6-phosphatase activity
  directly_involved_in:
  - id: GO:0006094
    label: gluconeogenesis
  - id: GO:0005980
    label: glycogen catabolic process
  - id: GO:0042593
    label: glucose homeostasis
  - id: GO:0051156
    label: glucose 6-phosphate metabolic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:8407995
    supporting_text: the in vitro expressed enzyme is indistinguishable from mouse liver microsomal
      glucose-6-phosphatase
  - reference_id: PMID:29428299
    supporting_text: G6Pase catalyzes the terminal reaction of glycogenolysis and gluconeogenesis in
      liver and kidney and the hydrolysis of glucose-6-phosphate (G6P) to glucose and inorganic
      phosphate.
suggested_questions:
- question: Which G6pc1-dependent systemic lipid, cholesterol, urate and steroid phenotypes reflect
    direct ER substrate competition, and which are downstream adaptations to impaired hepatic
    glucose production?
suggested_experiments:
- hypothesis: The apparent glucose-6-phosphate transport defects in G6pc1 mutants are coupling
    effects caused by loss of luminal hydrolysis rather than direct transport by G6pc1.
  description: Reconstitute Slc37a4 with wild-type or catalytically inactive G6pc1 in matched
    ER-membrane vesicles and measure isotope-labeled glucose 6-phosphate influx separately from
    luminal hydrolysis.
