  review:
    summary: Glucose-6-phosphate hydrolysis is the core molecular activity of mouse G6pc1.
    action: ACCEPT
    reason: "Mouse G6pc1's phosphohydrolase activity is experimentally established: the cloned murine
      enzyme behaved like liver microsomal G6Pase (PMID:8407995), adenoviral G6pc1 restored hepatic G6Pase
      activity in G6pc1-null mice (PMID:10625614), and liver-directed human G6PC mRNA rescued G6Pase activity
      and fasting glucose in liver-specific G6pc1-deficient mice (PMID:29428299). `just paint-losses mouse
      G6pc1` reports no PAINT IRD or IKR loss, so the IBA from PTHR12591 agrees with target-specific evidence.
      Activity rows imported from G6PC1 orthologs or pathway mappings are therefore sound; the PMID:15087461
      and PMID:15661744 rows are kept without inferring from the abstracts that those G6PC3-focused papers
      are direct G6pc1 assays."
    supported_by:
    - reference_id: PMID:8407995
      supporting_text: the in vitro expressed enzyme is indistinguishable from mouse liver
        microsomal glucose-6-phosphatase
    - reference_id: PMID:10625614
      supporting_text: Hepatic G6Pase activity in Ad-mG6Pase-infused mice was restored to 19% of
        that in G6Pase(+/+) mice at 7-14 days post-infusion
    - reference_id: PMID:29428299
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000971890
        source_status: SUPPORTS_TRANSFER
        comment: Root eumetazoan G6PC node; mouse G6pc1 sits in the conserved G6PC1 subfamily and
          has direct mouse glucose-6-phosphatase evidence.
