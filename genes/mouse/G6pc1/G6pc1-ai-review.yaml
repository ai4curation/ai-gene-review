id: P35576
gene_symbol: G6pc1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'G6pc1 encodes the liver, kidney and intestine isoform of the glucose-6-phosphatase catalytic
  subunit, a multipass endoplasmic-reticulum membrane phosphohydrolase whose active site hydrolyses glucose
  6-phosphate to glucose and inorganic phosphate in the ER lumen. Together with the ER glucose-6-phosphate/phosphate
  antiporter Slc37a4, G6pc1 catalyzes the terminal step shared by gluconeogenesis and glycogenolysis and
  thereby maintains fasting blood glucose. Loss of G6pc1 in mice models glycogen storage disease type
  Ia, with impaired liver and kidney glucose production, fasting hypoglycemia, hepatomegaly, glycogen
  accumulation and secondary lipid and urate abnormalities.'
existing_annotations:
