  review:
    summary: G6pc1 deficiency secondarily perturbs triglycerides.
    action: KEEP_AS_NON_CORE
    reason: G6pc1 does not catalyze a triglyceride reaction, but blocking the terminal
      glucose-production step raises G6P and redirects hepatic carbon into glycogen and lipids;
      G6pc1 restoration improves the hypertriglyceridemia of G6pc1-null mice. This is retained as a
      non-core metabolic consequence.
