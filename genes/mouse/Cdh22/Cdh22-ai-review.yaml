    supporting_text: preferentially interact with themselves in a homophilic manner
  - reference_id: DOI:10.1038/s41593-026-02515-6
    supporting_text: CDH22 can form homophilic and heterophilic interactions
      with other cadherin-family members
- description: >-
    Perisomatic inhibitory-synapse adhesion molecule: in layer 5 extratelencephalic pyramidal
    neurons CDH22 localizes to the perisomatic plasma membrane at the postsynaptic sites of
    parvalbumin-positive inputs and is required, downstream of activity-dependent FEZF2, for
    the formation of PV+ perisomatic (GABAergic) synapses.
  molecular_function:
    id: GO:0045296
    label: cadherin binding
  directly_involved_in:
  - id: GO:1904862
    label: inhibitory synapse assembly
  locations:
  - id: GO:0098982
    label: GABA-ergic synapse
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: DOI:10.1038/s41593-026-02515-6
    supporting_text: we found that exogenously expressed CDH22-HA clusters
      at the postsynaptic sites of PV+ inputs in ET neurons
  - reference_id: DOI:10.1038/s41593-026-02515-6
    supporting_text: To examine whether CDH22 is necessary for the development of
      PV+ perisomatic inhibition in L5 ET neurons, we designed shRNA targeting Cdh22 mRNA
suggested_questions:
- question: >-
    Does CDH22 mediate PV+ perisomatic adhesion homophilically (CDH22-CDH22 across the cleft)
    or heterophilically with a PV-enriched partner such as Cdh7?
suggested_experiments:
- description: >-
    Test the trans-synaptic binding partner of CDH22 at PV+ to L5 ET perisomatic synapses, e.g.
    by selective PV-interneuron knockdown of candidate partners (Cdh7) combined with CDH22
    manipulation in ET cells, and by biochemical/cell-aggregation assays of CDH22 homophilic
    versus heterophilic binding.
