- term:
    id: GO:0098982
    label: GABA-ergic synapse
  evidence_type: IDA
  original_reference_id: DOI:10.1038/s41593-026-02515-6
  qualifier: located_in
  review:
    summary: >-
      In L5 ET pyramidal neurons, CDH22 is restricted to the perisomatic plasma membrane and
      clusters at the postsynaptic sites of PV+ (GABAergic) inputs, identifying it as a component
      of the perisomatic inhibitory synapse.
    action: NEW
    reason: >-
      Localization of HA-tagged CDH22 shows it is concentrated at the postsynaptic sites of PV+
      inputs onto L5 ET neurons; PV+ basket-cell synapses are GABAergic/inhibitory. This is the
      inhibitory-synapse counterpart to the (over-annotated) glutamatergic-synapse IEA. Evidence
      is from an overexpressed tagged construct, so the row is IDA with that caveat; a
      post-synaptic-side refinement could be added if a more specific inhibitory postsynaptic CC
      term is warranted. Not in GOA.
    supported_by:
    - reference_id: DOI:10.1038/s41593-026-02515-6
      supporting_text: we found that exogenously expressed CDH22-HA clusters
        at the postsynaptic sites of PV+ inputs in ET neurons
    - reference_id: DOI:10.1038/s41593-026-02515-6
      supporting_text: the CDH22-HA is primarily
        restricted to the perisomatic plasma membrane, compatible with
        a role at perisomatic synapses
- term:
    id: GO:1904862
    label: inhibitory synapse assembly
  evidence_type: IMP
  original_reference_id: DOI:10.1038/s41593-026-02515-6
  qualifier: involved_in
  review:
    summary: >-
      CDH22 is required for the development of PV+ perisomatic inhibitory synapses onto L5 ET
      pyramidal neurons: shRNA knockdown of Cdh22 reduces mIPSC frequency and the density of
      PV+ (Syt2+) perisomatic boutons, rescued by an shRNA-resistant construct.
    action: NEW
    reason: >-
      Participation test passes: CDH22 is a cell-surface adhesion molecule physically present at
      the synapse (it clusters at PV+ postsynaptic sites), not a substrate or upstream regulator,
      so it performs part of the work of synapse assembly (compare neuroligin-2, annotated to
      synapse assembly). Knockdown reduces PV+ bouton density and mIPSC frequency (but not
      mEPSCs) with shRNA-resistant rescue, so the inhibitory-specific term GO:1904862 is used
      rather than the generic synapse assembly. Not in GOA.
    supported_by:
    - reference_id: DOI:10.1038/s41593-026-02515-6
      supporting_text: To examine whether CDH22 is necessary for the development of
        PV+ perisomatic inhibition in L5 ET neurons, we designed shRNA targeting Cdh22 mRNA
    - reference_id: DOI:10.1038/s41593-026-02515-6
      supporting_text: the frequency of events
        was reduced in shCdh22-infected cells compared with shLacz control
        neurons
core_functions:
- description: >-
    Calcium-dependent, homophilic classical cadherin: CDH22 binds calcium at its
    cadherin-repeat interfaces to form a rigid adhesion-competent ectodomain and interacts
    preferentially with itself (and heterophilically with other cadherins) to mediate
    cell-cell adhesion, coupling to the cytoskeleton through its catenin-binding tail.
  molecular_function:
    id: GO:0045296
    label: cadherin binding
  directly_involved_in:
  - id: GO:0016339
    label: calcium-dependent cell-cell adhesion
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
