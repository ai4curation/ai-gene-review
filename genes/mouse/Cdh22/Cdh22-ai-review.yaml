taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mouse Cdh22 (Cadherin-22; also PB-cadherin, "pituitary and brain cadherin") encodes a
  classical type-I, single-pass transmembrane cadherin. Like other classical cadherins it
  is a calcium-dependent cell-cell adhesion protein that interacts preferentially in a
  homophilic manner through its extracellular cadherin repeats and couples to the
  actin cytoskeleton through a cytoplasmic catenin-binding tail (beta-catenin/catenin
  complex). Expression is predominantly in the brain, abundant in olfactory bulb,
  cerebrum and cerebellum, and begins during embryogenesis in the telencephalon,
  isthmus and spinal cord. In the postnatal cerebral cortex, CDH22 is a cell-surface
  adhesion molecule of layer 5 extratelencephalic (ET) pyramidal neurons, where it is
  restricted to the perisomatic plasma membrane and clusters at the postsynaptic sites of
  parvalbumin-positive (PV+) inputs; it is required for the formation of PV+ perisomatic
  inhibitory (GABAergic) synapses onto these neurons. CDH22 can engage in homophilic and
  heterophilic interactions with other cadherin-family members (for example Cdh7, which is
  enriched in PV+ basket cells).
