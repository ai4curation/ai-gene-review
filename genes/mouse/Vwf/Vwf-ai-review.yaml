id: Q8CIZ8
gene_symbol: Vwf
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Von Willebrand factor (Vwf) is a very large multimeric glycoprotein made by vascular endothelial
  cells and megakaryocytes. The precursor carries a signal peptide and a large propeptide (von Willebrand
  antigen 2) followed by D, A, C and cystine-knot domains. Pro-Vwf dimerizes in the ER, is assembled into
  disulfide-linked multimers in the Golgi, and is stored as tubules in endothelial Weibel-Palade bodies
  (whose formation it drives) and in platelet alpha granules for regulated secretion. Secreted Vwf circulates
  in plasma and is deposited in the subendothelial matrix. At sites of vascular injury its A3 domain binds
  exposed collagen and its A1 domain captures platelets through glycoprotein Ib-alpha (GPIb-IX-V) under
  shear. An RGD motif engages integrin alphaIIb-beta3, supporting firm adhesion and aggregation, and the
  D'D3 region carries and protects coagulation factor VIII. Vwf-null mice reproduce severe von Willebrand
  disease, with prolonged bleeding, low factor VIII and defective arterial thrombosis. They also show
  impaired leukocyte rolling, because Weibel-Palade bodies and surface P-selectin are lost.
