suggested_questions:
- question: Should Vwf carry a Weibel-Palade body biogenesis process term (e.g. GO:0033363 secretory granule
    organization)? Vwf tubules form the organelle scaffold and Vwf-null endothelium lacks rod-shaped Weibel-Palade
    bodies; how does GO treat other cargo proteins that act as granule scaffolds?
- question: MGI rows citing PMID:7854452 (Hgf knockout) and PMID:8562500 (CD24/P-selectin) are attached
    to Vwf; should they be moved to Hgf and Selp (or Cd24a)?
suggested_experiments:
- description: Knock-in mice with Vwf A1 or C4-RGD point mutations, compared with the null, to separate
    GPIb-dependent from integrin-dependent contributions to thrombosis, leukocyte recruitment and Weibel-Palade
    body formation in vivo.
