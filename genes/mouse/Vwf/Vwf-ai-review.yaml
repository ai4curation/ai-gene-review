  evidence_type: IDA
  original_reference_id: PMID:30573509
  qualifier: acts_upstream_of_or_within
  review:
    summary: Clotting-cascade activation inferred from a Tspan18 knockout study that measures VWF release.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO:0002543 is a positive regulation of blood coagulation that is part of the acute inflammatory
      response. In PMID:30573509 VWF is the readout: plasma VWF released in response to histamine, which
      is reduced in Tspan18-null mice, plus thrombo-inflammatory outcomes. The paper does not test whether
      VWF itself activates the clotting cascade. VWF contributes to coagulation as the factor VIII carrier
      and by triggering platelet procoagulant activity through GPIb (PMID:21037087), which the blood coagulation
      rows already capture. The claim that VWF activates the cascade goes beyond this evidence.'
    supported_by:
