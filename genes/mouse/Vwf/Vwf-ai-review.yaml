- term:
    id: GO:1901731
    label: positive regulation of platelet aggregation
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: involved_in
  supporting_entities:
  - RGD:621759
  review:
    summary: Positive regulation of platelet aggregation transferred from rat.
    action: MODIFY
    reason: VWF does not regulate platelet aggregation from outside the process; it does part of the work
      as a bridging ligand, linking GPIb and alphaIIb-beta3 on adjacent platelets under high shear, as
      fibrinogen does at low shear. Fibrinogen chains carry platelet aggregation itself. The participant
      term GO:0070527 platelet aggregation, which this regulation term positively regulates, is the better
      fit (a lateral role correction).
    proposed_replacement_terms:
    - id: GO:0070527
      label: platelet aggregation
    supported_by:
    - &id029
      reference_id: PMID:10930441
      supporting_text: The two principal ligands known to mediate platelet adhesion and aggregation are
        von Willebrand factor (vWF) and fibrinogen (Fg)
    - *id005
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: RGD:621759
        source_label: rat Vwf
        source_status: UNRESOLVED
        comment: The rat source annotation was not traced; VWF participates in platelet aggregation as
          a bridging ligand rather than regulating it.
