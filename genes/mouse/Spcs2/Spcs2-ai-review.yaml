id: A0A140LHW5
gene_symbol: Spcs2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: SPCS2 is a noncatalytic subunit of the endoplasmic-reticulum signal peptidase complex. The
  74-residue mouse product A0A140LHW5 retains only an N-terminal segment of the 226-residue Spcs2 reference
  and lacks its two transmembrane helices. Stable membrane integration, complex assembly and a biological
  function for this short product have not been established.
