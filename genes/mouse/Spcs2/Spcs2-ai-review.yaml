id: A0A140LHW5
gene_symbol: Spcs2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Spcs2 encodes signal peptidase complex subunit 2 (SPC25), a noncatalytic, two-pass
  endoplasmic-reticulum membrane subunit of the signal peptidase complex, which removes
  N-terminal signal peptides from secretory and membrane preproteins during translocation;
  catalysis is carried out by the SEC11A or SEC11C subunit. A0A140LHW5 is not the canonical
  226-residue Spcs2 protein (Q9CYN2) but the 74-residue translation of the non-canonical
  Ensembl transcript Spcs2-206 (ENSMUST00000208465). This transcript skips canonical coding
  exon 3 (161 nt, a frameshifting skip) and joins exon 2 to a shortened exon 4, so the product
  shares residues 1-66 of the canonical protein (the N-terminal cytosolic, largely disordered
  glycine-rich segment) and ends in an unrelated eight-residue tail (KRPHRNGS). It lacks both
  transmembrane helices (canonical residues 87-107 and 112-132) and the C-terminal cytosolic
  domain. Whether this short product accumulates in cells, associates with the ER membrane or
  the signal peptidase complex, or has any function is unknown.
references:
- id: PMID:34388369
  title: Structure of the human signal peptidase complex reveals the determinants for signal peptide cleavage.
  findings:
  - statement: Human structural analysis identifies distinct catalytic SEC11 subunits within the four-subunit
      signal peptidase complex.
    supporting_text: "the \nhuman SPC exists in two functional paralogs with distinct proteolytic subunits."
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Re-checked in the 2026-10-21 re-review. Establishes the catalytic (SEC11) versus accessory
      (SPCS1-3) division of labour in the human complex; human SPCS2 (Q15005) and mouse Spcs2 Q9CYN2 are
      both in PANTHER PTHR13085:SF0. Evidence is about full-length SPCS2, not the 74-residue product.
- id: PMID:42173868
  title: Structural basis of signal peptide recognition by the signal peptidase complex.
  findings:
  - statement: The substrate-bound human structure distinguishes SPCS2 from the catalytic SEC11 subunit.
    supporting_text: the catalytic SPC subunit (paralog Sec11A or Sec11C, respectively) is joined by SPCS1
      (also known as SPC12), SPCS2 (SPC25), and SPCS3 (SPC22/23).
  - statement: SPCS2 contacts within the complex are made through its transmembrane helix, a region absent
      from the 74-residue product.
    supporting_text: The TM helix of SPCS2 displays a limited set of contacts
  - statement: Bilayer deformation in the SPC membrane window is affected by SPCS2 deletion and mutation,
      a membrane-embedded role of the full-length subunit.
    supporting_text: Coarse-grained molecular dynamics (MD) simulations indicate deformation of the lipid
      bilayer inside of the window that is affected by deletion and mutation of SPC subunit SPCS2
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Re-checked in the 2026-10-21 re-review against cached full text. Supports SPCS2 as a noncatalytic
      accessory subunit and locates its structurally resolved contacts in the membrane region; says nothing
      about the isolated N-terminal segment retained in A0A140LHW5.
