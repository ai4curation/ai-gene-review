  title: Structure of the human signal peptidase complex reveals the determinants for signal peptide cleavage.
  findings:
  - statement: The human signal peptidase complex has two paralogous forms that differ in their catalytic
      SEC11 subunit; SPCS2 is a shared accessory subunit.
    supporting_text: "the \nhuman SPC exists in two functional paralogs with distinct proteolytic subunits."
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Establishes the catalytic versus accessory subunit division for
      full-length human SPCS2, the PTHR13085:SF0 ortholog of canonical mouse Spcs2. It does not study the
      short mouse product.
- id: PMID:42173868
  title: Structural basis of signal peptide recognition by the signal peptidase complex.
  findings:
  - statement: SPCS2 is a noncatalytic subunit that joins the catalytic SEC11A or SEC11C subunit with
      SPCS1 and SPCS3.
    supporting_text: the catalytic SPC subunit (paralog Sec11A or Sec11C, respectively) is joined by SPCS1
      (also known as SPC12), SPCS2 (SPC25), and SPCS3 (SPC22/23).
  - statement: SPCS2 lies next to Sec61beta, which places the complex near the lateral gate of the
      translocon.
    supporting_text: The SPC-SPL11 structure indicates that proximal localization of SPCS2 to Sec61β would
      position the SPC close to the lateral gate of Sec61α enabling most direct insertion of the SP into
      the SPC membrane window.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Structural work on the full-length human complex; relevant to the
      canonical gene product, not to the 74-residue splice product reviewed here.
