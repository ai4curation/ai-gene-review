id: A0A140LHW5
gene_symbol: Spcs2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mouse Spcs2 encodes signal peptidase complex subunit 2 (SPC25), a noncatalytic accessory
  subunit of the endoplasmic reticulum signal peptidase complex, which removes N-terminal signal
  peptides from secretory and membrane proteins as they are translocated into the ER. The canonical
  226-residue product (Q9CYN2) spans the ER membrane twice with both termini in the cytosol;
  catalysis is supplied by the SEC11A or SEC11C subunit, while SPCS2 helps build the membrane-embedded
  part of the complex and lies next to the Sec61 translocon. A0A140LHW5 is a 74-residue product of an
  alternatively spliced Spcs2 transcript (Ensembl Spcs2-206) that skips the third coding exon. It
  shares only the first 66 residues of the canonical protein, which form the low-complexity,
  glycine-rich and largely disordered start of the N-terminal cytoplasmic domain, followed by an
  eight-residue frame-shifted tail. It lacks both transmembrane helices, the lumenal loop and the
  C-terminal cytoplasmic domain, and so lacks every region that holds SPCS2 in the membrane and in the
  complex. Whether this short product is made in cells, and whether it has any function, is unknown.
