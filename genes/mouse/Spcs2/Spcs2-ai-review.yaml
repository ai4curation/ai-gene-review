existing_annotations: []
core_functions: []
suggested_questions:
- question: Does the Spcs2-206 transcript (ENSMUST00000208465) produce a stable 74-residue protein in mouse
    tissues? Proteomic peptides reported for A0A140LHW5 can map to the N-terminal segment it shares with
    canonical Spcs2 and then cannot distinguish the two products.
- question: Can the isolated cytosolic N-terminal segment of SPCS2 (residues 1-66) bind any signal peptidase
    complex subunit or translocon component in the absence of the SPCS2 transmembrane region?
suggested_experiments:
- description: Detect the Spcs2-206 junction (exon 2 joined to the shortened exon 4) by RT-PCR and look for
    a peptide spanning the KRPHRNGS tail by targeted mass spectrometry, to establish whether the 74-residue
    product exists in vivo.
  experiment_type: transcript and targeted proteomic detection
knowledge_gaps:
- gap_statement: It is unknown whether the 74-residue Spcs2-206 product is made in vivo and, if so, whether
    it has any function; it lacks the membrane region through which full-length SPCS2 joins the signal
    peptidase complex.
  gap_kind:
  - BIOLOGY
