knowledge_gaps:
- gap_statement: >-
    It is not known whether the Spcs2-206 transcript is translated into a stable 74-residue protein in
    any mouse tissue, nor whether such a product, which lacks the membrane-spanning and C-terminal
    regions of SPCS2, has any activity or partner.
  boundary: >-
    Canonical SPCS2 is an established accessory subunit of the ER signal peptidase complex. The
    74-residue product shares only the disordered N-terminal 66 residues with it, a region not known
    to be needed for complex assembly.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: Is ENSMUSP00000146574 (A0A140LHW5) supported by any peptide that covers its unique
    eight-residue C-terminal tail, or are the proteomics hits only to the shared N-terminal residues
    that cannot tell it apart from canonical Spcs2?
- question: Should GO annotations for mouse Spcs2 attach to the canonical product Q9CYN2 rather than to
    this short splice product, given that it lacks the membrane-spanning region?
suggested_experiments:
- description: Targeted mass spectrometry for peptides spanning the exon 2 to alternative exon 4
    junction and the unique tail (residues 66-74) in mouse tissues with high Spcs2 expression, to test
    whether the 74-residue product exists.
- description: Express tagged 74-residue product in mouse cells and test ER membrane association and
    co-immunoprecipitation with Sec11a, Spcs1 and Spcs3, with canonical Spcs2 as a positive control.
