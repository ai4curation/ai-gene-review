id: A0A140LHW5
gene_symbol: Spcs2
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
status: COMPLETE
description: A0A140LHW5 is a 74-residue Spcs2 product (Ensembl Spcs2-206) that shares only residues 1-66
  of canonical Q9CYN2 and lacks both transmembrane helices. Peptidase activity is incorrectly transferred
  from the catalytic SEC11 subunit to this derivative of the noncatalytic SPCS2 accessory subunit. Signal
  peptidase complex membership is carried by canonical Spcs2 at the gene level but depends on the transmembrane
  region through which SPCS2 is a subunit of the complex, which this product lacks. Whether the retained
  cytosolic segment contributes to signal peptide processing (an obsolete GO term) in another way is
  unknown.
