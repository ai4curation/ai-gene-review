    summary: GO:0006465 is obsolete in current GO (replaced by GO:0051604 protein maturation); the process
      is carried at the gene level by canonical Spcs2 (Q9CYN2) as GO:0016485 protein processing, so the
      prediction is not novel for the gene. SPCS2 is a noncatalytic subunit; catalysis is performed by SEC11A
      or SEC11C, so no catalytic step is lost. Its structurally resolved contribution is through its transmembrane
      domains, which with those of the other subunits form the bilayer window. A0A140LHW5 shares only canonical
      residues 1-66, within the N-terminal cytoplasmic domain (canonical 2-86), and lacks both transmembrane
      helices (87-107 and 112-132) and the C-terminal cytoplasmic domain, so it cannot contribute that membrane
      structure. The known mechanism does not, however, account for the full SPCS2 contribution to the process,
      and a binding or scaffolding role of the retained cytosolic segment toward complex or translocon components
      is neither shown nor excluded. There is no positive refutation, and whether the 74-residue product exists
      as a stable protein is also unestablished, so the prediction cannot be validated or refuted for this product.
