id: Q9CQ66
gene_symbol: Dynlt2b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Dynlt2b (Tctex1d2) encodes a 144-residue non-catalytic Tctex-type dynein light chain (Pfam Tctex-1
  domain) and is the mouse ortholog of human DYNLT2B, the only Tctex light chain specific to cytoplasmic dynein-2, the
  minus-end-directed motor of retrograde intraflagellar transport (IFT). In mouse testis the protein co-immunoprecipitates
  with the dynein-2 intermediate chains WDR34 and WDR60 and with the Tctex light chain DYNLT1, and also with the
  inner-dynein-arm intermediate chains WDR63 and WDR78. It is most abundant in testis, where it lies along the developing
  flagellum from round to elongated spermatids, in the manchette, and in the axonemal fraction of mature sperm; it
  is also detected in motile cilia of brain ventricles, trachea and oviduct. Knockout males are infertile with short,
  coiled, immotile sperm tails whose axonemes are disorganized from step-4 spermatids onward, and dynein-2 subunits
  and IFT88 are mislocalized in knockout spermatid flagella, whereas motile cilia of somatic tissues appear normal.
  Its role in retrograde IFT itself and its ciliary-base and centrosomal localization are inferred from the human
  ortholog rather than shown in mouse.
