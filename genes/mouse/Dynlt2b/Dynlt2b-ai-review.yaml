- description: Structural Tctex-type light chain of cytoplasmic dynein-2. Mouse testis co-IP shows association with
    the dynein-2 intermediate chains WDR34/WDR60 and the light chain DYNLT1; its role in retrograde intraflagellar
    transport is inferred from the human ortholog in the same PANTHER subfamily.
