- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8WW35
  - ensembl:ENSP00000324323
  review:
    summary: Correct but general for mouse. The knockout shows a cell-type-specific requirement in assembling the
      sperm flagellum (disorganized axoneme from step-4 spermatids), whereas somatic motile cilia are normal.
    action: MODIFY
    reason: In mouse the supported descendant is sperm flagellum assembly (GO:0120316, is_a motile cilium assembly,
      under cilium assembly). Knockout spermatids fail to elongate the axoneme, lack doublet microtubules and show
      disorganized 9+2, dynein arm, outer dense fiber and fibrous sheath structures, while ventricle, tracheal and
      oviduct cilia are normal. Participation test - the protein is a structural light chain of the dynein-2 IFT
      motor whose subunits fail to assemble in knockout spermatid flagella, and IFT is part of cilium assembly, so
      it contributes structure to the machinery that builds the axoneme rather than being a downstream requirement
      only. Comparator check - other mouse IFT and axonemal-dynein components such as Ift81, Bbs4 and the inner-arm
      light chain Dnali1 carry GO:0120316 by IMP. The human evidence for primary-cilium assembly is a separate, milder
      effect captured by the regulation of cilium assembly row.
    supported_by:
    - reference_id: PMID:39827215
      supporting_text: Thus, the cause of the failure of flagellar elongation in Tctex1d2−/− mice was disruption of
        the axonemal structure.
    - reference_id: PMID:39827215
      supporting_text: "In contrast to the severe defects in sperm flagella, cilia of the ventricles, trachea, and oviducts\
        \ showed no abnormal morphology in Tctex1d2−/− mice (Fig. S3A–C)."
    - reference_id: PMID:39827215
      supporting_text: From the above, TCTEX1D2 functions in the assembly and structural stability of the cytoplasmic
        dynein 2 subunits in sperm flagellum formation.
    proposed_replacement_terms:
    - id: GO:0120316
      label: sperm flagellum assembly
