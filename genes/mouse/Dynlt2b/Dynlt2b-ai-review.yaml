suggested_questions:
- question: Is mouse TCTEX1D2 a stoichiometric light chain of an inner-arm axonemal dynein (the WDR63/WDR78-containing
    species), or does the co-IP reflect transient association during dynein-2/IFT transport of axonemal cargo? Answering
    this decides whether an inner dynein arm (GO:0036156) or axonemal dynein complex annotation is warranted.
- question: Why does loss of Dynlt2b disrupt sperm flagellum assembly but not somatic motile cilia - is there a
    testis-biased paralog compensation, or does the long sperm axoneme have a stricter requirement for full dynein-2
    stability?
suggested_experiments:
- description: Live imaging of retrograde IFT (e.g. fluorescent IFT88 or DYNC2LI1) in Dynlt2b-/- mouse fibroblast
    or tracheal cultures to establish directly in mouse whether retrograde IFT frequency and velocity are reduced,
    as in human and Chlamydomonas.
- description: Cryo-ET subtomogram averaging of wild-type versus Dynlt2b-/- spermatid or tracheal axonemes to test
    whether a light-chain density is missing from specific inner dynein arms.
