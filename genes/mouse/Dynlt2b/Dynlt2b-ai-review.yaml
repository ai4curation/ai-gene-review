- id: PMID:39827215
  title: TCTEX1D2 is essential for sperm flagellum formation in mice.
  findings:
  - statement: Endogenous FLAG-tagged TCTEX1D2 co-immunoprecipitates from mouse testis with dynein-2 subunits WDR34,
      WDR60 and DYNLT1.
    supporting_text: In the testes, TCTEX1D2 interacted not only with WDR60 and DYNLT1, but also with WDR34 (Fig.
      2A).
  - statement: TCTEX1D2 co-immunoprecipitates with inner-dynein-arm intermediate chains WDR63 and WDR78.
    supporting_text: Further, co-immunoprecipitation studies revealed that TCTEX1D2 interacted with WDR63 and WDR78
      (Fig. 2D).
  - statement: TCTEX1D2 is in the axonemal fraction of mouse sperm.
    supporting_text: These results showed that TCTEX1D2 is an axoneme component in mice.
  - statement: Knockout spermatids show disrupted axonemes; somatic motile cilia are normal.
    supporting_text: Thus, the cause of the failure of flagellar elongation in Tctex1d2−/− mice was disruption of
      the axonemal structure.
  - statement: Dynein-2 subunits fail to assemble in knockout spermatid flagella.
    supporting_text: Therefore, cytoplasmic dynein 2 complexes were disrupted in Tctex1d2−/− mice elongated spermatids.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC11743150). The only mouse experimental study of Dynlt2b; CRISPR knockout plus
      3xFLAG knock-in. Not yet curated into GOA (no mouse experimental rows as of this review).
