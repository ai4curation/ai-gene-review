core_functions:
- description: >-
    Capsid-derived protein-macromolecule adaptor (by conservation with human RTL8) that links
    the retroelement capsid protein PEG10 to the proteasome shuttle factor UBQLN2; RTL8 is
    incorporated into PEG10 virus-like particles and lowers their abundance in conditioned
    medium. The mouse protein localizes to the nucleus/nucleoli and to neuronal cytoplasm.
