suggested_questions:
- question: >-
    Are mouse Rtl8a and Rtl8b (identical proteins) functionally redundant, and how does their
    loss cause obesity and altered social/apathy behaviour?
suggested_experiments:
- hypothesis: >-
    Mouse RTL8A/8B act via the conserved PEG10/UBQLN2 proteostasis axis in brain.
  description: >-
    Test PEG10 and UBQLN2 handling in Rtl8a/8b double-knockout neurons, and rescue with
    wild-type versus adaptor-dead RTL8; relate to GABRB2 expression and the obesity/behaviour
    phenotype.
