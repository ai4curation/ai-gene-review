description: >-
  Rtl8a (retrotransposon Gag-like protein 8A; Cxx1 family) is one of a cluster of three
  near-identical X-linked mouse paralogs (Rtl8a/8b/8c) domesticated from a Ty3/gypsy
  sushi-ichi-related LTR retrotransposon. Mouse Rtl8a and Rtl8b encode identical 113-residue
  proteins corresponding to a single truncated retroviral Gag capsid (CA)-like domain; they
  carry a rodent-specific N-terminal nuclear-localization-signal-like sequence and lack any
  catalytic domain. mRTL8A/8B localize to the nucleus (nucleoli) and, in prefrontal-cortex
  neurons, to both nucleus and cytoplasm, and are expressed in the prefrontal cortex and
  hypothalamus. By conservation with human RTL8 they act as capsid-derived adaptors linking
  the retroelement capsid protein PEG10 to the proteasome shuttle factor UBQLN2. Rtl8a/Rtl8b
  double-knockout mice develop late-onset obesity, reduced social response and apathy-like
  behaviour with reduced GABA-A receptor subunit (GABRB2) expression, resembling features of
  Prader-Willi syndrome, indicating an important brain function with a gene-dosage effect.
