id: Q8VCR7
gene_symbol: Abhd14b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Soluble cytosolic and nuclear alpha/beta-hydrolase (210 aa) that acts as a
  coenzyme A-dependent protein-lysine deacetylase (KDAC), transferring an acetyl
  group from N6-acetylated protein lysine residues onto CoA via its conserved
  Ser111-Asp162-His188 catalytic triad to produce acetyl-CoA (RHEA:45950).
  Abundantly expressed in the soluble proteome of metabolically active mouse
  tissues, especially liver and kidney, hepatic ABHD14B is required to maintain
  systemic glucose homeostasis and hepatic ATP levels during fasting.
