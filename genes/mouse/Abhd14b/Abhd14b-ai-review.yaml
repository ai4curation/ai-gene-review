    summary: >-
      UniProt sequence-similarity transfer from human Q96IU4 that reflects
      conserved CoA-dependent acetyl-transfer KDAC catalysis (RHEA:45950,
      EC 2.3.1.-) but carries the inverted KAT term GO:0061733 from undirected
      RHEA:45948; modified to GO:0016407 (acetyltransferase activity).
    action: MODIFY
    reason: >-
      Orthologous catalytic transfer from human Q96IU4 (89% full-length sequence
      identity, identical Ser111-Asp162-His188 triad in SPSLSGMY/VYGDQDPM/GAGHPCYL
      motifs) is biologically sound, and UniProtKB Q8VCR7 explicitly curates EC
      2.3.1.- with PhysiologicalDirection=right-to-left (RHEA:45950), but the
      asserted term GO:0061733 inverts the reaction to protein-lysine
      acetylation (KAT). Replacing GO:0061733 with GO:0016407 (acetyltransferase
      activity) corrects the reaction directionality while preserving the valid
      Q96IU4 ISS provenance pending creation of a dedicated CoA-dependent
      protein-lysine deacetylase term.
