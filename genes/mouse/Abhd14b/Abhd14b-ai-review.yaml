core_functions:
- description: >-
    CoA-dependent protein-lysine deacetylase in mouse liver and kidney cytosol
    and nucleus that transfers acetyl groups from acetylated protein lysine
    substrates onto CoA to generate acetyl-CoA (RHEA:45950), acting upstream of
    systemic fasting glucose homeostasis while direct endogenous mouse protein
    substrates in vivo remain under investigation.
  proposed_molecular_function: CoA-dependent protein-lysine deacetylase activity
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:31478652
    supporting_text: >-
      To test this, we harvested different tissues (heart, brain, liver, lungs,
      kidney and spleen) from C57Bl/6 wild type mice, and assessed their
      soluble proteomes for ABHD14B protein levels by western blot analysis.
  - reference_id: PMID:35700823
    supporting_text: >-
      Further,
      we show that depleting hepatic ABHD14B in mice also results in defective
      systemic glucose metabolism, particularly during fasting.
knowledge_gaps:
- gap_statement: >-
    The specific endogenous hepatic and renal lysine-acetylated protein
    substrates directly deacetylated by mouse ABHD14B in vivo remain
    unidentified, and UniProtKB retains a 'Putative protein-lysine deacylase'
    similarity caution pending direct in vivo enzymatic confirmation.
  boundary: >-
    Mouse ABHD14B (Q8VCR7) preserves the complete mammalian Ser111-Asp162-His188
    active site (89% identity to human Q96IU4, PMID:31478652), is expressed in
    the soluble proteome of C57BL/6 liver and kidney, and is required in vivo
    for systemic fasting glucose homeostasis and hepatic ATP maintenance
    (PMID:35700823), whereas direct in vivo mouse substrate site stoichiometry
    has not yet been mapped.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: NARROWING
  significance: >-
    Pinpointing direct hepatic acetyl-lysine substrates in mouse liver will
    connect CoA-dependent KDAC catalysis directly to the fasting glucose and ATP
    phenotypes observed upon hepatic Abhd14b knockdown.
  resolution: >-
    Perform quantitative hepatic lysine-acetylome and acetyl-CoA flux profiling
    comparing hepatocyte-specific Abhd14b-knockout and catalytic-dead S111A
    knock-in mice during fed and fasting states.
  provenance:
  - reference_id: file:mouse/Abhd14b/Abhd14b-uniprot.txt
    record_section: ["DE"]
    supporting_text: "RecName: Full=Putative protein-lysine deacylase ABHD14B {ECO:0000305};"
  - reference_id: file:mouse/Abhd14b/Abhd14b-uniprot.txt
    record_section: ["CC:CAUTION"]
    supporting_text: >-
      The protein-lysine deacetylase activity using CoA as substrate is unclear
      as this protein belongs to a family of serine hydrolases, and that the
      reaction shown in the publication is not hydrolyzing H(2)O (By similarity).
      Additional experiments are therefore required to confirm this activity in
      vivo (By similarity).
proposed_new_terms:
- proposed_name: CoA-dependent protein-lysine deacetylase activity
  proposed_definition: >-
    Catalysis of the reaction: N6-acetyl-L-lysyl-[protein] + coenzyme A =
    L-lysyl-[protein] + acetyl-CoA + H+, removing an N6-acetyl group from a
    protein lysine residue by transfer onto CoA rather than hydrolysis by water.
  justification: >-
    Captures RHEA:45950 without conflating ABHD14B with hydrolytic deacetylases
    (GO:0019213 / GO:0033558) or lysine acetyltransferases (GO:0061733). Because
    proposed_parent is single-valued in gene_review.yaml, GO:0160215 (deacylase
    activity) is recorded as primary parent, and GOC is requested to dual-parent
    this term under BOTH GO:0160215 (deacylase activity — or GO:0033558 if
    GO:0019213's hydrolytic wording is generalized) AND GO:0016407
    (acetyltransferase activity), mirroring GO's sirtuin precedent (GO:0141218 ->
    GO:0160215 + GO:0016747).
  proposed_parent:
    id: GO:0160215
    label: deacylase activity
  supported_by:
  - reference_id: file:mouse/Abhd14b/Abhd14b-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: "PhysiologicalDirection=right-to-left; Xref=Rhea:RHEA:45950;"
suggested_questions:
- question: >-
    Does germline or hepatocyte-specific conditional knockout of mouse Abhd14b
    recapitulate the acute shRNA fasting hyperglycemia and identify rate-limiting
    gluconeogenic enzyme acetylation targets in vivo?
suggested_experiments:
- hypothesis: >-
    Hepatocyte-specific Abhd14b-knockout vs S111A knock-in mice will show that
    fasting glucose dysregulation depends specifically on CoA-dependent lysine
    deacetylase catalysis rather than non-catalytic scaffolding.
  description: >-
    Compare fasting blood glucose, hepatic acetyl-CoA, and hepatic lysine
    acetylome profiles across WT, Alb-Cre;Abhd14b-flox/flox, and Abhd14b-S111A
    mice.
  experiment_type: mouse genetics and metabolomics
