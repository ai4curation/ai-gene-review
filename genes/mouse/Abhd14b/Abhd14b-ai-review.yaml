proposed_new_terms:
- proposed_name: CoA-dependent protein-lysine deacetylase activity
  proposed_definition: >-
    Catalysis of the reaction: N6-acetyl-L-lysyl-[protein] + coenzyme A =
    L-lysyl-[protein] + acetyl-CoA + H+, removing an N6-acetyl group from a
    protein lysine residue by transfer onto CoA rather than hydrolysis by water.
  justification: >-
    Captures RHEA:45950 without conflating ABHD14B with hydrolytic HDACs
    (GO:0033558) or lysine acetyltransferases (GO:0061733).
  proposed_parent:
    id: GO:0016407
    label: acetyltransferase activity
  supported_by:
  - reference_id: file:mouse/Abhd14b/Abhd14b-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: "PhysiologicalDirection=right-to-left; Xref=Rhea:RHEA:45950;"
suggested_questions:
- question: >-
    Does germline or hepatocyte-specific conditional knockout of mouse Abhd14b
    recapitulate the acute shRNA fasting hyperglycemia and identify rate-limiting
    gluconeogenic enzyme acetylation targets in vivo?
suggested_experiments:
- hypothesis: >-
    Hepatocyte-specific Abhd14b-knockout vs S111A knock-in mice will show that
    fasting glucose dysregulation depends specifically on CoA-dependent lysine
    deacetylase catalysis rather than non-catalytic scaffolding.
  description: >-
    Compare fasting blood glucose, hepatic acetyl-CoA, and hepatic lysine
    acetylome profiles across WT, Alb-Cre;Abhd14b-flox/flox, and Abhd14b-S111A
    mice.
  experiment_type: mouse genetics and metabolomics
