gene_symbol: Abhd14b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Soluble cytosolic and nuclear alpha/beta-hydrolase (210 aa) characterized via
  its conserved mammalian active site and hepatic perturbation studies as an
  atypical coenzyme A-dependent protein-lysine deacetylase (KDAC) that transfers
  an acetyl group from N6-acetylated protein lysine substrates onto CoA via its
  Ser111-Asp162-His188 catalytic triad to produce acetyl-CoA (RHEA:45950),
  while its direct physiological endogenous protein substrates in vivo remain
  incompletely defined. Abundantly expressed in the soluble proteome of
  metabolically active mouse tissues, especially liver and kidney, hepatic
  ABHD14B is required to maintain systemic glucose homeostasis and hepatic ATP
  levels during fasting.
