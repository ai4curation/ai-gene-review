- term:
    id: GO:0010906
    label: regulation of glucose metabolic process
  evidence_type: IMP
  original_reference_id: PMID:35700823
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Direct in vivo shRNA knockdown of hepatic Abhd14b in mice causes defective
      systemic glucose metabolism during fasting (persistent fasting
      hyperglycemia, impaired glucose/pyruvate tolerance, ~15% fasting body
      weight loss, and severe fasting hepatic ATP depletion).
    action: NEW
    reason: >-
      PMID:35700823 directly perturbed endogenous mouse hepatic Abhd14b in vivo,
      establishing a physiological regulatory role in systemic and hepatic
      glucose metabolism that is currently absent from mouse GOA.
    supported_by:
    - reference_id: PMID:35700823
      supporting_text: >-
        Further,
        we show that depleting hepatic ABHD14B in mice also results in defective
        systemic glucose metabolism, particularly during fasting.
    - reference_id: PMID:35700823
      supporting_text: >-
        Further, from studies in mice, we find that disruption of hepatic ABHD14B
        especially during fasting, disturbs homeostatic systemic glucose
        metabolism, and in doing so, significantly alters the organismal
        energetic status.
