  review:
    summary: MGI IDA annotation from PMID:12672821 (abstract-only in local cache) showing that mouse Abi1
      strongly promotes c-Abl-mediated Tyr-296 phosphorylation of Mena.
    action: ACCEPT
    reason: >-
      PMID:12672821 is abstract-only locally (full_text_available: false), reporting that Abi-1 binds
      Mena and c-Abl to promote c-Abl-mediated Mena Tyr-296 phosphorylation; together with the requirement
      for Abi-1's C-terminal SH3 domain in Abl binding (PMID:7590237), the conserved central linker
      determinant between the proline-rich regions and SH3 domain mapped in human ABI1/AblBP4 (amino acids
      270–336 in the 451-aa construct; PMID:26428302), and cellular c-Abl-mediated Mena and WAVE2
      phosphorylation (PMID:17101133, PMID:26428302), this matches PTHR10460 (abl_pndy_py213_s216
      contributing to GO:0061098 with SUBFAMILY_ONLY scope across ABI1, ABI2, and metazoan SF0 versus
      loss in Abi3; PMID:17101133), whereas coexpressed full-length wild-type human ABI1 (unlike Y213F)
      can also mediate Y213-dependent trans-inhibition of nonmyristoylated c-Abl pY412 phosphorylation
      and pervanadate-induced kinase activity in human LNCaP cells (PMID:18328268). Although Mena-versus-c-Cbl
      substrate selectivity in PMID:12672821 is also compatible with GO:0035591 adaptor-mediated substrate
      presentation (adopted for GO:0061098 KEEP_AS_NON_CORE in mouse Abi2), ACCEPT is retained by deference
      to MGI's full-text IDA curation of PMID:12672821 and human GO:0061098 IDA curation on abstract-only
      PMID:17101133, noting mouse Abi2 for future harmonization.
    supported_by:
    - reference_id: PMID:7590237
      supporting_text: The protein exhibits sequence similarity to homeotic genes, contains several polyproline
        stretches, and includes a src homology 3 (SH3) domain at its very carboxyl terminus that is required
        for binding to Abl proteins.
    - reference_id: PMID:12672821
      supporting_text: Importantly, Abi-1 dramatically promoted c-Abl-mediated tyrosine phosphorylation
        of Mena but not other substrates such as c-Cbl.
    - reference_id: PMID:17101133
      supporting_text: Although Abi-2, like Abi-1, promoted the c-Abl-mediated phosphorylation of Mena
        and WAVE2, NESH (Abi-3) had no such effect.
    - reference_id: PMID:26428302
      supporting_text: Structural studies showed that a linker region between the proline-rich regions
        and the Src homology 3 (SH3) domain of Abi-1 is crucial for its interaction with c-Abl and c-Abl-mediated
        phosphorylation of WAVE2.
