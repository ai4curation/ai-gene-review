  review:
    summary: IMP annotation from an ENU forward-genetics screen for mouse early embryonic morphogenesis
      mutants (PMID:15755804).
    action: KEEP_AS_NON_CORE
    reason: Abi1 loss disrupts WAVE complex integrity and embryonic morphogenesis by mid-gestation (PMID:15755804,
      PMID:21482783); somitogenesis defects reflect a downstream developmental phenotype of core WRC loss
      rather than a dedicated segmentation activity.
    supported_by:
    - reference_id: PMID:15755804
      supporting_text: Taking a forward genetic approach, we have induced recessive mutations by treatment
        of mice with ethylnitrosourea and have identified 43 mutations that affect early morphogenesis
        and patterning, including 38 genes that have not been studied previously.
    - reference_id: PMID:21482783
      supporting_text: The essential function of Abi1 in WAVE complexes and their regulation might explain
        the observed embryonic lethality of Abi1-deficient embryos, which survived until approximately
        embryonic day 11.5 and displayed malformations in the developing heart and brain.
