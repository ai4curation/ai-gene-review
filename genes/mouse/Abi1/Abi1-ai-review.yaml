      phosphorylation of WAVE2.
suggested_questions:
- question: To what extent can mouse Abi2 compensate for Abi1 across distinct embryonic lineages prior
    to E11.5 lethality?
- question: How does CaMKIIalpha phosphorylation of mouse Abi1 gate switching between postsynaptic CaMKIIalpha
    inhibition and WRC-driven spine head expansion?
suggested_experiments:
- description: Lineage-specific conditional Abi1;Abi2 compound knockouts in mouse endothelium, neural
    crest, and megakaryocytes paired with quantitative WRC proteomics.
- description: Endogenous phosphosite knock-in mutagenesis of mouse Abi1 Ser88 and Tyr213 in primary hippocampal
    neurons and embryonic fibroblasts.
