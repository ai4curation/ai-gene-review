id: Q8CBW3
gene_symbol: Abi1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mouse Abl interactor 1 (Abi1) is an essential signaling adaptor and core subunit of the heteropentameric
  WAVE regulatory complex (WRC; WAVE1/2/3, Abi1/2/3, Nap1, Sra-1/PIR121, and Brk1) required for Arp2/3-dependent
  branched actin nucleation at the cell leading edge, lamellipodia, and filopodia tips. Genetic loss of
  Abi1 in mice destabilizes WAVE1, WAVE2, Nap1, and Sra-1/PIR121, impairs lamellipodial protrusion and
  cell migration, and causes mid-gestation embryonic lethality around E11.5 with cardiovascular and neural
  malformations. Through its proline-rich motifs, tSNARE/WAB coiled-coil region, and C-terminal SH3 domain,
  Abi1 also scaffolds the Eps8-Abi1-Sos1/2 Rac-GEF complex, relieves Eps8 autoinhibition, promotes c-Abl-mediated
  phosphorylation of Mena and WAVE2, interacts with mDia2 at filopodia, and modulates CaMKIIalpha and
  postsynaptic actin remodeling in dendritic spines.
