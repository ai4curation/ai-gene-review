core_functions:
- description: Catalytically inactive transmembrane pseudokinase that acts at the plasma membrane and epithelial
    cell-cell contacts as a planar cell polarity regulator; through its cytoplasmic domain it engages Src and promotes
    junctional Src-ROCK2 signalling and myosin II contractility, which orients planar polarity and drives the polarized
    cell behaviours of convergent extension and neural tube closure (mouse genetic and cell biological evidence).
    No GO molecular function is assigned because the mouse data establish a binding/scaffolding role but not a defined
    activity term (see suggested questions).
  directly_involved_in:
  - id: GO:0001736
    label: establishment of planar polarity
  - id: GO:0060026
    label: convergent extension
  - id: GO:0110020
    label: regulation of actomyosin structure organization
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005911
    label: cell-cell junction
