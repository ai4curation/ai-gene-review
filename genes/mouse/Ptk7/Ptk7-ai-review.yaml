proposed_new_terms: []
suggested_questions:
- question: Is the Wnt co-receptor / Wnt-protein binding activity shown for Xenopus PTK7 and Drosophila Otk conserved
    in mouse Ptk7, given that in the mouse auditory epithelium Ptk7 acts in parallel to Frizzled3/6 and is not required
    for Dishevelled2 membrane recruitment? Should a molecular function such as coreceptor activity or Wnt-protein
    binding be propagated across the PTK7 subfamily?
- question: In which cellular contexts does Ptk7 promote versus inhibit canonical Wnt/beta-catenin signalling, and
    is the direction-neutral 'regulation of canonical Wnt signaling pathway' the right level for mammalian annotation?
- question: Does the Ptk7 cytoplasmic pseudokinase domain act as a molecular adaptor that scaffolds Src and ROCK2
    at junctions, and is there a GO molecular function term suitable for this junctional kinase-scaffolding role?
suggested_experiments:
- description: Knock in a cytoplasmic-domain-deleted or Src-binding-deficient Ptk7 allele in mouse and test cochlear
    hair-cell orientation, junctional pY416-Src/ROCK2 localization and neural tube closure, to establish whether
    the Src scaffolding interaction is required in vivo.
- description: Measure binding of purified mouse Ptk7 ectodomain to Wnt3a, Wnt5a and Wnt-PCP ligands and to Frizzled/ROR2
    by surface plasmon resonance, and test canonical Wnt reporter output in Ptk7-null epithelial cells versus fibroblasts
    to resolve the context dependence of Wnt regulation.
