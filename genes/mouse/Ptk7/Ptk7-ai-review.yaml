    summary: Positive regulation of canonical Wnt signalling, transferred from human PTK7 (Puppo et al. 2011).
    action: MODIFY
    reason: Puppo et al. used Ptk7-/- mouse embryonic fibroblasts and found weaker Wnt3a/TCF activity, but Xenopus,
      Drosophila and reporter-cell studies of the same orthologous lineage find that PTK7 binds canonical Wnts and
      inhibits canonical signalling, and canonical Wnts drive PTK7 endocytosis. The direction is context dependent.
