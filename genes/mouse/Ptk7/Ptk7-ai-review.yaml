id: Q8BKG3
gene_symbol: Ptk7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Ptk7 (protein tyrosine kinase 7, also called CCK4; chuzhoi) is a single-pass type I transmembrane
  receptor-like protein with seven extracellular immunoglobulin-like domains and an intracellular kinase-homology
  domain that is catalytically inactive (DFG motif replaced by ALG; no auto- or trans-phosphorylation activity and
  no ATP binding). It localizes to the plasma membrane and concentrates at epithelial cell-cell contacts, where
  its cytoplasmic pseudokinase domain binds Src and promotes junctional Src and ROCK2 signalling to organize junctional
  actomyosin contractility. Ptk7 is a vertebrate regulator of planar cell polarity: in mouse it is required for
  polarized mesodermal cell behaviour and convergent extension during gastrulation, neural tube closure (null and
  chuzhoi mutants develop craniorachischisis and interact genetically with Vangl2 and Celsr1), orientation of cochlear
  hair-cell stereociliary bundles (acting in supporting cells through myosin II, in parallel to Frizzled3/6), and
  CE-like elongation of the Wolffian duct. Mutants also show heart, lung and kidney malformations, wound-repair
  defects and reduced haematopoietic stem cell pools. Work in other vertebrates and Drosophila shows that PTK7-family
  proteins act as Wnt co-receptors that bind Wnt ligands and Frizzled7, associate with ROR2, recruit Dishevelled
  via RACK1, and modulate canonical Wnt/beta-catenin signalling in a context-dependent direction; PTK7 is also shed
  by MT1-MMP.'
