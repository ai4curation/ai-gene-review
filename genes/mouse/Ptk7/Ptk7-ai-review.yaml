  review:
    summary: Ptk7 mutant mice (gene-trap null and the chuzhoi splice allele) show misoriented stereociliary bundles
      of cochlear hair cells, the classic readout of epithelial planar cell polarity.
    action: ACCEPT
    reason: Establishment of planar polarity is the best-established mouse function of Ptk7, shown with independent
      alleles and by mosaic analysis (required in supporting cells), with a mechanism via junctional myosin II/Src-ROCK2
      signalling. acts_upstream_of_or_within is the appropriate qualifier and the term is as precise as the data
      allow.
    supported_by:
    - &id011
      reference_id: PMID:20704721
      supporting_text: we demonstrate disruption in the orientation of outer hair cells in the inner ear, and defects
        in heart and lung development in chuzhoi mutants
    - &id001
      reference_id: PMID:15229603
      supporting_text: disrupts neural tube closure and stereociliary bundle orientation, and shows genetic interactions
        with a mutation in the mouse Van Gogh homologue vangl2
    - &id017
