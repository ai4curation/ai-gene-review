id: Q8CIH5
gene_symbol: Plcg2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mouse Plcg2 encodes PLCγ2, a calcium-dependent phosphoinositide phospholipase that produces
  IP3 and DAG from PIP2. SH2-mediated recruitment and kinase-dependent activation connect immune receptors
  to calcium mobilization and downstream transcriptional responses. PLCγ2 supports B-cell maturation,
  survival and activation, and has distinct myeloid functions in C-type lectin signaling, antifungal responses,
  and CD14-dependent TLR4 trafficking. It also contributes to platelet, osteoclast and microglial signaling.
  These tissue functions depend on receptor and adaptor context and do not imply that PLCγ2 is the sole
  phospholipase in every pathway.
