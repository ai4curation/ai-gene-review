core_functions:
- molecular_function:
    id: GO:0004435
    label: phosphatidylinositol-4,5-bisphosphate phospholipase C activity
  description: Calcium-dependent PIP2 hydrolysis produces IP3 and DAG downstream of BCR and C-type lectin
    receptors. IP3 subsequently activates ER calcium release; PLCγ2 is the lipase, not the calcium channel.
  directly_involved_in:
  - id: GO:0050853
    label: B cell receptor signaling pathway
  - id: GO:0002223
    label: stimulatory C-type lectin receptor signaling pathway
  - id: GO:0019722
    label: calcium-mediated signaling
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:11043765
    supporting_text: The activated PLC-gamma2 converts phosphatidylinositol 4,5-bisphosphate into the
      second messenger inositol 1,4,5-trisphosphate (IP3), which in turn binds to IP3 receptors located
      on the endoplasmic reticulum (ER).
  - reference_id: PMID:10925250
    supporting_text: Mice with a neonatally induced loss of PLC-gamma 2 function displayed reduced numbers
      of mature conventional B cells and peritoneal B1 cells and defective responses in vitro to BCR stimulation
      and in vivo to immunization with thymus-independent type II Ags.
  - reference_id: PMID:19136564
    supporting_text: PLCgamma2-deficient DCs have drastic impairment of Ca2+ signaling and are defective
      in their secretion of interleukin 2 (IL-2), IL-6, IL-10, IL-12, IL-23, and tumor necrosis factor
      alpha.
- molecular_function:
    id: GO:0001784
    label: phosphotyrosine residue binding
  description: Conserved SH2-domain phosphotyrosine recognition recruits PLCγ2 to activated receptor/adaptor
    complexes; direct human-domain measurements support the orthologous mouse activity.
  supported_by:
  - reference_id: PMID:24642916
    supporting_text: Recombinant PLCγ2 SH2 domains also bound immobilized EAT-2 Y127 and LAT Y132 peptides
      with comparable affinity
suggested_questions:
