- term:
    id: GO:0004435
    label: phosphatidylinositol-4,5-bisphosphate phospholipase C activity
  evidence_type: EXP
  original_reference_id: PMID:8615781
  qualifier: enables
  review:
    summary: PLCG2 is a phosphoinositide-specific phospholipase C that hydrolyzes PIP2 to IP3 and DAG
      after receptor-induced activation.
    action: ACCEPT
    reason: For mouse PLCγ2, retain as core because PLCG2/PLC-gamma2 directly catalyzes phosphatidylinositol-4,5-bisphosphate
      hydrolysis, with experimental support for recombinant and cellular activity and activation by Tyr753/Tyr759
      phosphorylation (PMID:11043765, PMID:11606584, PMID:12181444, PMID:23000145). Human P16885 studies
      are used as ortholog evidence where relevant, not relabeled as native mouse experiments.
