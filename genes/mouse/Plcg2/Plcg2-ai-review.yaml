  title: 'Cutting edge: essential role of phospholipase C-gamma 2 in B cell development and function.'
  findings:
  - statement: Native conditional mouse deletion establishes B-cell signaling/development defects; normal
      TCR proliferation in this experiment is not universal exclusion of T-cell roles.
    supporting_text: Mice with a neonatally induced loss of PLC-gamma 2 function displayed reduced numbers
      of mature conventional B cells and peritoneal B1 cells and defective responses in vitro to BCR stimulation
      and in vivo to immunization with thymus-independent type II Ags.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native conditional mouse deletion establishes B-cell signaling/development defects;
      normal TCR proliferation in this experiment is not universal exclusion of T-cell roles.
