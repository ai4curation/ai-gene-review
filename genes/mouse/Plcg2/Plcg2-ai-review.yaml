    label: cell activation
  evidence_type: IMP
  original_reference_id: PMID:19136564
  qualifier: involved_in
  review:
    summary: Dectin-1 stimulation activates PLCγ2-dependent calcium and cytokine responses in dendritic
      cells.
    action: MODIFY
    reason: Full PMID:19136564 uses mouse dendritic cells and Dectin-1-selective curdlan as well as zymosan,
      measures calcium, cytokine secretion, ERK/JNK, NFAT and NF-κB, and also tests TLR2 agonism. Retain
      the particular measured cell activation contribution without assigning the phospholipase a direct
      transcriptional, ion-channel or oxidase catalytic activity.
    supported_by:
    - reference_id: PMID:19136564
      supporting_text: PLCgamma2-deficient DCs have drastic impairment of Ca2+ signaling and are defective
        in their secretion of interleukin 2 (IL-2), IL-6, IL-10, IL-12, IL-23, and tumor necrosis factor
        alpha.
    proposed_replacement_terms:
