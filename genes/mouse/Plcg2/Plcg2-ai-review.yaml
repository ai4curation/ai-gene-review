  review:
    summary: PLCG2 converts receptor input into phosphoinositide and calcium signals.
    action: MODIFY
    reason: 'For mouse PLCγ2, refine general signal transduction to phosphatidylinositol-mediated signaling
      and calcium-mediated signaling. GO_REF:0000002 is interpreted in its own context: immune/BCR studies
      include human PLCγ2 expressed in chicken DT40 cells, whereas platelet and microglial studies test
      distinct receptor systems. Calcium release is mediated by IP3 receptors downstream of PLCG2 catalysis,
      not by PLCG2 acting as an ion channel. Human P16885 studies are used as ortholog evidence where
      relevant, not relabeled as native mouse experiments.'
