  - ensembl:ENSP00000482457
  review:
    summary: IP3 production by PLCγ2 couples receptor activation to cytosolic calcium elevation.
    action: ACCEPT
    reason: PLCγ2 performs the upstream chemical step in the multistep calcium response; IP3 receptors
      execute ER calcium release and store-operated channels provide later influx. The term does not require
      PLCγ2 itself to be a channel. Native mouse B-cell and dendritic-cell data support this conserved
      mechanism.
