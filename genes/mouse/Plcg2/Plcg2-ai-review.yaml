    reason: For mouse PLCγ2, pIP2 is a glycerophospholipid, and its hydrolysis to DAG and IP3 supports
      the more specific catabolic process. Refine the broad lipid/phospholipid category without substituting
      a signaling outcome for the catabolic chemistry. Human P16885 studies are used as ortholog evidence
