    the CSF1R Reactome reaction, or are PLCγ2 activation and phosphatidylcholine turnover mediated by
    distinct enzymes?
- question: Which isoform-specific experiments establish PLCγ2 participation in pre-TCR signaling beyond
    pan-PLCγ inhibitor effects?
