      label: glycerophospholipid catabolic process
- term:
    id: GO:0006661
    label: phosphatidylinositol biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
