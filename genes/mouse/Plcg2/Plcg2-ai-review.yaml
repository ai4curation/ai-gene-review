- term:
    id: GO:0007204
    label: positive regulation of cytosolic calcium ion concentration
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: involved_in
  supporting_entities:
  - RGD:3348
  review:
    summary: IP3 production by PLCγ2 couples receptor activation to cytosolic calcium elevation.
    action: ACCEPT
    reason: PLCγ2 performs the upstream chemical step in the multistep calcium response; IP3 receptors
      execute ER calcium release and store-operated channels provide later influx. The term does not require
      PLCγ2 itself to be a channel. Native mouse B-cell and dendritic-cell data support this conserved
      mechanism.
    supported_by:
    - reference_id: PMID:11043765
      supporting_text: The activated PLC-gamma2 converts phosphatidylinositol 4,5-bisphosphate into the
        second messenger inositol 1,4,5-trisphosphate (IP3), which in turn binds to IP3 receptors located
        on the endoplasmic reticulum (ER).
    - reference_id: PMID:19136564
      supporting_text: PLCgamma2-deficient DCs have drastic impairment of Ca2+ signaling and are defective
        in their secretion of interleukin 2 (IL-2), IL-6, IL-10, IL-12, IL-23, and tumor necrosis factor
        alpha.
