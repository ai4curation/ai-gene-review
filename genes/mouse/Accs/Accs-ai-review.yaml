id: A2AIG8
gene_symbol: Accs
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  1-aminocyclopropane-1-carboxylate synthase-like protein 1 (Accs) is a
  502-residue murine fold-type I pyridoxal 5'-phosphate (PLP)-dependent
  carbon-sulfur beta-lyase encoded on mouse chromosome 2 adjacent to its
  mammalian-specific paralog Accsl. Assigned to the vertebrate clade
  PTHR43795:SF17 as the 1:1 ortholog of human ACCS, mouse Accs lacks plant
  1-aminocyclopropane-1-carboxylate synthase activity toward
  S-adenosyl-L-methionine due to steric hindrance from partner-subunit Tyr133
  and divergence of plant ACS catalytic residues, while strictly conserving the
  PLP Schiff-base Lys324, pyridinium-stabilizing Asp287, substrate
  alpha-carboxylate-anchoring Arg458, and inter-subunit homodimer pocket
  residues Trp136, Tyr133, and Arg352 that mediate alpha,beta-elimination of
  cysteine S-conjugate sulfoxides and thioethers into pyruvate, ammonia, and
  sulfenic acid or thiol products in human ACCS. Its physiological substrates,
  metabolic pathway, and subcellular localization in mouse tissues remain
  experimentally uncharacterized.
alternative_products:
- name: '1'
  id: A2AIG8-1
  description: >-
    Canonical full-length 502-residue polypeptide containing the intact
    fold-type I PLP-binding catalytic domain and conserved active-site residues
    Tyr133, Trp136, Asp287, Lys324, Arg352, and Arg458.
- name: '2'
  id: A2AIG8-2
  sequence_note: VSP_052669
  description: >-
    479-residue splice variant lacking the disordered N-terminal segment
    (residues 1-23) while preserving the entire fold-type I PLP-dependent
    catalytic core.
