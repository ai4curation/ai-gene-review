- id: PMID:11470512
  title: >-
    The human cDNA for a homologue of the plant enzyme
    1-aminocyclopropane-1-carboxylate synthase encodes a protein lacking that
    activity.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Establishes PLP binding, lack of ACC synthase activity, and weak
      L-vinylglycine deamination in human ortholog ACCS, from which UniProt
      projected A2AIG8 CC:FUNCTION.
  findings:
  - statement: >-
      Recombinant human ACCS binds PLP, lacks ACC synthase activity, and
      deaminates L-vinylglycine as a side reaction.
    supporting_text: >-
      Purified recombinant PHACS, expressed in Pichia pastoris, contains bound
      pyridoxal-5'-phosphate (PLP), but does not catalyze the synthesis of ACC.
- id: PMID:39876065
  title: Cysteine S-conjugate sulfoxide β-lyase activity for human ACCS.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Demonstrates cysteine S-conjugate sulfoxide beta-lyase activity in human
      ACCS and explicitly shows conservation of key inter-subunit pocket
      residues W135 and R351 across mammalian ACCS orthologs (including mouse
      Accs).
  findings:
  - statement: >-
      Human ACCS catalyzes cysteine S-conjugate sulfoxide beta-lyase cleavage,
      and key substrate-recognizing pocket residues corresponding to human W135
      and R351 are conserved across mammalian ACCS orthologs.
    supporting_text: >-
      Notably, both W135 and R351 are highly conserved in mammalian ACCS
      orthologues (Figure 7).
