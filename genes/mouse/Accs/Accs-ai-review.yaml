knowledge_gaps:
- gap_statement: >-
    The endogenous physiological or xenobiotic cysteine S-conjugate sulfoxide
    substrates and in vivo metabolic role of mouse Accs have not been
    determined experimentally.
  boundary: >-
    Active-site conservation with human cysteine S-conjugate sulfoxide
    beta-lyase ACCS is established (PMID:39876065), whereas murine enzymatic
    characterization and knockout metabolomics are absent.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Mouse Accs provides a tractable genetic system to test whether mammalian
    ACCS functions in hepatic and renal glutathione-derived mercapturic-acid
    xenobiotic detoxication in vivo.
  resolution: >-
    Generate Accs-knockout mice and profile hepatic, renal, and urinary
    cysteine S-conjugates and sulfoxides by LC-MS/MS.
  provenance:
  - reference_id: PMID:39876065
    supporting_text: >-
      Although understanding the biological function of hACCS still awaits in
      vivo study, our discovery of hACCS’s cysteine-conjugate sulfoxide Cβ-S
      lyase activity in vitro suggests hACCS is the potential missing link in
      the glutathione-based xenobiotic metabolic pathways.
- gap_statement: >-
    The subcellular localization of endogenous mouse Accs has not been
    determined in any murine cell type or tissue.
  boundary: >-
    Mouse Accs lacks predicted targeting peptides or transmembrane segments and
    carries an MGI ND cellular_component annotation, with no microscopy or
    organelle fractionation studies in mouse or human.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
