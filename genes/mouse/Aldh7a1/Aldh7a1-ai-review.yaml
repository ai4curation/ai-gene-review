  review:
    summary: Membrane transport process transferred by ISO from human.
    action: REMOVE
    reason: ALDH7A1 does not carry out membrane trafficking. In human cells it inhibits COPI fission and
      several transport pathways during energy stress, because the NADH it makes acts on BARS (PMID:31492851).
      An 'involved in transport' annotation therefore misstates the human finding (at most, the role is
      negative regulation). For mouse there is also no experiment, the AMPK regulatory site is not conserved
      (R130), and PAINT did not propagate any transport term to PTN000192435.
    supported_by:
    - *id013
    - *id011
