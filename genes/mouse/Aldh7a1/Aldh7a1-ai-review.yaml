  - *id024
  - *id005
suggested_questions:
- question: Is mouse Aldh7a1 (Arg at the position of human AMPK site Ser130) recruited to Golgi/plasma
    membranes under energy or ferroptotic stress, and does it then restrain COPI transport or support
    FSP1 as human ALDH7A1 does?
- question: Is the PANTHER 19.0 placement of human P49419 in PTHR43521:SF5, apart from all other vertebrate
    orthologs in SF1, a classification artifact, and should it be reconciled?
- question: Should GO:0016655 be removed from the ALDH7A1 nodes of GO-CAM 680ad14200003459, given that
    FSP1, not ALDH7A1, reduces the quinone?
suggested_experiments:
- description: Fractionate membranes from wild-type and Aldh7a1-KO mouse cells (e.g. MEFs or hepatocytes)
    under AICAR, hypoxia or RSL3 treatment and measure membrane NADH, COPI transport and ferroptosis sensitivity.
    Rescue with mouse Aldh7a1 versus an R130S variant to test whether gaining the human AMPK site confers
    stress-induced recruitment.
- description: Run steady-state kinetics of purified mouse Aldh7a1 (mitochondrial-mature and cytosolic
    forms) on AASA/P6C, betaine aldehyde, 4-HNE and hexanal to establish the mouse substrate range directly.
