id: Q9DBF1
gene_symbol: Aldh7a1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Aldh7a1 (antiquitin, alpha-aminoadipic semialdehyde dehydrogenase) is an NAD+-dependent member
  of the aldehyde dehydrogenase superfamily. It oxidizes L-2-aminoadipate 6-semialdehyde (alpha-AASA),
  which is in equilibrium with delta1-piperideine-6-carboxylate (P6C), to L-2-aminoadipate. This is the
  step at which the saccharopine and pipecolate routes of L-lysine degradation converge. Mice lacking
  Aldh7a1 accumulate P6C, alpha-AASA and pipecolate in brain and liver and develop pyridoxine-responsive
  seizures on a high-lysine diet, which models human pyridoxine-dependent epilepsy. Alternative transcripts
  encode a mitochondrial isoform with an N-terminal presequence and a non-mitochondrial isoform, and in
  mouse tissues the protein is found in mitochondria, cytosol and nuclei. By orthology to the human enzyme
  (a homotetramer), it is expected to also oxidize betaine aldehyde and lipid-peroxidation-derived and
  medium-chain aldehydes. In human cells, a stress-recruited membrane pool generates NADH that restrains
  vesicle transport and supports FSP1-mediated ferroptosis resistance. The AMPK phosphorylation site that
  controls this recruitment in human is not conserved in mouse, and the membrane role has not been tested
  in mouse.
