core_functions:
- description: NAD+-dependent oxidation of alpha-AASA/P6C to alpha-aminoadipate in L-lysine catabolism.
    Experimentally established in mouse by Aldh7a1-KO metabolite accumulation in brain and liver. Purified-enzyme
    kinetics are from the human ortholog in the same PAINT clade (PTN000192435), for which mouse is a
    seed.
  molecular_function:
    id: GO:0004043
    label: L-aminoadipate-semialdehyde dehydrogenase [NAD(P)+] activity
  directly_involved_in:
  - id: GO:0019477
    label: L-lysine catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id017
  - *id021
  - *id030
  - *id005
  - *id022
- description: Broad NAD+-dependent oxidation of other aldehydes (lipid-peroxidation-derived, medium-chain
    and betaine aldehyde). Inferred for mouse from purified human enzyme data, the conserved active site
    and the PAINT placement. Not tested in mouse.
  molecular_function:
    id: GO:0004029
    label: aldehyde dehydrogenase (NAD+) activity
  locations:
