      supporting_text: However, it should be noted that the confocal fluorescence microscopy data in this
        study are qualitative, and further study using quantitative methods will be required to examine
        the precise pathogen removal activities as well as the interaction between RTL5 and RTL6.
    - reference_id: file:mouse/Rtl5/Rtl5-uniprot.txt
      supporting_text: They do not correspond to functional retrotransposons, but rather to neofunctionalized
        retrotransposons genes.
