core_functions:
- description: Microglia-derived extracellular innate immune factor that accumulates on double-stranded
    RNA (and unmethylated CpG DNA) in the brain and is required for prompt clearance of dsRNA; the underlying
    biochemical activity (direct nucleic-acid binding or assembly into PAMP-sequestering granules) is
    not yet defined.
  directly_involved_in:
  - id: GO:0071359
    label: cellular response to dsRNA
  - id: GO:0045087
    label: innate immune response
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:36162816
    supporting_text: Experiments using Rtl6 or Rtl5 knockout mice provided additional evidence that RTL6
      and RTL5 act as factors against LPS and dsRNA, respectively, in the brain
  - reference_id: PMID:36162816
    supporting_text: indicating that, without RTL5, dsRNA removal was significantly delayed in the brain
  - reference_id: PMID:36162816
    supporting_text: Venus and mCherry knock-in mice exhibited expression of RTL5-mCherry and RTL6-Venus
      fusion proteins in microglia and appeared as extracellular dots and granules in the central nervous
      system
suggested_questions:
- question: Does RTL5 bind dsRNA directly (and with what affinity and length/sequence preference), or
    does it accumulate on dsRNA only as part of larger RTL5/RTL6 assemblies?
- question: How is RTL5, which lacks a signal peptide, released from microglia into the extracellular
    space?
- question: Is the pituitary ACTH phenotype of Rgag4/Rtl5 knockdown reproduced in Rtl5 knockout mice,
    and is it related to the microglial function?
- question: Does RTL5 retain any capsid-like self-assembly, given its single ordered Gag capsid-like domain
    flanked by long acidic disordered regions?
suggested_experiments:
- description: Recombinant RTL5 (full length and capsid-like domain) binding assays with dsRNA, poly(I:C),
    ssRNA and CpG DNA by EMSA or fluorescence anisotropy, plus negative-stain EM for higher-order assemblies.
- description: Quantitative clearance kinetics of labeled poly(I:C) and live RNA-virus challenge in Rtl5
    KO versus wild-type brain, with readouts of interferon response and viral load.
- description: Pituitary hormone (ACTH, POMC) measurements and stress-axis testing in Rtl5 knockout mice.
