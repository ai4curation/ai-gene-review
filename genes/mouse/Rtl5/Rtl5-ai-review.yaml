  review:
    summary: ND root molecular function annotation. No biochemical activity of RTL5 has been defined.
    action: ACCEPT
    reason: 'Literature search confirms that the molecular activity of RTL5 is still unknown: the knockout
      and knock-in work defines a role in dsRNA removal in the brain but explicitly does not resolve whether
      RTL5 binds dsRNA directly or how removal is achieved. The ND root term remains the correct statement
      for MF.'
    supported_by:
