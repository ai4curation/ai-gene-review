id: Q5DTT4
gene_symbol: Rtl5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: RTL5 (retrotransposon Gag-like 5; also SIRH8, RGAG4, Mart5) is a eutherian-specific, X-linked
  gene domesticated from the gag (capsid) region of a Ty3/gypsy (sushi-ichi-related) LTR retrotransposon.
  It encodes a large, strongly acidic protein with a single central retroviral capsid-like domain flanked
  by long disordered acidic segments, and it has lost the retroelement nucleocapsid zinc knuckle, protease
  and retrotransposition machinery. In the mouse brain RTL5 is produced by microglia and appears as extracellular
  dots and granules; it rapidly accumulates on injected double-stranded RNA analog (and on unmethylated
  CpG DNA) and Rtl5 knockout mice show delayed removal of dsRNA, whereas LPS clearance, which depends
  on its basic paralog RTL6, is unaffected. RTL5 therefore acts as an extracellular, microglia-derived
  innate immune factor that helps clear virus-like nucleic acid PAMPs from the brain. It is also expressed
  in anterior pituitary corticotrophs, where it is a transcriptional target of Ikaros and its knockdown
  in a corticotroph cell model reduces hormone gene expression and ACTH secretion. The biochemical activity
  underlying these roles (direct nucleic acid binding, self-assembly) has not been defined.
