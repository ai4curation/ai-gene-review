- id: PMID:15465500
  title: Drapc1 expression during mouse embryonic development.
  full_text_unavailable: true
  findings:
  - statement: Mouse Apcdd1 (Drapc1) is expressed at sites of active Wnt/beta-catenin signaling in developing nervous and vascular systems, organ mesenchyme, and adult hair follicles.
    supporting_text: Analysis of its spatiotemporal expression in mouse embryos from E7.5 to E14 showed that Drapc1 is expressed during development of the extraembryonic structures, nervous system, vascular system and inner ear.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Adult mouse skin expresses Apcdd1 in hair follicles.
    supporting_text: Drapc1 expression was also found in the hair follicles of the adult mouse skin.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only developmental expression survey establishing mouse Apcdd1 expression across vascular, neural, mesenchymal, and hair-follicle tissues.
- id: PMID:20393562
  title: APCDD1 is a novel Wnt inhibitor mutated in hereditary hypotrichosis simplex.
  findings:
  - statement: Full-length mouse Apcdd1 and its secreted extracellular domain (mApcdd1DeltaTM, aa 1-486) inhibit canonical Wnt signaling and progenitor proliferation when electroporated into embryonic chick neural tube.
    supporting_text: Misexpression of mApcdd1ΔTM (lacking the transmembrane domain) in the chick neural tube mimicked the effects observed with mApcdd1 (Figs. S8j-r and S9f-j), suggesting that the Wnt inhibitory activity resides within the extracellular domain.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Demonstrates directly that mouse Apcdd1 and its extracellular domain (aa 1-486) inhibit canonical Wnt signaling in vivo.
- id: PMID:22500632
  title: Sox9 and NFIA coordinate a transcriptional regulatory cascade during the initiation of gliogenesis.
  findings:
  - statement: Sox9 and NFIA directly bind and synergistically activate the mouse Apcdd1 promoter in E12.5 spinal cord, and heterologous overexpression of mammalian Apcdd1 versus ER-retained Apcdd1-L9R modulates astrocyte precursor migration in embryonic chick spinal cord.
    supporting_text: Gain-of-function studies with Apcdd1 gave complementing results, where it promoted precocious migration of ASPs, but not OLPs, and had no effect on PCNA (Figures 7G–7M).
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Establishes direct Sox9/NFIA transcriptional activation of mouse Apcdd1 in E12.5 spinal cord, while functional migration assays relied on wild-type and dominant-negative L9R overexpression in embryonic chick spinal cord without mouse Apcdd1 genetic deletion.
- id: PMID:25946682
  title: Apcdd1 stimulates oligodendrocyte differentiation after white matter injury.
  findings:
  - statement: Viral Apcdd1 expression suppresses canonical Wnt/beta-catenin transcriptional activation and promotes oligodendrocyte precursor differentiation in mouse white-matter injury models.
    supporting_text: Here we show that Apcdd1 antagonizes canonical Wnt signaling via β-catenin, and these functions are consistent with our observations that it functions to promote OL differentiation.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports canonical Wnt antagonism by mouse Apcdd1 during glial differentiation while noting that conditional glial knockout studies remained future work.
- id: PMID:26170146
  title: The role of APCDD1 in epithelial rearrangement in tooth morphogenesis.
  full_text_unavailable: true
  findings:
  - statement: Antisense oligodeoxynucleotide knockdown of mouse Apcdd1 in cultured E13.5 tooth germs alters inner enamel epithelial rearrangement, decreases cell proliferation, modulates Wnt and enamel-knot gene expression, and induces ectopic mesial cusps.
    supporting_text: Our results suggested that APCDD1 modulates the gene expression of Wnt- and EK-related signaling molecules at the cap stage of tooth development, and is involved in tooth cusp patterning by modulating the epithelial rearrangement in the IEE.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only study supporting the MGI IMP annotation to GO:0042487 via antisense knockdown in E13.5 mouse molar organ culture.
- id: PMID:29154126
  title: The Wnt Inhibitor Apcdd1 Coordinates Vascular Remodeling and Barrier Maturation of Retinal Blood Vessels.
  findings:
  - statement: Loss of mouse Apcdd1 in vivo elevates canonical Norrin/Wnt signaling in retinal and cerebellar endothelial cells, delaying developmental vessel pruning and causing precocious paracellular barrier maturation.
    supporting_text: These findings are consistent with Apcdd1 functioning as an inhibitor of Norrin/Fz4/Lrp5/6 signaling in retinal ECs and suggest that higher levels of Wnt signaling in ECs are responsible for the hypervascularization defects observed in Apcdd1-deficient mice.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Definitive mouse knockout and endothelial overexpression genetics proving endogenous mouse Apcdd1 is a negative feedback inhibitor of canonical Wnt/Norrin signaling in CNS vasculature.
- id: PMID:32320685
  title: Apcdd1 is a dual BMP/Wnt inhibitor in the developing nervous system and skin.
  findings:
  - statement: Full-length APCDD1 self-associates in mammalian cells and mouse Apcdd1 is strongly expressed in hair follicles, neural folds, and vascular endothelia.
    supporting_text: We note that APCDD1 was present both as monomer and dimer, as we previously reported (Fig. S6 B, C in (Shimomura et al., 2010)).
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Corroborates full-length APCDD1 homomeric interaction and mouse hair-follicle expression patterns.
- id: PMID:37155902
  title: Structure of WNT inhibitor adenomatosis polyposis coli down-regulated 1 (APCDD1), a cell-surface lipid-binding protein.
  findings:
  - statement: Crystal structures of the mouse APCDD1 ectodomain (PDB:8E0P, 8E0R, 8E0W) reveal two disulfide-linked beta-barrel domains (ABD1 and ABD2, bridged by Cys52-Cys466) and a ~350 A^3 hydrophobic pocket in ABD2 that co-purifies with stearic acid and mediates detergent-sensitive capture of palmitoylated WNT7A.
    supporting_text: Structural and functional analyses show that APCDD1 has a large hydrophobic pocket in ABD2 and that APCDD1 can bind to WNT7A, presumably via its covalently bound palmitoleate, a modification that is common to all WNTs and is essential for signaling.
    reference_section_type: ABSTRACT
  - statement: Purified glycosylated mouse APCDD1 ectodomain does not bind the extracellular PE1-4 domains of mouse LRP5 or human LRP6.
    supporting_text: We observed no detectable binding between the APCDD1 and the PE1-4 domains of LRP5 or LRP6, consistent with a model in which APCDD1 acts via binding to WNT ligands rather than to WNT coreceptors.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Solves the high-resolution X-ray crystal structure and ligand-binding mechanism directly on mouse APCDD1 (UniProtKB:Q3U128).
