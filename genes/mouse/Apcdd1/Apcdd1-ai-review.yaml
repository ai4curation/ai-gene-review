      monomeric (~58 kDa glycosylated) and binds WNT7A, while mApcdd1DeltaTM retains Wnt
      inhibitory activity in vivo (PMID:20393562), confirming homodimerization is a
      transmembrane-dependent auxiliary property.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      residue_claims_not_applicable: >-
        Transmembrane-helix-mediated self-association conserved across full-length mammalian
        APCDD1 orthologs.
    supported_by:
    - reference_id: PMID:32320685
      supporting_text: We note that APCDD1 was present both as monomer and dimer, as we previously reported (Fig. S6 B, C in (Shimomura et al., 2010)).
