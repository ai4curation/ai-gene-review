    label: negative regulation of Wnt signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:37155902
    supporting_text: Structural and functional analyses show that APCDD1 has a large hydrophobic pocket in ABD2 and that APCDD1 can bind to WNT7A, presumably via its covalently bound palmitoleate, a modification that is common to all WNTs and is essential for signaling.
  - reference_id: PMID:29154126
    supporting_text: These findings are consistent with Apcdd1 functioning as an inhibitor of Norrin/Fz4/Lrp5/6 signaling in retinal ECs and suggest that higher levels of Wnt signaling in ECs are responsible for the hypervascularization defects observed in Apcdd1-deficient mice.
proposed_new_terms: []
suggested_questions:
- question: >-
    How does mouse APCDD1 inhibit Norrin-stimulated FZD4/LRP5/TSPAN12 canonical Wnt
    signaling in retinal endothelial cells (PMID:29154126) given that Norrin is a
    non-lipidated cystine-knot ligand and mouse APCDD1 ectodomain does not bind LRP5/6
    PE1-4 domains (PMID:37155902)?
suggested_experiments:
- description: >-
    Test direct binding of purified glycosylated mouse APCDD1 ectodomain against Norrin,
    FZD4 cysteine-rich domain, and TSPAN12 in detergent-free capture assays to determine
    whether APCDD1 engages co-expressed endogenous WNT7A/7B or a component of the
    Norrin-FZD4-TSPAN12 receptor complex.
