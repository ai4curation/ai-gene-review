id: Q3U128
gene_symbol: Apcdd1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Single-pass type I plasma-membrane glycoprotein that acts as a feedback negative
  regulator of Wnt signaling during central nervous system vascular remodeling, blood-retinal
  and blood-brain barrier maturation, neural development, and epithelial-mesenchymal organ
  morphogenesis. X-ray crystal structures of the secreted glycosylated mouse APCDD1
  extracellular domain (PDB:8E0P, 8E0R, 8E0W) reveal two antiparallel beta-barrel domains
  (ABD1 and ABD2) oriented ~90 degrees apart and stabilized by six conserved disulfide
  bonds (including interdomain Cys52-Cys466) and three N-linked glycans (Asn100, Asn168,
  Asn319). ABD2 forms a ~350 A^3 hydrophobic pocket that accommodates fatty acyl chains and
  captures palmitoylated WNT ligands (such as WNT7A) in a detergent-sensitive manner
  without binding the extracellular PE1-4 domains of LRP5 or LRP6. In vivo, Apcdd1 is
  transcriptionally induced by canonical Wnt/beta-catenin signaling in CNS vascular
  endothelial cells, where it restrains Norrin/Wnt signaling to coordinate developmental
  vessel pruning with blood-retinal and cerebellar barrier maturation.
