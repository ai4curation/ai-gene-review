- term:
    id: GO:0043615
    label: astrocyte cell migration
  evidence_type: IDA
  original_reference_id: PMID:22500632
  qualifier: acts_upstream_of_or_within
  review:
    summary: Marked as over-annotated; rests on heterologous overexpression of wild-type and ER-trapping L9R Apcdd1 in embryonic chick spinal cord without endogenous mouse Apcdd1 loss-of-function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Kang et al. (PMID:22500632) showed that Sox9 and NFIA directly activate the mouse
      Apcdd1 promoter in E12.5 spinal cord, but tested migration by electroporating
      wild-type Apcdd1 and ER-retained dominant-negative Apcdd1-L9R into embryonic chick
      spinal cord (observing altered migration of embryonic astrocyte precursors) and
      measuring F-actin/Rho-GTPase association upon overexpression in HeLa/HEK293 cells,
      without mouse Apcdd1 knockout validation (as noted in the authors' follow-up study
      PMID:25946682). Annotating Apcdd1 directly to astrocyte cell migration overstates a
      downstream heterologous gain-of-function/dominant-negative phenotype of a cell-surface
      Wnt/BMP signaling inhibitor.
    supported_by:
    - reference_id: PMID:22500632
      supporting_text: Gain-of-function studies with Apcdd1 gave complementing results, where it promoted precocious migration of ASPs, but not OLPs, and had no effect on PCNA (Figures 7G–7M).
    - reference_id: PMID:25946682
      supporting_text: Future studies will include astrocyte- and oligodendrocyte-specific deletion of Apcdd1, to determine whether it functions through distinct- or unified-Wnt mechanisms in glial sub-lineages.
core_functions:
