id: P29752
gene_symbol: Lalba
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Mouse alpha-lactalbumin (Lalba) is a small (about 14 kDa mature), acidic, calcium-binding
  secretory protein made by mammary epithelial cells during lactation. It is the regulatory (specifier,
  or ''B'') subunit of lactose synthase: in the Golgi lumen it binds the luminal catalytic domain of beta-1,4-galactosyltransferase
  1 (B4GALT1) in a 1:1 complex and holds glucose in the enzyme''s acceptor site, switching B4GALT1''s
  acceptor preference from N-acetylglucosamine to free glucose so that the complex transfers galactose
  from UDP-galactose to glucose to make lactose, the main sugar and osmole of milk. Alpha-lactalbumin
  has no catalytic activity of its own. It evolved by duplication of the c-type lysozyme gene, keeps the
  two-domain lysozyme fold (glycosyl hydrolase 22 family), but has lost bacteriolytic (muramidase) activity
  and instead binds a single Ca2+ ion tightly in a lysozyme-derived loop that stabilises the native fold;
  calcium removal gives the classical molten globule. After acting in lactose synthesis it is secreted
  with lactose into milk, where it is a major whey protein and a source of essential amino acids and of
  peptides released by digestion, some of which are antibacterial. Partially unfolded alpha-lactalbumin
  complexed with oleic acid in vitro (HAMLET/BAMLET) kills tumour cells, but this is a property of a non-native
  protein-lipid complex rather than of the native protein. Lalba-null mice make highly viscous milk containing
  little or no lactose, and dams cannot feed their pups; human or bovine alpha-lactalbumin transgenes
  restore lactation.'
