- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000150627
  - UniProtKB:P00698
  - UniProtKB:P00711
  - UniProtKB:P61626
  review:
    summary: IBA assignment of is_active_in extracellular region from the lysozyme C clade.
    action: KEEP_AS_NON_CORE
    reason: 'Alpha-lactalbumin is a signal-peptide-bearing secretory protein released into milk, where
      it is one of the most abundant whey proteins, so extracellular localisation is correct and already
      as specific as GO permits (extracellular space is obsolete and merged into extracellular region).
      It is, however, not the site of its core activity: alpha-lactalbumin acts with B4GALT1 in the Golgi
      lumen of lactating mammary epithelial cells, and in milk it serves as a nutrient and a source of
      bioactive peptides rather than as an active lactose synthase subunit. Kept as non-core localisation;
      same call for every extracellular region row in all four orthologs. The is_active_in relation is
      inherited from secreted lysozymes; for alpha-lactalbumin the active location is the Golgi lumen,
      but the extracellular presence is real.'
    supported_by:
    - &id006
      reference_id: PMID:34125364
      supporting_text: Lactose, LALBA, and B4GALT1 within vesicles are secreted by exocytosis
    - &id007
      reference_id: PMID:29617841
      supporting_text: α-Lactalbumin is a whey protein that constitutes approximately 22% of the proteins
        in human milk and approximately 3.5% of those in bovine milk.
    - &id008
      reference_id: PMID:34125364
      supporting_text: The lactose synthase complex is formed by B4GALT1 and LALBA in the Golgi, which
        then joins glucose and UDP-galactose to form lactose while the UMP moiety is recycled.
