    - reference_id: PMID:34125364
      supporting_text: Importantly, LS is a unique enzyme complex comprised of β-1,4-galactosyltransferase-1
        (B4GALT1) and the mammary-specific modifier protein α-lactalbumin (LALBA), and requires close
        association with the uridine nucleotide cycle on the trans-Golgi
    - reference_id: PMID:31020623
      supporting_text: Lactose, the principal carbohydrate of the milk, is synthetized in the Golgi of
        mammary epithelial cells by lactose synthase from glucose and UPD galactose.
    - reference_id: PMID:31020623
      supporting_text: Endogenous GLUT8 partially co-localized with 58 K protein and α-lactalbumin in
        mammary tissue
