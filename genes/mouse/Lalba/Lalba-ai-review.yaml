    summary: IBA transfer of antibacterial defence from the lysozyme C clade.
    action: REMOVE
    reason: Native alpha-lactalbumin is not bactericidal; antibacterial activity has been shown only for
      peptides released by proteolysis (trypsin/chymotrypsin fragments) and for non-native, partially
      unfolded alpha-lactalbumin-oleic acid complexes (HAMLET) formed in vitro. Neither is a function
