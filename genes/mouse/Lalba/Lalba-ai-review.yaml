core_functions:
- description: 'Regulatory (specifier) subunit of lactose synthase: in the Golgi lumen of lactating mammary
    epithelial cells alpha-lactalbumin binds B4GALT1 and holds glucose in its acceptor site, changing
    acceptor specificity from GlcNAc to glucose so that the B4GALT1-alpha-lactalbumin complex makes lactose
    from UDP-galactose and glucose. Alpha-lactalbumin contributes to, but does not itself catalyse, lactose
    synthase activity.'
