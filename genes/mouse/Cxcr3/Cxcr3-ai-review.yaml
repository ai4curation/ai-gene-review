- term:
    id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P49682
  review:
    summary: Transfer of a human CXCR3-B annotation (chemokine-induced cAMP rise in CXCR3-B transfectants).
    action: REMOVE
    reason: This row is an orthology transfer of a human annotation made on the CXCR3-B splice isoform (P49682-2),
      which carries a 51-residue N-terminal extension. A six-frame search of the mouse Cxcr3 locus finds no counterpart
      of that extension (the reading frame starting at the syntenic ATG stops after 20 codons), Ensembl annotates
      a single mouse transcript and UniProt lists no mouse isoforms, so the protein that produced the human result
      does not exist in mouse. In the human study the cAMP rise was specific to CXCR3-B and absent from CXCR3-A,
      the form mouse retains. CXCR3-A-type signalling is Gi-coupled, so adenylate cyclase activation is not expected
      for the mouse receptor.
    supported_by:
    - reference_id: PMID:12782716
      supporting_text: the same chemokines did not induce any significant increase of cAMP levels in either mock
        cells nor CXCR3-A transfectants
    - *id012
    - *id013
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:P49682
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human annotation made on the CXCR3-B isoform (P49682-2); the mouse locus encodes no CXCR3-B counterpart.
