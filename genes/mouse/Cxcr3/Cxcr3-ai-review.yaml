- term:
    id: GO:0016525
    label: negative regulation of angiogenesis
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P49682
  review:
    summary: Transfer of a human CXCR3-B annotation (angiostatic activity in endothelial cells).
    action: UNDECIDED
    reason: This row is an orthology transfer of a human annotation made on the CXCR3-B splice isoform (P49682-2),
      which carries a 51-residue N-terminal extension. A six-frame search of the mouse Cxcr3 locus finds no counterpart
      of that extension (the reading frame starting at the syntenic ATG stops after 20 codons), Ensembl annotates
      a single mouse transcript and UniProt lists no mouse isoforms, so the protein that produced the human result
      does not exist in mouse. Independently, Cxcr3-/- mice develop larger laser-induced choroidal neovascular lesions
      and CXCR3 is detected on CNV endothelium, which suggests that mouse Cxcr3 does limit angiogenesis in some
      setting. However, macrophage infiltration and CCL2 also increase, the paper is abstract-only in our cache,
      and it is unclear whether the effect is a direct endothelial signal or an indirect inflammatory one. The transferred
      basis does not apply and the mouse evidence is suggestive but not decisive.
    supported_by:
    - *id012
    - *id022
    - reference_id: PMID:22408007
      supporting_text: Immunohistochemistry showed CXCR3 expression on the endothelial cells of CNV
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:P49682
        source_status: UNRESOLVED
        comment: Human annotation made on the CXCR3-B isoform (P49682-2); the mouse locus encodes no CXCR3-B counterpart.
