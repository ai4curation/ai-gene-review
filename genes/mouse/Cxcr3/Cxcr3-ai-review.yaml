- term:
    id: GO:0001937
    label: negative regulation of endothelial cell proliferation
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P49682
  review:
    summary: Transfer from human, where the annotation rests on CXCR3-B overexpression in HMEC-1 endothelial cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: This row is an orthology transfer of a human annotation made on the CXCR3-B splice isoform (P49682-2),
      which carries a 51-residue N-terminal extension. A six-frame search of the mouse Cxcr3 locus finds no counterpart
      of that extension (the reading frame starting at the syntenic ATG stops after 20 codons), Ensembl annotates
      a single mouse transcript and UniProt lists no mouse isoforms, so the protein that produced the human result
      does not exist in mouse. No mouse experiment addresses endothelial cell proliferation directly. Knockout mice
      develop larger choroidal neovascular lesions, but that phenotype also involves more macrophages and does not
      establish an endothelial proliferation signal. The claim is not excluded, but it overstates what is known
      for this species.
    supported_by:
    - &id024
      reference_id: PMID:12782716
      supporting_text: overexpression of CXCR3-B dramatically reduced DNA synthesis and up-regulated apoptotic HMEC-1
        death through activation of distinct signal transduction pathways
    - &id012
      reference_id: file:mouse/Cxcr3/Cxcr3-bioinformatics/RESULTS.md
      supporting_text: No mouse frame encodes a counterpart of the
    - &id013
