id: O88410
gene_symbol: Cxcr3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Cxcr3 (CD183) is an X-linked class A seven-transmembrane G protein-coupled chemokine receptor of the
  plasma membrane. It is the receptor for the interferon-inducible C-X-C chemokines CXCL9 (Mig) and CXCL10 (IP-10),
  and by similarity with the human ortholog also CXCL11, which is not functional in some laboratory strains. Ligand
  binding triggers calcium mobilisation and directed migration. In mouse it is the sole functional receptor for
  CXCL9 and CXCL10 on activated T cells. Unlike the human receptor, mouse Cxcr3 also responds to the mouse form
  of the C-C chemokine CCL21 (6Ckine/SLC), which drives CXCR3-dependent calcium signalling and chemotaxis of microglia
  and calcium transients in astrocytes. Cxcr3 is induced on activated T cells, especially Th1 and cytotoxic effector
  cells. It directs these cells into interferon-driven inflammatory sites, such as rejecting allografts, infected
  brain and inflamed adipose tissue, and positions T cells within lymph nodes and spleen, which in turn influences
  Th1 differentiation and the balance between effector and memory CD8 T cells. The mouse gene encodes a single CXCR3-A-like
  protein of 367 residues. The mouse locus has no counterpart of the human CXCR3-B splice isoform, whose N-terminal
  extension underlies the angiostatic and pro-apoptotic responses described for human endothelial cells.
