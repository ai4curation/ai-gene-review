core_functions:
- description: Plasma membrane receptor for the interferon-inducible C-X-C chemokines CXCL10 and CXCL9. Ligand engagement
    triggers cytosolic calcium mobilisation and directed migration of activated T cells, and Cxcr3 is the sole functional
    CXCL9/CXCL10 receptor on mouse T cells. These functions are established by mouse experiments (transfectants
    and knockout cells).
  molecular_function:
    id: GO:0016494
    label: C-X-C chemokine receptor activity
  directly_involved_in:
  - id: GO:0070098
    label: chemokine-mediated signaling pathway
  - id: GO:0010818
    label: T cell chemotaxis
  - id: GO:0007204
    label: positive regulation of cytosolic calcium ion concentration
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:9790904
    supporting_text: It mediates Ca2+ mobilization in response to IP-10
  - reference_id: PMID:11085753
    supporting_text: failed to respond in chemotaxis assays to IP-10
  - reference_id: PMID:11085753
    supporting_text: indicating that CXCR3 is the sole functional receptor for these chemokines
  - reference_id: PMID:18347328
    supporting_text: CXCR3-deficient CD8(+) T cells were 7-fold less efficient at migrating into the infected brains
      than wild-type CD8(+) T cells
suggested_questions:
- question: Does mouse Cxcr3 have any angiostatic function that is intrinsic to endothelial cells, given that the
    CXCR3-B isoform that mediates this in human is absent from mouse? Or is the larger neovascularisation in Cxcr3-/-
    mice a secondary effect of altered macrophage recruitment?
- question: PAINT node PTN001628461 propagates C-C chemokine receptor activity and C-C chemokine binding into the
    CXCR3 subfamily. Should the CXCR3 clade carry these terms? In mouse they hold for CCL21, but in human they do
    not.
- question: Is the CCL21-CXCR3 interaction in mouse brain physiologically relevant at the CCL21 concentrations released
    by damaged neurons?
suggested_experiments:
- description: Delete Cxcr3 in endothelial cells only (for example Cdh5-CreERT2 with a floxed allele) and in myeloid
    cells only, then repeat the laser-induced choroidal neovascularisation model. This would test whether the angiostatic
    phenotype is endothelial-intrinsic.
- description: Measure direct binding and G protein activation (BRET sensors) for mouse CXCR3 with mouse CCL21,
    CXCL9 and CXCL10 at physiological receptor density, to compare the potency of the C-C ligand with the canonical
    C-X-C ligands.
