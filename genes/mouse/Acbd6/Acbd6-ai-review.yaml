id: Q9D061
gene_symbol: Acbd6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mouse Acbd6 encodes a soluble 282-residue monomeric acyl-CoA-binding protein that is the
  one-to-one mammalian ortholog of human ACBD6, pairing an N-terminal four-helix
  acyl-CoA-binding (ACB) domain (residues 42-127) with two C-terminal ankyrin (ANK) repeats
  (residues 191-220 and 224-253) and lacking any transmembrane segment. Transcript profiling
  shows broad Acbd6 expression across adult mouse brain regions, and alternative splicing
  generates both the full-length 282-residue protein (isoform 1) and two shorter C-terminally
  truncated variants (isoforms 2 and 3, 137 and 139 residues) that retain the intact ACB
  domain and conserved acyl-CoA pocket (Phe46, Tyr69, Lys73, Lys95, Tyr114) as well as the
  regulatory Ser106/Ser108 loop sites, while lacking the C-terminal ANK repeats. By strict
  orthology and full active-site conservation with human ACBD6, full-length mouse Acbd6
  resides in the cytosol and nucleus, selectively binds medium- and long-chain unsaturated
  fatty-acyl-CoA thioesters without binding free fatty acids, regulates acyl-CoA delivery to
  membrane lysophospholipid acyltransferases for phosphatidylcholine remodeling, and binds
  cytosolic N-myristoyltransferases via its ANK module to stimulate protein N-myristoylation
  and prevent competitive inhibition by palmitoyl-CoA.
alternative_products:
- name: '1'
  id: Q9D061-1
  description: >-
    Canonical full-length 282-residue monomeric isoform containing both the N-terminal ACB
    domain (residues 42-127) and the two C-terminal ankyrin repeats (residues 191-220 and
    224-253) required for N-myristoyltransferase binding and activation.
- name: '2'
  id: Q9D061-2
  sequence_note: VSP_018003, VSP_018004
  description: >-
    137-residue C-terminally truncated splice variant that retains the complete N-terminal
    ACB domain (residues 42-127, including Tyr69, Lys73, Lys95, and Tyr114) sufficient for
    fatty-acyl-CoA binding in human ACBD6-DeltaC, but lacks residues 138-282 including both
    C-terminal ankyrin repeats required for NMT1/NMT2 interaction; endogenous protein
    stability and physiological role in mouse tissues are uncharacterized.
- name: '3'
  id: Q9D061-3
  sequence_note: VSP_018002, VSP_018005
  description: >-
    139-residue C-terminally truncated splice variant retaining the intact N-terminal ACB
    domain (residues 42-127) while lacking residues 140-282 and both C-terminal ankyrin
    repeats; predicted to bind fatty-acyl-CoAs if stably expressed, but unable to dock onto
    NMT1/NMT2 via an ANK module.
