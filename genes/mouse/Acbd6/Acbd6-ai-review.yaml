  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:26621918
    supporting_text: >-
      We determined that the acyl-CoA binding protein, acyl-CoA binding domain (ACBD)6,
      stimulated the NMT reaction of NMT2. This stimulatory effect required interaction
      between ACBD6 and NMT2, and was enhanced by binding of ACBD6 to its ligand, C 18:2
      -CoA.
suggested_questions:
- question: >-
    Are the two short ANK-less splice variants of mouse Acbd6 (Q9D061-2 and Q9D061-3)
    translated into stable endogenous proteins in mouse brain or hematopoietic progenitors,
    and do they act as pure acyl-CoA buffers uncoupled from NMT1/NMT2 activation?
  experts:
  - Eric Soupene
  - Reza Maroofian
suggested_experiments:
- hypothesis: >-
    Conditional deletion of Acbd6 in mouse brain recapitulates the progressive movement
    disorder, microcephaly, and N-myristoylome remodeling observed in human NEDPM patients
    and acbd6-deficient zebrafish.
  description: >-
    Generate a Nestin-Cre conditional Acbd6-knockout mouse line and quantify motor behavior,
    striatal/cerebellar neuropathology, and brain N-myristoylome stoichiometry.
  experiment_type: conditional mouse knockout phenotyping and N-terminomics proteomics
