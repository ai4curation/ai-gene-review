- id: PMID:12650615
  title: Membrane localization of Arabidopsis acyl-CoA binding protein ACBP2.
  full_text_unavailable: true
  findings:
  - statement: >-
      Arabidopsis ACBP1 and ACBP2 require their plant-specific N-terminal transmembrane
      domain for endoplasmic reticulum and plasma-membrane targeting.
    supporting_text: >-
      GFP fusions with deletion derivatives of ACBPI or ACBP2 lacking the transmembrane
      domain were impaired in membrane targeting.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cached abstract-only plant study documenting why the Arabidopsis PAINT seeds at
      PTN001191022 do not license ER or plasma-membrane localization on soluble mouse Acbd6.
- id: PMID:18268358
  title: Characterization of an acyl-coenzyme A binding protein predominantly expressed
    in human primitive progenitor cells.
  findings:
  - statement: >-
      Human ACBD6 selectively binds unsaturated long-chain fatty-acyl-CoAs via its
      N-terminal ACB domain even when C-terminal ankyrin repeats are removed.
    supporting_text: >-
      ACBD6 binds long-chain acyl-CoAs with a strong preference for unsaturated, C18:1-CoA
      and C20:4-CoA, over saturated, C16:0-CoA, acyl species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary biochemical characterization of the human ortholog Q9BR61 (full text read),
      grounding fatty-acyl-CoA binding and ACB domain sufficiency for mouse Q9D061.
- id: PMID:26621918
  title: Association of NMT2 with the acyl-CoA carrier ACBD6 protects the N-myristoyltransferase
    reaction from palmitoyl-CoA.
  findings:
  - statement: >-
      Human ACBD6 binds NMT2 and NMT1 via its C-terminal domain and requires Tyr114-mediated
      acyl-CoA binding to stimulate NMT2 catalysis and prevent palmitoyl-CoA competition.
    supporting_text: >-
      Compared with ACBD6, two ACBD6 mutant forms, Y 114 A and FKKY-AAAA (dubbed FKKY mut
      ), with defects in acyl-CoA binding ( 19 ) failed to stimulate the reaction in the
      presence of C 14 -CoA, thus acyl-CoA binding of ACBD6 is required for the stimulatory
      effect on NMT2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read; establishes the NMT activator activity of mammalian ACBD6 inherited by
      mouse Q9D061.
- id: PMID:37951597
  title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive
    and complex movement disorders.
  findings:
  - statement: >-
      Single-cell RNA sequencing shows that mouse Acbd6 is broadly expressed across nearly
      all profiled regions of the adult mouse brain, while mammalian Myc-ACBD6 localizes to
      the cytosol and nucleus without peroxisomal targeting.
    supporting_text: >-
      Acbd6 is expressed in nearly all regions of the adult mouse brain profiled by
      single-cell RNA sequencing (Supplementary Fig. 3).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Reports adult mouse brain scRNA-seq expression of Acbd6 alongside
      human genetics, COS-7 cytosolic/nuclear localization, and zebrafish/Xenopus knockout
      studies, confirming no mouse functional knockout was assayed.
