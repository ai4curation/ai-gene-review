  review:
    summary: The orthologous human IRAK3 pseudokinase domain forms a head-to-head homodimer in the crystal structure. For
      mouse Irak3 this is inferred from the human protein and has not been tested directly.
    action: ACCEPT
    reason: Mouse and human IRAK3 are orthologues in the same PANTHER subfamily (PTHR24419:SF7) and share about 75% identity
      across the full length. The dimer is a structural property of the conserved pseudokinase domain. The transfer is justified,
      but it rests on the human structure; no mouse-specific dimerisation data exist. Accepted as the inferred structural
      basis for IRAK-M Myddosome assembly.
    supported_by: &id037
