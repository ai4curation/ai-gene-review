  review:
    summary: Mouse Irak3 participates in IL-1 receptor signaling. It joins the IL-1-induced MyD88-IRAK4-TRAF6-MEKK3 complex,
      can restore IL-1-induced NF-kB activation in IRAK1-deficient cells, and limits IL-1-induced cytokine production.
