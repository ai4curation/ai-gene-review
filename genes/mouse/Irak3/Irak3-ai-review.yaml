id: Q8K4B2
gene_symbol: Irak3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Irak3 (IRAK-M) is a member of the IL-1 receptor-associated kinase family. It has an N-terminal death domain,
  a central pseudokinase domain and a C-terminal region. Its catalytic loop reads CGN, with Asn-306 in place of the HRD aspartate,
  and its Mg-binding loop reads DFA. It shares this configuration with human IRAK3 in the IRAK3 subfamily and is not expected
  to act as a protein kinase. Expression is concentrated in monocytes, macrophages and dendritic cells, and it is induced
  by Toll-like receptor stimulation. Irak3 then acts as negative feedback on MyD88-dependent TLR and IL-1 receptor signaling.
  Its death domain (Trp-74) binds IRAK4, and it holds IRAK1 and IRAK4 on MyD88 and prevents formation of IRAK-TRAF6 complexes.
  Irak3-deficient mice and macrophages produce more IL-6, IL-12 and TNF, show stronger inflammatory responses to bacterial
  infection, and lose endotoxin tolerance. Irak3 also forms an IRAK-M Myddosome with MyD88 and IRAK4 that drives a MEKK3-dependent
  second wave of NF-kB activation and induces inhibitory genes such as SOCS1, SHIP1, A20 and IkBa. In addition, it limits
  translation of cytokine mRNAs through IRAK-2, and it selectively dampens p38 MAPK activation while maintaining MKP-1 protein.
  Irak3 is mainly cytoplasmic. In IL-33-stimulated dendritic cells, PIN1 isomerises its phospho-Thr110-Pro111 motif, after
  which Irak3 enters the nucleus and promotes expression of selected inflammatory genes that drive type 2 airway inflammation.
