- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: IDA
  original_reference_id: PMID:12054681
  qualifier: enables
  review:
    summary: Mouse Irak3 is a pseudokinase. Its catalytic loop is CGN (Asn-306 replaces the HRD aspartate) and its Mg-binding
      loop is DFA. UniProt curators call it a putative inactive kinase, and the low-level autophosphorylation reported in
      2002 has not been reproduced as intrinsic activity.
    action: REMOVE
    reason: Phosphotransfer requires the catalytic HRD aspartate, which mouse Irak3 lacks (Asn-306; human Ser-293 at the same
      position). Both orthologues sit in PANTHER subfamily PTHR24419:SF7, separate from the catalytically active IRAK1 and
      IRAK4 subfamilies, so kinase activity cannot be transferred from those paralogues. The only mouse evidence is a low
      level of autophosphorylation in the 2002 characterisation (PMID:12054681, abstract only). That is plausibly explained
      by co-precipitating active IRAKs, and the human orthologue in the same assay type shows only negligible autophosphorylation.
      The human IRAK3 structure paper describes IRAK3 as a pseudokinase lacking catalytic activity, and no substrate of IRAK3
      phosphorylation has been identified. UniProt records the discrepancy in a CAUTION note. Mouse Irak3 regulates signaling
      through protein interactions of its death domain and pseudokinase domain, not by phosphotransfer. Removed for every
      row of this claim, including the ISO, ARBA and InterPro2GO rows inherited from the domain signature.
    supported_by: &id010
    - *id007
    - &id021
      reference_id: file:mouse/Irak3/Irak3-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: Low level autophosphorylation activity has been reported in PubMed:12054681, while other authors describe
        this as an inactive kinase.
    - &id022
      reference_id: file:mouse/Irak3/Irak3-bioinformatics/RESULTS.md
      supporting_text: human CGS 291-293 aligns to mouse CGN 304-306
    - &id015
      reference_id: file:mouse/Irak3/Irak3-bioinformatics/RESULTS.md
      supporting_text: Both proteins are classified in PANTHER 19.0 subfamily PTHR24419:SF7 (IRAK3)
    - &id023
      reference_id: PMID:33238146
      supporting_text: In contrast to the active kinases IRAK1 and IRAK4, IRAK2 and IRAK3 are pseudokinases lacking catalytic
        activity and their functions are poorly understood.
    - *id008
    - &id048
      reference_id: PMID:10383454
      supporting_text: Although IRAK-M and IRAK-2 exhibit only a negligible autophosphorylation activity, they can reconstitute
        the IL-1 response in a 293 mutant cell line lacking IRAK.
    - *id009
