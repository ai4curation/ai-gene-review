- term:
    id: GO:0046777
    label: protein autophosphorylation
  evidence_type: IDA
  original_reference_id: PMID:12054681
  qualifier: acts_upstream_of_or_within
  review:
    summary: Autophosphorylation was reported at low level for mouse IRAK-M in 2002, but Irak3 lacks the catalytic aspartate
      (Asn-306) and is regarded as a pseudokinase.
    action: REMOVE
    reason: Autophosphorylation requires intrinsic catalytic activity. Mouse Irak3 has CGN in place of HRD and DFA in place
      of DFG, and the orthologous human protein shows only negligible autophosphorylation and is described as catalytically
      inactive. UniProt records the 2002 report as discordant. Low-level phosphorylation in immunoprecipitates can come from
      co-associated active IRAK1 or IRAK4, which phosphorylate IRAK3. The claim is removed together with the kinase activity
      rows.
    supported_by:
    - *id007
    - *id021
    - *id022
    - *id023
    - *id048
