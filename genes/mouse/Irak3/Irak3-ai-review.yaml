existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:12054681
  qualifier: enables
  review:
    summary: Mouse Irak3 has a DFA in place of the Mg2+-coordinating DFG motif and no catalytic HRD aspartate; the orthologous
      human pseudokinase domain shows no thermal stabilisation by MgCl2 or Mg-ATP.
    action: REMOVE
    reason: Magnesium ion binding in a protein kinase domain is a property of the catalytic Mg-ATP complex. Mouse Irak3 lacks
      the catalytic aspartate (CGN 304-306, Asn-306) and carries DFA (324-326) in place of DFG, the same configuration as
      human IRAK3 in the same PANTHER subfamily (PTHR24419:SF7). For the human pseudokinase domain MgCl2 and Mg-ATP gave no
      thermal shift. The 2002 mouse report (abstract only in cache) does not mention magnesium; it describes only a kinase-activity
      similarity to human IRAK-M, which itself shows only negligible autophosphorylation. Mg binding is contradicted by structure
      and biophysics, so all rows of this claim are removed.
    supported_by: &id001
    - &id007
      reference_id: file:mouse/Irak3/Irak3-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: Asn-306 is present instead of the conserved Asp which is expected to be an active site residue.
    - reference_id: file:mouse/Irak3/Irak3-bioinformatics/RESULTS.md
      supporting_text: human DFA 311-313 aligns to mouse DFA 324-326
    - &id008
      reference_id: PMID:33238146
      supporting_text: The canonical catalytic “HRD”-motif is missing entirely in IRAK3 and replaced with “CGS,” whereas the
        Mg2+-coordinating “DFG”-motif is slightly altered to “DFA.”
    - reference_id: PMID:33238146
      supporting_text: In agreement with the structure-guided predictions, MgCl2 and ATP did not induce significant thermal
        shifts in IRAK3, while the addition of staurosporine resulted in a +7.9°C shift of the melting temperature.
    - &id009
      reference_id: PMID:12054681
      supporting_text: These IRAK-M molecules show 71% sequence identity, a comparable cellular expression, and functional
        similarities with respect to signal transduction capacity and kinase activity, suggesting functional homology in signalling
        in human and mouse cells.
