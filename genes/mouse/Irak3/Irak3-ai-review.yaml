- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15102471
  qualifier: enables
  supporting_entities:
  - UniProtKB:P70196
  review:
    summary: IntAct records an IRAK3-TRAF6 interaction from the Alliance for Cellular Signaling curation (PMID:15102471, a
      review of signaling databases). The association is independently shown in mouse cells by PMID:23376919.
    action: MODIFY
    reason: Bare protein binding is uninformative. The partner is TRAF6, a RING E3 ubiquitin ligase, and the association was
      detected by co-immunoprecipitation from mouse cells after IL-1 or TLR stimulation. The informative function term is
      ubiquitin protein ligase binding (GO:0031625). It is unknown whether the contact is direct, so the replacement is the
      binding term, not an adaptor activity. The cited paper is a review of bioinformatics resources and gives no experimental
      detail. The replacement relies on the primary co-immunoprecipitation evidence in PMID:23376919.
