core_functions:
- description: Death-domain/pseudokinase adaptor that binds IRAK4 within the MyD88-IRAK4 receptor complex. It retains IRAK1/IRAK4
    on MyD88 and prevents IRAK-TRAF6 coupling, providing TLR-induced negative feedback on TLR and IL-1R signaling, macrophage
    cytokine production and endotoxin tolerance. This is experimentally established in mouse (knockout and death-domain mutagenesis).
  molecular_function:
    id: GO:0019901
    label: protein kinase binding
  directly_involved_in:
  - id: GO:0034122
    label: negative regulation of toll-like receptor signaling pathway
  - id: GO:2000660
    label: negative regulation of interleukin-1-mediated signaling pathway
  - id: GO:0043242
    label: negative regulation of protein-containing complex disassembly
  - id: GO:0010933
    label: positive regulation of macrophage tolerance induction
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:12150927
    supporting_text: We show here that IRAK-M is induced upon TLR stimulation and negatively regulates TLR signaling.
  - reference_id: PMID:12150927
    supporting_text: IRAK-M prevented dissociation of IRAK and IRAK-4 from MyD88 and formation of IRAK-TRAF6 complexes.
  - reference_id: PMID:12150927
    supporting_text: Endotoxin tolerance, a protection mechanism against endotoxin shock, was significantly reduced in IRAK-M(-/-)
      cells.
  - reference_id: PMID:23376919
    supporting_text: Furthermore, the W74A IRAK-M mutant completely lost the interaction with IRAK-4
- description: As part of an IRAK-M Myddosome (MyD88-IRAK4-Irak3), it transmits a MEKK3-dependent second wave of NF-kB activation
    that induces inhibitory genes, and it limits IRAK-2-dependent cytokine translation. Shown in mouse BMDMs and reconstituted
    cells.
  molecular_function:
    id: GO:0019901
    label: protein kinase binding
  directly_involved_in:
  - id: GO:0002755
    label: MyD88-dependent toll-like receptor signaling pathway
  - id: GO:0070498
    label: interleukin-1-mediated signaling pathway
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:23376919
    supporting_text: IRAK-M was also able to interact with MyD88-IRAK-4 to form IRAK-M Myddosome to mediate TLR7-induced MEKK3-dependent
      second wave NFκB activation
  - reference_id: PMID:23376919
    supporting_text: IRAK-M mediates TLR7-induced MEKK3-dependent second wave NFκB activation to produce inhibitory molecules
      as a negative feedback for the pathway, while exerting inhibitory effect on translational control of cytokines and chemokines.
suggested_questions:
- question: Does mouse Irak3 have any intrinsic phosphotransferase activity when it is purified free of IRAK1 and IRAK4, given
    the low-level autophosphorylation reported in 2002 and the Asn-306 substitution of the catalytic aspartate?
- question: How is the choice between the IRAK-M Myddosome (MEKK3 second wave) and docking onto IRAK-2 Myddosomes determined,
    and does the head-to-head pseudokinase dimer seen for human IRAK3 form in mouse Irak3?
- question: What does nuclear Irak3 do in IL-33-stimulated dendritic cells, and does it bind chromatin or transcriptional
    regulators?
suggested_experiments:
- description: In vitro kinase assays with recombinant mouse Irak3 pseudokinase domain (wild type and N306D), compared with
    IRAK4, to test for intrinsic catalytic activity and whether restoring the aspartate restores it.
  experiment_type: biochemical assay
- description: Knock-in mice carrying the IRAK4-binding death-domain mutant (W74A) of Irak3, to separate receptor-complex
    functions from other activities in vivo (endotoxin tolerance, IL-33 airway inflammation).
  experiment_type: genetic perturbation
