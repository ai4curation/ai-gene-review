- id: PMID:8710882
  title: 'Cleavage of lamin A by Mch2 alpha but not CPP32: multiple interleukin 1 beta-converting enzyme-related
    proteases with distinct substrate recognition properties are active in apoptosis.'
  findings:
  - statement: Recombinant human Mch2/CASP6 cleaves lamin A whereas CPP32/CASP3 does not in the tested
      comparison.
    supporting_text: Mch2 alpha also cleaved recombinant and nuclear lamin A
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract inspected after normal cache fetch; full-text fetch failed. Recombinant
      proteins explicitly identified as human. Mouse use is comparative orthology, not a direct mouse assay.
core_functions:
- description: CASP6 cleaves protein substrates through cysteine endopeptidase activity, contributing to
    apoptotic execution and context-dependent amplification through BID. Activation and substrate preferences
    differ from CASP3/CASP7; mouse loss does not abolish all apoptosis.
  molecular_function:
