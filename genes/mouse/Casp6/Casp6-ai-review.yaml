- id: PMID:32029622
  title: An AMPK-caspase-6 axis controls liver damage in nonalcoholic steatohepatitis.
  findings:
  - statement: CASP3 or CASP7 cleaves procaspase-6; active CASP6 cleaves BID and amplifies mitochondrial death
      signaling when AMPK inhibition is relieved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text inspected: native mouse liver perturbation, HepG2 experiments and purified cleavage
      assays support a context-dependent CASP3/7–CASP6–BID feedforward mechanism. Peptide substrates/inhibitors
      are not entirely caspase-specific; genetic depletion corroborates the role.'
- id: PMID:32298652
  title: Caspase-6 Is a Key Regulator of Innate Immunity, Inflammasome Activation, and Host Defense.
  findings:
  - statement: CASP6 promotes RIPK3–ZBP1 assembly without requiring catalytic activity; its contribution is
      stimulus-specific.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and primary Figure 6A inspected. Native mouse infection and mouse CASP6/RIPK3
      constructs establish a protease-independent complex-assembly role in the IAV context.
