id: O08738
gene_symbol: Casp6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Casp6 is an Asp-directed cysteine endopeptidase that contributes to apoptotic substrate processing,
  local axon degeneration and context-dependent immune-cell death. Its cytosolic and nuclear pools cleave protein
  substrates, and BID cleavage can sustain mitochondrial apoptotic signaling in hepatocytes. AMPK phosphorylation
  restrains this feedforward mechanism. Mouse CASP6 also promotes RIPK3–ZBP1 complex assembly during influenza infection
  independently of protease activity. These roles are context dependent: Casp6 deficiency does not generally abolish
  apoptosis or development.'
