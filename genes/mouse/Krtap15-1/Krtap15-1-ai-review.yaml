  label: Mus musculus
description: Keratin-associated protein 15-1 (Krtap15-1; also pmg-2) is a 150-aa glycine-, serine-, phenylalanine-
  and tyrosine-rich keratin-associated protein of the PMG family, encoded by an intronless gene adjacent to and
  divergently transcribed from Krtap14 (pmg-1). It is expressed in growing hair follicles, with peaks during the
  first postnatal hair cycles, in sebaceous and eccrine sweat glands, and transiently in mammary epithelium at the
  onset of puberty. By family membership it is a matrix protein of the keratinizing hair fibre, associating with
  hair keratin intermediate filaments; its precise follicular compartment and function have not been determined.
