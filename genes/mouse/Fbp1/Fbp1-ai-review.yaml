id: Q9QXD6
gene_symbol: Fbp1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Fbp1 encodes mouse fructose-1,6-bisphosphatase 1, a Mg2+-dependent
  cytosolic class I fructose-bisphosphatase that functions as a homotetramer to
  hydrolyze fructose 1,6-bisphosphate to fructose 6-phosphate and inorganic
  phosphate. This irreversible, AMP- and fructose 2,6-bisphosphate-regulated
  reaction bypasses phosphofructokinase and forms a rate-controlling step of
  gluconeogenesis, particularly in liver. Mouse and mouse-transgenic studies also
  implicate FBPase abundance in hepatic glycerol gluconeogenesis, glucose sensing
  and insulin secretion in pancreatic beta cells, and nutrient-responsive satiety
  signaling.'
