suggested_questions:
- question: Are the human FBP1 nuclear HIF-repression activities in clear-cell
    renal carcinoma cells conserved in any normal mouse renal or hepatic cell
    context, or are they human tumour-cell moonlighting roles?
- question: Which rat Fbp1 experiments seeded the extracellular and
    stimulus-response transfers, and do those data identify FBP1 protein
    localization or activity rather than expression changes?
suggested_experiments:
- description: Perform chromatin immunoprecipitation and HIF reporter assays in
    mouse renal proximal tubule and hepatocyte models expressing wild-type or
    catalytically dead Fbp1 to test whether nuclear HIF repression is conserved
    outside human ccRCC cells.
- description: Measure endogenous Fbp1 protein localization in mouse liver and
    kidney by subcellular fractionation with cytosolic, nuclear, and
    extracellular/exosome controls to distinguish the core cytosolic pool from
    propagated peripheral locations.
