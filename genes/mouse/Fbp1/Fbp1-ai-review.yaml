- id: PMID:30150719
  title: Metformin reduces liver glucose production by inhibition of
    fructose-1-6-bisphosphatase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified full-text mouse study of recombinant and native mouse
      FBP1, an AMP-insensitive G27P knock-in allele, and the FBP1 dependence of
      metformin and AMP-mimetic suppression of liver glucose production.
- id: PMID:16497803
  title: Expression of human fructose-1,6-bisphosphatase in the liver of
    transgenic mice results in increased glycerol gluconeogenesis.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified mouse in vivo liver FBPase-overexpression study that
      supports the curated UniProt statement that FBPase abundance modulates
      hepatic glycerol gluconeogenesis; the assayed enzyme was a human FBPase
      transgene expressed in mouse liver.
- id: PMID:25043030
  title: Fructose-1,6-bisphosphatase opposes renal carcinoma progression.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified full-text human ccRCC study supporting FBP1 nuclear
      HIF binding and HIF-dependent transcriptional repression. It justifies the
      conserved non-core HIF transfer but not normal growth or Ras-signaling
      process terms for mouse Fbp1.
- id: PMID:19881551
  title: 'Warburg effect revisited: an epigenetic link between glycolysis and gastric
    carcinogenesis.'
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified from the available abstract as the human
      gastric-cancer/NF-kappaB paper showing that FBP1 restoration reduces growth
      and glycolysis. It supports contextual negative regulation of glycolysis,
      but the abstract places FBP1 downstream of Ras/NF-kappaB methylation rather
      than establishing FBP1 as a Ras-signaling regulator.
- id: PMID:18650089
  title: Allosteric FBPase inhibitors gain 10(5) times in potency when
    simultaneously binding two neighboring AMP sites.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified from the available abstract as an in vitro human
      FBPase allosteric-inhibitor study. It supports AMP-site inhibitor binding
      and pharmacology, not a cellular xenobiotic-response process executed by
      FBP1.
