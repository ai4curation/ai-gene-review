      fusion proteins in microglia and appeared as extracellular dots and granules in the central nervous
      system
suggested_questions:
- question: Does purified RTL6 bind LPS (lipid A or the polysaccharide moiety) directly, and does its
    basic C-terminal helix mediate this?
- question: Is RTL6 required for TLR4 downstream signaling in microglia, as suggested by recent RNA-seq
    of Rtl6 knockout microglia, or does it act independently of TLR4 as a physical trap?
- question: How is RTL6, which lacks a signal peptide, secreted from microglia?
suggested_experiments:
- description: Binding of recombinant RTL6 (wild type and basic-helix mutants) to LPS and lipid A by surface
    plasmon resonance or LAL-neutralization assays, and negative-stain EM of RTL6/LPS assemblies.
- description: Infection of Rtl6 knockout mice with Gram-negative bacteria (e.g. intracerebral E. coli)
    with quantitative readouts of bacterial load, cytokines and survival, alongside TLR4-deficient comparators.
