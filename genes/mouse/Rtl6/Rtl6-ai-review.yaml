id: Q505G4
gene_symbol: Rtl6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: RTL6 (retrotransposon Gag-like 6; also SIRH3, LDOC1L, Mart6) is a small, eutherian-specific
  protein derived from the gag (capsid) region of a Ty3/gypsy (sushi-ichi-related) LTR retrotransposon
  and belongs to the LDOC1 family. It consists of an N-terminal coiled coil and a Gag capsid-like domain
  ending in an extremely basic, arginine-rich helix, and has no catalytic or retrotransposition motifs.
  RTL6 is the most conserved of the eutherian RTL/SIRH genes. In the mouse it is expressed mainly in the
  central nervous system, peaking perinatally, by microglia, and the protein is found in microglial granules
  and as extracellular dots and granules in the brain. After intracerebral lipopolysaccharide (LPS) injection
  RTL6 rapidly accumulates at the LPS, forming complexes with RTL6 at the core and LPS at the surface,
  and Rtl6 knockout mice show reduced LPS removal while dsRNA removal (dependent on RTL5) is unaffected.
  RTL6 thus functions as an extracellular, microglia-derived innate immune factor that traps and helps
  clear bacterial LPS from the brain; whether it binds LPS directly in a defined biochemical sense, and
  how it is secreted without a signal peptide, remain to be established.
