    summary: ND root molecular function annotation. No biochemical activity of RTL6 has been defined.
    action: ACCEPT
    reason: RTL6 forms complexes with LPS in vivo and its extreme basicity suggests electrostatic capture
      of LPS, but no purified-protein binding or other biochemical activity has been reported; the authors
      stress their data are qualitative. Lipopolysaccharide binding is therefore not yet supportable and
      the ND MF statement stands.
