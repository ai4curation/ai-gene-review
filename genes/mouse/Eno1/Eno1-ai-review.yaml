id: P17182
gene_symbol: Eno1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Eno1 encodes mouse alpha-enolase, a broadly expressed Mg2+-dependent
  dimeric enzyme that reversibly converts 2-phosphoglycerate and phosphoenolpyruvate
  in the cytosolic glycolytic and gluconeogenic sequence. Mammalian ENO1 also has
  conserved moonlighting roles as a cell-surface plasminogen receptor and as MBP-1,
  a shorter nuclear c-myc promoter-binding transcriptional repressor, but the
  defining function of the full-length mouse protein is cytosolic phosphopyruvate
  hydratase activity.'
