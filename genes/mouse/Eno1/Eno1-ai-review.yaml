- id: PMID:29581031
  title: IL-7-induced phosphorylation of the adaptor Crk-like and other targets.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: The cached abstract describes IL-7-induced phosphotyrosine
      targets but does not identify Eno1.
- id: PMID:29775581
  title: p300-Mediated Lysine 2-Hydroxyisobutyrylation Regulates Glycolysis.
  findings:
  - statement: Human ENO1 is 2-hydroxyisobutyrylated by p300 on K228 and K281,
      and K281 modification increases ENO1 activity and glycolytic flux.
- id: PMID:30679508
  title: ENOblock inhibits the pathology of diet-induced obesity.
  findings:
  - statement: ENOblock increases enolase nuclear localization and suppresses
      adipogenic, lipid-homeostatic, inflammatory, and gluconeogenic transcriptional
      programs in adipocytes, hepatocytes, and diet-induced-obesity mice.
- id: PMID:3529090
  title: Molecular cloning and nucleotide sequence of a full-length cDNA for human
    alpha enolase.
  findings:
  - statement: Human alpha-enolase cDNA cloning linked the mammalian alpha isozyme
      to the conserved enolase coding sequence that later seeded human-to-mouse
      ENO1 orthology transfers.
- id: PMID:7323947
  title: Confirmational, provisional, and/or regional assignment of 15 enzyme loci
    onto Chinese hamster autosomes 1, 2, and 7.
  findings: []
- id: PMID:9169614
  title: Biochemical characterization of the mouse muscle-specific enolase developmental
    changes in electrophoretic variants and selective binding to other proteins.
  findings:
  - statement: Purified mouse beta-beta enolase binds adjacent glycolytic enzymes,
      and the alpha-alpha isoform shares some of those binding properties.
- id: PMID:9626503
  title: Disruption of murine alpha-enolase by a retroviral gene trap results in
    early embryonic lethality.
  findings:
  - statement: A retroviral gene-trap allele disrupting mouse Eno1 in the first
      intron causes early recessive embryonic lethality.
