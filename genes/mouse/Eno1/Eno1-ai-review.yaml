suggested_questions:
- question: Which RGD rat Eno1 publications seeded the cell-cortex, growth-cone,
    heat-shock-protein-binding, protein-complex-binding, membrane-raft, and synaptic-membrane
    transfers to mouse, and do they identify endogenous Eno1 rather than proteomic
    carry-over from a broad fraction?
- question: Which full-text or supplemental evidence supports direct mouse Eno1
    binding to Six3OS and IL-7-dependent phosphorylation of Eno1?
- question: Does mouse Eno1 produce an MBP-1 isoform with c-myc promoter repression
    comparable to the human isoform, and in which mouse tissues or stress states
    is that isoform detectable?
suggested_experiments:
- description: Use endogenous Eno1 immunoblotting and targeted mass spectrometry
    after cytosol, plasma-membrane, myelin, membrane-raft, and synaptic-membrane
    fractionation with compartment markers to distinguish true peripheral pools
    from soluble glycolytic carry-over.
- description: Assay mouse MBP-1 translation and c-myc promoter occupancy by
    isoform-specific immunoblotting and ChIP in cells with full-length-only or
    MBP-1-deficient Eno1 alleles.
