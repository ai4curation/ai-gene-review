- id: PMID:10082554
  title: Functional domains of c-myc promoter binding protein 1 involved in
    transcriptional repression and cell growth regulation.
  findings:
  - statement: Human MBP-1 contains N- and C-terminal transcriptional repressor
      domains and its leucine-motif mutants lose c-myc repression and fibroblast
      growth suppression.
- id: PMID:11134351
  title: A novel 16-kilodalton cellular protein physically interacts with and antagonizes
    the functional activity of c-myc promoter-binding protein 1.
  findings:
  - statement: Human MIP-2A binds MBP-1, colocalizes with it primarily at a perinuclear
      membrane, and antagonizes MBP-1 repression of the c-myc promoter and growth
      regulation.
- id: PMID:11229603
  title: Fibre-type distribution and subcellular localisation of alpha and beta enolase
    in mouse striated muscle.
  findings:
  - statement: Mouse striated muscle expresses alpha-enolase broadly across fiber
      types and localizes alpha-enolase at the M band, while beta-enolase abundance
      tracks fiber energetic demand and differs in subcellular localization.
- id: PMID:12666133
  title: Inhibition of cell surface mediated plasminogen activation by a monoclonal
    antibody against alpha-Enolase.
  findings:
  - statement: Human leukocyte surface alpha-enolase promotes plasminogen activation
      by tPA and uPA.
- id: PMID:15459207
  title: ERK1/2 regulates intracellular ATP levels through alpha-enolase expression
    in cardiomyocytes exposed to ischemic hypoxia and reoxygenation.
  findings:
  - statement: Rat cardiomyocytes induce alpha-enolase after ischemic hypoxia/reoxygenation;
      alpha-enolase expression restores ATP, reduces cell death, and improves
      contractility.
- id: PMID:17634366
  title: Proteolipid protein is required for transport of sirtuin 2 into CNS myelin.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: The cached text verifies the mouse purified-myelin proteome
      experiment but does not expose a table listing Eno1 peptides or protein IDs.
- id: PMID:17690254
  title: Histone H2B as a functionally important plasminogen receptor on macrophages.
  findings:
  - statement: Alpha-enolase was one of four plasminogen receptors detected at
      the surface of mouse macrophage lines and thioglycollate-induced mouse
      peritoneal macrophages.
- id: PMID:18662986
  title: Glyceroneogenesis is the dominant pathway for triglyceride glycerol synthesis
    in vivo in the rat.
  findings:
  - statement: Rat adipose tissue, skeletal muscle, and liver use glyceroneogenesis
      to supply glycerol 3-phosphate for triglyceride synthesis.
- id: PMID:19433310
  title: Cathepsin X cleaves the C-terminal dipeptide of alpha- and gamma-enolase
    and impairs survival and neuritogenesis of neuronal cells.
  findings: []
- id: PMID:2005901
  title: Cloning and characterization of a human c-myc promoter-binding protein.
  findings:
  - statement: Human MBP-1 was cloned as a c-myc P2 promoter-binding protein and
      represses the c-myc promoter when coexpressed in cells.
- id: PMID:21936910
  title: The long noncoding RNA Six3OS acts in trans to regulate retinal development
    by modulating Six3 activity.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: The full text verifies Six3OS as a scaffold RNA for Ezh2 and
      Eya family proteins but does not mention Eno1 in visible text; a supplemental
      RNA-binding dataset would need to be checked.
- id: PMID:23446454
  title: Disruption of a spermatogenic cell-specific mouse enolase 4 (eno4) gene
    causes sperm structural defects and male infertility.
  findings:
  - statement: Mouse ENO4 supplies most sperm enolase activity, while Eno1 or the
      identical Gm5506 protein may supply the residual activity.
- id: PMID:23512986
  title: Cytosolic proteins lose solubility as amyloid deposits in a transgenic mouse
    model of Alzheimer-type amyloidosis.
  findings: []
- id: PMID:24337748
  title: Guanylate binding protein 1-mediated interaction of T cell antigen receptor
    signaling with the cytoskeleton.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: The cached abstract behind the human ENO1 GTPase-binding transfer
