- id: PMID:12235209
  title: A crucial role for the p110delta subunit of phosphatidylinositol 3-kinase in B cell development
    and activation.
  findings:
  - statement: Native mouse p110δ deficiency impairs BCR signaling and changes B-cell subset development/homeostasis.
    supporting_text: p110delta function is required for BCR-mediated calcium flux, activation of phosphlipaseCgamma2,
      and Bruton's tyrosine kinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native mouse p110δ deficiency impairs BCR signaling and changes B-cell subset development/homeostasis.
- id: PMID:24009720
  title: PI3K p110δ is expressed by gp38(-)CD31(+) and gp38(+)CD31(+) spleen stromal cells and regulates
    their CCL19, CCL21, and LTβR mRNA levels.
  findings:
  - statement: Bone-marrow chimeras distinguish splenic stromal p110δ effects on chemokine expression
      and T-cell organization; antigen challenge uses heat-inactivated Candida, not a fungal-clearance
      assay.
    supporting_text: Lack of p110δ activity in these cell populations correlated with lower LTβR, CCL19
      and CCL21 mRNA levels; these molecules participate in T cell localization to specific spleen areas.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Bone-marrow chimeras distinguish splenic stromal p110δ effects on chemokine expression
      and T-cell organization; antigen challenge uses heat-inactivated Candida, not a fungal-clearance
      assay.
- id: PMID:31915155
  title: PI3Kδ as a Novel Therapeutic Target in Pathological Angiogenesis.
  findings:
  - statement: Mouse oxygen-induced retinopathy supports pathological angiogenesis; the matched cell-mechanistic
      assays use human retinal endothelial cells.
    supporting_text: Using a mouse model of oxygen-induced retinopathy, p110δ inactivation was found to
      attenuate pathological retinal angiogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mouse oxygen-induced retinopathy supports pathological angiogenesis; the matched cell-mechanistic
      assays use human retinal endothelial cells.
