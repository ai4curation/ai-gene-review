id: O35904
gene_symbol: Pik3cd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Mouse Pik3cd encodes p110δ, a class IA phosphoinositide 3-kinase catalytic subunit that
  associates with p85-family regulatory proteins. Its production of PIP3 couples receptor activation to
  BTK, AKT and other membrane-recruited effectors. In B cells, p110δ supports antigen-receptor signaling,
  calcium responses, activation and maintenance of B1 and marginal-zone populations. Its functions extend
  beyond lymphocytes: spleen stromal p110δ affects chemokine expression and lymphoid organization, and
  endothelial p110δ contributes to pathological retinal angiogenesis.'
alternative_products:
- name: 1 (p110-delta)
  id: O35904-1
- name: '2'
  id: O35904-2
  sequence_note: VSP_044411, VSP_044412
existing_annotations:
- term:
    id: GO:0001782
    label: B cell homeostasis
  evidence_type: IMP
  original_reference_id: PMID:12235209
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:2388047
  review:
    summary: p110δ maintains B-cell populations and supports activation after BCR engagement.
    action: KEEP_AS_NON_CORE
    reason: Native p110δ-deficient mice in PMID:12235209 show severe B1 and marginal-zone deficits, altered
      conventional B-cell abundance and impaired BCR signaling. Retain this cellular outcome without treating
      all B-cell subsets or ages as equally dependent.
    supported_by:
    - reference_id: PMID:12235209
      supporting_text: p110delta function is required for BCR-mediated calcium flux, activation of phosphlipaseCgamma2,
        and Bruton's tyrosine kinase.
- term:
    id: GO:0001938
    label: positive regulation of endothelial cell proliferation
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O00329
  review:
    summary: Supported endothelial/angiogenesis context, but non-core and tissue/pathology-specific relative
      to PI3Kdelta immune receptor signaling.
    action: KEEP_AS_NON_CORE
    reason: For mouse Pik3cd, Cultured endothelial-cell work supports VEGF-induced Akt activation, proliferation,
      migration, tube formation, and retinal angiogenesis. This is a real contextual role, not the primary
      leukocyte-enriched core function. The human O00329 evidence supplies a conserved ortholog inference
      where the mouse row is a transfer; it is not relabeled as a native mouse assay.
    supported_by:
    - reference_id: PMID:31915155
      supporting_text: Using genetic and pharmacological approaches, we show that p110δ activity in cultured
        ECs controls Akt activation, cell proliferation, migration, and tube formation induced by vascular
        endothelial growth factor, basic fibroblast growth factor, and epidermal growth factor.
    - reference_id: file:human/PIK3CD/PIK3CD-deep-research-falcon.md
      supporting_text: Many downstream readouts (e.g., pAKT, pS6) are not isoform-specific, and class
        I PI3Ks share overlapping functions; p110δ is leukocyte-enriched but not exclusively expressed,
        so immune-context evidence is strongest for PIK3CD-specific BP claims.
    - reference_id: file:human/PIK3CD/PIK3CD-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Uses ATP and PtdIns(4,5)P2 (phosphatidylinositol 4,5-bisphosphate) to generate
        phosphatidylinositol 3,4,5-trisphosphate (PIP3) (PubMed:15135396).
