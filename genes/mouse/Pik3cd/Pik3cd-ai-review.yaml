  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026315
  review:
    summary: p110δ supports the adaptive response to a fungal-antigen challenge.
    action: MODIFY
    reason: PMID:24009720 uses heat-inactivated Candida antigen and measures splenic T-cell organization/expansion.
      Retain the curated antifungal-response participation as an immune-signaling inference, not evidence
      of direct fungal killing or measured pathogen clearance. The broad defense/organism-response terms
      can be refined to this context.
    supported_by:
    - reference_id: PMID:24009720
      supporting_text: In these mice, spleen CD4(+) and CD8(+) T cell numbers did not increase in response
        to antigen, suggesting that a p110δ(D910A/D910A) stroma defect impedes correct T cell response.
    proposed_replacement_terms:
    - id: GO:0050832
      label: defense response to fungus
- term:
    id: GO:0007166
    label: cell surface receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00029053
  review:
    summary: The broad cell-surface receptor signaling annotation should be narrowed to the immune receptor
      signaling pathways where PIK3CD has strong support.
    action: MODIFY
    reason: For mouse Pik3cd, PIK3CD acts downstream of immune receptors such as BCR, TCR, and CD28. Those
      terms are more informative and better supported than the generic cell-surface receptor signaling
      parent. The human O00329 evidence supplies a conserved ortholog inference where the mouse row is
      a transfer; it is not relabeled as a native mouse assay.
    proposed_replacement_terms:
    - id: GO:0050853
      label: B cell receptor signaling pathway
    - id: GO:0050852
      label: T cell receptor signaling pathway
    - id: GO:0031295
      label: T cell costimulation
    supported_by:
    - reference_id: file:human/PIK3CD/PIK3CD-deep-research-falcon.md
      supporting_text: In immune cells, class IA PI3K (including p110δ) propagates signaling downstream
        of **BCR, TCR, CD28, ICOS, CD19, BAFF-R, CD40** (and related receptor/adaptor systems), framing
        the major immune-cell BP terms relevant for PIK3CD.
    - reference_id: file:human/PIK3CD/PIK3CD-uniprot.txt
      record_section:
