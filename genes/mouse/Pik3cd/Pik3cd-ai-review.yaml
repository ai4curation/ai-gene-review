  review:
    summary: Supported core activated-site localization. PI3Kdelta is recruited to plasma-membrane receptor/adaptor
      complexes where its phosphoinositide substrates reside.
    action: ACCEPT
    reason: For mouse Pik3cd, Membrane recruitment is central to class IA PI3Kdelta activity because PIP2
      substrate is membrane localized and receptor phosphotyrosine signals recruit the p85-p110delta complex
      to the plasma membrane. The human O00329 evidence supplies a conserved ortholog inference where
      the mouse row is a transfer; it is not relabeled as a native mouse assay.
    supported_by:
    - reference_id: file:human/PIK3CD/PIK3CD-deep-research-falcon.md
      supporting_text: Upon receptor phosphotyrosine signaling, SH2-containing p85 recruits the p85-p110δ
        complex to the plasma membrane where phosphoinositide substrates reside.
    - reference_id: Reactome:R-HSA-1676048
      supporting_text: At the plasma membrane, phosphatidylinositol-4,5-bisphosphate 3-kinase catalytic
        subunits form complexes with regulatory subunits.
    - reference_id: file:human/PIK3CD/PIK3CD-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Uses ATP and PtdIns(4,5)P2 (phosphatidylinositol 4,5-bisphosphate) to generate
        phosphatidylinositol 3,4,5-trisphosphate (PIP3) (PubMed:15135396).
