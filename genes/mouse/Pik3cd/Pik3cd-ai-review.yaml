- term:
    id: GO:0048872
    label: homeostasis of number of cells
  evidence_type: IMP
  original_reference_id: PMID:24009720
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:2385596
  review:
    summary: Stromal p110δ affects the number and distribution of splenic lymphocytes.
    action: KEEP_AS_NON_CORE
    reason: The chimeric-mouse analysis in PMID:24009720 resolves a nonhematopoietic contribution to homeostatic
      cell abundance and antigen-driven T-cell expansion. This is distinct from the B-cell-intrinsic role
      of p110δ.
    supported_by:
    - reference_id: PMID:24009720
      supporting_text: Lack of p110δ activity in these cell populations correlated with lower LTβR, CCL19
        and CCL21 mRNA levels; these molecules participate in T cell localization to specific spleen areas.
- term:
    id: GO:0050832
    label: defense response to fungus
  evidence_type: IMP
  original_reference_id: PMID:24009720
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:2385596
  review:
    summary: p110δ supports the adaptive response to a fungal-antigen challenge.
    action: KEEP_AS_NON_CORE
    reason: PMID:24009720 uses heat-inactivated Candida antigen and measures splenic T-cell organization/expansion.
      Retain the curated antifungal-response participation as an immune-signaling inference, not evidence
      of direct fungal killing or measured pathogen clearance. The broad defense/organism-response terms
      can be refined to this context.
    supported_by:
    - reference_id: PMID:24009720
      supporting_text: In these mice, spleen CD4(+) and CD8(+) T cell numbers did not increase in response
        to antigen, suggesting that a p110δ(D910A/D910A) stroma defect impedes correct T cell response.
- term:
