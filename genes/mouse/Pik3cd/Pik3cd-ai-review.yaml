    label: positive regulation of developmental process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027577
  review:
    summary: p110δ supports endothelial growth and angiogenic tissue organization.
    action: MODIFY
    reason: For mouse Pik3cd, Full PMID:31915155 combines human retinal microvascular endothelial perturbation
      with a mouse oxygen-induced retinopathy model. Refine this broad developmental/morphogenetic term
      to the supported positive angiogenesis role; downstream signaling participation is real and does
      not require the kinase to be a structural vessel component. The human O00329 evidence supplies a
      conserved ortholog inference where the mouse row is a transfer; it is not relabeled as a native
      mouse assay.
    supported_by:
    - reference_id: PMID:31915155
      supporting_text: Using genetic and pharmacological approaches, we show that p110δ activity in cultured
        ECs controls Akt activation, cell proliferation, migration, and tube formation induced by vascular
        endothelial growth factor, basic fibroblast growth factor, and epidermal growth factor.
    proposed_replacement_terms:
    - id: GO:0045766
      label: positive regulation of angiogenesis
