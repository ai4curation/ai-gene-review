  qualifier: located_in
  review:
    summary: Activated BCR redistributes into raft-associated fractions.
    action: KEEP_AS_NON_CORE
    reason: The mouse B-cell studies identify Ig-alpha in stimulated GM1-enriched raft fractions. BCR
      translocation can precede signaling and does not require the Ig-alpha/Ig-beta complex in the tested
      constructs (PMID11238609), so raft localization is conditional rather than proof that Ig-alpha drives
      raft formation or signals only there.
    supported_by:
