core_functions:
- description: Provides the Ig-alpha/Ig-beta receptor assembly and signal-transmission component required
    at B-cell developmental checkpoints. Membrane immunoglobulin recognizes antigen; the CD79 cytoplasmic
    motifs recruit signaling enzymes rather than catalyzing phosphorylation.
