id: P11911
gene_symbol: Cd79a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Cd79a encodes Ig-alpha, the ITAM-bearing signaling chain of the B-cell antigen receptor.
  It pairs with Ig-beta and membrane immunoglobulin at the plasma membrane, supporting receptor assembly
  and phosphorylation-dependent recruitment of intracellular effectors. Its cytoplasmic ITAM and non-ITAM
  tyrosines connect receptor engagement to Syk and BLNK-dependent signaling. Mouse developmental and activation
  phenotypes depend on the mutated site and the availability of the Ig-beta tail. Activated receptor also
  enters raft-associated and multivesicular antigen-processing compartments.
