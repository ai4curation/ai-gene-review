  review:
    summary: Receptor-associated signaling supports B-cell developmental checkpoints.
    action: ACCEPT
    reason: Native mouse deficiency arrests maturation at the progenitor stage while preserving V(D)J
      recombination. Ig-alpha ITAM mutation and Ig-beta-tail truncation show context-dependent compensation,
      not dispensability of the receptor signaling module. The proteins do developmental signaling work,
      not DNA recombination.
    supported_by:
    - reference_id: PMID:12097390
    - reference_id: PMID:11514602
