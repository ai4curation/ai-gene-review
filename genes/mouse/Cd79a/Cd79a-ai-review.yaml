- term:
    id: GO:0042100
    label: B cell proliferation
  evidence_type: IMP
  original_reference_id: PMID:16860757
  qualifier: involved_in
  review:
    summary: The Ig-alpha non-ITAM Y204 site supports activation and proliferation in a defined immune
      context.
    action: KEEP_AS_NON_CORE
    reason: Targeted Y204 mutation in mice selectively impairs T-independent BCR-driven activation, proliferation
      and antibody responses, with normal B-cell numbers and several T-dependent functions. The activation
      role is central; proliferation is a downstream physiological output rather than cell-cycle catalysis.
      These results are not generalized to every activation stimulus.
    supported_by:
    - reference_id: PMID:16860757
