  review:
    summary: Ig-alpha provides a phosphorylation-dependent docking platform for the receptor-associated
      Syk kinase.
    action: MODIFY
    reason: The source reconstitutes Syk association and downstream signaling in BCR-expressing mouse
      AtT20 cells. Ig-alpha is a signaling adaptor rather than a kinase. The specific adaptor activity
      describes this role more informatively than bare binding; the reconstitution does not recover every
      B-cell pathway, notably inositol-phosphate production.
    supported_by:
