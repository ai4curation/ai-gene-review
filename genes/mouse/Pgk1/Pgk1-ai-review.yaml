id: P09411
gene_symbol: Pgk1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Pgk1 encodes the mouse X-linked somatic phosphoglycerate kinase 1, a
  broadly expressed soluble enzyme that catalyzes the reversible Mg2+-dependent
  phosphotransfer between 1,3-bisphosphoglycerate/ADP and 3-phosphoglycerate/ATP.
  Its core activity occurs in the cytosol as the phosphoglycerate kinase step of
  lower glycolysis and, in the reverse direction, the gluconeogenic sequence. Like
  human PGK1, mouse Pgk1 is also inferred to have context-specific moonlighting
  activities in secreted plasmin reduction and in hypoxia-induced mitochondrial
  phosphorylation of PDHK1, but these are peripheral to the constitutive
  cytosolic PGK reaction.'
