suggested_questions:
- question: Has the hypoxia-induced mitochondrial protein kinase activity of PGK1 been directly
    assayed with mouse Pgk1 and mouse Pdhk1, or is current mouse curation entirely a transfer
    from human tumor-cell evidence?
- question: Is extracellular Pgk1 secreted by mouse tumor cells as a plasmin disulfide reductase
    in the same way reported for fibrosarcoma PGK, and is that function retained outside tumor
    contexts?
suggested_experiments:
- description: Reconstitute mouse Pgk1 and Pdhk1 in a purified kinase assay and measure PDHK1 Thr338
    phosphorylation to distinguish conserved mouse protein kinase activity from the documented
    human PGK1 moonlighting function.
