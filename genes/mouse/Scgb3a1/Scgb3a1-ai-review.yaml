description: Scgb3a1 (uteroglobin-related protein 2, UGRP2; cytokine HIN-1 / high in normal 1; pneumo secretory protein 2,
  PnSP-2) is a small secreted cytokine-like member of the secretoglobin superfamily and the paralog of Scgb3a2. The mature
  chain follows the secretoglobin fold and forms a disulfide-linked homodimer. It is highly expressed by epithelial cells
  lining the trachea, bronchi and submucosal glands, and by epithelial cells of the uterine glands, with lower expression in
  heart, stomach and intestine; airway expression is a marker of a secretory-cell subset distinct from the Scgb3a2/club-cell
  population. By similarity to the human ortholog (SCGB3A1/HIN-1) it acts as a secreted growth-suppressive cytokine-like
  protein; the human gene is frequently silenced by promoter hypermethylation in breast and other epithelial cancers,
  consistent with a growth-inhibitory role. Its precise molecular activity and receptor remain uncharacterized.
