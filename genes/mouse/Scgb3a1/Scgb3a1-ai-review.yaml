proposed_new_terms: []
suggested_questions:
- question: What is the molecular activity and cognate receptor of SCGB3A1/HIN-1 that mediates its growth-suppressive
    cytokine-like effect?
- question: Is the myoblast-fusion phenotype from the C2C12 RNAi screen reproducible and physiologically relevant, or a
    cell-line screening artefact?
suggested_experiments:
- description: Identify SCGB3A1-binding partners/receptors on epithelial cells (affinity capture or proximity labelling) to
    define a molecular function beyond the current ND annotation.
- description: Test recombinant SCGB3A1 for growth-suppressive activity on normal versus transformed epithelial cells to
    confirm and quantify the cytokine-like activity directly in mouse cells.
