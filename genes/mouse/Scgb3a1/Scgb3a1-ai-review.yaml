core_functions:
- description: Secreted cytokine-like secretoglobin of airway and glandular epithelium with a growth-suppressive role
    attributed by similarity to the human ortholog (HIN-1/SCGB3A1). It localizes to the extracellular space; its specific
    molecular activity and receptor are not yet defined.
