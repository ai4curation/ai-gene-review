    supporting_text: In summary, these results indicate that Pax4, like Arx, is necessary for the proper
      development of GIP, Gastrin and Neurotensin cells in the small intestine while Serotonin-producing
      cells are exclusively Pax4-dependent.
  - reference_id: PMID:22570716
    supporting_text: The strong induction of Arx, both in the small intestine and colon of Pax4 KO mice,
      suggests that Pax4 controls the specification of endocrine subtypes through the repression of Arx.
proposed_new_terms: []
suggested_questions:
- question: >-
    PAINT node placement for PTHR45636. PANTHER 19 separates PAX4 from PAX6 twice below the Euteleostomi
    node PTN002900580: at a Mammalia duplication (PTN000676674) and at a Neopterygii duplication (PTN009180006,
    gar, medaka and zebrafish pax4). Synteny places one origin of Pax4, Pax6 and Pax10 in the 2R duplications
    (PMID:24951566). As a result, the Pax6-seeded IBDs for retina development (GO:0060041) and forebrain
    development (GO:0030900) at PTN002900580, and brain development (GO:0007420) and sensory organ development
    (GO:0007423) at the Bilateria node PTN008693041, all reach PAX4. Should PAINT add IRDs for these terms
    on the PAX4 clades (PTN000676639 in mammals, PTN009180007 in ray-finned fishes) while keeping GO:0003309,
    which both paralogs support? Or should the tree be reconciled so that one Pax4 orthology group branches
    above PTN002900580?
- question: Should the rat Pax4 IEP annotation to retina development in camera-type eye (RGD, PMID:19012751)
    remain a seed for the retina and sensory-organ IBDs, given that its own authors argue the postnatal
    expression timing is against a developmental role?
- question: Does Pax4 have a function in mature retinal photoreceptors and pinealocytes, where rodent and
    zebrafish Pax4 transcripts are found and oscillate diurnally? If so, is it repression of a Pax6-dependent
    progenitor state, as the rat authors speculate, or rhythmic repression of photoreceptor genes, and
    which GO term would capture it?
- question: Is Arx a direct Pax4 target in vivo (enhancer occupancy in E13.5-E15.5 endocrine progenitors),
    and which co-repressors mediate repression by the homeodomain and C-terminal domains?
- question: Why is Pax4 essential for beta-cell development in mouse but not in humans, where complete
    loss causes only transient neonatal diabetes (PMID:40614820)?
suggested_experiments:
- hypothesis: Pax4 has no role in eye or forebrain development, so the inherited IBA terms reflect paralog
    biology only.
  description: Examine Pax4-null embryos and neonates (E12.5-P2, before diabetic lethality) for forebrain
    regionalisation and retinal lamination, using Pax6 target expression as a positive control, alongside
    a photoreceptor-specific conditional Pax4 deletion (Crx-Cre) analysed at P14-P60 by histology, ERG
    and photoreceptor maturation markers.
  experiment_type: conditional knockout phenotyping
- hypothesis: Pax4 directly represses Arx and alpha-cell genes through bipartite sites in endocrine progenitors.
  description: CUT&RUN for epitope-tagged endogenous Pax4 in sorted Neurog3-lineage progenitors at E13.5-E15.5,
    integrated with single-cell RNA-seq of Pax4-null pancreas, and mutation of candidate Arx enhancer sites
    in vivo.
  experiment_type: genome-wide occupancy and enhancer mutagenesis
- hypothesis: Rhythmic Pax4 in photoreceptors and pineal gland drives daily repression of target genes.
  description: Measure Pax4 protein (tagged knock-in) across the light-dark cycle in retina and pineal gland,
    and compare day and night transcriptomes of control and photoreceptor- or pineal-specific Pax4 conditional
    knockouts.
  experiment_type: circadian transcriptomics
knowledge_gaps:
- gap_statement: Whether Pax4 has any function in rodent retinal photoreceptors and pinealocytes, where
    its transcripts appear postnatally and oscillate diurnally, is unknown.
  boundary: Pax4 mRNA is restricted to photoreceptors within the rat retina from P6, peaks at P18-P30 and
    is rhythmic in the adult. Pineal Pax4 is suppressed at night by adrenergic-cAMP signalling. Germline
    nulls die of diabetes within days of birth, and no tissue-specific deletion has been studied.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: It decides whether Pax4 carries any neural or sensory role at all, and with it whether
    the inherited eye terms should be blocked or replaced by a photoreceptor-maintenance term.
  resolution: Photoreceptor- and pineal-specific conditional deletion with day and night transcriptomics
    (see suggested_experiments).
  provenance:
  - reference_id: PMID:19012751
    supporting_text: it remains to be established whether rhythmic Pax4 expression is translated into rhythmic
      changes in Pax4 protein
