  review:
    summary: In an alpha-cell line, Pax4 represses reporters driven by the glucagon or insulin promoter or
      by an isolated Pax4 site. Pax4 fused to the GAL4 DNA-binding domain also represses.
    action: ACCEPT
    reason: Direct reporter assays show that Pax4 represses RNA polymerase II promoters through its own
      binding site, and the GAL4-fusion experiment shows the repression is intrinsic rather than only competition
      with Pax6. This is the core transcriptional output of the protein. The cached text is the abstract
      only, but the abstract alone supports the annotation.
    supported_by:
    - reference_id: PMID:10567552
      supporting_text: When expressed in an alpha-cell line, PAX4 represses transcription through the glucagon
        or insulin promoters or through an isolated PAX4 binding site.
    - reference_id: PMID:10567552
      supporting_text: Repressor activity maps to more than one domain within the molecule, although the
        homeodomain and carboxyl terminus give the strongest repression.
