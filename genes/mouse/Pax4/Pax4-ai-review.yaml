    label: retina development in camera-type eye
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:97490
  - PANTHER:PTN002900580
  - RGD:3258
  - RGD:620433
  - ZFIN:ZDB-GENE-081022-10
  - ZFIN:ZDB-GENE-990415-200
  review:
    summary: Retina development, inherited from the Euteleostomi node PTN002900580. Its seeds in the current
      PAINT file are mouse and rat Pax6, zebrafish pax6a, pax6b and pax10, and rat Pax4 (RGD:620433), whose
      seed annotation is an IEP.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only Pax4 seed is the rat IEP from PMID:19012751. That paper found Pax4 absent from the fetal
      eye and present in photoreceptors only from P6, rising to P18-P30 and staying high in the adult.
      The authors concluded that this timing argues against a developmental role. Mouse Pax4 has no reported
      eye phenotype (germline nulls die within days of birth), and comparative work states that mammalian
      and teleost Pax4 are not implicated in eye development. The node placement is also suspect for the
      reason given on the forebrain row. PANTHER 19 separates PAX4 from PAX6 independently in tetrapods
      and in ray-finned fishes below this node, against the 2R origin. Bgee's mouse eye calls for Pax4
      are neonatal and early-postnatal eyeball and lens samples. The retina-specific calls are absent while
      Pax6 is at the top of its profile there, but these calls are stage-merged, so they show consistency,
      not proof. The row is marked as over-annotated rather than removed because a role in late postnatal
      photoreceptor maturation, which the authors speculate about, has not been tested. The same action
      is used on the rat-derived IEA row for this term.
    supported_by:
    - reference_id: PMID:19012751
      supporting_text: Pax4 expression is not detectable in the foetal eye; however, postnatal Pax4 transcript
        levels rapidly increase.
    - reference_id: PMID:19012751
      supporting_text: The finding that Pax4 expression is highest in the adult argues against a role in
        development, as is the case with Pax6.
    - reference_id: PMID:24951566
      supporting_text: The Pax4 genes of mammals and teleost fishes are not implicated in the development
        of eyes
    - reference_id: file:mouse/Pax4/Pax4-bioinformatics/RESULTS.md
      supporting_text: '| GO:0060041 retina development in camera-type eye | retina | CONSISTENT (UBERON:0010230
        eyeball of camera-type eye (53.9)) | ENRICHED (UBERON:0003902 retinal neural layer (99.5)) |'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN002900580
        source_label: PTN002900580
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Euteleostomi node below which PANTHER 19 splits PAX4 from PAX6 twice (Mammalia PTN000676674,
          Neopterygii PTN009180006), against the 2R origin.
      - source_id: RGD:620433
        source_label: rat Pax4
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The IEP seed is postnatal and adult photoreceptor expression (PMID:19012751), and the authors
          argue against a developmental role.
      - source_id: ZFIN:ZDB-GENE-081022-10
        source_label: zebrafish pax10
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Resolved as pax10 (UniProt I3IT91 cross-reference) and confirmed by the leaf in panther_tree_paths.md.
          Pax10 is a distinct 2R paralog whose adult retinal expression says nothing about Pax4.
      - source_id: MGI:MGI:97490
        source_label: mouse Pax6
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Pax6 is the retinal developmental regulator, and the role belongs to the paralog.
