id: P32115
gene_symbol: Pax4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Pax4 is a vertebrate paired-box transcription factor of the Pax4/6 class. It
  binds DNA through an N-terminal paired domain (PAI and RED subdomains) and a
  paired-type homeodomain, which together recognise a bipartite site of a
  homeodomain half-site and a paired-domain half-site spaced 15 nucleotides
  apart. Unlike its paralog Pax6, it acts mainly as a transcriptional
  repressor, with repression mapped to the homeodomain and the C-terminal
  region. It also has a weak C-terminal transactivation potential. Pax4 is
  expressed transiently in Neurog3-derived endocrine progenitors of the
  embryonic pancreas, peaking around E13.5, and in intestinal enteroendocrine
  progenitors. There it allocates endocrine subtypes by cross-repression with
  the homeodomain factor Arx. Pax4 is required for insulin-producing beta cells
  and somatostatin-producing delta cells and restrains the glucagon-producing
  alpha-cell fate. Null mice lack mature beta and delta cells, have excess
  alpha and ghrelin cells, and die of diabetes within days of birth. Forced
  expression converts endocrine progenitors and mature alpha cells into
  beta-like cells. In the intestine Pax4 is required for serotonin-producing
  enterochromaffin cells and somatostatin-producing D cells and for GIP,
  gastrin and neurotensin cells, while it limits GLP-1-producing L cells. In
  the adult, Pax4 marks a replication-competent, stress-resistant beta-cell
  subpopulation, and gain-of-function studies show it promotes beta-cell
  survival. In rat, Pax4 transcripts are also found in postnatal retinal
  photoreceptors and in the pineal gland, where they oscillate diurnally, and
  zebrafish pax4 is expressed in the retinal outer nuclear layer; no function
  has been shown in these tissues.
