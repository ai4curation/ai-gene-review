  - ZFIN:ZDB-GENE-990415-200
  review:
    summary: Brain development, inherited from the Bilateria node PTN008693041. Its seeds in the PAINT
      file are Drosophila eyeless (FBgn0005558) and twin of eyeless (FBgn0019650), resolved through genes/DROME
      UniProt records, and vertebrate Pax6 genes (mouse, rat, zebrafish pax6a and pax6b). No Pax4 gene is
      a seed.
    action: REMOVE
    reason: >-
      Pax4 descends from PTN008693041 under any topology, so the question is whether the Pax4 lineage
      kept the ancestral neural developmental role. All the evidence says it diverged, and none says it
      kept the role. (1) No study of any Pax4 ortholog reports a brain phenotype or function. The mouse
      null phenotype reported in the literature is confined to pancreatic and intestinal endocrine
      lineages (PMID:9121556, PMID:22570716), and human patients with complete PAX4 loss had no
      extra-pancreatic features (PMID:40614820). (2) Pax4 and Pax6 are not interchangeable where both
      are expressed (PMID:10364449). Pax4 lacks Pax6's activation function and acts mainly as a repressor
      (PMID:10567552). Comparative work describes lineage-specific Pax4 roles against a conserved Pax6
      program (PMID:24951566). (3) Bgee shows Pax4 brain presence. The ENRICHED tier for this term is
      driven by adult Affymetrix hippocampal and cortical samples, and the only embryonic forebrain calls
      come from a single Theiler stage 21 in situ timepoint. Presence of expression does not establish
      a developmental function (projects/BGEEDB_EXPRESSION.md rule 2). Taken together, this is an
      over-propagated IBA. A PAINT loss (IRD) on the Pax4 clades, rather than on the node, is the appropriate
      fix (see suggested_questions).
    supported_by:
    - reference_id: PMID:40614820
      supporting_text: No extra pancreatic features were reported in either patient.
    - reference_id: PMID:10364449
      supporting_text: The gene-targeting experiments revealed that Pax-4 and Pax-6 cannot substitute for
        each other in tissue with overlapping expression of both genes.
    - reference_id: PMID:24951566
      supporting_text: This indicates evolutionarily conserved roles of Pax6 and lineage-specific differences
        in the roles of Pax4 during pancreas development among vertebrates.
    - reference_id: file:mouse/Pax4/Pax4-bioinformatics/RESULTS.md
      supporting_text: '| Pax4 | entorhinal cortex | 8-week-old stage (mouse) | 75.5 | 79.0 | Affymetrix |'
    - reference_id: file:mouse/Pax4/Pax4-deep-research-claude-code.md
      supporting_text: The eye and brain development terms reflect PAX6 and other members, and no mouse Pax4
        data support them.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008693041
        source_label: PTN008693041
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Bilateria speciation node seeded by Drosophila ey and toy and by vertebrate Pax6 genes. Pax4 descends
          from it, but PANTHER 19 splits Pax4 into a mammalian clade (PTN000676639) and a ray-finned-fish
          clade (PTN009180007) (Pax4-bioinformatics/panther_tree_paths.md), so blocking the term needs
          an IRD on each.
      - source_id: MGI:MGI:97490
        source_label: mouse Pax6
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
