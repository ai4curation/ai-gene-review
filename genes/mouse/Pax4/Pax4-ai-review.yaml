- term:
    id: GO:7770019
    label: negative regulation of enteroendocrine cell differentiation
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O43316
  review:
    summary: Transferred from human PAX4 (IDA, PMID:37883554, human small-intestinal organoids).
    action: ACCEPT
    reason: >-
      Pax4 suppresses particular enteroendocrine fates by repressing Arx. Pax4-null mouse intestine has
      excess GLP-1 L cells and ghrelin cells, together with Arx up-regulation. In the pancreas, whose endocrine
      cells GO classes as enteroendocrine, Pax4 restrains the alpha-cell fate. This is subtype-selective
      negative regulation within a program that Pax4 also drives positively (enterochromaffin and D cells).
      The term is correct and part of the core fate-allocation mechanism.
    supported_by:
