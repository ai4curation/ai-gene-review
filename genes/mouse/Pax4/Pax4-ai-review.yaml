core_functions:
- description: Pax4 is a sequence-specific RNA polymerase II transcriptional repressor. It binds a bipartite
    paired-domain and homeodomain site in islet hormone gene promoters and in its antagonist Arx, and represses
    them through repression domains in the homeodomain and C-terminal region, independently of competition
    with Pax6.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0000785
    label: chromatin
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:10567552
    supporting_text: This repression is not simply due to competition with the PAX6 transcriptional activator
      for the same binding site, since PAX4 fused to the unrelated yeast GAL4 DNA binding domain also represses
      transcription through the GAL4 binding site in the alpha-cell line
  - reference_id: PMID:10891400
    supporting_text: stable expression of Pax4 in a rat glucagon-producing cell line inhibits the endogenously
      expressed glucagon gene completely
  - reference_id: PMID:15930104
    supporting_text: both Arx and Pax4 act as transcriptional repressors that control the expression level
      of one another
- description: In Neurog3-derived pancreatic endocrine progenitors, Pax4 allocates the beta (and delta)
    cell fate and restrains the alpha-cell fate by cross-repression with Arx. It is required for beta-cell
    differentiation and is sufficient to convert progenitors and alpha cells into beta-like cells.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0003309
    label: type B pancreatic cell differentiation
  - id: GO:7770019
    label: negative regulation of enteroendocrine cell differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:9121556
    supporting_text: Inactivation of Pax4 by homologous recombination results in the absence of mature insulin-
      and somatostatin-producing cells (beta and delta, respectively) in the pancreas of Pax4 homozygous
      mutant mice, but glucagon-producing alpha cells are present in considerably higher numbers.
  - reference_id: PMID:19665969
    supporting_text: Pax4 forces endocrine precursor cells, as well as mature alpha cells, to adopt a beta
      cell destiny
  - reference_id: PMID:14561778
    supporting_text: Our study indicates a requirement of Arx for alpha-cell fate acquisition and a repressive
      action on beta-and delta-cell destiny, which is exactly the opposite of the action of Pax4 in endocrine
      commitment.
- description: In intestinal enteroendocrine progenitors, Pax4 is required for serotonin-producing enterochromaffin
    cells and somatostatin D cells (and, together with Arx, for GIP, gastrin and neurotensin cells). Through
    repression of Arx it limits GLP-1-producing L cells.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
