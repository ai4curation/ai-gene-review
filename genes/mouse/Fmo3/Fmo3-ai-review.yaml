- id: PMID:9344459
  title: 'Molecular cloning, sequencing, and expression in Escherichia coli of mouse
    flavin-containing monooxygenase 3 (FMO3): comparison with the human isoform.'
  findings:
  - statement: Mouse Fmo3 is a 534-amino-acid enzyme sharing 79% sequence identity
      with human FMO3, containing conserved FAD and NADP+ pyrophosphate binding sites
      starting at positions 9 and 191, and catalyzing methimazole oxidation that is
      inhibited by trimethylamine, thioacetamide, thiourea, thiobenzamide, and N,N-dimethylaniline.
    supporting_text: The derived protein sequence consisted of 534 amino acids including
      the putative flavin adenine dinucleotide and NADP+ pyrophosphate binding sites
      (characteristic of mammalian FMOs) starting at positions 9 and 191, respectively.
      The mouse FMO3 protein sequence was 79 and 82% identical to the human and rabbit
      FMO3 sequences, respectively.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Recombinant mouse and human FMO3 exhibit high catalytic activity toward
      methimazole that is inhibited >85% by trimethylamine and thioacetamide and also
      inhibited by thiourea, thiobenzamide, and N,N-dimethylaniline; mouse Fmo3 is
      expressed in female liver and in male and female lung, but not in male liver
      or kidney.
    supporting_text: Catalytic activities of mouse and human FMO3 were high toward
      the substrate methimazole; however, in the presence of trimethylamine and thioacetamide,
      FMO-dependent methimazole oxidation by both enzymes was reduced by greater than
      85%. Other substrates which inhibited methimazole oxidation were thiourea and
      thiobenzamide and to a lesser degree N,N-dimethylaniline. When probed with mouse
      FMO3 cDNA, FMO3 transcripts were detected in hepatic mRNA samples from female
      mice, but not in samples from males.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
- id: PMID:23177478
  title: Synchronous evolution of an odor biosynthesis pathway and behavioral response.
  findings:
  - statement: Hepatic Fmo3 oxidizes gut-microbiota-derived trimethylamine to trimethylamine
      N-oxide in female mice, whereas adult male Mus musculus transcriptionally repress
      hepatic Fmo3 by >1,000-fold, leading to abundant urinary trimethylamine excretion
      while urinary taurine and creatine levels remain equal between sexes.
    supporting_text: Comparative NMR spectroscopy of male and female mouse urine also
      identified a second related chemical produced with opposing sex dependence.
      Based on analysis of spiked specimens, this female-enriched chemical was trimethylamine
      oxide, a chemical in the same biosynthetic pathway as trimethylamine [15]. The
      levels of other major metabolites, including creatine and taurine, were similar
      between males and females.
    full_text_unavailable: false
    reference_section_type: RESULTS
  - statement: Quantitative RT-PCR of mouse liver cDNA shows >1,000-fold higher Fmo3
      expression in adult female liver than in adult male liver, with male-specific
      silencing emerging at 4-5 weeks of age.
    supporting_text: Consistent with previous results [16], we observed a striking
      >1,000-fold elevation of Fmo3 gene expression in adult females compared to adult
      males. Male-specific silencing of Fmo3 gene expression is discernible between
      4 and 5 weeks of age, matching the time course of trimethylamine appearance
      in male urine [10].
    full_text_unavailable: false
    reference_section_type: RESULTS
- id: PMID:29981269
  title: Flavin monooxygenase 3, the host hepatic enzyme in the metaorganismal trimethylamine
    N-oxide-generating pathway, modulates platelet responsiveness and thrombosis risk.
  findings:
  - statement: Antisense oligonucleotide suppression or transgenic overexpression
      of Fmo3 in mice directly alters systemic TMAO levels, platelet responsiveness,
      and in vivo carotid artery thrombus formation rate.
    supporting_text: The impact of FMO3 suppression (antisense oligonucleotide-targeting)
      and overexpression (as transgene) on plasma TMAO levels, platelet responsiveness
      and thrombosis potential was examined using a murine FeCl3 -induced carotid
      artery injury model. Cecal microbial composition was examined using 16S analyses.
      Results Modulation of FMO3 directly impacts systemic TMAO levels, platelet responsiveness
      and rate of thrombus formation in vivo.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
- id: PMID:32156684
  title: Flavin-Containing Monooxygenase 1 Catalyzes the Production of Taurine from
    Hypotaurine.
  findings:
  - statement: FMO1 (Fmo1) is the primary physiological hypotaurine monooxygenase
      that produces taurine from hypotaurine in vivo and in vitro.
    supporting_text: Here we show, both in vivo and in vitro, that the enzyme that
      oxygenates hypotaurine to produce taurine is flavin-containing monooxygenase
      (FMO) 1. Metabolite analysis of the urine of Fmo1-null mice by 1H NMR spectroscopy
      revealed a buildup of hypotaurine and a deficit of taurine in comparison with
      the concentrations of these compounds in the urine of wild-type mice.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
