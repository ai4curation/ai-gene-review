    reason: >-
      Human FMO3 (UniProtKB:P31513) is the direct 1:1 ortholog of mouse Fmo3, and
      both enzymes catalyze NADPH-dependent oxygenation of N,N-dimethylaniline
      and tertiary/secondary amine xenobiotics (PMID:9344459). Retained as
      non-core for consistency with human FMO3
      (file:human/FMO3/FMO3-ai-review.yaml), where GO:0034899 (trimethylamine
      monooxygenase activity) is the core physiological activity.
    supported_by:
    - reference_id: PMID:9344459
      supporting_text: Catalytic activities of mouse and human FMO3 were high toward
        the substrate methimazole; however, in the presence of trimethylamine and
        thioacetamide, FMO-dependent methimazole oxidation by both enzymes was reduced
        by greater than 85%. Other substrates which inhibited methimazole oxidation
        were thiourea and thiobenzamide and to a lesser degree N,N-dimethylaniline.
