id: P97501
gene_symbol: Fmo3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Flavin-containing monooxygenase 3 (Fmo3; dimethylaniline monooxygenase
  [N-oxide-forming] 3) is a mammalian endoplasmic reticulum membrane-anchored
  FAD- and NADPH-dependent monooxygenase (534 aa) that catalyzes the N- and
  S-oxygenation of nucleophilic heteroatom-containing compounds, most notably the
  conversion of gut-microbiota-derived trimethylamine (TMA) into odorless
  trimethylamine N-oxide (TMAO). Anchored to the cytoplasmic face of the hepatic
  and pulmonary endoplasmic reticulum membrane via a C-terminal single-pass
  transmembrane helix (residues 514-534), Fmo3 uses NADPH and O2 to form a
  C4a-hydroperoxyflavin intermediate that oxygenates TMA as well as tertiary
  amine and sulfide xenobiotics including N,N-dimethylaniline, methimazole,
  thioacetamide, thiourea, and thiobenzamide. In Mus musculus, hepatic Fmo3
  expression is strongly sexually dimorphic: it is abundantly expressed in adult
  female liver, where it converts portal TMA to circulating TMAO (modulating
  platelet responsiveness and thrombosis risk), but is transcriptionally repressed
  by testosterone in adult male liver (>1,000-fold reduction), resulting in
  abundant urinary excretion of unoxidized TMA in males as a TAAR5-dependent
  species-specific olfactory chemosignal.
