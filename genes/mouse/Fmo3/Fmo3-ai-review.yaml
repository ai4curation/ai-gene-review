core_functions:
- description: >-
    Catalyzes the NADPH- and O2-dependent N-oxygenation of gut-microbiota-derived
    trimethylamine (TMA) into odorless trimethylamine N-oxide (TMAO) at the
    endoplasmic reticulum membrane of female mouse hepatocytes, regulating
    both systemic circulating TMAO levels (and associated platelet thrombosis
    potential) and—via male-specific hepatic transcriptional repression—the
    sexually dimorphic urinary excretion of volatile TMA as a TAAR5-activating
    social chemosignal.
  molecular_function:
    id: GO:0034899
    label: trimethylamine monooxygenase activity
  directly_involved_in:
  - id: GO:0006805
    label: xenobiotic metabolic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:23177478
    supporting_text: The two-step trimethylamine biosynthesis pathway involves synergy
      between commensal microflora and a sex-dependent liver enzyme, flavin-containing
      monooxygenase 3 (FMO3), which oxidizes trimethylamine. One key evolutionary
      alteration in this pathway is the recent acquisition in Mus of male-specific
      Fmo3 gene repression.
  - reference_id: PMID:29981269
    supporting_text: Modulation of FMO3 directly impacts systemic TMAO levels, platelet
      responsiveness and rate of thrombus formation in vivo.
proposed_new_terms: []
suggested_questions:
- question: >-
    What cis-regulatory elements and androgen-receptor corepressor complexes
    mediate the >1,000-fold pubertal silencing of hepatic Fmo3 specifically in
    the Eurasian Mus clade (Mus spretus, Mus domesticus, Mus musculus) while
    sparing pulmonary Fmo3 expression in males?
  experts:
  - Stephen D. Liberles
  - Stanley L. Hazen
  - J. Mark Brown
suggested_experiments:
- description: >-
    Perform hepatocyte-specific ATAC-seq and ChIP-seq for androgen receptor (AR),
    STAT5b, and H3K27me3 across the Fmo3 locus in male vs female Mus musculus and
    Mus caroli livers across pubertal development (3 to 6 weeks of age).
  hypothesis: >-
    Lineage-specific androgen response elements or growth-hormone/STAT5b
    pulsatility-sensitive enhancers acquired after divergence from Mus caroli
    recruit repressive chromatin complexes to the hepatic Fmo3 promoter in male
    mice at puberty.
  experiment_type: Comparative ChIP-seq, ATAC-seq, and enhancer reporter assays
