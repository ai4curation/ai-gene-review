suggested_questions:
- question: >-
    Do the two murine alpha-s2-like caseins (gamma-casein, Csn1s2a, and
    epsilon-casein, Csn1s2b) differ in phosphorylation level, calcium phosphate
    binding or micelle contribution, or are they functionally redundant?
- question: >-
    Should GO provide a calcium phosphate (nanocluster) sequestering activity term
    for calcium-sensitive caseins, which are currently best approximated by calcium
    ion sequestering activity?
suggested_experiments:
- description: >-
    Generate Csn1s2a knockout (or Csn1s2a/Csn1s2b double knockout) mice and measure
    milk calcium/phosphate content, micelle size and pup growth, by analogy with the
    alpha- and beta-casein knockouts.
