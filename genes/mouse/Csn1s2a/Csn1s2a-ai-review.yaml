  label: Mus musculus
description: >-
  Alpha-S2-casein-like A (mouse gamma-casein) is a secreted, phosphorylated,
  calcium-sensitive casein expressed in the lactating mammary epithelium and one of
  the major proteins of mouse milk. It is the murine counterpart of ruminant
  alpha-s2-casein; mice carry two alpha-s2-like genes (Csn1s2a and Csn1s2b).
  Its N-terminal phosphoserine cluster forms a phosphate centre that, like those of
  alpha- and beta-casein, binds amorphous calcium phosphate, so that gamma-casein
  contributes to the calcium phosphate-carrying casein micelles of milk and, after
  digestion, to the amino acid supply of the young.
