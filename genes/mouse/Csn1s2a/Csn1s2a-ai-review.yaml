- term:
    id: GO:0045735
    label: nutrient reservoir activity
  evidence_type: TAS
  original_reference_id: PMID:21789179
  review:
    summary: >-
      Gamma-casein is one of the three most prominent proteins of mouse milk, with mRNA
      levels similar to beta-casein, and as part of the casein micelle it is a store of
      amino acids (and bound calcium phosphate) for the suckling young.
    action: NEW
    reason: >-
      The claim rests on two verified points. Abundance: gamma-casein is one of the three
      most prominent milk proteins in the alpha-casein knockout study (PMID:21789179) and
      its mRNA is as abundant as beta-casein mRNA in lactating gland (PMID:12427545).
      Function as an amino-acid supply: the casein micelle is a carrier of amino acids,
      calcium and phosphorus for the young (PMID:22436214; the mouse kappa-casein knockout paper, PMID:16698927, calls micelles a primary source of amino acids and calcium phosphate to neonates), which is the nutrient
      reservoir role annotated by MGI to mouse alpha- and beta-casein from the same study.
      There is no gamma-casein knockout, so the amino-acid supply is inferred from its
      membership of the micelle and its abundance, not shown for gamma-casein alone.
      It is treated as core here, as for mouse Csn1s1 and Csn2, because gamma-casein is a
      major casein whose bulk is the nutrient store; mouse Csn3 keeps the same term
      non-core because kappa-casein is the least abundant casein and its distinctive,
      essential role is micelle stabilization rather than storage.
    supported_by:
    - reference_id: PMID:21789179
      supporting_text: Milk from control animals displayed a series of protein bands, with the most prominent proteins corresponding to molecular weights previously observed for α-, β- and γ-casein
    - reference_id: PMID:12427545
      supporting_text: mRNA levels of gamma- and beta-casein are similar in lactating mammary tissue.
    - reference_id: PMID:22436214
      supporting_text: by evolving into large, complex casein micelles, they took on an important role in transport of amino acids, calcium and phosphorus
    - reference_id: PMID:21789179
      supporting_text: Milk is a hallmark of mammals, providing the primary source of nutrition for their young until weaning.
    - reference_id: PMID:16698927
      supporting_text: "Milk casein micelles are a primary source of amino acids and calcium phosphate to neonates."
