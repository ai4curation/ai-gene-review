  review:
    summary: >-
      Gamma-casein carries phosphoserine clusters (phosphate centres) that sequester
      amorphous calcium phosphate, as do the other calcium-sensitive caseins.
    action: NEW
    reason: >-
      Calcium phosphate sequestration is the defining activity of the calcium-sensitive
      caseins and is stated for mouse gamma-casein; its N-terminal phosphoserines are
      experimentally established. Calcium ion sequestering activity is used as the
      closest GO term; the sequestered species is calcium phosphate nanoclusters.
    supported_by:
