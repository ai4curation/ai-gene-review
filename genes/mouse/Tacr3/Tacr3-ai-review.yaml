  review:
    summary: >-
      Transferred from rat Tacr3, where an NK3R antagonist delayed vaginal opening as a marker
      of puberty. Mouse loss-of-function data contradict the transferred claim.
    action: REMOVE
    reason: >-
      Two independent reasons, and together they make the claim unlikely to be correct for the
      mouse gene. First, role: the donor study used vaginal opening and first oestrus as
      readouts of centrally driven pubertal timing (PMID:24863620), and the receptor acts in
      the hypothalamus on the GnRH pulse generator, so this is not participation in vaginal
      morphogenesis - the reading the human review called over-annotation. Second, and specific
      to mouse, the transferred claim is contradicted by the null's own phenotype: Tacr3-null
      mice reach the sexual-maturation markers on time (PMID:22253416), and even mice lacking
      all tachykinin ligands open the vagina on schedule (PMID:32512561). Removal does not
      question the rat observation or the receptor's role in pubertal timing, which is carried
      by GO:0033686.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
