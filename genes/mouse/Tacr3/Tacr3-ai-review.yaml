- id: file:mouse/Tacr3/Tacr3-uniprot.txt
  title: UniProtKB entry P47937 (NK3R_MOUSE), Neuromedin-K receptor
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The FUNCTION paragraph carries ECO:0000250|UniProtKB:P16177, i.e. it is inferred
      from the rat receptor, and the SUBCELLULAR LOCATION carries
      ECO:0000250|UniProtKB:P29371, inferred from human. Quoted here as UniProt's
      curated inference, with the mouse-specific pharmacology cited separately.
- id: PMID:11226387
  title: Molecular and pharmacological characterization of the murine tachykinin NK(3) receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The defining study of the mouse receptor: full-length cDNA from mouse brain, 452
      residues, 96%/86% identity to rat/human, and agonist binding and calcium-mobilisation
      potencies in HEK293 cells similar to the human receptor. Also the source of the
      10-100-fold lower affinity of NK3R-selective non-peptide antagonists for the mouse
      receptor. Abstract-only cache.
- id: PMID:19426690
  title: Characterization of species-related differences in the pharmacology of tachykinin NK receptors 1, 2 and 3.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cloned human, dog, gerbil and rat NK receptors in CHO cells; two residues near the
      NK3R antagonist site account for reduced rodent antagonist potency. Cited only for the
      species caveat; the mouse receptor itself was not among those cloned here.
      Abstract-only.
- id: PMID:1662278
  title: Characterization of ligand-binding properties and selectivities of three rat tachykinin receptors by transfection and functional expression of their cloned cDNAs in mammalian cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Rat tachykinin receptors expressed in COS cells; establishes senktide as a selective,
      potent neuromedin-K receptor agonist, which is what licenses the senktide experiments
      cited throughout. Abstract-only.
- id: PMID:1370820
  title: Direct linkage of three tachykinin receptors to stimulation of both phosphatidylinositol hydrolysis and cyclic AMP cascades in transfected Chinese hamster ovary cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Rat tachykinin receptors in CHO cells; phosphatidylinositol hydrolysis plus a less
      efficient cAMP output. The donor evidence behind the mouse adenylate-cyclase rows.
      Abstract-only.
- id: PMID:27549338
  title: High-frequency stimulation-induced peptide release synchronizes arcuate kisspeptin neurons and excites GnRH neurons.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Mouse arcuate Kiss1 neurons: optogenetically released endogenous NKB evokes a slow
      EPSP that an NK3R antagonist blocks, senktide occludes and a GDP analogue abolishes,
      identifying the Gq-coupled receptor as the mediator in its native cells. The strongest
      mouse evidence for the phospholipase C-activating pathway. Full text available.
- id: PMID:21914775
  title: Regulation of NKB pathways and their roles in the control of Kiss1 neurons in the arcuate nucleus of the male mouse.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Mouse arcuate KNDy neurons express Tacr3 while GnRH neurons do not, and senktide
      stimulates gonadotropin secretion and activates KNDy but not GnRH neurons. Abstract-only.
- id: PMID:23744641
  title: Neurokinin B activates arcuate kisspeptin neurons through multiple tachykinin receptors in the male mouse.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Senktide excites about 95% of mouse arcuate kisspeptin neurons, but endogenous NKB
      activation is only fully blocked by antagonists against all three tachykinin
      receptors; an important limit on attributing the whole NKB effect to NK3R.
      Abstract-only.
- id: PMID:23744642
  title: "Regulation of arcuate neurons coexpressing kisspeptin, neurokinin B, and dynorphin by modulators of neurokinin 3 and κ-opioid receptors in adult male mice."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Targeted recordings of identified mouse KNDy neurons: the NK3R agonist senktide
      increases firing, dynorphin suppresses it, and both effects are modulated by gonadal
      steroids. Abstract-only.
- id: PMID:19776272
  title: Regulation of gonadotropin-releasing hormone secretion by kisspeptin/dynorphin/neurokinin B neurons in the arcuate nucleus of the mouse.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Mouse arcuate Kiss1 neurons co-express NKB, dynorphin and the NKB receptor gene, and
      expression of all of them is inhibited by oestradiol; the autosynaptic KNDy model.
      Abstract-only.
- id: PMID:22253416
  title: 'Uncovering novel reproductive defects in neurokinin B receptor null mice: closing the gap between mice and men.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The phenotyping study of Tacr3-null mice: normal timing of sexual maturation markers,
      but smaller testes and lower FSH in males, lower uterine weights and abnormal oestrous
      cyclicity in females, absent corpora lutea in about half, and subfertility despite
      achieved fertility. The reference for both the mouse requirement and its mildness
      relative to human. Abstract-only.
- id: PMID:33839770
  title: Characterization of the Action of Tachykinin Signaling on Pulsatile LH Secretion in Male Mice.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Intact Tacr3-knockout males show increased basal LH pulse frequency and amplitude,
      while senktide raises basal LH release in wild-type males. Cited for the sign caveat on
      the LH-secretion row rather than against it. Abstract-only.
- id: PMID:32512561
  title: Tachykinin Signaling Is Required for Induction of the Preovulatory Luteinizing Hormone Surge and Normal Luteinizing Hormone Pulses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      An NK3R antagonist alone blocks the oestradiol-induced LH surge in female mice, and
      mice lacking all tachykinin ligands are far more severely affected than any single
      knockout, which is the evidence for redundancy among the tachykinin systems. Also
      records normal vaginal opening in Tac1/Tac2 double knockouts. Full text available.
- id: PMID:30565563
  title: NKB signaling in the posterodorsal medial amygdala stimulates gonadotropin release in a kisspeptin-independent manner in female mice.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      A second, kisspeptin-independent NK3R site for LH stimulation in the mouse
      posterodorsal medial amygdala, with the direction of the NKB effect dependent on
      oestradiol. Antibody specificity was shown against NK3R-knockout tissue, which also
      supports the receptor's neuronal localisation. Full text available.
- id: PMID:28531316
  title: A Comprehensive Method To Quantify Adaptations by Male and Female Mice With Hot Flashes Induced by the Neurokinin B Receptor Agonist Senktide.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Senktide given to unrestrained mice produces a fall in core temperature, cold-seeking
      behaviour, a rise in tail skin temperature and Fos induction in the median preoptic
      area. The direct mouse evidence behind the temperature-homeostasis row. Abstract-only.
- id: PMID:30753503
  title: Glutamatergic Neurokinin 3 Receptor Neurons in the Median Preoptic Nucleus Modulate Heat-Defense Pathways in Female Mice.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Tacr3-EGFP reporter mice: ablating median preoptic NK3R neurons raises core
      temperature, those neurons are 94% glutamatergic, and they are not warm-sensitive.
      Identifies the mouse population through which the receptor acts on heat defence.
      Abstract-only.
- id: PMID:29996088
  title: A Neural Circuit Underlying the Generation of Hot Flushes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Activating mouse arcuate Kiss1 neurons, or just their preoptic terminals, evokes a
      flush-like tail-skin temperature rise that preoptic infusion of neurokinin receptor
      antagonists prevents. The antagonist cocktail covered all three receptors, so this
      supports the circuit rather than NK3R specifically. Full text available.
- id: PMID:17558564
  title: Disruption of the neurokinin-3 receptor (NK3) in mice leads to cognitive deficits.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      NK3-knockout mice show deficits in passive avoidance, conditioned avoidance
      acquisition and the Morris water maze, with normal locomotion, plus maze, forced swim
      and hot plate. Recorded as a lead; no learning or memory annotation is proposed from
      it here (see the gene notes). Abstract-only.
- id: PMID:18690106
  title: Characterization of behavioral response to amphetamine, tyrosine hydroxylase levels, and dopamine receptor levels in neurokinin 3 receptor knockout mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      An independent NK3-receptor knockout line: senktide responsivity of presumed
      dopaminergic neurons is lost, confirming the agonist acts through this receptor in
      mouse, and small decreases in striatal D1 binding and olfactory-tubercle tyrosine
      hydroxylase are reported with the authors' own hedge about their robustness.
      Abstract-only.
- id: PMID:15501700
  title: Tachykinin NK3-receptor deficiency does not inhibit pulmonary eosinophilia in allergic mice.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      A negative result worth recording: allergic pulmonary inflammation is unchanged in
      NK3-receptor-deficient mice. Supports no annotation. Abstract-only.
- id: PMID:15647454
  title: Functional and molecular characterization of tachykinins and tachykinin receptors in the mouse uterus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      In the mouse uterus NK1R predominates in the non-pregnant animal and NK2R in late
      pregnancy, while Tacr3 is expressed in quantity only in dioestrus and its
      physiological significance is left open. The basis for treating the transferred rat
      uterine-contraction rows as over-annotation in mouse. Abstract-only.
- id: PMID:19627578
  title: Ovarian steroids regulate tachykinin and tachykinin receptor gene expression in the mouse uterus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Oestradiol strongly reduces uterine Tacr3 expression in ovariectomised mice, mainly
      through ERalpha. Mouse-specific but of the same kind as the rat donor evidence: the
      receptor is a target of oestradiol-dependent regulation. Full text available.
- id: PMID:12773411
  title: A role for tachykinins in female mouse and rat reproductive function.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Tachykinin and tachykinin-receptor transcripts across mouse reproductive cells; in
      mouse sperm only an NK2-receptor transcript was detected. The one mouse experiment
      bearing on the transferred sperm rows. Abstract-only.
- id: PMID:17437961
  title: A role for tachykinins in the regulation of human sperm motility.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The human study that seeds the sperm-midpiece and sperm-motility PANTHER node:
      tachykinin receptor proteins detected on human spermatozoa and tachykinin-stimulated
      progressive motility partly blocked by an NK3-selective antagonist. Sound for human;
      the species transfer is what this review questions. Abstract-only.
- id: PMID:2471579
  title: Cardiovascular roles of tachykinin peptides in the nucleus tractus solitarii of rats.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Rat nucleus tractus solitarii senktide microinjection causes hypertension and
      tachycardia; the donor evidence for the heart-rate row. Agonist pharmacology in rat
      with no mouse counterpart. Abstract-only.
- id: PMID:2478257
  title: 'Central pressor actions of neurokinin B: increases in neurokinin B contents in discrete nuclei in spontaneously hypertensive rats.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Intracerebroventricular senktide and neurokinin B raise blood pressure in rats; the
      donor evidence for the blood-pressure row. Abstract-only.
- id: PMID:8574643
  title: Neurokinin-3 receptors modulate dopamine cell function and alter the effects of 6-hydroxydopamine.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Continuous intranigral senktide increases striatal dopamine metabolism in rat; the
      donor evidence for the dopamine row, which mouse knockout data partly corroborate.
      Abstract-only.
- id: PMID:17445241
  title: Neurokinin 3 receptor activation potentiates the psychomotor and nucleus accumbens dopamine response to cocaine, but not its place conditioning effects.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Rat senktide potentiates cocaine-induced hyperactivity; the donor evidence for the
      response-to-cocaine row. Abstract-only.
- id: PMID:9392836
  title: Stimulation of tachykinin NK-3 receptors in the nucleus basalis magnocellularis reduces alcohol intake in rats.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Rat NK-3 agonists reduce ethanol intake in alcohol-preferring rats; donor evidence for
      the drinking-behaviour row. Abstract-only.
- id: PMID:2462199
  title: The tachykinin NH2-senktide, a selective neurokinin B receptor agonist, is a very potent inhibitor of salt appetite in the rat.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Rat senktide inhibits sodium-depletion-induced salt appetite; donor evidence for the
      feeding-behaviour row. Abstract-only.
- id: PMID:9802842
  title: Mechanism of action for reduction of ethanol intake in rats by the tachykinin NK-3 receptor agonist aminosenktide.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Intracerebroventricular aminosenktide evokes conditioned place preference in rats;
      donor evidence for the conditioned-place-preference row. Abstract-only.
- id: PMID:10342838
  title: 'Tachykinin receptor and neutral endopeptidase gene expression in the rat uterus: characterization and regulation in response to ovarian steroid treatment.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Uterine NK3R mRNA falls 15-fold with oestradiol in rat; part of the donor basis for
      the response-to-oestradiol row, and an expression-level observation rather than a
      process the receptor executes. Abstract-only.
- id: PMID:12390879
  title: Estrogen-dependent regulation of neurokinin 3 receptor-mediated uterine contractility in the rat.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Senktide contracts isolated rat uterus and oestrogen modulates the response; sound rat
      evidence, but the mouse uterus is dominated by NK1R and NK2R, so this does not
      transfer. Abstract-only.
- id: PMID:24863620
  title: Neurokinin B receptor antagonism decreases luteinising hormone pulse frequency and amplitude and delays puberty onset in the female rat.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Central NK3R antagonism in the rat lowers LH pulse frequency and amplitude and delays
      vaginal opening and first oestrus as puberty markers. Supports the LH role; the vaginal
      readout is what the vagina-development annotation misreads. Abstract-only.
- id: PMID:16357093
  title: Agonist and hypertonic saline-induced trafficking of the NK3-receptors on vasopressin neurons within the paraventricular nucleus of the hypothalamus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Rat hypothalamus: NK3R is membrane-bound on vasopressin neurons and internalises after
      senktide. Donor evidence for the neuronal cell-body and dendrite membrane rows.
      Abstract-only.
- id: PMID:8788251
  title: Localization of the neuromedin K receptor (NK3) in the central nervous system of the rat.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Rat CNS immunolocalisation of NK3R on neuronal cell bodies and dendrites across many
      nuclei; donor evidence for the somatodendritic rows. Abstract-only.
- id: PMID:9295096
  title: Immunoelectron microscopic localization of NK-3 receptor in the rat spinal cord.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Rat spinal cord immunoelectron microscopy places NK3R on dendritic spines, preterminal
      axons and axon terminals; donor evidence for the spine and axon-terminus rows.
      Abstract-only.
existing_annotations:
- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000276
  review:
    summary: >-
      Generic GPCR activity from the rhodopsin-family InterPro signature. True, but less
      specific than the neuromedin-K receptor activity the mouse receptor is known to have.
    action: MODIFY
    reason: >-
      NK3R is a rhodopsin-family GPCR, so the term is correct, but the gene already carries
      the supported specific child GO:0016498, and the mouse receptor's agonist binding and
      calcium responses were measured directly (PMID:11226387). Per the "correct but general
      is MODIFY" rule, replace with the specific receptor activity rather than keeping the
      uninformative parent.
    proposed_replacement_terms:
    - id: GO:0016498
      label: neuromedin K receptor activity
    supported_by:
    - &nkb_function
      reference_id: file:mouse/Tacr3/Tacr3-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Receptor for the tachykinin neuromedin-K (neurokinin B)
    - &mouse_pharm
      reference_id: PMID:11226387
      supporting_text: Binding affinities and functional potencies of tachykinin receptor agonists were similar in HEK (human embryonic kidney) 293 cells expressing murine NK(3) receptor and human NK(3) receptor, although substance P and neurokinin A were more potent stimulators of Ca(2+) mobilization in murine NK(3) receptor cells.
- term:
    id: GO:0004995
    label: tachykinin receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001544873
  - RGD:3810
  - RGD:3811
  - RGD:3812
  - UniProtKB:P21452
  - UniProtKB:P25103
  - UniProtKB:P29371
  - ZFIN:ZDB-GENE-061207-19
  - ZFIN:ZDB-GENE-090312-106
  review:
    summary: >-
      Phylogenetic assignment of tachykinin receptor activity to the whole tachykinin-receptor
      clade, which mouse NK3R belongs to and in which its activity has been measured directly.
    action: ACCEPT
    reason: >-
      The IBD node is seeded by the three mammalian tachykinin receptors (NK1R/P25103,
      NK2R/P21452, NK3R/P29371), their rat counterparts and two zebrafish members, all of
      which transduce tachykinin signals, so the family-level molecular function sits at the
      correct node and mouse Tacr3 is inside the clade that inherited it. Independently, the
      cloned mouse receptor binds tachykinin agonists and mobilises calcium with potencies
      close to the human receptor (PMID:11226387). The NKB-preferring specialisation is
      captured by the child GO:0016498. Retained as a true, correctly levelled annotation.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - &ptn_tkr
        source_id: PANTHER:PTN001544873
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The ancestral tachykinin-receptor node. Its seeds are the three mammalian receptor
          subtypes plus rat and zebrafish members; tachykinin receptor activity is a property
          of all of them, and mouse Tacr3 (PANTHER PTHR46925:SF1, neuromedin-K receptor) is a
          descendant with its own measured pharmacology, so node placement is not in question.
    supported_by:
    - &rank_order
      reference_id: file:mouse/Tacr3/Tacr3-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'The rank order of affinity of this receptor to tachykinins is: neuromedin-K > substance K > substance P'
    - *mouse_pharm
- term:
    id: GO:0004995
    label: tachykinin receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P16177
  - ensembl:ENSRNOP00000012473
  - InterPro:IPR001013
  - InterPro:IPR001681
  review:
    summary: >-
      The same family-level activity from the NK3-specific and neurokinin-receptor InterPro
      signatures combined with transfer from rat Tacr3.
    action: ACCEPT
    reason: >-
      An independent electronic line for a claim that is true and directly measured in mouse
      (PMID:11226387). The rat donor's own annotation is an IDA from receptor expression in
      mammalian cells (PMID:1662278), and the mouse and rat receptors are 96% identical, so
      the transfer is safe. Reinforces rather than contradicts the IBA row.
    supported_by:
    - *rank_order
    - *mouse_pharm
- term:
    id: GO:0004995
    label: tachykinin receptor activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: enables
  supporting_entities:
  - RGD:3810
  review:
    summary: Tachykinin receptor activity transferred from rat Tacr3 by mouse-rat orthology.
    action: ACCEPT
    reason: >-
      Rat Tacr3 carries this term by direct assay of the cloned receptor's ligand binding and
      selectivity (PMID:1662278), the orthology is unambiguous and the receptors are 96%
      identical, and the mouse receptor's own pharmacology has been measured (PMID:11226387).
      A sound transfer of a true claim.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - &rat_iso_mf
        source_id: RGD:3810
        source_label: rat Tacr3
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The rat donor's annotation to this term is an IDA (PMID:1662278, cloned rat
          neuromedin-K receptor expressed in COS cells with full ligand-selectivity analysis),
          not itself a transfer, so the chain is grounded in experiment.
    supported_by:
    - reference_id: PMID:1662278
      supporting_text: senktide was found to be a highly selective and potent agonist for neuromedin K receptor
    - *mouse_pharm
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN001544873
  - RGD:3810
  - RGD:3811
  - UniProtKB:P21452
  - UniProtKB:P25103
  - UniProtKB:P29371
  review:
    summary: Phylogenetic assignment of the plasma membrane as the site of action for the tachykinin-receptor clade.
    action: ACCEPT
    reason: >-
      Every tachykinin receptor is a cell-surface GPCR that senses extracellular peptide, so
      the plasma membrane is the conserved site of action and the core location for mouse
      NK3R. UniProt records the cell membrane, and the receptor has a seven-transmembrane
      topology. In mouse, native neuronal responses to NKB and senktide require a
      surface-accessible receptor (PMID:27549338).
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - *ptn_tkr
    supported_by:
    - &cell_membrane
