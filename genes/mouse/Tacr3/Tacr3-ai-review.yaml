proposed_new_terms: []
suggested_questions:
- question: >-
    Do the arcuate and median preoptic populations of NK3R neurons account separately for the
    reproductive and thermoregulatory effects of this receptor, or does one population drive
    both? A conditional deletion of Tacr3 restricted to each population would separate them,
    which neither the global knockout nor cell ablation can do.
- question: >-
    Why is loss of this receptor so much milder in mouse than in human? Specifically, do NK1R
    and NK2R on mouse KNDy neurons substitute for it, as the requirement for a three-antagonist
    cocktail to block endogenous NKB signalling suggests, and is that substitution absent or
    weaker in the human hypothalamus?
suggested_experiments:
- description: >-
    Delete Tacr3 conditionally in arcuate Kiss1 neurons and, separately, in median preoptic
    glutamatergic neurons, then measure pulsatile LH, the oestradiol-induced LH surge, oestrous
    cyclicity, core and tail-skin temperature and cold-seeking behaviour in each line, with
    senktide challenge as a positive control for receptor loss.
  hypothesis: >-
    The receptor's reproductive and thermoregulatory functions are carried by anatomically
    distinct neuronal populations, so each conditional deletion will reproduce one arm of the
    global knockout phenotype and leave the other intact.
- description: >-
    Record from identified mouse KNDy neurons in Tacr3-null slices and ask whether NKB still
    evokes the slow EPSP, and whether selective NK1R and NK2R antagonists abolish the residual
    response; pair this with quantification of Tacr1 and Tacr2 transcripts in those neurons in
    wild-type and Tacr3-null mice.
  hypothesis: >-
    The mildness of the mouse null phenotype comes from NKB acting on NK1R and NK2R in the same
    neurons, which would be measurable as a residual, NK3R-independent slow EPSP.
knowledge_gaps:
- gap_statement: >-
    It is not known whether the receptor itself, as opposed to the neurons that carry it, is
    required for normal body-temperature regulation in the mouse, nor which heat-loss effector
    pathway downstream of the median preoptic NK3R neurons it engages.
  boundary: >-
    What is established: a selective agonist lowers core temperature, raises tail skin
    temperature and drives cold-seeking in mice; the median preoptic NK3R population is
    glutamatergic, is not warm-sensitive, and its ablation raises core temperature; and
    activating arcuate Kiss1 neurons raises tail skin temperature in a neurokinin
    receptor-dependent way. What is missing: a receptor-specific loss-of-function test of
    thermoregulation (the published knockout lines were phenotyped for reproduction, cognition
    and dopaminergic responses, not for temperature), and the identity of the efferent pathway
    from these neurons to the cutaneous vasculature.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This is the circuit targeted by NK3R antagonists for menopausal vasomotor symptoms, so
    whether the receptor is necessary, and through which effector arm, bears on how the drug
    class works and on what a mouse model of it can show.
  resolution: >-
    Phenotype Tacr3-null and conditionally deleted mice for core and tail-skin temperature,
    thermal preference and the response to senktide, and map the output of median preoptic NK3R
    neurons to the sympathetic premotor nuclei that control cutaneous vasomotion.
  provenance:
  - reference_id: PMID:30753503
    supporting_text: Thus, NK3R neurons in the MnPO are glutamatergic and play a role in reducing TCORE but are not activated by warm thermal stimuli (internal or external).
  - reference_id: PMID:29996088
    supporting_text: Infusion of this antagonist cocktail 30 min prior to chemogenetic activation of Kiss1ARH neurons prevented the increase in tail-skin temperature
- gap_statement: >-
    Why loss of neurokinin B signalling is far milder in the mouse than in human is unresolved:
    which receptors or circuits substitute for NK3R in the mouse GnRH pulse generator, and
    whether the same reserve exists in human.
  boundary: >-
    What is established: Tacr3-null mice reach puberty and are fertile but have abnormal oestrous
    cycles, lower uterine weights, smaller testes and lower FSH; endogenous NKB excitation of
    arcuate kisspeptin neurons is only fully blocked by antagonists against all three tachykinin
    receptors; and removing all tachykinin ligands causes absent LH surges and infertility in
    most females. What is missing: direct evidence that NK1R and NK2R on KNDy neurons carry the
    load when this receptor is absent, and any measurement of that reserve in human tissue, where
    receptor loss causes congenital hypogonadotropic hypogonadism.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The mouse is the main model for the NKB arm of the pulse generator, so knowing what
    compensates sets the limits of what the mouse null can be used to test, and bears on why the
    human phenotype is severe and often reversible.
  resolution: >-
    Combine Tacr3 deletion with NK1R and NK2R blockade or deletion in KNDy neurons and measure
    pulsatile LH and the slow EPSP; compare tachykinin receptor expression in KNDy neurons
    between mouse and human hypothalamus.
  provenance:
  - reference_id: PMID:23744641
    supporting_text: the activation of kisspeptin neurons by NKB was only blocked completely by a cocktail of antagonists against all 3 tachykinin receptors
  - reference_id: PMID:22253416
    supporting_text: although capable of fertility, Tacr3-deficient mice have central reproductive defects
