id: P47937
gene_symbol: Tacr3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Tacr3 encodes the neurokinin-3 receptor (NK3R), also called the neuromedin-K
  receptor, a 452-residue class A (rhodopsin-like) seven-transmembrane G
  protein-coupled receptor of the tachykinin receptor subfamily, 96% identical to
  the rat and 86% identical to the human receptor. Its preferred agonist is the
  tachykinin neurokinin B (NKB, the Tac2 product); it also binds and responds to
  neurokinin A and substance P, which share the C-terminal FxGLM-NH2 motif.
  Agonist binding couples the receptor to Gq/11 and phospholipase C, raising
  intracellular calcium; a weaker adenylate cyclase/cAMP output is recorded for
  the rat receptor and inferred for mouse. The receptor works at the plasma
  membrane of central neurons, distributed over somata, dendrites, dendritic
  spines and axon terminals. Two neural roles are established in the mouse. In the
  arcuate nucleus the receptor sits on the kisspeptin/neurokinin B/dynorphin
  (KNDy) neurons that co-release its own ligand, where NKB-evoked, Gq-mediated
  slow excitation synchronises the population and shapes the pulsatile kisspeptin
  drive onto gonadotropin-releasing hormone neurons, so that receptor activation
  raises gonadotropin secretion and receptor loss gives abnormal oestrous cycling,
  smaller testes and reduced follicle-stimulating hormone without abolishing
  fertility; the other tachykinin receptors carry part of this load, which is why
  the null phenotype is milder than the human receptor deficiency. In the median
  preoptic nucleus the receptor marks a glutamatergic population that drives heat
  loss: agonist administration produces cutaneous vasodilation, cold-seeking and a
  fall in core temperature, and removing those neurons raises core temperature.
  Non-peptide NK3R antagonists bind the mouse receptor 10-100-fold more weakly
  than the human receptor, which has to be allowed for when antagonists are used
  in mouse models. Further roles reported for the rodent receptor, mostly from
  agonist injection in rat (cardiovascular, ingestive and reward behaviour,
  dopaminergic modulation) are peripheral to these two.
