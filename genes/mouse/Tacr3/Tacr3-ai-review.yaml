    summary: >-
      NK3R-dependent facilitation of the GnRH/LH axis, transferred from rat Tacr3 and
      established independently, and in more detail, in the mouse.
    action: ACCEPT
    reason: >-
      This is the best-supported physiological role of the mouse gene, and the mouse evidence
      is primary rather than transferred. Arcuate KNDy neurons express Tacr3 while GnRH neurons
      do not (PMID:21914775), the selective agonist senktide excites those neurons
      (PMID:23744642) and raises gonadotropin secretion (PMID:21914775), the receptor mediates
      the NKB slow EPSP that synchronises the population (PMID:27549338), an NK3R antagonist
      alone blocks the oestradiol-induced LH surge in female mice (PMID:32512561), and
      Tacr3-null mice have central reproductive defects with abnormal cyclicity and lower FSH
      (PMID:22253416). The receptor performs the signal-transduction step that drives this
      regulation, so it is a core physiological process. Two caveats are recorded rather than
      used against the term: in gonad-intact males the knockout shows faster, larger basal LH
      pulses (PMID:33839770) and without oestradiol NKB can inhibit LH (PMID:30565563), so the
      positive direction holds for agonist-driven secretion and for the surge, not in every
      steroid state; and endogenous NKB recruits all three tachykinin receptors
      (PMID:23744641), which is also why the mouse null is milder than the human deficiency.
