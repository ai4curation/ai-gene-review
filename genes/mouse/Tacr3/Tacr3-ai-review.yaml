  review:
    summary: >-
      Uterine contraction regulation from an ARBA model. The mouse uterus is dominated by the
      NK1 and NK2 receptors, and this receptor's uterine role there is explicitly unresolved.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The underlying evidence for this term in rodents is the rat myometrium, where senktide
      does contract uterine muscle through NK3R (PMID:12390879). Mouse is different: NK1R
      mediates tachykinin-induced contraction in the non-pregnant uterus and NK2R in late
      pregnancy, while Tacr3 is expressed in quantity only in dioestrus and its physiological
      significance is left open by the authors who measured it (PMID:15647454). So the claim is
      not established for the mouse gene. Marked over-annotated rather than removed, because
      the receptor is expressed in the mouse uterus and a minor contribution has not been
      excluded. This is a deliberate departure from the human review, which kept the uterine
      contraction term as a genuine non-core peripheral function on the rat tissue evidence.
    supported_by:
    - &mouse_uterus_nk3
      reference_id: PMID:15647454
      supporting_text: The tachykinin NK3 receptor is expressed in considerable amounts only in uteri from nonpregnant diestrous animals, and its physiological significance remains to be clarified.
    - &mouse_uterus_nk2
      reference_id: PMID:15647454
      supporting_text: The tachykinin NK2 receptor is predominant in the late pregnant mouse and is the main receptor mediating uterotonic responses to tachykinins at late pregnancy.
