- term:
    id: GO:0001659
    label: temperature homeostasis
  evidence_type: IDA
  original_reference_id: PMID:28531316
  qualifier: involved_in
  review:
    summary: >-
      Proposed: the receptor transduces the arcuate NKB signal onto median preoptic neurons
      that drive heat loss, so activating it in mice lowers core temperature and raising skin
      blood flow, and removing the receptor-expressing population raises core temperature.
    action: NEW
    reason: >-
      Three independent mouse lines support the receptor's participation in body-temperature
      regulation. The selective agonist senktide, whose action in mouse is confirmed genetically
      by loss of responsivity in NK3-receptor-knockout mice (PMID:18690106), produces the full
      vasomotor response in unrestrained mice: a fall in core temperature, cold-seeking
      behaviour, a rise in tail skin temperature and Fos induction in the median preoptic area
      (PMID:28531316). The receptor-expressing population was then defined in mouse with a
      Tacr3 reporter and is required for normal core temperature: ablating median preoptic NK3R
      neurons raises it, and those neurons are glutamatergic and not themselves warm sensors
      (PMID:30753503). Finally the endogenous circuit was closed: activating arcuate Kiss1
      neurons, which release NKB, raises tail skin temperature, and preoptic infusion of
      neurokinin receptor antagonists prevents it (PMID:29996088 - a three-antagonist cocktail,
      so supporting the circuit rather than this receptor alone). This is why the row is
      proposed where the rat behavioural rows above are marked over-annotated: those rest on a
      single agonist injection with no identification of the receptor's cell population,
      whereas here the population is mapped in mouse, its removal shifts the regulated
      variable, and the endogenous ligand pathway is sufficient. GO:0001659 is the term the
      mouse corpus uses for this kind of claim - GO:0031653 heat dissipation and GO:0031654
      regulation of heat dissipation would be closer to the phenotype but have no mouse
      annotations at all, while GO:0001659 carries several hundred, including GPCRs annotated
      from rodent perturbation data (Drd1, Drd2, Htr2a, Grm5, Ntsr1, Adora1, Cckar, Mc5r). The
      receptor does the work of a signalling step in the regulatory process rather than being
      acted on by it, so it passes the participation test.
    additional_reference_ids:
    - PMID:30753503
    - PMID:29996088
    - PMID:18690106
    supported_by:
    - &senktide_vms
      reference_id: PMID:28531316
      supporting_text: Following both treatments, the mice exhibited a VMS-like response characterized by a drop in core body temperature and cold-seeking behavior on the thermocline.
    - &senktide_tail
      reference_id: PMID:28531316
      supporting_text: Senktide also caused a rise in tail skin temperature and increased Fos expression in the median preoptic area, a hypothalamic temperature control center.
    - &mnpo_ablation
      reference_id: PMID:30753503
      supporting_text: Loss of MnPO NK3R neurons increased the core temperature (TCORE) during the light phase, with the frequency distributions indicating a regulated shift in the balance point.
    - &mnpo_role
      reference_id: PMID:30753503
      supporting_text: Thus, NK3R neurons in the MnPO are glutamatergic and play a role in reducing TCORE but are not activated by warm thermal stimuli (internal or external).
    - reference_id: PMID:29996088
      supporting_text: Infusion of this antagonist cocktail 30 min prior to chemogenetic activation of Kiss1ARH neurons prevented the increase in tail-skin temperature
    - *senktide_ko
