core_functions:
- description: Rhoj acts as a GTP-dependent molecular switch at the plasma membrane. In the GTP-bound
    state it binds CRIB-domain effectors (Pak1, WASP) and the PlexinD1 cytoplasmic domain, relaying receptor
    signals to the actin cytoskeleton. Effector binding is shown with the mouse protein; the PlexinD1
    interaction was shown with human RhoJ in human endothelial cells.
  molecular_function:
    id: GO:0003925
    label: G protein activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0007266
    label: Rho protein signal transduction
  - id: GO:0090050
    label: positive regulation of cell migration involved in sprouting angiogenesis
  supported_by:
  - *id003
  - *id008
  - *id010
  - *id004
- description: Intrinsic GTP hydrolysis returns Rhoj to the inactive GDP-bound state. TCL exchanges nucleotide
    rapidly and hydrolyses GTP faster than its paralog TC10.
