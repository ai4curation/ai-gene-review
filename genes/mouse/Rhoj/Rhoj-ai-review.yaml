id: Q9ER71
gene_symbol: Rhoj
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Rhoj (TCL, TC10-like) is a small GTPase of the Cdc42 subfamily of Rho GTPases. It arose
  in vertebrates by duplication of Cdc42, alongside its paralog Rhoq (TC10). It is a molecular switch:
  it exchanges GDP for GTP rapidly, hydrolyses GTP, and in the GTP-bound state binds CRIB-domain effectors
  such as Pak1 and WASP. Rhoj is anchored to the inner face of the plasma membrane by N-terminal palmitoylation
  and C-terminal prenylation, and a fraction sits on early/sorting endosomes. In mouse it is expressed
  mainly in endothelial cells and is highest in heart. Active Rhoj drives F-actin-rich membrane ruffles
  and endothelial cell contraction, and restrains stress fibres and focal adhesions. In endothelial cells
  it couples the attractive VEGF and repulsive Sema3E-PlexinD1 cues to directional migration. GTP-bound
  Rhoj binds the PlexinD1 cytoplasmic domain and promotes PlexinD1-VEGFR2 association, and it controls
  the endosomal trafficking of alpha5beta1 integrin and fibronectin remodeling. Rhoj knockout mice are
  viable but show delayed retinal and embryonic vascular development, reduced pathological retinal neovascularization
  and impaired tumor angiogenesis. Knockdown studies in 3T3-L1 cells also implicate it in early adipocyte
  differentiation.'
