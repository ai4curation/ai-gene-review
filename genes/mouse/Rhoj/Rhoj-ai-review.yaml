- id: PMID:32347571
  title: RhoJ integrates attractive and repulsive cues in directional migration of endothelial cells.
  findings:
  - statement: Rhoj is required for VEGF-dependent forward EC migration in mouse sprouting vessels.
    supporting_text: These results indicate that RhoJ is required for VEGF‐dependent forward EC migration
      in sprouting vessels.
  - statement: GTP-bound RhoJ binds the PlexinD1 cytoplasmic domain.
    supporting_text: In the GTP-bound state, RhoJ interacts with the cytoplasmic domain of PlexinD1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached (PMC HTML). Mouse Rhoj KO, inducible and EC-specific deletions: aortic-ring
      forward migration, retinal tip-cell positioning, retinal vascular development, OIR neovascularization.
      Mechanistic binding experiments (PlexinD1, VEGFR2) used human RhoJ constructs in HUVECs and 293T
      cells.'
- id: PMID:32302585
  title: RhoJ Regulates α5β1 Integrin Trafficking to Control Fibronectin Remodeling during Angiogenesis.
  findings:
