suggested_questions:
- question: Is the mouse Rhoj protein itself (rather than human RHOJ) palmitoylated by, or dependent on,
    GLUL for membrane localization in mouse endothelial cells?
- question: Should Rhoj carry an early/sorting endosome location? The direct evidence (PMID:12960428)
    is from human TCL in HeLa cells, and mouse endothelial data show endosomal trafficking roles but not
    a localization assay.
- question: Which effectors mediate Rhoj-dependent repression of RhoA-ROCK signaling in endothelial cells?
    Is this through PAK, the GIT-PIX complex, or competition with Cdc42?
suggested_experiments:
- description: Measure nucleotide exchange and GTP hydrolysis of purified mouse Rhoj (both isoforms, including
    isoform 2 lacking residues 4-13) to confirm that the kinetic properties reported for TCL apply to
    each mouse isoform.
- description: Map endogenous Rhoj localization (plasma membrane, early endosome, focal adhesion) in primary
    mouse endothelial cells using a knock-in tag, comparing wild type with a palmitoylation-site mutant.
