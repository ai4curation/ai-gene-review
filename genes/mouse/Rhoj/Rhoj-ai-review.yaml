  review:
    summary: Rhoj is a Cdc42-subfamily Rho GTPase with intrinsic GTP hydrolysis. The mouse TCL cDNA was
      cloned and characterised in PMID:10967094, which measured rapid exchange and a GTP hydrolysis rate
      higher than TC10.
    action: ACCEPT
    reason: PAINT placed GTPase activity at the Rho-family root PTN000632671. Rhoj is in the RhoJ subfamily
      of PTHR24072 (with human RHOJ Q9H4E5, which is itself a seed of this node), retains the G1-G5 motifs,
      and has direct biochemical evidence of GTP hydrolysis. Nothing suggests loss of catalysis in this
      lineage.
    supported_by:
    - &id001
      reference_id: PMID:10967094
      supporting_text: In vitro, TCL shows rapid GDP/GTP exchange and displays higher GTP dissociation
        and hydolysis rates than TC10.
    - &id002
      reference_id: file:mouse/Rhoj/Rhoj-uniprot.txt
      supporting_text: Belongs to the small GTPase superfamily. Rho family.
