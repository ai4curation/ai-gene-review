  review:
    summary: PAINT placed endocytosis at PTN008604842, a Cdc42-lineage node, from Cdc42 seeds. RhoJ arose
      by duplication of Cdc42 and inherits this node.
    action: KEEP_AS_NON_CORE
    reason: Supported for the RhoJ lineage, but with a nuance. In HeLa cells (human TCL), uptake of transferrin
      was unaffected by TCL knockdown, but internalised receptors failed to reach early/sorting endosomes,
      so TCL acts in the early endocytic pathway after internalization (PMID:12960428). Mouse Rhoj also
      controls endosomal trafficking of active alpha5beta1 integrin in endothelial cells (PMID:32302585).
      The term is kept because the endocytic-pathway role is real and the IBA placement is sound, but
      it is not core, and no mouse experiment tests endocytic uptake.
    supported_by:
    - reference_id: PMID:12960428
      supporting_text: TCL is essential for clathrin-dependent endocytosed receptors to enter the early/sorting
        endosomes
    - reference_id: PMID:12960428
      supporting_text: Receptor-dependent internalization of transferrin (Tf) is unaffected by suppression
        of endogenous TCL by small interfering RNA treatment.
    - reference_id: PMID:32302585
      supporting_text: RhoJ regulates the intracellular trafficking of active α5β1 integrin in endothelial
        cells to repress fibronectin fibrillogenesis
    - &id013
      reference_id: PMID:32302585
      supporting_text: Cdc42 underwent gene duplication to produce two related proteins-RhoQ and RhoJ
