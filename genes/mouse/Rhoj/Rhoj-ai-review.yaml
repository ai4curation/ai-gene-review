    supporting_text: RhoJ regulates the intracellular trafficking of active α5β1 integrin in endothelial
      cells to repress fibronectin fibrillogenesis
  - statement: RhoJ competes with Cdc42 for PAK3.
    supporting_text: RhoJ acts in opposition to Cdc42 in this process through competition for a shared
      partner, PAK3
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Proteomics of RhoJ vesicles in endothelial cells; alpha5beta1 integrin
      as cargo; Rhoj-null mice show perivascular fibronectin defects; PAK3 competition with Cdc42.
