  review:
    summary: Rhoj is a lipid-anchored (palmitoylated and C-terminally prenylated) GTPase that is predominantly
      at the plasma membrane, with a fraction on early/sorting endosomes.
    action: ACCEPT
    reason: Plasma membrane localization of TCL/RhoJ is shown directly for the human ortholog (same PANTHER
      subfamily, 214 aa, near-identical membrane-targeting sequences), where it depends on the N-terminal
      extension and on GLUL-supported palmitoylation (PMID:27660391, PMID:30158707). The mouse protein
      produces F-actin ruffles at the dorsal cell membrane (PMID:10967094). Mouse-specific localization
      data were not found; the localization is transferred, not measured, in mouse.
    supported_by:
    - &id005
      reference_id: PMID:27660391
      supporting_text: Previous observations regarding both exogenous and endogenous TCL have indicated
        it primarily localizes to the plasma membrane; however, a fraction of the protein has also been
        localized to punctate, vesicular structures within cells
    - &id006
      reference_id: PMID:30158707
      supporting_text: glutamine synthetase palmitoylates itself and interacts with RHOJ to sustain RHOJ
        palmitoylation, membrane localization and activation
    - &id007
      reference_id: PMID:10967094
      supporting_text: the constitutively active TCL mutant displays distinct morphogenic activity in
        REF-52 fibroblasts, producing large and dynamic F-actin-rich ruffles on the dorsal cell membrane
