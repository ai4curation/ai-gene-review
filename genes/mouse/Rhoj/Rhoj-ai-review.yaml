  review:
    summary: EC 3.6.5.2 (small monomeric GTPase) mapping to G protein activity. GO:0003925 is defined
      as a molecular function regulator that cycles between GTP-bound and GDP-bound states and binds effectors
      in the GTP-bound state, which covers small GTPases.
    action: ACCEPT
    reason: 'This is the switch function that Rhoj actually performs: GTP-bound but not GDP-bound TCL
      binds the CRIB domains of PAK and WASP (PMID:10967094), and GTP-bound RhoJ binds the PlexinD1 cytoplasmic
      domain (PMID:32347571). G protein activity captures the effector-binding switch better than GTPase
      activity alone and is treated as the core molecular function.'
    supported_by:
    - &id003
      reference_id: PMID:10967094
      supporting_text: GTP-bound but not GDP-bound TCL protein directly interacts with Cdc42/Rac interacting
        binding domains, such as those found in PAK and WASP
    - &id008
      reference_id: PMID:32347571
      supporting_text: In the GTP-bound state, RhoJ interacts with the cytoplasmic domain of PlexinD1.
