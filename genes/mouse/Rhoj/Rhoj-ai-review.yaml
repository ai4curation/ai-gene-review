- id: PMID:10967094
  title: Characterization of TCL, a new GTPase of the rho family related to TC10 andCcdc42.
  findings:
  - statement: TCL exchanges GDP/GTP rapidly and hydrolyses GTP faster than TC10.
    supporting_text: In vitro, TCL shows rapid GDP/GTP exchange and displays higher GTP dissociation and
      hydolysis rates than TC10.
  - statement: GTP-bound TCL binds the CRIB domains of PAK and WASP.
    supporting_text: GTP-bound but not GDP-bound TCL protein directly interacts with Cdc42/Rac interacting
      binding domains, such as those found in PAK and WASP
  - statement: Active TCL induces dorsal F-actin-rich ruffles in fibroblasts, dependent on Rac1 and Cdc42.
    supporting_text: the constitutively active TCL mutant displays distinct morphogenic activity in REF-52
      fibroblasts, producing large and dynamic F-actin-rich ruffles on the dorsal cell membrane
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. Original cloning and characterisation of TCL; UniProt Q9ER71
      cites it for the mouse cDNA (isoform 2), function and subunit. Kinetics, CRIB-effector binding and
      the morphogenic assay are in this paper. The abstract does not say which species' construct was
      used for every assay; MGI coded the GTPase-activity row as ISS, which suggests that assay may have
      used the human construct.
