  label: Mus musculus
description: >-
  Alpha-S2-casein-like B (mouse epsilon-casein) is a predicted secreted
  calcium-sensitive casein expressed in the lactating mammary gland. It is the second of the two
  murine alpha-s2-like caseins, which arose by duplication within the casein gene
  cluster; mice have five functional casein genes. By homology with the other
  calcium-sensitive caseins it is expected to carry phosphoserine clusters that
  bind amorphous calcium phosphate and to contribute to casein micelles that carry
  calcium phosphate and protein in milk. Existence of the protein rests on
  transcript evidence, and the protein has not been characterized individually.
