    summary: Propagated from bovine alpha-s2-casein binding to tissue-type plasminogen activator in vitro.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Propagated from bovine alpha-s2-casein, where ligand blotting and
      casein-Sepharose binding identified dimeric alpha-s2-casein (and multimeric
      kappa-casein) as binding components for tissue-type plasminogen activator in
      milk. This is an in vitro binding observation suggesting the micelle may act as
      a matrix for plasminogen activation; it is not a defined, selected function of
