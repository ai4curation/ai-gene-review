suggested_questions:
- question: >-
    Is mouse epsilon-casein phosphorylated and present in milk at levels
    comparable to gamma-casein, and does it contribute measurably to calcium
    phosphate transport, or is it a minor, partly redundant paralog?
suggested_experiments:
- description: >-
    Quantify epsilon-casein and its phosphorylation in mouse milk by mass
    spectrometry, and test calcium phosphate nanocluster sequestration by the
    purified or recombinant phosphorylated protein.
