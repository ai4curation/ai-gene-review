core_functions:
- description: >-
    Inferred from casein family membership: as a calcium-sensitive casein it is
    expected to sequester amorphous calcium phosphate and to contribute to milk
    casein micelles. Calcium ion sequestering activity is the closest available GO
    term; the actual sequestered species is calcium phosphate nanoclusters.
