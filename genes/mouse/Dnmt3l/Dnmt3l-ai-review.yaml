- term:
    id: GO:0140006
    label: histone H3 reader activity
  evidence_type: IDA
  original_reference_id: PMID:17687327
  review:
    summary: The ADD (cysteine-rich, PHD-like) domain of DNMT3L binds the extreme N-terminal tail of histone
      H3 only when lysine 4 is unmethylated.
    action: NEW
    reason: Ooi et al. (2007) found that endogenous epitope-tagged mouse Dnmt3L co-purifies with the four
      core histones from ES cells. Peptide binding assays and a co-crystal with human DNMT3L localised
      binding to the cysteine-rich ADD domain and showed it is blocked by H3K4 methylation. The structural
      work used the human protein; mouse Dnmt3l is its 1:1 ortholog in PTHR23068:SF13 with a conserved
      ADD domain (InterPro IPR025766, Pfam PF17980). This is an activity the protein itself performs.
      It is proposed here as in the human ortholog review, and no existing annotation captures it.
    supported_by:
    - reference_id: PMID:17687327
      supporting_text: The main proteins that interact in vivo with the product of an epitope-tagged allele
        of the endogenous Dnmt3L gene were identified by mass spectrometry as DNMT3A2, DNMT3B and the
        four core histones.
    - reference_id: PMID:17687327
      supporting_text: Peptide interaction assays showed that DNMT3L specifically interacts with the extreme
        amino terminus of histone H3; this interaction was strongly inhibited by methylation at lysine
        4 of histone H3 but was insensitive to modifications at other positions.
    - reference_id: PMID:17687327
      supporting_text: Cocrystallization of DNMT3L with the tail of histone H3 revealed that the tail
        bound to the cysteine-rich domain of DNMT3L, and substitution of key residues in the binding site
        eliminated the H3 tail-DNMT3L interaction.
