id: Q9CWR8
gene_symbol: Dnmt3l
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Dnmt3l (DNA cytosine-5-methyltransferase 3-like) is a 421-residue nuclear protein of the
  DNMT3 family that has no DNA methyltransferase activity of its own: it has lost the catalytic motifs
  of C5 cytosine methyltransferases. It is a regulatory subunit of the de novo methyltransferases Dnmt3a
  and Dnmt3b. Its C-terminal methyltransferase-like domain binds their catalytic domains, forming Dnmt3l-Dnmt3a-Dnmt3a-Dnmt3l
  heterotetramers, and stimulates catalysis about 15-fold by speeding the binding of DNA and S-adenosyl-L-methionine.
  Its N-terminal ADD zinc-finger domain reads histone H3 tails unmethylated at lysine 4, linking de novo
  methylation to chromatin that lacks H3K4 methylation. Dnmt3l is expressed in growing oocytes, perinatal
  prospermatogonia and pluripotent cells. Mouse knockouts show it is required to establish maternal methylation
  imprints in oocytes, and to methylate and silence LTR and non-LTR retrotransposons in fetal and perinatal
  prospermatogonia, where it acts with the piRNA-directed (MIWI2-SPOCD1) methylation machinery. Mutant
  females produce embryos that die at mid-gestation from imprinting defects, and mutant males are sterile.
  In embryonic stem cells it promotes gene-body methylation, and through competition with Dnmt3a/3b for
  PRC2 it limits methylation at bivalent promoters.'
