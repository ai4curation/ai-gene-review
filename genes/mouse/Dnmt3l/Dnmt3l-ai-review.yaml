  review:
    summary: Epigenetic programming of female pronucleus, from loss of maternal imprints in Dnmt3L(mat-/-)
      conceptuses.
    action: MARK_AS_OVER_ANNOTATED
    reason: The GO term describes protecting the maternal genome in the zygote from global demethylation.
      Dnmt3l acts earlier, in the growing oocyte, where it establishes the maternal imprints. Their absence
