- term:
    id: GO:0006346
    label: DNA methylation-dependent constitutive heterochromatin formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00086060
  review:
    summary: 'ARBA: DNA methylation-dependent constitutive heterochromatin formation.'
    action: ACCEPT
    reason: Dnmt3l is the activating subunit of the de novo methylation step that establishes silencing
      methylation at dispersed retrotransposons in prospermatogonia; without it they lose methylation
      and are highly transcribed. As the non-catalytic activator in the methyltransferase complex, it
      does part of the work of the methylation step.
    supported_by:
    - reference_id: PMID:15318244
      supporting_text: Deletion of the Dnmt3L gene prevented the de novo methylation of both long-terminal-repeat
        (LTR) and non-LTR retrotransposons, which were transcribed at high levels in spermatogonia and
        spermatocytes.
    - reference_id: PMID:15671018
      supporting_text: We show here that Dnmt3L stimulates the catalytic activity of the Dnmt3A and Dnmt3B
        enzymes by directly binding to their respective catalytic domains via its own C-terminal domain.
