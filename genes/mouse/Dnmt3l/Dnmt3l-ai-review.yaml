- term:
    id: GO:0000792
    label: heterochromatin
  evidence_type: IDA
  original_reference_id: PMID:11934864
  qualifier: located_in
  review:
    summary: Hata et al. 2002 show Dnmt3L co-localizing with Dnmt3a and Dnmt3b in nuclei of transfected
      cells; the heterochromatin call presumably reflects the focal (pericentric) nuclear pattern of the
      co-expressed proteins.
    action: KEEP_AS_NON_CORE
    reason: Location is plausible for a chromatin-associated cofactor of the DNMT3 enzymes, but it comes
      from overexpression in transfected cells and is not where Dnmt3l's genetically defined targets (imprinted
      DMRs, dispersed retrotransposons) lie; Bourc'his and Bestor (2004) found pericentric tandem repeats
      methylated normally without Dnmt3l. Kept as non-core; full text not available to us, so we defer
      to the curator on the observation itself.
    supported_by:
    - reference_id: PMID:11934864
      supporting_text: We also show that Dnmt3L interacts with Dnmt3a and Dnmt3b and co-localizes with
        these enzymes in the nuclei of transfected cells
