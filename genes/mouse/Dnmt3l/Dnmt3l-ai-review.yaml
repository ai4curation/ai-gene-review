    label: post-embryonic development
  evidence_type: IDA
  original_reference_id: PMID:30834655
  qualifier: acts_upstream_of_or_within
  review:
    summary: Transgenic mice co-expressing DNMT3A2 and DNMT3L ectopically after fertilisation develop
      aberrant hypermethylation and die postnatally.
    action: REMOVE
    reason: This is a gain-of-function artefact of forced ectopic co-expression, not a normal role. Endogenous
      Dnmt3l is restricted to germ cells and pluripotent cells, and the same paper notes that Dnmt3l-deficient
      mice develop normally. Postnatal lethality caused by misexpression does not show that Dnmt3l takes
      part in post-embryonic development.
