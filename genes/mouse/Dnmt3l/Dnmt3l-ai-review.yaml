- term:
    id: GO:0001890
    label: placenta development
  evidence_type: IMP
  original_reference_id: PMID:16920095
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:2447127
  review:
    summary: Placental defects (labyrinth, spongiotrophoblast, giant cells) in Dnmt3L(mat-/-) conceptuses
      whose mothers lacked Dnmt3l.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'This is a maternal-effect phenotype: the Dnmt3l product acts in the oocyte to set methylation
      imprints, and the placental defect in the next generation follows from imprint loss (e.g. Mash2/Ascl2).
      Dnmt3l does no part of placenta development itself, so the term records a downstream organismal
      phenotype rather than participation. The informative process is genomic imprinting, accepted elsewhere
      in this review.'
    supported_by:
    - reference_id: PMID:16920095
      supporting_text: Oogenesis apparently proceeds normally in female mice homozygous for a targeted
        deletion of Dnmt3L, but their heterozygous offspring (Dnmt3L(mat-/-)) die before midgestation
        due to an imprinting defect.
    - reference_id: PMID:16920095
      supporting_text: we show that Dnmt3L is required for the establishment of maternal methylation imprints
        both in the embryos and the placentae and that the placentae of these embryos develop abnormally.
- term:
    id: GO:0003006
    label: developmental process involved in reproduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026397
  review:
    summary: ARBA prediction of a broad reproductive developmental process.
    action: KEEP_AS_NON_CORE
    reason: 'True in the broad sense: Dnmt3l is needed in prospermatogonia and oocytes for germline methylation,
      and males lacking it are sterile. But this is a very general term, and the gene''s work is the methylation
      step, not gamete development as such. Kept as non-core; the specific processes are genomic imprinting
      and transposable element silencing.'
    supported_by:
    - reference_id: PMID:15318244
      supporting_text: Deletion of the Dnmt3L gene prevented the de novo methylation of both long-terminal-repeat
        (LTR) and non-LTR retrotransposons, which were transcribed at high levels in spermatogonia and
        spermatocytes.
    - reference_id: PMID:11934864
      supporting_text: In addition, both Dnmt3a and Dnmt3L are required for spermatogenesis.
- term:
    id: GO:0003886
    label: DNA (cytosine-5-)-methyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:11934864
  qualifier: enables
  negated: true
  review:
    summary: NOT DNA (cytosine-5-)-methyltransferase activity. Dnmt3l lacks the catalytic motifs of C5
      methyltransferases and has no enzymatic activity of its own.
    action: ACCEPT
    reason: 'The negative annotation is correct and important: Dnmt3l is a non-catalytic paralog of Dnmt3a/3b,
      and the catalytic motifs are lost (Bourc''his et al. 2001; Hata et al. 2002). In the DNMT3A-DNMT3L
      heterotetramer the active sites are on DNMT3A (Jia et al. 2007). This is consistent with the curated
      UniProt function statement.'
    supported_by:
    - reference_id: PMID:11934864
      supporting_text: Dnmt3L, a protein sharing homology with DNA methyltransferases, Dnmt3a and Dnmt3b,
        but lacking enzymatic activity
    - reference_id: PMID:11719692
      supporting_text: The key catalytic motifs characteristic of DNA cytosine methyltransferases have
        been lost from Dnmt3L
    - reference_id: file:mouse/Dnmt3l/Dnmt3l-uniprot.txt
      supporting_text: Catalytically inactive regulatory factor of DNA
