        genes and, more surprisingly, is also a negative regulator of methylation at promoters of bivalent
        genes.
- term:
    id: GO:0007141
    label: male meiosis I
  evidence_type: IMP
  original_reference_id: PMID:15318244
  qualifier: involved_in
  review:
    summary: Meiotic failure (asynapsis, arrest before full pachytene) in Dnmt3l-/- spermatocytes.
    action: REMOVE
    reason: The paper itself states that the spermatocytes that fail meiosis do not express Dnmt3L. Dnmt3l
      is expressed only in perinatal prospermatogonia, and the meiotic catastrophe follows from earlier
      failure to methylate retrotransposons. Dnmt3l therefore does no part of male meiosis I; this is
      a downstream phenotype, and GO participation is not supported. The ortholog human review removes
      the same term for the same reason. Spermatogenesis (acts upstream) and transposable element silencing
      capture the real biology.
    supported_by:
    - reference_id: PMID:15318244
      supporting_text: Loss of Dnmt3L from early germ cells also caused meiotic failure in spermatocytes,
        which do not express Dnmt3L.
    - reference_id: PMID:15318244
      supporting_text: is expressed in testes during a brief perinatal period in the non-dividing precursors
        of spermatogonial stem cells at a stage where retrotransposons undergo de novo methylation.
