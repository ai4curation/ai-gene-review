core_functions:
- description: Non-catalytic activator subunit of the de novo DNA methyltransferases Dnmt3a and Dnmt3b.
    Its C-terminal domain binds their catalytic domains, forming a heterotetramer, and stimulates their
    methylation of genomic DNA. In oocytes this establishes maternal imprints; in prospermatogonia it
    silences retrotransposons. Experimentally established in mouse.
  molecular_function:
    id: GO:0008047
    label: enzyme activator activity
  directly_involved_in:
  - id: GO:0141068
    label: autosome genomic imprinting
  - id: GO:0141005
    label: transposable element silencing by heterochromatin formation
  - id: GO:0141196
    label: transposable element silencing by piRNA-mediated DNA methylation
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0140020
    label: DNA methyltransferase complex
  supported_by:
  - reference_id: PMID:15671018
    supporting_text: We show here that Dnmt3L stimulates the catalytic activity of the Dnmt3A and Dnmt3B
      enzymes by directly binding to their respective catalytic domains via its own C-terminal domain.
  - reference_id: PMID:11719692
    supporting_text: Bisulfite genomic sequencing of DNA from oocytes and embryos showed that removal
      of Dnmt3L prevented methylation of sequences that are normally maternally methylated.
  - reference_id: PMID:15318244
    supporting_text: Deletion of the Dnmt3L gene prevented the de novo methylation of both long-terminal-repeat
      (LTR) and non-LTR retrotransposons, which were transcribed at high levels in spermatogonia and spermatocytes.
  - reference_id: PMID:17713477
    supporting_text: Substitution of key non-catalytic residues at the Dnmt3a-Dnmt3L interface or the
      Dnmt3a-Dnmt3a interface eliminated enzymatic activity.
  - reference_id: PMID:32674113
    supporting_text: associate with SPOCD1-HA, amongst which were DNMT3L and DNMT3A, components of the
      de novo methylation machinery
- description: Chromatin reader. The ADD domain binds the N-terminal tail of histone H3 when lysine 4
    is unmethylated, directing Dnmt3-dependent de novo methylation to H3K4me0 chromatin. Co-purification
    of endogenous mouse Dnmt3L with core histones is mouse data; the H3K4 specificity and binding site
    come from peptide and crystallographic work, the latter on human DNMT3L, transferred by 1:1 orthology.
  molecular_function:
    id: GO:0140006
    label: histone H3 reader activity
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:17687327
    supporting_text: The main proteins that interact in vivo with the product of an epitope-tagged allele
      of the endogenous Dnmt3L gene were identified by mass spectrometry as DNMT3A2, DNMT3B and the four
      core histones.
  - reference_id: PMID:17687327
    supporting_text: Peptide interaction assays showed that DNMT3L specifically interacts with the extreme
      amino terminus of histone H3; this interaction was strongly inhibited by methylation at lysine 4
      of histone H3 but was insensitive to modifications at other positions.
suggested_questions:
- question: Do any mouse Dnmt3l annotations (HDAC1 binding, histone H3K4me0 reading) rest only on human
    or heterologous constructs, and should GO record them as ISO rather than mouse experimental evidence?
- question: Should the maternal-effect placental and trophoblast phenotypes of Dnmt3L(mat-/-) conceptuses
    be kept as acts_upstream_of_or_within annotations to Dnmt3l, given that the gene product acts only
    in the mother's oocyte?
- question: Does Dnmt3l also activate DNMT3C in prospermatogonia, given that DNMT3C methylates young retrotransposon
    promoters and Dnmt3l loss derepresses an overlapping set of elements?
suggested_experiments:
- description: Test, in purified-protein assays, whether mouse Dnmt3l stimulates DNMT3C catalytic activity,
    and whether the Dnmt3a-interface mutant F297A blocks this.
- description: Use separation-of-function ADD-domain mutants (H3 binding lost, Dnmt3a binding kept) in
    knock-in mice to measure how much H3K4me0 reading contributes to imprint and retrotransposon methylation
    in vivo.
