description: Keratin-associated protein 5-4 (Krtap5-4) is a serine-rich ultra-high-sulfur keratin-associated protein
  of the KAP5 family (223 aa, about 40% cysteine, built from cysteine-rich decapeptide repeats). It was cloned as
  one of a pair of murine serine-rich ultra-high-sulfur protein genes whose mRNA rises during anagen and falls in
  the resting phase of the hair cycle, and is found in the forming hair (reported in medulla and inner root sheath)
  and in upper epidermal layers. KAP5 proteins are cuticle-type ultra-high-sulfur matrix proteins of the hair fibre;
  as a member of this mammal-specific family, Krtap5-4 is a structural matrix protein that becomes extensively disulfide
  cross-linked with hair keratin intermediate filaments and other matrix proteins during keratinization of the hair
  shaft.
