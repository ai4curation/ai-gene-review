suggested_questions:
- question: Which keratin residues or domains does Krtap5-4 cross-link or bind in the fibre, and does it pair preferentially
    with particular type I/type II trichocyte keratins or other KAPs?
- question: Is Krtap5-4 functionally redundant with its paralogues in the same KAP cluster, or does its loss change
    fibre mechanics, diameter or curvature?
suggested_experiments:
- description: Generate a Krtap5-4 knockout (CRISPR, ideally together with close paralogues) and measure fibre tensile
    strength, diameter, curvature and ortho/para-cortex organization, with keratin/KAP proteomics of the fibre.
  hypothesis: Krtap5-4 contributes non-redundantly to fibre mechanics or morphology.
  experiment_type: knockout phenotyping
- description: Map Krtap5-4-keratin cross-links in native fibres by cross-linking mass spectrometry, and test binding
    of recombinant protein to trichocyte keratin head domains (ITC/pull-down) under non-reducing and reducing conditions.
  hypothesis: Krtap5-4 associates with specific keratin head/tail domains.
  experiment_type: biochemical binding / XL-MS
- description: Define the follicular compartment and hair-cycle timing of Krtap5-4 expression by RNA in situ hybridization
    or single-cell RNA-seq of anagen follicles, with an antibody to confirm protein in the keratinized shaft.
  experiment_type: expression localization
