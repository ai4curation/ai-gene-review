    reason: >-
      The orthology is unambiguous and the source evidence is direct, so the transfer is
      sound. Mouse-specific evidence for the same conclusion now exists independently:
      Kazgan et al. show that an acetylation-mimicking DCoH2 mutant loses the ability to
      activate a mouse FXR promoter reporter in the mouse Hepa1-6 line, and that DCoH2
