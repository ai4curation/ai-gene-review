- term:
    id: GO:0004505
    label: phenylalanine 4-monooxygenase activity
  evidence_type: IDA
  original_reference_id: PMID:15182178
  qualifier: enables
  review:
    summary: >-
      This is the annotation that geneontology/go-annotation#6591 asks to correct.
      GO:0004505 is the activity of phenylalanine hydroxylase (Pah), one step upstream
      of Pcbd2 in the BH4 cycle. PMID:15182178 measured pterin-4-alpha-carbinolamine
      dehydratase activity, which is GO:0008124.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0008124
      label: 4-alpha-hydroxytetrahydrobiopterin dehydratase activity
    reason: >-
      The two terms name consecutive steps of one cycle. GO:0004505 is "Catalysis of
      the reaction: L-phenylalanine + tetrahydrobiopterin + O2 = L-tyrosine +
      4-alpha-hydroxytetrahydrobiopterin"; Pcbd2 instead dehydrates that
      4a-hydroxy-BH4 product, which is GO:0008124, a term whose synonym list contains
      "pterin-4-alpha-carbinolamine dehydratase activity" verbatim - the exact phrase
      the abstract uses. For Pcbd2 the contradiction is sharper than for Pcbd1, because
      UniProt attributes the dehydratase chemistry to this same reference with
      experimental evidence: the entry carries EC=4.2.1.96 and a RHEA:11920 CATALYTIC
      ACTIVITY block, both tagged ECO:0000269|PubMed:15182178. Two databases therefore
      read one paper as supporting two mutually exclusive EC classes (4.2.1.- hydro-lyase
      versus 1.14.16.- monooxygenase), and the issue resolves it in UniProt's favour.
      The experiment, evidence code and reference are sound; only the term is wrong, so
      MODIFY keeps IDA and PMID:15182178.
    supported_by:
    - reference_id: PMID:15182178
      supporting_text: >-
        Like DCoH, DCoH2 forms a tetramer, displays pterin-4alpha-carbinolamine
        dehydratase activity, and binds HNF1alpha in vivo and in vitro.
    - reference_id: file:mouse/Pcbd2/Pcbd2-uniprot.txt
      supporting_text: "EC=4.2.1.96 {ECO:0000269|PubMed:15182178};"
