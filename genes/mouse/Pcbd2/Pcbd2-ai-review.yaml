  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Rose, Pullen, Bayle, Crabtree, Alber; Biochemistry 2004). The
      source reference for the MGI IDA that geneontology/go-annotation#6591 asks to
      correct, and for the Pcbd2 crystal structures. The abstract states the enzymology
      for this protein - "Like DCoH, DCoH2 ... displays pterin-4alpha-carbinolamine
