suggested_questions:
- question: >-
    UniProt assigns EC 4.2.1.96 to mouse Pcbd2 with ECO:0000269|PubMed:15182178, i.e.
    experimental evidence from the same paper that MGI used to annotate GO:0004505
    phenylalanine 4-monooxygenase activity. Can MGI confirm from the full text that the
    assay was the dehydratase/PhhB-complementation one described in
    geneontology/go-annotation#6591, so the IDA can be moved to GO:0008124?
  experts:
  - MGI curators
- question: >-
    PMID:24389307 (Kazgan et al.) is UniProt's source for both FUNCTION and SUBCELLULAR
    LOCATION on mouse Pcbd2, contains mouse-specific coactivation and localization data,
    and yet contributes no GOA annotation. Can it be curated - for transcription
    coactivator activity, for nucleus and cytoplasm with a direct evidence code, and
    possibly for the acetylation-dependent regulation?
  experts:
  - MGI curators
- question: >-
    Is the single HDA mitochondrion annotation for mouse Pcbd2 a genuine second
    localization? Mouse Pcbd2 carries a Pcbd1-absent N-terminal extension with the
    composition of a cleavable presequence, human PCBD2 is in the contaminant-filtered
    MitoCoP proteome (PMID:34800366), and the family has a bona fide mitochondrial
    member in plants - but no cleavage or import has been demonstrated and UniProt
    annotates no transit peptide.
  experts:
  - MGI curators
  - mitochondrial proteomics groups
- question: >-
    PANTHER node PTN002650414 is placed at Euteleostomi and confers GO:0008124 on Pcbd1
    but not on Pcbd2, although both paralogs descend from the vertebrate ancestor of
    PTHR12599 and the dehydratase activity is experimentally supported for Pcbd2 itself.
    Should the dehydratase IBD be asserted at a node ancestral to the Pcbd1/Pcbd2
    duplication?
  experts:
  - PANTHER/PAINT curators
- question: >-
    ARBA00029278 assigns GO:0004505 to both mouse PCD paralogs independently of the MGI
    annotation targeted by geneontology/go-annotation#6591. Can the rule's condition set
    be revisited, given the family's curated EC is 4.2.1.96?
  experts:
  - UniProt ARBA team
suggested_experiments:
- hypothesis: >-
    The N-terminal 33 residues of Pcbd2 are a cleavable mitochondrial presequence, so a
    processed Pcbd2 pool exists inside mitochondria and the HDA annotation reflects
    genuine residence rather than co-purification.
  description: >-
    Purify mitochondria from mouse liver and determine the N-terminus of endogenous
    Pcbd2 by Edman sequencing or N-terminal-peptide MS, testing for cleavage near
    residue 33. In parallel express Pcbd2(1-33)-GFP and full-length Pcbd2-GFP and score
    mitochondrial import by confocal imaging, with an MTS-less Pcbd1-GFP control. Follow
    with submitochondrial fractionation and protease-protection to distinguish a matrix
    pool from surface association. A negative result would justify removing the
    mitochondrion annotation.
  experiment_type: subcellular localization
- hypothesis: >-
    Mouse Pcbd2 catalyses 4a-hydroxy-tetrahydrobiopterin dehydration and has no
    phenylalanine 4-monooxygenase activity, so GO:0004505 is a misassignment rather than
    a second activity.
  description: >-
    Assay recombinant mouse Pcbd2 alongside recombinant mouse Pah in both reactions: the
    PCD reaction followed spectrophotometrically as loss of 4a-hydroxy-BH4 or formation
    of quinonoid-BH2, and the PAH reaction measured as tyrosine formation from
    phenylalanine with BH4 and O2. Include the Pcbd2(34-136) construct used for
    crystallography to test whether the N-terminal extension affects catalysis. Pcbd2 is
    expected to be active only in the first reaction.
  experiment_type: enzyme assay
- hypothesis: >-
    Pcbd1 and Pcbd2 regulate HNF1 differently because of their different tetramer
    stabilities, rather than being simply redundant coactivators.
  description: >-
    Measure HNF1A-dependent reporter activation kinetics and dose-response for Pcbd1
    versus Pcbd2 in the same mouse hepatic line, combined with analytical
    ultracentrifugation or mass photometry of each tetramer and of mixed preparations, to
    test whether DCoH2's disproportionation gives thermodynamic rather than kinetic
    control. Swapping the tetramer-interface residues between the paralogs would test
    whether stability alone accounts for the difference.
  experiment_type: biophysical and reporter assay
