- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HDA
  original_reference_id: PMID:18614015
  qualifier: located_in
  review:
    summary: >-
      Mitochondrion from the MitoCarta mouse mitochondrial compendium. The one
      compartment that does not fit either characterised function, but it is supported
      by more than this single row and by a plausible import mechanism, so it is
      retained as non-core rather than removed.
    action: KEEP_AS_NON_CORE
    reason: >-
      The easy call would be contaminant: MitoCarta is MS-based and its own paper
      concedes that published reports exhibit up to 41% false positive rates, UniProt
      has not adopted the compartment (SUBCELLULAR LOCATION lists only Cytoplasm and
      Nucleus), and neither characterised function belongs there - the dehydratase
      substrate is produced by cytosolic hydroxylases and Hnf1a is nuclear. Three things
      argue against dismissing it. First, Pcbd2 has roughly 33 N-terminal residues that
      Pcbd1 lacks, and scored against 259 reviewed mouse transit peptides and 300
      reviewed mouse cytosolic N-termini they sit at the median of real presequences on
      every classical feature, while the same window of Pcbd1 sits at the opposite
      extreme; the honest caveat is a 40.6% alanine content that partly explains the
      acidic-residue depletion. Second, the extension is absent from both Pcbd2 crystal
      structures (1RU0, 4WIL cover 33/34-136) and UniProt flags both source mRNAs
      Erroneous initiation, consistent with a cleaved presequence yielding the mature
      species that was assayed. Third, the MitoCarta detection is not alone: QuickGO
      records human PCBD2 (Q9H0N5) as located_in mitochondrion with HTP evidence from
      PMID:34800366, the contaminant-filtered MitoCoP proteome, and mouse Pcbd2's
      K120/K124/K131 acetylation comes from a liver mitochondrial acetylome
      (PMID:23576753), with succinylation at the same lysines from PMID:23806337 and
      SIRT3 and SIRT5 both being mitochondrial sirtuins. This is still one class of
      evidence - detection in organellar preparations - and so does not substitute for
      imaging or fractionation. A plant-side PAINT signal adds context rather than mouse
      evidence: PANTHER's PTHR12599 PAINT table carries a GO:0005739 IBD at the
      Embryophyta node seeded by Arabidopsis Q6QJ72, named
      "Pterin-4-alpha-carbinolamine dehydratase 2, mitochondrial", showing that this
      enzyme family can be organelle-targeted; however, the plant and mammalian
      extensions are not homologous presequences, and the vertebrate node PTN002650414
      carries only nucleoplasm, cytosol and GO:0008124 with no mitochondrial component.
      Three mammalian organellar preparations, one explicitly built to exclude
      contaminants, plus a presequence-like extension, do not fit the profile of a
      single co-purification artefact. Retained as non-core; experiments that would
      settle it are in suggested_experiments.
    supported_by:
    - reference_id: file:mouse/Pcbd2/Pcbd2-bioinformatics/RESULTS.md
      supporting_text: >-
        net charge +4 (positives' median is +4), 4 arginines (median 4), zero acidic
        residues (median 0), and a maximum mean hydrophobic moment of 0.423 against a
        positives' median of 0.416.
    - reference_id: PMID:34800366
      supporting_text: >-
        We classified >8,000 proteins in mitochondrial preparations of human cells and
        defined a mitochondrial high-confidence proteome of >1,100 proteins (MitoCoP).
    - reference_id: PMID:18614015
      supporting_text: >-
        MS-based approaches struggle with distinguishing genuine mitochondrial proteins
        from co-purifying contaminants, and published reports exhibit up to 41% false
        positive rates
- term:
    id: GO:0006571
    label: L-tyrosine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0004505
  review:
    summary: >-
      An inter-ontology logical inference whose WITH field names GO:0004505 as its
      source. A mechanical consequence of the mis-annotated molecular function, and it
      inherits the error.
    action: REMOVE
    reason: >-
      The rule is sound - a phenylalanine 4-monooxygenase does participate in tyrosine
      biosynthesis - but its premise is false for this gene. Tyrosine is made by Pah;
      Pcbd2 acts after the hydroxylation, on the spent cofactor. Under the project rule
      that a gene product is involved_in a process only if it performs some of the work
      of that process, Pcbd2 contributes nothing to tyrosine formation: the carbon
      skeleton of tyrosine never passes through it. Comparator: Qdpr, which performs the
      other BH4 regeneration step, is likewise not annotated as a tyrosine biosynthetic
      enzyme. Should disappear once GO:0004505 is corrected, but needs separate removal
      because the ARBA-sourced GO:0004505 would otherwise keep regenerating it.
