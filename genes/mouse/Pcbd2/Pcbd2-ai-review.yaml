id: Q9CZL5
gene_symbol: Pcbd2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Pcbd2 (DCoH2, DCoHm, PHS 2) is the paralog of Pcbd1 and, like it, a bifunctional
  moonlighting protein combining an enzymatic and a transcriptional activity in one
  small fold. As an enzyme it is pterin-4-alpha-carbinolamine dehydratase
  (EC 4.2.1.96), dehydrating (4aS,6R)-4a-hydroxy-tetrahydrobiopterin to
  quinonoid-6,7-dihydrobiopterin plus water; this is the regeneration step of the
  tetrahydrobiopterin cycle that follows aromatic amino acid hydroxylation, and the
  activity was demonstrated directly for this protein. As DCoH2 it binds the
  homeodomain transcription factor Hnf1a, increases Hnf1a dimerization and acts as a
  coactivator of HNF1-dependent transcription; in mouse intestine and liver this
  supports the HNF1A-FXR axis that controls bile acid transporter expression and
  systemic bile acid homeostasis. Its coactivator output is regulated by acetylation:
  Lys-124 and Lys-131 are acetylated, SIRT1 deacetylates them, and deacetylation
  promotes the Hnf1a interaction and Hnf1a DNA binding, so an acetylation-mimicking
  mutant is a poor coactivator. The protein is distributed between nucleus and
  cytoplasm, with strong nuclear staining in hepatic cells. Two properties distinguish
  it from Pcbd1: its tetramer is far less stable and readily disproportionates, giving
  a 2:2 complex with HNF1 rather than Pcbd1's hyperstable tetramer, which is thought to
  place DCoH2 regulation under thermodynamic rather than kinetic control; and it
  carries roughly 33 extra N-terminal residues, absent from Pcbd1, that are not present
  in either crystal structure. Pcbd2 has repeatedly been detected in mitochondrial
  preparations in mouse and human, and the N-terminal extension has the composition of
  a cleavable mitochondrial presequence, but import has not been demonstrated and
  UniProt records no transit peptide.
