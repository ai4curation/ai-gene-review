- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:24389307
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. The molecular function underlying the GO:0045893 process
      Pcbd2 already carries: it binds Hnf1a, increases Hnf1a dimerization, and an
      acetylation-mimicking mutant loses reporter activation in a mouse hepatic line.
      GOA currently has no annotation at all from PMID:24389307 despite that paper being
      UniProt's source for both FUNCTION and SUBCELLULAR LOCATION.
    action: NEW
    reason: >-
      The term fits the definition directly: "A transcription coregulator activity that
      activates or increases the transcription of specific gene sets via binding to a
      DNA-binding transcription factor at a specific genomic locus, either on its own or
      as part of a complex." Pcbd2 binds Hnf1a, a DNA-binding transcription factor, and
      increases transcription of its targets; the four coactivator mechanisms the
      definition lists afterwards are introduced as examples, so dimer stabilisation not
      being among them is not an exclusion. On the participation test, the entity doing
      the work is Pcbd2 itself - it is a component of the activating assembly, not an
      upstream requirement - and the KQ-mutant result is loss of coactivation by the
      protein, not loss of an input to someone else's activity. Comparator check, because
      the absence is systematic: QuickGO returns GO:0003713 for PCBD1 in human (TAS),
      mouse (ISO) and rat (IDA), and for PCBD2 in no species. That pattern usually means
      the term does not mean what one assumes, but here the better explanation is visible
      - human PCBD2 carries involved_in GO:0045893 with IDA from PMID:11980910, the paper
      that demonstrates its coactivation, so curators recorded the process for PCBD2 and
      both process and function for PCBD1. The function was not declined; the MF row is
      simply missing. GO:0003713 is neither ancestor nor descendant of GO:0045893 (one MF,
      one BP), so this is not redundancy. Conservatively this could be left as a question
      for MGI; it is proposed because the mouse-specific experimental evidence exists, is
      cached in full text, and is currently unused.
    supported_by:
    - reference_id: PMID:24389307
      supporting_text: >-
        KQ mutant protein displayed a significantly reduced ability to activate a
        luciferase reporter driven by the mouse FXR promoter in Hepa1-6 cells.
    - reference_id: PMID:24389307
      supporting_text: which increases dimerization of HNF-1α
    - reference_id: PMID:24389307
      supporting_text: >-
        SIRT1 was found to deacetylate Dcoh2, promoting its interaction with HNF-1α and
        inducing DNA binding by HNF-1α.
    - reference_id: PMID:11980910
      supporting_text: >-
        DCoH stabilizes HNF1alpha as a dimer and enhances its transcriptional activity
        on the beta-fibrinogen promoter reporter, and DCoHm had similar activity.
core_functions:
- description: >-
    Pterin-4-alpha-carbinolamine dehydratase (EC 4.2.1.96) activity in the
    tetrahydrobiopterin regeneration cycle. Pcbd2 dehydrates
    (4aS,6R)-4a-hydroxy-tetrahydrobiopterin - the carbinolamine intermediate released
    when BH4 serves as cofactor for the aromatic amino acid hydroxylases - to
    quinonoid-6,7-dihydrobiopterin plus water, which Qdpr then reduces back to BH4.
    Rose et al. demonstrated the activity for the DCoH2 protein itself, and UniProt
    records EC 4.2.1.96 for this entry with experimental evidence from that paper.
  molecular_function:
    id: GO:0008124
    label: 4-alpha-hydroxytetrahydrobiopterin dehydratase activity
  directly_involved_in:
  - id: GO:0006729
    label: tetrahydrobiopterin biosynthetic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15182178
    supporting_text: >-
      Like DCoH, DCoH2 forms a tetramer, displays pterin-4alpha-carbinolamine
      dehydratase activity, and binds HNF1alpha in vivo and in vitro.
  - reference_id: file:mouse/Pcbd2/Pcbd2-uniprot.txt
    supporting_text: "EC=4.2.1.96 {ECO:0000269|PubMed:15182178};"
- description: >-
    DCoH2 coactivator activity on HNF1-dependent transcription. Pcbd2 binds the
    homeodomain transcription factor Hnf1a, increases its dimerization and DNA binding,
    and increases transcription of HNF1 target promoters without contributing DNA
    binding of its own. The activity is acetylation-regulated: Lys-124 and Lys-131 are
    acetylated, SIRT1 deacetylates them and thereby promotes the Hnf1a interaction, and
    an acetylation-mimicking mutant is a poor coactivator. In mouse intestine and liver
    this drives the HNF1A-FXR axis controlling bile acid transporter expression. Unlike
    Pcbd1's hyperstable tetramer, the Pcbd2 tetramer readily disproportionates and forms
    a 2:2 complex with HNF1, which has been proposed to place DCoH2 under thermodynamic
    rather than kinetic control - a plausible basis for the two paralogs regulating HNF1
    differently.
