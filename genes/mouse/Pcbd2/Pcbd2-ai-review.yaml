- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:15182178
  qualifier: enables
  supporting_entities:
  - PR:Q9CZL5
  review:
    summary: >-
      Self-interaction. Pcbd2 is a homotetramer, but one that behaves quite differently
      from Pcbd1's: PMID:15182178 reports that it readily disproportionates.
    action: KEEP_AS_NON_CORE
    reason: >-
      Factually correct and experimentally grounded on this protein. Self-association is
      a structural property enabling both functions rather than a function in its own
      right - the PCD active site is formed at a subunit interface and the DCoH-HNF1
      assembly is built from dimers - so it is supportive, not core. The paralog-specific
      instability of this tetramer is biologically interesting (the paper proposes it
      places DCoH2 regulation under thermodynamic rather than kinetic control) but that
      is a property of the oligomer, not a distinct molecular function.
    supported_by:
    - reference_id: PMID:15182178
      supporting_text: >-
        In contrast to the hyperstable DCoH tetramer, DCoH2 readily disproportionates
        and forms a 2:2 complex with HNF1 in vitro.
