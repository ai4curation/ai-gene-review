      BH4 from the 4a-hydroxy-BH4 carbinolamine formed during aromatic amino acid
      hydroxylation.
    action: ACCEPT
    reason: >-
      Strictly, Pcbd2 acts in BH4 regeneration rather than de novo synthesis from GTP
      (the Gch1/Pts/Spr route), so the term is broader than the precise role, and GO
      has no regeneration child to move to. Pcbd2 does perform a chemical step whose
      product re-enters the BH4 pool, so it is a genuine participant rather than a
      substrate or a mere requirement. IPR001533/IPR036428 are the correct family
      signatures for this protein. Supported directly by UniProt's FUNCTION statement
      for this entry, which cites the experimental paper.
    supported_by:
    - reference_id: file:mouse/Pcbd2/Pcbd2-uniprot.txt
      supporting_text: Plays a role in tetrahydrobiopterin biosynthesis which is a
