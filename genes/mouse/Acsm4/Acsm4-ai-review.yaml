      biosynthesis.
    action: MODIFY
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001944787
        source_label: PTN001944787
        source_status: SUPPORTS_TRANSFER
        comment: Sound family-level process; for ACSM4 the specific step is fatty-acyl-CoA biosynthesis.
    reason: >-
      The root IBD is appropriately broad for a family whose members activate
      fatty acids and xenobiotic carboxylic acids, but for Acsm4 the substrates
      are medium-chain fatty acids (C6-C12) and the product is a fatty-acyl-CoA.
      GO:0046949 fatty-acyl-CoA biosynthetic process is an is_a descendant of
      acyl-CoA metabolic process. The gene does not yet carry this term.
    proposed_replacement_terms:
    - id: GO:0046949
      label: fatty-acyl-CoA biosynthetic process
    supported_by:
    - reference_id: file:mouse/Acsm4/Acsm4-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Capable of activating medium-chain fatty acids with a preference
        for C6-12 fatty acids (By similarity).
