- id: PMID:12709059
  title: O-MACS, a novel member of the medium-chain acyl-CoA synthetase family, specifically
    expressed in the olfactory epithelium in a zone-specific manner.
  findings:
  - statement: Rat O-MACS, the ortholog of mouse Acsm4, has acyl-CoA synthetase (fatty
      acid activation, ligase) activity, not fatty acid synthase activity, and localizes
      to mitochondria.
    supporting_text: Recombinant O-MACS protein tagged with c-Myc and His6 demonstrated
      an acyl-CoA synthetase activity for fatty acid activation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Paper on the rat ortholog, the source of all
      transferred activity rows on mouse Acsm4.
- id: PMID:11470804
  title: Molecular identification and characterization of two medium-chain acyl-CoA
    synthetases, MACS1 and the Sa gene product.
  findings:
  - statement: The paralogs MACS1 (Acsm1) and Sa (Acsm3) are mitochondrial matrix
      medium-chain acyl-CoA synthetases whose products are used mainly for oxidation.
    supporting_text: (14)C-Fatty acid incorporation studies indicated that acyl-CoAs
      produced by MACS1 and Sa protein are utilized mainly for oxidation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Mouse paralog paper, cited to examine the seeds
      of PAINT IBDs inherited by Acsm4.
