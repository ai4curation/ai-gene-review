  - UniProtKB:Q08AH1
  review:
    summary: >-
      Inherited from PAINT node PTN001292823, seeded by mouse Acsm3 (Sa protein)
      and bovine ACSM1, both fractionated to the mitochondrial matrix.
    action: ACCEPT
    reason: >-
      Acsm4 sits inside the clade that inherited this location and nothing argues
