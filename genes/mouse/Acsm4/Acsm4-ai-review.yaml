core_functions:
- description: >-
    ATP-dependent medium-chain fatty acid-CoA ligase (acyl-CoA synthetase, EC
    6.2.1.2) that activates C6-C12 fatty acids to their acyl-CoA thioesters in
    mitochondria; inferred from the experimentally characterised rat ortholog.
  supported_by:
  - reference_id: file:mouse/Acsm4/Acsm4-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Capable of activating medium-chain fatty acids with a preference
      for C6-12 fatty acids (By similarity).
  - reference_id: file:rat/Acsm4/Acsm4-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Capable of activating medium-chain fatty acids with a preference
      for C6-12 fatty acids (PubMed:12709059).
