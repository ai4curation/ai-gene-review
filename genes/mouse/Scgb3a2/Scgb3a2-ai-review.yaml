proposed_new_terms: []
suggested_questions:
- question: What is the receptor or molecular target that mediates SCGB3A2's growth-factor and anti-inflammatory signaling
    in lung epithelium, beyond direct PLA2 inhibition?
- question: Is the pituitary LH/FSH-modulating role a direct action of secreted SCGB3A2 or an indirect systemic effect?
suggested_experiments:
- description: Identify SCGB3A2-binding cell-surface partners (e.g. affinity capture / proximity labelling in airway epithelial
    and gonadotrope cells) to define the receptor underlying its growth-factor and immunomodulatory activities.
- description: Compare PLA2-inhibition-dead point mutants versus wild-type recombinant SCGB3A2 in the OVA and bleomycin
    models to test whether the anti-inflammatory/anti-fibrotic activity requires the PLA2 inhibitor activity.
