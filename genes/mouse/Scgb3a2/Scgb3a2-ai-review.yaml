description: Scgb3a2 (uteroglobin-related protein 1, UGRP1; pneumo secretory protein 1, PnSP-1) is a small secreted
  cytokine-like member of the secretoglobin superfamily, predominantly expressed by airway epithelial cells of the
  trachea, bronchi and bronchioles (including club cells) and transcriptionally controlled by NKX2-1 (T/EBP). The mature
  ~70-residue chain adopts the secretoglobin four-helix-bundle fold and forms a disulfide-linked homodimer (via Cys68),
  though a monomeric form is also observed. Biochemically the secreted protein is a phospholipase A2 inhibitor. In the
  respiratory tract it acts as an anti-inflammatory factor that dampens allergen-induced airway inflammation, and it has
  anti-fibrotic activity, since loss of Scgb3a2 potentiates ovalbumin-induced airway inflammation and worsens bleomycin-induced
  pulmonary fibrosis, while exogenous protein suppresses both. SCGB3A2 also behaves as a lung growth factor, promoting
  branching morphogenesis and maturation during fetal lung development, and in the pituitary may modulate gonadotropin
  (LH/FSH) expression. By similarity it binds the scavenger receptor MARCO and various pathogens.
