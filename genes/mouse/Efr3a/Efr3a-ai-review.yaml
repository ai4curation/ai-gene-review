description: Efr3a (protein EFR3 homolog A; Kiaa0143) is a non-enzymatic, all-alpha-helical ARM/HEAT-repeat
  protein on the cytoplasmic face of the plasma membrane. It is anchored there by palmitoylation of an
  N-terminal cysteine cluster (Cys6-Cys9) together with a conserved basic patch (K50, R53, R61, R68, R70)
  that binds acidic phospholipids; both features have been shown by mutagenesis of the mouse protein.
  By orthology with human EFR3A (same PANTHER subfamily, about 97% identical), its C terminus binds the
  TTC7-FAM126 subcomplex of the phosphatidylinositol 4-kinase type III alpha (PI4KA) complex, so Efr3a
  acts as the membrane anchor that recruits PI4KA to the plasma membrane, where PI4KA makes the plasma-membrane
  pool of phosphatidylinositol 4-phosphate. It is partly redundant with its paralog Efr3b. Efr3a is widely
  expressed and abundant in brain, including auditory brainstem neurons, where its expression changes
  after hearing loss. In mice, brain-specific deletion enhances adult hippocampal neurogenesis and BDNF-TrkB
  signaling, and reducing Efr3a dampens Gq-coupled mGluR5 responsiveness and protects against amyloid-beta-induced
  loss of presynaptic PI(4,5)P2 and release probability; these are probably indirect consequences of altered
  plasma-membrane phosphoinositide supply.
