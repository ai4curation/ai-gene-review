- evidence_type: IDA
  original_reference_id: PMID:30867420
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    reason: 'I read the full text of PMID:30867420. Efr3a was used as a genetic tool to lower Gq-coupled
      GPCR (mGluR5) responsiveness: halving Efr3a, or deleting it in CA3 (presynaptic) neurons, prevented
      amyloid-beta oligomers from depleting PI(4,5)P2 and lowering release probability at SC-CA1 synapses
      in APP/PS1 mice or Abeta-treated slices. The paper shows that Efr3a dosage modifies a pathology-induced
      loss of release probability; it does not show that Efr3a performs a step of synaptic vesicle priming
      (for example Munc13/Munc18-dependent SNARE assembly) or report a baseline priming defect in the
      knockout. The authors themselves describe Efr3a as an adaptor of the PI4KIIIalpha complex, which
      acts at the plasma membrane of essentially all cells; any effect on priming lies several steps downstream
      via phosphoinositide supply. PAINT propagated plasma membrane and protein localization to plasma
      membrane at PTN000278197 but not this term. Because this is an experimental annotation by SynGO
      curators, it is marked as over-annotated rather than removed; it should not be used as a source
      for transfer to orthologs (the human Compara copy is removed in genes/human/EFR3A).'
    summary: SynGO IDA annotation to synaptic vesicle priming based on Efr3a manipulation in an Alzheimer
      disease model (PMID:30867420).
    supported_by:
    - reference_id: PMID:30867420
      supporting_text: One way to control the PIP2 level is to manipulate the responsiveness of Gαq-coupled
        GPCRs. The mammalian pho eighty-five requiring 3 (Efr3) proteins can control GPCR responsiveness
    - &id005
      reference_id: PMID:30867420
      supporting_text: Taken together, these results indicate that reducing Efr3a is an effective method
        to inhibit Aβ-induced PIP2 depletion.
    - &id006
      reference_id: PMID:30867420
      supporting_text: It has long been known that Efr3a functions as an adaptor in the type IIIɑ phosphatidylinositol
        4-kinase (PI4KIIIα) complex
  term:
    id: GO:0016082
    label: synaptic vesicle priming
