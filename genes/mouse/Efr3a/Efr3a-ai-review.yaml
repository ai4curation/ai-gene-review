- id: file:mouse/Efr3a/Efr3a-uniprot.txt
  title: UniProt record for mouse Efr3a (Q8BG67)
  findings: []
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
core_functions:
- description: Palmitoylated, basic-patch-anchored plasma-membrane scaffold that tethers the PI4KA-TTC7-FAM126
    phosphatidylinositol 4-kinase complex to the plasma membrane. Membrane anchoring is shown on the mouse
    protein; binding of the TTC7-FAM126 subcomplex and PI4KA recruitment are inferred from human EFR3A.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0072659
    label: protein localization to plasma membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:24360784
    supporting_text: Basic patch mutations analogous to those in yeast Efr3-3 were generated in murine
      EFR3A-GFP (K50E, R53A, R61E, R68E, and R70E)
  - reference_id: PMID:23229899
    supporting_text: These data suggest that EFR3 is a peripheral membrane protein whose posttranslational
      lipidation enables its localization to membranes and its function in PI4KIIIα-mediated PtdIns4P
      synthesis at the plasma membrane.
  - reference_id: PMID:39705356
    supporting_text: Complex disrupting mutations in TTC7B, FAM126A, and EFR3 decrease PI4KA recruitment
      to the plasma membrane.
suggested_questions:
- question: Should the SynGO synaptic vesicle priming and glutamatergic synapse annotations for Efr3a
    (PMID:30867420) be withdrawn or re-curated, given that the data show a disease-model modifier effect
    on release probability rather than participation in priming or synaptic localization?
- question: Why does MGI carry three 2006 ISO rows (cornified envelope, protein homodimerization activity,
    cell-cell adhesion) for Efr3a with human CDSN (Q15517) as the donor? Is this a gene-identifier mapping
    error that affects other genes?
- question: Is the PI4KA-dependent PI4P pool in mouse neurons reduced in Efr3a single knockouts, or does
    Efr3b fully compensate?
suggested_experiments:
- description: Measure plasma-membrane PI4P and PI(4,5)P2 with biosensors, and baseline readily-releasable
    pool size, in Efr3a single and Efr3a/Efr3b double knockout hippocampal neurons, to test whether Efr3a
    has a direct, non-redundant presynaptic role independent of amyloid-beta.
- description: Express mouse Efr3a C-terminal interface mutants (equivalent to the human EFR3A-TTC7B/FAM126A
    interface mutants) in Efr3a/Efr3b-null mouse cells and measure PI4KA recruitment, to confirm the adaptor
    activity directly in the mouse protein.
