    action: ACCEPT
    reason: 'Recruiting the PI4KA-TTC7-FAM126 complex to the plasma membrane is the core process EFR3
      proteins perform: EFR3 is itself the lipidated membrane anchor. In mouse this is supported by direct
      data on the membrane-anchoring half of the activity (palmitoylation and basic-patch mutants of mouse
      EFR3A lose plasma-membrane localization), while the recruitment step itself (EFR3 knockdown, EFR3B
      palmitoylation mutant, EFR3A C-terminal interface mutants) was shown in human cells and for human
      EFR3A/EFR3B. Transfer is justified by orthology (same PANTHER subfamily PTHR12444:SF1, PAINT node
      PTN000278197).'
