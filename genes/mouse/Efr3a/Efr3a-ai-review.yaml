  title: 'Mouse homolog of KIAA0143 protein: hearing deficit induces specific changes of expression in
    auditory brainstem neurons.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. Cloning of mouse Kiaa0143/Efr3a, GFP-tagged plasma-membrane
