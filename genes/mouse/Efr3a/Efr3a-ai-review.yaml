- findings: []
  id: PMID:30867420
  title: Amyloid β oligomers suppress excitatory transmitter release via presynaptic depletion of phosphatidylinositol-4,5-bisphosphate.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached and read. Source of the SynGO synaptic vesicle priming and glutamatergic
      synapse rows. Efr3a is used as a genetic modifier of Abeta-induced, mGluR5-mediated PIP2 depletion;
      it does not show participation in priming or synaptic localization.
- id: PMID:23229899
  title: PtdIns4P synthesis by PI4KIIIα at the plasma membrane and its impact on plasma membrane identity.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached. The EFR3A constructs are mouse Efr3a (GenBank BC007482, a Q8BG67
      cross-reference): palmitoylation of Cys6-Cys9 is required for plasma-membrane localization. Recruitment
      assays in HeLa cells used siRNA against human EFR3A/EFR3B and an EFR3B palmitoylation mutant.'
- id: PMID:24360784
  title: Structural insights into assembly and regulation of the plasma membrane phosphatidylinositol
    4-kinase complex.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Structure is of yeast Efr3-Ypp1 (a different PANTHER family); the
      mammalian test is a basic-patch quintuple mutant of murine EFR3A-GFP that loses plasma-membrane
      localization.
- id: PMID:39705356
  title: Molecular basis for plasma membrane recruitment of PI4KA by EFR3.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Cryo-EM/HDX-MS of human EFR3A C terminus bound to TTC7B-FAM126A with
      interface mutagenesis; the basis for transferring the protein-binding half of the adaptor activity
      to mouse Efr3a by orthology.
- id: PMID:25380825
  title: EFR3s are palmitoylated plasma membrane proteins that control responsiveness to G-protein-coupled
    receptors.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. Human cell (HEK293) data; combined EFR3A/EFR3B depletion
      alters AT1 receptor desensitization. Cited by UniProt for wide tissue expression of mouse Efr3a.
      Not used as annotation support; the GPCR effect is probably indirect.
- id: PMID:28193719
  title: Brain-specific ablation of Efr3a promotes adult hippocampal neurogenesis via the brain-derived
    neurotrophic factor pathway.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. Nestin-Cre Efr3a knockout mouse phenotype (more neurogenesis,
      increased BDNF-TrkB signaling). Organismal phenotype with no mechanism linking it to Efr3a activity;
      not annotated.
- id: PMID:35754370
  title: RNA Binding Protein Rbms1 Enables Neuronal Differentiation and Radial Migration during Neocortical
    Development by Binding and Stabilizing the RNA Message for Efr3a.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached. Shows that Rbms1 stabilizes Efr3a mRNA and that Efr3a overexpression
      rescues Rbms1-knockdown migration defects in developing mouse cortex. Regulation of Efr3a and a
      rescue phenotype; not annotated as Efr3a process participation.
