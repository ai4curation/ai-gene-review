- evidence_type: ISS
  original_reference_id: PMID:39705356
  review:
    action: NEW
    reason: 'GOA has no molecular function for mouse Efr3a. The membrane-binding half of the adaptor activity
      is shown directly on the mouse protein: the mouse EFR3A cDNA (BC007482 = Q8BG67) loses plasma-membrane
      localization when Cys6-Cys9 are mutated (PMID:23229899) or when the basic patch K50/R53/R61/R68/R70
      is mutated (PMID:24360784). The protein-binding half (direct C-terminal contact with TTC7B and FAM126A,
      and loss of PI4KA recruitment when that interface is disrupted) was shown for human EFR3A (PMID:39705356).
      Mouse and human EFR3A are orthologs in PANTHER subfamily PTHR12444:SF1 with 97% identity, so the
      activity is transferred with ISS; the human review asserts the same term by IDA.'
    summary: Efr3a binds the plasma membrane through its palmitoylated N-terminal cysteines and conserved
      basic patch and, by orthology with human EFR3A, binds the TTC7-FAM126 subcomplex through its C terminus,
      tethering the PI4KA complex to the membrane.
    supported_by:
    - *id013
    - *id003
    - *id014
    - reference_id: PMID:39705356
      supporting_text: The EFR3A C terminus undergoes a disorder-order transition upon binding to the
        PI4KA complex, with an unexpected direct interaction with both TTC7B and FAM126A.
    - *id010
    - *id011
