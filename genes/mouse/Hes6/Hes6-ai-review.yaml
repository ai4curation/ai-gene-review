  review:
    summary: Cossins et al. reported that Hes6 binds DNA containing the ESE motif.
    action: KEEP_AS_NON_CORE
    reason: 'DNA binding by mouse Hes6 is contested: Bae et al. (PMID:10851137) found that Hes6 alone
      does not bind DNA (attributed to its shortened loop), whereas Cossins et al. (PMID:11959828) reported
      binding to the ESE box and Gao et al. (PMID:11551980) inferred N-box occupancy in myoblasts from
      a HES6-VP16 fusion, plausibly as a heterodimer. The myogenic, proneural and anti-gliogenic activities
      of Hes6 do not require its own basic-arm DNA binding (PMID:11959828, PMID:17065448). The DNA-binding
      claim is therefore retained but non-core. The curator read the full text (abstract-only in our cache),
      so the IDA is deferred to and kept.'
    supported_by:
