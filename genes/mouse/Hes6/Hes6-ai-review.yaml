suggested_questions:
- question: Does mouse Hes6 bind DNA as a homodimer, or only as a heterodimer (e.g. with Hes1 or other
    bHLH partners)? Bae et al. (PMID:10851137) found no binding by Hes6 alone, while Cossins et al. (PMID:11959828)
    and Gao et al. (PMID:11551980) report ESE- and N-box binding. The answer decides whether DNA-binding
    transcription factor terms should be core for Hes6.
- question: Does mouse Hes6 contribute to segmentation-clock function or somite anterior/posterior patterning,
    as its zebrafish SF11 ortholog does through Her7:Hes6 heterodimers? The mouse GO:0009952 annotation
    rests solely on IBA.
suggested_experiments:
- hypothesis: Mouse Hes6 binds DNA only as a heterodimer, not as a homodimer.
  description: Quantitative EMSA or fluorescence anisotropy with purified Hes6 homodimer, Hes1:Hes6 and
    Hes1 homodimer on N-box, class C E-box and ESE probes, with a matching ChIP-seq of tagged Hes6 in
    cortical progenitors.
  experiment_type: biochemical DNA-binding assay and ChIP-seq
- hypothesis: Loss of Hes6 alters segmentation-clock oscillations or somite polarity in mouse, either
    alone or together with Hes7.
  description: Live imaging of a Hes7 or Lfng oscillation reporter in the presomitic mesoderm of Hes6-/-
    and Hes6;Hes7 compound mutants, with somite A/P marker (Uncx, Tbx18) in situ hybridisation.
  experiment_type: genetic perturbation with live reporter imaging
