    summary: Cossins et al. report Hes6 binding to ESE E-box DNA.
    action: KEEP_AS_NON_CORE
    reason: 'DNA binding by Hes6 is contested: Bae et al. found Hes6 alone does not bind DNA, Cossins
      et al. found ESE binding, and Gao et al. inferred N-box occupancy from a Hes6-VP16 reporter. The
      proneural, anti-gliogenic and myogenic activities do not need the basic DNA-binding arm. In zebrafish,
      Hes6 homodimers bind DNA only weakly and Her7:Hes6 heterodimers bind strongly. I keep the curator''s
