id: Q9JHE6
gene_symbol: Hes6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Hes6 (Hairy and enhancer of split 6) is a 224-residue nuclear bHLH-Orange protein of the
  HES/HEY family ending in the Groucho/TLE-recruiting WRPW motif. Unlike Notch-induced Hes1 and Hes5,
  Hes6 is induced by proneural bHLH factors (neurogenins, Mash1, Math1) and by MyoD/Myf5, and it is expressed
  in differentiating neurons, inner-ear hair cells, myotome and several embryonic epithelia. Its best-established
  activity is antagonism of Hes1. Hes6 heterodimerises with Hes1, blocks Hes1 repression and Hes1 binding
  to Gro/TLE, and promotes Hes1 degradation. This relieves inhibition of proneural Mash1-E47 activity
  and promotes neuronal differentiation. Hes6 also forms homodimers that suppress astrocyte differentiation
  of cortical progenitors, a function that depends on its conserved C-terminal motifs and MAPK phosphorylation
  rather than on Hes1 antagonism. Hes6 can bind TLE1 and repress transcription when brought to DNA. Whether
  it binds DNA on its own is disputed (ESE/N-box binding has been reported but not reproduced), and its
  neural and myogenic activities do not need its basic DNA-binding region. Hes6 also regulates myoblast
  differentiation and actin organisation in C2C12 cells. Hes6-null mice are viable and have no gross developmental
  defects, with only a mild reduction of neuroblast differentiation in the adult dentate gyrus.
