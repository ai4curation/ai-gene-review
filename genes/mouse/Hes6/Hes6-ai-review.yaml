- term:
    id: GO:0030154
    label: cell differentiation
  evidence_type: IDA
  original_reference_id: PMID:11959828
  qualifier: acts_upstream_of_or_within
  review:
    summary: Cell differentiation, from C2C12 overexpression (Cossins et al.).
    action: MODIFY
    reason: The data concern myoblast differentiation specifically. Overexpression impairs C2C12 differentiation
      (Cossins), constitutive expression induced differentiation in another study (Gao), and knockdown
      affects actin organisation, motility and fusion but not differentiation markers (Malone). With effects
      in both directions, 'regulation of myoblast differentiation' is the defensible replacement. This
      is not a core function.
    proposed_replacement_terms:
    - id: GO:0045661
      label: regulation of myoblast differentiation
    supported_by:
    - reference_id: PMID:11959828
      supporting_text: When overexpressed in C2C12 cells, Hes6 impairs normal differentiation
    - reference_id: PMID:11551980
      supporting_text: Constitutive expression of HES6 in myoblasts inhibited expression of MyoR, a repressor
        of myogenesis, and induced differentiation
    - reference_id: PMID:21501606
      supporting_text: Knockdown of Hes6 mRNA levels by siRNA has no effect on cell cycle exit or induction
        of myosin heavy chain expression in differentiating C2C12 myoblasts, but F-actin filament formation
        is disrupted and both cell motility and myoblast fusion are reduced.
