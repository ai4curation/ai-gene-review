gene_symbol: Hes6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Hes6 is an atypical member of the Hairy/Enhancer of split (HES) family of basic helix-loop-helix-Orange
  (bHLH-O) transcriptional regulators, with a C-terminal WRPW motif that binds Groucho/TLE corepressors.
  Unlike Hes1 and Hes5, it is not a Notch effector and it promotes rather than inhibits differentiation.
  Its shortened loop impairs autonomous DNA binding, and its main documented activity is to heterodimerise
  with Hes1 and antagonise it: Hes6 blocks Hes1 repression of N-box targets, displaces Gro/TLE from Hes1,
  promotes Hes1 degradation, and so allows proneural bHLH complexes such as Mash1-E47 to activate transcription.
  Hes6 can also repress transcription through TLE when bound to N-box or E-box (ESE) elements, though
  its direct DNA binding is disputed. It is nuclear and is expressed in neural progenitors and differentiating
  neurons, myotome and differentiating myoblasts, and several embryonic epithelia. In the developing and
  adult mouse brain it promotes neuronal differentiation and suppresses astrocyte differentiation, and
  it modulates myoblast differentiation and fusion.'
