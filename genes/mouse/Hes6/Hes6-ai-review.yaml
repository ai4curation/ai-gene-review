  review:
    summary: Negative regulation of Pol II transcription, propagated from PAINT node PTN004213585 (eukaryote-level
      HES/HEY node); mouse Hes6 is itself one of the experimental seeds.
    action: ACCEPT
    reason: 'Mouse Hes6 has a WRPW-dependent repressor capacity: it binds TLE1 and represses an N-box
      template and a GAL4-tethered reporter, and it represses an ESE reporter. The target lies inside
      the HES/HEY clade that inherited this function and there is no evidence of loss. Repression is one
      of the two sides of Hes6 transcriptional output (the other being derepression of Hes1 targets).'
