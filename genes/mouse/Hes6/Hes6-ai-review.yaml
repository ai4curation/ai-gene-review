- id: PMID:10851137
  title: The bHLH gene Hes6, an inhibitor of Hes1, promotes neuronal differentiation.
  findings:
  - statement: Hes6 alone does not bind DNA but antagonises Hes1 repression and enables Mash1-E47 activation.
    supporting_text: Hes6 alone does not bind to the DNA but suppresses Hes1 from repressing transcription
- id: PMID:11076679
  title: Oscillating expression of c-Hey2 in the presomitic mesoderm suggests that the segmentation clock
    may use combinatorial signaling through multiple interacting bHLH factors.
  findings:
  - statement: Hairy-related bHLH proteins directly homo- and heterodimerise.
    supporting_text: demonstrated direct homo- and heterodimerisation between these hairy-related bHLH
      proteins
- id: PMID:11959828
  title: Hes6 regulates myogenic differentiation.
  findings:
  - statement: Hes6 binds the ESE box and represses an ESE reporter; DNA binding is not required for its
      myogenic phenotype.
    supporting_text: Hes6 binds DNA containing the Enhancer of Split E box (ESE) motif, the preferred
      binding site of Drosophila EoS proteins, and represses transcription of an ESE box reporter
- id: PMID:11551980
  title: HES6 acts as a transcriptional repressor in myoblasts and can induce the myogenic differentiation
    program.
  findings:
  - statement: Mouse HES6 binds TLE1 through its WRPW motif.
    supporting_text: HES6 interacted with the corepressor transducin-like Enhancer of split 1 in yeast
      and mammalian cells through its WRPW COOH-terminal motif
- id: PMID:12972610
  title: Hes6 promotes cortical neurogenesis and inhibits Hes1 transcription repression activity by multiple
    mechanisms.
  findings:
  - statement: Hes6 blocks Hes1-Gro/TLE interaction and promotes Hes1 degradation.
    supporting_text: Hes6 inhibits the interaction of Hes1 with its transcriptional corepressor Gro/TLE.
      Moreover, it promotes proteolytic degradation of Hes1.
- id: PMID:17065448
  title: Hes6 inhibits astrocyte differentiation and promotes neurogenesis through different mechanisms.
  findings:
  - statement: Hes6 knockdown in cortical progenitors causes excess astrocyte differentiation.
    supporting_text: knockdown of endogenous Hes6 causes supernumerary cortical progenitors to differentiate
      into cells that exhibit an astrocytic morphology and express the astrocyte marker protein GFAP
- id: PMID:17868320
  title: Inhibition of cortical astrocyte differentiation by Hes6 requires amino- and carboxy-terminal
    motifs important for dimerization and phosphorylation.
  findings:
  - statement: Hes6 preferentially homodimerises.
    supporting_text: It is reported that Hes6 preferentially forms homodimers.
- id: PMID:26105991
  title: Hairy and Enhancer of Split 6 (Hes6) Deficiency in Mouse Impairs Neuroblast Differentiation in
    Dentate Gyrus Without Affecting Cell Proliferation and Integration into Mature Neurons.
  findings:
  - statement: Hes6 knockout mice show impaired dentate gyrus neuroblast differentiation.
    supporting_text: Hes6 knockout negatively affects neuroblast differentiation based on DCX immunohistochemistry.
- id: PMID:26435136
  title: Sumoylation of Hes6 Regulates Protein Degradation and Hes1-Mediated Transcription.
  findings:
  - statement: Sumoylation of Hes6 at K27/K30 reduces its stability.
    supporting_text: Overexpression of SUMO led to sumoylation of Hes6 at both lysine 27 and 30. Protein
      stability of Hes6 was decreased by sumoylation.
- id: PMID:23689134
  title: Interaction and antagonistic roles of NF-κB and Hes6 in the regulation of cortical neurogenesis.
  findings:
  - statement: Hes6 physically and functionally interacts with RelA-containing NF-kB complexes in cortical
      progenitors.
    supporting_text: which physically and functionally interacts with RelA-containing NF-κB complexes
      in cortical progenitor cells
- id: PMID:29404444
  title: Hairy and enhancer of split 6 prevents hepatic lipid accumulation through inhibition of Pparg2
    expression.
  findings:
  - statement: Hepatic Hes6 represses Pparg2 expression.
    supporting_text: HES6 represses Pparg2 gene expression, thereby preventing hepatic lipid accumulation
- id: PMID:21501606
  title: Hes6 is required for actin cytoskeletal organization in differentiating C2C12 myoblasts.
  findings:
  - statement: Hes6 knockdown disrupts F-actin and reduces myoblast motility and fusion.
    supporting_text: F-actin filament formation is disrupted and both cell motility and myoblast fusion
      are reduced
- id: PMID:10906477
  title: Expression of hes6, a new member of the Hairy/Enhancer-of-split family, in mouse development.
  findings:
  - statement: Hes6 is expressed in embryonic nervous system, muscle and thymus.
    supporting_text: High levels of expression are observed in several embryonic tissues where Notch signaling
      is known to control cell-fate decisions, like the nervous system, muscle and thymus
- id: PMID:11044617
  title: Expression of mouse HES-6, a new member of the Hairy/Enhancer of split family of bHLH transcription
    factors.
  findings:
  - statement: Hes6 is expressed in neurogenic placodes, brain, DRG and myotomes.
    supporting_text: HES-6 is expressed in all neurogenic placodes and their derivatives and in the brain
