      supporting_text: Hes6 alone does not bind to the DNA but suppresses Hes1 from repressing transcription
    - reference_id: PMID:17065448
      supporting_text: neither its proneuronal nor its anti-gliogenic functions appear to depend on Hes6
        ability to bind to DNA via the basic arm of its bHLH domain
