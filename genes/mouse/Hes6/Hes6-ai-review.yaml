- term:
    id: GO:0048712
    label: negative regulation of astrocyte differentiation
  evidence_type: IMP
  original_reference_id: PMID:17065448
  review:
    summary: Hes6 suppresses astrocyte differentiation of mouse cortical progenitors.
    action: NEW
    reason: 'Knockdown of endogenous Hes6 in cortical progenitors gives supernumerary GFAP+ astrocytic
      cells, and exogenous Hes6 inhibits astrocyte differentiation. This anti-gliogenic activity is separable
      from the proneural one and depends on Hes6 homodimers, the LNHLL/WRPW motifs and MAPK phosphorylation
      of a C-terminal SPXXSP motif. Hes6 is a nuclear transcription regulator acting in the progenitor
      whose fate is regulated, so it takes part in the regulation itself and the term is not a downstream
      organismal phenotype. Comparator check (QuickGO, mouse): Hes5 (P70120) carries this same term by
      IDA, and Hes1 (P35428) carries GO:0048711 positive regulation of astrocyte differentiation by IDA.
      Regulation-of-astrocyte-differentiation terms are therefore conventional for HES transcriptional
      regulators acting in cortical progenitors.'
    supported_by:
    - *id018
    - reference_id: PMID:17868320
      supporting_text: Hes6 homodimers regulate astrocyte differentiation through mechanisms that depend
        on the phosphorylation of Hes6 C-terminal domain but are independent of its ability to suppress
        Hes1-mediated transcriptional repression.
