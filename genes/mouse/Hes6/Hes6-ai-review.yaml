  review:
    summary: 'Anterior/posterior pattern specification, propagated from PTN000105428 (seeds: Hes7/Hey/Her
      segmentation-clock genes, including zebrafish hes6).'
    action: MARK_AS_OVER_ANNOTATED
    reason: Mouse Hes6 is not a seed for this node, and no mouse data link Hes6 to the segmentation clock
      or A/P patterning. Hes6-null mice show no reported developmental defects, inner-ear analysis included,
      'similar to observations in other tissues'. Of the SF11 subfamily, only zebrafish Hes6, acting as
      a Her7:Hes6 heterodimer, has a segmentation-clock role. In fish this term is also partly a downstream
      organismal readout rather than a direct activity. Propagating it to mammalian Hes6 overstates the
      evidence.
    supported_by:
    - *id009
    - &id014
      reference_id: PMID:10976052
      supporting_text: Hes6 expression occurs in developing neurons and is induced by the proneural bHLH
        proteins but not by the Notch pathway.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000105428
        source_label: PTN000105428
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Seeds are segmentation-clock and patterning HES/HEY/Her genes, including zebrafish hes6
