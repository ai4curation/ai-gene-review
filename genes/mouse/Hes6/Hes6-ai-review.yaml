core_functions:
- description: Antagonises the Notch effector Hes1. Hes6 heterodimerises with Hes1, blocks Hes1 transcriptional
    repression and the Hes1-Gro/TLE interaction, and promotes Hes1 degradation. This relieves repression
    of proneural bHLH (Mash1-E47) targets. Established experimentally in mouse.
  molecular_function:
    id: GO:0140416
    label: transcription regulator inhibitor activity
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0045666
    label: positive regulation of neuron differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id003
  - *id008
  - *id019
  - *id010
- description: Binds Hes1, a Pol II-specific DNA-binding transcription factor, through bHLH heterodimerisation.
    This is the physical basis of Hes1 antagonism.
  molecular_function:
    id: GO:0061629
    label: RNA polymerase II-specific DNA-binding transcription factor binding
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
