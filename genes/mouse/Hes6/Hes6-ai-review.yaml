  review:
    summary: Negative regulation of RNA polymerase II transcription, propagated from PAINT node PTN004213585
      (HES/HEY family); mouse Hes6 is itself one of the seeds.
    action: KEEP_AS_NON_CORE
    reason: Mouse HES6 represses N-box and ESE-box reporters and GAL4-tethered templates through its WRPW
      motif and TLE corepressors (PMID:11551980, PMID:11959828), so the family-level repressor claim holds
      for Hes6. However, its best-characterised role is to antagonise Hes1 repression and thereby derepress
      proneural targets (PMID:10851137, PMID:12972610), so repression is retained as non-core rather than
      as the defining activity.
