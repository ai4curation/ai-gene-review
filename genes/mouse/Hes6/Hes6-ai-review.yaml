suggested_questions:
- question: Does Hes6 bind DNA as a homodimer in vivo, or only as part of heterodimers (as zebrafish Her7:Hes6)?
    Bae et al. and Cossins et al. disagree on autonomous binding.
- question: Why are Hes6-null mice largely normal despite strong gain- and knockdown-of-function phenotypes
    in cortical progenitors and myoblasts? Is there redundancy with other HES proteins or compensation?
- question: Should GO:0009952 anterior/posterior pattern specification at PTN000105428 be excluded from
    mammalian HES6, given that only zebrafish hes6 has segmentation-clock evidence?
suggested_experiments:
- description: ChIP-seq or CUT&RUN of endogenous Hes6 in differentiating cortical progenitors, compared
    with a basic-region DNA-binding mutant, to test whether Hes6 occupies chromatin directly or through
    Hes1/partner heterodimers.
- description: Conditional or compound Hes6;Hes5 or Hes6;Hes1 heterozygous mouse mutants to unmask an
    in vivo requirement for Hes6 in cortical neurogenesis versus gliogenesis.
