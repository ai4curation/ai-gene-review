core_functions:
- description: Full-length mouse Casp9 is recruited through its CARD domain to the APAF1 apoptosome and acts as the intrinsic-pathway initiator protease that matures executioner caspases, especially caspase-3 and caspase-7, to promote the execution phase of apoptosis.
