- term:
    id: GO:0008630
    label: intrinsic apoptotic signaling pathway in response to DNA damage
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002572986
  - UniProtKB:P55211
  review:
    summary: DNA damage is a real Casp9-dependent apoptotic trigger in mouse neural precursors, but it is one branch into the broader intrinsic pathway.
    action: MODIFY
    reason: Casp9-deficient mouse neural precursors resist DNA damage-induced apoptosis, so the branch is biologically real. As an inherited or automated assertion, however, the DNA-damage-specific child term should be generalized to intrinsic apoptotic signaling because Casp9 acts after apoptosome formation rather than as a DNA-damage sensor.
    proposed_replacement_terms:
    - id: GO:0097193
      label: intrinsic apoptotic signaling pathway
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002572986
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The PAINT node supports a DNA-damage intrinsic-apoptosis source assertion, but Casp9 acts after apoptosome formation and the broader intrinsic apoptotic signaling term is a safer inherited mouse target.
    supported_by:
    - reference_id: PMID:11092819
      supporting_text: DNA damage-induced neural precursor cell apoptosis, both in vitro and in vivo, was critically dependent on p53 and caspase 9
