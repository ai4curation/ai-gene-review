        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The PAINT node supports inherited caspase apoptosis biology, but mouse Casp9 is the intrinsic initiator and the top-level apoptotic-process term should be narrowed.
    supported_by:
    - reference_id: file:mouse/Casp9/Casp9-notes.md
      supporting_text: Top-level apoptotic-process and generic apoptosis-regulation rows were supported from the
