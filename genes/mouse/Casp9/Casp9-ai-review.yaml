suggested_questions:
- question: Which mouse stress-specific Casp9 annotations from older ER-stress and hormone-response literature represent direct Casp9 participation, and which are endpoint apoptosis readouts that should remain unpropagated?
- question: How much of the reported nuclear Casp9 pool in Nucling-dependent stress apoptosis represents a functional apoptosome-associated pool rather than relocalized inactive complex?
suggested_experiments:
- description: Use endogenous Casp9 catalytic-dead and CARD-disrupting knock-in alleles in mouse cells to separate apoptosome recruitment, executioner-caspase maturation, and distal stress-response phenotypes.
- description: Repeat ER-stress and dexamethasone-induced apoptosis assays with modern Casp9 activity reporters and rescue by wild-type versus catalytic-dead Casp9 to determine which stimulus annotations reflect direct Casp9 execution.
