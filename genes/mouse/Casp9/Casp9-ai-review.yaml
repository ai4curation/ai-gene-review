- term:
    id: GO:0042981
    label: regulation of apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001315
  review:
    summary: Casp9 is not a generic apoptosis regulator; it is a positive initiator of apoptotic execution after apoptosome activation.
    action: MODIFY
    reason: A CARD-domain InterPro hit supports apoptosome recruitment, but the most informative process term for the full-length enzyme is positive regulation of the execution phase through effector-caspase maturation.
    proposed_replacement_terms:
    - id: GO:1900119
      label: positive regulation of execution phase of apoptosis
    supported_by:
    - reference_id: file:mouse/Casp9/Casp9-notes.md
      supporting_text: Top-level apoptotic-process and generic apoptosis-regulation rows were supported from the
        synthesized apoptosome role and narrowed to intrinsic apoptotic signaling rather than all citing the same
        PMID:12097332 procaspase-3 cleavage sentence.
