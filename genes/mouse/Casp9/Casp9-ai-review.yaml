---
id: Q8C3Q9
gene_symbol: Casp9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Casp9 encodes mouse caspase-9, the CARD-containing initiator caspase of the intrinsic mitochondrial apoptosis pathway. Pro-caspase-9 is recruited to APAF1 apoptosomes after mitochondrial cytochrome c release, where proximity-induced activation allows caspase-9 to cleave and mature executioner procaspases and thereby amplify the execution phase of apoptosis. Mouse genetics place Casp9 in both developmental neuronal apoptosis and DNA-damage-induced neural precursor apoptosis, while more specialized stress and tissue phenotypes are contextual branches of this core initiator caspase activity.'
