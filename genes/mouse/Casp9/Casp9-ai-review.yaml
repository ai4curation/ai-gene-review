  review:
    summary: Casp9 acts as the apoptosome-associated initiator caspase in intrinsic apoptosis; the top-level apoptotic-process term can be tightened.
    action: MODIFY
    reason: The broad apoptosis assertion is biologically correct, but Casp9 is specifically the intrinsic initiator downstream of APAF1/cytochrome c apoptosome assembly, so GO:0097193 is a better process term.
    proposed_replacement_terms:
    - id: GO:0097193
      label: intrinsic apoptotic signaling pathway
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
