- term:
    id: GO:0010507
    label: negative regulation of autophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002246859
  - UniProtKB:Q96QG7
  review:
    summary: Negative regulation of autophagy through the MTMR8-MTMR9 complex, a function shown for the
      human proteins.
    action: KEEP_AS_NON_CORE
    reason: In human cells the MTMR8/MTMR9 complex lowers PI3P and inhibits autophagy (PMID:22647598).
      MTMR9 does part of this work by activating MTMR8, so the process claim is legitimate, and PAINT
      placed it at the eumetazoan MTMR9-lineage node PTN002246859, which includes mouse Mtmr9 (PTHR10807:SF56).
      The seeding of that node by human MTMR9 alone is expected, not weak support. However, the effect
      has not been tested in mouse, and it is a downstream cellular consequence of regulating one partner's
      lipid phosphatase activity rather than the core function, so all three rows (IBA, IEA, ISO) are
      kept as non-core.
    supported_by:
    - &id006
      reference_id: PMID:22647598
      supporting_text: the MTMR8/R9 complex inhibits autophagy
    - &id007
      reference_id: PMID:22647598
      supporting_text: the MTMR8/R9 complex reduces cellular PtdIns(3)P levels
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes: []
      source_entities:
