      reference_id: file:mouse/Mtmr9/Mtmr9-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: lacks the conserved active site cysteine residue at position
    - &id020
      reference_id: file:human/MTMR9/MTMR9-bioinformatics/RESULTS-rereview.md
      supporting_text: MTMR9 lacks both the catalytic cysteine and the catalytic arginine
