- term:
    id: GO:0019211
    label: phosphatase activator activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96QG7
  review:
    summary: 'Core molecular function: noncatalytic activator of myotubularin phosphatases.'
    action: ACCEPT
    reason: Mtmr9 lacks the catalytic cysteine and arginine of the myotubularin CX5R loop (HGTEGTDST in
      place of HCSDGWDRT; UniProt CAUTION and the catalytic-motif analysis), so it has no phosphatase
      activity of its own. Its activity is to raise the catalytic rate of an active partner. In mouse
      this was shown directly for Mtmr7 (PMID:12890864); in human for MTMR6 and MTMR8, where MTMR9 also
      sets substrate preference (PMID:19038970, PMID:22647598). Mouse and human MTMR9 are in the same
      PANTHER subfamily (PTHR10807:SF56) with identical catalytic loops, so the human data transfer as
      orthologous function.
    supported_by:
    - *id008
    - *id005
    - *id009
    - *id010
