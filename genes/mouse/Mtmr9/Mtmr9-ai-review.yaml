core_functions:
- description: Noncatalytic activating subunit of myotubularin lipid phosphatases. It heterodimerizes
    with active partners (Mtmr7 shown in mouse; MTMR6 and MTMR8 by orthology) and raises their 3-phosphatase
    activity, setting substrate preference and so regulating 3-phosphoinositide turnover.
  molecular_function: *id017
  directly_involved_in:
  - id: GO:0060304
    label: regulation of phosphatidylinositol dephosphorylation
  - id: GO:0046856
    label: phosphatidylinositol dephosphorylation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id008
  - *id005
  - *id010
  - *id022
  - *id020
  - *id023
- description: Binds its active myotubularin partners through its coiled coil and C-terminal region, and
    the heterodimer stabilizes both subunits (stabilization shown for human MTMR6-MTMR9).
  molecular_function: *id012
  directly_involved_in:
