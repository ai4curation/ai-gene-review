  review:
    summary: Mtmr9 stabilizes its partner phosphatase, and is itself stabilized, by heterodimer formation.
    action: ACCEPT
    reason: 'Shown for the human proteins: MTMR6-MTMR9 heteromer formation raises the protein levels of
