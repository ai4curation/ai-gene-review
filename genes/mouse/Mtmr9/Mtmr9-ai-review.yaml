suggested_questions:
- question: Should binding of an inactive myotubularin to an active myotubularin lipid phosphatase be
    annotated to GO:0019903 protein phosphatase binding (as PAINT does at PTN002246859) or to the parent
    GO:0019902 phosphatase binding? The children of GO:0019903 all name protein-substrate phosphatases.
- question: In mouse tissues where Mtmr6, Mtmr7 and Mtmr8 are co-expressed (for example brain, where Mtmr7
    is enriched), how is the Mtmr9 pool partitioned among them, and does the partner determine whether
    Mtmr9 acts on PI3P, PI(3,5)P2 or soluble Ins(1,3)P2?
suggested_experiments:
- hypothesis: Mtmr9 is required in vivo for normal Mtmr6/Mtmr7/Mtmr8 protein levels and 3-phosphoinositide
    turnover.
  description: Generate Mtmr9 knockout mice or primary cells; measure partner protein half-lives, PI3P,
    PI(3,5)P2 and PI5P levels, and rescue with wild-type versus coiled-coil-deleted Mtmr9.
  experiment_type: genetic perturbation
- hypothesis: The GRAM domain of Mtmr9 recruits the Mtmr6-Mtmr9 complex to ruffles to complete macropinocytosis.
  description: In Mtmr9-null mouse cells, re-express wild-type or GRAM-deleted Mtmr9 and score Mtmr6 ruffle
    recruitment, ruffle PI3P and dextran uptake after EGF stimulation.
  experiment_type: cell biology
