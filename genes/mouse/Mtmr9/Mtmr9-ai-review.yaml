- term:
    id: GO:0046856
    label: phosphatidylinositol dephosphorylation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1891693
  - PANTHER:PTN008506586
  - UniProtKB:Q96EF0
  - UniProtKB:Q9Y217
  review:
    summary: Mtmr9 takes part in phosphatidylinositol 3-dephosphorylation as the activating subunit of
      active myotubularins.
    action: ACCEPT
    reason: 'Mtmr9 cannot hydrolyse phosphate itself, but it is the activating and stabilizing subunit
      of heterodimers that 3-dephosphorylate PI3P and PI(3,5)P2, so it contributes structure and activation
      to the step (the cofactor case in the participation test). The PAINT curator made this explicit:
      at the MTMR9-lineage node PTN000086907 they recorded NOT for the catalytic activities GO:0004438
      and GO:0106018 but did not negate GO:0046856, inherited from the eukaryotic node PTN008506586. Keeping
      the process while negating catalysis is a deliberate decision and is biologically sound.'
    supported_by:
    - *id010
    - *id009
    - *id008
    - *id020
    propagation_review:
      root_cause: NO_FAILURE_CORE
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN008506586
        comment: Eukaryotic myotubularin node seeded by active MTMR6, MTMR8 and mouse Mtmr7 (MGI:1891693).
          The catalytic MF terms were negated at descendant node PTN000086907 (MTMR9 lineage) but this
          process was deliberately left in place.
        source_status: SUPPORTS_TRANSFER
