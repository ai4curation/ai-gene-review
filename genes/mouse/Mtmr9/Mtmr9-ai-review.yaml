id: Q9Z2D0
gene_symbol: Mtmr9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mtmr9 (myotubularin-related protein 9) is a catalytically inactive member of the myotubularin
  family of phosphoinositide 3-phosphatases. It has an N-terminal PH-GRAM domain, a myotubularin phosphatase-like
  domain in which the catalytic cysteine and arginine of the CX5R loop are replaced (HGTEGTDST), and a
  C-terminal coiled coil. It acts as a noncatalytic regulatory subunit of active myotubularins. In mouse
  neuroblastoma cells it co-purifies with Mtmr7; its coiled coil is sufficient for this interaction, and
  binding raises the inositol 1,3-bisphosphate 3-phosphatase activity of Mtmr7. Mouse Mtmr9 also homodimerizes
  and heterodimerizes with Mtmr6. It is a cytoplasmic protein that is recruited to membrane ruffles during
  EGF-induced macropinocytosis, and this recruitment depends on its N-terminal GRAM region. Its human
  ortholog, which is in the same PANTHER subfamily and has an identical inactive loop, increases the catalytic
  rate, substrate preference and stability of MTMR6 and MTMR8. Through these partners it restrains autophagy,
  protects against DNA damage-induced apoptosis and is needed for macropinocytosis in cultured cells.
  These partner-specific roles are expected to be conserved in mouse but have not been tested in the mouse
  protein.
