- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12890864
  qualifier: enables
  supporting_entities:
  - PR:Q9Z2C9
  review:
    summary: Mouse Mtmr9 was identified by mass spectrometry as the protein co-immunoprecipitating with
      Mtmr7 from N1E-115 neuroblastoma cells; its coiled coil is sufficient for the interaction.
    action: MODIFY
    reason: 'Generic protein binding is uninformative. The partner (PR:Q9Z2C9, mouse Mtmr7) is an active
      myotubularin lipid phosphatase, so the informative molecular function is phosphatase binding (GO:0019902).
      The functional consequence of the binding, activation of Mtmr7, is captured separately by phosphatase
      activator activity. The issue is term scope: ''protein phosphatase binding'' and its children (PP1,
      PP2A, calcineurin binding and so on) denote phosphatases that act on phosphoproteins, whereas the
      Mtmr9 partners Mtmr6, Mtmr7 and Mtmr8 are phosphoinositide 3-phosphatases. The parent term phosphatase
      binding (GO:0019902) states the supported claim without implying a protein substrate. The same replacement
      is used on every partner-binding row here and in the human MTMR9 review, and the question is raised
      in suggested_questions.'
    supported_by:
