gene_symbol: Csn2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Beta-casein is a secreted, intrinsically disordered, phosphorylated milk protein
  expressed in the lactating mammary epithelium. It is one of the calcium-sensitive
  caseins: an N-terminal phosphoserine cluster (phosphate centre) binds amorphous
  calcium phosphate, and its amphipathic sequence drives self-association, so that
  beta-casein, together with alpha-, gamma- and kappa-casein, forms the casein
  micelles that carry protein, calcium and phosphate in milk. Mice lacking
  beta-casein still lactate and assemble micelles, but the micelles are smaller,
  total milk protein is reduced and pups grow more slowly, indicating that
  beta-casein contributes to, but is not essential for, micelle formation and milk
  nutritional value. Digestion of beta-casein in the gut supplies amino acids and
  bioactive phosphopeptides to the young.
