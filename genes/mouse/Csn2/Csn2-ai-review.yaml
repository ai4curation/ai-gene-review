- term:
    id: GO:0140314
    label: calcium ion sequestering activity
  evidence_type: TAS
  original_reference_id: PMID:21789179
  review:
    summary: >-
      Beta-casein carries a phosphoserine cluster (phosphate centre) that sequesters
      amorphous calcium phosphate, as do the other calcium-sensitive caseins.
    action: NEW
    reason: >-
      Calcium phosphate sequestration by phosphate centres is the defining molecular
      activity of the calcium-sensitive caseins and is stated for mouse beta-casein.
      Calcium ion sequestering activity is used as the closest GO term; the
      sequestered species is calcium phosphate nanoclusters rather than free calcium
      ions. Mouse beta-casein has only one phosphate centre, so its contribution is
      smaller than that of alpha-casein.
    supported_by:
    - reference_id: PMID:21789179
      supporting_text: The sequences of α- (αS1 in ruminants) β-, and γ-casein (αS2-casein in ruminants) contain one or more clusters of phosphorylated residues known as phosphate centres. Phosphate centres can sequester amorphous calcium phosphate
    - reference_id: PMID:21789179
      supporting_text: In mouse milk, 3 of the phosphate centres are in present α-casein and only one in β-casein.
core_functions:
- description: >-
    Binds and sequesters amorphous calcium phosphate through its phosphoserine
    cluster and self-associates with the other caseins into casein micelles,
    contributing to micelle size and to the calcium phosphate and protein content of
    milk. Calcium ion sequestering activity is the closest available GO term; the
    actual sequestered species is calcium phosphate nanoclusters.
  molecular_function:
    id: GO:0140314
    label: calcium ion sequestering activity
