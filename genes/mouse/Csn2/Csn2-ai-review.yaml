  review:
    summary: >-
      Propagated from human beta-casein, where inhibition of cysteine proteases was
      reported by reverse zymography and with a synthetic internal peptide.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The source observation is a single in vitro study in which beta-casein and a
      synthetic beta-casein peptide inhibited cathepsin/papain-type proteases in
      reverse zymography. Beta-casein is an intrinsically disordered protein that is
      itself a major protease substrate in milk and the gut; the inhibition has not
      been shown to operate in vivo or to be a selected function of the protein, and
      it is not part of the micelle-forming role conserved across the family. The
      claim is not refuted, so it is marked as over-annotation rather than removed.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN000161175
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Ancestral beta-casein node carries an inhibitor activity grounded in a single in vitro reverse-zymography study.
