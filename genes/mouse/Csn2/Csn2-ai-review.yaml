suggested_questions:
- question: >-
    Should GO provide a calcium phosphate (nanocluster) sequestering activity term,
    so that calcium-sensitive caseins need not be annotated with the approximate
    calcium ion sequestering activity?
- question: >-
    Does intact beta-casein inhibit cysteine proteases in milk at physiological
    concentrations, or is the reported inhibition a property of proteolytic peptides
    generated in vitro?
suggested_experiments:
- description: >-
    Measure cysteine protease (cathepsin L/B) activity in milk from wild-type and
    Csn2 knockout mice to test whether endogenous beta-casein contributes to protease
    inhibition in vivo.
