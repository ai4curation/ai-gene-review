id: P15539
gene_symbol: Cyp11b2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Cyp11b2 encodes mouse aldosterone synthase, a heme-containing mitochondrial cytochrome P450 expressed
  in adrenal zona glomerulosa cells. It converts deoxycorticosterone to aldosterone through 11-beta hydroxylation,
  corticosterone 18-hydroxylation and a final C18 oxidation. The reaction sequence uses molecular oxygen and
  electrons delivered through the mitochondrial adrenodoxin system. Aldosterone production supports electrolyte,
  water and blood-pressure homeostasis; Cyp11b2-deficient mice lack aldosterone and develop hypotension and
  compensatory activation of the renin-angiotensin system. Corticosterone is the principal mouse adrenal glucocorticoid,
  and is also an intermediate in the Cyp11b2 reaction sequence.
