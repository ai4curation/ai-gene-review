- term:
    id: GO:0001991
    label: regulation of systemic arterial blood pressure by circulatory renin-angiotensin
  evidence_type: IMP
  original_reference_id: PMID:16118390
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:3582593
  review:
    action: KEEP_AS_NON_CORE
    summary: Aldosterone synthesis contributes to systemic blood-pressure control within the renin-angiotensin
      system.
    reason: Cyp11b2 deletion causes hypotension and marked activation of the renin-angiotensin system. This
      physiological feedback role is secondary to the catalytic core; the enzyme is not an angiotensin receptor
      or renin-processing protease.
    supported_by:
    - &id004
      reference_id: PMID:16118390
      supporting_text: 'the AS-/- mice have low blood pressure,

        abnormal electrolyte homeostasis'
    - reference_id: PMID:16118390
      supporting_text: 'strong activation of the

        renin-angiotensin system.'
- term:
    id: GO:0002017
    label: regulation of blood volume by renal aldosterone
  evidence_type: IMP
  original_reference_id: PMID:16118390
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:3582593
  review:
    action: KEEP_AS_NON_CORE
    summary: Aldosterone-dependent renal salt and water handling influences blood volume.
    reason: The knockout study reports impaired distal-nephron sodium reabsorption, abnormal urine concentration
      and low blood pressure. This supports the existing systemic volume-homeostasis context; Cyp11b2 synthesizes
      the hormone rather than transporting renal ions itself.
    supported_by:
    - reference_id: PMID:16118390
      supporting_text: 'absence of aldosterone in AS-/- mice results in impairment of

        Na+ reabsorption in the distal nephron, decreased blood pressure, and strong

        renin-angiotensin system activation.'
