  - *id002
- description: Cyp11b2 hydroxylates corticosterone at C18 to form 18-hydroxycorticosterone.
  molecular_function:
    id: GO:0047783
    label: corticosterone 18-monooxygenase activity
  directly_involved_in:
  - *id005
  locations:
  - *id006
  supported_by:
  - *id001
  - *id002
- description: The final C18 oxidation of 18-hydroxycorticosterone yields aldosterone; this is distinct from
    preceding 18-hydroxylation.
  proposed_molecular_function: 18-hydroxycorticosterone oxidase activity
  directly_involved_in:
  - *id005
  locations:
  - *id006
  supported_by:
  - *id001
  - reference_id: file:mouse/Cyp11b2/Cyp11b2-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: 'Reaction=18-hydroxycorticosterone + 2 reduced [adrenodoxin] + O2 + 2

      CC         H(+) = aldosterone + 2 oxidized [adrenodoxin] + 2 H2O;'
proposed_new_terms:
- proposed_name: 18-hydroxycorticosterone oxidase activity
  proposed_definition: 'Catalysis of the reaction: 18-hydroxycorticosterone + 2 reduced adrenodoxin + O2 +
    2 H+ = aldosterone + 2 oxidized adrenodoxin + 2 H2O. The C18 hydroxymethyl group is oxidized to the aldehyde
    group of aldosterone.'
  justification: Mouse Cyp11b2 makes aldosterone and carries the curated orthology-supported RHEA:50792 reaction.
    GO:0047783 names the preceding hydroxylation rather than this oxidation. The same proposed term as the
    human CYP11B2 review represents this chemically distinct activity without inventing a GO identifier.
  proposed_parent:
    id: GO:0016705
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:50792
      label: 18-hydroxycorticosterone + 2 reduced [adrenodoxin] + O2 + 2 H(+) = aldosterone + 2 oxidized [adrenodoxin]
        + 2 H2O
  supported_by:
  - *id001
  - reference_id: file:mouse/Cyp11b2/Cyp11b2-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: 'Reaction=18-hydroxycorticosterone + 2 reduced [adrenodoxin] + O2 + 2

      CC         H(+) = aldosterone + 2 oxidized [adrenodoxin] + 2 H2O;'
