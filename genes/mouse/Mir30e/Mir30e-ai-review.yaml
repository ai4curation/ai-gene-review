- term:
    id: GO:0009617
    label: response to bacterium
  evidence_type: IEP
  original_reference_id: PMID:24205035
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Bulk microarray table entry from a circulating-biomarker survey whose own
      controls argue against a bacterium-sensing mechanism.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      mir-30e is not one of the 10 miRNAs this paper carried forward to
      quantitative PCR validation; it appears only in the table of 45 miRNAs
      raised at 24 h. Even for the validated 10 the authors showed the increase
      persists in Tlr2, Tlr4 and NF-kB knockouts and concluded bacterial sensing
      was not the driver. So the observation behind this row is a change in the
      blood level of one miRNA among dozens, in a surgical sepsis model, with the
      bacterial mechanism explicitly excluded. One of 58 IEP rows to this term
      from this single paper.
    supported_by:
    - reference_id: PMID:24205035
      supporting_text: At 24 h after injection, the levels of 45 miRNAs increased
        in the whole blood
    - reference_id: PMID:24205035
      supporting_text: which indicated that the transcription of these miRNAs was
        not directly mediated by the TLR2/NF-κB or TLR4/NF-κB pathway, and pathways
        induced by exposure to the gram-positive or gram-negative bacteria
- term:
    id: GO:0071361
    label: cellular response to ethanol
  evidence_type: IEP
  original_reference_id: PMID:19091803
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Expression change under ethanol exposure, with no evidence that mir-30e
      participates in the response.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited study is a differential expression survey of ethanol-exposed
      embryos. A transcript whose level moves under ethanol is not thereby a
      component of the cellular ethanol response; GO's own guidance reserves
      "response to" terms for products required for the response to occur. The
      cached record is abstract-only, so this is marked as over-annotated rather
      than removed - the expression observation itself is not in doubt, only the
      inference from it.
- term:
    id: GO:0060291
    label: long-term synaptic potentiation
  evidence_type: IEP
  original_reference_id: PMID:25858512
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Genuinely differentially expressed during LTP, but never functionally
      tested; the paper itself calls such miRNAs candidates.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This is the informative middle tier of the 130-member IEP batch from this
      paper. Unlike most of the cohort, mir-30e really did change - it is named
      as one of the six downregulated miRNAs among the 12 that changed during
      LTP - so the IEP evidence code is used correctly and the observation is
      sound. What is not established is agency: the authors tested only miR-26a,
      miR-384-5p and let-7a, and describe the rest as a catalogue of candidate
      LTP miRNAs. "Acts upstream of or within long-term synaptic potentiation"
      promotes a candidate to a participant. Marked over-annotated rather than
      removed precisely because the underlying expression change is real.
    supported_by:
    - reference_id: PMID:25858512
      supporting_text: two of the downregulated miRNAs (miR-384-5p and miR-30e) belong
        to the same miRNA family
    - reference_id: PMID:25858512
      supporting_text: presents a catalogue of candidate 'LTP miRNAs'
