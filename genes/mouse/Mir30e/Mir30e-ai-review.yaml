id: URS0000759D99_10090
gene_symbol: Mir30e
product_type: MIRNA
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mir30e encodes the mouse mir-30e precursor, a member of the miR-30 family. Its
  mature product is a guide RNA directing Argonaute/RISC to complementary sites
  in target mRNAs, which is the only well-established function of this gene. No
  specific downstream process has been established for mir-30e by functional
  perturbation; its current GOA process annotations all derive from surveys in
  which mir-30e was one of many miRNAs whose abundance changed.
