core_functions:
- description: >-
    miRNA guide activity directing Argonaute/RISC to complementary sites in
    target mRNAs. No molecular function term is asserted: unlike mir-26a and
    mir-384, no direct target or reporter assay has been published for mir-30e,
    so there is nothing to ground a specific binding activity.
