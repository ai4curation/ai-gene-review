suggested_questions:
- question: Does mir-30e have any demonstrated function in long-term potentiation
    beyond being downregulated during it, given that its family member miR-384-5p
    is required?
  experts:
  - synaptic plasticity researchers
  - microRNA biologists
- question: Do the miR-30 family members act redundantly, such that single-miRNA
    perturbation would miss a real contribution?
  experts:
  - microRNA biologists
suggested_experiments:
- description: Antagomir or sponge inhibition of miR-30e in hippocampal slices, with
    LTP recording and spine imaging, matching the assays used for miR-26a and
    miR-384-5p
  experiment_type: electrophysiology
  hypothesis: miR-30e is dispensable for LTP maintenance despite being downregulated
    during LTP, distinguishing correlation from requirement
- description: Ago CLIP in hippocampal neurons to identify miR-30e-dependent target
    occupancy
  experiment_type: high-throughput sequencing
  hypothesis: miR-30e has a distinct target set from miR-384-5p despite shared family
    membership
