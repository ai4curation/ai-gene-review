suggested_questions:
- question: Does RTL9 have intrinsic beta-glucan or mannan hydrolase or oxidative activity, or does it
    recruit/activate lysosomal enzymes during zymosan degradation?
- question: What targets RTL9 to lysosomes, given that it lacks a classical signal peptide?
- question: Is RTL9 required for host defense against live fungal pathogens of the brain?
suggested_experiments:
- description: In vitro assays of recombinant RTL9 C-terminal Gag domain for beta-1,3-glucanase/mannanase
    activity against zymosan and defined glucans, and co-immunoprecipitation to identify lysosomal enzyme
    partners.
- description: Challenge of Rtl9 knockout mice with live fungal pathogens (e.g. Candida albicans) by intracerebral
    or systemic routes, measuring fungal burden, microglial response and survival.
