- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    summary: ND root biological process annotation, now superseded by knockout data.
    action: MODIFY
    reason: Mice expressing RTL9 lacking its C-terminal Gag-like region lose the ability to degrade zymosan
      in microglial lysosomes, while zymosan uptake and lysosomal delivery are normal and Rtl5/Rtl6 are
      dispensable. RTL9 acts within the lysosome on the fungal material, so cellular response to molecule
      of fungal origin (zymosan being a fungal cell-wall PAMP) and innate immune response are justified.
      A defense response to live fungal infection has not been tested, so defense response to fungus is
      not proposed.
    proposed_replacement_terms:
    - id: GO:0071226
      label: cellular response to molecule of fungal origin
    - id: GO:0045087
      label: innate immune response
    supported_by:
    - reference_id: PMID:37834332
      supporting_text: We have demonstrated that eutherian-specific RTL9 has functions in the innate antifungal
        immunity in the brain because Rtl9 KO mice lost zymosan degradation activity.
    - reference_id: PMID:37834332
      supporting_text: Furthermore, in Rtl9 knockout mice expressing RTL9ΔC protein lacking the C-terminus
        retroviral GAG-like region, the zymosan degrading activity was lost.
    - reference_id: PMID:37834332
      supporting_text: We also confirmed that zymosan was normally degraded in the Rtl5 and Rtl6 DKO brain
        [25], indicating that the zymosan degradation activity is specific to Rtl9 (Figure 3f).
    - reference_id: PMID:37834332
      supporting_text: We also found that zymosan was normally incorporated into the lysosomes even in
        the Rtl9 KO brain (Figure 3e), suggesting that RTL9 may not be necessary for the fusion between
        the zymosan-containing phagosomes and lysosomes.
