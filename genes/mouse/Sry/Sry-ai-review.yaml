id: Q05738
gene_symbol: Sry
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Sry is the Y-linked testis-determining gene of the mouse. Expressed briefly in supporting-cell
  precursors of the XY genital ridge, its HMG-box protein binds [AT]AACAA[AT] sites, bends DNA, and with
  SF1 activates the Sox9 testis enhancer, committing these cells to the Sertoli lineage and starting a
  Sox9-Fgf9 feed-forward loop that represses the ovarian Wnt4 pathway; a 14-kb Sry transgene is sufficient
  to masculinize XX embryos. Unlike human SRY, mouse Sry carries a long C-terminal glutamine-rich domain.
  The locus makes a two-exon transcript encoding the stable major isoform Sry-T, which is necessary and
  sufficient for male sex determination, and a single-exon transcript encoding Sry-S, a minor isoform
  destabilized by a C-terminal degron. Sry is imported into the nucleus by importin-beta and exportin-4,
  binds the KRAB-O adaptor, through which it can recruit the KAP1 corepressor, and binds the PDZ protein
  NHERF2.
