suggested_questions:
- question: What does the glutamine-rich domain of mouse Sry contribute, beyond stability, given that
    human SRY lacks it and still functions in XX transgenic mice?
- question: Which genes, if any, does Sry repress in pre-Sertoli cells through the KRAB-O/KAP1 machinery?
suggested_experiments:
- description: Map Sry-T occupancy genome-wide (CUT&RUN) in E11.5 XY gonadal supporting cells and test
    candidate repressed targets after KRAB-O knockdown.
