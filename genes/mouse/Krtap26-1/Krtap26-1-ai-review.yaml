  review:
    summary: Root BP placeholder (ND) for Krtap26-1; KAPs are structural participants in hair keratinization.
    action: MODIFY
    reason: 'The process in which KAPs do work is the terminal keratinization of hair cortical (or cuticle) cells:
      KAPs are deposited around the keratin intermediate filaments and disulfide cross-linked into the insoluble
      keratin-matrix composite that fills the keratinized cell. This is structural participation (the KAP is a constituent
      of the product), not mere dependence. GO:0031424 keratinization explicitly covers hair. Hair cycle or hair
      follicle development terms were not chosen: KAP expression tracks anagen, but KAPs are downstream structural
      products and do not drive follicle cycling or morphogenesis.'
    proposed_replacement_terms:
    - id: GO:0031424
      label: keratinization
