description: Keratin-associated protein 26-1 (Krtap26-1) is a 215-aa cysteine-rich keratin-associated protein (Keratin_matx
  and PMG signatures), one of the mammal-specific high-sulfur matrix proteins of the hair fibre. In differentiating
  cortical keratinocytes, KAPs of this kind are incorporated into the interfilamentous matrix that surrounds the
  hair keratin intermediate filaments and become disulfide cross-linked with keratin head and tail domains and with
  other matrix proteins, contributing to the rigidity of the hair shaft. The ovine orthologue is expressed in the
  wool follicle and its variation has been associated with wool traits; no gene-specific functional study of the
  mouse protein has been reported.
