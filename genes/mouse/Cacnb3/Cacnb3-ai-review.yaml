  review:
    summary: ISO from rat Cacnb3 for negative regulation of voltage-gated calcium channel activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The negative effect of beta3 comes from oocyte overexpression: at high cRNA doses, beta3 suppressed N- and R-type
      currents at physiological holding potentials through a hyperpolarising shift of inactivation, while lower doses enhanced
      conductance (PMID:15024042). The net in vivo role in mouse is positive: knockout reduces L- and N-type currents (PMID:9751781,
      PMID:12920136). The inhibitory effect is real under specific conditions, but as a stand-alone regulatory claim it misrepresents
      the function.'
