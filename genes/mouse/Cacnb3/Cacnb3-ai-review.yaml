- id: PMID:9751781
  title: Targeted disruption of the Ca2+ channel beta3 subunit reduces N- and L-type Ca2+ channel activity and alters the
    voltage-dependent activation of P/Q-type Ca2+ channels in neurons.
  findings:
  - statement: Beta3-null sympathetic neurons have reduced L- and N-type current and a hyperpolarising shift of the reluctant
      component of P/Q-type activation; mice are grossly normal.
    supporting_text: in sympathetic beta3-/- neurons, the L- and N-type current was significantly reduced relative to wt
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary mouse knockout electrophysiology; full text cached. Establishes the channel-regulator function in
      mouse.
- id: PMID:12161429
  title: Pain perception in mice lacking the beta3 subunit of voltage-activated calcium channels.
  findings:
  - statement: Beta3 knockout damps inflammatory pain and lowers N-type alpha1B expression and HVA currents in DRG neurons;
      acute mechanical nociception is largely unaffected.
    supporting_text: The molecular mechanism responsible for the phenotype was traced to low expression of N-type calcium
      channels (alpha1B)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; quotes are from the abstract.
- id: PMID:12920136
  title: Modified cardiovascular L-type channels in mice lacking the voltage-dependent Ca2+ channel beta3 subunit.
  findings:
  - statement: Beta3 loss reduces plasma-membrane alpha1, dihydropyridine binding sites and L-type current density in aortic
      smooth muscle; salt-sensitive hypertension.
    supporting_text: Western blot analysis indicated a significant reduction in expression of the alpha1 subunit in the plasma
      membrane of beta3-null mice.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Key mouse evidence for L-type complex membership and alpha1 surface expression.
