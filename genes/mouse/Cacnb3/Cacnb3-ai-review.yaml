  review:
    summary: 'IMP from mouse (Badou et al. 2006): beta3-deficient CD4 T cells have an attenuated TCR-induced calcium response,
      reduced NFAT nuclear translocation and reduced cytokine production.'
    action: KEEP_AS_NON_CORE
    reason: This is direct mouse genetic evidence, and the acts_upstream_of_or_within qualifier correctly claims only that
      beta3 is needed for normal TCR-evoked calcium entry. It does not claim that beta3 executes a signalling step. The finding
      is presumably mediated by Cav1 channels in T cells, but the authors could not assign beta3 to a specific alpha1. It
