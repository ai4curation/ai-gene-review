- term:
    id: GO:1902630
    label: regulation of membrane hyperpolarization
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: involved_in
  supporting_entities:
  - RGD:2248
  review:
    summary: ISO from rat Cacnb3 for regulation of membrane hyperpolarization, sourced from an RGD IDA on Yasuda et al. 2004.
    action: REMOVE
    reason: 'Regulation of membrane hyperpolarization concerns the membrane potential. The source paper measured something
      different: in Xenopus oocytes, overexpressed beta3 caused a hyperpolarising shift of the steady-state inactivation curve
      of N-type channels. A shift in the voltage dependence of channel gating is channel regulation, already captured by the
      channel-regulation terms. No change in membrane potential, hyperpolarisation or otherwise, was reported. The annotation
      appears to conflate ''hyperpolarizing shift of inactivation'' with membrane hyperpolarisation.'
    supported_by:
    - reference_id: PMID:15024042
      supporting_text: beta3 can have a profound negative regulatory effect on N-type (and also R-type) calcium channels by
