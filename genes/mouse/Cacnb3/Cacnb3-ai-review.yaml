  review:
    summary: ISO from rat Cacnb3 for regulation of membrane repolarization during action potential.
    action: MARK_AS_OVER_ANNOTATED
    reason: This term derives from recombinant Cav1.2 expression studies in HEK cells (rat beta3 used as the standard beta
      subunit in a study of CACNA2D1 variants associated with short-QT repolarisation). Cacnb3 regulates the L-type current,
      which in turn shapes action-potential repolarisation in cardiomyocytes, but no experiment measured membrane repolarisation
      with or without beta3. In mouse heart and vasculature, the beta3 knockout shows altered L-type current in smooth muscle
      but normal blood pressure on a normal diet (PMID:12920136). This is an over-reach from channel regulation to a cellular
      electrophysiological process.
