- term:
    id: GO:1905788
    label: negative regulation of detection of mechanical stimulus involved in sensory perception of touch
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: involved_in
  supporting_entities:
  - RGD:2248
  review:
    summary: ISO from rat Cacnb3 for negative regulation of detection of mechanical stimulus involved in sensory perception
      of touch (Li et al. 2012 rat neuropathic pain).
    action: REMOVE
    reason: 'Two defects. First, the process is the downstream organismal phenotype of tactile allodynia after nerve injury,
      not a step Cacnb3 performs; touch detection is done by mechanotransduction channels. Second, the sign is reversed relative
      to the source data: siRNA knockdown of beta3 reduced allodynia, so beta3, if anything, enhanced the pain-related response
      to touch. There is no evidence that it negatively regulates touch detection.'
    supported_by:
    - reference_id: PMID:22187436
      supporting_text: intrathecal treatment with Cavβ(3)-specific siRNA normalized mechanical hyperalgesia and tactile allodynia
        caused by SNL but had no significant effect on the normal nociceptive threshold
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      - ROLE_CONFLATION
      source_entities:
      - source_id: RGD:2248
        source_status: SOURCE_BAD
        comment: 'Rat IMP on PMID:22187436: beta3 knockdown reduced tactile allodynia, so the direction is positive, and the
          process is a phenotype rather than a step beta3 performs.'
- term:
