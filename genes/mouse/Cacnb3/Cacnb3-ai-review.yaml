id: P54285
gene_symbol: Cacnb3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Cacnb3 encodes Cav-beta3, the beta3 auxiliary subunit of high-voltage-activated voltage-gated calcium channels
  of the Cav1 (L-type) and Cav2 (notably N-type Cav2.2 and P/Q-type Cav2.1) classes. It is a cytosolic membrane-associated-guanylate-kinase-like
  protein with an SH3 domain and a catalytically inactive guanylate-kinase-like domain, which binds with high affinity to
  the alpha-interaction domain in the cytoplasmic I-II linker of the pore-forming alpha1 subunit. Through this interaction
  beta3 promotes plasma membrane expression of alpha1 and increases peak current while shifting the voltage dependence of
  activation and inactivation. In mouse, beta3 is a major beta subunit of neurons and is also expressed in vascular and intestinal
  smooth muscle, adrenal chromaffin cells, pancreatic beta cells, retina, cochlear hair cells and T lymphocytes. Beta3-null
  mice are viable and grossly normal. Their sympathetic, sensory and olfactory neurons and aortic smooth muscle have reduced
  L- and/or N-type currents and less alpha1 protein. They show blunted inflammatory pain, salt-sensitive hypertension and
  defective TCR-evoked calcium signalling in CD4 T cells. Separate knockout phenotypes, namely enhanced IP3-mediated calcium
  release and insulin secretion in beta cells and enhanced NMDA-receptor-dependent LTP in hippocampus, point to roles beyond
  channel regulation whose mechanism is not yet defined.
