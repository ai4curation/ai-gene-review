- term:
    id: GO:0050966
    label: detection of mechanical stimulus involved in sensory perception of pain
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: involved_in
  supporting_entities:
  - RGD:2248
  review:
    summary: ISO from rat Cacnb3 for detection of mechanical stimulus involved in sensory perception of pain, sourced from
      a rat siRNA study of neuropathic pain (Li et al. 2012).
    action: REMOVE
    reason: Detection of a mechanical stimulus is the transduction step performed by mechanosensitive channels in nociceptor
      terminals. Cacnb3 does none of that work. The rat source showed that knocking down beta3 after spinal nerve ligation
      reduced HVA currents in DRG neurons and normalised injury-induced mechanical hyperalgesia, with no effect on the normal
      nociceptive threshold. This is a downstream organismal phenotype of reduced presynaptic calcium current, not participation
      in stimulus detection. In mouse itself, beta3 knockout reduced responses to acute mechanical noxious stimuli moderately
      or not at all (PMID:12161429), so the species-specific evidence does not support the transferred claim.
    supported_by:
    - reference_id: PMID:12161429
      supporting_text: The pain induced by chemical inflammation is preferentially damped by deletion of beta3 subunits, whereas
        responses to acute thermal and mechanical harmful stimuli are reduced moderately or not at all, respectively.
    - reference_id: PMID:22187436
      supporting_text: intrathecal treatment with Cavβ(3)-specific siRNA normalized mechanical hyperalgesia and tactile allodynia
        caused by SNL but had no significant effect on the normal nociceptive threshold
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: RGD:2248
        source_status: SOURCE_BAD
        comment: 'Rat IMP from siRNA reversal of nerve-injury mechanical hyperalgesia (PMID:22187436): an organismal phenotype,
          not stimulus detection; contradicted for acute mechanical nociception by the mouse knockout.'
