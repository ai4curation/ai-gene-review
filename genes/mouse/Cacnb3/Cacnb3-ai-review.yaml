    summary: ISO from rat Cacnb3 for protein kinase binding, sourced from an RGD IDA on Grueter et al. 2008 (CaMKII and beta
      subunit isoforms).
    action: UNDECIDED
    reason: The source paper's abstract reports that CaMKII phosphorylates beta3, but that activated/autophosphorylated CaMKII
      does not bind beta3 or beta4; binding was specific to beta1b and beta2a, whose CaMKII-binding motif is not conserved
      in beta3. A transient kinase-substrate interaction is not normally annotated as protein kinase binding. The full text,
      which the RGD curator read, may contain binding data for non-autophosphorylated CaMKII, but our cached copy is abstract-only,
