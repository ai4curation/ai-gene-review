      activity.
    action: MODIFY
    reason: 'High voltage-gated calcium channel activity is the activity of the alpha1 pore. Cacnb3 regulates it but does
      not perform it, as the mouse knockout shows: currents persist without beta3 but at reduced density and with altered
      gating (PMID:9751781, PMID:12920136). For the auxiliary subunit, the correct MF is calcium channel regulator activity
      (GO:0005246), together with the accepted contributes_to row for channel activity. This does not dispute the PAINT node
      placement: the whole beta family is auxiliary, so the issue is the choice of term for every member, not which clade
      inherited it. The cited review summarises beta1, beta3 and beta4 knockout phenotypes and describes beta as an intracellular
      subunit of the complex.'
    proposed_replacement_terms:
    - id: GO:0005246
      label: calcium channel regulator activity
    supported_by:
    - reference_id: PMID:10494839
      supporting_text: The Ca2+ channels involved are complexes of a pore-forming alpha1 subunit, a transmembrane delta subunit
        disulfide-linked to an extracellular alpha2 subunit, a intracellular beta subunit
