- term:
    id: GO:2000463
    label: positive regulation of excitatory postsynaptic potential
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: involved_in
  supporting_entities:
  - RGD:2248
  review:
    summary: 'ISO from rat Cacnb3 for positive regulation of excitatory postsynaptic potential (Li et al. 2012: beta3 siRNA
      reduced monosynaptic EPSCs in dorsal horn after nerve injury).'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The rat effect is presynaptic: beta3 raises HVA current in primary afferent terminals, which increases transmitter
      release and so the postsynaptic response. Beta3 acts through the presynaptic calcium channel and does not regulate the
      postsynaptic potential itself. In mouse hippocampus, the beta3 knockout showed no change in basal synaptic transmission
      or mEPSCs (PMID:18339621), so the rat observation is context-specific (nerve-injured DRG). Better captured by the channel-regulation
      terms.'
    supported_by:
    - reference_id: PMID:22187436
      supporting_text: Intrathecal injection of Cavβ(3)-specific siRNA significantly reduced HVACC currents in small DRG neurons
        and the amplitude of monosynaptic excitatory postsynaptic currents of dorsal horn neurons in SNL rats
    - reference_id: PMID:18339621
      supporting_text: electrophysiological studies revealed no alteration in the Ca(2+) current density, the frequency and
        amplitude of miniature excitatory postsynaptic currents, and the basal synaptic transmission in the mutant hippocampus
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: RGD:2248
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: 'Rat IMP on PMID:22187436 in nerve-injured DRG: a presynaptic channel effect read as postsynaptic potential
          regulation; no basal transmission change in mouse knockout hippocampus.'
