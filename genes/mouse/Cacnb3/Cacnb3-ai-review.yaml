- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-MMU-525831
  qualifier: located_in
  review:
    summary: Reactome TAS (NCAM1 interacts with T- and L-type VDCC) placing the channel complex, including Cacnb3, at the
      plasma membrane.
    action: ACCEPT
    reason: Cacnb3 is a peripheral, cytosolic subunit that is held at the plasma membrane by binding to the alpha1 subunit,
      and it is the subunit that promotes alpha1 delivery to the plasma membrane. In mouse ileum smooth muscle, Cav-beta3
      is localised near the plasma membrane (PMID:17580090), and loss of beta3 lowers alpha1 in aortic plasma membrane fractions
      (PMID:12920136). Plasma membrane, where the channel complex acts, is an appropriate location.
    supported_by:
    - &id008
      reference_id: PMID:17580090
      supporting_text: Both proteins, Ca(V)beta(2) and Ca(V)beta(3) are localized near the plasma membrane
    - &id011
