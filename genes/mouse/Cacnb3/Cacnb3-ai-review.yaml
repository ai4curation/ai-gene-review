suggested_questions:
- question: Is the enhanced IP3-evoked calcium release in beta3-null beta cells and chromaffin cells due to a direct beta3-IP3
    receptor interaction, and if so, should GO represent a channel-independent regulatory activity for beta3?
- question: Should the RGD 'protein kinase binding' IDA for rat Cacnb3 (PMID:18205403) stand, given that the abstract reports
    that activated CaMKII does not bind beta3?
- question: Should rat Cacnb3 annotations to 'regulation of membrane hyperpolarization' (PMID:15024042) and to touch/pain
    detection processes (PMID:22187436) be revisited at the source, since mouse ISO rows inherit them?
suggested_experiments:
- description: Test whether beta3 co-immunoprecipitates with IP3 receptors in mouse beta cells, and whether a beta3 mutant
    unable to bind alpha1 AID still suppresses IP3-evoked calcium release when re-expressed in beta3-null cells, to separate
    channel-dependent from channel-independent roles.
- description: Rescue beta3-null hippocampal neurons with wild-type versus AID-binding-deficient beta3 and measure NMDAR currents
    and NR2B surface levels, to test whether the NMDAR phenotype requires the channel-binding interface.
