    label: L-type voltage-gated calcium channel complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: part_of
  supporting_entities:
  - UniProtKB:P54284
  - ensembl:ENSP00000301050
  review:
    summary: IEA (Ensembl Compara) for L-type voltage-gated calcium channel complex.
    action: ACCEPT
