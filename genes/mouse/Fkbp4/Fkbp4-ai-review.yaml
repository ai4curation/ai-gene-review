id: P30416
gene_symbol: Fkbp4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: FKBP52 is an HSP90-associated immunophilin with peptidyl-prolyl isomerase and steroid-receptor
  co-chaperone functions. It supports androgen receptor transcription in selected reproductive tissues
  without being required for androgen binding or nuclear import in the examined mouse knockout models.
  It also participates in glucocorticoid receptor complex trafficking and can regulate Tau-associated
  microtubule dynamics.
