    summary: A very small nuclear pool of Sirt5 is detectable in mouse liver; secondary to its mitochondrial location.
    reason: Fractionation of mouse liver detected a very small amount of Sirt5 in the nuclear fraction, so the location is
      real but minor. The IBA comes from a deep node seeded by nuclear sirtuins; the PAINT curator did not place nucleus on
      the SIRT5-subfamily node PTN000119399, which carries mitochondrion and cytosol.
