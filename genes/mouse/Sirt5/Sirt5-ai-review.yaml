- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HDA
  original_reference_id: PMID:18614015
  qualifier: located_in
  review:
    action: MODIFY
    summary: Sirt5 is mitochondrial; the specific compartment established in mouse is the matrix.
    reason: 'Mitochondrion is correct but less specific than the mouse evidence: fractionation of mouse liver mitochondria
      placed endogenous Sirt5 in the matrix, where its substrates CPS1, HMGCS2, PDC and SDH reside. Refined to mitochondrial
      matrix (already carried by this gene). An intermembrane-space pool is reported only for human SIRT5 (in vitro import),
      so it is not added here as a mouse-established refinement.'
    supported_by:
    - reference_id: PMID:18614015
      supporting_text: we performed mass spectrometry, GFP tagging, and machine learning to create a mitochondrial compendium
        of 1098 genes and their protein expression across 14 mouse tissues
    - &id003
      reference_id: PMID:19410549
      supporting_text: These results all indicate that SIRT5 is a mitochondrial matrix protein.
    - *id002
    proposed_replacement_terms: &id004
