id: Q8K2C6
gene_symbol: Sirt5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Sirt5 is an NAD+-dependent protein lysine deacylase of the sirtuin family (class III) that preferentially removes
  negatively charged acyl groups (succinyl, malonyl and glutaryl) from lysine residues, transferring the acyl group to ADP-ribose
  and releasing nicotinamide; its deacetylase activity is weak. Tyr102 and Arg105 in the acyl-binding pocket recognize the
  acyl carboxylate. The protein carries an N-terminal mitochondrial transit peptide and acts mainly in the mitochondrial matrix,
  with a substantial cytosolic pool and a trace nuclear pool. In mouse, loss of Sirt5 causes widespread lysine hypersuccinylation
  and hyperglutarylation in liver, embryonic fibroblasts and heart without changing lysine acetylation. Characterized mouse
  substrates include CPS1, whose activation by Sirt5 supports urea-cycle ammonia disposal during fasting, HMGCS2 (ketogenesis),
  and subunits of the pyruvate dehydrogenase and succinate dehydrogenase complexes.
