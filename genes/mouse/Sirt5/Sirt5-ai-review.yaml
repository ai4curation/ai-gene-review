suggested_questions:
- question: Does mouse Sirt5 have a physiologically relevant intermembrane-space pool, as reported for human SIRT5 in import
    assays, or is the IMS assignment species- or assay-specific?
- question: What compartment did Nakamura et al. (PMID:18054327) assign to mouse Sirt5, and can the inner-membrane annotation
    be reconciled with matrix fractionation?
suggested_experiments:
- description: Protease-protection and sub-mitochondrial fractionation of endogenous Sirt5 in mouse liver and heart, to quantify
    matrix, intermembrane-space and inner-membrane pools.
- description: Kinetic characterization of recombinant mouse Sirt5 with acetyl, succinyl, malonyl and glutaryl peptides, so
    that species-matched activity data replace the human-enzyme kinetics.
