- term:
    id: GO:0002931
    label: response to ischemia
  evidence_type: IMP
  original_reference_id: PMID:26388266
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:5297911
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Sirt5 knockout hearts suffer greater ischemia-reperfusion injury; this is a downstream phenotype, not a response
      process Sirt5 executes.
    reason: The IMP shows that Sirt5-/- hearts have larger infarcts after ischemia-reperfusion, rescued by the SDH inhibitor
      dimethyl malonate, implicating SDH hypersuccinylation. Sirt5 is a constitutive mitochondrial desuccinylase; it is not
      shown to be induced by or to carry out a response to ischemia. The annotation records an organismal consequence of loss
      of its desuccinylase activity and is retained only as an over-annotation of the acts-upstream phenotype.
    supported_by:
    - &id014
      reference_id: PMID:26388266
      supporting_text: Strikingly, dimethyl malonate treatment of Sirt5−/− hearts restored RPP recovery to WT levels
    - &id021
      reference_id: PMID:26388266
      supporting_text: Taken together, these data are consistent with the hypothesis that Sirt5 functions as a desuccinylase
        in cardiac mitochondria.
