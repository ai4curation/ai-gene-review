  review:
    action: REMOVE
    summary: Endogenous Sirt5 co-immunoprecipitates CPS1 from mouse liver mitochondria; generic protein binding is uninformative.
    reason: The interaction is real (CPS1, Q8C196, co-IPs with Sirt5 but not Sirt4), but CPS1 is a deacylation substrate,
      and that function is already captured by the desuccinylase and deglutarylase activity terms. Removal follows the protein-binding
      policy and does not dispute the interaction.
    supported_by:
