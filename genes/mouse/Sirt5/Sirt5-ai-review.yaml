  review:
    action: UNDECIDED
    summary: Inner-membrane location from an abstract-only localization study; not reconcilable with the matrix fractionation
      here.
    reason: The cached record for PMID:18054327 is abstract-only and says only that the three mitochondrial sirtuins occupy
      different compartments. Mouse liver fractionation in PMID:19410549 placed Sirt5 in the soluble matrix, and Sirt5 has
      no transmembrane segment. Without the full text the inner-membrane assignment can be neither confirmed nor rejected,
      so the curator's call is left undecided.
