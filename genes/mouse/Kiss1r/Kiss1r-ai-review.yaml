id: Q91V45
gene_symbol: Kiss1r
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Plasma-membrane class A (rhodopsin-like) seven-transmembrane G protein-coupled receptor
  (Gpr54 / mOT7T175), the receptor for the kisspeptins — the C-terminally amidated RF-amide
  peptides (kisspeptin-54/metastin, -14, -13 and the decapeptide kisspeptin-10) cleaved from the
  Kiss1 precursor, whose active decapeptide is almost identical between mouse and human. Ligand
  binding couples the receptor to Gq/11 and phospholipase C-beta, hydrolysing PIP2 and raising
  intracellular calcium, with downstream ERK1/2 and p38 MAPK signalling; a G protein-independent
  beta-arrestin arm also reaches ERK1/2. Its principal role is as the output receptor on
  hypothalamic gonadotropin-releasing hormone (GnRH) neurons, where kisspeptin produces a
  prolonged depolarization by opening TRPC-like non-selective cation channels and closing
  inwardly-rectifying potassium channels, driving GnRH release and thereby pituitary gonadotropin
  (LH/FSH) secretion, puberty and fertility; whole-body and GnRH-neuron-specific disruption in the
  mouse causes hypogonadotropic hypogonadism and infertility, and re-expression in GnRH neurons
  restores fertility. Outside the reproductive axis the same receptor was identified through the
  anti-proliferative, anti-migratory signalling of the Kiss1 ("metastin") peptides, and in
  osteoclasts ligand-bound receptor recruits SRC and the phosphatase DUSP18 to a
  proline/arginine-rich motif in its C-terminal tail, restraining osteoclast formation and bone
  resorption.
