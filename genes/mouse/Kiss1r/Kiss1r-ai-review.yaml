- id: PMID:11414709
  title: FMRFamide-related neuropeptides are agonists of the orphan G-protein-coupled
    receptor GPR54.
  findings:
  - statement: >-
      The mouse and human GPR54 coding sequences were determined as orthologs of the rat receptor;
      mouse and rat GPR54 are nearly 95% identical, and amidated RF/RW-amide peptides activate the
      receptor through Galpha_q with an optimal C-terminal Gly-Leu-Arg-Trp-NH2 motif.
    supporting_text: >-
      invertebrate neuropeptides of the RFamide and RWamide family that were able to activate
      GPR54 at microM range through the G(alpha)q pathway
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached as abstract only. Source of the mouse IDA rows for peptide-receptor activity and
      signal transduction, and of the rat-ortholog ISO rows. Establishes Gq coupling and the
      agonist motif; the mouse sequence is reported here, so the IDA rows are on the mouse
      receptor.
- id: PMID:12359743
  title: Identification and characterization of mouse metastasis-suppressor KiSS1
    and its G-protein-coupled receptor.
  findings:
  - statement: >-
      Mouse Kiss1 and its receptor were identified together; the active decapeptide is nearly
      identical to human, receptor activation engages G protein-dependent phospholipase C-beta, and
      receptor activation inhibits cell proliferation and migration.
    supporting_text: >-
      Activation of the receptor by KiSS1 peptide leads to the activation of G-protein-activated
      phospholipase C (PLC-beta)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached as abstract only, so the cell-surface staining and the Kiss1 interaction behind the
      MGI IDA and IPI rows cannot be re-read; the Gq-PLC coupling and the anti-proliferative effect
      are stated in the abstract. Mouse receptor throughout.
- id: PMID:14573733
  title: The GPR54 gene as a regulator of puberty.
  findings:
  - statement: >-
      Gpr54-deficient mice have isolated hypogonadotropic hypogonadism yet respond to exogenous
      gonadotropins and GnRH, placing the defect upstream of the pituitary, in parallel with
      loss-of-function mutations in human patients.
    supporting_text: The Gpr54-deficient mice had isolated hypogonadotropic hypogonadism
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only, but the mouse phenotype and the preserved GnRH responsiveness are stated
      there. The human genetics in the same paper are the basis of the human review's IMP rows and
      are not transferred to mouse here.
- id: PMID:14652023
  title: The KiSS-1 receptor GPR54 is essential for the development of the murine
    reproductive system.
  findings:
  - statement: >-
      An independently generated Gpr54-null mouse line shows developmental abnormalities of male
      and female genitalia and loss of sexually dimorphic features, confirming the receptor's
      requirement for sexual development.
    supporting_text: >-
      we have generated a mutant mouse line with a targeted disruption of the GPR54 receptor
      (GPR54 -/-)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Cited by UniProt for the mouse FUNCTION statement; included here as the second,
      independent knockout line behind the gonadotropin-secretion claim.
- id: PMID:15665093
  title: Kisspeptin directly stimulates gonadotropin-releasing hormone release via
    G protein-coupled receptor 54.
  findings:
  - statement: >-
      GPR54 transcripts colocalize with GnRH neurons in the mouse hypothalamus, GnRH neurons are
      anatomically normal in gpr54-null mice, and peripheral kisspeptin that releases LH and FSH in
      wild-type mice has no effect in gpr54-null mice.
    supporting_text: >-
      levels of kisspeptin injected i.p., which stimulate robust LH and FSH release in wild-type
      mice, have no effect in gpr54-/- mice
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. The mouse content is the colocalization and the knockout non-response; the
      direct GnRH-release measurement in this paper is in sheep, so it is not cited here as mouse
      evidence.
- id: PMID:17563351
  title: Hypogonadotropic hypogonadism in mice lacking a functional Kiss1 gene.
  findings:
  - statement: >-
      Kiss1-null mice phenocopy Gpr54-null mice, which establishes the kisspeptins as the
      physiological agonists of this receptor in vivo; the hypothalamic-pituitary axis remains
      responsive to exogenous kisspeptin in the ligand-null animals.
    supporting_text: >-
      The virtually identical phenotype of Gpr54- and Kiss1-null mice provides direct proof that
      kisspeptins are the true physiological ligand for the GPR54 receptor in vivo
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. A ligand-side knockout, cited for ligand-receptor identity rather than for any
      row on this gene.
- id: PMID:17595229
  title: Kiss1-/- mice exhibit more variable hypogonadism than Gpr54-/- mice.
  findings:
  - statement: >-
      On one genetic background, Gpr54-null mice fail to raise gonadotropins in response to a
      kisspeptin agonist while Kiss1-null mice respond, and the receptor-null phenotype is the more
      uniformly severe of the two.
    supporting_text: Gpr54 knockout mice fail to increase gonadotropins
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Side-by-side comparison of the ligand and receptor knockouts; supports that
      the agonist acts only through this receptor.
- id: PMID:24051579
  title: Dependence of fertility on kisspeptin-Gpr54 signaling at the GnRH neuron.
  findings:
  - statement: >-
      GnRH-neuron-specific deletion of Gpr54 causes infertility, failed puberty and GnRH neurons
      unresponsive to kisspeptin, and BAC-mediated restoration of the receptor to GnRH neurons in
      global nulls restores puberty, cyclicity and fecundity.
    supporting_text: the GnRH neuron is the key site of kisspeptin-Gpr54 signaling for fertility
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only, but the knockout-plus-knockin design and its outcome are stated there. The
      strongest mouse evidence that the gonadotropin-secretion role is cell-autonomous to the GnRH
      neuron.
- id: PMID:24422632
  title: Disrupted kisspeptin signaling in GnRH neurons leads to hypogonadotrophic
    hypogonadism.
  findings:
  - statement: >-
      An independent GnRH-neuron-specific Kiss1r knockout (GKirKO) is infertile in both sexes with
      low serum LH and FSH, delayed pubertal onset and abnormal estrous cyclicity.
    supporting_text: >-
      Both female and male GKirKO mice were infertile, having low serum LH and FSH levels
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Second, independent cell-specific knockout supporting the same conclusion as
      Kirilov 2013.
- id: PMID:16339030
  title: Activation of gonadotropin-releasing hormone neurons by kisspeptin as a neuroendocrine
    switch for the onset of puberty.
  findings:
  - statement: >-
      Kisspeptin depolarizes more than 90% of adult mouse GnRH neurons, around 90% of which express
      GPR54 mRNA at both juvenile and adult ages, while the proportion of responsive neurons rises
      across postnatal development.
    supporting_text: >-
      kisspeptin (10-100 nM) evoked a remarkably potent, long-lasting depolarization of >90% of
      gonadotropin-releasing hormone (GnRH)-green fluorescent protein neurons in situ
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Mouse GnRH-neuron electrophysiology and receptor expression; cited for the
      neuropeptide-signalling pathway rather than for a row of its own.
- id: PMID:18434521
  title: Kisspeptin depolarizes gonadotropin-releasing hormone neurons through activation
    of TRPC-like cationic channels.
  findings:
  - statement: >-
      Kisspeptin depolarizes GnRH neurons concentration-dependently (EC50 2.8 nM) by concurrently
      opening sodium-dependent non-selective cation channels and inhibiting Kir channels; the
      inward current is blocked by TRPC blockers, and six TRPC subunits are expressed in these
      neurons.
    supporting_text: kisspeptin depolarized GnRH neurons in a concentration-dependent manner
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in the local cache, and the abstract does not name the species; UniProt
      attributes the finding to mouse on this gene's entry with an experimental evidence code, and
      the human review reads it the same way, so I defer to the curator who read the full text.
      Source of the two mouse IDA rows for depolarization and cation transport.
- id: PMID:18483150
  title: Kisspeptin excites gonadotropin-releasing hormone neurons through a phospholipase
    C/calcium-dependent pathway regulating multiple ion channels.
  findings:
  - statement: >-
      In GnRH transgenic mouse lines, kisspeptin depolarizes or increases firing in 75% of adult
      GnRH neurons through closure of potassium channels and opening of non-selective cation
      channels; phospholipase C and IP3-receptor antagonism reduces the responding fraction from
      80% to 15% and 7%, and kisspeptin raises intracellular calcium by about 10%.
    supporting_text: >-
      kisspeptin activates G protein-coupled receptor 54 (GPR54) to initiate a PLC-IP3R-calcium
      cascade that modulates both potassium and NSC channels to initiate depolarization in GnRH
      neurons
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available; the methods state GnRH-GFP and GnRH-Pericam transgenic mice, so this is
      unambiguously mouse. Primary support for the PLC-activating pathway in the native cell.
- id: PMID:23744639
  title: Kisspeptin activation of TRPC4 channels in female GnRH neurons requires PIP2
    depletion and cSrc kinase activation.
  findings:
  - statement: >-
      Kisspeptin activation of the TRPC current requires PIP2 hydrolysis and cSrc kinase but is
      unaffected by removal of extracellular calcium or by intracellular calcium buffering, and the
      channels are not store-operated.
    supporting_text: >-
      Neither removing extracellular Ca(2+) nor buffering intracellular Ca(2+) with EGTA or BAPTA
      had any effect on the kisspeptin activation of the TRPC channels
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only, and the abstract does not state the species; cited here only for the
      calcium-independence of the TRPC step, which is a knowledge-gap provenance rather than
      support for any row. Not used to assert a species-specific claim.
- id: PMID:25147978
  title: KISS1R signals independently of Gαq/11 and triggers LH secretion via the
    β-arrestin pathway in the male mouse.
  findings:
  - statement: >-
      Kisspeptin-induced LH secretion is significantly reduced in mice lacking beta-arrestin-1 or
      beta-arrestin-2, and the Gq/11-uncoupled L148S receptor still drives beta-arrestin-dependent
      ERK1/2 phosphorylation, so the receptor regulates GnRH secretion through both arms.
    supporting_text: >-
      we conclude that KISS1R signals via Gαq/11 and β-arrestin to regulate GnRH secretion
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. The in vivo experiments perturb the arrestins rather than this gene, and the
      receptor-mutant work is in HEK293 cells and arrestin-null fibroblasts; cited for the MAPK
      row, not as evidence for a receptor annotation of its own.
- id: PMID:24982149
  title: Primary cilia enhance kisspeptin receptor signaling on gonadotropin-releasing
    hormone neurons.
  findings:
  - statement: >-
      Kiss1r is enriched in primary cilia of mouse GnRH neurons, which become multiciliated with
      sexual maturation, and selective disruption of those cilia reduces kisspeptin-evoked GnRH
      neuronal activity.
    supporting_text: >-
      is enriched in cilia projecting from mouse gonadotropin-releasing hormone (GnRH) neurons
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Native mouse evidence for the cilium location, stronger than the human
      overexpression IDA that mouse GOA actually transfers; the cilium rows here are kept as
      non-core on this basis.
- id: PMID:28154160
  title: Tubby family proteins are adapters for ciliary trafficking of integral membrane
    proteins.
  findings:
  - statement: >-
      Ciliary localization of KISS1R depends on TULP3: steady-state ciliary levels of GFP-tagged
      KISS1R fall when TULP3 is depleted in RPE cells.
    supporting_text: >-
      with GPR83 and KISS1R, the steady-state ciliary levels were significantly decreased
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text available. Human protein in an overexpression system; it is the donor of the mouse
      ISO cilium row, and the mouse claim does not depend on it.
- id: PMID:11457843
  title: The metastasis suppressor gene KiSS-1 encodes kisspeptins, the natural ligands
    of the orphan G protein-coupled receptor GPR54.
  findings:
  - statement: >-
      Kisspeptins bind rat and human GPR54 with low nanomolar affinity in CHO-K1 cells and
      stimulate PIP2 hydrolysis, calcium mobilization, arachidonic acid release, ERK1/2 and p38
      phosphorylation and stress fibre formation while inhibiting proliferation; kisspeptin
      administration stimulates oxytocin secretion in rats.
    supporting_text: >-
      stimulated PIP(2) hydrolysis, Ca(2+) mobilization, arachidonic acid release, ERK1/2 and p38
      MAP kinase phosphorylation, and stress fiber formation but inhibited cell proliferation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Not a mouse study: it is the donor evidence behind the rat ISO rows for
      arachidonate secretion, stress fibre assembly, MAPK cascade, hormone secretion and
      proliferation, and the readouts are from transfected CHO-K1 cells.
- id: PMID:16222076
  title: Cancer metastasis-suppressing peptide metastin upregulates excitatory synaptic
    transmission in hippocampal dentate granule cells.
  findings:
  - statement: >-
      Metastin acting on GPR54 reversibly enhances excitatory synaptic transmission in rat
      hippocampal dentate granule cells postsynaptically, blocked by intracellular GDP-beta-S,
      BAPTA and MEK/ERK inhibitors.
    supporting_text: >-
      activation of GPR54 by submicromolar concentrations of metastin reversibly enhances
      excitatory synaptic transmission in hippocampal dentate granule cells in a
      mitogen-activated protein (MAP) kinase-dependent manner
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Rat slice pharmacology; the donor evidence for the rat IMP rows transferred
      here as GPCR signalling, calcium-mediated signalling and positive regulation of synaptic
      transmission.
- id: PMID:38346942
  title: Kisspeptin-10 binding to Gpr54 in osteoclasts prevents bone loss by activating
    Dusp18-mediated dephosphorylation of Src.
  findings:
  - statement: >-
      Ligand-bound Gpr54 recruits active SRC and DUSP18 to a proline/arginine-rich motif in its
      C-terminal tail and raises Dusp18 expression; DUSP18 dephosphorylates SRC Tyr-416, and
      whole-body and osteoclast-specific Gpr54 deletion causes osteoclast hyperactivation and bone
      loss that kisspeptin-10 reverses in receptor-expressing cells.
    supporting_text: >-
      Gpr54 recruits both active Src and the Dusp18 phosphatase at its proline/arginine-rich motif
      in its C terminus
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available; carries an author correction (PMID:39702286), and the cached record is
      the corrected version. Mouse genetics throughout, with one human giant-cell-tumour osteoclast
      experiment. Source of the bone-resorption IMP row, the adaptor-activity IDA row and the
      proposed osteoclast-differentiation row.
