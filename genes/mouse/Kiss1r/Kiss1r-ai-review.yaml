- term:
    id: GO:0005929
    label: cilium
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q969F8
  - ensembl:ENSP00000234371
  review:
    summary: >-
      Electronic transfer of the human ciliary localization. Mouse has stronger, native evidence
      than the donor: Kiss1r is enriched in the primary cilia of mouse GnRH neurons, and removing
      those cilia reduces the kisspeptin response.
    action: KEEP_AS_NON_CORE
    reason: >-
      A real, specific sub-location of the plasma membrane rather than a separate function. The
      ciliary pool matters in one specialized cell type and is peripheral to the receptor's general
      cell-surface role, so it is kept as non-core, as in the human review. GO's primary-cilium
      class is obsolete in the current ontology and neither study tests motility, so the cilium
      term is the right level.
    supported_by:
    - reference_id: PMID:24982149
      supporting_text: >-
        is enriched in cilia projecting from mouse gonadotropin-releasing hormone (GnRH) neurons
    - reference_id: PMID:24982149
      supporting_text: >-
        disruption of cilia selectively on GnRH neurons leads to a significant reduction in
        kisspeptin-mediated GnRH neuronal activity
