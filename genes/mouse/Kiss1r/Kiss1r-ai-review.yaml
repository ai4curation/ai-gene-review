core_functions:
- description: >-
    Plasma-membrane G protein-coupled receptor for the Kiss1-derived kisspeptin neuropeptides,
    coupling to Gq/11 and phospholipase C-beta on hypothalamic GnRH neurons, where the resulting
    PIP2 hydrolysis and calcium rise open TRPC-like cation channels and close inwardly-rectifying
    potassium channels, depolarizing the neuron and driving GnRH release and thereby pituitary
    gonadotropin secretion, puberty and fertility.
  molecular_function:
    id: GO:0008188
    label: neuropeptide receptor activity
  directly_involved_in:
  - id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  - id: GO:0007218
    label: neuropeptide signaling pathway
  - id: GO:0032278
    label: positive regulation of gonadotropin secretion
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:12359743
    supporting_text: >-
      Activation of the receptor by KiSS1 peptide leads to the activation of G-protein-activated
      phospholipase C (PLC-beta)
  - reference_id: PMID:18483150
    supporting_text: >-
      kisspeptin activates G protein-coupled receptor 54 (GPR54) to initiate a PLC-IP3R-calcium
      cascade that modulates both potassium and NSC channels to initiate depolarization in GnRH
      neurons
  - reference_id: PMID:24051579
    supporting_text: the GnRH neuron is the key site of kisspeptin-Gpr54 signaling for fertility
knowledge_gaps:
- gap_statement: >-
    Which cation channel actually carries the kisspeptin-evoked inward current in GnRH neurons, and
    how the current is gated, are undetermined: the channel is identified only as TRPC-like from
    blocker pharmacology, six TRPC subunits are co-expressed in these neurons, and the two
    published accounts of the gating step disagree on whether calcium is required. Neither
    published gating requirement narrows the candidate: the Src-phosphorylated tyrosines of TRPC4
    lie in its hypervariable distal C-tail and were characterised as exocytotic membrane-insertion
    determinants rather than gating residues, and activation by PIP2 depletion is a property of the
    TRPC1/4/5 subfamily rather than of TRPC4 alone. The current's insensitivity to 100 micromolar
    lanthanum, which potentiates homomeric TRPC4 and TRPC5, is a further reason to expect a
    heteromer rather than a homomer of any one subunit.
  boundary: >-
    What is established is the receptor and the proximal cascade: kisspeptin acting on Gpr54
    depolarizes GnRH neurons with an EC50 of 2.8 nM, the current reverses near -115 mV because a
    non-selective sodium-dependent conductance opens while Kir channels close, phospholipase C and
    IP3-receptor antagonists abolish the response, and TRPC blockers abolish the inward current.
    What is missing is the molecular identity of the conductance, including whether it is a homomer
    at all, and the requirement, or not, for calcium between PLC and channel opening.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    The channel is the step that converts kisspeptin binding into GnRH-neuron firing, so it is the
    point at which the reproductive axis could be modulated pharmacologically without acting on the
    receptor itself.
  resolution: >-
    Subunit-specific genetic removal of candidate TRPC channels in GnRH neurons, with
    kisspeptin-evoked current and LH release as readouts, together with a single protocol that
    tests the calcium requirement and the PIP2-depletion route in the same cells.
  provenance:
  - reference_id: PMID:18434521
    supporting_text: >-
      single-cell reverse transcription-PCR analysis revealed that TRPC1, TRPC3, TRPC4, TRPC5,
      TRPC6, and TRPC7 subunits were expressed in GnRH neurons
  - reference_id: PMID:18434521
    supporting_text: >-
      it appears that kisspeptin depolarizes GnRH neurons through activating TRPC-like channels
      and, to a lesser extent, inhibition of Kir channels
  - reference_id: PMID:23744639
    supporting_text: >-
      Neither removing extracellular Ca(2+) nor buffering intracellular Ca(2+) with EGTA or BAPTA
      had any effect on the kisspeptin activation of the TRPC channels
  - reference_id: PMID:18434521
    supporting_text: and Cd(2+), but not by lanthanum (100 microM)
  - reference_id: PMID:16144838
    supporting_text: EGF receptor stimulation induced the exocytotic insertion of hTRPC4
  - reference_id: file:human/TRPC4/TRPC4-hypotheses/kisspeptin-trpc-subunit-identity/openscientist.md
    supporting_text: This favours a heteromeric TRPC1/4(/5) channel.
- gap_statement: >-
    How the receptor's osteoclast branch is transduced is unknown: the recruitment of SRC and
    DUSP18 to the receptor tail and the rise in Dusp18 expression are both reported to require
    Gq/11 yet to be insensitive to inhibition of every canonical Gq effector tested, so the step
    between the G protein and the assembled complex is unaccounted for.
  boundary: >-
    Established: ligand-bound receptor binds active SRC and DUSP18 through a proline/arginine-rich
    motif in its C-terminal tail, DUSP18 dephosphorylates the activating SRC Tyr-416 site,
    osteoclast-specific and whole-body receptor deletion both cause osteoclast hyperactivation and
    bone loss, and kisspeptin-10 suppresses resorption in receptor-expressing but not receptor-null
    osteoclasts. Not established: which Gq/11-dependent event permits the recruitment, given that
    phospholipase C, protein kinase C, ERK and CaMKII inhibitors do not block it.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    The same receptor is being proposed as an anti-resorptive drug target; whether the bone branch
    can be engaged without the canonical phospholipase C signalling that drives the reproductive
    axis depends on this step.
  resolution: >-
    Reconstitution of the recruitment in osteoclasts lacking individual Gq/11 effectors and
    receptor-tail mutants, with tests of whether a Gq/11 conformational or scaffolding role, rather
    than a second-messenger one, is what the receptor requires.
  provenance:
  - reference_id: PMID:38346942
    supporting_text: >-
      Kp-10 inhibited the phosphorylation of Src in WT BMMs, but failed to have a significant
      effect in Gq/11 KO BMMs
  - reference_id: PMID:38346942
    supporting_text: >-
      were all obvioulsly dampened by Src kinase inhibitor (Saracatinib), but not by the inhibitors
      of Gq/11 downstream signals including PLC inhibitor (U73122)
- gap_statement: >-
    What the ciliary pool of the receptor contributes beyond raising the amplitude of the kisspeptin
    response is unknown, and no mechanism has been shown to explain why signalling from a cilium
    differs from signalling at the rest of the GnRH-neuron surface.
  boundary: >-
    Established in mouse: the receptor is enriched in primary cilia of GnRH neurons, those neurons
    are multiciliated in adults with the proportion rising across postnatal development, and
    removing cilia selectively from GnRH neurons lowers kisspeptin-evoked activity. Not
    established: whether the ciliary compartment provides a distinct transducer, second-messenger
    microdomain or desensitization environment, or simply more receptor.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  significance: >-
    If ciliary signalling is qualitatively distinct, the cilium is a separate control point on
    GnRH-neuron excitability and a candidate explanation for the hypogonadism seen in
    ciliopathies.
  resolution: >-
    Compartment-resolved measurement of the proximal cascade in ciliated and deciliated GnRH
    neurons expressing receptor matched for surface density, with ciliary and somatic targeting
    used to separate amount from location.
  provenance:
  - reference_id: PMID:24982149
    supporting_text: >-
      disruption of cilia selectively on GnRH neurons leads to a significant reduction in
      kisspeptin-mediated GnRH neuronal activity
  - reference_id: PMID:24982149
    supporting_text: >-
      the impact of cilia on signaling to central neurons has never been demonstrated
suggested_questions:
- question: >-
    Does the Gq/11 requirement of the osteoclast SRC-DUSP18 branch reflect a second-messenger step
    that the inhibitors used did not cover, or a non-canonical, scaffolding role for Gq/11 at the
    receptor tail?
- question: >-
    Is the kisspeptin-evoked cation current in mouse GnRH neurons carried by one TRPC subunit or by
    heteromers, and does the calcium-independence reported for the TRPC current reconcile with the
    IP3-receptor dependence of the overall depolarization?
suggested_experiments:
- description: >-
    Cross GnRH-neuron Cre lines to floxed alleles of the TRPC subunits detected in these neurons,
    singly and in combination, and measure the kisspeptin-evoked inward current, firing response
    and LH release in each genotype, with the PIP2-depletion and calcium-buffering manipulations
    applied in the same recordings.
  hypothesis: >-
    A specific TRPC heteromer carries the kisspeptin current and is gated by PIP2 depletion rather
    than by a rise in calcium, with the IP3-receptor dependence of the overall response reflecting
    the separate potassium-channel arm.
- description: >-
    In primary osteoclasts, test receptor-tail motif mutants and effector-null backgrounds for
    recruitment of SRC and DUSP18, Dusp18 induction, SRC Tyr-416 phosphorylation and pit formation,
    including osteoclasts in which Gq/11 is replaced by signalling-dead mutants that still bind the
    receptor.
  hypothesis: >-
    Gq/11 engagement is required as a conformational or scaffolding step at the receptor rather
    than for second-messenger production, which would explain why the branch survives inhibition
    of phospholipase C, protein kinase C, ERK and CaMKII.
