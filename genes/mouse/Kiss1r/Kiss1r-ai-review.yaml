  review:
    summary: >-
      Kisspeptin acting on Gpr54 depolarizes GnRH neurons, by concurrently opening TRPC-like
      non-selective cation channels and inhibiting inwardly-rectifying (Kir) potassium channels.
      The direction is established by the cited electrophysiology, so the unsigned parent term is
      less precise than the evidence allows.
    action: MODIFY
    reason: >-
      The claim is sound, but the cited study measures a concentration-dependent depolarization
      with an EC50 of 2.8 nM, i.e. positive regulation. GO:1904181 positive regulation of
      membrane depolarization (checked in OLS: a direct child of GO:0003254) is the supported
      term. The human review refines its projected copy of this row, which rests on this same
      mouse study, to the same term.
    proposed_replacement_terms:
    - id: GO:1904181
      label: positive regulation of membrane depolarization
    supported_by:
    - reference_id: PMID:18434521
      supporting_text: kisspeptin depolarized GnRH neurons in a concentration-dependent manner
    - reference_id: PMID:18434521
      supporting_text: >-
        caused by the concurrent inhibition of barium-sensitive, inwardly rectifying (Kir)
        potassium channels and activation of sodium-dependent, nonselective cationic channels
