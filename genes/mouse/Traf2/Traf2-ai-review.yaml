- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:101835
  - PANTHER:PTN002562154
  - UniProtKB:Q12933
  review:
    summary: RING-dependent ubiquitin ligase activity of TRAF2.
    action: KEEP_AS_NON_CORE
    reason: 'Mouse data support TRAF2-dependent K63-linked ubiquitination of specific substrates: GbetaL/MLST8 ubiquitination
      is reduced in Traf2-/- MEFs and with a RING-deleted TRAF2 (PMID:28489822), and cIAP1/2 K63 ubiquitination correlates
      with TRAF2 (PMID:18997792). However, whether TRAF2 is an autonomous E3 is contested: the TRAF2 RING is dispensable for
      TNF-induced canonical NF-kappaB and RIPK1 ubiquitylation in mouse cells (PMID:19815541), and the recruited cIAPs, not
      TRAF2, are the principal E3s in TNFR1 signaling (PMID:26701909). PAINT placed GO:0004842 at the Euteleostomi TRAF2 node
      PTN002562154 with mouse and human donors, so the activity is inherited within PTHR10131:SF21. Kept, but as non-core,
      consistent with the human TRAF2 review.'
    supported_by:
    - &id007
      reference_id: PMID:28489822
      supporting_text: Mechanistically, the TRAF2 E3 ubiquitin ligase promotes K63-linked polyubiquitination of GβL, which
        disrupts its interaction with the unique mTORC2 component SIN1
    - &id037
      reference_id: PMID:28489822
      supporting_text: GβL ubiquitination was significantly reduced in Traf2−/− cells or cells expressing mutant TRAF2 with
        its RING domain removed
    - &id008
      reference_id: PMID:19815541
      supporting_text: Remarkably, the RING domain of TRAF2 was dispensable for these functions. However, like the TRAF2 CIM,
        the RING domain of TRAF2 was required for protection against TNF-induced apoptosis.
    - &id036
      reference_id: PMID:26701909
      supporting_text: Furthermore, the role of the TRAF2 RING is controversial.
