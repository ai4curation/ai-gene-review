id: P39429
gene_symbol: Traf2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Traf2 encodes TNF receptor-associated factor 2, a cytoplasmic signaling adaptor of the TRAF family with an N-terminal
  RING domain, TRAF-type zinc fingers, a trimerizing coiled coil and a C-terminal TRAF/MATH domain. Through the MATH domain
  it binds the cytoplasmic tails of TNF receptor superfamily members (TNFR2, CD40, CD27, OX40, LTbetaR, RANK) and reaches
  TNFR1 via TRADD; through a cIAP-interacting motif it recruits the cIAP1/cIAP2 ubiquitin ligases, and it also assembles with
  MAP3Ks such as ASK1 and TAK1. In mouse cells and tissues TRAF2 is required for TNF-induced JNK activation, contributes (redundantly
  with TRAF5) to canonical NF-kappaB activation, is essential for CD40-driven canonical NF-kappaB and proliferation in B cells,
  and protects thymocytes, keratinocytes and other cells from TNF-induced death. With TRAF3 and cIAP1/2 it forms the complex
  that constitutively degrades NIK, so TRAF2 loss causes constitutive non-canonical NF-kappaB activity, and receptor-induced,
  TRAF2-dependent TRAF3 degradation releases NIK. TRAF2 also links IRE1 to ASK1-JNK during ER stress, couples IL-17 receptor
  signaling to chemokine mRNA stabilization, and promotes K63-linked ubiquitination of GbetaL/MLST8 to favour mTORC1 over
  mTORC2 assembly. Whether its atypical RING acts as an autonomous E3 in vivo is unresolved; many of its ubiquitin-dependent
  outputs are executed by recruited cIAPs. Traf2-deficient mice die early with runting, lymphoid atrophy and elevated serum
  TNF.
