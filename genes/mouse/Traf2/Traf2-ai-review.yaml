    label: ubiquitin protein ligase activity
  evidence_type: IDA
  original_reference_id: PMID:28489822
  qualifier: enables
  review:
    summary: RING-dependent ubiquitin ligase activity of TRAF2.
    action: KEEP_AS_NON_CORE
    reason: 'Mouse data support TRAF2-dependent K63-linked ubiquitination of specific substrates: GbetaL/MLST8 ubiquitination
      is reduced in Traf2-/- MEFs and with a RING-deleted TRAF2 (PMID:28489822), and cIAP1/2 K63 ubiquitination correlates
      with TRAF2 (PMID:18997792). However, whether TRAF2 is an autonomous E3 is contested: the TRAF2 RING is dispensable for
      TNF-induced canonical NF-kappaB and RIPK1 ubiquitylation in mouse cells (PMID:19815541), and the recruited cIAPs, not
      TRAF2, are the principal E3s in TNFR1 signaling (PMID:26701909). PAINT placed GO:0004842 at the Euteleostomi TRAF2 node
      PTN002562154 with mouse and human donors, so the activity is inherited within PTHR10131:SF21. Kept, but as non-core,
      consistent with the human TRAF2 review.'
    supported_by:
    - *id007
    - *id037
    - *id008
    - *id036
