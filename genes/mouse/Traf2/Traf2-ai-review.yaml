- term:
    id: GO:0033209
    label: tumor necrosis factor-mediated signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:101835
  - PANTHER:PTN000805720
  - RGD:1310457
  - UniProtKB:Q12933
  review:
    summary: TRAF2 is a component of TNFR1/TNFR2 signaling complexes and transduces TNF signals to JNK, NF-kappaB and survival.
    action: ACCEPT
    reason: Core process. Traf2-/- mouse cells show severely reduced TNF-induced JNK and mildly reduced NF-kappaB, with sensitization
      to TNF-induced death (PMID:9390694); TRAF2-mediated cIAP recruitment is needed for TNFR1-induced NF-kappaB (PMID:19815541);
      keratinocyte Traf2 deletion disrupts TNF signalling (PMID:26701909). PAINT placed this term at PTN000805720 with MGI:101835
      as a donor.
    supported_by:
    - *id026
    - *id016
    - &id027
      reference_id: PMID:26701909
      supporting_text: Keratinocyte-specific deletion of Traf2, but not Sphk1 deficiency, disrupted TNF mediated NF-κB and
        MAP kinase signalling and caused epidermal hyperplasia and psoriatic skin inflammation.
