- term:
    id: GO:0030163
    label: protein catabolic process
  evidence_type: IMP
  original_reference_id: PMID:12958312
  qualifier: acts_upstream_of_or_within
  review:
    summary: TRAF2 participates in CD40-induced degradation of TRAF3.
    action: KEEP_AS_NON_CORE
    reason: Experimentally supported in TRAF2-deficient B cell lines (PMID:12958312) and in mouse BAFF-R signaling (PMID:18313334).
      TRAF2 recruits the cIAPs that ubiquitinate TRAF3 (PMID:18997792), so the term is real but describes a regulatory consequence
      rather than the core activity.
    supported_by:
    - reference_id: PMID:12958312
      supporting_text: We also find that TRAF2 participates in the degradation of TRAF3 associated with CD40 signaling, a
        role that may limit inhibitory actions of TRAF3.
    - *id022
