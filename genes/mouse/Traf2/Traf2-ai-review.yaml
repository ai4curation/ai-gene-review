- description: Signaling adaptor that couples ligated TNF receptor superfamily complexes (TNFR1 via TRADD, TNFR2, CD40) to
    cIAP1/2, LUBAC/HOIP, IKK and MAP3Ks, driving canonical NF-kappaB and JNK activation and protecting cells from TNF-induced
    apoptosis. Established by mouse knockout and reconstitution experiments.
