suggested_questions:
- question: Does the TRAF2 RING have catalytic E3 activity in vivo in mouse, or are all RING-dependent outputs (anti-apoptosis,
    GbetaL ubiquitination) explained by the RING acting as a structural or partner-recruiting module?
- question: TRAF2 acts mainly as a negative regulator of non-canonical NF-kappaB in resting cells. Should this be captured
    with negative regulation of non-canonical NF-kappaB signal transduction (GO:1901223)? Neither TRAF3 nor cIAP1/2 carries
    that term in mouse or human GOA, so the current convention needs to be understood first.
- question: How much of the Traf2-null phenotype reflects TNF-driven toxicity versus loss of cell-intrinsic signaling, given
    partial rescue by Tnf or Tnfrsf1a deletion?
suggested_experiments:
- description: Knock-in mice carrying RING-inactivating point mutations (rather than RING deletion) in Traf2, compared with
    cIAP-interacting-motif mutants, to separate catalytic, structural and cIAP-recruitment roles in TNF-induced survival,
    JNK activation and NIK control.
- description: In vitro reconstitution with purified mouse TRAF2, defined E2s and candidate substrates (RIPK1, GbetaL, cIAP1)
    with and without sphingosine-1-phosphate, using cIAP-free preparations, to test autonomous E3 activity.
