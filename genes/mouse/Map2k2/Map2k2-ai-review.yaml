id: Q63932
gene_symbol: Map2k2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Map2k2 (MEK2) is a dual-specificity protein kinase of the STE7/MAP2K family that, together with its paralog Map2k1
  (MEK1), forms the middle tier of the RAF-MEK-ERK cascade. Activated by RAF phosphorylation of two activation-loop serines
  (Ser222 and Ser226), it phosphorylates the threonine and tyrosine of the Thr-Glu-Tyr motif of ERK1 (Mapk3) and ERK2 (Mapk1),
  activating them. Mouse MEK2 is largely cytosolic, with a pool recruited to membranes by scaffolds such as KSR1, and it forms
  a heterodimer with MEK1 through which MEK1 feedback phosphorylation tunes the strength and duration of the ERK signal. Mek2-null
  mice are viable and fertile, because Mek1 compensates; combined loss of Mek1 and Mek2 shows that the MEK tier is required
  for ERK signalling in placenta, neural crest, respiratory tract, peripheral nervous system and axon growth.
