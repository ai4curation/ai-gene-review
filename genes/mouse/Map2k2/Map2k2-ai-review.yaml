core_functions:
- description: Dual-specificity MAP kinase kinase that phosphorylates the activation-loop Thr and Tyr of ERK1 and ERK2 in
    the cytosol, acting (redundantly with Map2k1) as the MAP2K tier of the ERK1/ERK2 cascade. Experimentally established for
    the mouse protein.
  molecular_function:
    id: GO:0004708
    label: MAP kinase kinase activity
  directly_involved_in:
