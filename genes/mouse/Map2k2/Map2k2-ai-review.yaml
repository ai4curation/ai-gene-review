  review:
    summary: IBA from PAINT node PTN000684494, the MAP2K node spanning yeast, fly, worm and vertebrate MAP2Ks; Map2k2 sits
      inside it in the MEK2 subfamily PTHR47448:SF3.
    action: MODIFY
    reason: 'The node placement is sound: Map2k2 is a MAP2K in the MEK2 subfamily (PTHR47448:SF3) under the PAINT MAP2K node,
      and every member acts in a MAPK cascade. For Map2k2 the mouse evidence identifies the cascade: recombinant mouse MEK2
      phosphorylates Erk-1 on Thr and Tyr (PMID:8297798) and Mek2 mediates Erk1/Erk2 activation in mouse cells and embryos
      (PMID:19219045). The term is correct but less specific than supported, so refine to ERK1 and ERK2 cascade (GO:0070371),
      which this gene already carries (IGI, ISO, IEA rows).'
