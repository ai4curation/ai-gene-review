suggested_questions:
- question: MGI IMP rows annotate Map2k2 to myelination and Schwann cell development from PMID:10704452 (erbB2 conditional
    mutants) and PMID:18760695 (Nrg1/ErbB mutants), with WITH/FROM naming Erbb2, Erbb3 and Nrg1 alleles; neither paper mentions
    Mek2. Are these gene mis-attributions, and is the ERBB2-ERBB3 signaling IDA from PMID:24493648 (Mek1DD) intended for Map2k1?
- question: Which MEK2 subcellular localizations (endosomes, Golgi, mitochondria, focal adhesions) rest on MEK2-specific data
    rather than MEK1 or pan-MEK antibodies?
suggested_experiments:
- description: Schwann-cell-specific deletion of Mek1 on a Mek2-null background (e.g. Dhh-Cre or P0-Cre), with Mek2 re-expression
    rescue, to test directly whether the MEK tier, and Mek2 specifically, is required for myelination.
- description: Endogenous epitope tagging of Mek2 versus Mek1 in mouse cells, with organelle markers, to establish paralog-specific
    localization and the role of the Mek2-specific C-terminal PDZ-binding motif.
