    action: KEEP_AS_NON_CORE
    reason: For mouse MEK2 the supporting observations are that mammalian KSR binds MEKs and shifts them into a >700 kDa membrane-associated
      complex (PMID:10409742) and that active Mek2 bridges Pin1 and BPGAP1 (PMID:20179103). The KSR-dependent BRAF activation
