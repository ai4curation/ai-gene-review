id: P05063
gene_symbol: Aldoc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Aldoc encodes fructose-bisphosphate aldolase C, the brain-enriched vertebrate
  class I aldolase isozyme. It is a soluble cytosolic homotetramer that uses a
  conserved Schiff-base lysine to catalyze the reversible EC 4.1.2.13 reaction
  interconverting beta-D-fructose 1,6-bisphosphate with dihydroxyacetone
  phosphate and D-glyceraldehyde 3-phosphate. In mouse the protein is best known
  as the zebrin II marker of parasagittal Purkinje-cell compartments in the
  cerebellum, but the same conserved catalytic activity places it in glycolysis
  and fructose 1,6-bisphosphate metabolism in other Aldoc-expressing cells.
