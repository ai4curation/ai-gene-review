suggested_questions:
- question: >-
    Does Aldoc protein carry measurable gluconeogenic aldolase flux in
    calorie-restricted mouse liver, or is the Aldoc transcript increase in that
    context an indirect expression change while Aldob remains the physiological
    liver isozyme?
- question: >-
    Are the rat Aldoc axon and postsynaptic-cytosol annotations supported by
    direct aldolase C immunolocalization in the source full texts, or are they
    collateral uses of zebrin II/Aldoc as a Purkinje-cell compartment marker?
suggested_experiments:
- description: >-
    Combine isozyme-specific Aldoc and Aldob protein quantification with
    13C-lactate or 13C-alanine tracing in control and calorie-restricted mouse
    liver to test whether Aldoc contributes directly to fructose
    1,6-bisphosphate formation in hepatic gluconeogenesis.
- description: >-
    Perform endogenous Aldoc immunoelectron microscopy in mouse Purkinje cells
    to resolve whether Aldoc is enriched in axons, postsynaptic cytosol, or only
    the broader soluble cytosol of zebrin II-positive compartments.
