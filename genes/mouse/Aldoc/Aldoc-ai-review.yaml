core_functions:
- description: >-
    Cytosolic fructose-bisphosphate aldolase C catalyzes the reversible class I
    aldolase reaction that cleaves beta-D-fructose 1,6-bisphosphate to
    dihydroxyacetone phosphate and D-glyceraldehyde 3-phosphate in glycolysis.
  molecular_function:
