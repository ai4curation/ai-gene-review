    label: gluconeogenesis
  evidence_type: IDA
  original_reference_id: PMID:24958256
  qualifier: involved_in
  review:
    summary: >-
      Calorie-restriction transcriptomics row that overreaches from Aldoc mRNA to
      a gluconeogenic Aldoc role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper reports Aldoc transcript induction in calorie-restricted mouse
      liver and interprets the transcript pattern as favoring hepatic
      gluconeogenesis. That is expression evidence, not a direct Aldoc flux or
      activity assay. The UniProt CC:FUNCTION gluconeogenesis sentence is an
      ECO:0000250 by-similarity statement, and the Reactome gluconeogenesis
      xref likewise reflects class I aldolase model transfer rather than direct
      mouse Aldoc evidence. Aldoc is the brain aldolase isoform whereas mouse
      liver expresses aldolase B. This conflicts with the reviewed
      gluconeogenesis GO-CAMs, which use Aldoc as the cytosolic aldolase step;
      Aldob is the better-supported liver/kidney gluconeogenic isoform.
    supported_by:
    - reference_id: PMID:24958256
      supporting_text: Aldoc = 2.7-fold, p = 0.0008
    - reference_id: PMID:4262895
      supporting_text: Aldolase B occurs in both parenchymal and non-parenchymal
        tissue.
    - reference_id: file:mouse/Aldoc/Aldoc-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        plays a key role in glycolysis and gluconeogenesis.
        {ECO:0000250|UniProtKB:P09972}
    - reference_id: file:mouse/Aldoc/Aldoc-uniprot.txt
