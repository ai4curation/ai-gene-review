  findings:
  - statement: Mouse BICDR-1 binds GTP-bound Rab6A/B directly through its C-terminal domain; Lys-512
      is required.
    supporting_text: showed that lysine 512 is required for binding to Rab6
  - statement: BICDR-1 co-precipitates dynein/dynactin and recruits them to the pericentrosomal
      region.
    supporting_text: Overexpression of GFP-BICDR-1 caused an approximately two-fold increase in
      pericentrosomal dynein/dynactin fluorescent staining intensity
