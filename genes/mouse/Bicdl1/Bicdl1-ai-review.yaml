core_functions:
- description: Activating adaptor for cytoplasmic dynein-1. BICDR-1 binds dynein and dynactin,
    recruits predominantly two dyneins per dynactin and activates fast processive minus-end-directed
    motility, while its C-terminal domain binds GTP-Rab6 on post-Golgi secretory vesicles, thereby
    moving Rab6 vesicles toward microtubule minus ends and concentrating them around the centrosome.
  molecular_function:
    id: GO:0140660
    label: cytoskeletal motor activator activity
  directly_involved_in:
