- term:
    id: GO:0140660
    label: cytoskeletal motor activator activity
  evidence_type: IDA
  original_reference_id: PMID:29420470
  review:
    summary: Purified mouse BICDR1 assembles with dynein and dynactin into processive minus-end
      directed complexes that predominantly contain two dyneins and move faster and with more force
      than BICD2 complexes.
    action: NEW
    reason: The core molecular function of BICDR-1 is to activate dynein-dynactin motility (an
      activating adaptor). This is established directly with recombinant mouse BICDR1 in
      single-molecule motility and cryo-EM studies, and is a molecular function rather than a
      process, so the process-specific NEW bar on substrates does not apply. GO:0140660 is defined
      as binding to and increasing the activity of a motor protein, which matches the mechanism.
      Other activating adaptors (human BICD2, HOOK3) currently carry dynein complex binding rather
      than this term, so this is noted as a convention question in suggested_questions.
    supported_by:
    - reference_id: PMID:29420470
      supporting_text: We conclude the majority of motile complexes containing BICD2 have one
        dynein, whereas both BICDR1 and HOOK3 preferentially recruit two.
    - reference_id: PMID:29420470
      supporting_text: Previous work on BICDR1 in cells14 and HOOK3 in vitro5,10,11,19 showed
        complexes containing these adaptors move faster than those with BICD2.
    - reference_id: PMID:29420470
      supporting_text: 'The following adaptors were codon optimized for Sf9 expression (Epoch Life
        Science): mouse BICDR1 (BICDL1)'
- term:
    id: GO:0070840
    label: dynein complex binding
  evidence_type: IDA
  original_reference_id: PMID:36071160
  review:
    summary: Cryo-EM of dynein-dynactin with full-length purified mouse BICDR1 on microtubules shows
      two BICDR1 adaptors bound to the complex, both making similar contacts with the dynein heavy
      chains; GFP-BICDR-1 also co-precipitates dynein subunits.
    action: NEW
    reason: Direct binding to the dynein complex is an experimentally established mouse activity
      and is the term used for other dynein activating adaptors such as BICD2. It complements
      dynactin binding; together they describe the adaptor's motor-binding interface.
    supported_by:
    - reference_id: PMID:36071160
      supporting_text: Full-length mouse BICDR with an N-terminal ZZ-TEV tag was purified using
        baculovirus expression in the same way as dynein described above
    - reference_id: PMID:36071160
      supporting_text: Both adaptors make similar interactions with the dyneins but diverge in their
        contacts with each other and dynactin.
