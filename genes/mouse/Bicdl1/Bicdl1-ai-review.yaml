- term:
    id: GO:0031175
    label: neuron projection development
  evidence_type: IMP
  original_reference_id: PMID:20360680
  qualifier: involved_in
  review:
    summary: Sustained (over)expression of BICDR-1 in cultured hippocampal neurons reduces neurite
      outgrowth; the authors conclude that BICDR-1 restricts anterograde secretory transport and
      inhibits neuritogenesis early in differentiation, its normal down-regulation permitting
      outgrowth.
    action: MODIFY
    reason: The evidence is a gain-of-function (sustained expression) phenotype, and the direction
      of the effect is inhibitory, so the positive process term misstates it. The supported claim is
      negative regulation of neuron projection development, and even this is an indirect cellular
      consequence of where BICDR-1 positions Rab6 secretory vesicles rather than an activity
      executed within neurite growth. It is retained as a non-core regulatory role. Morpholino
      phenotypes in zebrafish in the same paper are not mouse evidence and are not used here.
    proposed_replacement_terms:
    - id: GO:0010977
      label: negative regulation of neuron projection development
    supported_by:
    - reference_id: PMID:20360680
      supporting_text: At 2, 3 and 4 days after transfection, BICDR-1-transfected neurons showed a
        marked reduction in neurite outgrowth compared with control cells transfected with an empty
        vector and β-galactosidase
    - reference_id: PMID:20360680
      supporting_text: At early developmental stages, pericentrosomal BICDR-1 restricts secretory
        transport and inhibits neuritogenesis, whereas later during neuronal development the
        reduction in BICDR-1 expression permits anterograde transport required for neurite outgrowth.
