id: A0JNT9
gene_symbol: Bicdl1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Bicdl1 (BICD family-like cargo adapter 1; also known as BICDR-1) is a coiled-coil activating
  adaptor for cytoplasmic dynein-1. Its N-terminal coiled-coil region binds the dynein tail and
  dynactin and assembles a dynein-dynactin-adaptor complex that is highly processive; with mouse
  BICDR-1 the complex preferentially contains two dynein dimers (and, on microtubules, two adaptor
  molecules), which increases motor speed and force. Its C-terminal BICDL1/2-like domain binds the
  GTP-bound form of the small GTPase Rab6 (Rab6A and, most strongly, Rab6B) directly, with Lys-512
  required for binding, so that BICDR-1 couples dynein-dynactin to Rab6-positive post-Golgi
  secretory vesicles. It also binds the tail of the kinesin-3 KIF1C. In cultured cells and young
  neurons BICDR-1 concentrates around the centrosome together with dynein-dynactin and Rab6/NPY
  vesicles, in a microtubule- and dynein-dependent manner, and it shifts Rab6 vesicle traffic
  toward the microtubule minus end. Expression is high in early embryonic and undifferentiated
  neural tissue, kidney and developing eye and declines as neurons extend neurites; sustained
  expression in cultured neurons retains secretory vesicles in the cell body and suppresses neurite
  outgrowth.
