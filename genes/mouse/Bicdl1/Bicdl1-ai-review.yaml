      whereas both BICDR1 and HOOK3 preferentially recruit two.
  - reference_id: PMID:20360680
    supporting_text: Together these data indicate that BICDR-1 localizes to Rab6-positive vesicles
      and required for the pericentrosomal distribution of Rab6 vesicles.
- description: Rab6 effector. The C-terminal BICDL1/2-like domain binds GTP-bound Rab6A and Rab6B
    directly (Lys-512 required), linking the adaptor to its vesicle cargo.
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  directly_involved_in:
  - id: GO:0047496
    label: vesicle transport along microtubule
  supported_by:
