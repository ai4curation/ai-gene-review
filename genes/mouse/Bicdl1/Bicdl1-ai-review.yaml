      their transport to the minus-end direction.
    supporting_text: Together these data indicate that BICDR-1 localizes to Rab6-positive vesicles
      and required for the pericentrosomal distribution of Rab6 vesicles.
  - statement: BICDR-1 binds the KIF1C tail and recruits KIF1C to Rab6 vesicles.
    supporting_text: Here, we show that BICDR-1 does not interact with Kif5 but recruits
      kinesin-3/Kif1C to Rab6 secretory vesicles in hippocampal neurons.
