    supporting_text: Binding of BICDR-1 to Rab6A is direct because the purified His-tagged
      C-terminus of BICDR-1 (amino acids 382–577) interacts with purified GST-Rab6A and GST-Rab6B and
      not with GST only
suggested_questions:
- question: Should coiled-coil dynein activating adaptors (BICD2, BICDR1, HOOK3) carry cytoskeletal
    motor activator activity (GO:0140660), given that current annotations of these adaptors use only
    dynein complex binding and dynactin binding?
- question: Does endogenous BICDR-1 act on regulated dense-core secretory granules in neurons or
    neuroendocrine cells, or only on constitutive Rab6 exocytic carriers, which would decide whether
    Golgi to secretory granule transport is an appropriate process term?
suggested_experiments:
- description: Conditional Bicdl1 knockout in mouse cortical or hippocampal neurons, with live
    imaging of Rab6/NPY vesicles and neurite outgrowth, to obtain mammalian loss-of-function evidence
    (current mammalian neuronal data are from sustained expression, and in vivo loss-of-function data
    are from zebrafish morpholinos).
