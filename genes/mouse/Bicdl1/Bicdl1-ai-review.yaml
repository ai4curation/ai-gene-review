- term:
    id: GO:0055107
    label: Golgi to secretory granule transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1922915
  - PANTHER:PTN001281025
  review:
    summary: PAINT propagation from PTN001281025 seeded by this gene's own MGI IMP annotation from
      PMID:20360680.
    action: KEEP_AS_NON_CORE
    reason: The node placement is sound and mouse Bicdl1 is the experimental seed (its presence in
      the WITH/FROM is expected, not circular). The term describes the post-Golgi delivery of
      Rab6/NPY secretory carriers whose distribution BICDR-1 controls. BICDR-1 does not sort cargo
      from the Golgi into granules and does not affect exocytosis itself; its executed role is motor
      recruitment and activation on vesicles that have already left the Golgi, captured by vesicle
      transport along microtubule. Retained as a non-core, pathway-level description, consistent
      with the IMP row.
    supported_by:
    - reference_id: PMID:20360680
      supporting_text: Together these data suggest that BICDR-1 does not influence secretory vesicle
        exocytosis but controls the distribution of secretory carriers.
