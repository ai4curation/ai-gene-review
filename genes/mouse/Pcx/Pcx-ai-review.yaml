id: E9QPD7
gene_symbol: Pcx
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Pcx encodes the mitochondrial matrix pyruvate carboxylase, a biotin-dependent
  homotetrameric ligase that uses ATP to carboxylate pyruvate and form oxaloacetate
  plus ADP and phosphate. Each subunit contains a biotin carboxylation domain, an
  ATP-grasp domain, a pyruvate carboxyltransferase domain and a C-terminal
  biotinyl-carrier domain; the enzyme first carboxylates its covalently attached
  biotin and then transfers that carboxyl group to pyruvate. In mouse liver, Pcx
  provides oxaloacetate for anaplerotic replenishment of the tricarboxylic acid
  cycle, for gluconeogenesis from lactate and alanine, and for biosynthetic
  outputs that depend on TCA-cycle intermediates, including urea-cycle and redox
  metabolism. Liver-specific knockout suppresses hepatic gluconeogenesis and
  depletes TCA-cycle intermediates.
