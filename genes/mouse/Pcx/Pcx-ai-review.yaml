suggested_questions:
- question: Is the context-specific cytosolic MDH1-ME1-PC hydride-transfer complex
    detectably assembled by mouse Pcx in prostate or hypoxic cancer models, and is
    that pool separable from canonical mitochondrial matrix Pcx?
- question: Which mouse tissues rely most on Pcx-derived oxaloacetate for anaplerosis
    versus gluconeogenesis or glyceroneogenesis under fasting, feeding and
    high-fat-diet states?
suggested_experiments:
- description: Use compartment-resolved 13C lactate or pyruvate tracing in primary
    mouse hepatocytes with acute Pcx depletion to separate matrix oxaloacetate
    production, malate/aspartate export and glucose production.
- description: Immunoprecipitate endogenous Pcx with Mdh1 and Me1 from hypoxic mouse
    cancer cells while quantifying cytosolic NADH-to-NADP+ hydride transfer to test
    whether the human HTC annotation transfers to mouse as a direct Pcx complex.
