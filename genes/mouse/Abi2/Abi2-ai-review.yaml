suggested_questions:
- question: Does Abi2 act in dendritic spines as part of the canonical WRC, or does it have WRC-independent
    roles (e.g. via Abl kinases) at synapses? Abi1 is also expressed in brain, so how much redundancy
    is there?
- question: Is the ABI2 effect on ABL1-mediated phosphorylation of Mena/WAVE2 a true stimulation of kinase
    activity, or adaptor-mediated substrate recruitment? The answer decides whether "positive regulation
    of protein tyrosine kinase activity" is the right process term.
suggested_experiments:
- description: Conditional (neuron-specific) Abi2 deletion combined with Abi1 deletion, with WRC-assembly-deficient
    versus SH3-deleted Abi2 rescue constructs, to separate WRC-dependent from Abl-dependent functions
    in spine morphogenesis and memory.
