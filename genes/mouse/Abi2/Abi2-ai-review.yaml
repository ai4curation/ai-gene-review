    label: mitophagy
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9NYB9
  review:
    summary: Mitophagy, transferred from human ABI2 (IDA, PMID:38081847).
    action: KEEP_AS_NON_CORE
    reason: In human cells, PINK1/Parkin-dependent phosphorylation of GRAF1 recruits ABI2 and assembles
      the WAVE2 complex on damaged mitochondria, where Arp2/3-dependent branched actin is needed for mitochondrial
      clearance. ABI2 therefore does part of the work as a WRC subunit supplying actin-nucleation-promoting
      activity to this process. This is a context-specific deployment of its general WRC role, so it is
      retained as non-core; there is no mouse-specific evidence yet.
    supported_by:
    - reference_id: PMID:38081847
      supporting_text: In turn, GRAF1 phosphorylation is induced in a PINK1-Parkin dependent fashion on
        damaged mitochondria which leads to ABI2 recruitment, WAVE2 complex formation and Arp2/3-dependent
        branched actin formation that is necessary for mitochondrial clearance.
- term:
    id: GO:0001764
    label: neuron migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:106913
  - PANTHER:PTN000825624
  - WB:WBGene00015146
  review:
    summary: Neuron migration, inferred phylogenetically from ABI family members including mouse Abi2
      itself.
    action: KEEP_AS_NON_CORE
    reason: Abi2-null mice show migration defects of neocortical and hippocampal neurons (PMID:15572692),
      and Abi2 overexpression rescues cortical radial migration in Pcdhα knockdown neurons (PMID:29911975).
      The WRC drives the leading-edge protrusion that migrating neurons use, so participation is plausible.
      Neuron migration is one cell-type-specific instance of the WRC role in cell migration, so it is
      kept as non-core.
    supported_by:
    - reference_id: PMID:15572692
      supporting_text: Loss of Abi2 also resulted in cell migration defects in the neocortex and hippocampus,
        abnormal dendritic spine morphology and density, and severe deficits in short- and long-term memory.
    - reference_id: PMID:29911975
      supporting_text: Remarkably, we found that overexpression of either WAVE2 (Wasf2) or Abi2 in vivo
        rescues the cortical neuron migration defect of αKD neurons (Figure 2B) although they themselves
        have no apparent influence on cortical neuron migration (Figure 2C).
