  review:
    summary: Nucleus, transferred from human ABI2.
    action: MARK_AS_OVER_ANNOTATED
    reason: The human source of this row is not the Human Protein Atlas. In genes/human/ABI2/ABI2-goa.tsv,
      GO:0005634 nucleus is IEA from GO_REF:0000044 via the UniProt subcellular-location keyword UniProtKB-SubCell:SL-0191
      (line 8); the HPA immunofluorescence IDA (GO_REF:0000052, line 126) supports GO:0005654 nucleoplasm
      instead. So the mouse row is an ISO transfer of a keyword-derived electronic assertion, with no
      experimental nuclear localization of ABI2 behind it in either species. The nucleocytoplasmic-shuttling
      literature in this family concerns the ABI1 paralog, and no nuclear function has been established
      for ABI2; its localization set is actin-rich and junctional. Over-annotated rather than a genuine
      minor site.
    supported_by:
    - reference_id: file:mouse/Abi2/Abi2-deep-research-falcon.md
      supporting_text: Abi2 exhibits a characteristic localization pattern to sites of dynamic actin reorganization
        and cell-cell contact
    - reference_id: file:mouse/Abi2/Abi2-deep-research-falcon.md
      supporting_text: Abl interactor 1 (abi-1) wave-binding and snare domains regulate its nucleocytoplasmic
        shuttling, lamellipodium localization, and wave-1 levels.
