core_functions:
- description: >-
    Inferred from the 1:1 human ortholog: binds 3' single-stranded overhangs at partially resected
    DSBs through the C-terminal OB-fold region, limiting long-range resection and RAD51-dependent HR
    and favouring end joining. The mouse protein conserves this region (79% identity) and the OB fold
    B exon. Mouse-experimental support is functional: Shld2 loss increases resection at switch-region
    breaks and at deprotected telomeres, and Shld2 is required for CST-Polα fill-in at DSBs in
    Brca1-deficient MEFs. No ssDNA-binding assay has been done on mouse protein.
  molecular_function:
