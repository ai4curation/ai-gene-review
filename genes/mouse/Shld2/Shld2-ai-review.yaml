    supporting_text: Nevertheless, we conclude that the shieldin complex promotes CSR by inhibiting excessive
      DNA end resection, and the presence of a significant Ig lo population during CSR may be a useful proxy
      indicator for increased DNA resection in the Igh locus.
- description: >-
    Scaffold of the shieldin complex, linking the SHLD3-REV7 recruitment module (N-terminus) to SHLD1
    and the OB-fold DNA-binding module (C-terminus). The domain mapping is human. In mouse CH12 cells,
    REV7 co-purifies SHLD1-SHLD2, and a REV7 surface mutant that loses SHLD1-SHLD2 binding cannot
    support CSR. The N-terminal recruitment segment is 68% identical between mouse and human.
