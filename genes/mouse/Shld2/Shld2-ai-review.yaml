id: Q3UEN2
gene_symbol: Shld2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Shld2 (Fam35a, Rinn2) encodes an 891-residue nuclear protein, the central non-enzymatic subunit of
  shieldin. This vertebrate DNA double-strand-break (DSB) end-protection complex contains SHLD1, SHLD2,
  SHLD3 and REV7 (MAD2L2), and it acts downstream of 53BP1 and RIF1. The protein has a short N-terminal
  segment that, in the human ortholog, binds the SHLD3-REV7 recruitment module. Its C-terminal region
  has three RPA1-like OB folds that bind SHLD1 and single-stranded DNA. In mouse cells and mice, loss
  of Shld2 increases resection of DSB ends. Resection rises at AID-induced switch-region breaks in B
  cells and at deprotected telomeres in fibroblasts. CH12 B cells lacking Shld2 switch poorly from IgM
  to IgA, and a mouse Shld2 transgene restores switching. Shld2-null mice have reduced
  class-switched antibody in vivo. Their lymphocytes develop normally and V(D)J recombination is
  unaffected. Loss of Shld2 suppresses the embryonic lethality of the Brca1 exon-11 deletion. It
  barely rescues complete Brca1 loss, so in mice 53BP1 also suppresses homologous recombination
  partly independently of shieldin. In Brca1-deficient fibroblasts, Shld2 is needed for
  CST-polymerase alpha-primase fill-in synthesis at DSBs. Direct ssDNA binding and the scaffold
  architecture have been shown biochemically only for the human ortholog. They are inferred for mouse
  from 1:1 orthology and conservation of both modules.
