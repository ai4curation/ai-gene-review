      cultures of WT and SHLD3-complemented Shld3-/- CH12-F3, yet highly enriched in Rev7-/-, Shld2-/-, and
      Shld3-/- cells
  - reference_id: PMID:30022158
    supporting_text: Similarly, the 5′ end resection was increased by Rev7- or Shld2-deficiency
  - reference_id: file:mouse/Shld2/Shld2-bioinformatics/RESULTS.md
    supporting_text: 'The C-terminal OB-fold region (human long-form 421-904) is 381/484 identical (0.787),
      the most conserved part of the protein.'
- description: >-
    End protection at AID-induced switch-region breaks during immunoglobulin class-switch recombination.
    This is experimentally established in mouse. Shld2-/- CH12 cells, primary B cells and mice have
    impaired CSR, a mouse Shld2 transgene restores it, and V(D)J recombination is unaffected. Without
    Shld2, switch-region ends are over-resected and acceptor constant-region exons are lost.
