    label: chromatin
  evidence_type: NAS
  original_reference_id: PMID:29656893
  qualifier: located_in
  review:
    summary: Shieldin acts on damaged chromatin at DSBs; ComplexPortal statement for the mouse complex.
    reason: >-
      Shieldin is recruited to DSB chromatin downstream of 53BP1-RIF1. No study has imaged mouse
      Shld2 directly. Mouse genetics place its action on chromatin: Shld2 loss raises RPA-ssDNA
      occupancy at Igh switch regions in CH12 cells (ChIP) and increases resection at deprotected
      telomeres in MEFs. Chromatin is an acceptable, if broad, location consistent with the damage-induced
      pool. It is accepted as stated, in line with the human review.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:29656893
      supporting_text: We propose that 53BP1-RIF1 act upstream to facilitate the recruitment of the
        shieldin complex, which we postulate shields DSBs against resection and thereby promotes NHEJ.
    - reference_id: PMID:30046110
      supporting_text: RPA-ssDNA complexes were un-detectable at donor (Sμ) and acceptor (Sα) loci in
        stimulated cultures of WT and SHLD3-complemented Shld3-/- CH12-F3, yet highly enriched in Rev7-/-,
        Shld2-/-, and Shld3-/- cells
- term:
    id: GO:0002208
    label: somatic diversification of immunoglobulins involved in immune response
  evidence_type: NAS
  original_reference_id: PMID:29656893
  qualifier: involved_in
  review:
    summary: Mouse Shld2 acts in immunoglobulin class-switch recombination specifically, which is experimentally
      established in mouse.
    reason: >-
      The process is right, but GO:0045190 isotype switching (an is_a descendant via somatic recombination
      of immunoglobulin genes) is the precise term. Its term note reserves it for gene products in the
      DNA recombination mechanism of switching, and shieldin end protection acts at the AID-induced
      switch-region breaks. Mouse evidence is direct. Shld2-/- CH12 cells are defective in IgM-to-IgA
      switching and are rescued by a mouse Shld2 transgene. Shld2-/- mice and primary B cells show
      impaired CSR to all isotypes tested, without loss of AID or germline transcription. The CSR defect
      arises because unprotected switch-region ends are over-resected, which deletes acceptor constant-region
      exons. Shld2 loss does not affect V(D)J recombination or somatic hypermutation-related development,
      so the broader parent is less informative.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0045190
      label: isotype switching
    supported_by:
    - reference_id: PMID:32558186
      supporting_text: All together, these data show a critical function of SHLD2 in CSR in mice, supporting
        previous findings in the CH12 B‐cell line (Noordermeer et al , 2018 ).
    - reference_id: PMID:32558186
      supporting_text: Nevertheless, we conclude that the shieldin complex promotes CSR by inhibiting
        excessive DNA end resection, and the presence of a significant Ig lo population during CSR may
        be a useful proxy indicator for increased DNA resection in the Igh locus.
    - reference_id: PMID:30046110
      supporting_text: CSR was restored in Shld3-/- and Shld2-/- cells by integration of Shld3 and Shld2
        transgenes, respectively
    - reference_id: PMID:32558186
      supporting_text: Hence, SHLD2 deficiency does not impact V(D)J recombination, consistent with what
        was observed in the Mb1 cre/+ Rev7 fl/fl mice (Ghezraoui et al , 2018 ).
