  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Gupta et al. 2018 Cell, the shieldin discovery paper. Its experiments were mainly in
      human cells. The cached text is partial (abstract, introduction, discussion), so any mouse B-cell CSR
      data cannot be inspected here. Used for the ComplexPortal NAS rows.
- id: PMID:32558186
  title: SHLD2 promotes class switch recombination by preventing inactivating deletions within the Igh locus.
  findings:
  - statement: Shld2-/- mice have defective CSR in vivo and ex vivo, normal lymphocyte development and
      V(D)J recombination, and Shld2 loss suppresses Brca1 Δ11 embryonic lethality.
    supporting_text: All together, these data show a critical function of SHLD2 in CSR in mice, supporting
      previous findings in the CH12 B‐cell line (Noordermeer et al , 2018 ).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ling et al. 2020 EMBO Rep. Full text cached. This is the primary in vivo mouse knockout study of
      Shld2.
- id: PMID:30046110
  title: 53BP1 cooperation with the REV7-shieldin complex underpins DNA structure-specific NHEJ.
  findings:
  - statement: In mouse CH12-F3 cells, REV7 co-purifies SHLD1-SHLD2. Shld2-/- cells have reduced CSR,
      rescued by a mouse Shld2 transgene, and increased RPA-ssDNA at switch regions.
    supporting_text: CSR was restored in Shld3-/- and Shld2-/- cells by integration of Shld3 and Shld2
      transgenes, respectively
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ghezraoui et al. 2018 Nature. Full text cached. All Shld2 work is in mouse CH12-F3 B cells,
      complemented with HA-SHLD2 (mouse).
- id: PMID:30022158
  title: 53BP1-RIF1-shieldin counteracts DSB resection through CST- and Polα-dependent fill-in.
  findings:
  - statement: Shld2 sgRNA in TPP1- or TRF2-deleted MEFs increases 5' resection at deprotected telomeres.
    supporting_text: Similarly, the 5′ end resection was increased by Rev7- or Shld2-deficiency
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mirman et al. 2018 Nature. Full text cached. The Shld2 experiments use mouse embryonic
      fibroblasts.
- id: PMID:30022119
  title: Shieldin complex promotes DNA end-joining and counters homologous recombination in BRCA1-null cells.
  findings:
  - statement: Fam35a loss in mouse CH12 cells reduces CSR, and Fam35a depletion in mouse TRF2ts cells
      reduces telomere fusions.
    supporting_text: loss of FAM35A or C20orf196 markedly reduced CSR
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Dev et al. 2018 Nat Cell Biol. Full text cached. The screen and the biochemistry are
      human, but the CSR and TRF2ts telomere-fusion experiments were done in mouse cells.
- id: PMID:35027730
  title: 53BP1-shieldin-dependent DSB processing in BRCA1-deficient cells requires CST-Polα-primase fill-in
    synthesis.
  findings:
  - statement: In BRCA1-deficient MEFs, Shld2 is required for Polα-dependent fill-in (BrdU-γH2AX PLA foci)
      at PARPi-induced DSBs.
    supporting_text: BrdU-γH2AX metaPLA foci did not form in cells lacking REV7 or SHLD2 or when Polα was
      inhibited
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mirman et al. 2022 Nat Cell Biol. Full text cached. Shld2-/- MEFs were generated by CRISPR.
- id: PMID:39227718
  title: Shieldin and CST co-orchestrate DNA polymerase-dependent tailed-end joining reactions independently
    of 53BP1-governed repair pathway choice.
  findings:
  - statement: Shld2-/- mice have CSR defects and normal lymphocyte development, but Shld2 loss does not
      rescue Brca1-null embryos. In mice, 53BP1 suppresses HR partly independently of shieldin.
    supporting_text: By contrast, no Brca1−/−Shld2−/− double-knockout pups were born to intercrosses between
      Brca1+/−Shld2−/− mice (Table 2).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: King et al. 2025 Nat Struct Mol Biol. Full text cached. This is a second independent
      Shld2 knockout mouse line (exons 4-5 deleted). It qualifies the HR-suppression role in mouse.
