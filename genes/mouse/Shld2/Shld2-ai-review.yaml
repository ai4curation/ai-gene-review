  review:
    summary: The family-level IBA is sound; the sign is negative, and mouse genetics support it with a caveat.
    reason: >-
      PTN001025652 carries the unsigned regulation term, seeded by human SHLD2. The PAINT curator placed
      this term, and not NHEJ, isotype switching or ssDNA binding, at the Eumetazoa node. The omission
      of the vertebrate-specific CSR term is a sensible choice. Mouse Shld2 rows for those terms rest
      on mouse experiments or direct ortholog transfer, not on this node. The sign is known: shieldin
      restrains resection and RAD51-dependent HR. In mice, Shld2 loss suppresses the embryonic lethality
      of Brca1 Δ11, which is consistent with restored HR. However, Shld2 loss does not rescue complete
      Brca1 loss, so mouse 53BP1 also suppresses HR through a shieldin-independent route. Shld2 is
      therefore one contributor to HR suppression, not the sole effector. MODIFY to the signed term
      GO:2000042, which the gene already carries (IEA, ISO).
