suggested_questions:
- question: Why does Shld2 loss rescue Brca1 Δ11 embryos (PMID:32558186) but not Brca1-null embryos (PMID:39227718),
    when 53BP1 loss rescues both? Which shieldin-independent 53BP1 effector suppresses HR in mouse?
- question: GO has no cellular-component term for the shieldin complex (ComplexPortal CPX-3483 for mouse). Should
    one be created so that Shld1, Shld2, Shld3 and Rev7 can carry part_of shieldin complex?
suggested_experiments:
- description: Purify the mouse Shld2 C-terminal OB-fold region (with and without Shld1) and measure ssDNA
    binding affinity and polarity by EMSA, including the human-equivalent OB-fold mutant.
  hypothesis: Mouse Shld2 binds ssDNA with affinity similar to human SHLD2C (~10 nM), so the
    ortholog-inferred molecular function holds.
  experiment_type: biochemistry
- description: Knock in an OB-fold ssDNA-binding mutant at the endogenous mouse Shld2 locus and test CSR, telomere
    resection and Brca1 Δ11 rescue.
  hypothesis: ssDNA binding by Shld2 is required for its end-protection functions in vivo.
  experiment_type: genetics
