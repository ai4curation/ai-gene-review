- term:
    id: GO:0043247
    label: telomere maintenance in response to DNA damage
  evidence_type: NAS
  original_reference_id: PMID:29656893
  qualifier: involved_in
  review:
    summary: Mouse Shld2 limits resection of, and promotes NHEJ at, deprotected telomeres; a specialised DSB-end
      context.
    reason: >-
      Mouse cell evidence is direct. In TPP1-deleted MEFs and in TRF2-deleted Lig4-/- MEFs, Shld2
      sgRNA increases 5' resection of deprotected telomeres. In mouse TRF2ts cells, Fam35a depletion
      reduces NHEJ-mediated telomere fusions. In both cases shieldin treats deprotected telomeres as
      DSB ends. This is a damage response at telomeres, not routine length maintenance, and the fusion
      readout is pathological. The term is kept as a non-core context of the end-protection function,
      consistent with the human review.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: PMID:30022158
      supporting_text: 'Like 53BP1, Shieldin limited hyper-resection at telomeres lacking TPP1: TPP1−/−
        cells lacking either Rev7 or Shld2 showed telomere hyper-resection'
    - reference_id: PMID:30022158
      supporting_text: Similarly, the 5′ end resection was increased by Rev7- or Shld2-deficiency
    - reference_id: PMID:30022119
