id: P14152
gene_symbol: Mdh1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mdh1 encodes the cytosolic NAD-dependent malate dehydrogenase that reversibly interconverts L-malate and oxaloacetate while reducing NAD+ to NADH. The enzyme acts in the cytosolic arm of the malate-aspartate shuttle and supplies cytosolic oxaloacetate, together with reducing equivalents, for the malate branch of gluconeogenesis. Mdh1 is a homodimeric LDH/MDH-family enzyme with documented secondary aromatic alpha-keto-acid reductase and 2-oxoglutarate reductase activities.
