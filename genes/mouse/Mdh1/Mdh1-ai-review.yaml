  review:
    summary: InterPro maps the NAD(P)-binding domain to the root catalytic-activity term. Mdh1 is specifically an NAD-dependent L-malate dehydrogenase, so this root molecular-function row is true but uninformative beside multiple GO:0030060 annotations.
    action: MARK_AS_OVER_ANNOTATED
