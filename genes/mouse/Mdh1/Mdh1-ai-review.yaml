core_functions:
- description: Cytosolic NAD-dependent L-malate dehydrogenase that reversibly interconverts malate and oxaloacetate. This reaction provides the cytosolic arm of the malate-aspartate shuttle and reoxidizes exported malate to oxaloacetate in the malate branch of gluconeogenesis.
  molecular_function:
