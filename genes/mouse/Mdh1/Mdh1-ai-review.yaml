- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: TAS
  original_reference_id: PMID:26315887
  qualifier: involved_in
  review:
    summary: Mdh1 catalyzes the cytosolic malate-to-oxaloacetate step in the malate branch of gluconeogenesis, regenerating the cytosolic oxaloacetate used by Pck1 and the NADH needed downstream by Gapdh. The TAS source is a review and the abstract does not name Mdh1, but the claim is supported by the Reactome source pathway and by established compartmental biochemistry.
    action: ACCEPT
    supported_by:
    - reference_id: Reactome:R-HSA-70263
      supporting_text: Mitochondrial oxaloacetate is reduced to malate, which is exported to the cytosol and re oxidized to oxaloacetate.
- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000600336
  - UniProtKB:P9WK13
  review:
    summary: The TCA-cycle PAINT inference is over-propagated from bacterial malate dehydrogenases to the animal cytosolic isozyme. Mouse Mdh2 catalyzes the mitochondrial matrix TCA-cycle step; Mdh1 is the cytosolic isozyme used in the malate-aspartate shuttle and in cytosolic oxaloacetate/malate metabolism.
    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:P9WK13
        source_label: mdh
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The Mycobacterium tuberculosis single malate dehydrogenase operates directly in the bacterial TCA cycle; the animal cytosolic isozyme has diverged from the mitochondrial TCA-cycle MDH2 paralog.
