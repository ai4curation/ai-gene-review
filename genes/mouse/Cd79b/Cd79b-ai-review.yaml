id: P15530
gene_symbol: Cd79b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Cd79b encodes Ig-beta, a single-pass membrane signaling subunit of the B-cell antigen receptor.
  It forms a disulfide-linked heterodimer with Ig-alpha and associates with membrane immunoglobulin, which
  recognizes antigen. The paired ITAM-containing cytoplasmic tails organize intracellular signaling and
  support B-cell maturation. Isolated Ig-beta domains can self-associate in biochemical preparations,
  whereas the physiological receptor signaling unit is the Ig-alpha/Ig-beta heterodimer.
