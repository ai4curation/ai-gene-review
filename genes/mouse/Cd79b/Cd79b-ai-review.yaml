- id: PMID:1373499
  title: The membrane IgM-associated proteins MB-1 and Ig-beta are sufficient to promote surface expression
    of a partially functional B-cell antigen receptor in a nonlymphoid cell line.
  findings:
  - statement: Coexpression in a nonlymphoid host supports assembly and surface expression of a partially
      functional membrane IgM/CD79 receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract inspected; the finding is restricted to the experiment explicitly reported
      there, without inventing inaccessible methods.
- id: PMID:20696394
  title: Structural and functional studies of Igalphabeta and its assembly with the B cell antigen receptor.
  findings:
  - statement: Murine and human Ig-beta ectodomain structures reveal a disulfide-linked homodimer; assembly
      studies also examine the physiological heterodimer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected for the stated finding.
- id: PMID:23012479
  title: Impact of lactobacilli on orally acquired listeriosis.
  findings:
  - statement: Bacterial interventions alter the host ileal response; target-specific Cd79b functional
      interpretation remains unresolved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full main text inspected; target-level supplementary expression table not recovered
      (publisher 403). Expression changes are not equated with mechanistic participation or absence of
      function.
- id: PMID:8626447
  title: Reconstitution of B cell antigen receptor-induced signaling events in a nonlymphoid cell line
    by expressing the Syk protein-tyrosine kinase.
  findings:
  - statement: Active Syk restores several BCR outputs in AtT20 reconstitution, but not inositol-phosphate
      production.
    supporting_text: 'Syk expression did not reconstitute anti-IgM-induced

      inositol phosphate production.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract inspected; the finding is restricted to the experiment explicitly reported
      there, without inventing inaccessible methods.
