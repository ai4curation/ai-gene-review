suggested_questions:
- question: >-
    Is Dll3-mediated cis-inhibition of Notch1 in the PSM physiologically significant, given that Geffers
    et al. (2007) found no evidence for DLL3 antagonism of DLL1 or repression of Notch activity in vivo,
    whereas Ladi et al. (2005) and Chapman et al. (2011) report cis-inhibition?
- question: >-
    Does GO need a cis-specific Notch-binding or "Notch receptor cis-inhibitor activity" term to distinguish
    non-activating ligands such as Dll3 from trans-activating DSL ligands?
suggested_experiments:
- description: >-
    Measure Notch1 processing and surface levels in Dll3-null versus wild-type PSM with an endogenous-tagged
    Notch1, to test whether Dll3 routes nascent Notch1 to lysosomes in vivo.
