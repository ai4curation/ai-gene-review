  title: >-
    The divergent DSL ligand Dll3 does not activate Notch signaling but cell autonomously attenuates signaling
    induced by other DSL ligands.
  findings:
  - statement: >-
      Dll3 does not bind or activate Notch in trans but cell-autonomously inhibits Notch signalling.
    supporting_text: >-
      Therefore, Dll3 functions not as an activator as previously reported but rather as a dedicated inhibitor
      of N signaling.
