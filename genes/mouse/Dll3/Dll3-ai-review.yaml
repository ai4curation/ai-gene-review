id: O88516
gene_symbol: Dll3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Dll3 (Delta-like 3) is a divergent, vertebrate-specific member of the DSL (Delta/Serrate/LAG-2) family
  of Notch ligands, a type I transmembrane protein with an N-terminal MNNL domain and six EGF-like repeats
  but a degenerate DSL domain. Unlike Dll1 and Dll4, Dll3 does not bind Notch receptors in trans and does
  not activate Notch signalling. Instead it acts cell autonomously as a Notch antagonist (cis-inhibition):
  endogenous Dll3 resides predominantly in the Golgi apparatus and late endocytic compartments, where
  it associates with newly synthesised Notch1 and is proposed to divert it to lysosomal degradation, attenuating
  Notch signalling induced by other DSL ligands. Dll3 is expressed in the paraxial/presomitic mesoderm
  and in differentiating neurons; in mouse, loss of Dll3 (pudgy and targeted alleles) disrupts the segmentation
  clock and somite boundary and rostro-caudal polarity formation, producing severe vertebral and rib malformations,
  and DLL3 mutations cause human spondylocostal dysostosis type 1.
