  - id: GO:0005794
    label: Golgi apparatus
  - id: GO:0005770
    label: late endosome
  supported_by:
  - reference_id: PMID:16144902
    supporting_text: >-
      Although Dll3 did not bind or activate N when presented in trans, it cell autonomously inhibited
      N signaling that was induced by other DSL ligands
  - reference_id: PMID:21147753
    supporting_text: >-
      Dll3 is not presented on the surface of presomitic mesoderm (PSM) cells in vivo, but instead interacts
      with Notch1 in the late endocytic compartment.
  - reference_id: PMID:17664336
    supporting_text: we find endogenous DLL3 predominantly in the Golgi apparatus.
