core_functions:
- molecular_function:
    id: GO:0005112
    label: Notch binding
  description: >-
    Dll3 is a non-activating, divergent DSL ligand that binds Notch receptors in cis (intracellularly,
    in Golgi/late endocytic compartments) rather than in trans, and thereby cell-autonomously inhibits
    Notch signalling induced by other DSL ligands, proposed to act by routing newly synthesised Notch1
    to lysosomal degradation (cis-inhibition).
  directly_involved_in:
  - id: GO:0045746
