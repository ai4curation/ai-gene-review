suggested_questions:
- question: >-
    Why does mouse Rtl8c localize to the cytoplasm while Rtl8a/8b are nuclear, and does its
    leucine-zipper motif confer a distinct function?
suggested_experiments:
- hypothesis: >-
    Mouse RTL8C acts via the conserved PEG10/UBQLN2 axis in the cytoplasm.
  description: >-
    Test PEG10/UBQLN2 handling and stress-granule localization in Rtl8c loss- and gain-of-function
    cells, and compare with the nuclear Rtl8a/8b.
