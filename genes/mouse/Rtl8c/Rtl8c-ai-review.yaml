core_functions:
- description: >-
    Cytoplasmic capsid-derived protein-macromolecule adaptor (by conservation with human RTL8)
    that links the retroelement capsid protein PEG10 to the proteasome shuttle factor UBQLN2,
    contributing to UBQLN2-mediated regulation and turnover of PEG10.
