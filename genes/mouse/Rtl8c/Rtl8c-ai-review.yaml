description: >-
  Rtl8c (retrotransposon Gag-like protein 8C; Cxx1 family) is one of a cluster of three
  near-identical X-linked mouse paralogs (Rtl8a/8b/8c) domesticated from a Ty3/gypsy
  sushi-ichi-related LTR retrotransposon. The 112-residue protein corresponds to a single
  truncated retroviral Gag capsid (CA)-like domain (about 70% identical to the identical
  Rtl8a/8b proteins) and carries a unique leucine-zipper motif; it lacks any catalytic domain.
  Unlike mRTL8A/8B, which localize to the nucleus, mRTL8C localizes to the cytoplasm. Murine
  RTL8 (the ortholog with highest homology to human RTL8C) participates in the UBQLN2
  proteostasis network, and by conservation with human RTL8 the protein acts as a capsid-derived
  adaptor linking the retroelement capsid protein PEG10 to the shuttle factor UBQLN2. The protein
  has no cysteine or histidine residues and so no nucleocapsid zinc knuckle. Rtl8a-c mRNAs are
  highest in cerebrum and cerebellum but broadly expressed, except that Rtl8c is absent from
  liver. An Rtl8c flox allele has been made, but no Rtl8c loss-of-function phenotype has yet been
  reported; in Rtl8a/8b double-knockout mice Rtl8c remains active.
