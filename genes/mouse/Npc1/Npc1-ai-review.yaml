description: 'Npc1 encodes NPC intracellular cholesterol transporter 1, a 1277-residue polytopic glycoprotein of
  the limiting membrane of late endosomes and lysosomes, with a signal peptide, 13 transmembrane helices, three
  large lumenal domains and a sterol-sensing domain, and it belongs to the patched family. It is the membrane half
  of a two-protein cholesterol export machine. Cholesterol liberated from endocytosed LDL in the acidic lysosomal
  lumen is bound by the small soluble protein NPC2, which docks on the second (middle) lumenal domain of NPC1 in
  a cholesterol-dependent, pH-dependent manner; the sterol is then handed off through a transfer tunnel into the
  cholesterol-binding pocket of the NPC1 N-terminal domain, held in the orientation set by the C-terminal lumenal
  domain, and delivered into the limiting membrane. From there NPC1 supplies cholesterol to the rest of the cell,
  including by tethering lysosome-endoplasmic reticulum membrane contact sites and passing sterol to GRAMD1B, so
  that lysosomal cholesterol reaches the metabolically active pool. The cholesterol-binding site is indispensable:
  knocking the binding-dead P202A/F203A substitutions into mouse Npc1 reproduces the phenotype of complete deficiency.
  A second activity of the same transport function restrains growth signalling, as NPC1 binds the lysosomal transmembrane
  protein SLC38A9 and prevents lysosomal cholesterol from activating mTORC1. NPC1 is also the intracellular receptor
  for the proteolytically primed Ebola virus glycoprotein, a requirement independent of its sterol transport activity.
  Loss of Npc1 in mouse sequesters unesterified cholesterol and glycosphingolipids in late endosomes and lysosomes,
  expands the whole-animal sterol pool, and causes hepatosplenomegaly, progressive Purkinje-cell loss, ataxia and
  death at around 2-3 months; export-promoting cyclodextrin prevents the neurodegeneration. Smaller pools of the
  protein are detected at the plasma membrane and in caveolin-1-containing rafts, and the protein transits the endoplasmic
  reticulum and Golgi as a heavily N-glycosylated biosynthetic intermediate.'
