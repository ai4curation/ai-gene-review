  review:
    summary: IMP to liver development from the quantitative LAL/NPC2/NPC1 lysosomal cholesterol-processing study
      in mice.
    action: MARK_AS_OVER_ANNOTATED
    reason: What this study measures in liver is lysosomal sterol processing and whole-animal sterol pool size in
      npc1-/- mice, not organ development. NPC1 loss produces hepatic cholesterol storage and secondary liver pathology,
      so a developmental reading is not flatly wrong, but the gene product performs no step of liver development;
      the informative terms are the cholesterol-transport and homeostasis terms it already carries. The full text
      is not in our cache, so the row is marked over-annotated rather than removed, and the term is flagged upstream
      for review.
