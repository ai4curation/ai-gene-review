suggested_questions:
- question: Should GO annotate a substrate of glycosylation to GO:0009101 glycoprotein biosynthetic process? The
    human NPC1 row (IDA, PMID:10821832) treats NPC1 own N-glycosylation, used as a topological reporter, as participation
    in the pathway, and it propagates to mouse by IEA and ISO.
  experts:
  - GO editorial office
  - UniProt curators
- question: Would a GO-CAM model of lysosomal cholesterol egress capture the NPC2-to-NPC1 hand-off better than the
    present pair of independent cholesterol transfer activity annotations - i.e. NPC2 cholesterol transfer activity
    with has input cholesterol providing input to NPC1 transfer activity at the lysosomal membrane?
  experts:
  - GO-CAM curators
- question: Is the is_active_in GO:0098574 cytoplasmic side of lysosomal membrane annotation intended to mark where
    cholesterol leaves NPC1, or is it a mis-selection? NPC1 cholesterol-receiving domains (NTD, MLD, CTD) are all
    lumenal.
  experts:
  - UniProt curators
  - NPC1 structural biologists
- question: Can the rat-sourced annotations propagated to mouse Npc1 (GO:0046686 response to cadmium ion, GO:1904036
    negative regulation of epithelial cell apoptotic process, both from RGD:628693) be traced to a reference? Neither
    row carries a PMID that we could recover.
  experts:
  - RGD curators
suggested_experiments:
- hypothesis: Cholesterol leaving NPC1 enters the cytosolic leaflet of the lysosomal limiting membrane before being
    picked up by cytosolic-facing acceptors such as GRAMD1B.
  description: Reconstitute purified full-length mouse NPC1 into asymmetric liposomes with leaflet-specific sterol
    sensors (e.g. a lumenal and a cytosolic-side fluorescent sterol-binding probe) and follow NPC2-dependent cholesterol
    arrival in each leaflet, with the binding-dead P202A/F203A protein as the negative control. This would settle
    which face the transfer terminates on, and hence whether a side-of-membrane cellular-component term is warranted.
  experiment_type: in vitro reconstitution
- hypothesis: The elevated macroautophagy of Npc1-null cells is a consequence of lysosomal cholesterol storage rather
    than of losing an NPC1 activity that restrains autophagy.
  description: Compare autophagic flux in Npc1-/- mouse embryonic fibroblasts, in Npc1 P202A/F203A knock-in cells
    (protein present, transport dead) and in wild-type cells acutely loaded with cholesterol by U18666A, before
    and after cyclodextrin-mediated cholesterol removal. If flux tracks cholesterol load rather than NPC1 presence,
    GO:0016242 should remain non-core and the regulatory reading is a phenotype.
  experiment_type: cell biology / genetic epistasis
- hypothesis: Mouse NPC1 contributes to clearance of lysosomotropic xenobiotics (e.g. chloroquine) in vivo, not
    only in cultured hepatoma cells.
  description: Measure chloroquine pharmacokinetics and lysosomal accumulation in liver and brain of Npc1+/- and
    Npc1 P202A/F203A knock-in mice versus wild type, to test whether the knockdown phenotype reported in rat hepatoma
    cells reflects a transport-dependent role of NPC1.
  experiment_type: in vivo pharmacology
