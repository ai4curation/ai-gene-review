  review:
    summary: IDA to extracellular region from the NPC1 lumenal-domain-2/NPC2 binding study.
    action: REMOVE
    reason: The extracellular signal is a property of the experimental construct, not of NPC1. The authors built
      a soluble domain-2 fragment by replacing transmembrane domains 2 and 3 with an antiparallel coiled coil and
