  review:
    summary: Ensembl Compara transfer of human is_active_in cytoplasmic side of lysosomal membrane.
    action: MODIFY
    reason: Over-specific and on the wrong face of the membrane. NPC1 is a 13-transmembrane protein whose cholesterol-receiving
      machinery - the N-terminal domain, the middle lumenal domain that binds NPC2, and the C-terminal lumenal domain
      that orients the NTD - is lumenal, and the sterol-sensing domain sits within the bilayer. The claim that the
