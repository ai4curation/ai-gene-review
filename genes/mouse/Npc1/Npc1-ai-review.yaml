core_functions:
- description: Accepts LDL-derived cholesterol from NPC2 at the lumenal face of the late endosomal/lysosomal limiting
    membrane and transfers it into the membrane for export to the rest of the cell, including to the endoplasmic
    reticulum at lysosome-ER contact sites; the same transport activity, exerted in complex with SLC38A9, keeps
    lysosomal cholesterol from activating mTORC1.
