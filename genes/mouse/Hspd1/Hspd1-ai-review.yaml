- term:
    id: GO:0002755
    label: MyD88-dependent toll-like receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P10809
  - ensembl:ENSP00000373620
  review:
    summary: MyD88-dependent toll-like receptor signaling pathway.
    action: REMOVE
    reason: Mouse knockout experiments show that the LPS-free Hsp60 effect is independent of TLR4 and
      MyD88 (PMID:18256040). The TLR4-dependent effects of Hsp60/LPS complexes are attributable to the
      bound LPS. In addition, an extracellular ligand carrier is not a component of the intracellular
      signalling pathway. The mouse data contradict the projected claim.
    supported_by:
    - reference_id: PMID:18256040
      supporting_text: T cell co-stimulation induced by LPS-free Hsp60 was independent of TLR4 and the
        TLR-associated myeloide differentiation factor 88-signaling pathway
