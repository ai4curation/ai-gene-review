- term:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P10809
  - ensembl:ENSP00000373620
  - InterPro:IPR001844
  review:
    summary: ATP-dependent folding chaperone activity of the mitochondrial Hsp60-Hsp10 chaperonin.
    action: ACCEPT
    reason: This is the core molecular function of Hsp60. Mouse Hspd1 is a one-to-one ortholog of human
      HSPD1 in the mitochondrial Hsp60 PAINT clade (PTN000143509, PANTHER PTHR45633). The ATP-dependent
      refolding activity has been measured biochemically on recombinant mammalian mitochondrial Cpn60
      with Cpn10 (PMID:1346131, PMID:11422376), not on the mouse protein specifically. In mouse, in vivo
      evidence shows that the protein is needed for matrix proteins to fold. Cardiomyocyte deletion leaves
      import intact, but imported HSP60-dependent proteins misfold and are degraded (PMID:31209364). MnSOD
      requires Hsp60 to fold (PMID:24151936). The activity is therefore inferred for the mouse protein
      by orthology and supported by mouse genetics.
    supported_by:
    - reference_id: file:mouse/Hspd1/Hspd1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Together with Hsp10, facilitates the correct folding of imported proteins.
    - reference_id: PMID:1346131
      supporting_text: facilitates the formation of catalytically active ribulose-bisphosphate carboxylase
        from an unfolded state in the presence of K+ and MgATP
    - reference_id: PMID:11422376
      supporting_text: does not inhibit malate dehydrogenase refolding or ATP hydrolysis by mt-cpn60 in
        the presence of mt-cpn10
    - reference_id: PMID:31209364
      supporting_text: revealed a list of mitochondrial-localized proteins that rely on HSP60 (HSP60-dependent)
        for correctly folding in mitochondria
    - reference_id: PMID:24151936
      supporting_text: we propose that MnSOD is a substrate of the Hsp60 folding machinery
