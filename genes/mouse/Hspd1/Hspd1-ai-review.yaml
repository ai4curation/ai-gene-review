- id: file:mouse/Hspd1/Hspd1-uniprot.txt
  title: UniProtKB P63038 record for mouse Hspd1
  findings: []
core_functions:
- description: ATP-dependent folding of newly imported and stress-denatured mitochondrial matrix proteins
    by the Hsp60-Hsp10 chaperonin. The biochemical activity is inferred from mammalian orthologs. That
    mouse matrix proteins need Hsp60 to fold is shown by mouse genetics.
  molecular_function:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  - id: GO:0042026
    label: protein refolding
  locations:
  - *id006
  supported_by:
  - reference_id: file:mouse/Hspd1/Hspd1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Together with Hsp10, facilitates the correct folding of imported proteins.
  - reference_id: PMID:1346131
    supporting_text: facilitates the formation of catalytically active ribulose-bisphosphate carboxylase
      from an unfolded state in the presence of K+ and MgATP
  - reference_id: PMID:11422376
    supporting_text: does not inhibit malate dehydrogenase refolding or ATP hydrolysis by mt-cpn60 in
      the presence of mt-cpn10
  - reference_id: PMID:31209364
    supporting_text: revealed a list of mitochondrial-localized proteins that rely on HSP60 (HSP60-dependent)
      for correctly folding in mitochondria
  - reference_id: PMID:31209364
    supporting_text: protein import was comparable between control and HSP60CKO mitochondria while protein
      was degraded more rapidly in HSP60CKO mitochondria
  - reference_id: PMID:24151936
    supporting_text: we propose that MnSOD is a substrate of the Hsp60 folding machinery
  - reference_id: PMID:23466696
    supporting_text: a defect in the assembly of the respiratory chain complex III in neuronal tissues
  - reference_id: PMID:20393889
    supporting_text: Homozygous Hspd1 mutant embryos, however, died shortly after implantation
- description: Specific binding of the Hsp10 (Hspe1) co-chaperonin, which caps the Hsp60 ring and is required
    for the folding cycle (inferred from the human ortholog and the mitochondrial Hsp60 PAINT clade).
  molecular_function:
    id: GO:0051087
    label: protein-folding chaperone binding
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  locations:
  - *id006
  supported_by:
  - reference_id: PMID:11050098
    supporting_text: its human homologue, Hsp60 functions specifically with its co-chaperonin partner,
      Hsp10
  - reference_id: PMID:32317635
    supporting_text: mHsp60-mHsp10 assists the folding of mitochondrial matrix proteins
  - reference_id: PMID:20393889
    supporting_text: Together with its co-chaperonin Hsp10, Hsp60 forms a large multisubunit complex that
      is one of the most important factors in the facilitation of the proper folding and assembly of proteins
      in the mitochondrial matrix.
suggested_questions:
- question: Which mouse matrix proteins are obligate Hsp60 clients, as opposed to proteins that are destabilised
    secondarily when respiration fails? The cardiomyocyte proteome (PMID:31209364) lists Hsp60-dependent
    proteins, but trapping or crosslinking experiments would be needed to separate direct clients from
    downstream losses.
- question: Does endogenous extracellular Hsp60 reach concentrations in vivo at which the IFN-alpha-dependent
    T-cell costimulation seen with added protein (PMID:17164250, 18256040) occurs, and by what route is
    it released?
- question: Should PAINT node PTN002900230 keep 'positive regulation of interleukin-6 production', given
    that mouse experiments with LPS-free Hsp60 found no IL-6 induction (PMID:18256040)?
- question: Does mammalian Hsp60 take part in sorting of intermembrane-space proteins, as the yeast-seeded
    IBA for GO:0045041 implies? No mammalian experiment has tested this.
suggested_experiments:
- hypothesis: Mouse Hsp60 is an ATP-dependent folding chaperone with the same single/double-ring behaviour
    as the human protein.
  description: Purify recombinant mouse Hsp60 and Hspe1 and measure ATPase activity, ring state and refolding
    of denatured malate dehydrogenase and MnSOD, alongside human HSPD1 as a reference.
  experiment_type: biochemistry
- hypothesis: A defined set of mouse matrix proteins depends directly on Hsp60 for folding in vivo.
  description: In inducible cardiomyocyte Hspd1 knockouts, combine pulse-chase import of tagged candidate
    clients with crosslinking or substrate-trap Hsp60 variants to identify proteins captured inside the
    chaperonin before degradation.
  experiment_type: cell biology
