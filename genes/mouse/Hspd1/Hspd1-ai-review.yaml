- term:
    id: GO:0032727
    label: positive regulation of interferon-alpha production
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:96242
  - PANTHER:PTN002900230
  - UniProtKB:P10809
  review:
    summary: Positive regulation of interferon-alpha production by exogenous Hsp60 acting on APC.
    action: KEEP_AS_NON_CORE
    reason: Mouse experiments show LPS-free Hsp60 induces IFN-alpha in professional APC (PMID:17164250,
      PMID:18256040). Mouse Hspd1 is a seed of the Euteleostomi PAINT node PTN002900230. This is the best-controlled
      immune effect of the protein, but it is a property of exogenously added Hsp60 in culture. The physiological
      role of endogenous extracellular Hsp60 is not established, so it is non-core.
