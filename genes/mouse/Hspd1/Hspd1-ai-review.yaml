      supporting_text: T cell co-stimulation induced by LPS-free Hsp60 was independent of TLR4 and the
        TLR-associated myeloide differentiation factor 88-signaling pathway
    - reference_id: PMID:17164250
      supporting_text: Hsp60 exclusively binds to macrophages and DC but not to T or B lymphocytes
- term:
    id: GO:0050870
    label: positive regulation of T cell activation
  evidence_type: IDA
  original_reference_id: PMID:17164250
  qualifier: involved_in
  review:
    summary: Positive regulation of T cell activation (costimulation via APC).
    action: KEEP_AS_NON_CORE
    reason: Exogenous or cell-surface Hsp60 enhances antigen-specific T-cell activation in mouse cultures
      independently of endotoxin (PMID:15371451, PMID:17164250, PMID:18256040). It does so through APC,
      so 'positive regulation' is the right relation. It is not a core function of the mitochondrial chaperonin.
    supported_by:
    - reference_id: PMID:15371451
      supporting_text: Hsp60 that is expressed on the surface of different eukaryotic cell lines increases
        the activation of T cells in primary stimulation
    - reference_id: PMID:18256040
      supporting_text: T cell co-stimulation induced by LPS-free Hsp60 was independent of TLR4 and the
        TLR-associated myeloide differentiation factor 88-signaling pathway
    - reference_id: PMID:17164250
      supporting_text: Hsp60 exclusively binds to macrophages and DC but not to T or B lymphocytes
