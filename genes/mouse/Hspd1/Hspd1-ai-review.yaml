  - ensembl:ENSP00000373620
  - UniProtKB:P63039
  - ensembl:ENSRNOP00000063666
  review:
    summary: Negative regulation of apoptotic process.
    action: KEEP_AS_NON_CORE
    reason: Human tumour-cell knockdown and rat IMP data support an anti-apoptotic role. In mouse, Hsp60
      deletion increases apoptosis of yolk-sac erythrocytes (PMID:31601784). The effect is downstream
      of mitochondrial folding, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:31601784
      supporting_text: we demonstrated an essential role of HSP60 in regulating yolk sac cell survival
        partially via a mPTP-dependent mechanism
