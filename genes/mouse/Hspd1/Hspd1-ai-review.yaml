- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000143677
  - SGD:S000004249
  - UniProtKB:P0A6F5
  - UniProtKB:P10809
  - UniProtKB:P9WPE7
  - UniProtKB:P9WPE9
  review:
    summary: Protein folding in the mitochondrial matrix, the core process of the Hsp60 chaperonin.
    action: ACCEPT
    reason: The IBA is placed at the family root node PTN000143677 (GroEL, Cpn60s, yeast HSP60, human
      HSPD1), and it is backed by mouse-specific genetic evidence. Adult cardiomyocyte deletion reveals
      mitochondrial proteins that rely on HSP60 for correct folding. Their import is unaffected but their
      stability after import is reduced (PMID:31209364). Hspd1+/- tissue shows impaired MnSOD folding
      (PMID:24151936) and defective complex III assembly (PMID:23466696). The null allele is early-embryonic
      lethal (PMID:20393889).
    supported_by:
    - reference_id: PMID:31209364
      supporting_text: revealed a list of mitochondrial-localized proteins that rely on HSP60 (HSP60-dependent)
        for correctly folding in mitochondria
    - reference_id: PMID:31209364
      supporting_text: protein import was comparable between control and HSP60CKO mitochondria while protein
        was degraded more rapidly in HSP60CKO mitochondria
    - reference_id: PMID:24151936
      supporting_text: we propose that MnSOD is a substrate of the Hsp60 folding machinery
    - reference_id: PMID:23466696
      supporting_text: a defect in the assembly of the respiratory chain complex III in neuronal tissues
    - reference_id: PMID:20393889
      supporting_text: Our results demonstrate that Hspd1 is an essential gene for early embryonic development
        in mice
