    label: lipopolysaccharide binding
  evidence_type: IDA
  original_reference_id: PMID:17164250
  qualifier: enables
  review:
    summary: Lipopolysaccharide binding by extracellular Hsp60 (mouse IDA).
    action: KEEP_AS_NON_CORE
    reason: 'Mouse experiment: Hsp60 specifically binds bacterial LPS and colocalises with CD14 on APC,
      and the synergy with LPS depends on this binding (PMID:17164250). This is a real property of the
      exogenous protein, but it is peripheral to the mitochondrial chaperonin role.'
