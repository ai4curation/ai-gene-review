- term:
    id: GO:0045041
    label: protein import into mitochondrial intermembrane space
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000143510
  - SGD:S000004249
  review:
    summary: Protein import into mitochondrial intermembrane space (IBA seeded only by yeast HSP60).
    action: UNDECIDED
    reason: PAINT placed this at PTN000143510 using only yeast HSP60, where matrix Hsp60 was proposed
      to hold imported cytochrome b2 before re-export to the IMS. That route was disputed even in yeast.
      Mouse is inside the clade, so the transfer is not phylogenetically wrong. But no mammalian experiment
      addresses IMS sorting, and import of matrix proteins into Hsp60-deleted mouse heart mitochondria
      is normal (PMID:31209364). The mouse data neither confirm nor refute the IMS claim.
    supported_by:
    - reference_id: PMID:31209364
      supporting_text: suggesting that mitochondrial protein import was not affected by deletion of HSP60
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000143510
        source_status: UNRESOLVED
        comment: Node seeded only by yeast HSP60; IMS sorting role disputed in yeast and untested in mammals.
