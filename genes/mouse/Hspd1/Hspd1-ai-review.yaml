- term:
    id: GO:0051087
    label: protein-folding chaperone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000143509
  - SGD:S000004249
  - UniProtKB:P10809
  review:
    summary: Binding of the co-chaperonin Hsp10 (Hspe1), which caps the Hsp60 ring during the folding
      cycle.
    action: ACCEPT
    reason: The IBA at the mitochondrial Hsp60 node PTN000143509 is seeded by yeast HSP60 and human HSPD1.
      Human Hsp60 works specifically with Hsp10 and not with GroES (PMID:11050098), and the structures
      show the Hsp60-Hsp10 football complex (PMID:32317635). In mouse, the Hspe1 gene is co-regulated
      with Hspd1 in Hspd1 gene-trap mice (PMID:20393889). The binding itself has not been measured biochemically
      with mouse protein.
    supported_by:
    - reference_id: PMID:11050098
      supporting_text: its human homologue, Hsp60 functions specifically with its co-chaperonin partner,
        Hsp10
    - reference_id: PMID:32317635
      supporting_text: mHsp60-mHsp10 assists the folding of mitochondrial matrix proteins
    - reference_id: PMID:20393889
      supporting_text: Together with its co-chaperonin Hsp10, Hsp60 forms a large multisubunit complex
        that is one of the most important factors in the facilitation of the proper folding and assembly
        of proteins in the mitochondrial matrix.
