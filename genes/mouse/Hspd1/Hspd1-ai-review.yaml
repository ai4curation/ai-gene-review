- term:
    id: GO:0051384
    label: response to glucocorticoid
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P63039
  - ensembl:ENSRNOP00000063666
  review:
    summary: Response to glucocorticoid (rat IEP, projected by Ensembl Compara).
    action: MARK_AS_OVER_ANNOTATED
    reason: The rat source annotation is an expression-change (IEP) observation for a stress-inducible
      chaperone. Projected to mouse, it says nothing about what Hspd1 does, and no mouse study shows the
      protein takes part in this response.
- term:
    id: GO:0051702
    label: biological process involved in interaction with symbiont
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P10809
  - ensembl:ENSP00000373620
  review:
    summary: Biological process involved in interaction with symbiont (human Listeria adhesion data, projected).
    action: KEEP_AS_NON_CORE
    reason: Host Hsp60 acts as a receptor for Listeria LAP in human intestinal cells. It is not tested
      in mouse. Mouse Hsp60 does not mediate the M. tuberculosis Cpn60.2 interaction (PMID:20633027),
      so the role is pathogen-specific. It is kept as non-core.
    supported_by:
    - reference_id: PMID:20633027
      supporting_text: shared by the Escherichia coli homologue, GroEL, but not by the mouse and human
        Hsp60 homologues
