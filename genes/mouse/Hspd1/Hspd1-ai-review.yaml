id: P63038
gene_symbol: Hspd1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Hspd1 encodes Hsp60, the mitochondrial type I (GroEL-family) chaperonin of the mouse. The
  573-residue precursor carries a 26-residue matrix-targeting presequence that is removed on import. In
  the matrix, heptameric Hsp60 rings associate with rings of the co-chaperonin Hsp10 (Hspe1). In an ATP-driven
  cycle they enclose newly imported or stress-denatured polypeptides and release them folded. In mice
  the gene is essential: null embryos die shortly after implantation. Tissue-specific deletion in adult
  cardiomyocytes leaves matrix protein import intact but causes misfolding and accelerated degradation
  of Hsp60-dependent matrix proteins, followed by respiratory-chain defects, ROS and heart failure. Halving
  Hsp60 levels impairs folding of MnSOD and assembly of respiratory complex III in neurons and causes
  a late-onset motor deficit, which models human SPG13 hereditary spastic paraplegia. Loss in intestinal
  epithelium activates the mitochondrial unfolded protein response. Small pools of Hsp60 occur at the
  cell surface (including the head of capacitated sperm) and outside cells. Exogenously added Hsp60 binds
  macrophages and dendritic cells and binds LPS. It enhances antigen-specific T-cell IFN-gamma responses
  through APC-derived IFN-alpha, independently of TLR4 and MyD88, whereas its apparent induction of IL-6,
  IL-12 and TNF is attributable to bound endotoxin.'
