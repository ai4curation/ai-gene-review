- term:
    id: GO:1903427
    label: negative regulation of reactive oxygen species biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P63039
  - ensembl:ENSRNOP00000063666
  review:
    summary: Negative regulation of reactive oxygen species biosynthetic process (rat IMP, projected).
    action: MARK_AS_OVER_ANNOTATED
    reason: Mouse data explain the ROS increase in Hsp60-deficient tissue as impaired folding of MnSOD
      and respiratory-chain defects (PMID:24151936, PMID:31209364). Hsp60 is not a regulator of ROS biosynthesis.
      The ROS change is a downstream consequence of the folding defect.
    supported_by:
    - reference_id: PMID:24151936
      supporting_text: the increase of ROS is, at least in part, due to impaired folding of the manganese
        superoxide dismutase (MnSOD)
    - reference_id: PMID:31209364
      supporting_text: HSP60 deletion in adult mouse hearts altered mitochondrial complex activity, mitochondrial
        membrane potential, and ROS production
