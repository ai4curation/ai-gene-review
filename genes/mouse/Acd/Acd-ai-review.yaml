- term:
    id: GO:0070203
    label: regulation of establishment of protein localization to telomere
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q96AP0
  - ensembl:ENSP00000478084
  review:
    summary: Regulatory participation is unresolved; regulation of TPP1 localization does not itself establish TPP1 as the regulator.
    action: UNDECIDED
    reason: PMID:25172512 tests how ubiquitination affects human TPP1 localization and interactions. PMID:22101936 studies RNF8/TPP1 regulation in mouse cells; its decisive Lys233/POT1 localization comparison uses human TPP1 constructs with mouse POT1a in mouse embryonic fibroblasts. These are not a clean comparison of human versus mouse TPP1 proteins. The studies do not settle whether Acd performs the regulatory process described by GO:0070203, rather than being its regulated substrate or directly recruiting a partner. Neither the negative human ubiquitination result nor the human long-form telomerase mechanism establishes absence of this regulatory role. Retain UNDECIDED for the source-to-target regulatory-role assignment.
    supported_by:
    - reference_id: PMID:25172512
      supporting_text: Mutational analysis indicated that human TPP1 does not require ubiquitination for telomere association in contrast to previous observations reported for mouse Tpp1.
    - reference_id: PMID:25172512
      supporting_text: In striking contrast to mouse Tpp1, TPP1 ubiquitination is not required for telomere localization in human cells.
    - reference_id: PMID:22101936
      supporting_text: Our results demonstrate that TPP1 is a substrate for RNF8
    - reference_id: PMID:22101936
      supporting_text: we co-transfected Myc-mPOT1a with either FLAG-hTPP1WT or FLAG-tagged hTPP1 mutants into wild-type MEFs.
