suggested_questions:
- question: Why does p53 deletion rescue epidermal and skeletal defects in Acd-deficient mice while failing to rescue Acd-null hematopoietic stem cells (PMID:24316971)?
  experts:
  - Ivan Maillard
  - Catherine E Keegan
  - Jayakrishnan Nandakumar
- question: Which construct, cellular-context and assay differences explain the RNF8-dependent TPP1 retention results in PMID:22101936 versus ubiquitination-independent localization in PMID:25172512? The former includes human TPP1 Lys233 mutants with mouse POT1a in mouse MEFs, so this is not simply a difference between mouse and human TPP1 proteins.
  experts:
  - Sandy Chang
  - Joachim Lingner
suggested_experiments:
- hypothesis: Acute mitotic catastrophe caused by deprotected Pot1a/Pot1b-free telomeric overhangs, rather than gradual telomerase-deficiency shortening, kills Acd-null mouse HSCs independently of Trp53.
  description: Compare hematopoietic stem cell survival and competitive repopulation in knock-in mice carrying the TEL-patch separation-of-function Acd K82del allele (analogous to human K84del/delta-K170) versus complete conditional Acd deletion on wild-type and Trp53-null backgrounds.
  experiment_type: In vivo knock-in separation-of-function HSC competitive transplantation assay
