  evidence_type: IMP
  original_reference_id: PMID:15537664
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:1856658
  review:
    summary: Mark pleiotropic acd mutant developmental phenotype (skeletal system development) as over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: In hypomorphic acd mice, p53-dependent apoptosis contributes to skeletal and limb abnormalities, and p53 deficiency rescues vertebral and limb defects. These experiments support a downstream developmental consequence of impaired telomere protection rather than a specific skeletal or limb-patterning activity of Acd. Retain MARK_AS_OVER_ANNOTATED for this phenotype-based annotation; do not extend the rescue conclusion to urogenital defects or all consequences of Acd deficiency.
    additional_reference_ids:
    - PMID:19660449
    - PMID:22038471
    supported_by:
    - reference_id: PMID:19660449
      supporting_text: Mutant acd embryos have caudal truncation, vertebral segmentation defects, hydronephrosis, and limb hypoplasia, resembling humans with Caudal Regression syndrome.
    - reference_id: PMID:22038471
      supporting_text: We previously showed that apoptosis is the primary mechanism causing the acd skeletal phenotype, and that p53 deficiency rescues the skeletal defects of the acd phenotype
    - reference_id: PMID:19660449
      supporting_text: skeletal anomalies and cellular apoptosis observed in acd mutant embryos are rescued by p53 deficiency
