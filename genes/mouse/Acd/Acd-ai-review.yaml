- term:
    id: GO:0010521
    label: telomerase inhibitor activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96AP0
  review:
    summary: Reject the transferred inhibitor molecular function on source-evidence and target-sequence grounds.
    action: REMOVE
    reason: The human PMID:25172512 source does not establish a conserved inhibitor molecular function. PMID:31216472 instead identifies an arginine-rich N-terminal extension of human TPP1-L as important for inhibition of telomerase function in cells; substituting three arginines partly relieves that phenotype. The retained mouse products documented in the native UniProtKB:Q5EE38 record lack this human long-form extension and begin within the architecture corresponding to TPP1-S. Remove this specific ISO/IEA transfer on those source and sequence grounds. This does not assert that Acd can never restrain telomerase through shelterin, that every possible target transcript has been surveyed, or that a purified-enzyme assay is required by GO:0010521. The mouse-only discussion statement in PMID:31216472 is not evidence about rat.
    supported_by:
    - reference_id: PMID:20231318
      supporting_text: POT1-TPP1 binding to telomeric DNA activates telomerase repeat addition processivity.
    - reference_id: PMID:31216472
      supporting_text: the arginine-rich region unique to TPP1-L is important for its inhibition of telomerase function
    - reference_id: file:genes/mouse/Acd/Acd-uniprot.txt
      supporting_text: MSDSGLLALQ PWIRELILGS
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      source_entities:
      - source_id: UniProtKB:Q96AP0
        source_label: human ACD
        source_status: UNRESOLVED
        comment: The native human inhibitor assignment remains unresolved. The later human TPP1-L cellular mechanism is extension-dependent and does not support this target, whose retained sequence lacks that extension. Reject the transfer without claiming gene-wide absence of all inhibitory effects.
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
    additional_reference_ids:
    - PMID:25172512
    - PMID:31216472
    - file:genes/mouse/Acd/Acd-uniprot.txt
