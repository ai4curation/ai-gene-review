- id: PMID:19660449
  findings:
  - statement: The acd mutant embryos exhibit caudal truncation, vertebral segmentation defects, hydronephrosis and limb hypoplasia.
    supporting_text: Mutant acd embryos have caudal truncation, vertebral segmentation defects, hydronephrosis, and limb hypoplasia, resembling humans with Caudal Regression syndrome.
  - statement: p53 deficiency rescued skeletal abnormalities and cellular apoptosis in acd embryos, but did not rescue perinatal lethality. These experiments do not establish the mechanism of the urogenital phenotype.
    supporting_text: We also demonstrate that the skeletal anomalies and cellular apoptosis observed in acd mutant embryos are rescued by p53 deficiency, although the perinatal lethality of the acd mutation is not rescued.
  title: Caudal regression in adrenocortical dysplasia (acd) mice is caused by telomere dysfunction with subsequent p53-dependent apoptosis.
- id: PMID:22038471
  findings:
  - statement: The paper summarizes prior work showing p53-dependent rescue of the acd skeletal defects.
    supporting_text: We previously showed that apoptosis is the primary mechanism causing the acd skeletal phenotype, and that p53 deficiency rescues the skeletal defects of the acd phenotype
  - statement: TAp63 deficiency did not rescue the acd skeletal phenotype and instead worsened the skeletal abnormalities in double-mutant embryos.
    supporting_text: Our results do not support this hypothesis, and, in fact, our data demonstrated overall worsening of the skeletal phenotype in acd/acd; TAp63−/− embryos.
  title: Additive effect of TAp63 deficiency on the adrenocortical dysplasia (acd) phenotype.
- id: PMID:22101936
  findings:
  - statement: RNF8-dependent TPP1 stability and telomeric retention support telomere protection in mouse-cell experiments, including assays with human TPP1 constructs.
    supporting_text: Rnf8 physically interacts with Tpp1 to generate Ubc13-dependent Lys63 polyubiquitin chains that stabilize Tpp1 at telomeres.
  title: The E3 ubiquitin ligase Rnf8 stabilizes Tpp1 to promote telomere end protection.
