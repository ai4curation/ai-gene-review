- id: PMID:19660449
  findings:
  - statement: Caudal truncation, limb hypoplasia, and vertebral defects in acd mutant embryos are driven by p53-dependent apoptosis secondary to telomere dysfunction and are rescued on a Trp53-null background.
    supporting_text: Mutant acd embryos have caudal truncation, vertebral segmentation defects, hydronephrosis, and limb hypoplasia, resembling humans with Caudal Regression syndrome.
  title: Caudal regression in adrenocortical dysplasia (acd) mice is caused by telomere dysfunction with subsequent p53-dependent apoptosis.
- id: PMID:22038471
  findings:
  - statement: TAp63 loss does not rescue acd developmental phenotypes, confirming specificity of p53-mediated apoptosis downstream of telomere uncapping.
    supporting_text: We previously showed that apoptosis is the primary mechanism causing the acd skeletal phenotype, and that p53 deficiency rescues the skeletal defects of the acd phenotype
  title: Additive effect of TAp63 deficiency on the adrenocortical dysplasia (acd) phenotype.
- id: PMID:22101936
  findings:
  - statement: Rnf8-mediated Lys63 polyubiquitination stabilizes mouse Tpp1 at telomeres to prevent alternative NHEJ fusions.
    supporting_text: Rnf8 physically interacts with Tpp1 to generate Ubc13-dependent Lys63 polyubiquitin chains that stabilize Tpp1 at telomeres.
  title: The E3 ubiquitin ligase Rnf8 stabilizes Tpp1 to promote telomere end protection.
- id: PMID:24316971
  findings:
  - statement: Conditional Acd deletion acutely depletes mouse hematopoietic stem cells in a cell-autonomous manner not rescued by p53 loss.
    supporting_text: We found that mouse hematopoietic stem cells (HSCs) are acutely sensitive to inactivation of the shelterin gene Acd, encoding TPP1.
  title: Hematopoietic stem cells are acutely sensitive to Acd shelterin gene inactivation.
