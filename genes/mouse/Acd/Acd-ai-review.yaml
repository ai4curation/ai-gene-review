  - ZFIN:ZDB-GENE-081022-45
  review:
    summary: Remove telomeric repeat DNA binding; nuclear-extract pull-down in PMID:23685356 reflects indirect shelterin association.
    action: REMOVE
    reason: PMID:23685356 captured telomere-associated proteins using polymerized TTAGGG DNA and nuclear extracts, including extracts from mouse embryonic stem cells. Recovery of shelterin in this assay establishes association with telomeric DNA but does not isolate autonomous Acd DNA-binding activity. Purified human TPP1 experiments and human structural evidence instead support a protein-adaptor role without direct DNA contact. Together, these findings support removal of the direct DNA-binding assignment.
    additional_reference_ids:
    - PMID:18185984
    - PMID:31216472
    - PMID:35201900
    supported_by:
    - reference_id: PMID:18185984
      supporting_text: Human TPP1 was identified as a protein which interacts with components of a telomere cap complex, but does not directly bind to telomeric DNA.
    - reference_id: PMID:31216472
      supporting_text: Although neither protein bound DNA directly, both TPP1-L and TPP1-S further stabilized the POT1-DNA complex in vitro
    - reference_id: PMID:35201900
      supporting_text: Unlike its ciliate TEBPβ homolog (28), TPP1 does not contact the DNA
    - reference_id: PMID:23685356
      supporting_text: we repeated our telomere-binding assay with SILAC-labelled nuclear extracts derived from mouse embryonic stem cells (ES cells).
