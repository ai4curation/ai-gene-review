suggested_experiments:
- hypothesis: Acute mitotic catastrophe caused by deprotected Pot1a/Pot1b-free telomeric overhangs, rather than gradual telomerase-deficiency shortening, kills Acd-null mouse HSCs independently of Trp53.
  description: Compare hematopoietic stem cell survival and competitive repopulation in knock-in mice carrying the TEL-patch separation-of-function Acd K82del allele (analogous to human K84del/delta-K170) versus complete conditional Acd deletion on wild-type and Trp53-null backgrounds.
  experiment_type: In vivo knock-in separation-of-function HSC competitive transplantation assay
