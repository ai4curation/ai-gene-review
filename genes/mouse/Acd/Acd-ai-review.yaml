id: Q5EE38
gene_symbol: Acd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Essential shelterin adaptor subunit (commonly termed TPP1) in Mus musculus that tethers the rodent-duplicated single-stranded telomeric G-overhang-binding paralogs POT1a and POT1b to TIN2 and the duplex telomere-binding TRF1/TRF2 scaffold, while also recruiting the CST terminator subunit STN1 (OBFC1). Mouse Acd (416 amino acids) comprises an N-terminal oligonucleotide/oligosaccharide-binding (OB) fold preceded by the hydrophobic PWI motif (Pro11-Trp12-Ile13) and bearing the acidic TEL-patch loop (Asp78-Trp79-Glu80-Glu81-Lys82-Glu83), a central POT1a/POT1b-binding region, and a C-terminal TIN2-binding motif. Acd does not bind telomeric DNA directly; by recruiting POT1a and POT1b to telomeric repeat chromatin, it represses ATR-dependent DNA damage signaling, excessive 5' C-strand resection, and non-homologous end-joining chromosome fusions, while engaging TERT via its OB-fold TEL patch to promote telomerase-mediated telomere maintenance in stem and progenitor compartments. Hypomorphic splicing mutations (acd) cause p53-dependent apoptotic developmental defects in adrenal, urogenital, and caudal axial tissues alongside acute hematopoietic stem cell failure.
