- id: PMID:15537664
  title: Urogenital and caudal dysgenesis in adrenocortical dysplasia (acd) mice is caused by a splicing mutation in a novel telomeric regulator.
  findings:
  - statement: Positional cloning identifies a hypomorphic splice-donor mutation in mouse Acd as the cause of adrenocortical dysplasia, urogenital defects, and caudal regression.
    supporting_text: We report the identification of a splice donor mutation in a novel gene, which is the mouse ortholog of a newly discovered telomeric regulator.
  full_text_unavailable: true
- id: PMID:17053789
  title: POT1b protects telomeres from end-to-end chromosomal fusions and aberrant homologous recombination.
  findings:
  - statement: Mouse TPP1/Acd physically interacts with both POT1a and POT1b and TIN2 within rodent shelterin.
    supporting_text: POT1 (protection of telomere 1) is a highly conserved single-stranded telomeric binding protein that is essential for telomere end protection.
- id: PMID:17632522
  title: Telomere protection by mammalian Pot1 requires interaction with Tpp1.
  findings:
  - statement: Depletion or acd mutation of mouse Tpp1 abolishes POT1a/POT1b localization and triggers ATR-dependent telomere DNA damage responses.
    supporting_text: Pot1 binds Tpp1, the shelterin component that connects Pot1 to the duplex telomeric DNA-binding proteins Trf1 and Trf2.
  full_text_unavailable: true
- id: PMID:18185984
  title: Tpp1/Acd maintains genomic stability through a complex role in telomere protection.
  findings:
  - statement: Cells from homozygous acd mutant mice accumulate chromosome fusions at telomere sequences, demonstrating in vivo protection against telomeric NHEJ.
    supporting_text: We find that cells from homozygous acd mice harbor chromosomes fused at telomere sequences, demonstrating a role in telomere protection in vivo.
  full_text_unavailable: true
- id: PMID:19648609
  title: OB fold-containing protein 1 (OBFC1), a human homolog of yeast Stn1, associates with TPP1 and is implicated in telomere length regulation.
  findings:
  - statement: TPP1/Acd directly interacts with OBFC1/STN1 to recruit CST for telomere length control.
    supporting_text: Through proteomic analyses, we found that in addition to POT1, TPP1 can associate with another OB fold-containing protein, OBFC1/AAF44.
