description: Keratin-associated protein 7-1 (Krtap7-1) is a small (87 aa) high glycine-tyrosine (HGT) keratin-associated
  protein, the single member of the mammal-specific KAP7 family. Its ovine orthologue was cloned as one of the two
  major HGT proteins of sheep wool. HGT KAPs are among the first matrix proteins expressed in the keratinizing cortex
  of the hair follicle; they are incorporated into the interfilamentous matrix that surrounds the hair keratin intermediate
  filaments and are thought to associate with keratin head domains, contributing to the mechanical properties of
  the hair shaft. No gene-specific functional study of the mouse protein has been reported.
