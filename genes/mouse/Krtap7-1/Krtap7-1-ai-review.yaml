      rigid and resistant hair shaft through their extensive disulfide bond cross-linking with abundant cysteine
      residues of hair keratins.
  - reference_id: PMID:16382671
    supporting_text: Hair keratin-associated proteins (KAP) are a major component of the hair fiber, and play crucial
      roles in forming a strong hair shaft through a cross-linked network with keratin intermediate filaments (KIF),
      which are produced from hair keratins.
  - reference_id: PMID:22298953
    supporting_text: These filaments have a matrix surrounding them, that contains the keratin-associated proteins
      (KAPs), which cross-link with the IFs through extensive disulfide bonding
  - reference_id: PMID:29797269
    supporting_text: The KAPs, which infiltrate the space between the IF, are recognized as having especially important
      roles in the organisation of the IF into macrofibrils, in determining some of the most important physical
      attributes of the fully-keratinised hair fibre, including its hardness, toughness and pliability, and in linking
      IF to one another
suggested_questions:
- question: Which keratin residues or domains does Krtap7-1 cross-link or bind in the fibre, and does it pair preferentially
    with particular type I/type II trichocyte keratins or other KAPs?
- question: Is Krtap7-1 functionally redundant with its paralogues in the same KAP cluster, or does its loss change
    fibre mechanics, diameter or curvature?
- question: 'HGT KAPs have few cysteines: does this protein link to keratin filaments covalently, by non-covalent
    head-domain binding (as reported for KAP8.1), or both, and does it help set ortho/para-cortex architecture?'
suggested_experiments:
- description: Generate a Krtap7-1 knockout (CRISPR, ideally together with close paralogues) and measure fibre tensile
    strength, diameter, curvature and ortho/para-cortex organization, with keratin/KAP proteomics of the fibre.
  hypothesis: Krtap7-1 contributes non-redundantly to fibre mechanics or morphology.
  experiment_type: knockout phenotyping
- description: Map Krtap7-1-keratin cross-links in native fibres by cross-linking mass spectrometry, and test binding
    of recombinant protein to trichocyte keratin head domains (ITC/pull-down) under non-reducing and reducing conditions.
  hypothesis: Krtap7-1 associates with specific keratin head/tail domains.
  experiment_type: biochemical binding / XL-MS
- description: Define the follicular compartment and hair-cycle timing of Krtap7-1 expression by RNA in situ hybridization
    or single-cell RNA-seq of anagen follicles, with an antibody to confirm protein in the keratinized shaft.
  experiment_type: expression localization
