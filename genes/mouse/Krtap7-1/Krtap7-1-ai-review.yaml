core_functions:
- description: 'Structural matrix constituent of the keratinized hair shaft: as a high glycine-tyrosine (HGT) KAP,
    Krtap7-1 is deposited in differentiating cortical keratinocytes around the trichocyte keratin intermediate filaments
    and becomes cross-linked (chiefly by disulfide bonds for cysteine-rich KAPs) to keratin head/tail domains and
    to other matrix proteins, forming the interfilamentous matrix that gives the fibre its rigidity and mechanical
    resistance.'
  molecular_function:
    id: GO:0030281
    label: structural constituent of cutaneous appendage
