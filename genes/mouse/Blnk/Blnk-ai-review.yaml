  review:
    summary: The transferred soluble and plasma-membrane pools fit BLNK’s receptor-coupled adaptor mechanism.
    action: ACCEPT
    reason: The transferred soluble and plasma-membrane pools fit BLNK’s receptor-coupled adaptor mechanism.
      PMID:21822214 observes activation-dependent cytosol-to-plasma-membrane redistribution in primary
      mouse B cells and DT40 cells expressing tagged SLP65, and corroborates endogenous murine SLP65 complexes.
      Tagged rescue and endogenous association are distinct evidence; this is peripheral recruitment,
      not a transmembrane topology claim.
    supported_by:
    - reference_id: PMID:21822214
      supporting_text: wild-type SLP65 quantitatively translocated from the cytosol to the plasma membrane
        in response to BCR activation
