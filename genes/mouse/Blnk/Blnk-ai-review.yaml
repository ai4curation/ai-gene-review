      mouse SLP65 complexes in PMID:9705962 and endogenous murine co-immunoprecipitation in PMID:21822214
      support that location. The PMID:15196959 citation does not independently resolve its source-specific
      IDA assay from the accessible abstract, but the location itself is established independently; the
      broad term remains appropriate across pools. The PTN001019935 IBA is judged as an ancestral localization
      assertion, without a donor-count or self-source objection.
