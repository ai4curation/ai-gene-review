  review:
    summary: The PTN001019935 IBA traces the RTK-pathway assertion to the adaptor-family ancestor with
      mouse Clnk experimental grounding.
    action: UNDECIDED
    reason: The PTN001019935 IBA traces the RTK-pathway assertion to the adaptor-family ancestor with
      mouse Clnk experimental grounding. BCR-associated SYK is a non-receptor kinase, so BCR evidence
      alone does not establish this receptor-tyrosine-kinase process. The actual Clnk-to-ancestral-node
      experimental chain remains unresolved; neither a short donor list nor BLNK’s best-known BCR role
      establishes node misplacement or target-specific loss.
