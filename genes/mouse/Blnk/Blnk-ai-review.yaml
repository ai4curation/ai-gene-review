id: Q9QUN3
gene_symbol: Blnk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: BLNK (SLP-65/BASH) is a noncatalytic B-cell signaling adaptor. SYK-dependent phosphorylation
  creates docking sites for phospholipase Cgamma and other effectors, while BLNK’s SH2 domain couples
  it to phosphorylated receptors and SYK. Constitutive associations with CIN85/CD2AP help organize complexes
  that move from the cytoplasm to activated receptor sites at the plasma membrane. BLNK supports sustained
  calcium and transcriptional responses, pre-B-cell differentiation and feedback that downmodulates pre-BCR
  expression. It supplies spatial organization and binding interfaces rather than kinase or phospholipase
  catalysis.
