- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8WV28
  - ensembl:ENSP00000224337
  review:
    summary: Retain the human-to-mouse condensate-scaffold inference with its assay boundary explicit.
    action: ACCEPT
    reason: Retain the human-to-mouse condensate-scaffold inference with its assay boundary explicit.
      Direct tripartite phase separation was reconstituted with human SLP65, CIN85 and vesicles in PMID:32051419;
      endogenous murine SLP65 association with CIN85/CD2AP and functional preformed complexes in primary
      mouse B cells are supported by PMID:21822214. These support conserved multivalent organization,
      not a claim that mouse protein phase separation was directly measured or every endogenous granule
      has the reconstructed ultrastructure.
    supported_by:
    - reference_id: PMID:32051419
      supporting_text: phase separation driven by concerted transient interactions between scaffold proteins
        and vesicles
    - reference_id: PMID:21822214
      supporting_text: Co-immunoprecipitation experiments using human and murine B cells
