  review:
    summary: BLNK uses its SH2 domain to recognize phosphorylated SCIMP.
    action: MODIFY
    reason: BLNK uses its SH2 domain to recognize phosphorylated SCIMP. PMID:21930792 identifies phosphorylation-dependent
      SLP65 association; PMID:28290451 uses SH2-domain probes and mouse RAW264.7 SCIMP phosphosite mutants
      to distinguish recruitment. Curated mouse UniProt maps BLNK binding to SCIMP Tyr120. Phosphotyrosine
      residue binding captures BLNK recognition of the partner phosphosite; it is not binding to another
      protein’s SH2 domain, and the assay is not proof that every macrophage has endogenous BLNK signaling.
