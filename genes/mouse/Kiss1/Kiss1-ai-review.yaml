knowledge_gaps:
- gap_statement: >-
    Why deleting the ligand is milder and more variable than deleting its receptor on the
    same genetic background is unknown. Half of ligand-null females have near-normal
    gonadal weight with persistent vaginal cornification while the other half match the
    receptor null, which leaves open whether the receptor has ligand-independent activity,
    whether a second agonist exists, or whether an incompletely silenced locus or a
    modifier accounts for the difference.
  boundary: >-
    Established: both nulls are infertile with abnormal sexual maturation and low
    gonadotropins; the receptor null does not respond to exogenous agonist whereas the
    ligand null does, so the pituitary-gonadal axis below the lesion is intact in the
    ligand null; and the near-identical phenotype of the two nulls in an independent
    laboratory is what established the ligand-receptor relationship in vivo. Not
    established: the source of the residual signalling or of the bimodality.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    It decides how far receptor-derived evidence may be transferred to the ligand, and
    whether any clinical or pharmacological conclusion drawn from receptor blockade
    applies to removing the peptide.
  resolution: >-
    Compare the two nulls on one background with an inverse agonist of the receptor, a
    conditional ligand deletion that removes every kisspeptin-expressing population, and a
    search for agonist activity in ligand-null hypothalamic extracts.
  provenance:
  - reference_id: PMID:17595229
    supporting_text: >-
      Kiss1 knockout mice appear to be less severely affected than their receptor
      counterparts
  - reference_id: PMID:17595229
    supporting_text: Kiss1 knockout females demonstrate two distinct phenotypes
  - reference_id: PMID:17595229
    supporting_text: >-
      Gpr54 knockout mice fail to increase gonadotropins, whereas Kiss1 knockout mice
      respond with increased gonadotropin levels
- gap_statement: >-
    What locally made kisspeptin does in the mouse uterus in vivo is unknown. Expression
    rises during decidualization and knockdown blocks decidualization of cultured stromal
    cells, but no experiment has separated a local uterine action from the systemic
    hypogonadism of the whole-body null, and the neighbouring placental claim does not
    hold in mouse at all.
  boundary: >-
    Established: ligand and receptor proteins appear in decidualizing stromal cells in
    pregnant and in pseudopregnant animals, siRNA knockdown of the ligand blocks the
    appearance of decidualization markers in culture, and the mouse placenta expresses the
    gene at levels its own authors judge of questionable physiological significance, with
    no structural or transport defect in mutant placentas. Not established: whether uterine
    kisspeptin is required for implantation or decidualization in an intact animal with a
    normal reproductive axis.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    Human pregnancy involves a large placenta-derived circulating kisspeptin pool with no
    mouse counterpart, so whether the mouse retains any local uterine role determines
    whether the mouse can model that biology at all.
  resolution: >-
    Uterine-restricted conditional deletion of the ligand in animals whose reproductive
    axis is maintained by exogenous steroid, scoring implantation, decidual markers and
    litter outcome, with the receptor deleted in the same compartment as a control for a
    receptor-independent route.
  provenance:
  - reference_id: PMID:24830702
    supporting_text: >-
      the attenuated expression of Kiss1 using small interfering RNA approaches
      significantly blocked the progression of stromal cell decidualization
  - reference_id: PMID:25468546
    supporting_text: >-
      the expression level of the Kiss1 gene in the mouse placenta is so low as to be of
      questionable physiological significance
  - reference_id: PMID:25468546
    supporting_text: >-
      Stereological measurements found no differences between Kiss1 mutant and wild-type
      placentas
suggested_questions:
- question: >-
    Should the hypothalamic arm of this gene product carry GO:0160041 neuropeptide
    activity, whose definition is the receptor ligand activity of a polypeptide expressed
    in and secreted from a neuron, rather than its parent GO:0048018 receptor ligand
    activity? The mouse case is stronger than the human one, because the mouse placental
    arm is negligible and the receptor is typed as a neuropeptide receptor, but mouse
    kisspeptin also acts as a local ligand in uterine stroma and in the osteoclast lineage,
    which the neuronal term would exclude.
- question: >-
    GO has no term for gonadotropin-releasing hormone secretion or its regulation, so the
    proximal action of kisspeptin on GnRH neurons has to be recorded one step downstream as
    regulation of luteinizing hormone secretion. Is such a term wanted, given that the
    kisspeptin, neurokinin B and dynorphin systems all act at that step and that the mouse
    evidence identifies the GnRH neuron as the site of action?
- question: >-
    The arcuate and the periventricular kisspeptin populations do different jobs, the first
    generating pulsatile luteinizing hormone release and the second the estradiol-dependent
    preovulatory surge, and they are oppositely regulated by estradiol. Should that
    division be representable on the gene, for example through cell-type or anatomical
    annotation extensions, rather than being collapsed into one set of process terms?
suggested_experiments:
- description: >-
    Delete the ligand selectively in the arcuate and in the periventricular kisspeptin
    populations in adult animals, using population-restricted drivers and an inducible
    allele, and measure pulsatile luteinizing hormone release, the steroid-induced surge
    and fertility separately in each.
  hypothesis: >-
    The two populations contribute separable outputs, so removing arcuate kisspeptin
    abolishes pulsatility while sparing the surge, and removing the periventricular
    population does the reverse, which would mean the process terms now carried by one gene
    record describe two distinct cellular functions.
- description: >-
    Identify the enzymes that cut the mouse precursor by knocking down candidate
    endoproteases individually in a mouse kisspeptin-neuron model and in primary uterine
    stromal cells, then quantifying the secreted peptide species by targeted mass
    spectrometry with the amidated C-terminus as the reporter.
  hypothesis: >-
    One convertase generates the long peptide in both tissues and the shorter forms arise
    from tissue-specific secondary cleavage, so the species that reaches the receptor
    differs by tissue rather than by enzyme repertoire.
