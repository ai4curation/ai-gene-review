  review:
    summary: >-
      Clade-level inference that KISS1-family peptides are active in the extracellular
      region. The family (PTHR16955) is small and vertebrate-restricted and every member
      is a signal-peptide-bearing precursor of the same amidated RF-amide peptides, so
      extracellular action is inherited rather than lineage-specific.
    action: ACCEPT
    reason: >-
      The phylogenetic assertion is sound and agrees with direct mouse evidence that the
      peptide acts from outside the target cell: bath-applied kisspeptin depolarizes
      mouse GnRH neurons, and intracerebroventricular peptide drives gonadotropin
      secretion. Secretion of the endogenous peptide was measured directly in rat
      hypothalamic cultures. This is a core location, because the activity of this gene
      product is exerted on a receptor of a neighbouring cell. just paint-losses mouse
      Kiss1 reports no IRD or IKR on this gene's lineage, so the inference is current.
