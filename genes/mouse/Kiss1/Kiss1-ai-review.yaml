id: Q6Y4S4
gene_symbol: Kiss1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Secreted precursor (130 aa, with an N-terminal signal peptide) of the kisspeptins, a
  family of C-terminally amidated RF-amide neuropeptides released by cleavage at paired
  basic residues: metastin / kisspeptin-52 (residues 68-119) and the minimal decapeptide
  kisspeptin-10 (110-119), whose amidated C-terminus is required for receptor binding and
  activation. The decapeptide is almost identical to the human one, differing by a single
  conserved residue, while the precursors share only about half their sequence. The mature
  peptides act outside the cell as high-affinity agonists of the plasma-membrane G
  protein-coupled receptor Kiss1r (Gpr54), coupling it to Gq/11 and phospholipase C with
  PIP2 hydrolysis, a rise in intracellular calcium and ERK1/2 signalling, with an
  additional G protein-independent beta-arrestin arm. Its dominant role is neuroendocrine:
  kisspeptin neurons of the arcuate nucleus and of the anteroventral periventricular /
  rostral periventricular region release the peptide onto gonadotropin-releasing hormone
  (GnRH) neurons, where it closes potassium channels and opens non-selective cation
  channels to depolarize the neuron and drive GnRH and hence pituitary gonadotropin (LH
  and FSH) secretion. The arcuate population, which co-expresses neurokinin B and
  dynorphin, generates the pulsatile pattern of LH release, and the periventricular
  population mediates the estradiol-dependent preovulatory LH surge; the two are
  oppositely regulated by estradiol. Loss of the gene in mouse gives hypogonadotropic
  hypogonadism with failure of sexual maturation, low gonadotropins and sex steroids, no
  estrous cyclicity and no LH surge, while the pituitary and gonads themselves remain
  responsive. Outside the reproductive axis, kisspeptin made in the osteoclast lineage
  restrains osteoclast differentiation and bone resorption through receptor-dependent
  dephosphorylation of SRC, and uterine kisspeptin rises during decidualization. In
  contrast to human, the mouse gene is expressed in placenta at negligible levels and
  kisspeptin signalling is not required for mouse placental structure or function.
