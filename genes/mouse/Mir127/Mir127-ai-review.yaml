suggested_questions:
- question: Does mir-127 have any function outside the Dlk1-Dio3 imprinted locus and
    its Rtl1 target, given that its other annotations all come from profiling
    surveys?
  experts:
  - imprinting researchers
  - microRNA biologists
- question: Is the placental requirement for miR-127 entirely explained by Rtl1
    repression, or are there additional targets?
  experts:
  - developmental biologists
suggested_experiments:
- description: mir-127 deletion combined with Rtl1 dosage correction, scoring
    labyrinthine layer morphology
  experiment_type: mouse genetics
  hypothesis: The placental phenotype of mir-127 loss is fully rescued by lowering
    Rtl1, indicating a single functionally relevant target
- description: Ago CLIP in placental trophoblast comparing wild-type and mir-127-null
    tissue
  experiment_type: high-throughput sequencing
  hypothesis: Rtl1 is the dominant mir-127-dependent Argonaute target in placenta
