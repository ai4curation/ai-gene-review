  findings: []
- id: PMID:26138477
  title: A trans-homologue interaction between reciprocally imprinted miR-127 and
    Rtl1 regulates placenta development.
  findings:
  - statement: >-
      miR-127 and Rtl1 are reciprocally imprinted and interact in trans, and this
      interaction regulates placenta development.
    supporting_text: A trans-homologue interaction between reciprocally imprinted
      miR-127 and Rtl1 regulates placenta development
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMC full text checked; miR-127 is the subject of the paper and is
      assayed directly.
- id: PMID:20439489
  title: miRNA 34a, 100, and 137 modulate differentiation of mouse embryonic stem
    cells.
  findings:
  - statement: >-
      An expression survey in which 138 miRNAs rose during LIF-withdrawal-induced
      differentiation; only miR-34a, miR-100 and miR-137 were functionally tested.
    supporting_text: We report that 138 miRNAs are increased on the induction of differentiation
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Cached record is abstract-only, and mir-127 is not among the three miRNAs
      the abstract reports as tested. It is one of the untested members of a
      291-row IEP batch drawn from this paper.
- id: PMID:25858512
  title: miR-26a and miR-384-5p are required for LTP maintenance and spine enlargement.
  findings:
  - statement: >-
      372 miRNAs were detected, only 12 changed during LTP, and only miR-26a,
      miR-384-5p and let-7a were shown to be required. mir-127 is not mentioned
      anywhere in the paper.
    supporting_text: we identified 372 miRNAs
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: >-
      PMC full text checked; miR-127 does not appear. The annotation reflects
      membership of the detected-miRNA set only.
