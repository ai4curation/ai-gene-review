id: URS0000341906_10090
gene_symbol: Mir127
product_type: MIRNA
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mir127 encodes the mouse mir-127 precursor from the imprinted Dlk1-Dio3 locus,
  where it is transcribed from the maternal allele antisense to the paternally
  expressed retrotransposon-like gene Rtl1. Its mature product is a guide RNA
  that directs Argonaute/RISC to Rtl1 transcripts in a trans-homologue
  interaction, and this miR-127-Rtl1 pairing is required for normal placenta
  development, particularly of the labyrinthine layer. mir-127 is also broadly
  expressed and consequently appears in unrelated miRNA profiling surveys.
