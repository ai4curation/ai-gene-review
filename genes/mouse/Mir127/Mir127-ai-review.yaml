- term:
    id: GO:0040029
    label: epigenetic regulation of gene expression
  evidence_type: IMP
  original_reference_id: PMID:26138477
  qualifier: acts_upstream_of_or_within
  review:
    summary: Reflects the imprinted, allele-specific nature of the miR-127-Rtl1 pair.
    action: KEEP_AS_NON_CORE
    reason: >-
      Defensible - miR-127 acts from the maternal allele on the paternally
      expressed Rtl1, so allele-specific regulation is genuinely part of the
      mechanism. Kept as non-core because the imprinting is a property of the
      locus rather than an activity of the mature miRNA, whose own action is
      ordinary RISC-mediated repression.
- term:
    id: GO:1990830
    label: cellular response to leukemia inhibitory factor
  evidence_type: IEP
  original_reference_id: PMID:20439489
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Batch expression annotation from an embryonic-stem-cell screen in which
      mir-127 was not among the tested miRNAs.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      One of 291 IEP annotations to this term from a single paper. The study
      induced ESC differentiation by withdrawing LIF and recorded which miRNAs
      rose; only miR-34a, miR-100 and miR-137 were then functionally tested, and
      mir-127 is not among them. A miRNA rising when a cytokine is removed is
      also a poor fit for "cellular response to leukemia inhibitory factor",
      which describes a reaction to the presence of LIF. Marked over-annotated
      rather than removed because only the abstract is cached, so the underlying
      expression measurement cannot be inspected directly.
    supported_by:
    - reference_id: PMID:20439489
      supporting_text: We report that 138 miRNAs are increased on the induction of
        differentiation
- term:
    id: GO:0060291
    label: long-term synaptic potentiation
  evidence_type: IEP
  original_reference_id: PMID:25858512
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      mir-127 is not discussed anywhere in the cited paper; the row reflects
      membership of the detected-miRNA set.
    action: REMOVE
    reason: >-
      The bottom tier of the 130-member IEP batch from this study. The paper
      detected 372 miRNAs, found 12 that changed during LTP, and functionally
      validated three; miR-127 is in none of those groups and the PMC full text
      does not mention it. The sole fact behind this annotation is that mir-127
      was detectable in hippocampal slices. Note also that the same batch omits
      let-7a, one of the three miRNAs the paper does establish as required, so
      the cohort is not merely over-inclusive but poorly aligned with the paper's
      findings.
    supported_by:
    - reference_id: PMID:25858512
      supporting_text: we identified 372 miRNAs
    - reference_id: PMID:25858512
      supporting_text: the identification of miR-26a, miR-384-5p and let-7a as essential
        for LTP maintenance and enlargement of dendritic spines
