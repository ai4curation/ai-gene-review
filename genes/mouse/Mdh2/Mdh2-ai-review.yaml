  review:
    summary: The NADP-dependent malate dehydrogenase transfer conflicts with the established MDH2 reaction, which uses NAD+ rather than NADP+. Mouse Mdh2 is EC 1.1.1.37 and the UniProt catalytic reaction is explicitly NAD-dependent.
    action: REMOVE
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: RGD:619719
        source_status: SOURCE_BAD
        comment: The rat ortholog is also the NAD-dependent mitochondrial MDH2 enzyme, so the NADP-dependent activity is a bad source assertion rather than a transferable activity.
      residue_claims_not_applicable: The rejection concerns cofactor specificity, not individual residues.
