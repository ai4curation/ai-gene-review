id: P08249
gene_symbol: Mdh2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mdh2 encodes the mitochondrial NAD-dependent malate dehydrogenase, a nuclear-encoded precursor that is imported into the mitochondrial matrix and assembles as an LDH/MDH-family homodimer. The mature enzyme reversibly interconverts L-malate and oxaloacetate, completing the final oxidative step of the tricarboxylic acid cycle and providing the matrix malate/oxaloacetate reaction used by the malate-aspartate shuttle and the malate branch of gluconeogenesis. Mdh2 can also catalyze a secondary 2-oxoglutarate reductase reaction, and human MDH2 has a cytosolic RNA-binding moonlighting activity transferred to mouse by orthology.
