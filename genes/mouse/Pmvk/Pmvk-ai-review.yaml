core_functions:
- description: >-
    Phosphomevalonate kinase: reversible ATP-dependent phosphorylation of (R)-5-phosphomevalonate to (R)-5-diphosphomevalonate,
    step 2 of isopentenyl diphosphate synthesis via the mevalonate pathway, in the cytosol.
  molecular_function:
    id: GO:0004631
    label: phosphomevalonate kinase activity
  directly_involved_in:
  - id: GO:0019287
    label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:16519518
    supporting_text: >-
      PMK catalyzes a reversible reaction; kinetic constants of human PMK have been determined for both
      forward (formation of mevalonate 5-diphosphate) and reverse (formation of mevalonate 5-phosphate)
      reactions
  - reference_id: PMID:36808719
    supporting_text: >-
      we constructed PMVK knockout mice and found that WT and PMVK+/− mice reproduced normally, but that
      PMVK homozygous knockout was embryonic lethal
  - reference_id: PMID:14729858
    supporting_text: >-
      We found an exclusive cytosolic localization of both endogenously expressed human phosphomevalonate
      kinase
suggested_questions:
- question: >-
    Is the peroxisomal PMVK seen in mouse liver proteomics imported through its C-terminal -AKL, is it
    catalytically active there, and why does human PMVK, whose -SRL is also a PTS1, appear exclusively
    cytosolic?
- question: >-
    Do the proposed protein-kinase activities of PMVK (beta-catenin Ser184, SP1 Thr355, GAD1) survive
    tests with purified enzyme, catalytically dead mutants and other laboratories?
- question: >-
    Are the N-terminally truncated isoforms 2 and 3, which lack part or all of the ATP-binding loop, translated,
    and do they have any activity?
suggested_experiments:
- hypothesis: A fraction of mouse PMVK is imported into peroxisomes via its C-terminal -AKL.
  description: >-
    Compare wild-type and -AKL-deleted PMVK knock-in (or tagged) alleles in mouse hepatocytes for peroxisome
    co-sedimentation, protease protection and PEX5 binding, with Pex5-deficient controls.
  experiment_type: subcellular fractionation and targeting-signal mutagenesis
knowledge_gaps:
- gap_statement: >-
    Whether mouse PMVK is imported into the peroxisomal matrix, and whether that pool has any function,
    is unknown.
  boundary: >-
    PMVK co-purifies with gradient-purified mouse liver peroxisomes and ends in a PTS1-type tripeptide,
    whereas human PMVK is exclusively cytosolic by fractionation, IF and immuno-EM, and pathway enzyme
    activity does not need functional peroxisomes.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    A peroxisomal PMVK pool would bear on the long-disputed role of peroxisomes in isoprenoid synthesis.
  resolution: Targeting-signal mutagenesis and protease protection in mouse hepatocytes.
  provenance:
  - reference_id: PMID:38247867
    supporting_text: >-
      Notably, several proteins like ABHEB, ACNT1, LACB2, and PMVK, which have been suggested for a peroxisomal
      localization [3], can be found in the cluster of the bona fide peroxisomal proteins, supporting
      their localization to the organelle
  - reference_id: PMID:14729858
    supporting_text: No indication of a peroxisomal localization was obtained.
