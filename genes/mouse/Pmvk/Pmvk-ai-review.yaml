- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q15126
  review:
    summary: Peroxisome transferred from human PMVK (IDA, PMID:17180682).
    action: KEEP_AS_NON_CORE
    reason: >-
      Synthesis row on a root organelle term (projects/ORGANELLES.md rule 3), so the evidence was examined.
      The source is the human IDA from the Krisans lab (PMID:17180682), which human-specific work contradicts
      (PMID:14729858), so the source alone would not carry the claim. For the mouse, however, there is
      direct organelle evidence: in the 2024 mouse liver peroxisome proteome (iodixanol-gradient peroxisomes,
      over 90% pure), PMVK falls in the cluster of bona fide peroxisomal proteins (PMID:38247867), and
      mouse PMVK ends in the PTS1-type tripeptide -AKL. The peroxisome claim therefore holds for mouse
      at least for a pool of the protein. Kept as non-core: pathway flux does not depend on peroxisomes
      (Pex5-/- liver keeps PMK activity, PMID:11792727), and the core activity is placed in the cytosol.
      I stayed at the root term: the PTS1 and the soluble fold point to the matrix, but the human localization
      data disagree, so the lines are not concordant enough to add a matrix row.
    supported_by:
    - reference_id: PMID:38247867
      supporting_text: >-
        Notably, several proteins like ABHEB, ACNT1, LACB2, and PMVK, which have been suggested for a
        peroxisomal localization [3], can be found in the cluster of the bona fide peroxisomal proteins,
        supporting their localization to the organelle
    - reference_id: PMID:38247867
      supporting_text: >-
        Indeed, according to enzymatic activity measurements, the protocol used in this work reproducibly
        allows for the isolation of peroxisomes with a purity above 95% for the LM1 and 90% for the LM2
        fraction
    - reference_id: PMID:11792727
      supporting_text: >-
        We found that all enzymes measured, including putative peroxisomal enzymes, are at least as active
        in the peroxisome-deficient Zellweger mice as in control mice
    propagation_review:
