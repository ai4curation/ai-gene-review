  review:
    summary: >-
      NOT located in peroxisome, transferred by UniProt from human PMVK (IDA NOT, PMID:14729858).
    action: REMOVE
    reason: >-
      The negation holds for the human protein, where fractionation, digitonin, IF and immuno-EM found
      no peroxisomal PMVK (PMID:14729858). Transferred to the mouse it is contradicted by mouse data:
      mouse liver peroxisomes purified on iodixanol gradients carry PMVK in the cluster of bona fide peroxisomal
      proteins (PMID:38247867), and mouse PMVK has a PTS1-type C-terminus (-AKL). A review cannot keep
      both the term and its negation; the mouse evidence supports the positive row, so the propagated
      NOT is removed. This does not dispute the human result, and why human PMVK, whose -SRL is also a
      PTS1, behaves differently is unresolved.
    supported_by:
    - reference_id: PMID:38247867
      supporting_text: >-
        Notably, several proteins like ABHEB, ACNT1, LACB2, and PMVK, which have been suggested for a
        peroxisomal localization [3], can be found in the cluster of the bona fide peroxisomal proteins,
