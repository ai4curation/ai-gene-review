        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Human peroxisome IDA (PMID:17180682) is contradicted for human by PMID:14729858; the mouse claim
          stands on mouse liver peroxisome proteomics (PMID:38247867) instead.
