id: Q9D1G2
gene_symbol: Pmvk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Pmvk encodes mouse phosphomevalonate kinase (PMK; EC 2.7.4.2), a 192-residue enzyme of the nucleoside-monophosphate-kinase
  (P-loop) fold that is unrelated in structure to the GHMP-type PMKs of fungi and plants. It catalyses
  the reversible, ATP-dependent phosphorylation of (R)-5-phosphomevalonate to (R)-5-diphosphomevalonate,
  the second of the three steps that convert mevalonate into isopentenyl diphosphate, the precursor of
  cholesterol and the non-sterol isoprenoids. ATP is bound by an N-terminal basic loop. The gene is essential
  in the mouse (the knockout is embryonic lethal), and liver-specific loss lowers hepatic tumour formation
  in a chemical carcinogenesis model. The enzyme is mainly cytosolic, as shown for its human ortholog,
  but mouse PMVK ends in a peroxisome-targeting-type tripeptide (-AKL) and co-purifies with liver peroxisomes,
  suggesting a peroxisomal pool whose role is unknown. Alternative transcripts encode N-terminally shortened
  isoforms. Cancer-cell studies have proposed additional protein-kinase activities toward beta-catenin,
  SP1 and GAD1, which await independent confirmation.
