- term:
    id: GO:0006695
    label: cholesterol biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1915853
  - PANTHER:PTN000991923
  - UniProtKB:Q15126
  review:
    summary: PAINT inference from PTN000991923.
    action: KEEP_AS_NON_CORE
    reason: >-
      PMVK catalyses step 2 of isopentenyl diphosphate synthesis from mevalonate, upstream of the sterol
