suggested_questions:
- question: Is SCRAPPER actually prenylated in vivo (farnesyl vs geranylgeranyl), and
    is lipidation required for RIM1 ubiquitination, or only for synaptic enrichment?
- question: Does RIM1 recognition require a phosphodegron (e.g. SAD-kinase
    phosphorylation of RIM1), analogous to the phospho-Thr159 degron in human VPS34?
- question: Which additional presynaptic proteins (synaptophysin, synapsin IIa,
    Munc13, synaptotagmin) are direct SCRAPPER substrates rather than secondary changes?
suggested_experiments:
- description: Quantitative ubiquitinome/proteome of Scrapper knockout versus wild-type
    synaptosomes, with CAAX-mutant and LRR-only rescue, to define the direct
    presynaptic substrate repertoire.
- description: Reconstitute SCF(SCRAPPER) ubiquitination of RIM1 with purified
    components, map ubiquitination sites and test phosphorylation dependence.
- description: Test whether the human-established substrates VPS34 and PR55alpha are
    regulated by Fbxl20 in mouse neurons or tissues.
