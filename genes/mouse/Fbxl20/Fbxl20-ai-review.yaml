id: Q9CZV8
gene_symbol: Fbxl20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Fbxl20 (SCRAPPER) is a brain-enriched F-box/leucine-rich-repeat protein of the
  FBXL2/FBXL20 subfamily (PANTHER PTHR13318:SF47) with an N-terminal F-box, thirteen
  LRRs and a C-terminal CAAX (CIIL) prenylation motif. In mouse brain it assembles an
  SCF E3 ubiquitin ligase with Skp1 and Cul1, in which it acts as the
  substrate-recognition subunit. Its best-characterized substrate is the presynaptic
  active-zone protein RIM1 (Rims1): the LRR region binds the RIM1 C2B domain directly,
  the native SCRAPPER complex ubiquitinates RIM1 in vitro, and knockout neurons show
  loss of RIM1 ubiquitination and a roughly seven-fold longer RIM1 half-life. SCRAPPER
  localizes to presynaptic terminals in a CAAX-dependent manner and, by setting RIM1
  levels, restrains synaptic vesicle release: knockout neurons have increased
  miniature excitatory postsynaptic current frequency (rescued by SCRAPPER
  re-expression or RIM1 knockdown), reduced paired-pulse facilitation at CA3-CA1
  synapses, altered LTP/LTD thresholds and lost presynaptic LTP in anterior cingulate
  cortex. Knockout mice are born at sub-Mendelian ratios, are small and short-lived,
  and heterozygotes have impaired contextual fear memory. In human cells the
  orthologous FBXL20 also directs SCF-dependent degradation of VPS34 and PR55alpha;
  these substrates have not been tested in mouse.
