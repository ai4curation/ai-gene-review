- id: PMID:17803915
  title: SCRAPPER-dependent ubiquitination of active zone protein RIM1 regulates synaptic
    vesicle release.
  findings:
  - statement: SCRAPPER forms an SCF complex with Skp1 and Cul1 in mouse brain.
    supporting_text: SCRAPPER formed an SCF complex with Skp1 and Cullin1 in mouse
      brain lysates
  - statement: SCRAPPER binds RIM1 directly and its complex ubiquitinates RIM1 in
      vitro.
    supporting_text: Thus, the SCRAPPER complex was sufficient to mediate
      ubiquitination of RIM1 in vitro.
  - statement: SCRAPPER is required for normal RIM1 turnover in neurons.
    supporting_text: confirming that SCRAPPER enhances the rate of turnover of RIM1
  - statement: C-terminal CAAX motif is needed for punctate synaptic localization.
    supporting_text: This indicates that the carboxyl-terminal prenylation signal is
      important for the distinct localization of SCRAPPER.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3049808). Primary characterization of mouse
      SCRAPPER (isoform 3, 438 aa); knockout, transgenic, biochemistry and
      electrophysiology. Source of all SynGO/MGI experimental rows.
- id: PMID:21390313
  title: 'Synaptic E3 ligase SCRAPPER in contextual fear conditioning: extensive behavioral
    phenotyping of Scrapper heterozygote and overexpressing mutant mice.'
  findings:
  - statement: Scrapper heterozygous mice are impaired in contextual fear
      conditioning.
    supporting_text: contextual but not cued fear conditioning test
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Behavioural phenotyping; supports the acts_upstream_of_or_within
      fear-response row only.
- id: PMID:23316391
  title: SCRAPPER regulates the thresholds of long-term potentiation/depression, the
    bidirectional synaptic plasticity in hippocampal CA3-CA1 synapses.
  findings:
  - statement: Scrapper knockout alters LTP/LTD magnitudes at CA3-CA1 synapses.
    supporting_text: Scrapper-knockout mice exhibited LTDs with smaller magnitudes
      after induction
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse knockout electrophysiology; corroborates a presynaptic
      plasticity role but adds no new molecular function.
- id: PMID:28292828
  title: SCRAPPER Selectively Contributes to Spontaneous Release and Presynaptic Long-Term
    Potentiation in the Anterior Cingulate Cortex.
  findings:
  - statement: Knockout increases spontaneous glutamate release in ACC and blocks
      presynaptic LTP.
    supporting_text: Miniature and spontaneous releases, but not evoked release, of
      glutamate were significantly increased in SCRAPPER knock-out (SCR-KO) mice
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Extends the release-regulation phenotype to cortex.
- id: PMID:25593308
  title: FBXL20-mediated Vps34 ubiquitination as a p53 controlled checkpoint in regulating
    autophagy and receptor degradation.
  findings:
  - statement: Human FBXL20 with Skp1-Cul1 mediates phosphorylation-dependent
      ubiquitination and degradation of Vps34.
    supporting_text: Here we show that FBXL20 regulates the abundance of Vps34 through
      SCF complex-mediated ubiquitination and proteasomal degradation in a
      phosphorylation-dependent manner.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Human-cell study of the same PANTHER subfamily (SF47) ortholog;
      supports the conserved SCF substrate-adaptor role but the Vps34 substrate has
      not been tested in mouse and is not transferred as a mouse fact.
core_functions:
- description: Substrate-recognition (F-box) subunit of an SCF (Skp1-Cul1-F-box) E3
    ubiquitin ligase at the presynaptic terminal, where its LRR domain binds the
    active-zone protein RIM1 and directs its ubiquitination and proteasomal turnover,
    thereby restraining synaptic vesicle release and tuning short-term presynaptic
    plasticity. Experimentally established in mouse.
