core_functions:
- description: Actin-binding and actin-crosslinking protein. A C-terminal segment binds F-actin directly and N-terminal multimerization
    lets the protein crosslink filaments; experimentally established on the mouse protein in vitro. In thyrocytes it sits
    at the apical membrane cortex, where its loss disorganizes apical structure.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
  - id: GO:0051764
    label: actin crosslink formation
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:27462298
    supporting_text: the carboxyl terminal region of PI3KAP/XB130 containing amino acid residues 830-840 was required and
      sufficient for localization to F-actin in NIH3T3 cells, and this region is directly bound to F-actin in vitro
  - reference_id: PMID:27462298
    supporting_text: In summary, our data clearly demonstrated that PI3KAP/XB130 crosslinked actin filaments.
  - reference_id: PMID:34470464
    supporting_text: At PW2, XB130 is mainly located at the apical membrane of thyrocytes
- description: Phosphotyrosine-dependent adaptor coupling tyrosine kinase signals to PI3K. Tyrosine-phosphorylated Afap1l2
    binds the p85alpha regulatory subunit (mouse IPI; YxxM Tyr54 conserved with human) and promotes PI3K-AKT signaling, as
    shown in mouse oligodendrocyte-lineage cells downstream of PTN-PTPRZ.
  molecular_function:
    id: GO:0036312
    label: phosphatidylinositol 3-kinase regulatory subunit binding
  directly_involved_in:
  - id: GO:0051897
    label: positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:30667096
    supporting_text: In OL1 cells, the knockdown of AFAP1L2 or application of a PI3K inhibitor suppressed cell differentiation
      as well as the PTN-induced phosphorylation of AKT and mTOR.
  - reference_id: PMID:30667096
    supporting_text: the PTN-PTPRZ signal stimulates OPC differentiation partly by enhancing the tyrosine phosphorylation
      of AFAP1L2 in order to activate the PI3K-AKT pathway.
  - reference_id: PMID:19060924
    supporting_text: We identified tyrosine 54 of XB130 as the major target of RET/PTC-mediated phosphorylation and a critical
      binding site for the SH2 domains of p85alpha.
  - reference_id: file:mouse/Afap1l2/Afap1l2-bioinformatics/RESULTS.md
    supporting_text: Human Tyr54, the p85-docking YxxM tyrosine (Y54-I-Y-M57), aligns to mouse Tyr54
- description: Non-catalytic activator of c-Src that binds Src through its SH2/SH3-binding N-terminus; inferred from the human
    and rat SF4 orthologs, not tested on the mouse protein.
  molecular_function:
    id: GO:0030296
    label: protein tyrosine kinase activator activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:17412687
    supporting_text: Their co-expression in COS-7 cells resulted in activation of c-Src and elevated tyrosine phosphorylation
      of multiple proteins, including XB130 itself.
  - reference_id: PMID:22496359
    supporting_text: c-Src was associated with PI3KAP/XB130 and was activated in response to cAMP.
suggested_questions:
- question: Does Afap1l2 crosslink actin at the thyrocyte apical cortex in vivo, and is the loss of microvilli and apical
    ezrin in Xb130-/- thyroid a direct consequence of losing that crosslinking activity rather than of reduced PI3K-AKT signaling?
- question: Which tyrosine kinase phosphorylates Afap1l2 in thyrocytes (Src downstream of TSH/cAMP, as in rat FRTL-5 cells),
    and is p85 docking required for the apical-membrane function?
- question: Do the two mouse isoforms (Q5DTU0-1 and the 18-residue-longer Q5DTU0-2 used for the actin assays) differ in actin
    association or localization, given the N-terminal K/RYKXL motif difference noted by Yamanaka et al.?
suggested_experiments:
- description: Re-express wild-type, actin-binding-region-deleted (canonical 812-822) and Y54F Afap1l2 in Xb130-/- thyrocyte
    organoids or primary follicles and score apical microvilli, ezrin and TPO localization and lumen formation, to separate
    actin-crosslinking from PI3K-docking functions.
- description: Test whether endogenous mouse Afap1l2 binds Src and enhances Src Y416 phosphorylation in thyroid or OL1 cells,
    so the Src-activator activity, currently inferred from human and rat, is established in mouse.
