- term:
    id: GO:0032757
    label: positive regulation of interleukin-8 production
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8N4X5
  - ensembl:ENSP00000303042
  review:
    summary: Positive regulation of interleukin-8 production (IEA), projected from human. Mouse has no IL-8 gene.
    action: REMOVE
    reason: 'The human annotation rests on reduced IL-8 output after XB130 knockdown in a human epithelial line, which may
      be valid for human. It cannot be transferred to mouse: the IL8 (CXCL8) gene was lost in the muroid rodent lineage and
      is absent from the mouse genome, so a mouse gene product cannot regulate IL-8 production. This is a taxon-inappropriate
      ortholog projection (TAXON_CONSTRAINT_VIOLATION).'
    supported_by:
    - reference_id: PMID:10028286
      supporting_text: this gene is absent in the rat and the mouse, indicating a unique gene loss event in the rat/mouse
        (muroid rodent) lineage
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q8N4X5
        source_label: human AFAP1L2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The human IL-8 readout may hold for human, but the IL8 gene is absent from mouse, so the term cannot apply
          to the mouse ortholog.
