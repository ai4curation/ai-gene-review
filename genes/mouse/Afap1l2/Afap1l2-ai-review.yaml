- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:30667096
  qualifier: enables
  supporting_entities:
  - UniProtKB:P26450
  review:
    summary: Mouse IPI with Pik3r1 (p85alpha, P26450), from the PTN-PTPRZ oligodendrocyte study. The interaction is the phosphotyrosine
      docking of AFAP1L2 onto the PI3K regulatory subunit.
    action: MODIFY
    reason: 'Bare protein binding is uninformative. The interacting partner is the PI3K regulatory subunit p85alpha, and the
      binding is the defining adaptor contact of AFAP1L2: phosphorylated Tyr54 (YxxM) docks the p85alpha SH2 domains in human
      (Lodyga 2009), the rat ortholog was purified as the p125 p85-associated protein and a Y72F mutant (the same tyrosine
      in the long-isoform numbering) cannot bind p85 (Yamanaka 2012), and the motif is identical in mouse. The PMID:30667096
      cache is abstract-only; the curator saw the full text, and the abstract places AFAP1L2 in the PI3K-AKT pathway downstream
      of its tyrosine phosphorylation. Replace with the specific binding term, which the mouse IPI supports directly.'
    proposed_replacement_terms:
    - id: GO:0036312
      label: phosphatidylinositol 3-kinase regulatory subunit binding
    supported_by:
    - reference_id: PMID:30667096
      supporting_text: the PTN-PTPRZ signal stimulates OPC differentiation partly by enhancing the tyrosine phosphorylation
        of AFAP1L2 in order to activate the PI3K-AKT pathway.
    - reference_id: PMID:22496359
      supporting_text: cAMP treatment elevated PI3KAP/XB130 mRNA and protein levels as well as tyrosine phosphorylation and
        interaction with p85 PI3K leading to increased PI3K activities associated with PI3KAP/XB130
    - reference_id: PMID:22496359
      supporting_text: a mutant Y72F incapable of binding to p85 PI3K did not show this response
    - reference_id: PMID:19060924
      supporting_text: We identified tyrosine 54 of XB130 as the major target of RET/PTC-mediated phosphorylation and a critical
        binding site for the SH2 domains of p85alpha.
    - reference_id: file:mouse/Afap1l2/Afap1l2-bioinformatics/RESULTS.md
      supporting_text: Human Tyr54, the p85-docking YxxM tyrosine (Y54-I-Y-M57), aligns to mouse Tyr54
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:30667096
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q62656
  review:
    summary: 'Mouse IPI with the receptor tyrosine phosphatase Ptprz1 (Q62656). AFAP1L2 is a PTPRZ substrate: PTPRZ dephosphorylates
      it at tyrosine residues.'
    action: REMOVE
    reason: 'Generic protein binding is uninformative and is removed under the protein-binding policy. The reported interaction
      is not in doubt: it is an enzyme-substrate contact in which PTPRZ dephosphorylates AFAP1L2. Being the substrate of a
      phosphatase is not a molecular function of AFAP1L2, so no more specific MF replacement (such as phosphatase binding)
      is proposed from this evidence. The substrate relationship is better captured on PTPRZ as an input.'
    supported_by:
    - reference_id: PMID:30667096
      supporting_text: PTPRZ dephosphorylated AFAP1L2 at tyrosine residues in vitro and in HEK293T cells.
