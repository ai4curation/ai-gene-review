id: Q5DTU0
gene_symbol: Afap1l2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Afap1l2 (XB130, PI3KAP) is an intracellular adaptor and actin-crosslinking protein of the AFAP family, highly
  expressed in thyroid follicular cells. The 825-residue canonical isoform has an N-terminal region with proline-rich SH3-binding
  and tyrosine SH2-docking motifs (including the YxxM p85-binding tyrosine Tyr54), two pleckstrin homology domains, a coiled-coil
  region and a C-terminal F-actin-binding segment; a second isoform carries an 18-residue N-terminal extension. The mouse
  protein binds actin filaments directly and, by multimerizing through its N-terminus, crosslinks them. Once tyrosine phosphorylated
  by Src-family kinases it binds the PI3K regulatory subunit p85alpha and couples upstream signals to PI3K-AKT; in oligodendrocyte
  precursors it is a substrate of the phosphatase PTPRZ, and pleiotrophin-induced inhibition of PTPRZ raises its phosphorylation
  and AKT-mTOR activity. By homology with the human and rat orthologs it also binds and activates c-Src and engages SH3-domain
  scaffolds such as Tks5. In thyrocytes it localizes to the apical plasma membrane, and mice lacking it have disorganized
  apical membranes with fewer microvilli, delayed follicle lumen formation, impaired thyroglobulin iodination and release,
  and congenital hypothyroidism.
