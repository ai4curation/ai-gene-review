- term:
    id: GO:0017124
    label: SH3 domain binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N4X5
  - ensembl:ENSP00000303042
  review:
    summary: SH3 domain binding (IEA) from human XB130, whose proline-rich N-terminus binds Src and the fifth SH3 domain of
      Tks5.
    action: ACCEPT
    reason: Mouse Afap1l2 and human AFAP1L2 are 1:1 orthologs in PANTHER subfamily PTHR14338:SF4 (83.5% identity over the
      human length; RESULTS.md), and the IBA node PTN002682769 is placed on that ortholog clade. Human XB130 binds the fifth
      SH3 domain of Tks5 through its PPPxxxP motif, and deleting the N-terminal SH3-binding region impairs Src signaling.
      AFAP1L2 has no SH3 domain itself, so this is the adaptor activity of its motif-rich N-terminus. Inferred for mouse;
      not tested on the mouse protein.
    supported_by:
    - reference_id: PMID:26446840
      supporting_text: XB130 was found to bind specifically to the fifth SH3 domain of Tks5
    - reference_id: PMID:17412687
      supporting_text: XB130DeltaN, an N-terminal deletion mutant lacking a putative SH3-binding motif and several putative
        SH2-binding sites, reduced its ability to mediate Src signal transduction.
