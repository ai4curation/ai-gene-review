- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002682769
  - UniProtKB:Q8N4X5
  review:
    summary: Regulation of mitotic cell cycle (IBA), inferred from human XB130 depletion studies.
    action: KEEP_AS_NON_CORE
    reason: Mouse Afap1l2 and human AFAP1L2 are 1:1 orthologs in PANTHER subfamily PTHR14338:SF4 (83.5% identity over the
      human length; RESULTS.md), and the IBA node PTN002682769 is placed on that ortholog clade. In human cells XB130 depletion
      alters G1/S progression through loss of Src and PI3K-Akt coupling, in three independent studies; the rat ortholog is
      required for cAMP-potentiated IGF-I-induced DNA synthesis. AFAP1L2 acts as an upstream signaling adaptor, not a cell-cycle
      component, so the term is non-core. In mouse, Xb130-/- thyroid shows a high proportion of proliferating cells under
      TSH drive, which is a compensatory phenotype and not evidence for this term; the annotation is inferred, not mouse-experimental.
    supported_by:
    - reference_id: PMID:17412687
      supporting_text: Down-regulation of endogenous XB130 with siRNA reduced c-Src activity, IL-8 production, EGF-induced
        phosphorylation of Akt and GSK3beta, and altered cell cycles in human lung epithelial cells.
    - reference_id: PMID:19060924
      supporting_text: downregulation of XB130 in TPC1 papillary thyroid cancer cells, harboring the RET/PTC1 kinase, strongly
        reduced Akt activity without altering ERK1/2 phosphorylation, and concomitantly inhibited cell-cycle progression and
        survival in suspension
    - reference_id: PMID:26446840
      supporting_text: Down-regulation of XB130 and/or Tks5 results in the accumulation of cells in the G1 (resting) phase
        and a decrease of cells in the DNA synthesis and G2 cell growth phase
