- term:
    id: GO:0051015
    label: actin filament binding
  evidence_type: IDA
  original_reference_id: PMID:27462298
  qualifier: enables
  review:
    action: NEW
    summary: The mouse protein (construct NM_001177796, identical to UniProt isoform Q5DTU0-2) binds F-actin directly through
      a C-terminal segment (construct residues 830-840; canonical 812-822).
    reason: 'Experimentally established on the mouse protein: GST fusions of the C-terminal region co-sediment with F-actin
      in vitro and the same region is required and sufficient for stress-fiber localization in NIH3T3 cells. The segment is
      present in both mouse isoforms. PAINT did not propagate actin filament binding to the AFAP1L2 node (it sits on the AFAP1
      clade), so this is a mouse-specific experimental annotation, not a family inference; the actin-binding region differs
      from the ABD of AFAP1 and AFAP1L1.'
    supported_by:
    - reference_id: PMID:27462298
      supporting_text: the carboxyl terminal region of PI3KAP/XB130 containing amino acid residues 830-840 was required and
        sufficient for localization to F-actin in NIH3T3 cells, and this region is directly bound to F-actin in vitro
    - reference_id: PMID:27462298
      supporting_text: we did not find any colocalization with N-terminal region of PI3KAP/XB130 using a mouse construct
    - reference_id: PMID:27462298
      supporting_text: 'variant 1; GenBank Accession # NM_001177796'
    - reference_id: file:mouse/Afap1l2/Afap1l2-bioinformatics/RESULTS.md
      supporting_text: is identical to UniProt isoform Q5DTU0-2, not to the displayed canonical isoform
    - reference_id: file:mouse/Afap1l2/Afap1l2-bioinformatics/RESULTS.md
      supporting_text: corresponds to residues 812-822 of the canonical isoform Q5DTU0-1
- term:
    id: GO:0051764
    label: actin crosslink formation
  evidence_type: IDA
  original_reference_id: PMID:27462298
  qualifier: involved_in
  review:
    action: NEW
    summary: Recombinant mouse PI3KAP/XB130 crosslinks actin filaments in vitro, requiring both its C-terminal actin-binding
      region and its N-terminal 40-residue multimerization region.
    reason: 'Participation test: the protein itself is the crosslinker. In a low-speed pelleting assay purified mouse XB130
      bundled F-actin, and deletion of either the actin-binding region or the multimerizing N-terminus abolished crosslinking.
      This is direct performance of the process, not a requirement for it. The in vivo context in which crosslinking operates
      (for example the thyrocyte apical cortex) has not been shown directly.'
    supported_by:
    - reference_id: PMID:27462298
      supporting_text: In summary, our data clearly demonstrated that PI3KAP/XB130 crosslinked actin filaments.
    - reference_id: PMID:27462298
      supporting_text: Deletion mutants of PI3KAP/XB130 lacking the actin-binding region or the multimerizing region did not
        crosslink actin filaments, indicating that actin binding and multimerization of PI3KAP/XB130 were necessary to crosslink
        F-actin.
    - reference_id: PMID:27462298
      supporting_text: we did not find any colocalization with N-terminal region of PI3KAP/XB130 using a mouse construct
- term:
    id: GO:0051897
    label: positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction
  evidence_type: IMP
  original_reference_id: PMID:30667096
  qualifier: involved_in
  review:
    action: NEW
    summary: In mouse OPC-like OL1 cells, Afap1l2 knockdown suppresses PTN-induced AKT and mTOR phosphorylation; tyrosine-phosphorylated
      AFAP1L2 couples PTN-PTPRZ signaling to PI3K-AKT.
    reason: 'Participation test: AFAP1L2 contributes the phosphotyrosine docking site that recruits p85 PI3K, so it does part
      of the work of transducing the signal rather than being merely required. In the mouse study its knockdown removed PTN-induced
      AKT activation, and in Ptprz catalytic-dead knock-in brain higher AFAP1L2 phosphorylation accompanied higher AKT/mTOR
      phosphorylation. The same coupling is shown in human (RET/PTC) and rat (cAMP-Src) cells. OL1 is a mouse oligodendrocyte-lineage
      line from the Noda laboratory; the cached abstract does not state its species, which was checked separately (see notes).
      The downstream oligodendrocyte differentiation phenotype is not annotated as process participation.'
    supported_by:
    - reference_id: PMID:30667096
      supporting_text: In OL1 cells, the knockdown of AFAP1L2 or application of a PI3K inhibitor suppressed cell differentiation
        as well as the PTN-induced phosphorylation of AKT and mTOR.
    - reference_id: PMID:30667096
      supporting_text: the PTN-PTPRZ signal stimulates OPC differentiation partly by enhancing the tyrosine phosphorylation
        of AFAP1L2 in order to activate the PI3K-AKT pathway.
    - reference_id: PMID:19060924
      supporting_text: downregulation of XB130 in TPC1 papillary thyroid cancer cells, harboring the RET/PTC1 kinase, strongly
        reduced Akt activity without altering ERK1/2 phosphorylation, and concomitantly inhibited cell-cycle progression and
        survival in suspension
    - reference_id: PMID:22496359
      supporting_text: cAMP treatment elevated PI3KAP/XB130 mRNA and protein levels as well as tyrosine phosphorylation and
        interaction with p85 PI3K leading to increased PI3K activities associated with PI3KAP/XB130
