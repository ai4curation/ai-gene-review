- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: ISO
  original_reference_id: GO_REF:0000119
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q8N4X5
  review:
    summary: Plasma membrane, projected from human. Mouse immunostaining places Afap1l2 specifically at the apical membrane
      of thyroid follicular cells.
    action: MODIFY
    reason: 'The membrane association is correct, but mouse has direct, more specific evidence: in wild-type mouse thyroid
      at postnatal week 2 and at E18.5, XB130 is mainly at the apical membrane of thyrocytes, and its loss disorganizes that
      membrane (fewer microvilli, less apical ezrin and TPO). Replace the general term with apical plasma membrane, which
      is experimentally established in this species (immunofluorescence, PMID:34470464).'
    proposed_replacement_terms:
    - id: GO:0016324
      label: apical plasma membrane
    supported_by:
    - reference_id: PMID:34470464
      supporting_text: At PW2, XB130 is mainly located at the apical membrane of thyrocytes
    - reference_id: PMID:34470464
      supporting_text: XB130 was found mainly on the apical membrane of thyroid follicles.
    - reference_id: PMID:34470464
      supporting_text: Thus, XB130 deficiency results in disorganization of the apical structure of thyrocytes.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q8N4X5
        source_label: human AFAP1L2
        source_status: SUPPORTS_TRANSFER
        comment: Membrane association transfers, but mouse immunofluorescence resolves it to the apical plasma membrane of
          thyrocytes.
- term:
    id: GO:0006954
    label: inflammatory response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002682769
  - UniProtKB:Q8N4X5
  review:
    summary: Inflammatory response (IBA), ultimately from a human IDA in which XB130 siRNA reduced IL-8/IL-6 output from a
      lung epithelial line.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only experimental source is a reduction in cytokine output from one cultured human epithelial line after XB130
      knockdown (Xu 2007). That is a downstream signaling readout, not evidence that the adaptor does any of the work of an
      organismal inflammatory response. No mouse inflammation phenotype has been reported for Xb130-/- mice in the literature
      cached here; the knockout study reports a thyroid, not an inflammatory, phenotype. Node placement on the 1:1 ortholog
      clade is not disputed; the scope of the term is. Kept, consistent with the human review, but flagged.
    supported_by:
    - reference_id: PMID:17412687
      supporting_text: Down-regulation of endogenous XB130 with siRNA reduced c-Src activity, IL-8 production, EGF-induced
        phosphorylation of Akt and GSK3beta, and altered cell cycles in human lung epithelial cells.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002682769
        source_status: SUPPORTS_TRANSFER
        comment: Node placement on the AFAP1L2 1:1 ortholog clade is sound; mouse is inside it. The problem is the scope of
          the seeded term.
      - source_id: UniProtKB:Q8N4X5
        source_label: human AFAP1L2
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The human IDA rests on a cytokine-output readout in one human epithelial line; the term claims more than
          that evidence shows.
