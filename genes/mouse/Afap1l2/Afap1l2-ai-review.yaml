- term:
    id: GO:0045893
    label: positive regulation of DNA-templated transcription
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002682769
  - UniProtKB:Q8N4X5
  review:
    summary: Positive regulation of DNA-templated transcription (IBA), from SRE/AP-1 reporter gain in human HEK293 cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: AFAP1L2 is a cytoplasmic and cortical adaptor with no DNA-binding domain or nuclear role. Reporter activation
      is a distal readout of its Src-activating activity, many steps upstream of the transcription factors. The Src activator
      MF and PI3K-Akt signaling terms describe the actual contribution. Consistent with the human review.
    supported_by:
    - reference_id: PMID:17412687
      supporting_text: XB130 expression in HEK293 cells enhanced serum response element- and AP-1-dependent transcriptional
        activation mediated by c-Src.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002682769
        source_status: SUPPORTS_TRANSFER
        comment: Node placement on the AFAP1L2 1:1 ortholog clade is sound; mouse is inside it. The problem is the scope of
          the seeded term.
      - source_id: UniProtKB:Q8N4X5
        source_label: human AFAP1L2
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The human IDA rests on an SRE/AP-1 reporter readout in HEK293 cells; the term claims more than that evidence
          shows.
