- term:
    id: GO:0042169
    label: SH2 domain binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N4X5
  - ensembl:ENSP00000303042
  review:
    summary: 'SH2 domain binding (IEA): phosphorylated Tyr54 of AFAP1L2 docks the SH2 domains of p85alpha.'
    action: ACCEPT
    reason: Mouse Afap1l2 and human AFAP1L2 are 1:1 orthologs in PANTHER subfamily PTHR14338:SF4 (83.5% identity over the
      human length; RESULTS.md), and the IBA node PTN002682769 is placed on that ortholog clade. Human Tyr54 is the RET/PTC
      phosphorylation site that binds the p85alpha SH2 domains; the rat ortholog's equivalent tyrosine (Y72 in the long isoform)
      is needed for p85 binding; and the YxxM motif (SSSDEEYIYMNKV) is identical in mouse. The mouse IPI with p85alpha (PMID:30667096)
      supports this directly. The more specific PI3K regulatory subunit binding is proposed as the replacement for the mouse
      IPI protein-binding row.
    supported_by:
    - reference_id: PMID:19060924
      supporting_text: We identified tyrosine 54 of XB130 as the major target of RET/PTC-mediated phosphorylation and a critical
        binding site for the SH2 domains of p85alpha.
    - reference_id: PMID:22496359
      supporting_text: a mutant Y72F incapable of binding to p85 PI3K did not show this response
    - reference_id: file:mouse/Afap1l2/Afap1l2-bioinformatics/RESULTS.md
      supporting_text: Human Tyr54, the p85-docking YxxM tyrosine (Y54-I-Y-M57), aligns to mouse Tyr54
