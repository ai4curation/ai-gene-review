- term:
    id: GO:1990748
    label: cellular detoxification
  evidence_type: IMP
  original_reference_id: PMID:30626647
  qualifier: involved_in
  review:
    summary: The conserved G6PC3/SLC37A4 system clears the hexokinase inhibitor 1,5AG6P.
    action: NEW
    reason: PMID:30626647 shows that human G6PC3 and SLC37A4 collaborate to dephosphorylate
      1,5-anhydroglucitol 6-phosphate, that G6PC3- or SLC37A4-deficient cells accumulate this
      hexokinase inhibitor, and that 1,5AG exposure drives 1,5AG6P accumulation and death in
      G6PC3-deficient mouse neutrophils. Mouse G6pc3 is therefore inferred to do the same
      detoxifying chemical work; Slc37a4 supplies the separate ER transport step.
    supported_by:
    - reference_id: PMID:30626647
      supporting_text: G6PC3 and G6PT collaborate to dephosphorylate 1,5AG6P
