- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0031463
  - MGI:MGI:1915651
  - MGI:MGI:95607
  - PANTHER:PTN000971890
  - RGD:2644
  - RGD:727875
  - UniProtKB:P35575
  review:
    summary: The astrocyte glucose-production evidence supports only a secondary gluconeogenesis
      context.
    action: KEEP_AS_NON_CORE
    reason: 'The G6pc3/G6PT complex can make glucose locally in astrocytes, and the PTHR12591 gluconeogenesis
      IBD is seeded by mouse G6pc3 itself, so this row is not simply a G6pc1-to-G6pc3 homology artifact.
      The accessible evidence does not show that G6pc3 carries systemic gluconeogenic flux like G6pc1:
      G6pc3-null mice retain blood glucose and hepatic glycogen control, while later work favors 1,5AG6P
      clearance as the principal conserved role in neutrophils. Keep gluconeogenesis as non-core local
      glucose production.'
    supported_by:
    - reference_id: PMID:15661744
      supporting_text: suggesting that astrocytes may provide an endogenous source of brain glucose
    - reference_id: PMID:17023421
      supporting_text: G6Pase is the major glucose-6-phosphatase of physiological importance for
        glucose homeostasis in vivo
    - reference_id: PMID:30626647
