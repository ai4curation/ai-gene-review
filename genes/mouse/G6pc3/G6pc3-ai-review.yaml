core_functions:
- description: Hydrolyzes 1,5-anhydroglucitol 6-phosphate in the endoplasmic reticulum, preventing
    accumulation of a hexokinase inhibitor that blocks glucose utilization and kills G6pc3-deficient
    neutrophils. The reaction is best established with human G6PC3, and mouse G6pc3-deficient
    neutrophils show the same 1,5AG-dependent toxic-metabolite phenotype.
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  directly_involved_in:
  - id: GO:1990748
    label: cellular detoxification
  proposed_molecular_function: 1,5-anhydro-D-glucitol-6-phosphate phosphatase activity
  supported_by:
  - reference_id: PMID:30626647
    supporting_text: G6PC3 and G6PT collaborate to dephosphorylate 1,5AG6P
- description: Hydrolyzes glucose 6-phosphate to glucose and inorganic phosphate at the ER luminal
    catalytic site. Mouse astrocyte and knockout evidence establishes this conserved molecular
    activity, but G6P hydrolysis appears secondary to 1,5AG6P clearance for G6pc3 physiology.
  molecular_function:
    id: GO:0004346
    label: glucose-6-phosphatase activity
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:15661744
  - reference_id: PMID:17023421
  - reference_id: PMID:30626647
suggested_questions:
- question: How much net glucose production is catalyzed by G6pc3 in astrocytes, skeletal muscle and
    other mouse tissues after separating glucose-6-phosphate recycling from gluconeogenic flux?
- question: Which non-neutrophil phenotypes of G6pc3 deficiency are caused by 1,5AG6P accumulation
    and which reflect other ER phosphate-ester substrates?
suggested_experiments:
- hypothesis: G6pc3-dependent glucose 6-phosphate hydrolysis is a local recycling route rather than
    a major net gluconeogenic flux.
  description: Use isotope tracing in primary mouse astrocytes or myotubes from wild-type,
    G6pc3-null and catalytically rescued cells to quantify noncarbohydrate carbon incorporation into
    free glucose while controlling Slc37a4 activity and 1,5-anhydroglucitol exposure.
proposed_new_terms:
- proposed_name: 1,5-anhydro-D-glucitol-6-phosphate phosphatase activity
  proposed_definition: 'Catalysis of the reaction: 1,5-anhydro-D-glucitol 6-phosphate + H2O = 1,5-anhydro-D-glucitol
    + phosphate.'
  proposed_parent:
    id: GO:0016791
    label: phosphatase activity
  justification: Specifies the toxic-metabolite dephosphorylation carried by the conserved
    G6PC3/SLC37A4 ER system; broader sugar-phosphatase terms do not name this physiological
    substrate.
  supported_by:
  - reference_id: PMID:30626647
