id: Q6NSQ9
gene_symbol: G6pc3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'G6pc3 encodes the broadly expressed glucose-6-phosphatase catalytic subunit 3, a multipass
  endoplasmic-reticulum membrane phosphatase that can hydrolyze glucose 6-phosphate in the ER lumen and
  can couple with Slc37a4 to make glucose locally. Unlike the liver/kidney/intestine G6pc1 isoform, G6pc3
  is not the principal enzyme for systemic fasting glucose production; G6pc3-deficient mice retain blood
  glucose control but have reduced brain G6Pase activity and neutrophil dysfunction. Human and mouse evidence
  supports a conserved role for the G6PC3/SLC37A4 system in clearing the toxic hexokinase by-product 1,5-anhydroglucitol
  6-phosphate from the ER.'
