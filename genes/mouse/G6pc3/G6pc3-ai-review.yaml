  review:
    summary: Mouse G6pc3 hydrolyzes glucose 6-phosphate in the ER.
    action: ACCEPT
    reason: PMID:15661744 reports G6pc3/Glc-6-Pase-beta activity in mouse astrocytes and coupling
      with Slc37a4 to form an active G6Pase complex. G6pc3-null mice have about half the normal
      brain G6P hydrolytic activity, and `just paint-losses mouse G6pc3` reports no IRD or IKR that
      would block the PTHR12591 activity transfer. The in-vivo physiological substrate priority
      remains qualified by later 1,5AG6P work, but glucose-6-phosphate hydrolysis is a real
      molecular capability.
    supported_by:
    - reference_id: PMID:15661744
      supporting_text: astrocytes, the main reservoir of brain glycogen, express both the
