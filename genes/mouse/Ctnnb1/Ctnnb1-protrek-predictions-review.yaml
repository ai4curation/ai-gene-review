description: >-
  ProTrek sequence-to-text retrieval for mouse beta-catenin. Three of the five calls are exact GOA
  matches, and the list divides cleanly along beta-catenin's two core roles: rank 1 names a destruction-complex-associated
  assembly and ranks 2 and 4 name catenin-family binding partners at adherens junctions. Neither core
  molecular function this review assigns - cadherin binding and transcription coactivator activity
  - is retrieved directly, and one call is obsolete while another is an experimental-compound response.
  Assessment: 1 correct novel (COR), 2 correct not novel (CNN).
