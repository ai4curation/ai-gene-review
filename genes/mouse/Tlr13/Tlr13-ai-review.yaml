suggested_questions:
- question: Is the vesicular stomatitis virus response a genuine function of this receptor, or
    a consequence of viral single-stranded RNA happening to fold like the rRNA ligand? The structural
    work shows a viral-derived 16-nucleotide RNA can activate the receptor, which would make the
    virus response a special case of RNA recognition rather than a separate viral-sensing activity.
- question: Which human receptor, if any, senses bacterial 23S rRNA? UniProt suggests a different
    human rRNA-sensing receptor may exist; establishing it would determine whether this gene's
    function has a human counterpart to which annotations could be related, or is genuinely rodent-specific.
- question: Should GO acquire a term for recognition of ribosomal RNA as a pathogen-associated
    pattern, more specific than GO:0019843 rRNA binding? The existing term is shared with ribosome-assembly
    and RNA-processing proteins, and nothing in it conveys that the binding is an immune recognition
    event.
- question: Does the receptor sense rRNA from the host as well as from bacteria? The recognised
    sequence is described as conserved, so the discrimination between bacterial and host ribosomal
    RNA, and the role of compartmentalisation in it, is worth establishing explicitly.
suggested_experiments:
- description: Test the specificity of the receptor against a panel of natural ribosomal RNAs
    and their modified variants, comparing bacterial 23S rRNA, host 28S rRNA and synthetic oligoribonucleotides
    carrying each known resistance modification, in cells expressing the receptor and in primary
    macrophages from knockout animals.
  hypothesis: Recognition depends on a bacterium-specific sequence and conformation rather than
    on ribosomal RNA in general, which is what keeps host RNA from triggering the receptor.
  experiment_type: ligand specificity assay
- description: Determine whether the reported vesicular stomatitis virus response requires viral
    single-stranded RNA of the stem-loop fold identified structurally, by testing defined viral
    RNA fragments and fold-disrupting substitutions for receptor activation, in parallel with
    infection of cells lacking the receptor.
  hypothesis: The virus response is RNA-fold-dependent recognition rather than a distinct antiviral
    sensing function, which would settle whether GO:0009615 belongs on this gene at all.
  experiment_type: structure-guided ligand mapping
- description: Test whether epidemiologically relevant macrolide-resistant clinical isolates evade
    this receptor in vivo, by infecting wild-type and receptor-deficient animals with isogenic
    resistant and sensitive strain pairs and measuring early cytokine induction and bacterial
    burden.
  hypothesis: The methylation that confers antibiotic resistance also confers immune evasion,
    so the receptor's contribution to control of infection should disappear with resistant strains.
  experiment_type: in vivo infection with isogenic strain pairs
