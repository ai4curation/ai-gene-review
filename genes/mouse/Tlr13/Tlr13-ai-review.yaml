gene_symbol: Tlr13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Endosomal Toll-like receptor of rodents, with no counterpart in the human genome,
  that senses bacterial ribosomal RNA. Its leucine-rich-repeat ectodomain binds a short, conserved
  single-stranded sequence of bacterial 23S rRNA, recognising it in a sequence- and conformation-specific
  manner: in the complex the RNA adopts a stem-loop-like fold quite different from its conformation
  within the ribosome, and binding drives receptor dimerisation. The recognised site is the binding
  site of macrolide, lincosamide and streptogramin antibiotics, so the methylation that confers
  erythromycin resistance in bacteria also abolishes detection by this receptor, linking antibiotic
  resistance to immune evasion. The receptor is expressed mainly in spleen, dendritic cells and
  macrophages, reaches its endosomal compartment with the trafficking factor UNC93B1, which it
  binds directly, and signals through its cytoplasmic TIR domain via MyD88 and TAK1 to activate
  NF-kappa-B, with type I interferon induction through IRF7. A single-stranded RNA of viral origin
  predicted to fold like the rRNA ligand can also activate it, and an early report of a response
  to vesicular stomatitis virus remains less well substantiated than the bacterial RNA recognition.'
