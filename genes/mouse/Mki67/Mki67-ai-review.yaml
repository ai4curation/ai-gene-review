id: E9PVX6
gene_symbol: Mki67
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mki67 encodes Ki-67, a very large (3177 aa) intrinsically disordered nuclear protein built from an
  N-terminal FHA domain, a protein phosphatase 1-binding motif, a long array of tandem Ki-67 repeats and a basic,
  DNA-binding C-terminal region. It is expressed in cycling cells, which made it the standard histological marker
  of proliferation, but genetic loss of function in mouse shows it is not required for proliferation, development
  or fertility. In interphase Ki-67 is bound to chromatin around nucleoli and at centromeric heterochromatin and
  helps organise and compact heterochromatin. At the onset of mitosis it moves to the surface of the condensed chromosomes,
  where it organises the perichromosomal layer and forms an extended, highly charged brush that acts as a biological
  surfactant, keeping chromosomes individualised after nuclear envelope breakdown so they can move independently
  on the spindle. At mitotic exit, dephosphorylation (PP1, PP2A-B55) converts the coat into an RNA-dependent liquid-like
  condensate that clusters the segregated chromosomes and excludes cytoplasm from the reforming nucleus.
