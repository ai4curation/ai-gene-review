  review:
    summary: Ki-67 colocalises with centric and pericentric heterochromatin in zygotene/pachytene meiocytes and
      again in early spermatids.
    action: KEEP_AS_NON_CORE
    reason: Direct immunolocalisation in mouse gonads places Ki-67 at centromeric heterochromatin in some cell-cycle
      stages; this matches its association with satellite DNA in interphase. The centromeric region is a stage-specific
      location, not where its mitotic surfactant role acts (the perichromosomal layer). Abstract only; the abstract
      states the observation directly.
