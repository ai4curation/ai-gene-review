core_functions:
- description: On the surface of condensed mitotic chromosomes Ki-67 forms an extended, highly charged brush that
    acts as a biological surfactant, a steric and electrostatic barrier that keeps chromosomes individualised after
    nuclear envelope breakdown so they move independently on the spindle.
  proposed_molecular_function: chromosome surfactant activity
  directly_involved_in:
  - id: GO:0007059
    label: chromosome segregation
  locations:
  - id: GO:0000793
    label: condensed chromosome
  supported_by:
  - *id017
  - &id021
    reference_id: PMID:27362226
    supporting_text: This suggests that Ki-67 forms a steric and electrostatic charge barrier, similar to surface-active
      agents (surfactants) that disperse particles or phase-separated liquid droplets in solvents.
  - *id018
- description: At mitotic exit, dephosphorylated Ki-67 forms an RNA-dependent liquid-like condensed phase on the
    chromosome surface that clusters the segregated chromosomes and excludes large cytoplasmic particles from the
    reforming nucleus.
  molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
  directly_involved_in:
  - id: GO:0007059
    label: chromosome segregation
  locations:
  - id: GO:0000793
    label: condensed chromosome
  supported_by:
  - *id019
  - *id015
  - *id020
proposed_new_terms:
- proposed_name: chromosome surfactant activity
  proposed_definition: A molecular function in which a protein coats the surface of chromosomes with an extended,
    highly charged polymer brush that forms a steric and electrostatic barrier, preventing neighbouring chromosomes
    from adhering and coalescing.
  justification: 'Ki-67''s main mitotic activity is neither binding nor catalysis: it is a surface-active barrier
    that disperses chromosomes, analogous to a polymeric surfactant. No GO term describes this; GO:0019214 surfactant
    activity is obsolete.'
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  supported_by:
  - *id021
  - *id017
suggested_questions:
- question: Should MGI rows that convert Ki-67 immunostaining used as a proliferation marker into Ki-67 process
    annotations (cell population proliferation and its cell-type children) be systematically removed, given the
    NOT annotation from PMID:26949251?
- question: Does Ki-67 regulate heterochromatin organisation directly (via its chromatin-binding C-terminus and
    PP1 recruitment) or as a downstream consequence of its mitotic chromosome-periphery role?
- question: Is GO:0007059 chromosome segregation the best home for the chromosome individualisation and clustering
    roles, or does GO need a dedicated mitotic chromosome individualization process term?
suggested_experiments:
- hypothesis: Ki-67 surfactant function is required for faithful chromosome segregation in vivo.
  description: Use a complete Mki67 deletion allele (Sobecki et al. noted residual expression after ATG deletion)
    and live imaging of mitoses in mouse tissues to quantify chromosome coalescence, segregation errors and micronuclei,
    with rescue by charge-matched truncation mutants.
  experiment_type: genetic loss-of-function with live-cell imaging
