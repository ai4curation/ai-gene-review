  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1919787
  - PANTHER:PTN001091477
  - UniProtKB:P46013
  review:
    summary: 'Chromosome segregation: Ki-67 keeps mitotic chromosomes individualised after nuclear envelope breakdown
      so they can move independently on the spindle.'
    action: ACCEPT
    reason: Ki-67 depletion makes chromosomes collapse into a single mass after NEBD in human cells and in mouse
      embryonic stem cells, impairing independent chromosome motility and spindle interactions; at mitotic exit
      Ki-67 clusters segregated chromosomes. Ki-67 itself provides the surfactant barrier, so it does part of the
      work of segregation rather than merely being required for it.
    supported_by: &id008
    - &id018
      reference_id: PMID:27362226
      supporting_text: We imaged mitosis in HeLa, non-cancer hTERT-RPE1 cells, and mouse embryonic stem cells depleted
        of Ki-67.
    - &id017
      reference_id: PMID:27362226
      supporting_text: prevents chromosomes from collapsing into a single chromatin mass after nuclear envelope
        disassembly, thus enabling independent chromosome motility and efficient interactions with the mitotic spindle
    - &id009
      reference_id: PMID:27362226
      supporting_text: Hence, Ki-67 is not required for the initial chromosome individualization and condensation
        during prophase, but for the maintenance of spatial separation after nuclear envelope breakdown.
