      record_section: ["CC:CAUTION"]
      supporting_text: Was thought to play a key role in cell proliferation, and is commonly used as a marker of
        cell proliferation. However, its primary function is uncoupled from cell proliferation
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: MGI
      requested_change: CHECK
      asserted_value: MGI:MGI:106035
