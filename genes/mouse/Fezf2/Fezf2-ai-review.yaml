  knowledge_gaps:
  - gap_statement: >-
      Whether FEZF2 controls Cdh22 transcription directly, by binding the Cdh22 regulatory region, or
      indirectly through intermediate factors, is undetermined.
    boundary: >-
      FEZF2 is established as necessary and sufficient for activity-dependent Cdh22 upregulation in L5
      ET neurons (shFezf2 abolishes it; Fezf2 overexpression raises Cdh22), and activity promotes FOS
      binding to intronic regions of the Cdh22 locus; direct FEZF2 occupancy at Cdh22 has not been shown.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Does FEZF2 bind the Cdh22 regulatory region directly, or does it control Cdh22 expression indirectly
    through other transcription factors?
- question: >-
    Through which adhesive partner does CDH22 act at PV+ perisomatic synapses - homophilic CDH22-CDH22
    or heterophilic pairing (e.g. with Cdh7 in PV basket cells)?
- question: >-
    Is the postnatal, activity-dependent repurposing of a selector gene to control inhibitory wiring unique
    to FEZF2/ET neurons, or a general strategy used by other cell-type-specific selector genes?
suggested_experiments:
- description: >-
    FEZF2 ChIP-seq (or CUT&RUN) in postnatal L5 ET neurons to test for direct binding at the Cdh22 locus,
    complemented by promoter/enhancer reporter and deletion assays.
- description: >-
    Cell-type-specific, temporally controlled Cdh22 and Fezf2 perturbations with paired recordings and
    PV+ (Syt2+) bouton quantification to dissect formation versus maintenance of perisomatic inhibition.
