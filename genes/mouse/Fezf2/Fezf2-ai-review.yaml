id: Q9ESP5
gene_symbol: Fezf2
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mouse Fezf2 (Fez family zinc finger protein 2; also Fezl, Zfp312) encodes a forebrain-restricted C2H2
  zinc-finger transcription factor that acts in the nucleus as a sequence-specific, RNA polymerase II
  DNA-binding factor with both activator and repressor activity. During embryonic development it is the
  selector (identity) gene for layer 5 extratelencephalic (subcerebral / corticospinal) projection neurons
  of the cerebral cortex: it specifies their neurotransmitter identity and long-range subcortical connectivity,
  in part by repressing alternative (callosal/corticothalamic) programs and genes such as Hes5, and it
  contributes to broader forebrain patterning, cortical and hippocampal (dentate gyrus) development, neuronal
  differentiation and axon guidance. Layer 5 identity established by Fezf2 in turn shapes the local circuit,
  including the laminar distribution of GABAergic interneurons. Fezf2 continues to be expressed in these
  neurons after birth and into adulthood, where its expression level is controlled by neuronal activity
  specifically in layer 5 extratelencephalic cells. In this postnatal role it behaves as a late-response
  gene downstream of immediate-early genes (its promoter carries AP-1/FOS-JUN and EGR1 sites and is bound
  by c-Fos), and it transcriptionally controls the cell-surface molecule Cadherin-22 (Cdh22) to set the
  number of perisomatic inhibitory synapses that parvalbumin-expressing basket interneurons form onto
  these pyramidal cells, thereby tuning their excitation/inhibition balance.
