- term:
    id: GO:1905704
    label: positive regulation of inhibitory synapse assembly
  evidence_type: IMP
  original_reference_id: DOI:10.1038/s41593-026-02515-6
  qualifier: acts_upstream_of_or_within
  review:
    action: NEW
    summary: >-
      Postnatally, FEZF2 positively regulates the number of parvalbumin-interneuron perisomatic inhibitory
      synapses onto layer-5 ET pyramidal cells, acting upstream through transcriptional control of the
      cadherin Cdh22, in an activity-dependent manner (Kroon et al. 2026).
    reason: >-
      New function not in GOA. shRNA knockdown of Fezf2 in L5 ET neurons reduces inhibitory synaptic input
      (mIPSC frequency -45%) and the density of PV+ (Syt2+) perisomatic boutons (-18%), with shRNA-resistant
      rescue; late (post-formation) knockdown also reduces bouton density, showing a role in maintenance
      as well as formation. FEZF2 is a nuclear transcription factor, so it does not itself build the synapse:
      it acts upstream via the cell-surface effector Cadherin-22 (Cdh22), whose expression it controls.
      The qualifier is therefore acts_upstream_of_or_within, and the mechanism (FEZF2 -> Cdh22 transcription
      -> PV perisomatic synapse) is captured in core_functions and in the dedicated module/GO-CAM. The
      positive direction is set by the loss-of-function (fewer synapses) and gain-of-function/activity
      data.
    supported_by:
    - reference_id: DOI:10.1038/s41593-026-02515-6
      supporting_text: >-
        Activity-dependent FEZF2 controls the number of inhibitory synapses

        formed by parvalbumin-expressing interneurons through regulation of the

        cell-surface protein Cadherin-22.
    - reference_id: DOI:10.1038/s41593-026-02515-6
      supporting_text: >-
        FEZF2 is an activity-dependent,

        cell-type-specific transcription factor that regulates the formation and

        maintenance of PV+ perisomatic synapses onto L5 ET pyramidal cells.
