  review:
    summary: >-
      Fezf2 binds transcription cis-regulatory regions; true for mouse (ChIP, Lodato 2014) but the cited
      reference is a Drosophila Earmuff study.
    action: ACCEPT
    reason: >-
      The molecular claim (binding of cis-regulatory regions) is a genuine, core property of mouse Fezf2,
      independently supported by ChIP-seq of corticospinal neurons (PMID:24997765) and reporter assays
