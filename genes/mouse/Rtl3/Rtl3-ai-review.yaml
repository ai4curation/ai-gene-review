suggested_questions:
- question: >-
    Does mouse Rtl3 express a CA-PR fusion protein via programmed -1 frameshifting, and if
    so does the protease region have any activity or is it a structural relic?
- question: >-
    What nucleic-acid or transcriptional targets does Rtl3/Zcchc5 engage to limit muscle
    satellite-cell self-renewal?
suggested_experiments:
- hypothesis: >-
    Rtl3/Zcchc5 acts as a nuclear gene-regulatory factor that limits satellite-cell
    self-renewal.
  description: >-
    Generate Rtl3 loss- and gain-of-function in myogenic progenitors / satellite cells and
    measure self-renewal, differentiation, and transcriptome; map DNA/RNA targets by
    ChIP-seq/CLIP-seq on tagged Rtl3.
- hypothesis: >-
    The -1 frameshift CA-PR fusion predicted for mouse Rtl3 is expressed.
  description: >-
    Use ribosome profiling and mass spectrometry to test for the frameshift product and
    characterise its localisation and any residual protease activity.
