description: >-
  Rtl3 (retrotransposon Gag-like protein 3; also Zcchc5, Mar3/Mart3) is the mouse
  ortholog of human RTL3, an X-linked eutherian gene domesticated from the gag region
  of a Ty3/gypsy sushi-ichi-related LTR retrotransposon. The 553-residue protein has a
  large disordered N-terminal region, a retroviral capsid (CA)-like domain and a
  C-terminal CCHC-type zinc knuckle (C-x2-C-x4-H-x4-C) of the nucleocapsid type. In
  mouse and many other mammals the ancestral aspartyl-protease region is retained in the
  -1 reading frame overlapping the gag ORF, so Rtl3 likely encodes a CA-PR fusion via a
  programmed ribosomal frameshift; the reviewed UniProt entry corresponds to the gag
  (CA-NC) product. Rtl3 is a nuclear protein with a CCHC DNA-binding motif and functions
  as a transcriptional/gene-regulatory factor. It is expressed in embryonic myogenic
  progenitor cells, and its overexpression restrains muscle satellite-cell self-renewal;
  the human ortholog regulates the chondrogenic SOX9->COL2A1 program. Direct nucleic-acid
  targets of the mouse protein have not been defined.
