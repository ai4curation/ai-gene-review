- id: PMID:8176201
  title: Differential expression of ZAP-70 and Syk protein tyrosine kinases, and the role of this family
    of protein tyrosine kinases in TCR signaling.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The mouse TCR-complex claim is retained as conditional orthology-supported association;
      endogenous expression/developmental overlap with Zap70 does not make Syk a constitutive receptor
      subunit. PMID:8176201 explicitly reports stimulation-dependent SYK association with TCR complexes,
      including heterologous phosphorylated zeta-chain reconstitution. Retain this conditional receptor-associated
      pool; SYK is not a constitutive structural component of the antigen-binding TCR and is not interchangeable
      with ZAP70 in every developmental stage. The preserved original source is PMID:8176201.
- id: PMID:9314552
  title: A critical role for Syk in signal transduction and phagocytosis mediated by Fcgamma receptors
    on macrophages.
  findings:
  - statement: Native Syk-deficient mouse macrophages lose Fc-gamma-triggered substrate phosphorylation
      and particle internalization, distinguishing a catalytic receptor-signaling role from a general
      defect in all uptake.
    supporting_text: Macrophages derived from Syk-deficient (Syk-) mice were defective in phagocytosis
      of particles bound by FcgammaRs
  - statement: Native mouse macrophage Fc-gamma signaling activates Syk downstream of Src-family kinases;
      this establishes pathway participation beyond particle-uptake necessity.
    supporting_text: We found that FcγR-mediated Syk activation was impaired in Hck−/Fgr−/Lyn− macrophages.
      This observation provides additional strong evidence for a model of sequential activation of Src
      family and Syk tyrosine kinases by the FcγRs.
  - statement: The study explicitly leaves catalytic versus adaptor contributions to the phagocytic defect
      unresolved.
    supporting_text: Alternatively, the physical association of Syk with phosphorylated receptor tails
      may allow it to serve an adaptor-type function at cross-linked receptors to allow recruitment of
      other important proteins to the site of particle binding.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full source distinguishes native mouse macrophage genetics from preceding human-Syk/COS
      reconstitution; Fc-gamma signaling and latex/bacterial uptake have distinct results.
