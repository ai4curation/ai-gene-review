      to Syk.
- id: PMID:34634301
  title: Tyrosine phosphorylation of DEPTOR functions as a molecular switch to activate mTOR signaling.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The older human donor transfer names a cellular nutrient-level response, but the current
      donor trace does not recover its experimental source. The inspected stress-granule study uses arsenite/MG132,
      the macrophage study uses oxidized LDL, and the DEPTOR study tests ephrin/mTOR signaling; none alone
      establishes a specific nutrient-concentration stimulus. Preserve this claim as unresolved rather
      than turn general metabolic signaling into a verified nutrient assay. Full human donor PMID:34634301
      demonstrates SYK-dependent DEPTOR Tyr289 phosphorylation and activation of mTORC1/2 in an ephrin-receptor
      context. Retain conserved mouse TORC1 participation/positive regulation as a contextual inference,
      supported independently by mouse tauopathy pharmacology in PMID:31324720. This does not settle a
      negative TORC1 branch in another condition. The exact experimental source behind the older human-to-mouse
      negative-TORC1 transfer is not recovered by the current donor trace. Direct DEPTOR/ephrin and Tau
      studies establish a positive mTOR signaling branch, but an opposite sign in another condition is
      possible. Retain unresolved negative regulation rather than declare it false solely because the
      better-characterized context has the opposite sign.
- id: PMID:14656219
  title: Glycoproteins VI and Ib-IX-V stimulate tyrosine phosphorylation of tyrosine kinase Syk and phospholipase
    Cgamma2 at distinct sites.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse phospholipase binding is independently supported by native platelet GST-SH2 pull-downs
      in PMID:27609517, with PLCgamma2 binding weaker than PLCgamma1. SYK associates with PLCgamma proteins
      through phosphorylation-dependent interfaces, directly supported by PLCgamma domain pull-downs and
      phosphorylation assays. The original microglial paper’s accessible portions do not resolve an isolated
      SYK–PLCG2 binding assay, but independent platelet experiments support the general phospholipase-binding
      claim. PLCgamma2 binding is weaker than PLCgamma1 in the tested platelet lysates and is not equated
      with equal catalytic efficiency. The preserved original source is PMID:14656219.
- id: PMID:32514138
  title: Alzheimer's-associated PLCγ2 is a signaling node required for both TREM2 function and the inflammatory
    response in human microglia.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
