- id: PMID:17086186
  title: Integrin signaling in neutrophils and macrophages uses adaptors containing immunoreceptor tyrosine-based
    activation motifs.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full PMID:17086186 uses native mouse integrin-triggered cells and Syk/DAP12 mutants
      to establish the requirement for Syk SH2 recognition of phosphorylated ITAM adaptors DAP12 and FcRgamma.
      Refine each preserved bare-binding partner to phosphotyrosine residue binding; no change is made
      to the original partner payloads. The broad receptor/intracellular-signaling process remains appropriate
      for Syk’s experimentally established BCR, Fc-receptor, lectin and integrin contexts. Original mouse
      BCR reconstitution, mast-cell genetics and lectin-receptor studies supply distinct mechanisms; selecting
      only BCR as a replacement would discard supported non-BCR signaling. Syk is recruited peripherally
      to phosphorylated membrane-receptor signaling chains, supported by native mouse receptor studies
      and ITAM/SH2 binding. The PTN002521457 localization assertion is not a claim of integral membrane
      topology or exclusive membrane residence. PMID:17086186 directly uses mouse myeloid-cell loss and
      reconstitution to establish ITAM-dependent integrin activation of macrophages and neutrophils. Retain
      these native cell-type outputs outside the molecular kinase core; the IBA target’s own experimental
      grounding is not circular evidence. Syk directly transmits multiple immune receptor signals in mouse.
      Native Dectin1-dependent cytokine signaling and integrin-dependent antimicrobial responses support
      innate/immune-system participation beyond B-cell signaling. The broad process remains useful across
      distinct receptor mechanisms. Native mouse integrin signaling requires Syk downstream of Src and
      ITAM adaptors, with direct substrate phosphorylation and deficient-cell reconstitution. Platelet
      alphaIIbbeta3 and myeloid beta2-integrin contexts are supported separately.
