- id: PMID:15845454
  title: Syk-dependent cytokine induction by Dectin-1 reveals a novel pattern recognition pathway for
    C type lectins.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID:15845454 directly links phosphorylated Dectin1 cytoplasmic tyrosine to Syk recruitment
      and cytokine signaling. Refine the bare binding term to phosphotyrosine residue binding, with the
      single receptor hemITAM distinguished from tandem-ITAM signaling chains. Syk directly transmits
      multiple immune receptor signals in mouse. Native Dectin1-dependent cytokine signaling and integrin-dependent
      antimicrobial responses support innate/immune-system participation beyond B-cell signaling. The
      broad process remains useful across distinct receptor mechanisms. Native mouse Dectin1 evidence
      independently supports the cell-surface pattern-recognition receptor signaling claim. SYK transmits
      signals from stimulatory C-type lectin receptors through phosphorylated receptor/adaptor motifs
      to downstream enzymes. Human dendritic-cell inhibitor experiments in PMID:19358895 and native mouse
      Dectin-1 studies independently support the catalytic signaling role. The BCR is not its only receptor
      context. The preserved original source is PMID:19358895. Native mouse Syk-deficient dendritic cells
      fail to produce IL10 after Dectin1/yeast stimulation in PMID:15845454, independently grounding the
      human-to-mouse transfer. The opposing LPS/DC result in PMID:26708990 defines stimulus dependence,
      not an annotation inconsistency. Human Dectin1/SYK inhibition in PMID:19358895 directly supports
      the specified cytokine/oxidase output, and native mouse lectin/integrin studies corroborate receptor-dependent
      cytokine and ROS signaling. Retain the exact transferred response as contextual; Dectin1-only versus
      TLR-costimulated conditions differ, and PMID:15845454 specifically preserves yeast-induced IL12
      in Syk-null cells. These are not universal requirements across all stimuli.
- id: PMID:16410013
  title: Structural basis for the requirement of two phosphotyrosine residues in signaling mediated by
    Syk tyrosine kinase.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Syk has two distinct experimentally supported domain-recognition modes: its SH2 domains
      bind phosphotyrosine motifs, while its phosphorylated linker binds SH2 domains on PLCgamma and other
      effectors. Refine the broad protein-domain-binding claim to both phosphotyrosine residue binding
      and SH2 domain binding, already represented here, rather than reversing donor and reader domains.
      PMID:16410013 directly resolves PLCgamma1 C-terminal SH2 recognition of the doubly phosphorylated
      Syk linker. Refine bare binding to phospholipase binding and SH2 domain binding. Syk supplies the
      phosphotyrosines; the SH2 domain in this assay belongs to PLCgamma1, not Syk.'
