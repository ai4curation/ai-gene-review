    review_notes: Syk catalyzes protein tyrosine phosphorylation, demonstrated by native mouse immune-cell
      and recombinant enzyme studies. PMID:8798454 distinguishes the intrinsic catalytic activity of Syk/SykB
      from ZAP70, PMID:9199344 measures Shc phosphorylation, and PMID:27609517 directly analyzes mouse
