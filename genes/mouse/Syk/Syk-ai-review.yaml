- id: PMID:9698567
  title: Structural basis for Syk tyrosine kinase ubiquity in signal transduction pathways revealed by
    the crystal structure of its regulatory SH2 domains bound to a dually phosphorylated ITAM peptide.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Syk has two distinct experimentally supported domain-recognition modes: its SH2 domains
      bind phosphotyrosine motifs, while its phosphorylated linker binds SH2 domains on PLCgamma and other
      effectors. Refine the broad protein-domain-binding claim to both phosphotyrosine residue binding
      and SH2 domain binding, already represented here, rather than reversing donor and reader domains.
      Mouse Syk phosphotyrosine recognition is a conserved tandem-SH2 activity supported by receptor recruitment
      and independent structural donor evidence. The original phosphopeptide-array study tests human SH2-domain
      binding to phosphorylated Chlamydia Tarp; its title emphasizes SHC1 but does not exclude SYK from
      the array. Independent purified ITAM binding and the SYK tandem-SH2 crystal structure directly establish
      phosphotyrosine recognition. Preserve the bacterial-effector partner without claiming that the SHC1
      survival experiments were performed on SYK. The preserved original source is PMID:20624904. PMID:8626447
      demonstrates recruitment of Syk to the reconstituted BCR in mouse AtT20 cells. The preserved CD79A
      partner provides an ITAM recognized by tandem SH2 domains; quantitative/structural donor studies
      independently establish this binding mode. Refine bare binding to phosphotyrosine residue binding
      without describing the nonlymphoid reconstitution as native B-cell physiology. Syk is recruited
      peripherally to phosphorylated membrane-receptor signaling chains, supported by native mouse receptor
      studies and ITAM/SH2 binding. The PTN002521457 localization assertion is not a claim of integral
      membrane topology or exclusive membrane residence.'
