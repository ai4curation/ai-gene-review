    cells.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'The mouse TNF-signaling transfer is retained as a contextual orthology inference from
      the human mammary epithelial SYK–TRIP experiment. Full PMID:19151749 studies human mammary epithelial
      cells: SYK binds TRIP, enhances TNF-dependent NF-kappaB activation, and opposes TRIP-associated
      sensitization to apoptosis. Retain contextual TNF-pathway regulation without making its sign universal
      across immune and epithelial cells. The preserved original source is PMID:19151749.'
