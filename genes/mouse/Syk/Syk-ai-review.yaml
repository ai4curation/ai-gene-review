- id: PMID:19358895
  title: Dectin-1 is required for human dendritic cells to initiate immune response to Candida albicans
    through Syk activation.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Native mouse Dectin1 evidence independently supports the cell-surface pattern-recognition
      receptor signaling claim. SYK transmits signals from stimulatory C-type lectin receptors through
      phosphorylated receptor/adaptor motifs to downstream enzymes. Human dendritic-cell inhibitor experiments
      in PMID:19358895 and native mouse Dectin-1 studies independently support the catalytic signaling
      role. The BCR is not its only receptor context. The preserved original source is PMID:19358895.
      Human Dectin1/SYK inhibition in PMID:19358895 directly supports the specified cytokine/oxidase output,
      and native mouse lectin/integrin studies corroborate receptor-dependent cytokine and ROS signaling.
      Retain the exact transferred response as contextual; Dectin1-only versus TLR-costimulated conditions
      differ, and PMID:15845454 specifically preserves yeast-induced IL12 in Syk-null cells. These are
      not universal requirements across all stimuli.
