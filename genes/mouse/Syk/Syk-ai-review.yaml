      receptor complex
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The preserved mouse APS interaction cites PMID:10872802. The accessible abstract demonstrates
      APS phosphorylation during cytokine/BCR stimulation but does not expose the exact SYK–APS binding
      assay. Normal full-text recovery remained unavailable. Retain this source-specific IPI uncertainty
