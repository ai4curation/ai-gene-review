- id: PMID:26708990
  title: Syk negatively regulates TLR4-mediated IFNβ and IL-10 production and promotes inflammatory responses
    in dendritic cells.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Native mouse Syk-deficient dendritic cells fail to produce IL10 after Dectin1/yeast
      stimulation in PMID:15845454, independently grounding the human-to-mouse transfer. The opposing
      LPS/DC result in PMID:26708990 defines stimulus dependence, not an annotation inconsistency. PMID:22078883
      identifies Syk/PLCgamma2 control of CD14-dependent TLR4 endocytosis; PMID:23962979 distinguishes
      the associated TRAF3/TBK1/typeI-IFN branch from inhibition of TRAF6-driven cytokine signaling. Retain
      the measured receptor-traffic/interferon regulation as contextual, acknowledging opposite IFN effects
      in a different dendritic-cell context.
- id: PMID:25251945
  title: Human intestinal epithelial cells respond to β-glucans via Dectin-1 and Syk.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The exact donor PMID:25251945 measures human epithelial IL8/CXCL8 secretion. Comparative
      primary PMID:10028286 identifies CXCL8 loss in the mouse/rat lineage, so a conserved upstream Syk
      kinase does not establish production of that absent endogenous output in native mouse cells. This
      is a cytokine-repertoire scope error in the transfer, not evidence that mouse Syk lacks inflammatory
      chemokine signaling or cannot function in a heterologous human system. The mouse CCL2-production
      claim is retained as a conserved chemokine-regulatory inference from the human intestinal epithelial
      donor experiment, not a direct mouse epithelial assay. PMID:25251945 directly studies human intestinal
      epithelial cells and reports Dectin-1/SYK-dependent beta-glucan-induced IL8 and CCL2 secretion.
      Retain the specified chemokine output as contextual native human biology, not a newly inferred B-cell
      core function. The preserved original source is PMID:25251945.
