  title: TREM2 Is a Receptor for β-Amyloid that Mediates Microglial Function.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The mouse amyloid-response claim is supported by the source’s primary microglial/mouse
      context and amyloid-induced SYK phosphorylation, not merely a human annotation transfer. PMID:29518356
      explicitly reports amyloid-enhanced TREM2–DAP12 interaction and downstream SYK phosphorylation.
