- id: PMID:7477352
  title: Perinatal lethality and blocked B-cell development in mice lacking the tyrosine kinase Syk.
  findings:
  - statement: Syk knockout mice show perinatal lethality with hemorrhaging, indicating a critical role
      in vascular integrity
    supporting_text: we created mice null for the syk gene which showed petechiae in utero and died shortly
      after birth
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Syk is absolutely required for B cell development with complete block at pro-B to pre-B
      cell transition
    supporting_text: Irradiated mice reconstituted with Syk-deficient fetal liver showed a block in B-cell
      development at the pro-B to pre-B cell transition, consistent with a key role for Syk in pre-B-cell
      receptor signalling
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Syk deficiency impairs development of Vγ3+ gamma-delta T cells while alpha-beta T cell
      development proceeds normally
    supporting_text: whereas the development of alpha beta T cells proceeded normally, Syk-deficient mice
      showed impaired development of thymocytes using the V gamma 3 variable region gene
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Native mouse Syk-null hematopoietic studies show a major pro-B/pre-B transition and
      mature B-cell accumulation defect. Retain positive B-cell differentiation regulation as the developmental
      consequence of receptor signaling, with sustained Syk–SLP65 feedback independently supporting the
      mechanism. PMID:8790395 demonstrates selective depletion and developmental arrest of epithelial
      gamma-delta T-cell subsets in Syk-deficient chimeras, while splenic gamma-delta cells can develop
      and expand. Retain the developmental regulation with this tissue/subset distinction rather than
      universal gamma-delta dependence. Native mouse Syk loss blocks B-cell developmental/signaling functions
      and selective T-lineage programs. Direct receptor-proximal phosphorylation, rather than phenotype
      necessity alone, establishes participation in adaptive immunity; chicken descendant evidence is
      legitimate support for the ancestral inference. Native mouse antigen-receptor signaling and developmental
      genetics establish adaptive immunity participation independently of the chicken transfer. Syk supplies
      a catalytic signal-transmission step rather than merely a requirement inferred from lymphocyte deficiency.
