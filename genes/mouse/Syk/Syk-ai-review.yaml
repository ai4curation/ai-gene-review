id: P48025
gene_symbol: Syk
aliases:
- ptk72
- Sykb
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mouse Syk is a non-receptor protein tyrosine kinase whose tandem SH2 domains couple phosphorylated
  immune-receptor motifs to intracellular signaling. It phosphorylates adaptor and enzyme substrates and
  supplies docking surfaces for sustained signaling assemblies. Native mouse studies establish roles in
  B-cell antigen-receptor, Fc-receptor, lectin and integrin signaling, with developmental effects in B
  cells and selected T-cell stages and contextual functions in myeloid cells, platelets, osteoclasts and
  adipocytes. It also regulates receptor trafficking and autophagy in a stimulus-dependent manner. Positive
  OxLDL-induced macrophage autophagy and negative Tau-clearance regulation are distinct contexts, as are
  opposing cytokine effects in different innate responses.
