    review_notes: Syk executes BCR signal transmission by phosphorylating receptor-associated substrates
      and adaptors. Native mouse enzyme studies, BCR/Syk reconstitution and Shc/BLNK biochemistry independently
      corroborate the PTN002815343 ancestral inference. Reconstitution in AtT20 cells restores several
