      places its ITAM in an IL3-receptor complex that recruits Syk; independent quantitative Fc-receptor
      gamma phosphopeptide binding in PMID:8810294 supports phosphotyrosine recognition. Refine bare binding
      without assigning IL3 ligand recognition to Syk.
- id: PMID:15509800
  title: Mechanism of B-cell receptor-induced phosphorylation and activation of phospholipase C-gamma2.
  findings: []
  reference_review:
