      an isolated binary GPVI-binding measurement. The preserved original source is PMID:31145836.
- id: PMID:15123770
  title: 'Interleukin-15 enhances human neutrophil phagocytosis by a Syk-dependent mechanism: importance
    of the IL-15Ralpha chain.'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse signaling-receptor association is supported by native ITAM-receptor recruitment
      and conserved donor receptor-binding evidence; the exact human GPVI pair remains assay-limited.
      SYK binds signaling receptors or their phosphorylated signaling chains through SH2-mediated recognition,
      established independently by CD3/ITAM and IL15RA binding. The original GPVI/GP130 platelet paper
      establishes pathway proximity but its accessible abstract does not resolve the exact GPVI–SYK pair
      assay. Retain the supported general receptor-binding claim without mislabeling that abstract as
      an isolated binary GPVI-binding measurement. The preserved original source is PMID:31145836. The
      mouse IL15RA-binding attribution is retained as an orthology-based receptor-association inference
      from the directly assayed human neutrophil pair. The original human-neutrophil study explicitly
      reports physical association of SYK with IL15RA and a SYK-dependent increase in phagocytosis. Retain
      this receptor-binding context; it does not assign IL15 ligand activity to SYK. The preserved original
      source is PMID:15123770.
- id: PMID:12885943
  title: A role for Syk-kinase in the control of the binding cycle of the beta2 integrins (CD11/CD18)
    in human polymorphonuclear neutrophils.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Retain the mouse integrin-binding inference with native platelet/integrin signaling
      corroboration and explicit human donor co-immunoprecipitation provenance. PMID:12885943 directly
      reports Syk coprecipitation with CD18 in activated human neutrophils. Retain this integrin association
      in its adhesion-cycle context; co-immunoprecipitation does not require an isolated binary complex
      and inhibition has different effects on attachment and migration. The preserved original source
      is PMID:12885943. Full PMID:11940607 shows that Syk-deficient mouse platelets activate Src after
      adhesion but fail to spread and phosphorylate downstream cytoskeletal substrates. Retain positive
      integrin-mediated adhesion/spreading regulation; static human neutrophil inhibition assays measure
      a distinct adhesion–detachment context. Retain mouse leukocyte adhesion as a conserved context with
      native ITAM–integrin activation evidence; the human donor measures an adhesion–detachment cycle.
      Human neutrophil experiments in PMID:12885943 connect SYK to the CD18 adhesion–detachment cycle:
      piceatannol increases adhesion/spreading but reduces chemotactic migration. Retain participation
      in adhesion and migration without converting this context into a universal positive-adhesion sign.
      The preserved original source is PMID:12885943. Retain mouse neutrophil chemotaxis as a conserved
      donor-supported response, without implying that the native bacterial-infection study found defective
      overall recruitment. Human neutrophil experiments in PMID:12885943 connect SYK to the CD18 adhesion–detachment
      cycle: piceatannol increases adhesion/spreading but reduces chemotactic migration. Retain participation
      in adhesion and migration without converting this context into a universal positive-adhesion sign.'
