- id: url:https://www.nature.com/articles/ni.2222
  title: Dectin-1 is an extracellular pathogen sensor for the induction and processing of IL-1β via a
    noncanonical caspase-8 inflammasome
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: The mouse apoptotic-signaling transfer remains unresolved because the traced donor source
      concerns noncanonical caspase8-dependent IL1beta processing, not a resolved apoptosis assay. The
      accessible PMID:22267217 abstract and publisher figure headings establish a noncanonical caspase8
      inflammasome for IL1beta processing, not an apoptosis assay. Caspase8 activation alone is not sufficient
      to infer apoptotic signaling. The complete article remains unavailable after normal PMID and publisher
      recovery, so retain source-specific uncertainty instead of declaring the experimental annotation
      false. The preserved original source is PMID:22267217.
