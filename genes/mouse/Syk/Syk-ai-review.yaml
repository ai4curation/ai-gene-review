core_functions:
- description: ATP-dependent non-receptor tyrosine phosphorylation transmits BCR, Fc-receptor, C-type
    lectin and integrin-linked signals to adaptor and enzyme substrates. Activation can arise through
    ITAM engagement or autophosphorylation, and substrate choice depends on the signaling assembly. Native
    Fc-gamma-receptor experiments establish proximal Syk participation and activation, while the phagocytic
    knockout phenotype alone does not distinguish its catalytic and adaptor contributions.
  molecular_function:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  directly_involved_in:
  - id: GO:0050853
    label: B cell receptor signaling pathway
  - id: GO:0038095
    label: Fc-epsilon receptor signaling pathway
  - id: GO:0038096
    label: Fc-gamma receptor signaling pathway involved in phagocytosis
  - id: GO:0002223
    label: stimulatory C-type lectin receptor signaling pathway
  - id: GO:0007229
    label: integrin-mediated signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8798454
  - reference_id: PMID:8626447
  - reference_id: PMID:9000133
  - reference_id: PMID:15845454
  - reference_id: PMID:17086186
  - reference_id: PMID:9314552
    supporting_text: We found that FcγR-mediated Syk activation was impaired in Hck−/Fgr−/Lyn− macrophages.
      This observation provides additional strong evidence for a model of sequential activation of Src
      family and Syk tyrosine kinases by the FcγRs.
  - reference_id: PMID:9314552
    supporting_text: Alternatively, the physical association of Syk with phosphorylated receptor tails
      may allow it to serve an adaptor-type function at cross-linked receptors to allow recruitment of
      other important proteins to the site of particle binding.
- description: Tandem SH2 domains recognize phosphotyrosine-containing receptor motifs and couple membrane
    recruitment to activation; SYK phosphotyrosines separately recruit other SH2-containing proteins to
    sustained signaling assemblies.
  molecular_function:
    id: GO:0001784
    label: phosphotyrosine residue binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:17086186
  - reference_id: PMID:9698567
proposed_new_terms: []
suggested_questions:
- question: Which Syk receptor contexts in mouse should be considered core gene-product functions rather
    than immune-cell-specific downstream outputs?
- question: Which Syk isoform/localization differences are sufficiently supported for isoform-specific
    GO annotation?
suggested_experiments:
- description: Compare kinase-dead, SH2-binding-defective, and isoform-specific Syk rescue alleles in
    mouse immune-cell receptor signaling assays.
  hypothesis: Syk core functions partition into phosphotyrosine docking and tyrosine kinase catalytic
    modules that have receptor-context-specific requirements.
  experiment_type: Genetic rescue and phosphoproteomics
