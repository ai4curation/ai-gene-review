      annotated binary SYK-PLCG2 interaction.
- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3497833/
  title: Serine phosphorylation by SYK is critical for nuclear localization and transcription factor function
    of Ikaros
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Retain the conserved mouse serine-kinase claim as contextual donor-supported chemistry;
      the directly mapped substrate in PMID:23071339 is mouse Ikaros, while native-cell knockdown experiments
      are human. PMID:23071339 directly tests purified recombinant SYK phosphorylation of Ikaros, with
      phospho-amino-acid analysis and mass spectrometry, and native human-cell knockdown supports regulation
      of Ikaros. The mapped mouse Ikaros S358/S361 correspond to human S361/S364; this is genuine serine
      phosphorylation by SYK, not merely activation of a downstream serine kinase. Retain this contextual
      chemistry alongside its principal tyrosine kinase function. The preserved original source is PMID:23071339.
      For mouse Syk, the human donor experiments support a conserved regulatory effect on Ikaros localization
      rather than direct cargo transport by Syk. SYK phosphorylates Ikaros and thereby promotes its nuclear
      accumulation; it is not demonstrated to carry Ikaros through the pore as an import receptor. Refine
      the role to positive regulation of protein import into nucleus, supported by SYK knockdown and Ikaros
      phosphosite/phosphomimetic mutants. This is a lateral role correction, not a claim that the regulatory
      term is a descendant of nuclear import. The preserved original source is PMID:23071339. Retain the
      mouse nuclear pool as a contextual orthology inference from SYK–Ikaros cellular studies, distinct
      from the substrate’s own nuclear localization. PMID:23071339 examines SYK–Ikaros in human cells
      and supports a nuclear as well as cytoplasmic pool. Retain contextual nuclear localization rather
      than exclude it because receptor signaling is mainly cytoplasmic. Nuclear localization of Ikaros
      is a separate substrate response. The preserved original source is PMID:23071339.
