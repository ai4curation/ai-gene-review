core_functions:
- description: TNFRSF1A/TNFR1 binds TNF-family ligands at the cell surface and nucleates receptor signaling complexes that activate canonical NF-kappaB and inflammatory gene programs.
  molecular_function:
    id: GO:0005031
    label: tumor necrosis factor receptor activity
  directly_involved_in:
  - id: GO:0033209
    label: tumor necrosis factor-mediated signaling pathway
  - id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  - id: GO:0006954
    label: inflammatory response
  locations:
  - id: GO:0009986
    label: cell surface
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:mouse/Tnfrsf1a/Tnfrsf1a-notes.md
    supporting_text: 'NF-kappaB and inflammatory signaling: TNF-R55-deficient fibroblasts show loss of major TNF-induced functions, including "NF-kappa B activation."'
  - reference_id: file:mouse/Tnfrsf1a/Tnfrsf1a-deep-research-falcon.md
    supporting_text: 'Falcon reinforces the core TNFR1 model: TNF binding at the plasma membrane nucleates Complex I, activating NF-kappaB/MAPK inflammatory and survival programs.'
- description: When TNFR1 death-domain signaling engages FADD/caspase-8 and related complexes, the same receptor can drive extrinsic apoptotic signaling.
  molecular_function:
    id: GO:0005031
    label: tumor necrosis factor receptor activity
  directly_involved_in:
  - id: GO:0008625
    label: extrinsic apoptotic signaling pathway via death domain receptors
  - id: GO:0097190
    label: apoptotic signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:mouse/Tnfrsf1a/Tnfrsf1a-notes.md
    supporting_text: 'Apoptosis and death-domain signaling: UniProt notes that FADD recruits caspase-8 to the activated receptor and that the receptor complex activates apoptosis and NF-kappaB signaling.'
  - reference_id: file:mouse/Tnfrsf1a/Tnfrsf1a-deep-research-falcon.md
    supporting_text: Falcon reinforces TNFR1 death-domain signaling through cytosolic Complex II, FADD/caspase-8 apoptosis, and related regulated cell death decisions.
proposed_new_terms: []
suggested_questions:
- question: Which TNFR1 adaptor interactions merit specific GO molecular-function terms rather than uninformative protein binding annotations?
suggested_experiments:
- hypothesis: TNFR1 pathway choice depends on assembly of distinct receptor-proximal complexes that separate NF-kappaB signaling from apoptotic signaling.
  description: Quantify TNF-induced Complex I and Complex II assembly, NF-kappaB activation, caspase-8 activation, and cell death in Tnfrsf1a-null cells rescued with ligand-binding or death-domain mutants.
  experiment_type: receptor complex signaling assay
