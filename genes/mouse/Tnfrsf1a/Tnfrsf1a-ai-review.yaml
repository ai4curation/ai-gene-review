id: P25118
gene_symbol: Tnfrsf1a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Tnfrsf1a encodes mouse TNF receptor 1 (p55/CD120a), a type I transmembrane TNF receptor with extracellular cysteine-rich ligand-binding domains and an intracellular death domain. TNFR1 binds TNF/lymphotoxin-alpha and initiates TNF-mediated signaling, especially canonical NF-kappaB/inflammatory signaling and extrinsic apoptotic signaling.
existing_annotations:
- term:
    id: GO:0043235
    label: receptor complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: receptor complex captures the right general biology for Tnfrsf1a, but a more specific GO term is available.
    action: MODIFY
    reason: The current term is too broad or less precise than tumor necrosis factor receptor superfamily complex for this gene. Replace with tumor necrosis factor receptor superfamily complex to align the annotation with the reviewed evidence.
    proposed_replacement_terms:
    - id: GO:0002947
      label: tumor necrosis factor receptor superfamily complex
    supported_by:
    - reference_id: file:mouse/Tnfrsf1a/Tnfrsf1a-notes.md
      supporting_text: 'Membrane and complex localization: UniProt describes TNFRSF1A as a type I membrane protein with extracellular ligand-binding and intracellular death-domain regions.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002930098
        source_status: SUPPORTS_TRANSFER
        comment: 'TNFR1-clade node in PTHR46861. The WITH/FROM names a single donor, which is not a weakness: an IBD placed on one well-characterised human gene at a clade node is a phylogenetic judgement about where the property arose, and the target sits squarely inside that clade. Checked in the ontology: GO:0002947 is a descendant of GO:0043235, so the replacement refines the annotation to the receptor superfamily actually involved without changing the claim.'
      - source_id: UniProtKB:P19438
        source_label: TNFRSF1A
        source_status: SUPPORTS_TRANSFER
        comment: Human TNFRSF1A (TNF receptor superfamily member 1A), the target's direct ortholog and the sole seed. A type-I membrane receptor with an extracellular ligand-binding region and an intracellular death domain that assembles trimeric receptor complexes - exactly what GO:0002947 names.
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN002930098
  - UniProtKB:P19438
