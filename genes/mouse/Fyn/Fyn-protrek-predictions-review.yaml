id: P39688
gene_symbol: Fyn
taxon:
  id: NCBITaxon:10090
  label: Mus musculus (Mouse)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for mouse Fyn. This gene and Src are the Src-family paralog pair
  the BioReason evaluation reported receiving interchangeable descriptions, and ProTrek reproduces
  the collapse exactly: both lists lead with phosphotyrosine residue binding, both contain receptor
  tyrosine kinase-like orphan receptor binding, phospholipase binding and peptidyl-tyrosine phosphorylation,
  and the two top-1 scores differ by 0.45 units. Nothing in either list distinguishes Fyn's T-cell
  receptor and reelin signalling roles from Src's adhesion and osteoclast roles, and neither list
  contains the non-membrane spanning protein tyrosine kinase activity that is the shared core function.
  Assessment: 1 correct novel (COR), 1 correct not novel (CNN), 1 uncertain (UNC).
