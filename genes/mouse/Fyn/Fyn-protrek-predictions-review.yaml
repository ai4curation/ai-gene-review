  predicted_term:
    id: GO:0001784
    label: phosphotyrosine residue binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 16.20) and absent from GOA, a strict descendant of generic protein binding.
      Fyn's SH2 domain binds phosphotyrosine motifs, which is how it is recruited to activated receptors
      - so the call is correct, mechanistically apt and novel. It is also true of every Src-family
      kinase, which is why it heads Src's list too.
    supported_by:
