id: Q8CFW7
gene_symbol: Cc2d2a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Cc2d2a encodes a large (1633 aa) coiled-coil and C2 domain-containing protein with an N-terminal CC2D2AN-C2
  domain, a central catalytically inactive transglutaminase/peptidase-like (CEP76-like) region and a C-terminal
  C2 domain. It is a structural subunit of the MKS/Tectonic module of the ciliary transition zone, where it co-purifies
  with Tctn1-3, Mks1, B9d1/2, Tmem231, Tmem17 and Ahi1. Within this module it is needed for the interdependent recruitment
  of transition-zone membrane proteins (Tmem231, B9d1, Tmem80) and for the diffusion barrier that keeps ciliary
  membrane receptors such as adenylyl cyclase 3, Pkd2 and Smoothened in the cilium. Cc2d2a also localizes to the
  mother centriole, where it is required for subdistal appendage assembly, microtubule anchoring, ciliary vesicle
  docking and initiation of the axoneme. Null mice lack cilia in many tissues and die during gestation with Meckel-syndrome-like
  defects: randomized left-right asymmetry, exencephaly, microphthalmia, polydactyly, cystic kidneys and loss of
  ventral, Hedgehog-dependent neural tube fates.'
