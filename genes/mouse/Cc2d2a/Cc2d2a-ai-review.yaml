    label: kidney development
  evidence_type: IMP
  original_reference_id: PMID:27002738
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:5311382
  review:
    summary: Kidney development IMP from a forward-genetic screen; Cc2d2a mutant line shows prenatal cystic kidney
      disease.
    action: MARK_AS_OVER_ANNOTATED
    reason: The Cc2d2a mutant phenotype is genuine, but it is an organismal consequence of failed ciliogenesis and
      ciliary signalling (Cc2d2a acts at the transition zone/mother centriole of essentially every ciliated cell).
      Cc2d2a does not perform any step of kidney development itself; the term records a downstream phenotype rather
      than the gene's function, and PAINT did not propagate any organ-development term from mouse. Retained as a
      valid acts_upstream_of_or_within IMP statement but flagged as over-annotation relative to the core ciliary
      role; it should not be used as the basis for transfer to orthologs. The authors themselves attribute the cysts
      to a transition-zone/centriole docking mechanism.
    supported_by:
    - reference_id: PMID:27002738
      supporting_text: Severe cystic disease was identified only in lines with cilia-related mutations including
        Bicc1, Cc2d2a, Tmem67, Cep290 and Pkd1
    - reference_id: PMID:27002738
      supporting_text: These findings suggest the cilia components Cep290, Cc2d2a and Tmem67 may cause prenatal
        cysts by a fundamentally different mechanism than the cysts caused by intraflagellar transport (IFT) mutations
