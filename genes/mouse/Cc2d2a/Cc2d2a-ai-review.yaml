  original_reference_id: PMID:24947469
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:5708063
  review:
    summary: Embryonic brain development IMP (exencephaly, holoprosencephaly, hydrocephalus in Cc2d2a mutants).
    action: MARK_AS_OVER_ANNOTATED
    reason: The Cc2d2a mutant phenotype is genuine, but it is an organismal consequence of failed ciliogenesis and
      ciliary signalling (Cc2d2a acts at the transition zone/mother centriole of essentially every ciliated cell).
      Cc2d2a does not perform any step of brain development itself; the term records a downstream phenotype rather
      than the gene's function, and PAINT did not propagate any organ-development term from mouse. Retained as a
      valid acts_upstream_of_or_within IMP statement but flagged as over-annotation relative to the core ciliary
      role; it should not be used as the basis for transfer to orthologs.
    supported_by:
    - *id008
    - *id006
