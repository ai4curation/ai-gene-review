core_functions:
- description: Structural subunit of the MKS/Tectonic transition-zone complex (experimentally established in mouse
    by complex purification and co-IP). It is required for transition-zone recruitment of other module members and
    TZ membrane proteins, and through the module it maintains the ciliary membrane diffusion barrier.
  directly_involved_in:
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  in_complex:
    id: GO:0036038
    label: MKS complex
  supported_by:
  - *id002
  - *id009
  - *id012
  - reference_id: PMID:21725307
    supporting_text: Strikingly, MEFs lacking Tctn2, Cc2d2a or Tmem67 lacked AC3 in their cilia
- description: Required at the mother centriole/basal body for early primary cilium biogenesis (subdistal appendage
    assembly, microtubule anchoring, vesicle docking, axoneme initiation), shown in mouse by null MEFs with transgene
    rescue; the requirement varies between tissues and alleles.
  directly_involved_in:
