    supporting_text: Immunogold labeling for CC2D2A was clearly visible on the SDA both in IMCD3 cells and in monkey
      retina
  - reference_id: PMID:24947469
    supporting_text: Notably, in a fraction of Cc2d2a-/- MEFs, the mother centriole docked to ciliary vesicles but
      apparently no transition zone developed
suggested_questions:
- question: Is mouse Cc2d2a a genuine subdistal-appendage component (immunogold, Veleri et al.) or a transition-zone
    protein whose loss secondarily disrupts appendages? Super-resolution mapping in mouse cells against Odf2/ninein
    and Rpgrip1l would settle which location (GO:0120103 vs GO:0035869 only) should be annotated.
- question: Why do gene-trap Cc2d2a MEFs (Garcia-Gonzalo et al.) form cilia while targeted-null MEFs (Veleri et
    al.) do not? Is the gene-trap allele hypomorphic, or is the difference due to genetic background?
- question: Should a structural TZ subunit like Cc2d2a be annotated to ciliary transition zone assembly (GO:1905349)?
    Its MKS-module partners (Tctn1, Mks1, B9d1) currently are not, so this needs a GO-wide convention decision rather
    than a single-gene annotation.
suggested_experiments:
- description: Domain-deletion rescue of Cc2d2a-null MEFs (CC2D2AN-C2, TGL-like region, C-terminal C2), scoring
    cilium formation, transition-zone recruitment of Tmem231/B9d1/Tmem80, and ciliary retention of AC3/Pkd2/Smo.
  experiment_type: genetic rescue with domain mutants
- description: Test whether the Cc2d2a C2 domains bind membrane phospholipids in vitro, which would define a molecular
    function for its transition-zone membrane role.
  experiment_type: liposome binding assay
