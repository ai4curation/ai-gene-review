suggested_questions:
- question: >-
    What tissue-specific OGDHc or bile-acid metabolic mechanism links whole-body
    Abhd11 loss in mice to reduced intestinal lipid absorption on a high-fat diet
    and male-predominant progressive cataract and retinal atrophy (PMID:32579589)?
suggested_experiments:
- hypothesis: >-
    Tissues affected by ocular degeneration and altered bile-salt homeostasis in
    Abhd11-/- mice accumulate S-glutaryl-lipoyl DLST adducts and 2-oxoglutarate
    in vivo.
  description: >-
    Perform targeted LC-MS/MS quantification of DLST K110 functional lipoylation,
    glutaryl-lipoylation, and TCA cycle intermediates in retina, lens, and liver
    mitochondria isolated from male and female Abhd11-/- versus wild-type
    littermates.
