  - SGD:S000003263
  review:
    summary: Over-propagated PAINT IBA from yeast IMO32 overexpression TAG shifts; mouse Abhd11 maintains mitochondrial OGDHc lipoylation and TCA cycle flux rather than direct cellular glycerolipid metabolism.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Propagated from Eukaryota node PANTHER:PTN002919262 based solely on yeast
      IMO32 high-copy overexpression triacylglycerol changes (PMID:28465236).
      Whole-body Abhd11 knockout mice retain wild-type tissue 2-AG levels
      (PMID:32579589), full-length mammalian ABHD11 has zero MAG/DAG lipase
      activity (PMID:27544863), and mouse Abhd11 acts in the mitochondrial
      matrix to preserve DLST lipoylation and OGDHc/TCA cycle metabolism, with
      sterol and lipid gene-expression shifts arising downstream of TCA cycle
      perturbation (PMID:32792488, PMID:41184294).
    supported_by:
    - reference_id: PMID:32579589
      supporting_text: >-
        In vivo preclinical studies demonstrated that knock-out ABHD11 mice have a
        similar 2AG level as WT mice and exhibit a lean metabolic phenotype.
    - reference_id: PMID:41184294
      supporting_text: >-
        Mechanistically, the anti-inflammatory effects of ABHD11 inhibition are
        attributed to increased 24,25-epoxycholesterol (24,25-EC) biosynthesis
        and subsequent liver X receptor (LXR) activation, which arise from a
        compromised TCA cycle.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - FUNCTIONAL_DIVERGENCE
      residue_claims_not_applicable: Active-site Ser133-Asp157-His288 triad is intact, but physiological catalysis targets OGDHc lipoyl thioesters rather than cellular lipids.
      source_entities:
      - source_id: PANTHER:PTN002919262
        source_label: Eukaryota node in PTHR46118
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Single-seed IBD from yeast IMO32 overexpression lipid shifts; judged WRONG_NODE in PTHR46118-review.yaml.
