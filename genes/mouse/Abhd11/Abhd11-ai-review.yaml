  review:
    summary: Mouse Abhd11 preserves functional lipoylation of OGDHc-E2 (DLST) to maintain mitochondrial 2-oxoglutarate oxidative decarboxylation and TCA cycle flux.
    action: NEW
    reason: >-
      Inferred from 1:1 human ortholog Q8NFV4 (PMID:32792488) and directly
      reinforced in mouse cells by ML226-induced loss of OGDHc DLST lipoylation
      in murine C2C12 myoblasts (PMID:32792488) and compromised alpha-KGDH / TCA
      cycle flux in mouse T cells (PMID:41184294). As documented in the in-repo
      comparator check on human ABHD11, upstream de novo lipoylation enzymes
      (LIAS, LIPT1) carry GO:0009249 without GO:0006103 because they install
      lipoate once across multiple 2-oxoacid dehydrogenases, whereas OGDHc
      complex members (DLST, DLD, and complex-associated ABHD11/Abhd11, part_of
      GO:0045252) directly sustain ongoing 2-oxoglutarate turnover in situ by
      preventing catalytic S8-glutaryl-lipoamide inactivation.
    supported_by:
    - reference_id: PMID:32792488
      supporting_text: >-
        ML226 treatment inhibited ABHD11 p-nitrophenyl ester hydrolysis in vitro
        (Fig. 4g) and decreased OGDHc lipoylation in HeLa cells (Fig. 4h) and
        cultured myoblasts (C2C12) (Fig. 4i).
    - reference_id: PMID:41184294
      supporting_text: >-
        α/β-hydrolase domain-containing protein 11 (ABHD11) is a mitochondrial
        hydrolase that maintains the catalytic function of α-ketoglutarate
        dehydrogenase (α-KGDH), and its expression in CD4 + T-cells has been
        linked to remission status in rheumatoid arthritis (RA).
