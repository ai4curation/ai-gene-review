- id: PMID:18614015
  title: A mitochondrial protein compendium elucidates complex I disease biology.
  findings:
  - statement: >-
      MitoCarta proteomics and GFP tagging across 14 mouse tissues directly
      identify endogenous mouse Abhd11 as a mitochondrial resident protein.
    supporting_text: >-
      Toward this goal, we performed mass spectrometry, GFP tagging, and machine
      learning to create a mitochondrial compendium of 1098 genes and their
      protein expression across 14 mouse tissues.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary MitoCarta proteomics dataset supporting GO:0005739 on mouse Abhd11.
- id: PMID:27544863
  title: Chemoproteomic, biochemical and pharmacological approaches in the discovery of inhibitors targeting human α/β-hydrolase domain containing 11 (ABHD11).
  findings:
  - statement: >-
      Full-length human ABHD11 lacks mono- and diacylglycerol lipase activity
      while hydrolyzing para-nitrophenyl butyrate.
    supporting_text: >-
      Our fluorescent activity assays designed for natural lipase substrates
      revealed no activity of hABHD11 towards mono- or diacylglycerols.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Refutes ortholog-transferred glycerolipid lipase claims on mammalian ABHD11.
- id: PMID:32579589
  title: ABHD11, a new diacylglycerol lipase involved in weight gain regulation.
  findings:
  - statement: >-
      Confirmed mitochondrial localization of Abhd11 in mouse brain and showed
      that Abhd11 knockout mice maintain wild-type endogenous 2-AG levels while
      resisting diet-induced obesity.
    supporting_text: >-
      In vivo preclinical studies demonstrated that knock-out ABHD11 mice have a
      similar 2AG level as WT mice and exhibit a lean metabolic phenotype.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct mouse brain localization and whole-body knockout characterization refuting physiological 2-AG synthesis in vivo.
- id: PMID:32733886
  title: ABHD11 Is Critical for Embryonic Stem Cell Expansion, Differentiation and Lipid Metabolic Homeostasis.
  findings:
  - statement: >-
      Abhd11 knockout in mouse embryonic stem cells impairs expansion and
      differentiation and alters expression of glycolytic, amino-acid, and
      lipid-metabolic genes.
    supporting_text: >-
      Knockout of Abhd11 hampered ESC expansion and differentiation, triggering
      the autophagic flux and apoptosis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Documents downstream cellular necessity of Abhd11 in mouse ESCs; pleiotropic knockout phenotypes are not converted into direct GO process terms.
- id: PMID:32792488
  title: >-
    ABHD11 maintains 2-oxoglutarate metabolism by preserving functional
    lipoylation of the 2-oxoglutarate dehydrogenase complex.
  findings:
  - statement: >-
      Establishes mitochondrial matrix OGDHc association and shows that ML226
      inhibition decreases OGDHc lipoylation in both human cells and mouse C2C12
      myoblasts.
    supporting_text: >-
      ML226 treatment inhibited ABHD11 p-nitrophenyl ester hydrolysis in vitro
      (Fig. 4g) and decreased OGDHc lipoylation in HeLa cells (Fig. 4h) and
      cultured myoblasts (C2C12) (Fig. 4i).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Directly demonstrates conservation of ABHD11-dependent DLST lipoylation maintenance in murine C2C12 myoblasts alongside human cells.
- id: PMID:40664791
  title: Lipoyl deglutarylation by ABHD11 regulates mitochondrial and T cell metabolism.
  findings:
  - statement: >-
      Identifies mammalian ABHD11 as the glutaryl-lipoyl thioesterase that
      removes S-glutaryl adducts from lipoylated OGDHc-E2.
    supporting_text: >-
      Here we show that glutaryl–lipoyl adducts (Lpglu) are constantly formed on
      ketoacid dehydrogenases and that the serine hydrolase ABHD11 acts as a
      glutaryl–lipoyl thioesterase that removes these lipoyl adducts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Defines the endogenous biochemical reaction transferred via 1:1 orthology to mouse Abhd11.
- id: PMID:41184294
  title: Mitochondrial ABHD11 inhibition drives sterol metabolism to modulate T-cell effector function.
  findings:
  - statement: >-
      Pharmacological inhibition of Abhd11 compromises the TCA cycle in mouse
      and human T cells, suppressing effector cytokine production and delaying
      type 1 diabetes in female mice.
    supporting_text: >-
      Mechanistically, the anti-inflammatory effects of ABHD11 inhibition are
      attributed to increased 24,25-epoxycholesterol (24,25-EC) biosynthesis and
      subsequent liver X receptor (LXR) activation, which arise from a
      compromised TCA cycle.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Directly confirms conserved TCA-cycle maintenance by mouse Abhd11 in primary murine T cells and in vivo diabetes models.
