  review:
    summary: Conserved generic carboxylic-ester hydrolase activity supported by the intact Ser133-Asp157-His288 triad, kept as non-core alongside physiological glutaryl-lipoyl thioesterase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Mouse Abhd11 preserves the exact active-site Ser133-Asp157-His288 triad and
      65-HGLFG-69 oxyanion loop of human ABHD11, which genuinely hydrolyzes
      short-chain p-nitrophenyl carboxylic esters in a Ser-dependent,
      ML226-inhibitable manner on full-length enzyme (PMID:27544863,
      PMID:32792488). Unlike GO:0016298 and GO:0120516 (MARK_AS_OVER_ANNOTATED
      per projects/ENZYME_SPECIFICITY.md because full-length ABHD11 lacks
      acylglycerol lipase activity and Abhd11 KO mice maintain wild-type 2-AG in
      PMID:32579589), broad carboxylic-ester cleavage reflects the conserved
      FAMILY_WIDE chemistry of active PTHR46118 hydrolases on a sibling branch to
      mammalian glutaryl-lipoyl thioesterase activity (GO:0016790), so the PAINT
      IBA row is retained as KEEP_AS_NON_CORE.
    supported_by:
    - reference_id: file:human/ABHD11/ABHD11-bioinformatics/RESULTS.md
      supporting_text: >-
        | `UniProtKB:Q8K4F5` | `Abhd11` | *Mus musculus* | `PTHR46118:SF4` | 307 (`sv=1`) | `65-HGLFG-69` | `Ser133` (`LVGHSMGGK`) | `Asp157` (`LVVVDISPV`) | `His288` (`PNAGHWVHS`) | Active mitochondrial matrix ortholog |
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      residue_claims_not_applicable: Catalytic triad Ser133-Asp157-His288 is fully conserved.
      source_entities:
      - source_id: PANTHER:PTN002919262
        source_label: Eukaryota node in PTHR46118
        source_status: SUPPORTS_TRANSFER
        comment: Generic carboxylic-ester hydrolysis is conserved as a non-core active-site activity beside mammalian glutaryl-lipoyl thioesterase specialization.
