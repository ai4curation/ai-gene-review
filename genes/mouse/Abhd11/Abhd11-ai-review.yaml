id: Q8K4F5
gene_symbol: Abhd11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Abhd11 is a 307-residue mouse mitochondrial matrix serine hydrolase of the
  alpha/beta-hydrolase superfamily, orthologous to human ABHD11 encoded in the
  Williams-Beuren syndrome critical region. Synthesized with a 34-residue
  N-terminal mitochondrial targeting presequence, mouse Abhd11 folds into a
  cap-covered alpha/beta-hydrolase domain containing a 65-HGLFG-69 oxyanion-hole
  motif and a conserved catalytic triad comprising nucleophilic Ser133 (within
  131-GHSMG-135), beta-6 charge-relay Asp157, and general-base His288. Within
  the mitochondrial matrix, Abhd11 associates with the 2-oxoglutarate
  dehydrogenase complex (OGDHc) and preserves functional lipoylation of its E2
  subunit DLST by hydrolyzing inhibitory S-glutaryl-lipoyl thioester adducts,
  thereby sustaining 2-oxoglutarate oxidative decarboxylation and tricarboxylic
  acid cycle flux. Covalent active-site inhibition of mouse Abhd11 reduces DLST
  lipoylation in myoblasts, compromises tricarboxylic acid cycle metabolism in
  murine T lymphocytes to elevate 24,25-epoxycholesterol/liver X receptor
  signaling and delay autoimmune diabetes onset, and genetic loss impairs mouse
  embryonic stem cell expansion while rendering male knockout mice lean and
  resistant to diet-induced weight gain without altering endogenous tissue
  2-arachidonoylglycerol levels.
