    2-oxoglutarate dehydrogenase complex (OGDHc) that removes inhibitory
    S-glutaryl adducts from lipoylated DLST to sustain 2-oxoglutarate oxidative
    decarboxylation and tricarboxylic acid cycle metabolism.
