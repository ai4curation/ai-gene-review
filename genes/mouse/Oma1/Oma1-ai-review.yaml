suggested_questions:
- question: Is Oma1-mediated DELE1 cleavage, established in human cells, required for the integrated stress
    response in mouse tissues in vivo, and does it account for any of the Oma1-knockout metabolic phenotypes?
- question: Is S-OMA1 a more active form (zymogen-like activation), or is self-cleavage primarily a turnover
    mechanism of a constitutively active protease, as the two 2014 studies frame it differently?
suggested_experiments:
- description: Compare OPA1 and DELE1 cleavage kinetics by purified full-length versus self-cleaved mouse
    OMA1 (and E324Q) in reconstituted liposomes to test whether self-cleavage increases catalytic activity.
