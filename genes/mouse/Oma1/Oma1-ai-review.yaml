  review:
    summary: Qiu et al. show recombinant OMA1 cleaves OPA1 and that FAM210A modulates YME1L-mediated OMA1
      degradation in BAT.
    action: MARK_AS_OVER_ANNOTATED
    reason: OPA1 processing is dispensable for fusion and stress-induced OMA1 cleavage inhibits it; OMA1
