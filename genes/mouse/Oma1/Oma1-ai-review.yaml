id: Q9D8H7
gene_symbol: Oma1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Oma1 is an ATP-independent zinc metalloendopeptidase of the peptidase M48 family, anchored
  in the mitochondrial inner membrane by a single transmembrane helix, with its HExxH catalytic domain
  in the intermembrane space and an N-terminal stress-sensor region facing the matrix. It is mostly latent
  under basal conditions and is strongly activated by membrane depolarisation and other mitochondrial
  stresses, an activation coupled to self-cleavage at both termini that also drives its own turnover.
  Active Oma1 cleaves the long, fusion-competent forms of the dynamin-like GTPase OPA1 at the S1 site,
  which inhibits inner-membrane fusion, fragments the mitochondrial network and alters cristae. By orthology
  with human OMA1 it also cleaves DELE1 to activate HRI-dependent integrated stress signalling. Oma1-deficient
  mice are viable but develop obesity, hepatic steatosis and defective thermogenesis, and Oma1 loss protects
  against stress-induced cardiomyocyte and neuronal death.
