- term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN004490000
  - UniProtKB:Q9NUJ1
  review:
    summary: >-
      Erroneous PAINT propagation from PTN004490000 seeded by a mis-curated
      GO:0004553 annotation on human Q9NUJ1; ABHD10 cleaves carboxylic ester
      bonds, not O-glycosyl bonds.
    action: REMOVE
    reason: >-
      PTN004490000 propagates GO:0004553 from an erroneous annotation on human
      Q9NUJ1 (PMID:22294686) that misclassified carboxylic-ester hydrolysis of
      mycophenolic acid acyl-glucuronide (AcMPAG; EC 3.1.1.93) as O-glycosyl
      hydrolase activity; PMID:22294686 demonstrated ABHD10 cannot hydrolyze the
      phenolic O-glycoside MPAG.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      residue_claims_not_applicable: >-
        Subcellular localization or chemical ontology misclassification rather
        than active-site residue divergence.
      source_entities:
      - source_id: UniProtKB:Q9NUJ1
        source_label: ABHD10 (Homo sapiens)
        source_status: SOURCE_BAD
        comment: >-
          Human Q9NUJ1 cleaves the acyl-glucuronide carboxylic ester AcMPAG and
          was shown to be inactive on the O-glycosyl glucuronide MPAG
          (PMID:22294686).
    supported_by:
    - reference_id: PMID:22294686
      supporting_text: >-
        In fact, we found that the recombinant human ABHD10 could catalyze the
        deglucuronidation of AcMPAG, but could not catalyze the
        deglucuronidation of MPAG, a phenolic glucuronide of MPA (data not
        shown).
