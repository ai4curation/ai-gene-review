    Does catalytic-dead Abhd10 (S143A) knock-in phenocopy the complete male
    sterility and SPATA19/GK2/PDHX hyper-palmitoylation of Abhd10-null mice?
  experts:
  - Fei Sun
  - Bryan C. Dickinson
suggested_experiments:
- hypothesis: >-
    The sperm mitochondrial sheath defect of Abhd10-null mice strictly requires
    Ser143-mediated S-depalmitoylase catalysis rather than non-catalytic protein
    scaffolding.
  description: >-
    Compare sperm motility, midpiece mitochondrial sheath ultrastructure, and
    mitochondrial acyl-biotin exchange S-palmitoylomes between Abhd10-null mice
    and CRISPR knock-in mice expressing catalytically inactive Abhd10-S143A.
