id: Q6PE15
gene_symbol: Abhd10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Abhd10 (alpha/beta hydrolase domain-containing protein 10) is a soluble
  mitochondrial matrix serine hydrolase and protein S-depalmitoylase (EC
  3.1.2.22) in Mus musculus. Synthesized as a 297-residue precursor carrying a
  cleavable 43-residue N-terminal mitochondrial transit peptide, mature mouse
  ABHD10 (residues 44-297) adopts a canonical alpha/beta-hydrolase fold with an
  alpha-helical cap domain and a charge-relay catalytic triad at Ser143,
  Asp240, and His270 (numbered Ser100, Asp197, and His227 on the mature chain
  in crystal structure PDB:6NY9). ABHD10 hydrolyzes S-palmitoyl thioester
  modifications on resident mitochondrial proteins, including peroxidatic
  active-site Cys100 of peroxiredoxin-5 (PRDX5), thereby maintaining
  mitochondrial hydrogen peroxide buffering capacity and protecting hepatocytes
  against ELK-3-driven oxidative injury. In adult mice, ABHD10 is strongly
  enriched in the mitochondrial matrix of male germ cells, where
  S-depalmitoylation of mitochondrial sheath factors (SPATA19, GK2) and
  pyruvate dehydrogenase and respiratory chain subunits (PDHX, NDUFV1, SDHB)
  is essential for sperm mitochondrial sheath organization, flagellar motility,
  and male fertility. By orthology to human ABHD10, mammalian ABHD10 is also
  implicated in secondary carboxylic-ester hydrolysis of xenobiotic
  1-O-acyl-beta-D-glucuronide metabolites.
alternative_products:
- name: '1'
  id: Q6PE15-1
  description: >-
    Canonical 297-aa mitochondrial precursor containing the cleavable
    N-terminal transit peptide (residues 1-43) and intact Ser143-Asp240-His270
    catalytic triad in mature chain 44-297.
- name: '2'
  id: Q6PE15-2
  sequence_note: VSP_023893, VSP_023894
  description: >-
    C-terminally divergent splice variant that substitutes residue 269 and
    deletes residues 270-297, removing the catalytic general base His270 of the
    charge-relay triad.
