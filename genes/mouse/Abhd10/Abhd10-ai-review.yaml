- term:
    id: GO:0045454
    label: cell redox homeostasis
  evidence_type: IMP
  original_reference_id: PMID:37400491
  qualifier: involved_in
  review:
    summary: >-
      ABHD10 maintains hepatocyte mitochondrial redox homeostasis by
      S-depalmitoylating PRDX5 Cys100, and ectopic Abhd10 expression rescues
      oxidative liver injury in murine alcoholic liver disease models.
    action: NEW
    reason: >-
      With obsolete GO:0002084 modified to MF GO:0008474, mouse Abhd10 lacks a
      non-obsolete biological process for its core antioxidant function. In
      PMID:37400491 (building on PMID:31740833), ELK-3-mediated repression of
      Abhd10 in mouse alcoholic liver disease models elevates inhibitory
      S-palmitoylation of PRDX5 Cys100 and drives oxidative stress, while
      ectopic mouse Abhd10 overexpression restores PRDX5 depalmitoylation and
      ameliorates oxidative hepatotoxicity in vivo.
    additional_reference_ids:
    - PMID:31740833
    supported_by:
    - reference_id: PMID:37400491
      supporting_text: >-
        This ELK-3-mediated ABHD10 downregulation drives oxidative stress and
        disrupts mature hepatocyte function via enhancing S-palmitoylation of
        PRDX5's Cys100 residue. In vivo, ectopic Abhd10 overexpression
        ameliorates liver damage in ALD model mice.
    - reference_id: PMID:31740833
      supporting_text: >-
        We then find that ABHD10 regulates the S-palmitoylation status of the
        nucleophilic active site residue of PRDX5, providing a direct
        mechanistic connection between ABHD10-mediated S-depalmitoylation of
        PRDX5 and its antioxidant capacity.
- term:
    id: GO:0120317
    label: sperm mitochondrial sheath assembly
  evidence_type: IMP
  original_reference_id: PMID:41285782
  qualifier: acts_upstream_of_positive_effect
  review:
    summary: >-
      Matrix-resident ABHD10 acts enzymatically upstream of sperm midpiece
      mitochondrial sheath assembly by S-depalmitoylating outer-membrane sheath
      tethers SPATA19 and GK2 and metabolic subunit PDHX; Abhd10-null male mice
      develop severely disorganized mitochondrial sheaths and sterility.
    action: NEW
    reason: >-
      Zhou et al. (PMID:41285782) demonstrated that Abhd10 knockout male mice
      are completely sterile with severe defects in elongating spermatid
      mitochondrial sheath assembly and hyper-palmitoylation of outer
      mitochondrial membrane sheath tethering factors SPATA19 and GK2 as well
      as pyruvate dehydrogenase subunit PDHX. Because GFP-ABHD10 overexpression
      fails to induce mitochondrial aggregation directly, matrix ABHD10 does
      not physically tether mitochondria into the sheath (which is executed by
      SPATA19/GK2) and instead acts enzymatically upstream via protein
      S-depalmitoylation (GO:0008474) with qualifier
      acts_upstream_of_positive_effect.
    supported_by:
    - reference_id: PMID:41285782
      supporting_text: >-
        Collectively, ABHD10 may bind to and mediate the S-depalmitoylation of
        SPATA19, GK2, and PDHX, thereby regulating the formation of the sperm
        mitochondrial sheath and mitochondrial function.
    - reference_id: PMID:41285782
      supporting_text: >-
        Therefore, we overexpressed GFP-ABHD10 protein in 293T cells (Fig. 5k,
        l), but unfortunately, ABHD10 did not induce mitochondrial aggregation.
core_functions:
- description: >-
    Catalyzes S-depalmitoylation (GO:0008474, replacing obsoleted BP GO:0002084)
    of mitochondrial proteins in the mitochondrial matrix: directly executes
    cell redox homeostasis (GO:0045454) by cleaving inhibitory S-palmitoylation
    at active-site Cys100 of PRDX5 to sustain hydrogen peroxide scavenging, and
    acts enzymatically upstream of sperm mitochondrial sheath assembly
    (GO:0120317) by S-depalmitoylating outer-membrane sheath tethers SPATA19
    and GK2 and metabolic subunit PDHX rather than serving as a structural
    sheath-tethering protein.
