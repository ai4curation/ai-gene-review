- id: PMID:18614015
  title: A mitochondrial protein compendium elucidates complex I disease biology.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      MitoCarta proteomics and GFP tagging cataloged 1,098 mouse mitochondrial
      proteins including ABHD10 across 14 mouse tissues.
    supporting_text: >-
      Toward this goal, we performed mass spectrometry, GFP tagging, and machine
      learning to create a mitochondrial compendium of 1098 genes and their
      protein expression across 14 mouse tissues.
- id: PMID:22294686
  title: >-
    Human α/β hydrolase domain containing 10 (ABHD10) is responsible enzyme for
    deglucuronidation of mycophenolic acid acyl-glucuronide in liver.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      Human ABHD10 cleaves the carboxylic ester bond of AcMPAG (Km = 100.7 uM)
      but cannot cleave the phenolic O-glycoside MPAG.
    supporting_text: >-
      In fact, we found that the recombinant human ABHD10 could catalyze the
      deglucuronidation of AcMPAG, but could not catalyze the deglucuronidation
      of MPAG, a phenolic glucuronide of MPA (data not shown).
- id: PMID:22400490
  title: >-
    Competitive activity-based protein profiling identifies aza-β-lactams as a
    versatile chemotype for serine hydrolase inhibition.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      Competitive ABPP identified aza-beta-lactam ABL303 as a ~30 nM covalent
      inhibitor of mammalian ABHD10.
    supporting_text: >-
      ABPP-guided medicinal chemistry yielded a compound ABL303 that potently
      (IC(50) ≈ 30 nM) and selectively inactivated ABHD10 in vitro and in living
      cells.
- id: PMID:31740833
  title: >-
    ABHD10 is an S-depalmitoylase affecting redox homeostasis through
    peroxiredoxin-5.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      X-ray crystallography of purified mature mouse ABHD10 (PDB:6NY9, residues
      44-293) resolved a canonical alpha/beta-hydrolase domain with catalytic
      triad Ser100-His227-Asp197 (corresponding to Ser143-His270-Asp240 in
      full-length precursor Q6PE15).
    supporting_text: >-
      As expected, mature ABHD10 possesses a canonical α/β hydrolase domain with
      a catalytic triad formed by Ser100–His227–D197 (Fig. 4d,e).
- id: PMID:37400491
  title: >-
    The Elk-3 target Abhd10 ameliorates hepatotoxic injury and fibrosis in
    alcoholic liver disease.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      ELK-3 represses Abhd10 in mouse alcoholic liver disease models to increase
      PRDX5 Cys100 S-palmitoylation and oxidative stress, whereas ectopic Abhd10
      overexpression ameliorates hepatic injury in vivo.
    supporting_text: >-
      This ELK-3-mediated ABHD10 downregulation drives oxidative stress and
      disrupts mature hepatocyte function via enhancing S-palmitoylation of
      PRDX5's Cys100 residue. In vivo, ectopic Abhd10 overexpression ameliorates
      liver damage in ALD model mice.
- id: PMID:41285782
  title: >-
    The S-depalmitoylase ABHD10 is essential for sperm mitochondrial sheath
    formation and male fertility.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      Subcellular fractionation and immunoelectron microscopy in HA-tagged
      Abhd10 knock-in mouse testes show ABHD10 is specifically localized in the
      mitochondrial matrix and absent from mitochondria-depleted cytoplasm.
    supporting_text: >-
      Our data indicated that ABHD10 was specifically localized in the
      mitochondria of the testes (Fig. 5e).
  - statement: >-
      Immunoelectron microscopy of mouse testes confirms endogenous ABHD10
      residence in the mitochondrial matrix.
    supporting_text: >-
      Furthermore, we applied immunoelectron microscopy and confirmed that
      ABHD10 is localized in the mitochondrial matrix of testes (Fig. 5h).
  - statement: >-
      Abhd10 knockout mice exhibit male sterility, malformed sperm mitochondrial
      sheaths, and hyper-palmitoylation of SPATA19, GK2, PDHX, NDUFV1, and SDHB.
    supporting_text: >-
      Using mass spectrometry-based mitochondrial acyl-biotin exchange assays,
      we systematically identify that loss of ABHD10 leads to the
      hyper-palmitoylation of multiple functionally critical proteins, including
      mitochondrial sheath formation factors (SPATA19 and GK2) and aerobic
      respiration regulators (PDHX, NDUFV1 and SDHB).
  - statement: >-
      Overexpression of GFP-ABHD10 does not directly induce mitochondrial
      aggregation, indicating ABHD10 promotes mitochondrial sheath formation via
      enzymatic S-depalmitoylation of substrates rather than direct organelle
      tethering.
    supporting_text: >-
      Therefore, we overexpressed GFP-ABHD10 protein in 293T cells (Fig. 5k, l),
      but unfortunately, ABHD10 did not induce mitochondrial aggregation.
  - statement: >-
      HA-knock-in mouse characterization confirms mitochondrial matrix
      localization in vivo, although the claim that ABHD10 is "testis-specific"
      overstates tissue exclusivity relative to somatic and hepatic expression.
    supporting_text: >-
      In this study, we inserted an HA tag into ABHD10 gene, confirming that
      ABHD10 is a testis-specific protein expressed in the mitochondrial matrix
      in vivo.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:18614015
      - PMID:22294686
      - PMID:37400491
      review_notes: >-
        While mitochondrial matrix residence and strong adult germ-cell
        enrichment in HA-knock-in mice are solidly demonstrated, describing
        ABHD10 as "testis-specific" conflicts with MitoCarta mass-spectrometry
        detection of mouse ABHD10 across 14 mouse tissues (PMID:18614015),
        functional hepatic Abhd10 expression and ELK-3-mediated regulation in
        murine liver (PMID:37400491), and biochemical purification of mammalian
        ABHD10 from liver (PMID:22294686).
      supported_by:
      - reference_id: PMID:18614015
        supporting_text: >-
          Toward this goal, we performed mass spectrometry, GFP tagging, and
          machine learning to create a mitochondrial compendium of 1098 genes
          and their protein expression across 14 mouse tissues.
      - reference_id: PMID:37400491
        supporting_text: >-
          This ELK-3-mediated ABHD10 downregulation drives oxidative stress and
          disrupts mature hepatocyte function via enhancing S-palmitoylation of
          PRDX5's Cys100 residue. In vivo, ectopic Abhd10 overexpression
          ameliorates liver damage in ALD model mice.
      - reference_id: PMID:22294686
        supporting_text: >-
          Recombinant ABHD10 expressed in Sf9 cells efficiently deglucuronidated
          AcMPAG with a K(m) value of 100.7 ± 10.2 μM, which was similar to
          those in HLM, HLC, and human liver homogenates (HLH).
