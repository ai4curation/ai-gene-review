- term:
    id: GO:0004613
    label: phosphoenolpyruvate carboxykinase (GTP) activity
  evidence_type: EXP
  original_reference_id: PMID:11792850
  qualifier: enables
  review:
    summary: GTP-dependent phosphoenolpyruvate carboxykinase activity, the defining catalytic activity
      of Pck1.
    action: ACCEPT
    reason: This is the core molecular function. UniProt records experimentally supported catalysis of
      oxaloacetate + GTP = PEP + GDP + CO2 for the mouse enzyme (PMID:11792850, PMID:29230018, PMID:30193097).
      PMID:30193097 shows the reaction runs in both directions depending on Lys91 acetylation. Mouse knockouts
      (PMID:10938127, PMID:15347677) abolish the PEPCK-dependent fluxes, and the IBA places the activity
      at the PEPCK-GTP family root. Rows from every evidence source agree.
    supported_by: &id005
    - *id002
    - &id045
      reference_id: PMID:30193097
      supporting_text: dynamic acetylation of PCK1 interconverts the enzyme between gluconeogenic and
        anaplerotic activities.
    - &id042
      reference_id: PMID:10938127
      supporting_text: Mice that lack this enzyme die within 3 days of birth, while mice with at least
        a 90% global reduction of PEPCK, or a liver-specific knockout of PEPCK, are viable.
    - &id013
      reference_id: PMID:15347677
      supporting_text: gluconeogenesis from tricarboxylic acid (TCA) cycle intermediates was nearly absent
