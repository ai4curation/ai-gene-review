- term:
    id: GO:0106264
    label: protein serine kinase activity (using GTP as donor)
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P35558
  - ensembl:ENSP00000319814
  - RHEA:64020
  review:
    summary: Protein serine kinase activity using GTP as donor, transferred from the single human PCK1/INSIG
      study.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'This row traces to a single human study, PMID:32322062 (Xu et al. 2020): in human hepatocellular
      carcinoma cells, AKT phosphorylates PCK1 at Ser90, and PCK1 then moves to the ER and uses GTP to
      phosphorylate INSIG1 Ser207 and INSIG2 Ser151. The only independent follow-up we found is PMID:39433189,
      a study of PRRSV infection in monkey MARC-145 cells. We found no mouse experiment on Pck1 protein
      kinase activity, Ser90 phosphorylation or INSIG phosphorylation. UniProt carries the mouse kinase
      activity only ''By similarity'' to human P35558. All three mouse rows are transfers of that one
      human finding: ISO (GO_REF:0000119) and ISS (GO_REF:0000024) from P35558, and the IEA (GO_REF:0000120)
      from the UniProt ''By similarity'' catalytic-activity line (RHEA:64020). They are not independent
      evidence. A protein kinase activity for a metabolic enzyme, shown in one cancer-cell context and
      reproduced only in a virus-infected monkey cell line, does not establish a function of mouse Pck1.
      PEPCK-C has no protein kinase fold. The proposed mechanism, an AKT-induced switch of the active
      site to protein substrates, has not been tested in mouse tissue. MARK_AS_OVER_ANNOTATED is preferred
      over KEEP_AS_NON_CORE because keeping it would assert an activity for which there is no mouse evidence.
      It is not REMOVE because we cannot refute the human finding. (The abstract''s ''tumorigenesis in
      mice'' appears to be human HCC xenograft work, not mouse Pck1 data; the full text is not cached.)'
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: UniProtKB:P35558
        source_label: PCK1 (human)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: UniProt RHEA:64020 line on mouse is ECO:0000250 from P35558, i.e. the same single study.
    supported_by: &id049
    - *id019
    - *id047
    - *id048
