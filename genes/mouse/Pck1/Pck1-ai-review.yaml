- term:
    id: GO:0072350
    label: tricarboxylic acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P35558
  - ensembl:ENSP00000319814
  review:
    summary: Tricarboxylic acid metabolic process (cataplerosis/anaplerosis).
    action: MODIFY
    reason: 'The biology is sound: PEPCK-C is the main cataplerotic enzyme of liver and kidney, removing
      TCA-cycle carbon as oxaloacetate/PEP. Without hepatic Pck1, TCA-cycle intermediates accumulate and
      TCA flux falls (PMID:15347677), and acetylation reverses it to an anaplerotic role (PMID:30193097).
      The term is wrong, though: GO:0072350 is defined as metabolism of acids with three carboxyl groups,
      and its only children are citrate and isocitrate metabolic process. Pck1 acts on oxaloacetate (a
      dicarboxylic acid) and PEP. GO:0006107 oxaloacetate metabolic process, which Pck1 already carries,
      states the cataplerotic role correctly. Same verdict as the human PCK1 donor row.'
    supported_by: &id046
    - *id044
    - reference_id: file:mouse/Pck1/Pck1-uniprot.txt
      supporting_text: Regulates cataplerosis and anaplerosis, the processes that control the levels of
        metabolic intermediates in the citric acid cycle
    - *id045
    proposed_replacement_terms:
    - id: GO:0006107
      label: oxaloacetate metabolic process
