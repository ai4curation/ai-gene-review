suggested_questions:
- question: Is Ser90 of mouse Pck1 phosphorylated by AKT in liver or adipose tissue in vivo, and does
    any Pck1 pool associate with the ER under physiological insulin signalling?
- question: Should GO-CAM-to-GAF conversion emit acts_upstream_of_or_within annotations to every downstream
    process when the upstream edge is 'directly negatively regulates'? For PCK1 this produced GO:0036316
    SREBP-SCAP complex retention in ER, a process the model says PCK1 inhibits.
- question: Does GO:0004550 nucleoside diphosphate kinase activity on rat Pck1 (RGD:3267) reflect a physiologically
    relevant reaction, or a partial reaction of the PEPCK mechanism measured in vitro?
suggested_experiments:
- description: Knock in Pck1 S90A (and phosphomimetic S90D) in mice, then measure hepatic and adipose
    INSIG1/2 phosphorylation, SREBP processing and de novo lipogenesis under fed and insulin-stimulated
    conditions. This would test whether the human HCC protein kinase mechanism operates in a normal tissue.
- description: Assay purified mouse Pck1 (with or without Ser90 phosphorylation) for GTP-dependent phosphorylation
    of INSIG1/2 peptides in vitro, alongside catalytically dead active-site mutants. This would test whether
    the kinase activity uses the PEPCK active site.
