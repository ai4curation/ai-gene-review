- term:
    id: GO:0006114
    label: glycerol biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P07379
  - ensembl:ENSRNOP00000030913
  review:
    summary: Glycerol biosynthetic process (glyceroneogenesis).
    action: ACCEPT
    reason: GO folded glyceroneogenesis into this term when it obsoleted GO:0046327 'glycerol biosynthetic
      process from pyruvate' (exact synonym 'glyceroneogenesis', replaced_by GO:0006114). Mouse genetics
      show that PEPCK-C drives adipose glyceroneogenesis. Ablating adipose expression via the PPARE promoter
      mutation reduces triglyceride deposition (PMID:11792850), and adipose overexpression increases glyceroneogenesis
      and fatty-acid re-esterification (PMID:11872659).
    supported_by: &id018
    - &id020
      reference_id: PMID:11792850
      supporting_text: the role of PEPCK-C in the regulation of glyceroneogenesis, a pathway critical
        for maintaining the deposition of triglycerides in adipose tissue.
    - &id036
      reference_id: PMID:11872659
      supporting_text: Transgenic mice showed a chronic increase in PEPCK activity, which led to increased
        glyceroneogenesis, re-esterification of free fatty acids (FFAs), increased adipocyte size and
        fat mass, and higher body weight.
