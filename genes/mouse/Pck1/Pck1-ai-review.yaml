  supporting_entities:
  - UniProtKB:P35558
  review:
    summary: SREBP-SCAP complex retention in ER, projected from human PCK1 through a GO-CAM-derived causal-upstream
      annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Provenance chain: the human GO-CAM gomodel:6205c24300000880 (SREBP regulation) models PCK1
      GO:0106264 activity as directly NEGATIVELY regulating (RO:0002630) the sterol-binding activities
      of INSIG1 and INSIG2. Those INSIG activities are part_of GO:0036316 SREBP-SCAP complex retention
      in ER, and further downstream the model has SCAP, MBTPS1/2 (GO:0051604 protein maturation), KPNB1
      (GO:0006607 NLS-bearing protein import into nucleus) and SREBF1/2 (GO:0045542 positive regulation
      of cholesterol biosynthetic process). The GO-CAM-to-GAF conversion gave PCK1 an ''acts upstream
      of or within'' annotation to each downstream process, and these were projected to mouse Pck1 by
      ISO (GO_REF:0000119, with UniProtKB:P35558). The current human PCK1 GOA file has no row for GO:0036316,
      so the mouse row is also stale with respect to its source. This row traces to a single human study,
      PMID:32322062 (Xu et al. 2020): in human hepatocellular carcinoma cells, AKT phosphorylates PCK1
      at Ser90, and PCK1 then moves to the ER and uses GTP to phosphorylate INSIG1 Ser207 and INSIG2 Ser151.
      The only independent follow-up we found is PMID:39433189, a study of PRRSV infection in monkey MARC-145
      cells. We found no mouse experiment on Pck1 protein kinase activity, Ser90 phosphorylation or INSIG
      phosphorylation. UniProt carries the mouse kinase activity only ''By similarity'' to human P35558.
      Three problems follow. (1) Role: GO:0036316 is carried out by INSIG binding sterol-loaded SCAP.
      PCK1 is not part of the retention machinery, and its only connection is as an upstream modifier
      of INSIG. (2) Sign: the reported effect is the opposite of retention. INSIG phosphorylation reduces
      sterol binding and releases SCAP-SREBP to the Golgi, so PCK1 would, if anything, antagonise retention.
      An ''acts upstream of or within'' annotation hides that sign. (3) Context: the evidence is one human
      cancer-cell study plus a monkey-cell virus-infection study, with nothing in mouse. Pck1''s established
      role is GTP-dependent PEP carboxykinase activity in gluconeogenesis, glyceroneogenesis and cataplerosis.
      No replacement SREBP-pathway term is proposed for mouse Pck1. (The abstract''s ''tumorigenesis in
      mice'' appears to be human HCC xenograft work, not mouse Pck1 data; the full text is not cached.)'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - REGULATORY_SIGN_INVERSION
      - CONTEXT_OR_TISSUE_MISMATCH
