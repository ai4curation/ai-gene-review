id: Q9Z2V4
gene_symbol: Pck1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Pck1 encodes the cytosolic, GTP-dependent phosphoenolpyruvate carboxykinase (PEPCK-C), a
  Mn2+-requiring enzyme that converts oxaloacetate and GTP to phosphoenolpyruvate, GDP and CO2. This is
  the committed step that removes carbon from the tricarboxylic acid cycle (cataplerosis) for glucose
  and glycerol synthesis. In liver and kidney proximal tubule it drives gluconeogenesis from lactate,
  amino acids and TCA-cycle intermediates and supports renal ammoniagenesis and acid-base balance. In
  white and brown adipose tissue it drives glyceroneogenesis, which supplies glycerol 3-phosphate for
  triglyceride re-esterification. Its expression is under strong hormonal control (induced by glucagon/cAMP
  and glucocorticoids, repressed by insulin), and acetylation of Lys91 under high glucose shifts it toward
  the reverse, anaplerotic reaction. Complete loss is lethal shortly after birth, liver-specific loss
  abolishes hepatic gluconeogenesis from TCA intermediates and causes fasting steatosis, and the kidney
  compensates. Pck1 is also upregulated in memory CD8+ T cells, where its gluconeogenic flux feeds glycogen
  and the pentose phosphate pathway. Work in human cancer cells has proposed that the AKT-phosphorylated
  enzyme acts as a GTP-dependent protein kinase on INSIG1/2, but this has not been examined in mouse.
