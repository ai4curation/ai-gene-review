- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0003067
  - MGI:MGI:1860456
  - MGI:MGI:97501
  - PANTHER:PTN000169226
  - RGD:1311112
  - RGD:3267
  - UniProtKB:P35558
  review:
    summary: Gluconeogenesis; Pck1 catalyses the committed conversion of oxaloacetate to PEP.
    action: ACCEPT
    reason: This is the core process. Liver-specific Pck1 knockout nearly abolishes gluconeogenesis from
      TCA-cycle intermediates, amino acids and lactate (PMID:15347677). Renal gluconeogenesis rises to
      compensate (PMID:34156032), and kidney-specific deletion disturbs glucose/lactate handling (PMID:37102687).
      The IDA rows (ATF3 transgenic, PMID:11916968; HIF-1alpha liver KO, PMID:19643083) report reduced
      gluconeogenesis that follows reduced PEPCK expression. They are weaker, but the curators' call is
      consistent with the rest of the evidence.
    supported_by: &id016
    - &id044
      reference_id: PMID:15347677
      supporting_text: Disruption of hepatic cataplerosis due to loss of PEPCK leads to the accumulation
        of TCA cycle intermediates and a nearly complete blockage of gluconeogenesis from amino acids
        and lactate
    - &id028
      reference_id: PMID:34156032
      supporting_text: Glucose homeostasis was maintained by a compensatory rise in renal glucose production
        and gluconeogenesis.
    - &id034
      reference_id: PMID:37102687
      supporting_text: PCK1 is essential for kidney tubular cell acid-base control, mitochondrial function,
        and glucose/lactate homeostasis.
    - *id011
