- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1860456
  - PANTHER:PTN000169230
  - UniProtKB:Q16822
  review:
    summary: Mitochondrion, inherited by IBA from PANTHER node PTN000169230.
    action: REMOVE
    reason: 'Vertebrates have two PEPCK-GTP isozymes: the cytosolic Pck1 and the mitochondrial Pck2. The
      IBA donors (MGI:1860456 = Pck2, UniProtKB:Q16822 = human PCK2) are both the mitochondrial paralog.
      Mouse Pck1 is the cytosolic form. It has no mitochondrial transit peptide, and every experimental
      localization (IDA cytosol, PMID:19458124) and the UniProt curated location place it in the cytosol.
      The mitochondrial localization of the ancestral node was lost on the PCK1 branch after the duplication,
      so the inheritance does not apply to this gene.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      residue_claims_not_applicable: Compartment divergence between paralogs (presence/absence of an N-terminal
        mitochondrial targeting region), not a point-residue question.
      source_entities:
      - source_id: PANTHER:PTN000169230
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node seeded only by PCK2 (mitochondrial) members; PCK1 branch is cytosolic.
      - source_id: MGI:MGI:1860456
        source_label: Pck2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse mitochondrial paralog; mitochondrial localization correct for Pck2 only.
      - source_id: UniProtKB:Q16822
        source_label: PCK2 (human)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human mitochondrial paralog.
    supported_by:
    - *id009
    - reference_id: file:mouse/Pck1/Pck1-uniprot.txt
      supporting_text: 'In eukaryotes there are two isozymes: a cytoplasmic one and a mitochondrial one.'
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: PMID:19458124
  qualifier: is_active_in
  review:
    summary: Endoplasmic reticulum localization.
    action: KEEP_AS_NON_CORE
    reason: Pck1 is predominantly cytosolic. The ER association comes from the human HCC study (PMID:32322062),
      where the AKT Ser90-phosphorylated pool moves to the ER. UniProt transfers this to mouse 'By similarity'.
      There is also a mouse IDA from PMID:19458124, whose full text we could not read (the abstract describes
      only mRNA and transporter data). We defer to that curator rather than remove the row. Because the
      ER pool is minor and conditional, all ER rows are kept as non-core. They do not imply the kinase
      function, which is reviewed separately.
    supported_by: &id010
    - reference_id: file:mouse/Pck1/Pck1-uniprot.txt
      supporting_text: Note=Phosphorylation at Ser-90 promotes translocation to the endoplasmic reticulum.
    - &id019
      reference_id: PMID:32322062
      supporting_text: activated AKT in human hepatocellular carcinoma (HCC) cells phosphorylates cytosolic
        phosphoenolpyruvate carboxykinase 1 (PCK1), the rate-limiting enzyme in gluconeogenesis, at Ser90.
        Phosphorylated PCK1 translocates to the endoplasmic reticulum, where it uses GTP as a phosphate
        donor to phosphorylate INSIG1 at Ser207 and INSIG2 at Ser151.
