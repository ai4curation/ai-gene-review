    summary: Nucleoside diphosphate kinase activity, projected from rat Pck1 (RGD:3267).
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0004550 is ATP + NDP = ADP + NTP. PEPCK-C transfers the gamma-phosphoryl of GTP to the
