      There is also a mouse IDA from PMID:19458124, whose full text we could not read (the abstract describes
      only mRNA and transporter data). We defer to that curator rather than remove the row. Because the
      ER pool is minor and conditional, all ER rows are kept as non-core. They do not imply the kinase
      function, which is reviewed separately.
    supported_by: *id010
