- term:
    id: GO:0008180
    label: COP9 signalosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Grb2 is reported associated with the COP9 signalosome, but it is not an established CSN subunit; the assignment is uninformative for Grb2's adaptor function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Not a mis-transfer of complex membership: the WITH/FROM for this row is only
      Grb2 itself (MGI:MGI:95805) and human GRB2 (UniProtKB:P62993) at the
      GRB2-clade node PANTHER:PTN005273574, with no COP9 signalosome subunit
      (COPS1-COPS8) and no CSN-subunit family anywhere in it, so the propagation
      step is a faithful GRB2-to-GRB2 ortholog transfer rather than a pattern-10
      leak from a CSN family node. What is over-scoped is the source annotation:
      GRB2 is a 25 kDa SH3-SH2-SH3 adapter, not one of the eight canonical CSN
      subunits, so the part_of qualifier asserts structural membership where an
      association is what is documented, and the term says nothing about Grb2's
      adaptor function. Kept rather than removed because the mouse row does carry
      experimental (IDA) evidence whose full text is not available here.
    supported_by:
    - reference_id: UniProt:Q60631
      supporting_text: 'FUNCTION: Non-enzymatic adapter protein that plays a pivotal role in precisely regulated signaling cascades from cell surface receptors to cellular responses. Engagement of the TCR leads to phosphorylation of LAT, which serves as docking site for GRB2. In turn, GRB2 establishes a connection with SOS1 that acts as a guanine nucleotide exchange factor and serves as a critical regulator of KRAS/RAF1 leading to MAPKs translocation to the nucleus and activation. DOMAIN: The SH3 domains mediate interaction with RALGPS1 and SHB.'
    - reference_id: file:mouse/Grb2/Grb2-deep-research-falcon.md
      supporting_text: Grb2 is primarily cytosolic but is recruited to signaling complexes at the **plasma membrane** upon receptor activation, including immune microdomains; it also participates in **endocytosis/endosomes** and is described across **cytoplasm, membrane, endosomes, and nucleus** in RTK-activated contexts.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN005273574
        source_status: SUPPORTS_TRANSFER
        comment: >-
          This is specifically NOT a pattern-10 mis-transfer of complex membership.
          The whole WITH/FROM is GRB2 itself (MGI:MGI:95805) plus its human ortholog
          (UniProtKB:P62993) at the GRB2-clade node of PTHR46037; no COP9 signalosome
          subunit (COPS1-COPS8) and no CSN-subunit family appears anywhere in it, so
          the propagation step is a faithful GRB2-to-GRB2 ortholog transfer with no
          complex-membership leak from a CSN family node. The reservation lies in the
          scope of the source annotation rather than in the propagation: GRB2 is a
          25 kDa SH3-SH2-SH3 adapter and not one of the eight canonical CSN subunits,
          so a part_of qualifier states structural membership of the complex where an
          association is what is actually documented.
      - source_id: MGI:MGI:95805
        source_label: Grb2
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target's own IBD seed. Mouse Grb2 carries its own experimental
          annotation for GO:0008180 (IDA, PMID:22561606), which is one of the
          descendant evidences behind the IBD at this node, so its presence here is
          expected. The cached record for that publication is abstract-only
          (a Tespa1/TCR-signalling study), so the CSN association could not be read in
          full here; per the project's rule on not overruling curators from incomplete
          evidence the row is kept as over-annotated rather than removed.
      - source_id: UniProtKB:P62993
        source_label: GRB2
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Human GRB2, the target's direct ortholog and the origin of the mouse ISO and
