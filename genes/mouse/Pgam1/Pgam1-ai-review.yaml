  evidence_type: IDA
  original_reference_id: PMID:24958256
  qualifier: involved_in
  review:
    summary: Pgam1 catalyzes the reversible phosphoglycerate-mutase step used in the cytosolic phase
      of gluconeogenesis.
    action: ACCEPT
    reason: Pgam1 is expressed in liver and kidney and catalyzes the reversible cytosolic
      phosphoglycerate-mutase step that converts 2-phosphoglycerate to 3-phosphoglycerate in the
      gluconeogenic direction. PMID:24958256 is transcriptomic and supports expression rather than
      direct activity, so a source defect records that the MGI row should be IEP rather than IDA.
    supported_by:
    - *id008
    - reference_id: PMID:11250083
      supporting_text: Pgam1 was expressed as a 2.1-kb transcript highly in brain and kidney and
        moderately in liver
    - *id002
    - reference_id: PMID:24958256
      supporting_text: Pgam1 = 1.6-fold, p = 0.0057; Aldoc = 2.7-fold, p = 0.0008
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: MGI
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: IDA
      corrected_value: IEP
      corrected_label: inferred from expression pattern
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The MGI involved_in GO:0006094 gluconeogenesis row on Pgam1 cites Collino et al. 2013
        (PMID:24958256) as IDA. The full text reports increased hepatic Pgam1 mRNA abundance in
        calorie-restricted C57BL/6J mice as part of a transcriptomic signature favoring
        gluconeogenesis, but it does not directly assay Pgam1 enzyme activity or gluconeogenic
        flux. The evidence is an expression-pattern observation (IEP), not IDA.
      supported_by:
      - reference_id: PMID:24958256
        supporting_text: Pgam1 = 1.6-fold, p = 0.0057; Aldoc = 2.7-fold, p = 0.0008
