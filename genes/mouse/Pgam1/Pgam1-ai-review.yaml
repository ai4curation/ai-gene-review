    Restriction (CR) Regulation across Multiple Mouse Strains.
  findings:
  - statement: Calorie restriction increased liver Pgam1 transcript abundance in C57BL/6J mice; the
      study used this as a transcriptomic marker in a hepatic gluconeogenesis signature rather than
      assaying Pgam1 enzyme flux directly.
