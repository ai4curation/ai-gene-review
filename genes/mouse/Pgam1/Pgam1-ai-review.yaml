  title: 'Mouse phosphoglycerate mutase M and B isozymes: cDNA cloning, enzyme activity assay and mapping.'
  findings:
  - statement: Cloned mouse Pgam1 and Pgam2 cDNAs; transient expression of each ORF in COS7 cells
      increased phosphoglycerate-mutase activity, confirming the encoded enzymes.
