id: Q9DBJ1
gene_symbol: Pgam1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Pgam1 encodes the broadly expressed B/brain isoform of 2,3-bisphosphoglycerate-dependent
  phosphoglycerate mutase, a soluble histidine-phosphatase-family enzyme that reversibly interconverts
  3-phosphoglycerate and 2-phosphoglycerate in the cytosol. This reversible EC 5.4.2.11 reaction is a
  core lower-glycolysis step and can run in the opposite direction during gluconeogenesis and glyceroneogenesis
  in tissues that use those pathways. The mouse protein also has a plausible reduced bisphosphoglycerate-mutase
  side activity by orthology to human PGAM1, but its defining role is cytosolic phosphoglycerate mutase
  activity.'
