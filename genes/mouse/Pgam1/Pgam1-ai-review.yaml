suggested_questions:
- question: Is the weak bisphosphoglycerate-mutase side activity detected for human PGAM1 measurable
    for mouse Pgam1 under physiological 2,3-bisphosphoglycerate concentrations, or should EC 5.4.2.4
    be restricted to BPGM and PGAM2-family members in mouse curation?
- question: Does the Pgam1 pool that supports hepatic gluconeogenesis under fasting or calorie
    restriction change at the protein/activity level, or is the observed calorie-restriction
    signature limited to mRNA abundance?
suggested_experiments:
- description: Measure 3-phosphoglycerate to 2-phosphoglycerate flux in primary mouse hepatocytes
    after acute Pgam1 depletion during gluconeogenic substrate challenge to separate direct Pgam1
    contribution from compensatory changes in adjacent glycolytic enzymes.
