  review:
    action: REMOVE
    summary: The selected product lacks the intact seven-transmembrane G-protein-coupling module. Retaining
      the extracellular ligand-binding region does not preserve autonomous GPCR activity. This is an exact-product
      domain-loss argument, not a claim that the longer Vmn2r73 receptor is inactive.
