core_functions: []
suggested_questions:
- question: Is the ENSMUST00000232965 transcript (A0A3B2WCZ5) translated in vomeronasal neurons, or is it
    a minor or NMD-targeted splice product of Vmn2r73?
- question: If made, is the 496-residue Venus-flytrap-only product secreted, or held at the cell surface
    by dimerisation with a full-length V2R, as class C extracellular domains can dimerise?
suggested_experiments:
- description: Long-read RNA-seq or isoform-specific RT-PCR of mouse vomeronasal organ to measure the
    abundance of the Vmn2r73-203 junction (skipping canonical exon sequence encoding residues 430-505)
    relative to the canonical Vmn2r73-201 transcript, followed by proteomics or an epitope-tagged allele
    to test whether the short protein accumulates.
