id: A0A3B2WCZ5
gene_symbol: Vmn2r73
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Vmn2r73 is a mouse vomeronasal type-2 (V2R) receptor gene, a member of the class C
  G-protein-coupled receptor superfamily related to calcium-sensing and metabotropic
  glutamate receptors. It belongs to a rodent-specific clade of family-A V2Rs clustered on
  chromosome 7 (Vmn2r66 to Vmn2r79). The canonical 851-residue product has a signal peptide,
  a Venus-flytrap ligand-binding domain, a nine-cysteine linker and a seven-transmembrane
  domain, and by family inference acts as an orphan chemosensory receptor in basal
  vomeronasal sensory neurons; no ligand, expression pattern or phenotype has been reported
  for this gene. The 496-residue product A0A3B2WCZ5, encoded by an alternative transcript,
  shares the first 429 residues with the canonical product and retains the signal peptide,
  ligand-binding domain and nine-cysteine domain, but lacks all seven transmembrane helices
  and ends in a short divergent tail. It is therefore predicted to be a soluble ectodomain
  that cannot itself couple to G proteins; whether it is translated, secreted, or associates
  with full-length V2Rs is unknown.
