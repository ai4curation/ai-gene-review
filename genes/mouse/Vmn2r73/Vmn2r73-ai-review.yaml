  review:
    action: REMOVE
    summary: >-
      InterPro2GO mapping from family-level class C GPCR signatures that match the
      extracellular region. This product lacks every transmembrane helix of the canonical
      Vmn2r73 receptor, and class C G-protein coupling is carried out by the 7TM domain, so the
      product cannot have GPCR activity. The removal applies to this alternative product only;
      the canonical D3Z7M3 product is predicted to be a functional receptor.
    reason: >-
      Sequence comparison with the canonical 851-residue product (D3Z7M3) shows that
      A0A3B2WCZ5 is identical over residues 1-429 and then retains only the nine-cysteine
      segment; none of the seven reference TM helices is retained, and a Kyte-Doolittle scan
      finds no hydrophobic window after the signal peptide. In class C receptors the
      extracellular VFT binds ligand while the 7TM domain couples to G proteins, so a product
      without the 7TM cannot transduce through G proteins. The IPR000337/IPR000068/IPR011500
      signatures match the ectodomain and do not report the presence of the 7TM.
