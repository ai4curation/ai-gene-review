      while the separate seven-transmembrane domain couples to G proteins. The study concerns mGlu5,
      not Vmn2r73, and is used only for the class C domain architecture.
    supporting_text: Family C receptors are unusual in that, besides the GPCR-defining 7TM domain, they
      possess relatively large amino-terminal extracellular domains (ECDs) that form obligate dimers and
      contain the orthosteric ligand binding sites
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. It is a class C receptor structural study of mGlu5, a member of the
      same PANTHER family (PTHR24061) but a different subfamily from Vmn2r73. Only the shared domain
      architecture is used here, not mGlu-specific ligand or G-protein specificity.
