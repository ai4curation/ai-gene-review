id: A0A3B2WCZ5
gene_symbol: Vmn2r73
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: The selected mouse Vmn2r73 product contains the extracellular ligand-binding portion of a
  class C vomeronasal receptor but lacks the intact seven-transmembrane signaling module of the longer
  same-gene product. A signal peptide is retained. Its ligand specificity, expression as a stable protein,
  trafficking and possible interaction with other receptor subunits have not been established.
