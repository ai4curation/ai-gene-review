  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: >-
      Derived from an ARBA rule that assigns "Cell membrane; Multi-pass membrane protein",
      which is inapplicable to a product with no transmembrane segment. With a signal peptide
      and no membrane anchor, the product is predicted to enter the secretory pathway as a
      soluble ectodomain. Cell-surface retention through association with a full-length V2R is
      conceivable but untested.
    reason: >-
      The location is inherited from the full-length receptor architecture. The product has a
      SignalP signal peptide (1-18) and no hydrophobic window that could serve as a TM anchor,
      so plasma-membrane localization is not supported for this product.
    supported_by:
