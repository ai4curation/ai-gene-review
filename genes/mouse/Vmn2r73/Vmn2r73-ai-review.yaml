      Inferred from the same class C GPCR signatures as the GPCR activity row. Without a 7TM
      domain this product cannot act as the receptor in G-protein-coupled signaling. An
      accessory role, such as a soluble ligand-binding decoy or a partner of full-length V2Rs,
