core_functions: []
suggested_questions:
- question: Is the Vmn2r73-203 transcript encoding the 496-residue product expressed in
    vomeronasal sensory neurons at a level comparable to the canonical transcript, and is
    the protein translated and secreted?
- question: Could a soluble V2R ectodomain such as A0A3B2WCZ5 dimerise with full-length V2Rs
    via the VFT and modulate their trafficking or ligand sensitivity?
- question: What ligand does the canonical Vmn2r73 receptor (or any member of the rodent
    Vmn2r66-Vmn2r79 clade) detect?
suggested_experiments:
- description: Long-read RNA sequencing of mouse vomeronasal organ to quantify Vmn2r73-203
    relative to Vmn2r73-201, followed by epitope-tagged expression in HEK293 cells to test
    secretion of the 496-residue product.
  experiment_type: transcript and protein expression analysis
- description: Co-expression of the 496-residue product with full-length Vmn2r73 and a family-C
    V2R, assaying surface expression and co-immunoprecipitation.
  experiment_type: protein interaction assay
