suggested_questions:
- question: Does mir-100 have any role in the auditory or synaptic processes it is
    currently annotated to, or are those annotations purely a consequence of its
    abundance in profiling studies?
  experts:
  - microRNA biologists
  - auditory neuroscientists
- question: Which mir-100 targets besides Smarca5 mediate its effect on stem cell
    differentiation?
  experts:
  - stem cell biologists
suggested_experiments:
- description: Conditional mir-100 deletion in the inner ear with auditory brainstem
    response measurement across ageing
  experiment_type: mouse genetics
  hypothesis: Loss of mir-100 does not alter hearing thresholds, confirming that the
    ageing-survey annotation reflects correlation rather than function
- description: Ago CLIP in embryonic stem cells during LIF withdrawal, comparing
    wild-type and mir-100-null cells
  experiment_type: high-throughput sequencing
  hypothesis: Smarca5 is one of a small set of mir-100-dependent targets that change
    Argonaute occupancy during differentiation
