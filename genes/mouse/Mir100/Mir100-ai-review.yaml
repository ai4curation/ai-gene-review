- term:
    id: GO:2000738
    label: positive regulation of stem cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:20439489
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      The functionally validated role from this paper, established by anti-miR
      suppression and overexpression.
    action: ACCEPT
    reason: >-
      miR-100 is one of the three miRNAs the study tested rather than merely
      profiled: suppression by anti-miRs blocked ESC differentiation and
      overexpression altered differentiation markers. This is the correct
      representation of what the paper shows about mir-100, and it is the reason
      the LIF row below is redundant as well as unsupported.
    supported_by:
    - reference_id: PMID:20439489
      supporting_text: These results demonstrate that miR-34a, miR-100, and miR-137
        are required for proper differentiation of mouse ESCs
    - reference_id: PMID:20439489
