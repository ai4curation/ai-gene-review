  original_reference_id: PMID:25858512
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      mir-100 is not discussed anywhere in the cited paper; the row reflects
      membership of the detected-miRNA set.
    action: REMOVE
    reason: >-
      The bottom tier of the 130-member IEP batch from this study. The paper
      detected 372 miRNAs, found 12 that changed, and functionally validated
      three; miR-100 is in none of those groups and the PMC full text does not
      mention it. The only fact behind this annotation is that mir-100 was
      present at detectable levels in hippocampal slices, which is true of
      hundreds of miRNAs and says nothing about LTP.
    supported_by:
    - reference_id: PMID:25858512
      supporting_text: Of the 12 miRNAs changed in LTP, 6 were down- and 6 were upregulated
    - reference_id: PMID:25858512
      supporting_text: we identified 372 miRNAs
