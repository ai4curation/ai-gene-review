        block of ESC differentiation induced by LIF withdrawal
- term:
    id: GO:1990830
    label: cellular response to leukemia inhibitory factor
  evidence_type: IEP
  original_reference_id: PMID:20439489
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Batch expression row from the same paper whose validated finding is already
      captured by the IMP annotation above; the term also misdescribes the
      experiment.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This row and the IMP row above come from the same paper, and the contrast
      is the point. The IMP row records what was demonstrated - miR-100 is
      required for ESC differentiation via Smarca5. This IEP row is one of 291
      annotations to a single term generated from the same study's expression
      survey. The term is also a poor description of the experiment: LIF was
      withdrawn to induce differentiation, so the miRNAs went up in the absence
      of LIF, which is not a cellular response to LIF. Even for a miRNA the paper
      did validate, the batch row adds a wrong term rather than support.
    proposed_replacement_terms:
    - id: GO:2000738
      label: positive regulation of stem cell differentiation
    supported_by:
    - reference_id: PMID:20439489
      supporting_text: The suppression of these three miRNAs by anti-miRs caused the
        block of ESC differentiation induced by LIF withdrawal
- term:
    id: GO:0007605
    label: sensory perception of sound
  evidence_type: IEP
  original_reference_id: PMID:23646144
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Derived from an ageing expression survey that never names mir-100, and
      pointed at normal hearing when the study is about its loss.
    action: REMOVE
    reason: >-
      Two independent problems. First, the PMC full text of the cited paper
      contains no mention of miR-100, so the annotation comes from a
      supplementary microarray table listing miRNAs whose abundance shifted with
      age; nothing connects mir-100 to auditory function. Second, the study is
      about degeneration of the organ of Corti during age-related hearing loss,
      and its own conclusion is explicitly correlative - expression changes
      precede functional change. Annotating mir-100 as acting upstream of or
      within the normal process of sound perception inverts what was measured.
      One of 100 IEP rows to this term from this paper.
    supported_by:
    - reference_id: PMID:23646144
      supporting_text: Our study suggests that changes in miRNA expression precede
        morphological and functional changes
    - reference_id: PMID:23646144
      supporting_text: We showed that 111 and 71 miRNAs exhibited differential expression
        in the C57 and CBA mice, respectively
