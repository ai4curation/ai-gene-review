id: URS000075B831_10090
gene_symbol: Mir100
product_type: MIRNA
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mir100 encodes the mouse mir-100 precursor. Its mature product is a guide RNA
  directing Argonaute/RISC to complementary sites in target mRNAs. Its
  best-supported specific role is in embryonic stem cell differentiation, where
  miR-100 represses the chromatin remodeller Smarca5 and is required for proper
  differentiation. mir-100 is abundant and broadly expressed, so it recurs in
  many miRNA profiling surveys; those appearances are a consequence of its
  abundance rather than evidence of participation in the processes surveyed.
references:
- id: GO_REF:0000115
  title: Automatic Gene Ontology annotation of non-coding RNA sequences through association
    of Rfam records with GO terms
  findings: []
- id: PMID:20439489
  title: miRNA 34a, 100, and 137 modulate differentiation of mouse embryonic stem
    cells.
  findings:
  - statement: >-
      miR-100 is one of three miRNAs the study functionally validates: Smarca5 is
      a direct target, anti-miR suppression blocks differentiation, and
      overexpression alters differentiation markers.
    supporting_text: we first demonstrated that Smarca5 is a direct target of miR-100
  - statement: >-
      The same study reports 138 miRNAs rising during differentiation, which was
      induced by withdrawing LIF; those 138 were not individually tested.
    supporting_text: We report that 138 miRNAs are increased on the induction of differentiation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only, but miR-100 is named in the title and the
      abstract states the direct-target and anti-miR results, so the functional
      claim is checkable. The same paper is also the source of a 291-row IEP
      batch, which is a separate matter.
- id: PMID:23646144
  title: Identifying microRNAs involved in degeneration of the organ of corti during
    age-related hearing loss.
  findings:
  - statement: >-
      An age-related expression survey of the organ of Corti in two mouse
      strains, reporting 111 and 71 differentially expressed miRNAs and framing
      the result as correlative.
    supporting_text: Our study suggests that changes in miRNA expression precede morphological
      and functional changes
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      PMC full text checked and contains no mention of miR-100; the annotation
      must derive from a supplementary microarray table. The paper is about
      degeneration and hearing loss, not the normal perception of sound.
- id: PMID:25858512
  title: miR-26a and miR-384-5p are required for LTP maintenance and spine enlargement.
  findings:
  - statement: >-
      372 miRNAs were detected, only 12 changed during LTP, and only miR-26a,
      miR-384-5p and let-7a were shown to be required. mir-100 is not mentioned
      anywhere in the paper.
    supporting_text: Of the 12 miRNAs changed in LTP, 6 were down- and 6 were upregulated
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: >-
      PMC full text checked; miR-100 does not appear. The annotation reflects
      inclusion in the detected-miRNA set, not any finding about mir-100.
- id: PMID:22897173
  title: Primary microRNA precursor transcripts are localized at post-synaptic densities
    in adult mouse forebrain.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Cached record is abstract-only and does not mention miR-100 specifically,
      but the paper's subject - pri-miRNA localization at post-synaptic densities
      - matches the annotated term directly.
- id: PMID:17028171
  title: miR-7b, a microRNA up-regulated in the hypothalamus after chronic hyperosmolar
    stimulation, inhibits Fos translation.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      PMC full text is cached and contains no mention of miR-100; the paper is
