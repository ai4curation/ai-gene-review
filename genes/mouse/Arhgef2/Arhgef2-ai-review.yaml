- term:
    id: GO:0014069
    label: postsynaptic density
  evidence_type: IDA
  original_reference_id: PMID:17114649
  qualifier: located_in
  review:
    summary: Neuronal/synaptic compartmentalization (postsynaptic density, IDA, PMID:17114649) of Lfc/GEF-H1.
    action: KEEP_AS_NON_CORE
    reason: In mammalian central neurons, Lfc/GEF-H1 resides on microtubules in the neuronal soma and dendritic shaft under basal conditions and translocates into glutamatergic dendritic spines and the postsynaptic density (associating with neurabin/spinophilin and AMPA receptor GluR1 complexes, and detected in synaptosomal phosphoproteomics) upon synaptic activity (PMID:15996550, PMID:17114649, PMID:19208802). Retained as specialized neuronal sub-compartmentalization.
    supported_by:
    - reference_id: PMID:19208802
      supporting_text: In this study, we identified GEF-H1/Lfc as a component of the AMPA-R complex in the brain. GEF-H1 is enriched in the postsynaptic density and is colocalized with GluR1 at spines. GEF-H1 activity negatively regulates spine density and length through a RhoA signaling cascade.
- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q92974
  - ensembl:ENSP00000354837
  review:
    summary: Direct physical binding to Rho-family small GTPases (IEA, GO_REF:0000107).
    action: ACCEPT
    reason: Purified Lfc/GEF-H1 forms high-affinity catalytic complexes with nucleotide-depleted RhoA and also binds Rac1 in a nucleotide-state-independent non-catalytic manner without binding Cdc42 or Ras (PMID:8910315, PMID:9857026). Because GO:0017048 Rho GTPase binding was merged into GO:0031267, GO:0031267 is the most specific available molecular-function term.
    supported_by:
    - reference_id: PMID:8910315
      supporting_text: We show here that Lfc and Lsc, like their closest relative Lbc, are highly specific guanine nucleotide exchange factors (GEFs) for Rho, causing a >10-fold stimulation of [3H]GDP dissociation from Rho and a marked stimulation of GDP-[35S]GTPgammas (guanosine 5'-O-(3-thiotriphosphate) exchange.
