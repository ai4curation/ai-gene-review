- term:
    id: GO:0005923
    label: bicellular tight junction
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0265
  review:
    summary: Bicellular tight junction localization (IEA, GO_REF:0000044) in polarized epithelia.
    action: ACCEPT
    reason: In polarized mammalian epithelial monolayers and mouse blastocyst trophectoderm, endogenous GEF-H1/Lfc is recruited to bicellular tight junctions via direct binding to cingulin and paracingulin/JACOP, sequestering GEF-H1 to downregulate junctional RhoA and control paracellular permeability (PMID:12604587, PMID:15866167).
    supported_by:
    - reference_id: PMID:12604587
      supporting_text: These data indicate that GEF-H1/Lfc is a component of TJs and functions in the regulation of epithelial permeability.
    - reference_id: PMID:15866167
      supporting_text: Here we show that GEF-H1/Lfc, a guanine nucleotide exchange factor for RhoA, directly interacts with cingulin, a junctional adaptor. Cingulin binding inhibits RhoA activation and signaling, suggesting that the increase in cingulin expression in confluent cells causes downregulation of RhoA by inhibiting GEF-H1/Lfc.
- term:
    id: GO:0007015
    label: actin filament organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:103264
  - PANTHER:PTN002677798
  - UniProtKB:Q92974
  review:
    summary: Actin filament organization (IBA, GO_REF:0000033) driven by microtubule-released GEF-H1/Lfc RhoA activation.
    action: ACCEPT
    reason: Release of GEF-H1/Lfc from microtubules activates the RhoA-ROCK-myosin II pathway to drive contractile actin stress fiber assembly in non-neuronal cells (PMID:11912491, PMID:18287519) and neurabin/spinophilin-coupled F-actin remodeling in dendritic spines (PMID:15996550).
    supported_by:
    - reference_id: PMID:11912491
      supporting_text: Furthermore, these effects are inhibited by dominant-negative versions of GEF-H1. Thus, GEF-H1 links changes in microtubule integrity to Rho-dependent regulation of the actin cytoskeleton.
    - reference_id: PMID:15996550
      supporting_text: Thus, interaction between Lfc and neurabin/spinophilin selectively regulates Rho-dependent organization of F-actin in spines and is a link between the microtubule and F-actin cytoskeletons in dendrites.
