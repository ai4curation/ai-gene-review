id: Q60875
gene_symbol: Arhgef2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mouse Arhgef2 (originally cloned as Lfc and also known as GEF-H1) is a 985-residue microtubule-gated Lbc-family Dbl-homology/pleckstrin-homology (DH/PH) guanine nucleotide exchange factor selective for RhoA-subfamily GTPases. Sequestered in an inactive state on interphase, dendritic-shaft, and mitotic-spindle microtubules via its N-terminal C1 zinc-finger domain (residues 39-86, Cys53) and C-terminal coiled-coil/phospho-Ser885 14-3-3 regulatory region, Arhgef2 is released upon microtubule remodeling or synaptic stimulation to catalyze RhoA GDP-to-GTP exchange and activate ROCK-myosin II F-actin organization. Through this core microtubule-to-RhoA switch—and specialized interactions with neurabin/spinophilin, Dynlt1/Tctex-1, ASAP1, NOD2/RIPK2/MAVS, and KSR1-PP2A—mouse Arhgef2 regulates cortical neurogenesis, precerebellar neuron migration, dendritic spine morphogenesis, podosome dynamics, and macrophage innate antiviral and antibacterial signaling.
