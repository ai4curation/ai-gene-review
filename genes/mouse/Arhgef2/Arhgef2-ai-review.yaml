  review:
    summary: Mitotic spindle localization (IEA, GO_REF:0000044) of GEF-H1/Lfc during cell division.
    action: ACCEPT
    reason: Endogenous mammalian GEF-H1/Lfc localizes to mitotic spindles, cortical spindle microtubule tips, and the midbody in dividing epithelial, HeLa, and radial precursor cells, where Aurora A/B and CDK1 phosphorylation gates RhoA activation prior to cytokinesis and spindle orientation (PMID:12604587, PMID:17488622, PMID:19448628).
    supported_by:
    - reference_id: PMID:12604587
      supporting_text: In agreement with these observations, immunofluorescence of proliferating MDCK cells revealed that the endogenous canine GEF-H1/Lfc associates with mitotic spindles.
    - reference_id: PMID:17488622
      supporting_text: GEF-H1 localized to the mitotic apparatus in HeLa cells, particularly at the tips of cortical microtubules and the midbody, and perturbation of GEF-H1 function induced mitotic aberrations, including asymmetric furrowing, membrane blebbing, and impaired cytokinesis.
