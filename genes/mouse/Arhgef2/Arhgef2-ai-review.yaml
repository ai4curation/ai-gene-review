- term:
    id: GO:0007026
    label: negative regulation of microtubule depolymerization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q92974
  - ensembl:ENSP00000354837
  review:
    summary: Negative regulation of microtubule depolymerization (IEA, GO_REF:0000107) based on overexpression bundling effects.
    action: MARK_AS_OVER_ANNOTATED
    reason: While high-level overexpression of full-length GEF-H1 constructs can bundle microtubules against nocodazole in transfected cells (PMID:11912491), physiological endogenous GEF-H1 is a passive sensor sequestered and inactivated by the microtubule lattice and released upon microtubule depolymerization (PMID:18287519, PMID:41365297) rather than a microtubule-stabilizing factor.
    supported_by:
    - reference_id: PMID:11912491
      supporting_text: Here we show that the Rho guanine nucleotide exchange factor (GEF)-H1 is regulated by an interaction with microtubules. GEF-H1 mutants that are deficient in microtubule binding have higher activity levels than microtubule-bound forms.
    - reference_id: PMID:41365297
      supporting_text: We show that specific features of the microtubule lattice bind the C1 domain of GEFH1, leading to the sequestration and inactivation of this signaling protein. Targeted mutations in C1 residues disrupt this interaction, triggering GEFH1 release and activation of RhoA-dependent immune responses.
