- term:
    id: GO:0045666
    label: positive regulation of neuron differentiation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q92974
  - ensembl:ENSP00000354837
  review:
    summary: Cortical/precerebellar neurodevelopmental role (positive regulation of neuron differentiation, IEA, GO_REF:0000107).
    action: KEEP_AS_NON_CORE
    reason: Genetic knockdown in embryonic mouse cortex (PMID:19448628) and homozygous human ARHGEF2 loss-of-function mutation recapitulated in Arhgef2-mutant mice (PMID:28453519) demonstrate that spindle-associated GEF-H1/Lfc regulates radial precursor mitotic spindle orientation, asymmetric neurogenic division, neuronal differentiation, and precerebellar neuron migration via RhoA/ROCK/MLC. Retained as downstream developmental manifestations of core microtubule-coupled RhoGEF activity.
    supported_by:
    - reference_id: PMID:28453519
      supporting_text: We show that loss of ARHGEF2 perturbs progenitor cell differentiation and that this is associated with a shift of mitotic spindle plane orientation, putatively favoring more symmetric divisions. The ARHGEF2 mutation leads to reduction in the activation of the RhoA/ROCK/MLC pathway crucial for cell migration.
