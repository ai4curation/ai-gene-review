- term:
    id: GO:0050768
    label: negative regulation of neurogenesis
  evidence_type: IMP
  original_reference_id: PMID:19448628
  qualifier: involved_in
  review:
    summary: Cortical/precerebellar neurodevelopmental role (negative regulation of neurogenesis, IMP, PMID:19448628).
    action: KEEP_AS_NON_CORE
    reason: Genetic knockdown in embryonic mouse cortex (PMID:19448628) and homozygous human ARHGEF2 loss-of-function mutation recapitulated in Arhgef2-mutant mice (PMID:28453519) demonstrate that spindle-associated GEF-H1/Lfc regulates radial precursor mitotic spindle orientation, asymmetric neurogenic division, neuronal differentiation, and precerebellar neuron migration via RhoA/ROCK/MLC. Retained as downstream developmental manifestations of core microtubule-coupled RhoGEF activity. (Note that PMID:19448628 showed Lfc promotes neurogenic asymmetric division whereas Dynlt1/Tctex-1 inhibits neurogenesis by antagonizing Lfc, explaining why MGI recorded both neurogenic and negative-neurogenesis IMP terms during dual-gene epistasis curation.)
    supported_by:
    - reference_id: PMID:19448628
      supporting_text: We found that Lfc (Arhgef2), a Rho-specific guanine nucleotide exchange factor that interacts with spindle microtubules, and its negative regulator Tctex-1 (Dynlt1) determine the genesis of neurons from precursors in the embryonic murine cortex.
