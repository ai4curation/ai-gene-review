- term:
    id: GO:0000132
    label: establishment of mitotic spindle orientation
  evidence_type: IMP
  original_reference_id: PMID:19448628
  qualifier: involved_in
  review:
    summary: Cortical/precerebellar neurodevelopmental role (establishment of mitotic spindle orientation, IMP, PMID:19448628).
    action: KEEP_AS_NON_CORE
    reason: Genetic knockdown in embryonic mouse cortex (PMID:19448628) and homozygous human ARHGEF2 loss-of-function mutation recapitulated in Arhgef2-mutant mice (PMID:28453519) demonstrate that spindle-associated GEF-H1/Lfc regulates radial precursor mitotic spindle orientation, asymmetric neurogenic division, neuronal differentiation, and precerebellar neuron migration via RhoA/ROCK/MLC. Retained as downstream developmental manifestations of core microtubule-coupled RhoGEF activity.
    supported_by:
    - reference_id: PMID:19448628
      supporting_text: Moreover, Lfc and Tctex-1 were required to determine the orientation of mitotic precursor cell divisions in vivo.
- term:
    id: GO:0000902
    label: cell morphogenesis
  evidence_type: IDA
  original_reference_id: PMID:15996550
  qualifier: acts_upstream_of_or_within
  review:
    summary: Cell morphogenesis (IDA, PMID:15996550) downstream of GEF-H1/Lfc-driven RhoA actomyosin remodeling.
    action: KEEP_AS_NON_CORE
    reason: Microtubule-released GEF-H1/Lfc drives RhoA-dependent contractile cell shape remodeling in fibroblasts/epithelial cells (PMID:11912491) and dendritic spine morphogenesis in neurons (PMID:15996550); retained as a non-core cellular-level outcome of RhoA/F-actin regulation.
    supported_by:
    - reference_id: PMID:15996550
      supporting_text: Thus, interaction between Lfc and neurabin/spinophilin selectively regulates Rho-dependent organization of F-actin in spines and is a link between the microtubule and F-actin cytoskeletons in dendrites.
