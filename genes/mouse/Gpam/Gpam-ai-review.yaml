core_functions:
- description: Mitochondrial outer membrane glycerol-3-phosphate acyltransferase that esterifies long-chain
    (preferentially 16:0) acyl-CoA to the sn-1 position of glycerol 3-phosphate, forming lysophosphatidic
    acid as the first step of triacylglycerol and phosphatidic acid synthesis. Activity and the TAG-synthesis
    role are established in mouse by knockout and knockdown; outer-membrane location is inferred from
    rat and human orthologues in the same PANTHER subfamily.
  molecular_function: *id017
  directly_involved_in:
  - *id008
  - *id010
  locations: *id003
  supported_by:
  - *id001
  - *id018
  - *id015
  - *id016
  - *id004
  - *id005
suggested_questions:
- question: Does mouse GPAT1 have physiologically relevant lysophosphatidylglycerol acyltransferase activity,
    as reported for the human enzyme in vitro, or is GO:0006655 an over-transfer from human?
- question: How is lysophosphatidic acid made by GPAT1 on the mitochondrial outer membrane delivered to
    the ER for TAG synthesis, and is the low-activity GPAT1 pool at ER-mitochondria contact sites involved?
suggested_experiments:
- description: Assay purified mouse GPAT1 with 1-acyl-lysophosphatidylglycerol and acyl-CoA, alongside
    glycerol 3-phosphate, to test whether the lysoPG acyltransferase side activity reported for the human
    enzyme is conserved.
