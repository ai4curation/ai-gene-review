id: Q61586
gene_symbol: Gpam
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Gpam encodes glycerol-3-phosphate acyltransferase 1 (GPAT1, mtGPAT), the N-ethylmaleimide-resistant
  glycerol-3-phosphate acyltransferase of the mitochondrial outer membrane and a member of the GPAT/DHAPAT
  (PlsB-like) acyltransferase family (PANTHER PTHR12563:SF16). It transfers a long-chain acyl group, preferentially
  palmitoyl, from acyl-CoA to the sn-1 position of sn-glycerol 3-phosphate to form lysophosphatidic acid,
  the committed first step of de novo glycerolipid synthesis that leads to phosphatidic acid, diacylglycerol,
  triacylglycerol and glycerophospholipids. GPAT1 is most abundant in liver and adipose tissue, where
  it accounts for a large share of total GPAT activity. In mice, loss of Gpam abolishes mitochondrial
  GPAT activity, lowers hepatic, plasma and cardiac triacylglycerol, prevents incorporation of newly synthesised
  fatty acids into triacylglycerol and diverts acyl-CoA toward mitochondrial beta-oxidation, and reduces
  sn-1 palmitate in liver and heart phospholipids. Outer-membrane placement and a peripheral, non-transmembrane
  mode of membrane association are established for the rat and human orthologues.
