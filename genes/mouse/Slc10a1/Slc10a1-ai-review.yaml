      the manual annotations alongside it. This deliberately differs from the MODIFY assigned to the IDA
      row for the same term, because a direct-assay localization should name the membrane it observed,
      whereas a family-signature inference genuinely cannot resolve polarity and is therefore correctly
      stated at the broad level.
