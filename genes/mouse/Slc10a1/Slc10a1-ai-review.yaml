- id: PMID:11279518
  title: Hepatocyte nuclear factor-1alpha is an essential regulator of bile acid and
    plasma cholesterol metabolism.
  findings:
  - statement: Mouse hepatic Slc10a1 is a basolateral membrane bile acid transporter whose reduced expression
      impairs portal bile acid uptake and elevates plasma bile acid concentrations.
    supporting_text: Tcf1-/- liver has decreased expression of the basolateral membrane bile acid transporters
      Slc10a1, Slc21a3 and Slc21a5, leading to impaired portal bile acid uptake and elevated plasma bile
      acid concentrations.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; the paper is about Hnf1a, but Slc10a1 is one of the transporters directly
      assayed and the abstract explicitly assigns it to the basolateral membrane. Cached abstract-only,
      so the MGI curator saw assay detail not visible here, and the IDA localization call is deferred to.
- id: PMID:10209268
  title: Molecular cloning and functional characterization of two alternatively spliced
    Ntcp isoforms from mouse liver1.
  findings:
  - statement: Mouse Ntcp was cloned as two alternatively spliced isoforms, a 362-residue form and a C-terminally
      shortened 317-residue form.
    supporting_text: we screened a mouse liver cDNA library and identified Ntcp1, encoding a 362 amino
      acid protein and Ntcp2, encoding a 317 amino acid protein which had a shorter C-terminal end.
  - statement: Both mouse Ntcp isoforms mediate saturable, sodium-dependent taurocholate transport in
      Xenopus oocytes.
    supporting_text: Both isoforms mediated saturable Na+-dependent transport of taurocholate when expressed
      in Xenopus laevis oocytes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; the primary functional characterization of the mouse protein and the
      direct experimental basis for the bile acid:sodium symporter activity. Cached abstract-only, but
      the assay (oocyte uptake, saturation kinetics) is stated and UniProt cites it for the curated taurocholate
      reaction and Km values.
- id: PMID:34060352
  title: Functional and Pharmacological Comparison of Human and Mouse Na(+)/Taurocholate
    Cotransporting Polypeptide (NTCP).
  findings:
  - statement: NTCP is located in the basolateral membrane of hepatocytes and transports bile acids from
      portal blood into the hepatocyte.
    supporting_text: The Na+/taurocholate cotransporting polypeptide (NTCP) is located in the basolateral
      membrane of hepatocytes, where it transports bile acids from the portal blood back into hepatocytes.
  - statement: Mouse Ntcp and human NTCP have closely similar affinities for estrone-3-sulfate and for
      the drug rosuvastatin.
    supporting_text: a functional comparison of human NTCP (hNTCP) and mouse Ntcp (mNtcp) showed similar
      Km values of 67 ± 10 µM and 104 ± 9 µM for the probe substrate estrone-3-sulfate as well as of 258
      ± 42 µM and 199 ± 13 µM for the drug rosuvastatin, respectively.
  - statement: NTCP contributes to hepatic transport of drugs.
    supporting_text: Furthermore, NTCP has a role for the hepatic transport of some drugs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; directly compares human and mouse NTCP in the same assay system, so
      it is the key reference establishing that the mouse transport function matches the human donor annotations
      being transferred.
- id: PMID:23678176
  title: Molecular determinants of hepatitis B and D virus entry restriction in mouse
    sodium taurocholate cotransporting polypeptide.
  findings:
  - statement: Mouse Ntcp cannot support HBV or HDV infection, although it binds the preS1 domain of the
      HBV L protein and transports taurocholate normally.
    supporting_text: mNTCP was found to be unable to support either HBV or HDV infection, although it
      can bind to pre-S1 of HBV L protein and is functional in transporting substrate taurocholate
  - statement: Expression of mouse Ntcp fails to render HepG2 cells susceptible to HBV or HDV, matching
      the host restriction seen in mice.
    supporting_text: mNTCP failed to render HepG2 susceptible for HDV or HBV infection, a finding consistent
      with the host restriction in mouse.
  - statement: Replacing mouse Ntcp residues 84-87 with their human counterparts converts it into a functional
      HBV/HDV receptor, localizing the restriction to the first extracellular loop.
    supporting_text: Remarkably, when mNTCP residues 84 to 87 were substituted by human counterparts,
      mNTCP can effectively support viral infections.
  - statement: The restriction is not a transport defect; mouse Ntcp mediates sodium-dependent taurocholate
      uptake as efficiently as human NTCP.
    supporting_text: In addition, mNTCP can mediate taurocholate uptake in the presence of sodium as efficient
      as hNTCP
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available in the cache. Establishes the species divergence
      that blocks transfer of the human virus-receptor terms to mouse, and independently confirms that
      mouse Ntcp is a fully functional sodium-dependent taurocholate transporter.
- id: PMID:23150796
  title: Sodium taurocholate cotransporting polypeptide is a functional receptor for
    human hepatitis B and D virus.
  findings:
  - statement: Human NTCP is necessary and sufficient for HBV and HDV entry in cultured hepatocarcinoma
      cells.
    supporting_text: Silencing NTCP inhibited HBV and HDV infection, while exogenous NTCP expression rendered
      nonsusceptible hepatocarcinoma cells susceptible to these viral infections.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Cited only as the human-side comparator for the species difference,
      and it does not support any annotation on the mouse protein.
