id: O08705
gene_symbol: Slc10a1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Slc10a1 (Ntcp, Na+/taurocholate cotransporting polypeptide) is the principal sodium-dependent
  bile salt uptake carrier of the mouse liver. It is a 362-residue multi-pass membrane protein of the
  bile acid:sodium symporter (BASS, TC 2.A.28) family that resides in the basolateral (sinusoidal) plasma
  membrane of hepatocytes, where it imports conjugated and unconjugated bile salts from portal blood into
  the hepatocyte in co-transport with two sodium ions, driven by the inward sodium gradient [PMID:10209268,
  PMID:34060352]. Transport is strictly dependent on extracellular sodium and is saturable, with the
  liver-dominant isoform showing an apparent Km near 86 uM for taurocholate and an alternatively spliced,
  C-terminally shortened isoform showing roughly sixfold higher affinity [PMID:10209268]. Substrate scope
  is broad for a bile salt carrier and extends to non-bile-acid organic anions such as estrone-3-sulfate
  and to drugs including rosuvastatin, with kinetics and inhibitor sensitivity closely matching the human
  orthologue [PMID:34060352]. By performing the hepatocyte uptake step, Slc10a1 is one of the central
  transporters of enterohepatic bile salt cycling, and loss of its hepatic expression impairs portal bile
  acid uptake and raises plasma bile acid concentrations [PMID:11279518]. Unlike human NTCP, the mouse
  protein does not act as a functional entry receptor for hepatitis B or hepatitis D virus; it binds the
  preS1 lipopeptide and retains full symport activity, but it cannot support infection, a restriction
  that maps to residues 84-87 in the first extracellular loop and is reversed by replacing them with their
  human counterparts [PMID:23678176].
