suggested_questions:
- question: Mouse Ntcp has a clean direct-assay functional characterization (saturable, sodium-dependent
    taurocholate uptake for both splice isoforms in PMID:10209268; kinetics and inhibitor profile in PMID:34060352),
    yet all transport annotations on O08705 are ISO or IBA. Should MGI add direct experimental annotations
    for GO:0008508 and GO:0015721 from these papers, so the mouse record no longer depends entirely on
    orthology transfer?
- question: The two splice isoforms differ roughly sixfold in taurocholate affinity (Km 14 uM for the shortened
    isoform 2 versus 86 uM for isoform 1, PMID:10209268), but no isoform-resolved annotation exists. Is
    an isoform-qualified annotation warranted, or is a kinetic difference without a distinct activity outside
    what GO records?
- question: Mouse Ntcp transports estrone-3-sulfate and the drug rosuvastatin in transfected cells (PMID:34060352).
    Should this be captured as a process annotation such as xenobiotic transport, as the substrate scope
    of the transporter activity via has_input extensions, or not at all given that the evidence comes from
    heterologous overexpression?
- question: Mouse Ntcp binds the HBV preS1 lipopeptide but cannot support HBV or HDV entry (PMID:23678176).
    Is there any GO representation for a binding-competent but non-functional receptor homologue, or is
    the correct curation simply to assert nothing, and should a taxon constraint or a NOT annotation be
    considered to block future automated transfer of GO:0001618 and GO:0046718 from human SLC10A1?
suggested_experiments:
- description: Hepatocyte-specific conditional Slc10a1 knockout mice with quantitative bile salt flux measurements
    (portal-venous extraction, plasma and biliary bile acid pools) to establish the in vivo contribution
    of Ntcp to the uptake step, separating it from the sodium-independent Oatp-mediated route that may
    compensate in mouse.
- description: Isoform-resolved rescue of Slc10a1-null hepatocytes with Ntcp1 versus Ntcp2 to test whether
    the higher-affinity shortened isoform makes a distinguishable physiological contribution, and whether
    the C-terminal segment governs trafficking or regulation rather than catalysis.
- description: Side-by-side proteoliposome reconstitution of mouse and human NTCP to measure sodium stoichiometry
    and substrate turnover for bile salts, sulfated steroids and drug substrates under identical conditions,
    putting the cross-species orthology transfers on a quantitative footing.
- description: Structure determination of mouse Ntcp and of the humanized mNtcp-h84-87 variant, with paired
    preS1 binding and entry assays, to resolve how the first extracellular loop converts a binding-competent
    transporter into a functional viral receptor while leaving symport unchanged.
