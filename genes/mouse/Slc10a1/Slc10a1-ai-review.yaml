core_functions:
- description: Sodium-coupled import of conjugated and unconjugated bile salts across the hepatocyte basolateral
    plasma membrane. Mouse Ntcp co-transports a bile salt with two Na+ ions in a strictly sodium-dependent,
    saturable manner (apparent Km about 86 uM for taurocholate in the liver-dominant isoform 1 and about
    14 uM in the C-terminally shortened isoform 2), and it also carries non-bile-acid organic anions such
    as estrone-3-sulfate and drugs such as rosuvastatin, with affinities closely matching the human orthologue.
  molecular_function:
    id: GO:0008508
    label: bile acid:sodium symporter activity
  directly_involved_in:
  - id: GO:0015721
    label: bile acid and bile salt transport
  locations:
  - id: GO:0016323
    label: basolateral plasma membrane
  supported_by:
  - reference_id: PMID:10209268
    supporting_text: Both isoforms mediated saturable Na+-dependent transport of taurocholate when expressed
      in Xenopus laevis oocytes.
  - reference_id: PMID:34060352
    supporting_text: The Na+/taurocholate cotransporting polypeptide (NTCP) is located in the basolateral
      membrane of hepatocytes, where it transports bile acids from the portal blood back into hepatocytes.
  - reference_id: PMID:34060352
    supporting_text: a functional comparison of human NTCP (hNTCP) and mouse Ntcp (mNtcp) showed similar
      Km values of 67 ± 10 µM and 104 ± 9 µM for the probe substrate estrone-3-sulfate as well as of 258
      ± 42 µM and 199 ± 13 µM for the drug rosuvastatin, respectively.
  - reference_id: PMID:11279518
    supporting_text: Tcf1-/- liver has decreased expression of the basolateral membrane bile acid transporters
      Slc10a1, Slc21a3 and Slc21a5, leading to impaired portal bile acid uptake and elevated plasma bile
      acid concentrations.
