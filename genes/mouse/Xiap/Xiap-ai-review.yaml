id: Q60989
gene_symbol: Xiap
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mouse XIAP is a BIR-domain and RING-domain protein that inhibits apoptotic caspases
  and catalyzes ubiquitin transfer. Conserved BIR2/linker and BIR3 mechanisms restrain caspases-3/7
  and caspase-9, respectively. Its RING-dependent ubiquitination supports NOD1/NOD2-RIPK2
  innate immune signaling and other substrate-dependent outputs, including Wnt regulation.
  Cytoplasmic and nuclear pools serve distinct contexts. Endogenous XIAP regulates neuronal
  resistance to cytochrome c, Fas-dependent hepatocyte apoptosis, and intestinal crypt survival;
  these effects depend on cell type and the balance of XIAP antagonists.
