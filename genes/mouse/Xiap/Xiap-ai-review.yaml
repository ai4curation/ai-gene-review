  - ensembl:ENSP00000360242
  review:
    summary: XIAP has curated cytoplasmic or nuclear localization, but this location row is
      broader than its molecular roles.
    action: ACCEPT
    reason: XIAP functions in cytoplasmic/cytosolic caspase and signaling assemblies and in
      nucleoplasmic TLE/TCF regulation. Retain this supported compartment at the resolution
      of the original experiment or ortholog inference; soluble versus assembled pools and
      nuclear translocation do not establish a single exclusive location. PMID:22304967 supports
      the nuclear signaling pool and PMID:11257230 the caspase-inhibitor mechanism.
    additional_reference_ids:
    - PMID:22304967
    - PMID:11257230
