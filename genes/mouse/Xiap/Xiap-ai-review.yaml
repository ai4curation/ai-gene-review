- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P98170
  - ensembl:ENSP00000360242
  review:
    summary: XIAP contributes to a survival response after DNA damage.
    action: KEEP_AS_NON_CORE
    reason: 'Mouse ortholog assessment: PMID:18049476 places XIAP downstream of Che-1/NF-kappaB
      and reports XIAP expression is necessary for the antiapoptotic activity. A response-to-damage
      term does not require DNA repair catalysis. Retain the stress-dependent survival response
      without assigning XIAP a repair enzyme or damage-sensor role. Human biochemical observations
      support the conserved XIAP mechanism; this row remains an orthology/phylogenetic inference
      rather than a newly claimed direct mouse assay.'
    additional_reference_ids:
    - PMID:18049476
    supported_by:
    - reference_id: PMID:18049476
- term:
    id: GO:0010804
    label: negative regulation of tumor necrosis factor-mediated signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P98170
  - ensembl:ENSP00000360242
  review:
    summary: XIAP attenuates the apoptotic branch of TNF signaling.
    action: KEEP_AS_NON_CORE
    reason: 'Mouse ortholog assessment: The GO definition covers a decrease in rate or extent
      of TNF-mediated signaling; it does not require inhibition of every downstream branch.
      XIAP protects against TNF-induced apoptosis through caspase inhibition and TAK1/JNK-dependent
      survival signaling. This context can coexist with positive NF-kappaB/JNK regulation.
      Human biochemical observations support the conserved XIAP mechanism; this row remains
      an orthology/phylogenetic inference rather than a newly claimed direct mouse assay.'
    additional_reference_ids:
    - PMID:11865055
    supported_by:
    - reference_id: PMID:11865055
