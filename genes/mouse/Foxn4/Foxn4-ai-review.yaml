proposed_new_terms:
- proposed_name: retinal horizontal cell differentiation
  proposed_definition: The process in which a relatively unspecialized retinal progenitor cell acquires the specialized
    features of a horizontal cell, a laterally projecting interneuron of the outer plexiform layer of the retina.
  justification: GO has amacrine cell differentiation (GO:0035881) but no term for horizontal cell differentiation
    (only horizontal cell localization, GO:0035852). Foxn4 null retinas completely lack horizontal cells.
  proposed_parent:
    id: GO:0030182
    label: neuron differentiation
  supported_by:
  - *id012
suggested_questions:
- question: Is mouse Foxn4 expressed in the developing atrioventricular canal and does it regulate Tbx2 there, as
    the zebrafish ortholog does for tbx2b?
- question: 'What causes the perinatal death of Foxn4-null mice: the lung alveolar defect, a cardiac defect, or
    something else?'
- question: Should direct transcriptional activation of the Notch ligand Dll4 by Foxn4 be captured as positive regulation
    of Notch signaling pathway, or only via has_input on the transcription-activator activity in a GO-CAM?
- question: 'Which PANTHER placement of FOXN4 is correct: PTHR13962:SF17 with FOXN2/FOXN3 and fly jumu (PANTHER
    19.0), or PTHR46721:SF2 next to FOXN1 (current UniProt cross-reference)?'
suggested_experiments:
- hypothesis: Foxn4 is required for AV canal specification in mammals.
  description: Examine Foxn4 expression in the E9.5-E11.5 mouse heart and analyse AV canal markers (Tbx2, Bmp2)
    and AV conduction in Foxn4-null embryos.
  experiment_type: mouse knockout phenotyping
- hypothesis: The ACGC-core motif defines Foxn4 genome-wide binding in retinal progenitors.
