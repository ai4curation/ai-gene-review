id: Q8K3Q3
gene_symbol: Foxn4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Foxn4 is a forkhead (winged-helix) transcription factor of the FOXN family that is expressed transiently
  in dividing neural progenitors of the retina, ventral spinal cord (p2 domain), midbrain and hindbrain, and in
  a subset of postmitotic proximal-airway epithelial cells. It binds DNA through its forkhead domain at elements
  containing an ACGC core and activates RNA polymerase II target genes through a C-terminal activation domain. In
  retinal progenitors it is necessary and sufficient for amacrine cell fate and required for horizontal cells, acting
  by activating Ptf1a (synergistically with RORbeta1), Neurod1/Neurod4 and the Notch ligand Dll4; Dll4-Notch activation
  in turn limits photoreceptor production and maintains the progenitor pool. Foxn4 also acts as a temporal competence
  factor for mid/late-early retinal cell types. In the spinal cord p2 domain it directly activates Dll4 and induces
  Ascl1/Mash1, initiating the asymmetric Notch signalling that commits a subset of progenitors to V2b (and V2c)
  interneuron fates. Loss of Foxn4 also causes alveolar defects in the lung, probably non-cell-autonomously. A role
  in atrioventricular canal formation is established for the zebrafish ortholog but has not been tested in mouse.
