  review:
    summary: Foxn4 binds ACGC-containing Foxn response elements of a Ptf1a enhancer (EMSA) and activates that enhancer
      in reporter assays, alone and synergistically with RORbeta1; it also occupies and activates a conserved Dll4
      enhancer in mouse retina. These are RNA polymerase II-transcribed target genes.
