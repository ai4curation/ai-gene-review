  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A2BGM5
  review:
    summary: ISS from zebrafish foxn4 (slipjig, A2BGM5). In zebrafish sli mutants the heart fails to loop and fails
      to form an AV canal.
    action: MARK_AS_OVER_ANNOTATED
    reason: Zebrafish foxn4 is in the same PANTHER 19.0 subfamily (PTHR13962:SF17), so orthology is not in doubt.
      But the looping defect is a downstream organ-level consequence of failed AV canal specification (Foxn4 regulates
      tbx2b in AV cells), not evidence that Foxn4 executes heart looping. No heart phenotype has been characterised
      in mouse; the zebrafish authors note the cause of perinatal death of Foxn4-null mice is unknown. PAINT did
      not propagate any heart process at PTN000216159.
    supported_by:
    - &id009
      reference_id: PMID:18347092
      supporting_text: sli mutants exhibit pericardial edema due to dysmorphic hearts that fail to loop and form
        an AV canal
    - &id010
      reference_id: PMID:18347092
      supporting_text: Interestingly, Foxn4 -null mutant mice die perinatally, but their cause of death is unclear
