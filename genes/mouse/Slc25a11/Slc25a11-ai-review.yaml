id: Q9CR62
gene_symbol: Slc25a11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Slc25a11 encodes OGC, the mitochondrial 2-oxoglutarate/malate carrier of the SLC25 family. It is a six-transmembrane inner-membrane antiporter that exchanges matrix 2-oxoglutarate for cytosolic malate, forming the OGC carrier step of the malate-aspartate shuttle and supplying malate movement for gluconeogenesis; under fatty-acid or protonophore conditions it can also facilitate a secondary proton leak.
