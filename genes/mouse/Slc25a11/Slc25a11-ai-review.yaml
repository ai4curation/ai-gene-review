- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: IMP
  original_reference_id: PMID:35507647
  qualifier: involved_in
  review:
    summary: PMID:35507647 supports SLC25A11-dependent negative regulation of hepatic gluconeogenesis by alpha-ketoglutarate, not the canonical malate-export step used in the GO-CAM.
    action: MODIFY
    reason: The paper shows that Slc25a11 is required for extracellular alpha-ketoglutarate to suppress hepatic gluconeogenesis through the P2RX4/AKG/serpina1e regulatory axis. That evidence supports negative regulation of gluconeogenesis, while the rat OGC ISO row and Reactome support the separate malate-route carrier context.
    supported_by:
    - reference_id: PMID:35507647
      supporting_text: purinergic receptor P2RX4 and intracellular AKG transporter SLC25A11 are required for the regulatory effects of extracellular AKG on gluconeogenesis in primary hepatocytes
    proposed_replacement_terms:
    - id: GO:0045721
      label: negative regulation of gluconeogenesis
