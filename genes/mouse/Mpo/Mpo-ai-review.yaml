id: P11247
gene_symbol: Mpo
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mpo encodes mouse myeloperoxidase, a covalently heme b-containing, calcium-binding animal
  heme peroxidase (EC 1.11.2.2) that is synthesised in promyelocytes and stored as a disulfide-linked
  homodimer of heavy/light chain pairs in the azurophil (primary) granules of neutrophils and the primary
  lysosomes of monocytes. Its principal catalytic reaction uses hydrogen peroxide generated by the NADPH
  oxidase during the respiratory burst to oxidise chloride to hypochlorous acid (chloride + H2O2 + H+
  = hypochlorous acid + H2O), with bromide, iodide and thiocyanate serving as alternative halide/pseudohalide
  substrates; the resulting hypohalous acids chlorinate and oxidise microbial and host molecules, leaving
  3-chlorotyrosine and 3-bromotyrosine as signature products. Granule myeloperoxidase is discharged into
  the phagosome, is constitutively secreted in part by bone-marrow granulocyte precursors, and is released
  extracellularly on degranulation, where it remains active and is inhibited by ceruloplasmin. Mice lacking
  Mpo develop normally and clear Staphylococcus aureus normally, but produce essentially no hypochlorous
  acid and are strikingly susceptible to Candida albicans pneumonia and dissemination and to polymicrobial
  sepsis, so the enzyme is central to oxygen-dependent killing of fungi and bacteria by neutrophils. Independently
  of its peroxidase chemistry, myeloperoxidase translocates into the nucleus during neutrophil extracellular
  trap (NET) formation, binds nucleosomes and destabilises them to decondense chromatin, and is itself
  a core protein component of the released NET. Extracellular myeloperoxidase-derived oxidants also modify
  lipoproteins, chlorinating and nitrating apolipoprotein A-I, which links the enzyme to oxidative tissue
  and vascular injury during chronic inflammation.
