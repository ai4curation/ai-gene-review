    reason: 'Direct demonstration of the core catalytic activity in mouse cells, and specifically of the
      chloride-to-HOCl reaction: HOCl production, not just generic turnover, tracked Mpo gene dosage.
      GO:0004601 is the correct and most specific existing term for the activity, so ACCEPT. That GO has
      no term for the individual reaction (EC 1.11.2.2, RHEA:28218) is an ontology gap, raised in proposed_new_terms
      and suggested_questions rather than held against this row; a split of the twelve GO:0004601 rows
      by how specific each one''s evidence is was tried and rejected, because rows sharing a term must
      take consistent actions.'
