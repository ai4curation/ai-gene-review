    summary: MGI IMP from the knockout paper, where superoxide production by Mpo-/- neutrophils was measured.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The measured effect was in the opposite direction to a removal function - Mpo-/- neutrophils
      made slightly more superoxide, which reflects loss of downstream H2O2 consumption rather than Mpo
      removing superoxide radicals. Mpo does interact with superoxide (compound III formation), so the
      term is not plainly false, but the cited phenotype does not support it; GO:0042744 hydrogen peroxide
      catabolic process is the claim the data support and it is accepted here. REMOVE was considered and
      not chosen: myeloperoxidase does react with superoxide (compound III formation, and UniProt records
      superoxide-driven chemistry for the enzyme), so the claim is not demonstrably false - only unsupported
      by the cited phenotype. Over-annotation records that distinction, and the row should be revisited
      if direct evidence either way appears.'
    supported_by:
    - reference_id: PMID:10085024
