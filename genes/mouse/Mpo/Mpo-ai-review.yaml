    oxidase to oxidise chloride to hypochlorous acid (and, as minor substrates, bromide, iodide and thiocyanate
    to the corresponding hypohalous acids), producing the microbicidal oxidants of the neutrophil phagosome
    and of the inflamed extracellular space.
