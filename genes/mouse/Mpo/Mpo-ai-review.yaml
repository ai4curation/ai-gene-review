- id: PMID:10085024
  title: Severe impairment in early host defense against Candida albicans in mice deficient in myeloperoxidase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached and read. Aratani et al. 1999 is the mouse Mpo knockout paper and
      the source of every experimental annotation in this review: loss of neutrophil peroxidase activity
      and of HOCl generation, normal S. aureus clearance (the NOT annotation), and lethal C. albicans
      pneumonia. Confirmed as the reference behind the MGI annotation to the now-obsolete GO:0002149.
      Note the paper cites MPO as EC 1.11.1.7, the lactoperoxidase number; the myeloperoxidase reaction
      is EC 1.11.2.2 / RHEA:28218.'
- id: PMID:11593004
  title: Neutrophils employ the myeloperoxidase system to generate antimicrobial brominating and chlorinating
    oxidants during sepsis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cited in five supporting-text slots and not previously declared here. The cached record
      is abstract-only (full_text_available: false), which is the caveat worth recording, because this
      is the sole mouse evidence for the bacterial arm of Mpo function: the GO:0042742 IBA and GO:0070944
      rows, the bacterium-killing leg of core function 1, and the bromide knowledge gap all rest on it.
      The abstract itself states the knockout sepsis phenotype and the 3-chlorotyrosine/3-bromotyrosine
      measurements, and UniProt P11247 cites it for FUNCTION and CATALYTIC ACTIVITY, so the claims used
      here are anchored in text that is visible.'
