- term:
    id: GO:0002679
    label: respiratory burst involved in defense response
  evidence_type: IMP
  original_reference_id: PMID:10085024
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:2176344
  review:
    summary: MGI IMP from the Mpo knockout paper. The respiratory burst itself is the NADPH-oxidase-driven
      step that generates superoxide and H2O2; Mpo acts downstream, consuming the H2O2 to make hypochlorous
      acid.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0002679 is defined as the production "by an NADH dependent system, of hydrogen peroxide
      (H2O2), superoxide anions and hydroxyl radicals" - that is NOX2, not Mpo. In the cited paper superoxide
      generation was if anything slightly higher in Mpo-/- neutrophils, so the burst does not require
      Mpo. Not wrong that Mpo works inside the burst-derived oxidant cascade, hence over-annotation rather
      than removal; the accurate statements are GO:0042744 hydrogen peroxide catabolic process and the
      peroxidase MF, both accepted here.
    supported_by:
    - reference_id: PMID:10085024
      supporting_text: During the respiratory burst, neutrophils generate O 2 − via the NADPH oxidase
        system. O 2 − is then reduced to H 2 O 2 , from which HOCl is generated by the MPO reaction.
    - reference_id: PMID:10085024
      supporting_text: The neutrophils of homozygous mutant mice generated a slightly higher level of
        O 2 −
