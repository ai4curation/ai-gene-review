    id: GO:0004601
    label: peroxidase activity
  evidence_type: IDA
  original_reference_id: PMID:10085024
  qualifier: enables
  review:
    summary: Peroxidase (TMB) activity was measured directly in neutrophils of wild-type, heterozygous
      and Mpo-/- mice and tracked gene dosage.
