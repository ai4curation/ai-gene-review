  review:
    summary: PAINT IBD/IBA for peroxidase activity placed on the animal heme-peroxidase clade; Mpo appears
      among the descendant evidences because it has its own experimental annotation for the term.
    action: ACCEPT
    reason: Peroxidase activity is the core catalytic function of Mpo and is inherited across the animal
      heme peroxidase family (MPO, EPX, LPO, TPO, peroxidasins); the node placement is sound and the target
      retains the catalytic heme-peroxidase architecture, so GO:0004601 is the right term for a family-level
      inference. The UniProt quote below is the curated reaction for mouse Mpo itself, cited to show that
      the inherited activity is realised in this protein - the IBA row asserts peroxidase activity at
      family level, not the halide specificity.
    supported_by:
    - reference_id: UniProtKB:P11247
      supporting_text: Reaction=chloride + H2O2 + H(+) = hypochlorous acid + H2O;
