proposed_new_terms:
- proposed_name: hypochlorous acid synthase activity
  proposed_definition: 'Catalysis of the reaction: chloride + H2O2 + H(+) = hypochlorous acid + H2O.'
  justification: 'GO has no molecular-function term for the physiological myeloperoxidase reaction (EC
    1.11.2.2, RHEA:28218). The two name-adjacent candidates do not fit: GO:0016691 chloride peroxidase
    activity is the organic-chlorination reaction 2 R-H + 2 chloride + H2O2 = 2 R-Cl + 2 H2O (EC 1.11.1.10),
    and GO:0140825 is lactoperoxidase activity (EC 1.11.1.7, phenolic donors). GO:0004601 peroxidase activity
    is therefore the most precise existing term, which is why this review accepts it, but it does not
    record the halide substrate or the hypohalous-acid product. A child of GO:0004601 for the chloride-oxidising
    reaction would give the chemistry a machine-readable home - which matters here because GO:0002149
    hypochlorous acid biosynthetic process was obsoleted on the grounds that the biological-process term
    merely restated a molecular function, leaving that molecular function unrepresented. The sibling term
    GO:0036393 thiocyanate peroxidase activity, defined on the equivalent pseudohalide reaction (RHEA:69416),
    is the precedent for the requested shape. The name deliberately avoids embedding the label of GO:0016691
    *chloride peroxidase activity*: an earlier draft of this proposal was called "hypochlorous acid-forming
    chloride peroxidase activity", which invites exactly the wrong parentage reading, since GO:0016691
    is the EC 1.11.1.10 organic-chlorination term this request excludes. The requested term is a child
    of GO:0004601 peroxidase activity, not of GO:0016691; EC 1.11.2.2''s accepted name is myeloperoxidase.
    Three of the twelve GO:0004601 rows on mouse Mpo are the ones whose evidence reaches this specific
    reaction - the IDA and IMP from PMID:10085024 (HOCl measured in neutrophils, and abolished in the
    knockout) and the IDA from PMID:23306200 (purified enzyme, chloride + H2O2) - while the rest (a tissue
    peroxidase assay, MPO staining as a myeloid marker, a peroxidase control, and the IBA/IEA/ISO/ISS
    transfers) show only generic peroxidase turnover. Those three rows are the evidence a GO editor should
    weigh for this request; they are recorded here rather than by splitting the actions on a shared term,
    which the action-consistency rules do not allow.'
  proposed_parent:
    id: GO:0004601
    label: peroxidase activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:28218
      label: chloride + H2O2 + H(+) = hypochlorous acid + H2O
  supported_by:
  - reference_id: UniProtKB:P11247
    supporting_text: Reaction=chloride + H2O2 + H(+) = hypochlorous acid + H2O;
  - reference_id: PMID:10085024
    supporting_text: Myeloperoxidase (MPO) catalyzes the reaction of hydrogen peroxide with chloride ion
      to produce hypochlorous acid (HOCl), which is used for microbial killing by phagocytic cells.
  - reference_id: PMID:10085024
    supporting_text: the neutrophils of homozygous mutant mice produced HOCl at an almost undetectable
      level
  - reference_id: PMID:23306200
    supporting_text: Ceruloplasmin was a potent inhibitor of purified myeloperoxidase, inhibiting production
      of hypochlorous acid by 50% at 25 nm.
suggested_questions:
- question: GO:0002149 hypochlorous acid biosynthetic process was obsoleted as a biological-process term
    that restates a molecular function, but no molecular-function term for the hypochlorous acid-forming
    reaction (EC 1.11.2.2, RHEA:28218) exists. Should a child of GO:0004601 be created for it, as was
    done for the pseudohalide reaction in GO:0036393 thiocyanate peroxidase activity, or is GO:0004601
    plus a has-output annotation the intended representation?
- question: Which process term should the migrated mouse Mpo annotation carry now that GO:0002149 is obsolete?
    This review accepts the existing GO:0042744 hydrogen peroxide catabolic process rows from the same
    paper (PMID:10085024), which already capture the chemistry; is any further process annotation wanted?
- question: Is the mouse Mpo annotation to GO:0002679 respiratory burst involved in defense response intended
    as participation in the burst or as action on its products? Mpo consumes the hydrogen peroxide produced
    by the NADPH oxidase, and superoxide production was slightly higher, not lower, in Mpo-null neutrophils.
suggested_experiments:
- hypothesis: The chromatin-decondensing activity of mouse Mpo is separable from its peroxidase activity.
  description: Reconstitute Mpo-null mouse neutrophils (or a conditional allele) with wild-type Mpo versus
    a heme-ligand or distal-histidine active-site mutant that folds and dimerises but cannot turn over
    H2O2, and measure NET release, chromatin decondensation and nucleosome binding alongside hypochlorous
    acid production.
  experiment_type: structure-function rescue of a knockout
- hypothesis: Halide availability sets which hypohalous acid mouse Mpo makes in vivo.
  description: Vary dietary or infused bromide, iodide and thiocyanate in wild-type and Mpo-null mice
    during Candida albicans or polymicrobial challenge, and quantify 3-chlorotyrosine, 3-bromotyrosine
    and thiocyanate-derived adducts in infected tissue by mass spectrometry alongside pathogen burden.
  experiment_type: in vivo oxidation-product mass spectrometry
- hypothesis: Ceruloplasmin restrains Mpo-dependent oxidative damage in vivo in mouse.
  description: Compare oxidative tissue injury, 3-chlorotyrosine accumulation and pathogen clearance in
    wild-type, Cp-null, Mpo-null and double-null mice in a sterile inflammation model and in an infection
    model, to separate the microbicidal benefit of Mpo activity from its host-damaging activity.
  experiment_type: genetic epistasis in vivo
knowledge_gaps:
- gap_statement: Which oxidant or non-oxidative neutrophil mechanism substitutes for myeloperoxidase-derived
    hypochlorous acid against Gram-positive bacteria, but not against Candida albicans, is undetermined.
  boundary: Mpo-null mice make essentially no hypochlorous acid, are strikingly susceptible to C. albicans
    pneumonia and dissemination, yet clear intraperitoneal Staphylococcus aureus at wild-type rates; superoxide
    production is if anything slightly raised in the knockout.
  gap_kind:
  - BIOLOGY
  significance: It explains why hereditary myeloperoxidase deficiency is common and mostly benign in humans,
    and which infections it actually predisposes to.
  provenance:
  - reference_id: PMID:10085024
    supporting_text: It is thus likely that reactive oxygen species other than HOCl, such as O 2 − , are
      sufficient for neutrophils to kill S. aureus . Further studies with MPO-deficient mice are warranted
      to define the role of MPO in S. aureus infection.
- gap_statement: Whether the nucleosome-destabilising, chromatin-decondensing activity of myeloperoxidase
    operates in mouse neutrophils, and whether it requires catalytic turnover or only the folded dimer,
    has not been tested.
  boundary: The mechanism - nuclear translocation, nucleosome binding as monomer and homodimer, ATP-independent
    nucleosome disassembly - is curated for human MPO and reaches the mouse entry only by similarity;
    the mouse knockout paper predates the NET field and assayed only oxidant chemistry and infection outcome.
  gap_kind:
  - BIOLOGY
  significance: It would separate the two functions of one protein, and determine whether myeloperoxidase
    inhibitors aimed at the heme site would also block NET release.
  provenance:
  - reference_id: UniProtKB:P11247
    supporting_text: Homodimers clash with one end of the nucleosomal DNA, leading to DNA unwrapping,
      initiating complete disassembly of nucleosomes and chromatin transformation into NETs in an ATP-independent
      manner
- gap_statement: The relative physiological contribution of the non-chloride substrates - bromide, iodide
    and thiocyanate - to myeloperoxidase-dependent killing in vivo is unknown.
  boundary: Bromide-derived 3-bromotyrosine accumulates in septic wild-type mice and falls in Mpo-null
    mice even though extracellular bromide is orders of magnitude scarcer than chloride, and physiological
    bromide modulates myeloperoxidase bactericidal activity in vitro.
  gap_kind:
  - BIOLOGY
  significance: It determines whether halide availability is a tunable input to innate host defence rather
    than a fixed property of the enzyme.
  provenance:
  - reference_id: PMID:11593004
    supporting_text: It seems, therefore, that myeloperoxidase can use bromide as well as chloride to
      produce oxidants in vivo, even though the extracellular concentration of bromide is at least 1,000-fold
      lower than that of chloride.
