- term:
    id: GO:0001701
    label: in utero embryonic development
  evidence_type: IMP
  original_reference_id: PMID:1582174
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:1932543
  review:
    summary: Gpi1 null embryos fail around gastrulation, showing that GPI-dependent glycolysis is required
      for early post-implantation development.
    action: MARK_AS_OVER_ANNOTATED
    reason: The phenotype is real, but in utero embryonic development is an indirect developmental outcome
      of losing a central glycolytic enzyme, not a separate core process executed by GPI.
    supported_by:
    - reference_id: PMID:1582174
      supporting_text: Homozygous mutants died at an early post-implantation stage of embryogenesis.
- term:
    id: GO:0001707
    label: mesoderm formation
  evidence_type: IMP
  original_reference_id: PMID:8922529
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:2177275
  review:
    summary: Gpi1 null embryos fail to form normal extraembryonic mesoderm during gastrulation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mesoderm phenotype follows from impaired energy metabolism when glycolysis is blocked;
      the gene product catalyzes a cytosolic metabolic step rather than a mesoderm-formation mechanism.
    supported_by:
    - reference_id: PMID:8922529
      supporting_text: It is concluded that glucose phosphate isomerase and presumably, therefore, glycolysis
        is needed for normal gastrulation of mouse embryos.
