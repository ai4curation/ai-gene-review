core_functions:
- description: Cytosolic glucose-6-phosphate isomerase that reversibly converts glucose 6-phosphate and
    fructose 6-phosphate for glycolysis and gluconeogenesis.
  molecular_function:
    id: GO:0004347
    label: glucose-6-phosphate isomerase activity
  directly_involved_in:
  - id: GO:0006096
    label: glycolytic process
  - id: GO:0006094
    label: gluconeogenesis
  - id: GO:0051156
    label: glucose 6-phosphate metabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:27103217
    supporting_text: catalyses the conversion of glucose-6-phosphate to fructose-6-phosphate at the second
      step in glycolysis and the reverse reaction during gluconeogenesis
  - reference_id: PMID:2344351
    supporting_text: Two glucose-6-phosphate isomerase (GPI) mutants with approximately 60% residual activity
      in blood compared to wild type
  - reference_id: PMID:6986434
    supporting_text: GPI was observed in the sarcoplasm of skeletal muscle, all hepatocytes of the liver
proposed_new_terms: []
suggested_questions:
- question: Are the by-similarity G6P anomerase and C2-epimerase reactions physiologically significant
    in mouse tissues, or only side reactions of the SIS-domain isomerase scaffold?
- question: Does mouse GPI have a stable ciliary or plasma-membrane pool, or were the ciliary transition-zone
    IDA rows caused by soluble GPI carryover in the source proteomics experiment?
suggested_experiments:
- description: Use endogenous tagging or fractionation with cytosolic controls to test whether GPI is
    truly enriched at the ciliary membrane or plasma membrane in the cell types used by the transition-zone
    proteomics study.
