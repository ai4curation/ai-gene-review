id: P06745
gene_symbol: Gpi1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Gpi1 encodes the full-length mouse glucose-6-phosphate isomerase, a soluble cytosolic homodimer
  that reversibly interconverts glucose 6-phosphate and fructose 6-phosphate. The reaction is the second
  step of glycolysis and the corresponding reverse step in gluconeogenesis, and the enzyme also binds
  hexose-phosphate substrates and has by-similarity anomerase or epimerase side activities. Vertebrate
  GPI can also be secreted as the moonlighting cytokine historically called neuroleukin or autocrine motility
  factor, whereas mouse loss-of-function primarily reveals dependence on the core glycolytic enzyme during
  erythrocyte metabolism and early post-implantation development.
