- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0204
  review:
    summary: >-
      Electronic peroxisome from the UniProt subcellular-location line, itself by similarity to rat.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Synthesis row on a root organelle term (projects/ORGANELLES.md rule 3), so the source was examined.
      Every peroxisome row on mouse Mvk traces to rat P17256: the UniProt by-similarity line, the MGI
      ISO from RGD and the SubCell-keyword IEA built on that line. The rat data are direct (immunoblotting
      of liver fractions and immuno-EM; PMID:1312092, PMID:7904598) but have been disputed: human MK was
      found only in the cytosol by four independent methods (PMID:14730012), cholesterol synthesis does
      not need functional peroxisomes (PMID:14680974), and peroxisome-deficient Pex5-/- mouse liver keeps
      MK activity (PMID:11792727). No experiment on mouse MVK places it in peroxisomes, mouse MVK has
      no C-terminal PTS1 (it ends -QALGL), and the 2024 mouse liver peroxisome proteome names PMVK, not
      MVK, among the pathway enzymes it assigns to peroxisomes (PMID:38247867; its supplementary table
      was not examined). The claim is therefore not supported for the mouse. Not REMOVEd because the rat
      source is an experimental annotation whose full text I could not read and no mouse experiment refutes
      it directly; MARK_AS_OVER_ANNOTATED on all three rows alike.
    supported_by:
    - reference_id: PMID:14730012
      supporting_text: No indication of a peroxisomal localisation was obtained
    - reference_id: PMID:42240661
      supporting_text: >-
        In contrast to rat liver (Krisans 1996) the three enzymes of mevalonate metabolism (i.e. mevalonate
        kinase, mevalonate pyrophosphate decarboxylase, and phosphomevalonate kinase) were, in human liver,
        observed in the cytosol, not in peroxisomes
    - reference_id: PMID:11792727
      supporting_text: >-
        We found that all enzymes measured, including putative peroxisomal enzymes, are at least as active
        in the peroxisome-deficient Zellweger mice as in control mice
    - reference_id: file:mouse/Mvk/Mvk-uniprot.txt
      supporting_text: Peroxisome {ECO:0000250|UniProtKB:P17256}.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:P17256
        source_label: Mvk (rat)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Rat liver peroxisomal MK rests on Krisans-lab fractionation and immuno-EM (PMID:1312092, PMID:7904598);
