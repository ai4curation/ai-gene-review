- term:
    id: GO:0033386
    label: geranylgeranyl diphosphate biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:35671633
  qualifier: involved_in
  review:
    summary: >-
      GO-CAM-derived row (GGPP biosynthesis model) whose evidence is HMGCS1 inhibition by ursolic acid.
    action: KEEP_AS_NON_CORE
    reason: >-
      Geranylgeranyl diphosphate is a downstream product of the pathway that MVK feeds, and mouse genetics
      support the link: Mvk-mutant mice accumulate unprenylated, GGPP-dependent Rab and Rap1A GTPases
      (PMID:36189795). The term is correct but downstream of MVK's step, so non-core. This row is exported
      from MGI GO-CAM models of mouse cholesterol and GGPP synthesis (67c10cc400008232, 682fbcd000004876,
      68b0f0d000003768). In those models the cited paper is the evidence on a process-to-process part_of
      edge, and the export assigns it to every enzyme in the model. The paper does not study Mvk: it shows
      that ursolic acid inhibits HMGCS1. See the cohort source defect on the cholesterol PMID:18669642
      row. The claim is judged on the biology, not on this evidence.
    supported_by:
    - reference_id: PMID:36189795
      supporting_text: >-
        Compound heterozygous mice recapitulated the characteristic biochemical phenotype of MKD, with
        increased plasma mevalonic acid and clear buildup of unprenylated GTPases in PBMCs, splenocytes,
        and bone marrow
    - reference_id: PMID:36189795
      supporting_text: loss of synthesis of GGPP (21, 22) necessary for protein prenylation
    - reference_id: PMID:35671633
      supporting_text: >-
        hydroxy‑3-methylglutaryl coenzyme A synthetase 1 (HMGCS1) was the primary lipid metabolism target
        protein of UA
- term:
    id: GO:0036197
    label: zymosterol biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:36378328
  qualifier: involved_in
  review:
    summary: >-
      GO-CAM-derived row whose evidence is hepatic Acat2 overexpression, which raised Mvk transcripts.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Zymosterol is a sterol intermediate formed from lanosterol, more than a dozen steps after MVK's
      reaction. GO places zymosterol biosynthesis beside cholesterol biosynthesis under sterol biosynthesis,
      not inside it, so the term adds no information about MVK beyond the kept cholesterol and IPP terms;
      by the same logic every upstream enzyme would carry the biosynthesis term of every downstream intermediate.
      Not wrong, but an over-annotation. This row is exported from MGI GO-CAM models of mouse cholesterol
      and GGPP synthesis (67c10cc400008232, 682fbcd000004876, 68b0f0d000003768). In those models the cited
      paper is the evidence on a process-to-process part_of edge, and the export assigns it to every enzyme
      in the model. The paper does not study Mvk: hepatic Acat2 overexpression raised the mRNA levels
      of several cholesterol-synthesis genes including Mvk, which is expression, not participation. The
      claim is judged on the biology, not on this evidence.
    supported_by:
    - reference_id: PMID:36378328
      supporting_text: >-
        Cholesterol biosynthesis-related genes, such as Mvk, Idi1, Fdps, Fdft1, Cyp51a1, Msmo1 and Dhcr7
        were upregulated
    - reference_id: file:mouse/Mvk/Mvk-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: phosphate, a key step in isoprenoid and cholesterol biosynthesis.
