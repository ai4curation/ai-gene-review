id: Q9R008
gene_symbol: Mvk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mvk encodes mouse mevalonate kinase (MK; EC 2.7.1.36), a GHMP-family kinase that transfers the gamma-phosphate
  of Mg-ATP to (R)-mevalonate to form (R)-5-phosphomevalonate. This is the first of three steps that convert
  mevalonate, the product of HMG-CoA reductase, into isopentenyl diphosphate, the building block of cholesterol,
  dolichol, ubiquinone and the farnesyl and geranylgeranyl groups used for protein prenylation. Like its
  rat and human orthologs the enzyme is a homodimer, and farnesyl and geranyl diphosphate inhibit it by
  competing at the ATP site. Mouse genetics show that it is essential: Mvk-null embryos are not recovered,
  heterozygotes have about half the liver activity, and hypomorphic alleles modelling human mevalonate
  kinase deficiency (including V377I) cause accumulation of mevalonic acid, defective prenylation of small
  GTPases and exaggerated inflammatory responses, with higher body temperature further lowering residual
  activity. The enzyme works in the cytosol; a peroxisomal pool reported in rat liver has not been shown
  in the mouse and was not found for the human enzyme. In rat ovary the same protein binds luteinizing-hormone-receptor
  mRNA, a moonlighting role not yet examined in mouse.
