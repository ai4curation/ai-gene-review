- term:
    id: GO:1990825
    label: sequence-specific mRNA binding
  evidence_type: ISO
  original_reference_id: GO_REF:0000096
  qualifier: enables
  supporting_entities:
  - RGD:621295
  review:
    summary: Sequence-specific mRNA binding transferred from rat MVK (LRBP).
    action: KEEP_AS_NON_CORE
    reason: >-
      Rat MVK, purified from ovary as LRBP and confirmed with recombinant enzyme, binds the LH-receptor
      mRNA binding site and not a mutated site (PMID:14749336, PMID:16263716). The RNA-binding surface
      overlaps the ATP/mevalonate site. Mouse and rat MVK are closely similar, so the transfer is plausible,
      but no mouse study has tested it and the role is peripheral to the enzyme's metabolic function.
      Kept as non-core.
    supported_by:
    - reference_id: PMID:14749336
      supporting_text: >-
        the data support the novel function of rat mevalonate kinase as a LHR mRNA-binding protein in
        the post-transcriptional regulation of LH receptor expression in the ovary
    - reference_id: PMID:16263716
      supporting_text: This mutation of LBS has been shown to render it incapable of interacting with
        LRBP
core_functions:
- description: >-
    Mevalonate kinase: ATP- and Mg2+-dependent phosphorylation of (R)-mevalonate to (R)-5-phosphomevalonate
    in the cytosol, step 1 of isopentenyl diphosphate synthesis via the mevalonate pathway.
  molecular_function:
    id: GO:0004496
    label: mevalonate kinase activity
  directly_involved_in:
  - id: GO:0019287
    label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:18008182
    supporting_text: >-
      Deletion of one Mvk allele (Mvk (+/-)) yielded viable mice with significantly reduced liver Mvk
      enzyme activity; multiple matings failed to produce Mvk (-/-) mice
  - reference_id: PMID:36189795
    supporting_text: >-
      Consistent with the Δ91 mutation causing complete loss of function, heterozygous Mvk+/Δ91 mice had
      approximately 50% normal MK activity in liver homogenates compared with wild-type counterparts
  - reference_id: PMID:36189795
    supporting_text: >-
      Compound heterozygous mice recapitulated the characteristic biochemical phenotype of MKD, with increased
      plasma mevalonic acid and clear buildup of unprenylated GTPases in PBMCs, splenocytes, and bone
      marrow
  - reference_id: PMID:14730012
    supporting_text: We exclusively found a cytosolic localisation of both endogenous human MK
suggested_questions:
- question: >-
    Does any fraction of mouse MVK reside in peroxisomes in liver or other tissues, or was the rat peroxisomal
    MK a fractionation or antibody artefact? Mouse MVK has no PTS1; does its N-terminal K13-V14-x5-H20-A21
    stretch, which fits the PTS2 pattern, bind PEX7?
- question: >-
    Does mouse MVK bind luteinizing-hormone-receptor mRNA in the ovary, as reported for rat LRBP, and
    does that binding compete with catalysis at the shared ATP/mevalonate site?
- question: >-
    Should GO-CAM pathway-context evidence on process-to-process edges be exported to GPAD as IMP or IDA
    rows on every enzyme in the model?
suggested_experiments:
- hypothesis: Endogenous mouse MVK is exclusively cytosolic.
  description: >-
    Tag endogenous Mvk in mouse liver (knock-in epitope) and test peroxisome co-sedimentation in iodixanol
    gradients with PEX14/catalase markers and protease protection, in wild-type and Pex5-deficient liver.
  experiment_type: subcellular fractionation and immuno-EM
- hypothesis: MVK binds Lhcgr mRNA in mouse granulosa cells.
  description: >-
    RNA immunoprecipitation of endogenous MVK from hCG-treated mouse ovary, with Lhcgr binding-site mutant
    reporters.
  experiment_type: RIP-qPCR
knowledge_gaps:
- gap_statement: >-
    Whether mouse MVK has any peroxisomal pool is unknown: no study has localized the mouse enzyme, and
    the rat and human data conflict.
  boundary: >-
    MK activity in mouse liver does not require functional peroxisomes (Pex5-/-), and human MK is exclusively
    cytosolic by fractionation, digitonin permeabilisation, IF and immuno-EM.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Peroxisomal isoprenoid synthesis has been proposed to channel acetyl-CoA from peroxisomal beta-oxidation;
    the mouse is the genetic system in which that can be tested.
  resolution: Endogenous-tag localization in mouse liver with marker-controlled gradients.
  provenance:
  - reference_id: PMID:42240661
    supporting_text: >-
      In contrast to rat liver (Krisans 1996) the three enzymes of mevalonate metabolism (i.e. mevalonate
      kinase, mevalonate pyrophosphate decarboxylase, and phosphomevalonate kinase) were, in human liver,
      observed in the cytosol, not in peroxisomes
  - reference_id: PMID:11792727
    supporting_text: >-
      We found that all enzymes measured, including putative peroxisomal enzymes, are at least as active
      in the peroxisome-deficient Zellweger mice as in control mice
