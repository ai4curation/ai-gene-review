  - UniProtKB:Q03426
  review:
    summary: PAINT inference from PTN000048555, the root mevalonate-kinase node of PTHR43290.
    action: ACCEPT
    reason: >-
      Mevalonate kinase activity is the defining activity of this enzyme. In the mouse it is shown directly:
      liver MK activity is significantly reduced in Mvk+/- mice and no Mvk-/- pups are born (PMID:18008182),
      and CRISPR alleles titrate activity in liver and bone marrow (PMID:36189795). Mouse MVK carries
      the GHMP kinase catalytic residues (proton acceptor Asp204, Mg2+ ligands Ser146 and Glu193) at the
      same positions as the characterised rat and human enzymes. Mouse MVK sits in PTHR43290:SF2 under
      that node and has its own experimental MK activity, so it legitimately appears among the seeds.
      The IBA is sound.
    supported_by:
    - reference_id: PMID:18008182
      supporting_text: >-
        Deletion of one Mvk allele (Mvk (+/-)) yielded viable mice with significantly reduced liver Mvk
        enzyme activity; multiple matings failed to produce Mvk (-/-) mice
    - reference_id: PMID:36189795
      supporting_text: >-
        Consistent with the Δ91 mutation causing complete loss of function, heterozygous Mvk+/Δ91 mice
        had approximately 50% normal MK activity in liver homogenates compared with wild-type counterparts
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000048555
        source_label: PTN000048555
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Root mevalonate-kinase node of PTHR43290, seeded by experimental MK activity in mouse, rat,
