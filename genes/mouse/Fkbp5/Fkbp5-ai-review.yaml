id: Q64378
gene_symbol: Fkbp5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: FKBP51 is an HSP90-associated immunophilin with peptidyl-prolyl isomerase and co-chaperone
  functions. It associates with steroid receptor complexes and regulates receptor responsiveness in a
  receptor- and context-dependent manner. It also serves as an adaptor linking AKT and the PHLPP phosphatase,
  promoting AKT dephosphorylation. Its absence does not reproduce the male reproductive defects of Fkbp4-null
  mice.
