- term:
    id: GO:0005905
    label: clathrin-coated pit
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:3505790
  - PANTHER:PTN000552124
  - UniProtKB:O14526
  - UniProtKB:Q0JRZ9
  review:
    summary: Clathrin-coated pit localization inherited from an FCHO-seeded bilaterian node; no GAS7 evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: These clathrin terms derive from the bilaterian node PTN000552124, whose IBD seeds are FCHO1,
      FCHO2 and a nematode orthologue only. FCHo proteins nucleate clathrin-coated pits through their
      curved F-BAR plus a C-terminal mu-homology domain (muHD) that engages the endocytic adaptor machinery.
      Mouse Gas7 has a WW + F-BAR architecture with no muHD, and there is no experimental evidence linking
      GAS7 to clathrin-coated structures or clathrin-mediated endocytosis. Instead, the GAS7 F-BAR forms
      flat two-dimensional sheets that drive micron-scale phagocytic cups, explicitly contrasted with
      the helical BAR assemblies of clathrin-coated pits. The chordate GAS7 node PTN001890901, seeded
      by this gene, carries only neuron projection morphogenesis. The clathrin function is therefore an
      FCHO-lineage property propagated too deep relative to the GAS7 divergence; GAS7-specific evidence
      of divergence (domain architecture and assembly mode) argues against it.
    supported_by:
    - &id002
      reference_id: PMID:31628328
      supporting_text: GAS7 has the F-BAR domain that possesses unique hydrophilic loops for two-dimensional
        sheet formation on flat membranes.
    - &id003
      reference_id: PMID:31628328
      supporting_text: Most BAR domain proteins are thought to form membrane invaginations or protrusions
        by assembling into helical submicron-diameter filaments, such as on clathrin-coated pits, caveolae,
        and filopodia.
    - &id004
      reference_id: file:mouse/Gas7/Gas7-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: FT   DOMAIN          141..401
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000552124
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Bilaterian node seeded only by FCHO1/FCHO2 (and a worm orthologue) clathrin-coated pit
          evidence; GAS7 lacks the FCHO mu-homology domain and forms flat sheets, so the FCHO clathrin
          role does not transfer.
