id: Q60780
gene_symbol: Gas7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Gas7 (growth arrest-specific protein 7) is a cytoplasmic F-BAR protein that is induced in
  growth-arrested fibroblasts and is expressed mainly in brain, notably cerebellar Purkinje cells and
  hippocampal neurons, and in macrophages. The canonical isoform combines an N-terminal WW domain with
  a GAS7-type F-BAR domain. The F-BAR dimers bind acidic phospholipid membranes and, through GAS7-specific
  hydrophilic loops, assemble into flat two-dimensional sheets on the cytoplasmic face of the plasma membrane.
  Gas7 binds and cross-links actin filaments directly, and its WW domain binds N-WASP, recruiting and
  activating the Arp2/3 complex to drive actin polymerization. By coupling membrane sheets to actin assembly,
  Gas7 builds membrane protrusions: it is needed for neurite outgrowth of cerebellar Purkinje and hippocampal
  neurons, localizes to ruffles, lamellipodia and growth cones, and forms the scaffold of micron-scale
  phagocytic cups, being required for efficient phagocytosis by macrophages.'
