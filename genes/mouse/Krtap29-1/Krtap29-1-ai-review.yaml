      (KAPs), which cross-link with the IFs through extensive disulfide bonding
  - reference_id: PMID:29797269
    supporting_text: The KAPs, which infiltrate the space between the IF, are recognized as having especially important
      roles in the organisation of the IF into macrofibrils, in determining some of the most important physical
      attributes of the fully-keratinised hair fibre, including its hardness, toughness and pliability, and in linking
      IF to one another
suggested_questions:
- question: Which keratin residues or domains does Krtap29-1 cross-link or bind in the fibre, and does it pair preferentially
    with particular type I/type II trichocyte keratins or other KAPs?
- question: Is Krtap29-1 functionally redundant with its paralogues in the same KAP cluster, or does its loss change
    fibre mechanics, diameter or curvature?
suggested_experiments:
- description: Generate a Krtap29-1 knockout (CRISPR, ideally together with close paralogues) and measure fibre
    tensile strength, diameter, curvature and ortho/para-cortex organization, with keratin/KAP proteomics of the
    fibre.
  hypothesis: Krtap29-1 contributes non-redundantly to fibre mechanics or morphology.
  experiment_type: knockout phenotyping
- description: Map Krtap29-1-keratin cross-links in native fibres by cross-linking mass spectrometry, and test binding
    of recombinant protein to trichocyte keratin head domains (ITC/pull-down) under non-reducing and reducing conditions.
  hypothesis: Krtap29-1 associates with specific keratin head/tail domains.
  experiment_type: biochemical binding / XL-MS
- description: Define the follicular compartment and hair-cycle timing of Krtap29-1 expression by RNA in situ hybridization
    or single-cell RNA-seq of anagen follicles, with an antibody to confirm protein in the keratinized shaft.
  experiment_type: expression localization
