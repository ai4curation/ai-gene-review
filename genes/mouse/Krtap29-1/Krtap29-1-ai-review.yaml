description: Keratin-associated protein 29-1 (Krtap29-1; also Kap29.2) is a large (342 aa) cysteine-rich keratin-associated
  protein classified with the KRTAP type 10 family of ultra-high-sulfur KAPs, built largely from cysteine-rich pentapeptide
  repeats. Its existence is inferred from the mouse genome sequence and homology. By family membership it is predicted
  to be an ultra-high-sulfur matrix protein of the keratinizing hair fibre that becomes extensively disulfide cross-linked
  with hair keratin intermediate filaments and other matrix proteins; its expression pattern and follicular compartment
  have not been described.
