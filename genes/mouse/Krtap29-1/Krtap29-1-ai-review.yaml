- term:
    id: GO:0031424
    label: keratinization
  evidence_type: ISS
  original_reference_id: file:mouse/Krtap29-1/Krtap29-1-uniprot.txt
  qualifier: involved_in
  review:
    summary: Inferred keratinization for this gene product, proposed during the NO_DATA
      re-action pass.
    action: NEW
    reason: 'Keratinization is inferred for this gene product (ISS), not shown for it experimentally;
      the ND row for the aspect therefore stays (projects/NO_DATA.md). The process in which
      KAPs do work is the terminal keratinization of hair cortical (or cuticle) cells: KAPs
      are deposited around the keratin intermediate filaments and disulfide cross-linked into
      the insoluble keratin-matrix composite that fills the keratinized cell. This is structural
      participation (the KAP is a constituent of the product), not mere dependence. GO:0031424
      keratinization explicitly covers hair. Hair cycle or hair follicle development terms
      were not chosen: KAP expression tracks anagen, but KAPs are downstream structural products
      and do not drive follicle cycling or morphogenesis. Krtap29-1 is supported only by family
      classification (PE 3), so this is a family-level inference.'
    supported_by:
