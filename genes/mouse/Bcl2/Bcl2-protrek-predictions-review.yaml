    summary: >-
      Top-ranked hit (score 19.18), an exact GOA match. The BAD-BCL-2 complex is the structurally
      characterised sequestration interaction that implements this review's first core function. Correct
      and specific; already annotated for the mouse protein, unlike the human ortholog where the same
      call was novel.
    supported_by:
