  predicted_term:
    id: GO:0097141
    label: BIM-BCL-2 complex
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 2 (score 18.52) and absent from GOA. BIM (Bcl2l11) is a canonical BH3-only ligand of Bcl-2
      and the complex is well characterised; it is a strict descendant of the annotated protein-containing
      complex. Correct, specific and novel - and notably it is the BCL2 version rather than the Bcl-xL
      version, so here the model picks the right paralog.
    supported_by:
    - reference_id: file:mouse/Bcl2/Bcl2-uniprot.txt
      supporting_text: >-
        Belongs to the Bcl-2 family
