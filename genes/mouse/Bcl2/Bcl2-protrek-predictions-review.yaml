id: P10417
gene_symbol: Bcl2
taxon:
  id: NCBITaxon:10090
  label: Mus musculus (Mouse)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for mouse Bcl2. Rank 1 is an exact GOA match to the BAD-BCL-2
  complex and rank 3 the family complex; the same Bcl-xL contamination seen for human BCL2 recurs
  at rank 4. Comparing the two: the human query returned the BAD complex as novel and the mouse query
  as an exact match, and both interleaved BCL2 and BCL2L1 complexes in their top five. This review's
  core functions - BH3 domain binding and BH domain binding - are not retrieved as molecular functions,
  only as the complexes they produce. Assessment: 1 correct novel (COR), 1 correct not novel (CNN),
  1 less precise (LSP).
