    confidence_score: 2
    summary: >-
      Rank 3 (score 18.46), an exact GOA match and the general parent of the two specific complexes
      above it. Correct and redundant; scored LSP. Rank 4 then returns the BIM-BCL-xl complex, which
      belongs to Bcl2l1 rather than Bcl2 - so the list contains the right paralog's complex at rank
