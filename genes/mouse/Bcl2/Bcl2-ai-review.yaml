suggested_experiments:
- description: Use Bcl2 BH-domain mutant rescue in mouse primary cells to test which survival and
    autophagy annotations require canonical BCL-2 family partner binding.
- description: Measure mitochondrial outer membrane permeabilization, cytochrome c release, and
    caspase activation in Bcl2 knockout and add-back mouse cells across apoptotic stimuli.
