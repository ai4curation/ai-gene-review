- term:
    id: GO:0015267
    label: channel activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Bcl2 has a conserved, experimentally grounded capacity for membrane conductance.
    action: KEEP_AS_NON_CORE
    reason: Purified human BCL2 lacking the C-terminal anchor forms discrete ion-conducting channels
      in planar bilayers at pH7.4 (PMID9144199), distinct from acidic-pH-dependent liposome
      insertion or carboxyfluorescein release. The shared report corroborates channel capacity but
      does not establish native mouse pore conductance. Actual PAINT root ancestry and direct human
      ortholog biochemistry support the conserved noncore capacity. Neither inhibition of BAX/IP3R
      nor predominant antiapoptotic function excludes intrinsic small-ion conduction; physiological
      substrates and contribution remain uncertain.
    supported_by:
    - &id002
      reference_id: PMID:9144199
      supporting_text: In planar lipid bilayers, where detection of single channels is possible,
        Bcl-2 formed discrete ion-conducting, cation-selective channels, whereas the Bcl-2 (Deltah5,
        6) mutant did not.
    - reference_id:
        file:human/BCL2/BCL2-hypotheses/conditional-proapoptotic-and-channel-capacities/openscientist.md
      supporting_text: Single-channel conductance was 18 ± 2 pS in 0.5 M KCl at pH 7.4
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000135648
        source_status: SUPPORTS_TRANSFER
        comment: Current tree independently verifies mouse leaf PTN000135797 below IBD PTN000135648.
          Human BCL2 is itself an experimentally grounded channel descendant, not a circular donor.
- term:
    id: GO:0001836
    label: release of cytochrome c from mitochondria
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Cytochrome-c release by conditionally converted Bcl2 needs to be separated from its
      usual inhibition of release.
    action: UNDECIDED
    reason: 'Conditional Bcl2 proapoptotic regulation is supported by direct mouse knockout/conformation
      evidence and human conversion biochemistry. The shared report does not establish whether Bcl2 itself
      supplies cytochrome-c-permeable structure in mouse: full18835031 explicitly separates BH3-mediated
      neutralization of BCLXL from direct BAX activation, and uses dextran as a cytochrome-c surrogate
      in reconstitution. Actual ancestral PTN000135648 remains on the mouse path. Keep this more specific
      release-process assertion unresolved rather than substituting the opposite sign merely from basal
      function. The separate direct9843949 annotation remains refined according to its inhibitory experiment.'
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000135648
        source_status: UNRESOLVED
        comment: Current exact mouse ancestry verified below the real release-process IBD. Positive
          apoptosis is supported, while direct release versus regulation of another effector remains
          mechanistically distinct and unresolved.
    supported_by:
    - *id001
    - reference_id: PMID:18835031
      supporting_text: Thus, NuBCP-9 does not induce Bcl-2 to directly activate Bax.
