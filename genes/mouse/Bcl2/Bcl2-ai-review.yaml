  title: OpenScientist BCL2 conditional proapoptotic and channel-capacity adjudication
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Read complete generated Output, distinct from prompt. Supports conditional
      proapoptotic and channel capacities, but it did not inspect actual PAINT topology, does not
      settle pore stoichiometry, and its sequence-only mouse discussion misses direct mouse
      experiments18835031 and18443228. Acidic-pH carboxyfluorescein efflux is distinct from
      neutral-pH small-ion channels. No provider sequence numbers adopted without independent
      analysis.
- id: PMID:18835031
  title: A short Nur77-derived peptide converts Bcl-2 from a protector to a killer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results/Fig1E–G,6J,8C–F independently read. WT versus Bcl2-knockout MEFs show
      Bcl2-dependent NuBCP9 death; biochemical mechanism exposes a BH3 activity that neutralizes
      BCLXL, not direct BAX activation. Cross-species and recombinant experiments distinguished.
- id: PMID:18443228
  title: During negative selection, Nur77 family proteins translocate to mitochondria where they
    associate with Bcl-2 and expose its proapoptotic BH3 domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Methods/Results read. Endogenous mouse Bcl2 BH3 exposure in stimulated DP
      thymocytes has Bcl2-knockout antibody specificity control and F5/HY contexts. Co-IP uses
      lck-Bcl2 transgene, distinct from endogenous staining. This supports conditional conformation
      change, not direct pore assembly.
- id: PMID:25182415
  title: T cell-specific inhibition of multiple apoptotic pathways blocks negative selection and
    causes autoimmunity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full Results/Methods read. BH3 GDD-to-AAA construct is HUMAN BCL2 in a mouse
      transgenic system, not an endogenous mouse Bcl2 mutant. Stronger mutant protection in some
      polyclonal/in-vitro contexts, but comparable WT/mutant protection in F5/HY models. Comparative
      context, not mouse-sequence direct assay.
