id: P10417
gene_symbol: Bcl2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Mouse Bcl2 encodes a BCL-2-family regulator that binds BH3-containing partners and restrains mitochondrial
  apoptotic signaling. Membrane-associated Bcl2 acts at mitochondria, the endoplasmic reticulum and the
  nuclear envelope, with additional compartmental pools observed in specific tissues. Bcl2 also directly
  inhibits autophagy through BECN1 binding; phosphorylation-dependent release of BECN1 couples this interaction
  to starvation and exercise responses. Its control of cell survival supports lymphocyte homeostasis,
  neuronal maintenance, renal development and pigmentation. Context-dependent calcium signaling, cell-cycle
  regulation, neuronal maturation and axon growth extend its functions beyond a uniform antiapoptotic
  response. Under specific apoptotic signals, conformational conversion can expose a proapoptotic BH3
  activity; this conditional capacity coexists with its principal survival function.
existing_annotations:
- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Bcl2 has a supported conditional proapoptotic regulatory capacity.
    action: KEEP_AS_NON_CORE
    reason: 'The shared report supports conversion of BCL2 but only examined mouse sequence conservation.
      Independent full18835031 supplies direct mouse evidence: NuBCP9-induced death occurs in WT MEFs
      and is lost in Bcl2-knockout MEFs; full18443228 detects endogenous Bcl2 BH3 exposure in stimulated
      mouse thymocytes with knockout specificity controls. Human biochemical experiments explain an active
      contribution: converted BCL2 neutralizes BCLXL through its exposed BH3 region, rather than directly
      activating BAX. Actual PTHR11256 target leaf PTN000135797 descends from PTN000135648 with no recovered
      loss. Retain inherited positive regulation as a condition-dependent noncore function, without making
      conversion the basal survival mechanism.'
    supported_by:
    - &id001
      reference_id: PMID:18835031
      supporting_text: NuBCP-9 and D-NuBCP-9 induced apoptosis of MEFs but not Bcl-2−/−MEFs in a
        dose (Figure 1F) and time (Figure 1G) dependent manner.
    - reference_id: PMID:18443228
      supporting_text: No staining was seen in PMA/ionomycin-stimulated Bcl-2−/− DP thymocytes,
        confirming the specificity of the antibodies
    - reference_id:
        file:human/BCL2/BCL2-hypotheses/conditional-proapoptotic-and-channel-capacities/openscientist.md
      supporting_text: The proapoptotic capacity is real but proteoform- and context-dependent.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000135648
        source_status: SUPPORTS_TRANSFER
        comment: Independent current v19 tree verifies the root IBD on the exact mouse lineage.
          Direct mouse knockout and conformational experiments complement human conversion
          mechanism; no loss is established.
- term:
    id: GO:0097192
    label: extrinsic apoptotic signaling pathway in absence of ligand
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Bcl2 directly regulates the apoptotic response to withdrawal of extracellular survival
      ligands.
    action: ACCEPT
    reason: GO:0097192 begins with ligand withdrawal from a cell-surface receptor and can proceed
      through mitochondrial signaling. In murine T cells, Bcl2 binds the IL-2-deprivation-induced
      BH3 protein ITM2B(s) (PMID:12082633); Bcl2 expression also protects CTLL-2 cells after IL-2
      withdrawal (PMID:7751019). Mitochondrial execution therefore does not make the
      extracellular-withdrawal pathway incorrect. Retain the broad pathway assignment.
    supported_by:
    - &id006
      reference_id: PMID:12082633
      supporting_text: Growth factor deprivation is a physiological mechanism to induce apoptosis.
        We used an IL-2-dependent murine T cell line to identify proteins that trigger apoptosis.
    - &id007
      reference_id: PMID:7751019
      supporting_text: when bcl-2 transfected CTLL-2 cells are deprived of IL-2, they do not undergo
        apoptosis
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000135648
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Bcl2 itself supplies experimental descendant evidence for the PTN000135648
          IBD. Its appearance among the sources is expected and supports the inherited pathway
          function.
