- term:
    id: GO:0006914
    label: autophagy
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Bcl2 directly regulates autophagy through inhibitory binding of BECN1.
    action: ACCEPT
    reason: Mouse Bcl2 AAA knock-in mutations prevent stimulus-induced BCL2–BECN1 dissociation and
      autophagy activation (PMID:22258505), and the reciprocal Becn1 F121A interface mutation
      increases autophagic flux (PMID:29849149). Full PMID:36812915 extends this mechanism to
      exercise-stimulated mouse liver. This is direct regulatory work, not a downstream survival
      phenotype, and is retained as core autophagy regulation.
    supported_by:
    - &id008
      reference_id: PMID:22258505
      supporting_text: BCL2 is an anti-apoptotic and anti-autophagy protein that inhibits autophagy
        through a direct interaction with the BH3 domain of the autophagy protein beclin 1 at the
        endoplasmic reticulum8.
    - &id010
      reference_id: PMID:29849149
      supporting_text: We observed marked reduction in beclin 1 co-immunoprecipitation with Bcl-2 in
        tissues of the KI mice (Fig. 1a, b).
    - &id011
      reference_id: PMID:36812915
      supporting_text: Via co-immunoprecipitation, we found that exercise induces phosphorylation of
        BCL2 at Ser70 and decreases BECN1-BCL2 binding in the liver of control mice; however, these
        exercise-induced effects are largely reduced in the liver of FN1Δmuscle mice (Fig. 4H)
