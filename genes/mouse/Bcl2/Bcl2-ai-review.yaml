- id: file:mouse/Bcl2/Bcl2-deep-research-falcon.md
  title: Falcon deep research report on mouse Bcl2
  findings:
  - statement: The report summarizes the conserved BH3-binding antiapoptotic mechanism; much of its
      recent evidence concerns human BCL2, so mouse-specific primary studies are evaluated
      separately.
    supporting_text: Mechanistically, BCL-2 binds BH3-containing partners through its groove,
      thereby preventing downstream **BAX/BAK oligomerization** and **pore formation** in the
      mitochondrial outer membrane that would otherwise cause **MOMP** and apoptosis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Read the actual generated report. Core family mechanism agrees with mouse primary
      genetic/interaction studies; report identity matching is not evidence that all cited human
      assays tested mouse Bcl2. Exact generated wording retained; no provider verdict substituted
      for primary assessment.
