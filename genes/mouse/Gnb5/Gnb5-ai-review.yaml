core_functions:
- description: Gbeta5 contributes to the assembly, stability and activity of R7-family GAP complexes.
    The RGS partner accelerates G alpha GTP hydrolysis; Gbeta5 is a required structural/regulatory component
    rather than the GTPase itself.
