id: P62881
gene_symbol: Gnb5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Gnb5 encodes the atypical G protein beta subunit Gbeta5, a WD-repeat protein that binds the
  G gamma-like domains of R7-family RGS proteins. These complexes stabilize their partners and accelerate
  G alpha inactivation in neuronal, retinal and cardiac signaling. The long retinal product participates
  in the RGS9-1 phototransduction-regulatory complex, whereas other RGS partners support distinct neuronal
  and cardiac responses. Gbeta5 can bind selected conventional gamma subunits and form particular experimentally
  reconstituted heterotrimers, but its predominant native regulatory role is in RGS complexes rather than
  interchangeable participation in all conventional G protein heterotrimers.
