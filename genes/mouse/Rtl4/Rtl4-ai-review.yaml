suggested_questions:
- question: >-
    What is the extracellular ligand or nucleic-acid target of secreted RTL4, and how does it
    modulate noradrenaline handling at microglia-neuron interfaces?
- question: >-
    Does RTL4 act via direct noradrenaline binding/handling or via regulation of microglial
    state and reuptake machinery?
suggested_experiments:
- hypothesis: >-
    Secreted RTL4 binds an extracellular polyanion/nucleic-acid ligand via its CCHC knuckle to
    modulate noradrenergic signalling.
  description: >-
    Identify RTL4 extracellular binding partners (proximity labelling, pulldown from brain
    interstitial fluid) and test zinc/CCHC-dependent nucleic-acid binding of recombinant RTL4.
- hypothesis: >-
    RTL4 microglial secretion is required for normal noradrenergic network maturation and
    cognition.
  description: >-
    Combine Rtl4 knockout/knock-in with microdialysis, behaviour, and microglia-specific
    rescue to test whether restoring microglial RTL4 secretion rescues NA recovery and
    behaviour.
