taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Rtl4 (retrotransposon Gag-like protein 4; also Sirh11, Zcchc16, Mar4/Mart4) is the
  mouse ortholog of human RTL4, an X-linked eutherian gene domesticated from the gag
  region of a Ty3/gypsy sushi-ichi-related LTR retrotransposon. The 304-residue protein
  retains a single C-terminal CCHC-type zinc knuckle (residues 276-293,
  C-x2-C-x4-H-x4-C) flanked by basic residues, the signature nucleocapsid motif, but no
  reverse transcriptase, integrase or protease; it is predicted by homology to bind
  single-stranded RNA/nucleic acid. Rtl4/Sirh11 is a microglial gene whose protein is
  secreted into the extracellular space of the postnatal midbrain, hypothalamus,
  hippocampus and amygdala, and whose secretion is driven by noradrenergic/beta-adrenergic
  signalling and arousal state. Knockout mice are viable and fertile but show impaired
  attention, increased impulsivity and impaired short-term/working memory, and reduced
  recovery of noradrenaline (relative to dopamine) in the prefrontal cortex, implicating
  the brain noradrenergic system. It was the first SIRH gene shown to act in the brain
  rather than the placenta.
