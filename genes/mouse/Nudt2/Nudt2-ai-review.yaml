- term:
    id: GO:0004081
    label: bis(5'-nucleosyl)-tetraphosphatase (asymmetrical) activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P50584
  review:
    summary: >-
      Curator transfer of Ap4A hydrolase activity from the pig orthologue (P50584).
    action: ACCEPT
    reason: >-
      Pig and mouse Ap4A hydrolases are close mammalian orthologues; transfer of the
      core catalytic activity is well justified. Mouse Nudt2 itself has not been assayed
      on Ap4A, but the catalytically inactive EE-QQ Nudix-box mutant of mouse Nudt2 lost
      cap-hydrolysing activity, showing the Nudix active site is functional.
    supported_by:
    - reference_id: PMID:32432673
      supporting_text: >-
        Highly conserved glutamic acid residues essential for catalysis within the Nudix
        motif were substituted with lysine in Nudt16 (EE-KK), glutamines in Nudt2 and
        Nudt3 (EE-QQ).
