- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HDA
  original_reference_id: PMID:18614015
  qualifier: located_in
  review:
    summary: >-
      High-throughput mass-spectrometry detection of Nudt2 in mitochondrial
      preparations from mouse tissues (MitoCarta compendium study).
    action: KEEP_AS_NON_CORE
    reason: >-
      Experimental proteomic evidence that MGI curators annotated from the full dataset;
      Nudt2 is not discussed in the paper text, so the strength of its mitochondrial
      assignment cannot be checked here. Ap4A hydrolase activity is classically
      cytosolic/nuclear in animal cells, and an independent human proteomic dataset
      places NUDT2 in the mitochondrial matrix, so a minor mitochondrial pool is
      plausible but its functional relevance is unknown. Retained as non-core rather
      than removed.
    supported_by:
    - reference_id: PMID:18614015
      supporting_text: >-
        we performed mass spectrometry, GFP tagging, and machine learning to create a
        mitochondrial compendium of 1098 genes and their protein expression across 14
        mouse tissues.
- term:
    id: GO:0006167
    label: AMP biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000482012
  - WB:WBGene00003581
  review:
    summary: >-
      Process term propagated from PTN000482012 because AMP is a product of Ap4A
      hydrolysis; the node IBD is seeded only by C. elegans ndx-4 IDA rows.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      AMP is released as a by-product of degrading Ap4A, not as the purpose of a
      biosynthetic pathway; cellular AMP pools come from de novo and salvage purine
      synthesis and ATP turnover. The enzyme's process is diadenosine tetraphosphate
      catabolism (GO:0015967). Consistent with the ndx-4 review, where the seeding IDA
      rows were themselves marked over-annotated.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000482012
        comment: Node-level process term grounded in the reaction product of Ap4A hydrolysis; the catabolic process term is the appropriate one.
      - source_id: WB:WBGene00003581
        source_label: ndx-4
        comment: Sole seed; its IDA rows are product-based process annotations, marked over-annotated in genes/worm/ndx-4.
    supported_by:
    - reference_id: PMID:11738085
      supporting_text: >-
        It hydrolyses Ap4A with a K(m) of 7 microM and k(cat) of 27 s(-1) producing AMP
        and ATP as products.
