  - PANTHER:PTN000482012
  - UniProtKB:C0H4F3
  - UniProtKB:P50584
  - WB:WBGene00003581
  review:
    summary: >-
      Phylogenetic inference of asymmetrical Ap4A hydrolase activity from PANTHER node
      PTN000482012 (PTHR21340:SF0), grounded in experimental data for pig NUDT2
      (P50584), Plasmodium falciparum C0H4F3 and C. elegans ndx-4.
    action: ACCEPT
    reason: >-
      Mouse Nudt2 sits within the SF0 Ap4A hydrolase subfamily, retains the Nudix box
      (residues 43-64) and the Tetra_PHTase signature (IPR003565), and there is no
      evidence of divergence or loss of catalytic residues. The node placement is
      sound and the activity is the defining function of this subfamily.
    supported_by:
    - reference_id: PMID:11738085
      supporting_text: >-
        It hydrolyses Ap4A with a K(m) of 7 microM and k(cat) of 27 s(-1) producing AMP
        and ATP as products.
    - reference_id: PMID:18644867
      supporting_text: >-
        we provided here evidence that the "Nudix" type 2 gene product, Ap(4)A
        hydrolase, is responsible for Ap(4)A degradation following the immunological
        activation of mast cells.
