- id: PMID:11738085
  title: Cloning, characterisation and crystallisation of a diadenosine 5',5"'-P(1),P(4)-tetraphosphate
    pyrophosphohydrolase from Caenorhabditis elegans.
  findings:
  - statement: The C. elegans orthologue ndx-4 is an asymmetrical Ap4A hydrolase producing
      AMP + ATP (Km 7 uM, kcat 27 s-1), behaving as a typical animal Ap4A hydrolase.
    supporting_text: >-
      It hydrolyses Ap4A with a K(m) of 7 microM and k(cat) of 27 s(-1) producing AMP and
      ATP as products.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary characterisation of the worm orthologue (Q9U2M7); source of the ISS transfer to mouse. Abstract-only in cache.
- id: PMID:11937063
  title: The crystal structure of diadenosine tetraphosphate hydrolase from Caenorhabditis
    elegans in free and binary complex forms.
  findings:
  - statement: Structures of the worm orthologue show a Nudix fold and explain specificity
      for dinucleoside tetraphosphates over triphosphates; apoptosis is mentioned only as
      a speculative consequence of Ap4A regulation.
    supporting_text: >-
      These results suggest how the enzyme can catalyze the hydrolysis of a range of
      related dinucleoside tetraphosphate, but not triphosphate, compounds through
      precise orientation of key elements of the substrate.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Correct paper (worm ndx-4 structure), but it does not support the apoptotic process ISS for which it is cited; its apoptosis sentence is hedged background.
- id: PMID:18614015
  title: A mitochondrial protein compendium elucidates complex I disease biology.
  findings:
  - statement: Large-scale mouse mitochondrial proteomics (MitoCarta); source of the
      HDA mitochondrion annotation. Nudt2 is not discussed in the text.
    supporting_text: >-
      we performed mass spectrometry, GFP tagging, and machine learning to create a
      mitochondrial compendium of 1098 genes and their protein expression across 14
      mouse tissues.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: High-throughput dataset; gene-level support for Nudt2 lies in supplementary data not checked here.
- id: PMID:18644867
  title: Diadenosine tetraphosphate hydrolase is part of the transcriptional regulation
    network in immunologically activated mast cells.
  findings:
  - statement: The Nudt2 gene product is responsible for Ap4A degradation after
      immunological activation of mast cells; its knockdown alters Ap4A accumulation and
      expression of MITF and USF2 target genes.
    supporting_text: >-
      The knockdown of Ap(4)A hydrolase modulated Ap(4)A accumulation, resulting in
      changes in the expression of MITF and USF2 target genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Key mammalian in-cell study of Ap4A hydrolase; abstract-only in cache, the cell types/species used are not stated in the abstract.
- id: PMID:32432673
  title: Mammalian Nudix proteins cleave nucleotide metabolite caps on RNAs.
  findings:
  - statement: Recombinant mouse Nudt2 has dpCoA-cap and FAD-cap RNA decapping activity
      in vitro, lost in the EE-QQ catalytic mutant, and no deNADding activity.
    supporting_text: >-
      Additionally, we identify seven Nudix proteins (Nudt2, Nudt7, Nudt8, Nudt15,
      Nudt16 and Nudt19) that possess dpCoA cap decapping (deCoAping) activity in vitro,
      and two Nudix proteins (Nudt2 and Nudt16) possessing FAD cap decapping (deFADding)
      activity.
  - statement: Loss of Nudt2 in cells did not change FAD-capped RNA levels, so a cellular
      deFADding role is not supported.
    supporting_text: >-
      while a similar function cannot be attributed to Nudt2 at least under the growth
      conditions and the cells employed
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Only study that assayed the mouse protein directly (full text cached); cited by UniProt P56380 for FUNCTION/CATALYTIC ACTIVITY. Activities are in vitro, secondary to Ap4A hydrolysis.
- id: PMID:23353937
  title: Multiple Nudix family proteins possess mRNA decapping activity.
  findings:
  - statement: Recombinant mouse Nudt2 decaps monomethylated and unmethylated capped
      RNA in vitro, releasing both m7GMP and m7GDP.
    supporting_text: >-
      Here we demonstrate that six additional mouse Nudix proteins--Nudt2, Nudt3, Nudt12,
      Nudt15, Nudt17, and Nudt19--have varying degrees of decapping activity in vitro
      on both monomethylated and unmethylated capped RNAs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Direct in vitro assay of the mouse protein; abstract-only in cache. Decapping product is mixed (m7GMP and m7GDP), so neither m7G-cap decapping MF term fits cleanly.
- id: PMID:27144453
  title: NUDT2 Disruption Elevates Diadenosine Tetraphosphate (Ap4A) and Down-Regulates
    Immune Response and Cancer Promotion Genes.
  findings:
  - statement: Disruption of human NUDT2 in KBM-7 cells raises intracellular Ap4A 175-fold
      and alters expression of thousands of genes.
    supporting_text: >-
      KBM-7 cells in which the NUDT2 Ap4A hydrolase gene had been disrupted (NuKO
      cells), causing a 175-fold increase in intracellular Ap4A
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human orthologue knockout; establishes NUDT2 as the dominant cellular Ap4A-degrading enzyme. Full text cached.
- id: PMID:37934413
  title: "Diadenosine Tetraphosphate (Ap(4) A) Serves as a 5' RNA Cap in Mammalian Cells."
  findings:
  - statement: Ap4A-capped RNA exists in human and rat cells and NUDT2 is one of two
      enzymes that cleave it.
    supporting_text: >-
      A decapping enzyme screen identifies two enzymes cleaving Ap4 A-RNA,NUDT2 and DXO,
      both of which also cleave other substrate RNAs in vitro.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human NUDT2, in vitro decapping screen; abstract-only in cache.
- id: PMID:38141063
  title: Biallelic NUDT2 variants defective in mRNA decapping cause a neurodevelopmental
    disease.
  findings:
  - statement: Biallelic loss-of-function NUDT2 variants cause a recessive
      neurodevelopmental disorder; add-back experiments implicate loss of decapping in
      the altered mRNA homeostasis of patient fibroblasts.
    supporting_text: >-
      Importantly, add-back experiments using an Ap4A hydrolase defective in mRNA
      decapping highlighted loss of NUDT2 decapping as the activity implicated in
      altered mRNA homeostasis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human genetics and patient-cell study; abstract-only in cache, so the identity of the decapping-defective Ap4A hydrolase used for add-back is not stated (the deep research report reads it as a NUDT2 separation-of-function variant, which the abstract does not say).
- id: file:mouse/Nudt2/Nudt2-deep-research-openscientist.md
  title: OpenScientist deep research for Nudt2
  findings:
  - statement: Most biochemical and localization data for Nudt2 derive from orthologues;
      no mouse knockout phenotype was found.
    supporting_text: >-
      No *Nudt2* knockout mouse phenotype was identified in the reviewed literature.
core_functions:
- description: >-
    Asymmetrical hydrolysis of diadenosine 5',5'''-P1,P4-tetraphosphate (Ap4A) to AMP
    and ATP by a metal-dependent Nudix active site, controlling intracellular Ap4A
    levels, including turnover of the Ap4A signal that derepresses MITF/USF2 in
    activated mast cells.
  molecular_function:
    id: GO:0004081
    label: bis(5'-nucleosyl)-tetraphosphatase (asymmetrical) activity
  directly_involved_in:
  - id: GO:0015967
    label: diadenosine tetraphosphate catabolic process
  supported_by:
  - reference_id: PMID:11738085
    supporting_text: >-
      It hydrolyses Ap4A with a K(m) of 7 microM and k(cat) of 27 s(-1) producing AMP and
      ATP as products.
  - reference_id: PMID:18644867
    supporting_text: >-
      we provided here evidence that the "Nudix" type 2 gene product, Ap(4)A
      hydrolase, is responsible for Ap(4)A degradation following the immunological
      activation of mast cells.
suggested_questions:
- question: >-
    Does Nudt2 loss in mice raise tissue Ap4A levels and alter MITF/USF2-dependent
    transcription in mast cells or cardiomyocytes in vivo?
- question: >-
    Is a fraction of Nudt2 genuinely resident in mitochondria (as proteomic datasets
    suggest), and if so does it control a mitochondrial Ap4A pool?
- question: >-
    Which RNA cap substrates (m7G, Ap4A, dpCoA, FAD) does Nudt2 decap in vivo, and should
    its RNA decapping be captured by a GO term? Nudt2 releases both m7GMP and m7GDP from
    m7G-capped RNA in vitro, so neither GO:0140932 nor GO:0140933 fits cleanly, and GO
    has no Ap4A-cap, FAD-cap or dpCoA-cap decapping terms.
- question: >-
    Do the in vitro dpCoA-cap and FAD-cap decapping activities of Nudt2 have any
    physiological substrate in mammalian cells, given that Nudt2 loss did not change
    FAD-capped RNA levels?
suggested_experiments:
- description: >-
    Characterise a Nudt2 knockout or patient-variant knock-in mouse for brain Ap4A levels,
    mRNA half-lives of host-response/interferon genes and neurodevelopmental phenotypes,
    using decapping-defective versus Ap4A-hydrolysis-defective rescue alleles to separate
    the two activities.
- description: >-
    Measure Ap4A/Ap3A by LC-MS in Nudt2 knockout mouse tissues and bone-marrow-derived
    mast cells at baseline and after FcepsilonRI activation, together with RNA-seq of
    MITF/USF2 targets.
- description: >-
    Determine Nudt2 subcellular distribution (cytosol, nucleus, mitochondrial matrix)
    in mouse tissues by fractionation with protease protection and by an endogenous
    epitope-tagged allele.
