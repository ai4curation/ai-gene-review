- term:
    id: GO:0015967
    label: diadenosine tetraphosphate catabolic process
  evidence_type: ISS
  original_reference_id: PMID:18644867
  qualifier: involved_in
  review:
    summary: >-
      Proposed process for the enzyme: degradation of Ap4A. The mammalian Nudt2 gene
