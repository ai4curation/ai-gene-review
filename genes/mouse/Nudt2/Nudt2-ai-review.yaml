- term:
    id: GO:0015967
    label: diadenosine tetraphosphate catabolic process
  evidence_type: ISS
  original_reference_id: PMID:18644867
  qualifier: involved_in
  review:
    summary: >-
      Proposed process for the enzyme: degradation of Ap4A. The mammalian Nudt2 gene
      product is responsible for Ap4A degradation in activated mast cells, and its
      knockdown alters Ap4A accumulation; the worm orthologue carries this term by IDA.
    action: NEW
    reason: >-
      Nudt2 itself performs the hydrolytic step that destroys Ap4A, so it does the work
      of this process (not a substrate or requirement relationship). The comparator
      Ap4A hydrolase ndx-4 carries GO:0015967 by IDA. This replaces the product-based
      AMP/ATP biosynthetic process terms as the correct process annotation.
    additional_reference_ids:
    - PMID:11738085
    supported_by:
    - reference_id: PMID:18644867
      supporting_text: >-
        The knockdown of Ap(4)A hydrolase modulated Ap(4)A accumulation, resulting in
        changes in the expression of MITF and USF2 target genes.
    - reference_id: PMID:11738085
      supporting_text: >-
        The purified recombinant enzyme behaves as a typical animal Ap4A hydrolase.
