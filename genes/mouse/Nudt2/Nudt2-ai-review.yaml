id: P56380
gene_symbol: Nudt2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Nudt2 (Apah1) encodes the mouse asymmetrical diadenosine tetraphosphate (Ap4A)
  hydrolase, a small (147 aa) monomeric Nudix hydrolase of the PTHR21340:SF0 subfamily
  that is the orthologue of human NUDT2 and C. elegans ndx-4. By homology to the
  biochemically characterised pig, human and nematode enzymes it cleaves Ap4A (and
  related dinucleoside tetraphosphates such as Gp4G) asymmetrically to a nucleoside
  monophosphate plus the corresponding triphosphate (AMP + ATP for Ap4A), using the
  Nudix-box glutamates and divalent metal ions. Its main presumed physiological role is
  to set intracellular Ap4A levels; in immunologically activated mast cells the
  mammalian Ap4A hydrolase degrades the Ap4A that releases MITF and USF2 from HINT1
  inhibition, so it acts as the turnover enzyme for Ap4A as a second messenger in
  transcriptional regulation. Recombinant mouse Nudt2 also removes dpCoA and FAD caps
  from RNA in vitro, but loss of Nudt2 did not change FAD-capped RNA levels in cells.
  Mouse-specific experimental data are otherwise limited to proteomic detection,
  including in mitochondrial fractions.
