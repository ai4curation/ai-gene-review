id: P56380
gene_symbol: Nudt2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Nudt2 (Apah1) encodes the mouse asymmetrical diadenosine tetraphosphate (Ap4A)
  hydrolase, a small (147 aa) soluble Nudix hydrolase of the PTHR21340:SF0 subfamily
  that is the orthologue of human NUDT2 (89% identical) and C. elegans ndx-4. By
  homology to the biochemically characterised pig, human and nematode enzymes it cleaves
  Ap4A (and related dinucleoside polyphosphates such as Gp4G) asymmetrically to a
  nucleoside triphosphate plus a nucleoside monophosphate (AMP + ATP for Ap4A), using
  the Nudix-box glutamates and divalent metal ions. Its main physiological role is to
  set intracellular Ap4A levels: disruption of the human gene raises Ap4A about 175-fold,
  and in immunologically activated mast cells the mammalian enzyme degrades the Ap4A
  that releases MITF and USF2 from HINT1 inhibition, terminating Ap4A second-messenger
  signalling. The same active site also removes 5' caps from RNA: recombinant mouse
  Nudt2 decaps m7G- and unmethylated G-capped RNA (releasing m7GMP and m7GDP), dpCoA-
  and FAD-capped RNA in vitro, and human NUDT2 cleaves Ap4A-capped RNA. In human patient
  cells loss of NUDT2 decapping alters mRNA half-life, and biallelic NUDT2 loss causes a
  recessive neurodevelopmental disorder. Mouse-specific data on localization are limited
  to proteomic detection, including in mitochondrial fractions; the Drosophila orthologue
  is predominantly nuclear.
