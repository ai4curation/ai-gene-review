suggested_questions:
- question: Is an NF-kappa-B-dependent branch downstream of this receptor pair annotatable? The
    profilin-induced IL-12 response of dendritic cells required MyD88 and IRF8 and not
    NF-kappa-B1 or NF-kappa-B2, while NF-kappa-B activation was reported in macrophages and
    plasmacytoid dendritic cells.
- question: Which of GO:0034170 (toll-like receptor 11 signaling pathway) and GO:0034174 (toll-like
    receptor 12 signaling pathway) applies to Q6QNU9 and which to Q6R5P0? The term names follow
    the literature receptor names, which are inverted relative to the MGI and UniProt symbols,
    so the numbered terms cannot be annotated until GO and MGI agree a mapping, and the definitions
    may be clearer if they cite accessions.
- question: Should the GO:0009617 row currently on Tlr11 (IMP, PMID:15001781, WITH allele MGI:3045751)
    be moved here, where the allele and the UniProt reference assignment both point? This review
    proposes the annotation on this entry but does not remove the paralogue's row.
- question: Are flagellin and profilin recognised by the same surface of this receptor? The two
    ligands are unrelated in structure, and no binding site has been mapped for either, so it
    is unknown whether one ectodomain site is promiscuous or two distinct sites exist.
- question: Does the receptor function as a flagellin sensor in the same intracellular compartment
    in which it senses profilin? Flagellin recognition by surface TLR5 is extracellular, whereas
    this receptor is UNC93B1-dependent and endolysosomal, which implies that flagellin must reach
    an endosomal compartment to be detected.
suggested_experiments:
- description: 'Publish a sequence-verified mapping of the reagents: sequence the Tlr12<tm1Gho>
    line, the commercial expression plasmids and the widely shared cDNAs, and report which of
    NP_991392 (Q6QNU9) or NP_991388 (Q6R5P0) each corresponds to.'
  hypothesis: The literature names of the pair are interchanged relative to the database symbols;
    a single public mapping would let MGI, UniProt and GO align and would resolve the split annotations
    across the two entries.
  experiment_type: sequence verification of reagents
- description: Compare flagellin and profilin responses side by side in cells expressing this
    receptor alone, the paralogue alone, or both, in wild-type and UNC93B1-deficient backgrounds,
    reading NF-kappa-B activation, IL-12 and receptor localisation.
  hypothesis: Flagellin sensing requires this receptor as a homodimer and is UNC93B1-dependent,
    whereas profilin sensing additionally requires the paralogue.
  experiment_type: receptor activation assay
- description: Map the ligand-binding surfaces by crosslinking or cryo-EM of the ectodomain with
    flagellin and with Toxoplasma profilin, followed by mutagenesis of the contact residues and
    functional testing in macrophages.
  hypothesis: The two structurally unrelated protein ligands engage distinct leucine-rich-repeat
    surfaces of the same ectodomain.
  experiment_type: structural biology with structure-guided mutagenesis
