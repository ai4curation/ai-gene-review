id: Q6QNU9
gene_symbol: Tlr12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Toll-like receptor of the TLR11/TLR12 pair, found in rodents and in some other
  mammals including horses, where both paralogues are transcribed, but with no human counterpart.
  It has a leucine-rich-repeat ectodomain, one transmembrane segment and a cytoplasmic TIR domain,
  and is expressed in macrophages and in liver, kidney and bladder epithelium. Unlike the surface
  TLRs it is an intracellular receptor: it resides in the endoplasmic reticulum, binds the trafficking
  chaperone UNC93B1 directly and engages ligand in endolysosomal compartments. Two chemically
  defined ligands are established, bacterial flagellin and the profilin protein of apicomplexan
  parasites such as Toxoplasma gondii, and the receptor does not respond to the standard panel
  of agonists for other TLRs. On ligand binding it recruits MyD88 through its TIR domain and drives
  IL-12 and IL-6 production and Th1 polarisation; the IL-12 response of dendritic cells to
  profilin was shown to require MyD88 and IRF8 rather than NF-kappa-B1 or NF-kappa-B2, so the
  transcriptional route downstream of the receptor is cell-type dependent; it can act as a homodimer
  and also as a heterodimer with its close paralogue, to which it supplies the MyD88-recruiting
  function. Animals lacking the receptor are highly susceptible to kidney infection by uropathogenic
  bacteria and mount impaired IL-12 responses to Toxoplasma. The literature names of the two paralogues
  are interchanged relative to the MGI and UniProt gene symbols, so published work on "TLR11"
  refers to this protein.'
