  review:
    summary: An ER-resident, UNC93B1-dependent receptor that engages ligand in endolysosomes;
      the plasma-membrane location was inherited from surface-TLR donors.
    action: MODIFY
    reason: 'The PAINT node''s donors are cell-surface receptors (TLR1, TLR2, TLR4, TLR5, TLR6,
      Drosophila Toll), and the location did not transfer: this receptor resides in the endoplasmic
      reticulum in resting cells, interacts directly with UNC93B1, and both members of the pair
      were shown to act as endosomal TLRs. Endosome is proposed as the compartment of action;
      the resting ER pool is recorded in the description rather than as a competing annotation,
      because the published evidence describes trafficking from ER to endolysosome rather than
      steady-state residence in one place. Ligand-binding biochemistry supports endosome for at
      least the flagellin response: binding to flagellin requires acidic pH and works with the
      cathepsin-generated C-terminal fragment, so the authors place that recognition event in an
      acidic endolysosomal compartment. The same study notes that profilin binding needs the
      uncleaved receptor and is seen at neutral pH, leaving open a pre-cleavage compartment for
      profilin recognition; this nuance is recorded in the notes and as a suggested question
      rather than as a second competing location annotation.'
