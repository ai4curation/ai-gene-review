  review:
    summary: Transferred from human USP8, which is recruited to the midbody late in cytokinesis; its depletion
      causes cytokinesis defects and it deubiquitylates the v-SNARE VAMP8 at the central spindle.
    action: KEEP_AS_NON_CORE
