  review:
    summary: UBPY binds 14-3-3 epsilon, gamma and zeta through the phospho-Ser680 RSYS(680)SP motif. Binding
      inhibits its catalytic activity in interphase and keeps it cytosolic, and the inhibition is released
      by dephosphorylation in M phase.
    action: NEW
    reason: 'This is a regulatory molecular function of mouse Usp8 shown directly in mouse brain (14-3-3epsilon
      pulldown) and by co-immunoprecipitation with phosphosite mutagenesis. It is the mechanism that keeps
      the enzyme restrained, and its human equivalent (Ser718) is the hotspot for Cushing disease mutations.
      No existing annotation captures it: the 14-3-3 interactions are not in GOA, even as bare protein
      binding.'
    supported_by:
