  review:
    summary: IBA from PTN002538135, the PTHR21646 deubiquitinase node. Mouse Usp8 stabilizes Nrdp1/RNF41
      and Ras-GRF1, and Usp8 deletion in mice causes loss of EGFR, MET and ERBB3.
    action: ACCEPT
    reason: 'Controlling substrate stability by removing ubiquitin is the main cellular outcome of USP8
      activity, and it is directly shown in mouse: catalytic-dead USP8 destabilizes Nrdp1, mUBPy extends
      Ras-GRF1 half-life, and Usp8-null cells lose RTKs. The direction is context-dependent (EGFR can
      be protected or routed to degradation), so the regulation-level term is appropriately general.'
    supported_by:
