      of a cell-cycle role is reasonable. USP8 acts in cytokinesis as an enzyme (VAMP8 deubiquitylation
      at the cleavage site), so this is more than a downstream phenotype, but cytokinesis is peripheral
      to its main endosomal role. No mouse-specific cytokinesis experiment is available.
