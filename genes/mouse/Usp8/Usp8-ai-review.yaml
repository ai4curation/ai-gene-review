      Ras signal transduction. The paper itself concludes only that mUBPy 'may play a role in controlling
      degradation' of the GEF. Separately, the WITH/FROM accession appears to be a name collision between
      CDC25(Mm) (Ras-GRF1) and the Cdc25C phosphatase, which should be reported to MGI.
    supported_by:
