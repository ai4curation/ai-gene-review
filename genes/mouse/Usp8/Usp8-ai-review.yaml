core_functions:
- description: Usp8 is a cysteine-type deubiquitinase that removes K48- and K63-linked ubiquitin from
    endosomal cargo and sorting machinery (EGFR, Eps15). This sets the ubiquitination level of early endosomes,
    which controls cargo sorting, receptor tyrosine kinase fate and endosome morphology. Activity is shown
    directly for the mouse protein; linkage specificity is inferred from the human SF27 ortholog.
  molecular_function: &id028
    id: GO:0004843
    label: cysteine-type deubiquitinase activity
  directly_involved_in:
  - id: GO:0016579
    label: protein deubiquitination
  - id: GO:0007032
    label: endosome organization
  locations:
  - id: GO:0010008
    label: endosome membrane
  - id: GO:0005769
    label: early endosome
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id001
  - *id004
  - *id013
  - *id010
  - *id027
- description: Usp8 deubiquitinates and stabilizes interacting regulators and receptors, including the
    E3 ligase Nrdp1/RNF41 (bound through the rhodanese and catalytic domains), Ras-GRF1 and FZD5. In vivo
    it maintains receptor tyrosine kinase levels. The mouse evidence is substrate-level (catalytic-dead
    mutants, half-life and knockout).
  molecular_function: *id028
  directly_involved_in:
  - id: GO:0031647
    label: regulation of protein stability
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id019
  - *id016
  - *id021
  - *id023
- description: Phosphorylated Ser680 binds 14-3-3 proteins. This inhibits Usp8 catalytic activity and
    keeps the enzyme in the cytosol during interphase; dephosphorylation in M phase releases the inhibition.
    Shown directly for mouse Usp8.
  molecular_function:
    id: GO:0071889
    label: 14-3-3 protein binding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id029
  - *id026
  - *id009
- description: Usp8 binds the SH3 domain of STAM2 (Hbp) through the non-canonical PX(V/I)(D/N)RXXKP motif.
    This couples the deubiquitinase to the ESCRT-0 complex; Usp8 loss reduces HRS and STAM2 levels in
    mouse cells.
  molecular_function:
    id: GO:0017124
    label: SH3 domain binding
  locations:
  - id: GO:0010008
    label: endosome membrane
  supported_by:
  - *id005
  - *id006
  - *id010
suggested_questions:
- question: Does the MIT domain of mouse Usp8 bind microtubules directly, as proposed from spermatid cosedimentation
    assays (PMID:20130268), or does the interaction go through ESCRT-III/CHMP partners? The answer decides
    whether microtubule binding is a real molecular function.
- question: Is Usp8 catalytic activity required for acrosome formation in vivo? Its necessity in spermatids
    has not been tested, so acrosome assembly is not annotated here.
- question: The MGI IPI annotation for Ras protein signal transduction (PMID:11500497) cites PR:P48967
    (Cdc25C phosphatase) as the partner, although the paper describes CDC25(Mm)/Ras-GRF1. Should the WITH/FROM
    be corrected, and should the process term be reconsidered?
suggested_experiments:
- description: Germ-cell-specific (e.g. Stra8-Cre) Usp8 deletion, rescued with wild-type or C748A Usp8,
    followed by acrosome morphology and ESCRT-0 cargo analysis in round spermatids.
  hypothesis: Usp8 deubiquitinating activity, not only its scaffolding, is required for acrosome biogenesis.
- description: Ubiquitin-remnant proteomics of Usp8-deleted versus control primary mouse hepatocytes or
    MEFs, with catalytic-trap pulldowns, to separate direct substrates from secondary endosomal effects.
  hypothesis: Direct Usp8 substrates are enriched among endosomal sorting components and RTKs whose ubiquitination
    rises acutely after deletion.
