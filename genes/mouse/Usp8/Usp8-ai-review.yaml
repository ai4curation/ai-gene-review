  - PANTHER:PTN008578257
  review:
    summary: IBA from PTN008578257. Its only seed is the mouse Usp8 IPI with CDC25(Mm)/Ras-GRF1 reviewed
      in the next row.
    action: MARK_AS_OVER_ANNOTATED
    reason: The underlying mouse evidence shows that mUBPy binds the Ras GEF Ras-GRF1 and, when overexpressed,
      lowers its ubiquitination and prolongs its half-life. No Ras activation or downstream readout was
      measured. That supports regulating the stability of a Ras pathway component, not participation in
      Ras signal transduction. Because the node has a single seed, the IBA adds no independent support.
    supported_by:
    - &id014
      reference_id: PMID:11500497
      supporting_text: interacting with the N-terminal domain of the Ras nucleotide exchange factor CDC25(Mm)
    - &id016
      reference_id: PMID:11500497
      supporting_text: In addition the half-life of CDC25Mm protein was considerably increased in the
        presence of mUBPy.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN008578257
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Node placement within the USP8 lineage is sound, but its only seed for this term is the
          mouse Usp8 IPI with Ras-GRF1 (PMID:11500497). That row shows GEF binding and stabilization,
          not participation in Ras signal transduction.
      - source_id: MGI:MGI:1934029
        source_label: Usp8
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Target self-seed. Its experimental row is a binding/stability observation recorded under
          a signalling process term, and its WITH/FROM cites PR:P48967 (Cdc25C) instead of Ras-GRF1.
- term:
    id: GO:0007265
    label: Ras protein signal transduction
  evidence_type: IPI
  original_reference_id: PMID:11500497
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - PR:P48967
  review:
    summary: mUBPy binds the N-terminal half of CDC25(Mm)/Ras-GRF1, decreases its ubiquitination and increases
      its half-life in transfected cells. The GOA WITH/FROM field lists PR:P48967, which resolves to Cdc25C
      (M-phase inducer phosphatase 3), not Ras-GRF1.
