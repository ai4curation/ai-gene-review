id: Q80U87
gene_symbol: Usp8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Usp8 (UBPY) encodes ubiquitin carboxyl-terminal hydrolase 8, a 1080-residue cysteine-type
  deubiquitinase of the peptidase C19/USP family. It has an N-terminal MIT domain, a non-catalytic rhodanese-like
  domain, SH3-binding motifs that engage STAM1/2 of the ESCRT-0 complex, a central phospho-Ser680 14-3-3-binding
  motif, and a C-terminal USP catalytic domain (Cys748 nucleophile). In interphase most of the enzyme
  is cytosolic and held catalytically inhibited by 14-3-3 proteins. It is recruited to early endosome
  membranes, where it removes K48- and K63-linked ubiquitin from endocytosed cargo and from sorting machinery
  (EGFR, Eps15, ESCRT-0). This controls cargo sorting, receptor tyrosine kinase stability and degradation,
  and endosome morphology. It also stabilizes partners such as the E3 ligase Nrdp1/RNF41 and the Ras GEF
  Ras-GRF1, and the Wnt receptor FZD5. It is released from 14-3-3 and activated in M phase, and localizes
  to the midbody at the end of cytokinesis. It is highly expressed in testis, where it associates with
  ESCRT-0-positive vesicles and microtubules during acrosome formation. In mouse, Usp8 is essential: germline
  loss is embryonic lethal and adult deletion causes liver failure with loss of EGFR, MET and ERBB3. Tissue-specific
  deletions show requirements in T-cell development and homeostasis, osteoblast differentiation and endothelial
  angiogenesis.'
