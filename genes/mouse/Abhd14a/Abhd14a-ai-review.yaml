knowledge_gaps:
- gap_statement: >-
    The endogenous physiological acetyl/acyl donor and acceptor substrates of
    Golgi-localized type II membrane enzyme ABHD14A are unknown, and whether CoA
    is accessible to its lumenal catalytic domain in vivo is unresolved.
  boundary: >-
    Mouse Abhd14a retains a complete Ser147-Asp198-His225 catalytic triad, and
    engineered soluble N-terminally truncated human ABHD14A turns over synthetic
    short-chain p-nitrophenyl esters with CoA enhancement in vitro
    (PMID:42469586), but native substrates have not been identified.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: NARROWING
  significance: >-
    Prevents confident assignment of a specific native molecular function and
    guards against false paralog transfer of cytosolic/nuclear KDAC activity
    from ABHD14B (PMID:37974539).
  resolution: >-
    Perform untargeted lipidomic, glycoproteomic, and lumenal metabolite/peptide
    substrate profiling in Golgi fractions from WT vs Abhd14a-S147A catalytic-dead
    cells or mouse tissues.
  provenance:
  - reference_id: PMID:42469586
    supporting_text: >-
      Together, these findings establish the enzymatic
      activity, mechanistic features, and subcellular localization of ABHD14A while
      providing essential biochemical tools that can now enable the systematic
      discovery of its physiological substrates and regulatory contexts.
- gap_statement: >-
    The physiological process in which mouse ABHD14A participates — including
    whether Dorz1 expression downstream of Zic1 in embryonic cerebellar granule
    neuron precursors reflects a functional requirement in neural development or
    Golgi secretory biology — has not been tested by loss-of-function genetics.
  boundary: >-
    Dorz1 mRNA peaks at E17.5 in mouse cerebellar granule neuron precursors and
    is downregulated in Zic1-deficient cerebellum (PMID:14667578), which
    establishes transcriptional regulation rather than functional participation.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    UniProt's 'Possible role in granule neuron development' rests solely on
    Zic1-dependent mRNA expression (PMID:14667578).
  resolution: >-
    Generate germline and cerebellar-precursor conditional Abhd14a-knockout mice
    to test cerebellar foliation, granule neuron differentiation, and Golgi
    glycosylation/secretory phenotypes.
  provenance:
  - reference_id: PMID:14667578
    supporting_text: >-
      These results suggest that 
      Dorz1 expression is positively regulated by Zic1 during cerebellar development.
suggested_questions:
- question: >-
    What endogenous Golgi lumenal or membrane-associated substrate does mouse
    ABHD14A act upon, and how does its predicted lumenal active-site orientation
    reconcile with the CoA enhancement observed for truncated soluble ABHD14A
    in vitro (PMID:42469586)?
- question: >-
    Does Abhd14a knockout in mice impair cerebellar granule neuron development
    downstream of Zic1 (PMID:14667578), or is Dorz1 dispensable in developing
    cerebellum?
suggested_experiments:
- hypothesis: >-
    Mouse ABHD14A modifies a specific Golgi lumenal or membrane-associated
    esterified substrate in developing mouse cerebellum and testis.
  description: >-
    Determine membrane topology by protease-protection and deglycosylation
    assays on endogenous E17.5 mouse cerebellar ABHD14A, followed by comparative
    ABPP and metabolomic/acylome profiling of WT vs Abhd14a-knockout Golgi
    membranes.
  experiment_type: membrane topology, genetics, and metabolomics
