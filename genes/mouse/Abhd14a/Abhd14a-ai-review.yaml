- term:
    id: GO:0016407
    label: acetyltransferase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9BUJ0
  review:
    summary: >-
      UniProt sequence-similarity transfer of acetyltransferase activity from
      human ABHD14A (Q9BUJ0), resting on CoA-enhanced synthetic p-nitrophenyl
      acetate turnover by an engineered N-terminally truncated human construct
      in vitro (PMID:42469586).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMID:42469586 demonstrated real in vitro enzymatic activity of a soluble
      N-terminally truncated human ABHD14A construct on surrogate short-chain
      p-nitrophenyl esters with CoA-dependent enhancement, but explicitly noted
      that physiological donor and acceptor substrates remain undiscovered; per
      enzyme-specificity guidelines, real in vitro surrogate-ester turnover of
      unknown physiological relevance is marked as over-annotated rather than
      accepted as established native function.
    supported_by:
    - reference_id: PMID:42469586
      supporting_text: >-
        Notably, ABHD14A exhibits a coenzyme A-dependent enhancement of p-nitrophenyl
        acetate hydrolysis, indicative of a ping-pong type acetyltransferase mechanism
        similar to that previously described for another homologous ABHD14 enzyme,
        ABHD14B.
    - reference_id: PMID:42469586
      supporting_text: >-
        Together, these findings establish the enzymatic
        activity, mechanistic features, and subcellular localization of ABHD14A while
        providing essential biochemical tools that can now enable the systematic
        discovery of its physiological substrates and regulatory contexts.
