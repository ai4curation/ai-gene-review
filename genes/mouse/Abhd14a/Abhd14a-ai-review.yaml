gene_symbol: Abhd14a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Single-pass type II membrane alpha/beta-hydrolase (247 aa; synonym Dorz1)
  containing an N-terminal signal-anchor transmembrane helix (residues 11-31),
  predicted lumenal N-glycosylation at Asn43, and a conserved Ser147-Asp198-His225
  catalytic triad whose physiological substrate and biological function remain
  uncharacterized. Originally identified as a Zic1-upregulated transcript
  enriched in embryonic day 17.5 mouse cerebellar granule neuron precursors,
  ABHD14A is a membrane-anchored paralog of the soluble cytosolic/nuclear
  lysine deacetylase ABHD14B; overexpressed human ABHD14A-GFP localizes to the
  Golgi apparatus and an engineered truncated human construct turns over
  synthetic short-chain p-nitrophenyl esters in vitro with CoA-dependent
  enhancement, but native substrates and in vivo roles are unknown.
