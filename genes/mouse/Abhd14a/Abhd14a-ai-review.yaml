- id: PMID:14667578
  title: Dorz1, a novel gene expressed in differentiating cerebellar granule neurons,
    is down-regulated in Zic1-deficient mouse.
  findings:
  - statement: >-
      Mouse Dorz1 (Abhd14a) transcripts peak at embryonic day 17.5 in
      cerebellar granule neuron precursors and are positively regulated by
      Zic1, without establishing a catalytic or developmental-process mechanism
      for the encoded protein.
    supporting_text: >-
      The expression of 
      Dorz1 in the developing cerebellum peaked at embryonic day 17.5, and at that 
      stage Dorz1 transcripts were detected in cerebellar granule neuron precursors 
      where Zic1 expression is enhanced.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary expression and localization study of mouse Dorz1 (Abhd14a);
      transcriptional regulation downstream of Zic1 does not establish direct
      participation in cerebellar granule neuron development.
- id: PMID:37974539
  title: Identification of sequence determinants for the ABHD14 enzymes.
  findings:
  - statement: >-
      High sequence similarity between ABHD14A and the mammalian lysine
      deacetylase ABHD14B causes automated databases to conflate the two
      divergent paralogs.
    supporting_text: >-
      Given 
      their high sequence similarity, automated databases often wrongly assign ABHD14A 
      and ABHD14B as the same enzyme, and therefore, annotating functions to them in 
      various organisms has been problematic.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Defines sequence determinants separating membrane-anchored SF1 (ABHD14A)
      from soluble KDAC SF2 (ABHD14B).
- id: PMID:42469586
  title: Biochemical Characterization of ABHD14A, an Outlying Member of the Metabolic
    Serine Hydrolase Family.
  findings:
  - statement: >-
      Engineered soluble N-terminally truncated human ABHD14A turns over
      short-chain p-nitrophenyl esters with CoA-dependent enhancement in vitro,
      and full-length human ABHD14A-GFP localizes to the Golgi apparatus in
      HEK293T cells, while physiological substrates remain unknown.
    supporting_text: >-
      Together, these findings establish the enzymatic
      activity, mechanistic features, and subcellular localization of ABHD14A while
      providing essential biochemical tools that can now enable the systematic
      discovery of its physiological substrates and regulatory contexts.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Peer-reviewed 2026 biochemical characterization of human ABHD14A showing
      in vitro surrogate p-nitrophenyl acetate turnover and Golgi localization
      of overexpressed ABHD14A-GFP, while explicitly leaving physiological
      substrates open.
