- term:
    id: GO:0032355
    label: response to estradiol
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000028262
  - UniProtKB:P02662
  review:
    summary: Propagated from a bovine annotation based on steroid inhibition of casein synthesis in mammary
      explants.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The source study measured changes in casein synthesis and mRNA accumulation in bovine mammary
      explants treated with high doses of steroids. Casein is a transcriptional/synthetic readout of hormone
      action on mammary epithelial cells, not a participant in the cellular response to the hormone. An
      expression readout should not be propagated as a biological process of the gene product, and there
      is no evidence that mouse alpha-S1-casein participates in estradiol signalling. Marked over-annotated
      rather than removed or kept: the underlying bovine explant experiment is real and GO conventionally
      admits expression-level hormone responses, but the casein protein performs no step of the response;
      this matches the call made across the casein family reviews.'
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000028262
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The ancestral node carries a steroid-response process seeded from a bovine explant study
          in which casein synthesis was only the readout of hormone action.
      - source_id: UniProtKB:P02662
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Bovine alpha-S1-casein IDA from PMID:3585228 records inhibition of casein synthesis by
          high-dose steroids, an expression readout rather than a process executed by casein.
    supported_by:
    - reference_id: PMID:3585228
      supporting_text: However, inhibition was only achieved by using concentrations of progesterone exceeding
        by 1000-fold those required for similar effects in tissue from non-lactating animals.
