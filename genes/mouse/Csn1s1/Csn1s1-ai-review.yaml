  review:
    summary: Alpha-casein knockout dams secrete less milk protein and calcium phosphate, and their pups
      grow poorly, establishing a role for alpha-casein in milk production.
    action: ACCEPT
    reason: The gene product is a major structural constituent of the casein micelle, the vehicle in which
      milk protein and calcium phosphate are packaged for secretion, and its absence curtails secretion
      of other milk proteins. This is direct participation in milk production rather than mere necessity,
      and is consistent with the family-wide lactation annotations.
