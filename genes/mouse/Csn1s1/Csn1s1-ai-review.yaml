product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Alpha-S1-casein (mouse alpha-casein) is a secreted, intrinsically disordered, multiply phosphorylated
  milk protein expressed almost exclusively in the lactating mammary epithelium. It is the most abundant
  calcium-sensitive casein in mouse milk and carries three of the phosphoserine clusters (phosphate centres)
  of the mouse caseins. Together with the other calcium-sensitive caseins it sequesters nanoclusters of
  amorphous calcium phosphate and self-assembles, with kappa-casein at the surface, into casein micelles,
  allowing milk to carry high concentrations of protein, calcium and phosphate to the young without precipitating
  or calcifying the gland. Mice lacking alpha-casein secrete milk with markedly reduced casein, whey protein,
  calcium and phosphate content, and their pups grow slowly and remain permanently smaller. Casein proteolysis
  in the gut supplies amino acids, calcium and phosphopeptides to the neonate.
