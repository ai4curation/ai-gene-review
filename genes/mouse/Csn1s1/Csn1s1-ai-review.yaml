suggested_questions:
- question: Does mouse alpha-S1-casein have a role in intracellular trafficking or export of the other
    caseins from the endoplasmic reticulum, as suggested by the ER-stress phenotype of the knockout, or
    is the secretion defect secondary to calcium phosphate precipitation in secretory vesicles?
- question: Should GO provide a molecular-function term for calcium phosphate (nanocluster) sequestering
    activity, distinct from calcium ion sequestering activity, for caseins and other secreted calcium-binding
    phosphoproteins?
suggested_experiments:
- description: Rescue alpha-casein knockout mammary glands with alpha-casein variants lacking individual
    phosphoserine clusters and measure milk calcium/phosphate content, micelle size and secretion of the
    other caseins, to separate calcium phosphate sequestration from micelle-scaffolding roles.
