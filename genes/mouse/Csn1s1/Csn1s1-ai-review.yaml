core_functions:
- description: Sequesters nanoclusters of amorphous calcium phosphate through its phosphoserine clusters
    and, together with the other calcium-sensitive caseins and kappa-casein, assembles into casein micelles
    that carry calcium phosphate in milk without precipitation or soft-tissue calcification. Calcium ion
    sequestering activity is used as the closest available GO term; the actual sequestered species is
    calcium phosphate nanoclusters.
