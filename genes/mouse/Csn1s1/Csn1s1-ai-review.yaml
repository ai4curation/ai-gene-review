- term:
    id: GO:0140313
    label: molecular sequestering activity
  evidence_type: IMP
  original_reference_id: PMID:21789179
  qualifier: enables
  supporting_entities:
  - MGI:MGI:5285947
  review:
    summary: Alpha-casein deficiency reduces milk calcium and phosphate by about 90 percent, consistent
      with sequestration of amorphous calcium phosphate by its phosphate centres.
    action: MODIFY
    reason: 'Calcium-sensitive caseins bind and sequester nanoclusters of amorphous calcium phosphate
      through clusters of phosphoserine residues, preventing precipitation or apatite formation in milk
      and the gland. The general term is correct but can be refined to its descendant calcium ion sequestering
      activity (GO:0140314), used as the core molecular function across the casein family reviews. This
      is an approximation: the sequestered species is calcium phosphate nanoclusters rather than free
      calcium ions, and GO has no calcium phosphate-specific sequestering term (see suggested_questions).'
    proposed_replacement_terms:
    - id: GO:0140314
      label: calcium ion sequestering activity
    supported_by:
    - reference_id: PMID:21789179
      supporting_text: the lower casein protein levels in α-casein deficient mice are accompanied by a
        significantly lower concentration of calcium and phosphate in milk
    - reference_id: PMID:21789179
      supporting_text: Phosphate centres can sequester amorphous calcium phosphate, probably in the Golgi
        vesicles of mammary secretory cells, to form thermodynamically stable complexes of defined chemical
        composition
    - reference_id: PMID:23958008
      supporting_text: A typical casein micelle contains thousands of casein molecules, most of which
        form thermodynamically stable complexes with nanoclusters of amorphous calcium phosphate.
