id: P18181
gene_symbol: Cd48
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Cd48 (SLAMF2, BCM1, sgp-60) is a glycosylphosphatidylinositol (GPI)-anchored cell-surface glycoprotein of the CD2/SLAM subset of the immunoglobulin superfamily, with an N-terminal V-set domain and a membrane-proximal C2-set domain. It is expressed broadly on hematopoietic cells and partitions into lipid rafts. Mouse CD48 is the principal ligand of CD2 on T cells, mediating weak heterophilic CD2-CD48 adhesion, and it binds the SLAM-family receptor 2B4 (CD244) on NK cells and T cell subsets with 6-9-fold higher affinity than CD2. Engagement of CD48 by CD2 at the T cell:antigen-presenting cell contact recruits rafts and enhances TCR zeta phosphorylation and T cell activation, while CD48 engagement of 2B4 regulates NK-cell function. In mouse this axis is predominantly inhibitory, acting as an MHC-independent NK self-tolerance system, although CD48 on MHC-I-deficient targets can also contribute to NK activation; this is the opposite of the activating CD48-2B4 signal in human NK cells.
  Cd48-deficient mice show defects in the induction of tolerance. CD48 is also widely used, with CD150, as a negative surface marker for hematopoietic stem cells.
