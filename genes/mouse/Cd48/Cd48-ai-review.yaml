suggested_questions:
- question: Which 2B4 isoform (short activating vs long inhibitory) dominates CD48-triggered signaling in mouse NK cells in vivo, and does cis CD48-2B4 binding on NK cells explain the inhibitory phenotypes reported in mouse?
- question: How much of the T cell activation defect of Cd48-deficient mice reflects loss of CD2 ligation versus loss of 2B4 ligation or of CD48 raft-mediated signaling within the T cell itself?
- question: Is CD48 functionally relevant on mouse hematopoietic stem and progenitor cells, or is its absence on HSCs only a marker?
- question: Does a Cd48-only knockout (rather than the whole Slam locus) reproduce enhanced NK killing, and how do cis CD48 on the NK cell and trans CD48 on targets each contribute to the net inhibitory output in mouse?
suggested_experiments:
- hypothesis: CD48 inhibitory versus activating effects on mouse NK cells depend on 2B4 isoform and on cis versus trans engagement.
  description: Compare NK cytotoxicity and IFN-gamma production of wild-type, Cd48-/- and Cd244-/- NK cells against CD48-positive and CD48-negative targets, and reconstitute 2B4-deficient NK cells with short or long 2B4 isoforms.
  experiment_type: genetic perturbation with functional assay
- hypothesis: CD48 on the T cell contributes to TCR signaling independently of its CD2 ligand function.
  description: Reconstitute Cd48-/- T cells with wild-type CD48 or with a CD2-binding-deficient CD48 mutant (based on the mouse CD2-CD48 interface) and measure TCR zeta phosphorylation, raft recruitment and IL-2 production after stimulation with CD2-positive APCs.
  experiment_type: mutagenesis and signaling assay
