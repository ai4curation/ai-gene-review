- term:
    id: GO:0030101
    label: natural killer cell activation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008532944
  - UniProtKB:P06729
  - UniProtKB:P09326
  review:
    summary: Mouse CD48 regulates NK cell activation in both directions through 2B4; the dominant in vivo effect is inhibitory, so the positive 'natural killer cell activation' term, transferred from human, misstates its role.
    action: MODIFY
    reason: 'Re-assessed with an OpenScientist hypothesis run and the primary mouse literature. In mouse the direction of the CD48-2B4 signal is opposite to human: 2B4 ligation by CD48 on target cells inhibits NK lysis and IFN-gamma (PMID:15123744), 2B4-CD48 forms an MHC-independent inhibitory self-tolerance system (PMID:15870174), and deleting the whole Slam locus, including Cd48, enhances NK activation, with the inhibition mapping solely to 2B4 (PMID:27573813). The main contrary genetic result (PMID:15905190) was reinterpreted by the same group as prevention of fratricide (PMID:17537992). An activating contribution does exist in trans: CD48 on MHC-I-deficient targets contributes to missing-self NK activation (PMID:27054584). CD48 is therefore a bidirectional regulator of mouse NK activation through 2B4, not a participant in a positive activation process; the human-derived positive term should be replaced by the direction-neutral regulation term, with the well-supported inhibitory role
      captured separately (negative regulation of NK cell mediated cytotoxicity, NEW). This follows the convention for HLA-E, a ligand of both inhibitory and activating NK receptors, which carries regulation terms rather than NK cell activation. Not REMOVE, because trans activation by CD48 is directly documented in mouse. For the IBA: the node PTN008532944 is seeded by human CD2 and CD48, where the axis is activating; mouse Cd48 lies inside the clade but has target-specific experimental evidence that the 2B4 output diverges in rodents.'
    supported_by: &id006
    - &id015
      reference_id: PMID:15123744
      supporting_text: Surprisingly, we have found, using antibody-blocking and 2B4-deficient NK cells, that NK lysis of CD48(+) tumor and allogeneic targets is inhibited by 2B4 ligation.
    - &id016
      reference_id: PMID:27573813
      supporting_text: Analyses of mice lacking individual SFRs showed that the inhibitory function of the Slam locus was due solely to 2B4 and was not influenced positively or negatively by other SFRs.
    - reference_id: PMID:27054584
      supporting_text: Here we show that the expression of the Signaling Lymphocyte Activation Molecule (SLAM) family members CD48 and Ly9 (CD229) by MHC-I-deficient tumor cells significantly contributes to NK cell activation.
    - reference_id: PMID:17537992
      supporting_text: We show that in the absence of 2B4 signaling, activated NK cells have defective cytotoxicity and proliferation because of fratricide and not due to the absence of a 2B4-dependent activation signal.
    - reference_id: PMID:16002700
      supporting_text: In human NK cells, 2B4/CD48 interaction induces activation signals, whereas in murine NK cells it sends inhibitory signals.
    proposed_replacement_terms:
    - id: GO:0032814
      label: regulation of natural killer cell activation
    additional_reference_ids:
    - PMID:15123744
    - PMID:15870174
    - PMID:27573813
    - PMID:27054584
    - PMID:17537992
    - file:mouse/Cd48/Cd48-hypotheses/cd48-nk-activation-direction/openscientist.md
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008532944
        comment: PAINT node seeded by human CD2 and human CD48 (UniProtKB:P09326), where CD48-2B4 signalling activates NK cells. Rodent Cd48 is inside the clade; the divergence is in the direction of the 2B4 output in rodents, not in CD48 binding. Mouse has experimental evidence of the reversed direction (PMID:15123744, PMID:27573813).
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
