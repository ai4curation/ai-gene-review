    summary: CD48 on target cells engages 2B4 on mouse NK cells and inhibits NK cytotoxicity; this is an MHC-independent self-tolerance mechanism.
    action: NEW
    reason: 'Participation: CD48 supplies the ligand that engages the inhibitory receptor; NK lysis is inhibited specifically for CD48-positive targets and relieved by 2B4 deficiency (PMID:15123744), the same axis protects syngeneic cells in vivo (PMID:15870174), and whole-locus deletion including Cd48 enhances NK responses (PMID:27573813). Comparator: HLA-E, the ligand of the inhibitory receptor NKG2A, carries GO:0045953 by IDA. Proposed in addition to the direction-neutral regulation term because inhibition is the dominant, multi-laboratory, in vivo-supported outcome in mouse.'
