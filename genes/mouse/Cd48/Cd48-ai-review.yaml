core_functions:
- description: Ligand of the SLAM-family receptor 2B4 (CD244). Cell-surface CD48 binds the 2B4 V domain (Kd ~16 uM in mouse). In mouse NK cells this engagement is predominantly inhibitory, restraining NK cytotoxicity toward CD48-positive cells, with an activating contribution in missing-self recognition.
