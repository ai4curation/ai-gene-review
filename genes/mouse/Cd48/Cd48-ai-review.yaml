      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: RGD:620620
        comment: Rat Cd48 donor; the underlying rat annotation was not traced here. The transfer between rodent orthologs is phylogenetically sound, but the complex term itself is too uninformative to add value for mouse.
        source_status: UNRESOLVED
