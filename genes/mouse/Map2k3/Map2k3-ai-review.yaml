- id: PMID:10097111
  title: Requirement of mitogen-activated protein kinase kinase 3 (MKK3) for tumor necrosis factor-induced cytokine expression.
  findings:
  - statement: Mkk3 disruption selectively impairs TNF-induced p38 activation and IL-1/IL-6/TNF expression in MEFs.
    supporting_text: Mkk3 gene disruption caused a selective defect in the response of fibroblasts to the proinflammatory
      cytokine tumor necrosis factor, including reduced p38 MAP kinase activation and cytokine expression.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; Mkk3 knockout MEFs show a selective defect in TNF-induced p38 activation and cytokine expression.
- id: PMID:10202148
  title: Defective IL-12 production in mitogen-activated protein (MAP) kinase kinase 3 (Mkk3)-deficient mice.
  findings:
  - statement: MKK3-activated p38 is required for inflammatory cytokine production by APCs and CD4 T cells.
    supporting_text: We conclude that the p38 MAP kinase, activated through MKK3, is required for the production of inflammatory
      cytokines by both antigen-presenting cells and CD4(+) T cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; Mkk3-/- macrophages and dendritic cells are defective in IL-12 production.
- id: PMID:11593045
  title: The in vivo role of p38 MAP kinases in cardiac remodeling and restrictive cardiomyopathy.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; gain-of-function transgenic with activated MKK3bE; does not establish a normal role in contraction.
- id: PMID:15767678
  title: Role of the JIP4 scaffold protein in the regulation of mitogen-activated protein kinase signaling pathways.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; JIP4 activation of p38 requires MKK3 and MKK6.
- id: PMID:17438131
  title: Cytokine activation of p38 mitogen-activated protein kinase and apoptosis is opposed by alpha-4 targeting of protein
    phosphatase 2A for site-specific dephosphorylation of MEK3.
  findings:
  - statement: Alpha-4/PP2A dephosphorylates MEK3 Thr193 and suppresses cytokine-induced p38 activation.
    supporting_text: FLAG-alpha-4 coprecipitated hemagglutinin-MEK3 plus endogenous protein phosphatase 2A (PP2A) and selectively
      enhanced dephosphorylation of Thr193, but not Ser189, in the activation loop of MEK3.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read; alpha-4 targets PP2A to the MEK3 activation loop.
- id: PMID:18948261
  title: Murine protein serine/threonine kinase 38 activates apoptosis signal-regulating kinase 1 via Thr 838 phosphorylation.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available; ASK1 associates with its substrate MKK3, enhanced by MPK38.
- id: PMID:8900184
  title: Purification and identification of a major activator for p38 from osmotically shocked cells. Activation of mitogen-activated
    protein kinase kinase 6 by osmotic shock, tumor necrosis factor-alpha, and H2O2.
  findings:
  - statement: MKK3b is a specific p38 activator.
    supporting_text: Like MKK3 and MAPKK6, MKK3b was shown to be a specific activator for p38 and was activated by osmotic
      shock when expressed in COS7 cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; isolation of mouse MKK3b as a specific p38 activator.
- id: PMID:20550965
  title: Activation of ASK1, downstream MAPKK and MAPK isoforms during cardiac ischaemia.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read; rat perfused heart. MKK3 and MKK6 (not MKK4) are activated during ischaemia with different
      kinetics. Not a GOA source for mouse; context only.
  findings:
  - statement: MKK3 and MKK6 are activated by cardiac ischaemia with different time courses.
    supporting_text: Both of the known p38 activators MKK3 and MKK6 were activated by ischaemia but with different time courses
