gene_symbol: Map2k3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Map2k3 encodes MKK3 (MEK3), a dual-specificity protein kinase of the STE group that forms the MAP kinase kinase
  tier of the p38 stress-activated MAPK cascade. It is activated by cytokines and environmental stresses through phosphorylation
  of Ser218 and Thr222 in its activation loop by MAP3Ks such as ASK1, and it phosphorylates the threonine and tyrosine of
  the Thr-Gly-Tyr activation motif of p38 MAP kinases, being specific for p38 over JNK and ERK. Its activity is opposed by
  PP2A, targeted to its activation loop by the alpha-4 regulatory subunit. MKK3 is partly redundant with MKK6, but mouse knockout
  shows it is required for full TNF-induced p38 activation and for inflammatory cytokine production (IL-1, IL-6, TNF in fibroblasts;
  IL-12 in macrophages and dendritic cells). Two splice isoforms exist, including MKK3b.
