core_functions:
- description: 'MKK3 is a dual-specificity MAP kinase kinase of the p38 stress/cytokine cascade: activated by MAP3Ks such
    as ASK1, it phosphorylates the Thr and Tyr of the TGY activation motif of p38 MAPKs, specifically over JNK, and is required
    for full TNF-induced p38 activation.'
  molecular_function: *id006
  directly_involved_in:
  - *id001
  supported_by:
  - *id004
  - *id005
  - *id002
  - *id003
suggested_questions:
- question: Which p38 isoforms does mouse MKK3 preferentially activate in vivo relative to MKK6, and do the MKK3 and MKK3b
    splice isoforms differ in substrate or upstream MAP3K preference?
- question: Why is MKK3 selectively required for TNF- but not IL-1-, UV- or osmotic-stress-induced p38 activation in fibroblasts;
    which MAP3K couples TNF receptor signalling preferentially to MKK3?
suggested_experiments:
- description: Compare TNF, IL-1 and LPS signalling in Mkk3-/-, Mkk6-/- and double-knockout macrophages, with phospho-proteomics
    of p38 isoforms, to define non-redundant MKK3 functions.
- description: In vitro kinase assays with purified active MKK3 and MKK3b against each recombinant p38 isoform to quantify
    substrate preference.
