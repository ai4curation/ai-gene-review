id: Q80WJ7
gene_symbol: Mtdh
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Mtdh (metadherin; LYRIC, AEG-1, 3D3) is a single-pass membrane protein with a long lysine-rich
  cytoplasmic region. It is mainly found in the endoplasmic reticulum and the nuclear envelope. Pools
  are also seen in the nucleolus, at the perinuclear region and, in polarised epithelia, at maturing tight
  junctions. Through an LXXLL motif it binds RXR and blocks coactivator recruitment. This inhibits the
  RXR heterodimer partners PPARalpha and LXR, so Mtdh-null mice are lean and have higher intestinal PPARalpha
  and LXR activity. Mtdh binds and stabilises SND1, which supports mammary tumour-initiating cells. In
  kidney tubules of diabetic mice, Mtdh likewise represses PPARalpha-dependent fatty acid oxidation. The
  human ortholog is a well-studied oncogene that activates NF-kappaB.
