- term:
    id: GO:0035359
    label: negative regulation of peroxisome proliferator activated receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:26070567
  qualifier: involved_in
  review:
    summary: Proposed. Mtdh-null mice have augmented PPARalpha and LXR activity; Mtdh binds RXR and blocks
      coactivator recruitment.
    action: NEW
    reason: 'The knockout raises PPARalpha activity and target-gene expression in mouse enterocytes and
      hepatocytes. The mechanism is direct: Mtdh binds RXR through an LXXLL motif and prevents coactivator
      recruitment to RXR heterodimers. The literature-scan paper reproduces the axis in diabetic kidney,
      where Mtdh knockdown enhances PPARalpha-mediated fatty acid oxidation and a PPARalpha agonist reverses
      the effect of overexpression. GO:0035359 is a widely used term (314 annotations, QuickGO, 2026-11-26).'
    supported_by:
    - reference_id: PMID:26070567
      supporting_text: Here for the first time, we show that the lack of AEG-1 in mice augments LXR and
        PPARα activity, thereby preventing fat absorption from the intestine.
    - reference_id: PMID:26070567
      supporting_text: We have identified a novel interaction between AEG-1 and RXR that interferes with
        co-activator recruitment and inhibits RXR-mediated transcriptional regulation by its heterodimer
        partners
    - reference_id: PMID:42997994
      supporting_text: In mice, MTDH knockdown improved renal function, enhanced FAO via peroxisome proliferator-activated
        receptor alpha (PPARα), and reduced lipotoxicity.
