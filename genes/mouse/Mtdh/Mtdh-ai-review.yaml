  title: Metadherin Impairs PPARα-Mediated Fatty Acid Oxidation to Aggravate Renal Lipotoxicity in Diabetic
    Kidney Disease.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Literature-scan lead (issue 7142). Only the abstract is available. In diabetic mouse
      kidney, AAV9 knockdown of Mtdh enhanced PPARalpha-mediated fatty acid oxidation and reduced lipotoxicity.
      In tubular cells, Mtdh overexpression made the injury worse, and a PPARalpha agonist reversed this.
      It confirms the Mtdh-PPARalpha axis already reported in Mtdh-KO mice (PMID:26070567) and adds a
      kidney context.
- id: PMID:26070567
  title: Astrocyte Elevated Gene-1 (AEG-1) Regulates Lipid Homeostasis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Mtdh/AEG-1 KO mice are lean, with augmented LXR and PPARalpha activity in
      enterocytes. The paper also reports that AEG-1 binds RXR through an LXXLL motif, citing earlier
      work. This is the primary support for the NEW negative regulation of PPAR signalling row.
