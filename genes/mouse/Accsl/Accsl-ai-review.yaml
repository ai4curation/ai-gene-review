core_functions:
- description: >-
    Uncharacterized murine fold-type I PLP-dependent enzyme-like paralog
    (putative pseudoenzyme in PTHR43795:SF1) that retains Lys417, Asp380,
    Trp229, and substrate-orienting Arg551 while substituting Tyr445 at the
    inter-subunit cationic pocket site corresponding to ACCS Arg351; its
    cofactor binding, biochemical activity, cellular localization, and
    physiological function remain undetermined (PMID:39876065).
  supported_by:
  - reference_id: PMID:39876065
    supporting_text: >-
