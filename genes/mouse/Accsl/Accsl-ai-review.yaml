suggested_questions:
- question: >-
    Does retention of Arg551 allow mouse Accsl to bind PLP and catalyze turnover
    of anionic amino-acid or thiol-conjugate substrates despite Tyr445 in the
    partner-subunit pocket?
  experts:
  - Yang Hai
suggested_experiments:
- hypothesis: >-
    Purified mouse Accsl (Arg551/Tyr445) retains covalent PLP binding at Lys417
    and measurable residual ligand binding compared with reference human
    ACCSL-Cys529, but exhibits strongly attenuated C-beta-S lyase turnover due
    to Tyr445.
  description: >-
    Express and purify recombinant mouse Accsl and Accsl-K417A alongside human
    ACCSL-Cys529 and ACCSL-Arg529, quantify bound PLP stoichiometry, and test
    activity across cysteine S-conjugate sulfoxides and amino-acid libraries.
  experiment_type: Comparative recombinant enzymology
