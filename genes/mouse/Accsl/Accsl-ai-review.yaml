id: Q3UX83
gene_symbol: Accsl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Probable inactive 1-aminocyclopropane-1-carboxylate synthase-like protein 2
  (Accsl) is a 580-residue murine fold-type I pyridoxal 5'-phosphate-dependent
  aminotransferase-like protein encoded on mouse chromosome 2 adjacent to its
  ancestral paralog Accs. Assigned to the mammalian-specific clade
  PTHR43795:SF1, mouse Accsl retains the putative Schiff-base Lys417,
  pyridinium-stabilizing Asp380, pocket Trp229, and—unlike reference human
  ACCSL (Cys529)—preserves the canonical substrate alpha-carboxylate-anchoring
  Arg551, while sharing the clade-wide SF1 substitution Tyr445 in place of the
  cationic inter-subunit pocket arginine (Arg351 in human ACCS, where R351Y
  reduces beta-lyase activity ~40-fold). Whether murine Accsl binds PLP,
  retains low-level or altered enzymatic activity enabled by Arg551, or acts as
  a non-catalytic pseudoenzyme in early embryos and reproductive tissues
  remains experimentally uncharacterized.
alternative_products:
- name: '1'
  id: Q3UX83-1
  description: >-
    Canonical full-length 580-residue polypeptide containing an N-terminal
    disordered extension (residues 1-43) and the fold-type I
    aminotransferase-like domain carrying Trp229, Asp380, Lys417, Tyr445, and
    Arg551.
- name: '2'
  id: Q3UX83-2
  sequence_note: VSP_033860
  description: >-
    528-residue splice variant missing N-terminal residues 1-52 while retaining
    the complete fold-type I domain.
