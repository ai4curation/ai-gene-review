knowledge_gaps:
- gap_statement: >-
    Whether mouse Accsl—which retains the substrate alpha-carboxylate-binding
    Arg551 lost in reference human ACCSL (Cys529) while carrying Tyr445 at the
    inter-subunit pocket—binds PLP, catalyzes an enzymatic reaction on distinct
    substrates, or functions as a non-catalytic pseudoenzyme, as well as its
    subcellular localization and role in mouse zygotes and gonads, is
    completely unknown.
  boundary: >-
    Mammalian tandem duplication from Accs and retention of Lys417/Asp380/Arg551
    alongside Tyr445 are established by sequence analysis (PMID:39876065),
    whereas direct biochemical, localization, and genetic data are absent.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    Comparing purified mouse Accsl (Arg551/Tyr445) directly with human
    ACCSL-Cys529 and human ACCSL-Arg529 provides a natural evolutionary test of
    whether non-human mammalian ACCSL proteins are active enzymes or
    clade-wide pseudoenzymes.
  resolution: >-
    Purify recombinant mouse Accsl and K417A mutant to measure bound PLP and
    test beta-lyase/aminotransferase turnover, and determine localization and
    fertility/metabolic phenotypes in Accsl-knockout mice.
  provenance:
  - reference_id: PMID:39876065
    supporting_text: >-
      Nevertheless, our bioinformatics analysis clearly indicates that animal
      ACCS homologues are more prevalent and complex than previously
      anticipated. Biochemical characterization of these animal homologues is
      therefore warranted to help us understand their functions.
  - reference_id: file:mouse/Accsl/Accsl-notes.md
    supporting_text: >-
      Zero experimental publications assay purified mouse `Accsl` cofactor
      binding, enzymatic activity, subcellular localization, or
      loss-of-function phenotypes (`GO:0005575` `ND` is verified as
      `TRUE_GAP`).
