  title: Cysteine S-conjugate sulfoxide β-lyase activity for human ACCS.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analyzes synteny and active-site evolution of mammalian ACCSL orthologs
      relative to ACCS, noting conservation of the substrate-anchoring arginine
      in non-human mammalian ACCSL orthologs alongside the ~40-fold catalytic
      penalty of the R351Y substitution.
  findings:
  - statement: >-
      Non-human mammalian ACCSL orthologs conserve the substrate
      alpha-carboxylate-binding arginine that is replaced by cysteine in
      reference human ACCSL, while mammalian ACCSL evolved by tandem
      duplication of ACCS.
    supporting_text: >-
      Interestingly, this arginine-to-cysteine substitution is unique to
      hACCSL, as the arginine residue is conserved in other non-human ACCSL
      orthologues (Figure 2).
