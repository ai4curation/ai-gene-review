    label: negative regulation of autophagy
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q92622
  - ensembl:ENSP00000296343
  review:
    summary: Rubicon is a negative regulator of autophagy; this is directly supported in mouse
      cells and mouse genetics.
    action: ACCEPT
    reason: Mouse Rubicon reduces Vps34 activity and downregulates autophagy (PMID:19270693);
      hepatocyte-, adipocyte-specific and whole-body Rubcn knockout mice show increased autophagic
      activity and amelioration of age-related or diet-induced pathology (PMID:27637015, PMID:35282767,
      PMID:30783089). The more specific core process is negative regulation of autophagosome
      maturation.
