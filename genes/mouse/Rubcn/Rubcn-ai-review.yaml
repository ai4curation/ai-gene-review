suggested_questions:
- question: Is phosphatidylinositol phosphate binding (GO:1901981) at the Eukaryota root node
    PTN002915557 an ancestral property of the family, or a Pacer/RUBCNL-specific gain? Rubicon
    was negative in a PtdIns(3)P bead pull-down and its FYVE-like zinc cluster lacks the canonical
    basic residues.
  experts:
  - PAINT curators
  - GO phylogenetic annotation editors
- question: Should Rubicon be annotated as part_of PI3KC3-C2 (GO:0034272) given that it binds
    the complex through the Beclin 1 BARA domain, or does it remain an inhibitory binding
    partner outside the core complex?
  experts:
  - ComplexPortal curators
  - GO autophagy editors
suggested_experiments:
- description: Quantitative liposome flotation or SPR with purified mouse Rubicon RH domain
    versus Pacer RH domain on PI3P/PI4P/PI5P-containing membranes, with and without Rab7-GTP.
  experiment_type: in vitro lipid-binding assay
  hypothesis: The RH domain of Pacer, but not of Rubicon, binds phosphoinositides directly;
    Rubicon membrane recruitment depends on Rab7-GTP.
- description: Knock-in mice carrying PIKBD (PI3KC3-C2-binding) or RH (Rab7-binding) point
    mutations in Rubcn, analysed for liver autophagy flux, steatosis on high-fat diet and
    age-related kidney fibrosis.
  experiment_type: separation-of-function knock-in mice
  hypothesis: PI3KC3-C2 inhibition targeted by Rab7 accounts for the in vivo autophagy-suppressive
    phenotypes of Rubicon.
