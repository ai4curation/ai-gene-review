  supporting_entities:
  - UniProtKB:P00533
  review:
    summary: Mouse Rubcn co-immunoprecipitates with (human) EGFR in the EGFR-LAPTM4B-Sec5
      study; the interaction is plausible but the generic protein binding term conveys no
      function.
    action: REMOVE
    reason: Protein binding is uninformative. In the cited study EGFR sequesters Rubicon away
      from Beclin 1 to release the Beclin 1 complex; Rubicon is the regulated party, so there
      is no informative molecular function of Rubcn to substitute (EGFR binding would only
      restate the interaction). Removal does not imply the interaction is false.
    additional_reference_ids:
