id: Q80U62
gene_symbol: Rubcn
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: Rubcn encodes Rubicon (RUN domain Beclin-1-interacting and cysteine-rich domain-containing
  protein), a negative regulator of late-stage autophagy and endolysosomal maturation. Its
  middle PI3K-binding region associates with the UVRAG-containing class III phosphatidylinositol
  3-kinase complex II (Beclin 1-VPS34-VPS15-UVRAG) and inhibits VPS34 lipid kinase activity,
  while its C-terminal zinc-cluster Rubicon homology (RH) domain binds GTP-bound Rab7 to target
  it to late endosomes and lysosomes. By restraining PI3KC3-C2 and sequestering UVRAG from
  the HOPS tethering complex, Rubicon slows autophagosome maturation, autophagosome-lysosome
  fusion and degradative endocytic trafficking. Rubicon levels rise with age and under lipid
  overload in mouse tissues; tissue-specific or whole-body Rubcn knockout mice show increased
  autophagy with reduced hepatic steatosis on a high-fat diet, reduced kidney fibrosis and
  alpha-synuclein accumulation in aging, and altered adipose responses to fasting. Rubicon
  is also implicated in phagocyte innate immunity, including NADPH oxidase-associated phagosome
  functions and feedback inhibition of CARD9 signalling.
