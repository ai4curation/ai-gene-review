  title: Embryonic lethality caused by apoptosis during gastrulation in mice lacking the gene of the ADP-ribosylation factor-related protein 1.
  findings:
  - statement: >-
      Generated germline Arfrp1-/- mice and showed epiblast apoptosis and embryonic lethality
      between E6.0 and E7.0 during gastrulation, as well as membrane-pellet association of
      mouse Arfrp1 in liver, kidney, and testis.
    supporting_text: >-
      Our results demonstrate that ARFRP1 is necessary for early embryonic development during
      gastrulation.
- id: PMID:16129887
  title: Roles of ARFRP1 (ADP-ribosylation factor-related protein 1) in post-Golgi membrane trafficking.
  findings: []
- id: PMID:17127620
  title: Knockout of Arfrp1 leads to disruption of ARF-like1 (ARL1) targeting to the trans-Golgi in mouse embryos and HeLa cells.
  findings:
  - statement: >-
      Demonstrated that ARL1 dissociates from Golgi membranes into the cytosol in Arfrp1-/-
      mouse embryos without disrupting cis-Golgi GM130.
    supporting_text: >-
      Furthermore, in Arfrp1-/ - embryos ARL1 dislocated from Golgi membranes whereas it was
      associated with intracellular membranes in wild-type embryos.
- id: PMID:18662990
  title: ADP-ribosylation factor-like GTPase ARFRP1 is required for trans-Golgi to plasma membrane trafficking of E-cadherin.
  findings:
  - statement: >-
      Demonstrated intracellular retention of E-cadherin in Arfrp1-null mouse epiblast and
      enterocytes, linking TGN sorting defects to gastrulation failure.
    supporting_text: >-
      Here we show that in Arfrp1(-/-) embryos E-cadherin is mistargeted to intracellular
      compartments, whereas in control embryos it is present at the cell surface of
      trophectodermal and ectodermal cells.
- id: PMID:20038528
  title: The ARF-like GTPase ARFRP1 is essential for lipid droplet growth and is involved in the regulation of lipolysis.
  findings: []
- id: PMID:20230794
  title: Altered GLUT4 trafficking in adipocytes in the absence of the GTPase Arfrp1.
  findings:
  - statement: >-
      Showed abnormal trans-Golgi ultrastructure and cell-surface misaccumulation of GLUT4 in
      adipocyte-specific Arfrp1(ad-/-) mice and Arfrp1-depleted 3T3-L1 adipocytes.
    supporting_text: >-
      Immunohistochemical and ultrastructural studies of brown adipocytes demonstrated an
      abnormal trans-Golgi in Arfrp1(ad)(-/-) adipocytes.
- id: PMID:22505585
  title: The GTPase ARFRP1 controls the lipidation of chylomicrons in the Golgi of the intestinal epithelium.
  findings:
  - statement: >-
      Demonstrated that intestine-specific Arfrp1(vil-/-) mice fail to lipidate nascent
      chylomicrons or secrete ApoA-I via the ARFRP1-ARL1-Golgin-245-Rab2 Golgi cascade.
    supporting_text: >-
      Thus, the GTPase ARFRP1 and its downstream proteins are required for the lipidation of
      chylo-microns and the assembly of ApoA-I to these particles in the Golgi of intestinal
      epithelial cells.
- id: PMID:22927645
  title: GTPase ARFRP1 is essential for normal hepatic glycogen storage and insulin-like growth factor 1 secretion.
  findings:
  - statement: >-
      Demonstrated intracellular retention of GLUT2 and reduced plasma IGF1 and hepatic
      glycogen in liver-specific Arfrp1(liv-/-) mice.
    supporting_text: >-
      These abnormalities in glucose metabolism were attributable to reduced protein levels
      and intracellular retention of the glucose transporter GLUT2 in Arfrp1(liv-/-) livers.
