id: Q8BXL7
gene_symbol: Arfrp1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  ADP-ribosylation factor-related protein 1 (Arfrp1) is a 201-residue monomeric Arf-family
  small GTPase localized to the cytoplasmic face of the trans-Golgi network (TGN) in mouse
  cells. Lacking a Gly2 myristoylation site, Arfrp1 anchors to the TGN via an N-terminal
  amphipathic helix starting with Met1-Tyr2 that is N-terminally acetylated by NatC and binds
  directly to the multipass Golgi membrane receptor Sys1. In its active GTP-bound state,
  Arfrp1 recruits Arl1, GRIP-domain golgins (including Golgin-245), Arl5/GARP, Rab2, and
  scaffolding/coat complexes (AP-1 and Gopc) to coordinate endosome-to-TGN retrograde transport
  and selective TGN-to-plasma-membrane export of cargoes including E-cadherin, planar-cell-polarity
  protein Vangl2, glucose transporters Glut2 and Glut4, SNARE protein Snap25, and nascent
  intestinal chylomicrons and hepatic VLDL particles. Germline loss of Arfrp1 in mice causes
  epiblast E-cadherin mistrafficking, apoptosis, and embryonic lethality during gastrulation.
