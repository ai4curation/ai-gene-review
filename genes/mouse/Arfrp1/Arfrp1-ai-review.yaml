- term:
    id: GO:0007369
    label: gastrulation
  evidence_type: IMP
  original_reference_id: PMID:11839814
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:2159671
  review:
    summary: >-
      Germline Arfrp1-/- mouse embryos undergo epiblast apoptosis and arrest during
      gastrulation between E6.0 and E7.0 (PMID:11839814); retain with acts_upstream_of_or_within
      as a non-core developmental phenotype downstream of TGN E-cadherin sorting.
    action: KEEP_AS_NON_CORE
    reason: >-
      PMID:11839814 demonstrated that homozygous Arfrp1-null mouse embryos implant normally
      until E5.0 but exhibit epiblast apoptosis and detachment during gastrulation at E6.0-E7.0,
      and PMID:18662990 subsequently showed that this gastrulation failure results from
      defective TGN-to-plasma-membrane trafficking of E-cadherin in epiblast cells. Because
      the qualifier is acts_upstream_of_or_within and gastrulation is a downstream organismal
      consequence of core TGN vesicle sorting, KEEP_AS_NON_CORE is warranted.
    supported_by:
    - reference_id: PMID:11839814
      supporting_text: >-
        Between embryonic days 6 and 7, however, apoptotic cell death of epiblast cells
        occurred in the embryonic ectoderm during gastrulation, as was shown by histological
        analysis combined with terminal deoxynucleotidyltransferase-mediated dUTP-biotin nick
        end labeling.
    - reference_id: PMID:18662990
      supporting_text: >-
        Here we show that in Arfrp1(-/-) embryos E-cadherin is mistargeted to intracellular
        compartments, whereas in control embryos it is present at the cell surface of
        trophectodermal and ectodermal cells.
