core_functions:
- description: >-
    Trans-Golgi network small GTPase switch anchored on the cytoplasmic face of the TGN
    membrane via its NatC-acetylated Met1-Tyr2 amphipathic helix bound to Sys1, where it binds
    and hydrolyzes GTP to recruit ARL1/Golgin-245, AP-1, and GOPC for endosome-to-TGN
    retrograde sorting and selective TGN-to-plasma-membrane cargo export (E-cadherin, Vangl2,
    Glut2, Glut4, Snap25, and nascent lipoproteins).
