suggested_questions:
- question: >-
    How does GTP-bound Arfrp1 coordinate recruitment of ARL1/Golgin-245/Rab2 versus AP-1 and
    GOPC onto distinct subdomains of the trans-Golgi network in polarized mouse enterocytes
    and hepatocytes?
suggested_experiments:
- description: >-
    Perform endogenous HaloTag knock-in super-resolution live imaging and proximity proteomics
    of Arfrp1 in primary mouse enterocytes and hepatocytes to resolve whether ARL1/Golgin-245
    lipoprotein-maturation zones and AP-1/GOPC cargo-budding zones segregate at the TGN.
