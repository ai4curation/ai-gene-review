  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 15.67) and absent from GOA; the one call that differs from Fyn's list. SRC and
      AKT do interact functionally in growth-factor signalling and SRC can phosphorylate AKT, but
      a direct binding annotation is not on the record for mouse Src. A plausible, checkable and unsupported
      interaction claim; left uncertain, and reviewed here in place of rank 2 (ROR binding) which
      duplicates Fyn's list.
    supported_by:
