id: P05480
gene_symbol: Src
taxon:
  id: NCBITaxon:10090
  label: Mus musculus (Mouse)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for mouse Src, the companion to Fyn in this cohort's paralog
  test. Four of Src's five calls also appear in Fyn's top five, in nearly the same order and at nearly
  the same scores. The only distinguishing call is protein kinase B binding at rank 3, and it is not
  annotated for Src. As with Fyn, the shared core molecular function - non-membrane spanning protein
  tyrosine kinase activity - is absent, so the model returns Src-family binding partners without ever
  naming Src-family catalysis. Assessment: 1 correct novel (COR), 1 correct not novel (CNN), 1 uncertain
  (UNC).
