    label: methylglyoxal catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR017782
  review:
    summary: InterPro2GO mapping from the hydroxyacylglutathione hydrolase signature.
    action: REMOVE
    reason: Methylglyoxal catabolism via the glyoxalase pathway requires efficient S-D-lactoylglutathione
      hydrolysis. The human ortholog has only trace in vitro SLG hydrolase activity and does not restore
      SLG metabolism in hagh-null Drosophila, so PNKD is not a glyoxalase II in vivo. This electronic
      mapping of a HAGH signature to the divergent PNKD subfamily is not supported; PAINT did not propagate
      it.
