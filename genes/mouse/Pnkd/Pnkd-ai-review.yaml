suggested_questions:
- question: What is the physiological alpha-hydroxythioester substrate of the PNKD long isoform, and does
    the decrease in cortical glutathione in Pnkd-null mice reflect loss of a glutathione thioester hydrolase
    activity?
- question: Does the suppression of synaptic vesicle exocytosis by PNKD and its stabilisation of RIM1/RIM2
    require the metallo-beta-lactamase active site, or is it a non-enzymatic scaffolding role?
- question: Which mouse isoforms are mitochondrial versus plasma membrane-associated, and is the mitochondrial
    complex IV assembly annotation transferred from human still supported?
suggested_experiments:
- description: Activity-based or untargeted metabolomic substrate screen of recombinant mouse Pnkd long
    isoform (wild type vs H172A/H174A zinc-site mutant) against glutathione and CoA thioesters of alpha-hydroxy
    acids, with kinetic characterisation of hits.
- description: Rescue of Pnkd-/- synaptic transmission and RIM1/2 levels with wild-type versus catalytically
    dead Pnkd-L in cultured hippocampal neurons.
