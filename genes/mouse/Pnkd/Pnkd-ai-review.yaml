- term:
    id: GO:0046929
    label: negative regulation of neurotransmitter secretion
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00084480
  - UniProtKB:Q8N490
  - ensembl:ENSP00000273077
  review:
    summary: ARBA/Ensembl transfer from human.
    action: KEEP_AS_NON_CORE
    reason: Overexpressed wild-type PNKD suppresses synaptic vesicle exocytosis in cultured hippocampal
      neurons and inhibits the RIM-dependent enhancement of release, while disease-mutant PNKD is less
      effective. This is the best-supported process role for Pnkd, but it rests largely on overexpression,
      the knockout instead shows impaired synaptic strength attributed to RIM destabilisation, and the
      mechanism (and whether it depends on the hydrolase activity) is unknown. Kept as a genuine but not
      yet mechanistically defined role; not elevated to core.
    supported_by:
    - &id011
      reference_id: PMID:25730884
      supporting_text: Overexpressed PNKD protein suppresses release, and mutant PNKD protein is less
        effective than wild-type at inhibiting exocytosis.
    - &id012
      reference_id: PMID:25730884
      supporting_text: wild-type PNKD protein inhibits the RIM-dependent increase of neurotransmitter
        release
    - &id013
      reference_id: PMID:25730884
      supporting_text: In PNKD KO mice, RIM1/2 protein levels are reduced and synaptic strength is impaired.
