- term:
    id: GO:0016790
    label: thiolester hydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT2G31350
  - AGI_LocusCode:AT2G43430
  - AGI_LocusCode:AT3G10850
  - MGI:MGI:95745
  - PANTHER:PTN004322580
  - RGD:2779
  - SGD:S000002680
  - SGD:S000005566
  - UniProtKB:C0H490
  - UniProtKB:Q16775
  - UniProtKB:Q8I5Y8
  review:
    summary: PAINT IBA from node PTN004322580 (thiolester hydrolase activity) in the metallo-beta-lactamase/glyoxalase
      II family.
    action: ACCEPT
    reason: Pnkd is in PTHR11935:SF116 within the PTN004322580 clade. Its metallo-beta-lactamase domain
      retains the full zinc-binding THxHxDH motif (H172, H174, D176, H177) and the other zinc ligands
      (H229, D253, H291), so the catalytic machinery appears intact. The human ortholog shows measurable
      (though very weak) thioester hydrolysis of S-D-lactoylglutathione, and the physiological substrate
      is proposed to be an unknown alpha-hydroxythioester. Thiolester hydrolase activity is the appropriate
      general level; this is the core molecular function, but it is inferred phylogenetically and from
      the human enzyme assay, not measured on the mouse protein.
    supported_by:
    - *id008
    - reference_id: file:mouse/Pnkd/Pnkd-uniprot.txt
      supporting_text: Belongs to the metallo-beta-lactamase superfamily.
    - &id015
      reference_id: PMID:21487022
      supporting_text: Sequence alignment and enzyme kinetics suggest that PNKD-L substrate may be an
        (as yet, unknown) α-hydroxythioester
    - *id009
- term:
    id: GO:0032225
    label: regulation of synaptic transmission, dopaminergic
  evidence_type: IMP
  original_reference_id: PMID:22214848
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:5006973
  review:
    summary: 'IMP: Pnkd mutant (knock-in of patient-equivalent mutations) mice show nigrostriatal dopaminergic
      transmission deficits.'
    action: KEEP_AS_NON_CORE
    reason: Mouse experimental; qualifier acts_upstream_of_or_within. The knock-in mice have reduced striatal
      extracellular dopamine and exaggerated release to caffeine/ethanol. This is consistent with the
      later demonstration that Pnkd is a presynaptic RIM-binding regulator of release, but the dopaminergic
      phenotype itself is a circuit-level read-out of a mutant allele rather than evidence for a direct
      molecular role. Kept, as non-core.
    supported_by:
    - &id010
      reference_id: PMID:22214848
      supporting_text: They also showed nigrostriatal neurotransmission deficits that were manifested
        by reduced extracellular dopamine levels in the striatum
