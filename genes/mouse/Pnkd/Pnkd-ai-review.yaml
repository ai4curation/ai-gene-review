core_functions:
- description: Probable zinc-dependent thioester hydrolase (long isoform) acting on an as-yet unidentified
    alpha-hydroxythioester substrate, inferred from conserved glyoxalase II-family active site, PAINT
    placement, and weak thioesterase activity of the human ortholog; not directly assayed in mouse.
