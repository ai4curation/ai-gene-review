- term:
    id: GO:0004416
    label: hydroxyacylglutathione hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017782
  review:
    summary: InterPro2GO mapping of the hydroxyacylglutathione hydrolase signature (IPR017782) to the
      PNKD subfamily.
    action: MARK_AS_OVER_ANNOTATED
    reason: Pnkd sits in PANTHER subfamily PTHR11935:SF116 (PNKD-related), not in the HAGH/glyoxalase
      II subfamily. The ortholog human PNKD-L hydrolyses S-D-lactoylglutathione only at an extremely low
      rate that the authors judge not physiologically relevant, and it fails to rescue SLG hydrolysis
      in hagh-null Drosophila. PAINT propagated only the parent thiolester hydrolase activity to this
      clade and not hydroxyacylglutathione hydrolase activity, which I treat as a deliberate decision.
      The general thiolester hydrolase activity (GO:0016790) is the appropriate claim; glyoxalase II activity
      overstates the evidence. Not assayed on the mouse protein.
    supported_by:
    - &id009
      reference_id: PMID:21487022
      supporting_text: This indicates that hydrolysis of SLG in vivo by PNKD-L is unlikely to be physiologically
        relevant.
    - &id014
      reference_id: PMID:21487022
      supporting_text: further supporting the idea that PNKD-L does not use SLG as an in vivo substrate
    - &id008
      reference_id: file:mouse/Pnkd/Pnkd-uniprot.txt
      supporting_text: PTHR11935:SF116; HYDROLASE PNKD-RELATED
