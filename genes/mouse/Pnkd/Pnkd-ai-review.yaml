id: Q69ZP3
gene_symbol: Pnkd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Pnkd encodes a metallo-beta-lactamase-fold protein of the glyoxalase II (hydroxyacylglutathione
  hydrolase) family, the PNKD subfamily, expressed in neurons throughout the brain. Alternative splicing
  produces a long membrane-associated isoform carrying the full zinc-binding hydrolase domain, a medium
  isoform, and a short isoform that lacks the catalytic domain and is found in cytoplasm and mitochondria.
  The long isoform is a probable zinc-dependent thioesterase: the human ortholog hydrolyses S-D-lactoylglutathione
  only at a trace rate and is not a functional glyoxalase II in vivo, so its physiological substrate is
  thought to be an unidentified alpha-hydroxythioester, possibly in a glutathione-linked detoxification
  reaction; Pnkd-null mouse cortex has lower glutathione. The long isoform undergoes N-terminal cleavage
  that is blocked by dominant dyskinesia-causing mutations. In mouse brain Pnkd binds the active-zone
  scaffolds RIM1 and RIM2, localises to presynaptic terminals, stabilises RIM proteins, and modulates
  synaptic vesicle exocytosis; mutations equivalent to human paroxysmal nonkinesigenic dyskinesia (DYT8)
  alleles cause stress-, caffeine- and ethanol-precipitated dyskinesia and nigrostriatal dopamine release
  defects in mice.'
