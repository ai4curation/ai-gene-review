  review:
    summary: >-
      Reviewed computational analysis from a genome-wide catalogue of mouse and human
      apoptosis-related domain families (DED-containing proteins).
    action: MODIFY
    reason: >-
      PEA-15 is not an apoptotic executioner; it modulates death-receptor signalling through its
      DED (binding FADD/caspase-8 and limiting caspase-8 activation). In mouse, Pea15-null astrocytes
      are sensitised to TNF-induced apoptosis and re-expression of PEA-15 protects them, and
      overexpressed mouse PEA-15 inhibits Fas-induced caspase-8 activity. The specific regulatory
      term already carried by the gene (IBA/IDA) is the better replacement.
