  review:
    summary: Ensembl Compara transfer of the human PEA15 glucose-import annotation.
    action: KEEP_AS_NON_CORE
    reason: >-
      The human source annotation rests on overexpression of PED/PEA-15 in muscle and adipose cells,
      which impaired insulin-stimulated glucose transport (PMID:9670003). The orthology (same
      PANTHER subfamily, 96% identity) makes transfer reasonable, and the mouse knockout is
      directionally consistent: Pea15-null mice on a high-fat diet show improved whole-body insulin
      sensitivity (PMID:33772049). However, no mouse study has measured glucose import directly in
      Pea15-deficient cells, the effect is indirect (PEA-15 has no transporter activity and acts
      through signalling partners such as PLD1), and it is peripheral to the ERK-anchoring and DED
      functions. Kept as non-core.
