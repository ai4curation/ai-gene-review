  review:
    summary: >-
      Traceable author statement from the mouse cloning paper, which describes PEA-15 as a protein
      kinase C substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited paper (abstract) only states that PEA-15 is a PKC substrate; it reports no binding
