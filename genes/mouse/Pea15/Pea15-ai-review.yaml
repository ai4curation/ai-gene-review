  - InterPro:IPR029546
  review:
    summary: InterPro2GO mapping from the PEA15-specific DED signature (IPR029546) to MAPK cascade.
    action: MODIFY
    reason: >-
      PEA-15 is not a kinase or a cascade component that relays the phosphorylation signal; it
      binds ERK1/2 and controls where ERK acts (cytoplasmic anchoring, release on PEA-15
      phosphorylation) and which substrates it reaches (RSK2). In mouse, loss of Pea15 changes ERK
      localization and ERK-dependent outputs rather than abolishing the cascade. The process role
      is better captured as regulation of the ERK1/2 cascade. The direction is context dependent
      (cytoplasmic restraint of ERK nuclear signalling, but potentiation of ERK-to-RSK2 signalling),
      so the unsigned regulation term is the appropriate replacement.
    proposed_replacement_terms:
    - id: GO:0070372
      label: regulation of ERK1 and ERK2 cascade
    supported_by:
