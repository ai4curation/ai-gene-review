- id: file:mouse/Pea15/Pea15-uniprot.txt
  title: UniProtKB Q62048 (PEA15_MOUSE) flat file
  findings: []
core_functions:
- description: >-
    Cytoplasmic anchoring of ERK1/2: PEA-15 binds ERK1/2 and holds it in the cytosol, limiting ERK
    nuclear entry and ERK-dependent transcription; phosphorylation of PEA-15 (Ser104 by PKC, Ser116
    by CaMKII) releases ERK. Experimentally established in mouse by loss of function in T cells,
    astrocytes and germ cells, and by endogenous co-immunoprecipitation in the SCN.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  directly_involved_in:
  - id: GO:0042308
    label: negative regulation of protein import into nucleus
  - id: GO:0070372
    label: regulation of ERK1 and ERK2 cascade
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11702783
    supporting_text: blocks ERK-dependent transcription and proliferation by binding ERKs and preventing their localization in the nucleus
  - reference_id: PMID:20354143
    supporting_text: Consistent with our previous results, here we show that ablation of PEA-15 led to accumulation of ERK in the nucleus in PEA-15 −/− T cells.
  - reference_id: PMID:29383758
    supporting_text: co-immunoprecipitation assays revealed that PEA-15 is directly bound to ERK in the SCN and that photic stimulation leads to their dissociation
- description: >-
    DED-mediated protection against death-receptor apoptosis: PEA-15 interacts with FADD and
    caspase-8 through its death effector domain and limits caspase-8 activation after Fas or TNF
    receptor stimulation. Established in mouse by overexpression with phosphosite mutants (Fas) and
    by Pea15-null astrocytes sensitised to TNF.
  directly_involved_in:
  - id: GO:1902042
    label: negative regulation of extrinsic apoptotic signaling pathway via death domain receptors
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:10493725
    supporting_text: our results demonstrate that PEA-15 expression increases astrocyte survival after exposure to TNF
  - reference_id: PMID:10588860
    supporting_text: the differential effect is evident at the level of caspase-8 activity which is inhibited via Fas activation
suggested_questions:
- question: >-
    Mouse loss-of-function studies disagree on the direction of the T-cell proliferation phenotype
    (increased in PMID:20354143, decreased in PMID:26317969) while agreeing that ERK
    compartmentalization is altered. Is the difference due to genetic background, the deletion
    allele, or culture conditions?
- question: >-
    Should the PEA-15 scaffolding of ERK onto RSK2 (PMID:18077417) be expressed as a molecular
    function (e.g. a signaling adaptor or scaffold activity), given that GO's MAP-kinase scaffold
    activity is defined for cascade-component scaffolds rather than kinase-to-substrate bridging?
- question: >-
    Does the TNFR1-potentiating effect of overexpressed PEA-15 (PMID:10588860) reflect a genuine
    cell-type-specific function or an overexpression artefact, given that Pea15-null astrocytes are
    sensitised to TNF?
suggested_experiments:
- description: >-
    Knock in phospho-dead (S104A/S116A) and phosphomimetic alleles at the endogenous Pea15 locus and
    measure ERK nuclear residency, Period1/c-Fos induction, and Fas/TNF-induced caspase-8 activity in
    primary astrocytes and T cells, to separate the ERK-anchoring and DED anti-apoptotic functions.
- description: >-
    Compare Pea15-null and wild-type CD4+ T cells from the two published knockout lines side by side
    under identical stimulation to resolve the conflicting proliferation phenotypes.
