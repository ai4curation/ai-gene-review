id: Q62048
gene_symbol: Pea15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: >-
  Pea15 (PEA-15, phosphoprotein enriched in astrocytes 15 kDa; MGI symbol Pea15a) encodes a
  130-residue cytosolic phosphoprotein made of an N-terminal death effector domain (DED) and a
  flexible C-terminal tail. It is abundant in astrocytes and in subpopulations of neurons, but is
  also found in peripheral tissues such as testis, lung and lymphocytes. Mouse PEA-15 is
  phosphorylated on Ser104 by protein kinase C and on Ser116 by CaMKII in astrocytes. In mouse
  tissues it forms a complex with ERK1/2 and holds the kinase in the cytoplasm: loss of Pea15 in
  astrocytes, T cells and testicular germ cells shifts ERK into the nucleus and raises
  ERK-dependent transcription (c-Fos, IL-2, Period1). Phosphorylation of PEA-15 releases ERK. PEA-15
  also binds RSK2 through its C-terminal tail and enhances ERK-to-RSK2 signalling in lymphocytes.
  Through its DED it interacts with FADD and caspase-8 in vitro, and Pea15-null astrocytes are
  sensitised to TNF-induced apoptosis, so PEA-15 protects cells against death-receptor-triggered
  apoptosis (with one overexpression study reporting the opposite effect for TNFR1 in another cell
  type). It interacts with phospholipase D1/D2 and increases their protein levels. Pea15-null mice
  are viable, with spatial learning deficits, altered T-cell responses, increased spermatocyte
  apoptosis and greater adipose expansion with improved insulin sensitivity on a high-fat diet.
