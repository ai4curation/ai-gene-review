  review:
    summary: >-
      Pea15-null mouse T cells, astrocytes and testicular germ cells accumulate ERK1/2 in the
      nucleus, whereas PEA-15 overexpression blocks ERK nuclear translocation.
    action: NEW
    reason: >-
      PEA-15 itself performs this regulation: it binds ERK1/2 and anchors it in the cytoplasm,
      requiring its own nuclear export sequence, so this is participation rather than mere
      necessity. Loss-of-function evidence in three independent mouse cell types (T cells,
      PMID:20354143; astrocytes, PMID:11702783; Sertoli cells and spermatocytes, PMID:17504918)
      shows increased nuclear ERK. No such term is in the mouse GOA set. The process concerns ERK1/2 specifically; GO has no ERK-specific nuclear-import
      term.
    supported_by:
    - reference_id: PMID:20354143
      supporting_text: Consistent with our previous results, here we show that ablation of PEA-15 led to accumulation of ERK in the nucleus in PEA-15 −/− T cells.
