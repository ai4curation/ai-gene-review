id: Q8C456
gene_symbol: Wdpcp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Wdpcp (fritz homolog) is a non-enzymatic scaffold protein of 722 residues, built from an
  N-terminal WD40 beta-propeller, a helical alpha-solenoid and a disordered C-terminal tail. With Inturned
  (Intu) and Fuzzy (Fuz) it forms the CPLANE (ciliogenesis and planar polarity effector) complex, whose
  cryo-EM structure has been solved for the mouse proteins. In ciliated cells Wdpcp sits in a ring at
  the ciliary transition zone and along the axoneme. There it is required for transition-zone localization
  of Sept2, Nphp1 and Mks1, and as part of CPLANE for recruitment of peripheral IFT-A subunits to the
  basal body, so its loss severely reduces primary cilium formation and abolishes cilium-dependent Hedgehog
  responses. A second pool at the cell cortex, on actin stress fibres and at focal adhesions, binds Sept2
  and is needed for Sept2 association with actin, normal focal adhesions, membrane ruffling, Golgi orientation
  and directional cell migration. The C-terminal tail binds monophosphorylated phosphoinositides, preferring
  PI(3)P. Wdpcp-null and Cys40 mutant mice die at birth with ciliopathy malformations: polydactyly, cleft
  palate, outflow tract defects, duplex and cystic kidneys and anophthalmia.'
