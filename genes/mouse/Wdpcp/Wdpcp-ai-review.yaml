- term:
    id: GO:0001736
    label: establishment of planar polarity
  evidence_type: NAS
  original_reference_id: PMID:27158779
  qualifier: involved_in
  review:
    summary: Wdpcp is a planar-polarity effector; mouse data show polarity-dependent cytoskeletal phenotypes
      but not a core PCP signalling role.
    action: KEEP_AS_NON_CORE
    reason: This ComplexPortal NAS states the CPLANE-level role. In mouse, Wdpcp mutant cochlear hair
      cells are disarrayed and mutant MEFs fail to polarize the Golgi or migrate directionally, through
      loss of SEPT2 from actin. The authors themselves saw no mislocalization of core PCP proteins. Wdpcp
      therefore does part of the work at the effector (cytoskeletal) level, so the claim stands, but the
      better-resolved mouse functions are septin-actin organization and ciliogenesis; kept as non-core.
    supported_by:
    - reference_id: PMID:24302887
      supporting_text: Examination of the cochlea of WdpcpCys40 mutants showed the hair cells were disarrayed,
        with some of the chevron misaligned
    - reference_id: PMID:24302887
      supporting_text: While cochlea expression of Vangl2 was reduced in WdpcpCys40 mutants, we did not
        observe mislocalization of PCP core components that would suggest a disruption in PCP signaling.
    - reference_id: PMID:24302887
      supporting_text: These observations show Wdpcp is required for establishing the planar cell polarity
        needed to engage in directional cell migration.
- term:
    id: GO:0001822
    label: kidney development
  evidence_type: IMP
  original_reference_id: PMID:24302887
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:5558098
  review:
    summary: Duplex and cystic kidney in Wdpcp mutant mice; a ciliopathy outcome.
    action: KEEP_AS_NON_CORE
    reason: This is an organismal developmental outcome of loss of Wdpcp from the Cys40 ENU allele or
      knockout mice. Most of the Wdpcp mutant malformations (polydactyly, cleft palate, tracheoesophageal
      fistula, duplex/cystic kidney, outflow tract defects, anophthalmia) are ciliopathy phenotypes that
      the authors attribute to loss of cilia and cilium-transduced Shh signaling, plus PCP-type cell-migration
      defects. The acts_upstream_of_or_within claim is true but describes a downstream consequence, not
      an activity Wdpcp performs in organ morphogenesis, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:24302887
      supporting_text: Necropsy showed WdpcpCys40 neonatal mutants have a wide spectrum of defects including
        facial cleft and anophthalmia (arrowhead in A), polydactyly (B, C), intestinal cysts (D), duplex
        kidney (black arrowheads in E) with glomerular cysts (white arrows in E), outflow tract defect
        consisting of a single common trunk (asterisk in G), and cloaca septation defect with abnormal
        connection between the intestine and bladder
    - reference_id: PMID:24302887
      supporting_text: Breeding of mice carrying the knockout allele showed homozygous Wdpcp knockout
        mice died at birth with the same spectrum of developmental anomalies seen in WdpcpCys40 mutants,
        including anopthalmia, cleft palate, heart outflow tract (OFT) septation defects, duplex kidney,
        limb polydactyly (Figure S5B–E), and multiple organ cysts.
