  review:
    summary: Polydactyly in Wdpcp mutant mice, transferred from the human ortholog.
    action: KEEP_AS_NON_CORE
    reason: Mouse has its own IMP evidence for this term. This is an organismal developmental outcome
      of loss of Wdpcp from the Cys40 ENU allele or knockout mice. Most of the Wdpcp mutant malformations
      (polydactyly, cleft palate, tracheoesophageal fistula, duplex/cystic kidney, outflow tract defects,
      anophthalmia) are ciliopathy phenotypes that the authors attribute to loss of cilia and cilium-transduced
      Shh signaling, plus PCP-type cell-migration defects. The acts_upstream_of_or_within claim is true
      but describes a downstream consequence, not an activity Wdpcp performs in organ morphogenesis, so
      it is kept as non-core.
    supported_by:
    - reference_id: PMID:24302887
      supporting_text: Necropsy showed WdpcpCys40 neonatal mutants have a wide spectrum of defects including
        facial cleft and anophthalmia (arrowhead in A), polydactyly (B, C), intestinal cysts (D), duplex
        kidney (black arrowheads in E) with glomerular cysts (white arrows in E), outflow tract defect
        consisting of a single common trunk (asterisk in G), and cloaca septation defect with abnormal
        connection between the intestine and bladder
    - reference_id: PMID:27158779
      supporting_text: We also observed Y-shaped metacarpals and defects in tongue and palate morphology
        in Wdpcp mutants
