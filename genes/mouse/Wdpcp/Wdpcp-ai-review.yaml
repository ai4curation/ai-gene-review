- term:
    id: GO:0042073
    label: intraciliary transport
  evidence_type: NAS
  original_reference_id: PMID:27158779
  qualifier: involved_in
  review:
    summary: CPLANE loads peripheral IFT-A at the basal body; Wdpcp is not part of the IFT machinery.
    action: MARK_AS_OVER_ANNOTATED
    reason: Toriyama et al. show that CPLANE, including Wdpcp, recruits peripheral IFT-A subunits to basal
      bodies before they join the IFT-A core. In mouse Wdpcp mutant MEFs, IFT88 distribution in the axoneme
      and basal body is unchanged, which the authors take to mean IFT itself is not disrupted. Wdpcp therefore
      acts upstream of IFT, assembling particles at the ciliary base, rather than performing intraciliary
      transport. The term overstates its role.
