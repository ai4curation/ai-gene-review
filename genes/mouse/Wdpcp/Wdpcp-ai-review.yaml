core_functions:
- description: Scaffold subunit of the CPLANE complex at the ciliary base. Wdpcp is required for transition-zone
    localization of Sept2, Nphp1 and Mks1 and, with Intu and Fuz, for recruitment of peripheral IFT-A
    subunits to the basal body, which together are needed for primary cilium assembly. Established experimentally
    in mouse cells (localization, recruitment, ciliogenesis); the IFT-A recruitment mechanism was shown
    mainly in Xenopus.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  - id: GO:0045184
    label: establishment of protein localization
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  - id: GO:0005930
    label: axoneme
  supported_by:
  - reference_id: PMID:24302887
    supporting_text: These results show Wdpcp is required for recruitment of Mks1 and Nphp1 to the ciliary
      transition zone.
  - reference_id: PMID:24302887
    supporting_text: Analysis of mouse embryonic fibroblasts (MEFs) derived from WdpcpCys40 mutant embryos,
      referred to as WdpcpCys40 mutant MEFs, confirmed a defect in ciliogenesis
  - reference_id: PMID:27158779
    supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to the
      basal body for assembly onto the IFT-A core.
- description: Cortical septin-actin organizer. Wdpcp binds Sept2 and is required for Sept2 association
    with actin stress fibres; its loss gives small focal adhesions, reduced ruffling, randomized Golgi
    orientation and loss of directional migration. Established experimentally in mouse embryonic fibroblasts.
  directly_involved_in:
  - id: GO:0032185
    label: septin cytoskeleton organization
  locations:
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:24302887
    supporting_text: in Wdpcp-deficient cells, Sept2 was lost from the actin cytoskeleton, suggesting
      Wdpcp is required for Sept2 recruitment to actin filaments.
  - reference_id: PMID:24302887
    supporting_text: These observations show Wdpcp is required for establishing the planar cell polarity
      needed to engage in directional cell migration.
- description: Phosphoinositide binding by the disordered C-terminal tail, with preference for PI(3)P,
    shown in vitro for recombinant mouse Wdpcp. Its physiological role (membrane targeting of CPLANE)
    is not yet established.
  molecular_function:
    id: GO:0035091
    label: phosphatidylinositol binding
  supported_by:
  - reference_id: PMID:35427153
    supporting_text: Wdpcp engages PIPs via the last 60 C-terminal residues.
  - reference_id: PMID:35427153
    supporting_text: MmWdpcp binding to PIP strip.
suggested_questions:
- question: Does PI(3)P binding by the Wdpcp C-terminal tail target CPLANE to the ciliary base, to the
    cortical/focal-adhesion pool, or both?
- question: Is the cortical Sept2-actin role of Wdpcp independent of CPLANE (Intu/Fuz), or does the whole
    complex act at the cortex?
- question: Should GO have a CPLANE complex term, given the mouse cryo-EM structure (PDB 7Q3E) and ComplexPortal
    CPX-5026?
suggested_experiments:
- description: Re-express Wdpcp lacking its last 60 residues in Wdpcp-null MEFs and score transition-zone
    Sept2/Mks1, basal-body IFT-A, cortical Sept2-actin association and ciliogenesis, to test whether phosphoinositide
    binding is needed for either pool.
- description: Use Intu- or Fuz-null MEFs to test whether Wdpcp still associates with actin stress fibres
    and recruits Sept2 there, separating the cortical role from CPLANE.
