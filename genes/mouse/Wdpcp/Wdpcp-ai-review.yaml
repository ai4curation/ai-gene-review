- id: PMID:24302887
  title: Wdpcp, a PCP protein required for ciliogenesis, regulates directional cell migration and cell
    polarity by direct modulation of the actin cytoskeleton.
  findings:
  - statement: Endogenous Wdpcp localizes to the transition zone and axoneme of primary cilia and is required
      for Sept2, Nphp1 and Mks1 recruitment there.
    supporting_text: These results show Wdpcp is required for recruitment of Mks1 and Nphp1 to the ciliary
      transition zone.
  - statement: Wdpcp binds Sept2 and is required for Sept2 association with actin stress fibres.
    supporting_text: in Wdpcp-deficient cells, Sept2 was lost from the actin cytoskeleton, suggesting
      Wdpcp is required for Sept2 recruitment to actin filaments.
  - statement: IFT88 distribution is normal in Wdpcp mutant cilia.
    supporting_text: Ift88 distribution in the ciliary axoneme and basal body was unchanged in WdpcpCys40
      mutant MEFs, indicating IFT transport is not disrupted by Wdpcp deficiency
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached (PLoS Biol). Primary mouse study: Cys40 ENU splice allele and a knockout
      allele, MEF cell biology, Smo/Ptch1 epistasis, plus zebrafish morphants. Source of nearly all mouse
      IMP/IDA/IPI rows.'
- id: PMID:27158779
  title: The ciliopathy-associated CPLANE proteins direct basal body recruitment of intraflagellar transport
    machinery.
  findings:
  - statement: Intu, Fuz and Wdpcp form CPLANE, which recruits peripheral IFT-A subunits to basal bodies;
      Wdpcp knockdown gives the same IFT defects.
    supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to the
      basal body for assembly onto the IFT-A core.
  - statement: Wdpcp mutant mice show oral-facial-digital-type defects.
    supporting_text: We also observed Y-shaped metacarpals and defects in tongue and palate morphology
      in Wdpcp mutants
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Proteomics in mouse IMCD3 cells, functional work largely in Xenopus
      multiciliated cells (morpholinos), mouse mutant craniofacial/limb phenotypes, human patient genetics.
      The IFT-A recruitment mechanism is shown mainly in Xenopus.
- id: PMID:35427153
  title: Structure of the ciliogenesis-associated CPLANE complex.
  findings:
  - statement: Recombinant mouse Wdpcp alone binds PIPs, via its last 60 residues, preferring PI(3)P.
    supporting_text: Wdpcp engages PIPs via the last 60 C-terminal residues.
  - statement: Wdpcp binds the Intu-Fuz heterodimer at one end of the crescent-shaped CPLANE complex.
    supporting_text: Wdpcp and Rsg1 are located on the ends of the crescent and bind the central Intu-Fuz
      heterodimer on opposite sides.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC9012472). Cryo-EM of mouse CPLANE-Rsg1 (PDB 7Q3E) and lipid-strip
      binding by individual mouse subunits.
- id: PMID:20671153
  title: Planar cell polarity acts through septins to control collective cell movement and ciliogenesis.
  findings:
  - statement: Xenopus Fritz controls cortical and ciliary septin localization and cell shape during convergent
      extension.
    supporting_text: Thus, Fritz controls cell shape but not polarization during CE
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Experimental source of the GO_REF:0000024 ISS rows from Xenopus Fritz Q32NR9, which
      is in the same PANTHER subfamily (PTHR13667:SF5) as mouse Wdpcp. Morpholino-based; used only as
      donor context.
