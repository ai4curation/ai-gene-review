  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 17.14), an exact GOA match and the complex this review assigns as a core
      function. Myc cannot bind DNA without Max, so naming the heterodimer is the right level. Correct
      and specific; already annotated.
