id: P01108
gene_symbol: Myc
taxon:
  id: NCBITaxon:10090
  label: Mus musculus (Mouse)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for mouse Myc. The list is essentially identical to human MYC's
  - Myc-Max complex, E-box binding, response to actinomycin D, G1/S transition, N-box binding, in
  that order, with scores within 0.4 units - which confirms that ProTrek's output for orthologous
  pairs is a property of the family embedding rather than of the species. Ranks 1 and 2 are exact
  GOA matches covering this review's core functions. Assessment: 2 correct not novel (CNN), 1 nonparalog
  incorrect (NPI).
source_documents:
- projects/PROTREK_EVALUATION/argo139_protrek_hits.tsv
- genes/mouse/Myc/Myc-uniprot.txt
- genes/mouse/Myc/Myc-goa.tsv
