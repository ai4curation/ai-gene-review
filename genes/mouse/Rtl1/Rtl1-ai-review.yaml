- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:34413232
  qualifier: enables
  review:
    summary: Mouse RTL1 self-assembles into capsid-like particles (PMID:34413232), consistent with its
      retained Gag capsid domain. This structural (capsid) activity is a molecular function of the protein
      not otherwise captured (replacing the ND root).
    action: NEW
    reason: 'Capsid-like self-assembly directly demonstrated for mouse RTL1; defines a molecular function.
      GO:0039660 structural constituent of virion is not used: a virion is an infectious viral particle,
      and this host-encoded protein assembles non-infectious virus-like capsids. The capsid activity is
      therefore annotated to the parent GO:0005198 structural molecule activity, with the specific term
      proposed as the NTR ''structural constituent of virus-like capsid'' (the same gap and proposal recorded
      for ARC).'
    supported_by:
    - reference_id: PMID:34413232
      supporting_text: self-assemble into capsid-like particles
    - reference_id: file:mouse/Rtl1/Rtl1-deep-research-openscientist.md
      supporting_text: retains an intact catalytic aspartate motif
