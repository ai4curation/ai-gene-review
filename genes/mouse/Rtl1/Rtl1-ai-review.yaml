proposed_new_terms:
- proposed_name: structural constituent of virus-like capsid
  proposed_definition: The action of a molecule that contributes to the structural integrity of a virus-like
    capsid, a non-infectious protein coat encoded by endogenous, non-viral genes that surrounds nucleic
    acid.
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  justification: GO:0039660 structural constituent of virion exists for viral capsid proteins, but Rtl1
    is a domesticated, host-encoded Gag-derived protein whose particles are non-infectious, so its capsid
    role can only be annotated to the bare parent GO:0005198. A sibling of GO:0039660 under GO:0005198
    would pair with the existing cellular component GO:0170047 virus-like capsid. The same term is proposed
    in the human ARC review.
  supported_by:
  - reference_id: PMID:34413232
    supporting_text: MmMOAP1, MmZCCHC12, MmRTL1, MmPNMA3, MmPNMA5, MmPNMA6a, and MmPEG10 self-assemble
      into capsid-like particles
suggested_questions:
- question: Is the RTL1 retropepsin aspartic-protease domain catalytically active, and does it autoprocess
    the RTL1 Gag-Pol polyprotein as its PEG10 paralog does?
- question: In which cell type (trophoblast versus endothelial) does RTL1 act to maintain the fetal capillaries,
    and how does it functionally interact with PEG10 at the feto-maternal interface?
- question: Does RTL1 form RNA-packaging particles in vivo, and does particle formation or membrane association
    underlie its placental and muscle functions?
suggested_experiments:
- hypothesis: RTL1 protease catalysis, not just protein presence, is required for fetal-capillary maintenance.
  description: Generate an Rtl1 protease active-site (D684A) knock-in mouse mirroring the PEG10 protease-motif
    mutant and assess placental fetal-capillary integrity and muscle development.
  experiment_type: mutagenesis / in vivo
- hypothesis: RTL1 acts cell-autonomously in a specific placental cell type.
  description: Trophoblast-specific versus endothelial-specific conditional Rtl1 deletion to localize
    where the protein is required for capillary maintenance.
  experiment_type: conditional knockout
