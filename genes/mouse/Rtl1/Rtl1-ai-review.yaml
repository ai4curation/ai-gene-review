taxon:
  id: NCBITaxon:10090
  label: Mus musculus
description: 'Rtl1 (retrotransposon-like 1; also Peg11, SIRH2) is a eutherian-specific, paternally expressed
  imprinted gene in the Dlk1-Dio3 cluster (mouse chromosome 12qF1; syntenic with human 14q32.2), domesticated
  from a Ty3/gypsy (sushi-ichi) LTR retrotransposon. It encodes a full-length ~1744-aa Gag-Pol-like polyprotein:
  an N-terminal capsid/nucleocapsid region, a Pol-like region with a retropepsin aspartic-protease domain
  retaining the DSG active-site motif, a reverse-transcriptase-like region and RNase-H-like region, and
  predicted C-terminal transmembrane helices. Rtl1 dosage is tuned in trans by miR-127 and other microRNAs
  processed from the reciprocally imprinted maternal antisense transcript Rtl1as/Peg11as, which degrade
  Rtl1 mRNA by RNAi. The primary physiological role of Rtl1 is dosage-sensitive structural maintenance
  of the fetal capillary network of the chorioallantoic (labyrinthine) placenta: both loss and overproduction
  cause late-fetal/neonatal lethality, with capillary clogging and down-regulation of endothelial genes
  (Tmem100, Meox2, Lyve1). Rtl1 is also the major gene driving dosage-dependent fetal/neonatal skeletal-muscle
  development; in muscle the protein localizes beside the sarcomeric Z-disc, and its loss and overexpression
  phenocopy the muscle features of human Temple and Kagami-Ogata syndromes respectively. Rtl1 is additionally
  paternally expressed in brainstem, thalamus and hypothalamus, where it regulates locus-coeruleus neuronal
  excitability and emotional/social behaviour.'
