  review:
    summary: Protein-lysine 6-oxidase activity (EC 1.4.3.13) from the combined IEA pipeline. Human LOXL3 and
      its splice forms have beta-aminopropionitrile-inhibitable amine oxidase activity toward collagen and elastin.
    action: ACCEPT
    reason: This is the defining catalytic activity of the lysyl oxidase family. The donkey catalytic domain
      is invariant relative to human over 150 residues, and the copper-binding histidines and the LTQ-forming
      lysine and tyrosine are conserved.
    supported_by:
    - reference_id: PMID:17018530
      supporting_text: These findings strongly indicate that LOXL3 encodes two variants, LOXL3 and LOXL3-sv1,
        both of which function as amine oxidases with distinct tissue and substrate specificities from one another.
    - reference_id: PMID:28112368
      supporting_text: The recombinant LOXL3-sv2 protein showed a β-aminopropionitrile-inhibitable amine oxidase
        activity toward collagen type I.
    - reference_id: file:EQUAS/LOXL3/LOXL3-bioinformatics/RESULTS.md
      supporting_text: Donkey 651-800 are 150/150 identical to human 580-729, i.e. the C-terminal lysyl oxidase
        catalytic domain is invariant.
