id: A0A9L0K7N3
gene_symbol: LOXL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: LOXL3 (lysyl oxidase-like 3) is a secreted copper- and lysine tyrosylquinone (LTQ)-dependent amine
  oxidase of the lysyl oxidase family. Its C-terminal catalytic domain oxidatively deaminates peptidyl lysine
  residues in collagens and elastin to allysine, generating the reactive aldehydes that form extracellular-matrix
  cross-links; four N-terminal scavenger receptor cysteine-rich (SRCR) domains precede the catalytic domain. Loss
  of LOXL3 affects collagen-rich connective tissues during development, and a nuclear pool of LOXL3 has been
  reported to deacetylate STAT3 and restrain Th17 differentiation. The donkey protein A0A9L0K7N3 is the ortholog
  of human LOXL3 (96% identity across the full human length) with the copper-binding histidines and LTQ residues
  conserved; this gene model carries a 52-residue N-terminal extension upstream of the signal-peptide region.
