predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0018057
    label: peptidyl-lysine oxidation
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Human LOXL3 is a protein-lysine 6-oxidase that oxidizes peptidyl lysine residues to allysine in
      collagens and elastin, so it directly performs peptidyl-lysine oxidation; the human gene carries this process
      by IDA. The donkey protein keeps the copper-binding histidines and the LTQ-forming lysine and tyrosine,
      with an invariant catalytic domain. Donkey GOA has the molecular function (protein-lysine 6-oxidase activity)
      but no peptidyl-lysine oxidation row, and the MF and BP are in different GO aspects, so this is a novel
      correct process annotation rather than LSP or CNN.
    supported_by:
    - reference_id: file:human/LOXL3/LOXL3-uniprot.txt
      supporting_text: 'FUNCTION: Protein-lysine 6-oxidase that mediates the oxidation of

        CC       peptidyl lysine residues to allysine in target proteins'
    - reference_id: PMID:17018530
      supporting_text: These findings strongly indicate that LOXL3 encodes two variants, LOXL3 and LOXL3-sv1,
        both of which function as amine oxidases with distinct tissue and substrate specificities from one another.
    - reference_id: file:EQUAS/LOXL3/LOXL3-bioinformatics/RESULTS.md
      supporting_text: the lysine tyrosylquinone (LTQ) cofactor residues (human Lys634 and Tyr670 = donkey Lys705
        and Tyr741) are conserved
