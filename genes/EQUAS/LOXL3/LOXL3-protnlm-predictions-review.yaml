id: A0A9L0K7N3
gene_symbol: LOXL3
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of the single ProtNLM2 GO prediction for donkey LOXL3 (A0A9L0K7N3), judged against
  the donkey GOA record (protein-lysine 6-oxidase activity, copper ion binding, collagen fibril organization,
  extracellular region and broader ARBA/InterPro terms), the human ortholog P58215 and its characterization,
  and a donkey-human alignment (96% identity, catalytic residues conserved). The prediction, peptidyl-lysine
  oxidation, is correct and absent from donkey GOA (COR). The frozen ProtNLM2 output contains no non-GO rows
  (function text or subcellular location) for this accession.
