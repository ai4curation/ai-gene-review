suggested_questions:
- question: Is the 97-residue SNAP23 product (A0A8C4M285, ending in the divergent tail FNIRSRAQ) a real
    transcript product of the donkey SNAP23 gene or a gene-model artefact, and if expressed, does it act as
    a dominant-negative regulator of SNAP23-dependent SNARE assembly?
- question: Should the synaptic vesicle priming and synaptic vesicle fusion to presynaptic active zone membrane
    assertions at PAINT node PTN000447754 (seeded by Drosophila Snap25) be blocked for the vertebrate SNAP23
    subfamily (PTHR19305:SF4), given that SNAP23 does not support a primed vesicle pool or synchronous release
    in Snap25-null rescue experiments?
suggested_experiments:
- description: RT-PCR or long-read sequencing of donkey tissue RNA to test for a SNAP23 transcript encoding the
    97-residue product, followed by co-immunoprecipitation with STX4 and VAMP3/VAMP8 to test SNARE complex incorporation.
