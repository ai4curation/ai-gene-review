description: SNAP23 (synaptosome-associated protein 23) is the ubiquitously expressed member of the SNAP-25
  family of Qbc t-SNAREs (PANTHER subfamily PTHR19305:SF4, distinct from the neuronal SNAP25 subfamily).
  Full-length SNAP23 is anchored to the plasma membrane by palmitoylation of a cysteine-rich linker and
  contributes two SNARE motifs (Qb and Qc) to the four-helix trans-SNARE bundle with syntaxins (for example
  STX4, STX11) and VAMPs, driving fusion of transport and secretory vesicles with the plasma membrane in
  non-neuronal cells such as immune, epithelial and muscle cells. This donkey entry (A0A8C4M285) is a 97-residue
  product of an alternative SNAP23 transcript that shares the first four exons with the full-length transcript
  and then ends in an alternative terminal exon. It contains the N-terminal (Qb) SNARE motif and the palmitoylated
  cysteine linker, ends with a short unrelated tail (FNIRSRAQ), and lacks the C-terminal (Qc) SNARE motif.
  The full-length donkey SNAP23 product is represented by UniProt A0A8C4M333 (211 residues).
