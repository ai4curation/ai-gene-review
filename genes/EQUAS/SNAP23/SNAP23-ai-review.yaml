- description: Palmitoyl-anchored plasma membrane protein carrying the N-terminal SNARE motif of SNAP23. Full-length
    SNAP23 is a Qbc t-SNARE for vesicle fusion with the plasma membrane, but whether this truncated product contributes
    to SNARE function is unknown.
