    summary: Synaptic vesicle priming is a neuronal function of the paralog SNAP25; SNAP23 is the ubiquitous
      non-neuronal SNAP-25-family t-SNARE.
    action: MARK_AS_OVER_ANNOTATED
    reason: The term propagates the neuronal SNAP25 role across the SNAP-25 family. Characterized SNAP23
      functions are in constitutive and regulated exocytosis of non-neuronal cells (immune cells, muscle
      satellite cells), and human SNAP23 carries this term only by IBA. For a truncated product lacking
      the second SNARE motif, a synaptic vesicle priming role is even less supported.
