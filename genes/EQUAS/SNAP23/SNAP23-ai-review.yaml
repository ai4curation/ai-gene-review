- term:
    id: GO:0016082
    label: synaptic vesicle priming
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000447812
  review:
    summary: Synaptic vesicle priming is a function of the neuronal paralog SNAP25; SNAP23, the ubiquitous
      non-neuronal SNAP-25-family t-SNARE in a separate PANTHER subfamily, does not support a primed vesicle
      pool.
    action: MARK_AS_OVER_ANNOTATED
    reason: On human SNAP23 this term is only an IBA, from PAINT node PTN000447754 seeded by Drosophila Snap25,
      a pre-duplication ortholog of both vertebrate SNAP25 and SNAP23. SNAP23 sits in PTHR19305:SF4, separate
      from the SNAP25 subfamily (SF5), and after the duplication it specialised in non-neuronal exocytosis.
      The direct test argues against priming. When overexpressed in Snap25-null chromaffin cells, SNAP23 did
      not support a standing pool of primed vesicles. In Snap25-null neurons it supported only asynchronous
      release. No study shows SNAP23 priming synaptic vesicles under endogenous conditions. This truncated
      product also lacks the second SNARE motif.
    supported_by:
    - reference_id: PMID:12859899
      supporting_text: whereas SNAP-23 did not support a standing pool of primed vesicles
    - reference_id: PMID:17728451
      supporting_text: SNAP-23 supported asynchronous release only
    - reference_id: PMID:8663154
      supporting_text: Unlike SNAP-25, SNAP-23 was expressed in all tissues examined.
