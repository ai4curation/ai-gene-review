    label: helical-bundle zippering fusogenic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000447812
  review:
    summary: Full-length SNAP23 is a t-SNARE with SNARE fusogenic activity, but this 97-residue product
      carries only the first of its two SNARE motifs.
    action: UNDECIDED
    reason: The activity is well supported for full-length SNAP23 (human IDA), which donates both a Qb and
      a Qc helix to the SNARE bundle. The donkey product A0A8C4M285 lacks the region corresponding to human
      90..211, including the C-terminal Qc SNARE motif, so it cannot supply the SNAP23 contribution to a
      complete bundle as described for the full-length protein. There is no evidence on whether this truncated
      product is expressed or assembles into fusogenic complexes, so the claim cannot be confirmed or refuted
      for this gene product.
