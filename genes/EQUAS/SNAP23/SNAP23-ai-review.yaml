core_functions:
- description: Palmitoyl-anchored plasma membrane protein carrying the N-terminal (Qb) SNARE motif of SNAP23.
    Full-length SNAP23 is a Qbc t-SNARE for vesicle fusion with the plasma membrane, but whether this alternative-terminal-exon
    product, which lacks the Qc SNARE motif, contributes to SNARE function is unknown.
