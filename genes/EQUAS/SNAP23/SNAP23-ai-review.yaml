  review:
    summary: Full-length SNAP23 is a t-SNARE with SNARE fusogenic activity, but this 97-residue product
      carries only the first of its two SNARE motifs.
    action: UNDECIDED
    reason: The activity is well supported for full-length SNAP23 in the same PANTHER subfamily (SF4; human
      IDA, and SNAP23 binds syntaxins and VAMPs). SNAP23 donates both a Qb and a Qc helix to the SNARE bundle;
      the isolated N-terminal SNARE motif assembles into a heterotetramer only when the C-terminal motif is
      supplied separately. The donkey product A0A8C4M285 is an alternative-terminal-exon product that lacks
      the region corresponding to human 90..211, including the Qc SNARE motif, so it cannot by itself supply
      the SNAP23 contribution to a fusogenic bundle. There is no evidence on whether this product is expressed,
      so the TreeGrafter claim (which is made for the gene, not the splice form) cannot be confirmed or refuted
      for this gene product.
