id: A0A8C4M285
gene_symbol: SNAP23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: SNAP23 (synaptosome-associated protein 23) is the ubiquitously expressed member of the SNAP-25
  family of Qbc t-SNAREs. Full-length SNAP23 is anchored to the plasma membrane by palmitoylation of a
  cysteine-rich linker and contributes two SNARE motifs to the four-helix trans-SNARE bundle with syntaxins
  (for example STX4, STX11) and VAMPs, driving fusion of transport and secretory vesicles with the plasma
  membrane in non-neuronal cells such as immune, epithelial and muscle cells. This donkey entry (A0A8C4M285)
  is a 97-residue SNAP23 product that contains the N-terminal SNARE motif and the palmitoylated cysteine
  linker but ends with a short divergent tail and lacks the C-terminal SNARE motif; full-length SNAP23
  products of the donkey gene are represented by other UniProt entries.
