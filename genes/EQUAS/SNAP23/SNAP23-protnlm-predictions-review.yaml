status: COMPLETE
description: Assessment of the single ProtNLM2 GO prediction for the 97-residue donkey SNAP23 product A0A8C4M285,
  which retains the N-terminal SNARE motif and the palmitoylated cysteine linker of SNAP23 but lacks the C-terminal
  SNARE motif. The prediction membrane (GO:0016020) is true of the SNAP23 gene but is scored NPI for this product,
  which lacks proline 119, the DHHC17 recognition residue that full-length SNAP23 requires for membrane
  association. ProtNLM2 also emitted a subcellular location of Membrane, subject to the same caveat; no function
  text was emitted. Non-GO outputs are
  noted, not scored.
