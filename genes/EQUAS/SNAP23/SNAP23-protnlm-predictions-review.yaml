id: A0A8C4M285
gene_symbol: SNAP23
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of the single ProtNLM2 GO prediction for the 97-residue donkey SNAP23 product A0A8C4M285,
  which retains the N-terminal SNARE motif and the palmitoylated cysteine linker of SNAP23 but lacks the C-terminal
  SNARE motif. The prediction membrane (GO:0016020) is correct but less precise than the donkey GOA plasma
  membrane annotation (LSP). ProtNLM2 also emitted a subcellular location of Membrane, consistent with the
  lipid-anchored plasma-membrane localization of SNAP23; no function text was emitted. Non-GO outputs are
  noted, not scored.
