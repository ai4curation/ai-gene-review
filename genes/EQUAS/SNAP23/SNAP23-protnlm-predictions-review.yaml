      supporting_text: Lipid-anchor {ECO:0000269|PubMed:21044946}.
    - reference_id: file:EQUAS/SNAP23/SNAP23-bioinformatics/RESULTS.md
      supporting_text: all five linker cysteines (human C79, C80, C83, C85, C87) are conserved
