  review:
    assessment: LSP
    confidence_score: 2
    summary: SNAP23 is anchored to the plasma membrane by palmitoylation of its cysteine-rich linker, and
      all five linker cysteines are conserved in this truncated donkey product, so membrane localization
      is well supported by transfer from human SNAP23. Donkey GOA already contains the more specific plasma
      membrane (GO:0005886) annotation, which the ProtNLM2 evidence record itself names as the matched GO
      term. The prediction is therefore correct but less precise than an existing annotation.
    supported_by:
