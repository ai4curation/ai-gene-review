    summary: Membrane is true of the SNAP23 gene, whose full-length product is a palmitoyl-anchored peripheral
      plasma-membrane protein, but this 97-residue product lacks a feature that membrane association requires.
      Donkey residues 1..89 match human SNAP23 1..89 and keep the Qb SNARE motif and all five linker cysteines;
      the product then ends in an 8-residue alternative-exon tail and lacks the region corresponding to human
      90..211. That region contains proline 119, the DHHC17 palmitoyl-transferase recognition residue. In mast
      cells the P119A mutation alone shifts full-length SNAP23 completely to the cytosol, as does loss of the
      linker cysteines, so membrane anchoring needs both the cysteines and the downstream P119 motif. Without
      P119 this product is not expected to be palmitoylated by DHHC17 or to associate with membranes, so the
      prediction is scored as a product-level architecture mismatch. Membrane association of this product has
      not been tested directly.
    supported_by:
    - reference_id: file:EQUAS/SNAP23/SNAP23-bioinformatics/human-SNAP23-O00161-uniprot.txt
      supporting_text: Lipid-anchor {ECO:0000269|PubMed:21044946}.
    - reference_id: file:EQUAS/SNAP23/SNAP23-bioinformatics/RESULTS.md
      supporting_text: all five linker cysteines (human C79, C80, C83, C85, C87) are conserved
    - reference_id: PMID:31260699
      supporting_text: either some or all cysteine residues in the linker region of SNAP-23 are required for
        anchoring of SNAP-23 to the plasma membrane in mast cells
    - reference_id: PMID:31260699
      supporting_text: The P119A mutation completely shifted localization of SNAP-23 to cytosol
