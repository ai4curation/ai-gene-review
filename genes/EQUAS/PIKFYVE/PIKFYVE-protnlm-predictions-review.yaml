  label: Equus asinus
status: COMPLETE
description: >-
  Assessment of the single ProtNLM2 GO prediction for donkey PIKFYVE entry A0A9L0JQ61 (DONKEY40 cohort).
  The 460-residue input is not the full-length phosphoinositide kinase: alignment shows it is the counterpart
  of the short human PIKFYVE splice isoform 3 (96.08% identity), lacking the PIPK catalytic domain, the
  chaperonin-like domain and most of the FYVE finger, while retaining the DEP domain. The predicted
  phosphatidylinositol phosphate biosynthetic process transfers the full-length enzyme's catalytic output
  (the ProtNLM2 evidence record cites a phmmer match to full-length mouse Pikfyve Q9Z1T6) to a protein that
  cannot catalyze it, so it is scored NPI with DOMAIN_ARCHITECTURE_MISMATCH. Non-GO ProtNLM2 output for this
  accession, not scored here: subcellular location "Nucleus", whose evidence record is a weak phmmer match
  (score 26.2) to Drosophila Dishevelled (P51140), a DEP-domain protein; full-length PIKFYVE is an endosomal
  membrane protein, and no data place the short isoform in the nucleus. No function text was emitted.
