  review:
    assessment: UNC
    confidence_score: 1
    summary: Full-length PIKFYVE contributes to phosphatidylinositol phosphate biosynthesis by synthesizing
      PtdIns(3,5)P2 and PtdIns5P through its C-terminal PIPK domain. The selected donkey protein is the
      product of a non-canonical transcript corresponding to human isoform 3, which ends at residue 548 and
      contains no part of the PIPK domain (human 1758-2084), so it cannot perform the catalytic step. That
      excludes the gene's main mode of participation, but it does not exclude every other mode. The short
      product also lacks the Cpn60_TCP1 (chaperonin-like) domain, which the PAS-complex study identifies as
      a major, not the sole, determinant of ArPIKfyve(VAC14)-Sac3(FIG4) association, and it lacks the complete
      FYVE finger that targets the enzyme to endosomes. It retains the N-terminal region and the DEP domain
      (donkey 277-352), whose contribution to the PAS complex or to lipid synthesis has been neither shown
      nor excluded. No study characterizes the short isoform, and endogenous human PIKfyve was detected as a
      single molecular species, so a binding or regulatory contribution is unsupported but not refuted. The
      prediction most likely transfers the full-length enzyme's output through the shared N-terminal and DEP
      region, and the term cannot be validated or refuted for this product, so it is scored UNC. At the gene
      level the claim is not novel, because the canonical donkey product A0A8C4L106 already carries
      phosphatidylinositol metabolic process and PI(3,5)P2 metabolic process annotations.
