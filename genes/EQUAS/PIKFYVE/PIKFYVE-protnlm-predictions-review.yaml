  review:
    assessment: NPI
    confidence_score: 0
    error_type: DOMAIN_ARCHITECTURE_MISMATCH
    summary: Full-length PIKFYVE synthesizes PtdIns(3,5)P2 and PtdIns5P through its C-terminal PIPK domain.
      The selected donkey protein is the product of a non-canonical transcript corresponding to human isoform
      3, which ends at residue 548 and contains no part of the PIPK domain (human 1758-2084), so it cannot
      carry out the biosynthetic step. Participation without catalysis is also unsupported. The short product
      lacks the Cpn60_TCP1 (chaperonin-like) domain, which is the main contact for the ArPIKfyve(VAC14)-Sac3(FIG4)
      subcomplex, so it is not expected to act as a scaffold in the PAS complex. It also lacks the complete
      FYVE finger that targets the enzyme to endosomes. No study reports a role for the short isoform, and
      endogenous human PIKfyve was detected as a single molecular species. The gene review REMOVEs the kinase-activity
      and PI(3,5)P2-dependent process rows on this entry for the same domain-architecture reasons. The prediction
      transfers the full-length enzyme's output through the shared N-terminal and DEP region, so it is NPI
      with DOMAIN_ARCHITECTURE_MISMATCH. At the gene level the claim is not novel, because the canonical donkey product
      A0A8C4L106 already carries phosphatidylinositol metabolic process and PI(3,5)P2 metabolic process
      annotations, and those belong to the full-length products, not to this one.
