    - reference_id: file:EQUAS/PIKFYVE/PIKFYVE-bioinformatics/RESULTS.md
      supporting_text: It also lacks the chaperonin-like domain (human 616-868) and the entire PIPK catalytic
        domain (human 1758-2084).
    - reference_id: file:EQUAS/PIKFYVE/PIKFYVE-bioinformatics/RESULTS.md
