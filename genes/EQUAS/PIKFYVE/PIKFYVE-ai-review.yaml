gene_symbol: PIKFYVE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: 'PIKFYVE encodes the phosphoinositide 5-kinase that converts phosphatidylinositol 3-phosphate
  to phosphatidylinositol 3,5-bisphosphate (and phosphatidylinositol to phosphatidylinositol 5-phosphate)
  on endosomal membranes. The full-length enzyme (about 2100 residues) is recruited to endosomes by its
  PtdIns3P-binding FYVE finger, works in a complex with the scaffold VAC14 and the phosphatase FIG4, and
  controls endolysosomal maturation, phagosome-lysosome fusion, melanosome biogenesis and neutrophil chemotaxis
  and ROS production. This entry, A0A9L0JQ61, is not the full-length kinase: its 460-residue sequence
  corresponds to the short human PIKFYVE splice isoform 3 (96% identity), which keeps the N-terminal region
  and the DEP domain but lacks most of the FYVE finger, the chaperonin-like domain and the entire PIPK
  catalytic domain. The function of this short isoform has not been characterized. Full-length donkey
  PIKFYVE products are separate UniProt entries.'
