  review:
    summary: 1-phosphatidylinositol-3-phosphate 5-kinase activity, combined from InterPro (PIKfyve family
      and PIKfyve DEP entries) and the PANTHER node PTN001347166. The activity belongs to the C-terminal
      PIPK domain of full-length PIKFYVE; this 460-residue isoform contains no part of that domain.
    action: REMOVE
    reason: The family and DEP-domain signatures are shared with the full-length kinase, but the catalytic
      domain (human 1758-2084) is absent from this product, which corresponds to human isoform 3 (truncated
      at residue 548). An enzyme activity cannot be assigned to a protein that lacks its catalytic domain.
      The gene's full-length products (separate entries) do carry this activity.
    supported_by:
