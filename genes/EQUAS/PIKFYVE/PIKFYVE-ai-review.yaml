suggested_questions:
- question: Is the short PIKFYVE isoform (human isoform 3, donkey A0A9L0JQ61) translated as a stable protein,
    and if so does it act as a regulator, for example a dominant-negative competitor of full-length PIKFYVE
    for VAC14/FIG4 or membrane sites?
suggested_experiments:
- description: Detect the short PIKFYVE isoform protein in equine or human tissues with an isoform-specific
    antibody or targeted proteomics of its unique NSLQHPQEN junction peptide, and test whether its expression
    alters PI(3,5)P2 levels or endolysosome size.
knowledge_gaps:
- gap_statement: The molecular function, if any, of the short kinase-less PIKFYVE isoform (DEP domain
    retained, FYVE finger largely and PIPK domain wholly absent) is unknown.
  gap_kind:
  - BIOLOGY
