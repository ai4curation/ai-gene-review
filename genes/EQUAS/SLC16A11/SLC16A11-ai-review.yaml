    label: monocarboxylic acid transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN008966426
  review:
    summary: TreeGrafter transfer of monocarboxylic acid transmembrane transporter activity. PAINT curators placed
      this term at the MCT-family node PTN000888455, with human MCT11 among the experimental seeds. Human MCT11
      moves pyruvate with a proton, and mouse MCT11 mediates lactic acid uptake.
    action: ACCEPT
    reason: The activity is placed at a deep PAINT node of the family, the donkey gene sits inside that clade in the
      MCT11 subfamily (SF80), and the substrate class is supported in two species (pyruvate for human, lactate for
      mouse). This is the precise level the evidence supports for the gene. Curators did not propagate the narrower
      pyruvate transporter term from the human IDA, and MCT11 also takes up lactate, so the family-level term is
      kept rather than narrowed. The A0A9L0JV53 polypeptide itself lacks TM1-TM3 and is unlikely to transport on
      its own; this is a property of the transcript model, while the full-length donkey model (A0A8C4PS96) has the
      complete fold.
    supported_by:
    - reference_id: PMID:28666119
      supporting_text: These results support a H+-coupled mechanism underlying SLC16A11 transport
    - reference_id: PMID:39516648
      supporting_text: Conditional deletion of MCT11 in T cells reduced lactic acid uptake by Tex cells
    - reference_id: file:EQUAS/SLC16A11/SLC16A11-bioinformatics/RESULTS-rereview.md
      supporting_text: Its residues 108-439 are identical to A0A8C4PS96 residues 189-520, which correspond to human
        residues 116-447.
