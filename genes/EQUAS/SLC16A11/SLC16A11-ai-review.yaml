id: A0A9L0JV53
gene_symbol: SLC16A11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: SLC16A11 encodes monocarboxylate transporter 11 (MCT11), a member of the proton-linked monocarboxylate
  transporter family (SLC16) of the major facilitator superfamily. In human, MCT11 is a twelve-helix membrane transporter
  that moves pyruvate together with a proton across the plasma membrane; it pairs with the ancillary protein basigin
  (BSG), which promotes its delivery to the cell surface, although most of the protein resides in the endoplasmic
  reticulum membrane. It is expressed in liver, salivary gland and thyroid, influences hepatic lipid metabolism,
  and variants that lower its expression or cell-surface level raise type 2 diabetes risk. In mouse, MCT11 is induced
  in exhausted CD8+ T cells in tumours, where it mediates lactic acid uptake. The donkey gene (Ensembl ENSEASG00005017919)
  has several UniProt transcript models; this entry, A0A9L0JV53, is an alternative transcript model whose C-terminal
  332 residues match the full-length donkey MCT11 model (A0A8C4PS96) exactly, but whose first 107 residues are an
  unrelated sequence, so it lacks the first three transmembrane helices.
