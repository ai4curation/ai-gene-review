  label: Equus asinus
description: SLC16A11 (monocarboxylate transporter 11, MCT11) is a member of the proton-linked monocarboxylate
  transporter family within the major facilitator superfamily. The human ortholog transports pyruvate together
  with a proton across the plasma membrane, where it pairs with the ancillary protein basigin (BSG); it is also
  found in the endoplasmic reticulum membrane, is expressed in liver, salivary gland and thyroid, and influences
  hepatic lipid metabolism, with reduced-function variants conferring type 2 diabetes risk. The donkey entry A0A9L0JV53
  is an incomplete gene model - its C-terminal ~340 residues are clearly orthologous to human MCT11, but its first
  100 residues are unrelated sequence and the region corresponding to transmembrane helices 1-3 is missing.
