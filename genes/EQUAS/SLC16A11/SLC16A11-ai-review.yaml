suggested_questions:
- question: Which donkey SLC16A11 transcript is the main expressed product? Is the full-length model A0A8C4PS96 (with
    TM1-TM3) the dominant liver isoform, and is the A0A9L0JV53 transcript, which lacks TM1-TM3, translated at all?
- question: Is MCT11 substrate preference conserved across mammals (pyruvate in the human assay, lactate in mouse
    T cells), and would a more specific substrate term be justified at the MCT11 subfamily level?
suggested_experiments:
- description: Long-read cDNA sequencing or 5'-RACE of donkey liver SLC16A11 transcripts to establish which 5' exons
    are used, followed by pyruvate and lactate uptake assays of the full-length donkey protein co-expressed with BSG.
