  review:
    assessment: LSP
    confidence_score: 2
    summary: The donkey protein is the MCT11 member of the proton-linked monocarboxylate transporter family (PANTHER
      PTHR11360:SF80), and human MCT11 transports pyruvate with a proton across the plasma membrane, so transmembrane
      transporter activity is true of the gene. Donkey GOA already holds the exact term (InterPro2GO) and the
      more specific monocarboxylic acid transmembrane transporter activity (TreeGrafter), so the prediction is
      correct but less precise than an existing annotation. The gene model is N-terminally incomplete (no counterpart
      of human helices 1-3), so transport by this exact polypeptide is doubtful; the assessment refers to the
      gene product as the ortholog of human MCT11.
