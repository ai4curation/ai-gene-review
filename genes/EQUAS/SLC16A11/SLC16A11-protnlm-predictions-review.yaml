    summary: Scored for the A0A9L0JV53 polypeptide, an alternative transcript model of donkey SLC16A11 (MCT11,
      PANTHER PTHR11360:SF80). Transmembrane transporter activity is true of the gene, since human MCT11 transports
      pyruvate with a proton and the full-length donkey model A0A8C4PS96 has the complete fold, but this product
      lacks the region of transmembrane helices 1-3 of the twelve-helix major facilitator fold. Its first 107 residues
      are an unrelated sequence with no counterpart of human TM1-TM3, and only residues 108-439 (human 116-447)
      are shared with the full-length model. A major facilitator transporter missing three helices of its N-terminal
      six-helix bundle lacks part of the translocation pathway, so this exact polypeptide is not expected to transport
      on its own. The prediction depends on a feature this accession lacks.
