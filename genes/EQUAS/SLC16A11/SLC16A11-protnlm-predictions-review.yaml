id: A0A9L0JV53
gene_symbol: SLC16A11
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of the single ProtNLM2 GO prediction for donkey SLC16A11 (A0A9L0JV53), judged against
  the donkey GOA record (ER membrane, plasma membrane, monocarboxylic acid transmembrane transporter activity,
  monocarboxylic acid transport, transmembrane transporter activity, transmembrane transport), the human ortholog
  Q8NCK7 and a donkey-human alignment showing that this gene model lacks the region of transmembrane helices
  1-3. The prediction, transmembrane transporter activity, is correct for the gene but less specific than the
  monocarboxylic acid transmembrane transporter activity already in donkey GOA (LSP). The frozen ProtNLM2 output
  contains no non-GO rows (function text or subcellular location) for this accession.
