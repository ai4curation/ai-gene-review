description: Assessment of the single ProtNLM2 GO prediction for donkey SLC16A11 (A0A9L0JV53), judged against
  the donkey GOA record (ER membrane, plasma membrane, monocarboxylic acid transmembrane transporter activity,
  monocarboxylic acid transport, transmembrane transporter activity, transmembrane transport), experimental
  evidence that human MCT11 (Q8NCK7) is a proton-coupled pyruvate transporter, and donkey-human alignments showing
  that this gene model lacks the region of transmembrane helices 1-3 while its remaining residues are identical
  to the full-length donkey model A0A8C4PS96. The prediction, transmembrane transporter activity, is true of the gene but is scored as
  incorrect for this product (NPI, domain architecture mismatch), because the polypeptide lacks transmembrane helices
  1-3 of the transport fold. The frozen ProtNLM2 output
  contains no non-GO rows (function text or subcellular location) for this accession.
