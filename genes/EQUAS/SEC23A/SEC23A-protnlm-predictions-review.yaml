  review:
    assessment: UNC
    confidence_score: 1
    summary: COPII-coated vesicle budding is a core process of the SEC23A gene, whose canonical product
      is an inner-coat COPII subunit and the SAR1 GTPase-activating protein; Sec23p-Sar1p interaction is
      required for budding in yeast, and a disease variant of human SEC23A that poorly recruits Sec13-Sec31
      inhibits vesicle formation in vitro. The term is already in donkey GOA for this gene (InterPro2GO
      mapping of the Sec23 C-terminal domain), so it is not novel. The scored sequence, A0A9L0IQB9, is an
      in-frame exon-skipping transcript product that lacks the 26 residues equivalent to human 554-579.
      It keeps the zinc finger and its four Cys ligands, the trunk domain with F382, the beta-sandwich
      domain and the gelsolin-like PPP-motif-binding residues, but the deletion falls inside the
      Sec23/Sec24 helical domain. That domain spans residues 518-616 in the canonical donkey product
      A0A9L0JMP6, while its Pfam match on A0A9L0IQB9 covers only 553-590. Whether a Sec23 with a
      truncated helical domain still folds, binds SEC24 and SEC31 and supports vesicle budding has not
      been tested, and there is no expression evidence for this transcript. Because the required
      feature, an intact Sec23 fold, cannot be confirmed for this product, the prediction is
      uncertain at product level.
    supported_by:
    - reference_id: file:EQUAS/SEC23A/SEC23A-bioinformatics/human-Q15436-uniprot.txt
      supporting_text: deformation of the endoplasmic reticulum membrane into vesicles
    - reference_id: PMID:17981132
      supporting_text: In vitro assays reveal that the mutant form of SEC23A poorly recruits the Sec13-Sec31
        complex, inhibiting vesicle formation.
    - reference_id: PMID:8451644
      supporting_text: an interaction between Sar1p and the Sec23p subunit of an oligomeric protein is also
        required for vesicle budding
    - reference_id: file:EQUAS/SEC23A/SEC23A-bioinformatics/RESULTS-rereview.md
      supporting_text: lacks the 26-residue segment equivalent to human 554-579
