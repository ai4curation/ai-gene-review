description: 'Assessment of 1 ProtNLM2 GO prediction for donkey SEC23A (A0A9L0IQB9), judged against the
  donkey GOA record (GTPase activator activity, COPII vesicle coat, ER to Golgi vesicle-mediated transport,
  COPII-coated vesicle budding and cargo loading, ER membrane, ER exit site, cytosol), the re-reviewed
  donkey gene review, the human ortholog Q15436, budding assays on human SEC23A (PMID:17981132) and yeast
  Sec23p (PMID:8451644), a donkey-human alignment (99% identity) and a comparison with the canonical
  donkey product A0A9L0JMP6. This accession is an exon-skipping transcript product whose 26-residue
  deletion falls inside the Sec23/Sec24 helical domain, so COPII-coated vesicle budding, a correct and
  already-annotated process for the gene, is uncertain for this product (UNC). Non-GO ProtNLM2 output, not scored: subcellular
  location ''Membrane'', which is true but much less informative than the curated peripheral ER-membrane
  and COPII-vesicle-membrane locations. No function text was emitted for this accession.'
