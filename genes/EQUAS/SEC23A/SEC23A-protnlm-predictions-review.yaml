    summary: SEC23A is an inner-coat subunit of COPII, whose coat physically deforms the ER membrane into
      vesicles, and is the SAR1 GTPase-activating protein; the donkey protein is 99% identical to human
      SEC23A across all Sec23/Sec24 domains. The exact term is already in donkey GOA (InterPro2GO mapping
      of the Sec23 C-terminal domain), so the prediction is correct but not novel. Training-set membership
      is unknown.
    supported_by:
    - reference_id: file:EQUAS/SEC23A/SEC23A-bioinformatics/human-Q15436-uniprot.txt
      supporting_text: deformation of the endoplasmic reticulum membrane into vesicles
    - reference_id: PMID:21235735
      supporting_text: The outer coat stimulates the GTPase-activating protein Sec23 which activates Sar1
        GTP hydrolysis allowing depolymerisation of the coat and recycling of its components.
