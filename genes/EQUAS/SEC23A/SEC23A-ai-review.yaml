  review:
    summary: GTPase activator activity, from TreeGrafter PANTHER node PTN000124665. SEC23 is the GTPase-activating
      protein for SAR1 within the COPII coat; its GAP activity is stimulated by the SEC13-SEC31 outer coat.
    action: ACCEPT
    reason: The SAR1 GAP activity is the defining catalytic-regulatory activity of the SEC23 subfamily and
      is conserved from yeast Sec23 (the PAINT node is grounded in yeast experimental data). The donkey
      protein is 99% identical to human SEC23A across all domains. Core molecular function.
