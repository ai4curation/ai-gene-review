suggested_questions:
- question: Is the donkey SEC23A transcript ENSEAST00005045719, which skips a 78-nt exon and so lacks the
    segment equivalent to human 554-579, expressed in donkey tissues, and does the deletion affect SEC31
    or TANGO1-family binding or SAR1 GAP stimulation?
suggested_experiments:
- description: RT-PCR across the skipped exon in donkey fibroblast and chondrocyte RNA to detect the exon-skipped
    SEC23A transcript, then test the encoded protein for SAR1 GAP activity, SEC13-SEC31 recruitment and
    COPII budding in a reconstituted assay, alongside the full-length canonical product.
