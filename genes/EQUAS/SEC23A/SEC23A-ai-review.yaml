  review:
    summary: GTPase activator activity, transferred by TreeGrafter from a PANTHER PTHR11141 ancestral node.
      SEC23 is the GTPase-activating protein (GAP) for the small GTPase SAR1 in the COPII coat; this was
      shown biochemically for yeast Sec23p, structurally (arginine finger into the Sar1 active site), and
      human SEC23A (same PANTHER subfamily PTHR11141:SF7 as the donkey gene) complements a yeast sec23
      mutant. The same term is propagated by PAINT to human SEC23A from the SEC23 node PTN000124617, with
      yeast Sec23 among the experimental donors.
    action: ACCEPT
    reason: The SAR1 GAP activity is the defining activity of the SEC23 subfamily and arose deep in the
      eukaryotic SEC23 lineage (yeast experimental data); donkey SEC23A sits in the vertebrate SEC23A subfamily
      PTHR11141:SF7 together with human Q15436 and mouse Q01405, and no lineage-specific loss is indicated.
      The benchmark product is an exon-skipping transcript model that retains all domains of the canonical
      protein (file:EQUAS/SEC23A/SEC23A-bioinformatics/RESULTS-rereview.md), so the activity is transferred
      to the gene product with the caveat that the 26-residue deletion has not been tested. Core molecular
      function.
    supported_by:
    - reference_id: PMID:8451644
      supporting_text: The isolated Sec23p subunit and the oligomeric complex stimulated guanosine triphosphatase
        (GTPase) activity of Sar1p 10- to 15-fold
    - reference_id: PMID:12239560
      supporting_text: The GTPase-activating protein (GAP) activity of Sec23 involves an arginine side chain
        inserted into the Sar1 active site.
    - reference_id: PMID:8898360
      supporting_text: hSec23Ap is a functional homologue of the yeast Sec23p as the hSec23A isoform complemented
        the temperature sensitivity of the Saccharomyces cerevisiae sec23-1 mutation
    - reference_id: PMID:21235735
      supporting_text: The outer coat stimulates the GTPase-activating protein Sec23 which activates Sar1
        GTP hydrolysis allowing depolymerisation of the coat and recycling of its components.
    - reference_id: file:EQUAS/SEC23A/SEC23A-bioinformatics/RESULTS.md
      supporting_text: The donkey model A0A9L0IQB9 (739 aa) is 99.32% identical to human SEC23A over 739
        aligned residues
