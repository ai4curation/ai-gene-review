id: A0A9L0IQB9
gene_symbol: SEC23A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: SEC23A is a subunit of the inner layer of the coat protein complex II (COPII), which forms
  transport vesicles and tubular carriers at endoplasmic reticulum exit sites to export secretory and
  membrane cargo to the Golgi. As a SEC23-SEC24 heterodimer recruited from the cytosol by GTP-bound SAR1
  to the cytoplasmic face of the ER membrane, SEC23 is the GTPase-activating protein for SAR1, inserting
  an arginine into the SAR1 active site; the SEC23/24 complex binds cargo such as the SNARE SEC22B, and
  SEC23 recruits the SEC13-SEC31 outer coat that polymerises the coat and drives vesicle fission. SEC23A
  contains a zinc finger, trunk, beta-sandwich, helical and gelsolin-like domain; the gelsolin-like domain
  binds PPP motifs in the large-cargo receptors MIA3 (TANGO1) and MIA2 (cTAGE5) and in SEC31. Loss of
  SEC23A function in human causes cranio-lenticulo-sutural dysplasia with ER distension and a collagen
  secretion defect. The donkey entry A0A9L0IQB9 is one of several alternative transcript products of the
  SEC23A gene; it lacks a 26-residue segment (human 554-579) through an in-frame exon skip but retains all
  domains and characterised functional residues.
