gene_symbol: SEC23A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: SEC23A is a component of the inner layer of the coat protein complex II (COPII), which forms
  transport vesicles at endoplasmic reticulum exit sites for export of secretory and membrane cargo to
  the Golgi. As a SEC23-SEC24 heterodimer recruited by GTP-bound SAR1 to the cytoplasmic face of the ER
  membrane, SEC23A acts as the GTPase-activating protein for SAR1, contributes to cargo selection (for
  example recruitment of the SNARE SEC22B) and, together with the SEC13-SEC31 outer coat, drives membrane
  deformation into COPII vesicles. It contains a zinc-finger, trunk, beta-sandwich, helical and gelsolin-like
  domain; the gelsolin-like repeat binds PPP-motif proteins such as MIA2, MIA3 and SEC31A. The donkey protein
  A0A9L0IQB9 is 99% identical to human SEC23A and lacks a 26-residue segment equivalent to human 554-579.
