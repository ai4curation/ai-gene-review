suggested_questions:
- question: Which APP isoforms (APP695 versus KPI-containing APP751/770) are expressed in donkey brain
    and peripheral tissues, and does the human-type amyloid-beta sequence predispose aged donkeys to amyloid
    deposition?
- question: Most process annotations transferred to non-human APP orthologs (learning or memory, glial
    activation, cytokine production, LTP regulation) derive from Alzheimer-model studies of overexpressed
    mutant APP or applied amyloid-beta acting through receptors such as RAGE, TLR2, PrP and alpha7 nAChR.
    Should these be captured on the receptors, with amyloid-beta as input, rather than propagated to every
    APP ortholog as process participation?
