id: A0A9L0JJJ9
gene_symbol: APP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: 'APP (amyloid-beta precursor protein) is a type I transmembrane glycoprotein of the APP family.
  Full-length APP acts at the neuronal cell surface as a receptor and adhesion molecule: trans-dimerization
  of its ectodomain between neighbouring cells promotes synaptogenesis, and it supports neurite outgrowth
  and axonogenesis, partly through binding heparin and collagen in the extracellular matrix. It traffics
  from the ER and Golgi to the plasma membrane and is rapidly internalized through clathrin-coated pits
  into endosomes. Sequential proteolysis by alpha- or beta-secretase and gamma-secretase releases a soluble
  ectodomain, the amyloid-beta peptides and the APP intracellular domain (AICD); the AICD binds PTB-domain
  adaptors such as FE65/APBB1 through its YENPTY motif and can enter the nucleus to promote transcription.
  Isoforms containing the Kunitz domain (APP751/770) inhibit serine proteases. Amyloid-beta peptides bind
  copper and zinc and aggregate into oligomers and fibrils that activate microglia and astrocytes and
  impair synaptic plasticity in Alzheimer disease. The donkey protein A0A9L0JJJ9 is a full-length 770-residue
  product, the KPI-containing APP770 form, 97.9% identical to human APP with identical Kunitz, E2, amyloid-beta
  and intracellular regions, and it belongs to the vertebrate APP orthology group (PANTHER subfamily PTHR23103:SF7).'
