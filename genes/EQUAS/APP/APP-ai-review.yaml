core_functions:
- description: Neuronal cell-surface receptor and adhesion protein whose ectodomain trans-dimerizes to
    promote synapse formation and supports neurite growth and axonogenesis.
  directly_involved_in:
  - id: GO:0007409
    label: axonogenesis
  - id: GO:0050808
    label: synapse organization
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0030426
    label: growth cone
  molecular_function:
    id: GO:0030546
    label: signaling receptor activator activity
  supported_by:
  - reference_id: file:human/APP/APP-uniprot.txt
    supporting_text: Functions as a cell surface receptor and performs physiological functions on the
      surface of neurons relevant to neurite growth, neuronal adhesion and axonogenesis.
  - reference_id: file:human/APP/APP-uniprot.txt
    supporting_text: molecules on neighboring cells promotes synaptogenesis
- description: Kunitz (BPTI) domain of the APP751/770 isoforms inhibits serine proteases; the donkey protein
    is the KPI-containing isoform.
  molecular_function:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: file:human/APP/APP-uniprot.txt
    supporting_text: isoforms that contain the BPTI domain possess protease inhibitor
  - reference_id: file:EQUAS/APP/APP-bioinformatics/RESULTS.md
    supporting_text: 'human region 291-341: 51 of 51 residues aligned, 51 identical'
- description: Ectodomain binds heparin and extracellular matrix components, regulating neurite outgrowth
    and promoting APP dimerization.
  molecular_function:
    id: GO:0008201
    label: heparin binding
  locations:
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: file:human/APP/APP-uniprot.txt
    supporting_text: extracellular matrix such as heparin and collagen I and IV.
- description: Cytoplasmic YENPTY motif binds PTB/PID-domain adaptors (FE65/APBB, X11/APBA, DAB1, SHC1)
    that couple APP to trafficking and AICD-dependent signalling.
  molecular_function:
    id: GO:0051425
    label: PTB domain binding
  locations:
  - id: GO:0005769
    label: early endosome
  supported_by:
  - reference_id: file:human/APP/APP-uniprot.txt
    supporting_text: 'SUBUNIT: Binds, via its C-terminus, to the PID domain of several'
  - reference_id: file:EQUAS/APP/APP-bioinformatics/RESULTS.md
    supporting_text: transmembrane region and intracellular domain (700-770) identical, including the
      YENPTY motif
