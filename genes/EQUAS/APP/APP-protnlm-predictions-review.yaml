predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0006915
    label: apoptotic process
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Caspase cleavage of human APP releases the C31 peptide, a potent inducer of apoptosis (PMID:10742146),
      and the gamma-secretase-released intracellular domain acts as a positive regulator of apoptosis (PMID:12214090);
      Swiss-Prot summarizes both as enhancers of neuronal apoptosis. The donkey intracellular domain, including
      the caspase site region and YENPTY motif, is identical to human, so the transfer is justified within
      the APP orthology group. No apoptosis term of any kind is in the donkey GOA record or the donkey gene
      review (human APP carries apoptotic process as an accepted IEA), so the prediction is novel for this
      gene. The role is fragment-mediated and non-core, and the evidence is for induction rather than execution,
      so positive regulation of neuron apoptotic process would be the more precise term.
    supported_by:
    - reference_id: file:human/APP/APP-uniprot.txt
      supporting_text: peptides, including C31, are potent enhancers of neuronal apoptosis.
    - reference_id: PMID:10742146
      supporting_text: The resultant C31 peptide was a potent inducer of apoptosis.
    - reference_id: PMID:12214090
      supporting_text: demonstrate that AID acts as a positive regulator of apoptosis
    - reference_id: file:EQUAS/APP/APP-bioinformatics/RESULTS.md
      supporting_text: transmembrane region and intracellular domain (700-770) identical, including the
        YENPTY motif
