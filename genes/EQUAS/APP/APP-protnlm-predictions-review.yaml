  label: Equus asinus
status: COMPLETE
description: 'Assessment of 3 ProtNLM2 GO predictions for donkey APP (A0A9L0JJJ9). Extracellular region
  is already in donkey GOA and correct (CNN). Nucleus is in donkey GOA and correct only for the AICD/gamma-CTF
  fragment (CNN). Apoptotic process is supported by the pro-apoptotic activity of the caspase-derived C31
  peptide and the gamma-secretase-released intracellular domain of human APP, whose sequence donkey
  shares, and no apoptosis term is in donkey GOA (COR). Non-GO ProtNLM2 output, not scored: subcellular location ''Endosome'',
  which matches the experimentally established endosomal trafficking of human APP.'
