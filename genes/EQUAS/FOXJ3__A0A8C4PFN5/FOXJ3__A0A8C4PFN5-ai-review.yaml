- id: PMID:19914232
  title: Foxj3 transcriptionally activates Mef2c and regulates adult skeletal muscle fiber
    type identity.
  findings:
  - statement: Mouse Foxj3 binds a conserved forkhead site in the Mef2c skeletal-muscle enhancer
      and activates Mef2c transcription; Foxj3 mutants have fewer type I fibres and impaired
      regeneration.
    supporting_text: Transcriptional assays in C2C12 myoblasts revealed that Foxj3 transcriptionally
      activates the Mef2c gene in a dose dependent fashion and binds to the conserved FBS.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Mouse; ChIP, reporter mutagenesis and Gal4 fusion assays.
      Main experimental basis for the DNA-binding, activator and nucleus rows.
- id: PMID:27739607
  title: 'Multiple roles of FOXJ3 in spermatogenesis: A lesson from Foxj3 conditional knockout
    mouse models.'
  findings:
  - statement: Germ-cell deletion of Foxj3 in mouse causes male sterility (spermatogonial loss
      or meiotic arrest) with reduced expression of meiotic genes.
    supporting_text: Thus, we conclude that FOXJ3 is required for the survival of spermatogonia
      and participates in spermatocyte meiosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. Mouse conditional knockouts; source of the mouse IMP
      rows for spermatogenesis and male meiosis I that Ensembl Compara transfers to donkey.
- id: PMID:22740631
  title: Live-cell monitoring of periodic gene expression in synchronous human cells identifies
    Forkhead genes involved in cell cycle control.
  findings:
  - statement: Human FOXJ3 knockdown abolishes cell-cycle oscillation of forkhead-site and
      PLK1 promoter reporters and slows proliferation.
    supporting_text: Knockdown of FOXJ3 and FOXK1 eliminated cell cycle-dependent oscillations
      and resulted in decreased cell proliferation rates.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Human U2OS siRNA study; source of the human IDA activator
      annotation.
- id: PMID:23332764
  title: DNA-binding specificities of human transcription factors.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Abstract-only HT-SELEX survey; the abstract does not name FOXJ3. Source of
      the human IDA for sequence-specific DNA binding; not quoted as support here.
- id: PMID:28473536
  title: Impact of cytosine methylation on DNA binding specificities of human transcription
    factors.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Methyl-SELEX survey; the cached text does not mention FOXJ3 by name (probably
      in supplementary data). Source of the human IDA for GO:1990837; not quoted as support.
- id: PMID:41803108
  title: Epilepsy-associated FOXJ3 variants link a transcriptional program of the PTEN-mTOR
    pathway to neuronal specification and cortical lamination.
  findings:
  - statement: FOXJ3 is nuclear in mouse cortical cells and binds target loci including Pten;
      knockdown disrupts cortical lamination.
    supporting_text: Both WT and N351S FOXJ3 proteins were predominantly localized to the nucleus,
      indicating that the N351S substitution does not affect nuclear targeting.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Mouse in utero knockdown plus human patient variants. Used
      for nucleus; the cortical phenotypes are not transferred.
- id: PMID:37939221
  title: Foxj3 Regulates Thermogenesis of Brown and Beige Fat Via Induction of PGC-1α.
  findings:
  - statement: In mouse adipocytes Foxj3 induces PGC-1alpha and UCP1 expression and is required
      for brown-fat thermogenesis.
    supporting_text: cold-inducible Foxj3 stimulated the expression of PGC-1α and UCP1
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Mouse adipose knockout and overexpression; supports activator
      mode of action; the thermogenesis phenotype is not transferred.
- id: PMID:40522413
  title: Foxj3 represses TGF-β signals-responsive transcriptions in Xenopus early development.
  findings:
  - statement: Xenopus Foxj3 represses Activin/Nodal- and BMP-responsive transcription.
    supporting_text: Overexpression of Foxj3 was found to repress the gene responses activated
      by Activin/Nodal or BMP4 signals.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; Xenopus overexpression and morpholino work. Used only to show
      that FOXJ3 can also repress transcription; morphant phenotypes not used.
- id: PMID:15366017
  title: FoxJ3, a novel mammalian forkhead gene expressed in neuroectoderm, neural crest, and
    myotome.
  findings:
  - statement: Mouse Foxj3 encodes a 623-aa forkhead protein most closely related to FoxJ2.
    supporting_text: It is most closely related to FoxJ2 and has been assigned the name FoxJ3.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; embryonic expression pattern and gene structure in mouse.
