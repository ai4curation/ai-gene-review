- term:
    id: GO:0007141
    label: male meiosis I
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8BUR3
  - ensembl:ENSMUSP00000035746
  review:
    summary: Ensembl Compara transfer of a mouse IMP (PMID:27739607). Stra8-Cre deletion of
      Foxj3 causes meiotic arrest with reduced mRNA of meiotic recombination genes.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse data show that FOXJ3 is needed for transcription of meiotic genes
      (Rad51, Dmc1, Hormad1 and others), which places it upstream of meiosis as a
      transcriptional regulator; the recombination and division steps are carried out by its
      targets. The cached abstract does not resolve the arrest to meiosis I specifically.
      PAINT propagated the FOXJ2/FOXJ3 DNA-binding and transcription terms but not this
      mouse process term, which is read here as a deliberate decision. For donkey this is a
      one-step inference from a mouse knockout phenotype, with no donkey data. The mouse
      annotation itself is not challenged.
    supported_by:
    - reference_id: PMID:27739607
      supporting_text: Indeed, the mRNA abundance of meiotic arrest-related proteins (Rad51,
        Dmc1, Brca1, Brca2, Brit1, Eif4g3, Hop2, Hormad1, and Rnf212) was significantly reduced
        in Foxj3flox/flox , Stra8-Cre spermatocytes.
