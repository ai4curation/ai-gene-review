suggested_questions:
- question: Is FOXJ3 expressed in donkey spermatogonia and spermatocytes as in mouse, and do
    its germ-cell targets include the same meiotic recombination genes?
- question: Which FOXJ3 target genes are bound directly in mammalian germ cells, as opposed
    to secondarily dysregulated after germ-cell loss?
suggested_experiments:
- description: Immunostaining of donkey testis sections for FOXJ3, and CUT&RUN for FOXJ3 in
    isolated donkey or horse spermatocytes to test binding at Dmc1, Rad51 and Hormad1 regulatory
    regions.
- description: EMSA or reporter assays with recombinant donkey FOXJ3 fork-head domain on the
    Mef2c forkhead binding site, to confirm conserved DNA-binding specificity.
