  review:
    summary: Ensembl Compara transfer of a mouse IMP. Germ-cell deletion of Foxj3 in mouse
      causes complete male sterility, and FOXJ3 is highly expressed in spermatogonia and
      spermatocytes.
    action: KEEP_AS_NON_CORE
