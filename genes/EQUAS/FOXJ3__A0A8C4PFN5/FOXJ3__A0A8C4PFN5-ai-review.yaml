gene_symbol: FOXJ3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: >-
  FOXJ3 (forkhead box J3) is a nuclear forkhead/winged-helix transcription factor of the
  FOXJ2/FOXJ3 subfamily. The donkey protein (623 aa, predicted from the genome) is the
  one-to-one ortholog of mouse and human FOXJ3 (PANTHER PTHR46078:SF3), 95% and 98%
  identical to them, with a fork-head DNA-binding domain (residues 78-173) that differs
  from each at a single position, followed by long disordered regions. By orthology it is
  a sequence-specific DNA-binding transcription factor that binds forkhead sites in RNA
  polymerase II cis-regulatory regions. In mouse it activates Mef2c through a conserved
  forkhead site in the muscle enhancer, is required for type I slow-twitch fibre identity
  and muscle regeneration, and is needed in male germ cells for spermatogonial survival
  and for expression of meiotic recombination genes, so that germ-cell deletion causes
  male sterility. Further mammalian studies link it to cell-cycle-regulated transcription,
  brown-fat thermogenic gene expression and cortical neuron specification. In Xenopus it
  can also repress transcription. None of these functions has been tested in donkey.
