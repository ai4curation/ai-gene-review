suggested_questions:
- question: Is the PtdIns 5-kinase activity of PIKFYVE direct on PtdIns in cells, or is much of the cellular PtdIns5P pool
    produced by 3-dephosphorylation of PIKFYVE-made PtdIns(3,5)P2 by myotubularins?
- question: Should the cell-type-specific processes placed on the mammalian PIKfyve PAINT node (neutrophil chemotaxis, regulation
    of ROS biosynthesis, melanosome organization, phagosome-lysosome fusion) remain there, given that they rest on inhibitor
    or conditional-knockout necessity evidence?
suggested_experiments:
- description: Express donkey PIKFYVE and the K1887E mutant with VAC14 and FIG4 and measure PtdIns3P 5-kinase and PtdIns 5-kinase
    activity in vitro; test whether PIKFYVE inhibition causes endolysosomal vacuolation in donkey cells.
