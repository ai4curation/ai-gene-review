id: A0A8C4L106
gene_symbol: PIKFYVE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: 'PIKFYVE is the phosphoinositide 5-kinase that converts phosphatidylinositol 3-phosphate (PtdIns3P) to phosphatidylinositol
  3,5-bisphosphate (PtdIns(3,5)P2), and phosphatidylinositol to phosphatidylinositol 5-phosphate, on endosomal membranes.
  This donkey entry is the 2108-residue product of the canonical transcript of the PIKFYVE gene, a member of the single PIKfyve
  subfamily (PTHR46715:SF1) shared with human and mouse PIKFYVE. It has an N-terminal PtdIns3P-binding FYVE zinc finger that
  recruits it to early and late endosomes, a DEP domain, a chaperonin-like region and a C-terminal PIPK catalytic domain.
  In mammals PIKFYVE works with the scaffold VAC14 and the PtdIns(3,5)P2 phosphatase FIG4 in one complex, so that synthesis
  and turnover of the lipid are coupled; it also has a serine protein kinase activity, and autophosphorylation represses its
  lipid kinase activity. Through PtdIns(3,5)P2 it controls endolysosome maturation, endosome-to-TGN retrieval and phagosome-lysosome
  fusion, and cell-type-specific processes such as melanosome biogenesis, neutrophil chemotaxis and ROS production, MHC class
  II antigen presentation and STING activation. Donkey PIKFYVE has not been studied experimentally: all of these functions
  are inferred from human and mouse PIKFYVE, with which it shares about 91-93% identity, the catalytic lysine and the FYVE
  zinc-ligand cysteines.'
