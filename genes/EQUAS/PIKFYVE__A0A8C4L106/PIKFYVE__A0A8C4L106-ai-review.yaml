core_functions:
- description: Lipid kinase that phosphorylates PtdIns3P on the 5-position to make PtdIns(3,5)P2 on early and late endosomal
    membranes, as the catalytic subunit of the PIKFYVE-VAC14-FIG4 (PAS) complex; recruited by its FYVE finger binding PtdIns3P.
    Inferred for donkey from human and mouse PIKFYVE (same PANTHER subfamily).
