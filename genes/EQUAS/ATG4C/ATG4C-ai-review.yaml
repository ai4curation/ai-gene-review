  review:
    summary: ATG4 processing and recycling of ATG8 proteins is required for phagophore expansion and autophagosome
      formation.
    action: ACCEPT
    reason: Human ATG4C has IDA support for autophagosome assembly, and ATG8 priming/delipidation by ATG4 proteases
      is a step of autophagosome biogenesis. The donkey protein conserves the catalytic triad and aligns at
      94.98% identity over its full length.
    supported_by:
