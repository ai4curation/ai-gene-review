suggested_questions:
- question: Given its weak priming activity, is ATG4C's physiological role in mammals predominantly delipidation
    and ATG8 recycling, and which ATG8 paralogs does it act on in vivo?
suggested_experiments:
- description: Compare ATG8 lipidation and delipidation kinetics in ATG4B-null versus ATG4B/ATG4C double-null
    cells reconstituted with wild-type or C111S ATG4C, to separate priming from delipidation contributions.
