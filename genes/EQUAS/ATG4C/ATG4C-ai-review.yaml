- term:
    id: GO:0034727
    label: piecemeal microautophagy of the nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN009050878
  review:
    summary: Piecemeal microautophagy of the nucleus is a yeast process at the nucleus-vacuole junction; it
      is not described for mammalian ATG4C.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PAINT node behind this transfer (also carried by human ATG4C as IBA) spans the whole ATG4
      family, and the experimental grounding for the term is yeast Atg4. Piecemeal microautophagy of the nucleus
      is defined at the yeast nucleus-vacuole junction, a structure not described in mammals, and there is
      no ATG4C-specific evidence for it. ATG4C's documented role is general ATG8 processing in macroautophagy,
      so the term over-extends the family node to a mammalian paralog. It is marked over-annotated rather than
      removed because ATG8 processing is the step Atg4 contributes in yeast, and the call rests on the absence
      of a mammalian counterpart rather than on contrary evidence.
    supported_by:
    - reference_id: file:EQUAS/ATG4C/ATG4C-bioinformatics/human_Q96DT6-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes delipidation of PE-conjugated forms of ATG8 proteins during macroautophagy
