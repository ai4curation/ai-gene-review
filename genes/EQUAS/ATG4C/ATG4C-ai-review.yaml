      supporting_text: Cysteine protease that plays a key role in autophagy by mediating both proteolytic activation
        and delipidation of ATG8 family proteins
    - reference_id: PMID:21177865
      supporting_text: The Atg4 cysteine proteases are required for processing Atg8 for the latter to be conjugated
        to phosphatidylethanolamine on autophagosomal membranes, a key step in autophagosome biogenesis.
    - reference_id: file:EQUAS/ATG4C/ATG4C-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A9L0IIU3 (458 residues) aligns to human Q96DT6 (458 residues)
        with 94.98% identity across 458 paired residues.
- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN009050878
  review:
    summary: ATG4 family members drive phagophore growth in PINK1/Parkin mitophagy, but ATG4C is the paralog
      reported as weakly or not involved.
    action: MARK_AS_OVER_ANNOTATED
    reason: The family-level IBA rests on ATG4A/B/D evidence for a protease-independent role in mitophagic
      phagophore growth (PMID:33773106). The same work, as summarized in the human ATG4C record, found ATG4C
      weakly or not involved, so a dedicated mitophagy role is not supported for ATG4C. Its general ATG8 processing
      may still contribute to mitophagy, so the term is marked over-annotated rather than removed.
    supported_by:
    - reference_id: file:EQUAS/ATG4C/ATG4C-bioinformatics/human_Q96DT6-uniprot.txt
      supporting_text: In contrast to other members of the family, weakly or not involved in phagophore growth
        during mitophagy
    - reference_id: PMID:33773106
      supporting_text: We discover that human ATG4s promote autophagosome formation independently of their
        protease activity and of ATG8 family processing.
