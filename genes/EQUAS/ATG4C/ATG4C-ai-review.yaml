id: A0A9L0IIU3
gene_symbol: ATG4C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: ATG4C (autophagy related 4C cysteine peptidase, autophagin-3) is a cytoplasmic papain-like cysteine
  protease of peptidase family C54 that processes ATG8-family ubiquitin-like proteins (LC3s and GABARAPs).
  It can cleave the C-terminal residue of pro-ATG8 to expose the glycine used for phosphatidylethanolamine
  conjugation, although this priming activity is weak compared with ATG4B, and it removes phosphatidylethanolamine
  from membrane-anchored ATG8 proteins (delipidation), an activity in which it is comparable to the other
  ATG4 paralogs. Through these reactions it supports autophagosome formation and recycling of ATG8 proteins
  during macroautophagy. The donkey protein is a full-length ortholog (95% identity to human) with the Cys-Asp-His
  catalytic triad conserved.
