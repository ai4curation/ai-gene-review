- term:
    id: GO:0051697
    label: protein delipidation
  evidence_type: ISS
  original_reference_id: file:EQUAS/ATG4C/ATG4C-bioinformatics/human_Q96DT6-uniprot.txt
  qualifier: involved_in
  review:
    summary: ATG4C itself catalyses the release of phosphatidylethanolamine from lipidated ATG8 proteins, so
      it performs protein delipidation.
    action: NEW
    reason: The donkey GOA set carries the molecular function (protein-phosphatidylethanolamide deconjugating
      activity) but not the process it executes. ATG4C is the enzyme that performs this step, not a substrate
      of it, so the participation test is met. Human ATG4C has experimental support for delipidation of PE-conjugated
      ATG8 proteins in a reconstituted assay, and the donkey protein sits in the same PANTHER subfamily (PTHR22624:SF38,
      ATG4C orthologs), aligns to human over its full length at 95% identity, and conserves the catalytic triad
      and the C-terminal LIR motif needed for recognition of lipidated substrates. Comparator ATG4 paralogs
      (human ATG4D) carry the same process term by direct assay.
    supported_by:
    - reference_id: PMID:29458288
      supporting_text: all 4 ATG4 proteases can be activated to similar enzymatic activities on lipid-attached
        substrates
    - reference_id: file:EQUAS/ATG4C/ATG4C-bioinformatics/human_Q96DT6-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes delipidation of PE-conjugated forms of ATG8 proteins during macroautophagy
    - reference_id: file:EQUAS/ATG4C/ATG4C-bioinformatics/RESULTS.md
      supporting_text: with 94.98% identity across 458 paired residues
