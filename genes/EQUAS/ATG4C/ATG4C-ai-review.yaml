- term:
    id: GO:0034727
    label: piecemeal microautophagy of the nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN009050878
  review:
    summary: Piecemeal microautophagy of the nucleus is a yeast process at the nucleus-vacuole junction; it
      is not described for mammalian ATG4C.
    action: MARK_AS_OVER_ANNOTATED
    reason: The term is inherited from the yeast Atg4 branch of the ATG4 family. Mammals have no nucleus-vacuole
      junction, and no ATG4C-specific evidence exists; ATG4C's role is general ATG8 processing in macroautophagy.
      The term is therefore an over-extension of the family node to mammals.
    supported_by:
    - reference_id: file:EQUAS/ATG4C/ATG4C-bioinformatics/human_Q96DT6-uniprot.txt
      supporting_text: Catalyzes delipidation of PE-conjugated forms of ATG8 proteins during macroautophagy
