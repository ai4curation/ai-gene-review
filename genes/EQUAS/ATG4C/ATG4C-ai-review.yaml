  review:
    summary: ATG4C delipidates PE-conjugated ATG8 proteins.
    action: ACCEPT
    reason: Reconstituted delipidation assays show that all four ATG4 paralogs act efficiently on membrane-anchored
      ATG8 proteins, and human ATG4C displays stronger delipidation than priming activity. This is the best-supported
      molecular function of ATG4C.
