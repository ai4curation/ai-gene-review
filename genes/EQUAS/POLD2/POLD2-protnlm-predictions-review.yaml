id: A0A9L0IND0
gene_symbol: POLD2
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: >-
  Assessment of the 2 ProtNLM2 GO predictions for donkey POLD2 (A0A9L0IND0, DONKEY40 cohort), using
  the reviewed human ortholog P49005, Pol delta/zeta literature, and a full-length donkey-human
  alignment (95.52% identity, complete human coverage). DNA replication is correct but less precise
  than the strand-elongation and DNA-templated replication terms already in donkey GOA (LSP). DNA
  repair is correct and absent from donkey GOA, whose damage-related row (error-prone translesion
  synthesis) is classed under DNA damage tolerance rather than DNA repair (COR). ProtNLM2 emitted no
  function text or subcellular-location statement for this accession in the snapshot.
