predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0006260
    label: DNA replication
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: POLD2 is the essential B subunit of the replicative polymerase delta, and the donkey protein
      is 95.5% identical to human POLD2 across the whole human sequence, so DNA replication is biologically
      correct. The exact term is already in donkey GOA (InterPro2GO), and GOA also carries the more specific
      DNA strand elongation involved in DNA replication (TreeGrafter) and DNA-templated DNA replication
      (Ensembl Compara), both supported. The prediction is therefore less precise than existing annotation.
      The ProtNLM2 evidence record links it to the strand-elongation term. Training-set membership is unknown.
    supported_by:
    - reference_id: PMID:31449058
      supporting_text: The mammalian polymerase δ complex is a heterotetramer consisting of the catalytic
        subunit POLD1 and the accessory subunits POLD2, POLD3, and POLD4
    - reference_id: file:EQUAS/POLD2/POLD2-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A9L0IND0 (487 residues) aligns to human P49005 (469 residues)
        with 95.52% identity among 469 paired residues.
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0006281
    label: DNA repair
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Human Pol delta, with POLD2 as an obligate subunit, performs about half of nucleotide excision
      repair synthesis and break-induced replication at broken forks (experimental evidence in the reviewed
      human record), and the donkey protein is conserved over the full length. DNA repair is absent from
      donkey GOA; the error-prone translesion synthesis row is a DNA damage tolerance process in GO, not a
      DNA repair descendant (QuickGO ancestor check). The prediction is a justified ortholog-based transfer
      that adds coverage to the target record. Novelty refers to target annotation coverage only; training-set
      membership is unknown.
    supported_by:
    - reference_id: file:EQUAS/POLD2/POLD2-bioinformatics/human-P49005-uniprot.txt
      supporting_text: polymerase delta carries out approximately half of nucleotide excision
    - reference_id: PMID:31449058
      supporting_text: Beyond DNA replication, the polymerase δ complex has emerged as a central element
        in the safeguarding of genome integrity by controlling processes such as break-induced replication
    - reference_id: file:EQUAS/POLD2/POLD2-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A9L0IND0 (487 residues) aligns to human P49005 (469 residues)
        with 95.52% identity among 469 paired residues.
