  review:
    summary: InterPro2GO DNA binding from the DNA polymerase alpha/delta/epsilon subunit B family (IPR007185).
      POLD2 is a structural accessory subunit; DNA engagement is by the catalytic subunit and by POLD3/PCNA,
      and the PolD2-PolD3 structure lacks an evident DNA-binding surface.
    action: MARK_AS_OVER_ANNOTATED
    reason: The family-level mapping asserts a direct DNA-binding activity for which there is no POLD2-specific
      evidence; the structural observation argues against a dedicated DNA-binding surface. Same call as
      the human POLD2 review. Not removed because the subunit is part of a DNA-bound holoenzyme.
    supported_by:
