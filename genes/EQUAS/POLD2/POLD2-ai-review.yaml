taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: POLD2 (p50) is the non-catalytic B subunit of DNA polymerase delta, the B-family replicative
  polymerase that synthesizes lagging-strand (and some leading-strand) DNA and performs gap-filling synthesis
  in nucleotide excision repair, base excision repair, mismatch repair and break-induced replication.
  POLD2 bridges the catalytic subunit POLD1 and the PCNA-binding subunit POLD3 and is required for the
  stability of the heterotetrameric holoenzyme. POLD2 and POLD3 are also shared accessory subunits of
  the translesion polymerase zeta (REV3L-REV7-POLD2-POLD3), where they raise the efficiency and processivity
  of lesion bypass and provide a platform for switching between the delta and zeta catalytic subunits.
  POLD2 also binds the Y-family polymerase eta. The protein acts in the nucleoplasm. The donkey protein
  is 95.5% identical to human POLD2 over its full length and carries an 18-residue N-terminal extension.
