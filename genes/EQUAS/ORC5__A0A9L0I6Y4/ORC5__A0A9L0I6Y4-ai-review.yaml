- term:
    id: GO:0006270
    label: DNA replication initiation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001398615
  review:
    summary: >-
      TreeGrafter transfer from the ORC5 family PAINT node. ORC performs origin recognition and
      helicase loading, the first steps of replication initiation, and ORC5 is a structural
      ATP-binding subunit of the motor module that does this work. Human ORC5 ubiquitylation by
      OBI1 is further required for origin firing.
    action: ACCEPT
    reason: >-
      Core process. ORC5 participates directly as a subunit of the initiator complex: it supplies
      an ATP site needed for ORC assembly and a DNA-proximal hairpin, so this is participation
      rather than mere requirement.
    supported_by:
    - reference_id: PMID:32808929
      supporting_text: The Origin Recognition Complex (ORC) is necessary for orchestrating the initiation process by binding to origin DNA, recruiting CDC6, and assembling the MCM replicative helicase on DNA.
    - reference_id: PMID:31160578
      supporting_text: Importantly, expression of non-ubiquitylable ORC3/5 mutants impairs origin firing, demonstrating their relevance as OBI1 substrates for origin firing.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: ISS
  original_reference_id: PMID:28112645
  review:
    summary: >-
      Proposed new annotation. The human ORC1/4/5 motor module crystallised with ATP bound at the
      ORC5 site, engaging the ORC5 Walker A and the non-canonical DKAE Walker B, and mutation of
      the ORC5 ATP-binding site impairs assembly of human ORC. Both motifs are identical in the
      donkey product, which is in the same PANTHER subfamily as human ORC5.
    action: NEW
    reason: >-
      ATP binding is an intrinsic activity of ORC5 itself, needed for complex assembly; the ORC5
      site has little ATPase activity, so no hydrolase term is proposed. The transfer is grounded by
      subfamily membership (PTHR12705:SF0) and full conservation of the binding motifs. This
      remains an inference for donkey; no donkey experiment exists.
    supported_by:
    - reference_id: PMID:28112645
      supporting_text: The third nucleotide binds to Walker-A and -B motifs on ORC5 (Figure 3c), although the Walker-B motif is somewhat different (DKAE, rather than DELD (ORC1) or DEFD (ORC4)).
    - reference_id: PMID:17716973
      supporting_text: Mutations in the ATP-binding sites of Orc4 or Orc5 impair complex assembly, whereas Orc1 ATP binding is not required.
    - reference_id: file:EQUAS/ORC5__A0A9L0I6Y4/ORC5__A0A9L0I6Y4-bioinformatics/RESULTS.md
      supporting_text: 'Walker B (human 125-128, DKAE): human DKAE, target DKAE'
