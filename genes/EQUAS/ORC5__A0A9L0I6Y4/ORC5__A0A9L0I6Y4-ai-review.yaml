- id: PMID:28112645
  title: Structure of the active form of human origin recognition complex and its ATPase
    motor module.
  findings:
  - statement: Human ORC5 is part of the ORC1/4/5 motor module and binds ATP via its Walker A and non-canonical DKAE Walker B motifs.
    supporting_text: The third nucleotide binds to Walker-A and -B motifs on ORC5 (Figure 3c), although the Walker-B motif is somewhat different (DKAE, rather than DELD (ORC1) or DEFD (ORC4)).
  - statement: Mutating the ORC5 Walker B aspartate barely changes ORC ATPase activity, so the ORC5 site is not a major catalytic site.
    supporting_text: ORC5 Walker-B aspartate (D125) as well as ORC3-R98 were mutated in the context of HsORC1-5, and both are only slightly reduced for ATPase activity compared with wild-type activity (Figure 3d).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human ORC crystal and cryoEM structures; cached full text checked for the ORC5 ATP-site statements.
- id: PMID:32808929
  title: The dynamic nature of the human origin recognition complex revealed through
    five cryoEM structures.
  findings:
  - statement: The ORC5 beta-hairpin histidine H398 lies close to DNA in human ORC.
    supporting_text: The β-hairpin loop in ORC5 of HsORC also consists of a positively-charged residue H398 in close proximity to DNA (Figure 4a,f).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human ORC cryoEM structures including a DNA-bound form; cached full text.
- id: PMID:17716973
  title: ATP-dependent assembly of the human origin recognition complex.
  findings:
  - statement: ATP binding by ORC5 (and ORC4) is required for assembly of human ORC in vitro.
    supporting_text: Mutations in the ATP-binding sites of Orc4 or Orc5 impair complex assembly, whereas Orc1 ATP binding is not required.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache; the quoted sentence is in the abstract.
- id: PMID:31160578
  title: The ORC ubiquitin ligase OBI1 promotes DNA replication origin firing.
  findings:
  - statement: Chromatin-bound human ORC5 is mono-ubiquitylated by OBI1 in S phase, and non-ubiquitylable ORC5 impairs origin firing.
    supporting_text: Importantly, expression of non-ubiquitylable ORC3/5 mutants impairs origin firing, demonstrating their relevance as OBI1 substrates for origin firing.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human study; supports chromatin association and a regulatory role of ORC5 modification in origin firing.
- id: PMID:9829972
  title: The Orc4p and Orc5p subunits of the Xenopus and human origin recognition complex
    are related to Orc1p and Cdc6p.
  findings:
  - statement: Identification of vertebrate Orc5 as an ORC subunit and cloning of human ORC5, related to Orc1 and Cdc6.
    supporting_text: Human ORC5 was also cloned; its sequence displayed extensive homology to both Drosophila and yeast ORC5.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in the cache; background on vertebrate ORC5 identity.
