core_functions:
- description: >-
    Structural AAA+ subunit of the nuclear origin recognition complex. Within the ORC1/4/5 motor
    module it contributes to the complex's ATP-dependent binding of replication origins, including
    through a DNA-proximal beta-hairpin, and so to origin licensing at the start of DNA
    replication. Inferred from human ORC5 (same PANTHER subfamily); not tested in donkey.
  contributes_to_molecular_function:
    id: GO:0003688
    label: DNA replication origin binding
  directly_involved_in:
  - id: GO:0006270
    label: DNA replication initiation
  in_complex:
    id: GO:0005664
    label: nuclear origin of replication recognition complex
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:32808929
    supporting_text: The β-hairpin loop in ORC5 of HsORC also consists of a positively-charged residue H398 in close proximity to DNA (Figure 4a,f).
  - reference_id: PMID:28112645
    supporting_text: Binding of the Origin Recognition Complex (ORC) to origins of replication marks the first step in the initiation of replication of the genome in all eukaryotic cells.
  - reference_id: file:EQUAS/ORC5__A0A9L0I6Y4/ORC5__A0A9L0I6Y4-bioinformatics/RESULTS.md
    supporting_text: 'PANTHER human: PTHR12705, PTHR12705:SF0'
- description: >-
    Non-catalytic ATP binding at the ORC5 Walker A/DKAE Walker B site, which in human ORC is
    required for assembly of the complex. Inferred from human ORC5; motifs conserved in donkey.
  molecular_function:
    id: GO:0005524
    label: ATP binding
  in_complex:
    id: GO:0005664
    label: nuclear origin of replication recognition complex
  supported_by:
  - reference_id: PMID:28112645
    supporting_text: The third nucleotide binds to Walker-A and -B motifs on ORC5 (Figure 3c), although the Walker-B motif is somewhat different (DKAE, rather than DELD (ORC1) or DEFD (ORC4)).
  - reference_id: PMID:17716973
    supporting_text: Mutations in the ATP-binding sites of Orc4 or Orc5 impair complex assembly, whereas Orc1 ATP binding is not required.
  - reference_id: file:EQUAS/ORC5__A0A9L0I6Y4/ORC5__A0A9L0I6Y4-bioinformatics/RESULTS.md
    supporting_text: 'Walker A (human 37-44): human GHTASGKT, target GHTASGKT'
suggested_questions:
- question: >-
    Which of the many donkey ORC5 gene models (ENSEASG00005017348) are expressed as protein, and do
    the products with non-canonical C-termini assemble into ORC?
- question: >-
    Are the OBI1 ubiquitylation sites of human ORC5 conserved in equids, and is ORC5 ubiquitylation a
    conserved mammalian mechanism of origin selection?
suggested_experiments:
- description: >-
    Reconstitute donkey ORC1-5 with wild-type or Walker A mutant ORC5 and test complex assembly and
    ATP-dependent origin DNA binding, to confirm that the human ATP-dependent assembly requirement
    holds for the donkey complex.
