  supporting_entities:
  - InterPro:IPR020796
  review:
    summary: >-
      InterPro2GO mapping from the ORC5 family signature (IPR020796) to origin recognition complex.
      Correct: human ORC5 is an established subunit of ORC, and the donkey product is a full-length
      member of the same family and subfamily.
    action: MODIFY
    reason: >-
      The term is correct but less specific than is warranted. ORC5 acts in the nuclear origin
      recognition complex (GO:0005664, an is_a child of GO:0000808), which this gene already carries
      from the TreeGrafter transfer. Replace with GO:0005664.
    proposed_replacement_terms:
    - id: GO:0005664
      label: nuclear origin of replication recognition complex
    supported_by:
    - reference_id: PMID:28112645
      supporting_text: This structure contains truncated versions of ORC1, ORC2, and ORC3, full-length ORC4 and ORC5, and a small fragment of ORC6.
    - reference_id: file:EQUAS/ORC5__A0A9L0I6Y4/ORC5__A0A9L0I6Y4-bioinformatics/RESULTS.md
      supporting_text: 'identical residues: 417/435 paired (95.86%); human coverage 100.00%'
- term:
    id: GO:0003688
    label: DNA replication origin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001398615
  review:
    summary: >-
      TreeGrafter transfer from PANTHER node PTN001398615 (PTHR12705), the node at which PAINT
      curators placed origin binding for the ORC5 family. Origin binding is an activity of the ORC
      complex: ATP-dependent DNA binding by ORC uses DNA-contacting elements from several subunits,
      including the ORC5 beta-hairpin, whose positively charged H398 lies close to DNA in the human
      cryoEM structure. The donkey product retains H398 and is in the same subfamily as human ORC5.
    action: ACCEPT
    reason: >-
      The phylogenetic placement is sound: the donkey product is in PTHR12705:SF0, the family's only
      subfamily, alongside human ORC5, and there is no sign of divergence at the DNA-proximal
      hairpin. ORC5 contributes to, rather than independently performs, origin binding by the
      complex; the core function records this with contributes_to. Accept as the core molecular
      function of the complex in which ORC5 participates.
    supported_by:
    - reference_id: PMID:32808929
      supporting_text: The β-hairpin loop in ORC5 of HsORC also consists of a positively-charged residue H398 in close proximity to DNA (Figure 4a,f).
    - reference_id: PMID:32808929
      supporting_text: The Origin Recognition Complex (ORC) is necessary for orchestrating the initiation process by binding to origin DNA, recruiting CDC6, and assembling the MCM replicative helicase on DNA.
    - reference_id: file:EQUAS/ORC5__A0A9L0I6Y4/ORC5__A0A9L0I6Y4-bioinformatics/RESULTS.md
      supporting_text: 'beta-hairpin H398: human H, target H'
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR020796
  - UniProtKB-SubCell:SL-0191
  review:
    summary: >-
      Combined IEA location from the ORC5 family signature and a UniProt subcellular-location rule.
      ORC acts on chromatin in the nucleus; human ORC5 is localised to the nucleus and chromatin.
    action: ACCEPT
    reason: >-
      Nucleus is the correct compartment for an ORC subunit and is as precise as a cell-level
      location needs to be here; the complex-level location is captured by GO:0005664. Human ORC
      associates with a nuclear structure in a cell cycle-dependent manner, and human ORC5 is
      ubiquitylated while bound to chromatin.
    supported_by:
    - reference_id: PMID:17716973
      supporting_text: Immunofluorescence staining of human cells with anti-Orc3 antibodies demonstrate cell cycle-dependent association with a nuclear structure.
    - reference_id: PMID:31160578
      supporting_text: OBI1 catalyses the multi-mono-ubiquitylation of a subset of chromatin-bound ORC3 and ORC5 during S-phase.
- term:
    id: GO:0005664
    label: nuclear origin of replication recognition complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN001398615
  review:
    summary: >-
      TreeGrafter transfer from the ORC5 family PAINT node. Human ORC5 is a structurally resolved
      subunit of nuclear ORC, located in the ORC1/4/5 motor module, and the donkey product is a
      full-length one-to-one ortholog in the same subfamily.
    action: ACCEPT
    reason: >-
      Core cellular component. The structures of human ORC place ORC5 between ORC4 and ORC3 in the
      complex, and ATP binding by ORC5 is required for assembly of human ORC.
    supported_by:
    - reference_id: PMID:28112645
      supporting_text: The complex is composed of an ORC1/4/5 motor module lobe in an organization reminiscent of the DNA polymerase clamp loader complexes.
    - reference_id: PMID:17716973
      supporting_text: Mutations in the ATP-binding sites of Orc4 or Orc5 impair complex assembly, whereas Orc1 ATP binding is not required.
    - reference_id: file:EQUAS/ORC5__A0A9L0I6Y4/ORC5__A0A9L0I6Y4-bioinformatics/RESULTS.md
      supporting_text: 'PANTHER target: PTHR12705, PTHR12705:SF0'
