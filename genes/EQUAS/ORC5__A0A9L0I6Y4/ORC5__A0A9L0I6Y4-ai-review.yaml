id: A0A9L0I6Y4
gene_symbol: ORC5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: >-
  Donkey ORC5 (origin recognition complex subunit 5; this entry is the 435-residue canonical-length
  product of Ensembl gene ENSEASG00005017348) is a AAA+-family subunit of the six-subunit origin
  recognition complex (ORC1-6), the nuclear initiator that binds replication origins and, with CDC6
  and CDT1, loads the MCM2-7 helicase to license origins for DNA replication. The protein has an
  N-terminal AAA+ RecA-like domain with an intact Walker A P-loop and the non-canonical DKAE
  Walker B motif, an alpha-helical lid, and a C-terminal winged-helix domain. In human ORC, ORC5
  sits in the ORC1/4/5 motor module between ORC4 and ORC3, binds ATP at its own site and at the
  ORC4-ORC5 interface, where ATP binding is required for complex assembly rather than for
  catalysis, and places a beta-hairpin histidine close to origin DNA. Human ORC5 is also
  mono-ubiquitylated on chromatin by OBI1 during S phase to promote origin firing. No donkey ORC5
  has been studied experimentally; all functions here are inferred from human ORC5, a one-to-one
  ortholog in the same PANTHER subfamily (PTHR12705:SF0) that shares 95.9% identity over its full
  length with this product.
