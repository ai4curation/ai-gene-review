id: A0A9L0IK51
gene_symbol: RBM41
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: >-
  Assessment of the single ProtNLM2 GO prediction for donkey RBM41 (A0A9L0IK51), an RRM protein of the
  RBM41/RNPC3 family (PANTHER PTHR16105:SF2, the same subfamily as human RBM41). RNA binding is correct,
  supported by direct RRM-snRNA binding experiments on the human ortholog, but less precise than the U12
  snRNA binding already in donkey GOA and accepted in the gene review (LSP). ProtNLM2 also emitted a
  subcellular location of Nucleus (not scored); this is consistent with the human ortholog's association
  with minor spliceosomal snRNPs and Cajal bodies. No function text was emitted.
source_documents:
- projects/PROTNLM_EVALUATION/donkey40/donkey40-predictions.tsv
- genes/EQUAS/RBM41/RBM41-goa.tsv
