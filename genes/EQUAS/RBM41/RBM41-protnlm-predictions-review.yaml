predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0003723
    label: RNA binding
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      RNA binding is directly supported for the human ortholog, which sits in the same PANTHER subfamily
      (PTHR16105:SF2): the isolated human RBM41 RRM binds the U12 and U6atac snRNA 3' hairpins with
      low-micromolar affinity, and RNP1 point mutations or RRM deletion abolish its snRNA associations in
      cells. The donkey RRM is 78 of 79 residues identical to the human RRM, so the transfer is well
      justified. The exact term is already in donkey GOA, and donkey GOA also carries the more specific
      U12 snRNA binding (TreeGrafter), which the gene review accepts as the core function while marking
      RNA binding as too general. Because a supported, more specific annotation exists, the prediction is
      correct but less precise (LSP).
    supported_by:
    - reference_id: PMID:38499487
      supporting_text: the RBM41 RRM has a low micromolar affinity to both U12 (Kd= 2.14 μM) and U6atac
        hairpins (Kd= 3.78 μM; Figure 2D)
    - reference_id: PMID:38499487
      supporting_text: The Q352A and F354A mutations and deletion of the RRM led to dramatic loss of the
        U12, U4atac and U6atac interactions
    - reference_id: file:EQUAS/RBM41/RBM41-bioinformatics/RESULTS.md
      supporting_text: 'DOMAIN RRM: human [309, 387] KN -> donkey [333, 411] KN; 78 of 79 human residues in
        this span are identical'
    - reference_id: file:EQUAS/RBM41/RBM41-bioinformatics/interpro-IPR045164.md
      supporting_text: It binds to the U11-associated 59K protein via its RRM1 and employs the RRM2 to bind
        hairpin III of the U12 small nuclear RNA (snRNA).
