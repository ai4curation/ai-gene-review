id: A0A9L0IK51
gene_symbol: RBM41
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: >-
  Assessment of the single ProtNLM2 GO prediction for donkey RBM41 (A0A9L0IK51), an RRM protein of the
  RBM41/RNPC3 family. RNA binding is correct but less precise than the U12 snRNA binding already in donkey
  GOA (LSP). ProtNLM2 also emitted a subcellular location of Nucleus (not scored); this is consistent with a
  spliceosomal RRM protein but is not directly established for RBM41 in the sources consulted. No function
  text was emitted.
source_documents:
- projects/PROTNLM_EVALUATION/donkey40/donkey40-predictions.tsv
- genes/EQUAS/RBM41/RBM41-goa.tsv
- genes/EQUAS/RBM41/RBM41-bioinformatics/human-Q96IZ5-uniprot.txt
- genes/EQUAS/RBM41/RBM41-bioinformatics/interpro-IPR045164.md
- genes/EQUAS/RBM41/RBM41-bioinformatics/RESULTS.md
predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0003723
    label: RNA binding
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      The donkey protein carries a single RRM that is 78/79 identical to the human RBM41 RRM, and RRM
      proteins of the RBM41/RNPC3 family bind RNA; the paralog RNPC3 uses its RRM2 to bind U12 snRNA hairpin
      III. RNA binding is therefore well supported. The exact term is already present in donkey GOA, but
      donkey GOA also carries the more specific U12 snRNA binding (TreeGrafter, from the PANTHER family
      node), which this review accepts as a phylogenetic inference. Because a supported, more specific
      annotation exists, the prediction is classified as less precise rather than CNN.
    supported_by:
    - reference_id: file:EQUAS/RBM41/RBM41-bioinformatics/RESULTS.md
      supporting_text: 'DOMAIN RRM: human [309, 387] KN -> donkey [333, 411] KN; 78 of 79 human residues in
        this span are identical'
    - reference_id: file:EQUAS/RBM41/RBM41-bioinformatics/interpro-IPR045164.md
      supporting_text: It binds to the U11-associated 59K protein via its RRM1 and employs the RRM2 to bind
        hairpin III of the U12 small nuclear RNA (snRNA).
    - reference_id: file:EQUAS/RBM41/RBM41-bioinformatics/human-Q96IZ5-uniprot.txt
      supporting_text: 'FUNCTION: May bind RNA.'
