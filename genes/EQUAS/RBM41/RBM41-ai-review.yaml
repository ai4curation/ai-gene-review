gene_symbol: RBM41
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: RBM41 is a nuclear RNA-binding protein with a single C-terminal RNA recognition motif (RRM).
  It belongs to the RBM41/RNPC3 family; its paralog RNPC3 (U11/U12-65K) bridges the U11 and U12 snRNPs
  of the minor (U12-type) spliceosome and uses its second RRM to bind hairpin III of U12 snRNA. RBM41's
  RRM is homologous to that U12-snRNA-binding RRM, and phylogenetic inference places RBM41 in the U12-type
  spliceosome as a U12 snRNA-binding protein acting in minor-class intron splicing, although direct biochemical
  characterization of RBM41 is limited. The donkey protein (432 aa) is 95.8% identical to human RBM41
  over paired residues, with the RRM 78/79 identical.
