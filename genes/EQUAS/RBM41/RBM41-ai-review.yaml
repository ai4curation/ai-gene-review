suggested_questions:
- question: Does RBM41 contact intronic pre-mRNA directly in post-splicing complexes, or does its lariat
    association go entirely through U12 snRNA and DHX8? The answer decides whether the inherited pre-mRNA
    intronic binding term holds for the RBM41 branch.
- question: At what step is U11/U12-65K exchanged for RBM41 on the U12 snRNA 3' stem-loop, and does RBM41
    recruit or activate DHX8 to release spliced mRNA from minor spliceosomes?
suggested_experiments:
- description: Crosslinking immunoprecipitation (CLIP/eCLIP) of RBM41 to map its direct RNA contacts on
    U12 and U6atac snRNAs and on U12-type intron lariats.
- description: In vitro minor-spliceosome disassembly assays with RBM41-depleted extracts, with or without
    recombinant RBM41 or an RBM41 N-terminal mutant that cannot bind DHX8, to test whether RBM41 is needed
    for mRNA release or lariat-intron complex disassembly.
