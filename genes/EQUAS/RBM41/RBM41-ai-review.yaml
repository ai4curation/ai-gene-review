core_functions:
- description: RRM-containing protein of the minor (U12-type) spliceosome. Its C-terminal RRM binds the
    3'-terminal stem-loop of U12 snRNA, and it associates with the U12 mono-snRNP and post-splicing complexes
    containing excised U12-type intron lariats and DHX8. It is concentrated in Cajal bodies and acts in
    the post-catalytic phase of U12-type intron splicing.
  molecular_function:
    id: GO:0030626
    label: U12 snRNA binding
  directly_involved_in:
  - id: GO:0000398
    label: mRNA splicing, via spliceosome
  locations:
