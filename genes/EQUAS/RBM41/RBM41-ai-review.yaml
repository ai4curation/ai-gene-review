    label: Cajal body
  in_complex:
    id: GO:0005689
    label: U12-type spliceosomal complex
  supported_by:
  - reference_id: PMID:38499487
    supporting_text: the RBM41 RRM has a low micromolar affinity to both U12 (Kd= 2.14 μM) and U6atac hairpins
      (Kd= 3.78 μM; Figure 2D)
  - reference_id: PMID:38499487
    supporting_text: providing evidence that RBM41 functions in post-splicing steps of the minor spliceosome
      assembly/disassembly cycle
