  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN009029508
  review:
    summary: mRNA splicing, via spliceosome (TreeGrafter, PANTHER RBM41/RNPC3 family node).
    action: ACCEPT
    reason: The PANTHER node behind this TreeGrafter transfer covers the RBM41/RNPC3 family, whose characterized
      member RNPC3 is an integral U11/U12 di-snRNP protein of the minor spliceosome. RBM41's single RRM
      is homologous to the RNPC3 RRM that binds U12 snRNA, so participation in (minor-class) spliceosomal
      splicing is the expected inherited role. Human RBM41 carries the same IBA. Direct experimental data
      for RBM41 were not available in the sources consulted, so this rests on phylogenetic inference.
    supported_by:
    - reference_id: file:EQUAS/RBM41/RBM41-bioinformatics/interpro-IPR045164.md
      supporting_text: It binds to the U11-associated 59K protein via its RRM1 and employs the RRM2 to
        bind hairpin III of the U12 small nuclear RNA (snRNA).
    - reference_id: file:EQUAS/RBM41/RBM41-bioinformatics/interpro-IPR045164.md
      supporting_text: RNPC3 serves as a bridging factor between the U11 and U12 snRNPs.
