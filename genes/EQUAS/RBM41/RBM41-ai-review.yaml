    reason: Donkey RBM41 is classified in PANTHER subfamily PTHR16105:SF2 (RNA-BINDING PROTEIN 41), the
      same subfamily as human RBM41 (Q96IZ5), so the human experimental data transfer to it as an ortholog.
      The PAINT family node behind this term is seeded by the 65K paralogs (RNPC3, Arabidopsis SNRNP65,
      fly and fish orthologs), and the term holds for the RBM41 branch on its own evidence. Human RBM41
      is a specific component of the minor spliceosome, binds U12 snRNA through its RRM, co-precipitates
      excised U12-type intron lariats and DHX8, and its knockout alters 3' splice site usage at U12-type
      introns. The protein therefore does part of the work of spliceosomal splicing, in the post-catalytic
