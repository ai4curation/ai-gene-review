  title: Distinct functions for the paralogous RBM41 and U11/U12-65K proteins in the minor spliceosome.
  findings:
  - statement: The human RBM41 RRM binds the 3'-terminal stem-loops of U12 and U6atac snRNAs in vitro,
      with about 2-fold weaker affinity than the U11/U12-65K C-terminal RRM.
    supporting_text: the RBM41 RRM has a low micromolar affinity to both U12 (Kd= 2.14 μM) and U6atac
      hairpins (Kd= 3.78 μM; Figure 2D)
  - statement: RBM41 partitions into the U12 mono-snRNP, separately from 65K in the U11/U12 di-snRNP.
    supporting_text: RBM41 peak co-migrated with the U12 mono-snRNP
  - statement: RBM41 associates with excised U12-type intron lariats and, through its N-terminal region,
      with DHX8.
    supporting_text: RBM41 preferentially co-immunoprecipitated U12-type but not U2-type intron lariats
  - statement: Endogenous RBM41 localizes to Cajal bodies.
    supporting_text: we found that endogenous RBM41 localizes to Cajal bodies, as shown by colocalization
      with coilin-GFP in HEK293 cells
  - statement: RBM41 knockout HEK293 cells are viable but show altered 3' splice site usage at a subset
      of U12-type introns.
    supporting_text: suggesting that the loss of RBM41 has a weak, but nevertheless statistically significant
      effect on the splicing of a subset of U12-type introns
  - statement: Phylogenetic profiling links RBM41 to minor spliceosome components across eukaryotes.
    supporting_text: three minor spliceosome-specific proteins, CENATAC, U11-48K (SNRP48) and U11/U12-31K
      (ZCRB1) were found among the proteins showing the strongest co-occurrence with RBM41
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached from PMC (PMC11039992); PMID resolved through Europe PMC. This is the
      only primary functional study of RBM41, done on the human protein, which is in the same PANTHER
      subfamily (PTHR16105:SF2) as the donkey protein.
