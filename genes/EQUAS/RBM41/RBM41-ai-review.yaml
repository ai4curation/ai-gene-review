suggested_questions:
- question: Does RBM41 bind the same U12 snRNA 3' stem-loop as RNPC3 RRM2, and is it in the same or a
    different minor spliceosome complex than RNPC3?
suggested_experiments:
- description: RNA immunoprecipitation or CLIP of RBM41 to determine whether it binds U12 snRNA (and which
    region), and co-sedimentation with U11/U12 di-snRNP versus later minor spliceosome complexes.
