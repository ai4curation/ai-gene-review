gene_symbol: RBM41
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: RBM41 (RNA-binding motif protein 41) is an X-linked nuclear RNA-binding protein of the
  minor (U12-type) spliceosome, with a conserved, largely helical N-terminal region that lacks annotated
  domains and a single C-terminal RNA recognition motif (RRM). It is the paralog of U11/U12-65K (RNPC3)
  within the RBM41/RNPC3 family, and its RRM is homologous to the 65K C-terminal RRM. In human cells, the
  ortholog's RRM binds the 3'-terminal stem-loops of U12 and U6atac snRNAs, and the protein associates
  with the U12 mono-snRNP rather than the U11/U12 di-snRNP. It also associates with excised U12-type intron
  lariats and, through its N-terminal region, with the DEAH-box helicase DHX8, and it concentrates in Cajal
  bodies. These findings place RBM41 in the post-splicing steps of the minor spliceosome
  assembly/disassembly cycle, where it is thought to replace 65K on the U12 snRNA 3' stem-loop. Loss of
  RBM41 is tolerated by cultured cells but shifts 3' splice site choice at a subset of U12-type introns.
  The donkey protein (432 aa) is a full-length ortholog, 95.8% identical to human RBM41 over paired residues,
  with a 24-residue insertion in the N-terminal region and an RRM that is 78 of 79 residues identical.
