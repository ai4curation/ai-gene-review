suggested_questions:
- question: Does mammalian SEC23A stimulate SAR1A and SAR1B GTP hydrolysis with the same efficiency as
    its paralog SEC23B, and is the arginine aligned to the yeast Sec23 arginine finger required for that
    activity in the mammalian protein?
suggested_experiments:
- description: Purify recombinant donkey SEC23A-SEC24 and measure stimulation of SAR1 GTP hydrolysis in
    the presence and absence of SEC13-SEC31, with an alanine substitution of the conserved arginine (donkey
    R716) as a control, to confirm the inferred GAP activity directly in this species.
