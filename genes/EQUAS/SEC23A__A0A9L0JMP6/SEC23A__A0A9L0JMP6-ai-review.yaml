id: A0A9L0JMP6
gene_symbol: SEC23A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: SEC23A is a subunit of the inner layer of the coat protein complex II (COPII), which forms
  transport vesicles and tubular carriers at endoplasmic reticulum (ER) exit sites to export secretory
  and membrane cargo to the Golgi. A SEC23-SEC24 heterodimer is recruited from the cytosol to the cytoplasmic
  face of the ER membrane by GTP-bound SAR1; SEC23 is the GTPase-activating protein for SAR1, inserting
  an arginine into the SAR1 active site. The SEC23/24 complex binds cargo such as the SNARE SEC22B, and
  SEC23 recruits the SEC13-SEC31 outer coat that polymerises the coat and drives carrier budding. SEC23A
  has a zinc finger, trunk, beta-sandwich, helical and gelsolin-like domain; the gelsolin-like domain binds
  PPP motifs in the large-cargo receptors MIA3 (TANGO1) and MIA2 (cTAGE5) and in SEC31, supporting export
  of bulky cargo such as procollagen. Loss of SEC23A function in human causes cranio-lenticulo-sutural
  dysplasia with ER distension and defective collagen secretion. A0A9L0JMP6 is the canonical 765-residue
  product of the donkey SEC23A gene; it is 99% identical to human and mouse SEC23A and retains all characterised
  functional residues. No experiments have been reported on the donkey protein, so its functions are inferred
  from orthologs in the same PANTHER subfamily (PTHR11141:SF7) and from the conserved SEC23 family.
