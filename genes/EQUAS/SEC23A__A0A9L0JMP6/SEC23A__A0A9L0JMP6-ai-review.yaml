    cargo and large-cargo receptors with SEC24, recruits the SEC13-SEC31 outer coat and drives COPII carrier
    budding for ER-to-Golgi transport. Inferred for the donkey protein from human/mouse SEC23A (same PANTHER
    subfamily SF7) and yeast Sec23; not tested in donkey.
