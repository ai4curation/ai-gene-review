suggested_questions:
- question: Does donkey FOXJ3 show the testis and skeletal-muscle roles described for mouse Foxj3, and
    should positive regulation of transcription by RNA polymerase II be propagated to non-model mammals
    from the human IDA evidence?
- question: Is the 43-residue internal segment missing from this donkey model (human 211-253) a conserved
    alternative exon, and does it affect transactivation?
