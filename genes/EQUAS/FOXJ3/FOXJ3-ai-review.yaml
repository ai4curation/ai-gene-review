- id: PMID:19914232
  title: Foxj3 transcriptionally activates Mef2c and regulates adult skeletal muscle fiber type identity.
  findings:
  - statement: Mouse Foxj3 binds a conserved forkhead binding site in the Mef2c skeletal-muscle enhancer
      and activates it dose-dependently; the C-terminal region beyond residue 176 carries transactivation
      activity; Foxj3 mutant mice have fewer type I myofibers and impaired regeneration.
    supporting_text: Foxj3 transcriptionally activates the Mef2c gene in a dose dependent fashion and
      binds to the conserved FBS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Primary molecular evidence for the FOXJ3 subfamily (mouse Q8BUR3,
      PTHR46078:SF3, same subfamily as this donkey protein); ChIP, promoter mutagenesis and Gal4 assays.
- id: PMID:27739607
  title: 'Multiple roles of FOXJ3 in spermatogenesis: A lesson from Foxj3 conditional knockout mouse models.'
  findings:
  - statement: Germ-cell conditional deletion of mouse Foxj3 causes loss of spermatogonia or meiotic arrest,
      with reduced mRNA of meiotic genes.
    supporting_text: we conclude that FOXJ3 is required for the survival of spermatogonia and participates
      in spermatocyte meiosis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Knockout necessity data in mouse; used for description context, not as
      grounds for a process annotation on the donkey isoform.
- id: PMID:15366017
  title: FoxJ3, a novel mammalian forkhead gene expressed in neuroectoderm, neural crest, and myotome.
  findings:
  - statement: Mouse Foxj3 is a 13-exon gene encoding a 623-aa protein most closely related to FoxJ2.
    supporting_text: It is most closely related to FoxJ2 and has been assigned the name FoxJ3.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. Expression pattern and gene structure; establishes the 623-aa full-length
      product length in mouse.
- id: PMID:37939221
  title: Foxj3 Regulates Thermogenesis of Brown and Beige Fat Via Induction of PGC-1α.
  findings:
  - statement: Adipose-specific Foxj3 deletion impairs brown-fat thermogenesis; Foxj3 induces PGC-1alpha
      and UCP1 expression.
    supporting_text: cold-inducible Foxj3 stimulated the expression of PGC-1α and UCP1
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. Mouse tissue-level knockout phenotype; context only.
- id: PMID:41803108
  title: Epilepsy-associated FOXJ3 variants link a transcriptional program of the PTEN-mTOR pathway to
    neuronal specification and cortical lamination.
  findings:
  - statement: FOXJ3 ChIP-seq identifies Pten as a target in developing mouse cortex; human FOXJ3 variants
      associate with focal epilepsy and focal cortical dysplasia.
    supporting_text: ChIP-seq and scRNA-seq analyses identify Pten as a key FOXJ3 target.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Supports a sequence-specific transcription factor role in mammalian
      cortex; knockdown phenotypes are not used as process annotations.
- id: PMID:40522413
  title: Foxj3 represses TGF-β signals-responsive transcriptions in Xenopus early development.
  findings:
  - statement: Xenopus Foxj3 represses Activin/Nodal- and BMP-responsive transcription.
    supporting_text: Foxj3 was found to regulate negatively the transcription of target genes induced
      by Activin/Nodal or BMP signal in Xenopus embryos
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Morpholino and overexpression study in Xenopus; used only to argue that
      the sign of regulation varies by context, not as evidence for a process annotation.
