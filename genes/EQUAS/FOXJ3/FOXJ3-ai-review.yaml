suggested_questions:
- question: Is the donkey FOXJ3 transcript lacking full-length residues 211-253 (A0A9L0JKH1) expressed,
    and does the missing segment, which lies in the C-terminal region that carries transactivation activity
    in mouse Foxj3, alter activation of targets such as MEF2C?
- question: Should the human IDA DNA-binding transcription activator activity be propagated across the
    FOXJ3 subfamily, given the repressor activity reported for Xenopus Foxj3?
- question: Do the muscle fiber-type, spermatogenesis and brown-fat roles shown by mouse Foxj3 knockouts
    hold in equids?
suggested_experiments:
- description: RT-PCR across the exon encoding full-length residues 211-253 in donkey muscle and testis
    to test whether the skipping isoform is expressed, followed by Mef2c-enhancer reporter assays comparing
    the 580- and 623-residue isoforms.
