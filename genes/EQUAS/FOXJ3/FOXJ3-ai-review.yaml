gene_symbol: FOXJ3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: FOXJ3 (forkhead box J3) is a nuclear forkhead (FOX) family transcription factor of the
  FOXJ2/FOXJ3 group. Its winged-helix fork-head domain binds forkhead consensus sites in cis-regulatory
  regions of RNA polymerase II-transcribed genes, and a carboxy-terminal region carries its transcriptional
  activation activity. In mouse, Foxj3 binds a conserved forkhead site in the skeletal muscle enhancer
  of Mef2c and activates it, and loss of Foxj3 reduces slow-twitch (type I) myofibers and impairs muscle
  regeneration; conditional deletion causes male sterility through loss of spermatogonia and meiotic
  arrest of spermatocytes; adipose deletion impairs brown-fat thermogenesis; and in developing cortex
  FOXJ3 regulates Pten and neuronal specification, with heterozygous human variants associated with focal
  epilepsy and focal cortical dysplasia. Xenopus Foxj3 represses Activin/Nodal- and BMP-responsive transcription.
  This donkey entry (580 aa) is an alternative transcript of the FOXJ3 gene; it is identical to the 623-aa
  full-length donkey model except that it lacks a 43-residue internal segment C-terminal to the intact
  fork-head domain.
