taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: FOXJ3 is a forkhead box (FOX) family transcription factor of the FOXJ2/FOXJ3 subfamily. It
  binds forkhead consensus sites in cis-regulatory regions through its winged-helix fork-head domain and
  activates RNA polymerase II transcription in the nucleus. In mouse, Foxj3 activates Mef2c and thereby
  helps specify adult skeletal muscle fiber type and support muscle regeneration, and it is required for
  spermatogonial survival and spermatocyte meiosis. The donkey protein is 98.1% identical to human FOXJ3,
  with an intact fork-head domain; it lacks a 43-residue internal segment of the human protein within
  a disordered region.
