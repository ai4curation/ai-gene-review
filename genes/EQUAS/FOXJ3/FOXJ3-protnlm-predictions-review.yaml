predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0043565
    label: sequence-specific DNA binding
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: The donkey protein carries a complete fork-head winged-helix DNA-binding domain that aligns
      without gaps to human FOXJ3, whose GO record includes experimental sequence-specific DNA binding.
      The prediction is therefore correct. The exact term is already present in donkey GOA (InterPro2GO),
      and donkey GOA also has the more specific RNA polymerase II cis-regulatory region sequence-specific
      DNA binding (TreeGrafter), which the ProtNLM2 evidence record cites. The prediction is less precise
      than existing annotation. Training-set membership is unknown.
    supported_by:
    - reference_id: file:EQUAS/FOXJ3/FOXJ3-bioinformatics/human-Q9UPW0-uniprot.txt
      supporting_text: 'DR   GO; GO:0043565; F:sequence-specific DNA binding; IDA:NTNU_SB.'
    - reference_id: file:EQUAS/FOXJ3/FOXJ3-bioinformatics/RESULTS.md
      supporting_text: The fork-head DNA-binding domain (donkey 78-173) aligns without gaps
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: FOXJ3 is a forkhead transcription factor; the mouse ortholog activates Mef2c transcription
      and human FOXJ3 carries experimental RNA polymerase II-specific activator annotation. The donkey
      protein is 98.1% identical to human FOXJ3 with an intact fork-head domain, so the prediction is
      correct. The exact term is in donkey GOA (InterPro2GO) and the more specific DNA-binding transcription
      factor activity, RNA polymerase II-specific is in donkey GOA from TreeGrafter; the prediction is less
      precise than that. Training-set membership is unknown.
    supported_by:
    - reference_id: file:EQUAS/FOXJ3/FOXJ3-bioinformatics/human-Q9UPW0-uniprot.txt
      supporting_text: Transcriptional activator of MEF2C involved in the regulation
    - reference_id: file:EQUAS/FOXJ3/FOXJ3-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A9L0JKH1 (580 residues) aligns to human Q9UPW0 (622 residues)
        with 98.1% identity among 579 paired residues.
