    summary: GPC3 regulates Wnt and hedgehog signaling as a GPI-anchored heparan sulfate proteoglycan at the
      cell surface; human GPC3 stimulates canonical Wnt signaling by binding Frizzled through its heparan sulfate
      chains. That activity needs entry into the secretory pathway, where the GPI anchor and heparan sulfate
      chains are added. A0A9L0J2B1 is an alternative-first-exon gene model whose first 43 residues are not
      homologous to the human N-terminus and do not contain the human signal peptide (P51654 SIGNAL 1..24);
      the UniProt entry has no signal peptide feature. Without a signal peptide this product cannot be GPI-anchored,
      glycanated or displayed at the cell surface, so its participation in signal regulation is not supported,
      even though the term is true of the GPC3 gene through its canonical product A0A9L0JGR2. Novelty is moot
      here; donkey GOA already carries this term and the more specific positive regulation of canonical Wnt
      signaling pathway (GO:0090263).
