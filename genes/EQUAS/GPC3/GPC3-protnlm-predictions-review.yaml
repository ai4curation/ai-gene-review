  predicted_term:
    id: GO:0009966
    label: regulation of signal transduction
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: GPC3 regulates Wnt and hedgehog signaling at the cell surface; human GPC3 directly stimulates
      canonical Wnt signaling by binding Frizzled through its heparan sulfate chains, and the donkey protein
      conserves those attachment sites. The predicted term is therefore true. Donkey GOA already contains
      the identical term (InterPro2GO) and, more importantly, the more specific descendant positive regulation
      of canonical Wnt signaling pathway (GO:0090263), which is also the GO term named in the ProtNLM2 evidence
      record. Because a supported, materially more specific annotation exists, the prediction is classed
      as less precise.
    supported_by:
    - reference_id: PMID:24496449
      supporting_text: GPC3 stimulates HCC growth by promoting canonical Wnt signaling.
    - reference_id: file:EQUAS/GPC3/GPC3-bioinformatics/human-GPC3-P51654-uniprot.txt
      supporting_text: Positively regulates the canonical Wnt signaling pathway by binding to
    - reference_id: file:EQUAS/GPC3/GPC3-bioinformatics/RESULTS.md
      supporting_text: the two heparan sulfate attachment serines (human S495, S509)
