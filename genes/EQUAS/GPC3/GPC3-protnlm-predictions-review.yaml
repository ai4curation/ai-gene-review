    summary: GPC3 regulates Wnt and hedgehog signaling as a GPI-anchored heparan sulfate proteoglycan at the
      cell surface; human GPC3 stimulates canonical Wnt signaling by binding Frizzled through its heparan sulfate
      chains. That mechanism needs entry into the secretory pathway, where the GPI anchor and heparan sulfate
      chains are added. A0A9L0J2B1 is an alternative-first-exon gene model whose first 43 residues are not
      homologous to the human N-terminus and lack the human signal peptide (P51654 SIGNAL 1..24). A Kyte-Doolittle
      and von Heijne-style n/h/c-region scan (signal_peptide_hydropathy.py) recovers the signal peptide and its
      cleavage after residue 24 in both human P51654 and the canonical donkey product A0A9L0JGR2, but finds no
      candidate h-region in A0A9L0J2B1; its most hydrophobic 7-residue window has a mean of 1.54, against 3.36
      in the controls, and its longest apolar run is 5 residues. This is evidence against a classical secretory
      signal, so the known cell-surface mechanism is probably unavailable to this product. It is not positive
      refutation of the process term, however. The scan is a rule-based check rather than a trained predictor,
      the transcript itself is unconfirmed, and a contribution to signal regulation by the retained core protein
      through some other route is neither shown nor excluded. The call is therefore uncertain. The term is
      true of the GPC3 gene through its canonical product A0A9L0JGR2; donkey GOA already carries it and the
      more specific positive regulation of canonical Wnt signaling pathway (GO:0090263), so the prediction
      is not novel at the gene level.
