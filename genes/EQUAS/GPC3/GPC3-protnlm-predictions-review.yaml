description: Assessment of the single ProtNLM2 GO prediction for donkey GPC3 entry A0A9L0J2B1, an alternative-first-exon
  gene model of the GPI-anchored heparan sulfate proteoglycan GPC3 that lacks the signal peptide of the canonical
  product (A0A9L0JGR2). The prediction regulation of signal transduction (GO:0009966) is true of the gene. A rule-based
  hydropathy and n/h/c-region analysis finds no classical secretory signal in the alternative N-terminus, so the
  known cell-surface mechanism is unlikely to be available to this product, but the analysis is not a trained predictor
  and other contributions are neither shown nor excluded; the prediction is scored UNC. ProtNLM2 emitted no function
  text or subcellular location for this accession.
