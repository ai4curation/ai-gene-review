id: A0A9L0J2B1
gene_symbol: GPC3
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of the single ProtNLM2 GO prediction for donkey GPC3 (A0A9L0J2B1), a GPI-anchored
  heparan sulfate proteoglycan 93% identical to human GPC3. The prediction regulation of signal transduction
  (GO:0009966) is correct but less precise than the donkey GOA annotation positive regulation of canonical
  Wnt signaling pathway (LSP). ProtNLM2 emitted no function text or subcellular location for this accession.
