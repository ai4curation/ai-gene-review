description: Assessment of the single ProtNLM2 GO prediction for donkey GPC3 entry A0A9L0J2B1, an alternative-first-exon
  gene model of the GPI-anchored heparan sulfate proteoglycan GPC3 that lacks the signal peptide of the canonical
  product (A0A9L0JGR2). The prediction regulation of signal transduction (GO:0009966) is true of the gene but
  depends on cell-surface display that this signal-peptide-less product cannot achieve, so it is scored NPI.
  ProtNLM2 emitted no function text or subcellular location for this accession.
