- term:
    id: GO:0045879
    label: negative regulation of smoothened signaling pathway
  evidence_type: ISS
  original_reference_id: PMID:18477453
  review:
    summary: GPC3 inhibits hedgehog signaling by binding hedgehog with high affinity, competing with Patched
      for it, and inducing its endocytosis and degradation. This is shown for mouse Gpc3, which is in the same
      PANTHER subfamily (PTHR10822:SF4, glypican-3) as donkey and human GPC3.
    action: NEW
    reason: GPC3 itself performs the regulatory step, binding and sequestering the ligand, so this is participation
      and not only necessity. Gpc3-null embryos showing hedgehog hyperactivity add genetic support. PAINT has
      no hedgehog-related IBD in the glypican family, and this is consistent with the function being specific
      to the GPC3 subfamily rather than family-wide. Only the mouse donor's acts-upstream annotations carry
      it, and PAINT did not propagate them at any family node. The transfer here is therefore restricted to
      the direct GPC3 ortholog (same subfamily, 96% identical over the shared core), not inferred from glypicans
      generally. The convertase cleavage site required for this function is conserved in donkey. Human GPC3
      carries the same term by ISS from mouse.
    supported_by:
    - reference_id: PMID:18477453
      supporting_text: GPC3 competes with Patched for Hedgehog binding
    - reference_id: PMID:18477453
      supporting_text: We conclude that GPC3 acts as a negative regulator of Hedgehog signaling during mammalian
        development
    - reference_id: PMID:19590577
      supporting_text: the developmental overgrowth observed in Gpc3-null mice is, at least in part, a consequence
        of the hyperactivation of the Hh pathway
    - reference_id: file:EQUAS/GPC3/GPC3-bioinformatics/human-GPC3-P51654-uniprot.txt
      record_section: ["CC:PTM"]
      supporting_text: This processing is essential for its role in inhibition of hedgehog signaling
    - reference_id: file:EQUAS/GPC3/GPC3-bioinformatics/RESULTS.md
      supporting_text: The furin-like cleavage site (human R358/S359)
