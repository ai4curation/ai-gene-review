      exon. The rest of the protein is 96% identical to human GPC3.
    supporting_text: A0A9L0J2B1 is therefore an alternative-first-exon gene model of donkey GPC3,
      not the canonical product
  - statement: The canonical donkey GPC3 product is A0A9L0JGR2.
    supporting_text: The canonical donkey GPC3 product is A0A9L0JGR2.
