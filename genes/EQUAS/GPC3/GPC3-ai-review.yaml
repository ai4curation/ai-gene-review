id: A0A9L0J2B1
gene_symbol: GPC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: GPC3 (glypican-3) is a cell-surface heparan sulfate proteoglycan attached to the outer leaflet
  of the plasma membrane by a GPI anchor. Its core protein is cleaved by a furin-like convertase into alpha
  and beta subunits that remain disulfide-linked, and it can be shed from the cell surface. GPC3 promotes
  canonical Wnt signaling by binding Wnt ligands and, through its heparan sulfate chains, the Frizzled receptors,
  and it inhibits hedgehog signaling by binding hedgehog ligands in competition with Patched and driving their
  endocytosis and degradation. Through these activities it restrains growth during development; loss of
  GPC3 causes the overgrowth disorder Simpson-Golabi-Behmel syndrome in humans. This donkey entry (A0A9L0J2B1,
  565 aa) is an alternative-first-exon gene model of GPC3. Its first 43 residues are not homologous to the
  N-terminus of human GPC3 and do not include the human signal peptide. Downstream of that segment it is
  96% identical to human GPC3 and keeps the convertase cleavage site, heparan sulfate attachment serines and
  GPI-anchor site. The canonical donkey GPC3 product, with a human-like signal peptide, is A0A9L0JGR2 (580
  aa).
