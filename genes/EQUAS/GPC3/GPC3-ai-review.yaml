- id: PMID:14610063
  title: Processing by proprotein convertases is required for glypican-3 modulation of cell survival, Wnt signaling,
    and gastrulation movements.
  findings:
  - statement: Furin-like processing of GPC3 is needed for Wnt modulation and embryonic cell movements.
    supporting_text: This processing is essential for GPC3 modulating Wnt
  - statement: In transfected CHO cells, GPC3 repressed Wnt1-induced canonical reporter activity, showing
      that the sign of its effect on canonical Wnt depends on context.
    supporting_text: increasing the amount of wild-type GPC3 repressed Wnt1-mediated pTOPFLASH activation
      in a dose-dependent manner
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The zebrafish gastrulation evidence is morpholino-based, with mRNA rescue,
      and is treated as phenotype, not as evidence of participation in cell migration.
- id: PMID:18477453
  title: Glypican-3 inhibits Hedgehog signaling during development by competing with patched for Hedgehog
    binding.
  findings:
  - statement: Mouse GPC3 binds hedgehog with high affinity, competes with Patched, and induces hedgehog endocytosis
      and degradation; heparan sulfate chains are not needed for the interaction.
    supporting_text: GPC3 competes with Patched for Hedgehog binding
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. Source of mouse Gpc3 hedgehog annotations (IMP, IPI with Shh) and
      of the human ISS row. Added in the 2026-10-21 re-review.
- id: PMID:19590577
  title: Overgrowth of a mouse model of Simpson-Golabi-Behmel syndrome is partly mediated by Indian hedgehog.
  findings:
  - statement: Overgrowth of Gpc3-null mice is partly rescued by loss of Ihh, which places GPC3 upstream of
      hedgehog-driven growth in vivo.
    supporting_text: the developmental overgrowth observed in Gpc3-null mice is, at least in part, a consequence
      of the hyperactivation of the Hh pathway
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Genetic (IGI) support for GPC3 as a hedgehog inhibitor in vivo; added in the 2026-10-21 re-review.
