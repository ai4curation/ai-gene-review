gene_symbol: GPC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: GPC3 (glypican-3) is a cell-surface heparan sulfate proteoglycan attached to the outer leaflet
  of the plasma membrane by a GPI anchor. Its core protein is cleaved by a furin-like convertase into alpha
  and beta subunits that remain disulfide-linked, and it can be shed from the cell surface. GPC3 promotes
  canonical Wnt signaling by binding Wnt ligands and, through its heparan sulfate chains, the Frizzled receptors,
  and it inhibits hedgehog signaling by competing with Patched for hedgehog ligands and driving their endocytosis.
  Through these activities it restrains growth during development; loss of GPC3 causes the overgrowth disorder
  Simpson-Golabi-Behmel syndrome in humans. The donkey protein is 93% identical to human GPC3 and conserves
  the convertase cleavage site, heparan sulfate attachment serines and GPI-anchor site.
