suggested_questions:
- question: Does GPC3 restrain growth in equids as in humans and mice, and is its role in hepatoblast and
    renal development conserved in donkey?
- question: Is the alternative-first-exon transcript that encodes A0A9L0J2B1 (ENSEAST00005057340) expressed
    in donkey tissues? If it is, can its product, which lacks the canonical signal peptide, enter the secretory
    pathway and be GPI-anchored, or should GO annotation be attached only to the canonical product A0A9L0JGR2?
suggested_experiments:
- description: RNA-seq or 5' RACE across donkey tissues to test whether the alternative first exon of ENSEAST00005057340
    is used, with epitope-tagged expression of the A0A9L0J2B1 product to test signal-peptide-independent membrane
    targeting.
