  supporting_entities:
  - InterPro:IPR037520
  - PANTHER:PTN009120754
  review:
    summary: FLCN is the GAP for RagC/RagD; the catalytic Arg-164 is conserved in the donkey sequence.
    action: ACCEPT
    reason: Human FLCN-FNIP stimulates GTP hydrolysis by RagC/RagD (human IDA), and Arg-164, the residue
      essential for GAP activity, maps to Arg-164 of the donkey protein, which aligns to human at 94.64% identity
      over its full length. This is the defining molecular activity of FLCN.
    supported_by:
