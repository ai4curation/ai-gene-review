id: A0A8C4MM62
gene_symbol: FLCN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: Folliculin (FLCN) is a cytoplasmic DENN/longin-domain protein that, as a heterodimer with FNIP1
  or FNIP2, acts as the GTPase-activating protein for the lysosomal Rag GTPases RagC and RagD. By converting
  RagC/D to the GDP-bound state in response to amino acids it activates mTORC1 toward its non-canonical
  substrates TFEB and TFE3, keeping these MiT/TFE transcription factors phosphorylated and in the cytoplasm.
  Under amino acid starvation FLCN-FNIP sits on the lysosomal membrane within the inactive lysosomal folliculin
  complex with the Rags and Ragulator. FLCN is also reported at primary cilia, centrosomes and the mitotic
  spindle, contributes to autophagy and lysosome positioning, and human FLCN has been reported to bind and
  inhibit lactate dehydrogenase A. Loss of FLCN in mammals causes early embryonic lethality and, in heterozygotes,
  renal tumours (Birt-Hogg-Dube syndrome in human), driven largely by constitutive nuclear TFEB. The donkey
  protein belongs to the same PANTHER subfamily as human and mouse folliculin (PTHR31441:SF2), is full length
  (578 aa, 94.6% identity to human), and conserves the catalytic arginine finger (Arg-164).
