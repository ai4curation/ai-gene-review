    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00029133
  - PANTHER:PTN009120754
  review:
    summary: FLCN represses TFE3/TFEB-driven transcription indirectly, by activating mTORC1 so that these
      transcription factors are retained in the cytoplasm.
    action: KEEP_AS_NON_CORE
    reason: Human FLCN carries an IMP annotation to this term and the effect is real, but FLCN is a cytoplasmic
      Rag GAP that acts several steps upstream of transcription; it has no DNA-binding or co-regulator activity.
      The term is retained as a non-core, indirect consequence of its mTORC1-TFE3/TFEB signalling role. The
      donkey protein is a full-length, highly conserved ortholog.
    supported_by:
    - reference_id: file:EQUAS/FLCN/FLCN-bioinformatics/human_Q8NFG4-uniprot.txt
      supporting_text: In low-amino acid conditions, the lysosomal folliculin complex (LFC) is formed on the
        membrane of lysosomes, which inhibits the GTPase-activating activity of FLCN, inactivates mTORC1 and
        maximizes nuclear translocation of TFEB and TFE3
    - reference_id: file:EQUAS/FLCN/FLCN-bioinformatics/human_Q8NFG4-uniprot.txt
      supporting_text: 'GO:0000122; P:negative regulation of transcription by RNA polymerase II; IMP:UniProtKB.'
- term:
