- id: PMID:34381247
  title: The tumor suppressor folliculin inhibits lactate dehydrogenase A and regulates the Warburg effect.
  findings:
  - statement: Human FLCN binds LDHA and acts as an uncompetitive inhibitor through an N-terminal flexible
      loop.
    supporting_text: we identify the human tumor suppressor folliculin (FLCN) as a binding partner and uncompetitive
      inhibitor of LDHA
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached full text checked. Single-study human finding; not propagated by PANTHER node PTN009120754,
      so it is not transferred to donkey as a GO annotation. The LDHA-binding region (human 210-220, UniProt
      ECO:0000269 PubMed:34381247) is identical in the donkey sequence (alignment.txt).
- id: PMID:24095279
  title: The folliculin tumor suppressor is a GAP for the RagC/D GTPases that signal amino acid levels to
    mTORC1.
  findings:
  - statement: FLCN-FNIP1/2 is a GAP for RagC/D but not RagA/B, and localizes to the lysosome on amino acid
      starvation.
    supporting_text: We identify FLCN and its binding partners, FNIP1/2, as Rag-interacting proteins with
      GAP activity for RagC/D, but not RagA/B.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary human study establishing the molecular function; full text cached.
- id: PMID:31704029
  title: Cryo-EM Structure of the Human FLCN-FNIP2-Rag-Ragulator Complex.
  findings:
  - statement: Structure of FLCN-FNIP2 bound to the Rags and Ragulator identifies a conserved catalytic arginine
      finger on FLCN.
    supporting_text: Biochemical analyses reveal a conserved arginine on FLCN as the catalytic arginine finger
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Defines Arg-164 as the arginine finger; that residue is conserved in donkey.
- id: PMID:31672913
  title: Structural mechanism of a Rag GTPase activation checkpoint by the lysosomal folliculin complex.
  findings:
  - statement: FLCN relocalizes from cytosol to lysosomes on starvation, where its RagC GAP activity is inhibited
      within the lysosomal folliculin complex.
    supporting_text: The RagC-GAP activity of FLCN was inhibited within the LFC, owing to displacement of
      a catalytically required arginine in FLCN from the RagC nucleotide.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Supports cytosol and lysosomal membrane localization and the LFC checkpoint model.
- id: PMID:32612235
  title: A substrate-specific mTORC1 pathway underlies Birt-Hogg-Dubé syndrome.
  findings:
  - statement: FLCN-dependent RagC/D activation is required specifically for mTORC1 phosphorylation of TFEB,
      and constitutive TFEB drives the kidney phenotype of the mouse BHD model.
    supporting_text: We found that constitutive activation of TFEB is the main driver of the kidney abnormalities
      and mTORC1 hyperactivity in a mouse model of Birt-Hogg-Dubé syndrome.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the substrate-specific (TFEB) arm of FLCN-dependent mTORC1 signalling.
