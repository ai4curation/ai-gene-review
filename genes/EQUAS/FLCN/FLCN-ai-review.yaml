suggested_questions:
- question: Is the N-terminal flexible loop that mediates LDHA inhibition in human FLCN conserved in the donkey
    protein, given that most donkey-human differences lie in the N-terminal disordered segment?
suggested_experiments:
- description: Measure RagC/RagD GAP activity of recombinant donkey FLCN-FNIP2 and of an R164A mutant, to
    confirm that the conserved catalytic arginine supports the same activity as in human.
