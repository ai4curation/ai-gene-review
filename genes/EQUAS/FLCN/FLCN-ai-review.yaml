suggested_questions:
- question: Human FLCN is reported (single study) to bind and uncompetitively inhibit LDHA via a region
    (human residues 210-220) that is identical in donkey; is LDHA inhibition a conserved, physiological
    activity of mammalian folliculin, which would justify an enzyme inhibitor activity annotation beyond
    human?
- question: Is the TGF-beta signalling effect of FLCN loss (mouse IMP) a direct role in the receptor pathway
    or an indirect consequence of deregulated TFE3/TFEB transcription?
suggested_experiments:
- description: Measure RagC/RagD GAP activity of recombinant donkey FLCN-FNIP2 and of an R164A mutant, to
    confirm that the conserved catalytic arginine supports the same activity as in human.
