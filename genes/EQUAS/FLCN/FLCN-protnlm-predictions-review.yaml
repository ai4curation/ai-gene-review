id: A0A8C4MM62
gene_symbol: FLCN
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 5 ProtNLM2 GO predictions for donkey folliculin (A0A8C4MM62), a full-length
  ortholog of human FLCN (94.64% identity, same PANTHER subfamily PTHR31441:SF2, catalytic Arg-164 conserved)
  whose core function is RagC/RagD GAP activity with FNIP1/2, driving mTORC1 phosphorylation of TFEB and
  TFE3. One prediction is correct and absent from the donkey GOA record (enzyme inhibitor activity, from
  direct LDHA inhibition by human FLCN). Two are incorrect because they restate knockout phenotypes as
  participation in a process (in utero embryonic development, cell-cell junction assembly), the same grounds
  on which the human FLCN review marks these terms over-annotated. Two are uncertain because FLCN acts upstream
  of them only indirectly or through a generic consequence of its specific mTORC1 role (transforming growth
  factor beta receptor signalling pathway, positive regulation of protein phosphorylation). ProtNLM2 emitted
  no non-GO function-text or subcellular-location output for this accession in the frozen snapshot.
