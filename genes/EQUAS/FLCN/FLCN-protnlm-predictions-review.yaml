predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0007179
    label: transforming growth factor beta receptor signaling pathway
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: The donkey GOA record has positive regulation of TGF-beta receptor signalling (TreeGrafter), resting
      on a mouse IMP annotation, but the prediction asserts participation in the pathway itself. FLCN is
      a cytoplasmic Rag GAP with no reported role as a TGF-beta pathway component, and the effect on TGF-beta
      signalling is thought to be indirect. Regulation of a pathway is not an is_a child of the pathway, so
      the prediction is not simply a less precise form of the curated term. The primary mouse paper is not
      available here, so the claim can neither be confirmed nor refuted.
    supported_by:
    - reference_id: file:EQUAS/FLCN/FLCN-bioinformatics/mouse_Q8QZS3-uniprot.txt
      supporting_text: 'GO:0030511; P:positive regulation of transforming growth factor beta receptor signaling
        pathway; IMP:MGI.'
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0004857
    label: enzyme inhibitor activity
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: Human FLCN binds lactate dehydrogenase A directly and acts as an uncompetitive inhibitor (PMID:34381247;
      human IDA to this exact term). The donkey protein is a full-length ortholog at 94.64% identity. The
      term is absent from the donkey GOA record, which carries only the GAP activity as MF. The evidence comes
      from one laboratory, and the N-terminal inhibitory loop was not mapped residue by residue in this review,
      so the transfer is an inference from orthology.
    supported_by:
    - reference_id: PMID:34381247
      supporting_text: we identify the human tumor suppressor folliculin (FLCN) as a binding partner and uncompetitive
        inhibitor of LDHA
    - reference_id: file:EQUAS/FLCN/FLCN-bioinformatics/human_Q8NFG4-uniprot.txt
      supporting_text: 'GO:0004857; F:enzyme inhibitor activity; IDA:UniProtKB.'
    - reference_id: file:EQUAS/FLCN/FLCN-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A8C4MM62 (578 residues) aligns to human Q8NFG4 (579 residues)
        with 94.64% identity across 578 paired residues.
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0001934
    label: positive regulation of protein phosphorylation
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: FLCN activates mTORC1, which then phosphorylates TFEB and TFE3, so increased phosphorylation of
      these substrates is a downstream consequence of FLCN GAP activity. Neither the human nor the mouse
      Swiss-Prot record carries this term, and the donkey GOA record does not have it. Because the link is
      several steps removed and the term is generic, the evidence here neither supports nor refutes it as
      an informative annotation.
    supported_by:
    - reference_id: file:EQUAS/FLCN/FLCN-bioinformatics/human_Q8NFG4-uniprot.txt
      supporting_text: "Acts as a key component for non-\nCC       canonical mTORC1-dependent control of the MiT/TFE factors TFEB and\nCC       TFE3"
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0001701
    label: in utero embryonic development
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Homozygous Flcn knockout mice die at 5.5-6.5 dpc with visceral endoderm defects, and mouse Flcn
      carries an MGI IMP annotation to this exact term (human has it by ISS). The donkey protein is a full-length
      ortholog at 94.64% identity. The term is absent from the donkey GOA record. It reflects an essential,
      pleiotropic requirement rather than a specific developmental mechanism.
    supported_by:
    - reference_id: file:EQUAS/FLCN/FLCN-bioinformatics/mouse_Q8QZS3-uniprot.txt
      supporting_text: Embryonic lethality at 5.5-6.5 dpc
    - reference_id: file:EQUAS/FLCN/FLCN-bioinformatics/mouse_Q8QZS3-uniprot.txt
      supporting_text: 'GO:0001701; P:in utero embryonic development; IMP:MGI.'
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0007043
    label: cell-cell junction assembly
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: Mouse Flcn carries an IMP annotation to this term and human FLCN an ISS, but neither Swiss-Prot
      record describes a cell-junction function, and the primary study is not cached here. The term is absent
      from the donkey GOA record. Without the underlying evidence, the prediction can neither be confirmed
      nor refuted.
    supported_by:
    - reference_id: file:EQUAS/FLCN/FLCN-bioinformatics/mouse_Q8QZS3-uniprot.txt
      supporting_text: 'GO:0007043; P:cell-cell junction assembly; IMP:UniProtKB.'
