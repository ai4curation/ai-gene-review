id: A0A8C4MM62
gene_symbol: FLCN
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 5 ProtNLM2 GO predictions for donkey folliculin (A0A8C4MM62), using human and
  mouse experimental findings recorded in the Swiss-Prot orthologs, cached literature and a donkey-human
  sequence comparison (94.64% identity over the full length, catalytic Arg-164 conserved). Two predictions
  are correct and absent from the donkey GOA record (enzyme inhibitor activity, from LDHA inhibition; in
  utero embryonic development, from mouse knockout lethality). Three are uncertain because FLCN is an indirect
  regulator rather than a demonstrated participant (TGF-beta receptor signalling pathway, positive regulation
  of protein phosphorylation) or because the primary evidence is not available here (cell-cell junction
  assembly). ProtNLM2 emitted no non-GO function-text or subcellular-location output for this accession in
  the frozen snapshot.
