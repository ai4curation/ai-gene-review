taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: BICDL1 (BICD family-like cargo adaptor 1, also called BICDR-1) is a cytoplasmic coiled-coil
  activating adaptor for cytoplasmic dynein-1. Its N-terminal coiled coil with a CC1 box binds dynein and
  dynactin, converting dynein into a processive minus-end-directed motor and recruiting two dynein dimers
  per dynactin, while its C-terminal region binds the Golgi/secretory vesicle GTPases RAB6A and RAB6B and
  the kinesin KIF1C. Through these interactions BICDL1 concentrates Rab6-positive secretory vesicles around
  the centrosome, restricting their anterograde delivery and thereby restraining neurite outgrowth in early
  neuronal differentiation. The donkey protein is a close ortholog (96% identity over aligned regions) whose
  gene model differs from the canonical human isoform by an alternative exon in the coiled-coil region.
