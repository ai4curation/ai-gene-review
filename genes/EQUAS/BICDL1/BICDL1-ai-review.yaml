suggested_questions:
- question: Is the donkey BICDL1 splice form (lacking a central coiled-coil exon and including the isoform-2
    exon) the predominant transcript in donkey tissues, and does it change the spacing between the dynein-binding
    and Rab6-binding regions?
suggested_experiments:
- description: Single-molecule motility assays with dynein-dynactin and recombinant donkey BICDL1 versus the
    human canonical isoform, to test whether the alternative coiled-coil exon composition alters dynein recruitment
    (one versus two dyneins) or velocity.
