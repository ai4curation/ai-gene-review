suggested_questions:
- question: Is the donkey BICDL1 splice form that skips the central coiled-coil exon and includes the isoform-2
    exon (A0A9L0JLY3) actually expressed in donkey tissues? If so, does the changed coiled-coil length alter
    the spacing between the dynein-binding and Rab6-binding regions?
suggested_experiments:
- description: Run single-molecule motility assays with dynein-dynactin and recombinant donkey BICDL1, comparing
    the A0A9L0JLY3 splice form with the canonical-architecture product (A0A9L0K8K5 or A0A9L0I4K1). The aim
    is to test whether skipping the central coiled-coil exon changes dynein recruitment (one versus two dyneins)
    or velocity.
