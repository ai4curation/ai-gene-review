- term:
    id: GO:0055107
    label: Golgi to secretory granule transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001594046
  review:
    summary: BICDL1 regulates the post-Golgi transport of Rab6 secretory vesicles, which the term approximates.
    action: KEEP_AS_NON_CORE
    reason: Human BICDL1 carries this term by ISS from the mouse Rab6-vesicle work. Rab6 carriers are constitutive
      secretory vesicles rather than classical regulated secretory granules, and BICDL1 retains them pericentrosomally
      rather than delivering them, so the term is an imprecise fit. It is kept as non-core because the post-Golgi
      secretory-vesicle role it points to is real.
    supported_by:
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
      supporting_text: Regulates the secretory vesicle transport by controlling the accumulation of Rab6-containing
        secretory vesicles in the pericentrosomal region restricting anterograde secretory transport during
        the early phase of neuronal differentiation, thereby inhibiting neuritogenesis.
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
      supporting_text: 'GO:0055107; P:Golgi to secretory granule transport; ISS:UniProtKB.'
- term:
    id: GO:0140660
    label: cytoskeletal motor activator activity
  evidence_type: ISS
  original_reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
  qualifier: enables
  review:
    summary: As an activating adaptor BICDL1 switches dynein-dynactin into a processive, faster and more forceful
      motor.
    action: NEW
    reason: The donkey GOA record has no molecular function. The defining activity of BICDR-family adaptors
      is activation of dynein motility in the presence of dynactin (recruiting two dyneins), which matches
      cytoskeletal motor activator activity, the term used for the paralog BICD2 in this repository. The CC1
      box required for this activity is conserved in the donkey protein. The functional data come from the
      mouse ortholog and in vitro reconstitution, transferred by orthology.
    supported_by:
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
      supporting_text: Facilitates the interaction between dynein and dynactin and activates dynein processivity
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
      supporting_text: Predominantly recruits 2 dyneins, which increases both the force and speed of the microtubule
        motor.
- term:
    id: GO:0005813
    label: centrosome
  evidence_type: ISS
  original_reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
  qualifier: located_in
  review:
    summary: BICDL1 concentrates with its Rab6 vesicle cargo around the centrosome.
    action: NEW
    reason: The donkey GOA record has no cellular component. Human BICDL1 carries centrosome by ISS from the
      mouse ortholog, whose dynein-dependent pericentrosomal clustering of Rab6 vesicles is the basis of its
      known cellular role. The localization is pericentrosomal rather than centriolar, which the centrosome
      term (including pericentriolar material) covers.
    supported_by:
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
      supporting_text: Note=Localizes around the centrosome.
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
      supporting_text: 'GO:0005813; C:centrosome; ISS:UniProtKB.'
