- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0031267
    label: small GTPase binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: BICDL1 binds the small GTPases RAB6A and RAB6B (specific to Rab6), the interaction that links
      it to its secretory-vesicle cargo; human BICDL1 carries the term by ISS from mouse. The C-terminal BICDL1/2-like
      domain is present in the donkey protein. The term is absent from the donkey GOA record. Rab GTPase binding
      would be a more specific choice, but the predicted term is correct.
    supported_by:
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
      supporting_text: Interacts with RAB6A and RAB6B; interaction is specific to Rab6.
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
      supporting_text: 'GO:0031267; F:small GTPase binding; ISS:UniProtKB.'
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0031175
    label: neuron projection development
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: In developing neurons BICDR-1 is part of the secretory-vesicle machinery that regulates neurite
      outgrowth, retaining Rab6 vesicles pericentrosomally and thereby restraining neuritogenesis; human BICDL1
      carries this exact term by ISS. The term is absent from the donkey GOA record. Because the protein acts
      as a negative regulator, negative regulation of neuron projection development would describe the role
      more precisely; the evidence is mouse work transferred by orthology.
    supported_by:
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
      supporting_text: motor. Component of secretory vesicle machinery in developing neurons
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
      supporting_text: 'GO:0031175; P:neuron projection development; ISS:UniProtKB.'
