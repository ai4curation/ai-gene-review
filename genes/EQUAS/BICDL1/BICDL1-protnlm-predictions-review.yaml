- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0005813
    label: centrosome
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: Human BICDL1 is annotated to the centrosome by ISS from mouse, where BICDR-1 clusters Rab6 vesicles
      in the pericentrosomal region by dynein-dependent transport. The localization is around rather than
      within the centrioles, which the centrosome term (including pericentriolar material) accommodates. The
      term is absent from the donkey GOA record.
    supported_by:
    - reference_id: file:EQUAS/BICDL1/BICDL1-bioinformatics/human_Q6ZP65-uniprot.txt
