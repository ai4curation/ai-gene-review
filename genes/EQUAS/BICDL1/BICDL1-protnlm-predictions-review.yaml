description: Assessment of 4 ProtNLM2 GO predictions for donkey BICDL1 (A0A9L0JLY3), scored for this
  exact product. A0A9L0JLY3 is a non-canonical splice form of the donkey BICDL1 gene that keeps the N-terminal
  CC1 box and the C-terminal Rab6-binding region but lacks a 49-residue central coiled-coil segment (human
  Q6ZP65 residues 255-303) present in human, mouse and every other donkey product, and includes the alternative
  exon of human isoform 2 (95.99% identity to human Q6ZP65 over 524 paired residues). The canonical product
  of the same gene (A0A9L0K8K5) already carries all four predicted terms in GOA as Ensembl Compara transfers
  from mouse Bicdl1, so none of the predictions is novel at the gene level. Small GTPase binding depends on
  the retained C-terminal region and is assessed CNN. Dynactin binding and centrosome localization depend
  on the coiled coil that lies along dynactin in the BICDR1-dynein-dynactin cryo-EM structure; because the
  missing segment falls within that stretch and no experiment tests the shortened adaptor, both are assessed
  UNC. Neuron projection development is assessed NPI, because the mouse evidence behind it is an overexpression
  phenotype in which BICDR-1 inhibits neurite outgrowth indirectly by retaining Rab6 secretory vesicles near
  the centrosome; the positive process term misstates that relationship. A PubMed search (BICDL1, BICDR1,
  BICDR-1, CCDC64) found no further experimental work bearing on these terms beyond PMID:20360680 and the
  dynein-dynactin structural studies. ProtNLM2 emitted no non-GO function-text or subcellular-location output
  for this accession in the frozen snapshot.
