    label: dynactin binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: BICDR-family activating adaptors form a tripartite complex with dynein and dynactin, and human
      BICDL1 carries dynactin binding by ISS from the mouse ortholog. The N-terminal CC1 box that mediates
      dynein engagement is conserved in the donkey protein, which aligns to human at 95.99% identity. The
      term is absent from the donkey GOA record. The evidence is mouse experimental work transferred by orthology.
    supported_by:
