id: A0A9L0JLY3
gene_symbol: BICDL1
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 4 ProtNLM2 GO predictions for donkey BICDL1 (A0A9L0JLY3), using the human Swiss-Prot
  ortholog Q6ZP65 (whose functional statements are themselves transferred from mouse Bicdl1/BICDR-1) and
  a donkey-human sequence comparison (95.99% identity over 524 paired residues; the donkey gene model uses
  an alternative coiled-coil exon composition). The donkey GOA record has only two TreeGrafter process rows
  (vesicle transport along microtubule; Golgi to secretory granule transport), so all four predictions are
  novel for the target. Dynactin binding, centrosome, small GTPase binding (Rab6) and neuron projection development
  are each supported by curator-assigned ISS annotations on the human ortholog grounded in mouse experiments,
  and are assessed COR. ProtNLM2 emitted no non-GO function-text or subcellular-location output for this
  accession in the frozen snapshot.
