predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: The term is already in donkey GOA, but only via a UniRule family rule (GO_REF:0000104) applied
      to peptidase C19 members, so the overlap does not establish correctness. Human USP36 deubiquitinates
      nucleophosmin and fibrillarin and stabilizes them by counteracting proteasomal degradation (PMID:19208757);
      no allowed evidence shows USP36 executing a step of ubiquitin-dependent catabolism, such as proteasome-associated
      deubiquitination. The donkey catalytic residues are conserved, so DUB activity itself is expected,
      but the specific process claim cannot be validated and is not directly contradicted by an experiment.
      The gene review marks the corresponding GOA row as over-annotated.
    supported_by:
    - reference_id: PMID:19208757
      supporting_text: USP36 deubiquitylated the nucleolar proteins nucleophosmin/B23 and fibrillarin, and
        stabilized them by counteracting ubiquitylation-mediated proteasomal degradation
    - reference_id: file:EQUAS/USP36/USP36-bioinformatics/RESULTS.md
      supporting_text: The catalytic nucleophile (donkey Cys131 = human Cys131) and proton acceptor (donkey
        His415 = human His382) of the USP domain are conserved.
