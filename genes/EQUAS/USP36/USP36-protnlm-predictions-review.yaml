  label: Equus asinus
status: COMPLETE
description: 'Assessment of 1 ProtNLM2 GO prediction for donkey USP36 (A0A9L0JCH5), judged against the
  donkey GOA record (cysteine-type deubiquitinase activity, protein deubiquitination, protein stabilization,
  regulation of rRNA processing, nucleolus and others), the human ortholog Q9P275 and cached USP36 studies
  (PMID:19208757), and a donkey-human alignment (78% identity, catalytic Cys/His conserved). Ubiquitin-dependent
  protein catabolic process is present in donkey GOA only through a family-level UniRule, and the characterized
  activity of USP36 protects its substrates from proteasomal degradation, so the claim is neither established
  nor cleanly refuted (UNC). Non-GO ProtNLM2 outputs, not scored: subcellular locations ''Cytoplasm'' and
  ''Nucleus'' (both consistent with human data, though they omit the principal nucleolar location) and
  function text ''Deubiquitinating enzyme that removes conjugated ubiquitin from specific proteins to regulate
  different cellular processes'', which is a correct but generic USP-family statement.'
