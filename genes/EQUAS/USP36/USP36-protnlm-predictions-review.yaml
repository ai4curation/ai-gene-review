    label: ubiquitin-dependent protein catabolic process
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    error_type: FREQUENCY_BIAS
    confidence_score: 0
    summary: The term is already in donkey GOA, but only via a family-wide UniRule (GO_REF:0000104) applied
      to peptidase C19 members, so the overlap does not establish correctness and the prediction is not
      novel. Donkey USP36 sits in PANTHER subfamily PTHR24006:SF653 (ubiquitin carboxyl-terminal hydrolase
      36) with its catalytic Cys/His conserved, so the human ortholog's characterized activity transfers.
      That activity runs against the predicted process. Human USP36 deubiquitinates nucleophosmin, fibrillarin
      and c-Myc and thereby stabilizes them against proteasomal degradation (PMID:19208757, PMID:25775507),
      and PubMed searches for USP36 with degradation or proteasome return substrate-stabilization reports
      only, with no report of USP36 acting in a step of ubiquitin-dependent catabolism such as proteasome-associated
      chain trimming. The re-reviewed gene review marks the GOA row for this term as over-annotated on these
      grounds, which refute the prediction. ProtNLM2 repeats the generic DUB-family process label rather
      than the protein's substrate-protective role (protein stabilization).
    supported_by:
    - reference_id: PMID:19208757
      supporting_text: USP36 deubiquitylated the nucleolar proteins nucleophosmin/B23 and fibrillarin, and
        stabilized them by counteracting ubiquitylation-mediated proteasomal degradation
    - reference_id: PMID:25775507
      supporting_text: USP36 interacts with and deubiquitinates c-Myc in cells and in vitro, leading to
        the stabilization of c-Myc
    - reference_id: file:EQUAS/USP36/USP36-bioinformatics/RESULTS.md
      supporting_text: The catalytic nucleophile (donkey Cys131 = human Cys131) and proton acceptor (donkey
        His415 = human His382) of the USP domain are conserved.
