id: A0A9L0JCH5
gene_symbol: USP36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: USP36 is a nucleolar ubiquitin-specific protease (peptidase C19 family) with an N-terminal
  USP catalytic domain and a long, basic, low-complexity C-terminal region that targets it to nucleoli.
  It removes ubiquitin, including Lys-48-linked chains, from nucleolar and other substrates such as nucleophosmin,
  fibrillarin, DHX33, MYC and CEP63, protecting them from proteasomal degradation, and thereby supports
  nucleolar structure, rRNA transcription and processing, and ribosome production. It also deubiquitinates
  histone H2B at specific promoters, acting as a transcriptional repressor, and restrains p62-dependent
  selective autophagy; a minor pool is cytoplasmic. The donkey protein A0A9L0JCH5 is 78% identical to
  human USP36, retains the catalytic Cys and His residues, and carries a 33-residue insertion within the
  USP domain.
