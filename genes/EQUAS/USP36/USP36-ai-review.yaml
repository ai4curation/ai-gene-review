    id: GO:0004843
    label: cysteine-type deubiquitinase activity
  directly_involved_in:
  - id: GO:0016579
    label: protein deubiquitination
  - id: GO:0050821
    label: protein stabilization
  - id: GO:2000232
    label: regulation of rRNA processing
  locations:
  - id: GO:0005730
    label: nucleolus
  supported_by:
  - reference_id: PMID:19208757
    supporting_text: USP36 deubiquitylated the nucleolar proteins nucleophosmin/B23 and fibrillarin, and
      stabilized them by counteracting ubiquitylation-mediated proteasomal degradation
  - reference_id: PMID:19208757
    supporting_text: USP36 localized to nucleoli via the C-terminal region, which contains basic amino
      acid stretches
  - reference_id: PMID:25775507
    supporting_text: USP36 interacts with and deubiquitinates c-Myc in cells and in vitro, leading to
      the stabilization of c-Myc
  - reference_id: PMID:29273634
    supporting_text: USP36 reduces the ubiquitination levels and increases the stability of the DEAH-box
      RNA helicase DHX33
  - reference_id: PMID:22902402
    supporting_text: USP36, the human ortholog of Ubp10, complements the ubp10Δ allele for RNAPI stability,
      pre-rRNA processing, and cell growth in yeast
suggested_questions:
- question: Is the 33-residue Gly/Pro/Ala-rich insertion in the donkey Ensembl-canonical USP36 transcript
    (A0A9L0JCH5, residues 253-285; absent from the 1123-aa donkey splice form A0A9L0I9H9 and from horse,
    human, mouse and cattle USP36) a real donkey splice form, and does it change deubiquitinase activity
    or substrate choice?
- question: Is the SUMO ligase activity reported for human USP36 toward EXOSC10 and snoRNP proteins reproducible,
    and does it need the USP catalytic cysteine? If confirmed, should GO SUMO ligase activity be annotated
    to the USP36 subfamily?
suggested_experiments:
- description: RT-PCR across the donkey exon carrying residues 253-285 in several tissues to establish
    whether the 1156-aa splice form is expressed, followed by ubiquitin-AMC hydrolysis and Lys-48 versus
    Lys-63 di-ubiquitin cleavage of the catalytic domain with and without the insertion.
