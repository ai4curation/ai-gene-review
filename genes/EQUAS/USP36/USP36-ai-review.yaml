suggested_questions:
- question: Does the 33-residue insertion in the donkey USP36 catalytic domain (absent from human) alter
    deubiquitinase activity or substrate selection, or is it a gene-model artefact?
suggested_experiments:
- description: Express the donkey USP36 catalytic domain with and without the 33-residue insertion and
    compare ubiquitin-AMC hydrolysis and Lys-48 versus Lys-63 di-ubiquitin cleavage.
