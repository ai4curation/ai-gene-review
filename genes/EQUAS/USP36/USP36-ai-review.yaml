- term:
    id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000415037
  review:
    summary: Ubiquitin-dependent protein catabolic process, from a UniRule family rule. The characterized
      activity of USP36 is the opposite direction - it removes ubiquitin from nucleophosmin, fibrillarin,
      MYC and CEP63 and thereby protects them from proteasomal degradation.
    action: MARK_AS_OVER_ANNOTATED
    reason: A family-wide UniRule default for peptidase C19 members. The process describes the degradation
      of ubiquitinated proteins; no evidence shows USP36 performing a step of it (for example as a proteasome-associated
      DUB). Its documented role is the opposite, protecting substrates from proteasomal degradation, which
      is captured by protein stabilization.
    supported_by:
    - reference_id: PMID:19208757
      supporting_text: USP36 deubiquitylated the nucleolar proteins nucleophosmin/B23 and fibrillarin,
        and stabilized them by counteracting ubiquitylation-mediated proteasomal degradation
