id: A0A9L0JCH5
gene_symbol: USP36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: USP36 is a nucleolar ubiquitin-specific protease (peptidase C19 family, USP36/Ubp10 subfamily)
  with an N-terminal USP catalytic domain and a long, basic, low-complexity C-terminal region that targets
  it to nucleoli. It removes ubiquitin, including Lys-48-linked chains, from nucleolar ribosome-biogenesis
  factors such as nucleophosmin, fibrillarin, the RNA helicase DHX33 and the largest RNA polymerase I
  subunit, and from c-Myc in the nucleolus, protecting them from proteasomal degradation. Through these
  substrates it sustains rRNA synthesis and processing, nucleolar structure and ribosome production, and
  it is essential for cell and embryo viability in mammals. It also deubiquitinates monoubiquitinated
  histone H2B at target genes such as CDKN1A, has been reported to promote SUMOylation of nucleolar proteins
  such as EXOSC10, restrains p62-dependent selective autophagy, and a cytoplasmic pool modulates the E3
  ligase NEDD4L. The donkey product A0A9L0JCH5 is the Ensembl-canonical transcript of the donkey gene;
  it is 78% identical to human USP36, retains the catalytic Cys and His residues, and differs from the
  other donkey splice forms only by a 33-residue insertion within the USP domain that is not found in
  horse, human, mouse or cattle USP36.
