    review_notes: 'Local reproducible analysis: A0A9L0JCH5 is the Ensembl-canonical splice form; its 33-residue
      insertion is absent from other donkey splice forms and from orthologs.'
core_functions:
- description: Nucleolar ubiquitin-specific protease that removes ubiquitin, including Lys-48-linked chains,
    from ribosome-biogenesis factors (nucleophosmin, fibrillarin, DHX33, RNA Pol I large subunit) and
    c-Myc, stabilizing them and sustaining rRNA synthesis and processing.
