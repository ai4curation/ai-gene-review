suggested_questions:
- question: Does GPC3 restrain body and organ growth in equids as it does in humans and mice, and is its
    hedgehog-inhibitory role conserved in donkey development?
- question: Which donkey GPC3 transcripts are used in vivo? The gene also encodes an alternative-first-exon
    product without a signal peptide (A0A9L0J2B1) and a longer Ensembl-canonical product (A0A9L0J383).
    Should GO annotation of this gene be attached to the colinear product A0A9L0JGR2?
suggested_experiments:
- description: Express epitope-tagged donkey GPC3 (A0A9L0JGR2) in cultured cells and test GPI anchoring
    (PI-PLC release), convertase processing, heparan sulfate substitution, Frizzled co-immunoprecipitation
    and Sonic hedgehog binding, to confirm experimentally in this species the activities inferred from
    human and mouse GPC3.
