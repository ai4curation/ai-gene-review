id: A0A9L0JGR2
gene_symbol: GPC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: GPC3 (glypican-3) is a heparan sulfate proteoglycan of the cell surface. A signal peptide
  directs it into the secretory pathway, where it is attached to the outer leaflet of the plasma membrane
  by a C-terminal GPI anchor and receives heparan sulfate chains near its C-terminus. A furin-like convertase
  cleaves the core protein into alpha and beta subunits that stay disulfide-linked, and the protein can
  later be released from the anchor and shed. In the characterised human and mouse orthologs GPC3 promotes
  canonical Wnt signaling by binding Wnt ligands and, through its heparan sulfate chains, Frizzled receptors.
  It inhibits hedgehog signaling by binding hedgehog ligands through its core protein, in competition with
  Patched, and by driving their endocytosis and lysosomal degradation. Through these activities it restrains
  growth during development, and its loss causes overgrowth in humans (Simpson-Golabi-Behmel syndrome) and
  mice. Donkey GPC3 (A0A9L0JGR2, 580 aa) is the gene-centric canonical product of the donkey gene. It is
  colinear with human GPC3, 96% identical to it, and keeps the signal peptide, convertase site, heparan
  sulfate attachment serines and GPI-anchor site. No experiment has been done on the donkey protein, so
  its functions are inferred from orthologs in the same PANTHER subfamily (PTHR10822:SF4, glypican-3).
