  review:
    summary: Mouse Gpc3 inhibits hedgehog signaling by binding hedgehog with high affinity, competing with
      Patched for it and inducing its endocytosis and degradation. Mouse Gpc3 is in the same PANTHER subfamily
      (PTHR10822:SF4) as donkey GPC3.
    action: NEW
    reason: GPC3 itself performs the regulatory step by binding and removing the ligand, so this is participation
      and not only necessity. Gpc3-null mice show hedgehog hyperactivity and Ihh-dependent overgrowth, which
      adds genetic support. Human GPC3 carries the same term by ISS from mouse, which is the comparator
      for this transfer. No PAINT node in the glypican family carries a hedgehog term, so I do not read
