    label: histone H3K9me2/H3K9me3 demethylase activity
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: Human KDM4C (JMJD2C) is an experimentally characterized H3K9 tridemethylase, and JMJD2 subfamily
      members convert H3K9me3 to lower methylation states. The donkey protein is 91% identical to human KDM4C
      and conserves every 2-oxoglutarate-, Fe(II)- and Zn(2+)-binding residue of the JmjC domain, so the activity
      transfers with high confidence. The exact term is already in donkey GOA (EC 1.14.11.66 mapping), so the
      prediction is correct but not novel. Training-set membership is unknown.
    supported_by:
    - reference_id: PMID:17277772
      supporting_text: JMJD2C as the first histone tridemethylase regulating androgen receptor
    - reference_id: PMID:16603238
      supporting_text: subfamily members also functioned as trimethylation-specific demethylases
    - reference_id: file:EQUAS/KDM4C/KDM4C-bioinformatics/RESULTS.md
      supporting_text: All human 2-oxoglutarate-binding residues (Y134, N200, K208, K243), catalytic Fe-binding
        residues (H190, E192, H278) and Zn-binding residues (C236, H242, C308, C310) of the JmjC domain are
        conserved
