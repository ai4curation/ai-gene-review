id: A0A9L0K3L6
gene_symbol: KDM4C
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of the single ProtNLM2 GO prediction for donkey KDM4C (A0A9L0K3L6), a JmjC-domain
  histone demethylase 91% identical to human KDM4C with a fully conserved Fe(II)/2-oxoglutarate active site.
  The prediction histone H3K9me2/H3K9me3 demethylase activity (GO:0140684) is correct and already present
  in donkey GOA (CNN). ProtNLM2 also emitted the function text "Histone demethylase that specifically demethylates
  'Lys-9' of histone H3, thereby playing a central role in histone code", which agrees with the H3K9 activity
  of human KDM4C but omits its H3K36me3 demethylase activity; no subcellular location was emitted. Non-GO
  outputs are noted, not scored.
