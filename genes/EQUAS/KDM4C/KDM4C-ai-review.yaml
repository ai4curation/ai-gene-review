  supporting_entities:
  - UniRule:UR000416814
  review:
    summary: The JmjC domain binds catalytic Fe(II) and a structural Zn(2+); all ligand residues are conserved.
    action: MODIFY
    reason: Correct but generic. The specific metals are known for the KDM4C catalytic domain (Fe(II) at
      the HXE...H facial triad, Ni(2+) substituting in the crystal structure; a structural zinc site), and
      every ligand residue is conserved in the donkey protein. Replace with iron ion binding and zinc ion
      binding; both are cofactor-binding terms, non-core relative to the demethylase activity.
    proposed_replacement_terms:
    - id: GO:0005506
      label: iron ion binding
    - id: GO:0008270
      label: zinc ion binding
    supported_by:
