gene_symbol: KDM4C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: KDM4C (lysine-specific demethylase 4C, JMJD2C) is a nuclear JmjC-domain histone demethylase
  of the KDM4/JHDM3 family. Using Fe(II) and 2-oxoglutarate, it removes methyl groups from trimethylated
  lysine 9 and lysine 36 of histone H3, converting H3K9me3 and H3K36me3 to lower methylation states. Its
  PHD and double Tudor domains bind histone tails, and it is recruited to chromatin by transcription factors
  such as the androgen receptor, where H3K9me3 removal derepresses target genes. The donkey protein is 91%
  identical to human KDM4C and conserves all JmjC Fe(II)-, 2-oxoglutarate- and Zn(2+)-binding residues.
