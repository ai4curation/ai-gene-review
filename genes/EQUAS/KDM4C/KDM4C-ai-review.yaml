gene_symbol: KDM4C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: KDM4C (lysine-specific demethylase 4C, JMJD2C) is a nuclear JmjC-domain histone demethylase
  of the KDM4/JHDM3 family. Using Fe(II) and 2-oxoglutarate, it removes methyl groups from trimethylated
  lysine 9 and, less efficiently, lysine 36 of histone H3, converting H3K9me3 and H3K36me3 to lower methylation
  states. Besides the catalytic JmjN/JmjC module, which also carries a structural zinc site, it has PHD
  and double Tudor reader domains that bind methylated histone tails and are thought to target the enzyme
  to chromatin. It is recruited to chromatin by transcription factors such as the androgen receptor, where
  H3K9me3 removal derepresses target genes. KDM4A, KDM4B and KDM4C form a vertebrate-conserved KDM4 subclass
  with dual H3K9/H3K36 specificity. The donkey protein is a full-length KDM4C ortholog (1052 aa, 91% identical
  to human KDM4C) that conserves all JmjC Fe(II)-, 2-oxoglutarate- and Zn(2+)-binding residues.
