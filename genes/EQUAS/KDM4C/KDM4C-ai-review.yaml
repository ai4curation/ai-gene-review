suggested_questions:
- question: Which genomic loci and transcription factors recruit KDM4C in equid tissues, and does KDM4C
    act on H3K9me3 in heterochromatin as well as at androgen receptor target genes?
- question: Do the KDM4C PHD and double Tudor domains bind the same methylated histone marks (H3K4me3,
    H4K20me3) as the KDM4A Tudor domain, and does this targeting determine where H3K9me3 is removed?
