  review:
    summary: SNARE fusogenic activity is the core molecular function of SNAP23. The donkey protein is a full-length
      SNAP23 subfamily member with both SNARE motifs intact.
    action: ACCEPT
    reason: Human SNAP23 has direct experimental support for this activity (IDA). SNAP23 binds multiple syntaxins
      and VAMPs and assembles with syntaxin-4 and VAMP-3 into a four-helix SNARE heterotetramer. The activity
      was placed by PAINT at node PTN000447753, which is ancestral to both SNAP23 and SNAP25. Donkey A0A8C4M333
      is in the same PANTHER subfamily as human O00161 (PTHR19305:SF4), aligns to it without gaps, and conserves
      both t-SNARE coiled-coil domains, including the buried Gln-48 of the N-terminal motif. The transfer is
      therefore evolutionarily grounded. It is not experimentally established in donkey.
