gene_symbol: SNAP23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: SNAP23 (synaptosome-associated protein 23) is the ubiquitously expressed member of the SNAP-25
  family of Qbc t-SNAREs. It belongs to the SNAP23 subfamily (PANTHER PTHR19305:SF4), which is distinct from
  the subfamily of the neuronal paralog SNAP25. The 211-residue protein carries two SNARE motifs, an N-terminal
  Qb motif and a C-terminal Qc motif. They are joined by a linker whose cysteine-rich cluster is S-palmitoylated
  and anchors the protein to the cytoplasmic face of the plasma membrane. SNAP23 donates both helices to a
  four-helix trans-SNARE bundle, which it forms with a plasma membrane syntaxin (for example STX4 or STX11)
  and a vesicle VAMP (for example VAMP3, VAMP4, VAMP7 or VAMP8). Zippering of this bundle drives the fusion
  of transport, recycling and secretory vesicles with the plasma membrane. It thereby supports constitutive
  and regulated exocytosis in non-neuronal cells such as immune, epithelial and muscle cells, and the delivery
  of membrane proteins such as TLR4 and NMDA receptors to the cell surface. Donkey SNAP23 (A0A8C4M333, the
  gene-centric canonical product of Ensembl gene ENSEASG00005013173) is 89.6% identical to human SNAP23 over
  its full length with no indels. It conserves both SNARE motifs and the five linker cysteines. Its functions
  are inferred from orthologs; no experimental study of the donkey protein exists.
