suggested_questions:
- question: Should PAINT block the synaptic vesicle priming and synaptic vesicle fusion to presynaptic active
    zone membrane assertions at node PTN000447754 for the vertebrate SNAP23 subfamily (PTHR19305:SF4)? In
    Snap25-null rescue experiments, SNAP23 supports neither a primed vesicle pool nor synchronous release,
    and endogenous neuronal SNAP23 is postsynaptic.
- question: Does the Cys-112 to Ser substitution in donkey SNAP23 (human Cys-112 is reported S-palmitoylated)
    alter its membrane association or palmitoylation stoichiometry?
suggested_experiments:
- description: Test whether donkey SNAP23 localizes to the plasma membrane in palmitoylation-dependent manner
    in equine cells (for example, compare wild-type with a mutant lacking the Cys-79..87 cluster). Also test
    whether it co-immunoprecipitates with STX4 and VAMP3 or VAMP8. Either result would give species-level
    experimental grounding for the inferred functions.
