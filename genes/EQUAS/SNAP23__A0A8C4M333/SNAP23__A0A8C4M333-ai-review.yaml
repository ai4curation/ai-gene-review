core_functions:
- description: Plasma membrane Qbc t-SNARE. Donkey SNAP23 is anchored to the plasma membrane by palmitoylation
    of its linker cysteines. With a syntaxin and a VAMP, it contributes two SNARE helices to the trans-SNARE
    four-helix bundle, whose zippering drives fusion of transport and secretory vesicles with the plasma membrane
    in exocytosis. In donkey this is inferred from PANTHER subfamily PTHR19305:SF4 membership, PAINT node PTN000447753,
    and conservation of both SNARE motifs and the palmitoylation cluster. The underlying experiments are in
    human and mouse.
