description: Assessment of the single ProtNLM2 GO prediction for donkey ALKAL2 (A0A9L0J5U7), judged against
  the donkey GOA record (extracellular region, plasma membrane, receptor signaling protein tyrosine kinase activator
  activity, receptor tyrosine kinase binding, ERK1/2 and ERK5 cascade regulation), the human ortholog Q6UX46
  and its characterization, and a donkey-human alignment (86% identity, invariant augmentor domain). The prediction,
  extracellular region, is correct and already in donkey GOA (CNN). The frozen ProtNLM2 output contains no
  non-GO rows (function text or subcellular location) for this accession.
