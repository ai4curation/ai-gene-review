    summary: ALKAL2 is a secreted cytokine; the human ortholog is experimentally secreted and active when supplied
      as conditioned medium, and the donkey protein has a predicted N-terminal signal peptide and is 86% identical
      to human across its full length. The exact term is already in donkey GOA (UniProt subcellular-location
      mapping), so the prediction is correct but not novel. Human ALKAL2 also associates with the cell membrane
      once bound to ALK, but extracellular region is the appropriate primary location for the ligand.
