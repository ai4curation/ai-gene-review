- term:
    id: GO:0030298
    label: receptor signaling protein tyrosine kinase activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR029364
  - PANTHER:PTN009109768
  review:
    summary: Activation of the receptor tyrosine kinases ALK and LTK is the defining activity of ALKAL2. Human
      ALKAL2 (FAM150B) stimulates ALK autophosphorylation and downstream signaling, and structures show it
      drives ALK/LTK dimerization.
    action: MODIFY
    reason: 'The essence is right and is the core function: the donkey protein sits in PANTHER subfamily PTHR28676:SF2
      (ALK AND LTK LIGAND 2) with experimentally characterised human ALKAL2 (Q6UX46), and its augmentor domain
      conserves the disulfides and ALK-contact residues. The term is the wrong sibling, however. GO:0030298 is
      defined for "a receptor signaling protein tyrosine kinase" and sits only under protein tyrosine kinase
      activator activity, with no signaling receptor activator parent. ALK and LTK are transmembrane receptor
      tyrosine kinases that ALKAL2 binds on their extracellular region, which is exactly the definition of GO:0030297
      transmembrane receptor protein tyrosine kinase activator activity; that term is_a signaling receptor activator
      activity, and it is the term used for other RTK ligands such as EGF, NGF, VEGFA and EFNA5 (QuickGO, human,
      2026-10-21). The ALK-axis usage of GO:0030298 (InterPro2GO mapping for IPR029364, and the human ALKAL1/ALKAL2
      IDA rows) appears to be a historical term choice rather than a distinct biological claim; raised as a suggested
      question.'
    proposed_replacement_terms:
    - id: GO:0030297
      label: transmembrane receptor protein tyrosine kinase activator activity
