suggested_questions:
- question: Does donkey ALKAL2, lacking the primate-specific interchain cysteine, act on ALK as a monomer, and
    does this change its potency relative to the disulfide-linked human dimer?
- question: Should ALK/LTK ligands (ALKAL1, ALKAL2) be annotated to GO:0030297 transmembrane receptor protein
    tyrosine kinase activator activity, as for EGF, NGF and VEGFA, rather than GO:0030298 receptor signaling protein
    tyrosine kinase activator activity, and should the InterPro2GO mapping for IPR029364 be updated accordingly?
- question: Is the ligand activity of ALKAL2 at ALK dependent on co-binding of heparin or other glycosaminoglycans
    in non-primate mammals, as reported for human ALKAL2-driven ALK activation?
suggested_experiments:
- description: Size-exclusion chromatography with multi-angle light scattering of recombinant donkey ALKAL2,
    alone and with the ALK extracellular region, combined with ALK phosphorylation dose-response assays compared
    with human ALKAL2.
