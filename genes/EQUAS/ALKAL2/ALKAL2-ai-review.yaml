taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: ALKAL2 (ALK and LTK ligand 2, also called FAM150B or augmentor-alpha) is a small secreted cytokine
  that acts as an activating ligand for the receptor tyrosine kinases ALK and LTK. Its C-terminal augmentor
  domain, a three-helix bundle stabilized by two intramolecular disulfides, binds the receptor extracellular
  region and drives receptor dimerization close to the plasma membrane, where ligand-membrane contacts stabilize
  the signaling complex. Receptor activation triggers downstream MAP kinase (ERK1/2 and ERK5) signaling and
  supports neural development and regulation of energy expenditure. The donkey protein A0A9L0J5U7 is the
  full-length ortholog (86% identity to human, with an invariant augmentor domain); it lacks the primate-specific
  N-terminal cysteine that forms the interchain disulfide in human ALKAL2.
