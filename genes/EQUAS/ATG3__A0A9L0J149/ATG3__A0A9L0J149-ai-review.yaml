core_functions:
- description: >-
    E2-like Atg8-family conjugating enzyme: accepts LC3/GABARAP-family proteins from
    the E1 ATG7 as a thioester on Cys264 and transfers them to phosphatidylethanolamine
    on curved phagophore membranes, promoted by the ATG12-ATG5-ATG16L1 complex, during
    autophagosome assembly. Inferred from human and mouse ATG3 (same PANTHER subfamily
    PTHR12866:SF2, 98.4% identity, catalytic and membrane-sensing residues conserved);
    not tested in donkey.
  molecular_function:
    id: GO:0141046
    label: Atg8-family conjugating enzyme activity
