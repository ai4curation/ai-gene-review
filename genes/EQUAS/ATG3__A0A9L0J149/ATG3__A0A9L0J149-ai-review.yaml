id: A0A9L0J149
gene_symbol: ATG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: >-
  ATG3 (autophagy-related protein 3) is the E2-like conjugating enzyme of the Atg8
  ubiquitin-like conjugation system. A0A9L0J149 is the 314-residue product of the
  donkey ATG3 gene, the same length as human ATG3 and 98.4% identical to it, and it
  sits in the same PANTHER subfamily (PTHR12866:SF2) as the experimentally studied
  human, mouse and yeast ATG3 proteins. By orthology with those proteins, ATG3 accepts
  an Atg8-family protein (LC3/GABARAP family) from the E1 enzyme ATG7 as a thioester on
  its active-site cysteine (Cys264, conserved in the donkey protein) and transfers it
  to the amino group of phosphatidylethanolamine in the growing phagophore membrane,
  a reaction promoted by the ATG12-ATG5-ATG16L1 E3-like complex. This lipidation of
  LC3/GABARAP proteins is required for elongation and closure of the isolation membrane
  during autophagosome assembly. ATG3 is a cytosolic protein whose N-terminal
  amphipathic helix senses highly curved, lipid-packing-defective membranes and couples
  membrane binding to conjugase activity; a LIR motif in its flexible region binds LC3,
  and an acidic flexible region binds ATG12 of the E3 complex. ATG3 can also be
  conjugated to ATG12 on Lys243 by its own E2 activity, a conjugate implicated in
  mitochondrial homeostasis in mouse cells. None of these functions has been tested
  experimentally in donkey; all are inferred from orthologs.
existing_annotations:
- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000305319
  review:
    summary: >-
      TreeGrafter transfer of autophagosome assembly. ATG3 lipidates LC3/GABARAP
      proteins on the phagophore, and loss of Atg3 in mouse blocks Atg8-family
      conjugation and gives malformed, unclosed isolation membranes; human ATG3
      mutants in the N-terminal conserved region abolish LC3-PE conjugation and
      autophagy. The donkey protein is in the same PANTHER subfamily as these
      orthologs and retains the catalytic cysteine and N-terminal membrane-sensing
      helix.
    action: ACCEPT
    reason: >-
      ATG3 itself performs a catalytic step of autophagosome assembly (the
      Atg8-family to PE transfer), so this is participation, not mere necessity.
      Experimentally established in mouse (Atg3 knockout) and human (mutant analysis),
      and transferable on PANTHER subfamily membership plus residue conservation.
    supported_by:
    - reference_id: PMID:18768753
      supporting_text: >-
        loss of Atg3 was associated with defective process of autophagosome formation,
        including the elongation and complete closure of the isolation membranes,
        resulting in malformation of the autophagosomes
    - reference_id: PMID:33446636
      supporting_text: >-
        During autophagy the enzyme Atg3 catalyzes the covalent conjugation of LC3 to
        the amino group of phosphatidylethanolamine (PE) lipids, which is one of the key
        steps in autophagosome formation.
    - reference_id: file:EQUAS/ATG3__A0A9L0J149/ATG3__A0A9L0J149-bioinformatics/RESULTS.md
      supporting_text: >-
        The donkey protein is therefore in the same subfamily as the experimentally
        characterised ATG3 proteins, not in the ATG10 subfamily (PTHR12866:SF5).
