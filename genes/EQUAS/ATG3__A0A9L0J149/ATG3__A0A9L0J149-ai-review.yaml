suggested_questions:
- question: >-
    Is the longer donkey ATG3 splice product (A0A9L0IHI0, with a 28-residue insertion
    upstream of Lys243 and Cys264) expressed as protein, and does it retain
    Atg8-family conjugating activity like the canonical 314-residue product?
- question: >-
    GOA's TreeGrafter transfer for donkey still uses Atg8-family ligase activity
    (GO:0019776), whereas the PAINT IBA for human ATG3 now uses Atg8-family conjugating
    enzyme activity (GO:0141046); should the TreeGrafter mapping be refreshed?
suggested_experiments:
- description: >-
    In vitro reconstitution of LC3B lipidation on small liposomes with recombinant
    donkey ATG7 and the two donkey ATG3 products (314-residue and 342-residue), with
    C264S controls, to test whether both are active E2s.
  experiment_type: in vitro reconstitution
