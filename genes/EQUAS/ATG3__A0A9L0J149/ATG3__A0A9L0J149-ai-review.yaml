  - reference_id: PMID:33446636
    supporting_text: >-
      During autophagy the enzyme Atg3 catalyzes the covalent conjugation of LC3 to the
      amino group of phosphatidylethanolamine (PE) lipids, which is one of the key steps
      in autophagosome formation.
  - reference_id: PMID:18768753
