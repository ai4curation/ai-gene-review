- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000305319
  review:
    summary: >-
      TreeGrafter transfer of mitophagy; the corresponding PAINT IBA on human ATG3 is
      seeded by yeast Atg3. Atg8-family lipidation by ATG3 is part of the core
      machinery used by selective forms of macroautophagy, including mitophagy.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PAINT curator placed this function at an ancestral ATG3 node that includes
      mammals; there is no evidence of loss in the donkey lineage, and the catalytic
      core is intact. ATG3 contributes catalytically (LC3/Atg8 lipidation) to building
      the mitophagosome, so the term reflects participation, but it is one of several
      selective autophagy routes rather than a distinct ATG3 function. Mouse data also
      link the ATG12-ATG3 conjugate to mitochondrial homeostasis.
    supported_by:
    - reference_id: PMID:11100732
      supporting_text: >-
        This lipidation has an essential role in membrane dynamics during autophagy.
    - reference_id: PMID:20723759
      supporting_text: >-
        these results unveil a role for ATG12-ATG3 in mitochondrial homeostasis
