- term:
    id: GO:0019776
    label: Atg8-family ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000305319
  review:
    summary: >-
      TreeGrafter transfer of Atg8-family ligase activity. ATG3 is the E2 of the Atg8
      system: it receives the Atg8-family protein from ATG7 as a thioester on Cys264
      and transfers it to PE. GO now distinguishes this E2 step as Atg8-family
      conjugating enzyme activity (GO:0141046), which is the term the current PAINT
      IBA and the human experimental annotations use for ATG3; the ligase term
      describes the E3-type step.
    action: MODIFY
    reason: >-
      The essence (catalysing Atg8-family lipidation) is right, but GO:0141046
      Atg8-family conjugating enzyme activity is the correct term for an E2 that
      transfers the modifier from a thioester to PE. The catalytic Cys264 is conserved
      in donkey and the protein is in the same PANTHER subfamily as human ATG3, where
      Cys264 was shown to be the active-site cysteine.
    proposed_replacement_terms:
    - id: GO:0141046
      label: Atg8-family conjugating enzyme activity
    supported_by:
    - reference_id: PMID:11825910
      supporting_text: >-
        These results indicate that hApg3p is an E2-like enzyme essential for three
        human Apg8p homologues.
    - reference_id: PMID:11100732
      supporting_text: >-
        Apg7 activates two different ubiquitin-like proteins, Apg12 (ref. 10) and Apg8,
        and assigns them to specific E2 enzymes, Apg10 (ref. 11) and Apg3, respectively.
    - reference_id: file:EQUAS/ATG3__A0A9L0J149/ATG3__A0A9L0J149-bioinformatics/RESULTS.md
      supporting_text: >-
        the ATG12-acceptor Lys243; and the catalytic Cys264 that forms the glycyl
        thioester intermediate.
