  review:
    summary: ORC binds replication origins; ORC5 contributes DNA-proximal surfaces to the complex.
    action: ACCEPT
    reason: 'Origin binding is a property of the ORC assembly, to which ORC5 contributes: human ORC structures
      place positively charged regions of ORC1-5 next to the bound DNA and identify the ORC5-ORC3 interface
      as a hinge for DNA binding; the ORC5 winged-helix beta-hairpin places H398 next to DNA. A0A9L0JAR4
      conserves the P-loop and H398 and is unchanged from human over residues 1-421. ORC5 has no origin
      binding activity on its own: the activity belongs to the complex, which ORC5 contributes to. Accepted
      on that basis (core_functions records it as contributes_to). The TreeGrafter node also carries this
      term for the whole subfamily.'
