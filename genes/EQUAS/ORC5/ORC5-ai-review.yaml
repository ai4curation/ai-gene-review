suggested_questions:
- question: Is the A0A9L0JAR4 transcript, with its alternative C-terminal segment (residues 422-440), expressed
    in donkey tissues, or is it a gene-model artefact? The full-length canonical-type product is A0A9L0I6Y4.
- question: Should ORC5 carry an ATP binding molecular function term, given that its Walker A motif is
    required for ATP-dependent assembly of human ORC?
