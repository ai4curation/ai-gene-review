    summary: ORC5 is a core subunit of the origin recognition complex.
    action: ACCEPT
    reason: Human ORC5 is one of the six ORC subunits and forms part of the stable ORC2-5 core seen by
      cryo-EM. A0A9L0JAR4 is a product of the single donkey ORC5 gene (PTHR12705:SF0, the only subfamily
      of this one-subunit family, which also holds human, yeast and plant ORC5), and is identical in
      architecture to human ORC5 over residues 1-421 (AAA+ domain, lid and winged-helix). Its alternative
      C-terminus replaces only the last 14 residues of the canonical protein, so complex membership is
      expected to be retained, although no product-specific test exists.
