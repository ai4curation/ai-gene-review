id: A0A9L0JAR4
gene_symbol: ORC5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: ORC5 is a subunit of the six-subunit origin recognition complex (ORC1-6), the AAA+ ATPase
  assembly that binds DNA replication origins in the nucleus and, with CDC6 and CDT1, loads the MCM2-7
  helicase to form the pre-replication complex that licenses origins for replication initiation. ORC5
  has an N-terminal AAA+-like ATPase domain with a Walker A P-loop, a lid domain and a C-terminal
  winged-helix domain whose beta-hairpin lies next to origin DNA; ATP binding by ORC5 is needed for
  assembly of human ORC, and ORC5 forms part of the stable ORC2-5 core. In human cells chromatin-bound
  ORC5 is multi-mono-ubiquitylated by OBI1 in S phase, which promotes origin firing. The donkey product
  A0A9L0JAR4 (440 aa) is one of several Ensembl transcript products of the single donkey ORC5 gene; it
  matches human ORC5 over residues 1-421, including the P-loop and the DNA-proximal hairpin, but ends
  in a 19-residue alternative C-terminal segment in place of the conserved 14-residue mammalian ORC5
  C-terminus.
