core_functions:
- description: Subunit of the nuclear origin recognition complex. As part of the ATP-dependent ORC2-5
    core, ORC5 contributes to origin DNA binding by the complex (through its winged-helix beta-hairpin)
    and to the ORC platform on which the pre-replication complex is assembled for DNA replication
    initiation.
