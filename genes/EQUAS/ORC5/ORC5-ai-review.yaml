id: A0A9L0JAR4
gene_symbol: ORC5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: ORC5 is a subunit of the six-subunit origin recognition complex (ORC1-6), the AAA+ ATPase
  assembly that binds DNA replication origins in the nucleus and, with CDC6 and CDT1, loads the MCM2-7
  helicase to form the pre-replication complex that licenses origins for replication initiation. ORC5
  has an N-terminal AAA+-like ATPase domain with a P-loop, a lid domain and a C-terminal winged-helix
  domain, and with ORC2, ORC3 and ORC4 forms the stable core of the complex. The donkey protein (440 aa)
  is 93% identical to human ORC5 over its full length.
