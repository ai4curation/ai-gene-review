id: A0A9L0JAR4
gene_symbol: ORC5
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 2 ProtNLM2 GO predictions for donkey ORC5 product A0A9L0JAR4 (440 aa),
  one of several products of the single donkey ORC5 gene. It matches human ORC5 over residues 1-421
  (AAA+ domain with the Walker A P-loop, lid, and winged-helix with the DNA-proximal H398 hairpin) and
  ends in a 19-residue alternative C-terminal segment in place of the conserved 14-residue mammalian
  C-terminus; no known ORC5 activity or localization signal maps to those 14 residues. Nucleus is
  correct for this product and already in donkey GOA (CNN). DNA replication is correct but less
  precise than the DNA replication initiation annotation already in GOA (LSP). ProtNLM2 also emitted
  non-GO function text for this accession ("Component of the origin recognition complex (ORC) that
  binds origins of replication. DNA-binding is ATP-dependent ... ORC is required to assemble the
  pre-replication complex necessary to initiate DNA replication"), which closely mirrors the existing
  ARBA function text of the donkey record and is not scored here.
