id: A0A9L0JAR4
gene_symbol: ORC5
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 2 ProtNLM2 GO predictions for donkey ORC5 (A0A9L0JAR4), a full-length
  origin recognition complex subunit 93% identical to human ORC5. Nucleus is correct and already
  in donkey GOA (CNN). DNA replication is correct but less precise than the DNA replication
  initiation annotation already in GOA (LSP). ProtNLM2 also emitted non-GO function text for this
  accession ("Component of the origin recognition complex (ORC) that binds origins of replication.
  DNA-binding is ATP-dependent ... ORC is required to assemble the pre-replication complex
  necessary to initiate DNA replication"), which closely mirrors the existing ARBA function text of
  the donkey record and is not scored here.
source_documents:
- projects/PROTNLM_EVALUATION/donkey40/donkey40-predictions.tsv
- genes/EQUAS/ORC5/ORC5-uniprot.txt
- genes/EQUAS/ORC5/ORC5-goa.tsv
- genes/EQUAS/ORC5/ORC5-bioinformatics/human_O43913-uniprot.txt
- genes/EQUAS/ORC5/ORC5-bioinformatics/RESULTS.md
predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0006260
    label: DNA replication
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: Human ORC5 is a subunit of ORC, which binds origins and is required to assemble the
      pre-replication complex that initiates DNA replication; the donkey sequence is a full-length
      ortholog (93% identity, Walker A motif conserved). DNA replication is therefore correct.
      Donkey GOA contains this exact term (combined IEA) and the more specific descendant DNA
      replication initiation (TreeGrafter), so the prediction is less precise than an existing
      annotation.
    supported_by:
    - reference_id: file:EQUAS/ORC5/ORC5-bioinformatics/human_O43913-uniprot.txt
      supporting_text: |-
        ORC is required to assemble the pre-replication complex necessary
        CC       to initiate DNA replication.
    - reference_id: file:EQUAS/ORC5/ORC5-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A9L0JAR4 (440 residues) aligns to human O43913 (435
        residues) with 92.87% identity across 435 paired residues.
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0005634
    label: nucleus
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: Human ORC5 is experimentally localized to the nucleus and chromatin (PMID:31160578
      via UniProt), and ORC acts on nuclear replication origins. The donkey protein is a
      full-length ortholog. The exact term is already in donkey GOA (combined IEA), so the
      prediction is correct but not novel.
    supported_by:
    - reference_id: file:EQUAS/ORC5/ORC5-bioinformatics/human_O43913-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Nucleus {ECO:0000269|PubMed:31160578}.'
    - reference_id: PMID:32808929
      supporting_text: The Origin Recognition Complex (ORC) is necessary for orchestrating the initiation
        process by binding to origin DNA, recruiting CDC6, and assembling the MCM replicative helicase
        on DNA.
