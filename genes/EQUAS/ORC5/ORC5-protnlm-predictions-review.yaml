predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0006260
    label: DNA replication
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: Human ORC5 is a subunit of ORC, which binds origins and is required to assemble the
      pre-replication complex that initiates DNA replication. This product, A0A9L0JAR4, keeps the
      AAA+ domain with the Walker A P-loop (GHTASGKT), the lid and the winged-helix with the
      DNA-proximal H398, matching human ORC5 at 402 of residues 1-420; it lacks only the last 14
      residues of the canonical C-terminus, which are replaced by an alternative segment and have no
      known role in ORC assembly or replication. DNA replication is therefore correct for this
      product. Donkey GOA contains this exact term (combined IEA) and the more specific descendant
      DNA replication initiation (TreeGrafter), so the prediction is less precise than an existing
      annotation.
    supported_by:
    - reference_id: file:EQUAS/ORC5/ORC5-bioinformatics/human_O43913-uniprot.txt
      supporting_text: |-
        ORC is required to assemble the pre-replication complex necessary
        CC       to initiate DNA replication.
    - reference_id: file:EQUAS/ORC5/ORC5-bioinformatics/RESULTS-rereview.md
      supporting_text: 'Human ORC5 Walker A (residues 37-44) GHTASGKT vs A0A9L0JAR4 GHTASGKT; human DNA-proximal
        beta-hairpin H398 vs A0A9L0JAR4 residue 398 H.'
    - reference_id: file:EQUAS/ORC5/ORC5-bioinformatics/RESULTS-rereview.md
      supporting_text: 'Residues 1-420: 402/420 identical to human; human 421-435 RTVNFDIIKYLYDFL vs A0A9L0JAR4
        421-440 RGPPKTCLQTHKNRLTMSSH.'
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0005634
    label: nucleus
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: Human ORC5 is experimentally localized to the nucleus and chromatin (PMID:9765232;
      PMID:31160578 via UniProt), and ORC acts on nuclear replication origins. Human ORC5 has no
      annotated nuclear localization signal in its C-terminal 14 residues, the only canonical region
      this product A0A9L0JAR4 lacks; it retains the AAA+, lid and winged-helix regions that build the
      ORC2-5 core, so nuclear localization is expected for this product. The exact term is already in
      donkey GOA (combined IEA), so the prediction is correct but not novel.
    supported_by:
    - reference_id: file:EQUAS/ORC5/ORC5-bioinformatics/human_O43913-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Nucleus {ECO:0000269|PubMed:31160578}.'
    - reference_id: PMID:9765232
      supporting_text: The bulk of HsORC5p is in an insoluble nuclear fraction
    - reference_id: PMID:32808929
      supporting_text: The Origin Recognition Complex (ORC) is necessary for orchestrating the initiation
        process by binding to origin DNA, recruiting CDC6, and assembling the MCM replicative helicase
        on DNA.
