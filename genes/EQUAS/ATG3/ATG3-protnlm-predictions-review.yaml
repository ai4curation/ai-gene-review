id: A0A9L0IHI0
gene_symbol: ATG3
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: >-
  Assessment of the single ProtNLM2 GO prediction for donkey ATG3 (A0A9L0IHI0, DONKEY40 cohort), using
  the reviewed human ortholog Q9NT62, human ATG3 literature, and a donkey-human alignment (98.41% identity,
  catalytic cysteine conserved, 28-residue insertion in the donkey model). The prediction, cytoplasm, is
  correct but less precise than the cytosol and phagophore assembly site annotations already in donkey GOA
  from TreeGrafter (LSP); the ProtNLM2 evidence record cites phagophore assembly site. ProtNLM2 emitted no
  function text or subcellular-location statement for this accession in the snapshot.
