    summary: Human ATG3 is experimentally cytoplasmic and acts as a soluble E2 that is recruited to phagophore
      membranes; the donkey protein is 98.4% identical with the catalytic cysteine and membrane-sensing
      N-terminus conserved, so cytoplasm is correct. Donkey GOA already contains cytosol and phagophore assembly
      site (TreeGrafter), both part of cytoplasm in GO, so the prediction is less precise than existing
      annotation. Training-set membership is unknown.
