- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000305319
  review:
    summary: TreeGrafter autophagy of mitochondrion from PTN000305319.
    action: KEEP_AS_NON_CORE
    reason: Mitophagy uses the core LC3-lipidation machinery that ATG3 supplies, so the inherited family
      assertion (also on human ATG3 by IBA) is reasonable, but it is one of several selective forms of
      autophagy rather than a distinct ATG3 function. The separate ATG12-ATG3 role in mitochondrial homeostasis
