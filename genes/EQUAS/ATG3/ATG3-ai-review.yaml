  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000305319
  review:
    summary: TreeGrafter Atg8-family ligase activity from PTN000305319. In GO this term sits under ubiquitin-like
      protein ligase activity (the E3 class), whereas ATG3 is the E2 that receives ATG8-family proteins
      from ATG7 as a thioester and transfers them to PE.
    action: MODIFY
    reason: The activity is real, but GO:0141046 Atg8-family conjugating enzyme activity (under ubiquitin-like
      protein conjugating enzyme activity, the E2 class) describes the thioester-relay mechanism of ATG3
      more precisely. Human ATG3 already carries GO:0141046 by IDA.
    proposed_replacement_terms:
    - id: GO:0141046
      label: Atg8-family conjugating enzyme activity
    supported_by:
    - reference_id: PMID:37252361
      supporting_text: ATG7 functions as an activating E1 enzyme using ATP to form a thioester with LC3/GABARAP
        and transferring them to an E2 enzyme, ATG3, via a trans-thioesterification reaction.
    - reference_id: PMID:24186333
      supporting_text: Atg3 likely cycles back and forth between binding to Atg7 for loading with the
        UBL LC3 and binding to E3 to promote LC3 lipidation
