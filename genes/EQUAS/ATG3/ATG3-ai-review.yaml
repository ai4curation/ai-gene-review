- description: E2-like enzyme that accepts ATG8-family proteins (LC3/GABARAP) from ATG7 as a thioester
    on its catalytic cysteine and, with the ATG12~ATG5-ATG16L1 E3, conjugates them to phosphatidylethanolamine
    on the phagophore membrane, driving autophagosome assembly.
