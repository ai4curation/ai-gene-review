gene_symbol: ATG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: ATG3 is the E2-like conjugating enzyme of the autophagy ubiquitin-like conjugation system
  that lipidates ATG8-family proteins (LC3s and GABARAPs). After the E1 ATG7 activates an ATG8-family
  protein, ATG3 receives it as a thioester on its catalytic cysteine and, together with the E3-like ATG12~ATG5-ATG16L1
  complex, transfers its C-terminal glycine to phosphatidylethanolamine in the phagophore membrane. An
  N-terminal amphipathic helix senses membrane curvature and lipid-packing defects, restricting lipidation
  to the growing phagophore, and a noncanonical LIR motif engages LC3/GABARAP. ATG3 also catalyzes its
  own conjugation to ATG12; the ATG12-ATG3 conjugate affects mitochondrial homeostasis and late endosome
  function. ATG3 is cytosolic and is recruited to phagophore membranes. The donkey protein is 98.4% identical
  to human ATG3, keeps the catalytic cysteine, and carries a 28-residue insertion in its catalytic core
  region that is absent from the human protein.
