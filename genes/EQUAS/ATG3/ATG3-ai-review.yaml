id: A0A9L0IHI0
gene_symbol: ATG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: ATG3 is the E2-like conjugating enzyme of the autophagy ubiquitin-like conjugation system
  that lipidates ATG8-family proteins (LC3s and GABARAPs). After the E1 ATG7 activates an ATG8-family
  protein, ATG3 receives it as a thioester on its catalytic cysteine and, together with the E3-like ATG12~ATG5-ATG16L1
  complex, transfers its C-terminal glycine to phosphatidylethanolamine in the phagophore membrane. An
  N-terminal amphipathic helix senses membrane curvature and couples it to the catalytic core, restricting
  lipidation to the highly curved rim of the growing phagophore, and a noncanonical LIR motif engages
  LC3/GABARAP. ATG3 also acts as the E2 for its own conjugation to ATG12 on a single lysine; the ATG12-ATG3
  conjugate is dispensable for starvation-induced autophagy but affects mitochondrial homeostasis and
  late endosome function. ATG3 is cytosolic and is recruited to phagophore membranes. The donkey ATG3
  gene encodes at least two products that differ by a 28-residue segment inserted after residue 222;
  this entry is the 342-residue long splice form, which keeps the catalytic cysteine and the ATG12-acceptor
  lysine, while the 314-residue product matches human ATG3 in length and is 98.4% identical to it.
existing_annotations:
- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000305319
  review:
    summary: TreeGrafter transfer from PANTHER node PTN000305319 (ATG3 subfamily PTHR12866:SF2, to which
      donkey, human and yeast ATG3 all belong). ATG3-dependent LC3/GABARAP lipidation is one of the key
      steps of phagophore expansion.
    action: ACCEPT
    reason: ATG3 performs the lipidation step of autophagosome biogenesis (it catalyzes the transfer of
      ATG8-family proteins to PE), so it does part of the work of the process; human ATG3 has IMP support
      (PMID:33446636). The donkey protein sits in the same PANTHER subfamily as human and yeast ATG3,
      and both donkey splice products keep the catalytic cysteine. Whether the 28-residue insertion specific
      to this long splice form alters activity is untested; the annotation is accepted at the gene level.
    supported_by:
    - reference_id: PMID:33446636
      supporting_text: During autophagy the enzyme Atg3 catalyzes the covalent conjugation of LC3 to
        the amino group of phosphatidylethanolamine (PE) lipids, which is one of the key steps in autophagosome
        formation.
    - reference_id: PMID:37252361
      supporting_text: Membrane tethering of LC3/GABARAP is crucial for membrane expansion of autophagosomes
        to engulf the autophagic cargo
    - reference_id: file:EQUAS/ATG3/ATG3-bioinformatics/RESULTS-rereview.md
      supporting_text: the catalytic Cys-264 of human ATG3 is Cys-264 in A0A9L0J149 and Cys-292 in A0A9L0IHI0
