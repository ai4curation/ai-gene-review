suggested_questions:
- question: Is the 342-residue ATG3 splice form, whose extra 28-residue exon is predicted in both donkey
    and horse genomes but absent from human, expressed as protein in equid tissues, and does the insertion
    (21 residues upstream of the ATG12-acceptor lysine) alter LC3 lipidation or ATG12 autoconjugation?
suggested_experiments:
- description: Express the 342-residue and 314-residue donkey ATG3 products in ATG3-knockout cells and
    compare LC3-II formation, ATG12-ATG3 conjugate formation and in vitro LC3-PE conjugation, and use
    RT-PCR across the extra exon to measure how much of the long transcript is made in donkey tissues.
