suggested_questions:
- question: Is the 28-residue insertion in this donkey ATG3 model (after human residue 222) a real conserved
    exon in equids, and does it alter LC3 lipidation or ATG12 autoconjugation?
suggested_experiments:
- description: Express the 342-residue donkey ATG3 model and the 314-residue form in ATG3-knockout cells
    and compare LC3-II formation and in vitro LC3-PE conjugation, to test whether the insertion is tolerated.
