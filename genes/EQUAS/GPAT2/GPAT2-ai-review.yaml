id: A0A9L0ILJ0
gene_symbol: GPAT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: GPAT2 is a mitochondrial glycerol-3-phosphate acyltransferase of the GPAT/DHAPAT family
  (PANTHER subfamily GLYCEROL-3-PHOSPHATE ACYLTRANSFERASE 2, MITOCHONDRIAL). Its characterised mouse
  ortholog transfers a fatty acyl group from acyl-CoA, preferring arachidonoyl-CoA, to sn-glycerol
  3-phosphate to form lysophosphatidic acid, the first step of de novo glycerolipid synthesis, and its
  overexpression raises arachidonate-rich triacylglycerol. The protein spans the mitochondrial outer
  membrane twice with its N- and C-terminal regions in the cytosol. Expression is largely restricted to
  spermatocytes, where the mouse protein binds the PIWI protein MILI/PIWIL2 and is required for primary
  piRNA biogenesis by a mechanism that does not need its acyltransferase catalytic motif. This donkey
  entry is one of three gene models from the same locus; it keeps the acyltransferase domain, the HXXXXD
  motif and both transmembrane segments but ends in a C-terminal tail of about 85 residues that differs
  from the conserved GPAT2 C-terminus present in the full-length 800-residue model.
