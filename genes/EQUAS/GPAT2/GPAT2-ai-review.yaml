suggested_questions:
- question: Does the divergent C-terminus of this donkey GPAT2 model (from about residue 632) reflect
    a real equid exon, and does it change mitochondrial outer membrane topology or PIWIL2 binding?
suggested_experiments:
- description: Test a catalytically dead (HXXXXD-mutant) donkey or human GPAT2 for rescue of piRNA production
    and PIWIL2 localization in Gpat2-deficient germline stem cells, and map the PIWIL2-binding region.
