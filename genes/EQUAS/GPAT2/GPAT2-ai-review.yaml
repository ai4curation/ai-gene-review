      for primary piRNA processing in germ cells, independently of its acyltransferase activity.
    action: ACCEPT
    reason: The requirement does not rest on catalysis or lipid supply, and the protein binds PIWIL2 on
      the mitochondrial outer membrane, the site of primary piRNA processing; this argues that GPAT2 contributes
