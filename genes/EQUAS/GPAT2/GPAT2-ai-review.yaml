- term:
    id: GO:0034587
    label: piRNA processing
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008998243
  review:
    summary: TreeGrafter piRNA processing from the GPAT2-subfamily node PTN008998243; the term is not on
      the ancestral GPAT1/GPAT2 node, so it is a subfamily-specific placement. Mouse Gpat2 co-precipitates
      with MILI/PIWIL2 from testis, its knockdown in germline stem cells abolishes primary piRNA production,
      and HXXXXD-mutant Gpat2 still rescues.
    action: ACCEPT
    reason: The knockdown phenotype alone would only show necessity, but two further observations argue
      that GPAT2 itself takes part in the processing machinery rather than supplying a lipid metabolite
      upstream. Its requirement does not depend on the catalytic motif, and it binds the PIWI protein MILI
      on the mitochondrial outer membrane, the site of primary piRNA processing; the authors propose a
      scaffold role. The donkey model lies in the same subfamily that carries this term. The PIWIL2-binding
      region is not mapped, so the effect of this model's divergent C-terminus is unknown.
    supported_by:
    - reference_id: PMID:23611983
      supporting_text: These data clearly show that GPAT2 plays a critical role in primary processing during
        piRNA production.
    - reference_id: PMID:23611983
      supporting_text: These data suggest that the acyltransferase activity of GPAT2 is dispensable for the
        biogenesis of piRNA.
    - reference_id: PMID:23611983
      supporting_text: Binding of MILI to GPAT2 was confirmed by coimmunoprecipitation analysis of testis
        samples
