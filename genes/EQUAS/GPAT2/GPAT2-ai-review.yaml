gene_symbol: GPAT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: GPAT2 is a mitochondrial glycerol-3-phosphate acyltransferase of the GPAT/DHAPAT family.
  It transfers a fatty acyl group from acyl-CoA (preferring arachidonoyl-CoA) to the sn-1 position of
  sn-glycerol 3-phosphate to form lysophosphatidic acid, the first step of de novo glycerophospholipid
  and triacylglycerol synthesis, and in vitro can also acylate lysophosphatidic acid to phosphatidic acid.
  The enzyme is anchored in the mitochondrial outer membrane. In the mouse germline, Gpat2 is enriched
  in testis, binds the PIWI protein MILI/PIWIL2 and is required for primary piRNA processing, a role that
  does not depend on its acyltransferase activity. The donkey protein is 80% identical to human GPAT2
  and keeps the HXXXXD catalytic motif, but its C-terminal ~85 residues differ from the human sequence.
