- term:
    id: GO:0006631
    label: fatty acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008998243
  review:
    summary: TreeGrafter fatty acid metabolic process from PTN008998243. In the cached PAINT data this term
      is placed only at a bacterial PlsB node (PTN000285870), not at the eukaryotic GPAT node.
    action: MARK_AS_OVER_ANNOTATED
    reason: The fatty acyl-CoA is a co-substrate that is esterified onto glycerol 3-phosphate; GPAT2 does
      not synthesise, degrade or modify fatty acids, so fatty acid metabolism overstates its role. The acyl-chain
      preference for arachidonoyl-CoA is better described by the glycerolipid synthesis terms. Not removed
      because acyl-CoA is consumed by the reaction.
    supported_by:
    - reference_id: PMID:22905194
      supporting_text: GPAT2 overexpression increased AGPAT activity ∼50% with oleoyl-CoA and 2- fold when
        arachidonoyl-CoA was used as substrate, confirming the preference of GPAT2 for this fatty acid.
