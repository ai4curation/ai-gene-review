suggested_questions:
- question: Is the alternative last exon of the 718-residue donkey GPAT2 model (A0A9L0ILJ0) expressed in
    donkey testis, or is the 800-residue model with the conserved C-terminus (A0A8C4KXU5) the only product?
- question: Which region of GPAT2 binds MILI/PIWIL2, and does it lie in the C-terminal segment that differs
    between the donkey gene models?
suggested_experiments:
- description: RT-PCR or long-read sequencing of donkey testis RNA across the GPAT2 3' exons to determine
    which C-terminal exon is used.
- description: Map the MILI/PIWIL2-binding region of GPAT2 by co-immunoprecipitation of truncation mutants,
    and test whether a catalytically dead GPAT2 lacking the conserved C-terminus still rescues primary piRNA
    production in Gpat2-knockdown germline stem cells.
