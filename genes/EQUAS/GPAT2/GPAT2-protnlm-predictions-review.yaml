predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0008374
    label: O-acyltransferase activity
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: The GPAT2 subfamily esterifies acyl-CoA onto the sn-1 hydroxyl of glycerol 3-phosphate, an
      O-acyl transfer, and the donkey protein conserves the HXXXXD motif essential for acyltransferase activity,
      so the predicted activity is correct in substance. The term is obsolete in the current GO release
      (an unnecessary grouping class, replaced by GO:0016747, which is also in donkey GOA from InterPro2GO).
      Donkey GOA already carries the specific glycerol-3-phosphate O-acyltransferase activity (TreeGrafter),
      so the prediction is less precise than existing annotation. The obsolete identifier itself is a defect
      of the emitted term, not of the biology. Training-set membership is unknown.
    supported_by:
    - reference_id: file:EQUAS/GPAT2/GPAT2-bioinformatics/human-Q6NUI2-uniprot.txt
      supporting_text: 'CC       Reaction=sn-glycerol 3-phosphate + an acyl-CoA = a 1-acyl-sn-glycero-3-'
    - reference_id: file:EQUAS/GPAT2/GPAT2-bioinformatics/human-Q6NUI2-uniprot.txt
      supporting_text: 'CC   -!- DOMAIN: The HXXXXD motif is essential for acyltransferase activity and'
    - reference_id: file:EQUAS/GPAT2/GPAT2-bioinformatics/RESULTS.md
      supporting_text: the HXXXXD catalytic motif (human 205-210) is conserved in donkey as H205, K206, L209,
        D210 at the same positions
