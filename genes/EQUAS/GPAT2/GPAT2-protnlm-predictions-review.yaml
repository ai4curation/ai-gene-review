id: A0A9L0ILJ0
gene_symbol: GPAT2
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: >-
  Assessment of the single ProtNLM2 GO prediction for donkey GPAT2 (A0A9L0ILJ0, DONKEY40 cohort), using
  the reviewed human ortholog Q6NUI2 (whose functional statements are by similarity to mouse Gpat2) and
  a donkey-human alignment (80.25% identity, HXXXXD catalytic motif conserved, divergent donkey C-terminus).
  The predicted GO:0008374 O-acyltransferase activity is an obsolete grouping class (QuickGO: replaced by
  GO:0016747); the activity it names is correct but less precise than glycerol-3-phosphate O-acyltransferase
  activity, which donkey GOA already has from TreeGrafter and which the ProtNLM2 evidence record cites (LSP).
  Non-GO ProtNLM2 output for this accession, not scored here: a function statement, "Esterifies acyl-group
  from acyl-ACP to the sn-1 position of glycerol-3-phosphate, an essential step in glycerolipids biosynthesis
  such as triglycerides, phosphatidic acids and lysophosphatidic acids" (supported by a phmmer match to human
  GPAT1/GPAM Q9HCL2 rather than GPAT2; the acyl-ACP wording follows UniProt text, whereas the mammalian
  catalytic-activity lines use acyl-CoA). No subcellular-location statement was emitted.
