predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0008374
    label: O-acyltransferase activity
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: The GPAT2 subfamily esterifies acyl-CoA onto the sn-1 hydroxyl of glycerol 3-phosphate, an
      O-acyl transfer; overexpressed mouse Gpat2 raises GPAT activity with arachidonoyl-CoA, and the donkey
      model conserves the acyltransferase domain and HXXXXD motif, so the predicted activity is correct in
      substance. Scored for this product, A0A9L0ILJ0 (718 aa) keeps the acyltransferase domain (199-333),
      the HXXXXD motif and both transmembrane segments of the full-length 800-residue model A0A8C4KXU5, and
      lacks only the conserved GPAT2 C-terminal region (about 85 residues replaced by a different tail),
      which is not the catalytic region, so the activity does not depend on a feature this product lacks. The term is obsolete in the current GO release (an unnecessary grouping class, replaced
      by GO:0016747, which is also in donkey GOA from InterPro2GO). Donkey GOA already carries the specific
      glycerol-3-phosphate O-acyltransferase activity (TreeGrafter), accepted as core in the gene review,
      so the prediction is less precise than existing annotation. The obsolete identifier is a defect of
      the emitted term, not of the biology. Training-set membership is unknown.
    supported_by:
    - reference_id: PMID:22905194
      supporting_text: GPAT2 overexpression significantly increased both GPAT and AGPAT activities only
        when arachidonoyl-CoA was used as a substrate
    - reference_id: file:EQUAS/GPAT2/GPAT2-bioinformatics/human-Q6NUI2-uniprot.txt
      supporting_text: 'CC   -!- DOMAIN: The HXXXXD motif is essential for acyltransferase activity and'
    - reference_id: file:EQUAS/GPAT2/GPAT2-bioinformatics/RESULTS-rereview.md
      supporting_text: The benchmark A0A9L0ILJ0 matches A0A8C4KXU5 through the acyltransferase domain, the
        HXXXXD motif
    - reference_id: file:EQUAS/GPAT2/GPAT2-bioinformatics/RESULTS.md
      supporting_text: the HXXXXD catalytic motif (human 205-210) is conserved in donkey as H205, K206, L209,
        D210 at the same positions
