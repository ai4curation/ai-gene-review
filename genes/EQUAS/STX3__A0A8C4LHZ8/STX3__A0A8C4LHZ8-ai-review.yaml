- term:
    id: GO:0016324
    label: apical plasma membrane
  evidence_type: ISS
  original_reference_id: PMID:16785322
  review:
    summary: Proposed location. Mammalian syntaxin 3 localises to the apical plasma membrane of polarised
      epithelial cells through an N-terminal FMDE motif, and the donkey protein carries this motif at the
      same position (residues 31-34).
    action: NEW
    reason: The apical location is shown experimentally in several mammals (human intestinal Caco-2 cells,
      canine MDCK cells, rat intestine), and its determinant is a defined sequence signal whose critical
      residues (F31, D33, E34) are conserved in this donkey ortholog of the same PANTHER subfamily. PAINT
      does not assert apical plasma membrane at any syntaxin node, probably because the FMDE motif is also
      present in syntaxins 1 and 2 and apical sorting is a property of polarised cells rather than of the
      family; the transfer here is therefore made on ortholog and motif evidence specific to syntaxin 3A,
      not on family-level inference.
    supported_by:
    - reference_id: PMID:16785322
      supporting_text: This result indicates that the apical targeting signal of syntaxin 3 is centered
        around the first four residues (FMDE) of this conserved motif and that the residues F31, D33, and
        E34 play a critical role.
    - reference_id: PMID:9701566
      supporting_text: We demonstrate here that Munc-18-2 colocalizes with syntaxin 3 at the apical plasma
        membrane of intestinal epithelium and Caco-2 cells.
    - reference_id: file:EQUAS/STX3__A0A8C4LHZ8/STX3__A0A8C4LHZ8-bioinformatics/RESULTS.md
      supporting_text: 'FMDE apical targeting motif: present at residues 31-34, the same position as the F31,
        D33 and E34 residues shown to be required for apical targeting of syntaxin 3 (PMID:16785322).'
