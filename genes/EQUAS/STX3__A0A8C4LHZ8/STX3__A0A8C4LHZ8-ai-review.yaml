  review:
    summary: TreeGrafter transfer of SNARE binding. Syntaxin 3 forms complexes with the Qbc-SNARE SNAP-23 and
      R-SNAREs such as cellubrevin and VAMP7 in epithelial cells, and its binding to these partners is
      regulated by Munc18-2.
    action: ACCEPT
    reason: Direct binding of syntaxin 3 to its cognate SNAREs is the molecular basis of its fusogenic
      activity and is experimentally shown for mammalian syntaxin 3A orthologs, which share 96-98 percent
      identity with this donkey protein and sit in the same PANTHER subfamily (PTHR19957:SF34). SNARE binding
      is as specific as GO currently allows for the cognate-SNARE interaction, so it is accepted alongside
      the fusogenic activity term.
