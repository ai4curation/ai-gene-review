gene_symbol: STX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: STX3 (syntaxin-3) is a tail-anchored Qa-SNARE of the syntaxin family. This product is the donkey
  syntaxin 3A splice form, a 289-residue protein with an N-terminal Habc three-helix regulatory domain, a
  C-terminal SNARE motif and a single C-terminal transmembrane anchor. In mammals syntaxin 3A is the plasma
  membrane syntaxin of polarised epithelia, where an FMDE motif in its N-terminal region (conserved in the
  donkey protein) sorts it to the apical plasma membrane. There it pairs with SNAP-23 and VAMP7 or related
  R-SNAREs, under the control of the SM protein Munc18-2 (STXBP2), to form SNARE complexes that drive fusion
  of apical carriers with the plasma membrane, delivering apical cargo such as CFTR and transporters and
  supporting brush-border and epithelial polarity; loss of human STX3 causes variant microvillus inclusion
  disease. Syntaxin 3 also mediates regulated granule exocytosis, including compound exocytosis in mast
  cells and insulin granule fusion in beta cells, and postsynaptic AMPA receptor exocytosis during
  hippocampal long-term potentiation. No function has been tested experimentally for the donkey protein;
  all functions are inferred from its near-identical syntaxin 3A orthologs in the same PANTHER subfamily.
