    label: nucleoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0190
  review:
    summary: >-
      SubCell mapping of nucleoplasm. The SMN complex, including its GEMIN6-GEMIN7
      subunit partners, is present in the nucleoplasm as well as in gems and the
      cytoplasm in human cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct for the nuclear pool of the SMN complex, and as precise as the
