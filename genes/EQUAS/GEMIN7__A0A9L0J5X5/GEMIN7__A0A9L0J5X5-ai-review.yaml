- id: PMID:12065586
  title: Identification and characterization of Gemin7, a novel component of the survival
    of motor neuron complex.
  findings:
  - statement: Human Gemin7 is an SMN complex component that binds SMN and Gemin6 directly,
      bridges Gemin6 to the complex, binds Sm proteins (notably SmE) and colocalises
      with SMN in cytoplasm and gems.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Discovery paper for human GEMIN7; abstract-only in cache.
- id: PMID:15939020
  title: The Gemin6-Gemin7 heterodimer from the survival of motor neurons complex has
    an Sm protein-like structure.
  findings:
  - statement: Crystal structure shows Gemin6 and Gemin7 each adopt Sm folds and form an
      Sm-like heterodimer that binds Sm proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human proteins; abstract-only in cache.
- id: PMID:16434402
  title: Gemin8 is a novel component of the survival motor neuron complex and functions
    in small nuclear ribonucleoprotein assembly.
  findings:
  - statement: SMN complex (SMN, Gemin2-7) localises to cytoplasm, nucleoplasm and gems;
      Gemin8 binds the Gemin6-Gemin7 heterodimer.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Used for SMN complex localisation and module architecture.
- id: PMID:17023415
  title: Gemin8 is required for the architecture and function of the survival motor
    neuron complex.
  findings:
  - statement: Gemin6, Gemin7 and Unrip form a stable cytoplasmic subunit tethered to SMN
      by Gemin8 and involved in recruiting Sm proteins to snRNP assembly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:17640873
  title: SMN-independent subunits of the SMN complex. Identification of a small nuclear
    ribonucleoprotein assembly intermediate.
  findings:
  - statement: Gemin6-Gemin7-unrip is a stable SMN-independent subunit; snRNA binding is
      a property of Gemin5-containing subunits.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:18984161
  title: An assembly chaperone collaborates with the SMN complex to generate spliceosomal
    SnRNPs.
  findings:
  - statement: The SMN complex accepts pICln-trapped Sm proteins and catalyses Sm ring
      closure on snRNA.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complex-level mechanism; does not single out GEMIN7 in the abstract.
- id: PMID:19321448
  title: Role of survival motor neuron complex components in small nuclear ribonucleoprotein
    assembly.
  findings:
  - statement: Gemin7 knockdown decreases snRNP assembly activity and SmE in the SMN complex;
      Unrip can remove Gemin7 from SMN-Gemin2-Gemin7, consistent with exchange of
      Gemin6-Gemin7 for SmD3-SmB during assembly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:33754639
  title: Identification and structural analysis of the Schizosaccharomyces pombe SMN complex.
  findings:
  - statement: The S. pombe SMN complex contains Gemin6 and Gemin7, recruited by Gemin8
      onto an SMN oligomer platform.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Establishes the subfamily's SMN-complex role outside mammals.
- id: file:EQUAS/GEMIN7__A0A9L0J5X5/GEMIN7__A0A9L0J5X5-bioinformatics/RESULTS.md
