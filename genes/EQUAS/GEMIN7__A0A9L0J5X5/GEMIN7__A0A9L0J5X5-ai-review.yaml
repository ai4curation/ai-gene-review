core_functions:
- description: >-
    Subunit of the SMN complex that, as an Sm-like heterodimer with GEMIN6 tethered by
    GEMIN8 and bound directly to SMN, contacts Sm proteins (notably SmE) and helps
    recruit them for SMN-complex-catalysed assembly of the Sm core of spliceosomal
    snRNPs in the cytoplasm. Inferred from human (and fission yeast) GEMIN7 in the same
    PANTHER subfamily; not tested in donkey.
  directly_involved_in:
  - id: GO:0000387
    label: spliceosomal snRNP assembly
  in_complex:
    id: GO:0034719
    label: SMN-Sm protein complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:12065586
    supporting_text: >-
      Gemin7 interacts directly with SMN and Gemin6 and mediates the association of
      Gemin6 with the SMN complex.
  - reference_id: PMID:17023415
    supporting_text: >-
      the involvement of the heteromeric subunit containing Gemin6,
      Gemin7, Gemin8, and Unrip in the recruitment of Sm proteins to the snRNP
      assembly pathway
  - reference_id: PMID:19321448
    supporting_text: Gemin7 knockdown revealed a decrease in snRNP assembly activity
  - reference_id: file:EQUAS/GEMIN7__A0A9L0J5X5/GEMIN7__A0A9L0J5X5-bioinformatics/RESULTS.md
    supporting_text: >-
      It is the same length as
      human GEMIN7 and highly identical across its full length, so it is a full-length ortholog of the human
      protein.
suggested_questions:
- question: >-
    Human GEMIN7 carries GO:0032797 SMN complex by IDA and S. pombe Gem7 is an SMN complex
    subunit, yet the PAINT GEMIN7 node propagates only the broader Sm-like protein family
    complex; is that a deliberate choice, or should SMN complex be placed at the node?
- question: >-
    Does the GEMIN6-GEMIN7 Sm-like heterodimer contact snRNA at any stage of Sm core
    assembly, or is it purely a protein interaction module?
suggested_experiments:
- description: >-
    Test purified GEMIN6-GEMIN7 heterodimer for binding to U snRNA Sm-site
    oligonucleotides by fluorescence anisotropy, with an Sm protein ring as positive
    control, to settle whether the RNA binding annotation has any basis.
  experiment_type: in vitro binding assay
