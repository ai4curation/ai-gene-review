id: A0A9L0J5X5
gene_symbol: GEMIN7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: >-
  GEMIN7 (gem-associated protein 7) is a small subunit of the SMN complex, the
  cytoplasmic machine that assembles the heptameric Sm protein ring onto small
  nuclear RNAs to form the core of spliceosomal snRNPs. A0A9L0J5X5 is the
  131-residue product of the donkey GEMIN7 gene, the same length as human GEMIN7,
  87.8% identical to it, and in the same PANTHER subfamily (PTHR14679:SF1) as the
  experimentally studied human and fission yeast proteins. By orthology with those
  proteins, GEMIN7 has an N-terminal, partly disordered arginine/glycine-containing
  segment that binds SMN and a C-terminal Sm-like fold through which it forms a
  heterodimer with GEMIN6. The GEMIN6-GEMIN7 heterodimer, together with GEMIN8 and
  STRAP/UNRIP, forms a peripheral module tethered to the SMN core by GEMIN8; this
  module binds Sm proteins, notably SmE, and helps recruit them for Sm core
  assembly, and is thought to be displaced from the maturing snRNP late in assembly.
  GEMIN7 is found with SMN in the cytoplasm, in the nucleoplasm and in nuclear gems.
  None of these functions has been tested in donkey; all are inferred from orthologs.
existing_annotations:
- term:
    id: GO:0000387
    label: spliceosomal snRNP assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001428136
  review:
    summary: >-
      TreeGrafter transfer of spliceosomal snRNP assembly. Human GEMIN7 is an
      integral SMN complex subunit; the GEMIN6-GEMIN7-GEMIN8-UNRIP module recruits
      Sm proteins to the assembly pathway, and GEMIN7 knockdown lowers snRNP
      assembly activity. The same term is placed by PAINT at the GEMIN7 family node
      for human GEMIN7. The donkey protein is in the same PANTHER subfamily.
    action: ACCEPT
    reason: >-
      GEMIN7 does part of the work of the process: as part of the SMN complex it
      binds and recruits Sm proteins for assembly onto snRNA, so this is
      participation rather than mere necessity. Experimentally established in
      human cells; transferred to donkey on PANTHER subfamily membership
      (PTHR14679:SF1) and full-length conservation.
    supported_by:
    - reference_id: PMID:17023415
      supporting_text: >-
        the involvement of the heteromeric subunit containing Gemin6,
        Gemin7, Gemin8, and Unrip in the recruitment of Sm proteins to the snRNP
        assembly pathway
    - reference_id: PMID:19321448
      supporting_text: Gemin7 knockdown revealed a decrease in snRNP assembly activity
    - reference_id: PMID:18984161
      supporting_text: >-
        Our data identify
        pICln as an assembly chaperone and the SMN complex as a catalyst of spliceosomal
        snRNP formation.
    - reference_id: file:EQUAS/GEMIN7__A0A9L0J5X5/GEMIN7__A0A9L0J5X5-bioinformatics/RESULTS.md
      supporting_text: >-
        The donkey protein sits in the same PANTHER family and subfamily (PTHR14679:SF1, the only subfamily of
        PTHR14679) as the experimentally characterised human GEMIN7 and S. pombe Gem7.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR047575
  - UniRule:UR001714480
  review:
    summary: >-
      Combined automatic RNA binding call driven by the Sm domain signature
      (InterPro IPR047575 / PROSITE PS52002). In GEMIN7 the Sm-like fold mediates
      heterodimerisation with GEMIN6 and contacts with Sm proteins; the cited
      experimental work describes protein-protein interactions only, and snRNA
      recognition within the SMN complex is attributed to GEMIN5-containing
      subunits. I found no evidence that GEMIN7 binds RNA directly.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Inference from domain architecture alone. Sm folds do not imply RNA binding
      in this family: GEMIN6 and GEMIN7 lack Sm sequence similarity and use the
      fold as a protein interaction surface. Direct RNA binding by GEMIN7 has not
      been shown in any species, so this term overstates what is known.
    supported_by:
    - reference_id: PMID:15939020
      supporting_text: >-
        Although Gemin6 and Gemin7 have no
        significant sequence similarity with Sm proteins, both adopt canonical Sm folds.
    - reference_id: PMID:17640873
      supporting_text: >-
        We further show that the
        Gemin5-containing subunits bind small nuclear RNA independently of the SMN
        complex
- term:
