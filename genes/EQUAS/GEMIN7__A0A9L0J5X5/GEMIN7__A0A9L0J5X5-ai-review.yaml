- term:
    id: GO:0120114
    label: Sm-like protein family complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN001428136
  review:
    summary: >-
      TreeGrafter transfer of Sm-like protein family complex; the same term is a
      PAINT IBA for human GEMIN7. GEMIN7 has an Sm fold, heterodimerises with the
      Sm-fold protein GEMIN6, and is part of the SMN-Sm protein complex, which
      contains Sm proteins.
    action: ACCEPT
    reason: >-
      Consistent with the term definition (a complex containing Like-Sm family
      proteins plus additional members) and with a PAINT curator's node placement
      covering fungi and mammals. It is not an ontological ancestor of SMN-Sm
      protein complex, so it adds a family-level complex classification rather than
