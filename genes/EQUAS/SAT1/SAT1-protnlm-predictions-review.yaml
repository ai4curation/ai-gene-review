predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0009447
    label: putrescine catabolic process
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: Not in donkey GOA, which has the broader polyamine metabolic process. SAT1's experimentally established
      substrates are spermidine and spermine (also norspermidine, 1,3-diaminopropane and 1,5-diaminopentane);
      their N1-acetylation and oxidation generate putrescine rather than consume it, so the established catabolic
      role is in spermidine/spermine back-conversion. Human UniProt assigns a UniPathway step 'N-acetylputrescine
      from putrescine' and human GOA carries putrescine catabolic process only electronically from that mapping;
      none of the cached SAT1 studies reports putrescine acetylation. The allowed evidence therefore neither validates
      nor refutes a physiological role of SAT1 in putrescine catabolism.
    supported_by:
    - reference_id: file:human/SAT1/SAT1-uniprot.txt
      supporting_text: norspermidine = spermidine >> spermine
    - reference_id: file:human/SAT1/SAT1-uniprot.txt
      supporting_text: 'GO:0009447; P:putrescine catabolic process; IEA:UniProtKB-UniPathway.'
    - reference_id: PMID:1985966
      supporting_text: rate-limiting enzyme in the catabolism of polyamines
