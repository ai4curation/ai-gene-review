id: A0A9L0KCT9
gene_symbol: SAT1
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of the single ProtNLM2 GO prediction for donkey SAT1 (A0A9L0KCT9), judged against the
  donkey GOA record (diamine N-acetyltransferase activity, broader transferase terms, spermidine binding, polyamine
  metabolic process, cytoplasm), the human ortholog P21673 and its characterization, and a donkey-human alignment
  (97% identity, catalytic Tyr140 conserved). The prediction, putrescine catabolic process, is not in donkey GOA
  and is neither established nor refuted by the available evidence, which is conflicting (UNC). Non-GO ProtNLM2 output, not scored -
  subcellular location 'Nucleus', which conflicts with the cytosolic localization of the human enzyme.
