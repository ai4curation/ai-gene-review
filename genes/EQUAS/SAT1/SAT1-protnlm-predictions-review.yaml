predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0009447
    label: putrescine catabolic process
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: Not in donkey GOA, which has the broader polyamine metabolic process; the donkey gene review refines
      that to polyamine, spermidine and spermine catabolic process and leaves putrescine acetylation by SAT1 as an
      open question. SAT1's established substrates are spermidine and spermine (also norspermidine and
      1,3-diaminopropane); their N1-acetylation and oxidation generate putrescine rather than consume it. Purified
      rat liver SSAT, the inducible SAT1-type enzyme, was inactive with putrescine. Against this, a mouse study
      attributes N-acetylputrescine production in the gut to Sat1, though without direct enzymology on purified
      Sat1 with putrescine, and human UniProt maps SAT1 to the UniPathway step 'N-acetylputrescine from putrescine'
      (which the human gene review keeps as a non-core role). With direct substrate-specificity data negative and
      the positive claim indirect, the evidence neither validates nor refutes a role of SAT1 in putrescine
      catabolism.
    supported_by:
    - reference_id: file:human/SAT1/SAT1-uniprot.txt
      supporting_text: norspermidine = spermidine >> spermine
    - reference_id: PMID:6615454
      supporting_text: but was inactive with putrescine, cadaverine, sym-homospermidine and N1-acetylspermidine
    - reference_id: PMID:42206375
      supporting_text: (Sat1), which catalyzed this conversion
    - reference_id: PMID:1985966
      supporting_text: rate-limiting enzyme in the catabolism of polyamines
