  supporting_entities:
  - ARBA:ARBA00026605
  review:
    summary: ARBA assignment of polyamine metabolic process. SAT1 catalyses the rate-limiting step of polyamine
      catabolism.
    action: MODIFY
    reason: The essence is correct, but SAT1 acts specifically in the catabolic branch (N1-acetylation committing
      spermidine and spermine to export or oxidative back-conversion), and it catalyses the first step of both
      spermidine and spermine catabolism. Polyamine catabolic process and its two substrate-specific descendants
      are the informative terms, matching the human SAT1 review. The paralog SAT2 was shown not to be a polyamine
      catabolic enzyme, so this process is a SAT1-subfamily property; the donkey protein is in that subfamily.
    proposed_replacement_terms:
