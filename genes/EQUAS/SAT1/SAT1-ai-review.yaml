  - PANTHER:PTN008947708
  review:
    summary: Diamine N-acetyltransferase activity (EC 2.3.1.57) from the combined IEA pipeline. Human SAT1 N1-acetylates
      spermidine and spermine using acetyl-CoA.
    action: ACCEPT
    reason: The defining activity of SAT1, experimentally established for the human enzyme (kinetics and a
      bisubstrate-inhibitor crystal structure, PMID:17516632). Transfer to donkey is grounded phylogenetically,
      not just by similarity - the donkey protein is classified in the SAT1 subfamily PTHR10545:SF36, and PAINT
      placed GO:0004145 at the vertebrate SAT1 node PTN002576187 (seeded by human, mouse and zebrafish SAT1), whose
      descendants include this ortholog. It is a full-length 171-aa product, 97% identical to human SAT1, with the
      general acid Tyr140 and general base Glu92 conserved; it is only 45% identical to SAT2 (SF51), whose kcat/Km
      for polyamines is negligible, so the subfamily boundary matters and the donkey sits on the SAT1 side.
    supported_by:
    - reference_id: PMID:17516632
      supporting_text: The N1-acetylation of spermidine and spermine by spermidine/spermine
