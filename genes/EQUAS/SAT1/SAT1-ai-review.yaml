gene_symbol: SAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: SAT1 (spermidine/spermine N1-acetyltransferase 1, SSAT1; diamine acetyltransferase 1) is a cytosolic
  GCN5-related N-acetyltransferase (GNAT) that transfers the acetyl group of acetyl-CoA to the N1 position of
  spermidine and spermine (and to related alkane-alpha,omega-diamines such as 1,3-diaminopropane). This is the
  rate-limiting step of polyamine catabolism; the N1-acetylated polyamines are exported from the cell or oxidized
  by peroxisomal acetylpolyamine oxidase, back-converting spermine to spermidine and spermidine to putrescine.
  SAT1 is a short-lived, polyamine-inducible homodimeric enzyme that fine-tunes intracellular polyamine levels;
  catalysis uses a tyrosine general acid and a glutamate-relayed general base. The donkey protein (171 aa) is a
  full-length member of the SAT1 subfamily (PANTHER PTHR10545:SF36), 97% identical to human SAT1 with both
  catalytic residues conserved, and is distinct from the SAT2 paralog (thialysine N-epsilon-acetyltransferase).
