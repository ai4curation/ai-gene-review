id: A0A9L0KCT9
gene_symbol: SAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: SAT1 (spermidine/spermine N1-acetyltransferase 1, SSAT1; diamine acetyltransferase 1) is a cytosolic
  GCN5-related N-acetyltransferase that transfers the acetyl group of acetyl-CoA to the N1 position of spermidine
  and spermine (and to related alkane-alpha,omega-diamines). This is the rate-limiting step of polyamine catabolism;
  the acetylated polyamines are exported from the cell or oxidized by polyamine oxidase, back-converting spermine
  to spermidine and spermidine to putrescine. SAT1 is a short-lived, highly inducible homodimeric enzyme that
  fine-tunes intracellular polyamine levels. The donkey protein A0A9L0KCT9 is the full-length ortholog (97% identity
  to human) with the catalytic tyrosine conserved.
