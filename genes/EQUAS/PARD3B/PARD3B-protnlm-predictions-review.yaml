predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0007049
    label: cell cycle
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: Human PARD3B is described only as a putative adapter in asymmetric cell division and polarization,
      through its interaction with Inscuteable; there is no PARD3B-specific experimental evidence for
      a cell-cycle role, and no experimental GO beyond binding/junction rows. The broad term is not in
      donkey GOA. Allowed evidence neither establishes nor refutes the prediction.
    supported_by:
    - reference_id: file:EQUAS/PARD3B/PARD3B-bioinformatics/Q8TEW8-uniprot.txt
      supporting_text: Putative adapter protein involved in asymmetrical cell
    - reference_id: file:EQUAS/PARD3B/PARD3B-bioinformatics/RESULTS.md
      supporting_text: Apart from protein binding and generic complex/cell-junction rows, no experimental
        GO annotation exists for either PARD3B ortholog.
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0070161
    label: anchoring junction
  predicted_term_type: GO_CC
  review:
    assessment: LSP
    confidence_score: 2
    summary: Human PARD3B colocalizes with TJP1 at epithelial tight junctions, and donkey GOA already
      contains bicellular tight junction (GO:0005923), which is a GO descendant of anchoring junction.
      The prediction is therefore correct but less precise than an existing supported annotation.
    supported_by:
    - reference_id: file:EQUAS/PARD3B/PARD3B-bioinformatics/Q8TEW8-uniprot.txt
      supporting_text: Colocalizes with TJP1 to epithelial tight junctions.
