description: 'Assessment of 2 ProtNLM2 GO predictions for donkey PARD3B (A0A9L0JEY6). Anchoring junction
  is correct but less precise than the bicellular tight junction annotation already in donkey GOA (LSP).
  Cell cycle is uncertain (UNC): a mouse Par3L knockout shows increased mitotic cells with aberrant spindles, but this loss-of-function phenotype does not establish a direct cell-cycle role. Non-GO ProtNLM2 outputs,
  not scored: subcellular locations ''Endomembrane system'' and ''Cell junction'', both matching locations
  reported for human PARD3B.'
