  review:
    summary: Microtubule cytoskeleton organization (TreeGrafter). A PAR3-family property that PAINT places
      at the family root (PTN001046835; donors Drosophila Bazooka and mouse Pard3), so PARD3B inherits
      it formally. No PARD3B-specific evidence exists.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PAINT node sits above the PARD3/PARD3B duplication, so the donkey protein is inside the
      clade. But there is target-specific evidence that PARD3B has diverged from PARD3. It does not bind
      aPKC or PAR6, the partners through which PAR3 couples polarity to the cytoskeleton, and its one
      defined function (restraining LKB1) is PARD3B-specific. The donor evidence comes only from PARD3-type
      orthologs, and nothing shows that PARD3B organizes microtubules, so the inherited term is likely
      an over-annotation for this paralog.
    supported_by:
    - reference_id: PMID:24859006
      supporting_text: Par3L function has been mysterious because, unlike Par3, it does not interact with
        atypical protein kinase C or the Par6 polarity protein.
