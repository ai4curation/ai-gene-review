- term:
    id: GO:0004860
    label: protein kinase inhibitor activity
  evidence_type: ISS
  original_reference_id: PMID:24859006
  review:
    summary: Proposed molecular function. Mouse Par3L binds LKB1 (endogenous co-IP from kidney) and suppresses
      LKB1 kinase output in cells, measured as reduced AMPK phosphorylation. A mutant in the PARD3B-specific
      PDZ2-PDZ3 linker cannot bind LKB1, is much less inhibitory, and fails to rescue. Donkey PARD3B is
      in the same PANTHER subfamily (SF4) and keeps that linker (26/29 identical to human, against 15/29
      for PARD3).
    action: NEW
    reason: This is the one activity defined for PARD3B, and it is subfamily-specific. PARD3 does not
      bind LKB1, and the binding sequence is not shared with PARD3. The transfer is therefore grounded
      in SF4 membership plus conservation of the mapped determinant, not in family-level similarity. The
      evidence is cell-based (phospho-AMPK and a binding-defective mutant), not an in vitro kinase assay,
      so direct inhibition remains to be confirmed. ISS is used.
    supported_by:
    - reference_id: PMID:24859006
      supporting_text: Unexpectedly, Par3L, but not Par3, binds to the tumour suppressor protein Lkb1 and
        inhibits its kinase activity.
    - reference_id: PMID:24859006
      supporting_text: Notably, the expression of wild type Par3L in HEK293T cells inhibited AMPK phosphorylation,
        with no change in expression levels of either LKB1 or AMPK, while the mutant had significantly
        less inhibitory effect on phospho-AMPK
    - reference_id: PMID:24859006
      supporting_text: Replacement of the Par3L sequence in this region with that from Par3 abolished LKB1
        binding by full-length hPar3L
    - reference_id: file:EQUAS/PARD3B/PARD3B-bioinformatics/RESULTS-rereview.md
      supporting_text: 'donkey: human PARD3B 469-497: 29 of 29 aligned, 26 identical'
