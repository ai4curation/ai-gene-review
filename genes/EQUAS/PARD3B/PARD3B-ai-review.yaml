suggested_questions:
- question: Which PARD3 functions (aPKC binding, phosphoinositide binding, microtubule/centrosome roles)
    are retained by PARD3B, and which partners distinguish it from PARD3?
suggested_experiments:
- description: Lipid-overlay or liposome binding assays with PARD3B PDZ2 and C-terminal fragments, and
    PARD3B knockout in polarized epithelial cells (e.g. MDCK) with tight-junction and apical-marker readouts,
    to test the family-level functions transferred by TreeGrafter.
