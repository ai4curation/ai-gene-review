gene_symbol: PARD3B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: PARD3B (partitioning defective 3 homolog B; PAR3beta, PAR3L) is the vertebrate paralog of
  the cell-polarity scaffold PARD3 in the PAR3 family (PANTHER subfamily PTHR16484:SF4). Like PARD3 it
  has an N-terminal Par3/HAL oligomerization domain and three PDZ domains, but it diverges from PARD3
  in its partners. In mammalian cells it does not bind atypical protein kinase C, and binding to PAR6
  is weak or absent depending on the isoform and the study. Even so, it localizes to epithelial tight
  junctions, where it colocalizes with TJP1/ZO-1, independently of the PAR3-PAR6-aPKC complex. It also
  binds the spindle-orientation adaptor Inscuteable. Its best-defined activity comes from mouse. There
  PARD3B binds the polarity kinase LKB1 (STK11) through a PARD3B-specific sequence between PDZ2 and
  PDZ3, and it suppresses LKB1 kinase activity, measured as phosphorylation of the LKB1 target AMPK.
  This restraint on LKB1 is needed to keep mammary stem cells alive and self-renewing. Whether PARD3B
  takes part in apical-basal polarity in the way PARD3 does has not been established. The donkey protein
  is a full-length ortholog, 88% identical to human PARD3B, and its PDZ domains and the LKB1-binding
  linker are near-identical to the human sequence.
