- description: PARD3B binds the polarity kinase LKB1 (STK11) through a PARD3B-specific sequence between
    PDZ2 and PDZ3 and restrains its kinase activity. In mouse, this protects mammary stem cells from LKB1-driven
    apoptosis and loss of self-renewal.
