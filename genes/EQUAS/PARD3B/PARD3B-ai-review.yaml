    supporting_text: Unexpectedly, Par3L, but not Par3, binds to the tumour suppressor protein Lkb1 and
      inhibits its kinase activity.
  - reference_id: PMID:24859006
    supporting_text: We propose that Par3L maintains mammary stem cells through suppression of LKB1 kinase
      activity
  - reference_id: file:EQUAS/PARD3B/PARD3B-bioinformatics/RESULTS-rereview.md
    supporting_text: 'donkey: human PARD3B 469-497: 29 of 29 aligned, 26 identical'
