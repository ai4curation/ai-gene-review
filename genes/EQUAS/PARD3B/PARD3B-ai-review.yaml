id: A0A9L0JEY6
gene_symbol: PARD3B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: PARD3B (partitioning defective 3 homolog B; PAR3beta, PAR3L) is a vertebrate paralog of the
  cell-polarity scaffold PARD3 in the PAR3 family. It contains an N-terminal Par3/HAL oligomerization
  domain and three PDZ domains, binds PARD6B and the spindle-orientation adaptor Inscuteable (INSC), and
  localizes to cell-cell contacts, colocalizing with TJP1/ZO-1 at epithelial tight junctions, as well
  as to endomembranes. It is thought to act as an adaptor in apical-basal polarization, tight-junction
  formation and asymmetric cell division, but its specific functions are much less characterized than
  those of PARD3. The donkey protein A0A9L0JEY6 is 88% identical to human PARD3B over its full length,
  with near-identical PDZ domains.
