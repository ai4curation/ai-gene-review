suggested_questions:
- question: Does PARD3B take part in epithelial apical-basal polarity or tight-junction assembly at all,
    given that it binds neither aPKC nor PAR6? If it does, through which partners (INSC, LKB1, others)?
- question: Does PARD3B inhibit LKB1 directly, for example by blocking the LKB1-STRAD-MO25 complex or
    access to substrates, or does it act indirectly by sequestering or relocalizing LKB1?
- question: The PAINT family-root node (PTN001046835) propagates PARD3/Bazooka-derived process terms to
    PARD3B. Should PAINT curators add a PARD3B-subfamily node that blocks the polarity-machinery terms
    PARD3B is not known to share?
