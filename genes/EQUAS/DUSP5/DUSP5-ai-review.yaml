- term:
    id: GO:0043409
    label: negative regulation of MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001300107
  review:
    summary: Negative regulation of MAPK cascade (TreeGrafter).
    action: ACCEPT
    reason: DUSP5 directly terminates ERK1/2 signalling by dephosphorylating and nuclear-anchoring the
      kinase; this is the biological process its phosphatase activity executes. A more specific child
      (negative regulation of the ERK1/ERK2 cascade) would also be appropriate.
    supported_by:
