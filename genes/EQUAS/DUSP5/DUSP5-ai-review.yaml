- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN001300107
  review:
    summary: Cytoplasm, transferred by TreeGrafter from the DUSP family node.
    action: MARK_AS_OVER_ANNOTATED
    reason: Cytoplasmic localization is characteristic of other MKP subfamilies (e.g. the cytoplasmic
      ERK-specific MKPs) captured at the PANTHER node, whereas DUSP5 is described as an inducible nuclear
      phosphatase that sequesters ERK2 in the nucleus, and its human UniProt location is nucleus only.
      Transient cytoplasmic presence is not excluded, so the term is over-annotation rather than demonstrably
      false.
    supported_by:
    - reference_id: PMID:15713638
      supporting_text: We conclude that DUSP5 is an inducible nuclear ERK-specific MAP kinase phosphatase
        that functions as both an inactivator of and a nuclear anchor for ERK2 in mammalian cells.
