- term:
    id: GO:0051019
    label: mitogen-activated protein kinase binding
  evidence_type: ISS
  original_reference_id: PMID:15713638
  qualifier: enables
  review:
    summary: DUSP5 binds ERK2 through the KIM in its N-terminal noncatalytic domain; this binding is a separable,
      non-catalytic function that anchors inactive ERK2 in the nucleus.
    action: NEW
    reason: 'KIM-mediated ERK binding determines DUSP5 substrate specificity and, independently of catalysis (a
      catalytically inactive mutant still tethers ERK2), retains ERK2 in the nucleus, so it is a molecular function
      in its own right and not merely substrate binding. Comparator check: the cytoplasmic ERK-specific paralog
      DUSP6 is curated to GO:0051019 in this repository for the same KIM-mediated ERK binding. The donkey N-terminal
      domain is 122/123 identical to human, and the protein lies in the DUSP5 PANTHER subfamily, so the transfer
      is by orthology.'
    supported_by:
    - &id008
      reference_id: PMID:15713638
      supporting_text: Here we demonstrate that DUSP5, an inducible nuclear phosphatase, interacts specifically
        with ERK2 via a kinase interaction motif (KIM) within its amino-terminal noncatalytic domain.
    - &id009
      reference_id: PMID:15713638
      supporting_text: Finally, the use of a catalytically inactive mutant to anchor ERK2 in the nucleus reveals
        that MEK function is not restricted to the cytoplasmic compartment
    - *id007
