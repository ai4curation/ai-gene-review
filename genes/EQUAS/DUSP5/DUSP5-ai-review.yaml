gene_symbol: DUSP5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: DUSP5 is an inducible, nuclear dual-specificity MAP kinase phosphatase (MKP) of the non-receptor dual-specificity
  subfamily of protein-tyrosine phosphatases. It has an N-terminal rhodanese-like noncatalytic domain that carries
  a kinase interaction motif (KIM) for ERK binding and an independent nuclear localization signal, and a C-terminal
  dual-specificity phosphatase domain whose active-site cysteine forms a phosphocysteine intermediate. DUSP5 dephosphorylates
  the activation-loop phosphothreonine and phosphotyrosine of ERK1/2, inactivating them, and binds and retains inactive
  ERK2 in the nucleus, so that it acts as an ERK-selective negative feedback regulator of the ERK1/ERK2 MAP kinase
  cascade; it does not inactivate JNK or p38. Its expression is induced by mitogenic stimulation and heat shock.
  The donkey protein (384 aa) is a full-length product of the DUSP5 ortholog (PANTHER subfamily PTHR10159:SF40,
  shared with human and rat DUSP5), 94.8% identical to human DUSP5, with the catalytic Cys263, the N-terminal domain
  and the nuclear localization signal conserved.
existing_annotations:
- term:
    id: GO:0001706
    label: endoderm formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001300107
  review:
    summary: Endoderm formation, transferred by TreeGrafter from a DUSP family PANTHER node.
    action: MARK_AS_OVER_ANNOTATED
    reason: The corresponding human IBA (PAINT node PTN000017039) is grounded in a zebrafish DUSP-family developmental
      annotation. Endoderm formation is an organismal developmental outcome; an MKP could influence it only indirectly,
      by attenuating FGF/ERK signalling, which is the regulatory role already captured by negative regulation of
      the ERK1 and ERK2 cascade. No experiment in mammals places DUSP5 in germ-layer formation, and the characterised
      mammalian function is nuclear ERK inactivation. The term is therefore retained only as an over-annotation
      of the donkey protein rather than as a demonstrated process; this judgment does not dispute the PAINT node
      placement for the donor gene.
    supported_by:
    - &id005
      reference_id: PMID:15713638
      supporting_text: We conclude that DUSP5 is an inducible nuclear ERK-specific MAP kinase phosphatase that functions
        as both an inactivator of and a nuclear anchor for ERK2 in mammalian cells.
