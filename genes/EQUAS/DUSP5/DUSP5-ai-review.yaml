gene_symbol: DUSP5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: DUSP5 is an inducible nuclear dual-specificity MAP kinase phosphatase (MKP) of the non-receptor
  dual-specificity subfamily of protein-tyrosine phosphatases. It has an N-terminal rhodanese-like domain
  carrying a kinase interaction motif and a nuclear localization signal, and a C-terminal catalytic DSP
  domain with an active-site cysteine that forms a phosphocysteine intermediate. In mammalian cells DUSP5
  dephosphorylates the activating phosphotyrosine and phosphothreonine of ERK1/2, inactivating them, and
  anchors inactive ERK2 in the nucleus, thereby acting as a negative feedback regulator of the ERK MAPK
  cascade. The donkey protein (384 aa) is 94.8% identical to human DUSP5 over its full length and conserves
  the catalytic Cys263 and the nuclear localization signal.
existing_annotations:
- term:
    id: GO:0001706
    label: endoderm formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001300107
  review:
    summary: Endoderm formation transferred by TreeGrafter from the DUSP family PANTHER node.
    action: MARK_AS_OVER_ANNOTATED
    reason: The underlying phylogenetic assertion rests on a zebrafish developmental phenotype (the human
      IBA for this term cites a single ZFIN donor). DUSP5 is a nuclear ERK phosphatase; any role in germ-layer
      formation would be an indirect consequence of dampening FGF/ERK signalling rather than participation
      in endoderm formation. There is no mammalian evidence that DUSP5 acts in endoderm formation, so
      the term over-states the function of the donkey protein.
    supported_by:
    - reference_id: PMID:15713638
      supporting_text: We conclude that DUSP5 is an inducible nuclear ERK-specific MAP kinase phosphatase
        that functions as both an inactivator of and a nuclear anchor for ERK2 in mammalian cells.
