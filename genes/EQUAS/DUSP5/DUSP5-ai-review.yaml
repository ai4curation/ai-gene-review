- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN001300107
  review:
    summary: Cytoplasm, transferred by TreeGrafter from a deep MKP-family PANTHER node.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The cytoplasm assertion comes from a deep PAINT node (human IBA from PTN001605855) whose experimental
      donors are largely cytoplasmic or nucleocytoplasmic MKPs and yeast/plant/fly relatives. DUSP5 is the clearest
      case in the family of a lineage-specific nuclear phosphatase: it carries a dedicated NLS, it is described
      as the nuclear counterpart of the cytoplasmic ERK-specific DUSP6, and human UniProt lists nucleus only. Transient
      cytoplasmic presence (e.g. after synthesis) is not excluded, so the row is over-annotation rather than demonstrably
      false.'
    supported_by:
    - *id005
    - reference_id: PMID:15713638
      supporting_text: DUSP5 can thus be regarded as a nuclear equivalent of the cytoplasmic ERK-specific phosphatase
        MKP-3/DUSP6.
