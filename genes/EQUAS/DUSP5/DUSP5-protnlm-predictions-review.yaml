    summary: GO:0017018 is defined as catalysis of phosphomyosin + H2O = myosin + phosphate, an activity
      carried out by the PP1c-MYPT1 myosin phosphatase holoenzyme of the PPP family. DUSP5 is a cysteine-based
      dual-specificity phosphatase of the PTP superfamily whose characterized substrate is ERK; human
      DUSP5 inactivates ERK2 but not JNK or p38, and its activity is highest toward ERK1. The donkey protein
      conserves the catalytic Cys263 and is 94.8% identical to human over its full length, so it is expected
      to share this ERK-directed specificity. No evidence links DUSP5 to myosin dephosphorylation, and
      the donkey GOA already records the correct MAP kinase tyrosine/serine/threonine phosphatase activity.
      The one study a PubMed search finds linking DUSP5 to myosin places it upstream, reporting that DUSP5 lowers myosin IIB activation indirectly
      by inhibiting ERK, which acts through MLCK, rather than by dephosphorylating myosin itself. The prediction
      assigns a substrate-specific phosphatase activity that belongs to an unrelated enzyme family (PPP-type
      myosin phosphatase), not to a paralog. No error-type value fits a training-data origin that cannot be
      shown here, so none is set.
