predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0003690
    label: double-stranded DNA binding
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: WRONG_INPUT_SEQUENCE
    summary: The input sequence fuses a KRAB-C2H2 zinc-finger segment (residues 1 to about 570) to PDIA4;
      the ProtNLM2 evidence for this GO term is a weak phmmer match to mouse zinc finger protein 148 (Q61624),
      i.e. the zinc-finger part. Human PDIA4 is a 645-aa ER luminal disulfide isomerase with no zinc-finger
      region, the PDIA4 part of the donkey entry aligns to human residues 17-645, and the signal peptide
      needed for ER entry is missing, which together indicate a gene-model fusion rather than a real PDIA4
      protein. A second donkey entry from the same Ensembl gene shows the same KRAB-type N-terminus. DNA
      binding is not a PDIA4 function, so the prediction is incorrect for this gene; the cause is the
      chimeric input sequence, not paralog confusion.
    supported_by:
    - reference_id: file:EQUAS/PDIA4/PDIA4-uniprot.txt
      supporting_text: 'SIMILARITY: Belongs to the krueppel C2H2-type zinc-finger protein'
    - reference_id: file:EQUAS/PDIA4/PDIA4-bioinformatics/ALT_ENTRY.md
      supporting_text: A0A8C4LTV9 (1197 aa) residues 571-1197 align locally to P13667 (645 aa) residues
        17-645
    - reference_id: file:EQUAS/PDIA4/PDIA4-bioinformatics/human-P13667-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Endoplasmic reticulum lumen'
