id: A0A8C4LTV9
gene_symbol: PDIA4
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of the single ProtNLM2 GO prediction for donkey PDIA4 (A0A8C4LTV9). The UniProt
  entry is a 1197-aa merged gene model in which a KRAB domain and ten C2H2 zinc fingers most similar to
  human ZNF786 (the gene immediately upstream of PDIA4 in human) precede a complete PDIA4 (ERp72) protein
  disulfide isomerase lacking its signal peptide. The predicted double-stranded DNA binding derives from
  the zinc-finger segment and does not describe PDIA4, an ER luminal oxidoreductase (NPI, WRONG_INPUT_SEQUENCE);
  the gene review removes the other zinc-finger-derived annotations (nucleus, regulation of DNA-templated
  transcription) on the same grounds, and a PubMed search for PDIA4/ERp72 and DNA binding returned no
  report of DNA binding by PDIA4. ProtNLM2 also emitted function text (not scored) - "Participates in
  the folding of proteins containing disulfide bonds, may be involved in glycosylation, prolyl hydroxylation
  and triglyceride transfer" - whose first clause fits PDIA4; the remaining clauses resemble descriptions
  of canonical PDI (P4HB) and are not established for PDIA4 (the evidence key for this text is a phmmer
  match to alfalfa PDI, P29828). No location was emitted.
