id: A0A8C4LTV9
gene_symbol: PDIA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: 'PDIA4 (ERp72) is an endoplasmic reticulum luminal oxidoreductase of the protein disulfide isomerase
  (PDI) family (PANTHER subfamily PTHR18929:SF210, protein disulfide-isomerase A4). Mammalian PDIA4 has an N-terminal
  signal peptide, an acidic N-terminal stretch, three catalytic thioredoxin-like a-type domains carrying CGHC redox-active
  sites, two non-catalytic b-type domains, and a C-terminal KDEL-type ER retrieval signal. It catalyses thiol-disulfide
  oxidation, reduction and isomerization of client proteins during oxidative folding in the ER, and works within
  a large ER chaperone network with HSPA5 (BiP), HSP90B1 (GRP94), PPIB (cyclophilin B), PDIA6 and other folding
  factors that binds unfolded secretory proteins. It is an ER stress-inducible protein, and small amounts are released
  and found at the cell surface, for example on activated platelets. The donkey UniProt entry A0A8C4LTV9 (1197 aa)
  is a merged gene model: residues ~581-1197 are the PDIA4 product (90% identical to human PDIA4 over residues 31-645,
  all three CGHC sites conserved, C-terminal REEL), but they are preceded by a KRAB domain and ten C2H2 zinc fingers
  that are most similar to human ZNF786, the gene immediately upstream of PDIA4 on the same strand in human, and
  the PDIA4 signal peptide is missing. The zinc-finger part is not PDIA4 biology.'
