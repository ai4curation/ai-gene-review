  label: Equus asinus
description: 'PDIA4 (ERp72) is an endoplasmic reticulum luminal protein disulfide isomerase of the PDI
  family. It has an N-terminal signal peptide, an acidic N-terminal region, three catalytic thioredoxin-like
  domains carrying CGHC redox-active sites plus non-catalytic thioredoxin-fold domains, and a C-terminal
  KDEL-type ER retrieval signal (KEEL in human). It catalyses thiol-disulfide oxidation, reduction and
  isomerization during oxidative folding of secretory proteins, and is part of a large ER chaperone complex
  with HSPA5, HSP90B1, PDIA6 and other folding factors; it is induced by ER stress and small amounts are
  found at the cell surface. The donkey UniProt entry A0A8C4LTV9 (1197 aa) is a chimeric gene model: residues
  of roughly 571-1197 match human PDIA4 (89% identity, all three CGHC motifs conserved, C-terminal REEL),
  but they are preceded by a KRAB domain and ten C2H2 zinc fingers and the PDIA4 signal peptide is missing.
  A second donkey entry from the same Ensembl gene (A0A8C4PKQ4) shows the same KRAB-type N-terminus. No
  characterized mammalian PDIA4 contains such a segment, so the zinc-finger part is best treated as a
  gene-model fusion artefact rather than PDIA4 biology.'
