  review:
    summary: Protein disulfide isomerase activity (EC 5.3.4.1 / UniRule, combined IEA).
    action: ACCEPT
    reason: The PDIA4 portion of the donkey entry retains all three CGHC redox-active sites of human ERp72,
      and human ERp72 has peptide thiol-disulfide oxidase activity similar to PDI. Protein disulfide isomerase
      activity is the core catalytic function of PDIA4.
    supported_by:
    - reference_id: PMID:16677074
      supporting_text: we have recombinantly expressed and purified six members of the family, PDI, PDIp,
        ERp57, ERp72, P5, and PDIr from a single organism, human. An examination of the pH-dependence
        and nature of the rate limiting step for the peptide thiol-disulfide oxidase activity of these
        enzymes reveals that, with the exception of PDIr, they are all remarkably similar.
    - reference_id: file:EQUAS/PDIA4/PDIA4-bioinformatics/RESULTS.md
      supporting_text: 'DISULFID Redox-active: human [91, 94] CC -> donkey [643, 646] CC'
