suggested_questions:
- question: Does the donkey PDIA4 locus encode a conventional ER-targeted ERp72 with a signal peptide (as expected),
    so that the KRAB-zinc-finger N-terminus of the Ensembl models A0A8C4LTV9/A0A8C4PKQ4 is an annotation fusion
    with a neighbouring zinc-finger gene?
- question: Should the Ensembl donkey gene model ENSEASG00005009014 be split into separate ZNF786 and PDIA4 genes,
    and are the equivalent horse models (e.g. the 1248-aa PDIA4 entry) affected by the same merger?
suggested_experiments:
- description: RT-PCR or long-read cDNA sequencing across the 5' end of donkey PDIA4 transcripts to establish whether
    any transcript joins zinc-finger exons to PDIA4 and to recover the signal-peptide exon.
