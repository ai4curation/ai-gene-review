  review:
    summary: Nucleus (UniProt subcellular location rule, combined IEA).
    action: REMOVE
    reason: PDIA4 is an ER luminal enzyme with no nuclear function. The nuclear location in this entry
      is explained by the KRAB-C2H2 zinc-finger segment fused to its N-terminus in the donkey gene model,
      a segment absent from human PDIA4 and from other characterized PDIA4 orthologs. The term does not
      describe PDIA4 biology.
