suggested_questions:
- question: Does the donkey PDIA4 locus encode a conventional ER-targeted ERp72 with a signal peptide
    (as expected), so that the KRAB-zinc-finger N-terminus of the Ensembl models A0A8C4LTV9/A0A8C4PKQ4
    is an annotation fusion with a neighbouring zinc-finger gene?
suggested_experiments:
- description: RT-PCR or long-read cDNA sequencing across the 5' end of donkey PDIA4 transcripts to establish
    whether any transcript joins zinc-finger exons to PDIA4 and to recover the signal-peptide exon.
