suggested_questions:
- question: Which molecular activity term best captures NUMB's role at coated pits (cargo-selective adaptor
    via its PTB domain, or AP-2/EH-protein scaffold via the C-terminal DPF/NPF motifs), and should the
    endocytic terms curated experimentally for human and mouse NUMB be propagated at the PANTHER node that
    currently carries only cytoplasm, basolateral plasma membrane, cytoplasmic vesicle and positive regulation
    of neurogenesis?
- question: Should the mouse neuroblast division in subventricular zone annotation from PMID:17174898 be
    revised to a survival term, given that the paper reports neuroblast apoptosis rather than a division
    defect?
suggested_experiments:
- description: Express donkey NUMB (wild type and T102A) in cultured equine cells and measure transferrin
    and integrin internalization, to test whether the AAK1-regulated endocytic function shown for human NUMB
    is conserved.
