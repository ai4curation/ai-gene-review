id: A0A9L0IHZ0
gene_symbol: NUMB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: NUMB is a cytoplasmic adaptor protein of the Numb/Numb-like family, with an N-terminal
  phosphotyrosine-binding (PTB/PID) domain and a long C-terminal region carrying DPF and NPF motifs
  that in mammals bind AP-2 and EH-domain endocytic proteins. It associates peripherally with the
  cytoplasmic face of the plasma membrane, clathrin-coated pits and vesicles, and endosomes, where in
  mammals it acts as an endocytic adaptor that regulates clathrin-mediated internalization of selected
  receptors (for example integrins, cadherins and metabotropic glutamate receptor 1); this activity is
  controlled by phosphorylation by the AP-2-associated kinase AAK1. In the developing mammalian brain
  NUMB, redundantly with NUMBL, maintains neural progenitor (radial glial) cells and their cadherin-based
  adherens junctions, and postnatally supports subventricular zone homeostasis. This entry is the
  canonical 652-residue donkey product, which has the same exon content as human isoform 1 (p72). All
  functional knowledge is inferred from the human and mouse orthologs; no experiments have been
  reported on donkey NUMB.
