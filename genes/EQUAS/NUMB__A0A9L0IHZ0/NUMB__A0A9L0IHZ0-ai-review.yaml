  review:
    summary: Lateral ventricle development, projected from a mouse IMP (PMID:17174898). Tamoxifen-induced
      postnatal deletion of Numb and Numbl from SVZ progenitors and ependymal cells damaged lateral ventricle
      wall integrity, which was later repaired by escaping progenitors.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is a tissue-level phenotype of a postnatal conditional double knockout (loss of
      ventricular wall integrity in an already formed ventricle), not participation of NUMB in building the
      ventricle. It is a downstream organismal outcome of NUMB's cellular role in maintaining cadherin-based
      junctions of ependymal and progenitor cells, and PAINT did not propagate it to the family node. Not
      removed, because the term is not false for the mouse gene, but it should not be transferred as a function
      of donkey NUMB.
    supported_by:
    - reference_id: PMID:17174898
      supporting_text: This resulted in severe damage to brain lateral ventricle integrity and identified
        roles for Numb/Numblike in regulating ependymal wall integrity and SVZ neuroblast survival.
