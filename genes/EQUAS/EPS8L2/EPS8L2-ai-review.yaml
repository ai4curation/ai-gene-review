id: A0A9L0KBR4
gene_symbol: EPS8L2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: EPS8L2 (EPS8 signaling adaptor L2) is a cytoplasmic actin-binding adaptor protein of the
  EPS8 family, with an N-terminal PTB domain, a central SH3 domain and a C-terminal effector region that
  binds actin filaments directly. In mammalian fibroblasts EPS8L2 joins ABI1 and the Ras/Rac exchange
  factor SOS1 in a complex that activates SOS1 guanine nucleotide exchange toward Rac, and it is recruited
  to growth factor-induced, F-actin-rich membrane ruffles, where it supports Rac-dependent ruffle formation.
  In the inner ear, mouse Eps8L2 sits at the tips of hair-cell stereocilia and is needed to maintain the
  staircase architecture of the adult hair bundle; loss of EPS8L2 causes progressive hearing loss in mice
  and autosomal recessive deafness (DFNB106) in humans. The donkey protein (681 aa) is a near full-length
  ortholog of human EPS8L2 in the same PANTHER subfamily (PTHR12287:SF20), 84% identical over 679 aligned
  residues, with all three domains present.
existing_annotations:
- term:
