- term:
    id: GO:0032426
    label: stereocilium tip
  evidence_type: ISS
  original_reference_id: PMID:23918390
  review:
    summary: Mouse Eps8L2 is a hair bundle protein localized at the tips of stereocilia of cochlear and vestibular
      hair cells.
    action: NEW
    reason: Mouse Eps8l2 (Q99K30) has a direct experimental annotation to stereocilium tip from this paper,
      and human EPS8L2 carries it by ISS. Mouse, human and donkey EPS8L2 all belong to PANTHER subfamily
      PTHR12287:SF20, so this is an ortholog-to-ortholog transfer within one subfamily, not a family-level
      inference; the donkey protein retains the F-actin-binding C-terminus that underlies tip targeting
      of EPS8-family proteins. The PAINT family nodes (PTN000958212, PTN000264860) span EPS8 and all EPS8L
      paralogs and carry no stereocilium term, which is consistent with this being a subfamily-level location
      rather than a deliberate exclusion. Only the location is proposed; the hearing and stereocilium-maintenance
      phenotypes of the knockout are not added as process terms.
    supported_by:
    - reference_id: PMID:23918390
      supporting_text: is a newly identified hair bundle protein that is localized at the tips of stereocilia
        of both cochlear and vestibular hair cells
    - reference_id: file:EQUAS/EPS8L2/EPS8L2-bioinformatics/human-EPS8L2-Q9H6S3-uniprot.txt
      supporting_text: Localizes at the tips of the stereocilia of the inner and outer hair cells.
