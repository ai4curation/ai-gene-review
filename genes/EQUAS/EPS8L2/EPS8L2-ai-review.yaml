  review:
    summary: EPS8L2 binds actin filaments directly through its conserved C-terminal effector region (F-actin
      cosedimentation of the purified EPS8L2 C-terminal fragment). The donkey protein retains this region.
    action: MODIFY
    reason: Actin binding is correct and is the defining activity of the EPS8L2 subfamily, but the experimental
      evidence is more specific - the EPS8L2 C-terminus cosediments with polymerized actin (F-actin), which
      is actin filament binding (GO:0051015, an is_a child of GO:0003779; mouse Eps8l2 already carries it
      from the same paper). The donkey protein sits in the same PANTHER subfamily (PTHR12287:SF20) as human
      and mouse EPS8L2 and the effector region is conserved (84% identity end to end), so the TreeGrafter
      transfer is sound; only the term should be refined.
    proposed_replacement_terms:
    - id: GO:0051015
      label: actin filament binding
    supported_by:
    - reference_id: PMID:14565974
      supporting_text: Consistent with the immunoprecitation results, eps8, eps8L1, and L2, but not eps8L3
        could directly associate to F-actin, albeit with different stoichiometry, pointing to the existence
        of a novel, conserved F-actin–binding surface present in the C-terminus of eps8Ls.
    - reference_id: file:EQUAS/EPS8L2/EPS8L2-bioinformatics/RESULTS.md
      supporting_text: 'Paired residues: 679; identical: 572; identity over paired: 84.24%'
