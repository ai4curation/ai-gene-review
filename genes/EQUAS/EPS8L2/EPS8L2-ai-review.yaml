- id: PMID:14565974
  title: The eps8 family of proteins links growth factor stimulation to actin reorganization
    generating functional redundancy in the Ras/Rac pathway.
  findings:
  - statement: EPS8L2 interacts with ABI1 and SOS1, activates SOS1 Rac-GEF activity and binds actin.
    supporting_text: Similarly to eps8, eps8Ls interact with Abi1 and Sos-1; however, only eps8L1 and eps8L2
      activate the Rac-GEF activity of Sos-1, and bind to actin in vivo.
  - statement: EPS8L2 localizes to F-actin-rich ruffles and rescues ruffling in Eps8-null fibroblasts.
    supporting_text: Consistently, eps8L1 and eps8L2, but not eps8L3, localize to PDGF-induced, F-actin–rich
      ruffles and restore receptor tyrosine kinase (RTK)-mediated actin remodeling when expressed in eps8
      –/– fibroblasts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC307530). Primary characterization of human EPS8L1-3; source of the
      human IDA/IGI rows that underlie the PAINT nodes behind the donkey TreeGrafter annotations.
- id: PMID:23918390
  title: Progressive hearing loss and gradual deterioration of sensory hair bundles
    in the ears of mice lacking the actin-binding protein Eps8L2.
  findings:
  - statement: Mouse Eps8L2 localizes at stereocilia tips and is required for long-term maintenance of the
      hair bundle staircase.
    supporting_text: We conclude that Eps8L2 is required for the long-term maintenance of the staircase structure
      and mechanosensory function of auditory hair bundles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC3752214). Mouse ortholog (same PANTHER subfamily SF20); supports the
      stereocilium-tip location. Knockout phenotypes not transferred as process terms.
