- term:
    id: GO:0007266
    label: Rho protein signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008992914
  review:
    summary: EPS8L2 assembles with ABI1 and SOS1 into a complex that activates SOS1 Rac-GEF activity, a
      step in signaling from receptor tyrosine kinases to the Rho-family GTPase Rac.
    action: ACCEPT
    reason: Human EPS8L2 interacts with ABI1 and SOS1 and activates the Rac-GEF activity of SOS1 about as
      efficiently as EPS8 itself (in vitro GEF assays on immunoprecipitated complexes). EPS8L2 is therefore
      a component of the GEF-activating module in Rac signaling. PAINT placed this term at the EPS8-family
      node PTN000958212, and the donkey protein lies inside that clade (subfamily SF20).
    supported_by:
    - reference_id: PMID:14565974
      supporting_text: Similarly to eps8, eps8Ls interact with Abi1 and Sos-1; however, only eps8L1 and eps8L2
        activate the Rac-GEF activity of Sos-1, and bind to actin in vivo.
- term:
    id: GO:0031982
    label: vesicle
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN008992914
  review:
    summary: The only experimental basis for vesicle localization of any EPS8L2 is detection of human EPS8L2
      in mass-spectrometry inventories of secreted exosome-like vesicles.
    action: MARK_AS_OVER_ANNOTATED
    reason: Human EPS8L2 is annotated to vesicle from a proteomic survey of exosome-like vesicles released
      by airway epithelium (and to extracellular exosome from similar HDA studies). Cytoskeletal proteins
      are routinely captured in such preparations, and no study places EPS8L2 function at a vesicle. The
      human and mouse IBA sets do not include a vesicle term, so this TreeGrafter row appears to propagate
      a proteomics-only location across the subfamily. Not contradicted, but over-annotated.
    supported_by:
    - reference_id: PMID:19190083
      supporting_text: Biochemical characterization further revealed typical surface, cytoskeletal, and
        cytoplasmic proteins characteristic of exosomes
