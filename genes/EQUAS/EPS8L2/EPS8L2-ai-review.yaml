  review:
    summary: EPS8L2 localizes at the tips of cochlear hair-cell stereocilia, where it is required for stereocilia
      maintenance.
    action: NEW
    reason: The stereocilium-tip location underlies the best-established physiological role of EPS8L2 (hair-cell
      stereocilia maintenance; human deafness DFNB106). It is recorded for human EPS8L2 by similarity to
      mouse and is absent from the donkey GOA. Transfer to the 84%-identical donkey ortholog is justified.
    supported_by:
