  review:
    summary: EPS8-family proteins bind F-actin through their C-terminal effector region; human EPS8L2 associates
      with F-actin. The donkey protein retains this region.
    action: ACCEPT
    reason: Actin binding is a conserved, defining activity of the EPS8 family and is experimentally supported
      for human EPS8L2 (human GOA has IDA and IBA rows for this term). The donkey sequence is 84% identical
      to human EPS8L2 over its full length, including the C-terminal region, so the TreeGrafter transfer
      is sound.
    supported_by:
    - reference_id: file:EQUAS/EPS8L2/EPS8L2-bioinformatics/human-EPS8L2-Q9H6S3-uniprot.txt
      supporting_text: Part of a complex that contains SOS1, ABI1 and EPS8L2. Associates with F-actin.
