suggested_questions:
- question: Does donkey EPS8L2 cap or bundle actin filaments at stereocilia tips as mouse Eps8l2 and Eps8
    do, and is it required for hearing in equids?
- question: Human EPS8L2 carries contributes_to guanyl-nucleotide exchange factor activity (GO:0005085)
    from PMID:14565974, but PAINT did not propagate that term to the family nodes; is the SOS1-stimulating
    activity better captured as a GEF-complex contribution or as a molecular adaptor activity for this
    family?
