id: A0A9L0KBR4
gene_symbol: EPS8L2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: EPS8L2 (epidermal growth factor receptor kinase substrate 8-like protein 2) is a cytoplasmic
  signaling adaptor of the EPS8 family, with an N-terminal PTB domain, a central SH3 domain and a C-terminal
  actin-binding effector region. In mammals it associates with F-actin and, in a complex with ABI1 and
  SOS1, stimulates SOS1 guanine nucleotide exchange toward Rac, promoting membrane ruffling and actin
  remodeling. EPS8L2 also localizes to the tips of cochlear hair-cell stereocilia, where it is required
  for stereocilia maintenance and hearing. The donkey protein is a near full-length ortholog of human
  EPS8L2 (84% identity).
existing_annotations:
