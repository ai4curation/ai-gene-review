- term:
    id: GO:0035023
    label: regulation of Rho protein signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008992914
  review:
    summary: By activating the Rac-GEF activity of SOS1 within the ABI1-SOS1 complex, EPS8L2 regulates Rac
      (Rho-family) signaling.
    action: ACCEPT
    reason: This is the best-characterized signaling function of EPS8L2 (human IDA, family-node IBA at
      PTN000958212). EPS8L2 itself contributes the GEF-stimulating activity of the complex, so this is
      participation, not an indirect effect.
    supported_by:
    - reference_id: PMID:14565974
      supporting_text: Thus, the members of the eps8 family display overlapping functional properties, which
        can be ranked by their ability to elicit Rac-GEF activity and to substitute for eps8 (eps8 = eps8L2
        > eps8L1 ≫ eps8L3), and generate functional redundancy in pathway connecting RTK to Rac.
