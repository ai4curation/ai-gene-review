id: A0A9L0KBR4
gene_symbol: EPS8L2
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of the single ProtNLM2 GO prediction for donkey EPS8L2 (A0A9L0KBR4), an EPS8-family
  actin-binding signaling adaptor that is 84% identical to human EPS8L2. The predicted process phosphorylation
  (GO:0016310) is judged incorrect (NPI); its ProtNLM2 evidence key is the UniProt Phosphoprotein keyword
  (KW-0597), and being a phosphorylated protein does not make EPS8L2 a participant that carries out phosphorylation.
  ProtNLM2 also emitted a subcellular location of Cytoplasm (evidence key KW-0963), which agrees with the
  experimentally supported cytoplasmic localization of human EPS8L2 and with the donkey GOA cytoplasm row;
  no function text was emitted. Non-GO outputs are noted, not scored.
source_documents:
- projects/PROTNLM_EVALUATION/donkey40/donkey40-predictions.tsv
- projects/PROTNLM_EVALUATION/donkey40/donkey40-evidence.tsv
- genes/EQUAS/EPS8L2/EPS8L2-uniprot.txt
- genes/EQUAS/EPS8L2/EPS8L2-goa.tsv
- genes/EQUAS/EPS8L2/EPS8L2-bioinformatics/human-EPS8L2-Q9H6S3-uniprot.txt
- genes/EQUAS/EPS8L2/EPS8L2-bioinformatics/RESULTS.md
predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0016310
    label: phosphorylation
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: GO:0016310 phosphorylation is the process of introducing a phosphate group, so it applies to
      gene products that catalyze or directly carry out phosphate transfer. EPS8L2 has no kinase domain;
      its domains are PTB, SH3 and the EPS8 actin-binding effector region, and its characterized activities
      are F-actin association and stimulation of SOS1 exchange activity toward Rac. The ProtNLM2 evidence
      for this prediction is the Phosphoprotein keyword (KW-0597), which describes EPS8L2 as a substrate
      of phosphorylation rather than as an agent of it. The term is absent from donkey GOA, which instead
      carries actin binding, Rho protein signal transduction and ruffle-assembly terms. The prediction is
      therefore refuted for EPS8L2.
    supported_by:
    - reference_id: file:EQUAS/EPS8L2/EPS8L2-bioinformatics/human-EPS8L2-Q9H6S3-uniprot.txt
      supporting_text: Stimulates guanine exchange activity of SOS1.
    - reference_id: file:EQUAS/EPS8L2/EPS8L2-uniprot.txt
      supporting_text: Belongs to the EPS8 family.
    - reference_id: file:EQUAS/EPS8L2/EPS8L2-bioinformatics/RESULTS.md
      supporting_text: 'Paired residues: 679; identical: 572; identity over paired: 84.24%'
