- projects/PROTNLM_EVALUATION/donkey40/donkey40-predictions.tsv
- genes/EQUAS/LNPEP/LNPEP-uniprot.txt
- genes/EQUAS/LNPEP/LNPEP-goa.tsv
- genes/EQUAS/LNPEP/LNPEP-bioinformatics/human_Q9UIQ6-uniprot.txt
- genes/EQUAS/LNPEP/LNPEP-bioinformatics/RESULTS.md
predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0016020
    label: membrane
  predicted_term_type: GO_CC
  review:
    assessment: LSP
    confidence_score: 2
    summary: The donkey protein has a single N-terminal transmembrane segment (110-131) and human
      LNPEP is a single-pass type II cell-membrane protein that also resides in GLUT4-containing
      intracellular vesicles. Membrane is therefore correct. Donkey GOA already contains membrane
      and the more specific plasma membrane, so the prediction is correct but less precise than
      an existing annotation.
    supported_by:
    - reference_id: file:EQUAS/LNPEP/LNPEP-bioinformatics/human_Q9UIQ6-uniprot.txt
      supporting_text: |-
        Cell membrane {ECO:0000269|PubMed:11389728};
        CC       Single-pass type II membrane protein {ECO:0000269|PubMed:11389728}.
    - reference_id: file:EQUAS/LNPEP/LNPEP-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A9L0JGC2 (1026 residues) aligns to human Q9UIQ6 (1025
        residues) with 91.02% identity across 1025 paired residues.
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0008237
    label: metallopeptidase activity
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: Donkey LNPEP conserves the M1 zinc ligands (H464, H468, E487) and the proton acceptor
      E465, and the human ortholog is a characterized zinc aminopeptidase that hydrolyzes oxytocin,
      vasopressin and angiotensin III. Metallopeptidase activity is therefore correct. Donkey GOA
      already contains this exact term (InterPro2GO) and its more specific descendant
      metalloaminopeptidase activity (TreeGrafter), so the prediction is less precise than an
      existing annotation.
    supported_by:
    - reference_id: file:EQUAS/LNPEP/LNPEP-bioinformatics/RESULTS.md
      supporting_text: 'ACT_SITE (Proton acceptor): human [465] E -> donkey [465] E.'
    - reference_id: file:EQUAS/LNPEP/LNPEP-bioinformatics/RESULTS.md
      supporting_text: 'BINDING (): human [468] H -> donkey [468] H.'
    - reference_id: PMID:1731608
      supporting_text: the enzyme hydrolyzed oxytocin, vasopressin, and angiotensin III
