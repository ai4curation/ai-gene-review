id: A0A9L0JGC2
gene_symbol: LNPEP
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 2 ProtNLM2 GO predictions for donkey LNPEP (A0A9L0JGC2), a type II
  membrane M1 zinc aminopeptidase that is 91% identical to human LNPEP over its full length, with
  the zinc ligands and proton acceptor conserved. Both predictions are correct but generic; the
  donkey GOA record already contains each exact term together with a more specific annotation
  (plasma membrane; metalloaminopeptidase activity), so both are scored LSP. The donkey40 snapshot
  has no non-GO ProtNLM2 output (function text or location) for this accession.
