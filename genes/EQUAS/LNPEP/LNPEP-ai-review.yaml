taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: LNPEP (leucyl-cystinyl aminopeptidase; also called insulin-regulated aminopeptidase IRAP,
  oxytocinase or placental leucine aminopeptidase) is a zinc-dependent M1 metalloaminopeptidase. It is
  a single-pass type II membrane protein with a short cytosolic N-terminal tail carrying dileucine sorting
  motifs and a large lumenal/extracellular catalytic domain. It resides in insulin-responsive intracellular
  vesicles together with GLUT4 and at the plasma membrane, and removes N-terminal residues from peptide
  hormones and neuropeptides including oxytocin, vasopressin and angiotensin III; it is also the angiotensin
  IV (AT4) binding site. The donkey protein (1026 aa) is 91% identical to human LNPEP and conserves the
  zinc ligands, proton acceptor, GAMEN motif and dileucine motifs.
