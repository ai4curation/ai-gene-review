suggested_questions:
- question: Is the 10-residue N-terminal extension of the donkey SLC27A5 model a real coding start, and
    does donkey liver show the same bile acid-CoA ligase substrate range as human?
- question: GO:0002152 bile acid conjugation is currently annotated only to BAAT, although its definition
    comment names cholate-CoA ligase activity as the first step; should the bile acid-CoA ligase (SLC27A5)
    also carry this process term in human and mouse?
suggested_experiments:
- description: Assay donkey liver microsomes and recombinant donkey SLC27A5 for cholate, chenodeoxycholate
    and lignocerate CoA-ligase activity.
