id: A0A9L0JNL2
gene_symbol: SLC27A5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: SLC27A5 (bile acyl-CoA synthetase, BACS; fatty acid transport protein 5, FATP5) is a liver-enriched
  member of the ATP-dependent AMP-binding (acyl-CoA synthetase) family anchored in the endoplasmic reticulum
  membrane by an N-terminal hydrophobic region, with a large cytoplasmic catalytic domain. Its main role
  is the ATP-dependent activation of C24 bile acids (cholate, chenodeoxycholate and the secondary bile
  acids deoxycholate and lithocholate) to their CoA thioesters, the step that precedes glycine or taurine
  conjugation, so that bile acids returning to the liver through the enterohepatic circulation are re-activated
  and re-conjugated. It also activates long-chain and very-long-chain fatty acids (C18 to C26) to acyl-CoAs
  and contributes to hepatic long-chain fatty acid uptake; in mouse liver it is also detected at the basal
  (sinusoidal) plasma membrane of hepatocytes, and loss of the mouse gene leaves most gallbladder bile acids
  unconjugated and reduces hepatocyte fatty acid uptake. The donkey protein A0A9L0JNL2 belongs to the same
  PANTHER subfamily as human, mouse and rat SLC27A5 (PTHR43107:SF25) and is 81% identical to human SLC27A5
  over the full human length, with a 10-residue N-terminal extension that the horse gene model shares.
