description: 'Assessment of 1 ProtNLM2 GO prediction for donkey SLC27A5 (A0A9L0JNL2), judged against the
  donkey GOA record (long-chain, very-long-chain and cholate CoA-ligase activities; long-chain fatty acid,
  very long-chain fatty acid and bile acid metabolic processes; ER membrane and others), the human ortholog
  Q9Y2P5 with its enzyme characterization (PMID:10749848, PMID:10479480), and a donkey-human alignment (81%
  identity over the full human length). Lipid metabolic process is correct but much less specific than
  the curated process annotations (LSP). Non-GO ProtNLM2 outputs, not scored: subcellular locations ''Endoplasmic
  reticulum membrane'' (agrees with the human experimental localization) and ''Membrane'' (true but uninformative).
  No function text was emitted for this accession.'
