    summary: SLC27A5 activates bile acids and long- and very-long-chain fatty acids to their CoA thioesters
      (human data, PMID:10749848 and PMID:10479480), and the donkey protein retains the AMP-binding catalytic
      domain at 81% identity, so participation in lipid metabolism is correct. Donkey GOA already carries
      the more specific descendants long-chain fatty acid metabolic process, very long-chain fatty acid
      metabolic process and bile acid metabolic process, so the prediction is correct but less precise
      than existing annotations. Training-set membership is unknown.
