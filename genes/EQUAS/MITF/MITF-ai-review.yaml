- term:
    id: GO:0046983
    label: protein dimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011598
  - InterPro:IPR036638
  review:
    summary: Protein dimerization activity (InterPro2GO, HLH domain).
    action: KEEP_AS_NON_CORE
    reason: Correct. MITF forms homodimers and heterodimers with TFE3, TFEB or TFEC through its HLH-leucine zipper,
      and efficient DNA binding requires dimerization. Homodimerization and heterodimerization with MiT/TFE partners
      are both documented, so the parent term is as precise as a single annotation can be. It supports DNA binding
      rather than being a separate core function, so keep as non-core.
    supported_by:
