taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: MITF (melanocyte inducing transcription factor) is a basic helix-loop-helix leucine-zipper
  (bHLH-Zip) transcription factor of the MiT/TFE family (with TFE3, TFEB and TFEC). It binds E-box (CACGTG)
  and M-box (TCATGTG) elements as a homodimer or heterodimer with other MiT/TFE members and activates
  RNA polymerase II transcription of pigmentation genes such as TYR and TYRP1, acting as the master regulator
  of melanocyte survival, differentiation and melanosome biogenesis; it also controls differentiation
  of retinal pigment epithelium, mast cells and osteoclasts. Its activity is controlled by nutrient-dependent
  mTORC1 phosphorylation, which favours cytoplasmic retention and degradation, whereas starvation promotes
  nuclear accumulation. The donkey protein (610 aa) is 98.4% identical to human MITF over 495 paired residues,
  with the bHLH domain fully identical; its N-terminal 115 residues have no counterpart in the human canonical
  isoform and likely reflect an alternative first exon.
