  label: Equus asinus
description: 'MITF (melanocyte inducing transcription factor) is a basic helix-loop-helix leucine-zipper (bHLH-Zip)
  transcription factor of the MiT/TFE family (with TFE3, TFEB and TFEC). It binds E-box (CACGTG) and M-box (TCATGTG)
  elements as a homodimer or as a heterodimer with other MiT/TFE members, and activates RNA polymerase II transcription
  of pigmentation genes such as TYR and TYRP1. It is the master regulator of melanocyte survival, differentiation
  and melanosome biogenesis, and also controls differentiation of retinal pigment epithelium, mast cells and osteoclasts.
  Its nuclear activity is controlled by nutrient signalling: in nutrient-replete cells active Rag GTPases recruit
  MITF to lysosomes, where mTORC1 phosphorylation promotes 14-3-3 binding and cytoplasmic retention, whereas mTORC1
  inhibition or starvation promotes nuclear accumulation. Alternative promoters and first exons generate several
  isoforms (A, B, C, H, M and others) that share the bHLH-Zip and C-terminal regions. The donkey gene product described
  here (610 aa) is an isoform A-type product with an unusual 115-residue N-terminal extension; its bHLH domain is
  identical to that of human MITF.'
