  review:
    assessment: LSP
    confidence_score: 2
    summary: Human MITF is a sequence-specific transcription factor that binds E-box and M-box promoter
      elements and regulates RNA polymerase II transcription of TYR and TYRP1; the donkey bHLH domain
      is 54/54 identical and the protein is 98.4% identical over paired residues. The predicted term is
      correct and is already in donkey GOA (InterPro2GO), but donkey GOA also has the more specific regulation
      of transcription by RNA polymerase II (GO:0006357, a descendant), so the prediction is less precise.
