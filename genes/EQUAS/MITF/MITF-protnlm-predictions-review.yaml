description: Assessment of the single ProtNLM2 GO prediction for donkey MITF (A0A9L0JBN5), a bHLH-Zip
  MiT/TFE transcription factor 98.4% identical to human MITF. Regulation of DNA-templated transcription
  is correct but less precise than the regulation of transcription by RNA polymerase II already in donkey
  GOA (LSP). ProtNLM2 emitted no function text or subcellular-location output for this accession.
