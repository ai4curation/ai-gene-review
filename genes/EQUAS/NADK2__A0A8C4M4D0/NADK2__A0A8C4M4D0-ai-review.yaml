- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00028628
  review:
    summary: Mitochondrial matrix (ARBA). NADK2 is a soluble enzyme with no transmembrane segment. It
      is imported by a cleavable N-terminal targeting sequence, and it supplies NADP(H) to matrix
      NADP-dependent enzymes such as dienoyl-CoA reductase and the first enzyme of lysine degradation
      (PMID:24847004).
    action: ACCEPT
    reason: The matrix is the compartment in which NADK2 is expected to act. The NADP-dependent enzymes
      that become deficient when NADK2 is lost are matrix oxidoreductases, and the protein has a
      transit peptide but no membrane anchor. This placement has not been confirmed by submitochondrial
      fractionation in any species, so it is the most specific location that is reasonably supported
      rather than a measured one.
    supported_by:
    - reference_id: PMID:24847004
      supporting_text: DECR and also the first step in lysine degradation are performed by NADP-dependent
        oxidoreductases explaining their in vivo deficiency
    - reference_id: PMID:23212377
      supporting_text: confirming that C5orf33 protein is a mitochondrial NADK, and that its N-terminal
        62 residues contain a functional mitochondrial-targeting sequence
- term:
    id: GO:0019674
    label: NAD+ metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR017437
  - PANTHER:PTN001407776
  review:
    summary: NAD+ metabolic process from the combined IEA pipeline (InterPro IPR017437 and the PANTHER
      node). It matches the PAINT IBD for this term at PTN004406956, seeded by human NADK2. The enzyme
      consumes NAD+ to make NADP+.
    action: MODIFY
    reason: The term is true but general. The step that NADK2 itself catalyses is the phosphorylation
      of NAD+ to NADP+, and NAD kinase is the only enzyme that makes NADP+, so NADP+ biosynthetic process
      (GO:0006741) is the precise term. GO:0006741 is an is_a descendant of GO:0019674 (checked with OLS
      hierarchicalAncestors), and the donkey UniProt record also carries it through InterPro. The
      participation test is met because NADK2 performs the step.
    proposed_replacement_terms:
    - id: GO:0006741
      label: NADP+ biosynthetic process
    supported_by:
    - reference_id: PMID:23212377
      supporting_text: NAD kinase is the sole NADP(+) biosynthetic enzyme
    - reference_id: PMID:24847004
      supporting_text: NADK2 encodes the mitochondrial NAD kinase, which is crucial for NADP biosynthesis
        evidenced by decreased mitochondrial NADP(H) levels in patient fibroblasts
    - reference_id: file:EQUAS/NADK2__A0A8C4M4D0/NADK2__A0A8C4M4D0-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR002504; NADK.
