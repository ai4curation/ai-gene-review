suggested_questions:
- question: Does donkey NADK2 start translation at Met1 of the Ensembl model or at Met97, which aligns
    to human Met1? The 96-residue upstream extension is shared by all equid models; if it is translated,
    is the internal transit-peptide-equivalent region (donkey 97-158) still recognised for import?
- question: Is the homodimeric state of NADK2, recorded for human by IDA but not propagated by PAINT,
    supported by structural or biochemical evidence strong enough to justify a family-level homodimerization
    annotation?
suggested_experiments:
- description: Express donkey NADK2 (residues from Met97, with and without the upstream extension) in
    the Saccharomyces cerevisiae utr1 yef1 pos5 NADK triple mutant and as a purified recombinant protein,
    to confirm ATP-dependent NAD+ kinase activity and measure its kinetics against human NADK2.
  experiment_type: complementation and enzyme assay
- description: Map the native N-terminus of donkey NADK2 by mass spectrometry of mitochondrial fractions
    from donkey tissue (for example liver), and determine its submitochondrial location by protease
    protection or fractionation.
  experiment_type: proteomics and subcellular fractionation
