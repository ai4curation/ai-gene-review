id: A0A8C4M4D0
gene_symbol: NADK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: NADK2 is the mitochondrial NAD(+) kinase (EC 2.7.1.23) of the NAD kinase family (PANTHER
  PTHR13158:SF5, NAD kinase 2, mitochondrial). It transfers the gamma-phosphate of ATP (or, in vitro,
  of inorganic polyphosphate) to NAD(+) to form NADP(+), and is the source of the mitochondrial NADP(H)
  pool, separate from the cytosolic pool made by NADK. The NADPH derived from this pool is used by
  NADP-dependent matrix oxidoreductases, such as 2,4-dienoyl-CoA reductase of polyunsaturated fatty
  acid oxidation and the first step of lysine degradation, and by mitochondrial antioxidant systems.
  The protein is imported into mitochondria by an N-terminal targeting sequence and acts as a soluble
  enzyme that is thought to form a homodimer. The donkey entry A0A8C4M4D0 (538 aa) is the full-length
  product of the donkey NADK2 gene. It aligns without gaps to the whole canonical human NADK2 sequence
  (96.8% identity), keeps the GGDG motif and the segment that carries the predicted NAD(+)-binding
  positions, and begins 96 residues upstream of the methionine that aligns to human Met1. All functional
  statements for the donkey protein rest on homology to the experimentally characterised human
  ortholog in the same subfamily; none has been tested in donkey.
