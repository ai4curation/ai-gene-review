  review:
    summary: Mitochondrion. Human NADK2 localises to mitochondria in HEK293A cells by immunofluorescence
      and by cell fractionation, and its N-terminal 62 residues are a functional mitochondrial targeting
      sequence (PMID:23212377). PAINT placed mitochondrion at PTN000994636, seeded by human and mouse
      NADK2.
    action: ACCEPT
    reason: Mitochondrion is the level of localisation that was established experimentally for the
      human ortholog in the same subfamily, and PAINT propagated it. The donkey sequence keeps the
      region equivalent to the human transit peptide (donkey 97-158). In every equid gene model this
      region lies 96 residues from the N-terminus, so the donkey start site is uncertain, but this
      does not cast doubt on the gene-level localisation. The more specific matrix location (next row)
      is inferred rather than assayed, so this row is kept as it stands.
    supported_by:
    - reference_id: PMID:23212377
