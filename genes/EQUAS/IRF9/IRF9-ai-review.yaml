  review:
    summary: IRF9 is the DNA-binding subunit of ISGF3 with STAT1 and STAT2.
    action: NEW
    reason: The donkey GOA record has no complex annotation. ISGF3 membership is the defining context of IRF9
      activity; IRF9 is itself a structural subunit of the complex, not a substrate or regulator of it. Human
      IRF9-deficient cells cannot form ISGF3, the donkey protein is in the IRF9 PANTHER subfamily, and it retains
      the IRF-association domain (Pfam IRF-3) that binds STAT2.
