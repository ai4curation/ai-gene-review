taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: IRF9 (interferon regulatory factor 9, ISGF3-gamma, p48) is the DNA-binding subunit of the interferon-stimulated
  gene factor 3 (ISGF3) transcription factor. After type I interferon (IFN-alpha/beta) activates the JAK kinases
  TYK2 and JAK1, IRF9 associates through its C-terminal IRF-association domain with tyrosine-phosphorylated
  STAT2 and STAT1, and the ISGF3 complex enters the nucleus, where the N-terminal tryptophan-pentad DNA-binding
  domain of IRF9 recognizes the interferon-stimulated response element (ISRE) and drives RNA polymerase II
  transcription of interferon-stimulated genes, establishing an antiviral state. The donkey protein conserves
  the DNA-binding domain, including all five pentad tryptophans, and the IRF-association domain, and carries
  a short C-terminal extension relative to human.
