  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008986835
  review:
    summary: True but uninformative; IRF9's immune role is specifically type I interferon signalling.
    action: MODIFY
    reason: The family-level PAINT term is correct for IRF9, but the specific, well-established process is
      type I interferon-mediated signalling, in which IRF9 is the DNA-binding component of ISGF3 that carries
      the signal to interferon-stimulated gene promoters. IRF9-deficient human cells fail to form ISGF3 in
      response to IFN-alpha2b. This replacement is the transducing step IRF9 itself performs, not a downstream
      organismal phenotype.
    proposed_replacement_terms:
    - id: GO:0060337
      label: type I interferon-mediated signaling pathway
    supported_by:
    - reference_id: PMID:30143481
      supporting_text: Her cells activate gamma-activated factor (GAF) STAT1 homodimers but not IFN-stimulated
        gene factor 3 (ISGF3) trimers (STAT1/STAT2/IRF9) in response to IFN-α2b.
    - reference_id: file:EQUAS/IRF9/IRF9-bioinformatics/human_Q00978-uniprot.txt
      supporting_text: It mediates signaling by type I IFNs (IFN-alpha and IFN-beta).
