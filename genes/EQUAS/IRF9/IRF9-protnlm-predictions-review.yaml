description: Assessment of 3 ProtNLM2 GO predictions for donkey IRF9 (A0A9L0I7X9), using the human Swiss-Prot
  record Q00978 and donkey-human comparisons (80.41% identity overall; IRF DNA-binding domain 98 of 108 residues
  identical with all five pentad tryptophans conserved). All three predictions (positive regulation of transcription
  by RNA polymerase II, transcription cis-regulatory region binding, DNA-binding transcription factor activity)
  are biologically correct for the ISGF3 DNA-binding subunit and are already present as the exact terms in
  the donkey GOA record (CNN); the GOA record also holds the more specific RNA polymerase II DNA-binding and
  transcription factor terms. ProtNLM2 emitted no non-GO function-text or subcellular-location output for
  this accession in the frozen snapshot.
