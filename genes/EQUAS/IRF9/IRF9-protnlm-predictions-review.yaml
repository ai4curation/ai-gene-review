id: A0A9L0I7X9
gene_symbol: IRF9
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 3 ProtNLM2 GO predictions for donkey IRF9 (A0A9L0I7X9), the DNA-binding subunit
  of the ISGF3 transcription factor. The donkey protein sits in PANTHER subfamily PTHR11949:SF26 (IRF9) with
  human Q00978 and conserves the IRF DNA-binding domain (98 of 108 residues identical, all five pentad tryptophans
  conserved). All three predictions are biologically correct and already present as exact terms in the donkey
  GOA record. Positive regulation of transcription by RNA polymerase II matches the accepted core process (CNN).
  Transcription cis-regulatory region binding and DNA-binding transcription factor activity are true but less
  specific than the RNA polymerase II cis-regulatory sequence-specific DNA binding and RNA polymerase II-specific
  transcription factor terms accepted for this protein in the gene review (LSP). ProtNLM2 emitted no non-GO
  function-text or subcellular-location output for this accession in the frozen snapshot.
