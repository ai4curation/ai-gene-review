  predicted_term:
    id: GO:0005576
    label: extracellular region
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: Betaglycan exists both as a membrane-bound receptor and as a soluble form in serum and extracellular
      matrix; the soluble ectodomain is released by proteolytic shedding mediated by MT1-MMP (PMID:14672946),
      and the human gene review keeps extracellular region as a non-core location. The
      donkey protein conserves the signal peptide, ZP domain and transmembrane helix, so the same membrane-bound
      and shed forms are expected. The donkey GOA has plasma membrane and external side of plasma membrane
      but not extracellular region, so the prediction adds a correct location. It is a secondary location;
      the primary site of receptor function is the plasma membrane.
