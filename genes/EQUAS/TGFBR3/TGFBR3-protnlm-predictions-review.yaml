description: Assessment of the single ProtNLM2 GO prediction for donkey TGFBR3 (A0A8C4M6Z6, betaglycan),
  89.5% identical to human TGFBR3. Extracellular region is correct, reflecting the shed soluble ectodomain,
  and is absent from donkey GOA (COR). ProtNLM2 also emitted subcellular locations Extracellular matrix,
  Secreted and Extracellular space (not scored); these match the soluble form, but the output omits the
  primary cell-membrane (single-pass type I) location. No function text was emitted.
