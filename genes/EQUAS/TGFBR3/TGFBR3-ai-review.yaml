id: A0A8C4M6Z6
gene_symbol: TGFBR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: TGFBR3 (betaglycan, TGF-beta type III receptor) is a single-pass type I transmembrane proteoglycan
  with a large ectodomain (an N-terminal endoglin-like region and a C-terminal zona pellucida domain)
  that carries heparan and chondroitin sulfate chains, and a short cytoplasmic tail without kinase activity.
  It acts as a cell-surface coreceptor that binds TGF-beta isoforms (notably TGF-beta2), inhibin A and
  several BMPs and presents them to the signalling type II/type I receptor kinases, thereby enhancing
  TGF-beta, BMP and inhibin signalling; inhibin-betaglycan-ActRII complexes antagonize activin signalling.
  Through its cytoplasmic tail it recruits beta-arrestin2, which drives receptor internalization and regulates
  cell migration, CDC42 activation and NF-kappa-B. Ectodomain shedding releases a soluble form present
  in serum and extracellular matrix that can sequester ligand. It participates in epithelial-mesenchymal
  transformation in the developing heart. The donkey protein (836 aa) is 89.5% identical to human TGFBR3
  and conserves the signal peptide, ZP domain disulfides and transmembrane segment.
