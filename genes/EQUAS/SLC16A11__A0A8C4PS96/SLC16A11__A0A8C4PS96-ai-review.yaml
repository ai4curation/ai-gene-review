    supporting_text: In summary, bioinformatic analyses and transport assays together establish SLC16A11
      as a H+-coupled monocarboxylate transporter belonging to category I.
  - reference_id: PMID:28666119
    supporting_text: We found that BSG knockout significantly reduces localization of SLC16A11REF to
      the plasma membrane by ~80%
  - reference_id: file:EQUAS/SLC16A11__A0A8C4PS96/SLC16A11__A0A8C4PS96-bioinformatics/RESULTS.md
