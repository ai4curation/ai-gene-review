- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR011701
  review:
    summary: >-
      InterPro2GO process transfer from the MFS signature. True, but general.
    action: MODIFY
    reason: >-
      Correct but general. Monocarboxylic acids are carboxylic acids, and GO
      has carboxylic acid transmembrane transport (GO:1905039), an is_a
      descendant of transmembrane transport (checked in OLS). That is the most
      specific transmembrane-transport process the orthology evidence supports
      without naming a substrate. The substrate-specific pyruvate
      transmembrane transport is not proposed, because only pyruvate was
      tested in human and PAINT did not propagate the pyruvate terms.
    proposed_replacement_terms:
    - id: GO:1905039
      label: carboxylic acid transmembrane transport
    supported_by:
    - reference_id: PMID:28666119
      supporting_text: In summary, bioinformatic analyses and transport assays together establish SLC16A11
        as a H+-coupled monocarboxylate transporter belonging to category I.
