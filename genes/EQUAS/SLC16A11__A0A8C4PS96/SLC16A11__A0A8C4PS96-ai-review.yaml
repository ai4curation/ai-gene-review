id: A0A8C4PS96
gene_symbol: SLC16A11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: >-
  SLC16A11 (monocarboxylate transporter 11, MCT11) in donkey is a twelve-helix
  major facilitator superfamily transporter of the SLC16 monocarboxylate porter
  family, in the MCT11 subfamily (PANTHER PTHR11360:SF80) shared with human
  MCT11. This entry (520 aa) is the only donkey transcript model that contains
  the whole human MCT11 sequence (all 447 residues, 90.6% identity); its first 73
  residues lie upstream of the position of the human start methionine and are
  probably a gene-model extension. No experiments have been done on the donkey
  protein. By orthology with human MCT11, it is expected to be a proton-coupled
  (category I) monocarboxylate transporter; the human protein moves pyruvate
  together with protons across the plasma membrane, depends on the chaperone
  basigin (BSG) for its cell-surface delivery, and is found mostly in the
  endoplasmic reticulum membrane when overexpressed. Pyruvate is the only
  substrate tested in human, so the donkey substrate range is not known. In
  humans, common SLC16A11 variants that lower its expression or its basigin
  interaction are associated with type 2 diabetes risk, and overexpression
  raises cellular triacylglycerol, but these are not established as direct roles
  of the transporter.
existing_annotations:
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0097
  review:
    summary: >-
      Electronic mapping of an ARBA-rule subcellular location. The human
      ortholog (same PANTHER subfamily SF80, 90.6% identity over its whole
      length) localises mainly to the ER membrane when V5-tagged and
      overexpressed in HeLa and HEK293T cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      The ER location is supported for the human ortholog by imaging and
      fractionation of overexpressed, tagged protein, and the donkey sequence
      keeps the full transporter core, so the location is plausible by
      orthology. It is not the compartment where transport has been shown;
      the ER pool most likely reflects biosynthetic residence of a transporter
      that needs basigin to reach the cell surface. Kept, but non-core. Not
      shown in donkey.
    supported_by:
    - reference_id: PMID:24390345
      supporting_text: SLC16A11-V5 co-localizes with the endoplasmic reticulum membrane protein Calnexin,
        but shows minimal overlap with plasma membrane, Golgi apparatus and mitochondria
    - reference_id: PMID:28666119
      supporting_text: the majority of SLC16A11REF-V5 is associated with intracellular membranes, with
        a portion (~5%) localized to the plasma membrane
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: >-
      Electronic mapping of an ARBA-rule subcellular location. The plasma
      membrane is where the human ortholog performs proton-coupled pyruvate
      transport, and PAINT places plasma membrane at node PTN002260587 of the
      PTHR11360 family, which includes human MCT11.
    action: ACCEPT
    reason: >-
      Human MCT11 is at the plasma membrane, where its transport activity is
      measured, and its delivery there depends on basigin. The family-level
      PAINT assertion and the near-identity of the donkey sequence make the
      transfer sound. This is an inference by orthology; it has not been shown
      in donkey.
    supported_by:
    - reference_id: PMID:28666119
      supporting_text: We found that BSG knockout significantly reduces localization of SLC16A11REF to
        the plasma membrane by ~80%
    - reference_id: file:EQUAS/SLC16A11__A0A8C4PS96/SLC16A11__A0A8C4PS96-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR11360:SF80; MONOCARBOXYLATE TRANSPORTER 11; 1.
- term:
    id: GO:0008028
    label: monocarboxylic acid transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN008966426
  review:
    summary: >-
      TreeGrafter transfer of a PAINT assertion. In PTHR11360, PAINT placed
      GO:0008028 by IBD at node PTN000888455 (Eumetazoa), with human MCT11
      (Q8NCK7) among the experimental donors. Donkey SLC16A11 falls in the same
      subfamily as human MCT11 (SF80) and keeps all twelve transmembrane
      segments (81-95% identical to human).
    action: ACCEPT
    reason: >-
      This is the core activity. Human MCT11 is an H+-coupled category I
      monocarboxylate transporter. The specific substrate shown experimentally
      is pyruvate, in heterologous HEK293T cells; no other substrate was
      tested. PAINT propagated only the monocarboxylate-level term and none of
      the pyruvate-specific terms, so for donkey the broader term is as precise
      as the evidence allows. Inferred by orthology; not tested in donkey.
    supported_by:
    - reference_id: PMID:28666119
      supporting_text: In summary, bioinformatic analyses and transport assays together establish SLC16A11
        as a H+-coupled monocarboxylate transporter belonging to category I.
    - reference_id: file:EQUAS/SLC16A11__A0A8C4PS96/SLC16A11__A0A8C4PS96-bioinformatics/RESULTS.md
      supporting_text: All 447 residues of human Q8NCK7 align to the donkey entry, with 90.6% identity
        over the aligned pairs.
- term:
    id: GO:0015718
    label: monocarboxylic acid transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008966426
  review:
    summary: >-
      TreeGrafter process term matching the transporter activity above. A
      monocarboxylate transporter takes part directly in monocarboxylic acid
      transport.
    action: ACCEPT
    reason: >-
      This is the process the transporter itself carries out, so the protein
      does the work of the process, not merely support it. GO has no
      monocarboxylic acid transmembrane transport term, so this is the most
      specific process term that matches the accepted activity without naming
      a substrate. Inferred by orthology with human MCT11.
    supported_by:
    - reference_id: PMID:28666119
      supporting_text: In summary, bioinformatic analyses and transport assays together establish SLC16A11
        as a H+-coupled monocarboxylate transporter belonging to category I.
