core_functions:
- description: >-
    Proton-coupled (category I) monocarboxylate transporter at the plasma
    membrane, inferred by orthology with human MCT11 (same PANTHER subfamily
    PTHR11360:SF80, 90.6% identity over the whole human sequence). The human
    protein transports pyruvate with protons and needs basigin to reach the
    cell surface. None of this has been tested in donkey, and its substrate
    range beyond pyruvate is unknown.
  molecular_function:
