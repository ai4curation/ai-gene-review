suggested_questions:
- question: >-
    Does donkey SLC16A11 start at Met74 (the position of human Met1)? If so,
    is the 73-residue N-terminal extension in A0A8C4PS96 a gene-model
    artefact?
- question: >-
    Besides pyruvate, which monocarboxylates (lactate, ketone bodies) does
    MCT11 transport? Would substrate-level terms such as pyruvate
    transmembrane transporter activity then be justified at a PAINT node
    covering mammalian MCT11?
suggested_experiments:
- description: >-
    Express donkey SLC16A11 starting at Met74, with and without BSG, in
    HEK293T cells. Measure proton-coupled pyruvate and lactate flux with the
    pyronic FRET sensor and BCECF pH imaging, and measure plasma-membrane
    localisation by surface extraction.
  experiment_type: heterologous transport assay
