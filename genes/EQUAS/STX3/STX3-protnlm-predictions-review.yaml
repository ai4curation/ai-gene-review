id: A0A9L0J901
gene_symbol: STX3
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 2 ProtNLM2 GO predictions for donkey STX3 (A0A9L0J901), a full-length
  tail-anchored syntaxin with 92% identity to human syntaxin-3 isoform A. Both predictions are
  correct but generic, and both terms are already in the donkey GOA record beside more specific
  annotations (plasma membrane; vesicle fusion and exocytosis), so both are scored LSP. ProtNLM2
  also emitted a non-GO subcellular location ("Membrane") for this accession, which is not scored
  here.
source_documents:
- projects/PROTNLM_EVALUATION/donkey40/donkey40-predictions.tsv
- genes/EQUAS/STX3/STX3-uniprot.txt
- genes/EQUAS/STX3/STX3-goa.tsv
- genes/EQUAS/STX3/STX3-bioinformatics/human_Q13277-uniprot.txt
- genes/EQUAS/STX3/STX3-bioinformatics/RESULTS.md
predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0016020
    label: membrane
  predicted_term_type: GO_CC
  review:
    assessment: LSP
    confidence_score: 2
    summary: The donkey protein has a Phobius-predicted C-terminal transmembrane anchor (264-288), the
      tail anchor expected for a syntaxin, so membrane is correct. Human STX3
      isoform A, to which the donkey sequence corresponds over its full length, localizes to the
      apical plasma membrane. Donkey GOA already carries both membrane and the more specific plasma
      membrane, so the prediction is correct but less precise than an existing annotation.
    supported_by:
    - reference_id: file:EQUAS/STX3/STX3-uniprot.txt
      supporting_text: TRANSMEM        264..288
    - reference_id: file:EQUAS/STX3/STX3-bioinformatics/human_Q13277-uniprot.txt
      supporting_text: '[Isoform A]: Apical cell membrane'
    - reference_id: file:EQUAS/STX3/STX3-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A9L0J901 (289 residues) aligns to human Q13277 (289
        residues) with 92.39% identity across 289 paired residues.
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0016192
    label: vesicle-mediated transport
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: The donkey protein conserves the t-SNARE (SNARE motif) domain, and human STX3 is the
      apical receptor that mediates fusion of apical vesicles, so vesicle-mediated transport is
      correct. Donkey GOA already contains this exact term (InterPro2GO) together with the more
      specific vesicle fusion and exocytosis (TreeGrafter), both descendants of the predicted
      term. The prediction is therefore correct but less precise than
      existing annotation.
    supported_by:
    - reference_id: file:EQUAS/STX3/STX3-uniprot.txt
      supporting_text: T-SNARE coiled-coil homology
    - reference_id: file:EQUAS/STX3/STX3-bioinformatics/human_Q13277-uniprot.txt
      supporting_text: |-
        Apical receptor involved in membrane fusion
        CC       of apical vesicles.
    - reference_id: PMID:24726755
      supporting_text: STX3 is an apical receptor involved in membrane fusion of apical vesicles in enterocytes.
