    summary: 'SNARE binding: the SNARE motif of syntaxin 3 pairs with SNAP25-family and VAMP partners.'
    action: ACCEPT
    reason: Donkey STX3 belongs to the syntaxin-3 subfamily (PANTHER PTHR19957:SF34) and the TreeGrafter transfer
