id: A0A9L0J901
gene_symbol: STX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: STX3 (syntaxin-3) is a tail-anchored Qa-SNARE of the syntaxin family. Through its N-terminal
  Habc regulatory region and its SNARE motif it pairs with SNAP25-family proteins and VAMPs to form trans-SNARE
  complexes that fuse transport vesicles with the plasma membrane. In polarized epithelia it is the apical
  plasma-membrane syntaxin that mediates fusion of apical carriers, which is required for brush-border
  microvillus formation in enterocytes and for photoreceptor survival; in neurons it also participates
  in postsynaptic exocytosis. The donkey protein (289 aa) is a full-length counterpart of human isoform
  A with 92% identity.
