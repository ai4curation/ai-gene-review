id: A0A9L0J901
gene_symbol: STX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: STX3 (syntaxin-3) is a tail-anchored Qa-SNARE of the syntaxin family. Its N-terminal Habc regulatory
  region binds Munc18-family proteins, and its SNARE motif pairs with SNAP25-family proteins and VAMPs to form trans-SNARE
  complexes that fuse transport vesicles with the plasma membrane. Alternative splicing of the C-terminal exons
  yields syntaxin 3A, the apical plasma-membrane syntaxin of polarized epithelia that fuses apical carriers and
  is required for enterocyte brush-border integrity, and syntaxin 3B, the t-SNARE of retinal ribbon synapses that
  drives synaptic vesicle exocytosis in photoreceptors and bipolar cells; a soluble splice form lacking the anchor
  has a reported nuclear role. In neurons syntaxin 3 also mediates postsynaptic exocytosis. The donkey gene model
  A0A9L0J901 (289 aa) is a non-canonical transcript that joins the syntaxin 3B exon for the C-terminal half of the
  SNARE motif to the syntaxin 3A transmembrane anchor; it retains a complete Habc region, SNARE motif and tail anchor.
