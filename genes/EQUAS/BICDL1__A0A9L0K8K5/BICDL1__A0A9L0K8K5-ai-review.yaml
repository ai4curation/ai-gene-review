  review:
    summary: BICDL1 recruits dynein-dynactin and KIF1C to Rab6-positive secretory vesicles, and so controls
      their microtubule-based traffic and their accumulation around the centrosome.
    action: ACCEPT
    reason: This is a TreeGrafter transfer within PANTHER subfamily PTHR32123:SF12. The PAINT IBD for this term
      sits on the deuterostome node PTN001281025, seeded by zebrafish bicdl1, so donkey falls inside the clade
      that inherited the function. Mouse BICDR-1 drives dynein-dependent traffic of Rab6/NPY secretory vesicles
      and accelerates their minus-end-directed movement. As the motor adaptor on the vesicle, BICDL1 performs
      part of the transport itself. This is the core process.
    supported_by:
    - reference_id: PMID:20360680
      supporting_text: Here, we show that BICDR-1 is a Rab6 effector, recruits dynein/dynactin and Kif1C to Rab6/NPY-positive
        secretory vesicles and controls the trafficking and distribution of these carriers.
    - reference_id: PMID:25176647
      supporting_text: BICD-related protein 1 (BICDR-1) accelerates minus-end-directed vesicle movements and affects
        Rab6 vesicle distribution.
- term:
    id: GO:0055107
    label: Golgi to secretory granule transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A0JNT9
  - ensembl:ENSMUSP00000053547
  - PANTHER:PTN001594046
  review:
    summary: BICDL1 regulates the post-Golgi movement of Rab6/NPY-positive secretory carriers, mostly by holding
      them near the centrosome rather than delivering them to the periphery.
    action: KEEP_AS_NON_CORE
    reason: A PAINT curator placed this term on node PTN001281025 with mouse Bicdl1 (MGI:1922915) as the seed,
      and donkey inherits it through SF12; the Ensembl Compara transfer from mouse agrees. The carriers that
      BICDR-1 controls contain Rab6 and NPY-GFP, and NPY is a dense-core secretory cargo, so the term's cargo is
      a reasonable fit. BICDR-1 mainly retains these vesicles in the pericentrosomal region, though, and limits
      their anterograde secretory transport, so its role in Golgi-to-granule delivery is regulatory and depends
      on context. The more general vesicle-transport-along-microtubule term is the core process. This term is
      kept as true but non-core, in deference to the IBD.
    supported_by:
    - reference_id: PMID:20360680
      supporting_text: Hela cells co-transfected with mCherry-BICDR-1 and NPY-GFP and stained for endogenous Rab6A
        showed that most of the centrosomal BICDR-1-positive vesicles contain NPY-GFP
- term:
    id: GO:0140660
    label: cytoskeletal motor activator activity
  evidence_type: ISS
  original_reference_id: PMID:29420470
  qualifier: enables
  review:
    summary: As an activating adaptor, BICDL1 turns dynein-dynactin into a processive motor. Because it
      preferentially recruits two dyneins, the motor is faster and generates more force.
    action: NEW
    reason: The donkey GOA record has no molecular function apart from two binding terms. In in vitro reconstitution,
      BICDR1-dynein-dynactin complexes move processively, and about 94% contain two dyneins. This is the defining
      activity of the BICDR subfamily, and cytoskeletal motor activator activity ("binds to and increases the
      activity of a motor protein") is the term that fits. BICDL1 does the activating work itself, so this is
      participation rather than requirement. Transfer is justified because donkey is in the same PANTHER subfamily
      (SF12) as the characterised mouse and human proteins and keeps the CC1 box and the full N-terminal coiled
      coil that binds dynein and dynactin. The activity has not been measured for the donkey protein.
    supported_by:
    - reference_id: PMID:29420470
      supporting_text: We conclude the majority of motile complexes containing BICD2 have one dynein, whereas both
        BICDR1 and HOOK3 preferentially recruit two.
    - reference_id: PMID:29420470
      supporting_text: This arrangement results in a dynein/dynactin complex that moves faster and can produce
        larger forces.
    - reference_id: file:EQUAS/BICDL1__A0A9L0K8K5/BICDL1__A0A9L0K8K5-bioinformatics/RESULTS.md
      supporting_text: 'CC1 box (AARLG), the dynein light-intermediate-chain binding motif of activating adaptors:
        donkey 114, mouse 116, human 113.'
