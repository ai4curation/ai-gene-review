suggested_questions:
- question: Does the isoform-2-type exon present in this donkey product (residues 442-489, between the dynein-binding
    and Rab6-binding regions) change how BICDL1 engages dynein-dynactin or Rab6, and is it the predominant donkey
    transcript in vivo?
suggested_experiments:
- description: Reconstitute dynein-dynactin with recombinant donkey BICDL1 (A0A9L0K8K5) and a variant lacking
    residues 442-489, and compare single-molecule velocity, run length and the fraction of complexes with two dyneins.
    This would test the inferred motor-activator activity directly in the donkey protein.
