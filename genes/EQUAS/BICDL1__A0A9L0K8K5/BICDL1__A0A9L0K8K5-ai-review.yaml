  title: Pericentrosomal targeting of Rab6 secretory vesicles by Bicaudal-D-related protein 1 (BICDR-1) regulates
    neuritogenesis.
  findings:
  - statement: Mouse BICDR-1 is a Rab6 effector that recruits dynein/dynactin and Kif1C to Rab6/NPY secretory
      vesicles and keeps them in the pericentrosomal region.
    supporting_text: BICDR-1 interacts with Rab6, Kif1C and the dynein/dynactin motor complex, and coordinates
      trafficking of Rab6/NPY-positive secretory vesicles.
  - statement: Kif1C binds the N-terminal region of BICDR-1.
    supporting_text: Both full-length BICDR-1 and an N-terminal region of BICDR-1, amino acids 1–353, interact
      with the C-terminal tail domain of Kif1C
  - statement: Lys512 of mouse BICDR-1 is required for Rab6 binding.
    supporting_text: showed that lysine 512 is required for binding to Rab6
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterisation of mouse BICDR-1 (full text cached). It is the source of the mouse
      experimental evidence behind the Ensembl Compara transfers and the PAINT seed MGI:1922915.
- id: PMID:29420470
  title: Cryo-EM shows how dynactin recruits two dyneins for faster movement.
  findings:
  - statement: BICDR1 preferentially recruits two dyneins to dynactin, which produces faster movement than with
      BICD2.
    supporting_text: We conclude the majority of motile complexes containing BICD2 have one dynein, whereas both
      BICDR1 and HOOK3 preferentially recruit two.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: In vitro reconstitution and cryo-EM of a BICDR1-dynein-dynactin complex (full text cached).
      It establishes the motor-activator activity of the subfamily and the direct contact of the BICDR1 coiled
      coil with dynactin.
- id: PMID:25176647
  title: Bicaudal d family adaptor proteins control the velocity of Dynein-based movements.
  findings:
  - statement: BICDR-1 accelerates dynein-driven, minus-end-directed movement of Rab6 vesicles in cells.
    supporting_text: BICD-related protein 1 (BICDR-1) accelerates minus-end-directed vesicle movements and affects
      Rab6 vesicle distribution.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in the cache. Corroborates the cell-based effect of BICDR-1 on dynein velocity.
