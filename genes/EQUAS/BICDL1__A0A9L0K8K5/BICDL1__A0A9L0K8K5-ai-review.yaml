id: A0A9L0K8K5
gene_symbol: BICDL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: BICDL1 (BICD family-like cargo adaptor 1, also called BICDR-1) is a cytoplasmic coiled-coil
  activating adaptor for cytoplasmic dynein-1 and a member of the BICDR branch of the Spindly/BICDR
  dynein-adaptor family. Its N-terminal coiled coil, which carries a CC1 box, binds dynein and dynactin
  and assembles a processive minus-end-directed motor that usually contains two dynein dimers, which makes
  it faster than complexes formed with BICD2. The N-terminal region also binds the kinesin-3 KIF1C, and the
  C-terminal region binds the GTP-bound forms of the Golgi and secretory-vesicle GTPases RAB6A and RAB6B.
  Through these interactions BICDL1 concentrates Rab6-positive secretory vesicles in the pericentrosomal
  region, which restricts their anterograde delivery in young neurons. This donkey product (626 aa) is the
  translation of the Ensembl canonical transcript of the donkey BICDL1 gene. It keeps the full canonical
  coiled-coil architecture of mouse and human BICDL1, including the CC1 box and the lysine needed for Rab6
  binding, and also includes the alternative exon found in human isoform 2. All of its functions are inferred
  from the mouse and human orthologs; none has been tested on the donkey protein.
existing_annotations:
- term:
    id: GO:0005813
    label: centrosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:A0JNT9
  - ensembl:ENSMUSP00000053547
  review:
    summary: Mouse BICDR-1 and its Rab6 vesicle cargo collect around the centrosome. This localization depends
      on dynein-dynactin and on microtubules.
    action: ACCEPT
    reason: This is an Ensembl Compara transfer from the one-to-one mouse ortholog Bicdl1 (A0JNT9), which is
      in the same PANTHER subfamily (PTHR32123:SF12) as the donkey product. Endogenous mouse BICDR-1 localizes
      around the gamma-tubulin-labelled centrosome, and loses that localization when dynein or dynactin is
      depleted. The protein is pericentrosomal rather than centriolar, and the centrosome term includes the
      pericentriolar material. The pericentrosomal position is where the adaptor holds its vesicle cargo, so
      it is the location of its core function. The donkey protein keeps the CC1 box and the C-terminal Rab6
      binding region on which this localization depends.
    supported_by:
    - reference_id: PMID:20360680
      supporting_text: Fluorescence microscopic analysis showed an intense perinuclear BICDR-1 staining (Supplementary
        Figure S2C–E) specifically localized around the γ-tubulin-labelled centrosome (Figure 3F).
    - reference_id: PMID:20360680
      supporting_text: Quantification showed that only ∼15% of the dynein/dynactin knockdown cells showed BICDR-1
        around the centrosome compared with ∼74% in control cells (Figure 4C).
- term:
    id: GO:0031175
    label: neuron projection development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A0JNT9
  - ensembl:ENSMUSP00000053547
  review:
    summary: In cultured rat hippocampal neurons, sustained BICDR-1 expression reduces neurite outgrowth by
      holding Rab6 secretory vesicles in the soma. BICDL1 does not itself carry out neurite development.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse source annotation rests on a cellular phenotype. Overexpression of BICDR-1, or of its
      Rab6-binding domain, in cultured neurons shortens neurites because Rab6 vesicles are retained around
      the centrosome and fewer reach the neurites. That makes BICDR-1 an indirect, negative influence on neurite
      growth, acting through its vesicle-transport function, and the evidence is from overexpression. The
      positive process term misstates that relationship. PAINT curators propagated the vesicle-transport terms
      from the same mouse seed to node PTN001281025 but did not propagate this term, which is consistent with
      treating it as downstream of the core function. It is not removed, because the vesicle positioning that
      BICDR-1 performs does influence neurite outgrowth.
    supported_by:
    - reference_id: PMID:20360680
      supporting_text: At 2, 3 and 4 days after transfection, BICDR-1-transfected neurons showed a marked reduction
        in neurite outgrowth compared with control cells transfected with an empty vector and β-galactosidase
        (Figure 8A and B).
    - reference_id: PMID:20360680
      supporting_text: At early developmental stages, pericentrosomal BICDR-1 restricts secretory transport
        and inhibits neuritogenesis, whereas later during neuronal development the reduction in BICDR-1 expression
        permits anterograde transport required for neurite outgrowth.
- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:A0JNT9
  - ensembl:ENSMUSP00000053547
  review:
    summary: BICDL1 is a Rab6 effector. Its C-terminal region binds the GTP-bound forms of RAB6A and RAB6B, and
      this binding attaches the adaptor to its vesicle cargo.
    action: ACCEPT
    reason: In mouse, both full-length BICDR-1 and its C-terminal region bind constitutively active Rab6A but
      not GDP-locked Rab6A, and Lys512 is required for the binding. Without Rab6A, BICDR-1 is lost from the
      pericentrosomal region, so Rab6 binding is how the adaptor recognises its cargo. The donkey product
      keeps the corresponding lysine (donkey Lys562, in an identical context) and the C-terminal BICDL1/2-like
      domain, and it is in the same PANTHER subfamily (SF12) as mouse Bicdl1. PAINT did not place a binding term
      at the deuterostome node, but that omission concerns the deep node; this row is a one-to-one transfer
      between two mammals with conserved binding residues. No Rab-specific GO term is available, so small GTPase
      binding is the appropriate term.
    supported_by:
    - reference_id: PMID:20360680
      supporting_text: Moreover, both full-length BICDR-1 and a C-terminal region of BICDR-1, amino acids 382–577,
        interact with constitutively active GTPase-deficient Rab6A-Q72R and not with GDP-locked inactive Rab6A-T27N
        in the yeast two-hybrid assay
    - reference_id: PMID:20360680
      supporting_text: GST-Rab6 pull-down assays with lysates of cells expressing mutant BICDR-1-K512M and an
        in vitro binding assay using purified His-BICDR-1C-K512M showed that lysine 512 is required for binding
        to Rab6 (Figure 3C).
    - reference_id: file:EQUAS/BICDL1__A0A9L0K8K5/BICDL1__A0A9L0K8K5-bioinformatics/RESULTS.md
      supporting_text: Mouse Lys512, required for Rab6 binding in mouse BICDR-1, aligns to donkey Lys562, in an
        identical 11-residue context (DAIQQKLNLSQ).
