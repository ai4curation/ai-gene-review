id: A0A8C4MD74
gene_symbol: TNFRSF1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: 'TNFRSF1A encodes tumor necrosis factor receptor 1 (TNFR1, p55/p60, CD120a), the principal signalling receptor
  for soluble TNF and lymphotoxin-alpha. It is a single-pass type I membrane protein whose extracellular region contains four
  cysteine-rich domains: the first carries the pre-ligand assembly domain, and the second and third contact trimeric ligand
  to form a 3:3 receptor-ligand complex. Its cytoplasmic death domain recruits the adaptor TRADD. At the plasma membrane,
  TRADD, RIPK1, TRAF2 and cIAPs form a signalling complex that activates canonical NF-kappaB and MAPK signalling and drives
  inflammatory gene expression. When that complex fails, TRADD and RIPK1 associate with FADD and caspase-8 in a cytoplasmic
  complex that triggers extrinsic apoptosis. The receptor is found at the plasma membrane, in lipid rafts and in a Golgi pool,
  and its ectodomain can be shed as a soluble TNF-binding protein. The donkey protein A0A8C4MD74 (453 aa) is the product of
  the canonical transcript and is the 1:1 ortholog of human TNFR1 (PANTHER PTHR46861:SF1, 76% identical), conserving all four
  cysteine-rich domains, the transmembrane helix and the death domain. Its functions are inferred from orthology; none has
  been tested in donkey.'
