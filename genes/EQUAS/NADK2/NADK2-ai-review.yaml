id: A0A9L0K2P4
gene_symbol: NADK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: NADK2 is the mitochondrial NAD(+) kinase (EC 2.7.1.23). It is imported into the mitochondrial
  matrix via an N-terminal transit peptide and phosphorylates NAD(+) using ATP (or, in vitro, inorganic
  polyphosphate) to produce NADP(+), making it the source of the mitochondrial NADP(H) pool used by NADPH-dependent
  matrix enzymes such as those of polyunsaturated fatty acid oxidation, lysine degradation and proline
  synthesis, and for antioxidant defence. The donkey protein A0A9L0K2P4 is the one-to-one ortholog of
  human NADK2 (96.6% identity over the aligned region); this gene model carries an extra N-terminal segment
  and lacks a 32-residue segment that is also absent from human isoform 2.
