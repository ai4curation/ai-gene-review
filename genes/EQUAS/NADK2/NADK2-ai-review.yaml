- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0173
  - PANTHER:PTN001407776
  review:
    summary: Mitochondrion. Human NADK2 localises to mitochondria in HEK293A cells and by cell fractionation,
      and its N-terminal 62 residues are a functional mitochondrial targeting sequence (PMID:23212377).
      PAINT placed mitochondrion at PTN000994636 (seeded by human and mouse NADK2), and loss of NADK2
      in patient fibroblasts lowers mitochondrial NADP(H) (PMID:24847004).
    action: ACCEPT
    reason: Experimentally established for the human ortholog in the same PANTHER subfamily and propagated
      by PAINT. The region equivalent to the human transit peptide (human 1-62) is conserved in the donkey
      sequence (donkey 97-158) but lies 96 residues from the N-terminus in all equid gene models, so the
      start site of the donkey protein is uncertain; the localisation itself is not in doubt at the gene
      level. Mitochondrial matrix (below) is the more specific location and is also accepted; this broader
      row agrees with it.
    supported_by:
    - reference_id: PMID:23212377
      supporting_text: confirming that C5orf33 protein is a mitochondrial NADK, and that its N-terminal
        62 residues contain a functional mitochondrial-targeting sequence
    - reference_id: PMID:24847004
      supporting_text: NADK2 encodes the mitochondrial NAD kinase, which is crucial for NADP biosynthesis
        evidenced by decreased mitochondrial NADP(H) levels in patient fibroblasts
    - reference_id: file:EQUAS/NADK2/NADK2-bioinformatics/RESULTS-rereview.md
      supporting_text: the region corresponding to the human transit peptide (human 1-62) is internal
        (donkey 97-158) in these models
- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00028628
  review:
    summary: Mitochondrial matrix (ARBA). NADK2 is a soluble enzyme without transmembrane segments that
      is imported by an N-terminal targeting sequence and supplies NADP(H) to matrix NADPH-dependent
      enzymes such as dienoyl-CoA reductase and the first enzyme of lysine degradation (PMID:24847004).
    action: ACCEPT
    reason: The matrix is the specific compartment in which NADK2 acts; the enzymes whose deficiency results
      from NADK2 loss are matrix oxidoreductases. This is the most specific supported location.
    supported_by:
    - reference_id: PMID:23212377
      supporting_text: confirming that C5orf33 protein is a mitochondrial NADK, and that its N-terminal
        62 residues contain a functional mitochondrial-targeting sequence
    - reference_id: PMID:24847004
      supporting_text: DECR and also the first step in lysine degradation are performed by NADP-dependent
        oxidoreductases explaining their in vivo deficiency
- term:
    id: GO:0019674
    label: NAD+ metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001407776
  review:
    summary: NAD+ metabolic process from TreeGrafter (PANTHER node PTN001407776), matching the PAINT
      IBD for this term at PTN004406956 seeded by human NADK2. The enzyme consumes NAD+ to make NADP+.
    action: MODIFY
    reason: True but general. The step NADK2 itself catalyses is the phosphorylation of NAD+ that forms
      NADP+, and NAD kinase is the only NADP+ biosynthetic enzyme, so NADP+ biosynthetic process (GO:0006741),
      an is_a descendant of NAD+ metabolic process (checked in OLS), is the precise term. The participation
      test is met because NADK2 performs the step. Replaces the separate NEW row of the earlier version
      of this review.
    proposed_replacement_terms:
    - id: GO:0006741
      label: NADP+ biosynthetic process
    supported_by:
    - reference_id: PMID:23212377
      supporting_text: NAD kinase is the sole NADP(+) biosynthetic enzyme
    - reference_id: PMID:24847004
      supporting_text: NADK2 encodes the mitochondrial NAD kinase, which is crucial for NADP biosynthesis
        evidenced by decreased mitochondrial NADP(H) levels in patient fibroblasts
