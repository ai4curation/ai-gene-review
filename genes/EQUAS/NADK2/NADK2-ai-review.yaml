  review:
    summary: NAD+ kinase activity transferred by the combined IEA pipeline (ARBA, EC mapping and the
      PANTHER node). The donkey gene belongs to PANTHER subfamily PTHR13158:SF5 together with human
      NADK2 (Q4G0N4), whose purified recombinant protein forms NADP+ from NAD+ with ATP or polyphosphate
      (PMID:23212377), and PAINT curators placed NAD+ kinase activity at PTN004406956, seeded by human
      and mouse NADK2.
    action: ACCEPT
    reason: 'The activity is the defining function of the NADK2 subfamily, and the subfamily placement
      of the donkey gene is the same as that of the characterised human protein, so the gene-level transfer
      is sound. Caveat for this specific gene model: A0A9L0K2P4 lacks the segment equivalent to human
      288-319 (as in human isoform 2), which contains human Ser306, Lys317 and Trp319, the positions that
      PMID:23212377 maps to the NAD+-binding Asp/Thr/Tyr residues of bacterial NAD kinase; the GGDG motif
      is retained. Whether this splice form is active is untested. The same donkey gene also produces
      A0A8C4M4D0, which aligns gap-free to the full human canonical sequence and retains all three positions
      (file:EQUAS/NADK2/NADK2-bioinformatics/RESULTS-rereview.md). The annotation is accepted as a statement
      about the NADK2 gene product, with the isoform caveat recorded in suggested_questions.'
    supported_by:
    - reference_id: PMID:23212377
      supporting_text: showing that C5orf33 protein has NADK activity using ATP and poly(P) as phosphoryl
        donors
