id: A0A9L0K2P4
gene_symbol: NADK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: NADK2 is the mitochondrial NAD(+) kinase (EC 2.7.1.23) of the NAD kinase family (PANTHER
  PTHR13158:SF5, NAD kinase 2, mitochondrial). It phosphorylates NAD(+) using ATP (or, in vitro, inorganic
  polyphosphate) to produce NADP(+), and is the source of the mitochondrial matrix NADP(H) pool. This pool
  supplies NADPH-dependent matrix enzymes, including 2,4-dienoyl-CoA reductase of polyunsaturated fatty
  acid oxidation and the first step of lysine degradation, and supports antioxidant defence; loss of NADK2
  causes mitochondrial NADP(H) deficiency. The protein is imported into mitochondria by an N-terminal
  targeting sequence and acts as a soluble matrix enzyme. The donkey entry A0A9L0K2P4 is one of three
  gene models of the single donkey NADK2 gene. It corresponds to human isoform 2, lacking the 32-residue
  segment equivalent to human 288-319, which contains the positions mapped to the NAD(+)-binding site
  of bacterial NAD kinases, while retaining the GGDG motif. Like the other equid models, it also begins
  96 residues upstream of the methionine that aligns to human Met1.
