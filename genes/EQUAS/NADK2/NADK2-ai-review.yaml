suggested_questions:
- question: Is the donkey NADK2 gene model (N-terminal extension, lacking the segment equivalent to human
    288-319) the predominant transcript, and is a protein lacking that segment catalytically active as
    an NAD kinase?
suggested_experiments:
- description: Clone the donkey NADK2 transcript(s) from liver cDNA to define the true start codon and
    exon structure, and assay recombinant mature protein with and without the 288-319-equivalent segment
    for NAD kinase activity.
