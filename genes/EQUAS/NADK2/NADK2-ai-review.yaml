suggested_questions:
- question: Is the donkey NADK2 splice form represented by A0A9L0K2P4 (lacking the segment equivalent
    to human 288-319, which carries the positions mapped to the NAD+-binding site) expressed as protein,
    and is it catalytically active or a non-functional or regulatory variant?
- question: Does donkey NADK2 translation start at Met97 (equivalent to human Met1), placing the mitochondrial
    targeting sequence at the N-terminus, or at the upstream start used by the Ensembl equid gene models?
suggested_experiments:
- description: Clone donkey NADK2 transcripts from liver cDNA to define the start codon and the relative
    abundance of the full-length (A0A8C4M4D0-like) and 288-319-skipping (A0A9L0K2P4-like) splice forms,
    then assay the recombinant mature proteins for NAD kinase activity with ATP.
