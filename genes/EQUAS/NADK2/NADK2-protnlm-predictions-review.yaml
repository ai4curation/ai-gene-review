  label: Equus asinus
status: COMPLETE
description: 'Assessment of 3 ProtNLM2 GO predictions for donkey NADK2 (A0A9L0K2P4), scored for this exact sequence.
  A0A9L0K2P4 is the isoform-2-like splice product of the donkey NADK2 gene: it lacks the segment equivalent to human
  288-319, which carries the TGSxAW NAD+-binding motif (W319) and the second-monomer active-site residue S306, while
  it keeps the GGDG motif, the ATP-contacting residues (human K76, S188, D161) and the extension-3/EMKA dimerization
  element (human 325-367). The full-length canonical-equivalent product of the same gene is A0A8C4M4D0. Predictions
  are judged against donkey GOA on any NADK2 product (NAD+ kinase activity, mitochondrion, mitochondrial matrix,
  NAD+ metabolic process) and the human ortholog Q4G0N4 (PMID:23212377, PMID:35868311, PMID:35733246). ATP binding
  and protein homodimerization are retained by this product and absent from donkey GOA (COR); phosphorylation, which
  here means phosphorylation of NAD+, is uncertain for this product because it lacks the NAD+-binding segment but
  keeps the ATP site and dimerization element, and its activity is untested (UNC). Non-GO ProtNLM2
  outputs, not scored: subcellular location ''Mitochondrion'' and function text ''Mitochondrial NAD(+) kinase that
  phosphorylates NAD(+) to yield NADP(+). Can use both ATP or inorganic polyphosphate as the phosphoryl donor'',
  which reproduces the human Swiss-Prot function statement.'
