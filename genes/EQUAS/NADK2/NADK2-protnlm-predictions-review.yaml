id: A0A9L0K2P4
gene_symbol: NADK2
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: 'Assessment of 3 ProtNLM2 GO predictions for donkey NADK2 (A0A9L0K2P4), judged against the
  donkey GOA record (NAD+ kinase activity, mitochondrion, mitochondrial matrix, NAD+ metabolic process),
  the human ortholog Q4G0N4 and its characterization (PMID:23212377), and a donkey-human alignment. ATP
  binding and phosphorylation are correct and absent from donkey GOA (COR); protein homodimerization is
  plausible but not established from the available text (UNC). Non-GO ProtNLM2 outputs, not scored: subcellular
  location ''Mitochondrion'' (agrees with the human experimental localization) and function text ''Mitochondrial
  NAD(+) kinase that phosphorylates NAD(+) to yield NADP(+). Can use both ATP or inorganic polyphosphate
  as the phosphoryl donor'', which closely reproduces the human Swiss-Prot function statement.'
source_documents:
