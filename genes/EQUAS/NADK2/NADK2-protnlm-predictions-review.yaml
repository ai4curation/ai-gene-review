predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0042803
    label: protein homodimerization activity
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: Not in donkey GOA. The human Swiss-Prot entry states the protein is a homodimer, but with
      a curator-inference code (ECO:0000305) from PMID:23212377, and the cached text of that paper contains
      no dimerization result; a human IDA GO annotation exists whose full-text basis could not be inspected
      here. The donkey model also lacks the segment corresponding to human 288-319, whose role in oligomerization
      is unknown. The prediction is plausible for an NAD kinase family member, but the allowed evidence
      neither validates nor refutes it for this protein.
    supported_by:
    - reference_id: file:human/NADK2/NADK2-uniprot.txt
      supporting_text: 'SUBUNIT: Homodimer. {ECO:0000305|PubMed:23212377}.'
    - reference_id: file:EQUAS/NADK2/NADK2-bioinformatics/RESULTS.md
      supporting_text: The donkey model lacks the segment corresponding to human residues 288-319
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0005524
    label: ATP binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: Human NADK2 uses ATP as the phosphoryl donor in its NAD kinase reaction (PMID:23212377),
      so binding ATP is an intrinsic part of its activity; the GGDG motif of the NAD kinase family is
      conserved in the donkey sequence and identity to human is 96.6% over the aligned region. ATP binding
      is not in donkey GOA, and NAD+ kinase activity is not a GO descendant of ATP binding, so this is
      a novel (if less informative) correct term rather than LSP.
    supported_by:
    - reference_id: PMID:23212377
      supporting_text: showing that C5orf33 protein has NADK activity using ATP and poly(P) as phosphoryl
        donors
    - reference_id: file:EQUAS/NADK2/NADK2-bioinformatics/RESULTS.md
      supporting_text: aligned pairs 410; identical 396; identity over aligned pairs 96.59%
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0016310
    label: phosphorylation
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: NADK2 phosphorylates NAD+ to NADP+, so it directly carries out a phosphorylation (phosphate
      transfer to a small molecule). Donkey GOA has NAD+ metabolic process, which is not a descendant
      of phosphorylation, so no existing BP annotation makes this term redundant; it is broad but correct
      and absent from donkey GOA. NADP+ biosynthetic process would be the informative process term.
    supported_by:
    - reference_id: file:human/NADK2/NADK2-uniprot.txt
      supporting_text: Mitochondrial NAD(+) kinase that phosphorylates NAD(+) to
    - reference_id: PMID:23212377
      supporting_text: showing that C5orf33 protein has NADK activity using ATP and poly(P) as phosphoryl
        donors
