description: Assessment of the single ProtNLM2 GO prediction for donkey CADM1 (A0A9L0IX39), a single-pass
  type I transmembrane Ig-superfamily adhesion molecule 96% identical to human CADM1 over its extracellular
  and transmembrane regions. The prediction membrane (GO:0016020) is correct but less precise than the donkey
  GOA plasma membrane annotation (LSP). ProtNLM2 emitted no function text or subcellular location for this
  accession.
