id: A0A9L0IX39
gene_symbol: CADM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: CADM1 (cell adhesion molecule 1; SynCAM1, nectin-like protein 2, TSLC1) is a single-pass type I
  transmembrane immunoglobulin-superfamily protein of the nectin-like (Necl) family with three extracellular
  Ig-like domains (one V-type, two C2-type). It mediates Ca(2+)-independent homophilic cell-cell adhesion
  and heterophilic adhesion with other nectin-like proteins. Binding of its V-type Ig domain to the receptor
  CRTAM on activated NK cells and CD8+ T cells makes CADM1-expressing cells targets of NK-cell cytotoxicity
  and promotes CD8+ T-cell cytokine responses. In neurons it acts as a synaptic adhesion molecule that drives
  synapse assembly, and it supports epithelial, mast-cell and spermatogenic cell adhesion. This entry is
  one of eight Ensembl products of the donkey CADM1 gene. It keeps the complete extracellular region, a short
  stalk and the transmembrane helix, but ends in an 11-residue alternative tail. That tail replaces the
  cytoplasmic region that binds protein 4.1 and the C-terminal PDZ-binding motif found in the canonical
  473-residue product.
