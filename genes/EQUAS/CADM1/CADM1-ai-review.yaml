    label: cell-cell adhesion mediator activity
  evidence_type: ISS
  original_reference_id: file:EQUAS/CADM1/CADM1-bioinformatics/human-CADM1-Q9BY67-uniprot.txt
  review:
    summary: CADM1 on one cell binds CADM1 (or CADM3, NECTIN3, CRTAM) on an adjacent cell through its V-type
      Ig domain, directly mediating cell-cell adhesion.
    action: NEW
    reason: This is the molecular activity underlying the accepted homophilic cell-cell adhesion process; donkey
