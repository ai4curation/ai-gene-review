suggested_questions:
- question: Is the 11-residue donkey CADM1 tail of A0A9L0IX39 (ending LFSLTSSPRIK) a genuine alternative terminal
    exon or an intron read-through in the Ensembl model? The canonical donkey product A0A9L0IJE9 and several
    other donkey products keep the EYFI PDZ-binding tail. Is the short-tail product expressed at the protein
    level?
- question: Does a CADM1 product without the protein 4.1- and PDZ-binding cytoplasmic region still localize
    to synapses and support synapse assembly, or does it act only in trans as an adhesion partner and CRTAM
    ligand?
suggested_experiments:
- description: RT-PCR or long-read RNA-seq across the CADM1 3' exons in donkey brain and lung, to test whether
    the LFSLTSSPRIK terminal sequence is spliced and expressed.
