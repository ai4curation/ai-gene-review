gene_symbol: CADM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: CADM1 (cell adhesion molecule 1; SynCAM1, nectin-like 2) is a single-pass type I transmembrane
  immunoglobulin-superfamily protein of the nectin family with three extracellular Ig-like domains. It mediates
  Ca(2+)-independent homophilic and heterophilic cell-cell adhesion, and binding of its V-type Ig domain
  to the receptor CRTAM on NK cells and CD8+ T cells promotes NK-cell cytotoxicity and T-cell retention.
  In the nervous system it acts as a synaptic adhesion molecule that promotes synapse and dendritic spine
  formation, and it supports mast-cell, spermatogenic and epithelial cell interactions. The donkey protein
  is 96% identical to human CADM1 across the extracellular and transmembrane regions but has a short divergent
  cytoplasmic tail lacking the C-terminal protein 4.1- and PDZ-binding region.
