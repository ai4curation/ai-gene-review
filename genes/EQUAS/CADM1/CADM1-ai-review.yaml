- term:
    id: GO:0051606
    label: detection of stimulus
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000589348
  review:
    summary: CADM1 is the ligand recognized by CRTAM; the detecting entity is the NK or T cell carrying CRTAM,
      not CADM1.
    action: MARK_AS_OVER_ANNOTATED
    reason: Detection of stimulus describes conversion of a stimulus into a signal by the receiving cell. CADM1
      on target cells is what is detected, and its role is already captured precisely by susceptibility to
      natural killer cell mediated cytotoxicity and signaling receptor binding. The broad term adds no information
      and misplaces the agent.
    supported_by:
    - reference_id: file:EQUAS/CADM1/CADM1-bioinformatics/human-CADM1-Q9BY67-uniprot.txt
      supporting_text: Interaction with CRTAM promotes natural killer (NK) cell cytotoxicity
- term:
