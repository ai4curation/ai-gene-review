- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0006513
    label: protein monoubiquitination
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: Characterised SCF(FBXL20) substrates (RIM1 in mouse, VPS34 and PR55alpha in human) are
      ubiquitinated and degraded by the proteasome, which implies polyubiquitination. The only mention
      of monoubiquitination is the mouse SCRAPPER study stating that RIM1 monoubiquitination cannot be
      excluded, which was not tested. The term is neither validated nor refuted, and it is not in donkey
      GOA or the gene review.
    supported_by:
    - reference_id: PMID:17803915
      supporting_text: At present we cannot exclude the possibility that monoubiquitination of RIM1 by
        SCRAPPER may also regulate RIM1 before RIM1 is polyubiquitinated and degraded by the proteasome.
    - reference_id: PMID:34731788
      supporting_text: an F-box protein that serves as a substrate recognition component of the SCF (Skp1_Cul1_F-box)
        E3 ubiquitin ligase complexes that promote proteasomal degradation
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0010506
    label: regulation of autophagy
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: In human cells FBXL20 knockdown induces autophagy flux and raises VPS34 and PtdIns3P, and
      DNA damage induces p53-dependent FBXL20 expression that drives SCF-mediated VPS34 degradation and
      inhibits autophagy (PMID:25593308). FBXL20 thus acts as a negative regulator of autophagy; negative
      regulation of autophagy would be the more precise term. Donkey GOA, the donkey gene review and
      the human and mouse orthologs carry no autophagy term, so the prediction is novel. Transfer rests
      on the shared FBXL20 subfamily and the intact F-box and LRR domains of the donkey product.
    supported_by:
    - reference_id: PMID:25593308
      supporting_text: FBXL20 was identified in a genome-wide siRNA screen as a gene when its expression
        was knocked down, leading to the induction of autophagy flux and increases in the levels of PtdIns3P
    - reference_id: PMID:25593308
      supporting_text: Taken together, these results suggest that FBXL20–SKP1–CUL1 regulates the levels
        of Vps34 and autophagy through a proteasomal pathway.
    - reference_id: PMID:33234069
      supporting_text: Removal of Vps34 by Fbxl20-mediated ubiquitination leads to inhibition of autophagy.
