gene_symbol: FBXL20
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 3 ProtNLM2 GO predictions for donkey FBXL20 (A0A9L0IQA3), an alternative-first-exon
  product that keeps the canonical F-box, LRR domain and CAAX tail. Donkey GOA has cytoplasm, SCF ubiquitin
  ligase complex and SCF-dependent proteasomal protein catabolism, and the gene review adds ubiquitin-like
  ligase-substrate adaptor activity. Protein phosphatase binding (PR55alpha/PPP2R2A, a PP2A regulatory
  subunit) and regulation of autophagy (FBXL20-mediated VPS34 degradation) are supported by experimental
  work on the human ortholog and are absent from donkey GOA (COR). Protein monoubiquitination is not
  supported, because the characterised FBXL20 substrates are polyubiquitinated and degraded, and monoubiquitination
  is only raised as an untested possibility (UNC). No non-GO ProtNLM2 outputs (function text or location)
  were emitted for this accession.
