id: A0A9L0IQA3
gene_symbol: FBXL20
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 3 ProtNLM2 GO predictions for donkey FBXL20 (A0A9L0IQA3) against donkey GOA
  (cytoplasm, SCF ubiquitin ligase complex, SCF-dependent proteasomal catabolism), the human ortholog
  record and FBXL20 literature. Protein phosphatase binding (PR55alpha/PP2A) and regulation of autophagy
  (VPS34 degradation) are supported and absent from donkey GOA (COR); protein monoubiquitination is not
  supported by available evidence, which describes degradative ubiquitination (UNC). No non-GO ProtNLM2
  outputs (function text or location) were emitted for this accession.
source_documents:
- projects/PROTNLM_EVALUATION/donkey40/donkey40-predictions.tsv
- genes/EQUAS/FBXL20/FBXL20-goa.tsv
