predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0019903
    label: protein phosphatase binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: Human FBXL20 binds PR55alpha (PPP2R2A), a regulatory subunit of the PP2A serine/threonine
      phosphatase, by reciprocal co-immunoprecipitation and in vitro, and promotes its degradation (PMID:34731788).
      The donkey protein is 97% identical over the full length. Binding is a substrate-recognition interaction
      rather than a distinct function, so the term is correct but uninformative compared with the adaptor
      activity. It is absent from donkey GOA.
    supported_by:
    - reference_id: PMID:34731788
      supporting_text: FBXL20 interacts with PR55α in vitro and in vivo
    - reference_id: file:EQUAS/FBXL20/FBXL20-bioinformatics/RESULTS.md
      supporting_text: aligned pairs 436; identical 424; identity over aligned pairs 97.25%
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0006513
    label: protein monoubiquitination
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: The available FBXL20 evidence describes SCF(FBXL20)-dependent ubiquitination leading to proteasomal
      degradation of VPS34 and PR55alpha, which is consistent with polyubiquitination; no cited source
      reports FBXL20-dependent monoubiquitination. Absence of evidence does not refute the term, so it
      is neither validated nor refuted. Not in donkey GOA.
    supported_by:
    - reference_id: PMID:34731788
      supporting_text: an F-box protein that serves as a substrate recognition component of the SCF (Skp1_Cul1_F-box)
        E3 ubiquitin ligase complexes that promote proteasomal degradation
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0010506
    label: regulation of autophagy
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: FBXL20-mediated ubiquitination and degradation of VPS34 inhibits autophagy downstream of
      DNA damage (summarized in PMID:33234069 from the primary human study), so FBXL20 regulates autophagy;
      negative regulation would be the more precise term. Donkey GOA has no autophagy annotation. Transfer
      rests on 97% identity with conserved F-box and LRR domains.
    supported_by:
    - reference_id: PMID:33234069
      supporting_text: Removal of Vps34 by Fbxl20-mediated ubiquitination leads to inhibition of autophagy.
    - reference_id: file:EQUAS/FBXL20/FBXL20-bioinformatics/RESULTS.md
      supporting_text: aligned pairs 436; identical 424; identity over aligned pairs 97.25%
