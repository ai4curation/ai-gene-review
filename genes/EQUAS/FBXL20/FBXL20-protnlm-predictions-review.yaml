  predicted_term:
    id: GO:0019903
    label: protein phosphatase binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: Human FBXL20 binds PR55alpha (PPP2R2A), a regulatory subunit of the PP2A serine/threonine
      phosphatase, in vitro and in cells, and promotes its ubiquitination and degradation (PMID:34731788).
      The donkey product shares the canonical 422-residue F-box/LRR/CAAX body with human FBXL20 (same
      PANTHER subfamily PTHR13318:SF47), so the substrate-binding LRR domain is intact. The binding is
      a substrate-recognition interaction, so the term is correct but less informative than the adaptor
      activity the gene review records. Neither donkey GOA nor the human and mouse orthologs carry a
      phosphatase-binding term (human has only generic protein binding by IPI), so the prediction is novel.
    supported_by:
    - reference_id: PMID:34731788
