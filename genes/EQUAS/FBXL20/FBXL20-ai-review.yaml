suggested_questions:
- question: Which FBXL20 first exons are used in donkey tissues, and does the alternative N-terminal
    segment of A0A9L0IQA3 (also found in horse F6YIL4) change localization, stability or substrate choice
    relative to the canonical MRRDVNGVTKSRFE start?
- question: Does donkey FBXL20 regulate VPS34 levels and autophagy after DNA damage, and RIM1 turnover
    at presynaptic terminals, as its human and mouse orthologs do?
suggested_experiments:
- description: RT-PCR or long-read transcript sequencing of donkey brain and other tissues to determine
    which FBXL20 first exons are expressed, followed by comparison of the encoded N-terminal variants
    for SKP1 binding and membrane association.
