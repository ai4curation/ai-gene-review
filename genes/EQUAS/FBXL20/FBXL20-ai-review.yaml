description: FBXL20 (F-box/LRR-repeat protein 20; SCRAPPER in mouse) is a substrate-recognition subunit
  of SCF (SKP1-CUL1-RBX1) E3 ubiquitin ligase complexes. Its F-box binds SKP1 and its leucine-rich repeat
  domain selects substrates for polyubiquitination and proteasomal degradation. Characterized mammalian
  substrates include VPS34/PIK3C3, whose FBXL20-dependent degradation after DNA damage inhibits autophagy,
  and the PP2A regulatory subunit PR55alpha/PPP2R2A; in neurons the mouse ortholog acts at the presynapse
  on active-zone proteins. A C-terminal CAAX-type prenylation motif links the protein to membranes. The
  donkey protein A0A9L0IQA3 is 97% identical to human FBXL20 over its full length, with a short N-terminal
  insertion and an identical C-terminus.
