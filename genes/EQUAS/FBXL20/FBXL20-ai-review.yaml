id: A0A9L0IQA3
gene_symbol: FBXL20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: FBXL20 (F-box/LRR-repeat protein 20; SCRAPPER in mouse) is a substrate-recognition subunit
  of SCF (SKP1-CUL1-RBX1) E3 ubiquitin ligase complexes. Its N-terminal F-box binds SKP1, linking it
  to the cullin-RING catalytic core, and its C-terminal leucine-rich repeat domain binds substrates,
  which are polyubiquitinated and degraded by the proteasome. A C-terminal CAAX-type prenylation motif
  targets the protein to membranes. In mouse neurons SCRAPPER is enriched at the presynaptic membrane
  and is the main ubiquitin ligase for the active-zone protein RIM1, tuning synaptic vesicle release;
  in human cells FBXL20 targets the class III PI3K VPS34/PIK3C3 for degradation after DNA damage,
  restraining autophagy, and promotes ubiquitination and degradation of the PP2A regulatory subunit
  PR55alpha/PPP2R2A. The donkey gene product A0A9L0IQA3 (448 aa) is an alternative-first-exon form
  of FBXL20 that differs from the canonical 436-aa mammalian protein only in its first 26 residues
  and retains the complete F-box, LRR domain and CAAX motif.
