gene_symbol: TNFRSF1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: TNFRSF1A (TNF receptor 1, p55/p60, CD120a) is a type I transmembrane receptor of the TNF
  receptor superfamily. In mammals its extracellular region of four cysteine-rich domains binds trimeric
  TNF and lymphotoxin-alpha, and its cytoplasmic death domain recruits TRADD, which scaffolds membrane-proximal
  complexes activating NF-kappaB and MAPK pathways or, when these fail, caspase-8-dependent apoptosis
  and necroptosis; it is a central mediator of inflammatory signalling. This donkey entry (410 aa) is
  the product of an alternative Ensembl transcript of the TNFRSF1A gene that skips coding exon 3 (43
  codons, in frame); it is otherwise identical to the 453-aa canonical donkey product (A0A8C4MD74). The
  skipped exon encodes the second half of cysteine-rich domain 1 and most of cysteine-rich domain 2, so
  this variant retains the signal peptide, the membrane-proximal cysteine-rich region, the transmembrane
  segment and the death domain, but whether it binds TNF, and whether the transcript is expressed, is
  unknown.
