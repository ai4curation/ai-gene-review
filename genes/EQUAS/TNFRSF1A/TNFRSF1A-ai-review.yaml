    summary: TNF receptor activity is the defining function of TNFR1, but this sequence lacks part of
      the ligand-binding ectodomain.
    action: UNDECIDED
    reason: This donkey sequence model lacks the region aligned to human residues 64-106 (second half
      of TNFR-Cys 1 and most of TNFR-Cys 2, including the 62-81 and 84-99 disulfides), and UniProt flags
