- description: Membrane-anchored TNFR1-family receptor whose conserved cytoplasmic death domain recruits
    TRADD-based signalling complexes; in the canonical receptor this signalling is triggered by TNF binding
    to the cysteine-rich ectodomain, which is internally truncated in this sequence model.
