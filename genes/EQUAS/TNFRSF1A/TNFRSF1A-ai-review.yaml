suggested_questions:
- question: Is the exon-3-skipped donkey TNFRSF1A transcript encoding A0A9L0JKX4 (lacking the segment equivalent
    to human TNFR1 residues 64-106) genuinely expressed, and can its product bind TNF or act as a dominant-negative
    receptor?
suggested_experiments:
- description: RT-PCR across the TNFRSF1A exons encoding cysteine-rich domains 1-2 in donkey tissues,
    and TNF binding assays on the expressed 410-aa ectodomain compared with the full-length receptor.
