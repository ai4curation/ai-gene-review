taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: TNFRSF1A (TNF receptor 1, p55/p60, CD120a) is a type I transmembrane receptor of the TNF
  receptor superfamily. In mammals its extracellular region of four cysteine-rich domains binds trimeric
  TNF and lymphotoxin-alpha, and its cytoplasmic death domain recruits TRADD, which scaffolds membrane-proximal
  complexes activating NF-kappaB and MAPK pathways or, when these fail, caspase-8-dependent apoptosis
  and necroptosis; it is a central mediator of inflammatory signalling. This donkey entry (410 aa, 74%
  identical to human TNFR1) retains the signal peptide, membrane-proximal cysteine-rich region, transmembrane
  segment and death domain, but lacks an internal 43-residue segment corresponding to the second half
  of cysteine-rich domain 1 and most of cysteine-rich domain 2 of the human receptor, so its ability to
  bind TNF is uncertain; a longer donkey TNFRSF1A entry also exists.
