    reason: This donkey sequence model lacks the region aligned to human residues 64-106 (second half
      of TNFR-Cys 1 and most of TNFR-Cys 2, including the 62-81 and 84-99 disulfides), and UniProt flags
      missing conserved TNFR-Cys residues. Human TNFR1 binds TNF through its elongated four-domain ectodomain,
      so whether this truncated ectodomain still binds TNF is unknown. The term was placed by PAINT
      at the Euteleostomi TNFRSF1A node (PTN002930098) from experimental data on human or mouse TNFR1, and is
      correct for the canonical donkey product A0A8C4MD74; this entry differs from it only by skipping
      coding exon 3, so it inherits the term at the gene level but the ligand-binding claim cannot be
