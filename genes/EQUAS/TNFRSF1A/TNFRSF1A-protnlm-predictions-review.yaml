predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0016020
    label: membrane
  predicted_term_type: GO_CC
  review:
    assessment: LSP
    confidence_score: 2
    summary: The donkey model keeps the signal peptide and a single transmembrane segment
      (172-194), and human TNFR1 is a single-pass type I cell-membrane and Golgi-membrane protein,
      so membrane is correct. Donkey GOA does not contain the bare membrane term but does contain
      membrane raft (TreeGrafter), a GO descendant of membrane, so the prediction is correct but
      less precise than an existing annotation.
    supported_by:
    - reference_id: file:EQUAS/TNFRSF1A/TNFRSF1A-bioinformatics/human_P19438-uniprot.txt
      supporting_text: |-
        Cell membrane {ECO:0000269|PubMed:22801493};
        CC       Single-pass type I membrane protein {ECO:0000269|PubMed:22801493}.
    - reference_id: file:EQUAS/TNFRSF1A/TNFRSF1A-uniprot.txt
      supporting_text: |-
        FT   TRANSMEM        172..194
        FT                   /note="Helical"
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0007165
    label: signal transduction
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: The cytoplasmic death domain (311-396) is retained and aligns without gaps to the human
      TNFR1 death domain, which nucleates TRADD recruitment and downstream NF-kappaB and apoptotic
      signalling. Signal transduction is therefore correct for this protein even though its
      ligand-binding ectodomain is internally truncated. The exact term is already in donkey GOA
      (InterPro2GO from the death domain); the more specific TNF-mediated signaling pathway row
      is present too but is uncertain for this model, so CNN rather than LSP is used.
    supported_by:
    - reference_id: file:EQUAS/TNFRSF1A/TNFRSF1A-bioinformatics/human_P19438-uniprot.txt
      supporting_text: |-
        The aggregated death domains provide a novel
        CC       molecular interface that interacts specifically with the death domain
        CC       of TRADD.
    - reference_id: file:EQUAS/TNFRSF1A/TNFRSF1A-bioinformatics/RESULTS.md
      supporting_text: '- human residues 64-106.'
