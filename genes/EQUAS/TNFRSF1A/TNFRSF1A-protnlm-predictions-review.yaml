id: A0A9L0JKX4
gene_symbol: TNFRSF1A
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 2 ProtNLM2 GO predictions for donkey TNFRSF1A (A0A9L0JKX4), the 410-aa
  product of an exon-3-skipping alternative Ensembl transcript of the TNFRSF1A gene; it is otherwise
  identical to the 453-aa canonical donkey product A0A8C4MD74. The skipped exon encodes the second half
  of cysteine-rich domain 1 and most of domain 2 (human residues 64-106), while the signal peptide,
  transmembrane segment and death domain are retained. Membrane is correct but less precise than the
  plasma membrane, Golgi membrane and membrane raft annotations the gene already carries (LSP). Signal
  transduction is correct for the retained death-domain module and is already in GOA on this product
  (CNN). Both predictions are generic and avoid the ligand-binding claims that are uncertain for this
  truncated ectodomain. A PubMed search for equine or donkey TNFR1 found no study of this transcript
  variant. ProtNLM2 also emitted non-GO subcellular locations "Cell membrane", "Membrane" and "Golgi
  apparatus membrane" for this accession, which are not scored here.
