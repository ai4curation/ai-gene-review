id: A0A9L0JKX4
gene_symbol: TNFRSF1A
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 2 ProtNLM2 GO predictions for donkey TNFRSF1A (A0A9L0JKX4), a 410-aa
  TNFR1 model that is 74% identical to human TNFR1 but lacks an internal segment aligned to human
  residues 64-106 (second half of cysteine-rich domain 1 and most of domain 2). The membrane anchor
  and death domain are retained. Membrane is correct but less precise than the membrane raft
  annotation already in GOA (LSP). Signal transduction is correct for the retained death-domain
  module and is already in GOA (CNN). Both predictions are generic and avoid the ligand-binding
  claims that are uncertain for this truncated ectodomain. ProtNLM2 also emitted non-GO
  subcellular locations "Cell membrane", "Membrane" and "Golgi apparatus membrane" for this
  accession, which are not scored here.
