predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0007264
    label: small GTPase-mediated signal transduction
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: Purified human RasGEF1A has guanine nucleotide exchange activity on small GTPases, specifically on Rap2
      in one study and on H-, K- and N-Ras in another, so it acts at the activating step of small GTPase-mediated signalling
      whichever substrate is physiological. The donkey protein is in the same PANTHER subfamily (PTHR23113:SF172) as human
      Q8N9B8 and keeps the complete REM and catalytic Ras-GEF domains at 96% identity. The donkey gene already carries this
      exact term (InterPro2GO), which the gene review accepts as the core process term, so the prediction is correct but
      not novel. It is not less specific than a supported annotation, because the more specific Ras protein signal transduction
      is disputed for this gene and Rap2 signalling falls under a sibling term.
    supported_by:
    - reference_id: PMID:19645719
      supporting_text: Using purified RasGEF1A and RasGEF1B proteins, as well as Ras family proteins, we established that
        RasGEF1A and RasGEF1B function as very specific exchange factors for Rap2
    - reference_id: PMID:17121879
      supporting_text: RASGEF1A protein has a guanine nucleotide exchange activity to K-RAS, H-RAS, and N-RAS proteins in
        vitro
    - reference_id: file:EQUAS/RASGEF1A/RASGEF1A-bioinformatics/RASGEF1A-human-Q8N9B8-uniprot.txt
      supporting_text: Guanine nucleotide exchange factor (GEF) with specificity for
    - reference_id: file:EQUAS/RASGEF1A/RASGEF1A-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A9L0J8J4 (516 residues) aligns to human Q8N9B8 (481 residues) with
        96.25% identity across 480 paired residues
