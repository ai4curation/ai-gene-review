  label: Equus asinus
status: COMPLETE
description: Assessment of the single ProtNLM2 GO prediction for donkey RASGEF1A (A0A9L0J8J4), judged against
  the donkey GOA record (guanyl-nucleotide exchange factor activity, plasma membrane, small GTPase-mediated signal
  transduction, Ras protein signal transduction, cell migration, positive regulation of Ras protein signal transduction),
  the human ortholog Q8N9B8 and a donkey-human alignment (96% identity, both GEF domains intact). The prediction,
  small GTPase-mediated signal transduction, is correct and already in donkey GOA (CNN). Non-GO ProtNLM2 output,
  not scored - subcellular location 'Nucleus', which has no support in the human or donkey records (human has
  cytosol by Reactome TAS and plasma membrane by IBA only).
