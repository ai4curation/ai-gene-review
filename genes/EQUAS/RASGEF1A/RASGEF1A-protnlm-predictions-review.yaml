    summary: Human RASGEF1A is a guanine nucleotide exchange factor for Rap2A and H-, K- and N-Ras in vitro,
      so it acts at the activation step of small GTPase signaling; the donkey protein retains the complete catalytic
      Ras-GEF domain at 96% identity to human. The exact term is already in donkey GOA (InterPro2GO), alongside
      the more specific Ras protein signal transduction (TreeGrafter). Because the preferred substrate Rap2 falls
      under a sibling of Ras protein signal transduction, the broader term is not merely redundant, so CNN rather
      than LSP.
