    summary: InterPro2GO mapping from the Ras-GEF catalytic domain. A GEF performs the activating step of small GTPase-mediated
      signalling.
    action: ACCEPT
    reason: Correct and, for now, as precise as the evidence allows. Purified human RasGEF1A acts specifically on Rap2 (which
      would be Rap protein signal transduction, GO:0032486), while an earlier study reported exchange on H-, K- and N-Ras
      (Ras protein signal transduction, GO:0007265). In GO these two terms are siblings under this term, and the physiological
      substrate has not been established in cells, so this parent term is the appropriate process term and is used in core_functions.
    supported_by:
    - reference_id: PMID:19645719
      supporting_text: Using purified RasGEF1A and RasGEF1B proteins, as well as Ras family proteins, we established that
        RasGEF1A and RasGEF1B function as very specific exchange factors for Rap2
