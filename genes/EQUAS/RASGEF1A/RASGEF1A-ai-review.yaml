  review:
    summary: Guanyl-nucleotide exchange factor activity from the combined IEA pipeline (human ortholog, Ras-GEF domain InterPro
      entries, PANTHER node). The donkey protein is in PANTHER subfamily PTHR23113:SF172 with human RASGEF1A, whose exchange
      activity has been shown with purified protein.
    action: ACCEPT
    reason: Core function. The donkey protein sits in the same PANTHER subfamily (SF172, RAS-GEF DOMAIN-CONTAINING FAMILY
      MEMBER 1A) as human Q8N9B8, shares 96% identity with it and has complete REM and CDC25 domains. GEF activity is also
      the eukaryote-wide PAINT IBD at PTN000560991, whose seeds include Q8N9B8. Both human papers demonstrate exchange activity,
      although they disagree on the substrate, so the generic GEF term is the right level.
    supported_by:
