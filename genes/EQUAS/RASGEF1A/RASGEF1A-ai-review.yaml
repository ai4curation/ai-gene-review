gene_symbol: RASGEF1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: RASGEF1A (RasGEF domain family member 1A) is a cytoplasmic guanine nucleotide exchange factor of the CDC25-homology
  family, with an N-terminal Ras exchanger motif (REM, RasGEF_N) and a C-terminal catalytic Ras-GEF (CDC25) domain. It activates
  small GTPases by catalysing GDP release and GTP loading. Biochemical assays with purified human RasGEF1A identified it as
  a highly specific exchange factor for Rap2, with no activity on Rap1 or Ras-subfamily GTPases, whereas an earlier study
  reported in vitro exchange on H-, K- and N-Ras and increased Ras activity and cell motility on overexpression; the physiological
  substrate is therefore not settled. The human gene is expressed in brain and spinal cord. Its subcellular site of action
  has not been determined experimentally.
