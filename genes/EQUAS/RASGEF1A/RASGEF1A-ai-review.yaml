  review:
    summary: Ensembl orthology transfer from the human IDA annotation (Ura et al. 2006), based on increased Transwell and
      wound-healing motility of COS7 cells overexpressing RASGEF1A.
    action: KEEP_AS_NON_CORE
    reason: Overexpression-driven motility in a heterologous cell line is a downstream cellular outcome of GTPase activation,
      not evidence of a dedicated role in cell migration. The orthology relationship (same PANTHER subfamily) is sound and
      the curator read the full paper, so the annotation is kept as non-core.
