- term:
    id: GO:0007265
    label: Ras protein signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001500407
  review:
    summary: TreeGrafter transfer of Ras protein signal transduction from the eukaryote-level PAINT node PTN000560991. The
      seeds for this term at that node are SOS-type and yeast/amoeba GEFs; Q8N9B8 is a seed for GEF activity at that node
      but not for this process term.
    action: KEEP_AS_NON_CORE
    reason: Ras-subfamily specificity is disputed for RASGEF1A. Ura et al. 2006 reported exchange on H-, K- and N-Ras and
      increased Ras activity on overexpression, but Yaman et al. 2009 (purified proteins, Wittinghofer laboratory) found RasGEF1A
      to be Rap2-specific and explicitly inactive on Ras-subfamily members. The deep PAINT node is a reasonable family-level
      default, but subfamily-specific data point away from classical Ras. Retained as non-core; the core process is recorded
      at the parent small GTPase-mediated signal transduction.
    supported_by:
    - reference_id: PMID:17121879
      supporting_text: exogenous RASGEF1A expression increased the activity of Ras
    - reference_id: PMID:19645719
      supporting_text: They do not act on Rap1 or other members of the Ras subfamily.
