gene_symbol: RASGEF1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: RASGEF1A (RasGEF domain family member 1A) is a guanine nucleotide exchange factor of the CDC25-domain
  family that activates small GTPases of the Ras subfamily by promoting GDP release and GTP loading. It contains
  an N-terminal Ras exchanger motif (REM) and a C-terminal catalytic Ras-GEF domain. In vitro the human ortholog
  catalyses nucleotide exchange preferentially on Rap2 and also on H-, K- and N-Ras, and it promotes cell migration;
  it is expressed in brain and spinal cord. The donkey protein A0A9L0J8J4 is the full-length ortholog (96% identity
  to human) with both GEF domains intact and a short N-terminal extension in this gene model.
