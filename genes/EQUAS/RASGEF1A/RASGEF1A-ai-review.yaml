suggested_questions:
- question: Is RASGEF1A a Rap2-specific GEF in cells, as purified-protein assays indicate, or does it also activate H-, K-
    and N-Ras as reported from cholangiocarcinoma work?
- question: Where in the cell does RASGEF1A act, given that it lacks any annotated membrane anchor and the plasma membrane
    term is inferred only from distant family members?
suggested_experiments:
- description: Endogenous tagging of RASGEF1A in neural cells to determine subcellular localization, combined with GTP-loading
    pull-down assays for Rap2 and H/K/N-Ras after RASGEF1A depletion, and side-by-side in vitro exchange assays with purified
    RASGEF1A on Rap2 versus K-Ras.
