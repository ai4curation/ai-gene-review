id: A0A9L0IJ72
gene_symbol: NDEL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: NDEL1 (nudE neurodevelopment protein 1-like 1) is a cytoplasmic coiled-coil protein of the NudE family.
  Its N-terminal coiled coil homodimerizes and binds the LIS1 (PAFAH1B1) dimer, and its C-terminal region binds
  the cytoplasmic dynein-1 intermediate chain, DISC1 and CENP-F. By tethering LIS1 to dynein, NDEL1 regulates the
  minus-end-directed motor and is required for dynein-dependent processes including nucleus-centrosome coupling
  and radial migration of newborn cortical neurons, minus-end transport of secretory vesicles, lysosomes and late
  endosomes, Golgi integrity, and kinetochore function in mitosis. At the mother centriole it helps anchor microtubules
  and targets katanin and pericentriolar proteins; it also localizes to kinetochores, the mitotic spindle and axons,
  and promotes neurofilament assembly. The donkey protein matches human NDEL1 at 97% identity over the entire human
  sequence and carries an additional C-terminal segment of about 140 residues of unknown significance.
