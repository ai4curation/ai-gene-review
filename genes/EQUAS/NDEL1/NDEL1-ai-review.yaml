gene_symbol: NDEL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: 'NDEL1 (nudE neurodevelopment protein 1-like 1) is a cytoplasmic coiled-coil protein of the NudE family. Its
  N-terminal coiled coil forms parallel homodimers and binds the LIS1 (PAFAH1B1) dimer, and its C-terminal region binds the
  cytoplasmic dynein-1 intermediate chain, DISC1, katanin and CENP-F. By recruiting LIS1 to dynein and modulating dynein-dynactin-adaptor
  assembly, NDEL1 regulates the minus-end-directed motor and is needed for dynein-dependent processes: nuclear translocation
  and nucleus-centrosome coupling in radially migrating cortical neurons, minus-end transport of lysosomes, late endosomes
  and secretory vesicles, Golgi integrity, and kinetochore function in mitosis. At the mother centriole it tethers dynein/dynactin
  and helps anchor microtubules; it is also found at kinetochores, the mitotic spindle and axons, where it promotes neurofilament
  assembly. Its activity is regulated by CDK5/CDK1 phosphorylation and palmitoylation. This donkey gene model matches human
  NDEL1 isoform 1 through residue 338 and ends in a 143-residue C-terminal tail of unknown significance in place of the last
  seven human residues.'
