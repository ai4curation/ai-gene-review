  review:
    summary: NDEL1, as a LIS1/dynein regulator, is required for dynein-driven nuclear translocation in migrating neurons.
    action: NEW
    reason: 'Participation test: dynein does the pulling and NDEL1 contributes the regulatory activity (LIS1 recruitment to
      dynein) that the step depends on, the same role for which LIS1 carries nuclear migration terms. Complete loss of Ndel1
      abolishes nuclear movement in mouse cortical slices. The human NDEL1 review proposes the same term; donkey NDEL1 is
