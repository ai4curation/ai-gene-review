suggested_questions:
- question: Is the donkey NDEL1 C-terminal tail (donkey residues 339-481, replacing human GMLPLSV 339-345 and absent from
    all three human isoforms) expressed, or is it a gene-model artefact? If expressed, does it alter the disordered C-terminal
    region that controls dynein and LIS1 binding?
suggested_experiments:
- description: RT-PCR and long-read sequencing of donkey NDEL1 transcripts to determine whether the C-terminal extension is
    a real exon or a gene-model artefact, followed by LIS1/dynein pull-downs comparing the extended and canonical forms.
