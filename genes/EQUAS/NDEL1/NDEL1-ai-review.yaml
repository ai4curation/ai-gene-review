    action: KEEP_AS_NON_CORE
    reason: The PAINT node places this NudE-family mitotic function at the family root; it is plausible for NDEL1, which localizes
      to the spindle and is required for mitosis in some cell types, but NDE1 is the paralog that carries most of this function
      in neural progenitors. Kept as non-core, matching the human NDEL1 review. Donkey NDEL1 is in PANTHER subfamily PTHR10921:SF0
