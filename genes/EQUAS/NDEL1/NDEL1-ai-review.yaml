suggested_questions:
- question: Is the donkey NDEL1 C-terminal extension (donkey residues 339-474, absent from all three human isoforms)
    expressed, and does it alter the CDK5/CDK1-regulated C-terminal region that controls dynein and katanin binding?
suggested_experiments:
- description: RT-PCR and long-read sequencing of donkey NDEL1 transcripts to determine whether the C-terminal extension
