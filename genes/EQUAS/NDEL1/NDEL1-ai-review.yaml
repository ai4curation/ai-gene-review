- term:
    id: GO:0034454
    label: microtubule anchoring at centrosome
  evidence_type: ISS
  original_reference_id: PMID:16291865
  qualifier: involved_in
  review:
    summary: NDEL1 tethers dynein/dynactin at the mother centriole and is needed for centrosomal microtubule anchoring.
    action: NEW
    reason: Silencing NDEL1 in human cells represses centrosomal microtubule anchoring, and NDEL1 tethers dynactin and dynein
      to the mother centriole; it therefore contributes adaptor activity at the anchoring site rather than being merely required.
      The human review proposes the same term; the centrosome-targeting region (human 256-291) is identical in this donkey
      model.
    supported_by:
    - reference_id: PMID:16291865
      supporting_text: Silencing Nudel also represses centrosomal MT nucleation and anchoring.
    - reference_id: PMID:16291865
      supporting_text: Moreover, Nudel seems to tether dynactin and dynein to the mother centriole for MT anchoring.
    - reference_id: file:human/NDEL1/NDEL1-uniprot.txt
      supporting_text: Required for organization of the cellular microtubule array and microtubule anchoring at the centrosome.
    - reference_id: file:EQUAS/NDEL1/NDEL1-bioinformatics/RESULTS-rereview.md
      supporting_text: "It is collinear with human isoform 1 through\n  residue 338"
- term:
    id: GO:0060090
    label: molecular adaptor activity
  evidence_type: ISS
  original_reference_id: PMID:16291865
  qualifier: enables
  review:
    summary: NDEL1 links dynein/dynactin and pericentriolar proteins to the mother centriole.
    action: NEW
    reason: 'NDEL1 depletion in human cells displaces dynactin, LIS1, PCM-1, pericentrin and gamma-tubulin from the centrosome,
      and NDEL1 appears to tether dynactin and dynein to the mother centriole for microtubule anchoring: a bridging rather
      than catalytic role, best expressed as molecular adaptor activity. This matches the second core function of the human
      NDEL1 review. The evidence is from human cells; the donkey model is in the same PANTHER subfamily (PTHR10921:SF0) and
      is identical in the centrosome-targeting region. The term is kept to the centrosomal role; the dynein-regulatory activity
      is captured separately by cytoskeletal motor regulator activity.'
    supported_by:
    - reference_id: PMID:16291865
      supporting_text: Moreover, Nudel seems to tether dynactin and dynein to the mother centriole for MT anchoring.
    - reference_id: PMID:16291865
      supporting_text: Silencing Nudel in HeLa cells markedly decreases centrosomal targeting of all the aforementioned proteins.
    - reference_id: PMID:16291865
      supporting_text: Silencing Nudel also represses centrosomal MT nucleation and anchoring.
