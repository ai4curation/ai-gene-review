id: A0A9L0IJ72
gene_symbol: NDEL1
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 3 ProtNLM2 GO predictions for donkey NDEL1 (A0A9L0IJ72), using the human Swiss-Prot
  record and existing human NDEL1 review, the PTHR10921 family review, and a donkey-human comparison (97.1%
  identity over the entire human sequence, with a donkey-specific C-terminal extension). Microtubule organizing
  center is correct and already in the donkey GOA record (CNN); cytoplasm is correct but less precise than
  the centrosome, spindle and axon annotations already present (LSP); cell differentiation is a generic process
  that the evidence neither supports nor refutes for NDEL1 (UNC). ProtNLM2 emitted no non-GO function-text
  or subcellular-location output for this accession in the frozen snapshot.
