predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0005815
    label: microtubule organizing center
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: NDEL1 binds the interphase centrosome, the principal microtubule organizing center of animal cells,
      where it anchors microtubules. The exact term is present in the donkey GOA record (Ensembl projection
      from mouse), alongside the more specific centrosome annotation. The donkey protein is 97.1% identical
      to human NDEL1 across the full human sequence. Training-set membership is unknown.
    supported_by:
    - reference_id: file:human/NDEL1/NDEL1-uniprot.txt
      supporting_text: 'FUNCTION: Required for organization of the cellular microtubule array'
    - reference_id: file:EQUAS/NDEL1/NDEL1-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A9L0IJ72 (481 residues) aligns to human Q9GZM8 (345 residues)
        with 97.1% identity across 345 paired residues.
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0005737
    label: cytoplasm
  predicted_term_type: GO_CC
  review:
    assessment: LSP
    confidence_score: 2
    summary: NDEL1 is a soluble cytoplasmic and cytoskeletal protein, so cytoplasm is correct. The donkey
      GOA record already has more specific cytoplasmic locations (centrosome, microtubule organizing center,
      spindle, axon), each part of the cytoplasm, so the prediction is less precise than existing annotations.
    supported_by:
    - reference_id: file:human/NDEL1/NDEL1-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton. Cytoplasm, cytoskeleton,'
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0030154
    label: cell differentiation
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: NDEL1 is required for radial migration of newborn cortical neurons and, with DISC1, for regulation
      of neurite outgrowth; neither is an act of cell differentiation as such, and no human, rodent or family
      review evidence assigns NDEL1 a role in differentiation. The term is absent from the donkey GOA record.
      As a generic process loosely related to the neuronal roles, the prediction can be neither supported
      nor refuted from the available evidence.
    supported_by:
    - reference_id: file:human/NDEL1/NDEL1-uniprot.txt
      supporting_text: "Also required during brain\nCC       development for the migration of newly formed neurons from the\nCC       ventricular/subventricular zone toward the cortical plate."
