gene_symbol: GPAT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: GPAT2 is a mitochondrial glycerol-3-phosphate acyltransferase of the GPAT/DHAPAT family
  (PANTHER subfamily GLYCEROL-3-PHOSPHATE ACYLTRANSFERASE 2, MITOCHONDRIAL), distinct from the GPAT1 (GPAM)
  subfamily. Its experimentally characterised mouse ortholog transfers a fatty acyl group from acyl-CoA,
  preferring arachidonoyl-CoA, to sn-glycerol 3-phosphate to form lysophosphatidic acid, the first step
  of de novo synthesis of phosphatidic acid, glycerophospholipids and triacylglycerol; membranes from cells
  overexpressing it also show increased lysophosphatidic acid acyltransferase activity. The mouse protein
  is an integral protein of the mitochondrial outer membrane with two transmembrane segments and cytosolic
  N- and C-termini. Its expression is largely restricted to primary spermatocytes, and in germline stem
  cells it binds the PIWI protein MILI/PIWIL2 and is required for primary piRNA biogenesis by a mechanism
  that does not need its HXXXXD catalytic motif, possibly as a scaffold on the mitochondrial surface. This
  800-residue donkey protein is the full-length model of the gene, covering the acyltransferase domain,
  the HXXXXD motif, both transmembrane segments and the conserved C-terminus of the mouse protein. None
  of these functions has been measured in donkey.
