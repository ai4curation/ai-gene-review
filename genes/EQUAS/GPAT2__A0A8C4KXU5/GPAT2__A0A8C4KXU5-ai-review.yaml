core_functions:
- description: Mitochondrial outer membrane glycerol-3-phosphate acyltransferase that esterifies a fatty
    acyl-CoA, preferentially arachidonoyl-CoA, onto glycerol 3-phosphate, forming lysophosphatidic acid
    as the first step of phosphatidic acid and glycerolipid synthesis. Inferred from mouse Gpat2 in the
    same PANTHER subfamily; not measured in donkey.
  molecular_function:
    id: GO:0004366
    label: glycerol-3-phosphate O-acyltransferase activity
  directly_involved_in:
  - id: GO:0006654
    label: phosphatidic acid biosynthetic process
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:22905194
    supporting_text: GPAT2 overexpression significantly increased both GPAT and AGPAT activities only when
      arachidonoyl-CoA was used as a substrate
  - reference_id: PMID:23611983
    supporting_text: GPAT2 is an enzyme of the mitochondrial outer membrane
  - reference_id: file:EQUAS/GPAT2__A0A8C4KXU5/GPAT2__A0A8C4KXU5-bioinformatics/RESULTS.md
    supporting_text: The donkey HXXXXD acyltransferase motif is HKSLLD at residues 205-210
- description: Germline factor that binds MILI/PIWIL2 at the mitochondrial outer membrane and is required
    for primary piRNA processing by a mechanism that does not need its acyltransferase catalytic motif.
    Inferred from one study of mouse Gpat2 in germline stem cells; not studied in donkey.
  directly_involved_in:
  - id: GO:0034587
    label: piRNA processing
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:23611983
    supporting_text: These data clearly show that GPAT2 plays a critical role in primary processing during
      piRNA production.
  - reference_id: PMID:23611983
    supporting_text: These data suggest that the acyltransferase activity of GPAT2 is dispensable for the
      biogenesis of piRNA.
  knowledge_gaps:
  - gap_statement: How GPAT2 promotes primary piRNA processing without its acyltransferase catalytic motif
      is unknown; a scaffold role tethering MILI and other factors to the mitochondrial outer membrane has
      been proposed but not tested.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is the lysophosphatidic acid acyltransferase activity seen in membranes of Gpat2-overexpressing
    cells an intrinsic activity of GPAT2, or does it come from endogenous AGPATs acting on GPAT2-made product?
- question: Is GPAT2 expressed in donkey testis, and is the 800-residue model (A0A8C4KXU5) with the conserved
    C-terminus the main product there?
suggested_experiments:
- description: Assay purified or reconstituted GPAT2 for GPAT and AGPAT activity with arachidonoyl-CoA,
    alongside an HXXXXD mutant, to separate intrinsic from host-membrane activity.
- description: Map the MILI/PIWIL2-binding region of GPAT2 by co-immunoprecipitation of truncation mutants
    and test which regions are needed to rescue primary piRNA production in Gpat2-knockdown germline stem
    cells.
