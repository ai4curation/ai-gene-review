- term:
    id: GO:0034587
    label: piRNA processing
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q14DK4
  - ensembl:ENSMUSP00000049619
  - PANTHER:PTN008998243
  review:
    summary: Combined Ensembl Compara and TreeGrafter transfer of the mouse Gpat2 IMP annotation (PMID:23611983).
      Mouse Gpat2 co-precipitates with MILI/PIWIL2 from testis, its knockdown in MILI-rescued germline stem
      cells abolishes primary piRNA production, and HXXXXD-mutant Gpat2 still rescues. PAINT did not place
      this term at any node of PTHR12563 in the cached data, including the GPAT1/GPAT2 node, so it is not
      asserted as an ancestral function of the family.
    action: ACCEPT
    reason: The PAINT omission is consistent with this being a GPAT2-lineage function rather than one shared
      with GPAT1 (subfamily SF16), and this donkey protein is inside the GPAT2 subfamily (SF15) with the
      mouse donor, so the transfer stays within the clade that has the experimental evidence. Knockdown alone
      would show only necessity, but two further observations argue that GPAT2 does part of the work of
      primary processing rather than supplying a lipid upstream. Its requirement does not depend on the catalytic
      motif, and it binds MILI at the mitochondrial outer membrane, where the authors propose it acts as
      a scaffold for the processing machinery. The evidence is from one study in mouse germline stem cells,
      and nothing is known of GPAT2 in donkey germ cells.
    supported_by:
    - reference_id: PMID:23611983
      supporting_text: These data clearly show that GPAT2 plays a critical role in primary processing during
        piRNA production.
    - reference_id: PMID:23611983
      supporting_text: These data suggest that the acyltransferase activity of GPAT2 is dispensable for the
        biogenesis of piRNA.
    - reference_id: PMID:23611983
      supporting_text: Binding of MILI to GPAT2 was confirmed by coimmunoprecipitation analysis of testis
        samples
