    summary: Ensembl Compara transfer from mouse Gpat2 Q14DK4, which carries this term by IDA (PMID:22905194).
      The mouse evidence is a roughly two-fold rise in lysophosphatidic acid acyltransferase (AGPAT) activity
      in total membranes from CHO-K1 cells overexpressing Gpat2, with arachidonoyl-CoA.
    action: KEEP_AS_NON_CORE
    reason: The donkey protein is in the same PANTHER subfamily as mouse Gpat2 (PTHR12563:SF15) and the
