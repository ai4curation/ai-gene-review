core_functions:
- description: Endosome-associated coiled-coil protein that resides on early and recycling
    endosomes, where (in human cells) it is recruited to retromer-decorated membranes via the
    WASH complex and has been implicated in endosome-to-plasma-membrane recycling of
    SNX27-retromer cargo such as GLUT1.
  locations:
  - id: GO:0055037
    label: recycling endosome
  - id: GO:0005769
    label: early endosome
  supported_by:
  - reference_id: PMID:23108400
    supporting_text: SDCCAG3 is a novel endosomal protein, primarily localized at the
      early/recycling endosomal compartment
  - reference_id: PMID:24980502
    supporting_text: Together, these data establish that the association of ANKRD50, SDCCAG3, and
      RME-8 to retromer is mediated through binding to the WASH complex, and for SDCCAG3 this is
      necessary for targeting to retromer-labeled endosomes.
suggested_questions:
- question: Does the donkey ENTR1 locus encode a full-length protein with the N-terminal
    basal-body-targeting region, and is A0A8C4MKL2 an incomplete gene model or a genuine
    N-terminally truncated isoform?
- question: Human ENTR1 carries an IMP annotation to GO:0032456 endocytic recycling
    (PMID:25278552, 2014), yet PAINT curators propagated its endosome, cytokinesis and cilium
    terms (2019, 2024) but not endocytic recycling. Was that omission deliberate (the SDCCAG3
    knockdown phenotype is cargo-selective and modest), and should the recycling role be
    represented at the family level?
- question: Is the hominid-restricted PANTHER subfamily split (human ENTR1 in PTHR31259:SF6,
    other mammals in SF3) biologically meaningful, or an HMM partition within a single
    orthologous lineage?
