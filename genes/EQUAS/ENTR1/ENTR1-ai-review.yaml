id: A0A8C4MKL2
gene_symbol: ENTR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: >-
  ENTR1 (endosome-associated-trafficking regulator 1, also known as SDCCAG3) is a cytoplasmic
  coiled-coil protein of early and recycling endosomes, conserved as a single-copy gene across
  vertebrates (PANTHER family PTHR31259). Characterized in human cells, it is recruited to
  retromer-decorated endosomes through the WASH complex and has been implicated in
  SNX27-retromer-dependent recycling of cargo such as GLUT1 to the cell surface; it also
  relocates to the midbody during cytokinesis, where it acts with the phosphatase PTPN13 and the
  ArfGAP GIT1, and localizes to the centrosome and ciliary basal body, where it binds IFT88 and
  supports cilium assembly and ciliary delivery of polycystin-2. The donkey entry A0A8C4MKL2
  (356 aa) conserves the C-terminal ENTR1 coiled-coil region (81% identity to human ENTR1) but
  lacks the segment corresponding to human residues 9-85 and does not begin with methionine, so
  it most likely represents an N-terminally incomplete gene model of the donkey ENTR1 gene; the
  missing segment overlaps the N-terminal region that mediates basal-body targeting, IFT88
  binding and GIT1 binding in human ENTR1.
