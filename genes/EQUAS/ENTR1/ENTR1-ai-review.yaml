  qualifier: involved_in
  review:
    summary: Proposed core process. Human ENTR1 depletion disrupts SNX27-retromer-dependent
      endosome-to-plasma-membrane recycling of cargo such as GLUT1.
    action: NEW
    reason: Human ENTR1 has an IMP annotation to endocytic recycling (PMID:25278552), which is the
      best-characterized process for the protein and the one that matches its early/recycling
      endosome localization. The donkey protein retains the conserved coiled-coil region. ENTR1
      contributes as a retromer-associated regulator of cargo sorting rather than as the cargo
      itself, so the participation test is met at the level GO uses for retromer accessory
      factors.
