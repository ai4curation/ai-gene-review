- id: PMID:23108400
  title: The serologically defined colon cancer antigen-3 interacts with the protein tyrosine phosphatase
    PTPN13 and is involved in the regulation of cytokinesis.
  findings:
  - statement: Human ENTR1 (SDCCAG3) is an early/recycling endosomal protein that accumulates at
      the midbody during cytokinesis, complexes with PTPN13 and binds GIT1; its over- or
      under-expression increases multinucleation.
    supporting_text: SDCCAG3 is a novel endosomal protein, primarily localized at the
      early/recycling endosomal compartment
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache (Hagemann et al. 2013, Oncogene). Source of the human IDA
      endosome, midbody and regulation-of-cytokinesis annotations that PAINT propagated.
- id: PMID:24980502
  title: Retromer binding to FAM21 and the WASH complex is perturbed by the Parkinson disease-linked
    VPS35(D620N) mutation.
  findings:
  - statement: Human ENTR1 (SDCCAG3) associates with retromer indirectly, through the WASH complex,
      and this association is needed for its targeting to retromer-labelled endosomes.
    supporting_text: Together, these data establish that the association of ANKRD50, SDCCAG3, and
      RME-8 to retromer is mediated through binding to the WASH complex, and for SDCCAG3 this is
      necessary for targeting to retromer-labeled endosomes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached full text (McGough et al. 2014, Curr Biol). Establishes ENTR1 as a
      WASH-dependent retromer-associated protein rather than a retromer subunit.
- id: PMID:25278552
  title: Identification of molecular heterogeneity in SNX27-retromer-mediated endosome-to-plasma-membrane
    recycling.
  findings:
  - statement: The VPS35 interactome includes SDCCAG3 (ENTR1); its depletion reduces GLUT1 surface
      levels, with only minor effects on other SNX27-retromer cargo.
    supporting_text: Suppression of SDCCAG3 led to a decrease in GLUT1 surface expression and a
      reduction in whole-cell levels, but this did not correlate with an obvious accumulation of
      GLUT1 in lysosomes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text; human ENTR1 (SDCCAG3) endosomal recycling study. Source of the
      human IMP endocytic recycling and colocalizes_with retromer complex annotations. In the 2026-10
      re-review it no longer supports a proposed donkey endocytic-recycling annotation (withdrawn,
      see notes) and is retained as background for the recycling role.
- id: PMID:27767179
  title: The serologically defined colon cancer antigen-3 (SDCCAG3) is involved in the regulation
    of ciliogenesis.
  findings:
  - statement: The N-terminal 100 residues of human ENTR1 are necessary and sufficient for basal
      body localization and mediate IFT88 binding.
    supporting_text: Amino acids 1-100 of SDCCAG3 are necessary and sufficient for basal body localization
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text; defines the N-terminal ciliary-targeting region that is mostly
      absent from the donkey sequence model.
