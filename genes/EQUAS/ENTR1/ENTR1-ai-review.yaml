id: A0A8C4MKL2
gene_symbol: ENTR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: >-
  ENTR1 (endosome-associated-trafficking regulator 1, also known as SDCCAG3) is a cytoplasmic
  coiled-coil protein of early and recycling endosomes. In mammals it associates with the
  SNX27-retromer machinery and supports endosome-to-plasma-membrane recycling of cargo such as
  GLUT1, and it also has roles in cytokinesis (at the midbody, with PTPN13 and GIT1) and in
  primary cilium formation and ciliary cargo localization (at the centrosome/basal body, via
  IFT88). This donkey entry (356 aa) conserves the C-terminal ENTR1 coiled-coil region (81%
  identity to human ENTR1) but lacks the region corresponding to human residues 9-85 and does
  not begin with methionine, so it most likely represents an N-terminally incomplete gene model;
  the missing segment overlaps the N-terminal region that mediates basal-body targeting, IFT88
  binding and GIT1 binding in human ENTR1.
