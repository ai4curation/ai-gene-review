  review:
    summary: Early endosome localization is experimentally established for human ENTR1 and is
      the principal steady-state location of the protein.
    action: ACCEPT
    reason: Human ENTR1 is primarily localized at the early/recycling endosomal compartment
      (PMID:23108400) and the same term is an IBA on human ENTR1 (PAINT node PTN002039065), so
      PAINT curators judged it ancestral to the clade. Donkey A0A8C4MKL2 is in PTHR31259:SF3;
      human ENTR1 sits in the hominid-only split SF6, but both are the single ENTR1 ortholog
      (a human ENTR1 fragment, A0A0A0MRP9, scores into SF3), so the subfamily difference is an
      HMM partition within one orthologous lineage, not a paralog boundary. The conserved
      C-terminal coiled-coil region is retained in this gene model.
