id: A0A8C4MKL2
gene_symbol: ENTR1
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 2 ProtNLM2 GO predictions for donkey ENTR1 (A0A8C4MKL2), using human
  ENTR1 experimental findings and a donkey-human sequence comparison. The donkey entry (356 aa)
  conserves the C-terminal coiled-coil region but lacks the region corresponding to human residues
  9-85. Endocytic recycling is a correct process prediction absent from donkey GOA (COR). Retromer
  complex is uncertain (UNC), because human ENTR1 is a retromer-associated interactor that
  colocalizes with retromer rather than an established subunit. ProtNLM2 also emitted a
  non-GO subcellular location ("Membrane") for this accession, which is not scored here.
