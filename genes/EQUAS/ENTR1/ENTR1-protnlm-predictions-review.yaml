predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0032456
    label: endocytic recycling
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Human ENTR1 (SDCCAG3) was identified in the VPS35 interactome, and its depletion
      causes trafficking defects of SNX27-retromer-dependent cargo such as GLUT1 (PMID:25278552;
      human GOA has an IMP annotation to this exact term). The donkey protein is in the same PANTHER
      subfamily and shares 81% identity with human ENTR1 over the conserved region. The term is
      absent from the donkey GOA record, whose 8 TreeGrafter rows cover endosome localization,
      cytokinesis and cilium terms but no recycling process. The prediction is therefore a correct
      novel annotation for this accession. Training-set membership is unknown.
    supported_by:
    - reference_id: PMID:25278552
      supporting_text: Depletion of these proteins resulted in trafficking defects of retromer-dependent
        cargo
    - reference_id: file:EQUAS/ENTR1/ENTR1-bioinformatics/human_Q96C92-uniprot.txt
      supporting_text: |-
        Involved in the endosome-to-plasma
        CC       membrane trafficking and recycling of SNX27-retromer-dependent cargo
        CC       proteins, such as GLUT1
    - reference_id: file:EQUAS/ENTR1/ENTR1-bioinformatics/RESULTS.md
      supporting_text: The donkey sequence A0A8C4MKL2 (356 residues) aligns to human Q96C92 (435
        residues) with 81.41% identity across 355 paired residues.
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-10-14
  predicted_term:
    id: GO:0030904
    label: retromer complex
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: Human ENTR1 interacts with VPS35 and colocalizes with the retromer cargo-selective
      complex on endosomes in a WASHC2-dependent manner, and human GOA records this only with the
      colocalizes_with qualifier (IDA, PMID:25278552). No evidence shows ENTR1 to be a stable subunit
      of the retromer complex, and the cited study describes it as one of several retromer-interacting
      proteins. The prediction is thus plausible as an association but neither supported nor
      refuted as complex membership. The term is absent from donkey GOA.
    supported_by:
    - reference_id: file:EQUAS/ENTR1/ENTR1-bioinformatics/human_Q96C92-uniprot.txt
      supporting_text: |-
        Colocalizes in a WASHC2-dependent manner with the retromer CSC
        CC       complex at endosomes
    - reference_id: PMID:25278552
      supporting_text: This has identified a number of new interacting proteins, including ankyrin-repeat
        domain 50 (ANKRD50), seriologically defined colon cancer antigen 3 (SDCCAG3)
