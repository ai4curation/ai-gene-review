id: A0A8C4MKL2
gene_symbol: ENTR1
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 2 ProtNLM2 GO predictions for donkey ENTR1 (A0A8C4MKL2), using human
  ENTR1 experimental findings, the donkey and human ENTR1 gene reviews, and a donkey-human sequence
  comparison. The donkey entry (356 aa) conserves the C-terminal coiled-coil region (81% identity to
  human ENTR1) but lacks the region corresponding to human residues 9-85. Endocytic recycling is a
  correct process prediction, transferred by orthology from human IMP evidence, that is absent
  from donkey GOA (COR). Retromer complex is uncertain (UNC), because human ENTR1 associates with
  retromer indirectly through the WASH complex and colocalizes with it rather than being an
  established subunit. ProtNLM2 also emitted a non-GO subcellular location ("Membrane") for this
  accession, which is not scored here.
