id: A0A9L0IQ95
gene_symbol: NUMB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: NUMB is a cytoplasmic adaptor protein with an N-terminal phosphotyrosine-binding (PTB)
  domain that associates peripherally with the cytoplasmic face of the plasma membrane and endosomes.
  It acts as an endocytic protein in clathrin-mediated receptor endocytosis, where its activity is regulated
  by phosphorylation by the AP-2-associated kinase AAK1, and in mammals it is required during neurogenesis
  to maintain neural progenitor (radial glial) cells and for postnatal subventricular zone neurogenesis.
  The donkey protein A0A9L0IQ95 is 97% identical to human NUMB and its exon structure corresponds to
  human isoform 5 (PTB insert present, proline-rich-region insert absent).
