suggested_questions:
- question: Which molecular activity term best captures NUMB's role at coated pits (cargo-specific adaptor
    via its PTB domain, or AP-2/EH-protein scaffold via the C-terminal DPF/NPF motifs), and why do neither
    human nor mouse NUMB carry a Notch signalling-pathway annotation despite the classical Notch-antagonist
    literature?
- question: Should the endocytic terms curated experimentally for human and mouse NUMB (clathrin-coated
    pit, endosome membrane, regulation of endocytosis) be propagated at PAINT node PTN000132844, which
    currently carries only cytoplasm, basolateral plasma membrane, cytoplasmic vesicle and positive regulation
    of neurogenesis?
- question: Which NUMB isoforms are expressed in donkey tissues, and does the isoform-5-like model (lacking
    the human 219-316 segment) represent a major transcript?
suggested_experiments:
- description: Profile NUMB transcripts in donkey brain and epithelial tissues by long-read RNA-seq to
    determine which isoforms (PTB and proline-rich-region inserts, 219-316 segment) are expressed.
