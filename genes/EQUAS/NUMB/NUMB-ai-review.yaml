- term:
    id: GO:0050769
    label: positive regulation of neurogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000132844
  - UniRule:UR001303789
  review:
    summary: Positive regulation of neurogenesis, from the combined IEA pipeline (PANTHER node plus UniRule).
      This is the biological-process term the PAINT curator placed on the NUMB node, grounded in mouse genetics
      showing that Numb and Numbl redundantly maintain neural progenitors during embryonic neurogenesis
      (PMID:12410312) and postnatally in the subventricular zone (PMID:17174898).
    action: KEEP_AS_NON_CORE
    reason: The role is real and phylogenetically grounded (donkey NUMB is in the SF5 subfamily that inherits
      the PTN000132844 assertion). It is kept as non-core because the evidence is conditional double-knockout
      genetics in the mouse brain, establishing that NUMB/NUMBL are required for progenitor maintenance,
      while the cellular activity through which NUMB acts (endocytic adaptor function and adherens-junction
      maintenance) is what this review records as core. The term is not too general for that evidence,
      so no refinement is proposed.
    supported_by:
    - reference_id: PMID:12410312
      supporting_text: mouse numb and numblike (Nbl), two
        highly conserved homologues of Drosophila numb, play redundant but critical
        roles in maintaining neural progenitor cells during embryogenesis
    - reference_id: file:EQUAS/NUMB/NUMB-bioinformatics/human-P49757-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Required throughout embryonic neurogenesis to maintain neural progenitor cells
- term:
    id: GO:2000369
    label: regulation of clathrin-dependent endocytosis
  evidence_type: ISS
  original_reference_id: PMID:18657069
  review:
    summary: Human NUMB is an endocytic protein that acts at an early step of clathrin-mediated endocytosis;
      a phosphorylation-site mutant (T102A) enriched at coated pits disrupts transferrin and LDL internalization
      (PMID:18657069). UniProt records this as curated, publication-backed function for human NUMB.
    action: NEW
    reason: 'Participation test: NUMB itself is a component at clathrin-coated pits whose state (regulated
      by AAK1 phosphorylation at Thr-102) changes receptor internalization, so it does part of the regulatory
      work rather than being a cargo. Evolutionary basis: donkey NUMB and human NUMB are in the same PANTHER
      subfamily (PTHR47368:SF5, 1:1 orthologs), and the donkey isoform conserves the PTB domain, the Thr-102
      equivalent and the C-terminal DPF/NPF motifs. Comparator: human NUMB carries regulation of endocytosis
      (IMP); PAINT did not propagate an endocytosis term on PTN000132844, so this is proposed as a direct
      ortholog (ISS) transfer from human experimental data, not as an inherited family-level function.'
    supported_by:
    - reference_id: PMID:18657069
      supporting_text: Numb is an endocytic protein that is proposed to influence clathrin-coated pit
        assembly
    - reference_id: PMID:18657069
      supporting_text: potently disrupts transferrin and low-density lipoprotein internalization
    - reference_id: file:EQUAS/NUMB/NUMB-bioinformatics/human-P49757-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Regulates clathrin-mediated receptor endocytosis'
    - reference_id: file:EQUAS/NUMB/NUMB-bioinformatics/RESULTS-rereview.md
      supporting_text: It retains the complete PTB (PID) domain, the threonine
        equivalent to human Thr-102
