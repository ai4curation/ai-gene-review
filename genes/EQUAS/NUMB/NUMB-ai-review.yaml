  review:
    summary: Human NUMB is an endocytic protein that acts at an early step of clathrin-mediated endocytosis;
      a phosphorylation-site mutant (T102A) enriched at coated pits disrupts transferrin and LDL internalization
      (PMID:18657069).
    action: NEW
    reason: 'Participation test: NUMB itself is an endocytic component at clathrin-coated pits whose activity
      (regulated by AAK1) modulates receptor internalization, so it does part of the regulatory work rather
      than being a cargo. Transferred to the donkey ortholog (97% identity, PTB domain and AAK1 site region
      in the aligned block). This is the cellular role underlying the existing endocytic-compartment
      locations.'
