id: A0A9L0IQ95
gene_symbol: NUMB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: NUMB is a cytoplasmic adaptor protein of the Numb/Numb-like family with an N-terminal
  phosphotyrosine-binding (PTB) domain and a C-terminal region carrying DPF and NPF motifs. It associates
  peripherally with the cytoplasmic face of the plasma membrane, clathrin-coated structures and endosomes,
  and in mammals acts as an endocytic protein that regulates clathrin-mediated receptor internalization,
  its activity being regulated by phosphorylation by the AP-2-associated kinase AAK1. In the developing
  mammalian brain NUMB, redundantly with NUMBL, maintains neural progenitor (radial glial) cells and their
  cadherin-based adherens junctions, and postnatally supports subventricular zone neurogenesis. The donkey
  gene encodes several isoforms; this entry is a 506-residue product whose exon structure corresponds to
  human isoform 5 (PTB insert present, proline-rich-region insert absent).
