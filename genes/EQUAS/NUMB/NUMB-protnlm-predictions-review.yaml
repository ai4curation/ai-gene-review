    summary: Human NUMB localizes to the cytoplasmic face of the plasma membrane, where it acts at clathrin-coated
      pits and accumulates when AAK1 is depleted (PMID:18657069); the donkey protein is 97% identical
      to human NUMB with a conserved PTB domain. The exact term is already present in donkey GOA (UniProt
      subcellular-location mapping), and donkey GOA also carries the more specific basolateral plasma
      membrane from the PANTHER node. The prediction is therefore correct but not novel. Training-set
      membership is unknown.
