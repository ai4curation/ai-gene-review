id: A0A9L0IJE9
gene_symbol: CADM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: CADM1 (cell adhesion molecule 1; also called SynCAM1, nectin-like protein 2/Necl-2, TSLC1)
  is a single-pass type I transmembrane protein of the immunoglobulin superfamily, nectin-like family. It
  has three extracellular Ig-like domains (one V-type, two C2-type), a transmembrane helix and a short
  cytoplasmic tail. The tail carries a juxtamembrane protein 4.1 (FERM)-binding region and a C-terminal
  EYFI PDZ-binding motif. In the characterised mammalian orthologs, CADM1 mediates Ca(2+)-independent homophilic
  cell-cell adhesion through its V-type domain, as well as heterophilic adhesion with CADM2, CADM3 and NECTIN3.
  It localizes to the basolateral plasma membrane of epithelial cells and to pre- and postsynaptic membranes
  of neurons, where trans-synaptic CADM1 complexes promote and maintain excitatory synapses. Through its
  PDZ-binding motif it binds PDZ scaffolds such as PALS2, and through its FERM-binding region it binds Farp1.
  On epithelial, tumor and dendritic cells, CADM1 is the ligand of CRTAM on activated NK and CD8+ T cells,
  which makes CADM1-expressing cells targets of NK-cell cytotoxicity and supports T-cell responses and
  retention. A0A9L0IJE9 is the gene-centric canonical product of the donkey CADM1 gene. Its Ig domains,
  transmembrane helix and entire cytoplasmic tail are identical or nearly identical to human CADM1. No
  experiments have been reported on donkey CADM1; its functions are inferred from human and mouse orthologs
  in the same PANTHER subfamily.
