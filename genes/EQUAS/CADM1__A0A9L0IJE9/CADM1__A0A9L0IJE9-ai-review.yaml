core_functions:
- description: Transmembrane Ig-superfamily adhesion molecule that mediates Ca(2+)-independent homophilic,
    and heterophilic nectin-like, cell-cell adhesion at the plasma membrane. In neurons this adhesion forms
    trans-synaptic complexes at excitatory synapses. Inferred from rodent and human experiments; not tested
    in donkey.
  molecular_function:
    id: GO:0098632
    label: cell-cell adhesion mediator activity
  directly_involved_in:
  - id: GO:0007156
    label: homophilic cell-cell adhesion
  - id: GO:0007157
    label: heterophilic cell-cell adhesion
  - id: GO:0099560
    label: synaptic membrane adhesion
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0045211
    label: postsynaptic membrane
  - id: GO:0042734
    label: presynaptic membrane
  supported_by:
  - reference_id: PMID:12826663
    supporting_text: Necl-2 showed Ca2+-independent homophilic cell-cell adhesion activity.
  - reference_id: PMID:18003830
    supporting_text: They function as cell adhesion molecules and assemble with each other across the synaptic
      cleft into a specific, transsynaptic SynCAM 1/2 complex.
- description: Cell-surface ligand for the NK/CD8+ T cell receptor CRTAM, which makes CADM1-expressing cells
    susceptible to NK-cell mediated cytotoxicity. Inferred from human and mouse experiments; not tested in
    donkey.
  molecular_function:
    id: GO:0005102
    label: signaling receptor binding
  directly_involved_in:
  - id: GO:0042271
    label: susceptibility to natural killer cell mediated cytotoxicity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:15811952
    supporting_text: CRTAM-Necl-2 interactions promote cytotoxicity of NK cells
- description: Its C-terminal EYFI motif binds PDZ-domain scaffold proteins (PALS2 and related MAGUKs), linking
    the adhesion molecule to the intracellular scaffold. Inferred from rodent experiments; the motif is conserved
    in donkey.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:12826663
    supporting_text: Necl-2 did not bind afadin but bound Pals2, a membrane-associated guanylate kinase family
      member
  - reference_id: file:EQUAS/CADM1__A0A9L0IJE9/CADM1__A0A9L0IJE9-bioinformatics/RESULTS.md
    supporting_text: The transmembrane helix and the whole 47-residue cytoplasmic tail are also identical to
      human, including the protein 4.1-binding juxtamembrane region and the C-terminal EYFI PDZ-binding motif.
suggested_questions:
- question: Is CADM1 expressed in donkey brain, lung epithelium and immune cells with the same splice-isoform
    pattern as in human and mouse, and which stalk variant does the 473-residue canonical gene model correspond
    to?
- question: The synaptic vesicle location attributed to mouse CADM1 (PMID:12202822) conflicts with its plasma-membrane
    topology. Does it reflect vesicle-fraction contamination or a genuine trafficking pool?
suggested_experiments:
- description: Immunostaining of donkey hippocampus and lung with an anti-CADM1 antibody that recognizes the
    conserved cytoplasmic tail, to confirm synaptic and basolateral plasma-membrane localization in this species.
- description: CRTAM-Fc binding to donkey cells expressing A0A9L0IJE9, to confirm the CRTAM ligand function
    in equids.
