    summary: Ensembl Compara transfer from human CADM1, which has an IDA annotation from PMID:15811952. That
      study showed that CRTAM-Necl-2 engagement promotes IFN-gamma secretion by CD8+ T cells.
    action: KEEP_AS_NON_CORE
    reason: The donor finding is experimental and the CRTAM-binding V-type Ig domain of the donkey canonical
      product is identical to human. CADM1 acts here as the ligand on the partner cell; the cytokine is made
      by the CRTAM-bearing T cell. That is a real regulatory role mediated by the ligand, but it is downstream
