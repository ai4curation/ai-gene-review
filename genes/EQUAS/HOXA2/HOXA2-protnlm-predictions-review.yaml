  label: Equus asinus
status: COMPLETE
description: Assessment of 3 ProtNLM2 GO predictions for donkey HOXA2 (A0A9L0JBM7). All three terms
  (DNA binding, DNA-binding transcription factor activity RNA polymerase II-specific, nucleus) are already
  in donkey GOA and are biologically supported by transfer from experimentally characterised mouse and
  human HOXA2, which share PANTHER subfamily PTHR45664:SF3 with the donkey protein, whose homeodomain
  is identical to human. The TF activity and nucleus terms are correct but not novel (CNN). DNA binding
  is correct but less specific than RNA polymerase II cis-regulatory region sequence-specific DNA binding
  (GO:0000978), which the donkey gene already carries and its gene review accepts (LSP). No non-GO
  ProtNLM2 outputs (function text or location) were emitted for this accession.
