gene_symbol: HOXA2
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
status: COMPLETE
description: Assessment of 3 ProtNLM2 GO predictions for donkey HOXA2 (A0A9L0JBM7). All three terms (DNA
  binding, DNA-binding transcription factor activity RNA polymerase II-specific, nucleus) are already
  present in donkey GOA and are supported by human/mouse ortholog evidence and an identical homeodomain.
  DNA binding is CNN but much less specific than the RNA polymerase II cis-regulatory region sequence-specific
  DNA binding also in donkey GOA (LSP). No non-GO ProtNLM2 outputs (function text or location) were emitted
  for this accession.
