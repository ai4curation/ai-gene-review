  predicted_term:
    id: GO:0005634
    label: nucleus
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: Nuclear localization is experimentally shown for mouse Hoxa2 (immunodetection in embryonic
      neural tube nuclei), and its regulated exit from the nucleus via the KPC2 interactor implies a nuclear
      steady state; human HOXA2 is curated as nuclear. The donkey protein is in the same PANTHER subfamily
      (PTHR45664:SF3) with an identical homeodomain, so the transfer is justified. The exact term is already
      in donkey GOA and is accepted as a core location by the gene review. Correct but not novel.
    supported_by:
