  predicted_term:
    id: GO:0003677
    label: DNA binding
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: HOXA2 binds DNA through its homeodomain, which is 100% identical between donkey and human,
      so the prediction is correct. Donkey GOA already contains DNA binding and, more specifically, RNA
      polymerase II cis-regulatory region sequence-specific DNA binding (GO:0000978) and sequence-specific
      double-stranded DNA binding (GO:1990837), both grounded in ortholog experiments. Because a supported,
      more specific annotation exists, the prediction is less precise.
    supported_by:
