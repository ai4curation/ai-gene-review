id: A0A9L0JBM7
gene_symbol: HOXA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: HOXA2 (homeobox protein Hox-A2) is a homeodomain transcription factor of the Antp homeobox
  family, proboscipedia subfamily, and the paralog group 2 member of the HOXA cluster. It binds specific
  DNA sequences in RNA polymerase II cis-regulatory regions through its homeodomain and, depending on
  the target and cofactors (PBX/MEIS), represses or activates transcription in the nucleus. In the mammalian
  embryo it acts in cranial neural crest-derived mesenchyme of the second pharyngeal arch as a selector
  gene that confers second-arch (hyoid) identity, so that loss of function transforms second-arch skeletal
  elements into first-arch (mandibular and middle-ear) structures; it is also expressed in hindbrain
  rhombomeres 2-3 and the spinal cord. Human HOXA2 variants cause microtia with hearing impairment and
  cleft palate. The donkey protein A0A9L0JBM7 is a full-length 373-residue product, 97.6% identical
  to human HOXA2 with an identical homeodomain and hexapeptide.
