id: A0A9L0JBM7
gene_symbol: HOXA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: HOXA2 (homeobox protein Hox-A2) is a homeodomain transcription factor of the Antp family,
  proboscipedia subfamily, and the most anterior (paralog group 2) member of the HOXA cluster. It binds
  specific DNA sequences in RNA polymerase II cis-regulatory regions through its homeodomain and represses
  or activates target genes in the nucleus. In the mammalian embryo it confers positional identity on
  the second pharyngeal arch neural crest mesenchyme, where it controls middle-ear and other skeletal
  element patterning, and on hindbrain rhombomeres 2-3. Human HOXA2 variants cause microtia with hearing
  impairment and cleft palate. The donkey protein A0A9L0JBM7 is 97.6% identical to human HOXA2 with an
  identical homeodomain.
