- term:
    id: GO:0061061
    label: muscle structure development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P31245
  - ensembl:ENSMUSP00000014848
  review:
    summary: Muscle structure development (Ensembl Compara from a mouse IDA row citing PMID:25889273,
      a Hoxa2 overexpression study in cranial neural crest).
    action: MARK_AS_OVER_ANNOTATED
    reason: The cached abstract of PMID:25889273 describes skeletal transformations of neural crest
      derivatives after ectopic Hoxa2 expression and says nothing about muscle; the full text is not
      available locally. Pharyngeal-arch muscles derive from mesoderm, not from the Hoxa2-expressing
      neural crest, so any effect of Hoxa2 on muscle patterning is expected to be non-cell-autonomous,
      via the crest-derived connective tissue. That makes muscle structure development a downstream
      consequence of HOXA2's activity in another cell population rather than a process HOXA2 performs.
      Not removed, because the mouse curator saw the full text; the earlier KEEP_AS_NON_CORE is tightened
      to over-annotation for the electronic transfer to donkey.
    supported_by:
    - reference_id: PMID:25889273
      supporting_text: Here we show that ectopic expression of Hoxa2 in Hox-negative CNCCs results in
        distinct phenotypes in different CNCC subpopulations.
