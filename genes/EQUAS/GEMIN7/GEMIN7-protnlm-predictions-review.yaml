description: 'Assessment of 1 ProtNLM2 GO prediction for donkey GEMIN7 (A0A9L0ICL9), judged against the
  donkey GOA record (spliceosomal snRNP assembly, SMN-Sm protein complex, Sm-like protein family complex,
  RNA binding, cytoplasm, nucleoplasm, Gemini of Cajal bodies), the human ortholog Q9H840 and cached SMN-complex
  studies (PMID:12065586, PMID:17178713), and a donkey-human alignment (88% identity over the complete human
  sequence). Sm-like protein family complex is correct and is itself in donkey GOA, but the GOA record also
  carries its more specific descendant SMN-Sm protein complex, so the prediction is scored as less precise
  (LSP). Non-GO ProtNLM2 output, not scored: subcellular location ''Nucleus'', consistent with the nucleoplasm
  and gem localization of human GEMIN7 but omitting its cytoplasmic pool. No function text was emitted
  for this accession.'
