    summary: Human GEMIN7 is a core SMN-complex subunit that binds SMN, GEMIN6 and Sm proteins (PMID:12065586)
      and sits at the centre of the complex with SMN and GEMIN8 (PMID:17178713); the donkey protein covers
      the complete human sequence at 88% identity. Membership of an Sm-like protein family complex is
      therefore correct. The exact term is present in donkey GOA (TreeGrafter), but donkey GOA also carries
      SMN-Sm protein complex, a more specific descendant of this term, so the prediction is correct but
      less precise than an existing annotation. Training-set membership is unknown.
