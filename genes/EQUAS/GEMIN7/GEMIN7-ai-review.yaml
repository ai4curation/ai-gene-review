id: A0A9L0ICL9
gene_symbol: GEMIN7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: GEMIN7 is a small core component of the SMN complex, the assembly machine that loads the
  heptameric Sm protein ring onto small nuclear RNAs to form the core of spliceosomal snRNPs. It forms
  a heterodimer with GEMIN6 in which both proteins adopt Sm-like folds, binds SMN and GEMIN8 at the centre
  of the complex, recruits GEMIN6 and UNRIP/STRAP, and interacts directly with Sm proteins, in particular
  SmE (SNRPE), helping to organise Sm proteins for ring formation. It is found in the cytoplasm, where
  snRNP core assembly occurs, and in the nucleoplasm and nuclear gems. The donkey protein A0A9L0ICL9 matches
  the complete human GEMIN7 sequence at 88% identity but carries a 75-residue N-terminal extension in
  this gene model.
