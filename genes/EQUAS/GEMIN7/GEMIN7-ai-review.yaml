id: A0A9L0ICL9
gene_symbol: GEMIN7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9793
  label: Equus asinus
description: GEMIN7 (gem-associated protein 7) is a small subunit of the SMN complex, the cytoplasmic
  assembly machine that loads the heptameric Sm protein ring onto the Sm site of small nuclear RNAs to
  form the core of spliceosomal snRNPs. GEMIN7 forms a heterodimer with GEMIN6 in which both proteins
  adopt Sm-like folds without Sm sequence similarity; it binds SMN directly through arginine/glycine-rich
  sequence, links GEMIN6 to the complex, contacts GEMIN8 and UNRIP/STRAP, and binds several Sm proteins,
  in particular SmE (SNRPE). GEMIN8 bound to the SMN oligomer recruits the GEMIN6-GEMIN7 pair, an arrangement
  conserved from fission yeast to mammals. GEMIN7 is found in the cytoplasm, where Sm-core assembly occurs,
  and in the nucleoplasm and nuclear gems. No RNA-binding or catalytic activity of GEMIN7 itself has been
  shown. The donkey entry A0A9L0ICL9 is a 206-residue alternative transcript model of the GEMIN7 gene whose
  C-terminal 131 residues are identical to the 131-residue canonical-length donkey product (A0A9L0J5X5),
  which is 88% identical to human GEMIN7; the 75-residue N-terminal extension has no counterpart in human
  or horse GEMIN7.
existing_annotations:
- term:
    id: GO:0000387
    label: spliceosomal snRNP assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001428136
  review:
    summary: Spliceosomal snRNP assembly, transferred by TreeGrafter from PANTHER node PTN001428136 (family
      PTHR14679, subfamily SF1, which contains human, mouse, bovine and fission yeast GEMIN7). The PAINT
      IBA on human GEMIN7 for this term is seeded by human GEMIN7 and S. pombe Gem7, both experimentally
      placed in the SMN complex.
    action: ACCEPT
    reason: Core process. GEMIN7 is a subunit of the assembly machine itself and contacts Sm proteins
      directly, so it does some of the work of Sm-core assembly rather than being a substrate. The donkey
      protein is in the same PANTHER subfamily (PTHR14679:SF1) as the characterised human and S. pombe
      proteins, and the Gemin6/7 recruitment by Gemin8 on the SMN platform is conserved from fission yeast
      to human, so the PAINT placement deep in the family is well founded.
    supported_by:
    - reference_id: PMID:18984161
      supporting_text: Our data identify pICln as an assembly chaperone and the SMN complex as a catalyst
        of spliceosomal snRNP formation.
    - reference_id: PMID:12065586
      supporting_text: Gemin7 interacts with several Sm proteins of spliceosomal small nuclear ribonucleoproteins,
        in particular, with SmE
    - reference_id: PMID:33754639
      supporting_text: This creates a central platform onto which Gemin8 binds and recruits Gemins 6 and
        7.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR047575
  - UniRule:UR001714480
  review:
    summary: RNA binding, from the combined automated pipeline (InterPro Sm-domain entry IPR047575 plus
      a UniRule). GEMIN7 adopts an Sm-like fold and heterodimerizes with GEMIN6, but has no significant
      sequence similarity to Sm proteins, and no RNA-binding activity of GEMIN7 has been reported.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mapping assumes that an Sm fold implies Sm-site RNA binding. Documented GEMIN7 interactions
      are with proteins (GEMIN6, SMN, GEMIN8, UNRIP and Sm proteins); within the SMN complex snRNA recognition
      is attributed to GEMIN5 and SMN/Gemin2 handle the Sm proteins. Human GEMIN7 carries RNA binding only
      from the same InterPro mapping, and PAINT did not place RNA binding at the GEMIN7 node although it
      placed the process and complex terms there. Not supported for GEMIN7 itself.
    supported_by:
    - reference_id: PMID:15939020
      supporting_text: Although Gemin6 and Gemin7 have no significant sequence similarity with Sm proteins,
        both adopt canonical Sm folds.
