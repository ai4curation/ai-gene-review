  review:
    summary: RNA binding, from the combined pipeline (InterPro Sm-domain entry IPR047575 and a UniRule).
      GEMIN7 adopts an Sm-like fold and heterodimerizes with GEMIN6, but has no significant sequence similarity
      to Sm proteins, and no RNA-binding activity of GEMIN7 has been reported.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mapping assumes that an Sm fold implies Sm-site RNA binding. The documented GEMIN7 interactions
      are with proteins (GEMIN6, SMN, GEMIN8, UNRIP and Sm proteins); in the SMN complex, snRNA recognition
      is attributed to other subunits. Not supported for GEMIN7 itself.
    supported_by:
