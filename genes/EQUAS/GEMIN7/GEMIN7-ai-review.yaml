core_functions:
- description: Subunit of the SMN complex that, as an Sm-like heterodimer with GEMIN6 recruited by GEMIN8,
    links GEMIN6 to SMN, contacts Sm proteins and supports SMN-complex-catalysed assembly of the Sm core
    of spliceosomal snRNPs in the cytoplasm.
  directly_involved_in:
  - id: GO:0000387
    label: spliceosomal snRNP assembly
  in_complex:
    id: GO:0034719
    label: SMN-Sm protein complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:12065586
    supporting_text: Gemin7 interacts directly with SMN and Gemin6 and mediates the association of
  - reference_id: PMID:15939020
    supporting_text: how the SMN complex, with Gemin6 and Gemin7 as tools, might organize Sm proteins
  - reference_id: PMID:33754639
    supporting_text: This creates a central platform onto which Gemin8 binds and recruits Gemins 6 and
      7.
suggested_questions:
- question: Does the Gemin6-Gemin7 Sm-like heterodimer contact snRNA during Sm-ring assembly, or is it
    purely a protein-protein adaptor for Sm proteins?
- question: Is the 75-residue N-terminal extension of the donkey A0A9L0ICL9 transcript model translated,
    or does the true start codon correspond to the conserved Met of the 131-residue product A0A9L0J5X5?
- question: Should the core SMN complex term (GO:0032797), which human GEMIN7 carries by IDA, be placed
    at the PAINT GEMIN7 node alongside the general Sm-like protein family complex, given that S. pombe
    Gem7 is also an SMN complex subunit?
suggested_experiments:
- description: Test purified GEMIN6-GEMIN7 heterodimer for binding to U snRNA Sm-site oligonucleotides
    by electrophoretic mobility shift or fluorescence anisotropy, with Sm protein rings as positive controls.
