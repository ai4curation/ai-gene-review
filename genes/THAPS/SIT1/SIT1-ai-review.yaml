taxon:
  id: NCBITaxon:35128
  label: Thalassiosira pseudonana
description: >-
  SIT1 (TpSIT1) of the centric diatom Thalassiosira pseudonana is a silicic acid transporter of the
  diatom SIT family (Pfam PF03842), an alpha-helical polytopic membrane protein unrelated to the
  aquaporin-type silicon channels of plants. eGFP-tagged SIT1 localizes to the plasma membrane, most
  strongly in silicon-starved cells, and its abundance falls as silicic acid is resupplied. Together
  with its close paralog SIT2 (88% identical), SIT1 contributes to silicic acid uptake at low,
  environmentally relevant concentrations (below about 30 uM), whereas at high concentrations uptake
  is dominated by diffusion; joint SIT1/SIT2 knockdown delays uptake and lowers new silica
  incorporation into the cell wall at 20 uM silicic acid. By homology to purified SITs from other
  diatoms, which transport silicic acid in proteoliposomes driven by a sodium gradient, SIT1 is
  inferred to be a sodium-coupled silicic acid transporter; its own transport kinetics have not been
  measured. A role in sensing external silicic acid has been proposed but not demonstrated.
