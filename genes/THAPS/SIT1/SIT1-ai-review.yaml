- term:
    id: GO:0015115
    label: silicate transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:27305972
  qualifier: enables
  supporting_entities:
  - UniProtKB:B7T1F4
  - UniProtKB:B8C4N0
  review:
    summary: >-
      Proposed new molecular function, inferred from SIT-family members whose transport activity was
      measured directly in proteoliposomes. No GO term exists for silicic-acid-specific transporter
      activity or for sodium-coupled silicic acid symport (the accepted GO:0015708 covers the
      process, not the activity), so this is the most specific available term.
    action: NEW
    reason: >-
      SIT1 has not itself been purified or assayed (it expressed very poorly in yeast), but it belongs
      to the SIT family, whose members PtSIT1 and NaSIT transport silicic acid with classical kinetics
      in reconstituted proteoliposomes driven by an inward sodium gradient, and whose T. pseudonana
      paralog TpSIT3 was reconstituted in the same assay. TpSIT3 is a weaker donor than PtSIT1: it
      gave only a modest signal just discernible above background, so the kinetics were measured on
      PtSIT1 and NaSIT. B7T1F4 (PtSIT1) therefore carries the inference and B8C4N0 (TpSIT3) is a
      supporting conspecific donor rather than an equal one.
      SIT1 is 88% identical to SIT2 and is plasma-membrane localized,
      and its knockdown together with SIT2 slows uptake at low silicic acid. GO defines this term on
      silicates as salts of silicic acids, which covers the Si(OH)4 substrate; GO has no
      silicic-acid-specific transporter activity term (see proposed_new_terms). The sodium coupling is
      a family-level inference, so it is left out of the annotation and raised as a question.
      With/From donors (UniProt REST and NCBI lookups): PtSIT1 is UniProtKB:B7T1F4 (gene SIT1,
      EMBL EU879093, 512 aa). TpSIT3 is UniProtKB:B8C4N0, a 437-residue fragment gene model that is
      an exact internal substring of the full-length 565-residue TpSIT3 cDNA protein (GenBank
      ABB81827), whose own UniProtKB entry Q0QVM6 was deleted as not part of a reference proteome.
      NaSIT is omitted: the only full-length Nitzschia alba SIT in NCBI (GenBank ABB81817, 549 aa)
      maps to UniProtKB Q0QVN6, also deleted, and no live UniProtKB entry exists. The paper's cached
      text does not list accessions, so the donor sequences are matched by gene name and length.
    supported_by:
    - reference_id: PMID:27305972
      supporting_text: Both PtSIT1 and NaSIT showed classical transport kinetics, with identical Vmax
        of 0.6±0.1 fluorescence units s−1 and KM for silicic acid of 19.1±4.5 μM and 19.6±7.7 μM for
        PtSIT1 and NaSIT respectively
    - reference_id: PMID:27305972
      supporting_text: An inward-directed electrochemical sodium gradient was applied to the SIT
        proteolipsomes and Zn silicate fluorescence from transported silicic acid was measured
        continuously in a stopped-flow instrument.
    - reference_id: PMID:27305972
      supporting_text: TpSIT3, NaSIT and PtSIT1 were reconstituted into proteoliposomes preloaded
        with 6 mM Zn acetate
    - reference_id: PMID:27305972
      supporting_text: PtSIT1 and NaSIT showed similar activity, but TpSIT3 gave a modest signal
        change that was only just discernible above background.
    - reference_id: PMID:22530967
      supporting_text: Silicic acid transport could be established in reconstituted proteoliposomes,
        and silicon uptake was found to be dependent upon an applied sodium gradient.
    - reference_id: PMID:17172435
      supporting_text: Pairwise comparison between each SIT revealed 88% amino acid identity and 95%
        similarity between TpSIT1 and TpSIT2.
    - reference_id: file:THAPS/SIT1/SIT1-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF03842; Silic_transp; 1.
