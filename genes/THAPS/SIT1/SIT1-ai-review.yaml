  - reference_id: PMID:27305972
    supporting_text: Both PtSIT1 and NaSIT showed classical transport kinetics
proposed_new_terms:
- proposed_name: silicic acid transmembrane transporter activity
  proposed_definition: >-
    Enables the transfer of silicic acid (orthosilicic acid, Si(OH)4) from one side of a membrane to
    the other.
  justification: >-
    The diatom SIT-family substrate is neutral orthosilicic acid, and GO already names it in the
    process term GO:0015708 silicic acid import across plasma membrane, but the only matching
    function term, GO:0015115 silicate transmembrane transporter activity, is defined on silicates
    as salts of silicic acids. A QuickGO search (2026-10-28) found no silicic-acid function term and
    no children of GO:0015115. A silicic acid term would pair the function with the existing process
    and could take a sodium-coupled child (silicic acid:sodium symporter activity) once coupling is
    shown for a given SIT. GO:0015115 is kept on the ISS row in the meantime.
  proposed_parent:
    id: GO:0022857
    label: transmembrane transporter activity
  supported_by:
  - reference_id: PMID:27305972
    supporting_text: Both PtSIT1 and NaSIT showed classical transport kinetics, with identical Vmax
      of 0.6±0.1 fluorescence units s−1 and KM for silicic acid of 19.1±4.5 μM and 19.6±7.7 μM for
      PtSIT1 and NaSIT respectively
suggested_questions:
- question: >-
    Does TpSIT1 itself transport silicic acid with sodium coupling and with what affinity, and does
    it differ from SIT2? Should GO have a "silicic acid:sodium symporter activity" term under solute:
    sodium symporter activity, given Na+-dependent transport for PtSIT1, NaSIT and TpSIT3?
- question: >-
    Which translation start is used in vivo: the cDNA-defined Met1 (517 aa, Q0QVM8) or the gene-model
    Met54 (464 aa, B8C2V9)? The missing segment carries the hydrophobic region that Shrestha and
    Hildebrand describe as a type I signal peptide.
- question: >-
    Do SIT1 and SIT2 act as sensors of external silicic acid, as proposed, or does an upstream sensor
    read their transport flux?
suggested_experiments:
- description: >-
    Gene-specific knockout (e.g. CRISPR/Cas9) of SIT1 alone and SIT2 alone, with silicic acid uptake
    (68Ge or silicomolybdate) and PDMPO incorporation measured at 5-30 uM and 200 uM Si(OH)4, to
    separate the contributions that the shared knockdown construct could not.
  experiment_type: gene knockout and uptake assay
- description: >-
    Express full-length TpSIT1 (517 aa) in Xenopus oocytes or purify it into proteoliposomes and
    measure silicic acid transport kinetics and sodium dependence, compared with the 464-residue
    gene-model form.
  experiment_type: heterologous transport assay
