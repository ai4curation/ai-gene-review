  review:
    summary: >-
      InterPro2GO mapping from the diatom silicon transporter family signature (IPR004693). The
      process is supported for SIT2 by its plasma-membrane localization and by knockdown of SIT2
      together with SIT1, which slows silicic acid uptake at low external concentrations.
    action: ACCEPT
    reason: >-
      The family mapping is sound: SITs are the only proteins of the IPR004693/PF03842 family, and
      purified family members transport silicic acid into proteoliposomes (PMID:27305972). For SIT2
      itself, eGFP-tagged SIT2 is in the plasma membrane and a construct that knocks down SIT1 and SIT2
      together delays silicic acid depletion from 20 uM medium (PMID:25380754). The knockdown cannot
      separate SIT1 from SIT2, but plasma-membrane location, family activity and the knockdown
      phenotype together support import across the plasma membrane. The process holds only for low
      silicic acid; at high concentrations uptake is diffusional (PMID:18162598).
    supported_by:
