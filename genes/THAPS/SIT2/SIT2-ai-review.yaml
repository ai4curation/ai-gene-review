taxon:
  id: NCBITaxon:35128
  label: Thalassiosira pseudonana
description: >-
  SIT2 (TpSIT2) of the centric diatom Thalassiosira pseudonana is a silicic acid transporter of the
  diatom SIT family (Pfam PF03842), a polytopic membrane protein 88% identical to its paralog SIT1 and
  unrelated to the aquaporin-type silicon channels of plants. eGFP-tagged SIT2 localizes to the plasma
  membrane of silicon-starved cells, at lower abundance than SIT1; after silicic acid resupply its
  level falls and then rises again around S phase, a pattern distinct from SIT1. Together with SIT1,
  SIT2 contributes to silicic acid uptake at low, environmentally relevant concentrations (below about
  30 uM), whereas at high concentrations uptake is dominated by diffusion; joint SIT1/SIT2 knockdown
  delays uptake and lowers new silica incorporation at 20 uM silicic acid. By homology to purified SITs
  from other diatoms, which transport silicic acid in proteoliposomes driven by a sodium gradient, SIT2
  is inferred to be a sodium-coupled silicic acid transporter; its own transport has not been measured.
  A role in sensing silicic acid, or in preloading silicic acid before valve formation, has been
  proposed but not demonstrated.
