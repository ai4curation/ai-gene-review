  label: Neisseria meningitidis H44/76
description: LptD (Imp) is the outer-membrane LPS insertion component of Neisseria meningitidis H44/76.
  Its membrane barrel and periplasmic domain participate in delivery of lipopolysaccharide to the
  bacterial surface. Native imp deletion leaves residual LPS inaccessible to extracellular neuraminidase
  and an outer-membrane PagL reporter, despite viability in this LPS-loss-tolerant organism. LptD
  associates with LptE, which supports its abundance and biogenesis; LptE is not obligatory for detectable
  surface LPS delivery under the meningococcal conditions examined.
