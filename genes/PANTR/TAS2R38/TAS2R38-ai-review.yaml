    binding, and downstream Ca2+ signaling in actual taste receptor cells rather
    than a heterologous HEK293T reconstitution -- has not been directly
    established.
  boundary: >-
    The allele's high frequency in western chimpanzees (76% of sampled alleles),
    its near-absence in other subspecies, and its predicted truncation of the
    first 96 residues (removing much of the receptor's N-terminal/extracellular
    architecture) are well established by population genetics and by a
    heterologous calcium-imaging assay.
