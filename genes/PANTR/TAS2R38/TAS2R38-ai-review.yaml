- id: PMID:22916235
  title: Eco-geographical diversification of bitter taste receptor genes (TAS2Rs) among subspecies of chimpanzees (Pan troglodytes).
  findings:
  - statement: >-
      A loss-of-start-codon SNV in cTAS2R38 is unique to western chimpanzees, with
      strong west-east population differentiation (FST = 0.614).
    supporting_text: >-
      Derived alleles of the non-synonymous SNVs in cTAS2R41 and cTAS2R60 were
      present only in eastern chimpanzees (Figure 3B, 3D), whereas derived alleles
      of the loss-of-start SNV in cTAS2R38 were present only in western
      chimpanzees (Figure 3A
  - statement: >-
      The cTAS2R38 loss-of-start allele is the same variant functionally
      characterized by Wooding et al. as conferring PTC-tasting deficits.
    supporting_text: >-
      Wooding et al. [32] found that the loss-of-start variant of cTAS2R38
      confers recessively inherited inability to detect the bitterness of an
      artificial compound, phenylthiocarbamide (PTC), in vitro and in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified (PMC3420883), full text cached and read directly. This
      is the primary population-genetics source for the western-chimpanzee-specific
      cTAS2R38 loss-of-start allele and its FST=0.614 divergence, cited in place of
      the falcon deep-research summary that had originally sourced these claims.
      Note: the paper's own machine-extracted Table 1 (population allele
      frequencies per gene) is not reliably parseable from the cached markdown --
      row-to-gene-name alignment for cTAS2R38 vs. the neighboring cTAS2R40 row
      could not be independently confirmed from the extracted table text, so the
      specific 76%/9-of-92 frequency figures are sourced to Suzuki-Hashido et al.
      2015 (PMID:26201026) below, which restates the finding in prose citing this
      paper, rather than to this paper's own table.
- id: PMID:16612383
  title: Independent evolution of bitter-taste sensitivity in humans and chimpanzees.
  findings:
  - statement: >-
      Chimpanzee PTC-tasting variation is caused by a chimpanzee-specific mutation
      of the TAS2R38 initiation codon, producing a truncated, non-functional
      receptor via an alternative downstream start codon; this is molecularly
      independent of the human PAV/AVI polymorphism.
    supporting_text: >-
      a mutation of the initiation codon results in the use of an alternative
      downstream start codon and production of a truncated receptor variant that
      fails to respond to PTC in vitro
  - statement: >-
      Chimpanzee TAS2R38 genotype (of the initiation-codon variant) predicts
      taster status in living animals, not only in the heterologous assay.
    supporting_text: >-
      Association testing of PTC sensitivity in a cohort of captive chimpanzees
      confirmed that chimpanzee TAS2R38 genotype accurately predicts taster
      status in vivo.
  - statement: >-
      The molecular basis of PTC-taste variation arose independently in humans
      and chimpanzees.
    supporting_text: >-
      the molecular basis of this variation has arisen twice, independently, in
      the two species
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Cached record is abstract-only (no PMC full text), but the
      abstract itself directly states the functional/mechanistic claim (truncated,
      non-PTC-responsive receptor from an alternative downstream start codon) and
      the independent-origin claim used in this gene's description and core
      annotations; this is the founding functional study for the chimpanzee
      TAS2R38 start-loss variant, cited in place of the falcon deep-research
      summary that had originally sourced these claims.
- id: PMID:26201026
  title: Rapid expansion of phenylthiocarbamide non-tasters among Japanese macaques.
  findings:
  - statement: >-
      Restates, citing Hayakawa et al. 2012, that the chimpanzee TAS2R38
      non-taster (start-codon-mutant, ATG>AGG) allele was found in 76% of western
      chimpanzee individuals and was absent from eastern chimpanzees.
    supporting_text: >-
      Most phenotypic variation among humans is caused by three amino acid
      substitutions in TAS2R38, whereas for chimpanzees the observed variation
      results from a start codon mutation (ATG>AGG) in TAS2R38 [20,21]. ... in
      chimpanzees, the non-taster allele was found in only western chimpanzees
      (P. troglodytes verus) where it was present in 76% of individuals, while it
      was not found in eastern chimpanzees (P. troglodytes schweinfurthii) [19]
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified (PMC4511751), full text cached and read directly. This
      paper's own subject is Japanese macaque TAS2R38 (not chimpanzee) -- it is
      cited here only for its background-section restatement (citing ref [19],
      Hayakawa et al. 2012) of the chimpanzee ATG>AGG start-codon-mutation
      mechanism and the 76%-of-western-chimpanzees frequency figure, which is the
      only place this reviewer could verbatim-confirm that specific percentage
      (see the Hayakawa 2012 entry above for why its own table could not be used
      directly). Not the falcon-file-only citation flagged by PR review; replaced
      with this verified primary/secondary-source quote.
- id: file:PANTR/TAS2R38/TAS2R38-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report on chimpanzee TAS2R38 (UniProt Q697L5)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      AI-generated literature synthesis (not a primary source itself). Its cited
      primary literature (Hayakawa et al. 2012 PLoS ONE, PMID:22916235; Wooding
      et al. 2006 Nature, PMID:16612383; Suzuki-Hashido et al. 2015 PLoS ONE,
      PMID:26201026) is real and correctly attributed. Per PR review feedback,
      the load-bearing claims in this file (start-codon-loss mechanism, 76%
      western-chimpanzee frequency, FST=0.614, independent human/chimp origin,
      in vitro non-response) have since been re-sourced directly to those three
      now-cached PMIDs above with verbatim quotes; this falcon file is retained
      only for supporting claims not yet traced to a specific PMID (e.g. the
      HEK293T/Gα16gust44 assay-system description and knowledge-gap framing).
  findings:
  - statement: >-
      Chimpanzee studies designate this locus cTAS2R38, and the description "taste
      receptor type 2 member 38" and T2R GPCR family membership match the supplied
      gene symbol, species, accession, and InterPro domains -- there is no evidence
      of gene/paralog mis-identification.
    supporting_text: >-
      Chimpanzee studies explicitly designate this locus **cTAS2R38**, one of the
      TAS2R genes in *Pan troglodytes*. The description “taste receptor type 2
      member 38” and membership in the T2R GPCR family therefore agree with the
      supplied gene symbol, species, accession, and domains
  - statement: >-
      Chimpanzees show genetically determined bimodal sensitivity to PTC-class
      (N-C=S-bearing) bitter compounds, and TAS2R38 variation accounts for this.
    supporting_text: >-
      The strongest chimpanzee-specific assignment is detection of **PTC-class
      bitterness**. Chimpanzees display genetically determined bimodal sensitivity
      to compounds containing an N–C=S group, and mutations in chimpanzee TAS2R38
      account for this variation.
  - statement: >-
      A start-codon-loss ATG->AGG allele, which would force downstream translation
      initiation at Met97 and delete the first 96 residues, was found at 76%
      allele frequency in western chimpanzees but was essentially absent from
      central, eastern, and Nigeria-Cameroon chimpanzee populations sampled.
    supporting_text: >-
      In the 2012 subspecies survey, the start-loss allele occurred in **70 of 92
      western-chimpanzee alleles (76%)**. It was absent from the sampled eastern
      (0/20), central (0/4), and Nigerian–Cameroonian (0/2) alleles. West–east
      differentiation was high, with **FST = 0.614**, and the derived allele was
      restricted to western chimpanzees in that dataset
  - statement: >-
      Reduced PTC sensitivity evolved independently in humans and chimpanzees
      through different underlying mutations after the lineages split, so human
      TAS2R38 PAV/AVI haplotype information should not be transferred to the
      chimpanzee gene.
    supporting_text: >-
      Reduced PTC sensitivity evolved independently in humans and chimpanzees
      through different mutations after their lineages separated, so human TAS2R38
      haplotypes must not be transferred to Q697L5
  - statement: >-
      The canonical bitter-taste signal-transduction pathway for a functional T2R
      such as TAS2R38 is agonist binding -> gustducin/G-protein activation ->
      PLCbeta2 -> IP3-mediated ER Ca2+ release -> TRPM5 activation -> afferent
      transmitter release, though this full chain has not been directly
      demonstrated in native chimpanzee taste cells.
    supporting_text: >-
      bitter agonist → TAS2R38 activation → heterotrimeric G-protein signaling,
      commonly gustducin-associated → PLCβ2 activation → IP3 production → Ca²⁺
      release from endoplasmic-reticulum stores through IP3 receptors → TRPM5
      activation and membrane depolarization → transmitter output to gustatory
      afferents.
  - statement: >-
      A functional heterologous calcium-imaging assay (HEK293T cells, chimeric
      G-alpha16gust44, Fluo-4 imaging) was used to test chimpanzee TAS2R38
      constructs, including the start-codon-loss variant, supporting the
      interpretation that start-codon loss disrupts normal receptor function.
    supporting_text: >-
      Functional assays relevant to chimpanzee constructs used heterologous
      HEK293T cells, the chimeric G protein Gα16gust44, Fluo-4 calcium imaging at
      two-second intervals, and concentration–response modeling.
