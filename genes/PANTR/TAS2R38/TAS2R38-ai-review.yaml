    taste receptor evolution in this lineage.
  resolution: >-
    Native taste-cell physiology (e.g. single-cell calcium imaging or
    electrophysiology of circumvallate/foliate papilla taste cells from
    genotyped western versus eastern/central chimpanzees) or genotype-linked
    behavioral PTC-sensitivity testing.
