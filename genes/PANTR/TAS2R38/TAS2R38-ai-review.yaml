id: Q697L5
gene_symbol: TAS2R38
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9598
  label: Pan troglodytes
description: >-
  TAS2R38 (T2R38) encodes a class-T, seven-transmembrane G protein-coupled bitter
  taste receptor of the Pan troglodytes TAS2R (taste receptor type 2) family. It is
  a single-exon gene whose product is expected to reside in the plasma membrane of
  bitter-responsive taste receptor cells of the tongue, where it detects
  phenylthiocarbamide (PTC) and structurally related thiourea/thiocarbamide
  (N-C=S-bearing) bitter compounds, initiating gustducin-linked signaling: coupling
  to a heterotrimeric G protein, activation of phospholipase C-beta-2, IP3-mediated
  Ca2+ release from the endoplasmic reticulum, and TRPM5-dependent depolarization,
  culminating in neurotransmitter release onto gustatory afferents. As in humans,
  chimpanzee populations show genetically determined variation in PTC-type bitter
  sensitivity. A start-codon-loss allele (ATG to AGG) that would force downstream
  translation initiation at Met97 and delete the first 96 residues is common in
  western chimpanzee populations but essentially absent from central, eastern, and
  Nigeria-Cameroon populations, and this reduction in PTC sensitivity arose through
  mutations distinct from those underlying the analogous human PAV/AVI polymorphism,
  indicating independent evolutionary origins in the two lineages.
