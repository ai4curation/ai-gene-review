core_functions:
- description: >-
    Chimpanzee TAS2R38 functions as a class-T, seven-transmembrane G
    protein-coupled bitter taste receptor at the plasma membrane of oral taste
    receptor cells, where it detects phenylthiocarbamide (PTC) and related
    thiourea/thiocarbamide (N-C=S-bearing) bitter compounds and initiates
    gustducin-linked GPCR signal transduction leading to sensory perception of
    bitterness.
