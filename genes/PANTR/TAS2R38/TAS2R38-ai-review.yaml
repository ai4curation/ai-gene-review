    Do western chimpanzees homozygous for the ATG->AGG start-loss TAS2R38 allele
    show measurably reduced behavioral aversion to PTC/PROP-class compounds
    compared with eastern or central chimpanzees, paralleling the human
    taster/non-taster dichotomy?
