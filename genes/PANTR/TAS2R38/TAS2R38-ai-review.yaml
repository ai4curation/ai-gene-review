knowledge_gaps:
- gap_statement: >-
    The complete, native-cell functional consequence of the western-chimpanzee
    start-codon-loss (ATG->AGG) TAS2R38 allele -- surface trafficking, ligand
    binding, and downstream Ca2+ signaling in actual taste receptor cells rather
    than a heterologous HEK293T reconstitution -- has not been directly
    established.
  boundary: >-
    The allele's high frequency in western chimpanzees (76% of sampled alleles),
    its near-absence in other subspecies, and its predicted truncation of the
    first 96 residues (removing much of the receptor's N-terminal/extracellular
    architecture) are well established by population genetics and by a
    heterologous calcium-imaging assay.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Determines whether western chimpanzee populations carrying this allele are
    genuinely PTC/thiocarbamide-insensitive in vivo, which bears on hypotheses
    about diet, plant-toxin avoidance, and the selective forces shaping bitter
    taste receptor evolution in this lineage.
  resolution: >-
    Native taste-cell physiology (e.g. single-cell calcium imaging or
    electrophysiology of circumvallate/foliate papilla taste cells from
    genotyped western versus eastern/central chimpanzees) or genotype-linked
    behavioral PTC-sensitivity testing.
  provenance:
  - reference_id: file:PANTR/TAS2R38/TAS2R38-deep-research-falcon.md
    supporting_text: >-
      Native localization, complete signaling, natural ligand spectrum, and
      extraoral roles have not been directly established for chimpanzee Q697L5.
      These are orthology- or family-based annotations rather than
      chimpanzee-specific experimental findings.
- gap_statement: >-
    The ecologically relevant natural agonist spectrum of chimpanzee TAS2R38 is
    unresolved; PTC itself is an experimental probe rather than a demonstrated
    dietary ligand.
  boundary: >-
    PTC-class (N-C=S-bearing) sensitivity and its genetic basis are established;
    candidate natural ligands (thioamides, plant-derived isothiocyanates and
    glucosinolate breakdown products such as sinigrin, allyl isothiocyanate, and
    goitrin) are proposed by analogy to other primate TAS2R38 orthologs but have
    not been tested against the chimpanzee receptor.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Without a validated natural-ligand panel, links between TAS2R38 genotype and
    real dietary choice/plant-toxin avoidance in wild chimpanzees remain
    inferential.
  resolution: >-
    Heterologous dose-response pharmacology of chimpanzee TAS2R38 against a panel
    of candidate glucosinolate/isothiocyanate plant secondary metabolites known to
    occur in the chimpanzee diet.
  provenance:
  - reference_id: file:PANTR/TAS2R38/TAS2R38-deep-research-falcon.md
    supporting_text: >-
      PTC is an experimental probe rather than a demonstrated ecological ligand.
      Across primate TAS2R38 orthologs, recognized or candidate ligands include
      PTC, 6-n-propylthiouracil (PROP), sinigrin, allyl isothiocyanate, and
      goitrin.
suggested_questions:
- question: >-
    Do western chimpanzees homozygous for the ATG->AGG start-loss TAS2R38 allele
    show measurably reduced behavioral aversion to PTC/PROP-class compounds
    compared with eastern or central chimpanzees, paralleling the human
    taster/non-taster dichotomy?
  experts:
  - Takashi Hayakawa
  - Hiroo Imai
- question: >-
    What natural dietary compounds in the chimpanzee habitat, if any, are potent
    agonists of wild-type chimpanzee TAS2R38, and does the geographic
    distribution of the loss-of-function allele correlate with reduced exposure
    to or reduced need to detect such compounds?
  experts:
  - Takashi Hayakawa
  - Hiroo Imai
suggested_experiments:
- hypothesis: >-
    The western-chimpanzee ATG->AGG start-codon-loss TAS2R38 allele abolishes
    receptor function in native taste receptor cells, not only in the
    heterologous HEK293T/Gα16gust44 reconstitution system previously used.
  description: >-
    Isolate circumvallate/foliate taste papilla cells from genotyped western
    (AGG/AGG), heterozygous, and eastern/central (ATG/ATG) chimpanzees (or from
    primary taste-cell culture / organoid models where available) and measure
    PTC/PROP-evoked Ca2+ responses by single-cell calcium imaging, comparing
    response rate and magnitude across genotypes.
  experiment_type: Single-cell calcium imaging of primary taste receptor cells
- hypothesis: >-
    Wild-type chimpanzee TAS2R38 responds to plant-derived glucosinolate
    breakdown products present in the chimpanzee diet, not only to the synthetic
    probe compound PTC.
  description: >-
    Express wild-type chimpanzee TAS2R38 heterologously (e.g. HEK293T cells with
    a chimeric Gα16gust44 protein, as used for the start-codon-loss variant) and
    perform Fluo-4 calcium-imaging dose-response assays against a panel including
    PTC, PROP, sinigrin, allyl isothiocyanate, goitrin, and other candidate
    thiocarbamide-class plant secondary metabolites to establish a validated
    chimpanzee-specific ligand spectrum.
  experiment_type: Heterologous calcium-imaging pharmacology
