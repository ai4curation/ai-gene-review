- id: file:PANTR/TAS2R38/TAS2R38-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report on chimpanzee TAS2R38 (UniProt Q697L5)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      AI-generated literature synthesis (not a primary source itself), but its
      cited primary literature (Hayakawa et al. 2012 PLoS ONE; Wooding et al. 2006
      Nature; Suzuki-Hashido et al. 2015 PLoS ONE; Campbell et al. 2012 Mol Biol
      Evol; Meyerhof et al. 2011 Flavour Fragr J) is real, correctly attributed
      published work on chimpanzee/primate TAS2R38 and bitter-taste-receptor
      biology, and the report is appropriately explicit throughout about which
      claims are direct chimpanzee-specific findings versus family-level/orthology
      inference. These primary papers are not individually cached in
      publications/ (no chimp-TAS2R38-specific PMIDs were seeded from GOA for this
      gene), so this deep-research file is cited directly as the traceable source
      for the quotes used in this review rather than fabricating PMID citations
      that cannot be verified against a local cache.
  findings:
  - statement: >-
      Chimpanzee studies designate this locus cTAS2R38, and the description "taste
      receptor type 2 member 38" and T2R GPCR family membership match the supplied
      gene symbol, species, accession, and InterPro domains -- there is no evidence
      of gene/paralog mis-identification.
    supporting_text: >-
      Chimpanzee studies explicitly designate this locus **cTAS2R38**, one of the
      TAS2R genes in *Pan troglodytes*. The description “taste receptor type 2
      member 38” and membership in the T2R GPCR family therefore agree with the
      supplied gene symbol, species, accession, and domains
  - statement: >-
      Chimpanzees show genetically determined bimodal sensitivity to PTC-class
      (N-C=S-bearing) bitter compounds, and TAS2R38 variation accounts for this.
    supporting_text: >-
      The strongest chimpanzee-specific assignment is detection of **PTC-class
      bitterness**. Chimpanzees display genetically determined bimodal sensitivity
      to compounds containing an N–C=S group, and mutations in chimpanzee TAS2R38
      account for this variation.
  - statement: >-
      A start-codon-loss ATG->AGG allele, which would force downstream translation
      initiation at Met97 and delete the first 96 residues, was found at 76%
      allele frequency in western chimpanzees but was essentially absent from
      central, eastern, and Nigeria-Cameroon chimpanzee populations sampled.
    supporting_text: >-
      In the 2012 subspecies survey, the start-loss allele occurred in **70 of 92
      western-chimpanzee alleles (76%)**. It was absent from the sampled eastern
      (0/20), central (0/4), and Nigerian–Cameroonian (0/2) alleles. West–east
      differentiation was high, with **FST = 0.614**, and the derived allele was
      restricted to western chimpanzees in that dataset
  - statement: >-
      Reduced PTC sensitivity evolved independently in humans and chimpanzees
      through different underlying mutations after the lineages split, so human
      TAS2R38 PAV/AVI haplotype information should not be transferred to the
      chimpanzee gene.
    supporting_text: >-
      Reduced PTC sensitivity evolved independently in humans and chimpanzees
      through different mutations after their lineages separated, so human TAS2R38
      haplotypes must not be transferred to Q697L5
  - statement: >-
      The canonical bitter-taste signal-transduction pathway for a functional T2R
      such as TAS2R38 is agonist binding -> gustducin/G-protein activation ->
      PLCbeta2 -> IP3-mediated ER Ca2+ release -> TRPM5 activation -> afferent
      transmitter release, though this full chain has not been directly
      demonstrated in native chimpanzee taste cells.
    supporting_text: >-
      bitter agonist → TAS2R38 activation → heterotrimeric G-protein signaling,
      commonly gustducin-associated → PLCβ2 activation → IP3 production → Ca²⁺
      release from endoplasmic-reticulum stores through IP3 receptors → TRPM5
      activation and membrane depolarization → transmitter output to gustatory
      afferents.
  - statement: >-
      A functional heterologous calcium-imaging assay (HEK293T cells, chimeric
      G-alpha16gust44, Fluo-4 imaging) was used to test chimpanzee TAS2R38
      constructs, including the start-codon-loss variant, supporting the
      interpretation that start-codon loss disrupts normal receptor function.
    supporting_text: >-
      Functional assays relevant to chimpanzee constructs used heterologous
      HEK293T cells, the chimeric G protein Gα16gust44, Fluo-4 calcium imaging at
      two-second intervals, and concentration–response modeling.
