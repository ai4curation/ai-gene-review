suggested_questions:
- question: Are the differing product spectra reported for A. caldus TetH (thiosulfate and pentathionate)
    and A. ferrooxidans Tth (sulfur, thiosulfate, sulfate) real enzyme differences or a consequence
    of assay conditions and abiotic chemistry of the reactive intermediate?
- question: What is the quinoid compound detected in A. caldus TetH, given that the A. ferrooxidans
    enzyme is fully active after refolding without any cofactor?
