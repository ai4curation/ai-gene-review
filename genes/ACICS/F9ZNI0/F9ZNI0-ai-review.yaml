  title: Regulation of a novel Acidithiobacillus caldus gene cluster involved in metabolism of
    reduced inorganic sulfur compounds.
  findings:
  - statement: The A. caldus KU tetH gene encodes the purified tetrathionate hydrolase and is
      upregulated by tetrathionate, thiosulfate and pyrite.
    supporting_text: Western blot analysis also indicates upregulation of TetH in the presence
      of tetrathionate, thiosulfate, and pyrite.
  - statement: TetH carries a quinoid compound that is not PQQ.
    supporting_text: However, the fact that the TetH extract did not restore the function of the
      apo form of glucose dehydrogenase suggests that this cofactor is not PQQ.
  reference_review:
