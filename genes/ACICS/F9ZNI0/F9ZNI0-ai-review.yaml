  label: Acidithiobacillus caldus SM-1
description: >-
  Tetrathionate hydrolase TetH (locus Atc_1595) of the moderately thermophilic acidophilic
  sulfur oxidizer Acidithiobacillus caldus SM-1. The 503-residue precursor has a 24-residue Sec
  signal peptide and a PQQ-repeat beta-propeller fold, and is 99% identical to the TetH of
  A. caldus strain KU, a periplasmic homodimeric enzyme with an optimum near pH 3 and 40 degrees C
  that hydrolyses tetrathionate in the S4-intermediate (thiosulfate/tetrathionate) oxidation
  pathway. In A. caldus the tetH gene lies in an operon with the RsrS-RsrR two-component system
  and doxD, and is induced by tetrathionate, thiosulfate and pyrite. It shares 59% identity and the
  catalytic aspartate with the structurally characterised A. ferrooxidans enzyme.
existing_annotations:
- term:
    id: GO:0016828
    label: hydrolase activity, acting on sulfur-sulfur bonds
  evidence_type: ISS
  original_reference_id: PMID:17873067
  review:
    summary: >-
      Inferred from the 99%-identical, biochemically characterised TetH of A. caldus strain KU;
      tetrathionate hydrolysis has no specific GO term, so the S-S hydrolase parent is used.
    action: NEW
    reason: >-
      F9ZNI0 is the SM-1 ortholog of A. caldus KU TetH (ABP38225; 99.2% identity over the full
      length). The KU gene was matched to the purified tetrathionate hydrolase by N-terminal and
      internal peptide sequencing (PMID:17873067), and the mature F9ZNI0 chain after its predicted
      signal peptide begins with the same SITPVLQPGNPFDPDS N-terminal peptide. The purified KU
      enzyme hydrolyses tetrathionate (PMID:14717695). The catalytic Asp of the A. ferrooxidans
      enzyme is conserved (D323). See proposed tetrathionate hydrolase activity term in the
      B7J3C9 review.
    additional_reference_ids:
    - PMID:14717695
    supported_by:
    - reference_id: PMID:17873067
      supporting_text: Trypsin digestion and N-terminal sequencing of the tetrathionate hydrolase
        protein provided three peptide sequences (SITPVLQPGNPFDPDSPFARLYLPQNA, GVQWNFP, and GEIPGAVNTG)
        that were used to confirm the corresponding gene in the genome sequence of A.
    - reference_id: PMID:14717695
      supporting_text: Detected products of the tetrathionate hydrolase reaction were thiosulfate
        and pentathionate as confirmed by RP-HPLC analysis.
    - reference_id: file:ACIF2/tth/tth-bioinformatics/RESULTS.md
      supporting_text: 'F9ZNI0 vs ABP38225 (A. caldus KU TetH): 99.2% over 503 aligned.'
- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: ISS
  original_reference_id: PMID:14717695
  review:
    summary: >-
      The A. caldus KU ortholog was localised to the periplasm by differential fractionation;
      F9ZNI0 carries a predicted Sec signal peptide and no transmembrane segment.
    action: NEW
    reason: >-
      Two independent lines agree: the orthologous enzyme fractionates with the periplasm
      (PMID:14717695), and F9ZNI0 has a SignalP-predicted signal peptide whose predicted cleavage
      site matches the experimentally determined N-terminus of the mature KU enzyme. The acid pH
      optimum also requires a location outside the cytoplasm. Note that the A. ferrooxidans and
      A. thiooxidans SH enzymes are outer-membrane associated, so localization varies within the
      family; for A. caldus the periplasmic assignment is the experimentally supported one.
    supported_by:
    - reference_id: PMID:14717695
      supporting_text: The periplasmic localization of the enzyme was determined by differential
        fractionation of A. caldus cells.
    - reference_id: file:ACICS/F9ZNI0/F9ZNI0-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: SIGNAL          1..24
