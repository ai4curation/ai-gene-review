id: F9ZQD6
gene_symbol: Atc_1705
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:990288
  label: Acidithiobacillus caldus SM-1
description: >-
  Atc_1705 (F9ZQD6) of Acidithiobacillus caldus is a putative FAD-dependent
  sulfide:quinone oxidoreductase (SQR). It is a close ortholog (87.6%
  identity) of the biochemically and structurally characterized Type I SQR of
  Acidithiobacillus ferrooxidans (AFE_1792, B7JBP8), and it conserves that
  enzyme's three active-site cysteines (Cys128, Cys160 and Cys356 in AFE_1792
  numbering). By homology it is expected to oxidize hydrogen sulfide to
  polysulfide or elemental sulfur on the cytoplasmic membrane and to pass the
  electrons through FAD to the respiratory quinone pool. The high identity and
  the conserved cysteine triad make SQR activity a strong orthology inference,
  although the protein itself has not been purified or assayed. A. caldus SM-1
  encodes several further SQR-family paralogs (for example Atc_1437, Atc_2423
  and Atc_2601), so which copy dominates sulfide oxidation in cells is not
  settled.
