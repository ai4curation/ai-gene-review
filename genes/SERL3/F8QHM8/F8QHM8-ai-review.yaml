taxon:
  id: NCBITaxon:936435
  label: Serpula lacrymans var. lacrymans S7.3
description: 'Pyruvate carboxylase of the dry-rot (brown-rot) basidiomycete Serpula lacrymans var. lacrymans
  strain S7.3, the single pyruvate carboxylase encoded in its reference proteome. It is a 1198-residue
  single-chain biotin-dependent carboxylase (PANTHER PTHR43778, NCBIfam TIGR01235, PIRSF001594) with the
  canonical fungal domain order: an N-terminal biotin carboxylation domain with an ATP-grasp subdomain,
  a pyruvate carboxyltransferase (HMGL-like) domain with Mn(2+)-binding residues and a carboxylated lysine,
  a PYC_OADA allosteric/tetramerization region, and a C-terminal biotinyl domain whose lysine is predicted
  to carry biotin. By family membership it is inferred to carboxylate pyruvate to oxaloacetate in two
  ATP- and biotin-dependent half-reactions, supplying oxaloacetate anaplerotically and for gluconeogenesis
  from pyruvate. Fungal pyruvate carboxylases studied so far are cytosolic. Brown-rot fungi secrete oxalic
  acid made largely by hydrolysis of oxaloacetate, so this enzyme is a plausible oxaloacetate source for
  oxalate, but that role has not been tested in S. lacrymans. The protein has not been characterized experimentally.'
