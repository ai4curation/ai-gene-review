  - PANTHER:PTN001050939
  review:
    summary: Cytoplasm from TreeGrafter (PANTHER PTN001050939), descending from the PAINT fungal node
      that asserts cytosol.
    action: ACCEPT
    reason: 'PAINT placed cytosol at PTN001050931, a node at the Fungi level (taxon:4751), seeded by S.
      cerevisiae Pyc1p/Pyc2p and Aspergillus nidulans PycA. This basidiomycete protein falls inside that
      clade, so the cytoplasm row is a coarser restatement of a sound phylogenetic inference. Caveats:
      there is no localization data for any basidiomycete pyruvate carboxylase, and a classical yeast
      study described cytosolic PC as unusual among fungi. The protein also has an N-terminal extension
      of about 25-30 residues beyond the yeast start, predicted disordered (MobiDB-lite). No targeting
      peptide is annotated, and this single sequence feature does not justify a mitochondrial call. Accepted
      at the cytoplasm level, with localization flagged as a question.'
