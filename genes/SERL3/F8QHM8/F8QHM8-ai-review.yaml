aliases:
- Pyruvate carboxylase
core_functions:
- description: Biotin- and ATP-dependent carboxylation of pyruvate to oxaloacetate (EC 6.4.1.1), inferred
    from family membership. It supplies oxaloacetate for anaplerosis and the entry step of gluconeogenesis
    from pyruvate; it is a candidate source of the oxaloacetate that brown-rot fungi hydrolyse to oxalic
    acid (untested).
  molecular_function:
    id: GO:0004736
    label: pyruvate carboxylase activity
  directly_involved_in:
  - id: GO:0006094
    label: gluconeogenesis
  supported_by:
  - *id002
  - *id001
  - *id004
suggested_questions:
- question: Is this basidiomycete pyruvate carboxylase cytosolic like the ascomycete and yeast enzymes,
    or does its N-terminal extension target it to mitochondria, which would change how oxaloacetate reaches
    the cytosolic oxaloacetase that makes oxalate?
suggested_experiments:
- description: Measure pyruvate carboxylase activity and its subcellular distribution (fractionation with
    mitochondrial and cytosolic markers) in oxalate-producing mycelium, and test whether PC deletion or
    knockdown lowers oxalate secretion.
