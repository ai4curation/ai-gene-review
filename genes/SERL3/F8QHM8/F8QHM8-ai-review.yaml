  title: A physiological role for oxalic acid biosynthesis in the wood-rotting basidiomycete Fomitopsis
    palustris.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. Brown-rot oxalate is made mainly by oxaloacetate hydrolysis, fed by
      coupled TCA/glyoxylate cycles and malate oxidation. Pyruvate carboxylase is not measured or discussed,
      so the paper gives pathway context only, not support for this enzyme.
  findings:
