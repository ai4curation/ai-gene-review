core_functions:
- description: >-
    CdvB polymerizes, after recruitment by CdvA, into the first ESCRT-III ring at the
    mid-cell division site. This ring is the structural template on which the CdvB1 and
    CdvB2 polymers assemble into a composite division ring, and it holds that ring
    unconstricted. Vps4/CdvC-dependent removal and proteasomal degradation of CdvB then
    release CdvB1:CdvB2 to constrict and divide the cell.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0061639
    label: Cdv-dependent cytokinesis
  locations:
  - id: GO:0032153
    label: cell division site
  in_complex:
    id: GO:0000815
    label: ESCRT III complex
