id: Q4J924
gene_symbol: cdvB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330779
  label: Sulfolobus acidocaldarius DSM 639
description: >-
  CdvB (Saci_1373) is the founding ESCRT-III homolog of the Cdv cell division
  machinery of the crenarchaeon Sulfolobus acidocaldarius, encoded in the
  cdvA-cdvB-cdvC operon together with the membrane-binding CdvA and the Vps4-like
  AAA+ ATPase CdvC. It is a 261-residue protein with a canonical ESCRT-III core, a
  short N-terminal amphipathic helix, a C-terminal MIT-interacting motif (residues
  183-193) that binds the MIT domain of CdvC/Vps4, and a C-terminal winged-helix-like
  domain that binds CdvA. CdvB is expressed at the onset of division and, recruited by
  CdvA, assembles into a single narrow polymeric ring at the mid-cell division plane
  between the segregated nucleoids. This ring acts as a template on which the ESCRT-III
  paralogs CdvB1 and CdvB2 assemble into a composite division ring, while holding that
  ring in a non-constricted state. Division is then triggered when CdvB is removed from
  the ring by Vps4/CdvC and degraded by the PAN-20S proteasome, a step that depends on
  its C-terminal broken-winged helix and lets the CdvB1:CdvB2 polymers constrict and cut
  the cell in two. CdvB is essential in S. acidocaldarius.
existing_annotations:
- term:
    id: GO:0009295
    label: nucleoid
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0187
  review:
    summary: >-
      Electronic mapping of the UniProt subcellular-location line "Cytoplasm,
      nucleoid" (SL-0187) for CdvB. The experimental observations behind that line
      (PMID:18987308, PMID:19008417) place CdvB in a band or ring between the two
      segregating nucleoids at the site of membrane ingression, i.e. at the mid-cell
      division plane, not within the nucleoid.
    action: MODIFY
    reason: >-
      The localization claim is wrong as encoded. The UniProt note itself says CdvB
      forms band-like structures between segregating nucleoids and localizes to the
      mid-cell in dividing cells; the controlled SubCell value "nucleoid" mis-encodes
      "between nucleoids", and the GO_REF:0000044 mapping propagated that to
      GO:0009295. Immunostaining and super-resolution imaging show a single narrow
      CdvB ring at the cell centre, correlating with the site of membrane ingression
      (PMID:19008417, PMID:36921039). The correct location is the division plane,
      GO:0032153 cell division site. This is a lateral correction, not a refinement,
      so the replacement is not a descendant of nucleoid.
    proposed_replacement_terms:
    - id: GO:0032153
      label: cell division site
    additional_reference_ids:
    - PMID:19008417
    - PMID:36921039
    - PMID:18987308
    supported_by:
    - reference_id: file:SULAC/cdvB/cdvB-uniprot.txt
      supporting_text: Forms, with CdvA, colocalized band-like structures between segregating nucleoids
    - reference_id: file:SULAC/cdvB/cdvB-uniprot.txt
      supporting_text: Localizes to the mid-cell in dividing cells
    - reference_id: PMID:19008417
      supporting_text: a band or belt of Saci1373 (ESCRT-III) was detected between the
        two nucleoids, correlating with the site of membrane ingression
    - reference_id: PMID:36921039
      supporting_text: CdvB was found to localize into a single narrow ring positioned
        at the center of control cells
- term:
    id: GO:0061639
    label: Cdv-dependent cytokinesis
  evidence_type: IDA
  original_reference_id: PMID:32764038
  review:
    summary: >-
      CdvB is the first ESCRT-III protein to assemble at the division site, forms the
      ring that templates the assembly of the contractile CdvB1:CdvB2 copolymer, and
      its Vps4-dependent removal and proteasomal degradation trigger ring constriction
      and cell division. The gene is essential.
    action: NEW
    reason: >-
      GO:0061639 was created for exactly this machinery (its definition names the Cdv
      proteins), and the parent GO:0000910 cytokinesis states that prokaryotes should
      be annotated to FtsZ-dependent or Cdv-dependent cytokinesis rather than to the
      parent. Participation test: CdvB does part of the work of the process as the
      structural template/scaffold of the division ring (CdvB1 and CdvB2 do not form
      division polymers without it), not merely as a proteasome substrate. Comparator
      check (QuickGO, 2026-10-15): GO:0061639 has no annotations to any gene product,
      so no other Cdv protein (CdvA, CdvC, CdvB1, CdvB2) carries it either; since the
      term was coined for these proteins, the absence reflects missing experimental
      curation of archaeal Cdv proteins rather than a convention against annotating
      them. Evidence is direct: localization to the division ring, ring templating and
      the degradation-triggered constriction (PMID:32764038, PMID:36921039,
      PMID:19008417).
    additional_reference_ids:
    - PMID:36921039
    - PMID:19008417
    - PMID:41514146
    supported_by:
    - reference_id: PMID:32764038
      supporting_text: CdvB both templates the assembly of a contractile ESCRT-III
        copolymer, composed of the paralogs CdvB1 (Saci_0451) and CdvB2 (Saci_1416),
        and prevents their constriction
    - reference_id: PMID:32764038
      supporting_text: The absence of large polymeric CdvB1:CdvB2 structures in these
        early G1 cells implies that CdvB1 and CdvB2 do not form de novo ESCRT-III
        filaments without a CdvB template.
    - reference_id: PMID:32764038
      supporting_text: Previous studies have suggested that CdvB, an essential gene in
        S. acidocaldarius, is actively required for division
    - reference_id: PMID:19008417
      supporting_text: The highly specific localisation of these proteins to the
        mid-cell in dividing cells suggested a role in cell division-related processes.
    - reference_id: PMID:41514146
      supporting_text: The loss of CdvB from the division ring frees CdvB1/B2 polymers
        to constrict and drive cytokinesis
- term:
    id: GO:0000815
    label: ESCRT III complex
  evidence_type: IDA
  original_reference_id: PMID:36921039
  review:
    summary: >-
      CdvB is a bona fide ESCRT-III fold protein that co-assembles with its paralogs
      CdvB1 and CdvB2 into a patterned composite ESCRT-III division ring, which is
      disassembled stepwise by Vps4/CdvC.
    action: NEW
    reason: >-
      The GO:0000815 definition is not endosome-specific: it describes a membrane
      remodelling/scission complex acting in several processes including cytokinetic
      abscission, so it applies to the archaeal ESCRT-III division polymer without
      importing eukaryotic compartment semantics. Structural (PMID:41543908) and
      imaging (PMID:36921039, PMID:32764038) data show CdvB is an ESCRT-III protein
      that forms a composite polymer with CdvB1 and CdvB2 and is a Vps4 substrate
      within it. This is a component annotation, distinct from the
      endosome/MVB/vacuole process terms that should not be transferred to archaea.
    additional_reference_ids:
    - PMID:41543908
    - PMID:32764038
    supported_by:
    - reference_id: PMID:36921039
      supporting_text: CdvB, CdvB1, and CdvB2 assemble at spatially distinct positions
        relative to one another at the cell midzone to generate a prepatterned composite
        division ring
    - reference_id: PMID:36921039
      supporting_text: This is consistent with the notion that MIM2-dependent removal
        of CdvB from the ESCRT-III copolymer ring by Vps4 is a prerequisite for its
        subsequent proteasomal degradation
    - reference_id: PMID:41543908
      supporting_text: Monomeric CdvB adopts the canonical ESCRT-III fold in both a
        closed and a distinct
- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:32764038
  review:
    summary: >-
      CdvB polymerizes into the ring that serves as the structural template for
      assembly of the CdvB1:CdvB2 contractile copolymer.
    action: NEW
    reason: >-
      CdvB has no enzymatic activity; its molecular contribution is structural. It
      forms the first ESCRT-III polymer at the division site and CdvB1/CdvB2 do not
      form division polymers without it (PMID:32764038). No more specific GO molecular
      function captures "template for a contractile polymer" (GO:0140489 molecular
      template activity refers to copying shape or sequence and does not fit).
      GO:0180020 membrane bending activity is not proposed because CdvB alone did not
      deform liposomes (PMID:21255729) and constriction in vivo is performed by CdvB1
      and CdvB2.
    supported_by:
    - reference_id: PMID:32764038
      supporting_text: The absence of large polymeric CdvB1:CdvB2 structures in these
        early G1 cells implies that CdvB1 and CdvB2 do not form de novo ESCRT-III
        filaments without a CdvB template.
    - reference_id: PMID:21255729
      supporting_text: In contrast, when ESCRT-III is added on its own, no substantial
        deformation of the liposomes is observed.
