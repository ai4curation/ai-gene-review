    supporting_text: CdvB both templates the assembly of a contractile ESCRT-III copolymer,
      composed of the paralogs CdvB1 (Saci_0451) and CdvB2 (Saci_1416), and prevents
      their constriction
  - reference_id: PMID:36921039
    supporting_text: CdvB was found to localize into a single narrow ring positioned
      at the center of control cells
  - reference_id: PMID:41514146
    supporting_text: The loss of CdvB from the division ring frees CdvB1/B2 polymers
      to constrict and drive cytokinesis
suggested_questions:
- question: Does CdvB bind archaeal membranes on its own (N-terminal amphipathic helix,
    PMID:41543908) or only when recruited by CdvA (PMID:21255729), and does the answer
    differ between monomer and polymer?
- question: Should GO capture CdvB's role of holding the CdvB1:CdvB2 ring in a non-constricted
    state until its degradation (a negative regulatory role within Cdv-dependent cytokinesis),
    or is it adequately covered by participation in the process?
- question: Should the InterPro2GO mapping of IPR005024 (Snf7 family) to GO:0007034
    vacuolar transport be taxon-restricted to Eukaryota, given that it is applied to
    dozens of archaeal ESCRT-III/CdvB homologs in cells with no vacuole?
suggested_experiments:
- description: Liposome co-sedimentation of CdvB and CdvB lacking its N-terminal amphipathic
    helix, with and without CdvA, in the same buffer and lipid conditions, to resolve
    the conflicting membrane-binding results.
  experiment_type: in vitro reconstitution
- description: Express a non-degradable but Vps4-extractable CdvB variant in S. acidocaldarius
    and image the CdvB1/CdvB2 rings, to separate the roles of Vps4 extraction and proteasomal
    degradation in triggering constriction.
  experiment_type: live-cell imaging of mutant strains
