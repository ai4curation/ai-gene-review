id: Q03548
gene_symbol: eaf
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Protein EaF of Salmonella phage P22 is a 119-amino-acid early accessory protein encoded in the non-essential
  ea region between int and erf, detected by SDS-PAGE in UV-irradiated host cells infected with P22. It contains a conserved
  DUF5448 domain (IPR020379 / PF17526), and its specific biochemical and physiological function during phage infection remains
  unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:8412679
  title: The int genes of bacteriophages P22 and lambda are regulated by different mechanisms.
  findings:
  - statement: A 3.3-kb DNA sequence between the P22 pL promoter and the int gene is densely packed with genes whose predicted
      products correlate with the early proteins mapped by Youderian and Susskind in 1980.
    supporting_text: We have also determined the DNA sequence of a 3.3 kb segment that closes the gap between previously reported
      sequences to give a continuous sequence between the P22 pL promoter and the int gene. The newly determined sequence
      is densely packed with genes from the pL direction, and the proteins predicted by the sequence show excellent correlation
      with the proteins mapped by Youderian and Susskind in 1980.
- id: PMID:18621868
  title: Bacteriophage P22 and Staphylococcus aureus attenuation on nonporous fomites as determined by plate assay and quantitative
    PCR.
  findings:
  - statement: Whole-genome sequence accession AB362338 of bacteriophage P22 was determined and used for quantitative PCR
      assay design.
    supporting_text: Primers and a TaqMan probe for P22 detection were designed using the Primer Express 2.0 software program
      (Applied Biosystems, Foster City, CA) with the whole-genome sequence of the bacteriophage P22 strain used in this study
      (accession number AB362338 ) (Table 1 ).
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Reanalysis of the complete P22 genome identified 65 open reading frames, updating the positions of previously
      identified ORFs.
    supporting_text: Many of the P22 ORFs were previously identified ( 48 ). We reanalyzed the sequence data, updating the
      positions of the previously identified ORFs and making limited corrections.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Resequencing of the bacteriophage P22 genome established an accurate reference genome sequence correcting a
      0.14% error rate in prior sequences.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
suggested_questions:
- question: What is the structural fold and biological target of the DUF5448 (PF17526) domain in P22 EaF?
suggested_experiments:
- description: Determine the structure of recombinant P22 EaF by X-ray crystallography or NMR and perform affinity purification-mass
    spectrometry in Salmonella enterica to identify host or phage binding partners.
  hypothesis: EaF adopts a compact fold typical of early phage host-takeover or anti-defense factors and interacts with a
    specific host protein complex.
status: COMPLETE
