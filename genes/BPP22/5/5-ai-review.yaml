- description: Forms the structural subunit of the precursor viral procapsid and mature T=7 laevo icosahedral viral capsid
    (415 copies), undergoing coordinated domain rearrangements and hexon symmetrization during DNA packaging to drive viral
    procapsid maturation and encapsulate the viral genome.
