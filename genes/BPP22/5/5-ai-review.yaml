  label: Lederbergvirus P22
description: Major capsid protein (gp5) of Salmonella phage P22 that assembles into the T=7 laevo icosahedral procapsid shell
  (415 subunits arranged as 60 hexons and 11 pentons) around the scaffolding protein (gp8) core and single portal vertex (gp1).
  It adopts an HK97-like core fold augmented by an inserted 124-residue telokin-like immunoglobulin domain (I-domain) whose
  D-loops staple adjacent capsomers across 2-fold axes, and undergoes a major conformational expansion during viral DNA packaging
  to form the stable mature virion capsid without chemical crosslinks or cementing proteins.
