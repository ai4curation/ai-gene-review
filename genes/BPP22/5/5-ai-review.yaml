suggested_questions:
- question: What is the exact mechanical trigger—electrostatic repulsion from packaged dsDNA, physical displacement of the
    gp8 N-arm contact, or portal vertex conformational strain—that initiates the cooperative wave of gp5 spine-helix straightening
    during procapsid expansion?
  experts:
  - Carolyn M. Teschke
  - Wah Chiu
suggested_experiments:
- description: Perform time-resolved cryo-EM of P22 procapsids undergoing DNA-packaging-triggered or heat-triggered expansion
    to capture intermediate conformations of the gp5 spine helix, N-arm, and I-domain D-loop.
  hypothesis: Expansion nucleates at the portal-adjacent hexons upon release of the gp8 C-terminal helix-loop-helix from the
    gp5 N-arm and propagates across icosahedral 2-fold axes through the I-domain D-loop staples.
