references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:15784254
  title: Domain study of bacteriophage p22 coat protein and characterization of the capsid lattice transformation by hydrogen/deuterium
    exchange.
  findings:
  - statement: The P22 procapsid is assembled from coat protein gp5 with scaffolding protein gp8 and undergoes lattice expansion
      and N-terminal domain stabilization during maturation into the mature virion capsid.
    supporting_text: The P22 procapsid, which is the viral capsid precursor, is assembled from coat protein with the aid of
      scaffolding protein. Upon DNA packaging, the capsid lattice expands and becomes a stable virion.
  - statement: The C-terminal domain of gp5 forms a non-covalent dimer in solution while the N-terminal domain and interdomain
      loop become stabilized upon procapsid maturation.
    supporting_text: The N-terminal domain, which is made up of 190 amino acid residues, is largely unstructured in solution,
      while the C-terminal domain, which consists of 239 amino acid residues, forms a stable non-covalent dimer.
- id: PMID:16698545
  title: Highly discriminatory binding of capsid-cementing proteins in bacteriophage L.
  findings:
  - statement: Cryo-EM of closely related phage L reveals how homotrimeric Dec cementing proteins discriminate quasi-equivalent
      sites on the T=7 coat protein lattice, which in P22 is stable without Dec.
    supporting_text: The three-dimensional structure of bacteriophage L determined by electron cryo-microscopy reveals binding
      modes of two cementing proteins-one, called Dec, encoded by phage gene orf134 and the other by an as yet unidentified
      gene.
- id: PMID:20223221
  title: 'P22 coat protein structures reveal a novel mechanism for capsid maturation: stability without auxiliary proteins
    or chemical crosslinks.'
  findings:
  - statement: Pseudoatomic models of P22 coat protein before and after maturation show an HK97-like core with an inserted
      telokin-like Ig domain (I-domain) and stabilization via N-terminal helices and P-loops without crosslinks or cementing
      proteins.
    supporting_text: P22 capsid stabilization results from intersubunit interactions among N-terminal helices and an extensive
      "P loop," which obviate the need for crosslinks or auxiliary proteins. P22 CP also has a telokin-like Ig domain that
      likely stabilizes the monomer fold so that assembly may proceed via individual subunit addition rather than via preformed
      capsomers as occurs in HK97.
- id: PMID:21220301
  title: Structural basis for scaffolding-mediated assembly and maturation of a dsDNA virus.
  findings:
  - statement: Cryo-EM structures at 3.8 Å (procapsid) and 4.0 Å (mature virion) reveal how gp5 interacts with gp8 via its
      N-arm in the procapsid and undergoes coordinated conformational changes during maturation on a T=7 icosahedral lattice.
    supporting_text: The procapsid structures show the scaffolding protein interacting electrostatically with the N terminus
      (N arm) of the coat protein through its C-terminal helix-loop-helix motif, as well as unexpected interactions between
      10 scaffolding proteins and the 12-fold portal located at a unique vertex. These suggest a critical role for the scaffolding
      proteins both in initiating the capsid assembly at the portal vertex and propagating its growth on a T = 7 icosahedral
      lattice.
- id: PMID:26269173
  title: 'A Molecular Staple: D-Loops in the I Domain of Bacteriophage P22 Coat Protein Make Important Intercapsomer Contacts
    Required for Procapsid Assembly.'
  findings:
  - statement: The D-loops of the inserted I-domain in gp5 make intercapsomer contacts across the icosahedral 2-fold axis
      that are essential for proper procapsid assembly and capsid stability.
    supporting_text: Using disulfide cross-linking, we showed that the tips of the D-loops are positioned directly across
      from each other both in the procapsid and the mature virion, suggesting their importance in both states. Our results
      indicate that D-loop interactions act as "molecular staples" at the icosahedral 2-fold symmetry axis and significantly
      contribute to stabilizing the P22 capsid for DNA packaging.
- id: PMID:28270620
  title: Accurate model annotation of a near-atomic resolution cryo-EM map.
  findings:
  - statement: A 3.3 Å cryo-EM reconstruction of the mature P22 capsid defines the intersubunit interactions of gp5 that stabilize
      the T=7 icosahedral shell without cementing proteins or cross-linking.
    supporting_text: We applied this protocol to the 3.3-Å map of the mature P22 bacteriophage capsid, a large and complex
      macromolecular assembly. With this protocol, we identify and annotate previously undescribed molecular interactions
      between capsid subunits that are crucial to maintain stability in the absence of cementing proteins or cross-linking,
      as occur in other bacteriophages.
- id: PMID:36851569
  title: Assembly and Capsid Expansion Mechanism of Bacteriophage P22 Revealed by High-Resolution Cryo-EM Structures.
  findings:
  - statement: High-resolution cryo-EM structures of the P22 procapsid (2.6 Å) and mature capsid (3.0 Å) resolve the salt
      bridges and conformational rearrangements of gp5 that close the local 6-fold hexon opening during capsid maturation.
    supporting_text: Our structures reveal hydrogen bonds and salt bridges between the gp5 subunits in the procapsid and the
      conformational changes of the gp5 domains involved in the closure of the local sixfold opening and a thinner capsid
      shell during capsid maturation.
