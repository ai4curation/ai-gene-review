  - UniProtKB-KW:KW-0238
  review:
    summary: Two Arc homodimers bind cooperatively to a 21-bp operator site at Pant, using an antiparallel beta-sheet to recognize
      bases in the DNA major groove.
    action: ACCEPT
    reason: Direct sequence-specific DNA binding by P22 Arc is established at atomic resolution by the 2.6 A X-ray co-crystal
      structure of the Arc tetramer-operator complex (PMID:8107872).
    supported_by:
    - reference_id: PMID:8107872
      supporting_text: Transcription of the ant gene during lytic growth of bacteriophage P22 (ref. 1) is regulated by the
        cooperative binding of two Arc repressor dimers to a 21-base-pair operator site. Here we report the co-crystal structure
        of this Arc tetramer-operator complex at 2.6 A resolution.
    - reference_id: PMID:8107872
      supporting_text: each Arc dimer uses an antiparallel beta-sheet to recognize bases in the major groove.
