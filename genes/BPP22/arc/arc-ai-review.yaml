suggested_questions:
- question: How does the proteolytic turnover of Arc in vivo shape the transient pulse of Ant antirepressor synthesis immediately
    after infection?
  experts:
  - Robert T. Sauer
  - Carl O. Pabo
suggested_experiments:
- description: Single-cell time-lapse fluorescence microscopy tracking P22 Pant promoter activity and Arc protein levels during
    early lytic vs. lysogenic infections of Salmonella Typhimurium.
  hypothesis: Rapid cooperative operator occupancy by newly synthesized Arc dimers terminates the early Pant transcriptional
    burst within minutes of infection, preventing excessive Ant accumulation that would otherwise destabilize lysogeny.
