id: P03050
gene_symbol: arc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Ribbon-helix-helix transcriptional repressor (Arc) of the Salmonella phage P22 immI region that negatively regulates
  its own synthesis and that of the Ant antirepressor during lytic growth by cooperative binding of two homodimers (forming
  a DNA-bound homotetramer) to a 21-bp operator at the Pant promoter via an antiparallel beta-sheet DNA-recognition motif.
