  title: Primary structure of the immI immunity region of bacteriophage P22.
  findings:
  - statement: Sequenced the P22 immI region and established that Arc and Mnt negatively regulate antirepressor synthesis
      from Pant.
    supporting_text: This region includes the ant gene, which encodes the P22 antirepressor protein, and the mnt and arc genes,
      which encode proteins that negatively regulate antirepressor synthesis.
- id: PMID:2377232
  title: 'Structure of Arc repressor in solution: evidence for a family of beta-sheet DNA-binding proteins.'
  findings:
  - statement: Determined the NMR solution structure of the P22 Arc homodimer, revealing an intertwined dimer with an antiparallel
      beta-sheet formed by residues 8-14 of each monomer.
    supporting_text: It shows a strongly intertwined dimer, in which residues 8-14 of different monomers form an antiparallel
      beta-sheet.
- id: PMID:8107872
  title: DNA recognition by beta-sheets in the Arc repressor-operator crystal structure.
  findings:
  - statement: Solved the 2.6 A crystal structure of the Arc tetramer-operator DNA complex, showing how two RHH dimers bind
      adjacent subsites via their antiparallel beta-sheets.
    supporting_text: Transcription of the ant gene during lytic growth of bacteriophage P22 (ref. 1) is regulated by the cooperative
      binding of two Arc repressor dimers to a 21-base-pair operator site. Here we report the co-crystal structure of this
      Arc tetramer-operator complex at 2.6 A resolution.
- id: PMID:9927650
  title: 'Origins of DNA-binding specificity: role of protein contacts with the DNA backbone.'
  findings:
  - statement: Characterized the energetic contributions of beta-sheet and N-terminal arm residues of the Arc RHH dimer to
      DNA subsite recognition.
    supporting_text: Arc is a small, homodimeric repressor of the ribbon–helix–helix family of transcription factors ( 1 ).
      In the cocrystal structure, Arc dimers bind to adjacent subsites of a 21-bp operator, and the β-sheet and N-terminal
      arms of an Arc dimer are positioned to contact a DNA subsite ( 2 ).
