- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: True in essence, but should be refined to the specific descendant term GO:0039693 (viral DNA genome replication).
    action: MODIFY
    reason: Bacteriophage P22 gp12 is the phage-encoded DnaB-family replicative helicase that unwinds the viral genome during
      lytic phage P22 DNA replication, rendering P22 replication independent of host DnaB. Replacing GO:0006260 with GO:0039693
      (viral DNA genome replication) captures its specific viral process and maintains consistency with the partner replication
      initiator gp18.
    proposed_replacement_terms:
    - id: GO:0039693
      label: viral DNA genome replication
    supported_by:
    - reference_id: PMID:6241581
      supporting_text: Gene 12 is nonhomologous to its lambda counterpart (gene P), but closely related to dnaB of Escherichia
        coli.
    - reference_id: PMID:11053393
      supporting_text: In lytic development, DNA replication is initiated from an origin (Ori) located within gene 18 ( 7
        ) in a region which shows superficial similarity to that of coliphage λ (gpO-gpP) with the exception that P22 contains
        a primase (gp18) and a helicase (gp12) ( 33 ).
    - reference_id: file:genes/BPP22/12/12-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Renders P22 DNA replication independent of a functional dnaB ... gene of the host.'
