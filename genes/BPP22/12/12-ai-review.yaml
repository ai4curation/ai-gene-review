    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Valid annotation reflecting DNA binding by the replicative helicase at the replication fork.
    action: ACCEPT
    reason: As a DnaB-like replicative helicase, gp12 directly binds DNA at the replication fork during translocation and
      duplex unwinding (note that in GO, 5'-3' DNA helicase activity is not an is_a descendant of DNA binding, so retaining
      GO:0003677 is informative).
    supported_by:
    - reference_id: file:genes/BPP22/12/12-uniprot.txt
