- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Phage P22 encodes its own replicative helicase gp12 that acts with the origin-binding protein gp18 to initiate
      lytic DNA replication.
    supporting_text: In lytic development, DNA replication is initiated from an origin (Ori) located within gene 18 ( 7 )
      in a region which shows superficial similarity to that of coliphage λ (gpO-gpP) with the exception that P22 contains
      a primase (gp18) and a helicase (gp12) ( 33 ).
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: PMID:6241581
  title: Sequence analysis of a region from the early right operon in phage P22 including the replication genes 18 and 12.
  findings:
  - statement: Gene 12 of phage P22 is closely related in sequence to Escherichia coli dnaB rather than to coliphage lambda
      gene P.
    supporting_text: Gene 12 is nonhomologous to its lambda counterpart (gene P), but closely related to dnaB of Escherichia
      coli.
- id: file:genes/BPP22/12/12-uniprot.txt
  title: UniProt:P03006 (VG12_BPP22)
  findings:
  - statement: gp12 belongs to the DnaB helicase subfamily and renders P22 DNA replication independent of host dnaB.
    supporting_text: 'CC   -!- FUNCTION: Renders P22 DNA replication independent of a functional dnaB ... gene of the host.'
  - statement: gp12 couples ATP hydrolysis with 5'-3' DNA unwinding at the replication fork.
    supporting_text: "CC       Reaction=Couples ATP hydrolysis with the unwinding of duplex DNA at the ... replication fork by translocating in the 5'-3' direction."
suggested_questions:
- question: How does P22 gp12 interact with the host Salmonella DnaG primase during lagging-strand synthesis at the phage
    replication fork?
  experts:
  - Sherwood R. Casjens
  - Horst Backhaus
suggested_experiments:
- description: Perform in vitro single-molecule magnetic tweezers unwinding and primase-coupling assays with purified P22
    gp12 hexamers, gp18, and Salmonella DnaG primase.
  hypothesis: The N-terminal domain of gp12 (InterPro:IPR007693) directly binds and stimulates host DnaG primase at the viral
    replication fork while its C-terminal domain interacts with gp18 for origin loading.
status: COMPLETE
