  review:
    summary: Accurate annotation reflecting ATP binding by the P-loop NTPase / superfamily 4 helicase C-terminal domain of
      gp12.
    action: ACCEPT
    reason: gp12 contains a conserved DnaB-like C-terminal P-loop NTPase domain (InterPro:IPR007694, InterPro:IPR027417, PROSITE:PS51199)
