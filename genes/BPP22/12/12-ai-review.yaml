id: P03006
gene_symbol: '12'
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Hexameric DnaB-family 5'-3' replicative DNA helicase gp12 of Salmonella phage P22 that couples ATP hydrolysis
  to duplex DNA unwinding at the viral replication fork in the host cell cytoplasm, rendering phage DNA genome replication
  independent of host DnaB.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: True but overly broad keyword mapping already entailed by the accepted specific term GO:0005524 (ATP binding).
    action: TOO_GENERAL
    reason: gp12 is a P-loop ATPase that specifically binds and hydrolyzes ATP to drive DNA unwinding; GO:0000166 (nucleotide
      binding) is entailed by the more specific accepted annotation GO:0005524 (ATP binding).
    supported_by:
    - reference_id: file:genes/BPP22/12/12-uniprot.txt
      supporting_text: "CC       Reaction=Couples ATP hydrolysis with the unwinding of duplex DNA at the ... replication fork by translocating in the 5'-3' direction."
