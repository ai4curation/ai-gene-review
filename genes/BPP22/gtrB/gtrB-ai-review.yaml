id: P57022
gene_symbol: gtrB
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Bactoprenol glucosyltransferase GtrB of Salmonella phage P22 is a 310-amino-acid, two-transmembrane glycosyltransferase
  family 2 (GT2) enzyme of the host bacterial inner membrane (plasma membrane) encoded by the prophage-expressed gtrABC O-antigen
  conversion operon. GtrB catalyzes the transfer of a glucosyl residue from cytoplasmic UDP-glucose to undecaprenyl phosphate
  (bactoprenol phosphate), generating the lipid-linked glucose donor used by GtrA and GtrC to glucosylate the C-6 position
  of galactose in the host lipopolysaccharide O-antigen (converting Salmonella enterica serovar Typhimurium from serotype
  4,12 to 1,4,12).
