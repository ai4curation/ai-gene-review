suggested_questions:
- question: Does P22 GtrB assemble into a homotetramer at the cytoplasmic face of the inner membrane like Synechocystis GtrB,
    and how does it hand off undecaprenyl-phosphate-glucose to GtrA?
suggested_experiments:
- description: Assay purified membrane-reconstituted P22 GtrB with radiolabeled UDP-[14C]glucose and undecaprenyl phosphate
    across divalent cation conditions, and perform co-purification with GtrA.
  hypothesis: P22 GtrB requires a divalent metal cofactor (Mg2+ or Mn2+) at its GT-A fold DXD motif to catalyze undecaprenyl-phosphate-beta-D-glucose
    synthesis and physically associates with GtrA for substrate channeling.
status: COMPLETE
