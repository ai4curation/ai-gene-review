- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: The P22 gtrABC operon converts the host S. enterica Typhimurium O-antigen from form 4,[5],12 to 1,4,[5],12
      by adding an alpha-linked glucosyl residue at the 6 position of galactose during lysogeny.
    supporting_text: Lysogenization by P22 also results in the addition of an α-linked glucosyl residue to the 6 position
      of galactose moieties in the LPS O-antigenic tetrameric repeat. This results in a change in serotype from 4,[5],12 to
      1,4,[5],12 and prevents the binding of P22 and other serovar Typhimurium phages, a phenomenon known as lysogenic conversion
      ( 35 , 51 ).
  - statement: GtrB contains two transmembrane domains in the C-terminal region with cytoplasmic N- and C-termini.
    supporting_text: TMHMM revealed two transmembrane domains in the latter two-thirds of the protein, suggesting that both
      the amino and carboxy termini are cytoplasmic.
  - statement: GtrB functions as a bactoprenol glucosyltransferase that transfers glucose from a nucleotide-sugar donor to
      bactoprenol phosphate.
    supporting_text: Based upon the analysis of the phage SfX conversion genes, GtrB is probably a bactoprenol glucosyl transferase,
      catalyzing the transfer of glucose from an activated nucleotide intermediate to bactoprenol phosphate ( 4 , 25 ).
