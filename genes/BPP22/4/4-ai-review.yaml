- id: PMID:16970964
  title: Binding-induced stabilization and assembly of the phage P22 tail accessory factor gp4.
  findings:
  - statement: Monomeric gp4 (Tm 34 °C) is stabilized upon binding to the dodecameric portal protein gp1, assembling via a
      gp(1)12:gp(4)6 intermediate into a hollow bi-dodecameric gp(1)12:gp(4)12 ring that serves as a structural adaptor for
      gp10 and gp26.
    supporting_text: 'The final product of the assembly reaction is a bi-dodecameric gp(1)12:gp(4)12 complex, which appears
      hollow by electron microscopy, suggesting that gp4 does not physically plug the DNA entry/exit channel, but acts as
      a structural adaptor for the other tail accessory factors: gp10 and gp26.'
- id: PMID:21499245
  title: Three-dimensional structure of a viral genome-delivery portal vertex.
  findings:
  - statement: Crystal structure of the P22 gp1-gp4 complex shows 12 subunits of gp4 forming a ~75 Å tall ring attached to
      the bottom of the dodecameric portal core.
    supporting_text: Gp4 binds to the bottom of portal protein forming a second dodecameric ring ~75 Å in height (Fig. 1a,b).
- id: PMID:37952769
  title: Molecular Architecture of Salmonella Typhimurium Virus P22 Genome Ejection Machinery.
  findings:
  - statement: Cryo-EM localized reconstruction of the complete P22 tail apparatus resolves the dodecameric gp4 ring bridging
      the gp1 portal complex to the hexameric gp10 tail hub and six gp9 tailspike trimers.
    supporting_text: Here, we describe the complete architecture of the P22 tail apparatus (gp1, gp4, gp10, gp9, and gp26)
      and the potential location and organization of P22 ejection proteins (gp7, gp20, and gp16), determined using cryo-EM
      localized reconstruction, genetic knockouts, and biochemical analysis.
