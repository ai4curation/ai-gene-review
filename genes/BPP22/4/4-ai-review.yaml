  label: Lederbergvirus P22
description: Head-to-tail adapter protein (gp4) of Salmonella phage P22 that oligimerizes into a dodecameric ring (~75 Å tall)
  bound to the bottom of the dodecameric portal protein (gp1) after termination of headful viral DNA packaging. Monomeric
  gp4 is intrinsically unstable in solution and undergoes binding-induced folding upon docking to the portal vertex, forming
  a hollow bi-dodecameric neck channel that recruits the hexameric tail hub (gp10) and tailspikes (gp9) to complete virion
  assembly and serve as part of the conduit for viral DNA genome ejection into the host cell.
existing_annotations:
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0378
  review:
    summary: Zymogram assays of disrupted P22 virions detected peptidoglycan hydrolase activity associated with gp4, though
      its primary structurally defined role is as the dodecameric head-to-tail structural adapter.
    action: KEEP_AS_NON_CORE
    reason: Moak and Molineux (PMID:14763988) identified muralytic hydrolase activity migrating with P22 gp4 in zymogram assays
      without establishing the specific bond cleaved, whereas crystallographic and cryo-EM studies (PMID:16970964, PMID:21499245,
      PMID:37952769) establish that gp4's core function is acting as the non-catalytic four-helix-bundle head-to-tail structural
      adapter bound to the portal ring.
    supported_by:
    - reference_id: PMID:14763988
      supporting_text: However, three proteins with muralytic activity have been unequivocally identified. T7gp16 is a 144
        kDa internal head protein that is ejected into the cell at the initiation of infection; its enzyme activity is required
        only when the cell wall is more highly cross-linked. P22gp4 is part of the neck of the particle and is essential for
        infectivity.
