suggested_questions:
- question: How do the two non-equivalent sets of six gp4 subunits recognized during assembly (the gp1_12:gp4_6 intermediate)
    relate to the 12:6 symmetry transition between the dodecameric gp4 ring and the hexameric gp10 tail hub?
  experts:
  - Gino Cingolani
  - Sherwood R. Casjens
suggested_experiments:
- description: Perform hydrogen-deuterium exchange mass spectrometry (HDX-MS) and cryo-EM on the isolated gp(1)12:gp(4)6 intermediate
    and compare with the complete gp(1)12:gp(4)12:gp(10)6 complex.
  hypothesis: Alternating gp4 protomers around the dodecameric ring adopt distinct C-terminal tail conformations that template
    the 6-fold symmetric docking interface for hexameric gp10.
