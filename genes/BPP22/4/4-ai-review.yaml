  review:
    summary: Head-to-tail adapter gp4 is an essential structural component of the P22 tail apparatus that forms a dodecameric
      ring bridging the portal complex (gp1) to the tail hub (gp10) and tailspikes (gp9).
    action: NEW
    reason: Biochemical, crystallographic, and cryo-EM analyses establish that gp4 functions as a structural head-to-tail
      adapter ring of 12 subunits at the base of the portal vertex.
    supported_by:
    - reference_id: PMID:16970964
      supporting_text: 'The final product of the assembly reaction is a bi-dodecameric gp(1)12:gp(4)12 complex, which appears
        hollow by electron microscopy, suggesting that gp4 does not physically plug the DNA entry/exit channel, but acts as
        a structural adaptor for the other tail accessory factors: gp10 and gp26.'
    - reference_id: PMID:21499245
      supporting_text: Gp4 binds to the bottom of portal protein forming a second dodecameric ring ~75 Å in height (Fig. 1a,b).
