references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Places abc2 in the early left (PL) recombination operon of phage P22 downstream of erf and abc1.
    supporting_text: The linear double-stranded viral DNA enters the host cell, and circularization occurs, mediated by the
      phage-encoded protein Erf and the host proteins RecA and gyrase ( 50 , 67 ).
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: PMID:2738922
  title: Genetic structure of the bacteriophage P22 PL operon.
  findings:
  - statement: Defines the organization of the P22 PL recombination operon containing arf, erf, abc1, and abc2.
    supporting_text: Gene arf (accessory recombination function) is located just upstream from erf; it is essential for P22
      growth in the absence of kil or other genes upstream in PL.
- id: PMID:3660589
  title: Sequence of the bacteriophage P22 anti-recBCD (abc) genes and properties of P22 abc region deletion mutants.
  findings:
  - statement: The abc locus is required for efficient P22 growth in wild-type (recBCD+) but not recB- Salmonella hosts.
    supporting_text: Previous studies (A. C. Fenton and A. R. Poteete, 1984, Virology 134, 148-160) have shown that this region
      encodes a function that is required for efficient growth of P22 in wild-type, but not in recB- Salmonella. The gene
      or genes encoding this function were designated abc (anti-recBCD).
  - statement: Deletion and plasmid-phage complementation experiments demonstrate that the 11.6-kDa Abc2 polypeptide is the
      primary determinant of P22 anti-RecBCD activity.
    supporting_text: The phenotypes of the deletion mutants, and the results of plasmid-phage complementation tests, indicate
      that Abc activity depends primarily on sequences that encode the 11.6-kDa polypeptide; the 10.9-kDa polypeptide-encoding
      sequence makes a minor contribution to Abc activity as well. These sequences have been designated abc2 and abc1, respectively.
- id: file:genes/BPP22/abc2/abc2-uniprot.txt
  title: UniProt:P11191 (ABC2_BPP22)
  findings:
  - statement: Abc2 modulates host RecBCD nuclease activity to protect linear dsDNA from exonuclease degradation, belongs
      to InterPro:IPR020500 / Pfam:PF11043, and has been structurally characterized by cryo-EM (PDB:8B1T, PDB:8B1U).
    supporting_text: 'CC   -!- FUNCTION: Modulates the activity of the host recBCD nuclease. And thus'
suggested_questions:
- question: How does P22 Abc2 binding to the RecC subunit of RecBCD selectively block Chi-recognition and dsDNA exonuclease
    activity while allowing helicase unwinding to generate ssDNA substrates for Erf?
  experts:
  - Kenan C. Murphy
  - Dale B. Wigley
suggested_experiments:
- description: Perform single-molecule fluorescence helicase-nuclease assays with purified RecBCD-Abc2 complexes on linear
    phage P22 DNA templates in the presence of P22 Erf.
  hypothesis: Abc2 converts RecBCD from a destructive dsDNA exonuclease into a processive DNA helicase that generates 3' and
    5' single-stranded DNA tails directly loaded with P22 Erf rings.
status: COMPLETE
