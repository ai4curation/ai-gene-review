id: P11191
gene_symbol: abc2
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Anti-RecBCD protein 2 (Abc2) of Salmonella phage P22, the primary 11.6-kDa modulator of the host RecBCD helicase-nuclease
  complex that protects linear viral double-stranded DNA from exonucleolytic degradation and promotes phage homologous recombination
  in the host cell cytoplasm.
existing_annotations:
- term:
    id: GO:0030234
    label: enzyme regulator activity
  evidence_type: IMP
  original_reference_id: PMID:3660589
  review:
    summary: Abc2 is the primary phage P22 anti-RecBCD protein that binds and modulates the enzymatic activity of the host
      RecBCD nuclease complex.
    action: NEW
    reason: Deletion mutant and plasmid-phage complementation studies by Murphy et al. (1987) established that the 11.6-kDa
      Abc2 protein is the primary determinant of P22 anti-RecBCD activity, modulating the host RecBCD nuclease to prevent
      exonucleolytic degradation of linear phage dsDNA.
    supported_by:
    - reference_id: PMID:3660589
      supporting_text: The phenotypes of the deletion mutants, and the results of plasmid-phage complementation tests, indicate
        that Abc activity depends primarily on sequences that encode the 11.6-kDa polypeptide; the 10.9-kDa polypeptide-encoding
        sequence makes a minor contribution to Abc activity as well. These sequences have been designated abc2 and abc1, respectively.
    - reference_id: file:genes/BPP22/abc2/abc2-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Modulates the activity of the host recBCD nuclease. And thus'
- term:
    id: GO:0006310
    label: DNA recombination
  evidence_type: IMP
  original_reference_id: PMID:3660589
  review:
    summary: By modulating host RecBCD nuclease activity, Abc2 protects linear P22 dsDNA and promotes homologous recombination
      during lytic infection.
    action: NEW
    reason: Abc2 is required for efficient phage P22 growth and DNA recombination in wild-type (recBCD+) Salmonella hosts
      by preventing RecBCD-mediated exonuclease degradation of linear viral DNA ends.
    supported_by:
    - reference_id: PMID:3660589
      supporting_text: Previous studies (A. C. Fenton and A. R. Poteete, 1984, Virology 134, 148-160) have shown that this
        region encodes a function that is required for efficient growth of P22 in wild-type, but not in recB- Salmonella.
        The gene or genes encoding this function were designated abc (anti-recBCD).
    - reference_id: file:genes/BPP22/abc2/abc2-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Modulates the activity of the host recBCD nuclease. And thus'
core_functions:
