suggested_questions:
- question: Does P22 C3 form an amphipathic coiled-coil dimer that competitively binds Salmonella FtsH with the same stoichiometry
    and affinity as lambda cIII in E. coli?
  experts:
  - Amos B. Oppenheim
  - Anthony R. Poteete
suggested_experiments:
- description: In vitro proteolysis assay using purified Salmonella FtsH, P22 C1, and P22 C3 to measure the Ki of C3-mediated
    inhibition of C1 degradation.
  hypothesis: P22 C3 acts as a competitive substrate inhibitor of FtsH via its conserved central amphipathic alpha-helix,
    directly extending the half-life of P22 C1.
