id: P14110
gene_symbol: C3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Peptidase inhibitor (C3, homolog of phage lambda cIII, MEROPS family I75) of Salmonella phage P22 that promotes
  the establishment of lysogeny by inhibiting host protease-mediated degradation of the unstable phage transcriptional activator
  C1 (cII homolog), thereby stabilizing C1 to activate c2 repressor transcription.
