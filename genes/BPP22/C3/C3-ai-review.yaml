  qualifier: enables
  review:
    summary: C3 is a MEROPS family I75 endopeptidase inhibitor homologous and functionally analogous to phage lambda cIII
      that prevents proteolytic degradation of the C1 (cII) transcriptional activator.
    action: NEW
    reason: P22 C3 is homologous and functionally analogous to phage lambda cIII (PMID:2738922), belongs to the MEROPS I75.001
      endopeptidase inhibitor family (InterPro:IPR013056), and stabilizes the unstable C1 (cII-like) transcriptional activator
      against host proteolysis.
    supported_by:
    - reference_id: PMID:2738922
      supporting_text: Genes ral and c3 are homologous, as well as functionally analogous, to lambda ral and cIII, respectively.
    - reference_id: file:genes/BPP22/C3/C3-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Presence of the CIII protein in the cell results in the ... stabilization of the
        CII transcriptional activator (a very unstable ... protein), CII activates CI, the gene for repressor, and thus promotes
        ... the establishment of lysogeny.'
