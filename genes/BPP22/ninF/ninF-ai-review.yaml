id: Q38666
gene_symbol: ninF
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Conserved 58-amino-acid lambdoid NinF-family protein encoded in the early right (PR) nin region of Salmonella
  phage P22 between ninX and ninG; its specific molecular function remains uncharacterized.
existing_annotations: []
core_functions:
- description: Conserved lambdoid phage NinF-family protein (InterPro:IPR008712, Pfam:PF05810) encoded in the P22 nin region
    whose biochemical activity and cellular target are currently unknown.
  supported_by:
  - reference_id: PMID:11053393
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
  - reference_id: file:genes/BPP22/ninF/ninF-uniprot.txt
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the ninF family. {ECO:0000305}.'
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identifies ninF as a conserved lambdoid gene within the early right nin region of Salmonella phage P22.
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:genes/BPP22/ninF/ninF-uniprot.txt
  title: UniProt:Q38666 (NINF_BPP22)
  findings:
  - statement: P22 NinF is a 58-residue protein belonging to the lambdoid NinF family (InterPro:IPR008712, Pfam:PF05810).
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the ninF family. {ECO:0000305}.'
suggested_questions:
- question: Does P22 NinF functionally interact with the adjacent Holliday junction resolvase NinG (Rap) or with host recombination
    proteins?
  experts:
  - Sherwood R. Casjens
  - Gary J. Sharples
suggested_experiments:
- description: Perform bacterial two-hybrid and pull-down assays testing interactions of P22 NinF with adjacent nin-region
    proteins (NinB, NinD, NinE, NinX, NinG, NinH) and Salmonella host recombination factors.
  hypothesis: NinF acts as an accessory subunit or modulator within the lambdoid nin recombination/repair gene cluster.
status: COMPLETE
