id: Q01075
gene_symbol: '14'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Morphogenetic gene product gp14 (151 AA) of Salmonella phage P22, encoded between the tail needle gene 26 and
  the internal ejection protein gene 7 within the late morphogenetic operon and comprising a conserved DUF2824 domain (IPR022568
  / PF11039). Although mapped genetically to the late morphogenetic cluster, gp14 is not packaged into mature virions and
  its specific molecular function in phage development remains uncharacterized.
existing_annotations: []
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Complete genome sequencing of Salmonella phage P22 (41,724 bp) annotates 65 genes across the genome including
      gene 14 in the late morphogenetic gene cluster.
    supporting_text: The sequence of the nonredundant region of the Salmonella enterica serovar Typhimurium temperate, serotype-converting
      bacteriophage P22 has been completed. The genome is 41,724 bp with an overall moles percent GC content of 47.1%.
- id: PMID:1522065
  title: Oligopeptidase A is required for normal phage P22 development.
  findings:
  - statement: The complete nucleotide sequence of P22 gene 14 and the adjacent gene 7 was determined.
    supporting_text: The nucleotide sequence of this fragment and a contiguous region (including all of both P22 gene 7 and
      gene 14) was determined.
core_functions:
- description: Late morphogenetic operon protein containing a conserved DUF2824 domain encoded immediately upstream of the
    internal ejection protein gene 7; its specific biochemical activity remains unknown.
  supported_by:
  - reference_id: PMID:1522065
    supporting_text: The nucleotide sequence of this fragment and a contiguous region (including all of both P22 gene 7 and
      gene 14) was determined.
suggested_questions:
- question: Does gp14 act as a non-structural cytoplasmic assembly chaperone for the internal ejection proteins (gp7, gp20,
    gp16) during procapsid incorporation, or is the classical amber phenotype of gene 14 alleles caused by polar effects on
    downstream ejection genes (7, 20, 16)?
  experts:
  - Sherwood R. Casjens
  - Parent Kristin N.
suggested_experiments:
- description: Construct a clean, non-polar in-frame deletion of gene 14 in the P22 prophage without perturbing the translational
    initiation of downstream gene 7, and quantify virion yield, E-protein (gp7*, gp20, gp16) copy number per virion by mass
    spectrometry, and specific infectivity.
  hypothesis: Either gp14 acts as a non-structural chaperone promoting incorporation or OpdA-mediated maturation of gp7, or
    classical gene 14 amber mutations were polar on downstream gene 7 expression.
