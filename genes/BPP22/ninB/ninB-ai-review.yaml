id: Q38662
gene_symbol: ninB
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Recombination mediator protein NinB (Orf) of Salmonella phage P22 that binds single-stranded DNA and supplies
  a RecFOR-like recombination mediator activity during phage homologous recombination in the host cell cytoplasm.
existing_annotations:
- term:
    id: GO:0003697
    label: single-stranded DNA binding
  evidence_type: ISS
  original_reference_id: PMID:16076958
  review:
    summary: P22 NinB shares >85% sequence identity with phage lambda NinB (Orf), a conserved NinB-family recombinase cofactor
      (InterPro:IPR008711, Pfam:PF05772) that preferentially binds single-stranded DNA.
    action: NEW
    reason: Comparative genomic analysis shows >85% sequence identity between P22 ninB and phage lambda ninB (orf), and biochemical
      analysis of NinB/Orf demonstrates that it forms a homodimeric ring/channel that preferentially binds single-stranded
      DNA over duplex DNA.
    supported_by:
    - reference_id: PMID:11053393
      supporting_text: The regions of greatest DNA sequence similarity correspond to genes ninB , ninG , and 23 . This is
        also verified at the amino acid level.
    - reference_id: PMID:16076958
      supporting_text: Orf binds DNA, favoring single-stranded over duplex and with no obvious preference for gapped, 3'-tailed,
        or 5'-tailed substrates.
    - reference_id: file:genes/BPP22/ninB/ninB-uniprot.txt
      supporting_text: 'CC   -!- SIMILARITY: Belongs to the ninB family. {ECO:0000305}.'
- term:
    id: GO:0006310
    label: DNA recombination
  evidence_type: ISS
  original_reference_id: PMID:16076958
  review:
    summary: P22 NinB is the close ortholog (>85% identity) of phage lambda NinB/Orf, which acts as a RecFOR-like recombination
      mediator in early homologous recombination.
    action: NEW
    reason: Based on high sequence conservation (>85% identity) with phage lambda NinB (Orf) and conserved domain architecture
      (InterPro:IPR008711 Recombinase_NinB), P22 NinB functions as a recombination mediator supplying a RecFOR-equivalent
      activity during phage DNA recombination.
    supported_by:
    - reference_id: PMID:11053393
      supporting_text: The regions of greatest DNA sequence similarity correspond to genes ninB , ninG , and 23 . This is
        also verified at the amino acid level.
    - reference_id: PMID:16076958
      supporting_text: Phage lambda encodes an additional recombinase, Orf, which participates in the early stages of recombination
        by supplying a function equivalent to the Escherichia coli RecFOR complex.
