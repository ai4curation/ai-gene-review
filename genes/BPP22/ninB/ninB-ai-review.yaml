references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identifies ninB as one of the three genes sharing the highest DNA and amino acid sequence identity (>85%) between
      Salmonella phage P22 and coliphage lambda.
    supporting_text: Using the BLAST2 algorithm of Tatusova and Madden, we identified five >300-bp regions in lambda DNA which
      shared >85% sequence identity with the P22 sequence ( 66 ). These are indicated in Fig. 1 . The regions of greatest
      DNA sequence similarity correspond to genes ninB , ninG , and 23 . This is also verified at the amino acid level.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: PMID:16076958
  title: Functional similarities between phage lambda Orf and Escherichia coli RecFOR in initiation of genetic exchange.
  findings:
  - statement: Lambdoid NinB (Orf) participates in early stages of homologous recombination by supplying a recombination mediator
      function equivalent to the host RecFOR complex.
    supporting_text: Phage lambda encodes an additional recombinase, Orf, which participates in the early stages of recombination
      by supplying a function equivalent to the Escherichia coli RecFOR complex.
  - statement: NinB (Orf) preferentially binds single-stranded DNA over duplex DNA via conserved positively charged channel
      residues.
    supporting_text: Orf binds DNA, favoring single-stranded over duplex and with no obvious preference for gapped, 3'-tailed,
      or 5'-tailed substrates.
- id: file:genes/BPP22/ninB/ninB-uniprot.txt
  title: UniProt:Q38662 (NINB_BPP22)
  findings:
  - statement: P22 NinB belongs to the lambdoid NinB recombinase family (InterPro:IPR008711, InterPro:IPR036619, Pfam:PF05772,
      Gene3D:1.10.3790.10, SUPFAM:SSF103370).
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the ninB family. {ECO:0000305}.'
suggested_questions:
- question: Does P22 NinB facilitate loading of the P22 Erf ssDNA-annealing recombinase as well as host RecA onto Salmonella
    SSB-coated single-stranded DNA?
  experts:
  - Gary J. Sharples
  - Kenan C. Murphy
suggested_experiments:
- description: Test whether purified P22 NinB accelerates displacement of Salmonella SSB by either Salmonella RecA or P22
    Erf on single-stranded DNA templates in vitro.
  hypothesis: P22 NinB binds the C-terminal tail of Salmonella SSB and remodels SSB-ssDNA complexes to facilitate loading
    of both host RecA and phage Erf.
status: COMPLETE
