id: Q38663
gene_symbol: ninD
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Conserved 57-amino-acid lambdoid NinD-family protein encoded in the early right (PR) nin region of Salmonella
  phage P22 between ninB and ninE; its specific molecular function remains uncharacterized.
existing_annotations: []
core_functions:
- description: Conserved lambdoid phage NinD-family protein (InterPro:IPR035346, Pfam:PF17466) encoded in the P22 nin region
    whose biochemical activity and cellular target are currently unknown.
  supported_by:
  - reference_id: PMID:11053393
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
  - reference_id: file:genes/BPP22/ninD/ninD-uniprot.txt
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the ninD family. {ECO:0000305}.'
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identifies ninD as a conserved lambdoid gene within the early right nin region of Salmonella phage P22.
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:genes/BPP22/ninD/ninD-uniprot.txt
  title: UniProt:Q38663 (NIND_BPP22)
  findings:
  - statement: P22 NinD is a 57-residue protein belonging to the lambdoid NinD family (InterPro:IPR035346, Pfam:PF17466).
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the ninD family. {ECO:0000305}.'
suggested_questions:
- question: Does P22 NinD interact with host replication or recombination machinery or modulate host cell physiology during
    early lytic infection?
  experts:
  - Sherwood R. Casjens
  - Andrew M. Kropinski
suggested_experiments:
- description: Perform affinity purification coupled to mass spectrometry (AP-MS) of tagged P22 NinD expressed in Salmonella
    enterica serovar Typhimurium to identify host or phage protein interaction partners.
  hypothesis: NinD forms a complex with either a host DNA repair/replication factor or adjacent nin-region proteins to enhance
    phage fitness under non-standard host growth conditions.
status: COMPLETE
