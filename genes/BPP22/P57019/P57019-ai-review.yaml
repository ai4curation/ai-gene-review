core_functions:
- description: Catalyzes the serotype-specific transfer of alpha-1,6-glucosyl residues onto the galactosyl moiety of the host
    Salmonella lipopolysaccharide O-antigen repeat unit in the host cell membrane as the terminal glucosyltransferase (GtrC)
    of the gtrABC lysogenic conversion pathway.
