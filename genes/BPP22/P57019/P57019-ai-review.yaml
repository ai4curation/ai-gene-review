  review:
    summary: P57019 (ORF485 / GtrC) is the serotype-specific glucosyltransferase of the P22 gtrABC O-antigen conversion cassette
      (`InterPro:IPR025686`, `Pfam:PF14264`).
    action: NEW
    reason: Vander Byl and Kropinski (2000) cloned the P22 gtrABC cassette and demonstrated that it mediates O1-antigen conversion
      (addition of alpha-1,6-glucosyl residues to the galactose moiety of the O-antigen repeat), identifying ORF485 (GtrC)
      by sequence similarity to Shigella and phage glucosyltransferases (`InterPro:IPR025686`, `Pfam:PF14264`) as the serotype-specific
      glucosyltransferase (hexosyltransferase, GO:0016758).
    supported_by:
    - reference_id: PMID:11053393
      supporting_text: Since SfX bgt and Shigella gtrI can result in serotype conversion we believe that this gene probably
        encodes the glucosyl transferase directly involved in serotype conversion while gtrA and gtrB are accessory genes.
        It would be expected that the specificity of the conversion would lie with this protein, since it must recognize different
        receptor molecules.
