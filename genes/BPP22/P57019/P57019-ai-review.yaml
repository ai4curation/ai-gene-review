- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identified ORF485 (P57019 / GtrC) as the third gene of the P22 gtrABC serotype-converting operon, cloned the
      gtrABC cassette to demonstrate O-antigen 1 conversion in Salmonella Typhimurium LT2, and assigned GtrC as the serotype-specific
      alpha-1,6-glucosyltransferase that modifies the O-antigen polysaccharide repeat.
    supporting_text: We have cloned the serotype-converting cassette (gtrABC) and demonstrated that it results in Salmonella
      serovar Typhimurium LT2 cells which express antigen O1.
  - statement: Assigned ORF485 (GtrC) as the glucosyltransferase directly responsible for recognizing the O-antigen receptor
      repeat during serotype conversion.
    supporting_text: Since SfX bgt and Shigella gtrI can result in serotype conversion we believe that this gene probably
      encodes the glucosyl transferase directly involved in serotype conversion while gtrA and gtrB are accessory genes. It
      would be expected that the specificity of the conversion would lie with this protein, since it must recognize different
      receptor molecules.
