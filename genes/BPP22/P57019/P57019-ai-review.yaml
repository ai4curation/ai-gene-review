suggested_questions:
- question: Which periplasmic loop residues in P22 GtrC (P57019) form the catalytic base and determine regioselectivity for
    the alpha-1,6 linkage to the galactose residue of the Salmonella Group B O-antigen repeat?
  experts:
  - Andrew M. Kropinski
  - Sherwood R. Casjens
suggested_experiments:
- description: Perform site-directed mutagenesis of conserved acidic residues in the large periplasmic C-terminal domain (residues
    371-485) and first periplasmic loop (residues 30-65) of P57019 in a cloned gtrABC plasmid and assay O1 antigen surface
    expression by slide agglutination and LPS silver staining.
  hypothesis: Conserved aspartate/glutamate residues on the periplasmic face of GtrC are required for glucosyl transfer from
    undecaprenyl-phosphate-glucose to the O-antigen repeat unit.
