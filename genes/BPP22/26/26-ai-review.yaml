  label: Lederbergvirus P22
description: Tail needle protein (gp26) of Salmonella phage P22 that assembles into an ultra-stable 240-Å-long homotrimeric
  coiled-coil fiber at the distal tip of the central tail axis. Its N-terminal 60 residues adopt an extended pre-ejection
  conformation inside the hexameric tail hub (gp10) to plug the portal-tail channel and trap the pressurized dsDNA genome
  inside the mature virion, while its C-terminal inverted coiled-coil tip penetrates the host outer membrane upon tailspike-mediated
  LPS hydrolysis and dissociates from the tail hub to trigger ejection of the internal pilot proteins and viral genome.
existing_annotations:
- term:
    id: GO:0044694
    label: symbiont genome entry into host cell via pore formation in plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1172
  review:
    summary: Automated keyword mapping to pore formation in the host plasma membrane is inaccurate for gp26, which penetrates
      the host outer membrane and is released before inner-membrane channel formation; replace with GO:0099002.
    action: MODIFY
    reason: Cryo-electron tomography of P22 infection initiation (PMID:30886360) demonstrates that the gp26 tail needle penetrates
      the bacterial outer membrane and is then released into the extracellular/periplasmic space prior to ejection of gp7*,
      gp20, and gp16, whereas the inner (plasma) membrane pore is formed by gp16. Therefore, gp26's entry role is best captured
      by GO:0099002 (symbiont genome ejection through host cell envelope, short tail mechanism).
    proposed_replacement_terms:
    - id: GO:0099002
      label: symbiont genome ejection through host cell envelope, short tail mechanism
    supported_by:
    - reference_id: PMID:30886360
      supporting_text: The virion then orients perpendicularly and the needle penetrates the outer membrane. The needle is
        released and the internal head protein gp7* is ejected and assembles into an extracellular channel that extends from
        the gp10 baseplate to the cell surface.
