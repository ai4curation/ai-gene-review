suggested_questions:
- question: After penetrating the Salmonella outer membrane and dissociating from the gp10 tail hub, does the gp26 trimer
    remain embedded in the outer membrane lipid bilayer or is it released into the periplasmic space?
  experts:
  - Ian J. Molineux
  - Gino Cingolani
suggested_experiments:
- description: Reconstitute P22 virions with site-specifically fluorophore- or gold-labeled gp26 needles and track the localization
    of released gp26 in outer membrane versus periplasmic fractions of infected Salmonella minicells by cryo-ET and subcellular
    fractionation.
  hypothesis: Interaction of the hydrophobic C-terminal beta-hairpins with the lipid A core of the outer membrane extracts
    gp26 from the gp10 lumen and laterally partitions the needle into the outer membrane as its N-terminal tip refolds into
    a trimer of hairpins.
