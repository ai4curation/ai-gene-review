- term:
    id: GO:0019068
    label: virion assembly
  evidence_type: IDA
  original_reference_id: PMID:26574546
  qualifier: involved_in
  review:
    summary: Binding of the N-terminal 60 residues of gp26 to the hexameric gp10 tail hub seals the portal vertex after headful
      DNA packaging to stabilize the mature virion.
    action: NEW
    reason: Genetic and biochemical tail-assembly studies show that gp26 docks onto hexameric gp10 to lock the packaged genome
      inside the capsid and prevent spontaneous DNA leakage during virion maturation.
    supported_by:
    - reference_id: PMID:26574546
      supporting_text: The N-terminal tip of gp26 plugs the portal vertex channel ( 25 ), and loss of gp26 caused by mutation
        results in viral particles that incorporate DNA efficiently but fail to retain it inside the capsid (“DNA leakage
        phenotype”) ( 24 ).
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:18059287
  title: Structure of phage P22 cell envelope–penetrating needle.
  findings:
  - statement: The 2.1 Å crystal structure of P22 gp26 reveals a 240-Å trimeric fiber consisting of two coiled-coil domains
      interrupted by a triple beta-helix, with an N-terminal portal-channel plug and a C-terminal hydrophobic beta-hairpin
      tip.
    supporting_text: The 2.1-Å crystal structure of gp26 reveals a 240-Å elongated protein fiber formed by two trimeric coiled-coil
      domains interrupted by a triple β-helix.The N terminus of gp26 plugs the portal protein channel, retaining the genetic
      material inside the virion. The C-terminal tip of the fiber exposes β-hairpins with hydrophobic tips similar to those
      seen in class II fusion peptides.
- id: PMID:19482036
  title: 'An evolutionarily conserved family of virion tail needles related to bacteriophage P22 gp26: correlation between
    structural stability and length of the alpha-helical trimeric coiled coil.'
  findings:
  - statement: Homotrimeric gp26 forms an SDS-resistant 240-Å fiber (Tm ~85-88 °C, Cm 6.4 M GdnHCl) whose N-terminal 60 residues
      bind gp10 to plug the portal vertex channel.
    supporting_text: The N-terminal 60 amino acids of the needle bind gp10 and form the plug that closes the portal vertex
      channel through which DNA is packaged and injected.
- id: PMID:20817910
  title: Tailspike interactions with lipopolysaccharide effect DNA ejection from phage P22 particles in vitro.
  findings:
  - statement: Tailspike-mediated O-antigen cleavage positions the virion on the outer membrane and drives the gp26 needle
      into the outer membrane, releasing the plug and triggering ejection of pilot proteins and DNA.
    supporting_text: They force gp26, the central needle and plug protein of the phage tail machine, through the core oligosaccharide
      layer and into the hydrophobic portion of the outer membrane, leading to refolding of the gp26 lazo-domain, release
      of the plug, and ejection of DNA and pilot proteins.
- id: PMID:26574546
  title: Structural Plasticity of the Protein Plug That Traps Newly Packaged Genomes in Podoviridae Virions.
  findings:
  - statement: The conserved N-terminal tip of gp26 adopts an extended conformation inside the gp10 hub to seal packaged DNA
      in the virion and refolds into a trimer of hairpins after release.
    supporting_text: 'We propose the tail needle N-terminal tip exists in two conformations: a pre-ejection extended conformation,
      which seals the portal vertex after genome packaging, and a postejection trimer of hairpins, which forms upon its release
      from the virion.'
- id: PMID:30886360
  title: Structural dynamics of bacteriophage P22 infection initiation revealed by cryo-electron tomography.
  findings:
  - statement: Cryo-electron tomography shows the gp26 tail needle abutting the host surface during oblique attachment, penetrating
      the outer membrane upon perpendicular reorientation, and then dissociating to permit trans-envelope channel assembly
      and DNA ejection.
    supporting_text: The virion then orients perpendicularly and the needle penetrates the outer membrane. The needle is released
      and the internal head protein gp7* is ejected and assembles into an extracellular channel that extends from the gp10
      baseplate to the cell surface.
- id: PMID:37952769
  title: Molecular Architecture of Salmonella Typhimurium Virus P22 Genome Ejection Machinery.
  findings:
  - statement: Cryo-EM localized reconstruction of the P22 tail apparatus resolves the trimeric gp26 needle anchored within
      the central channel of the hexameric gp10 tail hub.
    supporting_text: Here, we describe the complete architecture of the P22 tail apparatus (gp1, gp4, gp10, gp9, and gp26)
      and the potential location and organization of P22 ejection proteins (gp7, gp20, and gp16), determined using cryo-EM
      localized reconstruction, genetic knockouts, and biochemical analysis.
core_functions:
- description: Forms the 240-Å homotrimeric coiled-coil tail needle at the distal tip of the P22 tail apparatus whose N-terminal
    domain plugs the hexameric gp10 tail hub channel to stabilize packaged dsDNA during virion assembly, and whose C-terminal
    tip penetrates the host outer membrane and releases the plug to initiate short-tail viral genome ejection.
