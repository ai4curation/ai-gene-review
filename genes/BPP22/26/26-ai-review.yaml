  review:
    summary: Tail needle gp26 forms the 240-Å homotrimeric coiled-coil fiber and portal-channel plug that seals the packaged
      DNA genome inside the mature virion.
    action: NEW
    reason: X-ray crystallography and cryo-EM establish that homotrimeric gp26 is a structural component of the P22 tail apparatus
      whose N-terminal plug domain physically seals the DNA exit channel.
    supported_by:
    - reference_id: PMID:18059287
      supporting_text: The 2.1-Å crystal structure of gp26 reveals a 240-Å elongated protein fiber formed by two trimeric
        coiled-coil domains interrupted by a triple β-helix.The N terminus of gp26 plugs the portal protein channel, retaining
