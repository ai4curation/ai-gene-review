  review:
    summary: Virions lacking gp20 fail to trigger host K+ release or inject viral DNA, and gp20 must interact specifically
      with cognate gp16 during genome delivery while being co-targeted by prophage SieA.
    action: ACCEPT
    reason: Genetic knockouts, P22-Sf6 hybrid swaps, and SieA escape mutations (T338I, T341I, A348T, G350D) demonstrate that
      gp20 is essential for K+ efflux and DNA translocation across the host cell envelope in partnership with gp16.
    supported_by:
    - reference_id: PMID:38236051
      supporting_text: In other words, all three E-proteins are required for K+ release and for DNA injection.
    - reference_id: PMID:38236051
      supporting_text: The simplest explanation for this observation is that gp16 and gp20 assemble into virions independently
        but must interact in the virion and/or during DNA delivery, and P22 gp16 and gp20 cannot interact with Sf6 gp20 and
        gp16, respectively.
