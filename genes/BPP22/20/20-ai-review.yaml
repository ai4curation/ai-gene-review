      DNA ejection.
  - reference_id: PMID:30886360
    supporting_text: A second protein, gp20, is ejected and assembles into a structure that extends the extracellular channel
      across the outer membrane into the periplasm.
  - reference_id: PMID:38236051
    supporting_text: In other words, all three E-proteins are required for K+ release and for DNA injection.
suggested_questions:
- question: How does the periplasmic gp20 tube traverse the cross-linked host peptidoglycan meshwork without a dedicated virion-associated
    muralytic domain in gp20, and how does region 338-350 of gp20 couple to inner-membrane gp16 and SieA?
  experts:
  - Sherwood R. Casjens
  - Ian J. Molineux
  - Jun Liu
  - Gino Cingolani
suggested_experiments:
- description: Determine the atomic structure of the P22 gp20 oligomer in complex with the C-terminal domain of gp16 and the
    periplasmic loop of SieA by single-particle cryo-EM, and test whether substitutions at residues 338-350 alter SieA binding
    affinity by surface plasmon resonance.
  hypothesis: Residues 338-350 of gp20 form the periplasmic docking collar for the inner-membrane gp16 pore, which is competitively
    bound by the periplasmic face of prophage SieA to block DNA translocation.
