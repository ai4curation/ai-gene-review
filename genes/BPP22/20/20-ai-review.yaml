references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:26245366
  title: Bacteriophage P22 ejects all of its internal proteins before its genome.
  findings:
  - statement: Internal virion protein gp20 is packaged at 10-20 copies per procapsid via the scaffolding protein and is ejected
      prior to viral DNA upon co-stimulation by host LPS and OmpA.
    supporting_text: From this we conclude that in the presence of LPS and OmpA all three E proteins are ejected prior to
      DNA ejection.
- id: PMID:29590587
  title: Cryo-EM Elucidation of the Structure of Bacteriophage P22 Virions after Genome Release.
  findings:
  - statement: Cryo-EM of P22 particles after genome release reveals a remodeled ejection protein tube extending from the
      distal tip of the gp10 tail hub.
    supporting_text: Previous studies have shown that particles lacking the gp26 plug contain ejection proteins associated
      with them ( 13 ), and since the structures and location of all P22 virion proteins are known in the mature virus except
      for the three ejection proteins, we believe that this tube-like density is likely to be a remodeled form of one of these
      proteins (gp16, gp7, or gp20).
- id: PMID:30886360
  title: Structural dynamics of bacteriophage P22 infection initiation revealed by cryo-electron tomography.
  findings:
  - statement: Ejected gp20 assembles into the outer-membrane-periplasmic channel linking the extracellular gp7* channel to
      the cytoplasmic-membrane gp16 pore within the ~40 nm trans-envelope DNA delivery conduit.
    supporting_text: A second protein, gp20, is ejected and assembles into a structure that extends the extracellular channel
      across the outer membrane into the periplasm.
- id: PMID:37952769
  title: Molecular Architecture of Salmonella Typhimurium Virus P22 Genome Ejection Machinery.
  findings:
  - statement: Cryo-EM localized reconstruction and biochemical analyses characterize the P22 tail apparatus and direct interactions
      between ejection proteins gp7 and gp20.
    supporting_text: Here, we describe the complete architecture of the P22 tail apparatus (gp1, gp4, gp10, gp9, and gp26)
      and the potential location and organization of P22 ejection proteins (gp7, gp20, and gp16), determined using cryo-EM
      localized reconstruction, genetic knockouts, and biochemical analysis.
- id: PMID:38236051
  title: Bacteriophage P22 SieA-mediated superinfection exclusion.
  findings:
  - statement: Ejection protein gp20 is required for host K+ efflux and viral DNA injection, interacts specifically with cognate
      gp16 during genome delivery, and is co-targeted with gp16 by prophage SieA (with substitutions T338I, T341I, A348T,
      and G350D conferring SieA escape in combination with gp16 mutations).
    supporting_text: The simplest explanation for this observation is that gp16 and gp20 assemble into virions independently
      but must interact in the virion and/or during DNA delivery, and P22 gp16 and gp20 cannot interact with Sf6 gp20 and
      gp16, respectively.
core_functions:
- description: Ejected from the capsid prior to viral DNA upon LPS and OmpA recognition and assembles into the structural
    outer-membrane-periplasmic channel that spans the host periplasm and peptidoglycan layer to connect the extracellular
    gp7* channel to the inner-membrane gp16 pore during viral genome translocation.
