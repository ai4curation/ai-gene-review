  review:
    summary: Cryo-EM of P22 virions after genome release implicates the internal ejection proteins in assembling the genome
      delivery tube.
    action: ACCEPT
    reason: Cryo-EM comparisons of mature and post-ejection P22 virions show remodeling of internal ejection proteins after
      gp26 release.
    supported_by:
    - reference_id: PMID:29590587
      supporting_text: Previous studies have shown that particles lacking the gp26 plug contain ejection proteins associated
