id: P04892
gene_symbol: erf
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Ring-forming single-stranded DNA-binding recombinase Erf (essential recombination function) of Salmonella phage
  P22 that promotes homologous recombination and circularization of the terminally redundant viral genome in the host cell
  cytoplasm.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Automated annotation from UniProt keyword KW-0238 (DNA-binding) is correct but too general; biochemical studies
      show that Erf specifically binds single-stranded DNA.
    action: MODIFY
    reason: Quantitative DNA-binding studies of intact P22 Erf and its defined proteolytic fragments show that Erf binds single-stranded
      DNA via a basic interdomain determinant (residues 131-149) on its ring-like oligomer. Replacing GO:0003677 (DNA binding)
      with the specific descendant term GO:0003697 (single-stranded DNA binding) accurately reflects its experimental activity.
    proposed_replacement_terms:
    - id: GO:0003697
      label: single-stranded DNA binding
    supported_by:
    - reference_id: PMID:3612797
      supporting_text: Intact Erf and the 149 residue fragment have similar affinities for single-stranded DNA; the affinity
        of the 130 residue fragment is 40-fold lower in low salt at pH 6.0.
- term:
    id: GO:0006310
    label: DNA recombination
  evidence_type: NAS
  original_reference_id: PMID:11053393
  review:
    summary: Erf promotes homologous recombination of phage P22 DNA, mediating genome circularization upon host entry and
      enabling lytic growth in recA-deficient hosts.
    action: NEW
    reason: Genetic and biochemical studies establish that Erf is the primary homologous recombination protein of phage P22,
      mediating circularization of the linear terminally redundant viral DNA upon entry into the host cell and supporting
      phage growth in recA-mutant Salmonella.
    supported_by:
    - reference_id: PMID:11053393
      supporting_text: The linear double-stranded viral DNA enters the host cell, and circularization occurs, mediated by
        the phage-encoded protein Erf and the host proteins RecA and gyrase ( 50 , 67 ).
    - reference_id: file:genes/BPP22/erf/erf-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Promotes homologous recombination. Essential for P22 growth ... in a recA, but not a wild-type, host.'
core_functions:
- description: Binds single-stranded DNA as a ring-like oligomer to promote homologous recombination and circularization of
    the terminally redundant bacteriophage P22 genome in the host cell cytoplasm.
  molecular_function:
    id: GO:0003697
    label: single-stranded DNA binding
  directly_involved_in:
