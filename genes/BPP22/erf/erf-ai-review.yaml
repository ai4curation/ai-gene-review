    label: DNA recombination
  supported_by:
  - reference_id: PMID:3612797
    supporting_text: Intact Erf and the 149 residue fragment have similar affinities for single-stranded DNA; the affinity
      of the 130 residue fragment is 40-fold lower in low salt at pH 6.0.
  - reference_id: PMID:11053393
    supporting_text: The linear double-stranded viral DNA enters the host cell, and circularization occurs, mediated by the
      phage-encoded protein Erf and the host proteins RecA and gyrase ( 50 , 67 ).
  - reference_id: file:genes/BPP22/erf/erf-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: Promotes homologous recombination. Essential for P22 growth ... in a recA, but not a wild-type, host.'
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Circularization of the injected linear P22 dsDNA genome in the host cell is mediated by the phage-encoded Erf
      recombinase together with host RecA and DNA gyrase.
    supporting_text: The linear double-stranded viral DNA enters the host cell, and circularization occurs, mediated by the
      phage-encoded protein Erf and the host proteins RecA and gyrase ( 50 , 67 ).
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: PMID:2738922
  title: Genetic structure of the bacteriophage P22 PL operon.
  findings:
  - statement: Defines the organization of the P22 PL recombination region including arf, erf, abc1, and abc2.
    supporting_text: Gene arf (accessory recombination function) is located just upstream from erf; it is essential for P22
      growth in the absence of kil or other genes upstream in PL.
- id: PMID:3612797
  title: Localization of a DNA-binding determinant in the bacteriophage P22 Erf protein.
  findings:
  - statement: Purified P22 Erf forms ring-like oligomers with protruding C-terminal domains and binds single-stranded DNA
      via a determinant between residues 130 and 149.
    supporting_text: The 149 and 130 residue fragments are stable; electron microscopy of the purified fragments reveals that
      they have similar morphologies, retaining the ring-like oligomeric structure, but lacking the tooth-like protruding
      portions of intact Erf.
  - statement: Deletion of residues 131-149 reduces single-stranded DNA binding affinity by 40-fold, localizing the primary
      ssDNA-binding determinant to this interdomain segment.
    supporting_text: Intact Erf and the 149 residue fragment have similar affinities for single-stranded DNA; the affinity
      of the 130 residue fragment is 40-fold lower in low salt at pH 6.0.
- id: PMID:6210989
  title: Location and sequence of the erf gene of phage P22.
  findings: []
- id: file:genes/BPP22/erf/erf-uniprot.txt
  title: UniProt:P04892 (ERF_BPP22)
  findings:
  - statement: Erf promotes homologous recombination and is required for P22 growth in recA-deficient Salmonella hosts.
    supporting_text: 'CC   -!- FUNCTION: Promotes homologous recombination. Essential for P22 growth ... in a recA, but not a wild-type, host.'
suggested_questions:
- question: Does the C-terminal protruding domain of P22 Erf directly interact with the accessory recombination protein Arf
    or with host single-stranded DNA-binding protein (SSB) during DNA annealing?
  experts:
  - Anthony R. Poteete
  - Kenan C. Murphy
suggested_experiments:
- description: Determine the high-resolution cryo-EM structure of full-length P22 Erf rings bound to single-stranded DNA substrates.
  hypothesis: Single-stranded DNA wraps around the positively charged interdomain groove (residues 131-149) on the exterior
    of the Erf oligomeric ring to promote annealing of complementary DNA strands.
status: COMPLETE
