id: P03037
gene_symbol: ant
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Antirepressor protein (Ant) encoded in the immI region of Salmonella phage P22 that binds and non-covalently
  inhibits the P22 C2 immunity repressor (as well as the cI repressors of related lambdoid phages such as lambda and 434),
  preventing operator DNA binding to derepress early lytic transcription and trigger release from viral latency.
existing_annotations:
- term:
    id: GO:0140416
    label: transcription regulator inhibitor activity
  evidence_type: TAS
  original_reference_id: PMID:11053393
  qualifier: enables
  review:
    summary: Ant directly inhibits the P22 C2 transcriptional repressor and related lambdoid cI repressors by preventing them
      from binding their operator DNA sites.
    action: NEW
    reason: Ant is the archetypal bacteriophage antirepressor that binds the C2 (and lambda/434 cI) transcriptional repressor
      protein and blocks its operator DNA-binding activity without proteolytic cleavage (PMID:6350606, PMID:11053393).
    supported_by:
    - reference_id: PMID:11053393
      supporting_text: Another early transcript is initiated from P ant in the unique immI region, giving rise to an antirepressor,
        Ant, which functions to inhibit c2 repressor function.
    - reference_id: file:genes/BPP22/ant/ant-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: This protein prevents the prophage P22 c2 repressor protein ... from binding to
        its operators and also inhibits the action of other ... prophage repressor proteins, including those of phages lambda
        and 434.'
- term:
    id: GO:0046782
    label: regulation of viral transcription
  evidence_type: TAS
  original_reference_id: PMID:11053393
  qualifier: involved_in
  review:
    summary: By inhibiting the C2 immunity repressor, Ant derepresses viral transcription from the early lytic promoters PL
      and PR.
    action: NEW
    reason: Inactivation of the C2 repressor by Ant relieves transcriptional repression at OL and OR, regulating viral gene
      expression (PMID:11053393).
    supported_by:
    - reference_id: PMID:11053393
      supporting_text: Another early transcript is initiated from P ant in the unique immI region, giving rise to an antirepressor,
        Ant, which functions to inhibit c2 repressor function.
    - reference_id: file:genes/BPP22/ant/ant-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: This protein prevents the prophage P22 c2 repressor protein ... from binding to
        its operators and also inhibits the action of other ... prophage repressor proteins, including those of phages lambda
        and 434.'
- term:
    id: GO:0019046
    label: release from viral latency
  evidence_type: TAS
  original_reference_id: PMID:11053393
  qualifier: involved_in
  review:
    summary: Inhibition of prophage C2 and cI repressors by Ant abolishes maintenance of lysogeny and triggers prophage induction
      (release from viral latency).
    action: NEW
    reason: By preventing prophage repressor proteins (P22 C2, lambda cI, 434 cI) from binding their operators, Ant induces
      resident prophages into lytic development.
    supported_by:
    - reference_id: file:genes/BPP22/ant/ant-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: This protein prevents the prophage P22 c2 repressor protein ... from binding to
        its operators and also inhibits the action of other ... prophage repressor proteins, including those of phages lambda
        and 434.'
references:
- id: PMID:6350606
  title: Primary structure of the immI immunity region of bacteriophage P22.
  findings:
  - statement: Purified P22 Ant antirepressor and determined its complete 300-amino-acid sequence from the immI region.
    supporting_text: This region includes the ant gene, which encodes the P22 antirepressor protein, and the mnt and arc genes,
      which encode proteins that negatively regulate antirepressor synthesis. We have purified antirepressor protein and selected
      tryptic peptides of antirepressor, and have determined the amino terminal sequences and amino acid composition of these
      molecules. These data, in combination with the DNA sequence, locate the ant gene and define the complete amino acid
      sequence of antirepressor (300 residues).
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Summarizes the role of the immI-encoded Ant antirepressor in inhibiting C2 repressor function.
    supporting_text: Another early transcript is initiated from P ant in the unique immI region, giving rise to an antirepressor,
      Ant, which functions to inhibit c2 repressor function.
- id: file:genes/BPP22/ant/ant-uniprot.txt
  title: UniProtKB record for ant (P03037)
