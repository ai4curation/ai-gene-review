suggested_questions:
- question: What are the respective structural roles of the N-terminal (PF10547) and C-terminal (PF10548) domains of P22 Ant
    in recognizing divergent lambdoid repressors (P22 C2, lambda cI, and 434 cI)?
  experts:
  - Robert T. Sauer
  - Miriam M. Susskind
suggested_experiments:
- description: Domain-truncation mutagenesis and isothermal titration calorimetry (ITC) binding assays of purified P22 Ant
    N-terminal and C-terminal domains against P22 C2 and lambda cI.
  hypothesis: The conserved C-terminal domain (PF10548) mediates repressor recognition across lambdoid phages, whereas the
    N-terminal domain (PF10547) modulates Ant oligomerization and solubility.
