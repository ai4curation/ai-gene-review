id: P14112
gene_symbol: arf
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Accessory recombination function protein Arf of Salmonella phage P22, a 47-amino-acid early PL operon protein
  that stimulates Erf-dependent homologous recombination of the phage genome in the host cell cytoplasm.
existing_annotations:
- term:
    id: GO:0006310
    label: DNA recombination
  evidence_type: IMP
  original_reference_id: PMID:2738922
  review:
    summary: Genetic deletion and plasmid complementation studies show that arf encodes an accessory recombination function
      required for full P22 homologous recombination and growth when upstream PL genes are deleted.
    action: NEW
    reason: Semerjian et al. (1989) demonstrated that deletion of arf in the absence of upstream PL genes impairs P22 homologous
      recombination and lytic growth, and that this defect is complemented either by plasmid-borne arf or by the bacteriophage
      lambda red recombination genes.
    supported_by:
    - reference_id: PMID:2738922
      supporting_text: Gene arf (accessory recombination function) is located just upstream from erf; it is essential for
        P22 growth in the absence of kil or other genes upstream in PL. The growth defect of P22 bearing a deletion that removes
        arf is complemented by expression of either arf or the lambda red genes from plasmids.
    - reference_id: file:genes/BPP22/arf/arf-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Arf may be recombination-related.'
core_functions:
- description: Accessory recombination factor encoded immediately upstream of erf in the P22 PL operon that promotes phage
    homologous recombination in the host cell cytoplasm.
  directly_involved_in:
  - id: GO:0006310
    label: DNA recombination
  supported_by:
