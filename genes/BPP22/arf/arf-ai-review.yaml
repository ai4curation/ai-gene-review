    supporting_text: Gene arf (accessory recombination function) is located just upstream from erf; it is essential for P22
      growth in the absence of kil or other genes upstream in PL. The growth defect of P22 bearing a deletion that removes
      arf is complemented by expression of either arf or the lambda red genes from plasmids.
  - reference_id: file:genes/BPP22/arf/arf-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: Arf may be recombination-related.'
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Places arf in the early left (PL) recombination operon of the P22 genome immediately upstream of erf.
    supporting_text: The linear double-stranded viral DNA enters the host cell, and circularization occurs, mediated by the
      phage-encoded protein Erf and the host proteins RecA and gyrase ( 50 , 67 ).
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: PMID:2738922
  title: Genetic structure of the bacteriophage P22 PL operon.
  findings:
  - statement: Identifies gene arf (accessory recombination function) immediately upstream of erf and shows that its deletion
      defect is complemented by arf or lambda red genes.
    supporting_text: Gene arf (accessory recombination function) is located just upstream from erf; it is essential for P22
      growth in the absence of kil or other genes upstream in PL. The growth defect of P22 bearing a deletion that removes
      arf is complemented by expression of either arf or the lambda red genes from plasmids.
- id: file:genes/BPP22/arf/arf-uniprot.txt
  title: UniProt:P14112 (VARF_BPP22)
  findings:
  - statement: Arf is a 47-residue protein implicated in phage P22 homologous recombination.
    supporting_text: 'CC   -!- FUNCTION: Arf may be recombination-related.'
suggested_questions:
- question: What is the molecular target of the 47-residue Arf polypeptide during Erf-mediated homologous recombination—does
    it bind Erf directly, bind DNA ends, or recruit a host exonuclease?
  experts:
  - Anthony R. Poteete
  - Kenan C. Murphy
suggested_experiments:
- description: Perform affinity pull-down and surface plasmon resonance binding assays with purified P22 Arf against P22 Erf,
    Abc1, Abc2, and Salmonella host recombination nucleases.
  hypothesis: Arf physically interacts with either the protruding C-terminal domain of the Erf ring or a host exonuclease
    to generate 3' single-stranded DNA overhangs for Erf-mediated strand annealing.
status: COMPLETE
