core_functions:
- description: Catalyzes the hydrolysis of beta-(1->4) linkages between N-acetylmuramic acid and N-acetyl-D-glucosamine residues
    in the Salmonella host peptidoglycan cell wall after escaping from the host cytoplasm through holin (gp13) pores, driving
    peptidoglycan degradation and programmed host cell cytolysis for viral release.
  supported_by:
  - reference_id: PMID:2998005
    supporting_text: The protein product of gene 19 was purified; its amino terminal amino acid sequence is as predicted by
      the DNA sequence. It starts with a single amino terminal methionine residue and is a basic protein with a molecular
      weight of 15,968. Plasmids expressing P22 gene 19, lambda genes R and RZ, and T4 gene e were constructed. All of these
      plasmids were able to complement both lambda R- and P22 19-.
  - reference_id: PMID:16421448
    supporting_text: The X-ray crystal structure of the previously unknown bacteriophage P22 lysozyme, the product of gene
