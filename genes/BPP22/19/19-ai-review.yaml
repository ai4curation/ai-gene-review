  review:
    summary: Gp19 is a biochemically and structurally characterized GH24 lysozyme (EC 3.2.1.17) that complements phage T4
      e- and lambda R- lysis defects.
    action: ACCEPT
    reason: Purified gp19 is a T4-type muramidase (GH24 family; PDB:2ANV, 2ANX) that cleaves beta-1,4 linkages in bacterial
      peptidoglycan and functionally complements both P22 19- and coliphage lambda R- mutants.
    supported_by:
    - reference_id: PMID:2998005
      supporting_text: Gene 19 encodes a protein that has a small degree of amino acid homology with T4 lysozyme, but we could
        detect no homology to lambda R or RZ proteins. The protein product of gene 19 was purified; its amino terminal amino
        acid sequence is as predicted by the DNA sequence. It starts with a single amino terminal methionine residue and is
        a basic protein with a molecular weight of 15,968. Plasmids expressing P22 gene 19, lambda genes R and RZ, and T4
        gene e were constructed. All of these plasmids were able to complement both lambda R- and P22 19-.
    - reference_id: PMID:16421448
      supporting_text: The X-ray crystal structure of the previously unknown bacteriophage P22 lysozyme, the product of gene
        19, has been determined ab initio by direct methods using the program SIR2002.
