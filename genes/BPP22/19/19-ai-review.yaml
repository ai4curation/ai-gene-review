- id: PMID:2998005
  title: 'Phage P22 lysis genes: nucleotide sequences and functional relationships with T4 and lambda genes.'
  findings:
  - statement: P22 gene 19 encodes a 15,968-Da basic lysozyme with sequence homology to T4 lysozyme (gp e) that was purified,
      N-terminally sequenced, and shown to complement both lambda R- and P22 19- mutants.
    supporting_text: Gene 19 encodes a protein that has a small degree of amino acid homology with T4 lysozyme, but we could
      detect no homology to lambda R or RZ proteins. The protein product of gene 19 was purified; its amino terminal amino
      acid sequence is as predicted by the DNA sequence. It starts with a single amino terminal methionine residue and is
      a basic protein with a molecular weight of 15,968. Plasmids expressing P22 gene 19, lambda genes R and RZ, and T4 gene
      e were constructed. All of these plasmids were able to complement both lambda R- and P22 19-.
- id: PMID:2763468
  title: 'Nucleotide sequence of the bacteriophage P22 gene 19 to 3 region: identification of a new gene required for lysis.'
  findings:
  - statement: Confirmed the 3' terminal sequence of gene 19 and mapped the adjacent downstream spanin gene 15.
    supporting_text: The nucleotide sequence of a 2558-bp region of bacteriophage P22 at the right end of the genetic map
      between genes 19 and 3 was determined.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Confirmed the position of the lysozyme homologue gp19 in the P22 late operon.
    supporting_text: The late genes include a holin (gp13), a lysozyme homologue (gp19), and the genes involved in morphogenesis.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Verified the wild-type P22 genome sequence across the lysis cassette.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: PMID:16421448
  title: Extension to 2268 atoms of direct methods in the ab initio determination of the unknown structure of bacteriophage
    P22 lysozyme.
  findings:
  - statement: Determined the 1.04-angstrom X-ray crystal structure of bacteriophage P22 lysozyme (gp19; PDB 2ANV and 2ANX)
      ab initio by direct methods.
    supporting_text: The X-ray crystal structure of the previously unknown bacteriophage P22 lysozyme, the product of gene
      19, has been determined ab initio by direct methods using the program SIR2002.
- id: file:BPP22/19/19-uniprot.txt
  title: UniProtKB entry P09963 (ENLYS_BPP22)
  findings:
  - statement: Gp19 is a cytoplasmic GH24 family endolysin (EC 3.2.1.17) with active-site residues Glu16 and Asp25 that degrades
      host peptidoglycan after holin-mediated inner membrane permeabilization.
    supporting_text: 'FUNCTION: Endolysin with lysozyme activity that degrades host peptidoglycans and participates with the
      holin and spanin proteins in the sequential events which lead to the programmed host cell lysis releasing the mature
      viral particles. Once the holin has permeabilized the host cell membrane, the endolysin can reach the periplasm and
      break down the peptidoglycan layer.'
suggested_questions:
- question: Does the C-terminal basic arginine-rich tract (136-RRRRERALFLS-146) of P22 gp19 contribute to outer membrane permeabilization
    when applied exogenously, as reported for homologous T4-like phage lysozymes with amphipathic C-terminal helices?
  experts:
  - Blaine H. M. Mooers
  - Brian W. Matthews
  - Ry Young
suggested_experiments:
- description: Compare peptidoglycan-hydrolyzing kinetics and outer-membrane bactericidal activity of wild-type recombinant
    gp19 versus C-terminally truncated or charge-neutralized (R136A-R139A) variants against EDTA-treated and intact Salmonella
    enterica serovar Typhimurium cells.
  hypothesis: The positively charged C-terminal alpha-helix (helix 134-145) electrostatically enhances binding to negatively
    charged cell envelope components without being required for intrinsic catalytic turnover at the Glu16/Asp25 active site.
