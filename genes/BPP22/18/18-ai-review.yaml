    supporting_text: A comparison of a 3000-bp sequence of Salmonella phage P22, coding for gene c1 and the replication genes
      18 and 12, with the analogous cII-O-P region of coliphage lambda permits the localization of transcriptional signals,
      an oop RNA species, and the origin of replication (ori) within gene 18.
  - reference_id: file:genes/BPP22/18/18-uniprot.txt
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the phage O protein family. {ECO:0000305}.'
references:
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods.
  findings: []
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: During lytic development of phage P22, viral DNA replication initiates from an origin (Ori) located within
      gene 18.
    supporting_text: In lytic development, DNA replication is initiated from an origin (Ori) located within gene 18 ( 7 )
      in a region which shows superficial similarity to that of coliphage λ (gpO-gpP)
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: PMID:6241581
  title: Sequence analysis of a region from the early right operon in phage P22 including the replication genes 18 and 12.
  findings:
  - statement: The replication origin (ori) of phage P22 is located within gene 18, and the N-terminal domain of gp18 is homologous
      to the lambdoid phage O/phi 82 origin-binding replication initiator proteins.
    supporting_text: A comparison of a 3000-bp sequence of Salmonella phage P22, coding for gene c1 and the replication genes
      18 and 12, with the analogous cII-O-P region of coliphage lambda permits the localization of transcriptional signals,
      an oop RNA species, and the origin of replication (ori) within gene 18.
  - statement: The amino-terminal origin-binding domain of gp18 is homologous to lambdoid phage O and phi 82 replicator proteins.
    supporting_text: Gene c1 and the amino terminal region of gene 18 show homology to the respective lambda genes. In the
      ori domain of the replicator proteins the homology to phi 82 is most pronounced.
- id: file:genes/BPP22/18/18-uniprot.txt
  title: UniProt:P03687 (VG18_BPP22)
  findings:
  - statement: gp18 belongs to the lambdoid phage O replication initiator protein family and contains a winged-helix DNA-binding
      domain.
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the phage O protein family. {ECO:0000305}.'
suggested_questions:
- question: How does the C-terminal domain of P22 gp18 specifically recognize and load the phage-encoded DnaB-family helicase
    gp12 without requiring a separate DnaC/lambda P-like helicase loader?
  experts:
  - Sherwood R. Casjens
  - Horst Backhaus
suggested_experiments:
- description: Determine the cryo-EM structure of the P22 ori-gp18-gp12 prepriming complex to define the molecular interface
    between the gp18 C-terminal domain and the hexameric gp12 replicative helicase.
  hypothesis: The C-terminal domain of P22 gp18 directly binds and remodels the gp12 hexamer ring to load it onto single-stranded
    DNA at the P22 replication origin, bypassing the requirement for a separate lambda P-like loader protein.
status: COMPLETE
