id: P03687
gene_symbol: '18'
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Replication initiator protein gp18 of Salmonella phage P22 that binds the viral origin of replication (ori) embedded
  within the gene 18 coding sequence and recruits the phage-encoded replicative DNA helicase gp12 to initiate lytic viral
  DNA genome replication in the host cell cytoplasm.
existing_annotations:
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: Automated annotation from InterPro IPR006497 (Phage_lambda_VrpO_N) and UniProt keyword KW-0235 (DNA replication)
      is correct in essence but too general; gp18 specifically initiates viral DNA genome replication of phage P22.
    action: MODIFY
    reason: Bacteriophage P22 gp18 is the phage-encoded origin-binding replication initiator protein (lambda O family) that
      initiates replication of the viral dsDNA genome from the ori sequence located within gene 18. The more specific descendant
      term GO:0039693 (viral DNA genome replication) more accurately reflects its role and maintains consistency with the
      partner replicative helicase gp12.
    proposed_replacement_terms:
    - id: GO:0039693
      label: viral DNA genome replication
    supported_by:
    - reference_id: PMID:6241581
      supporting_text: A comparison of a 3000-bp sequence of Salmonella phage P22, coding for gene c1 and the replication
        genes 18 and 12, with the analogous cII-O-P region of coliphage lambda permits the localization of transcriptional
        signals, an oop RNA species, and the origin of replication (ori) within gene 18.
    - reference_id: PMID:11053393
      supporting_text: In lytic development, DNA replication is initiated from an origin (Ori) located within gene 18 ( 7
        ) in a region which shows superficial similarity to that of coliphage λ (gpO-gpP)
- term:
    id: GO:0003688
    label: DNA replication origin binding
  evidence_type: NAS
  original_reference_id: PMID:6241581
  review:
    summary: gp18 belongs to the lambdoid phage O replication initiator family and contains an N-terminal winged-helix DNA-binding
      domain that recognizes the phage P22 replication origin (ori).
    action: NEW
    reason: Sequence analysis of the P22 replication region and homology to lambdoid phage O and phi 82 replication initiator
      proteins establish that gp18 contains an N-terminal origin-binding domain (InterPro:IPR006497, Pfam:PF04492, Gene3D:1.10.10.10)
      that binds the P22 replication origin (ori) located within gene 18.
    supported_by:
    - reference_id: PMID:6241581
      supporting_text: Gene c1 and the amino terminal region of gene 18 show homology to the respective lambda genes. In the
        ori domain of the replicator proteins the homology to phi 82 is most pronounced.
    - reference_id: file:genes/BPP22/18/18-uniprot.txt
      supporting_text: 'CC   -!- SIMILARITY: Belongs to the phage O protein family. {ECO:0000305}.'
core_functions:
- description: Binds the bacteriophage P22 replication origin (ori) embedded within gene 18 and recruits the phage replicative
    DNA helicase gp12 to initiate viral DNA genome replication in the host cell cytoplasm.
  molecular_function:
