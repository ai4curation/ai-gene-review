  evidence_type: IDA
  original_reference_id: PMID:26245366
  qualifier: involved_in
  review:
    summary: Internal virion protein gp16 is ejected ahead of the viral DNA genome when P22 is triggered by both host LPS
      and OmpA.
    action: ACCEPT
    reason: In vitro ejection kinetics demonstrate that gp16 is released from the capsid prior to viral DNA upon co-stimulation
      by host LPS and OmpA.
    supported_by:
    - reference_id: PMID:26245366
      supporting_text: In contrast, E proteins are not ejected unless both OmpA and LPS are present and their ejection when
        OmpA is present is largely complete before any genome is ejected, suggesting that E proteins play a key role in the
        early stage of transferring P22 DNA into the host.
- term:
