  review:
    summary: Virions lacking gp16 fail to induce host cytoplasmic K+ efflux or inject viral DNA, and C-terminal mutations
      in gp16 (G532W, P546S) together with gp20 mutations confer escape from inner-membrane SieA superinfection exclusion.
    action: ACCEPT
    reason: Genetic knockout and SieA escape mutant analyses establish that gp16 is required for K+ release across the host
      inner membrane and viral DNA translocation into the cytoplasm, interacting functionally with gp20.
    supported_by:
    - reference_id: PMID:38236051
      supporting_text: In other words, all three E-proteins are required for K+ release and for DNA injection.
    - reference_id: PMID:38236051
      supporting_text: Since amino acid changes in E-proteins gp16 and gp20 confer escape from SieA exclusion, we conclude
        that SieA very likely blocks P22 DNA injection by interfering with the functions of these two proteins and that the
        mutations avoid this interference.
