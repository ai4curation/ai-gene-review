references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:1585633
  title: Cloning, sequencing, and overexpression of gene 16 of Salmonella bacteriophage P22.
  findings:
  - statement: P22 gene 16 encodes a 609-amino-acid (64.4 kDa) internal virion protein that does not bind the ends of linear
      DNA to protect them from exonucleases in vitro.
    supporting_text: Within the sequenced region there is an open reading frame that could encode a protein of 609 amino acids
      having a molecular weight of 64,366.
- id: PMID:26245366
  title: Bacteriophage P22 ejects all of its internal proteins before its genome.
  findings:
  - statement: All three internal ejection proteins (gp16, gp20, and gp7) are packaged at 10-20 copies per procapsid via the
      scaffolding protein and are ejected prior to viral DNA upon recognition of both host LPS and OmpA.
    supporting_text: From this we conclude that in the presence of LPS and OmpA all three E proteins are ejected prior to
      DNA ejection.
- id: PMID:29590587
  title: Cryo-EM Elucidation of the Structure of Bacteriophage P22 Virions after Genome Release.
  findings:
  - statement: Cryo-EM of P22 virions after genome release shows remodeling of the internal ejection proteins at the distal
      end of the tail hub.
    supporting_text: Previous studies have shown that particles lacking the gp26 plug contain ejection proteins associated
      with them ( 13 ), and since the structures and location of all P22 virion proteins are known in the mature virus except
      for the three ejection proteins, we believe that this tube-like density is likely to be a remodeled form of one of these
      proteins (gp16, gp7, or gp20).
- id: PMID:30886360
  title: Structural dynamics of bacteriophage P22 infection initiation revealed by cryo-electron tomography.
  findings:
  - statement: Ejected gp16 inserts into the cytoplasmic membrane to complete the ~40 nm trans-envelope genome delivery apparatus
      during infection of Salmonella minicells.
    supporting_text: Insertion of the third ejected protein, gp16, into the cytoplasmic membrane probably completes the overall
      trans-envelope channel into the cytoplasm.
- id: PMID:328927
  title: E proteins of bacteriophage P22. I. Identification and ejection from wild-type and defective particles.
  findings:
  - statement: Phage particles lacking gp16 fail to eject gp7 and are defective in DNA delivery, whereas particles lacking
      gp7 or gp20 still eject their remaining E proteins.
    supporting_text: Phage particles that lack gp7 (7- particles) or gp20 (20- particles) successfully eject all their E proteins.
      The 16- particles do not eject gp7.
- id: PMID:38236051
  title: Bacteriophage P22 SieA-mediated superinfection exclusion.
  findings:
  - statement: Ejection protein gp16 is required for host K+ efflux and DNA injection, must interact specifically with cognate
      gp20 during DNA delivery, and is targeted along with gp20 by the inner-membrane superinfection exclusion protein SieA.
    supporting_text: Since amino acid changes in E-proteins gp16 and gp20 confer escape from SieA exclusion, we conclude that
      SieA very likely blocks P22 DNA injection by interfering with the functions of these two proteins and that the mutations
      avoid this interference.
