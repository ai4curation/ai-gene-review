suggested_questions:
- question: What is the stoichiometry and transmembrane topology of the gp16 cytoplasmic-membrane pore, and how do the C-terminal
    residues G532 and P546 interface with periplasmic gp20 and the prophage superinfection exclusion protein SieA?
  experts:
  - Sherwood R. Casjens
  - Ian J. Molineux
  - Jun Liu
suggested_experiments:
- description: Reconstitute purified P22 gp16 and gp20 into proteoliposomes with or without purified inner-membrane SieA,
    and determine the cryo-EM structure and single-channel K+/DNA conductance properties of wild-type versus SieA-escape (gp16
    P546S / gp20 T341I) complexes.
  hypothesis: The C-terminal domain of gp16 docks directly onto the distal tip of the periplasmic gp20 tube at the inner membrane
    surface, and SieA binds this gp16-gp20 junction to prevent conductive pore opening.
