  qualifier: involved_in
  review:
    summary: Cryo-EM analysis of P22 virions after genome release implicates the internal ejection proteins in forming the
      extended genome delivery conduit.
    action: ACCEPT
    reason: Cryo-EM comparisons of mature and post-ejection P22 virions show how internal ejection proteins remodel after
      gp26 release to support genome ejection.
    supported_by:
