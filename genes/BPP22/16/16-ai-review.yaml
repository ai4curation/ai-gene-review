  label: Lederbergvirus P22
description: Internal virion ejection protein (gp16, 609 AA) of Salmonella phage P22 that is packaged at approximately 10
  to 20 copies per procapsid via the scaffolding protein gp8 and is required inside the virion for ejection of gp7. Upon virion
  binding to host lipopolysaccharide and outer membrane protein OmpA, gp16 is ejected prior to the viral genome, partitions
  into the host cytoplasmic membrane, and assembles with the periplasmic gp20 channel into the inner-membrane pore of the
  ~40 nm trans-envelope DNA translocation conduit, mediating cytoplasmic membrane depolarization (K+ release) and viral DNA
  entry into the cytoplasm while serving as a primary target of prophage SieA-mediated superinfection exclusion.
