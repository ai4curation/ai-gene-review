- term:
    id: GO:0098669
    label: superinfection exclusion
  evidence_type: IDA
  original_reference_id: PMID:38236051
  review:
    summary: Plasmid-expressed SieA is necessary and sufficient to exclude superinfecting P22 and related phages by blocking
      DNA delivery across the host inner membrane via the gp20/gp16 conduit.
    action: ACCEPT
    reason: PMID:38236051 directly demonstrates that SieA alone mediates superinfection exclusion against P22-like phages
      by interfering with the ejected gp16/gp20 DNA translocation conduit.
    supported_by:
    - reference_id: PMID:38236051
      supporting_text: Here we report that the P22-encoded SieA protein is necessary and sufficient for exclusion by the SieA
        system and that it is an inner membrane protein that blocks DNA injection by P22 and its relatives, but has no effect
        on infection by other tailed phage types.
    - reference_id: PMID:38236051
      supporting_text: Our data strongly suggest a model in which the inner membrane protein SieA interferes with the assembly
        or function of the periplasmic gp20 and membrane-bound gp16 DNA delivery conduit.
