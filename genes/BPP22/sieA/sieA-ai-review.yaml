    label: host cell plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:7768804
  review:
    summary: SieA is an integral protein of the host bacterial inner membrane (plasma membrane) with three transmembrane segments
      and is recovered in the inner membrane fraction.
    action: ACCEPT
    reason: Membrane fractionation and sequence analysis in PMID:7768804, together with PhoA/LacZ topology assays and sucrose
      gradient membrane fractionation in PMID:38236051, directly establish that SieA localizes to the host cell inner membrane
      (plasma membrane).
    supported_by:
    - reference_id: PMID:7768804
      supporting_text: According to three hydrophobic regions, all of which are long enough to span the membrane, the product
        of sieA should be a protein of the inner membrane of a P22-lysogenic cell of Salmonella typhimurium. The SieA protein
        was moderately overproduced from an expression vector in cultures of Escherichia coli and could be recovered from
        the membrane fraction.
    - reference_id: PMID:38236051
      supporting_text: We conclude that SieA is an exclusively inner membrane protein.
