id: Q38674
gene_symbol: sieA
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Superinfection exclusion protein A (SieA) of Salmonella phage P22 is a 164-amino-acid, three-transmembrane integral
  protein of the host bacterial inner membrane (plasma membrane) expressed by the prophage during lysogeny. SieA is necessary
  and sufficient for the P22 SieA superinfection exclusion system, which prevents DNA translocation across the host inner
  membrane by superinfecting P22-like phages and P22 generalized transducing particles by interfering with the assembly or
  function of the periplasmic gp20 and inner-membrane gp16 DNA delivery conduit.
existing_annotations:
