    label: superinfection exclusion
  evidence_type: IDA
  original_reference_id: PMID:38236051
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      CACAO row from Leavitt et al. 2024, which shows that one chromosomal copy of sieA is
      sufficient to lower P22 plaque formation by at least seven orders of magnitude
      (Fig. 1) and that SieA blocks DNA injection itself, measured as loss of
      infection-triggered K+ efflux (Fig. 2A). This is the core function.
    action: ACCEPT
    reason: >-
      What the paper shows for this gene: sieA alone, at single copy under its own
      promoter and with no effect on host growth, confers the exclusion phenotype
      (Fig. 1); infection of the sieA+ strain releases almost no K+ while the isogenic
      sieA- strain releases nearly all of it, placing the block at DNA entry rather than
      at adsorption or at a later step (Fig. 2A); escape mutants map to the ejection
      proteins gp16 and gp20, tying the block mechanistically to the DNA delivery conduit.
      The CACAO term matches the assay exactly and is the correct granularity for a
      prophage-encoded exclusion protein, so this is not a phenotype read as a process.
      Accepted as core.
    supported_by:
    - reference_id: PMID:38236051
      supporting_text: Thus, the sieA gene in one copy per Salmonella genome is sufficient
        to mediate robust superinfection exclusion.
    - reference_id: PMID:38236051
      supporting_text: Figure 2A shows that P22 causes very little, if any, K+ release
        from the sieA+ strain, while nearly all of the cellular K+ is released from the
        isogenic sieA– strain, suggesting that DNA injection per se is blocked by SieA.
    - reference_id: PMID:38236051
      supporting_text: We conclude from the above results that SieA alone blocks injection
        of P22 DNA into Salmonella cells and has no other additional effect on P22 growth.
