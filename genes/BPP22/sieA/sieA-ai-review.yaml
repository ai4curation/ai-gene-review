suggested_questions:
- question: Does SieA directly bind the periplasmic pilot protein gp20, the inner-membrane conduit protein gp16, or both to
    prevent formation of the trans-envelope DNA translocation channel?
suggested_experiments:
- description: Perform in vivo site-specific photocrosslinking and co-immunoprecipitation between epitope-tagged SieA and
    ejected gp16/gp20 proteins during P22 infection of Salmonella enterica to identify the direct physical interaction interface.
  hypothesis: SieA directly contacts specific transmembrane or periplasmic segments of gp16 and/or gp20 during ejection, arresting
    assembly of a functional inner-membrane DNA conduit.
