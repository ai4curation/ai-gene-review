id: Q38674
gene_symbol: sieA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: >-
  SieA is a small prophage-expressed integral membrane protein of Salmonella phage P22
  (162 or 164 residues; the start codon is uncertain) with three predicted transmembrane
  helices and no recognisable catalytic motif. Expressed from the P22 prophage in a
  lysogen, it resides exclusively in the host inner membrane and mediates superinfection
  exclusion: it blocks injection of the DNA of superinfecting P22 and other P22-like
  phages, and of P22 transducing particles, across the inner membrane. Adsorption of the
  superinfecting virion, host growth, and progeny production after prophage induction are
  unaffected, and unrelated tailed phages are not excluded. A single chromosomal copy of
  sieA is necessary and sufficient for exclusion. Phage mutations that escape the block
  map to the C-terminal regions of the ejection proteins gp16 and gp20, supporting a model
  in which SieA interferes with the assembly or function of the trans-envelope DNA
  delivery conduit built from the ejection proteins; the molecular activity by which it
  does so is unknown. SieA homologs occur in P22-like prophages of several enteric genera
  and fall into three sequence types less than 30% identical to one another.
