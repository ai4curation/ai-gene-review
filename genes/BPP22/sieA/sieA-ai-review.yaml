  title: 'The superinfection exclusion gene (sieA) of bacteriophage P22: identification
    and overexpression of the gene and localization of the gene product.'
  findings:
  - statement: >-
      The sieA gene encodes a predicted multi-pass membrane protein with three
      membrane-spanning hydrophobic regions, inferred to lie in the inner membrane of the
      lysogenic Salmonella cell.
    supporting_text: According to three hydrophobic regions, all of which are long enough
      to span the membrane, the product of sieA should be a protein of the inner membrane
      of a P22-lysogenic cell of Salmonella typhimurium.
    reference_section_type: ABSTRACT
  - statement: >-
      Overproduced SieA is recovered from the membrane fraction, without separation of
      inner from outer membrane.
    supporting_text: The SieA protein was moderately overproduced from an expression
      vector in cultures of Escherichia coli and could be recovered from the membrane
      fraction.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
