core_functions:
- description: >-
    Prophage-encoded inner membrane protein that blocks injection of superinfecting
    P22-like phage DNA across the host plasma (inner) membrane, apparently by interfering
    with the assembly or function of the gp16/gp20 ejection-protein conduit, thereby
    excluding superinfection of the lysogen. No GO molecular function term is assigned
    because the molecular activity underlying the block is unknown.
  supported_by:
  - reference_id: PMID:38236051
    supporting_text: the P22-encoded SieA protein is necessary and sufficient for
      exclusion by the SieA system and that it is an inner membrane protein that blocks
      DNA injection by P22 and its relatives, but has no effect on infection by other
      tailed phage types
  - reference_id: PMID:38236051
    supporting_text: Since amino acid changes in E-proteins gp16 and gp20 confer escape
      from SieA exclusion, we conclude that SieA very likely blocks P22 DNA injection by
      interfering with the functions of these two proteins and that the mutations avoid
      this interference.
  - reference_id: PMID:4610992
    supporting_text: Failure of superinfecting phage DNA to enter sieA+ lysogens.
  directly_involved_in:
  - id: GO:0098669
    label: superinfection exclusion
  locations:
  - id: GO:0020002
    label: host cell plasma membrane
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity of SieA is undetermined: it is not known whether SieA binds
      the ejection proteins gp16 or gp20 directly, occludes their site of action at the
      inner membrane, or alters the membrane so that the injection conduit cannot
      assemble. No binding or reconstitution assay has been reported.
    boundary: >-
      What is established: SieA is an inner membrane protein, one chromosomal copy is
      necessary and sufficient for exclusion, the block is at DNA translocation (no K+
      efflux on infection), and escape requires amino acid changes in the C-terminal
      regions of gp16 and gp20.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      Without the activity, SieA can only be annotated to a process term; the mechanism is
      also the generalizable part, since several unrelated prophage proteins block phage
      DNA injection by unknown means.
    resolution: >-
      Interaction and reconstitution experiments with SieA and the P22 ejection proteins
      (see suggested_experiments).
    provenance:
    - reference_id: PMID:38236051
      supporting_text: strongly suggest that SieA protein interferes with assembly of the
        E-protein conduit or with conduit function after its assembly
    - reference_id: PMID:38236051
      supporting_text: prophage-encoded proteins can block DNA injection by unknown
        mechanisms
  - gap_statement: >-
      The basis of SieA target specificity is unknown: it excludes P22-like phages but not
      other short-tailed phages such as SP6, and two of the three divergent SieA sequence
      types show no detectable difference in target range.
    boundary: >-
      What is established: P22 SieA excludes P22 and P22-like phages including L, MG40,
      MG178 and LP7, hybrids carrying HK620 ejection proteins are only partially
      resistant, and non-P22-like tailed phages plate equally on sieA+ and sieA- hosts.
    gap_kind:
    - BIOLOGY
    significance: >-
      Specificity determinants would identify the feature of the ejection-protein conduit
      that SieA recognises, and thus the range over which such exclusion systems act.
    resolution: >-
      Chimeras between the three SieA sequence types assayed against P22-like and
      non-P22-like phages (see suggested_experiments).
    provenance:
    - reference_id: PMID:38236051
      supporting_text: Since SP6 is not affected, the P22 SieA protein does not exclude
        all short-tailed phages and appears to be specific for P22-like phages.
    - reference_id: PMID:38236051
      supporting_text: yet comparison of two of these types found no differences in phage
        target specificity
suggested_questions:
- question: >-
    Does SieA act by direct protein-protein contact with the P22 ejection proteins gp16
    and gp20, or indirectly by modifying the inner membrane environment in which the
    injection conduit assembles?
  experts:
  - Sherwood R. Casjens
  - Justin C. Leavitt
- question: >-
    What is the relationship between SieA and the host inner membrane protein YajC, which
    is itself essential for P22 DNA injection? SieA-resistant phages still fail to plate
    on a yajC mutant host, so the two requirements appear separable.
  experts:
  - Sherwood R. Casjens
- question: >-
    Would GO benefit from a molecular function term for prophage-encoded inhibition of
    phage genome translocation across the host inner membrane, so that exclusion proteins
    such as SieA can be annotated at the activity level and not only to the process term
    GO:0098669?
- question: >-
    Which of the two possible start codons is used in vivo, and what is the membrane
    topology of the conserved cytoplasmic-side motif FxRYPxEAxxFNK (P22 SieA residues
    145-157) shared by all three SieA sequence types?
  experts:
  - Carolyn M. Teschke
suggested_experiments:
- hypothesis: >-
    SieA binds the P22 ejection proteins gp16 and/or gp20, and escape mutations weaken
    that interaction.
  description: >-
    Co-purify FLAG-tagged SieA from inner membranes of infected sieA+ Salmonella and probe
    for gp16 and gp20, comparing wild-type ejection proteins with the escape variants
    gp16 P546S, gp16 G532W and gp20 G350D; complement with in vivo crosslinking or a
    bacterial two-hybrid assay suited to membrane-embedded partners.
  experiment_type: protein interaction assay
- hypothesis: >-
    SieA is itself sufficient to block conduit formation or DNA translocation, with no
    other phage or host factor required.
  description: >-
    Reconstitute purified SieA into proteoliposomes or inverted inner membrane vesicles
    and assay ejection-protein conduit formation and DNA translocation in vitro,
    distinguishing a direct steric or binding activity from an indirect membrane effect.
  experiment_type: in vitro reconstitution
- hypothesis: >-
    Target specificity is determined by a defined region of SieA, likely in the
    membrane-embedded or periplasmic segments rather than the type-specific N-terminal
    extensions.
  description: >-
    Construct chimeras between the three SieA sequence types (A, B, C), including swaps of
    the N-terminal extensions unique to types B and C, and assay exclusion of P22, of
    P22 hybrids carrying heterologous ejection protein genes (HK620, Sf6, L, CUS-3) and of
    non-P22-like phages such as SP6.
  experiment_type: chimera / structure-function analysis
- hypothesis: >-
    The conserved FxRYPxEAxxFNK motif lies on the cytoplasmic face and is required for
    exclusion.
  description: >-
    Determine SieA topology experimentally by substituted-cysteine accessibility or
    dual-reporter (PhoA/LacZ) fusions at defined positions, then mutate the conserved
    motif and measure exclusion efficiency and K+ efflux upon P22 infection.
  experiment_type: membrane topology mapping and mutagenesis
