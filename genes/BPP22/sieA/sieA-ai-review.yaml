    summary: >-
      UniProt-assigned experimental row for the host (bacterial) inner membrane location
      of SieA, from Hofer et al. 1995. The location claim is correct and is now directly
      demonstrated by inner/outer membrane fractionation in Leavitt et al. 2024.
    action: ACCEPT
    reason: >-
      The cached PMID:7768804 record is abstract-only (PMC returns no full text), and the
      experimental content described there is recovery of overproduced SieA from a crude
      membrane fraction, with the inner-membrane assignment inferred from three
      hydrophobic segments; Leavitt et al. 2024 note explicitly that the 1995 study did
      not resolve inner from outer membrane. The claim nonetheless holds: FLAG-tagged,
      exclusion-competent SieA partitions with the inner and not the outer membrane
      (PMID:38236051, Fig. 3B), and this is where SieA acts on injecting phage DNA. The
      term is therefore accepted as a core location rather than modified.
