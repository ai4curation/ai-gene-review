- id: PMID:38236051
  title: Bacteriophage P22 SieA-mediated superinfection exclusion.
  findings:
  - statement: >-
      A single chromosomal copy of P22 sieA is sufficient to lower P22 plaque formation by
      at least seven orders of magnitude, with no effect on host growth.
    supporting_text: Thus, the sieA gene in one copy per Salmonella genome is sufficient
      to mediate robust superinfection exclusion.
    reference_section_type: RESULTS
  - statement: >-
      SieA blocks DNA injection itself: infection of a sieA+ strain causes almost no K+
      efflux, whereas the isogenic sieA- strain releases nearly all cellular K+.
    supporting_text: Figure 2A shows that P22 causes very little, if any, K+ release from
      the sieA+ strain, while nearly all of the cellular K+ is released from the isogenic
      sieA– strain, suggesting that DNA injection per se is blocked by SieA.
    reference_section_type: RESULTS
  - statement: >-
      FLAG-tagged, exclusion-competent SieA fractionates with the inner membrane and is
      absent from the outer membrane.
    supporting_text: We conclude that SieA is an exclusively inner membrane protein.
    reference_section_type: RESULTS
  - statement: >-
      Escape from SieA requires amino acid changes in the C-terminal regions of the
      ejection proteins gp16 and gp20, implicating the DNA delivery conduit as the target.
    supporting_text: Since amino acid changes in E-proteins gp16 and gp20 confer escape
      from SieA exclusion, we conclude that SieA very likely blocks P22 DNA injection by
      interfering with the functions of these two proteins and that the mutations avoid
      this interference.
    reference_section_type: RESULTS
  - statement: >-
      Exclusion is specific for P22-like phages; unrelated tailed phages, including the
      short-tailed phage SP6, plate equally on sieA+ and sieA- hosts.
    supporting_text: Since SP6 is not affected, the P22 SieA protein does not exclude all
      short-tailed phages and appears to be specific for P22-like phages.
    reference_section_type: DISCUSSION
  reference_review:
