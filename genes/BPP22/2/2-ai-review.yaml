suggested_questions:
- question: How many gp2 protomers assemble onto the dodecameric portal ring (gp1) during active DNA translocation once the
    transient 1S-terminase:2L-terminase initiation complex docks at the procapsid vertex?
  experts:
  - Gino Cingolani
  - Sherwood R. Casjens
suggested_experiments:
- description: Reconstitute the active P22 procapsid-portal-terminase-DNA packaging motor in vitro in the presence of ATPgammaS
    and determine its structure by single-particle cryo-EM.
  hypothesis: Docking onto the dodecameric portal vertex recruits a pentameric ring of gp2 ATPase-nuclease subunits that switches
    between translocation and headful cleavage states in response to portal core compression.
