- id: PMID:22715098
  title: Structure of p22 headful packaging nuclease.
  findings:
  - statement: The 2.02 Å crystal structure of the C-terminal headful packaging nuclease domain of P22 gp2 reveals an RNase
      H-like seven-stranded beta-sheet fold coordinating two catalytic Mg2+ ions and exhibiting endonuclease activity in full-length
      gp2.
    supporting_text: The 2.02 Å crystal structure of P22 headful nuclease obtained by in-drop proteolysis of full-length L-terminase
      (FL-L-terminase) reveals a central seven-stranded β-sheet core that harbors two magnesium ions.
  - statement: Isolated nuclease domain is autoinhibited by an extended beta-hairpin, whereas full-length L-terminase is an
      active endonuclease in vitro.
    supporting_text: Accordingly, the isolated nuclease is completely inactive in vitro, whereas it exhibits endonucleolytic
      activity in the context of FL-L-terminase.
- id: PMID:22771211
  title: Small terminase couples viral DNA binding to genome-packaging ATPase activity.
  findings:
  - statement: DNA-bound S-terminase (gp3) specifically stimulates the ATPase activity of L-terminase (gp2).
    supporting_text: Upon binding to its own DNA, S-terminase functions as a specific activator of L-terminase ATPase activity.
- id: PMID:26301600
  title: Architecture of the Complex Formed by Large and Small Terminase Subunits from Bacteriophage P22.
  findings:
  - statement: Two protomers of L-terminase (gp2) bind via residues 1-58 to one nonameric ring of S-terminase (gp3) and bind
      ATP specifically at the N-terminal ATPase domain.
    supporting_text: In vivo assembled terminase complex was affinity-purified and stabilized by addition of non-hydrolyzable
      ATP, which binds specifically to the ATPase domain of L-terminase. Mapping studies revealed that the N-terminus of L-terminase
      ATPase domain (residues 1-58) contains a minimal S-terminase binding domain sufficient for stoichiometric association
      with residues 140-162 of S-terminase, the L-terminase binding domain.
- id: PMID:28134243
  title: Portal protein functions akin to a DNA-sensor that couples genome-packaging to icosahedral capsid maturation.
  findings:
  - statement: Once ~43 kbp of viral DNA have been packaged to fill the capsid, the nuclease domain of L-terminase (gp2) cleaves
      the DNA and dissociates from the portal vertex.
    supporting_text: After ∼43 kilobase pairs of genome have been encapsulated and the capsid is full, the nuclease domain
      of L-terminase cleaves DNA, releasing P22 genome and causing dissociation of terminase.
