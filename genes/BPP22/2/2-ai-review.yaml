taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Terminase large subunit (gp2) of Salmonella phage P22 that serves as the catalytic motor and endonuclease of
  the viral terminase complex during headful DNA genome packaging. It comprises an N-terminal P-loop ATPase domain (residues
  1-271) that binds the small terminase subunit (gp3) and hydrolyzes ATP to translocate viral DNA into the procapsid, and
  a C-terminal RNase H-like endonuclease domain (residues 289-499) that coordinates two Mg2+ ions to cleave concatemeric viral
  dsDNA at packaging initiation and headful termination.
