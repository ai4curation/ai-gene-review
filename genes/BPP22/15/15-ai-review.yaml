core_functions:
- description: Acts as the inner membrane subunit (i-spanin) of the periplasm-spanning gp15-Rz1 spanin complex that disrupts
    the host outer membrane via local inner-outer membrane fusion after peptidoglycan degradation, completing host cell lysis
    for virion release.
