- id: PMID:2763468
  title: 'Nucleotide sequence of the bacteriophage P22 gene 19 to 3 region: identification of a new gene required for lysis.'
  findings:
  - statement: Sequenced P22 gene 15 between genes 19 and 3, showed through gene 15 loss-of-function mutants that gp15 is
      required for host lysis in the presence of divalent cations, and demonstrated functional equivalence with phage T7 gene
      18.5 and homology to phage lambda Rz.
    supporting_text: A new gene that is partially required for lytic growth, named gene 15, was noted. P22 mutants were constructed
      which lack gene 15 function, and the gene 15 product was found to be required for lysis in the presence of some divalent
      cations. It has extensive amino acid sequence similarity with the phage lambda Rz gene, which has a similar function,
      and weak similarity to the phage T7 18.5 gene which previously had no known function. A hybrid P22 phage, in which the
      T7 18.5 gene replaces the P22 gene 15, exhibits the plating properties of wild-type P22, strongly suggesting that the
      two genes have similar functions.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Completed the genome sequence of Salmonella phage P22 including the lysis region containing gene 15.
    supporting_text: The sequence of the nonredundant region of the Salmonella enterica serovar Typhimurium temperate, serotype-converting
      bacteriophage P22 has been completed.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reported the revised genome sequence and annotation of bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:BPP22/15/15-uniprot.txt
  title: UniProtKB record for 15 (P13583)
  findings:
  - statement: Describes P22 gp15 (P13583) as a 145-amino-acid inner membrane spanin subunit (InterPro:IPR004929, Pfam:PF03245,
      HAMAP:MF_04137) that forms a disulfide-linked homodimer in the host cell inner membrane and interacts with the outer
      lipoprotein subunit Rz1 across the periplasm to disrupt the host outer membrane during viral exit.
    supporting_text: 'FUNCTION: Component of the spanin complex that disrupts the host outer membrane and participates in
      cell lysis during virus exit. The spanin complex conducts the final step in host lysis by disrupting the outer membrane
      after holin and endolysin action have permeabilized the inner membrane and degraded the host peptidoglycans. Host outer
      membrane disruption is due to local fusion between the inner and outer membrane performed by the spanin complex.'
suggested_questions:
- question: Does P22 gp15 require covalent interchain disulfide bond formation at both Cys92 and Cys143 via the host DsbA/DsbC
    system for functional spanin complex maturation in Salmonella enterica, analogous to lambda Rz?
  experts:
  - Ryland Young
  - Sherwood R. Casjens
suggested_experiments:
- description: Perform non-reducing SDS-PAGE and site-directed mutagenesis of Cys92 and Cys143 in P22 gp15 and Cys29 in Rz1
    during infection of wild-type and dsbA-deficient Salmonella Typhimurium to test the requirement of periplasmic disulfide
    bonding for outer membrane disruption.
  hypothesis: Covalent homodimerization of gp15 and/or Rz1 is required for the conformational transition that fuses the inner
    and outer membranes after peptidoglycan degradation.
