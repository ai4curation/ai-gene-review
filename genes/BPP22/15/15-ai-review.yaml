- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: Core biological process of the inner membrane spanin subunit gp15 in disrupting the host outer membrane during
      phage P22 progeny release.
    action: ACCEPT
    reason: Genetic characterization of P22 gene 15 mutants and functional substitution by phage T7 gene 18.5 demonstrate
      that gp15 is required for host outer membrane disruption and cell lysis during viral release, particularly in the presence
      of divalent cations.
    supported_by:
    - reference_id: PMID:2763468
      supporting_text: A new gene that is partially required for lytic growth, named gene 15, was noted. P22 mutants were
        constructed which lack gene 15 function, and the gene 15 product was found to be required for lysis in the presence
        of some divalent cations. It has extensive amino acid sequence similarity with the phage lambda Rz gene, which has
        a similar function, and weak similarity to the phage T7 18.5 gene which previously had no known function. A hybrid
        P22 phage, in which the T7 18.5 gene replaces the P22 gene 15, exhibits the plating properties of wild-type P22, strongly
        suggesting that the two genes have similar functions.
    - reference_id: file:BPP22/15/15-uniprot.txt
      supporting_text: 'FUNCTION: Component of the spanin complex that disrupts the host outer membrane and participates in
        cell lysis during virus exit. The spanin complex conducts the final step in host lysis by disrupting the outer membrane
        after holin and endolysin action have permeabilized the inner membrane and degraded the host peptidoglycans. Host
        outer membrane disruption is due to local fusion between the inner and outer membrane performed by the spanin complex.'
