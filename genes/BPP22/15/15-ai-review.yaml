  label: Lederbergvirus P22
description: Inner membrane spanin subunit (i-spanin gp15, also called Rz) of Salmonella phage P22. It is a single-pass type
  II inner membrane protein with a periplasmic domain that forms a disulfide-linked homodimer and interacts via its C-terminus
  with the outer membrane lipoprotein spanin subunit Rz1 across the periplasmic space. Following inner membrane permeabilization
  by holin gp13 and peptidoglycan degradation by endolysin gp19, the gp15-Rz1 spanin complex disrupts the host outer membrane
  through local membrane fusion, which is essential for efficient virion release by cytolysis, particularly when divalent
  cations stabilize the outer membrane.
