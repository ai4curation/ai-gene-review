id: P69202
gene_symbol: C2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Primary immunity repressor (C2) of Salmonella phage P22 that establishes and maintains the lysogenic state by
  binding cooperatively to the OL and OR operator sites via an N-terminal Cro/C1-type helix-turn-helix DNA-binding domain,
  repressing transcription of early lytic genes from the PL and PR promoters. Contains a C-terminal LexA/cI-like Peptidase
  S24 domain that undergoes RecA-stimulated intramolecular autoproteolysis during the host SOS response, inactivating the
  repressor and triggering prophage induction (release from viral latency).
