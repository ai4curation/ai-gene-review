suggested_questions:
- question: How does the non-covalent inactivation of P22 C2 by the Ant antirepressor compare structurally with RecA-stimulated
    C-terminal autoproteolysis?
  experts:
  - Robert T. Sauer
  - Carl O. Pabo
suggested_experiments:
- description: Cryo-EM or X-ray crystallographic determination of full-length P22 C2 bound to the Ant antirepressor to resolve
    how Ant sterically or allosterically prevents C2 operator binding without cleaving the C-terminal S24 domain.
  hypothesis: Ant binds the C-terminal dimerization/S24 domain or linker of C2 to misorient the N-terminal HTH domains, preventing
    cooperative operator binding while leaving the polypeptide intact.
