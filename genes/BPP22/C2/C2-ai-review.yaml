references:
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:7260059
  title: Primary structure of the phage P22 repressor and its gene c2.
  findings:
  - statement: Determined the complete 216-residue amino acid sequence of the P22 C2 repressor and demonstrated homology of
      its C-terminal 133 residues to the coliphage lambda cI repressor.
    supporting_text: The repressor is a single-chain 216 amino acid polypeptide. Basic residues in the sequence tend to be
      clustered, and residues 9-20 are highly basic, containing five arginyl and three lysyl residues. The carboxyl-terminal
      133 amino acids of the c2 repressor are homologous to the carboxyl-terminal sequence of the coliphage lambda cI repressor.
- id: PMID:8289306
  title: Determination of the nuclear magnetic resonance structure of the DNA-binding domain of the P22 c2 repressor (1 to
    76) in solution and comparison with the DNA-binding domain of the 434 repressor.
  findings:
  - statement: Solved the solution NMR structure of the N-terminal DNA-binding domain of P22 C2 repressor (residues 1-76),
      revealing five alpha-helical segments containing the helix-turn-helix motif.
    supporting_text: The solution structure of the N-terminal DNA-binding domain of the P22 c2 repressor (residues 1 to 76)
      was determined by nuclear magnetic resonance (NMR) spectroscopy.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Summarizes the role of the C2 repressor in conferring prophage immunity and repressing lytic replication of
      homoimmune phage genomes.
    supporting_text: In the lysogenic state, P22 expresses three different systems that may interfere with superinfection
      by homologous phages. These are immunity conferred by the prophage repressor ( c2 ), superinfection exclusion mediated
      by the sieA and sieB genes, and serotype conversion. The presence of the C2 protein represses the replication of homoimmune
