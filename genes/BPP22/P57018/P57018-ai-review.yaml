id: P57018
gene_symbol: P57018
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Uncharacterized 80-residue (9.0 kDa) protein (ORF80) encoded in the late operon intergenic region between spanin
  gene 15 and morphogenetic gene 3 of Salmonella phage P22. It belongs to the conserved DUF2560 / Phage_P22_Orf80 protein
  family (InterPro:IPR022544, Pfam:PF10834) and has no experimentally established molecular function or biological role.
existing_annotations: []
core_functions: []
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identified ORF80 (P57018) between gene 15 and ORF201 in the complete genome sequence and ORF reanalysis of
      Salmonella phage P22.
    supporting_text: The sequence was reanalyzed using more modern algorithms, revealing a total of 65 ORFs, 29 (45%) of which
      showed no similarity to those of any other protein in the GenBank protein database.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Confirmed the genome sequence and annotation of bacteriophage P22 including ORF80.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:BPP22/P57018/P57018-uniprot.txt
  title: UniProtKB record for P57018 (P57018)
  findings:
  - statement: Annotates P57018 (ORF80) as a predicted 80-residue protein containing the Phage_P22_Orf80 / DUF2560 domain
      (InterPro:IPR022544, Pfam:PF10834).
    supporting_text: DR   InterPro; IPR022544; Phage_P22_Orf80.
suggested_questions:
- question: What is the biological role of the conserved DUF2560 / Phage_P22_Orf80 protein encoded between the lysis cassette
    and the morphogenetic packaging genes in P22-like phages?
  experts:
  - Sherwood R. Casjens
  - Andrew M. Kropinski
suggested_experiments:
- description: Measure expression of ORF80 (P57018) by ribosome profiling during late lytic infection and screen an epitopically
    tagged ORF80 fusion for protein-protein interactions in Salmonella enterica serovar Typhimurium.
  hypothesis: ORF80 is expressed as part of the late transcript and performs an accessory role in late infection or host envelope
    remodeling.
