id: P14109
gene_symbol: '17'
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Protein gp17 of Salmonella phage P22 is a 103-amino-acid early protein encoded in the leftward P_L operon between
  orf80 and orf56/c3. While non-essential on prophage-free hosts, gp17 is required for P22 to overcome a superinfection exclusion
  system encoded by the resident Fels-2 (fel-2) prophage in Salmonella enterica.
existing_annotations: []
core_functions:
- description: Counter-defense (anti-exclusion) protein that enables Salmonella phage P22 lytic infection to bypass a superinfection
    exclusion system encoded by the resident Fels-2 prophage.
  supported_by:
  - reference_id: file:genes/BPP22/17/17-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: In the absence of gp17, P22 is sensitive to a superinfection'
  - reference_id: PMID:2738922
    supporting_text: Two previously known genes, 17 and c3, are located within this sequence.
references:
- id: PMID:2738922
  title: Genetic structure of the bacteriophage P22 PL operon.
  findings:
  - statement: Gene 17 and c3 are located within the 1,416-bp sequence of the P22 early P_L operon linking P_L through abc2.
    supporting_text: Two previously known genes, 17 and c3, are located within this sequence.
  - statement: The sequence spanning the stop codon of gene 17 forms a potential stem-loop structure nearly identical to lambda
      sequences near terminator tL2b.
    supporting_text: Sequences that include the stop codon for gene 17 may form a small stem-loop structure and are nearly
      identical to lambda sequences that contain the stop codon for ssb, which is near lambda tL 2b.
- id: file:genes/BPP22/17/17-uniprot.txt
  title: UniProtKB record for Salmonella phage P22 protein gp17 (P14109).
  findings:
  - statement: In the absence of gp17, phage P22 is sensitive to superinfection exclusion by the Fels-2 (fel-2) prophage.
    supporting_text: 'CC   -!- FUNCTION: In the absence of gp17, P22 is sensitive to a superinfection'
suggested_questions:
- question: Which specific Fels-2 prophage exclusion protein targets P22 in the absence of gp17, and does gp17 inhibit that
    exclusion factor by direct protein-protein binding?
suggested_experiments:
- description: Screen a library of individual Fels-2 prophage open reading frames in Salmonella enterica for selective plaque
    inhibition of a P22 delta-17 mutant compared to wild-type P22, followed by co-immunoprecipitation with epitope-tagged
    gp17.
  hypothesis: A single Fels-2 prophage-encoded superinfection exclusion protein blocks P22 lytic development and is directly
    bound and neutralized by gp17.
status: COMPLETE
