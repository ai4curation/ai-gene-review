id: Q38661
gene_symbol: Q38661
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Uncharacterized 48-residue (5.8 kDa) protein (ORF48) encoded in the early right (PR) operon of Salmonella phage
  P22 distal to replication gene 12 in the nin region. It belongs to the conserved phage DUF2740 family (InterPro:IPR022626,
  Pfam:PF10872) shared with the coliphage lambda nin region, and its molecular function and biological role remain unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:6241581
  title: Sequence analysis of a region from the early right operon in phage P22 including the replication genes 18 and 12
  findings:
  - statement: Sequenced the P22 early right operon around replication genes 18 and 12 and identified open reading frames
      distal to gene 12 homologous to those in the bacteriophage lambda nin region.
    supporting_text: A ren gene is missing, whereas two open reading frames (ORFs) distal to gene 12 are almost identical
      to those in the lambda nin region.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Included ORF48 (Q38661) in the complete genome annotation of Salmonella phage P22.
    supporting_text: The sequence was reanalyzed using more modern algorithms, revealing a total of 65 ORFs, 29 (45%) of which
      showed no similarity to those of any other protein in the GenBank protein database.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Confirmed the genome sequence and annotation of bacteriophage P22 including ORF48.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:BPP22/Q38661/Q38661-uniprot.txt
  title: UniProtKB record for Q38661 (Q38661)
  findings:
  - statement: Annotates Q38661 (ORF48) as a predicted 48-residue protein containing the DUF2740 domain (InterPro:IPR022626,
      Pfam:PF10872).
    supporting_text: DR   InterPro; IPR022626; DUF2740.
suggested_questions:
- question: What is the conserved function of the DUF2740 (ORF48) polypeptide shared between the P22 and coliphage lambda
    nin regions during early lytic infection?
  experts:
  - Sherwood R. Casjens
  - Roger W. Hendrix
suggested_experiments:
- description: Express epitope-tagged P22 ORF48 (Q38661) in Salmonella enterica serovar Typhimurium and perform co-immunoprecipitation
    coupled to mass spectrometry alongside competitive fitness assays of an ORF48 amber mutant across diverse host strains.
  hypothesis: ORF48 interacts with a host transcription, replication, or anti-phage defense protein during early right operon
    expression.
