references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:6350606
  title: Primary structure of the immI immunity region of bacteriophage P22.
  findings:
  - statement: Sequenced the P22 immI region (mnt, arc, and ant) and showed that Mnt negatively regulates antirepressor synthesis
      by binding an operator adjacent to the Pant transcription start site.
    supporting_text: The arc and ant genes are transcribed rightward from the Pant promoter, while mnt is transcribed leftward
      from a promotor that may overlap Pant. The Mnt protein apparently acts by binding to an operator site located immediately
      adjacent to the startpoint of Pant transcription.
- id: PMID:7999761
  title: Solution structure of dimeric Mnt repressor (1-76).
  findings:
  - statement: Determined the NMR solution structure of the dimeric N-terminal ribbon-helix-helix domain of P22 Mnt repressor
      (residues 1-76).
    supporting_text: Wild-type Mnt repressor of Salmonella bacteriophage P22 is a tetrameric protein of 82 residues per monomer.
      A C-terminal deletion mutant of the repressor denoted Mnt (1-76) is a dimer in solution.
- id: PMID:10426954
  title: The tetramerization domain of the Mnt repressor consists of two right-handed coiled coils.
  findings:
  - statement: Solved the NMR structure of the C-terminal tetramerization domain of Mnt (residues 53-83), revealing a dimer
      of two antiparallel alpha-helical coiled coils that links two dimeric DNA-binding domains.
    supporting_text: The solution structure of its C-terminal tetramerization domain, which holds together the two dimeric
      DNA-binding domains, has been determined by NMR spectroscopy. This structure reveals an assembly of four alpha-helical
      subunits, consisting of a dimer of two antiparallel coiled coils with a unique right-handed twist.
