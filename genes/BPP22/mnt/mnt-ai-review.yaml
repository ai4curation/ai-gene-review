suggested_questions:
- question: How does the flexible linker between the N-terminal ribbon-helix-helix dimer and C-terminal coiled-coil tetramerization
    domain of Mnt accommodate DNA bending across the symmetric O_mnt operator?
  experts:
  - Robert T. Sauer
  - Rolf Boelens
suggested_experiments:
- description: High-resolution cryo-EM or X-ray structure determination of the intact 82-residue Mnt homotetramer bound to
    the full-length O_mnt operator DNA.
  hypothesis: The C-terminal four-helix tetramerization bundle positions the two N-terminal RHH dimers to simultaneously engage
    the inverted-repeat half-sites of O_mnt with high cooperativity.
