  label: Lederbergvirus P22
description: Homotetrameric ribbon-helix-helix transcriptional repressor (Mnt) of the Salmonella phage P22 immI region that
  maintains lysogeny by binding the O_mnt operator overlapping the Pant promoter and repressing transcription of the arc and
  ant (antirepressor) genes.
