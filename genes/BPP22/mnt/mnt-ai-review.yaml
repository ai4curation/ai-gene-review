  review:
    summary: Mnt binds the O_mnt operator site adjacent to the Pant promoter as a homotetramer via its N-terminal ribbon-helix-helix
      DNA-binding domain.
    action: ACCEPT
    reason: Sequence-specific operator DNA binding by the Mnt homotetramer is mediated by its N-terminal ribbon-helix-helix
      beta-sheet domain (InterPro:IPR005569) and is well established biochemically and structurally (PMID:6350606, PMID:7999761,
      PMID:10426954).
    supported_by:
