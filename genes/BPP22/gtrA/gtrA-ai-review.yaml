suggested_questions:
- question: Does P22 GtrA form a physical inner-membrane complex with GtrB and GtrC to couple undecaprenyl-phosphate glucosylation,
    transmembrane flipping, and periplasmic O-antigen transfer?
suggested_experiments:
- description: Reconstitute purified P22 GtrA into proteoliposomes containing fluorescently or radiolabeled undecaprenyl-phosphate-glucose
    to directly measure transmembrane flippase kinetics and substrate specificity.
  hypothesis: P22 GtrA catalyzes ATP-independent bidirectional equilibration of undecaprenyl-phosphate-glucose across the
    lipid bilayer, driven forward in vivo by periplasmic consumption by GtrC.
status: COMPLETE
