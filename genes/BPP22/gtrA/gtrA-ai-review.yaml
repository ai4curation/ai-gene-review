core_functions:
- description: Translocates (flips) bactoprenol-linked glucose (undecaprenyl-phosphate-beta-D-glucose) from the cytoplasmic
    face to the periplasmic face of the host inner membrane during prophage-mediated lipopolysaccharide O-antigen glucosylation.
  supported_by:
  - reference_id: PMID:11053393
    supporting_text: Guan et al. have proposed that this highly conserved group of proteins function as flippases, translocating
      glucosylated undecaprenyl phosphate from the cytoplasmic face to the periplasmic face of the inner membrane in gram-negative
      cells ( 25 ).
  - reference_id: PMID:11053393
    supporting_text: Two of the serotype conversion gene products show considerable sequence relatedness to GtrA and -B from
      Shigella phages SfII, SfV, and SfX. We have cloned the serotype-converting cassette (gtrABC) and demonstrated that it
      results in Salmonella serovar Typhimurium LT2 cells which express antigen O1.
