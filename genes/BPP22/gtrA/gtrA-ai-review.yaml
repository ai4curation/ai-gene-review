id: P57021
gene_symbol: gtrA
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Bactoprenol-linked glucose translocase GtrA of Salmonella phage P22 is a 120-amino-acid, four-transmembrane integral
  protein of the host bacterial inner membrane (plasma membrane) encoded by the prophage-expressed gtrABC O-antigen conversion
  operon. GtrA functions as a flippase that translocates undecaprenyl-phosphate-glucose from the cytoplasmic face to the periplasmic
  face of the inner membrane, supplying the lipid-linked glucose donor for GtrC-mediated C-6 glucosylation of the host lipopolysaccharide
  O-antigen galactose unit (converting Salmonella enterica serovar Typhimurium from serotype 4,12 to 1,4,12).
