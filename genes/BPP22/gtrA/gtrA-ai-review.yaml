- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: The P22 gtrABC operon converts the host S. enterica Typhimurium O-antigen from form 4,[5],12 to 1,4,[5],12
      by adding an alpha-linked glucosyl residue at the 6 position of galactose during lysogeny.
    supporting_text: Lysogenization by P22 also results in the addition of an α-linked glucosyl residue to the 6 position
      of galactose moieties in the LPS O-antigenic tetrameric repeat. This results in a change in serotype from 4,[5],12 to
      1,4,[5],12 and prevents the binding of P22 and other serovar Typhimurium phages, a phenomenon known as lysogenic conversion
      ( 35 , 51 ).
  - statement: Cloning the P22 gtrABC cassette confers O1 antigen expression in S. enterica serovar Typhimurium LT2.
    supporting_text: Two of the serotype conversion gene products show considerable sequence relatedness to GtrA and -B from
      Shigella phages SfII, SfV, and SfX. We have cloned the serotype-converting cassette (gtrABC) and demonstrated that it
      results in Salmonella serovar Typhimurium LT2 cells which express antigen O1.
  - statement: GtrA is a 120-amino-acid inner membrane protein with four transmembrane helices and cytoplasmic N- and C-termini.
    supporting_text: As predicted by TMHMM analysis, this small protein has four transmembrane domains, with the amino and
      carboxy termini of the protein arrangement on the cytoplasmic side of the inner membrane.
  - statement: GtrA family proteins function as flippases that translocate glucosylated undecaprenyl phosphate from the cytoplasmic
      face to the periplasmic face of the inner membrane.
    supporting_text: Guan et al. have proposed that this highly conserved group of proteins function as flippases, translocating
      glucosylated undecaprenyl phosphate from the cytoplasmic face to the periplasmic face of the inner membrane in gram-negative
      cells ( 25 ).
