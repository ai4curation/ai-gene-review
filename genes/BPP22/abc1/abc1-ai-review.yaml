id: P11190
gene_symbol: abc1
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Anti-RecBCD protein 1 (Abc1) of Salmonella phage P22, a 10.9-kDa winged-helix protein encoded in the PL recombination
  operon that contributes with Abc2 to modulating the host RecBCD helicase-nuclease complex, protecting linear viral double-stranded
  DNA from exonucleolytic degradation during phage recombination in the host cell cytoplasm.
existing_annotations:
- term:
    id: GO:0030234
    label: enzyme regulator activity
  evidence_type: IMP
  original_reference_id: PMID:3660589
  review:
    summary: Abc1 contributes to the anti-RecBCD activity of phage P22 that modulates the host RecBCD nuclease complex.
    action: NEW
    reason: Deletion mutant and plasmid-phage complementation analyses by Murphy et al. (1987) demonstrated that the 10.9-kDa
      Abc1 protein makes a minor but measurable contribution alongside Abc2 to modulating host RecBCD nuclease activity and
      protecting linear phage dsDNA from degradation.
    supported_by:
    - reference_id: PMID:3660589
      supporting_text: The phenotypes of the deletion mutants, and the results of plasmid-phage complementation tests, indicate
        that Abc activity depends primarily on sequences that encode the 11.6-kDa polypeptide; the 10.9-kDa polypeptide-encoding
        sequence makes a minor contribution to Abc activity as well. These sequences have been designated abc2 and abc1, respectively.
    - reference_id: file:genes/BPP22/abc1/abc1-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Modulates the activity of the host recBCD nuclease. And thus'
- term:
    id: GO:0006310
    label: DNA recombination
  evidence_type: IMP
  original_reference_id: PMID:3660589
  review:
    summary: Encoded in the P22 PL recombination operon, Abc1 helps protect linear phage dsDNA from RecBCD exonuclease degradation
      so that homologous recombination and circularization can proceed.
    action: NEW
    reason: By contributing to anti-RecBCD activity in wild-type (recBCD+) Salmonella hosts, Abc1 prevents destructive exonucleolytic
      degradation of linear P22 dsDNA ends and facilitates phage homologous recombination.
    supported_by:
    - reference_id: PMID:3660589
      supporting_text: Previous studies (A. C. Fenton and A. R. Poteete, 1984, Virology 134, 148-160) have shown that this
        region encodes a function that is required for efficient growth of P22 in wild-type, but not in recB- Salmonella.
        The gene or genes encoding this function were designated abc (anti-recBCD).
    - reference_id: file:genes/BPP22/abc1/abc1-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Modulates the activity of the host recBCD nuclease. And thus'
