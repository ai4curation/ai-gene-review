taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Uncharacterized 56-residue (6.6 kDa) protein (ORF56) encoded in the early left (PL) operon of Salmonella phage
  P22 immediately downstream of abc2. It belongs to the DUF2737 family (InterPro:IPR020295, Pfam:PF10930) and contains a predicted
  central coiled-coil region; deletion and plasmid complementation analyses demonstrated that it is dispensable for anti-RecBCD
  (Abc) activity and its biological role remains unknown.
existing_annotations: []
