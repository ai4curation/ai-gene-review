references:
- id: PMID:3660589
  title: Sequence of the bacteriophage P22 anti-recBCD (abc) genes and properties of P22 abc region deletion mutants.
  findings:
  - statement: Identified the open reading frame encoding the 6.6-kDa polypeptide (ORF56 / P11192) immediately downstream
      of abc1 and abc2 and showed by deletion mutant and plasmid complementation analysis that the 6.6-kDa polypeptide is
      not involved in P22 Abc activity.
    supporting_text: The DNA sequence reveals three open reading frames that potentially encode polypeptides with molecular
      weights of 10,900, 11,600, and 6600 (in order of transcription). P22 deletion mutants lacking each of the open reading
      frames were constructed. In addition, plasmids were constructed placing each of the open reading frames under control
      of the lac UV5 promoter. The phenotypes of the deletion mutants, and the results of plasmid-phage complementation tests,
      indicate that Abc activity depends primarily on sequences that encode the 11.6-kDa polypeptide; the 10.9-kDa polypeptide-encoding
      sequence makes a minor contribution to Abc activity as well. These sequences have been designated abc2 and abc1, respectively.
      The 6.6-kDa polypeptide is apparently uninvolved.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Included ORF56 (P11192) in the complete genome annotation of Salmonella phage P22 as an uncharacterized early
      left operon ORF.
    supporting_text: The sequence was reanalyzed using more modern algorithms, revealing a total of 65 ORFs, 29 (45%) of which
      showed no similarity to those of any other protein in the GenBank protein database.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Confirmed the genome sequence and annotation of bacteriophage P22 including ORF56.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:BPP22/P11192/P11192-uniprot.txt
  title: UniProtKB record for P11192 (P11192)
  findings:
  - statement: Annotates P11192 (ORF56) as a predicted 56-residue protein containing a DUF2737 domain (InterPro:IPR020295,
      Pfam:PF10930) and a predicted coiled-coil segment (residues 11-38).
    supporting_text: DR   InterPro; IPR020295; DUF2737.
suggested_questions:
- question: Is the 6.6-kDa ORF56 (P11192) polypeptide translated during early PL transcription in Salmonella enterica, and
    does it interact with host nucleoid or recombination factors?
  experts:
  - Kenneth C. Murphy
  - Sherwood R. Casjens
suggested_experiments:
- description: Perform ribosome profiling (Ribo-seq) and affinity purification-mass spectrometry (AP-MS) of epitopically tagged
    ORF56 (P11192) during early P22 infection of Salmonella enterica serovar Typhimurium.
  hypothesis: ORF56 is co-expressed with the early PL transcript and interacts with a non-essential host protein or phage
    early factor via its coiled-coil domain.
