  review:
    summary: Virions lacking gp7 are non-infectious and fail to trigger host cytoplasmic potassium release or viral DNA delivery
      into the cell.
    action: ACCEPT
    reason: Mutant particles lacking gp7 adsorb normally and eject gp16 and gp20, but fail to induce K+ efflux across the
      inner membrane or inject DNA into the host cytoplasm.
    supported_by:
    - reference_id: PMID:38236051
      supporting_text: In other words, all three E-proteins are required for K+ release and for DNA injection.
