    id: GO:0099002
    label: symbiont genome ejection through host cell envelope, short tail mechanism
  evidence_type: IDA
  original_reference_id: PMID:26245366
  qualifier: involved_in
  review:
    summary: Internal virion protein gp7 is ejected ahead of the viral DNA upon binding of P22 to host LPS and OmpA to mediate
      genome translocation.
    action: ACCEPT
    reason: In vitro ejection assays show that gp7 is triggered by host LPS and OmpA to exit the capsid prior to viral DNA
      release.
    supported_by:
    - reference_id: PMID:26245366
      supporting_text: In contrast, E proteins are not ejected unless both OmpA and LPS are present and their ejection when
        OmpA is present is largely complete before any genome is ejected, suggesting that E proteins play a key role in the
        early stage of transferring P22 DNA into the host.
