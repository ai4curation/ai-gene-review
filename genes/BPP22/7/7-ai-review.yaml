references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:1522065
  title: Oligopeptidase A is required for normal phage P22 development.
  findings:
  - statement: A 20-amino-acid N-terminal peptide is removed from gp7 by host oligopeptidase A (OpdA) during phage development,
      and N-terminal mutations in gene 7 confer opdA independence.
    supporting_text: The mutations leading to opdA independence affected the region of gene 7 coding for the amino terminus
      of gp7, a protein required for DNA injection by the phage. Comparison of the nucleotide sequence with the N-terminal
      amino acid sequence of gp7 suggested that a 20-amino-acid peptide is removed from gp7 during phage development.
- id: PMID:26245366
  title: Bacteriophage P22 ejects all of its internal proteins before its genome.
  findings:
  - statement: In the presence of both host LPS and outer membrane protein OmpA, all three internal ejection proteins (gp7,
      gp20, and gp16) are ejected from the P22 capsid prior to viral DNA release.
    supporting_text: From this we conclude that in the presence of LPS and OmpA all three E proteins are ejected prior to
      DNA ejection.
- id: PMID:29590587
  title: Cryo-EM Elucidation of the Structure of Bacteriophage P22 Virions after Genome Release.
  findings:
  - statement: Cryo-EM of P22 particles after release of the gp26 plug reveals a hollow tubular density at the distal tip
      of the gp10 tail hub composed of remodeled ejection protein.
    supporting_text: Previous studies have shown that particles lacking the gp26 plug contain ejection proteins associated
      with them ( 13 ), and since the structures and location of all P22 virion proteins are known in the mature virus except
      for the three ejection proteins, we believe that this tube-like density is likely to be a remodeled form of one of these
      proteins (gp16, gp7, or gp20).
- id: PMID:30886360
  title: Structural dynamics of bacteriophage P22 infection initiation revealed by cryo-electron tomography.
  findings:
  - statement: Cryo-ET of infecting P22 particles shows that ejected gp7* assembles into an extracellular channel extending
      from the gp10 baseplate to the host outer membrane surface as part of a ~40 nm trans-envelope conduit.
    supporting_text: The needle is released and the internal head protein gp7* is ejected and assembles into an extracellular
      channel that extends from the gp10 baseplate to the cell surface.
- id: PMID:37952769
  title: Molecular Architecture of Salmonella Typhimurium Virus P22 Genome Ejection Machinery.
  findings:
  - statement: Cryo-EM localized reconstruction and biochemical analysis characterize the organization of the P22 tail apparatus
      and ejection proteins gp7, gp20, and gp16.
    supporting_text: Here, we describe the complete architecture of the P22 tail apparatus (gp1, gp4, gp10, gp9, and gp26)
      and the potential location and organization of P22 ejection proteins (gp7, gp20, and gp16), determined using cryo-EM
      localized reconstruction, genetic knockouts, and biochemical analysis.
- id: PMID:38236051
  title: Bacteriophage P22 SieA-mediated superinfection exclusion.
  findings:
  - statement: All three ejection proteins (gp7, gp20, and gp16) are essential for host cytoplasmic K+ release and viral DNA
      injection during infection.
    supporting_text: In other words, all three E-proteins are required for K+ release and for DNA injection.
