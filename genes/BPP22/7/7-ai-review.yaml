suggested_questions:
- question: Why does proteolytic removal of the N-terminal 20 residues of gp7 by host OpdA (PrlC) cease to be required when
    N-terminal point mutations or small deletions are introduced into gp7, and how does the uncleaved propeptide interfere
    with extracellular channel assembly?
  experts:
  - Ian J. Molineux
  - Sherwood R. Casjens
  - Jun Liu
suggested_experiments:
- description: Determine the high-resolution cryo-EM structure of the reconstituted gp10-gp7*-gp20 complex in lipid nanodiscs
    containing Salmonella LPS and OmpA, comparing wild-type mature gp7* with uncleaved full-length gp7 produced in an opdA-deficient
    host.
  hypothesis: Uncleaved N-terminal residues 1-20 of gp7 sterically occlude the oligomerization interface required for gp7*
    to dock onto the distal tip of the hexameric gp10 tail hub or to recruit the periplasmic gp20 channel.
