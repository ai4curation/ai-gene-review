- description: Prophage-expressed multi-pass host inner membrane protein that mediates abortive superinfection exclusion by
    arresting cellular and viral macromolecular synthesis midway through the lytic cycle of superinfecting phages lacking
    the Esc inhibitor.
  supported_by:
