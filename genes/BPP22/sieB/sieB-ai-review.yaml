taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Superinfection exclusion protein B (SieB) of Salmonella phage P22 is a 192-amino-acid, two-transmembrane integral
  membrane protein expressed by the P22 prophage in lysogenic host cells. SieB mediates abortive superinfection exclusion
  against heteroimmune and P22-like phages lacking the P22 Esc escape determinant by arresting phage and host macromolecular
  synthesis midway through the lytic cycle.
