suggested_questions:
- question: What specific late-early phage trigger activates SieB during superinfection, and does activated SieB form an inner-membrane
    ion-depolarizing pore analogous to lambda RexB?
suggested_experiments:
- description: Measure membrane potential and intracellular ATP levels in SieB-expressing Salmonella enterica upon inducible
    co-expression of candidate phage trigger proteins in the presence and absence of the Esc inhibitor peptide.
  hypothesis: SieB is held inactive until triggered by a superinfecting phage lytic protein, whereupon it depolarizes the
    host inner membrane to arrest macromolecular synthesis unless bound by Esc.
status: COMPLETE
