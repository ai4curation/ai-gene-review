    id: GO:0033644
    label: host cell membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: SieB is a multi-pass integral membrane protein with two predicted alpha-helical transmembrane segments that integrates
      into the host bacterial inner membrane (plasma membrane).
    action: MODIFY
    reason: GO:0033644 (host cell membrane) is correct but less specific than GO:0020002 (host cell plasma membrane), as bacterial
      alpha-helical multi-pass transmembrane proteins with two transmembrane helices (residues 22-42 and 51-71) reside in
      the host inner membrane (plasma membrane).
    proposed_replacement_terms:
    - id: GO:0020002
      label: host cell plasma membrane
    supported_by:
