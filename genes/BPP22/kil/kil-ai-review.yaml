suggested_questions:
- question: Does P22 Kil (IPR020298/PF17519) inhibit bacterial cell division by interacting with FtsZ and ZipA like phage
    lambda Kil, or does its distinct sequence fold target a different component of the Salmonella divisome?
  experts:
  - William Margolin
  - Anthony R. Poteete
suggested_experiments:
- description: Bacterial two-hybrid screening and in vitro FtsZ GTPase/polymerization assays with purified P22 Kil against
    Salmonella divisome components (FtsZ, FtsA, ZipA, ZapA).
  hypothesis: Despite lacking sequence homology with lambda Kil, P22 Kil converges on inhibiting FtsZ ring assembly at the
    midcell division site to induce filamentation.
