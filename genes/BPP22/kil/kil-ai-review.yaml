id: P14111
gene_symbol: kil
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Early PL-operon protein Kil of Salmonella phage P22 that inhibits host bacterial cell division—causing cell filamentation
  and death—and is required for lytic phage growth in the absence of the anti-RecBCD protein Abc.
existing_annotations:
- term:
    id: GO:0051782
    label: negative regulation of cell division
  evidence_type: IMP
  original_reference_id: PMID:2738922
  qualifier: involved_in
  review:
    summary: Expression of P22 kil inhibits bacterial host cell division, resulting in cell filamentation and subsequent cell
      death.
    action: NEW
    reason: Semerjian et al. (PMID:2738922) and the UniProt functional summary document that expression of P22 kil causes
      host cell filamentation (blockade of bacterial cell division) and cell killing analogous to lambda kil.
    supported_by:
    - reference_id: PMID:2738922
      supporting_text: P22 kil, like lambda kil, kills the host cell when it is expressed. The two kil genes, although analogous
        in cell killing and map location, have no apparent sequence homology.
    - reference_id: file:genes/BPP22/kil/kil-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: P22 kil is essential for lytic growth in the absence of abc. ... Expression of
        P22 kil causes filamentation and cell death.'
references:
- id: PMID:2738922
  title: Genetic structure of the bacteriophage P22 PL operon.
  findings:
  - statement: Identified and sequenced P22 kil in the PL operon, showing that its expression causes host cell filamentation
      and killing and that it is required for lytic growth in the absence of abc despite lacking sequence homology to lambda
      kil.
    supporting_text: P22 kil, like lambda kil, kills the host cell when it is expressed. The two kil genes, although analogous
      in cell killing and map location, have no apparent sequence homology. The functions of the P22 and lambda kil genes
      are unknown; however, P22 kil is essential for lytic growth in the absence of abc.
