- id: PMID:3491212
  title: Structural and regulatory divergence among site-specific recombination genes of lambdoid phage.
  findings:
  - statement: Mapped and sequenced the P22 int and xis genes located adjacent to the phage attachment site attP.
    supporting_text: In this study, we have identified and sequenced the int and xis genes of phi 80 and P22. phi 80 int and
      xis were identified using a plasmid recombination assay in vivo, and the P22 genes were mapped using Tn1 insertion mutations.
      In all three phage, the site-specific recombination genes are located directly adjacent to the phage attachment site.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Describes P22 site-specific integration into the Salmonella thrW tRNA gene (attP22/ataA) catalyzed by Int and
      host IHF.
    supporting_text: The phage integration site, att P22 or ataA , maps within thrW , a gene for threonyl tRNA2 ( 53 ), with
      site-specific recombination being catalyzed, as it is with coliphage λ, by integration host factor (IHF) and integrase
      (Int) ( 40 , 62 ).
- id: PMID:18502866
  title: Purification and characterization of bacteriophage P22 Xis protein.
  findings:
  - statement: Summarizes the requirement for P22 Int in integrative recombination and for both Int and Xis in excisive recombination.
    supporting_text: The temperate bacteriophages lambda and P22 share similarities in their site-specific recombination reactions.
      Both require phage-encoded integrase (Int) proteins for integrative recombination and excisionase (Xis) proteins for
      excision.
