taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Site-specific tyrosine recombinase (Integrase, Int) of Salmonella phage P22 that catalyzes integrative recombination
  between the phage attachment site (attP) and the host Salmonella thrW tRNA gene attachment site (attB/ataA) to establish
  an integrated prophage, and in conjunction with excisionase (Xis) catalyzes excisive recombination (attL x attR) during
  prophage induction.
