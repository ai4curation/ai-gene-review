suggested_questions:
- question: How do the arm-type DNA binding specificities of P22 Int (PF30395) and P22 Xis coordinate within the excisive
    intasome compared to the phage lambda system?
  experts:
  - Jeffrey F. Gardner
  - Arthur Landy
suggested_experiments:
- description: Cryo-EM structural determination of the P22 excisive intasome (Int, Xis, IHF, and attL/attR DNA substrates).
  hypothesis: Cooperative binding and ~137-degree DNA bending by P22 Xis across the X1-X4 repeats positions the P' arm sites
    for P22 Int bridging across the synaptic complex.
