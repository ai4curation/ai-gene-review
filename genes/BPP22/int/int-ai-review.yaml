  review:
    summary: P22 Int binds specific arm-type and core-type DNA sequences within the phage and host attachment sites via its
      N-terminal, core-binding, and catalytic domains; refine to sequence-specific DNA binding (GO:0043565).
    action: MODIFY
    reason: Sequence-specific DNA binding to attP and attB is essential for intasome assembly and site-specific recombination
      by P22 Int (PMID:3491212, PMID:11053393), warranting refinement of general DNA binding (GO:0003677) to GO:0043565 (sequence-specific
      DNA binding).
    proposed_replacement_terms:
