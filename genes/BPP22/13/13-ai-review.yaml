id: P09962
gene_symbol: '13'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Class I holin and dual-start antiholin of Salmonella phage P22 that control the timing of host cell lysis at
  the end of the lytic cycle. Alternative translational initiation at Met1 and Met4 produces a 108-amino-acid antiholin (lysis
  inhibitor 13-108, P09962-1) with two transmembrane helices and a 105-amino-acid active holin (lysis protein 13-105, P09962-2)
  with three transmembrane helices in the host cell inner membrane. The holin isoform accumulates in the cytoplasmic membrane
  until it reaches a critical concentration and oligomerizes into micron-scale pores that disrupt the inner membrane and allow
  the cytoplasmic endolysin gp19 to escape into the periplasm, while the antiholin isoform binds the holin to inhibit premature
  multimerization and pore formation.
alternative_products:
- name: Antiholin (Lysis inhibitor 13-108)
  id: P09962-1
  description: Full-length 108-amino-acid isoform initiated at Met1 containing two positively charged N-terminal lysine residues
    (Lys2, Lys3) that prevent insertion of the first transmembrane helix; heterodimerizes with the 13-105 holin isoform in
    the host inner membrane to inhibit premature oligomerization and delay lysis.
- name: Holin (Lysis protein 13-105)
  id: P09962-2
  sequence_note: VSP_058251
  description: Active 105-amino-acid class I holin isoform initiated at Met4 (lacking residues 1-3) with three transmembrane
    helices that oligomerizes at a programmed critical concentration to form micron-scale pores in the host inner membrane,
    releasing endolysin gp19 into the periplasm.
