core_functions:
- description: Oligomerizes in the host cell inner membrane at a programmed critical concentration during the late lytic phase
    to form micron-scale pores that permeabilize the cytoplasmic membrane and release the endolysin gp19 into the periplasm
    for host cell lysis; timed by the dual-start antiholin isoform (13-108), which inhibits premature holin (13-105) multimerization.
  supported_by:
