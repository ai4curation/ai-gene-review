      escape into the periplasmic space. Determines the precise timing of host cell lysis. Participates with the endolysin
      and spanin proteins in the sequential events which lead to the programmed host cell lysis releasing the mature viral
      particles from the host cell.'
suggested_questions:
- question: How is the translation ratio between the 13-108 antiholin (Met1) and 13-105 holin (Met4) isoforms modulated by
    mRNA secondary structure in Salmonella enterica compared to the lambda sdi RNA stem-loop in Escherichia coli?
  experts:
  - Ry Young
  - Udo Blasi
suggested_experiments:
- description: Perform site-directed mutagenesis of the RNA stem-loop structure overlying the dual-start region of P22 gene
    13 coupled with ribosome profiling (Ribo-seq) and single-cell lysis timing microscopy in Salmonella Typhimurium to quantify
    how the 13-108:13-105 translational ratio sets the lysis clock.
  hypothesis: Mutations that destabilize the stem-loop upstream of Met1/Met4 will alter the stoichiometric ratio of 13-108
    to 13-105 and shift the onset of inner membrane depolarization and cell lysis.
