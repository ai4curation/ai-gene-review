  review:
    summary: Overly broad keyword-derived term; gp13 specifically mediates viral release from the host cell by cytolysis through
      pore-forming activity in the host inner membrane.
    action: MODIFY
    reason: The automated mapping from UniProt keyword KW-0204 (Cytolysis) to GO:0031640 (killing of cells of another organism)
      is too broad and conflates phage progeny release with antibacterial toxin activity. Gp13 functions specifically in viral
      release from the host cell by cytolysis (GO:0044659) via its inner membrane pore-forming activity (GO:0140911).
    proposed_replacement_terms:
    - id: GO:0044659
      label: viral release from host cell by cytolysis
    - id: GO:0140911
      label: pore-forming activity
    supported_by:
    - reference_id: PMID:7831803
      supporting_text: Holins represent phage encoded lysis functions required for transit of the phage murein hydrolases
        to the periplasm. The Lambda S, phage 21 S, and P22 13 holin genes contain a dual translational start motif, beginning
        with Met1-Lys2-X-Met3. In all cases both start codons at the 5' end of the respective holin gene are utilized. The
        resulting polypeptides have opposing functions, with the longer product acting as an inhibitor of the shorter one.
    - reference_id: file:BPP22/13/13-uniprot.txt
