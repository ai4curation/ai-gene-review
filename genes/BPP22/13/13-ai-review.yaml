- id: PMID:2998005
  title: 'Phage P22 lysis genes: nucleotide sequences and functional relationships with T4 and lambda genes.'
  findings:
  - statement: Gene 13 was cloned and sequenced from wild-type and amber mutant P22 alleles and shown to encode a basic hydrophobic
      protein sharing 89% amino acid sequence homology with the bacteriophage lambda S holin.
    supporting_text: Gene 13 encodes an 11,520-Da basic hydrophobic protein that has 89% amino acid homology to lambda S protein.
- id: PMID:7831803
  title: Dual translational start motif evolutionarily conserved in the holin gene of Bacillus subtilis phage phi 29.
  findings:
  - statement: P22 gene 13 contains a conserved Met1-Lys2-X-Met4 dual translational start motif where both start codons are
      utilized to produce two polypeptides of opposing function, with the full-length 108-aa product inhibiting the 105-aa
      holin.
    supporting_text: Holins represent phage encoded lysis functions required for transit of the phage murein hydrolases to
      the periplasm. The Lambda S, phage 21 S, and P22 13 holin genes contain a dual translational start motif, beginning
      with Met1-Lys2-X-Met3. In all cases both start codons at the 5' end of the respective holin gene are utilized. The resulting
      polypeptides have opposing functions, with the longer product acting as an inhibitor of the shorter one.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Complete genome sequencing confirmed that gp13 is the P22 holin encoded in the late operon upstream of the
      endolysin gp19.
    supporting_text: The late genes include a holin (gp13), a lysozyme homologue (gp19), and the genes involved in morphogenesis.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: High-accuracy resequencing of the complete 41,724-bp wild-type P22 genome verified the coding sequence of gene
      13.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:BPP22/13/13-uniprot.txt
  title: UniProtKB entry P09962 (HOLIN_BPP22)
  findings:
  - statement: Isoform Holin (13-105) accumulates in the host inner membrane until triggering micron-scale pore formation
      that releases endolysin into the periplasm, while Isoform Antiholin (13-108) counteracts holin aggregation.
    supporting_text: 'FUNCTION: [Isoform Holin]: Accumulates harmlessly in the cytoplasmic membrane until it reaches a critical
