references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identifies ninG as one of the three genes sharing the highest DNA and amino acid sequence identity (>85%) between
      Salmonella phage P22 and coliphage lambda.
    supporting_text: Using the BLAST2 algorithm of Tatusova and Madden, we identified five >300-bp regions in lambda DNA which
      shared >85% sequence identity with the P22 sequence ( 66 ). These are indicated in Fig. 1 . The regions of greatest
      DNA sequence similarity correspond to genes ninB , ninG , and 23 . This is also verified at the amino acid level.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: PMID:15223317
  title: Holliday junction binding and resolution by the Rap structure-specific endonuclease of phage lambda.
  findings:
  - statement: Demonstrates that lambdoid Rap (NinG) resolves Holliday junctions via symmetrical dual-strand cleavage across
      the junction crossover point.
    supporting_text: Here, we demonstrate that Rap can mediate symmetrical resolution of 50 bp and chi Holliday structures
      containing larger homologous cores.
- id: PMID:9811830
  title: lambda Rap protein is a structure-specific endonuclease involved in phage recombination.
  findings:
  - statement: Establishes that lambdoid NinG (Rap) is a manganese-activated structure-specific endonuclease that cleaves
      at the branch point of Holliday junctions and D-loops.
    supporting_text: In the presence of manganese ions, Rap acts as an endonuclease that cleaves at the branch point of Holliday
      and D-loop substrates.
- id: file:genes/BPP22/ninG/ninG-uniprot.txt
