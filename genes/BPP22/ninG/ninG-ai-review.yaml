suggested_questions:
- question: How does P22 NinG coordinate Holliday junction resolution with the Erf/Arf/Abc recombination pathway during concatemeric
    DNA maturation prior to headful packaging?
  experts:
  - Gary J. Sharples
  - Sherwood R. Casjens
suggested_experiments:
- description: Assay purified P22 NinG on synthetic mobile Holliday junction and D-loop substrates and measure phage recombination
    frequency in a P22 ninG deletion mutant infecting ruvABC-deficient Salmonella hosts.
  hypothesis: P22 NinG resolves branched recombination intermediates generated by the Erf pathway, substituting for host RuvABC
    Holliday junction resolvase activity.
status: COMPLETE
