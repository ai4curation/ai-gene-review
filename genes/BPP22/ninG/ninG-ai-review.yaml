    summary: P22 NinG shares >85% sequence identity with phage lambda NinG (Rap), a biochemically characterized structure-specific
      endonuclease (InterPro:IPR008713, Pfam:PF05766) that resolves Holliday junctions and D-loops.
    action: NEW
    reason: Comparative genomic analysis shows >85% sequence identity between P22 ninG and phage lambda ninG (rap), and biochemical
      studies of NinG/Rap demonstrate that it acts as a structure-specific endonuclease cleaving Holliday junctions and D-loop
      recombination intermediates.
