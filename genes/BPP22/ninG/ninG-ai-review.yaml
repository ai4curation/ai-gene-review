  label: Lederbergvirus P22
description: Structure-specific crossover junction endodeoxyribonuclease NinG (Rap) of Salmonella phage P22 that cleaves Holliday
  junction and D-loop branched DNA intermediates to promote viral DNA recombination in the host cell cytoplasm.
