id: P57017
gene_symbol: P57017
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Uncharacterized 59-residue (6.4 kDa) predicted protein (ORF59A) encoded in the immI region between the superinfection
  exclusion gene sieA and the repressor gene mnt of Salmonella phage P22. It is predicted to be intrinsically disordered with
  enriched basic and acidic segments, lacks recognized protein family domains, and has no known molecular function or biological
  role.
existing_annotations: []
core_functions: []
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identified ORF59a (P57017) in the sieA-mnt intergenic region during complete genome sequencing and ORF reanalysis
      of Salmonella phage P22.
    supporting_text: The sequence was reanalyzed using more modern algorithms, revealing a total of 65 ORFs, 29 (45%) of which
      showed no similarity to those of any other protein in the GenBank protein database.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Confirmed the genome sequence and annotation of bacteriophage P22 including ORF59a.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:BPP22/P57017/P57017-uniprot.txt
  title: UniProtKB record for P57017 (P57017)
  findings:
  - statement: Annotates P57017 (ORF59A) as a predicted 59-residue intrinsically disordered polypeptide in the sieA-mnt intergenic
      region with no known function or conserved domains.
    supporting_text: 'PE   4: Predicted;'
suggested_questions:
- question: Is ORF59A (P57017) translated in P22 lysogens or during lytic infection from transcripts traversing the sieA-mnt
    intergenic region?
  experts:
  - Sherwood R. Casjens
  - Miriam M. Susskind
suggested_experiments:
- description: Perform ribosome profiling (Ribo-seq) and strand-specific RNA-seq across the immI sieA-mnt intergenic locus
    in P22 lysogens and lytically infected Salmonella enterica serovar Typhimurium cells.
  hypothesis: Ribosome occupancy will determine whether ORF59A is a bona fide translated small protein or a non-coding intergenic
    reading frame.
