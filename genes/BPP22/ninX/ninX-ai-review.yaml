id: Q38665
gene_symbol: ninX
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Putative 112-amino-acid protein NinX encoded in the early right (PR) nin region of Salmonella phage P22 between
  ninE and ninF; it defines the Phage_P22_NinX domain family and has no experimentally established function.
existing_annotations: []
core_functions:
- description: Uncharacterized 112-amino-acid bacteriophage P22 nin-region protein defining the Phage_P22_NinX family (InterPro:IPR019701,
    Pfam:PF10765) whose molecular function and biological role are currently unknown.
  supported_by:
  - reference_id: PMID:11053393
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
  - reference_id: file:genes/BPP22/ninX/ninX-uniprot.txt
    supporting_text: DR   InterPro; IPR019701; Phage_P22_NinX.
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identifies ninX as a non-lambdoid gene interspersed among conserved lambdoid nin genes in the early right operon
      of Salmonella phage P22.
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:genes/BPP22/ninX/ninX-uniprot.txt
  title: UniProt:Q38665 (NINX_BPP22)
  findings:
  - statement: P22 NinX is a 112-residue protein belonging to the Phage_P22_NinX domain family (InterPro:IPR019701, Pfam:PF10765).
    supporting_text: DR   InterPro; IPR019701; Phage_P22_NinX.
suggested_questions:
- question: What is the evolutionary origin and biological role of the non-lambdoid NinX protein (Pfam:PF10765) inserted between
    ninE and ninF in the P22 nin region?
  experts:
  - Sherwood R. Casjens
  - Andrew M. Kropinski
suggested_experiments:
- description: Construct a precise in-frame deletion of ninX in phage P22 and screen plaque formation and burst size across
    diverse Salmonella enterica serovars and anti-phage defense strains.
  hypothesis: NinX provides a host-range or anti-defense accessory function specific to Salmonella enterica hosts.
status: COMPLETE
