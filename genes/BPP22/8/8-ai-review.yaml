  review:
    summary: Release of electrostatic gp8-gp5 interactions and exit of scaffolding protein gp8 from the procapsid during DNA
      packaging are required for procapsid expansion into the mature capsid.
    action: NEW
    reason: Genetic and biochemical analyses show that gp8 exits the procapsid during DNA packaging and that disruption of
      its electrostatic interaction with coat protein gp5 is an integral step of procapsid maturation.
    supported_by:
    - reference_id: PMID:9792844
      supporting_text: During DNA packaging, the scaffolding protein exits the procapsid; scaffolding protein exit is followed
        by the expansion of the procapsid into a mature capsid.
references:
- id: PMID:9792844
  title: Electrostatic interactions drive scaffolding/coat protein binding and procapsid maturation in bacteriophage P22.
  findings:
  - statement: The scaffolding protein gp8 forms the inner core of the T=7 procapsid, binds the coat protein via electrostatic
      interactions mediated by its positively charged C-terminal helix-loop-helix domain, and exits during DNA packaging prior
      to procapsid expansion.
    supporting_text: The first step in assembly of the bacteriophage P22 is the formation of a T=7 icosahedral "procapsid,"
      the major components of which are the coat protein and an inner core composed of the scaffolding protein. Although not
      present in the mature virion, the scaffolding protein is required for procapsid assembly.
  - statement: During DNA packaging, the scaffolding protein exits the procapsid, followed by procapsid expansion into a mature
      capsid.
    supporting_text: During DNA packaging, the scaffolding protein exits the procapsid; scaffolding protein exit is followed
      by the expansion of the procapsid into a mature capsid.
- id: PMID:10764583
  title: Structure of the coat protein-binding domain of the scaffolding protein from a double-stranded DNA virus.
  findings:
  - statement: NMR structure of the C-terminal coat protein-binding domain of P22 scaffolding protein reveals a helix-loop-helix
      motif stabilized by a hydrophobic core with a positively charged face that transiently binds and positions coat protein
      subunits.
    supporting_text: They function by transiently binding and positioning the coat protein subunits during capsid assembly.
      In both bacteriophage P22 and the herpesviruses the extreme scaffold C terminus is highly charged, is predicted to be
      an amphipathic alpha-helix, and is sufficient to bind the coat protein, suggesting a common mode of action. NMR studies
      show that the coat protein-binding domain of P22 scaffolding protein exhibits a helix-loop-helix motif stabilized by
      a hydrophobic core.
- id: PMID:21220301
  title: Structural basis for scaffolding-mediated assembly and maturation of a dsDNA virus.
  findings:
  - statement: Cryo-EM reconstruction of the P22 procapsid shows the C-terminal helix-loop-helix motif of gp8 interacting
      electrostatically with the N-arm of coat protein gp5 and 10 scaffolding proteins interacting with the 12-fold portal
      ring at the unique vertex.
    supporting_text: The procapsid structures show the scaffolding protein interacting electrostatically with the N terminus
      (N arm) of the coat protein through its C-terminal helix-loop-helix motif, as well as unexpected interactions between
      10 scaffolding proteins and the 12-fold portal located at a unique vertex.
- id: PMID:30787152
  title: 'Architect of Virus Assembly: the Portal Protein Nucleates Procapsid Assembly in Bacteriophage P22.'
  findings:
  - statement: Scaffolding protein gp8 catalyzes the oligomerization of monomeric portal protein gp1 into dodecameric rings
      to form the procapsid assembly nucleation complex.
    supporting_text: Scaffolding protein also catalyzes oligomerization of monomeric portal protein into dodecameric rings,
      possibly forming a scaffolding protein-portal protein nucleation complex that results in one portal ring per P22 procapsid.
- id: PMID:36851569
  title: Assembly and Capsid Expansion Mechanism of Bacteriophage P22 Revealed by High-Resolution Cryo-EM Structures.
  findings:
  - statement: High-resolution (2.6 Å) cryo-EM of the P22 procapsid resolves two C-terminal alpha-helices of scaffolding protein
      gp8 bound to the coat protein gp5.
    supporting_text: The structure of the procapsid allowed us to build an accurate model of the coat protein gp5 and the
      C-terminal region of the scaffolding protein gp8. In addition, interactions among the gp5 subunits responsible for procapsid
      assembly and stabilization were identified. Two C-terminal α-helices of gp8 were observed to interact with the coat
      protein in the procapsid.
core_functions:
- description: Transiently binds and positions major coat protein subunits (gp5) via a C-terminal positively charged helix-loop-helix
    domain and catalyzes oligomerization of the portal protein (gp1) to nucleate procapsid assembly, before exiting intact
    during DNA packaging to permit viral procapsid maturation.
