taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Scaffolding protein (gp8) of Salmonella phage P22 that transiently forms the internal core of the procapsid and
  directs high-fidelity T=7 icosahedral capsid morphogenesis. It catalyzes oligomerization of the portal protein (gp1) into
  dodecameric rings to nucleate procapsid assembly, recruits the internal ejection proteins, and binds the N-arm of the major
  coat protein (gp5) via an electrostatic C-terminal helix-loop-helix motif before exiting intact upon viral DNA packaging
  to allow procapsid expansion and recycle into new assembly reactions.
