suggested_questions:
- question: How does the central region of scaffolding protein gp8 selectively recruit the three internal ejection proteins
    (gp7, gp16, and gp20) into the assembling procapsid in defined stoichiometries?
  experts:
  - Carolyn M. Teschke
  - Peter E. Prevelige Jr.
suggested_experiments:
- description: Map the direct binding interfaces between gp8 and the ejection proteins (gp7, gp16, gp20) using hydrogen-deuterium
    exchange mass spectrometry (HDX-MS) and cross-linking mass spectrometry (XL-MS) in assembling procapsids.
  hypothesis: Distinct central alpha-helical segments of gp8 bind gp16, gp20, and gp7 prior to procapsid shell closure, coordinating
    their co-encapsidation around the portal vertex.
