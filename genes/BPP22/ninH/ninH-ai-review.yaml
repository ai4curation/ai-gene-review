id: Q38669
gene_symbol: ninH
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Conserved 67-amino-acid lambdoid NinH-family protein containing a predicted homeodomain-like fold, encoded at
  the distal end of the early right (PR) nin region of Salmonella phage P22 upstream of gene 23; its specific molecular function
  remains uncharacterized.
existing_annotations: []
core_functions:
- description: Conserved lambdoid phage NinH-family protein containing a homeodomain-like superfamily fold (InterPro:IPR010454,
    InterPro:IPR009057, Pfam:PF06322, SUPFAM:SSF46689) whose specific target and biological role are currently unknown.
  supported_by:
  - reference_id: PMID:11053393
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
  - reference_id: file:genes/BPP22/ninH/ninH-uniprot.txt
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the ninH family. {ECO:0000305}.'
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identifies ninH as a conserved lambdoid gene within the early right nin region of Salmonella phage P22.
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:genes/BPP22/ninH/ninH-uniprot.txt
  title: UniProt:Q38669 (NINH_BPP22)
  findings:
  - statement: P22 NinH is a 67-residue protein belonging to the lambdoid NinH family (InterPro:IPR010454, Pfam:PF06322) and
      the homeodomain-like superfamily (InterPro:IPR009057, SUPFAM:SSF46689).
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the ninH family. {ECO:0000305}.'
suggested_questions:
- question: Does the homeodomain-like fold of P22 NinH bind specific phage or host DNA sequences to regulate transcription
    or recombination?
  experts:
  - Sherwood R. Casjens
  - Gary J. Sharples
suggested_experiments:
- description: Perform ChIP-seq and electrophoretic mobility shift assays (EMSAs) with purified P22 NinH across phage P22
    and Salmonella enterica genomic DNA.
  hypothesis: The homeodomain-like helix-turn-helix domain of NinH binds double-stranded DNA to modulate transcription in
    the PR operon or host nucleoid structure.
status: COMPLETE
