id: Q38668
gene_symbol: ninY
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Protein NinY of Salmonella phage P22 is a 74-amino-acid accessory protein encoded in the rightward early nin
  region (ninA-ninZ) between the replication gene 12 and the late antiterminator gene 23. NinY is non-essential under standard
  laboratory conditions, lacks conserved domain signatures, and has no experimentally established molecular or biological
  function.
existing_annotations: []
core_functions: []
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: The P22 nin region contains lambdoid genes interspersed with non-lambdoid genes such as ninX and ninY.
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Resequencing of the bacteriophage P22 genome established an accurate reference genome sequence correcting a
      0.14% error rate in prior sequences.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
suggested_questions:
- question: Does P22 NinY interact with host transcriptional, recombination, or anti-phage defense machinery during the transition
    from early to late lytic gene expression?
suggested_experiments:
- description: Perform affinity purification-mass spectrometry (AP-MS) of epitope-tagged NinY in Salmonella enterica and compare
    competitive fitness of wild-type P22 versus an in-frame ninY deletion mutant across clinical Salmonella isolates.
  hypothesis: NinY binds a specific host factor to enhance P22 lytic development in non-laboratory Salmonella hosts.
status: COMPLETE
