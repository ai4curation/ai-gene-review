suggested_questions:
- question: Do any of the six amino acid substitutions between P22 gp23 and E. coli phage lambda Q adapt gp23 to differences
    between Salmonella and E. coli RNA polymerase or NusA?
  experts:
  - Jeffrey W. Roberts
  - Bryce E. Nickels
suggested_experiments:
- description: In vitro transcription antitermination assays comparing P22 gp23 and lambda Q activity on purified Salmonella
    enterica vs. Escherichia coli RNA polymerase holoenzyme at PR'.
  hypothesis: Because P22 gp23 and lambda Q share 201 of 207 residues, both proteins are functionally interchangeable across
    Salmonella and E. coli RNAP complexes.
