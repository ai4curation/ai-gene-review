  supporting_entities:
  - UniProtKB-KW:KW-0863
  - UniRule:UR001551467
  review:
    summary: gp23 contains a conserved C4-type zinc finger domain (Cys-118, Cys-121, Cys-144, Cys-147) that coordinates a
      structural Zn2+ ion.
    action: ACCEPT
    reason: The C4 zinc finger domain (residues 118-147, InterPro:IPR036410) is strictly conserved between P22 gp23 and phage
      lambda Q.
    supported_by:
