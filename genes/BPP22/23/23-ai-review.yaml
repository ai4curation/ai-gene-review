    label: transcription antitermination
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR001551467
  review:
    summary: gp23 is the late transcriptional antiterminator of phage P22, enabling host RNA polymerase to read through the
      tR' terminator preceding the late operon.
    action: ACCEPT
    reason: Transcription antitermination of the late operon is the primary biological function of P22 gp23 (PMID:11053393).
    supported_by:
