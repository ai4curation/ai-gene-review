id: P57020
gene_symbol: '23'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Late gene transcriptional antiterminator gp23 (homolog of phage lambda Q) of Salmonella phage P22 that binds
  the DNA Q-binding element (QBE) at the late promoter PR' via a C-terminal helix-turn-helix motif and C4 zinc finger, loads
  onto paused host RNA polymerase, and modifies the elongation complex to read through the late transcription terminator into
  the lysis and morphogenetic gene cluster.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003222
  - UniProtKB-KW:KW-0238
  - UniRule:UR001551467
  review:
    summary: gp23 binds specifically to the DNA Q-binding element (QBE) upstream of the late promoter pause site via its helix-turn-helix
      DNA-binding domain.
    action: ACCEPT
    reason: Sequence-specific binding to the QBE DNA site is required for gp23 recruitment to the paused early elongation
      complex, supported by 97% sequence identity (201/207 residues) with phage lambda Q (PMID:11053393, PMID:12562822) and
      HAMAP rule MF_04158.
    supported_by:
    - reference_id: PMID:12562822
      supporting_text: For example, the DNA sequences of gene 23 of P22 (where a number of the differences between P22 and
        P22-pbi lie) and gene Q of phage λ differ by 30 nucleotides, but the encoded protein sequences differ by only six
        amino acids.
    - reference_id: file:genes/BPP22/23/23-uniprot.txt
      supporting_text: To join the elongation complex, binds a ... specific DNA Q-binding element (QBE) and interacts with
        RNAP that is ... paused during early elongation.
- term:
    id: GO:0006353
    label: DNA-templated transcription termination
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0806
  - UniRule:UR001551467
  review:
    summary: Misleading keyword-derived term; gp23 is a transcriptional antiterminator that prevents termination rather than
      promoting it.
    action: MODIFY
    reason: gp23 suppresses transcription termination at the late terminator tR' to drive late gene expression (PMID:11053393);
      GO:0031564 (transcription antitermination), already present on this record, is the accurate term.
    proposed_replacement_terms:
    - id: GO:0031564
      label: transcription antitermination
    supported_by:
    - reference_id: PMID:11053393
      supporting_text: Late gene expression is regulated, as it is in coliphage λ, in an antitermination-dependent mechanism
        involving gp23, a Q homologue ( 48 ).
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003222
  - UniRule:UR001551467
  review:
    summary: Correct but overly general; gp23 specifically mediates transcription antitermination and positive regulation
      of viral late transcription.
    action: MODIFY
    reason: gp23 specifically activates viral late gene expression by transcription antitermination (PMID:11053393), which
      is more precisely captured by the descendant terms GO:0031564 (transcription antitermination) and GO:0050434 (positive
      regulation of viral transcription).
    proposed_replacement_terms:
    - id: GO:0031564
      label: transcription antitermination
    - id: GO:0050434
      label: positive regulation of viral transcription
    supported_by:
    - reference_id: PMID:11053393
      supporting_text: Late gene expression is regulated, as it is in coliphage λ, in an antitermination-dependent mechanism
        involving gp23, a Q homologue ( 48 ).
