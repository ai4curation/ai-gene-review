- id: PMID:3491212
  title: Structural and regulatory divergence among site-specific recombination genes of lambdoid phage.
  findings:
  - statement: Identified and sequenced the P22 xis and int genes adjacent to the phage attachment site.
    supporting_text: In this study, we have identified and sequenced the int and xis genes of phi 80 and P22. phi 80 int and
      xis were identified using a plasmid recombination assay in vivo, and the P22 genes were mapped using Tn1 insertion mutations.
      In all three phage, the site-specific recombination genes are located directly adjacent to the phage attachment site.
- id: PMID:18502866
  title: Purification and characterization of bacteriophage P22 Xis protein.
  findings:
  - statement: Purified P22 Xis and demonstrated that it binds four repeated motifs (X1-X4) in attR DNA and bends the DNA
      by ~137 degrees to promote excisive recombination.
    supporting_text: We purified P22 Xis and studied the protein in vitro by means of electrophoretic mobility shift assays
      and footprinting, cross-linking, gel filtration stoichiometry, and DNA bending assays. We identified one protected site
      that is bent approximately 137 degrees when bound by P22 Xis.
