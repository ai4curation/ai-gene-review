id: P04889
gene_symbol: xis
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Architectural DNA-binding excisionase (Xis, recombination directionality factor) of Salmonella phage P22 that
  binds cooperatively to four repeated motifs (X1-X4) within the attR attachment site and bends the DNA by approximately 137
  degrees, promoting integrase-catalyzed excisive recombination (provirus excision) from the host chromosome.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0238
  review:
    summary: P22 Xis binds specifically to four repeated motifs (X1-X4) in the P arm of attR DNA and bends the DNA by ~137
      degrees.
    action: ACCEPT
    reason: Direct sequence-specific DNA binding and bending by purified P22 Xis have been demonstrated by EMSA, DNase I/DMS
      footprinting, and circular permutation assays (PMID:18502866).
    supported_by:
    - reference_id: PMID:18502866
      supporting_text: We purified P22 Xis and studied the protein in vitro by means of electrophoretic mobility shift assays
        and footprinting, cross-linking, gel filtration stoichiometry, and DNA bending assays. We identified one protected
        site that is bent approximately 137 degrees when bound by P22 Xis.
    - reference_id: PMID:18502866
      supporting_text: Inspection of the protected DNA sequence revealed a 6-bp “TTTGCA” motif that is directly repeated three
        times (X1, X2, and X3) and imperfectly repeated once as “TTTCGA” (X4)
- term:
    id: GO:0006310
    label: DNA recombination
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0233
  review:
    summary: Correct but overly general; P22 Xis specifically directs site-specific provirus excision (GO:0032359).
    action: MODIFY
    reason: P22 Xis specifically functions as the recombination directionality factor for excisive recombination (provirus
      excision), which is already represented on this record by the more specific descendant term GO:0032359.
    proposed_replacement_terms:
    - id: GO:0032359
      label: provirus excision
    supported_by:
    - reference_id: PMID:18502866
      supporting_text: The temperate bacteriophages lambda and P22 share similarities in their site-specific recombination
        reactions. Both require phage-encoded integrase (Int) proteins for integrative recombination and excisionase (Xis)
        proteins for excision.
- term:
    id: GO:0032359
    label: provirus excision
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
