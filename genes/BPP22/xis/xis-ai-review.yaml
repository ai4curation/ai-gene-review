suggested_questions:
- question: Does the basic C-terminal tail of P22 Xis directly contact P22 Int to stabilize cooperative binding to adjacent
    arm-type sites, analogous to the lambda Xis-Int interaction?
  experts:
  - Jeffrey F. Gardner
  - Reid C. Johnson
suggested_experiments:
- description: High-resolution structure determination of the P22 Xis micronucleoprotein filament bound to the 45-bp X1-X4
    DNA segment by X-ray crystallography or cryo-EM.
  hypothesis: Four P22 Xis monomers bind head-to-tail along the X1-X4 direct repeats via their HTH_17 domains, introducing
    a cumulative ~137-degree writhe into the P arm of attR.
