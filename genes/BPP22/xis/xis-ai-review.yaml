  review:
    summary: P22 Xis is an essential architectural component of the excisive intasome required for excision of the P22 prophage
      from the host chromosome.
    action: ACCEPT
    reason: Genetic and biochemical analyses confirm that P22 Xis is required in conjunction with Int and IHF for site-specific
      excision of the prophage from the host genome (PMID:3491212, PMID:18502866).
    supported_by:
    - reference_id: PMID:18502866
      supporting_text: The temperate bacteriophages lambda and P22 share similarities in their site-specific recombination
        reactions. Both require phage-encoded integrase (Int) proteins for integrative recombination and excisionase (Xis)
        proteins for excision.
