  review:
    summary: C1 activates viral transcription from the PRE and Pa23 promoters to drive c2 repressor synthesis and antisense
      inhibition of late gene 23 expression.
    action: NEW
    reason: C1 directly stimulates transcription from the phage promoters PRE and Pa23 both in vitro and in vivo (PMID:1385814,
