  qualifier: enables
  review:
    summary: C1 is a sequence-specific DNA-binding transcriptional activator that stimulates RNA polymerase transcription
      from the P22 PRE and Pa23 promoters.
    action: NEW
    reason: Biochemical and in vivo assays demonstrate that the P22 C1 homotetramer binds specific -35 promoter motifs and
      directly activates transcription from PRE and Pa23 (PMID:1385814).
    supported_by:
    - reference_id: PMID:1385814
      supporting_text: P22 C1 was shown to be a tetrameric protein composed of four identical subunits with M(r) = 10,000.
        Moreover, we identified and characterized two P22 C1-dependent phage promoters, P(RE) and Pa23, whose function was
        completely dependent on C1 both in vitro and in vivo. These two promoters share a common TTGCN6TTGC/T motif in their
        -35 regions, the same motif recognized by the analogous phage lambda transcription activator protein cII.
    - reference_id: file:genes/BPP22/C1/C1-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Binds to two promoters, P(RE) and Pa23 and activate ... transcription from these
        promoters.'
