suggested_questions:
- question: Does P22 C1 also activate an integrase promoter (analogous to lambda PI) in phage P22, or is int expression in
    P22 regulated differently from PRE and Pa23?
  experts:
  - Martin Rosenberg
  - Sherwood R. Casjens
suggested_experiments:
- description: Genome-wide ChIP-seq and in vitro transcription profiling of P22 C1 across the entire P22 genome to determine
    whether additional C1-dependent promoters exist beyond PRE and Pa23.
  hypothesis: P22 C1 binds specifically to TTGC(N6)TTGY motifs at PRE and Pa23 to coordinate repressor synthesis with antisense
    inhibition of late gene expression.
