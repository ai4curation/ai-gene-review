id: P03041
gene_symbol: C1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Homotetrameric DNA-binding transcriptional activator (C1, homolog of phage lambda cII) of Salmonella phage P22
  that promotes the establishment of lysogeny by binding TTGCN6TTGC/T direct-repeat motifs in the -35 regions of the phage
  PRE and Pa23 promoters and activating host RNA polymerase transcription.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007933
  - InterPro:IPR010982
  - UniProtKB-KW:KW-0238
  review:
    summary: C1 directly binds the TTGCN6TTGC/T motif in the -35 regions of the P22 PRE and Pa23 promoters via its helix-turn-helix
      domain.
    action: ACCEPT
    reason: Sequence-specific DNA binding of the P22 C1 homotetramer to the TTGCN6TTGC/T motif at PRE and Pa23 has been demonstrated
      experimentally in vitro and in vivo (PMID:1385814).
    supported_by:
    - reference_id: PMID:1385814
      supporting_text: Moreover, we identified and characterized two P22 C1-dependent phage promoters, P(RE) and Pa23, whose
        function was completely dependent on C1 both in vitro and in vivo. These two promoters share a common TTGCN6TTGC/T
        motif in their -35 regions, the same motif recognized by the analogous phage lambda transcription activator protein
        cII.
    - reference_id: file:genes/BPP22/C1/C1-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Binds to two promoters, P(RE) and Pa23 and activate ... transcription from these
        promoters.'
