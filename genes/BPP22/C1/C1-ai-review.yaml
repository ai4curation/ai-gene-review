- id: PMID:1385814
  title: Characterization of the transcription activator protein C1 of bacteriophage P22.
  findings:
  - statement: Purified P22 C1 and showed that it is a homotetramer of 10-kDa subunits that recognizes TTGCN6TTGC/T motifs
      in the -35 regions of PRE and Pa23 to activate transcription in vitro and in vivo.
    supporting_text: P22 C1 was shown to be a tetrameric protein composed of four identical subunits with M(r) = 10,000. Moreover,
      we identified and characterized two P22 C1-dependent phage promoters, P(RE) and Pa23, whose function was completely
      dependent on C1 both in vitro and in vivo. These two promoters share a common TTGCN6TTGC/T motif in their -35 regions,
      the same motif recognized by the analogous phage lambda transcription activator protein cII.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Summarizes the role of P22 C1 in stimulating transcription from PRE and Pa23 by recognizing TTGC(N6)TTGY motifs.
    supporting_text: The P22 homologue, C1 protein, also stimulates transcription from P RE and P a23 (the P22 Q homologue)
      ( 27 ). P22 C1-binding sites, have the recognition motif TTGC(N 6 )TTGY ( 27 ), while its homologue, lambda CII protein,
      recognizes TTGC(N 6 )TTGC ( 28 ).
