id: P14107
gene_symbol: P14107
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Uncharacterized 78-residue (8.6 kDa) protein (ORF78) encoded in the early left (PL) operon intergenic region
  between ral and gene 17 of Salmonella phage P22. It is the founding member of the conserved phage protein family Phage_P22_Y8K6
  (InterPro:IPR059809, Pfam:PF27050), and its molecular function and biological role remain unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:2738922
  title: Genetic structure of the bacteriophage P22 PL operon.
  findings:
  - statement: Sequenced 1,416 bp of the P22 early left (PL) operon spanning the ral to abc2 region containing ORF78 (P14107).
    supporting_text: The sequence of 1416 base-pairs of the P22 PL operon was determined, linking a continuous sequence from
      PL through abc2.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Included ORF78 (P14107) in the complete genome annotation of Salmonella phage P22.
    supporting_text: The sequence was reanalyzed using more modern algorithms, revealing a total of 65 ORFs, 29 (45%) of which
      showed no similarity to those of any other protein in the GenBank protein database.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Confirmed the genome sequence and annotation of bacteriophage P22 including ORF78.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:BPP22/P14107/P14107-uniprot.txt
  title: UniProtKB record for P14107 (P14107)
  findings:
  - statement: Annotates P14107 (ORF78) as a predicted 78-residue protein belonging to the Phage_P22_Y8K6 family (InterPro:IPR059809,
      Pfam:PF27050).
    supporting_text: DR   InterPro; IPR059809; Phage_P22_Y8K6.
suggested_questions:
- question: What is the function of the conserved Phage_P22_Y8K6 (ORF78 / P14107) protein encoded in the early left (PL) operon
    of lambdoid phages?
  experts:
  - Sherwood R. Casjens
  - Anthony R. Poteete
suggested_experiments:
- description: Express affinity-tagged ORF78 (P14107) in Salmonella enterica serovar Typhimurium for pull-down mass spectrometry
    and test a P22 delta-ORF78 mutant for growth and superinfection phenotypes across diverse Salmonella hosts.
  hypothesis: ORF78 interacts with a host cytoplasmic protein during early infection to modulate host physiology or phage
    defense.
