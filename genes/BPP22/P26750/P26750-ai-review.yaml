id: P26750
gene_symbol: P26750
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Uncharacterized 69-amino-acid (7.7 kDa) predicted protein (ORF69 / ORF109) encoded in the intergenic region between
  the major capsid protein gene 5 and the head-to-tail adapter gene 4 within the late morphogenetic operon of Salmonella phage
  P22. It contains a predicted C-terminal disordered basic segment (residues 48-69) and lacks known sequence domains or experimentally
  determined function.
existing_annotations: []
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Complete genomic sequencing of phage P22 (41,724 bp) annotates 65 open reading frames across the genome.
    supporting_text: The sequence of the nonredundant region of the Salmonella enterica serovar Typhimurium temperate, serotype-converting
      bacteriophage P22 has been completed. The genome is 41,724 bp with an overall moles percent GC content of 47.1%.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Resequencing of the phage P22 genome corrected a 0.14% error rate across previously determined sequence fragments.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: PMID:1853558
  title: Nucleotide sequence of the bacteriophage P22 genes required for DNA packaging.
  findings:
  - statement: Nucleotide sequencing of the P22 capsid-assembly and DNA-stabilization gene cluster identified a nonessential
      open reading frame (ORF109 / ORF69) between genes 5 and 4.
    supporting_text: In this report we present the nucleotide sequence of 7461 bp of P22 DNA that contains the five genes
      required for DNA condensation, as well as a nonessential open reading frame (ORF109), gene 4, and a portion of gene
      10.
core_functions:
- description: Uncharacterized nonessential open reading frame (ORF109 / ORF69) located in the intergenic region between the
    major capsid protein gene 5 and the head-to-tail adapter gene 4; no molecular function has been experimentally established.
  supported_by:
  - reference_id: PMID:1853558
    supporting_text: In this report we present the nucleotide sequence of 7461 bp of P22 DNA that contains the five genes
      required for DNA condensation, as well as a nonessential open reading frame (ORF109), gene 4, and a portion of gene
      10.
suggested_questions:
- question: Is ORF69 (P26750) translated during the late lytic cycle of phage P22, or does the gp5-gp4 intergenic sequence
    primarily serve as a transcriptional attenuator or RNA secondary structure regulating the stoichiometry of major coat
    protein (gp5) relative to downstream tail factors (gp4, gp10, gp26)?
  experts:
  - Sherwood R. Casjens
  - Peter E. Prevelige Jr.
suggested_experiments:
- description: Perform ribosome profiling (Ribo-seq) and targeted mass spectrometry on P22-infected Salmonella enterica cells
    during late lytic infection, and test whether synonymous start-codon disruption of ORF69 affects gp4/gp10 expression or
    burst size.
  hypothesis: The gp5-gp4 intergenic region acts primarily as a cis-regulatory RNA element down-regulating translation of
    downstream tail adapter genes relative to the abundant gp5 coat protein, rather than encoding an essential virion protein.
