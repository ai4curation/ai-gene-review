- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: Core biological process of the o-spanin subunit Rz1 in disrupting the host outer membrane to complete bacteriophage
      P22 host cell lysis.
    action: ACCEPT
    reason: Rz1 is a conserved o-spanin family lipoprotein (`InterPro:IPR010346`, `Pfam:PF06085`) that complexes with the
      inner membrane subunit gp15 across the periplasm to disrupt the host outer membrane after peptidoglycan degradation,
      completing viral release by cytolysis.
    supported_by:
    - reference_id: file:BPP22/Rz1/Rz1-uniprot.txt
      supporting_text: 'FUNCTION: Component of the spanin complex that disrupts the host outer membrane and participates in
        cell lysis during virus exit. The spanin complex conducts the final step in host lysis by disrupting the outer membrane
        after holin and endolysin action have permeabilized the inner membrane and degraded the host peptidoglycans. Host
        outer membrane disruption is possibly due to local fusion between the inner and outer membrane performed by the spanin
        complex (By similarity).'
  supporting_entities:
  - InterPro:IPR010346
  extensions:
