  label: Lederbergvirus P22
description: Outer membrane lipoprotein spanin subunit (o-spanin Rz1) of Salmonella phage P22, encoded in an overlapping +1
  reading frame embedded within the inner membrane spanin gene 15 (Rz). Synthesized as a 61-residue prolipoprotein, it is
  processed to a 33-residue mature periplasmic lipoprotein anchored to the inner leaflet of the host outer membrane and interacts
  via its C-terminus with the inner membrane subunit gp15 to form the periplasm-spanning spanin complex that disrupts the
  host outer membrane during viral release by cytolysis.
