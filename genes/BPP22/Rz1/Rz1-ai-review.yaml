- id: file:BPP22/Rz1/Rz1-uniprot.txt
  title: UniProtKB record for Rz1 (A8CGF6)
  findings:
  - statement: Describes P22 Rz1 (A8CGF6) as a 61-residue outer lipoprotein spanin subunit (InterPro:IPR010346, Pfam:PF06085)
      processed to a mature 33-residue lipoprotein anchored at Cys29 to the host outer membrane and interacting via its C-terminus
      with inner membrane subunit gp15 to disrupt the host outer membrane during viral release.
    supporting_text: 'FUNCTION: Component of the spanin complex that disrupts the host outer membrane and participates in
      cell lysis during virus exit. The spanin complex conducts the final step in host lysis by disrupting the outer membrane
      after holin and endolysin action have permeabilized the inner membrane and degraded the host peptidoglycans. Host outer
      membrane disruption is possibly due to local fusion between the inner and outer membrane performed by the spanin complex
      (By similarity).'
suggested_questions:
- question: Does P22 Rz1 form an intermolecular disulfide-linked homodimer via its single internal cysteine or rely solely
    on proline-rich coiled-coil packing with disulfide-linked gp15 dimers to drive outer membrane fusion?
  experts:
  - Ryland Young
  - Sherwood R. Casjens
suggested_experiments:
- description: Construct a P22 Rz1 nonsense mutant that leaves the overlapping gene 15 (Rz) amino acid sequence intact and
    assay host cell lysis kinetics with and without 10 mM MgCl2 in Salmonella enterica serovar Typhimurium.
  hypothesis: Loss of Rz1 alone phenocopies the gene 15 null defect in Mg2+-stabilized medium, confirming that both subunits
    of the gp15-Rz1 spanin complex are required for outer membrane disruption.
