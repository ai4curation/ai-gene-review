id: Q03550
gene_symbol: eai
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Protein EaI of Salmonella phage P22 is a 64-amino-acid early accessory protein encoded in the non-essential ea
  region between int and erf, detected by SDS-PAGE in UV-irradiated host cells infected with P22. It belongs to the conserved
  Phage_P22_Eai family (IPR059721 / PF26866), and its specific biochemical and physiological function during phage infection
  remains unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:8412679
  title: The int genes of bacteriophages P22 and lambda are regulated by different mechanisms.
  findings:
  - statement: A 3.3-kb DNA sequence between the P22 pL promoter and the int gene is densely packed with genes whose predicted
      products correlate with the early proteins mapped by Youderian and Susskind in 1980.
    supporting_text: We have also determined the DNA sequence of a 3.3 kb segment that closes the gap between previously reported
      sequences to give a continuous sequence between the P22 pL promoter and the int gene. The newly determined sequence
      is densely packed with genes from the pL direction, and the proteins predicted by the sequence show excellent correlation
      with the proteins mapped by Youderian and Susskind in 1980.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Reanalysis of the complete P22 genome identified 65 open reading frames, updating the positions of previously
      identified ORFs.
    supporting_text: Many of the P22 ORFs were previously identified ( 48 ). We reanalyzed the sequence data, updating the
      positions of the previously identified ORFs and making limited corrections.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Resequencing of the bacteriophage P22 genome established an accurate reference genome sequence correcting a
      0.14% error rate in prior sequences.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
suggested_questions:
- question: What is the cellular target and biological role of the conserved Phage_P22_Eai (PF26866) protein family during
    early lambdoid phage infection?
suggested_experiments:
- description: Express epitope-tagged P22 EaI in Salmonella enterica for affinity purification-mass spectrometry (AP-MS) and
    assay an eai deletion mutant across a panel of Salmonella strains harboring diverse prophage and defense systems.
  hypothesis: EaI binds a specific host or prophage protein to facilitate early P22 infection in non-laboratory Salmonella
    hosts.
status: COMPLETE
