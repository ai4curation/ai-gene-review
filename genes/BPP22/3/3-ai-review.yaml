- id: PMID:18775728
  title: Assembly architecture and DNA binding of the bacteriophage P22 terminase small subunit.
  findings:
  - statement: Nonameric gp3 rings bind double-stranded DNA via electrostatic interactions with basic residues 143-152 in
      the C-terminal tail.
    supporting_text: Electromobility shift assays indicate that the gp3 ring binds double-stranded DNA nonspecifically in
