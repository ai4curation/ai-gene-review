suggested_questions:
- question: Does viral concatemeric DNA thread through the ~23 Å central channel of the gp3 nonamer during packaging initiation,
    or wrap around the exterior of the ring before transfer to the gp2 motor?
  experts:
  - Gino Cingolani
  - Sherwood R. Casjens
suggested_experiments:
- description: Determine the cryo-EM structure of the P22 1S-terminase:2L-terminase holoenzyme bound to a pac-site dsDNA substrate
    to resolve whether DNA passes through the central pore of the gp3 nonamer or binds along its C-terminal tentacles.
  hypothesis: Viral pac-site DNA is initially captured by the flexible basic C-terminal tails (residues 140-162) and positioned
    into the ~23 Å central channel of the gp3 nonamer to align with the gp2 nuclease and ATPase domains.
