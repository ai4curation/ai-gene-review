taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Terminase small subunit (gp3) of Salmonella phage P22 that assembles into a homononameric ring with a ~23 Å central
  channel and initiates headful viral DNA genome packaging. It recognizes the viral packaging initiation site (pac) and binds
  double-stranded DNA via its basic C-terminal tail (residues 140-162), recruits two protomers of the terminase large subunit
  (gp2) to form the viral terminase holoenzyme, and stimulates gp2 genome-packaging ATPase activity in a DNA-dependent manner.
