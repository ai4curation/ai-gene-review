- id: PMID:22771211
  title: Small terminase couples viral DNA binding to genome-packaging ATPase activity.
  findings:
  - statement: The 1.75 Å crystal structure of P22 S-terminase reveals a nonameric ring with a ~23 Å central channel whose
      C-terminal 23 residues bind DNA and L-terminase and stimulate L-terminase ATPase activity.
    supporting_text: Here we describe the 1.75 Å crystal structure of the bacteriophage P22 S-terminase in a nonameric conformation.
      The structure presents a central channel ∼23 Å in diameter, sufficiently large to accommodate hydrated B-DNA. The last
      23 residues of S-terminase are essential for binding to DNA and assembly to L-terminase. Upon binding to its own DNA,
      S-terminase functions as a specific activator of L-terminase ATPase activity.
- id: PMID:26301600
  title: Architecture of the Complex Formed by Large and Small Terminase Subunits from Bacteriophage P22.
  findings:
  - statement: One nonameric S-terminase ring associates via residues 140-162 with residues 1-58 of two L-terminase monomers
      to form the 1S-terminase:2L-terminase complex.
    supporting_text: Mapping studies revealed that the N-terminus of L-terminase ATPase domain (residues 1-58) contains a
      minimal S-terminase binding domain sufficient for stoichiometric association with residues 140-162 of S-terminase, the
      L-terminase binding domain. Hydrodynamic analysis by analytical ultracentrifugation sedimentation velocity and native
      mass spectrometry revealed that the purified terminase complex consists predominantly of one copy of the nonameric S-terminase
      bound to two equivalents of L-terminase (1S-terminase:2L-terminase).
