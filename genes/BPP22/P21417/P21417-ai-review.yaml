id: P21417
gene_symbol: P21417
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Uncharacterized 201-residue (22.8 kDa) protein (ORF201) encoded in the late operon intergenic region between
  spanin gene 15 and small terminase subunit gene 3 of Salmonella phage P22. It contains a phage Rha-like domain (InterPro:IPR014054,
  Pfam:PF09669, NCBIfam:TIGR02681) and a C-terminal ORF201 domain (InterPro:IPR018877, Pfam:PF10549) with similarity to Haemophilus
  influenzae HI_1412; deletion analysis shows that it is non-essential for lytic growth or lysogeny under standard laboratory
  conditions.
existing_annotations: []
core_functions: []
references:
- id: PMID:2763468
  title: 'Nucleotide sequence of the bacteriophage P22 gene 19 to 3 region: identification of a new gene required for lysis.'
  findings:
  - statement: Sequenced the 2,558-bp region between genes 19 and 3 containing ORF201 (P21417) and demonstrated by deletion
      mutagenesis that the region between gene 15 and gene 3 contains no genes essential for lytic growth or lysogeny.
    supporting_text: In addition, deletions were constructed which show that phage P22 has no additional genes required for
      lytic growth of lysogeny between genes 19 and 3.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Included ORF201 (P21417) in the complete genome sequence and annotation of Salmonella phage P22.
    supporting_text: The sequence was reanalyzed using more modern algorithms, revealing a total of 65 ORFs, 29 (45%) of which
      showed no similarity to those of any other protein in the GenBank protein database.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Confirmed the genome sequence and annotation of bacteriophage P22 including ORF201.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:BPP22/P21417/P21417-uniprot.txt
  title: UniProtKB record for P21417 (P21417)
  findings:
  - statement: Annotates P21417 (ORF201) as a predicted 201-residue protein with a Phage_regulatory_Rha domain (InterPro:IPR014054,
      Pfam:PF09669, NCBIfam:TIGR02681), a C-terminal Phage_P22_Orf201_C domain (InterPro:IPR018877, Pfam:PF10549), and similarity
      to Haemophilus influenzae HI_1412.
    supporting_text: 'SIMILARITY: To H.influenzae HI_1412.'
suggested_questions:
- question: Does P22 ORF201 (P21417) restrict phage growth in integration host factor (IHF / ihfA / ihfB) mutant Salmonella
    enterica hosts in the manner reported for lambdoid phage phi80 Rha?
  experts:
  - Sherwood R. Casjens
  - Gary N. Gussin
suggested_experiments:
- description: Compare plating efficiency and burst size of wild-type P22 and a P22 delta-ORF201 deletion mutant on wild-type
    and ihfA/ihfB-deficient Salmonella enterica serovar Typhimurium strains, and test whether ectopic ORF201 expression inhibits
    growth of IHF-deficient cells.
  hypothesis: ORF201 acts as a conditional Rha-like regulatory protein whose activity is masked in wild-type hosts by integration
    host factor (IHF).
