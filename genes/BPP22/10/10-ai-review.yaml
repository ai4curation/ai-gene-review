core_functions:
- description: Forms the hexameric tail hub (baseplate hub) of the P22 tail apparatus that attaches to the dodecameric gp4
    adapter ring after DNA packaging, scaffolds the six lateral gp9 tailspike trimers and the central gp26 tail needle plug
    during virion assembly, and serves as the axial nozzle from which the trans-envelope genome ejection channel extends during
    infection.
