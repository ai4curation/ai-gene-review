  qualifier: involved_in
  review:
    summary: Hexameric gp10 binds the gp1-gp4 neck complex after DNA packaging and recruits the gp26 tail needle and gp9 tailspikes
      to complete virion morphogenesis.
    action: NEW
    reason: In vitro tail assembly studies demonstrate that hexameric gp10 binds the dodecameric gp4 ring and is required
      for attachment of the gp26 plug and gp9 tailspikes to stabilize packaged DNA inside the mature virion.
    supported_by:
    - reference_id: PMID:26574546
      supporting_text: First, following genome packaging by the large and small terminase subunits ( 21 – 23 ), the tail needle
        is one of the three virus-encoded tail factors (gp4, gp10, and gp26) that bind to the portal vertex, stabilizing packaged
        DNA inside the virion ( 24 ).
- term:
    id: GO:0099002
    label: symbiont genome ejection through host cell envelope, short tail mechanism
  evidence_type: IDA
  original_reference_id: PMID:30886360
  qualifier: involved_in
  review:
    summary: During infection initiation, release of the gp26 needle from the gp10 hub opens the tail channel and allows ejected
      gp7* to assemble into an extracellular channel extending from the distal end of the gp10 baseplate to the host outer
      membrane.
    action: NEW
    reason: Cryo-electron tomography of P22 infection intermediates shows that the gp10 baseplate forms the axial exit nozzle
      of the virion from which the ~40 nm trans-envelope genome ejection channel extends to the bacterial cell envelope.
    supported_by:
