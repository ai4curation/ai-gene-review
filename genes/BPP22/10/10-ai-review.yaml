suggested_questions:
- question: Does mechanical torque generated by gp9 tailspike hydrolysis of O-antigen lipopolysaccharide propagate through
    the lateral interfaces of the hexameric gp10 hub to release the N-terminal plug of gp26, or is gp26 dislodged directly
    by outer membrane insertion?
  experts:
  - Ian J. Molineux
  - Gino Cingolani
suggested_experiments:
- description: Engineer disulfide cross-links between the N-terminal tip of gp26 and the internal lumen of gp10 and assay
    whether LPS-bound tailspikes induce conformational strain in gp10 by cryo-EM and fluorescence dequenching.
  hypothesis: Direct insertion of the C-terminal tip of gp26 into the outer membrane, assisted by gp9-mediated virion positioning,
    mechanically extracts the N-terminal plug from the rigid gp10 lumen without requiring large-scale opening of the gp10
    hexamer.
