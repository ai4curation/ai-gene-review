id: Q38664
gene_symbol: ninE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Conserved 58-amino-acid lambdoid NinE-family protein encoded in the early right (PR) nin region of Salmonella
  phage P22 between ninD and ninX; its specific molecular function remains uncharacterized.
existing_annotations: []
core_functions:
- description: Conserved lambdoid phage NinE-family protein (InterPro:IPR007986, Pfam:PF05322) encoded in the P22 nin region
    whose biochemical activity and cellular target are currently unknown.
  supported_by:
  - reference_id: PMID:11053393
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
  - reference_id: file:genes/BPP22/ninE/ninE-uniprot.txt
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the ninE family. {ECO:0000305}.'
references:
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identifies ninE as a conserved lambdoid gene within the early right nin region of Salmonella phage P22.
    supporting_text: The nin region shows genes which are clearly lambdoid interspersed with genes, such as ninX and ninY
      , which are not.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Reports the corrected complete genome sequence of Salmonella bacteriophage P22.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:genes/BPP22/ninE/ninE-uniprot.txt
  title: UniProt:Q38664 (NINE_BPP22)
  findings:
  - statement: P22 NinE is a 58-residue protein belonging to the lambdoid NinE family (InterPro:IPR007986, Pfam:PF05322).
    supporting_text: 'CC   -!- SIMILARITY: Belongs to the ninE family. {ECO:0000305}.'
suggested_questions:
- question: What is the molecular target of the conserved lambdoid NinE family (Pfam:PF05322) during phage infection of enteric
    bacteria?
  experts:
  - Sherwood R. Casjens
  - Gary J. Sharples
suggested_experiments:
- description: Express epitope-tagged P22 NinE in Salmonella enterica serovar Typhimurium during P22 infection and perform
    co-immunoprecipitation with mass spectrometry and nucleic acid crosslinking.
  hypothesis: NinE interacts with either nucleic acids or a conserved host protein complex during early lytic phage development.
status: COMPLETE
