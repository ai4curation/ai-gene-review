  review:
    summary: P22 Ral modulates the enzymatic activity of the host Type I restriction-modification methyltransferase to promote
      methylation of unmodified DNA sites.
    action: NEW
    reason: P22 Ral acts as an enzyme modulator that alters the specificity/activity of the host Type I restriction-modification
      methylase from maintenance methylation to de novo methylation of unmodified phage DNA (PMID:2738922).
    supported_by:
