taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Antirestriction protein Ral of Salmonella phage P22 (homolog of phage lambda Ral) that enables unmodified phage
  DNA to evade host Type I restriction-modification systems by modulating the host restriction-modification methyltransferase
  to methylate unmethylated recognition sites rather than cleaving them.
