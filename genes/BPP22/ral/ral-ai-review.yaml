suggested_questions:
- question: Does P22 Ral bind directly to the HsdM2S1 methyltransferase core of Salmonella StyLT/StySB Type I restriction-modification
    systems in the same manner as EcoKI?
  experts:
  - David T. F. Dryden
  - Noreen E. Murray
suggested_experiments:
- description: Cryo-EM structural analysis and in vitro DNA methylation assays of purified P22 Ral bound to the host Type
    I methyltransferase complex (M2S1) on unmethylated vs. hemimethylated bipartite target DNA.
  hypothesis: P22 Ral allosterically shifts the M2S1 complex into a closed methylation-competent conformation on unmethylated
    DNA substrates, bypassing HsdR-mediated restriction.
