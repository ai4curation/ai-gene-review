  label: Lederbergvirus P22
description: Portal protein (gp1) of Salmonella phage P22 that assembles into a dodecameric ring (~0.96 MDa) at a unique 5-fold
  vertex of the icosahedral capsid, forming the bidirectional axial channel for viral DNA entry and exit. During morphogenesis,
  gp1 interacts with the scaffolding protein (gp8) to nucleate procapsid assembly, serves as the docking site for the terminase
  complex (gp2-gp3) and the pressure-sensitive headful gauge that signals packaging termination, and subsequently binds the
  head-to-tail adapter (gp4) while extending a ~200 Å C-terminal alpha-helical barrel into the capsid interior to guide genome
  spooling and ejection into the host cell.
