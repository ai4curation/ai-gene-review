suggested_questions:
- question: How does the C-terminal alpha-helical barrel domain of gp1 transition from its procapsid conformation—where internal
    ejection proteins (gp7, gp16, gp20) are loaded—to the extended ~200 Å rifle barrel observed in the mature virion after
    DNA packaging?
  experts:
  - Gino Cingolani
  - Carolyn M. Teschke
suggested_experiments:
- description: Determine high-resolution asymmetric cryo-EM reconstructions of P22 procapsids stalled at progressive stages
    of in vitro DNA packaging to visualize the folding of the gp1 C-terminal barrel domain and compression of the portal core.
  hypothesis: Increasing intravirion DNA density compresses the portal core and orders the Gln-rich C-terminal barrel around
    the terminal segment of packaged DNA while displacing the terminase complex in favor of gp4.
