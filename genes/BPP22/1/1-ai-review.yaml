references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:1569567
  title: Bacteriophage P22 portal protein is part of the gauge that regulates packing density of intravirion DNA.
  findings:
  - statement: Point mutations in the P22 portal protein alter the length and packing density of packaged permuted DNA without
      changing capsid radius, showing that gp1 is part of the headful packaging gauge.
    supporting_text: The results obtained with one mutant (NT5/1a) indicate no change (+/- 0.5%) in the radius of the capsid,
      but mature DNA that is 4.7% longer and a packing density that is commensurately higher than those of wild-type P22.
      Thus, the portal protein is part of the gauge that regulates the length and packaging density of DNA in bacteriophage
      P22.
- id: PMID:21499245
  title: Three-dimensional structure of a viral genome-delivery portal vertex.
  findings:
  - statement: The P22 portal protein forms a dodecameric ~0.96 MDa ring (~300 Å tall) with a C-terminal ~200 Å alpha-helical
      barrel domain (residues 603-725) that extends into the capsid and directs DNA spooling and ejection.
    supporting_text: The P22 portal protein folds into a ~0.96 MDa ring of twelve identical subunits, symmetrically arranged
      around a central channel of variable diameter (Fig. 1a–d), with an overall height of ~300 Å. Gp4 binds to the bottom
      of portal protein forming a second dodecameric ring ~75 Å in height (Fig. 1a,b). The quaternary structure of the P22
      portal protein can be described as a funnel-shaped core ~170 Å in diameter, connected to a ~200 Å long largely α-helical
      tube formed by the C-terminal residues 603–725, which resembles a rifle barrel.
- id: PMID:28242514
  title: Targeted mutagenesis of the P22 portal protein reveals the mechanism of signal transmission during DNA packaging.
  findings:
  - statement: Compression of the gp1 portal core transmits the headful DNA density signal to terminate DNA packaging.
    supporting_text: Mutations in the portal core that subtly alter the structure or dynamics of the protein result in an
      increase in the amount of DNA packaged. The magnitude of the change is amino acid and location specific. Our findings
      suggest a mechanism wherein compression of the portal core is an essential aspect of signal transmission during packaging.
- id: PMID:30787152
  title: 'Architect of Virus Assembly: the Portal Protein Nucleates Procapsid Assembly in Bacteriophage P22.'
  findings:
  - statement: Dodecameric gp1 portal rings interact with scaffolding protein gp8 to nucleate P22 procapsid assembly and ensure
      proper capsid morphology.
    supporting_text: Here, we show that portal protein nucleates assembly of P22 procapsid-like particles (PLPs). Addition
      of portal rings to an assembly reaction increases the rate of formation and yield of particles and corrects improper
      particle morphology.
- id: PMID:37952769
  title: Molecular Architecture of Salmonella Typhimurium Virus P22 Genome Ejection Machinery.
  findings:
  - statement: The dodecameric gp1 portal complex accommodates the 12:5 symmetry mismatch with the icosahedral coat lattice
      in two equivalent conformations rotated by ~6° and anchors the tail apparatus (gp4, gp10, gp9, gp26).
    supporting_text: Here, we describe the complete architecture of the P22 tail apparatus (gp1, gp4, gp10, gp9, and gp26)
      and the potential location and organization of P22 ejection proteins (gp7, gp20, and gp16), determined using cryo-EM
      localized reconstruction, genetic knockouts, and biochemical analysis. We found that the tail apparatus exists in two
      equivalent conformations, rotated by ∼6° relative to the capsid.
