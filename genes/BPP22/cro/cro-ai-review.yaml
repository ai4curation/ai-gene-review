references:
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:3954988
  title: Bacteriophage P22 Cro protein. Sequence, purification, and properties.
  findings:
  - statement: Purified P22 Cro and demonstrated by DNase I footprinting that it binds specifically to the three operator
      sites in OR with affinity order OR3 > OR1 > OR2.
    supporting_text: Cro protein binds specifically to the three repressor binding sites in the P22 right operator; in order
      of decreasing affinity, these are OR3, OR1, and OR2.
- id: PMID:15062080
  title: Secondary structure switching in Cro protein evolution.
  findings:
  - statement: Determined the NMR solution structure of P22 Cro, showing an all-alpha-helical five-helix bundle fold that
      shares the N-terminal three-helix HTH core with lambda Cro.
    supporting_text: The folds of P22 Cro and lambda Cro share a three alpha helix fragment comprising the N-terminal half
      of the domain. However, P22 Cro's C terminus folds as two helices, while lambda Cro's folds as a beta hairpin.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Summarizes the role of Cro in repressing transcription from PRM and down-regulating PL and PR to favor lytic
      development.
    supporting_text: The early proteins are 24, a λ N homologue which functions as a transcriptional antiterminator, and Cro,
      which functions to inhibit transcription from P RM and generally down-regulate transcription from P L and P R , thereby
      favoring lytic development.
