suggested_questions:
- question: How does the weaker dimerization stability of all-helical P22 Cro compared to beta-sheet-dimerizing lambda Cro
    affect the kinetics of OR3 occupancy in vivo?
  experts:
  - Matthew H. J. Cordes
  - Anthony R. Poteete
suggested_experiments:
- description: High-resolution X-ray or cryo-EM structure determination of P22 Cro bound to the consensus OR3 operator site
    to compare DNA bending and major-groove recognition with those of the P22 C2 repressor N-terminal domain.
  hypothesis: P22 Cro and C2 recognize overlapping operator half-sites using distinct side-chain contact networks within their
    HTH recognition helices while inducing different degrees of DNA bending.
