id: P09964
gene_symbol: cro
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Transcriptional repressor (Cro) of Salmonella phage P22 that favors lytic development over lysogeny by binding
  specifically to the OL and OR operator sites (with highest affinity for OR3) via an all-alpha-helical helix-turn-helix fold,
  repressing c2 repressor transcription from PRM and down-regulating early lytic transcription from PL and PR.
