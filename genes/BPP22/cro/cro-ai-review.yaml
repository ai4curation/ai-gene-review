  - UniProtKB-KW:KW-0238
  review:
    summary: Cro binds specifically to the OR1, OR2, and OR3 operator sites and OL via its helix-turn-helix DNA-binding motif.
    action: ACCEPT
    reason: Direct sequence-specific binding of P22 Cro to the OR3, OR1, and OR2 operator sites has been demonstrated biochemically
      by DNase I footprinting (PMID:3954988) and structurally characterized by NMR (PMID:15062080).
