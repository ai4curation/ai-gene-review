- id: PMID:383902
  title: 'Salmonella phage glycanases: substrate specificity of the phage P22 endo-rhamnosidase.'
  findings:
  - statement: Phage P22 tailspike endo-rhamnosidase specifically cleaves alpha-L-rhamnosyl linkages in the O-antigen polysaccharide
      of Salmonella serogroups A, B, and D1 to produce octa-, dodeca-, and hexadecasaccharides.
    supporting_text: Interaction between phage P22 and phenol-water extracted lipopolysaccharides from sensitive Salmonella
      bacteria belonging to serogroups A, B and Di results in hydrolysis of the alpha-L-rhamnosyl linkages within the tetrasaccharide
      repeating unit of the O-antigenic polysaccharide chain.
- id: PMID:8023158
  title: 'Crystal structure of P22 tailspike protein: interdigitated subunits in a thermostable trimer.'
  findings:
  - statement: The 2.0 Å crystal structure of P22 tailspike protein (residues 109-666) reveals a homotrimer of large parallel
      beta-helices with C-terminally interdigitated polypeptide chains that confer thermostability.
    supporting_text: The x-ray structure of a shortened TSP (residues 109 to 666) was determined to a 2.0 angstrom resolution.
      Each subunit of the homotrimer contains a large parallel beta helix. The interdigitation of the polypeptide chains at
      the carboxyl termini is important to protrimer formation in the folding pathway and to thermostability of the mature
      protein.
- id: PMID:9135118
  title: 'Phage P22 tailspike protein: crystal structure of the head-binding domain at 2.3 A, fully refined structure of the
    endorhamnosidase at 1.56 A resolution, and the molecular basis of O-antigen recognition and cleavage.'
  findings:
  - statement: Six homotrimeric gp9 tailspikes attach via their N-terminal head-binding domains (residues 1-124) to the tail
      apparatus, while their 13-turn parallel beta-helix domains bind O-antigen repeats and cleave the alpha(1,3)-O-glycosidic
      bond using active-site residues Asp392, Asp395, and Glu359.
    supporting_text: Insertions into the beta-helix form the O-antigen binding groove, which also harbours the active site
      residues Asp392, Asp395 and Glu359.
- id: PMID:20817910
  title: Tailspike interactions with lipopolysaccharide effect DNA ejection from phage P22 particles in vitro.
  findings:
  - statement: Both O-antigen binding and endo-1,3-alpha-L-rhamnosidase cleavage by gp9 tailspikes are required to position
      the P22 virion on the Salmonella outer membrane, drive the gp26 needle into the membrane, and trigger complete DNA ejection.
    supporting_text: Using phage particles reconstituted with purified mutant TSP in vitro, we found that the endorhamnosidase
      activity of TSP degrading the O-antigen polysaccharide was required prior to DNA ejection in vitro and DNA replication
      in vivo.
- id: PMID:30886360
  title: Structural dynamics of bacteriophage P22 infection initiation revealed by cryo-electron tomography.
  findings:
  - statement: Cryo-electron tomography shows free P22 virions initially attaching obliquely via two of the six gp9 tailspikes
      and the gp26 needle tip before reorienting perpendicularly as O-antigen is hydrolyzed to ~5 repeat units (~8 nm) from
      the outer membrane.
    supporting_text: Our results show free phages that initially attach obliquely to the cell through interactions between
      the O antigen and two of the six tailspikes; the tail needle also abuts the cell surface. The virion then orients perpendicularly
      and the needle penetrates the outer membrane.
- id: PMID:37952769
  title: Molecular Architecture of Salmonella Typhimurium Virus P22 Genome Ejection Machinery.
  findings:
  - statement: Cryo-EM localized reconstruction resolves the six homotrimeric gp9 tailspikes anchored around the hexameric
      gp10 tail hub via their N-terminal head-binding domains and flexible hinge linkers.
    supporting_text: Here, we describe the complete architecture of the P22 tail apparatus (gp1, gp4, gp10, gp9, and gp26)
      and the potential location and organization of P22 ejection proteins (gp7, gp20, and gp16), determined using cryo-EM
      localized reconstruction, genetic knockouts, and biochemical analysis.
core_functions:
- description: Specifically binds the O-antigen polysaccharide receptor of Salmonella serogroups A, B, and D1 lipopolysaccharide
    via its parallel beta-helix groove to mediate virion attachment to the host cell and catalyzes endo-1,3-alpha-L-rhamnosidase
    cleavage of the O-antigen chain to bring the virion to the outer membrane surface and trigger genome ejection.
  molecular_function:
