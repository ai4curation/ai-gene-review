    supporting_text: Interaction between phage P22 and phenol-water extracted lipopolysaccharides from sensitive Salmonella
      bacteria belonging to serogroups A, B and Di results in hydrolysis of the alpha-L-rhamnosyl linkages within the tetrasaccharide
      repeating unit of the O-antigenic polysaccharide chain.
  - reference_id: PMID:9135118
    supporting_text: Insertions into the beta-helix form the O-antigen binding groove, which also harbours the active site
      residues Asp392, Asp395 and Glu359.
  - reference_id: PMID:20817910
    supporting_text: Using phage particles reconstituted with purified mutant TSP in vitro, we found that the endorhamnosidase
      activity of TSP degrading the O-antigen polysaccharide was required prior to DNA ejection in vitro and DNA replication
      in vivo.
suggested_questions:
- question: How does the flexible interdomain hinge (residues 108-124) between the N-terminal head-binding domain and the
    C-terminal parallel beta-helix coordinate the transition from oblique two-tailspike attachment to perpendicular six-tailspike
    engagement on the Salmonella outer membrane?
  experts:
  - Robert Seckler
  - Stefanie Barbirz
  - Ian J. Molineux
suggested_experiments:
- description: Restrict the conformational flexibility of the gp9 interdomain hinge linker (residues 108-124) via proline
    substitutions or engineered disulfide bridges and image infection intermediates on Salmonella minicells by cryo-electron
    tomography.
  hypothesis: Hinge bending is required for the virion to transition from initial oblique contact via two tailspikes to the
    perpendicular orientation that drives the gp26 needle across the outer membrane.
