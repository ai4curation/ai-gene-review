references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:3157001
  title: Conservation of genome form but not sequence in the transcription antitermination determinants of bacteriophages
    lambda, phi 21 and P22.
  findings:
  - statement: Sequenced the P22 N (gene 24) gene and nut antitermination sites and compared them with those of phages lambda
      and phi 21.
    supporting_text: Comparisons are made among DNA sequences upstream from terminators in both leftwards and rightwards early
      operons of related coliphages lambda, phi 21 and P22. These sequences include both left and right determinants of response
      to phage-coded antitermination proteins, "N", as well as the N structural genes themselves.
- id: PMID:9501914
  title: Solution structure of P22 transcriptional antitermination N peptide-boxB RNA complex.
  findings:
  - statement: Determined the NMR solution structure of the P22 N basic peptide (residues 14-32) bound to the 15-mer boxB
      RNA hairpin (PDB:1A4T).
    supporting_text: We have determined the solution structure of a 15-mer boxB RNA hairpin complexed with a 20-mer basic
      peptide of the N protein involved in bacteriophage P22 transcriptional antitermination. Complex formation involves adaptive
      binding with the N peptide adopting a bent alpha-helical conformation that packs tightly through hydrophobic and electrostatic
      interactions against the major groove face of the boxB RNA hairpin, orienting the open opposite face for potential interactions
      with host factors and/or RNA polymerase.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Identifies gp24 as the P22 homolog of lambda N that functions as the early transcriptional antiterminator.
    supporting_text: The early proteins are 24, a λ N homologue which functions as a transcriptional antiterminator, and Cro,
      which functions to inhibit transcription from P RM and generally down-regulate transcription from P L and P R , thereby
      favoring lytic development.
