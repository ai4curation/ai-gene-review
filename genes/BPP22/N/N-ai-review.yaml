- description: Nascent-RNA-binding transcriptional antitermination protein that binds the boxB RNA hairpin at viral nut sites
    via its N-terminal arginine-rich alpha-helix and modifies host RNA polymerase to read through early transcription terminators.
  molecular_function:
    id: GO:0003723
    label: RNA binding
