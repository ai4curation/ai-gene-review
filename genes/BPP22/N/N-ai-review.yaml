id: P04891
gene_symbol: N
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Transcriptional antitermination protein N (gp24) of Salmonella phage P22 that binds the nascent boxB RNA hairpin
  of viral nutL and nutR sites via an N-terminal arginine-rich alpha-helical motif and modifies host RNA polymerase into a
  termination-resistant elongation complex, enabling readthrough of early transcription terminators to express delayed-early
  genes.
existing_annotations:
- term:
    id: GO:0006353
    label: DNA-templated transcription termination
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0806
  review:
    summary: Keyword mapping from 'Transcription termination' is misleading because P22 N (gp24) is a transcriptional antiterminator
      that prevents termination to promote viral transcription.
    action: MODIFY
    reason: P22 N (gp24) acts as a transcriptional antiterminator that suppresses termination at intrinsic and Rho-dependent
      terminators in the PL and PR operons (PMID:9501914, PMID:11053393), warranting replacement with GO:0031564 (transcription
      antitermination) and GO:0050434 (positive regulation of viral transcription).
    proposed_replacement_terms:
    - id: GO:0031564
      label: transcription antitermination
    - id: GO:0050434
      label: positive regulation of viral transcription
    supported_by:
    - reference_id: PMID:9501914
      supporting_text: We have determined the solution structure of a 15-mer boxB RNA hairpin complexed with a 20-mer basic
        peptide of the N protein involved in bacteriophage P22 transcriptional antitermination.
    - reference_id: PMID:11053393
      supporting_text: The early proteins are 24, a λ N homologue which functions as a transcriptional antiterminator, and
        Cro, which functions to inhibit transcription from P RM and generally down-regulate transcription from P L and P R
        , thereby favoring lytic development.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IDA
  original_reference_id: PMID:9501914
  qualifier: enables
  review:
    summary: P22 N binds directly to the major groove face of the nascent boxB RNA hairpin via its N-terminal basic arginine-rich
      peptide.
    action: NEW
    reason: The solution NMR structure of the P22 N peptide-boxB RNA complex (PDB:1A4T, PMID:9501914) directly demonstrates
      sequence- and structure-specific RNA binding.
    supported_by:
    - reference_id: PMID:9501914
      supporting_text: We have determined the solution structure of a 15-mer boxB RNA hairpin complexed with a 20-mer basic
        peptide of the N protein involved in bacteriophage P22 transcriptional antitermination. Complex formation involves
        adaptive binding with the N peptide adopting a bent alpha-helical conformation that packs tightly through hydrophobic
        and electrostatic interactions against the major groove face of the boxB RNA hairpin, orienting the open opposite
        face for potential interactions with host factors and/or RNA polymerase.
- term:
