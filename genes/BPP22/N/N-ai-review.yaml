    label: transcription antitermination
  evidence_type: TAS
  original_reference_id: PMID:9501914
  qualifier: involved_in
  review:
    summary: P22 N (gp24) mediates transcriptional antitermination at the early PL and PR operons by binding boxB RNA and
      modifying host RNA polymerase.
    action: NEW
    reason: P22 N (gp24) is a well-characterized transcriptional antiterminator of early phage operons (PMID:3157001, PMID:9501914,
      PMID:11053393).
    supported_by:
    - reference_id: PMID:9501914
      supporting_text: We have determined the solution structure of a 15-mer boxB RNA hairpin complexed with a 20-mer basic
        peptide of the N protein involved in bacteriophage P22 transcriptional antitermination.
    - reference_id: PMID:11053393
      supporting_text: The early proteins are 24, a λ N homologue which functions as a transcriptional antiterminator, and
        Cro, which functions to inhibit transcription from P RM and generally down-regulate transcription from P L and P R
        , thereby favoring lytic development.
- term:
    id: GO:0050434
    label: positive regulation of viral transcription
  evidence_type: TAS
  original_reference_id: PMID:11053393
  qualifier: involved_in
  review:
    summary: By preventing premature termination in the PL and PR operons, P22 N promotes transcription of delayed-early viral
      genes.
    action: NEW
    reason: N-mediated antitermination is required to transcribe the delayed-early genes of the PL and PR operons during phage
      development (PMID:3157001, PMID:11053393).
    supported_by:
    - reference_id: PMID:11053393
      supporting_text: The early proteins are 24, a λ N homologue which functions as a transcriptional antiterminator, and
        Cro, which functions to inhibit transcription from P RM and generally down-regulate transcription from P L and P R
        , thereby favoring lytic development.
