suggested_questions:
- question: How does the C-terminal intrinsically disordered region of P22 N (gp24) interact with Salmonella NusA and RNA
    polymerase compared to the phage lambda N-Nus-RNAP antitermination complex?
  experts:
  - Markus C. Wahl
  - David I. Friedman
suggested_experiments:
- description: Cryo-EM structure determination of the complete P22 gp24-nut-NusA-NusB-NusE-NusG-RNAP transcription antitermination
    complex assembled on a Salmonella RNA polymerase elongation scaffold.
  hypothesis: P22 gp24 uses its N-terminal bent alpha-helix to anchor onto boxB RNA while its C-terminal region threads across
    NusA and the RNAP RNA exit channel to remodel termination hairpins.
