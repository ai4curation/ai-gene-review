id: P14108
gene_symbol: P14108
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10754
  label: Lederbergvirus P22
description: Uncharacterized 67-residue (7.8 kDa) protein (ORF67, previously misannotated as ORF87 due to an early sequencing
  error) encoded in the early left (PL) operon intergenic region between ral and gene 17 of Salmonella phage P22. It contains
  a conserved DUF551 domain (InterPro:IPR007539, Pfam:PF04448) and has no experimentally established molecular function or
  biological process.
existing_annotations: []
core_functions: []
references:
- id: PMID:2738922
  title: Genetic structure of the bacteriophage P22 PL operon.
  findings:
  - statement: Determined the nucleotide sequence of 1,416 bp of the P22 early left (PL) operon encompassing the ral to abc2
      region where ORF67 (P14108) resides.
    supporting_text: The sequence of 1416 base-pairs of the P22 PL operon was determined, linking a continuous sequence from
      PL through abc2.
- id: PMID:11053393
  title: Sequence of the genome of Salmonella bacteriophage P22.
  findings:
  - statement: Noted that ORF67 (P14108) had previously been referred to as ORF87 due to an error in the earlier DNA sequence
      and included the corrected 67-codon ORF in the complete P22 genome annotation.
    supporting_text: For example, ORF67 was previously referred to as ORF87 due to a mistake in the DNA sequence.
- id: PMID:12562822
  title: Corrected sequence of the bacteriophage p22 genome.
  findings:
  - statement: Confirmed the revised sequence and annotation of the bacteriophage P22 genome including ORF67.
    supporting_text: We report the first accurate genome sequence for bacteriophage P22, correcting a 0.14% error rate in
      previously determined sequences.
- id: file:BPP22/P14108/P14108-uniprot.txt
  title: UniProtKB record for P14108 (P14108)
  findings:
  - statement: Annotates P14108 (ORF67) as a predicted 67-residue protein containing a DUF551 domain (InterPro:IPR007539,
      Pfam:PF04448) and notes the earlier erroneous initiation in CAA33649.1.
    supporting_text: DR   InterPro; IPR007539; DUF551.
suggested_questions:
- question: What is the biochemical role of the conserved DUF551 domain in P22 ORF67 (P14108) during early left (PL) operon
    expression?
  experts:
  - Sherwood R. Casjens
  - Anthony R. Poteete
suggested_experiments:
- description: Construct a precise in-frame deletion of ORF67 (P14108) in phage P22 and assay plaque formation, lysogenization
    frequency, and anti-defense phenotypes across a panel of Salmonella enterica clinical isolates.
  hypothesis: ORF67 encodes an accessory early left operon factor that counteracts a strain-specific host restriction or defense
    mechanism.
