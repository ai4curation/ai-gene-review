- term:
    id: GO:0015628
    label: protein secretion by the type II secretion system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001639
  review:
    summary: InterPro2GO mapping from the GspC family entry IPR001639 to type II secretion.
    action: ACCEPT
    reason: >-
      Correct and experimentally established for PulC: the first two genes of the pulC operon encode
      PulC and PulD, both of which are required for pullulanase secretion (PMID:2677007), and the
      structural work shows how PulC performs its step, bridging the assembly platform to the
      secretin base (PMID:31780649). PulC does some of the work of the process rather than merely
      being needed for it, so involved_in is the right qualifier.
    supported_by:
    - reference_id: PMID:2677007
      supporting_text: these two proteins are required for pullulanase secretion
    - reference_id: PMID:31780649
      supporting_text: Symmetry mismatch between the outer membrane complex and assembly platform
        is overcome by PulC linkers spanning the periplasm, with PulC HR domains binding
        independently at the secretin base
