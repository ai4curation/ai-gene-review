suggested_questions:
- question: The three GOA rows for PulC are all electronic, although primary interaction,
    fractionation and cryo-EM data exist (PMID:2677007, PMID:10383968, PMID:10735856,
    PMID:31780649). Should experimental annotations be made for this entry?
- question: The pul genes of this entry come from the strain now classified as Klebsiella oxytoca,
    while the UniProt organism is Klebsiella pneumoniae. Should the entry's taxonomy be revisited
    with UniProt?
