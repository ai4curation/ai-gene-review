id: P15643
gene_symbol: pulC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:573
  label: Klebsiella pneumoniae
description: PulC is the GspC-family envelope connector of the Pul type II secretion system, the
  machine that exports the starch-debranching enzyme pullulanase from the periplasm to the cell
  surface. It is a bitopic protein anchored in the inner membrane by a signal-anchor segment near
  its N terminus, with a periplasmic region containing a homology (HR) domain and a PDZ-like
  domain. PulC joins the inner-membrane assembly platform through PulL and PulM and reaches across
  the periplasm so that its HR domain docks on the N0 ring at the base of the PulD secretin,
  coupling the two halves of the machine; in the assembled complex it is present at twice the
  stoichiometry of the other platform subunits and its flexible linkers absorb the symmetry
  mismatch between platform and secretin. It is required for pullulanase secretion.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0037
  review:
    summary: UniProt subcellular-location mapping (cell inner membrane, single-pass) to plasma
      membrane.
    action: ACCEPT
    reason: >-
      Supported experimentally for PulC itself. A PulC-PhoA hybrid fractionates with the inner
      membrane (PMID:2677007), and inner-membrane association is mediated by the signal-anchor
      sequence near the N terminus (PMID:10383968). The same fractionation study also finds PulC with
      the outer membrane, which the authors interpret as a periplasm-spanning bridge broken on cell
      lysis rather than as outer-membrane residence; the cryo-EM structure confirms a platform
      subunit whose HR domain only reaches the secretin base (PMID:31780649), so the inner-membrane
      assignment is the correct single location.
    supported_by:
    - reference_id: PMID:2677007
      supporting_text: A representative PulC-PhoA hybrid protein fractionated mainly with the inner
        membrane upon isopycnic sucrose gradient centrifugation of membrane vesicles
    - reference_id: PMID:10383968
      supporting_text: The association of PulC with the inner membrane is mediated by the signal
        anchor sequence located close to its N terminus
