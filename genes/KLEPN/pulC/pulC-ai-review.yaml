core_functions:
- description: GspC-family connector of the Pul type II secretion system; anchored in the inner
    membrane and bound to the PulL/PulM platform, it spans the periplasm and docks its HR domain on
    the base of the PulD secretin, coupling the assembly platform to the outer-membrane channel so
    that pullulanase can be secreted.
  supported_by:
  - reference_id: PMID:31780649
    supporting_text: Symmetry mismatch between the outer membrane complex and assembly platform is
      overcome by PulC linkers spanning the periplasm, with PulC HR domains binding independently at
      the secretin base
