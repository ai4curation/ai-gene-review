id: P03763
gene_symbol: B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: ATP-dependent target DNA activator B (MuB) is a 312-amino-acid AAA+ ATPase of Escherichia phage Mu that governs target site selection, transposase activation, and cis target immunity during viral DNA transposition and genome replication. In the host cell cytoplasm, ATP-bound MuB polymerizes into helical filaments around non-specific double-stranded target DNA, where its N-terminal four-helix bundle binds the C-terminal tail of the MuA transposase to deliver target DNA and allosterically stimulate donor cleavage and strand transfer; conversely, MuA bound to viral att ends stimulates MuB ATP hydrolysis to dissociate MuB filaments from the phage genome, preventing self-integration.
