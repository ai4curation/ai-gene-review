suggested_questions:
- question: How does the helical pitch of ATP-bound MuB filaments deform the underlying target DNA duplex to lower the activation barrier for MuA-catalyzed strand transfer?
  experts:
  - Kiyoshi Mizuuchi
  - Phoebe A. Rice
  - Tania A. Baker
suggested_experiments:
- description: Determine the high-resolution cryo-EM structure of the MuA strand-transfer transpososome engaged with a helical MuB-ATP-target DNA filament.
  hypothesis: Engagement of multiple MuA domain IIIbeta tails by adjacent MuB N-terminal bundles along the filament induces a localized bend in target DNA that positions the scissile phosphates into the MuA DDE active sites.
