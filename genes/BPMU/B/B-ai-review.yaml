  title: The solution structure of the C-terminal domain of the Mu B transposition protein.
  findings:
  - statement: MuB is one of four proteins required for the strand transfer step of bacteriophage Mu DNA transposition and its C-terminal domain forms a four-helix bundle resembling the N-terminal region of DnaB.
    supporting_text: Mu B is one of four proteins required for the strand transfer step of bacteriophage Mu DNA transposition and the only one where no high resolution structural data is available.
- id: PMID:12049743
  title: 'Direct observation of single MuB polymers: evidence for a DNA-dependent conformational change for generating an active target complex.'
  findings:
  - statement: MuB is an ATP-dependent DNA-binding protein critical for target site selection on the host chromosome and is dissociated from DNA near existing Mu ends by MuA to establish target immunity.
    supporting_text: MuB, an ATP-dependent DNA binding protein, is critical for selection of target sites on the host chromosome during Mu transposition.
- id: PMID:23776210
  title: MuB is an AAA+ ATPase that forms helical filaments to control target selection
    for DNA transposition.
  findings:
  - statement: MuB is a two-domain AAA+ ATPase that forms ATP-dependent helical filaments on DNA and uses conserved active-site, DNA-binding, and N-terminal residues to couple ATP hydrolysis with target DNA selection and MuA activation.
    supporting_text: We demonstrate that MuB is an ATPase associated with diverse cellular activities (AAA+ ATPase) and forms ATP-dependent filaments with or without DNA. We also identify critical residues for MuB's ATPase, DNA binding, protein polymerization, and MuA interaction activities.
- id: PMID:24478936
  title: MuB gives a new twist to target DNA selection.
  findings:
  - statement: MuB is an AAA+ ATPase that upon ATP binding assembles into helical filaments that coat target DNA, regulating MuA transposase activity and mediating target immunity.
    supporting_text: MuB is an ATP-dependent non-specific DNA binding protein that regulates the activity of the MuA transposase and captures target DNA for transposition.
- id: file:BPMU/B/B-uniprot.txt
  title: UniProtKB record for P03763 (MUB_BPMU)
  findings:
  - statement: MuB selects target DNA sites, polymerizes as helical filaments around DNA, recruits and activates MuA, and prevents self-integration into the viral genome.
    supporting_text: Selects the target DNA sites for transposition. Recruits DDE-recombinase A to the target sites and catalytically activates it. Displays non-specific DNA-binding properties. Polymerizes as helical filaments around the DNA. Coating of the DNA by the target DNA activator B might play a role in favoring target-primed replication over integration. Prevents self-integration into an integrated copy of the viral genome.
  - statement: MuB catalyzes ATP hydrolysis using Mg2+ as a cofactor in the host cytoplasm.
    supporting_text: Reaction=ATP + H2O = ADP + phosphate + H(+);
