suggested_questions:
- question: >-
    Does the four-transmembrane protein gp19 (Mup19) form a complex in the host
    Escherichia coli inner membrane with the immediately downstream single-pass
    membrane peptide gp20 (Mup20), and does it function in superinfection exclusion
    or envelope remodeling?
suggested_experiments:
- description: >-
    Perform subcellular membrane fractionation (inner vs. outer membrane sucrose
    gradient separation) and PhoA/GFP topology mapping of Mup19 in Escherichia coli,
    and test whether co-expression of Mup19 and Mup20 alters host membrane
    permeability or phage superinfection resistance.
