id: Q38492
gene_symbol: Mup14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 100-amino-acid early protein gp14 (Mup14, also designated E15;
  11.7 kDa) of Escherichia phage Mu, encoded in the semi-essential (SE) region of
  the early Pe operon between Mup13 and Mup15. Belongs to the conserved mulikevirus
  gp14 protein family and lacks predicted signal peptides or transmembrane helices.
  Expressed in the host bacterial cytoplasm during the early phase of the viral
  replicative cycle under the transcriptional control of Repc and Ner; its specific
  biochemical function in phage Mu infection remains unknown.
