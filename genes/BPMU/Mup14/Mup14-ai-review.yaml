suggested_questions:
- question: >-
    Why is gp14 conserved across Mu-like transposable phages (mulikevirus gp14
    family), and what host or viral factor does it target during early infection?
suggested_experiments:
- description: >-
    Perform comparative synteny and structural modeling of mulikevirus gp14
    homologs coupled with affinity-tag co-immunoprecipitation in phage Mu-infected
    Escherichia coli to identify interacting proteins.
