id: Q38494
gene_symbol: gemA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: GemA protein is a 144-amino-acid homodimeric semi-early regulatory protein of Escherichia phage Mu that localizes to the host cell cytoplasm. GemA decreases host DNA gyrase activity and promotes relaxation of the bacterial chromosome, thereby reprogramming the expression of supercoiling-sensitive Escherichia coli genes—including DNA replication and cell division determinants—to perturb host cell cycle progression.
