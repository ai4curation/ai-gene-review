suggested_questions:
- question: Does the GemA homodimer inhibit Escherichia coli DNA gyrase by directly binding the GyrA or GyrB subunits, or by repressing gyrA/gyrB transcription?
  experts:
  - Luciano Paolozzi
  - Patrizia Ghelardini
suggested_experiments:
- description: Test purified recombinant GemA homodimers in in vitro E. coli DNA gyrase supercoiling assays and perform pull-down assays with GyrA and GyrB.
  hypothesis: GemA directly binds a subunit of host DNA gyrase (or stabilizes a relaxed topoisomer complex) to reduce negative supercoiling activity in vivo.
