id: P06022
gene_symbol: C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Late transcription activator C is a 140-amino-acid homodimeric winged helix-turn-helix DNA-binding transcription activator of Escherichia phage Mu that mediates the transition from middle to late viral gene expression in the host cell cytoplasm. Activated by Mg2+ binding, protein C binds and activates the four late promoters (Plys, PI, PP, and Pmom)—unwinding promoter DNA to realign core elements and recruiting host RNA polymerase—to drive transcription of the viral lysis, head/tail morphogenesis, and mom DNA modification genes.
