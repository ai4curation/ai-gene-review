suggested_questions:
  - question: Which specific amino acid side chains coordinate Mg2+ in the C homodimer, and how does Mg2+ binding alter the relative orientation of the C-terminal HTH domains compared to the homologous Mor dimer?
    experts:
      - Valakunja Nagaraja
      - Martha M. Howe
suggested_experiments:
  - description: Solve the high-resolution crystal or cryo-EM structure of the Mg2+-bound C homodimer in complex with the Pmom promoter DNA and E. coli RNAP.
    hypothesis: Mg2+ coordination at the inter-domain hinge stabilizes an extended HTH spacing that untwists the suboptimal 6-bp spacer of Pmom to align the -10 and -35 elements for RNAP sigma70 recognition.
