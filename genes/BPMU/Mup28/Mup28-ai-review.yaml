    title: Characterization of Plys-proximal morphogenetic genes of transposable bacteriophage Mu.
    findings:
      - statement: Mapping of amber mutations in gene E (Mup28), sequence homology to phage large terminase subunits, and pac-recognition assays established gp28 as the large subunit of the phage Mu DNA maturation/packaging enzyme.
        supporting_text: In addition, the E protein was found to share homology with the large subunit of many phage DNA maturation enzymes. These results support the hypothesis that D and E encode subunits of the Mu DNA maturation enzyme.
