    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    qualifier: involved_in
    supporting_entities:
      - UniProtKB-KW:KW-1250
    review:
      summary: Spurious keyword mapping from KW-1250 (Viral genome excision); phage Mu does not excise its prophage, and gp28 cleaves integrated viral-host DNA junctions solely for headful virion packaging.
      action: REMOVE
      reason: GO:0032359 (provirus excision) is an artifact of automated keyword mapping from KW-1250 (Viral genome excision). Phage Mu replicates by replicative transposition without prophage excision; gp28 cuts host DNA flanking integrated Mu genomes to package them into procapsids by a headful mechanism (GO:0098006), not to excise a provirus.
