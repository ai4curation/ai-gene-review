    title: UniProtKB record for Q9T1W6 (TERL_BPMU / Mup28)
    findings:
      - statement: UniProtKB annotates gp28 (gpE) as the large terminase subunit possessing ATP-driven DNA translocase and Mg2+-dependent endonuclease activities required for headful DNA packaging.
        supporting_text: The terminase large subunit acts as an ATP driven molecular motor necessary for viral DNA translocation into empty capsids and as an endonuclease that cuts the viral genome to initiate and to end a packaging reaction.
suggested_questions:
  - question: How does the portal protein H (gp29) signal headful capsid filling to the C-terminal endonuclease domain of gp28 to trigger the termination cut within flanking host DNA at the right (S) end of the phage Mu genome?
suggested_experiments:
  - description: Reconstitute in vitro DNA packaging using purified phage Mu procapsids, gp27, and wild-type or Walker-B/nuclease-site mutant gp28 to measure ATPase coupling and headful cleavage specificity.
