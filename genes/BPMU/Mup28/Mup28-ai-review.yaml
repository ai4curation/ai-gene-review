taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Terminase large subunit gp28 (also known as gpE, pacase large subunit, or Mup28; 551 aa, 62.6 kDa) of Escherichia phage Mu. Combines an N-terminal P-loop NTPase (ATPase) motor domain that translocates viral and flanking host dsDNA into the empty procapsid with a Mg2+-dependent C-terminal endonuclease domain that cleaves host DNA outside the Mu left end to initiate packaging and executes the headful termination cut once the capsid is full. Heterooligomerizes with the pac-binding terminase small subunit gp27 (gpD / Mup27) and docks at the dodecameric portal vertex (gp29 / H) of the procapsid.
