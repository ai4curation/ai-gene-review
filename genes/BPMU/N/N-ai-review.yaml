      label: DNA binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: Protein N binds directly to both ends of the linear double-stranded phage Mu genome following injection into the host cell, forming a non-covalent circularized protein-DNA complex.
      action: ACCEPT
      reason: Direct DNA end-binding activity is the molecular mechanism by which protein N circularizes the ejected viral genome and shields its termini from host exonucleases.
      supported_by:
        - reference_id: file:BPMU/N/N-uniprot.txt
          supporting_text: '-!- FUNCTION: Required for tail assembly of phage Mu and responsible for circularizing the viral DNA after it has been ejected into the host cell. Following infection, the circularized DNA can be isolated as a supercoiled, non-covalent protein-DNA complex, in which the protein N is bound to the ends of the DNA. Protects linear double-stranded DNA of viral genome from host exonuclease degradation.'
