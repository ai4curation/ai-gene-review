id: P08557
gene_symbol: N
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Bifunctional baseplate hub subunit and DNA pilot protein of bacteriophage Mu (gp43/Mup43, also designated BH1). Within the virion, three copies of N assemble with three copies of baseplate hub protein P (gp44/Mup44) to form the central baseplate hub that recruits three dimeric Mup46-Mup47-Mup48 wedges during contractile tail morphogenesis. Upon infection, N is co-ejected with the linear double-stranded phage genome into the Escherichia coli cytoplasm, where it binds to both ends of the viral DNA to form a non-covalently closed, supercoiled circular nucleoprotein complex and protects the genomic termini from degradation by host exonucleases.
