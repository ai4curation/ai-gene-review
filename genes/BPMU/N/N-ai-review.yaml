suggested_questions:
  - question: How is protein N released from the central baseplate hub during tail contraction so that it can be co-ejected through the tail tube conduit with the leading and trailing ends of the phage Mu genome?
suggested_experiments:
  - description: Perform cryo-EM reconstruction of the phage Mu baseplate before and after tail contraction to resolve the exact disposition of the Mup43 (N) trimer relative to the Mup44 (P) hub ring and the tail tube lumen.
    hypothesis: Mup43 resides at the proximal/inner aspect of the Mup44 hub channel where tail contraction dislodges it into the DNA translocation conduit for co-injection with the viral genome.
