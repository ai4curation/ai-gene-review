  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0688
  review:
    summary: >-
      Artifact of UniProt keyword KW-0688 (Ribosomal frameshifting) mapping; the
      Mup41 mRNA undergoes a programmed -2 frameshift to produce FS-gp41, but the
      gp41 protein itself does not perform or regulate translational frameshifting.
    action: REMOVE
    reason: >-
      A gene product is involved_in a biological process only if the protein itself
      performs or regulates part of that process. Here, a cis-acting slippery
      sequence in the Mup41 mRNA directs host ribosomes to undergo a -2 frameshift to
      generate the extended isoform FS-gp41, while gp41 itself is the conventional
      translation product and functions solely as a tail assembly chaperone.
    supported_by:
    - reference_id: PMID:15469818
      supporting_text: A programmed translational frameshift similar to frameshifts in retroviral gag-pol genes and bacterial insertion elements was found to be strongly conserved in tail assembly genes of dsDNA phages and to be independent of sequence similarities. ... Clear evidence was also found for an unusual but analogous -2 frameshift in phage Mu.
    - reference_id: file:BPMU/Mup41/Mup41-uniprot.txt
      supporting_text: 'MISCELLANEOUS: [Isoform Tail assembly chaperone gp41]: Produced by conventional translation.'
