id: P79680
gene_symbol: Mup41
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Tail assembly chaperone (gp41) of bacteriophage Mu produced by conventional
  translation of the Mup41 open reading frame, whereas a programmed -2 ribosomal
  frameshift within the same transcript produces the extended isoform FS-gp41.
  Together with FS-gp41 (analogous to the bacteriophage lambda gpG/gpGT chaperone
  pair), gp41 acts in the host cell cytoplasm to mediate the interaction between the
  tape measure protein (gp42) and the tail tube protein (gpM / gp40), directing tail
  tube polymerization to form a tail shaft of the proper length.
