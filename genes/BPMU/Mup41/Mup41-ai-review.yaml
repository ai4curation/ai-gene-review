suggested_questions:
- question: >-
    What is the stoichiometric ratio of gp41 to FS-gp41 produced by the -2 ribosomal
    frameshift in phage Mu, and which domain of gp41 binds the tape measure protein
    gp42?
suggested_experiments:
- description: >-
    Introduce synonymous point mutations that disrupt the -2 frameshift slippery
    site in Mup41 while preserving the gp41 amino acid sequence, and test complementation
    in trans with separately expressed gp41 and FS-gp41.
  hypothesis: >-
    Both gp41 and FS-gp41 are required in a defined ratio to chaperone gp42 and
    nucleate tail tube protein M polymerization.
