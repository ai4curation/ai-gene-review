core_functions:
- description: >-
    Cytosolic tail assembly chaperone that works together with the frameshifted
    isoform FS-gp41 to coat the tape measure protein (gp42) and direct polymerization
    of the tail tube protein (gpM) into a tail shaft of the proper length.
