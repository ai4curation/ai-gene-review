taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Head-to-tail joining (neck adaptor) protein (gpJ / Mup36) of bacteriophage Mu.
  Expressed during the late phase of the viral lytic cycle under activation by viral
  protein C, gpJ assembles as a dodecameric ring in the virion neck complex and is
  essential for joining DNA-filled heads to assembled tails during virion
  morphogenesis; loss of J results in the accumulation of unattached tails and full
  heads.
