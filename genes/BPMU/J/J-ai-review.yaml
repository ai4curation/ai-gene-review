suggested_questions:
- question: >-
    How does binding of dodecameric gpJ to the portal vertex trigger gatekeeper plug
    formation and prepare the neck for docking onto the hexameric tail terminator
    gp37?
suggested_experiments:
- description: >-
    Perform in vitro reconstitution of purified full heads, dodecameric gpJ, and
    gp37-capped tails coupled with hydrogen-deuterium exchange mass spectrometry.
  hypothesis: >-
    The C-terminal tail of gpJ (residues 110-141, disordered in the isolated crystal
    structure 5YDN but ordered in cryo-EM structures 9KHX/9KNU) undergoes a
    disorder-to-order transition upon engaging the head-tail interface.
