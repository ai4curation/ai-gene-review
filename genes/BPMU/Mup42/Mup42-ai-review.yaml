id: Q9T1V6
gene_symbol: Mup42
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Tail tape measure protein (gp42 / gpY) of bacteriophage Mu. Assembled onto the
  baseplate prior to tail tube polymerization, gp42 forms a central trimeric
  filament inside the lumen of the growing tail tube and acts as the physical
  template that determines the exact length of the contractile tail; disruption of
  Mup42 completely abolishes tail synthesis. During infection, gp42 is thought to be
  ejected from the tail lumen ahead of the viral genome.
