suggested_questions:
- question: >-
    Does tape measure protein gp42 form a transmembrane channel across the host inner
    membrane after tail sheath contraction and ejection from the tail tube lumen?
suggested_experiments:
- description: >-
    Generate internal deletions and duplications within the central coiled-coil
    region of Mup42 and measure resulting phage Mu tail lengths by cryo-EM.
  hypothesis: >-
    Tail length in bacteriophage Mu scales linearly with the amino acid length of
    gp42 at approximately 0.15 nm per residue, consistent with an extended alpha-helical
    coiled-coil ruler.
