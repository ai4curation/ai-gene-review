suggested_questions:
- question: Does Escherichia phage Mu Kil bind directly to MreB, RodZ, or PBP2 of the bacterial elongasome complex, or does it inhibit cell-wall elongation indirectly?
  experts:
  - Ariane Toussaint
  - William Margolin
suggested_experiments:
- description: Perform affinity purification coupled to mass spectrometry (AP-MS) and bacterial two-hybrid assays testing direct interaction of phage Mu Kil with E. coli elongasome components (MreB, MreC, MreD, RodZ, PBP2, RodA).
  hypothesis: Mu Kil directly binds a core elongasome component such as MreB or RodZ to disrupt lateral peptidoglycan synthesis, causing the characteristic rod-to-sphere transition.
