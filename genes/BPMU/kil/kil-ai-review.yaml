id: P03046
gene_symbol: kil
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Protein kil is a 74-amino-acid early accessory protein of Escherichia phage Mu that localizes to the host cell cytoplasm. Its expression induces pronounced morphological changes in the Escherichia coli host cell, causing the bacteria to become enlarged and spherical and ultimately leading to cell death, potentially through a direct or indirect perturbation of the host actin-like cytoskeletal protein MreB.
