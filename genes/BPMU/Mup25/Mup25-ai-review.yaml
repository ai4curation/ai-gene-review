      UniProtKB annotates gp25 as the phage Mu releasin protein anchored in the
      host cell inner membrane that facilitates release of the SAR-endolysin.
    supporting_text: >-
      FUNCTION: Facilitates the release of the SAR-endolysin. {ECO:0000269|PubMed:35471081}.
suggested_questions:
- question: >-
    Does gp25 promote SAR-endolysin extraction by forming transient ion-conducting
    pores that locally collapse the proton motive force, or by directly shielding
    the positively charged Lys6/Lys7 residues of gp22 during membrane exit?
suggested_experiments:
- description: >-
    Measure membrane potential (using DiBAC4(3) or potassium-release assays) and
    perform co-immunoprecipitation of gp25 with wild-type and K6A/K7A gp22 variants
    to distinguish between localized proton-motive-force dissipation and direct
    chaperone-like extraction of the SAR transmembrane domain.
