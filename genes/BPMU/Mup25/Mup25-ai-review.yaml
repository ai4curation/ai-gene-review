- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IDA
  original_reference_id: PMID:35471081
  qualifier: involved_in
  review:
    summary: >-
      gp25 is the phage Mu releasin required for timely extraction of SAR-endolysin
      gp22 from the inner membrane and consequent host cell cytolysis.
    action: ACCEPT
    reason: >-
      Chamblee et al. (2022) demonstrated that deletion or nonsense mutation of
      Mup25 severely delays or abolishes phage Mu host cell lysis, and coexpression
      of gp25 with gp22 and gp23/gp23.1 reconstitutes complete cytolytic release
      (PMID:35471081).
    supported_by:
    - reference_id: PMID:35471081
      supporting_text: >-
        Here, we demonstrate that gp22 is a signal-anchor-release (SAR) endolysin and identify gp23 and gp23.1 as two-component spanin subunits. However, we find that Mu lacks a holin and instead encodes a membrane-tethered cytoplasmic protein, gp25, which is required for the release of the SAR endolysin.
- term:
    id: GO:0140913
    label: viral release via disruption of host peptidoglycan cell wall
  evidence_type: IDA
  original_reference_id: PMID:35471081
  qualifier: acts_upstream_of_positive_effect
  review:
    summary: >-
      gp25 acts upstream of peptidoglycan breakdown by facilitating the release of
       the muralytic SAR-endolysin gp22 from the inner membrane into the periplasm.
    action: ACCEPT
    reason: >-
      Because gp25 does not itself hydrolyze peptidoglycan but enables the
      SAR-endolysin gp22 to escape the inner membrane and activate in the periplasm,
      the annotation GO:0140913 with qualifier acts_upstream_of_positive_effect
      accurately captures its regulatory role in cell wall disruption (PMID:35471081).
    supported_by:
    - reference_id: PMID:35471081
      supporting_text: >-
        Since gp25 is not required for gp22 maturation or activity, these results indicate that gp25 provides an ancillary function in SAR endolysin release which is not not currently provided by another known lysis protein, enabling the SAR endolysin gp22 to escape the IM. In view of this novel function, we designated gp25 as the Mu “releasin.”
