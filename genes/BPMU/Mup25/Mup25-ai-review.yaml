- id: PMID:35471081
  title: Endolysin Regulation in Phage Mu Lysis.
  findings:
  - statement: >-
      Phage Mu lacks a canonical holin and instead uses the inner-membrane-tethered
      cytoplasmic protein gp25 (designated "releasin") to trigger release of the
      SAR-endolysin gp22 from the inner membrane by overcoming the retention barrier
      conferred by Lys6 and Lys7 of gp22.
    supporting_text: >-
      Mutational analysis showed that this dependence on gp25 is conferred by lysine residues at positions 6 and 7 of the short cytoplasmic domain of gp22. gp25, which we designate as a releasin, also facilitates the release of SAR endolysins from other phages.
