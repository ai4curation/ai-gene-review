taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Releasin protein gp25 (Mup25) of Escherichia phage Mu, a 99-amino-acid
  inner-membrane-tethered late lysis protein (InterPro IPR020269 / Pfam PF10805,
  TCDB 1.E.66.1.1) that triggers release of the signal-anchor-release (SAR)
  endolysin gp22 (lys) from the host inner membrane into the periplasm. Unlike
  canonical phages that use a holin or pinholin to depolarize the host inner
  membrane, phage Mu lacks a holin and instead relies on gp25—anchored by an
  N-terminal transmembrane helix (residues 3-23) with a cytoplasmic C-terminal
  alpha-helical bundle domain—to overcome the electrostatic retention barrier
  imposed by basic residues Lys6 and Lys7 in the cytoplasmic tail of gp22, thereby
  promoting peptidoglycan cell wall degradation and cytolytic virion egress.
