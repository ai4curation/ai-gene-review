suggested_questions:
- question: >-
    Is Mup18 co-transcribed from the middle promoter Pm activated by Mor (Mup17) or
    from a constitutive/early readthrough transcript, and what role does gp18 play
    during the transition from replicative transposition to late gene expression?
suggested_experiments:
- description: >-
    Map the 5' transcriptional start site and Mor dependence of Mup18 expression by
    primer extension or RNA-seq, and assay the effect of an in-frame Mup18 deletion
    on late C gene expression and phage burst size.
