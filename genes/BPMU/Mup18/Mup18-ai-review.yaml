id: Q38625
gene_symbol: Mup18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 72-amino-acid intermediate-phase protein gp18 (Mup18, also
  designated E18; 8.4 kDa) of Escherichia phage Mu, encoded in the middle region
  between mor (Mup17) and Mup19. Belongs to the conserved Phage_Mu_gp18 domain
  family (Pfam PF26867 / InterPro IPR059647) and lacks predicted signal peptides or
  transmembrane helices. Expressed in the host bacterial cytoplasm during the
  intermediate phase of the viral replicative cycle; its specific molecular
  function in phage Mu development remains unknown.
