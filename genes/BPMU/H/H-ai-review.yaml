    findings:
      - statement: Portal protein H (gp29) assembles into a homododecamer at a unique 5-fold capsid vertex, requires host GroEL/GroES for assembly, is cleaved C-terminally by viral protease I to become competent for DNA packaging, and mediates head assembly, genome packaging, neck/tail attachment, and genome ejection.
        supporting_text: Forms the portal vertex of the capsid. This portal plays critical roles in head assembly, genome packaging, neck/tail attachment, and genome ejection. The portal protein multimerizes as a single ring-shaped homododecamer arranged around a central channel.
