suggested_questions:
  - question: Which exact peptide bond near the C-terminus of portal protein H (gp29) is cleaved by viral protease I (gp32), and how does removal of this C-terminal peptide remodel the portal channel or expose the terminase-binding interface?
suggested_experiments:
  - description: Perform top-down mass spectrometry of immature versus mature phage Mu proheads and compare cryo-EM reconstructions of uncleaved and protease-I-cleaved gp29 dodecamers to define the exact cleavage site and conformational switch.
