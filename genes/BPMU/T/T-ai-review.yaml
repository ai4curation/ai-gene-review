  label: Escherichia phage Mu
description: >-
  Major capsid protein (gpT / Mup34) of bacteriophage Mu that self-assembles to form an
  icosahedral capsid approximately 54 nm in diameter. During head morphogenesis in the
  host cell cytoplasm, gpT is recruited with the scaffolding protein Z onto an early
  25S initiator complex composed of the portal protein and viral protease I to form the
  immature prohead in a process requiring the host GroEL/GroES chaperonin system.
