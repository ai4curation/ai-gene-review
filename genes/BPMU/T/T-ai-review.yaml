suggested_questions:
- question: >-
    Does the N-terminal region of major capsid protein T undergo proteolytic
    maturation by the phage Mu prohead protease I (Mup32) during procapsid expansion,
    or does gpT mature strictly through conformational rearrangement without cleavage?
suggested_experiments:
- description: >-
    Compare N-terminal mass spectrometry and cryo-EM density of gpT in unexpanded
    procapsids versus mature virions to determine how contacts with scaffolding
    protein Z and protease I remodel during DNA packaging and head expansion.
  hypothesis: >-
    Conformational switching of the HK97-like N-arm and E-loop domains of gpT
    stabilizes the mature T=7 icosahedral shell without requiring covalent
    isopeptide crosslinking.
