  - id: PMID:19426744
    title: The X-ray crystal structure of the phage lambda tail terminator protein reveals the biologically relevant hexameric ring structure and demonstrates a conserved mechanism of tail termination among diverse long-tailed phages.
    full_text_unavailable: true
    findings:
      - statement: Tail terminator proteins of long-tailed phages, including contractile-tailed phages such as P2 and Mu, form hexameric rings that cap the polymerizing tail at its proper length and serve as the head interaction surface.
        supporting_text: The tail terminator protein (TrP) plays an essential role in phage tail assembly by capping the rapidly polymerizing tail once it has reached its requisite length and serving as the interaction surface for phage heads. ... This finding coupled with further bioinformatic investigations has led us to conclude that the TrPs of non-contractile-tailed phages, such as lambda, are evolutionarily related to those of contractile-tailed phages, such as P2 and Mu, and that all long-tailed phages may utilize a conserved mechanism for tail termination.
        full_text_unavailable: true
        reference_section_type: ABSTRACT
