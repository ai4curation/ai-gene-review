suggested_questions:
  - question: How does the C-terminal extremity of the tape measure protein (Mup42) signal the hexameric recruitment of gp37 (Mup37) and coordinate with the putative sheath terminator gp38 (Mup38)?
suggested_experiments:
  - description: Co-express tail tube protein M, tape measure protein gp42, and tail terminator gp37 with or without putative sheath terminator gp38 and analyze the capped tube complexes by cryo-EM and native mass spectrometry.
    hypothesis: Hexameric gp37 directly recognizes the C-terminal domain of gp42 and the topmost ring of tail tube protein M, exposing a binding surface for sheath terminator gp38 and neck protein J.
