  label: Escherichia phage Mu
description: Tail terminator protein (gp37 / gpK) of bacteriophage Mu that forms a hexameric ring at the head-proximal end of the tail tube. Once the polymerizing tail tube reaches the length determined by the tape measure protein, gp37 caps the tube to arrest further polymerization, prevent depolymerization, and create the docking interface for head attachment; loss of gp37 causes accumulation of free heads and abnormally long, variable-length tails.
