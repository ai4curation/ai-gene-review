    review:
      summary: Valid subcellular context where tail assembly and termination occur inside the infected bacterium, though non-core relative to the mature virus tail.
      action: KEEP_AS_NON_CORE
      reason: Protein gp37 is synthesized and caps the growing tail tube in the host cell cytoplasm during late lytic morphogenesis, whereas its core structural localization is in the virus tail.
