  review:
    summary: >-
      Supported subcellular localization for a late-expressed bacteriophage Mu
      protein synthesized in the bacterial host cytoplasm.
    action: ACCEPT
    reason: >-
      Mup35 (gp35) is expressed during the late phase of the viral replicative cycle
      in the bacterial host cell and lacks transmembrane segments or signal peptides,
      consistent with localization in the host cell cytoplasm. No more specific
      molecular function or virion sub-localization has yet been experimentally
      determined.
