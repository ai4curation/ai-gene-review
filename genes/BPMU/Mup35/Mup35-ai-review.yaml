suggested_questions:
- question: >-
    Does gp35 (Mup35) act as a transient head-completion or neck-assembly chaperone,
    or is it incorporated in low copy number into the phage Mu head or neck complex?
suggested_experiments:
- description: >-
    Generate an in-frame deletion of Mup35 in a phage Mu lysogen and examine induced
    progeny particles by transmission electron microscopy and plaque-forming assays.
  hypothesis: >-
    Given its genomic position immediately between the major capsid gene T (Mup34)
    and the head-tail joining gene J (Mup36), loss of gp35 will impair head
    completion or neck assembly efficiency.
