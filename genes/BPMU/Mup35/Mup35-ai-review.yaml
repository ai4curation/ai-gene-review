id: Q9T1W0
gene_symbol: Mup35
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 136-amino-acid protein (gp35) of bacteriophage Mu encoded in the
  late head-tail morphogenetic gene cluster between the major capsid gene T (Mup34)
  and the neck gene J (Mup36). Expressed during the late phase of the viral lytic
  cycle under activation by the viral late transcription activator C, gp35 contains
  a conserved N-terminal FluMu_N domain (IPR041227 / PF17891) shared with Mu-like
  prophages and localizes to the host cell cytoplasm.
