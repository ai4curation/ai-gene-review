suggested_questions:
- question: How is the Mu Gam homodimer displaced from linear or newly replicated phage Mu DNA ends to allow packaging or transpososome access?
  experts:
  - Stephen P. Jackson
  - Aidan J. Doherty
  - Rasika M. Harshey
suggested_experiments:
- description: Perform single-molecule optical tweezers/TIRF imaging of fluorescently labeled Mu Gam bound to linear Mu DNA ends upon addition of the MuA transpososome and ClpX.
  hypothesis: Assembly of the MuA tetramer on the adjacent attL/attR sites or ClpX remodeling displaces terminal Mu Gam dimers to permit strand transfer or packaging.
