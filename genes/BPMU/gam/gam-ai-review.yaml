  label: Escherichia phage Mu
description: Putative DNA ends protecting protein gam (Mu Gam) is a 174-amino-acid homodimeric double-stranded DNA-binding protein of Escherichia phage Mu that functions in the host cell cytoplasm. Structurally related to prokaryotic and eukaryotic Ku proteins, Mu Gam binds directly to linear double-stranded DNA ends irrespective of terminal overhang geometry (without binding single-stranded DNA or RNA) to shield viral DNA termini from degradation by host exonucleases.
