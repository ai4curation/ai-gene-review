suggested_questions:
- question: >-
    Does the 39-amino-acid single-pass membrane peptide gp20 (Mup20) associate with
    the adjacent four-pass membrane protein gp19 (Mup19) or modulate a host inner
    membrane sensor/transporter during the middle phase of phage Mu infection?
suggested_experiments:
- description: >-
    Determine the membrane localization and orientation of epitope-tagged Mup20 in
    Escherichia coli inner membranes and test whether Mup20 co-immunoprecipitates
    with Mup19 or host inner membrane proteins during phage Mu infection.
