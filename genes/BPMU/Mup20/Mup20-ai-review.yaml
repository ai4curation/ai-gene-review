id: Q38623
gene_symbol: Mup20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 39-amino-acid single-pass membrane protein gp20 (Mup20; 4.3 kDa)
  of Escherichia phage Mu, encoded in the middle operon immediately downstream of
  Mup19 and upstream of the late transcription activator gene C (Mup21). Contains a
  C-terminal helical transmembrane segment (residues 18-38) following a short
  hydrophilic N-terminal tail (residues 1-17) and is expressed during the
  intermediate phase of the viral replicative cycle; its specific molecular role in
  phage Mu infection remains unknown.
