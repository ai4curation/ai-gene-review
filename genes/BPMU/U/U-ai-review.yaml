      Protein U assists the folding and solubilization of phage Mu tail fiber subunits in the host bacterial cytoplasm.
    action: ACCEPT
    reason: >-
      Co-expression and purification experiments in PMID:31504613 demonstrate that gp50 (U) is required as a molecular chaperone to fold tail fiber subunits (gp49/S as well as gp52/S') into soluble complexes.
    supported_by:
    - reference_id: PMID:31504613
      supporting_text: >-
