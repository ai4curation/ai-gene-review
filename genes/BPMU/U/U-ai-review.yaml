  label: Escherichia phage Mu
description: >-
  Tail fiber assembly protein U (Mup50/gp50/gpU) of bacteriophage Mu that acts as a dedicated molecular chaperone required for the folding and assembly of tail fiber protein S (Mup49/gp49). Encoded entirely within the invertible 3-kb G-segment downstream of gene S and expressed when the G-segment is in the G(+) orientation, protein U binds nascent S subunits in the host cytoplasm to produce soluble, functional tail fibers and remains associated with the assembled fiber. Although co-regulated exclusively with S in vivo, U is also capable of binding and folding the alternate tail fiber subunit S' (Mup52/gp52) in vitro.
