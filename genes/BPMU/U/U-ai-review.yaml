- id: PMID:27555589
  title: 'Baseplate assembly of phage Mu: Defining the conserved core components of contractile-tailed phages and related bacterial systems.'
  findings:
  - statement: >-
      Co-expression of genes 49 (S) and 50 (U) with the core baseplate genes 43-48 produces baseplate complexes with attached tail fibers.
    supporting_text: >-
      To determine whether our observed baseplate structures were able to bind tail fibers, we created a construct expressing genes 43 to 50 , where genes 49 and 50 encode the tail fiber and tail-fiber assembly protein, respectively. Using this construct, with an N-terminal His 6 -tag encoded on Mup43, we isolated a complex that contained baseplate structures with tail fibers attached as observed by EM
- id: PMID:31504613
  title: Observation of unexpected molecular binding activity for Mu phage tail fibre chaperones.
  findings:
  - statement: >-
      Tail fiber chaperone gp50 (U) is functional for folding both its native partner gp49 (S) and the alternate tail fiber subunit gp52 (S'), forming stable complexes with either protein.
    supporting_text: >-
      However, heterologous overexpression results for gp49 or gp52 (tail fibre subunit) together with gp51 and gp50, respectively, were also effective in producing soluble Mu tail fibres. Moreover, we successfully purified non-native gp49-gp51 and gp52-gp50 complexes. These facts showed that gp50 and gp51 were fungible and functional for both gp49 and gp52 each other.
- id: file:BPMU/U/U-uniprot.txt
  title: UniProtKB entry for U (Q9T1U9)
  findings:
  - statement: >-
      Protein U is a tail fiber assembly chaperone required for viral tail fiber formation in the G(+) orientation.
    supporting_text: >-
      -!- FUNCTION: Chaperone involved in tail fiber assembly. Remains associated to the tail fiber and participates in the host receptor binding. Binds to the primary receptor (Probable). Two alternate tail fiber assembly proteins U and U' are encoded extending the host range of the virus.
suggested_questions:
- question: >-
    Given that U (gp50) and U' (gp51) are interchangeable in folding both S (gp49) and S' (gp52) in vitro (PMID:31504613), why has phage Mu maintained two distinct chaperone genes within the invertible G-segment?
suggested_experiments:
- description: >-
    Compare the adsorption kinetics and plating efficiencies of phage Mu virions reconstituted with native (gp49-gp50, gp52-gp51) versus non-native (gp49-gp51, gp52-gp50) tail fiber-chaperone complexes across E. coli K-12 and Citrobacter freundii hosts.
  hypothesis: >-
    While U and U' are interchangeable for folding S and S', the C-terminal variable region of each chaperone modulates fine receptor-binding affinity on the respective host cell surface.
