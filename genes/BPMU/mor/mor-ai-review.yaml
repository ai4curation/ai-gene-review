suggested_questions:
- question: How does DNA binding at Pm induce the ~10-Angstrom outward displacement or lengthening of the Mor dimerization bundle required to straddle adjacent major grooves?
  experts:
  - Martha M. Howe
  - Hee-Won Park
suggested_experiments:
- description: Determine the cryo-EM or X-ray structure of the ternary complex of Mor, E. coli sigma70-RNAP holoenzyme, and the Pm promoter DNA fragment.
  hypothesis: Binding of the Mor dimer at -43.5 positions its beta-strand linker and flanking surfaces to simultaneously contact both the alpha-CTD upstream and sigma70 region 4 downstream.
