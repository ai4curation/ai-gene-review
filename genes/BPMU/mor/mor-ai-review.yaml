  label: Escherichia phage Mu
description: Middle operon regulator Mor is a 129-amino-acid homodimeric winged helix-turn-helix DNA-binding transcription activator of Escherichia phage Mu. Functioning in the host cell cytoplasm, Mor binds a dyad-symmetric operator centered at position -43.5 of the middle promoter (Pm) and interacts with the C-terminal domains of the Escherichia coli RNA polymerase alpha and sigma subunits to activate middle operon transcription, including synthesis of the late transcription activator C.
