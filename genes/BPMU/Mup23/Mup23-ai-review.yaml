- id: PMID:17900620
  title: Rz/Rz1 lysis gene equivalents in phages of Gram-negative hosts.
  findings:
  - statement: >-
      Comparative genomic and membrane-localization signal analyses identified Rz/Rz1
      two-component spanin equivalents across phages of Gram-negative bacteria,
      including phage Mu gene 23.
    supporting_text: >-
      Here we report that a search strategy based primarily on gene arrangement and membrane localization signals rather than sequence similarity has revealed that Rz/Rz1 equivalents are nearly ubiquitous among phages of Gram-negative hosts, with 120 of 137 phages possessing genes that fit the search criteria.
- id: PMID:35471081
  title: Endolysin Regulation in Phage Mu Lysis.
  findings:
  - statement: >-
      gp23 is the inner-membrane spanin subunit (i-spanin) of phage Mu with an
      N-terminal transmembrane domain and a periplasmic alpha-helical domain; amber
      mutations in gene 23 cause a classic spherical-cell lysis defect due to failure
      of outer membrane disruption.
    supporting_text: >-
      Gene 23 encodes a polypeptide with an N-terminal TMD and a periplasmic domain comprised of alpha-helical regions. We identified an overlapping CDS, 23.1, not annotated in the original Mu genome, that encodes a short outer membrane (OM) lipoprotein rich in Pro residues
- id: file:BPMU/Mup23/Mup23-uniprot.txt
  title: UniProtKB record for Q9T1X1 (SPAN1_BPMU / Mup23)
  findings:
  - statement: >-
      UniProtKB annotates gp23 as the inner membrane subunit (i-spanin) of the
      periplasm-spanning spanin complex that disrupts the host outer membrane during
      phage exit.
    supporting_text: >-
      Component of the spanin complex that disrupts the host outer membrane and causes cell lysis during virus exit. The spanin complex conducts the final step in host lysis by disrupting the outer membrane after endolysin action has degraded the host peptidoglycans.
suggested_questions:
- question: >-
    Does Cys98 in the periplasmic domain of gp23 form an intermolecular disulfide
    bond during spanin maturation, analogous to the covalent homodimerization of
    lambda Rz and Rz1 bolstered by host DsbA/DsbC?
suggested_experiments:
- description: >-
    Perform non-reducing SDS-PAGE and site-directed mutagenesis of Cys98 in gp23 and
    Cys80 in gp23.1 to determine whether covalent periplasmic disulfide crosslinking
    is required for phage Mu spanin complex function.
