id: Q9T1X1
gene_symbol: Mup23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Inner membrane spanin subunit gp23 (i-spanin, Mup23) of Escherichia phage Mu, a
  128-amino-acid type II single-pass inner membrane protein with an N-terminal
  transmembrane helix (residues 7-23) and a predominantly alpha-helical periplasmic
  coiled-coil ectodomain. Pairs with the outer-membrane lipoprotein spanin subunit
  gp23.1 (o-spanin, Mup23.1) to form a two-component periplasm-spanning spanin
  complex (Rz/Rz1 equivalent). Following degradation of the peptidoglycan meshwork
  by the SAR-endolysin gp22, the gp23-gp23.1 spanin complex undergoes a
  conformational change that disrupts the host Gram-negative outer membrane,
  completing the final step of programmed host cell cytolysis and virion release.
