      supporting_text: >-
        Here, we demonstrate that gp22 is a signal-anchor-release (SAR) endolysin and identify gp23 and gp23.1 as two-component spanin subunits.
- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IDA
  original_reference_id: PMID:35471081
  qualifier: involved_in
  review:
    summary: >-
      Amber mutation and complementation analyses demonstrate that gp23 is required
      as the i-spanin subunit for outer-membrane disruption and host cell lysis.
    action: NEW
    reason: >-
      Chamblee et al. (2022) demonstrated that amber mutations in gene 23 result in
      fragile spherical cells bounded by an intact outer membrane after peptidoglycan
      degradation, proving that gp23 is essential for outer-membrane disruption
      during viral release from the host cell by cytolysis (PMID:35471081).
    supported_by:
    - reference_id: PMID:35471081
      supporting_text: >-
        We show that gp22 can be characterized as a SAR endolysin, a muralytic enzyme that activates upon release from the membrane to degrade the cell wall. Furthermore, we identify genes 23 and 23.1 as spanin subunits used for outer membrane disruption.
- term:
    id: GO:0044229
    label: host cell periplasmic space
  evidence_type: IDA
  original_reference_id: PMID:35471081
  qualifier: located_in
  review:
    summary: >-
      The C-terminal alpha-helical coiled-coil ectodomain of gp23 extends across the
      host periplasmic space to complex with the outer-membrane lipoprotein gp23.1.
    action: NEW
    reason: >-
      Following its N-terminal transmembrane anchor, residues 24-128 of gp23 form a
      periplasmic alpha-helical coiled-coil domain that bridges the host periplasmic
      space via interaction with o-spanin gp23.1 (PMID:35471081).
    supported_by:
    - reference_id: PMID:35471081
      supporting_text: >-
        Gene 23 encodes a polypeptide with an N-terminal TMD and a periplasmic domain comprised of alpha-helical regions.
    - reference_id: file:BPMU/Mup23/Mup23-uniprot.txt
      supporting_text: >-
        Interacts with the spanin outer membrane subunit. Part of the spanin complex which spans the entire periplasmic space.
core_functions:
- description: >-
    Inner-membrane spanin subunit (i-spanin) that complexes across the host
    periplasmic space with the outer-membrane lipoprotein subunit gp23.1 (o-spanin)
    to disrupt the Gram-negative outer membrane after peptidoglycan degradation,
    completing cytolytic virion egress.
  directly_involved_in:
