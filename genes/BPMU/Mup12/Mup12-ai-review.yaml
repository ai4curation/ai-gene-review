id: Q38488
gene_symbol: Mup12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 176-amino-acid early protein gp12 (Mup12, also designated E13;
  19.9 kDa) of Escherichia phage Mu, encoded in the semi-essential (SE) region of
  the early Pe operon between Mup11 and Mup13. Belongs to the conserved
  Phage_Mu_Gp12 domain family (Pfam PF26885 / InterPro IPR059625) and lacks
  predicted signal peptides or transmembrane helices. Expressed in the host
  bacterial cytoplasm during the early phase of the viral replicative cycle under
  the transcriptional control of Repc and Ner; its specific molecular function in
  phage Mu development remains unknown.
