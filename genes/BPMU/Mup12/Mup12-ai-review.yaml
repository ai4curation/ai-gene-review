suggested_questions:
- question: >-
    What biochemical activity is mediated by the conserved Phage_Mu_Gp12 (PF26885)
    domain of Mup12 during early lytic infection of Escherichia coli?
suggested_experiments:
- description: >-
    Construct an in-frame Mup12 deletion in phage Mu to profile host-range and
    burst-size phenotypes, and perform structural and biochemical characterization
    of purified recombinant gp12.
