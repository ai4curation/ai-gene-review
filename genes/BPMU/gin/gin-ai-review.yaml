id: P03015
gene_symbol: gin
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Serine recombinase Gin (G-segment invertase, Mup53/gp53) of bacteriophage Mu that catalyzes site-specific inversion of the 3-kb viral G-segment to switch phage host tropism. Gin comprises an N-terminal catalytic resolvase/invertase domain containing the active-site nucleophile Ser-9 and a C-terminal helix-turn-helix DNA-binding domain that recognizes the 34-bp palindromic gix recombination sites flanking the G-segment. In the presence of the Escherichia coli host factor Fis bound to the recombinational enhancer, two gix-bound Gin dimers assemble into a synaptic tetramer, introduce staggered double-strand breaks via transient 5'-phosphoserine covalent intermediates at Ser-9, undergo a 180-degree subunit rotation, and religate the DNA strands to alternate expression between the S-U (G+) and S'-U' (G-) tail fiber operons.
