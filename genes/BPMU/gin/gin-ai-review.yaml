- id: file:BPMU/gin/gin-uniprot.txt
  title: UniProtKB entry for gin (P03015)
  findings:
  - statement: >-
      Gin is a site-specific serine recombinase that binds the 34-bp gix sites as a dimer, forms a synaptic tetramer with Fis-bound enhancer DNA, cleaves DNA via Ser-9 5'-phosphoserine linkage, and rotates 180 degrees to invert the 3-kb G-segment.
    supporting_text: >-
      -!- FUNCTION: Performs inversion of a viral 3 kp segment (G-segment) that encodes two alternate pairs of tail fiber proteins thereby modifying the host specificity of the virus. Binds as a dimer to the viral gix sites which are 34-bp palindromic sequences that flank the invertible G-segment. Catalyzes site-specific recombination in the presence of the host factor Fis. Gin dimers bound to each of the gix sites and host factor Fis bound to the enhancer come together to form the synaptic complex. Each Gin monomer introduces a nick and becomes covalently attached to the 5'-phosphate of the DNA, resulting in double-stranded staggered breaks at both recombination sites. A 180 degrees rotation of one of the two Gin dimers followed by religation of the DNA leads to the inversion of the G-segment (G+ or G- orientation).
suggested_questions:
- question: >-
    How does the Fis-bound recombinational enhancer allosterically unlock the flat rotational interface of the Gin synaptic tetramer (PDB:3UJ3) to permit strand cleavage and 180-degree subunit rotation?
suggested_experiments:
- description: >-
    Determine the cryo-EM structure of the complete Gin-gix-Fis-enhancer invertasome complex trapped in the covalent 5'-phosphoserine intermediate state.
  hypothesis: >-
    Fis-induced DNA supercoiling and direct contacts at the base of the Gin DNA-binding domain remodel alpha-helix E at the tetramer core to align active-site Ser-9 with the scissile phosphodiester bond.
