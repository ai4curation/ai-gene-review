    summary: >-
      Broad keyword-derived annotation from EC 3.1.22.- representing the DNA strand cleavage step of recombination.
    action: MODIFY
    reason: >-
      Serine recombinases cleave and rejoin DNA strands via concerted transesterification involving a covalent 5'-phosphoserine intermediate at Ser-9 rather than hydrolytic cleavage; the complete catalytic activity is accurately represented by GO:0009009 (site-specific recombinase activity).
    proposed_replacement_terms:
    - id: GO:0009009
      label: site-specific recombinase activity
    supported_by:
    - reference_id: file:BPMU/gin/gin-uniprot.txt
      supporting_text: >-
        Each Gin monomer introduces a nick and becomes covalently attached to the 5'-phosphate of the DNA, resulting in double-stranded staggered breaks at both recombination sites. A 180 degrees rotation of one of the two Gin dimers followed by religation of the DNA leads to the inversion of the G-segment (G+ or G- orientation).
    additional_reference_ids:
    - file:BPMU/gin/gin-uniprot.txt
  extensions:
  - predicate: enables
  supporting_entities:
