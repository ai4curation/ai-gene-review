- term:
    id: GO:0032359
    label: provirus excision
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1250
  review:
    summary: >-
      Spurious keyword mapping from KW-1250 (Viral genome excision); phage Mu never
      excises its prophage during lytic replication or packaging, and gp27 is the
      small terminase subunit for headful DNA packaging.
    action: REMOVE
    reason: >-
      GO:0032359 (provirus excision) is an erroneous automated keyword mapping from
      UniProt keyword KW-1250 (Viral genome excision). Bacteriophage Mu replicates
      by replicative transposition without excising its integrated prophage, and
      the terminase complex (gp27/gp28) cuts host DNA flanking the integrated viral
      genome to initiate headful packaging (GO:0098006), not provirus excision.
- term:
    id: GO:0098006
    label: viral DNA genome packaging, headful
  evidence_type: IDA
  original_reference_id: PMID:14745593
  qualifier: involved_in
  review:
    summary: >-
      gp27 is the small terminase subunit essential for pac-site recognition and
      headful packaging of integrated phage Mu genomes into procapsids.
    action: NEW
    reason: >-
      Phage Mu packages its genome together with flanking host DNA segments by a
      pac-initiated headful packaging mechanism mediated by the gp27-gp28 terminase
      complex (PMID:14745593).
    supported_by:
    - reference_id: PMID:14745593
      supporting_text: >-
        Cloning and expression of this region enabled production of cell-free protein extracts that specifically recognize the phage-encoded packaging sequence (pac), a characteristic exhibited by phage maturation enzymes.
    - reference_id: file:BPMU/Mup27/Mup27-uniprot.txt
      supporting_text: >-
        The terminase large subunit exhibits endonuclease activity and cleaves the viral genome concatemer once the capsid is full (headful packaging).
- term:
    id: GO:0097710
    label: viral terminase, small subunit
  evidence_type: IDA
  original_reference_id: PMID:14745593
  qualifier: part_of
  review:
    summary: >-
      gp27 (gpD) forms the small DNA-recognition subunit of the phage Mu
      heterooligomeric terminase holoenzyme.
    action: NEW
    reason: >-
      Genetic and biochemical characterization of gene D (Mup27) established that
      gp27 is the small subunit of the phage Mu terminase complex (PMID:14745593).
    supported_by:
    - reference_id: PMID:14745593
      supporting_text: >-
        These results support the hypothesis that D and E encode subunits of the Mu DNA maturation enzyme.
    - reference_id: file:BPMU/Mup27/Mup27-uniprot.txt
      supporting_text: >-
        The terminase lies at a unique vertex of the procapsid and is composed of two subunits, a small terminase subunit involved in viral DNA recognition (packaging sequence), and a large terminase subunit possessing endonucleolytic and ATPase activities.
core_functions:
- description: >-
    Small subunit of the phage Mu terminase complex that binds the viral packaging
    initiation site (pac) and recruits the large terminase subunit gp28 to the
    procapsid portal vertex to drive headful viral DNA genome packaging in the host
    cytoplasm.
