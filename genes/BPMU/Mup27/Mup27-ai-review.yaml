  - UniProtKB-SubCell:SL-0381
  review:
    summary: >-
      gp27 assembles with gp28 and the procapsid portal vertex inside the host
      bacterial cytoplasm during late lytic infection.
    action: ACCEPT
    reason: >-
      Viral DNA recognition and headful packaging into procapsids occur in the host
      bacterial cytoplasm during the late phase of the phage Mu lytic cycle.
    supported_by:
