id: Q9T1W7
gene_symbol: Mup27
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Terminase small subunit gp27 (also known as gpD, pacase small subunit, or Mup27;
  191 aa, 21.6 kDa) of Escherichia phage Mu. Specifically recognizes the phage
  genome packaging initiation site (pac) near the left end of integrated Mu DNA and
  heterooligomerizes with the terminase large subunit gp28 (gpE / Mup28) at the
  portal vertex of the procapsid to regulate its ATPase and endonuclease activities
  during headful viral DNA genome packaging.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0238
  review:
    summary: >-
      gp27 (gpD) is the DNA-recognition subunit of the phage Mu terminase complex
      that binds the viral packaging initiation sequence (pac).
    action: ACCEPT
    reason: >-
      Siboo et al. (2004) showed that extracts containing gp27 (D) and gp28 (E)
      specifically recognize the phage Mu packaging sequence (pac), establishing
      gp27 as the pac-binding small terminase subunit (PMID:14745593).
    supported_by:
    - reference_id: PMID:14745593
      supporting_text: >-
        Cloning and expression of this region enabled production of cell-free protein extracts that specifically recognize the phage-encoded packaging sequence (pac), a characteristic exhibited by phage maturation enzymes.
    - reference_id: file:BPMU/Mup27/Mup27-uniprot.txt
      supporting_text: >-
        The terminase small subunit binds to the packaging initiation site (pac) and regulates the ATPase activity of the terminase large subunit.
