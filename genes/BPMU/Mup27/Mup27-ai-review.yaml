- id: PMID:14745593
  title: Characterization of Plys-proximal morphogenetic genes of transposable bacteriophage
    Mu.
  findings:
  - statement: >-
      Sequence analysis of amber mutants in genes D and E and pac-binding assays of
      cell-free extracts identified Mup27 (gpD) and Mup28 (gpE) as the small and
      large subunits of the phage Mu DNA maturation and packaging enzyme (terminase).
    supporting_text: >-
      DNA sequence analysis of amber mutations in genes D and E identified the sixth and seventh open reading frames as D and E, respectively. Cloning and expression of this region enabled production of cell-free protein extracts that specifically recognize the phage-encoded packaging sequence (pac), a characteristic exhibited by phage maturation enzymes.
- id: file:BPMU/Mup27/Mup27-uniprot.txt
  title: UniProtKB record for Q9T1W7 (TERS_BPMU / Mup27)
  findings:
  - statement: >-
      UniProtKB annotates gp27 (gpD) as the small terminase subunit that recognizes
      the pac site and heterooligomerizes with the large terminase subunit gp28 to
      drive headful DNA packaging.
    supporting_text: >-
      The terminase small subunit binds to the packaging initiation site (pac) and regulates the ATPase activity of the terminase large subunit.
suggested_questions:
- question: >-
    What is the oligomeric ring stoichiometry of gp27 when bound to the phage Mu
    pac site, and how does it position the initial cleavage site ~50-150 bp outside
    the left end of integrated Mu DNA in flanking host chromatin?
suggested_experiments:
- description: >-
    Determine the cryo-EM structure and DNase I footprint of purified gp27 bound to
    a DNA fragment containing the Mu pac site and flanking host DNA to reveal how
    pac recognition directs cleavage into adjacent host sequences.
