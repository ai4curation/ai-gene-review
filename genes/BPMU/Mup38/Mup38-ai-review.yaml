suggested_questions:
- question: >-
    Is gp38 (Mup38) a stoichiometric component of the neck-sheath junction in mature
    phage Mu virions, or is its role fulfilled by the hexameric tail terminator gp37
    (Mup37) directly contacting the top ring of tail sheath protein L?
suggested_experiments:
- description: >-
    Construct a nonpolar Mup38 deletion mutant in phage Mu and examine tail sheath
    stability and assembly by cryo-electron microscopy and immunoblotting against
    tail sheath protein L.
  hypothesis: >-
    Loss of gp38 destabilizes the extended conformation of the tail sheath or
    uncouples sheath termination from tail tube termination.
