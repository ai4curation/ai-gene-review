id: P79677
gene_symbol: Mup38
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Putative tail sheath terminator protein (gp38) of bacteriophage Mu. Expressed
  during the late phase of the viral lytic cycle under activation by the viral late
  transcription activator C, gp38 is proposed to cap the polymerizing tail sheath
  once it reaches its full length, preventing sheath depolymerization by interacting
  with both the tail tube and tail sheath proteins.
