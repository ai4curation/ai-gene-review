id: Q38477
gene_symbol: Mup06
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 76-amino-acid early protein gp6 (Mup06, also designated E5; 8.5
  kDa) of Escherichia phage Mu, encoded in the semi-essential (SE) region of the
  early Pe operon downstream of kil (Mup05). Classifies into the Phage_Mu_gp6
  domain family (Pfam PF26833 / InterPro IPR059686) and contains three conserved
  cysteine-rich motifs (HCQCH at residues 14-18, CPGC at residues 34-37, and CCPWCS
  at residues 55-60) suggestive of metal-ion coordination. Expressed in the host
  bacterial cytoplasm during the early phase of the viral replicative cycle under
  the transcriptional control of Repc and Ner; its exact biochemical role in phage
  Mu development remains unknown.
