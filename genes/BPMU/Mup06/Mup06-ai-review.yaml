suggested_questions:
- question: >-
    Do the three conserved cysteine-rich motifs (HCQCH, CPGC, and CCPWCS) in gp6
    coordinate Zn2+ or an iron-sulfur cluster, and does gp6 interact with host
    nucleoid proteins or early phage replication factors?
suggested_experiments:
- description: >-
    Express and purify recombinant Mup06 (gp6) to measure metal stoichiometry by
    inductively coupled plasma mass spectrometry (ICP-MS) and perform site-directed
    mutagenesis of the CxxC/CxxH cysteines to assess their role in protein folding
    and early phage Mu development.
