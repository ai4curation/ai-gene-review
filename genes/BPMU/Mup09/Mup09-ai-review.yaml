id: Q38482
gene_symbol: Mup09
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 99-amino-acid early protein gp9 (Mup09, also designated E8; 11.6
  kDa) of Escherichia phage Mu, encoded in the semi-essential (SE) region of the
  early Pe operon immediately upstream of gam (Mup10). Lacks predicted signal
  peptides, transmembrane helices, or classified domain families, and is expressed
  in the host bacterial cytoplasm during the early phase of the viral replicative
  cycle under the transcriptional control of Repc and Ner; its molecular function
  and biological role in phage Mu infection remain unknown.
