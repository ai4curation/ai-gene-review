  review:
    summary: >-
      Predicted localization in the host cytoplasm for this soluble late phage
      protein lacking transmembrane or signal sequences; retained as non-core
      because its biological role is unknown.
    action: KEEP_AS_NON_CORE
    reason: >-
      gp24 is a soluble 64-aa polypeptide lacking signal peptides or transmembrane
      domains and is expressed in the host bacterial cytoplasm during late lytic
      infection. Because no specific molecular function or biological process has
      been established for gp24, this broad subcellular localization is retained as
      non-core.
    supported_by:
