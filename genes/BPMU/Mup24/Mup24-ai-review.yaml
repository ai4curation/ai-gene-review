id: Q9T1X0
gene_symbol: Mup24
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 64-amino-acid late protein gp24 (Mup24, 7.3 kDa) of Escherichia
  phage Mu, encoded within the Plys late transcript between the spanin genes
  (Mup23/Mup23.1) and the releasin gene (Mup25). Lacks predicted transmembrane
  helices or signal peptides, contains a C-terminal CxxC/CxxC-like cysteine-histidine
  motif (Cys36, Cys39, His58, Cys60), and is expressed during the late phase of the
  viral lytic cycle under the control of the phage late transcription activator C;
  its molecular function and specific role in the phage life cycle remain unknown.
