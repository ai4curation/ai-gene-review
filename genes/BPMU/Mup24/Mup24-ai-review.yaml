        SUBCELLULAR LOCATION: Host cytoplasm {ECO:0000305}.
core_functions:
- description: >-
    Uncharacterized 64-amino-acid soluble late protein (gp24) encoded in the Plys
    late operon between the spanin genes (Mup23/Mup23.1) and the releasin gene
    (Mup25), localized to the host cytoplasm with no experimentally established
    molecular function or biological process.
  supported_by:
  - reference_id: file:BPMU/Mup24/Mup24-uniprot.txt
    supporting_text: >-
      INDUCTION: Expressed in the late phase of the viral replicative cycle. Expression of late genes is activated by the viral late transcription activator C. {ECO:0000269|PubMed:8293968}.
