  - statement: >-
      gp24 is an uncharacterized 64-amino-acid late protein of phage Mu localized to
      the host cytoplasm and expressed under the control of the viral late
      transcription activator C.
    supporting_text: >-
      INDUCTION: Expressed in the late phase of the viral replicative cycle. Expression of late genes is activated by the viral late transcription activator C. {ECO:0000269|PubMed:8293968}.
suggested_questions:
- question: >-
    Does the conserved cysteine/histidine motif (Cys36-X2-Cys39 and His58-X-Cys60)
    of gp24 coordinate a zinc ion, and does gp24 play an accessory role in lysis
    timing or DNA packaging given its genomic position between the spanin genes
    (Mup23/Mup23.1) and the releasin gene (Mup25)?
suggested_experiments:
- description: >-
    Construct an in-frame deletion or amber nonsense mutant of Mup24 in an inducible
    phage Mu lysogen to test whether loss of gp24 alters lysis kinetics, burst size,
    or virion infectivity.
