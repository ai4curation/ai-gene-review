suggested_questions:
- question: How does the C-terminal CTD of wild-type Repc mask the ClpX recognition motif until heterodimerization with a frameshifted Vir subunit occurs?
  experts:
  - Ariane Toussaint
  - Hiroshi Nakai
suggested_experiments:
- description: Determine the high-resolution cryo-EM structure of the full-length Repc hexamer bound to supercoiled O1-O2-O3 operator DNA in complex with host IHF to visualize the repressed loop architecture.
  hypothesis: Repc hexamers bridge O1/O2 and O3 across an IHF-induced DNA bend, sterically occluding both the Pe promoter and the MuA enhancer binding sites.
