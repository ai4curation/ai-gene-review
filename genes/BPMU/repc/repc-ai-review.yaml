id: P06019
gene_symbol: repc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Repressor protein c (Repc) is the major lysogenic immunity repressor of Escherichia phage Mu. Operating in the host bacterial cytoplasm, it forms homodimers and higher-order oligomers that cooperatively bind three operator regions (O1, O2, and O3) via an N-terminal winged helix-turn-helix domain. Binding of Repc to O1 and O2 represses transcription from the early lytic promoter (Pe) and sterically blocks the MuA transposase from binding the overlapping internal activation sequence (IAS), thereby governing the latency-replication decision and maintaining the integrated prophage in a dormant state.
