  label: Escherichia phage Mu
description: Capsid assembly and minor head protein gp30 (gpF, Mup30; 439 aa, 49.4 kDa) of Escherichia phage Mu, containing a conserved phage head morphogenesis domain (InterPro IPR006528 / Pfam PF04233, NCBIfam TIGR01641 SPP1 gp7-like family). Encoded in the late morphogenetic operon immediately downstream of the portal protein gene H (Mup29) and upstream of gene G (Mup31), gp30 is expressed in the host cytoplasm under the control of the viral late transcription activator C, associates with the viral capsid as a minor capsid component, and is required for productive phage head morphogenesis.
