suggested_questions:
  - question: Does phage Mu gpF (gp30) bind directly to the portal vertex (gp29 / H) inside the capsid to control DNA packaging or ejection, analogous to its SPP1 gp7 homolog?
suggested_experiments:
  - description: Perform cryo-EM reconstruction and cross-linking mass spectrometry of mature phage Mu virions to localize gpF relative to the dodecameric portal ring gp29.
