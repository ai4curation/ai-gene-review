suggested_questions:
- question: >-
    Does Mup15 (gp15) functionally interact with the adjacent gem operon product
    GemA (Mup16) to modulate host DNA gyrase or nucleoid supercoiling during early
    phage Mu infection?
suggested_experiments:
- description: >-
    Compare host DNA supercoiling and early phage transcription kinetics in wild-type
    phage Mu versus an isogenic Mup15 deletion mutant, and test for physical
    interaction between gp15 and GemA (Mup16).
