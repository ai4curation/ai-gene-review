id: Q9T1X4
gene_symbol: Mup15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 88-amino-acid early protein gp15 (Mup15; 9.7 kDa) of Escherichia
  phage Mu, encoded in the semi-essential (SE) region of the early Pe operon
  between Mup14 and gemA (Mup16). Lacks predicted signal peptides, transmembrane
  helices, or classified domain families, and is expressed in the host bacterial
  cytoplasm during the early phase of the viral replicative cycle under the
  transcriptional control of Repc and Ner; its specific molecular function in
  phage Mu infection remains unknown.
