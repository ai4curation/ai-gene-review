suggested_questions:
- question: >-
    What host or phage binding partners interact with gp7 (Mup07) during early
    lytic development, and does deletion of Mup07 impair phage Mu growth on specific
    bacterial hosts or under anti-phage defense pressure?
suggested_experiments:
- description: >-
    Perform affinity purification coupled to mass spectrometry (AP-MS) of
    epitope-tagged Mup07 expressed in Escherichia coli during phage Mu infection and
    assay plaque formation of a clean Mup07 deletion mutant across diverse clinical
    and laboratory E. coli strains.
