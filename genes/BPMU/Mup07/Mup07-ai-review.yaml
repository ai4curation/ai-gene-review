id: Q38479
gene_symbol: Mup07
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 87-amino-acid early protein gp7 (Mup07, also designated E6; 9.2
  kDa) of Escherichia phage Mu, encoded in the semi-essential (SE) region of the
  early Pe operon between Mup06 and Mup08. Lacks predicted signal peptides,
  transmembrane segments, or recognized domain signatures, and is expressed in the
  host bacterial cytoplasm during the early phase of the viral replicative cycle
  under the control of the phage regulators Repc and Ner; its specific molecular
  function in phage Mu infection remains unknown.
