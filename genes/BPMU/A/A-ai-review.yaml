  review:
    summary: Spurious UniProt keyword/EC mapping (KW-0436 / EC 6.5.1.-); MuA is a DDE transposase that catalyzes isoenergetic transesterification rather than ATP/NAD-dependent DNA ligation.
    action: REMOVE
    reason: MuA does not possess DNA ligase activity (EC 6.5.1.-). Like other DDE-family transposases and retroviral integrases, MuA catalyzes concerted one-step transesterification (strand transfer, GO:0004803) using the 3'-OH of cleaved viral DNA as a nucleophile without high-energy cofactor hydrolysis; subsequent gap filling and nick ligation are performed by host repair enzymes.
