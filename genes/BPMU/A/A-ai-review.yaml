suggested_questions:
- question: How does ClpX unfolding of a single MuA protomer within the integrated strand-transfer transpososome specifically unmask the domain IIIalpha flap endonuclease during initial infection while directing replisome assembly during lytic replicative transposition?
  experts:
  - Rasika M. Harshey
  - Tania A. Baker
  - George Chaconas
suggested_experiments:
- description: Cryo-EM structural determination of the post-integration MuA-MuB-ClpX complex bound to a 5'-flapped Mu-host DNA junction intermediate.
  hypothesis: ClpX engagement of the C-terminal peptide of one MuA subunit repositions its domain IIIalpha active site directly over the 5'-flap junction while phage protein N (or absence of lytic factors) prevents PriA-mediated replisome loading.
