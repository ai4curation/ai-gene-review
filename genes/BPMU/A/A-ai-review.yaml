id: P07636
gene_symbol: A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: DDE-recombinase A (MuA) is the 663-amino-acid transposase of Escherichia phage Mu that catalyzes both initial viral genome integration into the host chromosome and subsequent lytic viral DNA genome replication via replicative transposition. Operating as a homotetramer within the transpososome in the host cell cytoplasm, MuA binds viral attL/attR end sequences and the internal activation sequence (IAS) via N-terminal winged helix-turn-helix domains—competing with the lysogenic repressor Repc in the latency-replication decision—while its RNase H-like DDE catalytic core coordinates Mg2+ ions to perform 3'-end donor DNA cleavage and concerted strand transfer, and a cryptic endonuclease in domain IIIalpha resects 5' flanking host DNA flaps after initial infection.
