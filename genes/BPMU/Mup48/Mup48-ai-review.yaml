suggested_questions:
- question: >-
    How does Mup48 (BW3) at the periphery of each baseplate wedge anchor the N-terminal conserved domain of the six tail fibers (S or S')?
suggested_experiments:
- description: >-
    Perform co-purification and cross-linking mass spectrometry of Mup47-Mup48 complexes incubated with the N-terminal conserved fragment of tail fiber S (residues 1-150).
  hypothesis: >-
    The peripheral surface of Mup48 provides the six symmetric attachment sites that dock the N-terminal baseplate-binding domain shared by both S and S' tail fibers.
