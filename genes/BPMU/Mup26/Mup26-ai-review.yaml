id: Q9T1W8
gene_symbol: Mup26
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 96-amino-acid late protein gp26 (Mup26, 10.9 kDa) of Escherichia
  phage Mu, encoded in the Plys late operon immediately downstream of the releasin
  gene Mup25 and upstream of the small terminase subunit gene Mup27. Contains a
  predicted winged-helix DNA-binding domain superfamily fold (InterPro IPR036390 /
  SUPFAM SSF46785) and is expressed in the host cytoplasm during the late phase of
  the viral lytic cycle under the control of the phage late transcription activator
  C; its specific molecular target and biological role remain uncharacterized.
