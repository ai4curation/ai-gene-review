  - UniProtKB-SubCell:SL-0381
  review:
    summary: >-
      Predicted localization in the host cytoplasm for this soluble late phage
      protein; retained as non-core because its specific biological role is unknown.
    action: KEEP_AS_NON_CORE
    reason: >-
      gp26 is a soluble 96-aa late viral protein lacking transmembrane helices or
      signal peptides that localizes to the host cytoplasm. Because its specific
      molecular function and biological process have not been experimentally
      established, this broad subcellular localization is retained as non-core.
    supported_by:
    - reference_id: file:BPMU/Mup26/Mup26-uniprot.txt
      supporting_text: >-
        SUBCELLULAR LOCATION: Host cytoplasm {ECO:0000305}.
core_functions:
- description: >-
    Uncharacterized 96-amino-acid soluble late protein (gp26) containing a predicted
    winged-helix DNA-binding domain superfamily fold (IPR036390), encoded in the
    Plys late operon between Mup25 and the small terminase gene Mup27 with no
    experimentally established molecular function or biological process.
  supported_by:
  - reference_id: file:BPMU/Mup26/Mup26-uniprot.txt
    supporting_text: >-
      INDUCTION: Expressed in the late phase of the viral replicative cycle. Expression of late genes is activated by the viral late transcription activator C. {ECO:0000269|PubMed:8293968}.
