  findings:
  - statement: >-
      gp26 is an uncharacterized 96-amino-acid late protein of phage Mu localized to
      the host cytoplasm that contains a predicted winged-helix DNA-binding domain
      superfamily match (IPR036390).
    supporting_text: >-
      INDUCTION: Expressed in the late phase of the viral replicative cycle. Expression of late genes is activated by the viral late transcription activator C. {ECO:0000269|PubMed:8293968}.
suggested_questions:
- question: >-
    Does the predicted winged-helix domain (IPR036390) of gp26 bind phage Mu DNA
    near the left-end packaging (pac) site to assist the adjacent terminase subunits
    gp27 and gp28, or does it modulate late transcription from the Plys promoter?
suggested_experiments:
- description: >-
    Perform electrophoretic mobility shift assays (EMSA) and ChIP-seq with purified
    epitope-tagged gp26 across the phage Mu genome to test for sequence-specific
    DNA-binding activity.
