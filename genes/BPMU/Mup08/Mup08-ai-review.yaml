id: Q38480
gene_symbol: Mup08
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 139-amino-acid early protein gp8 (Mup08, also designated E7; 16.3
  kDa) of Escherichia phage Mu, encoded in the semi-essential (SE) region of the
  early Pe operon between Mup07 and Mup09. Lacks predicted signal peptides,
  transmembrane helices, or classified domain families, and is expressed in the
  host bacterial cytoplasm during the early phase of the viral replicative cycle
  under the transcriptional control of Repc and Ner; its biochemical activity and
  role in the phage life cycle remain unknown.
