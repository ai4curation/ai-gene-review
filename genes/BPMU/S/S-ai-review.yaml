  - id: PMID:27555589
    title: 'Baseplate assembly of phage Mu: Defining the conserved core components of contractile-tailed phages and related bacterial systems.'
    findings:
      - statement: Co-expression of phage Mu genes 43 to 50 yields assembled baseplate complexes with attached Mup49 (S) tail fibers visible by electron microscopy.
        supporting_text: To determine whether our observed baseplate structures were able to bind tail fibers, we created a construct expressing genes 43 to 50 , where genes 49 and 50 encode the tail fiber and tail-fiber assembly protein, respectively. Using this construct, with an N-terminal His 6 -tag encoded on Mup43, we isolated a complex that contained baseplate structures with tail fibers attached as observed by EM
  - id: PMID:31504613
    title: Observation of unexpected molecular binding activity for Mu phage tail fibre chaperones.
    findings:
      - statement: Tail fiber subunit gp49 (S) is folded into soluble tail fibers by either its cognate chaperone gp50 (U) or the non-cognate chaperone gp51 (U').
        supporting_text: However, heterologous overexpression results for gp49 or gp52 (tail fibre subunit) together with gp51 and gp50, respectively, were also effective in producing soluble Mu tail fibres. Moreover, we successfully purified non-native gp49-gp51 and gp52-gp50 complexes. These facts showed that gp50 and gp51 were fungible and functional for both gp49 and gp52 each other.
  - id: file:BPMU/S/S-uniprot.txt
    title: UniProtKB entry for S (Q9T1V0)
    findings:
      - statement: Protein S is the G(+)-orientation tail fiber receptor-binding protein that determines phage Mu host specificity for E. coli.
        supporting_text: '-!- FUNCTION: Component of the tail fiber that acts as a receptor binding protein. Binds to the primary receptor, thereby determining the host range. Two alternate tail fiber S and S'' proteins are encoded extending the host range of the virus.'
suggested_questions:
  - question: Does the tail fiber assembly chaperone U (gp50) remain stably bound to the C-terminal tip of the S (gp49) trimer in mature virions to co-participate in LPS recognition, or is it released after folding?
suggested_experiments:
  - description: Determine the crystal or cryo-EM structure of the purified S (gp49)-U (gp50) complex bound to E. coli K-12 lipopolysaccharide core oligosaccharide.
    hypothesis: The variable C-terminal beta-helix of S directly coordinates the terminal glucose/heptose residues of the E. coli K-12 LPS outer core.
