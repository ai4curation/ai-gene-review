    original_reference_id: PMID:31504613
    review:
      summary: Tail fiber protein S (gp49) recognizes and binds specific lipopolysaccharide (LPS) core oligosaccharide receptors on the Escherichia coli host cell surface.
      action: ACCEPT
      reason: Direct binding to host cell surface lipopolysaccharide is the primary molecular function by which the S tail fiber mediates host recognition and adsorption.
      supported_by:
        - reference_id: PMID:31504613
          supporting_text: Depending on the gene orientation, a pair of genes 49-50 or 52-51 is expressed for producing different tail fibres that enable Mu phage to recognize different host cell surface.
