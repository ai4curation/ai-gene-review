id: Q9T1V0
gene_symbol: S
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Receptor-binding tail fiber protein S (Mup49/gp49/gpS) of bacteriophage Mu expressed when the invertible 3-kb G-segment is in the G(+) orientation. Protein S consists of a conserved N-terminal baseplate-binding domain encoded upstream of the G-segment and a variable C-terminal receptor-binding domain encoded within the G-segment that binds specific lipopolysaccharide (LPS) structures on the surface of Escherichia coli K-12 and related hosts. Its folding and assembly into functional trimeric tail fibers require the cognate tail fiber assembly chaperone U (Mup50/gp50), although S can also be folded by the alternate chaperone U' (Mup51/gp51) in vitro.
