  - term:
      id: GO:0098678
      label: viral tropism switching
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: Protein S is one of two alternative chimeric tail fiber proteins (S and S') generated by Gin-catalyzed inversion of the G-segment, switching phage Mu host range between E. coli K-12 and other enteric bacteria.
      action: KEEP_AS_NON_CORE
      reason: While S is the G(+)-specific receptor-binding effector whose C-terminal region is swapped by G-segment inversion to alter host tropism, the recombination switch itself is catalyzed by serine recombinase Gin.
      supported_by:
        - reference_id: file:BPMU/S/S-uniprot.txt
          supporting_text: '-!- MISCELLANEOUS: The orientation of the G segment is defined as G+ and G-. G+ orientation provides S-U fibers whereas G- provides S''-U'' fibers. S-U and S''-U'' dont have the same host range (e.g. respectively E.coli and C.freundii).'
      additional_reference_ids:
        - file:BPMU/S/S-uniprot.txt
