    review:
      summary: Protein S (Mup49) forms the receptor-binding tail fiber of G(+)-orientation phage Mu virions, anchored to the baseplate.
      action: ACCEPT
      reason: Co-expression of genes 43-50 and electron microscopy (PMID:27555589) as well as biochemical purification of gp49-gp50 complexes (PMID:31504613) confirm that S forms the phage Mu tail fiber.
      supported_by:
        - reference_id: PMID:27555589
          supporting_text: To determine whether our observed baseplate structures were able to bind tail fibers, we created a construct expressing genes 43 to 50 , where genes 49 and 50 encode the tail fiber and tail-fiber assembly protein, respectively. Using this construct, with an N-terminal His 6 -tag encoded on Mup43, we isolated a complex that contained baseplate structures with tail fibers attached as observed by EM
        - reference_id: PMID:31504613
          supporting_text: Classical amber mutation experiments and genome sequence analysis of Mu phage suggested that gene products (gp) of geneS (gpS = gp49) and gene S' (gpS' = gp52) are tail fibres and that gene products of geneU (gpU = gp50) and geneU' (gpU' = gp51) work for tail fibre assembly or tail fibre chaperones.
      additional_reference_ids:
        - PMID:27555589
        - PMID:31504613
