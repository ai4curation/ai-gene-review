id: P79679
gene_symbol: M
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Major tail tube protein (gpM / Mup40) of bacteriophage Mu. Homomultimers of gpM polymerize around the tape measure protein (gp42) from the baseplate hub to form the central tail tube surrounded by the contractile tail sheath (gpL); disruption of gene M abolishes tail synthesis. Upon host cell attachment and sheath contraction, the gpM tail tube penetrates the bacterial cell envelope and serves as the channel for viral genome ejection.
