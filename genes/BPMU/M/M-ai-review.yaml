      - reference_id: PMID:27555589
        supporting_text: Contractile phage (myophage) tails, one of the three classes of tails, possess an outer sheath that surrounds a central tube. Upon contact with a host cell, the sheath contracts and drives the tail tube through the cell envelope and the genome is subsequently injected.
