suggested_questions:
  - question: How do the tail assembly chaperones gp41 and FS-gp41 transiently bind monomeric or hexameric gpM to prevent premature self-polymerization in the absence of the baseplate-tape measure complex?
suggested_experiments:
  - description: Measure polymerization kinetics of purified tail tube protein M in vitro in the presence and absence of the gp41/FS-gp41 chaperone complex and the baseplate hub-tape measure complex.
    hypothesis: The gp41/FS-gp41 complex lowers the kinetic barrier for nucleating gpM hexamers specifically onto the tape measure protein while suppressing off-pathway poly-tube formation.
