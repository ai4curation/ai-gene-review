      supporting_text: >-
        Interacts with the spanin inner membrane subunit. Part of the spanin complex which spans the entire periplasmic space.
core_functions:
- description: >-
    Outer-membrane lipoprotein spanin subunit (o-spanin) that complexes across the
    periplasmic space with the inner-membrane subunit gp23 (i-spanin) to disrupt
    the host outer membrane following peptidoglycan degradation during cytolytic
    virion release.
  directly_involved_in:
  - id: GO:0044659
    label: viral release from host cell by cytolysis
  locations:
  - id: GO:0039662
    label: host cell outer membrane
  - id: GO:0044229
    label: host cell periplasmic space
  supported_by:
  - reference_id: PMID:35471081
    supporting_text: >-
      Here, we demonstrate that gp22 is a signal-anchor-release (SAR) endolysin and identify gp23 and gp23.1 as two-component spanin subunits.
  - reference_id: file:BPMU/Mup23.1/Mup23.1-uniprot.txt
    supporting_text: >-
      Component of the spanin complex that disrupts the host outer membrane and participates in cell lysis during virus exit.
