- id: PMID:35471081
  title: Endolysin Regulation in Phage Mu Lysis.
  findings:
  - statement: >-
      Chamblee et al. (2022) identified the previously unannotated overlapping CDS
      23.1 encoding a proline-rich outer membrane lipoprotein (o-spanin) and proved
      that gp23.1 is required with i-spanin gp23 for outer membrane disruption
      during phage Mu lysis.
    supporting_text: >-
      Gene 23 encodes a polypeptide with an N-terminal TMD and a periplasmic domain comprised of alpha-helical regions. We identified an overlapping CDS, 23.1, not annotated in the original Mu genome, that encodes a short outer membrane (OM) lipoprotein rich in Pro residues
- id: file:BPMU/Mup23.1/Mup23.1-uniprot.txt
  title: UniProtKB record for P0DTL7 (SPAN2_BPMU / Mup23.1)
  findings:
  - statement: >-
      UniProtKB annotates gp23.1 as the outer-membrane lipoprotein subunit (o-spanin)
      of the phage Mu spanin complex localized to the periplasmic side of the host
      outer membrane.
    supporting_text: >-
      Component of the spanin complex that disrupts the host outer membrane and participates in cell lysis during virus exit.
suggested_questions:
- question: >-
    What is the stoichiometric oligomeric state of the gp23-gp23.1 spanin complex in
    vivo, and does the proline-rich region of gp23.1 (residues 36-62) directly
    promote outer-inner membrane fusion upon peptidoglycan clearance?
suggested_experiments:
- description: >-
    Perform liposome fusion assays with purified reconstituted gp23 and lipidated
    gp23.1, comparing wild-type gp23.1 with proline-cluster substitution mutants to
    define the fusogenic determinant of the phage Mu spanin complex.
