  evidence_type: IDA
  original_reference_id: PMID:35471081
  qualifier: located_in
  review:
    summary: >-
      gp23.1 is a lipoprotein sorted via the host Lol pathway to the periplasmic
      leaflet of the host bacterial outer membrane.
    action: NEW
    reason: >-
      gp23.1 possesses a canonical lipobox signal sequence (cleaved before Cys29)
      that directs acylation and sorting to the host cell outer membrane
      (PMID:35471081).
    supported_by:
    - reference_id: PMID:35471081
      supporting_text: >-
        We identified an overlapping CDS, 23.1, not annotated in the original Mu genome, that encodes a short outer membrane (OM) lipoprotein rich in Pro residues
    - reference_id: file:BPMU/Mup23.1/Mup23.1-uniprot.txt
      supporting_text: >-
        SUBCELLULAR LOCATION: Host cell outer membrane {ECO:0000305}; Lipid-anchor {ECO:0000305}; Periplasmic side {ECO:0000305}.
- term:
    id: GO:0044229
    label: host cell periplasmic space
  evidence_type: IDA
  original_reference_id: PMID:35471081
  qualifier: located_in
  review:
    summary: >-
      Tethered by its N-terminal lipid anchor to the inner leaflet of the outer
      membrane, the mature polypeptide chain of gp23.1 projects into the host
      periplasmic space to bind i-spanin gp23.
    action: NEW
    reason: >-
      As part of the periplasm-spanning gp23-gp23.1 spanin complex, the proline-rich
      ectodomain of gp23.1 resides on the periplasmic side of the outer membrane
      (PMID:35471081).
    supported_by:
