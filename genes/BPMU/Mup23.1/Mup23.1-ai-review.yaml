- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IDA
  original_reference_id: PMID:35471081
  qualifier: involved_in
  review:
    summary: >-
      Direct experimental evidence shows that gp23.1 is the essential outer-membrane
      spanin subunit (o-spanin) required for outer membrane disruption and host
      cell cytolysis.
    action: ACCEPT
    reason: >-
      Chamblee et al. (2022) identified gene 23.1 and demonstrated that nonsense
      mutations in 23.1 block outer-membrane disruption, resulting in spherical
      cells after endolysin action and establishing gp23.1 as the essential
      o-spanin for cytolytic phage release (PMID:35471081).
    supported_by:
    - reference_id: PMID:35471081
      supporting_text: >-
        We show that gp22 can be characterized as a SAR endolysin, a muralytic enzyme that activates upon release from the membrane to degrade the cell wall. Furthermore, we identify genes 23 and 23.1 as spanin subunits used for outer membrane disruption.
