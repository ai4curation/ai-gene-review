id: P0DTL7
gene_symbol: Mup23.1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Outer-membrane lipoprotein spanin subunit gp23.1 (o-spanin, Mup23.1) of
  Escherichia phage Mu, encoded by a reading frame overlapping the 3' region of the
  i-spanin gene Mup23. Synthesized as a 113-amino-acid precursor with an N-terminal
  lipoprotein signal peptide (residues 1-28) cleaved by host signal peptidase II,
  generating a mature proline-rich polypeptide (residues 29-113) lipid-anchored via
  N-palmitoyl and S-diacylglycerol modifications at Cys29 to the periplasmic leaflet
  of the host outer membrane. Complexes across the periplasmic space with the inner
  membrane spanin subunit gp23 (Mup23) to disrupt the host outer membrane after
  SAR-endolysin-mediated peptidoglycan degradation, executing the final step of
  host cell cytolysis and virion release.
existing_annotations:
- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0376
  review:
    summary: >-
      Conservative UniProt subcellular mapping from SL-0376 (Host cell outer
      membrane) mapped to host cell plasma membrane; gp23.1 is actually an
      outer-membrane lipoprotein anchored in the host cell outer membrane.
    action: MODIFY
    reason: >-
      UniProtKB Subcellular Location SL-0376 (Host cell outer membrane) was
      conservatively remapped by GO_REF:0000044 to GO:0020002 (host cell plasma
      membrane), which represents the inner membrane in Gram-negative bacteria.
      Because gp23.1 is an outer-membrane lipoprotein (o-spanin) tethered to the
      inner leaflet of the host outer membrane and extending into the periplasm
      (PMID:35471081), this annotation should be replaced by GO:0039662 (host cell
      outer membrane).
    proposed_replacement_terms:
    - id: GO:0039662
      label: host cell outer membrane
    supported_by:
    - reference_id: PMID:35471081
      supporting_text: >-
        We identified an overlapping CDS, 23.1, not annotated in the original Mu genome, that encodes a short outer membrane (OM) lipoprotein rich in Pro residues
    - reference_id: file:BPMU/Mup23.1/Mup23.1-uniprot.txt
      supporting_text: >-
        SUBCELLULAR LOCATION: Host cell outer membrane {ECO:0000305}; Lipid-anchor {ECO:0000305}; Periplasmic side {ECO:0000305}.
