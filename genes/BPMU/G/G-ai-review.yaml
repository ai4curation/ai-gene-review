suggested_questions:
- question: >-
    Does gpG (Mup31) form the dodecameric head-completion/neck-adaptor ring that
    plugs the portal vertex (gp29 / H) after termination of DNA packaging to enable
    contractile tail attachment?
suggested_experiments:
- description: >-
    Use cryo-EM single-particle analysis of DNA-filled phage Mu heads before and
    after tail attachment to determine whether gpG forms a ring directly below the
    gp29 portal dodecamer.
