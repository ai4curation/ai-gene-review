- id: PMID:41932883
  title: A single viral enzyme drives tRNA-dependent hypermodification of DNA at adenine.
  findings:
  - statement: Mom is a tRNAGly-dependent DNA aminoacyltransferase that transfers glycine from charged tRNAGly to the N6 position of adenine in dsDNA and catalyzes a subsequent O2-dependent on-base rearrangement to form N6-carbamoylmethyladenine (6-NcmdA), protecting viral DNA from host restriction endonucleases.
    supporting_text: In the first step, we show that Mu-encoded Mom enzyme catalyzes the formation of 6-NcmdA by transferring glycine from charged tRNAGly to the N6 position of adenine within double-stranded DNA. We uncover a second step where the glycyl-dA intermediate undergoes an on-base rearrangement to form 6-NcmdA.
  - statement: Mom-mediated installation of 6-NcmdA during late stages of Mu infection confers resistance to host restriction endonucleases.
    supporting_text: These foundational studies on Mu also identified a gene, mom (modification of Mu), necessary for the installation of 6-NcmdA during late stages of Mu infection
