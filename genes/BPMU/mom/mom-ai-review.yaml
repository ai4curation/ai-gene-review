suggested_questions:
- question: Does the Fe2+/Fe3+ ion bound by Mom participate directly in activating molecular oxygen (O2) during the second-step oxidative rearrangement of N6-glycyl-dA (6-gdA) to N6-carbamoylmethyl-dA (6-NcmdA)?
  experts:
  - Valakunja Nagaraja
  - Yael David
  - Chuan He
suggested_experiments:
- description: Perform EPR spectroscopy and anaerobic/aerobic single-turnover kinetics of Fe-loaded versus apo-Mom with synthetic 6-gdA-containing dsDNA duplexes and 18O2.
  hypothesis: Bound Fe2+ coordinates O2 or stabilizes the radical/peroxy intermediate during the oxidative rearrangement of 6-gdA to 6-NcmdA.
