id: P06018
gene_symbol: mom
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Methylcarbamoylase mom (Mom) is a 241-amino-acid GNAT-superfamily tRNA-dependent DNA aminoacyltransferase of Escherichia phage Mu that acts in the host cell cytoplasm to hypermodify adenine residues in double-stranded DNA to N6-carbamoylmethyladenine (6-NcmdA). Mom hijacks host charged glycyl-tRNAGly to transfer a glycyl group onto the N6 position of adenine within 5'-C/G-A-G/C-N-Py-3' sequences, forming an N6-glycyl-deoxyadenosine intermediate that subsequently undergoes an O2-dependent on-base rearrangement to 6-NcmdA, thereby rendering the viral genome resistant to cleavage by a broad range of host restriction endonucleases.
