  findings:
  - statement: Ner is an 8 kDa lambda Cro-like negative regulator of the phage Mu early operon that binds a specific DNA operator containing two 12-bp sites.
    supporting_text: The Ner protein of bacteriophage Mu acts as a lambda cro-like negative regulator of the phage's early (transposase) operon. Using the band retardation assay to monitor ner-operator-specific DNA-binding activity, the 8 kDa Ner protein was purified to homogeneity. DNase I footprinting revealed that the purified protein bound and protected a specific DNA operator that contains two 12 bp sites
