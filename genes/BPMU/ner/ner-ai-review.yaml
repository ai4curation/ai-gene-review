suggested_questions:
- question: How do two monomeric Ner molecules cooperate across the 6-bp spacer of the ner operator to differentially modulate RNA polymerase recruitment at PcM versus Pe?
  experts:
  - George Chaconas
  - Michael S. DuBow
suggested_experiments:
- description: Perform single-molecule fluorescence colocalization and footprinting of Ner and E. coli sigma70-RNAP on templates containing both Pe and PcM promoters across physiological Ner concentrations.
  hypothesis: High-affinity binding of Ner to one half-site sterically blocks RNAP binding at PcM, whereas occupancy of both 12-bp half-sites at higher Ner concentrations is required to attenuate Pe transcription.
