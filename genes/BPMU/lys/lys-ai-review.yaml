- id: PMID:35471081
  title: Endolysin Regulation in Phage Mu Lysis.
  findings:
  - statement: >-
      gp22 (lys) is a signal-anchor-release (SAR) endolysin whose release from the
      host inner membrane into the periplasm is restrained by basic residues Lys6
      and Lys7 in its cytoplasmic tail and facilitated by the membrane-tethered
      releasin gp25 (Mup25), while Glu37 is essential for its catalytic muralytic
      activity.
    supporting_text: >-
      Here, we demonstrate that gp22 is a signal-anchor-release (SAR) endolysin and identify gp23 and gp23.1 as two-component spanin subunits. However, we find that Mu lacks a holin and instead encodes a membrane-tethered cytoplasmic protein, gp25, which is required for the release of the SAR endolysin.
- id: file:BPMU/lys/lys-uniprot.txt
  title: UniProtKB record for Q9T1X2 (ENLYS_BPMU / lys)
  findings:
  - statement: >-
      UniProtKB curators classify gp22 as a glycoside hydrolase family 24 (GH24)
      SAR-endolysin with lysozyme activity (EC 3.2.1.17) that is tethered to the
      host inner membrane and released into the periplasm to degrade peptidoglycan.
    supporting_text: >-
      Signal-arrest-release (SAR) endolysin with lysozyme activity that degrades host peptidoglycans and participates with the releasin and spanin proteins in the sequential events which lead to programmed host cell lysis releasing the mature viral particles. The SAR-endolysin is released by the releasin protein into the periplasm, where it breaks down the peptidoglycan layer.
suggested_questions:
- question: >-
    Does gp22 undergo intramolecular disulfide isomerization upon release from the
    host inner membrane into the periplasm, analogous to phage P1 Lyz, or does its
    activation rely solely on conformational liberation of Glu37 and Asp46?
- question: >-
    Does the N-terminal cytoplasmic tail of gp22 (containing Lys6 and Lys7) interact
    directly with the transmembrane or cytoplasmic domain of the releasin gp25 to
    neutralize the electrostatic barrier to SAR extraction?
suggested_experiments:
- description: >-
    Perform periplasmic thiol-trapping (PEG-maleimide) and high-resolution structural
    comparison of membrane-bound versus soluble periplasmic gp22 to determine the
    structural basis of conformational activation upon SAR domain extraction.
- description: >-
    Carry out site-specific photo-crosslinking between gp22 variants at positions
    1-24 and gp25 in Escherichia coli inner membrane vesicles to test whether
    releasin-mediated SAR release involves direct transmembrane helix pairing.
