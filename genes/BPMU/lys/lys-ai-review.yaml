  label: Escherichia phage Mu
description: >-
  Signal-anchor-release (SAR) endolysin gp22 (Mup22) of Escherichia phage Mu, a
  glycoside hydrolase family 24 (GH24) muramidase (EC 3.2.1.17) that degrades the
  host peptidoglycan cell wall during programmed bacteriophage lysis. Secreted via
  the host Sec system as an inactive type II inner-membrane-tethered enzyme with an
  N-terminal transmembrane signal-anchor (residues 1-24) and a short cytoplasmic
  positively charged tail (Lys6, Lys7) that retards spontaneous membrane escape.
  Triggered by the phage-encoded membrane-tethered releasin protein gp25 (Mup25),
  gp22 is released from the host inner membrane into the periplasmic space, where
  it refolds into an active catalytic conformation utilizing catalytic residues
  Glu37 and Asp46 to hydrolyze beta-1,4-glycosidic linkages between N-acetylmuramic
  acid and N-acetyl-D-glucosamine in host peptidoglycan, acting upstream of the
  gp23/gp23.1 two-component spanin complex to achieve host cell cytolysis and
  progeny virion release.
