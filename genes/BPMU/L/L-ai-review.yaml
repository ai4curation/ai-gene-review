    full_text_unavailable: true
    findings:
      - statement: Bacteriophages with contractile tails undergo a large syringe-like conformational change upon attachment to the host cell.
        supporting_text: Bacteriophages with contractile tails epitomize the concepts of "virus" and "phage" for many because the tails of these phages undergo a large conformational change - resembling the action of a syringe - upon the attachment to the host cell.
