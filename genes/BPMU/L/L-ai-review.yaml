suggested_questions:
  - question: How does the simplified two-domain architecture of phage Mu tail sheath protein L store and release comparable contractile energy to three- and four-domain myophage sheath proteins such as T4 gp18?
suggested_experiments:
  - description: Compare high-resolution cryo-EM structures of phage Mu tail sheath protein L in the pre-contraction extended state and post-contraction state to map inter-subunit beta-sheet augmentation.
    hypothesis: Inter-ring beta-strand swapping between adjacent hexameric layers of gpL drives rigid-body rotation and axial compaction of the sheath without requiring an accessory outer domain.
