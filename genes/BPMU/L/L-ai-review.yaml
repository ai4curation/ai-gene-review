taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Contractile tail sheath protein (gpL / Mup39) of bacteriophage Mu. Homomultimers of gpL polymerize into an extended helical sheath surrounding the central baseplate-tail tube complex during tail morphogenesis; disruption of gene L abolishes tail synthesis. Upon attachment of the virion to the bacterial host cell, the sheath undergoes a large-scale conformational contraction that drives the inner tail tube through the host cell envelope to mediate viral genome ejection.
