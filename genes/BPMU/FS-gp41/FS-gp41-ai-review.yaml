id: P0DJY4
gene_symbol: FS-gp41
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Extended tail assembly chaperone isoform (FS-gp41) of bacteriophage Mu produced by
  a programmed -2 ribosomal frameshift at codon 136 during translation of the Mup41
  transcript. Sharing its N-terminal 136 residues with gp41 (P79680) and bearing a
  distinct C-terminal extension (analogous to bacteriophage lambda gpGT), FS-gp41
  acts together with gp41 in the host cell cytoplasm to promote assembly of the tape
  measure protein (gp42) and tail tube protein (gpM / gp40) into a functional tail
  shaft.
