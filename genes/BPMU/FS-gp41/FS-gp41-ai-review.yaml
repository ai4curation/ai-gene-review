suggested_questions:
- question: >-
    Does the unique C-terminal domain of FS-gp41 (residues 137-188) directly bind
    monomeric tail tube protein M (Mup40) while the shared N-terminal gp41 domain
    binds the tape measure protein gp42 (Mup42)?
suggested_experiments:
- description: >-
    Perform pull-down and surface plasmon resonance binding assays using isolated
    C-terminal fragment FS-gp41(137-188) against purified tail tube protein M and
    tape measure protein gp42.
  hypothesis: >-
    The frameshift-specific C-terminal extension of FS-gp41 recruits tail tube
    protein M subunits onto the gp41-coated tape measure protein scaffold.
