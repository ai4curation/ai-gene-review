  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0688
  review:
    summary: >-
      Artifact of UniProt keyword KW-0688 (Ribosomal frameshifting) mapping; FS-gp41
      is the protein product synthesized via -2 ribosomal frameshifting on the Mup41
      mRNA, not a factor that performs or regulates translational frameshifting.
    action: REMOVE
    reason: >-
      A gene product is involved_in a biological process only if the protein itself
      executes or regulates part of that process. FS-gp41 is the translation product
      generated when host ribosomes shift reading frame by -2 nucleotides on the
      Mup41 mRNA; once synthesized, FS-gp41 functions as a tail assembly chaperone
      and does not participate in translational frameshifting.
    supported_by:
    - reference_id: PMID:15469818
      supporting_text: A programmed translational frameshift similar to frameshifts in retroviral gag-pol genes and bacterial insertion elements was found to be strongly conserved in tail assembly genes of dsDNA phages and to be independent of sequence similarities. ... Clear evidence was also found for an unusual but analogous -2 frameshift in phage Mu.
    - reference_id: file:BPMU/FS-gp41/FS-gp41-uniprot.txt
      supporting_text: 'MISCELLANEOUS: [Isoform Tail assembly chaperone FS-gp41]: Produced by -2 ribosomal frameshifting.'
