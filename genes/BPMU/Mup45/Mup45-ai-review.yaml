suggested_questions:
  - question: Why is Mup45 dispensable for assembling the recombinant Mup43/44/46/47/48 baseplate complex in vitro (PMID:27555589) yet strictly required for tail synthesis in amber mutant lysates in vivo?
suggested_experiments:
  - description: Compare baseplate-tail tube polymerization in vitro and in vivo in the presence and absence of Mup45 and the tail tube initiator proteins.
    hypothesis: In vivo, Mup45 stabilizes the central hub-spike complex against premature dissociation or proteolysis prior to tail tube polymerization.
