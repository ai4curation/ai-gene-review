id: Q9T1V4
gene_symbol: Mup45
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Baseplate puncturing device gp45 (Mup45, also known as gpQ or baseplate spike BS) of bacteriophage Mu that forms the homotrimeric central needle-like spike at the distal tip of the contractile tail baseplate. Its C-terminal triple beta-helix tip coordinates one calcium ion, one iron cation, and one chloride ion per trimer, where the bound Ca(2+) ion is required for interaction with the host cell membrane. During infection, the gp45 spike acts as the distal plug of the tail tube channel and punctures the host cell envelope upon tail sheath contraction to enable tail tube insertion and viral DNA ejection.
