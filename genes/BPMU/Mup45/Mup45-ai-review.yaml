    original_reference_id: GO_REF:0000043
    review:
      summary: Mup45 is a conserved baseplate spike component whose disruption by amber mutation abolishes tail synthesis in vivo.
      action: ACCEPT
      reason: Although Mup45 associates weakly with the core Mup43/44/46/47/48 baseplate complex in vitro (PMID:27555589), amber mutant analysis in vivo demonstrates that gene 45 is required for phage Mu tail morphogenesis.
      supported_by:
