    review:
      summary: The C-terminal needle-like tip of the Mup45 homotrimer binds one Ca(2+) ion and one Fe cation per trimer along its threefold symmetry axis.
      action: ACCEPT
      reason: High-resolution X-ray crystal structures (PDB:3VTO) and mutagenesis of Asp-188 show that Mup45 coordinates both Ca(2+) and Fe cations at the spike tip, and that Ca(2+) binding is essential for host membrane interaction.
