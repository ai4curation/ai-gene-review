          supporting_text: '-!- DISRUPTION PHENOTYPE: No tail is synthesized.'
        - reference_id: PMID:27555589
          supporting_text: Mup45, the baseplate spike protein, BS, is conserved, but was not required for assembly of the Mu baseplate; it associated weakly with the baseplate and could only be detected when protein cross-linker was added.
