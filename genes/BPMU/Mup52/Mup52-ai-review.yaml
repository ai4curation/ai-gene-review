    review:
      summary: Tail fiber protein S' (Mup52) binds primary cell-surface receptors on susceptible bacterial hosts such as Citrobacter freundii to mediate virion attachment.
      action: ACCEPT
      reason: Recognition and binding of host cell-surface adhesion receptors by the C-terminal receptor-binding domain of S' is its core biological role in virion attachment and host range determination.
      supported_by:
