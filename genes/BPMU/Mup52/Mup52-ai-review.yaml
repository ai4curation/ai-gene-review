      label: viral tropism switching
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: Protein S' (Mup52) is the G(-)-orientation tail fiber effector generated by Gin-mediated inversion of the 3-kb G-segment, switching phage Mu host specificity (e.g., to Citrobacter freundii).
      action: KEEP_AS_NON_CORE
      reason: While S' is the alternate receptor-binding tail fiber produced upon G-segment inversion to switch host range, the site-specific DNA inversion reaction itself is catalyzed by serine recombinase Gin.
      supported_by:
        - reference_id: file:BPMU/Mup52/Mup52-uniprot.txt
          supporting_text: '-!- MISCELLANEOUS: The orientation of the G segment is defined as G+ and G-. G+ orientation provides S-U fibers whereas G- provides S''-U'' fibers. S-U and S''-U'' dont have the same host range (e.g. respectively E.coli and C.freundii).'
      additional_reference_ids:
        - file:BPMU/Mup52/Mup52-uniprot.txt
    extensions:
      - predicate: involved_in
    supporting_entities:
