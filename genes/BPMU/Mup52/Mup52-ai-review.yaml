id: P0DJY6
gene_symbol: Mup52
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Receptor-binding tail fiber protein S' (Mup52/gp52/gpS') of bacteriophage Mu expressed when the invertible 3-kb G-segment is in the G(-) orientation. Inversion of the G-segment by serine recombinase Gin fuses the constant 5' region of gene S (encoding the N-terminal baseplate-binding domain) to the variable 3' coding region of S' (Mup52), producing an alternate homotrimeric tail fiber with a C-terminal receptor-binding domain (PDB:8JU3) that recognizes cell-surface receptors on hosts such as Citrobacter freundii. Its folding into soluble tail fibers requires the cognate chaperone U' (Mup51/gp51), although U (Mup50/gp50) can also fold S' in vitro.
