  - id: PMID:31504613
    title: Observation of unexpected molecular binding activity for Mu phage tail fibre chaperones.
    findings:
      - statement: Tail fiber subunit gp52 (S'/Mup52) is folded into soluble tail fibers by either its cognate chaperone gp51 (U'/Mup51) or the alternate chaperone gp50 (U/Mup50).
        supporting_text: However, heterologous overexpression results for gp49 or gp52 (tail fibre subunit) together with gp51 and gp50, respectively, were also effective in producing soluble Mu tail fibres. Moreover, we successfully purified non-native gp49-gp51 and gp52-gp50 complexes. These facts showed that gp50 and gp51 were fungible and functional for both gp49 and gp52 each other.
  - id: file:BPMU/Mup52/Mup52-uniprot.txt
    title: UniProtKB entry for Mup52 (P0DJY6)
    findings:
      - statement: Protein S' (Mup52) is the G(-)-orientation tail fiber receptor-binding subunit that determines phage Mu host specificity for Citrobacter freundii and related bacteria.
        supporting_text: '-!- FUNCTION: Component of the tail fiber that acts as a receptor binding protein. Binds to the primary receptor, thereby determining the host range. Two alternate tail fiber S and S'' proteins are encoded extending the host range of the virus.'
suggested_questions:
  - question: Which specific glycosidic linkage in the lipopolysaccharide outer core of Citrobacter freundii and Escherichia coli B is recognized by the C-terminal beta-helical receptor-binding domain of S' (Mup52, PDB:8JU3)?
suggested_experiments:
  - description: Co-crystallize or perform glycan-array and isothermal titration calorimetry (ITC) binding assays of purified S' (gp52) trimers with defined LPS core oligosaccharides from C. freundii, Shigella sonnei, and E. coli B.
    hypothesis: Surface-exposed aromatic and polar loops along the C-terminal intertwined beta-prism of S' (PDB:8JU3) form a carbohydrate-binding groove selective for alpha-1,2-linked glucose residues in the G(-) host LPS outer core.
