id: Q9T1V2
gene_symbol: Mup47
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Baseplate wedge protein gp47 (Mup47, also known as gpW or BW2) of bacteriophage Mu that forms the core scaffold of the peripheral baseplate wedge. During tail morphogenesis, Mup47 associates directly with Mup48 (BW3) and subsequently recruits Mup46 (BW1) to form three dimeric baseplate wedges (six copies of Mup47 per baseplate) that surround the central Mup43-Mup44 (N-P) hub at a 3:3:6:6:6 stoichiometry.
