suggested_questions:
- question: >-
    How do the N- and C-terminal domains of Mup47 (BW2) mediate the oligomerization of the baseplate wedge ring around the central Mup44 hub?
suggested_experiments:
- description: >-
    Perform structure-guided mutagenesis of the Mup47-Mup47 ring contacts seen in PDB:9KI1 and assay wedge dimerization and hub docking by size-exclusion chromatography and negative-stain EM.
  hypothesis: >-
    The conserved Baseplate_J Trifoil/barrel domain of Mup47 forms the continuous circumferential ring that locks the three dimeric wedges around the central hub.
