  review:
    summary: >-
      Mup47 (BW2) initiates baseplate wedge assembly by binding Mup48 (BW3) and recruiting Mup46 (BW1), which is essential for phage Mu baseplate and tail morphogenesis.
    action: ACCEPT
    reason: >-
      Biochemical reconstitution in PMID:27555589 and amber mutant phenotypes demonstrate that Mup47 is strictly required for baseplate wedge formation and tail synthesis.
    supported_by:
    - reference_id: PMID:27555589
      supporting_text: >-
        Assembly of the baseplate wedge occurs through stepwise interaction of BW2 with BW3, followed by subsequent addition of BW1. BH1 and BH2 must assemble to form the central hub of the baseplate before binding to the baseplate wedges.
