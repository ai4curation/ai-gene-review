  review:
    summary: >-
      Mup47 (BW2) is a core structural component of the three dimeric baseplate wedges of the phage Mu tail baseplate.
    action: ACCEPT
    reason: >-
      Biochemical complex isolation, negative-stain EM (PMID:27555589), and cryo-EM reconstruction (PDB:9KI1) establish Mup47 as an integral subunit of the phage Mu tail baseplate.
    supported_by:
    - reference_id: PMID:27555589
      supporting_text: >-
        Because Mup44 forms a trimer and three copies of its homolog, gp27, are present in the phage T4 baseplate ( 12 ), we conclude that the Mu baseplate is composed of Mup43/44/46/47/48 at a 3:3:6:6:6 ratio. Thus, a trimeric hub composed of Mup43 and Mup44 assembles with three dimeric Mup46/47/48 baseplate wedges to form the baseplate
    - reference_id: file:BPMU/Mup47/Mup47-uniprot.txt
