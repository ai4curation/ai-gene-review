suggested_questions:
  - question: How does the conformational rearrangement of the Mup46 (BW1) ring couple baseplate wedge expansion to initiation of tail sheath (gpL/Mup39) contraction?
suggested_experiments:
  - description: Mutagenize the interface between Mup46 and the proximal ring of the tail sheath (Mup39) based on the cryo-EM structure (PDB:9KI1) and assay tail sheath polymerization and contraction in vitro.
    hypothesis: Specific inter-subunit salt bridges between Mup46 and Mup39 nucleate sheath polymerization during assembly and propagate the contraction trigger from the baseplate wedges.
