id: Q9T1V3
gene_symbol: Mup46
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Baseplate wedge protein gp46 (Mup46, also known as gpV or BW1) of bacteriophage Mu that serves as an essential structural subunit of the contractile tail baseplate. During baseplate morphogenesis, Mup46 binds to the pre-formed Mup47-Mup48 (BW2-BW3) subcomplex to complete the baseplate wedge, and three dimeric Mup46-Mup47-Mup48 wedges then assemble around the central Mup43-Mup44 (N-P) hub at a 3:3:6:6:6 stoichiometry to nucleate tail assembly.
