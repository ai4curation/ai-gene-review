      label: viral tail assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: Mup46 (BW1) is required to complete the Mup46-Mup47-Mup48 baseplate wedge and recruit it to the central Mup43-Mup44 hub during phage Mu tail assembly.
      action: ACCEPT
      reason: Stepwise biochemical reconstitution in PMID:27555589 and amber mutant phenotypes demonstrate that Mup46 is strictly required for baseplate and tail assembly.
      supported_by:
        - reference_id: PMID:27555589
          supporting_text: Assembly of the baseplate wedge occurs through stepwise interaction of BW2 with BW3, followed by subsequent addition of BW1. BH1 and BH2 must assemble to form the central hub of the baseplate before binding to the baseplate wedges.
        - reference_id: file:BPMU/Mup46/Mup46-uniprot.txt
          supporting_text: '-!- DISRUPTION PHENOTYPE: No tail is synthesized.'
      additional_reference_ids:
        - PMID:27555589
        - file:BPMU/Mup46/Mup46-uniprot.txt
