core_functions:
  - description: Serves as an essential structural subunit (BW1) of the phage Mu baseplate wedge, binding the Mup47-Mup48 subcomplex to complete the three dimeric wedges that assemble around the Mup43-Mup44 central hub and connect the baseplate to the tail sheath during viral tail assembly.
    molecular_function:
      id: GO:0039660
      label: structural constituent of virion
    directly_involved_in:
      - id: GO:0098003
        label: viral tail assembly
    locations:
      - id: GO:0030430
        label: host cell cytoplasm
    supported_by:
      - reference_id: PMID:27555589
        supporting_text: Assembly of the baseplate wedge occurs through stepwise interaction of BW2 with BW3, followed by subsequent addition of BW1. BH1 and BH2 must assemble to form the central hub of the baseplate before binding to the baseplate wedges.
      - reference_id: file:BPMU/Mup46/Mup46-uniprot.txt
        supporting_text: '-!- FUNCTION: Component of the baseplate. Probable connector between the central and peripheral parts of the baseplate. Probably involved in tail assembly.'
