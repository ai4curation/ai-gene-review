    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: Six copies of Mup46 (BW1) are incorporated per phage Mu baseplate as part of the three dimeric Mup46-Mup47-Mup48 baseplate wedges.
      action: ACCEPT
      reason: Biochemical complex isolation, negative-stain EM (PMID:27555589), and cryo-EM reconstruction (PDB:9KI1) establish Mup46 as a core subunit of the phage Mu tail baseplate.
      supported_by:
        - reference_id: PMID:27555589
          supporting_text: Because Mup44 forms a trimer and three copies of its homolog, gp27, are present in the phage T4 baseplate ( 12 ), we conclude that the Mu baseplate is composed of Mup43/44/46/47/48 at a 3:3:6:6:6 ratio. Thus, a trimeric hub composed of Mup43 and Mup44 assembles with three dimeric Mup46/47/48 baseplate wedges to form the baseplate
        - reference_id: file:BPMU/Mup46/Mup46-uniprot.txt
          supporting_text: '-!- SUBUNIT: Part of a complex composed of three DNA circularization protein N, three baseplate hub protein gp44 and three sub-complex wedge (made of two copies of each baseplate protein gp46, gp47 and gp48) that forms the baseplate.'
      additional_reference_ids:
