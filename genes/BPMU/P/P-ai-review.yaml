    summary: >-
      Baseplate hub protein P (Mup44/BH2) assembles with Mup43 (N/BH1) to form the central hub required for recruiting the baseplate wedges and initiating tail polymerization.
    action: ACCEPT
    reason: >-
      Reconstitution of the phage Mu baseplate in PMID:27555589 and amber mutant phenotypes demonstrate that Mup44 (P) is an essential core component of baseplate and tail assembly.
