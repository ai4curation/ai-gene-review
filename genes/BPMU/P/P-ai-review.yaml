id: P08558
gene_symbol: P
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Baseplate hub protein gp44 (Mup44, also designated BH2) of bacteriophage Mu that forms the central cylindrical hub of the contractile tail baseplate. Three copies of P assemble into a ring-shaped trimer with an inner diameter of approximately 25 Angstroms together with three copies of DNA circularization protein N (Mup43/BH1), nucleating the recruitment of three dimeric Mup46-Mup47-Mup48 baseplate wedges during tail morphogenesis and forming a continuous channel extension of the tail tube through which the viral genome is ejected into the host cell.
