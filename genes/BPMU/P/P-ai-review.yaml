  title: UniProtKB entry for P (P08558)
  findings:
  - statement: >-
      P (gp44) forms a ring-shaped trimer with a 25-Angstrom inner diameter that acts as the central hub of the baseplate and a conduit for DNA release during ejection.
    supporting_text: >-
      -!- SUBUNIT: Heterotrimer of one uncleaved (42 kDa) and two cleaved (40 kDa) forms. Forms a hub-like structure with an inner diameter of 25 Angstroms through which DNA can presumably pass during infection.
suggested_questions:
- question: >-
    What is the functional significance and mechanism of the proteolytic processing that generates the heterotrimer of one uncleaved (42 kDa) and two cleaved (40 kDa) Mup44 subunits observed in crystal structures?
suggested_experiments:
- description: >-
    Map the cleavage site of the 40 kDa Mup44 species by mass spectrometry and test non-cleavable site-directed mutants in baseplate reconstitution and plaque formation assays.
  hypothesis: >-
    Asymmetric proteolytic processing or spontaneous cleavage of two of the three Mup44 subunits facilitates asymmetric docking with the trimeric Mup43 (N) pilot protein complex.
