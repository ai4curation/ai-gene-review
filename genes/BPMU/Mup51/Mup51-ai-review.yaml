    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  review:
    summary: >-
      Tail fiber assembly protein U' (gp51) assists the folding and solubilization of phage Mu tail fiber subunits in the host cytoplasm.
    action: ACCEPT
    reason: >-
      Heterologous co-expression and complex purification in PMID:31504613 demonstrate that gp51 (U') acts as a molecular chaperone that folds both its cognate tail fiber subunit gp52 (S') and the alternate subunit gp49 (S) into soluble fibers.
    supported_by:
    - reference_id: PMID:31504613
      supporting_text: >-
        However, heterologous overexpression results for gp49 or gp52 (tail fibre subunit) together with gp51 and gp50, respectively, were also effective in producing soluble Mu tail fibres. Moreover, we successfully purified non-native gp49-gp51 and gp52-gp50 complexes. These facts showed that gp50 and gp51 were fungible and functional for both gp49 and gp52 each other.
    additional_reference_ids:
    - PMID:31504613
