suggested_questions:
- question: >-
    Which structural residues in the N-terminal conserved domain versus the C-terminal variable region of U' (Mup51) mediate its promiscuous binding to both S' (gp52) and S (gp49) tail fiber subunits?
suggested_experiments:
- description: >-
    Perform hydrogen-deuterium exchange mass spectrometry (HDX-MS) or X-ray crystallography on both native gp52-gp51 and non-native gp49-gp51 complexes.
  hypothesis: >-
    The conserved N-terminal alpha-helical bundle of U' (shared with U) mediates cross-talk binding to the tail fiber beta-helix, while the C-terminal region contacts the distal tip.
