id: Q9T1X7
gene_symbol: Mup11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 176-amino-acid early protein gp11 (Mup11; 19.6 kDa) of
  Escherichia phage Mu, encoded in the semi-essential (SE) region of the early Pe
  operon between gam (Mup10) and Mup12. Contains a conserved C-terminal Gp11_C
  domain (Pfam PF25754 / InterPro IPR057850) and lacks predicted signal peptides or
  transmembrane helices. Expressed in the host bacterial cytoplasm during the early
  phase of the viral replicative cycle under the transcriptional control of Repc and
  Ner; its specific biochemical activity and role in phage Mu infection remain
  unknown.
