suggested_questions:
- question: >-
    What is the molecular function of the conserved C-terminal Gp11_C domain
    (PF25754) in Mup11, and does it interact with host replication or recombination
    machinery during early lytic development?
suggested_experiments:
- description: >-
    Express and purify recombinant Mup11 to determine the structure of its Gp11_C
    domain and perform pull-down mass spectrometry from phage Mu-infected E. coli
    lysates to identify host or viral interaction partners.
