  findings:
  - statement: >-
      Gene I/Z encodes both the full-length 361-aa Protease I (gp32, peptidase U35
      family) and the nested in-frame 183-aa internal Scaffold protein Z (gp33,
      residues 179-361); Protease I forms an early 25S initiator complex with the
      portal protein and cleaves the portal protein to mature the procapsid, while
      Scaffold protein Z guides assembly of major capsid protein T into immature
      proheads.
    supporting_text: >-
      Protease I is involved in virion assembly and maturation. Protease I cleaves the portal protein to yield mature procapsids competent for DNA packaging (Probable). Isoform scaffold protein Z probably helps the capsid proteins to assemble into a functional capsid (Probable).
suggested_questions:
- question: >-
    What is the catalytic mechanism and active-site triad/dyad of the peptidase U35
    family N-terminal protease domain of phage Mu Protease I (residues 1-178), and
    does Protease I also autoproteolytically degrade itself and Scaffold protein Z
    upon prohead expansion?
suggested_experiments:
- description: >-
    Determine the crystal or cryo-EM structure of the N-terminal peptidase U35
    domain of gp32 (residues 1-178) and perform active-site mutagenesis to identify
    its catalytic residues and substrate cleavage motif in portal protein H and
    scaffold protein Z.
