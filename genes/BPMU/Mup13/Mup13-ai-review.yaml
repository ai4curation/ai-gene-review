id: Q38490
gene_symbol: Mup13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: >-
  Uncharacterized 60-amino-acid early protein gp13 (Mup13, also designated E14; 6.7
  kDa) of Escherichia phage Mu, encoded in the semi-essential (SE) region of the
  early Pe operon between Mup12 and Mup14. Contains eight cysteine residues arranged
  in four canonical CxxC motifs (CPTC at residues 8-11, CPHC at residues 21-24,
  CNHC at residues 32-35, and CMNC at residues 49-52) suggestive of a dual
  zinc-ribbon fold, and lacks predicted signal peptides or transmembrane helices.
  Expressed in the host bacterial cytoplasm during the early phase of the viral
  replicative cycle under the transcriptional control of Repc and Ner; its exact
  molecular function remains unknown.
