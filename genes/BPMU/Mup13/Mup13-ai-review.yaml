suggested_questions:
- question: >-
    Do the four CxxC motifs (CPTC, CPHC, CNHC, CMNC) of gp13 coordinate two Zn2+
    ions in a binuclear zinc-ribbon fold, and does gp13 bind nucleic acids or
    modulate host transcription/translation machinery?
suggested_experiments:
- description: >-
    Purify recombinant Mup13 (gp13) to quantify bound zinc ions by atomic absorption
    or ICP-MS, solve its solution NMR structure, and test nucleic-acid binding by
    electrophoretic mobility shift assays (EMSAs).
