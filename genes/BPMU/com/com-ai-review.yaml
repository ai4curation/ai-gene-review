id: Q38621
gene_symbol: com
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681603
  label: Escherichia phage Mu
description: Translational activator com (Com) is a 62-amino-acid Cys4 zinc-finger RNA-binding protein of Escherichia phage Mu that acts in the host cell cytoplasm to positively regulate translation of the late mom DNA-modification mRNA. Coordinating a single structural Zn2+ ion per monomer, Com binds specifically to the 5' translation initiation region of the bicistronic com-mom transcript and destabilizes an inhibitory RNA stem-loop structure, thereby exposing the mom Shine-Dalgarno sequence and start codon for ribosome recruitment.
