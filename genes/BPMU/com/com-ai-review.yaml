suggested_questions:
- question: Does Com remain bound to the com-mom mRNA after 30S ribosomal subunit recruitment, or is it displaced during translation initiation complex assembly?
  experts:
  - Regine Kahmann
  - Stanley Hattman
suggested_experiments:
- description: Determine the NMR or cryo-EM structure of the Zn2+-bound Com protein in complex with the full-length mom translation initiation stem-loop RNA.
  hypothesis: Binding of Com to the internal loop of the mom RNA hairpin induces local base-pair melting that liberates the downstream Shine-Dalgarno sequence and AUG start codon.
