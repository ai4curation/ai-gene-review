id: Q50964
gene_symbol: fbpA
product_type: PROTEIN
taxon:
  id: NCBITaxon:485
  label: Neisseria gonorrhoeae
description: >-
  FbpA is the periplasmic solute-binding protein of the FbpABC ABC importer of
  Neisseria gonorrhoeae and the major iron-regulated protein of the gonococcus.
  After TbpAB/LbpAB strip ferric iron from host transferrin or lactoferrin at
  the outer membrane, FbpA captures the released Fe(3+) in the periplasm and
  shuttles it to the FbpB permease for FbpC-powered, ATP-dependent transport
  into the cytosol. It is a structural and functional analogue of a single
  transferrin lobe: a bilobed protein that binds one ferric ion per molecule
  with high affinity through two tyrosines, one histidine and one glutamate
  together with an exchangeable synergistic anion, normally phosphate. The
  identity of that anion sets both the iron affinity and the reduction
  potential of the holo-protein, so anion exchange acts as a gate on iron
  release at the inner membrane. Beyond ferric iron, the exposed di-tyrosyl
  motif at the base of the open interdomain cleft nucleates multinuclear
  oxo-metal clusters of other hard, highly charged cations, including Hf(IV)
  and Cu(II), in vitro.
