  title: TreeGrafter-generated GO annotations
  findings: []
- id: file:NEIGO/fbpA/fbpA-uniprot.txt
  title: UniProtKB entry Q50964 (Q50964_NEIGO), Neisseria gonorrhoeae FbpA
  findings:
  - statement: The entry is unreviewed (TrEMBL) and has no curated CC FUNCTION or
      CC SUBCELLULAR LOCATION line; its only CC statement is an ARBA-only family
      similarity note, and all four protein names are submitter-derived
      (ECO:0000313). Protein existence is nevertheless level 1, and two PDB entries
      are cross-referenced.
  - statement: SignalP predicts a cleaved signal peptide 1-22 with the mature chain
      23-331, so precursor numbering in this record runs 22 residues ahead of the
      mature-protein numbering used throughout the FbpA literature.
  - statement: Four ferric-iron binding residues are recorded at precursor positions
      31, 79, 217 and 218, each with both PIRSR002825 site-rule evidence and
      structure-derived ECO:0007829 evidence from PDB 1D9Y; these are His9, Glu57,
      Tyr195 and Tyr196 of the mature protein.
    record_section: ["FT:BINDING"]
    supporting_text: "FT   BINDING         218"
- id: PMID:2110241
  title: Molecular cloning and characterization of the structural gene for the major
    iron-regulated protein expressed by Neisseria gonorrhoeae.
  findings:
  - statement: Cloning and sequencing of the fbp gene of N. gonorrhoeae strain F62,
      the source of the Q50964 sequence; a single genomic copy, and an inferred role
      in iron acquisition.
    supporting_text: These results complement
      the biochemical characterization of the Fbp expressed by gonococci and further
      suggest that it has a role in iron-acquisition.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; this is the reference cited by EMBL AAB63559.1,
      the entry from which Q50964's sequence and FbpA gene name derive. It
      establishes gene identity and iron regulation, not a molecular function.
- id: PMID:7934822
  title: The ferric iron-binding protein of pathogenic Neisseria spp. functions as
    a periplasmic transport protein in iron acquisition from human transferrin.
  findings:
  - statement: Pulse-chase experiments show Fbp is a transient intermediate in iron
      acquisition from human transferrin, as expected of a periplasmic binding
      protein in an active transport system.
    supporting_text: Predictive of a
      periplasmic-binding protein, which functions in the high-affinity acquisition
      of
      iron, is that Fbp is a transient participant in the process of iron acquisition
      from human transferrin.
  - statement: Fbp acts as the periplasmic-binding-protein component of a
      receptor-mediated high-affinity iron transport process.
    supporting_text: The results of this investigation provide evidence that
      Fbp participates in this process as a functional analogue of a Gram-negative
      periplasmic-binding protein component, which operates as a part of a general
      active transport process for the receptor-mediated, high-affinity transport
      of
      iron from human transferrin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Abstract-only in the cache; the quoted statements
      are the paper's own conclusions and are what the periplasmic-location and
      import-participation calls rest on.
- id: PMID:7947682
  title: Coordination of iron by the ferric iron-binding protein of pathogenic
    Neisseria is homologous to the transferrins.
  findings:
  - statement: Purified gonococcal Fbp reversibly binds one ferric ion per molecule
      with high affinity.
    supporting_text: Fbp reversibly binds a single ferric ion per molecule of protein
      with
      high affinity.
  - statement: Tyrosine- and histidine-specific chemical modification implicates two
      to three Tyr and one of the six His residues in iron binding, matching the
      transferrin ligand set.
    supporting_text: Chemical modification of purified Fbp in the presence and
      absence of iron using the Tyr-specific modifier tetranitromethane demonstrates
      that between two and three Tyr residues are implicated in iron binding.
  - statement: Like the transferrins, Fbp requires a synergistic anion for efficient
      iron coordination; bicarbonate serves in these assays.
    supporting_text: In addition, like the transferrins, a bicarbonate anion is
      required for the
      efficient coordination of iron by Fbp.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. This is the primary direct-assay basis for the
      proposed GO:0008199 ferric iron binding annotation.
- id: PMID:8606197
  title: The fbpABC locus of Neisseria gonorrhoeae functions in the periplasm-to-cytosol
    transport of iron.
  findings:
  - statement: fbpA is the first gene of a three-gene operon whose other members
      encode a permease (FbpB) and a nucleotide-binding protein (FbpC).
    supporting_text: 'We have determined that the DNA sequence downstream of the
      well-characterized
      gonococcal fbp gene contains two open reading frames: one designated fbpB,
      which
      encodes a protein proposed to function as a cytoplasmic permease, and one
      designated fbpC, which encodes a protein proposed to function as a
      nucleotide-binding protein.'
  - statement: The operon has the hallmarks of an ABC transporter and is homologous
      to the Serratia sfu and Haemophilus hit iron transport systems. The abstract
      contains the typographical variant "fpbABC".
    supporting_text: The fpbABC operon composes an iron transport system
      that is homologous to the sfu and hit operons previously reported for Serratia
      marcescens and Haemophilus influenzae, respectively, and displays elements
      characteristic of ATP binding cassette transporters.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Basis for the ABC-importer complex membership
      inference. Note that the abstract itself misspells the operon as "fpbABC" in
      one place; the quote is reproduced verbatim.
- id: PMID:7559648
  title: Biochemical characterization of a Haemophilus influenzae periplasmic iron
    transport operon.
  findings:
  - statement: The orthologous H. influenzae hitABC system operates the same two-stage
      route - across the outer membrane into the periplasm, then periplasm to cytosol
      - and purified HitA competes for chelator-bound iron both in vitro and within
      the periplasm of E. coli.
    supporting_text: The function of this protein is unambiguously assigned by
      demonstrating its ability to compete for iron bound to the chemical iron
      chelator 2,2'-dipyridyl, both in vitro and
      within the periplasmic space of a siderophore-deficient strain of Escherichia
      coli.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Cited for the orthologous HitA system, not for
      gonococcal FbpA itself; it is one of the two references attached to EMBL
      AAB63559.1 in Q50964. No annotation in this review depends on it.
- id: PMID:21041493
  title: The fbpABC operon is required for Ton-independent utilization of
    xenosiderophores by Neisseria gonorrhoeae strain FA19.
  findings:
  - statement: Conditional-expression fbpABC mutants of strain FA19 require FbpABC
      expression for growth on the catecholate xenosiderophores enterobactin and
      salmochelin, extending the system's substrate range beyond transferrin and
      lactoferrin iron.
    supporting_text: We determined that expression of FbpABC was required for growth
      of
      gonococcal strain FA19 in the presence of enterobactin and salmochelin.
  - statement: FbpABC is a periplasmic-binding-protein-dependent ABC transport system
      that moves iron into the cell after outer-membrane translocation.
    supporting_text: The fbpABC operon encodes a periplasmic-binding-protein-dependent
      ABC transport system that enables the gonococcus to transport iron into the
      cell subsequent to outer membrane translocation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; full text is cached. Gonococcal genetics in the
      same species as the reviewed entry, and the basis for the IMP evidence code on
      the proposed iron-import row.
- id: PMID:17630737
  title: 'Sulfate as a synergistic anion facilitating iron binding by the bacterial
    transferrin FbpA: the origins and effects of anion promiscuity.'
  findings:
  - statement: Iron sequestration by FbpA requires a synergistic anion, physiologically
      phosphate, and the anion's identity shifts the iron affinity by orders of
      magnitude.
    supporting_text: The sequestration of iron by FbpA is facilitated by the presence
      of a
      synergistic anion, such as phosphate or sulfate.
  - statement: FeFbpA-SO4 has the lowest iron affinity of the characterised
      FeFbpA-X assemblies, two orders of magnitude below the phosphate form, and is
      the most easily reduced - linking anion identity to iron release.
    supporting_text: The iron affinity of the FeFbpA-SO4 protein assembly is 2 orders
      of magnitude lower than when bound with phosphate and is the lowest of any of
      the FeFbpA-X assemblies yet reported.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Quantitative anion/affinity/redox data underpinning
      the synergistic-anion part of the description and core function.
- id: PMID:16008346
  title: 'Kinetics of iron release from ferric binding protein (FbpA): mechanistic
    implications in bacterial periplasm-to-cytosol Fe3+ transport.'
  findings:
  - statement: The synergistic anion acts as a gatekeeper on Fe(3+) release as well
      as a facilitator of binding, so anion exchange modulates handover at the inner
      membrane.
    supporting_text: These results reaffirm the contribution of the
      synergistic anion to the FbpA iron transport process as the anion, in addition
      to playing a facilitative role in iron binding, appears to have a "gatekeeper"
      role, thereby modulating the Fe(3+) release process.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. In vitro chelator-competition kinetics; informs
      the mechanism described in the summary but no annotation rests on it alone.
- id: PMID:21933698
  title: FbpA--a bacterial transferrin with more to offer.
  findings:
  - statement: Review concluding that FbpA is a bacterial transferrin on structural
      and functional grounds, and a node in periplasm-to-inner-membrane iron
      transport.
    supporting_text: Here we establish that FbpA may be considered a bacterial
      transferrin on structural and functional grounds.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified review article, used for framing rather than as
      primary evidence for any annotation.
- id: PMID:10425707
  title: The neisserial 37 kDa ferric binding protein (FbpA).
  findings:
  - statement: Review of neisserial FbpA that notes the periplasmic assignment has
      been questioned, since some FbpA molecules or parts of them have been reported
      exposed at the bacterial outer surface.
    supporting_text: Although supposedly periplasmic, the exact location of
      FbpA remains controversial because some molecules, or parts of them, have been
      found exposed to the bacterial outer surface.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified. Included deliberately as the dissenting voice on
      localisation: this 1999 review reports surface-exposure claims for FbpA
      alongside its periplasmic role. The periplasmic location is what the
      transport genetics and the signal-peptide/SBP architecture require and is
      what this review annotates; any surface pool would be an additional
      location, not a replacement, and no annotation here asserts one.
- id: PMID:12598891
  title: A novel protein-mineral interface.
  findings:
  - statement: Purified nFbp binds multinuclear oxo-metal clusters of Fe(3+), Ti(4+),
      Zr(4+) and Hf(4+) in solution, the first such case in the transferrin
      superfamily.
    supporting_text: We show that the
      ferric ion-binding protein from Neisseria gonorrhoeae (nFbp) readily binds
      clusters of Fe3+, Ti4+, Zr4+ or Hf4+ in solution.
  - statement: In the Hf-nFbp crystal structure a di-tyrosyl motif (Tyr195-Tyr196,
      mature numbering) at the base of the open interdomain cleft nucleates a
      trinuclear or pentanuclear oxo-Hf cluster, phosphate-capped in some copies.
    supporting_text: A di-tyrosyl cluster nucleation motif (Tyr195-Tyr196) is situated
      at the bottom of this cleft
      and binds either a trinuclear oxo-Hf cluster, which is capped by phosphate, or
      a
      pentanuclear cluster, which in turn can be capped with phosphate.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; PDB 1O7T. This is the reference that puts Q50964 in the
      CMMMech critical-minerals corpus. The work is cell-free chemistry on
      purified protein, with no mutagenesis of the di-tyrosyl motif for the
      non-ferric metals and no whole-cell uptake of Hf, Zr or Ti, so it
      supports no GO annotation beyond iron and is cited here for the
      description and suggested experiments only.
- id: PMID:23884152
  title: 'Binding of oxo-Cu2 clusters to ferric ion-binding protein A from Neisseria
    gonorrhoeae: a structural insight.'
  findings:
  - statement: Cu(II) binds NgFbpA with a constant of about 8.7e8 per M and the 2.1
      angstrom structure shows dinuclear oxo-Cu2 centres on the same two tyrosines
      that bind iron, with the protein staying in the open, apo-like conformation.
    supporting_text: "The crystal structure of recombinant Cu-NgFbpA at 2.1 Å\nrevealed\
      \ that the oxo-Cu2 clusters (dinuclear centres) assembled in the iron\nbinding\
      \ cleft and were bound to the two adjacent tyrosine residues (Y195 and\nY196)\
      \ of the protein"
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified. In vitro structural study of a non-physiological
      metal; corroborates the cluster-nucleating behaviour of the di-tyrosyl motif
      and is cited for the description only.
suggested_questions:
- question: Does the di-tyrosyl cluster-nucleation mode seen with Hf(IV), Zr(IV) and
    Cu(II) occur in a living gonococcus, and can FbpABC translocate anything that
    is not a mononuclear ferric ion into the cytosol?
- question: Which synergistic anion is actually loaded on FbpA in the gonococcal
    periplasm under iron limitation, and does the cell regulate that anion
    occupancy to control the rate of iron handover to FbpB?
- question: How does FbpA receive iron from the TonB-dependent outer-membrane
    receptors TbpA and LbpA, and is there a direct, transient FbpA-receptor contact
    or only free diffusion of released Fe(3+) in the periplasm?
suggested_experiments:
- experiment_type: whole-cell metal uptake with inductively coupled plasma mass
    spectrometry
  description: Expose wild-type gonococci and a defined fbpA deletion (and a
    Tyr195/Tyr196 double mutant complemented in trans) to Hf(IV), Zr(IV) and Ti(IV)
    complexes, then fractionate periplasm and cytosol and quantify metal by ICP-MS.
    This is the missing test of whether the cluster binding seen on purified protein
    has any whole-cell counterpart, and whether FbpA and its di-tyrosyl motif are
    required for it.
- experiment_type: site-directed mutagenesis with isothermal titration calorimetry
    and crystallography
  description: Make Tyr195Phe, Tyr196Phe and the double mutant of mature FbpA and
    measure binding of Fe(3+) and of Hf(IV)/Zr(IV) cluster precursors separately,
    with structures where crystals form. Published mutant data address iron binding
    only, so necessity of these residues for cluster nucleation is currently
    asserted from the structure alone.
- experiment_type: reconstituted transport assay in proteoliposomes
  description: Reconstitute FbpB and FbpC into liposomes and supply holo-FbpA loaded
    with different synergistic anions, measuring ATP-dependent Fe(3+) translocation.
    This would test directly whether FbpA contributes to the complex-level
    transporter activity, and whether anion identity sets the handover rate as the
    chelator-competition kinetics predict.
