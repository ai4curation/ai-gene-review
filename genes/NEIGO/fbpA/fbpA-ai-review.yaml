- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN002823921
  review:
    summary: FbpA is a periplasmic solute-binding protein; the periplasm is where
      it does its work.
    action: ACCEPT
    reason: >-
      This TreeGrafter row sits on the ancestral node for bacterial type-1
      solute-binding proteins, and the placement is independently correct for
      FbpA rather than merely inherited. The entry carries a SignalP-predicted
      cleaved signal peptide (1-22) with the mature chain 23-331, consistent
      with Sec export, and the primary literature establishes the periplasmic
      compartment directly: Fbp behaves as a classical periplasmic-binding-protein
      component and is a transient intermediate in iron acquisition from human
      transferrin. GO:0030288 is also the most precise compartment term
      available for a soluble Gram-negative periplasmic protein, so no
      sub-compartment refinement applies. The same term is accepted for the
      comparable solute-binding protein in genes/ECOLI/pstS.
    supported_by:
    - reference_id: PMID:7934822
      supporting_text: Predictive of a
        periplasmic-binding protein, which functions in the high-affinity acquisition
        of
        iron, is that Fbp is a transient participant in the process of iron acquisition
        from human transferrin.
    - reference_id: file:NEIGO/fbpA/fbpA-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: "FT   SIGNAL          1..22"
- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006061
  review:
    summary: True, but the substrate and the direction of transport are both known,
      so a more specific descendant should be used.
    action: MODIFY
    reason: >-
      IPR006061 is the bacterial type-1 solute-binding protein conserved site,
      a signature shared by importers of many different solutes, so the
      InterPro2GO mapping can only reach the unqualified parent term. That is
      not a mapping error - FbpA is genuinely a subunit of a transmembrane
      importer, and in the FbpABC system the solute-binding protein does part
      of the work of translocation by delivering the loaded substrate to the
      permease. For this gene the solute is known to be ferric iron and the
      direction is periplasm to cytosol, so GO:0034755 iron ion transmembrane
      transport, an is_a descendant of GO:0055085, is the supported term. No
      source defect is recorded: the row is under-specific rather than wrong.
    proposed_replacement_terms:
    - id: GO:0034755
      label: iron ion transmembrane transport
    supported_by:
    - reference_id: PMID:8606197
      supporting_text: The fpbABC operon composes an iron transport system
        that is homologous to the sfu and hit operons previously reported for Serratia
        marcescens and Haemophilus influenzae, respectively, and displays elements
        characteristic of ATP binding cassette transporters.
    - reference_id: PMID:21041493
      supporting_text: The fbpABC operon encodes a periplasmic-binding-protein-dependent
        ABC transport system that enables the gonococcus to transport iron into the
        cell subsequent to outer membrane translocation.
- term:
    id: GO:0008199
    label: ferric iron binding
  evidence_type: IDA
  original_reference_id: PMID:7947682
  qualifier: enables
  review:
    summary: Proposed new annotation. FbpA reversibly binds a single Fe(3+) ion with
      high affinity, with a transferrin-like ligand set plus a synergistic anion.
    action: NEW
    reason: >-
      The best-supported molecular function of this protein has no GO row at
      all: Q50964 is an unreviewed entry whose only annotations are two IEA
      rows. Direct evidence is extensive and the entity that performs the
      binding is unambiguously FbpA itself. Solution biochemistry on purified
      gonococcal Fbp shows reversible 1:1 ferric binding, implicates two to
      three tyrosines and one histidine, and shows a synergistic anion
      requirement; the ligands are resolved in the PDB entry 1D9Y Fe(3+)
      co-crystal structure, whose four binding residues appear in the UniProt
      record as FT BINDING sites 31, 79, 217 and 218 with ECO:0007829|PDB:1D9Y
      evidence (His9, Glu57, Tyr195 and Tyr196 in the mature-protein numbering
      used by the literature; the offset is the 22-residue signal peptide).
      IDA is used because the evidence is a direct assay of the purified
      protein. GO:0008199 is not an ancestor or descendant of any other term
      proposed here.
    supported_by:
    - reference_id: PMID:7947682
      supporting_text: Fbp reversibly binds a single ferric ion per molecule of protein
        with
        high affinity.
    - reference_id: PMID:7947682
      supporting_text: In addition, like the transferrins, a bicarbonate anion is
        required for the
        efficient coordination of iron by Fbp.
    - reference_id: file:NEIGO/fbpA/fbpA-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: "FT   BINDING         217"
- term:
    id: GO:0033212
    label: iron import into cell
  evidence_type: IMP
  original_reference_id: PMID:21041493
  qualifier: involved_in
  review:
    summary: Proposed new annotation. FbpA is the periplasmic carrier step of the
      FbpABC route that brings iron from the periplasm into the gonococcal cytosol.
    action: NEW
    reason: >-
      The process term is proposed on participation, not on necessity alone.
      FbpA performs a step of the import itself - it is the carrier that holds
      Fe(3+) across the periplasm and presents it to the FbpB permease - which
      is what the pulse-chase experiments of Chen et al. establish by showing
      Fbp as a transient intermediate between transferrin and the cell. The
      operon-level genetics is consistent: conditional-expression fbpABC
      mutants of strain FA19 fail to grow on iron sources that require the
      system. The comparator check supports rather than undercuts the
      proposal: the equivalent solute-binding subunit in this repository,
      genes/ECOLI/pstS, carries the matching transport process term for its
      own substrate, so annotating the SBP to the import process is the
      established convention for this role, not an invention. GO:0033212 lies
      under iron ion transport and intracellular iron homeostasis and is
      neither an ancestor nor a descendant of GO:0034755, so it is not
      redundant with the replacement proposed for the GO:0055085 row.
    supported_by:
    - reference_id: PMID:21041493
      supporting_text: We determined that expression of FbpABC was required for growth
        of
        gonococcal strain FA19 in the presence of enterobactin and salmochelin.
    - reference_id: PMID:7934822
      supporting_text: The results of this investigation provide evidence that
        Fbp participates in this process as a functional analogue of a Gram-negative
        periplasmic-binding protein component, which operates as a part of a general
        active transport process for the receptor-mediated, high-affinity transport
        of
        iron from human transferrin.
- term:
    id: GO:0055052
    label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
  evidence_type: IC
  original_reference_id: PMID:8606197
  qualifier: part_of
  review:
    summary: Proposed new annotation. FbpA is the substrate-binding subunit of the
      FbpABC ABC importer.
    action: NEW
    reason: >-
      fbpA is the first gene of a three-gene operon encoding a solute-binding
      protein, a membrane permease (FbpB) and a nucleotide-binding protein
      (FbpC), the canonical architecture of a substrate-binding-subunit-containing
      ABC importer, and the system is explicitly described as
      periplasmic-binding-protein-dependent. GO:0055052 is defined to include
      the substrate-binding subunit, so the part_of claim is about the subunit
      composition of the transporter and not about a stable stoichiometric
      complex - FbpA, like other Gram-negative SBPs, is a freely diffusing
      periplasmic protein that associates transiently with the permease. The
      evidence code is IC because the claim is an inference this review
      authors from the operon structure and the transport genetics rather than
      a direct assay of complex membership. The same term is used for the
      corresponding subunit in genes/ECOLI/pstS and genes/ECOLI/pstC.
    supported_by:
    - reference_id: PMID:8606197
      supporting_text: "We have determined that the DNA sequence downstream of the
        well-characterized gonococcal fbp gene contains two open reading frames: one
        designated fbpB, which encodes a protein proposed to function as a cytoplasmic
        permease, and one designated fbpC, which encodes a protein proposed to function
        as a nucleotide-binding protein."
    - reference_id: PMID:21041493
      supporting_text: The fbpABC operon encodes a periplasmic-binding-protein-dependent
        ABC transport system
