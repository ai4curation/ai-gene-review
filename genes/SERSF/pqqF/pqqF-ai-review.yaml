  review:
    summary: >-
      Correct core activity. The structure shows the canonical inverzincin active
      site with a zinc ion bound by the HxxEH histidines and a downstream glutamate,
      and a catalytic glutamate base, within an M16A clamshell. Direct cleavage of
      PqqA by this protein is not reported in the abstract, but the active-site
      chemistry, the PqqF-specific family signature and the genetic requirement for
      PQQ agree.
    action: ACCEPT
    reason: >-
      Structural identification of the zinc-dependent catalytic machinery plus
      PqqF-family membership support the activity; the EC 3.4.24.55 entity is a
      family-level EC rather than a statement about insulin as substrate.
    supported_by:
    - reference_id: PMID:27231346
      supporting_text: His-48, His-52, Glu-129 and His-14 from the N-terminal tag coordinate with the zinc ion. Glu-51 acts as a base catalyst.
    - reference_id: PMID:27231346
      supporting_text: The PqqF structure conforms to the general structure of inverzincins.
