description: >-
  A0ACD6BAY6 is PqqF of Serratia sp. FS14, a 773-residue single-chain M16A
  (inverzincin) zinc metallopeptidase of pyrroloquinoline quinone (PQQ)
  biosynthesis. UniProt records no gene name; the publication names the gene pqqF.
  Its crystal structure (PDB 5CIO) shows a closed clamshell of N- and C-terminal
  halves enclosing a chamber of about 9,400 cubic angstroms, much smaller than
  that of insulin-degrading enzyme, which may suit the short precursor peptide PqqA.
  The catalytic zinc is bound by His48, His52 and Glu129 of the HxxEH inverzincin
  motif, with Glu51 as the base catalyst. Deletion of pqqF in Serratia sp. FS14
  abolishes PQQ production, read out as loss of the glucose repression of
  prodigiosin that PQQ-dependent glucose oxidation causes. PqqF is proposed to
  release the PqqE-cross-linked glutamate and tyrosine from PqqA.
