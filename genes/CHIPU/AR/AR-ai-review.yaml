taxon:
  id: NCBITaxon:137246
  label: Chiloscyllium punctatum
description: Brown-banded bamboo shark androgen receptor is a nuclear steroid receptor that recognizes
  androgens and activates transcription through androgen response elements. The cloned receptor responds
  to testosterone, dihydrotestosterone and 11-ketotestosterone and redistributes from cytoplasm to nucleus
  after androgen treatment. It provides direct functional evidence for androgen-responsive nuclear receptor
  signaling in cartilaginous fishes.
