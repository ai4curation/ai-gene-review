  label: Pseudomonas phage 201phi2-1
description: Major phage nuclear shell protein chimallin (ChmA, PhuN, gp105) of jumbo Pseudomonas phage 201phi2-1 that self-assembles into C4-symmetric homotetramers and polymerizes via flexible N- and C-terminal tails into a single-layered square-lattice proteinaceous shell in the host cell cytoplasm. This micrometer-scale compartment (the phage nucleus) encloses replicating viral DNA, centered at midcell by the PhuZ tubulin spindle, selectively compartmentalizes DNA replication and transcription machinery inside while excluding host ribosomes, metabolic enzymes, and DNA-targeting defenses, and serves as the docking platform for procapsids during viral genome packaging.
