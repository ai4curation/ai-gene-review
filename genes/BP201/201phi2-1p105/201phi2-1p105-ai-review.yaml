suggested_questions:
- question: How are folded ~50–100 kDa phage DNA replication and transcription proteins selectively imported across the chimallin (gp105) shell when the intrinsic central pore of the C4 chimallin tetramer measures only ~2 nm in diameter?
  experts:
  - Elizabeth Villa
  - Kevin D. Corbett
  - Joe Pogliano
suggested_experiments:
- description: Perform high-resolution in situ cryo-electron tomography and focused classification of minor protein complexes embedded within native 201phi2-1 chimallin shells during early and mid-infection, coupled with proximity labeling (TurboID) of shell-associated proteins.
  hypothesis: Specialized phage-encoded shell-spanning pore or transporter complexes intercalate into defects or vertices of the square chimallin lattice to mediate selective protein import and mRNA export across the phage nuclear barrier.
  experiment_type: In situ cryo-electron tomography and proximity proteomics
