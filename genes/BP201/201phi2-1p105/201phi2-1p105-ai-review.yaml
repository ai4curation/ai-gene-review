- id: PMID:28082593
  title: Assembly of a nucleus-like structure during viral replication in bacteria.
  findings:
  - statement: Phage 201phi2-1 gp105 is the first and most abundant viral protein synthesized upon infection and self-assembles into a spherical shell around replicating phage DNA that segregates nuclear replication/transcription proteins from cytoplasmic translation machinery.
    supporting_text: gp105 is the first and most highly expressed phage protein after infection (Fig. 1F). In uninfected cells, GFP-gp105 was uniformly distributed, but surprisingly, it formed a somewhat spherically shaped structure surrounding phage DNA at the midcell after 45 min of infection (Fig. 1A).
- id: PMID:28813669
  title: The Phage Nucleus and Tubulin Spindle Are Conserved among Large Pseudomonas Phages.
  findings:
  - statement: The gp105 proteinaceous barrier is conserved across large Pseudomonas phages (including phiKZ gp54 and phiPA3 gp53) and compartmentalizes viral DNA replication and transcription inside the phage nucleus while excluding ribosomes and metabolic enzymes.
    supporting_text: This “phage nucleus” is bound by a proteinaceous barrier composed of gp105 that encloses viral DNA and separates cellular functions. Like the eukaryotic equivalent, DNA replication and transcription occur inside the phage nucleus, while translation and metabolic enzymes are localized in the cytoplasm.
- id: PMID:35922510
  title: Architecture and self-assembly of the jumbo bacteriophage nuclear shell.
  findings:
  - statement: Chimallin (gp105) monomers self-assemble into C4 homotetramers with ~2 nm central pores that polymerize via flexible N- and C-terminal tail interactions into a single-layered square-lattice sheet forming the phage nuclear shell.
    supporting_text: Here we find that the bacteriophage nuclear shell assembles primarily from one protein, which we name chimallin (ChmA). Combining cryo-electron tomography of nuclear shells in bacteriophage-infected cells and cryo-electron microscopy of a minimal chimallin compartment in vitro, we show that chimallin self-assembles as a flexible sheet into closed micrometre-scale compartments.
