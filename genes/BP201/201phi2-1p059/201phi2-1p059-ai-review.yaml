id: B3FK34
gene_symbol: 201phi2-1p059
status: COMPLETE
taxon:
  id: NCBITaxon:198110
  label: Pseudomonas phage 201phi2-1
description: Divergent tubulin/FtsZ-family cytoskeletal GTPase (PhuZ, gp59) of jumbo Pseudomonas phage 201phi2-1 that polymerizes in a GTP-dependent manner into three-stranded helical filaments exhibiting dynamic instability and treadmilling in the host cell cytoplasm. By stabilizing both longitudinal and lateral inter-subunit contacts via an extended acidic C-terminal tail, PhuZ assembles a bipolar spindle anchored at the host cell poles that pushes the chimallin (gp105)-enclosed phage nucleus to midcell, rotates the phage nucleus, and traffics membrane-assembled procapsids along treadmilling filaments to the nuclear shell for viral DNA packaging.
