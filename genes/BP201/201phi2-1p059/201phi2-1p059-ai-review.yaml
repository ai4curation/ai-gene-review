suggested_questions:
- question: Which phage-encoded or host-encoded adaptor proteins anchor the minus ends of PhuZ filaments at the bacterial cell poles and couple procapsids to treadmilling PhuZ protofilaments during transport?
  experts:
  - Joe Pogliano
  - Elizabeth Villa
  - David A. Agard
suggested_experiments:
- description: Perform cryo-electron tomography and subtomogram averaging of procapsids bound to PhuZ filaments in 201phi2-1-infected Pseudomonas chlororaphis cells combined with cross-linking mass spectrometry of purified PhuZ-capsid complexes.
  hypothesis: Identification of the molecular interface or adaptor factor linking the major capsid protein (gp200) to the exterior of the three-stranded PhuZ filament will reveal how passive attachment to treadmilling subunits drives directional capsid transport without an ATP-dependent motor.
  experiment_type: Cryo-electron tomography and cross-linking mass spectrometry
