- id: PMID:22726436
  title: A phage tubulin assembles dynamic filaments by an atypical mechanism to center viral DNA within the host cell.
  findings:
  - statement: PhuZ possesses a divergent tubulin fold with an extended acidic C-terminal tail required for GTP-dependent polymerization and forms dynamic filaments in vivo that position the phage DNA replication factory at midcell.
    supporting_text: Here, we identify a tubulin-like protein, PhuZ, from bacteriophage 201φ2-1 and show that it forms filaments in vivo and in vitro. The PhuZ structure has a conserved tubulin fold, with an unusual, extended C terminus that we demonstrate to be critical for polymerization in vitro and in vivo.
- id: PMID:24631461
  title: The structure and assembly mechanism of a novel three-stranded tubulin filament that centers phage DNA.
  findings:
  - statement: Cryo-EM at 3.5 A resolution demonstrates that PhuZ forms a three-stranded helical filament in which the extended C-terminal tail stabilizes both longitudinal and lateral inter-subunit contacts, and GTP hydrolysis-coupled compaction stores lattice energy to drive dynamic instability.
    supporting_text: Our reconstruction and derived model reveal the first example of a three-stranded tubulin filament. We show that the elongated C-terminal tail simultaneously stabilizes both longitudinal and lateral interactions, which in turn define filament architecture.
- id: PMID:25429514
  title: A bacteriophage tubulin harnesses dynamic instability to center DNA in infected cells.
  findings:
  - statement: PhuZ filaments exhibit microtubule-like dynamic instability both in vitro and in vivo and assemble a polarly anchored bipolar spindle that pushes the phage nucleoid to midcell.
    supporting_text: Here, we show that PhuZ filaments, like microtubules, stochastically switch from growing in a distinctly polar manner to catastrophic depolymerization (dynamic instability) both in vitro and in vivo. One end of each PhuZ filament is stably anchored near the cell pole to form a spindle-like array that orients the growing ends toward the phage nucleoid so as to position it near mid-cell.
- id: PMID:28082593
  title: Assembly of a nucleus-like structure during viral replication in bacteria.
  findings:
  - statement: Bipolar PhuZ spindles in the host cytoplasm center the gp105-bounded phage nucleus at midcell via a pushing mechanism.
    supporting_text: Over time, PhuZ polymers pushed the GFP-gp105 shell to the cell center (Fig. 1C), confirming that these dynamically unstable filaments center phage DNA by a pushing mechanism.
- id: PMID:31199917
  title: Viral Capsid Trafficking along Treadmilling Tubulin Filaments in Bacteria.
  findings:
  - statement: Treadmilling PhuZ filaments traffic newly assembled procapsids from the host membrane to the surface of the phage nucleus and rotate the phage nucleus to distribute capsids for DNA packaging.
    supporting_text: Here, we show that capsids assemble on the membrane and then move rapidly along PhuZ filaments toward the phage nucleus for DNA packaging. The spindle rotates the phage nucleus, distributing capsids around its surface.
