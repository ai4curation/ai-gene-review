- description: Polymerization-stimulated cytoskeletal GTPase that self-assembles via an extended acidic C-terminal tail into dynamic three-stranded helical filaments in the host cell cytoplasm, forming a bipolar spindle that centers and rotates the chimallin-enclosed phage nucleus at midcell and traffics procapsids from the host membrane to the nuclear shell for DNA packaging.
