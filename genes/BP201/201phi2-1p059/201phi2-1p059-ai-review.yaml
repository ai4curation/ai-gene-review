    supporting_text: Here, we identify a tubulin-like protein, PhuZ, from bacteriophage 201φ2-1 and show that it forms filaments in vivo and in vitro. The PhuZ structure has a conserved tubulin fold, with an unusual, extended C terminus that we demonstrate to be critical for polymerization in vitro and in vivo.
  - reference_id: PMID:24631461
    supporting_text: Our reconstruction and derived model reveal the first example of a three-stranded tubulin filament. We show that the elongated C-terminal tail simultaneously stabilizes both longitudinal and lateral interactions, which in turn define filament architecture.
