  review:
    summary: >-
      Correct and core. Both regions act in PQQ biosynthesis: the PqqC region
      catalyzes the last step and the PqqD region presents PqqA to PqqE for the
      first. Complementation of AM1 pqqC mutants and conversion of the accumulated
      intermediate by PqqC/D extract establish the role in this organism.
    action: ACCEPT
    reason: >-
      Direct genetic and biochemical evidence in M. extorquens AM1 places this
      protein in PQQ biosynthesis; the IEA row agrees with it.
    supported_by:
    - reference_id: PMID:9043136
      supporting_text: This genomic region complemented the growth of pqqC mutants of M. extorquens AM1 and Methylobacterium organophilum DSM 760 on methanol.
