proposed_new_terms:
- proposed_name: RiPP precursor peptide chaperone activity
  proposed_definition: >-
    Binding a ribosomally synthesized precursor peptide of a ribosomally
    synthesized and post-translationally modified peptide (RiPP) pathway through
    its leader or core region, and presenting it to the first modifying enzyme of
    the pathway, without itself catalysing the modification.
  justification: >-
    PqqD-family RiPP precursor peptide recognition elements bind the PQQ precursor
    peptide PqqA tightly and deliver it to the radical-SAM enzyme PqqE in a ternary
    complex that PqqE requires for activity. GO has no molecular-function term for
    this non-catalytic substrate-presentation role, which recurs in other RiPP
    pathways, so a single term would serve them all.
  supported_by:
  - reference_id: PMID:28481092
    supporting_text: 'is initiated when the precursor peptide, PqqA, is recognized and bound by the RiPP precursor peptide recognition element (RRE), PqqD, for presentation to the first enzyme in the pathway, PqqE.'
suggested_questions:
- question: Does fusion of PqqC to PqqD in AM1 channel any intermediate between the first and last steps, or is the fusion purely a genomic arrangement with independently acting domains?
suggested_experiments:
- hypothesis: The PqqC and PqqD regions of PqqCD act independently.
  description: Split pqqCD into separately expressed pqqC and pqqD alleles on the chromosome and compare PQQ yield and methanol growth with the fused allele.
  experiment_type: targeted genetics and PQQ quantification
