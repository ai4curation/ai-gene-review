      supporting_text: a pqqC mutant of M. extorquens AM1 produced an intermediate of PQQ biosynthesis, which was converted to PQQ by incubation with a crude extract from E.coli cells expressing PqqC/D.
    - reference_id: PMID:25817994
      supporting_text: Our new hypothesis is that PqqD first binds PqqA to protect the peptide from premature proteolytic cleavage and/or to present the glutamate and tyrosine to PqqE.
