id: Q49150
gene_symbol: pqqCD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  pqqCD (MexAM1_META1p1749) encodes a natural fusion of the two last-acting and
  first-acting non-catalytic components of pyrroloquinoline quinone (PQQ)
  biosynthesis in Methylorubrum (Methylobacterium) extorquens AM1. The N-terminal
  PqqC region (residues 1-267) is the cofactor-independent pyrroloquinoline-quinone
  synthase that performs the terminal ring cyclization and eight-electron oxidation
  of the late quinoline intermediate to PQQ, consuming O2 and releasing H2O2. The
  C-terminal PqqD region (residues 281-372), joined by a short linker, is the RiPP
  precursor-peptide recognition element that binds the precursor peptide PqqA with
  submicromolar affinity and presents it to the radical-SAM cyclase PqqE in a 1:1:1
  ternary complex. AM1 has no separate pqqD gene, so the fusion supplies both roles;
  the PqqD portion alone suffices for PqqA and PqqE binding. Mutants in the
  pqqC complementation group accumulate a PQQ intermediate that extracts from cells
  expressing PqqC/D convert to PQQ. PQQ is the prosthetic group of the periplasmic
  methanol dehydrogenases required for methylotrophic growth.
