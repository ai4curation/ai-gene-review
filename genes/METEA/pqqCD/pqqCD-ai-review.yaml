    label: quinone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR022479
  review:
    summary: >-
      This row comes from the InterPro2GO mapping of the PqqD signature
      IPR022479. The AM1 PqqD region has been characterized directly by SPR, ITC,
      native MS and NMR, and what it binds is the precursor peptide PqqA and the
      enzyme PqqE, not a quinone. PQQ does bind in the active site of the separate
      PqqC region, but only as the reaction product, and the row was not assigned
      on that basis.
    action: REMOVE
    reason: >-
      The PqqD-domain mapping asserts a ligand that the characterized domain does
      not bind; the same row is removed from the KT2440 PqqD1 and PqqD2 reviews.
      Product occupancy of the PqqC active site is not a quinone-binding function.
    supported_by:
    - reference_id: PMID:25817994
      supporting_text: In contrast, evidence for peptide binding by MePqqE or MePqqB was not found. Significantly, these experiments provide the first evidence that PqqD is the PqqA binding partner.
