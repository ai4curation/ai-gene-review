  label: Methylorubrum extorquens AM1
description: 'ackA encodes acetate kinase (EC 2.7.2.1), also known as acetokinase,
  which catalyzes the reversible Mg2+-dependent phosphorylation of acetate to acetyl
  phosphate using ATP as the phosphate donor. Together with phosphate acetyltransferase
  (Pta), AckA can connect acetate, acetyl phosphate and acetyl-CoA through the reversible
  AckA-Pta node. The AM1 enzyme has not been biochemically characterized directly;
  its acetate kinase, homodimer and Mg2+/Mn2+ cofactor assignments come from conserved
  bacterial AckA family evidence. In acetate-grown AM1, AckA and Pta were barely detected
  and acetate activation was instead predicted to proceed mainly through AMP-forming
  acetyl-CoA synthetase, so AckA-Pta should be viewed as a conserved, condition-dependent
  acetate/acetyl-phosphate node rather than the dominant acetate assimilation route
  under that tested condition.'
