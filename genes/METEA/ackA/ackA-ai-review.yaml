core_functions:
- description: AckA catalyzes the ATP- and Mg2+-dependent reversible phosphorylation
    of acetate to acetyl phosphate. The enzyme functions as a conserved acetate kinase,
    inferred to be cytosolic and able to use Mg2+ or Mn2+ as a metal cofactor. With
    Pta, AckA can connect acetate, acetyl phosphate and acetyl-CoA, but the AM1 AckA-Pta
    node has not been directly characterized biochemically and was barely detected
    during acetate growth, where Acs was predicted to be the main acetate-activating
    enzyme.
