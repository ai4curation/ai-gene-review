gene_symbol: pqqG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  pqqG (MexAM1_META1p2331) encodes the partner subunit of PqqF/PqqG, a
  two-component M16B metallopeptidase of pyrroloquinoline quinone (PQQ)
  biosynthesis in Methylorubrum (Methylobacterium) extorquens AM1. The 427-residue
  protein has an M16 C-terminal domain but lacks the HxxEH zinc-binding motif of the
  catalytic M16 N-terminal domain, like the non-catalytic partners of other M16B
  heterodimers. It binds PqqF with a KD of about 300 nM, and the heterodimer
  rapidly cleaves the PqqA precursor peptide, preferring serine side chains. It is
  unrelated to the S9-family serine peptidases of Pseudomonas that are also called
  PqqG or PqqM, and it is distinct from the gene called pqqG in the pre-1997 AM1
  literature, which is now pqqB.
existing_annotations:
- term:
    id: GO:0009003
    label: signal peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:3.4.24.64
  review:
    summary: >-
      Wrong mapping. The EC 3.4.24.64 (mitochondrial processing peptidase) number
      was assigned to this bacterial M16B protein by family similarity, and the
      EC2GO mapping then turned it into signal peptidase activity. PqqG is a
      cytoplasmic partner subunit of a protease whose substrate is the PqqA
      precursor peptide; nothing suggests it removes signal or transit peptides.
    action: REMOVE
    reason: >-
      An EC number inherited from the mitochondrial processing peptidase family
      does not apply to this bacterial subunit, and the resulting signal-peptidase
      term contradicts the known PqqA substrate.
    supported_by:
    - reference_id: PMID:31427437
      supporting_text: we isolated and characterized a two-component heterodimer protein from the α-proteobacterium Methylobacterium (Methylorubrum) extorquens that can rapidly catalyze cleavage of PqqA into smaller peptides.
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011249
  review:
    summary: >-
      Over-propagated from the LuxS/M16 metalloenzyme superfamily signature
      IPR011249. PqqG has only the M16 C-terminal domain and no HxxEH zinc motif,
      no PROSITE insulinase signature and no annotated metal site; in M16B
      heterodimers the partner subunit does not bind the catalytic zinc.
    action: REMOVE
    reason: >-
      The superfamily mapping assumes a metal site that this subunit lacks; its
      paired PqqF subunit carries the zinc site instead.
    supported_by:
    - reference_id: file:METEA/pqqG/pqqG-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: /note="Peptidase M16 C-terminal"
    - reference_id: file:METEA/pqqF/pqqF-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="Zn(2+)"
- term:
    id: GO:0004222
    label: metalloendopeptidase activity
  evidence_type: IDA
  original_reference_id: PMID:31427437
  qualifier: contributes_to
  review:
    summary: >-
      Proposed new row. PqqG is required as the partner subunit of the active
      PqqF/PqqG heterodimer that cleaves PqqA, so it contributes to, rather than
      enables on its own, the metalloendopeptidase activity.
    action: NEW
    reason: >-
      Direct biochemistry on the AM1 complex; contributes_to records the
      complex-level activity without implying that the zinc-free subunit is a
      protease by itself.
    supported_by:
    - reference_id: PMID:31427437
      supporting_text: we demonstrated the formation of a complex PqqF/PqqG, with a KD of 300 nm
- term:
    id: GO:0018189
    label: pyrroloquinoline quinone biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:31427437
  qualifier: involved_in
  review:
    summary: >-
      Proposed new process row. As part of the protease that excises the
      cross-linked core from PqqA, PqqG does part of the work of PQQ biosynthesis.
    action: NEW
    reason: Same evidence and reasoning as the new process row on the PqqF subunit.
    supported_by:
    - reference_id: PMID:31427437
      supporting_text: We hypothesize that PqqF/PqqG initially cleaves between the PqqE/PqqD-generated cross-linked form of PqqA, with nonspecific cellular proteases completing the release of a suitable substrate for the downstream enzyme PqqB.
