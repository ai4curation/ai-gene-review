id: C5B1I7
gene_symbol: mllF
product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  mllF (locus MexAM1_META1p4135) is a xylose isomerase-like TIM barrel
  domain-containing protein (Pfam PF01261; InterPro IolE/XylAMocC-like family)
  encoded within the mll/mlu biosynthetic gene cluster (META1p4129-4138) of
  Methylorubrum extorquens AM1. This cluster produces methylolanthanin, the first
  reported biological lanthanide chelator (a lanthanophore); the mll promoter is
  also iron-responsive, but a direct Fe-chelation role for methylolanthanin is
  unresolved. The cluster is induced ~32-fold under poorly soluble lanthanide
  conditions (Nd2O3 vs NdCl3) and is required for normal lanthanide
  bioaccumulation. mllF is grouped with genes
  (mllA/mllBC/mllDE/mllF) homologous to the petrobactin asbABCDEF locus and is
  the conceptual analog of AsbF, a Mn2+-dependent 3-dehydroshikimate
  dehydratase. However, the characterized AM1 product contains
  4-hydroxybenzoate rather than rhodopetrobactin's 3,4-dihydroxybenzoate, and
  mllF matches PF01261 only weakly (low HMM bitscore;
  "PF01261-related but divergent") and has NOT been individually biochemically
  characterized, so its specific catalyzed reaction and substrate are
  unresolved. The TIM-barrel/IolE-XylA fold encompasses isomerases, epimerases
  and dehydratases (lyases), so the family name alone does not establish
  isomerase activity; the closest characterized homolog is in fact a lyase,
  making a specific isomerase assignment an over-annotation. The defensible
  inference is that mllF is a metal-dependent TIM-barrel enzyme contributing to
  methylolanthanin biosynthesis, with its exact substrate and reaction still
  unresolved.
existing_annotations:
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: NAS
    review:
      summary: >-
        No curated GOA annotation exists for mllF. The prior review asserted a
        specific isomerase activity (GO:0016853) purely from the UniProt/Pfam
        family name "Xylose isomerase-like TIM barrel" (PF01261); this is removed
        as an over-annotation. UniProt assigns PF01261 and a divalent-metal-dependent
        TIM-barrel fold to mllF, and the primary methylolanthanin paper labels
        the gene product as AsbF-like while noting that mllF was too divergent
        from PF01261 to use an asbF antiSMASH model. Thus, the specific isomerase
        reaction is not established. The final methylolanthanin product contains
        two 4-HB moieties rather than rhodopetrobactin's two 3,4-DHB moieties,
        so MllF cannot simply be presumed to catalyze the canonical AsbF
        3-dehydroshikimate dehydratase reaction. The xylose-isomerase-like /
        IolE-XylA TIM-barrel superfamily contains isomerases, epimerases and
        dehydratases, so the fold name does not support a specific isomerase
        claim. A lyase reaction remains plausible by analogy to AsbF, but the
        PF01261 divergence and 4-HB/3,4-DHB product difference make the
        enzyme-class transfer too specific until MllF's substrate and product
        are measured. The defensible molecular function is the general claim
        that mllF is a metal-dependent catalytic enzyme.
      action: NEW
      reason: >-
        Replaces the prior unsupported isomerase over-annotation with a general
        catalytic activity term that is consistent with the divergent TIM-barrel
        metalloenzyme evidence. The review stops at catalytic activity rather
        than a lyase child term because the 4-HB-containing methylolanthanin
        product differs from the 3,4-DHB-containing AsbF pathway product, and
        no MllF reaction has been reconstituted experimentally.
      supported_by:
        - reference_id: file:METEA/mllF/mllF-uniprot.txt
          reference_section_type: OTHER
          supporting_text: >-
            DR   Gene3D; 3.20.20.150; Divalent-metal-dependent TIM barrel enzymes; 1.
        - reference_id: PMID:39078674
          reference_section_type: OTHER
          supporting_text: >-
            No asbF model was used due to a low bitscore between mllF and the
            expected Pfam model PF01261.27.
        - reference_id: PMID:39078674
          reference_section_type: OTHER
          supporting_text: >-
            META1p41355.88.30E-130asbF-like 3,4-DHB synthaseRpa1_262852
        - reference_id: PMID:39078674
          reference_section_type: OTHER
          supporting_text: >-
            which differ by the presence of 4-HB vs. 3,4-DHB, respectively
  - term:
      id: GO:0044550
      label: secondary metabolite biosynthetic process
    evidence_type: NAS
    review:
      summary: >-
        mllF is an AsbF-like member of the mll/mlu biosynthetic gene cluster that
        produces the secondary metabolite methylolanthanin (a lanthanophore).
        Secondary metabolite biosynthetic process is preferred over the
        Fe(III)-specific siderophore biosynthetic process term (GO:0019290)
        because the characterized product chelates lanthanides while the
        promoter response to iron limitation still leaves any direct
        Fe-chelation role unresolved.
        This process annotation is supported by cluster-level transcriptomic and
        genetic evidence, not by direct single-gene characterization.
      action: NEW
      reason: >-
        Captures the well-supported biological process role of mllF within
        methylolanthanin biosynthesis without overstating a specific iron
        siderophore role.
      supported_by:
        - reference_id: PMID:39078674
          reference_section_type: OTHER
          supporting_text: >-
            META1p41355.88.30E-130asbF-like 3,4-DHB synthaseRpa1_262852
        - reference_id: PMID:39078674
          reference_section_type: OTHER
          supporting_text: >-
            the putative mll product is differentially abundant across ΔmxaF,
            mll knockout, and mll overexpression samples
core_functions:
  - description: >-
      Divergent metal-dependent TIM-barrel enzyme (xylose isomerase-like /
      AsbF-like, PF01261) associated with the aromatic-acid branch of
      methylolanthanin biosynthesis. The characterized product contains 4-HB
      rather than the 3,4-DHB generated by characterized AsbF, so the specific
      reaction, substrate, and pathway position are not yet experimentally
      determined.
    molecular_function:
      id: GO:0003824
      label: catalytic activity
    supported_by:
