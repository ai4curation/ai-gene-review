    original_reference_id: GO_REF:0000002
    review:
      summary: >-
        Direct XoxF-XoxG coupled assays support XoxG as the physiological
        electron acceptor of XoxF during methanol oxidation.
      action: ACCEPT
      supported_by:
        - reference_id: PMID:31017712
          supporting_text: using their physiological electron acceptor, XoxG
