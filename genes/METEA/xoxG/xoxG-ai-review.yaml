suggested_questions:
  - question: >-
      What accounts for the 13-residue offset between the paper's XoxG
      numbering and cached UniProt C5B121? Gln27, Cys95/Cys98, His99 and
      Met143 correspond to matching residues at 14, 82/85, 86 and 130 in
      C5B121. The paper establishes processing and periplasmic purification;
      full sequence/construct reconciliation is needed before transferring
      its numerical site coordinates to UniProt.
