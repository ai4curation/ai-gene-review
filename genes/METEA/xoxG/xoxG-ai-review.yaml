  label: Methylorubrum extorquens AM1
description: >-
  xoxG encodes a periplasmic c-type cytochrome that serves as the physiological electron
  acceptor for lanthanide-dependent XoxF methanol dehydrogenase. Its heme
  supports electron transfer, and its low reduction potential is associated
  with efficient coupling to XoxF containing the lighter lanthanides.
  Loss of xoxG impairs lanthanide-dependent methanol growth similarly to
  loss of both xoxF genes. The protein functions in the methanol-oxidation
  electron-transfer system.
