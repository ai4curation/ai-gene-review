id: C5B121
gene_symbol: xoxG
product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  xoxG encodes a c-type cytochrome that serves as the physiological electron
  acceptor for lanthanide-dependent XoxF methanol dehydrogenase. Its heme
  supports electron transfer, and its low reduction potential is associated
  with efficient coupling to XoxF containing the lighter lanthanides.
  The protein functions in the methanol-oxidation electron-transfer system.
