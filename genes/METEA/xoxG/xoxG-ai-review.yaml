    evidence_type: IDA
    original_reference_id: PMID:31017712
    review:
      summary: >-
        XoxG accepts electrons from XoxF during methanol oxidation and
        supports catalytic turnover in the coupled assay.
      action: NEW
      reason: >-
        Electron acceptance is a direct contribution to the methanol
        catabolic reaction, not just a requirement inferred from growth.
