core_functions:
- description: >-
    NADP-dependent interconversion of carrier-bound C1 intermediates.
    MtdA reduces methenyl-H4F to methylene-H4F for serine-cycle assimilation
    and also supports methylene-H4MPT oxidation. Inhibition of its H4F
    activity by methenyl-H4MPT couples the assimilatory and oxidative
    pathways. Relative activities measured in the oxidative assay do not
    determine the dominant in-vivo flux or the physiological reaction direction.
