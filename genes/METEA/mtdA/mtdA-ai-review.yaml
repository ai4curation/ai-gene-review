proposed_new_terms:
- proposed_name: methylenetetrahydromethanopterin dehydrogenase (NADP+) activity
  proposed_definition: Catalysis of the reaction 5,10-methylenetetrahydromethanopterin
    + NADP+ = 5,10-methenyl-5,6,7,8-tetrahydromethanopterin + NADPH.
  justification: MtdA has experimentally demonstrated NADP-dependent oxidation
    of methylene-H4MPT, but the existing methylenetetrahydromethanopterin dehydrogenase
    MF term (GO:0030268) is defined with coenzyme F420 as the electron acceptor, and
    GO:0018532 is obsolete. The H4F activity (GO:0004488) does not represent this
    additional substrate/cofactor combination. A reaction-based term is needed
    without ranking the physiological importance of the two activities.
  proposed_parent:
    id: GO:0016646
    label: oxidoreductase activity, acting on the CH-NH group of donors, NAD or
      NADP as acceptor
  supported_by:
  - reference_id: PMID:9765566
    supporting_text: The purified enzyme catalyzed the dehydrogenation of methylene
      H4MPT with NADP+ rather than with NAD+
    reference_section_type: ABSTRACT
suggested_questions:
- question: How does the balance between MtdA H4F-dependent assimilation and
    H4MPT-dependent oxidation vary with carbon source and intracellular
    methenyl-H4MPT concentration?
suggested_experiments:
- description: Construct conditional/depletion alleles of mtdA (since clean nulls
    appear non-viable) and perform 13C-formaldehyde flux tracing to quantify the relative
    contribution of MtdA to methenyl-H4MPT versus methenyl-H4F pools under methylotrophic
    and heterotrophic growth.
  hypothesis: MtdA depletion limits methylene-H4F supply for assimilation,
    with the phenotype modulated by its additional H4MPT-linked activity.
status: COMPLETE
