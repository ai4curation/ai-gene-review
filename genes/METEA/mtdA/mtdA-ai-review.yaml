  label: Methylorubrum extorquens AM1
description: >-
  mtdA encodes an NADP-dependent dehydrogenase with activity on one-carbon
  intermediates bound to H4MPT or H4F. It can oxidize methylene-H4MPT in
  the formaldehyde oxidation pathway. In the assimilatory H4F pathway,
  MtdA reduces methenyl-H4F to methylene-H4F, supplying the C1 substrate
  used by GlyA in the serine cycle. MtdB is the principal H4MPT-pathway
  dehydrogenase, while MtdA links oxidative and assimilatory C1 metabolism.
  Methenyl-H4MPT inhibits MtdA H4F activity, providing a mechanism for
  regulation between the two pathways. Higher in-vitro oxidative activity
  on H4MPT does not establish that reaction as its primary physiological role.
