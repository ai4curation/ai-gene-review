id: C5ASP3
gene_symbol: mxcE
product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  mxcE encodes the predicted response regulator of the MxcQE two-component
  system. Its receiver domain and C-terminal LuxR-type helix-turn-helix domain
  support phosphorelay and DNA-binding annotations, and AM1 promoter-reporter
  genetics place MxcQE upstream of the MxbDM two-component system in the
  methanol-oxidation regulatory cascade. Direct MxcQ-MxcE phosphotransfer,
  direct MxcE promoter binding, and the native MxcQE input signal remain
  unresolved.
existing_annotations:
- term:
    id: GO:0000160
    label: phosphorelay signal transduction system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      Correct. MxcE is the response regulator partner of the MxcQ sensor kinase
      by domain architecture and by placement of MxcQE as an upstream
      sensor-regulator pair for MxbDM expression. Direct AM1 MxcQ-to-MxcE
      phosphotransfer has not been biochemically reconstituted.
    action: ACCEPT
    supported_by:
    - reference_id: file:METEA/mxcE/mxcE-uniprot.txt
      supporting_text: DOMAIN          21..138
    - reference_id: PMID:9168623
      supporting_text: regulatory hierarchy in which the sensor-regulator pair
        MxcQE control expression of the sensor-regulator pair MxbDM
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: >-
      Correct as a domain-supported inference. MxcE has a C-terminal LuxR-type
      helix-turn-helix effector domain, consistent with DNA-binding response
      regulators. Direct binding of AM1 MxcE to any mxbDM, mxa or xox promoter
      has not been demonstrated, so this review does not propose a more specific
      transcription-activator MF.
    action: ACCEPT
    supported_by:
    - reference_id: file:METEA/mxcE/mxcE-uniprot.txt
      supporting_text: DOMAIN          160..225
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      Correct. Springer et al. found that mxbD promoter activity fell to
      non-detectable levels in an MxcE mutant, supporting a transcriptional role
      for the MxcQE system upstream of MxbDM in the methanol-oxidation regulatory
      hierarchy.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:9168623
      supporting_text: xylE expression was reduced to non-detectable levels in
        MxcQ and MxcE mutants
core_functions:
- description: >-
    Response-regulator activity in the MxcQE system upstream of MxbDM
    expression. MxcE has receiver and LuxR-type DNA-binding domains, and AM1
    genetics show that MxcQE is required for expression of the MxbDM
    sensor-regulator pair; the direct phosphorylation and promoter-binding
    mechanism remains unresolved.
  molecular_function:
    id: GO:0003677
    label: DNA binding
  directly_involved_in:
  - id: GO:0000160
    label: phosphorelay signal transduction system
  - id: GO:0006355
    label: regulation of DNA-templated transcription
  supported_by:
  - reference_id: file:METEA/mxcE/mxcE-uniprot.txt
    supporting_text: DOMAIN          21..138
  - reference_id: file:METEA/mxcE/mxcE-uniprot.txt
    supporting_text: DOMAIN          160..225
  - reference_id: PMID:9168623
    supporting_text: regulatory hierarchy in which the sensor-regulator pair
      MxcQE control expression of the sensor-regulator pair MxbDM
references:
- id: file:METEA/mxcE/mxcE-uniprot.txt
  title: UniProt entry for mxcE two component transcriptional regulator
  findings: []
- id: PMID:9168623
  title: Molecular analysis of mxbD and mxbM, a putative sensor-regulator pair required
    for oxidation of methanol in Methylobacterium extorquens AM1.
  findings:
  - statement: MxcQ and MxcE mutants lose detectable mxbD promoter activity, placing
      MxcQE upstream of the MxbDM two-component system.
    supporting_text: xylE expression was reduced to non-detectable levels in MxcQ
      and MxcE mutants
    reference_section_type: ABSTRACT
- id: PMID:26833413
  title: Lanthanide-Dependent Regulation of Methanol Oxidation Systems in Methylobacterium
    extorquens AM1 and Their Contribution to Methanol Growth.
  findings:
  - statement: MxcQE, MxbDM and MxaB are required for expression of the mxa operon,
      but the directness and sensed inputs of the systems were unresolved.
    supporting_text: two two-component systems (MxcQE and MxbDM) and an additional
      response regulator (MxaB) are required for expression of the mxa operon
    reference_section_type: OTHER
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms.
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods.
  findings: []
suggested_questions:
- question: Does phosphorylated MxcE bind directly to the mxbDM promoter, and what
    sequence does it recognize?
suggested_experiments:
- description: Test MxcQ-to-MxcE phosphotransfer biochemically and map binding of
    phosphorylated versus unphosphorylated MxcE on the mxbDM promoter by EMSA and
    DNase I footprinting.
  hypothesis: MxcQ phosphorylates MxcE, and phosphorylated MxcE directly activates
    mxbDM transcription by binding a defined promoter-proximal operator.
status: COMPLETE
