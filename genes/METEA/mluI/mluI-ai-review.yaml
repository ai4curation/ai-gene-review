id: C5B1I3
gene_symbol: mluI
product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  mluI (UniProt C5B1I3, locus MexAM1_META1p4131) encodes a predicted ECF
  sigma factor with sigma-70 regions 2 and 4. The primary methylolanthanin
  cluster study identifies mluI as META1p4131 in the mluARI uptake/regulatory
  region. Its domain architecture predicts association with core RNA
  polymerase and promoter recognition. The specific regulon, interaction
  with MluR, and response to lanthanide availability remain mechanistic
  inferences from family and operon context, not direct characterization.
