core_functions:
- description: >-
    Predicted ECF sigma-factor activity: association with core RNA polymerase
    to specify promoter recognition. The primary cluster paper maps mluI
    to META1p4131; a lanthanide-acquisition regulon is plausible from that
    operon context, but its target promoters and regulatory mechanism have
    not been demonstrated directly.
