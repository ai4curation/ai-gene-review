        reference_section_type: RESULTS
      - supporting_text: >-
          average increase in expression of 32-fold compared to growth with
          NdCl3
        reference_section_type: RESULTS
      - supporting_text: >-
          Deletion of mll decreased Nd bioaccumulation and adsorption
        reference_section_type: RESULTS
      - supporting_text: >-
