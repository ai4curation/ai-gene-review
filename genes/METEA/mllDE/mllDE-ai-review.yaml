          carrier protein / AsbE-like ligase fusion with a 5.8 log2 fold
          change and a 3.60E-209 BLAST hit to rhodopetrobactin gene Rpa1_2629.
        supporting_text: >-
          asbD-like aryl carrier protein and asbE-like ligase fusion
        reference_section_type: RESULTS
      - supporting_text: >-
          META1p4132-4135 (mllA, mllBC, mllDE, and mllF) are homologous
