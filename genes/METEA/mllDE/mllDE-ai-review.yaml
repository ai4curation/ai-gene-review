id: C5B1I6
gene_symbol: mllDE
product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: Carrier domain-containing protein (mllDE, locus MexAM1_META1p4134)
  belonging to the methylolanthanin (mll) biosynthetic gene cluster
  (META1p4129-META1p4138) of Methylorubrum extorquens AM1. UniProt assigns this
  436-residue protein a PROSITE CARRIER domain (PS50075) together with a
  phosphopantetheine-binding/ACP-like fold (Pfam PF00550 PP-binding; IPR009081)
  and a DUF6005 domain (Pfam PF19468). The primary methylolanthanin study maps
  META1p4134 to mllDE and describes it as an AsbD-like aryl carrier protein /
  AsbE-like ligase fusion in a cluster that produces methylolanthanin, a secreted
  lanthanide-binding metallophore ("lanthanophore"). By homology to AsbD, the
  phosphopantetheine-binding/ACP-like carrier role places mllDE within the core
  biosynthetic machinery. The DUF6005/AsbE-like region is a candidate ligase
  half of the fusion, but no separate molecular function is asserted for that
  region until MllDE's active residues and reaction chemistry are experimentally
  resolved. No source has biochemically characterized MllDE in isolation, so the
  current functional assignment is based on domain content plus cluster-level
  homology, deletion/overexpression, and ~32-fold lanthanide-induced expression
  evidence.
existing_annotations:
  - term:
      id: GO:0031177
      label: phosphopantetheine binding
    evidence_type: NAS
    review:
      summary: >-
        Reviewer-proposed molecular function. UniProt assigns this protein a
        CARRIER domain (PROSITE PS50075) and a PP-binding/ACP-like fold (Pfam
        PF00550, IPR009081), and the primary methylolanthanin paper maps mllDE
        to an asbD-like aryl carrier protein / asbE-like ligase fusion in the
        mll biosynthetic cluster. Phosphopantetheine binding is the
        best-supported molecular function for the ACP-like carrier domain.
      action: NEW
      reason: >-
        Best-supported molecular function from the UniProt carrier/PP-binding
        domain content, corroborated by the primary methylolanthanin paper's
        mapping of mllDE to an AsbD-like aryl carrier protein / AsbE-like
        ligase fusion. Holds the 4'-phosphopantetheine prosthetic group needed
        for carrier function in lanthanophore assembly.
      supported_by:
        - reference_id: file:METEA/mllDE/mllDE-uniprot.txt
          supporting_text: >-
            DR   Pfam; PF00550; PP-binding; 1.
        - reference_id: PMID:39078674
          supporting_text: >-
            asbD-like aryl carrier protein and asbE-like ligase fusion
  - term:
      id: GO:0044550
      label: secondary metabolite biosynthetic process
    evidence_type: NAS
    review:
      summary: >-
        Reviewer-proposed biological process. mllDE is an AsbD/AsbE-like
        member of the methylolanthanin (mll) biosynthetic gene cluster, whose
        deletion and overexpression alter production of methylolanthanin, a
        secreted lanthanide-binding metallophore. Methylolanthanin is a
        small-molecule secondary metabolite. GO has no "lanthanophore
        biosynthetic process" term, and the existing "siderophore biosynthetic
        process" term is explicitly Fe(III)-specific, so this general secondary
        metabolite biosynthesis term is the most accurate available process
        placement.
      action: NEW
      reason: >-
        Captures the pathway-level role of mllDE in biosynthesis of the
        methylolanthanin lanthanophore, supported by AsbD/AsbE-like domain
        homology in the primary paper and by whole-cluster metabolomics from
        mll deletion and overexpression strains. GO:0019290 (siderophore
        biosynthetic process) is too Fe(III)-specific for a product
        characterized as a lanthanide-binding metallophore with possible Fe/Ln
        dual chelation left unresolved by the primary paper.
      supported_by:
        - reference_id: PMID:39078674
          supporting_text: >-
            META1p4132-4135 (mllA, mllBC, mllDE, and mllF) are homologous
            to the well-studied petrobactin locus in B. subtilis, asbABCDEF
        - reference_id: PMID:39078674
          supporting_text: >-
            the putative mll product is differentially abundant across ΔmxaF,
            mll knockout, and mll overexpression samples
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: NAS
    review:
      summary: >-
        Reviewer-proposed localization inferred from the absence of a signal
        peptide or transmembrane region in the UniProt record (a cytoplasmic
        biosynthetic carrier protein). Note the deep research explicitly states
        that no source directly determines the subcellular localization of the
        mllDE gene product, so this assignment is a conservative inference rather
        than experimentally established.
      action: NEW
      reason: >-
        Reviewer-proposed, non-core localization. Plausible cytoplasmic site for
        a soluble biosynthetic carrier protein lacking signal/transmembrane
        features, but unverified experimentally; treated as non-core context
        rather than a core function.
      supported_by:
        - reference_id: file:METEA/mllDE/mllDE-deep-research-falcon.md
          supporting_text: >-
            No retrieved source directly determines the **subcellular
            localization** of the mllDE gene product
core_functions:
  - description: >-
      Acyl/aryl carrier protein (ACP-like) function: holds the
      4'-phosphopantetheine prosthetic group on the CARRIER/PP-binding domain to
      tether and shuttle biosynthetic intermediates during methylolanthanin
      assembly.
    molecular_function:
      id: GO:0031177
      label: phosphopantetheine binding
    supported_by:
