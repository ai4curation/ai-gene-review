product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  mxaB encodes an orphan response regulator in the mxaFJGIRSACKLDEHB methanol
  oxidation gene cluster. The protein has an N-terminal receiver domain with a
  predicted phosphoaspartate and a C-terminal LuxR-type helix-turn-helix domain,
  consistent with genetic evidence that MxaB regulates methanol oxidation and is
  required, with MxcQE and MxbDM, for expression of the Ca2+-dependent mxa
  methanol dehydrogenase operon. No adjacent sensor kinase was found in the
  original AM1 mxaB sequence analysis, and direct MxaB phosphorylation and
  promoter binding remain unresolved.
