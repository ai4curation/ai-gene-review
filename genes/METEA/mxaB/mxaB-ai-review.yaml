- id: PMID:12730156
  title: Methylotrophy in Methylobacterium extorquens AM1 from a genomic point of
    view.
  findings:
  - statement: The mxa methanol oxidation cluster contains mxaB and encodes the
      methanol dehydrogenase structural subunits, the specific cytochrome c electron
      acceptor, calcium-insertion proteins, and one regulatory protein.
    supporting_text: These genes encode the structural polypeptides of methanol
      dehydrogenase, the specific cytochrome c that accepts electrons from methanol
      dehydrogenase, the proteins essential for calcium insertion into the apoprotein,
      one regulatory protein, and a few proteins whose functions are still unknown
    reference_section_type: OTHER
- id: PMID:26833413
  title: Lanthanide-Dependent Regulation of Methanol Oxidation Systems in Methylobacterium
    extorquens AM1 and Their Contribution to Methanol Growth.
  findings:
  - statement: The MxcQE and MxbDM two-component systems plus MxaB are required for
      expression of the mxa operon, but the directness and sensed inputs of these
      regulators were unresolved.
    supporting_text: two two-component systems (MxcQE and MxbDM) and an additional
      response regulator (MxaB) are required for expression of the mxa operon
