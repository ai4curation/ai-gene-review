core_functions:
- description: >-
    MxaB is a response-regulator-family transcriptional regulator required for mxa
    methanol oxidation gene expression. Its receiver and LuxR-type HTH domains
    support phosphorelay/DNA-binding activity, and AM1 genetics place it in the
    regulator set needed for expression of the mxa operon; direct phosphorylation
    and promoter binding remain unresolved.
