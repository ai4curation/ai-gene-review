core_functions:
- description: >-
    Membrane sensor histidine kinase of the MxcQE two-component system. MxcQ is
    predicted to signal through a HAMP/HisKA/HATPase cytosolic transmitter, and
    AM1 promoter-reporter genetics place MxcQE upstream of the MxbDM
    sensor-regulator pair that controls methanol oxidation gene expression. The
    native sensed input and direct MxcQ-MxcE phosphotransfer remain unresolved.
