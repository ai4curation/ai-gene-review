id: C5ASP2
gene_symbol: mxcQ
product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  mxcQ encodes the membrane sensor histidine kinase component of the MxcQE
  two-component regulatory system. MxcQE is required for mxbDM expression in AM1
  and acts upstream of the MxbDM system that regulates methanol oxidation genes.
  The protein has predicted transmembrane helices plus HAMP, HisKA_3 and HATPase
  domains, supporting membrane-associated sensor-kinase activity. Direct MxcQ
  autophosphorylation, phosphotransfer to MxcE, the native sensed ligand and the
  proposed apo-XoxF interaction have not been demonstrated biochemically.
existing_annotations:
- term:
    id: GO:0000155
    label: phosphorelay sensor kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      Correct as a conserved-domain inference. MxcQ has the HisKA_3 and HATPase
      architecture of a sensor histidine kinase, and AM1 promoter-reporter
      genetics place the MxcQE sensor-regulator pair upstream of MxbDM. Direct
      autophosphorylation of purified MxcQ and phosphotransfer to MxcE remain
      unresolved.
    action: ACCEPT
    supported_by:
