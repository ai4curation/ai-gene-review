suggested_questions:
- question: What native periplasmic input is sensed by MxcQ, and does MxcQ
    phosphorylate MxcE directly?
suggested_experiments:
- description: Reconstitute MxcQ autophosphorylation and MxcQ-to-MxcE
    phosphotransfer in vitro with membrane-reconstituted MxcQ, and screen
    candidate methanol-oxidation or lanthanide-switch inputs for effects on
    kinase activity.
  hypothesis: MxcQ directly phosphorylates MxcE in response to a periplasmic
    signal from the methanol oxidation regulatory cascade.
