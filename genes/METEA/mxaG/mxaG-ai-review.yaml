    label: periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: >-
      Correct and core. UniProt assigns MxaG to the periplasm and annotates an
      N-terminal signal peptide, consistent with its function as the periplasmic
      cytochrome c_L partner of MxaFI.
    action: ACCEPT
    reason: The MxaG electron-transfer reaction is part of the periplasmic MxaFI
      methanol oxidation system.
    supported_by:
    - reference_id: file:METEA/mxaG/mxaG-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Periplasm'
- term:
