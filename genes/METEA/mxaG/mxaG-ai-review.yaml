id: P14774
gene_symbol: mxaG
product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  mxaG, also called moxG, encodes cytochrome c_L, the periplasmic c-type
  cytochrome electron acceptor for the Ca2+-dependent methanol dehydrogenase
  MxaFI. The protein is exported to the periplasm, binds one covalent heme c,
  and transfers electrons from reduced MxaFI into the respiratory electron
  transport chain during methanol oxidation. MxaG is encoded in the
  mxaFJGIRSACKLDEHB methanol oxidation cluster with the MxaFI structural
  subunits and Ca-insertion/accessory proteins.
existing_annotations:
- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      Correct but general. MxaG's iron is held in its covalent heme c, and the
      separately accepted heme binding annotation captures that molecular
      context more specifically than this generic iron-binding term.
    action: KEEP_AS_NON_CORE
    reason: GO:0020037 heme binding is the informative core cofactor-binding term.
    supported_by:
    - reference_id: file:METEA/mxaG/mxaG-uniprot.txt
      supporting_text: Binds 1 heme c group covalently per subunit
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      Correct and core. MxaG is the specific cytochrome c electron acceptor for
      MxaFI methanol dehydrogenase, accepting electrons from the enzyme after
      periplasmic methanol oxidation.
    action: ACCEPT
    reason: This is the primary molecular function of the gene product.
    supported_by:
    - reference_id: file:METEA/mxaG/mxaG-uniprot.txt
