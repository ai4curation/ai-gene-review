    summary: Correct but general. MxaG binds iron in heme c; the heme-binding
      annotation carries the specific molecular context.
    action: KEEP_AS_NON_CORE
    reason: This is a redundant generic parent of the heme binding annotation.
core_functions:
- description: >-
    MxaG is the cytochrome c_L electron acceptor for the Ca2+-dependent MxaFI
    methanol dehydrogenase system. The exported c-type cytochrome accepts
    electrons from reduced MxaFI after methanol oxidation to formaldehyde and
    transfers them onward through its covalent heme c.
