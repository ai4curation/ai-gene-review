    - reference_id: PMID:12730156
      supporting_text: the specific cytochrome c that accepts electrons from
        methanol dehydrogenase
- term:
    id: GO:0015945
    label: methanol metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      Correct and core. MxaG participates directly in methanol metabolism as the
      cytochrome c_L electron acceptor for the Ca-dependent MxaFI methanol
      dehydrogenase.
    action: ACCEPT
    reason: >-
      MxaG is genetically part of the mxa methanol dehydrogenase cluster and
      functionally feeds electrons from methanol dehydrogenase to downstream
