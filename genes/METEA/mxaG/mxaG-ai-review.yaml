    supported_by:
    - reference_id: file:METEA/mxaG/mxaG-uniprot.txt
      supporting_text: Acts in methanol oxidation
    - reference_id: PMID:12730156
      supporting_text: The genes enabling methanol oxidation in M. extorquens AM1
        are found in three different locations on the chromosome
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      Correct. MxaG covalently binds one heme c group through the c-type
      cytochrome CXXCH motif; that heme is the redox cofactor for electron
      transfer.
    action: ACCEPT
    reason: Heme c binding is intrinsic to the electron-transfer function.
    supported_by:
    - reference_id: file:METEA/mxaG/mxaG-uniprot.txt
      supporting_text: Binds 1 heme c group covalently per subunit
- term:
