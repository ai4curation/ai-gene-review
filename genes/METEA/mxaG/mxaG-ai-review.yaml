suggested_questions:
- question: Which AM1 cytochrome or terminal oxidase accepts electrons directly from
    MxaG in vivo after MxaFI-dependent methanol oxidation?
suggested_experiments:
- description: Reconstitute electron transfer from purified AM1 MxaFI through MxaG
    to candidate downstream cytochromes or oxidases, and verify the same handoff in
    vivo with deletion or depletion strains.
  hypothesis: MxaG donates electrons from reduced MxaFI to a defined downstream
    respiratory partner rather than to interchangeable periplasmic cytochromes.
