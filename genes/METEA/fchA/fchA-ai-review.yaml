      reference_section_type: ABSTRACT
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0162
  review:
    summary: UniProt subcellular-location mapping from a curator-inferred (ECO:0000305)
      "single-pass membrane protein" statement, itself based on a predicted transmembrane
      segment (residues 25-46, ECO:0000255). The X-ray structures resolve this segment
      as an internal helix (23-43) of the soluble up-and-down helical bundle, and the
      enzyme was purified from cell extract as an active homodimer.
    action: MARK_AS_OVER_ANNOTATED
    reason: The membrane claim rests only on a hydrophobicity-based TM prediction.
      The same residues form a core helix of the helical-bundle fold in the crystal
      structures, which were grown without detergent; the family (FTCD C-terminal
      domain) is a soluble domain; and the native enzyme was purified and characterized
      as a soluble-type homodimer. I could not read the full text of the purification
      paper to confirm soluble-fraction recovery, so the row is marked as over-annotated
      rather than removed. See notes for the structural argument.
    supported_by:
    - reference_id: file:METEA/fchA/fchA-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Membrane {ECO:0000305}; Single-pass membrane
    - reference_id: file:METEA/fchA/fchA-notes.md
      supporting_text: The predicted TM is most likely a hydrophobic core helix of
        the bundle.
- term:
    id: GO:0035999
    label: tetrahydrofolate interconversion
  evidence_type: IC
  review:
    summary: FchA catalyses the interconversion of two one-carbon-substituted H4F
      species (10-formyl-H4F and 5,10-methenyl-H4F), a step of the H4F C1-unit interconversion
      that links formate to methylene-H4F in M. extorquens AM1.
    action: NEW
    reason: GOA carries no process annotation for fchA. The enzyme itself performs
      a step of tetrahydrofolate interconversion (participation test passes; it is
      the catalyst, not a substrate), the same convention used for FolD/MTHFD-type
      cyclohydrolases. Genetic data show this H4F branch is required for C1 growth
      and carries most assimilatory flux.
    supported_by:
    - reference_id: PMID:10215859
      supporting_text: the methenyl-H4F cyclohydrolase an anabolic function in the
        C1-unit metabolism of M. extorquens AM1
      reference_section_type: ABSTRACT
    - reference_id: PMID:18502865
      supporting_text: only minor assimilation into biomass occurred in mutants lacking
        the methylene H4F synthesis pathway through formate
      reference_section_type: ABSTRACT
