  review:
    summary: EC/Rhea mapping (EC 3.5.4.9, RHEA:23700). The enzyme was purified from
      M. extorquens AM1, shown to be specific for methenyl-H4F over methenyl-H4MPT,
      and its gene identified by N-terminal sequencing; recombinant enzyme kinetics
      and crystal structures with bound H4F confirm the activity.
