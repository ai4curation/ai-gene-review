id: Q49135
gene_symbol: fchA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: fchA (originally orf4 of the serine-cycle gene cluster) encodes the tetrahydrofolate
  (H4F)-specific methenyl-H4F cyclohydrolase of Methylorubrum extorquens AM1, a homodimer
  of ~22 kDa subunits that interconverts 10-formyl-H4F and 5,10-methenyl-H4F. It is
  distinct from the methenyl-tetrahydromethanopterin cyclohydrolase Mch of the same
  organism and is unrelated in sequence to FolD-type cyclohydrolases, belonging instead
  to the cyclodeaminase/cyclohydrolase (FTCD C-terminal domain) helical-bundle family.
  Kinetics show that the cyclization direction (10-formyl-H4F to methenyl-H4F) is strongly
  favoured over hydrolysis, and crystal structures of the apo and H4F-bound enzyme
  define a substrate-binding site with three differently charged regions. In vivo,
  FchA acts in the assimilatory H4F branch that converts formate, via 10-formyl-H4F
  and methenyl-H4F, into methylene-H4F for the serine cycle; insertion mutants cannot
  grow on C1 compounds and, without glyoxylate, also fail on C2 compounds.
