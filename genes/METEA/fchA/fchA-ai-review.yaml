suggested_questions:
- question: Is FchA soluble cytoplasmic, as the helical-bundle crystal structure suggests,
    or does the predicted transmembrane segment (residues 25-46) mediate any membrane
    association in vivo?
- question: Should a GO process term exist for C1 assimilation via formate and the
    H4F pathway in serine-cycle methylotrophs, to which FchA, FtfL and MtdA could be
    annotated?
suggested_experiments:
- description: Fractionate M. extorquens AM1 cell extracts by ultracentrifugation
    and assay methenyl-H4F cyclohydrolase activity and FchA (immunoblot or tagged
    protein) in soluble versus membrane fractions; complement with fluorescent-protein
    fusion imaging.
  hypothesis: FchA is a soluble cytoplasmic enzyme and the predicted TM helix is
    a buried core helix.
