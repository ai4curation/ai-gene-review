core_functions:
- description: H4F-specific 5,10-methenyltetrahydrofolate cyclohydrolase that, in
    the assimilatory direction, cyclizes 10-formyl-H4F to 5,10-methenyl-H4F, part of
    the formate-to-methylene-H4F route supplying C1 units to the serine cycle in M.
    extorquens AM1.
