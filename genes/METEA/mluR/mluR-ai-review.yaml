    label: negative regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  review:
    summary: >-
      Retained as a non-core, IEA-derived logical consequence of sigma factor
      antagonist activity. PMID:39078674 maps META1p4130 to a putative
      anti-sigma factor in the mluARI region, and UniProt assigns the FecR Pfam
      family; by the general FecR/anti-sigma model, antagonizing a cognate ECF
      sigma factor negatively regulates that factor's target promoters under
      non-inducing conditions. AM1 lacks a direct assay of the MluR-MluI
      interaction or regulatory direction.
    action: KEEP_AS_NON_CORE
