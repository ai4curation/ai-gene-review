proposed_new_terms:
- proposed_name: PqqB hydroxylase activity
  proposed_definition: >-
    Catalysis of the O2-dependent hydroxylation of the tyrosine-derived aromatic
    ring of the cross-linked Glu-Tyr intermediate of pyrroloquinoline quinone
    biosynthesis.
  justification: >-
    GO:0016705 is a broad parent. A specific term would need the native substrate
    and product, which remain undefined; the term is proposed for when they are.
  supported_by:
  - reference_id: PMID:30811189
    supporting_text: Here we show evidence that the remaining essential biosynthetic enzyme PqqB is an iron-dependent hydroxylase catalyzing oxygen-insertion reactions that are proposed to produce the quinone moiety of the mature PQQ cofactor.
suggested_questions:
- question: What is the native PqqB substrate, the free cross-linked Glu-Tyr or a peptide-bound form, and how many oxygen insertions does PqqB perform on it?
suggested_experiments:
- hypothesis: PqqB hydroxylates the free cross-linked Glu-Tyr released by PqqF/PqqG and other proteases.
  description: Generate cross-linked PqqA with PqqD/PqqE, digest with PqqF/PqqG, and assay Fe2+-PqqB on the products with 18O2 and LC-HRMS.
  experiment_type: enzyme assay with isotope labeling and mass spectrometry
