  label: Methylorubrum extorquens AM1
aliases:
- pqqG
description: >-
  pqqB (MexAM1_META1p1750; called pqqG in the pre-1997 AM1 nomenclature) encodes
  PqqB, a metallo-beta-lactamase-fold non-heme iron hydroxylase of pyrroloquinoline
  quinone (PQQ) biosynthesis in Methylorubrum (Methylobacterium) extorquens AM1.
  Purified AM1 PqqB binds Fe2+ with higher affinity in the presence of
  cross-linked amino-acid substrate analogs and catalyzes O2-dependent aromatic
  ring hydroxylation of a Cys-DOPA mimic of a pathway intermediate, inserting one
  oxygen atom derived from molecular oxygen; these oxygen insertions are proposed to
  build the quinone moiety of mature PQQ. The native substrate is a PqqA-derived
  intermediate released after Glu-Tyr cross-linking and proteolysis, and the
  product is passed to PqqC for terminal ring closure. Mutants in this
  complementation group lack PQQ and cannot grow on methanol without added PQQ.
  An older proposal that PqqB transports PQQ or its precursor is not supported by
  the biochemistry.
