  review:
    summary: >-
      Correct and core. AM1 PqqB is the essential pathway hydroxylase that
      introduces oxygen into the PqqA-derived intermediate before PqqC acts, and
      AM1 mutants in this complementation group lack PQQ.
    action: ACCEPT
    reason: >-
      Direct biochemistry on the AM1 enzyme and AM1 genetics place PqqB in PQQ
      biosynthesis; the IEA row agrees.
    supported_by:
    - reference_id: PMID:30811189
      supporting_text: Here we show evidence that the remaining essential biosynthetic enzyme PqqB is an iron-dependent hydroxylase catalyzing oxygen-insertion reactions that are proposed to produce the quinone moiety of the mature PQQ cofactor.
    - reference_id: PMID:8132470
      supporting_text: Representatives of each complementation group were shown to lack detectable PQQ in the growth medium and in cell extracts and to contain methanol dehydrogenase polypeptides that were inactive.
- term:
    id: GO:0016705
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen
  evidence_type: IDA
  original_reference_id: PMID:30811189
  qualifier: enables
  review:
    summary: >-
      Proposed new molecular-function row. Purified AM1 PqqB, reconstituted with
      Fe2+, hydroxylates the aromatic ring of the substrate analog Cys-DOPA with an
      oxygen atom from O2 (18O2 labeling) and without H2O2 release. GO has no
      PqqB-specific hydroxylase term, so the broad oxygen-incorporating
      oxidoreductase parent is used, as for the KT2440 ortholog.
    action: NEW
    reason: >-
      Direct enzyme assay on this protein; GO:0016705 is the most specific
      existing term that does not assert an unproven donor or native product.
      The precise native substrate is still undefined, which is why a narrower
      monooxygenase or dioxygenase class is not chosen.
    supported_by:
    - reference_id: PMID:30811189
      supporting_text: indicating that the source of the inserted oxygen is from molecular O2
    - reference_id: PMID:30811189
      supporting_text: Only a single metal, Fe2+, is observed to undergo increase in affinity to Me PqqB in the presence of both Cys-Tyr (ca. 3-fold) and Cys-DOPA (ca. 10-fold), Fig. 2b.
