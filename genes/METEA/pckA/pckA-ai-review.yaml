id: C5B045
gene_symbol: pckA
product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  pckA encodes ATP-dependent phosphoenolpyruvate carboxykinase (PEPCK,
  EC 4.1.1.49), which converts oxaloacetate to phosphoenolpyruvate (PEP)
  by decarboxylation coupled to phosphoryl transfer from ATP. This cytoplasmic,
  manganese-dependent enzyme connects C4 intermediates with gluconeogenic
  precursor synthesis. AM1 pck deletion strains retain growth on methanol;
  their biomass yields are reduced in standard hypho medium, with effects
  depending on strain background and cobalt supplementation. PckA therefore
  contributes to carbon allocation and biomass yield rather than being
  universally essential for growth on C1 compounds.
