core_functions:
- description: >-
    ATP-dependent conversion of oxaloacetate to phosphoenolpyruvate provides
    a gluconeogenic connection between C4 metabolism and biosynthetic
    precursors. AM1 pck deletion strains can grow on methanol, with
    condition-dependent effects on biomass yield; the reaction is not an
    obligatory step for all methylotrophic growth conditions.
