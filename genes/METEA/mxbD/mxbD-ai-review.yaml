core_functions:
- description: >-
    Membrane sensor histidine kinase of the MxbDM two-component system. MxbD has
    HAMP and histidine-kinase domains and functions in a methanol-oxidation
    regulatory cascade in which MxcQE activates mxbDM expression and MxbDM is
    required for expression of the mxaF methanol dehydrogenase reporter. The
    native input and the biochemical MxbD-MxbM phosphotransfer step remain
    unresolved.
