  label: Methylorubrum extorquens AM1
description: >-
  mxbD encodes the membrane sensor histidine kinase of the MxbDM two-component
  system. Springer et al. showed that mxbDM is required for expression of an
  mxaF transcriptional fusion and that MxcQE controls mxbD promoter activity,
  placing MxbDM in the methanol-oxidation regulatory cascade. The predicted HAMP
  and histidine-kinase domains support histidine autokinase activity at the
  membrane, but the native signal, direct MxbD-MxbM phosphotransfer, and any
  interaction with lanthanide-free XoxF remain unresolved.
existing_annotations:
- term:
    id: GO:0000155
    label: phosphorelay sensor kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      Correct. MxbD is the sensor histidine kinase of the MxbDM two-component
      system; UniProt/InterPro annotate HAMP and histidine-kinase domains, and
      Springer et al. identified the AM1 gene as encoding a histidine protein
      kinase with two transmembrane domains. Direct AM1 autophosphorylation and
      phosphotransfer to MxbM have not been reconstituted.
    action: ACCEPT
    supported_by:
    - reference_id: file:METEA/mxbD/mxbD-uniprot.txt
      supporting_text: DOMAIN          305..527
    - reference_id: PMID:9168623
      supporting_text: The nucleotide sequence suggests that mxbD encodes a
        histidine protein kinase with two transmembrane domains
- term:
    id: GO:0000160
    label: phosphorelay signal transduction system
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      Correct. MxbD is the kinase half of the MxbDM sensor-regulator pair
      required for an mxaF reporter, and MxcQE is required for detectable mxbD
      promoter activity. This supports a phosphorelay role in a regulatory
      hierarchy for methanol oxidation genes; it does not identify the native
      input signal or prove a direct MxbD-MxbM phosphotransfer reaction.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:9168623
      supporting_text: mxbDM in Methylobacterium extorquens AM1 were shown to be
        required for expression of a xylE transcriptional fusion to the structural
        gene for the large subunit of methanol dehydrogenase (mxaF)
    - reference_id: PMID:9168623
      supporting_text: regulatory hierarchy in which the sensor-regulator pair
        MxcQE control expression of the sensor-regulator pair MxbDM
- term:
    id: GO:0004673
    label: protein histidine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  review:
    summary: >-
      Correct. The predicted HAMP and histidine-kinase domains and the 1997 AM1
      sequence analysis support MxbD as a protein histidine kinase. In vitro
      autophosphorylation of purified AM1 MxbD was not demonstrated in the
      retrieved literature, so the MF should be read as a conserved-domain
      inference rather than an assayed biochemical result.
    action: ACCEPT
    supported_by:
