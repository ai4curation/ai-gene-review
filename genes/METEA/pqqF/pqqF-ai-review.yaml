gene_symbol: pqqF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  pqqF (MexAM1_META1p2330) encodes the zinc-binding subunit of PqqF/PqqG, a
  two-component M16B metallopeptidase of pyrroloquinoline quinone (PQQ)
  biosynthesis in Methylorubrum (Methylobacterium) extorquens AM1. The 460-residue
  protein carries both M16 N-terminal and C-terminal domains and the inverzincin
  HxxEH zinc-binding motif with its proton-acceptor glutamate. Purified PqqF forms
  a heterodimer with the adjacent pqqG product (KD about 300 nM), and the complex
  rapidly cleaves the PqqA precursor peptide into smaller peptides with a marked
  preference for bonds at serine side chains. The complex is proposed to make the
  first cut that releases the PqqD/PqqE-cross-linked Glu-Tyr core from PqqA, with
  other cellular proteases completing release of the substrate for PqqB. This
  split-subunit protease is an alternative to the single-chain PqqF of
  Enterobacteria and Pseudomonas.
existing_annotations:
- term:
    id: GO:0004222
    label: metalloendopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001431
  - EC:3.4.24.55
  review:
    summary: >-
      Correct core activity, with one caveat on the unit. PqqF carries the M16
      HxxEH zinc site and proton-acceptor Glu85, and the purified PqqF/PqqG
      heterodimer cleaves PqqA rapidly. The cached abstract does not say whether
      PqqF alone is active, so the activity is best read as that of the complex,
      in which PqqF is the zinc-bearing subunit.
    action: ACCEPT
    reason: >-
      Direct biochemistry on the AM1 complex plus the conserved catalytic zinc
      motif on this subunit support metalloendopeptidase activity. PqqF carries
      the catalytic machinery (zinc ligands and proton acceptor), so the row is
      kept as enables rather than contributes_to; the zinc-free PqqG partner
      carries the contributes_to row. The EC 3.4.24.55
      (pitrilysin) supporting entity is a family-level EC; the native substrate is
      PqqA, not insulin.
    supported_by:
    - reference_id: PMID:31427437
      supporting_text: we isolated and characterized a two-component heterodimer protein from the α-proteobacterium Methylobacterium (Methylorubrum) extorquens that can rapidly catalyze cleavage of PqqA into smaller peptides.
    - reference_id: file:METEA/pqqF/pqqF-uniprot.txt
      record_section: ["FT:ACT_SITE"]
      supporting_text: /note="Proton acceptor"
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001431
  review:
    summary: >-
      Correct; the PqqF/PqqG complex cleaves PqqA. As for the KT2440 and Serratia
      PqqF orthologs this generic process is kept as non-core, with the pathway
      process GO:0018189 carrying the biological role.
    action: KEEP_AS_NON_CORE
    reason: True and as specific as GO allows for the cleavage itself; the informative biological context is PQQ biosynthesis.
    supported_by:
    - reference_id: PMID:31427437
      supporting_text: Analysis of time-dependent patterns for the appearance of proteolysis products indicates high specificity of PqqF/PqqG for serine side chains.
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011249
  review:
    summary: >-
      True but general. The metal is the catalytic zinc bound by the HxxEH motif
      (His82, His86) of the M16 inverzincin site.
    action: MODIFY
    reason: >-
      Refined to zinc ion binding, as for the KT2440 and Serratia PqqF orthologs;
      the UniProt site annotations name Zn(2+) as the ligand.
    proposed_replacement_terms:
    - id: GO:0008270
      label: zinc ion binding
    supported_by:
    - reference_id: file:METEA/pqqF/pqqF-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="Zn(2+)"
- term:
    id: GO:0018189
    label: pyrroloquinoline quinone biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:31427437
  qualifier: involved_in
  review:
    summary: >-
      Proposed new process row. The PqqF/PqqG complex performs the proteolytic
      step that excises the cross-linked core from PqqA, so PqqF does part of the
      work of PQQ biosynthesis rather than merely being required for it.
    action: NEW
    reason: >-
      The protease catalyzes a pathway step on the pathway substrate; the same
      process is carried by the KT2440 and Serratia single-chain PqqF orthologs.
    supported_by:
    - reference_id: PMID:31427437
      supporting_text: We hypothesize that PqqF/PqqG initially cleaves between the PqqE/PqqD-generated cross-linked form of PqqA, with nonspecific cellular proteases completing the release of a suitable substrate for the downstream enzyme PqqB.
