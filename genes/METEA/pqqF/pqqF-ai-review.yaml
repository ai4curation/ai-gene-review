suggested_questions:
- question: Is PqqF alone catalytically active on PqqA, or does activity require the PqqG partner as in other M16B heterodimers?
- question: Does PqqF/PqqG prefer cross-linked over unmodified PqqA in vitro?
suggested_experiments:
- hypothesis: Catalysis requires both subunits, with zinc only on PqqF.
  description: Assay PqqA cleavage by PqqF alone, PqqG alone and the complex, with HxxEH-to-AxxAA PqqF variants, and quantify bound zinc by ICP-MS.
  experiment_type: enzyme assay with mutagenesis and metal analysis
