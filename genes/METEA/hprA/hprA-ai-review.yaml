id: Q59516
gene_symbol: hprA
product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  hprA encodes hydroxypyruvate reductase (HPR; also named glycerate
  dehydrogenase, GDH, or HPR-A), a NAD(P)H-dependent oxidoreductase (EC
  1.1.1.29) that plays a central role in the serine cycle of methylotrophy. The
  enzyme catalyzes the reversible reduction of 3-hydroxypyruvate (formed by
  transamination of serine and glyoxylate) to D-glycerate, the step that pulls
  C1-derived carbon into the glycerate / 2-phosphoglycerate / PEP segment of
  central metabolism during formaldehyde assimilation. Genetic evidence in M.
  extorquens AM1 shows that an hprA insertion mutant loses the ability to grow
  on C1 compounds while retaining C2 growth, confirming HprA as a serine-cycle
  enzyme rather than a general essential enzyme or the C2 glyoxylate/glycolate
  interconversion enzyme. Purified AM1 HprA is a homodimer that can use NADH or
  NADPH and can reduce either hydroxypyruvate or glyoxylate in vitro, but it was
  not detectably able to oxidize glycolate to glyoxylate and kinetic data argued
  against activity-level regulation of the serine cycle at HprA. The enzyme
  belongs to the D-isomer specific 2-hydroxyacid dehydrogenase family and
  contains NAD(P)-binding Rossmann-fold domains.
