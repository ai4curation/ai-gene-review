core_functions:
- description: >-
    HprA catalyzes the NAD(P)H-dependent reduction of 3-hydroxypyruvate to
    D-glycerate, the second step of the serine cycle for formaldehyde
    assimilation. Hydroxypyruvate is generated by transamination of serine and
    glyoxylate; HprA connects that aminotransferase step to the glycerate /
    2-phosphoglycerate / PEP segment of central metabolism and is required for
    growth on C1 compounds. The enzyme functions as a homodimer in the cytoplasm
    and can utilize both NADH and NADPH as electron donors. Purified AM1 HprA can
    also reduce glyoxylate in vitro, but glycolate oxidation was not detected,
    and the hprA null phenotype indicates that a separate low-activity enzyme,
    not HprA, carries the glyoxylate/glycolate interconversion proposed for C2
    metabolism.
  molecular_function:
    id: GO:0016618
    label: hydroxypyruvate reductase [NAD(P)H] activity
