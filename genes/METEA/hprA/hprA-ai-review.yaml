suggested_questions:
- question: >-
    What is the identity and physiological role of the separate, low-activity
    AM1 hydroxypyruvate-reducing enzyme that can interconvert glyoxylate and
    glycolate in vitro?
suggested_experiments:
- description: >-
    Purify the low-activity glyoxylate/glycolate reductase detected in hprA
    null extracts, identify it by peptide mass spectrometry, and delete the
    encoding gene alone and in combination with hprA to test whether it
    contributes to growth on C2 compounds or only provides latent bypass
    capacity.
status: COMPLETE
