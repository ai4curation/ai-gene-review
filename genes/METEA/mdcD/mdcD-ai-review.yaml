id: C5APL4
gene_symbol: mdcD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens (strain ATCC 14718 / DSM 1338 / JCM 2805 / NCIMB
    9133 / AM1)
description: MdcD is the predicted beta subunit of the soluble, biotin-independent malonate decarboxylase
  system in Methylorubrum extorquens AM1. Together with MdcE it forms a crotonase-fold catalytic
  site that decarboxylates a malonyl group carried by the specialized acyl-carrier protein MdcC,
  regenerating acetyl-MdcC during malonate conversion to acetate and carbon dioxide. Its MdcD-specific
  family assignment and neighboring mdcA, mdcC and mdcE genes support this role; the detailed mechanism
  is inferred from experimentally characterized bacterial homologs.
