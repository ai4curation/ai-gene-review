references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro IPR017556 correctly identifies this as malonate decarboxylase beta subunit
  - statement: Correctly maps to carboxy-lyase activity (GO:0016831)
  - statement: Incorrectly maps to carbohydrate metabolic process (overly broad)
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings:
  - statement: Based on incorrect EC 6.4.1.3 in UniProt entry
  - statement: EC 6.4.1.3 is propionyl-CoA carboxylase (ligase), not the function of MdcD
  - statement: Correct EC should be 4.1.1.87 (malonyl-S-ACP decarboxylase) or 4.1.1.88 (complex)
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings:
  - statement: Ligase keyword (KW-0436) incorrectly assigned based on erroneous EC 6.4.1.3
  - statement: Transferase keyword (KW-0808) incorrectly assigned based on domain homology
- id: GO_REF:0000118
  title: TreeGrafter-generated GO annotations
  findings:
  - statement: PANTHER family PTHR42995 includes both ACC and MDC beta subunits
  - statement: Subfamily SF1 correctly identifies MALONATE DECARBOXYLASE BETA SUBUNIT
  - statement: TreeGrafter appears to have used broader family annotations rather than subfamily
- id: file:METEA/mdcD/mdcD-deep-research-falcon.md
  title: Deep research review of mdcD gene function
  findings:
  - statement: Comparative MdcD-MdcE mechanism decarboxylates the specialized ACP-bound malonyl group;
      AM1 assignment is inferential.
    supporting_text: conclusions for AM1 are inferred from conserved function across mdcD orthologs.
  - statement: The report distinguishes the physiological ACP substrate from weak in-vitro malonyl-CoA
      decarboxylation in Pseudomonas.
    supporting_text: malonyl-CoA can be a poor in vitro substrate in some systems but is not the
      native substrate.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Read fully. Conserved MdcD-MdcE mechanism and ACP specificity are supported by
      primary PMID:28757619. Target AM1 biochemistry was not found. Gene context, missing from the report,
      was independently checked; shared fold is not itself proof of retained ACC chemistry.
- id: PMID:19440302
  title: Methylobacterium genome sequences - a reference blueprint to investigate microbial metabolism
    of C1 compounds from natural and industrial sources
  findings:
  - statement: Source of the mdcD gene sequence (locus MexAM1_META1p0025) in Methylorubrum extorquens
      AM1
    supporting_text: 'The genome of M. extorquens AM1 totals 6.88 Mb and consists of five replicons:
      a chromosome of 5.51 Mbp (Acc. No. CP001510)'
- id: PMID:28757619
  title: Crystal structure of a Pseudomonas malonate decarboxylase holoenzyme hetero-tetramer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary Pseudomonas MdcD-MdcE and holoenzyme structure, biochemistry and growth
      experiments; full text inspected. Comparative mechanism for AM1, not a target assay. Attempts
      to delete MdcD itself were unsuccessful; do not claim an MdcD knockout phenotype.
- id: file:METEA/mdcD/mdcD-uniprot.txt
  title: UniProtKB C5APL4 malonate decarboxylase beta subunit
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: TIGR03133 and IPR017556 support MdcD identity; EC6.4.1.3 conflicts with that assignment.
      Neighboring target genes were independently checked in live UniProt and recorded in notes.
