- term:
    id: GO:0090410
    label: malonate catabolic process
  evidence_type: ISS
  original_reference_id: file:METEA/mdcD/mdcD-deep-research-falcon.md
  review:
    summary: This biological process annotation should be added. MdcD is part of the malonate decarboxylase
      complex (EC 4.1.1.88) which catalyzes the catabolism of malonate to acetate and CO2. This is
      the core biological process in which MdcD participates.
    action: NEW
    reason: The MdcD-specific family assignment and independently checked mdcA/C/D/E neighborhood in
      AM1 support transfer of the experimentally characterized bacterial malonate-degradation role.
      MdcD contributes the decarboxylation step itself, so this is participation rather than merely
      necessity or downstream metabolic association. The evidence remains ISS; no AM1 assay is claimed.
    supported_by:
    - reference_id: PMID:28757619
      supporting_text: The malonyl-ACP is decarboxylated in the second step of the reaction to regenerate
        acetyl-ACP
    - reference_id: file:METEA/mdcD/mdcD-notes.md
