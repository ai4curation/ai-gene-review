      inferred reaction is decarboxylation of specialized ACP-bound malonyl substrate; it is not the
      ATP/biotin-dependent acetyl-CoA-to-malonyl-CoA reaction. Shared carboxyltransferase-fold ancestry
      does not establish retained substrate or pathway identity.
