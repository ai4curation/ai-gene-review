- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: Malonate utilization is not established carbohydrate metabolism.
    action: REMOVE
    reason: The prior KEEP_AS_NON_CORE rationale cited only the possibility that acetate feeds central
      carbon metabolism. Malonate is a dicarboxylic acid and MdcD directly decarboxylates its ACP-bound
      derivative; no carbohydrate-processing step performed by MdcD is established. A downstream metabolite
      connection is insufficient for involvement in GO:0005975 as defined. This is a pathway-scope
      distinction, not rejection for breadth.
