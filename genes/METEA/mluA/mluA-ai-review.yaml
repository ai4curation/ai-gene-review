id: C5B1I1
gene_symbol: mluA
product_type: PROTEIN
taxon:
  id: NCBITaxon:272630
  label: Methylorubrum extorquens AM1
description: >-
  mluA (locus MexAM1_META1p4129) encodes a predicted TonB-dependent outer
  membrane receptor in the methylolanthanin cluster. Family and operon
  context support uptake of a metal-chelate substrate into the periplasm
  and suggest signaling with MluR/MluI. The exact ligand and signaling
  mechanism remain incompletely characterized. Lanthanide-related cluster
  phenotypes do not establish that iron-containing ligands are excluded.
