    summary: The TonB-dependent receptor family and mll-cluster context support
      a metal-chelate uptake role, but do not establish its exact ligand.
      Lanthanide involvement does not exclude iron transport. The primary
      methylolanthanin study discusses possible dual Fe/Ln biology without
      establishing iron-specific transport by MluA.
