    reason: >-
      Inherits the error of the parent GO:0046933 annotation. Salmonella FliI ATPase activity
      is insensitive to F-type ATPase inhibitors, and the proton flux of the flagellar export
      machinery runs through the export gate (FlhA and partners), which acts as a
      proton-protein antiporter; nothing in this system couples proton flow to ATP formation
      by FliI. No H. pylori-specific evidence suggests otherwise.
    supported_by:
