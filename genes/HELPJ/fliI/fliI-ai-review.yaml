- term:
    id: GO:0030254
    label: protein secretion by the type III secretion system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005714
  review:
    summary: >-
      The flagellar export apparatus is a type III secretion system; H. pylori fliI mutants
      fail to export/assemble flagellar axial proteins (aflagellate, reduced flagellin and
      hook), and FliI directly binds the FliH regulator and the FlgN export chaperone.
    action: ACCEPT
    reason: >-
      FliI does part of the work of type III export (substrate/chaperone docking and
      ATP-dependent release at the gate), so the process term is appropriate. The organismal
      evidence is from H. pylori strains N6 and CCUG 17874, not J99, but the gene is
      conserved within the species.
    supported_by:
    - reference_id: PMID:9231413
      supporting_text: An isogenic mutant of fliI was non-motile and synthesised reduced
        amounts of flagellin and hook protein subunits.
    - reference_id: PMID:38151822
      supporting_text: Hence the data indicate that FlgN, like FliT, interacts strongly with
        the flagellum ATPase FliI.
