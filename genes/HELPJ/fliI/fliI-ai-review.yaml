- term:
    id: GO:0046933
    label: proton-transporting ATP synthase activity, rotational mechanism
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002689426
  review:
    summary: >-
      TreeGrafter transfer of the F1-beta catalytic-subunit function to FliI. The graft node
      PTN002689426 is, per QuickGO, used only for GO:0046933 IEA rows on epsilonproteobacterial
      FliI proteins (Helicobacter, Campylobacter, Arcobacter and relatives), i.e. the target
      sits in a FliI subfamily (PTHR15184:SF9, type III secretion ATPase) and has inherited a
      term that belongs to the F1-beta lineage of the PTHR15184 tree.
    action: REMOVE
    reason: >-
      The term requires ATP synthesis from ADP and Pi driven by rotary proton transport
      through a membrane Fo sector. FliI is a soluble ATP-consuming export ATPase: its
      activity is insensitive to F-type ATPase inhibitors, it has no Fo partner, and in the
      flagellar export system protons are conducted by the membrane export gate (a
      proton-protein antiporter), with FliH-FliI-FliJ only boosting gate efficiency. The
      structural homology (F1-alpha/beta-like FliI hexamer around a gamma-like FliJ stalk)
      is real and a rotary mechanism for the FliI6-FliJ ring has been proposed, but even
      that model is one of ATP hydrolysis driving substrate handling, not proton transport
      or ATP synthesis. The node placement is therefore the error: ATP-synthase function
      arose in the F1-beta clade, and the FliI/SctN subfamily to which the target belongs
      diverged to protein-export function. REMOVE rather than MARK_AS_OVER_ANNOTATED
      because both halves of the term (ATP synthesis; proton transport) are contradicted
      for FliI itself. UniProt's companion EC 7.1.2.2 / "Flagellum-specific ATP synthase"
      name is the same family-signature error; EC 7.4.2.8 (protein-secreting ATPase) fits.
    supported_by:
    - reference_id: PMID:8943245
      supporting_text: The activity was not affected by inhibitors of the F-, V- or P-type
        ATPases
    - reference_id: PMID:17202259
      supporting_text: These results imply an evolutionary relation between the flagellum
        and F0F1-ATPsynthase and a similarity in the mechanism between FliI and F1-ATPase
        despite the apparently different functions of these proteins.
    - reference_id: PMID:21934659
      supporting_text: the export gate complex by itself is a proton-protein antiporter that
        uses the two components of proton motive force
    - reference_id: PMID:18216859
      supporting_text: the flagellar secretion apparatus functions as a proton-driven protein
        exporter and that ATP hydrolysis is not essential for type III secretion
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002689426
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          TreeGrafter graft node; QuickGO lists it only as WITH/FROM for GO:0046933 IEA
          rows on epsilonproteobacterial FliI proteins. The ATP-synthase term originates
          from the F1-beta lineage of PTHR15184 and should not reach the FliI/SctN
          (SF9-type) subfamily.
      residue_claims_not_applicable: >-
        The argument is loss of the Fo-coupled synthase context and divergence to protein
        export, not a point-residue change; FliI retains the catalytic Walker residues and
        hydrolyses ATP.
- term:
    id: GO:0008564
    label: protein-exporting ATPase activity
  evidence_type: ISS
  original_reference_id: PMID:8943245
  qualifier: enables
  review:
    summary: >-
      FliI couples ATP hydrolysis to the handling of flagellar export substrates at the type
      III export gate (docking, chaperone release, gate activation). The GO definition
      explicitly covers ATP-hydrolysing enzymes of the Type III pathway.
    action: NEW
    reason: >-
      Most specific supported molecular function; missing from the GOA set, which instead
      carries the incorrect ATP-synthase term. Transferred from Salmonella FliI (functionally
      complementing His-FliI ATPase; Walker mutants block assembly) and supported by H.
      pylori fliI mutant phenotypes and FliI-FliH/FlgN interactions. Corresponds to EC
      7.4.2.8.
    supported_by:
    - reference_id: PMID:8943245
      supporting_text: Mutations K188I and Y363S decreased the ATPase activity about 100-fold,
        increased the Km about 10-fold, blocked flagellar assembly, and were dominant.
    - reference_id: PMID:18216858
      supporting_text: the energy of ATP hydrolysis being used to disassemble and release the
        FliH-FliI complex from the protein about to be exported
- term:
    id: GO:0044780
    label: bacterial-type flagellum assembly
  evidence_type: ISS
  original_reference_id: PMID:9231413
  qualifier: involved_in
  review:
    summary: >-
      Isogenic fliI mutants of H. pylori (strains N6 and CCUG 17874) are non-motile and
      almost completely aflagellate with reduced flagellin and hook.
    action: NEW
    reason: >-
      Participation test: FliI performs part of the work of flagellum assembly by
