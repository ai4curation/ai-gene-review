gene_symbol: fliI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85963
  label: Helicobacter pylori (strain J99 / ATCC 700824)
description: >-
  FliI is the soluble, cytoplasmic ATPase of the flagellar type III protein export
  apparatus of Helicobacter pylori. It belongs to the FliI/YscN (SctN) family of type III
  secretion ATPases, which share the fold of the F1-ATP synthase alpha/beta subunits and
  assemble into ATP-dependent homohexameric rings around the gamma-like stalk protein FliJ.
  FliI binds the regulator FliH through its N-terminal amphipathic helix and is recruited
  with FliH to the cytoplasmic face of the flagellar basal body below the membrane export
  gate. There it hydrolyses ATP to capture chaperone-substrate complexes (including the
  FlgN-FlgK junction-protein complex), release chaperones and promote entry of rod, hook
  and filament subunits into the export gate, which itself uses the proton motive force
  to translocate the substrates. H. pylori fliI mutants are non-motile and almost entirely
  aflagellate, with reduced flagellin and hook protein. FliI is an ATP-consuming protein
  export ATPase; despite its UniProt name it does not synthesise ATP or translocate protons.
