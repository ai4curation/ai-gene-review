      supporting_text: The activity was not affected by inhibitors of the F-, V- or P-type
        ATPases
    - reference_id: PMID:21934659
      supporting_text: the export gate complex by itself is a proton-protein antiporter that
        uses the two components of proton motive force
    - reference_id: file:HELPJ/fliI/fliI-deep-research-falcon.md
