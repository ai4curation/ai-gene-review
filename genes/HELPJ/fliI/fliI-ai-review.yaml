    label: proton motive force-driven ATP synthesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0046933
  review:
    summary: >-
      Logical inference (GO_REF:0000108) from the TreeGrafter GO:0046933 row. FliI does not
      synthesise ATP: it is an ATP-hydrolysing export ATPase with no Fo proton-channel
      partner, and in the flagellar system the proton motive force is consumed by the
      membrane export gate to drive protein translocation, not to make ATP.
    action: REMOVE
    additional_reference_ids:
