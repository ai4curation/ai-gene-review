      required. Comparator check: flagellar export apparatus components (FliI orthologs in
      other reviews in this repository, FlhA, FliH) carry flagellum assembly. Evidence is
      from same-species strains other than J99, hence ISS rather than IMP.
    supported_by:
    - reference_id: PMID:9231413
      supporting_text: The majority (> 99%) of mutant cells were completely aflagellate.
    - reference_id: PMID:10225855
      supporting_text: Engineered fliI and fliQ mutant strains were completely aflagellate
