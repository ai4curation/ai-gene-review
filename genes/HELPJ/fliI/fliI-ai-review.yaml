suggested_questions:
- question: >-
    Which PANTHER node carries the GO:0046933 assertion that TreeGrafter grafts onto the
    epsilonproteobacterial FliI node PTN002689426, and can the PAINT annotation be restricted
    (or a NOT/loss asserted) so that the FliI/SctN subfamilies of PTHR15184 no longer inherit
    ATP-synthase activity?
- question: >-
    Should UniProt revise the "Flagellum-specific ATP synthase" name, EC 7.1.2.2 and
    proton-translocase FUNCTION text for H. pylori FliI (Q9ZJJ3, O07025) to "flagellar
    export ATPase", EC 7.4.2.8?
- question: >-
    Does H. pylori FliI form ATP-dependent hexamers in vitro, and which protein (HP0256 has
    been proposed) serves as its FliJ central stalk?
suggested_experiments:
- description: >-
    Measure ATPase kinetics of purified H. pylori FliI (wild type vs Walker-motif mutant) with
    and without FliH and FlgN, and test hexamerization by negative-stain EM with ATP analogues.
- description: >-
    Complement a J99 fliI deletion with catalytically dead FliI and assess flagellin export and
    motility, to test whether H. pylori, like Salmonella, retains residual PMF-driven export
    without FliI ATPase activity.
