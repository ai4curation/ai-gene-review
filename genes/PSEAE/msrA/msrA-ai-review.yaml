taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  MsrA (PA5018) is the peptide methionine (S)-sulfoxide reductase of Pseudomonas
  aeruginosa (EC 1.8.4.11), a cytoplasmic repair enzyme that reduces the S
  epimer of methionine sulfoxide in oxidised proteins (and free methionine
  sulfoxide) back to methionine, using thioredoxin as the reductant and a
  catalytic cysteine. It acts alongside MsrB, which reduces the R epimer. msrA is
  expressed constitutively at a high level throughout growth, unlike the
  oxidant-inducible msrB. msrA mutants are more sensitive to hypochlorite and
  H2O2, are paradoxically more resistant to paraquat, and are attenuated in a
  Drosophila infection model.
references:
- id: PMID:23687271
  title: Gene expression and physiological role of Pseudomonas aeruginosa methionine
    sulfoxide reductases during oxidative stress.
  findings:
  - statement: msrA mutants are less resistant to NaOCl and H2O2.
    supporting_text: rendered the mutants less resistant than the parental PAO1 strain
      to oxidants such as NaOCl
  - statement: Plasmid msrA fully complements the NaOCl sensitivity of the msrA mutant.
    supporting_text: pBBR msrA and pBBR msrB plasmids fully complemented the NaOCl-sensitive
      phenotypes of msrA and msrB mutants to resistance levels attained by the parental
      strain
  - statement: msrA is expressed constitutively at a high level.
    supporting_text: The msrA gene is expressed constitutively at a high level throughout
      all growth phases
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP rows (GO:0034599, GO:1901530); full text read
      (PMC3719549). The mutant phenotypes and complementation directly support
      both process terms. No enzyme assay is reported.
