        source_status: SUPPORTS_TRANSFER
        comment: >-
          Membrane location is a family-wide property of polytopic AT3
          acyltransferases; appropriate at this deep node.
      - source_id: WB:WBGene00044617
        source_label: C. elegans AT3 seed
        source_status: SUPPORTS_TRANSFER
