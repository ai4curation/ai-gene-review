core_functions:
- description: >-
    Membrane-bound acyltransferase-3 family enzyme, predicted O-acyltransferase
    (probably O-acetyltransferase), that modifies the CPA D-rhamnan O antigen of
    lipopolysaccharide. It sets the structure of the polymer and is not needed for
    its assembly or export.
