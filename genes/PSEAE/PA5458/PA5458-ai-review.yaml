id: Q9HTB2
gene_symbol: PA5458
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5458 is a polytopic integral inner-membrane protein of the acyltransferase-3
  (AT3, Pfam PF01757) family, with nine predicted transmembrane helices. It is
  encoded in the pa5455-pa5459 operon next to the common polysaccharide antigen
  (CPA) biosynthesis locus pa5447-pa5454, and the CPA locus is now taken to span
  all 13 genes. CPA is the D-rhamnan O polysaccharide attached to P. aeruginosa
  lipopolysaccharide. An in-frame pa5458 deletion still makes CPA, but the polymer
  runs at shifted, more diffuse positions on SDS-PAGE and binds the CPA-specific
  monoclonal antibody N1F10 more weakly. Overexpression lowers CPA amount and
  shortens its chains slightly. PA5458 is therefore thought to be the
  membrane-bound O-acyltransferase (probably an O-acetyltransferase) that decorates
  CPA. Acetylation of CPA by PA5458 has not been shown chemically or
  enzymatically. Related AT3 proteins O-acetylate other cell-surface glycans, such
  as peptidoglycan (Staphylococcus aureus OatA) and O antigen (Salmonella OafA).
references:
- id: PMID:23341552
  title: Five new genes are important for common polysaccharide antigen biosynthesis
    in Pseudomonas aeruginosa.
  findings:
  - statement: The pa5455-pa5459 cluster, adjacent to the CPA locus, is required for
      CPA biosynthesis.
    supporting_text: Here we demonstrate that an adjacent five-gene cluster pa5455-pa5459
      is also involved
  - statement: PA5458 carries a conserved acetyltransferase domain (sequence analysis
      only).
    supporting_text: The pa5458 gene encodes a protein with a conserved acetyltransferase
      domain.
  - statement: The pa5458 in-frame deletion still produces CPA, but with altered migration
      and weaker monoclonal antibody binding, i.e. a structurally different polymer.
    supporting_text: Mutation of the putative acetyltransferase-encoding gene pa5458
      did not abrogate polysaccharide production
  - statement: The mutant CPA bands are shifted and diffuse.
    supporting_text: When the run time of SDS-PAGE was increased, it was clear that
      the bands produced by the mutant were shifted relative to the positions of bands
      produced by the wild type, and the bands also appeared to be more diffuse
  - statement: Authors interpret PA5458 as modifying CPA structure, consistent with
      reported acetyl substitutions, and not as required for polymer assembly.
    supporting_text: its function is clearly not required for assembly and processing
      of the polysaccharide, although the mutant produces CPA with a different structure,
      which is consistent with previous reports of the presence of acetylation substitutions
      in the sugars of CPA
  - statement: Overexpression modestly reduces CPA amount and chain length.
    supporting_text: Overexpression of the putative acetyltransferase resulted in a
      modest reduction in the amount of CPA produced and a subtle shift in the chain
      length distribution
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for both process rows (GO:0009103 IMP, GO:0009243 IDA) and
      the sole seed of two PAINT IBDs. Full text cached (PMC3560663). The data are
      in-frame deletion, complementation and arabinose-induced overexpression with
      LPS analysed by SDS-PAGE, silver stain and Western blot. They support a role
      in determining CPA (O antigen) structure. There is no direct biochemical
      assay, so IDA is the wrong evidence code for the O antigen row, and
      acetyltransferase activity is a prediction.
- id: PMID:15661003
  title: Why are pathogenic staphylococci so lysozyme resistant? The peptidoglycan
    O-acetyltransferase OatA is the major determinant for lysozyme resistance of Staphylococcus
    aureus.
  findings:
  - statement: S. aureus OatA, an AT3-family integral membrane protein in the same PAINT
      node (PTN000546841) as PA5458, O-acetylates peptidoglycan muramic acid.
    supporting_text: the muramic acid of the oatA mutant lacked this modification
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Used as a comparator: a characterised member of the
      PTN000546841 clade acts on peptidoglycan in a Gram-positive bacterium that
      makes no LPS, which shows the clade-wide LPS IBD is wrong.
