  review:
    summary: >-
      PseudoCAP IMP, and the sole seed of two IBDs: GO:0009103 at PTN000546841 and,
      generalised, GO:0000271 at PTN000546715. The in-frame deletion still makes
      CPA but changes its structure (shifted, diffuse bands and weaker MAb N1F10
      binding), and complementation reverses the shift. This fits PA5458 modifying
      the polymer itself. It is more than a requirement phenotype, and the paper
      supports involvement in LPS O-antigen biosynthesis for this gene.
    action: MODIFY
    reason: >-
      The seed is sound for PA5458 but under-specific. The affected polymer is the
      CPA O polysaccharide, so GO:0009243 O antigen biosynthetic process (is_a
      GO:0009103), which the gene already carries from the same paper, is the
      precise term. Refining the row does not change the problems with the IBDs.
      Those concern node placement: one Gram-negative O-antigen seed propagated to
      LPS-less Gram-positive bacteria (PTN000546841) and to nematode and oomycete
      proteins (PTN000546715). They are recorded as GO_CENTRAL defects.
    proposed_replacement_terms:
