suggested_questions:
- question: >-
    Is the PTN000546841 node (which mixes Gram-negative O-antigen acyltransferases
    such as PA5458 and Salmonella OafA with Gram-positive peptidoglycan
    O-acetyltransferases such as OatA) better annotated with a cell-surface glycan
    modification term, with GO:0009103 restricted to a Gram-negative subclade?
suggested_experiments:
- description: >-
    Compare CPA purified from wild type and the pa5458 deletion by NMR and mass
    spectrometry to identify the missing acyl substituent and its sugar position.
    Then test acyl-CoA dependent transfer by the purified or membrane-reconstituted
    protein to establish the activity directly.
  experiment_type: structural and biochemical analysis
