- term:
    id: GO:0016020
    label: membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000546715
  - WB:WBGene00044617
  review:
    summary: >-
      IBA from the membrane IBD at PTN000546715, seeded by a C. elegans AT3
      protein. This IBD is independent of the PseudoCAP seed. Membrane location is
      sound for the whole AT3 family (polytopic integral membrane proteins), and
      PA5458 has nine predicted TM helices. The S. aureus homologue OatA is
      described as an integral membrane protein.
    action: MODIFY
    reason: >-
      Correct but general. In a Gram-negative bacterium a polytopic alpha-helical
      protein with no signal for the outer membrane sits in the cytoplasmic (inner)
      membrane. There the AT3 O-acyltransferases modify glycans on their way to the
      periplasm. So GO:0005886 plasma membrane is the supported specific term.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
