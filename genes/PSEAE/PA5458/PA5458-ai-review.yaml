        The PAINT IBD of GO:0000271 polysaccharide biosynthetic process at
        PTN000546715 (PTHR23028, acyltransferase-3) has a single seed, the PseudoCAP
        rows for P. aeruginosa PA5458 (Q9HTB2; GO:0009103 IMP and GO:0009243 IDA,
