taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  parE (PA4967) encodes ParE, the B subunit of DNA topoisomerase IV. ParE forms a ParC2ParE2 heterotetramer
  with ParC (PA4964). ParE carries the GHKL ATPase (HATPase_c) and Toprim domains and supplies ATP-driven
  strand-passage energy, while ParC performs DNA binding, cleavage and rejoining. Topoisomerase IV is
  a type IIA topoisomerase that makes a transient double-strand break, passes a second duplex through
  it and reseals it. Its main role is decatenating replicated daughter chromosomes so that they can segregate;
  it also relaxes supercoiled DNA but does not introduce negative supercoils. P. aeruginosa topoisomerase
  IV, reconstituted from separately purified ParC and ParE, shows ATP-dependent decatenation and relaxation
  activity but no supercoiling activity. It is a secondary target of fluoroquinolones, being 5-8 times
  less sensitive than DNA gyrase.
