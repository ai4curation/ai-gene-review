suggested_questions:
- question: >-
    Do ParE mutations contribute to fluoroquinolone resistance in clinical P. aeruginosa isolates once
    gyrA/gyrB mutations are present, as expected for a secondary target?
suggested_experiments:
- description: >-
    Measure decatenation by topoisomerase IV reconstituted with ParE variants from resistant clinical
    isolates, alongside fluoroquinolone IC50 values.
