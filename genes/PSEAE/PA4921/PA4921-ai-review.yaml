existing_annotations:
- term:
    id: GO:0004104
    label: cholinesterase activity
  evidence_type: IDA
  original_reference_id: PMID:22192836
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA and one of two seeds of the PTN005219546 carboxylic ester hydrolase
      IBD. The purified recombinant enzyme hydrolyses acetyl- and propionylthiocholine.
    action: ACCEPT
    reason: >-
      Seed verdict SOUND. Purified-enzyme kinetics directly support cholinesterase
      activity; whether the physiological substrate is acetylcholine or propionylcholine is
      unresolved, so this parent term is the right level rather than GO:0003990.
    supported_by:
    - reference_id: PMID:22192836
      supporting_text: >-
        Acetylthiocholine (ATC) and propionylthiocholine (PTC) are substrates of this
        enzyme, but butyrylcholine is an inhibitor.
    - reference_id: PMID:22192836
      supporting_text: >-
        Studies performed with the purified recombinant enzyme indicated that the substrate
        saturation curves and the catalytic mechanism are similar to those properties
        described for mammalian AchEs.
- term:
    id: GO:0008610
    label: lipid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN005219546
  - UniProtKB:O33407
  review:
    summary: >-
      IBA from the PTN005219546 GO:0008610 IBD, whose only seed is EstA (O33407); PA4921 is
      not a seed of this term.
    action: REMOVE
    reason: >-
      The EstA seed records that an estA deletion makes little rhamnolipid, a necessity
      phenotype of an outer-membrane esterase, not participation in lipid synthesis. Even
      if it held for EstA, nothing links ChoE, a secreted cholinesterase, to lipid
      biosynthesis. The node-level GO_CENTRAL defect is recorded once in the estA review
      (genes/PSEAE/estA); not repeated here.
    supported_by:
    - reference_id: PMID:17631636
      supporting_text: >-
        This report is focused on the influence of the outer membrane-bound esterase EstA of
        P. aeruginosa PAO1 on rhamnolipid production.
    - reference_id: PMID:22192836
      supporting_text: >-
        this work demonstrates that the PA4921 gene of the Pseudomonas aeruginosa PAO1 genome
        is a gene responsible for cholinesterase (ChoE) activity
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
