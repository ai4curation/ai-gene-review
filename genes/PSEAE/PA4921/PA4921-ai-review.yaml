    supporting_text: >-
      this work demonstrates that the PA4921 gene of the Pseudomonas aeruginosa PAO1 genome
      is a gene responsible for cholinesterase (ChoE) activity
  - statement: Acetyl- and propionylthiocholine are substrates of the purified enzyme.
    supporting_text: >-
      Acetylthiocholine (ATC) and propionylthiocholine (PTC) are substrates of this enzyme,
      but butyrylcholine is an inhibitor.
  reference_review:
