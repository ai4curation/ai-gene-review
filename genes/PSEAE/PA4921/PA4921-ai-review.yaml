        source_status: SOURCE_BAD
        comment: >-
          Sole-seeded process IBD on a GDSL esterase node of 960 leaves; see the estA
          review for the GO_CENTRAL defect.
      - source_id: UniProtKB:O33407
        source_label: EstA (sole seed)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          UniProt IMP GO:0008610 from PMID:17631636, a rhamnolipid-deficiency phenotype of
          an estA deletion. It does not show participation, and does not transfer to a
          cholinesterase.
