core_functions:
- description: >-
    Secreted SGNH/GDSL-family cholinesterase that hydrolyses acetylcholine-type choline
    esters (acetyl- and propionylthiocholine) through a Ser-His catalytic mechanism.
  molecular_function:
    id: GO:0004104
    label: cholinesterase activity
  supported_by:
  - reference_id: PMID:22192836
    supporting_text: >-
      this work demonstrates that the PA4921 gene of the Pseudomonas aeruginosa PAO1 genome
      is a gene responsible for cholinesterase (ChoE) activity
suggested_questions:
- question: >-
    Is the physiological substrate acetylcholine (host-derived) or propionylcholine, and
    does ChoE contribute choline for osmoprotection or carbon/nitrogen nutrition in vivo?
suggested_experiments:
- description: >-
    Compare growth and choline uptake of a PA4921 deletion and complemented strains on
    acetylcholine as sole carbon/nitrogen source, and measure kcat/Km for acetylcholine
    versus propionylcholine with the purified enzyme.
