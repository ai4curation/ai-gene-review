taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4921 (ChoE) is a 307-aa SGNH/GDSL-family hydrolase of Pseudomonas aeruginosa with an
  N-terminal signal peptide, and is the enzyme responsible for the cholinesterase
  activity of strain PAO1. The purified recombinant enzyme hydrolyses acetylthiocholine
  and propionylthiocholine, with substrate inhibition and kinetics resembling mammalian
  acetylcholinesterases, and also hydrolyses p-nitrophenyl propionate and butyrate less
  efficiently; butyrylcholine is an inhibitor. Through its acyl-enzyme intermediate it
  can also transfer acetyl groups to amines and alcohols. Many crystal structures of the
  mature enzyme are available. ChoE is thought to let the bacterium release choline
  from host acetylcholine.
