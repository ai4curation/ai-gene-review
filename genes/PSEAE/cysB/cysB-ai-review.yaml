- id: PMID:9218775
  title: Cloning, sequence and mutagenesis of the structural gene of Pseudomonas aeruginosa
    CysB, which can activate algD transcription.
  findings:
  - statement: CysB (cloned from mucoid strain CHA) binds the algD promoter, and a cysB insertion mutant is
      a cysteine auxotroph unable to form the specific palgD complex.
    supporting_text: Thus, P. aeruginosa CysB can act as an activator of algD expression.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: Cited by PseudoCAP for GO:0019344 (IMP). PubMed record matches; abstract only in the
      cache. The paper supports CysB as a DNA-binding activator; the cysteine auxotrophy it reports is a
      regulator-mutant phenotype and does not support participation in L-cysteine biosynthesis. Work was in
      strain CHA, not PAO1.
