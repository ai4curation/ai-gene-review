taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: cysB (PA1754) encodes CysB, a LysR-type transcriptional regulator with an N-terminal
  helix-turn-helix DNA-binding domain and a CysB-type co-inducer-binding domain, about 63% identical to
  CysB of Escherichia coli and Salmonella. CysB is the master regulator of sulfur metabolism, and a cysB
  insertion mutant is a cysteine auxotroph, as expected when the genes of sulfate assimilation and
  cysteine synthesis are not activated. CysB also binds the 3' region of the alginate algD promoter and
  can activate algD expression, and it binds the promoter of the iron-starvation sigma factor gene pvdS
  and activates pvdS expression, so that cysB mutants show reduced PvdS-dependent virulence phenotypes.
  CysB thus links the sulfur and iron regulons.
