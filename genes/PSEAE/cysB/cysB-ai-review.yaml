suggested_questions:
- question: Which P. aeruginosa sulfate-assimilation and cysteine-synthesis promoters does CysB bind
    directly, and does it use N-acetylserine as co-inducer as in enterobacteria?
- question: Where a regulator's mutant is auxotrophic, should PAINT carry a regulatory term (e.g.
    GO:1900059 positive regulation of sulfate assimilation) rather than the biosynthetic process?
suggested_experiments:
- description: ChIP-seq of CysB in PAO1 under sulfate-limited and sulfate-replete growth, with and without
    N-acetylserine, to define the direct regulon.
  experiment_type: ChIP-seq
