  - statement: CysB binds the pvdS promoter in vitro and positively regulates PvdS expression in vivo.
    supporting_text: The CysB protein directly binds to the pvdS promoter in vitro and acts as a positive
      regulator of PvdS expression in vivo.
  reference_review:
