      MexXY is an energy-dependent efflux system for aminoglycosides that works with OprM.
    supporting_text: >-
      Antibiotic accumulation studies confirmed that this new system is an energy-dependent
      active efflux system that pumps out aminoglycosides.
  reference_review:
    relevance: HIGH
