taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  mexX (PA2019) encodes MexX, the periplasmic adaptor (membrane fusion protein) of the MexXY-OprM
  resistance-nodulation-cell division (RND) multidrug efflux pump of Pseudomonas aeruginosa.
  MexX is an inner-membrane-anchored lipoprotein that links the inner-membrane RND transporter
  MexY to the outer-membrane channel OprM (or OpmB/OpmG/OpmI), forming a tripartite pump that
  expels aminoglycosides, tetracyclines, macrolides, fluoroquinolones and other drugs across
  both membranes. The mexXY operon is repressed by MexZ and is barely expressed in drug-free
  medium; ribosome-targeting antibiotics induce it, and MexXY is the main determinant of intrinsic
  aminoglycoside resistance.
