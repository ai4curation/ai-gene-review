suggested_questions:
- question: >-
    Jeannot et al. suggest a physiological role for MexXY beyond antibiotic efflux, linked
    to ribosome perturbation. What are its natural substrates?
suggested_experiments:
- description: >-
    Reconstitute MexXY-OprM in proteoliposomes, as done for MexAB-OprM, to measure proton-coupled
    aminoglycoside transport and the requirement for MexX directly.
  experiment_type: in vitro transport assay
