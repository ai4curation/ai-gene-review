    review_notes: >-
      Full text in cache. Source of the UniProt IMP response to antibiotic row; Tn501 mutant
      11B, complementation, accumulation assays.
- id: PMID:10952562
  title: >-
    Contribution of the MexX-MexY-oprM efflux system to intrinsic resistance in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      Isogenic mexXY deletion increases antibiotic susceptibility; MexX is induced by antibiotics.
    supporting_text: >-
      Loss of either MexXY or OprM from the MexAB-deficient mutant increased susceptibility
      to all agents tested
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
