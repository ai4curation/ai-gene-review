- term:
    id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  evidence_type: IDA
  original_reference_id: PMID:12534470
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row. The paper shows Wzz1 and Wzz2 set O-antigen modal length; it does not study outer
      membrane assembly.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Wzz regulates the length of O-antigen made at the inner membrane; the finished LPS is moved to the
      outer membrane by the Lpt machinery. Making a component of the outer membrane is not assembling it,
      and GO's assembly term is carried by Lpt and Bam proteins in the reviewed E. coli genes. Kept
      off the core function as an over-annotation rather than removed, since the full text was not read.
    supported_by:
    - reference_id: PMID:12534470
      supporting_text: >-
        we have made the novel observation that polymerization of modal chain length-distributed O-antigen
        occurred before ligation to the lipid A core.
