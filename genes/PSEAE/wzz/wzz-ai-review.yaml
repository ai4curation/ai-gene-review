existing_annotations:
- term:
    id: GO:0004713
    label: protein tyrosine kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000794252
  - UniProtKB:P38134
  - UniProtKB:P76387
  review:
    summary: >-
      IBA from PTN000794252, seeded by the E. coli BY-kinases Etk (P38134) and Wzc (P76387). Wzz1 is a
      PCP-1 co-polymerase with no kinase domain.
    action: REMOVE
    reason: >-
      Wzz1 has two TM helices and a periplasmic domain and ends five residues after TM2: it has none of
      the cytoplasmic Walker A/B tyrosine-autokinase domain that Wzc and Etk carry. The kinase activity was
      gained (or kept) only in the PCP-2a branch, so the transfer to Wzz-type leaves is wrong.
    supported_by:
    - reference_id: file:PSEAE/wzz/wzz-uniprot.txt
      record_section: ["FT:TRANSMEM"]
      supporting_text: |-
        TRANSMEM        319..343
        FT                   /note="Helical"
    - reference_id: PMID:9045803
      supporting_text: >-
        This study describes the molecular characterization of the corresponding wzz (rol) gene,
        responsible for modulating O-antigen chain length.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000794252
        source_label: PTN000794252
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Mixed node containing BY-kinases (Wzc, Etk) and kinase-less PCP-1 chain-length regulators
          (Wzz1, Wzz2, FepE).
      - source_id: UniProtKB:P76387
        source_label: E. coli Wzc
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: True BY-kinase; its activity resides in the cytoplasmic domain Wzz lacks.
      - source_id: UniProtKB:P38134
        source_label: E. coli Etk
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: True BY-kinase; its activity resides in the cytoplasmic domain Wzz lacks.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000794252
      requested_change: CHECK
      asserted_value: GO:0004713
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The IBD of GO:0004713 protein tyrosine kinase activity at PTN000794252 is seeded by the E. coli
        BY-kinases Wzc (P76387) and Etk (P38134). The same node's plasma-membrane IBD lists Wzz1 (PAO1
        PA3160, G3XCY2), Wzz2 (PA0938, Q9I520) and E. coli FepE (P26266) among its seeds, which are PCP-1
        chain-length regulators. Their sequences end shortly after the second TM helix (Wzz1 is 348 aa
        with TM2 at 319-343) and lack the cytoplasmic Walker A/B tyrosine-autokinase domain, so they cannot
        have this activity. Please move the kinase IBD to the Wzc/Etk (PCP-2a) subclade or add NOT for the
        PCP-1 branch.
