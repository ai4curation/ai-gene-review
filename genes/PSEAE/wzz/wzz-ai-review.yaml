- id: PMID:12534470
  title: Pseudomonas aeruginosa O-antigen chain length is determined before ligation
    to lipid A core.
  findings:
  - statement: Wzz1 forms dimers and Wzz2 octamers in vivo.
    supporting_text: >-
      In vivo protein cross-linking followed by Western immunoblotting indicated that Wzz1 forms dimers
      whereas Wzz2 forms octamers.
  - statement: Modal chain length is determined before ligation to lipid A-core.
    supporting_text: >-
      we have made the novel observation that polymerization of modal chain length-distributed O-antigen
      occurred before ligation to the lipid A core.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Daniels et al. 2002, Environ Microbiol). Abstract read; no full text. Genetics,
      cross-linking and immunoprecipitation of Wzz1 and Wzz2; the abstract states no localisation assay.
- id: PMID:20418877
  title: 'In vitro bacterial polysaccharide biosynthesis: defining the functions of
    Wzy and Wzz.'
  findings:
  - statement: In vitro reconstitution with E. coli O86 enzymes shows Wzz confers chain-length modality.
    supporting_text: >-
      Specific polysaccharide chain length modality was furthermore demonstrated to result from the action
      of Wzz.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      E. coli O86 Wzz/Wzy in vitro reconstitution; source of the PseudoCAP ISS outer-membrane-assembly
      row. Supports chain-length regulation, not outer membrane assembly.
- id: PMID:24309320
  title: Conserved-residue mutations in Wzy affect O-antigen polymerization and Wzz-mediated
    chain-length regulation in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: Wzy cytoplasmic-loop mutations alter Wzz-mediated modality, implying Wzz-Wzy interaction.
    supporting_text: >-
      regulation of polymer length is affected by interaction of Wzz with Wzy
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text in cache read. A Wzy mutagenesis study; Wzz1 and Wzz2 enter as modality readouts and
      mCherry fusions used for complementation. No outer-membrane assembly assay.
- id: PMID:9045803
  title: Pseudomonas aeruginosa B-band O-antigen chain length is modulated by Wzz
    (Ro1).
  findings:
  - statement: wzz modulates B-band O-antigen chain length.
    supporting_text: >-
      This study describes the molecular characterization of the corresponding wzz (rol) gene,
      responsible for modulating O-antigen chain length.
  - statement: The gene complements P. aeruginosa O5 and O16 and E. coli wzz mutants.
    supporting_text: >-
      The P. aeruginosa O5 wzz gene complemented both O5 and O16 wzz mutants as well as an E. coli wzz
      mutant.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Burrows et al. 1997, J Bacteriol; PMC178856). Abstract read; no full-text XML
      obtainable. Reports knockout, complementation and sequence analysis; no localisation or topology
      assay is mentioned in the abstract. Source of the PseudoCAP IDA GO:0098567 row that seeds
      PTN000794252 and the IDA GO:0009243 row.
