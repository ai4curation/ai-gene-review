id: G3XCY2
gene_symbol: wzz
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Wzz (Wzz1, Rol; PA3160) is the O-antigen chain-length regulator encoded in the B-band O-specific
  antigen biosynthesis cluster of Pseudomonas aeruginosa PAO1. It is a 348-residue inner-membrane
  polysaccharide co-polymerase of the PCP-1 class, with two transmembrane helices flanking a large
  periplasmic domain and no cytoplasmic kinase domain. Acting with the Wzy polymerase in the
  Wzx/Wzy-dependent pathway, Wzz1 sets the long modal chain length of B-band O-antigen before it is
  ligated to lipid A-core; Wzz2 (PA0938) specifies a second, very long modal length. Wzz1 forms dimers in
  vivo, associates with O-antigen polymer, and complements wzz mutants of P. aeruginosa and E. coli.
