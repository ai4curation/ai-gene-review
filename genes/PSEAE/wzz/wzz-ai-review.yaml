suggested_questions:
- question: >-
    How does the Wzz1 periplasmic domain measure chain length with Wzy, and why does Wzz1 dimerise in vivo
    while Wzz2 and enterobacterial Wzz proteins form octamers?
suggested_experiments:
- description: >-
    Cryo-EM of a PAO1 Wzz1-Wzy complex in nanodiscs, with chain-length analysis of Wzz1 periplasmic-domain
    variants in a wzz1 wzz2 double mutant.
