    label: cytochrome-c oxidase activity
  evidence_type: IMP
  original_reference_id: PMID:14763990
  qualifier: enables
  review:
    summary: Comolli and Donohue 2004 compared the two cbb3 isoforms. PseudoCAP entered the identical
      IMP on all eight subunits of both operons, so the row carries an operon-level phenotype.
    action: ACCEPT
    reason: 'The claim that CcoO2 is part of the cbb3-2 cytochrome c oxidase is right and is the gene''s
      core role, so the term is accepted; the qualifier is not. CcoO is the monoheme cytochrome c
      subunit (Pfam FixO, NCBIfam TIGR00781, one PROSITE CYTC heme-c site) that relays electrons from
      CcoP to the heme-copper binuclear centre on CcoN, which is where oxygen is reduced. It carries
      no catalytic site of its own, so it contributes to the complex''s activity rather than enabling
      it alone, exactly as the sibling ccoP2 review found for the diheme CcoP chain. Filed as a qualifier
      defect at PROBABLE: the abstract describes the loss of whole isoforms, not a ccoO-specific mutant,
      and the full text was not read.'
    supported_by:
    - reference_id: PMID:14763990
      supporting_text: In highly aerated cultures, cbb3-1 abundance and expression were greater than
