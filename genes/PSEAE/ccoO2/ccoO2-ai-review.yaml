  label: Pseudomonas aeruginosa PAO1
description: CcoO2 (PA1556) is the monoheme cytochrome c subunit (CcoO/FixO family) of the cbb3-2
  cytochrome c oxidase of Pseudomonas aeruginosa, one of two cbb3-type terminal oxidases encoded by
  the PA1552-PA1557 region. A single N-terminal transmembrane helix anchors it in the inner membrane
  and its periplasmic cytochrome c domain carries one covalently bound heme c. Within the CcoNOQP
  complex it accepts electrons from the diheme CcoP subunit and passes them to the heme-copper binuclear
  centre of CcoN, where oxygen is reduced to water and protons are translocated, so it is an electron-transfer
  subunit that contributes to terminal oxidase activity without carrying a catalytic site of its own.
  It is not resolved in either published supercomplex model, where the CcoO chain maps to CcoO1 (Q9I3G4)
  in both.
