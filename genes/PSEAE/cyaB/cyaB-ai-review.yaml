taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CyaB (PA3217) is the principal adenylyl cyclase of Pseudomonas aeruginosa, a
  class IIIb nucleotidyl cyclase that converts ATP to cAMP. An N-terminal MASE2
  (membrane-associated sensor 2) domain with six predicted transmembrane helices
  anchors the protein in the cytoplasmic (inner) membrane and is required for full
  activity in vivo; the C-terminal cytoplasmic catalytic domain needs a divalent
  cation and is stimulated by CO2/bicarbonate, as in other class IIIb enzymes.
  CyaB accounts for most intracellular cAMP. Its activity is controlled by the
  Chp chemosensory system, and the cAMP it makes binds the CRP-family
  transcription factor Vfr, which globally activates host-directed virulence
  genes, including the type III secretion system and type IV pili. cyaB mutants
  are attenuated in a mouse pneumonia model.
references:
- id: PMID:12586068
  title: Coordinate regulation of bacterial virulence genes by a novel adenylate cyclase-dependent
    signaling pathway.
  findings:
  - statement: A membrane-associated adenylate cyclase originates a signalling pathway
      controlling TTSS gene expression.
    supporting_text: led to the identification of a signaling pathway that originates
      from a membrane-associated adenylate cyclase and controls TTSS gene expression
  - statement: Mutants unable to synthesise cAMP or lacking Vfr were profiled.
    supporting_text: Transcriptome analysis of mutants lacking the ability to synthesize
      cAMP or the cAMP binding protein Vfr
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP rows (GO:0004016, GO:0006171), which seed
      the PTN002454020 IBDs. Abstract only (no PMC full text). The abstract
      positively describes cAMP-null mutants and a membrane adenylate cyclase;
      the claims are confirmed biochemically in PMID:22226839.
- id: PMID:22226839
  title: Crystal structure and regulation mechanisms of the CyaB adenylyl cyclase from
    the human pathogen Pseudomonas aeruginosa.
  findings:
  - statement: Purified CyaB catalytic domain has adenylyl cyclase activity stimulated
      by CO2/bicarbonate.
    supporting_text: CO2/HCO3− stimulated CyaB217–463 activity in the presence of either
      divalent, with optimal stimulation occurring at pH 7.
  - statement: CyaB makes most intracellular cAMP.
    supporting_text: CyaB activity indeed accounts for the majority of intracellular
      cAMP
  - statement: Full-length CyaB fractionates with the inner membrane; the MASE2 domain
      is the anchor.
    supporting_text: Full-length CyaB and CyaBΔ1–17 were detected exclusively in the
      total membrane and inner membrane fractions
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC3269522). Direct biochemical, structural and
      fractionation evidence.
