suggested_questions:
- question: >-
    What signal does the MASE2 domain sense, and how does the Chp chemosensory
    system (via surface contact) modulate CyaB activity?
suggested_experiments:
- description: >-
    Reconstitute full-length CyaB in proteoliposomes and test whether Chp
    pathway components or surface-contact signals alter cyclase activity.
