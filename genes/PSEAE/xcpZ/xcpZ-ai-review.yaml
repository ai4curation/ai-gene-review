gene_symbol: xcpZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: XcpZ (PA3095) is the GspM-family inner-membrane platform protein of the Xcp type II
  secretion system of Pseudomonas aeruginosa, the machine that exports folded enzymes from the
  periplasm across the outer membrane. It is a bitopic protein with a short cytoplasmic N terminus,
  one transmembrane helix and a periplasmic region that uses two distinct segments to bind XcpY
  (GspL). XcpZ and XcpY stabilise each other and form the most stable isolable unit of the
  machine, which recruits the secretion ATPase XcpR and the polytopic platform protein XcpS; the
  XcpZ periplasmic domain also binds secretion substrates, and substrate binding promotes its
  homodimerisation.
