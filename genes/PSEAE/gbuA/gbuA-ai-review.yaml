  review:
    summary: >-
      PseudoCAP row from Jann et al. 1988 (the fourth arginine catabolic pathway of
      P. aeruginosa); sole seed of the PTN004253691 L-arginine catabolic process IBD.
    action: ACCEPT
    reason: >-
      Sound seed. The paper shows, by enzyme assays in P. aeruginosa extracts, that
      2-ketoarginine is degraded through 4-guanidinobutyrate to 4-aminobutyrate by an
      inducible guanidinobutyrase, and that L-arginine is channelled into this route
      when the AST pathway is blocked. The activity is attributable to GbuA, whose
      knockout lacks GBase. The pathway was first framed as D-arginine catabolism; the
      L-arginine role was confirmed genetically later (aruF gbuA double mutant).
    supported_by:
    - reference_id: PMID:3141581
      supporting_text: >-
        In mutants blocked in the L-arginine succinyltransferase pathway, but no in
        the wild-type, L-arginine was channelled partially into the D-arginine
        dehydrogenase pathway.
    - reference_id: PMID:17416670
      supporting_text: >-
        disruption of gbuA abolished growth on l -arginine
