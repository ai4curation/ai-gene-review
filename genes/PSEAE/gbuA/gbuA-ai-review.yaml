      to 4-aminobutyrate) with an inducible guanidinobutyrase, into which L-arginine is
      partly channelled when the AST pathway is blocked.
    supporting_text: >-
      2-ketoarginine was catabolized further to
      4-guanidinobutyraldehyde, 4-guanidinobutyrate and 4-aminobutyrate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID, title and organism verified via PubMed (abstract only, not in PMC).
      Supports guanidinobutyrase activity in P. aeruginosa extracts and its place in
      arginine catabolism; predates the gene, which was later identified as PA1421
      (PMID:12029055).
  full_text_unavailable: true
- id: PMID:12029055
  title: Characterization and regulation of the gbuA gene, encoding guanidinobutyrase
    in the arginine dehydrogenase pathway of Pseudomonas aeruginosa PAO1.
  findings:
