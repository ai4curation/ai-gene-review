gene_symbol: gbuA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  gbuA (PA1421) encodes guanidinobutyrase (EC 3.5.3.7) of Pseudomonas
  aeruginosa, a manganese-dependent ureohydrolase of the arginase/agmatinase
  family that hydrolyses 4-guanidinobutanoate to 4-aminobutanoate (GABA) and
  urea. The enzyme is highly specific: it has no detectable activity on
  arginine, agmatine, 3-guanidinopropionate or guanidinoacetate, and its
  substrate selectivity relative to the paralogous guanidinopropionase GpuA is
  set by active-site loop residues such as Met161. It binds two Mn2+ ions per
  subunit and was reported as a homotetramer by gel filtration and a homohexamer
  in the crystal structure. GbuA catalyses a late step of the arginine
  dehydrogenase / arginine transaminase route of arginine catabolism, in which
  D- or L-arginine is converted via 2-ketoarginine and 4-guanidinobutyraldehyde
  to 4-guanidinobutyrate and then to GABA, which feeds succinate production.
  gbuA is induced by 4-guanidinobutyrate through the divergently transcribed
  LysR-type regulator GbuR, and is required for growth on 4-guanidinobutyrate.
