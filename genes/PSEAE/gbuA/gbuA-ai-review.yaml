core_functions:
- description: >-
    Mn2+-dependent guanidinobutyrase that hydrolyses 4-guanidinobutanoate to GABA and
    urea, a committed late step of the arginine dehydrogenase/transaminase route of
    D- and L-arginine catabolism and required for growth on 4-guanidinobutyrate.
