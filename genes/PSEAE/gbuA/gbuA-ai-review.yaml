suggested_questions:
- question: >-
    Should the PTN004253691 L-arginine catabolic process IBD (sole seed GbuA) be moved
    to a bacterial guanidinobutyrase subnode, given that the clade also contains GpuA
    and vertebrate guanidino acid hydrolases with little or no activity on arginine?
- question: >-
    Is a more specific GO process term warranted for 4-guanidinobutanoate catabolism
    (the GbuA step), shared by the arginine catabolic route and exogenous
    4-guanidinobutyrate utilisation?
suggested_experiments:
- description: >-
    Measure 13C-arginine flux through 4-guanidinobutyrate in wild type, aruF and
    aruF gbuA strains of PAO1 to quantify the share of L-arginine catabolism routed
    through GbuA under different growth conditions.
