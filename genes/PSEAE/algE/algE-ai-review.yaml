id: P18895
gene_symbol: algE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: AlgE is an 18-stranded outer-membrane beta-barrel that provides the export pathway for
  alginate. Its charged pore and gating loops support passage of the anionic polysaccharide, and
  its assembly contributes to stability of the associated alginate secretion machinery.
