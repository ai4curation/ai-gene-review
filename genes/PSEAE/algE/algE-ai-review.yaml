  review:
    summary: AlgE provides the outer-membrane export pore and supports assembly of the alginate-production
      machinery.
    action: ACCEPT
    reason: AlgE contributes structural transport work required for normal polymer production and
      stabilization of partners. Pore-loop genetics and anion flux support the channel model; they
