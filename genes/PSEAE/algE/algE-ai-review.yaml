- id: PMID:23335756
  title: Dual roles of Pseudomonas aeruginosa AlgE in secretion of the virulence factor alginate
    and formation of the secretion complex.
  findings:
  - statement: AlgE pore-loop mutations affect alginate production; deletion destabilizes other secretion
      proteins, supporting pore and assembly roles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct P. aeruginosa evidence; secretion phenotypes do not establish polysaccharide
      polymerase activity.
- id: PMID:21778407
  title: Structural basis for alginate secretion across the bacterial outer membrane.
  findings:
  - statement: AlgE is an 18-stranded outer-membrane beta-barrel; loop-T8 deletion increases anion
      flux and impairs alginate production in vivo.
    supporting_text: Here we report the 2.3 Å crystal structure of AlgE, which reveals a monomeric
      18-stranded β-barrel
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct P. aeruginosa structure and halide-flux experiments; halide flux is not
      direct reconstitution of alginate-polymer flux.
core_functions:
- description: Provides the outer-membrane alginate export channel and supports secretion-machine
    assembly. Structure, halide-flux and in vivo alginate phenotypes jointly support polysaccharide
    transport; these are not a direct purified-polymer flux assay.
