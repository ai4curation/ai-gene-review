  label: Pseudomonas aeruginosa PAO1
description: PA1486 (bapF) encodes BapF, a beta-peptidyl aminopeptidase of the peptidase S58/DmpA family
  (MEROPS P01.003). Members of this family are N-terminal-nucleophile hydrolases that autoprocess at a
  Gly-Ser bond and use the newly exposed serine as the catalytic nucleophile; in BapF this is Ser237.
  Recombinant BapF releases N-terminal beta-amino acids from beta-peptide substrates such as
  beta-homoglycine p-nitroanilide, and it also catalyses aminolysis (transpeptidation), forming
  beta-peptide products that it then hydrolyses. Replacing Ser237 with Cys switches the preferred acyl
  acceptor from water to amines. Its physiological substrate and role in P. aeruginosa are unknown.
