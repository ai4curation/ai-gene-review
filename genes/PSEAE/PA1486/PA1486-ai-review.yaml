  review:
    summary: PseudoCAP IDA from the Arima et al. study of recombinant BapF (PA1486) and its active-site Ser237
      mutants. Sole seed of the GO:0004177 IBD at PTN002194605.
    action: MODIFY
    reason: The paper assays purified recombinant BapF on a beta-peptide p-nitroanilide, which is direct
      evidence for aminopeptidase activity, so the claim is sound. The same paper identifies Ser237 as the
      catalytic residue (the Gly236-Ser237 bond is the DmpA-family autoprocessing site in the PA1486
      sequence), which supports the more specific GO:0070009 serine-type aminopeptidase activity. GO has no
      beta-peptidyl aminopeptidase (EC 3.4.11.25) term.
    proposed_replacement_terms:
    - id: GO:0070009
      label: serine-type aminopeptidase activity
    supported_by:
    - reference_id: PMID:23728237
      supporting_text: We specifically examined β-peptidyl aminopeptidase of Pseudomonas aeruginosa PAO1
        (BapF) to assess the effects of mutation of catalytic Ser with Cys or Thr on its catalytic ability.
    - reference_id: PMID:23728237
      supporting_text: Recombinant BapF and its S237C mutant exhibited p-nitroaniline release activity toward
