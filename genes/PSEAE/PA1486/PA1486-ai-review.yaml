    reason: Aminopeptidase activity is directly shown for recombinant BapF, and it is the characterised
      activity of the S58/DmpA family (D-aminopeptidases and beta-peptidyl aminopeptidases), so the IBD is
      sound and the node term is not wrong for the clade. As for the IDA row, the catalytic Ser237 (an
      N-terminal-nucleophile serine common to the S58/DmpA family) supports the more specific
      GO:0070009 serine-type aminopeptidase activity for PA1486; substrate-specific terms would not suit a
      node whose members differ in stereo- and beta-peptide specificity.
