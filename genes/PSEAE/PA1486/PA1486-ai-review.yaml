- question: What is the physiological substrate of BapF in P. aeruginosa, given that beta-peptides are rare
    in nature?
- question: Should GO add a beta-peptidyl aminopeptidase activity term (EC 3.4.11.25) under serine-type
    aminopeptidase activity?
