- term:
    id: GO:0009015
    label: N-succinylarginine dihydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000764516
  - UniProtKB:P76216
  review:
    summary: >-
      IBA from PTN000764516, seeded only by E. coli AstB (P76216), the dihydrolase.
      AstA is the succinyltransferase alpha subunit and has no dihydrolase activity.
    action: REMOVE
    reason: >-
      Wrong activity. PANTHER PTHR30420 groups two unrelated enzyme families: the AstB
      dihydrolases (SF2, Pfam AstB) and the AstA/AruG succinyltransferases (SF1, Pfam
      AstA, GNAT-like). The dihydrolase IBD was placed at PTN000764516, which spans
      both, so the step-2 activity is propagated to the step-1 enzyme. The leaf GAF
      shows the same IBA on all seven AstA-type leaves in the node. Node-level
      GO_CENTRAL defect recorded here (also applies to aruG).
    supported_by:
    - reference_id: PMID:9393691
      supporting_text: >-
        the aruF and aruG genes encode the subunits (AruAI and AruAII) of arginine and
        ornithine N2-succinyltransferases
    - reference_id: file:PSEAE/astA/astA-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: PF04958; AstA
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000764516
        source_label: PTN000764516
        source_status: SOURCE_BAD
        comment: >-
          Root of PTHR30420, covering both SF1 (AstA/AruG succinyltransferases, 53
          members) and SF2 (AstB dihydrolases, 138 members). GO:0009015 suits SF2 only.
      - source_id: UniProtKB:P76216
        source_label: E. coli AstB (sole seed, IDA PMID:15703173)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Valid dihydrolase evidence for AstB; does not transfer to AstA.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0009015
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The PTN000764516 IBD for GO:0009015 N-succinylarginine dihydrolase activity
        (sole seed E. coli AstB P76216) sits at the root of PTHR30420, which also
        contains the AstA/AruG arginine N-succinyltransferase subfamily (SF1). The
        leaf GAF shows the dihydrolase IBA on seven succinyltransferase leaves
        (P0AE37 E. coli AstA, P80357 AruF, P80358 AruG, Q8EJ55, Q8ZPV1, Q9KNW3,
        Q9ZC67). These are GNAT-like acyltransferases (Pfam AstA) catalysing step 1 of
        the AST pathway, not step 2. Suggested change: move the GO:0009015 IBD to the
        AstB (SF2) node, and add GO:0008791 L-arginine N-succinyltransferase activity
