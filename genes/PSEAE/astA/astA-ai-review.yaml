id: P80357
gene_symbol: astA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AstA (AruF, PA0896) is the alpha subunit of the arginine and ornithine
  N2-succinyltransferase of Pseudomonas aeruginosa, a heterotetramer of AruF and
  AruG subunits that catalyses the first step of the arginine succinyltransferase
  (AST) pathway, transferring the succinyl group of succinyl-CoA to L-arginine (and
  L-ornithine) to form N2-succinylarginine. The enzyme is allosteric towards
  ornithine and is inhibited by spermidine. The gene lies in the ArgR-controlled
  aruCFGDB operon, which is induced by arginine and enables aerobic use of arginine
  and ornithine as carbon and nitrogen sources. AstA has a GNAT-like acyl-CoA
  N-acyltransferase fold (Pfam AstA).
