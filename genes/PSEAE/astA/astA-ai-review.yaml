suggested_questions:
- question: >-
    What are the separate roles of the AruF and AruG subunits in catalysis and in the
    allosteric ornithine and spermidine regulation of the heterotetramer, given that
    E. coli has a single AstA?
- question: >-
    Should PANTHER PTHR30420 be split, since it joins the unrelated AstA
    succinyltransferase and AstB dihydrolase families, and should the UniProt
    similarity note for AstA/AruG ("succinylarginine dihydrolase family") be revised?
suggested_experiments:
- description: >-
    Express AruF and AruG separately and together and assay arginine and ornithine
    succinylation, to test whether either subunit alone is active.
