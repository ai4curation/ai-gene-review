taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Nuh (PA0143) is a nucleoside hydrolase of Pseudomonas aeruginosa PAO1 of the inosine-uridine-preferring
  (IU-NH) family. It cleaves the N-glycosidic bond of ribonucleosides, releasing the free base and ribose,
  and is required for growth on adenosine as a sole carbon and energy source. It is annotated as a nonspecific
  ribonucleoside hydrolase and falls in the PANTHER uridine nucleosidase subfamily, so it probably acts
  on several purine and pyrimidine ribonucleosides, with adenosine the only experimentally established
  substrate. Expression of nuh is positively controlled by the LasR quorum-sensing regulator, and the
  Nuh-negative (no growth on adenosine) phenotype has been used as a convenient assay for LasR function.
  The protein carries a predicted Sec signal peptide, suggesting it is exported from the cytoplasm rather
  than cytosolic.
