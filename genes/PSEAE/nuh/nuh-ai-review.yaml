suggested_questions:
- question: >-
    Where does P. aeruginosa Nuh act? Its predicted signal peptide suggests periplasmic localization,
    unlike the cytosolic plant orthologs from which the cytosol IBA is propagated.
- question: >-
    What is the substrate range of Nuh? The only experimentally shown substrate is adenosine, yet it is
    classed as a nonspecific/uridine nucleoside hydrolase.
suggested_experiments:
- description: >-
    Assay purified Nuh against inosine, adenosine, uridine and cytidine to determine its substrate preference,
    and localize a tagged Nuh by cell fractionation to test the predicted periplasmic location.
