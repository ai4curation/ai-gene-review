  label: Pseudomonas aeruginosa PAO1
description: >-
  TrpE (PA0609) is the large (component I) subunit of anthranilate synthase, the first enzyme of L-tryptophan
  biosynthesis in Pseudomonas aeruginosa. With the glutamine-amidotransferase subunit TrpG it forms a
  heterotetramer that converts chorismate and L-glutamine to anthranilate, pyruvate and glutamate (EC
  4.1.3.27); TrpE carries the chorismate-binding/aminating active site and is feedback-inhibited by tryptophan.
  P. aeruginosa has a second, paralogous anthranilate synthase, PhnAB, that supplies anthranilate for
  pyocyanin rather than for tryptophan; the two are not functionally redundant because trpEG is expressed
  at low cell density while phnAB is expressed at high density. trpE deletion causes tryptophan auxotrophy.
