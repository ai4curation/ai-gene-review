gene_symbol: PA4781
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA4781 is a REC–HD-GYP phosphodiesterase in Pseudomonas aeruginosa PAO1. Phosphorylation
  of the receiver domain relieves inhibition of c-di-GMP hydrolysis. The enzyme opens c-di-GMP to pGpG
  and can further hydrolyse pGpG to GMP slowly in vitro; it has a lower apparent Km for pGpG than for c-di-GMP in vitro. Its
  activity contributes to c-di-GMP-dependent control of swarming and biofilm architecture.
