  review:
    summary: Receiver-domain phosphorylation activates the enzyme, but a native phosphorelay has not been
      identified.
    action: UNDECIDED
    reason: Acetyl-phosphate activation establishes receiver-domain control in vitro, not a physiological
      histidine-kinase phosphorelay. No cognate kinase or direct phosphotransfer experiment is established
      by the cited study.
    supported_by:
    - reference_id: PMID:24066157
      supporting_text: In addition, our data indicate that the non-phosphorylated REC domain of PA4781
        prevents accessibility of c-di-GMP to the active site.
