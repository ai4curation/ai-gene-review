  title: 'C-di-GMP hydrolysis by Pseudomonas aeruginosa HD-GYP phosphodiesterases: analysis of the reaction
    mechanism and novel roles for pGpG.'
  findings:
  - statement: Purified PA4781 shows phosphorylation-gated cyclic dinucleotide hydrolysis, pGpG preference
      and slow GMP production.
    supporting_text: We show that both enzymes hydrolyse c-di-GMP in a two-step reaction via the linear
      intermediate pGpG and that they produce GMP in vitro at a surprisingly low rate.
