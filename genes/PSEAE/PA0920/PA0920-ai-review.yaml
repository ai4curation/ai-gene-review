taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA0920 encodes the alanyl-phosphatidylglycerol synthase (A-PGS) of Pseudomonas aeruginosa, an
  MprF-family integral inner-membrane protein with an N-terminal domain of 14 transmembrane helices and a
  C-terminal cytoplasmic catalytic domain. The catalytic domain transfers L-alanine from Ala-tRNA(Ala) to the
  head group of phosphatidylglycerol, forming 2'-alanyl-phosphatidylglycerol (A-PG), and specifically
  recognises the PG head group and the tRNA acceptor stem. Transcription is acid-induced, and A-PG makes up
  several percent of membrane lipid at low pH; a deletion mutant makes no A-PG. Together with the
  periplasmic A-PG hydrolase PA0919, which trims A-PG levels, it tunes membrane charge and lowers
  susceptibility to cationic antimicrobial peptides and other antimicrobials. Despite an automated
  "lysyltransferase" name, P. aeruginosa does not make lysyl-phosphatidylglycerol.
