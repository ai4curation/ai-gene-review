  review:
    summary: EC2GO mapping from an ARBA-predicted EC 2.3.2.3 (lysyl-PG synthase). Contradicted by the
      characterised alanyl specificity of PA0920.
    action: REMOVE
    reason: PA0920 is the alanyl-PG synthase. The deletion mutant loses A-PG, the enzyme uses Ala-tRNA(Ala),
      and P. aeruginosa naturally makes A-PG; lysyl-PG appears only in engineered chimeric strains. The EC
      number and the RecName come from an ARBA rule for the MprF family that ignores the A-PGS/L-PGS split,
      so this is a demonstrably wrong electronic transfer.
    supported_by:
    - reference_id: PMID:22267511
      supporting_text: chimeric mutant strains producing lysyl-phosphatidylglycerol (L-PG) instead of the
        naturally occurring alanyl-phosphatidylglycerol (A-PG)
    - reference_id: PMID:19087229
      supporting_text: The P. aeruginosa deletion mutant DeltaPA0920 failed to synthesize A-PG.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:Q9I537
      requested_change: REPOINT
      asserted_value: EC:2.3.2.3
      corrected_value: EC:2.3.2.11
      corrected_label: alanylphosphatidylglycerol synthase
