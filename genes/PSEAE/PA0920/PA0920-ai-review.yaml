suggested_questions:
- question: Should GO have a term for aminoacyl-phosphatidylglycerol (alanyl-/lysyl-PG) biosynthesis, so
    that MprF-family synthases need not be annotated to the broad phospholipid biosynthetic process or to
    phospholipid homeostasis?
- question: Does the N-terminal transmembrane domain of PA0920 translocate A-PG to the outer leaflet, as the
    S. aureus MprF flippase domain does for lysyl-PG?
suggested_experiments:
- description: Assay A-PG translocation across the inner membrane (e.g. TNBS accessibility or flippase
    reconstitution) in wild type and N-terminal-domain mutants of PA0920.
  experiment_type: biochemical/biophysical lipid translocation assay
