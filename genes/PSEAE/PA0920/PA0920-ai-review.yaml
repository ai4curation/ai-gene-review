- id: PMID:26261323
  title: Structures of two bacterial resistance factors mediating tRNA-dependent aminoacylation of
    phosphatidylglycerol with lysine or alanine.
  findings:
  - statement: Crystal structure of the P. aeruginosa A-PGS catalytic domain, with a tunnel admitting PG and
      aminoacyl-tRNA from opposite sides; substrate determinants defined biochemically.
    supporting_text: Both proteins reveal a continuous tunnel that allows the hydrophobic lipid substrate PG
      and the polar aminoacyl-tRNA substrate to access the catalytic site from opposite directions.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Cited by PseudoCAP for GO:0047637 (IDA) and GO:0055091 (IDA). PubMed record matches and
      supports the alanyltransferase activity directly. In the abstract and Significance statement, phospholipid homeostasis appears only as framing; whether the full text (not read) has homeostasis data is unverified. Abstract only in the cache; PMC4553816 returned
      only abstract and Significance.
- id: PMID:19087229
  title: Adaptation of Pseudomonas aeruginosa to various conditions includes tRNA-dependent formation of
    alanyl-phosphatidylglycerol.
  findings:
  - statement: PA0920 is the A-PG synthase; the deletion makes no A-PG, expression in E. coli confers A-PG,
      and the partially purified enzyme is tRNA(Ala)-dependent and in the inner membrane.
    supporting_text: Consequently, the protein encoded by PA0920 was named A-PG synthase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding characterisation of PA0920; abstract only in the cache.
- id: PMID:21392131
  title: 'Alanyl-phosphatidylglycerol synthase: mechanism of substrate recognition during tRNA-dependent
    lipid modification in Pseudomonas aeruginosa.'
  findings:
  - statement: The C-terminal domain is the minimal catalytic core; the PG head group is specifically
      recognised.
    supporting_text: the polar head group of the phospholipid is specifically recognized by the enzyme
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; mechanism and inner-membrane localisation of PA0920.
- id: PMID:22267511
  title: Resistance phenotypes mediated by aminoacyl-phosphatidylglycerol synthases.
  findings:
  - statement: P. aeruginosa naturally makes A-PG, not L-PG; aaPGS specificity is not marked by a sequence
      motif.
    supporting_text: the specificity of an individual enzyme is not reflected in terms of a characteristic
      sequence motif
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; supports the alanyl specificity and cautions against motif-based transfer.
- id: PMID:23792962
  title: Identification and characterization of a periplasmic aminoacyl-phosphatidylglycerol hydrolase
    responsible for Pseudomonas aeruginosa lipid homeostasis.
  findings:
  - statement: The A-PG hydrolase PA0919 controls A-PG levels; lipid homeostasis is attributed to PA0919.
    supporting_text: Analysis of the polar lipid content of the deletion mutant ΔPA0919 indicated
      significantly enlarged levels of alanyl-PG.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; context for why homeostasis is a system property rather than PA0920's own
      process.
