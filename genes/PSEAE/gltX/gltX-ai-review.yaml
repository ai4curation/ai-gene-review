  label: Pseudomonas aeruginosa PAO1
description: GltX is the discriminating glutamyl-tRNA synthetase of Pseudomonas aeruginosa PAO1. It activates
  glutamate with ATP and transfers it to tRNA(Glu). The characterized enzyme does not glutamylate tRNA(Gln),
  consistent with direct Gln-tRNA(Gln) synthesis by GlnS in this organism. A conserved zinc-binding region
  is supported by curated sequence-family inference.
