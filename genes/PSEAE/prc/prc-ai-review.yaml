status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Prc (PA3257) is a 698-residue periplasmic tail-specific protease of Pseudomonas aeruginosa PAO1,
  a carboxyl-terminal processing serine protease of the peptidase S41A family with a Sec signal peptide,
  a PDZ domain and an S41 catalytic domain. Prc acts as a site-1 protease in regulated proteolysis
  of anti-sigma factors. It degrades mutant forms of the anti-sigma factor MucA, releasing the AlgU
  sigma factor and promoting mucoidy in cystic fibrosis isolates, and in cell-surface signalling
  systems it removes the periplasmic anti-sigma domain so that RseP can then cleave the transmembrane
  segment and release the active extracytoplasmic function sigma factor.
