suggested_questions:
- question: >-
    Which features of an anti-sigma factor's periplasmic domain does Prc recognise, and why does it
    cleave mutant but not wild-type MucA?
suggested_experiments:
- description: >-
    In vitro cleavage of purified periplasmic anti-sigma domains (wild-type and truncated MucA, CSS
    anti-sigma factors) by purified Prc, mapping cleavage sites by mass spectrometry.
