  title: The Prc and RseP proteases control bacterial cell-surface signalling activity.
  findings:
  - statement: >-
      Prc removes the periplasmic anti-sigma domain, and RseP then removes the transmembrane domain
      to generate the active ECF sigma factor.
    supporting_text: >-
      Prc, which removes the periplasmic anti-sigma domain, and RseP, which subsequently removes the
      transmembrane domain and thereby generates the ECF active transcriptional form.
  - statement: Prc and RseP also act in classical CSS systems.
    supporting_text: >-
      We furthermore demonstrate the role of these proteases in the regulation of classical CSS systems
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Bastiaansen et al. 2014, Environ Microbiol). Abstract only. The Iut system
      studied is from P. putida; the abstract does not name the organism of the classical-CSS
      experiments. Source of the PseudoCAP IMP signal transduction seed.
