suggested_questions:
- question: >-
    Do the OprB paralogs PA2291 and PA4099 and the non-Pseudomonas members of
    PTN002209977 (Synechocystis Slr1163, Xanthomonas RpfN) also select for
    carbohydrates, or have some diverged to other solutes?
