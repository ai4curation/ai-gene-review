- term:
    id: GO:0008643
    label: carbohydrate transport
  evidence_type: IDA
  original_reference_id: PMID:7768797
  qualifier: involved_in
  review:
    summary: >-
      Wylie and Worobec built oprB null and overexpressing strains and measured
      initial uptake of glucose, mannitol, glycerol and fructose, which fell or
      rose accordingly, while arginine uptake was unchanged. The claim is
      sound and the substrates are known.
    action: MODIFY
    reason: >-
      The porin conducts these sugars across the outer membrane, so OprB does
      the transport work. The precise processes are the substrate-specific
      transmembrane transport terms. The evidence the abstract describes is
      uptake measured in mutant and overexpressing whole cells, which reads as
      a mutant phenotype (IMP); the full text was not read, so a direct assay
      in it cannot be excluded (see source_defects). The claim itself is
      sound. Earlier channel-specificity work in liposomes
      (PMID:2450582, not cached) is cited by UniProt for the glucose channel.
    proposed_replacement_terms:
    - id: GO:1904659
      label: D-glucose transmembrane transport
    - id: GO:0015797
      label: mannitol transmembrane transport
    - id: GO:0015755
      label: fructose transmembrane transport
    - id: GO:0015793
      label: glycerol transmembrane transport
    supported_by:
    - reference_id: PMID:7768797
      supporting_text: >-
        we also demonstrated that the loss or overexpression of OprB had a
        similar effect on the uptake of three other sugars able to support the
        growth of this bacterium (mannitol, glycerol, and fructose). This effect
        was restricted to carbohydrate transport; arginine uptake was identical
        in mutant and wild-type strains.
    - reference_id: file:PSEAE/oprB/oprB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Involved in the transport of glucose, mannitol, fructose and glycerol
        (sugars able to support the growth of P.aeruginosa). Facilitates
        glucose diffusion across the outer membrane.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      corrected_value: ECO:0000315
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        GO:0008643 carbohydrate transport for OprB (PA3186, Q51485) is
        annotated IDA to PMID:7768797. The evidence the abstract describes is
        initial sugar uptake by whole cells of an interposon oprB mutant and an
        OprB overexpressing strain compared with wild type, which is a mutant
        phenotype (IMP). Only the abstract was read, so if the full text also
        has a direct assay (for example with purified OprB) IDA would stand;
        please check. The claim is sound, and the specific substrates
        (glucose, mannitol, fructose, glycerol) could be annotated with the
        substrate-specific transmembrane transport terms. This row is the sole
        seed of the PAINT IBD at PTN002209977.
      supported_by:
      - reference_id: PMID:7768797
        supporting_text: >-
          Using interposon mutagenesis, we have generated strains of
          Pseudomonas aeruginosa which lack or overexpress the
          substrate-selective OprB porin of this species.
