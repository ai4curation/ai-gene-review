id: Q51485
gene_symbol: oprB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  OprB (PA3186, outer membrane protein D1) is the glucose-inducible,
  carbohydrate-selective porin of the Pseudomonas aeruginosa outer membrane. It
  is a beta-barrel channel with a cleavable signal peptide, the founding member
  of the OprB family (TCDB 1.B.19). OprB facilitates diffusion of glucose across
  the outer membrane into the periplasm, and also of other growth-supporting
  carbohydrates (mannitol, fructose and glycerol), but not of amino acids such
  as arginine. From the periplasm, glucose is taken up across the inner membrane
  by ABC and other transporters or oxidised in the periplasm.
