core_functions:
- description: >-
    Inner-membrane hybrid sensor histidine kinase that autophosphorylates and relays the phosphoryl group
    through its receiver domain to the Hpt protein HptB, initiating the HptB-HsbR-HsbA phosphorelay that
    controls motility and biofilm formation.
