      PA1611 transfers phosphoryl groups through HptB to the response regulator PA3346; the pathway affects
      flagellar activity, chemotaxis, twitching and biofilm formation.
    supporting_text: We herein demonstrate that the hybrid sensor PA1611 carries out specific signal transduction,
      through HptB (PA3345), to the response regulator PA3346 in Pseudomonas aeruginosa PAO1
  reference_review:
    relevance: HIGH
