- term:
    id: GO:0009927
    label: histidine phosphotransfer kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001976860
  - SGD:S000001409
  - UniProtKB:P39838
  review:
    summary: >-
      IBA histidine phosphotransfer kinase activity from PTN001976860, seeded by E. coli RcsD (an Hpt-domain
      phosphotransferase) and yeast SLN1. GO:0009927 is defined as serving as the phospho-His intermediate
      between a hybrid kinase and a response regulator, the role of an Hpt domain or protein. PA1611 has
      no Hpt domain (HAMP, HisKA, HATPase_c and REC only) and passes its phosphoryl group to the separate
      Hpt protein HptB, which is the protein that performs this activity in the pathway.
    action: REMOVE
    reason: >-
      Over-propagated IBA argued on domain-architecture grounds: PA1611 is the hybrid kinase, not the
      Hpt intermediate. The Hpt role in this relay belongs to HptB (PA3345).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001976860
        source_label: PTN001976860
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node mixes Hpt-domain proteins (RcsD) with hybrid kinases lacking an Hpt domain (PA1611,
          PA3271, SLN1). GO:0009927 suits only members with an Hpt domain.
      - source_id: UniProtKB:P39838
        source_label: RcsD (E. coli)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          RcsD carries a C-terminal HPt domain; the activity is real for it but depends on that domain.
      - source_id: SGD:S000001409
        source_label: SLN1 (yeast)
        source_status: UNRESOLVED
        comment: >-
          SLN1 has HisKA and REC but no Hpt domain (its Hpt partner is YPD1); its own IDA/IMP for GO:0009927
          (PMID:12455952) was not read here.
    supported_by:
    - reference_id: file:PSEAE/PA1611/PA1611-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: PF00512; HisKA
    - reference_id: file:PSEAE/PA1611/PA1611-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: PF00072; Response_reg
    - reference_id: file:PSEAE/PA1611/PA1611-notes.md
