suggested_questions:
- question: >-
    What signal does the periplasmic sCache-like domain of PA1611 detect, and does it modulate PA1611
    autokinase activity or its reported interaction with RetS?
- question: >-
    Should the GO:0009927 IBD at PTN001976860 be restricted to the RcsD-like members that have an HPt
    domain, given that PA1611, PA3271 and SLN1 lack one?
suggested_experiments:
- description: >-
    Screen ligands against the purified periplasmic sensor domain (thermal shift or ITC) and test hit
    compounds for effects on PA1611 autophosphorylation and HptB phosphorylation in vitro.
