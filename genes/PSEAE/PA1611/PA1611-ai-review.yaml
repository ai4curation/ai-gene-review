taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1611 is an orphan hybrid sensor histidine kinase of the Pseudomonas aeruginosa inner membrane. It
  has two transmembrane helices flanking a periplasmic sCache-like sensor region, a cytoplasmic HAMP linker,
  a HisKA dimerisation/phosphoacceptor domain with the conserved His275, an HATPase_c catalytic domain
  and a C-terminal receiver (REC) domain with the phosphoacceptor Asp565; it has no histidine phosphotransfer
  (Hpt) domain. The cytoplasmic part autophosphorylates and transfers the phosphoryl group, through its
  REC domain, to the separate histidine phosphotransfer protein HptB (PA3345), which passes it on to the
  response regulator/phosphatase HsbR (PA3346). This HptB multistep phosphorelay, which is also fed by
  the hybrid kinases ErcS' and SagS, controls flagellar and chemotactic behaviour, swarming and twitching
  motility and biofilm formation. Crystal structures of the REC domain (residues 507-651) show a canonical
  (beta/alpha)5 receiver fold that binds Mg2+ or Ca2+ at the active site. The signal it senses is unknown.
