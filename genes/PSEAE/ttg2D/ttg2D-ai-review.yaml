- description: Shuttles phospholipid through the periplasm as the Ttg2/Mla soluble carrier. Direct target
    cargo binding/reloading, periplasmic recovery and specific carrier architecture support the mechanistic
    assignment, although donor-to-acceptor membrane transfer and net native PAO1 flux were not directly
    resolved.
