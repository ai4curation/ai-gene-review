suggested_questions:
- question: >-
    Does RocS1-mediated phosphorylation of RocR Asp56 activate or inhibit its PDE
    activity in vivo, and is the antagonism of RocA1 a sequestration of phosphoryl
    groups or a c-di-GMP-dependent effect?
suggested_experiments:
- description: >-
    Compare cup gene expression in a rocR mutant complemented with catalytically
    dead (EAL-motif alanine substitution) RocR versus a D56N variant, to separate the PDE output
    from phosphorelay competition.
