id: Q9HX69
gene_symbol: rocR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  RocR (PA3947) is a soluble response regulator made of an N-terminal receiver
  (REC) domain and a C-terminal EAL domain. The EAL domain is a
  cyclic-di-GMP-specific phosphodiesterase that hydrolyses c-di-GMP to the linear
  dinucleotide pGpG, using Mg2+ (or Mn2+) and a general-base mechanism; it does not
  hydrolyse cAMP or cGMP. RocR forms tetramers, and the phosphorylation state of
  the receiver domain (Asp56) is thought to tune the active site through loop 6 of
  the EAL domain. RocR belongs to the RocS1-RocR-RocA1 (SadARS) signalling system,
  where it receives phosphoryl groups from the sensor kinase RocS1 and antagonises
  the DNA-binding response regulator RocA1. Through this system and through
  c-di-GMP turnover it controls cupB/cupC fimbrial gene expression, biofilm
  maturation, type III secretion and virulence.
references:
- id: PMID:18344366
  title: 'Catalytic mechanism of cyclic di-GMP-specific phosphodiesterase: a study
    of the EAL domain-containing RocR from Pseudomonas aeruginosa.'
  findings:
  - statement: Purified RocR hydrolyses c-di-GMP by a Mg2+-assisted general-base
      mechanism.
    supporting_text: catalyzes the hydrolysis of cyclic di-GMP by using a general
      base-catalyzed mechanism with the assistance of Mg(2+) ion
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Basis of the UniProt EXP row for GO:0071111. Abstract read; UniProt quotes the
      kinetics (Km 3.2 uM, kcat 0.67/s) from this paper.
- id: PMID:19376848
  title: The functional role of a conserved loop in EAL domain-based cyclic di-GMP-specific
    phosphodiesterase.
  findings:
  - statement: Loop 6 and the receiver-domain phosphorylation site modulate RocR PDE
      activity.
    supporting_text: the catalytic activity of RocR was affected by mutating the putative
      phosphorylation site (D56N) in the phosphoreceiver domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Second UniProt EXP source for GO:0071111. Abstract read.
- id: PMID:16477007
  title: Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases
    reveals a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: Comprehensive mutant and overexpression analysis of P. aeruginosa
      DGC/PDE genes; lysates of strains overexpressing RocR degraded all the added
      c-di-GMP (Table 1, read in the PMC full text).
    supporting_text: Analysis of the phenotypes of DGC and PDE mutants and overexpressing
      clones revealed that certain virulence-associated traits are controlled by multiple
      DGCs and PDEs through alterations in c-di-GMP levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IDA GO:0071111 rows on rocR, PA2133 and PA2200. The
      cached copy is abstract-only, but I read the full text on the PMC page
      (PMC1413825); verbatim excerpts of the assay description and Table 1 are in
      rocR-notes.md. The assay is a lysate assay on overexpressing strains, so it is
      direct but crude; for RocR it agrees with the purified-enzyme work.
- id: PMID:15659157
  title: A novel two-component system controls the expression of Pseudomonas aeruginosa
    fimbrial cup genes.
  findings:
  - statement: RocR antagonises RocA1, the DNA-binding activator of cup genes.
    supporting_text: RocA1 is a DNA binding response regulator that activates cup
      genes, and RocR is an antagonist of RocA1 activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP negative regulation of transcription row.
      Abstract only; the regulation is indirect (RocR acts on RocA1, not on DNA).
- id: PMID:15687209
  title: A three-component regulatory system regulates biofilm maturation and type
    III secretion in Pseudomonas aeruginosa.
  findings:
  - statement: The SadARS (RocS1-RocA1-RocR) system is required for late biofilm
      maturation and regulates type III secretion genes.
    supporting_text: We propose that the sadARS three-component system is required
      for later events in biofilm formation on an abiotic surface.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; system-level genetics.
- id: PMID:22753070
  title: Structural insights into the regulatory mechanism of the response regulator
    RocR from Pseudomonas aeruginosa in cyclic Di-GMP signaling.
  findings:
  - statement: RocR is a soluble tetramer in the crystal and in solution.
    supporting_text: a finding consistent with the observation that RocR forms tetramers
      in solution
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Supports a soluble, not membrane-integral, protein.
- id: PMID:16980588
  title: Identification of a novel regulatory protein (CsrD) that targets the global
    regulatory RNAs CsrB and CsrC for degradation by RNase E.
  findings:
  - statement: The degenerate EAL domain of E. coli CsrD does not hydrolyse c-di-GMP.
    supporting_text: These results suggested that the EAL domain of CsrD activity
      does not hydrolyze c-di-GMP.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited only for the node-level GO_CENTRAL defect: CsrD is a leaf of
      PTN002105365 that receives the GO:0071111 IBA.
