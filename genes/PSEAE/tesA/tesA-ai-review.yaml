  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    summary: >-
      UniProt subcellular-location mapping from "Secreted" (by similarity, ECO:0000250).
    action: TOO_GENERAL
    reason: >-
      Fractionation in P. aeruginosa places TesA mainly in the periplasm, not the culture
      supernatant. In GO the periplasmic space is part_of the extracellular region, so the term
      is true but entailed by GO:0030288 outer membrane-bounded periplasmic space, which this
      review accepts. The UniProt "Secreted" line would be better as Periplasm.
    supported_by:
    - reference_id: PMID:23874889
      supporting_text: These results indicate that TesA is primarily localized in the periplasm.
