suggested_questions:
- question: >-
    Does a tesA deletion raise lysophospholipid content in P. aeruginosa membranes, as the
    proposed role in lysoPL homeostasis predicts?
suggested_experiments:
- description: >-
    Lipidomics of the periplasm and both membranes in wild type and a tesA deletion, grown with
    and without membrane stress, to test whether TesA lowers lysophosphatidylcholine and
    lysophosphatidylethanolamine levels in vivo.
