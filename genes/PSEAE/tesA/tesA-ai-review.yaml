gene_symbol: tesA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  TesA (PA2856) is a small (201 aa) SGNH/GDSL-family serine hydrolase of Pseudomonas
  aeruginosa with a Sec signal peptide, closely related to Escherichia coli TesA/TAP
  (thioesterase I/protease I/lysophospholipase L1). The purified enzyme hydrolyses
  1-acyl-sn-glycero-3-phosphocholines (lysophosphatidylcholines with C6, C12 and C16 acyl
  chains) with high catalytic efficiency, well above its activity on artificial esterase
  substrates, so lysophospholipase A1 activity is its best-supported physiological activity.
  It also hydrolyses short-chain p-nitrophenyl esters and Tween detergents, has only low
  thioesterase activity on palmitoyl-CoA, and no protease activity. Fractionation in P.
  aeruginosa places TesA mainly in the periplasm, where it has been proposed to keep
  membrane lysophospholipid levels low. Its crystal structure shows the canonical SGNH
  alpha/beta/alpha fold with a Ser-Asp-His catalytic triad.
existing_annotations:
- term:
    id: GO:0004064
    label: arylesterase activity
  evidence_type: IDA
  original_reference_id: PMID:20931591
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA. Purified TesA hydrolyses p-nitrophenyl (aryl) esters, mainly short-chain
      ones such as p-nitrophenyl butyrate.
    action: KEEP_AS_NON_CORE
    reason: >-
      Activity on p-nitrophenyl esters is real, measured on the purified enzyme, and fits the
      arylesterase definition, but the substrate is artificial; the later study from the same
      group shows that lysophosphatidylcholine is hydrolysed with about 10- to 100-fold higher
      catalytic efficiency, and names lysophospholipase A as the likely physiological activity.
      This row is not a PAINT seed.
    supported_by:
    - reference_id: PMID:20931591
      supporting_text: >-
        TesA, EstA and EstP were shown to function as esterases with different affinities and
        catalytic efficacies towards p-nitrophenyl butyrate.
    - reference_id: PMID:23874889
      supporting_text: >-
        We previously reported high arylesterase, minor thioesterase and no protease activities
        for TesA
