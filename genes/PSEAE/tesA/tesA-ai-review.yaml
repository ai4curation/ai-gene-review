      Full text read. The substrates assayed are 1-acyl-sn-glycero-3-phosphocholines, the exact
      substrate of the GO:0004622 reaction, with the purified P. aeruginosa enzyme; the
      catalytic efficiency is far above that for p-nitrophenyl butyrate. Seed verdict SOUND.
