  title: Probing enzyme promiscuity of SGNH hydrolases.
  findings:
  - statement: >-
      Purified TesA acts mainly as an esterase on p-nitrophenyl esters, with little or no
      lipase, phospholipase, thioesterase or protease activity.
    supporting_text: >-
      TesA, EstA and EstP were shown to function as esterases with different affinities and
      catalytic efficacies towards p-nitrophenyl butyrate.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Chembiochem 2010); abstract only. It names TesA (Q9HZY8) and reports
      esterase activity on p-nitrophenyl butyrate, which supports the PseudoCAP arylesterase
      and UniProt carboxylesterase IDA rows.
- id: PMID:23874889
  title: Structural and functional characterisation of TesA - a novel lysophospholipase
    A from Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Purified TesA hydrolyses 1-acyl glycerophosphocholines (C6, C12, C16) with high catalytic
      efficiency, suggesting lysophospholipase A is a physiological activity.
    supporting_text: >-
      strongly suggest that lysophospholipase A activity may represent at least one of the
      physiological functions of TesA
  - statement: TesA is mainly periplasmic in P. aeruginosa.
    supporting_text: These results indicate that TesA is primarily localized in the periplasm.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PLoS One 2013). Kinetics of purified TesA on 1-acyl lysophosphatidylcholines
      directly support the PseudoCAP IDA for GO:0004622, the PTN000769562 seed.
