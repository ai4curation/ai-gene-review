      phenotype, consistent with loss of envelope integrity.
- id: PMID:26223882
  title: >-
    Site-specific activity of the acyltransferases HtrB1 and HtrB2 in Pseudomonas aeruginosa lipid A biosynthesis.
  findings:
  - statement: >-
      PA0011 (htrB1) and PA3242 (htrB2) each perform site-specific secondary acylation of lipid A.
    supporting_text: >-
      In this study, we were able to show that each gene identified is responsible for site-specific modification
      of lipid A.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      PseudoCAP IDA source for the acyltransferase and lipid A biosynthesis rows of both htrB1 (PA0011)
      and htrB2 (PA3242), which seed PTN004745460 and (htrB2) PTN000770079. Abstract only (PubMed MCP
      returned no body; Europe PMC full text unavailable). The abstract states that each gene is responsible
      for site-specific lipid A acylation, which supports the terms; the assays behind the IDA code (lipid
      A mass spectrometry of mutants or of heterologous expression) were not checked.
