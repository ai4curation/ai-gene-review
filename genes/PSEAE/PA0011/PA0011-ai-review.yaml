taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0011 (HtrB1) is one of two HtrB/LpxL-type lipid A late acyltransferases of Pseudomonas aeruginosa.
  It belongs to the lipid A biosynthesis acyltransferase family (Pfam Lip_A_acyltrans) and, with HtrB2
  (PA3242), adds the secondary laurate or 2-hydroxylaurate chains of lipid A, each enzyme acting at a
  specific site. It is expected to sit in the inner membrane like other family members. Mutants are more
  susceptible to several antibiotics, cationic antimicrobial peptides and environmental stresses and have
  a more permeable outer membrane.
