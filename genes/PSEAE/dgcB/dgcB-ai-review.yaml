knowledge_gaps:
- gap_statement: >-
    No activity of DgcB or DgcA has ever been measured, so the reaction that converts
    dimethylglycine to sarcosine in Pseudomonas aeruginosa is uncharacterised: which
    subunit removes the methyl group, what accepts the electrons (an
    electron-transfer flavoprotein, a membrane quinone, or DgcA's flavin), and
    whether the one-carbon product is free formaldehyde or a tetrahydrofolate adduct.
  boundary: >-
    Firmly established: dgcA and dgcB are both genetically required for the
    dimethylglycine to sarcosine step, mutants accumulate 13C-labelled
    dimethylglycine, and both genes are induced by glycine betaine and
    dimethylglycine through GbdR. DgcB's two 4Fe-4S ferredoxin domains and five
    transmembrane helices are signature-level predictions, not measurements.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    The two molecular functions currently annotated to dgcB assert mutually exclusive
    chemistries, and a PAINT IBD propagates an oxidoreductase annotation to 33 leaves
    from this single unverified seed, so the gap has consequences well beyond this
    gene.
  resolution: >-
    Purify DgcA and DgcB, separately and together, and assay dimethylglycine
    consumption with candidate acceptors, measuring the one-carbon product.
  provenance:
  - reference_id: file:PSEAE/dgcB/dgcB-notes.md
    supporting_text: >-
      characterization of the biochemical activities of the `dgcA` and `dgcB` gene products remains a subject
      for future research
suggested_questions:
- question: >-
    Which of DgcA and DgcB removes the methyl group from dimethylglycine, and what is
    the immediate electron acceptor of DgcB's 4Fe-4S clusters: a membrane quinone, an
    electron-transfer flavoprotein, or DgcA's flavin?
- question: >-
    Is the one-carbon product released as formaldehyde, as the GO dimethylglycine
    dehydrogenase and oxidase definitions require, or transferred to
    tetrahydrofolate as in the mammalian enzyme?
- question: >-
    Do DgcA and DgcB form a stable membrane complex, as the failure of multiple dgcA
    rescue constructs to complement the dgcA deletion suggests?
suggested_experiments:
- description: >-
    Express and purify DgcA and DgcB (the latter from membranes, in detergent or
    nanodiscs), confirm the iron-sulfur content by EPR and iron/sulfide analysis, and
    assay dimethylglycine-dependent reduction of candidate acceptors (electron-transfer
    flavoprotein, menaquinone analogues, artificial dyes, O2 with peroxide detection)
    for each protein alone and for the pair, to settle which activity term applies and
    to which subunit.
- description: >-
    Trace the removed methyl carbon with 13C-labelled dimethylglycine in cell-free
    extracts, testing for free formaldehyde versus 5,10-methylenetetrahydrofolate, and
    compare wild type with dgcA and dgcB deletions.
