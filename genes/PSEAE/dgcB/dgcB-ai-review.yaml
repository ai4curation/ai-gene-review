id: Q9HTG5
gene_symbol: dgcB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  dgcB (PA5399) encodes the iron-sulfur, membrane-integral component of the
  DgcAB system of Pseudomonas aeruginosa, which converts N,N-dimethylglycine
  (DMG) to sarcosine in the catabolism of glycine betaine. Glycine betaine is
  both an osmolyte and a carbon and nitrogen source, and arises from choline and
  carnitine; it is demethylated to DMG by GbcAB, DMG to sarcosine by DgcAB, and
  sarcosine to glycine by the sarcosine oxidase SoxBDAG, with the AraC-family
  regulator GbdR inducing gbcAB and dgcAB in response to glycine betaine or DMG.
  DgcB has five predicted transmembrane helices, two 4Fe-4S ferredoxin-type
  domains and two cysteine-rich CCG domains, and belongs to a PANTHER family of
  electron-transfer iron-sulfur subunits that includes heterodisulfide reductase
  subunit C, Bacillus FadF and an EtfAB:quinone oxidoreductase. Its partner
  DgcA (PA5398) is a predicted FMN oxidoreductase resembling N-methylproline
  demethylases. The genetic requirement of both genes for the DMG to sarcosine
  step is established, by loss of growth on DMG and by accumulation of
  13C-labelled DMG in mutants, but no activity of either protein has been
  measured: which subunit removes the methyl group, what the immediate electron
  acceptor is, and whether the one-carbon product is free formaldehyde or a
  tetrahydrofolate adduct are all unknown.
