core_functions:
- description: >-
    Membrane-integral iron-sulfur component of the DgcAB dimethylglycine
    demethylase system. With two 4Fe-4S clusters and two CCG domains in a family of
    electron-transfer iron-sulfur subunits, DgcB is required, together with the FMN
    oxidoreductase DgcA, for the conversion of N,N-dimethylglycine to sarcosine in
    glycine betaine catabolism; it most plausibly carries the electrons from that
    demethylation to a downstream acceptor. The reaction's acceptor, the fate of the
    removed methyl group, and the division of catalytic labour between DgcA and
    DgcB have not been determined experimentally.
