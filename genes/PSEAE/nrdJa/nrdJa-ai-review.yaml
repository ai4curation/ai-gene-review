suggested_questions:
- question: >-
    Which thiol redox protein (thioredoxin, glutaredoxin or an NrdH-like protein) is
    the physiological electron donor to the P. aeruginosa NrdJa-NrdJb enzyme? Both
    published assays used DTT, so the "thioredoxin disulfide as acceptor" clause in
    GO:0004748 and GO:0008998 is an inference rather than a measurement.
- question: >-
    Should GO provide a cobalamin-dependent ribonucleotide reductase term that is
    neutral with respect to the phosphorylation state of the substrate, so that
    PAINT nodes spanning NDP- and NTP-specific class II enzymes (such as
    PTN000171476 in PTHR43371) need not commit to one?
- question: >-
    Is the split architecture a regulatory device, i.e. is NrdJb limiting in vivo
    under any condition, so that the cell can tune class II RNR activity by
    subunit availability?
suggested_experiments:
- description: >-
    Assay purified NrdJa-NrdJb with the P. aeruginosa thioredoxin and glutaredoxin
    systems (plus NADPH and the corresponding reductases) in place of DTT, with CTP
    and CDP in parallel, to identify the physiological reductant and to quantify the
    NTP/NDP preference under physiological reducing conditions.
- description: >-
    Measure dNTP pools and mutation rates in nrdJa, nrdJb and nrdJab deletion
    strains under aerobic, microaerobic and hydroxyurea-stressed growth, with and
    without cobalamin supplementation, to test the proposed DNA-repair and
    low-oxygen replication role.
