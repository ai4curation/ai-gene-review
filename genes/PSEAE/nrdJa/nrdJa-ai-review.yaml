      P. aeruginosa extracts and that adenosylcobalamin rescues hydroxyurea-poisoned
      cells; it establishes cobalamin-dependent ribonucleotide reductase activity for
      this gene product.
    action: MODIFY
    reason: >-
      The activity claim is sound, and NrdJa is the catalytic subunit that carries
      the cobalamin, substrate and effector sites, so enables is the right relation
      even though efficient turnover needs NrdJb. The substrate clause is the
      problem: with purified subunits the enzyme prefers ribonucleoside
      triphosphates by more than 60-fold, so GO:0008998 is the better term for the
      main reaction. This is a lateral correction, not a refinement; diphosphate
      reduction does occur, so the ideal record carries both terms, and the proposed
      replacement is the one the row is missing. The acceptor clause is untested in
      the purified-enzyme study (DTT, TCEP), and unchecked for PMID:15722359, whose
      full text was not read; this is a caveat on both terms.
