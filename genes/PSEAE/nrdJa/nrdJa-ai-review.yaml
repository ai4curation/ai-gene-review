  review:
    summary: >-
      IBA from PTN000171476, a class II RNR node of PTHR43371, whose IBD rests only
      on this gene's PseudoCAP IDA row (39 leaf IBAs over 33 taxa). This gene
      appearing in its own WITH/FROM reflects that experimental grounding exists on
      the target itself, and is expected rather than circular.
    action: MODIFY
    reason: >-
      The clade assignment is right and NrdJa is a genuine cobalamin-dependent
      ribonucleotide reductase, so the node is correctly placed; but the propagated
      term over-specifies on both of its qualifying clauses. The purified
      P. aeruginosa enzyme reduces CTP more than 60-fold faster than CDP, so the
      triphosphate term GO:0008998 describes its main reaction, and the acceptor was
      not thioredoxin in the purified-enzyme assays (DTT and TCEP were used; the
      reductant of the 2005 extract assays is unchecked, abstract only). PTHR43371
      mixes NDP-specific and NTP-specific members, including several rtpR
      adenosylcobalamin-dependent ribonucleoside-triphosphate reductases, so
      propagating only the diphosphate term asserts a substrate specificity the node
      cannot support. GO offers no cobalamin-dependent RNR term that is neutral
      between NDP and NTP below GO:0016728, so the node should carry both terms. The
      correction is lateral, not a refinement, and the diphosphate reaction is real
      for this enzyme, just minor, so the row is retained with the triphosphate term
      proposed alongside rather than removed.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000171476
