id: Q9HT76
gene_symbol: nrdJa
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  nrdJa (PA5497) encodes the large, catalytic polypeptide of the class II
  (adenosylcobalamin-dependent) ribonucleotide reductase of Pseudomonas
  aeruginosa. P. aeruginosa carries all three classes of ribonucleotide
  reductase, and its class II enzyme is unusual in being split: nrdJa and the
  adjacent nrdJb (PA5496) are separated by 16 bp and co-transcribed as the
  nrdJab operon, and the 734-residue NrdJa and the 229-residue NrdJb assemble
  into an (NrdJa-NrdJb)2 dimer of heterodimers. NrdJa holds the complete
  catalytic machinery: the adenosylcobalamin radical-generating site, the
  substrate site and the ATP allosteric specificity site; NrdJb contributes the
  C-terminal redox-active cysteine pair that performs thiol-disulfide exchange
  after each turnover, which an unsplit class II enzyme carries on its own
  C-terminal tail. Purified NrdJa plus NrdJb reduce ribonucleoside
  triphosphates (CTP) more than 60-fold faster than the corresponding
  diphosphate, so the enzyme is effectively a cobalamin-dependent
  ribonucleoside-triphosphate reductase that also reduces diphosphates.
  Like most class II enzymes it lacks the dATP overall-activity site. The
  enzyme supplies deoxyribonucleotides when the oxygen-dependent class I enzyme
  is unavailable: nrdJa transcript rises on entry to stationary phase, and
  adenosylcobalamin rescues growth of hydroxyurea-poisoned cells, in which
  class I activity is destroyed. The physiological thiol reductant has not been
  identified; both published assays used dithiothreitol.
