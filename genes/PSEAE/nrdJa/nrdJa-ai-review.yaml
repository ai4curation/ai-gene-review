        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target's own PseudoCAP IDA row (PMID:15722359) is the IBD seed, so it
          appears in its own WITH/FROM. That is the expected marker of experimental
          grounding on the target, not circularity. The later purified-enzyme study
          of the same protein (PMID:26225432) is what shows the seeded term's
          substrate clause to be the minor reaction.
    proposed_replacement_terms:
    - id: GO:0008998
      label: ribonucleoside-triphosphate reductase (thioredoxin) activity
    supported_by:
