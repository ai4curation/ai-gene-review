core_functions:
- description: >-
    Catalytic subunit of the split class II ribonucleotide reductase of
    P. aeruginosa. Using an adenosylcobalamin-generated radical and ATP as
    allosteric effector, it reduces ribonucleotides to deoxyribonucleotides,
    preferring ribonucleoside triphosphates (CTP) over diphosphates by more than
    60-fold. Efficient turnover requires the small NrdJb subunit, which supplies the
    redox-active cysteine pair for thiol-disulfide exchange, in an (NrdJa-NrdJb)2
    complex; NrdJa alone retains low activity with an artificial dithiol. The enzyme
    supplies deoxyribonucleotides when the class I enzyme cannot operate.
