- term:
    id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IMP
  original_reference_id: PMID:17158671
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP from the Overhage et al. 2007 mini-Tn5-lux screen: a
      PA5208 insertion mutant swarms poorly.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The phenotype is real but indirect: swarming is performed by the
      flagellum with rhamnolipid surfactant, and PA5208 is a cytoplasmic
      PhoU-like protein of unknown activity whose mutant also has a growth
      defect. The insertion may also be polar on the neighbouring Pit gene
      PA5207. Necessity in a screen does not show participation.
    supported_by:
    - reference_id: PMID:17158671
      supporting_text: >-
        36 mutants were identified with Tn5 insertions in genes for the
        synthesis or function of flagellin and type IV pilus, in genes for the
        Xcp-related type II secretion system, and in regulatory, metabolic,
        chemosensory, and hypothetical genes with unknown functions.
    - reference_id: PMID:17158671
      supporting_text: >-
        and a PA5208 mutant that had a slight growth defect
