taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5208 is an uncharacterised cytoplasmic protein of the UPF0111/TIGR00153
  (DUF47) family, which has a PhoU-like helical-bundle fold. Members of the
  family are often encoded next to Pit-type inorganic phosphate transporters,
  and PA5208 lies beside the Pit-family gene PA5207, suggesting a role as a
  PhoU-like regulator or accessory protein of phosphate uptake; this has not
  been tested. Its only reported phenotype is from a transposon screen, in
  which a PA5208 insertion mutant grew slightly more slowly and swarmed and
  formed biofilm less well than wild type.
