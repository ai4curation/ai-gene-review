suggested_questions:
- question: >-
    Is PA5208 a PhoU-like regulator of the adjacent Pit transporter PA5207,
    and does its loss perturb phosphate uptake or polyphosphate levels?
suggested_experiments:
- description: >-
    Make an in-frame, non-polar PA5208 deletion and test growth, swarming and
    32P-phosphate uptake at low and high phosphate, with and without PA5207,
    to separate a phosphate-transport role from polar or growth effects.
