  - *id002
suggested_questions:
- question: >-
    How does loss of Np20/Zur reduce pyocyanin production and quorum-sensing gene expression:
    through zinc excess, through Zur-regulated paralogs (for example zinc-independent
    ribosomal proteins), or through a direct Zur target in the quorum-sensing network?
suggested_experiments:
- description: >-
    ChIP-seq of Zur under zinc-replete conditions to define its direct regulon, combined with
    pyocyanin and pqsA reporter measurements in Δzur with and without zinc chelation.
  experiment_type: ChIP-seq / reporter assay
