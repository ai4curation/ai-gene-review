id: Q9HT74
gene_symbol: np20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Np20 (PA5499), also called Zur, is the Fur-family zinc uptake regulator of Pseudomonas
  aeruginosa. It is encoded in an operon with znuC and znuB of the high-affinity ZnuABC
  zinc transporter. When zinc is plentiful, zinc-loaded Zur binds the znuA promoter and
  represses transcription of the zinc uptake genes; under zinc limitation repression is
  relieved. Loss of zur raises intracellular zinc. An np20 transposon mutant was also
  isolated as pyocyanin-deficient, with reduced expression of quorum-sensing-controlled
  genes, and np20 was earlier reported to be required for virulence in neutropenic mice.
