  title: Functions required for extracellular quinolone signaling by Pseudomonas aeruginosa.
  findings:
  - statement: An np20 transposon mutant has reduced transcription of quorum-sensing-controlled genes.
    supporting_text: Third, mutations in the putative regulators np20 and PA3946 reduced transcription
      of a number of quorum sensing-controlled genes, showing that these functions participate in the quorum-sensing
      regulatory network.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for IMP GO:1900376, one of the two seeds of the PTN002112386
      GO:1900376 IBD. Full text cached and read for np20: a pyocyanin-deficient transposon
      mutant with lower expression of quorum-sensing genes; no mechanism linking Np20 to
      secondary-metabolite biosynthesis is shown.
- id: PMID:24086521
  title: The transcriptional regulator Np20 is the zinc uptake regulator in Pseudomonas aeruginosa.
  findings:
  - statement: Zinc-dependent repression of znuA is lost in the zur mutant.
    supporting_text: transcription of znuA was repressed in a zinc-dependent manner in strain PAO1, however
      zinc-dependent transcriptional repression was alleviated in strain PAO-Zur
  - statement: Recombinant Zur binds the znuA promoter specifically and zinc-dependently.
    supporting_text: Electrophoretic mobility shift assays also revealed that recombinant ZurPA specifically
      binds to the promoter region of znuA and does not bind in the presence of the zinc chelator
  - statement: The zur mutant accumulates more intracellular zinc.
    supporting_text: Intracellular zinc concentrations in strain PAO-Zur (Δzur) were found to be higher
      than those for strain PAO1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for IDA DNA binding and negative regulation of transcription (seed of
      the PTN002112386 GO:0045892 IBD), and IMP zinc homeostasis, response to zinc and
      regulation of zinc transport. Full text cached.
