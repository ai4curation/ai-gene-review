- term:
    id: GO:1900376
    label: regulation of secondary metabolite biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:12426334
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP and one of two seeds of the PTN002112386 GO:1900376 IBD. An np20
      transposon mutant was isolated as pyocyanin-deficient and had reduced expression of
      quorum-sensing-controlled genes. Seed verdict INDIRECT-PHENOTYPE.
    action: REMOVE
    reason: >-
      The paper reports a pleiotropic mutant phenotype without any mechanism; Np20's
      demonstrated function is zinc-responsive repression of zinc uptake genes. The lower
      pyocyanin is most likely a downstream consequence of disturbed zinc homeostasis or
      quorum-sensing output, not regulation of phenazine biosynthesis by Np20.
    supported_by:
    - *id003
    - *id002
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:1900376
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        PseudoCAP IMP row for PA5499/np20 (Q9HT74), GO:1900376 regulation of secondary
        metabolite biosynthetic process, from PMID:12426334 (Gallagher et al. 2002). The
        full text reports an np20 transposon mutant from a pyocyanin-deficiency screen with
        reduced transcription of several quorum-sensing-controlled genes; it does not test
        whether Np20 acts on phenazine or other secondary-metabolite genes. Np20 was later
        shown to be Zur, a zinc-responsive repressor of the znuABC zinc uptake genes
        (PMID:24086521). The row records an indirect, pleiotropic phenotype. Requested
        change: delete the row. This row also seeds the PTN002112386 GO:1900376 IBD. PROBABLE
        because the indirectness is an inference from the absence of a mechanism and from
        the protein's known function.
      supported_by:
      - *id003
core_functions:
- description: >-
    Zinc-responsive Fur-family repressor (Zur) that binds the znuA promoter when zinc is
    replete and represses the ZnuABC zinc uptake genes, maintaining intracellular zinc.
  molecular_function:
    id: GO:0001217
    label: DNA-binding transcription repressor activity
  directly_involved_in:
