- term:
    id: GO:0044010
    label: single-species biofilm formation
  evidence_type: IDA
  original_reference_id: PMID:19717596
  qualifier: involved_in
  review:
    summary: >-
      Mutants lacking migA make biofilms with altered mechanics and structure, a downstream consequence
      of LPS core truncation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper uses defined LPS mutants to study how core capping affects adhesion, cohesion and biofilm
