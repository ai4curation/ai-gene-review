- term:
    id: GO:0015920
    label: lipopolysaccharide transport
  evidence_type: IDA
  original_reference_id: PMID:19589832
  qualifier: involved_in
  review:
    summary: >-
      The cited study compared motility and surface attachment of migA, migA/wapR and rmlC mutants with
      truncated core; it does not address LPS transport, and the migA product builds the core rather than
      moving LPS.
    action: REMOVE
    reason: >-
      Core rhamnosyltransferases act at the cytoplasmic face of the inner membrane before LPS is exported
      by MsbA and the Lpt machinery. The abstract reports altered motility and attachment as consequences
      of LPS truncation. Neither result is LPS transport, and an IDA code on a mutant phenotype study
      does not fit. Removed with a PseudoCAP defect.
    supported_by:
    - reference_id: PMID:19589832
      supporting_text: >-
        P. aeruginosa wild-type strain PAO1 and three isogenic mutants with defects in the rmlC, migA
        and wapR genes and producing truncated core oligosaccharide were investigated in terms of motility,
        attachment to glass and flagella expression.
    - reference_id: PMID:19589832
      supporting_text: >-
        LPS truncations probably alter flagella-mediated motility in P. aeruginosa by modulating cell-surface
        attachment but not flagella synthesis
    - reference_id: PMID:18178733
      supporting_text: >-
        These results provide evidence that WapR is the alpha-1,3-rhamnosyltransferase, while MigA is
        the alpha-1,6-rhamnosyltransferase.
