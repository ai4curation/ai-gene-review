      supporting_text: >-
        truncation of core oligosaccharides enhanced both adhesive and cohesive forces by up to 10-fold
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:18178733
  title: >-
    Functional characterization of MigA and WapR: putative rhamnosyltransferases involved in outer core
    oligosaccharide biosynthesis of Pseudomonas aeruginosa.
  findings:
  - statement: >-
      WapR adds the alpha-1,3-L-Rha of the O-antigen-capped core; MigA adds the alpha-1,6-L-Rha of the
      uncapped core.
    supporting_text: >-
      These results provide evidence that WapR is the alpha-1,3-rhamnosyltransferase, while MigA is the
      alpha-1,6-rhamnosyltransferase.
  - statement: NMR and mass spectrometry of mutant LPS show the missing rhamnose linkage in each mutant.
    supporting_text: In contrast, uncapped core OS from the migA mutant lacked alpha-1,6-L-Rha.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only here (full text in PMC2258888 could not be retrieved in this session). The abstract
      states the structural result for each mutant outright, which supports the core-biosynthesis and
      glycosyltransferase rows on both genes. The title calls the enzymes putative and the abstract describes
      no in vitro transferase assay, so the IDA code on the glycosyltransferase rows may be better as
      IMP; the term is right either way.
- id: PMID:19589832
  title: >-
    Truncation in the core oligosaccharide of lipopolysaccharide affects flagella-mediated motility in
    Pseudomonas aeruginosa PAO1 via modulation of cell surface attachment.
  findings:
  - statement: >-
      Core-truncated LPS mutants (rmlC, migA, wapR) show reduced swimming and swarming and stronger attachment,
      without loss of flagella.
    supporting_text: >-
      LPS truncations probably alter flagella-mediated motility in P. aeruginosa by modulating cell-surface
      attachment but not flagella synthesis
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Abstract-only. Cited by PseudoCAP for GO:0015920 lipopolysaccharide transport; the abstract reports
      motility and attachment phenotypes of LPS mutants and no LPS transport experiment. MISCITED is a
      judgement from the abstract (PROBABLE in the source defect).
- id: PMID:19717596
  title: >-
    Differential lipopolysaccharide core capping leads to quantitative and correlated modifications of
    mechanical and structural properties in Pseudomonas aeruginosa biofilms.
  findings:
  - statement: >-
      Core truncation in migA, wapR and rmlC mutants changes cell adhesive and cohesive forces and biofilm
      structure.
    supporting_text: >-
      truncation of core oligosaccharides enhanced both adhesive and cohesive forces by up to 10-fold
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Abstract-only. Real mutant phenotypes, downstream of LPS structure; supports only an over-annotated
      biofilm row.
- id: PMID:22685285
  title: >-
    Rhamnosyltransferase genes migA and wapR are regulated in a differential manner to modulate the quantities
    of core oligosaccharide glycoforms produced by Pseudomonas aeruginosa.
  findings:
  - statement: migA is positively and wapR negatively regulated by RhlR/RhlI quorum sensing.
    supporting_text: >-
      wapR is negatively regulated, while migA is positively regulated by RhlR/RhlI quorum sensing.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; regulation of migA expression and glycoform ratio.
