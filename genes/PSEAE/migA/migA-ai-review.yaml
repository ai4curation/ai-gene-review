taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  MigA (PA0705) is a GT2-family glycosyltransferase that adds the alpha-1,6-linked L-rhamnose to the outer
  core oligosaccharide of Pseudomonas aeruginosa lipopolysaccharide. P. aeruginosa makes two core glycoforms:
  an uncapped form carrying alpha-1,6-L-Rha (made by MigA) and an O-antigen-capped form in which the O
  antigen is attached through alpha-1,3-L-Rha (made by WapR). A migA mutant makes an uncapped core lacking
  alpha-1,6-L-Rha and loses reactivity to the outer-core antibody 5C101; overexpression of MigA raises
  the proportion of uncapped core, so the relative levels of MigA and WapR set the ratio of the two glycoforms.
  migA is positively regulated by RhlR/RhlI quorum sensing. Core truncation in the mutant secondarily
  alters motility, surface attachment and biofilm mechanics.
