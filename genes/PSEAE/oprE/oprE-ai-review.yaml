    review_notes: >-
      Abstract only. Source of the PseudoCAP IMP porin activity and IDA outer membrane rows for both oprD
      (D2) and oprE (E1). The abstract itself states that the mutants lost four OM proteins at once (plus
      a PBP3 alteration in the highly resistant mutants) and attributes porin function to at least one
      of the four, so the IMP cannot assign porin activity to any single protein. The OM-fraction IDA
      is plausible.
- id: PMID:22272184
  title: Substrate specificity within a family of outer membrane carboxylate channels.
  findings:
  - statement: >-
      Occ (OprD family) channels are the main route for small water-soluble molecules across the P. aeruginosa
      outer membrane.
    supporting_text: >-
      most of the water-soluble small molecules are thought to be taken up by members of the Outer membrane
      carboxylic acid channel (Occ) family
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Crystal structures, single-channel electrophysiology and vesicle uptake assays for
      OccD1-D3 and OccK1-K6; direct channel evidence for OprD (OccD1) and OpdP (OccD3).
