taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  OprE (OccK8, PA0291) is an anaerobically induced outer membrane channel of Pseudomonas aeruginosa belonging
  to the OccK subfamily of the outer membrane carboxylate channel (Occ, formerly OprD) family. It is a
  beta-barrel substrate-specific channel with a Sec signal peptide; purified native OccK8 forms channels
  in planar lipid bilayers with several conductance states, and its permeation of charged amino acids
  has been probed. It was originally identified as outer membrane protein E1, whose reduced level was
  associated with decreased outer membrane permeability to beta-lactams and quinolones. Its physiological
  substrates are not established.
