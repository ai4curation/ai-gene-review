suggested_questions:
- question: >-
    What are the physiological substrates of OprE/OccK8, and why is it induced under anaerobic conditions?
suggested_experiments:
- description: >-
    Screen radiolabelled carboxylates and amino acids for OccK8-dependent uptake in porin-deficient E.
    coli vesicles, and compare growth of an oprE deletion on candidate carbon sources under anaerobic
    denitrifying conditions.
