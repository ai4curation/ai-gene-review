gene_symbol: PA3177
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3177 is a 307-residue soluble diguanylate cyclase of Pseudomonas aeruginosa
  with a C-terminal GGEEF domain. It is expressed mainly in biofilms, where it
  makes a pool of cyclic di-GMP that maintains levels and DNA binding of the
  transcriptional regulator BrlR and so contributes to biofilm tolerance to
  tobramycin and hydrogen peroxide. Loss of PA3177 lowers biofilm c-di-GMP
  about 5-fold but does not affect attachment, biofilm formation or planktonic
  motility; overexpression represses swimming and swarming in a GGEEF-dependent
  manner.
references:
- id: PMID:30082282
  title: The PA3177 Gene Encodes an Active Diguanylate Cyclase That Contributes to Biofilm
    Antimicrobial Tolerance but Not Biofilm Formation by Pseudomonas aeruginosa.
  findings:
  - statement: Deletion lowers biofilm c-di-GMP 5-fold; the GGAAF active-site mutant
      fails to restore it.
    supporting_text: Inactivation of PA3177 reduced total cellular c-di-GMP levels 5-fold
      under biofilm growth conditions
  - statement: PA3177 is not needed for attachment or biofilm formation.
    supporting_text: While PA3177 contributed to biofilm drug tolerance, inactivation
      of PA3177 had no effect on attachment and biofilm formation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. PseudoCAP source of the GO:0052621 IMP seed row;
      deletion, complementation and active-site mutant c-di-GMP measurements
      directly support the activity.
