suggested_questions:
- question: >-
    If PslB and WbpW are interchangeable, why does P. aeruginosa keep both, and why is one of them
    inside the psl operon? Co-transcription with the Psl machinery suggests the cell gains
    something from making this enzyme at the same time and place as the polymerase, which pure
    redundancy would not explain.
- question: >-
    Is the GDP-mannose pool shared or partitioned? The paper shows the same two enzymes serving
    both Psl and A-band LPS, which raises the question of whether the two polymers compete for one
    pool or whether channelling keeps them apart.
- question: >-
    Does the reported inhibition of PslB's isomerase activity by accumulated GDP-mannose act on
    both halves of the bifunctional protein or only on the isomerase, and is it a genuine
    feedback mechanism?
suggested_experiments:
- description: >-
    Assay the purified protein for both activities side by side, under conditions where
    GDP-mannose can be titrated, to test the feedback inhibition the paper proposes and to
    establish whether it is specific to the isomerase half.
- description: >-
    Compare Psl and A-band LPS output in strains expressing only pslB, only wbpW, or neither, with
    the GDP-mannose pool measured directly, to find out whether the two enzymes are quantitatively
    as well as qualitatively interchangeable.
- description: >-
    Separate the two domains and express them independently, assaying each for its own reaction,
    to test whether the bifunctionality is required or whether the halves work in isolation.
