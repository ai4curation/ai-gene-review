- id: PMID:19659934
  title: >-
    Genetic and biochemical analyses of the Pseudomonas aeruginosa Psl exopolysaccharide reveal
    overlapping roles for polysaccharide synthesis enzymes in Psl and LPS production.
  findings:
  - statement: >-
      The paper names PslB's isomerase activity as phosphomannose isomerase, i.e. the reaction on
      mannose 6-phosphate rather than on free mannose.
    reference_section_type: DISCUSSION
    supporting_text: >-
      Deletion of rmd may result in accumulation of GDP-d-Man that inhibits the phosphomannose
      isomerase (PMI) activity of PslB, resulting in a reduction in Psl (Lee et al.
  - statement: >-
      PslB is competent for both halves of the bifunctional activity on its own, without
      requiring WbpW.
    reference_section_type: RESULTS
    supporting_text: >-
      The lack of a Psl phenotype in the wbpW mutant demonstrates that PslB does not require WbpW
      for Psl synthesis and is capable of functioning as a PMI/GMP, in agreement with recently
      published PslB enzymatic data (Lee et al.
  - statement: >-
      Deleting pslB alone produces no attachment defect, which is the central genetic result for
      this gene and the reason the biofilm annotation on it is questioned here.
    reference_section_type: RESULTS
    supporting_text: >-
      Interestingly, deletion of pslB, pslM, pslN, or pslO did not result in an observable
      attachment defect compared to PAO1.
  - statement: >-
      Psl production is lost only when pslB and wbpW are both deleted, establishing that the two
      enzymes are redundant for supplying GDP-mannose.
    reference_section_type: RESULTS
    supporting_text: >-
      An ELISA quantifying Psl production by these same strains revealed a complete loss of Psl in
      extracts from the pslB wbpW double mutant but no significant decrease for extracts derived
      from the wbpW mutant (Fig.
  - statement: >-
      The same redundancy covers A-band lipopolysaccharide, so PslB is not an enzyme dedicated to
      the Psl pathway despite its name and operon.
    reference_section_type: RESULTS
    supporting_text: >-
      9A), indicating that A-band LPS synthesis requires the redundant PMI/GMP activity of either
      PslB or WbpW to generate product.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Byrd et al. 2009, Mol Microbiol). Full text is available in the cache via
      PMC4409829, so both PseudoCAP rows derived from it could be checked against the results
      rather than against the abstract, and both turn out to be at odds with what the paper
      reports: it names the isomerase activity as PMI, not mannose isomerase, and it states that
      the pslB single mutant has no attachment defect. The paper itself is sound and is the right
      citation for this gene; the problems are in how it was annotated.
