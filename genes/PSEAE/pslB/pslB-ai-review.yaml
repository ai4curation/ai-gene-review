    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Not entirely wrong — PslB can supply the GDP-mannose that Psl is built from, and the paper
      shows that either PslB or WbpW suffices — but the row overstates what this gene does and
      what was shown. On the evidence: "deletion of pslB, pslM, pslN, or pslO did not result in an
      observable attachment defect compared to PAO1", and the pslB mutant "showed abundant
      attachment"; only the pslB wbpW double mutant loses Psl and attaches poorly. On the biology:
      what PslB contributes is a nucleotide sugar, two enzymatic steps upstream of the polymer and
      further still from the community the term names, and the same GDP-mannose feeds A-band
      lipopolysaccharide, which is not a biofilm process at all. The supportable claim is
      precursor supply for a surface polysaccharide, which the polysaccharide-biosynthesis row
      already carries. Marked over-annotated rather than removed, because the redundancy the paper
      establishes does mean PslB can do this work when WbpW is absent.
