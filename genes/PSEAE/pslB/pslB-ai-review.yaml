core_functions:
- description: >-
    Bifunctional GDP-mannose-making enzyme: isomerises D-fructose 6-phosphate to D-mannose
    6-phosphate and, after the intervening mutase step, condenses alpha-D-mannose 1-phosphate with
    GTP to give GDP-alpha-D-mannose, the activated donor for the organism's mannose-containing
    surface polysaccharides. The activity is interchangeable with that of WbpW, so the two
    enzymes together, not PslB alone, determine whether the donor is available.
