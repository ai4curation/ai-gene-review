id: Q9I1N7
gene_symbol: pslB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PslB (PA2232) is a bifunctional nucleotide-sugar enzyme of the type 2 mannose-6-phosphate
  isomerase family that carries out two steps of GDP-mannose biosynthesis: it interconverts
  D-fructose 6-phosphate and D-mannose 6-phosphate, and it condenses alpha-D-mannose 1-phosphate
  with GTP to give GDP-alpha-D-mannose. The GDP-mannose it makes is the activated donor used to
  build mannose-containing surface polysaccharides, and although the gene sits in the psl operon
  for the Psl biofilm exopolysaccharide, the enzyme is not dedicated to it: its activity is
  interchangeable with that of WbpW, so either protein alone can supply the GDP-mannose needed
  for both Psl and the A-band lipopolysaccharide, and only loss of both abolishes production.
