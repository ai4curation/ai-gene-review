  review:
    summary: The iron of CcoP is heme iron, already captured by heme binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cytochrome c class I mapping adds iron ion binding, but CcoP binds
      iron only as heme c, covalently attached to CXXCH motifs; heme binding
      (GO:0020037) is the informative term and is already annotated.
