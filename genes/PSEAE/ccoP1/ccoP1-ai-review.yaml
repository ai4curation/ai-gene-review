id: Q9I3G5
gene_symbol: ccoP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CcoP1 (PA1552) is the diheme cytochrome c subunit (CcoP/FixP family) of the
  cbb3-1 cytochrome c oxidase of Pseudomonas aeruginosa, the isoform that is
  abundant in well-aerated cultures. The 318-residue protein is anchored in the
  inner membrane by two N-terminal transmembrane helices and carries two
  periplasmic c-type heme domains. Within the CcoNOQP complex it accepts
  electrons from donor cytochromes and passes them via CcoO to the heme b3-CuB
  centre of CcoN, where oxygen is reduced and protons are pumped, so it
  contributes to terminal oxidase activity in aerobic respiration without
  carrying a catalytic site of its own.
