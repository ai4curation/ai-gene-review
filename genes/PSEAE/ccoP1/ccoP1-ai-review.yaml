    action: ACCEPT
    reason: >-
      CcoP1 is a subunit of the cbb3-1 oxidase (TIGR00782 ccoP, FixP_N plus
      two cytochrome c domains), so the activity belongs to the complex it is
      part of; core_functions records it as contributes_to. Q9I3G5 in its own
