      another matter. Its 32 leaves include soluble cytochromes c4 (P.
      aeruginosa cc4 P00106, Neisseria, Vibrio, Shewanella, Xanthomonas),
      cytochromes c552/c554, the bc1-complex cytochrome c subunit QcrC of
      M. tuberculosis and Streptomyces, and PvcD; none of these is a cytochrome
      c oxidase subunit. Both seeds are the same operon-level PseudoCAP IMP, so
      the IBD does not stand on independent evidence (GO_CENTRAL defect below,
