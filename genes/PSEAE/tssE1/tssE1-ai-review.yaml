description: TssE1 is a phage gp25-like baseplate component of the Pseudomonas aeruginosa H1-T6SS. Acting downstream of TssK1, it contributes to correct elongation and stability of the TssB1-TssC1 sheath and provides a docking point for the ClpV1 ATPase.
