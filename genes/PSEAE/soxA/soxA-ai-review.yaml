  supporting_entities:
  - PANTHER:PTN000354478
  - UniProtKB:P37339
  review:
    summary: >-
      IBA from PTN000354478 placing the active protein at the plasma membrane. The donor was
      resolved against UniProt rather than read from the accession: P37339 is E. coli LhgD
      (LHGD_ECOLI), L-2-hydroxyglutarate dehydrogenase, whose record gives its location as
      cell inner membrane. This is not a sarcosine oxidase, and its membrane association
      follows from its own role feeding electrons to the respiratory chain.
    action: REMOVE
    reason: >-
      Over-propagated location. SoxA has no transmembrane segment and no membrane keyword on
      its record - only five DOMAIN features - and the sarcosine oxidase is a soluble
      cytoplasmic enzyme acting on cytoplasmic substrates. The donor's inner-membrane
      association is a property of L-2-hydroxyglutarate dehydrogenase's respiratory
      electron transfer, not of the FAD/NAD-binding fold the two proteins share, so it does
      not transfer to this clade. This is an argument about what the node asserts, not about
      the length of the donor list: the project rule is explicit that a single well
      characterised donor can be sound support, and the objection here is that this donor's
      compartment is specific to its own function.
    supported_by:
    - reference_id: PMID:17951379
      reference_section_type: DISCUSSION
      supporting_text: Once in the cytoplasm, choline binds to BetI
