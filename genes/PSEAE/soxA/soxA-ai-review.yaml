  qualifier: located_in
  review:
    summary: >-
      Proposed row, replacing the plasma-membrane location removed above. Removing that row
      would otherwise leave this subunit with no cellular-component annotation at all, while
      its own core activity has a definite compartment.
    action: NEW
    reason: >-
      An inference this review authors, from three independent lines that agree. The pathway
      runs on cytoplasmic substrates: glycine betaine is catabolised to glycine after
      entering the cytoplasm. SoxA has no transmembrane segment, no signal peptide and no
      membrane keyword on its record, only five soluble-protein domain features, so nothing
      in its sequence places it at a membrane. And the complex it belongs to is annotated to
      the cytoplasm on its catalytic subunit from an independent PANTHER node, which is where
      a soluble heterotetramer of this kind is expected to act. Coded IC because the
      conclusion is drawn from the other annotations and the sequence rather than from a
      localisation experiment on this protein; no fractionation or imaging of P. aeruginosa
      SoxA appears to have been reported.
