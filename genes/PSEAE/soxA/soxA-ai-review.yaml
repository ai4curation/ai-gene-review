      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:P37339
        source_label: LHGD_ECOLI, L-2-hydroxyglutarate dehydrogenase (E. coli K12)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Resolved against the UniProt API. The donor's own record does give its location as
          cell inner membrane, so the annotation is right for LhgD; it is the transfer that
          fails. LhgD is membrane-associated because it feeds electrons from
          L-2-hydroxyglutarate oxidation into the respiratory chain, a role the sarcosine
          oxidase alpha subunit does not have.
      - source_id: PANTHER:PTN000354478
        source_label: PTN000354478
        source_status: SOURCE_BAD
        comment: >-
          The node places a plasma-membrane location across a clade that includes a subunit
          of a soluble cytoplasmic complex. SoxA has no transmembrane segment and no membrane
          keyword on its record.
      residue_claims_not_applicable: >-
        A compartment assertion, not a residue-level claim, so no residue evidence applies.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      slot: GO term
      requested_change: DELETE_ROW
      asserted_value: GO:0005886
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        The PTN000354478 IBD places plasma membrane on a clade reached from E. coli LhgD
        (P37339), an inner-membrane L-2-hydroxyglutarate dehydrogenase. SoxA is the alpha
        subunit of a soluble cytoplasmic sarcosine oxidase, carries no transmembrane segment
        or membrane keyword, and shares with the donor only the FAD/NAD-binding domain. The
        two other annotated orthologs at the related GO:0047545 node, human and Arabidopsis
        L2HGDH, are mitochondrial rather than plasma-membrane, so even within the donor
        clade the compartment is not conserved. Requested as a row deletion rather than a
        repoint because the correct compartment for this protein, cytoplasm, is already
        asserted on the sibling subunit soxB from a different node and needs no new
        propagation here.
        This disagrees with the family review for PTHR43104, which assesses PTN000354478 as
        SOUND, and the disagreement is deliberate rather than an oversight. The family side now
        carries the qualifier: its reason previously held that "bacterial members of this family
        are peripheral cytoplasmic-membrane quinone-reducing enzymes", which holds for the seed
        LhgD and for the clade the node represents but not for SoxA, and a GO:0005886 term
        assessment there now lists Q9HTE6 as a member exception beside the GO:0047545 one.
        A deletion alone will not hold. The row is produced by PAINT from the IBD at
        PTN000354478, so GOA regenerates it until the node is pruned for this member, and no
        paint_action could be written for that: target_node_id is validated against the cached
        PANTHER tree, and Q9HTE6 appears in neither PTHR43104-entries.csv nor
        PTHR43104-paint.tsv, so there is no leaf node to prune to. The member exception is the
        available mechanism, and the durable fix needs PANTHER to carry this protein in the
        family's own inventory first.
