      a judgement this review disputes.
    action: REMOVE
    reason: >-
      The node is placed on a clade this protein does not functionally belong to, and the
      argument is about that placement rather than about sequence similarity. Three grounds.
      Architecture: the donors are single-chain FAD oxidoreductases, whereas SoxA is a
      1005-residue multidomain protein and one subunit of a four-subunit complex, sharing
      with them only the FAD/NAD-binding domain, while its GcvT folate-binding and 2Fe-2S
