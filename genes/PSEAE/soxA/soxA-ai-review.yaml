core_functions:
- description: >-
    One-carbon-handling alpha subunit of the heterotetrameric sarcosine oxidase: contributes
    to the complex that demethylates sarcosine to glycine, and carries the
    glycine-cleavage-T-protein folate-binding domains through which the methylene group is
    passed to tetrahydrofolate, together with a 2Fe-2S cluster.
