        mutant phenotype behind this row shows that soxA is required for the step, not that
        it catalyses it. The same correction is requested from the soxD and soxG reviews for
        those chains, and deliberately not from soxB. This follows the pattern of the cbb3
        oxidase reviews, where the identical operon-level row was corrected to contributes_to
        on the non-catalytic chains.
      supported_by:
      - reference_id: PMID:17951379
        reference_section_type: INTRODUCTION
        supporting_text: a heterotetrameric sarcosine oxidase converts sarcosine into glycine
