      supported_by:
      - reference_id: PMID:17951379
        reference_section_type: RESULTS
        supporting_text: only sarcosine was detected at 9 h in extracts from soxA
    - defect_type: WRONG_QUALIFIER
      resource: PSEUDOCAP
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: >-
        GO:0008115 on soxA (Q9HTE6) is coded enables. The enzyme is a heterotetramer and the
        catalytic site is on the beta subunit, SoxB, which is the only sox chain whose record
