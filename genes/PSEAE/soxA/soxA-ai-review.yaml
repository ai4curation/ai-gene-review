      resource: PSEUDOCAP
      slot: Reference
      requested_change: REPOINT
      asserted_value: PMID:17951384
      corrected_value: PMID:17951379
      cause: IDENTIFIER_TRANSPOSITION
      confidence: CONFIRMED
      explanation: >-
        PMID:17951384 is "Gene-specific regulation by a transcript cleavage factor:
        facilitating promoter escape", verified against PubMed by title, author and DOI
        (10.1128/JB.01611-07); it is a single-author Comment with no abstract. It concerns
        neither this organism, nor sarcosine, nor any oxidase, so no unread portion of it
        could support a sarcosine oxidase annotation on a P. aeruginosa protein - which is
        why this claim is made at CONFIRMED from the record alone rather than as a CHECK
        query. The intended paper is PMID:17951379 (Wargo et al., same journal, e-published
        the same day, immediately below a block of consecutive PMIDs), whose full text is
        cached and reports the soxA mutant NMR experiment. This is not an isolated slip: the
        identical transposition affects soxB (cites PMID:17951380), soxD (PMID:17951382) and
