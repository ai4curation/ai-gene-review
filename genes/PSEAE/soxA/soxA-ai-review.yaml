  review:
    summary: >-
      IBA from PTN002454638 asserting that SoxA is an L-2-hydroxyglutarate dehydrogenase. All
      three UniProt donors were resolved against the API rather than read from the
      accessions, and all three are L-2-hydroxyglutarate dehydrogenases: P37339 is E. coli
