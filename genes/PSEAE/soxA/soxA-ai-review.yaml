    summary: >-
      InterPro2GO mapping from IPR006277, the signature specific to the sarcosine oxidase
      alpha subunit, to the activity of the holoenzyme. The signature identifies the protein
      correctly; what it cannot do is make the alpha subunit the catalyst.
    action: ACCEPT
    reason: >-
      The claim is true of the complex SoxA belongs to, so the row is kept rather than
      removed, and this subunit-specific signature is also the strongest evidence against the
      competing L-2-hydroxyglutarate dehydrogenase assignment discussed on the IBA row above.
      The relation is the problem, not the term: the flavin-dependent sarcosine-oxidising
      site is on SoxB, so SoxA contributes to the activity rather than enabling it. The
      qualifier correction is recorded once, as a defect on the IMP row below, so the
      upstream request is not duplicated across two rows of the same gene.
