- id: PMID:17951384
  title: 'Gene-specific regulation by a transcript cleavage factor: facilitating promoter escape.'
  findings: []
  reference_review:
    relevance: NONE
    correctness: WRONG_IDENTIFIER
    review_notes: >-
      PubMed-verified: this PMID is a single-author commentary on transcriptional regulation
      by a transcript cleavage factor (Hochschild, J Bacteriol 2007; DOI
      10.1128/JB.01611-07), indexed as a Comment and carrying no abstract. It bears on
      neither P. aeruginosa, nor sarcosine, nor any oxidase, so it cannot support the
      GO:0008115 IMP row it is cited for. The intended paper is PMID:17951379, which sits
      immediately below a block of consecutive PMIDs from the same journal issue (all
      e-published 2007-10-19) and names the soxBDAG genes directly. The same transposition
      affects soxB, soxD and soxG, each citing a different wrong PMID from that block. The
      misdirection costs most here: soxA is the one sox gene for which the correct paper
      reports subunit-resolved data. Recorded as a WRONG_REFERENCE source defect on the IMP
      row.
    replacement:
      reference_id: PMID:17951379
      reason: WRONG_IDENTIFIER
      review_notes: >-
        The intended paper is the glycine betaine catabolism study whose mutant and NMR
        analyses establish that the soxBDAG genes are required for sarcosine catabolism in
        P. aeruginosa, and which reports the soxA mutant NMR experiment specifically.
        Verified against PubMed by title, journal, authors and e-publication date, and the
        full text is cached locally and names soxA seventeen times. Not inferred from PMID
        proximity alone.
- id: PMID:17951379
  title: >-
    Identification of two gene clusters and a transcriptional regulator required for
    Pseudomonas aeruginosa glycine betaine catabolism.
  findings:
  - statement: >-
      Mutant analysis plus 13C NMR establishes that the soxBDAG genes are required for
      sarcosine catabolism, with the authors describing the encoded enzyme as predicted
      rather than assayed.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Mutant analyses and 13 C NMR studies also confirmed that the soxBDAG genes, predicted
      to encode a sarcosine oxidase, are required for sarcosine catabolism
  - statement: >-
      The 13C-choline flux experiment was performed on a soxA mutant, which accumulated
      sarcosine. This is the only subunit-resolved experiment in the paper.
    reference_section_type: RESULTS
    supporting_text: only sarcosine was detected at 9 h in extracts from soxA
  - statement: >-
      The authors state the conclusion for soxA specifically rather than for the operon as a
      whole.
    reference_section_type: RESULTS
    supporting_text: is required for conversion of sarcosine to glycine in P. aeruginosa
  - statement: >-
      The characterised bacterial enzyme is a four-subunit complex, so the catalytic activity
      has to be apportioned between the subunits rather than asserted identically on each.
    reference_section_type: INTRODUCTION
    supporting_text: a heterotetrameric sarcosine oxidase converts sarcosine into glycine
  - statement: >-
      The sox gene names were assigned from homology to the characterised Corynebacterium
      sarcosine oxidase system, not from activity measured in this organism.
    reference_section_type: RESULTS
    supporting_text: >-
      designated based on their strong homology to the sarcosine oxidase system in
      Corynebacterium
  - statement: >-
      The pathway runs on cytoplasmic substrates, which bears on the plasma-membrane IBA row.
    reference_section_type: DISCUSSION
    supporting_text: Once in the cytoplasm, choline binds to BetI
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Wargo, Szwergold & Hogan, J Bacteriol 2008; DOI 10.1128/JB.01393-07).
      Full text is cached and names soxA throughout. This is the paper the four sox IMP rows
      were meant to cite, and for soxA it provides more than the operon-level phenotype: the
      13C NMR experiment was run on a soxA::TnM mutant, which accumulated sarcosine, and the
      authors draw the conclusion for soxA by name. The evidence remains genetic and
      spectroscopic rather than enzymological - no sarcosine oxidase activity is assayed -
      and the authors keep the enzyme "predicted" throughout.
