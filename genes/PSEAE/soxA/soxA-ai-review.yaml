id: Q9HTE6
gene_symbol: soxA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SoxA (PA5418) is the large alpha subunit, 1005 residues, of the heterotetrameric sarcosine
  oxidase of Pseudomonas aeruginosa. The complex converts sarcosine (N-methylglycine) to
  glycine in the terminal step of glycine betaine catabolism. SoxA is the multidomain,
  one-carbon-handling chain of the enzyme: it carries glycine-cleavage-T-protein
  folate-binding domains, an FAD/NAD-binding domain and a 2Fe-2S ferredoxin-type
  iron-sulfur domain, and it is the subunit through which the methylene group removed from
  sarcosine is passed to tetrahydrofolate. The sarcosine-oxidising active site itself lies on
  the flavin-bearing beta subunit, so SoxA contributes to the complex's catalytic activity
  rather than performing it alone. A soxA mutant accumulates sarcosine, placing the gene at
  the sarcosine-to-glycine step of a cytoplasmic pathway that lets the organism use glycine
  betaine, and the choline and carnitine it derives from, as a carbon and nitrogen source.
