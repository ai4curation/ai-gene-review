  knowledge_gaps:
  - gap_statement: >-
      The role of SoxA's 2Fe-2S cluster in the sarcosine oxidase reaction is unknown. The
      domain assignment is solid, but the chemistry of sarcosine demethylation on the beta
      subunit does not obviously require an iron-sulfur centre, so whether the cluster
      carries electrons, senses redox state, or is structural has not been established for
      this enzyme.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Whether SoxA's FAD/NAD-binding domain is catalytically active in its own right is
      undetermined. Its FAD cofactor on the record is an unvetted prediction, and the domain
      is what drew the mistaken L-2-hydroxyglutarate dehydrogenase assignment, so
      establishing what, if anything, this domain oxidises would settle both questions at
      once.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Does the SoxA FAD/NAD-binding domain have an oxidoreductase activity of its own, separate
    from the sarcosine demethylation performed on SoxB? The whole-protein PANTHER assignment
    to the L-2-hydroxyglutarate dehydrogenase family suggests the domain is a genuine
    oxidoreductase module, even though the specific L2HGDH activity does not fit this
    protein.
- question: >-
    What does the 2Fe-2S cluster on the alpha subunit do? If the tetrameric enzyme passes
    electrons beyond the flavin, the cluster would be the obvious route, which would also
    explain why the alpha subunit is so much larger than its catalytic partner.
suggested_experiments:
- description: >-
    Assay purified SoxA for 2-hydroxyglutarate-dependent and other substrate-dependent
    dehydrogenase activity. A negative result would directly support the requested deletion
    of the GO:0047545 row; a positive one would make the protein bifunctional and change the
    verdict.
- description: >-
    Determine the iron and flavin content of purified SoxA spectroscopically and by EPR, and
    test whether reconstituted SoxBDAG turnover depends on the integrity of the 2Fe-2S
    cluster, using cysteine-to-alanine substitutions in the ferredoxin-type domain.
