    id: GO:0008115
    label: sarcosine oxidase activity
  evidence_type: IMP
  original_reference_id: PMID:17951384
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row asserting sarcosine oxidase activity on the alpha subunit from a mutant
      phenotype. Two separate problems: the cited paper is a transcription commentary and not
      about this organism at all, and the enables qualifier attributes the holoenzyme's
      catalysis to a subunit that does not carry the flavin site.
    action: ACCEPT
    reason: >-
      Kept, with both faults recorded as defects rather than discarded, and the claim is
      better supported here than on any other sox subunit: the correct paper's 13C NMR
      experiment was run on a soxA mutant, which accumulated sarcosine, and the authors state
      the conclusion for soxA by name. That evidence establishes that soxA is required for
      the sarcosine-to-glycine step, which is necessity rather than evidence about which
      chain does the chemistry, so the relation should be contributes_to.
    supported_by:
    - reference_id: PMID:17951379
      reference_section_type: RESULTS
      supporting_text: only sarcosine was detected at 9 h in extracts from soxA
    - reference_id: PMID:17951379
      reference_section_type: RESULTS
      supporting_text: is required for conversion of sarcosine to glycine in P. aeruginosa
    source_defects:
