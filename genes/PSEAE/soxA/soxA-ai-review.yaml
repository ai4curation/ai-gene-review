      IPR006277, specific to the sarcosine oxidase alpha subunit, so it sits in its own
      subunit family within the characterised sarcosine oxidase systems. Target-specific
      evidence: soxA lies in the soxBDAG operon and its mutant accumulates sarcosine, so its
      function in this organism is established and is not 2-hydroxyglutarate
      dehydrogenation. PANTHER family names are often dominated by one member, and PTHR43104
      looks like a broad FAD-oxidoreductase family that took its name and seeds from the
      eukaryotic L2HGDH clade. Nothing supports this specific catalytic activity on this
      protein or on any sarcosine oxidase subunit.
