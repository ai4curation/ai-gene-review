- term:
    id: GO:0016614
    label: oxidoreductase activity, acting on CH-OH group of donors
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028437
  review:
    summary: >-
      ARBA machine-learning row placing the activity in the CH-OH donor branch of
      oxidoreductases. This is the wrong branch: sarcosine oxidation attacks a carbon-nitrogen
      bond, removing the N-methyl group, not a carbon-hydroxyl bond.
    action: REMOVE
    reason: >-
      The term asserts the wrong chemistry, not merely a general one. Checked in OLS, the
      ancestors of GO:0008115 run GO:0016491 oxidoreductase activity, GO:0016645
      oxidoreductase activity acting on the CH-NH group of donors, and GO:0016647 with oxygen
      as acceptor; GO:0016614 appears nowhere among them, so this row is not an ancestor of
      the real activity but a sibling branch. Its only evidence is an ARBA association rule,
      which is an unvetted prediction, and the generic FAD/NAD-binding fold that such a rule
      keys on is shared by oxidoreductases of both branches. Removed rather than modified to
      GO:0016645, because the specific activity is already asserted on this gene and an
      intermediate ancestor would add nothing.
