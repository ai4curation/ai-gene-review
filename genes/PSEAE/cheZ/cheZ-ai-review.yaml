id: Q51434
gene_symbol: cheZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CheZ (PA1457) is the CheY-P phosphatase of the main flagellar chemotaxis
  system of Pseudomonas aeruginosa. By similarity to E. coli CheZ it is a
  cytoplasmic homodimer that accelerates the dephosphorylation of phosphorylated
  CheY, so terminating the signal that CheY-P sends to the flagellar motor to
  switch rotation. It thereby sets the rate at which a swimming cell changes
  direction and lets the chemotaxis pathway respond quickly to changes in
  attractant and repellent levels. A cheZ insertion mutant of PAO1 reverses its
  swimming direction much more often than wild type, the opposite of cheY
  mutants, and a cheY cheZ mutant is non-chemotactic.
references:
- id: PMID:7860605
  title: Isolation and characterization of chemotaxis mutants and genes of Pseudomonas
    aeruginosa.
  findings:
  - statement: A cheZ insertion mutant reverses swimming direction much more often than wild type.
    supporting_text: A chromosomal cheZ mutant, constructed by inserting a kanamycin
      resistance gene cassette into the wild-type gene, changed its swimming direction
      much more frequently than did wild-type strain PAO1.
  - statement: The swarm-plate mutants (cheY and cheY cheZ) were motile but non-chemotactic.
    supporting_text: These mutants were fully motile but incapable of swarming, suggesting
      that they had a defect in the intracellular signalling pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IMP source for GO:0006935 (seed of PTN001098776) and for
      GO:0071978. Abstract only (PMC record is a scanned article). Supports
      chemotaxis. "Swarming" here is the soft-agar chemotaxis swarm-plate assay,
      not flagellum-dependent surface swarming, so the GO:0071978 row is a term
      confusion (source defect, PROBABLE).
