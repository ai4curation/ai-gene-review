suggested_questions:
- question: >-
    P. aeruginosa has several chemotaxis systems and CheY paralogues. Which CheY
    proteins does PA1457 CheZ dephosphorylate, and does it localize to the polar
    chemoreceptor array as E. coli CheZ does?
suggested_experiments:
- description: >-
    Measure CheY-P dephosphorylation by purified PA1457 in vitro, and image a
    fluorescent CheZ fusion to test polar localization.
