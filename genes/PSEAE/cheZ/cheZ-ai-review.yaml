- term:
    id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IMP
  original_reference_id: PMID:7860605
  qualifier: involved_in
  review:
    summary: >-
      The swarm-plate screen in this paper is the soft-agar chemotaxis assay; the
      mutants were fully motile but did not spread, which the authors attribute to
      defective chemotactic signalling. No surface-swarming phenotype is reported
      for the cheZ single mutant.
    action: REMOVE
    reason: >-
      Term confusion between chemotactic swarm-plate spreading and
      flagellum-dependent surface swarming. The phenotype is already captured by
      the chemotaxis row.
    supported_by:
    - reference_id: PMID:7860605
      supporting_text: These mutants were fully motile but incapable of swarming, suggesting
        that they had a defect in the intracellular signalling pathway.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0071978
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The PseudoCAP IMP row annotates PA1457/cheZ to flagellum-dependent
        swarming motility from Masduki et al. 1995. The abstract describes
        chemotaxis mutants selected on swarm plates that were fully motile but
        failed to spread because of a signalling defect, and the cheZ single
        mutant was phenotyped by swimming reversals. That is chemotaxis, already
        annotated from the same paper (GO:0006935), not surface swarming.
        PROBABLE because only the abstract could be read. This row does not seed
        a PAINT IBD.
      supported_by:
      - reference_id: PMID:7860605
        supporting_text: These mutants were fully motile but incapable of swarming,
          suggesting that they had a defect in the intracellular signalling pathway.
