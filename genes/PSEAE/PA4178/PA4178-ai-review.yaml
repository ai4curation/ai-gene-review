- term:
    id: GO:0017000
    label: antibiotic biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028144
  review:
    summary: >-
      ARBA association rule, apparently driven by the TylM1/DesVI (macrolide
      sugar N-methyltransferase) family assignment. EftM methylates EF-Tu and
      has no known role in antibiotic synthesis.
    action: REMOVE
    reason: >-
      The only characterised substrate is a protein (EF-Tu Lys5), and no
      antibiotic or secondary-metabolite product is associated with PA4178.
      The rule over-propagates a family-level pathway.
    supported_by:
