    supporting_text: An in vitro methyltransferase assay was employed to show
      that, in the presence of SAM, EftM directly trimethylates EF-Tu.
  - reference_id: PMID:26677219
    supporting_text: Irreversible protein unfolding at 37 °C was observed, and
      we propose that this instability is the molecular basis for the temperature
      dependence of EftM activity.
suggested_questions:
- question: >-
    Does PANTHER place PA4178 (EftM) inside the UbiE/COQ5 clade PTN001297884 by
    mistake, or has EftM diverged from a UbiE-like ancestor so that a loss (NOT)
    annotation is needed on its branch?
- question: >-
    Is a dedicated GO term for EF-Tu lysine N-methyltransferase activity
    (analogous to the cytochrome c and calmodulin lysine methyltransferase
    terms) warranted?
suggested_experiments:
- description: >-
    Determine what fraction of native EF-Tu is trimethylated at 25 and 37
    degrees C and whether the modification affects translation elongation or
    EF-Tu export to the cell surface.
