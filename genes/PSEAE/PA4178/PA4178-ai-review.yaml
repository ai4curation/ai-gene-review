  review:
    summary: >-
      Ubiquinone biosynthesis propagated from the UbiE/COQ5 node PTN001297884.
      EftM is a characterised protein (EF-Tu lysine 5) methyltransferase, not a
      quinone C-methyltransferase.
    action: REMOVE
    reason: >-
      The seeds of PTN001297884 are UbiE/COQ5 orthologs (E. coli UbiE P0A887,
      human COQ5 Q5HYK3, yeast COQ5 and others). Their function is sound for
      that clade, but PA4178 has been shown biochemically to methylate a
      protein substrate, EF-Tu Lys5, exclusively. PA4178 carries no UbiE-type
      annotation in UniProt (it is classed in PANTHER PTHR43861, trans-aconitate
      2-methyltransferase-related, and the TylM1/DesVI family). Placing it
      under the UbiE node propagates a function it diverged from.
    supported_by:
    - reference_id: PMID:26677219
      supporting_text: Mass spectrometry analysis of the in vitro methyltransferase
        reaction products revealed that EftM exclusively methylates at lysine 5 of
        EF-Tu in a distributive manner.
