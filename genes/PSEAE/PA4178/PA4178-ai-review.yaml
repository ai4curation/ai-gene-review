  review:
    summary: >-
      PseudoCAP IDA and one of ten seeds of the PTN000010968 methyltransferase
      IBD. Purified EftM trimethylates EF-Tu with SAM as donor, so the term is
      correct, but the paper supports the more specific protein-lysine
      N-methyltransferase activity.
    action: MODIFY
    reason: >-
      The full text shows SAM-dependent trimethylation of EF-Tu lysine 5 by
      purified enzyme, with the residue identified by mass spectrometry. That is
      GO:0016279 protein-lysine N-methyltransferase activity, an is_a descendant
      of methyltransferase activity. As an IBD seed the row is sound: the
      descendant is valid evidence for the generic node term.
