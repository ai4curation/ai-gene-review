gene_symbol: PA4178
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4178 (eftM, EF-Tu-modifying enzyme) encodes EftM, a 247-residue class I
  S-adenosyl-L-methionine (SAM)-dependent methyltransferase of the
  Methyltransf_25 (PF13649) family. Purified EftM directly and exclusively
  trimethylates lysine 5 of translation elongation factor EF-Tu in a
  distributive manner. The enzyme is thermolabile and unfolds irreversibly
  at 37 degrees C, which explains why EF-Tu is trimethylated when
  P. aeruginosa grows near 25 degrees C but not at 37 degrees C. The G50R
  substitution in the predicted SAM-binding motif, found in a clinical isolate,
  abolishes SAM binding and activity. Trimethylated EF-Tu mimics
  phosphorylcholine, binds the host platelet-activating factor receptor and is
  associated with increased adhesion to and invasion of respiratory epithelial
  cells.
