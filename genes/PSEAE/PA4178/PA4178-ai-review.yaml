        EF-Tu in P. aeruginosa.
core_functions:
- description: >-
    SAM-dependent protein-lysine N-methyltransferase that trimethylates
    lysine 5 of translation elongation factor EF-Tu; temperature-regulated
    through the thermolability of the enzyme.
  molecular_function:
    id: GO:0016279
    label: protein-lysine N-methyltransferase activity
  directly_involved_in:
  - id: GO:0018023
    label: peptidyl-lysine trimethylation
  supported_by:
