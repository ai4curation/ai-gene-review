    label: peptidyl-lysine trimethylation
  evidence_type: IDA
  original_reference_id: PMID:26677219
  qualifier: involved_in
  review:
    summary: >-
      Proposed process. EftM itself catalyses trimethylation of EF-Tu Lys5
      in vitro, and its deletion abolishes the modification in vivo.
    action: NEW
