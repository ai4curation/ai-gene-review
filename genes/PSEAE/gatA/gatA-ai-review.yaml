  review:
    summary: GatA is a component of the biochemically characterized GatCAB heterotrimer.
    action: ACCEPT
    reason: The current complex definition describes possession of glutamyl-tRNA amidotransferase capacity
      and is not a requirement that glutamyl-tRNA be the native substrate in every organism. The purified
      target complex possesses that capacity; native Asn versus Gln use is separately qualified.
    supported_by:
