  review:
    summary: GatA contributes to the demonstrated glutamyl-tRNA transamidation capacity of GatCAB.
    action: KEEP_AS_NON_CORE
    reason: The PAO1 complex directly converts a supplied Bacillus Glu-tRNA(Gln) substrate in vitro. This
      capacity is retained as noncore because the characterized native PAO1 GluRS is discriminating and
      GlnS supplies Gln-tRNA directly. The claim is a component contribution, not isolated-subunit sufficiency.
      GatA contributes glutamine hydrolysis and ammonia supply.
    supported_by:
