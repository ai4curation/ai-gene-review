gene_symbol: gatA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: GatA is the glutaminase subunit of the GatCAB tRNA-dependent amidotransferase in Pseudomonas
  aeruginosa PAO1; it hydrolyzes glutamine to supply ammonia for transamidation. Its native aminoacyl-tRNA
  production role is conversion of Asp-tRNA(Asn) to Asn-tRNA(Asn). The purified complex can also use supplied
  heterologous Glu-tRNA(Gln), a biochemical capacity distinct from native substrate supply.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000120
  review:
    summary: GatA has a defined catalytic contribution within the GatCAB reaction.
    action: MODIFY
    reason: The general catalytic claim is sound but underspecified. The replacements retain both demonstrated
      tRNA-transamidation capacities and the glutaminase activity actually performed by GatA. Complex-level
      activity is a subunit contribution, not an assertion that the isolated polypeptide performs every
      chemical step. Its native charging role is conversion of Asp-tRNA(Asn) to Asn-tRNA(Asn). The purified
      complex can also use supplied heterologous Glu-tRNA(Gln), a biochemical capacity distinct from the
      native substrate supply.
    supported_by: &id003
    - &id002
      reference_id: PMID:14729703
      supporting_text: This strategy led to a pure and active AdT, with stoichiometric amounts of the
        three subunits
    - &id001
      reference_id: file:PSEAE/gatA/gatA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Catalytic subunit of the Asp/Glu-tRNA(Asn/Gln) amidotransferase complex GatCAB.
        GatCAB allows the formation of correctly charged Asn-tRNA(Asn) or Gln-tRNA(Gln) through the multi-step
        transamidation of misacylated Asp-tRNA(Asn) or Glu-tRNA(Gln) in organisms which lack either or
        both of asparaginyl-tRNA or glutaminyl- tRNA synthetases. The reaction takes place in the presence
        of glutamine and ATP through an activated phospho-Asp-tRNA(Asn) or phospho-Glu- tRNA(Gln). This
        subunit catalyzes the hydrolysis of the amido donor Gln, releasing ammonia that is sequestered
        within a channel in the GatCAB complex and made available to subunit B for downstream aminolysis
        of Glu-tRNA(Gln); may also be able to use Asn as the amido donor. {ECO:0000255|HAMAP-Rule:MF_00120}.
    proposed_replacement_terms:
    - id: GO:0004359
      label: glutaminase activity
    - id: GO:0050566
      label: asparaginyl-tRNA synthase (glutamine-hydrolyzing) activity
    - id: GO:0050567
      label: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
- term:
    id: GO:0004359
    label: glutaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:15889
  - EC:3.5.1.2
  - UniRule:UR000001462
  review:
    summary: GatA hydrolyzes glutamine to provide the amide nitrogen for transamidation.
    action: ACCEPT
    reason: GatA is the glutaminase component; this is different from the overall ATP-dependent tRNA synthetase
      reaction. Bacillus experiments localize glutamine hydrolysis to GatA coexpressed with GatC, while
      the PAO1 assignment is additionally supported by its conserved GatA active-site architecture.
    supported_by:
    - *id001
    - reference_id: PMID:9342321
      supporting_text: The holoenzyme and the A subunit (coexpressed A+C) carry out the Gln → Glu conversion;
        ATP is not required for this reaction.
