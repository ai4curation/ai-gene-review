        composed of GatA, GatB and GatC. {ECO:0000255|HAMAP-Rule:MF_00120}.
    - &id004
      reference_id: PMID:14729703
      supporting_text: This is also the case for P. aeruginosa AdT, which finds in its host only Asp-tRNA
        Asn but which can transamidate B. subtilis Glu-tRNA Gln
