  review:
    summary: GatA acts in the cytoplasmic tRNA-transamidation machinery.
    action: ACCEPT
    reason: The target conserved GatA/GatCAB assignment, soluble purification and protein-translation
      role support cytoplasmic localization. Heterologous expression is not represented as a native imaging
      assay; the inference concerns the conserved soluble tRNA-processing machinery.
    supported_by:
