      confidence: SUSPECTED
      explanation: >-
        PseudoCAP annotates GO:0020037 heme binding to PA4709 (UniProtKB:Q9HV89) by IMP from
        PMID:10658665. That paper is about the right organism and the right operon, but what its
        abstract reports for this region is a growth phenotype: "Mutant strains with deletions in
        phuR and phuSTUV showed greatly reduced growth with either haem or haemoglobin as the only
        iron source". That is a heme-utilisation defect in a four-gene deletion; it is not specific
        to phuS and does not measure heme binding. The claim itself is well established elsewhere:
