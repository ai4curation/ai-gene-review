id: Q9HV89
gene_symbol: PA4709
product_type: PROTEIN
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
status: COMPLETE
description: >-
  PA4709 is PhuS, the cytoplasmic heme-binding protein of the Pseudomonas heme utilisation (phu)
  operon. Once heme has crossed the envelope through the outer-membrane receptor PhuR and the
  inner-membrane ABC system, PhuS binds it in the cytoplasm through histidine ligands at
  positions 209 and 212 and hands it to the iron-regulated heme oxygenase HemO, which opens the
  porphyrin ring and releases the iron. Heme binding is what makes the handover possible: the
  loaded protein, and not the empty one, forms a complex with HemO, so the cofactor acts as the
  switch that licenses the protein-protein interaction. Beyond carrying heme, PhuS appears to
  buffer how fast it reaches HemO, and so to influence the cell's sense of its own iron status,
  although that role rests on indirect phenotypes. Despite its submitted name, PhuS does not
  degrade heme; HemO does.
