existing_annotations:
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IMP
  original_reference_id: PMID:10658665
  qualifier: enables
  review:
    summary: >-
      The gene's central molecular function, and correct — but the cited paper reports a
      heme-utilisation growth defect in a phuSTUV deletion rather than a binding measurement. The
      direct evidence is in two papers this review adds.
    action: ACCEPT
    reason: >-
      Accepted on evidence, with the evidence named. Resonance Raman spectroscopy combined with
      site-directed mutagenesis identified alternate histidine ligands at positions 209 and 212,
      and both are present in this entry: Q9HV89 is 354 residues, matching the paper's 39 kDa
      cytoplasmic protein, and carries His at both positions. A second study showed the binding is
      functional rather than incidental, since holo-PhuS but not apo-PhuS forms a 1:1 complex with
      the heme oxygenase HemO and the His-212-Ala variant loses that interaction. What the cited
      reference supports is the operon's role in heme acquisition, which is a different claim; that
      is recorded as a reference query below rather than used to weaken the term.
    supported_by:
    - reference_id: PMID:18020455
      reference_section_type: ABSTRACT
      supporting_text: >-
        This combined approach has identified a site in monomeric PhuS having alternate His ligands
        at positions 209 and 212.
    - reference_id: PMID:22451925
      reference_section_type: ABSTRACT
      supporting_text: >-
        We further demonstrate that replacement of His-212 by Ala disrupts the interaction of
        holo-PhuS with HemO; in contrast, the His-209-Ala variant can still complex with HemO,
        albeit more weakly.
