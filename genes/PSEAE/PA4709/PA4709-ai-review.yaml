- term:
    id: GO:0006826
    label: iron ion transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR007845
  review:
    summary: >-
      InterPro2GO mapping from the HemS/ChuX domain. True but general: GO places heme transport
      under iron ion transport, and this protein's cargo is heme specifically.
    action: MODIFY
    reason: >-
      This row looked at first like an over-annotation, since PhuS is cytoplasmic, carries a
      cofactor rather than pumping an ion, and does not perform the degradation that releases the
      iron. Checking the ontology rather than that reading: OLS confirms GO:0015886 heme transport
      descends from GO:0006826, through GO:1901678 iron coordination entity transport, so GO
      already treats heme transport as a kind of iron ion transport. The row is therefore true and
      merely general, and the fix is a refinement. The row's own evidence reaches the deeper term:
      IPR007845 is the HemS/ChuX domain and the entry also matches IPR053733,
      Heme_Transport_Util_sf, both of which name heme transport and utilisation rather than
      metal-ion transport at large. The gene product performs the step rather than being required
      for it — it binds the heme and releases it to HemO, which is the transfer itself.
    proposed_replacement_terms:
    - id: GO:0015886
      label: heme transport
    supported_by:
    - reference_id: PMID:22451925
      reference_section_type: ABSTRACT
      supporting_text: >-
        In the present work we establish a mechanism for how heme is transferred from PhuS to its
        partner, HemO.
    - reference_id: file:PSEAE/PA4709/PA4709-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR007845; HemS/ChuX_dom.'
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IC
  original_reference_id: PMID:18020455
  qualifier: located_in
  review:
    summary: >-
      Not in GOA. Added as a curator inference: the compartment is where the characterised
      function happens, and three independent grounds place the protein there.
    action: NEW
    reason: >-
      Proposed as IC rather than taken from a stated experiment, because the papers describe the
      protein as cytoplasmic without my having seen the fractionation that established it, and the
      distinction is worth keeping visible. Three grounds support the inference. The primary
      characterisation opens by calling it "a cytoplasmic, 39 kDa heme-binding protein", and the
      later study names it "the Pseudomonas aeruginosa cytoplasmic protein (PhuS)" in its title.
      The record carries no signal peptide and no transmembrane segment — the only sequence
      features on it are the two HemS domains — so nothing routes it out of the cytosol, in
      contrast to its operon partners PhuR, an outer-membrane receptor, and the PhuTUV
      inner-membrane transporter. And the function requires it: the protein hands heme to HemO in a
      1:1 complex, and HemO is a cytoplasmic heme oxygenase, so the transfer this review accepts
      has to happen in the cytoplasm for either partner's annotation to make sense.
    supported_by:
    - reference_id: PMID:18020455
      reference_section_type: ABSTRACT
      supporting_text: >-
        PhuS is a cytoplasmic, 39 kDa heme-binding protein from Pseudomonas aeruginosa.
    - reference_id: PMID:22451925
      reference_section_type: ABSTRACT
      supporting_text: >-
        In the present work we establish a mechanism for how heme is transferred from PhuS to its
        partner, HemO.
core_functions:
- description: >-
    Cytoplasmic heme chaperone of the phu heme-utilisation pathway: binds heme through histidine
    ligands at positions 209 and 212 and transfers it to the heme oxygenase HemO, the loaded form
    of the protein being the one that engages HemO, so that binding and delivery are one function
    rather than two.
  molecular_function:
    id: GO:0020037
    label: heme binding
  directly_involved_in:
  - id: GO:0015886
    label: heme transport
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:18020455
    reference_section_type: ABSTRACT
    supporting_text: >-
      PhuS is a cytoplasmic, 39 kDa heme-binding protein from Pseudomonas aeruginosa.
  - reference_id: PMID:22451925
    reference_section_type: ABSTRACT
    supporting_text: >-
      We further demonstrate that replacement of His-212 by Ala disrupts the interaction of
      holo-PhuS with HemO; in contrast, the His-209-Ala variant can still complex with HemO,
      albeit more weakly.
  knowledge_gaps:
  - gap_statement: >-
      Whether PhuS regulates heme flux as well as carrying it is unresolved. The proposal rests on
      indirect phenotypes — premature pyocyanin production in a phuS mutant, transcriptional
      signatures of iron deprivation — and its own authors hedge the mechanism as "directly or
      indirectly", so no regulatory annotation is made here.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Why the protein has two distinct heme-binding sites, one in the monomer and one in the
      dimer, is not known, nor which is used in the cell. The dimeric site retains six-coordinate
      low-spin heme even when both His-209 and His-212 are mutated, so it is not simply the same
      site counted twice.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Is the regulatory role separable from the trafficking role? A variant that bound heme but could
    not transfer it to HemO would answer this, and the His-212-Ala mutant may already be close to
    that reagent.
- question: >-
    What occupies the second, dimeric heme site, and does the monomer-dimer equilibrium shift with
    intracellular heme concentration? The original study raised pH sensitivity as a possible switch
    but did not test it in cells.
- question: >-
    Does PhuS distinguish the heme delivered by the phu system from that delivered by the has
    system, both of which PMID:10658665 shows operate in this organism? If not, the two uptake
    routes converge on one cytoplasmic carrier, which would make PhuS the bottleneck the
    heme-flux proposal needs.
suggested_experiments:
- description: >-
    Assay heme transfer from purified PhuS variants to HemO by stopped-flow spectroscopy, comparing
    wild type with His-209-Ala and His-212-Ala, to separate the contribution of each ligand to
    binding and to transfer rather than to complex formation alone.
- description: >-
    Measure the intracellular heme and biliverdin pools in a phuS deletion complemented with a
    transfer-dead but binding-competent variant, to test whether the regulatory phenotype follows
    heme binding or heme delivery.
- description: >-
    Determine whether the dimeric heme site exists at physiological PhuS concentrations, by
    analytical ultracentrifugation or crosslinking of the protein expressed at native levels, since
    the two-site model currently rests on purified material.
