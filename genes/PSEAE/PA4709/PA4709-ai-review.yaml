- id: PMID:10658665
  title: >-
    Genetics and regulation of two distinct haem-uptake systems, phu and has, in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      What this paper reports for the phuS region is a heme-utilisation growth defect in a
      multi-gene deletion, not a measurement on the PhuS protein.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Mutant strains with deletions in phuR and phuSTUV showed greatly reduced growth with either
      haem or haemoglobin as the only iron source: the defects were complemented by plasmids
      harbouring the phuR or the phuSTUV genes, respectively.
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      PubMed-verified (Ochsner, Johnson & Vasil 2000, Microbiology). A sound paper and the right
      one for the operon's genetics and Fur regulation, and it is what establishes that these genes
      are needed for heme and haemoglobin utilisation. It is miscited for GO:0020037 specifically:
      the phuS evidence in it is a growth phenotype of a phuSTUV deletion, which is neither
      phuS-specific nor a binding measurement. Abstract-only in the cache, so the full text could
      contain binding work the abstract does not mention; the reference problem is therefore raised
      as a CHECK query rather than asserted.
- id: PMID:18020455
  title: >-
    Identification of two heme-binding sites in the cytoplasmic heme-trafficking protein PhuS from
    Pseudomonas aeruginosa and their relevance to function.
  findings:
  - statement: >-
      Direct spectroscopic and mutational evidence that PhuS binds heme, with the ligating
      residues identified; both are present in this entry's sequence.
    reference_section_type: ABSTRACT
    supporting_text: >-
      This combined approach has identified a site in monomeric PhuS having alternate His ligands
      at positions 209 and 212.
  - statement: >-
      The paper states the protein's compartment and size, which match this entry at 354 residues.
    reference_section_type: ABSTRACT
    supporting_text: >-
      PhuS is a cytoplasmic, 39 kDa heme-binding protein from Pseudomonas aeruginosa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Block et al. 2007, Biochemistry). Added by this review because it, not
      either annotated reference, is what demonstrates heme binding by this protein. The residue
      numbers it reports are checkable against the fetched record: Q9HV89 is 354 aa with His at
      both 209 and 212, so the paper's protein and this entry are the same protein. Abstract-only
      in the cache; the abstract alone states the ligands, the compartment and the mass.
- id: PMID:22451925
  title: >-
    Induced fit on heme binding to the Pseudomonas aeruginosa cytoplasmic protein (PhuS) drives
    interaction with heme oxygenase (HemO).
  findings:
  - statement: >-
      The binding is functional rather than incidental: only the heme-loaded protein engages
      HemO, and mutating one of the two heme ligands abolishes that engagement.
    reference_section_type: ABSTRACT
    supporting_text: >-
      We further demonstrate that replacement of His-212 by Ala disrupts the interaction of
      holo-PhuS with HemO; in contrast, the His-209-Ala variant can still complex with HemO,
      albeit more weakly.
  - statement: >-
      Heme is handed to HemO rather than degraded by PhuS, which is the point the entry's
      submitted name gets wrong.
    reference_section_type: ABSTRACT
    supporting_text: >-
      In the present work we establish a mechanism for how heme is transferred from PhuS to its
      partner, HemO.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (O'Neill, Bhakta, Fleming & Wilks 2012, PNAS). Added by this review. It ties
      the binding to the transfer, which is what makes heme transport the right process term, and
      it independently confirms the His-209/His-212 ligands by mutagenesis.
- id: PMID:18990702
  title: >-
    The role of the cytoplasmic heme-binding protein (PhuS) of Pseudomonas aeruginosa in
    intracellular heme trafficking and iron homeostasis.
  findings:
  - statement: >-
      A phuS-specific deletion gives a slow-growth phenotype consistent with trafficking, which is
      the gene-level counterpart of the in vitro transfer.
    reference_section_type: ABSTRACT
    supporting_text: >-
      However, disruption of phuS alone resulted in a slow growth phenotype, consistent with its
      role as a heme-trafficking protein to HO.
  - statement: >-
      The authors propose a second, regulatory role, and hedge it as direct or indirect; this
      review records it as a knowledge gap rather than annotating it.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The present data suggest that PhuS has a dual function in trafficking heme to HO, and in
      directly or indirectly sensing and maintaining iron and heme homeostasis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Kaur, Lansky & Wilks 2009, J Biol Chem). Added by this review. Supplies the
      phuS-specific deletion phenotype that PMID:10658665 does not, and is the source of the
      regulatory role left unannotated here.
