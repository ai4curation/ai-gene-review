suggested_questions:
- question: >-
    GO has no process term for type IV pilus retraction (or disassembly), so a
    retraction motor such as PilU can only be annotated to type IV
    pilus-dependent motility. Should a "type IV pilus retraction" term be
    added under pilus organization?
- question: >-
    How does PilU contribute to retraction mechanistically: does it form
    stacked or mixed assemblies with PilT hexamers at the platform protein
    PilC, or act sequentially, and why is it dispensable in P. stutzeri and
    with some PilA or PilY1 alleles?
suggested_experiments:
- description: >-
    Measure ATP hydrolysis by purified PilU and PilT, alone and mixed, with
    Walker B and His box variants of each, and relate the rates to retraction
    force and speed measured in single-pilus assays of the matching
    P. aeruginosa mutants. This tests whether PilU ATPase activity drives
    retraction directly or only boosts PilT.
