- id: PMID:15659660
  title: Disparate subcellular localization patterns of Pseudomonas aeruginosa Type
    IV pilus ATPases involved in twitching motility.
  findings:
  - statement: >-
      Functional YFP-PilU localizes to the piliated pole; the N terminus
      determines the localization pattern.
    supporting_text: >-
      PilB and PilT fusions localized to both poles, while PilU fusions
      localized only to the piliated pole.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Chiang, Habash and Burrows 2005, J Bacteriol
      187:829-39); full text cached.
- id: PMID:18174131
  title: Functional role of conserved residues in the characteristic secretion NTPase
    motifs of the Pseudomonas aeruginosa type IV pilus motor proteins PilB, PilT and
    PilU.
  findings:
  - statement: >-
      Purified P. aeruginosa PilU has ATPase activity in vitro; Walker A/B and
      key Asp/His box residues are needed for twitching. No nuclease activity
      is reported.
    supporting_text: >-
      Assay of purified 6xHis-tagged PilB, PilT and PilU from P. aeruginosa
      showed that all three proteins have ATPase activities in vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Chiang et al. 2008, Microbiology 154:114-126,
      doi:10.1099/mic.0.2007/011320-0). The identifier is correct and the
      paper does assay PilU; it is not a mis-keyed neighbour (PMID:18174132 is
      the ccmC paper, pages 127-138 of the same issue). The PseudoCAP row
      citing it carries the wrong GO term (GO:0016888 DNA endonuclease for
      GO:0016887 ATP hydrolysis); that is recorded as a WRONG_TERM source
      defect on the annotation, not as a reference error. Abstract-only here.
- id: PMID:7854122
  title: Characterization of a gene, pilU, required for twitching motility but
    not phage sensitivity in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      pilU, downstream of pilT, is needed for twitching motility; pilU mutants
      are hyperfimbriate but, unlike pilT mutants, stay sensitive to phage PO4.
    supporting_text: >-
      in contrast to pilT mutants, the pilU mutants had not also acquired
      resistance to infection by bacteriophage PO4
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Whitchurch and Mattick 1994, Mol Microbiol
      13:1079-91); abstract-only here. Sole seed of the PTN000766390 motility
      IBD.
- id: PMID:31525185
  title: The type IV pilus protein PilU functions as a PilT-dependent retraction
    ATPase.
  findings:
  - statement: >-
      PilU is a bona fide retraction ATPase that works only together with PilT,
      in V. cholerae and in P. aeruginosa.
    supporting_text: >-
      In addition to demonstrating that PilU can function as a bona fide
      retraction ATPase, we go on to make the surprising discovery that PilU
      functions exclusively in a PilT-dependent manner
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Adams et al. 2019, PLoS Genet 15:e1008393); full text cached.
- id: PMID:41055394
  title: Separation of Pseudomonas aeruginosa type IV pilus-dependent twitching motility
    and surface-sensing responses.
  findings:
  - statement: >-
      Crystal structure shows PilU as a hexameric motor ATPase; pilU mutants
      have high cAMP, and some PilA/PilY1 alleles restore twitching without
      PilU.
    supporting_text: >-
      Together, these findings establish PilU as a co-evolved motor ATPase,
      likely leveraging its unique C-terminal features for distinct functional
      roles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Barnshaw et al. 2025, mBio 16:e0252125); full text cached.
- id: PMID:30804544
  title: Pseudomonas aeruginosa orchestrates twitching motility by sequential control
    of type IV pili movements.
  findings:
  - statement: >-
      PilT alone powers retraction in free solution; PilU may improve
      retraction in high-friction environments.
    supporting_text: >-
      we found that the retraction motor PilT was sufficient to generate
      tension and power motility in free solution, while its partner ATPase
      PilU may improve retraction only in high-friction environments
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Tala et al. 2019, Nat Microbiol 4:774-780); full text cached.
- id: PMID:11466271
  title: Requirement of novel competence genes pilT and pilU of Pseudomonas stutzeri
    for natural transformation and suppression of pilT deficiency by a hexahistidine
    tag on the type IV pilus protein PilAI.
  findings:
  - statement: >-
      In P. stutzeri, pilU inactivation leaves twitching intact but lowers
      transformation, so the twitching role of PilU is not universal.
    supporting_text: >-
      Insertional inactivation did not affect piliation, twitching motility,
      or PO4 infection but reduced transformation to about 10%.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Graupner et al. 2001, J Bacteriol 183:4694-701); ortholog, abstract-only.
- id: PMID:18310333
  title: Twitching motility is essential for virulence in Dichelobacter nodosus.
  findings:
  - statement: >-
      In D. nodosus, pilU mutation abolishes twitching motility.
    supporting_text: >-
      We showed that mutation of either the pilT or pilU gene eliminated the
      ability to carry out twitching motility.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (Han et al. 2008, J Bacteriol 190:3323-35); ortholog, abstract-only.
core_functions:
- description: >-
    Accessory type IV pilus retraction motor. PilU is a hexameric ATPase that
    hydrolyses ATP at the piliated pole and acts together with, and dependent
    on, PilT to depolymerize the pilus, supporting the retraction step of
    twitching motility, especially under load.
