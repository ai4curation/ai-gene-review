id: G3XCX3
gene_symbol: pilU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PilU (PA0396) is a 382-residue cytoplasmic PilT-like ATPase of the GspE /
  secretion NTPase superfamily, encoded immediately downstream of the main
  type IV pilus retraction ATPase gene pilT. It has the Walker A/B, Asp box and
  His box motifs of the family, hydrolyses ATP in vitro and forms a hexameric
  motor ring. PilU localizes only to the piliated cell pole and acts as an
  accessory retraction ATPase that works in a PilT-dependent manner, improving
  pilus retraction, particularly under high load. pilU mutants are
  hyperpiliated and lose twitching motility but still retract pili well enough
  to remain sensitive to pilus-specific phages; they also have elevated cAMP,
  linking PilU to pilus-dependent surface sensing, and reduced virulence in
  animal models. The requirement for PilU in twitching differs between species
  and can be bypassed by some pilin and PilY1 alleles.
