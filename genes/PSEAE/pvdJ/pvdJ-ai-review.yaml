suggested_questions:
- question: >-
    Which amino acids do the two PvdJ adenylation domains activate in PAO1, and is
    there a published P. aeruginosa pvdJ mutant that PseudoCAP could cite instead of
    the P. syringae paper?
- question: >-
    Should PAINT move the enterobactin-specific IBDs (enterobactin biosynthesis,
    enterobactin synthetase complex, 2,3-dihydroxybenzoate-serine ligase) at
    PTN002378853 below a node that excludes the pyoverdine NRPS PvdJ?
suggested_experiments:
- description: >-
    ATP-PPi exchange assays with each purified PvdJ adenylation domain and an
    in-frame pvdJ deletion in PAO1, with complementation, to confirm its modules and
    its requirement for pyoverdine.
  experiment_type: biochemical assay
