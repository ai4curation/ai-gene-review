- id: PMID:19854904
  title: The siderophore pyoverdine of Pseudomonas syringae pv. tabaci 6605 is an intrinsic
    virulence factor in host tobacco infection.
  findings:
  - statement: >-
      Delta pvdJ and Delta pvdL mutants of P. syringae pv. tabaci 6605 make no
      pyoverdine; no P. aeruginosa mutant is studied.
    supporting_text: >-
      The Delta pvdJ and Delta pvdL mutants were unable to produce pyoverdine in
      mineral salts-glucose medium, which was used for the iron-depleted condition.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      PubMed-verified (Taguchi et al. 2010, J Bacteriol); full text cached and read.
      All mutants are in P. syringae pv. tabaci 6605. The paper is cited by
      PseudoCAP as IMP evidence for PAO1 PvdJ, which it cannot provide; relevant
      to PvdJ only as a same-named NRPS in another species.
- id: PMID:15271355
  title: Characterization and genetic manipulation of peptide synthetases in Pseudomonas
    aeruginosa PAO1 in order to generate novel pyoverdines.
  findings:
  - statement: >-
      Besides PvdD, the remaining PAO1 pyoverdine NRPSs were identified from the
      iron-regulated cytoplasmic proteins and the genome.
    supporting_text: >-
      Analysis of other IRCPs and the P. aeruginosa genome enabled the remaining
      pyoverdine NRPSs to be identified.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Ackerley and Lamont 2004, Chem Biol). Abstract only; the
      abstract does not name PvdJ explicitly, so it supports PvdJ as a pyoverdine
      NRPS only together with the genomic context.
