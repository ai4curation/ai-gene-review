- term:
    id: GO:0009239
    label: enterobactin biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002378853
  - UniProtKB:P11454
  review:
    summary: >-
      Propagated from E. coli EntF at PTN002378853. P. aeruginosa does not make
      enterobactin; PvdJ makes part of pyoverdine.
    action: REMOVE
    reason: >-
      Enterobactin is an E. coli catecholate siderophore made from
      2,3-dihydroxybenzoate and serine by EntF with EntE/EntB. PvdJ is a pyoverdine
      NRPS, the PAO1 genome has no enterobactin pathway, and PvdJ is not the PAO1
      enterobactin synthetase. Product specificity of NRPS modules is lineage
      specific, so the EntF product does not transfer.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: UniProtKB:P11454
        source_label: E. coli EntF
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          EntF makes enterobactin; the product of an NRPS is set by its own modules,
          and PvdJ is a pyoverdine NRPS.
      - source_id: PANTHER:PTN002378853
        source_label: PTN002378853
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: An EntF-seeded product-specific node that also contains PvdJ.
    supported_by:
    - reference_id: PMID:15271355
      supporting_text: >-
        Analysis of other IRCPs and the P. aeruginosa genome enabled the remaining
        pyoverdine NRPSs to be identified.
