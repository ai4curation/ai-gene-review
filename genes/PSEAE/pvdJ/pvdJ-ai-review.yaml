id: Q9I181
gene_symbol: pvdJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdJ (PA2400) is a two-module nonribosomal peptide synthetase (NRPS) of
  Pseudomonas aeruginosa PAO1, encoded in the pyoverdine locus next to pvdD, and
  one of the NRPSs that assemble the peptide chain of the siderophore pyoverdine.
  Each module has condensation, adenylation and peptidyl-carrier
  (phosphopantetheine-binding) domains. It was identified among the iron-regulated
  cytoplasmic proteins of PAO1 as one of the remaining pyoverdine NRPSs after
  PvdD.
existing_annotations:
- term:
    id: GO:0002049
    label: pyoverdine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:19854904
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP seed of the PTN002378821 secondary metabolite biosynthetic
      process IBD. The cited paper deleted pvdJ in Pseudomonas syringae pv. tabaci
      6605, not in P. aeruginosa.
    action: ACCEPT
    reason: >-
      The claim is true for PAO1 PvdJ: it is one of the pyoverdine NRPSs identified
      from the PAO1 iron-regulated cytoplasmic proteins and genome, and it does part
      of the work by assembling part of the peptide. But the cited evidence is a
      mutant of a same-named gene in another organism, so IMP on the PAO1 gene is
      wrong; at most it is ISS, and pyoverdine NRPS genes are named by position in
      strain-specific loci that make different peptides, so even the orthology is
      loose. Seed verdict WRONG (wrong organism); recorded as a source defect.
    supported_by:
    - reference_id: PMID:15271355
      supporting_text: >-
        Analysis of other IRCPs and the P. aeruginosa genome enabled the remaining
        pyoverdine NRPSs to be identified.
    - reference_id: PMID:19854904
      supporting_text: >-
        To investigate the role of iron uptake mediated by the siderophore
        pyoverdine in the virulence of the plant pathogen Pseudomonas syringae pv.
        tabaci 6605, three predicted pyoverdine synthesis-related genes, pvdJ, pvdL,
        and fpvA, were mutated.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: IMP
      corrected_value: ISS
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        PseudoCAP rows for PvdJ (PA2400, Q9I181) GO:0002049 pyoverdine
        biosynthetic process and GO:0003824 catalytic activity, IMP, PMID:19854904
        (Taguchi et al. 2010, J Bacteriol). The paper, read in full, constructs
        Delta pvdJ, Delta pvdL and Delta fpvA mutants of Pseudomonas syringae pv.
        tabaci 6605 only; no P. aeruginosa mutant is made. A mutant phenotype in
        another species cannot be IMP for the PAO1 gene. Please either re-reference
        the rows to P. aeruginosa evidence (for example PMID:15271355) or recode as
        ISS with the P. syringae protein in WITH/FROM, noting that the P. syringae
        PvdJ is described as an L-Thr-L-Ser component, so module-level equivalence to
        PAO1 PvdJ is not established.
      supported_by:
      - reference_id: PMID:19854904
        supporting_text: >-
          The constructs were digested with StuI, AfaI, or AgeI to delete 483, 196,
          or 975 internal bp for generation of the Δ fpvA , Δ pvdJ , or Δ pvdL
          mutant, respectively.
