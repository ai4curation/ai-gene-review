suggested_questions:
- question: Does the PANTHER tree contain a node confined to the GlcNAc-dedicated fused EIIA-HPr-EI proteins
    (such as PA3760 and its pseudomonad orthologs), where an N-acetylglucosamine transport IBD would be
    appropriate instead of at the Enzyme I node PTN000532509?
suggested_experiments:
- description: Radiolabelled GlcNAc uptake and PEP-dependent GlcNAc phosphorylation in extracts of wild-type,
    clean PA3760 deletion and complemented strains. This would separate a direct PTS role from polar effects
    on PA3761.
  experiment_type: transport assay
