      Biolog/plate growth screen of PathoGenesis Mini-Tn5 transporter mutants (PA3760 in strain PAK),
      with qRT-PCR induction (5.2-fold by GlcNAc). It is the only functional evidence for PA3760 and supports
      the PseudoCAP IMP row.
