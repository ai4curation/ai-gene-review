core_functions:
- description: Fused EIIA-HPr-Enzyme I of the N-acetylglucosamine PTS. It phosphorylates its own HPr domain
    from phosphoenolpyruvate, and the phosphoryl group passes through the EIIA domain to the PA3761 EIIBC
    for GlcNAc uptake with phosphorylation.
