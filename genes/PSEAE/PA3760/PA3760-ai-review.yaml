  - statement: PA3760 and PA3761 Tn5 mutants cannot grow on N-acetylglucosamine as carbon source, and
      both genes are induced by N-acetylglucosamine.
    supporting_text: Knockouts in either PA3760 or PA3761 were defective in growth on N-acetylglucosamine
      as a sole carbon source, based on both Biolog and growth data
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
