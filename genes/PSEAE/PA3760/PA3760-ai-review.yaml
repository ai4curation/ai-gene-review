  label: Pseudomonas aeruginosa PAO1
description: PA3760 is a large fused phosphotransferase-system (PTS) protein of Pseudomonas aeruginosa.
  It combines an N-terminal glucose-type Enzyme IIA domain, an HPr domain and a C-terminal Enzyme I. It
  is encoded with the Enzyme IIBC PA3761 at the end of an N-acetylglucosamine/glucosamine utilisation
  operon. In the cytoplasm it relays the phosphoryl group from phosphoenolpyruvate through Enzyme I, HPr
  and EIIA to the membrane-bound EIIBC, which takes up and phosphorylates N-acetylglucosamine. PA3760
  is required for growth on N-acetylglucosamine, and its expression is induced by that sugar.
