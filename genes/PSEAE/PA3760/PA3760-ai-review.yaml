- term:
    id: GO:0015764
    label: N-acetylglucosamine transport
  evidence_type: IMP
  original_reference_id: PMID:18833300
  qualifier: involved_in
  review:
    summary: The PA3760 Tn5 mutant cannot grow on N-acetylglucosamine. The gene is induced by GlcNAc and
      lies in a GlcNAc/glucosamine utilisation operon with the EIIBC gene PA3761.
    action: ACCEPT
    reason: Taken alone, a growth defect is an indirect read-out of transport. Here it agrees with the
      domain content (EIIA-HPr-EI that phosphorylates an EIIBC), the operon context and substrate induction.
      PA3760 does part of the work of PTS-mediated GlcNAc uptake by delivering the phosphoryl group to
      the PA3761 EIIBC, and FruI cannot substitute. A possible polar effect on PA3761 does not affect
      the claim, because both are components of the same PTS.
    supported_by:
    - *id004
    - *id005
    - *id006
