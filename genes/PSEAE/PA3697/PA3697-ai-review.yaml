          activity under aerobic and low-oxygen conditions
suggested_questions:
- question: >-
    Does PA3697 bind the fhp-fhpR intergenic region directly, or was it co-isolated through another
    protein? Its MATCAP domain suggests a metalloprotease rather than a DNA-binding regulator.
- question: >-
    Do bacterial MATCAP/QEGLA-domain proteins have peptidase activity, and if so what are their
    substrates?
suggested_experiments:
- description: >-
    Purify PA3697 and test (i) specific binding to the fhp-fhpR intergenic DNA by EMSA with
    competitor DNA, and (ii) zinc-dependent peptidase activity on peptide libraries; in parallel,
    measure NO consumption by wild-type and PA3697 mutant cells exposed to nitrite or NO donors.
