        fhp promoter activity; no NO measurement is described. Please check whether the full
        text measures NO consumption or NO levels in the mutant. If it does not, the row overstates
        the evidence: the phenotype is reduced fhp expression, and the mechanism (direct promoter
        binding or an indirect effect) is unknown. This row is the sole seed of the PANTHER
        IBD at PTN002422332, which spreads the claim to about 175 proteins.
      supported_by:
      - reference_id: PMID:18043907
        supporting_text: >-
