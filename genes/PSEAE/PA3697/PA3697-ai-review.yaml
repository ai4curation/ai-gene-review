  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3697 encodes an uncharacterised 431-residue protein of Pseudomonas aeruginosa with a
  MATCAP (DUF1704) domain and a QEGLA motif (TIGR02421). The domain is named after the animal
  microtubule-associated tyrosine carboxypeptidase, a metalloprotease; the bacterial members
  have no demonstrated activity. In P. aeruginosa PAO1 it was isolated with the
  fhp-fhpR intergenic promoter region as bait. PA3697 mutants lose nitrate- and nitrite-induced
  activity of the promoter of the flavohemoglobin gene fhp, which encodes an NO-detoxifying
  enzyme. Its mutants also lose ROS-induced fhp promoter activity, so PA3697 is needed alongside
  FhpR and PA0779 for full fhp expression. Whether it binds DNA, acts as a protease or works
  indirectly is unknown.
