- term:
    id: GO:0080164
    label: regulation of nitric oxide metabolic process
  evidence_type: IMP
  original_reference_id: PMID:18043907
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP; sole seed of the PTN002422332 IBD. Koskenkorva et al. (2008) isolated PA3697
      with the fhp-fhpR promoter as bait and found it essential for nitrate- and nitrite-induced
      fhp promoter activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The mutant phenotype is real and specific to this gene, but the abstract measures promoter
      activity of fhp, not nitric oxide metabolism. The link to NO metabolism is two steps removed
      (fhp transcription, then Fhp-catalysed NO detoxification) and was not tested. The abstract
      itself shows the claim is an inferred consequence of a reporter phenotype, so the row is
      marked as over-annotated rather than undecided. A more literal transcription-regulation
      term is not proposed: there is no evidence that PA3697 binds DNA or acts directly on the
      promoter.
    supported_by:
    - reference_id: PMID:18043907
      supporting_text: >-
        Both PA0779 and PA3697 were found to be essential for NO3(-) and NO2(-) induced Pfhp
        activity under aerobic and low-oxygen conditions, and needed for the full function of
        Pfhp/PfhpR as NO responsive regulatory circuit under aerobic conditions.
    - reference_id: PMID:19767835
      supporting_text: ROS-induced fhp promoter activity was dependent on FhpR, PA0779, and PA3697
        regulators.
