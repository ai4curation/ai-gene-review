    summary: Substrate-generalized succinate-semialdehyde activity over-annotates DavD.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The InterPro IPR010102 succinate-semialdehyde dehydrogenase signature
      (and NCBIfam TIGR01780) matches the whole SSADH-like clade, including
      the DavD enzymes. Signature membership does not override the
      glutarate-semialdehyde reaction measured for PA0265, and succinate
      semialdehyde has not been tested, so the term is over-annotation, as
      for GO:0004777.
    supported_by:
