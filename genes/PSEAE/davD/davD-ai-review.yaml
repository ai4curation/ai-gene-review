taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  DavD (PA0265) is the NADP+-dependent glutarate-semialdehyde dehydrogenase of
  Pseudomonas aeruginosa. It oxidizes 5-oxopentanoate (glutarate
  semialdehyde), the product of the DavT (PA0266) aminotransferase, to
  glutarate, completing the conversion of L-lysine-derived 5-aminovalerate to
  glutarate. DavD is a soluble member of the aldehyde dehydrogenase family,
  most closely related to the succinate-semialdehyde dehydrogenases, with the
  conserved catalytic cysteine nucleophile and glutamate general base.
existing_annotations:
- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G79440
  - FB:FBgn0039349
  - MGI:MGI:2441982
  - PANTHER:PTN008681047
  - RGD:621422
  - SGD:S000000210
  - UniProtKB:P25526
  - UniProtKB:P51649
  review:
    summary: Succinate-semialdehyde activity inherited from the SSADH node over-annotates a glutarate-semialdehyde
      dehydrogenase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PTN008681047 node is seeded by bona fide succinate-semialdehyde
      dehydrogenases (human ALDH5A1, yeast UGA2, E. coli GabD) and is sound for
      them. DavD descends from it because PANTHER subfamily SF5 places the
      Pseudomonas DavD clade among the SSADHs. The characterized reaction of
      PA0265 is oxidation of glutarate semialdehyde with NADP+; activity on
      succinate semialdehyde and with NAD+ has not been tested. The term is
      therefore a plausible inheritance that over-annotates the known
      activity, not a demonstrated second function. The same judgement is
      applied to P. putida DavD and to the GABA rows of both DavT orthologs.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN008681047
        source_label: succinate-semialdehyde dehydrogenase node (PTHR43353)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node is seeded by bona fide SSADHs (ALDH5A1, UGA2, GabD), for which the term is sound. DavD is a glutarate-semialdehyde dehydrogenase paralog within SF5; succinate semialdehyde has not been tested on it.
    supported_by:
    - reference_id: PMID:17388807
      supporting_text: PA0265 as a putative glutarate semialdehyde dehydrogenase (EC
        1.2.1.20)
    - reference_id: file:PSEAE/davD/davD-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=5-oxopentanoate + NADP(+) + H2O = glutarate + NADPH + 2 H(+)
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000192659
  - UniProtKB:P25553
  review:
    summary: Cytosolic location inherited from a bacterial aldehyde dehydrogenase node.
    action: KEEP_AS_NON_CORE
    reason: >-
      DavD is a soluble aldehyde dehydrogenase with no signal peptide or
      transmembrane segment, so a cytosolic location seeded by E. coli AldA is
      consistent with its biology. No localization assay exists for DavD
      itself and location is context for the core activity, so the row is
      kept as non-core, as on P. putida DavD.
    supported_by:
    - reference_id: file:PSEAE/davD/davD-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR015590; Aldehyde_DH_dom.
