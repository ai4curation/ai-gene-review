suggested_questions:
- question: How strongly does P. aeruginosa DavD discriminate glutarate semialdehyde from succinate semialdehyde,
    and NADP+ from NAD+?
suggested_experiments:
- description: >-
    Measure steady-state kinetics of purified PA0265 with glutarate
    semialdehyde and succinate semialdehyde using NADP+ and NAD+, and test a
    davD deletion for growth on L-lysine, 5-aminovalerate and GABA as sole
    carbon sources.
