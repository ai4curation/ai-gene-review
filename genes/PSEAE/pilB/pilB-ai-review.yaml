suggested_questions:
- question: >-
    GO has no term for the pilin-polymerizing mechanochemical activity of
    extension ATPases (or for the depolymerizing activity of retraction
    ATPases), so PilB and PilT both carry only ATP hydrolysis activity. Should
    GO add terms that distinguish type IV pilus extension from retraction (for
    example a "type IV pilus retraction" process), so that the motors are not
    annotated identically?
- question: >-
    Does P. aeruginosa PilB bind c-di-GMP directly through its MshEN domain, as
    shown for the Vibrio MshE N-terminal domain, in addition to being regulated
    by the c-di-GMP effector FimX?
suggested_experiments:
- description: >-
    Measure ATP hydrolysis by purified P. aeruginosa PilB hexamers alone and
    with FimX, the PilC cytoplasmic domain and c-di-GMP, to define how each
    partner regulates the extension motor's activity.
