- id: PMID:15659660
  title: Disparate subcellular localization patterns of Pseudomonas aeruginosa Type
    IV pilus ATPases involved in twitching motility.
  findings:
  - statement: >-
      PilB and PilT localize to both poles; PilB polar localization requires
      the inner-membrane protein PilC.
    supporting_text: >-
      PilB and PilT fusions localized to both poles, while PilU fusions
      localized only to the piliated pole.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Chiang, Habash and Burrows 2005, J Bacteriol
      187:829-39); full text cached. Direct localization data for PilB.
- id: PMID:1671384
  title: 'Multiple roles of the pilus biogenesis protein pilD: involvement of pilD
    in excretion of enzymes from Pseudomonas aeruginosa.'
  findings:
  - statement: >-
      PilB function is restricted to pilus biogenesis; pilB mutants do not have
      the protein export defect of pilD mutants.
    supporting_text: >-
      The function of the other two accessory proteins, PilB and PilC,
      appears to be restricted to pilus biogenesis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Strom, Nunn and Lory 1991, J Bacteriol 173:1175-80).
      Abstract-only here. A pilD paper; its abstract supports pilB in pilus
      biogenesis (citing PMID:1971619) and does not report a pilB motility
      assay, so it is a weak basis for the PseudoCAP IDA motility row (query
      recorded as a source defect).
- id: PMID:1971619
  title: Products of three accessory genes, pilB, pilC, and pilD, are required for
    biogenesis of Pseudomonas aeruginosa pili.
  findings:
  - statement: >-
      Transposon insertions in pilB (as in pilC and pilD) abolish pilus
      formation in P. aeruginosa PAK.
    supporting_text: >-
      This report describes three novel genes necessary for the formation of
      pili.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Nunn, Bergman and Lory 1990, J Bacteriol 172:2911-9).
      Abstract-only here. The original identification of pilB as a pilus
      biogenesis gene; not cited by GOA.
- id: PMID:18174131
  title: Functional role of conserved residues in the characteristic secretion NTPase
    motifs of the Pseudomonas aeruginosa type IV pilus motor proteins PilB, PilT and
    PilU.
  findings:
  - statement: >-
      Purified P. aeruginosa PilB has ATPase activity in vitro, and Walker A,
      Walker B, Asp box and His box residues are required for twitching.
    supporting_text: >-
      Assay of purified 6xHis-tagged PilB, PilT and PilU from P. aeruginosa
      showed that all three proteins have ATPase activities in vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Chiang et al. 2008, Microbiology 154:114-126,
      doi:10.1099/mic.0.2007/011320-0). The identifier is correct: this is the
      PilB/PilT/PilU ATPase paper, not a mis-keyed neighbour (PMID:18174132 is
      the unrelated ccmC paper in the same issue). Abstract-only here; the
      abstract directly states the in vitro ATPase assay of purified PilB that
      the PseudoCAP IDA records. Sole seed of the PTN001250205 IBD.
- id: PMID:25049409
  title: A phage protein that inhibits the bacterial ATPase required for type IV pilus
    assembly.
  findings:
  - statement: >-
      Phage D3112 protein Tip binds PilB and inhibits its activity, abolishing
      piliation and twitching motility.
    supporting_text: >-
      Tip interacts with and blocks the activity of bacterial-encoded PilB,
      the TFP assembly/extension ATPase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Chung et al. 2014, PNAS 111:11503-8); abstract-only here.
- id: PMID:33593905
  title: Competitive binding of independent extension and retraction motors explains
    the quantitative dynamics of type IV pili.
  findings:
  - statement: >-
      PilB is the only known extension motor in P. aeruginosa; PilT is the
      main retraction motor.
    supporting_text: >-
      PilB is the only known extension motor, PilT is considered the primary
      retraction motor, and PilU has been shown to affect retraction
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Koch et al. 2021, PNAS). Full text cached; quantitative
      model of PilB/PilT motor competition at the pilus base.
