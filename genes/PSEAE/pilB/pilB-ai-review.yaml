- term:
    id: GO:0043107
    label: type IV pilus-dependent motility
  evidence_type: IDA
  original_reference_id: PMID:1671384
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row citing Strom et al. 1991, a paper about PilD. Its abstract
      describes pilB only as required for pilus biogenesis (citing Nunn et al.
      1990) and reports that pilB mutants have no protein export defect; it
      does not mention twitching motility.
    action: ACCEPT
    reason: >-
      The claim is correct and central: PilB drives the pilus extension step of
      the extension/retraction cycle that is twitching motility, and loss or
      inhibition of PilB abolishes twitching (PMID:25049409, PMID:18174131).
      The full text of PMID:1671384 is not available here, so the reference
      and the IDA code cannot be checked against what the curator saw; a
      query to PseudoCAP is recorded rather than overruling the row.
    supported_by:
    - reference_id: PMID:18174131
      supporting_text: >-
        PilB and PilT are bipolar proteins belonging to the secretion NTPase
        superfamily, and power pilus extension and retraction, respectively
    - reference_id: PMID:25049409
      supporting_text: >-
        Tip interacts with and blocks the activity of bacterial-encoded PilB,
        the TFP assembly/extension ATPase
