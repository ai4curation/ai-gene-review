gene_symbol: pilB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PilB (PA4526) is the type IV pilus extension (assembly) ATPase of
  Pseudomonas aeruginosa, a 566-residue cytoplasmic member of the GspE /
  secretion NTPase superfamily with an N-terminal MshEN domain, a Walker A/B
  P-loop ATPase domain with Asp and His boxes, and a tetracysteine zinc-binding
  motif. Like its homologues it forms a hexameric ring that docks on the
  cytoplasmic face of the inner-membrane platform protein PilC and uses ATP
  hydrolysis to drive polymerization of PilA pilin subunits into the pilus
  fibre. It is recruited to both cell poles in a PilC-dependent manner, and
  its activity is stimulated by the c-di-GMP effector FimX and blocked by the
  phage D3112 protein Tip. Loss of PilB abolishes surface piliation and
  therefore twitching motility, pilus-specific phage infection and
  pilus-dependent biofilm formation, while pilin synthesis is unaffected.
