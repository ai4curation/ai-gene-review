- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001250205
  - UniProtKB:P22608
  review:
    summary: >-
      PAINT IBA from PTN001250205, an IBD whose only seed is the PseudoCAP IDA
      of this protein (PMID:18174131). PilB appears in its own WITH/FROM, which
      is expected for a seed and not circular.
    action: ACCEPT
    reason: >-
      The seed is sound: purified P. aeruginosa PilB hydrolyses ATP in vitro,
      and Walker A/B and Asp/His box residues needed for that activity are
      essential for function. ATP hydrolysis is conserved across the GspE /
      PilB extension ATPases in this subfamily (the catalytic motifs are
      invariant), so placing it at this node is reasonable even with a single
      seed.
    supported_by:
    - reference_id: PMID:18174131
      supporting_text: >-
        Assay of purified 6xHis-tagged PilB, PilT and PilU from P. aeruginosa
        showed that all three proteins have ATPase activities in vitro.
