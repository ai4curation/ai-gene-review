id: Q9I183
gene_symbol: pvdE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdE (PA2397) is a 549-residue inner-membrane ABC exporter of Pseudomonas aeruginosa that
  moves the cytoplasmic pyoverdine precursor across the cytoplasmic membrane into the
  periplasm. It is a full-length half-transporter, with six predicted transmembrane helices
  and an ABC transmembrane type-1 domain followed by a nucleotide-binding domain carrying a
  Walker A motif, and it belongs to the cyclic-peptide exporter family that includes SyrD of
  P. syringae and the microcin exporter YojI of E. coli. Its probable substrate is acylated
  ferribactin, the myristoylated precursor assembled by the cytoplasmic non-ribosomal peptide
  synthetases; once in the periplasm the acyl chain is removed by PvdQ and the chromophore
  matures before the finished siderophore is secreted to the medium by the separate
  PvdRT-OpmQ efflux pump. A pvdE mutant makes no pyoverdine and accumulates no periplasmic
  precursor.
