      The six full transporters are PvdE and a handful of TMD-NBD fusions; the rest are
      energy-coupling-factor ATPases, ModF proteins, FtsE and plant non-intrinsic ABC proteins.
    supporting_text: >-
      The six FULL_TMD_NBD leaves are PvdE itself, Pseudomonas syringae SyrD, E. coli
      and Salmonella YojI, M. tuberculosis Rv2326c and Chloroflexus Caur_0793 (ThiW).
