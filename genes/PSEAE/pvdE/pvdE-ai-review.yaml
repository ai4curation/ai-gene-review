- term:
    id: GO:0042626
    label: ATPase-coupled transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000656738
  - UniProtKB:Q9I183
  review:
    summary: >-
      IBA from PTN000656738. This gene is the sole seed of the IBD, and appears in its own
      WITH/FROM, which is the expected marker that experimental grounding exists on the target
      rather than any circularity. The claim is right for PvdE; the node placement is not, and
      is reported separately.
    action: MODIFY
    reason: >-
      Correct but less specific than this row's evidence supports. The supported term is
      GO:0015440 ABC-type peptide transporter activity, verified in OLS as a descendant of this
      term and whose definition explicitly names siderophores from Gram-negative bacteria among
      the exported peptides. The substrate specificity is carried by the mutant phenotype
      behind the IBD - a pvdE mutant accumulates no periplasmic precursor peptide - together
      with membership of the cyclic peptide exporter family. Separately from the refinement,
      the node placement is over-propagated and is recorded as a defect below: the bioinformatic
      survey of the leaves shows the clade is defined by the nucleotide-binding domain rather
      than by transporter architecture.
    proposed_replacement_terms:
    - id: GO:0015440
      label: ABC-type peptide transporter activity
    supported_by:
    - reference_id: PMID:19787431
      reference_section_type: ABSTRACT
      supporting_text: >-
        Mutation of the gene encoding the export ABC transporter PvdE prevented PVDI production
        and accumulation of PVDIp in the periplasm.
    - reference_id: file:PSEAE/pvdE/pvdE-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'DR   NCBIfam; TIGR01194; cyc_pep_trnsptr; 1.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:Q9I183
        source_label: Q9I183_PSEAE, PvdE - this gene, the sole seed of the IBD
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target's own experimental annotation, so its appearance here is the expected
          marker of experimental grounding on the target and explicitly not circular. The seed
          is sound for PvdE: the mutant phenotype and the full TMD-NBD exporter architecture
          both support the transporter claim.
      - source_id: PANTHER:PTN000656738
        source_label: PTN000656738 (PTHR24221)
        source_status: SOURCE_BAD
        comment: >-
          The node is defined by the nucleotide-binding domain, not by transporter
          architecture. Of 140 leaves inheriting this IBA, 126 are NBD-only soluble ATPases -
          energy-coupling-factor ATPases, ModF proteins, Neisseria FtsE, plant non-intrinsic
          ABC proteins - and only six carry a membrane domain. The node's other IBDs are
          NBD-level claims (ATP binding, ABC transporter complex), which is consistent with
          that reading. An enables transporter activity therefore propagates onto subunits that
          at most contribute to a transport activity carried out by their complex, and onto
          FtsE, which belongs to the non-transporting FtsEX system.
      residue_claims_not_applicable: >-
        The dispute is about the architectural level at which the node sits, not about any
        residue-level claim; no active-site or motif residues were cited by the propagation.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      slot: GO term
      requested_change: CHECK
      asserted_value: GO:0042626
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        The IBD placing GO:0042626 ATPase-coupled transmembrane transporter activity at
        PTN000656738 (PTHR24221) is seeded only by PvdE (Q9I183), a full-length TMD-NBD
        exporter, but sits at a node whose membership is overwhelmingly nucleotide-binding
        domain only. A survey of the 140 leaves inheriting the IBA classified 126 as NBD-only
        soluble ATPases and 6 as full TMD-NBD transporters, the latter being PvdE itself,
        P. syringae SyrD, E. coli and Salmonella YojI, M. tuberculosis Rv2326c and
        Chloroflexus Caur_0793; the rest include energy-coupling-factor ATPases, ModF, FtsE and
        plant non-intrinsic ABC proteins. The node's two other IBDs are NBD-appropriate
        (GO:0005524 ATP binding, GO:0043190 ABC transporter complex), which indicates the clade
        is defined by the NBD. An enables transporter activity at that level over-propagates
        onto proteins that can at most contribute to their complex's transport, and onto FtsE,
        part of the non-transporting FtsEX system. Suggested fix: move the IBD down to the
        clade of TMD-NBD exporters containing PvdE, SyrD and YojI, or express it with
        contributes_to. The seed itself is sound and no change to this gene's annotation is
        requested beyond the refinement to GO:0015440. Raised at PROBABLE with CHECK rather
        than asserted: the leaf classification uses UniProt TRANSMEM features and Pfam
        cross-references rather than a fresh topology prediction or alignment, so an individual
        NBD-only call could be wrong even though the overall pattern is not in doubt.
      supported_by:
      - reference_id: file:PSEAE/pvdE/pvdE-bioinformatics/RESULTS.md
        supporting_text: 'total leaves: 140; FULL_TMD_NBD=6; NBD_ONLY=126; OTHER=8'
