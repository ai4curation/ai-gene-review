- term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000656738
  - UniProtKB:Q05596
  review:
    summary: >-
      IBA for membership of an ABC transporter complex, from the same node, seeded by
      Salmonella CbiO. This is one of the node's NBD-level IBDs and is appropriately placed for
      the clade.
    action: KEEP_AS_NON_CORE
    reason: >-
      Plausible and kept, but not core and not established. PvdE is a full-length
