    label: peptide transport
  - id: GO:0055085
    label: transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19787431
    reference_section_type: ABSTRACT
    supporting_text: >-
      Mutation of the gene encoding the export ABC transporter PvdE prevented PVDI production
      and accumulation of PVDIp in the periplasm.
  - reference_id: PMID:30386787
    reference_section_type: RESULTS
    supporting_text: >-
      The acylated ferribactin is most likely immediately translocated across the cytoplasmic
      membrane into the periplasm by the ABC transporter PvdE
  knowledge_gaps:
  - gap_statement: >-
      PvdE has never been shown to transport anything in vitro. The pathway review states this
      explicitly, so the substrate identity - acylated ferribactin - is inferred from what
      fails to accumulate in the mutant and from what the periplasmic enzymes act on, rather
      than measured. A reconstituted transport assay would establish the substrate, the
      directionality and whether ATP hydrolysis is coupled to translocation in this exporter.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      The oligomeric state is unknown. PvdE is a full-length half-transporter, so a homodimer
      is expected, but no experimental evidence exists and the complex-membership annotation is
      consequently kept as non-core rather than accepted.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Does PvdE transport acylated ferribactin specifically, or will it export the deacylated or
    unmodified precursor too? The acyl chain is added in the cytoplasm and removed in the
    periplasm, so if the transporter requires it, the acylation would be functioning as an
    export signal rather than only as a membrane anchor.
- question: >-
    Is the PTN000656738 IBD better placed at the TMD-NBD exporter clade, or expressed as
    contributes_to at its current depth? The survey behind this review's defect report shows
    126 of 140 inheriting leaves are NBD-only, so the answer affects a large number of
    annotations beyond this gene.
suggested_experiments:
- description: >-
    Reconstitute purified PvdE into proteoliposomes and assay ATP-dependent uptake of
    synthetic acylated and deacylated ferribactin, to establish the substrate and close the
    gap the pathway literature names explicitly.
- description: >-
    Determine the oligomeric state of detergent-solubilised PvdE by size-exclusion
    chromatography coupled to light scattering, and test whether a nucleotide-binding-domain
    Walker A mutant acts as a dominant negative, which would confirm a homodimeric
    half-transporter.
