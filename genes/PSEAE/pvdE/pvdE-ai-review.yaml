- id: PMID:8918232
  title: >-
    Characterisation of the pvdE gene which is required for pyoverdine synthesis in
    Pseudomonas aeruginosa.
  findings:
  - statement: >-
      pvdE is required for pyoverdine synthesis, and the gene product is an ABC transporter -
      the original assignment of an ABC protein to siderophore formation.
    reference_section_type: ABSTRACT
    supporting_text: >-
      We report the characterisation of a fourth Pa gene, pvdE, which we show to be required
      for Pvd synthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Abstract only. This is the paper that identified pvdE and showed it is
      required for pyoverdine synthesis, and is the PseudoCAP source of the GO:0002049 row.
      What it establishes is the requirement and the ABC-transporter identity; the export
      direction and the periplasmic destination come from PMID:19787431.
- id: PMID:19787431
  title: >-
    Synthesis of the siderophore pyoverdine in Pseudomonas aeruginosa involves a periplasmic
    maturation.
  findings:
  - statement: >-
      Loss of PvdE abolishes pyoverdine production and prevents the periplasmic precursor from
      accumulating, which is what places the protein as the exporter of the cytoplasmic
      precursor.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Mutation of the gene encoding the export ABC transporter PvdE prevented PVDI production
      and accumulation of PVDIp in the periplasm.
  - statement: >-
      The pathway model the paper proposes: a precursor peptide is made in the cytoplasm and
      exported to the periplasm by PvdE.
    reference_section_type: ABSTRACT
    supporting_text: >-
      a PVDI precursor peptide is synthesized in the cytoplasm and exported to the
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Abstract only, but it states both halves of what the transporter rows
      need: that a pvdE mutant makes no pyoverdine and accumulates no periplasmic precursor,
      and that the pathway runs cytoplasmic synthesis then PvdE-dependent export to the
      periplasm. It is the PseudoCAP source of the GO:0042626 IMP row and, through that row,
      the sole seed of the PAINT node discussed on the IBA row below. Note that the evidence
      is a phenotype: no direct transport assay on PvdE is reported here or elsewhere.
- id: PMID:22172280
  title: >-
    Biosynthesis of the pyoverdine siderophore of Pseudomonas aeruginosa involves precursors
    with a myristic or a myristoleic acid chain.
  findings:
  - statement: >-
      The exported precursor is acylated with a myristic or myristoleic chain that has to be
      removed before the mature siderophore is secreted, which identifies the probable PvdE
      substrate.
    reference_section_type: ABSTRACT
    supporting_text: >-
      either a myristic or myristoleic chain that must be removed before PVDI is secreted into
      the extracellular medium
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Abstract only. Cited not for a row of its own but to identify what PvdE
      most likely transports: the acylated ferribactin precursor whose acyl chain PvdQ later
      removes in the periplasm. This is what separates PvdE's job from the secretion of the
      finished siderophore.
- id: PMID:30386787
  title: The biosynthesis of pyoverdines.
  findings:
  - statement: >-
      The review's reading of the pathway places PvdE as the transporter that moves acylated
      ferribactin across the cytoplasmic membrane.
    reference_section_type: RESULTS
    supporting_text: >-
      The acylated ferribactin is most likely immediately translocated across the cytoplasmic
      membrane into the periplasm by the ABC transporter PvdE
  - statement: >-
      The same review is explicit that the transport step has never been demonstrated
      biochemically, which bounds how far the molecular-function annotations can go.
    reference_section_type: RESULTS
    supporting_text: >-
      A transport of acylated ferribactin by PvdE has not yet been demonstrated in vitro
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Ringel & Bruser 2018), full text cached. A review rather than primary
      data, and treated as such: it is cited for the field's reading of where PvdE acts, and
      more usefully for its explicit statement that no in vitro transport assay exists. That
      caveat is why the transporter rows here rest on a mutant phenotype plus family
      membership, and why the knowledge gap below is recorded.
- id: PMID:23126435
  title: >-
    Pyoverdine biosynthesis and secretion in Pseudomonas aeruginosa: implications for metal
    homeostasis.
  findings:
  - statement: >-
      Secretion of the finished siderophore to the medium is carried out by a different,
      dedicated efflux pump, so PvdE is not the secretion system.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Secretion of pyoverdine involves a recently identified ATP-dependent efflux pump,
      PvdRT-OpmQ.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Abstract only, and cited for a single contextual point rather than for any row on this
      gene: that mature pyoverdine leaves the cell through PvdRT-OpmQ. That matters because it
      is the reason GO:0180061 native siderophore export across plasma membrane is not
      proposed for pvdE. Marked UNVERIFIED because only the quoted sentence was checked, not
      the paper's own claims about this gene.
