core_functions:
- description: >-
    Hexameric filament cap at the distal tip of the bacterial flagellum: FliD
    retains flagellin subunits arriving through the filament channel and
    positions them for polymerisation, so that the filament elongates instead of
    leaking subunits. Loss of fliD abolishes swimming motility, which
    plasmid-borne PAO1 fliD restores.
  contributes_to_molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  locations:
  - id: GO:0009421
    label: bacterial-type flagellum filament cap
  supported_by:
  - reference_id: PMID:27664419
    supporting_text: >-
      In the crystal, FliD78–405 monomer subunits are arranged in hexamers,
      resulting in a shape akin to a six-pointed star when viewed from the top
      of the FliD oligomer (Figure 2a), which corresponds to the distal end of
      the growing flagellum.
  - reference_id: PMID:27664419
    supporting_text: >-
      We found that swimming motility that was lost in the ΔfliD strain was
      restored in both ΔfliD/fliD1–474 and ΔfliD/fliD1–474(I167C/D253C)
      complementation strains, similar to our observations in the wildtype
      Pseudomonas PAO1 strain (Figure 4d).
suggested_questions:
- question: >-
    What mucin determinant does FliD bind, and is the binding site on the cap
    surface exposed at the filament tip in the assembled flagellum or only on
    free FliD?
- question: >-
    Why does the hexameric Pseudomonas cap not accept Salmonella FliD in
    complementation, and does cap stoichiometry have to match the flagellin it
    polymerises?
suggested_experiments:
- description: >-
    Map the mucin-binding surface of FliD by testing structure-guided surface
    mutants (and the disulfide-locked hexamer FliD I167C/D253C) in the mucin
    adhesion and competition assays, which would show whether adhesion is a
    property of the assembled cap or of monomeric FliD, and could justify a
    specific adhesion molecular-function term.
- description: >-
    Determine a cryo-EM structure of the PAO1 flagellar filament tip with FliD
    in place, to show the cap-flagellin interface directly and test the
    positional-replacement elongation model in this organism.
