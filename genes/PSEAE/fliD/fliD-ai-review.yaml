- id: PMID:9488388
  title: The Pseudomonas aeruginosa flagellar cap protein, FliD, is responsible for
    mucin adhesion.
  findings:
  - statement: >-
      A fliD insertion mutant is non-adhesive to mucin and is complemented by
      fliD on a plasmid; purified FliD, but not PilA or FlaG, competitively
      inhibits mucin adhesion of non-piliated cells.
    supporting_text: >-
      A polar chromosomal insertional mutation in the P. aeruginosa fliD gene
      made this organism nonadhesive to mucin in an in vitro mucin adhesion
      assay.
  - statement: >-
      fliD transcription is independent of the flagellar sigma factor sigma-28
      and depends on FleQ and RpoN (sigma-54).
    supporting_text: >-
      The results of the beta-galactosidase assays suggest that the fliD gene in
      P. aeruginosa is regulated by the newly described transcriptional
      regulator FleQ and the alternate sigma factor sigma54 (RpoN).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Infect Immun 1998, PMC108008); abstract only in the cache
      and PMC returns no body text. It is the right paper for the cell-adhesion
      IDA, but an odd choice for the filament-cap IDA: the cap identity is
      background knowledge in this paper, not one of its reported experiments.
      The cap is established directly for PAO1 FliD in PMID:27664419, which GOA
      does not yet cite.
