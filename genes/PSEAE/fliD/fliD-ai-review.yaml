- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: IDA
  original_reference_id: PMID:9488388
  qualifier: involved_in
  review:
    summary: >-
      A chromosomal fliD insertion mutant is non-adhesive to mucin, adhesion is
      restored by fliD on a plasmid, and purified FliD competitively inhibits
      mucin adhesion of non-piliated P. aeruginosa while purified PilA and FlaG
      do not.
    action: KEEP_AS_NON_CORE
    reason: >-
      Unlike a bare mutant phenotype, this includes a competition experiment
      with purified protein, which points at FliD itself as the mucin-binding
      entity rather than at the flagellum generally, so the claim is sound. It
      is nonetheless a secondary, host-interaction role rather than the
      structural function the protein is built for, and the term is as precise
      as the evidence allows (the assay measures binding to airway mucin, not a
      cell-cell junction), so it is kept as non-core rather than refined.
    supported_by:
    - reference_id: PMID:9488388
      supporting_text: >-
        A polar chromosomal insertional mutation in the P. aeruginosa fliD gene
        made this organism nonadhesive to mucin in an in vitro mucin adhesion
        assay.
    - reference_id: PMID:9488388
      supporting_text: >-
        Further supporting this observation, the in vitro competition
        experiments demonstrated that purified FliD protein inhibited the mucin
        adhesion of nonpiliated P. aeruginosa PAK-NP, while the same
        concentrations of PilA and FlaG proteins of P. aeruginosa were
        ineffective in this function.
