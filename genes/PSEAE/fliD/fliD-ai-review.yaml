id: Q9K3C5
gene_symbol: fliD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FliD (PA1094, HAP2) is the B-type flagellar filament cap protein of
  P. aeruginosa PAO1, a 474-residue protein with coiled-coil N- and C-terminal
  segments flanking a core (residues 78-405) whose crystal structure forms a
  six-pointed star hexamer, confirmed as a hexamer in solution and by
  negative-stain electron microscopy. The cap sits at the distal tip of the
  growing filament, where it keeps flagellin subunits delivered through the
  central channel from diffusing away and positions them for polymerisation, so
  filament elongation and swimming motility depend on it: a PAO1 fliD transposon
  mutant is non-motile and is restored by plasmid-borne fliD, whereas Salmonella
  fliD does not complement it. P. aeruginosa strains carry one of two
  sequence-divergent fliD types, of which PAO1 has the B type. Beyond its
  structural role in the flagellum, FliD is itself an adhesin: a fliD insertion
  mutant loses adhesion to mucin and purified FliD competitively blocks mucin
  adhesion of non-piliated cells, which is relevant to airway colonisation. The
  gene is transcribed from an RpoN/FleQ-dependent promoter rather than the
  flagellar sigma-28 promoter.
