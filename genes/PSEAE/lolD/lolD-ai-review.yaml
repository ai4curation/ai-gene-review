  review:
    summary: >-
      IBA transmembrane transport from the deep ABC ATPase node PTN000655654 (seeds E. coli NikD,
      YejF and M. tuberculosis Rv2688c).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The lipoproteins handled by LolCDE are not carried across the inner membrane; they are lifted
      out of its outer leaflet and passed to LolA. Transmembrane transport is true of the classical
      importers and exporters that seed this deep node but is an over-propagation to the LolD
      clade. The specific process is captured by GO:0044874.
    supported_by:
    - reference_id: PMID:17350955
      supporting_text: >-
        When incubated in the presence of ATP and a LolA homologue, the reconstituted LolCDE
        homologue released lipoproteins, leading to the formation of a LolA-lipoprotein complex.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
