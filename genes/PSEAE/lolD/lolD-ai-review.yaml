  review:
    summary: >-
      IBA transmembrane transporter activity from the deep ABC ATPase node PTN000655654, seeded only
      by M. tuberculosis Rv2688c (P9WQL7, a fluoroquinolone efflux ATPase).
    action: MODIFY
    reason: >-
      LolCDE does not move its substrate across a membrane; it extracts lipoproteins from the outer
      leaflet of the inner membrane and transfers them to LolA in the periplasm. GO models this as
      GO:0140306 lipoprotein releasing activity, which is_a transporter activity but not
      transmembrane transporter activity, and which E. coli LolD carries by IDA. The transporter
      essence holds; the transmembrane part does not fit the LolD subclade.
    proposed_replacement_terms:
    - id: GO:0140306
      label: lipoprotein releasing activity
    supported_by:
    - reference_id: PMID:17350955
      supporting_text: >-
        When incubated in the presence of ATP and a LolA homologue, the reconstituted LolCDE
        homologue released lipoproteins, leading to the formation of a LolA-lipoprotein complex.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000655654
