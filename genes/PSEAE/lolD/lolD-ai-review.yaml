id: Q9HZL7
gene_symbol: lolD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  LolD (PA2987) is the ATP-binding cassette (nucleotide-binding) subunit of the LolCDE lipoprotein
  release complex of Pseudomonas aeruginosa, encoded between the two permease subunits PA2988 and
  PA2986. Two LolD subunits sit on the cytoplasmic face of the inner membrane and power the complex
  by ATP binding and hydrolysis. The purified P. aeruginosa LolCDE complex, reconstituted into
  proteoliposomes, extracts outer-membrane-specific lipoproteins from the inner membrane and hands
  them to the periplasmic chaperone LolA in an ATP-dependent manner, after which LolB inserts them
  into the outer membrane. P. aeruginosa LolCDE does not release lipoproteins carrying the
  Lys3-Ser4 inner-membrane retention signal, so it sets the lipoprotein sorting specificity of the
  organism.
