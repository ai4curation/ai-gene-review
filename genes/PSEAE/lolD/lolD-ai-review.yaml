      Purified P. aeruginosa LolCDE, reconstituted in proteoliposomes, releases lipoproteins to
      LolA in an ATP-dependent manner; LolB then incorporates them into the outer membrane.
    supporting_text: >-
      When incubated in the presence of ATP and a LolA homologue, the reconstituted LolCDE
      homologue released lipoproteins, leading to the formation of a LolA-lipoprotein complex.
  - statement: >-
      P. aeruginosa LolCDE does not release lipoproteins carrying the Lys3-Ser4 inner-membrane
      retention signal.
    supporting_text: >-
      As revealed in vivo, lipoproteins with Lys and Ser at positions 3 and 4, respectively,
      remained in proteoliposomes.
