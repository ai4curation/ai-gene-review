suggested_questions:
- question: >-
    Under what conditions is PA0305 expressed in P. aeruginosa, and does it
    contribute to native AHL turnover given that it is dispensable for growth on
    AHLs?
suggested_experiments:
- description: >-
    Confirm the periplasmic location of PA0305 by fractionation or a
    PhoA fusion, and measure 3-oxo-C12-HSL levels in a deletion mutant under
    conditions where pa0305 is expressed.
