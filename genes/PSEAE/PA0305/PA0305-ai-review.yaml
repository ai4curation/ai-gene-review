  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0305 (named HacB by its characterizers) is a peptidase S45 (penicillin
  acylase family) N-terminal nucleophile hydrolase of Pseudomonas aeruginosa,
  a paralog of the AHL acylases PvdQ and QuiP and closely similar to HacB of
  Pseudomonas syringae. The purified protein is processed into alpha and beta
  subunits, with the catalytic serine at the N-terminus of the beta subunit. It
  is an acyl-homoserine lactone (AHL) acylase (EC 3.5.1.97) that degrades AHLs
  with acyl chains of 6 to 14 carbons and is most efficient on the Las signal
  3-oxo-C12-HSL. Overexpression lowers 3-oxo-C12-HSL and virulence factor
  production, so it can act as a quorum quencher; unlike QuiP it is not needed
  for growth on AHLs. It is probably periplasmic, like its paralogs.
references:
- id: PMID:21372094
  title: PA0305 of Pseudomonas aeruginosa is a quorum quenching acylhomoserine lactone
    acylase belonging to the Ntn hydrolase superfamily.
  findings:
  - statement: Purified PA0305 degrades AHLs with C6 to C14 acyl chains.
    supporting_text: Using a biosensor assay, PA0305his was shown to degrade AHLs
      with acyl side chains ranging in length from 6 to 14 carbons.
  - statement: The protein is processed into alpha and beta subunits with the catalytic serine at the beta N-terminus.
    supporting_text: PA0305 undergoes post-translational processing resulting in α-
      and β-subunits, with the catalytic serine as the first amino acid of the β-subunit
  - statement: The authors conclude it is an efficient long-chain AHL acylase.
    supporting_text: the pa0305 gene encodes an efficient acylase with activity towards
      long-chain homoserine lactones
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA source for GO:0016811 and a seed of the PTN002151232 IBD.
      Abstract only (no PMC full text). The abstract itself reports purification,
      subunit processing, a biosensor degradation assay and kcat/Km values, which
      is direct evidence for the activity.
- id: PMID:16461666
  title: Identification of QuiP, the product of gene PA1032, as the second acyl-homoserine
    lactone acylase of Pseudomonas aeruginosa PAO1.
  findings:
  - statement: A PA0305 mutant grows normally on decanoyl-HSL; QuiP, not PA0305, is the acylase for AHL-dependent growth.
    supporting_text: Moreover, it appears that gene PA1032, and not the other genes
      encoding the other three Ntn hydrolase homologs, likely encodes the acyl-HSL
      acylase activity observed during the growth utilization of acyl-HSLs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; context for PA0305's lack of a growth phenotype.
