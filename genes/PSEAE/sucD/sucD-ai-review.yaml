    label: nucleoside diphosphate kinase activity
  evidence_type: IDA
  original_reference_id: PMID:10671455
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA NDP kinase activity; purified SCS transferred the gamma-phosphate of ATP to GDP (and
      of GTP to ADP).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Full text read. The transphosphorylation is real in vitro, probably through the alpha-subunit
      phosphohistidine, but its physiological relevance is unknown and P. aeruginosa has a dedicated
      nucleoside diphosphate kinase (ndk). Much of what the paper calls NDP kinase activity is the normal
      SCS reaction run with different NDP acceptors, which the ligase terms already cover. Same action
      as
      on the sibling sucC row from this paper.
