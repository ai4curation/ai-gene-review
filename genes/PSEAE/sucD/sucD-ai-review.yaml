- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IC
  original_reference_id: file:PSEAE/sucD/sucD-uniprot.txt
  qualifier: located_in
  review:
    summary: >-
      Proposed location; SucD is the alpha subunit of the soluble cytoplasmic SucCD succinyl-CoA synthetase.
      Inferred, not measured.
    action: NEW
    reason: >-
      GOA has no location row for SucD, and the alpha family (PTHR11117) has no cytosol IBD that reaches SucD (its only one is at the SF24 clade PTN001671414), while the
      partner beta subunit SucC, with which SucD forms one alpha2beta2 enzyme, receives cytosol by IBA.
      Three lines agree: Q51567 has no signal peptide or transmembrane feature and belongs to the HAMAP
      MF_01988 bacterial succinyl-CoA synthetase alpha-subunit family; the enzyme is an obligate heterotetramer
      with SucC; and SucD is 89% identical to E. coli SucD, which is found in the cytosolic fraction
      (see the E. coli sucD review). The P. aeruginosa protein itself has not been localized, so the
      row is an inference and is recorded as IC.
    supported_by:
    - reference_id: file:PSEAE/sucD/sucD-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: "DR   HAMAP; MF_01988; Succ_CoA_alpha; 1."
    - reference_id: file:PSEAE/sucD/sucD-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Heterotetramer of two alpha and two beta subunits.
    - reference_id: PMID:10671455
      supporting_text: showed 89% amino acid sequence identity to the E. coli Scs α subunit
