    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Supports the PseudoCAP ADP-forming SCS seed row and the complex row; the NDP kinase
      row describes a real but secondary in vitro reaction. The enzyme assayed was reconstituted from
      His-tagged subunits made separately in E. coli; copurification with Ndk is an earlier observation
      on the native enzyme.
core_functions:
- description: >-
    Alpha (CoA/phosphate-binding, phosphohistidine) subunit of succinyl-CoA synthetase, which converts
    succinyl-CoA, Pi and ADP or GDP into succinate, CoA and ATP or GTP in the TCA cycle. The cytosolic
    location is inferred from the soluble complex with SucC and the E. coli ortholog; SucD itself has
    not been localized.
  supported_by:
  - reference_id: PMID:10671455
    supporting_text: >-
      In the presence of inorganic orthophosphate, succinyl-CoA, and an equimolar amount of ADP and GDP,
      Scs synthesizes essentially an equimolar amount of ATP and GTP.
