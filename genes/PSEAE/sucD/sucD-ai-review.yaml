taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SucD (PA1589) is the 288-residue alpha subunit of succinyl-CoA synthetase (succinate-CoA ligase, SCS)
  of Pseudomonas aeruginosa PAO1, encoded in the sucCD operon downstream of the beta-subunit gene sucC.
  In the alpha2beta2 enzyme the alpha subunit binds CoA and phosphate and carries the catalytic histidine
  that is transiently phosphorylated during the reaction, while the beta subunit binds succinate and the
  nucleotide. SCS catalyses the substrate-level phosphorylation step of the tricarboxylic acid cycle,
  converting succinyl-CoA, phosphate and NDP into succinate, CoA and NTP. The P. aeruginosa enzyme makes
  ATP and GTP about equally from an equimolar ADP/GDP mixture and, at higher NDP concentrations, also
  UTP
  and CTP. SCS copurifies with nucleoside diphosphate kinase (Ndk), and the SCS-12-kDa Ndk complex makes
  little CTP.
