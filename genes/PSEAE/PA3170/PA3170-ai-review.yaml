  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3170 encodes the 5'-methylthioadenosine (MTA) deaminase of Pseudomonas aeruginosa (PaMTADA), a zinc-dependent
  enzyme of the amidohydrolase superfamily (ATZ/TRZ subgroup). It deaminates MTA to 5'-methylthioinosine
  with very high catalytic efficiency (kcat/Km 1.6 x 10^7 per M per s) and also deaminates adenosine about
  40-fold less efficiently, but not adenine, S-adenosylhomocysteine or guanosine. It is the only MTA-acting
  activity in P. aeruginosa extracts and begins the organism's unusual MTA salvage route, in which MTI
  is then cleaved by the MTI phosphorylase PA3004. MTA is a by-product of polyamine synthesis and of acyl-homoserine
  lactone synthesis by quorum-sensing synthases. Crystal structures with 5'-methylthiocoformycin show
  the transition-state mimic bound to the catalytic zinc.
