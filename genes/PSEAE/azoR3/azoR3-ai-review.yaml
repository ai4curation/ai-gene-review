taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  azoR3 (PA3223) encodes paAzoR3, one of three FMN-dependent flavodoxin-fold
  azoreductases (azoreductase type 1 family) of Pseudomonas aeruginosa. The
  purified enzyme uses NADH to reduce quinones, preferring naphthoquinones such as
  plumbagin, and is the most active quinone reductase of the three paralogs; it
  also reduces azo dyes such as methyl red and amaranth, at much lower rates. Its
  likely physiological role, inferred from the Escherichia coli ortholog AzoR, is
  two-electron reduction of toxic quinones, but no P. aeruginosa mutant phenotype
  has been reported.
