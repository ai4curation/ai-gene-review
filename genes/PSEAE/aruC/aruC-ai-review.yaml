taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  aruC (PA0895) encodes the N2-succinylornithine / N2-acetylornithine
  5-aminotransferase of Pseudomonas aeruginosa (SOAT/ACOAT, EC 2.6.1.81 and
  2.6.1.11), a cytoplasmic, pyridoxal 5'-phosphate-dependent class-III
  aminotransferase of the ArgD subfamily. It is the first gene of the
  aruCFGDB operon of the arginine succinyltransferase (AST) pathway, the main
  route of aerobic arginine and ornithine utilization, where it transaminates
  N2-succinylornithine to N-succinylglutamate 5-semialdehyde with
  2-oxoglutarate. The same enzyme transaminates N2-acetylornithine, the fourth
  step of arginine biosynthesis, and is thought to serve both pathways. Its
  synthesis is induced by arginine through the AraC-family regulator ArgR and
  is subject to catabolite repression by succinate and other carbon sources.
