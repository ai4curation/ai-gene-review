- term:
    id: GO:0006526
    label: L-arginine biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:16593724
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row from Jann et al. 1986; sole seed of the PTN000241318 L-arginine
      biosynthesis IBD.
    action: ACCEPT
    reason: >-
      Sound seed, with a caveat. The paper's experiments establish the catabolic
      pathway; its biosynthetic statement ("an arginine biosynthetic enzyme", "dual
      role") rests on the purified ACOAT's activity and on earlier work that
      purified PAO1 ACOAT as the fourth enzyme of arginine biosynthesis
      (PMID:238949). The enzyme catalyses the biosynthetic step, so it does part of
      the work of the process. No arginine-auxotrophy test of an aruC mutant was
      available to me, and PAO1 has an uncharacterised paralog in the same clade
      (PA0530), so whether AruC is the only biosynthetic ACOAT in vivo is open.
    supported_by:
    - reference_id: PMID:16593724
      supporting_text: >-
        this explains the enzyme's dual role in arginine biosynthesis and
        catabolism
    - reference_id: PMID:238949
      supporting_text: >-
        P. aeruginosa this enzyme functions in the biosynthesis as well as in the
        catabolism of L-arginine.
