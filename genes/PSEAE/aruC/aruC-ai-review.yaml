suggested_questions:
- question: >-
    Is a PAO1 aruC deletion an arginine auxotroph or bradytroph, or does the
    uncharacterised paralog PA0530 (same PAINT clade) provide ACOAT activity for
    arginine biosynthesis?
- question: >-
    Should the PTN000241318 L-arginine biosynthesis IBD (sole seed AruC) be restricted
    to an ArgD-only subnode, given that the clade includes LysJ-type
    [LysW]-aminoadipate semialdehyde transaminases and a diaminobutyrate
    aminotransferase?
suggested_experiments:
- description: >-
    Delete aruC and PA0530 singly and together in PAO1; test growth without arginine
    and on arginine as sole carbon source, and assay ACOAT and SOAT activities in
    extracts and with purified PA0530, to apportion the biosynthetic and catabolic
    roles.
