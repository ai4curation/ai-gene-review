suggested_questions:
- question: >-
    GO has no molecular function term for C4-dicarboxylate (malate) binding by a sensor domain. Would
    a term such as L-malate binding be useful for chemoreceptors and sensor kinases such as CtpM and
    DctB?
suggested_experiments:
- description: >-
    Determine the structure of the CtpM sCache_2 domain with L-malate and with the antagonist methylsuccinate,
    to see how antagonist binding fails to produce the signalling conformation.
