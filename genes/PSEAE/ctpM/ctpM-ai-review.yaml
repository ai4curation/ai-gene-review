core_functions:
- description: >-
    Inner-membrane chemoreceptor for L-malate and related C4-dicarboxylic acids. Its periplasmic sCache_2
    ligand binding domain binds attractants and antagonists at a shared site, and the cytoplasmic HAMP
    and MCP signalling domains relay the signal through the Che chemosensory pathway to drive positive
    chemotaxis.
  supported_by:
  - reference_id: PMID:29391435
    supporting_text: the ligand binding domain (LBD) of the chemoreceptor PA2652 directly recognizes five
      C4-dicarboxylic acids
  - reference_id: PMID:29391435
    supporting_text: we found that only the che pathway is involved in PA2652-mediated taxis
  - reference_id: PMID:17933940
    supporting_text: We identified PA2652 as a chemoreceptor for malate by screening aer mcp double mutants
      by using swarm plate assays.
