  label: Pseudomonas aeruginosa PAO1
description: >-
  CtpM (PA2652) is a methyl-accepting chemotaxis protein (MCP) of Pseudomonas aeruginosa PAO1 that
  serves as the chemoreceptor for L-malate and related C4-dicarboxylic acids. It is an inner-membrane
  receptor with two transmembrane helices flanking a periplasmic sCache_2 ligand binding domain, followed
  by a cytoplasmic HAMP domain and the MCP signalling domain. The ligand binding domain is a dimer and
  directly binds five C4-dicarboxylic acids (L-malate, citramalate, citraconate, bromosuccinate and
  methylsuccinate) with micromolar to millimolar affinities. Three of these act as chemoattractants
  and two as antagonists that compete for the binding site and dampen signalling. CtpM signals through
  the Che chemosensory pathway, and a ctpM mutant loses chemotaxis to malate. Its role was first
  revealed in an aer mutant, in which Aer-mediated energy taxis no longer masks malate chemotaxis.
