- id: PMID:9818381
  title: 'GSP-dependent protein secretion in gram-negative bacteria: the Xcp system of Pseudomonas
    aeruginosa.'
  findings:
  - statement: Review of the Xcp type II secretion machinery of P. aeruginosa.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review (FEMS Microbiol Rev 1998). Full text read from a copy supplied by the user
      (not cached); no original secretion data for the Xcp proteins; the only new observations are
      unpublished notes on XcpT multimerization, XcpR homomultimers and membrane association, and an
      XcpP-XcpQ interaction. A correct reference for a TAS statement of the Xcp secretion roles, but
      it does not support the PseudoCAP IDA.
