taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: XcpX (PA3097) is the GspK-family minor pseudopilin of the Xcp type II secretion
  system of Pseudomonas aeruginosa, the machine that exports elastase, lipases and other
  exoproteins from the periplasm across the outer membrane. It is a bitopic inner-membrane
  protein whose short leader is removed by the prepilin peptidase PilD/XcpA, leaving a large
  periplasmic domain. XcpX binds XcpV, XcpW and XcpU to form the calcium-binding tip complex of the
  periplasmic pseudopilus, sits at the top of that complex, binds the major pseudopilin XcpT, and
  limits pseudopilus length.
