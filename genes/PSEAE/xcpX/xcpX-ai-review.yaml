- description: Minor pseudopilin (GspK) of the Xcp type II secretion system; caps the
    periplasmic pseudopilus as part of the XcpU-V-W-X tip complex, binds XcpT and limits
    pseudopilus length, supporting secretion of exoproteins across the outer membrane.
  supported_by:
