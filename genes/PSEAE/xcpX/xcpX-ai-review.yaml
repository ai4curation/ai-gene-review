suggested_questions:
- question: Is XcpX strictly required for Xcp-dependent secretion of every substrate, given that a
    PAO1 transposon xcpX mutant still secreted protease (PMID:30346996) while the glycine mutant
    lost function (PMID:9466253)?
- question: Should the XcpX calcium binding shown by ITC (PMID:30346996) be captured as a calcium
    ion binding annotation?
