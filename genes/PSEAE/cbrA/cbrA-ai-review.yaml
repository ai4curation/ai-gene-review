suggested_questions:
- question: >-
    Is histidine transport by P. aeruginosa CbrA coupled to its kinase output, and what is the signal
    (C/N ratio, histidine) sensed?
suggested_experiments:
- description: >-
    Radiolabelled L-histidine uptake into P. aeruginosa cells or proteoliposomes with CbrA versus SLC5-domain
    mutants, to test whether the transporter function is conserved in P. aeruginosa.
