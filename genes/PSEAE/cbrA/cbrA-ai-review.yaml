- id: PMID:11401699
  title: >-
    The CbrA-CbrB two-component regulatory system controls the utilization of multiple carbon and nitrogen
    sources in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      cbrA encodes a 983-residue sensor kinase with a 12-TM N-terminal membrane domain and an NtrB-like
      kinase domain.
    supporting_text: >-
      The amino-terminal half (490 residues) of CbrA appears to be a sensor membrane domain, as predicted
      by 12 possible transmembrane helices
  - statement: >-
      cbrA and cbrB mutants cannot use arginine, histidine, proline, polyamines and other carbon sources.
    supporting_text: >-
      cbrA and cbrB mutants of strain PAO were found to be unable to use several amino acids (such as
      arginine, histidine and proline), polyamines and agmatine as sole carbon and nitrogen sources
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: "Abstract only. Primary characterisation of CbrA-CbrB by genetics; no phosphorylation\n\
      \   assay is described in the abstract. The process term in the PseudoCAP row is right; the IDA\
      \ code is queried\n   (SUSPECTED, since the full text was not read)."
- id: PMID:21169488
  title: >-
    The sensor kinase CbrA is a global regulator that modulates metabolism, virulence, and antibiotic
    resistance in Pseudomonas aeruginosa.
  findings:
  - statement: Deleting cbrA abolishes swarming and increases biofilm formation in PA14.
    supporting_text: >-
      The cbrA deletion mutant was completely unable to swarm while exhibiting an increase in biofilm
      formation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract read; states the mutant phenotypes behind the two PseudoCAP IMP rows.
- id: PMID:32214184
  title: Transport and kinase activities of CbrA of Pseudomonas putida KT2440.
  findings:
  - statement: >-
      Purified P. putida CbrA autophosphorylates at His766 and phosphorylates CbrB; its SLC5 domain transports
      L-histidine.
    supporting_text: >-
      we show that CbrA and CbrAΔSLC5 can autophosphorylate at His766 and transfer the phosphoryl group
      to CbrB
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Ortholog (P. putida KT2440) biochemistry; supports the kinase and histidine-transport
      functions by orthology.
- id: PMID:26148710
  title: >-
    Role of the Transporter-Like Sensor Kinase CbrA in Histidine Uptake and Signal Transduction.
  findings:
  - statement: >-
      P. fluorescens CbrA is required for histidine uptake; SSSF-domain mutations affect transport and
      signalling.
    supporting_text: implicated CbrA in histidine uptake
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract read. Ortholog (P. fluorescens SBW25) data on the transporter domain.
