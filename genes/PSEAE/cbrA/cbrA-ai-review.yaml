  label: Pseudomonas aeruginosa PAO1
description: >-
  CbrA (PA4725) is the sensor histidine kinase of the CbrA-CbrB two-component system of Pseudomonas aeruginosa.
  The 983-residue protein has an N-terminal domain of 12-13 transmembrane helices belonging to the solute:sodium
  symporter (SLC5/SSSF) family, followed by a PAS domain and a C-terminal HisKA/HATPase kinase core of
  the NtrB type. With the NtrC-family, sigma-54 dependent response regulator CbrB it controls the use
  of many carbon and nitrogen sources (arginine, histidine, proline, polyamines), carbon catabolite repression
  through the small RNAs CrcZ and CrcY, and in P. aeruginosa also swarming, biofilm formation, cytotoxicity
  and antibiotic resistance. In P. putida and P. fluorescens the orthologous CbrA autophosphorylates,
  phosphorylates CbrB, and its SLC5 domain transports L-histidine.
