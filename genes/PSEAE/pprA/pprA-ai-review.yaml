  label: Pseudomonas aeruginosa PAO1
description: >-
  PprA (PA4293) is the sensor histidine kinase of the PprA-PprB two-component system of Pseudomonas aeruginosa.
  It is a 922-residue protein without a signal peptide or transmembrane segments, so it is thought to
  be cytoplasmic; it carries several N-terminal PAS/PAC sensory modules and a C-terminal HisKA/HATPase
  kinase core. Purified PprA autophosphorylates and transfers the phosphoryl group to its cognate response
  regulator PprB (PA4296). PprB controls membrane permeability to aminoglycosides and, in later work,
  a biofilm regulon that includes Flp type IVb pili, the BapA adhesin and CupE fimbriae.
