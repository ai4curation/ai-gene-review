  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3992 encodes SltB3 (also called SltH), one of the eleven lytic transglycosylases of Pseudomonas
  aeruginosa and a member of the family 3 (GH103, MltB-like) group. The 448-residue precursor has a signal
  peptide, a catalytic SLT domain with a calcium-binding loop, and a C-terminal peptidoglycan-binding
  domain; the crystal structure shows four domains arranged as a ring through which the glycan strand
  threads. SltB3 is an exolytic enzyme that removes the terminal disaccharide from peptidoglycan strands,
  needing at least four sugars and processing strands of up to 20 sugars, and releases
  N-acetylglucosamine-1,6-anhydro-N-acetylmuramic acid as the final product. It contributes to periplasmic
  peptidoglycan turnover during cell wall recycling.
