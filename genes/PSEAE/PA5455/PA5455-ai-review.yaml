id: Q9HTB5
gene_symbol: PA5455
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5455 is a predicted GT-B fold glycosyltransferase of the GT4 family (Pfam
  PF13692, Glyco_trans_1_4; 542 residues) encoded in the pa5455-pa5459 operon next
  to the rmd-wbpZ cluster for the common polysaccharide antigen (CPA, A-band
  O antigen), a D-rhamnan homopolymer of the lipopolysaccharide of Pseudomonas
  aeruginosa. In-frame deletion of either PA5455 or its neighbour PA5456 abolishes CPA
  production, and complementation in trans restores it; co-overexpression of
  PA5455 and PA5456 shortens CPA chains, suggesting that one or both catalyse a
  chain-length-determining or chain-terminating step. The donor and acceptor
  substrates and the linkage formed are not known; the D-rhamnan repeat itself is
  built by the D-rhamnosyltransferases WbpZ, WbpY and WbpX.
references:
- id: PMID:23341552
  title: Five new genes are important for common polysaccharide antigen biosynthesis
    in Pseudomonas aeruginosa.
  findings:
  - statement: pa5455 and pa5456 are putative glycosyltransferases by sequence analysis
      only.
    supporting_text: Gene sequence analysis indicated that pa5455 and pa5456 encode
      putative glycosyltransferases.
  - statement: Deletion of either gene abolishes CPA, and complementation restores it.
    supporting_text: Mutation of either one of the two putative glycosyltransferase
      genes, pa5455 and pa5456, completely abrogated CPA biosynthesis
  - statement: The evidence is genetic; no enzyme assay is reported.
    supporting_text: We have presented evidence from genetic studies that the genes
      in the pa5455-pa5459 cluster are involved in CPA biosynthesis in P. aeruginosa.
  - statement: Co-overexpression shortens CPA chains; the authors speculate on a chain-terminating
      role.
    supporting_text: One or both of the proteins encoded by these genes is therefore
      the best candidate for the catalyst of the chain length-determining reaction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for all four experimental rows on PA5455 and PA5456. Full
      text read (PMC3560663). The paper contains RT-PCR, 5'-RACE, EMSA with RNA
      polymerase, promoter-trap assays, in-frame deletions with complementation,
      and overexpression; it contains no glycosyltransferase assay and no
      purified-protein work on PA5455 or PA5456. The glycosyltransferase assignment
      is from sequence. The IDA codes on glycosyltransferase activity and on
      O antigen biosynthetic process are therefore wrong evidence codes; the
      reference itself is correctly attached.
