core_functions:
- description: >-
    Predicted GT4-family glycosyltransferase required for biosynthesis of the
    common polysaccharide antigen (A-band O antigen) of LPS; possibly involved,
    with PA5456, in CPA chain-length determination or termination. Donor, acceptor
    and linkage are unknown.
