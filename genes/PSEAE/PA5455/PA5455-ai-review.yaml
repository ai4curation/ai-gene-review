    summary: >-
      PseudoCAP row coded IDA. The supporting data are the in-frame deletion and
      complementation (loss and restoration of CPA, the A-band O antigen), which is
      mutant-phenotype evidence. As a predicted glycosyltransferase in the CPA
      operon whose loss abolishes the polymer, PA5455 very probably performs a step
