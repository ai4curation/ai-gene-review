knowledge_gaps:
- gap_statement: >-
    The sugar donor, acceptor and glycosidic linkage made by PA5455 are unknown, as
    is whether it acts at CPA chain initiation, elongation, capping or termination.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    The PAINT IBD on PTN002288302 (glycosyltransferase activity, 57 leaf IBAs in 43
    taxa) rests only on the PseudoCAP IDA rows for PA5455 and PA5456, which have no
    enzyme assay behind them. Should the IBD be re-based on the GT4 domain (or
    withdrawn until an experimental seed exists)?
- question: >-
    Do PA5455 and PA5456 form a complex, as the overexpression phenotype suggests,
    and does either add a non-rhamnose terminal residue to CPA?
suggested_experiments:
- description: >-
    Express PA5455 and PA5456 (singly and together) and assay transfer from
    nucleotide sugars (GDP-D-Rha, GDP-D-Man, UDP-GlcNAc and others) to synthetic
    D-rhamnan acceptors such as those used for WbpX/WbpY/WbpZ, identifying products
    by MS and NMR.
