core_functions:
- description: >-
    Major structural subunit of the type IVa pilus. Processed pilin waits in
    the inner membrane and is polymerised by the assembly machine into a
    helical fibre whose surface is formed by the PilA globular domain; cycles
    of fibre extension and retraction drive twitching motility, and the fibre
    mediates attachment to host cells and surfaces.
  directly_involved_in:
  - id: GO:0043107
    label: type IV pilus-dependent motility
  - id: GO:0007155
    label: cell adhesion
  locations:
  - id: GO:0044096
    label: type IV pilus
  supported_by:
  - reference_id: PMID:39666767
    supporting_text: >-
      The N-terminal helices constitute the pilus core where they stabilise
      the tubular assembly via hydrophobic interactions.
  - reference_id: PMID:12933890
    supporting_text: >-
      The pilA mutant is twitching motility negative because it lacks pili
- description: >-
    Autoregulation of pilin supply: unassembled PilA in the inner membrane
    binds the sensor kinase PilS and, through PilS phosphatase activity on
    PilR, lowers pilA transcription when pilin is abundant.
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:27162347
    supporting_text: >-
      the PilA-PilS interaction promotes PilR dephosphorylation and thus
      down-regulation of further pilA transcription
suggested_questions:
- question: >-
    Does PilA reach the host cell interior during infection, and if so how,
    given that the CAMLG/host-ER evidence comes from expressing pilA inside
    host cells?
suggested_experiments:
- description: >-
    Infect BEAS-2B cells with strains expressing PilA variants that assemble
    pili but carry point mutations abolishing CAMLG binding, to separate a
    PilA-CAMLG signalling activity from pilus-mediated attachment in the
    Ca2+ response.
