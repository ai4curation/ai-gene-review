- term:
    id: GO:0044167
    label: host cell endoplasmic reticulum membrane
  evidence_type: EXP
  original_reference_id: PMID:23266901
  qualifier: located_in
  review:
    summary: >-
      UniProt EXP from Okuda et al. 2013: PilA binds the host ER membrane
      protein CAMLG in a yeast two-hybrid screen and, when the pilA gene is
      over-expressed inside BEAS-2B cells, raises cytoplasmic Ca2+.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The host ER location rests on PilA expressed inside human cells from a
      transfected gene and on two-hybrid binding to an ER membrane protein,
      not on PilA delivered by bacteria during infection. PilA is a secreted
      fibre subunit and no route for it into the host ER is known, so this is
      at most a peripheral, unconfirmed observation.
    supported_by:
    - reference_id: PMID:23266901
      supporting_text: >-
        Overexpression of the pilA gene in BEAS-2B cells resulted in a
        significant increase in cytoplasmic Ca(2+)
