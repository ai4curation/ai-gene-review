id: P04739
gene_symbol: pilA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PilA (PA4525) is the major pilin of the type IVa pilus of Pseudomonas
  aeruginosa. It is made as a prepilin with a short positively charged leader
  that the prepilin peptidase PilD cleaves before N-methylating the new
  N-terminal phenylalanine. Unassembled pilin sits in the inner membrane,
  anchored by its hydrophobic N-terminal helix; there it also binds the sensor
  kinase PilS and so represses its own transcription when pilin is abundant.
  The assembly machine polymerises PilA from this pool into a helical fibre in
  which the N-terminal helices pack into the hydrophobic core and the
  C-terminal globular domains, closed by a disulfide loop, coat the surface.
  Repeated extension and PilT/PilU-driven retraction of PilA fibres powers
  twitching motility, and the fibres mediate attachment to host cells and
  abiotic surfaces, biofilm architecture and infection by pilus-specific
  phages. Loss of PilA abolishes surface pili and twitching.
