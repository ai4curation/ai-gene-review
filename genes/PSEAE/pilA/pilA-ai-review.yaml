    summary: >-
      CACAO IDA from Chung et al. 2014 (phage Tip protein inhibits PilB), with
      part_of cytosol. Full text could not be retrieved.
    action: UNDECIDED
    reason: >-
      The paper is about PilB inhibition and loss of surface piliation; the
      abstract reports no PilA fractionation, and the full text is not
      available here. The claim is also biologically doubtful: unassembled
      PilA is an inner-membrane protein anchored by its N-terminal
      hydrophobic helix (UniProt; PMID:27162347), not a soluble cytosolic
      protein, so a cellular (non-surface) PilA pool in a Western blot may have
      been recorded as cytosol. Left undecided because the figure behind the
      row cannot be checked.
