suggested_questions:
- question: >-
    Which nucleotide sugar donor and which lipid-linked acceptor does PslC use in
    the Psl repeat-unit pathway?
- question: >-
    Should the PTN002463206 biofilm formation IBD be removed, given that the clade
    contains O-antigen, succinoglycan and flagellin glycosyltransferases?
suggested_experiments:
- description: >-
    Express PslC and assay transfer from GDP-mannose, UDP-glucose and
    dTDP-rhamnose onto synthetic undecaprenyl-diphosphate-linked Psl intermediates,
    with LC-MS of products.
