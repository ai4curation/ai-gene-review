  review:
    summary: >-
      IBA from PTN002463206, whose biofilm formation IBD is seeded only by this
      gene's own PseudoCAP row. The target in its own WITH/FROM is expected.
    action: KEEP_AS_NON_CORE
    reason: >-
      True of PslC in P. aeruginosa, because Psl is a biofilm matrix polymer and a
      pslC deletion abolishes Psl and attachment. It is a downstream context of
      Psl synthesis, not the protein's own activity. The node, however, groups
      GT-2 glycosyltransferases for unrelated glycans (an O-antigen
      rhamnosyltransferase, a succinoglycan-type ExoU, a flagellin
      glycosyltransferase), for which biofilm formation is not a conserved function.
      The IBD is not a sound family-level claim (see source defect).
    supported_by:
    - reference_id: PMID:19659934
      supporting_text: >-
        In this study we have demonstrated that eleven of the fifteen psl genes,
        pslACDEFGHIJKL, are required for Psl synthesis and solid surface attachment.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN002463206
      requested_change: DELETE_ROW
      asserted_value: GO:0044010
      confidence: PROBABLE
      explanation: >-
        The GO:0044010 single-species biofilm formation IBD at PTN002463206 (7 leaf
        IBAs) rests only on P. aeruginosa PslC (Q9I1N6, PseudoCAP IDA
        PMID:19659934). That evidence is a deletion-mutant phenotype (loss of Psl
        and surface attachment), and biofilm formation is a downstream outcome of
        Psl synthesis. The other leaves are GT-2 glycosyltransferases for unrelated
        glycans: Salmonella RfbN O-antigen rhamnosyltransferase (P26403),
        Bradyrhizobium ExoU (Q89D69), P. aeruginosa flagellin glycosyltransferase
        FgtA (Q9I4N8) and PA1390 (Q9I3V4), Geobacter Q74CL7 and Xanthomonas
        Q8P4N7. Biofilm formation is not a conserved function of this clade; please
        remove the IBD.
      supported_by:
      - reference_id: PMID:21991261
        supporting_text: >-
          Enzymes in the GT-2 family transfer a wide variety of nucleotide
          activated sugars (including glucose, rhamnose, and mannose), so it is
          difficult to speculate which of these substrates PslC specifically
          recognizes.
