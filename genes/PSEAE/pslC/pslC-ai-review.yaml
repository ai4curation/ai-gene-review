  review:
    summary: >-
      PseudoCAP IDA; sole seed of the PTN002463206 biofilm formation IBD (7 leaf
      IBAs). Byrd et al. deleted each psl gene and measured Psl production and
      surface attachment.
    action: KEEP_AS_NON_CORE
    reason: >-
      The claim is true for this gene: the pslC deletion mutant made no Psl and
      was defective in crystal-violet attachment assays. The evidence is a mutant
      phenotype, so the code should be IMP, not IDA. Biofilm formation is the
      downstream outcome of PslC's role in Psl synthesis, so the term is
      peripheral to its core function.
    supported_by:
    - reference_id: PMID:19659934
      supporting_text: >-
        The same eleven strains that were deficient in attachment likewise did not
        produce detectable levels of Psl.
