    label: polysaccharide biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:19659934
  qualifier: involved_in
  review:
    summary: >-
      Proposed. pslC is one of eleven psl genes required for Psl exopolysaccharide
      synthesis.
    action: NEW
    reason: >-
      PslC is a predicted glycosyltransferase whose deletion abolishes Psl, so it
      performs a step of Psl assembly itself (glycosyl transfer), not merely
      being required for it. GO has no Psl-specific term, and the obsolete
      extracellular polysaccharide biosynthetic process was replaced by this term.
      Other polysaccharide-synthesis enzymes in P. aeruginosa carry comparable
      process terms (Pel and alginate machinery).
