taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  pslC (PA2233) encodes PslC, a predicted soluble glycosyltransferase of the GT-2
  family (GT-A fold) encoded by the 15-gene psl operon of Pseudomonas aeruginosa.
  The operon directs synthesis of Psl, a neutral exopolysaccharide built from a
  repeating pentasaccharide of D-mannose, D-glucose and L-rhamnose. Psl is a
  principal biofilm matrix polysaccharide of non-mucoid strains, mediating surface
  attachment and biofilm structure. In-frame deletion of pslC abolishes Psl
  production and surface attachment. PslC is thought to transfer one of the
  repeat-unit sugars from a nucleotide-sugar donor during assembly of the
  lipid-linked repeat unit, but its donor and acceptor specificities have not been
  determined.
