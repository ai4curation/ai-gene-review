- term:
    id: GO:0009927
    label: histidine phosphotransfer kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT2G17820
  - PANTHER:PTN002463889
  review:
    summary: >-
      IBA for histidine phosphotransfer kinase activity from PTN002463889, seeded only by Arabidopsis
      AT2G17820 (AHK1).
    action: REMOVE
    reason: >-
      GO:0009927 is the activity of an HPt domain that shuttles phosphate between a hybrid kinase and
      a response regulator. PfeS is a classical sensor kinase with HAMP, HisKA and HATPase domains and
      no HPt or receiver domain; it phosphorylates PfeR directly. The term does not suit this bacterial
      sensor-kinase clade.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002463889
        source_label: PTN002463889
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Broad sensor histidine kinase node (RcsC, BaeS, PrrB, PfeS, plant AHK1); 200 leaves in 59 taxa.
          An HPt-type activity seeded by one plant hybrid kinase is transferred to classical bacterial
          kinases that lack an HPt domain.
      - source_id: AGI_LocusCode:AT2G17820
        source_label: Arabidopsis AHK1/HK1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Hybrid histidine kinase; its phosphorelay architecture does not apply to PfeS.
    supported_by:
    - reference_id: file:PSEAE/pfeS/pfeS-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: PF00512; HisKA
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN002463889
      requested_change: DELETE_ROW
      asserted_value: GO:0009927
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Topology checked with projects/PSEUDOCAP/panther_tree.py on 2026-11-05. The node could
        not be resolved from its seeds automatically; it is in PTHR43711 (not PTHR45436, which
        is the PANTHER family UniProt cross-references for Q04804 - the two sources disagree,
        and PANTHER's own tree is what PAINT propagates on). PTN002463889 is the family's LUCA
        SPECIATION node: 200 leaves spread over ten subfamilies (SF1:80, SF26:42, SF31:43,
        SF28:19, SF32:4, SF15:3, SF29:3, SF13:2, SF18:2, SF30:2), with two children,
        PTN001976854 (SPECIATION, Archaea-Eukaryota; 65 leaves, SF1:60, SF15:3, SF18:2) and
        PTN002463899 (DUPLICATION; 135 leaves, all bacterial). The GO:0009927 histidine
        phosphotransfer kinase activity IBD is seeded only by Arabidopsis AT2G17820 (AHK1,
        Q9SXL4), which sits sixteen nodes deep inside the eukaryotic child PTN001976854, while
        P. aeruginosa PfeS (Q04804) is in the bacterial child, at
        PTN002463899 -> PTN008117710 -> PTN008117711 -> PTN008684377 -> PTN002536215.
        So a single plant hybrid-kinase seed is propagated across the whole bacterial half of
        the family, which includes E. coli BaeS (P30847), E. coli RcsC (P0DMC5) and
        M. tuberculosis PrrB (P9WGK7) as well as PfeS. PfeS has no HPt domain and no receiver
        domain: its architecture is HK_sensor-HAMP-HisKA-HATPase_c (Pfam PF16750, PF00672,
        PF00512, PF02518), so it cannot carry an HPt shuttle activity. Requested change:
        withdraw the IBD; if it is retained it must be moved at least to PTN001976854, which
        excludes every bacterial leaf, and better to a node restricted to HPt-domain-containing
        members. No such clade exists on the bacterial side of this tree.
      supported_by:
      - reference_id: file:PSEAE/pfeS/pfeS-uniprot.txt
        record_section: ["DR:Pfam"]
        supporting_text: PF00512; HisKA
