suggested_questions:
- question: >-
    Does the PfeS periplasmic domain bind ferric enterobactin directly, or does PfeS sense an enterobactin
    hydrolysis product after PfeE action?
suggested_experiments:
- description: >-
    Purify the PfeS cytoplasmic domain and test autophosphorylation and phosphotransfer to PfeR in vitro;
    measure enterobactin binding to the periplasmic domain (3KYZ construct) by ITC.
