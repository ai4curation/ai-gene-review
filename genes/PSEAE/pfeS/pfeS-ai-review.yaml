gene_symbol: pfeS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PfeS (PA2687) is the sensor histidine kinase of the PfeS-PfeR two-component system of Pseudomonas aeruginosa,
  which induces the ferric enterobactin outer membrane receptor PfeA when the xenosiderophore enterobactin
  is present. It is an inner-membrane protein with two transmembrane helices flanking a periplasmic sensor
  domain (crystal structure 3KYZ), a cytoplasmic HAMP linker, a HisKA dimerization/phosphoacceptor domain
  with the conserved autophosphorylation histidine (His244) and an HATPase catalytic domain. By domain
  architecture it autophosphorylates and transfers the phosphoryl group to the response regulator PfeR,
  which binds the pfeA promoter and activates its transcription. PfeS has no receiver or histidine-phosphotransfer
  (HPt) domain, so it is a classical, not a hybrid, sensor kinase.
