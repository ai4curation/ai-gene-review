- id: PMID:2153661
  title: 'Identification and characterization of genes for a second anthranilate synthase
    in Pseudomonas aeruginosa: interchangeability of the two anthranilate synthases
    and evolutionary implications.'
  findings:
  - statement: >-
      The cloned phnA phnB pair complements E. coli trpE and trpE(G) mutants,
      establishing anthranilate synthase activity for the gene pair.
    supporting_text: >-
      The cloned phnA phnB gene pair complements trpE and trpE(G) mutants of
      Escherichia coli.
  - statement: >-
      The pigment phenotype of phn mutants is partial, and residual pyocyanin
      depends on the tryptophan-pathway anthranilate synthase, which shows that
      the link to pyocyanin runs through the supply of anthranilate rather than
      through a dedicated phenazine step.
    supporting_text: >-
      Introduction of an inactivated trpE gene into a phnA mutant abolished
      residual pyocyanin production, suggesting that the trpE trpG gene products
      are capable of providing some anthranilate for pyocyanin synthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; only the abstract is cached (the PMC copy is a scanned
      1990 article), so quotes here are from the abstract and from the
      Swiss-Prot statements that cite this paper with ECO:0000269. It solidly
      supports the anthranilate synthase annotation. Its pyocyanin phenotype is
      correctly reported but has since been re-interpreted (see PMID:23449919),
      which is why the phenazine process term keyed to it is marked as an
      over-annotation rather than the reference being faulted.
- id: PMID:23449919
  title: The role of two Pseudomonas aeruginosa anthranilate synthases in tryptophan
    and quorum signal production.
  findings:
  - statement: >-
      The anthranilate made by PhnAB is the precursor of PQS, and the
      pyocyanin connection is indirect, through PQS-dependent induction of the
      phenazine genes.
    supporting_text: >-
      At the time it was believed that PhnAB generated anthranilate for
      pyocyanin production, but later work determined that anthranilate is
      instead a precursor for PQS production, which is required to induce genes
      for pyocyanin biosynthesis
  - statement: >-
      A phnAB deletion makes no detectable PQS under aromatic amino acid growth
      conditions, and PQS production is restored by feeding anthranilate.
    supporting_text: >-
      No detectable PQS was produced by Δ phnAB , indicating that PhnAB is the
      anthranilate synthase responsible for PQS production in the presence of
      phenylalanine and tyrosine
  - statement: >-
      The two anthranilate synthases of PAO1 differ in expression timing rather
      than in chemistry, which explains why they do not substitute for one
      another in vivo.
    supporting_text: >-
      At low cell densities PhnAB expression is low and TrpEG is the primary
      anthranilate synthase enzyme present.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached and read. This is the reference that
      settles the PhnAB role question and is cited by Swiss-Prot with
      ECO:0000269 for the FUNCTION and DISRUPTION PHENOTYPE lines.
