proposed_new_terms:
- proposed_name: 2-heptyl-3-hydroxy-4(1H)-quinolone biosynthetic process
  proposed_definition: >-
    The chemical reactions and pathways resulting in the formation of
    2-heptyl-3-hydroxy-4(1H)-quinolone (the Pseudomonas quinolone signal, PQS),
    an alkyl quinolone signalling molecule made from anthranilate and a
    beta-keto fatty acid.
  justification: >-
    GO has the molecular function GO:0102164 2-heptyl-3-hydroxy-4(1H)-quinolone
    synthase activity but no process term for quinolone-signal biosynthesis.
    Without one, the genes that supply this pathway - phnAB for anthranilate,
    the pqsABCDE operon, pqsH - can only be annotated to the downstream
    phenazine process they induce, which is what produced the over-annotation
    reviewed here.
  proposed_parent:
    id: GO:0044550
    label: secondary metabolite biosynthetic process
  supported_by:
  - reference_id: file:PSEAE/phnB/phnB-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      anthranilate, a precursor for Pseudomonas quinolone signal
  - reference_id: PMID:23449919
    supporting_text: >-
      Based on its organization in an operon and quinolone-dependent
      regulation, PhnAB has probably evolved to generate anthranilate for
      quinolone biosynthesis
suggested_questions:
- question: >-
    Should the GO:0002047 IBD at PTN000230115 be removed, given that six of its
    seven leaves are TrpG/TrpGD proteins of organisms that make no phenazines
    and that the seed phenotype acts through PQS signalling?
- question: >-
    Should the GO:0004048 IBD at PTN000230115 be moved down to the TrpGD fusion
    clade, so that standalone TrpG subunits no longer inherit an activity whose
    domain they lack?
- question: >-
    Is anthranilate supplied by PhnAB channelled to PqsA, or does it mix with
    the kynurenine-derived pool? The two routes are regulated differently and
    dominate under different conditions.
suggested_experiments:
- description: >-
    Reconstitute purified PhnA and PhnB and measure anthranilate synthase
    kinetics with glutamine and with ammonia, alongside a PhnB catalytic-triad
    variant (C83A). This would convert the current in vivo complementation
    evidence into a direct demonstration of the subunit's amidotransferase
    contribution, and would let the EC number be supported experimentally for
    the P. aeruginosa enzyme rather than by similarity to E. coli TrpG.
