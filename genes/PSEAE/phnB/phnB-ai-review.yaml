id: P09786
gene_symbol: phnB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PhnB is the small, glutamine amidotransferase subunit (component II) of the
  second anthranilate synthase of Pseudomonas aeruginosa PAO1, encoded in the
  phnAB operon. It is a 200-residue protein consisting of a single class I
  (triad) glutamine amidotransferase domain with a Cys-His-Glu catalytic triad;
  it hydrolyses glutamine and channels the resulting ammonia to the large
  subunit PhnA, which condenses it with chorismate to give anthranilate. The
  two subunits form a heterotetramer. PAO1 carries a second, independently
  regulated anthranilate synthase, TrpEG, which serves tryptophan biosynthesis;
  the two enzymes are biochemically interchangeable but differ in regulation,
  PhnAB being expressed at higher cell density and not feedback-inhibited by
  tryptophan. The anthranilate PhnAB makes is the precursor of the
  4-quinolone signal PQS (2-heptyl-3-hydroxy-4-quinolone) and related alkyl
  quinolones; because PQS induces the phenazine operons, loss of phnAB lowers
  pyocyanin output indirectly. The phenazine ring itself is built from
  chorismate by PhzE through 2-amino-2-deoxyisochorismate and does not pass
  through anthranilate.
