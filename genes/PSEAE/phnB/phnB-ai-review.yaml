    Glutamine amidotransferase subunit of the PhnAB anthranilate synthase: it
    hydrolyses L-glutamine and delivers the ammonia to PhnA, which condenses it
    with chorismate to make anthranilate. The anthranilate produced by this
    enzyme is the precursor of the alkyl-quinolone signal PQS, and so, through
    PQS-dependent induction of the phz operons, of pyocyanin.
