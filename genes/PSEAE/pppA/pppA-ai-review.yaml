- term:
    id: GO:0050709
    label: negative regulation of protein secretion
  evidence_type: IMP
  original_reference_id: PMID:17558395
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP. PppA antagonises the PpkA signal that is required for H1-T6SS assembly
      and Hcp1 secretion.
    action: ACCEPT
    reason: >-
      PppA's dephosphorylation of the PpkA-Fha1 pathway restrains type VI secretion, which
      is the physiological role of this phosphatase. GO has no term for regulation of type
      VI secretion specifically, so this is the most specific available process.
    supported_by:
    - reference_id: PMID:17558395
      supporting_text: >-
        We show that a serine-threonine kinase, PpkA, is required for assembly of the H-T6SS
        and for secretion of Hcp1. PpkA activity is antagonized by PppA, a Ser-Thr phosphatase.
