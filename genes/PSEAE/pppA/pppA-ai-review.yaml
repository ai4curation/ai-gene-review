suggested_questions:
- question: >-
    Is Fha1 phospho-Thr362 the only physiological PppA substrate, or does PppA also
    dephosphorylate PpkA itself or other H1-T6SS components?
suggested_experiments:
- description: >-
    Measure dephosphorylation of purified PpkA-phosphorylated Fha1 (and autophosphorylated
    PpkA) by purified PppA and an active-site metal-ligand mutant, with Mn(2+) versus Mg(2+).
