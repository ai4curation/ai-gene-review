    summary: >-
      IBA from the 35-seed PP2C node PTN000352745. PppA appears among its own sources
      because of its own PseudoCAP IDA row, which is expected.
    action: ACCEPT
    reason: >-
      Core activity. The node is seeded by many experimentally characterised PP2C
      phosphatases from yeasts, plants, mammals and M. tuberculosis PstP (P9WHW5), so the
      IBD stands without this seed; the PPM domain and dinuclear Mn site are conserved in PppA.
