taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PppA (PA0075) is a 242-aa PP2C-family (PPM-type) serine/threonine protein phosphatase
  encoded in the Hcp secretion island I (H1-T6SS) cluster of Pseudomonas aeruginosa. Its
  crystal structure shows the bacterial PPM catalytic core with a dinuclear manganese
  centre and a flexible flap subdomain. PppA opposes the Ser/Thr kinase PpkA: PpkA
  phosphorylates the FHA-domain scaffold Fha1 to trigger assembly of the H1 type VI
  secretion apparatus and secretion of Hcp1, and PppA reverses this signal, so that
  PpkA and PppA have reciprocal effects on H1-T6SS activity. PppA thereby acts as a
  post-translational brake on type VI protein secretion.
references:
- id: PMID:17558395
  title: Threonine phosphorylation post-translationally regulates protein secretion
    in Pseudomonas aeruginosa.
  findings:
  - statement: PppA is a Ser/Thr phosphatase that antagonises PpkA; both act on Fha1
      with reciprocal effects on the H1-T6SS.
    supporting_text: >-
      PpkA activity is antagonized by PppA, a Ser-Thr phosphatase. These proteins exhibit
      reciprocal effects on the H-T6SS by acting on an FHA domain-containing protein, termed
      Fha1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0004722 row (seed of PTN000352745) and of the IMP
      GO:0050709 row. Cached copy is abstract-only and no PMC full text exists; the
      abstract names PppA as the Ser-Thr phosphatase antagonising PpkA on Fha1, which is
      consistent with both rows. The exact phosphatase assay was not read.
- id: PMID:31208722
  title: Crystal structure of PppA from Pseudomonas aeruginosa, a key regulatory component
    of type VI secretion systems.
  findings:
  - statement: PppA has a PPM core with a dinuclear manganese catalytic centre.
    supporting_text: >-
      PppA harbors a catalytic pocket containing two manganese ions which correspond to the
      canonical dinuclear metal center of Ser/Thr protein phosphatases including the bacterial
      PPM phosphatases and human PP2C.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. Structure (PDB 6JKV) supports the PP2C-type activity and Mn binding.
