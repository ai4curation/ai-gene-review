suggested_questions:
- question: >-
    Which of the two TatA paralogues and TatB subunits in P. aeruginosa assemble with TatC,
    and does the subunit stoichiometry of the receptor complex differ from the E. coli system?
suggested_experiments:
- description: >-
    Pull-down or BN-PAGE of tagged PAO1 TatC to define the composition of the TatBC receptor
    complex and its substrate-dependent association with TatA.
