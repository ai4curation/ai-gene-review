      The Tat system is required for PvdN export and pyoverdine production; tat mutants make
      no pyoverdine.
    supporting_text: export is Tat dependent
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Voulhoux et al. 2006). Abstract only (PMC full text not returned by
      the PubMed MCP). This is a tat-pathway phenotype paper (PvdN export, pyoverdine) rather
      than a direct study of TatC subunit composition; it is the PseudoCAP source for the
      GO:0033281 and GO:0008320 IMP rows. TatC's membership of the Tat complex and its transporter
      role are established by family assignment (HAMAP MF_00902), which the paper's tat-dependence
      data are consistent with.
