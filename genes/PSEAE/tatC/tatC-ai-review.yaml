id: Q9HUB3
gene_symbol: tatC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  TatC (PA5070) is the polytopic inner-membrane core subunit of the twin-arginine translocation
  (Tat) system of Pseudomonas aeruginosa. With six transmembrane helices, it forms, together
  with TatB, the receptor complex that recognises the twin-arginine motif of Tat signal peptides;
  substrate binding then recruits TatA to form the active translocon, which moves fully folded
  proteins across the cytoplasmic membrane using the proton motive force. In P. aeruginosa
  the Tat pathway exports many periplasmic and secreted proteins, among them the pyoverdine-biogenesis
  protein PvdN, so tat mutants fail to make pyoverdine.
