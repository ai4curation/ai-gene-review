- term:
    id: GO:0019645
    label: anaerobic electron transport chain
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002023662
  - UniProtKB:P37197
  review:
    summary: >-
      IBA from PTN002023662, seeded only by E. coli Ccp (P37197, EcoCyc IDA acts_upstream_of_or_within,
      PMID:28696311).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      E. coli Ccp is a membrane-associated quinol peroxidase that lets E. coli use H2O2 as a
      terminal electron acceptor during anaerobic growth. P. aeruginosa CcpA is a soluble
      periplasmic enzyme fed by cytochrome c551 and azurin, and its proposed role is peroxide
      protection. No study shows that CcpA serves as a terminal reductase of an anaerobic
      respiratory chain in P. aeruginosa. The transfer may be right (CcpA does accept electrons
      from respiratory-chain shuttles), but it is not established for this gene.
    supported_by:
    - reference_id: PMID:8591033
      supporting_text: >-
        The enzyme is located in the bacterial periplasm where its likely function is to provide
        protection against toxic peroxides.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
