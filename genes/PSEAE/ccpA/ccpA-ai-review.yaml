- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR009056
  - InterPro:IPR036909
  review:
    summary: InterPro2GO electron transfer activity from the cytochrome c-like domain signatures.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The mapping treats each cytochrome c-like domain as an electron carrier. In CcpA the
      high-potential heme does relay electrons, but only within the enzyme, from cytochrome c551
      or azurin to its own peroxidatic heme, as part of the peroxidase reaction captured by
      GO:0004130. CcpA is the electron acceptor of the shuttle proteins, not a carrier between two
      other partners.
    supported_by:
    - reference_id: PMID:8591033
      supporting_text: >-
        the other is a high-potential (+320 mV) centre which feeds electrons to the peroxidatic
        site from soluble electron-shuttle proteins such as cytochrome c and azurin.
