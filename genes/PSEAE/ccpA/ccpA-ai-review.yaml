suggested_questions:
- question: >-
    Does CcpA act as a terminal H2O2 reductase supporting growth or energy conservation in P.
    aeruginosa under low oxygen (as E. coli Ccp does), or only as a peroxide-protection enzyme?
suggested_experiments:
- description: >-
    Compare growth and H2O2 consumption of a PAO1 ccpA deletion with wild type under anaerobic
    nitrate-respiring and microaerobic conditions with added H2O2, and measure H2O2-dependent
    oxidation of reduced cytochrome c551 in periplasmic extracts.
