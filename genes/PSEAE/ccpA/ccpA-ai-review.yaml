        source_label: PTN002023662
        source_status: UNRESOLVED
        comment: >-
          Sole seed is E. coli Ccp, a quinol peroxidase with a different electron donor and
          membrane association; whether the respiratory role is ancestral to the clade that
          includes the soluble cytochrome c551 peroxidases is not shown.
      - source_id: UniProtKB:P37197
