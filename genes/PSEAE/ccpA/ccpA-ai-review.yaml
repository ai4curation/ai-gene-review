gene_symbol: ccpA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CcpA (PA4587) is the di-heme cytochrome c551 peroxidase of Pseudomonas aeruginosa, a soluble
  periplasmic enzyme made with a cleaved 23-residue signal peptide. It reduces hydrogen peroxide
  to water using electrons from the periplasmic electron shuttles cytochrome c551 and azurin. The
  mature 323-residue chain folds into two class-I cytochrome c-like domains, each holding a
  covalently bound heme c. The low-potential heme (about -330 mV, bis-His ligated) is the
  peroxidatic site where H2O2 is reduced, and the high-potential heme (about +320 mV, His-Met
  ligated) accepts electrons from the shuttle proteins and passes them to the peroxidatic heme. A
  calcium site at the domain interface stabilises the fold and inter-heme communication. The
  enzyme probably protects the cell against toxic peroxides in the periplasm.
