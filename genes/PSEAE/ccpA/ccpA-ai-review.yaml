- id: PMID:1657179
  title: Structural and functional features of Pseudomonas cytochrome c peroxidase.
  findings:
  - statement: >-
      Heme 1 has Lys in place of the cytochrome Met sixth ligand, lowering its redox potential and
      enabling peroxidatic activity; heme 2 has a cytochrome role; the two distal heme faces point
      toward each other, allowing inter-heme communication.
    supporting_text: >-
      From the present results we conclude that the two distal heme surfaces in the peroxidase are
      oriented toward each other.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Biochim Biophys Acta 1991, DOI 10.1016/0167-4838(91)90113-e); abstract only.
      Structure-function study of purified Pseudomonas CCP comparing the native enzyme with an
      elastase two-fragment complex. The PseudoCAP IDA for GO:0004130 is plausible; whether the
      activity was assayed in this paper is not visible in the abstract.
- id: PMID:8591033
  title: Crystal structure of the di-haem cytochrome c peroxidase from Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Crystal structure of P. aeruginosa CCP at 2.4 A; two cytochrome c-like domains, each with a
      covalent c-heme; the low-potential heme is the peroxidatic site and the high-potential heme
      takes electrons from cytochrome c and azurin; periplasmic location.
    supporting_text: >-
      PsCCP is organized into two domains, both of them containing a covalent c-haem in a
      structure reminiscent of class 1 cytochromes c.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Structure 1995); abstract only.
