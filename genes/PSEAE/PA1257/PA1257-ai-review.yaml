- term:
    id: GO:0015184
    label: L-cystine transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000770175
  - UniProtKB:P0AFT2
  review:
    summary: >-
      IBA from PTN000770175, whose only seed is E. coli TcyL. PA1257 is not a seed. The only
      experimental data on PA1257 point to hydroxy-L-proline, not cystine. The topology (checked with
      panther_tree.py on 2026-11-05) shows an 18-leaf Proteobacteria SPECIATION node mixing permeases of
      several specificities, with PA1257 in a Pseudomonas-specific duplication (PTN002413080) and the
      cystine-specific seeds confined to the Enterobacteriaceae clade PTN002024099.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Substrate choice in binding-protein-dependent amino acid ABC systems is set largely by the
      periplasmic binding protein, and the PA1256-PA1257-PA1260 system is induced by, and needed
      for growth on, hydroxy-L-proline. The cystine specificity of TcyL is therefore not known to
      be inherited by this permease. Cystine transport by PA1257 has not been tested, so this is
      over-annotation rather than a refuted claim.
    supported_by:
    - reference_id: PMID:18833300
      supporting_text: >-
        Knockouts in these genes affected growth on hydroxy-L-proline as a carbon source, and expression
        of all three genes was induced by hydroxy-L-proline (Table 2 and 3).
    - reference_id: PMID:18833300
      supporting_text: >-
        three genes are part of a single operon (PA1256, PA1257 and PA1260) which was predicted to
        be involved in amino acid transport and instead found to be involved in Hydroxy-L-Proline
        transport
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000770175
        source_label: PTN000770175
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node carries an L-cystine IBD seeded only by E. coli TcyL, but it is an 18-leaf
          Proteobacteria SPECIATION clade of mixed specificity (two HORIZ_TRANSFER subtrees and three
          lineage-specific duplications). The target belongs to a hydroxyproline-induced operon with its
          own binding protein, so the specific substrate is not shared across the node.
      - source_id: UniProtKB:P0AFT2
        source_label: E. coli TcyL (EcoCyc IDA/IGI)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Sound for TcyL itself.
    source_defects:
    - defect_type: OTHER
      resource: GO_CENTRAL
      record: PANTHER:PTN000770175
      requested_change: CHECK
      asserted_value: GO:0015184
      confidence: CONFIRMED
      corrected_value: GO:0015424
      corrected_label: ABC-type amino acid transporter activity
      explanation: >-
        The IBDs for GO:0015184 L-cystine transmembrane transporter activity and GO:0015811 L-cystine
        transport at PTN000770175 rest on E. coli TcyL alone and propagate to P. aeruginosa PA1257
        (Q9I487). PA1257 is the permease of the PA1256-PA1257-PA1260 ABC system, which Johnson et
        al. 2008 (PMID:18833300) found necessary for growth on hydroxy-L-proline and induced by it.
        The topology was checked with projects/PSEUDOCAP/panther_tree.py on 2026-11-05 and confirms
        that the node spans permeases of different specificity. PTN000770175 is a SPECIATION node
        (Proteobacteria) with 18 leaves, all PTHR30614:SF0. Its children are three single-organism
        leaves (H. pylori HP_0939, N. meningitidis NMB0788, G. sulfurreducens GSU0799), a
        Bradyrhizobium DUPLICATION (PTN002826367, 2 leaves) and a Gammaproteobacteria SPECIATION clade
        (PTN000770168, 13 leaves). That clade is itself heterogeneous: two HORIZ_TRANSFER subtrees
        (PTN008625440, 4 leaves, carrying B. subtilis TcyB and B. cereus BC_0873 cystine permeases plus
        H. influenzae HI_1079; PTN008625441, 2 leaves, B. subtilis YxeN and V. cholerae VC_0009), a
        Pseudomonas-specific DUPLICATION (PTN002413080, 3 leaves: PA1257, PA1258 and PA0313, the latter
        annotated as the YecS L-cysteine system permease), and an Enterobacteriaceae SPECIATION clade
        (PTN002024099, 4 leaves). Every cystine/YecS-named enterobacterial member - the seed TcyL
        (P0AFT2), Salmonella YecS (Q7CQB5) and STM1636 (Q8ZPA0), Yersinia YecS (A0A380PDF6) - falls
        inside PTN002024099: `--contains P0AFT2,Q7CQB5,A0A380PDF6,Q8ZPA0` returns exactly that node.
        The cystine-specific support therefore stops at PTN002024099, while PA1257 sits two duplication
        events away in a clade whose members include the hydroxyproline permeases.
        Please move both cystine IBDs down to PTN002024099 and, if a term is wanted at PTN000770175,
        use the broader GO:0015424 ABC-type amino acid transporter activity (with GO:0006865 amino acid
        transport for the process), which the mixed composition of the node does support. This defect
        covers the GO:0015811 row as well.
      supported_by:
      - reference_id: PMID:18833300
        supporting_text: >-
          Knockouts in these genes affected growth on hydroxy-L-proline as a carbon source, and expression
          of all three genes was induced by hydroxy-L-proline (Table 2 and 3).
