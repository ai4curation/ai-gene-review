knowledge_gaps:
- gap_statement: >-
    The substrate range of the PA1256-PA1257-PA1260 transporter is unknown beyond the
    hydroxy-L-proline growth phenotype: direct uptake, stereoisomer preference (trans-4- versus
    cis-4- or 3-hydroxyproline) and any cystine transport, as by its E. coli relative TcyL, have
    not been measured.
  gap_kind:
  - BIOLOGY
suggested_experiments:
- description: >-
    Measure uptake of radiolabelled trans-4-hydroxy-L-proline, L-proline and L-cystine in PAO1,
    the PA1257 mutant and the complemented mutant, and test binding of these substrates by
    purified PA1260.
