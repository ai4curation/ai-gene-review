id: Q9I487
gene_symbol: PA1257
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1257 is the integral inner-membrane permease subunit of a polar-amino-acid ABC transporter
  of Pseudomonas aeruginosa PAO1, with four predicted transmembrane helices and the
  binding-protein-dependent transport (ABC_TM1) domain. It is encoded in an operon with the
  ATP-binding subunit PA1256 and the periplasmic substrate-binding protein PA1260. Transposon
  mutants in each of these three genes grow poorly on hydroxy-L-proline as sole carbon source but
  not on L-proline, and the operon is induced by hydroxy-L-proline, so the system is a
  hydroxyproline importer that feeds the bacterium's hydroxyproline catabolic pathway. Whether
  it also takes up other amino acids, such as the cystine carried by its closest E. coli
  relative TcyL, has not been tested.
references:
- id: PMID:18833300
  title: High-throughput phenotypic characterization of Pseudomonas aeruginosa membrane
    transport genes.
  findings:
  - statement: PA1256, PA1257 and PA1260 form a predicted ABC amino acid transporter operon.
    supporting_text: >-
      PA1256, PA1257 and PA1260 are all components of a predicted ABC amino acid transporter encoded
      in a putative operon along with two hypothetical genes.
  - statement: Knockouts are defective for growth on hydroxy-L-proline and the genes are induced
      by it, but not by L-proline.
    supporting_text: >-
      Knockouts in these genes affected growth on hydroxy-L-proline as a carbon source, and expression
      of all three genes was induced by hydroxy-L-proline (Table 2 and 3).
  - statement: The phenotype is specific to hydroxy-L-proline.
    supporting_text: >-
      There was no growth defect on L-proline, nor was expression affected by L-proline as an inducer,
      suggesting specificity for hydroxy-L-proline.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the GO:0034589 IMP row that seeds PTN000770157 (GO:0006865). Full text
      cached and read. Biolog phenotype screen of sequenced, PCR-confirmed Mini-Tn5 mutants plus
      qRT-PCR induction; PA1257 is in the PAO1 background. No direct uptake assay. Seed verdict
      SOUND.
