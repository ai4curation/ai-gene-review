      proteolysis.
- id: PMID:15853892
  title: DksA represses ribosomal gene transcription in Pseudomonas aeruginosa by interacting with RNA
    polymerase on ribosomal promoters.
  findings:
  - statement: DksA represses rRNA transcription, binds rRNA promoters with RNAP in vivo and co-purifies
      with RNAP.
    supporting_text: The binding to rRNA promoters specifically increases during stringent response, and
      correlates with the binding of RNAP to these regions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cited by PseudoCAP for GO:0045892 (IMP), the sole seed of the PTN002139169 IBD. Abstract
      only in the cache; the abstract alone supports the annotation.
- id: PMID:21255113
  title: Role of a Zn-independent DksA in Zn homeostasis and stringent response.
  findings:
  - statement: The paralog DksA2 (PA5536) lacks the zinc finger, is Zur-repressed, and can replace DksA in
      vivo; in vitro assays use DksA2 with E. coli RNAP.
    supporting_text: DksA2 can functionally substitute for the canonical DksA in vivo in Escherichia coli and
      P. aeruginosa
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: Cited by PseudoCAP for GO:0070063 (IDA) on PA4723. Full text cached; biochemistry is on
      DksA2, so it supports RNAP binding for the paralog rather than directly for PA4723.
- id: PMID:18203836
  title: Proteomic, microarray, and signature-tagged mutagenesis analyses of anaerobic Pseudomonas aeruginosa
    at pH 6.5, likely representing chronic, late-stage cystic fibrosis airway conditions.
  findings:
  - statement: dksA was required for anaerobic nitrate and nitrite respiration in an STM screen.
    supporting_text: the cysG and dksA genes were found to be required for both anaerobic NO(3)(-) and
      NO(2)(-) respiration
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Cited by PseudoCAP for GO:1901857 (IMP). Abstract only; a screen hit, not mechanism.
