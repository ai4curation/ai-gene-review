taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: dksA (PA4723) encodes the canonical RNA polymerase-binding transcription factor DksA of
  Pseudomonas aeruginosa, a small protein with an N-terminal coiled-coil and a C4 zinc finger. DksA does
  not bind DNA itself; it associates with RNA polymerase and, together with the alarmone (p)ppGpp,
  changes the kinetics of transcription initiation at target promoters. In P. aeruginosa it represses
  ribosomal RNA transcription in growing and starved cells, and it is found with RNA polymerase on rRNA
  promoters. Through these global effects it influences quorum-sensing signal production, virulence
  factor output, anaerobic respiration and antibiotic tolerance. A zinc-independent paralog, DksA2
  (PA5536), can substitute for it under zinc limitation.
