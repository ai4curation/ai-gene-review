- term:
    id: GO:0045861
    label: negative regulation of proteolysis
  evidence_type: IDA
  original_reference_id: PMID:11160083
  qualifier: involved_in
  review:
    summary: PseudoCAP IDA from the paper in which multicopy dksA suppressed elastase production. Not a
      PAINT seed.
    action: REMOVE
    reason: The paper shows that overexpressed dksA lowers production of the secreted protease elastase, and
      the authors conclude that this is indirect, via reduced rhlI transcription and C4-HSL signal. Reduced
      production of a protease is not regulation of proteolysis, and the effect is not exerted by DksA on
      that process.
    supported_by:
    - reference_id: PMID:11160083
      supporting_text: It therefore appears that dksA does not inhibit the expression of lasB and rhlAB
        directly but affects both elastase and rhamnolipid production indirectly by the inhibition of rhlI
        transcription, leading to reduced C 4 -HSL levels.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      requested_change: DELETE_ROW
      asserted_value: GO:0045861
      cause: OTHER
      confidence: PROBABLE
      explanation: GO:0045861 negative regulation of proteolysis (IDA, PMID:11160083) for dksA PA4723
        records that multicopy dksA reduced elastase production. That is decreased production of a secreted
        protease, which the authors attribute to indirect inhibition of rhlI transcription; it is not
        regulation of proteolysis. Please remove the row.
      supported_by:
      - reference_id: PMID:11160083
        supporting_text: In trans, dksA suppressed the elastase production of mutant PR1-E4 and reduced the
          rhamnolipid production of both PR1-E4 and PAO1.
