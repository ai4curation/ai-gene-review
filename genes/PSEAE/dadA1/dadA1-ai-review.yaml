  label: Pseudomonas aeruginosa PAO1
description: >-
  DadA1 (PA5304; also called DadA) is the FAD-dependent D-amino acid dehydrogenase of Pseudomonas
  aeruginosa PAO1, encoded in the dadAX operon with the alanine racemase DadX and controlled by the
  Lrp-family regulator DadR, which responds to L-alanine. The purified recombinant enzyme alone oxidatively
  deaminates a very broad range of D-amino acids (all tested except D-glutamate and D-glutamine)
  to the corresponding 2-oxo acids, with similar kcat and Km on D-alanine, D-histidine, D-phenylalanine
  and others. A dadA1 mutant cannot use L-alanine, D-alanine and a set of other D-amino acids as
  nitrogen source, placing DadA1 at the centre of alanine and D-amino acid catabolism; with DadX
  it converts L-alanine via D-alanine to pyruvate. By homology to E. coli DadA it is a membrane-associated
  enzyme that passes electrons to the respiratory chain.
