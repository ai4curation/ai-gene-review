      PubMed MCP). The abstract states direct promoter binding and activation plus gene-disruption
      phenotypes for PA4778 itself, which is what the PseudoCAP IMP positive-regulation row
      (seed of the PTN001575588 and PTN001249777 IBDs) rests on.
