core_functions:
- description: >-
    Copper(I)-responsive MerR-family transcription factor. Cu(+)-loaded CueR binds the promoters
    of copper-resistance genes (flcABCDE, copZ1, mexPQ-opmE, copZ2, cueA) and activates their
    transcription, and represses the H2-T6SS/azurin copper-acquisition genes, maintaining
    copper homeostasis.
