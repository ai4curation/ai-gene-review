gene_symbol: cueR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CueR (PA4778) is the MerR-family copper(I)-sensing transcriptional regulator of Pseudomonas
  aeruginosa. It has an N-terminal winged helix-turn-helix DNA-binding domain and a C-terminal
  metal-binding region, forms dimers and tetramers, and is metallated by Cu(+) handed over
  from the CopZ1 and CopZ2 chaperones. Copper-loaded CueR binds directly to the promoters
  of its targets and activates five transcriptional units (flcABCDE, copZ1, mexPQ-opmE, copZ2
  and cueA), which together protect the cell against copper toxicity; cueR mutants are copper
  sensitive. Under copper-rich conditions it also represses the H2 type VI secretion system
  and the azurin/OprC copper uptake genes. cueR itself is activated by the quorum-sensing
  regulator LasR, linking copper homeostasis to the quorum response.
