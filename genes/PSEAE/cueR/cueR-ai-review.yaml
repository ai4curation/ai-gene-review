suggested_questions:
- question: >-
    Does P. aeruginosa CueR repress the H2-T6SS and azu/oprC genes by the same DNA-distortion
    mechanism by which it activates the copper-resistance promoters, or through a different
    operator architecture?
suggested_experiments:
- description: >-
    In vitro transcription with purified apo- and Cu(+)-CueR on the cueA and H2-T6SS promoters,
    to separate direct activation from direct repression and to assign the DNA-binding transcription
    activator and repressor activities individually.
