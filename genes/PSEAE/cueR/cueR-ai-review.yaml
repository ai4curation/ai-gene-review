  title: Quorum-sensing regulation of a copper toxicity system in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PA4778 (CueR) binds directly to and activates five promoters of copper resistance genes,
      and its disruption increases copper sensitivity.
    supporting_text: >-
      We also identify a putative PA4778 binding motif and show that the protein directly
      binds to and activates five promoters controlling the expression of 11 genes
  reference_review:
