    summary: AspS uses ATP during amino-acid activation.
    action: MODIFY
    reason: ATP binding is the supported nucleotide specificity and is already separately represented
      in this review. The nucleotide-binding claim is true but less informative; substrate-dependent catalysis
      and the curated synthetase architecture support the refinement.
