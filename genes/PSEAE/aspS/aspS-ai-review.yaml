id: Q51422
gene_symbol: aspS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: AspS is the non-discriminating aspartyl-tRNA synthetase of Pseudomonas aeruginosa PAO1. It
  forms Asp-tRNA(Asp) and the Asp-tRNA(Asn) intermediate used by GatCAB to generate Asn-tRNA(Asn). A tRNA-dependent
  association with GatCAB facilitates intermediate handoff; the bacterial GAD domain contributes to the
  dynamic architecture of this transamidosome.
