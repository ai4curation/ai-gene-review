      supporting_text: 'Aspartyl-tRNA synthetase with relaxed tRNA specificity since it is able to aspartylate
        not only its cognate tRNA(Asp) but also tRNA(Asn). Is 1.5 times more efficient at aminoacylating
        E.coli tRNA(Asp) over tRNA(Asn). Reaction proceeds in two steps: L-aspartate is first activated
        by ATP to form Asp-AMP and then transferred to the acceptor end of tRNA(Asp/Asn). {ECO:0000269|PubMed:16352843}.'
