  review:
    summary: PseudoCAP IMP; sole seed of the GO:1900705 IBD at PTN002112483 and co-seed (with Zur/np20) of the GO:1900376
      IBD at PTN002112386.
    action: ACCEPT
    reason: Fur point mutants (H86R, H86Y) overproduce siderophores even in iron-replete media, and the mutant Fur
      proteins bind the pvdS promoter with reduced affinity; purified Fur-Fe(II) recognises the pvdS and pchR promoters.
      Fur therefore does the regulatory work itself, as the repressor of the pathway activators. This is a direct
      regulatory role, not a downstream phenotype. Abstract only in the cache.
