id: Q03456
gene_symbol: fur
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: fur (PA4764) encodes the ferric uptake regulator of Pseudomonas aeruginosa, an essential homodimeric
  Fur-family metalloregulator with a structural zinc site and a regulatory iron site. Loaded with Fe(II) under iron-replete
  conditions, Fur binds Fur-box operators overlapping the promoters of at least 24 genes and represses them. Its
  targets include pvdS and pchR, the activators of pyoverdine and pyochelin siderophore synthesis, the haem-uptake
  loci phu and has, siderophore receptor and sigma-factor genes, the fagA-fumC-orfX-sodA operon, and the PrrF1/PrrF2
  small RNAs, whose iron-limitation induction indirectly down-regulates iron-using and iron-storage genes. Through
  this network Fur couples iron status to iron acquisition, oxidative-stress defence, central metabolism and exotoxin
  A expression.
