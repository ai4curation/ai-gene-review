      biogenesis starts in the cytoplasm, where non-ribosomal peptide synthetases (NRPSs) such
      as PvdL 18, PvdI 19 and PvdD 2021 (depending on the strain) assemble an initially acylated
      ferribactin, the peptide precursor for
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Ringel & Bruser 2018), full text cached. Cited here for what the pathway
      requires - cytoplasmic NRPSs that build the peptide chain - and not as evidence that this
      locus is one of them. The review names the synthetases by gene symbol only; it does not
      give locus tags, which is exactly the link this review cannot establish. Marked VERIFIED
      for the claim it is actually used for.
