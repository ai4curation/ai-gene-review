existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027533
  - InterPro:IPR001242
  review:
    summary: >-
      The root molecular-function term, from a combined mapping that cites both an ARBA rule and
      the condensation-domain signature IPR001242. The signature half of that pair is good
      support, and it supports something far more specific than "catalytic".
    action: MODIFY
    reason: >-
      The claim is true but the row stops at the root of the molecular-function branch, which
      says nothing a reader could use. This row's own cited evidence supports the deeper term:
      IPR001242 is the condensation domain, the domain that forms the peptide bond in a
      non-ribosomal peptide synthetase, and it does not occur outside that enzyme class. The
      record adds four adenylation domains, carrier domains with their phosphopantetheine
      attachment site, and a match to the NRPS synthetase signature itself - the full set of
      modules the activity requires. GO:1904091 non-ribosomal peptide synthetase activity is a
      descendant of catalytic activity, so this is a refinement rather than a lateral change,
      and it is the same replacement the merged pvdJ and pvdL reviews make for their equivalent
      rows, which keeps the three NRPSs of this cluster consistent. Note what is deliberately
      not claimed: a synthetase activity, not any particular product.
    proposed_replacement_terms:
    - id: GO:1904091
      label: non-ribosomal peptide synthetase activity
    supported_by:
    - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
      reference_section_type: DATABASE_ENTRY
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR001242; Condensation_dom.
    - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
      reference_section_type: DATABASE_ENTRY
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; TIGR01733; AA-adenyl-dom; 4.
    - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
      reference_section_type: DATABASE_ENTRY
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR010060; NRPS_synth.
- term:
    id: GO:0031177
    label: phosphopantetheine binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR020806
  review:
    summary: >-
      InterPro2GO row from the carrier-domain signature. This is the one row on the gene whose
      mapping is tight: the signature is a phosphopantetheine-binding domain and the term is
      phosphopantetheine binding.
    action: ACCEPT
    reason: >-
      Sound and as precise as the term set allows. The carrier domains of an NRPS are loaded
      with a phosphopantetheine arm, which is what tethers the growing peptide between modules,
      and the record carries both the carrier-domain signature and the attachment-site signature
      that makes it functional. A signature match is valid computational evidence under the
      project rules, so this needs no experimental backing to stand. It is a real part of how the
      enzyme works rather than a peripheral property, and it is kept as a cofactor-binding
      contribution to the core activity rather than being treated as the core activity itself.
    supported_by:
    - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
      reference_section_type: DATABASE_ENTRY
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR020806; PKS_PP-bd.
    - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
      reference_section_type: DATABASE_ENTRY
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR006162; Ppantetheine_attach_site.
- term:
    id: GO:0043041
    label: obsolete amino acid activation for nonribosomal peptide biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00084820
  review:
    summary: >-
      An obsolete term, carried by an ARBA rule. The biology it describes - adenylating amino
      acids for incorporation into a non-ribosomal peptide - is exactly what the four adenylation
      domains do, so the row needs a live replacement rather than deletion.
    action: MODIFY
    reason: >-
      The term is obsolete, so it cannot stay as it is, and the underlying claim is well
      supported by the record's four TIGR01733 adenylation-domain matches. GO:0019184
      nonribosomal peptide biosynthetic process is the live term for the process this enzyme
      carries out; it was checked in OLS and is current. The replacement is deliberately
      shallower than it could be, and that is the substantive judgement in this review. The
      merged pvdD, pvdJ and pvdL reviews all place their equivalent rows at GO:0002049 pyoverdine
      biosynthetic process, and the obvious move would be to do the same here, since this locus
      sits inside the pvd cluster two genes beyond pvdJ (PA2400), itself adjacent to pvdD
      (PA2399), and the pathway
      literature names three peptide-chain synthetases. But that step depends entirely on
      identifying this locus as pvdI, and no machine-readable source makes that link: UniProt
      gives only an ordered locus name with no gene symbol, GOA's symbol is the locus tag, and
      the KEGG and PseudoCAP cross-references agree. The project rule against guessing
      identifiers applies to gene symbols as much as to term ids, so the replacement asserts
      only what the architecture shows on its own - that this protein makes a non-ribosomal
      peptide - and the identification is raised as a question instead. If a curator confirms
      the locus is pvdI, this replacement should be deepened to GO:0002049 and a pyoverdine
      process row follows straightforwardly.
    proposed_replacement_terms:
    - id: GO:0019184
      label: nonribosomal peptide biosynthetic process
    supported_by:
    - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
      reference_section_type: DATABASE_ENTRY
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; TIGR01733; AA-adenyl-dom; 4.
    - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
      reference_section_type: DATABASE_ENTRY
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR010060; NRPS_synth.
- term:
    id: GO:0044550
    label: secondary metabolite biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00029064
  review:
    summary: >-
      ARBA row asserting that the enzyme's product is a secondary metabolite. Broad, but it is a
      separate branch from the nonribosomal-peptide term, not an ancestor of it.
    action: ACCEPT
    reason: >-
      Kept rather than refined, and not treated as too general. The two process claims on this
      gene are independent: GO:0019184 says the product is made without a ribosome, while
      GO:0044550 says the product is a secondary metabolite, and the ancestors of GO:0019184 were
      checked in OLS and do not include GO:0044550, so neither term entails the other and
      removing this one would lose a real claim. It is also as precise as the available evidence
      allows: naming the product - pyoverdine, which would license GO:0002049 - is exactly the
      step the missing gene symbol blocks, as set out on the row above. Multi-module NRPSs of
      this kind characteristically make secondary metabolites, which is why this mapping is sound
      even from architecture alone, and the claim becomes no more specific by restating it.
    supported_by:
    - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
      reference_section_type: DATABASE_ENTRY
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR010060; NRPS_synth.
core_functions:
- description: >-
    Multi-module non-ribosomal peptide synthetase: adenylates and condenses amino acids into a
    peptide product on phosphopantetheinylated carrier domains. The product is a secondary
    metabolite, very likely the pyoverdine peptide chain given the gene's position in the pvd
    cluster, but the review stops short of naming it.
  molecular_function:
    id: GO:1904091
    label: non-ribosomal peptide synthetase activity
  directly_involved_in:
  - id: GO:0019184
    label: nonribosomal peptide biosynthetic process
  - id: GO:0044550
    label: secondary metabolite biosynthetic process
  supported_by:
  - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
    reference_section_type: DATABASE_ENTRY
    record_section: ["DR:InterPro"]
    supporting_text: DR   InterPro; IPR001242; Condensation_dom.
  - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
    reference_section_type: DATABASE_ENTRY
    record_section: ["DR:NCBIfam"]
    supporting_text: DR   NCBIfam; TIGR01733; AA-adenyl-dom; 4.
  - reference_id: file:PSEAE/PA2402/PA2402-uniprot.txt
    reference_section_type: DATABASE_ENTRY
    record_section: ["DR:InterPro"]
    supporting_text: DR   InterPro; IPR006162; Ppantetheine_attach_site.
  knowledge_gaps:
  - gap_statement: >-
      Which amino acids the four adenylation domains select, and in what order they are
      incorporated, is unknown. No substrate specificity has been determined for any module of
      this protein, so the peptide it makes cannot be predicted from the sequence with
      confidence, and the enzyme has never been assayed.
    gap_kind:
    - BIOLOGY
  locations: []
suggested_questions:
- question: >-
    Is PA2402 the gene the pyoverdine literature calls pvdI? The identification is widely used in
    the field and the locus position supports it - PA2402 lies two genes beyond pvdJ (PA2400),
    which is itself adjacent to pvdD (PA2399), and both of those are reviewed pyoverdine
    synthetases - but no machine-readable record links the
    symbol to this locus tag. UniProt carries no gene name for the entry at all. Resolving this
    would let the process rows be deepened to pyoverdine biosynthetic process and would give the
    entry a symbol; it is a curation question rather than an experimental one.
- question: >-
    What are the adenylation-domain specificities, and does the predicted module order match the
    known pyoverdine peptide chain? If it does, that is independent evidence for the pvdI
    identification above, obtained without relying on the gene symbol.
suggested_experiments:
- description: >-
    Delete PA2402 and assay pyoverdine production and structure. A 5149-residue enzyme in the
    middle of the pvd cluster has no experimental annotation of any kind despite several
    published pvd mutagenesis surveys, so the simplest experiment in the pathway has either not
    been done on this locus or has not reached the annotation record.
- description: >-
    Determine the adenylation-domain substrate specificities in vitro, by the standard
    ATP-pyrophosphate exchange or hydroxamate assay across an amino-acid panel, and compare the
    inferred module order with the pyoverdine peptide sequence.
