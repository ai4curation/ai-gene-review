id: Q9I179
gene_symbol: PA2402
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2402 is a 5149-residue non-ribosomal peptide synthetase of Pseudomonas aeruginosa, encoded
  within the pyoverdine biosynthetic cluster, two genes beyond pvdJ. Its domain architecture is
  that of a multi-module assembly line: four amino-acid adenylation domains, condensation
  domains, phosphopantetheine-attachment carrier domains and a C-terminal thioesterase-like
  region, which together specify the stepwise incorporation of amino acids into a peptide
  product without a ribosome. The pyoverdine literature identifies the main peptide-chain
  synthetases of this cluster as PvdI, PvdJ and PvdD, but no machine-readable record assigns a
  gene symbol to this locus, and the protein itself has no experimental characterisation: every
  annotation it carries is electronic.
