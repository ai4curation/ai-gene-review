  label: Pseudomonas aeruginosa PAO1
description: >-
  TpbB (also called YfiN; PA1120) is an inner-membrane diguanylate cyclase with two
  transmembrane helices flanking a periplasmic sensory domain, followed by cytoplasmic HAMP
  and GGDEF domains. It condenses two GTP into cyclic di-GMP. It is the output enzyme of the
  YfiBNR tripartite module: the periplasmic protein YfiR binds and inhibits it, and the
  outer-membrane lipoprotein YfiB relieves the inhibition by sequestering YfiR. The tyrosine
  phosphatase TpbA also restrains its activity. The c-di-GMP made by TpbB stimulates Pel and
  Psl exopolysaccharide production, giving the small colony variant phenotype, biofilm
  formation and persistence in infection models. Unlike many diguanylate cyclases, it is not
  feedback-inhibited by its product, and the HAMP domain is needed for dimerisation and
  catalysis.
