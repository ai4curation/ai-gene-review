      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0016757
      corrected_value: GO:0016780
      corrected_label: phosphotransferase activity, for other substituted phosphate groups
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The PseudoCAP IMP row codes WbpL to GO:0016757 glycosyltransferase activity. The
        abstract of PMID:9680202 shows WbpL is a WecA homologue that adds Fuc2NAc (or GlcNAc or
        GalNAc) to undecaprenyl phosphate. WecA-family enzymes transfer a sugar-1-phosphate
        from a UDP-sugar (EC 2.7.8.33 class), which GO places under GO:0016780, not under
