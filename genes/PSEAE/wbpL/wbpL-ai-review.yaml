  review:
    summary: >-
      PseudoCAP row. WbpL is a WecA homologue that adds the first sugar to undecaprenyl
      phosphate, as a sugar-1-phosphate (from a UDP-sugar).
    action: MODIFY
    reason: >-
      The family is called "glycosyl transferase 4" in Pfam, but the reaction of WecA-type
      enzymes (EC 2.7.8.33) is sugar-1-phosphate transfer to Und-P. GO places that under
      GO:0016780 phosphotransferase activity, for other substituted phosphate groups (as for
      WecA), not under glycosyltransferase activity. GO:0016780 is already on this gene.
    proposed_replacement_terms:
    - id: GO:0016780
      label: phosphotransferase activity, for other substituted phosphate groups
