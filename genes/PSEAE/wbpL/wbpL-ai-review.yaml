product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WbpL (PA3145) is a polytopic inner-membrane sugar-1-phosphate transferase of the WecA/MraY
  family (Pfam PF00953). It initiates O-antigen synthesis by transferring an
  N-acetylhexosamine-1-phosphate from a UDP-sugar to the lipid carrier undecaprenyl phosphate,
  giving the first sugar of the repeat unit. It is bifunctional: it starts the B-band
  (O-specific antigen) with Fuc2NAc and the A-band (common polysaccharide antigen) D-rhamnan
  with GlcNAc or GalNAc. wbpL mutants make neither form of O antigen, and E. coli WecA can
  substitute for it.
