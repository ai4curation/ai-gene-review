  label: Pseudomonas aeruginosa PAO1
description: 'CysM (PA0932, cysteine synthase B) is one of the two main pyridoxal 5''-phosphate-dependent
  O-acetylserine sulfhydrylases of Pseudomonas aeruginosa. The soluble homodimeric enzyme condenses O-acetyl-L-serine
  with bisulfide to form L-cysteine, and it also uses thiosulfate to form S-sulfo-L-cysteine, a reaction
  for which it is far more efficient than the CysK isoform (PA2709). CysK and CysM are partially redundant
  for de novo cysteine synthesis: under the tested minimal-medium conditions, single mutants remain prototrophic
  while the double mutant exhibits cysteine auxotrophy, while cysM loss impairs growth most strongly when
  thiosulfate is the sole sulfur source.'
