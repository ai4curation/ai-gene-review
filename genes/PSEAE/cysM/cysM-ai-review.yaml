suggested_questions:
- question: How is S-sulfocysteine made by CysM converted to cysteine in P. aeruginosa, and which reductant
    or enzyme performs that step?
- question: Which alternative sulfur-assimilation route lets the cysM mutant grow slowly on thiosulfate,
    given that CysK cannot use thiosulfate efficiently?
suggested_experiments:
- description: Track 34S-thiosulfate into S-sulfocysteine and cysteine in wild type, cysM, cysK and cysK
    cysM strains, and screen for the S-sulfocysteine reductase by metabolite profiling of candidate thioredoxin/glutaredoxin
    mutants.
  experiment_type: isotope tracing and genetic screen
