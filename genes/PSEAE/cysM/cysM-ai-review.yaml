- id: PMID:41541697
  title: 'De novo cysteine biosynthesis in Pseudomonas aeruginosa: Characterization of the two main cysteine
    synthase isoforms.'
  findings:
  - statement: PA0932 (CysM) uses both bisulfide and thiosulfate with O-acetyl-L-serine.
    supporting_text: PA2709 is reactive only with the OAS+bisulfide substrate couple, while PA0932 is
      reactive with both OAS+bisulfide and OAS+thiosulfate couples.
    reference_section_type: RESULTS
  - statement: CysK and CysM are redundant for cysteine prototrophy.
    supporting_text: Deletion of either one of the two genes does not lead to cysteine auxotrophy, which
      is reached only with the double deletion mutant.
    reference_section_type: ABSTRACT
  - statement: PA0932 is classified as an OAS-dependent S-sulfocysteine synthase (EC 2.5.1.144).
    supporting_text: while PA0932 is also a S-sulfocysteine synthase (O-acetyl-L-serine-dependent) (EC
      2.5.1.144)
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. Direct biochemistry (substrate specificity, kinetics, size
      exclusion) and deletion genetics on PA0932 itself.
- id: PMID:41676964
  title: Distinct contributions of O-acetylserine sulfhydrylases to cysteine biosynthesis in Pseudomonas
    aeruginosa.
  findings:
  - statement: PaCysM is far more efficient than PaCysK with thiosulfate.
    supporting_text: An even more pronounced difference was observed with thiosulfate, with PaCysM reaching
      a catalytic efficiency of 9.5
    reference_section_type: RESULTS
  - statement: PaCysM is specialized for thiosulfate utilization in vivo.
    supporting_text: Growth phenotypes further indicated that PaCysK primarily supports sulfide‐dependent
      cysteine biosynthesis, whereas PaCysM is specialized for thiosulfate utilization, consistent with
      their distinct catalytic properties.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Recombinant assays explicitly use Q9I526 with an N-terminal His
      tag in E. coli Rosetta(DE3); native single/double deletions use PAO1 PA0932/PA2709. Product profiling
      and substrate kinetics distinguish sulfide-dependent cysteine synthesis from thiosulfate-dependent
      S-sulfocysteine formation. An abstract shorthand about cysteine formation from thiosulfate must
      not replace the directly resolved reaction product.
