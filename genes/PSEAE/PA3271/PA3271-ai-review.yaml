suggested_questions:
- question: >-
    Which HPt protein and response regulator receive phosphate from MxtR, given that it lacks an HPt domain
    and is an orphan kinase?
- question: >-
    Does the N-terminal SSF (SLC5) domain of MxtR transport a solute, or does it serve only as a sensory
    module?
suggested_experiments:
- description: >-
    Test in vitro phosphotransfer from MxtR to candidate HPt proteins and response regulators, and assay
    transport by the isolated SSF domain in proteoliposomes.
