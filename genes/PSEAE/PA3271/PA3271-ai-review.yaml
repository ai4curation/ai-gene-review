- term:
    id: GO:0009927
    label: histidine phosphotransfer kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001976860
  - SGD:S000001409
  - UniProtKB:P39838
  review:
    summary: >-
      Histidine phosphotransfer (HPt) activity by IBA from PTN001976860, seeded by E. coli RcsD and yeast
      S000001409. MxtR has no HPt domain.
    action: REMOVE
    reason: >-
      GO:0009927 describes the phospho-His intermediate (HPt) that shuttles phosphate from a hybrid kinase's
      receiver to a response regulator. RcsD carries such a domain. MxtR's domain content (InterPro, Pfam,
      SMART: SSF, PAS, HisKA, HATPase_c, REC) has no HPt module, so it cannot be its own phosphotransfer
      intermediate and must pass phosphate to an unidentified HPt or regulator. The node term does not
      suit the HPt-less members of the clade. The node-level GO_CENTRAL defect for this IBD is recorded
      once, on PA1611 (genes/PSEAE/PA1611), which receives the same IBA and also lacks an HPt domain.
    supported_by:
    - reference_id: file:PSEAE/PA3271/PA3271-uniprot.txt
      record_section: ["DR:SMART"]
      supporting_text: SMART; SM00448; REC; 1.
    propagation_review:
