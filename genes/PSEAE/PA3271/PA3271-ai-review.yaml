taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3271 (mxtR) encodes MxtR, an orphan hybrid sensor histidine kinase of the inner membrane. The protein
  has an N-terminal domain of 13 transmembrane helices belonging to the sodium:solute symporter (SSF,
  SLC5) family, then a PAS-like domain, a HisKA dimerisation/phosphoacceptor domain (His808), an HATPase_c
  catalytic domain and a C-terminal receiver domain (Asp1090). It has no histidine phosphotransfer (HPt)
  domain. MxtR autophosphorylates in vitro, and ubiquinone inhibits the autophosphorylation, which suggests
  that it senses the respiratory or redox state. Loss of mxtR induces the LysR-type regulator MexT and
  its MexEF-OprN efflux pump. This delays expression of the 2-alkyl-4-quinolone (AQ) biosynthetic genes
  and of AQ-dependent virulence factors, so MxtR links environmental sensing to quorum-sensing signal
  production.
