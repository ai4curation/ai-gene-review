      fatty acids.
    supporting_text: FadD1 of P. aeruginosa coupled CoASH to LCFA better than to SCFA or MCFA
  - statement: fadD1 mutants are defective in growth on fatty acids, most strongly on oleate, and are
      complemented by fadD1.
    supporting_text: fadD1 was found to be important for the metabolism of all FAs, particularly the
      unsaturated LCFA oleate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC2958839). PseudoCAP source for IDA GO:0006631 (a seed, with E. coli FadD, of
      the PTN001534887 IBD) and IDA GO:0042758. Purified recombinant FadD1 kinetics (Table 2), E.
      coli fadD complementation, and chromosomal mutant growth with complementation support both
      the long-chain fatty acid-CoA ligase activity and long-chain fatty acid catabolism.
