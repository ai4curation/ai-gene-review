taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FadD1 (PA3299) is a long-chain fatty acid--CoA ligase (acyl-CoA synthetase) of Pseudomonas
  aeruginosa that activates exogenous fatty acids as acyl-CoA thioesters, in an ATP-dependent
  two-step reaction through an acyl-adenylate, at the entry to beta-oxidation. Purified FadD1
  prefers long-chain substrates (oleate and palmitate), whereas its genetically linked paralog
  FadD2 (PA3300) prefers shorter chains. fadD1 mutants grow poorly on fatty acids, especially
  oleate, and on phosphatidylcholine, a main lipid of lung surfactant, and both fadD genes
  complement an E. coli fadD mutant. FadD1 is one of several FadD homologs that together let
  the bacterium use host lipids as nutrients during lung infection.
