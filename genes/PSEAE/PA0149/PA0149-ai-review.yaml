suggested_experiments:
- description: >-
    Screen candidate siderophores and metal carriers for induction of the PA0149 target TonB-dependent
    transducer promoter (lacZ or mCherry fusion) in wild type and a PA0149 deletion strain, then test
    uptake of the inducing carrier with 55Fe or other metal isotopes.
  experiment_type: reporter assay and isotope uptake
suggested_questions:
- question: >-
    What extracellular signal activates the PA0149 cell-surface signalling system, and what does its regulated
    TonB-dependent transducer import?
