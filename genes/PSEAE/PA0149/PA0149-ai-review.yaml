taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0149 is an extracytoplasmic function (ECF, group IV) sigma-70 family factor of Pseudomonas aeruginosa
  PAO1, with sigma region 2 and region 4 domains and membership of the FecI-like cell-surface signalling
  (CSS) subfamily. Like other CSS sigma factors it is expected to be kept inactive by a cognate cytoplasmic-membrane
  anti-sigma factor until an outer-membrane TonB-dependent transducer senses an extracellular signal,
  and then to direct RNA polymerase to its target promoters. Overexpression of PA0149 induced a regulon
  that includes a TonB-dependent transducer and putative (metal) transport genes; the inducing signal
  and the transported substrate are not known.
