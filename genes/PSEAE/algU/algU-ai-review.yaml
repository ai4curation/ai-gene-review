id: Q06198
gene_symbol: algU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AlgU (AlgT, sigma-22, PA0762) is the RpoE-like (sigma-E) extracytoplasmic function sigma
  factor of Pseudomonas aeruginosa and its principal cell-envelope stress sigma factor. In
  unstressed cells the inner-membrane anti-sigma factor MucA sequesters it, helped by periplasmic
  MucB. Cell wall stress triggers regulated intramembrane proteolysis of MucA (AlgW, then
  MucP/YaeL), which releases AlgU. AlgU then binds core RNA polymerase and directs transcription
  from promoters with its -35 GAACTT / -10 TCtgA consensus. Its targets include its own algU-mucABCD
  operon, the alginate regulators algR and algZ and the algD alginate biosynthetic operon,
  rpoH, lipoprotein genes and envelope-repair functions. mucA mutations selected in cystic
  fibrosis lungs leave AlgU constitutively active, which produces the mucoid (alginate-overproducing)
  phenotype. In those mutants AlgU also indirectly represses flagellum synthesis (via fleQ)
  and contributes to biofilm formation, heat and oxidative stress resistance, and induction
  of the MexCD-OprJ efflux pump by membrane-damaging agents.
references:
- id: PMID:7644517
  title: The algT (algU) gene of Pseudomonas aeruginosa, a key regulator involved in alginate
    biosynthesis, encodes an alternative sigma factor (sigma E).
  findings:
  - statement: Purified AlgT with E. coli core RNAP initiates transcription of the algT promoter
      in vitro, dependent on the -35 region.
    supporting_text: The purified protein, in the presence of E. coli RNA polymerase core
      enzyme, was able to initiate transcription of an algT promoter
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA sigma factor activity (IBD seed) and IDA cytosolic DNA-directed RNA polymerase
      complex. Abstract only; the abstract itself states the decisive in vitro reconstitution
      with core RNAP, so the seed is direct evidence.
- id: PMID:7928961
  title: Transcriptional analysis of the Pseudomonas aeruginosa genes algR, algB, and algD
    reveals a hierarchy of alginate gene expression which is modulated by algT.
  findings:
  - statement: algT insertions abolish transcription initiation at the algR and algD promoters.
    supporting_text: Expression of algR and algD was abolished in P. aeruginosa strains containing
      algT::Tn501 insertions because of lack of transcription initiation at the algR and algD
      promoters
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; supports the IMP alginate-regulation row.
- id: PMID:14645293
  title: Control of Pseudomonas aeruginosa algZ expression by the alternative sigma factor
    AlgT.
  findings:
  - statement: algZ is transcribed from a consensus AlgT promoter whose -35/-10 mutations
      reduce expression.
    supporting_text: Most likely, AlgT is directly involved in algZ promoter recognition and
      transcription initiation since a promoter that is similar to a consensus AlgT promoter
      was identified upstream of the mapped transcription start site
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; source of the CollecTF and PseudoCAP rows.
- id: PMID:11807066
  title: Global genomic analysis of AlgU (sigma(E))-dependent promoters (sigmulon) in Pseudomonas
    aeruginosa and implications for inflammatory processes in cystic fibrosis.
  findings:
  - statement: Ten new AlgU-dependent promoters were mapped by comparing algU+ and algU mutant
      RNA.
    supporting_text: A total of 10 new AlgU-dependent promoters were identified, and the corresponding
      mRNA start sites were mapped
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; defines part of the AlgU sigmulon.
- id: PMID:19226327
  title: Use of cell wall stress to characterize sigma 22 (AlgT/U) activation by regulated
    proteolysis and its regulon in Pseudomonas aeruginosa.
  findings:
  - statement: Cell wall stress releases sigma-22 from MucA by regulated intramembrane proteolysis.
    supporting_text: these data indicate that cell wall stress signals release sigma(22) by
      regulated intramembrane proteolysis (RIP)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; supports the IDA cell envelope stress row.
- id: PMID:18838593
  title: 'MexCD-OprJ multidrug efflux system of Pseudomonas aeruginosa: involvement in chlorhexidine
    resistance and induction by membrane-damaging agents dependent upon the AlgU stress response
    sigma factor.'
  findings:
  - statement: Induction of mexCD-oprJ by chlorhexidine and membrane-active agents depends
      on AlgU.
    supporting_text: induce expression of the mexCD-oprJ multidrug efflux operon, dependent
      upon the AlgU stress response sigma factor
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:9159526
  title: 'Microbial pathogenesis in cystic fibrosis: co-ordinate regulation of heat-shock
    response and conversion to mucoidy in Pseudomonas aeruginosa.'
  findings:
  - statement: AlgU-RNAP transcribes rpoH from its P3 promoter, induced by heat shock.
    supporting_text: was found to be transcribed by AIgU containing RNA polymerase from one
      of its promoters (P3) identified in this study
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only (OCR renders AlgU as AIgU).
- id: PMID:20348252
  title: The sigma factor AlgU plays a key role in formation of robust biofilms by nonmucoid
    Pseudomonas aeruginosa.
  findings:
  - statement: algU mutant is defective in attachment and robust biofilm; psl/lec control
      is probably indirect via ppyR.
    supporting_text: Promoter mapping indicated that AlgU is probably not directly responsible
      for transcription of the psl operon and the lec genes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:16291668
  title: The alternative sigma factor AlgT represses Pseudomonas aeruginosa flagellum biosynthesis
    by inhibiting expression of fleQ.
  findings:
  - statement: AlgT represses flagellar genes by inhibiting fleQ expression.
    supporting_text: AlgT mediates the negative control of flagellum expression by inhibiting
      the expression of the flagellar regulator fleQ
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:7961422
  title: 'Analysis of promoters controlled by the putative sigma factor AlgU regulating conversion
    to mucoidy in Pseudomonas aeruginosa: relationship to sigma E and stress response.'
  findings:
  - statement: algU mutants are more sensitive to paraquat and heat.
    supporting_text: The algU mutants, irrespective of the mucoid status of the parental strains,
      displayed increased sensitivity to killing by paraquat
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:29729420
  title: Extracytoplasmic function sigma factors in Pseudomonas aeruginosa.
  findings:
  - statement: Review grouping the P. aeruginosa ECF sigma factors by function.
    supporting_text: the iron starvation σ (PvdS, FpvI, HasI, FecI, FecI2 and others), the
      cell wall stress ECFσ AlgU, SigX and SbrI, and the unorthodox σVreI involved in the
      expression of virulence
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review; abstract only in cache.
