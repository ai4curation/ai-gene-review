  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2854 (LdtPae2) is a Sec-exported, periplasmic YkuD-family
  L,D-transpeptidase of Pseudomonas aeruginosa. It covalently anchors the major
  outer-membrane lipoprotein OprI to the peptidoglycan sacculus by forming an
  amide bond between a peptidoglycan stem and the side-chain amino group of the
  OprI C-terminal lysine, thereby coupling the outer membrane to the cell wall.
  Its OprI-anchoring activity has been demonstrated directly in live cells and
  reconstituted in vitro with purified components, and it is the close
  Pseudomonas aeruginosa ortholog of the P. putida module exemplar PP_2320.
