taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  DsdA (PA3357) is a cytoplasmic pyridoxal 5'-phosphate-dependent D-serine dehydratase
  (D-serine ammonia-lyase) of the serine/threonine dehydratase family. It deaminates D-serine
  to pyruvate and ammonia and also accepts D-threonine, but not L-amino acids (Km for D-serine
  about 330 μM). In PAO1 the chromosomal gene is cryptic. It is not induced by D-serine, and
  growth on D-serine depends on the broad-specificity D-amino acid dehydrogenase DadA. Supplied
  on a plasmid, dsdA restores growth on D-serine as sole carbon and nitrogen source to a dadA
  dsdA mutant.
