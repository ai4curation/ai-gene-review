  supporting_entities:
  - UniRule:UR000100519
  review:
    summary: UniRule IEA hydro-lyase activity.
    action: MODIFY
    reason: >-
      The "dehydratase" name reflects the PLP mechanism, which eliminates water before the
      aminoacrylate is hydrolysed. The overall reaction (D-serine to pyruvate and ammonia) is
      classed as an ammonia-lyase (EC 4.3.1.18), and GO:0008721 sits under carbon-nitrogen
      lyase activity, not under hydro-lyase activity. Lateral correction to the specific
      supported term, which the gene already carries.
    proposed_replacement_terms:
    - id: GO:0008721
      label: D-serine ammonia-lyase activity
    supported_by:
