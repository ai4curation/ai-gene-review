    action: ACCEPT
    reason: >-
      DsdA performs the one-step degradation of D-serine to pyruvate and ammonia, and plasmid
      dsdA restores D-serine catabolism to a dadA dsdA mutant. The chromosomal gene is cryptic
      under laboratory conditions; the process is the one the enzyme carries out, not
      necessarily the main route of D-serine use in PAO1.
    supported_by:
