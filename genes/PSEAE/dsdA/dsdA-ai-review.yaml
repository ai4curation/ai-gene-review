  - statement: DsdA deaminates D-serine (Km 330 μM) and D-threonine only.
    supporting_text: Among D- and L-amino acids tested, only D-serine and D-threonine could
      serve as the substrates of DsdA, and the Km of DsdA with D-serine was calculated to be
      330 μM.
  - statement: Chromosomal dsdA is dispensable for D-serine use; DadA is required.
    supporting_text: Growth on D-serine as the sole source of nitrogen was retained in the
      ∆dsdA mutant and was abolished completely in the ∆dadA and ∆dadA-∆dsdA mutants.
