- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000413841
  review:
    summary: ParB is not part of the transcription machinery.
    action: REMOVE
    reason: >-
      An electronic rule annotation that treats ParB as a transcription
      participant. ParB does not synthesise RNA or form part of RNA
      polymerase; its effects on gene expression are repression next to
      parS (silencing by spreading) and indirect effects of segregation
      defects. Those are covered by the regulation row, which is refined
      below. The P. putida ortholog carries no transcription terms. Unlike
      it, this entry has a Cro/C1-type HTH signature match (PS50943,
      IPR001387), which may be what triggers the UniRule; the rule's
      conditions were not checked, so that link is an inference.
    supported_by:
    - reference_id: PMID:28732084
      supporting_text: indicating that direct ParB- parS3/parS4 interactions repress the transcription
        in this region
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000413841
  review:
    summary: ParB represses transcription of genes adjacent to the high-affinity parS3 and parS4 sites.
    action: MODIFY
    reason: >-
      Regulation is real in P. aeruginosa but its direction is known: ParB
      bound at parS3/parS4 represses the neighbouring promoters, and ParB
      overproduction silences genes placed next to parS in a parS-dependent
      manner. Negative regulation (GO:0045892) is the precise term. It is
      non-core: it follows from parS binding and spreading, and most of the
      transcriptome change in parB mutants is indirect.
    proposed_replacement_terms:
    - id: GO:0045892
      label: negative regulation of DNA-templated transcription
    supported_by:
    - reference_id: PMID:28732084
      supporting_text: indicating that direct ParB- parS3/parS4 interactions repress the transcription
        in this region
    - reference_id: PMID:15466051
      supporting_text: The overproduction of ParB was shown to inhibit the function of genes placed near
        parS.
- term:
    id: GO:0007059
    label: chromosome segregation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002121184
  - UniProtKB:P26497
  review:
    summary: ParB is the parS-binding, spreading component of the ParABS origin-segregation machinery.
    action: ACCEPT
    reason: >-
      Core process, with direct P. aeruginosa evidence. ParB does part of the
      work: it binds parS and spreads to form the partition complex that ParA
      acts on, and point mutants that bind DNA but cannot spread or dimerize
      phenocopy the null. parB-null and parS-null strains accumulate
      anucleate cells, and one oriC-proximal parS site is necessary and
      sufficient for segregation.
    supported_by:
