  - UniProtKB:P9WIJ9
  review:
    summary: ParB acts on the chromosome, at oriC-proximal parS sites and at half-parS sites genome-wide.
    action: ACCEPT
    reason: >-
      Consistent with the PAINT node and with direct P. aeruginosa data:
      ChIP-seq shows ParB bound in vivo at the four parS sites near oriC,
      where it forms a high-order nucleoprotein complex, and at hundreds of
      parS half-sites across the chromosome. Chromosome is the appropriate
      location; nucleoid-level terms would add little.
    supported_by:
