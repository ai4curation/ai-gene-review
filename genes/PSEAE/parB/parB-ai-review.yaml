      supporting_text: All parB mutations affected both bacterial growth and swarming and swimming motilities,
        and increased the production of anucleate cells.
    - reference_id: PMID:21531806
      supporting_text: indicating that the ability to spread is vital for ParB function in the cell
    - reference_id: PMID:25794281
      supporting_text: is necessary and sufficient for the parABS role in chromosome partitioning
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:21531806
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9HT12
  review:
    summary: ParB self-associates, chiefly through its C-terminal dimerization domain.
    action: MODIFY
    reason: >-
      The self-interaction is real (cross-linking, ultracentrifugation and
      two-hybrid mapping in PMID:21531806), but identical protein binding says
      nothing about its nature. The characterized interaction is
      homodimerization through the C-terminal leucine-zipper-like domain,
      which is required for DNA binding, spreading, ParA interaction and every
      in vivo function. Protein homodimerization activity (GO:0042803) states
      that. Higher-order oligomerization during spreading is a consequence of
      CTP-dependent clamping and is not a separate activity term.
    proposed_replacement_terms:
    - id: GO:0042803
      label: protein homodimerization activity
    supported_by:
    - reference_id: PMID:21531806
      supporting_text: Analysis confirmed the localization of the main dimerization domain in the C terminus
        of ParB but also mapped another self-interactive domain in the N-terminal domain.
    - reference_id: PMID:22322962
      supporting_text: Thus so far all the properties of ParB seem to depend on dimerization.
- term:
    id: GO:0045881
    label: positive regulation of sporulation resulting in formation of a cellular spore
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002121186
  - UniProtKB:P26497
  review:
    summary: Pseudomonas aeruginosa does not sporulate; the term is inherited from B. subtilis Spo0J.
    action: REMOVE
    reason: >-
      The only donor is B. subtilis Spo0J (P26497), where Spo0J antagonises
      Soj inhibition of the Spo0A-dependent sporulation decision. P.
      aeruginosa forms no endospores and has no Spo0A phosphorelay, so the
      process does not exist in the target lineage. The problem is node
      placement: the sporulation IBD (PTN002121186) sits on a node whose
      descendants include non-sporulating Gammaproteobacteria. The P.
      aeruginosa literature attributes the sporulation role to the B.
      subtilis homologue only.
    supported_by:
    - reference_id: PMID:19332810
      supporting_text: The ParB homologue Spo0J is required for both initiation of sporulation and normal
        chromosome partitioning during vegetative growth.
    - reference_id: PMID:11849535
      supporting_text: We have investigated the role in partition of the parAB locus of a free-living
        bacterium, Pseudomonas putida, not known to pass through developmental phases.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002121186
        source_label: ParB family node carrying the positive-sporulation IBD
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Seeded by B. subtilis Spo0J, where the Soj-Spo0A sporulation link is
          experimentally established. The node also covers non-sporulating
          Gammaproteobacteria such as Pseudomonas, which have no Spo0A
          pathway. A shallower IBD placement or a taxon constraint would fix
          this at source.
      - source_id: UniProtKB:P26497
        source_label: B. subtilis Spo0J
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
- term:
    id: GO:0043273
    label: CTPase activity
  evidence_type: IDA
  original_reference_id: PMID:38843873
  review:
    summary: Purified P. aeruginosa ParB hydrolyses CTP, with parS DNA stimulating the reaction.
    action: NEW
    reason: >-
      Direct biochemical evidence on this protein: CTP hydrolysis by purified
      P. aeruginosa ParB follows Michaelis-Menten kinetics (KM about 44 uM),
      requires DNA and is fully stimulated only by parS. This is the
      conserved ParB CTPase that drives clamp closure and spreading, and it
      is not in GOA for this protein. ParB is the catalyst here, so this is an
      activity annotation, not a substrate role.
    supported_by:
    - reference_id: PMID:38843873
      supporting_text: We found that the same holds true for the P. aeruginosa ParB.
    - reference_id: PMID:38843873
      supporting_text: The reaction required the presence of DNA, with nonspecific DNA providing only
        partial stimulation of the activity
- term:
    id: GO:0043565
    label: sequence-specific DNA binding
  evidence_type: IDA
  original_reference_id: PMID:15466051
  review:
    summary: ParB binds parS palindromes specifically, in vitro and in vivo.
    action: NEW
    reason: >-
      Direct evidence: purified ParB binds parS-containing DNA specifically,
      binds all ten genomic parS sites with different affinities, and binds
      parS1-4 in vivo (ChIP-seq). This is the replacement proposed for the
      electronic DNA binding row, recorded with its experimental source.
    supported_by:
    - reference_id: PMID:15466051
      supporting_text: Purified ParB binds specifically to DNA containing a putative parS sequence based
        on the consensus sequence found in the chromosomes of Bacillus subtilis, Pseudomonas putida,
        and Streptomyces coelicolor.
    - reference_id: PMID:25794281
      supporting_text: It was found that ParB binds specifically to all ten parS sites, although with
        different affinities.
- term:
    id: GO:0002135
    label: CTP binding
  evidence_type: IC
  original_reference_id: PMID:38843873
  supporting_entities:
  - GO:0043273
  review:
    summary: ParB binds the CTP it hydrolyses.
    action: NEW
    reason: >-
      Curator inference from the measured CTP hydrolysis by purified ParB,
      which requires CTP binding, together with the conserved CTP-binding box
      GERRWRA. Binding was not measured separately, so the code is IC.
      Recorded separately because GO does not derive CTP binding from CTPase
      activity.
    supported_by:
    - reference_id: PMID:38843873
      supporting_text: We found that the same holds true for the P. aeruginosa ParB.
    - reference_id: file:PSEPK/parA/parA-bioinformatics/RESULTS.md
      supporting_text: ParB has the CTP-binding box
        GERRWRA at 91-97, which coordinates the CTP phosphates in characterized ParB
        CTPases.
