suggested_questions:
- question: Does CTP binding or hydrolysis by P. aeruginosa ParB control its occupancy of the hundreds
    of half-parS sites, or only spreading from the full parS1-4 sites?
- question: Which of the ParB-dependent expression changes are direct (half-parS binding near promoters)
    and which follow from segregation defects?
suggested_experiments:
- description: Compare ChIP-seq occupancy at parS1-4 and at half-parS sites for wild-type ParB and
    a mutant in the CTP-binding box (GERRWRA, residues 91-97).
  hypothesis: Half-parS binding does not require CTP-dependent clamping, whereas spreading from parS1-4
    does.
  experiment_type: ChIP-seq
