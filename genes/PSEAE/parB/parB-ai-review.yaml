status: DRAFT
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ParB (PA5562) is the centromere-binding component of the Pseudomonas
  aeruginosa ParABS chromosome-partitioning system, encoded with its partner
  ParA in the gidAB-parAB operon close to oriC. A 290-residue ParB/Srx-fold
  protein, it has an N-terminal CTP-binding (ParB_N) domain with the GERRxRA
  box, a central helix-turn-helix that recognises parS palindromes, and a
  C-terminal leucine-zipper-like dimerization domain. ParB binds the four
  oriC-proximal parS sites (parS1-4), hydrolyses CTP in a parS-stimulated
  reaction, and spreads from parS onto flanking DNA to form a large
  nucleoprotein complex that ParA moves during segregation of newly
  replicated origins. Loss of ParB, of its ability to spread or dimerize, or
  of all parS sites causes anucleate cells, slower growth and defective
  swimming and swarming motility. ParB also binds hundreds of parS
  half-sites across the genome, behaving as a nucleoid-associated protein,
  and represses genes next to parS3 and parS4; its absence changes
  expression of hundreds of genes.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004437
  - UniRule:UR000413841
  review:
    summary: ParB binds DNA; its defining activity is sequence-specific recognition of parS palindromes.
    action: MODIFY
    reason: >-
      True but less specific than the evidence. Purified P. aeruginosa ParB
      binds parS-containing DNA specifically and binds all ten chromosomal
      parS sites with different affinities, so the informative term is
      sequence-specific DNA binding (GO:0043565), a descendant of DNA binding
      and the term used for the B. subtilis ortholog Spo0J. The non-specific
      DNA contacts made during spreading follow from CTP-dependent clamp
      closure after loading at parS, and the sequence-specific term remains
      the activity that defines ParB.
    proposed_replacement_terms:
    - id: GO:0043565
      label: sequence-specific DNA binding
    supported_by:
    - reference_id: PMID:15466051
      supporting_text: Purified ParB binds specifically to DNA containing a putative parS sequence based
        on the consensus sequence found in the chromosomes of Bacillus subtilis, Pseudomonas putida,
        and Streptomyces coelicolor.
    - reference_id: PMID:25794281
      supporting_text: It was found that ParB binds specifically to all ten parS sites, although with
        different affinities.
- term:
    id: GO:0005694
    label: chromosome
  evidence_type: IBA
