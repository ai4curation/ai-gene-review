id: Q9HT12
gene_symbol: parB
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
status: COMPLETE
locus_tag: PA5562
description: >-
  P. aeruginosa PAO1 is one of NCBI's curated reference genomes, so PGAP does
  not annotate its assembly. The identical protein WP_003100240.1 is
  annotated by PGAP in other genomes (39,809 assemblies in its
  identical-protein record). As for the P. putida ortholog, it is
  named "ParB/RepB/Spo0J family partition protein" from SPARCLE architecture
  11445026 and carries only DNA binding. TIGR00180, which also matches and
  carries chromosome segregation, does not pass on its GO because it does
  not name the protein. The prediction is less precise than the
  experimentally supported sequence-specific DNA binding. The directly
  measured parS-stimulated CTPase activity of this protein (PMID:38843873)
  has no source in PGAP.
