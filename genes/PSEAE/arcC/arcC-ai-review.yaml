  title: 'Carbamate kinase from Pseudomonas aeruginosa: purification, characterization, physiological
    role, and regulation.'
  findings:
  - statement: Carbamate kinase was purified from PAO1 and is distinct from carbamoyl-phosphate synthetase
      and acetate kinase.
    supporting_text: Pseudomonas aeruginosa PAO1 possessed a carbamate kinase (CKase) distinct from carbamoylphosphate
      synthetase as well as from a constitutive acetate kinase which also catalyzes the phosphorylation
      of ADP by carbamoylphosphate
  - statement: Expression is induced by anaerobiosis and arginine; the enzyme supplies ATP anaerobically
      and ammonia aerobically.
    supporting_text: CKase expression is regulated in a manner that allows the enzyme to function as a provider
      of ammonia under aerobic conditions and of ATP under anaerobic conditions
  reference_review:
    relevance: HIGH
