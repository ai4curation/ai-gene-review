      later sequencing (UniProt reference 1).
- id: PMID:6438064
  title: 'Pseudomonas aeruginosa mutants affected in anaerobic growth on arginine: evidence for a four-gene
    cluster encoding the arginine deiminase pathway.'
  findings:
  - statement: arcC mutants lack carbamate kinase and are blocked in anaerobic arginine catabolism.
    supporting_text: The mutations arcA (arginine deiminase), arcB (catabolic ornithine carbamoyltransferase),
      arcC (carbamate kinase), and arcD were highly cotransducible
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for IMP GO:0008804, one of two seeds of the PTN001252214 (kinase activity)
      and PTN000764469 (carbamate kinase activity) IBDs. Abstract only. Mutants defective in the
      activity define arcC as the carbamate kinase locus; later cloning, sequence, purified-enzyme
      and structural work confirmed it.
