suggested_questions:
- question: >-
    Should GO restore a process term for the arginine deiminase pathway (arginine fermentation to
    ornithine with ATP generation) as a child of L-arginine catabolic process, so that ADI-pathway
    carbamate kinases can be distinguished from allantoin- and other-pathway carbamate kinases?
