id: P13982
gene_symbol: arcC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ArcC (PA5173) is the carbamate kinase of Pseudomonas aeruginosa, the third enzyme of the
  arginine deiminase (ADI) pathway encoded by the arcDABC operon. It transfers the phosphate
  of carbamoyl phosphate, produced from citrulline by the catabolic ornithine
  carbamoyltransferase ArcB, to ADP, forming ATP, ammonia and carbon dioxide. This
  substrate-level phosphorylation lets the bacterium grow anaerobically on arginine when
  oxygen and nitrate are scarce, and aerobically the enzyme serves as a source of ammonia.
  ArcC is a cytoplasmic homodimer, distinct from carbamoyl-phosphate synthetase and acetate
  kinase, inhibited by ATP (avoiding a futile cycle with carbamoyl-phosphate synthetase), and
  induced by anaerobiosis and arginine and repressed by ammonia.
