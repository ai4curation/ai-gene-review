existing_annotations:
- term:
    id: GO:0000256
    label: allantoin catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000764469
  - UniProtKB:P37306
  review:
    summary: >-
      IBA from the PTN000764469 IBD of GO:0000256, seeded only by E. coli AllK (P37306), the
      carbamate kinase of anaerobic allantoin assimilation. arcC is not a seed of this term.
    action: REMOVE
    reason: >-
      ArcC is the carbamate kinase of the arginine deiminase pathway: it is encoded in the arc
      operon, induced by arginine and anaerobiosis, and arcC mutants are blocked in anaerobic
      arginine catabolism. Carbamate kinases are shared terminal enzymes of several
      carbamoyl-phosphate-producing catabolic pathways, and the pathway each paralog serves is
      set by its operon, not inherited with the fold. Nothing links P. aeruginosa ArcC to allantoin
      degradation. Same kind of pathway-specific over-propagation as the biosynthetic IBAs removed
      from arcB.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000764469
        source_label: PTN000764469
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Carbamate kinase node (7 leaves, 6 taxa) containing allantoin-pathway AllK and
          ADI-pathway kinases (P. aeruginosa ArcC, H. influenzae ArcC P44769, Salmonella STM4466,
          Geobacter CpkA). The MF IBD is right for all; the allantoin process IBD only for AllK.
      - source_id: UniProtKB:P37306
        source_label: allK (E. coli)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IDA allantoin catabolism (PMID:36384810) for AllK; does not transfer to ADI-pathway ArcC.
    supported_by:
    - &pathway
      reference_id: file:PSEAE/arcC/arcC-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Amino-acid degradation; L-arginine degradation via ADI pathway.'
    - &arcmut
      reference_id: PMID:6438064
      supporting_text: The mutations arcA (arginine deiminase), arcB (catabolic ornithine carbamoyltransferase),
        arcC (carbamate kinase), and arcD were highly cotransducible
    - reference_id: file:PSEAE/arcC/arcC-notes.md
      supporting_text: the PTN000764469 IBD of GO:0000256 allantoin catabolic process rests on E. coli
        AllK alone
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000764469
      requested_change: DELETE_ROW
      asserted_value: GO:0000256
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The PTN000764469 IBD of GO:0000256 allantoin catabolic process rests on a single seed, E.
        coli AllK (P37306, IDA PMID:36384810), and propagates to the arginine deiminase pathway
        carbamate kinases in the same clade, including P. aeruginosa ArcC (P13982), whose curated
        UniProt pathway is L-arginine degradation via the ADI pathway and whose mutants are blocked
        in anaerobic arginine catabolism (PMID:6438064). The pathway a carbamate kinase serves
        follows its operon context (arcDABC for ArcC), not the shared fold, so the process
        term does not suit the node. Please move the IBD down to the AllK subclade, or replace it
        with a NOT (loss) on the ADI-pathway members. PROBABLE because the seed papers were read as
        abstracts and the tree topology below the node was not inspected.
      supported_by:
      - *pathway
