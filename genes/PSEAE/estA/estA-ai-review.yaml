- term:
    id: GO:0048870
    label: cell motility
  evidence_type: IMP
  original_reference_id: PMID:17631636
  qualifier: involved_in
  review:
    summary: Loss of swimming, swarming and twitching in the estA mutant; a phenotype-level
      process.
    action: MARK_AS_OVER_ANNOTATED
    reason: All motility forms are affected in the estA mutant, but involved_in on the general
      term still asserts that EstA takes part in cell motility, and the argument that marks the
      flagellar rows applies here too. An earlier version of this review proposed that the
      effect ran through rhamnolipid levels. The full text refutes that specific mechanism,
      in that the authors added wild-type amounts of rhamnolipid back to the mutant's growth medium
      and motility was not restored, from which they conclude that the rhamnolipid deficiency
      is not the reason for the motility defects but a separate phenotype coinfluenced by loss
      of EstA. They state the affected phenotypes have no obvious physiological or regulatory
      link and cannot yet be explained comprehensively. So the mechanism is genuinely unknown
      rather than plausibly rhamnolipid-mediated, which leaves the participation claim weaker,
      not stronger; over-annotation stands, now on evidence rather than on absence of it.
    supported_by:
    - reference_id: PMID:17631636
      supporting_text: the other kinds of motility displayed by P. aeruginosa PAO1, swimming
        and twitching, were also affected by an estA mutation
