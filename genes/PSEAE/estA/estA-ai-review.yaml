core_functions:
- description: Surface-exposed carboxylesterase. The GDSL/SGNH passenger domain of the
    outer-membrane autotransporter hydrolyses short-chain carboxylic esters on the cell
    surface; its activity is required, by an unknown mechanism, for normal rhamnolipid
    levels, motility and biofilm formation.
  molecular_function:
    id: GO:0106435
    label: carboxylesterase activity
  locations:
  - id: GO:0009279
    label: cell outer membrane
  supported_by:
  - reference_id: PMID:20931591
    supporting_text: TesA, EstA and EstP were shown to function as esterases with different
      affinities and catalytic efficacies towards p-nitrophenyl butyrate
  - reference_id: PMID:10559163
    supporting_text: indicating that the enzyme was located in the outer membrane with the
      catalytic domain exposed to the surface
knowledge_gaps:
- gap_statement: The physiological substrate of EstA and the mechanism by which its esterase
    activity is required for rhamnolipid accumulation, motility and biofilm formation are
    unknown; EstA has no activity on acyl-CoA and is located outside the compartment where
    rhamnolipid is synthesised.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: Should PAINT withdraw the GO:0008610 lipid biosynthetic process IBD at
    PTN005219546, given that its only seed is a rhamnolipid-deficient estA mutant
    phenotype?
- question: Does EstA affect rhamnolipid biosynthesis, export, or turnover, and is the
    effect mediated through rhl quorum-sensing regulation of rhlAB expression?
suggested_experiments:
- description: Lipidomic and metabolomic profiling of wild-type, estA deletion, and EstA
    S38A strains (cell-associated and supernatant fractions), combined with rhlAB reporter
    assays, to determine whether EstA alters rhamnolipid synthesis, release, or regulation,
    and to identify candidate in vivo ester substrates.
