- term:
    id: GO:0008610
    label: lipid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:17631636
  qualifier: involved_in
  review:
    summary: Deletion mutant phenotype (marginal rhamnolipid) annotated as participation in
      lipid biosynthesis; the step EstA affects is unknown.
    action: MARK_AS_OVER_ANNOTATED
    reason: The full text has now been read (J Bacteriol 189:6695-6703,
      doi:10.1128/JB.00023-07) and settles the mechanism question against participation.
      The authors state plainly that there is no obvious function in the rhamnolipid
      biosynthesis pathway which might directly require an esterase, and they report no
      intracellular accumulation of rhamnolipid in the mutant, which excludes a block in
      export or turnover. Their preliminary transcriptome analysis instead finds rhlB and
      rhlC, the rhamnosyltransferases that do the biosynthetic work, significantly
      downregulated in the estA mutant, and they conclude that EstA stimulates rhamnolipid
      production probably by hydrolysis of a yet-unknown compound, i.e. through a signal
      upstream of the pathway. The entity performing every biosynthetic step is therefore
      RhlA/RhlB/RhlC, not EstA, and the row records necessity rather than participation.
      I keep MARK_AS_OVER_ANNOTATED rather than escalating to REMOVE because the
      requirement is real and enzyme-activity-dependent (the Ser38->Ala variant fails to
      complement); the claim is not false, but it is the wrong relation for a genuine
      dependency. This row is the sole seed of the PTN005219546 lipid biosynthetic process
      IBD.
    supported_by:
    - reference_id: PMID:17631636
      supporting_text: an estA deletion mutant produced only marginal amounts of
        rhamnolipids
    - reference_id: PMID:17631636
      supporting_text: None of the mutant phenotypes could be complemented by expression of
        EstA*
    - reference_id: file:PSEAE/estA/estA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: the exact role of EstA in these
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0008610
      cause: OTHER
      confidence: PROBABLE
      explanation: The IMP lipid biosynthetic process row on EstA (O33407) from
        PMID:17631636 is based on reduced rhamnolipid in an estA deletion mutant. The
        UniProt entry itself says the role of EstA is unclear, and EstA is a surface-exposed
        outer-membrane esterase, not a rhamnolipid synthase. The full text has since been
        read and does not show EstA acting on a biosynthetic intermediate; the authors
        state there is no obvious function in the pathway requiring an esterase, report no
        intracellular rhamnolipid accumulation, and find rhlB and rhlC downregulated in the
        mutant, placing EstA upstream of the biosynthetic enzymes. Please consider removing
        the row. It is the sole seed of the PAINT IBD at PTN005219546 (960 leaf IBAs).
