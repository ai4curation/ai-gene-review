  review:
    summary: Biofilm formation is affected in the estA mutant; a phenotype-level process,
      secondary to the mutant's motility defect.
    action: KEEP_AS_NON_CORE
    reason: The paper reports that biofilm formation was affected by estA mutation and that
      the phenotype needs active enzyme. Biofilm IMP annotations of this kind are standard
