- id: PMID:10559163
  title: A novel lipolytic enzyme located in the outer membrane of Pseudomonas aeruginosa.
  findings:
  - statement: EstA is an outer-membrane esterase with its catalytic domain exposed on the
      cell surface, active on short-chain p-nitrophenyl esters.
    supporting_text: Trypsin treatment of whole cells released a significant amount of
      esterase, indicating that the enzyme was located in the outer membrane with the
      catalytic domain exposed to the surface.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Discovery paper; abstract-only in cache. Not a GOA reference but the basis
      of the UniProt location and EC assignment.
- id: PMID:17631636
  title: The autotransporter esterase EstA of Pseudomonas aeruginosa is required for rhamnolipid
    production, cell motility, and biofilm formation.
  findings:
  - statement: estA deletion strongly reduces rhamnolipid production; motility and biofilm
      are affected; active-site Ser->Ala variant does not complement.
    supporting_text: None of the mutant phenotypes could be complemented by expression of
      EstA*, demonstrating that the phenotypes affected by the estA mutation depend on the
      enzymatically active protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source of the PseudoCAP IMP rows (carboxylic ester hydrolase, glycolipid
      biosynthesis, biofilm, flagellar motility) and UniProt IMP/IDA rows. Abstract only
      (PMC2045186 full text not retrievable via the PubMed MCP). Sound for the esterase
      activity, cell outer membrane and phenotype-level claims; the biosynthetic-process
      rows overinterpret a necessity phenotype.
- id: PMID:20060837
  title: Crystal structure of a full-length autotransporter.
  findings:
  - statement: Full-length EstA structure; 12-stranded barrel, surface-exposed active site.
    supporting_text: The esterase active-site residues are located at the apical surface of
      the passenger
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structure paper (PDB 3KVN); abstract only in cache.
- id: PMID:20360178
  title: Extracellular enzymes affect biofilm formation of mucoid Pseudomonas aeruginosa.
  findings:
  - statement: estA overexpression in a mucoid strain enhances swimming and swarming,
      abolishes twitching and 3D biofilm, and raises rhamnolipid; effects may be indirect.
    supporting_text: Overexpression of estA resulted in a loss of twitching motility,
      although it enhanced the ability to swim and swarm.
  reference_review:
    relevance: MEDIUM
