- id: PMID:17631636
  title: The autotransporter esterase EstA of Pseudomonas aeruginosa is required for rhamnolipid
    production, cell motility, and biofilm formation.
  findings:
  - statement: estA deletion strongly reduces rhamnolipid production; motility and biofilm
      are affected; active-site Ser->Ala variant does not complement.
  - statement: The catalytic nucleophile replaced in the inactive EstA* variant is Ser38,
      matching UniProt ACT_SITE 38 (Nucleophile) and MUTAGEN 38 on O33407.
  - statement: The authors state there is no obvious function in the rhamnolipid
      biosynthesis pathway that would directly require esterase activity, and no
      rhamnolipid accumulates inside the estA mutant, which excludes a block in export or
      in hydrolytic turnover.
  - statement: Preliminary transcriptome analysis finds rhlB and rhlC, the
      rhamnosyltransferases that carry out rhamnolipid biosynthesis, significantly
      downregulated in the estA mutant, placing EstA upstream of the biosynthetic enzymes
      rather than within the pathway.
  - statement: Adding wild-type amounts of rhamnolipid back to the estA mutant's growth
      medium does not restore motility, so the rhamnolipid deficiency is not the cause of
      the motility defects.
  - statement: Type IV pilus genes (pilA, pilX, pilG, pilB) are downregulated in the
      mutant, accounting for the twitching and swarming defects, but no change in
      flagellar gene expression was detected that would account for the loss of swimming.
  - statement: Mutant biofilms show significantly reduced surface coverage and form large
      cell aggregates separated by regions of very low cell density, which the authors
      attribute to clonal-only expansion of a non-motile strain.
  - statement: AHL autoinducer levels are unaffected in the estA mutant, so the
      rhamnolipid effect is not mediated by altered quorum sensing.
    supporting_text: None of the mutant phenotypes could be complemented by expression of
      EstA*, demonstrating that the phenotypes affected by the estA mutation depend on the
      enzymatically active protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Source of the PseudoCAP IMP rows (carboxylic ester hydrolase, glycolipid
      biosynthesis, biofilm, flagellar motility) and UniProt IMP/IDA rows. Sound for the
      esterase activity, cell outer membrane and phenotype-level claims; the
      biosynthetic-process rows overinterpret a necessity phenotype.

      Full text read 2026-11-14 from the publisher version (J Bacteriol 189:6695-6703,
      doi:10.1128/JB.00023-07), supplied directly rather than fetched. The repository cache
      for this PMID is abstract-only and stays that way: `ai-gene-review fetch-pmid
      17631636 --force` reports no retrievable content for PMC2045186 by either the HTML or
      the PDF route, and leaves the cached file byte-identical. Every supporting_text on
      this reference is therefore quoted from the cached abstract, so that it stays
      machine-checkable; the full-text findings are recorded as findings[].statement
      without supporting_text, and in the reasons of the rows they bear on, rather than as
      quotations the validator has no way to verify.

      The full text corrected two mechanistic claims this review had made from the
      abstract: that the motility defect runs through rhamnolipid (refuted by the
      add-back experiment) and that the biofilm defect does too (the authors attribute it
      to non-motility). It also strengthened, rather than overturned, the
      over-annotation calls on the two biosynthetic-process rows.
