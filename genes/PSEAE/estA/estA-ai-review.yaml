id: O33407
gene_symbol: estA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: EstA (PA5112) is an outer-membrane autotransporter esterase of Pseudomonas
  aeruginosa. Its N-terminal GDSL/SGNH-family passenger domain, with a Ser-Asp-His
  catalytic triad, is translocated across the outer membrane by the C-terminal
  12-stranded beta-barrel domain and remains covalently attached, exposing the active
  site on the cell surface. The enzyme is a carboxylesterase that prefers short-chain
  acyl esters (p-nitrophenyl butyrate to hexanoate), Tween detergents and beta-naphthyl
  butyrate, with negligible activity on triacylglycerols and acyl-CoA. Deletion of estA
  strongly reduces extracellular rhamnolipid and impairs swimming, swarming and twitching
  motility and biofilm formation, and these phenotypes require the catalytically active
  enzyme; the physiological substrate and the step by which EstA influences rhamnolipid
  levels are unknown. EstA is also widely used as an anchor for bacterial cell-surface
  display.
