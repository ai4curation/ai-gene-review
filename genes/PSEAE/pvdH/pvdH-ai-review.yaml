- term:
    id: GO:0030170
    label: pyridoxal phosphate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005814
  review:
    summary: >-
      PvdH matches the Aminotrans_3 (IPR005814) and PROSITE class-III
      aminotransferase signatures, and the class-III PLP-dependent
      aminotransferase family uses PLP bound through a Schiff base to a
      conserved catalytic lysine. The ping-pong kinetic mechanism reported for
      the purified enzyme is the mechanism expected of a PLP aminotransferase.
      Cofactor binding is a genuine but accessory property relative to the
      catalytic role.
    action: KEEP_AS_NON_CORE
    reason: >-
      Well-supported cofactor-binding annotation from curated domain
      signatures, retained as non-core support for the PLP-dependent
      transaminase mechanism.
