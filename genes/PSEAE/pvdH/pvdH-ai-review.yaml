id: Q9I168
gene_symbol: pvdH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdH (PA2413) is the diaminobutyrate--2-oxoglutarate aminotransferase of
  Pseudomonas aeruginosa PAO1, a class-III pyridoxal 5'-phosphate-dependent
  aminotransferase (Aminotrans_3 fold, NCBIfam dat/TIGR00709). Purified from
  PAO1, it interconverts L-aspartate beta-semialdehyde and
  L-2,4-diaminobutyrate, operating physiologically in the direction that forms
  L-2,4-diaminobutyrate, with 2-oxoglutarate/L-glutamate as the amino-group partner
  and a ping-pong kinetic mechanism. L-2,4-Diaminobutyrate is one of the two
  non-proteinogenic precursors of the pyoverdine dihydroxyquinoline chromophore,
  which is formed by condensation of D-tyrosine with L-2,4-diaminobutyrate;
  pvdH knockout mutants cannot make pyoverdine under iron limitation unless
  L-2,4-diaminobutyrate is supplied in the medium. PvdH homologues lie within
  pyoverdine biosynthetic loci across fluorescent pseudomonads, indicating a
  general route to this precursor in pyoverdine producers.
