suggested_questions:
- question: >-
    Is PvdH the sole route to L-2,4-diaminobutyrate in PAO1, or can the
    ectoine-type diaminobutyrate aminotransferases of other pseudomonads
    substitute when pvdH is deleted?
  experts:
  - Stephen Y. K. Seah
  - Iain L. Lamont
- question: >-
    What determines flux partitioning of L-aspartate 4-semialdehyde between
    PvdH and the aspartate-semialdehyde-consuming reactions of lysine,
    threonine and methionine biosynthesis under iron limitation?
  experts:
  - Iain L. Lamont
suggested_experiments:
- hypothesis: >-
    PvdH is the only enzyme supplying L-2,4-diaminobutyrate for pyoverdine in
    PAO1.
  description: >-
    Quantify intracellular L-2,4-diaminobutyrate by LC-MS in wild-type and
    pvdH-deletion PAO1 under iron limitation, with and without plasmid-borne
    pvdH, and test whether heterologous ectB can restore pyoverdine output.
  experiment_type: metabolomics plus genetic complementation
- hypothesis: >-
    PvdH activity is rate-limiting for pyoverdine production under strong iron
    limitation.
  description: >-
    Titrate pvdH expression from an inducible chromosomal promoter and measure
    pyoverdine yield, intracellular L-2,4-diaminobutyrate and growth, to test
    for a flux-control relationship between transaminase level and siderophore
    output.
  experiment_type: expression titration and flux analysis
