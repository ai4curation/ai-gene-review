- term:
    id: GO:0008483
    label: transaminase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002461253
  - UniProtKB:Q9I168
  review:
    summary: >-
      The PAINT node PTN002461253 of PTHR43552 asserts transaminase activity,
      and Q9I168 itself is among the seeds: PvdH's own experimental
      transaminase annotation is part of the descendant evidence the PAINT
      curator used, so the gene legitimately appears in its own WITH/FROM and
      the IBA adds the statement that the activity is inherited rather than
      lineage-specific. The claim is true but is the broad family-level parent;
      the assayed reaction is the specific L-2,4-diaminobutyrate:2-oxoglutarate
      transamination, which is the term this review carries as core.
    action: MODIFY
    reason: >-
      Correct but less specific than the evidence supports. GO:0045303
      L-2,4-diaminobutyrate:2-oxoglutarate transaminase activity is an is_a
      descendant of GO:0008483 and is the reaction demonstrated with purified
      PAO1 PvdH; UniProt and NCBIfam also classify the protein as a
      diaminobutyrate--2-oxoglutarate aminotransferase (dat).
    proposed_replacement_terms:
    - id: GO:0045303
      label: L-2,4-diaminobutyrate:2-oxoglutarate transaminase activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002461253
        source_label: PTHR43552 ancestral node for diaminobutyrate--2-oxoglutarate aminotransferases
