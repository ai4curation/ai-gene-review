  original_reference_id: PMID:15317763
  qualifier: involved_in
  review:
    summary: >-
      Core biological process. PvdH supplies L-2,4-diaminobutyrate for the
      pyoverdine chromophore; pvdH mutants of PAO1 fail to synthesize pyoverdine
      under iron limitation unless the precursor is supplied exogenously, and
      the purified enzyme catalyses the precursor-forming transamination.
    action: ACCEPT
    reason: >-
      Directly supported by the biochemical and genetic characterization of PAO1
      PvdH in the cited paper.
    supported_by:
    - reference_id: PMID:15317763
      supporting_text: >-
        Both pvdH and asd (encoding aspartate beta-semialdehyde dehydrogenase) knockout
        mutants of Pseudomonas aeruginosa PAO1 were unable to synthesize pyoverdine
        under iron-limiting conditions in the absence of l-2,4-diaminobutyrate in the
        culture media.
    - reference_id: PMID:15317763
      supporting_text: >-
        The fluorescent dihydroxyquinoline chromophore of the pyoverdine siderophore in
        Pseudomonas is a condensation product of D-tyrosine and l-2,4-diaminobutyrate.
