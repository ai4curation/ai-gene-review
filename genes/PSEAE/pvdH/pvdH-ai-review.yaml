        comment: >-
          The node is seeded by Q9I168 itself, i.e. by this protein's own
          experimental transaminase annotation, so the propagation is sound and
          not circular. Only the granularity is at issue: the family-level term
          is the broad parent of the assayed diaminobutyrate transamination.
      residue_claims_not_applicable: >-
        The issue is term granularity for a retained, directly assayed activity;
        no residue gain or loss is claimed. The class-III PLP catalytic lysine
