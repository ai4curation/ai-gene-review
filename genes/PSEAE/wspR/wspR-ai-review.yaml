id: Q9HXT9
gene_symbol: wspR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WspR (PA3702) is a soluble response regulator diguanylate cyclase of
  Pseudomonas aeruginosa, the output of the Wsp surface-sensing chemosensory
  system. It has an N-terminal receiver domain, phosphorylated by the
  histidine kinase WspE, and a C-terminal GGEEF domain that condenses two GTP
  into cyclic di-GMP. Purified WspR makes c-di-GMP and phosphorylation
  stimulates it; product binding at an inhibitory site switches the enzyme
  between active dimers, tetramers and product-inhibited dimers. WspR-derived
  c-di-GMP drives the wrinkly, autoaggregative colony phenotype of wspF
  mutants, promotes exopolysaccharide-dependent biofilm formation and
  suppresses swimming and swarming motility.
references:
- id: PMID:16477007
  title: Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases
    reveals a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: >-
      Extracts of cells overexpressing PA3702 contained 445 pmol c-di-GMP per mg
      wet cell weight, the highest value among the DGCs tested (Table 1; full
      text read on PMC, excerpts in the notes file).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the GO:0052621 IDA seed row. Cached copy is abstract
      only; the full text (PMC1413825) was read on the PMC web page. DGC
      activity was measured as c-di-GMP extracted from cells overexpressing each
      protein; PA3702 gave +(445).
- id: PMID:12426335
  title: Autolysis and autoaggregation in Pseudomonas aeruginosa colony morphology
    mutants.
  findings:
  - statement: wspR insertions suppress the wrinkled colony phenotype of a wspF
      mutant and restore motility; no c-di-GMP or enzyme assay is reported.
    supporting_text: Mutation of wspR completely suppressed colony wrinkledness and
      restored swarming and swimming motility
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      Full text cached and read. Suppressor genetics of colony morphology and
      motility. The paper does not measure c-di-GMP and treats the GGDEF domain
      as a likely nucleotide cyclase only by citation, so it does not support the
      PseudoCAP IMP of GO:0052621 (source defect recorded on that row). It does
      support a role for WspR in repressing motility.
- id: PMID:16186483
  title: A chemosensory system that regulates biofilm formation through modulation
    of cyclic diguanylate levels.
  findings:
  - statement: Purified WspR synthesises c-di-GMP in vitro, stimulated by phosphorylation.
    supporting_text: We determined that purified WspR catalyzed the formation of c-diGMP
      in vitro and phosphorylation stimulated this activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Direct biochemical evidence for WspR DGC activity.
- id: PMID:18366254
  title: Phosphorylation-independent regulation of the diguanylate cyclase WspR.
  findings:
  - statement: WspR activity is modulated by product-driven changes in oligomeric
      state.
    supporting_text: By switching from an active to a product-inhibited dimer via a
      tetrameric assembly, WspR utilizes a novel mechanism for modulation of its activity
      through oligomerization.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Source of the IntAct IPI GO:0042802 row.
