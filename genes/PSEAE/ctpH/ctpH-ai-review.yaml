suggested_questions:
- question: >-
    How does PhoU control Pi detection by CtpH post-transcriptionally, given that CtpH binds Pi directly
    and is constitutively expressed?
suggested_experiments:
- description: >-
    Measure CtpH methylation and Pi taxis in phoU and pstS backgrounds with a CtpH Pi-binding-site mutant,
    to separate direct Pi sensing from PhoU-dependent modulation.
