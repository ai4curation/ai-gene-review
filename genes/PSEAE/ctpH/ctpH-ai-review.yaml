core_functions:
- description: >-
    Inner-membrane chemoreceptor for inorganic phosphate. Its periplasmic ligand binding domain binds
    Pi directly with modest affinity, and the cytoplasmic HAMP and MCP signalling domains relay the signal
    to the CheA-CheW chemosensory array, mediating chemotaxis towards high Pi concentrations.
  supported_by:
  - reference_id: PMID:27353565
    supporting_text: We demonstrate that the ligand binding domain (LBD) of CtpH but not CtpL binds Pi
      directly.
  - reference_id: PMID:10852870
    supporting_text: Computer-assisted capillary assays showed that the ctpH single mutant failed to exhibit
      P(i) taxis when the concentration of P(i) in the capillary was higher than 5 mM.
