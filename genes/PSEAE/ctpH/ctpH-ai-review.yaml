  label: Pseudomonas aeruginosa PAO1
description: >-
  CtpH (PA2561) is a methyl-accepting chemotaxis protein (MCP) of Pseudomonas aeruginosa PAO1 that
  serves as a chemoreceptor for inorganic phosphate (Pi). It is an inner-membrane receptor with two
  transmembrane helices flanking a periplasmic ligand binding domain, followed by a cytoplasmic HAMP
  domain and the MCP signalling domain that couples to the CheA-CheW chemosensory array. The ligand
  binding domain binds Pi directly with modest affinity (KD about 22 uM), and Pi binding induces its
  dimerization; it also binds other pyrophosphate-containing compounds such as ATP and ADP. CtpH is
  constitutively expressed and mediates taxis at high Pi concentrations, whereas the Pho-regulated
  paralogue CtpL mediates taxis at low Pi through the Pi-loaded periplasmic binding protein PstS. PhoU
  has been proposed to exert negative post-transcriptional control on Pi detection by CtpH.
