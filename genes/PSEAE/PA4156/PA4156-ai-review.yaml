  label: Pseudomonas aeruginosa PAO1
description: >-
  FvbA (PA4156) is a TonB-dependent outer-membrane receptor of Pseudomonas aeruginosa PAO1 required for
  the use of the Vibrio cholerae catecholate siderophore vibriobactin as an iron source. It is a close
  homologue of the V. cholerae vibriobactin receptor ViuA, with an N-terminal signal peptide, plug domain
  and TonB-dependent beta-barrel. Expression of fvbA is controlled by the iron regulator Fur, by vibriobactin
  and by the adjacent IclR-type regulator FvbR (PA4157).
