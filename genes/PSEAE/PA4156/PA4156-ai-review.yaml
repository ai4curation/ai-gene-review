  review:
    summary: >-
      Siderophore uptake transmembrane transporter activity from PAINT node PTN004738955 (PTHR30069 TonB-dependent
      siderophore receptor clade, 142 leaves in 21 taxa). Its four IBD seeds are the PAO1 receptors PfeA,
      ChtA (PA4675), FvbA (PA4156) and PirA, each through a PseudoCAP IMP row; the node is assessed in
