- term:
    id: GO:0071281
    label: cellular response to iron ion
  evidence_type: EXP
  original_reference_id: PMID:21546589
  qualifier: involved_in
  review:
    summary: >-
      CollecTF annotation of the Fur target gene fvbA to cellular response to iron ion, from evidence
      that Fur regulates fvbA.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The evidence is that fvbA expression is controlled by Fur (and by vibriobactin and FvbR), which
      makes the gene a Fur target, not a participant in the iron response; the abstract calls these analyses
      preliminary. Iron-regulated expression of a target gene is not by itself a role in responding to
      iron. Fur itself carries the response term.
    supported_by:
    - reference_id: PMID:21546589
      supporting_text: preliminary analyses revealed the involvement of vibriobactin, Fur protein and
        an IclR-type regulator, FvbR (PA4157), in fvbA regulation
