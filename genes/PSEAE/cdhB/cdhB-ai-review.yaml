  proposed_definition: >-
    Catalysis of the reaction: N,N,N-trimethylglycyl-CoA + H2O = glycine
    betaine + CoA + H+.
  justification: >-
    The EC 3.1.2.33 (RHEA:45716) activity is experimentally established for
    CdhB and for the C-terminal region of S. meliloti BcoE-BcoF, but GO has
    only the broader acyl-CoA hydrolase term.
