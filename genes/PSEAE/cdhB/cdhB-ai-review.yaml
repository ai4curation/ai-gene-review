proposed_new_terms:
  - proposed_name: betainyl-CoA thioesterase activity
    proposed_definition: >-
      Catalysis of the reaction: N,N,N-trimethylglycyl-CoA + H2O = glycine
      betaine + CoA + H+.
    justification: >-
      The EC 3.1.2.33 (RHEA:45716) activity is experimentally established for
      CdhB and for the C-terminal region of S. meliloti BcoE-BcoF, but GO has
      only the broader acyl-CoA hydrolase term.
    proposed_parent:
      id: GO:0016289
      label: acyl-CoA hydrolase activity
    supported_by:
      - reference_id: file:PSEAE/cdhB/cdhB-uniprot.txt
        record_section: ["CC:CATALYTIC ACTIVITY"]
        supporting_text: >-
          Reaction=N,N,N-trimethylglycyl-CoA + H2O = glycine betaine + CoA +
          H(+);
