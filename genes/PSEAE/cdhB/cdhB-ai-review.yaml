  review:
    summary: >-
      CdhB has established betainyl-CoA hydrolysis chemistry; this reaction fits acyl-CoA hydrolase activity,
      while additional fatty-acyl-CoA activity remains unresolved.
    action: MODIFY
    reason: >-
      The publication-linked curated CdhB reaction releases glycine betaine from betainyl-CoA and is positively
      captured by GO:0016289. Retain MODIFY as a generalization to the supported target chemistry, not
      as evidence that CdhB cannot hydrolyze additional fatty-acyl substrates. Actual PTN001273712 includes
      CdhB; target placement is established. The alternate physiological substrate does not identify an
      evolutionary loss or justify pruning the ancestral fatty-acyl assertion to FadM. Its applicability
      as a secondary activity remains unresolved without a target substrate-range assay.
    proposed_replacement_terms:
    - id: GO:0016289
      label: acyl-CoA hydrolase activity
    supported_by:
