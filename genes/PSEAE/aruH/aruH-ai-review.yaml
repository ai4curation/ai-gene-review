taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AruH (PA4976) is a homodimeric class I pyridoxal 5'-phosphate-dependent
  aminotransferase of Pseudomonas aeruginosa that catalyses the first step of the
  arginine transaminase (ATA) pathway of L-arginine catabolism. It transfers the
  alpha-amino group of L-arginine to pyruvate, giving 2-ketoarginine
  (5-guanidino-2-oxopentanoate) and L-alanine (EC 2.6.1.84), by a ping-pong
  mechanism with a pH optimum of 9. It also accepts L-lysine, L-methionine,
  L-leucine, ornithine and L-glutamine as amino donors. The 2-ketoarginine is then
  decarboxylated by AruI, encoded in the same operon. The aruHI operon is induced by
  L-arginine through the AruRS two-component system, and the ATA pathway serves as
  the second aerobic arginine utilization route alongside the arginine
  succinyltransferase (AST) pathway.
references:
- id: PMID:17416668
  title: Characterization of an arginine:pyruvate transaminase in arginine catabolism
    of Pseudomonas aeruginosa PAO1.
  findings:
  - statement: Purified AruH converts L-arginine and pyruvate to 2-ketoarginine and
      L-alanine.
    supporting_text: High-performance liquid chromatography and mass spectrometry
      (MS) analyses were employed to detect the presence of the transamination products
      2-ketoarginine and L-alanine, thus demonstrating the proposed biochemical reaction
      catalyzed by AruH
  - statement: Broad amino-donor specificity.
    supporting_text: it has a novel substrate specificity with an order of preference
      of Arg > Lys > Met > Leu > Orn > Gln
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP (and UniProt) source for the transaminase IDA, the seed of the
      PTN002482828 IBD. Abstract only in cache; the abstract states the purified
      enzyme assay and product identification outright.
- id: PMID:17416670
  title: Functional genomics enables identification of genes of the arginine transaminase
    pathway in Pseudomonas aeruginosa.
  findings:
  - statement: aruH knockout abolishes the arginine-inducible arginine:pyruvate transaminase
      activity and arginine utilization in an aruF background.
    supporting_text: This ATase activity was abolished when an aruH knockout was introduced
      into the strain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; genetic basis of the IMP arginine catabolism row.
