suggested_questions:
- question: >-
    Should GO have an arginine:pyruvate transaminase (EC 2.6.1.84) term under
    GO:0047635, given that RHEA:13833 is currently only a narrowMatch of the broader
    alanine:oxo-acid transaminase term?
- question: >-
    Does AruH contribute to lysine catabolism in vivo, given that L-lysine is its
    second-best amino donor?
suggested_experiments:
- description: >-
    Test growth of aruH and aruF aruH mutants on L-lysine and L-methionine as sole
    carbon or nitrogen sources to judge whether the broad donor range is physiological.
