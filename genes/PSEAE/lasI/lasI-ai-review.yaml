  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:10096
  - EC:2.3.1.184
  review:
    summary: Combined IEA from the EC 2.3.1.184 / Rhea:10096 assignment.
    action: ACCEPT
    reason: >-
      Core activity. Purified LasI made 3-oxo-C12-HSL from acyl-ACP and SAM in a reconstituted
