taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  lasI (PA1432) encodes the LuxI-family acyl-homoserine-lactone synthase of Pseudomonas
  aeruginosa (EC 2.3.1.184), a 201-residue cytoplasmic enzyme that makes the diffusible autoinducer
  N-(3-oxododecanoyl)-L-homoserine lactone (3-oxo-C12-HSL). It takes the homoserine lactone
  ring from S-adenosyl-L-methionine and the acyl chain from 3-oxododecanoyl-acyl carrier protein
  supplied by fatty acid synthesis, releasing 5'-methylthioadenosine and holo-ACP. Its crystal
  structure shows a GNAT-like beta-sheet platform with a V-shaped substrate cleft, an acyl-chain
  tunnel and an acyl-ACP binding surface. 3-oxo-C12-HSL diffuses between cells and, above a
  threshold concentration, binds the receptor and transcription factor LasR, which activates
  lasB (elastase) and other virulence genes, rhlR/rhlI, and lasI itself. LasI thus makes the
  signal at the top of the las quorum-sensing hierarchy; LasR receives and transduces it.
existing_annotations:
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002217335
  - UniProtKB:P33883
  review:
    summary: >-
      IBA from PTN002217335 (5 leaf IBAs: lasI, rhlI, Yersinia yspI and ypeI, Bradyrhizobium bjaI),
      whose IBD has one seed, this gene's PseudoCAP IDA to PMID:8493556. The target appearing in
      its own WITH/FROM is expected.
    action: MODIFY
    reason: >-
      The node's leaves are LuxI-family AHL synthases. They make the diffusible signal; they
      do not receive or relay it. GO restricts signal transduction to events that begin with
      signal reception and, for signalling between cells, to the receiving cell, which here
      is LasR. The process these synthases do take part in is quorum sensing, whose definition
      includes producing the signal molecule. Other autoinducer synthases carry quorum sensing
      with experimental evidence (ainS G3FB25 IDA; luxS P45578 IMP). The correction is lateral:
      quorum sensing is not a descendant of signal transduction.
    proposed_replacement_terms:
    - id: GO:0009372
      label: quorum sensing
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P33883
        source_label: lasI
        source_status: SOURCE_BAD
        comment: >-
          The sole seed is this gene's PseudoCAP IDA to PMID:8493556, which shows LasI makes the
          autoinducer (signal producer), annotated as signal transduction (a receiving-cell process).
      residue_claims_not_applicable: >-
        Term-choice error in the seed, not a question of residue conservation; all leaves are
        LuxI-family synthases.
    supported_by:
    - reference_id: PMID:8278364
      supporting_text: >-
        A diffusible signal molecule, the P. aeruginosa autoinducer (PAI), produced by the bacterial
        cell and released into the growth medium, is required for activity of LasR.
    - reference_id: PMID:15306017
      supporting_text: >-
        the acyl-homoserine lactone (AHL) synthase LasI that produces 3-oxo-C12-AHL from the
        substrates 3-oxo-C12-acyl-carrier protein (acyl-ACP) and S-adenosyl-L-methionine
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN002217335
      requested_change: REPOINT
      asserted_value: GO:0007165
      corrected_value: GO:0009372
      corrected_label: quorum sensing
      confidence: PROBABLE
      explanation: >-
        The GO:0007165 signal transduction IBD at PTN002217335 (LuxI-family AHL synthases; leaves
        P. aeruginosa LasI and RhlI, Yersinia YspI and YpeI, Bradyrhizobium BjaI) has one seed, the
        PseudoCAP IDA on LasI to PMID:8493556. These enzymes synthesise the diffusible autoinducer;
        GO:0007165 is restricted to events at and within the receiving cell, starting with signal
        reception (LuxR-type receptors). Please re-term the IBD to GO:0009372 quorum sensing, whose
        definition includes producing the signal molecule and which other autoinducer synthases
        carry experimentally (ainS G3FB25, luxS P45578). The node MF GO:0061579 is correct.
      supported_by:
      - reference_id: PMID:8493556
        supporting_text: >-
          The lasl gene is involved in the synthesis of a diffusible molecule termed Pseudomonas
          autoinducer (PAI).
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IDA
  original_reference_id: PMID:8493556
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA; sole seed of the PTN002217335 IBD. Passador et al. (1993) show with gene
      fusions that lasI is needed for high-level elastase expression and is involved in synthesis
      of the diffusible autoinducer PAI.
    action: MODIFY
    reason: >-
      The paper is right for this gene, but the term is not. The abstract shows that lasI is
      needed to make a diffusible signal that LasR requires, which places LasI in quorum sensing
      as the signal producer. It does not show LasI acting in signal transduction, which GO restricts
      to the receiving cell. The evidence is genetic (gene fusions and the mutant phenotype),
      so IDA is also the wrong code; IMP fits.
    proposed_replacement_terms:
    - id: GO:0009372
      label: quorum sensing
    supported_by:
    - reference_id: PMID:8493556
      supporting_text: >-
        Experiments with gene fusions show that gene lasl is essential for high expression of
        elastase. The lasl gene is involved in the synthesis of a diffusible molecule termed
        Pseudomonas autoinducer (PAI).
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0007165
      corrected_value: GO:0009372
      corrected_label: quorum sensing
      confidence: PROBABLE
      explanation: >-
        involved_in GO:0007165 signal transduction (IDA, PMID:8493556) on PA1432 lasI. LasI is the
        autoinducer synthase: the paper shows lasI is needed to make the diffusible Pseudomonas
        autoinducer that LasR requires for elastase expression. GO:0007165 covers events at and
        within the receiving cell, starting with signal reception (LasR), so it does not apply
        to the synthase. Please re-term to GO:0009372 quorum sensing, whose definition includes
        producing the signal. The evidence is gene fusions and mutant phenotype, so IMP fits
        better than IDA. This row is the sole seed of the PANTHER IBD at PTN002217335.
      supported_by:
      - reference_id: PMID:8493556
        supporting_text: >-
          The lasl gene is involved in the synthesis of a diffusible molecule termed Pseudomonas
          autoinducer (PAI).
