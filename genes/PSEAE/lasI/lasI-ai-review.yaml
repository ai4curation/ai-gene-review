core_functions:
- description: >-
    Acyl-ACP-dependent N-acyl-homoserine-lactone synthase that makes the las autoinducer
    3-oxo-C12-HSL from 3-oxododecanoyl-ACP and S-adenosyl-L-methionine, supplying the diffusible
    signal of the LasR quorum-sensing system.
  molecular_function:
    id: GO:0061579
    label: N-acyl homoserine lactone synthase activity
  directly_involved_in:
  - id: GO:0009372
    label: quorum sensing
  supported_by:
  - reference_id: PMID:12480888
    supporting_text: >-
      In the presence of excess protein, substrates and cofactors, this system produced almost
      exclusively 3-oxo-C(12)-HSL.
  - reference_id: PMID:8278364
    supporting_text: >-
      Chemical analyses indicated the purified material was 3-oxo-N-(tetrahydro-2-oxo-3-furanyl)dodecanamide.
  - reference_id: PMID:8493556
    supporting_text: >-
      PAI provides P. aeruginosa with a means of cell-to-cell communication that is required
      for the expression of virulence genes
suggested_questions:
- question: >-
    Should LuxI-family AHL synthases, as signal producers, be annotated to GO:0009372 quorum
    sensing rather than GO:0007165 signal transduction across PANTHER PTHR39322? The same family-level
    signal transduction annotation also reaches RhlI, LuxI and TraI by IBA or TreeGrafter IEA.
- question: >-
    Is a dedicated process term for N-acyl homoserine lactone biosynthesis wanted in GO, or is
    GO:0061579 plus quorum sensing enough?
suggested_experiments:
- description: >-
    Determine steady-state kinetics of purified LasI with 3-oxo-C12-ACP versus 3-oxo-C12-CoA
    and shorter acyl-ACPs, to quantify acyl-donor and chain-length specificity in vitro.
