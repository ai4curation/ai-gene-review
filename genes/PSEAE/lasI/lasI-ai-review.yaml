- id: PMID:8493556
  title: Expression of Pseudomonas aeruginosa virulence genes requires cell-to-cell communication.
  findings:
  - statement: >-
      lasI is required for high-level elastase expression and for synthesis of the diffusible
      autoinducer PAI.
    supporting_text: >-
      The lasl gene is involved in the synthesis of a diffusible molecule termed Pseudomonas
      autoinducer (PAI).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Passador et al. 1993, Science). Genetic evidence that lasI makes the
      autoinducer; it supports quorum sensing (signal production) for LasI, not signal transduction,
      and the evidence is IMP-type rather than IDA. Sole seed of PTN002217335.
  full_text_unavailable: true
- id: PMID:8278364
  title: Structure of the autoinducer required for expression of Pseudomonas aeruginosa virulence
    genes.
  findings:
  - statement: >-
      The autoinducer made by P. aeruginosa, or by E. coli carrying lasI, is 3-oxo-C12-HSL.
    supporting_text: >-
      Chemical analyses indicated the purified material was 3-oxo-N-(tetrahydro-2-oxo-3-furanyl)dodecanamide.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifies the LasI product.
- id: PMID:12480888
  title: Beta-ketoacyl acyl carrier protein reductase (FabG) activity of the fatty acid biosynthetic
    pathway is a determining factor of 3-oxo-homoserine lactone acyl chain lengths.
  findings:
  - statement: >-
      A reconstituted system with purified Fab enzymes, ACP and LasI makes almost only 3-oxo-C12-HSL.
    supporting_text: >-
      In the presence of excess protein, substrates and cofactors, this system produced almost
      exclusively 3-oxo-C(12)-HSL.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct in vitro activity of purified LasI; basis for the NEW IDA.
  full_text_unavailable: true
- id: PMID:15306017
  title: Structure of the Pseudomonas aeruginosa acyl-homoserinelactone synthase LasI.
  findings:
  - statement: >-
      Crystal structure of LasI; acyl-chain tunnel and acyl-ACP binding surface (Arg154, Lys150).
    supporting_text: >-
      Analysis of AHL-synthase surface residues identified a binding site for acyl-ACP, a role
      that was supported by in vivo reporter assay analysis of the mutated residues, including
      Arg154 and Lys150.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structural basis of LasI substrate recognition.
  full_text_unavailable: true
