description: TssK1 is the baseplate component of the Pseudomonas aeruginosa H1-T6SS that connects the cytoplasmic baseplate to the TssJLM membrane complex. It acts as a spatio-temporal marker for assembly of the contractile TssB1-TssC1 apparatus, a role that depends on TssM1.
