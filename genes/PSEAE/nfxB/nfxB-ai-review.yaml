- term:
    id: GO:0032410
    label: negative regulation of transporter activity
  evidence_type: IMP
  original_reference_id: PMID:20373734
  qualifier: involved_in
  review:
    summary: PseudoCAP IMP from a study of the global physiology of an nfxB mutant.
    action: REMOVE
    reason: The abstract attributes the nfxB mutant phenotypes to overexpression of the MexCD-OprJ pump;
      NfxB lowers the amount of pump by repressing its operon, not its activity.
    supported_by:
    - &id006
      reference_id: PMID:20373734
      supporting_text: suggesting that inappropriate overexpression of a functional MexCD-OprJ efflux
        pump causes pleiotropic changes
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0032410
      cause: OTHER
      confidence: PROBABLE
      explanation: 'PseudoCAP IMP row for PA4600/nfxB, GO:0032410 negative regulation of transporter activity,
        from PMID:20373734 (Stickland et al. 2010). GO:0032410 is a process that reduces the activity
        of a transporter. The abstract attributes the nfxB mutant phenotypes to inappropriate overexpression
        of the MexCD-OprJ pump. That is regulation of gene expression, not of transporter activity. Requested
        change: delete the row; the transcriptional role is already annotated (GO:0045892). Abstract-only
        reading; the full text could in principle report a post-translational effect, which would be unprecedented
        for a TetR repressor.'
      supported_by:
      - *id006
