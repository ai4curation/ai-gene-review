gene_symbol: nfxB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: NfxB (PA4600) is a TetR-family transcriptional repressor of Pseudomonas aeruginosa that controls
  the divergently transcribed mexC-mexD-oprJ operon, encoding the MexCD-OprJ RND multidrug efflux pump,
  and its own gene. The functional repressor is the 199-residue form translated from an upstream start
  codon. NfxB binds as a tetramer (a dimer of dimers, assembled through a C-terminal three-helix subdomain)
  to a region upstream of the mexCD-oprJ transcription start that contains two inverted repeats, and its
  N-terminal helix-turn-helix domain contacts the DNA. Loss-of-function nfxB mutations, which arise readily
  under fluoroquinolone selection and in cystic fibrosis isolates, derepress mexCD-oprJ and confer resistance
  to fluoroquinolones and other antimicrobials; many further phenotypes of nfxB mutants (reduced motility,
  virulence-factor production and fitness) are secondary consequences of pump overexpression.
