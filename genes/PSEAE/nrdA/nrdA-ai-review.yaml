  label: Pseudomonas aeruginosa PAO1
description: >-
  NrdA (PA1156) is the 963-residue large (alpha, R1) subunit of the aerobic class Ia ribonucleotide
  reductase (RNR) of Pseudomonas aeruginosa PAO1, one of the three RNR classes (Ia, II and III) the
  organism encodes. NrdA carries the catalytic site that reduces ribonucleoside diphosphates to
  2'-deoxyribonucleoside diphosphates, the allosteric specificity site, and an atypical duplicated
  N-terminal ATP-cone. Only the first ATP-cone is allosterically functional, binding ATP or dATP to
  regulate overall activity. NrdA forms an exceptionally tight complex with the radical-generating NrdB
  (beta, R2) subunit, suggested to be alpha4beta4, and so supplies deoxyribonucleotides for DNA
  synthesis.
