- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001279639
  - UniProtKB:O35002
  - UniProtKB:Q9HU50
  - UniProtKB:Q9HYY3
  review:
    summary: >-
      IBA from PTN001279639, seeded by B. subtilis CtpB (O35002), P. aeruginosa Prc (Q9HYY3) and
      PA5134 itself. PA5134's own seed row cites an S. aureus paper and is removed in this review.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      No evidence seen here places CtpA in a signalling pathway. The remaining seeds are paralogous
      CTPs (CtpB, Prc) that each cleave an anti-sigma factor; that role does not transfer to CtpA
      without its own evidence, and the IBA reached PA5134 partly through its own mis-referenced
      seed. The tree (panther_tree.py, 2026-11-05) shows those two seeds lie on opposite sides of the
      duplication that defines this node - Prc in the SF22 branch, CtpB in a 2-leaf SF29 Bacillus
      clade - while PA5134 is SF30, so the term is held at the family root rather than at either
      lineage that supports it.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - SOURCE_MISCITATION
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001279639
        source_label: PTN001279639
        source_status: UNRESOLVED
        comment: >-
          Node spanning Prc-type and CtpA-type CTP subfamilies (58 leaves, 32 taxa). The topology
          (panther_tree.py, 2026-11-05) shows PTN001279639 is the DUPLICATION that separates the SF22
          Prc branch (PTN004918760, 9 leaves) from the SF29/SF30 CtpA branch (PTN008644010, 49 leaves).
          Signal transduction is supported for CtpB (SF29) and Prc (SF22), which sit on opposite sides
          of that duplication, so the term was placed at their common ancestor - the root of the family
          - and reaches the whole SF30 CtpA clade that holds PA5134.
      - source_id: UniProtKB:O35002
        source_label: B. subtilis CtpB
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: CtpB cleaves SpoIVFA in sigma-K activation; sound for CtpB.
      - source_id: UniProtKB:Q9HYY3
        source_label: P. aeruginosa Prc
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Prc removes the periplasmic anti-sigma domain in cell-surface signalling; sound for Prc.
      - source_id: UniProtKB:Q9HU50
        source_label: PA5134 (self; PseudoCAP IDA PMID:24928312)
        source_status: SOURCE_BAD
        comment: Self-seed cites a Staphylococcus aureus paper with no signalling data.
    source_defects:
    - defect_type: OTHER
      resource: GO_CENTRAL
      record: PANTHER:PTN001279639
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0007165
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The PAINT IBD for signal transduction on PTN001279639 rests on three seeds. The PA5134 seed
        cites PMID:24928312, a Staphylococcus aureus CtpA paper (CONFIRMED wrong reference), so
        UniProtKB:Q9HU50 should be dropped from the WITH/FROM - not because a gene in its own
        WITH/FROM is circular, which it is not, but because that seed annotation is itself defective.
        The topology was checked with projects/PSEUDOCAP/panther_tree.py on 2026-11-05 and confirms the
        scoping problem. PTN001279639 is a DUPLICATION node with 58 leaves spanning three subfamilies
        (PTHR32060:SF22 9, SF29 2, SF30 47) and exactly two children: PTN004918760 (SPECIATION,
        Eubacteria, 9 leaves, all SF22 - the Prc/tail-specific protease branch, holding P. aeruginosa
        Prc Q9HYY3 and, in PTN002078873, E. coli Prc/Tsp P23865) and PTN008644010 (SPECIATION,
        Eubacteria, 49 leaves, SF29+SF30 - the CtpA branch). The two sound seeds straddle that
        duplication: `--contains Q9HYY3,P23865` returns PTN000786025 (Gammaproteobacteria Prc, 8
        leaves, SF22), while B. subtilis CtpB (O35002) is SF29 in the 2-leaf Bacillus clade
        PTN002078920 inside PTN008644010. PA5134 is SF30, in the Gammaproteobacteria clade PTN002078922
        (6 leaves). The term is therefore asserted at the family root to cover two seeds in different
        subfamilies, and propagates to all 58 leaves, including the entire SF30 CtpA clade and E. coli
        Prc/Tsp, for which no signalling role is on record. Please move the term to the clades that
        support it: PTN000786025 (or PTN004918760) for the Prc lineage and PTN002078920 for CtpB, and
        remove it from PTN001279639.
