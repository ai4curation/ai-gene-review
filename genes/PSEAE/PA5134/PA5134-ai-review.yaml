  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5134 encodes CtpA, a 436-residue carboxyl-terminal processing protease (CTP) of the peptidase
  S41A family in Pseudomonas aeruginosa PAO1, one of two CTPs in the genome alongside Prc (PA3257).
  It has a Sec signal peptide, a PDZ domain and an S41 serine-protease domain, and is a soluble
  periplasmic protein. A ctpA null mutant grows normally in the laboratory but has phenotypes consistent
  with an altered cell envelope, a defective type III secretion system, reduced cytotoxicity and attenuated
  virulence in a mouse acute pneumonia model, while raising CtpA levels induces an extracytoplasmic
  function sigma factor regulon. Its physiological substrates are not defined by the sources reviewed
  here.
