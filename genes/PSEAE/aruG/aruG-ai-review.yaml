id: P80358
gene_symbol: aruG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  aruG (PA0897) encodes the beta chain of the arginine and ornithine N2-succinyltransferase of Pseudomonas
  aeruginosa PAO1 (EC 2.3.1.109), an acyl-CoA N-acyltransferase-fold protein of the AstA family. Together
  with its paralogous partner AruF (P80357) it forms a heterotetramer with two chains of each type that
  transfers succinyl from succinyl-CoA to L-arginine or L-ornithine, the first reaction of the arginine
  succinyltransferase (AST) pathway, the main route of aerobic arginine and ornithine utilization. The
  enzyme follows Michaelis-Menten kinetics with arginine but is allosteric with ornithine and is inhibited
  by spermidine. The gene lies in the ArgR-controlled aruCFGDB operon.
