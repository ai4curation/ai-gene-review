id: P80358
gene_symbol: aruG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AruG (PA0897) is the beta subunit of the arginine and ornithine
  N2-succinyltransferase of Pseudomonas aeruginosa, a heterotetramer of AruF (AstA)
  and AruG subunits that catalyses the first step of the arginine
  succinyltransferase (AST) pathway, transferring the succinyl group of
  succinyl-CoA to L-arginine (and L-ornithine) to form N2-succinylarginine. The
  gene lies in the ArgR-controlled aruCFGDB operon, which is induced by arginine and
  enables aerobic use of arginine and ornithine. AruG has a GNAT-like acyl-CoA
  N-acyltransferase fold (Pfam AstA) and is a paralog of AruF.
