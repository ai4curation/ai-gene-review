  review:
    summary: >-
      Arginine N-succinyltransferase activity from InterPro/EC/Rhea mapping, with the enables qualifier
      on a single chain.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The purified P. aeruginosa enzyme is a heterotetramer of two different chains, aruG encoding the
      beta chain with AruF (P80357) as partner. The activity is that of the complex; this chain contributes
      to it rather than enabling it alone. Treated identically for the KT2440 AstA-I/AstA-II chains.
    supported_by:
