- id: PMID:16593724
  title: N-Succinylated intermediates in an arginine catabolic pathway of Pseudomonas
    aeruginosa.
  findings:
  - statement: The AST pathway, starting with arginine succinylation, was established
      by crude-extract enzyme assays.
    supporting_text: >-
      Enzyme assays with crude P. aeruginosa extracts established the following
      pathway
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. PseudoCAP IDA source of the L-arginine catabolic process rows for
      astA, aruG and astB, which seed PTN000764516. The paper predates cloning of the
      aru genes, so it supports the pathway rather than naming these loci; the term is
      correct for each gene, so no defect is recorded.
- id: PMID:7523119
  title: Purification and properties of a succinyltransferase from Pseudomonas aeruginosa
    specific for both arginine and ornithine.
  findings:
  - statement: The purified succinyltransferase is a heterotetramer of two different
      subunits.
    supporting_text: >-
      After SDS/PAGE two subunits of 35 kDa and 37 kDa were evident, indicating that
      the enzyme is a heterotetramer.
  - statement: The enzyme acts in aerobic utilization of arginine and ornithine.
    supporting_text: >-
      a bifunctional enzyme involved in the aerobic utilization of arginine and
      ornithine, has been purified to homogeneity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Purified-enzyme characterization (kinetics, subunit N-terminal
      sequences) that defines the AruF and AruG accessions. Not cited in GOA but the
      best direct evidence for the succinyltransferase activity.
- id: PMID:9393691
  title: Cloning and characterization of the aru genes encoding enzymes of the catabolic
    arginine succinyltransferase pathway in Pseudomonas aeruginosa.
  findings:
  - statement: aruF and aruG encode the two subunits of the arginine/ornithine
      succinyltransferase.
    supporting_text: >-
      the aruF and aruG genes encode the subunits (AruAI and AruAII) of arginine and
      ornithine N2-succinyltransferases
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Gene assignment for the aru cluster.
