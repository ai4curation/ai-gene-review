- term:
    id: GO:0009015
    label: N-succinylarginine dihydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000764516
  - UniProtKB:P76216
  review:
    summary: >-
      PAINT IBA of N-succinylarginine dihydrolase activity, seeded only by E. coli AstB, propagated to
      the transferase chain because PTN000764516 spans both PTHR30420 subfamilies.
    action: REMOVE
    reason: >-
      This protein is the beta chain of arginine/ornithine N-succinyltransferase (Pfam AstA, an acyl-CoA
      N-acyltransferase), not a dihydrolase. P. aeruginosa encodes the dihydrolase separately as aruB
      in the same operon. The IBD sits too deep for this term.
    supported_by:
    - *id001
    - &id003
      reference_id: file:PSEAE/aruG/aruG-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF04958; AstA; 1.
    - reference_id: PMID:9393691
      supporting_text: >-
        The aruR, aruC, aruD, aruB, and aruE genes specify the ArgR regulatory protein, N2-succinylornithine
        5-aminotransferase, N-succinylglutamate 5-semialdehyde dehydrogenase, N2-succinylarginine dihydrolase,
        and N-succinylglutamate desuccinylase, respectively
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000764516
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Node covers both the AstA transferase (SF1) and AstB dihydrolase (SF2) subfamilies; the dihydrolase
          IBD belongs on the SF2 clade.
      - source_id: UniProtKB:P76216
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: E. coli AstB is a genuine dihydrolase of a different fold.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000764516
      requested_change: CHECK
      asserted_value: GO:0009015
      cause: OVER_PROPAGATION
      confidence: CONFIRMED
      explanation: >-
        The GO:0009015 IBD at PTN000764516 (seed P76216, E. coli AstB) also reaches the PTHR30420:SF1
        arginine N-succinyltransferases (P0AE37, P80357, P80358). Move the IBD to the SF2 dihydrolase
        clade or block it in SF1.
