- term:
    id: GO:0009015
    label: N-succinylarginine dihydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000764516
  - UniProtKB:P76216
  review:
    summary: >-
      IBA from PTN000764516, seeded only by E. coli AstB (P76216), the dihydrolase.
      AruG is the succinyltransferase beta subunit and has no dihydrolase activity.
    action: REMOVE
    reason: >-
      Wrong activity. PANTHER PTHR30420 groups two unrelated enzyme families: the AstB
      dihydrolases (SF2, Pfam AstB) and the AstA/AruG succinyltransferases (SF1, Pfam
      AstA, GNAT-like). The dihydrolase IBD was placed at PTN000764516, which spans
      both, so the step-2 activity is propagated to the step-1 enzyme. The leaf GAF
      shows the same IBA on all seven AstA-type leaves in the node. The node-level
      GO_CENTRAL defect is recorded once, on astA (PA0896).
    supported_by:
    - reference_id: PMID:9393691
      supporting_text: >-
        the aruF and aruG genes encode the subunits (AruAI and AruAII) of arginine and
        ornithine N2-succinyltransferases
    - reference_id: file:PSEAE/aruG/aruG-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: PF04958; AstA
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000764516
        source_label: PTN000764516
        source_status: SOURCE_BAD
        comment: >-
          Root of PTHR30420, covering both SF1 (AstA/AruG succinyltransferases, 53
          members) and SF2 (AstB dihydrolases, 138 members). GO:0009015 suits SF2 only.
      - source_id: UniProtKB:P76216
        source_label: E. coli AstB (sole seed, IDA PMID:15703173)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Valid dihydrolase evidence for AstB; does not transfer to AruG.
