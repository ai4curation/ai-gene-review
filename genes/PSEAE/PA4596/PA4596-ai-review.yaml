id: Q9HVJ0
gene_symbol: PA4596
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4596, renamed EsrC (envelope stress-regulated repressor of mexCD-oprJ), is a
  TetR-family transcriptional repressor encoded downstream of oprJ in the
  nfxB-mexC-mexD-oprJ multidrug efflux locus. Purified EsrC binds a DNA fragment
  carrying the mexCD-oprJ promoter. Its loss has no effect on mexCD-oprJ expression
  in unstressed cells but raises it more than 10-fold under envelope stress, so EsrC
  moderates envelope stress-induced expression of the MexCD-OprJ efflux pump. esrC
  is itself induced by envelope stress through the AlgU sigma factor and is
  repressed by NfxB, the primary mexCD-oprJ repressor, and EsrC repressor activity
  appears to depend on NfxB. The annotated 172-residue product may lack the
  N-terminal part of the TetR helix-turn-helix domain because of a misassigned start
  codon.
gene_model_issues:
- issue_type: WRONG_START_SITE
  status: SUSPECTED
  description: >-
    The annotated 172-aa product begins within the TetR HTH domain and has no
    PF00440/IPR001647 match. The reading frame stays open 93 codons upstream, the
    residues immediately upstream resemble TetR helix 1, and 70 of 73 UniRef50
    members are 180 aa or longer. The true start is probably upstream, which would
    restore helix 1 of the DNA-binding domain. It does not change the GO calls.
  evidence_types:
  - DOMAIN_ARCHITECTURE
  - ORTHOLOG_COMPARISON
  - GENOMIC_SEQUENCE
  supported_by:
  - reference_id: file:PSEAE/PA4596/PA4596-bioinformatics/RESULTS.md
    supporting_text: the annotated start codon probably truncates the N-terminus of the
      HTH domain
