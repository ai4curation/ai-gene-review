  - statement: Purified PA4596 binds the mexCD-oprJ promoter region.
    supporting_text: the purified protein was able to bind to a DNA fragment carrying
      the mexCD-oprJ promoter region
  - statement: EsrC repressor activity may depend on NfxB.
    supporting_text: suggesting that PA4596 repressor activity may be dependent on NfxB
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
