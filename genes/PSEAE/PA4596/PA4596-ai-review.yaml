suggested_questions:
- question: >-
    Where is the true translation start of PA4596, and does the annotated 172-aa
    model lack TetR HTH helix 1?
- question: >-
    Does EsrC repress mexCD-oprJ by binding a site distinct from NfxB, or by forming
    a complex with NfxB on the promoter?
suggested_experiments:
- description: >-
    N-terminal proteomics or ribosome profiling of PAO1 to map the PA4596 start
    codon, followed by DNase I footprinting of EsrC on the mexCD-oprJ promoter with
    and without NfxB.
  experiment_type: footprinting and start-site mapping
