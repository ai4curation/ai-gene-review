- description: TetR-family repressor that binds a palindromic operator in the mexZ-mexX intergenic region
    and represses the mexXY multidrug efflux operon; the repression is relieved when the antibiotic-induced
    anti-repressor ArmZ binds the MexZ DNA-binding domain.
