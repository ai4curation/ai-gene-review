- term:
    id: GO:0032410
    label: negative regulation of transporter activity
  evidence_type: IMP
  original_reference_id: PMID:15105120
  qualifier: involved_in
  review:
    summary: PseudoCAP IMP from a study of mexZ alterations in aminoglycoside-resistant CF isolates. Complementation
      with mexZ lowered MICs and MexY overproduction is associated with mexZ alterations.
    action: REMOVE
    reason: GO:0032410 is a process that reduces the activity of a transporter. MexZ represses transcription
      of mexXY and so lowers the amount of the pump. The abstract itself names mexZ as the repressor gene
      of the operon and gives no sign that MexZ acts on the MexXY protein. The correct process is captured
      by the negative regulation of transcription rows and by GO:1905700.
    supported_by:
    - &id007
      reference_id: PMID:15105120
      supporting_text: Alterations in mexZ, the repressor gene of operon mexXY, were found in all of the
        AG-resistant CF isolates
    - &id008
      reference_id: PMID:15105120
      supporting_text: Complementation of these bacteria with a plasmid-borne mexZ gene dramatically reduced
        the MICs of AGs
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0032410
      cause: OTHER
      confidence: PROBABLE
      explanation: 'PseudoCAP IMP row for PA2020/mexZ, GO:0032410 negative regulation of transporter activity,
        from PMID:15105120 (Vogne et al. 2004). The abstract describes mexZ as the repressor gene of the
        mexXY operon, with MexY overproduced in mexZ mutants and MICs reduced by mexZ complementation.
        That is regulation of transporter gene expression, not of transporter activity. Requested change:
        delete the row; the transcriptional role is already annotated (GO:0045892), and the transport
        consequence fits GO:1905700. Abstract-only reading; the full text could in principle report a
        post-translational effect.'
      supported_by:
      - *id007
