id: G3XCU9
gene_symbol: mexZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: MexZ (PA2020) is a TetR-family transcriptional repressor that controls the mexXY operon,
  encoding the MexXY multidrug efflux pump that gives Pseudomonas aeruginosa intrinsic resistance to aminoglycosides.
  MexZ binds as a dimer to a 20-bp palindromic operator in the mexZ-mexX intergenic region and represses
  mexXY. Ribosome-targeting antibiotics induce the anti-repressor ArmZ (PA5471), which binds the N-terminal
  DNA-binding domain of MexZ, reduces MexZ binding to DNA and so derepresses mexXY. mexZ is among the
  genes most frequently mutated in cystic fibrosis isolates, where its loss causes MexXY overproduction
  and moderate aminoglycoside resistance.
