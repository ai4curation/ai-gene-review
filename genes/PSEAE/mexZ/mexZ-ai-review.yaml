  - *id002
  - *id009
suggested_questions:
- question: Does MexZ bind any small-molecule ligand in its C-terminal domain, or is it regulated solely
    by protein interaction with ArmZ?
- question: Which other promoters, besides mexXY and its own, does MexZ regulate in vivo?
suggested_experiments:
- description: ChIP-seq of MexZ in PAO1 with and without sub-inhibitory aminoglycoside, and a ligand screen
    (thermal shift) on purified MexZ.
  experiment_type: ChIP-seq and ligand screening
