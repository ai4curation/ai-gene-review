  evidence_type: IMP
  original_reference_id: PMID:18178733
  qualifier: involved_in
  review:
    summary: >-
      The wapR mutant's LPS lacks O antigen because the capped core lacks the alpha-1,3-L-Rha to which
      O antigen is attached. WapR builds the acceptor; it does not synthesise O antigen.
    action: REMOVE
    reason: >-
      The abstract states both facts: the mutant LPS lacks O antigen, and its capped core is truncated
      and lacks alpha-1,3-L-Rha, which is the linkage through which O antigen caps the core. Loss of O
      antigen from LPS is therefore a downstream effect of the missing acceptor (O antigen is polymerised
      separately and ligated to the completed core by WaaL), not participation in O antigen biosynthesis.
      The correct process, LPS core biosynthesis, is already on the gene.
