id: Q9HUG5
gene_symbol: wapR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WapR (PA5000) is a GT2-family glycosyltransferase that adds the alpha-1,3-linked L-rhamnose to the outer
  core oligosaccharide of Pseudomonas aeruginosa lipopolysaccharide. This rhamnose forms the attachment
  point of the O antigen, so WapR makes the capped core glycoform; the paralogue MigA adds alpha-1,6-L-Rha
  to the uncapped glycoform. A wapR mutant has a truncated capped core lacking alpha-1,3-L-Rha and as
  a result its LPS carries no O antigen; complementation restores O-antigen capping. wapR is negatively
  regulated by RhlR/RhlI quorum sensing, and its expression level correlates with the amount of O-antigen-capped
  core. Core truncation in the mutant secondarily alters motility, surface attachment and biofilm mechanics.
