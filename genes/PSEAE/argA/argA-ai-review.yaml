id: P22567
gene_symbol: argA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ArgA (PA5204) is the classical bacterial N-acetylglutamate synthase (NAGS, EC 2.3.1.1). It catalyses
  the first step of L-arginine biosynthesis, the transfer of an acetyl group from acetyl-CoA to L-glutamate
  to form N-acetyl-L-glutamate. The protein has an N-terminal amino acid kinase (AAK) domain, which binds
  the feedback inhibitor arginine but is catalytically inactive, and a C-terminal GNAT acetyltransferase
  domain that carries the active site. Three AAK dimers form a hexameric ring, and this architecture is
  needed for arginine inhibition; the short interdomain linker tunes arginine sensitivity. The AAK domain
  is related to N-acetylglutamate kinase (ArgB), the next enzyme of the pathway.
references:
- id: PMID:22447897
  title: >-
    Functional dissection of N-acetylglutamate synthase (ArgA) of Pseudomonas aeruginosa and restoration
    of its ancestral N-acetylglutamate kinase activity.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IMP rows for GO:0004358 and GO:0006526, both seeds of PTN004744913. Full
      text cached and read. All activity assays use L-glutamate plus acetyl-CoA (the NAGS reaction, GO:0004042);
      acetyl-L-ornithine is never used as a donor, so the GO:0004358 row uses the wrong term. The work
      is biochemical (purified wild-type, linker and domain variants), so IDA would describe it better
      than IMP.
