id: Q9HT84
gene_symbol: dgcP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  DgcP (PA5487) is a soluble GGEEF-domain diguanylate cyclase conserved across
  Pseudomonas species that synthesises cyclic di-GMP from two GTP. By similarity
  to the PA14 protein it is recruited to the cell poles by the inner-membrane
  protein FimV, where it raises local c-di-GMP. DgcP promotes biofilm formation
  and exopolysaccharide production and represses motility; its loss reduces
  virulence in a mouse acute lung injury model, and overexpression shifts the
  cell from type III towards type VI secretion.
references:
- id: PMID:16477007
  title: Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases
    reveals a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: >-
      Extracts of cells overexpressing PA5487 contained 109 pmol c-di-GMP per mg
      wet cell weight (Table 1; full text read on PMC, excerpts in the notes
      file).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the GO:0052621 IDA seed row. Cached copy abstract only;
      full text (PMC1413825) read on the PMC web page. PA5487 gave +(109).
- id: PMID:25809128
  title: Diguanylate cyclase DgcP is involved in plant and human Pseudomonas spp.
    infections.
  findings:
  - statement: DgcP represses motility and promotes biofilm formation in P. savastanoi
      and P. aeruginosa.
    supporting_text: deletion of the dgcP gene revealed that DgcP negatively regulates
      motility and positively controls biofilm formation in both the olive tree pathogen
      P. savastanoi pv. savastanoi and the human opportunistic pathogen Pseudomonas
      aeruginosa
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Source of the UniProt EXP row for GO:0052621. The abstract
      reports GGDEF-dependent activity for the P. savastanoi protein; whether the
      P. aeruginosa protein was assayed cannot be seen, but the activity is shown
      for it in PMID:16477007.
