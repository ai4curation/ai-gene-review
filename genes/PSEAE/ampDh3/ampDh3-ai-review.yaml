- term:
    id: GO:0033252
    label: regulation of beta-lactamase activity
  evidence_type: IDA
  original_reference_id: PMID:23510438
  qualifier: involved_in
  review:
    summary: >-
      The paper did no beta-lactamase assay. It proposes that the marginal activity of
      ampDh3 on periplasmic anhydromuropeptides explains the stepwise AmpC derepression
      seen in earlier genetic studies. That is an indirect effect on ampC induction via
      the AmpR inducer pool, and GO:0033252 is about modulating beta-lactamase catalytic
      activity, which ampDh3 does not do.
    action: REMOVE
    reason: >-
      Wrong term and no direct evidence; the effect is on AmpC expression, indirectly,
      through inducer turnover.
    supported_by:
      - reference_id: PMID:23510438
        supporting_text: Nonetheless, the marginal activity in turnover of metabolite 1 with AmpDh2 and AmpDh3 explains the stepwise effect observed in augmenting derepression of AmpC β-lactamase by eliminations of these enzymes one-by-one.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0033252
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The PseudoCAP IDA row annotates PA0807/ampDh3 to GO:0033252 regulation of
        beta-lactamase activity from PMID:23510438. The paper (full text read) measures
        amidase kinetics only; its link to AmpC is an interpretation of earlier genetic
        data, in which the paralogue's marginal turnover of anhydromuropeptides lowers
        the AmpR inducer and so ampC expression. It neither assays nor modulates
        beta-lactamase activity. Delete the row.
      supported_by:
      - reference_id: PMID:23510438
        supporting_text: Nonetheless, the marginal activity in turnover of metabolite 1 with AmpDh2 and AmpDh3 explains the stepwise effect observed in augmenting derepression of AmpC β-lactamase by eliminations of these enzymes one-by-one.
