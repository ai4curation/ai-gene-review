gene_symbol: ampDh3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AmpDh3 (PA0807) is one of three AmpD paralogues of Pseudomonas aeruginosa, a
  zinc-dependent N-acetylmuramoyl-L-alanine amidase of the Amidase_2 family with a
  peptidoglycan-binding-like domain. Purified AmpDh3 is a tetramer that removes the stem
  peptides from peptidoglycan, acting mainly on the insoluble polymeric sacculus in a
  processive, multivalent manner, and it prefers normal muramyl peptides (cell-wall
  surrogates) to the 1,6-anhydromuramyl recycling metabolites of cytoplasmic AmpD, so its
  role is cell-wall remodelling rather than recycling. Its cellular location is unsettled:
  it has been described as periplasmic, but it has no predicted signal peptide, other
  workers call it cytosolic, and a reported role as a type VI secretion effector was not
  reproduced. Its marginal activity on anhydromuropeptides is thought to explain why
  ampDh3 loss adds to the AmpC beta-lactamase derepression of ampD mutants.
references:
- id: PMID:23510438
  title: Reactions of the three AmpD enzymes of Pseudomonas aeruginosa.
  findings:
  - statement: AmpDh2 and AmpDh3 prefer cell-wall peptidoglycan surrogates over the
      anhydromuramyl recycling metabolites.
    supporting_text: Hence, it is clear that AmpDh2 and AmpDh3 have evolved as enzymes for processing of the peptidoglycan components of the cell wall in the periplasmic space.
  - statement: Purified ampDh3 removes stem peptides from P. aeruginosa sacculus.
    supporting_text: The reaction with AmpDh3 also produced products (20), but its quantity was three times less than that with AmpDh2.
  - statement: The location of the paralogues was taken from earlier work or proposed,
      not assayed in this paper.
    supporting_text: If AmpDh2 and AmpDh3 were to be periplasmic enzymes, as proposed in this report
  - statement: The marginal anhydromuropeptide activity is proposed to explain the
      stepwise AmpC derepression seen genetically.
    supporting_text: Nonetheless, the marginal activity in turnover of metabolite 1 with AmpDh2 and AmpDh3 explains the stepwise effect observed in augmenting derepression of AmpC β-lactamase by eliminations of these enzymes one-by-one.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IDA rows (amidase activity, cell wall, regulation of
      beta-lactamase activity). Full text cached and read. Kinetics with six synthetic
      substrates and digestion of isolated sacculus directly support the amidase
      activity. No localization experiment was done; the paper states the location of
      AmpDh2 from earlier work, says that of AmpDh3 is unknown, and proposes a
      periplasmic role from substrate preference. No beta-lactamase assay was done.
- id: PMID:23931161
  title: Cell-wall remodeling by the zinc-protease AmpDh3 from Pseudomonas aeruginosa.
  findings:
  - statement: AmpDh2 is an outer-membrane-inserted dimer that hydrolyses the sacculus.
    supporting_text: AmpDh2 is a dimeric protein that inserts itself into the inner leaflet of the outer membrane, where it interacts and hydrolyzes the amide bond between the stem peptide and the NAM moiety of the sacculus.
  - statement: AmpDh2 and AmpDh3 together remodel the cell wall.
    supporting_text: The present study documents that AmpDh2 and AmpDh3 complement each other in remodeling of the cell wall.
  - statement: AmpDh3 is soluble and acts processively on the polymeric sacculus.
    supporting_text: This enzyme is soluble, it has higher specific activity and it does not leave behind partially hydrolyzed peptidoglycan.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Structure (tetramer) and cell-wall reaction products of AmpDh3,
      with a summary of the same laboratory's earlier AmpDh2 work.
- id: PMID:36577706
  title: Lack of evidence that Pseudomonas aeruginosa AmpDh3-PA0808 constitute a type
    VI secretion system effector-immunity pair.
  findings:
  - statement: AmpDh3 was not found to be exported, contradicting a proposed T6SS
      effector role.
    supporting_text: we found no evidence that AmpDh3 is
      exported from cells
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Bears on AmpDh3 location; the authors describe it as a cytosolic
      enzyme with an established role in cell-wall homeostasis.
