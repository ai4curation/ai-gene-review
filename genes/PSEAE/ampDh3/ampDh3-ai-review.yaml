suggested_questions:
- question: >-
    PTN002019137 carries GO:0009276 for a clade that includes the cytoplasmic AmpD
    lineage. Should the IBD be moved to the AmiD/AmpDh2/AmpDh3 subclade (see the ampD
    review)?
- question: >-
    How does AmpDh3, which has no predicted signal peptide, reach the sacculus? Is it
    periplasmic, cytoplasmic, or exported by a non-classical route?
suggested_experiments:
- description: >-
    Subcellular fractionation of P. aeruginosa expressing chromosomally tagged AmpDh3,
    with cytoplasmic, periplasmic and membrane markers, and a test of whether periplasmic
    targeting is needed for its contribution to AmpC derepression.
