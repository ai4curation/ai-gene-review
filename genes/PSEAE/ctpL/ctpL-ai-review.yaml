suggested_questions:
- question: >-
    Does CtpL recognise 4-chloroaniline and catechol through its periplasmic region directly, or, as for
    Pi, through a periplasmic binding protein?
suggested_experiments:
- description: >-
    Test binding of 4-chloroaniline and catechol to the purified CtpL periplasmic region and to PstS by
    isothermal titration calorimetry, and measure 4CA taxis in a pstS mutant.
