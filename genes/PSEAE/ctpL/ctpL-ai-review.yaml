core_functions:
- description: >-
    Inner-membrane chemoreceptor for inorganic phosphate that mediates taxis at low Pi concentrations.
    Its periplasmic region is stimulated by the Pi-loaded periplasmic binding protein PstS rather than
    by Pi itself, and its cytoplasmic HAMP and MCP signalling domains relay the signal to the chemosensory
    array. It also mediates positive chemotaxis to 4-chloroaniline and catechol. Expression is induced
    by Pi limitation through PhoB.
  supported_by:
  - *id002
  - *id001
  - *id004
