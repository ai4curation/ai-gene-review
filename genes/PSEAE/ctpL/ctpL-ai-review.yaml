  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CtpL (PA4844) is a methyl-accepting chemotaxis protein (MCP) of Pseudomonas aeruginosa PAO1 and one
  of two chemoreceptors for inorganic phosphate. It is an inner-membrane receptor with two transmembrane
  helices around a periplasmic sensor region and a cytoplasmic HAMP and MCP signalling region. CtpL mediates
  chemotaxis towards low (micromolar) Pi concentrations, complementing CtpH, which senses high Pi. It
  does not bind Pi directly: the Pi-loaded periplasmic binding protein PstS of the Pst phosphate transporter
  binds CtpL and stimulates it. ctpL belongs to the Pho regulon and is induced by phosphate limitation
  through PhoB. CtpL also mediates positive chemotaxis to the aromatic pollutant 4-chloroaniline and to
  catechol.
