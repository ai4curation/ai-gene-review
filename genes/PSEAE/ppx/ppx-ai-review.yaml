core_functions:
- description: Exopolyphosphatase that processively hydrolyses polyP to orthophosphate, controlling
    the cellular polyP pool together with Ppk.
  molecular_function:
    id: GO:0004309
    label: exopolyphosphatase activity
  directly_involved_in:
  - id: GO:0006798
    label: polyphosphate catabolic process
  supported_by:
