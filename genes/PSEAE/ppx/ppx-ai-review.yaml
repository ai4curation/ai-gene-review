  - *id006
suggested_questions:
- question: Is the polyP:ADP phosphotransferase activity of Ppx physiologically significant
    for ATP regeneration in P. aeruginosa, or a side reaction of the hydrolase site?
- question: Which of the ppx-mutant virulence phenotypes are due to polyP accumulation and
    which to altered Pi or ppGpp signalling?
suggested_experiments:
- description: Compare ppx, ppk and ppx ppk mutants for polyP levels and the motility, AHL
    and rhamnolipid phenotypes, and complement ppx with a catalytically dead allele, to separate
    direct from indirect effects.
