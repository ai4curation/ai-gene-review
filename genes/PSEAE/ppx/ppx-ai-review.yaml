gene_symbol: ppx
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: Ppx (PA5241) is the exopolyphosphatase of Pseudomonas aeruginosa, a 506-residue
  member of the GppA/Ppx family (ASKHA fold) 41% identical to E. coli Ppx. It processively
  hydrolyses inorganic polyphosphate (polyP) from the chain ends, releasing orthophosphate,
  and is activated by K+, NH4+ and Zn2+. The same N-terminal active site also transfers phosphate
  from polyP to ADP to make ATP, at about a tenth of the hydrolase rate. Together with polyphosphate
  kinase (Ppk), encoded by the adjacent divergent gene, Ppx sets the cellular polyP pool.
  ppx is transcribed from a sigma54/NtrC-dependent promoter under nitrogen limitation and
  from a sigma70/PhoB-dependent promoter under phosphate limitation. Loss of Ppx disturbs
  polyP homeostasis and has pleiotropic effects on motility, pyocyanin, acyl-homoserine lactone
  and rhamnolipid production and biofilm formation. By similarity to E. coli Ppx it is a peripheral
  membrane protein.
