- id: PMID:10382967
  title: The gene for an exopolyphosphatase of Pseudomonas aeruginosa.
  findings:
  - statement: Overproduced paPPX releases Pi from polyP (exopolyphosphatase activity).
    supporting_text: Thus ppx encodes an enzyme that has exopoly(P)ase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PseudoCAP source for the GO:0004309 IDA, a seed of PTN000768198 and PTN000768205.
      Abstract only; it states the activity assay outright, and the result is confirmed with
      purified enzyme in PMID:26576296.
- id: PMID:24275100
  title: Exopolyphosphatase of Pseudomonas aeruginosa is essential for the production of virulence
    factors, and its expression is controlled by NtrC and PhoB acting at two interspaced promoters.
  findings:
  - statement: ppx null mutant phenotypes in motility, pigment, AHLs, rhamnolipids and biofilm.
    supporting_text: Results obtained from the ppx null mutant demonstrated that Ppx is involved
      in the production of virulence factors associated with both acute infection (e.g. motility-promoting
      factors, blue/green pigment production, C6-C12 quorum-sensing homoserine lactones) and
      chronic infection (e.g. rhamnolipids, biofilm formation).
  - statement: Dual NtrC/sigma54 and PhoB/sigma70 promoters.
    supporting_text: Under nitrogen-limiting conditions, its expression was controlled from
      a σ(54)-dependent promoter activated by the response regulator NtrC.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PseudoCAP source for seven process rows (none of them IBD seeds). Abstract
      only. The abstract shows that the process data are ppx null-mutant phenotypes and promoter
      regulation; rhamnolipid and quorum-sensing rows are indirect phenotypes.
- id: PMID:26576296
  title: 'Pseudomonas aeruginosa Exopolyphosphatase Is Also a Polyphosphate: ADP Phosphotransferase.'
  findings:
  - statement: Purified paPpx hydrolyses polyP to polyPn-1 + Pi.
    supporting_text: Pseudomonas aeruginosa exopolyphosphatase (paPpx; EC 3.6.1.11) catalyzes
      the hydrolysis of polyphosphates (polyP), producing polyPn-1 plus inorganic phosphate
      (Pi).
  - statement: paPpx also has polyP:ADP phosphotransferase activity at the same active site.
    supporting_text: We show that paPpx is also a polyphosphate:ADP phosphotransferase and
      that the active site is the same as that one involved in the hydrolase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; source of the UniProt EXP rows and the kinetic data.
