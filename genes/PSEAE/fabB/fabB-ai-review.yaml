id: Q9I3B2
gene_symbol: fabB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FabB (PA1609) is the beta-ketoacyl-[acyl-carrier-protein] synthase I (KAS I,
  3-oxoacyl-ACP synthase 1, EC 2.3.1.41) of Pseudomonas aeruginosa. It is a
  405-residue thiolase-fold condensing enzyme with an active-site cysteine that
  carries the acyl group during the Claisen condensation of an acyl-ACP with
  malonyl-ACP, the chain-extension step of the dissociated (type II) fatty acid
  synthase. The gene is cotranscribed with fabA, the dehydratase/isomerase that
  makes the cis-3-decenoyl-ACP intermediate, and FabB is the enzyme that
  elongates that unsaturated intermediate - up to three further rounds - which
  makes it indispensable for unsaturated fatty acid synthesis; fabB mutants are
  auxotrophic for unsaturated fatty acids. FabB does not catalyse the final
  vaccenoyl-ACP step, which belongs to FabF. As the entry point into chain
  elongation it is a target of interest for antibacterials, and the
  P. aeruginosa enzyme has been crystallised as its catalytically inactive
  C161A variant.
references:
- id: PMID:9286984
  title: 'Fatty acid biosynthesis in Pseudomonas aeruginosa: cloning and characterization
    of the fabAB operon encoding beta-hydroxyacyl-acyl carrier protein dehydratase
    (FabA) and beta-ketoacyl-acyl carrier protein synthase I (FabB).'
  findings:
  - statement: fabB encodes beta-ketoacyl-ACP synthase I, and fabA and fabB were cloned,
      sequenced and expressed.
    supporting_text: >-
      The Pseudomonas aeruginosa fabA and fabB genes, encoding
      beta-hydroxyacyl-acyl carrier protein dehydratase and beta-ketoacyl-acyl
      carrier protein synthase I, respectively, were cloned, sequenced, and
      expressed in Escherichia coli.
  - statement: Chromosomal fabB mutants are auxotrophic for unsaturated fatty acids.
    supporting_text: >-
      Chromosomal fabA and fabB mutants were isolated; the mutants were
      auxotrophic for unsaturated fatty acids.
  - statement: fabA and fabB are cotranscribed as an operon.
    supporting_text: >-
      Northern analysis demonstrated that fabA and fabB are cotranscribed and
      most probably form a fabAB operon.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the PseudoCAP source for the GO:0006636 IMP row and the
      seed of the GO:0006633 IBD on PTN000918584. Abstract only in the cache, but
      the abstract states the gene assignment and the unsaturated-fatty-acid
      auxotrophy outright, which is what the annotation rests on. For this gene
      the auxotrophy is not an indirect phenotype - FabB performs the elongation
      step on the unsaturated intermediate itself.
- id: PMID:35136566
  title: Crystal structure of Pseudomonas aeruginosa FabB C161A, a template for structure-based
    design for new antibiotics.
  findings:
  - statement: FabB elongates the cis-unsaturated intermediate cis-3-decenoyl-ACP
      through successive rounds of condensation.
    supporting_text: >-
      FabB is able to catalyse the elongation of cis-3-decenoyl-ACP up to three
      times, and synthesise cis-5-dodecenoyl-ACP, cis-7-tetradodecenoyl-ACP and
      cis-9-hexadodecenoyl-ACP.
  - statement: Loss of FabB makes cells auxotrophic for unsaturated fatty acids.
    supporting_text: >-
      Cells lacking FabB are auxotroph for unsaturated fatty acids, making FabB
      an essential gene for the bacteria.
  - statement: The final vaccenic acid condensation is performed by FabF, not FabB.
    supporting_text: >-
      In contrast, FabF but and not FabB was shown to be responsible for the
      condensation of cis-9-hexadodecenoyl-ACP to cis-11-octadodecenoyl-ACP, the
      last step for the synthesis of vaccenic acid.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Structure of the P. aeruginosa enzyme (active-site C161A
      variant) plus a clear statement of which condensation steps are FabB's and
      which are FabF's. This is what makes the unsaturated-fatty-acid auxotrophy
      attributable to FabB's own catalysis rather than to a downstream effect.
