suggested_questions:
- question: >-
    Has the substrate specificity of purified P. aeruginosa FabB been measured
    against saturated as well as unsaturated acyl-ACPs, so that the division of
    labour with FabF1 and FabF2 in this organism can be annotated per enzyme?
- question: >-
    Does the fabAB operon structure make FabB levels dependent on FabA
    regulation, and is that reflected in any condition where unsaturated fatty
    acid supply becomes limiting?
suggested_experiments:
- description: >-
    Reconstitute the elongation cycle in vitro with purified PAO1 FabB, FabF1
    and FabF2 and defined acyl-ACP substrates (decanoyl-ACP versus
    cis-3-decenoyl-ACP), measuring rates for each enzyme, with the C161A variant
    as a negative control.
