core_functions:
- description: >-
    Beta-ketoacyl-ACP synthase I of the dissociated type II fatty acid synthase.
    FabB condenses malonyl-ACP with an acyl-ACP through an acyl-enzyme
    intermediate on its active-site cysteine, extending the chain by two
    carbons. It is the only condensing enzyme that elongates the
    cis-3-decenoyl-ACP made by FabA, which makes it essential for unsaturated
    fatty acid synthesis.
