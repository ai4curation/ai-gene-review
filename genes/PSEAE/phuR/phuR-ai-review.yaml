id: Q9HV88
gene_symbol: phuR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PhuR (PA4710) is the outer-membrane receptor of the phu locus (Pseudomonas haem uptake)
  of Pseudomonas aeruginosa, the organism's principal haem-acquisition route alongside the has system.
  It is a TonB-dependent receptor of the PTHR30069 family that binds haem and haemoglobin-derived
  haem at the cell surface and moves it across the outer membrane, after which the PhuSTUVW ABC transporter
  encoded in the adjacent operon carries it into the cytoplasm. Transcription of both phuR and phuSTUVW
  is induced under iron restriction and directly repressed by Fur. Deleting phuR greatly reduces growth
  with haem or haemoglobin as the sole iron source, a defect complemented by the gene, and a phuR
  hasR double mutant is virtually unable to use either compound. Its substrate is haem rather than
  a siderophore, which matters because the annotations it inherits from its family are siderophore
  terms.
