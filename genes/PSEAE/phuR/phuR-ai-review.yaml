- term:
    id: GO:0015344
    label: siderophore uptake transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN004738955
  - UniProtKB:Q05098
  - UniProtKB:Q9HVC0
  - UniProtKB:Q9HWM5
  - UniProtKB:Q9I527
  review:
    summary: Siderophore uptake transporter activity propagated from PTN004738955.
    action: REMOVE
    reason: 'Wrong substrate. PhuR is the receptor of the phu haem-uptake locus and sits in PANTHER
      subfamily SF29, "Heme_hemoglobin uptake outer membrane receptor"; its own experimental row is
      loss of growth on haem and haemoglobin, complemented by the gene. The IBD sits at the LUCA root
      of PTHR30069 and is seeded only by siderophore and colicin receptors from other subfamilies,
      so it propagates a substrate the node cannot support. The node-level GO_CENTRAL request for
      PTN004738955 is recorded once, on the hasR review (GO:0015344 row), which carries the full tree
      analysis: the node is the LUCA root of PTHR30069 spanning 18 subfamilies, its five seeds are
      siderophore and colicin receptors from five other subfamilies, and the smallest clade containing
      them all (PTN002824128, 145 leaves) also contains the haem subfamilies, so relocation cannot
      separate them. It is one upstream request covering both receptors, not two.'
    supported_by:
    - *id002
    propagation_review: &id003
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN004738955
        source_label: PTN004738955
        source_status: SOURCE_BAD
        comment: LUCA root of PTHR30069, 149 leaves in 18 subfamilies, seeded only by siderophore
          and colicin receptors. phuR is in SF29, "Heme_hemoglobin uptake outer membrane receptor".
          The node supports TonB-dependent outer-membrane transport, not the substrate.
      - source_id: UniProtKB:Q9HWM5
        source_label: PA4156, vibriobactin-type siderophore receptor (SF37)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: A sound seed whose own siderophore rows this project accepted on its mutant phenotype;
          the evidence does not transfer to a haem receptor.
