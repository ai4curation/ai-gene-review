  label: Pseudomonas aeruginosa PAO1
description: >-
  AmpG (PA4393) is the muropeptide permease of Pseudomonas aeruginosa, a 14-helix inner-membrane
  transporter of the major facilitator superfamily (AmpG/SLC33 family, TC 2.A.1.25). By homology
  to Escherichia coli AmpG, which imports GlcNAc-1,6-anhydro-MurNAc and its peptide derivatives
  from the periplasm, it returns peptidoglycan turnover products to the cytoplasm for cell-wall
  recycling. These muropeptides are the signal for AmpR-dependent induction of the chromosomal
  AmpC beta-lactamase, so ampG inactivation strongly reduces intrinsic beta-lactam resistance
  and abolishes the high-level resistance of ampD mutants. PA4393 complements an E. coli ampG
  mutant, whereas its distant paralog PA4218 (AmpP) does not.
references:
- id: PMID:20713660
  title: ampG gene of Pseudomonas aeruginosa and its role in β-lactamase expression.
  findings:
  - statement: >-
      In enterobacteria AmpG transports GlcNAc-anhMurNAc and its peptides, the signal for
      ampC induction.
    supporting_text: transports 1,6-GlcNAc-anhydro-MurNAc and the 1,6-GlcNAc-anhydro-MurNAc
      peptide
  - statement: ampG inactivation drastically reduces intrinsic beta-lactam resistance.
    supporting_text: inactivation of ampG drastically repressed the intrinsic β-lactam resistance
  - statement: Cloned ampG complements P. aeruginosa and E. coli ampG mutants.
    supporting_text: >-
      The cloned ampG gene is able to complement both the P. aeruginosa and the E. coli ampG
      mutants
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP GO:0022857 seed row of PTN008542531 and the cell wall,
      beta-lactamase activity and antibiotic rows. Abstract only (PMC2976151 returned no full
      text on 2026-11-05). Complementation of the E. coli ampG mutant is functional evidence
      that PA4393 is the muropeptide permease; no direct transport assay is described in the
      abstract.
- id: PMID:21192796
  title: >-
    Pseudomonas aeruginosa β-lactamase induction requires two permeases, AmpG and AmpP.
  findings:
  - statement: PhoA/LacZ fusions place AmpG in the inner membrane with 14 TM helices.
    supporting_text: suggesting that AmpG has only 14 TM helices (Figures 4C and 4D).
  - statement: >-
      Benzylpenicillin induction of the ampC promoter is lost in ampG and ampP mutants.
    supporting_text: >-
      Benzyl-penicillin dependent induction of PampC-lacZ was lost in PAOampG or PAOampP (Figure
      6).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Topology and beta-lactamase/ampC-promoter induction assays in ampG and
      ampP mutants; no transport assay.
