id: Q51366
gene_symbol: gmd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Gmd (PA5453) is the GDP-mannose 4,6-dehydratase (EC 4.2.1.47) of Pseudomonas aeruginosa,
  an NADP(+)-dependent enzyme of the extended short-chain dehydratase/reductase (SDR) family
  that converts GDP-alpha-D-mannose to GDP-4-dehydro-6-deoxy-alpha-D-mannose (GDP-4-keto-6-deoxy-D-mannose),
  releasing water. This is the first committed step toward GDP-D-rhamnose, the sugar donor
  for the D-rhamnose homopolymer of A-band (common antigen) O polysaccharide; the second step
  is carried out by Rmd. The purified P. aeruginosa enzyme is bifunctional and can also catalyse
  the subsequent reduction to GDP-D-rhamnose. P. aeruginosa has no GDP-L-fucose synthase and
  does not make GDP-L-fucose, so Gmd here feeds D-rhamnose, not fucose, biosynthesis. gmd
  mutants are impaired in A-band LPS.
