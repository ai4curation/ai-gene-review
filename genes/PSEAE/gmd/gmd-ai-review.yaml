- term:
    id: GO:0042351
    label: '''de novo'' GDP-L-fucose biosynthetic process'
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT3G51160
  - FB:FBgn0031661
  - PANTHER:PTN008684430
  - UniProtKB:O60547
  - UniProtKB:Q387W4
  - dictyBase:DDB_G0284553
  review:
    summary: >-
      IBA from PTN008684430 for 'de novo' GDP-L-fucose biosynthetic process. Seeded by fucose-producing
      organisms (Arabidopsis, human GMDS, fly, Trypanosoma, Dictyostelium); Gmd is not a seed
      here.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GMD is the shared first step; the pathway identity is set downstream. P. aeruginosa
      makes GDP-D-rhamnose (via Rmd), not GDP-L-fucose, and has no GDP-L-fucose synthase.
      The GDP-L-fucose process term is wrong for this gene; see the GO_CENTRAL note.
    supported_by:
    - reference_id: PMID:19459932
      supporting_text: >-
        P. aeruginosa GMD is bifunctional, and can catalyze both GDP-d-mannose 4,6-dehydration
        and the subsequent reduction reaction to produce GDP-D-rhamnose.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0042351
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The IBA assigns P. aeruginosa Gmd (Q51366) to GO:0042351 'de novo' GDP-L-fucose biosynthetic
        process. The PTN008684430 node seeds for this term are fucose-producing organisms
        (Arabidopsis AT3G51160, human GMDS O60547, fly, Trypanosoma Q387W4, Dictyostelium);
        Q51366 is not among them, so it receives the IBA. GMD is the first, shared step; the
        pathway's identity (fucose vs rhamnose) is set by the second enzyme. P. aeruginosa
        has no GDP-L-fucose synthase (fcl) and makes GDP-D-rhamnose via Rmd, not GDP-L-fucose.
        The GDP-L-fucose process term is therefore wrong for this gene. This is a received
        IBA, not a defect in the node seeds; flagged so the GDP-L-fucose process term is not
        propagated to non-fucose lineages. PROBABLE pending a check of fcl absence across
        Pseudomonas.
      supported_by:
      - reference_id: PMID:19459932
        supporting_text: >-
          P. aeruginosa GMD is bifunctional, and can catalyze both GDP-d-mannose 4,6-dehydration
          and the subsequent reduction reaction to produce GDP-D-rhamnose.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008684430
        source_label: PTN008684430
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The GDP-L-fucose process IBD is right for fucose-producing seeds but not for P.
          aeruginosa, which makes GDP-D-rhamnose.
