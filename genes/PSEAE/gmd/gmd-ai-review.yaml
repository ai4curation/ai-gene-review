suggested_questions:
- question: >-
    Should the PTN008684430 GDP-L-fucose process IBD be restricted to lineages that encode
    a GDP-L-fucose synthase (fcl/GER), so that GMD orthologs in GDP-D-rhamnose producers such
    as P. aeruginosa are not annotated to GDP-L-fucose biosynthesis?
suggested_experiments:
- description: >-
    Confirm the absence of GDP-L-fucose and of a GDP-4-keto-6-deoxymannose-3,5-epimerase-4-reductase
    in P. aeruginosa by metabolite profiling of a gmd/rmd background.
