- term:
    id: GO:0045827
    label: negative regulation of isoprenoid metabolic process
  evidence_type: IMP
  original_reference_id: PMID:16820476
  qualifier: involved_in
  review:
    summary: 'PseudoCAP IMP: atuR negatively regulates the acyclic terpene utilization (atu) gene cluster.'
    action: ACCEPT
    reason: Acyclic monoterpenes (citronellol, geraniol) are isoprenoids, and AtuR directly represses
      the genes for their catabolism, so negative regulation of isoprenoid metabolic process is the process
      AtuR's target genes carry out. GO has no terpene-catabolism regulation term.
    supported_by:
    - *id004
    - reference_id: PMID:20487029
      supporting_text: The atuR-atuABCDEFGH gene cluster is essential for acyclic terpene utilization
        (Atu)
