      IBD) and IDA GO:0046247. Abstract only. The abstract states the constitutive expression of Atu proteins
      in the atuR mutant and EMSA binding, so the GO:0045892 seed is sound. It describes AtuR only as
      a repressor, so the GO:0046247 terpene catabolic process row is an indirect annotation.
