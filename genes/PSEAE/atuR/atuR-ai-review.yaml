      asserted_value: GO:0046247
      cause: OTHER
      confidence: PROBABLE
      explanation: 'PseudoCAP IDA row for PA2885/atuR, GO:0046247 terpene catabolic process, from PMID:20487029
        (Forster-Fromme and Jendrossek 2010). The abstract identifies AtuR as a TetR-family repressor
        of the atu cluster by sequence similarity, constitutive Atu protein expression in the mutant and
        EMSA binding to the atuA operator. A repressor of catabolic genes is not a participant in the
        catabolic process, and the only direct assay (EMSA) shows DNA binding. Requested change: delete
        the row; the regulatory role is already annotated as GO:0045827 and GO:0045892. Abstract-only
        reading.'
      supported_by:
      - *id002
