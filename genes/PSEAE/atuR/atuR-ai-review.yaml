id: Q9HZW2
gene_symbol: atuR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: AtuR (PA2885) is a TetR-family transcriptional repressor of Pseudomonas aeruginosa that controls
  the atuABCDEFGH gene cluster, which encodes most enzymes of acyclic terpene (citronellol, geraniol)
  utilization, including the geranyl-CoA carboxylase subunits AtuC and AtuF. AtuR binds as a homodimer
  to two 13-bp inverted repeats separated by 40 bp in the atuR-atuA intergenic operator/promoter region.
  In an atuR insertion mutant the Atu proteins are expressed constitutively, so AtuR keeps the terpene
  catabolic genes off in the absence of inducer.
