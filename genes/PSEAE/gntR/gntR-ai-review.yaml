- term:
    id: GO:0010906
    label: regulation of glucose metabolic process
  evidence_type: IMP
  original_reference_id: PMID:28752954
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP row. GntR controls the gluconate permease gene gntP; in pseudomonads glucose is partly
      oxidized to gluconate in the periplasm and taken up as gluconate before entering the Entner-Doudoroff
      pathway.
    action: KEEP_AS_NON_CORE
    reason: >-
      A fair organism-level description of the regulatory role, since gluconate uptake is one route of
      glucose catabolism in Pseudomonas, but it is a consequence of transcriptional repression of gntP
      rather than the gene's core activity. Not a PAINT seed.
    supported_by:
    - reference_id: PMID:28752954
      supporting_text: >-
        GntR repressed its own expression as well as that of the GntP gluconate permease.
    - reference_id: PMID:28752954
      supporting_text: >-
        glucose metabolism in pseudomonads occurs exclusively through the Entner-Doudoroff (ED) pathway
