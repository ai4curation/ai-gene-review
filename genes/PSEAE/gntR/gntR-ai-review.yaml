  label: Pseudomonas aeruginosa PAO1
description: >-
  GntR (PA2320) is a LacI/GalR-family transcriptional repressor of Pseudomonas aeruginosa that controls
  gluconate uptake, one of the routes feeding glucose-derived carbon into the Entner-Doudoroff pathway.
  It has an N-terminal lacI-type helix-turn-helix DNA-binding domain and a C-terminal periplasmic-binding-protein-like
  effector domain. GntR binds an operator (consensus AC-N-AAG-N-TAGCGCT) that overlaps the RNA polymerase
  binding site at its own promoter and at the promoter of the gluconate permease gene gntP, and represses
  both. Gluconate and 6-phosphogluconate bind the GntR-DNA complex and release the repressor (effector-mediated
  de-repression). GntR is a paralog of PtxS and, unlike PtxS, does not affect exotoxin A (toxA) expression.
