  knowledge_gaps:
  - gap_statement: >-
      What the delta subunit actually does is unknown. It has no cofactor, no catalytic
      motif and no domain beyond its own subunit family, and it has only ever been tested as
      part of the operon, so whether it is an assembly factor, a structural brace holding
      the alpha and beta chains together, or a contributor of residues to the active site of
      the complex is undetermined for this enzyme and, as far as this review established,
      for the family generally.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Is SoxD required for the assembly or the activity of the P. aeruginosa sarcosine oxidase?
    A complex that assembles without delta but cannot turn over would point to a catalytic
    or conformational role rather than a chaperone-like one.
suggested_experiments:
- description: >-
    Express SoxBAG with and without SoxD and compare complex formation by size-exclusion
    chromatography against sarcosine-dependent turnover, to separate an assembly role from a
    catalytic one.
- description: >-
    Determine a structure of the reconstituted P. aeruginosa SoxBDAG complex, or map SoxD's
    interface by crosslinking mass spectrometry, to establish whether the delta chain
    approaches the flavin site on SoxB.
