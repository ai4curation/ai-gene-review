  reference_review:
    relevance: NONE
    correctness: WRONG_IDENTIFIER
    review_notes: >-
      PubMed-verified: this PMID is a Streptococcus mutans stringent-response study
      (Nascimento, Lemos, Abranches, Lin & Burne, J Bacteriol 2008; DOI
      10.1128/JB.01395-07), concerning (p)ppGpp synthesis and global transcription. It
      bears on neither P. aeruginosa, nor sarcosine, nor any oxidase, so it cannot support
      the GO:0008115 IMP row it is cited for. The intended paper is PMID:17951379, which
      sits immediately below a block of consecutive PMIDs from the same journal issue (all
      e-published 2007-10-19) and names the soxBDAG genes directly. The same transposition
      affects soxA, soxB and soxG, each citing a different wrong PMID from that block.
      Recorded as a WRONG_REFERENCE source defect on the IMP row.
    replacement:
      reference_id: PMID:17951379
      reason: WRONG_IDENTIFIER
      review_notes: >-
        The intended paper is the glycine betaine catabolism study whose mutant and NMR
        analyses establish that the soxBDAG genes are required for sarcosine catabolism in
        P. aeruginosa. Verified against PubMed by title, journal, authors and e-publication
        date, and the full text is cached locally. Not inferred from PMID proximity alone:
        the paper's own abstract states the soxBDAG result.
- id: PMID:17951379
  title: >-
    Identification of two gene clusters and a transcriptional regulator required for
    Pseudomonas aeruginosa glycine betaine catabolism.
  findings:
  - statement: >-
      Mutant analysis plus 13C NMR establishes that the soxBDAG genes are required for
      sarcosine catabolism, with the authors describing the encoded enzyme as predicted
      rather than assayed.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Mutant analyses and 13 C NMR studies also confirmed that the soxBDAG genes, predicted
      to encode a sarcosine oxidase, are required for sarcosine catabolism
  - statement: >-
      Transposon insertions in all four sox genes, soxD among them, give the same growth
      phenotype on choline, glycine betaine and dimethylglycine.
    reference_section_type: RESULTS
    supporting_text: The 10 mutants in class II were unable to grow on choline, GB, or DMG
  - statement: >-
      The characterised bacterial enzyme is a four-subunit complex, so the delta subunit is
      a constituent of the holoenzyme rather than an accessory chain.
    reference_section_type: INTRODUCTION
    supporting_text: a heterotetrameric sarcosine oxidase converts sarcosine into glycine
  - statement: >-
      The 13C NMR flux experiment was performed on a soxA mutant only; no per-subunit data
      are reported for soxD.
    reference_section_type: RESULTS
    supporting_text: only sarcosine was detected at 9 h in extracts from soxA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Wargo, Szwergold & Hogan, J Bacteriol 2008; DOI 10.1128/JB.01393-07).
      Full text is cached. This is the paper the four sox IMP rows were meant to cite. For
      soxD specifically the evidence is the shared class II growth phenotype of the operon's
      transposon mutants; the NMR experiment was run on a soxA mutant, so there is no
      subunit-resolved data for soxD. The paper supports placing soxD in the sarcosine
      catabolic step but says nothing about what the delta subunit contributes.
