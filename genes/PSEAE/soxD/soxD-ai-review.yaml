id: Q9HTE7
gene_symbol: soxD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SoxD (PA5417) is the small delta subunit, 106 residues, of the heterotetrameric sarcosine
  oxidase of Pseudomonas aeruginosa. The complex converts sarcosine (N-methylglycine) to
  glycine in the terminal step of glycine betaine catabolism, transferring the methylene
  group to tetrahydrofolate. SoxD carries no cofactor and no catalytic domain of its own,
  only the conserved SoxD subunit family signature, so it contributes to the activity of the
  assembled enzyme rather than catalysing the reaction itself; the flavin-dependent active
  site lies on the beta subunit. The soxBDAG operon acts downstream of the glycine betaine
  and dimethylglycine demethylases in the cytoplasmic pathway that lets the organism use
  glycine betaine, and the choline and carnitine it derives from, as a carbon and nitrogen
  source.
