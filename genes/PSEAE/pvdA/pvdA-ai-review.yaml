suggested_questions:
- question: >-
    Is the peripheral inner-membrane association and old-pole clustering of PvdA
    required for efficient channelling of N5-hydroxyornithine to the pyoverdine
    NRPS machinery, or is it dispensable for catalysis in vivo?
  experts:
  - Isabelle J. Schalk
  - Paolo Visca
- question: >-
    Does N5-hydroxyornithine produced by PvdA reach PvdF and the NRPS modules as
    a free amino acid, or is it handed over within an organized siderosome
    assembly?
  experts:
  - Audrey L. Lamb
suggested_experiments:
- hypothesis: >-
