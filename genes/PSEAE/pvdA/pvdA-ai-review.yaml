- term:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001009003
  - PomBase:SPAC23G3.03
  - UniProtKB:E9QYP0
  - UniProtKB:G5EB76
  review:
    summary: >-
      The PAINT node PTN001009003 in PTHR42802 asserts iron homeostasis for the
      ornithine/lysine N-hydroxylase clade, seeded by fungal siderophore
      ornithine monooxygenases (S. pombe sib2, Aspergillus sidA). The
      phylogenetic placement is sound: all these enzymes initiate hydroxamate
      siderophore biosynthesis. For PvdA, however, the term describes the
      downstream physiological consequence of pyoverdine-mediated iron uptake
      rather than what the enzyme itself does, and the gene already carries the
      direct process term.
    action: MODIFY
    reason: >-
      Iron homeostasis is an indirect, broader framing of this enzyme's role.
      The informative direct process term, already annotated here from
      experimental evidence, is GO:0002049 pyoverdine biosynthetic process.
    proposed_replacement_terms:
    - id: GO:0002049
      label: pyoverdine biosynthetic process
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001009003
        source_label: PTHR42802 ancestral node for siderophore ornithine/lysine N-hydroxylases
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node placement is sound and the seeds (fungal siderophore
          ornithine monooxygenases sib2, sidA) are genuine experimental leaves;
          PvdA does belong to the clade that initiates hydroxamate siderophore
          biosynthesis. What transfers poorly is the term, which names the
          downstream homeostatic outcome of siderophore-mediated iron uptake
          rather than the hydroxylation the enzyme performs.
      residue_claims_not_applicable: >-
        The disagreement is about the granularity and role of the propagated
        process term, not about retention or loss of any catalytic residue;
        PvdA's active site is intact and its activity is directly assayed.
    supported_by:
    - reference_id: file:interpro/panther/PTHR42802/PTHR42802-paint.tsv
      supporting_text: "PTHR42802\tPTN001009003\tGO:0006879\tP\tIBD\tfalse"
