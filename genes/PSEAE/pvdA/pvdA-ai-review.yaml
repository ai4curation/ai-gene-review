  review:
    summary: >-
      Pyoverdine biosynthesis is the established pathway role of PvdA: the
      enzyme supplies the hydroxylated ornithine from which the siderophore's
      hydroxamate iron-chelating groups are built, and pvdA disruption abolishes
      pyoverdine production. The cited kinetics paper is framed around the
      fungal ornithine monooxygenase SidA but also reports experiments on the
      bacterial enzyme PvdA; the curator read the full text, and the pathway
      assignment is independently established by the PAO1 genetics and by the
      curated UniProt pathway statement.
    action: ACCEPT
    reason: >-
      Core biological process for this enzyme, supported by PAO1 mutant
      phenotype, rescue by the hydroxylated precursor, and curated UniProt
      pathway annotation.
