id: Q51548
gene_symbol: pvdA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdA is the L-ornithine N5-monooxygenase (L-ornithine N5-oxygenase, EC
  1.14.13.195) of Pseudomonas aeruginosa PAO1. It is a class B flavoprotein
  monooxygenase that uses FAD and NADPH to hydroxylate the side-chain amine of
  L-ornithine, producing N5-hydroxy-L-ornithine. This is the first committed
  step in forming the iron-chelating hydroxamate groups of the fluorescent
  siderophore pyoverdine, whose partly cyclic octapeptide contains two
  N5-hydroxyornithine residues. The purified enzyme is strictly specific for
  L-ornithine (L-lysine is a non-substrate effector that uncouples NADPH
  oxidation) and for NADPH and FAD. pvdA null mutants make no pyoverdine and are
  rescued by exogenous N5-hydroxyornithine, placing PvdA upstream of
  nonribosomal peptide assembly. The protein acts on the cytoplasmic face of the
  cell and is also recovered as a peripheral inner-membrane protein that
  clusters at the old cell pole, consistent with organized, membrane-proximal
  pyoverdine biosynthesis.
