id: Q9HUX1
gene_symbol: speA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SpeA (PA4839) is the biosynthetic arginine decarboxylase of Pseudomonas
  aeruginosa, a pyridoxal 5'-phosphate- and Mg2+-dependent enzyme of the
  Orn/Lys/Arg decarboxylase class-II family (SpeA subfamily). It decarboxylates
  L-arginine to agmatine, which agmatine deiminase (AguA) and
  N-carbamoylputrescine amidohydrolase (AguB) convert to putrescine. This
  arginine decarboxylase route and the ornithine decarboxylase (SpeC) route are
  redundant for putrescine synthesis; only a speA speC double mutant requires
  putrescine for growth.
references:
- id: PMID:12634339
  title: Identification of the putrescine biosynthetic genes in Pseudomonas aeruginosa
    and characterization of agmatine deiminase and N-carbamoylputrescine amidohydrolase
    of the arginine decarboxylase pathway.
  findings:
  - statement: speA encodes ADC; ADC and ODC activities are similar and either suffices
      for growth.
    supporting_text: The activities of the two decarboxylases were similar and each
      enzyme alone appeared to direct sufficient formation of the polyamine for normal
      growth.
  - statement: A speA speC double mutant is a putrescine auxotroph.
    supporting_text: A mutant defective in both speA and speC was a putrescine auxotroph.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP and CACAO source for the IMP ADC activity row, which seeds the
      PTN008680444 IBD. Abstract only (no PMC full text). The abstract states the
      gene identification, the ADC activity and the auxotrophy of the double
      mutant.
- id: PMID:6423933
  title: Arginine degradation in Pseudomonas aeruginosa mutants blocked in two arginine
    catabolic pathways.
  findings:
  - statement: Arginine is degraded in P. aeruginosa partly through an arginine decarboxylase
      (agmatine) pathway.
    supporting_text: Constructed agu arc double mutants (blocked in the arginine decarboxylase
      and arginine deiminase pathways) used arginine efficiently as the sole carbon
      and nitrogen source.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Background for the L-arginine catabolic process row; abstract only and
      does not name speA.
