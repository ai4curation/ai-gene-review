    supporting_text: A mutant defective in both speA and speC was a putrescine auxotroph.
suggested_questions:
- question: >-
    Does SpeA also supply agmatine for the catabolic arginine decarboxylase
    pathway when arginine is the carbon and nitrogen source, or is a separate
    catabolic decarboxylase involved?
suggested_experiments:
- description: >-
    Compare growth on L-arginine as sole carbon source and agmatine formation in
    speA mutants built in arginine succinyltransferase (aru) and arginine deiminase (arc) pathway-defective backgrounds, to test whether SpeA is the
    catabolic arginine decarboxylase.
