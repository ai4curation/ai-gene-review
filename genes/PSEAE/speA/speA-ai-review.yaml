    summary: >-
      InterPro2GO from the arginine decarboxylase signature. P. aeruginosa does
      degrade arginine through an arginine decarboxylase (agmatine) pathway, but
      the literature I could read does not show whether the biosynthetic SpeA is
      the decarboxylase used for catabolism.
