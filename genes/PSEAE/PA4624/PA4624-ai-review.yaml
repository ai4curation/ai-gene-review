  review:
    summary: >-
      IBA from PTN002160772, whose MF IBD rests solely on CdrB's own PseudoCAP
      IMP row. The node is a TpsB subfamily and the term suits it.
    action: ACCEPT
    reason: >-
      PA4624 in its own WITH/FROM marks its experimental seed and is expected.
      TpsB proteins (FhaC, HxuB, HpmB, CdiB and others, all in this node) form
      the outer-membrane channel through which their partner exoprotein is
      translocated, so protein transmembrane transport is their own activity,
      not a complex property. CdrB has the POTRA plus ShlB barrel
      architecture, and CdrA is not secreted without it.
    supported_by:
    - reference_id: PMID:20088866
      supporting_text: >-
        PA4624 is most similar to a membrane protein, FhaC, which is a member
        of omp85/tpsB transporter family.
    - reference_id: PMID:20088866
      supporting_text: >-
        The detection of CdrA in supernatants was dependent upon CdrB.
    - reference_id: file:PSEAE/PA4624/PA4624-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF03865; ShlB; 1.
- term:
    id: GO:0008320
    label: transmembrane protein transporter activity
  evidence_type: IMP
  original_reference_id: PMID:20088866
  qualifier: enables
  review:
    summary: >-
      CdrA reaches the culture supernatant only when cdrB is co-expressed,
      which is the in vivo readout of the TpsB transport activity.
    action: ACCEPT
    reason: >-
      IMP can support an MF term when the perturbation abolishes the activity
      itself, as read out by an assay of that activity, rather than a
      downstream phenotype. Here the readout is the transport step: CdrA
      appears in supernatants from cells expressing cdrAB but not from cells
      expressing cdrA alone. This is not a cdrB deletion; it compares
      arabinose-inducible constructs in PAO1, where chromosomal cdrAB
      expression is low in planktonic culture. The genetic evidence is
      therefore moderate on its own. Combined with the TpsB architecture and
      the FhaC homology, which give the mechanism (CdrB is the channel), it
      supports the claim. The IMP code is acceptable (IGI would also be
      defensible).
    supported_by:
    - reference_id: PMID:20088866
      supporting_text: >-
        No CdrA was seen in the supernatant of the strain overexpressing only
        cdrA, presumably because of the absence of CdrB to transport CdrA
        across the outer membrane.
    - reference_id: PMID:20088866
      supporting_text: >-
        The secondary structure and function of CdrB was predicted by
        I-TASSER (Zhang, 2008) to be most similar to FhaC which forms a
        β-barrel channel in the outer membrane for the outward translocation
        of FHA.
