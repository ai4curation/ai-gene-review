- term:
    id: GO:0044010
    label: single-species biofilm formation
  evidence_type: IMP
  original_reference_id: PMID:20088866
  qualifier: involved_in
  review:
    summary: >-
      Biofilm phenotypes in the paper come from cdrA deletions and from
      overexpression of cdrAB together. CdrB acts upstream, by secreting the
      matrix adhesin CdrA.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The mutants tested were cdrA deletions; no cdrB mutant was made. The
      only phenotype involving cdrB is that overexpressing cdrAB increased
      biofilm biomass and aggregation, whereas cdrA or cdrB alone did not
      cause aggregation. This shows CdrB is required for CdrA's effect,
      through secretion. CdrB does none of the matrix work itself; CdrA
      cross-links or tethers Psl. The supported claims for CdrB are its
      transport activity and type V secretion. A biofilm role is at most
      acts_upstream_of_or_within, and is peripheral.
    supported_by:
    - reference_id: PMID:20088866
      supporting_text: >-
        Biofilm formation was increased 6.4-fold when cdrAB was overexpressed
        as compared with the vector control (pMJT-1) (Fig. 4A).
    - reference_id: PMID:20088866
      supporting_text: >-
        Overexpression of cdrA or cdrB independently does not result in
        auto-aggregation.
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: PSEUDOCAP
      record: PMID:20088866
      requested_change: CHECK
      asserted_value: involved_in
      corrected_value: acts_upstream_of_or_within
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        GO:0044010 single-species biofilm formation for PA4624 (CdrB,
        Q9HVG7) is annotated IMP involved_in to PMID:20088866. The paper made
        cdrA deletions only; the cdrB evidence is that cdrAB co-overexpression
        increases biofilm, with cdrB required for secretion of the CdrA
        adhesin. CdrB therefore acts upstream of biofilm formation by
        exporting CdrA, rather than taking part in matrix formation. Consider
        acts_upstream_of_or_within, or removing the row from CdrB and
        keeping it on CdrA (PA4625).
      supported_by:
      - reference_id: PMID:20088866
        supporting_text: >-
          This is consistent with the data presented in Fig. 3, suggesting
          that CdrB is required for CdrA secretion.
