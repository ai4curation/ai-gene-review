taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4624 (CdrB) is the predicted outer-membrane beta-barrel transporter (TpsB)
  of the CdrAB two-partner secretion (type Vb) system of Pseudomonas
  aeruginosa. It has a signal peptide, an N-terminal POTRA domain and a
  C-terminal ShlB-type beta-barrel, the Omp85-superfamily architecture of
  FhaC. CdrB is encoded downstream of cdrA in a c-di-GMP-induced operon and
  is needed for secretion of its partner CdrA, a large beta-helical adhesin
  that binds the Psl polysaccharide and stabilises the biofilm matrix.
