taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Aer (PA1561, formerly TlpC) is the membrane-bound aerotaxis transducer of Pseudomonas aeruginosa PAO1,
  a methyl-accepting chemotaxis protein (MCP) with 45% identity to the Escherichia coli energy-taxis
  receptor Aer. It has an N-terminal cytoplasmic PAS domain, a pair of closely spaced transmembrane
  helices that anchor it in the inner membrane with almost no periplasmic segment, and a C-terminal
  cytoplasmic MCP signalling domain. Unlike classical chemoreceptors it has no periplasmic sensing
  domain; by analogy with E. coli Aer its PAS domain is expected to sense the cell's internal energy
  or redox state. Aer acts through the chemotaxis gene cluster 1 (cheYZABW) and CheR, and an aer mutant
  shows reduced aerotaxis, which is abolished when the soluble transducer Aer-2 (McpB) is also lost.
  Aer-mediated energy taxis is strong enough to mask chemotaxis mediated by other receptors. Expression
  of aer is induced on entry into stationary phase and requires the anaerobic regulator ANR.
