  supporting_entities:
  - InterPro:IPR004090
  review:
    summary: >-
      InterPro2GO transmembrane signaling receptor activity from the chemotaxis methyl-accepting receptor
      signature, which covers all MCPs.
    action: MODIFY
    reason: >-
      Aer is a signalling receptor, but not a transmembrane one in the sense of the definition (signal
      received on one side of the membrane and transmitted to the other). Its only sensory domain, the
      PAS domain, lies N-terminal to the transmembrane pair and so in the cytoplasm, the two helices are
      separated by a loop of four residues, and the MCP signalling domain is also cytoplasmic. The membrane
      segment is an anchor, as in E. coli Aer, not a signal-transmitting element. The essence (signalling
      receptor) is sound, so the row is generalized to the parent term.
