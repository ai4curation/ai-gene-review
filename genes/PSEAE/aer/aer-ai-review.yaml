suggested_questions:
- question: >-
    Does the P. aeruginosa Aer PAS domain bind FAD and sense electron transport chain redox state, as
    E. coli Aer does, or does it sense oxygen directly?
- question: >-
    InterPro2GO assigns transmembrane signaling receptor activity to all MCP-signature proteins, including
    membrane-anchored cytoplasmic sensors such as Aer. Should the mapping be restricted to MCPs with
    a periplasmic sensing domain?
suggested_experiments:
- description: >-
    Purify the Aer PAS domain and test for bound flavin, then measure aerotaxis of PAS mutants predicted
    to abolish FAD binding.
