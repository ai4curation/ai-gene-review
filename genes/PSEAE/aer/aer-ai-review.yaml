core_functions:
- description: >-
    Membrane-anchored aerotaxis (energy taxis) transducer. Its cytoplasmic PAS domain is the predicted
    sensor of internal energy or redox state, and its MCP signalling domain controls the CheA-CheW chemosensory
    array (chemotaxis cluster 1 and CheR) to direct movement towards favourable oxygen levels.
  supported_by:
  - reference_id: PMID:14987771
    supporting_text: Mutant strains which contained deletions in the methyl-accepting chemotaxis protein-like
      genes tlpC and tlpG showed decreased aerotaxis.
  - reference_id: PMID:14987771
    supporting_text: Aerotaxis assays of a number of deletion-insertion mutants of Pseudomonas aeruginosa
      PAO1 revealed that the chemotaxis gene cluster 1 and cheR are required for aerotaxis.
  - reference_id: PMID:17933940
    supporting_text: We found that a robust energy taxis response mediated by the Aer receptor can sometimes
      mask chemotaxis mediated by other methyl-accepting chemotaxis proteins (MCPs)
