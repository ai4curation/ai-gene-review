  review:
    summary: InterPro2GO NAD+-dependent formate dehydrogenase activity from the gamma-subunit signature.
    action: REMOVE
    reason: >-
      FdnI is the membrane cytochrome b subunit of a quinone-linked respiratory FDH; it neither
      binds NAD+ nor belongs to an NAD+-dependent formate dehydrogenase. The IPR006471 (formate
      dehydrogenase gamma subunit) mapping to the NAD+ term is wrong for this family.
