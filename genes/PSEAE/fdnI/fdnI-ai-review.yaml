id: Q9HUZ9
gene_symbol: fdnI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FdnI (PA4810) is the cytochrome b (gamma) subunit of the membrane-bound, nitrate-inducible
  respiratory formate dehydrogenase FdnGHI of Pseudomonas aeruginosa. It is an integral
  cytoplasmic-membrane protein with four transmembrane helices of the di-haem cytochrome b556
  family, and it anchors the FdnG catalytic and FdnH iron-sulfur subunits to the periplasmic face of
  the membrane. Its haem groups take electrons from FdnH and reduce quinone in the membrane,
  coupling formate oxidation to the quinone pool. The enzyme is made during anaerobic growth on
  nitrate, when it and nitrate reductase form a short formate-to-nitrate respiratory chain.
