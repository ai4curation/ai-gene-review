id: G3XD61
gene_symbol: wbpI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WbpI (PA3148) is a cytoplasmic nucleotide-sugar 2-epimerase of Pseudomonas aeruginosa that
  makes a precursor of the B-band (O-specific) O antigen of serotype O5. It converts
  UDP-2,3-diacetamido-2,3-dideoxy-alpha-D-glucuronate (UDP-GlcNAc3NAcA) to the manno
  configuration (UDP-ManNAc3NAcA, EC 5.1.3.23), the last step of a five-enzyme pathway from
  UDP-GlcNAc that supplies the di-N-acetylated mannosaminuronic acid residues of the O-antigen
  repeat. Although it belongs to the UDP-N-acetylglucosamine 2-epimerase (WecB) family, the
  purified enzyme does not act on UDP-GlcNAc or on the mono- or non-oxidized intermediates, and
  E. coli WecB cannot replace it. wbpI knockouts make no B-band LPS.
references:
- id: PMID:10930727
  title: Pseudomonas aeruginosa B-band lipopolysaccharide genes wbpA and wbpI and their Escherichia
    coli homologues wecC and wecB are not functionally interchangeable.
  findings:
  - statement: wbpI knockout abolishes B-band LPS.
    supporting_text: >-
      Specific knockout mutations in the putative UDP-D-N-acetylglucosamine (UDP-D-GlcNAc) epimerase gene,
        wbpI, or the putative UDP-D-N-acetylmannosamine dehydrogenase gene, wbpA, resulted in strains that
        no longer produced B-band lipopolysaccharide, confirming the essential roles of these genes in B-band
        O antigen synthesis.
  - statement: The authors propose that the substrate is di-N-acetylated, explaining why E. coli WecB
      does not complement.
    supporting_text: >-
      These results imply that the P. aeruginosa UDP-D-GlcNAc precursor may be di-N-acetylated prior to
        further modification, preventing the E. coli enzymes from recognizing it as a substrate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the GO:0000271, GO:0009243 and GO:0008761 IMP rows, which seed
      PTN001056041. Abstract only. Supports the O-antigen process rows (seed verdict SOUND for
      GO:0000271). The GO:0008761 MF row (seed verdict WRONG) uses the gene's provisional name;
      the abstract itself calls the gene "putative" and proposes a different substrate.
- id: PMID:17346239
  title: Identification and biochemical characterization of two novel UDP-2,3-diacetamido-2,3-dideoxy-alpha-D-glucuronic
    acid 2-epimerases from respiratory pathogens.
  findings:
  - statement: Purified WbpI 2-epimerizes UDP-GlcNAc3NAcA to UDP-ManNAc3NAcA.
    supporting_text: >-
      Data collected from one- and two-dimensional NMR experiments showed that His6-WbpI catalysed the
        2-epimerization of UDP-alpha-D-GlcNAc3NAcA, converting it into UDP-alpha-D-ManNAc3NAcA.
  - statement: WbpI does not use UDP-GlcNAc, UDP-GlcNAcA or UDP-GlcNAc3NAc.
    supporting_text: >-
      Neither enzyme utilized UDP-alpha-D-GlcNAc, UDP-alpha-D-GlcNAcA (UDP-2-acetamido-2,3-dideoxy-alpha-D-glucuronic
        acid) or UDP-alpha-D-GlcNAc3NAc (UDP-2,3-diacetamido-2,3-dideoxy-alpha-D-glucose) as substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Source of the UniProt GO:0008761 IDA and the PseudoCAP GO:0050378 EXP rows. Abstract
      only (PMC body not returned). The abstract states the reaction and the substrate
      exclusions, so the wrong-term calls on both rows are CONFIRMED.
