suggested_questions:
- question: >-
    Does OpdP work with DppA4 as a dedicated outer-membrane/periplasmic route for particular dipeptides,
    given their shared operon?
suggested_experiments:
- description: >-
    Compare dipeptide utilisation (Biolog PM plates) of opdP, dppA4 and double mutants to test whether
    OpdP is the outer membrane entry route for DppA4 substrates.
