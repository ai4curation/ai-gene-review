    review_notes: >-
      Full text read. The paper characterises the DppBCDF ABC transporter and its binding proteins DppA1-A5
      in PA14 and mentions OpdP only as the operon partner of dppA4, citing earlier work for its function.
      It contains no OpdP experiment, so it cannot support the PseudoCAP IDA porin activity row.
- id: PMID:22272184
  title: Substrate specificity within a family of outer membrane carboxylate channels.
  findings:
  - statement: >-
      Occ (OprD family) channels are the main route for small water-soluble molecules across the P. aeruginosa
      outer membrane.
    supporting_text: >-
      most of the water-soluble small molecules are thought to be taken up by members of the Outer membrane
      carboxylic acid channel (Occ) family
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Crystal structures, single-channel electrophysiology and vesicle uptake assays for
      OccD1-D3 and OccK1-K6; direct channel evidence for OprD (OccD1) and OpdP (OccD3).
- id: PMID:28440622
  title: >-
    Understanding Carbapenem Translocation through OccD3 (OpdP) of Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Single OccD3 channels reconstituted in planar bilayers interact with imipenem and meropenem; carbapenems
      follow the arginine path.
    supporting_text: single OccD3 channels in a planar lipid bilayer
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read. Direct single-channel evidence for OpdP.
