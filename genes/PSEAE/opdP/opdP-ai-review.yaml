taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  OpdP (OccD3, PA4501) is an outer membrane channel of the OccD subfamily of the Pseudomonas aeruginosa
  outer membrane carboxylate channel (Occ, formerly OprD) family, the closest paralog of OprD. It is a
  beta-barrel with an N-terminal extension that constricts the pore in the crystal structure; reconstituted
  channels show a large dominant conductance with low-conductance substates. OpdP mediates efficient arginine
  uptake and also transports glycine-glutamate and other dipeptides, and carbapenems such as imipenem
  and meropenem can translocate along the same path through its constriction zone. In P. aeruginosa opdP
  lies in an operon with the dipeptide-binding protein gene dppA4.
