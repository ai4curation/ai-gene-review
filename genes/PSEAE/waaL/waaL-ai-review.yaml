- id: PMID:15838026
  title: Functional characterization of WaaL, a ligase associated with linking O-antigen
    polysaccharide to the core of Pseudomonas aeruginosa lipopolysaccharide.
  full_text_unavailable: true
  findings:
  - statement: waaL knockout LPS lacks A-band and B-band O antigen and SR-LPS, restored by
      complementation; the mutant has swimming and twitching defects.
    supporting_text: waaL is required for the attachment of O-antigen repeat units to the core
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (PMC1082828; full text not retrievable). Supports ligase role and
      LPS biosynthesis; the motility and pilus/flagellum PseudoCAP rows drawn from it are indirect
      phenotypes.
- id: PMID:17697256
  title: WaaL of Pseudomonas aeruginosa utilizes ATP in in vitro ligation of O antigen
    onto lipid A-core.
  full_text_unavailable: true
  findings:
  - statement: Purified membrane WaaL ligates O-antigen-Und-PP to lipid A-core in vitro; the
      reported ATP dependence was later refuted.
    supporting_text: the development of an in vitro O-antigen ligase assay
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Correct paper for in vitro ligation and membrane location. Its central claim of
      ATP use/hydrolysis was contradicted by PMID:21983211 and PMID:30047569, so the ligase
      activity (EC 6) row based on it is removed.
- id: PMID:20824106
  title: Membrane topology mapping of the O-antigen flippase (Wzx), polymerase (Wzy),
    and ligase (WaaL) from Pseudomonas aeruginosa PAO1 reveals novel domain architectures.
  findings:
  - statement: Reporter fusions and GFP fusions place WaaL in the inner membrane with a large
      periplasmic loop carrying essential His303.
    supporting_text: Protein orientation in the inner membrane was confirmed via C-terminal fusion
      to green fluorescent protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The cytoplasmic Walker-like tracts it proposed fit the
      later-refuted ATPase model; topology was revised by PMID:30047569.
- id: PMID:21983211
  title: The WaaL O-antigen lipopolysaccharide ligase has features in common with metal
    ion-independent inverting glycosyltransferases.
  full_text_unavailable: true
