core_functions:
- description: O-antigen ligase (EC 2.4.99.26). In the inner membrane, with its catalytic loops in
    the periplasm, WaaL transfers completed undecaprenyl-PP-linked O antigen (OSA and CPA) onto lipid
    A-core, the final step of LPS assembly. The reaction needs no ATP or metal ion, as for an
    inverting glycosyltransferase.
  supported_by:
  - reference_id: PMID:30047569
    supporting_text: WaaL is an inner membrane glycosyltransferase that catalyzes the transfer of
      O-antigen polysaccharide from its lipid-linked intermediate to a terminal sugar of the lipid
      A-core oligosaccharide
  - reference_id: PMID:15838026
    supporting_text: waaL is required for the attachment of O-antigen repeat units to the core
  molecular_function:
    id: GO:0008754
    label: O-antigen ligase activity
  directly_involved_in:
