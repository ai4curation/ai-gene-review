- term:
    id: GO:0016874
    label: ligase activity
  evidence_type: IDA
  original_reference_id: PMID:17697256
  qualifier: enables
  review:
    summary: PseudoCAP IDA ligase activity, based on the 2007 report that WaaL hydrolyses ATP during
      ligation.
    action: REMOVE
    reason: GO:0016874 ligase activity (EC 6) is bond formation driven by NTP hydrolysis. WaaL is an
      EC 2.4.99.26 glycosyltransferase whose name, not chemistry, says ligase. The ATP dependence
      reported in PMID:17697256 was contradicted by later work showing ligation without ATP or
      Mg2+ and no ATP hydrolysis by either E. coli or P. aeruginosa WaaL, and GO:0008754 O-antigen
      ligase activity is classified under glycosyltransferase activity, not ligase activity. The
      claim is genuinely contradicted, not merely unverified.
    supported_by:
    - reference_id: PMID:21983211
      supporting_text: E. coli and Pseudomonas aeruginosa WaaL proteins cannot catalyze ATP
        hydrolysis in vitro
    - reference_id: file:PSEAE/waaL/waaL-uniprot.txt
      record_section: ["CC:MISCELLANEOUS"]
      supporting_text: However, it was shown later that ligation occurs without ATP and magnesium
        ions, and that WaaL cannot catalyze ATP hydrolysis in vitro
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0016874
      cause: OTHER
      confidence: CONFIRMED
      explanation: waaL (PA4999) is annotated IDA to GO:0016874 ligase activity citing PMID:17697256.
        WaaL is EC 2.4.99.26, an ATP-independent, metal-independent inverting glycosyltransferase
        (PMID:21983211, PMID:30047569); the ATP hydrolysis reported in 2007 was not reproduced.
