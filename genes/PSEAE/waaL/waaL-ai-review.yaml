id: Q9HUG6
gene_symbol: waaL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: WaaL (PA4999) is the O-antigen ligase of Pseudomonas aeruginosa PAO1, a 401-residue
  polytopic inner-membrane protein of the Wzy_C/WaaL family (CAZy GT121) with its catalytic
  periplasmic loops facing the periplasm. It catalyses the final step of lipopolysaccharide
  assembly, transferring a completed O-antigen polysaccharide from its undecaprenyl-diphosphate
  carrier onto a terminal sugar of the lipid A-core oligosaccharide (EC 2.4.99.26), and is required
  to attach both the O-specific antigen (B-band) and the common polysaccharide antigen (A-band).
  Despite its name, WaaL needs neither ATP nor divalent metal ions and behaves as a
  metal-independent inverting glycosyltransferase; the conserved periplasmic His303 is essential.
  waaL mutants make only rough, O-antigen-free LPS and show secondary envelope and motility
  defects.
