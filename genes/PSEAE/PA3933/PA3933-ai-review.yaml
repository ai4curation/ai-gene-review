suggested_questions:
- question: >-
    Is BetT2 (PA3933) a glycine betaine:proton symporter, as the 2008 heterologous-expression work is
    summarised, and does it contribute to glycine betaine uptake or osmoprotection in P. aeruginosa?
suggested_experiments:
- description: >-
    Radiolabelled glycine betaine and choline uptake by PA3933 expressed in a BCCT/ABC-deficient E. coli
    (MKH13), and growth of a P. aeruginosa betT2 deletion in a cbcV background on glycine betaine at low
    and high osmolarity.
