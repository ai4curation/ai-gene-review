- id: PMID:21478341
  title: Roles of three transporters, CbcXWV, BetT1, and BetT3, in Pseudomonas aeruginosa choline uptake
    for catabolism.
  findings:
  - statement: The functional work concerns CbcXWV, BetT1 and BetT3, not BetT2.
    supporting_text: This report describes the relative roles of three choline transporters, the ABC
      transporter CbcXWV and two symporters, BetT1 and BetT3
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Full text read on PMC (PMC3133218); the cache is abstract-only. PseudoCAP source for four IDA rows on
      PA3933 and the seed of PTN001247333. The paper names BetT2 as PA14_12990 (= PAO1 PA3933) and BetT3 as
      PA14_69850 (= PAO1 PA5291); its only BetT2 data are qRT-PCR showing no induction. The rows describe
      BetT3 and belong to PA5291.
- id: PMID:18156257
  title: Pseudomonas syringae BetT is a low-affinity choline transporter that is responsible for superior
    osmoprotection by choline over glycine betaine.
  findings:
  - statement: Functional P. aeruginosa BCCTs were identified by heterologous expression in P. syringae.
    supporting_text: Functional P. putida and P. aeruginosa transporters were identified
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Abstract only; full text not retrieved. Per the 2011 follow-up from the same group this paper showed
      glycine betaine transport by BetT2 (PA3933); PseudoCAP attached its glycine betaine rows to PA5291
      (see the PA5291 review).
