taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3933 encodes BetT2, one of three betaine/carnitine/choline transporter (BCCT, TC 2.A.15) family
  secondary transporters of Pseudomonas aeruginosa. It is a multi-pass cytoplasmic membrane protein with
  twelve predicted transmembrane helices and a long C-terminal tail. When expressed in Pseudomonas syringae
  it is reported to transport glycine betaine and to give osmoprotection at high salt. Unlike betT1 and
  betT3, betT2 expression does not respond to choline or glycine betaine, and its role in P. aeruginosa
  itself has not been tested.
