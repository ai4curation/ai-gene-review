description: TssJ1 is the outer-membrane lipoprotein of the Pseudomonas aeruginosa H1-T6SS membrane complex. Together with the inner-membrane proteins TssL1 and TssM1 it forms the trans-envelope TssJLM complex that anchors the contractile secretion apparatus across the cell envelope.
