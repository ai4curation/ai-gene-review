id: Q9I194
gene_symbol: pvdQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdQ (PA2385) is a periplasmic N-terminal nucleophile (Ntn) hydrolase of the
  peptidase S45 (penicillin acylase) family. It is made as a precursor with a
  signal peptide and matures autoproteolytically into an alpha/beta heterodimer
  whose beta-subunit N-terminal serine is the nucleophile. It is an
  acyl-homoserine lactone (AHL) acylase (EC 3.5.1.97) that removes the fatty
  acyl chain from long-chain AHLs (11 to 14 carbons), including the Las
  quorum-sensing signal 3-oxo-C12-HSL, releasing homoserine lactone and the
  free fatty acid, and so has quorum-quenching activity. Its main physiological
  role is in pyoverdine siderophore biosynthesis: expressed under iron
  starvation, it removes a fatty acyl chain from the acylated pyoverdine
  precursor in the periplasm, a maturation step needed to make mature
  pyoverdine. Loss of pvdQ abolishes pyoverdine production and, under iron
  limitation, reduces swarming, biofilm formation and virulence.
references:
- id: PMID:16495538
  title: Quorum quenching by an N-acyl-homoserine lactone acylase from Pseudomonas
    aeruginosa PAO1.
  findings:
  - statement: Purified PvdQ deacylates long-chain AHLs.
    supporting_text: In a bioassay, the purified acylase was shown to degrade AHLs
      with side chains ranging in length from 11 to 14 carbons at physiologically
      relevant low concentrations.
  - statement: GC and GC/MS show lauric acid released from C12-HSL by the purified enzyme.
    supporting_text: one can conclude that the PA2385 protein is an AHL acylase
  - statement: No activity on the beta-lactam compounds tested.
    supporting_text: No activity was detected.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA source for GO:0016811 and a seed of the PTN002151232 IBD.
      Full text cached and read: purified enzyme, fluorescamine assay for released
      HSL and GC/MS of released lauric acid. Direct evidence for AHL acylase
      activity, for which GO:0016811 is the most specific existing term.
- id: PMID:12686626
  title: Identification and characterization of novel pyoverdine synthesis genes in
    Pseudomonas aeruginosa.
  findings:
  - statement: Targeted mutagenesis identified eight new pvd genes required for pyoverdine synthesis.
    supporting_text: Eight new pvd genes were identified.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Genetic screen of candidate pvd genes; UniProt cites it for
      pvdQ being required for pyoverdine biosynthesis.
- id: PMID:19787431
  title: Synthesis of the siderophore pyoverdine in Pseudomonas aeruginosa involves
    a periplasmic maturation.
  findings:
  - statement: A pvdQ mutant accumulates a precursor in the periplasm and secretes an altered siderophore.
    supporting_text: suggesting a role for PvdQ in the periplasmic maturation of
      PVDI
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; supports the periplasmic pyoverdine maturation role.
- id: PMID:21892836
  title: Structural characterization and high-throughput screening of inhibitors of
    PvdQ, an NTN hydrolase involved in pyoverdine synthesis.
  findings:
  - statement: PvdQ is acylated by the acyl group derived from the acyl-pyoverdine precursor.
    supporting_text: Structural studies are also presented showing PvdQ covalently
      acylated with the acyl moiety substrate derived from the acyl-pyoverdine precursor
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Links the acylase chemistry to deacylation of the
      acyl-pyoverdine precursor, so PvdQ catalyses a step of pyoverdine biosynthesis.
- id: PMID:22498339
  title: 'High cellular organization of pyoverdine biosynthesis in Pseudomonas aeruginosa:
    clustering of PvdA at the old cell pole.'
  findings:
  - statement: Fluorescently labelled PvdQ is uniformly distributed in the periplasm.
    supporting_text: Epifluorescence and TIRF imaging on cells expressing labelled
      PvdQ showed that this enzyme was uniformly distributed in the periplasm
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. The abstract states that PvdQ is periplasmic and that PvdA,
      not PvdQ, is the cytoplasmic and membrane enzyme. The PseudoCAP GO:0005737
      cytoplasm IDA row attributed to pvdQ from this paper contradicts the
      abstract (source defect recorded).
- id: PMID:20080736
  title: The quorum-quenching N-acyl homoserine lactone acylase PvdQ is an Ntn-hydrolase
    with an unusual substrate-binding pocket.
  findings:
  - statement: Crystal structure shows an alpha/beta heterodimeric Ntn-hydrolase fold.
    supporting_text: PvdQ has a typical alpha/beta heterodimeric Ntn-hydrolase fold
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structural basis of the acylase; IntAct source of the identical protein binding IPI.
- id: PMID:19778968
  title: Role of PvdQ in Pseudomonas aeruginosa virulence under iron-limiting conditions.
  findings:
  - statement: Under iron limitation the pvdQ deletion impairs swarming and biofilm formation, effects linked to pyoverdine.
    supporting_text: PvdQ plays a major role in swarming motility, in biofilm development
      and in infection that is more likely to be linked to the pyoverdine pathway
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Phenotypes are downstream of pyoverdine (iron) deficiency.
- id: PMID:21833667
  title: Influence of Pseudomonas aeruginosa pvdQ gene on altering antibiotic susceptibility
    under swarming conditions.
  findings:
  - statement: PvdQ overproduction increases antibiotic resistance under swarming conditions.
    supporting_text: pvdQ plays an important role in elevating antibiotic resistance
      via swarm-cell differentiation and possibly other mechanisms as well
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. Indirect phenotype (overexpression and swarm-cell differentiation).
- id: PMID:18245294
  title: Swarming of Pseudomonas aeruginosa is a complex adaptation leading to increased
    production of virulence factors and antibiotic resistance.
  findings:
  - statement: A PA14 pvdQ mutant is defective in swarming.
    supporting_text: two virulence genes, lasB and pvdQ , were required for swarming
      motility
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text cached. The mutant is a PA14 transposon mutant; the authors
      attribute the swarming defect to the acylase activity (signal levels), so
      the phenotype is indirect.
