core_functions:
- description: >-
    Periplasmic Ntn-hydrolase acylase that deacylates the acyl-pyoverdine
    precursor during pyoverdine maturation and also deacylates long-chain
    acyl-homoserine lactones such as 3-oxo-C12-HSL (EC 3.5.1.97).
  molecular_function:
    id: GO:0016811
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds,
      in linear amides
  directly_involved_in:
  - id: GO:0002049
    label: pyoverdine biosynthetic process
  locations:
  - id: GO:0042597
    label: periplasmic space
  supported_by:
  - reference_id: PMID:16495538
    supporting_text: one can conclude that the PA2385 protein is an AHL acylase
  - reference_id: PMID:21892836
    supporting_text: Structural studies are also presented showing PvdQ covalently
      acylated with the acyl moiety substrate derived from the acyl-pyoverdine precursor
proposed_new_terms:
- proposed_name: N-acyl homoserine lactone acylase activity
  proposed_definition: >-
    Catalysis of the reaction an N-acyl-L-homoserine lactone + H2O = L-homoserine
    lactone + a carboxylate (EC 3.5.1.97, RHEA:18937).
  justification: >-
    GO has an AHL synthase term (GO:0061579) but no term for AHL acylase
    (EC 3.5.1.97). PvdQ, QuiP and PA0305 (HacB) of P. aeruginosa all have this
    activity shown directly, and the closest available term is the generic
    GO:0016811.
  proposed_parent:
    id: GO:0016811
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds,
      in linear amides
  supported_by:
  - reference_id: PMID:16495538
    supporting_text: one can conclude that the PA2385 protein is an AHL acylase
suggested_questions:
- question: >-
    Is AHL quorum quenching a physiological role of PvdQ, given that it is
    expressed mainly under iron starvation and that its in vivo phenotypes track
    pyoverdine rather than AHL levels?
suggested_experiments:
- description: >-
    Compare kcat/Km of purified PvdQ for the acyl-pyoverdine precursor and for
    3-oxo-C12-HSL to establish which is the physiological substrate.
