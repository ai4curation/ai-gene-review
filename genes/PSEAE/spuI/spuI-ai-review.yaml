suggested_questions:
- question: >-
    What are the relative putrescine and cadaverine specificities of PauA1
    versus PauA4 and PauA5, which explain the combinations of knockouts needed
    to block growth on each diamine?
suggested_experiments:
- description: >-
    Assay purified SpuI/PauA1 for ATP-dependent gamma-glutamylation of
    putrescine, cadaverine, 1,3-diaminopropane and spermidine, and for
    glutamine synthetase activity with ammonia.
