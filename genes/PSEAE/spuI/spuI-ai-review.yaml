- term:
    id: GO:0046203
    label: spermidine catabolic process
  evidence_type: IMP
  original_reference_id: PMID:12081945
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP seed row. The cited paper reports no growth defect of spuI
      mutants on polyamines, and the later pauA analysis assigns spermidine
      utilization to pauA2 (spuB), not pauA1. Seed verdict WRONG.
    action: REMOVE
    reason: >-
      No evidence places SpuI in spermidine catabolism. The cited paper reports
      the opposite phenotype (normal growth), and in PMID:21622750 the pauA1
      single mutant grows on spermidine while a pauA2 single knockout alone
      blocks it.
