- term:
    id: GO:0009447
    label: putrescine catabolic process
  evidence_type: IMP
  original_reference_id: PMID:12081945
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP seed row. The cited paper states that spuI mutations caused no
      growth defect on polyamines, so it does not support the row. The term is
      nonetheless true for SpuI/PauA1 from PMID:21622750 (pauA1A4 and pauA1A2A4
      mutants fail to grow on putrescine). Seed verdict WRONG (reference).
    action: ACCEPT
    reason: >-
      The claim holds on other evidence, so the row is kept, but its reference
      should be re-pointed. PauA1 is a predicted putrescine-glutamylating enzyme,
      the first step of the pathway, so it does work in the process.
