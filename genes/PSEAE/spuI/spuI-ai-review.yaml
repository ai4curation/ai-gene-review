taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SpuI (PA0296, PauA1) is a glutamine synthetase-like gamma-glutamylpolyamine
  synthetase of Pseudomonas aeruginosa PAO1, homologous to Escherichia coli
  PuuA, which gamma-glutamylates putrescine as the first step of the
  gamma-glutamylation route from polyamines to GABA. spuI is transcribed
  divergently from the polyamine-inducible spuABCDEFGH operon. A spuI single
  mutant grows normally on polyamines, but spuI is needed together with its
  paralogs pauA4 (and pauA2) for growth on putrescine and with pauA4 and pauA5
  for growth on cadaverine, so it is a redundant diamine-glutamylating enzyme of
  polyamine catabolism. Its activity has not been assayed with purified
  protein.
