- id: PMID:12081945
  title: Functional analysis and regulation of the divergent spuABCDEFGH-spuI operons
    for polyamine uptake and utilization in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: spuI mutants show no growth defect on agmatine or polyamines.
    supporting_text: While mutations on spuI did not show any growth defect on agmatine
      and polyamines, the contiguous spuABC genes are all related to polyamine catabolism.
  - statement: SpuI and SpuB are glutamine synthetase homologues similar to E. coli YcjK (PuuA).
    supporting_text: One interesting feature of these spu genes is the presence of two
      putative glutamine synthetase homologues encoded by spuB and spuI .
  - statement: The spuI promoter is induced by agmatine, putrescine and spermidine.
    supporting_text: we demonstrated that the divergent spuA and spuI promoters are inducible
      by exogenous agmatine, putrescine, and spermidine.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      PseudoCAP source for the IMP GO:0009447 and GO:0046203 rows (seed of
      PTN001839150). Full text read: the paper reports that spuI mutations
      cause no growth defect on agmatine or polyamines, so it does not support
      either IMP row. Putrescine catabolism for spuI is shown later by
      PMID:21622750 with pauA double and triple mutants.
- id: PMID:21622750
  title: Functional characterization of seven γ-Glutamylpolyamine synthetase genes
    and the bauRABCD locus for polyamine and β-Alanine utilization in Pseudomonas
    aeruginosa PAO1.
  findings:
  - statement: Specific combinations of pauA knockouts are needed to abolish growth on different polyamines.
    supporting_text: The results revealed that it requires specific combinations of
      pauA knockouts to abolish utilization of different polyamines and support the
      importance of γ-glutamylation for polyamine catabolism in P. aeruginosa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached copy abstract only; the PMC page (PMC3147493) was read through a
      fetch summary. Table 1 gives pauA1 = PA0296 (spuI). The pauA1 single
      mutant grows normally on all polyamines tested; the pauA1A4 double mutant
      is severely retarded on putrescine and the pauA1A2A4 triple mutant cannot
      grow on putrescine; pauA1A4A5 cannot grow on cadaverine. Spermidine
      growth needs pauA2 alone. No purified-enzyme assay.
