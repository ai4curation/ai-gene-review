knowledge_gaps:
- gap_statement: >-
    No molecular function is known for PA2403. It is a polytopic inner-membrane protein
    with two PepSY modules whose activity, substrate and partners are all undetermined,
    and no experiment has tested whether it acts in pyoverdine synthesis, in siderophore
    export, or in the iron sensing that gates the pathway.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    The protein is the sole seed of a PAINT IBD, so whatever is eventually shown about it
    propagates to the rest of PTHR34219. It is also iron-regulated in a pathogen, where
    siderophore biosynthesis is a virulence trait, so the gap sits on a pathway of
    therapeutic interest.
  provenance:
  - reference_id: file:PSEAE/PA2403/PA2403-uniprot.txt
    supporting_text: '4: Predicted'
suggested_questions:
- question: >-
    Does a clean PA2403 deletion reduce pyoverdine production under iron limitation, or is
    the gene merely co-regulated with the pathway by PvdS? The distinction decides whether
    either annotation on this gene stands, and whether the IBD that propagates from it to
    PTHR34219 should remain.
- question: >-
    What do the PepSY modules do in this protein? The domain is named after peptidase
    propeptides, so one possibility is that PA2403 is a membrane-anchored modulator of a
    periplasmic protease rather than a biosynthetic enzyme, which would make both current
    annotations wrong in kind rather than in detail.
suggested_experiments:
- description: >-
    Construct an unmarked PA2403 deletion in PAO1 and quantify pyoverdine under iron
    limitation by fluorescence and by CAS assay, with the parent strain and a complemented
    derivative as controls.
  hypothesis: >-
    PA2403 is co-regulated with pyoverdine biosynthesis by PvdS but is not required for
    pyoverdine production, so the existing process annotations record regulation rather
    than participation.
  experiment_type: targeted gene deletion with siderophore quantification
- description: >-
    Localise a functional tagged PA2403 by fractionation and protease-accessibility
    mapping to establish its topology, and pull down interactors from the membrane fraction
    under iron starvation.
  hypothesis: >-
    The PepSY modules face the periplasm and engage a periplasmic partner, placing the
    protein in sensing or maturation rather than in cytoplasmic biosynthesis.
  experiment_type: topology mapping and membrane interactome
