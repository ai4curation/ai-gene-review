product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2403 is an uncharacterised polytopic inner-membrane protein of Pseudomonas
  aeruginosa, 403 residues with four predicted transmembrane helices and two PepSY
  modules (Pfam PF03413 PepSY and PF03929 PepSY_TM; InterPro IPR025711 and IPR005625).
  PANTHER assigns it to PTHR34219, a family of iron-regulated inner-membrane proteins.
  Its transcription is induced under iron starvation and depends on PvdS, the
  alternative sigma factor that drives pyoverdine biosynthesis, which is how the locus
  came to be described as a novel pyoverdine biosynthesis gene. No molecular activity,
  substrate, partner or cellular role has been demonstrated for it. PepSY modules occur
  in membrane proteins related to peptidase
  propeptides and in the YpeB family, but no catalytic or binding activity is established
  for this protein, so whether it acts in siderophore synthesis, in export, or in the
  iron sensing that gates the pathway is open.
references:
- id: PMID:12207696
  title: 'GeneChip expression analysis of the iron starvation response in Pseudomonas
    aeruginosa: identification of novel pyoverdine biosynthesis genes.'
  findings:
  - statement: Genes were identified as novel pyoverdine biosynthesis genes by their
      PvdS-dependent expression under iron limitation, scored in a pvdS deletion mutant.
      The phenotype measured is the candidate gene's own transcription, not pyoverdine
      production, and the mutated gene is pvdS rather than the candidate.
    supporting_text: Under low-iron conditions, expression of 26 genes or operons was
      reduced in a DeltapvdS mutant compared with wild type, including numerous novel
      pyoverdine biosynthetic genes.
    reference_section_type: ABSTRACT
  - statement: The study itself notes that a large fraction of the iron-regulated set
      is functionally uncharacterised, which is the category this locus falls in.
    supporting_text: Roughly 20% of the iron-regulated genes encoded proteins of unknown
      function and lacked any conclusive homologies.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The sole experimental reference for this gene and the source of the PseudoCAP IMP.
      Correctly cited: PubMed-verified as Ochsner UA, Wilderman PJ, Vasil AI, Vasil ML,
      Mol Microbiol 45(5):1277-87, 2002, doi 10.1046/j.1365-2958.2002.03084.x. Cached
      abstract only, and no PMC record exists (convert_article_ids returns no PMCID), so
      the full text could not be read. The abstract does not name PA2403, and the
      criterion it states for the gene class is PvdS-dependent transcription. Whether the
      full text also reports a PA2403 deletion assayed for pyoverdine is exactly what
      cannot be checked here, which is why the rows below are undecided rather than
      corrected.
