      Inherits the uncertainty of its single seed. The phylogenetic judgement itself is not
      disputed on sequence grounds -- a family of iron-regulated membrane proteins is a
      coherent clade and the node placement is not challenged here -- but a node with one
      seed asserts no more than that seed supports, and that seed may record PvdS-dependent
      expression rather than a biosynthetic role. Resolving the row above resolves this one;
      until then neither accepting nor removing it would be honest.
