existing_annotations:
- term:
    id: GO:0002049
    label: pyoverdine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:12207696
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP, and the only grounded annotation this gene has. The cited study
      identified its "novel pyoverdine biosynthesis genes" by PvdS-dependent expression
      under iron limitation: the mutant assayed was a pvdS deletion and the measured
      phenotype was the candidate gene's own transcription. On the abstract alone that is
      evidence of being regulated with the pathway rather than of performing a step in it,
      and PvdS also controls genes outside pyoverdine synthesis. The abstract does not
      name PA2403 and the paper has no PMC record, so the full text, where a PA2403
      deletion assayed for pyoverdine would appear if it exists, could not be read.
    action: UNDECIDED
    reason: >-
      Cannot be verified from the available text, which is the condition the enum reserves
      this action for. The concern is specific and checkable, so it is filed as a
      SUSPECTED source defect requesting a check of the evidence code rather than acted on:
      a curator with the full text may well have seen a gene-specific phenotype, and this
      project does not overrule an experimental annotation whose supporting text it has not
      read. Not REMOVE, and not ACCEPT either, because on what can be seen the row may
      record regulation as participation. This diverges from PA2412, which carries the same
      PseudoCAP row from the same reference and ACCEPTs it: that review reaches ACCEPT on
      independent deletion-mutant data (PMID:17502378, "PA2412 is necessary for the
      production or secretion of pyoverdine at normal levels") while recording that the
      reference itself is unverified for IMP. PA2403 has no such independent data, so the
      same row resolves differently on the same reasoning rather than on a different rule.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      record: UniProtKB:Q9I178 involved_in GO:0002049 pyoverdine biosynthetic process
        (IMP, PMID:12207696)
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: IMP
      corrected_value: IEP
      cause: CONTEXT_NOT_ASSAYED
      confidence: SUSPECTED
      explanation: >-
        Request to confirm which experiment supports this row. The cited paper's stated
        criterion for its novel pyoverdine biosynthesis genes is reduced expression in a
        pvdS deletion under iron limitation, so the mutant assayed is pvdS and the readout
        is the candidate gene's transcription; that is an expression pattern (IEP), not a
        phenotype of a PA2403 mutant (IMP). The claim is deliberately marked SUSPECTED and
        CHECK rather than confirmed: this rests on the abstract, the abstract does not
        mention PA2403, and the paper has no PMC full text, so a gene-specific deletion
        reported in the full text would overturn it. If the row is IEP, the IBD at
        PANTHER:PTN009150613, whose only seed is this row, should be re-examined as well,
        since expression dependence cannot support propagating a biosynthetic process
        across a family.

        Scope: this is a reference-level question, not an isolated row. Five PAO1 genes
        carry the identical PseudoCAP row -- involved_in GO:0002049, IMP, PMID:12207696 --
        all dated 20190311: PA2403, PA2412, pvdN, pvdO and pvdP. The same row made on the
        same day across a set is a deliberate curation practice rather than a slip, so the
        request is to confirm what evidence that reference was taken to supply for the set,
        and PA2403 is named here only because it is the gene under review.

        One asymmetry inside that set supports the reading and does not settle it. The 2003
        follow-up PMID:12686626 did construct mutants and assay pyoverdine, and it yielded
        GO:0002049 IMP rows on ten genes -- PA2412, opmQ, pvdH, pvdL, pvdN, pvdO, pvdP,
        pvdQ, pvdR and pvdT -- which includes four of the five above but not PA2403. So the
        one gene of the 2002 batch that never received an independent mutant-phenotype row
        is the one whose 2002 row is questioned here. That is suggestive rather than
        probative: an absent row is not evidence of an absent experiment, which is why this
        stays SUSPECTED.

        One concrete thing to look up would settle it. That 2003 abstract says fourteen
        candidate genes were mutated and eight new pvd genes were identified, so six
        candidates were assayed and scored negative, and the abstract does not enumerate
        the fourteen. If PA2403 was among them it was assayed for pyoverdine and scored
        negative, which is considerably stronger than never having been followed up; if it
        was not, the reading above stands as written. That list is in the 2003 full text,
        which is readable, rather than in the 2002 full text, which is not.
      supported_by:
      - reference_id: PMID:12207696
        supporting_text: Under low-iron conditions, expression of 26 genes or operons was
          reduced in a DeltapvdS mutant compared with wild type, including numerous novel
          pyoverdine biosynthetic genes.
    supported_by:
    - reference_id: PMID:12207696
      supporting_text: Under low-iron conditions, expression of 26 genes or operons was
        reduced in a DeltapvdS mutant compared with wild type, including numerous novel
        pyoverdine biosynthetic genes.
