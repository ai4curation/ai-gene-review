- id: PMID:12686626
  title: Identification and characterization of novel pyoverdine synthesis genes in Pseudomonas
    aeruginosa.
  findings:
  - statement: The 2003 follow-up mutated candidate genes and scored pyoverdine production
      directly, which the 2002 paper did not. Fourteen candidates were mutated and eight
      scored positive, so six were tested and found not required. Whether PA2403 was among
      the fourteen is not stated in the abstract and would settle the question this
      review's source defect raises.
    supporting_text: The candidate genes were mutated and the effects of the mutations on
      pyoverdine production were determined. Eight new pvd genes were identified.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited for the asymmetry argument rather than for PA2403's own function: this paper
      yielded GO:0002049 IMP rows on ten PAO1 genes, including four of the five that carry
      the 2002 PseudoCAP row, and not on PA2403. PubMed-verified as Lamont IL, Martin LW,
      Microbiology (Reading) 2003. Cached abstract only; the fourteen candidate genes are
      not enumerated in it, which is the one checkable fact that would resolve the defect
      either way.
- id: PMID:17502378
  title: The 1.8 A crystal structure of PA2412, an MbtH-like protein from the pyoverdine
    cluster of Pseudomonas aeruginosa.
  findings:
  - statement: Independent deletion-mutant evidence for PA2412, which is why PA2412's
      review reaches ACCEPT on the same PseudoCAP row that is undecided here. It says
      nothing about PA2403 and is not support for any PA2403 row.
    supporting_text: Our results demonstrate that PA2412 is necessary for the production
      or secretion of pyoverdine at normal levels.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Background for the divergence from PA2412, not evidence about this gene. A paper on
      a different gene of the same cluster cannot support a PA2403 annotation, so it is
      cited only in the review reason and recorded here so that its quote is checked.
      PubMed-verified as Drake EJ et al., J Biol Chem 2007.
