- id: PMID:22304305
  title: ArsH from the cyanobacterium Synechocystis sp. PCC 6803 is an efficient NADPH-dependent
    quinone reductase.
  findings:
  - statement: Purified Synechocystis ArsH is an NADPH-dependent quinone reductase with a ping-pong
      mechanism; arsH mutants of Synechocystis are menadione-sensitive.
    supporting_text: We present kinetic evidence supporting a quinone reductase activity for ArsH, with a
      preference for quinones with hydrophobic substituents.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Cited by PseudoCAP for GO:0016655 (IDA) on PA2280. PubMed record matches the citation, but
      the paper is about Synechocystis sp. PCC 6803 ArsH (stated in the abstract; MeSH Synechocystis); it
      is homology-level context for PA2280, not direct evidence. Abstract only; no PMC record.
- id: PMID:26621870
  title: Identification of novel members of the bacterial azoreductase family in Pseudomonas
    aeruginosa.
  findings:
  - statement: Recombinant P. aeruginosa ArsH (PA2280), expressed in E. coli, has azoreductase and NAD(P)H
      quinone oxidoreductase activity.
    supporting_text: The ArsH, MdaB and YieF family members all show azoreductase and NQO activities.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record matches (Biochem J 473:549-558). Abstract only; the locus identity (pa2280 =
      paArsH) comes from the companion Crescente thesis (Kingston University eprints), not from the
      abstract.
