  label: Pseudomonas aeruginosa PAO1
description: PA2280 encodes ArsH, an FMN-binding flavodoxin-like NADPH-dependent reductase of the ArsH
  family, encoded in the arsenic-resistance (ars) gene cluster of Pseudomonas aeruginosa. Recombinant
  P. aeruginosa ArsH reduces quinones (NAD(P)H quinone oxidoreductase activity) and azo dyes, with NADPH
  as the preferred electron donor; ArsH proteins from other bacteria are likewise NADPH-dependent quinone
  reductases. Its physiological substrate and its contribution to arsenic resistance in P. aeruginosa
  have not been established.
