      Right gene and, unlike the same PMID on hom, the right paper: it is about thrB. The
      activity is correct for PA5495 on family and genetic grounds. But the abstract describes
      no direct assay of ThrB; its evidence is the threonine auxotrophy of the thrB thrH double
      mutant, which supports the process rather than this specific activity. The full text
      could not be read, so I defer to the curator on the claim and flag the evidence code.
    supported_by:
