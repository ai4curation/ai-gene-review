  review:
    summary: >-
      IBA from PTN001464661 (10 leaf IBAs), whose homoserine kinase IBD has a single seed,
      this gene's PseudoCAP IDA row. The target appearing in its own WITH/FROM is expected,
      not circular.
    action: ACCEPT
    reason: >-
      For PA5495 itself the activity is well supported by family evidence (HAMAP MF_00301
      type II HSK) and genetics: thrB and thrH are redundant for threonine synthesis, and
      ThrH reaches phosphohomoserine by a different, ATP-independent chemistry, so ThrB is
      the ATP-dependent kinase. The seed's assay is not visible (see the IDA row), and the
      node also covers B. subtilis AmiN, an amicoumacin kinase; that concerns another leaf
      and is flagged.
