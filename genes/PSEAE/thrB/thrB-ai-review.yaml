      supporting_text: Belongs to the pseudomonas-type ThrB family.
    - reference_id: PMID:10220164
      supporting_text: >-
        In P. aeruginosa, threonine auxotrophy is observed only when both thrB and thrH are
        simultaneously inactivated.
    source_defects:
