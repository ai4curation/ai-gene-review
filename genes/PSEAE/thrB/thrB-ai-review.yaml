taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  thrB (PA5495) encodes homoserine kinase (EC 2.7.1.39) of Pseudomonas aeruginosa, a type
  II homoserine kinase of the aminoglycoside phosphotransferase (protein-kinase-like) fold
  that is unrelated to the GHMP-family homoserine kinases of Escherichia coli and Bacillus
  subtilis. It phosphorylates L-homoserine with ATP to give O-phospho-L-homoserine, the fourth
  of five steps of L-threonine synthesis from aspartate, between homoserine dehydrogenase
  (Hom) and threonine synthase (ThrC). Unlike the other thr genes, thrB lies apart from the
  hom-thrC operon. Its loss alone does not cause threonine auxotrophy because ThrH, a phosphoserine
  phosphatase with phosphoserine:homoserine phosphotransferase activity, provides a parallel
  route to O-phospho-L-homoserine; only thrB thrH double mutants require threonine. Its activity
  is inferred from family membership and genetics; the purified PA5495 enzyme has not been
  characterised.
