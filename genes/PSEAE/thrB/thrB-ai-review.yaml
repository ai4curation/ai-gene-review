suggested_questions:
- question: >-
    Does the full text of Patte et al. 1999 (PMID:10220164) contain a homoserine kinase assay
    of ThrB (purified, or extracts of thrB versus thrH mutants)? If not, the PseudoCAP IDA
    rows on PA5495, sole seeds of the PTN001464661 IBDs, should be recoded IGI (process) and
    the MF re-anchored.
- question: >-
    Should PTN001464661 be restricted to type II homoserine kinases, excluding B. subtilis
    AmiN/YerI (amicoumacin kinase) and the uncharacterised Synechocystis sll1119 and Deinococcus
    DR_0394?
suggested_experiments:
- description: >-
    Purify PA5495 and measure ATP-dependent homoserine phosphorylation (kinetics, nucleotide
    and substrate specificity), and test B. subtilis AmiN for homoserine kinase activity,
    to anchor the type II HSK node on direct evidence.
