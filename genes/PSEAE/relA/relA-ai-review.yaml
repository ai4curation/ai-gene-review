    summary: PAINT IBA of (p)ppGpp hydrolase activity, seeded by E. coli SpoT (P0AG24) at the node that
      contains both the RelA and the SpoT paralogs.
    action: REMOVE
    reason: In beta- and gamma-proteobacteria the ancestral bifunctional Rel duplicated into SpoT, which kept
      the hydrolase, and RelA, whose HD domain diverged and lost hydrolase activity. Placing the hydrolase IBD
      on the duplication ancestor propagates it to every RelA leaf, including this one. No hydrolase activity
      has been reported for P. aeruginosa RelA, and in PAO1 degradation is attributed to SpoT.
    propagation_review:
