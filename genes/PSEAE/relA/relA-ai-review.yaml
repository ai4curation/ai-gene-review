- id: PMID:15385461
  title: Pseudomonas aeruginosa relA contributes to virulence in Drosophila melanogaster.
  findings:
  - statement: A PAO1 relA mutant makes no (p)ppGpp after serine hydroxamate; multicopy relA restores it.
    supporting_text: ppGpp and pppGpp were undetectable in the relA mutant, whereas wild-type PAO1 produced
      high levels of ppGpp and pppGpp
  - statement: relA loss reduces Drosophila virulence and alters quorum-sensing signals, pyocyanin, elastase
      and RpoS levels (downstream phenotypes of the alarmone).
    supporting_text: Deletion of relA also resulted in reduced levels of the RpoS sigma factor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cited by PseudoCAP for GO:0015968 (IMP). Full text cached (PMC517598); the ppGpp TLC assay
      under serine starvation directly supports the stringent-response annotation.
- id: PMID:21788391
  title: The stringent response is essential for Pseudomonas aeruginosa virulence in the rat lung agar bead
    and Drosophila melanogaster feeding models of infection.
  findings:
  - statement: The relA spoT double mutant is ppGpp-null under all starvation conditions tested; SpoT
      degrades ppGpp.
    supporting_text: no (p)ppGpp synthesis could be detected in the relA spoT double mutant under any growth
      condition tested, including starvation for nutrients such as amino acids, carbon, and iron
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; division of labour between RelA and SpoT in PAO1.
- id: PMID:18776018
  title: SpoT-triggered stringent response controls usp gene expression in Pseudomonas aeruginosa.
  findings:
  - statement: Stationary-phase ppGpp accumulation in PAO1 is SpoT-dependent and still occurs in the relA
      mutant.
    supporting_text: indicating a SpoT-derived control of ppGpp accumulation
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only; context for RelA versus SpoT roles.
- id: PMID:21858139
  title: 'The RelA/SpoT homolog (RSH) superfamily: distribution and functional evolution of ppGpp synthetases
    and hydrolases across the tree of life.'
  findings:
  - statement: Proteobacterial RelA arose by duplication of Rel and lost hydrolase activity; SpoT kept both
      activities.
    supporting_text: while RelA is clearly more divergent, consistent with its loss of hydrolase activity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; phylogenetic basis for rejecting the hydrolase IBA on RelA.
