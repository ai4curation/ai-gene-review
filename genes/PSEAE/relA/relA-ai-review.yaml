taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: relA (PA0934) encodes the ribosome-associated (p)ppGpp synthetase I of Pseudomonas aeruginosa, a
  long RelA/SpoT homologue (RSH) with an N-terminal hydrolase-like domain, a synthetase domain, and
  C-terminal TGS, helical and ACT regulatory domains. Activated by uncharged tRNA at stalled ribosomes
  during amino-acid starvation, RelA transfers pyrophosphate from ATP to GTP/GDP to make pppGpp and ppGpp,
  the alarmones of the stringent response. In PAO1 the relA mutant makes no (p)ppGpp under serine
  starvation, whereas the paralog SpoT (PA5338) supplies ppGpp in stationary phase and under other
  starvations and is the bifunctional enzyme that also degrades it; RelA of beta- and gamma-proteobacteria
  has lost hydrolase activity. Through (p)ppGpp, RelA influences quorum-sensing signal production, RpoS
  levels, stress tolerance and virulence.
