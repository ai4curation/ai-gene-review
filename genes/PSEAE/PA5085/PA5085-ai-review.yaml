  title: Functional characterization of the dguRABC locus for D-Glu and d-Gln utilization in Pseudomonas
    aeruginosa PAO1.
  findings:
  - statement: DguR (PA5085) activates dguABC, binds a conserved 19 bp operator, and is stabilised on DNA by
      D-Glu; dguR mutants do not grow on D-Glu.
    supporting_text: Although the DNA-binding activity of DguR did not require D-Glu, the presence of D-Glu,
      but not D-Gln, in the binding reaction was found to stabilize a preferred nucleoprotein complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cited by PseudoCAP for GO:0043565 (IDA). PubMed record matches; abstract only in the cache.
      PA5085 is dguR (Pseudomonas Genome Database). EMSA with purified protein supports the term directly.
