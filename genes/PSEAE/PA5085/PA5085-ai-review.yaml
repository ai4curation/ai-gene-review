taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA5085 (dguR) encodes DguR, a LysR-type transcriptional regulator with an N-terminal
  helix-turn-helix DNA-binding domain and a C-terminal co-inducer-binding domain. DguR activates the
  divergently transcribed dguABC operon, which encodes the FAD-dependent D-amino acid dehydrogenase DguA
  and other proteins for D-glutamate and D-glutamine catabolism. Purified DguR binds a conserved 19 bp
  operator motif in the dguR-dguA intergenic region; binding does not need D-glutamate, but D-glutamate
  stabilises a preferred nucleoprotein complex, so DguR acts as a D-glutamate sensor. dguR mutants cannot
  grow on D-glutamate as sole carbon or nitrogen source.
