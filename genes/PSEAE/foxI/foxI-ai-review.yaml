- id: PMID:16484199
  title: The heterologous siderophores ferrioxamine B and ferrichrome activate signaling pathways in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      The ECF sigma factors FoxI and FiuI drive ferrioxamine B- and ferrichrome-specific induction of
      the receptors FoxA and FiuA.
    supporting_text: The involvement of this putative regulatory locus in the specific induction of the
      ferrioxamine B and ferrichrome receptors has been demonstrated
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read via the PMC article page (PMC1426570; XML download is blocked by the publisher, so
      the cached file holds the abstract). Shows plasmid expression of FoxI induces foxA promoter activity
      and FoxA production, and that a fiuI (PA0472) transposon mutant fails to induce fiuA in response
      to ferrichrome, restored by complementation, while FiuI overexpression raises fiuA promoter activity
      13.5- to 20-fold.
- id: PMID:25809487
  title: Self-cleavage of the Pseudomonas aeruginosa Cell-surface Signaling Anti-sigma Factor FoxR Occurs
    through an N-O Acyl Rearrangement.
  findings:
  - statement: FoxI is the ECF sigma factor that transcribes foxA and is released from the anti-sigma
      factor FoxR on ferrioxamine signalling.
    supporting_text: Upon binding of ferrioxamine by the FoxA receptor, FoxR is processed by a complex
      proteolytic cascade leading to the release and activation of σ(FoxI)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract states the Fox pathway model: FoxI drives foxA transcription and is released from FoxR
      after ferrioxamine signalling. Focus of the paper is FoxR.
- id: PMID:35138377
  title: Transcription regulation of iron carrier transport genes by ECF sigma factors through signaling
    from the cell surface into the cytoplasm.
  findings:
  - statement: FoxR and FiuR are anti-sigma factors of FoxI and FiuI.
    supporting_text: The regulatory proteins FoxR and FiuR act as anti-sigma factors in that they inhibit
      the sigma factors FoxI and FiuI
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Review (full text cached) summarizing CSS regulation, including the FoxI/FoxR and FiuI/FiuR sigma/anti-sigma
      pairs.
- id: PMID:39138320
  title: The role of FoxA, FiuA, and FpvB in iron acquisition via hydroxamate-type siderophores in Pseudomonas
    aeruginosa.
  findings:
  - statement: FoxA and FiuA import ferric hydroxamate siderophores.
    supporting_text: Iron complexed by desferioxamine G is transported by FpvB and FoxA, ferricrocin-Fe
      and ferrichrycin-Fe by FpvB and FiuA
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Shows FoxA and FiuA, the targets of FoxI and FiuI, import iron from hydroxamate siderophores; supports
      reading the sigma factors as positive regulators of iron uptake.
