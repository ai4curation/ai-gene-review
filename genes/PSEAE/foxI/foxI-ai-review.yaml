id: Q9I114
gene_symbol: foxI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FoxI (PA2468) is the extracytoplasmic function (ECF) sigma factor of the Fox cell-surface signalling
  system of Pseudomonas aeruginosa PAO1, which lets the bacterium use the heterologous hydroxamate siderophore
  ferrioxamine B. FoxI has the sigma-70 region 2 and region 4 domains of the FecI-like ECF subfamily.
  It is encoded in the Fur-repressed foxI-foxR operon next to foxA, the ferrioxamine TonB-dependent receptor.
  Without ferrioxamine, FoxI is held inactive by the transmembrane anti-sigma factor FoxR. Binding of
  ferrioxamine to FoxA triggers proteolytic processing of FoxR, which releases FoxI to direct RNA polymerase
  to the foxA promoter. FoxI overexpression strongly induces foxA transcription and FoxA production, which
  in turn mediates ferric-ferrioxamine uptake.
