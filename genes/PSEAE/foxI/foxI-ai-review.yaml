  review:
    summary: >-
      PseudoCAP IMP seed for the PAINT IBD at PTN002455017. The full text (PMC1426570, read for this review)
      shows that constitutive expression of the sigma factor from a plasmid induces transcription from
      the cognate receptor promoter (lacZ fusion) and production of the receptor protein; no foxI mutant
      was tested, so the evidence is overexpression, which GO accepts under IMP.
    action: ACCEPT
    reason: >-
      Seed verdict SOUND. Induction of specific target promoters by the sigma factor, together with an
      intact ECF sigma domain architecture, is the standard evidence for ECF sigma factor activity; it
      is the gene's own molecular function, not a downstream phenotype.
