id: G3XD94
gene_symbol: wbpA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WbpA (PA3159) is the NAD+-dependent UDP-N-acetyl-D-glucosamine
  6-dehydrogenase of Pseudomonas aeruginosa serotype O5. It oxidises UDP-GlcNAc
  to UDP-N-acetyl-D-glucosaminuronic acid, the first of five steps (WbpA, WbpB,
  WbpE, WbpD, WbpI) that make UDP-2,3-diacetamido-2,3-dideoxy-D-mannuronic acid
  for the B-band O antigen of lipopolysaccharide. The purified enzyme needs NH4+
  or K+, shows positive cooperativity for UDP-GlcNAc and is an oligomer in
  solution. wbpA knockouts lack B-band O antigen. It belongs to the
  UDP-glucose/GDP-mannose dehydrogenase family.
references:
- id: PMID:15226302
  title: Biochemical characterization of WbpA, a UDP-N-acetyl-D-glucosamine 6-dehydrogenase
    involved in O-antigen biosynthesis in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: Purified WbpA is a UDP-GlcNAc 6-dehydrogenase that uses NAD+.
    supporting_text: the data revealed that WbpA is a UDP-N-acetyl-D-glucosamine 6-dehydrogenase
      (EC 1.1.1.136), which uses NAD(+) as a coenzyme
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. PseudoCAP source of the GO:0047004 EXP and GO:0000271 IDA
      seed rows. Purified enzyme, product confirmed by NMR, kinetics.
- id: PMID:18621892
  title: Biosynthesis of a rare di-N-acetylated sugar in the lipopolysaccharides of
    both Pseudomonas aeruginosa and Bordetella pertussis occurs via an identical scheme
    despite different gene clusters.
  findings:
  - statement: wbpA knockout lacks B-band O antigen.
    supporting_text: The wbpA knockout of P. aeruginosa PAO1 is devoid of B-band O antigen
      but still produces A-band O antigen in a variety of lengths.
  - statement: The dehydrogenase assays in this paper were on the B. pertussis WbpO
      enzymes, not WbpA.
    supporting_text: Capillary electrophoresis was used to characterize the enzymatic
      activities of purified WbpO(1629) and WbpO(3150)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. PseudoCAP source of the GO:0003954 EXP seed row and the
      GO:0009243 EXP seed row. The paper supports O antigen biosynthesis for
      WbpA by knockout and complementation; it does not assay WbpA activity, and
      it does not support NADH dehydrogenase activity (NADH is the product of
      the WbpO reactions).
- id: PMID:10930727
  title: Pseudomonas aeruginosa B-band lipopolysaccharide genes wbpA and wbpI and their
    Escherichia coli homologues wecC and wecB are not functionally interchangeable.
  findings:
  - statement: wbpA knockout no longer produces B-band LPS.
    supporting_text: resulted in strains that no longer produced B-band lipopolysaccharide
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; genetic evidence for the B-band role.
