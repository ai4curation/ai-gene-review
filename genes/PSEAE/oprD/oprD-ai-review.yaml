id: P32722
gene_symbol: oprD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  OprD (OccD1, protein D2, PA0958) is the archetypal member of the outer membrane carboxylate channel
  (Occ) family of Pseudomonas aeruginosa: an 18-stranded beta-barrel, substrate-specific channel in the
  outer membrane. It has a binding site for basic amino acids and lysine-containing peptides and mediates
  their uptake across the outer membrane; carbapenems such as imipenem and meropenem enter through the
  same channel, which is why loss of OprD is the commonest cause of carbapenem resistance in clinical
  isolates. A serine-protease activity has also been reported for the purified protein.
