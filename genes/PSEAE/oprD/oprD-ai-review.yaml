suggested_questions:
- question: >-
    Is the reported serine-protease activity of OprD intrinsic to the channel or due to a co-purifying
    protease, given that the structures show a classical channel barrel?
suggested_experiments:
- description: >-
    Assay protease activity of OprD purified from a heterologous porin-deficient host, with and without
    mutation of the proposed catalytic residues, alongside channel conductance.
