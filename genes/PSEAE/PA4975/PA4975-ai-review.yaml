  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4975 is a soluble flavodoxin-fold NAD(P)H:quinone oxidoreductase of
  Pseudomonas aeruginosa, the bacterial counterpart of the mammalian NQO1/NQO2
  (DT-diaphorase) family; its sequence is most similar to human NQO2. As one of
  five P. aeruginosa quinone oxidoreductases tested, it reduces quinones in vitro
  by a two-electron route with little semiquinone formation, a property linked to
  antioxidant defence, although its overexpression did not protect against H2O2.
  The gene lies at the end of the arginine-inducible PA4981-PA4975 cluster next to
  the arginine transaminase gene aruH, but no role in arginine catabolism has been
  shown.
