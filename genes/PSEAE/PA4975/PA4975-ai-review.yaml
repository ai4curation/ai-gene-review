suggested_questions:
- question: >-
    PA4975 is closest to human NQO2, which prefers dihydronicotinamide riboside to
    NAD(P)H. Which reduced cofactor does PA4975 use in vivo, and what is its
    physiological quinone or other electron acceptor?
- question: >-
    Does PA4975, co-induced with the arginine transaminase genes, have any role in
    arginine catabolism or oxidative-stress protection in a katA background?
suggested_experiments:
- description: >-
    Steady-state kinetics of purified PA4975 with NADH, NADPH and
    dihydronicotinamide riboside against menadione, benzoquinone and ubiquinone
    analogues, with dicoumarol inhibition, to place it on the NQO1/NQO2 axis.
  experiment_type: enzyme kinetics
