- term:
    id: GO:0031457
    label: glycine betaine catabolic process
  evidence_type: IDA
  original_reference_id: PMID:19919675
  qualifier: involved_in
  review:
    summary: Cbc-mediated glycine betaine import supplies substrate to downstream catabolic enzymes.
    action: MODIFY
    reason: The direct PAO1-construct result is cellular glycine betaine accumulation in E. coli MKH13.
      PA14 growth/complementation links this import to nutritional use, but does not assign chemical breakdown
      to CbcV or CbcW. Retain the supported transport work by a lateral replacement to the existing glycine
      betaine-transport process; this is not a claim that transport is biologically unrelated to catabolism.
      The earlier PA5377 review marked this catabolic claim over-annotated for the same mechanistic reason.
      Here MODIFY retains the directly established transport work while correcting the process; the PseudoCAP
      defect remains explicit.
    supported_by:
    - reference_id: PMID:19919675
      supporting_text: Interestingly, cells of MKH13 transformed with pME6041 expressing cbcXWV from PAO1,
        pCbcPAO1, accumulated choline and betaine but little to no carnitine.
    proposed_replacement_terms:
    - id: GO:0031460
      label: glycine betaine transport
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0031457
      cause: OTHER
      confidence: PROBABLE
      explanation: PA5377 (CbcW, ABC permease) is annotated involved_in GO:0031457 glycine betaine catabolic
        process (IDA, PMID:19919675). The evidence is that cbc transposon mutants cannot grow on betaine
        as sole carbon source, which reflects loss of uptake. The permease does not catalyse any catabolic
        step. Consider removing the row, or keeping only GO:0031460 glycine betaine transport.
