- term:
    id: GO:0015226
    label: carnitine transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000766131
  - UniProtKB:Q9HTI7
  review:
    summary: CbcW and CbcV contribute to CaiX-dependent carnitine transport by the assembled importer.
    action: ACCEPT
    reason: The measured PAO1 CbcWV core transports carnitine when assembled with a compatible CaiX binding
      protein in E. coli MKH13. cbcW performs part of this transport activity; dependence on another complex
      subunit does not make the cargo-specific activity false for this participating subunit. CaiX selects
      the substrate, CbcW provides the membrane pathway, and CbcV supplies ATP coupling. Accept the target
      function and record contributes_to_molecular_function in core_functions, consistently with CaiX.
      The original machine-sourced enables qualifier is preserved. The assay establishes the assembled
      heterologous transporter activity, not autonomous subunit transport or native PAO1 uptake kinetics.
      The target is itself experimentally grounded, so its IBA and IDA agree. The separate PAINT CHECK
      concerns the extent of cargo-specific inheritance across other leaves and their binding-protein
      partners; it does not reject the demonstrated function on Q9HTI7 or treat its appearance among the
      descendant evidence as circular.
    supported_by:
    - reference_id: PMID:19919675
      supporting_text: As expected, MKH13 cells coexpressing cbcWV (on pNcbcWV) and caiX (on a pTOK2T
        derivative) were able to take up carnitine but not choline and betaine, demonstrating that CaiX
        was sufficient for, and specific to, carnitine uptake (Table 5).
    - reference_id: PMID:19919675
      supporting_text: The absence of Cbc-interacting SBPs in MKH13 was confirmed using MKH13 (pNcbcWV)
        (Table 5).
    propagation_review:
      source_entities:
      - source_id: PANTHER:PTN000766131
        source_label: PTN000766131
        source_status: SUPPORTS_TRANSFER
        comment: The target has direct assembled-importer evidence. Scope across other descendant permeases
          and compatible binding-protein partners remains a separate node-placement question.
      - source_id: UniProtKB:Q9HTI7
        source_label: PA5377
        source_status: SUPPORTS_TRANSFER
        comment: The target experimental annotation legitimately seeds the IBD and supports the target
          function; this is expected, not circular.
      root_cause: NO_FAILURE_CORE
    source_defects:
    - defect_type: OTHER
      resource: GO_CENTRAL
      record: PANTHER:PTN000766131
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0015226
      cause: OTHER
      confidence: PROBABLE
      explanation: Please check the cargo-specific scope of the GO:0015226 IBD at PTN000766131 against
        descendant permease and binding-protein evidence. The PAO1 CbcW seed Q9HTI7 has direct CaiX-dependent
        carnitine-uptake evidence and its target claim is accepted. The paper contrasts closely related
        Cbc cores with different binding-protein complements, so cargo specificity cannot be established
        from the core sequence alone. Alternative native cargo or absence of a known partner does not
        by itself demonstrate evolutionary loss or justify pruning a leaf. The family review therefore
        keeps exact node placement UNRESOLVED; this CHECK does not request removal of the experimentally
        supported PAO1 annotation or use seed count as evidence against inheritance.
