  title: Primary assay scope, strain identities and substrate distinctions for the PAO1 carnitine pathway
  findings:
  - statement: The measured sulfur-containing substrate is an organic quaternary ammonium sulfate ester,
      not inorganic sulfate.
    supporting_text: CosX, which is a choline-O-sulfate (COS) SBP (Psyr_0028)
