    supporting_text: the wild type and ΔbetT1 and ΔcbcV mutants all had similar growth kinetics
- id: PMID:29517479
  title: Differential requirements for processing and transport of short-chain versus long-chain O-acylcarnitines
    in Pseudomonas aeruginosa.
  full_text_unavailable: true
  findings:
  - statement: CaiX-CbcWV imports carnitine and short-chain acylcarnitines in P. aeruginosa.
    supporting_text: Short-chain acylcarnitines are imported by the ABC transporter CaiX-CbcWV.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Meadows, Willsey and Wargo 2018). Abstract only in cache. Corroborates
