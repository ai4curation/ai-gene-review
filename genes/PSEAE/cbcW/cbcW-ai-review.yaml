  - statement: The curated record identifies the exact PAO1 locus and supports the transporter component
      architecture; the source is preserved unchanged.
- id: file:analysis/module_audits/bacterial_l_carnitine_catabolism/round1/pseae-consultation/primary-evidence.md
  title: CbcWV round-1 primary assay evidence and controls
  findings:
  - statement: PAO1-core plasmid addition supports conditional COS entry in B728a, with binding-protein
      and empty-vector controls.
    supporting_text: following the introduction of pNCbcWV (vector 2), BTbetX::tet could import l-carnitine,
