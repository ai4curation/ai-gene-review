id: Q9HTI7
gene_symbol: cbcW
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: 'CbcW (PA5377) is the multipass inner-membrane permease of the shared Cbc ABC importer in
  Pseudomonas aeruginosa PAO1. It forms the translocation component with the CbcV ATPase and recruits
  substrate-binding proteins that confer specificity for choline, glycine betaine or carnitine. Heterologous
  combinations with CosX also support choline-O-sulfate uptake. Substrate recognition and transport require
  compatible partners; CbcW does not itself hydrolyze ATP or chemically degrade these nutrients.'
existing_annotations:
- term:
    id: GO:0005275
    label: amine transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000766131
  - UniProtKB:P14176
  - UniProtKB:Q9HTI7
  review:
    summary: The shared Cbc core imports choline and betaines with compatible binding proteins.
    action: MODIFY
    reason: CbcW supplies the membrane translocation component. PAO1 cbcXWV confers radiolabeled
      choline and glycine-betaine accumulation in E. coli MKH13; adding CaiX to cbcWV separately
      confers carnitine uptake. These experiments support quaternary ammonium cargo specificity of
      the assembled importer, not autonomous transport by an isolated subunit. The amine-to-QAC
      replacement corrects the substrate class rather than rejecting transport. PAINT places the
      ancestral claim at PANTHER:PTN000766131. The target is itself experimentally grounded among
      the descendant sources; its presence is not circular. No IRD/IKR loss was found on this
      lineage.
    supported_by:
    - reference_id: PMID:19919675
      supporting_text: Interestingly, cells of MKH13 transformed with pME6041 expressing cbcXWV from
        PAO1, pCbcPAO1, accumulated choline and betaine but little to no carnitine.
    - reference_id: PMID:19919675
      supporting_text: As expected, MKH13 cells coexpressing cbcWV (on pNcbcWV) and caiX (on a
        pTOK2T derivative) were able to take up carnitine but not choline and betaine, demonstrating
        that CaiX was sufficient for, and specific to, carnitine uptake (Table 5).
    proposed_replacement_terms:
    - id: GO:0015418
      label: ABC-type quaternary ammonium compound transporting activity
