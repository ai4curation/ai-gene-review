suggested_questions:
- question: Which endogenous PAO1 binding proteins and conditions make choline-O-sulfate a physiological
    CbcWV substrate, rather than only a demonstrated compatible heterologous cargo?
- question: How broadly does the PTN000766131 carnitine-transport IBD apply when each descendant permease
    is assessed with its compatible binding proteins? The PAO1 target function is supported; exact broader
    cargo scope remains unresolved.
- question: Does PMID:21478341 contain carnitine or glycine betaine uptake data for CbcXWV, or should
    the PseudoCAP carnitine row be re-keyed to PMID:19919675?
suggested_experiments:
- description: Quantify choline-O-sulfate flux with PAO1 CbcWV and CosX in a defined uptake assay, distinguishing
    the established heterologous reporter-entry result from purified transport kinetics and native PAO1
    substrate-binding-partner availability.
