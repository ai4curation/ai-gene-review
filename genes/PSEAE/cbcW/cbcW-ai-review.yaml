  evidence_type: IDA
  original_reference_id: PMID:19919675
  qualifier: involved_in
  review:
    summary: Cbc-mediated glycine betaine import supplies substrate to downstream catabolic enzymes.
    action: MODIFY
    reason: The direct PAO1-construct result is cellular glycine betaine accumulation in E. coli
      MKH13. PA14 growth/complementation links this import to nutritional use, but does not assign
      chemical breakdown to CbcV or CbcW. Retain the supported transport work by a lateral
      replacement to the existing glycine betaine-transport process; this is not a claim that
      transport is biologically unrelated to catabolism.
    supported_by:
    - reference_id: PMID:19919675
      supporting_text: Interestingly, cells of MKH13 transformed with pME6041 expressing cbcXWV from
        PAO1, pCbcPAO1, accumulated choline and betaine but little to no carnitine.
    proposed_replacement_terms:
    - id: GO:0031460
      label: glycine betaine transport
