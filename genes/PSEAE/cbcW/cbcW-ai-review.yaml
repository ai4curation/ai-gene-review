- term:
    id: GO:0015226
    label: carnitine transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000766131
  - UniProtKB:Q9HTI7
  review:
    summary: CaiX enables carnitine uptake through the PAO1 CbcWV core.
    action: ACCEPT
    reason: CbcW supplies the membrane translocation component. In E. coli MKH13, the PAO1 pNcbcWV
      core acquires carnitine uptake when paired with CaiX, whereas CbcX supports choline/betaine
      instead. Table 5 includes the B728a CaiX construct and core-only control; this is an assembled
      heterologous transport assay, not purified subunit activity or fully native PAO1 transport.
      The 2011 citation is supplemented by this direct 2010 core-reconstitution evidence. PAINT
      places the ancestral claim at PANTHER:PTN000766131. The target is itself experimentally
      grounded among the descendant sources; its presence is not circular. No IRD/IKR loss was found
      on this lineage.
    supported_by:
    - reference_id: PMID:19919675
      supporting_text: As expected, MKH13 cells coexpressing cbcWV (on pNcbcWV) and caiX (on a
        pTOK2T derivative) were able to take up carnitine but not choline and betaine, demonstrating
        that CaiX was sufficient for, and specific to, carnitine uptake (Table 5).
    - reference_id: PMID:19919675
      supporting_text: The absence of Cbc-interacting SBPs in MKH13 was confirmed using MKH13
        (pNcbcWV) (Table 5).
