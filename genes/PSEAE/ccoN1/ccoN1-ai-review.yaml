- term:
    id: GO:0004129
    label: cytochrome-c oxidase activity
  evidence_type: IMP
  original_reference_id: PMID:14763990
  qualifier: enables
  review:
    summary: Comolli and Donohue 2004 compared the two cbb3 isoforms; only loss of cbb3-1 affected
      growth in highly aerated cultures. PseudoCAP entered the identical IMP on all eight subunits
      of both operons.
    action: ACCEPT
    reason: 'The term is right and is this gene''s core role, so the row is accepted. The evidence
      is weaker than the row implies: the abstract describes the loss of whole cbb3 isoforms rather
      than a ccoN-specific mutant, and the same IMP was entered on 20190311 for CcoN, CcoO, CcoQ and
      CcoP of both operons, so one operon-level phenotype was transferred to each subunit. No qualifier
      defect is filed here, unlike the sibling ccoP1 and ccoP2 reviews: CcoN carries the copper B
      and high-spin heme centre where oxygen is reduced, so enables is defensible for this chain whatever
      the granularity of the experiment. Full text not read.'
    supported_by:
    - reference_id: PMID:14763990
      supporting_text: In highly aerated cultures, cbb3-1 abundance and expression were greater than
        that of cbb3-2, and only loss of cbb3-1 influenced growth.
