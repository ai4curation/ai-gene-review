  review:
    summary: Inter-ontology inference from the catalytic activity.
    action: ACCEPT
    reason: 'Accepted rather than kept as non-core, which is where this review differs from its ccoP
      siblings. The ccoP reviews reasoned that CcoP has no proton channel of its own; in a heme-copper
      oxidase the proton-conducting channels run through subunit I, which is this chain, so proton
      translocation is part of what it does. The support cited is the family assignment rather than
      the record''s catalytic-activity line: that line gives the four-protons-per-oxygen stoichiometry
      but rests only on an ARBA rule, so it is not evidence. Members of this family are proton-pumping
