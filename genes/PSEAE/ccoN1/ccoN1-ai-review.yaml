  label: Pseudomonas aeruginosa PAO1
description: 'CcoN1 (PA1554) is the subunit I (CcoN/FixN family) of the cbb3-1 cytochrome c oxidase
  of Pseudomonas aeruginosa, one of two cbb3-type terminal oxidases encoded by the PA1552-PA1557 region.
  The 475-residue chain is embedded in the inner membrane by twelve transmembrane helices and carries
  the catalytic machinery of the enzyme: a low-spin heme b and the binuclear centre formed by a high-spin
  heme and copper B, where molecular oxygen is reduced to water. Electrons reach it from periplasmic
  donor cytochromes through the CcoP and CcoO subunits, and the proton-conducting channels of the
  holoenzyme run through this subunit, so oxygen reduction is coupled to proton translocation across
  the membrane. The cbb3 oxidases belong to the C family of the heme-copper superfamily and support
  respiration at low oxygen tension, although in this organism the cbb3-1 isoform is the more abundant
  one in well-aerated cultures.'
