suggested_questions:
- question: The cryo-EM structures of the P. aeruginosa bc1-cbb3 supercomplex (PDB 8SMR, 8SNH) were
    built with the orphan CcoN paralogue PA4133 together with CcoO1 and CcoP1/CcoP2, not with CcoN1
    or CcoN2. Which CcoN isoform occupies the cbb3-1 and cbb3-2 holoenzymes in vivo, and are the CcoN
    subunits interchangeable between the two operons?
suggested_experiments:
- description: Assay oxygen reduction and proton translocation in membranes from single ccoN1 and
    ccoN2 deletions, rather than whole-operon deletions, to separate the contribution of each subunit
    I from that of the shared CcoO/CcoP chains.
  experiment_type: subunit-resolved enzyme assay
