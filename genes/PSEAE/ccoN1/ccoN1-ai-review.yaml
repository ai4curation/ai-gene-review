- term:
    id: GO:0005507
    label: copper ion binding
  evidence_type: IC
  original_reference_id: file:PSEAE/ccoN1/ccoN1-uniprot.txt
  qualifier: enables
  review:
    summary: Copper B is curated on this record as a cofactor, and the chain matches the COX1_CUB
      copper-B binding signature, but no copper-binding annotation exists.
    action: NEW
    reason: 'Two independent lines on the record agree and neither is an unvetted prediction: the
      PIRSR cofactor rule gives one copper ion per subunit, denoted copper B, and PROSITE PS00077
      COX1_CUB matches the copper-B binding site. Copper B is half of the binuclear centre, so copper
      binding is a defining molecular function of this subunit rather than an incidental one, and
      GO:0020037 heme binding is annotated while its copper counterpart is not. Proposed as IC, an
      inference drawn here from the curated cofactor and site records rather than from a publication;
      the same gap applies to ccoN2.'
    supported_by:
    - *id001
    - *id006
