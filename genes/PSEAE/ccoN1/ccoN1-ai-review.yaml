    summary: Combined automated annotation (InterPro, NCBIfam, PROSITE, UniRule) for a cbb3-type subunit
      I.
    action: ACCEPT
    reason: 'Correct and core, and this is the one subunit of the complex for which the enables qualifier
      is right. CcoN is the subunit I homologue that carries the catalytic binuclear centre: the curated
      PIRSR cofactor notes give one copper ion per subunit (copper B) and two hemes (high- and low-spin),
      the record matches PROSITE PS00077 COX1_CUB, and NCBIfam TIGR00780 types it as CcoN. Oxygen
      is reduced here, so the activity resides in this chain, unlike the CcoO, CcoP and CcoQ subunits,
