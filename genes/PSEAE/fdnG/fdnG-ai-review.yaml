- term:
    id: GO:0036397
    label: formate dehydrogenase (quinone) activity
  evidence_type: IDA
  original_reference_id: PMID:3038081
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA, the PTN000745948 seed row. Formate dehydrogenase was purified from
      nitrate-grown anaerobic P. aeruginosa membranes and assayed with a tetrazolium dye; the
      preparation contained Mo, [4Fe-4S] and a bis-histidine cytochrome b.
    action: ACCEPT
    reason: >-
      Seed verdict SOUND. The activity measured is that of the purified FDH complex, of which FdnG
      is the catalytic subunit. The assay used an artificial acceptor, but the abstract places the
      enzyme in a membrane respiratory chain with nitrate reductase, which takes electrons from
      quinol, so the quinone-linked term is the right reading. The 1987 paper does not name genes;
      attribution to PA4812 rests on fdnGHI being the only FDH-N-type cluster in PAO1 and the
      matching cofactor set (I could read only the abstract). This is a biochemical assay of a
      purified complex, not an operon-level mutant phenotype.
    supported_by:
    - reference_id: PMID:3038081
      supporting_text: >-
        The separation of the FDH enzyme from nitrate reductase (NiR), which are found together
        in a particle fraction and constitute the short respiratory chain of this bacterium
    - reference_id: PMID:3038081
      supporting_text: >-
        In its purest state FDH contains one molecule of cytochrome co-ordinated by two histidine
        ligands in the oxidized state.
