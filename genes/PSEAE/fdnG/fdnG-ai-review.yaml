  review:
    summary: InterPro2GO NAD+-dependent formate dehydrogenase activity from the FdnG alpha-subunit signature.
    action: REMOVE
    reason: >-
      FdnG is the Mo-bisMGD catalytic subunit of a membrane-bound, Tat-exported respiratory formate
      dehydrogenase that donates electrons to the quinone pool via FdnH and FdnI, not to NAD+. The
      purified P. aeruginosa enzyme sits in a membrane particle with nitrate reductase as a short
      respiratory chain. The NAD+ term describes a different, cytoplasmic class of formate
      dehydrogenase, so the IPR006443 mapping to it is wrong for this family.
