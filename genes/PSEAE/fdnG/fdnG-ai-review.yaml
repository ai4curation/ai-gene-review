id: Q14T72
gene_symbol: fdnG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FdnG (PA4812) is the large catalytic (alpha) subunit of the membrane-bound, nitrate-inducible
  respiratory formate dehydrogenase of Pseudomonas aeruginosa, encoded in the fdnGHI cluster with
  the iron-sulfur subunit FdnH (PA4811) and the cytochrome b subunit FdnI (PA4810). It belongs to
  the prokaryotic molybdopterin-containing oxidoreductase family, carries an N-terminal
  [4Fe-4S]-binding domain and a molybdenum bis(molybdopterin guanine dinucleotide) cofactor domain,
  and has a twin-arginine (Tat) signal peptide, so it is exported to the periplasmic face of the
  cytoplasmic membrane. There it oxidises formate to CO2 and passes the electrons through FdnH and
  FdnI to the quinone pool. The enzyme is made during anaerobic growth on nitrate, when it and
  nitrate reductase form a short formate-to-nitrate respiratory chain.
