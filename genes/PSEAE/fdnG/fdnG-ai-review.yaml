suggested_questions:
- question: >-
    Is the P. aeruginosa FdnGHI complex the only formate-oxidising enzyme feeding the anaerobic
    nitrate respiratory chain, and does the enzyme reduce ubiquinone, menaquinone or both in vivo?
suggested_experiments:
- description: >-
    Assay formate:quinone oxidoreductase activity (with a ubiquinone analogue) in membranes of a
    PAO1 fdnG deletion mutant and its complemented strain grown anaerobically on nitrate.
