- term:
    id: GO:0047111
    label: formate dehydrogenase (cytochrome-c-553) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006443
  review:
    summary: InterPro2GO formate dehydrogenase (cytochrome-c-553) activity.
    action: REMOVE
    reason: >-
      The FdnGHI enzyme passes electrons from formate through FdnH to the cytochrome b of FdnI and on
      to quinone; there is no cytochrome c subunit or cytochrome c acceptor in this complex. The
      purified P. aeruginosa FDH lost contaminating cytochrome c as it was purified, and its purest
      form contains only a bis-histidine cytochrome. The mapping of IPR006443 to the cytochrome
      c-553 enzyme (a different, Desulfovibrio-type FDH) is wrong for this family.
    supported_by:
    - reference_id: PMID:3038081
      supporting_text: >-
        The preparations vary in the amount of contaminating nitrate reductase, the amount of
        cytochrome c present and the concentration of oxidized [3Fe-4S] cluster.
    - reference_id: PMID:3038081
      supporting_text: >-
        In its purest state FDH contains one molecule of cytochrome co-ordinated by two histidine
        ligands in the oxidized state.
