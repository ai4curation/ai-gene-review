  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:11790124
  title: Characterization of soluble and membrane-bound family 3 lytic transglycosylases from Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      Purified SltB (SltB1, PA4001) and soluble MltB both release anhydromuropeptides from insoluble
      peptidoglycan.
    supporting_text: Both enzymes produced the same three major soluble products which were identified as
      anhydromuropeptides based on ESI-MS analysis
  - statement: SltB is the non-lipidated, soluble enzyme of the pair.
    supporting_text: The second, nonlabeled enzyme was overexpressed in soluble form and hence was named
      soluble lytic transglycosylase B (SltB).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only (no PMC full text). PseudoCAP IDA source for GO:0008933 and seed of PTN002410022. The
      abstract itself states that the purified enzymes cleave insoluble peptidoglycan to
      1,6-anhydromuropeptides, which is the definition of the term. The soluble (non-palmitoylated) enzyme
      corresponds to PA4001 (SignalP signal peptide, no lipobox); the paper's later naming (SltB1) is
      confirmed in PMID:18708507.
- id: PMID:18708507
  title: Interaction of penicillin-binding protein 2 with soluble lytic transglycosylase B1 in Pseudomonas
    aeruginosa.
  findings:
  - statement: SltB1 binds PBP2 by affinity chromatography and SPR, via the N-terminal non-PB module of PBP2.
    supporting_text: Penicillin-binding protein 2 (PBP2) was identified as a binding partner
  - statement: MltB is the lipoprotein; SltB1, SltB2 and SltB3 are soluble paralogs.
    supporting_text: One, MltB, is a lipoprotein, whereas three other homologues are produced in soluble form
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read. Source of the IPI protein binding row (with PBP2, G3XCV7). Shows a direct
      interaction, not an activity of SltB1.
