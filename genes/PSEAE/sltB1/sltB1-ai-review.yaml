id: Q9HX24
gene_symbol: sltB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  sltB1 (PA4001) encodes soluble lytic transglycosylase B1 (SltB1), a periplasmic family 3 (GH103,
  MltB-like) lytic transglycosylase of Pseudomonas aeruginosa. The 340-residue precursor carries a
  cleavable signal peptide but no lipobox, so the mature enzyme is soluble. Lytic transglycosylases cleave
  the beta-1,4 bond between N-acetylmuramic acid and N-acetylglucosamine in peptidoglycan glycan strands
  and form 1,6-anhydromuramyl ends; purified SltB1 releases anhydromuropeptides from insoluble
  peptidoglycan and is more catalytically efficient than the paralogous lipoprotein MltB1. The crystal
  structure shows a calcium-binding helix-loop-helix (EF-hand-like) motif. SltB1 binds the N-terminal
  non-penicillin-binding module of PBP2, and sltB1 is clustered with peptidoglycan synthesis genes,
  suggesting that it acts with the cell elongation machinery in cell wall growth and turnover.
