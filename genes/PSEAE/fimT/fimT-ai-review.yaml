- id: PMID:18174131
  title: Functional role of conserved residues in the characteristic secretion NTPase
    motifs of the Pseudomonas aeruginosa type IV pilus motor proteins PilB, PilT and
    PilU.
  findings:
  - statement: >-
      Purified PilB, PilT and PilU have ATPase activity; NTPase motif residues
      are needed for twitching. FimT is not mentioned in the abstract.
    supporting_text: >-
      Assay of purified 6xHis-tagged PilB, PilT and PilU from P. aeruginosa
      showed that all three proteins have ATPase activities in vitro.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified as Chiang et al. 2008, Microbiology 154:114-126, the
      correct paper for the pilB/pilT/pilU rows. For fimT, the abstract
      concerns only the three NTPases; no PMC copy exists and the publisher
      page was not accessible, so I could not check whether the full text
      mentions FimT. The PseudoCAP fimT row citing it carries a confirmed
      wrong GO id and probably the wrong gene product (source defects on the
      annotation).
- id: PMID:8682785
  title: Identification of two genes with prepilin-like leader sequences involved
    in type 4 fimbrial biogenesis in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      fimT and fimU encode prepilin-like proteins; the fimT mutant is wild
      type, but FimT overexpression replaces FimU in fimbrial biogenesis.
    supporting_text: >-
      overexpression of the fimT gene was found to be able to functionally
      replace the lack of a fimU gene product, suggesting a subtle role in
      fimbrial biogenesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Alm and Mattick 1996, J Bacteriol 178:3809-17,
      PMC232641); abstract only here, as the PMC full text could not be
      retrieved.
- id: PMID:35246533
  title: The molecular basis of FimT-mediated DNA uptake during bacterial natural
    transformation.
  findings:
  - statement: >-
      Purified P. aeruginosa FimT binds dsDNA in vitro (EMSA), whereas
      P. aeruginosa FimU does not; the FimTPa D-region grafted onto
      Legionella FimT restores transformation in a Legionella fimT mutant.
    supporting_text: >-
      Interestingly, FimT from both species binds to DNA and the affinity
      appears to be within the same order of magnitude as L. pneumophila
      FimT.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Braus et al. 2022, Nat Commun, PMC8897410); full text cached.
- id: PMID:20338182
  title: Pseudomonas aeruginosa minor pilins are incorporated into type IV pili.
  findings:
  - statement: >-
      The five P. aeruginosa minor pilins studied are FimU, PilV, PilW, PilX
      and PilE; FimT is not among them, so FimT incorporation into pili has
      not been tested in P. aeruginosa.
    supporting_text: >-
      including five conserved pilin-like proteins of unknown function (FimU,
      PilV, PilW, PilX, and PilE in Pseudomonas aeruginosa)
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (Giltner, Habash and Burrows 2010, J Mol Biol 398:444-61); abstract only. Context for the minor pilin system.
core_functions:
- description: >-
    Minor pilin-like protein of the type IVa pilus system. FimT is a
    GspH-family prepilin anchored in the inner membrane that can substitute
    for its paralogue FimU in promoting type IV pilus assembly when
    overexpressed, though it is dispensable in wild-type cells.
  directly_involved_in:
  - id: GO:0043683
    label: type IV pilus assembly
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8682785
    supporting_text: >-
      overexpression of the fimT gene was found to be able to functionally
      replace the lack of a fimU gene product, suggesting a subtle role in
      fimbrial biogenesis
  - reference_id: PMID:35246533
    supporting_text: >-
      FimT and FimU are minor type IV pilins that belong to the GspH/FimT
      family of proteins
- description: >-
    Non-catalytic DNA-binding minor pilin. Purified P. aeruginosa FimT binds
    double-stranded DNA in vitro, as the FimT of naturally transformable
    Legionella does in its DNA-uptake pilus; the in vivo role in
    P. aeruginosa is unknown.
  molecular_function:
    id: GO:0003690
    label: double-stranded DNA binding
  supported_by:
  - reference_id: PMID:35246533
    supporting_text: >-
      Interestingly, FimT from both species binds to DNA and the affinity
      appears to be within the same order of magnitude as L. pneumophila
      FimT.
suggested_questions:
- question: >-
    Does FimT DNA binding have any role in P. aeruginosa, for example in
    binding extracellular DNA in biofilms, given that PAO1 is not known to be
    naturally transformable?
- question: >-
    Is FimT incorporated into P. aeruginosa type IV pili in wild-type cells,
    or only when overexpressed, and does it occupy the FimU position in the
    priming complex?
suggested_experiments:
- description: >-
    Detect FimT in sheared pili of wild-type, fimU and FimT-overexpressing
    P. aeruginosa with specific antibodies, as was done for the other minor
    pilins, and test whether surface pili of a FimT-overexpressing strain
    bind labelled DNA.
