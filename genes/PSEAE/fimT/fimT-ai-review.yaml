    action: ACCEPT
    reason: >-
      The ARBA location is not evidence on its own, but FimT carries the
      N-methylation (class III prepilin) motif and N-terminal hydrophobic
      helix of type IV prepilins, which reside in the inner membrane before
      PilD processing and assembly, and it belongs to the GspH/FimT minor
      pilin family whose members are inner-membrane targeted. Inner membrane
      is where a prepilin resides and is assembled from.
