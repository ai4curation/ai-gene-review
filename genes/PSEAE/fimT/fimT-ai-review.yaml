- term:
    id: GO:0043683
    label: type IV pilus assembly
  evidence_type: IDA
  original_reference_id: PMID:8682785
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA from Alm and Mattick 1996: the fimT mutant is wild type,
      but FimT overexpression replaces FimU in fimbrial biogenesis.
    action: ACCEPT
    reason: >-
      FimT is a prepilin-like minor pilin of the GspH/FimT family whose
      paralogue FimU promotes type IV pilus assembly, and overexpressed FimT
      can take over FimU's role, so FimT can itself do the minor-pilin work
      of priming assembly. Its contribution in wild-type cells is subtle
      (the single mutant has no phenotype), which the paper says. The
      evidence described in the abstract is genetic (mutant and
      overexpression suppression), which fits IGI or IMP better than IDA; I
      cannot read the full text, so this is noted rather than filed as a
      defect.
    supported_by:
    - reference_id: PMID:8682785
      supporting_text: >-
        overexpression of the fimT gene was found to be able to functionally
        replace the lack of a fimU gene product, suggesting a subtle role in
        fimbrial biogenesis
    - reference_id: PMID:8682785
      supporting_text: >-
        whereas the fimT and dada* mutants retained wild-type phenotypes
- term:
    id: GO:0003690
    label: double-stranded DNA binding
  evidence_type: IDA
  original_reference_id: PMID:35246533
  qualifier: enables
  review:
    summary: >-
      Purified P. aeruginosa FimT binds a 30 bp dsDNA in EMSA, with an
      affinity of the same order as Legionella FimT; P. aeruginosa FimU does
      not bind.
    action: NEW
    reason: >-
      Direct in vitro binding assay on the purified P. aeruginosa protein,
      with FimU as an internal negative comparator. The term is as specific
      as the assay supports (30 bp dsDNA; ssDNA was tested only for the
      Legionella protein, and binding there is non-sequence-specific). The
      physiological significance in P. aeruginosa, which is not known to be
      naturally transformable, is unknown, so no process term is proposed.
    supported_by:
    - reference_id: PMID:35246533
      supporting_text: >-
        We expressed and purified FimT and FimU from the human pathogen P.
        aeruginosa and the plant pathogen Xanthomonas campestris (both
        γ-Proteobacteria) and performed EMSAs to assess DNA binding in vitro
    - reference_id: PMID:35246533
      supporting_text: >-
        Interestingly, FimT from both species binds to DNA and the affinity
        appears to be within the same order of magnitude as L. pneumophila
        FimT.
    - reference_id: PMID:35246533
      supporting_text: >-
        A 30 bp dsDNA fragment (1 μM) was incubated with increasing
        concentrations of purified pilins (0–100 μM)
