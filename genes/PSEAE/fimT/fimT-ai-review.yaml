- term:
    id: GO:0016888
    label: DNA endonuclease activity, producing 5'-phosphomonoesters
  evidence_type: IDA
  original_reference_id: PMID:18174131
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA (2019-03-11) citing Chiang et al. 2008, an ATPase study of
      purified PilB, PilT and PilU. The term is the same off-by-one id slip
      found on the pilU row from that paper, and the paper's abstract
      concerns only the three NTPases, not FimT.
    action: REMOVE
    reason: >-
      The claim is wrong whatever the full text contains. A live QuickGO
      query (2026-11-03) shows four PseudoCAP rows citing PMID:18174131, all
      dated 2019-03-11: pilB (P22608) and pilT (P24559) to GO:0016887 ATP
      hydrolysis activity, and pilU (G3XCX3) and fimT (Q9HVN0) to the
      adjacent id GO:0016888. The pilU review established that GO:0016888 was
      keyed for GO:0016887. FimT is a GspH-family minor pilin with no
      nuclease domain, and no study reports nuclease activity for any FimT.
      Repointing to GO:0016887 would also be wrong: the abstract names PilB,
      PilT and PilU as the purified and mutated motor proteins, and FimT is
      not an NTPase. The fimT row is most likely a copy of the pilU row
      attached to the wrong gene product, so it should be deleted rather than
      corrected. This is a demonstrable keying error, not a second-guessed
      experiment; the full text was not available (abstract only), which is
      why the gene-product half of the defect is PROBABLE.
    supported_by:
    - reference_id: PMID:18174131
      supporting_text: >-
        Assay of purified 6xHis-tagged PilB, PilT and PilU from P. aeruginosa
        showed that all three proteins have ATPase activities in vitro.
    - reference_id: file:PSEAE/fimT/fimT-uniprot.txt
