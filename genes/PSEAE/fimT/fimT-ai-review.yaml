taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FimT (PA4549) is a 169-residue minor pilin-like protein of the type IVa
  pilus system of Pseudomonas aeruginosa, encoded next to its paralogue fimU
  between pilR and the pilV minor pilin genes. It has a class III
  prepilin-like N-terminal leader and hydrophobic helix (N-methylation motif)
  followed by a GspH-type globular domain, the fold shared by FimU and the
  type II secretion pseudopilin GspH. A fimT mutant has normal pili,
  twitching and phage sensitivity, but overexpressed FimT can replace FimU in
  pilus biogenesis, so FimT has a subtle, partly redundant role in type IV
  pilus assembly. Purified P. aeruginosa FimT binds double-stranded DNA in
  vitro, like the FimT of naturally transformable Legionella pneumophila,
  where FimT is the DNA-binding minor pilin of the DNA-uptake pilus; whether
  DNA binding matters for P. aeruginosa FimT in vivo is unknown.
