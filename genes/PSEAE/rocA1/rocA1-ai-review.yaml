taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  RocA1 (PA3948) is a NarL/FixJ-family two-component response regulator of Pseudomonas
  aeruginosa, with an N-terminal receiver domain and a C-terminal LuxR-type
  helix-turn-helix DNA-binding domain. It is the output regulator of the RocS1-RocR-RocA1
  (SadARS) system: the hybrid sensor kinase RocS1 activates RocA1 by phosphorelay, and the
  EAL-domain protein RocR antagonises it. RocA1 activates transcription of the cupB and
  cupC chaperone-usher fimbrial gene clusters that contribute to biofilm formation.
