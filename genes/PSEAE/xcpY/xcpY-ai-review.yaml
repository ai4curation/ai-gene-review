id: P25060
gene_symbol: xcpY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: XcpY (PA3096) is the GspL-family inner-membrane platform protein of the Xcp type II
  secretion system of Pseudomonas aeruginosa, the machine that exports folded enzymes from the
  periplasm across the outer membrane. It is a bitopic protein with a large cytoplasmic N-terminal
  domain, one transmembrane helix and a periplasmic C-terminal region containing a ferredoxin-like
  domain that dimerises. XcpY and XcpZ (GspM) stabilise each other and form the most stable
  isolable unit of the machine, which in turn recruits the secretion ATPase XcpR and the polytopic
  platform protein XcpS, so XcpY links ATP hydrolysis in the cytoplasm to pseudopilus assembly;
  its periplasmic domain also binds secretion substrates.
