- term:
    id: GO:0015628
    label: protein secretion by the type II secretion system
  evidence_type: IDA
  original_reference_id: PMID:9818381
  qualifier: involved_in
  review:
    summary: PseudoCAP IDA citing Filloux, Michel and Bally 1998, a review of the Xcp system.
    action: ACCEPT
    reason: >-
      The term is correct. XcpY is required for a functional secreton, it stabilises XcpZ and
      is stabilised by it (PMID:9884230), it stabilises XcpS together with XcpR (PMID:17464073), and
      its periplasmic domain binds a secretion substrate (PMID:30337370). A review cannot support
      IDA, so the evidence should be TAS, or the row re-keyed to a primary paper. Recorded
      consistently with the same defect on XcpS, XcpT, XcpU, XcpV and XcpW.
    supported_by:
    - reference_id: PMID:9884230
      supporting_text: These results strongly suggest that XcpZ and XcpY interact within the
        functional secretory apparatus
    - reference_id: PMID:17464073
      supporting_text: XcpS was shown to be stabilized by co-expression of the XcpR (GspE) and
        XcpY (GspL) components of the machinery, demonstrating an interaction between these three
        proteins
    source_defects:
