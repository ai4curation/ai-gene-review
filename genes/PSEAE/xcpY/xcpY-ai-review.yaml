- term:
    id: GO:0009276
    label: Gram-negative-bacterium-type cell wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR007812
  review:
    summary: InterPro2GO mapping from the GspL family entry IPR007812 to the Gram-negative cell
      wall.
    action: REMOVE
    reason: >-
      GO:0009276 is a peptidoglycan-based cell wall term (is_a GO:0009274), not a general envelope
      term. XcpY is a bitopic inner-membrane protein whose topology was mapped experimentally
      (cytoplasmic 1-233, one transmembrane helix, periplasmic 255-382); no part of it is in the
      peptidoglycan layer. The mapping is wrong for the whole GspL family, not just for XcpY, since
      GspL proteins are inner-membrane platform subunits throughout. Plasma membrane is annotated
      separately and correctly.
    supported_by:
    - reference_id: file:PSEAE/xcpY/xcpY-uniprot.txt
      record_section: ["FT:TOPO_DOM"]
      supporting_text: |-
        TOPO_DOM        255..382
        FT                   /note="Periplasmic"
        FT                   /evidence="ECO:0000269|PubMed:8763961"
    - reference_id: PMID:8763961
      supporting_text: most Xcp proteins are found in the cytoplasmic membrane
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR007812
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0009276
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The InterPro2GO mapping of IPR007812 (T2SS protein GspL) includes GO:0009276
        Gram-negative-bacterium-type cell wall. That term is a subclass of GO:0009274
        peptidoglycan-based cell wall, so it asserts location in the peptidoglycan layer. GspL
        proteins are bitopic inner-membrane subunits of the type II secretion assembly platform: for
        P. aeruginosa XcpY (P25060) the topology was mapped experimentally (PubMed:8763961) as
        cytoplasmic 1-233, transmembrane 234-254 and periplasmic 255-382, and the family is
        described throughout as an inner-membrane component. Please remove GO:0009276 from the
        IPR007812 mapping; GO:0005886 plasma membrane and GO:0015627 type II protein secretion
        system complex already cover the location correctly.
      supported_by:
