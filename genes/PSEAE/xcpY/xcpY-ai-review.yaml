suggested_questions:
- question: Should the InterPro2GO mapping of IPR007812 to GO:0009276 be removed consortium-wide,
    given that GspL proteins are inner-membrane platform subunits?
- question: Does substrate binding by the XcpY periplasmic domain (PMID:30337370) warrant a specific
    protein-binding or substrate-recognition annotation beyond the complex and process terms?
