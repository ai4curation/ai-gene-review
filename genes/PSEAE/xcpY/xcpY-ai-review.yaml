- description: GspL-family subunit of the Xcp type II secretion assembly platform; it pairs with
    XcpZ in the inner membrane, recruits the secretion ATPase XcpR and the platform protein XcpS,
    and presents a periplasmic domain that engages secretion substrates, coupling cytoplasmic ATP
    hydrolysis to pseudopilus assembly.
  supported_by:
