id: P72151
gene_symbol: fliC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FliC is the b-type flagellin of Pseudomonas aeruginosa PAO1, the subunit that polymerises to form the
  filament of the single polar flagellum. Flagellin is exported through the flagellar type III export
  apparatus, travels through the hollow filament and is assembled at the distal tip beneath the FliD
  cap. The filament acts as the propeller of flagellum-dependent swimming motility, and loss of fliC
  abolishes motility. Flagellin is also a major surface antigen and a ligand recognised by host innate
  immunity, and fliC mutants are attenuated in mouse models of acute lung infection. P. aeruginosa
  strains carry either an a-type (as in strain PAK) or a b-type (as in PAO1) flagellin.
