  findings:
  - statement: >-
      fliC disruption mutants of strain PAK were constructed by gene replacement and identified as
      nonmotile.
    supporting_text: >-
      Nonmotile mutants of PAK were analyzed to confirm that the expected gene replacement events, in
      which the interrupted copy of fliC , the gene encoding flagellin protein, introduced into PAK and
      PAK/NP had replaced the wild-type coding sequence, had occurred.
  - statement: The fliC mutants were made in strain PAK, not PAO1.
    supporting_text: Fla − mutants of PAK and PAK/NP were isolated by gene replacement.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Feldman et al. 1998, Infect Immun; PMC107856); full text read in the cache.
      The paper is about virulence in neonatal mouse pneumonia, epithelial adherence and ganglioside
      binding of flagellin. Motility enters only as the phenotype used to identify fliC disruption
      mutants, which were made in strain PAK (a-type flagellin), not PAO1. Source of the PseudoCAP IDA
      GO:0071973 row that seeds PTN001250065; the term is right but the evidence is a mutant phenotype
      (IMP) of the PAK allele.
