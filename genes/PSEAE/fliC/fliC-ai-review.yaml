- term:
    id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  evidence_type: IDA
  original_reference_id: PMID:9423837
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row and a seed of PTN001250065. The paper shows that fliC disruption mutants of strain
      PAK are nonmotile; it reports no direct assay of flagellin in motility.
    action: ACCEPT
    reason: >-
      The process is right for flagellin. The evidence is a mutant phenotype (IMP, not IDA), obtained on
      the a-type fliC of strain PAK rather than the PAO1 b-type allele annotated here; both are
      orthologous flagellin genes of the same species, so the claim transfers, and the defect is the
      evidence code.
    supported_by:
    - reference_id: PMID:9423837
      supporting_text: >-
        Nonmotile mutants of PAK were analyzed to confirm that the expected gene replacement events, in
        which the interrupted copy of fliC , the gene encoding flagellin protein, introduced into PAK and
        PAK/NP had replaced the wild-type coding sequence, had occurred.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: REPOINT
      asserted_value: ECO:0000314
      corrected_value: ECO:0000315
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Full text of PMID:9423837 read. The only motility data are that fliC disruption mutants of
        strain PAK (and PAK/NP) were identified as nonmotile; no direct assay of flagellin in motility
        is reported, so the evidence is IMP. The mutants were made in PAK, which carries the a-type
        flagellin, not in PAO1 (b-type, P72151); PAO1 appears only in adherence assays. The GO term is
        correct for flagellin; consider also noting the strain, or using ISS from the PAK flagellin.
      supported_by:
      - reference_id: PMID:9423837
        supporting_text: Fla − mutants of PAK and PAK/NP were isolated by gene replacement.
