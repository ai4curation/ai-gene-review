    action: ACCEPT
    reason: >-
      PpkA has an intact Hanks kinase domain (active site D129) and phosphorylates threonines on itself
      and on Fha1. The node is seeded mainly by experimentally characterised bacterial Ser/Thr kinases,
      so the transfer is sound. PpkA appearing among the sources reflects its own (PseudoCAP) annotation.
    supported_by:
