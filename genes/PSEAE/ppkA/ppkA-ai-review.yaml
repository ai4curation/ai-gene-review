- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:9852028
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA, one of 17 seeds of the PTN001981567 IBD. The cited abstract shows only that overexpressed
      PpkA is toxic and that a catalytic-site substitution abolishes toxicity.
    action: ACCEPT
    reason: >-
      The term is correct. PpkA autophosphorylates on Thr158/Thr161 and phosphorylates Fha1 Thr362, a
      reaction its kinase domain catalyses in vitro (PMID:19400797, citing Mougous et al. 2007). The cited
      paper is only abstract-available. Its abstract infers kinase function from an in vivo catalytic-site
      mutant ("suggesting that the kinase domain of PpkA is functional"), which reads as genetic rather
      than direct-assay evidence. The evidence code is questioned in a SUSPECTED defect; the annotation
      is kept.
    supported_by:
    - reference_id: PMID:9852028
      supporting_text: >-
        However, a single amino acid change at the catalytic site of the kinase domain eliminated the
        toxic effect of PpkA on bacterial cells, suggesting that the kinase domain of PpkA is functional
        within bacterial cells.
    - reference_id: PMID:19400797
      supporting_text: >-
        Our prior work has shown that PpkA-catalyzed phosphorylation of Fha1 at T362 is essential for
        Hcp1 secretion. This reaction is efficiently catalyzed in vitro by the kinase domain of PpkA (Mougous
        et al., 2007).
    source_defects:
