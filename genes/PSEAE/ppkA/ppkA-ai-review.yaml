- id: PMID:19400797
  title: >-
    TagR promotes PpkA-catalysed type VI secretion activation in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PpkA autophosphorylation (Thr158/Thr161) and dimerisation of its extracellular domains activate
      the H1-T6SS through phosphorylation of Fha1; TagR acts upstream.
    supporting_text: >-
      We identified critical PpkA autophosphorylation sites and showed that small molecule-induced dimerization
      of the extracellular domains of PpkA is sufficient to activate the T6SS.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (cached).
- id: PMID:9852028
  title: >-
    A novel serine/threonine protein kinase homologue of Pseudomonas aeruginosa is specifically inducible
    within the host infection site and is required for full virulence in neutropenic mice.
  findings:
  - statement: >-
      ppkA is induced during infection and needed for full virulence in neutropenic mice; overexpression
      toxicity depends on an intact catalytic site.
    supporting_text: >-
      A ppkA null mutant strain shows reduced virulence in neutropenic mice compared to the wild type.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Abstract only (PMC107787 returned no body text). PseudoCAP source for the GO:0004674 IDA that seeds
      PTN001981567. The abstract reports in vivo catalytic-site mutant evidence rather than a kinase assay;
      whether the full text contains one could not be checked.
  full_text_unavailable: true
