  review:
    summary: >-
      PpkA activates H1-T6SS secretion of Hcp1. It autophosphorylates and phosphorylates Fha1, which triggers
      the system.
    action: ACCEPT
    reason: >-
      Full text read. PpkA is a direct post-translational activator of the secretion apparatus (kinase
      on Fha1), with dimerisation-induced activation shown. GO has no "positive regulation of protein
      secretion by the type VI secretion system" term, so this is the most precise available term. PpkA's
      additional structural role in the apparatus is noted in the description.
    supported_by:
    - reference_id: PMID:19400797
      supporting_text: >-
        Previously, we showed that Pseudomonas aeruginosa T6S is posttranslationally activated upon phosphorylation
        of Fha1, an FHA domain protein, by PpkA, a membrane-spanning threonine kinase.
    - reference_id: PMID:19400797
      supporting_text: >-
        We found that only the cytoplasmic domains of PpkA are essential for Fha1 phosphorylation and
        Hcp1 secretion.
