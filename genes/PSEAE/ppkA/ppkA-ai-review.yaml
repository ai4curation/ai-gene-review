taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ppkA (PA0074) encodes PpkA, a Hanks-type serine/threonine protein kinase with a type II inner-membrane
  topology. It has an N-terminal cytoplasmic kinase domain, a single transmembrane segment, and a periplasmic
  region containing a von Willebrand factor A domain. PpkA is encoded in the Hcp secretion island I (HSI-I)
  and post-translationally activates the H1 type VI secretion system (H1-T6SS). On a signal that is still
  unknown, its periplasmic domains dimerise and it autophosphorylates on Thr158 and Thr161 of the activation
  loop; it then phosphorylates the FHA-domain scaffold protein Fha1 on Thr362. Phosphorylated Fha1 recruits
  the Fha1-ClpV1 complex to the T6SS apparatus and triggers Hcp1 secretion. The PP2C phosphatase PppA
  (PA0075) reverses the phosphorylation, and the periplasmic protein TagR acts upstream to promote PpkA
  activity. PpkA also has a structural role in T6SS assembly. It is induced during infection and is required
  for full virulence in neutropenic mice.
