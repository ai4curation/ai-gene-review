      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        The GO:0004674 row on PA0074 (ppkA) is coded IDA from PMID:9852028. The abstract describes overexpression
        toxicity in E. coli and P. aeruginosa that a catalytic-site substitution abolishes, and concludes
        only that the kinase domain is "functional". That is a mutant phenotype (IMP-type), not a direct
        kinase assay. The term is right: direct in vitro evidence exists in Mougous et al. 2007 (PMID:17558395)
        and Hsu et al. 2009 (PMID:19400797). Requested change: check whether the full text contains a
        kinase assay; if not, recode as IMP or cite the later papers. The row is one of 17 seeds of PTN001981567,
        which stands without it. SUSPECTED because the full text was not available.
      supported_by:
