core_functions:
- description: >-
    Membrane-spanning Hanks-type threonine kinase that, when its periplasmic domains dimerise, autophosphorylates
    and phosphorylates Fha1 Thr362 to switch on the H1 type VI secretion system; antagonised by the phosphatase
    PppA.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0050714
    label: positive regulation of protein secretion
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19400797
    supporting_text: >-
      We present a model whereby an unknown cue causes dimerization of the extracellular domains of PpkA,
      leading to its autophosphorylation, recruitment of the Fha1-ClpV1 complex, phosphorylation of Fha1,
      and T6SS activation.
  - reference_id: PMID:17558395
    supporting_text: PpkA activity is antagonized by PppA, a Ser-Thr phosphatase.
suggested_questions:
- question: >-
    What extracellular cue causes dimerisation of the PpkA periplasmic domains, and does TagR bind PpkA
    directly as a co-receptor?
suggested_experiments:
- description: >-
    Identify the activating signal by screening for conditions that raise PpkA Thr158/Thr161 phosphorylation
    and Fha1 Thr362 phosphorylation in vivo, and test direct TagR-PpkA binding with purified periplasmic
    domains.
