id: Q9HW09
gene_symbol: panE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  panE (PA4397) of Pseudomonas aeruginosa PAO1 encodes a ketopantoate reductase-family (ApbA/PanE) NADPH-dependent
  oxidoreductase, assigned as 2-dehydropantoate 2-reductase, that reduces 2-dehydropantoate (ketopantoate)
  to (R)-pantoate in the pantoate branch of pantothenate biosynthesis. The assignment rests on full-length
  membership of the canonical KPR family (TIGR00745, PANTHER PTHR43765:SF2) shared with the biochemically
  characterized E. coli PanE; the P. aeruginosa protein itself has not been assayed. It is predicted to
  be a soluble cytoplasmic enzyme.
