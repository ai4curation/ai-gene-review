  review:
    summary: >-
      The generic NAD(P)-dependent CH-OH oxidoreductase term is correct but less specific than the supported
      reductase activity.
    action: MODIFY
    reason: >-
      GO:0016616 is a correct but broad parent class; the specific activity, GO:0008677 2-dehydropantoate
      2-reductase activity, is already carried by this gene through family-based rows.
