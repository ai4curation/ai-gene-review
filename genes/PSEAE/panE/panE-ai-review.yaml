- term:
    id: GO:0008677
    label: 2-dehydropantoate 2-reductase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002464833
  - UniProtKB:P0A9J4
  - UniProtKB:P37402
  review:
    summary: >-
      2-dehydropantoate 2-reductase is the core activity predicted for P. aeruginosa PanE from canonical
      KPR family membership.
    action: ACCEPT
    reason: >-
      PA4397 carries the full ApbA N- and C-terminal domains and matches the apbA_panE NCBIfam model and
      the 2-DEHYDROPANTOATE 2-REDUCTASE PANTHER subfamily, which contains the biochemically characterized
      E. coli PanE. The PAINT IBA (node PTN002464833), the Rhea-based IEA and the ISS from E. coli P0A9J4
      converge on the same activity. No direct assay of the P. aeruginosa enzyme was found.
    supported_by: &id002
    - reference_id: file:PSEAE/panE/panE-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; TIGR00745; apbA_panE; 1.
    - reference_id: file:PSEAE/panE/panE-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes the NADPH-dependent reduction of ketopantoate into pantoic acid. {ECO:0000250|UniProtKB:P0A9J4}.
    - reference_id: PMID:10736170
      supporting_text: >-
        Ketopantoate reductase (EC 1.1.1.169) catalyzes the NADPH-dependent reduction of alpha-ketopantoate
        to form D-(-)-pantoate in the pantothenate/coenzyme A biosynthetic pathway.
