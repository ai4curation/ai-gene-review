- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002464833
  - UniProtKB:P0A9J4
  review:
    summary: NADP(H) is the cosubstrate of KPR; binding is subsidiary to the reductase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      KPR binds NADPH first in an ordered mechanism (shown for the E. coli ortholog that seeds the PAINT
      node), and PA4397 retains the NAD(P)-binding Rossmann domain. The binding is part of the catalytic
      reaction.
    supported_by:
    - reference_id: PMID:10736170
      supporting_text: an ordered sequential kinetic mechanism in which NADPH binding is followed by ketopantoate
        binding
    - reference_id: file:PSEAE/panE/panE-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR036291; NAD(P)-bd_dom_sf.
