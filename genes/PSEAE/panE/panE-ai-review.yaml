suggested_questions:
- question: >-
    Does P. aeruginosa, like E. coli, also reduce ketopantoate through the acetohydroxy acid isomeroreductase
    IlvC, making PanE dispensable?
suggested_experiments:
- description: >-
    Purify PA4397 and measure NADPH-dependent ketopantoate reduction, and test pantothenate prototrophy
    of panE, ilvC and panE ilvC mutants.
  experiment_type: enzyme assay and genetic analysis
