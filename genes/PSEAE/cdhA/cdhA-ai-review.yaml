  label: Pseudomonas aeruginosa PAO1
description: >-
  cdhA (PA5386) encodes the cytoplasmic NAD(+)-dependent L-carnitine
  dehydrogenase of Pseudomonas aeruginosa. The enzyme oxidizes L-carnitine to
  3-dehydrocarnitine, the first committed step of the aerobic route by which P.
  aeruginosa uses L-carnitine as a sole carbon and nitrogen source; CdhC then
  cleaves 3-dehydrocarnitine with acetyl-CoA to betainyl-CoA and acetoacetate,
  and CdhB hydrolyzes betainyl-CoA to glycine betaine. The purified enzyme is
  specific for L-carnitine and NAD(+), and the gene is part of the
  carnitine-induced PA5388-PA5384 locus required for growth on carnitine.
