suggested_questions:
  - question: >-
      Does CdhA channel 3-dehydrocarnitine directly to CdhC, given that
      3-dehydrocarnitine decarboxylates spontaneously to acetonyltrimethylammonium?
suggested_experiments:
  - description: >-
      Test for a CdhA-CdhC complex by co-purification and measure whether
      coupling the two enzymes suppresses non-enzymatic 3-dehydrocarnitine
      decarboxylation.
    experiment_type: protein interaction and coupled enzyme assay
