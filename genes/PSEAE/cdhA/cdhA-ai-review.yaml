            InterPro2GO maps IPR006108/IPR006176/IPR022694 (3-hydroxyacyl-CoA
            dehydrogenase domains) to fatty acid metabolic process. The L-carnitine
            dehydrogenase subfamily (IPR026578, HAMAP MF_02129) shares these
            domains but does not act on fatty acids; the InterPro mapping should
            exclude it.
