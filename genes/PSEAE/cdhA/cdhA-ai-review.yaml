      - UniRule:UR000160024
    review:
      summary: CdhA is a soluble cytoplasmic enzyme.
      action: ACCEPT
      reason: >-
        The HAMAP rule for L-carnitine dehydrogenases places the enzyme in the
        cytoplasm, and the protein has no signal peptide or transmembrane
        segment; its substrates L-carnitine and NAD(+) are intracellular after
        uptake.
      supported_by:
