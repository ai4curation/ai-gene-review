  label: Pseudomonas aeruginosa PAO1
description: >-
  CdhA (PA5386) is the soluble NAD(+)-dependent L-carnitine dehydrogenase of Pseudomonas aeruginosa PAO1.
  It oxidizes L-carnitine to 3-dehydrocarnitine at the entry to aerobic carnitine degradation. CdhC then
  forms betainyl-CoA and acetoacetate, and CdhB hydrolyzes betainyl-CoA to glycine betaine. The cdh locus
  is induced during growth on carnitine; PAO1 genetic evidence and curated biochemical assignments support
  the pathway. The cytoplasmic location is inferred from the curated enzyme family and intracellular reaction
  context.
