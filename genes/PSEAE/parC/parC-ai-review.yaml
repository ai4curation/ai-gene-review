  title: >-
    Cloning, expression, and enzymatic characterization of Pseudomonas aeruginosa topoisomerase IV.
  findings:
  - statement: Reconstituted ParC+ParE decatenates and relaxes DNA without supercoiling.
    supporting_text: >-
      The reconstituted enzyme had ATP-dependent decatenation activity, which is the main catalytic activity
      of bacterial topoisomerase IV, and relaxing activities but had no supercoiling activity.
  - statement: Activity requires ATP, Mg2+ and both subunits.
    supporting_text: >-
      Enzymatic activity was dependent on ATP, Mg 2+ (data not shown), and the presence of both subunits
  - statement: >-
      In type IIA enzymes the A subunit cleaves and rejoins DNA; the B subunit is the ATPase.
    supporting_text: >-
      GyrA is responsible for the DNA strand binding, cleavage, and rejoining, and GyrB is responsible
      for ATPase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA source for GO:0003918, GO:0006265 and GO:0009340, and seed of the PTN001607041 GO:0006265
      and GO:0009330 IBDs. Full text (PMC89156) cached and read: separately purified MBP-cleaved ParC
      and ParE reconstitute ATP-dependent decatenation and relaxation; either subunit alone is inactive.
