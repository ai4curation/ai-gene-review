- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001607041
  - UniProtKB:P9WG47
  - UniProtKB:Q8I0X3
  review:
    summary: >-
      IBA from PTN001607041, seeded only by M. tuberculosis GyrA (P9WG47) and P. falciparum apicoplast
      gyrase A (Q8I0X3).
    action: REMOVE
    reason: >-
      In type IIA topoisomerases the ATP-binding GHKL domain is in the B subunit (GyrB, ParE); the A subunit
      (GyrA, ParC) has no ATP site. ATP binding is a property of the holoenzyme, not of ParC, and the
      term does not suit a GyrA/ParC clade node.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001607041
        source_label: PTN001607041
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          GyrA/ParC (type IIA A-subunit) node. ATP binding is a B-subunit property, so an ATP-binding
          IBD at this node transfers a complex-level property to the A subunit across the clade.
      - source_id: UniProtKB:P9WG47
        source_label: M. tuberculosis GyrA
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Its ATP-binding annotation most likely reflects assays of the reconstituted gyrase; not checked
          in full text.
      - source_id: UniProtKB:Q8I0X3
        source_label: P. falciparum gyrase A
        source_status: UNRESOLVED
        comment: Apicoplast gyrase A; ATP-binding evidence not checked.
    supported_by:
    - reference_id: PMID:10049263
      supporting_text: >-
        GyrA is responsible for the DNA strand binding, cleavage, and rejoining, and GyrB is responsible
        for ATPase activity.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN001607041
      requested_change: DELETE_ROW
      asserted_value: GO:0005524
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        PAINT IBD GO:0005524 ATP binding at PTN001607041, the type IIA topoisomerase A-subunit (GyrA/ParC)
        node, seeded by M. tuberculosis GyrA P9WG47 and P. falciparum Q8I0X3. In gyrase and topoisomerase
        IV the ATP-binding GHKL domain is in the B subunit (GyrB/ParE); the A subunit cleaves and rejoins
        DNA. The IBD propagates ATP binding to every GyrA and ParC leaf of the node. Requested change:
