id: Q9HUK1
gene_symbol: parC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ParC (PA4964) is the A subunit of DNA topoisomerase IV of Pseudomonas aeruginosa, a type IIA topoisomerase
  made of two ParC and two ParE subunits. ParC is the GyrA-like subunit: it binds DNA and carries the
  catalytic tyrosine that cleaves both strands and forms the transient covalent DNA gate, while ParE (PA4967)
  supplies the ATPase. The reconstituted P. aeruginosa ParC-ParE enzyme decatenates and relaxes DNA in
  an ATP- and Mg2+-dependent manner and, unlike gyrase, does not introduce negative supercoils; neither
  subunit is active alone. By homology to E. coli topoisomerase IV, its cellular role is unlinking of
  replicated daughter chromosomes for segregation. Topoisomerase IV is a secondary target of fluoroquinolones
  in P. aeruginosa, and parC mutations contribute to high-level quinolone resistance.
