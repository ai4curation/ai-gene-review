- term:
    id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  evidence_type: IMP
  original_reference_id: PMID:15375113
  qualifier: involved_in
  review:
    summary: >-
      Doyle et al. 2004 (who call PA1460-PA1461 "motAB", the reverse of
      current usage): PA1460 mutants are severely impaired in semisolid agar
      and on swarm plates, and loss of both MotA homologues abolishes
      motility.
    action: MODIFY
    reason: >-
      Correct but general. Both specific descendants are supported for MotC
      and the review asserts both. Swarming (GO:0071978) is the distinctive
      role (single-mutant defect, accepted below). Swimming (GO:0071977) is
      shown by the double stator mutant, which does not swim, and by partial
      restoration of swimming with motCD alone. Listing both captures what
      the general term says without losing the swarming specificity.
    proposed_replacement_terms:
    - id: GO:0071977
      label: bacterial-type flagellum-dependent swimming motility
    - id: GO:0071978
      label: bacterial-type flagellum-dependent swarming motility
    supported_by:
    - reference_id: PMID:15375113
      supporting_text: >-
        Mutation of both genes encoding the MotA homologs or MotB homologs was
        sufficient to abolish motility.
    - reference_id: PMID:15375113
      supporting_text: >-
        MotA, MotB, and MotY are necessary to power movement on surfaces.
    - reference_id: PMID:15629949
      supporting_text: >-
        The pMMB66EH- motCD plasmid also partially complemented the swimming
        defect of the Δ motAB Δ motCD mutant
- term:
    id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
