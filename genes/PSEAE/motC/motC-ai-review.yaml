    label: plasma membrane
  in_complex:
    id: GO:0120101
    label: bacterial-type flagellum stator complex
  supported_by:
  - reference_id: PMID:15629949
    supporting_text: >-
      However, under higher agar concentrations, the Δ motCD mutant is unable
      to swarm.
  - reference_id: PMID:15375113
    supporting_text: >-
      Mutation of both genes encoding the MotA homologs or MotB homologs was
      sufficient to abolish motility.
suggested_questions:
- question: >-
    What property of MotCD (ion conductance, torque at high load, or stator
    retention under load) makes it, and not MotAB, the stator needed for
    swarming on firmer surfaces?
suggested_experiments:
- description: >-
    Compare single-motor torque-speed curves and stator dwell times of
    motAB-only and motCD-only strains under increasing viscous load, to
    test whether MotCD supports higher-load rotation on surfaces.
