core_functions:
- description: >-
    A subunit of the MotCD stator of the polar flagellum. MotC spans the inner
    membrane and, with MotD, conducts ions to generate torque at the rotor.
    It is redundant with MotAB for swimming and is the stator required for
    swarming on firmer surfaces.
  directly_involved_in:
  - id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  - id: GO:0071977
    label: bacterial-type flagellum-dependent swimming motility
  locations:
