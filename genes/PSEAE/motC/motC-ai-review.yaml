  - UniProtKB:Q9HUL1
  review:
    summary: >-
      PAINT IBA from PTN001252377 (MotA clade), seeded by the PseudoCAP IMP
      swarming rows on MotC (PA1460, this protein) and MotA (PA4954).
    action: ACCEPT
    reason: >-
      True for MotC: the motCD single mutant fails to swarm on 0.5% agar or
      firmer, and motCD alone restores swarming to the double stator mutant.
      The self-reference in WITH/FROM is the expected mark of a seed and of
      experimental grounding on the target itself. The row is accepted for
      this gene, but the node term is too specific for the 29-leaf clade (see
      the GO_CENTRAL defect, recorded here once for the node and
      cross-referenced from motA).
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001252377
        source_label: PTN001252377
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          PAINT leaf GAF (cached) lists 29 GO:0071978 leaves in 19 taxa.
          Flagellar rotation, not surface swarming, is the shared role: the
          clade's one experimentally characterised leaf, E. coli MotA
          (UniProtKB:P09348), has GO:0071973 by IMP, GO:0015252 proton channel
          activity and GO:0120101 stator complex by IPI, and in QuickGO
          (checked 2026-11-06) every GO:0071978 row on the 24 non-PAO1 leaves
          is IBA or IEA.
      - source_id: UniProtKB:G3XD73
        source_label: motC (self)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Sound seed for P. aeruginosa (single-mutant swarming defect), but a
          surface-motility phenotype of one stator of a two-stator organism
          does not support a clade-wide swarming claim.
      - source_id: UniProtKB:Q9HUL1
        source_label: motA (PA4954)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Weak co-seed; the motAB single mutant swarms like wild type or
          better (see genes/PSEAE/motA).
    supported_by:
    - reference_id: PMID:15629949
      supporting_text: >-
        In contrast, the Δ motCD mutant can swarm to a degree comparable to
        that of the WT in a relatively low agar concentration (0.45%), but not
        at higher concentrations tested (above or equal to 0.5%).
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN001252377
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0071978
      corrected_value: GO:0071973
      corrected_label: bacterial-type flagellum-dependent cell motility
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The IBD of GO:0071978 bacterial-type flagellum-dependent swarming
        motility at PTN001252377 (PTHR30433 MotA clade, 29 leaf IBAs in 19
        taxa) has two seeds, both PseudoCAP IMP rows on P. aeruginosa stator
        A subunits, MotC (PA1460; PMID:15629949) and MotA (PA4954;
        PMID:15629949, PMID:25349157). The MotC seed is sound for P.
        aeruginosa, and the MotA seed is weak (the motAB single mutant swarms
        like wild type, or better). The objection is to the term, not to the
        seeds. GO:0071978 is_a GO:0071973 and adds a lifestyle context to it:
        its definition requires "the smooth movement of a group of cells along
        a solid surface" and notes that "Swarming motility is observed in
        groups of bacteria". What a MotA-family protein contributes is the
        stator half of the flagellar motor, an ion channel that generates
        torque, and that is what the clade's one experimentally characterised
        leaf shows: E. coli MotA (UniProtKB:P09348), the seed of this node's
        own stator-complex IBD, carries GO:0071973 by IMP, GO:0015252 proton
        channel activity, and GO:0120101 bacterial-type flagellum stator
        complex by IPI, and has no experimental swarming annotation. Whether an
        organism swarms over a surface turns on surfactant production, cell
        density and growth conditions rather than on which stator it encodes,
        so the context-bearing child term should not be inherited by descent
        while its parent is the property the clade actually shares. We make no
        claim about whether the other leaves do or do not swarm; we checked
        only the annotation state, and in QuickGO (checked 2026-11-06) every
        GO:0071978 row on the 24 non-PAO1 leaves is IBA or IEA, so no leaf
        besides the two P. aeruginosa seeds carries experimental support for
        the specific term. Please consider replacing the node term with
        GO:0071973 bacterial-type flagellum-dependent cell motility, alongside
        the existing stator complex IBD (seeded by E. coli MotA, P09348). A
        parallel defect was filed for the MotB node PTN001251133
        (genes/PSEAE/motB).
      supported_by:
      - reference_id: PMID:15629949
        supporting_text: >-
          The Δ motAB mutant is able to swarm as well as the WT in agar
          concentrations up to 0.7%.
      - reference_id: PMID:15375113
        supporting_text: >-
          Mutation of both genes encoding the MotA homologs or MotB homologs
          was sufficient to abolish motility.
