- id: PMID:15375113
  title: The complex flagellar torque generator of Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PA1460-PA1461 (called motAB in this paper) mutants swim at near
      wild-type speed in liquid but are severely impaired in semisolid agar
      and on swarm plates; chemotaxis is normal; loss of both MotA homologues
      abolishes motility.
    supporting_text: >-
      Effects of motor mutations on swarming: MotA, MotB, and MotY are
      necessary to power movement on surfaces.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Doyle et al. 2004 J Bacteriol; full text cached. Supports the IMP
      motility row. Beware the swapped motAB/motCD names (their motA is
      PA1460, current motC).
- id: PMID:15629949
  title: Evidence for two flagellar stators and their role in the motility of Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      The motCD deletion cannot swarm on 0.5% agar or firmer; motCD in trans
      restores swarming to the double stator mutant.
    supporting_text: >-
      However, under higher agar concentrations, the Δ motCD mutant is unable
      to swarm.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Toutain et al. 2005 J Bacteriol (PA14); full text cached. Supports the
      PseudoCAP IMP swarming row on motC, a sound seed of PTN001252377.
- id: PMID:25349157
  title: Cyclic di-GMP-mediated repression of swarming motility by Pseudomonas aeruginosa
    PA14 requires the MotAB stator.
  findings:
  - statement: >-
      High c-di-GMP alters GFP-MotD localization; the authors propose MotAB
      displaces MotCD from the motor.
    supporting_text: >-
      We propose that when c-di-GMP level is high, the MotAB stator can
      displace MotCD from the motor, thereby affecting motor function.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Kuchma et al. 2015; abstract only. Not a GOA reference for motC; used
      for the two-stator context.
