gene_symbol: motC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  MotC (PA1460) is the A subunit of the MotCD flagellar stator of Pseudomonas
  aeruginosa, a MotA-like polytopic inner-membrane protein of the
  MotA/TolQ/ExbB family that, with MotD (PA1461), forms an ion-conducting
  stator unit generating torque at the rotor of the single polar flagellum.
  MotCD and the second stator, MotAB (PA4954-PA4953), are redundant for
  swimming, and loss of both MotA homologues abolishes motility. MotCD is the
  stator required for swarming on firmer (0.5% agar or more) surfaces and for
  efficient translocation through semisolid agar, which makes it the main
  surface-motility stator; high c-di-GMP reduces MotCD function, in part by
  MotAB displacing it from the motor.
