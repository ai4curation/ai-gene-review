core_functions:
- description: >-
    N-acetylglucosamine-specific PTS enzyme IIBC in the inner membrane; takes
    the phosphoryl group from the PA3760 enzyme I/HPr/IIA fusion onto its EIIB
    cysteine and transports N-acetylglucosamine in as
    N-acetylglucosamine 6-phosphate.
