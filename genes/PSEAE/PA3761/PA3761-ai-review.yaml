taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3761 encodes the N-acetylglucosamine-specific enzyme IIBC of the
  phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS) of
  Pseudomonas aeruginosa, an inner-membrane protein of the NagE family (TCDB
  4.A.1.1.15) with an eight-helix EIIC translocation domain followed by two EIIB
  domains, the first carrying the phosphocysteine active site. It works with
  PA3760, a fused enzyme I/HPr/enzyme IIA, at the end of a glucosamine
  utilisation operon, to take up N-acetylglucosamine as N-acetylglucosamine
  6-phosphate. Mutants in either gene fail to grow on N-acetylglucosamine as
  sole carbon source, and the genes are induced by N-acetylglucosamine.
