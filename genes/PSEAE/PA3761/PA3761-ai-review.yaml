suggested_questions:
- question: >-
    PA3761 carries a second EIIB-like domain (residues 491-570) that UniProt
    flags as lacking the conserved residues. Is it a degenerate duplicate, or
    does it have a structural role in the EIIBC?
suggested_experiments:
- description: >-
    Measure [14C]N-acetylglucosamine uptake and PEP-dependent GlcNAc
    phosphorylation in membranes of wild type, PA3761 and PA3761 C405A
    mutants to confirm transport and the phosphocysteine mechanism directly.
