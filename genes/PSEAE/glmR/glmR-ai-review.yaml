- term:
    id: GO:0045724
    label: positive regulation of cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:14982774
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row. A cilium is a eukaryotic organelle by GO definition, so the
      term cannot apply to a bacterium. The observation behind it is loss of
      motility in a pleiotropic glmR mutant.
    action: REMOVE
    reason: >-
      Taxonomically impossible term; a bacterial-flagellum term would also be an
      indirect phenotype, since no flagellar target of GlmR is reported.
    supported_by:
    - reference_id: PMID:14982774
      supporting_text: The drug supersusceptibility of 19A was accompanied by loss of
        motility, reduced resistance to osmotic and heat shock stress, and impaired growth
        at low temperatures.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0045724
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        GO:0045724 positive regulation of cilium assembly is annotated to the
        P. aeruginosa DeoR-family repressor GlmR (PA5550) from PMID:14982774.
        GO defines the cilium as a specialized eukaryotic organelle, so the term
        is wrong for a bacterium regardless of the paper's content. The
        underlying observation, loss of motility of the pleiotropic glmR
        mutant, is an indirect phenotype. Please delete the row.
      supported_by:
      - reference_id: PMID:14982774
        supporting_text: The drug supersusceptibility of 19A was accompanied by loss
          of motility, reduced resistance to osmotic and heat shock stress, and impaired
          growth at low temperatures.
      report_status: NOT_REPORTED
