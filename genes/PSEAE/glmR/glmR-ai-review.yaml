  label: Pseudomonas aeruginosa PAO1
description: >-
  GlmR (PA5550) is a DeoR-family transcriptional repressor of Pseudomonas
  aeruginosa, with an N-terminal DeoR-type helix-turn-helix DNA-binding domain
  and a C-terminal DeoR sensor domain of the NagB/RpiA fold that in related
  regulators binds a sugar-phosphate effector. The gene lies between the glmS and
  glmU homologues, and GlmR represses transcription of the adjacent glmS
  (glucosamine-6-phosphate synthase), which supplies precursors for
  peptidoglycan and lipopolysaccharide. A glmR transposon mutant is
  hypersusceptible to many antibiotics and shows filamentous cells, loss of
  motility and reduced stress tolerance. Its effector ligand is unknown.
references:
- id: PMID:14982774
  title: 'Selection of an antibiotic-hypersusceptible mutant of Pseudomonas aeruginosa:
    identification of the GlmR transcriptional regulator.'
  findings:
  - statement: GlmR represses transcription of the adjacent glmS homologue.
    supporting_text: We showed that GlmR represses the transcription of the adjacent
      glmS homologue (PA5549) in P. aeruginosa, possibly affecting the pool of precursors
      for peptidoglycan and LPS synthesis.
  - statement: The glmR mutant is pleiotropic, with filamentous cells, loss of motility
      and stress sensitivity.
    supporting_text: The drug supersusceptibility of 19A was accompanied by loss of motility,
      reduced resistance to osmotic and heat shock stress, and impaired growth at low
      temperatures.
  - statement: The mutant has filamentous cells.
    supporting_text: Light microscopy of the mutant strain revealed abnormal morphology
      characterized by large, filamentous cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for all five IMP rows; the negative regulation of
      transcription row seeds PTN000769142. Abstract only (no full text
      returned). The abstract supports glmS repression; the motility, cilium
      and polysaccharide rows rest on pleiotropic mutant phenotypes.
