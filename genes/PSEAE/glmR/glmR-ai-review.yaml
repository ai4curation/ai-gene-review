core_functions:
- description: >-
    DeoR-family ligand-modulated transcriptional repressor that binds operator
    DNA and represses the adjacent glmS (glucosamine-6-phosphate synthase) gene.
  molecular_function:
    id: GO:0098531
    label: ligand-modulated transcription factor activity
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  supported_by:
