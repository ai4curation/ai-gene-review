      for peptidoglycan and LPS synthesis.
suggested_questions:
- question: >-
    What effector does the GlmR DeoRC domain bind (for example glucosamine-6-phosphate
    or another amino-sugar phosphate), and does it relieve repression of glmS?
- question: >-
    Are the antibiotic hypersusceptibility and filamentation of the glmR mutant
    caused by glmS overexpression, or by other GlmR targets?
suggested_experiments:
- description: >-
    Map the GlmR operator in the glmS promoter by EMSA and footprinting, and
    screen amino-sugar phosphates for release of GlmR from DNA.
- description: >-
    Test whether deleting or down-regulating glmS in the glmR mutant restores
    antibiotic resistance, cell shape and motility.
