  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2988 is one of the two integral inner-membrane permease subunits (LolC/LolE family, ABC-4
  integral membrane protein family) of the LolCDE ABC transporter of Pseudomonas aeruginosa,
  encoded with the LolD ATPase (PA2987) and the second permease PA2986. It has four predicted
  transmembrane helices flanking a periplasmic MacB-like core domain. The purified P. aeruginosa
  LolCDE complex, reconstituted into proteoliposomes, releases outer-membrane-specific lipoproteins
  from the bilayer in an ATP- and LolA-dependent manner, forming the LolA-lipoprotein complex that
  delivers lipoproteins to LolB and the outer membrane. P. aeruginosa LolCDE does not release
  lipoproteins carrying the Lys3-Ser4 inner-membrane retention signal, so it sets the sorting
  specificity of lipoproteins in this organism.
