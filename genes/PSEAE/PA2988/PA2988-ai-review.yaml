    Permease subunit of the inner-membrane LolCDE ABC transporter, which uses ATP to release
    outer-membrane-destined lipoproteins from the inner membrane to the periplasmic chaperone LolA
    for delivery to the outer membrane, and rejects lipoproteins with the Lys3-Ser4 retention
    signal.
