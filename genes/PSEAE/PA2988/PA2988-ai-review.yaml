suggested_questions:
- question: >-
    Which of the two P. aeruginosa permeases (PA2988 or PA2986) plays the LolC role (recruiting
    LolA) and which the LolE role (binding the lipoprotein)? Sequence identity to E. coli LolC and
    LolE alone may not settle it.
suggested_experiments:
- description: >-
    Pull-down of LolA with LolCDE complexes lacking either permease periplasmic domain, and
    photo-crosslinking of a substrate lipoprotein, to assign the LolC-like and LolE-like roles to
    PA2988 and PA2986.
