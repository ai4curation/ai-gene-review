  title: >-
    Fatty acid biosynthesis in Pseudomonas aeruginosa: cloning and characterization of the
    fabAB operon encoding beta-hydroxyacyl-acyl carrier protein dehydratase (FabA) and beta-ketoacyl-acyl
    carrier protein synthase I (FabB).
  findings:
  - statement: >-
      fabA encodes beta-hydroxyacyl-ACP dehydratase; fabA/fabB were cloned and chromosomal
      fabA mutants are auxotrophic for unsaturated fatty acids.
    supporting_text: >-
      Chromosomal fabA and fabB mutants were isolated; the mutants were auxotrophic for unsaturated
      fatty acids.
  - statement: fabA and fabB are cotranscribed as an operon.
    supporting_text: Northern analysis demonstrated that fabA and fabB are cotranscribed
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Hoang and Schweizer 1997). Abstract only in the cache, but the abstract
      states the gene assignment, the unsaturated-fatty-acid auxotrophy of the fabA mutant,
      and the operon structure. The auxotrophy is not an indirect phenotype for fabA - its
      isomerase activity is the committed step that creates the cis double bond. Source of
      the PseudoCAP IMP GO:0006636 row and the seed of the GO:0006633 IBD at PTN008624492.
