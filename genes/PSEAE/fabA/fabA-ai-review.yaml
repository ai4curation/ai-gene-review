suggested_questions:
- question: >-
    Over what range of acyl chain lengths does P. aeruginosa FabA act as a dehydratase versus
    an isomerase, and how is the partition with FabZ (if present) organised in this organism?
suggested_experiments:
- description: >-
    Assay purified PAO1 FabA for dehydratase and isomerase activities on a graded set of (3R)-hydroxyacyl-ACP
    and (2E)-enoyl-ACP substrates to define the chain-length dependence of each activity.
