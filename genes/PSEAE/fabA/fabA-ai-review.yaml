  label: Pseudomonas aeruginosa PAO1
description: >-
  FabA (PA1610) is the beta-hydroxydecanoyl-ACP dehydratase/isomerase of the dissociated type
  II fatty acid synthase of Pseudomonas aeruginosa, a hot-dog-fold enzyme of the FabA subfamily.
  It has two activities: it dehydrates (3R)-hydroxyacyl-ACP intermediates to (2E)-enoyl-ACP
  (EC 4.2.1.59) during each round of elongation, and, uniquely for this subfamily, it isomerises
  (2E)-decenoyl-ACP to (3Z)-decenoyl-ACP (EC 5.3.3.14), the committed branch point that introduces
  the cis double bond into unsaturated fatty acids. The cis-3-decenoyl-ACP it makes is then
  elongated by FabB. fabA is cotranscribed with fabB as the fabAB operon, and fabA mutants
  are auxotrophic for unsaturated fatty acids. FabA is a soluble cytosolic enzyme.
