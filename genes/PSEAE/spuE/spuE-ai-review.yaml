id: Q9I6J0
gene_symbol: spuE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SpuE (PA0301) is a periplasmic spermidine-binding protein of the PotD/PotF
  family in Pseudomonas aeruginosa, a substrate-binding component, with its
  paralog SpuD, of the SpuDEFGH ABC transporter for polyamine uptake. SpuE binds
  spermidine with nanomolar affinity and does not bind putrescine, cadaverine or
  spermine; Trp271 is a key determinant of this specificity. Mutation of spuE
  greatly reduces spermidine uptake and lowers induction of the type III
  secretion system by polyamines.
