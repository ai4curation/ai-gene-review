id: Q9I544
gene_symbol: mgtE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  MgtE (PA0913) is the Pseudomonas aeruginosa PAO1 inner-membrane magnesium
  transporter of the MgtE/SLC41 family. It has a cytoplasmic N domain and two
  CBS domains joined to a C-terminal transmembrane domain by a connecting
  helix. In the Thermus thermophilus homologue this architecture forms a
  homodimeric Mg2+-selective channel. Mg2+ bound at sites between the
  cytoplasmic domains holds the pore shut, so the channel senses intracellular
  Mg2+ and admits more when Mg2+ is low; most of these Mg2+ ligands, including
  the pore aspartate, are conserved in PA0913. P. aeruginosa MgtE transports
  Mg2+, is not essential, and is induced under low Mg2+. It also dampens type
  III secretion. mgtE mutants show more T3SS transcription and more
  cytotoxicity toward airway epithelial cells, and mgtE expression acts through
  the GacAS-rsmY/rsmZ pathway to inhibit exsA translation. Variants defective
  in Mg2+ transport can still suppress cytotoxicity, and the Mg2+-binding sites
  of the connecting helix are needed to couple transport to this regulatory
  output.
