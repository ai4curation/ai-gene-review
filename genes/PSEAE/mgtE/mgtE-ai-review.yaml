- id: PMID:24722909
  title: MgtE is a dual-function protein in Pseudomonas aeruginosa.
  full_text_unavailable: true
  findings:
  - statement: >-
      P. aeruginosa MgtE transports Mg2+ and regulates cytotoxicity, and
      Mg2+-binding sites of the connecting helix, identified from a model
      based on the T. thermophilus structure, are needed to couple the two.
    supporting_text: >-
      We demonstrated both magnesium transport and cytotoxicity-regulating
      functions, and showed that magnesium-binding sites in the connecting
      helix region of MgtE are vital in coupling these two functions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Coffey, Akhand and Anderson 2014, Microbiology
      160:1200-1213). Abstract only; no PMC copy, and the publisher and thesis
      pages could not be fetched. Supports the PseudoCAP GO:0015693 IMP seed.
      It does not directly support GO:0000287 binding: the abstract describes
      mutants of predicted sites, not a binding measurement.
- id: PMID:20028803
  title: The Pseudomonas aeruginosa magnesium transporter MgtE inhibits transcription
    of the type III secretion system.
  full_text_unavailable: true
  findings:
  - statement: >-
      mgtE mutation increases T3SS transcription; transport-defective mgtE
      variants still complement the cytotoxicity phenotype.
    supporting_text: >-
      mgtE variants that were defective for magnesium transport could still
      complement the cytotoxicity effect
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Anderson et al. 2010, Infect Immun); abstract only in cache.
- id: PMID:28847924
  title: Pseudomonas aeruginosa Magnesium Transporter MgtE Inhibits Type III Secretion
    System Gene Expression by Stimulating rsmYZ Transcription.
  findings:
  - statement: >-
      mgtE expression acts through GacAS to increase rsmY/rsmZ and inhibit
      exsA translation.
    supporting_text: >-
      We now demonstrate that mgtE expression acts through the GacAS
      two-component system to activate rsmY and rsmZ transcription.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Chakravarty et al. 2017, J Bacteriol). Regulatory
      output of MgtE; used for the description only.
- id: PMID:17700703
  title: Crystal structure of the MgtE Mg2+ transporter.
  findings:
  - statement: >-
      T. thermophilus MgtE is a homodimer with Mg2+ bound in the pore and at
      cytosolic sensor sites between the connecting helices and other domains.
    supporting_text: >-
      A solvent-accessible pore nearly traverses the transmembrane domains,
      with one potential Mg2+ bound to the conserved Asp 432 within the pore.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Hattori et al. 2007, Nature). Orthologue structure;
      basis for the Mg2+-binding inference.
- id: PMID:19798051
  title: Mg(2+)-dependent gating of bacterial MgtE channel underlies Mg(2+) homeostasis.
  findings:
  - statement: T. thermophilus MgtE is a Mg2+-selective channel gated by cytosolic Mg2+.
    supporting_text: >-
      Here, we showed that MgtE is a highly Mg(2+)-selective channel gated by
      Mg(2+)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Hattori et al. 2009, EMBO J); orthologue mechanism.
