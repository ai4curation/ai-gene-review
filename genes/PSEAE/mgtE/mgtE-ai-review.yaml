core_functions:
- description: >-
    Inner-membrane Mg2+ transporter of the MgtE family, probably a
    Mg2+-gated, Mg2+-selective channel as in the Thermus orthologue. It moves
    Mg2+ into the cytoplasm, and its cytoplasmic N/CBS domains bind Mg2+ to
    regulate the pore.
  molecular_function:
    id: GO:0015095
    label: magnesium ion transmembrane transporter activity
  directly_involved_in:
  - id: GO:1903830
    label: magnesium ion transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:24722909
    supporting_text: >-
      We demonstrated both magnesium transport and cytotoxicity-regulating
      functions
  - reference_id: PMID:19798051
    supporting_text: >-
      Here, we showed that MgtE is a highly Mg(2+)-selective channel gated by
      Mg(2+)
suggested_questions:
- question: >-
    Does P. aeruginosa MgtE bind Mg2+ at the conserved cytosolic and pore
    sites, as the Thermus structures predict? A direct binding measurement
    would let the PTN000227060 Mg2+-binding IBD rest on experimental evidence.
- question: >-
    How does a membrane Mg2+ transporter signal to GacAS to raise rsmY/rsmZ,
    and is that output separable from transport?
- question: >-
    Should the TM-less MgtE_N/CBS proteins of PTHR43773 (SCO5154, Rv1232c,
    CBO0203, TM_0892, VC_0300) carry NOT magnesium ion transport, and do
    they bind Mg2+ as soluble sensors?
suggested_experiments:
- description: >-
    Measure Mg2+ binding by purified P. aeruginosa MgtE cytosolic domain
    (ITC or tryptophan fluorescence), wild type against the connecting-helix
    site mutants of Coffey et al. Also measure Mg2+ uptake (for example
    25Mg/63Ni or mag-fura-2 assays) in a Mg2+-transport-deficient host.
    This would separate binding, gating and transport for this orthologue.
