  review:
    summary: AlgK supplies structural assembly and polymer-protection functions in the alginate-production
      machinery.
    action: ACCEPT
    reason: AlgK is not a polymerase. It supports proper AlgE localization and interacts with AlgX;
      loss exposes polymer to degradation. This structural work directly contributes to normal alginate
      biosynthesis/export, beyond a nonspecific necessity phenotype.
