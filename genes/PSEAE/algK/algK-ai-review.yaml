- id: PMID:9457868
  title: Deletion of algK in mucoid Pseudomonas aeruginosa blocks alginate polymer formation and
    results in uronic acid secretion.
  findings:
  - statement: P. aeruginosa algK deletion prevents high-molecular-weight alginate accumulation and
      yields small uronic acids; complementation restores production.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Supports an export/assembly contribution; the original polymerization interpretation
      does not establish AlgK catalysis.
- id: PMID:20159471
  title: AlgK is a TPR-containing protein and the periplasmic component of a novel exopolysaccharide
    secretin.
  findings:
  - statement: P. aeruginosa AlgK lipidation and AlgE localization experiments support an outer-membrane-associated
      assembly scaffold.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The crystallized TPR-rich AlgK is from P. fluorescens WCS374r; P. aeruginosa lipidation/localization
      experiments are separate.
- id: PMID:36494359
  title: Structure of the AlgKX modification and secretion complex required for alginate production
    and biofilm attachment in Pseudomonas aeruginosa.
  findings:
  - statement: AlgK–AlgX interactions support coordinated alginate modification and export, with
      P. aeruginosa interaction and interface-mutant evidence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The AlgKX crystal structure and purified polymer-binding assays use P. putida KT2440
      proteins, not P. aeruginosa proteins.
- id: PMID:42766672
  title: MucD regulates alginate biosynthesis through the proteolytic control of AlgX and AlgK in
    Pseudomonas aeruginosa.
  findings:
  - statement: Isolated P. aeruginosa AlgK and AlgX are MucD substrates, whereas assembled AlgKX
      is protected from degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct P. aeruginosa reconstitution and proteolysis; being a protease substrate
      does not make AlgK an enzyme or participant in proteolysis.
core_functions:
- description: Provides a periplasmic assembly scaffold anchored to the outer membrane, supporting
    AlgE localization and AlgK–AlgX association during alginate production/export. P. aeruginosa
    evidence establishes lipidation, localization and interaction; the available AlgKX crystal structure
    is from P. putida.
