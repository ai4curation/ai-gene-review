  label: Pseudomonas aeruginosa PAO1
description: AlgK is an outer-membrane-anchored periplasmic lipoprotein that organizes alginate export.
  Its repeat-rich scaffold supports proper localization of the AlgE pore and associates with AlgX,
  helping maintain productive passage of nascent alginate through the periplasm.
