- term:
    id: GO:0033252
    label: regulation of beta-lactamase activity
  evidence_type: IMP
  original_reference_id: PMID:9835532
  qualifier: involved_in
  review:
    summary: >-
      AmpD lowers AmpC beta-lactamase production by degrading the anhydromuropeptide
      that activates AmpR, which controls ampC transcription. The paper measured
      beta-lactamase expression. GO:0033252 is defined as modulation of the
      beta-lactamase catalytic activity (is_a regulation of hydrolase activity), which
      AmpD does not do.
    action: REMOVE
    reason: >-
      Wrong term; AmpD affects ampC expression indirectly, through the AmpR inducer, and
      not the enzymatic activity of AmpC. No replacement process term is proposed,
      because AmpD's part in AmpR-dependent induction is metabolic (inducer turnover).
    supported_by:
    - reference_id: PMID:9835532
      supporting_text: The ampD product transcomplemented Escherichia coli ampD mutants
        to wild-type beta-lactamase expression.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0033252
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The PseudoCAP IMP row annotates PA4522/ampD to GO:0033252 regulation of
        beta-lactamase activity (PMID:9835532). The paper reports that ampD restores
        wild-type beta-lactamase expression in E. coli ampD mutants; AmpD controls
        ampC transcription indirectly by degrading the AmpR-activating
        anhydromuropeptide and does not modulate beta-lactamase catalytic activity.
        Delete the row. PROBABLE because the 1998 full text could not be read.
      supported_by:
      - reference_id: PMID:9835532
        supporting_text: The ampD product transcomplemented Escherichia coli ampD mutants
          to wild-type beta-lactamase expression.
core_functions:
- description: >-
    Cytoplasmic 1,6-anhydro-N-acetylmuramyl-L-alanine amidase of cell-wall recycling.
    It removes the stem peptide from anhydromuramyl peptides, committing them to
    recycling and removing the AmpR-activating inducer of AmpC beta-lactamase.
