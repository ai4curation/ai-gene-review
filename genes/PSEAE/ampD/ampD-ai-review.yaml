suggested_questions:
- question: >-
    GO:0009392 N-acetyl-anhydromuramoyl-L-alanine amidase activity names the
    anhydro-specific reaction of AmpD but is not placed under GO:0008745. Should it be
    made an is_a child of GO:0008745, and should its definition cover the
    anhydromuramyl peptides (without GlcNAc) that AmpD hydrolyses after NagZ action?
- question: >-
    Which subclade of PTN002019137 should carry the cell-wall location, given that
    the node mixes cytoplasmic AmpD orthologues with periplasmic AmiD, AmpDh2 and
    AmpDh3?
suggested_experiments:
- description: >-
    Fractionate P. aeruginosa expressing chromosomally tagged AmpD, AmpDh2 and AmpDh3,
    with cytoplasmic, periplasmic and outer-membrane markers, to confirm the location
    of each paralogue directly.
