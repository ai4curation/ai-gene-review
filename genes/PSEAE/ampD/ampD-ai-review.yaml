gene_symbol: ampD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AmpD (PA4522) is the cytoplasmic zinc-dependent 1,6-anhydro-N-acetylmuramyl-L-alanine
  amidase of Pseudomonas aeruginosa, a member of the N-acetylmuramoyl-L-alanine amidase 2
  (Amidase_2/PGRP) family. In cell-wall recycling it removes the stem peptide from
  1,6-anhydromuramyl peptides that are generated in the periplasm by lytic
  transglycosylases, imported by AmpG and trimmed by NagZ. Purified AmpD hydrolyses the
  lactyl-amide bond of anhydromuramyl tri-, tetra- and pentapeptides but not of the
  corresponding normal muramyl peptides, so it is specific for recycling metabolites. By
  destroying the anhydromuropeptide that activates the transcriptional regulator AmpR,
  AmpD keeps expression of the chromosomal AmpC beta-lactamase low; ampD loss causes
  partial AmpC derepression, which becomes full when the periplasmic paralogues AmpDh2 and
  AmpDh3 are also lost. ampD forms an operon with ampE.
references:
- id: PMID:9835532
  title: An ampD gene in Pseudomonas aeruginosa encodes a negative regulator of AmpC
    beta-lactamase expression.
  findings:
  - statement: P. aeruginosa ampD complements E. coli ampD mutants for repression of
      beta-lactamase expression.
    supporting_text: The ampD product transcomplemented Escherichia coli ampD mutants
      to wild-type beta-lactamase expression.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP rows (amidase activity, cell wall, regulation of
      beta-lactamase activity). Abstract only (PMC106040 is a scanned article; no text
      could be retrieved). The abstract reports cloning, operon structure and
      heterologous complementation of beta-lactamase expression. Complementation of an
      E. coli ampD mutant is acceptable genetic support for the amidase activity,
      which later biochemistry confirmed. The abstract describes no localization
      experiment, and it reports beta-lactamase expression, not regulation of the
      enzyme's activity.
- id: PMID:23510438
  title: Reactions of the three AmpD enzymes of Pseudomonas aeruginosa.
  findings:
  - statement: Purified AmpD hydrolyses only 1,6-anhydromuramyl peptides, the
      cytoplasmic recycling metabolites.
    supporting_text: AmpD is the true protease for the recycling process in P. aeruginosa,
      as its function is exclusive for turnover of 1,6-anhydromuramyl variants 4–6
  - statement: AmpD is the cytoplasmic enzyme of the three paralogues.
    supporting_text: This analysis identifies AmpD of P. aeruginosa as the cytoplasmic
      protease for commitment to the cell-wall recycling events and for the reversal
      of the activation of the antibiotic-resistance pathway.
  - statement: The reaction is hydrolysis of the amide bond to the lactyl moiety.
    supporting_text: the nature of the enzymatic reaction of AmpD with this compound
      is hydrolysis of the amide bond to the lactyl moiety
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Kinetics with synthetic anhydromuramyl and muramyl peptides for
      all three AmpD paralogues; the direct biochemical evidence for AmpD's activity
      and substrate specificity.
