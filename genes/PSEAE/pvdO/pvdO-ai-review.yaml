  title: RefSeq protein annotations for Pseudomonas putida KT2440 (this repository's results)
  findings:
  - statement: >-
      NCBIfam's product name for NF051459, the model dedicated to this protein, is
      "dihydropyoverdine dehydrogenase", mapped to GO:0002049. The row is the P. putida ortholog,
      but a product name is a property of the HMM rather than of the organism it is applied to.
