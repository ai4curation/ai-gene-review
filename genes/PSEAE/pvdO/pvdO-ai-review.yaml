  qualifier: involved_in
  review:
    summary: PseudoCAP row from the mutagenesis survey that identified eight new pvd genes.
    action: ACCEPT
    reason: >-
      Same verdict as the other rows for this term. Mutating candidate genes and scoring
      pyoverdine production is the right evidence for an IMP. One caveat worth recording rather
