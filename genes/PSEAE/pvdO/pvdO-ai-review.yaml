- id: PMID:30386787
  title: The biosynthesis of pyoverdines.
  findings:
  - statement: >-
      PvdO's step is identified by a mutant phenotype: without it the pathway stops at the
      dihydropyoverdines, so PvdP performs the initial hydroxylation and first oxidation and the
      final oxidation depends on PvdO.
    reference_section_type: RESULTS
    supporting_text: >-
      a mutant strain lacking the putative oxidoreductase PvdO produced the dihydropyoverdines,
      indicating that PvdP catalyzes only the initial hydroxylation and first oxidation, whereas
      the final oxidation depends on PvdO
  - statement: >-
      PvdO's own activity has never been reconstituted: purified protein had no detectable
      cofactor and was inactive, and whether it works alone or with a partner is open.
    reference_section_type: RESULTS
    supporting_text: >-
      PvdO as purified from a heterologous Escherichia coli system did not contain a detectable
      cofactor and was inactive
  - statement: >-
      PvdO and PvdP are the only two enzymes known to build the fluorophore, and they always
      occur together.
    reference_section_type: RESULTS
    supporting_text: >-
      Importantly, PvdO and PvdP always occur together, and currently both seem to be the only
      enzymes that are directly involved in the formation of the pyoverdine fluorophore
  - statement: The gene sits in the periplasmic maturation operon with pvdM and pvdN.
    reference_section_type: RESULTS
    supporting_text: >-
      Three of these periplasmic enzymes, PvdM, PvdN, and PvdO, are usually encoded in an
      operon.
  - statement: >-
      Interposon mutagenesis of these operon genes showed they are essential for pyoverdine
      biosynthesis, which is the basis of the IMP rows.
    reference_section_type: RESULTS
    supporting_text: >-
      Interposon mutagenesis of the corresponding genes in P. aeruginosa indicated essential
      roles of these genes in pyoverdine biosynthesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Ringel & Bruser 2018), full text cached. A review rather than primary
      data, and the only source in hand that states what step PvdO performs. It is also the
      source that makes the over-annotation call possible: it reports the protein as a putative
      oxidoreductase whose activity could not be reconstituted, which is precisely what the
      formylglycine-generating oxidase row asserts as established.
