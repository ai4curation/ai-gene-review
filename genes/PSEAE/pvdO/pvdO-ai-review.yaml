id: Q9I185
gene_symbol: pvdO
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdO (PA2395) is a periplasmic protein of Pseudomonas aeruginosa required for the final step
  that builds the fluorescent chromophore of the siderophore pyoverdine. Together with the
  tyrosinase PvdP it carries out the oxidative cyclisation that converts the precursor's
  dihydroxylated residue into the mature dihydroxyquinoline fluorophore: PvdP performs the
  initial hydroxylation and the first oxidation, and the second oxidation depends on PvdO.
  The protein carries the formylglycine-generating-enzyme fold with its calcium site, and is
  encoded in an operon with the other periplasmic maturation enzymes PvdM and PvdN, but its
  reaction has never been reconstituted: protein purified from a heterologous host carried no
  detectable cofactor and was inactive, so whether it acts alone or needs a partner or electron
  donor is unresolved.
