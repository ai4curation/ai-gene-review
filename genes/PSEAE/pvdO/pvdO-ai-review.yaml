- term:
    id: GO:0120147
    label: formylglycine-generating oxidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1889844
  - PANTHER:PTN001139750
  - UniProtKB:I6Y8I5
  - UniProtKB:Q8NBK3
  - UniProtKB:Q9F3C7
  review:
    summary: >-
      IBA from PTN001139750, the sulfatase-maturating clade. The donors were resolved against
      the UniProt API rather than read from the accessions: Q8NBK3 is human SUMF1, Q9F3C7 the
      Streptomyces coelicolor FGE and I6Y8I5 the Mycobacterium tuberculosis FGE, alongside a
      mouse entry. All are genuine formylglycine-generating enzymes, and two of them are
      bacterial, so the node is well seeded and the usual "only eukaryotic donors" objection
      does not apply. What is overstated is the reaction, not the fold.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The fold inference is sound and is not what is at issue: PvdO really is an FGE-domain
      protein, with Pfam PF03781, the IPR005532 SUMF domain and five calcium-binding features
      that make up that fold's metal site, and the fold is not merely predicted: the record
      cites a 1.24 A crystal structure of residues 22-284 in complex with calcium (PDB 5HHA).
      The problem is that formylglycine-generating oxidase
      activity names a specific substrate - the cysteine in the active site of a sulfatase,
      which it oxidises to formylglycine as part of sulfatase maturation. PvdO's demonstrated
      role is the second oxidation of the pyoverdine chromophore, a siderophore and not a
      sulfatase, and two independent namings on the record agree with that reading rather than
      with the term: UniProt gives the protein a dedicated NCBIfam, NF051459 pyoverdine_PvdO,
      rather than a sulfatase-maturation model, and the people who solved its structure
      deposited it as "Chromophore maturation protein".
      MARK_AS_OVER_ANNOTATED rather than REMOVE, deliberately: the oxidative chemistry class is
      right, the mechanism may well be homologous to the FGE reaction, and nobody has measured
      any activity for this protein - purified PvdO had no detectable cofactor and was inactive,
      so there is no assay result to set against the PAINT node's judgement. The term is not
      wrong about what kind of protein this is; it is wrong about what the protein acts on.
      Not MODIFYed to a general oxidoreductase term such as GO:0016491 either, and the reason
      needs stating carefully, because there is something to be said for it. NCBIfam's dedicated
      model for this protein, NF051459, carries the product name "dihydropyoverdine
      dehydrogenase" - visible in this repository's RefSeq results for the P. putida ortholog,
      and a property of the HMM rather than of the organism it is applied to - so a curated
      resource does name both the substrate and the reaction type, and they match the step
      exactly. That is a real argument for a dehydrogenase term, and it is not dismissed here.
      What decides against it is that a family product name is a curated prediction, and the one
      measurement anyone has reported on this protein found it inactive and without a detectable
      cofactor. The pathway review calls it a putative oxidoreductase and raises the possibility
      that it works only in association with another component. So a MODIFY would trade a term
      that is wrong about the substrate for one asserting precisely what the only assay failed to
      show. Marking the existing row over-annotated leaves the fold-level claim visible with its
      limits recorded, and the NCBIfam naming is recorded here so that a reader who weighs the
      prediction more heavily than the failed assay can see the case for the other verdict.
    supported_by:
    - reference_id: PMID:30386787
      reference_section_type: RESULTS
      supporting_text: >-
        a mutant strain lacking the putative oxidoreductase PvdO produced the
        dihydropyoverdines, indicating that PvdP catalyzes only the initial hydroxylation and
        first oxidation, whereas the final oxidation depends on PvdO
    - reference_id: PMID:30386787
      reference_section_type: RESULTS
      supporting_text: >-
        PvdO as purified from a heterologous Escherichia coli system did not contain a detectable
        cofactor and was inactive
    - reference_id: file:PSEAE/pvdO/pvdO-uniprot.txt
      record_section: [REF]
      supporting_text: 'RT   "Crystal structure of Chromophore maturation protein from Pseudomonas'
    - reference_id: file:PSEAE/pvdO/pvdO-uniprot.txt
      record_section: ["DR:PDB"]
      supporting_text: DR   PDB; 5HHA; X-ray; 1.24 A; A/B=22-284.
    - reference_id: file:projects/REFSEQ_GO/results/PSEPK/ncbi_proteins.tsv
      supporting_text: >-
        WP_010954970.1	PP_4215	dihydropyoverdine dehydrogenase	HMM:NF051459.1	GO:0002049
    - reference_id: file:PSEAE/pvdO/pvdO-uniprot.txt
      reference_section_type: OTHER
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; NF051459; pyoverdine_PvdO; 1.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:Q8NBK3
        source_label: SUMF1_HUMAN, Formylglycine-generating enzyme
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          A genuine FGE acting on sulfatases, so the activity is right for the donor. The target
          shares the fold but acts on a siderophore chromophore.
      - source_id: UniProtKB:Q9F3C7
        source_label: FGE_STRCO, Formylglycine-generating enzyme
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          A bacterial FGE, which matters: the donor set is not restricted to eukaryotes, so the
          objection cannot be that the function was propagated across too great a taxonomic
          distance. It is substrate divergence within prokaryotes.
      - source_id: UniProtKB:I6Y8I5
        source_label: FGE_MYCTU, Formylglycine-generating enzyme
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: As for the Streptomyces FGE; resolved against the UniProt API.
      - source_id: PANTHER:PTN001139750
        source_label: PTN001139750
        source_status: UNRESOLVED
        comment: >-
          Whether the node placement is wrong cannot be settled from what is published. If the
          FGE reaction is ancestral in this clade and PvdO has been recruited to a new substrate,
          the node is right and the target has diverged; if the clade is better described as
          metal-dependent oxidases of varied substrate, the node asserts too narrow a reaction.
          Marked over-annotated on the target rather than faulted at the node for that reason.
      residue_claims_not_applicable: >-
        No residue-level claim is at issue. The dispute is over the substrate of a shared fold;
        the propagation cited no catalytic residues, and the calcium-binding features on the
        record are fold features rather than evidence of the sulfatase reaction.
core_functions:
- description: >-
    Periplasmic partner of the tyrosinase PvdP in chromophore maturation: carries out the second
    oxidation that converts dihydropyoverdine into the mature fluorophore. The reaction has not
    been reconstituted, so no molecular function term is asserted.
  directly_involved_in:
  - id: GO:0002049
    label: pyoverdine biosynthetic process
  supported_by:
  - reference_id: PMID:30386787
    reference_section_type: RESULTS
    supporting_text: >-
      a mutant strain lacking the putative oxidoreductase PvdO produced the dihydropyoverdines,
      indicating that PvdP catalyzes only the initial hydroxylation and first oxidation, whereas
      the final oxidation depends on PvdO
  - reference_id: PMID:30386787
    reference_section_type: RESULTS
    supporting_text: >-
      Importantly, PvdO and PvdP always occur together, and currently both seem to be the only
      enzymes that are directly involved in the formation of the pyoverdine fluorophore
  knowledge_gaps:
  - gap_statement: >-
      No activity has ever been measured for PvdO. Protein purified from E. coli contained no
      detectable cofactor and was inactive, so it is not known what cofactor the active enzyme
      carries, whether it performs the second oxidation on its own, or whether it needs a partner
      such as PvdP or a dedicated electron transport system. Until that is settled the reaction
      cannot be written down, which is why this review asserts no molecular function and proposes
      no new term for the step.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Why an FGE-fold protein performs this step is unknown. The fold's characterised reaction
      is the copper-dependent oxidation of a cysteine to formylglycine in sulfatase maturation;
      whether PvdO uses the same chemistry on a different substrate, or has repurposed the
      scaffold for unrelated chemistry, has not been tested, and the answer would determine
      whether the formylglycine-generating oxidase annotation is a substrate error or a genuine
      mechanistic relative.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    What reaction does PvdO catalyse, and with what cofactor? The gene is left with no
    molecular-function annotation once the sulfatase-maturation term is marked over-annotated,
    and no term can be proposed for the chromophore oxidation until the chemistry is known.
- question: >-
    Does PvdO act alone or as part of a complex with PvdP? The two always occur together and are
    the only enzymes implicated in fluorophore formation, which would be consistent with either.
suggested_experiments:
- description: >-
    Reconstitute PvdO activity on dihydropyoverdine, varying the metal supplied during expression
    and testing both the isolated protein and a PvdP co-expression, following the product
    spectroscopically. This is the experiment that would close the main gap and would either
    license a new GO term for the step or reveal the step as a known reaction type.
- description: >-
    Assay purified PvdO for formylglycine-generating activity on a sulfatase peptide substrate.
    A negative result would turn the over-annotation call into a definite refutation; a positive
    one would mean the protein is bifunctional and the existing annotation should stand.
