- term:
    id: GO:0047938
    label: glucose-6-phosphate 1-epimerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:16249
  - EC:5.1.3.15
  - UniRule:UR000484780
  review:
    summary: >-
      The only functional claim left on this gene once the polyphosphate rows are removed, and
      the one the computational evidence actually supports at subfamily level.
    action: ACCEPT
    reason: >-
      Accepted as a family-level assignment, stated as such. Three pieces of curated
      computational evidence agree and are specific rather than fold-level: the entry matches
      InterPro IPR025532, a signature for the glucose-6-phosphate 1-epimerase subfamily and not
      for the aldose-epimerase fold in general (which is the separate IPR008183 it also
      matches); the family assignment comes from PIRNR016020, a curated UniRule system; and a
      curated PIR site rule places two proton-donor active-site residues at 184 and 287. That is
      the strongest available statement about this protein, and it names a reaction rather than
      a class. What it is not is evidence of measured activity: nothing has been assayed on
      PA5422, which is why the record's own name keeps "Putative" and why the review proposes the
      experiment below rather than treating the matter as settled.
    supported_by:
    - reference_id: file:PSEAE/PA5422/PA5422-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR025532; G6P_1-epimerase.'
    - reference_id: file:PSEAE/PA5422/PA5422-uniprot.txt
      record_section: ["FT:ACT_SITE"]
      supporting_text: |-
        FT   ACT_SITE        184
        FT                   /note="Proton donor"
        FT                   /evidence="ECO:0000256|PIRSR:PIRSR016020-1"
- term:
    id: GO:0016853
    label: isomerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008183
  review:
    summary: >-
      InterPro2GO mapping from IPR008183 (Aldose_1/G6P_1-epimerase), the fold-level signature
      shared by aldose 1-epimerases and glucose-6-phosphate 1-epimerases.
    action: TOO_GENERAL
    reason: >-
      True but imprecise on its own: it names neither the substrate nor the centre epimerised.
      Entailed by the accepted GO:0047938. This row's own evidence is the signature that cannot
      separate the two subfamilies, so it supports nothing deeper and is not a MODIFY; the
      subfamily-specific signature sits on the GO:0047938 row instead.
- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR008183
  - InterPro:IPR011013
  review:
    summary: >-
      InterPro2GO process mapping from the same fold-level signatures.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct and about as precise as the evidence allows. Anomeric interconversion of glucose
      6-phosphate is carbohydrate metabolism, but the enzyme does not belong to a named pathway:
      it supplies whichever anomer a downstream enzyme prefers, across glycolysis and the
      Entner-Doudoroff route alike, rather than carrying out a step of one of them. GO offers no
      better-fitting process term that this row's evidence would reach, so it is kept rather than
      refined, and marked non-core because the molecular function, not a process role, is what
      this gene is for.
- term:
    id: GO:0030246
    label: carbohydrate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011013
  - InterPro:IPR014718
  - UniRule:UR000484780
  review:
    summary: >-
      Mapping from two fold-level descriptors of the beta-sandwich — the galactose
      mutarotase-like domain and the GH-type carbohydrate-binding domain — which here describe
      the catalytic domain itself.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Not false: the protein binds a carbohydrate. But what it binds is its own substrate, in
      its own active site, which is already asserted by the accepted GO:0047938; the term reads
      as a separate binding function the protein does not have. Neither supporting signature
      identifies a discrete carbohydrate-binding module appended to the enzyme — both are
      descriptors of the beta-sandwich that forms the catalytic domain. Over-annotated rather
      than removed, because the underlying structural observation is sound and the binding does
      occur.
core_functions:
- description: >-
    Predicted anomerase of the central sugar-phosphate pool: interconverts alpha- and
    beta-D-glucose 6-phosphate, accelerating a mutarotation that otherwise relies on the
    spontaneous rate, so that downstream enzymes are supplied with the anomer they use. Asserted
    at subfamily level from a specific signature and a curated active-site rule, with no assay on
    this protein.
  molecular_function:
    id: GO:0047938
    label: glucose-6-phosphate 1-epimerase activity
  supported_by:
  - reference_id: file:PSEAE/PA5422/PA5422-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: 'DR   InterPro; IPR025532; G6P_1-epimerase.'
  - reference_id: file:PSEAE/PA5422/PA5422-uniprot.txt
    record_section: ["FT:ACT_SITE"]
    supporting_text: |-
      FT   ACT_SITE        287
      FT                   /note="Proton donor"
      FT                   /evidence="ECO:0000256|PIRSR:PIRSR016020-1"
  knowledge_gaps:
  - gap_statement: >-
      Whether PA5422 is an epimerase at all is unmeasured. No kinetic or anomeric assay has been
      reported for this protein, and the aldose-1-epimerase fold houses enzymes acting on free
      sugars as well as on sugar phosphates, so the substrate is predicted rather than known.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      It is not known what, if anything, the organism gains from accelerating a reaction that
      proceeds spontaneously. Whether loss of PA5422 has any growth or metabolic consequence,
      and under which carbon sources, is open.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Does PA5422 act on glucose 6-phosphate, on a free aldose, or on both? The subfamily
    signature predicts the phosphorylated substrate, but the fold accommodates either, and the
    distinction decides whether the enzyme belongs to central metabolism or to sugar uptake.
- question: >-
    What does a cell gain from an enzyme that catalyses a reaction which also occurs
    spontaneously? Anomerases matter when a downstream enzyme is anomer-specific and flux is
    high; identifying which P. aeruginosa enzyme that would be is the way to make the question
    answerable.
- question: >-
    Is the "Putative" in the UniProt name a statement about this protein or about the subfamily?
    Glucose-6-phosphate 1-epimerases are sparsely characterised in bacteria generally, and it
    would be worth knowing whether any member has been assayed.
suggested_experiments:
- description: >-
    Assay purified PA5422 for anomerase activity by coupled or polarimetric measurement of
    alpha/beta-D-glucose 6-phosphate interconversion, with free D-glucose and D-galactose as
    alternative substrates, to test the subfamily prediction directly and to establish the
    substrate rather than assume it.
- description: >-
    Mutate the two predicted proton donors (positions 184 and 287, placed by PIRSR016020-1)
    individually and assay the purified proteins, to test whether the curated site rule
    identifies the real catalytic residues in this protein.
- description: >-
    Delete PA5422 and measure growth on glucose, gluconate and glycerol, and the anomeric
    composition of the intracellular glucose-6-phosphate pool, to find a phenotype for an
    activity whose reaction also proceeds without an enzyme.
