  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:9734809
  title: The polyphosphate kinase gene of Pseudomonas aeruginosa.
  findings:
  - statement: >-
      The paper identifies its subject locus by its neighbour, which places it at PA5242 rather
      than at PA5422: hemB is PA5243, and the gene immediately preceding it is ppk.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The gene immediately follows the hemB gene encoding porphobilinogen synthase responsible
      for heme synthesis.
  - statement: >-
      The protein the paper characterises is a full-length polyphosphate kinase carrying an
      extra N-terminal extension, so it is longer than a typical PPK; the entry annotated here
      is 318 residues, less than half the length of P. aeruginosa PPK.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The predicted amino acid sequence of P. aeruginosa PPK is similar to those of PPKs
      previously characterized except that it possesses an extra stretch of 46 amino acids at
      its N-terminus
  - statement: >-
      The activity demonstrated is polyphosphate synthesis, not polyphosphate degradation.
    reference_section_type: ABSTRACT
    supporting_text: >-
      ATP-dependent polyphosphate-synthesizing activity was drastically enhanced, confirming
      that the protein is a PPK.
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: >-
      PubMed-verified (Ishige, Kameda, Noguchi & Shiba 1998, DNA Res). The paper itself is sound
      and correctly cited elsewhere: P0DP44 (PPK1_PSEAE, gene ppk, PA5242) carries GO:0008976
      from it with evidence code EXP. It is simply not about PA5422, and is relevant to this
      entry only as the source of two rows that should be deleted from it. Abstract-only in the
      cache, but the abstract alone identifies the locus by its neighbour and gives the size,
      and neither fact can be overturned by the unread text.
