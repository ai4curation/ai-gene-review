id: Q9HTE2
gene_symbol: PA5422
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5422 is a predicted glucose-6-phosphate 1-epimerase of Pseudomonas aeruginosa, a cytoplasmic
  enzyme of the aldose-1-epimerase (galactose mutarotase) fold. Enzymes of this subfamily
  interconvert the alpha and beta anomers of D-glucose 6-phosphate, accelerating a mutarotation
  that also proceeds spontaneously and so supplying downstream enzymes with the anomer they
  require. The assignment rests on a subfamily-specific sequence signature and a curated
  site rule that places two proton-donor residues, not on any assay: no enzymatic measurement has
  been reported for this protein, which is why the UniProt name retains "Putative". Two
  polyphosphate-kinase annotations that GOA carries on this entry belong to a different gene.
