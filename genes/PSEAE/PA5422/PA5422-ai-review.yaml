- term:
    id: GO:0008976
    label: polyphosphate kinase activity
  evidence_type: IMP
  original_reference_id: PMID:9734809
  qualifier: enables
  review:
    summary: >-
      A PseudoCAP row from the paper that cloned the P. aeruginosa polyphosphate kinase. The
      paper's subject is PA5242, and the same annotation is already on that gene with
      experimental evidence.
    action: REMOVE
    reason: >-
      Three independent checks place the paper's subject elsewhere. It identifies its locus by
      the neighbouring hemB, which is PA5243, making the subject PA5242 — UniProt P0DP44,
      PPK1_PSEAE, gene name ppk, 690 residues, "Polyphosphate kinase"; PA5242 and PA5422 differ
      by a transposition of the middle digits. It describes a protein longer than a typical PPK
      because of a 46-residue N-terminal extension, while this entry is 318 residues and folds
      as an aldose-1-epimerase beta-sandwich with no kinase domain of any kind. And QuickGO
      returns GO:0008976 on P0DP44 with evidence code EXP citing this same PMID, so the claim
      is not lost by removing it here. Nothing in the unread full text can make a
      318-residue epimerase the gene that sits next to hemB.
    supported_by:
    - reference_id: PMID:9734809
      reference_section_type: ABSTRACT
      supporting_text: >-
        The gene immediately follows the hemB gene encoding porphobilinogen synthase responsible
        for heme synthesis.
    - reference_id: file:PSEAE/PA5422/PA5422-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR025532; G6P_1-epimerase.'
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: PSEUDOCAP
      slot: DB_Object_ID
      requested_change: DELETE_ROW
      asserted_value: UniProtKB:Q9HTE2
      corrected_value: UniProtKB:P0DP44
      corrected_label: ppk, polyphosphate kinase (PA5242)
      cause: IDENTIFIER_TRANSPOSITION
      confidence: CONFIRMED
      explanation: >-
        PseudoCAP annotates GO:0008976 polyphosphate kinase activity to PA5422 (UniProtKB:Q9HTE2)
        by IMP from PMID:9734809. That paper reports the cloning of the P. aeruginosa
        polyphosphate kinase gene and locates it by its neighbour: "The gene immediately follows
        the hemB gene". In PAO1, hemB is PA5243, so the gene described is PA5242, which is
        UniProtKB:P0DP44 (PPK1_PSEAE, gene ppk, 690 aa, "Polyphosphate kinase"). PA5422 encodes a
        318-residue protein of the aldose-1-epimerase family (Pfam PF01263; InterPro IPR025532,
        G6P_1-epimerase; PIRNR016020) with no polyphosphate kinase domain, and is less than half
        the length of the protein the paper describes. P0DP44 already carries GO:0008976 from
        this PMID with evidence code EXP, so deleting the PA5422 row loses no information. The
        two locus tags differ by a transposition of their middle digits, which is the likely
        mechanism. Requested change: delete the row from PA5422.
      supported_by:
