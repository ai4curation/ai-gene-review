  label: Pseudomonas aeruginosa PAO1
description: >-
  KinB (PA5484) is the membrane-bound sensor histidine kinase of the KinB-AlgB two-component system of
  Pseudomonas aeruginosa, encoded immediately downstream of its cognate NtrC-family response regulator
  AlgB. It is an inner-membrane protein with an N-terminal periplasmic sensor domain, a HAMP linker, a
  PAS domain and a C-terminal HisKA/HATPase kinase core with the conserved autophosphorylated histidine
  (His385). The purified cytoplasmic domain autophosphorylates and transfers phosphate to AlgB, and it
  also dephosphorylates phospho-AlgB. In vivo its phosphatase activity is the dominant output: by keeping
  AlgB unphosphorylated, KinB limits AlgU (sigma-22) activity, promotes acute-virulence traits (pyocyanin,
  elastase, motility) and restrains alginate production (mucoidy).
