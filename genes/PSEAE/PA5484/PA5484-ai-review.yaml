- id: PMID:23024348
  title: >-
    The two-component sensor KinB acts as a phosphatase to regulate Pseudomonas aeruginosa Virulence.
  findings:
  - statement: >-
      Purified KinB C-terminal domain removes phosphate from phospho-AlgB; the P390S mutant does not.
    supporting_text: >-
      Together, these data argue that KinB exhibits phosphatase activity and can directly dephosphorylate
      AlgB.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Direct in vitro dephosphorylation of phospho-AlgB by purified HC-KinB, abolished
      in the P390S mutant; supports a phosphoprotein phosphatase activity on a response regulator.
