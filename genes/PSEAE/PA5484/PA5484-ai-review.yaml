suggested_questions:
- question: >-
    What signal does the KinB periplasmic sensor domain perceive, and does it shift the balance between
    kinase and phosphatase output?
suggested_experiments:
- description: >-
    Screen candidate ligands (e.g. by thermal shift or ITC) against the purified KinB periplasmic domain
    and measure their effect on AlgB phosphorylation and dephosphorylation rates in vitro.
