core_functions:
- description: >-
    ATP-hydrolysing nucleotide-binding subunit CbcV of the CbcWV core ABC
    importer. With the permease CbcW and an interchangeable periplasmic
    substrate-binding protein (CbcX for choline, BetX for glycine betaine,
    CaiX for carnitine and short-chain acylcarnitines), it powers uptake of
    quaternary ammonium compounds across the inner membrane, mainly for use as
    carbon and nitrogen sources.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  contributes_to_molecular_function:
    id: GO:0015418
    label: ABC-type quaternary ammonium compound transporting activity
  directly_involved_in:
  - id: GO:0015871
    label: choline transport
  - id: GO:0031460
    label: glycine betaine transport
  - id: GO:1902603
    label: carnitine transmembrane transport
  in_complex:
    id: GO:0055052
    label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
  supported_by:
  - reference_id: PMID:19919675
    supporting_text: The PA5376::tn, PA5377::tn and PA5378::tn mutants all failed to grow on choline (Fig.
      3A) and betaine (Fig. S2) as sole C sources
  - reference_id: PMID:19919675
    supporting_text: In addition to the core transporter comprised of a transmembrane protein (CbcW) and
      an ATPase (CbcV), the Cbc transporter system interacts with at least three SBPs
  - reference_id: PMID:29517479
    supporting_text: Short-chain acylcarnitines are imported by the ABC transporter CaiX-CbcWV.
suggested_questions:
- question: >-
    Should the PTN002466744 amine transporter IBD (seeded by PA5376 and E. coli
    ProV) be repointed to GO:0015418, given that both seeds move quaternary
    ammonium compounds and GO does not class these as amines?
- question: >-
    What sulfur compound underlies the PseudoCAP GO:0015419 and GO:1901682 IDAs
    from PMID:23763788 (for example choline-O-sulfate), and was PAO1 cbcXWV used
    in that study?
suggested_experiments:
- description: >-
    Test whether PAO1 CbcWV with each of its SBPs (CbcX, BetX, CaiX) takes up
    35S-sulfate or choline-O-sulfate in a QAC transporter-deficient host, to
    resolve the sulfate and sulfur compound transporter claims.
