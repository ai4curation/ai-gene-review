gene_symbol: PA5376
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5376 (CbcV) is the nucleotide-binding (ATPase) subunit of the Cbc
  (choline/betaine/carnitine) ABC importer, encoded in the cbcXWV operon
  (PA5378-PA5376) with the periplasmic substrate-binding protein CbcX and the
  integral membrane permease CbcW. It belongs to the ProV/ChoV family of
  osmolyte-uptake ABC ATPases (NCBIfam TIGR03415) and hydrolyses ATP to power
  substrate translocation through CbcW. The CbcWV core works with several
  separately encoded binding proteins that set substrate specificity. With CbcX
  it takes up choline (and betaine), with BetX glycine betaine, and with CaiX
  L-carnitine and short-chain acylcarnitines. Cbc imports these quaternary
  ammonium compounds mainly for use as carbon and nitrogen sources, and a
  PA5376 transposon mutant cannot grow on choline, glycine betaine or carnitine
  as sole carbon source. Expression of cbcXWV is induced by glycine betaine
  through the activator GbdR.
