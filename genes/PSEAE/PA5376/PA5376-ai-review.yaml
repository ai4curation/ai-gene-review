- id: PMID:19919675
  title: The ATP-binding cassette transporter Cbc (choline/betaine/carnitine) recruits
    multiple substrate-binding proteins with strong specificity for distinct quaternary
    ammonium compounds.
  findings:
  - statement: >-
      PA14 transposon mutants in each cbc gene, including PA5376, fail to grow on
      choline, betaine and carnitine as sole carbon sources.
    supporting_text: The PA5376::tn, PA5377::tn and PA5378::tn mutants all failed to grow on choline (Fig.
      3A) and betaine (Fig. S2) as sole C sources
  - statement: CbcV is the ATPase of the CbcWV core transporter, which works with at least three SBPs.
    supporting_text: In addition to the core transporter comprised of a transmembrane protein (CbcW) and
      an ATPase (CbcV), the Cbc transporter system interacts with at least three SBPs
  - statement: Carnitine uptake by CbcWV requires the separately encoded SBP CaiX (PA5388).
    supporting_text: These findings provide compelling evidence that Psyr_2916 and PA5388, hereafter referred
      to as CaiX, enable Cbc-mediated carnitine uptake in P. syringae and P. aeruginosa respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read in the cache. PseudoCAP source for most PA5376 rows and for
      the GO:0005275 and GO:0043190 seed rows of PTN002466744. It supports the
      transport and complex rows; it does not support the catabolic-process rows
      (growth phenotype only) or the amine transporter term (wrong branch).
- id: PMID:21478341
  title: Roles of three transporters, CbcXWV, BetT1, and BetT3, in Pseudomonas aeruginosa
    choline uptake for catabolism.
  full_text_unavailable: true
  findings:
  - statement: >-
      CbcXWV is one of three choline transporters able to support growth on
      choline; its expression is induced by GbdR and glycine betaine.
    supporting_text: BetT3 and CbcXWV, but not BetT1, were sufficient to support growth on choline.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Abstract only. Supports choline uptake. Cited by PseudoCAP for carnitine
      transmembrane transport and glycine betaine transport, which the abstract
      does not address (CHECK defect filed on the carnitine row).
