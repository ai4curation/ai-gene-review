- term:
    id: GO:0005275
    label: amine transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002466744
  - UniProtKB:P14175
  - UniProtKB:Q9HTI8
  review:
    summary: >-
      PAINT IBA from PTN002466744 (ProV/ChoV-type ABC ATPases, 14 leaf IBAs in
      12 taxa), seeded by PA5376 (PseudoCAP IDA, PMID:19919675) and E. coli
      ProV (P14175, EcoCyc IDA).
    action: MODIFY
    reason: >-
      The transport is real, but the term is on the wrong branch. GO defines
      amine transmembrane transporter activity for weakly basic amino or
      substituted-amino compounds. Choline, glycine betaine and carnitine (and
      ProU's glycine betaine and proline betaine) are quaternary ammonium
      compounds, which GO places under GO:0015651 and GO:0015418, not under
      amine transporter activity. Neither seed supports the amine term, so the
      IBD does not stand on ProV alone either. The right MF for the clade is
      ABC-type quaternary ammonium compound transporting activity. For the
      ATPase subunit this is a complex-level activity, recorded as
      contributes_to in core_functions. Same correction as for the permease
      PA5377 at PTN000766131.
    proposed_replacement_terms:
    - id: GO:0015418
      label: ABC-type quaternary ammonium compound transporting activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002466744
        source_label: PTN002466744
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PTHR43869 node of ProV/ChoV-type QAC uptake ATPases. A QAC ABC
          transporter term suits it, but the amine term does not.
      - source_id: UniProtKB:Q9HTI8
        source_label: PA5376 (self)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target's own PseudoCAP IDA is a seed, which is expected, not
          circular. The evidence supports QAC transport, not amine transport.
      - source_id: UniProtKB:P14175
        source_label: ProV (E. coli)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          ProU imports glycine betaine and proline betaine, which are also QACs;
          its own GO:0005275 IDA (EcoCyc) has the same branch problem.
    supported_by:
    - reference_id: PMID:19919675
      supporting_text: The PA5376::tn, PA5377::tn and PA5378::tn mutants all failed to grow on choline (Fig.
        3A) and betaine (Fig. S2) as sole C sources
    - reference_id: PMID:19919675
      supporting_text: Interestingly, cells of MKH13 transformed with pME6041 expressing cbcXWV from PAO1,
        pCbcPAO1, accumulated choline and betaine but little to no carnitine.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN002466744
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0005275
      corrected_value: GO:0015418
      corrected_label: ABC-type quaternary ammonium compound transporting activity
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The IBD for GO:0005275 amine transmembrane transporter activity at
        PTN002466744 (PTHR43869, ProV/ChoV-type ABC ATPases, 14 leaf IBAs) is
        seeded by P. aeruginosa PA5376/CbcV (Q9HTI8, PseudoCAP IDA,
        PMID:19919675) and E. coli ProV (P14175, EcoCyc IDA, PMID:23249124).
        Both transport quaternary ammonium compounds (choline, glycine betaine,
        carnitine, proline betaine), which GO classifies under GO:0015651 and
