id: Q9I1V0
gene_symbol: glgA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  GlgA (PA5455) is the glycogen/alpha-glucan synthase of Pseudomonas aeruginosa
  PAO1. Unlike the canonical enterobacterial enzyme, purified PAO1 GlgA
  preferentially uses UDP-glucose rather than ADP-glucose as the glucosyl donor
  to polymerise linear alpha-1,4-glucan, consistent with the absence of a glgC
  ADP-glucose pyrophosphorylase gene across Pseudomonas spp. The linear
  alpha-glucan it produces feeds the integrated Pseudomonas storage-carbon
  network, in which most flux is routed through the TreY/TreZ and TreS-Mak-GlgE
  routes toward trehalose, maltose and branched alpha-glucan rather than through
  a dominant direct GlgA-to-GlgB branching step.
existing_annotations:
  - term:
      id: GO:0004373
      label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Experimentally supported UDP-glucose donor specificity for this enzyme.
      action: ACCEPT
      reason: >-
        Purified PAO1 GlgA shows the highest polymerase activity with
        UDP-glucose, which the study explicitly attributes to the absence of
        glgC (the ADP-glucose source) in Pseudomonas spp. Although the term
        arises from the donor-blind IPR011835 signature, the UDP-glucose donor
        assignment is the one directly demonstrated for this protein, so it is
        the correct core molecular function.
      supported_by:
        - reference_id: PMID:33872310
          supporting_text: "The highest polymerase activity was with UDP-glucose, as expected given the lack of the glgC gene coding for the enzyme responsible for the production of ADP-glucose in Pseudomonas spp."
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: is_active_in
    review:
      summary: Soluble cytosolic alpha-glucan synthase.
      action: ACCEPT
      reason: >-
        Alpha-glucan/glycogen synthesis is a cytosolic process, and the
        phylogenetic inference (seeded by the cytosolic E. coli ortholog) is
        consistent with a soluble enzyme acting in the cytosol.
      supported_by:
        - reference_id: PMID:33872310
          supporting_text: "GlgA was able to produce linear α-glucan from UDP-glucose without the addition of an acceptor maltooligosaccharide (Fig 2A)."
  - term:
      id: GO:0005978
      label: glycogen biosynthetic process
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    review:
      summary: Participates in the integrated storage-alpha-glucan/glycogen biosynthetic pathway.
      action: ACCEPT
      reason: >-
        GlgA supplies linear alpha-1,4-glucan to the Pseudomonas storage-carbon
        network assigned to glycogen biosynthesis. The phylogenetic inference
        matches the curated pathway role; the Pseudomonas product is routed
        largely through trehalose/maltose and GlgE before branched polymer, but
        this does not remove GlgA from the biosynthetic process.
      supported_by:
        - reference_id: file:PSEAE/glgA/glgA-uniprot.txt
          record_section: ["CC:PATHWAY"]
          supporting_text: "PATHWAY: Glycan biosynthesis; glycogen biosynthesis."
  - term:
