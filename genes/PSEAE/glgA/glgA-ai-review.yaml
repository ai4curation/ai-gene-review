      label: glycogen biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: Electronic assignment consistent with the curated pathway.
      action: ACCEPT
      reason: >-
        Matches the UniProt UniRule pathway assignment to glycogen
        biosynthesis.
      supported_by:
        - reference_id: file:PSEAE/glgA/glgA-uniprot.txt
          record_section: ["CC:PATHWAY"]
          supporting_text: "PATHWAY: Glycan biosynthesis; glycogen biosynthesis."
  - term:
      id: GO:0009011
      label: alpha-1,4-glucan glucosyltransferase (ADP-glucose donor) activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    review:
      summary: Wrong donor for this Pseudomonas enzyme, which prefers UDP-glucose.
      action: REMOVE
      reason: >-
        This IBA transfers the ADP-glucose-donor activity from an ancestral node
        seeded by enterobacterial glycogen synthases (with E. coli P0A6U8 among
        the sources). The node assignment is sound for ADP-glucose-using
        lineages, but PAO1 GlgA was directly shown to prefer UDP-glucose, and
        Pseudomonas lacks the glgC source of ADP-glucose. The donor-specific
        ADP-glucose activity therefore does not hold for this target; the
        correct donor activity GO:0004373 is retained separately.
      propagation_review:
        root_cause: PROPAGATION_BAD
        failure_modes:
          - FUNCTIONAL_DIVERGENCE
        source_entities:
          - source_id: PANTHER:PTN000282962
            source_status: SUPPORTS_TRANSFER
            comment: >-
              Node supports ADP-glucose-dependent glycogen synthase activity for
              enterobacterial members, but the Pseudomonas lineage diverged to a
              UDP-glucose donor (glgC absent), so the ADP-specific term does not
              transfer to this target.
      supported_by:
        - reference_id: PMID:33872310
          supporting_text: "The highest polymerase activity was with UDP-glucose, as expected given the lack of the glgC gene coding for the enzyme responsible for the production of ADP-glucose in Pseudomonas spp."
  - term:
      id: GO:0009011
      label: alpha-1,4-glucan glucosyltransferase (ADP-glucose donor) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Same wrong-donor assignment from the HAMAP rule; contradicted by experiment.
      action: REMOVE
      reason: >-
        The UniProt UniRule MF_00484 default assigns ADP-glucose donor activity
        (EC 2.4.1.21) to all members, but purified PAO1 GlgA preferentially uses
        UDP-glucose and Pseudomonas lacks glgC. This donor-specific sibling is
        the wrong activity for the enzyme; GO:0004373 is the supported term.
      supported_by:
        - reference_id: PMID:33872310
          supporting_text: "The highest polymerase activity was with UDP-glucose, as expected given the lack of the glgC gene coding for the enzyme responsible for the production of ADP-glucose in Pseudomonas spp."
  - term:
      id: GO:0016757
      label: glycosyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct but less specific than the supported UDP-glucose donor activity.
      action: MODIFY
      reason: >-
        Glycosyltransferase activity is a parent of the specific UDP-glucose
        donor activity GO:0004373 that is experimentally supported for this
        enzyme. Refine to that descendant.
      proposed_replacement_terms:
        - id: GO:0004373
          label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
      supported_by:
        - reference_id: file:PSEAE/glgA/glgA-uniprot.txt
          record_section: ["CC:SIMILARITY"]
          supporting_text: "Belongs to the glycosyltransferase 1 family."
  - term:
      id: GO:0030979
      label: alpha-glucan biosynthetic process
    evidence_type: IDA
    original_reference_id: PMID:33872310
    qualifier: involved_in
    review:
      summary: Direct formation of linear alpha-glucan by purified PAO1 GlgA.
      action: NEW
      reason: >-
        Purified PAO1 GlgA produced linear alpha-glucan from UDP-glucose without
        an added acceptor, directly demonstrating participation in alpha-glucan
        biosynthesis. This records the immediate linear product alongside the
        broader glycogen biosynthetic process.
      supported_by:
        - reference_id: PMID:33872310
          supporting_text: "GlgA was able to produce linear α-glucan from UDP-glucose without the addition of an acceptor maltooligosaccharide (Fig 2A)."
