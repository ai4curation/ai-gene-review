suggested_questions:
- question: >-
    VreI lacks a Pfam-detectable sigma-70 region 2. Does it still bind core RNA polymerase
    on its own, or does VreR's positive role reflect a need for a partner to stabilise a holoenzyme?
suggested_experiments:
- description: >-
    Reconstitute VreI with core RNAP and test promoter binding and in vitro transcription
    at the hxc and PA0691 promoters.
