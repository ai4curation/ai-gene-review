gene_symbol: vreI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  VreI (PA0675) is a 181-residue extracytoplasmic function (ECF) sigma factor of Pseudomonas
  aeruginosa PAO1. It is the sigma component of the PUMA3 cell-surface signalling system,
  with the periplasmic receptor-like protein VreA (PA0674) and the inner-membrane sigma factor
  regulator VreR (PA0676). VreR both holds VreI at the membrane and is required for its activity.
  When VreI is overexpressed it induces about 27 genes, mostly downstream of the PUMA3 locus.
  These include the Hxc type II secretion system and its substrate alkaline phosphatase, a
  two-partner secretion system and exbBD homologues. PUMA3 induction increases virulence in
  a zebrafish embryo infection model. VreI carries a sigma-70 region 4.2 helix-turn-helix;
  its region 2 is divergent and not detected by the Pfam Sigma70_r2 model, though the sigma
  region 2 superfamily signature is present.
references:
- id: PMID:19730690
  title: A Novel extracytoplasmic function (ECF) sigma factor regulates virulence in Pseudomonas
    aeruginosa.
  findings:
  - statement: Overexpression of vreI induces a defined set of target genes.
    supporting_text: overexpression of vreI upregulates 30 genes
  - statement: VreR is an anti-sigma regulator for VreI that is required for its function
      and inhibits it under non-inducing conditions.
    supporting_text: In conclusion, VreR is an anti-sigma regulator for VreI that is both
      required for the function of VreI and inhibits its activity under non-inducing conditions.
  - statement: VreI is membrane-associated only through VreR; otherwise it is in the cytosolic
      fraction.
    supporting_text: VreI is associated to the membrane through the VreR sigma factor regulator
  - statement: PUMA3 regulates virulence in zebrafish embryos.
    supporting_text: we have demonstrated, using zebrafish (Danio rerio) embryos as an infection
      model, that PUMA3 is involved in the regulation of P. aeruginosa virulence
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP sigma factor activity (IBD seed) and NAS cytosol rows.
      Full text cached and read. The sigma factor evidence is genetic: overexpression-driven
      target-gene induction (microarray, RT-PCR, lacZ fusion), and loss of that induction
      in the vreR mutant. No RNA polymerase binding or in vitro transcription is shown. This
      is standard genetic support for an ECF sigma factor whose family membership is clear.
      Cytosol/membrane fractionation of HA-tagged VreI supports the cytosol row.
- id: PMID:29729420
  title: Extracytoplasmic function sigma factors in Pseudomonas aeruginosa.
  findings:
  - statement: Review grouping the P. aeruginosa ECF sigma factors by function.
    supporting_text: the iron starvation σ (PvdS, FpvI, HasI, FecI, FecI2 and others), the
      cell wall stress ECFσ AlgU, SigX and SbrI, and the unorthodox σVreI involved in the
      expression of virulence
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review; abstract only in cache.
