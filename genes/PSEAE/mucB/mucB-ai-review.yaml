id: P38108
gene_symbol: mucB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  mucB (algN, PA0764) encodes MucB, a periplasmic RseB-family protein that acts as
  a negative regulator of the extracytoplasmic-function sigma factor AlgU (AlgT,
  sigma22). It is encoded in the algU-mucA-mucB-mucC-mucD operon and is exported
  across the inner membrane by a cleavable signal peptide. In the periplasm MucB
  binds tightly to the C-terminal periplasmic domain of the transmembrane
  anti-sigma factor MucA and protects it from cleavage by the site-1 protease AlgW,
  the first step of the regulated intramembrane proteolysis that releases AlgU.
  Crystal structures of MucB alone and in complex with the MucA periplasmic domain
  show a hydrophobic cavity proposed to sense lipid signals that dissociate the
  complex, and a disulfide bond that affects its oligomeric state. Loss of mucB
  derepresses AlgU, activating the algD promoter and converting P. aeruginosa to
  the alginate-overproducing mucoid form typical of cystic fibrosis isolates.
