- term:
    id: GO:0032885
    label: regulation of polysaccharide biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002215378
  - UniProtKB:P38108
  review:
    summary: >-
      IBA from PTN002215378, whose GO:0032885 IBD is seeded only by this gene's own
      PseudoCAP IMP row. The target appearing in its own WITH/FROM is expected.
    action: KEEP_AS_NON_CORE
    reason: >-
      True of MucB: through AlgU it controls the algD alginate operon, so it
      regulates alginate (polysaccharide) biosynthesis. This is a lineage-specific
      output of the AlgU regulon, not the core function, which is binding the
      anti-sigma factor MucA. The node, however, spans enterobacterial, Vibrio,
      Shewanella and Haemophilus RseB orthologs that regulate sigmaE, for which no
      polysaccharide-synthesis role is known. The IBD is over-propagated beyond P.
      aeruginosa (see source defect).
    supported_by:
    - reference_id: PMID:8412698
      supporting_text: >-
        Insertional inactivation of mucB on the chromosome of the standard genetic
        strain PAO resulted in mucoid phenotype, and in a strong transcriptional
        activation of algD.
    - reference_id: PMID:19298369
      supporting_text: >-
        RseB (a MucB homolog), which is a protein that inhibits DegS cleavage of
        RseA
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN002215378
      requested_change: CHECK
      asserted_value: GO:0032885
      confidence: PROBABLE
      explanation: >-
        The GO:0032885 regulation of polysaccharide biosynthetic process IBD at
        PTN002215378 (7 leaf IBAs) rests only on P. aeruginosa MucB (P38108,
        PseudoCAP IMP PMID:9171421). The phenotype is alginate overproduction
        caused by derepression of the ECF sigma factor AlgU, whose regulon in
        Pseudomonas includes the algD operon. The other leaves are RseB orthologs
        (E. coli P0AFX9, Salmonella H9L461, Yersinia A0A2U2GWS2, Haemophilus
        P44792, Shewanella Q8EH85, Vibrio Q9KPA8) that regulate sigmaE, with no
        reported role in polysaccharide synthesis. Please remove this IBD or place
        it on a Pseudomonas-only node. The node's antisigma factor binding and
        periplasm IBDs (seeded by E. coli RseB) are the conserved claims.
      supported_by:
      - reference_id: PMID:19298369
        supporting_text: >-
          RseB (a MucB homolog), which is a protein that inhibits DegS cleavage of
          RseA
- term:
    id: GO:0032885
    label: regulation of polysaccharide biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:9171421
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP; sole seed of the PTN002215378 GO:0032885 IBD. Mathee et al.
      showed that an algT clone made PAO1 mucoid only when the coupled mucB was
      disrupted.
    action: KEEP_AS_NON_CORE
    reason: >-
      The abstract supports the claim for this gene: an intact mucB keeps cells
      nonmucoid, and chromosomal mucB inactivation independently causes mucoidy
      with algD activation (PMID:8412698). The regulation is negative and acts via
      the sigma factor, but GO has no negative child of this term, and AlgU
      directly transcribes algD, so the term is acceptable. It is peripheral to the
      conserved molecular role. The PseudoCAP row is not a defect; the problem is
      its use as a family-wide seed.
    supported_by:
    - reference_id: PMID:9171421
      supporting_text: >-
        However, the bacterial cells remained nonmucoid if the transcriptionally
        coupled mucB on the clone remained intact.
    - reference_id: PMID:8412698
      supporting_text: >-
        Thus, a loss of mucB function is sufficient to cause conversion of P.
        aeruginosa into the mucoid phenotype.
