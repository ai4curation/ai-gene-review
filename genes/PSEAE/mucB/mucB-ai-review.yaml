core_functions:
- description: >-
    Periplasmic co-antagonist of the ECF sigma factor AlgU. MucB binds the
    periplasmic domain of the anti-sigma factor MucA and blocks its cleavage by
    AlgW, keeping AlgU sequestered until envelope-stress or lipid signals
    dissociate the complex.
  molecular_function:
    id: GO:0045152
    label: antisigma factor binding
  locations:
  - id: GO:0030288
    label: outer membrane-bounded periplasmic space
  supported_by:
  - reference_id: PMID:19298369
    supporting_text: We demonstrate that tight binding of MucB to MucA strongly inhibits this cleavage.
  - reference_id: PMID:31297938
    supporting_text: >-
      MucB binds MucA in the periplasm and inhibits proteolysis of MucA and
      subsequent release of AlgU.
  - reference_id: PMID:32747658
    supporting_text: >-
      These results provide evidence that the hydrophobic cavity of MucB is a
      primary site for sensing lipid molecules
suggested_questions:
- question: >-
    Should the PTN002215378 regulation of polysaccharide biosynthetic process IBD be
    removed or moved to a Pseudomonas-only node, given that the other RseB leaves
    regulate sigmaE rather than polysaccharide synthesis?
- question: >-
    Which natural lipid ligands occupy the MucB hydrophobic cavity in vivo to
    release MucA for AlgW cleavage?
suggested_experiments:
- description: >-
    Identify lipids co-purifying with periplasmic MucB from envelope-stressed
    cells, and test cavity mutants for loss of signal-induced MucA cleavage and
    AlgU activation.
