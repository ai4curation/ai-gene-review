  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1055 encodes the subunit C (ShaC/MrpC) of the Sha (Mrp/Mnh/Pha)
  multisubunit Na+/H+ antiporter of Pseudomonas aeruginosa PAO1. It is a small
  integral membrane protein of 112 residues with two predicted transmembrane
  helices, homologous to the NuoK (ND4L) subunit of respiratory complex I.
  PA1055 is the second gene of the six-gene sha cluster PA1054-PA1059, in which
  shaA and shaB are fused. The cluster expressed in an E. coli strain lacking
  its major Na+/H+ antiporters restores Na+ tolerance and Na+/H+ antiport. In
  P. aeruginosa the Sha antiporter is largely responsible for Na+ extrusion,
  and loss of ShaA causes Na+ sensitivity and attenuated virulence in mouse
  infection models. In Mrp antiporters, activity needs the hetero-oligomeric
  complex of all subunits. Structures of Bacillus Mrp place subunit C next to
  the C-terminal domain of MrpA and MrpD, in a hydrated region proposed to
  form part of the Na+ pathway.
