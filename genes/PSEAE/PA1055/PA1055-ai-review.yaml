suggested_questions:
- question: >-
    Should GO provide a cellular component term for the Mrp-type
    multisubunit Na+/H+ antiporter complex, by analogy with GO:1903103
    potassium:proton antiporter complex, so that Sha/Mrp subunits can be
    annotated to the complex instead of each carrying the activity?
- question: >-
    Should the subunit C IBD at PTN002160376 reach MBH/MBX hydrogenase
    subunits (TK2086, TK1221)? Is a Na+/H+ antiporter MF appropriate for
    those complexes?
suggested_experiments:
- description: >-
    Make an in-frame PA1055 (shaC) deletion in P. aeruginosa, then measure
    Na+ tolerance, Na+ efflux and Sha complex assembly (BN-PAGE), with
    complementation in trans. In parallel, express the cluster lacking only
    PA1055 in E. coli TO114 and assay Na+/H+ antiport in everted vesicles.
