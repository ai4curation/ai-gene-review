gene_symbol: PA4379
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4379 (warA) encodes WarA, a cytoplasmic class I SAM-dependent
  methyltransferase (Methyltransf_25, PF13649) that binds the second messenger
  cyclic-di-GMP. WarA was found as a partner of the SadC diguanylate cyclase
  and forms a complex with WarB (a putative kinase encoded by a convergently
  transcribed gene). Together they resemble the bifunctional E. coli O-antigen
  chain regulator WbdD. Purified WarA binds c-di-GMP specifically in the low
  micromolar range and shows SAM-dependent methyltransferase activity with
  lipopolysaccharide (LPS) as substrate, and c-di-GMP stimulates that activity.
  WarA influences the modal distribution of the common polysaccharide antigen
  (CPA) O antigen, interacts with LPS biogenesis proteins, and contributes to
  evasion of host immune detection in a zebrafish infection model.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: EXP
  original_reference_id: PMID:28263305
  qualifier: enables
  review:
    summary: >-
      Bare protein binding for the reported WarA interactions with the SadC
      cytoplasmic domain and with WarB (two-hybrid and far-western assays).
    action: REMOVE
    reason: >-
      Generic protein binding carries no functional information, and no
      informative MF term describes these partner interactions. Removing the
      row does not mean the interactions are false; WarA's function is
      captured by its methyltransferase and c-di-GMP binding rows.
    supported_by:
    - reference_id: PMID:28263305
      supporting_text: WarA was shown to specifically interact with the cytoplasmic
        part of SadC and form a complex with WarB encoded by a convergently transcribed
        gene.
- term:
    id: GO:0008168
    label: methyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN008676703
  - UniProtKB:P36999
  - UniProtKB:P9WIN3
  - UniProtKB:Q9H8H3
  - UniProtKB:Q9HW23
  review:
    summary: >-
      IBA from PTN008676703, whose seeds are E. coli RlmA, M. tuberculosis
      Rv2952, human TMT1A and WarA itself. Consistent with WarA's own IDA.
    action: ACCEPT
    reason: >-
      The generic term suits a node whose seeds methylate rRNA, a lipid and
      small thiols. WarA's appearance among the sources reflects its own
      experimental grounding. The substrate and product are not
      chemically characterised, so the generic term is as precise as the
      evidence allows.
    supported_by:
    - reference_id: PMID:28263305
      supporting_text: Using a fluorescent-based methyltransferase activity assay,
        LPS was shown to be a substrate for WarA and that increasing the concentration
        of LPS leads to consequential increase in enzyme activity
- term:
    id: GO:0008168
    label: methyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:28263305
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA and one of four seeds of the PTN008676703 IBD. Purified WarA
      was tested in a SAM-donor methyltransferase kit, with LPS as acceptor.
    action: ACCEPT
    reason: >-
      Full text read. The assay uses purified His-tagged WarA, SAM as methyl
      donor and purified LPS as substrate, and activity rises with LPS
      concentration. The kit reports SAM turnover (coupled fluorescence), so
      the methylated position on LPS is not identified. Generic
      methyltransferase activity is therefore the right level.
    supported_by:
    - reference_id: PMID:28263305
      supporting_text: Methyltransferase activity assays were performed using a
        methyltransferase activity kit (Enzo Life Science, Farmingdale, NY) as per
        manufacturer’s specifications using S-adenosyl-L-methionine as the methyl
        group donor and measuring activity in relative fluorescent units.
    - reference_id: PMID:28263305
      supporting_text: At every WarA concentration tested, the addition of c-di-GMP
        led to an increase in the enzymatic activity of WarA (Fig. 4d).
- term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  evidence_type: IDA
  original_reference_id: PMID:28263305
  qualifier: enables
  review:
    summary: >-
      DRaCALA with purified WarA shows specific c-di-GMP binding, competed only
      by unlabelled c-di-GMP. Binding stimulates methyltransferase activity.
    action: ACCEPT
    reason: >-
      Direct binding assay with a specificity control. Binding regulates the
      enzyme, so it is a functional ligand-binding activity, part of the core
      function.
    supported_by:
    - reference_id: PMID:28263305
      supporting_text: WarA was capable of binding to c-di-GMP (Fig. 4b) in the
        low micromolar range, which is consistent with known biologically relevant
        c-di-GMP binding concentrations
core_functions:
- description: >-
    c-di-GMP-stimulated SAM-dependent methyltransferase that acts on
    lipopolysaccharide and, with its partner WarB and the diguanylate cyclase
    SadC, modulates O-antigen (CPA) modal distribution.
  molecular_function:
    id: GO:0008168
    label: methyltransferase activity
  supported_by:
  - reference_id: PMID:28263305
    supporting_text: Using a fluorescent-based methyltransferase activity assay,
      LPS was shown to be a substrate for WarA and that increasing the concentration
      of LPS leads to consequential increase in enzyme activity
- description: >-
    Binds c-di-GMP specifically; binding potentiates the methyltransferase
    activity.
  molecular_function:
    id: GO:0035438
    label: cyclic-di-GMP binding
  supported_by:
  - reference_id: PMID:28263305
    supporting_text: This suggests that c-di-GMP is capable of functioning as an
      agonist, potentiating the enzymatic activity of WarA upon binding.
suggested_questions:
- question: >-
    Which residue or sugar of LPS does WarA methylate, and is the activity
    specific to the CPA O antigen, as for the WbdD-type O-antigen chain
    terminators it resembles?
suggested_experiments:
- description: >-
    Identify the methylated LPS species from wild-type and warA mutant cells by
    mass spectrometry or NMR, with and without c-di-GMP, to define the
    reaction and allow a specific MF term.
