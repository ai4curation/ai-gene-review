taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  HptB (PA3345) is a 116-aa stand-alone histidine-containing phosphotransfer (HPt)
  protein of Pseudomonas aeruginosa, related to yeast Ypd1 and plant AHPs, with the
  phospho-accepting histidine at position 57. It receives phosphoryl groups from several
  hybrid sensor kinases (PA1611, PA1976, PA2824 and RetS) and passes them to the response
  regulator HsbR (PA3346), whose PP2C phosphatase and kinase/anti-sigma domains control
  phosphorylation of the anti-anti-sigma factor HsbA (PA3347). Through this partner-switch
  cascade HptB signalling governs the FlgM-FliA flagellar sigma pair, the HsbR-RpoS
  interaction, the HsbD diguanylate cyclase and GacA-dependent rsmY expression. An hptB
  deletion forms a Pel-dependent hyperbiofilm, attaches and twitches more, and swims and
  swarms poorly, so HptB promotes the planktonic, motile state.
references:
- id: PMID:16182517
  title: Identification of an HptB-mediated multi-step phosphorelay in Pseudomonas aeruginosa
    PAO1.
  findings:
  - statement: PA1611 signals through HptB to the response regulator PA3346.
    supporting_text: >-
      We herein demonstrate that the hybrid sensor PA1611 carries out specific signal
      transduction, through HptB (PA3345), to the response regulator PA3346 in Pseudomonas
      aeruginosa PAO1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0009927 row (seed of PTN002000688) and of three IMP
      rows. Abstract only; the abstract states the phosphorelay result and names the
      phenotypes of the deletion without their signs.
- id: PMID:18256026
  title: Characterization of the histidine-containing phosphotransfer protein B-mediated
    multistep phosphorelay system in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: Four sensor kinases transfer phosphoryl groups to HptB in vitro.
    supporting_text: >-
      Among the 12 recombinant orphan sensor kinases tested, 4 of these sensors (PA1611,
      PA1976, PA2824, and RetS) transferred the phosphoryl group to HptB (PA3345).
  - statement: HptB interacts with each of these sensors in a bacterial two-hybrid assay.
    supporting_text: >-
      The in vivo interaction between HptB and each of the sensors was also confirmed using
      the bacterial two-hybrid assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Direct in vitro phosphotransfer evidence for HptB.
- id: PMID:20398205
  title: Regulatory RNAs and the HptB/RetS signalling pathways fine-tune Pseudomonas aeruginosa
    pathogenesis.
  findings:
  - statement: An hptB deletion is a hyperbiofilm former, complemented by hptB in trans.
    supporting_text: >-
      Introduction of the hptB gene cloned in the pUCP18 plasmid (pUCPhptB), into the hptB
      mutant (PAKΔhptB), resulted in restoration of biofilm and polysaccharide production
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:22128156
  title: Histidine-containing phosphotransfer protein-B (HptB) regulates swarming motility
    through partner-switching system in Pseudomonas aeruginosa PAO1 strain.
  findings:
  - statement: HptB relays phosphoryl groups from multiple sensors to PA3346.
    supporting_text: >-
      The histidine-containing phosphotransfer protein-B (HptB; PA3345) is an intermediate
      protein involved in transferring a phosphoryl group from multiple sensor kinases to the
      response regulator PA3346 in Pseudomonas aeruginosa PAO1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. hptB mutant is non-swarming.
- id: PMID:27792789
  title: The Diguanylate Cyclase HsbD Intersects with the HptB Regulatory Cascade to Control
    Pseudomonas aeruginosa Biofilm and Motility.
  findings:
  - statement: >-
      An hptB mutant makes more exopolysaccharide, attaches more, twitches more, and swims
      and swarms less.
    supporting_text: >-
      When compared to wild type, the hptB mutant produces more exopolysaccharides [17],
      attaches more easily to surface, increases twitching motility while it decreases
      swimming and swarming movements (Figs 2 and 4–6).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:31019225
  title: Connected partner-switches control the life style of Pseudomonas aeruginosa through
    RpoS regulation.
  findings:
  - statement: RpoS acts downstream of HptB and is the target of the HsbR-HsbA partner switch.
    supporting_text: >-
      Altogether, these results indicate that RpoS acts downstream of HtpB in the HtpB
      cascade and that RpoS is the target of the HsbR/HsbA partner-switch.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached.
