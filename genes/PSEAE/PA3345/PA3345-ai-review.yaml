knowledge_gaps:
- gap_statement: >-
    The signals sensed by PA1611, PA1976, PA2824 and RetS that are integrated through HptB,
    and whether HptB phosphotransfer is reversible (acting as a phosphate sink), are unknown.
  gap_kind:
  - BIOLOGY
suggested_experiments:
- description: >-
    Test reverse phosphotransfer from phospho-HsbR receiver domain to HptB and to each
    sensor in vitro, and measure HptB phosphorylation in vivo (Phos-tag) under biofilm- and
    motility-inducing conditions.
