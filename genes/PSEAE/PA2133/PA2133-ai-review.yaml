knowledge_gaps:
- gap_statement: >-
    The physiological role of native PA2133 is unknown: when and where it is
    expressed, which c-di-GMP pool it controls, and which output it regulates. Its
    loss-of-function mutant has no attachment phenotype.
  gap_kind:
  - BIOLOGY
suggested_experiments:
- description: >-
    Profile PA2133 expression across growth and biofilm conditions with a
    chromosomal reporter, and test a clean PA2133 deletion for biofilm, dispersal,
    motility and cytotoxicity phenotypes under the conditions where it is expressed.
- description: >-
    Purify PA2133 and measure c-di-GMP hydrolysis kinetics to test whether the ETL
    motif tunes activity compared with canonical EAL PDEs.
