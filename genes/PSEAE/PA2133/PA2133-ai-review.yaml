taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2133 is a small (285-aa) stand-alone EAL-domain protein with no predicted
  transmembrane segment; its catalytic motif reads ETL. It is an active
  c-di-GMP-specific phosphodiesterase. Lysates of cells overexpressing PA2133
  degrade added c-di-GMP, and expressing PA2133 in P. aeruginosa lowers cellular
  c-di-GMP below detection, even in a wspF mutant with a hyperactive WspR
  diguanylate cyclase. Because it is so effective, PA2133 is widely used as an
  experimental c-di-GMP sink: its expression blocks attachment and biofilm
  formation, disperses established biofilms and lowers type III
  secretion-dependent cytotoxicity. A PA2133 loss-of-function mutant has no
  attachment phenotype, and the physiological role and regulation of the native
  protein are unknown.
references:
- id: PMID:16477007
  title: Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases
    reveals a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: Lysates of a PA2133-overexpressing strain degraded 71% of added c-di-GMP
      (Table 1, read in PMC full text).
    supporting_text: Analysis of the phenotypes of DGC and PDE mutants and overexpressing
      clones revealed that certain virulence-associated traits are controlled by multiple
      DGCs and PDEs through alterations in c-di-GMP levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IDA GO:0071111 row. Cached copy abstract-only; full
      text read on PMC (PMC1413825); excerpts in rocR-notes.md and PA2133-notes.md.
- id: PMID:16186483
  title: A chemosensory system that regulates biofilm formation through modulation
    of cyclic diguanylate levels.
  findings:
  - statement: Plasmid expression of PA2133 removes detectable c-di-GMP from a wspF
      mutant.
    supporting_text: wspF mutant cells carrying the PA2133 expression vector had undetectable
      levels of c-diGMP
  - statement: Plasmid expression of PA2133 abolishes attachment of wild-type cells.
    supporting_text: the ability of wild-type cells to attach to surfaces was also
      completely abolished when PA2133 was expressed
  - statement: A PA2133 loss-of-function mutant has no attachment phenotype.
    supporting_text: A PA2133 mutant resembled the wild type in attachment assays.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      Full text cached and read. PseudoCAP source for the IMP GO:1900191 row and
      PA2133's seeding of PTN009140332. The paper is about the Wsp system; PA2133 is
      expressed from a plasmid as a tool to deplete c-di-GMP, and the PA2133 mutant
      is wild type. It supports PA2133 PDE activity in vivo, not a physiological
      role of PA2133 in biofilm regulation.
- id: PMID:33495218
  title: Induction of Native c-di-GMP Phosphodiesterases Leads to Dispersal of Pseudomonas
    aeruginosa Biofilms.
  findings:
  - statement: PA2133 is regarded as a bona fide c-di-GMP PDE and its induction disperses
      biofilms.
    supporting_text: PA2133 and BifA are both characterized bona fide c-di-GMP PDEs
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; overexpression (inducible) study.
