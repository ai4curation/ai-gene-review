  title: Identification of the aceA gene encoding isocitrate lyase required for the growth of Pseudomonas
    aeruginosa on acetate, acyclic terpenes and leucine.
  findings:
  - statement: >-
      PA2634 (aceA) encodes the ICL; activity is induced by acetate, citronellol and leucine, and the gene
      is needed for growth on these substrates.
    supporting_text: >-
      The isocitrate lyase gene (aceA) corresponding to ORF PA2634 of the PAO1 strain genome was identified
      in one of these mutants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only (PubMed record matches title and gene). PseudoCAP source for the GO:0004451 IDA that
      seeds PTN000493043. Seed sound; the evidence is crude-extract activity plus complementation of a
      mutant rather than a purified-enzyme assay.
- id: PMID:23363478
  title: Type III secretion system expression in oxygen-limited Pseudomonas aeruginosa cultures is stimulated
    by isocitrate lyase activity.
  findings:
  - statement: >-
      aceA mutants show reduced T3SS expression and enhanced anaerobic biofilm formation, as do other
      TCA and glyoxylate cycle mutants.
    supporting_text: >-
      Biofilm formation under anaerobic conditions was significantly enhanced in the aceA mutant as well
      as in the other mutants that showed reduced PcrV expression
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read (cached). Supports the phenotype but not a regulatory role of the ICL protein in
      biofilm formation.
