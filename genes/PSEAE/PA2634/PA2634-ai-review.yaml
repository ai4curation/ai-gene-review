suggested_questions:
- question: >-
    Is the effect of aceA loss on type III secretion and biofilm formation under oxygen limitation a
    consequence of glyoxylate or succinate levels, or of carbon flux elsewhere in central metabolism?
suggested_experiments:
- description: >-
    Compare an aceA deletion with a catalytically dead ICL point mutant (active-site Cys) for T3SS
    expression and anaerobic biofilm formation, to separate enzymatic and non-enzymatic contributions.
