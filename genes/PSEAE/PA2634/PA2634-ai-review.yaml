- term:
    id: GO:1900232
    label: negative regulation of single-species biofilm formation on inanimate substrate
  evidence_type: IMP
  original_reference_id: PMID:23363478
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP. An aceA mutant formed more biofilm under anaerobic conditions, complemented in trans,
      with higher pslA transcript levels. Not an IBD seed.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Full text read. The phenotype is real, but it is shared by other central-metabolism mutants in the
      same experiment (aceE, aceK, icd-idh, glcB), so it reflects altered metabolic state rather than a
      regulatory activity of the ICL protein. The authors themselves propose an indirect route through the
      RetS/LadS signalling pathway. ICL catalyses a metabolic step; it is not shown to take part in
      regulating biofilm formation.
    supported_by:
    - reference_id: PMID:23363478
      supporting_text: >-
        Biofilm formation under anaerobic conditions was significantly enhanced in the aceA mutant as
        well as in the other mutants that showed reduced PcrV expression
    - reference_id: PMID:23363478
      supporting_text: >-
        An aceA mutant displayed enhanced biofilm formation during anaerobic growth, which suggested that
        AceA-dependent modulation of type III secretion might impinge upon the RetS/LadS signalling pathways.
