taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2634 (aceA) encodes the isocitrate lyase (ICL) of Pseudomonas aeruginosa, the first enzyme of the
  glyoxylate shunt. ICL cleaves isocitrate into succinate and glyoxylate, so that, together with malate
  synthase, acetyl-CoA can be assimilated without the carbon losses of the oxidative TCA steps. The
  PAO1 enzyme is a 531-residue member of the isocitrate lyase/PEP mutase superfamily, closer to the
  ICL of Colwellia maris than to those of other pseudomonads; its crystal structure is solved (PDB 6G1O).
  ICL is induced by acetate, citronellol and leucine and repressed by glucose or citrate, and aceA is
  required for growth on acetate, on acyclic monoterpenes of the citronellol family, on alkanols and on
  leucine, all of which are catabolised to acetyl-CoA. Under oxygen limitation aceA mutants also show
  reduced type III secretion and increased biofilm formation, effects attributed to altered central
  metabolism.
