    id: GO:0004451
    label: isocitrate lyase activity
  evidence_type: IDA
  original_reference_id: PMID:17319879
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA, one of nine seeds of the PTN000493043 IBD. ICL activity was measured in crude extracts
      of PAO1 grown on acetate, citronellol or leucine, the 60-kDa ICL band was seen only in acetate-grown
      cells, and complementation of the transposon mutant confirmed that aceA encodes the enzyme.
    action: ACCEPT
    reason: >-
      Abstract only. Activity in wild-type extracts combined with a complemented mutant ties the ICL
      activity to PA2634, and the protein carries the complete ICL family signature. Seed verdict SOUND.
      The direct part of the evidence is a crude-extract assay rather than a purified enzyme, so IMP plus
      IDA would describe it more exactly, but the term is right for the gene.
    supported_by:
    - reference_id: PMID:17319879
      supporting_text: >-
        The ICL enzyme activity in crude extracts from cultures of the PAO1 strain was induced by acetate,
        citronellol and leucine, and repressed by growth on glucose or citrate.
    - reference_id: PMID:17319879
      supporting_text: Genetic complementation further confirmed that the aceA gene encodes the ICL enzyme.
