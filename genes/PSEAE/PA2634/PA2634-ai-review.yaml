    summary: Glyoxylate cycle by IBA from PTN000493043.
    action: ACCEPT
    reason: >-
      ICL catalyses the first committed step of the glyoxylate shunt; the seeds are characterised ICLs.
      The P. aeruginosa paper concludes that acetyl-CoA from acetate, terpene and leucine catabolism is
      channelled into the shunt through this enzyme.
    supported_by:
    - reference_id: PMID:17319879
      supporting_text: >-
        These results suggest that ICL is involved in the assimilation of acetate, acyclic monoterpenes
        of the citronellol family, alkanols, and leucine, in which the final intermediary acetyl-coenzyme
        A may be channelled to the glyoxylate shunt.
