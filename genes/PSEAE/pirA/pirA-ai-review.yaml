taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PirA (PA0931) is a TonB-dependent outer-membrane receptor of Pseudomonas aeruginosa PAO1 for catecholate
  siderophores. It is a second ferric-enterobactin receptor, redundant with PfeA: only the pfeA pirA double
  mutant fails to use ferric enterobactin and several synthetic catecholate analogues. PirA also takes
  up iron chelated by host catecholamine neurotransmitters, with a preference for l-DOPA and norepinephrine,
  and its transcription is induced by catecholamines. It carries the plug domain and 22-strand beta-barrel
  of the TonB-dependent receptor family, and its crystal structure has been determined. PirA is also an
  entry route for siderophore-conjugated monobactam antibiotics.
