core_functions:
- description: >-
    Sole route to phosphatidylcholine in this organism: an inner-membrane enzyme that condenses
    exogenously supplied choline with CDP-diacylglycerol to give phosphatidylcholine and CMP.
    Because P. aeruginosa has no functional methylation route and makes no choline of its own, the
    presence of this lipid in the envelope is determined jointly by this gene and by the
    availability of choline in the environment.
