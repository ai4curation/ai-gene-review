  review:
    summary: >-
      Subcellular-location mapping from the curated record, which places the protein in the cell
      inner membrane as a multi-pass membrane protein.
    action: ACCEPT
    reason: >-
      The location is where the activity happens and rests on the protein's own features as well
      as on the record: the sequence carries eight transmembrane segments, and the substrate
      CDP-diacylglycerol is a membrane lipid, so a soluble enzyme could not perform the reaction.
      Note that the product is not confined to this membrane — PMID:12169604 finds
      phosphatidylcholine in both the inner and the outer membrane — but that is a statement about
      the lipid, not about where the enzyme acts. The more specific GO:0005887 integral component
      of plasma membrane is not added here: the eight transmembrane segments are a single line of
      ECO:0000255 sequence analysis and the curated "Multi-pass membrane protein" statement is an
      ISS restatement of the same inference, so there are not two independent lines, and nothing
      in the review turns on the distinction.
