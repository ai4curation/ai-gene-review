id: Q9HXE9
gene_symbol: pcs
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Pcs (PA3857) is the phosphatidylcholine synthase of Pseudomonas aeruginosa, a polytopic inner
  membrane enzyme of the class-I CDP-alcohol phosphatidyltransferase family with eight
  transmembrane helices. It condenses choline directly with CDP-diacylglycerol to give
  phosphatidylcholine and CMP, the bacterial route to a lipid that most prokaryotes lack. The
  organism has no working methylation route to phosphatidylcholine, so this enzyme is its only
  means of making the lipid, and because P. aeruginosa does not synthesise choline, it makes
  phosphatidylcholine only when choline is available from outside. The product reaches both the
  inner and the outer membrane.
