  knowledge_gaps:
  - gap_statement: >-
      What phosphatidylcholine is for in this organism is unknown. A study that deleted pcs in two
      backgrounds found no difference from wild type in antibiotic and antimicrobial-peptide
      sensitivity, motility, biofilm formation, surface colonisation, a mouse infection model or a
      global phenotypic microarray, so a conserved and functional biosynthetic pathway is retained
      with no measured benefit.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      How the enzyme's product reaches the outer membrane is not established. Phosphatidylcholine
      made by this inner-membrane enzyme is found in both membranes and is accessible to a
      periplasmic phospholipase D, but the transport step between the two is unidentified.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Why does P. aeruginosa keep a functional phosphatidylcholine pathway that confers no
    detectable advantage? The authors of the deletion study suggest a role specific to host
    interaction; the alternative, that the enzyme is retained for a reason unrelated to the lipid
    itself, has not been tested.
- question: >-
    Since the organism cannot make choline, when is this enzyme actually active in vivo? Host
    airway fluid and lung surfactant are choline-rich, so the answer may be that the pathway is
    effectively host-specific, which would also explain the absence of a laboratory phenotype.
- question: >-
    Is the periplasmic PC-specific phospholipase D that acts on the product part of a cycle with
    Pcs, and if so, what is the point of making the lipid and then degrading it?
suggested_experiments:
- description: >-
    Compare wild type and a pcs deletion in a choline-replete host-mimicking medium, and in
    co-culture with respiratory epithelial cells, rather than in standard laboratory media. The
    existing negative result was obtained where the enzyme's substrate is scarce, so it may say
    more about the conditions than about the gene.
- description: >-
    Follow newly made phosphatidylcholine from the inner membrane to the outer membrane with a
    pulse of labelled choline, in strains lacking candidate lipid-transport systems, to identify
    the step that moves it across.
- description: >-
    Test whether a pcs deletion alters outer-membrane permeability or vesicle formation when
    choline is supplied, since a lipid present in both membranes at a few per cent may have
    biophysical rather than signalling consequences that phenotypic screens would miss.
