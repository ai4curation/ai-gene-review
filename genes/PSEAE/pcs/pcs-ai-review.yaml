- id: PMID:12169604
  title: >-
    Pseudomonas aeruginosa synthesizes phosphatidylcholine by use of the phosphatidylcholine
    synthase pathway.
  findings:
  - statement: >-
      P. aeruginosa makes phosphatidylcholine by the Pcs route and not by the methyltransferase
      route, so this gene is the organism's only path to the lipid.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Although the pathway for synthesizing PC by use of Pcs is functional in P. aeruginosa, it
      does not appear that this organism uses the PmtA pathway for PC synthesis.
  - statement: >-
      The phosphatidylcholine the enzyme makes is not confined to the membrane the enzyme sits
      in; it is found in both membranes of the envelope.
    reference_section_type: ABSTRACT
    supporting_text: >-
      We demonstrate that the PC synthesized by P. aeruginosa PAO1 localized to both the inner and
      outer membranes, where it is readily accessible to its periplasmic, PC-specific
      phospholipase D.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Wilderman, Vasil, Martin, Murphy & Vasil 2002, J Bacteriol). The paper that
      identified the gene in this organism and showed the pathway is the functional one. Cached
      abstract-only; the abstract describes cloning and lipid analysis rather than a pcs mutant,
      which is worth noting because PseudoCAP codes its row from this paper as IMP while UniProt
      codes the same term from it as IDA. Not treated as a defect here, since the full text is
      unavailable and could contain mutant work.
- id: PMID:14663079
  title: Pathways for phosphatidylcholine biosynthesis in bacteria.
  findings:
  - statement: >-
      P. aeruginosa is among the minority of phosphatidylcholine-producing bacteria that have only
      the synthase route and not the methylation route, which is what makes this single gene
      responsible for the whole of the organism's phosphatidylcholine.
    reference_section_type: ABSTRACT
    supporting_text: >-
      However, important pathogens such as Brucella melitensis, P. aeruginosa and Borrelia
      burgdorferi seem to be exceptional as they possess only the PCS pathway for PC formation.
  - statement: >-
      The P. aeruginosa gene responsible for the activity was identified in this work, alongside
      those of other bacteria.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Genes from M. loti and L. pneumophila encoding a Pmt or a Pcs activity and the genes from
      P. aeruginosa and Borrelia burgdorferi responsible for Pcs activity have been identified.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Martinez-Morales, Schobert, Lopez-Lara & Geiger 2003, Microbiology).
      Abstract-only in the cache, but it names P. aeruginosa explicitly for both the gene
      identification and the absence of the alternative pathway, so the rows it supports can be
      checked. UniProt cites it with ECO:0000269 on the catalytic activity.
- id: PMID:22363496
  title: >-
    Absence of membrane phosphatidylcholine does not affect virulence and stress tolerance
    phenotypes in the opportunistic pathogen Pseudomonas aeruginosa.
  findings:
  - statement: >-
      In-frame deletion of pcs abolishes phosphatidylcholine entirely in two strain backgrounds,
      and expressing the gene elsewhere in the chromosome restores it.
    reference_section_type: RESULTS
    supporting_text: >-
      The PAO1 and PA14 Δpcs mutants completely lacked PC, and these defects were complemented by
      expression of the pcs gene from a separate genomic location (Fig.
  - statement: >-
      The enzyme's reaction depends on a substrate the organism does not make, so the activity
      runs only when the environment supplies choline.
    reference_section_type: ABSTRACT
    supporting_text: >-
      In all the strains tested, PC synthesis occurred only when choline is provided exogenously.
  - statement: >-
      Losing the product has no measurable cost in the laboratory, across antibiotic sensitivity,
      motility, biofilm formation, colonisation, a mouse infection model and a phenotypic
      microarray; the authors suggest the lipid matters only in specific host interactions.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Membrane PC may serve a highly specific role during P. aeruginosa interactions with its
      eukaryotic hosts based on all the clinical strains tested retaining the ability to
      synthesize it during availability of choline.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Malek, Wargo & Hogan 2012, PLoS One); full text cached. Supplies the clean
      genetic evidence for this gene — in-frame deletions in two backgrounds, complemented in
      trans — and is also the source of the two observations recorded as knowledge gaps, the
      dependence on exogenous choline and the complete absence of a mutant phenotype.
