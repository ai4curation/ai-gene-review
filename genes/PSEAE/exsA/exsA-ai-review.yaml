- term:
    id: GO:0050709
    label: negative regulation of protein secretion
  evidence_type: IMP
  original_reference_id: PMID:1655713
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP (PMID:1655713). An exsA mutant is defective in expression and secretion
      of T3SS products; the abstract states ExsA is required for (activates) the pathway.
    action: REMOVE
    reason: >-
      Wrong term for a transcriptional activator: ExsA regulates transcription of the secretion
      genes, not secretion itself, and the sign is inverted (ExsA activates). The transcriptional
      role is captured by GO:2000144 / GO:0001216. PSEUDOCAP WRONG_TERM defect.
    supported_by:
    - reference_id: PMID:1655713
      supporting_text: >-
        The ExsA gene product appeared to be required for induction of exoenzyme S synthesis
        above a low basal level.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0050709
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The IMP row codes ExsA to GO:0050709 negative regulation of protein secretion from
        PMID:1655713. ExsA is a transcriptional activator of the T3SS operons, so its molecular
        action is regulation of transcription (already annotated), not regulation of secretion,
        and the secretion defect of an exsA mutant is indirect, through loss of apparatus
        transcription. The sign is also inverted: the cited abstract states ExsA is required
        for (activates) exoenzyme S production. Suggested change: remove this term; the activation
        of T3SS gene transcription is captured by GO:2000144 / GO:0001216. PROBABLE: the 1655713
        full text was not read.
      supported_by:
      - reference_id: PMID:1655713
        supporting_text: >-
          The ExsA gene product appeared to be required for induction of exoenzyme S synthesis
          above a low basal level.
