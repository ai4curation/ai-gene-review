suggested_questions:
- question: >-
    Should bacterial transcriptional activators of secretion systems ever carry regulation-of-secretion
    terms (e.g. GO:0050709) directly, or only regulation-of-transcription terms, with the
    secretion effect left as an indirect phenotype?
suggested_experiments:
- description: >-
    Map the full ExsA regulon by ChIP-seq and RNA-seq in low- and high-calcium conditions
    to separate directly activated promoters from indirect effects.
