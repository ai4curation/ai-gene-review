id: P26993
gene_symbol: exsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ExsA (PA1713) is a sequence-specific DNA-binding transcriptional activator of the AraC/XylS
  family and the master regulator of the Pseudomonas aeruginosa type III secretion system
  (T3SS). Its C-terminal domain carries two helix-turn-helix motifs that recognise a conserved
  consensus (a GnC and a TGnnA element) centred about 51 bp upstream of the start site. Two
  ExsA monomers are recruited sequentially to adjacent sites overlapping the -35 region and
  activate transcription of the T3SS operons. The N-terminal domain mediates self-association
  and binding of the anti-activator ExsD, which holds ExsA in a DNA-binding-incompetent complex;
  ExsC, released when ExsE leaves the cell under low calcium or host-cell contact, binds ExsD
  and frees ExsA. Transcription of exsA is activated by the cAMP-dependent regulator Vfr.
