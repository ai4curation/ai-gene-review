status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2200 is a 531-aa inner-membrane protein with two predicted transmembrane
  helices flanking a periplasmic region and a C-terminal cytoplasmic EAL domain
  with an intact catalytic motif. It is a c-di-GMP-specific phosphodiesterase:
  lysates of cells overexpressing PA2200 degrade added c-di-GMP. Its EAL domain
  groups phylogenetically with those of PA2818 (Arr) and PA3285, which likewise
  lack a GGDEF domain. Overexpressing PA2200 reduces type III
  secretion-dependent killing of CHO cells, consistent with lower c-di-GMP. An
  insertion mutant has no biofilm phenotype under standard conditions. The signal
  sensed by its periplasmic region and its physiological role are unknown.
references:
- id: PMID:16477007
  title: Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases
    reveals a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: Lysates of a PA2200-overexpressing strain degraded 61% of added c-di-GMP
      (Table 1, read in PMC full text); overexpression reduced cytotoxicity.
    supporting_text: Analysis of the phenotypes of DGC and PDE mutants and overexpressing
      clones revealed that certain virulence-associated traits are controlled by multiple
      DGCs and PDEs through alterations in c-di-GMP levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IDA GO:0071111 row and PA2200's seeding of
      PTN002105365. Cached copy abstract-only; full text read on PMC (PMC1413825);
      verbatim excerpts in PA2200-notes.md. The only primary data on PA2200 found in
      the literature search.
