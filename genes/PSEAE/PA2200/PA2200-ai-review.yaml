  review:
    summary: >-
      IBA from the 4-seed PTN009140332 IBD (seeds bifA, PA2133, E. coli PdeF, arr).
      PA2200 is not a seed and has no gene-specific biofilm data; its insertion
      mutant had no biofilm phenotype.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBD is sound on bifA's evidence, and a membrane c-di-GMP PDE plausibly
      contributes to biofilm regulation. With no gene-specific support and no mutant
      phenotype, the row is kept as non-core.
