- term:
    id: GO:0046777
    label: protein autophosphorylation
  evidence_type: IDA
  original_reference_id: PMID:10671455
  qualifier: involved_in
  review:
    summary: >-
      Protein autophosphorylation. The labelled protein in the assay is the 30-kDa SucD alpha subunit
      (catalytic phosphohistidine), not SucC.
    action: REMOVE
    reason: >-
      Full text read. The labelled protein is the 30-kDa alpha subunit (SucD); the 40-kDa beta subunit
      (this gene) is not reported to be phosphorylated, so the row is on the wrong subunit. The beta subunit carries the nucleotide site and may take part in phosphorylating the alpha subunit, but it is not itself phosphorylated, so protein autophosphorylation does not describe SucC. PseudoCAP
      made four identical rows on both subunits from this paper and this row on SucC only. On SucD the
      label would be the transient catalytic phosphoenzyme intermediate, which the E. coli SucD review
      marks over-annotated and does not remove.
    supported_by:
    - reference_id: PMID:10671455
      supporting_text: >-
        A 5 μM concentration of GDP in the reaction mixture stimulated the phosphorylation of the 30-kDa
        Scs α subunit, whereas 50 μM GDP in the reaction mixture showed a significant decrease.
    - reference_id: PMID:10671455
      supporting_text: During enzymatic catalysis, Scs undergoes an intermediate Scs-α subunit phosphorylation.
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: PSEUDOCAP
      slot: DB_Object_ID
      requested_change: DELETE_ROW
      asserted_value: UniProtKB:P53593
      corrected_value: UniProtKB:Q51567
      corrected_label: SucD, the alpha subunit, which is the phosphorylated protein
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        GO:0046777 protein autophosphorylation for sucC (P53593, SCS beta) is coded IDA to PMID:10671455.
        The full text was read. The phosphorylated protein in that paper is the 30-kDa alpha subunit,
        SucD (Q51567); phosphorylation of the 40-kDa beta subunit is not reported, although both purified
        subunits were present in the reaction. QuickGO by reference (2026-11-18) shows the same four
        PseudoCAP rows from this paper on both subunits and this row on SucC only, with no GO:0046777
        row on Q51567. Deletion is requested and not a repoint to SucD, because on SucD the label is
        the transient catalytic phosphohistidine intermediate of the ligase reaction and the row would
        still be an over-annotation. PROBABLE and not CONFIRMED because whether the curator meant the
        row for the complex as a whole cannot be seen from the record. Not an IBD seed.
      supported_by:
      - reference_id: PMID:10671455
        supporting_text: >-
          A 5 μM concentration of GDP in the reaction mixture stimulated the phosphorylation of the 30-kDa
          Scs α subunit, whereas 50 μM GDP in the reaction mixture showed a significant decrease.
