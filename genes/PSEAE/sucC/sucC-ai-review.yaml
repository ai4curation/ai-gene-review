  evidence_type: IDA
  original_reference_id: PMID:10671455
  qualifier: enables
  review:
    summary: >-
      Purified SCS transferred the gamma-phosphate of ATP to GDP (and of GTP to ADP) without succinyl-CoA,
      an NDP kinase-like side reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Full text read. The reaction is real in vitro, probably through the alpha-subunit phosphohistidine,
      but its physiological relevance is unknown, and P. aeruginosa has a dedicated nucleoside diphosphate
      kinase (ndk). Much of what the paper calls "NDP kinase activity" is the normal SCS reaction run
      with different NDP acceptors, which the ligase terms already cover. In the Ndk-modulation assay
      the alpha subunit alone also formed GTP from a GDP/CDP/UDP mixture, so the beta subunit (this
      gene) was not required for that transfer. The subunits were His-tagged proteins made in E. coli,
      and the authors' control for Ndk contamination covers only the phosphate-dependent reaction, so
      a host contaminant in the alpha preparation is not excluded for the ATP-dependent transfer.
    supported_by:
    - reference_id: PMID:10671455
      supporting_text: >-
        As shown in Fig. 4 A and B, the Scs complex transferred the terminal phosphate from [γ- 32 P]ATP
        to GDP to form GTP
    - reference_id: PMID:10671455
      supporting_text: >-
        the Scs α subunit alone (lane 3) or a combination α and β subunits (lane 7) generated GTP in presence
        of GDP, CDP, and UDP
