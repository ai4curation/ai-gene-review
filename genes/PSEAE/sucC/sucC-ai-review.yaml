- term:
    id: GO:0046777
    label: protein autophosphorylation
  evidence_type: IDA
  original_reference_id: PMID:10671455
  qualifier: involved_in
  review:
    summary: >-
      Protein autophosphorylation. The labelled protein in the assay is the 30-kDa SucD alpha subunit
      (catalytic phosphohistidine), not SucC.
    action: REMOVE
    reason: >-
      Full text read. The paper detects phosphorylation of the 30-kDa alpha subunit, which is the phosphoenzyme
      intermediate of the SCS reaction. The 40-kDa beta subunit (this gene) is not reported to be phosphorylated.
      A catalytic phosphohistidine intermediate is part of the ligase reaction, not a protein autophosphorylation
      process.
    supported_by:
    - reference_id: PMID:10671455
      supporting_text: >-
        A 5 μM concentration of GDP in the reaction mixture stimulated the phosphorylation of the 30-kDa
        Scs α subunit, whereas 50 μM GDP in the reaction mixture showed a significant decrease.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      requested_change: DELETE_ROW
      asserted_value: GO:0046777
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        GO:0046777 protein autophosphorylation for sucC (P53593, SCS beta) is coded IDA to PMID:10671455.
        In that paper the phosphorylated protein is the 30-kDa alpha subunit (SucD), and the label is
        the catalytic phosphohistidine intermediate of succinyl-CoA synthetase, not a regulatory autophosphorylation.
        Delete it from SucC; for SucD it would also be better captured by the ligase activity. PROBABLE
        (full text read) because how a curator should treat the phosphoenzyme intermediate is a matter
        of interpretation. Not an IBD seed.
      supported_by:
      - reference_id: PMID:10671455
        supporting_text: >-
          A 5 μM concentration of GDP in the reaction mixture stimulated the phosphorylation of the 30-kDa
          Scs α subunit, whereas 50 μM GDP in the reaction mixture showed a significant decrease.
