suggested_questions:
- question: >-
    Does association with the 12-kDa membrane form of Ndk shift SCS nucleotide output in vivo, and does
    that contribute measurably to GTP supply for alginate synthesis?
suggested_experiments:
- description: >-
    Measure ATP versus GTP formation by purified SucCD with physiological nucleotide pools, and assess
    alginate production in a sucC mutant with complementation.
