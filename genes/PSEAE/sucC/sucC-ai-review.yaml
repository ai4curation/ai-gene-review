id: P53593
gene_symbol: sucC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  sucC (PA1588) encodes the beta subunit of succinyl-CoA synthetase (SCS, succinate--CoA ligase), which
  forms an alpha2beta2 heterotetramer with the SucD alpha subunit. SCS catalyses the only substrate-level
  phosphorylation step of the tricarboxylic acid cycle, converting succinyl-CoA, phosphate and a nucleoside
  diphosphate to succinate, CoA and a nucleoside triphosphate. The beta subunit binds succinate and the
  nucleotide and determines nucleotide specificity; the alpha subunit carries the CoA and phosphate sites
  and the phosphohistidine intermediate. The P. aeruginosa enzyme, reconstituted from separately purified
  subunits, uses ADP and GDP about equally, can also make UTP and CTP, and transfers phosphate between
  ATP and GDP. It copurifies with nucleoside diphosphate kinase, and association with the 12-kDa form
  of Ndk shifts NTP output towards GTP and UTP, which has been proposed to feed GTP into alginate synthesis
  in mucoid strains.
