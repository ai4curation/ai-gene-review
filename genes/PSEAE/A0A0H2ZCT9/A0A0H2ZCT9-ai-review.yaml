  label: Pseudomonas aeruginosa UCBPP-PA14
description: >-
  PA14_27180 (LdtPae2; annotated erfK) is a Sec-exported, periplasmic
  YkuD-family L,D-transpeptidase of Pseudomonas aeruginosa strain PA14. It is
  the OprI-anchoring enzyme of the P. aeruginosa LDT set: it covalently attaches
  the major outer-membrane lipoprotein OprI to a peptidoglycan stem, coupling
  the outer membrane to the sacculus. It is the PA14 ortholog of PAO1 PA2854 and
  shares PANTHER subfamily PTHR30582:SF24 with the P. putida module exemplar
  PP_2320.
