suggested_questions:
- question: >-
    Would the GO:0009103 IBD at PTN000602377 be better stated as GO:0009245
    lipid A biosynthetic process, which E. coli LpxA already carries by IDA and
    which names the reaction the family performs?
suggested_experiments:
- description: >-
    Determine the structure of P. aeruginosa LpxA with 3-hydroxydecanoyl-ACP to
    identify the hexapeptide-repeat residues that set the C10 hydrocarbon ruler,
    and test chain-length specificity of ruler swap mutants in vitro and by
    lipid A mass spectrometry in PAO1.
