gene_symbol: lpxA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  LpxA is the cytosolic acyl-[acyl-carrier-protein]--UDP-N-acetylglucosamine
  O-acyltransferase (EC 2.3.1.129) that catalyses the first, committed step of
  lipid A biosynthesis: transfer of a (3R)-hydroxyacyl chain from acyl-ACP to
  the 3-hydroxyl of UDP-GlcNAc. It is a homotrimer built from hexapeptide
  repeats forming a left-handed beta-helix, whose repeat register acts as a
  hydrocarbon ruler. The P. aeruginosa enzyme is specific for
  3-hydroxydecanoyl-ACP, over a thousand-fold over the 3-hydroxymyristoyl-ACP
  preferred by the Escherichia coli enzyme, which is why P. aeruginosa lipid A
  carries 10:0(3-OH) at positions 3 and 3'. Lipid A anchors the
  lipopolysaccharide in the outer membrane, so the reaction initiates both the
  lipid A and the lipopolysaccharide biosynthetic pathways.
