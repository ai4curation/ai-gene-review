- id: PMID:1904818
  title: Structural characterization of the lipid A component of Pseudomonas aeruginosa
    wild-type and rough mutant lipopolysaccharides.
  findings:
  - statement: >-
      P. aeruginosa lipid A carries ester-bound 10:0(3-OH) at positions 3 and
      3' of the GlcN disaccharide, matching the C10 specificity of the
      Pseudomonas LpxA; the analysis is purely chemical and structural, on
      purified glycolipid.
    supporting_text: >-
      3-hydroxydecanoic acid groups [10:0(3-OH)] at positions 3 and 3'
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified (Eur J Biochem 1991, abstract only in the cache; no PMC
      copy, 2026-10-29). The paper is correctly about P. aeruginosa lipid A.
      Its abstract describes only structural chemistry on purified LPS and
      mentions no enzyme or lpxA, so it is probably the wrong choice for the
      PseudoCAP IDA row (better cited to PMID:9440522); not marked MISCITED
      because the full text was not read.
- id: PMID:9440522
  title: Expression cloning of a Pseudomonas gene encoding a hydroxydecanoyl-acyl
    carrier protein-dependent UDP-GlcNAc acyltransferase.
  findings:
  - statement: >-
      The P. aeruginosa PAO1 lpxA gene was isolated by expression cloning; the
      enzyme is a 10-carbon-specific UDP-GlcNAc acyltransferase, >1000-fold
      selective for 3-hydroxydecanoyl-ACP, and complements an E. coli lpxA
      temperature-sensitive mutant.
    supporting_text: >-
      LpxA assays of extracts of this construct indicated that it is > 1,000-fold
      more selective for 3-hydroxydecanoyl-ACP than for 3-hydroxymyristoyl-ACP.
  - statement: Lipid A made by the complemented strain carries 3-hydroxydecanoate at 3 and 3'.
    supporting_text: >-
      consistent with 3-hydroxydecanoate rather than 3-hydroxymyristate at
      positions 3 and 3'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; reference [1] of UniProtKB:Q9X6P4 and the direct
      evidence for this gene product's activity. Not currently used in GOA.
