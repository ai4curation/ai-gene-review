- term:
    id: GO:0009103
    label: lipopolysaccharide biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:1904818
  qualifier: involved_in
  review:
    summary: >-
      The claim is correct, but the cited paper is a 1991 chemical and NMR
      structural analysis of P. aeruginosa lipid A whose abstract describes
      only structural methods on purified LPS and mentions no enzyme assay or
      lpxA (full text not read); the gene was cloned in 1998. The direct
      evidence for PA3644 is PMID:9440522.
    action: ACCEPT
    reason: >-
      LpxA catalyses the first step of lipid A synthesis and lipid A is the LPS
      anchor, so involvement in LPS biosynthesis holds, and the activity was
      assayed directly for the cloned PAO1 enzyme in PMID:9440522 (which
      also shows it makes the 10:0(3-OH) pattern the cited structural paper
      reports). The row is kept and its reference flagged for repointing rather
      than removed: this is a citation defect, not a wrong claim. It is the
      sole seed of the GO:0009103 IBD at PTN000602377.
    supported_by:
    - reference_id: PMID:9440522
      supporting_text: >-
        we here report the isolation of the lpxA gene of Pseudomonas aeruginosa
    - reference_id: PMID:9440522
      supporting_text: >-
        A plasmid (pGD3) containing the 1.3-kb SalI-PstI fragment complemented
        E. coli RO138, a temperature-sensitive mutant harboring lpxA2.
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: PSEUDOCAP
      slot: DB:Reference
      requested_change: REPOINT
      asserted_value: PMID:1904818
      corrected_value: PMID:9440522
      corrected_label: >-
        Dotson et al. 1998, Expression cloning of a Pseudomonas gene encoding a
        hydroxydecanoyl-acyl carrier protein-dependent UDP-GlcNAc
        acyltransferase
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        involved_in GO:0009103 lipopolysaccharide biosynthetic process (IDA) on
        PA3644 cites Kulshin et al. 1991 (PMID:1904818), a chemical,
        GC-MS and NMR structural characterisation of lipid A purified from
        P. aeruginosa strains. Its abstract names only chemical, GC-MS, mass
        spectrometric and NMR methods on purified lipopolysaccharide, and
        mentions no enzyme assay and no lpxA; the paper also predates the
        cloning of the gene (1998). We have read only the abstract, so an
        enzyme measurement in the full text cannot be excluded, but the paper is
        unlikely to be direct evidence for this gene product. The intended
        reference is probably Dotson et al. 1998 (PMID:9440522), which
        cloned PAO1 lpxA, assayed the enzyme as a 10-carbon-specific UDP-GlcNAc
        acyltransferase and complemented an E. coli lpxA mutant; it is
        reference [1] of UniProtKB:Q9X6P4. Please repoint the reference. Note
        that this row is the only seed of the PANTHER IBD for GO:0009103 at
        PTN000602377, which propagates to 24 LpxA-family leaves.
      supported_by:
      - reference_id: PMID:1904818
        supporting_text: >-
          was investigated using chemical analysis, methylation analysis
      - reference_id: PMID:9440522
        supporting_text: >-
          we here report the isolation of the lpxA gene of Pseudomonas aeruginosa
