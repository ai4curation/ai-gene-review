description: TssC1 (HsiC1) is a sheath component of the Pseudomonas aeruginosa H1-T6SS. With TssB1 it forms the contractile sheath that assembles into cogwheel-like tubules with 12-fold symmetry around the Hcp1 tube; sheath contraction provides the energy for effector delivery.
