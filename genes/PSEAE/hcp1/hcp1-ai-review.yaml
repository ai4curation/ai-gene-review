id: Q9I747
gene_symbol: hcp1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: Hcp1 is the tube-forming and secreted hallmark component of the Pseudomonas aeruginosa H1-T6SS. Hexameric Hcp1 rings stack into the inner tube within the contractile TssB1-TssC1 sheath, are expelled on firing, and are actively secreted during chronic infection, making Hcp1 the classic readout of H1-T6SS activity.
