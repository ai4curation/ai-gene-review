    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Hcp1 is actively secreted; extracellular Hcp1 is the hallmark readout of H1-T6SS firing.
    action: KEEP_AS_NON_CORE
    reason: Secretion to the extracellular region is a defining consequence of Hcp1's expulsion with the tube, but its core role is as the structural inner-tube subunit rather than an extracellular effector.
    supported_by:
    - reference_id: file:PSEAE/hcp1/hcp1-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: Secreted
