    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:18310321
  qualifier: enables
  review:
    summary: Hcp1 self-associates into hexameric rings that stack into the inner tube.
    action: KEEP_AS_NON_CORE
    reason: The experimentally observed Hcp1 self-interaction underlies hexameric ring and tube formation, but the informative core molecular function is the structural (tube) role; the homo-oligomerization is retained as non-core.
    supported_by:
    - reference_id: file:PSEAE/hcp1/hcp1-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: Hexamer. Three hcp1 monomers form two closely related hexameric rings with a 40 Angstrom internal diameter
