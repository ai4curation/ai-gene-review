      defect under zinc depletion, an indirect consequence of lost zinc uptake rather than a response
      to zinc.
- id: PMID:26290475
  title: ZnuA and zinc homeostasis in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Delta-znuA cells accumulate about 60% less zinc (ICP-MS); other metals are essentially unaffected.
    supporting_text: >-
      Metal accumulation analyses revealed a significant 59.6% decrease in cellular Zn2+ due to loss of
      the SBP
  - statement: Recombinant apo-ZnuA binds Zn2+ with nanomolar affinity.
    supporting_text: >-
      titration with increasing concentrations of ZnuA revealed a KD for Zn2+ of 22.6 ± 6.4 nM
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Source of the PseudoCAP IMP zinc ion transport row (seed of PTN000767207) and the
      IDA zinc ion binding row; both are directly supported (whole-cell ICP-MS of the deletion mutant;
      KD and stoichiometry of purified protein).
