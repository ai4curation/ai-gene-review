taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5498 encodes ZnuA, the periplasmic solute-binding protein (cluster A-I, solute-binding protein family
  9) of the ZnuABC ATP-binding cassette zinc importer of Pseudomonas aeruginosa. It has a Sec signal peptide
  and binds Zn2+ with nanomolar affinity (KD about 23 nM, roughly 1.6 Zn2+ per protein) and high selectivity,
  delivering it to the ZnuB permease for ATP-driven (ZnuC) uptake across the inner membrane. A znuA deletion
  lowers cellular zinc by about 60% without changing other metals, and znuABC mutants grow poorly under
  zinc limitation. znuA is repressed by zinc through the Fur-family regulator Zur (Np20, PA5499), whose
  gene lies in the adjacent zur-znuC-znuB operon.
