suggested_questions:
- question: >-
    Which pathways supply the remaining ~40% of zinc in a znuA mutant, and do they share ZnuB/ZnuC?
suggested_experiments:
- description: >-
    Measure 65Zn uptake kinetics in znuA, znuB, znuC and combined mutants of the zinc-limitation-induced
    import systems to partition uptake among them.
