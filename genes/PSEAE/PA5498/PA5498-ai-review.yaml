      Abstract read. E. coli work defining ZnuABC as an ATP-energised high-affinity zinc uptake system;
      basis of the PseudoCAP ISS row. E. coli ZnuA (P39172) is the other seed of PTN000767207.
existing_annotations:
- term:
    id: GO:0000006
    label: high-affinity zinc transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:9680209
  qualifier: enables
  supporting_entities:
  - UniProtKB:P39172
  review:
    summary: >-
      PseudoCAP ISS to E. coli ZnuA for high-affinity zinc transmembrane transporter activity.
    action: MODIFY
    reason: >-
      ZnuA is the periplasmic binding protein of the ZnuABC importer: it binds Zn2+ and hands it to ZnuB,
      but does not itself move zinc across a membrane. The transmembrane transporter activity belongs
      to the ZnuABC complex, so the appropriate term is ABC-type zinc transporter activity (GO:0015633)
      with a contributes_to qualifier.
    proposed_replacement_terms:
    - id: GO:0015633
      label: ABC-type zinc transporter activity
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: PSEUDOCAP
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables GO:0000006
      corrected_value: contributes_to GO:0015633
      corrected_label: ABC-type zinc transporter activity
      confidence: PROBABLE
      explanation: >-
        A periplasmic solute-binding protein does not by itself enable transmembrane transport; it contributes
        to the activity of the ZnuABC complex. Not an IBD seed.
      supported_by:
      - reference_id: PMID:26290475
        supporting_text: >-
