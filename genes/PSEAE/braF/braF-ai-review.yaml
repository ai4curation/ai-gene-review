- term:
    id: GO:0015192
    label: L-phenylalanine transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000656921
  - UniProtKB:P0A9S7
  review:
    summary: >-
      Phenylalanine has not been reported as a substrate of P. aeruginosa
      LIV-I.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IBA comes from E. coli LivG, whose LivHMGF core works with two
      binding proteins (LivJ and LivK). Substrate specificity in this system is
      set by the binding protein. P. aeruginosa has the single BraC (LIVAT)
      binding protein. Its binding specificity, and the substrate range of
      LIV-I in cells and in proteoliposomes, have been characterised as
      Leu/Ile/Val plus Ala/Thr, with no report of Phe. The phenylalanine
      function probably reflects the E. coli binding-protein repertoire rather
      than the ATPase lineage.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:P0A9S7
        source_label: E. coli LivG
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The E. coli phenylalanine function depends on the E. coli
          binding-protein repertoire. P. aeruginosa LIV-I specificity is
          characterised as LIVAT.
    supported_by:
    - reference_id: PMID:1400443
      supporting_text: >-
        Alanine and threonine in addition to branched-chain amino acids were
        transported by the proteoliposomes, reflecting the substrate
        specificity of the BraC protein.
    - reference_id: PMID:6767701
      supporting_text: >-
        The binding activity of the protein was specific for the branched-chain
        amino acids.
