- id: PMID:18833300
  title: High-throughput phenotypic characterization of Pseudomonas aeruginosa membrane
    transport genes.
  findings:
  - statement: >-
      Tn5 mutants in each bra operon gene (PA1070-PA1074) grow less well on
      alanine, and some also on L-valine and L-isoleucine, in Biolog and
      minimal-plate assays.
    supporting_text: >-
      In this work, mutants for each of these genes were found to be defective
      in Alanine metabolism, while utilization of L-Valine and L-Isoleucine was
      also altered in some cases
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified (Johnson et al. 2008, PLoS Genet, PMC2542419); full
      text read. A high-throughput growth-phenotype screen of PathoGenesis
      Mini-Tn5 transporter mutants, mostly in strain PAK, including PA1071.
      PA1071 shows only partial (+/-) growth defects (Table 2). No uptake
      assays were done. The L-Ile, L-Val and L-Ala PseudoCAP IMP rows are
      indirect but corroborated by earlier biochemistry. The D-Ala row is not
      corroborated.
- id: PMID:1400443
  title: Solubilization and reconstitution of the Pseudomonas aeruginosa high affinity
    branched-chain amino acid transport system.
  findings:
  - statement: >-
      Reconstituted BraCDEFG imports leucine in an ATP-dependent way, needs all
      five components, carries alanine and threonine as well, and hydrolyses ATP
      in a transport-coupled way.
    supporting_text: >-
      In this reconstituted system, leucine transport was completely dependent
      on the presence of all five Bra components and on ATP loaded internally
      to the proteoliposomes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Hoshino, Kose-Terai and Sato 1992, J Biol Chem). This is
      the direct biochemical evidence for the LIV-I complex. Abstract only.
