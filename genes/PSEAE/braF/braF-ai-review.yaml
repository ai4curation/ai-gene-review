suggested_questions:
- question: >-
    Is D-alanine a genuine LIV-I substrate (bound by BraC and imported by
    BraCDEFG), or is the weak D-alanine growth defect of bra mutants indirect?
    The answer decides whether the D-alanine IBD at PTN000656921, seeded only
    by PA1071 and PA4910 from one screen, should stand.
- question: >-
    Should substrate-specific process IBDs (L-alanine, L-valine, L-isoleucine
    import) sit at PTN000656921? The node spans several paralogous HAAT ATPases
    per genome (seven in Bradyrhizobium japonicum), and in this family the
    substrate is set by the partner binding protein, not by the ATPase.
suggested_experiments:
- description: >-
    Radiolabelled D-alanine uptake in wild-type and braC or braF deletion
    strains, and D-alanine competition for leucine binding to purified BraC.
    This would test whether D-alanine is a LIV-I substrate.
  experiment_type: transport assay
