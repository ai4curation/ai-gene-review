id: P21629
gene_symbol: braF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  BraF is one of the two nucleotide-binding (ATPase) subunits of LIV-I, the
  high-affinity, Na(+)-independent branched-chain amino acid ABC importer of
  Pseudomonas aeruginosa, encoded by the braC-braD-braE-braF-braG operon. BraF
  is a LivG-type ABC ATPase, with a Walker A ATP-binding motif and a C-terminal
  extension characteristic of branched-chain amino acid transporters. It
  associates peripherally with the cytoplasmic face of the inner membrane,
  where it pairs with BraG and binds the BraD/BraE permeases. With the
  periplasmic binding protein BraC, the complex couples ATP hydrolysis to the
  uptake of L-leucine, L-isoleucine and L-valine and, with lower affinity,
  L-alanine and L-threonine. All five Bra components are required for
  transport in reconstituted proteoliposomes.
