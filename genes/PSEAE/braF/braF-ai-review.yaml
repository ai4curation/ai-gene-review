  review:
    summary: >-
      Valine is a substrate of the BraCDEFG (LIV-I) importer, of which BraF is
      the ATPase subunit.
    action: ACCEPT
    reason: >-
      The IBA is seeded by E. coli LivG at the LivG node. LIV-I in
      P. aeruginosa carries valine, as shown by uptake in cells and by binding
      to the periplasmic BraC protein. The transporter activity belongs to the
      whole BraCDEFG complex, to which BraF contributes the ATPase. BraF is
      inside the clade that inherited the function, and no evidence says the
      function diverged in this gene.
    supported_by:
    - reference_id: PMID:113383
      supporting_text: >-
        The former system seemed to serve not only for the entry of leucine,
        isoleucine, and valine, but also for that of alanine and threonine,
        although less effectively.
    - reference_id: PMID:1400443
      supporting_text: >-
        leucine transport was completely dependent on the presence of all five
        Bra components and on ATP loaded internally to the proteoliposomes
