taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FabV (PA2950) is the triclosan-resistant enoyl-[acyl-carrier-protein] reductase of Pseudomonas
  aeruginosa, a member of the TER/FabV family unrelated in sequence to FabI. It catalyses the NADH-dependent
  reduction of trans-2-enoyl-ACP to acyl-ACP, the last step of each elongation cycle of type II fatty
  acid synthesis, acting on enoyl-ACPs from C4 to C16; it also reduces crotonyl-CoA, but much more
  slowly. P. aeruginosa has a second, triclosan-sensitive enoyl-ACP reductase (FabI), and FabV is
  the main one: its deletion lowers enoyl-ACP reductase activity in cell extracts, slows growth,
  shifts the membrane towards unsaturated fatty acids, and makes the bacterium more than 2000-fold
  more sensitive to triclosan. Through its supply of acyl-ACPs, loss of FabV also reduces acyl-homoserine
  lactone quorum-sensing signal production, swarming and virulence-factor output.
