- term:
    id: GO:0004318
    label: enoyl-[acyl-carrier-protein] reductase (NADH) activity
  evidence_type: IMP
  original_reference_id: PMID:27965638
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IMP, a PTN002206122 seed row. Enoyl-ACP reductase activity in cell-free extracts
      of the fabV deletion strain fell to about a third of wild type and rose on complementation.
    action: ACCEPT
    reason: >-
      Full text read. Loss of activity in a mutant lysate would alone be weak evidence for the gene's
      own activity, but here the activity lost is exactly the one shown for the purified enzyme (PMID:19933806),
      the residual activity is explained by FabI, and complementation restores activity. The term
      is correct for FabV; seed verdict SOUND.
    supported_by:
    - reference_id: PMID:27965638
      supporting_text: >-
        The ENR activity (in μmol/min per mg extract protein) in cell-free extract of PAO170 was
        0.175 ± 0.006, and was lower than that in the cell-free extract of wild-type strain PAO1
        (0.478 ± 0.032).
