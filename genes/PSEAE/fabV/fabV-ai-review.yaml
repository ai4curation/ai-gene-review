suggested_questions:
- question: >-
    How are enoyl-ACP intermediates partitioned between FabV and FabI in P. aeruginosa, and does
    either isozyme favour particular chain lengths or the unsaturated branch?
suggested_experiments:
- description: >-
    Measure kcat/Km of purified FabV and FabI on enoyl-ACPs of each chain length, and profile acyl-ACP
    pools in fabV and fabI mutants by mass spectrometry.
