suggested_questions:
- question: Does PA2105, the second PTHR42811:SF5 paralog that sits next to the putative cysteine synthase
    PA2104, have serine O-acetyltransferase activity under any condition, or a different acceptor?
- question: What oligomeric state does PaCysE adopt in vivo, given the missing N-terminal helices that
    stabilise the enteric hexamer?
suggested_experiments:
- description: Purify PA2105 and assay acetyl transfer to L-serine and other acceptors; test whether PA2105
    overexpression rescues the PA3816 deletion auxotrophy.
  experiment_type: enzyme assay and genetic complementation
- description: Determine the PaCysE oligomeric state by SEC-MALS or analytical ultracentrifugation at
    physiological concentrations.
  experiment_type: biophysical characterization
