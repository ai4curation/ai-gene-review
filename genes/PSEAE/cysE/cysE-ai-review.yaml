  title: 'Serine Acetyltransferase from Pseudomonas aeruginosa: Distinctive Features, Pleiotropic Roles,
    and Therapeutic Potential.'
  findings:
  - statement: PA3816 is the major, non-redundant serine acetyltransferase of P. aeruginosa.
    supporting_text: In contrast, the auxotrophy of the ΔcysE strain indicates that no alternative SAT
      activity is expressed at levels sufficient to compensate for the loss of PaCysE in the tested conditions
    reference_section_type: DISCUSSION
  - statement: PaCysE has a higher Km for L-serine than E. coli CysE.
    supporting_text: while the Km for AcCoA is comparable, the Km for L-Ser is one order of magnitude
      higher, with the absence of substrate inhibition observed in other bacterial CysEs
    reference_section_type: RESULTS
  - statement: Purified PaCysE and PaCysK show negligible reciprocal effects on enzyme activity under
      the tested conditions.
    supporting_text: The results of the enzyme characterization in vitro suggest that PaCysE activity
      is not regulated by CysK
    reference_section_type: RESULTS
  - statement: PA2105 is a second PTHR42811 acetyltransferase in PAO1.
    supporting_text: PA2105 encodes a probable acetyltransferase and interestingly co-occurs with a probable
      cysteine synthase (PA2104).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Native deletion/complementation uses PAO1 PA3816; recombinant enzymology
      uses the explicitly specified Q9HXI6 sequence, codon optimized and N-terminal Strep-tagged in E.
      coli BL21 Tuner. Reciprocal kinetic assays show negligible effects of PaCysE and PaCysK on each
      other. This argues against the canonical functional CSC; it is not a direct proof that no physical
      interaction ever occurs in cells. Structural comparisons and oligomeric predictions are not a solved
      native PaCysE assembly.
