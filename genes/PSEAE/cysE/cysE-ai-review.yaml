core_functions:
- description: Catalyses acetyl transfer from acetyl-CoA to L-serine, forming O-acetyl-L-serine as the
    committed, non-redundant step of de novo cysteine biosynthesis in P. aeruginosa; purified assays show
    negligible reciprocal kinetic effects of CysE and CysK, arguing against the canonical regulatory complex
    without proving absence of every interaction in vivo.
