  label: Pseudomonas aeruginosa PAO1
description: 'CysE (PA3816, PaCysE) is the major serine O-acetyltransferase of Pseudomonas aeruginosa.
  It transfers the acetyl group of acetyl-CoA to L-serine to form O-acetyl-L-serine, the substrate of
  the CysK and CysM O-acetylserine sulfhydrylases. Deletion of PA3816 causes cysteine auxotrophy on sulfate
  or thiosulfate, so it carries a non-redundant step of de novo cysteine biosynthesis; downstream phenotypes
  (oxidative-stress sensitivity, altered virulence factors, biofilm, reduced virulence) are rescued by
  cysteine. PaCysE is a truncated CysE isoform: it lacks four N-terminal helices that stabilise the hexamer
  in enteric enzymes, has a higher Km for L-serine and weaker L-cysteine feedback inhibition than E. coli
  CysE, and, lacking the C-terminal isoleucine anchor, shows no detectable CysK-dependent kinetic modulation
  in the purified assays. The related acetyltransferase PA2105 does not compensate for its loss under
  the tested conditions.'
