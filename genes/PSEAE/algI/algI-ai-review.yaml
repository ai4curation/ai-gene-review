id: Q51392
gene_symbol: algI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: AlgI is an integral inner-membrane protein of Pseudomonas aeruginosa belonging
  to the membrane-bound acyltransferase family. It is required for O-acetylation of mannuronate
  residues in alginate and associates with the periplasmic acetylation machinery through AlgJ.
  Its conserved family placement supports an acyl-transfer function across the inner membrane.
  A proposed mechanism transfers cytoplasmic acetyl groups through an AlgI acyl-shuttle intermediate
  to AlgJ and ultimately AlgX, but the native donor, covalent intermediate and complete chemical
  relay have not been demonstrated directly for AlgI.
