- term:
    id: GO:0070458
    label: cellular detoxification of nitrogen compound
  evidence_type: IMP
  original_reference_id: PMID:25384477
  qualifier: involved_in
  review:
    summary: >-
      A chromosomal nmoA deletion is more sensitive to 3-nitropropionate and no
      longer releases nitrite in proportion to the 3-NPA supplied, so NmoA
      itself performs the step that removes the nitronate from the cell.
    action: NEW
    reason: >-
      The gene product does the work of the process: it is the enzyme that
      destroys the nitronate, and the nitrite released in vivo is the product
      of its own reaction, so this is participation rather than mere necessity.
      The process term is absent from GOA for this gene, although UniProt
      carries the Detoxification keyword and the FUNCTION statement.
    supported_by:
    - reference_id: PMID:25384477
      supporting_text: >-
        Finally, deletion of the nmoA gene resulted in an increased sensitivity
        of the cells to 3-nitropropionic acid (3-NPA), confirming the role of
        the nitronate monooxygenase protein in the detoxification of nitronate.
    - reference_id: PMID:25384477
      supporting_text: >-
        The Δ nmoA mutant was clearly less able to grow in the presence of high
        concentrations of P3N.
