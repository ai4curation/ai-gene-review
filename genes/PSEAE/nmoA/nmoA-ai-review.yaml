gene_symbol: nmoA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  NmoA (PA4202) is a 351-residue FMN-dependent class I nitronate monooxygenase
  with a TIM-barrel fold. It uses molecular oxygen to oxidise anionic alkyl
  nitronates, with propionate 3-nitronate (P3N) as its best substrate (kcat
  about 1300 s-1, Km 110 uM), yielding malonate semialdehyde plus nitrite and
  nitrate. One FMN is bound tightly but non-covalently per subunit, and a
  flavin semiquinone forms as a catalytic intermediate; neutral nitroalkanes
  are at best very poor substrates. The gene is repressed by the divergently
  encoded LysR-family regulator NmoR, and a deletion mutant is less tolerant of
  3-nitropropionate, consistent with a role in nitronate detoxification and in
  the catabolic route by which pseudomonads use 3-nitropropionate as a nitrogen
  and carbon source.
