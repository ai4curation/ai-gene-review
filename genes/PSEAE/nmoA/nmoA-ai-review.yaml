- id: PMID:25002579
  title: The combined structural and kinetic characterization of a bacterial nitronate
    monooxygenase from Pseudomonas aeruginosa PAO1 establishes NMO class I and II.
  findings:
  - statement: >-
      Purified PA4202 oxidises propionate 3-nitronate and other alkyl
      nitronates but not nitroalkanes, with P3N the best substrate at pH 7.5.
    supporting_text: >-
      The enzyme is active on P3N and other alkyl nitronates, but cannot
      oxidize nitroalkanes.
  - statement: >-
      The enzyme binds FMN tightly and non-covalently and its 1.44 A structure
      shows a TIM barrel fold; four shared motifs define class I NMO.
    supporting_text: >-
      Absorption spectroscopy, mass spectrometry, and x-ray crystallography
      demonstrate a tightly, non-covalently bound FMN in the active site of the
      enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Biol Chem 2014, PMC4156069); abstract only in the
      cache, but the abstract itself states the cloning of pa4202, the
      purification and the kinetic characterisation, which is what the
      PseudoCAP IDA asserts.
- id: PMID:25384477
  title: Pseudomonas aeruginosa LysR PA4203 regulator NmoR acts as a repressor of
    the PA4202 nmoA gene, encoding a nitronate monooxygenase.
  findings:
  - statement: >-
      Deletion of nmoA reduces tolerance of 3-nitropropionate and abolishes the
      dose-dependent nitrite release seen in wild type, supporting a
      detoxification role in vivo.
    supporting_text: >-
      Finally, deletion of the nmoA gene resulted in an increased sensitivity of
      the cells to 3-nitropropionic acid (3-NPA), confirming the role of the
      nitronate monooxygenase protein in the detoxification of nitronate.
  - statement: nmoA is directly repressed by the LysR-family regulator NmoR (PA4203).
    supporting_text: >-
      Here we show that PA4203 ( nmoR ) represses its own transcription and the
      expression of nmoA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and PubMed-verified (J Bacteriol 2015, PMC4336338); the
      source of the in vivo evidence for the detoxification role. Not used by
      any GOA row for this gene.
- id: PMID:20382807
  title: Growth of bacteria on 3-nitropropionic acid as a sole source of carbon, nitrogen,
    and energy.
  findings:
  - statement: >-
      Bacteria grow on 3-nitropropionate and P3N as sole carbon, nitrogen and
      energy source; the denitration step is catalysed by a purified
      monooxygenase whose gene belongs to the group previously annotated as
      2-nitropropane dioxygenases.
    supporting_text: >-
      Stoichiometry of the reaction indicates that the enzyme is a
      monooxygenase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Appl Environ Microbiol 2010, PMC2876434); abstract only.
      Establishes the pathway and the P3N monooxygenase family, but the enzyme
      purified there is from the 3NPA-degrading isolates, not PAO1, so it
      supports the pathway context rather than a claim about NmoA itself.
- id: PMID:31075192
  title: Kinetic Investigation of a Presumed Nitronate Monooxygenase from Pseudomonas
    aeruginosa PAO1 Establishes a New Class of NAD(P)H:Quinone Reductases.
  findings:
  - statement: >-
      Purified PA0660, a leaf of the same PAINT node as NmoA, has no nitronate
      monooxygenase activity and is instead an NAD(P)H:quinone reductase.
    supporting_text: >-
      Despite its annotation, PA0660 did not exhibit nitronate monooxygenase
      activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Biochemistry 2019); abstract only. Used here only for
      the node-level assessment, as evidence that the PTN001284536 clade is
      functionally heterogeneous.
core_functions:
- description: >-
    FMN-dependent class I nitronate monooxygenase: oxidises anionic alkyl
    nitronates, preferentially propionate 3-nitronate, using molecular oxygen,
    releasing malonate semialdehyde with nitrite and nitrate. In P. aeruginosa
    this keeps the intracellular nitronate level low and provides the entry
    step for 3-nitropropionate catabolism.
  molecular_function:
    id: GO:0018580
    label: nitronate monooxygenase activity
  directly_involved_in:
  - id: GO:0070458
    label: cellular detoxification of nitrogen compound
  supported_by:
  - reference_id: PMID:25002579
    supporting_text: >-
      The enzyme is active on P3N and other alkyl nitronates, but cannot
      oxidize nitroalkanes.
  - reference_id: PMID:25384477
    supporting_text: >-
      Finally, deletion of the nmoA gene resulted in an increased sensitivity of
      the cells to 3-nitropropionic acid (3-NPA), confirming the role of the
      nitronate monooxygenase protein in the detoxification of nitronate.
suggested_questions:
- question: >-
    Does NmoA use free FMNH2 as a co-substrate (GO:0036434) or only its own
    tightly bound FMN, and should the two nitronate monooxygenase terms be
    distinguished on this gene?
- question: >-
    Can P. aeruginosa PAO1 itself grow on 3-nitropropionate as a nitrogen or
    carbon source, or is NmoA's role confined to keeping the intracellular
    nitronate level low?
suggested_experiments:
- description: >-
    Growth and metabolite tests of wild type and delta-nmoA PAO1 on
    3-nitropropionate as sole nitrogen source, with quantification of malonate
    semialdehyde, nitrite and nitrate, to distinguish a catabolic from a purely
    protective role.
- description: >-
    Side-by-side assay of NmoA and the other PTHR42747 members from the same
    PAINT node (for example yrpB, SO_0471, Rv2781c) on alkyl nitronates and on
    NAD(P)H plus quinones, to establish how far across the clade class I NMO
    activity extends and so where the IBD belongs.
