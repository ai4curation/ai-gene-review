- term:
    id: GO:0018580
    label: nitronate monooxygenase activity
  evidence_type: IDA
  original_reference_id: PMID:25002579
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA and the sole seed of the IBD at PTN001284536. PA4202 was
      cloned, expressed, purified and kinetically characterised on P3N and
      other alkyl nitronates.
    action: ACCEPT
    reason: >-
      A direct activity assay on the purified gene product, not a mutant
      phenotype: the enzyme turns over P3N with kcat 1300 s-1 and Km 110 uM,
      carries tightly bound FMN, and forms a flavosemiquinone intermediate; the
      1.44 A structure resolves the FMN site. The seed is therefore sound and
      the IBD is justified for a node of class I NMOs.
    supported_by:
    - reference_id: PMID:25002579
      supporting_text: >-
        Here, we have cloned and expressed the gene pa4202 of Pseudomonas
        aeruginosa PAO1, purified the resulting protein, and characterized it.
    - reference_id: PMID:25002579
      supporting_text: >-
        Thus, PA4202 is the first NMO identified and characterized in bacteria.
