    summary: >-
      A second IBD on the same node, seeded only by plant and rat PLDs that
      hydrolyse the phospholipids of their own membranes in lipid turnover and
      signalling. PldA is a secreted T6SS toxin whose substrate is the
      phosphatidylethanolamine of a target cell; it is not part of
