core_functions:
- description: >-
    Eukaryotic-type phospholipase D with two HKD active sites. PldA hydrolyses
    glycerophospholipid head groups - choline from phosphatidylcholine in
    vitro, phosphatidylethanolamine in target cells - and is delivered by a
    VgrG4b-dependent H2-T6SS into competing bacteria, where accumulation of
    phosphatidic acid destroys the membrane.
  molecular_function:
    id: GO:0004630
    label: D-type glycerophospholipase activity
  supported_by:
  - reference_id: PMID:23552891
    supporting_text: Consistent with prior observations, Tle5PA catalyzes the release
      of choline from phosphatidylcholine (PC), in a manner dependent upon a predicted
      catalytic histidine residue (His855)
  - reference_id: PMID:36216841
    supporting_text: As noted, as a member of the PLD family, PldA possesses the highly
      conserved HxK(xxxx)nD consensus sequence.
suggested_questions:
- question: >-
    Does PldA have any substrate in the producing cell's own periplasm, where
    calcium-regulated activity was detected, or is the periplasmic pool simply
    an export intermediate held in check by Tli5a?
- question: >-
    Should GO offer a process term for delivery of an antibacterial effector
    into a target cell, so that T6SS toxins need not be annotated to the
    endogenous metabolic process that matches their chemistry?
suggested_experiments:
- description: >-
    Quantify the phospholipid composition of a prey strain intoxicated by PldA
    versus PldB, side by side, to test whether the two effectors have distinct
    head-group preferences; pair with active-site mutants of each (His167/His855
    for PldA, the predicted 642/644/649 site for PldB).
