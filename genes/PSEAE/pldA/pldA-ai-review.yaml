gene_symbol: pldA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PldA (PA3487, also called Tle5a) is a 1099-residue eukaryotic-type
  phospholipase D of P. aeruginosa. It carries two HxKxxxxD (HKD) catalytic
  motifs, and its crystal structure shows an active-site arrangement closer to
  eukaryotic than to other bacterial phospholipases D. Purified PldA hydrolyses
  the head group of phosphatidylcholine, releasing choline, and it tolerates a
  range of phospholipid substrates; in target cells its principal substrate is
  phosphatidylethanolamine, whose conversion to phosphatidic acid destabilises
  the membrane and kills the cell. PldA is a type VI secretion system effector:
  release depends on its cognate spike protein VgrG4b and on the H2-T6SS, and
  the producing cell is protected by the adjacent immunity protein Tli5a
  (PA3488). Activity has also been detected in the periplasm of the producing
  cell, and the gene is present in only some strains, consistently linked to a
  vgr gene, which indicates horizontal acquisition. Its biological role is
  antagonism of competing bacteria, with a reported contribution to persistence
  in chronic pulmonary infection.
references:
- id: PMID:24832454
  title: A Pseudomonas aeruginosa type VI secretion phospholipase D effector targets
    both prokaryotic and eukaryotic cells.
  findings:
  - statement: The paper characterises PldB, the paralogous phospholipase D effector
      encoded at PA5089, together with its three immunity proteins.
    supporting_text: Here we describe the characterization of a P. aeruginosa H3-T6SS-dependent
      phospholipase D effector, PldB, and its three tightly linked cognate immunity
      proteins.
  reference_review:
    relevance: LOW
    correctness: WRONG_IDENTIFIER
    review_notes: >-
      Cited by the PseudoCAP GO:0004630 IMP row on PA3487, but the abstract states
      that the characterised effector is PldB, which is PA5089 - a separate gene
      that carries the same PseudoCAP row with the same PMID. The claim being made
      about PldA is nonetheless true on other references (PMID:11136451,
      PMID:23552891), so this is a misdirected citation rather than a wrong
      annotation. Marked from the abstract only, so the defect is filed as
      PROBABLE rather than CONFIRMED.
- id: PMID:11136451
  title: Genetic and biochemical analyses of a eukaryotic-like phospholipase D of
    Pseudomonas aeruginosa suggest horizontal acquisition and a role for persistence
    in a chronic pulmonary infection model.
  findings:
  - statement: Cloned pldA expresses a ~116 kDa protein with calcium-regulated phospholipase
      D activity localised to the periplasm.
    supporting_text: The pldA gene was cloned and shown to express an approximately
      116 kDa protein with calcium-regulated PLD activity that is localized to the
      periplasm.
  - statement: pldA is absent from some strains and is always linked to a vgr gene,
      suggesting horizontal acquisition.
    supporting_text: When present, pldA is always linked to an open reading frame
      (ORF), ORF4, and a gene (vgrA1) encoding a protein homologous to Vgr from Escherichia
      coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The original genetic and biochemical description of PldA itself. Abstract
      only in the cache, but the abstract states the PLD activity, the size and
      the periplasmic localisation directly. This is the reference the PseudoCAP
      row should have cited, alongside PMID:23552891.
- id: PMID:23552891
  title: Diverse type VI secretion phospholipases are functionally plastic antibacterial
    effectors.
  findings:
  - statement: PldA is Tle5PA; purified protein releases choline from phosphatidylcholine
      and the activity depends on the catalytic histidine His855.
    supporting_text: Consistent with prior observations, Tle5PA catalyzes the release
      of choline from phosphatidylcholine (PC), in a manner dependent upon a predicted
      catalytic histidine residue (His855)
  - statement: In target cells the effector acts mainly on phosphatidylethanolamine,
      and death follows accumulation of phosphatidic acid.
    supporting_text: Taken together, these data strongly suggest that Tle5PA-imposed
      cell death occurs through PA accumulation via PLD activity, primarily directed
      against PE.
  - statement: The Tle5 family is defined by dual HxKxxxxD motifs of phospholipase
      D enzymes.
    supporting_text: Four of the families (Tle1-4) exhibit the GxSxG motif common
      in esterases and many lipases, while the fifth (Tle5) possesses dual HxKxxxxD
      motifs found in PLD enzymes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Direct enzymology on PldA (as Tle5PA), with the catalytic
      histidine requirement and the in vivo lipid analysis, plus the demonstration
      that it is an antibacterial T6SS effector. The His855 mutation matches the
      second HKD active site of Q9HYC2 (855/857/862), which confirms the protein
      identity independently of the name used.
- id: PMID:36216841
  title: Structural insights into PA3488-mediated inactivation of Pseudomonas aeruginosa
    PldA.
  findings:
  - statement: The PldA structure shows the conserved HKD catalytic core, with a eukaryotic-like
      active-site conformation.
    supporting_text: As noted, as a member of the PLD family, PldA possesses the highly
      conserved HxK(xxxx)nD consensus sequence.
  - statement: PldA accommodates a wide range of phospholipid substrates, unlike the
      narrower eukaryotic enzymes.
    supporting_text: In contrast to the substrate preferences of eukaryotic PLDs,
      PldA can accommodate a wide range of phospholipids as substrates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Crystal structures of PldA alone and with its immunity
      protein PA3488; confirms the catalytic core and the broad substrate
      tolerance.
- id: PMID:31417515
  title: Delivery of the Pseudomonas aeruginosa Phospholipase Effectors PldA and PldB
    in a VgrG- and H2-T6SS-Dependent Manner.
  findings:
  - statement: PldA is encoded by PA3487 and PldB by PA5089; they are distinct genes
      with distinct cognate VgrG proteins.
    supporting_text: vgrG5 (PA5090, blue) is encoded directly upstream of pldB (PA5089,
      cyan)
  - statement: PldA secretion depends on VgrG4b and is restored by complementation.
    supporting_text: Here, we show that the lack of PldA secretion is solely due to
      the absence of VgrG4b since PldA release is restored by complementing the vgrG4b
      mutant
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Establishes the locus-tag identity used here to show that
      the PseudoCAP row cites the PldB paper, and the VgrG4b/H2-T6SS delivery
      route for PldA.
