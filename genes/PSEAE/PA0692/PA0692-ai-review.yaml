taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA0692 (PdtB) is the TpsB-family outer-membrane transporter of the PdtA/PdtB
  two-partner secretion (type Vb) system of Pseudomonas aeruginosa. It has an N-terminal signal
  peptide, POTRA domains and a C-terminal ShlB/FhaC-type beta-barrel of the Omp85 superfamily, and
  forms the pore through which its partner PdtA (PA0690), a large HMW-adhesin-like exoprotein made
  under phosphate limitation, crosses the outer membrane. Export of PdtA strictly depends on PdtB;
  PdtA contributes to virulence in a Caenorhabditis elegans infection model.
