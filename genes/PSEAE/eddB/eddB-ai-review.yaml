  review:
    summary: >-
      IBA from PTN001684760 (3 leaf IBAs: P. aeruginosa EddB, Shewanella oneidensis ExeS, Xanthomonas
      campestris XCC0255), whose IBD has one seed, this gene's PseudoCAP IMP to PMID:20370819.
      The target appearing in its own WITH/FROM is expected.
    action: ACCEPT
    reason: >-
      Soundly seeded and correct. EddB is the secreted DNase that hydrolyses extracellular DNA
      for nutrient use, so it catalyses the breakdown rather than merely being required for it.
      The node is a small clade of secreted ExeM/NucH-family nucleases, and the Shewanella leaf
      ExeS is independently shown to degrade extracellular DNA.
