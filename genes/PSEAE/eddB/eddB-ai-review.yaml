taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  eddB (PA3909) encodes EddB (extracellular DNA degradation protein B), the main secreted
  deoxyribonuclease of Pseudomonas aeruginosa. The 779-residue protein has a signal peptide,
  an N-terminal lamin-tail domain and a DNase I-like endonuclease/exonuclease/phosphatase domain
  of the ExeM/NucH family. It is exported across the outer membrane by the Xcp type II secretion
  system and needs Mg2+ and Ca2+ for stable activity in culture supernatants. EddB degrades
  extracellular DNA so that the bacterium can use it as a source of carbon, nitrogen and phosphate.
  It is expressed from the eddA-eddB operon, with the PhoD-type phosphatase/phosphodiesterase
  EddA, and the operon is induced by phosphate limitation, extracellular DNA and neutrophil
  extracellular traps. EddB also degrades the DNA backbone of neutrophil extracellular traps
  and helps P. aeruginosa survive NET killing.
