        of DNA and utilization of DNA as a source of carbon, nitrogen and phosphate.
    - reference_id: PMID:21705528
      supporting_text: Mutants lacking exeS and/or exeM exhibit decreased eDNA degradation
- term:
    id: GO:0006308
    label: DNA catabolic process
  evidence_type: IMP
  original_reference_id: PMID:20370819
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP; sole seed of the PTN001684760 IBD. Mulcahy et al. (2010) show that PA3909
      is required for extracellular DNA degradation and for growth on DNA as a carbon, nitrogen
      or phosphate source.
    action: ACCEPT
    reason: >-
      Sound seed. The mutant loses supernatant DNase activity and DNA use, and in a later study
      complementation with eddB restores DNA degradation. The gene product carries the nuclease
      domain, so the phenotype reflects its own catalytic role in the process.
    supported_by:
    - reference_id: PMID:20370819
      supporting_text: >-
        This study identifies an extracellular DNase produced by P. aeruginosa that enables degradation
        of extracellular DNA into an accessible source of carbon, nitrogen and phosphate.
    - reference_id: PMID:29967090
      supporting_text: >-
        Complementation with pEddB restored the capacity of P. aeruginosa eddB :: lux to degrade
        eDNA, with a slight delay in the degradation kinetics
