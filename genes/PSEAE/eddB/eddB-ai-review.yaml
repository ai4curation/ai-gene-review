    label: DNA nuclease activity
  evidence_type: IDA
  original_reference_id: PMID:20370819
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA; DNase activity in culture supernatants that depends on PA3909 and on Mg2+/Ca2+
      stabilisation.
    action: ACCEPT
    reason: >-
      Core activity. The assays use culture supernatants rather than purified protein, but the
      activity depends on eddB, is restored by eddB in trans, and EddB carries an ExeM/NucH-family
      DNase I-like nuclease domain. Endo- versus exonucleolytic mode is not established, so the
      general DNA nuclease term is as precise as the evidence allows.
    supported_by:
    - reference_id: PMID:20370819
      supporting_text: >-
        Stabilization of PA3909 by the addition of excess Mg(2+) and Ca(2+) was required for DNase
        activity in culture supernatants.
    - reference_id: PMID:29967090
      supporting_text: >-
        Bacterial supernatants from P. aeruginosa lacking either the Xcp type II secretion system
        or PA3909 ( eddB ) were strongly impaired for the degradation of Sytox green-labeled extracellular
        salmon sperm DNA, relative to the control
