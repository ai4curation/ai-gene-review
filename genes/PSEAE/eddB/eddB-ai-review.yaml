suggested_questions:
- question: >-
    Is EddB an endonuclease or an exonuclease, and what are its products? Do they feed directly
    into EddA-dependent phosphate release?
- question: >-
    Which other secreted nuclease(s) account for the residual extracellular DNase activity of
    eddB mutants?
suggested_experiments:
- description: >-
    Purify the mature EddB (residues 24-779) and characterise its nuclease mode on circular and
    linear, single- and double-stranded DNA, its product sizes and its Mg2+/Ca2+ requirements;
    test active-site mutants of the endo/exonuclease/phosphatase domain for loss of supernatant
    DNase activity and NET degradation.
