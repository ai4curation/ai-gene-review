taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0471 (FiuR) is a FecR-family transmembrane anti-sigma factor of a cell-surface
  signalling system of Pseudomonas aeruginosa that controls uptake of the heterologous
  hydroxamate siderophore ferrichrome. It has a cytoplasmic N-terminal region (FecR_N), a
  single transmembrane helix and a periplasmic FecR domain, and is encoded in the
  fiuI-fiuR (PA0472-PA0471) operon next to the receptor gene fiuA (PA0470). It inhibits the
  ECF sigma factor FiuI: a fiuR mutant expresses fiuA constitutively, independent of
  ferrichrome. Ferrichrome binding to FiuA is thought to trigger processing of FiuR that
  releases FiuI activity, and the cytoplasmic N-terminal fragment of FiuR has pro-sigma
  activity.
