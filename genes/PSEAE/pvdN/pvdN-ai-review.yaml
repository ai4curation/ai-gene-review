id: G3XCY5
gene_symbol: pvdN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdN (PA2394) is a periplasmic pyridoxal-phosphate-dependent enzyme of Pseudomonas
  aeruginosa that tailors the side chain of the siderophore pyoverdine. Acting on the
  precursor after its export and deacylation, it converts the glutamate side chain into a
  succinamide by a PLP-dependent decarboxylation that retains the alpha-amino group, a
  mechanism not previously described for a PLP enzyme. The succinamide is one of two
  alternative side chains the organism can install: the
  paralogous enzyme PtaA makes the alpha-ketoglutarate form from the same precursor, and
  strains differ in which of the two they carry. The protein is a class-V PLP-dependent
  aminotransferase by fold and is exported to the periplasm by the Tat system as a folded
  protein, which requires it to bind its PLP cofactor in the cytoplasm first. In-frame deletion
  in P. fluorescens abolishes only the succinamide and succinic acid pyoverdine forms rather
  than pyoverdine itself, so it is a tailoring enzyme rather than a core step; its activity is
  broad enough that it will accept the undeacylated precursor ferribactin as well.
