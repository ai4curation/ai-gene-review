- id: PMID:27139833
  title: >-
    1.2 Å resolution crystal structure of the periplasmic aminotransferase PvdN from Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      The purified protein has been crystallised with its PLP cofactor bound at 1.22 A, and the
      paper calls PvdN a pyridoxal-phosphate-dependent enzyme catalysing an uncharacterized step
      in pyoverdine production. Two things follow: the ontology gap is real and independently
      stated, and the authors of a structural study of this protein did not treat it as a
      characterised cysteine desulfurase.
    reference_section_type: ABSTRACT
    supporting_text: >-
      PvdN, a pyridoxal phosphate-dependent enzyme that catalyzes an uncharacterized step in
      pyoverdine production
  - statement: >-
      The fold places PvdN with the type I aspartate aminotransferases, which is not the class-V
      PLP-dependent aminotransferase family the record's SIMILARITY line assigns it to.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The PvdN model shows high structural homology to type I aspartate aminotransferases
  - statement: >-
      The structure shows unexplained density consistent with an external aldimine, so even the
      bound intermediate has not been identified.
    reference_section_type: ABSTRACT
    supporting_text: >-
      also contains positive density that suggests an uncharacterized external aldimine
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Drake & Gulick 2016). Abstract only, but it is a structure paper and the
      abstract carries what matters here. Added after review feedback pointed out that the first
      version of this review asserted no structural characterisation existed, which was wrong -
      the record cites this structure and a second one. The paper supports the removal rather
      than undercutting it: it is titled for a periplasmic aminotransferase, assigns the fold to
      the type I aspartate aminotransferases rather than the class-V Csd subfamily, and states
      that the step is uncharacterized.
- id: PMID:30386787
  title: The biosynthesis of pyoverdines.
  findings:
  - statement: >-
      PvdN's reaction is identified: it generates the succinamide side-chain residue, while the
      paralogue PtaA makes the alpha-ketoglutarate form from the same precursor.
    reference_section_type: RESULTS
    supporting_text: PvdN generates the succinamide residue
  - statement: >-
      The two tailoring enzymes are alternatives, and removing one reveals the other's product,
      which establishes that this is a branch point rather than a linear step.
    reference_section_type: RESULTS
    supporting_text: >-
      the lack of PtaA results in the succinamide and succinic acid forms generated by PvdN
  - statement: >-
      These are periplasmic side-chain modifications, which the review itself describes as
      surprising for the compartment.
    reference_section_type: RESULTS
    supporting_text: >-
      The side chain modifications - surprising periplasmicreactions catalyzed by PvdN and PtaA
  - statement: >-
      The enzyme's substrate tolerance extends to ferribactin, the undeacylated precursor.
    reference_section_type: RESULTS
    supporting_text: demonstrating that PvdN may even accept ferribactin as substrate
  - statement: >-
      The chemistry is a PLP-dependent decarboxylation that retains the amino group at the
      alpha-carbon, described as a reaction mechanism not previously seen for PLP enzymes. This
      is what rules out cysteine desulfuration: that reaction is a sulfur transfer, not a
      decarboxylation.
    reference_section_type: RESULTS
    supporting_text: "a decarboxylation under retention of an amino group at the α-carbon atom"
  - statement: >-
      In-frame deletion in P. fluorescens A506 gives the specific phenotype: losing PvdN
      abolishes only the succinamide and succinic acid forms, not pyoverdine as such, which is
      what makes it a tailoring enzyme rather than a core pathway step.
    reference_section_type: RESULTS
    supporting_text: >-
      the absence of PvdN resulted only in abolished formation of succinamide and succinic acid
  - statement: >-
      PvdN reaches the periplasm through the Tat system as a folded protein, and must bind PLP
      in the cytoplasm to be transport competent; mutating the active-site lysine leaves it stuck
      in the membrane. This is the mechanistic link to the tat reviews in this campaign.
    reference_section_type: RESULTS
    supporting_text: >-
      it is transported by the twin-arginine translocation system as folded protein that requires
      cytoplasmic PLP binding to be transport competent
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Ringel & Bruser 2018), full text cached. A review rather than primary
      data, and the only source in hand that states what PvdN actually catalyses. It is the
      basis for removing the cysteine desulfurase rows: the reaction described - converting the
      glutamate side chain to a succinamide using a PLP cofactor - is not cysteine
      desulfuration, and the review consistently calls PvdN a tailoring enzyme of periplasmic
      pyoverdine biogenesis.
