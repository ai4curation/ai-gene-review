- term:
    id: GO:0031071
    label: cysteine desulfurase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G08490
  - PANTHER:PTN008451775
  - UniProtKB:O32164
  - UniProtKB:P77444
  - UniProtKB:Q46925
  - UniProtKB:Q8IBT4
  review:
    summary: >-
      IBA from PTN008451775, a clade of genuine cysteine desulfurases. The donors were resolved
      against the UniProt API rather than read from the accessions: P77444 is E. coli SufS,
      Q46925 E. coli CsdA, O32164 B. subtilis SufS and Q8IBT4 P. falciparum SufS, alongside an
      Arabidopsis entry. The node is sound for what it contains; what fails is the transfer to
      this protein.
    action: REMOVE
    reason: >-
      PvdN is not a cysteine desulfurase. Its reaction is the conversion of the pyoverdine
      precursor's glutamate side chain to a succinamide, a PLP-dependent tailoring step
      performed in the periplasm, and the review that describes it calls PvdN a tailoring
      enzyme of pyoverdine biogenesis throughout. Cysteine desulfuration is a cytoplasmic
      sulfur-mobilisation reaction feeding iron-sulfur cluster and thiamine biosynthesis; it has
      no role in this pathway and no substrate in this compartment. What the two proteins share
      is the class-V pyridoxal-phosphate-dependent aminotransferase fold, which is used by
      enzymes doing quite different chemistry and is precisely what a fold-level inference
      cannot distinguish. The target-specific evidence is strong and points the other way: the
      protein is periplasmic by IDA, required for pyoverdine by one IDA and three IMP rows, and
      has a named alternative paralogue, PtaA, that performs the competing version of the same
      tailoring step. The defect is recorded against UniProt rather than PAINT because that is
      where the error originates - see the explanation on the IEA row below.
    supported_by:
    - reference_id: PMID:30386787
      reference_section_type: RESULTS
      supporting_text: PvdN generates the succinamide residue
    - reference_id: PMID:30386787
      reference_section_type: RESULTS
      supporting_text: >-
        the lack of PtaA results in the succinamide and succinic acid forms generated by PvdN
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: UniProtKB:P77444
        source_label: SUFS_ECOLI, Cysteine desulfurase SufS
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          A genuine cysteine desulfurase, so the activity is right for the donor. It is a
          cytoplasmic sulfur-mobilisation enzyme, where the target is a periplasmic siderophore
          tailoring enzyme.
      - source_id: UniProtKB:Q46925
        source_label: CSDA_ECOLI, Cysteine desulfurase CsdA
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: As for SufS; resolved against the UniProt API.
      - source_id: UniProtKB:O32164
        source_label: SUFS_BACSU, Cysteine desulfurase SufS
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: As for the E. coli donors.
      - source_id: UniProtKB:Q8IBT4
        source_label: SUFS_PLAF7, Cysteine desulfurase SufS
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          A Plasmodium SufS; the donor set is uniformly cysteine desulfurases across four
          kingdoms, which is what makes the clade sound and the transfer wrong.
      - source_id: PANTHER:PTN008451775
        source_label: PTN008451775
        source_status: SOURCE_BAD
        comment: >-
          The node asserts a specific catalytic activity on a specific substrate across a clade
          defined by the class-V PLP-dependent aminotransferase fold. That fold is shared by
          enzymes with unrelated substrates, so an enables cysteine desulfurase activity at this
          level over-propagates onto proteins such as this one whose PLP chemistry serves
          something else entirely.
      residue_claims_not_applicable: >-
        No residue-level claim is at issue: the dispute is over the substrate of a shared
        cofactor-binding fold, and the propagation cited no active-site residues.
- term:
    id: GO:0031071
    label: cysteine desulfurase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:2.8.1.7
  review:
    summary: >-
      EC-based mapping from EC 2.8.1.7. Tracing where that EC number comes from is what
      identifies the root of the problem: it is itself an ARBA prediction on this entry.
    action: REMOVE
    reason: >-
      Same verdict as the IBA row, for consistency across rows sharing a term, and this is the
      row that shows where the error starts. Every statement on the record placing this protein
      among the cysteine desulfurases carries ARBA evidence and nothing else: the RecName
      "cysteine desulfurase", the EC number 2.8.1.7 this row maps from, the CATALYTIC ACTIVITY
      block giving the L-cysteine to L-alanine reaction, and the SIMILARITY statement assigning
      it to the Csd subfamily. The project rules class an ARBA association rule as an unvetted
      prediction and not valid support, so the EC number this mapping rests on is a prediction
      rather than a curated assignment, and the GO row is a prediction built on a prediction.
      Two further things on the record point the other way. UniProt gives the protein its own
      NCBIfam model, NF051467 peri_mod_PvdN, named for periplasmic modification rather than for
      sulfur mobilisation. And the published structure of the purified protein
      (PMID:27139833, PDB 5I90, 1.22 A with PLP bound) is titled for a periplasmic
      aminotransferase, reports high structural homology to type I aspartate aminotransferases,
      and describes the step PvdN catalyses in pyoverdine production as uncharacterized - which
      is not how a paper on a protein whose cysteine desulfurase activity was established would
      read. The counter-evidence is addressed in the defect below.
    supported_by:
    - reference_id: PMID:30386787
      reference_section_type: RESULTS
      supporting_text: PvdN generates the succinamide residue
    - reference_id: PMID:27139833
      reference_section_type: ABSTRACT
      supporting_text: >-
        PvdN, a pyridoxal phosphate-dependent enzyme that catalyzes an uncharacterized step in
        pyoverdine production
    - reference_id: file:PSEAE/pvdN/pvdN-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; NF051467; peri_mod_PvdN; 1.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: Protein name
      requested_change: CHECK
      asserted_value: cysteine desulfurase (EC 2.8.1.7)
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        G3XCY5 (pvdN, PA2394) is named "cysteine desulfurase" with EC 2.8.1.7 on the strength of
        ARBA association rules alone - ARBA00012239 for the name and EC, ARBA00050776 for the
        catalytic activity, ARBA00010447 for the Csd subfamily assignment - with no curated or
        experimental statement behind any of them. The protein is in fact a periplasmic
        pyoverdine side-chain tailoring enzyme: it is periplasmic by direct evidence, required
        for pyoverdine biosynthesis by one IDA and three IMP rows, and the pathway review
        (PMID:30386787) states that PvdN generates the succinamide residue of the siderophore,
        with the paralogue PtaA making the alternative alpha-ketoglutarate form. What it shares
        with the cysteine desulfurases is the class-V PLP-dependent aminotransferase fold, which
        is common to enzymes acting on quite different substrates. The misassignment propagates:
        the EC number feeds an EC2GO row for GO:0031071 on this entry, and the same fold also
        draws an IBA from a PAINT node seeded entirely by genuine cysteine desulfurases
        (E. coli SufS and CsdA, B. subtilis SufS, P. falciparum SufS), so correcting the name
        and EC would clear the derived annotation at source. UniProt's own protein-specific
        NCBIfam model for this entry, NF051467 peri_mod_PvdN, is named for periplasmic
        modification and not for sulfur mobilisation, so the record is internally inconsistent
        on this point.
        There is one piece of counter-evidence, and it has to be named. The record cites two
        crystal structures of the purified protein, both with PLP bound. PDB 5I90 is published
        (PMID:27139833) and supports the correction rather than the current name: it is titled
        for a periplasmic aminotransferase, finds high structural homology to type I aspartate
        aminotransferases - not to the class-V Csd subfamily the SIMILARITY line asserts - and
        calls the step PvdN catalyses uncharacterized. PDB 5HH9 is the problem: its deposition
        title claims structural and biochemical characterization of a novel L-cystine
        desulfurase involved in the biosynthesis of the major siderophore pyoverdine, which is
        a direct claim of desulfurase activity on this protein in this pathway. Three things
        limit what it can settle. It is a PDB deposition and nothing more - the record shows it
        as submitted to the PDB in January 2016 with no literature citation, so the asserted
        biochemical characterisation was never published or refereed. It names L-cystine, the
        disulfide, whereas this row's term and EC number are for the L-cysteine reaction, so even
        at face value it is not evidence for GO:0031071 or EC 2.8.1.7. And it is contradicted on
        function by the published structure of the same protein at higher resolution, and by the
        in-frame deletion phenotype, which abolishes only the succinamide and succinic acid
        pyoverdine forms.
        That unresolved claim is exactly why this is raised at PROBABLE with CHECK rather than
        CONFIRMED with a correction: there is an unpublished assertion of the opposite activity
        that a UniProt curator is better placed than I am to weigh, and the positive
        identification of PvdN's real reaction comes from a review rather than from primary
        enzymology I read. If the 5HH9 work is published and holds, the protein is bifunctional
        and the name may stand; if it is not, the ARBA chain is the whole basis for it.
      supported_by:
      - reference_id: PMID:30386787
        reference_section_type: RESULTS
        supporting_text: PvdN generates the succinamide residue
      - reference_id: PMID:27139833
        reference_section_type: ABSTRACT
        supporting_text: >-
          The PvdN model shows high structural homology to type I aspartate aminotransferases
      - reference_id: file:PSEAE/pvdN/pvdN-uniprot.txt
        record_section: ["DR:NCBIfam"]
        supporting_text: DR   NCBIfam; NF051467; peri_mod_PvdN; 1.
      - reference_id: file:PSEAE/pvdN/pvdN-uniprot.txt
        record_section: [REF]
        supporting_text: 'RL   Submitted (JAN-2016) to the PDB data bank.'
core_functions:
- description: >-
    Periplasmic PLP-dependent tailoring enzyme of pyoverdine biogenesis: converts the glutamate
    side chain of the exported precursor into a succinamide, one of two alternative side chains
    the pathway can install.
  directly_involved_in:
  - id: GO:0002049
    label: pyoverdine biosynthetic process
  locations:
  - id: GO:0030288
    label: outer membrane-bounded periplasmic space
  supported_by:
  - reference_id: PMID:30386787
    reference_section_type: RESULTS
    supporting_text: PvdN generates the succinamide residue
  - reference_id: PMID:16621825
    reference_section_type: TITLE
    supporting_text: >-
      Pyoverdine-mediated iron uptake in Pseudomonas aeruginosa: the Tat system is required for
      PvdN but not for FpvA transport.
  knowledge_gaps:
  - gap_statement: >-
      The reaction PvdN catalyses has no GO term. Its chemistry is known in outline - a
      PLP-dependent decarboxylation of the glutamate side chain that retains the amino group at
      the alpha-carbon, described as a new PLP-dependent reaction mechanism - but the steps of
      that mechanism have not been worked out. The structure is solved to 1.22 A with PLP bound,
      and even there the catalytic picture is incomplete: the paper reporting it calls the step
      uncharacterized and finds unexplained density consistent with an external aldimine it
      could not identify. No kinetics have been reported, and why the chemistry happens in the
      periplasm rather than before export is unexplained; the pathway review calls these
      reactions surprising for the compartment. No molecular function is asserted for the
      tailoring reaction in this review because no existing term names it, and a term request
      needs the mechanism pinned down further than a review's one-line description.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Why the organism maintains two alternative side-chain enzymes is unknown. PvdN makes the
      succinamide form and PtaA the alpha-ketoglutarate form from the same precursor, strains
      differ in which they carry and some have both, and what selective difference the two
      pyoverdine forms make - in iron affinity, uptake by the cognate receptor, or exclusion of
      competitors - has not been established.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    What reaction does PvdN actually run? A PLP-dependent conversion of a glutamate side chain
    to a succinamide is unusual enough that naming the mechanism would be needed before GO could
    be asked for a term, and the gene currently has no molecular-function annotation at all once
    the mis-assigned cysteine desulfurase rows are removed.
- question: >-
    Do the succinamide and alpha-ketoglutarate pyoverdine forms differ functionally? PvdN and
    PtaA are alternatives rather than sequential steps, so the two products presumably differ in
    something the organism cares about, but what is not known.
suggested_experiments:
- description: >-
    Assay purified PvdN against the deacylated pyoverdine precursor and against ferribactin,
    following the side-chain product by mass spectrometry and testing PLP dependence, to
    establish the reaction mechanism and provide the basis for a GO term request.
- description: >-
    Test purified PvdN for cysteine desulfurase activity directly. A negative result would
    convert the source defect recorded here from a PROBABLE query into a confirmed correction,
    and the assay is simple since the SufS reaction is well established.
