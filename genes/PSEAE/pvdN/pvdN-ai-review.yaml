  findings:
  - statement: >-
      This paper is about PvdN's export: its title states that the Tat system is required for
      PvdN, which is why a tat mutant makes no pyoverdine.
    reference_section_type: TITLE
    supporting_text: >-
      Pyoverdine-mediated iron uptake in Pseudomonas aeruginosa: the Tat system is required for
      PvdN but not for FpvA transport.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Voulhoux, Filloux & Schalk 2006). Abstract only. Titled for this gene,
      and the source of both the GO:0002049 IDA and the GO:0030288 IDA rows. Worth noting the
      cross-connection: this is the same paper that supplies the IMP rows on tatA, tatB and
      tatC, reviewed earlier in this campaign, so the reference sits at the join between the Tat
      system and this pathway. The paper's title names PvdN as the Tat-dependent component, but
      note that PvdN cannot by itself account for a tat mutant's pyoverdine-negative phenotype:
      in-frame deletion of pvdN in P. fluorescens abolishes only the succinamide and succinic
      acid forms, so the other periplasmic maturation enzymes that also cross by Tat are
      presumably what a tat mutant actually loses.
