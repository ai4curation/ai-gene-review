  review:
    action: REMOVE
    summary: tetrahydrofolate biosynthetic process requires rejection of the inferred assignment.
    reason: 'The similarity transfer conflates distinct enzyme families and chemistry: target ThrH is
      the structurally characterized HAD-like phosphoserine phosphatase/phosphotransferase, whereas these
      donor papers study chorismate-utilizing aminodeoxychorismate synthase. The experimentally established
      target fold and reactions contradict a PabB-family assignment; no target chorismate/glutamine catalytic
      machinery is supported. This is a challenged ISS inference, not removal of an inaccessible target
      experiment.'
    supported_by:
