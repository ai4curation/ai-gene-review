- term:
    id: GO:0046654
    label: tetrahydrofolate biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:16605270
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P05041
  review:
    action: REMOVE
    summary: tetrahydrofolate biosynthetic process requires rejection of the inferred assignment.
    reason: 'The similarity transfer conflates distinct enzyme families and chemistry: target ThrH is the structurally
      characterized HAD-like phosphoserine phosphatase/phosphotransferase, whereas these donor papers study
      chorismate-utilizing aminodeoxychorismate synthase. The experimentally established target fold and reactions
      contradict a PabB-family assignment; no target chorismate/glutamine catalytic machinery is supported.
      This is a challenged ISS inference, not removal of an inaccessible target experiment.'
    supported_by:
    - reference_id: file:PSEAE/thrH/thrH-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the thrH family.
    - reference_id: PMID:14699121
      supporting_text: The structure confirms an overall fold similar to that of PSP.
