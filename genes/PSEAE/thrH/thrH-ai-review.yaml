  review:
    action: ACCEPT
    summary: ThrH supplies phosphohomoserine through an alternative route that complements ThrB 
      loss.
    reason: ThrH transfers phosphate from phosphoserine to homoserine, generating phosphohomoserine 
      for threonine synthase. This is actual catalytic participation in L-threonine biosynthetic 
      process. Native P. aeruginosa requires simultaneous thrB and thrH disruption for threonine 
      auxotrophy; the later HPLC chemistry in PMID:14699121 resolves the alternative phosphate 
      donor.
    supported_by:
