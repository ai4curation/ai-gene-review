- term:
    id: GO:0004413
    label: homoserine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:14699121
  qualifier: enables
  negated: true
  review:
    action: ACCEPT
    summary: Accept the experimentally supported absence of ATP-dependent homoserine kinase 
      activity.
    reason: 'This original annotation is negated: it asserts that ThrH does not have ATP-dependent homoserine
      kinase activity. PMID:14699121 identifies phosphoserine, rather than ATP, as the phosphoryl donor
      for homoserine phosphorylation, consistent with the curated UniProt caution against calling ThrH
      a homoserine kinase. Retain this true negative assertion. The separate positive GO:0043899 phosphoserine:homoserine
      phosphotransferase annotation is already accepted; replacing this negated term with that activity
      would incorrectly negate a demonstrated function.'
    supported_by:
    - reference_id: PMID:14699121
      supporting_text: "ThrH is able to further transfer the phosphoryl group to\nhomoserine using phosphoserine
        as the phosphoryl group donor"
    - reference_id: file:PSEAE/thrH/thrH-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: suggesting it is inappropriate to define it as a homoserine kinase
