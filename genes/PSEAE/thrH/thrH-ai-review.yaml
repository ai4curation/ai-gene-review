  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: 'ThrH is a magnesium-dependent phosphoserine phosphatase/phosphoserine:homoserine phosphotransferase
  of Pseudomonas aeruginosa. It can hydrolyze phosphoserine to serine, or transfer its phosphate to homoserine,
  producing phosphohomoserine and serine. The latter reaction provides an alternative to ThrB in threonine
  biosynthesis without using ATP as phosphate donor. ThrH overexpression can also complement serB mutants;
  that result does not establish its indispensability for native serine biosynthesis.'
