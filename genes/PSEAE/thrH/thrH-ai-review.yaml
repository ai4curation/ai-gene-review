  review:
    action: UNDECIDED
    summary: The ancestral localization inference for thrH remains plausible, but the previously attached
      quote does not establish its compartment.
    reason: The IBA descends from PANTHER:PTN000000002, grounded in phosphoserine-phosphatase family donors,
      including E. coli SerB and human PSPH. This is a curated ancestral localization assertion, not a
      pairwise donor-count argument. The target record has no independent subcellular-location statement,
      and the retrieved target study characterizes recombinant enzyme rather than native localization.
      A family label or catalytic reaction does not resolve the compartment. Retain the original assertion
      for review but leave the location undecided until its phylogenetic/localization evidence can be
      independently verified; no target-specific loss or exclusion is inferred.
