  review:
    action: ACCEPT
    summary: ThrH inherits a cytoplasmic localization from the phosphoserine-phosphatase lineage.
    reason: The actual PAINT PTN000000002 cytoplasmic assertion is grounded in SerB/PSPH descendants
      and is assessed SOUND in the committed PTHR43344 review. Human PSPH has independent 
      publication-linked cytosolic localization; ThrH retains the phosphoserine-phosphatase fold and
      participates in native intracellular amino-acid synthesis. This supports the ancestral 
      localization inference. The target biochemical/crystal experiments are not relabeled as native
      localization measurements, and the former missing-target-assay rationale alone does not 
      overturn the phylogenetic placement.
