taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: HldD (PA3337, also called RfaD) is the NADP-dependent ADP-heptose 6-epimerase of Pseudomonas
  aeruginosa. It belongs to the HldD subfamily of nucleotide-sugar epimerases and interconverts ADP-D-glycero-beta-D-manno-heptose
  and ADP-L-glycero-beta-D-manno-heptose by inversion at sugar carbon 6. The L,D product supplies LPS
  inner-core heptose. A tightly bound NADP cofactor supports transient oxidation and reduction during
  epimerization; it is not consumed as a net reductant.
