    periplasmic pseudopilus tip complex by binding XcpX and XcpW, forms the XcpVW core of the tip,
    and is required for secretion of exoproteins such as elastase LasB across the outer membrane.
  supported_by:
  - reference_id: PMID:19828448
    supporting_text: We propose a model in which XcpV(I) is the nucleator that first binds XcpX(K)
      and XcpW(J) at different sites
  - reference_id: PMID:30346996
    supporting_text: we have confirmed that two minor pseudopilins, XcpV and XcpW, constitute a
      core complex indispensable to the pseudopilus tip
