- id: PMID:8331069
  title: Cleavage, methylation, and localization of the Pseudomonas aeruginosa export proteins
    XcpT, -U, -V, and -W.
  findings:
  - statement: XcpT-W are PilD-processed, N-methylated prepilin-like proteins located in the inner
      membrane before and after leader removal.
    supporting_text: the precursor forms of XcpT-W are located predominantly in the bacterial inner
      membrane, and their localization is not altered after PilD-mediated removal of the leader
      sequence
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PAO1 study (abstract only; PMC204877 returns no full text). Directly
      supports plasma membrane and PilD processing; it presupposes rather than demonstrates
      membership of the T2SS complex, so it is weak support for the PseudoCAP GO:0015627 IDA.
- id: PMID:9818381
  full_text_unavailable: true
  title: 'GSP-dependent protein secretion in gram-negative bacteria: the Xcp system of Pseudomonas
    aeruginosa.'
  findings:
  - statement: Review of the Xcp type II secretion machinery of P. aeruginosa.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PubMed types this as a Review and the abstract calls it one; full text not
      available to us (abstract only, no PMC copy). Reviews from the laboratory that did the work
      can include original or unpublished data, so whether it supports the PseudoCAP IDA is
      unverified. The term it is cited for is correct.
- id: PMID:1309616
  title: Components of the protein-excretion apparatus of Pseudomonas aeruginosa are processed by
    the type IV prepilin peptidase.
  findings:
  - statement: Four linked prepilin-like genes (pddA-D, later xcpT-W) are required for protein
      excretion.
    supporting_text: Site-specific mutations within these genes have shown that they are required
      for protein excretion
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary study (abstract only). UniProt gives pddC as a synonym of xcpV, linking
      this paper to the gene.
- id: PMID:9282737
  title: 'Interactions of the components of the general secretion pathway: role of Pseudomonas
    aeruginosa type IV pilin subunits in complex formation and extracellular protein secretion.'
  findings:
  - statement: His-tagged XcpT forms stoichiometric complexes with XcpV, among other pseudopilins.
    supporting_text: an oligohistidine-tagged XcpT was shown to form stoichiometric complexes with
      PilA, and with XcpT, U, V and W
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary study (abstract only).
- id: PMID:19828448
  title: The XcpV/GspI pseudopilin has a central role in the assembly of a quaternary complex
    within the T2SS pseudopilus.
  findings:
  - statement: XcpV nucleates the tip complex, binding XcpX and XcpW at different sites.
    supporting_text: We propose a model in which XcpV(I) is the nucleator that first binds XcpX(K)
      and XcpW(J) at different sites
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: SPR and co-purification with purified soluble domains of P. aeruginosa
      pseudopilins (abstract only cached).
- id: PMID:30346996
  title: Structure-guided disruption of the pseudopilus tip complex inhibits the Type II secretion
    in Pseudomonas aeruginosa.
  findings:
  - statement: XcpV and XcpW form the core of the pseudopilus tip; the xcpV mutant has the lowest
      LasB secretion and is complemented.
    supporting_text: Taken together, these results fully support that XcpV and -W form a core
      complex indispensable to T2SS functions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available.
