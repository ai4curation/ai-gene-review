gene_symbol: PA4332
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4332 (SadC) is an integral inner-membrane diguanylate cyclase of
  Pseudomonas aeruginosa with six transmembrane helices and a cytoplasmic
  C-terminal GGDEF domain that synthesises cyclic di-GMP. With the
  phosphodiesterase BifA it sets the c-di-GMP level that governs the switch
  from swarming to surface attachment. SadC promotes stable attachment,
  exopolysaccharide (Pel) production and biofilm formation, and represses
  swarming by altering flagellar reversals. Its partners include the c-di-GMP
  binding methyltransferase WarA, which links SadC signalling to
  lipopolysaccharide O-antigen modification.
references:
- id: PMID:17586642
  title: SadC reciprocally influences biofilm formation and swarming motility via modulation
    of exopolysaccharide production and flagellar function.
  findings:
  - statement: SadC is an inner-membrane DGC; the deletion is biofilm-defective and
      hyperswarms, while multicopy sadC promotes sessility.
    supporting_text: Deletion of the sadC gene results in a strain that is defective
      in biofilm formation and a hyperswarmer, while multicopy expression of this gene
      promotes sessility.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the GO:0052621 IDA seed and the GO:0044010 and
      GO:0071978 IMP rows. Cached copy abstract only; full text (PMC2168701)
      read on the PMC web page: in vitro DGC activity of a SadC GGDEF chimera,
      10-fold c-di-GMP rise on overexpression, inner-membrane fractionation.
- id: PMID:26991003
  title: Synergistic interaction of glyceraldehydes-3-phosphate dehydrogenase and ArsJ,
    a novel organoarsenical efflux permease, confers arsenate resistance.
  findings: []
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: >-
      Full text cached. An arsenate-resistance paper on GAPDH and the ArsJ efflux
      permease; SadC, PA4332, c-di-GMP and biofilm are not mentioned. Cited by a
      PseudoCAP IDA of GO:1900192 to PA4332 (source defect recorded on that row).
- id: PMID:28263305
  title: Cyclic-di-GMP regulates lipopolysaccharide modification and contributes to
    Pseudomonas aeruginosa immune evasion.
  findings:
  - statement: WarA, a c-di-GMP-binding methyltransferase, is a SadC partner.
    supporting_text: Here, we identify an unrecognized SadC partner, WarA
  reference_review:
