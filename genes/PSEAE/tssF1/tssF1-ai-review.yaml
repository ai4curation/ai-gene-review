description: TssF1 is a cytoplasmic baseplate component of the Pseudomonas aeruginosa H1-T6SS. With TssG1, TssE1 and TssK1 it forms the wedge structures of the baseplate that nucleate tail-tube/sheath polymerization and connect the apparatus to the membrane complex.
