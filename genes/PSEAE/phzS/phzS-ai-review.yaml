id: Q9HWG9
gene_symbol: phzS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PhzS is the 5-methylphenazine-1-carboxylate 1-monooxygenase (EC 1.14.13.218)
  of Pseudomonas aeruginosa PAO1, an FAD-dependent class A aromatic hydroxylase
  of the p-hydroxybenzoate hydroxylase family. It uses NADH and O2 to catalyse
  the hydroxylative decarboxylation of 5-methylphenazine-1-carboxylate, the
  product of the PhzM N-methyltransferase, giving the blue redox-active
  virulence pigment pyocyanin. This is the last step in converting
  phenazine-1-carboxylate (PCA) to pyocyanin. PhzS can also hydroxylate PCA
  itself to 1-hydroxyphenazine, but PCA is a poor substrate that largely
  uncouples NADH oxidation from hydroxylation. The purified enzyme is a
  monomer with bound FAD; its crystal structure shows the flavin in the "out"
  conformation and a disordered C-terminal tail near the substrate tunnel. In
  vitro, pyocyanin is formed only when PhzM and PhzS are free to meet, which
  suggests a transient PhzM-PhzS interaction that keeps the unstable
  5-methyl-PCA intermediate from being released. phzS insertion mutants make no
  pyocyanin.
