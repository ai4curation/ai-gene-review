- term:
    id: GO:0106220
    label: pyocyanine biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:17253782
  qualifier: involved_in
  review:
    summary: >-
      Not in GOA for PhzS, though its partner PhzM carries this term by IDA
      from the same paper. PhzS itself catalyses the final step of pyocyanin
      synthesis, and phzS insertion mutants lack pyocyanin.
    action: NEW
    reason: >-
      PhzS does the work of a step in this process: it is the enzyme that
      converts 5-methyl-PCA to pyocyanin. This is participation, not only
      necessity. Comparator: PhzM, the enzyme of the preceding step, carries
      GO:0106220 by IDA from PMID:17253782, and UniProt's curated pathway line
      places PhzS in pyocyanine biosynthesis (ECO:0000269).
    supported_by:
    - reference_id: PMID:17253782
      supporting_text: >-
        Pyocyanin formation required PhzM, PhzS, PCA, SAM, oxygen, and NADH
        consistent with a methyl transfer reaction and a flavin-mediated
        hydroxylation.
    - reference_id: PMID:11591691
      supporting_text: >-
        P. aeruginosa with insertionally inactivated phzM or phzS developed
        pyocyanin-deficient phenotypes.
    - reference_id: file:PSEAE/phzS/phzS-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Secondary metabolite biosynthesis; pyocyanine biosynthesis.'
