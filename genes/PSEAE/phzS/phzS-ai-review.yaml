- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17253782
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9HWH2
  review:
    summary: >-
      Interaction with PhzM inferred from activity assays: pyocyanin forms only
      when PhzM and PhzS can meet, not when separated by a dialysis membrane or
      sequentially by filtration. No stable PhzM-PhzS complex was detected by
      light scattering. The bare protein-binding term says nothing about the
      function.
    action: REMOVE
    reason: >-
      Generic protein binding is uninformative (protein-binding policy).
      Removal does not deny the reported functional PhzM-PhzS interaction,
      which is recorded in the description and core function. No more
      informative MF term fits a transient, inferred encounter.
    supported_by:
    - reference_id: PMID:17253782
      supporting_text: >-
        Isolation of either PhzM or PhzS inside a dialysis membrane results in
        no pyocyanin formation suggesting that an at least transient physical
        interaction between PhzM and PhzS is required in order to activate
        production of pyocyanin.
    - reference_id: PMID:17253782
      supporting_text: >-
        Elution profiles and calculated masses did not differ from the data
        obtained with buffer only in the system indicating detectable
        complexes were not formed under these conditions.
