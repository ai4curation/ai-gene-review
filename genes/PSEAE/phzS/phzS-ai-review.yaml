  full_text_unavailable: true
  findings:
  - statement: >-
      phzS expressed alone converts PCA to 1-hydroxyphenazine, and phzM or phzS
      insertion mutants of P. aeruginosa lack pyocyanin.
    supporting_text: >-
      Expression of phzS alone in Escherichia coli or in enzymes,
      pyocyanin-nonproducing P. fluorescens resulted in conversion of PCA to
      1-hydroxyphenazine.
  reference_review:
    relevance: HIGH
