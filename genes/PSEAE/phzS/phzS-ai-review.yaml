      PubMed-verified (Mavrodi et al. 2001, J Bacteriol). Abstract only in
      cache; defines phzM and phzS genetically.
- id: PMID:17012792
  title: The purification, crystallization and preliminary structural characterization
    of FAD-dependent monooxygenase PhzS, a phenazine-modifying enzyme from Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      Crystallization and preliminary X-ray analysis of His-tagged PhzS; the
      crystals contain bound FAD. No activity assay is reported.
    supporting_text: The crystals are yellow owing to the presence of FAD
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      PubMed-verified, full text read. Correctly identifies the PhzS
      crystallization paper, but it does not support the PseudoCAP IDA for
      monooxygenase activity, because no enzyme activity is measured. The
      activity evidence is in PMID:17253782.
- id: PMID:17253782
  title: Structural and functional analysis of the pyocyanin biosynthetic protein
    PhzM from Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Purified PhzS hydroxylates PCA to 1-hydroxyphenazine NADH-dependently
      (PCA is a poor, uncoupling substrate); PhzM plus PhzS make pyocyanin
      from PCA, which needs SAM, NADH and O2.
    supporting_text: >-
      There were indications however that PCA is a poor substrate for PhzS as
      complete conversion of PCA to 1-HP was not obtained and more NADH was
      consumed than the amount of 1-HP produced.
  - statement: PhzS is a monomer in solution, and no stable PhzM-PhzS complex was detected.
    supporting_text: indicating it is a monomer in solution
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text read. Primary activity paper for both PhzM
      and PhzS despite a PhzM-focused title.
