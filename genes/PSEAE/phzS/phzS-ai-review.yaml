- term:
    id: GO:0102169
    label: 5-methylphenazine-1-carboxylate 1-monooxygenase (NADH) activity
  evidence_type: EXP
  original_reference_id: PMID:17253782
  qualifier: enables
  review:
    summary: >-
      Purified PhzM plus PhzS, with PCA, SAM, NADH and O2, produce pyocyanin;
      PhzM alone is inactive and PhzS alone converts PCA only to
      1-hydroxyphenazine. The final step (5-methyl-PCA to pyocyanin) is
      assigned to the flavin hydroxylase PhzS. The free intermediate could not
      be assayed directly because it is unstable, so the reaction is shown in
      the coupled system.
    action: ACCEPT
    reason: >-
      Core catalytic activity of PhzS, supported by the coupled in vitro
      reconstitution and by curated UniProt function and catalytic activity
      statements tied to this paper.
    supported_by:
    - reference_id: PMID:17253782
      supporting_text: >-
        When reactions containing both PhzM and PhzS were analyzed, rapid
        pyocyanin formation was evident based on the blue color formed in the
        reaction vessel.
    - reference_id: PMID:17253782
      supporting_text: >-
        Pyocyanin formation required PhzM, PhzS, PCA, SAM, oxygen, and NADH
        consistent with a methyl transfer reaction and a flavin-mediated
        hydroxylation.
    - reference_id: file:PSEAE/phzS/phzS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes the oxidative decarboxylation of 5-methylphenazine-1-carboxylate
        (5-methyl- PCA) to pyocyanine.
