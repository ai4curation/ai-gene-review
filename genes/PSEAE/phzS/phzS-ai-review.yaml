suggested_questions:
- question: >-
    Is the PhzM-PhzS interaction a defined complex that channels the unstable
    5-methyl-PCA intermediate, or a transient encounter? Which PhzS surface
    (for example the disordered C-terminal tail) mediates it?
- question: >-
    Should PseudoCAP re-key the PhzS monooxygenase IDA row from the
    crystallization paper PMID:17012792 to PMID:17253782? And should
    Synechocystis chlP (Q55087, a geranylgeranyl reductase) be removed from
    PTHR13789, or given NOT monooxygenase activity, so that it no longer
    inherits the PTN002492679 IBA?
suggested_experiments:
- description: >-
    Make 5-methyl-PCA chemically or trap it enzymatically, and measure PhzS
    steady-state kinetics on it directly, with and without PhzM. This would
    show whether PhzM changes PhzS activity or only supplies the substrate.
