    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP rows. The cached file is abstract only; the full text
      was read on the PMC article page (PMC1426570) on 2026-11-05. Transposon mutants of
      foxR (PA2467) and fiuR (PA0471) produce FoxA and FiuA independent of the inducing
      siderophore and show constitutive receptor promoter activity, which the authors
      interpret as anti-sigma function. No binding assay was done in this paper.
