  label: Pseudomonas aeruginosa PAO1
description: >-
  FoxR (PA2467) is a FecR-family transmembrane anti-sigma factor of the ferrioxamine
  cell-surface signalling system of Pseudomonas aeruginosa. It has a cytoplasmic N-terminal
  region (FecR_N), a single transmembrane helix and a periplasmic FecR domain, and is encoded
  in the foxI-foxR (PA2468-PA2467) operon next to the ferrioxamine receptor gene foxA
  (PA2466). In the absence of ferrioxamine FoxR inhibits the ECF sigma factor FoxI; a foxR
  mutant produces FoxA independent of ferrioxamine B. FoxR self-cleaves in the periplasmic
  domain between Gly191 and Thr192 by an N-O acyl rearrangement; ferrioxamine binding to FoxA
  then triggers further proteolysis that releases FoxI activity, and the cytoplasmic
  N-terminal fragment has pro-sigma activity.
