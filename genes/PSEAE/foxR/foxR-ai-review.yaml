  review:
    summary: >-
      PseudoCAP IMP and a seed of the PTN001250434 IBD. In the full text (PMC page)
      a foxR transposon mutant expresses its receptor constitutively, independent of
      the siderophore, which shows that foxR inhibits FoxI. A derepression
      phenotype is the expected genetic readout of an anti-sigma factor; the antagonism
      is confirmed by later work summarised in PMID:35138377.
