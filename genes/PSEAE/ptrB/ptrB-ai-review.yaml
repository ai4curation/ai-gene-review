taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PtrB (PA0612) is a 66-residue protein with a single DksA/TraR-type C4 zinc
  finger, encoded next to the pyocin repressor gene prtR at the start of the
  R/F pyocin cluster. Its expression is repressed by PrtR and so rises when
  DNA damage triggers RecA-dependent cleavage of PrtR during the SOS response.
  PtrB then represses the type III secretion system: ptrB deletion restores
  ExoS production and exoT transcription in a prtR mutant and abolishes the
  mitomycin C-induced shutdown of type III secretion. It does not act by
  binding the master activator ExsA, and how it represses type III genes is
  unknown. PtrB thus links the DNA-damage response, which activates pyocin
  synthesis through PrtN, to shutdown of type III secretion.
