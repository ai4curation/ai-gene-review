core_functions:
- description: >-
    DNA-damage-induced repressor of the type III secretion system. PrtR
    represses ptrB; when PrtR is cleaved in the SOS response, PtrB is made
    and shuts down type III secretion by an unknown mechanism that does not
    involve binding ExsA.
