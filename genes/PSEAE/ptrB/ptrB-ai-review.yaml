      required for TTSS repression in the prtR mutant background.
suggested_questions:
- question: >-
    Does PtrB act like DksA and TraR, through the RNA polymerase secondary
    channel, to repress exsA-dependent promoters, or through another
    regulator?
suggested_experiments:
- description: >-
    Test PtrB binding to RNA polymerase (pull-down or bacterial two-hybrid
    with the beta' subunit) and its effect on exsA and exoS promoter
    transcription in vitro, with zinc-finger cysteine mutants as controls.
