id: Q9HTI4
gene_symbol: gbdR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  GbdR (PA5380) is an AraC-family transcriptional activator of Pseudomonas
  aeruginosa that senses the choline catabolites glycine betaine and
  dimethylglycine. It binds direct-repeat sites in target promoters and
  activates about 25 genes from 11 promoters, covering choline acquisition from
  host phospholipids (the hemolytic phospholipase C plcH, the phosphorylcholine
  phosphatase pchP and the acetylcholine esterase choE), quaternary amine uptake
  (betX, cbcXWV) and the full catabolic route from glycine betaine through
  dimethylglycine, sarcosine, glycine and serine to pyruvate. A gbdR mutant
  cannot grow on glycine betaine or dimethylglycine and fails to induce plcH
  and pchP in lung surfactant.
references:
- id: PMID:17951379
  title: Identification of two gene clusters and a transcriptional regulator required
    for Pseudomonas aeruginosa glycine betaine catabolism.
  findings:
  - statement: gbdR, a predicted AraC regulator, is required for growth on GB and DMG
      and for induction of the GB and DMG catabolic genes.
    supporting_text: Our screen also identified a predicted AraC
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IDA GO:0006355 seed row of PTN000111456 and for
      the catabolic-process rows. Abstract only. The abstract identifies GbdR
      as a regulator required for induction of the catabolic genes; the
      catabolic steps themselves belong to GbcAB and DgcAB.
- id: PMID:19103776
  title: GbdR regulates Pseudomonas aeruginosa plcH and pchP transcription in response
    to choline catabolites.
  findings:
  - statement: GbdR mediates glycine betaine induction of plcH and pchP transcription.
    supporting_text: Here we report that the induction of plcH and pchP transcription
      by glycine betaine is mediated by GbdR, an AraC family transcription factor.
  - statement: MBP-GbdR binds the plcH and pchP promoters in EMSA.
    supporting_text: In electrophoretic mobility shift assays, a GbdR-maltose binding
      protein fusion bound specifically to both the plcH and pchP promoters.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Source of the CollecTF rows and of the PseudoCAP
      phospholipase/phosphatase activity rows. The paper shows transcriptional
      activation of plcH and pchP; reduced PlcH activity in the mutant is a
      consequence of lost plcH induction.
- id: PMID:24097953
  title: Characterization of the GbdR regulon in Pseudomonas aeruginosa.
  findings:
  - statement: GbdR activates 26 genes from 12 promoters, 11 bound by GbdR in vitro.
    supporting_text: Here we show that GbdR activation regulates transcription of
      26 genes from 12 promoters, 11 of which have measureable binding to GbdR in
      vitro .
  - statement: GbdR directly regulates the genes for every step from GB to pyruvate.
    supporting_text: as it directly regulates transcription of the genes involved
      in all steps of conversion from GB to pyruvate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. PseudoCAP source for the IMP GO:0006355 seed row of
      PTN000111456. EMSA, DNase I footprinting and transcriptomics.
