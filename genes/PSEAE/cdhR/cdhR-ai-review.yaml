suggested_questions:
- question: >-
    Does CdhR bind carnitine (or a catabolite such as 3-dehydrocarnitine) directly, and where does it
    bind in the cdh promoter?
suggested_experiments:
- description: >-
    Electrophoretic mobility shift and DNase I footprinting of purified CdhR on the PA5388 promoter, with
    and without carnitine, plus ligand binding by isothermal titration calorimetry.
