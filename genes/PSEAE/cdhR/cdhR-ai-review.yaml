id: Q9HTH5
gene_symbol: cdhR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CdhR (PA5389) is a 336-residue AraC/XylS-family transcriptional activator of Pseudomonas aeruginosa
  that controls carnitine catabolism. It has an N-terminal DJ-1/PfpI-like (class I glutamine amidotransferase-like)
  domain, as in ArgR and GbdR, and a C-terminal AraC-type helix-turn-helix DNA-binding domain. CdhR is
  required for carnitine to induce the adjacent PA5388-PA5384 (cdh) genes, which encode carnitine dehydrogenase
  and the other enzymes that convert carnitine via 3-dehydrocarnitine towards glycine betaine. A cdhR
  mutant cannot grow on carnitine as sole carbon and nitrogen source.
