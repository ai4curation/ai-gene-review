suggested_questions:
- question: >-
    Should GO have a proton-coupled lipid-linked oligosaccharide flippase activity term? The existing
    floppase terms (including GO:0015161 lipid III floppase activity, whose definition describes the
    enterobacterial common antigen repeat-unit flip) sit under ATP-driven floppase activity, which does
    not fit MOP-family Wzx proteins.
suggested_experiments:
- description: >-
    Reconstitute purified Wzx with Und-PP-linked O units in proteoliposomes and measure their transbilayer
    movement as a function of a proton gradient, to show substrate translocation directly.
