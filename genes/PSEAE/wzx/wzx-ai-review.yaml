- term:
    id: GO:0015297
    label: antiporter activity
  evidence_type: EXP
  original_reference_id: PMID:24023388
  qualifier: enables
  review:
    summary: >-
      PseudoCAP EXP. Purified Wzx in proteoliposomes mediated electrogenic, pH-modulated anion flux and
      proton uptake, leading to a proposed H+/O-unit antiport mechanism.
    action: ACCEPT
    reason: >-
      Full text read (cached). The coupling of anion flux to proton movement was shown with purified
      protein, and conserved acidic residues are needed for it. The natural substrate (Und-PP-O unit) was
      not itself transported in the assay, so the antiport of the lipid-linked substrate is inferred; GO
      has no term for a proton-coupled lipid-linked oligosaccharide flippase (the floppase terms are
      defined as ATP-driven), so antiporter activity is as precise as GO allows.
    supported_by:
    - reference_id: PMID:24023388
      supporting_text: >-
        These results indicate H(+)-dependent gating and H(+) uptake by WzxPa and allow for the first
        H(+)-dependent antiport mechanism to be proposed for lipid-linked oligosaccharide translocation
        across the bacterial IM.
