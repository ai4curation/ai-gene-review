id: G3XD19
gene_symbol: wzx
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  wzx (PA3153) encodes the O-antigen flippase of the B-band (O-specific antigen) lipopolysaccharide of
  Pseudomonas aeruginosa PAO1, a member of the polysaccharide transporter (PST/MOP) family. Wzx is a
  polytopic inner-membrane protein with 12 transmembrane segments that translocates undecaprenyl
  pyrophosphate-linked O-antigen repeat units from the cytoplasmic to the periplasmic leaflet of the inner
  membrane, where Wzy polymerises them and WaaL ligates the polymer to lipid A-core. Charged and aromatic
  residues in transmembrane segments 2 and 8 line a cationic central lumen needed for function, and the
  purified protein reconstituted in proteoliposomes mediates electrogenic, pH-modulated anion flux and
  proton uptake, supporting a proton-coupled antiport mechanism. Chromosomal wzx mutants lack B-band LPS
  and show delayed A-band LPS synthesis.
