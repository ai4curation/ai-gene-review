id: G3XCV1
gene_symbol: pvdS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdS (PA2426) is the iron-starvation extracytoplasmic function (ECF) sigma factor of Pseudomonas
  aeruginosa PAO1. pvdS transcription is repressed by Fur in iron-replete cells. Under iron
  limitation PvdS binds core RNA polymerase, about 1:1, and directs the holoenzyme to promoters
  carrying the iron-starvation (IS) box, which acts as its -35 element. It drives transcription
  of the pyoverdine biosynthesis genes (pvdA, pvdD, pvdE, pvdF and others) and of the virulence
  genes toxA (exotoxin A), prpL and regA/ptxR. Its activity is modulated by ferri-pyoverdine
  through the FpvA receptor and the inner-membrane anti-sigma factor FpvR. FpvR retains part
  of the PvdS pool at the membrane; pyoverdine signalling releases it to the cytosol. PvdS
  is therefore the key transcriptional link between iron starvation, siderophore production
  and virulence factor expression.
references:
- id: PMID:10873648
  title: Characterization of an ECF sigma factor protein from Pseudomonas aeruginosa.
  findings:
  - statement: Purified His-PvdS directs E. coli core RNAP to pyoverdine promoters and supports
      in vitro transcription; PvdS co-purifies with P. aeruginosa RNAP.
    supporting_text: The purified protein caused core RNA polymerase from Escherichia coli
      to bind specifically to the promoters of pyoverdine synthesis genes and enabled transcription
      from these promoters in vitro
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA sigma factor activity (IBD seed). Abstract only, but the abstract itself
      states the decisive experiment: purified PvdS confers promoter-specific binding and
      in vitro transcription on core RNAP. This is direct evidence for the term.
- id: PMID:10692351
  title: Functional analysis of PvdS, an iron starvation sigma factor of Pseudomonas aeruginosa.
  findings:
  - statement: PvdS forms 1:1 complexes with core RNAP and promotes holoenzyme binding to
      the pvdA promoter in vitro.
    supporting_text: it spontaneously forms 1:1 complexes with the core fraction of RNA polymerase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA sigma factor activity (IBD seed) and IDA positive regulation of secondary
      metabolite biosynthetic process. Abstract only. The abstract states core-RNAP binding
      and holoenzyme promoter binding (direct evidence), though the purified holoenzyme did
      not transcribe pvdA in vitro.
- id: PMID:7751284
  title: 'Cloning and characterization of pvdS, a gene required for pyoverdine synthesis in
    Pseudomonas aeruginosa: PvdS is probably an alternative sigma factor.'
  findings:
  - statement: pvdS is required for, and sufficient in E. coli for, expression from pyoverdine
      gene promoters.
    supporting_text: The pvdS gene is required for expression from promoters of at least two
      pyoverdine synthesis genes and can cause expression from these promoters in Escherichia
      coli, where they are otherwise inactive
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IMP regulation of DNA-templated transcription, seed of the GO:0006355 IBD.
      Abstract only; the abstract states loss- and gain-of-function promoter-expression data,
      which directly support the term.
- id: PMID:11222621
  title: Analysis of promoters recognized by PvdS, an extracytoplasmic-function sigma factor
    protein from Pseudomonas aeruginosa.
  findings:
  - statement: PvdS-RNAP requires the IS box to bind and initiate transcription at pvd promoters;
      the IS box is the PvdS -35 element.
    supporting_text: Band shift assays and in vitro transcription experiments showed that
      a complex of PvdS and core RNA polymerase required the presence of an IS box in order
      to bind to and initiate transcription from pvd promoters
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      CollecTF source (IMP/IDA rows). Full text cached. Defines the IS box as a sequence-specific
      recognition element of PvdS-RNAP.
- id: PMID:7651323
  title: A positive regulatory gene, pvdS, for expression of pyoverdin biosynthetic genes
    in Pseudomonas aeruginosa PAO.
  findings:
  - statement: A pvdS null mutant makes no pyoverdine and does not transcribe pvd promoters.
    supporting_text: A genomic pvdS mutant of PAO, constructed by allelic exchange mutagenesis,
      produced no pyoverdin and did not allow transcription from the pvd promoters
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; supports the IMP row.
- id: PMID:8636031
  title: 'Iron-regulated transcription of the pvdA gene in Pseudomonas aeruginosa: effect
    of Fur and PvdS on promoter activity.'
  findings:
  - statement: pvdA promoter activity requires PvdS.
    supporting_text: Transcription from the pvdA promoter did not occur in a heterologous
      host unless in the presence of the pvdS gene in trans and was abrogated in a pvdS mutant
      of P. aeruginosa
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; supports the IMP row.
- id: PMID:18048935
  title: Regulation of the Pseudomonas aeruginosa toxA, regA and ptxR genes by the iron-starvation
    sigma factor PvdS under reduced levels of oxygen.
  findings:
  - statement: PvdS-RNAP binds the toxA, regA and ptxR promoters; pyoverdine production requires
      PvdS.
    supporting_text: optimal toxA, regA and pvdD expression and pyoverdine production required
      PvdS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; supports the IMP row.
- id: PMID:18047579
  title: Intracellular levels and activity of PvdS, the major iron starvation sigma factor
    of Pseudomonas aeruginosa.
  findings:
  - statement: About 30% of PvdS is membrane-retained; pyoverdine signalling releases it to
      the cytosol.
    supporting_text: Pyoverdine signalling does not affect the PvdS cellular content but facilitates
      PvdS release from the membrane
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Quantifies PvdS, RpoD and RNAP and shows pyoverdine-dependent release
      of PvdS from the membrane. The abstract does not describe a pyoverdine-production assay.
      The full text presumably links PvdS activity to pvd expression, which the curator used
      for the IDA row; deferred to the curator.
- id: PMID:15073293
  title: Global regulation of quorum sensing and virulence by VqsR in Pseudomonas aeruginosa.
  findings:
  - statement: A vqsR mutant has reduced siderophore-gene transcripts.
    supporting_text: the vqsR mutant harboured less mRNA transcript for the production of
      siderophores
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Abstract only. The paper is about VqsR (PA2591); the abstract does not mention pvdS.
      If pvdS appears in the vqsR microarray, that would show VqsR acting on pvdS, not PvdS
      regulating biosynthesis. The full text could not be read; see the source defect on the
      IMP row.
- id: PMID:8633080
  title: 'Gene repression by the ferric uptake regulator in Pseudomonas aeruginosa: cycle
    selection of iron-regulated genes.'
  findings:
  - statement: pvdS is a direct Fur target, an iron-repressed gene.
    supporting_text: While four PIGs are identical to already known genes (pfeR, pvdS, tonB,
      and fumC, respectively)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; Fur SELEX and RNase protection show iron-repressed pvdS expression.
- id: PMID:29729420
  title: Extracytoplasmic function sigma factors in Pseudomonas aeruginosa.
  findings:
  - statement: Review grouping the P. aeruginosa ECF sigma factors by function.
    supporting_text: the iron starvation σ (PvdS, FpvI, HasI, FecI, FecI2 and others), the
      cell wall stress ECFσ AlgU, SigX and SbrI, and the unorthodox σVreI involved in the
      expression of virulence
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review; abstract only in cache.
