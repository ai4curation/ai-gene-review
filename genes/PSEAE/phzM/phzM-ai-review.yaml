    SAM-dependent N-methyltransferase that methylates N5 of
    phenazine-1-carboxylate to give 5-methylphenazine-1-carboxylate, the first
    of the two steps from PCA to pyocyanin; it is active only together with
    PhzS, which takes up the intermediate.
