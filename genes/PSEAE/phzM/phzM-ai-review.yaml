suggested_questions:
- question: >-
    Should GO:0102168 (5-methyl-phenazine-1-carboxylate N-methyltransferase
    activity), currently only is_a GO:0008168, be placed under GO:0008757
    S-adenosylmethionine-dependent methyltransferase activity and GO:0008170
    N-methyltransferase activity, as its SAM-dependent reaction requires?
- question: >-
    How does PhzS activate PhzM, and is 5-methyl-PCA channelled between them?
- question: >-
    Do the PTHR43712 cluster coactivators tpcD (Q4WQZ4) and mdpA (C8VQ72)
    keep the SAM-binding and catalytic residues? If not, they should not
    inherit the PTN002463933 methyltransferase IBA.
suggested_experiments:
- description: >-
    Co-crystallize PhzM with SAH and PCA, or a PhzM-PhzS complex trapped by
    cross-linking, and test PhzM activity with catalytically inactive PhzS
    variants. This would separate activation by binding from activation by
    product removal.
