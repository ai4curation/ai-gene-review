id: Q9HWH2
gene_symbol: phzM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PhzM is the phenazine-1-carboxylate N-methyltransferase (EC 2.1.1.327) of
  Pseudomonas aeruginosa PAO1. It transfers a methyl group from
  S-adenosyl-L-methionine to N5 of phenazine-1-carboxylate (PCA), giving
  5-methylphenazine-1-carboxylate. The flavin monooxygenase PhzS then converts
  this unstable intermediate into the blue redox-active virulence pigment
  pyocyanin. PhzM is a class I SAM-dependent methyltransferase related to plant
  O-methyltransferases such as isoflavone O-methyltransferase. It is a
  homodimer: an N-terminal dimerization domain forms an intertwined interface
  that also lines the partner subunit's active site, and a C-terminal Rossmann
  domain carries the SAM-binding motif. Purified PhzM alone shows no detectable
  activity on PCA. Pyocyanin is made readily when PhzS and NADH are present,
  and only when the two enzymes can meet, which suggests that a transient
  PhzM-PhzS interaction activates methylation and keeps the intermediate from
  being released. phzM insertion mutants lack pyocyanin, and phzM expression
  is a control point for pyocyanin output (for example by Crc binding to phzM
  mRNA).
