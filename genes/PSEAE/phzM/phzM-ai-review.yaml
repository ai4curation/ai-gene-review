- term:
    id: GO:0008757
    label: S-adenosylmethionine-dependent methyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:17253782
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA, the sole seed of the PTN002463933 IBD. Parsons et al.
      reconstituted pyocyanin synthesis from PCA with purified PhzM and PhzS:
      product formation needed SAM as well as both enzymes, NADH and O2. PhzM
      alone did not consume SAM or PCA, which the authors attribute to a need
      for activation by PhzS rather than to a lack of activity. The class I
      methyltransferase fold and the DVGGGXG SAM motif assign the methyl
      transfer to PhzM, not to the flavin hydroxylase PhzS.
    action: ACCEPT
    reason: >-
      The paper directly supports SAM-dependent methyl transfer by PhzM in a
      defined system with purified proteins; this is the gene's own catalytic
      activity, not a mutant phenotype. The seed is sound.
    supported_by:
    - reference_id: PMID:17253782
      supporting_text: >-
        Pyocyanin formation required PhzM, PhzS, PCA, SAM, oxygen, and NADH
        consistent with a methyl transfer reaction and a flavin-mediated
        hydroxylation.
    - reference_id: PMID:17253782
      supporting_text: >-
        PhzM possesses the highly conserved DVGGGXG motif (residues 173–179)
        that defines the SAM binding site of methyltransferase enzymes
        suggesting that PhzM does indeed function as a methyltransferase.
    - reference_id: PMID:17253782
      supporting_text: >-
        Incubations of PhzM with its presumed substrates, PCA, and SAM, yielded
        no detectable product and substrate concentrations were unchanged after
        extended incubations.
