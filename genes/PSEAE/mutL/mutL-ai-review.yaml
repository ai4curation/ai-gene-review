id: Q9HUL8
gene_symbol: mutL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: Pseudomonas aeruginosa MutL is the dimeric GHKL-ATPase coordinator and strand-incision endonuclease
  of a mismatch repair system that lacks MutH and Dam methylation. Its N-terminal domain binds and hydrolyses
  ATP and allosterically controls the C-terminal dimerization domain, which carries the conserved DQHA(X)2E(X)4E
  metal-binding motif and a metal ion-dependent endonuclease activity. Purified PaMutL nicks covalently
  closed duplex plasmid DNA without sequence specificity and without needing single-stranded DNA or a
  single/double-strand boundary. The motif residues are required for in vivo mismatch repair, and the
  protein complements an E. coli mutL mutant, so its ATPase and MutS-interaction surfaces are conserved
  with the MutH-dependent E. coli protein.
