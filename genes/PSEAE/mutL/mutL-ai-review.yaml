  review:
    summary: Mismatched DNA binding propagated from InterPro MutL signatures.
    action: REMOVE
    reason: Mismatch recognition is the role of MutS; MutL is recruited by mismatch-bound MutS and PaMutL
      nicks DNA without sequence or structure specificity. The InterPro mapping conflates recruitment
      with mismatch sensing. Same decision as for PSEPK MutL.
    supported_by:
    - reference_id: PMID:23969026
      supporting_text: PaMutL, as well as Bacillus thuringiensis MutL homologue, did not show DNA sequence
        specificity
