  - UniProtKB:Q5JI38
  review:
    summary: Agmatinase activity propagated from PAINT node PTN000144486 into the HutG formimidoylglutamase
      subfamily.
    action: REMOVE
    reason: PA3175 sits in PTHR11358:SF35, the formimidoylglutamase subfamily, which has diverged from
      the agmatinase ancestor to hydrolyse the formimino group of N-formimidoyl-L-glutamate. The purified
      enzyme was characterized as a formimidoylglutamase and no agmatine turnover has been reported. The
      PTHR11358 family review records SF35 as diverged and excludes it from the agmatinase grant, so this
      is an over-propagation below the seeded node.
    propagation_review: &id001
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000144486
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Agmatinase node seeded by agmatinases and plant arginase/agmatinase enzymes; the SF35
          formimidoylglutamase clade below it has diverged to N-formimidoyl-L-glutamate hydrolysis.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11358/PTHR11358-review.yaml
      supporting_text: This does not extend agmatinase
    - reference_id: file:PSEAE/PA3175/PA3175-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR11358:SF35; FORMIMIDOYLGLUTAMASE; 1.
    - reference_id: PMID:16475788
      supporting_text: The protein Pa3175 is dislocated from the hut operon and was shown to catalyze
        the hydrolysis of N-formimino-L-glutamate to formamide and L-glutamate.
