  review:
    summary: Deletion of hutE (PA3175) removes the four-step histidine utilization branch, which is dispensable
      only when the HutF/HutG branch is present.
    action: ACCEPT
    reason: Genetic analysis by Gerth et al. shows that the HutE branch alone supports histidine utilization
      and confers a fitness advantage when histidine is the sole carbon source, establishing that PA3175
      acts in the pathway in vivo.
    supported_by:
