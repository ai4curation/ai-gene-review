taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA3175 (HutE) of Pseudomonas aeruginosa is a homodimeric, binuclear manganese formimidoylglutamase
  (EC 3.5.3.8) of the arginase (ureohydrolase) family. It hydrolyses N-formimidoyl-L-glutamate directly
  to L-glutamate and formamide, providing a one-step terminal branch of histidine utilization that operates
  in parallel with the two-step HutF/HutG branch. The gene lies outside the main hut operon in the hutRE
  module, which appears to have been acquired by horizontal transfer.
