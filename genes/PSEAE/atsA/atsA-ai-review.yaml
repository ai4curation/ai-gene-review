id: P51691
gene_symbol: atsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AtsA (PA0183) is the arylsulfatase (aryl-sulfate sulfohydrolase, EC 3.1.6.1) of Pseudomonas aeruginosa.
  It hydrolyses aryl sulfate esters such as 4-nitrocatechol sulfate to the phenol and inorganic sulfate,
  which lets the bacterium use aromatic sulfate esters as a sulfur source. Its synthesis is repressed
  by sulfate, cysteine or thiocyanate and derepressed under sulfate limitation. It is a soluble, monomeric
  member of the alkaline-phosphatase-fold sulfatase family that, unlike most sulfatases, lacks a signal
  peptide and is presumed cytoplasmic. Catalysis depends on a Calpha-formylglycine generated post-translationally
  from Cys51 and on an active-site Ca2+ ion; the 1.3 A crystal structure shows the formylglycine resting
  as a hydrate that attacks the sulfur atom of the substrate. In vitro the enzyme also hydrolyses phosphate
  monoesters with a high rate acceleration, a promiscuous activity of uncertain physiological relevance.
references:
- id: PMID:7744061
  title: Purification and characterization of the arylsulfatase synthesized by Pseudomonas aeruginosa
    PAO during growth in sulfate-free medium and cloning of the arylsulfatase gene (atsA).
  findings:
  - statement: >-
      Arylsulfatase purified to homogeneity from PAO1; Km 105 microM for 4-nitrocatechol sulfate; sulfate-repressed;
      atsA cloned by complementation.
    supporting_text: An arylsulfatase (EC 3.1.6.1) was extracted from Pseudomonas aeruginosa PAO1 and
      purified 2700-fold to homogeneity
  - statement: >-
      AtsA lacks a signal peptide, suggesting a cytoplasmic location.
    supporting_text: The lack of this signal peptide suggests that the P. aeruginosa arylsulfatase is
      neither periplasmic nor membrane-associated
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0004065 seed row. Abstract only in cache, but the abstract states
      the purification and kinetic assay directly.
- id: PMID:9748219
  title: Posttranslational formation of formylglycine in prokaryotic sulfatases by modification of either
    cysteine or serine.
  findings:
  - statement: >-
      AtsA carries formylglycine derived from a cysteine; the Cys-to-Ser mutant is inactive.
    supporting_text: Substituting the relevant cysteine by a serine codon in the P. aeruginosa gene led
      to expression of inactive sulfatase protein, lacking the formylglycine
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: UniProt-cited IDA source; abstract only in cache.
- id: PMID:11435113
  title: 1.3 A structure of arylsulfatase from Pseudomonas aeruginosa establishes the catalytic mechanism
    of sulfate ester cleavage in the sulfatase family.
  findings:
  - statement: >-
      Crystal structure shows a formylglycine hydrate as the catalytic residue and Ca2+ in the active
      site.
    supporting_text: unequivocally showing the presence of a Calpha-formylglycine hydrate as the key catalytic
      residue
  - statement: The active-site cation is calcium.
    supporting_text: The metal cation involved in stabilizing the charge and anchoring the substrate during
      catalysis is established as calcium
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Structural basis of the catalytic mechanism; abstract only in cache.
- id: PMID:19554727
  title: 'Efficient catalytic promiscuity in an enzyme superfamily: an arylsulfatase shows a rate acceleration
    of 10(13) for phosphate monoester hydrolysis.'
  findings:
  - statement: >-
      AtsA hydrolyses phosphate monoesters as a promiscuous second activity.
    supporting_text: Besides hydrolyzing sulfate monoesters, this enzyme catalyzes the hydrolysis of phosphate
      monoesters with multiple turnovers
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited by PseudoCAP for GO:0008081 phosphoric diester hydrolase activity; the abstract and title
      report phosphate monoester hydrolysis, so the term appears mis-chosen (see source defect). Abstract
      only in cache.
