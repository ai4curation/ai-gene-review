- term:
    id: GO:0008081
    label: phosphoric diester hydrolase activity
  evidence_type: IDA
  original_reference_id: PMID:19554727
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA phosphoric diester hydrolase activity citing Olguin et al. 2008. The title and abstract
      of that paper describe hydrolysis of phosphate monoesters, not diesters, as a promiscuous second
      activity of AtsA (kcat 620-fold below the sulfatase activity).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Two problems. The term does not match the cited result (monoester, not diester; GO:0008081 is defined
      as phosphodiester hydrolysis). And the measured activity is a promiscuous in vitro activity of a
      dedicated arylsulfatase, of unknown physiological relevance, so it should not stand beside the core
      function. The fitting term for what this paper measured is GO:0016791 phosphatase activity (phosphoric
      monoester hydrolysis).
    supported_by:
    - reference_id: PMID:19554727
      supporting_text: Besides hydrolyzing sulfate monoesters, this enzyme catalyzes the hydrolysis of
        phosphate monoesters with multiple turnovers
    - reference_id: PMID:19554727
      supporting_text: Promiscuous phosphatase and original sulfatase activities only differ by a factor
        of 620
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0008081
      corrected_value: GO:0016791
      corrected_label: phosphatase activity
      confidence: PROBABLE
      explanation: >-
        The PseudoCAP IDA on PA0183 atsA to PMID:19554727 uses GO:0008081 phosphoric diester hydrolase
        activity. The title and abstract of that paper report hydrolysis of phosphate monoesters (kcat
        0.023 s-1, KM 29 microM) and do not mention diesters. GO:0016791 phosphatase activity (hydrolysis
        of a phosphoric monoester) fits the reported result. Only the abstract was read; if the full text
        also reports diester hydrolysis the original term could stand for that part. Either way this is
        a promiscuous activity of the arylsulfatase. This row does not seed a PAINT IBD on the worklist.
      supported_by:
      - reference_id: PMID:19554727
        supporting_text: Besides hydrolyzing sulfate monoesters, this enzyme catalyzes the hydrolysis
          of phosphate monoesters with multiple turnovers
