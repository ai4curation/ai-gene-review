suggested_questions:
- question: >-
    Which aryl sulfate esters does AtsA hydrolyse in the natural environment or host, and does its cytoplasmic
    location imply that the substrates are first imported?
- question: >-
    Does PseudoCAP intend GO:0008081 for a phosphodiester activity reported in the full text of PMID:19554727
    or in a later paper, or should the row be re-termed to phosphatase activity?
suggested_experiments:
- description: >-
    Confirm the subcellular location of AtsA by fractionation with cytoplasmic and periplasmic markers,
    and profile aryl sulfate uptake in an atsA mutant grown on aromatic sulfates as sole sulfur source.
