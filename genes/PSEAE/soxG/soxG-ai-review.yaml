  knowledge_gaps:
  - gap_statement: >-
      What the gamma subunit contributes is unknown. It has no cofactor and no catalytic
      motif, and has only been tested as part of the operon. Its record carries a
      TrmE/GcvT-like fold assignment, the same broad group as the folate-binding region of
      the alpha subunit, which raises but does not answer the question of whether gamma
      participates in handing the methylene group to tetrahydrofolate or instead holds the
      complex together.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    SoxG carries a TrmE/GcvT-like fold assignment, shared with the folate-binding region of
    the alpha subunit. Does the gamma chain contribute to tetrahydrofolate binding in the
    heterotetramer, or is the resemblance confined to the fold?
- question: >-
    Is SoxG needed for assembly of the complex or only for its turnover? soxG has no
    tetrahydrofolate metabolic process row in GOA where the other three subunits do, and it
    is worth establishing whether that asymmetry reflects anything biological or only
    InterPro2GO mapping coverage.
suggested_experiments:
- description: >-
    Assay tetrahydrofolate binding to purified SoxG, by isothermal titration calorimetry or a
    folate-analogue pulldown, to test whether the TrmE/GcvT-like fold assignment corresponds
    to a real folate site.
- description: >-
    Compare sarcosine-dependent turnover and complex assembly of recombinant SoxBDA with and
    without SoxG, to determine whether the gamma subunit is required for activity, for
    assembly, or for neither in vitro.
