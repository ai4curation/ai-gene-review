gene_symbol: soxG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SoxG (PA5419) is the gamma subunit, 211 residues, of the heterotetrameric sarcosine oxidase
  of Pseudomonas aeruginosa. The complex converts sarcosine (N-methylglycine) to glycine in
  the terminal step of glycine betaine catabolism, transferring the methylene group to
  tetrahydrofolate. SoxG carries a conserved subunit family signature specific to the gamma
  chain of the heterotetrameric enzyme, but no cofactor or catalytic domain of its own, so it
  contributes to the activity of the assembled complex rather than catalysing the reaction;
  the flavin-dependent active site lies on the beta subunit. The soxBDAG operon acts
  downstream of the glycine betaine and dimethylglycine demethylases in the cytoplasmic
  pathway that lets the organism use glycine betaine, and the choline and carnitine it
  derives from, as a carbon and nitrogen source.
