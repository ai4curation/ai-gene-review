    summary: >-
      InterPro2GO mapping from IPR006280, the signature for the gamma subunit of the
      heterotetrameric sarcosine oxidase specifically, to the activity of the holoenzyme.
      The signature correctly identifies this protein as that subunit; what it cannot do is
      make the gamma subunit the catalyst.
    action: ACCEPT
    reason: >-
      The claim is true of the complex SoxG belongs to, so the row is kept rather than
      removed, and the signature is unusually apt - it names the gamma chain of the
      heterotetrameric enzyme rather than a generic fold. The relation is the problem, not
      the term: SoxG has no cofactor and no catalytic domain, so it contributes to the
      activity rather than enabling it. The qualifier correction is recorded once, as a
      defect on the IMP row below, so the upstream request is not duplicated across two rows
      of the same gene.
