- term:
    id: GO:0008115
    label: sarcosine oxidase activity
  evidence_type: IMP
  original_reference_id: PMID:17951386
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row asserting sarcosine oxidase activity on the gamma subunit from a mutant
      phenotype. Two separate problems: the cited paper is a Staphylococcus aureus QacA
      efflux-transporter study and not about this organism at all, and the enables qualifier
      attributes the holoenzyme's catalysis to a subunit that carries no cofactor.
    action: ACCEPT
    reason: >-
      Kept, with both faults recorded as defects rather than discarded. The underlying claim
      - that SoxG belongs to the sarcosine oxidase that performs this step in P. aeruginosa
      - is sound on the correct paper plus the subunit-specific family signature. What the
      mutant phenotype shows is that the operon is required for sarcosine catabolism, which
      is necessity rather than evidence about which chain does the chemistry, so the
      relation should be contributes_to.
    supported_by:
    - reference_id: PMID:17951379
      reference_section_type: ABSTRACT
      supporting_text: >-
        Mutant analyses and 13 C NMR studies also confirmed that the soxBDAG genes,
        predicted to encode a sarcosine oxidase, are required for sarcosine catabolism
    - reference_id: PMID:17951379
