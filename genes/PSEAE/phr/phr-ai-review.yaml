taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Phr (PA4660) is the class I cyclobutane pyrimidine dimer (CPD) DNA photolyase
  of Pseudomonas aeruginosa, a member of the photolyase/cryptochrome family
  with an N-terminal photolyase domain and a C-terminal FAD-binding domain.
  By homology to E. coli PhrB it binds FAD as the catalytic cofactor and a
  folate antenna chromophore, recognizes CPDs formed between adjacent
  pyrimidines by UV light, and uses blue/near-UV light energy to split the
  dimer back to two pyrimidines (EC 4.1.99.3), a direct reversal repair called
  photoreactivation. The cloned PAO1 gene complements a photolyase-deficient
  E. coli strain, and phr insertion mutants survive UV-B irradiation less well
  than wild type when allowed to recover in light, an effect that is much
  larger in a nucleotide-excision-repair (uvrA) background.
references:
- id: PMID:11282583
  title: 'Construction and analysis of photolyase mutants of Pseudomonas aeruginosa
    and Pseudomonas syringae: contribution of photoreactivation, nucleotide excision
    repair, and mutagenic DNA repair to cell survival and mutability following exposure
    to UV-B radiation.'
  findings:
  - statement: The cloned PAO1 phr gene complements a photolyase-deficient E. coli strain.
    supporting_text: shown to complement a known phr mutation following expression
      in Escherichia coli SY2
  - statement: phr mutants have reduced UV-B survival when recovered under photoreactivating light.
    supporting_text: These mutants showed a decrease in survival compared to the wild
      type of as much as 19-fold after irradiation at UV-B doses of 1,000 to 1,550
  - statement: Survival defect is measured after recovery in photoreactivating light.
    supporting_text: followed by a recovery period under photoreactivating conditions
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IMP source for GO:0009650 UV protection and a seed of the
      PTN000155970 IBD. Abstract in cache; PMC full text (PMC92747) also read
      online. Genetic evidence for photoreactivation: complementation of E. coli
      SY2 (phr uvrA recA) and light-dependent UV-B survival of PAO1 mutants.
