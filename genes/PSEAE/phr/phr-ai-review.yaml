suggested_questions:
- question: >-
    The PhrB seed of PTN000155970 is annotated to GO:0007603 phototransduction,
    visible light (IDA, PMID:6325459). Is a signalling term appropriate for a
    DNA repair photolyase, or should that row be photoreactive repair?
