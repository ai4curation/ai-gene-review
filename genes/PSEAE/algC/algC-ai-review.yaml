    correctness: VERIFIED
    review_notes: >-
      Full text cached; algC deletion abolishes Psl and Pel and precursor
      competition among exopolysaccharides is shown.
  findings:
  - statement: AlgC is required for Psl and Pel as well as alginate and LPS precursors.
    supporting_text: Here we demonstrated that AlgC, a key enzyme that provides sugar precursors for the synthesis of alginate and lipopolysaccharides (LPS) is also required for both Psl and Pel production.
  - statement: AlgC is proposed to act as a checkpoint controlling the sugar precursor pool.
    supporting_text: we propose that AlgC is a key checkpoint enzyme that coordinates the total amount of exopolysaccharide biosynthesis by controlling sugar precursor pool
- id: PMID:23517223
  title: Identification of an essential active-site residue in the α-D-phosphohexomutase
    enzyme superfamily.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      His329 identified as the probable general base; H329A crystal
      structure (PDB 4IL8) with bound Mg2+. Abstract-only in cache.
  findings:
  - statement: His329 is critical for catalysis and likely acts as the general base.
    supporting_text: His329 is appropriately positioned to abstract a proton from the O1/O6 hydroxyl of the phosphosugar substrates, and thus may serve as the general base in the reaction
- id: PMID:7515870
  title: The Pseudomonas aeruginosa algC gene encodes phosphoglucomutase, required
    for the synthesis of a complete lipopolysaccharide core.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the PGM activity of AlgC and its requirement for a complete LPS core.
  findings:
  - statement: algC mutants lack PMM and PGM activity, and algC complements an E. coli pgm mutant.
    supporting_text: we transferred the cloned, intact P. aeruginosa algC gene to a pgm mutant of Escherichia coli and observed complementation of the pgm phenotype
- id: PMID:8050998
  title: Purification and characterization of phosphomannomutase/phosphoglucomutase
    from Pseudomonas aeruginosa involved in biosynthesis of both alginate and lipopolysaccharide.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purification, substrate specificity, kinetics and Mg2+ requirement of AlgC.
  findings:
  - statement: Purified AlgC is a monomer with both PMM and PGM activity and a twofold preference for G1P by kcat/Km.
    supporting_text: The enzyme catalyzed the interconversion of mannose 1-phosphate (M1P) and mannose 6-phosphate, as well as that of glucose 1-phosphate (G1P) and glucose 6-phosphate.
  - statement: Minor activity on ribose 1-phosphate and 2-deoxyglucose 6-phosphate.
    supporting_text: PMM also catalyzed the conversion of ribose 1-phosphate and 2-deoxyglucose 6-phosphate to their corresponding isomers, although activities were much lower.
- id: PMID:10481091
  title: The Pseudomonas aeruginosa algC gene product participates in rhamnolipid biosynthesis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      algC mutant lacks rhamnolipid; the authors infer AlgC supplies
      glucose 1-phosphate for dTDP-L-rhamnose. Abstract-only in cache.
  findings:
  - statement: AlgC is required for rhamnolipid production, presumably by making glucose 1-phosphate for dTDP-L-rhamnose synthesis.
    supporting_text: presumably catalyzing the first step in the deoxy-thymidine-diphospho-L-rhamnose (dTDP-L-rhamnose) pathway, the conversion of glucose-6-phosphate to glucose-1-phosphate
- id: PMID:11839312
  title: 'Crystal structure of PMM/PGM: an enzyme in the biosynthetic pathway of P.
    aeruginosa virulence factors.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: First crystal structure; four-domain fold with a central active-site cleft.
  findings:
  - statement: AlgC has four domains, three with a similar fold, all contributing to the active-site cleft.
    supporting_text: Residues from all four domains of the protein contribute to the formation of a large active site cleft in the center of the molecule.
- id: PMID:14725765
  title: Structural basis of diverse substrate recognition by the enzyme PMM/PGM from
    P. aeruginosa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Enzyme-substrate complexes with G1P, G6P, M1P and M6P explain dual specificity.
  findings:
  - statement: A single active site accommodates both glucose and mannose phosphosugars.
    supporting_text: The ability of PMM/PGM to accommodate these four diverse substrates in a single active site is consistent with its highly reversible phosphoryl transfer reaction and allows it to function in multiple biosynthetic pathways in P. aeruginosa.
- id: PMID:11716469
  title: Kinetic mechanism and pH dependence of the kinetic parameters of Pseudomonas
    aeruginosa phosphomannomutase/phosphoglucomutase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Steady-state kinetic mechanism, phosphoenzyme at Ser108, bisphosphate intermediate.
  findings:
  - statement: The reaction proceeds through a bisphosphorylated sugar intermediate that reorients in the active site.
    supporting_text: This phenomenon is consistent with a mechanism in which the enzyme phosphorylates the substrate to generate a bisphosphorylated intermediate that reorients in the active site to return its original phosphoryl group to the enzyme and generate the observed product.
- id: PMID:16595672
  title: 'The reaction of phosphohexomutase from Pseudomonas aeruginosa: structural
    insights into a simple processive enzyme.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structures with glucose 1,6-bisphosphate intermediate; processive 180-degree reorientation.
  findings:
  - statement: The intermediate reorients without dissociating from the active site.
    supporting_text: Reorientation of the intermediate occurs without dissociation from the active site of the enzyme and is, thus, a simple example of processivity
- id: PMID:16880541
  title: Complexes of the enzyme phosphomannomutase/phosphoglucomutase with a slow
    substrate and an inhibitor.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Ribose 1-phosphate and xylose 1-phosphate complexes; describes the Mg2+-binding loop.
  findings:
  - statement: The active-site cleft contains phosphoserine 108 and a Mg2+-binding loop required for activity.
    supporting_text: a metal-binding loop which coordinates the Mg 2+ ion necessary for activity
- id: PMID:18690721
  title: Backbone flexibility, conformational change, and catalysis in a phosphohexomutase
    from Pseudomonas aeruginosa.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Hinge-region mutants and domain 4 closure on substrate binding.
  findings:
  - statement: AlgC contributes to alginate, LPS and rhamnolipid biosynthesis, and substrate binding closes domain 4 over the active site.
    supporting_text: is involved in the biosynthesis of several complex carbohydrates, including alginate, lipopolysaccharide, and rhamnolipid
- id: PMID:22242625
  title: 'Solution NMR of a 463-residue phosphohexomutase: domain 4 mobility, substates,
    and phosphoryl transfer defect.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Solution NMR and S108C structure; mechanistic detail on domain 4 dynamics.
  findings: []
