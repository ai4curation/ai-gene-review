id: P26276
gene_symbol: algC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  algC (PA5322) encodes the bifunctional phosphomannomutase/phosphoglucomutase
  (PMM/PGM) of Pseudomonas aeruginosa, a 463-residue cytoplasmic monomer of the
  alpha-D-phosphohexomutase superfamily. Using a single active site it
  reversibly interconverts mannose 6-phosphate and alpha-D-mannose 1-phosphate
  (EC 5.4.2.8) and glucose 6-phosphate and alpha-D-glucose 1-phosphate
  (EC 5.4.2.2) with comparable catalytic efficiency, and also acts more slowly
  on ribose and 2-deoxyglucose phosphates. Catalysis requires Mg2+ bound by a
  metal-binding loop (Asp242, Asp244, Asp246) and the phosphorylated Ser108;
  the enzyme transfers its phosphoryl group to the substrate, the resulting
  hexose 1,6-bisphosphate intermediate rotates 180 degrees without leaving the
  active site, and the phosphate on the other carbon is returned to Ser108.
  His329 and Arg20 act as the general base and acid, and the C-terminal
  domain 4 closes over the active site on substrate binding. Activity is
  stimulated by glucose 1,6-bisphosphate. Mannose 1-phosphate made by AlgC is
  converted by AlgA (GDP-mannose pyrophosphorylase) to GDP-mannose, which
  feeds alginate (via AlgD), the common polysaccharide antigen (A-band) and
  the Psl exopolysaccharide. Glucose 1-phosphate made by AlgC is the precursor
  of UDP-glucose for the glucose residues of the lipopolysaccharide outer
  core and of dTDP-L-rhamnose for rhamnolipid and Psl. algC mutants lack
  detectable PMM and PGM activity and are defective in alginate, a complete
  LPS core and O antigen, rhamnolipid, Psl and Pel, so AlgC sits at the branch
  point that supplies sugar-phosphate precursors to most of the
  virulence-associated glycans of this pathogen. Transcription is activated
  by AlgR and is strongly increased in mucoid strains.
