- term:
    id: GO:0009243
    label: O antigen biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:22513190
  qualifier: involved_in
  review:
    summary: >-
      Ma et al. restate that algC mutants cannot make the LPS O antigen and a
      complete core, and report reduced B-band LPS when alginate or Psl
      compete for AlgC-derived precursors.
    action: KEEP_AS_NON_CORE
    reason: >-
      The O-antigen defect of algC mutants is real but indirect. B-band
      O antigen cannot be ligated to the truncated core of the mutant, and
      the A-band (common polysaccharide antigen, a D-rhamnose polymer) needs
      GDP-mannose-derived GDP-D-rhamnose, which depends on AlgC's
      mannose 1-phosphate. AlgC performs a precursor-supplying step upstream
      of O-antigen assembly rather than a step of O-antigen synthesis proper,
      so the annotation is kept as non-core.
    supported_by:
    - reference_id: PMID:22513190
      supporting_text: algC mutants cannot synthesize the LPS O-antigen and a complete LPS core
    - reference_id: PMID:22513190
      supporting_text: Likewise, when either alginate or Psl were overproduced, levels of B-band LPS decreased.
- term:
    id: GO:0009243
    label: O antigen biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:7515870
  qualifier: involved_in
  review:
    summary: >-
      algC mutants of serotype O5 (PAO1) and O3 (PAC1R) strains lack both
      O side chains and the A-band polysaccharide.
    action: KEEP_AS_NON_CORE
    reason: >-
      Same claim as the other O-antigen row. The phenotype follows from AlgC
      supplying glucose 1-phosphate for the core (the O-antigen attachment
      site) and mannose 1-phosphate for the A-band sugar precursors, not from
      a step of O-antigen assembly, so the annotation is retained as
      non-core.
    supported_by:
    - reference_id: PMID:7515870
      supporting_text: did not express lipopolysaccharide (LPS) O side chains or the A-band (common antigen) polysaccharide
- term:
    id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:7515870
  qualifier: involved_in
  review:
    summary: >-
      algC mutants produce LPS that migrates like core-glucose-deficient
      rough mutants, and the loss of PGM activity explains a block in
      glucose 1-phosphate, the precursor of the UDP-glucose used for the
      core glucose residues.
    action: ACCEPT
    reason: >-
      AlgC is the sole source of PGM activity in P. aeruginosa and catalyses
      the glucose 6-phosphate to glucose 1-phosphate step that supplies the
      core glucose residues; the truncated-core phenotype and E. coli pgm
      complementation support a direct catalytic role in the pathway
      producing the LPS core. One of the two principal biological roles of
      the PGM activity.
    supported_by:
    - reference_id: PMID:7515870
      supporting_text: Our finding that the algC gene product has PGM activity and that strains with mutations in this gene produce a truncated LPS core suggests that the synthesis of glucose 1-phosphate is necessary in the biosynthesis of the P. aeruginosa LPS core.
    - reference_id: PMID:7515870
      supporting_text: The data presented here thus demonstrate that the algC gene is required for the synthesis of a complete LPS core in two strains with different LPS core and O side chain structures.
