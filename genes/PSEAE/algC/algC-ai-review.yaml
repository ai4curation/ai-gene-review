core_functions:
- description: >-
    Phosphomannomutase converting mannose 6-phosphate to alpha-D-mannose
    1-phosphate, the precursor that AlgA converts to GDP-mannose for alginate
    (and also for the A-band polysaccharide and Psl).
  supported_by:
  - reference_id: PMID:8050998
    supporting_text: The enzyme catalyzed the interconversion of mannose 1-phosphate (M1P) and mannose 6-phosphate, as well as that of glucose 1-phosphate (G1P) and glucose 6-phosphate.
  - reference_id: PMID:8050998
    supporting_text: This evidence suggests that AlgC functions as PMM and PGM in vivo, converting phosphomannose and phosphoglucose in the biosynthesis of both alginate and LPS.
  molecular_function:
    id: GO:0004615
    label: phosphomannomutase activity
  directly_involved_in:
  - id: GO:0009298
    label: GDP-mannose biosynthetic process
  - id: GO:0042121
    label: alginic acid biosynthetic process
- description: >-
    Phosphoglucomutase converting glucose 6-phosphate to alpha-D-glucose
    1-phosphate, the precursor of UDP-glucose for the glucose residues of the
    LPS core (and of dTDP-L-rhamnose for rhamnolipid). AlgC is the only PGM
    activity detectable in P. aeruginosa.
  supported_by:
  - reference_id: PMID:7515870
    supporting_text: We show that, as expected, the algC mutant strains had no detectable phosphomannomutase activity and that neither algC strain had detectable phosphoglucomutase (PGM) activity.
  - reference_id: PMID:7515870
    supporting_text: Our finding that the algC gene product has PGM activity and that strains with mutations in this gene produce a truncated LPS core suggests that the synthesis of glucose 1-phosphate is necessary in the biosynthesis of the P. aeruginosa LPS core.
  - reference_id: PMID:8050998
    supporting_text: On the basis of Kcat/Km ratio, the catalytic efficiency for G1P was about twofold higher than that for M1P.
  molecular_function:
    id: GO:0004614
    label: phosphoglucomutase activity
  directly_involved_in:
  - id: GO:0120530
    label: UDP-alpha-D-glucose biosynthetic process
  - id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
proposed_new_terms: []
suggested_questions:
- question: >-
    Should AlgC carry GO:0106236 rhamnolipid biosynthesis? The algC mutant
    lacks rhamnolipid (PMID:10481091), but the supporting step is glucose
    1-phosphate supply to RmlA in dTDP-L-rhamnose synthesis; whether
    precursor-supplying enzymes upstream of dTDP-rhamnose receive this term
    should be settled by comparison with how RmlA-D are annotated.
- question: >-
    How does the cell partition AlgC-derived mannose 1-phosphate and glucose
    1-phosphate among alginate, Psl, Pel, A-band LPS, the LPS core and
    rhamnolipid, given that AlgC is the only PMM/PGM activity detected?
- question: >-
    Does AlgC phosphorylation state (phospho-Ser108 versus dephospho-enzyme)
    or glucose 1,6-bisphosphate availability regulate flux into alginate in
    mucoid clinical isolates?
suggested_experiments:
- description: >-
    Quantify intracellular mannose 1-phosphate, glucose 1-phosphate,
    GDP-mannose and UDP-glucose pools by LC-MS in wild-type, algC null and
    catalytically impaired (H329A, S108A) strains, in mucoid and non-mucoid
    backgrounds, to measure how AlgC activity limits each exopolysaccharide.
  experiment_type: targeted metabolomics with site-directed mutants
- description: >-
    Test whether the Pel defect of algC mutants reflects loss of a
    glucose-derived UDP-sugar precursor by supplementing or bypassing
    glucose 1-phosphate production (for example, heterologous pgm expression)
    in a Pel-inducible algC background.
  experiment_type: genetic complementation and polysaccharide quantification
