- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:23517223
  qualifier: enables
  review:
    summary: >-
      AlgC binds one Mg2+ per subunit at a metal-binding loop (Asp242, Asp244,
      Asp246) together with the phosphoryl group of Ser108; Mg2+ is the
      catalytically required cofactor, and crystal structures including the
      H329A mutant (PDB 4IL8, PMID:23517223) resolve the bound metal.
    action: ACCEPT
    reason: >-
      Metal binding is directly observed in many crystal structures of this
      protein and Mg2+ dependence is established kinetically (PMID:8050998).
      Zn2+ can occupy the site in crystals but yields inactive enzyme, so
      Mg2+ is the physiological cofactor. The term is as specific as the
      evidence warrants and describes the essential cofactor of the
      catalytic site. The cached record for PMID:23517223 is abstract-only;
      the cofactor statement in UniProt is tied to this paper by ECO:0000269
      and the curator read the full text.
    supported_by:
    - reference_id: file:PSEAE/algC/algC-uniprot.txt
      supporting_text: Binds 1 Mg(2+) ion per subunit (PubMed:23517223)
    - reference_id: PMID:8050998
      supporting_text: Purified PMM/phosphoglucomutase (PGM) required Mg2+ for maximum activity
    - reference_id: PMID:16880541
      supporting_text: a metal-binding loop which coordinates the Mg 2+ ion necessary for activity
