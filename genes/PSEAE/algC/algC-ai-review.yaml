    label: phosphoglucomutase activity
  evidence_type: IDA
  original_reference_id: PMID:8050998
  qualifier: enables
  review:
    summary: >-
      Purified recombinant AlgC interconverts glucose 1-phosphate and glucose
      6-phosphate (Km for G1P 22 uM, kcat 3000 min-1), with catalytic
      efficiency for G1P about twofold higher than for mannose 1-phosphate.
    action: ACCEPT
    reason: >-
      Direct enzymatic assay of the purified protein; phosphoglucomutase is
      one of the two core activities of this bifunctional enzyme and is
      corroborated by kinetic, structural and genetic studies
      (PMID:11716469, PMID:14725765, PMID:7515870).
    supported_by:
    - reference_id: PMID:8050998
      supporting_text: The enzyme catalyzed the interconversion of mannose 1-phosphate (M1P) and mannose 6-phosphate, as well as that of glucose 1-phosphate (G1P) and glucose 6-phosphate.
    - reference_id: PMID:8050998
      supporting_text: On the basis of Kcat/Km ratio, the catalytic efficiency for G1P was about twofold higher than that for M1P.
    - reference_id: PMID:14725765
      supporting_text: High-resolution structures with glucose 1-phosphate, glucose 6-phosphate, mannose 1-phosphate, and mannose 6-phosphate show that the position of the phosphate group of each substrate is held constant by a conserved network of hydrogen bonds.
