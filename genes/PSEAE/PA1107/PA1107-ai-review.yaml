- term:
    id: GO:0043709
    label: cell adhesion involved in single-species biofilm formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002895351
  - UniProtKB:P31129
  review:
    summary: >-
      IBA from PTN002895351, whose GO:0043709 IBD has one seed, E. coli DgcZ, annotated acts_upstream_of_or_within.
      RoeA promotes Pel exopolysaccharide and biofilm formation in PA14, but it is a c-di-GMP
      synthase, not an adhesion component.
    action: MODIFY
    reason: >-
      The essence (RoeA controls biofilm formation) is sound, but GO:0043709 is a participation
      term and a DGC regulates the process. The replacement is GO:1900190; a signed term is
      not used because the deletion reduces biofilm in PA14 and increases biomass in PAO1.
      A node-level GO_CENTRAL defect is recorded here, once, for the batch.
    proposed_replacement_terms:
    - id: GO:1900190
      label: regulation of single-species biofilm formation
    supported_by:
    - reference_id: PMID:20978535
      supporting_text: >-
        A deletion mutation of the PA1107 ORF was constructed (∆PA1107), and a biofilm formation
        defect was observed at 24 h in the microtiter dish assay (Fig. 1A).
    - reference_id: PMID:20978535
      supporting_text: >-
        Mutating the critical GGEEF motif to GGAAF resulted in loss of stimulation of Pel
        polysaccharide production
    - reference_id: PMID:35935233
      supporting_text: >-
        Only four mutants exhibited elevated biomass measurements, namely PA0847 (Zhang et
        al., 2019), PA1107 (roeA; Cole and Lee, 2016), PA4367 and PA3825
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002895351
        source_label: PTN002895351
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Single-seed IBD of a participation term on a DGC clade. The node-level defect is
          recorded once in the PA1107 review.
      - source_id: UniProtKB:P31129
        source_label: E. coli DgcZ (sole seed)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The seed annotation is IMP acts_upstream_of_or_within (EcoCyc, PMID:19460094; live
          QuickGO query 2026-11-05). It supports a regulatory role of DgcZ upstream of adhesion,
          not participation in adhesion by every DGC. For RoeA the right claim is regulation
          of biofilm formation.
