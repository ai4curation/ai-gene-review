knowledge_gaps:
- gap_statement: >-
    The input signal that controls RoeA, and how its c-di-GMP reaches the Pel machinery (PelD)
    without changing total c-di-GMP, are unknown; the sign of its effect on biofilm differs
    between PA14 and PAO1.
  gap_kind:
  - BIOLOGY
suggested_experiments:
- description: >-
    Test RoeA-PelD proximity (bacterial two-hybrid, co-purification) and compare roeA deletions
    in PA14 and PAO1 side by side in microtiter and flow-cell assays.
