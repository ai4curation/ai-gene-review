gene_symbol: PA1107
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  RoeA (regulator of exopolysaccharide A, PA1107) is a 398-aa inner-membrane diguanylate cyclase
  of Pseudomonas aeruginosa, with five predicted transmembrane helices and a C-terminal GGDEF
  domain carrying the GGEEF motif. Plasmid-expressed RoeA raises cellular c-di-GMP, a GGAAF
  active-site mutant does not, and its isolated GGDEF domain is active in vitro when fused
  to PleD. In strain PA14 RoeA promotes Pel exopolysaccharide production and early biofilm
  formation, and a deletion swarms about twice as well as wild type without any change in
  flagellar function. Its effects are not explained by total c-di-GMP levels, consistent with
  local signalling; RoeA-GFP gives a patchy membrane pattern distinct from that of the DGC
  SadC. In a PAO1 deletion screen the mutant lowered global c-di-GMP but formed more biofilm
  biomass under flow, so the effect on biofilm depends on strain and assay.
references:
- id: PMID:16477007
  title: >-
    Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases reveals
    a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: >-
      Extracts of a PA14 strain overexpressing PA1107 contained 35 pmol c-di-GMP per mg wet
      cell weight (Table 1, read in PMC full text; detection limit 12).
    supporting_text: >-
      Analysis of the phenotypes of DGC and PDE mutants and overexpressing clones revealed
      that certain virulence-associated traits are controlled by multiple DGCs and PDEs through
      alterations in c-di-GMP levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0052621 row and of PA1107 seeding PTN002895344. Cached
      copy is abstract-only; full text read on PMC (PMC1413825), verbatim excerpts in the
      notes. Whole-cell extract assay on an overexpressing strain; crude but direct.
- id: PMID:20978535
  title: >-
    Specific control of Pseudomonas aeruginosa surface-associated behaviors by two c-di-GMP
    diguanylate cyclases.
  findings:
  - statement: Plasmid RoeA raises c-di-GMP 22-fold (LC-MS), and the GGAAF mutant does not.
    supporting_text: >-
      expressing PA1107 on a plasmid significantly stimulated c-di-GMP levels versus those
      of the ΔPA1107 strain carrying the vector control (22-fold, P < 0.05). In contrast,
      expressing the PA1107-AA mutant variant did not result in a significant change in c-di-GMP
      levels
  - statement: >-
      A purified PleD-RoeA GGDEF chimera has in vitro DGC activity; the catalytic mutant chimera
      does not.
    supporting_text: >-
      Both of these chimeras could be purified, but only the construct with the WT GGEEF domain
      demonstrated in vitro DGC activity (Fig. 2H).
  - statement: The deletion reduces biofilm formation in PA14.
    supporting_text: >-
      A deletion mutation of the PA1107 ORF was constructed (∆PA1107), and a biofilm formation
      defect was observed at 24 h in the microtiter dish assay (Fig. 1A).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Second PseudoCAP source of the IDA GO:0052621 row. Full-length purified
      RoeA was inactive in vitro; activity was shown in vivo and for the purified chimera.
- id: PMID:35935233
  title: >-
    Phenotypic and integrated analysis of a comprehensive Pseudomonas aeruginosa PAO1 library
    of mutants lacking cyclic-di-GMP-related genes.
  findings:
  - statement: >-
      In PAO1 the roeA deletion increased flow-cell biomass, the opposite of the PA14 microtiter
      result.
    supporting_text: >-
      Only four mutants exhibited elevated biomass measurements, namely PA0847 (Zhang et al.,
      2019), PA1107 (roeA; Cole and Lee, 2016), PA4367 and PA3825
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Library-scale screen in PAO1.
