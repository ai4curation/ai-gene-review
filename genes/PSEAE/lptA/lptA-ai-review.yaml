  title: Modulation of quorum sensing in Pseudomonas aeruginosa through alteration
    of membrane properties.
  findings:
  - statement: >-
      The gene is identified here as a PlsC counterpart and disrupted; this is the only functional
      work on the P. aeruginosa protein, and the word carrying the activity claim is "functional
      homologue".
    reference_section_type: ABSTRACT
    supporting_text: >-
      The lptA gene encoding a functional homologue of PlsC, an Escherichia coli enzyme that
      catalyses the second step of the phospholipid biosynthesis pathway, was identified and
      disrupted.
  - statement: >-
      The mutant phenotype is a change in which acyl chains end up in membrane phospholipids, which
      is the expected consequence of losing the enzyme that installs the 2-position chain.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Inactivation of lptA altered the fatty acid profile of phospholipids and the membrane
      properties, resulting in decreased membrane fluidity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Baysse et al. 2005, Microbiology). Abstract-only in the cache, which is a
      smaller limitation than it first appears. It is a quorum-sensing paper rather than an
      enzymology one: it identifies and disrupts the gene and reports the membrane consequences.
      But UniProt cites it twice, not once, and the second citation settles what the abstract leaves
      open - "Can complement the E.coli plsC mutant", evidence ECO:0000269|PubMed:16079332, the
      strongest UniProt support class. So "functional homologue of PlsC" was demonstrated by
      heterologous complementation of a plsC null, a curator read it from this paper, and the claim
      is not a sequence inference.
      An earlier version of this review said the opposite - that whether complementation was shown
      could not be traced from an abstract-only cache - and it was wrong about a file this review
      quotes repeatedly, since the statement is in lptA-uniprot.txt. The cause was a truncating
      command in my own first read of the CC block, which stopped before the MISCELLANEOUS line, so
      I asserted an absence in a source I had not finished reading.
      Its quorum-sensing findings are not annotated here; they are several steps downstream of
      anything this enzyme does molecularly.
