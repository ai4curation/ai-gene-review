core_functions:
- description: >-
    Transfer of an acyl group from acyl-CoA onto the free 2-position of
    1-acyl-sn-glycerol-3-phosphate, giving phosphatidic acid. This is the second of the three steps leading from glycerol
    3-phosphate to CDP-diacylglycerol, the branch point for the cell's major glycerophospholipids,
    so the enzyme determines which acyl chain occupies the 2-position of membrane phospholipids -
    which is why losing it shifts the membrane towards longer chains and lower fluidity rather than
    abolishing phospholipid synthesis.
