- term:
    id: GO:0042171
    label: lysophosphatidic acid acyltransferase activity
  evidence_type: IMP
  original_reference_id: PMID:16079332
  qualifier: enables
  review:
    summary: >-
      The same reaction as GO:0003841 under a different GO class. Accepted - the duplication is the
      ontology's, not the annotation's.
    action: ACCEPT
    reason: >-
      Accepted, and better supported than a mutant phenotype alone. Losing the enzyme that installs
      the 2-position acyl chain shifts which chains end up in membrane phospholipids, and that is
      what was observed - the right shape for an IMP. The stronger evidence from the same paper is
      the complementation: UniProt records "Can complement the E.coli plsC mutant" with evidence
      ECO:0000269|PubMed:16079332, which is a functional test of this protein in a null background
      rather than an inference from its sequence.
      The interesting part is the term. GO:0042171 and the GO:0003841 carried on three other rows
      describe one transformation: lysophosphatidic acid is 1-acyl-sn-glycerol-3-phosphate and
      phosphatidic acid is 1,2-diacyl-sn-glycerol-3-phosphate, so the two definitions differ only in
      naming convention - the lipidologist's against the systematic one. Neither subsumes the other,
      which was checked rather than assumed: OLS gives GO:0042171's ancestors as GO:0071617
      lysophospholipid acyltransferase activity, GO:0016747, GO:0016746 and transferase activity,
      with GO:0003841 nowhere among them.
      So this row is not redundant with the others in the way a duplicate annotation would be, and
      it is not more or less specific than them either. Both terms are kept, because picking one
      would silently drop a true annotation to tidy up a problem that lives in the ontology; the
      duplication is raised as a question for GO instead. core_functions uses GO:0003841, the
      EC-grounded term that the curated reaction and three rows converge on.
    supported_by:
    - reference_id: PMID:16079332
      reference_section_type: ABSTRACT
      supporting_text: >-
        Inactivation of lptA altered the fatty acid profile of phospholipids and the membrane
        properties, resulting in decreased membrane fluidity.
    - reference_id: file:PSEAE/lptA/lptA-uniprot.txt
      record_section: ["CC:MISCELLANEOUS"]
      supporting_text: 'Can complement the E.coli plsC mutant.'
- term:
    id: GO:0016746
    label: acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002123
  review:
    summary: >-
      The acyl-transfer genus, from a signature that identifies the family without the substrate.
      Uninformative once the specific activity is asserted.
    action: TOO_GENERAL
    reason: >-
      True, and as far as its own evidence reaches: IPR002123 is the phospholipid/glycerol
      acyltransferase family signature, which places the protein in the family but says nothing
      about which lysophospholipid it acts on. OLS confirms GO:0016746 is an ancestor of the
      GO:0042171 asserted on this gene, so a more specific term is already in the review and this
      one adds no information.
      TOO_GENERAL rather than MODIFY, deliberately: a MODIFY would need this row's own evidence to
      support the deeper term, and a generic acyltransferase signature does not carry the substrate.
      The specific claim is carried by the rows whose evidence does - the ISS transfer from PlsC and
      the EC mapping.
    supported_by:
    - reference_id: file:PSEAE/lptA/lptA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR002123; Plipid/glycerol_acylTrfase.'
