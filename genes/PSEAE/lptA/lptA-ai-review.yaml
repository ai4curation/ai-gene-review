id: Q9I7C1
gene_symbol: lptA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0005 is the Pseudomonas aeruginosa member of the PlsC family of
  1-acyl-sn-glycerol-3-phosphate acyltransferases. It is an integral inner-membrane enzyme with two
  transmembrane segments that transfers an acyl group from acyl-CoA onto the free 2-position of
  1-acyl-sn-glycerol-3-phosphate, giving phosphatidic acid. That is the second of the three steps
  from glycerol 3-phosphate to CDP-diacylglycerol, the branch point from which the cell's major
  glycerophospholipids are built, so the enzyme sets which acyl chain occupies the 2-position of
  membrane phospholipids. Cells lacking it survive but shift their phospholipid acyl composition
  towards longer chains and become less fluid in the membrane, which in turn alters the timing of
  quorum-sensing signal production. Despite its gene symbol it is unrelated to the LptA
  lipopolysaccharide-transport protein of the Lpt bridge; the symbol here abbreviates
  lysophosphatidic acid acyltransferase A.
