    supporting_text: >-
      alters the fatty acid profile of the membrane phospholipids by increasing the proportion of
      longer-chain (C18) fatty acids
  knowledge_gaps:
  - gap_statement: >-
      No activity has been measured on the purified protein. That the enzyme can carry out the
      reaction is established, because it complements an E. coli plsC null, but complementation
      reports only that the function is supplied: the kinetics, the acyl-CoA chain-length preference
      and whether the enzyme accepts lysophospholipids other than lysophosphatidic acid are all
      unknown, and the chain-length discrimination inferred from the mutant's lipid profile has
      never been measured directly.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      How the enzyme's chain-length preference is set is unknown. The mutant accumulates longer-chain
      C18 species, which implies the wild-type enzyme discriminates against them, but no structure or
      binding-site analysis explains how a two-transmembrane acyltransferase selects an acyl-CoA.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Whether the enzyme is the only route to phosphatidic acid in this organism has not been
      established. The deletion is viable with an altered lipid profile rather than lethal, which
      means either a second acyltransferase compensates or the step is partially dispensable, and
      which has not been determined.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Should GO:0042171 lysophosphatidic acid acyltransferase activity and GO:0003841
    1-acylglycerol-3-phosphate O-acyltransferase activity be merged? Their definitions describe one
    transformation under two naming conventions - lysophosphatidic acid is
    1-acyl-sn-glycerol-3-phosphate and phosphatidic acid is 1,2-diacyl-sn-glycerol-3-phosphate - and
    neither is an ancestor of the other, so a gene characterised once can end up with both, as this
    one has. Raised rather than resolved here: this review keeps both rows, because dropping one to
    tidy the gene would discard a true annotation and leave the ontology unchanged. Belongs in an
    obsoletion or mapping pass with the term usage counted across the corpus.
- question: >-
    Is the gene symbol worth a note to the resource? PA0005 lptA is a PlsC-family phospholipid
    acyltransferase, while lptA in E. coli and in most of the literature is the periplasmic
    lipopolysaccharide-transport protein of the Lpt bridge. Nothing on this record is wrong - the
    entry name is PLSC_PSEAE and the gene name carries ECO:0000303 to the paper that coined it - but
    the collision is total, the two proteins are functionally unrelated, and anyone matching on the
    symbol alone will land on the wrong one.
suggested_experiments:
- description: >-
    Measure the activity on the purified protein, which has never been done, with a panel of
    acyl-CoAs of different chain length against 1-acyl-sn-glycerol-3-phosphate. This would convert
    the catalytic assignment from a homology transfer into a measurement and test directly whether
    the chain-length discrimination inferred from the mutant's lipid profile is a property of the
    enzyme.
- description: >-
    Ask whether the step has a second route by screening for suppressors of a conditional lptA
    depletion, or by testing the deletion for synthetic lethality with the other PlsC-family genes
    in the genome. The deletion being viable with only a compositional change is the observation
    that needs explaining.
