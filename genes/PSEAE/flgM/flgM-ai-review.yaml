id: Q9HYP5
gene_symbol: flgM
product_type: PROTEIN
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
status: COMPLETE
description: >-
  FlgM (PA3351) is the anti-sigma-28 factor of Pseudomonas aeruginosa, a small 107-residue protein
  that binds the flagellar sigma factor FliA (sigma-28, PA1455) and prevents it from directing
  transcription. Its effect is seen on the flagellin gene: losing flgM raises output from the fliC
  promoter and raises the amount of flagellin in the cell, so FlgM normally restrains flagellin
  synthesis by restraining FliA. The sigma-binding determinant lies in the conserved C-terminal
  half, shared with FlgM proteins of other bacteria. The regulatory wiring around it is not the
  enteric one: the flgM promoter in this organism depends only partly on sigma-28 and sigma-54,
  and resembles the arrangement in Vibrio cholerae where both sigma-28-dependent and -independent
  transcription operate.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: PMID:11872701
  title: >-
    Identification and functional characterization of flgM, a gene encoding the anti-sigma 28
    factor in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Loss of flgM raises transcription from a sigma-28-dependent promoter, which is the genetic
      signature of an anti-sigma factor.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The beta-galactosidase activity of a transcriptional fusion of the fliC promoter to lacZ was
      upregulated in the flgM mutant, suggesting that the activity of FliA, the sigma factor that
      regulates fliC, was increased.
  - statement: >-
      The consequence is confirmed at the level of the protein product, not only the promoter
      fusion.
    reference_section_type: ABSTRACT
    supporting_text: >-
      an increased amount of flagellin was demonstrated in the flgM mutant of P. aeruginosa strain
      PAK by Western blot
  - statement: >-
      The interaction with the sigma factor is direct, shown independently of the genetics.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Direct interaction of the P. aeruginosa FlgM with the alternative sigma factor sigma(28) was
      demonstrated by utilizing the yeast two-hybrid system.
  - statement: >-
      The sigma-binding determinant is in the conserved C-terminal half, which the record's
      FlgM_C signature match corroborates.
    reference_section_type: ABSTRACT
    supporting_text: >-
      A conserved region is present in the C-terminal half of the FlgM of P. aeruginosa and in
      FlgM homologues of other organisms that includes the sigma(28) binding domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Frisk, Jyot, Arora & Ramphal 2002, J Bacteriol). Abstract-only in the cache,
      but it states the mutant promoter-fusion result, the flagellin Western blot, the two-hybrid
      interaction and the location of the binding domain, so the annotated row can be checked
      without the full text. One caveat recorded rather than acted on: the Western blot was done in
      strain PAK while the annotation is on the PAO1 locus, and the abstract does not say which
      strain the fliC fusion work used.
