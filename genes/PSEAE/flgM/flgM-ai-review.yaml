existing_annotations:
- term:
    id: GO:0016989
    label: sigma factor antagonist activity
  evidence_type: IMP
  original_reference_id: PMID:11872701
  qualifier: enables
  review:
    summary: >-
      The gene's core function, supported both by the mutant phenotype the evidence code refers to
      and by a direct interaction assay.
    action: ACCEPT
    reason: >-
      Two independent lines, which is more than the IMP code claims. The genetics: deleting flgM
      raises output from the fliC promoter and raises flagellin levels, which is what an
      anti-sigma factor's absence should do to a promoter read by the sigma it antagonises. The
      binding: a yeast two-hybrid assay shows FlgM interacts with sigma-28 directly, so the
      genetic effect is not routed through an intermediary. The sigma factor concerned is FliA,
      PA1455 in this organism. Accepted as core.
    supported_by:
