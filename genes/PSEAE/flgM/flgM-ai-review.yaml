      reference_section_type: ABSTRACT
      supporting_text: >-
        Direct interaction of the P. aeruginosa FlgM with the alternative sigma factor sigma(28)
        was demonstrated by utilizing the yeast two-hybrid system.
    - reference_id: PMID:11872701
      reference_section_type: ABSTRACT
      supporting_text: >-
        The beta-galactosidase activity of a transcriptional fusion of the fliC promoter to lacZ
        was upregulated in the flgM mutant, suggesting that the activity of FliA, the sigma factor
        that regulates fliC, was increased.
- term:
    id: GO:0045892
    label: negative regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR007412
  review:
    summary: >-
      InterPro2GO mapping from the FlgM family signature. True, and kept at this level rather than
      deepened, because neither of the two actions that would change it applies.
    action: ACCEPT
    reason: >-
      The gene product performs the step: withholding a sigma factor is how this negative
      regulation happens, and the paper shows the effect on a sigma-28-dependent promoter directly.
      Kept general on purpose. Deepening it to the transcription-initiation term, which this
      project's PA2895 review carries for the same kind of protein, would fail the 2026-11-14
      test, because this row's own evidence is a family signature that identifies the sigma-28
      binding domain but says nothing about which step is blocked; what PA2895 has and this gene
      does not is a report that the antagonised sigma factor associates with RNA polymerase in
      vivo. TOO_GENERAL does not fit either, since no more specific process term is asserted
      anywhere in this review for it to be entailed by — this is the gene's only process claim,
      which is the case the enum says to keep. The two reviews differ on evidence, not from
      inconsistency, and cross-gene symmetry would be the wrong reason to deepen a term here.
    supported_by:
    - reference_id: PMID:11872701
      reference_section_type: ABSTRACT
      supporting_text: >-
        an increased amount of flagellin was demonstrated in the flgM mutant of P. aeruginosa
        strain PAK by Western blot
core_functions:
- description: >-
    Anti-sigma-28 factor: binds the flagellar sigma factor FliA through a conserved C-terminal
    determinant and keeps it from directing transcription, so that flagellin synthesis is held
    back until the signal that releases FliA arrives.
  molecular_function:
    id: GO:0016989
    label: sigma factor antagonist activity
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  supported_by:
  - reference_id: PMID:11872701
    reference_section_type: ABSTRACT
    supporting_text: >-
      Direct interaction of the P. aeruginosa FlgM with the alternative sigma factor sigma(28) was
      demonstrated by utilizing the yeast two-hybrid system.
  - reference_id: PMID:11872701
    reference_section_type: ABSTRACT
    supporting_text: >-
      A conserved region is present in the C-terminal half of the FlgM of P. aeruginosa and in
      FlgM homologues of other organisms that includes the sigma(28) binding domain.
  knowledge_gaps:
  - gap_statement: >-
      How FlgM is removed to release FliA in this organism is unknown. In the enteric bacteria
      FlgM is secreted through the flagellar export apparatus once the hook is complete, which
      couples flagellin synthesis to assembly, but the paper states that the P. aeruginosa system
      "is different from that in the enteric bacteria", and no secretion or degradation route has
      been shown here.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      What governs flgM's own expression is unresolved. Three putative sigma-54 sites and one
      sigma-28 site lie upstream, yet promoter fusions showed the promoter "was not entirely
      dependent on either", so the input to this regulator is only partly accounted for.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Is P. aeruginosa FlgM secreted when the flagellar hook is complete, as in Salmonella? The
    paper's point that this system differs from the enteric one makes the question sharper rather
    than settled, and the answer determines whether flagellin timing is coupled to assembly here
    at all.
- question: >-
    What is the third input to the flgM promoter? Neither sigma-28 nor sigma-54 accounts for it
    fully, so a further factor is implied and has not been identified.
- question: >-
    Does FlgM antagonise any sigma factor other than FliA? The two-hybrid result establishes the
    FliA interaction but was not run against the organism's other sigma factors.
suggested_experiments:
- description: >-
    Test for FlgM export by immunoblotting culture supernatants of wild type and of a mutant
    blocked in flagellar assembly, which would show directly whether the enteric
    secretion-coupling mechanism operates in this organism.
- description: >-
    Map the flgM promoter by deletion and primer extension in sigma-28 and sigma-54 null
    backgrounds together, rather than singly, to find the element that accounts for the residual
    activity the original fusions left unexplained.
- description: >-
    Repeat the flagellin measurement in PAO1 rather than PAK, so that the protein-level phenotype
    sits in the same strain background as the annotation.
