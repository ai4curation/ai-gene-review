- term:
    id: GO:0051938
    label: L-glutamate import
  evidence_type: IMP
  original_reference_id: PMID:18833300
  qualifier: involved_in
  review:
    summary: >-
      Johnson et al. 2008 Biolog and plate-growth screen: the PA1341 transposon
      mutant is partially defective in using L-glutamate as a carbon source,
      and the operon is induced by L-glutamate. Sound, and refinable to import
      across the plasma membrane.
    action: MODIFY
    reason: >-
      A growth defect on a sole carbon source is an indirect read-out of
      transport, and the PA1341 phenotype is partial (C+/-). It is consistent
      across all three operon mutants and with substrate induction, and the
      orthologous P. putida system imports Glu directly, so the claim holds.
      As a permease, PA1341 forms part of the translocation pathway and so
      does part of the work. The precise term is L-glutamate import across
      plasma membrane.
    proposed_replacement_terms:
    - id: GO:0098712
      label: L-glutamate import across plasma membrane
    supported_by:
    - reference_id: PMID:18833300
      supporting_text: >-
        PA1339, PA1340 and PA1341 all encode components of a predicted ABC
        amino acid transporter, and are located in a putative three gene
        operon. All three mutants were defective for utilization of L-glutamic
        acid as a carbon source
