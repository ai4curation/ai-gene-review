  findings:
  - statement: >-
      Transposon mutants of PA1339, PA1340 and PA1341 are all defective in
      using L-glutamate as a carbon source; the operon is induced by
      L-glutamate.
    supporting_text: >-
      All three mutants were defective for utilization of L-glutamic acid as a
      carbon source, and expression of two of these genes was induced by
      L-glutamic acid
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified (Johnson et al. 2008, PLoS Genet, PMC2542419); full
      text in cache. Biolog phenotype microarray and plate-growth screen of
      transposon mutants (PA1339-PA1341 mutants in strain PAK) plus qRT-PCR
      induction. Growth phenotypes only, no uptake assays. PA1341 shows only
      L-Glu as a C source, scored C+/-.
- id: PMID:18310026
  title: 'Characterization of a Pseudomonas putida ABC transporter (AatJMQP) required
    for acidic amino acid uptake: biochemical properties and regulation by the Aau
    two-component system.'
  findings:
  - statement: >-
      The orthologous P. putida KT2440 AatJMQP system takes up Glu and Asp;
      its binding protein binds Glu and Asp with high affinity and Gln and Asn
      weakly.
    supporting_text: >-
      The purified solute-binding protein AatJ exhibited high affinity towards
      Glu and Asp (K(d)=0.4 and 1.3 muM, respectively), while Gln and Asn as
      well as dicarboxylates (succinate and fumarate) were bound with much
      lower affinity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Singh and Rohm 2008, Microbiology). Abstract only.
      Work in P. putida KT2440 on the orthologous operon (PP1071-PP1068);
      corroborates the substrate range of the P. aeruginosa system. Not a
      GOA reference for PA1341; used here as orthology support.
