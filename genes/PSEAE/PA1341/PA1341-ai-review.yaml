taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1341 is an integral inner-membrane permease subunit of a polar amino acid
  ABC importer of Pseudomonas aeruginosa, encoded in the PA1342-PA1339 operon
  that is orthologous to the AatJQMP acidic amino acid transporter of
  Pseudomonas putida and to GltIJKL of Escherichia coli. PA1341 is the
  GltJ/AatQ-type permease (HisMQ subfamily, PANTHER subfamily "glutamate/
  aspartate import permease protein GltJ"), with four predicted transmembrane
  helices. Together with the second permease PA1340, the ATPase PA1339 and the
  periplasmic binding protein, it imports L-glutamate, and probably L-aspartate
  and, with lower efficiency, L-glutamine and D-glutamate. Transposon mutants
  are defective in using L-glutamate as a carbon source, and the operon is
  induced by L-glutamate.
