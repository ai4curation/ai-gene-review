suggested_questions:
- question: >-
    Does the P. aeruginosa PA1342-PA1339 system also take up L-aspartate, as
    its P. putida ortholog does, and is L-glutamine a genuine low-affinity
    substrate or used only after periplasmic deamidation?
suggested_experiments:
- description: >-
    [14C]-L-glutamate and [14C]-L-aspartate uptake in an in-frame PA1341
    deletion with complementation, in PAO1, to attribute the operon phenotype
    to the permease and define its substrate range.
  experiment_type: transport assay
