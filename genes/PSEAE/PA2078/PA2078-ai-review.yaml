proposed_new_terms:
- proposed_name: (10S)-hydroperoxy-octadecenoate 7S,10S-diol synthase activity
  proposed_definition: >-
    Catalysis of the reaction (10S)-hydroperoxy-(8E)-octadecenoate =
    (7S,10S)-dihydroxy-(8E)-octadecenoate.
  justification: >-
    PA2078 performs this reaction; GO has only the analogous fungal linoleate
    8-hydroperoxide isomerase term and the general intramolecular hydroxytransferase
    parent.
