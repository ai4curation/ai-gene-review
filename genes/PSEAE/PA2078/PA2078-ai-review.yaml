suggested_questions:
- question: >-
    If neither heme site of PA2078 is catalytic, which residues form its active site, and
    does the reaction proceed by intramolecular oxygen transfer as in fungal diol
    synthases?
suggested_experiments:
- description: >-
    Use 18O-labelled 10-H(P)OME with purified PA2078 to test whether the 7-hydroxyl oxygen
    comes from the hydroperoxide (intramolecular transfer) or from water.
