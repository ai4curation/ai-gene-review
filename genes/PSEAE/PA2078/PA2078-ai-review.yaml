taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2078 is the (7S,10S)-hydroperoxide diol synthase (7,10-DS) of the oleate-diol synthase
  pathway of Pseudomonas aeruginosa. It converts 10-H(P)OME, the hydroperoxide made from
  oleic acid by its operon partner PA2077, into the oxylipin 7,10-DiHOME, which
  accumulates outside the cell. PA2078 is a periplasmic protein of the di-heme cytochrome
  c peroxidase family (FadCcp subfamily, an in-paralog of PA2077), but neither of its heme
  sites is required for diol synthase activity, so its catalytic site lies elsewhere. Its
  co-expression relieves the toxicity of PA2077-derived hydroperoxide.
