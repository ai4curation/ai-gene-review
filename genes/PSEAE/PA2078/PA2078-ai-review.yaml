  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP oxylipin biosynthetic process row (PTN002826263 seed).
      Abstract only; mutant screening, complementation and separate heterologous
      expression.
- id: PMID:26154497
  title: In Silico/In Vivo Insights into the Functional and Evolutionary Pathway of Pseudomonas
    aeruginosa Oleate-Diol Synthase. Discovery of a New Bacterial Di-Heme Cytochrome C
    Peroxidase Subfamily.
  findings:
  - statement: Neither heme site of PA2078 is needed for its diol synthase activity.
    supporting_text: These results indicate that neither the proximal or distal heme groups, nor the cysteine putatively related to P450 enzymes are involved in the catalytic activity of PA2078.
  - statement: PA2077 and PA2078 are periplasmic.
    supporting_text: both proteins display type I signal export sequences that allow transport of the synthesized products to the periplasm, a fact experimentally confirmed by PhoA fusion screening
  - statement: Co-expression of PA2078 abolishes the toxicity of PA2077.
    supporting_text: Normal growth rates and full activity were achieved in both mutants, indicating that when the two enzymes are co-expressed in trans, both maintain their respective functions, with PA2078 abolishing toxicity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Heme-site mutagenesis, phylogeny and operon expression experiments.
