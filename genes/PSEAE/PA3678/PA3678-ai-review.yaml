- id: PMID:12193619
  title: The MexJK efflux pump of Pseudomonas aeruginosa requires OprM for antibiotic efflux but not for
    efflux of triclosan.
  findings:
  - statement: mexJK expression is negatively regulated by the TetR-family MexL; a mexL HTH mutation gives
      triclosan resistance.
    supporting_text: Expression of this operon is negatively regulated by the product of mexL, a gene
      located upstream of and transcribed divergently from mexJK
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PseudoCAP source for IMP GO:0045892, a seed of the PTN004738546 GO:0006355 IBD. The
      abstract states that mexL negatively regulates mexJK and that the triclosan-resistant mutant carries
      a mexL HTH substitution, so the seed is sound. The abstract uses the name mexL; PA3678 is the mexL
      locus.
- id: PMID:15855505
  title: Molecular characterization of MexL, the transcriptional repressor of the mexJK multidrug efflux
    operon in Pseudomonas aeruginosa.
  findings:
  - statement: Purified MexL is a tetramer and binds the mexL-mexJ intergenic region (EMSA, footprinting).
    supporting_text: Gel mobility shift and footprinting assays demonstrated that MexL, but not MexL(A47D),
      binds specifically to the 94-bp mexL-mexJ intergenic region
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PseudoCAP IDA and CollecTF IPI source. Abstract only in the cache; full text in PMC1087665.
