id: Q9HXW2
gene_symbol: PA3678
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA3678 encodes MexL, a TetR-family transcriptional repressor of Pseudomonas aeruginosa that
  controls the divergently transcribed mexJK operon, encoding the MexJK RND efflux system (which exports
  triclosan and, with OprM, tetracycline and erythromycin), and its own gene. MexL is a tetramer in solution
  and binds the 94-bp mexL-mexJ intergenic region, protecting about 60 nucleotides that overlap both promoters
  and contain two inverted GTATTT repeats. Mutations in the helix-turn-helix region (such as A47D) abolish
  DNA binding and cause constitutive mexJK expression and triclosan resistance.
