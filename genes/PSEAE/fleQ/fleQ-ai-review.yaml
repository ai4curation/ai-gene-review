      Eukaryota constraint (checked in QuickGO, 2026-11-05): cilia are eukaryotic organelles. The paper
      concerns FleQ activation of bacterial flagellar gene promoters.
    action: MODIFY
    reason: >-
      Wrong organelle term for a bacterium. The evidence (FleQ binding to and activating flhA, fliE, fliL
      and fleSR promoters, with the flhA site needed in vivo) supports GO:1902210 positive regulation
      of bacterial-type flagellum assembly.
    supported_by:
    - reference_id: PMID:12218010
      supporting_text: >-
        Direct interaction of FleQ with flhA , fliE , fliL , and fleSR promoters was demonstrated by gel
        shift assay, along with experiments to conclusively determine the specificity of its binding.
    - reference_id: PMID:12218010
      supporting_text: >-
        Mutagenesis of the FleQ binding site in the flhA promoter confirmed its functionality in vivo.
    proposed_replacement_terms:
    - id: GO:1902210
      label: positive regulation of bacterial-type flagellum assembly
