id: G3XCV0
gene_symbol: fleQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FleQ (PA1097) is the master regulator of flagellar gene expression in Pseudomonas aeruginosa. It is
  an NtrC/NifA-type AAA+ enhancer-binding protein with an atypical N-terminal FleQ domain in place of
  a phosphorylatable receiver, a central sigma-54 activation (AAA+ ATPase) domain and a C-terminal Fis-type
  helix-turn-helix DNA-binding domain. With RpoN (sigma-54) it activates the class II flagellar genes
  (for example flhA, fliE, fliL and fleSR) by binding enhancer sites upstream or atypically downstream
  of the promoter. FleQ also binds the second messenger c-di-GMP, through its Walker A ATP site, which
  inhibits its ATPase activity and dampens flagellar gene expression. At the pel exopolysaccharide promoter
  FleQ binds two sites: without c-di-GMP it represses pelA transcription (and bends the DNA together with
  the antiactivator FleN), and with c-di-GMP it activates transcription. FleQ thus links c-di-GMP levels
  to the switch between flagellar motility and biofilm matrix production.
