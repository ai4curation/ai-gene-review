  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0000987 row that seeds the PTN000787214 IBD, and of the c-di-GMP
      binding IDA. Full text cached. Gel-shift binding of FleQ to pel promoter DNA, inhibited by c-di-GMP,
      and binding of radiolabelled c-di-GMP are direct in vitro evidence.
- id: PMID:22581773
  title: >-
    The FleQ protein from Pseudomonas aeruginosa functions as both a repressor and an activator to control
    gene expression from the pel operon promoter in response to c-di-GMP.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IMP activator and repressor rows (the activator row seeds PTN000787214),
      and CollecTF source. Full text cached. DNase I footprinting at box 1 and box 2 plus box-mutant pelA-lacZ
      fusions show repression from box 2 and c-di-GMP-dependent activation from box 1.
- id: PMID:12218010
  title: >-
    FleQ, the major flagellar gene regulator in Pseudomonas aeruginosa, binds to enhancer sites located
    either upstream or atypically downstream of the RpoN binding site.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Gel shift and DNase I footprinting at flhA, fliE, fliL and fleSR promoters, and
      in vivo test of the flhA site. Supports DNA-binding activator activity. The PseudoCAP row from this
      paper uses an eukaryote-only cilium term (see source defect).
- id: PMID:9287015
  title: >-
    A transcriptional activator, FleQ, regulates mucin adhesion and flagellar gene expression in Pseudomonas
    aeruginosa in a cascade manner.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in cache. Identification of fleQ; insertion mutant loses motility and mucin adhesion;
      promoter fusions show FleQ- and RpoN-dependent fleSR expression.
- id: PMID:14617143
  title: >-
    A four-tiered transcriptional regulatory circuit controls flagellar biogenesis in Pseudomonas aeruginosa.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Transcriptome of fleQ, fleR, fliA and rpoN deletions defining the four-tier flagellar
      hierarchy; FleQ and RpoN activate class II genes.
- id: PMID:24167275
  title: >-
    Cyclic diguanosine monophosphate represses bacterial flagella synthesis by interacting with the Walker
    A motif of the enhancer-binding protein FleQ.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. c-di-GMP competitively inhibits FleQ ATPase activity and needs the Walker A motif
      to bind; supports c-di-GMP binding and ATP binding.
- id: PMID:11673434
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. FleN-FleQ interaction by yeast two-hybrid; FleN does not block FleQ DNA binding.
  title: >-
    Interaction of the antiactivator FleN with the transcriptional activator FleQ regulates flagellar
    number in Pseudomonas aeruginosa.
