suggested_questions:
- question: >-
    Which pyoverdine NRPS adenylation domains (PvdL, PvdI, PvdJ, PvdD) does
    PA2412 bind, and is it required for their adenylation activity or only for
    their solubility?
suggested_experiments:
- description: >-
    Co-express each pyoverdine NRPS adenylation domain with and without PA2412
    and measure soluble yield and amino-acid adenylation (ATP-PPi exchange).
