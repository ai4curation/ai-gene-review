  review:
    summary: >-
      PseudoCAP seed row. The abstract describes an expression study; whether a
      PA2412 mutant was assayed is not stated. Seed verdict UNVERIFIABLE. The
      term itself is correct for PA2412 (PMID:17502378).
    action: ACCEPT
    reason: >-
      The claim is true on the deletion-mutant data of PMID:17502378, and MbtH-like
      proteins are NRPS adenylation-domain partners, so PA2412 is a component of
      the biosynthetic machinery rather than a regulator. Whether this
      particular reference supports IMP is unverified.
    supported_by:
