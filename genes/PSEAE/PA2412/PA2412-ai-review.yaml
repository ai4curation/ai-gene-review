      abstract describes GeneChip expression profiling and does not say whether
      a PA2412 mutant was tested, so the IMP basis could not be checked.
- id: PMID:12686626
  title: Identification and characterization of novel pyoverdine synthesis genes in
    Pseudomonas aeruginosa.
  findings:
  - statement: Candidate pvd genes were mutated and tested for pyoverdine production.
    supporting_text: The candidate genes were mutated and the effects of the mutations
      on pyoverdine production were determined.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PseudoCAP source for an IMP GO:0002049 row. Abstract only; it describes
      mutation of fourteen candidate genes and pyoverdine assays but does not
      name PA2412, so whether PA2412 was among the eight new pvd genes could not
      be checked.
- id: PMID:17502378
  title: The 1.8 A crystal structure of PA2412, an MbtH-like protein from the pyoverdine
    cluster of Pseudomonas aeruginosa.
  findings:
  - statement: PA2412 is needed for normal pyoverdine production but not for ferripyoverdine uptake.
    supporting_text: Our results demonstrate that PA2412 is necessary for the production
      or secretion of pyoverdine at normal levels. The PA2412 deletion strain is able
      to use exogenously produced pyoverdine, showing that there is no defect in the
      uptake or utilization of the iron-pyoverdine complex.
  - statement: PA2412 is co-expressed with the pyoverdine synthetases.
    supporting_text: Coexpressed with the pyoverdine synthetic enzymes is a 72-amino
      acid MbtH-like family member designated PA2412.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for an IMP GO:0002049 row and the effective seed of
      PTN002212932. Abstract only; it states the deletion-mutant result
      directly.
