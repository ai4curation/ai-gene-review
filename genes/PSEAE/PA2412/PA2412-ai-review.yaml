  title: 'GeneChip expression analysis of the iron starvation response in Pseudomonas
    aeruginosa: identification of novel pyoverdine biosynthesis genes.'
  findings:
  - statement: PvdS-dependent iron-regulated genes include novel pyoverdine biosynthetic genes.
    supporting_text: Under low-iron conditions, expression of 26 genes or operons was
      reduced in a DeltapvdS mutant compared with wild type, including numerous novel
      pyoverdine biosynthetic genes.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
