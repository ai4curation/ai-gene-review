id: Q9I169
gene_symbol: PA2412
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2412 is a 72-residue MbtH-like protein encoded in the pyoverdine
  biosynthesis cluster of Pseudomonas aeruginosa PAO1 and co-expressed with the
  pyoverdine nonribosomal peptide synthetases. MbtH-like proteins are small
  cytosolic partners of NRPS adenylation domains; PA2412 has a solved 1.8 A
  crystal structure, and its deletion lowers pyoverdine production without
  affecting uptake or use of ferripyoverdine, so it is an accessory component
  of the pyoverdine NRPS assembly line.
