- id: PMID:21478341
  title: Roles of three transporters, CbcXWV, BetT1, and BetT3, in Pseudomonas aeruginosa choline uptake
    for catabolism.
  findings:
  - statement: BetT1 and BetT3 are choline symporters that contribute to choline uptake for catabolism.
    supporting_text: the glycine betaine derived from choline taken up by BetT1 and BetT3 promotes subsequent
      GbdR-mediated cbcXWV induction
  - statement: BetT1 alone does not support growth on choline.
    supporting_text: BetT3 and CbcXWV, but not BetT1, were sufficient to support growth on choline.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract only; full text read on PMC (PMC3133218). PseudoCAP IDA source for GO:0005275,
      GO:0033265 and GO:0042426 and seed of PTN001247333. Choline uptake by BetT1 expressed in E. coli
      MKH13 and reduced uptake in the deletion mutant directly show a choline transporter. No binding assay
      and no catabolic step is attributed to BetT1. The paper also shows that the annotated PA5375 ORF is
      truncated.
