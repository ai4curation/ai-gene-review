gene_model_issues:
- issue_type: WRONG_START_SITE
  status: CONFIRMED
  description: >-
    The annotated PA5375 ORF (Q9HTI9, 516 aa; also PA14_70980) starts 54 bp downstream of the functional
    start and lacks 18 N-terminal residues present in close homologs. Expressed from the annotated start,
    BetT1 does not take up choline in E. coli MKH13; expressed from the upstream start it does. The
    UniProt sequence therefore represents an inactive truncation of the real protein, and residue numbers
    in Q9HTI9 are 18 lower than in the active protein. Annotations of the gene are unaffected.
  evidence_types:
  - ORTHOLOG_COMPARISON
  - OTHER
  supported_by:
  - reference_id: file:PSEAE/betT1/betT1-notes.md
    supporting_text: Sequence analysis showed that the N-terminal amino acid sequence of PA5375 (BetT1) lacked
      18 amino acids that were present in closely related homologs
  - reference_id: file:PSEAE/betT1/betT1-notes.md
    supporting_text: a potential alternative start site was found 54 bp upstream of the annotated start site
