  label: Pseudomonas aeruginosa PAO1
description: >-
  betT1 (PA5375) encodes BetT1, one of three betaine/carnitine/choline transporter (BCCT, TC 2.A.15)
  family secondary transporters of Pseudomonas aeruginosa. It is a multi-pass cytoplasmic membrane protein
  that takes up choline, apparently by proton symport, with high affinity and low capacity. Activity needs
  an 18-residue N-terminal segment encoded from a start codon 54 bp upstream of the annotated one; the
  originally annotated shorter protein is inactive. betT1 lies next to the betIBA choline-oxidation genes,
  is repressed by BetI and induced by choline. Together with BetT3 and the ABC transporter CbcXWV, BetT1
  supplies choline for catabolism to glycine betaine, especially in the first hours after cells meet
  choline and under low-osmolarity conditions, but BetT1 alone cannot support growth on choline.
