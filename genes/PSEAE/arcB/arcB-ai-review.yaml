gene_symbol: arcB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ArcB (PA5172) is the catabolic ornithine carbamoyltransferase of Pseudomonas aeruginosa,
  the second enzyme of the arginine deiminase (ADI) pathway encoded by the arcDABC operon.
  It catalyses the phosphorolysis of L-citrulline to L-ornithine and carbamoyl phosphate,
  which carbamate kinase (ArcC) then uses to make ATP, supporting anaerobic growth on
  arginine. Unlike the anabolic OTC (ArgF), ArcB has poor affinity and marked cooperativity
  for carbamoyl phosphate and does not run the biosynthetic reaction physiologically. It is
  a cytoplasmic dodecamer (tetramer of trimers), allosterically activated by phosphate and
  nucleoside monophosphates and inhibited by polyamines; expression is induced by arginine
  under oxygen limitation.
