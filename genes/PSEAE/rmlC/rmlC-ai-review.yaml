id: Q9HU21
gene_symbol: rmlC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  rmlC (PA5164) encodes dTDP-4-dehydrorhamnose 3,5-epimerase, the third enzyme of the four-step RmlBDAC
  pathway that converts glucose-1-phosphate and dTTP into dTDP-L-rhamnose. RmlC is a small (181 residues)
  homodimeric cupin-fold epimerase that inverts both the C3' and C5' centres of dTDP-6-deoxy-D-xylo-4-hexulose
  to give dTDP-6-deoxy-L-lyxo-4-hexulose, which RmlD then reduces to dTDP-L-rhamnose. Several crystal
  structures of the P. aeruginosa enzyme with substrate analogues have been solved and its active-site
  residues assigned. In P. aeruginosa, dTDP-L-rhamnose supplies the L-rhamnose of the lipopolysaccharide
  outer core, which is the attachment point for both A-band and B-band O antigen, and also the rhamnose of
  the rhamnolipid surfactants. Non-polar rmlC mutants make a truncated core that cannot be capped with O
  antigen.
existing_annotations:
- term:
    id: GO:0000271
    label: polysaccharide biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000471580
  - UniProtKB:P26394
  - UniProtKB:P9WH11
  - UniProtKB:Q9HU21
  review:
    summary: >-
      Polysaccharide biosynthetic process by IBA from PTN000471580, seeded by S. enterica RfbC (P26394),
      M. tuberculosis RmlC (P9WH11) and this gene.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      RmlC is a soluble C3/C5 epimerase that makes the nucleotide-sugar donor dTDP-L-rhamnose; it forms
      no glycosidic bond and adds no residue to a growing polymer, which the rhamnosyl transferases do.
      Supplying a donor is not participation in the polymer-forming process, so this is an
      over-annotation rather than a true-but-general term, and the same donor also feeds non-polymeric
      products elsewhere in the clade. The process RmlC does perform a step of, GO:0019305 dTDP-rhamnose
      biosynthetic process, is accepted in this review. The PTHR21047 family review assesses this IBD
      WRONG_NODE and recommends withdrawing it, and the sibling reviews of ECOLI rfbC, PSEPK rfbC and
      PSEPK rmlC all mark the propagated row over-annotated; an earlier version of this review called it
      TOO_GENERAL, which was wrong. Q9HU21 in WITH/FROM reflects its own experimental rows and is
      expected.
    supported_by:
    - reference_id: PMID:11065359
      supporting_text: >-
        These results provide the genetic and structural evidence that L-Rha is the receptor on the P.
        aeruginosa LPS core for the attachment of O polysaccharides.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000471580
        source_label: PTN000471580
        source_status: SOURCE_BAD
        comment: >-
          LUCA root of PTHR21047, all 38 reference leaves in SF2. Every member makes the soluble
          nucleotide-sugar donor and none forms a glycosidic bond, so GO:0000271 suits the node at
          no depth; the PTHR21047 family review assesses this IBD WRONG_NODE and recommends
          withdrawing it rather than relocating it.
      - source_id: UniProtKB:P26394
        source_label: S. enterica RfbC
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The seed evidence is loss of O antigen in mutants, which records necessity of the donor
          rather than participation in polymer formation.
