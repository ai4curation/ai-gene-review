    label: lipopolysaccharide biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:17046787
  qualifier: involved_in
  review:
    summary: UniProt IDA for LPS biosynthesis from the structure and mechanism paper.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The L-rhamnose whose donor RmlC makes is the core receptor for O antigen, but RmlC attaches
      nothing to the lipopolysaccharide: the glycosyltransferases of the core and O-antigen machinery
      do. The enzymology paper itself establishes the epimerase step rather than LPS synthesis.
      Over-annotated for the same reason as the GO:0000271 rows, and treated the same way on ECOLI
      rfbC (GO:0009103 ISS).
    supported_by:
