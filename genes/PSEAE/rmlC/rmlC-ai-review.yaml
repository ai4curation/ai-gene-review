    label: lipopolysaccharide core region biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:11065359
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA, a seed (via its GO:0000271 ancestor) of the PTN000471580 IBD. Non-polar rmlC mutants
      in PAO1 and PAK made a truncated core lacking the O-antigen attachment point; structural analysis of
      an rmd rmlC double-mutant core placed L-Rha as the receptor.
    action: ACCEPT
    reason: >-
      Abstract only. RmlC makes the dTDP-L-rhamnose donor for the L-Rha residue of the outer core, and the
      mutant analysis shows that the core is incomplete without it, so the gene performs a step of core
      synthesis (precursor supply, as for the other nucleotide-sugar enzymes of the wbp cluster). Seed
      verdict SOUND. The evidence described is mutant analysis, so IMP rather than IDA is the right code;
      recorded as a PROBABLE evidence-code defect.
    supported_by:
    - reference_id: PMID:11065359
      supporting_text: >-
        rmlC mutants of both serotype O5 and serotype O6 synthesized a truncated core region which was
        unable to act as an attachment point for either A-band or B-band O antigen.
    - reference_id: PMID:11065359
      supporting_text: >-
        These results provide the genetic and structural evidence that L-Rha is the receptor on the P.
        aeruginosa LPS core for the attachment of O polysaccharides.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      corrected_value: ECO:0000315
      corrected_label: inferred from mutant phenotype
      confidence: PROBABLE
      explanation: >-
        GO:0009244 for rmlC (Q9HU21, PA5164) is coded IDA to PMID:11065359. The abstract describes
        non-polar chromosomal rmlC mutants whose LPS was analysed by SDS-PAGE, immunoblotting and
        structural analysis of the mutant core: the attribution to rmlC rests on the mutant phenotype,
        so IMP is the appropriate code. The term itself is correct. PROBABLE because the full text
        could include a direct biochemical experiment not described in the abstract.
      supported_by:
      - reference_id: PMID:11065359
        supporting_text: >-
          Non-polar chromosomal rmlC mutants were generated in P. aeruginosa strains PAO1 (serotype O5)
          and PAK (serotype O6) and LPS extracted from the mutants was analysed by SDS-PAGE and Western
