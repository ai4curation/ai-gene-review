suggested_questions:
- question: >-
    Does MexA act only as a structural adaptor, or does it allosterically gate MexB, as the
    chaperone-like MexA-OprM model proposes?
suggested_experiments:
- description: >-
    Compare transport kinetics of MexB reconstituted with wild-type MexA and with MexA mutants
    in the MP and beta-barrel domains that still assemble but cannot contact MexB.
  experiment_type: in vitro transport assay
