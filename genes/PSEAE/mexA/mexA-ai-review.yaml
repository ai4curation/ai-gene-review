taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  mexA (PA0425) encodes MexA, the periplasmic adaptor (membrane fusion protein) of the MexAB-OprM
  resistance-nodulation-cell division (RND) multidrug efflux pump, the main constitutive efflux
  system of Pseudomonas aeruginosa. MexA is a lipoprotein anchored to the inner membrane;
  six MexA molecules form a funnel that joins the MexB transporter trimer to the outer-membrane
  channel OprM, and MexA is needed for MexB proton-coupled transport and for opening of OprM.
  The pump expels beta-lactams, fluoroquinolones, tetracycline, chloramphenicol, macrolides
  and other compounds, including the quorum-sensing signal 3-oxo-C12-homoserine lactone, and
  is a major determinant of intrinsic multidrug resistance.
