- id: PMID:16797016
  title: Alg44, a unique protein required for alginate biosynthesis in Pseudomonas aeruginosa.
  findings:
  - statement: Alg44 disruption blocks alginate production and complementation restores it; the paper
      examines topology, morphology and protein identification.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: Original article read in full as Chapter III of the author thesis (URL/pages in
      notes). No fatty-acid–CoA ligase assay appears in its methods/results. Older localization interpretation
      is qualified by PMID18524915.
- id: PMID:18524915
  title: Membrane topology and roles of Pseudomonas aeruginosa Alg8 and Alg44 in alginate polymerization.
  findings:
  - statement: Alg8 active-site and topology mutations support its glycosyltransferase role; Alg44
      has cytoplasmic PilZ and periplasmic MFP regions and acts as a co-polymerase.
    supporting_text: These studies suggest that Alg44 may act as a co-polymerase in concert with
      Alg8, the major GT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct P. aeruginosa mutagenesis/topology; not a purified Alg44 glycosyltransferase
      assay.
- id: PMID:25817996
  title: Dimeric c-di-GMP is required for post-translational regulation of alginate production in
    Pseudomonas aeruginosa.
  findings:
  - statement: Direct Alg44 PilZ-domain crystallography and binding measurements establish dimeric
      c-di-GMP recognition; binding-site mutations impair alginate production.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct P. aeruginosa Alg44 regulatory-ligand evidence; c-di-GMP binding is distinct
      from polymer glycosyltransferase chemistry.
core_functions:
- description: Binds c-di-GMP through the cytoplasmic PilZ domain and couples this signal to Alg8-dependent
    alginate polymerization; its periplasmic region supports co-polymerase/assembly function, rather
    than independently demonstrated glycosyltransferase chemistry.
  supported_by:
  - reference_id: PMID:25817996
  - *id001
