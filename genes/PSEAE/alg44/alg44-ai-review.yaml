status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: Alg44 is an inner-membrane regulatory co-polymerase required for alginate production.
  Its cytoplasmic PilZ domain recognizes c-di-GMP, while its periplasmic membrane-fusion-protein-like
  region supports coupling of Alg8-dependent polymerization to export.
