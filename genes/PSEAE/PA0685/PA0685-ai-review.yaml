core_functions:
- description: >-
    Secretin (GspD family) of the Hxc type II secretion system; multimerises into the gated
    outer-membrane channel through which the alkaline phosphatase LapA and related exoproteins leave
    the cell under phosphate limitation, with its periplasmic N0 and ring-building domains engaging
    the inner-membrane assembly platform. Uniquely among the characterised secretins of this
    organism it is a lipoprotein, and the lipid anchor on the cysteine beginning its mature chain
    substitutes for a dedicated pilotin in delivering the assembled ring to the outer membrane.
