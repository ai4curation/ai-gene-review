gene_symbol: PA0685
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  HxcQ, the secretin of the Hxc type II secretion system of Pseudomonas aeruginosa PAO1.
  Hxc is the organism's second T2SS, induced under phosphate limitation, and HxcQ forms its
  outer-membrane channel: a heat- and SDS-resistant multimer built from a GspD-family chain
  whose periplasmic N0 and ring-building domains engage the inner-membrane platform while a
  C-terminal beta-barrel spans the outer membrane, creating the conduit through which the
  alkaline phosphatase LapA and related exoproteins leave the cell. HxcQ is unusual among
  secretins in being a lipoprotein, acylated on the cysteine that begins its mature chain.
  The lipid anchor is required for function and substitutes for a dedicated pilotin: without
  it the protein still assembles into multimers but accumulates in the inner membrane, the
  phenotype of a secretin stranded without its pilot, so HxcQ pilots itself to the outer
  membrane.
