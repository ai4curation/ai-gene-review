  review:
    summary: The channel activity of the secretin multimer, proposed as an inference to fill an
      absent molecular function.
    action: NEW
    reason: >-
      GOA gives HxcQ a complex and a process but no molecular function. The secretin is the
      outer-membrane pore: exoproteins cross through it, so the activity is protein transmembrane
      transport and HxcQ performs it rather than merely being required for it.

      Proposed as IC because the inference is the reviewer's. What is directly shown is the
      heat- and SDS-resistant multimer in the outer membrane and that its lipidation-dependent
      assembly there is essential for Hxc function; that the multimer is the conduit follows from
      the family's architecture and from the system failing without it, and was not measured as a
      transport activity in this paper. The same term is asserted on the same reasoning in the
      merged xcpQ review, so the two secretins agree.
