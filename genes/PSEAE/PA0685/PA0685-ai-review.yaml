suggested_questions:
- question: >-
    Should a protein that pilots itself be annotated to the process that normally pilots it?
    GO:0044874 lipoprotein localization to outer membrane exists, and HxcQ's headline result is that
    its lipid anchor plays a pilotin role. It is not annotated here, because that term names what
    the Lol sorting machinery does and HxcQ is the cargo: supplying the acylated cysteine that the
    pathway recognises is being the substrate, not doing the work, and the project's participation
    test excludes it. But the self-piloting conclusion sits awkwardly on the line, and the general
    question -- how to record that a substrate carries its own targeting determinant and so needs no
    dedicated accessory -- recurs for every autotransporter-like case. Worth a convention rather
    than a per-gene decision.
- question: >-
    Is the lipid anchor recordable at all for this protein? GO:0046658 anchored component of plasma
    membrane is obsolete, and HxcQ would be the wrong gene for an anchored-component term anyway: it
    is an integral beta-barrel protein that also carries an acyl anchor, so a term asserting
    anchorage alone would misdescribe its topology. At present the modification is visible only in
    the UniProt LIPID features and in prose.
suggested_experiments:
- description: >-
    Ask whether HxcQ's lipid anchor is sufficient as well as necessary, by transplanting it onto the
    pilotin-dependent XcpQ and testing whether the chimera reaches the outer membrane without its
    pilotin. The published experiment is the loss-of-function direction -- nonlipidated HxcQ strands
    in the inner membrane -- which shows the anchor is required but leaves open whether it carries
    the targeting information by itself or works with features elsewhere in HxcQ. The reciprocal
    transplant, putting XcpQ's pilotin-binding region on HxcQ, would test the same question from the
    other side.
knowledge_gaps:
- gap_statement: >-
    How an acyl anchor delivers an assembled multimeric ring to the outer membrane. The Lol pathway
    is understood for monomeric lipoproteins, but HxcQ multimerises before or during transit -- the
    nonlipidated variant is already multimeric when it strands in the inner membrane -- and it is
    unknown whether a lipoprotein sorting pathway can handle a pre-assembled ring, whether HxcQ is
    sorted as a monomer and assembles after arrival, or whether an undescribed route operates. The
    published data are consistent with more than one of these and distinguishing them needs
    wet-lab work.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
