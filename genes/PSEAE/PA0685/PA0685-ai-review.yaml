- id: PMID:19815547
  title: HxcQ liposecretin is self-piloted to the outer membrane by its N-terminal lipid anchor.
  findings:
  - statement: HxcQ behaves biochemically as a secretin, forming the heat- and SDS-resistant
      high-mass multimer characteristic of the family.
    supporting_text: We found that HxcQ forms high molecular mass structures resistant to heat and
      SDS, revealing its secretin nature.
    reference_section_type: ABSTRACT
  - statement: HxcQ is a lipoprotein, which is what distinguishes it from the pilotin-dependent
      secretins.
    supporting_text: Interestingly, we showed that HxcQ is a lipoprotein.
    reference_section_type: ABSTRACT
  - statement: The lipid is functionally required rather than incidental, shown with a recombinant
      nonlipidated protein.
    supporting_text: Construction of a recombinant nonlipidated HxcQ (HxcQnl) revealed that
      lipidation is essential for HxcQ function.
    reference_section_type: ABSTRACT
  - statement: Removing the lipid mislocalises the protein to the inner membrane while leaving it
      able to multimerise, reproducing the phenotype of a secretin without its pilotin. So
      lipidation is a targeting determinant and not an assembly determinant.
    supporting_text: Further phenotypic analysis indicated that HxcQnl accumulates as multimers in
      the inner membrane of P. aeruginosa, a typical phenotype observed for secretins in the
      absence of their cognate pilotin.
    reference_section_type: ABSTRACT
  - statement: The authors' conclusion, that the lipid anchor substitutes for a pilotin.
    supporting_text: Our observations led us to the conclusion that the lipid anchor of HxcQ plays
      a pilotin role.
    reference_section_type: ABSTRACT
  - statement: Self-piloting was confirmed in a heterologous host, which rules out a P. aeruginosa
      specific factor supplying the pilotin function.
    supporting_text: The self-piloting of HxcQ to the OM was further confirmed by its correct
      multimeric OM localization when expressed in the heterologous host Escherichia coli.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The sole experimental reference in GOA for this gene and the source of the PseudoCAP IDA row.
      PubMed-verified as Viarre V, Cascales E, Ball G, Michel GP, Filloux A, Voulhoux R, J Biol Chem
      2009. Full text is cached. The abstract alone states every result relied on here, naming HxcQ
      throughout.
- id: PMID:11985723
  title: A novel type II secretion system in Pseudomonas aeruginosa.
  findings:
  - statement: The hxc cluster was identified as a second, xcp-independent type II secretion
      pathway, which is what makes HxcQ the secretin of a distinct system rather than a second copy
      of XcpQ.
    supporting_text: In this study, we characterized a novel gene cluster, called hxc for
      homologous to xcp.
    reference_section_type: ABSTRACT
  - statement: >-
      The system's substrate and its phosphate dependence were established here. An hxcR mutant
      grown under phosphate limitation loses the alkaline phosphatase LapA from the supernatant,
      while xcp mutants retain it.
    supporting_text: The protein corresponded to the alkaline phosphatase L-AP, renamed LapA, which
      is secreted in an xcp-independent but hxc-dependent manner.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not cited in GOA for this gene; added because it establishes the identity and cargo of the
      system HxcQ serves, which the description and the process rows rest on. PubMed-verified as
      Ball G, Durand E, Lazdunski A, Filloux A, Mol Microbiol 2002. Abstract only. It assays hxcR
      rather than hxcQ, so it supports the system-level claims and not the protein-level ones.
