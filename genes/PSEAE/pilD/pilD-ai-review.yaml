id: P22610
gene_symbol: pilD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PilD (XcpA, PA4528) is the type IV prepilin peptidase of Pseudomonas
  aeruginosa, a 290-residue polytopic inner-membrane protein of the peptidase
  A24 family. It is bifunctional: it cleaves the short basic leader peptide
  from type IV prepilins at the cytoplasmic face of the inner membrane
  (EC 3.4.23.43; A24 peptidases are aspartic proteases with an invariant
  pair of catalytic Asp residues) and then transfers a methyl group from
  S-adenosyl-L-methionine to the alpha-amino group of the newly exposed
  N-terminal phenylalanine. A cytoplasmic domain with four conserved
  cysteines binds zinc, which is required for methylation but not for
  cleavage. Its substrates are the major pilin PilA and the minor pilins of
  the type IV pilus, and the pseudopilins XcpT, XcpU, XcpV and XcpW of the
  Xcp type II secretion system. PilD is therefore required both for type IV
  pilus biogenesis and for type II secretion of exoproteins such as elastase,
  phospholipase C and exotoxin A, which accumulate in the periplasm of pilD
  mutants. Methylation is not required for pilus assembly.
