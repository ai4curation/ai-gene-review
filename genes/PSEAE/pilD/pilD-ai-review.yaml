- term:
    id: GO:0015627
    label: type II protein secretion system complex
  evidence_type: IDA
  original_reference_id: PMID:1588814
  qualifier: part_of
  review:
    summary: >-
      PseudoCAP part_of T2SS complex citing Bally et al. 1992, which showed
      that XcpA/PilD processes the Xcp pseudopilins in vivo.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PilD is required for type II secretion because it matures the
      pseudopilins XcpT-W, but the cited abstract shows processing of Xcp
      proteins by PilD, not that PilD is a subunit of the envelope-spanning
      secretion complex. PilD is a maturation enzyme shared with the type IV
      pilus system, encoded outside the xcp cluster. Comparator check: no other
      reviewed A24 prepilin peptidase (PulO, OutO, E. coli GspO, Vibrio
      TcpJ/VvpD) carries GO:0015627 in GOA. The role in type II secretion is
      real but is better captured as a process; the full text was not seen,
      so the row is marked rather than removed.
    supported_by:
    - reference_id: PMID:1588814
      supporting_text: >-
        The N-termini of four of the encoded Xcp proteins display similarity to
        the N-termini of type IV pili, suggesting that XcpA is involved in the
        processing of these Xcp proteins. This could indeed be demonstrated in
        vivo.
    - reference_id: PMID:8331069
      supporting_text: >-
        These studies demonstrate that the biogenesis of the apparatus of
        extracellular protein secretion and that of type IV pili share a
        requirement for PilD.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0015627
      cause: UNKNOWN
      confidence: PROBABLE
      explanation: >-
        part_of GO:0015627 type II protein secretion system complex (IDA) on
        PA4528 pilD cites Bally et al. 1992 (PMID:1588814), whose abstract
        shows that XcpA/PilD processes the pseudopilins XcpT-W in vivo. That
        supports a role in type II secretion (processing of secretion
        apparatus components), not membership of the secretion complex; PilD
        is the prepilin peptidase shared with the type IV pilus system. Please
        consider replacing it with involved_in GO:0015628 protein secretion by
        the type II secretion system (e.g. IMP, PMID:1671384) or deleting it.
