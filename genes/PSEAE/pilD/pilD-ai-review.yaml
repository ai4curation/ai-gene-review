suggested_questions:
- question: >-
    Should PilD and other bifunctional or T2SS-associated prepilin peptidases
    carry involved_in GO:0015628 protein secretion by the type II secretion
    system, given that pilD mutants fail to secrete Xcp substrates because
    the pseudopilins are not matured? No A24 family member currently carries
    the term, which suggests a convention to clarify (maturation of
    machine components vs participation in secretion).
- question: >-
    The obsolete GO:0008978 prepilin peptidase activity once captured the
    EC 3.4.23.43 reaction; is GO:0004190 plus GO:0071885 the intended
    replacement for bifunctional prepilin peptidases, and should the
    methyltransferase half be recorded for A24 family members that lack
    the conserved cysteine domain?
suggested_experiments:
- description: >-
    Mutate the conserved Asp pair of P. aeruginosa PilD (equivalent to TcpJ
    Asp125/Asp189) and test leader-peptide cleavage by purified enzyme, to
    confirm directly that PilD uses the aspartic mechanism assigned to the
    family.
