suggested_questions:
- question: >-
    Which genes of the >500-gene AmpR regulon are direct targets? ChIP-seq of AmpR with and without
    beta-lactam would separate direct from indirect (QS- or sigma-factor-mediated) effects.
suggested_experiments:
- description: >-
    ChIP-seq of epitope-tagged AmpR in PAO1 with and without sub-MIC beta-lactam, combined with EMSA of
    purified AmpR at selected promoters (mexR, lasR, rhlR, poxB).
