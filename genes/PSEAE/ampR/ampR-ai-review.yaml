taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AmpR (PA4109) is the LysR-type transcriptional regulator (LTTR) of the chromosomal AmpC
  beta-lactamase of Pseudomonas aeruginosa PAO1, encoded divergently from ampC. It binds the ampC
  promoter through its N-terminal helix-turn-helix domain (Ser38 and Lys42 are needed for binding) and
  activates ampC transcription in response to beta-lactams; its effector-binding domain recognises
  cell-wall-derived muropeptides, linking peptidoglycan recycling to beta-lactamase induction. AmpR
  dimerises, may be membrane associated, and does not autoregulate. Beyond ampC it is a global regulator:
  loss of ampR alters expression of over 500 genes, including the PoxB beta-lactamase, the MexEF-OprN
  efflux pump, quorum-sensing regulators and QS-controlled virulence factors (pyocyanin, LasA and LasB
  proteases), type III and VI secretion genes and biofilm formation. Many of these effects are probably
  indirect, through other regulators.
