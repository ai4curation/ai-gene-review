    summary: IBA adenine catabolic process.
    action: ACCEPT
    reason: >-
      Deamination of adenine to hypoxanthine is the first step of adenine breakdown, and PA0148
      catalyses it; it is the only adenine deaminase class found in a given bacterium according to
      the characterising paper.
    supported_by:
    - reference_id: PMID:21710971
      supporting_text: >-
