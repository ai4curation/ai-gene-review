taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0148 is the adenine deaminase of Pseudomonas aeruginosa, a mononuclear zinc enzyme of the
  amidohydrolase superfamily (adenosine/AMP deaminase family, group 3 of cog1816) long misannotated
  as an adenosine deaminase. The purified enzyme hydrolytically deaminates adenine to hypoxanthine
  and ammonia with kcat/Km above 10^5 M-1 s-1, also accepts 6-chloropurine, 6-methoxypurine,
  N6-methyladenine and 2,6-diaminopurine, and has no detectable activity on adenosine. Crystal
  structures with adenine, hypoxanthine and 6-chloropurine show a distorted (beta/alpha)8 barrel
  with one zinc ion bound by His16, His18, His196 and Asp277, and a tyrosine that blocks the ribose
  pocket. By converting adenine to hypoxanthine it feeds purine salvage and catabolism.
