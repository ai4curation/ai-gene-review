  review:
    summary: IBA hypoxanthine salvage from yeast AAH1 and S. pombe seeds.
    action: KEEP_AS_NON_CORE
    reason: >-
      PA0148 produces hypoxanthine from adenine, which fits the GO definition of generating
      hypoxanthine from a derivative without de novo synthesis, and the yeast seeds show this role
      in vivo. Its physiological use in P. aeruginosa (salvage to IMP versus catabolism) has not
      been tested, so the term is kept as a plausible but peripheral process.
