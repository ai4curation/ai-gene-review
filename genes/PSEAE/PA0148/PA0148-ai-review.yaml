suggested_questions:
- question: >-
    Does P. aeruginosa use PA0148 mainly to salvage adenine via hypoxanthine to IMP, or to catabolise
    adenine as a nitrogen source?
suggested_experiments:
- description: >-
    Compare growth of a PA0148 deletion mutant with adenine as sole nitrogen source and in a purine
    auxotroph background supplied with adenine, with complementation.
