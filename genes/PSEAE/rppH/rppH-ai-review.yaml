suggested_questions:
- question: >-
    Does P. aeruginosa RppH, like E. coli RppH, prefer 5'-diphosphorylated RNA
    generated by a separate kinase/phosphatase step, and which PA0336-dependent
    transcripts (for example phz operon mRNAs) are its direct substrates?
suggested_experiments:
- description: >-
    Measure 5'-end phosphorylation state and half-life of pyocyanin-pathway
    transcripts in wild type and a PA0336 catalytic mutant (PPP/PP/P-RNA
    sequencing), and assay purified PA0336 on 5'-triphosphate and
    5'-diphosphate RNA substrates.
