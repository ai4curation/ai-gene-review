  - SGD:S000005062
  - WB:WBGene00003582
  review:
    summary: >-
      IBA from PTN000561806, seeded only by eukaryotic Dcp2-type decapping
      enzymes (yeast, fission yeast, fly, worm). Bacteria have no nucleus, no
      m7G cap and no deadenylation-dependent decay pathway.
    action: REMOVE
    reason: >-
      Taxon mismatch. The term describes a nuclear-transcribed mRNA decay
      pathway of eukaryotes; the bacterial RppH acts on 5'-triphosphorylated
      primary transcripts upstream of RNase E. The bacterial counterpart of the
      process is captured by GO:0006402 mRNA catabolic process (core function).
    supported_by:
