- id: PMID:28833678
  title: Nudix-type RNA pyrophosphohydrolase provides homeostasis of virulence factor
    pyocyanin and functions as a global regulator in Pseudomonas aeruginosa.
  findings:
  - statement: PA0336 complements an E. coli rppH defect, indicating it mediates RNA turnover in vivo.
    supporting_text: Trans-complementation experiments showed that the P. aeruginosa
      enzyme can functionally substitute for RppH in E. coli cells indicating that, similar
      to RppH, the Pseudomonas hydrolase mediates RNA turnover in vivo.
  - statement: The pyocyanin phenotype of the mutant requires the catalytic activity for complementation.
    supporting_text: This phenotype was reversed by complementation with the wild type
      but not catalytically inactive PA0336, indicating that the catalytic activity
      was indispensable for its biological function.
  - statement: Loss of PA0336 changes the level of 537 transcripts.
    supporting_text: The level of 537 transcripts coding for proteins involved in a variety
      of cellular processes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP GO:0034353 row, seed of PTN001500664 together
      with E. coli RppH (P0A776). Abstract only (Mol Microbiol, not in PMC). The
      abstract reports heterologous complementation of E. coli RppH and loss of
      complementation by a catalytically inactive variant, which is functional
      evidence for the RNA pyrophosphohydrolase activity; whether the full text
      also has an in vitro assay could not be checked.
