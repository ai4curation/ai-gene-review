id: Q9X4P2
gene_symbol: rppH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  RppH (PA0336) is the Nudix-family RNA pyrophosphohydrolase of Pseudomonas
  aeruginosa. By homology with Escherichia coli RppH it removes pyrophosphate
  from the 5' end of triphosphorylated (or diphosphorylated) primary
  transcripts, leaving a 5'-monophosphate that stimulates RNase E-dependent
  decay. The P. aeruginosa protein substitutes for RppH in E. coli. Loss of
  PA0336 alters the abundance of several hundred transcripts, raises pyocyanin
  production and increases virulence in Caenorhabditis elegans, and the
  pyocyanin phenotype needs the catalytic activity, so RppH acts as a broad
  post-transcriptional regulator through mRNA turnover.
