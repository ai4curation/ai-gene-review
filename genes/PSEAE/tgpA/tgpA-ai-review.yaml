- id: PMID:23209712
  title: TgpA, a protein with a eukaryotic-like transglutaminase domain, plays a critical
    role in the viability of Pseudomonas aeruginosa.
  findings:
  - statement: >-
      The purified periplasmic domain (aa 180-544) of PA2873 is active in a
      colorimetric transglutaminase assay, at about 45% of the guinea-pig
      reference enzyme, and the activity is not abolished by EDTA, so it is
      calcium-independent.
    supporting_text: >-
      In actual fact, 2.5 µg of TG180–544, equal to reference gpTGase, showed
      TGase activity that differed significantly from the negative control and
      was about 45% of gpTGase activity in the absence of EDTA.
  - statement: >-
      The assay measures incorporation of biotin-cadaverine into immobilised
      CBZ-Gln-Gly, that is gamma-glutamyl transfer to a primary amine, not
      protein-to-protein cross-linking.
    supporting_text: >-
      Transglutaminase activity (TGase; EC 2.3.2.13) was assayed by a
      Transglutaminase Colorimetric Microassay Kit (Covalab) which uses
      immobilized N-carbobenzoxy(CBZ)-Gln-Gly as amine acceptor and
      biotin-conjugated cadaverine as amine donor.
  - statement: >-
      TgpA is detected in PAO1 membrane fractions and its periplasmic domain is
      accessible to trypsin shaving.
    supporting_text: >-
      Since all five PA2873 peptides “shaved” by trypsin belonged to the
      predicted outside membrane domain, this strongly supports the notion that
      it actually emerges from membrane itself.
  - statement: >-
      Antisense knockdown and conditional expression show tgpA is required for
      viability; the authors propose an essential cell-envelope function and
      note that related TG-domain proteins act as pseudomurein endoisopeptidases
      or as an LPS O-antigen deamidase.
    supporting_text: >-
      Therefore, we suggest that TgpA takes part in an essential function linked
      to the cell wall.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and PubMed-verified (PLoS One 2012, PMC3507681). The
      single source of every experimental annotation for this gene. The
      transglutaminase assay is a surrogate-substrate kit assay on an isolated
      domain expressed in E. coli; read in full, it supports gamma-glutamyl
      transfer chemistry but not the protein-protein cross-linking in GO's
      definition of GO:0003810, which is why the IBD at PTN002126683 is
      questioned.
core_functions:
- description: >-
    Inner-membrane enzyme whose periplasmic transglutaminase-like domain
    catalyses gamma-glutamyl transfer from a glutamine acyl donor to an amine
    acceptor, demonstrated in vitro with surrogate substrates and independent of
    calcium. The reaction is positioned in the periplasm by six transmembrane
    helices, and the activity is required for viability, most plausibly through a
    cell-envelope substrate that has not yet been identified.
  molecular_function:
    id: GO:0003810
    label: protein-glutamine gamma-glutamyltransferase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:23209712
    supporting_text: >-
      TG180–544 was positive to the TGase test.
  - reference_id: PMID:23209712
    supporting_text: >-
      Since all five PA2873 peptides “shaved” by trypsin belonged to the
      predicted outside membrane domain, this strongly supports the notion that
      it actually emerges from membrane itself.
  knowledge_gaps:
  - gap_statement: >-
      The physiological acyl donor and amine acceptor of TgpA are unknown, so it
      is not established whether it cross-links proteins (as GO:0003810
      requires), transfers glutamyl groups onto a small amine or an amino sugar,
      or deamidates an envelope polymer as its Bordetella relative WbmE does.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    What does TgpA modify in the periplasm, and is the reaction a
    protein-protein isopeptide cross-link, an amine incorporation, or a
    deamidation?
- question: >-
    Is the catalytic triad (Cys404, His448, Asp464) required for viability, or is
    the essential role of TgpA structural and separable from its catalytic
    activity?
suggested_experiments:
- description: >-
    Assay the purified periplasmic domain against candidate envelope substrates
    (peptidoglycan precursors and sacculi, LPS O-antigen, outer-membrane and
    periplasmic proteins) with and without labelled amine donors, and detect
    isopeptide or deamidation products by mass spectrometry, to replace the
    surrogate-substrate annotation with the physiological reaction.
- description: >-
    Complement a conditional tgpA depletion strain with catalytic-triad
    substitutions (C404A, H448A, D464A) expressed from the chromosome, to test
    whether the essential function requires catalysis; combined with envelope
    phenotyping (sacculus composition, LPS profile, sensitivity to envelope
    stress) this would identify the pathway TgpA acts in.
- description: >-
    Characterise two or three uncharacterised leaves of PTN002126683 from
    different phyla (for example Synechocystis sll1608, B. subtilis YebA,
    Deinococcus DR_0620) in the same assay, which would settle whether the
    node-level transglutaminase annotation is justified or should be generalised.
