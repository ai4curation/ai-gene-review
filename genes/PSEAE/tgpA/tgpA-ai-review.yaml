      record: PANTHER:PTN002126683
      requested_change: CHECK
      asserted_value: GO:0003810
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The IBD of GO:0003810 protein-glutamine gamma-glutamyltransferase
        activity at PTN002126683 rests on one seed, P. aeruginosa TgpA
        (Q9HZX3), and propagates to 17 leaves in 15 taxa, none of which is
        functionally characterised. Two reasons to reconsider the term. First,
        the seed evidence is a colorimetric kit assay on the isolated
        periplasmic domain with a blocked dipeptide acyl donor and
        biotin-cadaverine as amine donor; GO:0003810 is defined as the
