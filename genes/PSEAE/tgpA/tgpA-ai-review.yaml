  review:
    summary: >-
      IBA from PTN002126683 (PTHR42736), whose only seed is TgpA itself. The
      claim is defensible for TgpA, whose purified catalytic domain is active
      in a transglutaminase assay, but the node carries a very precise
      EC-level term across a clade of transglutaminase-like membrane proteins
      that have not been characterised.
    action: ACCEPT
    reason: >-
      For this gene the term rests on the gene's own experiment, and TgpA in
      its own With/From is the expected marker of that grounding, not
      circularity. I do not challenge the row on the target. The node
      placement is the problem and is recorded as a GO_CENTRAL source defect:
      the transglutaminase-like superfamily is a papain-like fold used for
      several different chemistries (proteases, deamidases, cysteine
      peptidases), the only characterised close relative cited by the same
      authors, Bordetella WbmE, is an LPS O-antigen deamidase rather than a
      cross-linker, and the seed itself is a surrogate-substrate assay on an
      isolated domain with no physiological substrate identified.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN002126683
        source_label: PTN002126683 (PTHR42736)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          17 leaf IBAs in 15 taxa in the PAINT leaf file, spanning Chloroflexi,
          Aquificae, Thermodesulfovibrio, Dictyoglomus, cyanobacteria,
          Deinococcus, Planctomycetes (three Rhodopirellula paralogues),
          Firmicutes, Streptomyces, Shewanella, Geobacter and Xanthomonas.
          Every leaf is named only by its domain content ("transglutaminase
          domain protein", "transglutaminase-like domain-containing protein"),
          so the clade is uncharacterised apart from TgpA, and a precise EC
          2.3.2.13 cross-linking term is more than descent from this node
          supports.
      - source_id: UniProtKB:Q9HZX3
        source_label: tgpA (self; sole IBD seed)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The in vitro assay on the purified periplasmic domain is real
          experimental grounding for the chemistry, but it was done with the
          kit's dipeptide acyl donor and biotin-cadaverine amine donor, so it
          constrains the catalytic chemistry rather than the physiological
          reaction.
    supported_by:
    - reference_id: PMID:23209712
      supporting_text: >-
        In this study we show that the periplasmic portion of the PA2873 protein
        does have transglutaminase activity in vitro.
