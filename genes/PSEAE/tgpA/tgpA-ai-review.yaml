gene_symbol: tgpA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  TgpA (PA2873) is a 668-residue polytopic inner-membrane protein of
  P. aeruginosa built from an N-terminal DUF3488 region of six predicted
  transmembrane helices and a large periplasmic domain (residues 180-544) that
  contains a transglutaminase-like (papain-fold) catalytic core with a
  conserved Cys-His-Asp triad (Cys404, His448, Asp464); a crystal structure of
  this domain is available (PDB 6G49, 6G4H). The purified periplasmic domain
  incorporates an amine donor into a glutamine-containing acyl donor in a
  colorimetric transglutaminase assay, at about 45% of the guinea-pig
  transglutaminase reference, and unlike the eukaryotic enzyme its activity is
  not lost on adding EDTA, so it is calcium-independent like other microbial
  transglutaminases. The protein is detected in PAO1 membrane fractions with
  its periplasmic domain exposed to trypsin shaving, and it is expressed in
  exponential and stationary phase from an operon with PA2874-PA2875.
  Antisense knockdown and conditional-promoter depletion show that tgpA is
  essential for viability; its physiological substrate is unknown, and the
  authors propose a cell-envelope role.
