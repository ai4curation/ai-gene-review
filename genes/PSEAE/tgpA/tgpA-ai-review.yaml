    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:23209712
  qualifier: located_in
  review:
    summary: >-
      TgpA peptides were identified by MudPIT in washed PAO1 total-membrane
      fractions, and all five peptides recovered by trypsin shaving of intact
      membranes lay in the predicted periplasmic domain.
    action: ACCEPT
    reason: >-
      Direct detection of the protein in the membrane fraction, with the
      shaving result independently showing that the catalytic domain is exposed
      on the periplasmic face; six predicted transmembrane helices and a PhoA
      fusion screen agree. This is where the protein acts, so it belongs in the
      core function. The assay cannot distinguish inner from outer membrane on
      its own, but a polytopic helical protein with a periplasmic catalytic
      domain is an inner-membrane protein, and UniProt records Cell inner
      membrane.
    supported_by:
    - reference_id: PMID:23209712
      supporting_text: >-
        Since all five PA2873 peptides “shaved” by trypsin belonged to the
        predicted outside membrane domain, this strongly supports the notion
        that it actually emerges from membrane itself.
