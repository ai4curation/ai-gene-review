- term:
    id: GO:0003810
    label: protein-glutamine gamma-glutamyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:23209712
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA and, with the identical UniProt row, the seed of the IBD at
      PTN002126683. The purified His-tagged periplasmic domain (aa 180-544) was
      positive in a transglutaminase colorimetric assay at about 45% of the
      guinea-pig reference, and its activity was EDTA-insensitive.
    action: ACCEPT
    reason: >-
      This is the gene product's own activity measured on purified protein, not
      a mutant phenotype, and the assayed reaction (gamma-glutamyl transfer
      from a glutamine donor to a primary amine) is the reaction EC 2.3.2.13
      names, to which GO:0003810 is an exact match; UniProt curators
      independently made the same call. The caveat, which I record rather than
      act on, is that the assay used the kit's surrogate substrates, so the
      protein-to-protein isopeptide cross-linking in GO's definition has not
      been shown for TgpA and no physiological substrate is known; that is the
      ground for questioning the node term, not this row.
    supported_by:
    - reference_id: PMID:23209712
      supporting_text: >-
        TG180–544 was positive to the TGase test.
    - reference_id: PMID:23209712
      supporting_text: >-
        In actual fact, 2.5 µg of TG180–544, equal to reference gpTGase, showed
        TGase activity that differed significantly from the negative control and
        was about 45% of gpTGase activity in the absence of EDTA.
