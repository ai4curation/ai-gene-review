- id: PMID:1903349
  title: >-
    Pyoverdine-mediated iron transport in Pseudomonas aeruginosa: involvement of a
    high-molecular-mass outer membrane protein.
  findings:
  - statement: >-
      The paper identifies the 90 kDa iron-regulated outer membrane protein later shown to be
      FpvA.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Reduced expression of an iron-regulated outer membrane protein (IROMP) of approximate
      molecular mass 90,000
  - statement: >-
      Its result is a transport defect, not a signalling defect: the mutant fails to take up
      ferripyoverdine.
    reference_section_type: ABSTRACT
    supporting_text: >-
      a mutant lacking the 90 kDa protein transported barely detectable levels of
      ferri-pyoverdine
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      PubMed-verified (Poole, Neshat & Heinrichs 1991). Abstract only. A genuine and important
      paper on this protein - it identified the 90 kDa IROMP responsible for
      pyoverdine-mediated iron transport - but what it demonstrates is transport, and it is
      cited here on the GO:0038023 signaling receptor activity row. The abstract makes no
      mention of signal transduction, and cell-surface signalling by TonB-dependent
      transducers was not described until roughly a decade later, so the concept postdates
      the work. The evidence it supplies belongs to the transporter rows. Recorded as a
      WRONG_REFERENCE query at PROBABLE on that row; the term itself is well supported on this
      gene by PMID:15968062 and PMID:18641139.
- id: PMID:12029043
  title: FpvA receptor involvement in pyoverdine biosynthesis in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Deleting fpvA reduces pyoverdine production, and the paper states the mechanism: a
      decline in expression of the biosynthetic genes. The effect is regulatory, not
      catalytic.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Deletion of fpvA from the chromosome of P. aeruginosa reduced pyoverdine production in
      this organism, as a result of a decline in expression of genes (e.g., pvdD) associated
      with the biosynthesis of the pyoverdine peptide moiety.
  - statement: >-
      The two functions come apart: an N-terminally truncated receptor still transports
      ferripyoverdine while failing to support pyoverdine production, which is only
      intelligible if the production effect is signalling.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The truncated receptor was, however, functional in pyoverdine-mediated iron uptake
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Shen, Meldrum & Poole, J Bacteriol 2002; DOI
      10.1128/JB.184.12.3268-3275.2002), full text cached. The title says "involvement in
      pyoverdine biosynthesis", but the abstract states that the involvement is through
      expression of the pvd genes rather than through any step of the synthesis, and shows
      that a truncated receptor retains transport while losing the biosynthesis effect. Read
      carefully the paper supports a regulatory annotation, which is why the GO:0002049 row
      it underwrites is MODIFYed to a positive-regulation term rather than accepted. A good
      example of a title that invites exactly the annotation the body argues against.
