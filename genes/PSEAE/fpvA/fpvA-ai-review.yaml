suggested_questions:
- question: >-
    Does FpvA signal in response to iron-loaded pyoverdine only, or also to apo-pyoverdine?
    The metal-dependence study addresses binding, but whether occupancy by the ferric form is
    what the periplasmic domain reports would determine whether the system measures
    siderophore availability or iron availability.
- question: >-
    Can transport and signalling be separated cleanly enough to assign the positive-regulation
    annotation to the signalling function alone? Most linker insertions affected both
    activities, and only a minority were transport-specific, which leaves open how far the two
    share a mechanism.
suggested_experiments:
- description: >-
    Compare pyoverdine-dependent reporter induction and ferripyoverdine uptake in strains
    carrying the transport-specific and signalling-specific linker insertions, under defined
    iron and apo-pyoverdine loads, to establish which ligand state the signalling domain
    reports.
- description: >-
    Quantify pvd gene expression in an fpvA deletion complemented with the N-terminally
    truncated receptor, to confirm directly that the positive regulation of siderophore
    biosynthesis tracks the signalling domain rather than transport capacity.
