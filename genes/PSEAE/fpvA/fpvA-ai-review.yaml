- term:
    id: GO:0002049
    label: pyoverdine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:12029043
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row from the paper titled "FpvA receptor involvement in pyoverdine
      biosynthesis". The full text states that the involvement is a decline in expression of
      the biosynthetic genes, so the effect is regulatory: FpvA performs no step of pyoverdine
      synthesis.
    action: MODIFY
    reason: >-
      The relation is wrong, not the biology. The synthetases do the work - pvdL, pvdD and
      pvdJ, all reviewed in this corpus - while FpvA signals, and the cited paper says so in
      as many words. Its own control settles it: an N-terminally truncated receptor still
      transports ferripyoverdine but no longer supports pyoverdine production, which is only
      intelligible if the production effect is signalling rather than participation.
      PMID:15968062 corroborates independently, describing FpvA as part of a signal
      transduction pathway that controls pyoverdine production. The replacement is GO:1900706
      positive regulation of siderophore biosynthetic process, found in OLS alongside its
      neutral parent GO:1900704 and negative sibling GO:1900705; positive is the right sign
      because deleting fpvA reduced production. This is a lateral correction rather than a
      refinement - the replacement is not a descendant - which the project rules sanction as
      a long-standing use of MODIFY, and this row's own evidence supports the replacement
      directly. GO has no regulation term specific to pyoverdine, so the replacement trades
      substance specificity for correctness of relation; proposing a pyoverdine-specific
      child would be term churn and is not done.
    proposed_replacement_terms:
    - id: GO:1900706
      label: positive regulation of siderophore biosynthetic process
