id: P48632
gene_symbol: fpvA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FpvA (PA2398) is the ferripyoverdine receptor of Pseudomonas aeruginosa, an 815-residue
  TonB-dependent outer-membrane transducer. It is bifunctional and the two activities are
  experimentally separable. As a transporter it binds iron-loaded pyoverdine at a
  plug-occluded beta-barrel and imports it across the outer membrane using energy
  transmitted from the proton motive force through TonB, which is the organism's main route
  for recovering iron from its own siderophore. As a signal transducer it uses a periplasmic
  N-terminal domain to relay siderophore occupancy to the anti-sigma factor FpvR, releasing
  the sigma factors that control production of pyoverdine, FpvA itself, an exotoxin and a
  protease. Its structure has been determined, and linker-insertion mutants exist that
  abolish transport while leaving signalling intact and vice versa.
