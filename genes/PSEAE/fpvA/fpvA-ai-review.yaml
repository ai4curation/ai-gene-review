    reference_section_type: ABSTRACT
    supporting_text: >-
      the remaining mutations eliminated either the transport or signaling function of
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (James, Beare, Martin & Lamont 2005), full text cached. Titled for the
      signal-transducing function and the strongest support on this gene for GO:0038023: it
