  label: Pseudomonas aeruginosa PAO1
description: PA0506 encodes FadE1, a homodimeric FAD-dependent acyl-CoA dehydrogenase of Pseudomonas aeruginosa
  PAO1. Purified full-length protein oxidizes C16, C18 and C8 acyl-CoAs, with substantially weaker C6
  activity; C4 was not determined. The enzyme supplies fatty-acyl-CoA dehydrogenation chemistry used in
  beta-oxidation. Physiological pathway evidence includes functional counterparts in PA14, while the measured
  catalytic and structural properties are from PAO1-derived recombinant proteins. The physiological electron
  acceptor and any membrane-associated relay remain unresolved.
