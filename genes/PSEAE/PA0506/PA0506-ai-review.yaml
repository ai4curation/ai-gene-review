      descendants require ETF, whose physiological role remains unproven; use the acceptor-unspecified
      proposed reaction. Engineered mutants and PA14 growth phenotypes do not silently redefine wild-type
      PAO1 substrate specificity. The structured replacement retains long and medium substrate-class capability;
