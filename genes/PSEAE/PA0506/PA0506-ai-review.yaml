    action: MODIFY
    summary: Refine broad CH-CH redox activity to the measured acyl-CoA dehydrogenation reaction.
    reason: Direct PAO1 recombinant assays establish oxidation of C16, C18 and C8 acyl-CoAs, with substantially
      weaker C6 activity; C4 was not determined. The broad category is true but underspecifies the donor
