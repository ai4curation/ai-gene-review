  review:
    action: MODIFY
    summary: Correct the unestablished net-acceptor specificity while preserving directly measured acyl-chain
      capabilities.
    reason: GO:0052890 does not explicitly name ETF, but its EC1.3.8.- meaning concerns the reaction electron
      acceptor, not merely a bound flavin prosthetic group. Reduction of enzyme-bound FAD is a half-reaction
      and does not identify the net acceptor. FAD-containing quinone-linked succinate dehydrogenase is
      a counterexample to equating those roles. PAO1 steady-state assays use artificial ferrocenium, and
      PMID40057486 explicitly leaves the physiological relay unproven. MODIFY corrects unestablished acceptor
      specificity and preserves C16/C18 and C8 capability, with substantially weaker C6 activity; C4 was
      not determined. This is a correction/generalization of the acceptor dimension, not an is_a refinement
      or a claim that ETF is impossible.
