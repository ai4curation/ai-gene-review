proposed_new_terms:
- proposed_name: positive regulation of alginic acid biosynthetic process
  proposed_definition: >-
    Any process that activates or increases the frequency, rate or extent of the chemical reactions and
    pathways resulting in the formation of alginic acid.
  justification: >-
    Alginate regulators such as AlgB (and AlgR, AmrZ) act on transcription of the alginate operon, not
    on the chemistry, and are currently annotated to the biosynthetic process itself because no regulation
    term exists.
  proposed_parent:
    id: GO:0032885
    label: regulation of polysaccharide biosynthetic process
  supported_by:
  - reference_id: PMID:1738315
    supporting_text: >-
      regulates the expression of the alginate biosynthetic gene, algD, thereby resulting in increased
      expression of alginate in mucoid P. aeruginosa
  - reference_id: PMID:17981963
    supporting_text: >-
      Chromosome immunoprecipitation revealed that AlgB bound in vivo to PalgD but did not bind when AlgB
      had an R442E substitution that disrupted the DNA binding domain.
suggested_questions:
- question: >-
    Given that AlgB activates PalgD without its receiver domain, what signal or partner (beyond KinB dephosphorylation)
    controls AlgB activity at the alginate promoter?
