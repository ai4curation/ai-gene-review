    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IMP negative-regulation-of-biofilm row. Full text cached and read: biofilm
      is not mentioned. The paper shows algB is needed for alginate overproduction and AlgW-dependent
      MucA degradation in a kinB mutant.
