- id: PMID:1738315
  title: >-
    Pseudomonas aeruginosa AlgB, which modulates the expression of alginate, is a member of the NtrC subclass
    of prokaryotic regulators.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IMP positive-regulation-of-transcription row (seed of PTN000787214) and
      of the IMP alginic acid biosynthetic process row. Abstract only. States that algB regulates algD
      expression; it describes a regulator, not an alginate-synthesising enzyme.
- id: PMID:1899859
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. AlgB needed for algD transcription; NtrC-like domain structure with a C-terminal
      HTH.
  title: >-
    Pseudomonas aeruginosa AlgB, a two-component response regulator of the NtrC family, is required for
    algD transcription.
- id: PMID:17981963
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. ChIP, EMSA and SELEX show direct AlgB binding to PalgD; AlgB activates a sigma-22
      promoter.
  title: >-
    The NtrC family regulator AlgB, which controls alginate biosynthesis in mucoid Pseudomonas aeruginosa,
    binds directly to the algD promoter.
- id: PMID:9473053
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. KinB phosphorylates AlgB in vitro, but AlgB phosphorylation and its receiver domain
      are dispensable for alginate production.
  title: >-
    Phosphorylation-independent activity of the response regulators AlgB and AlgR in promoting alginate
    biosynthesis in mucoid Pseudomonas aeruginosa.
- id: PMID:23024348
  title: >-
    The two-component sensor KinB acts as a phosphatase to regulate Pseudomonas aeruginosa Virulence.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of three IMP rows (positive regulation of proteolysis, of secondary metabolite
      biosynthesis, of cell motility). Full text cached and read. In a kinB background phosphorylated
      AlgB represses pyocyanin, elastase and motility (algB deletion restores wild-type levels), so the
      sign of these rows is inverted, and no proteolysis assay is reported.
- id: PMID:19168621
  title: >-
    The Pseudomonas aeruginosa sensor kinase KinB negatively controls alginate production through AlgW-dependent
    MucA proteolysis.
  findings: []
  reference_review:
