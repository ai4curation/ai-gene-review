id: P23747
gene_symbol: algB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AlgB (PA5483) is an NtrC-family response regulator of the AlgB/KinB two-component system. It has an
  N-terminal receiver domain (phosphorylation site Asp59), a central sigma-54 activation (AAA+) domain
  and a C-terminal Fis-type helix-turn-helix DNA-binding domain. In mucoid P. aeruginosa AlgB is needed
  for high-level alginate production: it binds the algD promoter in vivo and in vitro and activates transcription
  of the algD alginate biosynthetic operon from the sigma-22 (AlgU)-dependent promoter. Unusually, this
  role does not need its phosphorylation or its receiver domain. The sensor KinB phosphorylates AlgB but
  mainly acts as an AlgB phosphatase; in kinB mutants phosphorylated AlgB raises algU expression, which
  promotes alginate production and represses acute-virulence traits such as pyocyanin, elastase and motility.
