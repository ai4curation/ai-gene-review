- id: PMID:24980978
  title: Unveiling the genes responsible for the unique Pseudomonas aeruginosa oleate-diol
    synthase activity.
  findings:
  - statement: PA2077 encodes the 10S-dioxygenase that performs the first step of oleate-diol synthesis.
    supporting_text: gene PA2077 codes for the 10S-dioxygenase activity (10S-DOX) responsible for the first step of the reaction
  - statement: PA2077 and PA2078 act separately, without forming a complex.
    supporting_text: Heterologous expression of both enzymes separately showed that no hetero-complex formation is required for enzymatic activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for both IMP rows (oxylipin biosynthetic process, the PTN002826263
      seed; dioxygenase activity). Abstract only. Mutant screening, complementation and
      separate heterologous expression assign the dioxygenase step to PA2077.
- id: PMID:26154497
  title: In Silico/In Vivo Insights into the Functional and Evolutionary Pathway of Pseudomonas
    aeruginosa Oleate-Diol Synthase. Discovery of a New Bacterial Di-Heme Cytochrome C
    Peroxidase Subfamily.
  findings:
  - statement: Both heme sites of PA2077 are required for dioxygenase activity.
    supporting_text: Mutants at either position H130 or H375 (residue numbering with signal peptide) in protein PA2077 failed to convert oleic acid into 10-H(P)OME (Fig 5), definitely showing that both histidines (the two hemes) are required by PA2077 to display activity.
  - statement: PA2077 and PA2078 are periplasmic.
    supporting_text: both proteins display type I signal export sequences that allow transport of the synthesized products to the periplasm, a fact experimentally confirmed by PhoA fusion screening
  - statement: The pair are in-paralogs with very low homology outside Pseudomonas orthologues.
    supporting_text: PA2077 and PA2078 display very low homology to other proteins in the databases, except for those corresponding to their orthologues in other P.
  - statement: The pair lie outside the branch of characterized cytochrome c peroxidases.
    supporting_text: Nevertheless, the phylogenetic results obtained here indicate that PA2077 and PA2078 do not group in the main phylogenetic branch described so far for functionally characterized Ccps, constituting thus a new cluster of functional and structural enzymes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Heme-site mutagenesis, homology modelling on RoxA, phylogeny and
      operon expression experiments from the laboratory that identified the genes.
