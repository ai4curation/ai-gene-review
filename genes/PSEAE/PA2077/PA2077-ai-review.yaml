    supporting_text: gene PA2077 codes for the 10S-dioxygenase activity (10S-DOX) responsible for the first step of the reaction
suggested_questions:
- question: >-
    Do PA0007 and PA1941, the other PAO1 members of PANTHER subfamily PTHR30600:SF9,
    oxygenate fatty acids, or are they RoxA-like oxygenases with other substrates?
suggested_experiments:
- description: >-
    Express PA0007 and PA1941 in a PA2077/PA2078 double mutant and test oleic acid and
    10-H(P)OME conversion by LC-MS, to decide how far the oxylipin function extends in
    the subfamily.
