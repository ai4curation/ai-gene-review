proposed_new_terms:
- proposed_name: oleate 10S-dioxygenase activity
  proposed_definition: >-
    Catalysis of the reaction oleate + O2 = (10S)-hydroperoxy-(8E)-octadecenoate.
  justification: >-
    PA2077 performs this reaction; GO has only the general dioxygenase activity and
    analogous fatty acid terms such as linoleate 8R-lipoxygenase activity.
  supported_by:
