id: Q9I238
gene_symbol: PA2077
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2077 is the 10S-dioxygenase (10S-DOX) of the oleate-diol synthase pathway of
  Pseudomonas aeruginosa, which converts oleic acid into hydroxylated fatty acids
  (oxylipins). It oxygenates oleic acid to the hydroperoxide 10-H(P)OME, which its operon
  partner PA2078 converts to 7,10-DiHOME. PA2077 is a periplasmic di-heme protein (two
  CXXCH heme c motifs, signal peptide) related to bacterial di-heme cytochrome c
  peroxidases and the rubber oxygenase RoxA; both hemes are required for its activity.
  With PA2078 it defines a fatty-acid-acting subfamily (FadCcp) that arose by gene
  duplication within Pseudomonas. Over-expression of PA2077 without PA2078 is toxic,
  consistent with accumulation of its hydroperoxide product.
