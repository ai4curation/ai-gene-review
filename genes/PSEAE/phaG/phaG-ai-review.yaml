- term:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  evidence_type: IMP
  original_reference_id: PMID:10713430
  qualifier: enables
  review:
    action: NEW
    summary: PhaG supports non-amino-acyl hydroxyacyl transfer into the PHA precursor pool.
    reason: This proposal is authored by this audit, not a historical GOA row. The native PAO1 phaG perturbation
      and heterologous complementation in PMID:10713430 support the acyltransferase role by mutant phenotype
      (IMP). Purified P. putida O85207 reverse-transfer assays provide independent homologous biochemical
      corroboration, not a PAO1 IDA assay. Neither forward purified PAO1 kinetics nor universal carbon-source
      dependence is asserted.
    supported_by:
    - reference_id: PMID:10713430
      supporting_text: 'These

        data suggested that PhaG from P. aeruginosa exhibits 3-hydroxyacyl-ACP:CoA transacylase activity'
    - reference_id: PMID:12200450
      supporting_text: Kinetic analysis of the 3-hydroxyacyl transfer to ACP, catalyzed by His(6)-PhaG
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:10713430
  title: The Pseudomonas aeruginosa phaG gene product is involved in the synthesis of polyhydroxyalkanoic
    acid consisting of medium-chain-length constituents from non-related carbon sources.
  findings:
  - statement: Sequence-linked P. aeruginosa phaG disruption selectively reduces gluconate-supported PHA
      accumulation.
    supporting_text: PHA accumulation from gluconate was decreased to about 40% of wild-type level
  - statement: Complementation in P. putida is a separate heterologous functional test.
    supporting_text: The resulting plasmid pBHR88 mediated PHA synthesis contributing to about 13% of
      cellular dry weight
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read; publisher full text unavailable. Official AF209711 identity supplies
      target sequence/strain bridge. Do not turn genetic inference into isolated target kinetics.
- id: PMID:12200450
  title: Biochemical characterization of the Pseudomonas putida 3-hydroxyacyl ACP:CoA transacylase, which
    diverts intermediates of fatty acid de novo biosynthesis.
  findings:
  - statement: Purified P. putida PhaG catalyzes reverse transfer to ACP, supporting homologous catalytic
      inference.
    supporting_text: Kinetic analysis of the 3-hydroxyacyl transfer to ACP, catalyzed by His(6)-PhaG
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read; P. putida recombinant enzyme, not PAO1 purified protein.
- id: PMID:35338129
  title: Metabolic engineering strategies to produce medium-chain oleochemicals via acyl-ACP:CoA transacylase
    activity.
  findings:
  - statement: Heterologous PpuPhaG experiments favor transacylation but explicitly lack purified forward-substrate
      measurements.
    supporting_text: no in vitro data on acyl-ACPs, the substrate in the forward direction is available
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Mechanistic comparator, not a native PAO1 or purified PAO1 assay.
