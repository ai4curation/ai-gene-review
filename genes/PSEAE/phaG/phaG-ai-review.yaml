    label: pimelyl-[acyl-carrier protein] methyl ester esterase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002455972
  - UniProtKB:P13001
  review:
    action: UNDECIDED
    summary: BioH-specific methyl-ester hydrolysis remains unresolved for PAO1 PhaG.
    reason: GO:0090499 specifies hydrolysis of the pimelyl-ACP methyl ester, not generic hydrolysis or
      hydroxyacyl transfer. Actual PAINT placement is confirmed, and no IRD/IKR is recorded on the retrieved
      lineage. PhaG genetics/curated transacylase function do not measure this substrate, but also do
      not prove it cannot be hydrolyzed. Without a target substrate assay or established evolutionary
      loss, the precise transferred MF remains genuinely unresolved. PMID36689471 identifies dedicated
      PAO1 BioH and its native requirement, but does not directly measure this substrate reaction with
      PhaG.
    supported_by:
    - reference_id: file:analysis/module_audits/bacterial_mcl_pha_synthesis_and_mobilization/pseae-consultation/evidence.md
      supporting_text: Both original IBA rows descend from actual PTN002455972, seeded by BioH P13001,
