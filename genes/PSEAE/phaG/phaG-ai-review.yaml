id: Q51553
gene_symbol: phaG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: 'PhaG (PA0730) is an alpha/beta-hydrolase-fold protein that channels de novo fatty-acid-synthesis
  intermediates toward medium-chain-length polyhydroxyalkanoate production in Pseudomonas aeruginosa PAO1.
  Sequence-linked genetic and complementation evidence supports a hydroxyacyl-transfer role: disruption
  reduces PHA accumulation from gluconate while preserving accumulation from fatty acids. Its acyltransferase
  chemistry is inferred from curated function and characterized PhaG homologs; native forward-transfer
  kinetics and possible secondary substrate activities remain unresolved.'
existing_annotations:
- term:
    id: GO:0009102
    label: biotin biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002455972
  - UniProtKB:P13001
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Native dedicated-BioH evidence makes broad-node transfer of biotin biosynthesis to PhaG excessive.
    reason: The real IBA descends from BioH-seeded PTN002455972; target Q51553 is leafPTN002251180. Native
      PhaG supports PHA precursor routing. PMID36689471 independently shows that PAO1 deletion of dedicated
      PA0502/BioH causes biotin auxotrophy rescued by bioH or biotin under the tested defined-medium conditions.
      Endogenous PhaG therefore does not provide sufficient native BioH compensation in that context.
      Together with distinct characterized PhaG chemistry, this supports marking the propagated physiological
      pathway claim over-annotated. It is not a purified PhaG-negative assay, proof of zero secondary
      chemistry, or a universal claim across all conditions. GO0090499 remains unresolved separately.
    supported_by:
    - reference_id: file:analysis/module_audits/bacterial_mcl_pha_synthesis_and_mobilization/pseae-consultation/evidence.md
      supporting_text: Both original IBA rows descend from actual PTN002455972, seeded by BioH P13001,
        with PAO1 leaf PTN002251180 in SF5.
    - reference_id: PMID:10713430
      supporting_text: PHA accumulation from gluconate was decreased to about 40% of wild-type level
    - reference_id: PMID:36689471
      supporting_text: The removal of PA0502 renders P. aeruginosa biotin auxotrophic.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN002455972
        source_label: BioH-seeded bacterial node containing PAO1 PhaG
        source_status: UNRESOLVED
        comment: Actual target descent is verified. Native PA0502 deletion establishes a dedicated BioH
          requirement under tested conditions; propagation of its physiological pathway role to PhaG is
          excessive, while the exact ancestral gain boundary remains unresolved.
      - source_id: UniProtKB:P13001
        source_label: Escherichia coli BioH
        source_status: UNRESOLVED
        comment: The BioH positive anchor is retained; no donor-count objection or claim that its own
          experiment is wrong. Target transfer remains unresolved.
