id: Q51553
gene_symbol: phaG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: 'PhaG (PA0730) is an alpha/beta-hydrolase-fold protein that channels de novo fatty-acid-synthesis
  intermediates toward medium-chain-length polyhydroxyalkanoate production in Pseudomonas aeruginosa PAO1.
  Sequence-linked genetic and complementation evidence supports a hydroxyacyl-transfer role: disruption
  reduces PHA accumulation from gluconate while preserving accumulation from fatty acids. Its acyltransferase
  chemistry is inferred from curated function and characterized PhaG homologs; native forward-transfer
  kinetics and possible secondary substrate activities remain unresolved.'
