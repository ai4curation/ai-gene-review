id: P09785
gene_symbol: phnA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PhnA (PA1001) is the large alpha subunit of the second, pyocyanin-specific anthranilate
  synthase of Pseudomonas aeruginosa. With the glutamine amidotransferase subunit PhnB it
  forms a heterotetramer that converts chorismate and glutamine to anthranilate: PhnB
  generates ammonia from glutamine, and PhnA catalyses the chorismate-to-anthranilate step
  at its own active site. The anthranilate made by PhnAB feeds the Pseudomonas quinolone
  signal pathway and the production of the blue-green phenazine pigment pyocyanin, which is
  why the organism keeps this enzyme separate from the TrpE-TrpG anthranilate synthase that
  supplies tryptophan. Unlike that enzyme PhnAB is not feedback-inhibited by tryptophan, so
  it continues to supply anthranilate when the tryptophan pathway is shut down, and its
  expression rises steeply into stationary phase.
