existing_annotations:
- term:
    id: GO:0000162
    label: L-tryptophan biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT5G05730
  - PANTHER:PTN002599563
  - PomBase:SPCC1442.09
  - SGD:S000000892
  - UniProtKB:P00895
  - UniProtKB:P20580
  - UniProtKB:P9WFX3
  - UniProtKB:Q94GF1
  - UniProtKB:Q9XJ29
  review:
    summary: >-
      IBA from PTN002599563, a node of tryptophan-pathway anthranilate synthases spanning
      bacteria, plants and fungi. P. aeruginosa has two anthranilate synthase gene pairs and
      the node cannot separate them: trpE, the tryptophan-pathway paralog, is a member of
      this same shared claim and legitimately carries the term, while this gene serves the
      pyocyanin and PQS pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PhnAB can make anthranilate for tryptophan but does not do so. Two results settle it:
      deleting both phnA and phnB leaves the organism a tryptophan prototroph, so neither
      gene is required for tryptophan synthesis, and deleting trpE instead causes
      auxotrophy, so PhnAB does not cover for it at wild-type expression. The capability
      surfaces only in feedback-insensitive revertants of a trpE deletion, which the paper
      attributes to PhnAB. The record also explains why the two are kept apart - PhnAB is
      not feedback-inhibited by tryptophan, so it sits outside that pathway's regulation.
      Marked over-annotated rather than removed because the enzyme really does catalyse the
      same reaction and really can substitute, so the term is not false; and not
      KEEP_AS_NON_CORE, because that would assert a peripheral but genuine role in
      tryptophan biosynthesis, which the double-deletion prototrophy argues against. This is
      a judgement about what the node asserts for this paralog, not a claim that the
      curators confused two genes: the paper's own title is about the interchangeability of
      the two enzymes.
    supported_by:
    - reference_id: file:PSEAE/phnA/phnA-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: >-
        Double phnA-phnB deletions are tryptophan prototrophs; they make less PQS
    - reference_id: PMID:2153661
      reference_section_type: ABSTRACT
      supporting_text: This resulted in tryptophan auxotrophy
    - reference_id: file:PSEAE/phnA/phnA-uniprot.txt
      record_section: ["CC:MISCELLANEOUS"]
      supporting_text: PhnAB is not feedback inhibited by tryptophan.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P20580
        source_label: TRPE_PSEAE, Anthranilate synthase component 1 (P. aeruginosa PAO1)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Resolved against the UniProt API, and the sharpest statement of the problem: this
          donor is the target organism's own TrpE, the paralog that actually serves
          tryptophan synthesis in this genome, and it is a member of this same shared claim.
          The node therefore hands phnA a role already correctly annotated on the gene next
          to it.
      - source_id: UniProtKB:P00895
        source_label: TRPE_ECOLI, Anthranilate synthase component 1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          E. coli TrpE, a tryptophan-pathway enzyme. Notable here because PhnA and PhnB are
          more closely related to E. coli TrpE and TrpG than to the Pseudomonas ones, which
          is what pulls this gene into the clade.
      - source_id: UniProtKB:P9WFX3
        source_label: TRPE_MYCTU, Anthranilate synthase component 1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: M. tuberculosis TrpE; a tryptophan-pathway enzyme, as for the other donors.
      - source_id: UniProtKB:Q94GF1
        source_label: ASA1_ORYSJ, Anthranilate synthase alpha subunit 1, chloroplastic
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Rice chloroplastic anthranilate synthase, serving tryptophan synthesis.
      - source_id: UniProtKB:Q9XJ29
        source_label: ASA2_ORYSJ, Anthranilate synthase alpha subunit 2, chloroplastic
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The second rice paralog, likewise a tryptophan-pathway enzyme.
      - source_id: PANTHER:PTN002599563
        source_label: PTN002599563
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node itself is sound: anthranilate synthase component I really did arise to
          serve tryptophan synthesis, and that is the right assertion for the clade. What it
          cannot express is that one bacterial lineage duplicated the enzyme and reassigned
          the copy to a signal-molecule pathway, escaping tryptophan feedback inhibition in
          the process. Recorded as a term-scoping problem rather than a bad node: the
          assertion is true of the family and of the reaction, and only the pathway context
          fails to transfer.
      residue_claims_not_applicable: >-
        The catalytic residues are conserved and the reaction is the same in both paralogs,
        so no residue-level claim distinguishes them; the dispute is about pathway context,
        not about catalytic competence.
- term:
    id: GO:0002047
    label: phenazine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:2153661
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row from the paper that assigned this gene pair to pyocyanin synthesis.
      Pyocyanin is the organism's characteristic phenazine, and the genetics are
      quantitative: loss of phnA alone drops pyocyanin to 22-34 percent, and a double
      trpE-phnA disruption abolishes it.
    action: ACCEPT
    reason: >-
      Core process. The paper states the participation in as many words, and the residual
      pyocyanin in a phnA single mutant is accounted for by the other anthranilate synthase
      supplying some substrate, which is itself evidence that anthranilate supply is what
      the pathway needs from this gene. One mechanistic nuance is recorded rather than acted
      on: the curated FUNCTION routes the contribution through PQS, which induces the
      pyocyanin genes, and if that induction is the whole story then a regulation term would
      fit better than involved_in. That is not something to settle against a curator who
      read the full text, so it is raised as a question instead.
    supported_by:
    - reference_id: PMID:2153661
      reference_section_type: ABSTRACT
      supporting_text: >-
        The other anthranilate synthase enzyme, encoded by phnA and phnB, participates in
        the synthesis of pyocyanin, the characteristic phenazine pigment of the organism.
    - reference_id: file:PSEAE/phnA/phnA-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: Disruption of phnA alone yields 22-34% pyocyanine.
