  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:2153661
  title: >-
    Identification and characterization of genes for a second anthranilate synthase in
    Pseudomonas aeruginosa: interchangeability of the two anthranilate synthases and
    evolutionary implications.
  findings:
  - statement: >-
      The paper separates the organism's two anthranilate synthases by pathway: TrpE-TrpG
      serves tryptophan synthesis and PhnA-PhnB serves pyocyanin.
    reference_section_type: ABSTRACT
    supporting_text: >-
      One anthranilate synthase enzyme participates in tryptophan synthesis; its genes are
      designated trpE and trpG.
  - statement: >-
      PhnA and PhnB are assigned to pyocyanin synthesis, which is the basis of the
      phenazine-biosynthesis annotation on this gene.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The other anthranilate synthase enzyme, encoded by phnA and phnB, participates in the
      synthesis of pyocyanin, the characteristic phenazine pigment of the organism.
  - statement: >-
      The two enzymes are chemically interchangeable: PhnAB can substitute for the
      tryptophan-pathway enzyme in a heterologous host.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The cloned phnA phnB gene pair complements trpE and trpE(G) mutants of Escherichia
      coli.
  - statement: >-
      Deleting the tryptophan-pathway enzyme causes auxotrophy, so PhnAB does not cover for
      it at wild-type expression.
    reference_section_type: ABSTRACT
    supporting_text: This resulted in tryptophan auxotrophy
  - statement: >-
      Only feedback-insensitive revertants press PhnAB into tryptophan service, which is the
      sense in which the enzyme can serve that pathway.
    reference_section_type: ABSTRACT
    supporting_text: >-
      revertants is not feedback inhibited by tryptophan, suggesting that it arises from
      PhnAB.
  - statement: >-
      Loss of phnA reduces but does not abolish pyocyanin, because the tryptophan-pathway
      enzyme can supply some anthranilate for it.
    reference_section_type: ABSTRACT
    supporting_text: phnA mutants retain a low level of pyocyanin production.
  - statement: >-
      The substitution runs in both directions, which is why this is a matter of regulatory
      separation rather than of two unrelated enzymes.
    reference_section_type: ABSTRACT
    supporting_text: >-
      the trpE trpG gene products are capable of providing some anthranilate for pyocyanin
      synthesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Essar, Eberly, Hadero & Crawford, J Bacteriol 1990; DOI
      10.1128/jb.172.2.884-900.1990). Abstract only in the cache, but unusually informative:
      it states the pathway assignment of each gene pair, the complementation result, the
      trpE-deletion auxotrophy and the reversion frequency. This is the PseudoCAP source of
      both IMP rows and is also cited by the curated UniProt FUNCTION with ECO:0000269, so
      the Swiss-Prot curator read the full text and drew the same conclusions. Nothing in
      the review rests on inferring unstated detail from this abstract.
