- term:
    id: GO:0004049
    label: anthranilate synthase activity
  evidence_type: IMP
  original_reference_id: PMID:2153661
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row from the paper that cloned, sequenced and disrupted both anthranilate
      synthase gene pairs. The activity claim is as well grounded as a 1990 genetic paper
      can make it, and the Swiss-Prot curator cites the same paper with ECO:0000269 for the
      curated FUNCTION.
    action: ACCEPT
    reason: >-
      Core molecular function. Although the evidence code is IMP, the support is not a bare
      phenotype: the cloned phnA-phnB pair complements E. coli trpE and trpE(G) mutants,
      which is a heterologous gain-of-function demonstration that the pair carries
      anthranilate synthase activity, and the entry carries nine curated binding-site
      features and the EC number. The qualifier enables is right for the alpha subunit,
      which holds the active site for the anthranilate-forming step; the merged phnB review
      reached ACCEPT for the beta subunit while noting that contributes_to would be arguable
      there, so the two reviews of this shared claim are consistent and the asymmetry
      between them is deliberate.
    supported_by:
    - reference_id: PMID:2153661
      reference_section_type: ABSTRACT
      supporting_text: >-
        The cloned phnA phnB gene pair complements trpE and trpE(G) mutants of Escherichia
        coli.
    - reference_id: file:PSEAE/phnA/phnA-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        Heterotetramer consisting of two non-identical subunits: a beta subunit (PhnB) and a
        large alpha subunit (PhnA).
