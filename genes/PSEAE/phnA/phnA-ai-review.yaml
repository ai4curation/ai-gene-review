suggested_questions:
- question: >-
    Is the anthranilate made by PhnAB consumed chemically in phenazine synthesis, or is its
    whole contribution to route through PQS and induce the phz genes? The answer decides
    whether GO:0002047 involved_in or a regulation-of-biosynthesis term is the better
    annotation for this gene, and the same question applies to phnB.
- question: >-
    Why has the organism kept two anthranilate synthases that the 1990 paper shows to be
    interchangeable? The feedback difference is the obvious answer, but it is worth
    establishing whether PhnAB's stationary-phase induction and tryptophan insensitivity are
    jointly sufficient to explain the duplication.
suggested_experiments:
- description: >-
    Feed isotopically labelled anthranilate to wild type and to a pqsA mutant and follow the
    label into pyocyanin, to determine whether anthranilate carbon enters the pigment
    directly or only acts through PQS signalling.
- description: >-
    Express phnAB from a tryptophan-repressible promoter in a trpE deletion background and
    test whether prototrophy is restored without the feedback-insensitivity mutation, to
    confirm that regulation rather than catalytic capability is what excludes PhnAB from
    tryptophan biosynthesis.
