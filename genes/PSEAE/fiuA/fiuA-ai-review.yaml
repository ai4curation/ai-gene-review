suggested_questions:
- question: >-
    Does ferrichrome binding to FiuA signal through FiuR independently of transport, as shown for FpvA
    and FecA, and which residues of the STN domain contact FiuR?
suggested_experiments:
- description: >-
    Compare fiuA-lacZ induction by ferrichrome in a fiuA STN-domain deletion and in a TonB-box mutant
    to separate the signalling and transport functions of FiuA.
