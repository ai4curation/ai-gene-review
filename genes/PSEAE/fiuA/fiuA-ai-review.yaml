      FiuA is the outer-membrane transporter of ferrichrome-type siderophores; FpvB is a broad secondary
      route.
    supporting_text: FiuA is the TBDT of the ferric forms of ferrichrome, ferricrocin, ferrichrysin and
      RHODO
  reference_review:
