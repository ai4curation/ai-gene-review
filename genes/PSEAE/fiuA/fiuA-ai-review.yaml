  title: >-
    The heterologous siderophores ferrioxamine B and ferrichrome activate signaling pathways in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      FiuA and FoxA are produced only with ferrichrome or ferrioxamine B and their induction depends on
      adjacent ECF sigma/anti-sigma loci.
    supporting_text: >-
      The involvement of this putative regulatory locus in the specific induction of the ferrioxamine
      B and ferrichrome receptors has been demonstrated
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Cached file is abstract-only and the full text could not be retrieved in this session (PMC page
      and Europe PMC both unavailable). The abstract shows proteomic identification of FiuA and its regulation;
      it does not show whether fiuA mutant transport or signalling assays were done, so the IMP rows are
      accepted on the strength of other evidence, not verified against this paper.
