    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract (cached) states the mutant 55Fe uptake result outright. This is the paper that supports
      the PseudoCAP seed row for GO:0042928.
- id: PMID:39138320
  title: >-
    The role of FoxA, FiuA, and FpvB in iron acquisition via hydroxamate-type siderophores in Pseudomonas
    aeruginosa.
  findings:
