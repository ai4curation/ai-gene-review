      FiuA carries about 80% of ferrichrome uptake across the outer membrane, energised by TonB1.
    supporting_text: >-
      ferrichrome is transported across the outer membrane primarily (80%) by the FiuA receptor and to
      a lesser extent (20%) by a secondary transporter
