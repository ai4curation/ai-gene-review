id: Q9I648
gene_symbol: fiuA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FiuA (PA0470) is the TonB-dependent outer-membrane receptor and transporter for the fungal hydroxamate
  siderophore ferrichrome in Pseudomonas aeruginosa. It has the 22-strand beta-barrel and plug domains
  of the TonB-dependent receptor family plus an N-terminal STN signalling domain, which makes it a TonB-dependent
  transducer. FiuA carries about 80% of ferric-ferrichrome uptake across the outer membrane, using energy
  from TonB1, and also imports the ferrichrome-type siderophores ferricrocin, ferrichrysin and rhodotorulic
  acid; FpvB provides a secondary route. Ferrichrome binding to FiuA also signals through the anti-sigma
  factor FiuR to release the ECF sigma factor FiuI (PA0472), which induces fiuA transcription under iron
  limitation. In the periplasm the inner-membrane permease FiuB and the acetyltransferase FiuC complete
  iron release, and acylated desferrichrome is recycled to the medium.
