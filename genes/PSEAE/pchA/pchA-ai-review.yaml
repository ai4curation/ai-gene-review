  evidence_type: IDA
  original_reference_id: PMID:7500944
  qualifier: involved_in
  review:
    summary: >-
      Salicylate formation from chorismate required pchA together with pchB, in an E. coli entC
      mutant and in extracts with overproduced PchA and PchB.
    action: ACCEPT
    reason: >-
      PchA catalyses the first of the two steps from chorismate to salicylate, so it does part of
      the work of the process.
    supported_by:
    - reference_id: PMID:7500944
      supporting_text: >-
        Our results are consistent with a pathway leading from chorismate to isochorismate and then
        to salicylate plus pyruvate, catalyzed consecutively by the iron-repressible PchA and PchB
        proteins in P. aeruginosa.
