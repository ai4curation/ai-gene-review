- id: PMID:12624097
  title: Isochorismate synthase (PchA), the first and rate-limiting enzyme in salicylate
    biosynthesis of Pseudomonas aeruginosa.
  findings:
  - statement: Purified PchA is a Mg2+-dependent monomeric isochorismate synthase with Km 4.5 uM for chorismate.
    supporting_text: >-
      The native enzyme was a 52-kDa monomer in solution, and its activity strictly depended on
      Mg(2+).
  - statement: PchA concentration limits the rate of salicylate formation.
    supporting_text: >-
      The intracellular PchA concentration critically determined the rate of salicylate formation
      both in vitro and in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Biol Chem 2003, DOI 10.1074/jbc.M212324200); abstract only. Direct
      purified-enzyme kinetics; supports the PseudoCAP IDA rows for GO:0008909 and GO:0042864.
- id: PMID:7500944
  title: Structural genes for salicylate biosynthesis from chorismate in Pseudomonas
    aeruginosa.
  findings:
  - statement: pchBA are necessary for salicylate formation; PchA converts chorismate to isochorismate.
    supporting_text: >-
      Salicylate formation was demonstrated in an Escherichia coli entC mutant lacking
      isochorismate synthase when this strain expressed both the pchBA genes, but not when it
      expressed pchB alone.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Mol Gen Genet 1995, DOI 10.1007/BF00290369); abstract only. Cloning and
      functional complementation; supports the salicylic acid biosynthesis IDA.
