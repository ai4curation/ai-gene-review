taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PchA (PA4231) is the isochorismate synthase of Pseudomonas aeruginosa, the first enzyme of the
  pathway that makes salicylate and the siderophore pyochelin. Encoded as the last gene of the
  iron-repressed pchDCBA operon, it is a 52-kDa Mg2+-dependent monomer of the chorismate-utilizing
  enzyme family that converts chorismate to isochorismate; the isochorismate pyruvate-lyase PchB then
  converts isochorismate to salicylate and pyruvate. PchA is rate-limiting for salicylate
  formation, and its cellular concentration, set at the transcriptional level by iron (negative) and
  pyochelin (positive), controls flux into pyochelin biosynthesis.
