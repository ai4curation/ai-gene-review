  evidence_type: EXP
  original_reference_id: PMID:11435415
  qualifier: enables
  review:
    summary: P. aeruginosa Coq7 replaces E. coli UbiF in vivo; a conserved di-iron motif supports a direct hydroxylase role.
    action: ACCEPT
    reason: >-
      Complementation of the ubiF demethoxyubiquinol hydroxylation defect,
      combined with the di-iron ligand motif shared with characterised
      oxidases/hydroxylases, supports Coq7 as the hydroxylase itself rather than
      a regulatory factor. Direct in vitro activity was later shown for human
      COQ7. Core molecular function.
    supported_by:
    - reference_id: PMID:11435415
      supporting_text: >-
        Here we identify Coq7 as belonging to a family of a di-iron containing
        oxidases/hydroxylases based on a conserved sequence motif for the iron
        ligands, supporting a direct function of Coq7 as a hydroxylase.
    - reference_id: file:PSEAE/PA0655/PA0655-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "Reaction=a 5-methoxy-2-methyl-3-(all-trans-polyprenyl)benzene-1,4-diol + AH2 + O2 = a 3-demethylubiquinol + A + H2O"
