suggested_questions:
- question: >-
    What is the physiological electron donor of bacterial Coq7 (NADH directly, as
    for human COQ7, or a reduced quinone or ferredoxin), and is it a monotopic
    membrane protein in P. aeruginosa?
suggested_experiments:
- hypothesis: P. aeruginosa Coq7 uses NADH as its reductant and associates with the inner membrane.
  description: >-
    Purify recombinant PA0655, reconstitute the di-iron centre, assay
    demethoxyubiquinone-analogue hydroxylation with NADH, NADPH or reduced
    quinone donors, and localise a chromosomally tagged Coq7 by fractionation of
    P. aeruginosa inner and outer membranes and soluble cytoplasm.
