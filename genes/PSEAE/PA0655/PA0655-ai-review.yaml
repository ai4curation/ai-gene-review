taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0655 (Coq7) is the di-iron 3-demethoxyubiquinol 3-hydroxylase of
  Pseudomonas aeruginosa, the enzyme that performs the last ring hydroxylation
  of aerobic ubiquinone-9 biosynthesis, converting
  2-nonaprenyl-3-methyl-6-methoxy-1,4-benzoquinol (demethoxyubiquinol-9) to
  3-demethylubiquinol-9. It belongs to the COQ7/CLK-1 family of ferritin-like
  di-iron carboxylate oxidases, with a conserved motif of iron ligands (two iron
  ions per subunit), and is unrelated to the flavin monooxygenase UbiF that
  catalyses the same step in Escherichia coli. The cloned P. aeruginosa gene
  complements an E. coli ubiF mutant, showing it can replace the flavin enzyme.
  Coq7 is predicted to be an interfacial membrane protein associated with the
  cytoplasmic membrane. It is orthologous to the mitochondrial COQ7 hydroxylases
  of yeast, worms and mammals.
