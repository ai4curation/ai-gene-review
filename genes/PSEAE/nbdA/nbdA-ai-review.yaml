suggested_questions:
- question: >-
    Does the MHYT domain bind a metal and sense NO directly, so that NbdA PDE
    activity is stimulated by NO post-translationally as well as by transcriptional
    induction?
suggested_experiments:
- description: >-
    Purify full-length NbdA in detergent, measure metal content, and assay c-di-GMP
    hydrolysis with and without NO donors, compared with an MHYT-deleted variant.
