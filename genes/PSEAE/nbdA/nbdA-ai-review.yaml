id: Q9HYT3
gene_symbol: nbdA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  NbdA (PA3311) is an inner-membrane c-di-GMP-specific phosphodiesterase with an
  N-terminal MHYT sensory domain of seven transmembrane helices, a degenerate GGDEF
  domain (AGDEF) and a catalytic EAL domain. A recombinant form lacking the MHYT
  domain hydrolyses c-di-GMP, has no diguanylate cyclase activity and is stimulated
  by GTP. nbdA is weakly expressed under standard conditions and is induced
  transcriptionally by nitric oxide. In biofilms exposed to NO, NbdA raises PDE
  activity and lowers c-di-GMP, and it is required for NO-induced, but not
  glutamate-induced, biofilm dispersion. The MHYT domain may sense NO directly
  through a bound metal. NbdA also inhibits flagellar motor switching and swimming
  reversals through the c-di-GMP adaptor MapZ.
references:
- id: PMID:23729646
  title: NO-induced biofilm dispersion in Pseudomonas aeruginosa is mediated by an
    MHYT domain-coupled phosphodiesterase.
  findings:
  - statement: Recombinant NbdA lacking the MHYT domain is an active PDE.
    supporting_text: Biochemical analyses of recombinant protein variants lacking the
      membrane-anchored MHYT domain support NbdA being an active PDE
  - statement: nbdA is required specifically for NO-induced dispersion.
    supporting_text: inactivation of nbdA only impaired biofilm dispersion upon exposure
      to NO
  - statement: NO raises NbdA-dependent PDE activity and lowers c-di-GMP in biofilms.
    supporting_text: increased PDE activity, resulting in decreased c-di-GMP levels
      in biofilms expressing nbdA upon exposure to NO, a response that was absent in
      the ΔnbdA strain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0071111 and IMP GO:0071732 rows and nbdA's
      seeding of PTN002105365. Abstract only (full text not retrievable); the
      abstract states the decisive biochemical result, and UniProt curators cite
      this paper for EC 3.1.4.52.
- id: PMID:31350333
  title: Regulation of flagellar motor switching by c-di-GMP phosphodiesterases in
    Pseudomonas aeruginosa.
  findings:
  - statement: NbdA inhibits flagellar motor switching through MapZ.
    supporting_text: three of them (DipA, NbdA, and RbdA) can significantly inhibit
      flagellar motor switching and swimming directional reversal in a MapZ-dependent
      manner
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:16477007
  title: Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases
    reveals a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: A PA3311 insertion mutant formed hyperbiofilm (pellicle) and had
      intermediate virulence; no lysate PDE activity was detected for PA3311.
    supporting_text: A set of mutants in selected DGC- and PDE-encoding genes exhibited
      attenuated virulence in a mouse infection model.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Not a source of any nbdA GOA row. Full text read on PMC; the negative lysate
      result is explained by the authors' note that no GGDEF-EAL hybrid showed
      activity in that assay.
