suggested_questions:
- question: >-
    Should the PMM IBD at PTN001096974 sit on a lower node that excludes the bacterial GlmM subclade,
    given that GlmM's PMM is a side activity? Note that UniProt now assigns the other seed, Q68BJ6, to
    PANTHER PTHR43771 rather than PTHR42946.
suggested_experiments:
- description: >-
    Measure kcat/Km of purified GlmM for GlcN-6-P, Man-1-P and Glc-1-P to quantify the side activities,
    and test glmM overexpression in an algC deletion for LPS core synthesis.
