- id: PMID:10913078
  title: >-
    Identification of the Pseudomonas aeruginosa glmM gene, encoding phosphoglucosamine mutase.
  findings:
  - statement: PA4749 encodes phosphoglucosamine mutase.
    supporting_text: >-
      The product of this gene is here identified as the phosphoglucosamine mutase (GlmM) which catalyzes
      the conversion of glucosamine-6-phosphate to glucosamine-1-phosphate
  - statement: It complements an E. coli glmM mutant for peptidoglycan synthesis and growth.
    supporting_text: >-
      shown to restore normal peptidoglycan biosynthesis and cell growth of a glmM Escherichia coli mutant
      strain
  - statement: Purified GlmM has PMM (20%) and PGM (2%) side activities.
    supporting_text: >-
      Beside its phosphoglucosamine mutase activity, the P. aeruginosa enzyme is shown to exhibit phosphomannomutase
      and phosphoglucomutase activities, which represent about 20 and 2% of its GlmM activity, respectively.
  - statement: GlmM does not complement an algC mutant for alginate synthesis.
    supporting_text: >-
      when plasmid pIT352 was introduced by triparental mating into the algC mutant strain P. aeruginosa
      8858, alginate synthesis was not restored
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA source for GO:0008966, GO:0004615, GO:0004614 and GO:0009252, and seed of the PTN000501735
      (GO:0008966, GO:0009252) and PTN001096974 (GO:0004615) IBDs. Full text (PMC94616) cached and read:
      E. coli complementation, purified enzyme assays, side activities, failure to complement algC.
