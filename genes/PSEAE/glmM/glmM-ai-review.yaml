  review:
    summary: >-
      IBA from the deep phosphohexomutase node PTN001096974 (136 leaves), seeded by T. kodakarensis PGM/PMM
      Q68BJ6 and by this gene's PseudoCAP IDA row (self-seed).
    action: KEEP_AS_NON_CORE
    reason: >-
      GlmM has a genuine, conserved PMM side activity (20 percent, also seen for E. coli GlmM), so the
      transfer is not false, but PMM is not GlmM's evolved function; AlgC is the P. aeruginosa PMM. The
      node also contains bona fide PMMs (ManB, RfbK, Pmm) so the node term suits the clade.
    supported_by:
    - reference_id: PMID:10913078
