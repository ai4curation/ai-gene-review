  label: Pseudomonas aeruginosa PAO1
description: >-
  GlmM (PA4749) is the phosphoglucosamine mutase of Pseudomonas aeruginosa, a member of the alpha-D-phosphohexomutase
  superfamily. It converts glucosamine-6-phosphate to glucosamine-1-phosphate, the second step of the
  hexosamine branch leading to UDP-N-acetylglucosamine, the common precursor of peptidoglycan and lipopolysaccharide.
  The P. aeruginosa gene complements an E. coli glmM mutant, restoring peptidoglycan synthesis and growth,
  and the purified His-tagged enzyme has phosphoglucosamine mutase activity similar to the E. coli enzyme.
  It also shows phosphomannomutase (about 20 percent) and phosphoglucomutase (about 2 percent) side activities,
  but it cannot replace the dedicated bifunctional PMM/PGM AlgC in alginate synthesis. Like other phosphohexomutases
  it is expected to use a phosphoserine catalytic intermediate and Mg2+.
