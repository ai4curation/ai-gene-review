taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA4079 is a 229-residue classical short-chain dehydrogenase/reductase (SDR) of Pseudomonas
  aeruginosa with a Rossmann-fold NAD(P)-binding domain. Crystal structures of the apo enzyme and its NADP
  complex show that NADP binding orders the active-site substrate-specificity loop, and that ligand binding
  swings the Tyr183 side chain out of the active site. The purified enzyme reduces a broad range of carbonyl
  substrates with NAD(P)H and is classed as a carbonyl reductase. Its physiological substrate and role are
  unknown; it remains highly expressed during antibiotic exposure, and the authors speculate that it might
  reduce antimicrobial compounds.
