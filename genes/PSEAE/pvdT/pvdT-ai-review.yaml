- id: PMID:12686626
  title: Identification and characterization of novel pyoverdine synthesis genes in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Mutant screen for genes required for pyoverdine production.
    supporting_text: The candidate genes were mutated and the effects of the mutations on pyoverdine production
      were determined
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IMP GO:0002049 row. Abstract only in cache; the abstract describes a mutation
      screen scored by pyoverdine production, i.e. a phenotype. Later work (PMID:19906986, full text)
      shows that loss of PvdT reduces extracellular pyoverdine because the siderophore is trapped in the
      periplasm, not because it is not made.
- id: PMID:19906986
  title: Molecular basis of pyoverdine siderophore recycling in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PvdRT-OpmQ moves pyoverdine from the periplasm to the medium; mutants accumulate it in the periplasm.
    supporting_text: nearly all intracellular PVD was associated with the periplasmic fraction of pvdR
      , pvdT , and opmQ mutants
  - statement: >-
      PvdT is the inner-membrane ABC transporter component.
    supporting_text: Therefore, the entire PvdRT-OpmQ system (i.e., the IM ABC transporter PvdT, the periplasmic
      fusion protein PvdR, and the OM porin OpmQ) appears to be involved in the transport of PVD from
      the periplasm to the extracellular milieu.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text in cache. PseudoCAP source of IDA and IMP GO:0015562 and GO:1990281 rows; one of the rows
      seeding PTN001254814.
- id: PMID:21035449
  title: An efflux pump is involved in secretion of newly synthesized siderophore by Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PvdRT-OpmQ secretes newly synthesized pyoverdine.
    supporting_text: Bacteria lacking this efflux pump accumulated PVD, or a fluorescent precursor, in
      the periplasm, due to their inability to efficiently secrete into the media newly synthesized PVD
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in cache; abstract states the fractionation result.
- id: PMID:22187978
  title: The PvdRT-OpmQ efflux pump controls the metal selectivity of the iron uptake pathway mediated
    by the siderophore pyoverdine in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PvdRT-OpmQ exports pyoverdine-metal complexes.
    supporting_text: the PvdRT-OpmQ efflux pump exports unwanted metals complexed with PVD from the bacterium
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in cache.
- id: PMID:23766114
  title: An efflux pump is required for siderophore recycling by Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PvdRT-OpmQ recycles pyoverdine from the periplasm.
    supporting_text: Mutation of genes encoding this efflux pump (named PvdRT-OpmQ) prevented recycling
      of PVDI from the periplasm into the extracellular medium
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in cache.
