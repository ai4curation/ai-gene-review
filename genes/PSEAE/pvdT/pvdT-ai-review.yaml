id: Q9I190
gene_symbol: pvdT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdT (PA2390) is the inner-membrane ATP-binding/permease component of the tripartite PvdRT-OpmQ efflux
  pump of Pseudomonas aeruginosa, a MacB-type ABC exporter together with the periplasmic membrane fusion
  protein PvdR and the TolC-like outer-membrane channel OpmQ. The pump takes up the siderophore pyoverdine
  on the periplasmic side and moves it to the extracellular medium. It secretes newly synthesized pyoverdine
  after the final maturation steps in the periplasm, recycles pyoverdine released after ferri-pyoverdine
  uptake through FpvA, and expels pyoverdine complexed with unwanted metals. Mutants lacking any component
  accumulate pyoverdine in the periplasm. The operon is iron-regulated under the pyoverdine sigma factor
  PvdS. The pump does not contribute to antibiotic resistance.
