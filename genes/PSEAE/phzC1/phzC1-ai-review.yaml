core_functions:
- description: >-
    Dedicated DAH7P synthase of the phenazine operon: condenses
    phosphoenolpyruvate with D-erythrose 4-phosphate to start the shikimate
    pathway without feedback control by aromatic amino acids or phenazines,
    supplying the chorismate that PhzE converts into the first committed
    phenazine intermediate.
  molecular_function:
    id: GO:0003849
    label: 3-deoxy-7-phosphoheptulonate synthase activity
  directly_involved_in:
  - id: GO:0002047
    label: phenazine biosynthetic process
  supported_by:
  - reference_id: PMID:30242059
    supporting_text: >-
      Consistent with this is the observation made during functional
      characterisation that PaeDAH7PSPA1901 is insensitive to allosteric
      regulation by aromatic amino acids, confirming that PaeDAH7PSPA1901
      functions primarily within secondary metabolism.
  - reference_id: PMID:11591691
    supporting_text: >-
      Two seven-gene phenazine biosynthetic loci were cloned from Pseudomonas
      aeruginosa PAO1.
suggested_questions:
- question: >-
    Should the GO:0002047 IBD be moved from PTN000481936 to a node containing
    only phz-cluster DAH7PS proteins, so that Helicobacter pylori HP_0134,
    Xanthomonas dhs1, Bradyrhizobium blr3778 and P. aeruginosa's housekeeping
    PA2843 stop inheriting phenazine biosynthetic process?
- question: >-
    Do the two identical phzC copies (PA1901 and PA4212) contribute equally, and
    is either of them dispensable when the other operon is expressed? The GOA
    entry merges them, so the question cannot currently be asked of the
    annotations.
suggested_experiments:
- description: >-
    Make single and double phzC deletions in PAO1 (PA1901, PA4212 and both) and
    measure PCA, pyocyanin and intracellular chorismate, with complementation by
    the housekeeping PA2843 enzyme as a control for whether the
    secondary-metabolism-specific, feedback-insensitive DAH7PS is required or
    merely sufficient. This would convert the current operon-level IDA into
    gene-level evidence in P. aeruginosa itself.
