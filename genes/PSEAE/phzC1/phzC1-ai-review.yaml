gene_symbol: phzC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PhzC is the class-II (type II) 3-deoxy-D-arabino-heptulosonate 7-phosphate
  synthase encoded in each of the two phenazine biosynthetic operons of
  Pseudomonas aeruginosa PAO1 (phzC1 at PA4212 and the identical phzC2 at
  PA1901). It condenses phosphoenolpyruvate with D-erythrose 4-phosphate, the
  committed first step of the shikimate pathway, and so feeds carbon towards
  chorismate, the substrate from which PhzE begins phenazine assembly. Unlike
  the housekeeping DAH7PS of the same organism (PA2843), the phz-operon enzyme
  is a structurally distinct, allosterically unregulated homotetramer: it is
  not inhibited by tryptophan, tyrosine, phenylalanine, phenazine-1-carboxylate
  or pyocyanin, which lets phenazine production continue when primary aromatic
  amino acid biosynthesis is switched off. In the related phenazine producer
  Pseudomonas chlororaphis, deleting phzC nearly abolishes
  phenazine-1-carboxamide output while deleting the housekeeping aro genes
  barely affects it, confirming that this duplicated DAH7PS is dedicated to
  secondary metabolism.
