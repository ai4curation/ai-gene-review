- term:
    id: GO:0002047
    label: phenazine biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:11591691
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA, the sole seed of the PTN000481936 IBD. Mavrodi et al.
      cloned the two seven-gene operons and showed that each is sufficient for
      phenazine-1-carboxylic acid production in phenazine-non-producing
      pseudomonads; the same IDA row was applied to the other genes of the
      operons. The evidence is therefore operon-level rather than
      gene-by-gene, which is worth noting beside an IDA code, but PhzC's own
      contribution is independently established.
    action: ACCEPT
    reason: >-
      Core process. PhzC is the operon's own DAH7PS and performs the first
      shikimate-pathway step that supplies chorismate for the pathway; it is
      kinetically competent, is not feedback-inhibited by aromatic amino acids
      or phenazines, and its deletion in P. chlororaphis collapses phenazine
      output while housekeeping aro deletions do not.
    supported_by:
    - reference_id: PMID:11591691
      supporting_text: >-
        Functional studies of phenazine-nonproducing strains of fluorescent
        pseudomonads indicated that each of the biosynthetic operons from
        P. aeruginosa is sufficient for production of a single
        compound, phenazine-1-carboxylic acid (PCA).
    - reference_id: PMID:35053084
      supporting_text: >-
        After the complementation of gene phzC in the corresponding DAHP
        synthase-deficient strain, the production of PCN was significantly
