  review:
    summary: >-
      InterPro-to-GO mapping that attaches the generic shikimate-pathway role
      to every class-II DAHP synthase. For this paralogue the shikimate flux it
      generates is used by the phenazine pathway, not by aromatic amino acid
      biosynthesis, and the enzyme lacks the allosteric control that the
      primary-metabolism enzymes have.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A domain-level inference that does not hold for this gene copy. The
      organism's aromatic amino acid biosynthesis is served by the housekeeping
      DAH7PS PA2843 and the aro genes; the phz-operon enzyme is insensitive to
      feedback by Trp, Tyr and Phe, which is the hallmark of its
      secondary-metabolism role. The chemistry is shared, so the activity term
      GO:0003849 is kept, but the primary-metabolism process is not this
      protein's.
    supported_by:
    - reference_id: PMID:30242059
      supporting_text: >-
