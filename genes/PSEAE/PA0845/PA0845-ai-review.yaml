suggested_questions:
- question: >-
    Across the PTN004377481 neutral-ceramidase family, are the GO:0042759 long-chain fatty
    acid biosynthetic process and GO:0046512 sphingosine biosynthetic process annotations
    better expressed as ceramide catabolism with released products, or do mammalian members
    genuinely supply sphingosine as a signalling pathway?
suggested_experiments:
- description: >-
    Test whether a cerN deletion alters P. aeruginosa fitness on ceramide as a carbon/sphingosine
    source and quantify sphingosine and free fatty acid release in vitro.
