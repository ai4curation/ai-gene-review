  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0845 (cerN) is a secreted neutral/alkaline ceramidase (N-acylsphingosine amidohydrolase,
  EC 3.5.1.23) of Pseudomonas aeruginosa. It hydrolyses the N-acyl linkage of ceramides to
  release sphingosine and a free fatty acid at alkaline pH, and catalyses the reverse condensation
  in vitro; it is a zinc-dependent metalloenzyme and acts on a broad range of ceramides. In
  the lung, cerN cleaves host ceramide to sphingosine, which the AraC-family regulator SphR
  senses to induce the sphingosine catabolic (sph) regulon; cerN is itself a member of that
  SphR regulon. It is the founding member of the neutral ceramidase family, with homologues
  in mammals, fungi, insects and other bacteria.
