- id: PMID:24465209
  title: >-
    Detection of host-derived sphingosine by Pseudomonas aeruginosa is important for survival
    in the murine lung.
  findings:
  - statement: >-
      A clean PA0845 (cerN) deletion abolishes ceramide-induced expression of the sphingosine-regulated
      sphA; cerN is a member of the SphR regulon.
    supporting_text: >-
      we generated a clean deletion in the neutral ceramidase encoded by PA0845 and measured
      enzyme activity from the PA5325-lacZ reporter construct pAL4. Ceramide fails to induce
      PA5325-lacZ in the absence of the neutral ceramidase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC3900636) and read. PseudoCAP source for the GO:0051872 sphingosine
      catabolic process IDA. cerN generates sphingosine from ceramide (it is upstream of,
      not a step of, sphingosine catabolism); the gene it feeds, sphA, does the catabolism.
- id: PMID:9603946
  title: >-
    Purification and characterization of a novel ceramidase from Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Purified P. aeruginosa ceramidase hydrolyses ceramides and catalyses the reverse synthesis;
      broad substrate range.
    supporting_text: >-
      Interestingly, the 70-kDa protein catalyzed a reversible reaction in which the N-acyl
      linkage of ceramide was either cleaved or synthesized.
  - statement: Km 139 uM, Vmax 5.3 umol/min/mg on N-palmitoylsphingosine.
    supporting_text: >-
      This bacterial ceramidase had a pH optimum of 8.0-9.0, an apparent Km of 139 microM,
      and a Vmax of 5.3 micromol/min/mg using N-palmitoylsphingosine as the substrate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      UniProt source for the GO:0017040 IDA seed and for the fatty-acid/sphingosine biosynthesis
      IDA rows. Abstract only. Direct purified-enzyme evidence for ceramidase activity. The
      'biosynthesis' of free fatty acid is a release by hydrolysis, not fatty-acid biosynthesis.
