id: Q06749
gene_symbol: algL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: AlgL is a periplasmic polysaccharide lyase that cleaves alginate and mannuronan by beta
  elimination, preferentially attacking non-acetylated substrates. It removes mislocalized alginate
  and protects envelope integrity during polymer production. The requirement for AlgL depends on
  the regulatory and genetic background; it is not an established stable component of the alginate
  secretion complex.
