- id: PMID:23215237
  title: Functional characterization of AlgL, an alginate lyase from Pseudomonas aeruginosa.
  findings:
  - statement: Purified AlgL cleaves alginate/mannuronan by beta elimination and favors
      non-acetylated substrates, yielding small oligomers.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct P. aeruginosa catalytic characterization; cleavage is possible adjacent to
      mannuronate or guluronate, not exclusive mannuronate specificity.
- id: PMID:8370530
  title: Sequence of the algL gene of Pseudomonas aeruginosa and purification of its alginate lyase
    product.
  findings:
  - statement: Cloning and purification identify P. aeruginosa AlgL as an alginate lyase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract supports lyase and localization. Full text was not obtained; the
      experimental threonine deaminase row is modified to the alginate lyase activity the abstract
      describes, with a PROBABLE source defect for PseudoCAP.
- id: PMID:8550492
  title: 'Alginate synthesis in Pseudomonas aeruginosa: the role of AlgL (alginate lyase) and AlgX.'
  findings:
  - statement: Insertion/complementation experiments link AlgL to normal alginate production in the
      investigated mucoid strain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Historical genetic necessity is interpreted alongside the direct homeostasis and
      genetic-background dependence in PMID34990713, not dismissed as a curation error.
- id: PMID:34990713
  title: The Pseudomonas aeruginosa homeostasis enzyme AlgL clears the periplasmic space of
    accumulated alginate during polymer biosynthesis.
  findings:
  - statement: AlgL degrades mislocalized periplasmic alginate and protects viability during induced
      production; AlgU/T-regulon activation can compensate for its absence.
    supporting_text: Our data reinforce the previous findings and suggest that AlgL does not
      interact with the alginate secretion complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct PAO1-derived strain work, structural and biochemical assays, accumulation
      measurements and interaction tests distinguish homeostasis from a stable secretion-complex
      component.
core_functions:
- description: Cleaves mislocalized periplasmic alginate/mannuronan by beta elimination, maintaining
    envelope homeostasis during alginate production. Essentiality depends on genetic background and
    AlgU/T-regulon expression; stable secretion-complex membership is not supported.
