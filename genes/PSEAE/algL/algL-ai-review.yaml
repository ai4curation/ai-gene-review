id: Q06749
gene_symbol: algL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: AlgL is a periplasmic polysaccharide lyase that cleaves alginate and mannuronan by beta
  elimination, preferentially attacking non-acetylated substrates. It removes mislocalized alginate
  and protects envelope integrity during polymer production. The requirement for AlgL depends on the
  regulatory and genetic background; it is not an established stable component of the alginate
  secretion complex.
existing_annotations:
- term:
    id: GO:0004794
    label: threonine deaminase activity
  evidence_type: IDA
  original_reference_id: PMID:8370530
  qualifier: enables
  review:
    summary: The experimental assay in this source is an alginate lyase assay on purified AlgL; the
      threonine-deaminase term is a term-mapping error for that lyase activity.
    action: MODIFY
    reason: The cached abstract of PMID8370530 states that the overproduced, purified AlgL protein was
      assayed for and shown to have alginate lyase activity; no amino-acid deaminase assay is described,
      and threonine deaminase (threonine ammonia-lyase, a pyridoxal-phosphate amino-acid enzyme) is
      unrelated to polysaccharide beta-elimination. The IDA evidence itself is sound and is retained, but
      it supports the lyase activity, so the row is modified to poly(beta-D-mannuronate) lyase activity,
      the experimentally established activity already present in this review (EXP, PMID23215237). Full
      text was not available; the correction rests on the assay explicitly named in the abstract rather
      than on absence of discussion. Both GO terms are lyases, which plausibly explains the mis-mapping.
    supported_by:
    - reference_id: PMID:8370530
      supporting_text: The AlgL protein was overproduced in Escherichia coli and purified. The purified
        protein was shown to have alginate lyase activity.
    proposed_replacement_terms:
    - id: GO:0045135
      label: poly(beta-D-mannuronate) lyase activity
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0004794
      corrected_value: GO:0045135
      cause: UNKNOWN
      confidence: PROBABLE
      explanation: The PseudoCAP IDA row for AlgL (Q06749) from PMID:8370530 uses GO:0004794 threonine
        deaminase activity, but the paper's abstract describes only an alginate lyase assay on purified
        AlgL. The activity measured corresponds to GO:0045135 poly(beta-D-mannuronate) lyase activity.
        Please repoint the row; the full text was not available to confirm that no separate deaminase
        assay was performed.
      supported_by:
      - reference_id: PMID:8370530
        supporting_text: The purified protein was shown to have alginate lyase activity.
      report_status: NOT_REPORTED
