- term:
    id: GO:0042121
    label: alginic acid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:8550492
  qualifier: involved_in
  review:
    summary: AlgL promotes viable alginate production through catabolic periplasmic quality control.
    action: MARK_AS_OVER_ANNOTATED
    reason: The original production phenotype is real, but modern direct accumulation, biochemical
      and interaction experiments support removal of mislocalized polymer rather than chain biosynthesis
      or stable secretion-complex membership. AlgU/T-regulon activation can compensate for AlgL loss.
      Thus genetic necessity in some backgrounds should not be equated with direct alginate biosynthesis.
    supported_by:
    - reference_id: PMID:8550492
    - &id002
      reference_id: PMID:34990713
      supporting_text: Our data reinforce the previous findings and suggest that AlgL does not interact
        with the alginate secretion complex.
