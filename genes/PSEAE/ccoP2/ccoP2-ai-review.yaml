- term:
    id: GO:0004129
    label: cytochrome-c oxidase activity
  evidence_type: IMP
  original_reference_id: PMID:14763990
  qualifier: enables
  review:
    summary: >-
      Comolli and Donohue 2004 compared the two cbb3 isoforms; cbb3-2 is the
      isoform favoured under oxygen limitation. The same IMP is on all eight
      cbb3 subunits.
    action: ACCEPT
    reason: >-
      The claim that CcoP2 is part of the cbb3-2 cytochrome c oxidase is
      right and is the gene's core role, so the term is accepted. The
      qualifier is not. The abstract describes loss of each oxidase isoform,
      not a ccoP-specific mutant (only loss of cbb3-1 affected growth in
      aerated culture), and same-day PseudoCAP rows apply the
      identical IMP to CcoN, CcoO, CcoQ and CcoP of both operons. CcoP feeds
      electrons to the catalytic CcoN subunit, so it contributes to the
      activity rather than enabling it alone; filed as a qualifier defect at
      PROBABLE (abstract only).
    supported_by:
    - reference_id: PMID:14763990
      supporting_text: >-
        Cbb3-2 appeared to play a more significant role under oxygen limitation
        by nature of its increased abundance and expression compared to highly
        aerated cultures
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: PSEUDOCAP
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        GO:0004129 cytochrome-c oxidase activity on ccoP2 (Q9I3G2) is coded
        enables, IMP, PMID:14763990. The abstract describes the loss of whole
        cbb3 isoforms, and PseudoCAP entered the identical row on 20190311 for
        all eight subunits of both cbb3 operons (ccoN1/O1/Q1/P1 and
        ccoN2/O2/Q2/P2), so the row transfers an operon-level phenotype to each
        subunit. CcoP is the diheme cytochrome c that passes electrons to the
        catalytic heme b3-CuB centre on CcoN; it contributes to the complex's
        activity. The row seeds the PAINT IBD at PTN002435498. Full text not
        read, so a ccoP-specific experiment cannot be excluded.
      supported_by:
      - reference_id: PMID:14763990
        supporting_text: >-
          only loss of cbb3-1 influenced growth
