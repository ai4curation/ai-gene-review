- id: PMID:14763990
  title: Differences in two Pseudomonas aeruginosa cbb3 cytochrome oxidases.
  findings:
  - statement: P. aeruginosa has two cbb3 oxidase operons.
    supporting_text: >-
      The opportunistic pathogen Pseudomonas aeruginosa is unusual in possessing
      two operons that each potentially encode a cbb3 oxidase (cbb3-1 or cbb3-2).
  - statement: cbb3-2 matters more under oxygen limitation and is Anr-regulated.
    supporting_text: >-
      Cbb3-2 appeared to play a more significant role under oxygen limitation
      by nature of its increased abundance and expression compared to highly
      aerated cultures, and the regulation of the cbb3-2 operon by the putative
      iron-sulphur protein Anr
  - statement: cbb3-1 dominates and matters for growth at high aeration.
    supporting_text: >-
      In highly aerated cultures, cbb3-1 abundance and expression were greater
      than that of cbb3-2, and only loss of cbb3-1 influenced growth.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Comolli and Donohue, Mol Microbiol 2004). Abstract only.
      Source of the PseudoCAP IMP on all eight cbb3 subunits, two of which
      (ccoP1, ccoP2) are the only seeds of the PTN002435498 IBD. The abstract
      frames the experiments as loss of whole isoforms; it supports the
      complex-level activity, not a CcoP-specific one.
