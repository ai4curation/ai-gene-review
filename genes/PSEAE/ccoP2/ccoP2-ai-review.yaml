  review:
    summary: >-
      True for this leaf as a contribution to cbb3 oxidase activity, but the
      PTN002435498 node is a broad c-type cytochrome clade and rests only on
      the two P. aeruginosa CcoP rows.
    action: ACCEPT
    reason: >-
      CcoP2 is a subunit of the cbb3-2 oxidase (TIGR00782 ccoP, FixP_N plus
      two cytochrome c domains), so the activity belongs to the complex it is
      part of; core_functions records it as contributes_to. Q9I3G2 in its own
      WITH/FROM marks one of the two seeds, which is expected. The node is
      another matter. Its 32 leaves include soluble cytochromes c4 (P.
      aeruginosa cc4 P00106, Neisseria, Vibrio, Shewanella, Xanthomonas),
      cytochromes c552/c554, the bc1-complex cytochrome c subunit QcrC of
      M. tuberculosis and Streptomyces, and PvcD; none of these is a cytochrome
      c oxidase subunit. Both seeds are the same operon-level PseudoCAP IMP, so
      the IBD does not stand on independent evidence. The node-level
      GO_CENTRAL defect (REPOINT to GO:0009055 electron transfer activity) is
      recorded once, on genes/PSEAE/ccoP1; it is not duplicated here.
