suggested_questions:
- question: >-
    Which quinones are the physiological substrates of PA2580, and does it
    prefer NADPH like the Helicobacter enzymes?
suggested_experiments:
- description: >-
    Delete PA2580 alone and in combination with katA and wrbA, and measure
    H2O2, paraquat and quinone (menadione, phenazine) sensitivity, alongside
    steady-state kinetics of the purified enzyme with NADH versus NADPH.
