  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2580 is the Pseudomonas aeruginosa orthologue of MdaB, a soluble
  cytoplasmic flavoprotein of the flavodoxin-fold (DT-diaphorase-like) family
  of NAD(P)H:quinone oxidoreductases. The purified protein reduces quinones by
  a concerted two-electron transfer with very little semiquinone formation,
  which avoids the redox cycling that produces reactive oxygen species.
  Overexpressing it improves growth of a catalase (katA) mutant under H2O2
  challenge but has no visible effect in wild type, so in P. aeruginosa it is
  at most a minor contributor to peroxide defence. Orthologues in
  Helicobacter species are NADPH-preferring quinone reductases needed for
  resistance to oxygen and peroxides.
