- term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence_type: IMP
  original_reference_id: PMID:25085734
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP from Green et al. 2014: overexpressed PA2580 improves
      growth of a katA mutant under H2O2 challenge; no effect in wild type.
    action: KEEP_AS_NON_CORE
    reason: >-
      Gain-of-function evidence (GO counts overexpression as IMP) in a
      catalase-null background only; the authors describe a potential rather
      than demonstrated role. The enzyme does the protective chemistry
      itself, so the claim is plausible, but in P. aeruginosa it is
      secondary to catalase.
    supported_by:
    - reference_id: PMID:25085734
      supporting_text: >-
        in a katA mutant, H2O2 challenged strains over-expressing the WrbA and
        MdaB orthologs grew significantly better than the empty plasmid
        control.
    - reference_id: PMID:25085734
      supporting_text: >-
        However, when each was individually over-expressed in P. aeruginosa no
        overt H2O2-protective phenotype was observed.
