  - UniProtKB:Q9I0Q6
  review:
    summary: >-
      PAINT IBA from PTN002922793, sole seed the PseudoCAP IMP on this
      protein (expected self-reference).
    action: KEEP_AS_NON_CORE
    reason: >-
      Two-electron quinone reduction by MdaB is itself the protective step,
      so the term describes participation. The clade-level claim is better
      supported by knockout phenotypes of H. pylori MdaB (HP_0630, a leaf of
      this node) and H. hepaticus MdaB than by the PA seed. For P. aeruginosa
      the role is minor (protection seen only in a katA mutant), so non-core.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN002922793
        source_label: PTN002922793
        source_status: SUPPORTS_TRANSFER
        comment: PAINT leaf GAF (cached 2026-10-28) lists 9 GO:0034599 leaves in 8 taxa, including
          H. pylori HP_0630, whose own knockout is oxidative-stress sensitive (PMID:14977943).
      - source_id: UniProtKB:Q9I0Q6
        source_label: PA2580
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Sole seed; overexpression protects only a katA mutant (PMID:25085734).
    supported_by:
    - reference_id: PMID:14977943
      supporting_text: >-
        The mdaB mutant is also more sensitive to H(2)O(2), organic
        hydroperoxides, and the superoxide-generating agent paraquat.
    - reference_id: PMID:17923370
      supporting_text: >-
        The mdaB mutant was also more sensitive to oxidative stress reagents
        such as H(2)O(2), cumene hydroperoxide, t-butyl hydroperoxide, and
