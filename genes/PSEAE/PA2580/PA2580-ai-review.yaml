    oxidoreductases with the potential to defend against oxidative stress.
  findings:
  - statement: >-
      Purified PA2580 reduces quinones by two-electron transfer;
      overexpression protects a katA mutant, but not wild type, against H2O2.
    supporting_text: >-
      in a katA mutant, H2O2 challenged strains over-expressing the WrbA and
      MdaB orthologs grew significantly better than the empty plasmid control.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Green et al. 2014 J Microbiol 52:771-7; abstract only. Supports both
      PseudoCAP rows that seed PTN002922793: the activity (evidence code
      should be IDA) and, weakly, the oxidative-stress role.
- id: PMID:14977943
  title: An NADPH quinone reductase of Helicobacter pylori plays an important role
    in oxidative stress resistance and host colonization.
  findings:
  - statement: >-
      H. pylori mdaB mutant is sensitive to oxygen, peroxides and paraquat;
      the enzyme is an NADPH-preferring two-electron quinone reductase.
    supporting_text: >-
      The mdaB mutant is also more sensitive to H(2)O(2), organic
      hydroperoxides, and the superoxide-generating agent paraquat.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Wang and Maier 2004 Infect Immun; abstract cached. Orthologue evidence
      (HP_0630 is a PTN002922793 leaf) that supports the clade oxidative
      stress IBD better than the PA seed.
- id: PMID:17923370
  title: The NADPH quinone reductase MdaB confers oxidative stress resistance to
