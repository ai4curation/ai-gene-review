suggested_questions:
- question: >-
    What determines which cargo proteins associate with VgrG1a rather than with
    VgrG1c, given that the two are redundant for Hcp1 export?
suggested_experiments:
- description: >-
    Swap the head domains of VgrG1a and VgrG1c in the chromosome and test, by
    secretion assays with tagged cargo, whether cargo specificity follows the
    head domain.
