taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  VgrG1a (PA0091) is a valine-glycine repeat G (VgrG) spike protein of the H1
  type VI secretion system (H1-T6SS) of Pseudomonas aeruginosa, encoded within
  the HSI-I cluster. It forms a homotrimeric needle-like spike, structurally
  related to the gp27/gp5 puncturing complex of phage T4, that caps the Hcp1
  tube, and it is itself exported by the H1-T6SS in a ClpV1-dependent manner.
  VgrG1a, or the paralogous VgrG1c, is required for Hcp1 secretion, and VgrG
  proteins are also needed for export of H1-T6SS substrates. VgrG1a serves as
  the carrier for a specific subset of H1-T6SS cargo proteins, which it loads
  with the help of the chaperone EagT6.
