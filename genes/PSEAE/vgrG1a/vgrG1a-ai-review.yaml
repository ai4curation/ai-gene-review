- id: PMID:20114026
  title: A type VI secretion system of Pseudomonas aeruginosa targets a toxin to bacteria.
  findings:
  - statement: >-
      PA0091 (vgrG1) and PA2685 (then vgrG4, now vgrG1c) are the most abundant
      proteins of the on-state H1-T6SS secretome; the double deletion abolishes
      Hcp1 secretion, unlike deletion of the Tse cargo proteins.
    supporting_text: >-
      Western blot analysis revealed that Hcp1 secretion was abolished in both
      the ΔclpV1 and ΔvgrG1 ΔvgrG4 strains, however it was unaffected by tse
      deletion
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Hood et al. 2010 Cell Host Microbe; full text cached. Supports the IDA
      seeds. Note the older nomenclature (vgrG1/vgrG4 = vgrG1a/vgrG1c).
- id: PMID:21325275
  title: 'Type VI secretion system in Pseudomonas aeruginosa: secretion and multimerization
    of VgrG proteins.'
  findings:
  - statement: >-
      VgrG1a and VgrG1c are secreted in a ClpV1-dependent way, multimerise, and
      are redundantly required for Hcp1 secretion; VgrG1b behaves differently.
    supporting_text: >-
      In conclusion, VgrG1a and VgrG1c are essential for efficient Hcp1
      secretion but can function independently.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Hachani et al. 2011 JBC; full text cached and read. Supports the IMP
      seeds of PTN002088178 for vgrG1a and vgrG1c.
- id: PMID:26894531
  title: The structure of VgrG1 from Pseudomonas aeruginosa, the needle tip of the
    bacterial type VI secretion system.
  findings:
