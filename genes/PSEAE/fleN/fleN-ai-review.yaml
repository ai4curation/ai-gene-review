suggested_questions:
- question: Should GO provide a term for inhibition of a bacterial enhancer-binding protein (anti-activator
    activity) by a non-DNA-binding partner, distinct from generic ATPase inhibitor activity?
- question: Can the PAINT IBD for ATP binding at PTN000344128 be re-seeded with direct experimental evidence
    (FleN PDB 5J1J or E. coli MinD) before the PseudoCAP IDA row is corrected?
suggested_experiments:
- description: Measure FleN ATP binding affinity (ITC or fluorescent nucleotide) and ATPase kinetics in
    the presence and absence of FleQ and c-di-GMP to establish how hydrolysis times release of FleQ.
