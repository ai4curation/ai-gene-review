id: G3XD64
gene_symbol: fleN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: FleN (PA1454) is a 280-residue cytoplasmic MinD/ParA-family (FlhG-like) P-loop ATPase
  that sets flagellar number in Pseudomonas aeruginosa by acting as an anti-activator of FleQ, the
  sigma54-dependent AAA+ enhancer-binding protein at the top of the flagellar transcription
  hierarchy. Binding of ATP at its deviant Walker A motif remodels FleN into a nucleotide-sandwich
  homodimer; the ATP-bound dimer binds the FleQ AAA+ domain, allosterically blocks ATP binding and
  hydrolysis by FleQ and prevents productive FleQ oligomerization, so dampening FleQ-dependent
  expression of flagellar genes. FleN itself has weak intrinsic ATPase activity, and hydrolysis is
  proposed to release FleQ and allow basal flagellar gene expression. Loss of fleN causes
  up-regulation of FleQ-dependent flagellar genes, three to six polar flagella per cell and loss of
  swimming and chemotactic motility. With FleQ and c-di-GMP, FleN also participates in the regulation
  of biofilm (pel) genes, bridging DNA-bound FleQ to bend the pelA promoter.
