    label: ATPase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:34669473
  review:
    summary: Proposed new MF capturing the FleQ anti-activator activity of FleN.
    action: NEW
    reason: FleN binds the AAA+ domain of FleQ and inhibits its ATPase activity in vitro (wild-type FleN
      abolishes FleQ ATPase activity; FleQ-interface mutants inhibit less well and fail to complement the
      multiflagellate phenotype). This is the direct molecular basis of anti-activation and is the most
      informative MF available; GO has no anti-activator or transcription-activator-inhibitor term for
      a non-DNA-binding protein that inhibits a bacterial enhancer-binding protein.
