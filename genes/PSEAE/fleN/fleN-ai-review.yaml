      a sequence motif per the abstract; same authors call FleN a putative ATP/GTP binding protein in
      PMID:11673434), so as support for the PseudoCAP IDA ATP binding row it is miscited. Full text not
      available in cache.
- id: PMID:11673434
  title: Interaction of the antiactivator FleN with the transcriptional activator FleQ regulates flagellar
    number in Pseudomonas aeruginosa.
  findings:
  - statement: FleN interacts with FleQ in yeast two-hybrid; the Walker A K24Q mutation abolishes the
      interaction; ATP binding was still described as putative.
    supporting_text: In this report we demonstrate direct interaction of FleN and FleQ in the yeast two-hybrid
      system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; establishes FleN-FleQ interaction and that ATP binding was not yet
      experimentally demonstrated in 2001.
