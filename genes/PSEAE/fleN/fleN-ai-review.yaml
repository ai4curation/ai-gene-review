      ATP-dependent manner.
    supporting_text: at these sites causing the intervening DNA to bend
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; FleN role in FleQ-dependent pel regulation.
- id: PMID:28065505
  title: ATP-Induced Structural Remodeling in the Antiactivator FleN Enables Formation of the Functional
