- term:
    id: GO:1902209
    label: negative regulation of bacterial-type flagellum assembly
  evidence_type: IMP
  original_reference_id: PMID:10629180
  review:
    summary: Proposed new BP for the flagellar number control role of FleN.
    action: NEW
    reason: FleN itself performs the regulatory step (it binds and inhibits FleQ, the activator of class
      II flagellar genes). Loss of fleN up-regulates FleQ-dependent flagellar promoters and yields three
      to six polar flagella per cell, complemented by plasmid fleN; FleQ-interface mutants of FleN fail
      to restore monotrichy. This is the core biological role of FleN and is not yet annotated.
