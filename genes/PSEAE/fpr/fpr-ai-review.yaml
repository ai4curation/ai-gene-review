suggested_questions:
- question: Should electron-donor reductases (FPR for bacterial HO, POR for mammalian HO-1) be annotated to
    heme catabolic process, given that GO's heme oxygenase activity definition includes the reduced
    reductase as a co-substrate? Current practice differs between POR (not annotated) and FDXR (annotated to
    steroid biosynthesis).
suggested_experiments:
- description: Test whether an fpr deletion (or fpr/PA4615 double mutant) impairs growth on heme as sole iron
    source and biliverdin production in P. aeruginosa, to establish the in vivo role of FPR in heme
    degradation.
  experiment_type: genetic knockout with heme-iron utilisation assays
