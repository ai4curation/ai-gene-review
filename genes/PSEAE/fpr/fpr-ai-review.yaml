- term:
    id: GO:0042167
    label: heme catabolic process
  evidence_type: IDA
  original_reference_id: PMID:17915950
  qualifier: involved_in
  review:
    summary: PseudoCAP IDA; FPR supports pa-HO turnover in vitro without ferredoxin. Sole seed of the
      GO:0042167 IBD at PTN002500048.
    action: ACCEPT
    reason: FPR is not a substrate of heme catabolism and its role is not mere necessity. It catalyses the
      NADPH-to-heme-oxygenase electron transfer that each oxygenation step consumes; GO's heme oxygenase
      activity definition writes the reduced reductase in as a co-substrate. This is the cofactor-supplying
      case of participation. The evidence is in vitro reconstitution; in vivo dependence of heme-iron use on
      FPR has not been tested. Comparator caveat - mammalian POR, the HO-1 electron donor, carries no heme
      catabolism annotation, whereas the analogous adrenodoxin reductase FDXR is annotated to steroid
      biosynthesis, so GO practice here is inconsistent rather than prohibitive.
    supported_by:
    - reference_id: PMID:17915950
      supporting_text: In vitro reconstitution of pa-HO catalytic activity with the newly characterized
        proteins led to the surprising observation that pa-FPR efficiently supports the catalytic cycle of
        pa-HO, without the need of a ferredoxin.
    - reference_id: PMID:17915950
      supporting_text: Given that pa-HO functions to release iron from exogenous heme acquired under
        iron-starvation conditions, the use of a flavoenzyme rather than an iron-sulfur center-containing
        protein to support heme degradation is an efficient use of resources in the cell.
