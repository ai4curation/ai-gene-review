  label: Pseudomonas aeruginosa PAO1
description: fpr encodes a monomeric FAD-containing ferredoxin--NADP+ reductase (FPR) of the plastid-type FNR
  family, with an N-terminal FAD-binding domain and a C-terminal NADP-binding domain. Its expression rises
  under iron starvation. FPR oxidises NADPH and passes the electrons to one-electron acceptors, including
  the [2Fe-2S] bacterioferritin-associated ferredoxin Bfd, through which it supports reduction and release of
  Fe(3+) from the bacterioferritin BfrB core. FPR also reduces the iron-regulated heme oxygenase directly,
  without a ferredoxin intermediate, and so supplies the electrons for heme degradation that frees iron from
  heme taken up under iron limitation.
