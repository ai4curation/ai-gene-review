id: Q9I3N2
gene_symbol: ccmF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CcmF (PA1480) is a polytopic inner-membrane protein of the System I cytochrome c maturation (Ccm) pathway.
  Together with CcmH it forms the heme lyase (holocytochrome c synthase) that takes heme from the periplasmic
  chaperone holo-CcmE and attaches it covalently to the CXXCH motifs of apocytochromes c in the periplasm.
  CcmF belongs to the CcmF/CycK/Ccl1/NrfE/CcsA family; in the E. coli orthologue it carries a b-type heme
  ligated by conserved transmembrane histidines and acts in vitro as a quinol:heme oxidoreductase, thought
  to keep the heme reduced for attachment. In P. aeruginosa a ccmF insertion mutant shows milder versions
  of the pleiotropic defects of a ccmC mutant, including reduced [Fe-S] cluster content.
