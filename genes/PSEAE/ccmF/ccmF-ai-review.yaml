    summary: >-
      CcmF orthologues carry a b-heme and act as quinol:heme oxidoreductases; the IBA is correct for CcmF,
      though its PseudoCAP seed (catalase) is not. The specific supported activity is oxidoreductase acting
      on diphenols (quinols).
