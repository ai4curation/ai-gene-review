  review:
    summary: >-
      CcmF receives heme from holo-CcmE in the periplasm and attaches it to apocytochrome; it is not shown
      to move heme across the membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The InterPro2GO mapping from the cytochrome c biogenesis family signatures applies heme transmembrane
