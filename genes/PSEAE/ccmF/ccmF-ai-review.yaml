  review:
    summary: >-
      Seed row for the oxidoreductase IBD at PTN009171456. CcmF is not a catalase; loss of catalase activity
      in ccm mutants reflects poor heme supply to the heme catalases.
    action: REMOVE
    reason: >-
      A molecular function asserted from loss of an enzyme activity in a mutant is an indirect phenotype.
      P. aeruginosa catalases (KatA, KatB, KatE) are separate heme enzymes; CcmF is a membrane heme-lyase
      subunit with no catalase domain. The abstract of the likely source attributes undetectable catalase
      to the ccmC mutant; for ccmF nothing is stated. The same row was removed on ccmC (CONFIRMED there).
      As a seed of PTN009171456 (GO:0016491 oxidoreductase activity), the row is unsound, but the IBD
      stands on E. coli CcmF (P33927), which has direct quinol:heme oxidoreductase evidence.
    supported_by:
    - reference_id: PMID:18174132
      supporting_text: >-
        The ccmC mutant was also found to accumulate porphyrins, and catalase production was undetectable,
        consistent with the increased sensitivity to hydrogen peroxide.
    - reference_id: PMID:19629033
      supporting_text: >-
        CcmF, shown to have 13 TMDs, is therefore a cytochrome b , and we show that it acts in vitro as
        a quinol:haem oxidoreductase
