suggested_questions:
- question: >-
    Should System I CcmF(H) carry GO:0004408 holocytochrome-c synthase activity, as eukaryotic HCCS does,
    given that it catalyses covalent heme attachment to apocytochrome c?
suggested_experiments:
- description: >-
    Measure c-type cytochrome content and pyoverdine production in a P. aeruginosa ccmF deletion complemented
    with CcmF variants lacking the conserved TM histidine heme ligands, to test whether the b-heme redox
    centre is needed in vivo.
