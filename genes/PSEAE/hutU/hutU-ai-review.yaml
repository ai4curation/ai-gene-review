id: Q9HU83
gene_symbol: hutU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  HutU (PA5100) is the urocanase (urocanate hydratase, EC 4.2.1.49) of Pseudomonas aeruginosa
  PAO1, a soluble cytoplasmic enzyme with a tightly bound NAD+ cofactor. It catalyses step II of
  histidine degradation, hydrating trans-urocanate to 4-imidazolone-5-propanoate, between
  histidase (HutH) and imidazolonepropionase (HutI). The hut pathway lets P. aeruginosa use
  histidine as a carbon and nitrogen source; urocanate, the HutU substrate, is the physiological
  inducer of the pathway, so urocanase-deficient mutants express the other hut enzymes
  constitutively. HutU is the only urocanase-family protein in PAO1.
references:
- id: PMID:4290562
  title: Formation and operation of the histidine-degrading pathway in Pseudomonas aeruginosa.
  findings:
  - statement: Urocanase performs step II of histidine catabolism in P. aeruginosa and is induced
      with the rest of the pathway.
    supporting_text: >-
      Histidine ammonia lyase (histidase), urocanase, and the capacity to degrade formiminoglutamate,
      which are respectively involved in steps I, II, and IV in the catabolism of histidine
  - statement: Urocanase-deficient mutants express the other hut enzymes constitutively.
    supporting_text: >-
      Urocanase-deficient bacteria formed enzymes I and IV constitutively; presumably they accumulate
      enough urocanate from the breakdown of endogenous histidine to induce formation of the pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the GO:0016153 and GO:0006548 IMP rows, which seed PTN002639709.
      Abstract read here; the full text was read in the sibling hutI and hutF reviews (a copy
      supplied by the user) and has a urocanase-deficient mutant. Seed verdict SOUND. The paper
      predates cloning; the mutant maps to PA5100 because it is the only urocanase-family
      protein in PAO1.
- id: PMID:16475788
  title: 'Annotating enzymes of unknown function: N-formimino-L-glutamate deiminase is a member
    of the amidohydrolase superfamily.'
  findings:
  - statement: HutH, HutU and HutI carry out the first three steps of histidine degradation.
    supporting_text: >-
      The first three steps for the degradation of histidine include the action of HutH, HutU, and
      HutI to convert L-histidine to N-formimino-L-glutamate.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Pathway context for P. aeruginosa; not a GOA source for hutU.
