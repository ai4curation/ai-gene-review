  title: Connecting quorum sensing, c-di-GMP, pel polysaccharide, and biofilm formation in Pseudomonas
    aeruginosa through tyrosine phosphatase TpbA (PA3885).
  findings:
  - statement: >-
      Purified TpbA hydrolyses pNPP and phosphotyrosine peptides; activity is vanadate-sensitive.
    supporting_text: TpbA-cHis dephosphorylated both phosphotyrosine peptides
  - statement: TpbA is periplasmic by fractionation.
    supporting_text: we found that TpbA exclusively localized in the periplasm
  - statement: >-
      Model: periplasmic TpbA dephosphorylates TpbB to lower c-di-GMP.
    supporting_text: Periplasmic TpbA dephosphorylates the membrane-anchored GGDEF protein TpbB at a tyrosine
      reside which deactivates GGDEF protein activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0004725 seed row and the IDA periplasmic space row. Full text cached
      and read. Experiments used strain PA14 (PA14_13660), 98% identical to PAO1 PA3885.
- id: PMID:25909591
  title: Structural and Biochemical Analysis of Tyrosine Phosphatase Related to Biofilm Formation A (TpbA)
    from the Opportunistic Pathogen Pseudomonas aeruginosa PAO1.
  findings:
