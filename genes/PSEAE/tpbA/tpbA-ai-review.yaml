      PAO1 TpbA structures and peptide assays; prefers TpbB pTyr48.
    supporting_text: TpbA efficiently catalyzes the hydrolysis of two phosphotyrosine peptides derived
      from the periplasmic domain of TpbB
  - statement: TpbA can dephosphorylate pTyr, pSer and pThr.
    supporting_text: has been shown to possess phosphatase activities for pNPP and phosphotyrosine peptides,
