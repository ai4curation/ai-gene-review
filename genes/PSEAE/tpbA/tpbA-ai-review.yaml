  label: Pseudomonas aeruginosa PAO1
description: >-
  TpbA (tyrosine phosphatase related to biofilm formation A; PA3885) is a periplasmic dual-specificity
  protein phosphatase of Pseudomonas aeruginosa with a DUSP/PTP fold (Pfam Y_phosphatase2, Siw14-like)
  and an N-terminal signal peptide. It dephosphorylates the periplasmic domain of the membrane-anchored
  diguanylate cyclase TpbB (YfiN, PA1120), preferring phospho-Tyr48 over Tyr62, and also acts on phosphoserine
  and phosphothreonine. Dephosphorylation inactivates TpbB and lowers cellular c-di-GMP, which reduces
  Pel polysaccharide production, aggregation and biofilm formation; tpbA transcription is activated by
  Las quorum sensing, so TpbA links quorum sensing to c-di-GMP signalling. The purified enzyme hydrolyses
  p-nitrophenyl phosphate and phosphotyrosine peptides with vanadate-sensitive activity and a catalytic
  Cys132; crystal structures in ligand-free, phosphate-bound and phosphotyrosine-bound states show the
  canonical PTP loop and general-acid loop.
