suggested_questions:
- question: >-
    Which kinase phosphorylates the periplasmic tyrosines of TpbB, and is periplasmic tyrosine phosphorylation
    used by other P. aeruginosa membrane proteins?
suggested_experiments:
- description: >-
    Identify the periplasmic kinase acting on TpbB Tyr48 by phosphoproteomics of tpbA mutants combined
    with candidate kinase deletions, and test whether TpbB phosphomimetic mutants bypass tpbA loss in
    c-di-GMP and biofilm assays.
