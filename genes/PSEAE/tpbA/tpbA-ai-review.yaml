core_functions:
- description: >-
    Periplasmic dual-specificity protein phosphatase that dephosphorylates the periplasmic domain of the
    diguanylate cyclase TpbB (mainly pTyr48), inactivating it and lowering c-di-GMP, and so repressing
    Pel-dependent aggregation and biofilm formation downstream of Las quorum sensing.
