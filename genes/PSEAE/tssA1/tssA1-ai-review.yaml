description: TssA1 is an assembly-coordinating component of the Pseudomonas aeruginosa H1-T6SS. It forms a dodecameric ring at one end of the TssB1-TssC1 sheath and helps attach the pre-assembled sheath to the baseplate and stabilize the tubular sheath structure during extension.
