  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5017 (DipA, dispersion-induced phosphodiesterase A) is a membrane-associated
  c-di-GMP phosphodiesterase of Pseudomonas aeruginosa with an N-terminal GAF
  domain, PAS/PAC domains, a degenerate GGDEF domain (ASNEF motif, no detectable
  diguanylate cyclase activity) and a C-terminal EAL domain. Purified DipA
  hydrolyses c-di-GMP and the model substrate bis-pNPP, and both EAL motifs are
  needed for its activity in vivo. dipA expression rises on dispersion, and the
  protein lowers c-di-GMP so that biofilm cells can disperse in response to sudden
  nutrient (glutamate, ammonium), nitric oxide or heavy-metal cues; mutants show
  reduced swarming and increased attachment and Psl polysaccharide production.
