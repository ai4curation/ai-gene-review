- id: PMID:22493016
  title: The phosphodiesterase DipA (PA5017) is essential for Pseudomonas aeruginosa
    biofilm dispersion.
  findings:
  - statement: Purified DipA has c-di-GMP phosphodiesterase activity and no diguanylate
      cyclase activity.
    supporting_text: >-
      Using biochemical and in vivo studies, we show that DipA associates with the
      membrane and exhibits phosphodiesterase activity but no detectable diguanylate
      cyclase activity.
  - statement: Activity with c-di-GMP as substrate was measured directly, though low.
    supporting_text: >-
      Similar low activities were observed when c-di-GMP was used as a substrate
  - statement: The dipA mutant fails to disperse in response to several distinct cues,
      not glutamate alone.
    supporting_text: >-
      to be dispersion deficient in response to glutamate, nitric oxide, ammonium
      chloride, and mercury chloride.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC3370607). PseudoCAP source of the IDA phosphodiesterase row
      that seeds PTN002403463 and of the IMP response-to-amino-acid row. The PDE
      assay used His-tagged DipA purified from P. aeruginosa with bis-pNPP and with
      c-di-GMP; activity was low (partly insoluble protein) but EAL-motif mutants were
      inactive in vivo, so the IDA is sound. The amino-acid row rests on a dispersion
      phenotype that is shared with NO, ammonium and mercury cues.
