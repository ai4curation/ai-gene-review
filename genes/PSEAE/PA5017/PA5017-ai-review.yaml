suggested_questions:
- question: >-
    How do cAMP and c-di-GMP binding modulate DipA phosphodiesterase activity, and is
    DipA activity cue-specific or common to all dispersion signals?
suggested_experiments:
- description: >-
    Measure c-di-GMP hydrolysis kinetics (HPLC, pGpG product) of the soluble DipA EAL
    domain and of full-length protein, with and without cAMP, to quantify activity and
    GAF-domain regulation.
