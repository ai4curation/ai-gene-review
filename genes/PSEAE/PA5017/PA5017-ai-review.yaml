- term:
    id: GO:0043200
    label: response to amino acid
  evidence_type: IMP
  original_reference_id: PMID:22493016
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP. The dipA deletion mutant fails to disperse when biofilms are
      exposed to a sudden increase in glutamate.
    action: KEEP_AS_NON_CORE
    reason: >-
      The phenotype is real and fits the term in a broad sense, but it is not
      specific to amino acids, since the same mutant also fails to disperse in
      response to nitric oxide, ammonium chloride and mercury chloride. DipA is a
      downstream c-di-GMP phosphodiesterase acting in dispersion, not an amino-acid
      sensor. Not a seed row.
    supported_by:
    - reference_id: PMID:22493016
      supporting_text: >-
        to be dispersion deficient in response to glutamate, nitric oxide, ammonium
        chloride, and mercury chloride.
