    supporting_text: >-
      This system was required for activation of the arnBCADTEF LPS modification
      operon in the presence of subinhibitory concentrations of polymyxin,
      colistin, or the bovine peptide indolicidin, leading to increased
      resistance to various polycationic antibiotics, including aminoglycosides.
  - reference_id: PMID:24034668
    supporting_text: >-
      As is typical of TCST systems, the ParS/ParR system consists of a
      membrane-bound histidine sensor kinase (ParS) and a cytoplasmic response
      regulator (ParR).
suggested_questions:
- question: >-
    GO has lipid A biosynthetic process (GO:0009245) but no regulation terms
    under it, so regulators of the arn operon land on positive regulation of
    phospholipid biosynthetic process. Should a regulation-of-lipid-A-biosynthesis
    term be requested?
- question: >-
    Has phosphotransfer from ParS to ParR, or binding of phospho-ParR to the arn
    promoter, been shown biochemically? The GO:0000156 annotation currently rests
    on mutant phenotypes and domain architecture.
- question: >-
    ParR represses oprD and activates the arn operon from the same signal. What
    distinguishes the two promoter architectures?
suggested_experiments:
- description: >-
    Phosphorylate purified ParR with acetyl phosphate or with the ParS
    cytoplasmic domain and test binding to the arnB and oprD promoters by EMSA
    and DNase I footprinting, comparing the phosphorylated and unphosphorylated
    forms with a receiver-domain aspartate mutant.
