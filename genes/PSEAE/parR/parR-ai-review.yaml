  evidence_type: IMP
  original_reference_id: PMID:20547815
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row from the same paper, capturing ParR-dependent induction of
      the arnBCADTEF operon. The wording is surprising but the placement is
      correct - GO:0009245 lipid A biosynthetic process is a descendant of
      GO:0008654 phospholipid biosynthetic process, and ParR positively regulates
