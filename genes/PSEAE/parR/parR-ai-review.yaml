- term:
    id: GO:0000156
    label: phosphorelay response regulator activity
  evidence_type: IMP
  original_reference_id: PMID:20547815
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row, and one of the ten seeds of the GO:0000156 IBD. The cited
      paper shows that deleting parR abolishes peptide-induced arn expression and
      adaptive polymyxin resistance. That is a mutant phenotype of the system,
      not a demonstration that ParR itself accepts a phosphoryl group, so the
      molecular function is being read off the phenotype plus the domain
      architecture. The claim is almost certainly correct - receiver domain,
      winged-helix output domain, cognate kinase encoded next to it - so the row
      is kept.
    action: ACCEPT
    reason: >-
      Right gene and right activity; deferring to the curator on a claim this
      well supported by architecture and by the family. The reservation is about
      the evidence code, recorded as a source defect rather than by changing the
      action.
    supported_by:
    - reference_id: PMID:20547815
      supporting_text: >-
        Here we describe the identification and characterization of a novel P.
        aeruginosa two-component regulator affecting polymyxin-adaptive
        resistance, ParR-ParS (PA1799-PA1798).
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000315
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        The GO:0000156 row on PA1799 is coded IMP from PMID:20547815, but the
        evidence in the cited abstract is a mutant phenotype of the ParR-ParS
        system (loss of peptide-induced arnBCADTEF expression and of adaptive
        polymyxin resistance), not an assay of ParR as a phosphoryl-group
        acceptor. Since this row seeds the PAINT IBD on PTN000724188, the coding
        matters beyond this gene. Requested change - confirm whether the full
        text contains a phosphotransfer or phospho-ParR experiment; if not,
        consider recoding as an inference from the receiver-domain architecture
        while keeping the term. Filed as SUSPECTED because the full text of
        PMID:20547815 was not available and could report such an experiment.
      supported_by:
      - reference_id: PMID:20547815
        supporting_text: >-
          This system was required for activation of the arnBCADTEF LPS
          modification operon in the presence of subinhibitory concentrations of
          polymyxin, colistin, or the bovine peptide indolicidin, leading to
          increased resistance to various polycationic antibiotics, including
          aminoglycosides.
