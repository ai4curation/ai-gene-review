      supporting_text: >-
        This system was required for activation of the arnBCADTEF LPS
        modification operon in the presence of subinhibitory concentrations of
        polymyxin, colistin, or the bovine peptide indolicidin, leading to
        increased resistance to various polycationic antibiotics, including
        aminoglycosides.
core_functions:
- description: >-
    Response regulator of the ParR-ParS two-component system. Phosphorylated by
    ParS on detection of polymyxins and cationic antimicrobial peptides, ParR
    binds promoter DNA in the cytosol and reprograms transcription, activating
    the arnBCADTEF-ugd lipid A modification operon and repressing oprD, which
    together produce adaptive resistance to polymyxins and other polycationic
    antibiotics.
