      itself, which is exactly what a regulation term says.
    action: ACCEPT
    reason: >-
      Correct and as specific as GO currently allows - no regulation term exists
      for lipid A biosynthesis (checked against go-basic). Not modified, because
      the available descendants would be wrong, and not marked too general,
      because no more specific term is asserted anywhere in this review.
    supported_by:
