id: Q9I2U3
gene_symbol: parR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ParR (PA1799) is the cytoplasmic response regulator of the ParR-ParS
  two-component system of Pseudomonas aeruginosa. It is a 235-residue
  OmpR/PhoB-family protein with an N-terminal receiver (REC) domain that
  accepts a phosphoryl group from its cognate membrane sensor kinase ParS
  (PA1798) and a C-terminal winged-helix domain that binds promoter DNA. The
  system senses subinhibitory concentrations of polymyxins and cationic
  antimicrobial peptides and switches on the arnBCADTEF-ugd operon, which
  aminoarabinosylates lipid A and so lowers the negative charge of the outer
  membrane; this is the main route to adaptive resistance to polymyxin B and
  colistin, and it also raises resistance to aminoglycosides. The ParR regulon
  is wide and condition-dependent, including both activated genes (the arn
  operon, mexXY, mexEF-oprN) and repressed genes (notably the porin gene oprD),
  so ParR acts as both a transcriptional activator and a repressor depending on
  the promoter.
references:
- id: PMID:20547815
  title: Adaptive resistance to the "last hope" antibiotics polymyxin B and colistin
    in Pseudomonas aeruginosa is mediated by the novel two-component regulatory system
    ParR-ParS.
  findings:
  - statement: ParR-ParS (PA1799-PA1798) is the two-component system responsible for
      polymyxin-adaptive resistance.
    supporting_text: >-
      Here we describe the identification and characterization of a novel P.
      aeruginosa two-component regulator affecting polymyxin-adaptive resistance,
      ParR-ParS (PA1799-PA1798).
  - statement: The system is required to activate the arnBCADTEF lipid A modification
      operon in response to subinhibitory peptide concentrations, increasing resistance
      to polycationic antibiotics.
    supporting_text: >-
      This system was required for activation of the arnBCADTEF LPS modification
      operon in the presence of subinhibitory concentrations of polymyxin,
      colistin, or the bovine peptide indolicidin, leading to increased resistance
      to various polycationic antibiotics, including aminoglycosides.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the PseudoCAP source for both IMP rows on this gene and
      the seed of the GO:0000156 IBD on PTN000724188. Only the abstract is
      cached (the PubMed MCP returns no full text for PMC2916309), and the
      abstract describes genetics and resistance phenotypes rather than
      biochemistry, which is why the molecular-function row is judged an
      indirect-phenotype coding rather than miscited.
- id: PMID:24034668
  title: Transcriptome profiling reveals links between ParS/ParR, MexEF-OprN, and
    quorum sensing in the regulation of adaptation and virulence in Pseudomonas aeruginosa.
  findings:
  - statement: ParR is the cytoplasmic response regulator of a classical two-component
      system with the membrane sensor kinase ParS.
    supporting_text: >-
      As is typical of TCST systems, the ParS/ParR system consists of a
      membrane-bound histidine sensor kinase (ParS) and a cytoplasmic response
      regulator (ParR).
  - statement: ParR-dependent induction of the arn operon and other targets requires
      the inducing peptide, so the regulon is condition-dependent.
    supporting_text: >-
      quantitative reverse transcriptase polymerase chain reaction (qRT-PCR)
      analysis revealed that ParR-dependent genes such as arnBCADTEF-ugd, pmrB,
      pagL and PA1797 are not induced by ParR in the absence of indolicidin,
      suggesting that the ParS/ParR system regulates gene expression in an
      environment-dependent manner
  - statement: ParS/ParR also represses transcription, notably of the porin gene oprD.
    supporting_text: >-
      data from all three studies indicate that ParS/ParR are responsible for the
      repression of the oprD gene
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Transcriptome and qRT-PCR evidence that ParR controls a
      large, condition-dependent regulon in both directions, which supports the
      regulation-of-transcription rows and shows that the cytoplasmic
      response-regulator architecture is the accepted reading of this protein.
