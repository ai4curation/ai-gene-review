  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2126 (cgrC) encodes CgrC, a 211-residue cytoplasmic protein with a ParB-like
  N-terminal domain (ParB/sulfiredoxin superfamily) and an IbrB-like C-terminal
  region. It belongs to the cgrABC genes immediately upstream of the cupA
  fimbrial cluster. CgrA, CgrB and CgrC are unusual positive coregulators
  required for phase-variable expression of the cupA fimbrial genes, which
  support biofilm formation on abiotic surfaces. cgr expression is repressed by
  the H-NS-like MvaT and induced by anaerobiosis through the oxygen-sensing
  regulator Anr. CgrC self-associates, binds CgrA through its C-terminal
  region, and associates with the cupA promoter in chromatin
  immunoprecipitation whether or not it binds CgrA; it is proposed to act at
  the promoter and recruit CgrA.
