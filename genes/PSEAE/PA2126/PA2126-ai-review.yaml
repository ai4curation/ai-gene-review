suggested_questions:
- question: >-
    Does CgrC bind the cupA promoter DNA directly through its ParB-like domain, or through another protein, and what sequence does it recognise?
- question: >-
    Are CgrA/CgrC orthologs in other bacteria oxygen-regulated, or is the
    Anr control of cgr expression specific to P. aeruginosa? This decides
    whether any oxygen-response term can be inherited at PTN000764275.
suggested_experiments:
- description: >-
    Purify CgrC and test cupA promoter binding by EMSA or DNase I footprinting, with and without CgrA, and map the binding site.
