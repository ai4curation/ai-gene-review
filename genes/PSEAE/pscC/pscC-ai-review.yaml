taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PscC (SctC, PA1716) is the outer-membrane secretin of the type III secretion system
  of Pseudomonas aeruginosa. It is encoded in the exsD-pscB-L operon of the T3SS locus, whose
  products are homologues of the Yersinia Ysc export apparatus, and it is made as a precursor with
  a signal peptide. Many copies assemble into a barrel-shaped, ring-like channel in the outer
  membrane whose central chamber is plugged in the resting state, the same "cup and saucer"
  architecture as the type II secretion secretin PulD. The channel anchors the base of the
  injectisome in the cell envelope and is the conduit through which effector proteins such as
  exoenzyme S are delivered out of the bacterium and into host cells; loss of the gene abolishes
  type III secretion, reduces killing of host cells and attenuates virulence in animal infection.
