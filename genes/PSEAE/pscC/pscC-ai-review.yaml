suggested_questions:
- question: Does the plug and hairpin region seen in the cell-free-synthesised PscC multimer
    correspond to the gate of the assembled injectisome, and what opens it when the needle engages?
- question: Why does PscC, unlike XcpQ, depend on LolB for outer-membrane accumulation - is a
    lipoprotein pilotin required for its assembly in P. aeruginosa, and which protein is it?
suggested_experiments:
- description: Reconstitute PscC in the assembled injectisome base with the inner-membrane ring
    proteins and resolve the channel with and without a docked needle, to test whether the central
    plug moves during secretion.
- description: Screen candidate lipoproteins for a PscC pilotin by depletion and
    co-immunoprecipitation in PAO1, using outer-membrane multimer formation as the readout.
