  label: Pseudomonas aeruginosa PAO1
description: >-
  dsbB1 (PA5256) encodes one of the two DsbB-family disulfide bond formation
  proteins of Pseudomonas aeruginosa, a 163-residue inner-membrane protein with
  four transmembrane helices and two periplasmic cysteine pairs. Like E. coli
  DsbB it reoxidises the periplasmic thiol oxidase DsbA, passing the electrons
  to membrane quinones, so that DsbA can keep introducing disulfide bonds into
  envelope and secreted proteins. Its PA14 ortholog (PA14_69400) was named
  PaDsbB2 by Arts et al. 2013, opposite to the UniProt PAO1 numbering.
  PaDsbB2 and its paralog both reoxidise DsbA1 in vivo and in a
  quinone-containing in vitro reconstitution, with similar affinity for DsbA1,
  and are redundant - only the double mutant loses oxidative folding of
  pili, flagella and exoproteins such as elastase, and virulence.
