  - reference_id: PMID:24327342
    supporting_text: The reaction was performed in the presence of quinones (decylubiquinone).
suggested_questions:
- question: >-
    UniProt names PAO1 PA5256 dsbB1 and PA0538 dsbB2, but the PA14 entries and
    Arts et al. 2013 use the opposite assignment (PaDsbB1 is PA14_07000, the
    PA0538 ortholog). Should the PAO1 gene names be aligned with the
    literature?
suggested_experiments:
- description: >-
    Measure dsbB1 and dsbB2 expression across oxygen levels and in biofilms,
    and test whether either paralog prefers ubiquinone or menaquinone, to find
    conditions in which the two are not redundant.
