  title: Dissecting the machinery that introduces disulfide bonds in Pseudomonas aeruginosa.
  findings:
  - statement: Both DsbB paralogs reoxidise DsbA1 in vitro with similar affinity.
    supporting_text: Thus, PaDsbB1 and PaDsbB2 have similar affinities for PaDsbA1.
  - statement: Only the double mutant loses oxidative folding; either gene complements.
    supporting_text: the double PadsbB1B2 mutant being complemented by expression
      of either individual PadsbB1 or PadsbB2 gene
  - statement: Paper names map to PA14 locus tags opposite to the UniProt PAO1 names.
    supporting_text: PaDsbB1 [PA14_07000] and PaDsbB2 [PA14_69400]
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC3870256). PseudoCAP source for the IMP rows that seed
      PTN002195183. Work done in strain PA14. The paper's PaDsbB1 is
      PA14_07000 (UniProt Q02TM7, named dsbB1 in PA14), the ortholog of PAO1
      PA0538, which UniProt names dsbB2 (P57701); PaDsbB2 is PA14_69400, the
      ortholog of PA5256 (UniProt dsbB1, P21482). Checked by comparing the
      UniProt sequences on 2026-11-05. Because both paralogs got identical
      annotations, the name swap causes no GO error.
core_functions:
- description: >-
    Inner-membrane DsbB that reoxidises the periplasmic thiol oxidase DsbA1,
    transferring electrons to membrane quinones, and so sustains oxidative
    folding of disulfide-containing envelope and secreted proteins; redundant
    with its paralog dsbB2.
