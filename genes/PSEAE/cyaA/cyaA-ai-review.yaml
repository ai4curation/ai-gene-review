  evidence_type: IMP
  original_reference_id: PMID:12586068
  qualifier: enables
  review:
    summary: >-
      PseudoCAP seed row for PTN002215143. The abstract describes mutants unable
      to synthesise cAMP; it does not say which adenylate cyclase genes were
      deleted, and the full text (Dev Cell 2003, not in PMC) could not be read.
      Topal et al. 2012 state that CyaB makes most intracellular cAMP and that
      the role of CyaA is unknown.
    action: ACCEPT
    reason: >-
      The function is clearly correct for the gene (class I catalytic domain,
      orthology to E. coli CyaA). The gene-specific genetic evidence the
      curator coded is likely the cyaA cyaB double mutant, which the cached
      abstract cannot confirm; deferred to the curator (seed verdict
      UNVERIFIABLE, no defect).
    supported_by:
    - reference_id: PMID:12586068
      supporting_text: Transcriptome analysis of mutants lacking the ability to synthesize
        cAMP or the cAMP binding protein Vfr
