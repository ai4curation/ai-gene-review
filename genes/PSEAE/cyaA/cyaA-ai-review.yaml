  label: Pseudomonas aeruginosa PAO1
description: >-
  cyaA (PA5272) encodes the class I adenylate cyclase of Pseudomonas aeruginosa,
  a 950-residue cytoplasmic protein with the four-part class I adenylate cyclase
  architecture (N-terminal catalytic domain plus second, third and fourth
  regulatory regions) shared with Escherichia coli CyaA. It is one of three
  adenylate cyclases in P. aeruginosa, alongside the membrane class III enzyme
  CyaB and the secreted class II toxin ExoY. CyaA converts ATP to cAMP, which
  binds the global regulator Vfr; CyaB provides the majority of intracellular
  cAMP, and CyaA makes a minor contribution whose physiological role is not
  yet known.
