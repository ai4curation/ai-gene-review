suggested_questions:
- question: >-
    Under which growth conditions does CyaA, rather than CyaB, contribute
    to the cAMP pool, and is CyaA activity regulated by the PTS (EIIA-Glc) as
    in E. coli, given that P. aeruginosa lacks glucose PTS-mediated catabolite
    repression?
suggested_experiments:
- description: >-
    Purify PA CyaA and measure ATP-to-cAMP conversion kinetics; compare cAMP
    levels in cyaA, cyaB and cyaA cyaB mutants across carbon sources and
    oxygen levels.
