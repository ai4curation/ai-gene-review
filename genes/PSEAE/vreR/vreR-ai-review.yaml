  review:
    summary: >-
      Automatic inter-ontology inference from the accepted GO:0016989 on this gene. The input
      is correct, so the inference is sound; it is simply less specific than the evidence
      allows.
    action: MODIFY
    reason: >-
      Correct but general. An anti-sigma factor acts at initiation specifically, by
      withholding the sigma factor that licenses open-complex formation, so GO:2000143
      negative regulation of DNA-templated transcription initiation is the precise process -
      verified in OLS as a child of GO:0045892. It is also the mirror of the GO:2000142 that
      the cognate sigma factor reviews accept, including vreI for this same system. The
      merged foxR and PA0471 reviews make exactly this replacement for this row, so the
      three FecR-type regulators in the corpus now agree. Note the deliberate contrast with
      femI in this same batch, where a general regulation term was marked TOO_GENERAL rather
      than MODIFYed: there the specific term was already asserted on the gene as its own
      accepted row, leaving nothing to propose, whereas vreR carries no GO:2000143 row.
