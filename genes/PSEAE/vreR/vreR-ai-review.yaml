- description: >-
    The same protein is also required for VreI to function once the system fires, so it is
    not only an antagonist: it is the switch that both withholds and enables the sigma
    factor. GO has no class for this activity, so it is proposed rather than annotated.
  proposed_molecular_function: sigma factor activator activity
  supported_by:
  - reference_id: PMID:19730690
    reference_section_type: ABSTRACT
    supporting_text: >-
      Furthermore, the sigma factor regulator both inhibits the function of the ECF sigma
      factor and is required for its activity.
  knowledge_gaps:
  - gap_statement: >-
      How one protein both withholds and enables the same sigma factor is not understood for
      this system. Whether the two activities are carried by different domains, different
      conformational states of VreR, or by the intact protein versus a proteolytic fragment
      has not been determined, and it is the mechanistic question the paper's observation
      raises without answering.
    gap_kind:
    - BIOLOGY
proposed_new_terms:
- proposed_name: sigma factor activator activity
  proposed_definition: >-
    The function of binding to a sigma factor and being required for, or increasing the rate
    of, its transcriptional activity. Distinct from sigma factor antagonist activity
    (GO:0016989), which covers inhibition, and from anti-sigma factor antagonist activity
    (GO:0043856), which covers relief of inhibition by a third protein. Characteristic of
    FecR-family sigma factor regulators of bacterial cell-surface signalling systems, which
    both sequester their cognate extracytoplasmic function sigma factor and are required for
    its activity.
  justification: >-
    GO currently has a class for every other role in a cell-surface signalling system - sigma
    factor activity (GO:0016987), sigma factor antagonist activity (GO:0016989), anti-sigma
    factor antagonist activity (GO:0043856), sigma factor antagonist complex (GO:1903865) and
    antisigma factor binding (GO:0045152) - but none for a protein that is required for a
    sigma factor's activity. The result is that FecR-family regulators can only be annotated
    for the inhibitory half of a function the primary literature describes as dual, and the
    positive half is unrepresentable. PANTHER names this family for the activator role that
    GO cannot express (PTHR30273, periplasmic signal sensor and sigma factor activator
    FecR-related), which is an independent indication that the gap is in the ontology rather
    than in the evidence. The gap is general: it affects the merged foxR and PA0471 reviews in
    this corpus equally, and E. coli FecR is the paradigm case. GO:0043856 is not a
    substitute, since it describes inhibiting an anti-sigma factor rather than activating a
    sigma factor, and the proteins concerned are the anti-sigma factors themselves.
  proposed_parent:
    id: GO:0140110
    label: transcription regulator activity
  supported_by:
  - reference_id: PMID:19730690
    reference_section_type: ABSTRACT
    supporting_text: >-
      Furthermore, the sigma factor regulator both inhibits the function of the ECF sigma
      factor and is required for its activity.
  - reference_id: file:PSEAE/vreR/vreR-uniprot.txt
    record_section: ["DR:PANTHER"]
    supporting_text: 'DR   PANTHER; PTHR30273; PERIPLASMIC SIGNAL SENSOR AND SIGMA FACTOR ACTIVATOR
      FECR-RELATED; 1.'
suggested_questions:
- question: >-
    Are VreR's inhibitory and activating roles separable by mutation or by domain? One protein
    both withholding and enabling the same sigma factor is unusual enough that locating the
    two activities would clarify what kind of switch these systems use, and would also
    establish whether the proposed activator term should apply to intact VreR or to a
    fragment of it.
- question: >-
    Does VreR undergo regulated proteolysis on signalling, as the canonical anti-sigma
    factors do? If the activating role belongs to a cleavage product rather than to the
    membrane-anchored form, the dual function would be sequential rather than simultaneous.
suggested_experiments:
- description: >-
    Express VreI with and without VreR, and with VreR truncations separating the periplasmic
    sensor region from the cytoplasmic FecR_N domain, reading VreI-dependent promoter activity
    to assign the inhibitory and the required-for-activity roles to specific regions.
- description: >-
    Follow VreR by immunoblot during PUMA3 induction, with and without protease inhibitors,
    to test whether signalling triggers cleavage and whether an N-terminal fragment
    accumulates alongside sigma factor activation.
