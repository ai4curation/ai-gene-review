- id: PMID:19730690
  title: >-
    A Novel extracytoplasmic function (ECF) sigma factor regulates virulence in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      A cell-surface signalling system comprises an outer-membrane receptor, a
      cytoplasmic-membrane sigma factor regulator, and an ECF sigma factor; this gene is the
      regulator.
    reference_section_type: ABSTRACT
    supporting_text: >-
      They generally consist of a TonB-dependent outer membrane receptor, a sigma factor
      regulator (or anti-sigma factor) in the cytoplasmic membrane, and an extracytoplasmic
      function (ECF) sigma factor.
  - statement: >-
      The regulator's role is dual - inhibitory in the resting state and required for sigma
      factor activity when the system fires. Only the inhibitory half has a GO term.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Furthermore, the sigma factor regulator both inhibits the function of the ECF sigma
      factor and is required for its activity.
  - statement: >-
      Signal perception at the receptor activates the sigma factor, which then transcribes
      the system's target genes.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Upon perception of the extracellular signal by the receptor the ECF sigma factor is
      activated and promotes the transcription of a specific set of gene(s).
  - statement: >-
      This system regulates virulence rather than iron uptake, unlike most cell-surface
      signalling systems of this organism.
    reference_section_type: ABSTRACT
    supporting_text: we have identified a novel system involved in the regulation of virulence
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Llamas, van der Sar, Chu, Sparrius, Vogel & Bitter, PLoS Pathog 2009;
      DOI 10.1371/journal.ppat.1000572). Abstract only, but it states the architecture of
      these systems, the dual inhibitory-and-required role of the sigma factor regulator, and
      the virulence regulon. Correctly cited for this gene, which is the regulator component
      of the system the paper characterises. Unlike the Fem system reviewed in the previous
      batch, nothing from this paper appears to have been entered against the wrong component
      - both of this gene's rows describe a sigma factor regulator.
