id: O69006
gene_symbol: vreR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  VreR (PA0676) is the sigma factor regulator of the PUMA3 cell-surface signalling system of
  Pseudomonas aeruginosa, a 319-residue FecR-family protein anchored in the cytoplasmic
  membrane. It controls the extracytoplasmic function sigma factor VreI, and its role is
  dual: it holds VreI inactive in the resting state, yet it is also required for VreI to
  function once the system is triggered through the periplasmic receptor VreA. Unlike most
  cell-surface signalling systems of this organism, which govern iron uptake, PUMA3 directs
  the expression of virulence-associated genes, and its receptor component is unusually
  small and lacks the beta-barrel domain typical of TonB-dependent receptors.
