core_functions:
- description: >-
    Cytoplasmic-membrane FecR-family regulator that sequesters the ECF sigma factor VreI,
    holding the PUMA3 virulence regulon off until the receptor VreA signals.
  molecular_function:
    id: GO:0016989
    label: sigma factor antagonist activity
  directly_involved_in:
