  review:
    summary: >-
      PseudoCAP IMP; sole seed of the PTN000138516 L-histidine catabolic process IBD (8 leaf
      IBAs). Lessie and Neidhardt (1967) studied induction and repression of histidine-degrading
      activities in P. aeruginosa with urocanase-deficient, auxotrophic and repression mutants.
    action: ACCEPT
    reason: >-
      The claim is correct and accepted on independent evidence (PMID:16475788: PA5106 catalyses
      the first step of a FIGLU branch). The cited paper does not support it for this gene,
      though. It measures FIGLU-degrading capacity (step IV) only as a pooled extract activity
      that two PAO1 enzymes provide (HutF and HutE), describes no hutF mutant, and as a 1967
      study cannot assign a mutation to PA5106. The full text (scanned PMC276695) could not
      be retrieved, so the reference is flagged for checking rather than declared wrong, as
      for the same paper on hutI.
    supported_by:
