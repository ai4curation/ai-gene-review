gene_symbol: hutF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  hutF (PA5106) encodes N-formimino-L-glutamate deiminase (formimidoylglutamate deiminase,
  FIGLU iminohydrolase, EC 3.5.3.13) of Pseudomonas aeruginosa, a cytoplasmic homodimeric
  member of the amidohydrolase superfamily with a distorted (beta/alpha)8-barrel catalytic
  domain and a single active-site zinc ion coordinated by His56, His58, His232 and Asp320.
  It hydrolyses the formimino group of N-formimino-L-glutamate (FIGLU) to give N-formyl-L-glutamate
  and ammonia, using a zinc-bound hydroxide activated by His269. This is the first of two
  steps of the deiminase branch of histidine utilization, after which HutG (PA5091) hydrolyses
  N-formyl-L-glutamate to formate and L-glutamate. P. aeruginosa also has a parallel route
  in which HutE (PA3175) cleaves FIGLU directly to formamide and glutamate. hutF lies in the
  hut gene cluster, and histidine catabolism lets the bacterium use histidine as a carbon
  and nitrogen source.
