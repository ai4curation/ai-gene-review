core_functions:
- description: >-
    Zinc-dependent amidohydrolase that deiminates N-formimino-L-glutamate to N-formyl-L-glutamate
    and ammonia, the first step of the HutF/HutG (five-step) branch of histidine degradation
    to glutamate.
  molecular_function:
    id: GO:0050416
    label: formimidoylglutamate deiminase activity
  directly_involved_in:
