    label: cytosol
  supported_by:
  - reference_id: PMID:16475788
    supporting_text: >-
      The protein Pa5106 was shown to catalyze the deimination of N-formimino-L-glutamate
      to ammonia and N-formyl-L-glutamate
  - reference_id: PMID:17128965
    supporting_text: >-
      The mutation of Glu-235, His-269, or Asp-320 resulted in the diminution of catalytic
      activity by two to six orders of magnitude.
  - reference_id: PMID:25559274
    supporting_text: >-
      The active site of Pa5106 contains a single zinc atom that is coordinated by His-56,
      His-58, His-232, and Asp-320.
suggested_questions:
- question: >-
    Does the full text of Lessie and Neidhardt 1967 (PMID:4290562) describe any mutant that
    maps to hutF? If not, the PseudoCAP IMP for L-histidine catabolic process on PA5106, sole
    seed of the PTN000138516 BP IBD, should be re-keyed to PMID:16475788.
- question: >-
    Do the nematode PTN000138516 leaves (C. elegans cpin-1 and relatives), which lack the
    HutF family signatures, have FIGLU deiminase activity?
- question: >-
    What are the relative contributions of the HutF/HutG and HutE branches to FIGLU degradation
    in P. aeruginosa under different growth conditions?
suggested_experiments:
- description: >-
    Grow clean PAO1 hutF, hutE and hutF hutE deletion mutants on histidine as sole carbon
    or nitrogen source and measure FIGLU accumulation, to define whether either branch suffices;
    in parallel, assay recombinant C. elegans cpin-1 with FIGLU.
