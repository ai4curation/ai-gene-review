taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  LpxL (PA3242, HtrB2) is one of two HtrB/LpxL-type lipid A late acyltransferases of Pseudomonas aeruginosa.
  Members of the LpxL/LpxM/LpxP family are inner-membrane enzymes that transfer an acyl chain from acyl-ACP
  to the Kdo2-lipid IVA precursor, adding a secondary (acyloxyacyl) chain. In P. aeruginosa the secondary
  laurate and 2-hydroxylaurate chains are added by HtrB1 (PA0011) and HtrB2 (PA3242), each acting at a
  specific site of lipid A. Loss of either enzyme alters resistance to antibiotics and cationic antimicrobial
  peptides and increases outer membrane permeability.
