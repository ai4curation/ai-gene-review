  original_reference_id: PMID:25082951
  qualifier: involved_in
  review:
    summary: >-
      He et al. 2014 - a dguC lesion slightly impairs growth on D-Glu; dguC is
      in the D-Glu-induced dguABC operon.
    action: ACCEPT
    reason: >-
      The phenotype is mild and indirect (growth, not uptake), but it is
      reported for this gene, and a periplasmic binding protein encoded with a
      D-amino acid dehydrogenase in a D-Glu-induced operon has no evident role
      in D-Glu use other than substrate capture for transport. GO has no
      D-glutamate transport term. Accepted as the gene's core process, with
      the caveat that the AatJMQP transporter is the main D-Glu route and the
      DguC ligand is unmeasured.
    supported_by:
    - reference_id: PMID:25082951
      supporting_text: >-
        Whilst a lesion in dguC encoding a periplasmic solute binding protein
        only affected growth on D-Glu slightly
    - reference_id: PMID:25082951
      supporting_text: >-
        the divergent dguR-dguABC (D-Glu utilization) gene cluster was shown to
        participate in D-Glu and D-Gln catabolism and regulation
