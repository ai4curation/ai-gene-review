knowledge_gaps:
- gap_statement: >-
    The ligand of DguC is unknown. Its subfamily binds L-Glu/L-Asp, but its
    operon is induced by D-Glu; whether it binds D-Glu, D-Gln or another
    compound, and which permease it partners with (dgu has no permease genes),
    has not been tested.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
suggested_experiments:
- description: >-
    Thermal shift and ITC ligand screening of purified DguC with D- and
    L-glutamate, D-glutamine and related compounds, and D-Glu uptake assays in
    dguC, aatJ and double mutants.
