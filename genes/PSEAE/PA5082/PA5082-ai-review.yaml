  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5082 (DguC) is a periplasmic solute-binding protein of the SBP_bac_3
  family in Pseudomonas aeruginosa, encoded as the last gene of the
  D-glutamate-inducible dguABC operon together with the FAD-dependent
  D-amino acid dehydrogenase DguA and the RidA-family protein DguB. It has an
  N-terminal signal peptide and belongs to the glutamate/aspartate binding
  protein subfamily. A dguC lesion slightly impairs growth on D-glutamate,
  suggesting a minor role in D-glutamate uptake, while the AatJMQP transporter
  is the main route. Its ligand has not been determined experimentally.
