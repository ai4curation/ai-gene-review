suggested_questions:
- question: PTN004738955 carries substrate-specific siderophore IBDs at the root of a family whose
    members transport siderophores, haem, haemoglobin, vitamin B12 and colicins. Would PAINT be better
    served by asserting only the shared TonB-dependent outer-membrane transport at that node and placing
    substrate terms at the subfamily level, given that no child node separates the siderophore receptors
    from the haem receptors?
