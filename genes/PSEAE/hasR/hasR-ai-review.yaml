taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: 'HasR (PA3408) is the outer-membrane receptor of the has haem-acquisition system of Pseudomonas
  aeruginosa, one of the organism''s two haem-uptake routes. It is a TonB-dependent receptor of the
  PTHR30069 family that works with HasA, a secreted haemophore encoded in the same operon: HasA scavenges
  haem from host haemoproteins and delivers it to HasR, which transports it across the outer membrane
  using proton-motive force transduced by a TonB-like protein. Expression is iron regulated through
  Fur, the protein is found in the outer-membrane fraction of iron-starved cells, and deleting hasR
  reduces growth on haem or haemoglobin as sole iron source, with a phuR hasR double mutant almost
  unable to use either. Like other cell-surface signalling receptors of this family it is also implicated
  in signalling haem availability to the cytoplasm, though that role rests on similarity rather than
  on direct experiment here. Its substrate is haem, not a siderophore, which matters because the family-level
  annotations it receives are siderophore terms.'
