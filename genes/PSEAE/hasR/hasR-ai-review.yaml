- term:
    id: GO:0015344
    label: siderophore uptake transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN004738955
  - UniProtKB:Q05098
  - UniProtKB:Q9HVC0
  - UniProtKB:Q9HWM5
  - UniProtKB:Q9I527
  review:
    summary: Siderophore uptake transporter activity propagated from PTN004738955.
    action: REMOVE
    reason: 'Wrong substrate. HasR is a haem receptor, not a siderophore receptor: it sits in PANTHER
      subfamily SF41, named "Heme uptake outer membrane receptor HasR", and its own experimental rows
      are for haem and haemoglobin uptake. The IBD sits at the LUCA root of PTHR30069, which spans
      18 subfamilies, and is seeded only by siderophore and colicin receptors from five other subfamilies.
      The node supports the shared TonB-dependent mechanism, not the substrate, so this is an over-propagated
      electronic inference rather than a claim about this gene. The node-level request is recorded
      here once and cross-referenced from phuR.'
    supported_by:
    - *id002
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN004738955
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0015344
      cause: OVER_PROPAGATION
      confidence: CONFIRMED
      explanation: 'PTN004738955 is the LUCA root of PTHR30069, spanning 149 leaves across 18 subfamilies,
        and it carries IBDs for the substrate-specific siderophore terms GO:0015344 siderophore uptake
        transmembrane transporter activity and GO:0044718 siderophore transmembrane transport. Its
        five seeds are all siderophore or colicin receptors in five different subfamilies: Q9HVC0
        (SF42) and Q9HWM5 (SF37), both characterised ferric-siderophore receptors whose own seed rows
        this project reviewed and found sound, Q9I527 ferric enterobactin receptor PirA (SF8), Q05098
        ferric enterobactin receptor (SF51) and P17315 colicin I receptor (SF53). The terms therefore
        reach the haem-receptor subfamilies, whose PANTHER names state what they are: SF41 "Heme uptake
        outer membrane receptor HasR", which is this gene, and SF29 "Heme_hemoglobin uptake outer
        membrane receptor", which is phuR. Both have their own experimental evidence for haem rather
        than siderophore uptake. The seeds are not the problem; the depth is. What the node supports
        is the shared mechanism, TonB-dependent transport across the outer membrane, not the substrate.
        Relocating the IBDs will not fix it: the smallest clade containing all five seeds is PTN002824128
        (145 leaves), which contains SF29 and SF41 as well, so no child node holds the siderophore
        receptors alone. Suggested change: generalise the node terms to substrate-neutral ones, or
        prune/block the siderophore terms in the haem subfamilies SF29 and SF41. CONFIRMED: the node
        composition, the subfamily of every seed and target, and the minimal-clade test were checked
        directly in the PANTHER tree with projects/PSEUDOCAP/panther_tree.py on 2026-11-13. The same
        request covers the identical rows on phuR, which cross-references this entry.'
      supported_by:
      - *id002
    propagation_review: &id004
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN004738955
        source_label: PTN004738955
        source_status: SOURCE_BAD
        comment: LUCA root of PTHR30069, 149 leaves in 18 subfamilies. Supports TonB-dependent outer
          membrane transport, which is what the family shares, but not the siderophore substrate,
          which varies by subfamily.
      - source_id: UniProtKB:Q9HVC0
