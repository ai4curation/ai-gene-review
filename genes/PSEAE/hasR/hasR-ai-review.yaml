        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: 'A sound seed: this project reviewed its own siderophore rows and accepted them on
          its mutant phenotype. Its evidence does not transfer to a haem receptor.'
      - source_id: UniProtKB:P17315
