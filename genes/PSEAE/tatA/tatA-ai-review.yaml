id: Q9HUB5
gene_symbol: tatA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  TatA (PA5068) is the small single-pass inner-membrane subunit of the twin-arginine translocation
  (Tat) system of Pseudomonas aeruginosa, encoded upstream of tatB and tatC. The Tat system moves
  folded proteins with twin-arginine signal peptides across the cytoplasmic membrane, driven by
  the proton motive force. Substrates bind a TatBC receptor complex, which recruits oligomeric
  TatA; TatA is thought to form the protein-conducting channel. In P. aeruginosa the Tat pathway
  exports the periplasmic pyoverdine-biogenesis protein PvdN, so tat mutants make no pyoverdine,
  as well as phospholipases and other secreted virulence-associated proteins.
references:
- id: PMID:16621825
  title: 'Pyoverdine-mediated iron uptake in Pseudomonas aeruginosa: the Tat system is required
    for PvdN but not for FpvA transport.'
  findings:
  - statement: PvdN export to the periplasm is Tat dependent.
    supporting_text: >-
      We located PvdN, a still unknown but essential component in Pvd biogenesis, at the periplasmic side of the cytoplasmic membrane and showed that its export is Tat dependent.
  - statement: A tat mutant makes no pyoverdine.
    supporting_text: >-
      However, in the tat mutant, no Pvd was produced.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the GO:0033281 and GO:0008320 IMP rows, which seed PTN002452729.
      Abstract only (the PMC body was not returned). The evidence is a tat-mutant export
      phenotype; the abstract does not name the mutated tat gene, and PseudoCAP used the same
      paper for tatC. Seed verdict SOUND for the claims, which are correct for TatA.
