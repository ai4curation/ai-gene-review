core_functions:
- description: >-
    tRNA 4-thiouridine synthase. Binds tRNA through the THUMP domain,
    adenylates uridine 8 with ATP in the PP-loop domain, and transfers sulfur
    received as a persulfide on the rhodanese-domain Cys457 from IscS to make
    s4U8.
  molecular_function:
    id: GO:0140741
    label: tRNA-uracil-4 sulfurtransferase activity
  directly_involved_in:
  - id: GO:0002937
    label: tRNA 4-thiouridine biosynthesis
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:10753862
    supporting_text: >-
      the sulfane sulfur generated by IscS is transferred sequentially to ThiI
      and then to tRNA during the in vitro synthesis of s(4)U
  - reference_id: PMID:10722656
    supporting_text: >-
      Mutation of Cys-456 to alanine impairs this sulfurtransferase activity,
      and the C456A ThiI is incapable of supporting generation of
      4-thiouridine in tRNA both in vitro and in vivo.
  - reference_id: PMID:37891428
    supporting_text: >-
      As expected, the content of 4-thiouridine in bulk tRNA was drastically
      reduced in the ΔthiI knockout strain (negative control).
suggested_questions:
- question: >-
    Is PA5118 required for thiamine (thiazole) synthesis in P. aeruginosa, or,
    as in Salmonella grown with cysteine, can another sulfur route bypass it?
suggested_experiments:
- description: >-
    Test a PAO1 thiI deletion for thiamine or thiazole auxotrophy on minimal
    medium with and without cysteine, and measure tRNA s4U by LC-MS, with
    complementation by full-length and rhodanese-domain-only ThiI.
