- id: PMID:10722656
  title: Evidence that ThiI, an enzyme shared between thiamin and 4-thiouridine biosynthesis,
    may be a sulfurtransferase that proceeds through a persulfide intermediate.
  findings:
  - statement: E. coli ThiI Cys456 in the rhodanese domain is essential for s4U.
