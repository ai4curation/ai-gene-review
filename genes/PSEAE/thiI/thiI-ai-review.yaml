id: Q9HU66
gene_symbol: thiI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ThiI is the cytoplasmic tRNA sulfurtransferase that makes 4-thiouridine at
  position 8 of tRNA, the near-UV photosensing modification. The THUMP domain
  binds tRNA, the PP-loop (AANH) domain adenylates uridine 8 using ATP, and the
  C-terminal rhodanese domain accepts sulfur as a persulfide on Cys457 from the
  cysteine desulfurase IscS and passes it to the activated uridine. Like the
  Escherichia coli and Salmonella enzymes, P. aeruginosa ThiI carries the
  rhodanese domain, which in Salmonella is needed and sufficient for synthesis
  of the thiazole moiety of thiamine; this second role is predicted for the
  P. aeruginosa protein but has not been tested.
