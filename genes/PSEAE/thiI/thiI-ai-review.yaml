- term:
    id: GO:0052837
    label: thiazole biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:9209060
  qualifier: involved_in
  review:
    summary: >-
      The cited paper is a Salmonella typhimurium genetic study (a thiI mutant
      needs thiazole); it does not assay P. aeruginosa ThiI. The claim is
      plausible for PA5118 by orthology, but IDA is the wrong evidence code.
    action: KEEP_AS_NON_CORE
    reason: >-
      The abstract states the organism and the approach (mutant phenotype, ORF
      mapping and sequencing in Salmonella). A 1997 Salmonella paper predates
      the PAO1 genome and cannot be direct evidence for PA5118. The process is
      still a reasonable prediction for PA5118, which has the rhodanese domain
      required for thiazole synthesis, so the claim is kept as non-core and the
      evidence code is flagged. This row is the sole seed of the root-level
      thiazole IBD at PTN001804941.
    supported_by:
    - reference_id: PMID:9209060
      supporting_text: >-
        We present herein the initial characterization of thiI, a gene required
        for THZ synthesis.
    - reference_id: PMID:21724998
      supporting_text: >-
        the C-terminal rhodanese domain of ThiI was sufficient for thiazole
        synthesis in vivo
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      confidence: CONFIRMED
      explanation: >-
        involved_in GO:0052837 thiazole biosynthetic process (IDA) on PA5118
        cites Webb, Claas & Downs 1997 (PMID:9209060), "Characterization of
        thiI, a new gene involved in thiazole biosynthesis in Salmonella
        typhimurium". The abstract states outright that the paper characterises
        the Salmonella thiI gene (mapping it on the S. typhimurium chromosome and
        sequencing it) and describes no P. aeruginosa work; the 1997 paper also
        predates the PAO1 genome, so it is not direct-assay evidence for PA5118. Either
        recode the row as ISS with the Salmonella ThiI accession in With/From,
        or delete it. This row is the only seed of the PANTHER IBD at
        PTN001804941, which propagates thiazole biosynthesis to 25 ThiI family
        members including Firmicutes and archaea whose ThiI is not needed for
        thiamine.
      supported_by:
      - reference_id: PMID:9209060
        supporting_text: >-
          Thiamine pyrophosphate (TPP) is a required cofactor in Salmonella
          typhimurium
      - reference_id: PMID:9209060
        supporting_text: >-
          thiI is a 1,449-bp open reading frame located at minute 9.65 on the S.
          typhimurium chromosome
