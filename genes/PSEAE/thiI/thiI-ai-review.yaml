- id: PMID:9209060
  title: Characterization of thiI, a new gene involved in thiazole biosynthesis in
    Salmonella typhimurium.
  findings:
  - statement: >-
      Salmonella typhimurium thiI is required for synthesis of the thiazole
      (THZ) moiety of thiamine; genetic characterisation only.
    supporting_text: >-
      We present herein the initial characterization of thiI, a gene required
      for THZ synthesis.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified id (PMID:9209060, J Bacteriol 1997, PMC179266; full text
      is scanned page images only and was not read). Right paper for the
      Salmonella thiI-thiazole link. Its title and abstract state outright that
      it is a Salmonella typhimurium study and describe no P. aeruginosa work, so
      as evidence for PA5118 it fits ISS rather than IDA (evidence-code defect
      recorded on the row).
- id: PMID:21724998
  title: The rhodanese domain of ThiI is both necessary and sufficient for synthesis
    of the thiazole moiety of thiamine in Salmonella enterica.
  findings:
  - statement: >-
      The rhodanese domain of Salmonella ThiI is sufficient for thiazole
      synthesis; s4U-specific residues are not needed. Short ThiI lacking the
      rhodanese domain is unlikely to work in thiazole synthesis.
    supporting_text: >-
      the C-terminal rhodanese domain of ThiI was sufficient for thiazole
      synthesis in vivo
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; defines which ThiI proteins carry the thiazole role.
