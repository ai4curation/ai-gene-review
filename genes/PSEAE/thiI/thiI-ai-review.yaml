  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract; shows the thiazole role does not extend to the family root.
- id: PMID:22904325
  title: Biosynthesis of 4-thiouridine in tRNA in the methanogenic archaeon Methanococcus
