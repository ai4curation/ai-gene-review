- term:
    id: GO:0052837
    label: thiazole biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001804941
  - UniProtKB:Q9HU66
  review:
    summary: >-
      The claim is plausible for PA5118 (rhodanese-domain ThiI), but this IBA
      returns PA5118's own seed, a mis-coded Salmonella paper, and the IBD sits
      at the family root, where most members are short ThiI proteins not needed
      for thiamine.
    action: KEEP_AS_NON_CORE
    reason: >-
      Here the target appearing in its own With/From is genuine circularity:
      the IBD's only seed is the PseudoCAP IDA on PA5118, which reports a
      Salmonella typhimurium genetic study and no P. aeruginosa assay. No
      experimental grounding on a P. aeruginosa protein lies anywhere in the
      chain. The process is still plausible for PA5118 by domain architecture
      (rhodanese domain, Cys457, TIGR04271) and by orthology to Salmonella ThiI,
      so the row is kept as a predicted non-core role. The node placement is
      wrong for the clade: B. subtilis and M. maripaludis ThiI, which lack the
      rhodanese domain, are not needed for thiamine synthesis, so the IBD
      over-propagates to Firmicutes and archaea (see source_defects).
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      - LINEAGE_OR_TAXON_MISMATCH
      - CIRCULAR_PROPAGATION
      source_entities:
      - source_id: UniProtKB:Q9HU66
        source_label: PA5118 (self; sole IBD seed, IDA PMID:9209060)
        source_status: SOURCE_BAD
        comment: >-
          The seed cites a Salmonella genetics paper with no P. aeruginosa
          experiment, so it is a mis-coded orthology transfer, not
          experimental grounding.
      - source_id: PANTHER:PTN001804941
        source_label: PTN001804941 (ThiI family root)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Root node of PTHR43209; most members are short ThiI proteins
          (Firmicutes, archaea) that lack the rhodanese domain and are not
          needed for thiamine.
    supported_by:
    - reference_id: PMID:21724998
      supporting_text: >-
        the C-terminal rhodanese domain of ThiI was sufficient for thiazole
        synthesis in vivo
    - reference_id: PMID:22773787
      supporting_text: >-
        Gene inactivation experiments in B. subtilis indicate the requirement of
        ThiI and NifZ for the biosynthesis of 4-thiouridine, but not thiamine.
    - reference_id: PMID:22904325
      supporting_text: >-
        deletion of ThiI (MMP1354) abolished the biosynthesis of s(4)U but not of
        thiamine
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN001804941
      requested_change: DELETE_VALUE
      asserted_value: GO:0052837
      confidence: PROBABLE
      explanation: >-
        The IBD of GO:0052837 thiazole biosynthetic process at PTN001804941, the
        root of the ThiI family PTHR43209, has a single seed: the PseudoCAP IDA
        on P. aeruginosa PA5118 citing PMID:9209060, which its abstract states is
        a Salmonella typhimurium gene characterisation, with no P. aeruginosa
        work described. The
        root node also covers short ThiI proteins (most Firmicutes and archaea)
        that lack the C-terminal rhodanese domain; in B. subtilis
        (PMID:22773787) and Methanococcus maripaludis (PMID:22904325) ThiI is
        needed for 4-thiouridine but not for thiamine, and Salmonella work
        shows the rhodanese domain is what thiazole synthesis requires
        (PMID:21724998). Please remove the thiazole IBD from the family root;
        if wanted, place it at the rhodanese-domain (proteobacterial) subclade,
        seeded by experimental annotations of E. coli or Salmonella ThiI.
      supported_by:
      - reference_id: PMID:21724998
        supporting_text: >-
          proteins annotated as ThiI based on containing only the AANH and THUMP
          domains are unlikely to be involved in thiazole synthesis and would be
          better annotated as 4-thiouridine sulfurtransferases
