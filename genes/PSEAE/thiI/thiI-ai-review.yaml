  title: Functional Analysis of Bacillus subtilis Genes Involved in the Biosynthesis
    of 4-Thiouridine in tRNA.
  findings:
  - statement: B. subtilis ThiI (no rhodanese domain) is needed for s4U but not thiamine.
    supporting_text: >-
