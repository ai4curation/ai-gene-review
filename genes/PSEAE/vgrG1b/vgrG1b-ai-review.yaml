- id: PMID:24794869
  title: The VgrG proteins are "à la carte" delivery systems for bacterial type VI
    effectors.
  findings:
  - statement: >-
      VgrG1b contributes independently to interbacterial competition, and
      reintroducing vgrG1b alone into a triple vgrG1abc mutant restores that
      activity, together with the PA0099 protein encoded in its cluster.
    supporting_text: >-
      Finally, VgrG1b-dependent killing is detectable upon complementation of a
      triple vgrG1abc mutant.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Hachani et al. 2014 JBC; full text cached. Establishes a cargo-carrier
      role for VgrG1b and names its cluster partner.
- id: PMID:30455305
  title: The Pseudomonas aeruginosa T6SS-VgrG1b spike is topped by a PAAR protein
    eliciting DNA damage to bacterial competitors.
  findings:
  - statement: >-
      The PAAR-domain protein Tse7 caps the VgrG1b spike, residues at the
      PAAR-VgrG1b interface are required for VgrG1b-dependent delivery, and
      that delivery depends on the H1-T6SS cluster.
    supporting_text: Tse7 sits on the tip of the VgrG1b spike
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Pissaridou et al. 2018 PNAS; abstract only in the cache, but it states
      the spike role and the H1-T6SS dependence outright. The correct reference
      for the T6SS rows on vgrG1b.
core_functions:
- description: >-
    VgrG spike protein of the PA0095-PA0101 cluster. VgrG1b is not needed for
    assembly or firing of the Hcp1 tube, but it forms a spike capped by a
    PAAR-domain protein from its own cluster and delivers that cargo to
    neighbouring bacteria in a way that depends on the H1-T6SS cluster.
  directly_involved_in:
  - id: GO:0033103
    label: protein secretion by the type VI secretion system
  supported_by:
  - reference_id: PMID:30455305
    supporting_text: Tse7 sits on the tip of the VgrG1b spike
  - reference_id: PMID:24794869
    supporting_text: >-
      Finally, VgrG1b-dependent killing is detectable upon complementation of a
      triple vgrG1abc mutant.
knowledge_gaps:
- gap_statement: >-
    The route by which VgrG1b reaches the cell exterior is unidentified. Its
    release requires none of the three ClpV ATPases, so no known T6SS accounts
    for it, and no alternative export pathway has been shown.
  boundary: >-
    Established: VgrG1b is genuinely exported (not released by lysis or
    periplasmic leakage), its release is unaffected by clpV1, clpV2 and clpV3
    deletions, and delivery of its PAAR-capped cargo to target bacteria depends
    on the H1-T6SS cluster.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    Does VgrG1b cap a sheath-driven apparatus of its own, or does it reach the
    tip of the H1-T6SS machine only when its PAAR partner is present?
suggested_experiments:
- description: >-
    Track fluorescently tagged VgrG1b alongside a tagged H1-T6SS sheath in
    single cells, with and without its PAAR partner, and test whether its
    release depends on the sheath and baseplate genes rather than on the ClpV
    ATPases.
