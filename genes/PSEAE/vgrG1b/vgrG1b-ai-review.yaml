  label: Pseudomonas aeruginosa PAO1
description: >-
  VgrG1b (PA0095) is a valine-glycine repeat G (VgrG) spike protein encoded in
  the HSI-I region of Pseudomonas aeruginosa, close to vgrG1a, within a
  seven-gene cluster (PA0095-PA0101) and co-regulated with the H1 type VI
  secretion system through the RetS/Gac-Rsm pathway. It is closely related to
  VgrG1a (64% identity), but it behaves differently from the other two
  co-regulated VgrGs: its own release into the medium does not require any of
  the three ClpV ATPases, and it is dispensable for Hcp1 secretion and for
  secretion of VgrG1a and VgrG1c. Later work showed that VgrG1b nevertheless
  forms a spike capped by a PAAR-domain protein encoded in its own cluster and
  that delivery of that cargo to neighbouring bacteria requires the H1-T6SS
  cluster, so VgrG1b is a cluster-specific spike rather than a core component
  of the Hcp1 apparatus.
