status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4896 is a 178-residue extracytoplasmic function (ECF) sigma factor of the sigma-70 family
  (iron-starvation/FecI-like group) in Pseudomonas aeruginosa PAO1. It has the sigma-70 region
  2 (core RNA polymerase binding, -10 recognition) and region 4.2 (-35 recognition helix-turn-helix)
  modules. It forms a cell-surface signalling (CSS) system with the adjacent anti-sigma factor
  PA4895 and the TonB-dependent transducer PA4897. When overexpressed it induces transcription
  of the cognate TonB-dependent outer membrane transducer and of putative metal-transport
  genes, consistent with a role in signal-dependent uptake of an as yet unidentified (probably
  metal-chelate) substrate. Like other ECF sigma factors it is expected to act in the cytoplasm
  as the promoter-specificity subunit of RNA polymerase holoenzyme, held inactive by its membrane
  anti-sigma factor until the signal is perceived.
references:
- id: PMID:18086184
  title: Characterization of five novel Pseudomonas aeruginosa cell-surface signalling systems.
  findings:
  - statement: PA4896 was overexpressed and its target genes identified by microarray, proteomics
      and/or lacZ reporters.
    supporting_text: the ECF sigmas PA0149, PA1912, PA2050, PA2093 and PA4896 have been overexpressed
      and their target gene candidates have been identified using DNA microarray, proteomic
      analysis, and/or lacZ reporter construct
  - statement: Each of the five sigma factors drives production of one TonB-dependent transducer;
      the target transport systems are only putatively metal-related.
    supporting_text: although all these sigma factors seem to control putative (metal) transport
      systems
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP sigma factor activity (IBD seed), IMP regulation of iron
      ion transport and NAS cytosol rows. Abstract only (no PMC copy). The abstract states
      that PA4896 was overexpressed and its target genes identified, which is genetic evidence
      that it directs transcription of specific promoters. It describes the regulated transport
      systems only as putative (metal) transport systems, and names a ligand only for FemI
      (PA1912), not for PA4896.
