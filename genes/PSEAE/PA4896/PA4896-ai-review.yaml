suggested_questions:
- question: >-
    What is the inducing signal (siderophore or other metal chelate) perceived by the PA4897
    transducer and relayed through PA4895 to PA4896?
suggested_experiments:
- description: >-
    Screen siderophores and metal chelates for induction of a PA4896-dependent lacZ reporter
    in wild-type versus PA4897 and PA4895 mutants, with in vitro transcription by reconstituted
    PA4896-RNAP.
