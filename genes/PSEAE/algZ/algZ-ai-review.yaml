  review:
    summary: >-
      IBA from PTN002531636, seeded by E. coli YpdA (IMP). AlgZ is the genetically defined
      kinase partner of AlgR.
    action: ACCEPT
    reason: >-
      The H box (RPHFLFNSL) is conserved, and AlgR phosphorylation in an AlgZ-dependent
      pathway activates fimU. The missing ATP-lid boxes make AlgZ an atypical kinase whose
      activity has not been shown biochemically, so this is an accepted inference, not a
      demonstrated activity.
    supported_by:
    - reference_id: PMID:24999454
      supporting_text: Together, these data indicate that AlgR phosphorylation by AlgZ increased
        AlgR affinity to the fimU promoter and activated its transcription.
    - reference_id: PMID:24999454
      supporting_text: The obvious similarities between AlgZ and canonical histidine kinases are
        limited to these two boxes, as AlgZ lacks identifiable G1, F, and G2 boxes that make up
        the ATP-coordinating flexible lid.
