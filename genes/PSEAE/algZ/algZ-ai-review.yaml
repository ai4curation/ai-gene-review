core_functions:
- description: >-
    Membrane sensor of the AlgZR two-component system. Through AlgR phosphorylation it
    activates the fimU-pilVWXY1Y2E minor pilin operon and twitching motility. The signal it
    senses is unknown, and its kinase mechanism is atypical.
