suggested_experiments:
- description: >-
    Test autophosphorylation of purified or membrane-reconstituted AlgZ and phosphotransfer to
    AlgR Asp54, and compare H-box histidine mutants for twitching, to see whether AlgZ is a
    true kinase despite lacking the ATP-lid motifs.
