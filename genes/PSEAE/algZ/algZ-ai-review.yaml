taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AlgZ (also FimS; PA5262) is the membrane sensor of the AlgZR two-component system. It has
  four predicted N-terminal transmembrane helices and a cytoplasmic LytS/YpdA-type histidine
  kinase region. The H box with its phosphorylatable histidine is conserved, but the N box is
  degenerate and the G1, F and G2 boxes of the ATP lid are missing. Together with its response
  regulator AlgR, it is needed for twitching motility: AlgR phosphorylation activates the
  fimU-pilVWXY1Y2E minor pilin operon. AlgZR also coordinates other phenotypes, including
  cyanide production. The signal AlgZ senses is unknown. This PA5262 protein is distinct from
  AmrZ (PA3385), the DNA-binding protein first described under the name AlgZ.
