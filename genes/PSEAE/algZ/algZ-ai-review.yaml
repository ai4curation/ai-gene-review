- term:
    id: GO:2000147
    label: positive regulation of cell motility
  evidence_type: IMP
  original_reference_id: PMID:8790418
  qualifier: involved_in
  review:
    summary: PseudoCAP IMP. The fimS mutant has lost twitching motility.
    action: KEEP_AS_NON_CORE
    reason: >-
      AlgZR promotes twitching by activating the minor pilin genes through AlgR. The term is
      as specific as GO allows (there is no "regulation of type IV pilus-dependent motility"
      term). It is a downstream output of the signalling activity, so non-core.
    supported_by:
    - reference_id: PMID:8790418
      supporting_text: Adjacent to algR we have identified a sensor gene (fimS), which is also
        required for twitching motility.
    - reference_id: PMID:24999454
      supporting_text: Though the signal for the AlgZ sensor kinase has not been determined, the
        signal, via AlgR phosphorylation, activates twitching motility by increasing the
        expression of these prepilins.
