  label: Pseudomonas aeruginosa PAO1
description: >-
  KatA (PA4236) is the major catalase of Pseudomonas aeruginosa, a heme-containing monofunctional (clade
  3) catalase that dismutates hydrogen peroxide into water and oxygen (EC 1.11.1.6). It is a homotetramer
  with one heme per subunit and a bound NADPH, and it is an abundant, protease-resistant cytoplasmic protein.
  katA mutants have no detectable catalase activity and are hypersusceptible to H2O2, and katA transcription
  rises with iron and H2O2. Full KatA activity needs the iron-storage protein bacterioferritin A, a likely
  iron source for its heme. KatA is also more highly expressed under anaerobic growth, partly under ANR
  control and dependent on basal nitric oxide. Its ferric heme binds NO directly (Kd about 6 microM) without
  prior reduction, and katA mutants are more sensitive to nitrite-derived NO in anaerobic planktonic and
  biofilm cultures, suggesting that KatA also buffers NO generated during anaerobic respiration.
