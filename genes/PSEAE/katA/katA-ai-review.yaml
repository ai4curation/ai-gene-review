suggested_questions:
- question: >-
    Does NO binding to KatA heme inhibit its catalase activity, and does KatA chemically consume NO or
    only buffer it?
suggested_experiments:
- description: >-
    Measure catalase turnover of purified KatA across a range of NO concentrations and test whether KatA
    lowers free NO in anaerobic norCB mutants by direct NO-electrode measurements with heme-site mutants.
