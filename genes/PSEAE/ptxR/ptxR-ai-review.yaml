id: P72131
gene_symbol: ptxR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PtxR (PA2258) is a LysR-family transcriptional activator of Pseudomonas aeruginosa, found in the human-pathogenic
  pseudomonads, that activates expression of the exotoxin A gene toxA and of the kgu and gad 2-ketogluconate
  catabolic operons. It binds a short palindromic operator overlapping the -35 region of PtoxA, Pkgu and
  Pgad. Its activity is antagonized by the divergently encoded LacI-family repressor PtxS, which binds
  PtxR directly (at PtoxA) or forms a DNA loop with it (at Pkgu and Pgad); 2-ketogluconate releases PtxS
  and allows PtxR-dependent transcription. PtxR also modulates quorum-sensing-controlled virulence genes:
  ptxR mutants make more pyocyanin and rhamnolipid gene expression and less lasB (elastase) expression.
