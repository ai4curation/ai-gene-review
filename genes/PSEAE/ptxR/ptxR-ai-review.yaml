  title: >-
    PtxR modulates the expression of QS-controlled virulence factors in the Pseudomonas aeruginosa strain
    PAO1.
  findings:
  - statement: ptxR mutation increases pyocyanin production.
    supporting_text: Mutation of ptxR in PAO1 increased pyocyanin production.
  - statement: ptxR mutation decreases lasB expression.
    supporting_text: >-
      ptxR mutation increased the expression of the rhamnolipid synthesis gene rhlA but decreased lasB
      expression
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IMP source for GO:0045862 and GO:1900377. Abstract only. Regulation of QS-controlled genes,
      probably indirect (through rhlI, lasI and pqsABCDE).
- id: PMID:22844393
  title: >-
    Genes for carbon metabolism and the ToxA virulence factor in Pseudomonas aeruginosa are regulated
    through molecular interactions of PtxR and PtxS.
  findings:
  - statement: PtxR binds a palindromic operator in the toxA promoter.
    supporting_text: >-
      PtxR binds to the toxA promoter, and that the operator site corresponds to a short palindrome
  - statement: toxA expression is three-fold lower in a ptxR deletion.
    supporting_text: >-
      In this study we confirmed that in a ΔptxR background, expression of toxA is almost three-fold lower
      than in the parental strain, an observation which confirms the positive role of PtxR.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA source for GO:0045893, CollecTF IPI source, and seed of the PTN001248394 GO:0006355
      IBD. Full text (PMC3402500) cached and read: DNaseI footprint and ITC of PtxR on PtoxA, Pkgu and
      Pgad; PtoxA-lacZ and Pkgu-lacZ in the ptxR deletion.
- id: PMID:8843437
  title: >-
    Isolation and characterization of a Pseudomonas aeruginosa gene, ptxR, which positively regulates
    exotoxin A production.
  findings:
  - statement: PtxR is a LysR-family homolog that increases toxA and regA transcription.
    supporting_text: ptxR increases toxA and regA transcription
  - statement: The measured activity reduced in ptxR mutants is exotoxin A activity.
    supporting_text: both mutants showed a significant reduction in the level of exotoxin A activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IMP source for GO:0003950 NAD+ poly-ADP-ribosyltransferase activity. Abstract only. The
      abstract states outright that PtxR is a LysR-family transcriptional regulator and that the assay
      read out exotoxin A (an ADP-ribosyltransferase) activity in culture; the paper is right, the GO
      row transfers the target's activity to the regulator.
