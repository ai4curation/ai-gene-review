- term:
    id: GO:0003950
    label: NAD+ poly-ADP-ribosyltransferase activity
  evidence_type: IMP
  original_reference_id: PMID:8843437
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IMP row. ptxR mutants have less exotoxin A activity in culture supernatants; exotoxin
      A (ToxA) is the ADP-ribosyltransferase, and PtxR, a LysR regulator, raises toxA transcription.
    action: REMOVE
    reason: >-
      Wrong gene product for the activity: the catalytic activity belongs to the target toxin, not the
      regulator. The term is also a poly-ADP-ribosyltransferase, whereas exotoxin A is a mono-ADP-ribosyltransferase
      of EF-2. The regulatory role is already captured by GO:0045893 and GO:0001216.
    supported_by:
    - reference_id: PMID:8843437
      supporting_text: >-
        The deduced amino acid sequence of PtxR is homologous to that of several members of the LysR family
        of transcriptional activators.
    - reference_id: PMID:8843437
      supporting_text: both mutants showed a significant reduction in the level of exotoxin A activity
    - reference_id: PMID:8843437
      supporting_text: ptxR increases toxA and regA transcription
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0003950
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        PseudoCAP IMP row for PA2258/ptxR, GO:0003950 NAD+ poly-ADP-ribosyltransferase activity, from
        PMID:8843437 (Hamood et al. 1996). The abstract states that PtxR is a LysR-family transcriptional
        activator and that ptxR mutants show reduced exotoxin A activity, with ptxR increasing toxA and
        regA transcription. The ADP-ribosyltransferase activity measured is that of exotoxin A (ToxA,
        PA1148), not of PtxR. Requested change: delete the row; the regulatory role is already annotated
        as GO:0045893 (IDA, PMID:22844393).
      supported_by:
      - reference_id: PMID:8843437
        supporting_text: >-
          The deduced amino acid sequence of PtxR is homologous to that of several members of the LysR
          family of transcriptional activators.
      - reference_id: PMID:8843437
