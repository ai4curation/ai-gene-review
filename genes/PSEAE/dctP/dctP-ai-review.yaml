id: Q9HU18
gene_symbol: dctP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  DctP (PA5167) is the periplasmic substrate-binding protein (extracytoplasmic
  solute receptor) of DctPQM, a tripartite ATP-independent periplasmic (TRAP)
  transporter of Pseudomonas aeruginosa. It belongs to the TRAP DctP family
  (bacterial solute-binding protein 7 family), has a cleavable signal peptide,
  and captures substrate in the periplasm for delivery to the membrane
  permeases DctQ and DctM. DctPQM imports the C4-dicarboxylates succinate,
  fumarate and malate, and is the high-affinity system that dominates succinate
  uptake at micromolar concentrations, alongside the low-affinity DctA carrier.
  Expression of dctPQM is induced by C4-dicarboxylates and depends on RpoN and
  the DctB/DctD two-component system. A crystal structure of the mature protein
  has been deposited (PDB 9DY3).
