    summary: >-
      IBA from PTN002121312, whose IBD rests solely on DctP's own PseudoCAP
      IMP. True for DctP, whose specific substrates and direction are known.
    action: MODIFY
    reason: >-
      DctP in its own WITH/FROM marks its experimental seed and is expected.
      The node is a DctP-family TRAP binding-protein clade of 9 leaves in 5
      taxa (P. aeruginosa DctP and its paralogs PA0884 and PA4616; three
      Bradyrhizobium binding proteins; Shewanella and Vibrio cholerae DctP;
      and a Nematostella genome entry that is probably a bacterial
      contaminant). No leaf other than DctP has experimental annotations, and
      none contradicts the C4-dicarboxylate term. Unlike the permease case
      (DctQ, a YiaM-type clade), here the seed is the binding protein, which
      sets substrate specificity, so the node term is a reasonable clade-level
      claim, with the caveat that within-genome paralogs may have diverged.
      For DctP itself the precise terms are the substrate-specific import
      processes, as for the IMP row.
