suggested_questions:
- question: >-
    Do the DctP paralogs PA0884 and PA4616, which share node PTN002121312,
    also bind C4-dicarboxylates, or do they account for the residual,
    non-DctA non-DctPQM succinate uptake with a different specificity?
- question: >-
    Is the Nematostella vectensis entry A7T6W2 in PTN002121312 a bacterial
    contaminant of the genome assembly that should be excluded from the tree?
suggested_experiments:
- description: >-
    Isothermal titration calorimetry or tryptophan-fluorescence binding of
    purified DctP with succinate, fumarate, malate and other dicarboxylates,
    to define its specificity and affinity directly.
  experiment_type: ligand binding assay
