id: Q9I034
gene_symbol: copR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CopR (PA2809) is the cytoplasmic response regulator of the copper-responsive
  CopR-CopS two-component system of Pseudomonas aeruginosa. It is a 226-residue
  OmpR/PhoB-family protein with a receiver domain phosphorylated by the
  periplasmic-sensing kinase CopS (PA2810) and a winged-helix domain that binds
  promoter DNA; CopS also dephosphorylates CopR when copper is absent, which
  keeps the regulon off. CopR drives the transcriptional response to copper and
  is required for copper tolerance. Beyond the copper regulon it connects metal
  and antibiotic resistance - it activates the czcR-czcS operon and the czcCBA
  zinc efflux pump and represses the porin gene oprD, so increased CopR lowers
  OprD in the outer membrane and raises resistance to imipenem. CopR is closely
  related to the zinc-responsive regulator CzcR (55% identity), and the two
  systems overlap on these targets.
references:
- id: PMID:17449606
  title: A copper-activated two-component system interacts with zinc and imipenem
    resistance in Pseudomonas aeruginosa.
  findings:
  - statement: CopR negatively regulates oprD and positively regulates the czcCBA
      operon.
    supporting_text: >-
      Altogether these results show that the CopR regulator, like CzcR,
      negatively regulates oprD and positively regulates the czcCBA operon
  - statement: CopR is a new negative regulator of the OprD porin and links zinc,
      copper and imipenem resistance.
    supporting_text: >-
      This study shows that CopR is a new negative regulator of OprD porin and
      that it links Zn, Cu, and imipenem resistances by interacting with the CzcRS
      TCS.
  - statement: Direct binding of CopR to the cop box was not demonstrated; it is inferred
      from the Pseudomonas syringae CopR site.
    supporting_text: >-
      It is therefore very likely that the P. aeruginosa CopR regulator binds to
      this cop box
  - statement: CopR is 55% identical to the zinc-responsive regulator CzcR.
    supporting_text: >-
      CopR was found to display 73% similarity and 55% identity with the CzcR
      regulator, as determined by pairwise sequence alignment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. The PseudoCAP source for the GO:0045892 IDA row
      and a seed of the GO:0006355 IBD on PTN000724188. The repression of oprD is
      measured in the organism by qRT-PCR and western blot, with CopR
      overproduced in both the wild type and a czcRS deletion strain, so the
      effect is attributable to CopR. The paper does not show CopR bound to a
      promoter, which is why the DNA-binding rows here rest on family inference
      rather than on this reference.
- id: PMID:33361129
  title: The Two-Component System CopRS Maintains Subfemtomolar Levels of Free Copper
    in the Periplasm of Pseudomonas aeruginosa Using a Phosphatase-Based Mechanism.
  findings:
  - statement: The CopRS regulon is induced by external copper and is constitutively
      active when CopS is deleted, consistent with CopS controlling the phosphorylation
      state of CopR.
    supporting_text: >-
      In contrast, the ΔcopS mutant strain showed a constitutive activation of all
      the genes of the CopRS regulon, even in the absence of the Cu2+ stimulus.
  - statement: CopS is proposed to dephosphorylate CopR in the absence of copper,
      shutting down the transcriptional response.
    supporting_text: >-
      However, in the absence of Cu, CopS shuts down the transcriptional response
      to Cu+, likely dephosphorylating CopR.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Independent confirmation that CopR is the transcriptional
      output of a copper-sensing phosphorelay, which is the evidence base for the
      phosphorelay response regulator and transcription-regulation rows beyond
      family inference.
