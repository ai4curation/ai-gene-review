  - reference_id: PMID:33361129
    supporting_text: >-
      However, in the absence of Cu, CopS shuts down the transcriptional response
      to Cu+, likely dephosphorylating CopR.
suggested_questions:
- question: >-
    Does phospho-CopR bind the oprD promoter directly, or is the repression
    relayed through another regulator? The 2007 work inferred cop-box binding
    from the Pseudomonas syringae orthologue rather than demonstrating it.
- question: >-
    CopR and CzcR share 55% identity and overlapping targets. Do they bind the
    same sites, and does cross-phosphorylation between the two systems occur in
    vivo?
suggested_experiments:
- description: >-
    Define the CopR regulon and its binding sites directly - ChIP-seq or
    ChIP-exo on epitope-tagged CopR after copper exposure, with EMSA and
    footprinting of purified phospho-CopR on the oprD, czcR and copA1 promoters,
    run alongside CzcR to test site overlap.
