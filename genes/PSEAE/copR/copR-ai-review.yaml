core_functions:
- description: >-
    Response regulator of the copper-sensing CopR-CopS two-component system.
    Phosphorylated by CopS when periplasmic copper rises (and dephosphorylated
    by it when copper falls), CopR acts on chromosomal promoters in the cytosol
    to switch on the copper regulon and the czcR-czcS and czcCBA zinc-efflux
    genes and to switch off the porin gene oprD, which couples copper sensing to
    zinc and imipenem resistance.
  molecular_function:
    id: GO:0000156
    label: phosphorelay response regulator activity
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
