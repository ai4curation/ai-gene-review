gene_symbol: PA1204
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1204 is a small (185 aa) cytoplasmic flavoprotein of the SsuE/chromate reductase
  (FMN_red, PF03358) family of Pseudomonas aeruginosa. Its 1.28 A crystal structure shows
  a flavodoxin-like homodimer with a non-canonical FMN-binding motif (GSLRSGSYN), and the
  purified protein binds FMN and shows NAD(P)H-dependent FMN reductase activity. It also
  reduces quinones by a two-electron route with little semiquinone formation, placing it
  with the soluble NAD(P)H:quinone oxidoreductases (E. coli ChrR, Synechocystis ArsH,
  yeast Lot6) that are thought to protect against redox-cycling quinones; overexpression
  of the P. aeruginosa enzymes in this group gave no clear H2O2-protective phenotype
  except for the WrbA and MdaB orthologs. PA1204 lies in the pa1202-pa1205 operon that is
  strongly derepressed in bexR mutants.
