- id: PMID:24915188
  title: 'Identification of NAD(P)H quinone oxidoreductase activity in azoreductases from P. aeruginosa:
    azoreductases and NAD(P)H quinone oxidoreductases belong to the same FMN-dependent superfamily of
    enzymes.'
  findings:
  - statement: >-
      PA1204 is discussed as a putative azoreductase by structural homology; its quinone
      reductase activity is cited from other work (reference 75), not assayed here.
    supporting_text: Recent data have shown that PA0949, PA1204, PA2580 and PA4975, have NAD(P)H quinone
      oxidoreductase activities [75].
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      PseudoCAP source for IDA GO:0016655. Full text cached. The paper assays three
      azoreductases (paAzoR1-3); PA1204 appears only in the phylogeny, the structural overlay
      and a sentence citing other data for its quinone reductase activity. The activity is
      true, but this paper does not show it directly, so the IDA code is not supported by
      this reference.
- id: PMID:25085734
  title: Pseudomonas aeruginosa MdaB and WrbA are water-soluble two-electron quinone oxidoreductases
    with the potential to defend against oxidative stress.
  findings:
  - statement: Five P. aeruginosa quinone oxidoreductase orthologs reduce quinones in vitro by a two-electron
      route.
    supporting_text: In in vitro assays, each enzyme was shown to reduce quinone substrates with only minimal
      semiquinone formation.
  - statement: Only WrbA and MdaB overexpression protected a katA mutant against H2O2.
    supporting_text: in a katA mutant, H2O2 challenged strains over-expressing the WrbA and MdaB orthologs
      grew significantly better than the empty plasmid control
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP GO:0003955 row that seeds the PTN001254275 IBD. Abstract
      only (no PMC copy). The abstract does not name loci; PA1204 is identified as one of the
      enzymes with this activity by Ryan et al. 2014 (PMID:24915188). The activity was
      measured in vitro on purified enzyme, which is direct-assay (IDA) evidence rather than
      IMP.
