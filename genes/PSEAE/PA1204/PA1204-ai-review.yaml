suggested_questions:
- question: >-
    Is the physiological electron acceptor of PA1204 a quinone (for example homogentisate
    quinone or phenazines), free FMN for a partner monooxygenase, or another substrate, and
    what does the BexR-controlled pa1202-pa1205 operon do?
suggested_experiments:
- description: >-
    Steady-state kinetics of purified PA1204 with a panel of quinones, phenazines and free
    FMN, plus phenotyping of a PA1204 deletion (with and without katA) under quinone and
    H2O2 challenge.
  experiment_type: enzyme kinetics and mutant phenotyping
