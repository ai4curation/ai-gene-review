id: Q9I2B1
gene_symbol: dhcR
product_type: PROTEIN
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
status: COMPLETE
description: >-
  DhcR (PA1998) is a LysR-family transcriptional regulator that switches on part of the carnitine
  catabolic pathway of Pseudomonas aeruginosa. It is required for growth on carnitine, and for the
  induction of the adjacent PA1999-PA2000 operon encoding the two subunits of a predicted
  3-ketoacid CoA-transferase, the step that deacetylates the carnitine intermediate
  3-dehydrocarnitine. The inducing signal appears to be a downstream catabolite rather than
  carnitine itself, which fits the architecture of a LysR regulator carrying a C-terminal
  effector-binding domain alongside its helix-turn-helix DNA-binding domain. It is one of two
  regulators the pathway needs, the other, PA5389, controlling a separate block of carnitine genes.
