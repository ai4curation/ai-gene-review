      to depend on a carnitine catabolite, possibly 3-dhc
  knowledge_gaps:
  - gap_statement: >-
      The inducing ligand is not identified. The paper infers that induction depends on a carnitine
      catabolite and names 3-dehydrocarnitine as a candidate, hedged as "possibly", so the signal
      this regulator senses, and therefore what the LysR effector-binding domain binds, is unknown.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Where the protein binds is unmapped. Induction of PA1999-PA2000 is DhcR-dependent, but no
      operator has been located and no direct binding to that promoter has been shown, so whether
      the regulator acts at that promoter itself or further upstream is open.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Is 3-dehydrocarnitine the inducer? The candidate is testable directly, by supplying it to cells
    unable to make it and asking whether the PA1999-PA2000 transcripts still rise.
- question: >-
    Why does the pathway need two regulators? PA5389 controls the PA5388-PA5384 block and DhcR
    controls PA1999-PA2000, and whether they respond to different intermediates — which would make
    the split a sequential check on pathway progress — or simply partition the genes is unresolved.
- question: >-
    Does DhcR regulate anything else? It is characterised only through one operon, and a LysR
    regulator with a single target would be unusual.
suggested_experiments:
- description: >-
    Locate the operator by DNase I footprinting or EMSA with purified DhcR on the PA1999-PA2000
    promoter region, with and without candidate effectors, which would establish direct binding and
    identify the ligand in one experiment.
- description: >-
    Define the regulon by ChIP-seq or by RNA-seq of a dhcR deletion grown on carnitine, to test
    whether the single known target is the whole of it.
- description: >-
    Supply 3-dehydrocarnitine exogenously to a strain blocked upstream of its synthesis and measure
    PA1999-PA2000 induction, separating the inducer's identity from the pathway flux that normally
    produces it.
