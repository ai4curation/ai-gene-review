      reference_section_type: ABSTRACT
      supporting_text: >-
        The second region identified, PA1999-PA2000, encodes the alpha and beta subunits of a
        predicted 3-ketoacid CoA-transferase, an enzymic activity hypothesized to be involved in
        the first step of deacetylation of 3-dhc.
    - reference_id: PMID:19406895
      reference_section_type: ABSTRACT
      supporting_text: >-
        The PA5389 and PA1998 transcription factors are required for growth on carnitine.
