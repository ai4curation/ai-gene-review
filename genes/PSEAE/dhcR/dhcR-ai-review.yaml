core_functions:
- description: >-
    LysR-family activator of carnitine catabolism: acts through sequence-specific DNA binding to
    induce the operon encoding the 3-ketoacid CoA-transferase subunits, apparently in response to a
    carnitine catabolite rather than to carnitine itself, so that the deacetylation step is made
    only once the pathway upstream of it is running. Induction of PA1999-PA2000 is DhcR-dependent,
    but the operator has not been mapped and binding at that promoter has not been shown, so
    whether the regulator acts there or further upstream is open.
