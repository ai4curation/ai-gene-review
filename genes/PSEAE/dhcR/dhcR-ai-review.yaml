- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: IMP
  original_reference_id: PMID:19406895
  qualifier: enables
  review:
    summary: >-
      The gene's core molecular function, from a transposon screen plus transcript measurements
      that show its target operon is not induced without it.
    action: ACCEPT
    reason: >-
      Supported by the kind of experiment the evidence code names. Loss of the gene abolishes
      growth on carnitine, and the transcripts of the PA1999-PA2000 operon are induced only when
      the gene is present, so the protein acts on transcription of a defined target rather than on
      the metabolism itself. The family placement agrees: the record matches the LysR
      helix-turn-helix and substrate-binding signatures, an architecture that couples DNA binding
      to effector recognition, which is consistent with the paper's inference that a pathway
      catabolite is the inducer. Accepted as core.
    supported_by:
