  review:
    summary: >-
      Propagation of the DNA-binding property from a node seeded by characterised LysR regulators.
    action: ACCEPT
    reason: >-
      Sound and more informative than the bare DNA-binding term: a transcription factor that
      induces one named operon and not the genome at large must recognise a sequence. The donors
      are E. coli LysR-family regulators, and the target gene sits in the same family by two
