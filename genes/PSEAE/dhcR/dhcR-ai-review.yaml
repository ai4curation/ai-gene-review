- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000400807
  review:
    summary: >-
      A keyword-derived row that asserts the regulator transcribes DNA. The essence — that the
      protein acts on transcription — is right; the term names the wrong participant.
    action: MODIFY
    reason: >-
      GO:0006351 is the synthesis of RNA from a DNA template, which RNA polymerase performs. A
      transcription factor governs whether that happens; it does not do it. This is the
      participation test: being required for a process, or acting on the machinery that carries it
      out, is not performing it. Two things were checked rather than assumed. First, the two terms
      are not parent and child — OLS confirms GO:0006355 is not a descendant of GO:0006351, since
      regulation terms do not sit beneath the processes they regulate — so this is a distinct and
      wrong claim rather than a general version of a correct one, which is why TOO_GENERAL does not
      apply. Second, this repository already has a dominant handling for this legacy row: of 168
      GO:0006351 rows in the corpus, 62 are MODIFY and their replacements are regulation terms,
      so the established reading is that the row's intent was "acts on transcription" and the fix
      is to say which way. The replacement here is the unsigned GO:0006355 rather than the positive
      term, because this row's own evidence is a LysR-family UniRule, which supports "regulator"
      but says nothing about direction; the direction is established by the paper, on other rows.
      No signed transcription row is proposed to carry it. GO:0045893 positive regulation of
      DNA-templated transcription would be squarely supported by the induction experiment, but it
      is a descendant of the GO:0006355 this gene already carries, and the standing rule on NEW
      rows rejects a term that is an ancestor or descendant of one the gene carries as redundancy
      rather than added coverage. The sign is therefore carried by the GO:0009896 row, whose
      evidence is the same experiment.
    proposed_replacement_terms:
    - id: GO:0006355
      label: regulation of DNA-templated transcription
- term:
    id: GO:0009896
    label: positive regulation of catabolic process
  evidence_type: IMP
  original_reference_id: PMID:19406895
  qualifier: involved_in
  review:
    summary: >-
      The sign and the object of the regulation, from the induction experiment. Coarse, but the
      most specific term GO offers for it.
    action: ACCEPT
    reason: >-
      Accepted, and kept at this level because nothing better exists rather than because nothing
      better is warranted. The direction is established: the target operon's transcripts are
      induced only in the presence of this gene, so the regulation is positive, and the operon
      encodes an enzyme of carnitine catabolism, so the process regulated is a catabolic one. What
      the gene actually does is positively regulate carnitine catabolism; GO:0042413 carnitine
      catabolic process exists, but a search finds no regulation-of-carnitine-catabolism term — the
      only carnitine regulation terms are for transmembrane transport. So this term is the most
      informative available, it is not entailed by anything more specific asserted here, and a new
      term is deliberately not proposed, since GO does not mint a regulation term for every
      pathway and the shortfall is ordinary coarseness rather than a missing concept.
    supported_by:
