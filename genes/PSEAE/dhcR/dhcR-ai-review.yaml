  title: Identification of genes required for Pseudomonas aeruginosa carnitine catabolism.
  findings:
  - statement: >-
      The gene is required for growth on carnitine, and the authors class it as a transcription
      factor on that basis together with the transcript work below.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The PA5389 and PA1998 transcription factors are required for growth on carnitine.
  - statement: >-
      The regulator is required for induction of its target operon, which establishes the sign of
      the regulation as positive, and implicates a pathway catabolite rather than carnitine as the
      inducer.
    reference_section_type: ABSTRACT
    supporting_text: >-
      the PA1999-PA2000 transcripts are induced in a PA1998-dependent manner and induction appears
      to depend on a carnitine catabolite, possibly 3-dhc
  - statement: >-
      The target operon encodes an enzyme of the pathway, which is what ties the regulator's
      activity to carnitine catabolism specifically.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The second region identified, PA1999-PA2000, encodes the alpha and beta subunits of a
      predicted 3-ketoacid CoA-transferase, an enzymic activity hypothesized to be involved in the
      first step of deacetylation of 3-dhc.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Wargo & Hogan 2009, Microbiology). Abstract-only in the cache, but it names
      the locus, states that it is required for growth on carnitine, and reports the
      PA1998-dependent induction of a named target operon, so both annotated rows can be checked
      without the full text. The screen was done in strain PA14 while the annotation is on the PAO1
      locus; recorded rather than acted on, since the gene is present in both.
