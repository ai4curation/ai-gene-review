id: Q9I296
gene_symbol: liuA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  liuA (PA2015) encodes isovaleryl-CoA dehydrogenase, the first gene of the liuRABCDE (leucine and
  isovalerate utilization) cluster of Pseudomonas aeruginosa. LiuA is a FAD-dependent member of the
  acyl-CoA dehydrogenase family that oxidises isovaleryl-CoA (3-methylbutanoyl-CoA) to 3-methylcrotonyl-CoA,
  the first of three steps converting isovaleryl-CoA to 3-hydroxy-3-methylglutaryl-CoA in leucine
  catabolism. The purified recombinant enzyme uses isovaleryl-CoA with a Km of 2.3 microM and also
  butyryl-CoA, but not isobutyryl-CoA, octanoyl-CoA or the terpene-derived acyl-CoAs citronellyl-CoA and
  5-methylhex-4-enoyl-CoA. liuA insertion mutants cannot grow on leucine or isovalerate and, like mutants
  in the other liu genes, also fail to grow on acyclic terpenes such as citronellol, whose Atu pathway
  joins the Liu pathway at 3-methylcrotonyl-CoA.
