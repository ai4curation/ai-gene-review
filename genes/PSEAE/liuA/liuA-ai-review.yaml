- id: PMID:18625020
  title: Biochemical characterization of isovaleryl-CoA dehydrogenase (LiuA) of Pseudomonas 
    aeruginosa and the importance of liu genes fora functional catabolic pathway of methyl-branched 
    compounds.
  findings:
  - statement: Purified recombinant LiuA is an isovaleryl-CoA dehydrogenase that also uses 
      butyryl-CoA.
    supporting_text: LiuA purified from recombinant E. coli revealed acyl-CoA dehydrogenase activity
      with isovaleryl-CoA (KM 2.3 microM) and butyryl-CoA as substrates
  - statement: Insertion mutants in every liu gene fail to grow on leucine, isovalerate or acyclic 
      terpenes, and the liuA mutant is complemented in trans.
    supporting_text: Mutants with insertion in any of the liu genes were unable to utilize acyclic 
      terpenes or leucine/isovalerate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed abstract checked; direct biochemistry and genetics on this protein.
- id: PMID:16272386
  title: Methylcrotonyl-CoA and geranyl-CoA carboxylases are involved in leucine/isovalerate 
    utilization (Liu) and acyclic terpene utilization (Atu), and are encoded by liuB/liuD and 
    atuC/atuF, in Pseudomonas aeruginosa.
  findings:
  - statement: The Atu pathway joins the Liu pathway at methylcrotonyl-CoA, downstream of LiuA.
    supporting_text: The catabolic pathway of citronellol (Atu, acyclic terpene utilization) enters 
      that of leucine/isovalerate (Liu, leucine and isovalerate utilization) at the level of 
      methylcrotonyl-CoA.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; defines where the terpene route meets the Liu pathway.
