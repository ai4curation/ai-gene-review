suggested_questions:
- question: >-
    Why does a complemented liuA mutant fail to grow on acyclic terpenes, when the Atu pathway is thought
    to join the Liu pathway at 3-methylcrotonyl-CoA, downstream of LiuA, and LiuA does not oxidise the
    terpene-derived acyl-CoAs tested?
suggested_experiments:
- description: >-
    Profile acyl-CoA intermediates in a liuA mutant grown on citronellol (with an alternative carbon source)
    and test purified LiuA against other terpene-derived acyl-CoAs, to find whether LiuA catalyses an
    unrecognised step of the Atu pathway.
