  label: Pseudomonas aeruginosa PAO1
description: LiuA (PA2015) is the isovaleryl-CoA dehydrogenase of the leucine/isovalerate 
  utilization (Liu) pathway of Pseudomonas aeruginosa. It is an FAD-dependent acyl-CoA dehydrogenase
  that oxidizes 3-methylbutanoyl-CoA (isovaleryl-CoA) to 3-methylcrotonyl-CoA, the substrate of the 
  LiuB/LiuD methylcrotonyl-CoA carboxylase. The purified recombinant enzyme has a low-micromolar Km 
  for isovaleryl-CoA and also oxidizes butyryl-CoA, but not isobutyryl-CoA, octanoyl-CoA or the 
  acyclic-terpene intermediates citronellyl-CoA and 5-methyl-hex-4-enoyl-CoA. liuA insertion mutants
  cannot grow on leucine or isovalerate, and also fail to grow on acyclic terpenes, a requirement 
  whose biochemical basis is unexplained because the terpene route enters the Liu pathway downstream
  of LiuA.
