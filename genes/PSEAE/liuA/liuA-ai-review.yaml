  review:
    summary: PseudoCAP IMP linking LiuA to acyclic isoprenoid (monoterpene) catabolism.
    action: UNDECIDED
    reason: Mutant evidence shows liuA is required for growth on acyclic terpenes, and a 
      complemented liuA mutant in PMID:18625020 argues against a purely polar effect. But 
      requirement is not participation, the Atu route enters the Liu pathway at methylcrotonyl-CoA 
      (downstream of LiuA), and purified LiuA did not oxidize citronellyl-CoA or 
      5-methyl-hex-4-enoyl-CoA. Which terpene-pathway step, if any, LiuA performs is unknown, and 
      the full text of PMID:16517656 was not available, so the row is left undecided rather than 
      accepted or removed.
    supported_by:
