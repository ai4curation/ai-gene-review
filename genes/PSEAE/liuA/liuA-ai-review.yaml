    id: GO:0008300
    label: isoprenoid catabolic process
  evidence_type: IMP
  original_reference_id: PMID:16517656
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP: the atu and liu clusters are both needed for growth on acyclic monoterpenes of the
      citronellol family. Not an IBD seed.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Abstract only. The liu cluster is needed for terpene growth, and a complemented liuA mutant fails to
      grow on terpenes (PMID:18625020). But the Atu pathway enters the Liu pathway at 3-methylcrotonyl-CoA,
      the product of LiuA, and purified LiuA does not oxidise the terpene-derived acyl-CoAs tested. On the
      present pathway, LiuA performs no step of terpene catabolism, and the growth defect is unexplained
      necessity, not demonstrated participation. Contrast liuC and liuE, which act downstream of the entry
      point and were kept (MODIFY to GO:0016100 and TOO_GENERAL respectively) in their reviews.
    supported_by:
    - reference_id: PMID:18625020
      supporting_text: >-
        Other acyl-CoA compounds such as isobutyryl-CoA, 3-hydroxybutyryl-CoA, octanoyl-CoA, citronellyl-CoA
        or 5-methyl-hex-4-enoyl-CoA were not utilized.
    - reference_id: PMID:16272386
      supporting_text: >-
