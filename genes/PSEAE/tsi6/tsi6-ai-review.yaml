  label: Pseudomonas aeruginosa PAO1
description: 'Tsi6 (PA0092) is the cognate immunity protein of the H1-type VI secretion system effector
  Tse6 in Pseudomonas aeruginosa. It is a small cytoplasmic protein encoded immediately downstream
  of tse6 in a bicistron, the arrangement shared by the other tse-tsi effector-immunity pairs of this
  system. Tse6 is an NAD(P)+ glycohydrolase toxin delivered into neighbouring cells, and Tsi6 binds
  it to neutralise its activity, which protects sibling cells from intoxication by their own secreted
  effector during contact-dependent competition. The protection is specific: co-expressing Tsi6 rescues
  cells from the Tse6 toxin domain whereas the non-cognate immunity protein Tsi2 does not. Toxin sequestration
  is what Tsi6 does; it is not part of the secretion machinery.'
