  review:
    summary: Protein secretion by the T6SS, asserted on the immunity protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Tsi6 is the cytoplasmic immunity determinant of the pair, not part of the secretion machinery:
      the paper describes it as a small ORF encoding a protein with predicted cytoplasmic localization
      and tests it as a PA0093-specific immunity determinant, and its demonstrated activity is rescuing
      cells from Tse6 toxicity. The row appears to come from the pair-level competition experiment
      that established tse6-tsi6 as an effector-immunity pair, which shows that tsi6 is required for
      the outcome of those competitions without showing that it does any of the work of protein secretion.
      By the project rule on involved_in, being required for a process is not participating in it.
      Marked over-annotated rather than removed: tsi6 is genuinely part of the H1-T6SS locus and a
      secretion-related role cannot be excluded from what is reported here.'
