    action: ACCEPT
    reason: 'Correct, and this is the gene''s core function. The term is defined as binding a toxin
      to prevent it acting, and the paper shows exactly that with the specificity control that matters:
      co-expression of Tsi6, but not of the non-cognate immunity protein Tsi2, gave full rescue of
      cells expressing the Tse6 toxin domain. The same term is annotated to the effector tse6 from
      the same paper, where it inverts the relationship; that row is recommended for deletion in the
      tse6 review, and this is the entry it belongs to.'
