suggested_questions:
- question: Does Tsi6 neutralise Tse6 by occluding its NAD(P)+ glycohydrolase active site, or by binding
    elsewhere and preventing its delivery or folding? The rescue experiments show specific neutralisation
    but not the mechanism, and the answer would also say whether GO:0097351 or an enzyme-inhibitor
    term is the better description.
