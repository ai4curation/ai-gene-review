taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WaaF (RfaF) is the lipopolysaccharide heptosyltransferase II of Pseudomonas aeruginosa, a 345-residue
  glycosyltransferase family 9 enzyme that transfers the second L-glycero-D-manno-heptose from
  ADP-heptose to the heptosyl-Kdo2-lipid A made by WaaC, completing the heptose backbone of the inner core
  oligosaccharide. The PAO1 gene restores smooth LPS to a Salmonella waaF mutant, and chromosomal null
  mutants could not be isolated in P. aeruginosa. waaF lies next to waaC in the PAO1 genome.
