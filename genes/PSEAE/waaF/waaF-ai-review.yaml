- id: PMID:9171387
  title: Isolation and characterization of two genes, waaC (rfaC) and waaF (rfaF),
    involved in Pseudomonas aeruginosa serotype O5 inner-core biosynthesis.
  findings:
  - statement: PAO1 waaF complements a Salmonella waaF mutant.
    supporting_text: Similarly, plasmid pCOREf1 was able to complement the Salmonella waaF mutant.
  - statement: The predicted WaaF protein is 49% identical to Salmonella WaaF.
    supporting_text: >-
      The sequence of the predicted protein was 49% identical to the sequence of the Salmonella WaaF
      protein.
  - statement: Chromosomal waaC and waaF null mutants could not be obtained in P. aeruginosa.
    supporting_text: >-
      Despite multiple attempts to isolate true knockout mutants, all transconjugants were identified as
      merodiploids.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (de Kievit and Lam 1997, J Bacteriol; PMC179135). Abstract read; no full-text XML
      obtainable. Reports heterologous complementation, sequence identity, maxicell expression and failed
      knockouts; no in vitro transferase assay is described. Source of the PseudoCAP IDA GO:0009244 row
      that seeds PTN001575314 and of the ISS GO:0071968 row.
