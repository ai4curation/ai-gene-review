suggested_questions:
- question: >-
    Is waaF essential in PAO1, and does its loss (a heptose-deficient core) compromise outer membrane
    integrity as in enteric bacteria?
suggested_experiments:
- description: >-
    In vitro heptosyltransferase II assay with purified WaaF, ADP-heptose and heptosyl-Kdo2-lipid A, and
    conditional depletion of waaF in PAO1 with LPS core analysis by MS.
