- term:
    id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:9171387
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row and a seed of the PTN001575314 IBD. The PAO1 gene complements a Salmonella waaF
      mutant.
    action: ACCEPT
    reason: >-
      Heterologous complementation of a heptosyltransferase II mutant places WaaF in inner-core assembly.
      The evidence is genetic, so the IDA code is probably wrong; recorded as a suspected defect, as for
      waaC. The term is sound.
    supported_by:
    - reference_id: PMID:9171387
      supporting_text: Similarly, plasmid pCOREf1 was able to complement the Salmonella waaF mutant.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      corrected_value: ECO:0000316
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        The abstract of PMID:9171387 reports cloning of waaF by complementation of a Salmonella waaF
        mutant, sequence identity, maxicell expression and failed chromosomal knockouts; no direct assay of
        WaaF is described. IGI (or IMP) looks like the right code. Only the abstract was read, hence
        SUSPECTED and CHECK. Same issue on the waaC (PA5011) row from this paper.
- term:
    id: GO:0071968
    label: lipid A-core heptosyltransferase activity
  evidence_type: ISS
  original_reference_id: PMID:9171387
  qualifier: enables
  supporting_entities:
  - UniProtKB:P37421
  review:
    summary: >-
      PseudoCAP ISS from Salmonella WaaF (P37421). GO:0071968 names the reaction that completes lipid
      A-core, not the second inner-core heptose transfer.
    action: MODIFY
    reason: >-
      The with/from protein is heptosyltransferase II, whose reaction is exactly GO:0008713, already carried
      and accepted for this gene.
    proposed_replacement_terms:
    - id: GO:0008713
      label: ADP-heptose-lipopolysaccharide heptosyltransferase activity
    supported_by:
    - reference_id: file:PSEAE/waaF/waaF-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; TIGR02195; heptsyl_trn_II; 1.
    - reference_id: PMID:9171387
      supporting_text: Similarly, plasmid pCOREf1 was able to complement the Salmonella waaF mutant.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0071968
      corrected_value: GO:0008713
      corrected_label: ADP-heptose-lipopolysaccharide heptosyltransferase activity
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        GO:0071968 lipid A-core heptosyltransferase activity is defined with a
        galactosyl-glucosyl3-heptosyl3-KDO2-lipid A-bisphosphate acceptor. The with/from protein, Salmonella
        WaaF (P37421), is heptosyltransferase II (EC 2.4.99.24), whose reaction (heptosyl-Kdo2-lipid A
        acceptor) is GO:0008713. The same wrong term was used on waaC (PA5011).
