suggested_questions:
- question: >-
    GO:0015344 siderophore uptake transmembrane transporter activity is defined by a proton-coupled ferrioxamine
    symport reaction (TC 2.A.1.16), yet it is the standard term for TonB-dependent outer-membrane receptors.
    Should GO provide a TonB-dependent siderophore receptor activity term or broaden the definition?
suggested_experiments:
- description: >-
    Measure 55Fe-aerobactin uptake and aerobactin binding by purified ChtA, to add biochemical evidence
    to the genetic data.
