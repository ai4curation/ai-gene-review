- term:
    id: GO:0038023
    label: signaling receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010105
  review:
    summary: >-
      InterPro2GO signaling receptor activity from the TonB-dependent siderophore receptor signature.
    action: REMOVE
    reason: >-
      The mapping is wrong for this member. Signalling TonB-dependent receptors (transducers such as FpvA
      or FecA) carry an N-terminal signalling extension of about 70 residues before the plug, which contacts
      an anti-sigma factor in the periplasm; this protein has only a signal peptide followed directly
      by the plug domain, so it is a receptor-transporter, not a signalling receptor. Same decision as
      for PfeA.
    supported_by:
    - *id005
    - reference_id: file:PSEAE/PA4675/PA4675-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: PF07715; Plug
