  label: Pseudomonas aeruginosa PAO1
description: >-
  ChtA (PA4675) is a TonB-dependent outer-membrane receptor of Pseudomonas aeruginosa PAO1 for the citrate-hydroxamate
  xenosiderophores aerobactin, rhizobactin 1021 and schizokinen. It has the 22-strand beta-barrel and
  N-terminal plug domain of the TonB-dependent receptor family and imports the iron-loaded siderophores
  across the outer membrane using energy supplied by the TonB1 system. Unlike many other P. aeruginosa
  xenosiderophore pathways, use of these three siderophores depends on ChtA alone. chtA is preceded by
  a Fur box and is repressed by Fur under iron-replete conditions.
