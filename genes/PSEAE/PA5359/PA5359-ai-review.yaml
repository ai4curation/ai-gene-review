      IBA from PTN002217427, the root of PTHR39335: seven leaves in five
      organisms, all small lipoprotein-repeat proteins, including two
      Streptomyces coelicolor lipoproteins, Gloeobacter glr0303, two
      Bradyrhizobium proteins and a tomato protein. The IBD is sole-seeded by
      this gene's PseudoCAP IMP row, whose supporting paper could not be read.
      GOA holds 764 rows with this node in with/from, 757 of them from
      TreeGrafter.
    action: UNDECIDED
    reason: >-
      The transfer cannot be endorsed and the underlying seed cannot be
      checked. Alkane catabolism requires an alkane hydroxylase with its
      rubredoxin and rubredoxin reductase partners; no member of this family
      has such a component, and the family spans actinobacteria, a
      cyanobacterium, an alphaproteobacterium and a flowering plant, so the
      process cannot be shared by descent. The right remedy is at the node, so
      a GO_CENTRAL defect is filed rather than a removal argued from an
      abstract we could not get behind.
