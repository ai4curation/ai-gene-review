- term:
    id: GO:0043448
    label: alkane catabolic process
  evidence_type: IMP
  original_reference_id: PMID:14574114
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP, the sole seed of the PTN002217427 IBD. The paper is Smits
      et al. 2003 on alkane oxidation in P. aeruginosa. It is not in PubMed
      Central and only the abstract is cached, so the experiment behind this
      row could not be read. The abstract describes AlkB1, AlkB2, RubA1, RubA2
      and RubB, which are PA2574, PA1525, PA5351, PA5350 and PA5349; it does
      not mention PA5359, a 151-residue predicted lipoprotein lying between
      ubiA and phoB. A QuickGO query by reference shows this is the only
      annotation in GOA keyed to the paper, while the five genes it does
      describe carry GO:0043448 from UniProt keyword mapping instead.
    action: UNDECIDED
    reason: >-
      The full text was not accessible, and an experimental annotation is not
      overturned from an abstract. The circumstantial case for a locus-tag slip
      is strong enough to query but not to assert: PA5349 (rubB/alkT) differs
      by one digit, is in the paper, and would fit the evidence, whereas PA5359
      has no component of an alkane oxidation system. Recorded as a SUSPECTED
      source defect for PseudoCAP to check against the full text.
    supported_by:
    - reference_id: PMID:14574114
      supporting_text: >-
        Heterologous expression showed that the two alkane hydroxylase homologs
        of P. aeruginosa PAO1 (AlkB1 and AlkB2) oxidize C(12)-C(16)n-alkanes,
        while two rubredoxin (RubA1 and RubA2) and a rubredoxin reductase
        (RubB) homologs can replace their P. putida GPo1 counterparts in
        n-octane oxidation.
    - reference_id: file:PSEAE/PA5359/PA5359-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: 'FT   SIGNAL          1..45'
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: PSEUDOCAP
      slot: DB_Object_ID
      requested_change: CHECK
      asserted_value: UniProtKB:Q9HTJ9
      corrected_value: UniProtKB:Q9HTK9
      corrected_label: rubB / alkT (PA5349), rubredoxin-NAD(+) reductase
      cause: IDENTIFIER_TRANSPOSITION
      confidence: SUSPECTED
      explanation: >-
        PseudoCAP annotates PA5359 (UniProtKB:Q9HTJ9) with GO:0043448 alkane
        catabolic process, IMP, from PMID:14574114 (Smits, Witholt & van
        Beilen 2003). Three things suggest the locus tag may be wrong, and we
        ask PseudoCAP to check against the full text, which is not publicly
        accessible to us. (1) The paper's abstract characterises AlkB1, AlkB2,
        RubA1, RubA2 and RubB, which in PAO1 are PA2574, PA1525, PA5351, PA5350
        and PA5349; PA5359 is not among them. (2) PA5359 is a 151-residue
        protein consisting of a signal peptide and two Lipoprotein_15 repeats
        (Pfam PF03640), with no hydroxylase, rubredoxin or flavoprotein
        reductase component, and UniProt gives it no function, location or
        family statement. (3) This is the only annotation in GOA keyed to this
        reference, while the five genes the paper does describe carry
        GO:0043448 from UniProt keyword mapping (GO_REF:0000041) rather than
        from the paper. PA5349 (rubB/alkT, UniProtKB:Q9HTK9) differs from
        PA5359 by one digit and would fit the evidence. If the row is in fact
        correct for PA5359, the supporting experiment would be valuable to
        record, since the row is the sole seed of the PAINT IBD at
        PTN002217427, from which 764 GOA rows descend.
      supported_by:
      - reference_id: PMID:14574114
        supporting_text: >-
          Heterologous expression showed that the two alkane hydroxylase
          homologs of P. aeruginosa PAO1 (AlkB1 and AlkB2) oxidize
          C(12)-C(16)n-alkanes, while two rubredoxin (RubA1 and RubA2) and a
          rubredoxin reductase (RubB) homologs can replace their P. putida GPo1
          counterparts in n-octane oxidation.
suggested_questions:
- question: >-
    Does the full text of PMID:14574114 contain any experiment on PA5359, or is
    the PseudoCAP row a locus-tag slip for PA5349 (rubB/alkT)?
- question: >-
    What does PA5359 actually do? It is a conserved, signal-peptide-bearing
    lipoprotein-repeat protein with no curated function, and the family
    (PTHR39335) is uncharacterised throughout.
suggested_experiments:
- description: >-
    Delete PA5359 in PAO1 and test growth on C12-C16 n-alkanes and on hexadecane
    as sole carbon source, beside alkB1, alkB2 and rubB deletions, and localise
    a tagged copy by membrane fractionation and Triton X-114 partitioning. This
    would settle whether the organism's alkane phenotype involves this gene at
    all and would give the family its first functional anchor.
