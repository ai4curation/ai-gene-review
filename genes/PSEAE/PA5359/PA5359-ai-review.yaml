  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5359 encodes a small, uncharacterised 151-residue protein of Pseudomonas
  aeruginosa PAO1 with an N-terminal signal peptide and two copies of the
  Lipoprotein_15 repeat (Pfam PF03640, InterPro IPR005297), placing it in a
  family of predicted bacterial lipoproteins that also has members in
  Streptomyces, Gloeobacter, Bradyrhizobium and plants. The protein has no
  recognisable catalytic domain, metal site or redox cofactor, and UniProt
  gives it no curated function, subcellular location or family statement; its
  "Lipoprotein" name comes from an automatic naming model. The locus lies
  between ubiA (PA5358) and phoB (PA5360), and is not part of the
  alkB1/alkB2/rubA1/rubA2/rubB system that carries out alkane oxidation in this
  organism. No publication accessible for this review describes an experiment
  on PA5359 itself, so its biological role remains unknown.
