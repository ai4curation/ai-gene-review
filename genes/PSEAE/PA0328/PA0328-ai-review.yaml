- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0015474
  review:
    summary: >-
      Computed from the accepted autotransporter activity. Checked against the participation test
      rather than accepted because the inference is automatic.
    action: KEEP_AS_NON_CORE
    reason: >-
      The claim holds, and it is worth saying why, because "a protein that transports itself" looks
      like the necessity-versus-participation case the project rules warn about. It is not one. The
      definition of the GO:0015474 activity this row is computed from puts the work in the gene
      product: the C-terminal porin is the translocator and the N-terminal passenger is the
      substrate, both being regions of this polypeptide. So the protein performs the translocation
      rather than merely being required for one its partners carry out, and a passenger crossing
      the outer membrane is a real transmembrane transport event. The unusual part is only that
      transporter and cargo are one chain, which the term's own definition anticipates.
      Non-core rather than core: the transport is in the service of presenting the peptidase on the
      surface, and it moves one substrate once - this protein is not a transporter of the cell's
      metabolites. The peptidase activity and the surface display are what the protein is for.
    supported_by:
    - reference_id: file:PSEAE/PA0328/PA0328-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: 'FT   DOMAIN          344..647'
core_functions:
- description: >-
    Surface-exposed arginine aminopeptidase: the autotransporter passenger domain carries an M28
    co-catalytic metal centre and removes amino-terminal arginine from peptides outside the cell,
    which is how the organism uses peptides bearing an N-terminal arginine as a carbon and nitrogen
    source. The catalytic domain remains attached to the outer membrane after translocation and
    faces the cell exterior, so the reaction happens on extracellular substrate without the enzyme
    being released.
  molecular_function:
    id: GO:0070006
    label: metalloaminopeptidase activity
  directly_involved_in:
  - id: GO:0006508
    label: proteolysis
  locations:
  - id: GO:0019867
    label: outer membrane
  supported_by:
  - reference_id: PMID:22927813
    reference_section_type: DISCUSSION
    supporting_text: >-
      AaaA is an AT that is tethered to the surface of P. aeruginosa and specifically removes amino
      terminal arginine from peptides.
  - reference_id: PMID:22927813
    reference_section_type: RESULTS
    supporting_text: >-
      when the peptide Arg-Gly-Asp was included in MMP as the sole source of carbon and nitrogen,
      the ΔaaaA mutant could not grow although the wild type P. aeruginosa PAO1 grew well
  knowledge_gaps:
  - gap_statement: >-
      The physiological substrates are unknown. The decisive growth experiment used Arg-Gly-Asp, a
      defined reagent, so which host or environmental peptides the enzyme actually trims during an
      infection, and whether it prefers particular residues after the arginine, has not been
      determined.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Where the liberated arginine goes is unresolved. The bacterium can use it as a nitrogen
      source, but host nitric oxide synthase competes for the same substrate, and which fate
      dominates in an infected wound - and therefore whether the enzyme helps the pathogen by
      feeding it or by depleting the host's arginine - has not been measured.
    gap_kind:
    - BIOLOGY
- description: >-
    Self-translocation across the outer membrane: the C-terminal beta-barrel inserts into the outer
    membrane and threads its own N-terminal passenger domain from the periplasm to the cell
    surface. Transporter and cargo are regions of one polypeptide, so the protein performs this
    transport rather than being a substrate of someone else's, and the product is the displayed
    peptidase of the core function above.
  molecular_function:
    id: GO:0015474
    label: autotransporter activity
  locations:
  - id: GO:0019867
    label: outer membrane
  supported_by:
  - reference_id: PMID:22927813
    reference_section_type: DISCUSSION
    supporting_text: >-
      Clearly AaaA is located on the surface of P. aeruginosa, probably by virtue of its AT domain,
      and has arginine-specific aminopeptidase activity that can be used to release arginine to
      provide a growth fitness advantage.
  - reference_id: file:PSEAE/PA0328/PA0328-uniprot.txt
    record_section: ["DR:PROSITE"]
    supporting_text: 'DR   PROSITE; PS51208; AUTOTRANSPORTER; 1.'
  knowledge_gaps:
  - gap_statement: >-
      How the passenger is retained after translocation is not established. Autotransporter
      passengers are variously released by cleavage or kept attached, and this one stays on the
      surface, but no cleavage site, retention motif or partner has been identified that explains
      why.
    gap_kind:
    - BIOLOGY
proposed_new_terms:
- proposed_name: arginine aminopeptidase activity
  proposed_definition: >-
    Catalysis of the release of an N-terminal arginine residue from a peptide. Distinct from
    GO:0016285 alanyl aminopeptidase activity, GO:0004230 glutamyl aminopeptidase activity and
    GO:0004239 initiator methionyl aminopeptidase activity, which name the same kind of specificity
    for other residues.
  justification: >-
    GO has residue-specific children of GO:0004177 aminopeptidase activity for alanine, glutamate
    and the initiator methionine, but none for arginine, so an enzyme characterised as
    arginine-specific can only be annotated to the unqualified parent or to GO:0070006
    metalloaminopeptidase activity, neither of which records the specificity that the primary
    characterisation is about.
    The absence was checked rather than assumed, and with a positive control so the negative is
    readable: a search for "aminopeptidase activity" returns eight classes including those three
    residue-specific children, while a search for "arginine aminopeptidase activity" returns
    nothing. The pattern therefore exists in GO for other residues and is missing for this one.
    That first check was a label-string search, which would have missed a term named for an enzyme
    rather than a residue - GO does that elsewhere - so it was extended. A search for
    "aminopeptidase B", the trivial name of the Arg/Lys-specific EC 3.4.11.6 activity, returns no
    such class either, and the eight-class result above is the complete set under GO:0004177:
    alanyl, glutamyl, initiator methionyl, tripeptide, cysteine-type, serine-type and
    metalloaminopeptidase. No member of that set is arginine-specific under any name.
    The specificity is also pinned negatively in the paper's own supplementary data, which makes
    the term worth minting rather than merely absent: Figure S2 shows AaaA does not release
    methionine or leucine from p-nitroanilide, so this is a measured preference and not an
    inference from the one substrate that worked.
    The gap is not specific to this organism. The M28C autotransporter aminopeptidases are a
    recognised group - this paper aligns AaaA against ECA2163 of Pectobacterium carotovorum as the
    other member - and the arginine-specific surface peptidases of Porphyromonas gingivalis, which
    the paper cites as the precedent for this pathogenicity mechanism, have the same problem.
  proposed_parent:
    id: GO:0004177
    label: aminopeptidase activity
  supported_by:
  - reference_id: PMID:22927813
    reference_section_type: DISCUSSION
    supporting_text: >-
      AaaA is an AT that is tethered to the surface of P. aeruginosa and specifically removes amino
      terminal arginine from peptides.
suggested_questions:
- question: >-
    Should a surface peptidase that liberates a usable nitrogen source be annotated to a nitrogen
    utilisation process term? The growth experiment here shows the enzyme is what allows an
    arginine-initiated peptide to serve as the sole carbon and nitrogen source, which is a
    participation claim rather than a necessity one, since the enzyme performs the releasing step.
    No such row is proposed, because whether GO's convention places the nitrogen-utilisation terms
    on the scavenging enzyme or only on the downstream assimilation pathway was not established -
    that is a comparator question across surface peptidases rather than something this gene settles.
- question: >-
    Does AaaA have a second substrate class? The M28C subfamily is small and the related
    Pectobacterium protein ECA2163 is uncharacterised, so whether arginine specificity is a
    property of the subfamily or of this member is open, and the answer would say whether the
    proposed term should be scoped to the clade.
suggested_experiments:
- description: >-
    Determine the substrate preference beyond the P1 residue with a positional peptide library on
    whole cells, comparing wild type with the aaaA deletion. The surface display means the assay
    can be done without purification, and it would establish whether the enzyme is an
    arginine-specific trimmer of arbitrary peptides or prefers particular downstream residues -
    which is what identifying the physiological substrate needs.
- description: >-
    Separate the bacterial and host fates of the released arginine by infecting iNOS-deficient mice
    with wild type and the aaaA deletion. If the attenuation persists without host nitric oxide
    synthase, the arginine is being used by the bacterium; if it disappears, the enzyme acts by
    feeding the host enzyme, which is the opposite mechanism from the same activity.
