id: Q9I6G3
gene_symbol: PA0328
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0328 is AaaA, a surface-tethered arginine-specific aminopeptidase of Pseudomonas aeruginosa and
  one of the organism's three classical autotransporters. It is made as a single polypeptide with
  the three-part autotransporter architecture: a signal peptide for export across the inner
  membrane, an N-terminal passenger domain carrying a co-catalytic metal centre of the M28
  peptidase family, and a C-terminal beta-barrel that inserts into the outer membrane and
  translocates the passenger to the cell exterior, where it remains attached. The exposed passenger
  removes amino-terminal arginine from peptides, which lets the bacterium use peptides bearing an
  N-terminal arginine as a source of carbon and nitrogen: cells lacking AaaA cannot grow on a
  defined arginine-initiated tripeptide that supports the wild type. Loss of the enzyme attenuates
  the organism in a mouse chronic wound, so the scavenged arginine matters during infection,
  although whether the liberated arginine is consumed by the bacterium, diverted to host nitric
  oxide synthase, or both is unsettled.
