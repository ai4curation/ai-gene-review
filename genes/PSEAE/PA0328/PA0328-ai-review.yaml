- term:
    id: GO:0048870
    label: cell motility
  evidence_type: IDA
  original_reference_id: PMID:22927813
  qualifier: involved_in
  review:
    summary: >-
      Not supported anywhere in the cited paper. Its only motility sentence is background about
      EstA, a different autotransporter, and is itself a citation to two earlier papers.
    action: REMOVE
    reason: >-
      This paper contains no motility experiment of any kind, and the full text is cached, so this
      is established rather than suspected. Counting every motility-family word in it: motilit,
      swarm, swimming and twitch occur twice each - which is the cached body's own duplication, not
      two independent mentions, since all of them lie in one sentence - while motile, flagell,
      chemotax, pili and pilus occur zero times. That one sentence is in the introduction, it is
      about EstA rather than AaaA, and it attributes the motility claim to references [35] and [36].
      The absence of any flagellar, pilus or chemotaxis vocabulary is what makes this safe to
      assert on a full-text reading: a motility phenotype cannot be reported without naming the
      appendage or the assay, so there is no unread part of the paper in which the result could
      sit. The supplementary figure legends are cached in full, which closes the argument more
      directly than the vocabulary does: S1 is the deletion's construction plus growth in LB, S2 is
      a methionine and leucine p-nitroanilide specificity assay, S3 is growth in LB after MiniCTX
      insertion. That is the paper's entire supplementary inventory and none of it is a motility
      assay, so the result is not hiding in a supplementary figure either. Nothing this paper does
      measure resembles motility - the phenotypes are growth on a defined tripeptide,
      outer-membrane fractionation, aminopeptidase activity and a mouse wound infection.
      A repoint to EstA would also be wrong, which is why the request is a row deletion. The EstA
      motility claim is cited to [35],[36]; this paper is not its source, so moving the row to EstA
      on this reference would exchange one unsupported citation for another. Worth noting that
      biofilm, which appears in this paper only as Discussion speculation with no assay, did not
      produce a row - so this looks like a single mis-keyed annotation rather than the background
      section having been read as data.
    supported_by:
    - reference_id: PMID:22927813
      reference_section_type: INTRODUCTION
      supporting_text: >-
        One of these, the esterase EstA, functions to alter the levels of extracellular
        rhamnolipids, modulates twitching, swimming and swarming motility and influences the
        formation and architecture of biofilms [35], [36].
