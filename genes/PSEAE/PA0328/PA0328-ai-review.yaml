- id: PMID:22927813
  title: A novel virulence strategy for Pseudomonas aeruginosa mediated by an autotransporter
    with arginine-specific aminopeptidase activity.
  findings:
  - statement: >-
      The gene is named here, which is what ties the locus tag to a characterised protein; UniProt
      carries no gene name for this entry.
    reference_section_type: RESULTS
    supporting_text: >-
      Hence, we have assigned PA0328 with the name AaaA, for arginine-specific autotransporter of
      P. aeruginosa.
  - statement: >-
      The activity is an aminopeptidase specific for amino-terminal arginine, and the protein is
      tethered to the cell surface rather than released.
    reference_section_type: DISCUSSION
    supporting_text: >-
      AaaA is an AT that is tethered to the surface of P. aeruginosa and specifically removes amino
      terminal arginine from peptides.
  - statement: >-
      The specificity rests on mutagenesis of the predicted catalytic residues, not on sequence
      similarity alone.
    reference_section_type: RESULTS
    supporting_text: >-
      AaaA is a member of the M28 family of aminopeptidases and site directed mutagenesis confirms
      that predicted active site residues of AaaA contribute to arginine aminopeptidase activity.
  - statement: >-
      Outer-membrane localisation was determined directly, by fractionating the protein rather than
      inferred from the barrel signature.
    reference_section_type: RESULTS
    supporting_text: >-
      Two of these were localised to the outer membrane (E147 and E149, Figure 2).
  - statement: >-
      The biological role is nitrogen and carbon scavenging: a defined arginine-initiated tripeptide
      as sole source supports the wild type and not the deletion.
    reference_section_type: RESULTS
    supporting_text: >-
      when the peptide Arg-Gly-Asp was included in MMP as the sole source of carbon and nitrogen,
      the ΔaaaA mutant could not grow although the wild type P. aeruginosa PAO1 grew well
  - statement: >-
      The only motility statement anywhere in this paper is about EstA, a different P. aeruginosa
      autotransporter, in the introduction's background, and is itself attributed to two earlier
      references rather than reported here.
    reference_section_type: INTRODUCTION
    supporting_text: >-
      One of these, the esterase EstA, functions to alter the levels of extracellular rhamnolipids,
      modulates twitching, swimming and swarming motility and influences the formation and
      architecture of biofilms [35], [36].
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Luckett et al. 2012, PLoS Pathog). Full text cached and read in full, which
      is what allows the GO:0048870 defect below to be filed at CONFIRMED rather than as a query.
      It is the sole characterisation of this protein and establishes the name, the activity, the
      specificity, the surface localisation and the growth role. Its virulence findings are not
      annotated here.
