    action: MODIFY
    reason: >-
      Accepted as the activity and refined. The evidence behind this row is not sequence similarity
      alone: the paper reports the M28.005 active-site residues as fully conserved, then mutates
      them individually and shows the arginine aminopeptidase activity is lost. M28 is a
      co-catalytic metallopeptidase family, so the catalytic chemistry the mutagenesis probes is
      the metal-dependent one, and GO:0070006 metalloaminopeptidase activity is the class for that
      conjunction. OLS confirms GO:0070006 is a child of both GO:0004177 and the GO:0008235
      metalloexopeptidase activity this gene already carries on a separate row, so the replacement
      is a descendant of a term the gene already has rather than a new claim. The GO:0008235 row is
      TOO_GENERAL rather than taking the same replacement, and deliberately: the M28 signature
      behind it does not distinguish amino from carboxy specificity, so only this row's evidence -
      the mutagenesis - reaches the conjunction.
      The replacement is deliberately not the arginine-specific term, because GO has none. That was
      checked with a positive control rather than assumed: a search for "aminopeptidase activity"
      returns eight classes including the residue-specific GO:0016285 alanyl, GO:0004230 glutamyl
      and GO:0004239 initiator methionyl aminopeptidase activities, while a search for "arginine
      aminopeptidase activity" returns nothing - so the pattern exists in GO for other residues and
      is absent for this one. It is filed as a proposed_new_terms entry instead of being forced
      into an ill-fitting id, and GO:0070006 is the best existing term in the meantime.
