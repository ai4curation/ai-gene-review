- id: PMID:14679249
  title: An H(+)-coupled multidrug efflux pump, PmpM, a member of the MATE family of
    transporters, from Pseudomonas aeruginosa.
  findings:
  - statement: PmpM is an H+-coupled drug antiporter.
    supporting_text: Addition of benzalkonium chloride to the assay mixture caused efflux of H + , indicating that H + -benzalkonium chloride antiport took place.
  - statement: Deleting pmpM lowers resistance to several cationic antimicrobials in P. aeruginosa.
    supporting_text: Deletion of the pmpM gene from the chromosome of PMX52 resulted in a decrease in the MICs of benzalkonium chloride, ethidium bromide, acriflavine, and TPPCl.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. PseudoCAP source for the IDA plasma membrane and periplasmic side of
      plasma membrane rows (PTN000129144 seeds). The only membrane-related experiment is
      antiport measured in everted membrane vesicles of E. coli expressing pmpM; no
      fractionation, localization or topology assay is reported.
