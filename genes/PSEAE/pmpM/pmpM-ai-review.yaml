  label: Pseudomonas aeruginosa PAO1
description: >-
  PmpM (PA1361) is a multidrug efflux pump of the MATE (multidrug and toxic compound
  extrusion) family in Pseudomonas aeruginosa, an integral inner-membrane protein with 12
  predicted transmembrane helices. Unlike the Na+-coupled MATE pumps first characterized in
  Vibrio and E. coli, PmpM couples drug export to the proton gradient, acting as an
  H+/drug antiporter. It extrudes cationic antimicrobials, including the disinfectant
  benzalkonium chloride, ethidium, acriflavine and tetraphenylphosphonium, and when
  over-expressed also fluoroquinolones. Together with MexCD-OprJ it is a major determinant
  of benzalkonium chloride resistance in P. aeruginosa.
