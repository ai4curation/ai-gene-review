scope: PAO1 deletion/complementation experiments distinguish acetaldehyde oxidation from transport and
  regulatory activation. Standard growth tests used pH 7.0 and 20 mM ethanolamine, with carbon and nitrogen
  endpoints measured separately. Hydrazone growth used 10 mM VEH at 37 C for 24 h and did not reproduce
  the 2012 hydrazone utilization result. This does not negate purified-enzyme chemistry.
exact_excerpts:
- Deletion of the PA4022 gene reduced the growth of P. aeruginosa PAO1 on ethanolamine as a sole source
  of carbon
- The growth of the Δ eat mutant on ethanolamine was identical to that of wild-type (WT) P. aeruginosa
  PAO1.
- we did not observe growth on hydrazone for any of the P. aeruginosa strains used in this study.
- The discrepancy between our result and that of the earlier study is unclear.
- As expected, plasmid-based expression of PA4022 or exaC was sufficient to genetically complement the
  Δ PA4022 mutant
