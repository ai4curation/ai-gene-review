  review:
    summary: Proposed acetaldehyde dehydrogenase (NAD+) activity, inferred from the characterized ExaC
      enzyme and supported by the operon context.
    action: NEW
    reason: Three independent lines agree. (1) PA4022 is 98.2 percent identical over its full length to
      ExaC (Q9ZAA1), whose NAD(+)-dependent acetaldehyde dehydrogenase activity is experimentally recorded,
      and keeps the catalytic Glu262 and Cys301; (2) it matches the ExaC-specific NCBIfam model NF050026
      (AcaldDHExaC); (3) it is the first gene of the PA4022-eat-eutBC operon, whose EutBC product is acetaldehyde,
      and the authors assign it the acetaldehyde-to-acetate step. No direct assay of PA4022 exists, so
      the evidence code is ISS and the NAD(+) cofactor is inferred from ExaC rather than shown.
    additional_reference_ids:
    - UniProtKB:Q9ZAA1
    - PMID:27325678
    supported_by:
    - reference_id: PMID:10075429
      supporting_text: An ORF encoding a NAD(+)-dependent acetaldehyde dehydrogenase (exaC) was located
        downstream of the cytochrome c550 gene and in the same orientation.
    - reference_id: file:PSEAE/PA4022/PA4022-bioinformatics/RESULTS.md
      supporting_text: '| Q9HX05 PA4022 (PAO1) vs Q9ZAA1 ExaC (ATCC 17933) | 506 / 506 | 98.2% |'
    - reference_id: PMID:27325678
      supporting_text: This pathway is encoded by the PA4022-eat-eutBC operon and consists of a transport
        protein (Eat), an ethanolamine-ammonia lyase (EutBC), and an acetaldehyde dehydrogenase (PA4022).
