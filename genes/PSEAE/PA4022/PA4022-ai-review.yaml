suggested_questions:
- question: Which culture, substrate-purity or strain differences explain the discordant hydrazone-supported
    growth results in 2012 and 2016?
- question: How do PA4022 and PA1984 partition acetaldehyde flux during ethanolamine versus ethanol utilization?
suggested_experiments:
- hypothesis: Hydrazone growth depends on conditions that differ between the published studies.
  description: Compare verified PAO1 wild type, PA4022 and exaC single mutants and the double mutant under
    both published culture regimes, using chemically verified AEH and VEH and measuring substrate disappearance,
    acetate production and growth. Include complementation to distinguish expression and pathway effects.
  experiment_type: Controlled physiological replication and metabolite assay
