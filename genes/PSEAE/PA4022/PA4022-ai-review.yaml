  findings:
  - statement: PA4022 is the first gene of the PA4022-eat-eutBC ethanolamine-catabolic operon and is assigned
      the acetaldehyde dehydrogenase step; the operon is induced by acetaldehyde via EatR and RpoN.
    supporting_text: This pathway is encoded by the PA4022-eat-eutBC operon and consists of a transport
      protein (Eat), an ethanolamine-ammonia lyase (EutBC), and an acetaldehyde dehydrogenase (PA4022).
  reference_review:
