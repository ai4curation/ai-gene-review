  knowledge_gaps:
  - gap_statement: >-
      PA4022 has not been purified or assayed: its substrate preference, cofactor
      (NAD+ versus NADP+) and kinetics are inferred from the ExaC paralog only.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
  - gap_statement: >-
      Whether PA4022 is required for growth on ethanolamine, or is redundant with ExaC
      (PA1984) and other aldehyde dehydrogenases, has not been tested with a PA4022
      deletion mutant.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
suggested_questions:
- question: Does PA4022 differ from its near-identical paralog ExaC in substrate or
    cofactor preference, and why does P. aeruginosa keep both copies?
  experts:
  - Pseudomonas central metabolism groups
suggested_experiments:
- hypothesis: PA4022 is the acetaldehyde dehydrogenase needed for ethanolamine catabolism.
  description: >-
    Build PA4022, exaC and double deletion mutants in PAO1 and compare growth on
    ethanolamine, ethanol and acetate; assay NAD(+)- and NADP(+)-dependent
    acetaldehyde dehydrogenase activity of purified PA4022.
  experiment_type: Gene deletion and enzyme assay
