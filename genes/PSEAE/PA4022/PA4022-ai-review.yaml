- id: PMID:22267508
  title: Group X aldehyde dehydrogenases of Pseudomonas aeruginosa PAO1 degrade hydrazones.
  findings:
  - statement: Native PAO1 HdhA was identified as PA4022; recombinant HdhA and PA1984 ExaC directly oxidize
      acetaldehyde.
    supporting_text: We found here that purified rHdhA and rExaC both oxidize acetaldehyde.
  - statement: Hydrazone oxidative hydrolysis yields hydrazides and acetate, rather than aldehydes from
      simple hydrolysis.
    supporting_text: The purified HDH converted AEH and NAD + to stoichiometric amounts of ADH, AMH, and
      acetate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Native PAO1 purification, target-specific peptide identification, His-tagged
      recombinant HdhA/ExaC and single/double gene disruptions. Acetaldehyde assays used NAD+ at pH 9.0;
      hydrazone reactions were studied at pH 7.2. The PAO1 ExaC is PA1984, not the separate ATCC17933
      Q9ZAA1 reference protein.
