  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4022 is a 506-residue aldehyde dehydrogenase (ALDH superfamily) of Pseudomonas
  aeruginosa PAO1, encoded as the first gene of the PA4022-eat-eutBC operon that
  carries the central ethanolamine catabolic pathway (ethanolamine permease Eat and
  ethanolamine ammonia-lyase EutBC). In that pathway it is assigned the oxidation of
  the EutBC product acetaldehyde to acetate; the operon is induced through the
  acetaldehyde-sensing enhancer-binding protein EatR (PA4021) and the sigma factor
  RpoN. PA4022 is a near-identical paralog (about 98 percent identity) of the
  biochemically characterized NAD(+)-dependent acetaldehyde dehydrogenase ExaC of the
  ethanol-oxidation (exa) cluster, shares the ExaC-specific NCBIfam model and keeps
  the ALDH catalytic glutamate and cysteine nucleophile, but has not itself been
  assayed.
