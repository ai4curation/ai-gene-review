  label: Pseudomonas aeruginosa PAO1
description: PA4022 (HdhA) is an NAD-preferring aldehyde/hydrazone dehydrogenase of Pseudomonas aeruginosa
  PAO1. It oxidizes acetaldehyde to acetate and catalyzes oxidative cleavage of hydrazone C=N bonds to
  the corresponding hydrazides and carboxylic acids. Native HdhA is dimeric. The gene starts the PA4022-eat-eutBC
  operon, induced through the acetaldehyde-responsive regulator EatR and RpoN, and contributes to ethanolamine
  utilization as a carbon source. HdhA and the closely related ExaC (PA1984) can compensate for one another
  during ethanol utilization. Hydrazone-dependent growth was reported with HdhA contributing more strongly
  than ExaC, but was not reproduced under the different conditions of a later study.
