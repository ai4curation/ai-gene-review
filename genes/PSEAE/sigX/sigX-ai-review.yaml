suggested_questions:
- question: >-
    Which SigX-dependent genes account for the growth-rate defect of sigX mutants in rich,
    low-osmolarity medium (fatty acid synthesis and membrane fluidity are candidates)?
suggested_experiments:
- description: >-
    Purify SigX and test core RNAP binding and in vitro transcription from the SigX-dependent
    oprF promoter.
