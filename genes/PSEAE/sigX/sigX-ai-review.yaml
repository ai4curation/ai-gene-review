product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SigX (PA1776) is an extracytoplasmic function (ECF) sigma factor of Pseudomonas aeruginosa
  PAO1. It is encoded immediately upstream of oprF, which encodes the major outer membrane
  porin, and directs transcription of oprF from a SigX-dependent promoter that overlaps a
  sigma-70 promoter. SigX is a cell-envelope stress sigma factor; low osmolarity and sucrose
  induce it. ChIP-seq and transcriptomics define a regulon covering fatty acid biosynthesis
  and membrane fluidity, type III secretion, swarming and cyclic di-GMP signalling. sigX mutants
  grow slowly in rich medium (especially at low osmolarity), are more sensitive to imipenem,
  have altered membrane fatty acid composition and show reduced cytotoxicity and increased
  biofilm formation. SigX has the sigma-70 region 2 and region 4 modules of the ECF family
  and acts as the promoter-specificity subunit of RNA polymerase.
references:
- id: PMID:10438740
  title: Influence of a putative ECF sigma factor on expression of the major outer membrane
    protein, OprF, in Pseudomonas aeruginosa and Pseudomonas fluorescens.
  findings:
  - statement: Primer extension of sigX-disrupted versus wild-type RNA identifies a SigX-dependent
      oprF promoter with an ECF-type -35 region.
    supporting_text: monocistronic transcription of oprF occurs from two overlapping promoters,
      one that is SigX-dependent and resembles ECF sigma factor promoters in its minus-35
      region
  - statement: The sigX mutant has a reduced logarithmic-phase growth rate in rich medium.
    supporting_text: which included a markedly reduced logarithmic-phase growth rate in rich
      medium
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IDA sigma factor activity (IBD seed) and IMP positive regulation
      of cell growth rows. Abstract only: the PMC copy (PMC93957) returned no body text through
      PubMed or Europe PMC. The abstract describes genetic evidence (a sigX disruption, Northern
      blots, primer extension comparing mutant and wild type), which supports the sigma factor
      term. It describes no purified-protein assay. The growth phenotype is a population growth-rate
      defect that oprF complementation did not rescue.
- id: PMID:24187091
  title: Identification of the alternative sigma factor SigX regulon and its implications
    for Pseudomonas aeruginosa pathogenicity.
  findings:
  - statement: ChIP-seq maps SigX binding regions genome-wide and defines its DNA binding
      motif.
    supporting_text: the combination of transcriptional data with chromatin immunoprecipitation
      (ChIP) followed by high-throughput sequencing (ChIP-seq) led to the identification of
      the DNA binding motif of SigX
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. ChIP-seq occupancy of SigX at target promoters plus transcriptomics;
      the strongest available evidence that SigX acts directly at promoters as a sigma factor.
- id: PMID:22685281
  title: Transcription of the oprF gene of Pseudomonas aeruginosa is dependent mainly on the
    SigX sigma factor and is sucrose induced.
  findings:
  - statement: oprF has intertwined sigma-70 and SigX promoters.
    supporting_text: Two intertwined promoters dependent on σ(70) and SigX are located in
      the sigX-oprF intergenic region
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; promoter dissection of oprF.
- id: PMID:29729420
  title: Extracytoplasmic function sigma factors in Pseudomonas aeruginosa.
  findings:
  - statement: Review grouping the P. aeruginosa ECF sigma factors by function.
    supporting_text: the iron starvation σ (PvdS, FpvI, HasI, FecI, FecI2 and others), the
      cell wall stress ECFσ AlgU, SigX and SbrI, and the unorthodox σVreI involved in the
      expression of virulence
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review; abstract only in cache.
