- term:
    id: GO:0030307
    label: positive regulation of cell growth
  evidence_type: IMP
  original_reference_id: PMID:10438740
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP positive regulation of cell growth. The phenotype is a reduced logarithmic-phase
      growth rate of the sigX mutant in rich medium, which oprF complementation did not rescue.
      That is a pleiotropic population growth-rate defect of a regulator mutant. GO:0030307
      regulates cell growth, defined as the irreversible increase in size of a cell.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      An indirect pleiotropic phenotype annotated as a regulatory process, and the term (cell
      size growth) does not match a growth-rate defect. SigX's direct role is transcription
      of its envelope-related regulon (fatty acid synthesis, membrane fluidity), which explains
      the growth defect.
    supported_by:
    - reference_id: PMID:10438740
      supporting_text: which included a markedly reduced logarithmic-phase growth rate in
        rich medium
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0030307
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        PseudoCAP IMP GO:0030307 positive regulation of cell growth on PA1776/sigX from PMID:10438740.
        The abstract states the phenotype as a markedly reduced logarithmic-phase growth rate
        in rich medium, a population growth-rate defect of a regulator mutant, not the increase
        in cell size that GO:0016049 cell growth denotes. Consider deleting the row or replacing
        it with a term for the direct regulatory role. This row does not seed an IBD.
      supported_by:
      - reference_id: PMID:10438740
        supporting_text: which included a markedly reduced logarithmic-phase growth rate in
          rich medium
