    summary: >-
      PseudoCAP IDA; sole seed of the PTN002441861 deacetylase activity IBD.
      Purified recombinant PelA hydrolysed p-nitrophenyl acetate, and predicted
      active-site mutants lost more than 90% of activity.
    action: MODIFY
    reason: >-
      The seed is sound: a direct assay of the purified protein with active-site
      mutants. The pseudosubstrate supports only generic deacetylase activity, but
      later work shows deacetylation of alpha-1,4-GalNAc oligosaccharides, so the
      specific child term is now warranted, consistent with the IBA row.
    proposed_replacement_terms:
    - id: GO:0047375
      label: N-acetylgalactosaminoglycan deacetylase activity
    supported_by:
    - reference_id: PMID:23504011
      supporting_text: >-
        We first established that purified recombinant PelA hydrolyzed the
        pseudosubstrate p -nitrophenyl acetate in vitro , and site-specific
        mutations of predicted deacetylase active-site residues reduced activity
        greater than 10-fold.
    - reference_id: PMID:40120681
      supporting_text: >-
        Characterization of the deacetylase domain revealed that PelA is the
        founding member of a new carbohydrate esterase family, CE21.
