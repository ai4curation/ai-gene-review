    supporting_text: >-
      After synthesis and transport of the GalNAc polysaccharide across the inner
      membrane, PelA partially deacetylates and hydrolyzes Pel before its export
      out of the cell via PelB.
  - reference_id: PMID:23504011
    supporting_text: >-
      Taken together, these results suggest that the deacetylase activity of PelA
      is important for the production of the Pel polysaccharide.
  - reference_id: PMID:28972168
    supporting_text: >-
      Copurification experiments indicated that the interaction between PelA and
      PelB is direct and that the deacetylase activity of PelA increases and its
      hydrolase activity decreases when these proteins interact.
suggested_questions:
- question: >-
    Should GO add a term for endo-hydrolysis of alpha-1,4-linked
    N-acetylgalactosamine polymers (PelA GH166 activity)? GO:0033931
    endogalactosaminidase activity is defined for deacetylated poly-galactosamine.
- question: >-
    Should the PTN002441861 deacetylase IBD be moved to a node restricted to PelA
    orthologs that contain the CE21 deacetylase domain?
suggested_experiments:
- description: >-
    Express Dictyoglomus B8DZ50 and Deinococcus Q9RWG2 and test esterase activity
    on p-nitrophenyl acetate and alpha-1,4-GalNAc oligosaccharides alongside
    PelA, to confirm that they lack deacetylase activity.
