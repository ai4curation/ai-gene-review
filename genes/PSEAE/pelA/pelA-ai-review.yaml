core_functions:
- description: >-
    Periplasmic Pel-modifying enzyme whose CE21 domain partially deacetylates the
    alpha-1,4-GalNAc Pel polymer (and whose GH166 domain can hydrolyse it), in
    complex with the PelB export porin, as a required step of Pel production.
