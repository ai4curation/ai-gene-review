- id: PMID:23504011
  title: PelA deacetylase activity is required for Pel polysaccharide synthesis in
    Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Purified PelA hydrolyses p-nitrophenyl acetate; deacetylase active-site
      mutants lose activity, Pel production and Pel-dependent biofilm; PelA is in
      periplasmic and membrane fractions.
    supporting_text: >-
      We demonstrate that PelA exhibits deacetylase activity in vitro and identify
      four conserved residues in the putative active site required for this
      activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP seed paper for the PTN002441861 deacetylase IBD. Full text read;
      direct assay of purified protein supports the IDA.
