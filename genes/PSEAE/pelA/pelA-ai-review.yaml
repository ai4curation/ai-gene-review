taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  pelA (PA3064) encodes PelA, a large periplasmic, multidomain enzyme that modifies
  the Pel exopolysaccharide of Pseudomonas aeruginosa. Pel is a cationic, partially
  deacetylated alpha-1,4-linked N-acetylgalactosamine polymer that acts as an
  intercellular adhesin in the biofilm matrix, in part by cross-linking
  extracellular DNA. PelA is encoded by the first gene of the pelA-pelG operon. It
  has an N-terminal glycoside hydrolase domain (GH166, GH114-like TIM barrel) with
  endo-alpha-1,4-N-acetylgalactosaminidase activity, and a C-terminal deacetylase
  domain that founds carbohydrate esterase family CE21. After the GalNAc polymer
  crosses the inner membrane, PelA partially deacetylates and can hydrolyse it.
  PelA binds the periplasmic TPR domain of the outer-membrane porin PelB, which
  increases deacetylation and decreases hydrolysis before Pel is exported.
  Deacetylase active-site mutants make no Pel-reactive material and are defective
  in Pel-dependent biofilm formation.
