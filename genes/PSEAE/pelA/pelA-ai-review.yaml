- id: PMID:28972168
  title: PelA and PelB proteins form a modification and secretion complex essential
    for Pel polysaccharide-dependent biofilm formation in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PelA binds the PelB TPR domain directly in the periplasm; the interaction
      raises deacetylase and lowers hydrolase activity.
    supporting_text: >-
      Copurification experiments indicated that the interaction between PelA and
      PelB is direct and that the deacetylase activity of PelA increases and its
      hydrolase activity decreases when these proteins interact.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:40120681
  title: Structural and functional analysis of Pseudomonas aeruginosa PelA provides
    insight into the modification of the Pel exopolysaccharide.
  findings:
  - statement: >-
      Crystal structure of PelA; the deacetylase domain founds CE21 and
      deacetylates alpha-1,4-GalNAc oligosaccharides; the hydrolase domain is an
      endo-alpha-1,4-N-acetylgalactosaminidase.
    supporting_text: >-
      Characterization of the deacetylase domain revealed that PelA is the
      founding member of a new carbohydrate esterase family, CE21.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
