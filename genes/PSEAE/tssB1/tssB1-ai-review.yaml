description: TssB1 (HsiB1) is a sheath component of the Pseudomonas aeruginosa H1-T6SS. With TssC1 it assembles into the contractile sheath that surrounds the Hcp1 tube; contraction of the TssB1-TssC1 sheath provides the energy that expels the tube and delivers effectors.
