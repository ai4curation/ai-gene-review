core_functions:
- description: >-
    Secreted epoxide hydrolase. Using the Asp129-His297-Glu153 triad of the
    alpha/beta hydrolase fold, with Asp129 as the nucleophile attacking the epoxide
    ring, Cif hydrolyses epoxides to the corresponding diols, with a narrow
    substrate preference resembling microsomal rather than soluble epoxide
    hydrolases, and without the dehalogenase activities of the related
    Asp-nucleophile classes. The physiological substrate is unidentified.
