    action: NEW
    reason: >-
      This is the mechanism by which Cif acts, and the step it performs is a
      perturbation of host vesicle-mediated transport: the protein is delivered into
      the host cell and acts there on the trafficking machinery, with the trafficking
      change (recycling to lysosome) demonstrated directly for Cif-containing
      vesicles and absent for vesicles from a cif mutant. It is not an indirect or
      pleiotropic effect, and it is not entailed by the chloride-transport row, which
      names the outcome rather than the subverted host process. Both rows describe the
      same single activity from different sides, which is why only this one is
      proposed rather than a set of trafficking terms.
