gene_symbol: cif
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  cif (PA2934) encodes Cif, "CFTR inhibitory factor", a secreted
  alpha/beta-hydrolase-fold epoxide hydrolase of Pseudomonas aeruginosa and a
  virulence factor of the airway. The 319-residue precursor carries a signal
  peptide and the mature protein is released from the cell, largely in
  outer-membrane vesicles, through which it is delivered into human airway
  epithelial cells. Cif is a homodimer with the canonical epoxide hydrolase
  catalytic triad Asp129-His297-Glu153, in which Asp129 is the nucleophile that
  opens the epoxide ring; purified Cif hydrolyses epibromohydrin and
  cis-stilbene oxide, with a narrow substrate range, and lacks the haloacetate
  and haloalkane dehalogenase activities of the two neighbouring enzyme classes
  that share the same Asp-nucleophile fold. Its physiological epoxide substrate
  is unknown. In host cells Cif reduces the amount of CFTR chloride channel in
  the apical membrane and so reduces CFTR-mediated chloride secretion: it
  stabilises a G3BP1-mediated inhibition of the deubiquitinase USP10, which
  leaves endocytosed CFTR ubiquitinated and diverts it from recycling endosomes
  to lysosomal degradation. The catalytic histidine is required for this host
  effect, implying that turnover of an endogenous epoxide substrate, rather than
  mere binding, drives it. Reduced chloride secretion impairs mucociliary
  clearance, and cif is expressed by P. aeruginosa in the cystic fibrosis lung.
