- description: >-
    Virulence effector on host epithelial trafficking. Delivered into human airway
    epithelial cells in outer-membrane vesicles, Cif stabilises G3BP1-mediated
    inhibition of the deubiquitinase USP10, so that endocytosed CFTR remains
    ubiquitinated and is routed from recycling endosomes to lysosomal degradation.
    The result is less CFTR in the apical membrane and reduced CFTR-mediated
    chloride secretion. The effect requires the catalytic histidine, so it depends
    on hydrolysis of an as yet unidentified endogenous epoxide.
