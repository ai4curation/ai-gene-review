knowledge_gaps:
- gap_statement: >-
    The endogenous epoxide substrate of Cif is unidentified, so the chemistry that
    links its catalytic activity to the inhibition of host USP10 is unknown.
  boundary: >-
    Firmly established: Cif is an epoxide hydrolase with a complete, structurally
    resolved triad, turns over model epoxides, and needs its catalytic histidine for
    the host CFTR effect, which proceeds through G3BP1-dependent inhibition of USP10
    and lysosomal routing of CFTR. What is missing is the natural substrate and
    whether the active species is the consumed epoxide or the diol product.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Without the substrate, neither the enzyme's role in P. aeruginosa's own
    metabolism nor the step at which it intersects host signalling can be modelled,
    and inhibitor design has no target reaction.
  resolution: >-
    Identify epoxides consumed and diols produced in host cells exposed to Cif, and
    test whether a candidate product reconstitutes the USP10 effect without the enzyme.
  provenance:
  - reference_id: PMID:20118260
    supporting_text: >-
      Cif's effect on host-cell CFTR expression requires the hydrolysis of an extended
      endogenous epoxide substrate
suggested_questions:
- question: >-
    Which endogenous epoxide does Cif hydrolyse in the host cell, and is its diol
    product (or the loss of the parent epoxide) what inhibits USP10 through G3BP1?
- question: >-
    Does Cif serve any function in P. aeruginosa's own physiology, such as
    detoxification of environmental or host-derived epoxides, in hosts and niches
    where no CFTR is present?
- question: >-
    Is GO:1990215 (symbiont-mediated perturbation of host vesicle-mediated transport)
    plus GO:2001226 the right pair for a secreted effector of this kind, or should the
    chloride-transport effect be expressed only through a host-perturbation term?
suggested_experiments:
- description: >-
    Lipidomic comparison of airway epithelial cells exposed to Cif-containing versus
    cif-mutant outer-membrane vesicles, and of purified Cif incubated with host lipid
    extracts, looking for epoxide substrates consumed and diols formed; then test
    whether the candidate diol reproduces the USP10/G3BP1 effect on its own.
- description: >-
    Screen a panel of epoxides (including epoxyeicosatrienoic acids and other
    arachidonate-derived epoxides) against purified Cif and the catalytically dead
    D129N and H297A variants to define the substrate range quantitatively, in
    parallel with the apical CFTR assay, to establish whether host effect and
    catalytic preference track together.
