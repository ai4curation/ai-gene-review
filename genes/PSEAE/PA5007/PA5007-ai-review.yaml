id: Q9HUF8
gene_symbol: PA5007
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5007 is an uncharacterised 252-residue protein of Pseudomonas aeruginosa, assigned by curated
  family signatures to the InaA group of putative lipopolysaccharide kinases: it carries the Kdo
  kinase domain and the protein-kinase-like fold that define that family. It lies in the
  chromosomal cluster that phosphorylates the inner core of lipopolysaccharide, two loci from waaP
  (PA5009), the heptose(I) kinase whose activity and essentiality are established. Beyond
  that placement nothing about the protein is known: no activity has been measured, no substrate
  identified and no location determined, and it is distinguished from waaP by lacking every
  RfaP-specific signature, so it is not a heptose(I) kinase by family. Its position in an operon of
  LPS-modifying enzymes makes a role in core phosphorylation plausible, but that remains an
  expectation from genomic context rather than a finding.
references:
- id: PMID:10692150
  title: Lipopolysaccharide core phosphates are required for viability and intrinsic
    drug resistance in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      The paper characterises three genes it calls putative kinases, and its own hedge is in the
      sentence; the only one of the three that is a waaP homologue is named as such.
    reference_section_type: ABSTRACT
    supporting_text: >-
      We have used chemical and genetic techniques to characterize three putative kinase genes that
      are involved in the addition of phosphate to the inner core region of P. aeruginosa
      lipopolysaccharide. The first gene is a waaP homologue, whereas the other two (wapP and wapQ)
      are unique to P. aeruginosa.
  - statement: >-
      Two of the three genes could not be inactivated at all, so no mutant phenotype exists for
      either of them.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Repeated attempts using a variety of membrane-stabilizing conditions to generate waaP:Gm (Gm,
      gentamicin) or wapP:Gm mutants were unsuccessful.
  - statement: >-
      The one mutant that was obtained had essentially no phenotype, and the authors say so, which
      bears directly on what an IMP from this paper can assert.
    reference_section_type: ABSTRACT
    supporting_text: >-
      A wapQ:Gm mutant was isolated and it had an unaltered minimum inhibitory concentration (MIC)
      for novobiocin and only a small decrease in the MIC for sodium dodecyl sulphate (SDS),
      suggesting that the loss of a phosphate group transferred by WapQ may only be having a small
      impact on outer-membrane permeability.
  - statement: >-
      The only phosphate-transfer activity demonstrated in the paper is WaaP's, by NMR and linkage
      analysis in a heterologous host; nothing comparable was shown for the other two genes.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Nuclear magnetic resonance and methylation linkage analysis showed that WaaPPa could add one
      phosphate to O4 of HepI in a Salmonella typhimurium waaP mutant.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified (Walsh et al. 2000, Mol Microbiol). Abstract-only in the cache, and that is
      the limiting factor for this review: the paper works with the gene names waaP, wapP and wapQ
      and the abstract never gives a PA locus tag, so which of them this entry is cannot be
      determined from what is readable. The paper is certainly the right one for the gene cluster
      and is the source the IMP row cites; whether it supports a kinase activity for this
      particular locus is exactly what cannot be checked. Marked UNVERIFIED rather than MISCITED
      for that reason - asserting it does not support the claim would be a stronger statement than
      an abstract can carry, and the full text's strain and plasmid tables would probably settle it.
  full_text_unavailable: true
existing_annotations:
- term:
    id: GO:0016301
    label: kinase activity
  evidence_type: IMP
  original_reference_id: PMID:10692150
  qualifier: enables
  review:
    summary: >-
      The gene's only annotation, and it cannot be adjudicated: the cited paper is abstract-only and
      works in gene names that no database maps to this locus. Left UNDECIDED with the identity
      question filed as a query.
    action: UNDECIDED
    reason: >-
      Undecided because the question this row turns on is which gene PA5007 is, and that could not
      be settled from anything readable. The paper characterises three genes by name - a waaP
      homologue, plus wapP and wapQ - and its abstract gives no locus tags. The databases decline to
      bridge the gap: KEGG and RefSeq give PA5007 no symbol and the product "hypothetical protein",
      and UniProt gives only OrderedLocusNames=PA5007 from an unreviewed submitter import, with no
      gene name. PA5006 and PA5008 are equally nameless, while PA5009 is unambiguously waaP in both
      sources. So the wapP and wapQ names of the literature are attached to no locus in either
      database, and whoever made this annotation had to make that mapping themselves. The
      Pseudomonas Genome DB page, which secondary sources say lists PA5007 as wapG - a sugar
      transferase rather than a kinase - returned HTTP 403 and could not be read, so that
      assignment is unverified rather than refuted.
      Each candidate identity undercuts the row, which is why this is not a case of deferring to a
      curator on a claim that is probably fine. If PA5007 is wapQ, the kinase role was never
      demonstrated and the one mutant obtained had an unaltered novobiocin MIC and only a small SDS
      decrease, which the authors themselves read as a small effect; an IMP is inferred from a
      mutant phenotype, and that is close to no phenotype. If PA5007 is wapP, no mutant could be
      generated at all, so there is no phenotype for an IMP to rest on. If PA5007 is wapG, it is a
      transferase and the kinase term is wrong. The paper's own framing is "three putative kinase
      genes", and the only phosphate transfer it demonstrates directly is WaaP's, in a Salmonella
      host.
      One positive result does bear on the wapP branch, and an earlier version of this reason
      omitted it: co-expressing waaP and wapP together in the Salmonella waaP mutant gave far larger
      MIC increases than waaP alone, which is the abstract's only evidence that a non-waaP cluster
      gene contributes a phosphate. It does not change the action. It is heterologous co-expression
      rather than a mutant phenotype, so it cannot ground an IMP, and because the two genes went in
      together it does not separate wapP's contribution from a dosage effect on waaP's. But "no
      phenotype for an IMP to rest on" was too flat a summary of the wapP case: the distinction is
      between having no evidence and having evidence of the wrong kind for this evidence code.
      Nothing on the record compensates. The protein name "Lipopolysaccharide kinase" is ProtNLM
      (ECO:0008006), which the project rules exclude as evidence; protein existence is 4
      (Predicted); there is no function, catalytic activity, cofactor or location statement, and no
      publication is cited. The one solid thing is the curated family assignment - PIRSF026326
      InaA, IPR027023 Put_LipoPS_kinase_InaA, PF06293 Kdo - and that family's own name says
      "putative". It supports membership in a putative LPS kinase family, which is a weaker claim
      than the row makes and is also not independent of it.
      Not REMOVE: the project rules are explicit that an experimental annotation is not to be
      overruled from incomplete evidence, and a curator making an IMP read a full text I cannot see,
      including the tables that would name the locus. Not ACCEPT, and not MARK_AS_OVER_ANNOTATED
      either, because both would assert something about the identity that I was unable to establish.
      UNDECIDED is the action the enum reserves for exactly this, and the query below is what would
      resolve it.
    supported_by:
    - reference_id: file:PSEAE/PA5007/PA5007-uniprot.txt
      record_section: ["DR:PIRSF"]
      supporting_text: 'DR   PIRSF; PIRSF026326; InaA; 1.'
    - reference_id: PMID:10692150
      reference_section_type: ABSTRACT
      supporting_text: >-
        A wapQ:Gm mutant was isolated and it had an unaltered minimum inhibitory concentration (MIC)
        for novobiocin and only a small decrease in the MIC for sodium dodecyl sulphate (SDS),
        suggesting that the loss of a phosphate group transferred by WapQ may only be having a small
        impact on outer-membrane permeability.
    - reference_id: PMID:10692150
      reference_section_type: ABSTRACT
      supporting_text: >-
        typhimurium waaP mutant transformed with both waaP and wapP had over 250-fold
        and 1000-fold increases, respectively, in these MICs.
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: PSEUDOCAP
      slot: gene name
      requested_change: CHECK
      asserted_value: >-
        GO:0016301 enables, IMP, PMID:10692150 on UniProtKB:Q9HUF8 (PA5007)
      cause: UNKNOWN
      confidence: SUSPECTED
      explanation: >-
        A query rather than a correction, and deliberately at SUSPECTED. Filed as WRONG_GENE_PRODUCT
        rather than WRONG_REFERENCE because the reference is the right paper: what is in question is
        which gene the row sits on. PMID:10692150 reports on
        three genes it names waaP, wapP and wapQ, and gives no PA locus tags in its abstract.
        Neither KEGG/RefSeq nor UniProt assigns PA5007 any gene name - RefSeq calls it a
        hypothetical protein - while PA5009 is waaP in both. So the mapping from the paper's gene
        names to this locus, which the annotation depends on, is not recorded in either database and
        could not be checked here.
        What the resource could supply in one line is which of wapP, wapQ or wapG PA5007 is. The
        answer changes the outcome rather than merely confirming it: wapQ would leave an IMP resting
        on a mutant the authors describe as having an unaltered novobiocin MIC and only a small SDS
        decrease, wapP would leave an IMP with no mutant at all since none could be generated, and
        wapG would make the kinase term wrong. Raised as CHECK with no annotation change requested,
        because the full text's strain and plasmid tables would probably settle it and I could not
        read them.
knowledge_gaps:
- gap_statement: >-
    No activity has ever been measured for this protein. The family assignment predicts a
    phosphotransfer onto lipopolysaccharide, but which hydroxyl of which core sugar - or whether the
    protein is catalytically active at all - is unknown, and the only enzymology in the cluster's
    primary paper was done on WaaP.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
- gap_statement: >-
    Whether the protein contributes to inner-core phosphorylation in a way that matters is open. Two
    of the cluster's kinase genes could not be inactivated, which is read as essentiality, while the
    one mutant that was obtained had almost no permeability phenotype - so the phosphates differ
    sharply in importance and it is not known which group this protein installs.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
- gap_statement: >-
    Where in the cell the protein acts has not been determined. Core phosphorylation happens on the
    cytoplasmic face of the inner membrane during LPS assembly, but there is no localisation
    experiment, no transmembrane segment and no subcellular location statement on the record.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
suggested_questions:
- question: >-
    Which gene of the Walsh et al. cluster is PA5007? This is the question that blocks the review.
    The primary literature names waaP, wapP and wapQ; KEGG and RefSeq name none of PA5006, PA5007 or
    PA5008; the Pseudomonas Genome DB reportedly lists PA5007 as wapG, a transferase rather than a
    kinase, and could not be reached to confirm. The full text of PMID:10692150, or that database
    page, would answer it.
- question: >-
    Is the InaA family assignment informative about substrate? PIRSF026326 and IPR027023 are named
    for the E. coli InaA protein and carry "putative" in the InterPro name itself. Whether anyone
    has established what an InaA-family enzyme phosphorylates would determine whether the family
    membership licenses a substrate-specific term or only the kinase-fold one.
- question: >-
    Does the proposed lipopolysaccharide core heptose kinase term from the waaP review apply here?
    It does not, and the reason is worth recording: PA5007 carries none of waaP's RfaP-specific
    signatures - no PIRSF037318, no IPR017172, no rfaP NCBIfam model - and shares with it only the
    PF06293 Kdo fold and the kinase-like domain. Adjacent accessions and an adjacent locus made this
    worth checking rather than assuming.
suggested_experiments:
- description: >-
    Settle the identity and the phenotype together by making a clean deletion of PA5007 in PAO1 and
    analysing its lipopolysaccharide core by NMR and methylation linkage analysis, the methods the
    original paper used on WaaP. If a specific inner-core phosphate is missing, that names both the
    gene and the activity; if the core is unchanged, the annotation should go whatever the gene is
    called.
- description: >-
    Test the activity directly by complementing a Salmonella waaP mutant with PA5007, the assay that
    established WaaP's regiospecificity in the original paper. A negative result would be
    informative here rather than merely absent, since it would show the protein is not a functional
    heptose(I) kinase even though it sits in the same operon and shares the Kdo kinase fold.
