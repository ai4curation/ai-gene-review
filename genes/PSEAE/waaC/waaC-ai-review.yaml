taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WaaC (RfaC) is the lipopolysaccharide heptosyltransferase I of Pseudomonas aeruginosa, a 355-residue
  glycosyltransferase family 9 enzyme that transfers the first L-glycero-D-manno-heptose from
  ADP-heptose to the Kdo2-lipid A acceptor, starting assembly of the inner core oligosaccharide. It is a
  peripheral protein on the cytoplasmic face of the inner membrane, where the lipid A acceptor resides.
  The PAO1 gene restores smooth LPS to a Salmonella waaC mutant, and chromosomal null mutants could not
  be isolated in P. aeruginosa, consistent with the inner core being required for viability or outer
  membrane integrity in this organism. waaC lies next to waaF, which adds the second heptose.
