  title: Isolation and characterization of two genes, waaC (rfaC) and waaF (rfaF),
    involved in Pseudomonas aeruginosa serotype O5 inner-core biosynthesis.
  findings:
  - statement: PAO1 waaC restores smooth LPS production in a Salmonella waaC mutant.
    supporting_text: >-
      Two plasmids, pCOREc1 and pCOREc2, which restored smooth LPS production in the waaC mutant, were
      isolated.
  - statement: The predicted WaaC protein is 53% identical to Salmonella WaaC.
    supporting_text: >-
      The amino acid sequence of the deduced protein exhibited 53% identity with the sequence of the WaaC
      protein of S. enterica serovar Typhimurium.
  - statement: Chromosomal waaC and waaF null mutants could not be obtained in P. aeruginosa.
    supporting_text: >-
      Despite multiple attempts to isolate true knockout mutants, all transconjugants were identified as
      merodiploids.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (de Kievit and Lam 1997, J Bacteriol; PMC179135). Abstract read; no full-text XML
      was obtainable. The abstract reports heterologous complementation of Salmonella waaC and waaF
      mutants, sequence identity, maxicell expression and failed knockouts; it describes no in vitro
      transferase assay. Source of the PseudoCAP IDA GO:0009244 row that seeds PTN001575314, and of the
      ISS GO:0071968 row.
