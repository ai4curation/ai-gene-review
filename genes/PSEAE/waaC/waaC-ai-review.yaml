- term:
    id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:9171387
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row and a seed of the PTN001575314 IBD. The PAO1 gene restores smooth LPS to a Salmonella
      waaC mutant.
    action: ACCEPT
    reason: >-
      Heterologous complementation of a heptosyltransferase I mutant places WaaC in inner-core assembly,
      and the enzyme catalyses a step of it. The evidence is genetic rather than a direct assay, so the
      IDA code is probably wrong (IGI or IMP); recorded as a suspected evidence-code defect because only
      the abstract was read. The term is sound.
    supported_by:
    - reference_id: PMID:9171387
      supporting_text: >-
        Two plasmids, pCOREc1 and pCOREc2, which restored smooth LPS production in the waaC mutant, were
        isolated.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      corrected_value: ECO:0000316
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        The abstract of PMID:9171387 reports cloning by complementation of a Salmonella waaC mutant
        (restored smooth LPS), sequence identity, maxicell expression and failed chromosomal knockouts; it
        describes no direct assay of WaaC. IGI (complementation) or IMP looks like the right code. Only the
        abstract was read, so the full text could contain an assay, hence SUSPECTED and CHECK. The GO term
        is sound.
- term:
    id: GO:0071968
    label: lipid A-core heptosyltransferase activity
  evidence_type: ISS
  original_reference_id: PMID:9171387
  qualifier: enables
  supporting_entities:
  - UniProtKB:P26469
  review:
    summary: >-
      PseudoCAP ISS from Salmonella WaaC (P26469). GO:0071968 is the reaction that completes lipid A-core
      (galactosyl-glucosyl3-heptosyl3-Kdo2-lipid A acceptor), not the first heptose transfer.
    action: MODIFY
    reason: >-
      The with/from protein is heptosyltransferase I, which adds the first heptose to Kdo2-lipid A; the
      asserted term names a late outer-core heptose transfer that neither WaaC performs. The sound part of
      the claim (an LPS heptosyltransferase) is GO:0008920, already accepted for this gene.
    proposed_replacement_terms:
    - id: GO:0008920
      label: lipopolysaccharide heptosyltransferase activity
    supported_by:
    - reference_id: file:PSEAE/waaC/waaC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes the addition of the first heptose unit to one 3-deoxy-D-manno-octulosonic acid (Kdo)
        residue of the Kdo2-lipid A module
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0071968
      corrected_value: GO:0008920
      corrected_label: lipopolysaccharide heptosyltransferase activity
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        GO:0071968 lipid A-core heptosyltransferase activity is defined as galactosyl-glucosyl3-heptosyl3-KDO2-lipid
        A-bisphosphate + ADP-heptose = lipid A-core + ADP. The with/from protein, Salmonella WaaC
        (P26469), is heptosyltransferase I (EC 2.4.99.23), which transfers the first heptose to Kdo2-lipid A.
        GO has no term for that reaction, so the correct term is the parent GO:0008920. The same row was
        made for waaF (PA5012), whose correct term is GO:0008713.
core_functions:
- description: >-
    Heptosyltransferase I: transfers the first heptose from ADP-heptose to Kdo2-lipid A, initiating inner
    core assembly of lipopolysaccharide at the cytoplasmic face of the inner membrane.
  molecular_function:
    id: GO:0008920
    label: lipopolysaccharide heptosyltransferase activity
  directly_involved_in:
  - id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
  supported_by:
  - reference_id: PMID:9171387
    supporting_text: >-
      Two plasmids, pCOREc1 and pCOREc2, which restored smooth LPS production in the waaC mutant, were
      isolated.
  - reference_id: file:PSEAE/waaC/waaC-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Catalyzes the addition of the first heptose unit to one 3-deoxy-D-manno-octulosonic acid (Kdo)
      residue of the Kdo2-lipid A module
proposed_new_terms:
- proposed_name: lipopolysaccharide heptosyltransferase I activity
  proposed_definition: >-
    Catalysis of the reaction: an alpha-Kdo-(2->4)-alpha-Kdo-(2->6)-lipid A + ADP-L-glycero-beta-D-manno-heptose
    = an L-alpha-D-Hep-(1->5)-[alpha-Kdo-(2->4)]-alpha-Kdo-(2->6)-lipid A + ADP + H+ (EC 2.4.99.23,
    RHEA:74067).
  justification: >-
    GO:0008920 has children for the heptosyltransferase II and III and lipid A-core reactions but none for
    the first heptose transfer performed by WaaC, which is why curators reach for ill-fitting siblings.
suggested_questions:
- question: >-
    Is waaC essential in P. aeruginosa PAO1, as the failure to isolate knockouts suggests, and is the
    requirement for the inner core or for outer-membrane integrity?
suggested_experiments:
- description: >-
    Conditional depletion of waaC in PAO1 with analysis of growth, LPS core structure by MS, and outer
    membrane permeability; in vitro Hep I assay with purified WaaC, ADP-heptose and Kdo2-lipid A.
