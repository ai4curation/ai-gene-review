id: Q59636
gene_symbol: ndk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Ndk (PA3807) is the 143-aa nucleoside diphosphate kinase of Pseudomonas aeruginosa. It
  transfers the gamma-phosphate of ATP to other ribo- and deoxyribonucleoside
  diphosphates by a ping-pong mechanism through a phosphohistidine intermediate
  (His117), maintaining the cellular pools of GTP, UTP, CTP and dNTPs. The full-length
  16-kDa enzyme is mainly cytoplasmic and non-specific; an intracellular protease
  generates a 12-kDa form that accumulates on the membrane in stationary phase and
  preferentially makes GTP, a preference also induced by complex formation with pyruvate
  kinase. Ndk activity is also associated with succinyl-CoA synthetase. By supplying GTP
  for GDP-mannose synthesis, Ndk supports production of the exopolysaccharide alginate.
references:
- id: PMID:8016083
  title: 'Characterization of nucleoside-diphosphate kinase from Pseudomonas aeruginosa:
    complex formation with succinyl-CoA synthetase.'
  findings:
  - statement: Ndk was purified from P. aeruginosa.
    supporting_text: >-
      The enzyme nucleoside-diphosphate kinase (Ndk), responsible for the conversion of
      (deoxy)ribonucleoside diphosphates to their corresponding triphosphates, has been
      purified from Pseudomonas aeruginosa.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:8606147
  title: 'Two forms of the nucleoside diphosphate kinase of Pseudomonas aeruginosa 8830:
    altered specificity of nucleoside triphosphate synthesis by the cell membrane-associated
    form of the truncated enzyme.'
  findings:
  - statement: The 16-kDa form is mainly cytoplasmic; the 12-kDa form is membrane-associated and prefers GTP synthesis.
    supporting_text: >-
      The 12-kDa form was found to be predominantly associated with the P. aeruginosa cell
      membrane fraction, whereas the 16-kDa form was predominantly cytoplasmic.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Source of the UniProt EXP cytoplasm row.
- id: PMID:8809750
  title: 'Nucleoside diphosphate kinase from Pseudomonas aeruginosa: characterization
    of the gene and its role in cellular growth and exopolysaccharide alginate synthesis.'
  findings:
  - statement: Cytosolic Ndk transfers the ATP terminal phosphate to other NDPs non-specifically.
    supporting_text: >-
      The cytosolic Ndk was non-specific in its transfer activity of the terminal phosphate
      from ATP to other nucleoside diphosphates.
  - statement: ndk hyperexpression partially restores alginate production in an algR2 mutant.
    supporting_text: >-
      Hyperexpression of ndk from pGWS95 in the P. aeruginosa algR2 mutant also restored
      alginate production to levels that were approximately 60% of wild type.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of four IDA rows; GO:0004550 seeds PTN000887110. Abstract only. It
      supports the activity directly; the alginate link is a rescue phenotype in a
      regulatory mutant (see the GO:0042121 row).
