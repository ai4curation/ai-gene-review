suggested_questions:
- question: >-
    Is the 12-kDa membrane-associated, GTP-preferring form of Ndk physiologically
    important, and which protease generates it (elastase has been proposed)?
suggested_experiments:
- description: >-
    Measure GTP pools and alginate in a clean ndk deletion of a mucoid strain, with and
    without a GTP-preferring truncated ndk allele, to separate precursor supply from
    regulatory effects.
