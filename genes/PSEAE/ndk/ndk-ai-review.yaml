- term:
    id: GO:0042121
    label: alginic acid biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:8809750
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA. The abstract reports that ndk hyperexpression partially restored
      alginate production in an algR2 regulatory mutant.
    action: REMOVE
    reason: >-
      Ndk performs no step of alginate synthesis; it supplies GTP, a co-substrate that the
      GDP-mannose pyrophosphorylase AlgA consumes. The evidence is a partial rescue of a
      pleiotropic regulatory mutant, a precursor-supply phenotype, and the authors' own
      link is through GTP availability. Necessity of a co-substrate is not participation.
      This row is not a PAINT seed.
    supported_by:
    - reference_id: PMID:8809750
      supporting_text: >-
        Hyperexpression of ndk from pGWS95 in the P. aeruginosa algR2 mutant also restored
        alginate production to levels that were approximately 60% of wild type.
    - reference_id: PMID:8809750
      supporting_text: >-
        The significance of GTP in signal transduction events within the cell and in the
        production of GDP-mannose, an essential alginate precursor, clearly indicates the
        importance of Ndk in cellular processes as well as in alginate synthesis.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0042121
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        PseudoCAP row for PA3807/ndk (Q59636), GO:0042121 alginic acid biosynthetic process,
        IDA, PMID:8809750 (Sundin et al. 1996). The abstract's alginate evidence is that ndk
        hyperexpression restored alginate to about 60% of wild type in an algR2 regulatory
        mutant, which the authors attribute to GTP supply for GDP-mannose. Ndk catalyses no
        step of alginate synthesis, and a rescue phenotype is not an IDA. Please delete the
        row (at most an IGI acts_upstream_of_or_within). PROBABLE because only the abstract
        was read.
      supported_by:
      - reference_id: PMID:8809750
        supporting_text: >-
          Hyperexpression of ndk from pGWS95 in the P. aeruginosa algR2 mutant also restored
          alginate production to levels that were approximately 60% of wild type.
