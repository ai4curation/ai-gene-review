taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: 'Tse6 (PA0093) is an antibacterial effector of the H1-type VI secretion system of Pseudomonas
  aeruginosa, delivered into neighbouring bacterial cells during contact-dependent competition. Its
  C-terminal Toxin_61 domain is an NAD(P)+ glycohydrolase: in the recipient cytoplasm it degrades
  NAD+ and NADP+, which kills the target cell. Unlike the Hcp-stabilised effectors of the same system,
  Tse6 carries a PAAR-repeat motif and is delivered on a cognate VgrG spike protein, one of two genetically
  distinct export routes through the same secretion machine. The gene lies in a bicistron with tsi6,
  which encodes the cytoplasmic immunity protein that binds and neutralises the toxin and so protects
  sibling cells; Tse6 is the toxin in that pair, not the protein that sequesters it.'
