      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0097351 on Q9I739 (tse6)
      corrected_value: GO:0097351 on Q9I740 (tsi6)
      cause: OTHER
      confidence: CONFIRMED
      explanation: 'GO:0097351 toxin sequestering activity is annotated by IMP from PMID:24589350
        to both halves of the tse6-tsi6 effector-immunity pair. The term describes binding a toxin
        to neutralise it, so it fits the immunity protein Tsi6 and inverts the role of the effector
        Tse6, which is the toxin being neutralised. The full text states the direction explicitly:
        the Tse6 Toxin_61 domain is a potent cytoplasmic toxin whose activity is specifically neutralized
        by Tsi6, and co-expression of Tsi6 but not of the non-cognate Tsi2 rescued viability. Suggested
