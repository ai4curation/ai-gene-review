- term:
    id: GO:0097351
    label: toxin sequestering activity
  evidence_type: IMP
  original_reference_id: PMID:24589350
  qualifier: enables
  review:
    summary: Toxin sequestering activity, asserted on the toxin itself.
    action: REMOVE
    reason: 'The relationship is inverted. GO:0097351 is defined as "Binding to a toxin to prevent
      it from interacting with other partners or to inhibit its localization to the area of the cell
      or complex where it is active" -- that is what an immunity protein does, and Tse6 is the toxin,
      not the protein that sequesters one. The cited paper says so in terms: the Toxin_61 domain of
      Tse6 is a potent cytoplasmic toxin whose activity is specifically neutralized by Tsi6, and co-expressing
      Tsi6 rescued cells from Tse6-CT toxicity. The row belongs to the cognate immunity protein tsi6,
      where it is also annotated from the same paper and is correct. This looks like a pair-level
      experiment entered on both halves of the effector-immunity bicistron; Tse6''s own activity is
      already captured by the NAD+ and NADP+ nucleosidase rows.'
    supported_by:
    - *id002
    - &id003
      reference_id: PMID:24589350
      supporting_text: the observed toxicity was specific to Tse6-CT as co-expression of Tsi6, but
        not the non-cognate cytoplasmic immunity protein Tsi2, provided full rescue of E. coli viability
    source_defects:
