    id: GO:0033103
    label: protein secretion by the type VI secretion system
  evidence_type: IDA
  original_reference_id: PMID:24589350
  qualifier: involved_in
  review:
    summary: Tse6 is exported by the H1-T6SS.
    action: ACCEPT
    reason: 'Core role, but not because Tse6 is exported: being carried by a secretion system is being
      its cargo, and under this project''s rule on involved_in a substrate is not a participant. The
      reason the term holds here is structural. Tse6 is an evolved PAAR protein, and PAAR repeats
      fold into a pyramidal structure that caps and sharpens the tip of the VgrG spike, so this protein
      supplies a component the secretion apparatus itself depends on. That is the scaffold case CLAUDE.md
      works through for thyroglobulin: the gene product contributes structure a step requires, rather
      than merely being acted on. It is also exactly what distinguishes tse6 from tsi6, whose identical
      row this review family marks over-annotated: Tsi6 is a cytoplasmic immunity protein contributing
      nothing to the apparatus.'
    supported_by:
    - &id001
      reference_id: PMID:26456113
      supporting_text: type VI secretion exported 6 (Tse6), is a predicted transmembrane protein that
        contains a PAAR repeat domain, is exported in a VgrG-dependent manner, and is active in the
        cytoplasm of target cells
    - &id002
