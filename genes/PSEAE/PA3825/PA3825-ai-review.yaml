taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3825 is a 526-aa inner-membrane c-di-GMP phosphodiesterase of Pseudomonas aeruginosa.
  Two predicted transmembrane helices flank a CSS-motif domain, which is probably periplasmic,
  and a C-terminal cytoplasmic EAL domain carries the variant EVL signature with an intact
  catalytic loop. The purified EAL domain hydrolyses c-di-GMP to pGpG in the presence of Mn2+,
  and crystal structures with substrate and product show a dimeric active site with a third
  metal-binding site next to the 5'-phosphate. Lysates of cells overexpressing PA3825 also
  degrade added c-di-GMP. Deleting the gene increases early surface attachment and biofilm
  biomass but leaves swimming, swarming and twitching unchanged, so PA3825 restrains biofilm
  formation by lowering c-di-GMP. The signal sensed by its periplasmic domain is unknown.
references:
- id: PMID:16477007
  title: >-
    Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases reveals
    a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: >-
      Lysates of a PA3825-overexpressing strain degraded 27% of added c-di-GMP (Table 1, read
      in PMC full text).
    supporting_text: >-
      Analysis of the phenotypes of DGC and PDE mutants and overexpressing clones revealed
      that certain virulence-associated traits are controlled by multiple DGCs and PDEs through
      alterations in c-di-GMP levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0071111 row and of PA3825 seeding PTN002105365. Cached
      copy is abstract-only; full text read on PMC (PMC1413825), verbatim excerpts in PA3825-notes.md.
      The assay is a crude lysate assay and the activity is weak (27%), but it is later confirmed
      by purified-domain kinetics (PMID:28186120).
- id: PMID:28186120
  title: >-
    Dimerisation induced formation of the active site and the identification of three metal
    sites in EAL-phosphodiesterases.
  findings:
  - statement: >-
      The purified PA3825 EAL domain hydrolyses c-di-GMP to pGpG with a kcat of 0.35 per second
      in the presence of Mn2+.
    supporting_text: >-
      In vitro PA3825EAL was able to convert c-di-GMP to pGpG, with a kcat of 0.35 ± 0.1 s−1,
      in the presence of Mn2+
  - statement: A PA3825 knockout had no motility phenotype.
    supporting_text: >-
      Neither swimming, swarming, nor twitching motilities were affected in the PA3825 knockout
      strain under conditions tested.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Purified-enzyme kinetics and structures (PDB 4Y8E, 4Y9P, 5MF5, 5MFU).
      The paper calls PA3825 a cytoplasmic protein, which conflicts with its two predicted
      TM helices; this does not affect the activity data.
- id: PMID:35935233
  title: >-
    Phenotypic and integrated analysis of a comprehensive Pseudomonas aeruginosa PAO1 library
    of mutants lacking cyclic-di-GMP-related genes.
  findings:
  - statement: Deletion of PA3825 increases early attachment and flow-cell biofilm biomass.
    supporting_text: >-
      deletion of two genes encoding EAL-harboring enzymes, PA2200 and PA3825, resulted in
      elevated attachment levels, as would be expected for genes encoding PDEs
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Library-scale screen; modest effects.
