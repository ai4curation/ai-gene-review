suggested_questions:
- question: >-
    What does the PA4909-PA4913 HAAT system import? Its predicted periplasmic
    binding protein (probably PA4913) would set the substrate; the PA4912 and PA4910 mutants point to
    D-alanine and D-valine.
suggested_experiments:
- description: >-
    Ligand screening (thermal shift or ITC) of the purified predicted periplasmic
    binding protein of the PA4909-PA4913 operon with D- and L-amino acids, and radiolabelled
    D-alanine uptake in wild-type, PA4912 and braC/PA4912 double mutants.
  experiment_type: transport assay
