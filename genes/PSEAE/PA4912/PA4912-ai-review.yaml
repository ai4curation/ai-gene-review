  review:
    summary: >-
      Propagated from E. coli LivH at the LivH node PTN000765102. PA4912 belongs to
      a paralogous HAAT system whose substrate is unknown.
    action: UNDECIDED
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000765102
        source_label: PTN000765102
        source_status: UNRESOLVED
        comment: >-
          LivH permease node spanning several paralogous HAAT systems per genome; substrate
          specificity is set by each system's binding protein, not by the permease.
      - source_id: UniProtKB:P0AEX7
        source_label: E. coli LivH
        source_status: UNRESOLVED
        comment: Experimental for E. coli LIV-I; transfer to the PA4909-PA4913 paralogous system is untested.
    reason: >-
      In this family the substrate range is set by the partner periplasmic binding
      protein, not by the permease. The PA4909-PA4913 system has no transport or
      binding data, and its only phenotype is a weak D-alanine/D-valine growth
      defect; the screen recorded no L-valine phenotype for PA4912 (which could be
      masked by the Bra system). Branched-chain substrates are plausible from
      family membership but not shown.
    supported_by:
    - reference_id: PMID:18833300
      supporting_text: >-
        Disruption of PA4910 resulted in reduced utilization of D-Alanine (as a
        nitrogen source), while PA4912 mutants had disrupted D-Alanine and
        D-Valine utilization (Table 2).
