id: Q9HUQ1
gene_symbol: PA4912
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4912 is a predicted integral inner-membrane permease subunit of an
  uncharacterised hydrophobic amino acid (HAAT family, LivH-type) ABC importer of
  Pseudomonas aeruginosa, encoded in a five-gene operon (PA4909-PA4913) that is a
  paralogue of the braCDEFG (LIV-I) branched-chain amino acid transport operon. It
  has nine predicted transmembrane helices and the BPD_transp_2 permease domain.
  The substrate of this second system has not been determined biochemically; in a
  transposon-mutant growth screen the PA4912 mutant used D-alanine and D-valine
  less well as nitrogen sources.
