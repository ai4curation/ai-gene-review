suggested_questions:
- question: >-
    Does Bfd transfer electrons directly to the BfrB heme in vivo, and what is its
    physiological electron donor (FPR or another reductase)?
suggested_experiments:
- description: >-
    Stopped-flow measurement of electron transfer from reduced Bfd to the BfrB heme,
    with FPR/NADPH as donor, comparing wild type and interface mutants that block
    BfrB-Bfd binding.
