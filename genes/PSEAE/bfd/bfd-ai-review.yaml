id: Q9HY80
gene_symbol: bfd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Bfd (PA3530) is a small (73-residue) bacterioferritin-associated ferredoxin of
  Pseudomonas aeruginosa that carries a [2Fe-2S] cluster bound by a Fer2_BFD
  (BFD-like) domain and is induced by iron starvation. Bfd binds the BfrB subunits
  of the bacterioferritin complex and is required to mobilize stored iron from its
  core; the [2Fe-2S] cluster is needed for this, and electrons are thought to pass
  from the ferredoxin reductase FPR through Bfd and the BfrB heme to reduce the
  Fe(3+) mineral and release Fe(2+). Bfd is not an efficient electron donor to heme
  oxygenase.
