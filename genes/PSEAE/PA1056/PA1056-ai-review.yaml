core_functions:
- description: >-
    Subunit D (ShaD/MrpD) of the Sha multisubunit Na+/H+ antiporter, which
    extrudes Na+ across the cytoplasmic membrane in exchange for H+. It is
    proposed to form part of the proton-translocating machinery and is
    needed for complex assembly; it contributes to the activity of the
    complex rather than acting alone.
  contributes_to_molecular_function:
    id: GO:0015385
    label: sodium:proton antiporter activity
  directly_involved_in:
  - id: GO:0035725
    label: sodium ion transmembrane transport
  - id: GO:1902600
    label: proton transmembrane transport
  locations:
