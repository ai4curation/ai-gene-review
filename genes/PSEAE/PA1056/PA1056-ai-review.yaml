    label: plasma membrane
  supported_by:
  - reference_id: PMID:16030218
    supporting_text: >-
      genes PA1054 to PA1059 encode a Na+/H+ antiporter that is largely
      responsible for Na+ extrusion in P. aeruginosa
  - reference_id: PMID:29218041
    supporting_text: >-
      In previous studies, none of the Mrp antiporters exhibited antiport
      activity with MrpA or MrpD alone.
suggested_questions:
- question: >-
    Should GO provide a cellular component term for the Mrp-type
    multisubunit Na+/H+ antiporter complex, by analogy with GO:1903103
    potassium:proton antiporter complex, so that Sha/Mrp subunits can be
    annotated to the complex instead of each carrying the activity?
- question: >-
    Should the InterPro2GO mapping of IPR003918 to NADH dehydrogenase
    (ubiquinone) activity be restricted so it does not reach Mrp antiporter
    subunit D proteins (IPR050586)?
suggested_experiments:
- description: >-
    Make an in-frame PA1056 (shaD) deletion in P. aeruginosa, then measure
    Na+ tolerance, Na+ efflux and Sha complex assembly (BN-PAGE), with
    complementation in trans; mutate the conserved MrpD Lys/Glu pair to test
    its role in the coupled H+ and Na+ movements.
