gene_symbol: PA1056
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1056 encodes subunit D (ShaD/MrpD) of the Sha (Mrp/Mnh/Pha) multisubunit
  Na+/H+ antiporter of Pseudomonas aeruginosa PAO1. It is a 499-residue
  integral membrane protein with 14 predicted transmembrane helices, in the
  CPA3 subunit D family, homologous to the antiporter-like NuoM and NuoN
  subunits of respiratory complex I. It is the third gene of the six-gene sha
  cluster PA1054-PA1059, in which shaA and shaB are fused. The cluster
  restores Na+ tolerance and Na+/H+ antiport to an E. coli strain lacking its
  major antiporters, and in P. aeruginosa the Sha antiporter is largely
  responsible for Na+ extrusion and supports virulence in mouse infection
  models. In Bacillus Mrp antiporters, MrpD is needed for Na+ tolerance and
  for assembly of the complex, and with MrpA it is proposed to carry the
  proton-translocating part of the antiport cycle. Antiport needs the
  hetero-oligomeric complex of all subunits.
