id: Q9I3N5
gene_symbol: ccmC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CcmC is a six-transmembrane inner-membrane protein of the System I cytochrome
  c maturation (Ccm) pathway. As the heme-handling subunit of the CcmABCD
  ABC-type complex, it binds heme through a conserved periplasmic
  tryptophan-rich (WWD/WxWD) domain and presents it for covalent attachment to
  the periplasmic heme chaperone CcmE; ATP hydrolysis by CcmA then releases
  holo-CcmE, which delivers heme to the CcmFH heme lyase for attachment to
  apocytochromes c. In P. aeruginosa, loss of ccmC abolishes c-type cytochrome
  production and causes broad secondary phenotypes, including loss of
  pyoverdine and catalase activity, porphyrin accumulation, reduced [Fe-S]
  cluster content and altered quorum-sensing-regulated traits and motility.
