- id: PMID:16824107
  title: ABC transporter-mediated release of a haem chaperone allows cytochrome c
    biogenesis.
  findings:
  - statement: >-
      E. coli CcmA2B1C1 complex is needed for ATP-dependent release of
      holo-CcmE; without CcmA or CcmB, holo-CcmE stays in a dead-end complex
      with CcmC.
    supporting_text: >-
      In the absence of CcmA or CcmB, holo(haem)CcmE binds to CcmC in a stable
      dead-end complex, indicating high affinity binding of haem to CcmC.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified (Feissner et al. 2006, Mol Microbiol 61:219-31). The
      abstract describes CcmABC complex biochemistry without naming the
      organism (MeSH: Escherichia coli; no Pseudomonas). It supports the CcmC heme-handling mechanism, but it is the
      cited source for all six PseudoCAP IMP phenotype rows on PA1477
      (catalase, pyoverdine, glycolipid, three motility terms), none of which
      its abstract reports; whether the full text does is unverified. Those phenotypes match PMID:18174132 (Baert et al. 2008),
      the P. aeruginosa ccmC mutant paper. Abstract-only.
- id: PMID:18174132
  title: Multiple phenotypic alterations caused by a c-type cytochrome maturation
    ccmC gene mutation in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Of the P. aeruginosa ccm mutants tested, only ccmC completely lost
      cytochrome c. It also showed pleiotropic loss of pyoverdine, catalase,
      motility and rhamnolipid.
    supporting_text: >-
      Only in the case of the ccmC mutant was cytochrome c production totally
      abrogated.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Baert et al. 2008, Microbiology 154:127-138). The
      P. aeruginosa ccmC mutant study that the PseudoCAP phenotype rows
      evidently derive from. Abstract-only here; the phenotypes are indirect
      consequences of losing heme and cytochrome c maturation.
- id: PMID:14663086
  title: Co-ordination of iron acquisition, iron porphyrin chelation and iron-protoporphyrin
    export via the cytochrome c biogenesis protein CcmC in Pseudomonas fluorescens.
  findings:
  - statement: >-
      P. fluorescens ccmC mutant accumulates protoporphyrin IX and has reduced
      heme-catalase-mediated oxidative stress resistance.
    supporting_text: >-
      Significantly reduced resistance to oxidative stress mediated by
      haem-containing catalases was observed for the ccmC mutant.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; P. fluorescens orthologue, abstract-only.
- id: PMID:12123798
  title: Impaired maturation of the siderophore pyoverdine chromophore in Pseudomonas
    fluorescens ATCC 17400 deficient for the cytochrome c biogenesis protein CcmC.
  findings:
  - statement: >-
      The pyoverdine defect of ccmC mutants is attributed to a lack of
      periplasmic oxidizing power.
    supporting_text: >-
      We suggest that the conversion of ferribactin to pyoverdine does not take
      place in the DeltaccmC mutant because of lack of oxidizing power in the
      periplasm.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; P. fluorescens orthologue, abstract-only.
- id: PMID:9822820
  title: Different residues in periplasmic domains of the CcmC inner membrane protein
    of Pseudomonas fluorescens ATCC 17400 are critical for cytochrome c biogenesis
    and pyoverdine-mediated iron uptake.
  findings:
  - statement: >-
      Six-TM topology of CcmC; some periplasmic residues affect pyoverdine
      without affecting cytochrome c.
    supporting_text: >-
      A topological model for CcmC, based on the analysis of alkaline
      phosphatase fusions, predicts six membrane-spanning regions with three
      periplasmic loops.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; P. fluorescens orthologue, abstract-only.
- id: PMID:11384983
  title: Physical interaction of CcmC with heme and the heme chaperone CcmE during
    cytochrome c maturation.
  findings:
  - statement: E. coli CcmC binds heme directly and is sufficient to load heme onto
      CcmE.
    supporting_text: >-
      CcmC is necessary and sufficient to incorporate heme into CcmE.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; E. coli orthologue.
- id: PMID:20599545
  title: The CcmC:heme:CcmE complex in heme trafficking and cytochrome c biosynthesis.
  findings:
  - statement: The periplasmic WWD domain of E. coli CcmC binds heme directly.
    supporting_text: >-
      For the first time, evidence that the external WWD domain of CcmC
      interacts directly with heme is presented.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; E. coli orthologue.
- id: PMID:36307425
  title: Structures of the CcmABCD heme release complex at multiple states.
  findings:
  - statement: Cryo-EM of E. coli CcmABCD places the heme-binding site in CcmC.
    supporting_text: >-
      We locate the ATP-binding site in CcmA and the heme-binding site in CcmC.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; E. coli orthologue.
- id: PMID:37626034
  title: Architecture of the Heme-translocating CcmABCD/E complex required for Cytochrome
    c maturation.
  findings:
  - statement: >-
      CcmABCD flops heme across the membrane at the CcmBC interfaces; the CcmC
      WxWD motif positions heme for attachment to CcmE.
    supporting_text: >-
      Our data suggest that the complex flops a heme group from the inner to the
      outer leaflet at its CcmBC interfaces, driven by ATP hydrolysis at CcmA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; E. coli orthologue.
