suggested_questions:
- question: >-
    Why does losing ccmC have a stronger effect on pyoverdine, catalase and
    porphyrin homeostasis than losing other ccm genes, and do some
    P. fluorescens CcmC substitutions (W115/G116) really affect pyoverdine
    without affecting cytochrome c? Is there a cytochrome c-independent role
    in heme or porphyrin export?
- question: >-
    Can GO Central withdraw the catalase activity IBD at PTN001247822, whose
    only seed was a PseudoCAP IMP mutant-phenotype row?
suggested_experiments:
- description: >-
    Express P. aeruginosa CcmC point mutants that abolish CcmE heme loading
    but keep the protein stable, and measure pyoverdine, catalase activity and
    porphyrin accumulation. This tests whether every secondary phenotype
    follows from losing cytochrome c maturation or from a separate CcmC
    heme-export role.
  experiment_type: site-directed mutagenesis with phenotypic profiling
