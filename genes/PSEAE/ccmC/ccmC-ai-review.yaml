- term:
    id: GO:0004096
    label: catalase activity
  evidence_type: IMP
  original_reference_id: PMID:16824107
  qualifier: enables
  review:
    summary: >-
      A ccmC mutant has no detectable catalase activity. That phenotype shows
      that heme supply to the catalases depends on CcmC, not that CcmC is a
      catalase. The cited PMID also appears to be the wrong paper.
    action: REMOVE
    reason: >-
      A molecular function asserted from loss of an enzyme activity in a
      mutant extract is an indirect phenotype. The catalases of P. aeruginosa
      (KatA, KatB, KatE) are separate heme enzymes. CcmC is a polytopic
      membrane protein that binds heme for delivery to CcmE, and both papers
      that report the phenotype attribute it to heme deficiency or porphyrin
      accumulation. The row is also keyed to PMID:16824107, a Ccm
      biochemistry paper (indexed under E. coli) whose abstract reports no
      catalase assay. This row is the sole seed of the PAINT IBD
      at PTN001247822.
    supported_by:
    - reference_id: PMID:18174132
      supporting_text: >-
        The ccmC mutant was also found to accumulate porphyrins, and catalase
        production was undetectable, consistent with the increased sensitivity
        to hydrogen peroxide.
    - reference_id: PMID:14663086
      supporting_text: >-
        Significantly reduced resistance to oxidative stress mediated by
        haem-containing catalases was observed for the ccmC mutant.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0004096
      confidence: CONFIRMED
      explanation: >-
        enables GO:0004096 catalase activity (IMP) on PA1477 ccmC records the
        mutant phenotype "catalase production was undetectable" (PMID:18174132)
        as a molecular function of CcmC. CcmC is a heme-handling subunit of the
        cytochrome c maturation complex, not a catalase. Please delete this
        row. It is the sole seed of the PAINT IBD at PTN001247822, which
        propagates catalase activity to about 143 proteins.
    - defect_type: WRONG_REFERENCE
      resource: PSEUDOCAP
      slot: DB:Reference
      requested_change: REPOINT
      asserted_value: PMID:16824107
      corrected_value: PMID:18174132
