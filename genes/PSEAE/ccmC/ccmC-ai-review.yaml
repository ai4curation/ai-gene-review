- term:
    id: GO:0002049
    label: pyoverdine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:16824107
  qualifier: involved_in
  review:
    summary: >-
      A P. aeruginosa ccmC mutant makes very little pyoverdine, but CcmC is not
      known to do any step of pyoverdine synthesis or maturation. The cited
      PMID is a Ccm biochemistry paper indexed under E. coli; the phenotype is
      reported by Baert et al. 2008.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The pyoverdine defect of ccmC mutants is real (P. aeruginosa,
      PMID:18174132; P. fluorescens, PMID:9822820, PMID:12123798). It shows
      that ccmC is necessary, not that CcmC takes part in the process. The
      proposed explanation is indirect: ferribactin-to-pyoverdine conversion
      fails for lack of periplasmic oxidizing power, which depends on c-type
      cytochromes. In P. fluorescens some CcmC substitutions affect pyoverdine
      without affecting cytochrome c, so a more direct contribution cannot be
      excluded. That is not enough to assert participation. The cited
      reference also appears to be wrong (see source_defects).
    supported_by:
    - reference_id: PMID:18174132
      supporting_text: >-
        The production of the siderophore pyoverdine was very low and growth
        under the condition of iron limitation was severely restricted
    - reference_id: PMID:12123798
      supporting_text: >-
        We suggest that the conversion of ferribactin to pyoverdine does not
        take place in the DeltaccmC mutant because of lack of oxidizing power in
        the periplasm.
    - reference_id: PMID:9822820
      supporting_text: >-
        Simultaneous replacements of residues Trp-115 and Gly-116 in the second
        periplasmic loop substantially affected pyoverdine production/utilization
        but not cytochrome c production.
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: PSEUDOCAP
      slot: DB:Reference
      requested_change: REPOINT
      asserted_value: PMID:16824107
      corrected_value: PMID:18174132
      corrected_label: >-
        Baert et al. 2008, Multiple phenotypic alterations caused by a c-type
        cytochrome maturation ccmC gene mutation in Pseudomonas aeruginosa
      cause: IDENTIFIER_TRANSPOSITION
      confidence: PROBABLE
      explanation: >-
        The abstract of PMID:16824107 (Feissner et al. 2006, Kranz lab)
        describes a biochemical study of the CcmA2B1C1 complex releasing
        holo-CcmE. It does not name the organism (MEDLINE indexes it under
        Escherichia coli, not Pseudomonas) and describes no mutant phenotypes;
        the full text was not available here. The pyoverdine, catalase, rhamnolipid, swarming and
        twitching phenotypes annotated to PA1477 are those of the P. aeruginosa
        ccmC mutant in the abstract of PMID:18174132. All six PseudoCAP IMP rows on PA1477
        dated 2019-03-11 cite PMID:16824107 and should be re-keyed.
      supported_by:
      - reference_id: PMID:18174132
        supporting_text: >-
          Interestingly, other traits were also strongly affected by the ccmC
          mutation, including the production of pyocyanin, swarming and
          twitching motility, and rhamnolipid production.
