- term:
    id: GO:0015232
    label: heme transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003557
  review:
    summary: >-
      CcmC is the heme-handling membrane subunit of the CcmABCD heme-export
      complex. Cryo-EM structures of the E. coli complex support ATP-driven
      heme translocation at the CcmB/CcmC interface and transfer to CcmE.
    action: ACCEPT
    reason: >-
      This is the family-level function in the protein name (heme exporter
      protein C). Strictly, the transport activity belongs to the CcmABCD
      complex, in which CcmC binds the heme and CcmA hydrolyses ATP, and
      whether heme is translocated or only ligated to CcmE has been debated.
      The 2023 structure favours translocation at the CcmBC interfaces.
      Accepted as the best available MF term for the core role.
    supported_by:
    - reference_id: PMID:37626034
      supporting_text: >-
        Our data suggest that the complex flops a heme group from the inner to
        the outer leaflet at its CcmBC interfaces, driven by ATP hydrolysis at
        CcmA.
    - reference_id: PMID:36307425
      supporting_text: >-
        CcmABCD represents an ABC transporter complex using the energy of ATP
        hydrolysis for the transfer of heme from one binding partner (CcmC) to
        another (CcmE).
