suggested_questions:
- question: >-
    PctC mediates histamine chemotaxis without binding histamine. Is the signal relayed by a periplasmic
    binding protein or by a histamine-derived ligand, or does PctC act through receptor array cooperativity
    with TlpQ?
suggested_experiments:
- description: >-
    Test histamine chemotaxis of a PctC ligand binding site mutant that no longer binds GABA, in a tlpQ
    background, to see whether histamine sensing by PctC requires its own ligand pocket.
