gene_symbol: pctC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PctC (PA4307) is a methyl-accepting chemotaxis protein (MCP) of Pseudomonas aeruginosa PAO1, one of
  three paralogous amino acid chemoreceptors encoded in the pctC-pctA-pctB region. It is an inner-membrane
  receptor with two transmembrane helices flanking a periplasmic dCache_1 (double PDC) ligand binding
  region, followed by a cytoplasmic HAMP domain and the MCP signalling domain that couples to the
  CheA-CheW chemosensory array. Its ligand binding region binds L-histidine and L-proline and, with
  strong preference, gamma-aminobutyrate (GABA), and the receptor mediates chemotaxis towards these
  compounds. PctC also contributes, together with PctA and TlpQ, to chemotaxis towards histamine without
  binding it, and to repellent responses to trichloroethylene, chloroform and methylthiocyanate. PctC
  arose from a duplication of pctA in the common ancestor of the genus Pseudomonas.
