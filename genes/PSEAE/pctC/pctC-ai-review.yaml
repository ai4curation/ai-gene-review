core_functions:
- description: >-
    Inner-membrane chemoreceptor for GABA, L-histidine and L-proline. Its periplasmic dCache_1 ligand
    binding region binds these ligands, and the cytoplasmic HAMP and MCP signalling domains relay the
    signal to the CheA-CheW chemosensory array to drive chemotaxis towards them.
  supported_by:
  - reference_id: PMID:23650915
    supporting_text: In addition, PctC-LBR recognized GABA but not any other structurally related compound.
  - reference_id: PMID:23650915
    supporting_text: Bacteria were efficiently attracted to l-Gln and GABA, but mutation of pctB and pctC,
      respectively, abolished chemoattraction.
  - reference_id: PMID:9353923
    supporting_text: The pctB and pctC genes complemented the defect in chemotaxis to only seven (Ala,
      Arg, Glu, Lys, Met, Tyr, Gln) and two (His, Pro) L-amino acids, respectively.
