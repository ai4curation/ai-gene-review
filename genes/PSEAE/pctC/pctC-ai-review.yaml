  review:
    summary: >-
      PseudoCAP IMP seed for the PAINT IBD at PTN001280296. The abstract states that deletion of the
      whole pctC-orf1-pctA-pctB region abolished chemotaxis to all 20 L-amino acids and that pctC on
      a plasmid restored chemotaxis to His and Pro; a later pctC mutant lost chemoattraction to GABA
