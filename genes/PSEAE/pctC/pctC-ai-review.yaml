  evidence_type: IC
  original_reference_id: PMID:23650915
  qualifier: enables
  review:
    summary: >-
      Proposed core molecular function, absent from GOA for this gene although assigned to other P. aeruginosa
      transmembrane MCPs (for example CtpH and CtpM via InterPro2GO).
    action: NEW
    reason: >-
      Two independent lines agree. The protein has two transmembrane helices around a periplasmic
      dCache_1 ligand binding region that binds its ligands directly, and its cytoplasmic HAMP-MCP signalling
      domain mediates the chemotactic response in vivo. Ligand binding outside and signalling inside
      is the definition of transmembrane signaling receptor activity. IC because no single assay tests
      transmembrane signalling itself.
