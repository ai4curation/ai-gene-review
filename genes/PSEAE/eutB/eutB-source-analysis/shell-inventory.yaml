conclusion: PAO1 has zero matches for each of PF00936,PF03319,IPR000249 and IPR004992; the Ecoli control
  recovers four BMC-domain proteins and one EutN/CcmL vertex protein.
interpretation: Together with the compact PAO1 eut locus, this argues against automatic transfer of the
  enterobacterial Eut microcompartment location. It is an annotated-signature inventory, not microscopy
  and not proof that a highly divergent or novel shell is impossible. Absence of shell signatures alone
  does not establish whether the unencapsulated enzyme is soluble or membrane-associated.
