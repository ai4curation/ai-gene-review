exact_excerpts:
- The exaC , PA4021 , PA4022 , eat , eat-eutBC , and PA4022-eat-eutBC genes were PCR amplified from genomic
  DNA of P. aeruginosa PAO1.
- The large and small subunits of ethanolamine-ammonia lyase are putatively encoded by the PA4024 ( eutB
  ) and PA4025 ( eutC ) genes, respectively.
- As a carbon source, the Δ PA4021 and Δ eutB mutants exhibited no growth on ethanolamine
- As a nitrogen source in the presence of succinate, the Δ PA4021 and Δ eutB mutants exhibited no growth
  on ethanolamine.
- Plasmid-based expression of the PA4022-eat-eutBC genes fully restored the growth of the Δ eutB mutant
- The PA4022-eat-eutBC operon encodes a central catabolic pathway for ethanolamine.
assay_scope: The native PAO1 eutB deletion loses growth with ethanolamine as carbon or nitrogen source;
  genomic PAO1 operon constructs restore pathway function. The paired eutB/eutC identities are grounded
  by their native loci, official sequences and conserved family/complex assignments. EutC alone was not
  deleted or assayed in this paper, and no isolated PAO1 EutB/EutC purification or kinetic constants are
  asserted. Standard growth conditions were pH7.0,20mM substrate and supplied cyanocobalamin; use of a
  precursor in culture does not replace the need for active intracellular adenosylcobalamin.
