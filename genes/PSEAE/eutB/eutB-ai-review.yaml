id: Q9HX03
gene_symbol: eutB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: EutB (PA4024) is the large subunit of the adenosylcobalamin-dependent ethanolamine ammonia-lyase
  of Pseudomonas aeruginosa PAO1. With the adjacent small subunit EutC (PA4025), it converts ethanolamine
  to acetaldehyde and ammonium, supporting ethanolamine use as a carbon or nitrogen source. The large
  subunit supplies the conserved substrate-binding catalytic barrel, while cobalamin binds at the subunit
  interface. The genes belong to the compact PA4022-eat-eutBC operon controlled by EatR and RpoN. Acetaldehyde
  is oxidized downstream by PA4022 and related aldehyde dehydrogenases; ammonia release and sustained
  carbon assimilation are distinct outcomes.
