suggested_questions:
- question: How do the PAO1 EutBC complex and downstream aldehyde dehydrogenases coordinate acetaldehyde
    flux without a recognized Eut shell?
- question: Does PAO1 EutBC associate with membranes or metabolic partners, and how does cofactor maintenance
    constrain sustained flux?
suggested_experiments:
- description: Purify the matched PAO1 Q9HX03/Q9HX02 complex, determine native subunit stoichiometry and
    cofactor-dependent ethanolamine cleavage, and compare measured kinetics with cellular flux under carbon-
    and nitrogen-source conditions.
  experiment_type: Complex biochemistry and isotope-resolved metabolism
