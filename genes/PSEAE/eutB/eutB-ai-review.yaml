  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0544
  review:
    summary: The enterobacterial microcompartment location is not supported for the compact PAO1 system.
    action: REMOVE
    reason: The automatic location derives from a conserved-enzyme rule, not a PAO1 compartment experiment.
      The official PAO1 reference proteome has no recognized BMC-shell or EutN/CcmL vertex signatures,
      while identical queries detect the E. coli shell set; the experimentally mapped PAO1 operon is compact.
      Thus the electronic transfer of a protein-enclosed Eut organelle is inappropriate for this target.
      The inventory does not prove that a novel divergent shell is impossible and does not by itself establish
      soluble versus membrane-associated localization.
    supported_by:
    - reference_id: file:PSEAE/eutB/eutB-source-analysis/shell-inventory.yaml
      supporting_text: PAO1 has zero matches for each of PF00936,PF03319,IPR000249 and IPR004992; the
        Ecoli control recovers four BMC-domain proteins and one EutN/CcmL vertex protein.
