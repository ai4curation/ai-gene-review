    summary: Replace amino-acid metabolism with the supported ethanolamine-catabolic process.
    action: MODIFY
    reason: GO:0006520 explicitly concerns amino acids, defined as carboxylic acids with amino groups.
      Ethanolamine is an amino alcohol without a carboxyl group. The EutB/EutC family assignment and native
      PAO1 pathway evidence support ethanolamine breakdown instead. This is a lateral chemical-scope correction,
      not a claim that GO:0046336 is a descendant or that every untested amino-alcohol substrate is physiological.
