    label: protein-DNA complex
  supported_by:
  - reference_id: PMID:18458065
    supporting_text: >-
      We show that the predicted TetR family transcriptional repressor encoded
      by the PA2931 gene, which is immediately adjacent to and divergently
      transcribed from the cif-containing, three-gene operon, negatively
      regulates cif gene expression by binding to the promoter region
      immediately upstream of the cif-containing operon.
  - reference_id: PMID:22843844
    supporting_text: >-
      Mutagenesis of the operator proximal to morB resulted in an increase in
      expression of both the cif and cifR transcripts, suggesting that both
      sites are required for complete repression of each of these genes.
  - reference_id: PMID:39413156
    supporting_text: >-
      We also determined that cysteine residue Cys107 is critical for epoxide
      sensing and DNA release.
suggested_questions:
- question: >-
    What is the physiological epoxide that CifR senses in the airway, and is
    Cys107 modified covalently by it or only by oxidants such as
    N-ethylmaleimide in vitro?
- question: >-
    Should GO have a term for epoxide-responsive (ligand-released) repressor
    activity, or is the sensing better captured as an epoxide-binding molecular
    function on CifR once the physiological ligand is identified?
suggested_experiments:
- description: >-
    Determine whether CifR binds epoxides directly and whether Cys107 is
    covalently modified in vivo: mass spectrometry of CifR from
    epoxide-exposed P. aeruginosa, with Cys107 substitution mutants assayed for
    operator occupancy (ChIP) and for cif derepression.
