- id: PMID:18458065
  title: Cif is negatively regulated by the TetR family repressor CifR.
  findings:
  - statement: >-
      PA2931 (renamed CifR) binds the promoter region upstream of the cif
      operon and represses cif; the epoxide epibromohydrin disrupts the
      protein-DNA interaction in vitro and induces cif expression.
    supporting_text: >-
      We show that the predicted TetR family transcriptional repressor encoded
      by the PA2931 gene, which is immediately adjacent to and divergently
      transcribed from the cif-containing, three-gene operon, negatively
      regulates cif gene expression by binding to the promoter region
      immediately upstream of the cif-containing operon.
  - statement: >-
      Clinical isolates with high cif expression have reduced cifR expression.
    supporting_text: >-
      Finally, we demonstrate that P. aeruginosa strains isolated from cystic
      fibrosis patient sputum with increased cif gene expression are impaired
      for the expression of the cifR gene.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Infect Immun 2008, PMC2446692); abstract only in the
      cache (PMC returned no body text), but the abstract itself states the
      organism, the purified-protein promoter binding and the repression, which
      is what the PseudoCAP IMP row asserts.
- id: PMID:22843844
  title: Epoxide-mediated CifR repression of cif gene expression utilizes two binding
    sites in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Two 27-bp CifR operators in the cifR-morB intergenic region overlap the
      -10 and +1 elements of both divergent promoters; mutating them abolishes
      binding in vitro and increases cif and cifR transcription in vivo.
    supporting_text: >-
      Mutagenesis of these binding sites resulted in a loss of DNA binding in
      vitro, and mutation of one of these sites in vivo resulted in an increase
      in transcription of both the cif and cifR genes.
  - statement: CifR binds at two operators, unlike single-site TetR-family repressors.
    supporting_text: >-
      However, these repressors have all been shown to bind at a single site to
      mediate repression of the operon as either a dimer or a dimer of dimers (
      4 , 33 , 35 ), whereas CifR binds at two distinct operators, separated by
      28 bp, to control the expression of divergently transcribed loci.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; the source of the CollecTF EXP, IEP and IMP rows, and
      consistent with them.
- id: PMID:39413156
  title: Molecular basis for the transcriptional regulation of an epoxide-based virulence
    circuit in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Structures of free CifR and of the CifR-operator complex show one dimer
      per operator, with the N-terminal extension in the DNA minor groove;
      Cys107 is required for epoxide sensing and DNA release.
    supporting_text: >-
      We also determined that cysteine residue Cys107 is critical for epoxide
      sensing and DNA release.
  - statement: Epibromohydrin releases CifR from the intergenic operators, permitting transcription.
    supporting_text: >-
      Furthermore, EBH disrupts CifR binding to the intergenic promoter region,
      permitting transcription of cifR and the three divergently transcribed
      genes including cif ( 16 , 18 ) (Figure 1; bottom row).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; the source of the PDB entries (6NSM, 6NSN, 6NSR) and of
      the Cys107 modifications in the UniProt entry. Not yet used in GOA.
core_functions:
- description: >-
    Epoxide-responsive TetR-family repressor of the cif virulence operon. As a
    homodimer it occupies two operators in the cifR-morB intergenic region,
    repressing both the morB-cfrX-cif transcript and its own; epoxide binding,
    through Cys107 in the ligand-binding domain, releases it from DNA and
    derepresses cif.
