gene_symbol: cifR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CifR is a 196-residue TetR-family transcriptional repressor encoded
  divergently from the morB-cfrX-cif operon. As a homodimer it binds two
  operators in the cifR-morB intergenic region, which overlap the start sites
  of both divergent transcripts, and so represses the cif operon, encoding the
  secreted epoxide hydrolase virulence factor Cif, as well as its own gene.
  CifR is an epoxide sensor: the xenobiotic epoxide epibromohydrin releases it
  from the operator in vitro and derepresses cif in vivo, and the conserved
  ligand-binding-domain cysteine Cys107, seen oxidised to sulfenic and sulfinic
  acid in the crystal structures, is required for epoxide-triggered DNA
  release. Crystal structures of free CifR and of the CifR-operator complex
  show one dimer bound per operator, with the N-terminal extension reading the
  DNA minor groove.
