suggested_questions:
- question: >-
    The PTN000201223 TCA-cycle IBD (seeded by yeast CIT1/CIT3 and S. pombe cit1) propagates
    to the bacterial PrpC subclade, whose members are mainly 2-methylcitrate synthases
    beside a dedicated GltA. Should the TCA-cycle term be placed on a node that excludes
    the PrpC subclade?
suggested_experiments:
- description: >-
    Quantify the share of cellular citrate synthase flux carried by PrpC in wild-type
    P. aeruginosa on propionate-containing media (13C tracing in gltA+ and prpC strains).
