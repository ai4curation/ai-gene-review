id: Q9I5E3
gene_symbol: prpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PrpC (PA0795) is the 2-methylcitrate synthase of Pseudomonas aeruginosa, the first enzyme
  of the 2-methylcitrate cycle that converts propionyl-CoA and oxaloacetate to
  2-methylcitrate during propionate catabolism. It is a cytoplasmic homodimer of about
  41-kDa subunits of the citrate synthase fold, whose structure has been solved with and
  without bound oxaloacetate. The purified enzyme is promiscuous, condensing acetyl-CoA
  with oxaloacetate to citrate at rates comparable to its 2-methylcitrate synthase
  activity. A prpC deletion cannot grow on propionate. prpC lies in the PrpR-repressed prp
  operon; basal PrpC expression rescues a mutant lacking the TCA-cycle citrate synthase
  GltA, and gltA mutants are selected for mutations that derepress prpC.
references:
- id: PMID:7626013
  title: Purification and characterization of citrate synthase isoenzymes from Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      Two native citrate synthases were purified, a hexameric CSI and a dimeric CSII;
      no gene was identified.
    supporting_text: >-
      Chemical cross-linking of the native enzymes with either dimethyl suberimidate or
      glutaraldehyde followed by electrophoretic analysis by SDS/PAGE showed that CSI is a
      hexamer and CSII is a dimer.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0036440 and GO:0006099 rows, both seeds of
      PTN000201223; the same rows were also given to gltA (P14165). Abstract only (the PMC
      copy is a scan; no text returned). The abstract does not assign either isoenzyme to a
      gene. CSII (dimer, 36.5-kDa subunit) matches PrpC, which is a homodimer of ~41 kDa
      (PMID:36377867), so the attribution is plausible but inferential.
- id: PMID:36377867
  title: Systems-Wide Dissection of Organic Acid Assimilation in Pseudomonas aeruginosa
    Reveals a Novel Path To Underground Metabolism.
  findings:
  - statement: Purified PrpC has both citrate synthase and 2-methylcitrate synthase activity.
    supporting_text: >-
      Purified PrpCPa exhibits both citrate synthase activity (with acetyl-CoA as a
      substrate) and 2-methylcitrate synthase activity (with propionyl-CoA as a substrate).
  - statement: A prpC deletion cannot grow on propionate.
    supporting_text: >-
      The 2-methylcitrate synthase mutant (ΔprpC) was unable to grow on propionate as a sole
      carbon source but displayed no detectable growth deficit on any of the other tested
      carbon sources.
  - statement: PrpC supplies citrate synthase activity in vivo when GltA is absent.
    supporting_text: >-
      In the absence of citrate synthase (GltA), Pa can survive because of the low-level
      basal expression of PrpC, a promiscuous enzyme that also has citrate synthase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Main functional, kinetic and structural study of PrpC.
