existing_annotations:
- term:
    id: GO:0008919
    label: lipopolysaccharide glucosyltransferase I activity
  evidence_type: IDA
  original_reference_id: PMID:21441506
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row and a seed of the PTN000531320 glycosyltransferase IBD. GO:0008919 is defined
      generically (UDP-glucose + lipopolysaccharide = UDP + D-glucosyl-lipopolysaccharide), and
      WapB adds the terminal beta-1,2-glucose to the LPS outer core.
    action: ACCEPT
    reason: >-
      The mutant structure, complementation and gain-of-function data show that WapB adds a glucose
      residue to LPS, which is what the GO definition describes. The label's "I" comes from the
      EC name for the first core glucose (WaaG-type), but the GO definition does not restrict the
      acceptor position, so the term fits. The UDP-glucose donor is assumed, not shown. The abstract
      reports only in vivo genetic and structural data, so the IDA code may properly be IMP; this
      is recorded as a suspected evidence-code defect and does not affect the term.
    supported_by:
    - reference_id: PMID:21441506
      supporting_text: >-
        revealed that the core OS of the wapB mutant lacked the terminal β-1,2-linked-d-glucose residue.
    - reference_id: PMID:21441506
      supporting_text: Our results strongly suggested that wapB encodes a 1,2-glucosyltransferase.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      corrected_value: ECO:0000315
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        The abstract of PMID:21441506 reports a chromosomal mutant whose core lacks the terminal
        glucose (NMR and MS), complementation, and heterologous expression in other serotypes, and
        concludes that the results "strongly suggested" a 1,2-glucosyltransferase. No in vitro transfer
        assay is described, so IMP looks like the right code. Only the abstract was read; the full
        text could contain a direct assay, hence SUSPECTED and CHECK. The GO term itself is sound.
