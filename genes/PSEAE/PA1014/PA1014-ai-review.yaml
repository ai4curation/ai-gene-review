  title: Evidence that WapB is a 1,2-glucosyltransferase of Pseudomonas aeruginosa involved
    in Lipopolysaccharide outer core biosynthesis.
  findings:
  - statement: >-
      The wapB mutant core oligosaccharide lacks the terminal beta-1,2-linked D-glucose, and complementation
      restores the wild-type structure.
    supporting_text: >-
      revealed that the core OS of the wapB mutant lacked the terminal β-1,2-linked-d-glucose residue.
  - statement: >-
      Expressing wapB in serotypes lacking Glc(IV) adds a terminal glucose, and the authors conclude
      WapB is a 1,2-glucosyltransferase.
    supporting_text: Our results strongly suggested that wapB encodes a 1,2-glucosyltransferase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Kocincova et al. 2011, J Bacteriol; PMC3133124). Abstract read; the PubMed
      MCP returned no full-text body. The abstract reports mutant LPS structure by NMR and MS,
      complementation and gain of function in 11 serotypes, and frames the activity as strongly
      suggested; it describes no in vitro transferase assay. Source of the PseudoCAP IDA GO:0008919
      row that seeds PTN000531320.
