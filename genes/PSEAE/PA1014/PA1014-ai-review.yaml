taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1014 (proposed name WapB) is a 330-residue glycosyltransferase of the GT2-like family, with a
  nucleotide-diphospho-sugar transferase fold, in Pseudomonas aeruginosa PAO1 that acts in biosynthesis
  of the lipopolysaccharide (LPS) outer core oligosaccharide. A wapB chromosomal mutant makes a core
  oligosaccharide that lacks the terminal beta-1,2-linked D-glucose residue (Glc IV) and loses reactivity
  with the outer-core monoclonal antibody 5c-101; complementation restores the wild-type core, and
  expressing wapB in the 11 IATS serotypes that naturally lack Glc IV adds a terminal glucose to their
  core. WapB is therefore the glucosyltransferase that adds the terminal beta-1,2-glucose to the LPS
  outer core. The nucleotide-sugar donor and the transfer reaction have not been shown in vitro.
