- term:
    id: GO:0006065
    label: UDP-glucuronate biosynthetic process
  evidence_type: EXP
  original_reference_id: PMID:19282284
  qualifier: involved_in
  review:
    summary: PseudoCAP EXP UDP-glucuronate biosynthetic process from the WbpB/WbpE/WbpD 
      reconstitution.
    action: MODIFY
    reason: >-
      The process is wrong as stated. GO:0006065 is the formation of UDP-glucuronate (UDP-GlcA). WbpE
      aminates UDP-3-keto-GlcNAcA to UDP-GlcNAc3NA; UDP-glucuronate is neither substrate nor product of
      the Wbp pathway, whose first step oxidises UDP-GlcNAc. The products are glucuronic-acid
      derivatives, which probably explains the choice. The sound essence is nucleotide-sugar
      biosynthesis; there is no GO term for UDP-ManNAc3NAcA biosynthesis. Same correction as made for
      the sibling wbpD row from PseudoCAP.
    proposed_replacement_terms:
    - id: GO:0009226
      label: nucleotide-sugar biosynthetic process
    supported_by:
    - reference_id: PMID:19282284
      supporting_text: >-
        we identified ions that corresponded to the predicted products of WbpB (UDP-3-keto-d-GlcNAcA)
        and
        WbpE (UDP-d-GlcNAc3NA) in the coupled enzyme-substrate reaction
    - reference_id: PMID:19348502
      supporting_text: >-
        WbpB and WbpE are a dehydrogenase/aminotransferase pair that converts UDP-GlcNAcA to
        UDP-GlcNAc(3NH(2))A in a coupled reaction
    source_defects:
