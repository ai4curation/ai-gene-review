gene_symbol: wbpE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WbpE (PA3155) is a 359-residue pyridoxal 5'-phosphate (PLP)-dependent aminotransferase of the
  DegT/DnrJ/EryC1 family, encoded in the B-band O-antigen gene cluster of Pseudomonas aeruginosa PAO1
  (serotype O5). The homodimeric enzyme transfers the amino group of L-glutamate to
  UDP-2-acetamido-2-deoxy-3-oxo-D-glucuronic acid (UDP-3-keto-GlcNAcA), the product of the WbpB
  dehydrogenase, giving UDP-2-acetamido-3-amino-2,3-dideoxy-D-glucuronic acid (UDP-GlcNAc3NA; EC
  2.6.1.98). WbpB and WbpE work as a coupled dehydrogenase/aminotransferase pair with NAD+ recycling.
  This is the third step of the WbpA-WbpB-WbpE-WbpD-WbpI pathway that converts UDP-GlcNAc into
  UDP-ManNAc3NAcA, the donor of the di-N-acetylated mannuronic acid residue of the B-band O-antigen
  repeat. wbpE knockouts lack B-band O antigen, and the Bordetella pertussis homolog WlbC complements
  the mutant.
