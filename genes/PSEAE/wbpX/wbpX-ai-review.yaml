- term:
    id: GO:0016757
    label: glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001296
  review:
    summary: InterPro2GO from the glycosyltransferase family 1 domain (IPR001296).
    action: ACCEPT
    reason: >-
      IPR001296 is the glycosyltransferase family 1 fold signature, which is shared across GT1
      members of many different sugar specificities. It identifies the protein as a
      glycosyltransferase and stops there, so it is as precise as this row's own evidence allows.
      Per the 2026-11-14 ruling a MODIFY needs this row's evidence to support the deeper term, and a
      generic fold signature cannot distinguish hexosyl transfer from any other glycosyl transfer.
      The specific activity, which is shown by assay rather than by signature, is asserted on its own
      NEW row below.
    supported_by:
    - reference_id: file:PSEAE/wbpX/wbpX-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR001296; Glyco_trans_1.
- term:
    id: GO:0016757
    label: glycosyltransferase activity
  evidence_type: IMP
  original_reference_id: PMID:9680202
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row and a seed of the PTN005302544 IBD. The paper assigns WbpX as an alpha-D-rhamnosyltransferase
      on the basis of mutant phenotype and repeat-unit structure; the mutant lacks A-band LPS.
    action: ACCEPT
    reason: >-
      A sound seed, and the row is kept for that reason. The 1998 mutant phenotype establishes that
      WbpX is required to build the rhamnan, and the paper's naming of the three proteins as
      alpha-D-rhamnosyltransferases is its own hedged inference from the repeat-unit structure rather
      than an activity measurement. That supports the family-level term and not more, so under the
      2026-11-14 ruling this row stays where its evidence reaches. The activity was assayed directly
      only later, in PMID:35166992, which is asserted as its own NEW row below.
    supported_by:
    - reference_id: PMID:9680202
      supporting_text: >-
        The A-band polysaccharide is assembled by the alpha-D-rhamnosyltransferases, WbpX, WbpY and WbpZ.
- term:
    id: GO:0016758
    label: hexosyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:35166992
  qualifier: enables
  review:
    summary: >-
      Proposed annotation. The D-rhamnosyltransferase activity of WbpX was shown directly by assay,
      and GOA carries no row for it; the three existing rows all stop at the family-level term.
    action: NEW
    reason: >-
      WbpX was expressed and assayed, and transfers D-rhamnose from GDP-D-rhamnose onto the
      undecaprenyl-diphosphate-linked product of WbpZ, extending the WbpY product by several
      residues. D-rhamnose is 6-deoxy-D-mannose, a hexose, so the activity is hexosyl transfer and
      GO:0016758 is the correct term; GO has no D-rhamnosyltransferase term, which is where the
      specificity would otherwise be recorded, so the refinement stops here rather than naming the
      sugar. This is asserted as its own row rather than as a MODIFY of the IBA, IEA or IMP rows
      because none of those three carries evidence that reaches past the family-level term: the IBA
      inherits a node typed at GO:0016757, the IEA rests on a generic GT1 fold signature, and the
      1998 IMP is a mutant phenotype whose rhamnosyltransferase naming is the authors' own
      inference. Putting the specific claim on the row that holds the assay keeps each row's action
      matched to its own evidence, per the 2026-11-14 ruling. The same change is made on wbpY, whose
      rows had the same encoding.
    supported_by:
    - &pmid35166992_demo
      reference_id: PMID:35166992
      supporting_text: >-
        We demonstrated that these GTs are indeed D-RhaTs and catalyze the transfer of D-Rha from
        GDP-D-Rha to the reaction product of WbpZ.
    - &pmid35166992_extend
      reference_id: PMID:35166992
      supporting_text: >-
        Additionally, WbpX was observed to transfer several D-Rha residues to the WbpY product, as
        well as to a less natural acceptor substrate.
    - &pmid35166992_nmr
      reference_id: PMID:35166992
      supporting_text: >-
        NMR analysis revealed that WbpX synthesizes both α1-2 and α1-3 D-Rha linkages while WbpY
        synthesizes a single D-Rhaα1-3 linkage.
core_functions:
- description: >-
    D-rhamnosyltransferase that, with WbpY and WbpZ, assembles the D-rhamnan repeat of the A-band
    (common polysaccharide antigen) O-polysaccharide. WbpX transfers D-rhamnose from GDP-D-rhamnose
    onto the WbpZ product and extends the WbpY product by several residues, forming both alpha1-2
    and alpha1-3 linkages where WbpY forms only alpha1-3, so that the two together polymerise the
    rhamnan non-processively.
