core_functions:
- description: >-
    D-rhamnosyltransferase that, with WbpY and WbpZ, assembles the D-rhamnan repeat of the A-band
    (common polysaccharide antigen) O-polysaccharide. WbpX transfers D-rhamnose from GDP-D-rhamnose
    onto the WbpZ product, and extends the WbpY product by several residues, so that WbpX and WbpY
    acting together polymerise the rhamnan; the assignment of a particular alpha1-2 linkage to WbpX
    remains inferred from the repeat-unit structure rather than shown.
  molecular_function:
    id: GO:0016758
    label: hexosyltransferase activity
  directly_involved_in:
