id: G3XCU3
gene_symbol: wbpX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WbpX (PA5449) is a 460-residue glycosyltransferase family 1 (GT4-type) protein of Pseudomonas
  aeruginosa PAO1 encoded at the 3' end of the A-band (common polysaccharide antigen) lipopolysaccharide
  gene cluster. Together with WbpY and WbpZ it assembles the A-band O-polysaccharide, a homopolymer
  of trisaccharide repeats of alpha1-2, alpha1-3, alpha1-3 linked D-rhamnose. WbpX is proposed to
  transfer the alpha1-2 linked D-rhamnose residue and to act processively, alternating with WbpY,
  to extend the polymer. A chromosomal wbpX mutant cannot make A-band LPS while B-band LPS synthesis
  is unaffected. The donor (presumably GDP-D-rhamnose) and linkage specificity have not been shown
  by enzyme assay.
