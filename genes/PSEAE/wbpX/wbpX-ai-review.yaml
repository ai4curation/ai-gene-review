suggested_questions:
- question: >-
    WbpX carries only one predicted glycosyltransferase domain yet forms both alpha1-2 and alpha1-3
    D-rhamnose linkages in vitro. What switches it between the two, and which linkage does it make at
    each position of the native trisaccharide repeat?
suggested_experiments:
- description: >-
    Determine a structure of WbpX bound to GDP-D-rhamnose and a defined D-rhamnan acceptor, or mutate
    candidate acceptor-site residues, to identify what selects alpha1-2 against alpha1-3 linkage
    formation in a single-domain enzyme. The donor, the linkages formed in vitro and the
    non-processive mechanism were established in PMID:35166992, so what remains open is regiochemical
    control rather than the activity itself.
