- id: PMID:9680202
  title: 'Three rhamnosyltransferases responsible for assembly of the A-band D-rhamnan
    polysaccharide in Pseudomonas aeruginosa: a fourth transferase, WbpL, is required
    for the initiation of both A-band and B-band lipopolysaccharide synthesis.'
  findings:
  - statement: >-
      WbpX, WbpY and WbpZ are the alpha-D-rhamnosyltransferases that assemble the A-band D-rhamnan.
    supporting_text: >-
      The A-band polysaccharide is assembled by the alpha-D-rhamnosyltransferases, WbpX, WbpY and WbpZ.
  - statement: wbpX, wbpY and wbpZ mutants make no A-band LPS; B-band is unaffected.
    supporting_text: >-
      these mutants are unable to synthesize A-band LPS, while B-band synthesis is unaffected
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Rocchetta et al. 1998, Mol Microbiol). Abstract read; no PMC full text.
      The abstract reports chromosomal mutants and Western blots; the linkage assignments to
      individual transferases are proposed from repeat-unit structure and are hedged ("probably",
      "predicted"). Source of the PseudoCAP IMP GO:0016757 seed and the LPS/O-antigen process rows.
- id: PMID:35166992
  title: Biosynthesis of the Pseudomonas aeruginosa common polysaccharide antigen by D-Rhamnosyltransferases
    WbpX and WbpY.
  findings:
  - statement: >-
      WbpX and WbpY were expressed and assayed directly, and both transfer D-rhamnose from GDP-D-Rha
      onto the WbpZ reaction product, establishing them as D-rhamnosyltransferases.
    supporting_text: >-
      We demonstrated that these GTs are indeed D-RhaTs and catalyze the transfer of D-Rha from
      GDP-D-Rha to the reaction product of WbpZ.
  - statement: >-
      Each enzyme alone adds a single D-Rha residue; together they polymerise a D-rhamnan of at least
      eight residues, and WbpX alone extends the WbpY product by several residues.
    supporting_text: >-
      While WbpX and WbpY transferred one D-Rha residue to the WbpZ product, the combination of WbpX
      and WbpY resulted in the synthesis of a D-Rhamnan polymer of at least 8 D-Rha residues.
  - statement: >-
      Before this work the two enzymes had not been characterised biochemically, which is what the
      earlier version of this review relied on when it accepted the family-level term.
    supporting_text: >-
      WbpX and WbpY have not been biochemically characterized and the mechanisms by which D-Rha
      polymers are synthesized have yet to be understood.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available in the cache. This is the paper that supplies the direct enzymology for
      WbpX, and its absence from the earlier version of this review is what left the wbpX and wbpY
      reviews disagreeing about the same shared claim: wbpY cited it (for both enzymes) and refined
      the term, while wbpX did not cite it and accepted the generic term on the ground that the
      donor and linkage were unshown. The sentence quoted in the third finding is the paper's own
      statement of the prior state of knowledge, in its introduction, not a conclusion.
