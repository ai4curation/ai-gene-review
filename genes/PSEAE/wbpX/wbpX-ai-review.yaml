  review:
    summary: >-
      IBA from PTN005302544, seeded by WbpX itself and WbpY (Q9HTB9). The self-seed reflects
      WbpX's own experimental annotation.
    action: ACCEPT
    reason: >-
      The IBD at PTN005302544 asserts glycosyltransferase activity, and this row inherits exactly
      that. The phylogenetic evidence reaches the node's term and no further, so it cannot by itself
      carry the more specific hexosyltransferase claim, however well that claim is supported
      elsewhere on this gene. Under the 2026-11-14 ruling a MODIFY needs this row's own evidence for
      the deeper term, which an IBA from a node typed at the general term does not have. The
      demonstrated D-rhamnosyltransferase activity is therefore asserted on its own NEW row below,
      with the assays that show it, rather than by refining this one. The node conclusion itself is
      sound and apt for the breadth of the GT4 node.
    supported_by:
    - reference_id: PMID:9680202
      supporting_text: >-
        The A-band polysaccharide is assembled by the alpha-D-rhamnosyltransferases, WbpX, WbpY and WbpZ.
