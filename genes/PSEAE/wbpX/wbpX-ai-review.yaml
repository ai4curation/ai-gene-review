- term:
    id: GO:0016757
    label: glycosyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN005302544
  - UniProtKB:G3XCU3
  - UniProtKB:Q9HTB9
  review:
    summary: >-
      IBA from PTN005302544, seeded by WbpX itself and WbpY (Q9HTB9). The self-seed reflects
      WbpX's own experimental annotation.
    action: MODIFY
    reason: >-
      Correct but less specific than the evidence now supports. An earlier version of this review
      accepted the generic term on the ground that the donor and linkage had not been shown
      biochemically. That was true of the 1998 genetic paper but is no longer true of the gene:
      PMID:35166992 expressed WbpX and WbpY and showed directly that both transfer D-rhamnose from
      GDP-D-Rha onto the WbpZ product, with WbpX additionally extending the WbpY product by several
      residues. D-rhamnose is 6-deoxy-D-mannose, a hexose, so the supported specific term is
      GO:0016758 hexosyltransferase activity, an is_a child of GO:0016757. That is also the
      replacement used for the same claim on wbpY, whose reason already cited this paper for WbpX as
      well as WbpY; the two rows now agree. GO still has no D-rhamnosyltransferase term, which is why
      the refinement stops at hexosyltransferase rather than naming the sugar.
    proposed_replacement_terms:
    - id: GO:0016758
      label: hexosyltransferase activity
    supported_by:
    - reference_id: PMID:9680202
      supporting_text: >-
        The A-band polysaccharide is assembled by the alpha-D-rhamnosyltransferases, WbpX, WbpY and WbpZ.
    - &pmid35166992_demo
      reference_id: PMID:35166992
      supporting_text: >-
        We demonstrated that these GTs are indeed D-RhaTs and catalyze the transfer of D-Rha from
        GDP-D-Rha to the reaction product of WbpZ.
    - reference_id: file:PSEAE/wbpX/wbpX-uniprot.txt
