  evidence_type: IMP
  original_reference_id: PMID:9680202
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row and a seed of the PTN005302544 IBD. The paper assigns WbpX as an alpha-D-rhamnosyltransferase
      on the basis of mutant phenotype and repeat-unit structure; the mutant lacks A-band LPS.
    action: MODIFY
