suggested_questions:
- question: >-
    Does WbpX alone form the alpha1-2 linkage with GDP-D-rhamnose, and is it processive as proposed?
suggested_experiments:
- description: >-
    In vitro assay of purified WbpX with GDP-D-rhamnose and synthetic rhamnan acceptors, with linkage
    analysis by NMR, to define donor, linkage and processivity.
