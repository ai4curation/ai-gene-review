id: G3XCU3
gene_symbol: wbpX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WbpX (PA5449) is a 460-residue glycosyltransferase family 1 (GT4-type) protein of Pseudomonas
  aeruginosa PAO1 encoded at the 3' end of the A-band (common polysaccharide antigen) lipopolysaccharide
  gene cluster. Together with WbpY and WbpZ it assembles the A-band O-polysaccharide, a homopolymer
  of trisaccharide repeats of alpha1-2, alpha1-3, alpha1-3 linked D-rhamnose. WbpX transfers
  D-rhamnose from GDP-D-rhamnose onto the undecaprenyl-diphosphate-linked product of WbpZ, and NMR
  analysis of its reaction products shows that it forms both alpha1-2 and alpha1-3 linkages, whereas
  WbpY forms only alpha1-3. Acting together the two extend the D-rhamnan non-processively into
  oligomers of at least eight residues, and WbpX adds several residues in sequence despite carrying
  only one predicted glycosyltransferase domain. A chromosomal wbpX mutant cannot make A-band LPS
  while B-band LPS synthesis is unaffected.
