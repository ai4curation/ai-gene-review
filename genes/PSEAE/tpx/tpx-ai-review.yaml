  title: >-
    Pseudomonas aeruginosa thiol peroxidase protects against hydrogen peroxide toxicity and displays atypical
    patterns of gene regulation.
  findings:
  - statement: >-
      Purified Tpx is a thioredoxin-dependent peroxidase acting on H2O2 and organic hydroperoxides.
    supporting_text: >-
      The enzyme catalyzes thioredoxin-dependent peroxidation and can utilize organic hydroperoxides and
      H(2)O(2) as substrates.
  - statement: A tpx deletion mutant is hypersensitive to 0.5 mM H2O2, complemented in trans.
    supporting_text: >-
      The Δ tpx mutant was more than 10-fold more sensitive to 0.5 mM H 2 O 2 than the PAO1 wild type
  - statement: Tpx lacks a functional periplasmic export signal and is probably cytoplasmic.
    supporting_text: >-
      we conclude that the protein is not secreted to the periplasm via a typical signal sequence, greatly
      decreasing the likelihood that this protein is located in the periplasm
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. Supports both PseudoCAP seed rows (GO:0008379 IDA, GO:0070301 IMP).
