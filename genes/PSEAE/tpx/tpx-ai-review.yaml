id: P57668
gene_symbol: tpx
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Tpx (PA2532) is the atypical 2-Cys thiol peroxidase (peroxiredoxin, EC 1.11.1.24) of Pseudomonas aeruginosa.
  Its peroxidatic cysteine (Cys60) reduces hydrogen peroxide and organic hydroperoxides (cumene and tert-butyl
  hydroperoxide) and forms an intramolecular disulfide with the resolving cysteine (Cys94), which is reduced
  by thioredoxin and thioredoxin reductase with NADPH. Tpx has a low Km for organic hydroperoxides and
  a Km for H2O2 in the submillimolar range, and a tpx deletion mutant is more sensitive to 0.5 mM H2O2
  but not to high H2O2 concentrations, so Tpx protects against moderate peroxide stress. Unlike E. coli
  Tpx it lacks a typical periplasmic signal sequence and appears to be cytoplasmic. tpx is strongly induced
  by redox-cycling agents and diamide and is repressed by IscR.
