  - UniProtKB:Q92819
  - UniProtKB:Q92839
  review:
    summary: Alg8 makes mannuronan, not hyaluronan.
    action: REMOVE
    reason: The IBA at PANTHER:PTN000530809 crosses substrate specificity within a
      glycosyltransferase family. Alg8 uses GDP-mannuronate for alginate; hyaluronan synthesis
      instead alternates glucuronate and N-acetylglucosamine. Target-specific mutagenesis and
      polymerization evidence contradict this substrate assignment. This challenges propagation
      scope, not donor count or the target appearing among donors.
    supported_by:
    - *id001
    - reference_id: PMID:16391057
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000530809
        source_status: UNRESOLVED
        comment: The proximate ancestral node is identified from seeded WITH/FROM. Its complete
          PAINT assertion history has not been reconstructed; source-node status remains unresolved.
          Target-specific primary evidence supports the functional/compartment distinction explained
          in the review reason, rather than a donor-count or circularity argument.
