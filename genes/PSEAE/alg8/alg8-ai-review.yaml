  label: Pseudomonas aeruginosa PAO1
description: Alg8 is an inner-membrane processive glycosyltransferase that polymerizes
  GDP-mannuronate into the mannuronan precursor of alginate. Its cytoplasmic catalytic region works
  with the c-di-GMP-responsive co-polymerase Alg44 and the alginate export machinery to produce the
  extracellular polysaccharide.
