- id: PMID:18524915
  title: Membrane topology and roles of Pseudomonas aeruginosa Alg8 and Alg44 in alginate
    polymerization.
  findings:
  - statement: Alg8 active-site and topology mutations support its glycosyltransferase role; Alg44
      has cytoplasmic PilZ and periplasmic MFP regions and acts as a co-polymerase.
    supporting_text: These studies suggest that Alg44 may act as a co-polymerase in concert with
      Alg8, the major GT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct P. aeruginosa mutagenesis/topology; not a purified Alg44
      glycosyltransferase assay.
- id: PMID:16391057
  title: In vitro alginate polymerization and the functional role of Alg8 in alginate production by
    Pseudomonas aeruginosa.
  findings:
  - statement: P. aeruginosa cell-envelope fractions synthesize alginate in vitro; alg8 disruption
      and complementation establish its polymerization role.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Envelope-fraction polymerization, not an assertion that isolated Alg8 alone is
      sufficient.
- id: PMID:25968647
  title: Alginate Polymerization and Modification Are Linked in Pseudomonas aeruginosa.
  findings:
  - statement: Native P. aeruginosa alg8 complementation produces highly structured biofilms
      compared with the nonmucoid deletion control, linking synthesis of the matrix polymer to
      biofilm architecture.
    supporting_text: The PDO300Δalg8(pBBR1MCS-5:alg8) and PDO300Δalg44(pBBR1MCS-5:alg44) strains
      established heterogeneous highly structured biofilms (Fig. 9).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text Results, Fig. 9 and Table 2 compare PDO300 alg8 deletion and
      complementation in continuous-culture flow-cell biofilms; supports the conditional matrix
      role, not isolated-enzyme sufficiency.
