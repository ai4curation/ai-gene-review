- term:
    id: GO:0085029
    label: extracellular matrix assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:106590
  - MGI:MGI:107821
  - MGI:MGI:109599
  - PANTHER:PTN000530809
  review:
    summary: Alg8 constructs the alginate matrix polymer and contributes to architecture of
      alginate-producing biofilms.
    action: KEEP_AS_NON_CORE
    reason: Alg8 directly polymerizes a structural extracellular-matrix polysaccharide. In the
      native P. aeruginosa PDO300 background, alg8 complementation restores highly structured
      biofilms relative to the nonmucoid deletion control (PMID:25968647, Fig. 9 and Table 2). The
      matrix-assembly role is therefore supported by target-specific architecture measurements
      together with demonstrated polymer synthesis, rather than necessity alone. Retain this
      conditional biofilm role as non-core; alginate polymerization remains the core activity. This
      evidence supports the broad biological claim independently of the unresolved PAINT node
      placement. GO:0085029 concerns aggregation, arrangement and bonding of extracellular matrix
      without a mammalian restriction. The architecture data and polymer-building mechanism support
      this conditional matrix role. GO:0044010 describes the distinct whole-biofilm process rather
      than a more specific replacement for this assembly claim; no additional biofilm annotation is
      proposed.
    supported_by:
    - *id001
    - reference_id: PMID:25968647
      supporting_text: The PDO300Δalg8(pBBR1MCS-5:alg8) and PDO300Δalg44(pBBR1MCS-5:alg44) strains
        established heterogeneous highly structured biofilms (Fig. 9).
