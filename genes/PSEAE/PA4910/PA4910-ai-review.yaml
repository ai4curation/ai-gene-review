core_functions:
- description: >-
    Nucleotide-binding subunit of an uncharacterised HAAT-family ABC importer
    (operon PA4909-PA4913). PA4910 binds and hydrolyses ATP at the cytoplasmic
    face of the operon's permease subunits, energising transport; the substrate
    of the system has not been determined.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  locations:
