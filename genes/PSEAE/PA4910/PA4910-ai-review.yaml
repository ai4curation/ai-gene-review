      PAINT IBA from PTN000656921 (the LivG ATPase node), seeded by E. coli
      LivG (P0A9S7).
    action: UNDECIDED
    reason: >-
      Substrate specificity in HAAT ABC importers is set by the periplasmic
      binding protein, not by the ATPase. PA4910 belongs to a second,
      uncharacterised system with its own binding protein (PA4913), whose
      substrates are unknown, and no L-valine phenotype was recorded for the
      PA4910 mutant in the only functional study. The valine claim is sound for
      E. coli LivG and for P. aeruginosa BraF (LIV-I), but cannot be assumed
      for this paralogue. Consistent with the treatment of the same IBA rows on
      PA4912.
