gene_symbol: PA4910
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4910 is a predicted nucleotide-binding (ATPase) subunit of an
  uncharacterised hydrophobic amino acid (HAAT family) ABC importer of
  Pseudomonas aeruginosa. It is a LivG-type ABC ATPase with a Walker A motif,
  an ABC_tran domain and the C-terminal BCA_ABC_TP_C extension, and it is
  encoded in a five-gene operon (PA4909-PA4913) that is a paralogue of the
  braCDEFG (LIV-I) branched-chain amino acid transport operon. As an ABC
  ATPase it associates with the cytoplasmic face of the inner membrane and
  couples ATP hydrolysis to transport by the operon's permease subunits
  (PA4911, PA4912). The substrate of this second system has not been
  determined biochemically; in a transposon-mutant growth screen the PA4910
  mutant used D-alanine less well as a nitrogen source.
