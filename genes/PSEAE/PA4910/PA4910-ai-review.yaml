    label: plasma membrane
  supported_by:
  - reference_id: file:PSEAE/PA4910/PA4910-uniprot.txt
    record_section: ["DR:Pfam"]
    supporting_text: Pfam; PF00005; ABC_tran; 1.
  - reference_id: PMID:18833300
    supporting_text: >-
      PA4910 encodes a putative ATP-binding protein, while PA4912 encodes a
      predicted membrane component of this ABC amino acid transporter.
knowledge_gaps:
- gap_statement: >-
    The substrate range of the PA4909-PA4913 ABC importer is undetermined. No
    uptake or binding measurement exists for any amino acid, so it is unknown
    whether the system carries D-amino acids, branched-chain L-amino acids, or
    something else.
  boundary: >-
    Established: the operon encodes a complete HAAT-type ABC importer
    paralogous to braCDEFG, and transposon mutants of PA4910 and PA4912 use
    D-alanine (and, for PA4912, D-valine) less well as nitrogen sources.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    Does the PA4913 periplasmic binding protein bind D-amino acids, and does
    the PA4909-PA4913 system import them?
suggested_experiments:
- description: >-
    Measure binding of D-alanine, D-valine and the branched-chain L-amino acids
    to purified PA4913 by intrinsic fluorescence or ITC, and measure
    radiolabelled D-alanine uptake in a PA4909-PA4913 deletion strain with and
    without complementation.
