    review_notes: Full text inspected. Table1 identifies Q9I0D3 as PA2709. Native deletion/complementation
      uses PAO1; purified-enzyme kinetic/product results are separate evidence. Exact recombinant sequence
      is independently identified by PMID41676964.
- id: PMID:41676964
  title: Distinct contributions of O-acetylserine sulfhydrylases to cysteine biosynthesis in Pseudomonas
    aeruginosa.
  findings:
  - statement: The exact Q9I0D3 sequence was used for recombinant protein production.
    supporting_text: 'The pET28a+ vectors containing the gene sequences for PaCysK (UniProt ID: Q9I0D3)
      and PaCysM (UniProt ID: Q9I526), each featuring an N‐terminal 6x‐His tag, were obtained from Genscript.'
    reference_section_type: METHODS
  - statement: PaCysK also has low thiosulfate reactivity; this is not equivalent to the physiologically
      supported CysM specialization.
    supporting_text: although PaCysK was also able to catalyze S‐sulfocysteine formation
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Methods explicitly specify Q9I0D3 and Q9I526 N-terminal His constructs
      expressed in E. coli Rosetta(DE3), while native deletion genetics use PAO1. Negative endogenous
      CysE-tail interaction and positive Salmonella-tail binding constrain complex claims. Thiosulfate
      product specificity is distinguished from abstract shorthand.
