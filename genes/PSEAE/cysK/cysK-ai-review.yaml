  review:
    action: ACCEPT
    summary: CysK catalyzes the cysteine-forming step and overlaps with CysM in native PAO1.
    reason: Direct enzyme chemistry establishes participation in the process; deletion of both PA2709
      and PA0932 causes cysteine auxotrophy under the tested conditions while single mutants retain growth.
      The phenotype corroborates the actual catalytic step rather than serving as necessity-only evidence.
      The PAINT placement is consistent with this target-specific result. No claim that all cysteine synthesis
      in every condition depends on CysK alone is made.
