suggested_questions:
- question: Does PA2709 have a measurable physiological cysteine-degradation role beyond the phylogenetically
    inferred secondary desulfhydrase activity?
- question: Does any endogenous PAO1 partner regulate PaCysK through its intact C-terminal-peptide binding
    pocket despite the lack of canonical CysE interaction?
suggested_experiments:
- description: Measure native PAO1 CysK localization and cysteine-dependent sulfide/pyruvate production,
    separating the secondary degradative reaction from sulfide-dependent synthesis.
