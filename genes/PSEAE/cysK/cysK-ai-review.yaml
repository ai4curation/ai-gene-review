    action: MODIFY
    summary: The conserved soluble enzyme is inferred to act in the cytosol.
    reason: The PAINT cytoplasm inference at PTN000034104 is consistent with a soluble PLP enzyme in the
      assimilatory OAS pathway. The protein lacks annotated export/transmembrane features and its enterobacterial
