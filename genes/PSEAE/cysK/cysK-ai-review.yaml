  label: Pseudomonas aeruginosa PAO1
description: CysK (PA2709) is a PLP-dependent O-acetylserine sulfhydrylase of Pseudomonas aeruginosa PAO1.
  The homodimeric enzyme incorporates sulfide into O-acetyl-L-serine to form L-cysteine and acetate. Low
  thiosulfate-dependent S-sulfocysteine formation is also observed in vitro, without establishing a major
  physiological role. It overlaps with CysM in cysteine synthesis under the tested minimal-medium conditions,
  while CysM is much more efficient at using thiosulfate to produce S-sulfocysteine. Purified PaCysK does
  not bind the tested endogenous CysE-tail peptide and shows negligible reciprocal kinetic effects with
  full-length PaCysE, arguing against the canonical enterobacterial cysteine synthase complex. Its ability
  to bind the Salmonella CysE-tail peptide shows that the interaction pocket is functional; neither endogenous
  complex formation nor toxin activation follows from that heterologous interaction.
