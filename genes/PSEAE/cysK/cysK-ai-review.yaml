  review:
    action: KEEP_AS_NON_CORE
    summary: Retain phylogenetically inferred secondary cysteine desulfhydrase activity.
    reason: PAINT places this secondary activity at PTN000034535 using experimentally characterized E.
      coli CysK. That is an ancestral-function inference, not a weak pairwise transfer merely because
      one seed is named. PAO1 CysK retains the CysK catalytic architecture and no target-specific loss
      or negative assay was identified. The PAO1 papers characterize synthesis rather than directly testing
      this degradative reaction; the activity is therefore retained as a conserved non-core inference,
      without assigning physiological cysteine degradation magnitude or Fe-S assembly to PAO1.
    supported_by:
    - reference_id: PMID:16000837
      supporting_text: 'three additional proteins having L-cysteine desulfhydrase

        activity were identified as O-acetylserine sulfhydrylase-A'
