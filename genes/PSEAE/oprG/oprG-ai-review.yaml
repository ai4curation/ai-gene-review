taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: oprG encodes an outer membrane protein of the OmpW family, an eight-stranded beta-barrel with a
  cleavable signal peptide that is abundant in the outer membrane under anaerobic, iron-rich conditions,
  where its transcription depends on the ANR regulator. Purified OprG forms cation-selective channels in
  planar lipid bilayers, and in reconstituted liposomes and growth assays it allows the passage of small
  amino acids such as glycine, alanine, valine and serine, with the dynamics of its extracellular loops
  important for transport. It does not appear to mediate iron or antibiotic uptake. Loss of OprG reduces the
  cytotoxicity of P. aeruginosa toward human bronchial epithelial cells.
