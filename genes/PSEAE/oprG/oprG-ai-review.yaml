- id: PMID:26655471
  title: OprG Harnesses the Dynamics of its Extracellular Loops to Transport Small Amino Acids across the Outer
    Membrane of Pseudomonas aeruginosa.
  findings:
  - statement: Reconstituted OprG transports small amino acids, confirmed by growth assays; NMR structures show
      flexible extracellular loops and no lateral gate.
    supporting_text: we reconstituted the purified protein into liposomes and found it to facilitate the
      transport of small amino acids such as glycine, alanine, valine, and serine, which was confirmed by
      Pseudomonas growth assays.
