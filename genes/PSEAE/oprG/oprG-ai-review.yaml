  review:
    summary: PAINT IBA from PTN005107949, whose sole seed is this gene's PseudoCAP IDA (PMID:19486157). Sound
      for the OmpW clade; for OprG itself more specific transport is shown.
    action: MODIFY
    reason: The generic term is a good choice at the family node, whose members' substrates are poorly
      known. For OprG the supported processes are amino acid transmembrane transport (liposome swelling and
      growth assays) and monoatomic cation transmembrane transport (cation-selective channel), both
      descendants of GO:0055085.
