- term:
    id: GO:0015288
    label: porin activity
  evidence_type: IDA
  original_reference_id: PMID:19486157
  qualifier: enables
  review:
    summary: Proposed MF. OprG is an outer membrane beta-barrel that forms channels passing small cations and
      small amino acids.
    action: NEW
    reason: GOA has no MF for OprG. Channel formation by the purified protein in planar bilayers and amino acid
      permeation in reconstituted liposomes show it enables passive transfer of small solutes across the
      outer membrane through a beta-barrel, which is the definition of porin activity.
    supported_by:
    - reference_id: PMID:19486157
      supporting_text: Planar bilayer studies indicated that purified OprG formed cationic-selective channels
        with a conductance of 500 pS in 1 M KCl
    - reference_id: PMID:26655471
      supporting_text: we reconstituted the purified protein into liposomes and found it to facilitate the
        transport of small amino acids such as glycine, alanine, valine, and serine, which was confirmed by
        Pseudomonas growth assays.
