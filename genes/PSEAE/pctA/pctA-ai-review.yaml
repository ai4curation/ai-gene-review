core_functions:
- description: >-
    Major inner-membrane amino acid chemoreceptor. Its periplasmic dCache_1 ligand binding region binds
    17 L-amino acids, and its cytoplasmic HAMP and MCP signalling domains relay the signal to the CheA-CheW
    chemosensory array to drive chemotaxis towards nearly all proteinogenic amino acids.
