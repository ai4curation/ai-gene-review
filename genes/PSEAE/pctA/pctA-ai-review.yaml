  label: Pseudomonas aeruginosa PAO1
description: >-
  PctA (PA4309) is the major amino acid chemoreceptor of Pseudomonas aeruginosa PAO1, a methyl-accepting
  chemotaxis protein (MCP) encoded in the pctC-pctA-pctB region. It is an inner-membrane receptor with
  two transmembrane helices flanking a periplasmic dCache_1 (double PDC) ligand binding region, followed
  by a cytoplasmic HAMP domain and the MCP signalling domain. The ligand binding region binds 17 L-amino
  acids directly at its membrane-distal module, and PctA mediates chemotaxis towards nearly all proteinogenic
  L-amino acids except L-Gln and L-Asp. PctA also contributes to repellent responses to trichloroethylene,
  chloroform and methylthiocyanate, and to chemotaxis to histamine and the quorum-sensing signal autoinducer-2.
  Its paralogues PctB and PctC arose from pctA duplications and have narrower ligand ranges.
