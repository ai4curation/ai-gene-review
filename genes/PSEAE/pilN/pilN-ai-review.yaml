id: G3XD30
gene_symbol: pilN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PilN (PA5043) is a bitopic inner-membrane protein of the type IVa pilus
  alignment subcomplex of Pseudomonas aeruginosa, encoded second in the
  pilMNOPQ operon. It has a short cytoplasmic N-terminal tail, a single
  transmembrane helix and a periplasmic domain of coiled coils and a
  ferredoxin-like fold, related to the GspL protein of type II secretion
  systems. The periplasmic domain heterodimerises with PilO, and PilN and PilO
  also form homodimers in vivo; the PilNO pair binds the periplasmic
  lipoprotein PilP, which in turn binds the secretin PilQ. The conserved
  N-terminal tail of PilN binds the cytoplasmic actin-like protein PilM,
  monomerising PilM and closing its domains around the ATP site, and so links
  the cytoplasmic motor side of the machine to the periplasmic and outer
  membrane components. Loss of PilN, or of its conserved N-terminal residues,
  destabilises the subcomplex, abolishes surface pili and abolishes twitching
  motility.
