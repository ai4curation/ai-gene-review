core_functions:
- description: >-
    Bitopic inner-membrane anchor of the PilMNOP alignment subcomplex of the
    type IVa pilus machine. Its periplasmic domain pairs with PilO and binds
    PilP (and through it the PilQ secretin), and its cytoplasmic N-terminal
    tail binds PilM, connecting the cytoplasmic motor side of the machine to
    the periplasmic and outer-membrane components during pilus assembly and
    twitching motility.
  directly_involved_in:
  - id: GO:0043683
    label: type IV pilus assembly
  - id: GO:0043107
    label: type IV pilus-dependent motility
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:23457250
    supporting_text: >-
      the N-terminal cytoplasmic tail of PilN binds to the actin-like protein
      PilM
  - reference_id: PMID:19857646
    supporting_text: >-
      the periplasmic domains of PilN and PilO interact to form a heterodimer
  - reference_id: PMID:19857645
    supporting_text: >-
      all four proteins, including the nominally cytoplasmic PilM, colocalized
      to the inner membrane
suggested_questions:
- question: >-
    GO has no cellular component for the type IV pilus assembly machine
    distinct from GO:0044096, the surface fibre. Should a "type IV pilus
    machine" (or alignment subcomplex) complex term be added so that PilM,
    PilN, PilO and PilP can be annotated to the machine rather than to the
    fibre?
suggested_experiments:
- description: >-
    Use in vivo crosslinking of chromosomal Cys variants under extension- and
    retraction-locked conditions (pilT or pilB backgrounds with ATPase-dead
    alleles) to test whether PilN switches between homodimer and PilNO
    heterodimer states during the extension/retraction cycle.
