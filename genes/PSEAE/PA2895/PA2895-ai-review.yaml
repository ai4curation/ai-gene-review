  review:
    summary: >-
      The gene's core molecular function, asserted by the paper in those words and supported by a
      direct interaction mapped to a specific region of the protein.
    action: ACCEPT
    reason: >-
      As well supported as this evidence code gets. The paper names the locus rather than leaving
      it to be inferred, states the conclusion directly — sbrR "encodes an anti-σ factor that
      inhibits the activity of its cognate extracytoplasmic-function σ factor, SbrI" — and backs
      it with a two-hybrid interaction localised to an N-terminal region that is by itself
      sufficient to inhibit SbrI-dependent expression. Sufficiency of a subfragment is a stronger
      result than the mutant phenotype an IMP normally rests on, because it shows the inhibition
      travels with the protein rather than with the operon. Accepted as core.
