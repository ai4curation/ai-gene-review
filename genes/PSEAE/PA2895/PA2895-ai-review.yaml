id: Q9HZV2
gene_symbol: PA2895
product_type: PROTEIN
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
status: COMPLETE
description: >-
  PA2895 is SbrR, the anti-sigma factor that holds the extracytoplasmic-function sigma factor SbrI
  (PA2896) inactive. An N-terminal region of SbrR binds SbrI directly, and that region alone is
  enough to block SbrI-dependent transcription; SbrI for its part associates with RNA polymerase,
  so the point of control is the formation of a transcribing holoenzyme rather than anything
  downstream of it. The protein carries a single predicted transmembrane helix, the layout
  expected of a membrane-anchored anti-sigma factor whose sigma-binding domain faces the cytoplasm.
  Releasing SbrI lets it transcribe muiA, which in turn suppresses swarming motility and promotes
  biofilm formation, so loss of SbrR shifts the organism between those two surface behaviours
  without SbrR acting on either directly.
references:
- id: PMID:26620262
  title: >-
    σ Factor and Anti-σ Factor That Control Swarming Motility and Biofilm Formation in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      The paper assigns both loci explicitly, so the attribution of the anti-sigma activity to
      PA2895 rests on the authors' own identification rather than on inference.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Here, we provide evidence that sbrR (PA2895), a gene previously identified as required
      during chronic P. aeruginosa respiratory infection, encodes an anti-σ factor that inhibits
      the activity of its cognate extracytoplasmic-function σ factor, SbrI (PA2896).
  - statement: >-
      The interaction is direct and maps to the N-terminal region, which is also sufficient to
      inhibit the sigma factor's output.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Bacterial two-hybrid analysis identified an N-terminal region of SbrR that interacts
      directly with SbrI and that was sufficient for inhibition of SbrI-dependent gene expression.
  - statement: >-
      The sigma factor being antagonised engages RNA polymerase, which places the point of control
      at transcription initiation.
    reference_section_type: ABSTRACT
    supporting_text: >-
      We show that SbrI associates with RNA polymerase in vivo and identify the SbrIR regulon.
  - statement: >-
      The motility and biofilm phenotypes are mediated by an SbrI-dependent gene, muiA, so they
      are two steps removed from anything SbrR does itself.
    reference_section_type: ABSTRACT
    supporting_text: >-
      In cells lacking SbrR, the SbrI-dependent expression of muiA was found to inhibit swarming
      motility and promote biofilm formation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (McGuffie, Vallet-Gely & Dove 2015, J Bacteriol). Abstract-only in the
      cache, but the abstract names both loci, states the direct interaction and the region that
      carries it, and reports the RNA polymerase association, so both annotated rows can be
      checked without the full text. It is the only experimental source on this gene.
