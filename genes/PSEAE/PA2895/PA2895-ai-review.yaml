  review:
    summary: >-
      The process the activity constitutes, and the specific level is justified rather than
      assumed: the sigma factor being withheld is one shown to associate with RNA polymerase.
    action: ACCEPT
    reason: >-
      The gene product performs the step rather than being required for it: sequestering a sigma
      factor is how this negative regulation happens, with no intermediary to credit it to. The
      choice of the initiation term over a generic repression term is supported by this row's own
      reference, which reports that SbrI "associates with RNA polymerase in vivo" — a sigma factor
      withheld from the polymerase cannot direct promoter recognition, which is initiation, and
      the inhibition is observed as loss of SbrI-dependent gene expression. Accepted as core
      alongside the molecular function.
    supported_by:
    - reference_id: PMID:26620262
      reference_section_type: ABSTRACT
      supporting_text: >-
        We show that SbrI associates with RNA polymerase in vivo and identify the SbrIR regulon.
core_functions:
- description: >-
    Anti-sigma factor for the extracytoplasmic-function sigma factor SbrI: binds SbrI through an
    N-terminal region and holds it away from RNA polymerase, so that the SbrI regulon stays silent
    until the anti-sigma factor releases it.
  molecular_function:
    id: GO:0016989
    label: sigma factor antagonist activity
  directly_involved_in:
  - id: GO:2000143
    label: negative regulation of DNA-templated transcription initiation
  supported_by:
  - reference_id: PMID:26620262
    reference_section_type: ABSTRACT
    supporting_text: >-
      Here, we provide evidence that sbrR (PA2895), a gene previously identified as required
      during chronic P. aeruginosa respiratory infection, encodes an anti-σ factor that inhibits
      the activity of its cognate extracytoplasmic-function σ factor, SbrI (PA2896).
  knowledge_gaps:
  - gap_statement: >-
      What releases SbrI is unknown. Extracytoplasmic-function anti-sigma factors are typically
      inactivated by a signal sensed outside the cytoplasm, often through proteolysis of the
      anchor, but no inducing condition, protease or signal has been identified for SbrR, so the
      system is known only in its off state.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Whether SbrR is membrane-anchored in the cell is untested. A single transmembrane helix is
      predicted at residues 65 to 87 and would place the sigma-binding N-terminus in the
      cytoplasm, consistent with the region the paper found sufficient, but the topology has not
      been determined experimentally and the prediction is the only evidence for it.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Is SbrR an integral membrane protein, and if so does regulated proteolysis release SbrI? The
    predicted helix at 65-87 and the N-terminal location of the sigma-binding region together
    suggest the standard extracytoplasmic-function architecture, which would predict a
    site-1/site-2 protease pair that nobody has looked for in this system.
- question: >-
    What does the periplasmic portion sense? If the topology holds, residues after the helix face
    the periplasm, and identifying their ligand would turn a regulator known only by its target
    into one known by its input — the paper notes SbrIR has been implicated in responses to
    antimicrobial and cell envelope stress, which is a starting point rather than an answer.
- question: >-
    Does SbrR act only on SbrI? Anti-sigma factors are usually cognate-specific and the paper
    describes SbrI as its cognate partner, but P. aeruginosa carries many extracytoplasmic-function
    sigma factors and cross-talk has not been excluded.
suggested_experiments:
- description: >-
    Determine SbrR's topology directly, by alkaline phosphatase and beta-galactosidase fusions at
    intervals through the sequence, or by protease protection of spheroplasts. This would convert
    the predicted anchor into a measured one and establish which face the C-terminus occupies.
- description: >-
    Screen for conditions that activate the SbrI regulon in a wild-type background, using the
    SbrI-dependent muiA promoter as the reporter the paper already validated, then test candidate
    envelope stresses for SbrR cleavage by immunoblot.
- description: >-
    Test cognate specificity by asking whether the N-terminal fragment that inhibits SbrI also
    inhibits other P. aeruginosa extracytoplasmic-function sigma factors in the same two-hybrid
    and reporter assays.
