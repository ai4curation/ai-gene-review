taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA0906 (alpR) encodes AlpR, an essential lambda CI/LexA-like transcriptional repressor with
  an N-terminal Cro/C1-type helix-turn-helix DNA-binding domain and a C-terminal peptidase S24
  (LexA-like) domain carrying a Ser-Lys dyad. AlpR binds the alpR-alpA and alpA-alpB intergenic regions and
  directly represses its own gene and the divergent alpABCDE operon. DNA damage (ciprofloxacin, hydrogen
  peroxide) triggers Ser153-dependent cleavage of AlpR, which de-represses alpA; AlpA then activates the
  alpBCDE lysis cassette, causing lysis of a subset of cells in a programmed-cell-death pathway that
  enhances virulence in a mouse lung infection model. AlpR is essential because it keeps this lysis
  program off.
