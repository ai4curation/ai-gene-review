suggested_questions:
- question: Is AlpR cleavage RecA-dependent, and does it proceed by self-cleavage in vitro as for LexA?
- question: Should GO add a regulation-of-autolysis term so that bacterial lysis repressors need not use
    the generic programmed-cell-death regulation term?
suggested_experiments:
- description: Reconstitute AlpR cleavage in vitro with purified AlpR, activated RecA filaments and
