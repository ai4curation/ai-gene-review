- term:
    id: GO:0016540
    label: protein autoprocessing
  evidence_type: IMP
  original_reference_id: PMID:26100878
  qualifier: involved_in
  review:
    summary: Proposed. AlpR is cleaved after DNA damage, and replacing the Ser-Lys dyad serine (S153A)
      abolishes cleavage.
    action: NEW
    reason: AlpR carries the LexA/CI-type peptidase S24 domain and its cleavage depends on the dyad serine of
      that domain, so AlpR itself does the cleaving, the autoprocessing case named in CLAUDE.md. Cleavage
      was not reconstituted in vitro, so self-catalysis rests on the mutant plus family mechanism.
    supported_by:
    - reference_id: PMID:26100878
      supporting_text: Like the related λCI and LexA proteins, AlpR contains a so-called Ser-Lys dyad that in
        LexA and in λCI mediates autocleavage
    - reference_id: PMID:26100878
      supporting_text: These findings suggest that AlpR undergoes cleavage in response to DNA damage and
        establish that substitution S153A results in a mutant version of AlpR that cannot undergo
        autocleavage.
