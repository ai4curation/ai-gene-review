- term:
    id: GO:0001896
    label: autolysis
  evidence_type: IMP
  original_reference_id: PMID:26100878
  qualifier: involved_in
  review:
    summary: PseudoCAP IMP; lysis follows AlpR depletion, ectopic AlpR-CTD expression, or DNA-damage-induced
      AlpR cleavage. Not a PAINT seed.
    action: MODIFY
    reason: AlpR does not carry out lysis; the alpBCDE products do, after AlpA activates them. AlpR is the
      repressor that keeps the lysis program off, and its cleavage releases it. The gene's role is
      therefore negative regulation of a programmed cell death process (autolysis is_a programmed cell
      death; GO has no regulation-of-autolysis term).
    proposed_replacement_terms:
    - id: GO:0043069
      label: negative regulation of programmed cell death
    supported_by:
    - reference_id: PMID:26100878
      supporting_text: Cleavage of AlpR triggers a cell lysis program through de-repression of the alpA gene,
        which encodes a positive regulator that activates expression of the alpBCDE lysis cassette.
    - reference_id: PMID:26100878
      supporting_text: suggesting that AlpR is essential because it represses expression of one or more of the
        alpABCDE genes
    source_defects:
