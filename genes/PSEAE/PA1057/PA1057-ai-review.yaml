- id: PMID:16030218
  title: 'Characterization of a multigene-encoded sodium/hydrogen antiporter (sha)
    from Pseudomonas aeruginosa: its involvement in pathogenesis.'
  full_text_unavailable: true
  findings:
  - statement: >-
      The PA1054-PA1059 cluster encodes a Na+/H+ antiporter; only PA1054 was
      mutated in P. aeruginosa.
    supporting_text: >-
      We disrupted PA1054 (a shaA homologue gene) and determined its effect on
      Na+ tolerance during growth, Na+ efflux, and pathogenicity in mice.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      PubMed-verified (Kosono et al. 2005, J Bacteriol). Right paper for the
      Sha antiporter, but it does not support an IMP for PA1057: only PA1054
      was disrupted, and the antiport evidence is for the whole cluster. PMC
      copy is a scanned PDF; abstract read.
- id: PMID:20624916
  title: Single site mutations in the hetero-oligomeric Mrp antiporter from alkaliphilic
    Bacillus pseudofirmus OF4 that affect Na+/H+ antiport activity, sodium exclusion,
    individual Mrp protein levels, or Mrp complex formation.
  findings:
  - statement: MrpE is required for normal membrane levels of other Mrp subunits and for complex formation.
    supporting_text: >-
      The results extended indications that MrpE is required for normal
      membrane levels of other Mrp proteins and for complex formation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Morino et al. 2010, J Biol Chem); family-level evidence.
- id: PMID:29218041
  title: Mrp Antiporters Have Important Roles in Diverse Bacteria and Archaea.
  findings:
  - statement: MrpE is reported dispensable for ion transport in B. subtilis.
    supporting_text: >-
      However, in B. subtilis, it was reported that MrpE is dispensable for
      ion transport activity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified review (Ito, Morino and Krulwich 2017, Front Microbiol).
- id: PMID:36241630
  title: Ion transfer mechanisms in Mrp-type antiporters from high resolution cryoEM
    and molecular dynamics simulations.
  findings:
  - statement: One mechanistic model has Na+ entering from the cytoplasm via MrpE.
    supporting_text: >-
      while sodium is taken up from the cytoplasm by MrpE and released to the
      periplasm at the interface of MrpA, MrpC, and MrpD
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Lee et al. 2022, Nat Commun); B. pseudofirmus Mrp structure.
- id: PMID:29754813
  title: Structure of an Ancient Respiratory System.
