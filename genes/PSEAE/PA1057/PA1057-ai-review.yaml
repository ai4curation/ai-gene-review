suggested_questions:
- question: >-
    Should GO provide a cellular component term for the Mrp-type
    multisubunit Na+/H+ antiporter complex, by analogy with GO:1903103
    potassium:proton antiporter complex, so that accessory subunits such as
    MrpE can be annotated to the complex?
- question: >-
    Is P. aeruginosa ShaE required for Sha antiport activity, as in
    B. pseudofirmus, or dispensable, as reported for B. subtilis?
suggested_experiments:
- description: >-
    Make an in-frame PA1057 (shaE) deletion, then test Na+ tolerance, Na+
    efflux and Sha complex assembly (BN-PAGE). Also express the cluster
    lacking only PA1057 in E. coli TO114 and assay Na+/H+ antiport in everted
    vesicles.
