  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1057 encodes subunit E (ShaE/MrpE) of the Sha (Mrp/Mnh/Pha) multisubunit
  Na+/H+ antiporter of Pseudomonas aeruginosa PAO1. It is a 174-residue
  integral membrane protein with short predicted transmembrane helices and a
  cytoplasmic region, in the CPA3 subunit E (MNHE) family. It is the fourth
  gene of the six-gene sha cluster PA1054-PA1059, in which shaA and shaB are
  fused. The cluster restores Na+ tolerance and Na+/H+ antiport to an E. coli
  strain lacking its major antiporters, and in P. aeruginosa the Sha
  antiporter is largely responsible for Na+ extrusion and supports virulence
  in mouse infection models. In Bacillus Mrp antiporters, subunit E is needed
  for normal levels of the other subunits and for assembly of the active
  hetero-oligomeric complex, though one species reports it dispensable for
  transport. Structures place it at the dimer interface, and it has been
  proposed as the cytoplasmic entry route for Na+.
