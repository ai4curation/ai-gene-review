- term:
    id: GO:0000155
    label: phosphorelay sensor kinase activity
  evidence_type: IMP
  original_reference_id: PMID:20547815
  qualifier: enables
  review:
    summary: >-
      Fernandez et al. 2010 identified ParR-ParS as the system needed for
      peptide-induced arn expression and adaptive polymyxin resistance.
    action: ACCEPT
    reason: >-
      The function is right and is ParS's core activity, so the row is
      accepted. Its evidence code is questionable: the abstract reports mutant
      phenotypes (loss of arn induction and adaptive resistance), not a
      kinase, autophosphorylation or phosphotransfer assay, so the molecular
      function is inferred from phenotype plus domain architecture. Filed as a
      CHECK at SUSPECTED because the full text was not available, matching the
      parR GO:0000156 row from the same paper.
    supported_by:
    - reference_id: PMID:20547815
      supporting_text: >-
        This system was required for activation of the arnBCADTEF LPS
        modification operon in the presence of subinhibitory concentrations of
        polymyxin, colistin, or the bovine peptide indolicidin, leading to
        increased resistance to various polycationic antibiotics, including
        aminoglycosides.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000315
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        The GO:0000155 row on PA1798 is coded IMP from PMID:20547815, but the
        evidence in the cited abstract is a mutant phenotype of the ParR-ParS
        system (loss of peptide-induced arnBCADTEF expression and of adaptive
        polymyxin resistance), not an assay of ParS kinase or phosphotransfer
        activity. The row is one of three seeds of the PAINT IBD on
        PTN001293174 (the other two, EnvZ and PA5484, are IDA, so the node is
        unaffected). Requested change - confirm whether the full text contains
        an autophosphorylation or phosphotransfer experiment; if not, consider
        recoding as an inference from the HisKA/HATPase architecture while
        keeping the term. SUSPECTED because the full text was not read.
      supported_by:
      - reference_id: PMID:20547815
        supporting_text: >-
          Here we describe the identification and characterization of a novel
          P. aeruginosa two-component regulator affecting polymyxin-adaptive
          resistance, ParR-ParS (PA1799-PA1798).
