taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ParS (PA1798) is the membrane sensor histidine kinase of the ParR-ParS
  two-component system of Pseudomonas aeruginosa. The 428-residue protein has
  a transmembrane segment followed by a cytoplasmic HAMP linker and a
  HisKA/HATPase histidine kinase module with the conserved autophosphorylation
  site His218. In response to subinhibitory concentrations of polymyxins,
  colistin and cationic antimicrobial peptides it activates its cognate
  response regulator ParR (PA1799), which switches on the arnBCADTEF-ugd lipid
  A aminoarabinosylation operon and mexXY and represses the porin gene oprD,
  producing adaptive resistance to polymyxins and aminoglycosides.
