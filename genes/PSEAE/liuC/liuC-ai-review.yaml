  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:16517656
  title: The atu and liu clusters are involved in the catabolic pathways for acyclic monoterpenes and leucine
    in Pseudomonas aeruginosa.
  findings:
  - statement: The atu and liu clusters are both needed for acyclic monoterpene and leucine catabolism.
    supporting_text: Our results suggest that the atu and liu clusters are bifunctional operons involved in
      both the AMTC and leucine catabolic pathways.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Cited by PseudoCAP for GO:0004490 (IMP) and GO:0008300 (IMP). The abstract supports the
      process claims at cluster level but does not mention a liuC mutant or hydratase assay; full text
      (PMC1393232) was not retrievable, so the MF evidence could not be checked.
- id: PMID:16820476
  title: Identification of genes and proteins necessary for catabolism of acyclic terpenes and
    leucine/isovalerate in Pseudomonas aeruginosa.
  findings:
  - statement: Insertion mutants show the liu cluster is essential for leucine and isovalerate utilization;
      P. putida has a Liu pathway but cannot grow on acyclic terpenes.
    supporting_text: P. fluorescens, but not P. putida, could grow on acyclic terpenes (citronellol and
      citronellate), while both species were able to utilize leucine and isovalerate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cited by PseudoCAP for GO:0006552 and GO:0046247 (IMP). The abstract supports leucine
      catabolism for the liu cluster; the terpene role of liu genes is stated explicitly in the later
      PMID:18625020 from the same lab. Abstract only (PMC1489323 returned no full text).
- id: PMID:16272386
  title: Methylcrotonyl-CoA and geranyl-CoA carboxylases are involved in leucine/isovalerate utilization (Liu)
    and acyclic terpene utilization (Atu), and are encoded by liuB/liuD and atuC/atuF, in Pseudomonas
    aeruginosa.
  findings:
  - statement: The Atu pathway joins the Liu pathway at methylcrotonyl-CoA; LiuB/LiuD are the MCase subunits.
    supporting_text: The catabolic pathway of citronellol (Atu, acyclic terpene utilization) enters that of
      leucine/isovalerate (Liu, leucine and isovalerate utilization) at the level of methylcrotonyl-CoA.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; establishes the pathway convergence that explains LiuC's terpenoid role.
- id: PMID:18625020
  title: Biochemical characterization of isovaleryl-CoA dehydrogenase (LiuA) of Pseudomonas aeruginosa and the
    importance of liu genes fora functional catabolic pathway of methyl-branched compounds.
  findings:
  - statement: Insertion mutants in every liu gene fail to grow on acyclic terpenes and on leucine or
      isovalerate.
    supporting_text: Mutants with insertion in any of the liu genes were unable to utilize acyclic terpenes
      or leucine/isovalerate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; the most direct genetic support for liuC in both pathways.
- id: PMID:19459965
  title: The Pseudomonas aeruginosa liuE gene encodes the 3-hydroxy-3-methylglutaryl coenzyme A lyase,
    involved in leucine and acyclic terpene catabolism.
  findings:
  - statement: LiuE, downstream of LiuC, is the HMG-CoA lyase.
    supporting_text: These results demonstrate that the liuE gene of P. aeruginosa encodes for the HMG-CoA
      lyase
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; defines the substrate of the step after LiuC.
