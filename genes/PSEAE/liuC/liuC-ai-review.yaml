- term:
    id: GO:0004490
    label: methylglutaconyl-CoA hydratase activity
  evidence_type: IMP
  original_reference_id: PMID:16517656
  qualifier: enables
  review:
    summary: PseudoCAP IMP from the mutational analysis of the atu and liu clusters. Sole seed of the GO:0004490
      IBD at PTN001733227.
    action: ACCEPT
    reason: The abstract does not describe a liuC mutant or a hydratase assay, and the full text could not be
      read, so the evidence behind the row is unverified; a mutant phenotype by itself would only show
      that the pathway needs the gene. The function is nevertheless clearly correct for LiuC by pathway
      logic (the carboxylase LiuB/LiuD makes 3-methylglutaconyl-CoA, the lyase LiuE needs HMG-CoA, and LiuC
      is the cluster's only crotonase), so I defer to the curator.
