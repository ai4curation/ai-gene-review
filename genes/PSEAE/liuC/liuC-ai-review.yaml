taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: liuC (PA2013) encodes the 3-methylglutaconyl-CoA hydratase of the leucine/isovalerate
  utilization (Liu) pathway of Pseudomonas aeruginosa, a crotonase-family enzyme that interconverts
  trans-3-methylglutaconyl-CoA and (S)-3-hydroxy-3-methylglutaryl-CoA (HMG-CoA). It sits between the
  methylcrotonyl-CoA carboxylase LiuB/LiuD, which makes 3-methylglutaconyl-CoA, and the HMG-CoA lyase LiuE,
  which cleaves HMG-CoA to acetyl-CoA and acetoacetate. In P. aeruginosa the acyclic terpene utilization
  (Atu) pathway for citronellol and geraniol enters the Liu pathway at methylcrotonyl-CoA, so the Liu
  enzymes, including LiuC, are needed for growth both on leucine or isovalerate and on acyclic
  monoterpenoids.
