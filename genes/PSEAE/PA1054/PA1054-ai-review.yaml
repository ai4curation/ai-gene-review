    supporting_text: >-
      Disruption of PA1054 resulted in severe Na+ sensitivity during growth
      and decreased Na+ efflux activity.
  - reference_id: PMID:29218041
    supporting_text: >-
      In previous studies, none of the Mrp antiporters exhibited antiport
      activity with MrpA or MrpD alone.
suggested_questions:
- question: >-
    Should GO provide a cellular component term for the Mrp-type
    multisubunit Na+/H+ antiporter complex, by analogy with GO:1903103
    potassium:proton antiporter complex, so that Sha/Mrp subunits can be
    annotated to the complex instead of each carrying the activity?
- question: >-
    Should the MrpA-family IBD at PTN000511949 reach Sulfolobus SSO1021,
    named as a formate hydrogenlyase subunit (HycC)?
suggested_experiments:
- description: >-
    Make in-frame deletions separating the MrpA-like and MrpB-like parts of
    PA1054 and test which is needed for Na+ tolerance, Na+ efflux and Sha
    complex assembly (BN-PAGE); assay Na+/H+ antiport in everted vesicles of
    E. coli TO114 carrying each variant cluster.
