taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1054 (shaA) encodes the large ShaAB subunit of the Sha (Mrp/Mnh/Pha)
  multisubunit Na+/H+ antiporter of Pseudomonas aeruginosa PAO1. It is a
  933-residue integral membrane protein with about 22 predicted transmembrane
  helices. It is a fusion of an MrpA-type part (the NuoL/ND5-like
  antiporter-like domain plus the Mrp-specific C-terminal region) and an
  MrpB-type part (MnhB domain), as in other Gram-negative Mrp operons. PA1054
  is the first gene of the six-gene sha cluster PA1054-PA1059. The cluster
  restores Na+ tolerance and Na+/H+ antiport to an E. coli strain lacking its
  major antiporters, but not when PA1054 is deleted. Disruption of PA1054 in
  P. aeruginosa causes severe Na+ sensitivity, lowers Na+ efflux and
  attenuates virulence and organ colonization in mouse infection models. In
  Mrp antiporters, MrpA carries putative proton and Na+ translocation
  pathways, but antiport needs the hetero-oligomeric complex of all subunits.
