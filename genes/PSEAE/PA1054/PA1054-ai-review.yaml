core_functions:
- description: >-
    Large fused subunit (ShaAB; MrpA plus MrpB parts) of the Sha
    multisubunit Na+/H+ antiporter, which extrudes Na+ across the
    cytoplasmic membrane in exchange for H+. It is required for the activity
    and carries putative ion translocation pathways, but contributes to the
    activity of the complex rather than acting alone.
  contributes_to_molecular_function:
    id: GO:0015385
    label: sodium:proton antiporter activity
