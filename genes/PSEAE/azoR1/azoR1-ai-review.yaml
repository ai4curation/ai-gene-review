- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000811013
  - UniProtKB:P41407
  review:
    summary: >-
      IBA from PTN000811013, seeded only by E. coli AzoR (EcoCyc IMP,
      PMID:11583992). E. coli AzoR mutants lose viability under electrophilic
      quinone stress.
    action: KEEP_AS_NON_CORE
    reason: >-
      A plausible inherited role: quinone reductases that make quinols prevent
      redox cycling, and the E. coli ortholog protects against electrophilic
      quinones. The E. coli phenotype is thiol-specific (electrophile) stress
      rather than reactive oxygen stress, and no P. aeruginosa mutant phenotype is
      known, so this is kept as a non-core inference.
    supported_by:
    - reference_id: PMID:19666717
      supporting_text: >-
        These data indicated that AzoR is a quinone reductase providing resistance
        to thiol-specific stress caused by electrophilic quinones.
    - reference_id: PMID:24915188
      supporting_text: >-
        The quinones identified in this study appear to be the best substrates for
        the enzymes yet identified, indicating that they may act as the
        physiological substrate for these enzymes.
