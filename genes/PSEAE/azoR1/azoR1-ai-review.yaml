- id: PMID:24915188
  title: 'Identification of NAD(P)H quinone oxidoreductase activity in azoreductases
    from P. aeruginosa: azoreductases and NAD(P)H quinone oxidoreductases belong to
    the same FMN-dependent superfamily of enzymes.'
  findings:
  - statement: >-
      Purified paAzoR1, paAzoR2 and paAzoR3 reduce quinones, at rates far above
      those for azo substrates.
    supporting_text: >-
      Rates of quinone reduction in all cases were up to two orders of magnitude
      higher than were observed for reduction of azo substrates
  - statement: The three paralogs differ in quinone preference.
    supporting_text: >-
      paAzoR2 reduces both benzoquinones and naphthoquinones efficiently
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC4051601). PseudoCAP source for the IDA GO:0016655 row that
      seeds PTN000024600, and UniProt source for the EXP GO:0003960 row. Purified
      recombinant enzymes assayed spectrophotometrically with a panel of quinones;
      quinone-bound paAzoR1 structures. The product (quinol or semiquinone) was not
      measured.
- id: PMID:17904577
  title: Molecular cloning, characterisation and ligand-bound structure of an azoreductase
    from Pseudomonas aeruginosa.
  findings:
  - statement: PA0785 encodes an FMN-containing azoreductase, not an acyl carrier protein phosphodiesterase.
    supporting_text: >-
      The purified recombinant enzyme exhibits activity corresponding to that of
      azoreductase but not acpD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. First biochemical and structural characterisation of paAzoR1.
- id: PMID:19666717
  title: The Escherichia coli azoreductase AzoR Is involved in resistance to thiol-specific
    stress caused by electrophilic quinones.
  findings:
  - statement: E. coli AzoR, the experimental seed of the family nodes, is a quinone reductase that protects against electrophilic quinones.
    supporting_text: >-
      These data indicated that AzoR is a quinone reductase providing resistance
      to thiol-specific stress caused by electrophilic quinones.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Ortholog paper; the basis of the E. coli IDA seed of
      PTN000024600 and of the physiological interpretation of the family.
- id: PMID:20417637
  title: A novel mechanism for azoreduction.
  findings:
  - statement: The three P. aeruginosa azoreductases have distinct azo substrate profiles.
    supporting_text: >-
      The pure recombinant proteins each have a distinct substrate specificity
      profile against a range of azo substrates.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Compares paAzoR1-3 and proposes the FMN-binding cradle.
- id: PMID:22355582
  title: 'Activation of nitrofurazone by azoreductases: multiple activities in one enzyme.'
  findings:
  - statement: paAzoR1 also reduces the nitrofuran antibiotic nitrofurazone.
    supporting_text: >-
      azoreductases have a wider role in drug metabolism than previously thought
      as they can also reduce and hence activate nitrofurazone
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text in cache. Secondary activity (nitroreduction) of paAzoR1.
