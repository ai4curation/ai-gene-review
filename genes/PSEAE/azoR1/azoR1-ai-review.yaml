suggested_questions:
- question: >-
    Is the product of quinone reduction by paAzoR1 the quinol (two-electron) or the
    semiquinone, as the UniProt Rhea reaction states?
- question: >-
    GO has no term for FMN-dependent NADH-azoreductase activity (EC 1.7.1.17); only
    GO:0050446 azobenzene reductase (NADP+) exists. Should one be requested for the
    azoreductase type 1 family?
suggested_experiments:
- description: >-
    Delete azoR1, azoR2 and azoR3 singly and together in PAO1 and test survival
    under benzoquinone, menadione, plumbagin and homogentisate challenge, to see
    whether the measured quinone reductase activity protects the cell as E. coli
    AzoR does.
  experiment_type: genetic interaction / stress survival
- description: >-
    Identify the reduction product (quinol versus semiquinone) by anaerobic
    spectroscopy or EPR during steady-state turnover with benzoquinone.
  experiment_type: enzyme mechanism
