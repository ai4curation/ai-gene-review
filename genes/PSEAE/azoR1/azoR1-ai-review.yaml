- term:
    id: GO:0016652
    label: oxidoreductase activity, acting on NAD(P)H as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000101231
  review:
    summary: >-
      UniRule mapping to a term whose definition has NAD(P)+ as the electron
      acceptor (transhydrogenase-type, EC 1.6.1). AzoR enzymes use NAD(P)H as the
      donor and quinones, azo or nitro compounds as acceptors.
    action: REMOVE
    reason: >-
      GO:0016652 is defined as NADH or NADPH reducing NAD+ or NADP. No
      azoreductase reduces a pyridine nucleotide. The mapping probably comes from
      the EC 1.7.1.17 reaction, which is written in the reverse direction with
      NAD+ as acceptor; EC 1.7.1 is not EC 1.6.1. The mapping is demonstrably
      wrong.
    supported_by:
    - reference_id: PMID:17904577
      supporting_text: >-
        During azo reduction, FMN serves as a redox centre in the
        electron-transferring system by mediating the electron transfer from
        NAD(P)H to the azo substrate.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniRule:UR000101231
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0016652
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        UniRule UR000101231 (azoreductase type 1, HAMAP MF_01216) maps GO:0016652
        oxidoreductase activity, acting on NAD(P)H, NAD(P) as acceptor. That term
        is for enzymes in which NAD(P)H reduces NAD(P)+ (EC 1.6.1). Azoreductases
        transfer electrons from NAD(P)H to quinones and azo compounds; the
        appropriate terms are GO:0016655 and its child GO:0003955. Checked against
        the GO definition. The same mapping reaches azoR2 (Q9I2E2) and azoR3
        (Q9HZ17) and every MF_01216 member.
