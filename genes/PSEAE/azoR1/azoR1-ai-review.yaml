gene_symbol: azoR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  azoR1 (PA0785) encodes paAzoR1, a soluble FMN-dependent flavodoxin-fold
  NAD(P)H:quinone oxidoreductase of the azoreductase type 1 family. The purified
  enzyme binds one FMN per subunit, forms dimers that associate into tetramers,
  and uses NADPH (and NADH) to reduce quinones, with a preference for
  benzoquinones, at rates far above those for azo compounds. It also reduces azo
  dyes and azo pro-drugs (balsalazide, sulfasalazine, olsalazine) and the
  nitrofuran antibiotic nitrofurazone. Crystal structures with methyl red,
  balsalazide, nitrofurazone and quinones show a hydrophobic active site formed
  between two monomers above the FMN. By analogy with Escherichia coli AzoR, its
  physiological role is thought to be two-electron reduction of electrophilic
  quinones to quinols, but no P. aeruginosa mutant phenotype has been reported.
