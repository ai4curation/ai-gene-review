- term:
    id: GO:0003960
    label: quinone reductase (NADPH) activity
  evidence_type: EXP
  original_reference_id: PMID:24915188
  qualifier: enables
  review:
    summary: >-
      UniProt EXP row from Ryan et al. 2014, which measured NADPH oxidation by
      purified paAzoR1 in the presence of quinones. The quinone reductase claim is
      right; the chosen GO term defines a one-electron reaction that yields
      semiquinones.
    action: MODIFY
    reason: >-
      GO:0003960 is defined as 2 quinone + NADPH = 2 1,4-benzosemiquinone + NADP+
      (RHEA:14269), the one-electron reaction of zeta-crystallin-type enzymes.
      paAzoR1 is an FMN flavoenzyme that transfers a hydride, and the paper places
      it among the two-electron NAD(P)H quinone oxidoreductases that make quinols.
      The paper did not identify the product, so this is a lateral correction to
      GO:0003955, which states the quinol-forming reaction, rather than a claim
      that semiquinone formation was disproved.
    proposed_replacement_terms:
    - id: GO:0003955
      label: NAD(P)H dehydrogenase (quinone) activity
    supported_by:
    - reference_id: PMID:24915188
      supporting_text: >-
        Two electron reduction reactions of quinones are carried out by a group of
        enzymes known as NAD(P)H quinone oxidoreductases.
    - reference_id: PMID:24915188
      supporting_text: >-
        Rates of quinone reduction were obtained by monitoring the absorbance at 340
        nm for oxidation of either NADPH (paAzoR1) or NADH (paAzoR2 and paAzoR3).
    source_defects:
