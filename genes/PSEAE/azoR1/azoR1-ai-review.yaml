      corrected_value: GO:0003955
      corrected_label: NAD(P)H dehydrogenase (quinone) activity
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        UniProt EXP row for Q9I5F3 (paAzoR1) from PMID:24915188 and its
        CATALYTIC ACTIVITY line use RHEA:14269, which yields 1,4-benzosemiquinone
