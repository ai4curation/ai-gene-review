  label: Pseudomonas aeruginosa PAO1
description: TssM1 is the large multi-pass inner-membrane component of the Pseudomonas aeruginosa H1-T6SS membrane complex. It spans the inner membrane and, with TssJ1 and TssL1, completes the trans-envelope TssJLM channel that anchors the apparatus and stabilizes the membrane-proximal baseplate.
