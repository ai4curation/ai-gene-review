suggested_questions:
- question: >-
    Why is P. aeruginosa lysA expressed constitutively, without the LysR-type
    lysine regulation seen for E. coli lysA?
suggested_experiments:
- description: >-
    Purify P. aeruginosa LysA and determine its kinetic parameters for
    meso-DAP, to confirm stereospecificity and compare with E. coli LysA.
