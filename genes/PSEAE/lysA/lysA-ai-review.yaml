id: P19572
gene_symbol: lysA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  LysA (PA5277) is the diaminopimelate decarboxylase of Pseudomonas aeruginosa, a
  pyridoxal 5'-phosphate-dependent fold-type III decarboxylase of the
  Orn/Lys/Arg decarboxylase class-II family (LysA subfamily). It decarboxylates
  meso-2,6-diaminopimelate to L-lysine, the final step of the diaminopimelate
  pathway of lysine biosynthesis. The cloned gene complements lysine auxotrophs
  of P. aeruginosa and Escherichia coli and is expressed constitutively.
references:
- id: PMID:3018430
  title: Heterologous expression and regulation of the lysA genes of Pseudomonas aeruginosa
    and Escherichia coli.
  findings:
  - statement: The cloned P. aeruginosa lysA gene encodes DAP-decarboxylase and complements
      lysA mutants of P. aeruginosa and E. coli.
    supporting_text: This gene complemented a lys mutation at the lys-12 locus of P.
      aeruginosa and a lysA defect in Escherichia coli.
  - statement: DAP-decarboxylase is synthesized constitutively.
    supporting_text: The P. aeruginosa DAP-decarboxylase was synthesized constitutively
      in P. aeruginosa as well as in E. coli
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP DAPDC activity row, which seeds the
      PTN000159906 IBD. Abstract only. The abstract states the gene identity,
      the enzyme and the cross-species complementation.
- id: file:PSEAE/lysA/lysA-notes.md
  title: lysA review notes
  findings:
  - statement: The PTN000159906 IBD also rests on characterised E. coli, M. tuberculosis
      and M. jannaschii LysA.
    supporting_text: three independently characterised DAPDCs
