id: Q05098
gene_symbol: pfeA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  pfeA (PA2688) encodes PfeA, the ferric-enterobactin receptor of Pseudomonas
  aeruginosa, a TonB-dependent outer membrane receptor orthologous to E. coli FepA
  (more than 60% identity). It has an N-terminal TonB box, a plug domain and a
  22-stranded beta-barrel embedded in the outer membrane. PfeA binds ferric
  enterobactin, a catecholate siderophore made by enteric bacteria but not by P.
  aeruginosa, and uses energy delivered by the TonB-ExbB-ExbD system to transport
  it across the outer membrane into the periplasm. This lets P. aeruginosa take up
  iron with a xenosiderophore under iron limitation. pfeA expression is induced by
  iron limitation and by enterobactin. The second receptor PirA is partly redundant
  with PfeA, so only the double mutant fails to use ferric enterobactin. PfeA also
  recognises synthetic catecholate siderophore analogues.
