suggested_questions:
- question: >-
    Should the PfeA/FepA enterobactin rows use GO:0015620 ferric-enterobactin
    transmembrane transporter activity rather than GO:0042931, given that the
    receptors transport the iron-loaded siderophore?
- question: >-
    Is the colicin transmembrane transporter IBD at PTN000763909 meant to reach the
    Pseudomonas leaf?
suggested_experiments:
- description: >-
    Test whether colicin B or D kills P. aeruginosa, or an E. coli fepA mutant
    expressing pfeA, to settle whether PfeA can act as a colicin receptor.
