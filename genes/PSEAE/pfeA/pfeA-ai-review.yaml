- term:
    id: GO:0038023
    label: signaling receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010105
  review:
    summary: InterPro2GO mapping of the TonB-dependent siderophore receptor signature.
    action: REMOVE
    reason: >-
      "Receptor" here means a ligand-binding transporter, not a signal transducer.
      TonB-dependent transducers carry an N-terminal signalling domain before the
      TonB box; PfeA has none (signal peptide 1-25, TonB box 39-44, plug from 47).
      Enterobactin-dependent induction of pfeA works through a separate
      two-component system. The InterPro2GO mapping over-generalises from the
      transducer subset of the family.
    supported_by:
    - reference_id: file:PSEAE/pfeA/pfeA-uniprot.txt
      record_section: ["FT:MOTIF"]
      supporting_text: 'MOTIF           39..44'
    - reference_id: file:PSEAE/pfeA/pfeA-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: 'DOMAIN          47..174'
- term:
    id: GO:0042912
    label: colicin transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000763909
  - UniProtKB:P05825
  review:
    summary: >-
      IBA from PTN000763909, seeded by E. coli FepA, which is also the receptor for
      colicins B and D.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Colicin uptake through FepA is an E. coli parasitism of the receptor. No
      evidence was found that PfeA admits colicins, and colicins B and D are not
      known to act on P. aeruginosa. The property is lineage-specific and is not
      safely inherited by the Pseudomonas leaf.
    supported_by:
    - reference_id: PMID:8419284
      supporting_text: >-
        The PfeA protein showed more than 60% homology to the E. coli FepA protein.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: UniProtKB:P05825
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          E. coli FepA is a colicin B/D receptor; nothing shows PfeA has that
          property.
    source_defects:
    - defect_type: OTHER
      resource: GO_CENTRAL
      record: PANTHER:PTN000763909
      requested_change: CHECK
      asserted_value: GO:0042912
      confidence: SUSPECTED
      explanation: >-
        The GO:0042912 colicin transmembrane transporter activity IBD at
        PTN000763909 (seeded by E. coli FepA P05825) propagates to P. aeruginosa
        PfeA (Q05098). Colicin B/D uptake through FepA is documented in E. coli;
        we found no evidence that PfeA transports colicins. Consider moving the IBD
        to an enterobacterial child node or adding NOT for PfeA.
