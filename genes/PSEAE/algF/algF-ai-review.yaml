core_functions:
- description: Noncatalytic periplasmic component of alginate O-acetylation machinery, supported
    by native AlgF–AlgX association and genetic evidence. Ortholog pairwise binding motivates
    an organizational model, but simultaneous macromolecular bridging and a distributed catalytic-complex
    activity have not been established; no molecular function is assigned solely to represent
    that uncertainty. Production/stability effects in the PDO300 strain additionally support
    a contribution to the biosynthetic machinery.
