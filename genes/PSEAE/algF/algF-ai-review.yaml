  findings:
  - statement: Reviews cross-membrane acyl-transfer systems and proposes an AlgI acyl-shuttle
      relay through AlgJ/F to AlgX; it explicitly states that the full alginate model has
      not been demonstrated.
    supporting_text: This full model has yet to be demonstrated experimentally
