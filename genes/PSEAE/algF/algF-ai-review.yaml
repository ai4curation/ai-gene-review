  label: Pseudomonas aeruginosa PAO1
description: AlgF is a noncatalytic periplasmic component of the Pseudomonas aeruginosa alginate
  O-acetylation machinery. Its two beta-sandwich domains and association with AlgX, together
  with direct AlgJ/AlgX binding by its Pseudomonas putida ortholog, support a role in organizing
  protein interactions among the acetylation components. AlgF is required for alginate acetylation
  but is not established as an acetyltransferase or polymer-binding enzyme. The proposed role
  in bringing AlgJ and AlgX into proximity is supported by complementary interaction and genetic
  evidence; the complete bridging arrangement and acetyl-group handoff remain unresolved.
