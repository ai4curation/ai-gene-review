- id: PMID:12003941
  title: Mutant analysis and cellular localization of the AlgI, AlgJ, and AlgF proteins required
    for O acetylation of alginate in Pseudomonas aeruginosa.
  findings:
  - statement: Nonpolar algI/algJ/algF deletion and complementation distinguish alginate acetylation
      from polymer production. PhoA fusion and fractionation distinguish membrane AlgI, membrane-tethered
      periplasmic AlgJ, and soluble periplasmic AlgF.
    supporting_text: each mutant produced alginate lacking O-acetyl groups.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native FRD1 genetic/localization study; does not establish each protein’s
      chemical reaction. Accessible cached abstract inspected; full experimental text not
      available in the cache.
- id: PMID:7934909
  title: Nucleotide sequence and expression of the Pseudomonas aeruginosa algF gene controlling
    acetylation of alginate.
  findings:
  - statement: AlgF is processed after its N-terminal signal sequence and is required for
      alginate acetylation; the apparent polymer-production defect is separated from downstream
      algA polarity.
    supporting_text: Although the algA gene, provided in trans, restored synthesis of alginate,
      the alginate was non-acetylated.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native genetics supports modification rather than direct polymerization.
      Accessible cached abstract inspected; full experimental text not available in the cache.
- id: PMID:31900562
  title: Analysis of the alginate O-acetylation machinery in Pseudomonas aeruginosa.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: AlgF deletion affects polymer yield in this strain; do not equate that with
      direct backbone synthesis. Accessible cached abstract inspected; full experimental text
      not available in the cache. The legacy full_text_html metadata refers to a repository
      page containing a duplicate abstract, not substantive article sections.
  findings:
  - statement: Native PDO300 knockouts, complementation, mutual stability and pull-downs link
      AlgI/J/F to the alginate-production complex. AlgI-to-AlgJ-to-AlgX chemical transfer
      is proposed, not directly measured.
    supporting_text: Pull-down experiments suggested that AlgI interacts with AlgJ, while
      AlgF interacts with AlgJ and AlgI.
- id: PMID:37797696
  title: Pseudomonas aeruginosa AlgF is a protein-protein interaction mediator required for
    acetylation of the alginate exopolysaccharide.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The direct ITC pairs and negative acetylesterase tests use P. putida constructs.
      The negative polymannuronate-oligomer binding assay and NMR structural work use P. aeruginosa
      AlgF; native Pa AlgF–AlgX association is demonstrated by co-IP. Pairwise contacts do
      not prove a simultaneous ternary complex. Full article cached and inspected.
  findings:
  - statement: P. aeruginosa AlgF structure, negative polymer-binding assay and native interaction/stability
      experiments combine with P. putida ortholog ITC and negative acetylesterase assays to
      support a proposed interaction-mediator model. The complete relay/bridging arrangement
      remains hypothetical.
    supporting_text: demonstrate an association between AlgF and AlgX, as well as AlgJ and
      AlgI, in P. aeruginosa.
- id: PMID:40171682
  title: Acyltransferases that Modify Cell Surface Polymers Across the Membrane.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: DltB/DltX and PatA mechanistic studies are comparator systems, not direct
      biochemical proof of the native AlgI intermediate or AlgJ-to-AlgX transfer. Full article
