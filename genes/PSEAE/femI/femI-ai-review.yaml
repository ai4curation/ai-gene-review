  knowledge_gaps:
  - gap_statement: >-
      The FemI regulon has not been defined beyond the system's own genes. The paper reports
      that each of the five ECF sigmas it studied controls the production of one
      TonB-dependent transducer, and that two of them control a second, but which promoters
      FemI occupies genome-wide, and whether it regulates anything outside the fem locus, is
      unknown.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    What is the FemI consensus promoter, and does its regulon extend beyond the fem locus?
    The five systems in this paper were each found to control at least one transducer, and
    two controlled a second, so overlap between the regulons of these sigma factors is
    plausible and would matter for how the organism prioritises iron sources.
- question: >-
    Does FemI require FemR's degradation for release, or only a conformational change? The
    regulated-proteolysis route is the norm for ECF sigma systems, but it has not been shown
    for this one, and it determines whether the response is reversible.
suggested_experiments:
- description: >-
    ChIP-seq or ChIP-exo of tagged FemI in cells grown with and without carboxymycobactin to
    define the regulon and the promoter consensus, distinguishing direct targets from the
    downstream effects of restored iron uptake.
- description: >-
    Follow FemR levels and FemI-FemR association by immunoblot and pull-down during
    siderophore induction, to establish whether release depends on proteolysis of the
    anti-sigma factor.
