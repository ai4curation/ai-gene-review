- description: >-
    ECF sigma factor of the Fem cell-surface signalling system: once released from the
    anti-sigma factor FemR in response to FemA's detection of mycobactin, it directs RNA
    polymerase to the system's promoters and switches on the heterologous siderophore uptake
    machinery.
