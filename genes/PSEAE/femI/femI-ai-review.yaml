- term:
    id: GO:0015344
    label: siderophore uptake transmembrane transporter activity
  evidence_type: IMP
  original_reference_id: PMID:18086184
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row asserting siderophore uptake transporter activity on this gene. It
      describes FemA, the outer-membrane TonB-dependent transducer of the same system, not
      this sigma factor. This is the reciprocal half of the exchange found in the femA
      review, where the GO:0016987 sigma factor activity that belongs here sits on FemA.
    action: REMOVE
    reason: >-
      A 168-residue cytoplasmic protein cannot be a transmembrane siderophore transporter.
      The record carries sigma-70 regions 2 and 4, a winged-helix DNA-binding fold and a
      PANTHER subfamily named for FecI, the E. coli ferric-citrate ECF sigma - and no
      transmembrane segment, signal peptide, beta-barrel or plug domain. The paper assigns
      the loci explicitly, naming PA1912 among its five ECF sigmas and designating
      PA1912-PA1911-PA1910 as FemI-FemR-FemA, so the transporter is PA1910. The exchange is
      reciprocal and each half is confirmed by the other, which is a stronger signature than
      either gene shows alone: a single mis-keyed accession would not produce the same error
      twice in mirror image, together with the automatic inference built on each misplaced
      row.
    supported_by:
    - reference_id: PMID:18086184
      reference_section_type: ABSTRACT
      supporting_text: >-
        the PA1912-PA1911-PA1910 (designated FemI-FemR-FemA in this work) signalling system
    - reference_id: file:PSEAE/femI/femI-uniprot.txt
      record_section: ["DR:PANTHER"]
