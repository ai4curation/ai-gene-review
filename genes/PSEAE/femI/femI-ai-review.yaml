- term:
    id: GO:0015891
    label: siderophore transport
  evidence_type: IMP
  original_reference_id: PMID:18086184
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP process row from the same paper. Unlike the molecular-function row above this
      one is not part of the exchange: the same row is also on femA, where it is a
      participation claim the transducer earns. On femI it is not, so the row is corrected to
      the regulation term rather than kept.
    action: MODIFY
    reason: >-
      FemI performs no step of siderophore transport; what it does is release from FemR and
      direct RNA polymerase to the genes whose products transport. That is the participation
      test failing, not a peripheral role, so the earlier KEEP_AS_NON_CORE was the wrong
      action for the argument: non-core is for a claim that is as precise as warranted but
      away from the core function, and this one puts the protein inside a process it does no
      work in. The same correction is made on fpvA in this review set, where GO:0002049 goes
      to GO:1900706 on the same ground, and merged foxI settles the direction for a Fem-type
      ECF sigma: PseudoCAP's GO:0034756 row there is MODIFYed to the positive term.
      The replacement is a lateral participation-to-regulation correction, the long-sanctioned
      use of MODIFY whose replacement is not a descendant, and the direction is established:
      overexpressing the sigma turns the uptake genes on.
      GO has no regulation-of-siderophore-transport term. That was checked against GO itself
      rather than the corpus cache, which holds only terms the corpus already uses: an OLS
      search for one returns nothing, while "siderophore transport" returns 18 classes and
      "regulation of iron ion transport" 7, so the query can return a positive and the absence
      is real. The only siderophore regulation terms are for biosynthesis (GO:1900705,
      GO:1900706). GO:0034758 therefore regulates GO:0006826 iron ion transport, an ancestor
      of the annotated GO:0015891, so the replacement trades siderophore specificity for a
      correct relation to the gene product; GO:1904440 was rejected as the alternative, since
      "across plasma membrane" names the inner membrane in a Gram-negative and the uptake this
      sigma switches on is TonB-dependent at the outer membrane.
    proposed_replacement_terms:
    - id: GO:0034758
      label: positive regulation of iron ion transport
    supported_by:
    - reference_id: PMID:18086184
      reference_section_type: ABSTRACT
      supporting_text: is involved in the utilization of these heterologous siderophores
