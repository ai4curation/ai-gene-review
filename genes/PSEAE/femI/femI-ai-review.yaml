id: Q9I2J2
gene_symbol: femI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FemI (PA1912) is the extracytoplasmic function (ECF) sigma factor of the FemI-FemR-FemA
  cell-surface signalling system of Pseudomonas aeruginosa. It is a 168-residue cytoplasmic
  protein of the sigma-70 family carrying regions 2 and 4 and a winged-helix DNA-binding
  fold, and it directs RNA polymerase to the promoters of the system's own genes. In the
  resting state it is held inactive by the anti-sigma factor FemR at the cytoplasmic
  membrane; when the outer-membrane transducer FemA binds the Mycobacterium siderophores
  mycobactin or carboxymycobactin, the signal is transmitted inward and FemI is released to
  activate transcription. The system thereby couples the external availability of
  heterologous siderophores to expression of the uptake machinery that scavenges their iron.
