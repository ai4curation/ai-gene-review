- id: PMID:18086184
  title: Characterization of five novel Pseudomonas aeruginosa cell-surface signalling systems.
  findings:
  - statement: >-
      A cell-surface signalling system has three parts in three compartments: an
      outer-membrane transducer, a cytoplasmic-membrane anti-sigma factor, and an ECF sigma
      factor. This gene is the third of those.
    reference_section_type: ABSTRACT
    supporting_text: >-
      an outer membrane-localized TonB-dependent receptor (TonB-dependent transducer), a
      cytoplasmic membrane-localized antisigma factor and an extracytoplasmic function (ECF)
      sigma factor
  - statement: >-
      PA1912 is named among the five ECF sigma factors the paper overexpressed, which is the
      direct basis for sigma factor activity on this gene.
    reference_section_type: ABSTRACT
    supporting_text: >-
      the ECF sigmas PA0149, PA1912, PA2050, PA2093 and PA4896 have been overexpressed
  - statement: >-
      The paper assigns the three loci of this system by name, making PA1912 the sigma factor
      and PA1910 the transducer.
    reference_section_type: ABSTRACT
    supporting_text: >-
      the PA1912-PA1911-PA1910 (designated FemI-FemR-FemA in this work) signalling system
  - statement: >-
      The system responds to mycobacterial siderophores and confers their use as iron
      sources, which is the process the sigma factor's regulon serves.
    reference_section_type: ABSTRACT
    supporting_text: is involved in the utilization of these heterologous siderophores
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Llamas, Mooij, Sparrius, Vandenbroucke-Grauls, Ratledge & Bitter, Mol
      Microbiol 2008; DOI 10.1111/j.1365-2958.2007.06061.x). Abstract only, but it states the
      three-part architecture, names the five ECF sigmas including PA1912, and maps the three
      fem loci to names. Correctly cited for this gene, which is one of its five subjects, so
      this is not a wrong-reference case. What is wrong is which of the system's proteins two
      of its rows were entered against: the GO:0015344 transporter row on this gene describes
      FemA, and the GO:0016987 sigma row that belongs here sits on FemA instead. See the
      source defect on the GO:0015344 row, and the matching one in the femA review.
