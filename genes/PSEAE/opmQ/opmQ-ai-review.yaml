- id: PMID:12686626
  title: >-
    Identification and characterization of novel pyoverdine synthesis genes in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      Candidate PvdS-regulated genes were mutated and pyoverdine production measured; the
      paper named new pvd genes.
    supporting_text: >-
      The candidate genes were mutated and the effects of the mutations on pyoverdine production
      were determined.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the GO:0002049 IMP rows on PvdR and OpmQ. Abstract only; it does
      not name PA2389-PA2391. A pump mutant that makes less extracellular pyoverdine does
      not show that the pump takes part in synthesis; later work (PMID:19906986, 21035449)
      shows the system exports pyoverdine.
- id: PMID:19906986
  title: Molecular basis of pyoverdine siderophore recycling in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PvdRT-OpmQ, a tripartite ABC efflux system, moves PVD from the periplasm to the medium
      and recycles PVD after FpvA uptake.
    supporting_text: >-
      we identified a tripartite ATP-binding cassette efflux transporter, here named PvdRT-OpmQ,
      which translocates PVD from the periplasmic space to the extracellular milieu
  - statement: >-
      pvdR, pvdT and opmQ mutants each accumulate PVD in the periplasm, complemented by the
      operon in trans.
    supporting_text: >-
      Conversely, PA2389 , PA2390 , and opmQ mutants accumulated five- to sixfold higher amounts
      of PVD than wild-type PAO1, suggesting an involvement of these genes in PVD export.
  - statement: The system does not contribute to antibiotic resistance.
    supporting_text: >-
      the PvdRT-OpmQ efflux system does not provide any contribution to P. aeruginosa resistance
      to antibiotics belonging to the classes of tetracyclines, aminoglycosides, β-lactams
      and macrolides, and chloramphenicol
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC2787144) and read. PseudoCAP source for IDA and IMP rows. All evidence
      for PvdR/OpmQ is mutant phenotype (PVD in periplasmic fractions and supernatants of
      mutants, complementation); no direct assay of the purified proteins or of the assembled
      complex, so IMP fits and IDA does not. Its exclusion of a role in de novo PVD secretion
      was later revised by PMID:21035449.
- id: PMID:21035449
  title: >-
    An efflux pump is involved in secretion of newly synthesized siderophore by Pseudomonas
    aeruginosa.
  findings:
  - statement: Mutants lacking PvdRT-OpmQ accumulate newly synthesised PVD in the periplasm.
    supporting_text: >-
      Bacteria lacking this efflux pump accumulated PVD, or a fluorescent precursor, in the
      periplasm, due to their inability to efficiently secrete into the media newly synthesized
      PVD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Shows the pump also secretes newly made PVD. Evidence is microscopy and
      fractionation of mutants.
- id: PMID:22187978
  title: >-
    The PvdRT-OpmQ efflux pump controls the metal selectivity of the iron uptake pathway mediated
    by the siderophore pyoverdine in Pseudomonas aeruginosa.
  findings:
  - statement: PvdRT-OpmQ secretes new and recycled PVD from the periplasm.
    supporting_text: >-
      PvdRT-OpmQ is an ATP-dependent efflux pump involved in the secretion of newly synthesized
      pyoverdine (PVD) and of PVD that has transported and released its iron into the bacterium
      from the periplasm into the extracellular medium.
  - statement: The pump exports PVD complexed with non-iron metals.
    supporting_text: >-
      the PvdRT-OpmQ efflux pump exports unwanted metals complexed with PVD from the bacterium
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Uptake assays with FpvA and PvdRT-OpmQ mutants (ICP-AES, fluorescence).
- id: PMID:23766114
  title: An efflux pump is required for siderophore recycling by Pseudomonas aeruginosa.
  findings:
  - statement: pvdRT-opmQ mutation blocks recycling of PVD from the periplasm.
    supporting_text: >-
      Mutation of genes encoding this efflux pump (named PvdRT-OpmQ) prevented recycling of
      PVDI from the periplasm into the extracellular medium.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; mutant phenotypes.
