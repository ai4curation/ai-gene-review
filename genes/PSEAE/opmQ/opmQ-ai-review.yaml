id: Q9I189
gene_symbol: opmQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  OpmQ (PA2391) is the outer-membrane factor (OMF, TolC/NodT family lipoprotein) of the tripartite
  ATP-binding cassette efflux pump PvdRT-OpmQ, which also contains the inner-membrane ABC
  transporter PvdT and the periplasmic membrane fusion protein PvdR. OpmQ provides the outer-membrane
  exit channel through which the pump moves the siderophore pyoverdine from the periplasm
  to the extracellular medium. The pump secretes newly made pyoverdine, recycles pyoverdine
  after iron release from ferri-pyoverdine taken up by FpvA, and expels pyoverdine complexed
  with non-iron metals. opmQ mutants accumulate pyoverdine in the periplasm. Expression is
  iron-regulated and PvdS-dependent.
existing_annotations:
- term:
    id: GO:0002049
    label: pyoverdine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:12686626
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP from a screen that mutated candidate pvd genes and measured pyoverdine.
      The mutant phenotype (less extracellular pyoverdine) reflects loss of export and recycling,
      and the full text of PMID:19906986 attributes the lower yield to reduced synthesis secondary
      to the export defect. The pump does no step of the biosynthetic chemistry. Not an IBD
      seed.
    action: MODIFY
    reason: >-
      Indirect phenotype annotated as participation in biosynthesis. The protein takes part
      in pyoverdine transport, so the claim is re-pointed to GO:0015891 siderophore transport
      (PSEUDOCAP WRONG_TERM, PROBABLE).
    proposed_replacement_terms:
    - id: GO:0044718
      label: siderophore transmembrane transport
    supported_by:
    - reference_id: PMID:19906986
      supporting_text: >-
        our preliminary results suggest that the lower PVD levels in their culture supernatants
        are a result of reduced PVD synthesis rather than of impaired secretion of de novo
        synthesized PVD
    - reference_id: PMID:19906986
      supporting_text: >-
        Therefore, the entire PvdRT-OpmQ system (i.e., the IM ABC transporter PvdT, the periplasmic
        fusion protein PvdR, and the OM porin OpmQ) appears to be involved in the transport
        of PVD from the periplasm to the extracellular milieu.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0002049
      corrected_value: GO:0015891
      corrected_label: siderophore transport
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        opmQ is a component of the PvdRT-OpmQ efflux pump, which exports pyoverdine from the
        periplasm to the medium. The IMP row from PMID:12686626 (Lamont and Martin 2003) records
        lower pyoverdine yield in a mutant as involvement in pyoverdine biosynthesis. A transporter
        mutant makes less extracellular pyoverdine because export and recycling fail, which
        also lowers synthesis indirectly (Imperi et al. 2009, PMID:19906986). The pump does
        none of the chemistry of synthesis. Requested change: re-point to GO:0015891 siderophore
        transport (or delete). PROBABLE because the 2003 paper was read as an abstract only.
      supported_by:
      - reference_id: PMID:19906986
        supporting_text: >-
          our preliminary results suggest that the lower PVD levels in their culture supernatants
          are a result of reduced PVD synthesis rather than of impaired secretion of de novo
          synthesized PVD
      - reference_id: PMID:21035449
        supporting_text: >-
          Bacteria lacking this efflux pump accumulated PVD, or a fluorescent precursor, in
          the periplasm, due to their inability to efficiently secrete into the media newly
          synthesized PVD.
