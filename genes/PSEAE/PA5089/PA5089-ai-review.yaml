taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5089 is PldB (also called Tle5b), one of the two phospholipase D-family
  type VI secretion system effectors of P. aeruginosa PAO1. It is a 745-residue
  protein of the PLD/transphosphatidylase superfamily carrying an HxKxxxxD
  (HKD) catalytic motif, and it is encoded immediately downstream of vgrG5
  (PA5090) and upstream of a cluster of three cognate immunity proteins
  (tli5b1-3, PA5088-PA5086). PldB is exported by a type VI secretion system in
  a VgrG5-dependent manner and delivered into the periplasm of competing
  bacteria, where its phospholipase activity is toxic; the producing cell is
  protected by the Tli5b immunity proteins. PldB has also been reported to
  promote invasion of eukaryotic host cells, making it a trans-kingdom
  effector. Its action is therefore an attack on the membrane phospholipids of
  another cell rather than a step in the bacterium's own lipid metabolism.
references:
- id: PMID:24832454
  title: A Pseudomonas aeruginosa type VI secretion phospholipase D effector targets
    both prokaryotic and eukaryotic cells.
  findings:
  - statement: PldB is characterised as a type VI secretion phospholipase D effector
      with antibacterial activity directed at the prokaryotic periplasm, and it also
      promotes invasion of eukaryotic cells.
    supporting_text: Here we describe the characterization of a P. aeruginosa H3-T6SS-dependent
      phospholipase D effector, PldB, and its three tightly linked cognate immunity
      proteins. PldB targets the periplasm of prokaryotic cells and exerts an antibacterial
      activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The PseudoCAP source for the GO:0004630 IMP row on PA5089. PubMed-verified,
      and the gene is correctly matched - PA5089 is pldB, confirmed independently
      from the strain table of PMID:31417515. Only the abstract is cached, so the
      enzymological detail behind the phospholipase D assignment could not be
      inspected; the abstract itself describes the protein as a phospholipase D
      effector characterised in that work.
- id: PMID:31417515
  title: Delivery of the Pseudomonas aeruginosa Phospholipase Effectors PldA and PldB
    in a VgrG- and H2-T6SS-Dependent Manner.
  findings:
  - statement: PldB is encoded by PA5089, immediately downstream of vgrG5 (PA5090),
      and its locus tag is distinct from that of PldA (PA3487).
    supporting_text: vgrG5 (PA5090, blue) is encoded directly upstream of pldB (PA5089,
      cyan)
  - statement: PldB secretion requires VgrG5 and PldB-mediated killing of competitor
      cells is abolished in a vgrG5 mutant.
    supporting_text: Remarkably, PldB secretion was abrogated in absence of VgrG5
      (Figure 1B, middle panel, lane 5), while PldB-mediated killing was abolished
      when using attacker strains lacking vgrG5
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Used here for two things: the locus-tag identity of pldB
      (PA5089) versus pldA (PA3487), which resolves which gene the PseudoCAP seed
      papers belong to, and the T6SS delivery route.
- id: PMID:23552891
  title: Diverse type VI secretion phospholipases are functionally plastic antibacterial
    effectors.
  findings:
  - statement: The Tle5 family, to which PldA and PldB belong, is defined by dual
      HxKxxxxD motifs characteristic of phospholipase D enzymes.
    supporting_text: Four of the families (Tle1-4) exhibit the GxSxG motif common
      in esterases and many lipases, while the fifth (Tle5) possesses dual HxKxxxxD
      motifs found in PLD enzymes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Establishes the Tle5 (PLD) family definition. Its
      enzymology is on PldA (Tle5PA, His167/His855), not on PldB, so it supports
      the family assignment of PA5089 rather than its measured activity.
