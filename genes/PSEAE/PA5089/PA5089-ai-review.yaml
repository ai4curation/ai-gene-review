- term:
    id: GO:0009395
    label: phospholipid catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN004499769
  - AGI_LocusCode:AT1G55180
  - AGI_LocusCode:AT3G05630
  - RGD:3349
  - RGD:3350
  review:
    summary: >-
      A second IBD on the same node, seeded only by plant and rat PLDs
      (AT1G55180, AT3G05630, Pld1, Pld2) that hydrolyse phospholipids of their
      own membranes in lipid turnover and signalling. PldB is a secreted T6SS
      toxin, hydrolysing phospholipids in the periplasm of a target cell, and
      nothing indicates that it contributes to phospholipid catabolism in
      P. aeruginosa itself.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The chemistry is phospholipid hydrolysis, so the term is not simply false,
      but the process claim transfers the endogenous lipid-turnover role of the
      eukaryotic seeds onto an interbacterial toxin. The informative process for
      this gene is delivery of a toxin into a competitor, not degradation of the
      organism's own phospholipids.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN004499769
        source_label: PTN004499769
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The GO:0009395 IBD has four seeds, all eukaryotic PLDs acting on their
          own membrane lipids. The node is wide enough to include secreted
          bacterial toxins, for which the process reading does not hold.
    supported_by:
    - reference_id: PMID:24832454
      supporting_text: PldB targets the periplasm of prokaryotic cells and exerts
        an antibacterial activity.
