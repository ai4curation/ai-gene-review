core_functions:
- description: >-
    Phospholipase D-family type VI secretion effector. PldB is delivered by a
    VgrG5-dependent T6SS into the periplasm of a competing bacterium, where
    hydrolysis of membrane phospholipids at its HKD active site is toxic; the
    producing cell is protected by the tli5b immunity proteins.
  molecular_function:
    id: GO:0004630
    label: D-type glycerophospholipase activity
  supported_by:
  - reference_id: PMID:24832454
    supporting_text: PldB targets the periplasm of prokaryotic cells and exerts an
      antibacterial activity.
  - reference_id: PMID:31417515
    supporting_text: Remarkably, PldB secretion was abrogated in absence of VgrG5
      (Figure 1B, middle panel, lane 5), while PldB-mediated killing was abolished
      when using attacker strains lacking vgrG5
suggested_questions:
- question: >-
    Has purified PldB been shown to hydrolyse phospholipids in vitro, and with
    what head-group specificity, as was done for PldA (phosphatidylcholine and
    phosphatidylethanolamine)?
- question: >-
    PldB carries a single PROSITE-detected HKD motif whereas PldA carries two.
    Does PldB act as a homodimer that assembles a composite active site?
- question: >-
    Should GO offer a process term for delivery of an antibacterial effector
    into a target cell, so that T6SS toxins are not annotated to the endogenous
    metabolic process matching their chemistry (here phospholipid catabolism)?
suggested_experiments:
- description: >-
    Assay purified PldB against defined phospholipid substrates
    (phosphatidylethanolamine, phosphatidylcholine, cardiolipin), with and
    without mutation of the predicted active-site residues at positions
    642, 644 and 649, and quantify the products by mass spectrometry as was
    done for PldA.
