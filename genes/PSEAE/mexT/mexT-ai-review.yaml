id: Q9I0Z0
gene_symbol: mexT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  MexT (PA2492, NfxC) is a LysR-type transcriptional activator of Pseudomonas
  aeruginosa. It binds nod-box-like sites in the mexEF-oprN promoter and
  activates the MexEF-OprN multidrug efflux pump, and directly activates a small
  regulon that includes mexS (qrh), whose product in turn modulates MexT.
  Full-length MexT is a homotetramer with an N-terminal winged-helix DNA-binding
  domain and a C-terminal regulatory domain with a putative ligand pocket. Through
  MexEF-OprN, which exports quinolone antibiotics and quorum-sensing quinolones,
  MexT affects antibiotic resistance, the quorum-sensing hierarchy and the
  production of virulence factors; with MexS it also represses the type III
  secretion system. mexT is frequently mutated in laboratory sublines and in
  clinical isolates.
references:
- id: PMID:10515918
  title: Characterization of MexT, the regulator of the MexE-MexF-OprN multidrug efflux
    system of Pseudomonas aeruginosa.
  findings:
  - statement: MexT is a LysR-type activator encoded upstream of mexEF-oprN and also
      activates qrh.
    supporting_text: Expression of a qrh::lacZ fusion was also found to be activated
      by MexT.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. PseudoCAP source of the IMP GO:0045893 seed row of
      PTN001248361. Reporter fusions show MexT-dependent activation.
- id: PMID:9044268
  title: Characterization of MexE-MexF-OprN, a positively regulated multidrug efflux
    system of Pseudomonas aeruginosa.
  findings:
  - statement: mexEF-oprN is positively regulated by an upstream LysR-family protein
      (MexT).
    supporting_text: Expression of the mexEF-oprN operon was shown to be positively
      regulated by a protein encoded on a 1.5 kb DNA fragment located upstream of mexE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; the regulator is not yet named MexT in the abstract.
- id: PMID:20727012
  title: Transcriptional regulation of the mexEF-oprN multidrug efflux pump operon by
    MexT and an unidentified repressor in nfxC-type mutant of Pseudomonas aeruginosa.
  findings:
  - statement: Purified MexT binds the mexT-proximal nod box.
    supporting_text: The mexT-proximal nod box was identified as the MexT-binding site
      by gel-shift assays using purified MexT.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; EMSA with purified MexT.
- id: PMID:19846594
  title: Transcriptome profiling defines a novel regulon modulated by the LysR-type
    transcriptional regulator MexT in Pseudomonas aeruginosa.
  findings:
  - statement: MexT directly regulates a conserved-motif regulon independent of MexEF-OprN.
    supporting_text: Thus, a novel regulon directly modulated by MexT, that includes
      but is independent of mexEF-oprN, has been identified.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; motif mutagenesis and EMSA.
- id: PMID:31722511
  title: Crystal Structure of the Regulatory Domain of MexT, a Transcriptional Activator
    of the MexEFOprN Efflux Pump in Pseudomonas aeruginosa.
  findings:
  - statement: DNase I footprinting identifies two MexT sites in the mexEF-oprN promoter.
    supporting_text: A DNase I footprinting assay of full-length MexT identified two
      MexT-binding sequence in the mexEF oprN promoter.
  - statement: Full-length MexT is a homotetramer.
    supporting_text: FL MexT and MexT RD were homotetrameric and homodimeric in solution,
      respectively, as determined using SEC-MALS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read for oligomer state.
- id: PMID:21075931
  title: MexT regulates the type III secretion system through MexS and PtrC in Pseudomonas
    aeruginosa.
  findings:
  - statement: A PAO1 mexT mutant secretes more ExoS.
    supporting_text: However, a mexT mutant of PAO1 (PAO1 mexT ::Gm) resulted in much
      higher ExoS secretion than that of its parental strain PAO1
  - statement: mexT and mexS mutants make more elastase and pyocyanin.
    supporting_text: the mexS and mexT mutants of PAO1 shared the same phenotype of
      increased elastase and pyocyanin production compared to that in wild-type PAO1
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read. PseudoCAP source of the proteolysis, protein secretion and
      secondary metabolite rows. All three rest on mutant phenotypes of a
      transcriptional regulator acting through MexS and other unidentified
      mediators.
- id: PMID:39708318
  title: Mutations in mexT bypass the stringent response dependency of virulence in
    Pseudomonas aeruginosa.
  findings:
  - statement: Loss of MexT raises aminoglycoside resistance.
    supporting_text: leads to elevated aminoglycoside resistance
  - statement: MexT is an activator of mexEF-oprN.
    supporting_text: However, MexT is an activator of mexEF-oprN expression
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available; genetics and transcriptomics.
- id: PMID:41128522
  title: Modulation of the Pseudomonas aeruginosa quorum sensing cascade by MexT-regulated
    factors.
  findings:
  - statement: MexT represses PQS signalling and pqsE through MexEF-OprN.
    supporting_text: we hypothesized that constitutive MexT activity induces mexEF-oprN
      expression, leading to the repression of PQS QS, delayed pqsE expression, and
      delayed RhlR activation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available. The repression of pqs genes is attributed to
      MexEF-OprN activity, not to MexT binding the pqs promoter.
