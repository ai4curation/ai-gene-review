taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: Alr (PA4930) is the biosynthetic alanine racemase of Pseudomonas aeruginosa,
  a 358-residue PLP-dependent enzyme of the alanine racemase family. It interconverts L- and
  D-alanine (EC 5.1.1.1) with similar Km (about 1.1 mM) and Vmax in both directions, using
  PLP bound as an internal aldimine to Lys34, and supplies the D-alanine needed for the D-Ala-D-Ala
  terminus of peptidoglycan precursors. It functions as a homodimer in dynamic equilibrium
  with the monomer. P. aeruginosa also has a second, catabolic alanine racemase, DadX (PA5302),
  which serves D-alanine catabolism; Alr complements E. coli D-alanine auxotrophs.
