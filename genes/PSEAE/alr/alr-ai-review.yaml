      are monomer-dimer equilibria; high Vmax correlates with dimerisation.
    supporting_text: In both biosynthetic and catabolic alanine racemases, association constants
      for dimerization were high for the enzymes with high V(max) values.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PseudoCAP source for the GO:0008784 IDA, a seed of PTN000775508. Abstract
      only; it names P. aeruginosa among the enzymes analysed and reports Vmax values, so
      activity was measured. It does not say which P. aeruginosa enzymes were included; given
      that it covers biosynthetic and catabolic forms, Alr and DadX are both likely.
