suggested_questions:
- question: >-
    Does DadX contribute measurably to peptidoglycan D-alanine in P. aeruginosa
    when alr is deleted, or is it confined to alanine catabolism?
suggested_experiments:
- description: >-
    Construct alr, dadX and alr dadX deletions in PAO1 and test D-alanine
    auxotrophy and growth on L-alanine as sole carbon source.
