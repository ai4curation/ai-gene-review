gene_symbol: dadX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  DadX (PA5302) is the catabolic alanine racemase of Pseudomonas aeruginosa, a
  pyridoxal 5'-phosphate-dependent homodimeric enzyme that interconverts L- and
  D-alanine (Km about 1.4 mM for each enantiomer). It works with the D-amino acid
  dehydrogenase DadA in L-alanine utilisation, converting L-alanine to D-alanine
  that DadA then oxidises to pyruvate. It is one of two alanine racemases in PAO1;
  the second, Alr, is the constitutive biosynthetic enzyme, although DadX can also
  supply D-alanine when expressed in an E. coli D-alanine auxotroph.
references:
- id: PMID:10977898
  title: Characterization of the alanine racemases from Pseudomonas aeruginosa PAO1.
  findings:
  - statement: DadX and Alr were purified and characterised biochemically, and both
      complement E. coli D-alanine auxotrophs.
    supporting_text: The dadX(PA) and alr(PA) genes have been sequenced, overexpressed,
      and their activity was demonstrated by complementing d-alanine auxotrophs of
      Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. PseudoCAP source of the IDA GO:0008784 seed row of
      PTN000775508. The abstract states that both racemases were purified and
      characterised biochemically, and UniProt records DadX kinetics from this
      paper, so the IDA is well founded.
