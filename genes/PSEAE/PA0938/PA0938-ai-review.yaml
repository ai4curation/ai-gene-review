taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0938 (Wzz2) is the second O-antigen chain-length regulator of Pseudomonas aeruginosa PAO1, encoded
  outside the B-band O-antigen cluster. It is a 442-residue inner-membrane polysaccharide co-polymerase of
  the PCP-1 class, with two transmembrane helices flanking a large periplasmic domain and no cytoplasmic
  kinase domain; it groups with E. coli FepE, which makes very long O-antigen. Together with Wzz1 (PA3160)
  and the Wzy polymerase, Wzz2 sets the modal chain length of B-band O-specific antigen before it is
  ligated to lipid A-core: deletion of wzz2 leaves the Wzz1-specified modality, and deletion of both
  genes gives non-modal chains. Wzz2 forms octamers in vivo and co-precipitates with O-antigen polymer.
