- id: PMID:12534470
  title: Pseudomonas aeruginosa O-antigen chain length is determined before ligation
    to lipid A core.
  findings:
  - statement: >-
      wzz2 deletion leaves Wzz1-specified modality; deletion of both wzz genes gives random chain length.
    supporting_text: >-
      As expected, the wzz2delta strain produced LPS with modal length imparted by Wzz1, and the
      wzz2delta/wzz1::Gm strain produced LPS O-antigen with a non-modal (random) length.
  - statement: Wzz2 forms octamers in vivo.
    supporting_text: >-
      In vivo protein cross-linking followed by Western immunoblotting indicated that Wzz1 forms dimers
      whereas Wzz2 forms octamers.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Daniels et al. 2002, Environ Microbiol). Abstract read; no full text. Identifies
      PA0938 as Wzz2 with knockouts, cross-linking and immunoprecipitation; the abstract states no
      localisation assay. Source of two PseudoCAP rows (GO:0005886 and GO:0098567 IDA) that seed
      PTN000794252.
- id: PMID:23955007
  title: The D3 bacteriophage α-polymerase inhibitor (Iap) peptide disrupts O-antigen
    biosynthesis through mimicry of the chain length regulator Wzz in Pseudomonas
    aeruginosa.
  findings:
  - statement: Iap resembles the first TM segment of Wzz1 and Wzz2.
    supporting_text: >-
      Sequence alignment analyses revealed a high degree of similarity between Iap and the first
      transmembrane segment (TMS) of either Wzz1 or Wzz2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Taylor et al. 2013, J Bacteriol; PMC3807437). Abstract read; no full-text XML
      obtainable. Genetics of Iap action in wzz single and double mutants, sequence alignment with the Wzz
      TM1 and topology predictions of Iap. Source of PseudoCAP IDA GO:0005886 (a seed of PTN000794252) and
      GO:0016020 rows; the abstract describes no direct localisation assay of Wzz2.
- id: PMID:24309320
  title: Conserved-residue mutations in Wzy affect O-antigen polymerization and Wzz-mediated
    chain-length regulation in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: Wzy mutations alter Wzz-mediated modality, implying Wzz-Wzy interaction.
    supporting_text: >-
      regulation of polymer length is affected by interaction of Wzz with Wzy
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text in cache read. A Wzy mutagenesis study in which Wzz1 and Wzz2 are modality readouts. It
      reports no cell-wall localisation of Wzz2 and no outer-membrane assembly assay, so it does not
      support the PseudoCAP GO:0009276 and GO:0043165 rows made from it.
