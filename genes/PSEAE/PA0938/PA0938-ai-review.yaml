core_functions:
- description: >-
    Inner-membrane polysaccharide co-polymerase (PCP-1, FepE-like) that, with Wzy and Wzz1, sets the modal
    chain length of B-band O-specific antigen during Wzx/Wzy-dependent O-antigen synthesis.
  directly_involved_in:
  - id: GO:0009243
    label: O antigen biosynthetic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:12534470
    supporting_text: >-
      As expected, the wzz2delta strain produced LPS with modal length imparted by Wzz1, and the
      wzz2delta/wzz1::Gm strain produced LPS O-antigen with a non-modal (random) length.
suggested_questions:
- question: >-
    What modal length does Wzz2 specify on its own (very long, like FepE?), and does it interact with Wzy
    through a different surface from Wzz1, given that Wzy CL6 mutations spare Wzz2 modality?
suggested_experiments:
- description: >-
    Chain-length analysis of a wzz1 mutant expressing Wzz2 alone, and crosslinking or co-purification of
    Wzz2 with Wzy carrying CL6 substitutions.
