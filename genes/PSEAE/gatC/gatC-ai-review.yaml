id: Q9HVT9
gene_symbol: gatC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: GatC is the small structural subunit of the GatCAB tRNA-dependent amidotransferase in Pseudomonas
  aeruginosa PAO1, supporting assembly and stability. Its native aminoacyl-tRNA production role is conversion
  of Asp-tRNA(Asn) to Asn-tRNA(Asn). The purified complex can also use supplied heterologous Glu-tRNA(Gln),
  a biochemical capacity distinct from native substrate supply.
