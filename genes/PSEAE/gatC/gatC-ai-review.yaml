    label: regulation of translational fidelity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003837
  - InterPro:IPR036113
  review:
    summary: GatC-mediated complex stability supports fidelity of tRNA-dependent amino-acid conversion.
    action: ACCEPT
    reason: The term concerns modulation of genetic-code interpretation and is not restricted to ribosomal
      decoding factors. Native-target assembly evidence and the conserved GatC scaffold support the existing
      family inference. Mycobacterial experiments independently show that GatCAB/transamidosome stability
      can tune specific mistranslation without simply abolishing catalytic activity. This is a conserved
      mechanistic inference for the target, not a measured Bacillus or PAO1 error-rate phenotype. PMID:33072044
      further identifies a gatC stop-codon mutation producing a GatC–GatA fusion with increased specific
      mistranslation in M. smegmatis; extrapolation to this target is based on conserved scaffold function,
      not an asserted native stress phenotype.
    supported_by:
    - *id001
    - reference_id: PMID:34225495
      supporting_text: 'alteration of GatCAB stability may be a mechanism for modulation of

        translational fidelity.'
    - reference_id: PMID:33072044
      supporting_text: A forward genetic screen identifies a GatC-GatA fusion that mediates high rates
        of mistranslation.
