  review:
    summary: GatC participates in modification of the amino acid already esterified to tRNA.
    action: MODIFY
    reason: The transamidase changes the amino-acid side chain on already-charged tRNA; it does not itself
      perform the initial aminoacyl-ester formation. Use charged-tRNA amino acid modification for this
      direct role. This is a role-specific refinement of the broader translation context, preserving actual
      enzymatic or structural participation.
    supported_by: &id002
    - &id003
      reference_id: PMID:14729703
      supporting_text: This strategy led to a pure and active AdT, with stoichiometric amounts of the
        three subunits
    - &id001
      reference_id: file:PSEAE/gatC/gatC-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Structural subunit of the Asp/Glu-tRNA(Asn/Gln) amidotransferase complex GatCAB.
        GatCAB allows the formation of correctly charged Asn-tRNA(Asn) or Gln-tRNA(Gln) through the multi-step
        transamidation of misacylated Asp-tRNA(Asn) or Glu-tRNA(Gln) in organisms which lack either or
        both of asparaginyl-tRNA or glutaminyl- tRNA synthetases. The reaction takes place in the presence
        of glutamine and ATP through an activated phospho-Asp-tRNA(Asn) or phospho-Glu- tRNA(Gln). This
        subunit forms a belt that wraps around the interface of the catalytic subunits A and B to stabilize
        the complex. {ECO:0000255|HAMAP-Rule:MF_00122}.
    proposed_replacement_terms:
    - id: GO:0019988
      label: charged-tRNA amino acid modification
