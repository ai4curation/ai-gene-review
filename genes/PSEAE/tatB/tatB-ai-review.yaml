id: Q9HUB4
gene_symbol: tatB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  TatB (PA5069) is a single-pass inner-membrane subunit of the twin-arginine translocation
  (Tat) system of Pseudomonas aeruginosa. Together with the polytopic subunit TatC it forms
  the TatBC receptor that recognises the twin-arginine motif of Tat signal peptides, and it
  is thought to provide an oligomeric binding site that transiently holds folded precursor
  proteins before translocation. Substrate binding at TatBC then recruits the separate TatA
  complex to assemble the active translocon, which moves fully folded proteins across the
  cytoplasmic membrane using the proton motive force. In P. aeruginosa the Tat pathway exports
  many periplasmic and secreted proteins, including the pyoverdine-biogenesis protein PvdN,
  so tat mutants fail to make pyoverdine.
