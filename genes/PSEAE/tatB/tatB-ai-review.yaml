suggested_questions:
- question: >-
    P. aeruginosa encodes two TatA paralogues. Does TatB discriminate between them when the
    substrate-loaded TatBC receptor recruits the TatA complex, or do both assemble
    interchangeably?
- question: >-
    Is the oligomeric precursor-binding site attributed to TatB on the basis of the E. coli
    system also formed by the P. aeruginosa protein, and does it set the size limit on Tat
    substrates in this organism?
suggested_experiments:
- description: >-
    Blue-native PAGE and crosslinking of tagged PAO1 TatB to measure the stoichiometry of
    the TatBC receptor and to test whether TatA recruitment depends on substrate binding, as
    in E. coli.
- description: >-
    Site-directed mutagenesis of the TatB transmembrane helix and the adjacent amphipathic
    region, assayed by PvdN export and pyoverdine production, to separate the receptor
    function from membrane anchoring.
