core_functions:
- description: >-
    Signal-peptide-receptor subunit of the TatABC translocon: with TatC it recognises the
    twin-arginine motif and provides the transient binding site for folded precursors, so
    that the assembled translocon can move them across the inner membrane using the proton
    motive force.
