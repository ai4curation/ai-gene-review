- id: PMID:16621825
  title: >-
    Pyoverdine-mediated iron uptake in Pseudomonas aeruginosa: the Tat system is required
    for PvdN but not for FpvA transport.
  findings:
  - statement: >-
      Pyoverdine production is abolished in a tat mutant, which the authors attribute to
      failure to export a periplasmic component of the pyoverdine biogenesis pathway.
    reference_section_type: ABSTRACT
    supporting_text: However, in the tat mutant, no Pvd was produced.
  - statement: >-
      The same paper shows the Tat requirement is substrate-selective rather than general:
      FpvA reaches the outer membrane and functions normally without Tat.
    reference_section_type: ABSTRACT
    supporting_text: >-
      FpvA is correctly located in the outer membrane of a tat mutant and is fully functional
      for all steps of the iron uptake process
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Voulhoux, Filloux & Schalk 2006). Abstract only; the cached entry
      records full_text_available as false and the abstract names no individual tat gene,
      referring throughout to "a tat mutant". This is the PseudoCAP source of the GO:0008320
      and GO:0033281 IMP rows on tatB, and PseudoCAP used the same paper for tatA and tatC.
      The evidence is a pathway-level export phenotype, not a measurement on TatB, so it
      cannot by itself distinguish which subunit does what; TatB's receptor role and complex
      membership rest instead on the TatB family assignment (HAMAP MF_00237) and on the
      E. coli TatB experimental record behind the IBA node. The phenotype is consistent with
      both.
