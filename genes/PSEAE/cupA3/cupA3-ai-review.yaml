id: Q9I1Y5
gene_symbol: cupA3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  CupA3 (PA2130) is the outer-membrane usher of the CupA chaperone-usher fimbrial system of
  Pseudomonas aeruginosa, encoded in the cupA1-A5 cluster with the major pilin CupA1, the
  periplasmic chaperones CupA2 and CupA5 and the adhesin-like CupA4. Like E. coli FocD and
  FimD, it forms a beta-barrel pore in the outer membrane through which chaperone-bound pilin
  subunits are assembled into a fimbria on the cell surface. CupA fimbriae mediate attachment
  to abiotic surfaces and early biofilm formation; a cupA3 mutant attaches at about 10% of
  the parental level. cupA expression is repressed by MvaT and induced under stress conditions.
references:
- id: PMID:11381121
  title: >-
    The chaperone/usher pathways of Pseudomonas aeruginosa: identification of fimbrial gene
    clusters (cup) and their involvement in biofilm formation.
  findings:
  - statement: CupA3 is the usher of the CupA system, by similarity to E. coli FocD.
    supporting_text: >-
      CupA3 appears to be the usher component of the system, based on its high similarity
      to FocD
  - statement: >-
      A cupA3 insertion mutant shows about 10% of parental attachment to an abiotic surface.
    supporting_text: >-
      This strain, carrying a disrupted cupA3 gene, showed an adhesion-deficient phenotype,
      with only 10% of the bacteria adhering relative to the parental PAK-NP
  - statement: >-
      The usher forms an outer-membrane channel through which pilin subunits are assembled.
    supporting_text: >-
      called usher, that forms a channel into the outer membrane through which the pilin subunits
      are sequentially assembled
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. PseudoCAP source for an IMP GO:0007155 seed row of PTN001252526. The
      data are a genuine attachment defect of the cupA3 mutant, but the usher's own role is
      fimbrial assembly; adhesion is performed by the assembled fimbria.
- id: PMID:15090530
  title: >-
    Biofilm formation in Pseudomonas aeruginosa: fimbrial cup gene clusters are controlled
    by the transcriptional regulator MvaT.
  findings:
  - statement: >-
      The cupA cluster is required for biofilm formation on abiotic surfaces; MvaT represses
      cupA.
    supporting_text: >-
      The cupA gene cluster, but not the cupB or cupC cluster, is required for biofilm formation
      on abiotic surfaces.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PseudoCAP source for the second IMP GO:0007155 seed row. Abstract only (PMC387821 returned
      no full text on 2026-11-05). The abstract restates the earlier cupA finding and is about
      MvaT regulation; whether a cupA3 mutant is assayed in the full text is unknown.
- id: PMID:17581126
  title: >-
    Responses of Pseudomonas aeruginosa to low oxygen indicate that growth in the cystic fibrosis
    lung is by aerobic respiration.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Transcriptome study of low-oxygen growth; abstract only (PMC4157922 returned no full
      text). The abstract does not mention cup genes.
- id: PMID:19638175
  title: >-
    SiaA and SiaD are essential for inducing autoaggregation as a specific response to detergent
    stress in Pseudomonas aeruginosa.
  findings:
  - statement: The cupA operon is essential for SDS-induced aggregation.
    supporting_text: >-
      Transposon and site-directed mutagenesis revealed that the cupA-operon and the co-transcribed
      genes siaA (PA0172) and siaD (PA0169) were essential for SDS-induced aggregation.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Abstract only. Does not say which cupA gene was mutated.
