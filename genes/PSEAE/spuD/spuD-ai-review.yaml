id: Q9I6J1
gene_symbol: spuD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SpuD (PA0300) is a periplasmic polyamine-binding protein of the PotD/PotF
  family in Pseudomonas aeruginosa, the substrate-binding component, with its
  paralog SpuE, of the SpuDEFGH ABC transporter for polyamine uptake. SpuD binds
  putrescine with nanomolar affinity and spermidine much more weakly, closing
  around the ligand in an open-to-closed conformational change like E. coli PotF.
  Mutation of spuD greatly reduces spermidine uptake.
references:
- id: PMID:12081945
  title: Functional analysis and regulation of the divergent spuABCDEFGH-spuI operons
    for polyamine uptake and utilization in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: Spermidine uptake is greatly reduced in spuD and spuE mutants.
    supporting_text: Second, spermidine uptake is inducible in spermidine-grown cells
      and is greatly reduced in either spuD or spuE mutant (Fig.
  - statement: The authors concluded that SpuD and SpuE prefer spermidine as transport
      ligand.
    supporting_text: Contrary to such sequence similarities, SpuD and SpuE prefer spermidine
      rather than putrescine as the transport ligand as determined empirically in this
      report.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP polyamine transport row (seed of
      PTN001249912). Full text read. Supports SpuD's role in polyamine
      (spermidine) uptake; its ligand-preference conclusion is contradicted by
      the direct binding data of PMID:22300763.
- id: PMID:22300763
  title: Structural basis of substrate binding specificity revealed by the crystal structures
    of polyamine receptors SpuD and SpuE from Pseudomonas aeruginosa.
  findings:
  - statement: SpuD is a putrescine-preferential binding protein; SpuE binds only spermidine.
    supporting_text: we found that SpuD is a putrescine-preferential binding protein,
      while SpuE binds to spermidine exclusively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IDA putrescine binding row (seed of
      PTN008624361). Abstract only; UniProt's curated function text gives the
      ITC constants from this paper.
