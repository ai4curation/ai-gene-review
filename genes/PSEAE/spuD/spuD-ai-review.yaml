suggested_questions:
- question: >-
    Does E. coli PotF bind spermidine at all? It receives a spermidine binding
    IBA from PTN008624361, but its curated function records only putrescine
    binding.
- question: >-
    Why are both SpuD and SpuE needed for optimal spermidine uptake, when SpuD
    binds spermidine only weakly?
suggested_experiments:
- description: >-
    Measure radiolabelled putrescine and spermidine uptake in spuD, spuE and
    spuD spuE mutants side by side to reconcile the uptake and binding data.
