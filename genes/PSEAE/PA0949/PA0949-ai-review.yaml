core_functions:
- description: >-
    FMN-dependent soluble NAD(P)H:quinone oxidoreductase (WrbA family, type IV
    NQO) that reduces quinones to quinols by concerted two-electron transfer,
    avoiding semiquinone formation.
  molecular_function:
    id: GO:0003955
    label: NAD(P)H dehydrogenase (quinone) activity
  supported_by:
  - reference_id: PMID:25085734
    supporting_text: In in vitro assays, each enzyme was shown to reduce quinone substrates
      with only minimal semiquinone formation.
  - reference_id: PMID:16322580
    supporting_text: each WrbA protein forms a homotetramer with 222 symmetry, unique
      among flavodoxin-like proteins, in which each protomer binds one flavin mononucleotide
      cofactor molecule.
suggested_questions:
- question: >-
    The PTN000777387 membrane IBA (GO:0016020) rests only on fungal
    Pst/Ycp4/Rfs1 seeds and propagates to bacterial WrbA proteins such as PA0949
    and E. coli WrbA. Should the IBD be moved to a fungal subclade node?
- question: >-
    Does loss of PA0949 (alone or with mdaB) sensitise P. aeruginosa to quinone
    or H2O2 stress, and what is the physiological quinone substrate?
suggested_experiments:
- description: >-
    Test a PA0949 deletion (in wild-type and katA backgrounds) for sensitivity
    to menadione and H2O2, and fractionate cells to confirm the soluble
    cytoplasmic location.
