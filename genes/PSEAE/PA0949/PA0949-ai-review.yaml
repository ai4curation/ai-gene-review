id: Q9I509
gene_symbol: PA0949
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0949 is the Pseudomonas aeruginosa ortholog of WrbA, a soluble flavodoxin-like
  FMN-containing NAD(P)H:quinone oxidoreductase (type IV NQO, EC 1.6.5.2). Crystal
  structures show a long-chain flavodoxin fold with the WrbA-specific insertion,
  one non-covalently bound FMN per protomer, and a homotetrameric assembly with
  222 symmetry. The purified P. aeruginosa enzyme reduces quinones by a concerted
  two-electron transfer with minimal semiquinone formation, which avoids reactive
  semiquinone radicals. Over-expression of PA0949 improves growth under H2O2
  challenge in a catalase (katA) mutant and in P. putida, but not in wild-type P.
  aeruginosa, so a physiological antioxidant role is plausible but not established.
references:
- id: PMID:25085734
  title: Pseudomonas aeruginosa MdaB and WrbA are water-soluble two-electron quinone
    oxidoreductases with the potential to defend against oxidative stress.
  findings:
  - statement: Purified P. aeruginosa WrbA (and four other quinone reductases) reduce
      quinone substrates in vitro with minimal semiquinone formation.
    supporting_text: In in vitro assays, each enzyme was shown to reduce quinone substrates
      with only minimal semiquinone formation.
  - statement: Over-expression gives no H2O2-protective phenotype in wild-type P. aeruginosa;
      protection is seen only in a katA mutant.
    supporting_text: in a katA mutant, H2O2 challenged strains over-expressing the WrbA
      and MdaB orthologs grew significantly better than the empty plasmid control.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP rows (GO:0003955, GO:0034599). Abstract only;
      no PMC full text. The abstract states in vitro quinone reduction by the
      purified P. aeruginosa enzyme, which directly supports GO:0003955 (the
      evidence would more naturally be IDA than IMP). The oxidative-stress claim
      rests on over-expression in a catalase-null background only.
- id: PMID:16672604
  title: WrbA from Escherichia coli and Archaeoglobus fulgidus is an NAD(P)H:quinone
    oxidoreductase.
  findings:
  - statement: E. coli and A. fulgidus WrbA are FMN-containing NAD(P)H:quinone oxidoreductases;
      the paper defines WrbA as type IV NQO.
    supporting_text: Biochemical characterization of the prototypic WrbA protein from
      E. coli and WrbA from Archaeoglobus fulgidus, a hyperthermophilic species from
      the Archaea domain, shows that these enzymes have NQO activity
  - statement: The only mention of P. aeruginosa is its published crystal structure;
      no P. aeruginosa protein was assayed.
    supporting_text: The presence of this fold has recently been confirmed in the published
      crystal structures of the Deinococcus radiodurans and Pseudomonas aeruginosa WrbA
      homologues
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      Full text read (PMC1482846). Strong family-level evidence for WrbA as NQO,
      but the P. aeruginosa protein is mentioned only as a solved structure; the
      PseudoCAP IDA of GO:0016655 to PA0949 citing this paper is therefore not
      supported by an assay on PA0949 (see source defect on that row).
- id: PMID:16322580
  title: Crystal structures of the tryptophan repressor binding protein WrbA and complexes
    with flavin mononucleotide.
  findings:
  - statement: Crystal structures of P. aeruginosa WrbA show one FMN per protomer in
      a homotetramer.
    supporting_text: each WrbA protein forms a homotetramer with 222 symmetry, unique
      among flavodoxin-like proteins, in which each protomer binds one flavin mononucleotide
      cofactor molecule.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC2253248). Direct structural evidence for FMN binding.
