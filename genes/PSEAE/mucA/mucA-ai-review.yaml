  review:
    summary: >-
      IPI with MucB (P38108), which binds the periplasmic domain of MucA in the
      sigma-sequestration complex.
    action: REMOVE
    reason: >-
      Bare protein binding is uninformative. MucA is the anti-sigma factor; MucB binding
      protects MucA from cleavage, and no more specific MF term describes MucA's side of
      that interaction. Removal does not mean the interaction is false.
    supported_by:
    - reference_id: PMID:19226327
      supporting_text: Here we showed that MucB, encoded by the algT-mucABCD operon, interacts with MucA in the sigma-sequestration complex.
