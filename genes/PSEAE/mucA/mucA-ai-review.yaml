- id: PMID:8759866
  title: Control of AlgU, a member of the sigma E-like family of stress sigma factors,
    by the negative regulators MucA and MucB and Pseudomonas aeruginosa conversion to
    mucoidy in cystic fibrosis.
  findings:
  - statement: MucA binds AlgU and inhibits its activity, acting as an anti-sigma factor.
    supporting_text: MucA was shown to act as an anti-sigma factor by binding to AlgU and inhibiting its activity.
  - statement: Mutations in mucA cause conversion to mucoidy in cystic fibrosis isolates.
    supporting_text: Mutations that cause conversion to mucoidy in cystic fibrosis isolates occur frequently in mucA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP row on regulation of polysaccharide biosynthetic
      process. Abstract only in the cache (a PMC copy exists). The abstract states directly
      that MucA binds AlgU and inhibits its activity, and links mucA mutation to mucoidy
      (alginate overproduction).
- id: PMID:22842599
  title: Different mutations in mucA gene of Pseudomonas aeruginosa mucoid strains in
    cystic fibrosis patients and their effect on algU gene expression.
  findings:
  - statement: >-
      mucA mutations in mucoid cystic fibrosis isolates, several truncating, were
      related to algU expression.
    supporting_text: In all mutated strains, algU gene expression was analyzed to determine if mutations in mucA, resulting in a strong loss of its protein, could significantly influence its function
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP sigma factor antagonist activity row that seeds the
      PTN002211401 IBD. Abstract only. Clinical isolates sequenced for mucA mutations and
      assayed for algU expression (algU is autoregulated, so its expression reports AlgU
      activity). A derepression phenotype, the usual IMP evidence for an anti-sigma factor;
      the direct binding and inhibition evidence is in PMID:8759866.
- id: PMID:19226327
  title: Use of cell wall stress to characterize sigma 22 (AlgT/U) activation by regulated
    proteolysis and its regulon in Pseudomonas aeruginosa.
  findings:
  - statement: MucA sequesters sigma-22 from its target promoters.
    supporting_text: MucA sequesters extracytoplasmic function (ECF) sigma(22) (algT/U encoded) from target promoters including PalgD for alginate biosynthesis.
  - statement: Cell wall stress triggers rapid degradation of MucA and activation of sigma-22.
    supporting_text: When strain PAO1 was exposed to d-cycloserine, MucA was degraded within just 10 min, and sigma(22) was activated.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; IntAct source for the MucA-MucB IPI.
- id: PMID:19298369
  title: Control of Pseudomonas aeruginosa AlgW protease cleavage of MucA by peptide
    signals and MucB.
  findings:
  - statement: MucA is a transmembrane protein that inhibits AlgU; MucB binding blocks its cleavage by AlgW.
    supporting_text: The alginate response is regulated by proteolytic cleavage of MucA, a transmembrane protein that inhibits the transcription factor AlgU, and by the periplasmic protein MucB.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. IntAct source for the MucA-MucB and MucA-AlgW IPIs (purified proteins).
