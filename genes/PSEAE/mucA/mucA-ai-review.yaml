id: P38107
gene_symbol: mucA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  MucA (PA0763) is the RseA-family inner-membrane anti-sigma factor of the
  extracytoplasmic-function sigma factor AlgU (AlgT, sigma-22) of Pseudomonas aeruginosa,
  encoded in the algU-mucABCD operon. It spans the cytoplasmic membrane once: its
  cytoplasmic N-terminal domain (RseA_N) binds AlgU and holds it away from its promoters,
  and its periplasmic C-terminal domain (RseA_C) binds the periplasmic protein MucB, which
  protects MucA from cleavage. Cell wall stress activates the site-1 protease AlgW (a DegS
  homologue) to cleave the periplasmic domain of MucA, after which an RseP homologue
  (YaeL) cleaves it within the membrane, releasing AlgU to transcribe its regulon,
  including the alginate biosynthesis operon. Loss-of-function mutations in mucA, frequent
  in cystic fibrosis isolates, derepress AlgU and convert the bacterium to the mucoid,
  alginate-overproducing form.
