  review:
    summary: >-
      Propagation from PANTHER:PTN000909483, which PAINT's own records identify as the
      allantoinase node of PTHR43668. The node itself is well seeded and is not disputed;
      what is wrong is that this leaf sits under it.
    action: REMOVE
    reason: >-
      The dispute is about node placement, not donor strength. PAINT draws the boundary
      between the two functions of this family explicitly: GO:0004151 is asserted by IBD at
      the ancestor PTN000182407, seeded by Aquifex aeolicus PyrC (O66990), whose EC 3.5.2.3
      assignment carries experimental evidence, and allantoinase activity is kept out of that
      ancestor by an explicit negated IRD row pointing at PTN000909483. PA5541 is an
      experimentally confirmed dihydroorotase that complements an E. coli pyrC mutant, so it
      belongs functionally on the PTN000182407 side of exactly the boundary the curator drew;
      PANTHER instead places it under the allantoinase node, into subfamily SF4, where it
      inherits the assertion the ancestor was pruned of. Two checks support reading this as
      misplacement rather than a genuine second activity: a UniProt query for EC 3.5.2.5
      across P. aeruginosa PAO1 returns no entries at all, so this row is the organism's only
      allantoinase claim and has no pathway around it, and the organism's other dihydroorotase
      (P72170, pyrC/PA3527) is annotated as one. No allantoinase assay has been done on this
      protein in either direction; the claim is removed because its only basis is a
      propagation the family's own curation argues against.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000909483
        source_label: allantoinase node of PTHR43668
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
