        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:Q5B4C7
        source_label: Aspergillus nidulans allantoinase
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: AGI_LocusCode:AT4G04955
        source_label: ALN, Arabidopsis thaliana allantoinase
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
