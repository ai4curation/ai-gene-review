- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT4G04955
  - PANTHER:PTN000909483
  - UniProtKB:P77671
  review:
    summary: >-
      Location row from the same node. The misplacement that invalidates the two function
      rows does not touch this one, because both branches of the family are cytoplasmic.
    action: ACCEPT
    reason: >-
      The claim survives the node question rather than depending on it: dihydroorotase acts
      on a soluble intermediate of de novo pyrimidine biosynthesis, a pathway that runs in
