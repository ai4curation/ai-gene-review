core_functions:
- description: >-
    Reserve dihydroorotase of de novo pyrimidine biosynthesis: catalyses the reversible
    cyclisation of N-carbamoyl-L-aspartate to L-dihydroorotate, duplicating the step carried
    out by the constitutive PyrC and becoming the only source of that step when pyrC is lost.
  molecular_function:
    id: GO:0004151
    label: dihydroorotase activity
  directly_involved_in:
  - id: GO:0044205
    label: "'de novo' UMP biosynthetic process"
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15278241
    reference_section_type: ABSTRACT
    supporting_text: >-
      Two of these genes, designated pyrC (PA3527) and pyrC2 (PA5541), encode polypeptides
      with dihydroorotase (DHOase) activity
  - reference_id: PMID:15278241
    reference_section_type: ABSTRACT
    supporting_text: >-
      While pyrC was found to be constitutively expressed, pyrC2 was expressed only in the
      pyrC mutant background.
suggested_questions:
- question: >-
    What makes pyrC2 expression conditional on the loss of pyrC? The paper establishes the
    pattern but not the mechanism, and it is unusual enough that the regulator is worth
    identifying: is pyrC2 repressed directly, or responding to the pyrimidine limitation that
    a pyrC mutant experiences?
- question: >-
    Does PA5541 differ kinetically from PyrC in a way that explains why the organism keeps a
    second, conditionally expressed copy rather than a second constitutive one? At 445
    residues it is substantially larger than typical bacterial dihydroorotases, which the
    paper notes without accounting for.
- question: >-
    Is PA5541 genuinely incapable of hydrolysing allantoin, or has the activity simply never
    been tested? PANTHER's placement of it in the allantoinase subfamily is the reason the
    question arises, and a negative assay would settle the removal argued here on direct
    evidence rather than on node placement.
suggested_experiments:
- description: >-
    Assay purified PA5541 against allantoin alongside N-carbamoyl-L-aspartate, with E. coli
    AllB and P. aeruginosa PyrC as the two controls. This is the one measurement that would
    convert the node-placement argument above into a direct result, in either direction.
- description: >-
    Map the pyrC2 promoter and identify what derepresses it in a pyrC background, by
    combining the existing lacZ fusion with a transposon screen for mutants that express
    pyrC2 constitutively.
- description: >-
    Determine whether the extra sequence that makes PA5541 the largest prokaryotic
    dihydroorotase reported forms a discrete domain, by limited proteolysis or by a structure,
    and test whether removing it affects activity or stability.
