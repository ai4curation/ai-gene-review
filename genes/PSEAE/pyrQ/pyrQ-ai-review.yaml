- term:
    id: GO:0004151
    label: dihydroorotase activity
  evidence_type: IMP
  original_reference_id: PMID:15278241
  qualifier: enables
  review:
    summary: >-
      The central annotation, and the one the review is built around: PA5541 is named in the
      paper as pyrC2, one of the two loci whose products carry dihydroorotase activity.
    action: ACCEPT
    reason: >-
      Supported in the organism and in a heterologous test. The abstract names the locus
      rather than leaving it to inference, the cloned gene complements an E. coli pyrC
      mutant, and the pyrC pyrC2 double mutant is an absolute pyrimidine auxotroph while
      neither single mutant is, which is the genetic signature of two redundant enzymes for
      one step. The UniProt record agrees on family placement through a dihydroorotase-specific
      conserved site, but the record's own function statement is ARBA-derived and plays no
      part in this judgement.
    supported_by:
    - reference_id: PMID:15278241
      reference_section_type: ABSTRACT
      supporting_text: >-
        Two of these genes, designated pyrC (PA3527) and pyrC2 (PA5541), encode polypeptides
        with dihydroorotase (DHOase) activity
    - reference_id: PMID:15278241
      reference_section_type: ABSTRACT
      supporting_text: >-
        A pyrC, pyrC2 double mutant was also constructed, and this strain had an absolute
        requirement for pyrimidines.
- term:
    id: GO:0006221
    label: pyrimidine nucleotide biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:15278241
  qualifier: involved_in
  review:
    summary: >-
      The process the activity belongs to, from the same paper and the same double-mutant
      phenotype — but named one level above what that phenotype shows.
    action: MODIFY
    reason: >-
      The gene product performs a step of the pathway rather than merely being required for
      it: dihydroorotase catalyses the cyclisation of N-carbamoyl-L-aspartate, the third
      reaction of de novo pyrimidine biosynthesis. That is the specific pathway GO:0044205
      names, and this row's own evidence reaches it: complementation of an E. coli pyrC mutant
      is complementation of a de novo pathway defect, and an absolute pyrimidine requirement in
      the double mutant is the phenotype of a cell that can no longer make pyrimidines de novo
      but can still salvage them. Pyrimidine nucleotide biosynthesis in general would also be
      satisfied by salvage, which this enzyme has nothing to do with. The repository already made
      this call on the sibling enzyme, where genes/PSEPK/pyrC marks GO:0006221 TOO_GENERAL and
      keeps GO:0044205. Stated plainly: unlike P. putida pyrC, Q9HT33 is an unreviewed entry with
      no CC PATHWAY line, so placing it in the de novo pathway is an inference from the two
      genetic results above rather than a transcription from the record.
    proposed_replacement_terms:
    - id: GO:0044205
      label: "'de novo' UMP biosynthetic process"
    supported_by:
    - reference_id: PMID:15278241
      reference_section_type: ABSTRACT
      supporting_text: >-
        A pyrC, pyrC2 double mutant was also constructed, and this strain had an absolute
        requirement for pyrimidines.
