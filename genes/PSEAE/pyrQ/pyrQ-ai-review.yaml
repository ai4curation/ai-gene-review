  findings: []
- id: PMID:15278241
  title: 'Pseudomonas aeruginosa dihydroorotases: a tale of three pyrCs.'
  findings:
  - statement: >-
      The paper assigns the three dihydroorotase-like loci of PAO1 explicitly, naming PA5541
      as pyrC2 and as one of the two that carry dihydroorotase activity.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Two of these genes, designated pyrC (PA3527) and pyrC2 (PA5541), encode polypeptides
      with dihydroorotase (DHOase) activity
  - statement: >-
      Both genes complement an Escherichia coli pyrC mutant, which tests the activity in a
      heterologous background rather than inferring it from sequence.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Both pyrC and pyrC2 were cloned and complemented an Escherichia coli pyrC mutant.
  - statement: >-
      Loss of both genes together, but neither alone, makes the organism a pyrimidine
      auxotroph, establishing that the two are redundant for the pathway.
    reference_section_type: ABSTRACT
    supporting_text: >-
      A pyrC, pyrC2 double mutant was also constructed, and this strain had an absolute
      requirement for pyrimidines.
  - statement: >-
      PA5541 is a conditional reserve rather than a second constitutive enzyme: it is
      expressed only when pyrC is missing, which is why the single mutants are prototrophic.
    reference_section_type: ABSTRACT
    supporting_text: >-
      While pyrC was found to be constitutively expressed, pyrC2 was expressed only in the
      pyrC mutant background.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Brichta, Azad, Ralli & O'Donovan 2004, Arch Microbiol). The cached
      entry records full_text_available as false, but every claim this review takes from the
      paper is stated in the abstract itself, including the locus-to-gene assignments, the
      complementation and the double-mutant phenotype, so nothing here depends on unread
      text. This is the source of both IMP rows and is the only experimental evidence on the
      gene.
