          the placement of this leaf beneath it is.
      - source_id: PANTHER:PTN000182407
        source_label: dihydroorotase ancestor of PTHR43668
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node this gene's measured activity belongs to; it carries GO:0004151 by IBD and
          explicit negated IRD rows excluding the allantoinase terms.
      - source_id: UniProtKB:P77671
        source_label: allB, Escherichia coli K12 allantoinase
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: SGD:S000001466
