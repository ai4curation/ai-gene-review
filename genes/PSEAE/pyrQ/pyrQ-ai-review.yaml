id: Q9HT33
gene_symbol: pyrQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5541 is one of two active dihydroorotases of Pseudomonas aeruginosa, designated pyrC2 in
  the paper that characterised them. It catalyses the reversible cyclisation of
  N-carbamoyl-L-aspartate to L-dihydroorotate, the third step of de novo pyrimidine
  biosynthesis, and is a member of the class I dihydroorotase branch of the metal-dependent
  cyclic amidohydrolases. Its role is redundant with that of the constitutive enzyme PyrC
  (PA3527): single mutants of either gene remain pyrimidine prototrophs, while the double
  mutant is an absolute pyrimidine auxotroph. The two are not interchangeable in regulation,
  because PA5541 is expressed only when pyrC is absent, which makes it a reserve enzyme for
  the pathway rather than a second constitutive one. A third dihydroorotase-like protein in
  the organism, PyrC' (PA0401), has no catalytic activity and instead serves as a structural
  subunit of aspartate transcarbamoylase.
