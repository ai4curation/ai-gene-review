- term:
    id: GO:0071916
    label: dipeptide transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:25338022
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA and one of five seeds of PTN001952620. Pletzer et al. deleted the whole dppBCDF operon
      in strain PA14 and showed loss of growth on many dipeptides; the paper maps the operon to PAO1 PA4503-PA4506.
    action: ACCEPT
    reason: >-
      Seed verdict SOUND for the term: DppF is the energizing subunit of the dipeptide importer. The evidence
      is a deletion-mutant growth phenotype in PA14, so the code should be IMP rather than IDA; a source
      defect records this.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence
      requested_change: REPOINT
      asserted_value: IDA
      corrected_value: IMP
      confidence: CONFIRMED
      explanation: >-
        The PseudoCAP GO:0071916 row on PA4506 cites PMID:25338022 as IDA. The full text shows the evidence
        is a deletion of the whole dppBCDF operon in strain PA14, scored by Biolog respiration and growth
        on dipeptides; no transport or ATPase assay of DppF was done. That is mutant-phenotype evidence
        (IMP), transferred from PA14_58490 to the PAO1 ortholog PA4506. The term itself is right.
      supported_by:
      - &id004
        reference_id: PMID:25338022
        supporting_text: In order to investigate the substrate profile of the ABC transporter DppBCDF,
          a deletion mutant of the dppBCDF operon was constructed
      - *id003
    supported_by:
    - *id004
    - *id003
    - *id005
