  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4506 (DppF) is an ATP-binding subunit of the DppBCDF dipeptide ABC importer of Pseudomonas aeruginosa.
  With the second ATPase DppD and the permeases DppB and DppC it forms the inner-membrane transporter,
  which takes up a broad range of di- and tripeptides delivered by five periplasmic substrate-binding
  proteins (DppA1-A5). The ATPase subunits sit on the cytoplasmic face of the inner membrane and couple
  ATP hydrolysis to transport. In strain PA14 deletion of the dppBCDF operon abolished use of most dipeptides
  as nitrogen sources, making Dpp the main dipeptide uptake system.
