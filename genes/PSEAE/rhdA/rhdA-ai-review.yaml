  label: Pseudomonas aeruginosa PAO1
description: >-
  RhdA (PA4956) is the principal rhodanese (thiosulfate:cyanide sulfurtransferase, EC 2.8.1.1) of
  the cyanogenic bacterium Pseudomonas aeruginosa. It is a two-domain rhodanese that transfers the
  outer sulfur of thiosulfate to cyanide through a persulfide on the conserved catalytic Cys230,
  producing the less toxic thiocyanate and sulfite. RhdA is cytoplasmic, accounts for about 90% of
  cytoplasmic rhodanese activity, and is expressed constitutively from two promoters in an operon
  with PA4955 and psd. A deletion mutant grows poorly under cyanogenic conditions and is outcompeted
  by wild type, so RhdA helps protect P. aeruginosa against its own (endogenous) cyanide.
