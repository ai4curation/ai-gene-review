suggested_questions:
- question: >-
    Is cyanide the physiological sulfur acceptor of RhdA in vivo, or does RhdA mainly supply
    persulfide sulfur to other acceptors (for example thioredoxin or iron-sulfur cluster
    assembly), with cyanide detoxification as a secondary role?
suggested_experiments:
- description: >-
    Persulfide-trapping proteomics with a Cys230 substrate-trap RhdA variant in PAO1 under
    cyanogenic and non-cyanogenic growth to identify in vivo sulfur acceptors.
