  findings:
  - statement: >-
      Recombinant RhdA transfers sulfur from thiosulfate to cyanide via persulfuration of Cys230;
      Km thiosulfate 1.0 mM at pH 7.3, Km cyanide 14 mM, Vmax 750 umol/min/mg.
    supporting_text: >-
      the titration of active Pa RhdA with cyanide indicates the presence of one extra sulfur
      bound to the Cys230 Sgamma atom per active enzyme molecule.
