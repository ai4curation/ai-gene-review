suggested_questions:
- question: >-
    GO:0044718 siderophore transmembrane transport is_a GO:0015891 siderophore transport only,
    and neither term is a descendant of GO:0055085 transmembrane transport, although the
    definition of GO:0044718 is explicitly membrane-crossing and sibling terms such as
    GO:0034219 carbohydrate transmembrane transport do sit under GO:0055085. Should GO:0044718
    gain that is_a, so that refining a GO:0055085 row to it keeps the transmembrane claim?
- question: >-
    Has the PvdRT-OpmQ complex been shown physically (co-purification, cross-linking or structure),
    or does membership rest on the operon and shared mutant phenotypes?
- question: >-
    Should MFPs of tripartite pumps carry contributes_to rather than enables for efflux transmembrane
    transporter activity, given that the MFP alone does not move substrate across a membrane?
suggested_experiments:
- description: >-
    Reconstitute PvdT with PvdR in proteoliposomes and measure ATPase stimulation and pyoverdine-dependent
    activity; pull down PvdR with PvdT and OpmQ from iron-starved PAO1 membranes.
