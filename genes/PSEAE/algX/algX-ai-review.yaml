- id: PMID:15489449
  title: AlgX is a periplasmic protein required for alginate biosynthesis in Pseudomonas aeruginosa.
  findings:
  - statement: Cell fractionation localizes AlgX to the periplasm. Nonpolar deletion produces
      degraded mannuronate oligomers, supporting a polymer-protection/export role.
    supporting_text: These studies suggest that AlgX is part of a protein scaffold that surrounds
      and protects newly formed polymers from AlgL degradation
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Supports localization and polymer-production annotations; the full paper
      contains no direct biofilm assay, so that row is supported independently by PMID:36494359.
      Full article cached and inspected.
- id: PMID:8550492
  title: 'Alginate synthesis in Pseudomonas aeruginosa: the role of AlgL (alginate lyase)
    and AlgX.'
  findings:
  - statement: Complementation of polar and defined deletion constructs establishes AlgX and
      AlgL contributions to mucoid alginate production.
    supporting_text: both genes were required to restore the mucoid phenotype.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Historical genetics predates identification of AlgX acetyltransferase chemistry.
      Accessible cached abstract inspected; full experimental text not available in the cache.
- id: PMID:25165982
  title: P. aeruginosa SGNH hydrolase-like proteins AlgJ and AlgX have similar topology but
    separate and distinct roles in alginate acetylation.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Pp catalytic positions D190/H192/S288 must not be copied onto PaAlgJ, whose
      tested positions are D193/H195/S297. Surrogate-substrate hydrolysis is not native alginate
      deacetylation. Full article cached and inspected.
  findings:
  - statement: Direct PaAlgJ and PpAlgJ acetylesterase assays contrast with PaAlgX binding
      and terminal acetyl transfer onto polymannuronate. AlgJ structure is P. putida; native
      relay donor/acceptor chemistry is unresolved.
    supporting_text: AlgX was capable of utilizing the surrogate acetyl-donor 4-nitrophenyl
      acetate to catalyze the O-acetylation of polymannuronic acid.
- id: PMID:23779107
  title: 'Structural and functional characterization of Pseudomonas aeruginosa AlgX: role
    of AlgX in alginate acetylation.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text retrieval was attempted, but the cache remains abstract-only;
      direct polymer acetyl transfer is supplied by the later full-text PMID:25165982. Accessible
      cached abstract inspected; full experimental text not available in the cache.
  findings:
  - statement: PaAlgX structure identifies an SGNH catalytic domain and carbohydrate-binding
      module; catalytic substitutions abolish native alginate acetylation.
    supporting_text: In vivo studies reveal that site-specific mutation of these residues
      results in non-acetylated alginate.
- id: PMID:36494359
  title: Structure of the AlgKX modification and secretion complex required for alginate production
    and biofilm attachment in Pseudomonas aeruginosa.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Figure 5 uses PAO1-derived deletion, WT complementation and N-terminal interface-mutant
      strains; structural/biophysical Pp results are not mislabeled as direct Pa measurements.
      Full article cached and inspected.
  findings:
  - statement: P. putida complex structures and binding assays are distinguished from native
      P. aeruginosa gene/interface perturbations, which demonstrate AlgKX-dependent alginate
      production and biofilm adherence.
    supporting_text: +AlgXWT had comparable staining to the parental.
- id: PMID:37797696
  title: Pseudomonas aeruginosa AlgF is a protein-protein interaction mediator required for
    acetylation of the alginate exopolysaccharide.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The direct ITC pairs and negative acetylesterase tests use P. putida constructs.
      The negative polymannuronate-oligomer binding assay and NMR structural work use P. aeruginosa
      AlgF; native Pa AlgF–AlgX association is demonstrated by co-IP. Pairwise contacts do
      not prove a simultaneous ternary complex. Full article cached and inspected.
  findings:
  - statement: P. aeruginosa AlgF structure, negative polymer-binding assay and native interaction/stability
      experiments combine with P. putida ortholog ITC and negative acetylesterase assays to
      support a proposed interaction-mediator model. The complete relay/bridging arrangement
      remains hypothetical.
    supporting_text: demonstrate an association between AlgF and AlgX, as well as AlgJ and
      AlgI, in P. aeruginosa.
- id: PMID:40171682
  title: Acyltransferases that Modify Cell Surface Polymers Across the Membrane.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: DltB/DltX and PatA mechanistic studies are comparator systems, not direct
      biochemical proof of the native AlgI intermediate or AlgJ-to-AlgX transfer. Full article
      cached and inspected.
  findings:
  - statement: Reviews cross-membrane acyl-transfer systems and proposes an AlgI acyl-shuttle
      relay through AlgJ/F to AlgX; it explicitly states that the full alginate model has
      not been demonstrated.
    supporting_text: This full model has yet to be demonstrated experimentally
