id: Q51372
gene_symbol: algX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: 'AlgX is a periplasmic alginate-modifying and export-associated protein of Pseudomonas
  aeruginosa. Its N-terminal SGNH hydrolase-like domain catalyzes O-acetylation of polymannuronate,
  demonstrated in vitro using a surrogate acetyl donor, while its C-terminal carbohydrate-binding
  module recognizes the polymer. AlgX also associates with AlgK and contributes to protection
  and export of nascent alginate. This export role is separable from acetylation: loss of
  catalytic activity can leave polymer secretion intact, whereas deletion or disruption of
  the AlgK-binding region impairs alginate production and biofilm adherence.'
