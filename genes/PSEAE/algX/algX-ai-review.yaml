  review:
    summary: AlgX contributes to alginate-dependent biofilm adherence in P. aeruginosa.
    action: KEEP_AS_NON_CORE
    reason: The original 2004 paper establishes polymer production/localization rather than
      a direct biofilm assay. Independent 2022 experiments measure crystal-violet adherence
      in PAO1-derived algX deletion, WT-complemented and AlgK-interface mutant strains, supporting
      this contextual phenotype without making AlgX a universal biofilm regulator.
    supported_by:
