- term:
    id: GO:0051979
    label: alginic acid acetylation
  evidence_type: IDA
  original_reference_id: PMID:25165982
  review:
    summary: AlgX directly catalyzes O-acetylation of the alginate precursor polymer.
    action: NEW
    reason: 'Participation is direct catalysis: AlgX transfers the acetyl group onto polymer,
      rather than merely being required by a phenotype. Exact-term comparator queries find
      the acetylation-machinery proteins AlgI, AlgJ and AlgF already annotated; their annotations
      are contextual convention checks, not support. GO:0051979 is neither an ancestor nor
      descendant of existing alginic acid biosynthesis GO:0042121, and no target GO-CAM matches
      were found. The new assertion rests on the target biochemical transfer assay and independent
      active-site genetics.'
    supported_by:
    - reference_id: PMID:25165982
      supporting_text: AlgX was capable of utilizing the surrogate acetyl-donor 4-nitrophenyl
        acetate to catalyze the O-acetylation of polymannuronic acid.
    - reference_id: PMID:23779107
      supporting_text: In vivo studies reveal that site-specific mutation of these residues
        results in non-acetylated alginate.
