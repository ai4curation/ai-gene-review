suggested_questions:
- question: >-
    GO lacks a type IV pilus retraction term and a cellular component for the
    pilus machine distinct from the fibre (GO:0044096). Should these be
    added, so that motor and alignment proteins stop being annotated to the
    fibre?
suggested_experiments:
- description: >-
    Measure ATPase activity of PilT in the presence of PilU, PilC and PilM
    to test whether partner binding stimulates hydrolysis, and relate this to
    retraction force and speed in vivo for the corresponding mutants.
