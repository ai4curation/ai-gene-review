taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PilT (PA0395) is the retraction ATPase of the type IVa pilus of Pseudomonas
  aeruginosa, a member of the secretion NTPase (GspE/PilT) superfamily with
  conserved Walker A, Walker B, Asp Box and His Box motifs. It forms a
  cytoplasmic homohexamer that docks at the base of the pilus machine,
  opposite the extension ATPase PilB, and couples ATP hydrolysis to domain
  motions that depolymerise the pilus into pilin monomers returned to the
  inner membrane. PilT localises to both cell poles and also promotes
  retraction by its paralogue PilU. pilT mutants are hyperpiliated but cannot
  retract their pili, so they do not twitch and are resistant to
  pilus-specific phages, and they are attenuated in dissemination during infection.
