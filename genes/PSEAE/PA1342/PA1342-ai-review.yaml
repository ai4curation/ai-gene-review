- term:
    id: GO:0042940
    label: D-amino acid transport
  evidence_type: IMP
  original_reference_id: PMID:25082951
  qualifier: involved_in
  review:
    summary: >-
      He et al. 2014 report that the AatJMQP transporter is induced by D-Glu
      and essential for D-Glu utilisation in PAO1.
    action: KEEP_AS_NON_CORE
    reason: >-
      Abstract only; which aat gene was mutated is not stated, so I defer to
      the curator who read the full text. D-glutamate is a secondary,
      condition-specific substrate of the system, and purified PA1342 is
      reported to bind L-Glu and L-Asp specifically, with no D-Glu binding
      reported (PMID:31627455), so how the binding protein contributes to D-Glu
      uptake is open. GO has no D-glutamate transport term, so D-amino acid
      transport is as precise as GO allows; kept as non-core, matching the
      same row on PA1340.
    supported_by:
    - reference_id: PMID:25082951
      supporting_text: >-
        expression of the previously characterized AatJMQP transporter for
        acidic l-amino acid uptake was found inducible by D-Glu and essential
        for D-Glu utilization
- term:
    id: GO:0016595
    label: glutamate binding
  evidence_type: IDA
  original_reference_id: PMID:31627455
  qualifier: enables
  review:
    summary: Purified PA1342 binds L-glutamate (ITC Kd 1.4 uM).
    action: NEW
    reason: >-
      Direct binding by thermal shift and ITC on the purified P. aeruginosa
      protein; this is the substrate-capture activity of the binding protein
      and the basis of the UniProt function statement. E. coli GltI carries the
      same term by IPI.
    supported_by:
    - reference_id: PMID:31627455
      supporting_text: >-
        Thermal shift assays showed only stabilization in the presence of three
        ligands, namely l-Glu, l-Asp, and N-phthaloyl-l-glutamic acid (Table 1).
        ITC studies revealed l-Glu and l-Asp binding with affinities of 1.4 and
        20 µM, respectively.
