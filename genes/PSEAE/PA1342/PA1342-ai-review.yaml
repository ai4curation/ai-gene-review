    supported_by:
    - reference_id: PMID:31627455
      supporting_text: >-
        ITC studies revealed l-Glu and l-Asp binding with affinities of 1.4 and
        20 µM, respectively. No binding was observed for other amino acids,
        including l-Gln and l-Asn, indicating that PA1342 is specific for l-Glu
        and l-Asp (Table 1).
    - reference_id: PMID:18310026
