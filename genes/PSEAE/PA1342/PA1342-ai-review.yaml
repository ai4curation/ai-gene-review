id: Q9I402
gene_symbol: PA1342
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1342 (AatJ) is the periplasmic solute-binding protein of the AatJQMP
  (PA1342-PA1339) ABC importer for acidic amino acids in Pseudomonas
  aeruginosa, orthologous to AatJ of Pseudomonas putida and GltI of
  Escherichia coli. It is a 302-residue SBP_bac_3 family protein with an
  N-terminal signal peptide. The purified protein binds L-glutamate (Kd about
  1.4 uM) and L-aspartate (about 20 uM) and not other amino acids, and delivers
  them to the PA1341/PA1340 permeases for ATP-driven uptake across the inner
  membrane. The transporter is induced by D-glutamate and is needed for growth
  on D-glutamate.
