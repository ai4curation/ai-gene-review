  review:
    summary: >-
      Correct for this SBP_bac_3 amino acid binding protein clade; for PA1342
      the substrates (L-Glu, L-Asp) and the direction (import) are known.
    action: MODIFY
    reason: >-
      The node term suits a clade of periplasmic amino acid binding proteins
      of varied specificity and is grounded by E. coli GltI (IDA L-glutamate
      transmembrane transport). Q9I402 in its own WITH/FROM marks its
      PseudoCAP seed, which is expected. PA1342 binds only L-Glu and L-Asp
      (ITC) and is the binding protein of an ABC importer, so the specific
      processes are L-glutamate and L-aspartate import across the plasma
      membrane, as already chosen for the PA1340 and PA1341 permeases of the
      same transporter.
