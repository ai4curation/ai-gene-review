- term:
    id: GO:0097351
    label: toxin sequestering activity
  evidence_type: IMP
  original_reference_id: PMID:24794869
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row asserting toxin sequestering activity on Tse5. The term describes binding a
      toxin to prevent it acting, which is the function of an immunity protein. Tse5 is the
      toxin, so the relationship is inverted - the same error the merged tse6 review found on
      its own gene, here from a different paper and a different effector family.
    action: REMOVE
    reason: >-
      The activity belongs to the cognate immunity protein Tsi5, and three independent
      statements establish the direction without needing anything beyond the record and the
      abstract. The curated UniProt FUNCTION, carrying ECO:0000269 to both papers cited on this
      gene, says Tse5 is a toxin secreted by the H1-T6SS and that the producing bacterium is
      protected by a cognate immunity protein. The curated DISRUPTION PHENOTYPE names that
      partner as Tsi5, so the gene that should hold this term is identified on Tse5's own
      record. And the cited paper states that RhsP1's C-terminus carries the toxic activity and
      the producer is protected by a cognate immunity. A protein cannot both be the toxin and
      the thing that sequesters it. This is the third instance of the inversion in this corpus
      after tse6 and its correct counterpart tsi6, which points to a pair-level
      toxin-immunity experiment entered against both halves of the bicistron rather than three
      unrelated slips.
    supported_by:
    - reference_id: file:PSEAE/tse5/tse5-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Toxin secreted by the H1 type VI (H1-T6SS) secretion system that acts on bacterial
        target cells.
    - reference_id: file:PSEAE/tse5/tse5-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: The producing bacterium is protected by a cognate immunity protein.
    - reference_id: PMID:24794869
      reference_section_type: ABSTRACT
      supporting_text: >-
        The RhsP1 C terminus carries a toxic activity, from which the producing bacterium is
        protected by a cognate immunity.
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: PSEUDOCAP
      slot: Gene product
      requested_change: REPOINT
      asserted_value: UniProtKB:Q9I0F4
      corrected_value: UniProtKB:P0DTB6
      corrected_label: tsi5 (PA2683.1), Immune protein Tsi5
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        GO:0097351 toxin sequestering activity, IMP, PMID:24794869, is annotated to tse5
        (PA2684, Q9I0F4). The term describes binding a toxin to prevent it from acting, which
        is the immunity protein's function and inverts the role of the effector. Tse5 is the
        toxin: its curated UniProt FUNCTION, with ECO:0000269 to both PMID:24589350 and
        PMID:24794869, describes it as a toxin secreted by the H1-T6SS whose producing
        bacterium is protected by a cognate immunity protein, and its curated DISRUPTION
        PHENOTYPE names that partner as Tsi5. The cited paper agrees, stating that the RhsP1
        C-terminus carries the toxic activity and the producer is protected by a cognate
        immunity. The row should be repointed to the immunity protein, P0DTB6 (TSI5_PSEAE, gene
        tsi5 / PA2683.1); that accession was resolved through the UniProt API rather than
        inferred. Stated at CONFIRMED because it rests on curated statements tied to the cited
        publications plus the term definition, not on an unread portion of the paper. Note that
        this is the third instance of the same inversion in this organism: the identical error
        was confirmed on tse6 (Q9I739, to be repointed to tsi6 Q9I740) from PMID:24589350,
        while tsi6 carries the term correctly. A reference-level review of GO:0097351 across
        the T6SS effector-immunity pairs would be worth doing, since the pattern looks like a
        pair-level experiment entered against both halves of each bicistron.
      supported_by:
      - reference_id: file:PSEAE/tse5/tse5-uniprot.txt
        record_section: ["CC:DISRUPTION PHENOTYPE"]
        supporting_text: >-
          Deletion mutant together with deletion of its cognate immunity protein Tsi5 leads to
          a significant loss of fitness advantage
core_functions:
- description: >-
    PAAR domain-containing Rhs-family effector of the H1 type VI secretion system: tethers to
    the VgrG1c spike through its PAAR module, contributing a component the delivery apparatus
    depends on, and carries a C-terminal toxin domain that acts on competing bacteria once
    delivered.
  directly_involved_in:
  - id: GO:0033103
    label: protein secretion by the type VI secretion system
  supported_by:
  - reference_id: PMID:24589350
    reference_section_type: DISCUSSION
    supporting_text: >-
      our data suggest that the PAAR domain-containing effectors, Tse5 and Tse6, do not require
      Hcp for stability and display a strict functional requirement for their cognate VgrG
      proteins
  - reference_id: file:PSEAE/tse5/tse5-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Toxin secreted by the H1 type VI (H1-T6SS) secretion system that acts on bacterial target
      cells.
  knowledge_gaps:
  - gap_statement: >-
      What the Tse5 C-terminal toxin domain does to the target cell is not established. The
      papers show the C-terminus is toxic and that a cognate immunity protein neutralises it,
      but the molecular target and the chemistry are unidentified, which is why this review
      asserts no molecular function for the gene despite its being a reviewed Swiss-Prot entry.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    What is the enzymatic activity of the Tse5 C-terminal toxin domain, and what does it attack
    in the target cell? Without that the gene has no molecular function annotation at all,
    which is the main gap in its record.
- question: >-
    Where is the PAAR region of Tse5, and does it occupy the VgrG1c spike tip in the same way
    Tse6's does? The primary literature groups the two as PAAR effectors, but InterPro
    annotates no PAAR signature on this entry, so the boundaries of the module and whether it
    caps the spike or only tethers to it are unresolved for this protein.
suggested_experiments:
- description: >-
    Express the Tse5 C-terminal domain in E. coli with and without Tsi5 and screen for the
    molecular lesion - nucleic acid degradation, membrane damage, cofactor depletion - to
    identify the toxin class and give the gene a molecular function.
- description: >-
    Map the Tse5 PAAR region by limited proteolysis and crosslinking against purified VgrG1c,
    and test whether deleting it abolishes Tse5 secretion alone or also destabilises the spike,
    to establish whether the contribution to the apparatus is structural or only an anchor.
