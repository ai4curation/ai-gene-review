gene_symbol: tse5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Tse5 (PA2684) is a 1317-residue Rhs-family polymorphic toxin of Pseudomonas aeruginosa,
  delivered into competing bacteria by the H1 type VI secretion system. It is a PAAR
  domain-containing effector: unlike the Hcp-stabilised substrates of the same system it does
  not depend on Hcp for stability and instead requires its cognate VgrG spike protein, VgrG1c,
  which it is tethered to through the PAAR module that also sharpens the spike tip. A long
  central array of Rhs repeats precedes a C-terminal toxin domain carrying the activity against
  the target cell. The producing bacterium is protected from its own toxin by the cognate
  immunity protein Tsi5, encoded adjacent to it, and deleting both genes together costs the
  organism its competitive fitness advantage.
references:
- id: PMID:24589350
  title: >-
    Genetically distinct pathways guide effector export through the type VI secretion system.
  findings:
  - statement: >-
      Tse5 and Tse6 are grouped together as PAAR-repeat-containing effectors, distinguishing
      them from the Hcp-stabilised substrates of the same secretion system.
    reference_section_type: ABSTRACT
    supporting_text: >-
      our screen failed to identify two predicted H1-T6SS effectors, Tse5 and Tse6, which
      differ from Hcp-stabilized substrates by the presence of toxin-associated PAAR-repeat
      motifs
  - statement: >-
      Both are PAAR domain-containing effectors with a strict functional requirement for their
      cognate VgrG, which is the basis for treating them as components of the delivery
      apparatus rather than as free cargo.
    reference_section_type: DISCUSSION
    supporting_text: >-
      our data suggest that the PAAR domain-containing effectors, Tse5 and Tse6, do not require
      Hcp for stability and display a strict functional requirement for their cognate VgrG
      proteins
  - statement: >-
      The PAAR domain tethers effectors to VgrG proteins in addition to its structural role at
      the spike tip.
    reference_section_type: INTRODUCTION
    supporting_text: >-
      it also likely functions as a protein-protein interaction module that tethers effectors
      to VgrGs
  - statement: >-
      PAAR repeats are found in RHS/YD-repeat toxins, which is this protein's architecture.
    reference_section_type: INTRODUCTION
    supporting_text: >-
      PAAR repeats are found in many putative toxins including rearrangement hot-spot/tyr-asp
      (RHS/YD)-repeat containing proteins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Whitney, Beck, Goo, Russell et al. 2014), full text cached. Cited by the
      curated UniProt FUNCTION and DISRUPTION PHENOTYPE for this gene with ECO:0000269. Its
      bearing on this review is larger than it first appears: it identifies Tse5 and Tse6
      together as PAAR domain-containing effectors that bypass the Hcp chaperone route and
      depend strictly on their cognate VgrG, and it explains that the PAAR module both caps the
      VgrG spike and tethers effectors to it. That is what supports the GO:0033103 rows on
      structural rather than cargo grounds. Reading it corrected a first-pass conclusion in
      this review drawn from the absence of a PAAR signature in the InterPro list.
- id: PMID:24794869
  title: The VgrG proteins are "à la carte" delivery systems for bacterial type VI effectors.
  findings:
  - statement: >-
      Tse5 is the Rhs protein the paper calls RhsP1, and VgrG1c is responsible for its
      delivery.
    reference_section_type: ABSTRACT
    supporting_text: VgrG1c is involved in the delivery of an Rhs protein, RhsP1.
  - statement: >-
      The toxic activity is in the C-terminus and the producing cell is protected by a separate
      immunity protein, so this gene is the toxin and not the sequestering partner.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The RhsP1 C terminus carries a toxic activity, from which the producing bacterium is
      protected by a cognate immunity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Hachani, Allsopp, Oduko & Filloux 2014), full text cached. This is the
      paper that named Tse5 - the UniProt RecName carries ECO:0000303 to it - and it assigns
      the Rhs effector RhsP1 to delivery by VgrG1c. Correctly cited for this gene. What it does
      not support is the GO:0097351 row: it states that the producing bacterium is protected by
      a cognate immunity, which places the sequestering function on that partner rather than on
      this toxin.
