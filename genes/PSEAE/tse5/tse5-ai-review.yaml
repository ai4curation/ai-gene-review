existing_annotations:
- term:
    id: GO:0033103
    label: protein secretion by the type VI secretion system
  evidence_type: IDA
  original_reference_id: PMID:24589350
  qualifier: involved_in
  review:
    summary: >-
      Direct-assay row for participation in type VI secretion, from the paper that separated
      the Hcp-stabilised substrates from the PAAR-dependent ones. Tse5 is itself exported by
      the system, so the term cannot rest on that: a substrate is not a participant.
    action: ACCEPT
    reason: >-
      Core role, and on the same structural basis the merged tse6 review established rather
      than a weaker one. The cited paper groups Tse5 with Tse6 as PAAR domain-containing
      effectors that bypass the Hcp chaperone route and show a strict functional requirement
      for their cognate VgrG, and it describes the PAAR module as both occupying the tip of the
      VgrG spike and tethering effectors to it. A protein supplying that module contributes a
      component the apparatus depends on, which is the scaffold case the project rules work
      through, not mere cargo status. This matters because the same review family splits on
      this term: tse6 accepts it on exactly this reasoning while tsi6, a cytoplasmic immunity
      protein contributing nothing to the machinery, is marked over-annotated. One caveat
      recorded rather than hidden: InterPro annotates no PAAR signature on this entry, so the
      PAAR assignment here rests on the primary literature rather than on the record, and
      PMID:24794869 frames VgrG1c as delivering this effector, which is cargo language. The
      experimental papers carry more weight than a signature gap.
    supported_by:
    - reference_id: PMID:24589350
      reference_section_type: DISCUSSION
      supporting_text: >-
        our data suggest that the PAAR domain-containing effectors, Tse5 and Tse6, do not
        require Hcp for stability and display a strict functional requirement for their cognate
        VgrG proteins
    - reference_id: PMID:24589350
      reference_section_type: INTRODUCTION
      supporting_text: >-
        it also likely functions as a protein-protein interaction module that tethers effectors
        to VgrGs
