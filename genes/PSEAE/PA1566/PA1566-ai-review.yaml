  review:
    summary: >-
      InterPro2GO from the GS catalytic and N-terminal domain signatures, which
      do not separate glutamine synthetases from their gamma-glutamylpolyamine
      synthetase paralogs.
    action: MODIFY
    reason: >-
      The domain and reaction class (ATP-dependent ligation of L-glutamate to an
      amine) are right, the substrate is not. PA1566 belongs to the PuuA
      (gamma-glutamylputrescine synthetase) family and the genetics place it in
      diaminopropane catabolism; P. aeruginosa has a dedicated glutamine
      synthetase, GlnA. Generalize to the parent reaction class until the
      substrate is measured.
    proposed_replacement_terms:
