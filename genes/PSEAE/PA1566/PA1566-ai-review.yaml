taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1566 (PauA3) is one of seven glutamine synthetase-like
  gamma-glutamylpolyamine synthetases (PauA1-PauA7) of Pseudomonas aeruginosa
  PAO1, homologous to Escherichia coli PuuA, the first enzyme of the
  gamma-glutamylation pathway that converts polyamines to GABA. PA1566 is
  encoded with pauB2 in the spermidine- and diaminopropane-inducible pauA3B2
  operon, and a pauA3 mutant grows poorly on 1,3-diaminopropane, so it is
  thought to gamma-glutamylate diaminopropane (derived from the aminopropyl
  moiety of spermidine) for catabolism. Its enzymatic activity and substrate
  have not been measured with purified protein.
