suggested_questions:
- question: >-
    Is 1,3-diaminopropane the preferred substrate of PauA3, and does it also
    gamma-glutamylate the aminopropyl part of spermidine directly?
suggested_experiments:
- description: >-
    Purify PA1566 and measure ATP-dependent gamma-glutamylation of
    1,3-diaminopropane, putrescine, cadaverine, spermidine and ammonia
    (glutamine synthetase activity) to define its substrate range.
