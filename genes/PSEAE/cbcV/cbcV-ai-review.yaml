  review:
    summary: The shared Cbc core imports choline and betaines with compatible binding proteins.
    action: MODIFY
    reason: CbcV supplies the ABC nucleotide-binding/ATPase component. PAO1 cbcXWV confers
      radiolabeled choline and glycine-betaine accumulation in E. coli MKH13; adding CaiX to cbcWV
      separately confers carnitine uptake. These experiments support quaternary ammonium cargo
      specificity of the assembled importer, not autonomous transport by an isolated subunit. The
      amine-to-QAC replacement corrects the substrate class rather than rejecting transport. PAINT
      places the ancestral claim at PANTHER:PTN002466744. The target is itself experimentally
      grounded among the descendant sources; its presence is not circular. No IRD/IKR loss was found
      on this lineage.
    supported_by:
    - reference_id: PMID:19919675
      supporting_text: Interestingly, cells of MKH13 transformed with pME6041 expressing cbcXWV from
        PAO1, pCbcPAO1, accumulated choline and betaine but little to no carnitine.
    - reference_id: PMID:19919675
      supporting_text: As expected, MKH13 cells coexpressing cbcWV (on pNcbcWV) and caiX (on a
        pTOK2T derivative) were able to take up carnitine but not choline and betaine, demonstrating
        that CaiX was sufficient for, and specific to, carnitine uptake (Table 5).
    proposed_replacement_terms:
    - id: GO:0015418
      label: ABC-type quaternary ammonium compound transporting activity
