- term:
    id: GO:0015226
    label: carnitine transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:19919675
  qualifier: enables
  review:
    summary: CbcW and CbcV contribute to CaiX-dependent carnitine transport by the assembled importer.
    action: ACCEPT
    reason: The measured PAO1 CbcWV core transports carnitine when assembled with a compatible CaiX binding
      protein in E. coli MKH13. cbcV performs part of this transport activity; dependence on another complex
      subunit does not make the cargo-specific activity false for this participating subunit. CaiX selects
      the substrate, CbcW provides the membrane pathway, and CbcV supplies ATP coupling. Accept the target
      function and record contributes_to_molecular_function in core_functions, consistently with CaiX.
      The original machine-sourced enables qualifier is preserved. The assay establishes the assembled
      heterologous transporter activity, not autonomous subunit transport or native PAO1 uptake kinetics.
    supported_by:
    - reference_id: PMID:19919675
      supporting_text: As expected, MKH13 cells coexpressing cbcWV (on pNcbcWV) and caiX (on a pTOK2T
        derivative) were able to take up carnitine but not choline and betaine, demonstrating that CaiX
        was sufficient for, and specific to, carnitine uptake (Table 5).
