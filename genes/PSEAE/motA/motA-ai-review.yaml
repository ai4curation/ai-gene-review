    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IMP
  original_reference_id: PMID:25349157
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP from Kuchma et al. 2015 (PA14; abstract only): mutating
      motAB increases swarming and relieves c-di-GMP repression of swarming,
      while MotA overexpression represses swarming.
    action: KEEP_AS_NON_CORE
    reason: >-
      The stator is physically part of the motor during swarming, so a
      context-specific involved_in is not false (and is supported by
      PMID:15629949); but the phenotype reported here is the opposite of a
      requirement (the mutant swarms more), and the paper's finding is that
      MotAB is needed for c-di-GMP-mediated repression of swarming. Full text
      was not retrievable, so the row is kept, consistent with the other
      swarming rows; see the PSEUDOCAP defect.
    supported_by:
    - reference_id: PMID:25349157
      supporting_text: >-
        Here we show that the repression of swarming motility requires a
        functional MotAB stator complex.
    source_defects:
