- term:
    id: GO:0006935
    label: chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR047055
  review:
    summary: InterPro2GO mapping from the MotA-like family signature.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The stator generates torque; it is the output of chemotaxis signalling,
      not part of it (switching is set by CheY-P binding at the FliM/FliN
      switch). In P. aeruginosa, stator mutants that remain motile show normal
      chemotaxis. Chemotaxis is an indirect consequence of motor function, as
      for any flagellar structural protein.
    supported_by:
    - reference_id: PMID:15375113
      supporting_text: >-
        Therefore, the radial expansion defect observed for motAB strains in
        semisolid motility agar cannot be attributed to polar effects that
        disturb chemotaxis.
