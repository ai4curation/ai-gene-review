- id: PMID:15375113
  title: The complex flagellar torque generator of Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Insertions in PA4954 (called motC in this paper) reduce motility; loss of
      both MotA homologues (PA4954 and PA1460) abolishes it. The paper names
      PA4954-PA4953 motCD, the reverse of current usage.
    supporting_text: >-
      Mutation of both genes encoding the MotA homologs or MotB homologs was
      sufficient to abolish motility.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Doyle et al. 2004 J Bacteriol; full text cached. Supports the IMP
      flagellum-dependent motility row. Beware the swapped motAB/motCD names.
- id: PMID:15629949
  title: Evidence for two flagellar stators and their role in the motility of Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      MotAB and MotCD are redundant for swimming; the motAB single mutant
      swarms like wild type, motCD is needed for swarming on firmer agar, and
      the double mutant neither swims nor swarms.
    supporting_text: >-
      The phenotypic analysis of the deletion mutants demonstrated that the
      MotAB and MotCD proteins are functionally redundant for swimming, as well
      as for swarming in relatively low agar concentrations.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Toutain et al. 2005 J Bacteriol (PA14); full text cached. Cited by
      PseudoCAP for the IMP swarming row that seeds PTN001252377. The paper
      supports a stator role in motility; the swarming claim for MotAB rests
      on the double mutant only, as the single motAB deletion swarms normally.
- id: PMID:25349157
  title: Cyclic di-GMP-mediated repression of swarming motility by Pseudomonas aeruginosa
    PA14 requires the MotAB stator.
  findings:
  - statement: >-
      MotAB is needed for c-di-GMP repression of swarming; motAB mutants swarm
      more than wild type and MotA overexpression represses swarming.
    supporting_text: >-
      Here we show that the repression of swarming motility requires a
      functional MotAB stator complex.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Kuchma et al. 2015 J Bacteriol (PA14); abstract only (PMC full text not
      retrievable through the PubMed tool). Cited by PseudoCAP for a positive
      IMP swarming row that seeds PTN001252377, but the abstract reports
      increased swarming in the mutant. Not marked MISCITED because the full
      text was not read.
