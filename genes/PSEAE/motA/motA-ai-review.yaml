gene_symbol: motA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  MotA (PA4954) is the A subunit of the MotAB flagellar stator of Pseudomonas
  aeruginosa. It is a polytopic inner-membrane protein (four predicted
  transmembrane helices) of the MotA/TolQ/ExbB family and, with MotB (PA4953),
  forms an ion-conducting stator unit whose cytoplasmic loop engages the rotor
  protein FliG to generate torque. P. aeruginosa has a second stator, MotCD
  (PA1460-PA1461); the two are largely redundant for swimming, and loss of
  both MotA homologues abolishes motility. MotCD is the stator needed for
  swarming on firmer surfaces, whereas MotAB is dispensable for swarming and,
  at high c-di-GMP, is needed for repression of swarming, probably by
  displacing MotCD from the motor.
