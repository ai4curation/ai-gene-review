core_functions:
- description: >-
    A subunit of the MotAB stator of the polar flagellum. MotA spans the inner
    membrane and, with MotB, conducts ions to generate torque at the rotor,
    powering flagellum-dependent motility redundantly with the MotCD stator.
  directly_involved_in:
  - id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0120101
    label: bacterial-type flagellum stator complex
  supported_by:
  - reference_id: PMID:15375113
    supporting_text: >-
      Mutation of both genes encoding the MotA homologs or MotB homologs was
      sufficient to abolish motility.
  - reference_id: PMID:25349157
    supporting_text: >-
      P. aeruginosa encodes two stator complexes, MotAB and MotCD, that
      participate in the function of its single polar flagellum.
suggested_questions:
- question: >-
    Does MotAB restrain swarming by occupying stator sites on the motor
    (displacing MotCD), or does its interaction with FliG change torque output
    on surfaces?
suggested_experiments:
- description: >-
    Measure stator occupancy (MotA- and MotC-fluorescent fusions per motor) and
    single-motor torque in cells on swarm agar at low and high c-di-GMP,
    including MotA FliG-interface point mutants, to test the stator-exchange
    model.
