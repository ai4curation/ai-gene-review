- term:
    id: GO:0042286
    label: glutamate-1-semialdehyde 2,1-aminomutase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000241400
  - UniProtKB:P23893
  - UniProtKB:Q9HWU0
  review:
    summary: >-
      IBA from PTN000241400 (15 leaves, 12 taxa, taxon constraint Proteobacteria), seeded by E. coli HemL
      P23893 and PA4088 itself. The topology, checked with panther_tree.py on 2026-11-05, is a
      Proteobacteria SPECIATION node whose 15 leaves are all PTHR43713:SF3 and 13 of which are named hemL;
      PA4088 sits in a Pseudomonas-specific DUPLICATION (PTN002463962) with PA5523 and PAO1 HemL (P48247).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The function is well established for the canonical HemLs at this node, and the node is placed
      correctly for them. PA4088 reaches the term only as a diverged copy of a Pseudomonas-specific
      duplication whose sister kept HemL function (P48247): it is about 27% identical to HemL enzymes,
      versus 66% between HemL orthologs, in an organism that has its own HemL. The transfer to PA4088 is
      unsupported by anything except PA4088's own questionable seed.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN000241400
        source_label: PTN000241400
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Proteobacteria SPECIATION node of 15 SF3 leaves, 13 of them named hemL. No child clade
          separates the Pseudomonas paralogs from PAO1 HemL: PA4088, PA5523 and P48247 are the three
          children of one DUPLICATION (PTN002463962), so the GSAM IBD cannot be moved off PA4088 and the
          divergence has to be recorded on the paralog branches themselves.
      - source_id: UniProtKB:P23893
        source_label: E. coli HemL
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Sound seed for canonical HemL orthologs; 27% identity to PA4088.
      - source_id: UniProtKB:Q9HWU0
        source_label: PA4088 (self; PseudoCAP EXP seed)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Structure-only paper; activity not described in the abstract.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: GO_CENTRAL
      record: PANTHER:PTN000241400
      requested_change: CHECK
      asserted_value: GO:0042286
      confidence: PROBABLE
      explanation: >-
        The PAINT IBD of GO:0042286 at PTN000241400 is seeded by E. coli HemL and PA4088. The topology was
        checked with projects/PSEUDOCAP/panther_tree.py on 2026-11-05. PTN000241400 is a SPECIATION node
        (Proteobacteria) with 15 leaves, all PTHR43713:SF3, 13 of them named hemL. Its children are three
        hemL leaves (H. pylori, N. meningitidis, G. sulfurreducens), a Bradyrhizobium DUPLICATION
        (PTN000241402, 2 leaves: blr6632, blr3552) and a Gammaproteobacteria SPECIATION clade
        (PTN000241405, 10 leaves). The earlier reading, that PA4088, PA5523, blr6632 and blr3552 form one
        divergent lineage, is not supported by the tree: PA4088 and PA5523 sit inside a
        Pseudomonas-specific DUPLICATION (PTN002463962, 3 leaves) whose third member is PAO1 HemL
        (P48247), and the smallest clade holding PA4088 and E. coli HemL is PTN000241405. There is
        therefore no HemL-only subclade to move the IBD to, and the node itself is the right home for the
        GSAM term. What the tree does show is a recent lineage-specific duplication in which one copy kept
        the hemL name and annotation while PA4088 and PA5523 diverged to about 27% identity and are named
        only "probable aminotransferase". Please record that divergence on the paralog branches instead:
        a NOT or loss at PTN002463963 (PA4088) and PTN002463964 (PA5523). PROBABLE rather than CONFIRMED
        because the topology settles where a correction belongs, not whether PA4088 has lost GSAM
        activity; the full text of PMID:29684343 (see the PSEUDOCAP defect on the EXP row) could still
        report an assay.
      supported_by:
