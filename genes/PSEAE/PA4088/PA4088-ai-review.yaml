  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4088 is an uncharacterized pyridoxal 5'-phosphate (PLP)-dependent enzyme of Pseudomonas aeruginosa
  of the class-III aminotransferase fold, in the glutamate-1-semialdehyde aminomutase (GSAM)-like family.
  Its crystal structure shows PLP bound as a Schiff base to Lys286, and a K286A mutant structure contains
  pyridoxamine 5'-phosphate. PA4088 is a distant paralog of the canonical P. aeruginosa GSAM HemL (PA3977),
  sharing only about 27% identity with HemL enzymes, and its close paralog in the same genome is PA5523.
  Its substrate and reaction are not known; no catalytic activity of the purified protein has been reported
  in the abstract of the structural study.
