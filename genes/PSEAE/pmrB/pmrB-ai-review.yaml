taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PmrB (PA4777) is the sensor histidine kinase of the PmrA-PmrB two-component system of Pseudomonas aeruginosa.
  It is an inner-membrane protein with two transmembrane helices around a periplasmic sensor region, a
  HAMP linker, a HisKA dimerisation/phosphoacceptor domain carrying the autophosphorylated His249 and
  an HATPase catalytic domain; it has no receiver or HPt domain. PmrA-PmrB responds to limiting Mg2+ and
  to cationic antimicrobial peptides, autoregulates the pmrAB operon and contributes to resistance to
  polymyxins and cationic peptides, in part through LPS modification genes. Activating pmrB mutations
  are a common cause of clinical colistin resistance.
