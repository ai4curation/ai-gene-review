- id: PMID:14507375
  title: >-
    Cationic antimicrobial peptides activate a two-component regulatory system, PmrA-PmrB, that regulates
    resistance to polymyxin B and cationic antimicrobial peptides in Pseudomonas aeruginosa.
  findings:
  - statement: PmrA-PmrB regulates polymyxin B and cationic peptide resistance.
    supporting_text: >-
      We have identified a second two-component regulatory system, PmrA-PmrB, that regulates resistance
      to polymyxin B and cationic antimicrobial peptides.
  - statement: pmrB inactivation decreases pmrAB operon expression.
    supporting_text: >-
      Inactivation of the pmrB sensor kinase and pmrA response regulator greatly decreased the expression
      of the operon encoding pmrA-pmrB
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      PseudoCAP IDA source for GO:0000160 and seed of the PTN001976770 IBD. Abstract only (no PMC full
      text). The abstract reports interposon mutants, reporter fusions and induction by peptides; it describes
      no biochemical PmrB assay. Whether a direct assay stands behind the IDA code could not be checked.
