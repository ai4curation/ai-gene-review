- term:
    id: GO:0009450
    label: GABA catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000944876
  - PomBase:SPAC19D5.07
  - UniProtKB:P22256
  review:
    summary: >-
      IBA from PTN000944876 (87 leaves), seeded by E. coli GabT, S. pombe uga1 and Drosophila
      Gabat. PA0266 sits in the 7-leaf gammaproteobacterial clade PTN000241472 with the E. coli GabT
      seed, and is the gene called gabT in P. aeruginosa PAO1.
    action: KEEP_AS_NON_CORE
    reason: >-
      An earlier version of this row read "GABA catabolism inherited from
      GABA-transaminase seeds over-annotates a 5-aminovalerate
      aminotransferase." and rested on GABA not having been tested on
      PA0266. That is not a ground against an IBA, and the tree does not
      support it. The E. coli GabT seed (P22256, IMP, EcoCyc) is in the same
      7-leaf clade as PA0266 (PTN000241472, with E. coli PuuE and the
      Salmonella, Yersinia, Shewanella and Xanthomonas orthologs), PA0266 is
      the only P. aeruginosa member of the enclosing 12-leaf bacterial clade
      PTN000241468, and no loss is recorded for the term. There is also
      evidence on the gene. PA0266 is the PAO1 gabT (KEGG and STRING give
      PA0265 and PA0266 the symbols gabD and gabT), and the abstract of
      PMID:18192388 reports that GabD, GabT and PA5313 were identified for
      GABA utilization and that a PA5313 gabT double mutant has a growth
      defect on GABA. Only the abstract of that paper was read, and it does
      not give locus tags, so the row is kept on the tree placement and the
      paper is corroboration. GABA catabolism is a second role beside the
      characterized 5-aminovalerate step of lysine degradation, so it is
      kept as non-core. The P. putida DavT review has not been revisited.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000944876
        source_label: GABA aminotransferase node (PTHR43206)
        source_status: SUPPORTS_TRANSFER
        comment: >-
