  review:
    summary: Cytosolic location inherited from a bacterial class-III aminotransferase node.
    action: KEEP_AS_NON_CORE
    reason: >-
      PAINT places cytosol at the bacteria-wide node PTN000241468, seeded by
      E. coli GabT. DavT is a soluble class-III aminotransferase with no
      signal peptide or transmembrane segment, so inheritance of a cytosolic
      location is consistent with its biology. No localization assay exists
      for DavT itself, and location is context rather than the core activity,
      so the row is kept as non-core.
