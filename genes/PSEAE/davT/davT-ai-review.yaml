- term:
    id: GO:0009450
    label: GABA catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000944876
  - PomBase:SPAC19D5.07
  - UniProtKB:P22256
  review:
    summary: GABA catabolism inherited from GABA-transaminase seeds over-annotates a 5-aminovalerate
      aminotransferase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PTN000944876 node is seeded by GABA aminotransferases (E. coli GabT,
      S. pombe uga1) and descends to DavT because PANTHER subfamily SF58 mixes
      DavT 5-aminovalerate aminotransferases with PuuE/GabT GABA
      aminotransferases. The only experiment on PA0266 concerns
      5-aminovalerate in the lysine-degradation pathway; activity on
      4-aminobutyrate has not been tested, so involvement in GABA catabolism
      is a plausible but undemonstrated inheritance rather than a
      demonstrated role. The same judgement is applied to P. putida DavT and
      to the GABA rows of both DavD orthologs.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000944876
        source_label: GABA aminotransferase node (PTHR11986)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node is seeded by GabT-type GABA aminotransferases, for which the term is sound. DavT is a 5-aminovalerate aminotransferase paralog in the mixed SF58 subfamily; GABA has not been tested on it, so the process is not safely inherited.
    supported_by:
    - reference_id: PMID:17388807
      supporting_text: we identified PA0266 as a putative 5-aminovalerate aminotransferase (EC
        2.6.1.48)
