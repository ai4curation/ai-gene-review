id: Q9I6M4
gene_symbol: davT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  DavT (PA0266) is the pyridoxal 5'-phosphate-dependent 5-aminovalerate
  aminotransferase of Pseudomonas aeruginosa. It transfers the amino group of
  5-aminopentanoate (5-aminovalerate) to 2-oxoglutarate, forming
  5-oxopentanoate (glutarate semialdehyde) and L-glutamate, the step of
  L-lysine degradation that precedes oxidation of glutarate semialdehyde to
  glutarate by the neighbouring davD (PA0265) gene product. DavT is a soluble
  class-III (fold-type I) aminotransferase; in a coupled assay the purified
  PA0265 and PA0266 products together converted 5-aminovalerate onward.
