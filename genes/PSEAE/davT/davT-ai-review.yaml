  review:
    summary: PLP binding is a family-wide cofactor property of class-III aminotransferases.
    action: KEEP_AS_NON_CORE
    reason: >-
      Every class-III aminotransferase forms a Schiff base between PLP and a
      conserved active-site lysine; DavT carries the PLP-attachment site
      signature and the cofactor lysine. The term is correct but describes
      the cofactor, not the substrate-specific transaminase activity, so it is
      non-core, as on P. putida DavT.
