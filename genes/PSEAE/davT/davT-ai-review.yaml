suggested_questions:
- question: Does P. aeruginosa DavT transaminate 4-aminobutyrate at a physiologically relevant rate, or
    is GABA catabolism carried only by the GabT-type enzymes?
- question: What are the individual kinetic constants of purified PA0266, separately from the coupled
    PA0265/PA0266 assay?
suggested_experiments:
- description: >-
    Assay purified PA0266 alone with 5-aminovalerate and 4-aminobutyrate as
    amino donors and 2-oxoglutarate as acceptor, and test a davT deletion for
    growth on L-lysine, cadaverine, 5-aminovalerate and GABA as sole carbon
    sources.
