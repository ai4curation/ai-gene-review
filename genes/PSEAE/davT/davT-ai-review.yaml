- term:
    id: GO:0034386
    label: 4-aminobutyrate:2-oxoglutarate transaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004632
  review:
    summary: Family-based GABA transaminase assignment on the P. aeruginosa gabT gene product, whose
      characterized reaction is 5-aminovalerate transamination.
    action: KEEP_AS_NON_CORE
    reason: >-
      The InterPro IPR004632 signature (and NCBIfam TIGR00700) covers the
      bacterial 4-aminobutyrate aminotransferase-like group as a whole and
      does not separate the DavT clade. The characterized reaction of PA0266
      is 5-aminovalerate transamination, and no assay of the purified enzyme
      with 4-aminobutyrate is cited here. The row was earlier marked as
      over-annotation on that ground alone. It is now kept as non-core, in
      line with the GABA catabolic process row. PA0266 is in the same
      7-leaf PANTHER clade as E. coli GabT (PTN000241472), it is the PAO1
      gabT, and the abstract of PMID:18192388 reports a growth defect on
      GABA for a PA5313 gabT double mutant, which points to GABA
      transamination by both enzymes. This is genetic evidence read from an
      abstract, short of an enzyme assay, so the term is not made core.
    supported_by:
    - reference_id: PMID:18192388
      supporting_text: The growth defect of the PA5313 gabT double mutant in GABA suggested the importance of these two transaminases.
