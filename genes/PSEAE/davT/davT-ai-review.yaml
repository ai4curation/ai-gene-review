      - source_id: UniProtKB:P22256
        source_label: GabT (E. coli)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          QuickGO lists GO:0009450 on P22256 as IMP (PMID:374339, EcoCyc) with the qualifier acts_upstream_of_or_within.
    supported_by:
    - reference_id: PMID:18192388
