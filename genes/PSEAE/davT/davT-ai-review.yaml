    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The InterPro IPR004632 signature (and NCBIfam TIGR00700) covers the
      bacterial 4-aminobutyrate aminotransferase-like group as a whole and
      does not separate the DavT clade. A one-carbon-shorter substrate is
      chemically plausible, but the characterized reaction of PA0266 is
      5-aminovalerate transamination and 4-aminobutyrate has not been tested,
      so the GABA transaminase term over-annotates the known activity.
