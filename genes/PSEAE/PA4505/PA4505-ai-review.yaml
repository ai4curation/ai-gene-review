  review:
    summary: >-
      DppD is an ATPase subunit of the binding protein-dependent DppBCDF importer, whose substrate
      range is set by the DppA1-A5 binding proteins.
    action: NEW
    reason: >-
      PA4505 has no complex annotation. The paper defines the dppBCDF operon and shows that
      a DppA1-A5 penta mutant phenocopies the operon deletion, so the system is a substrate-binding
      subunit-containing ABC transporter (the same term proposed for DppB and DppC). Inferred
      from the operon and phenotypes, hence IC.
    supported_by:
    - reference_id: PMID:25338022
      supporting_text: >-
        The utilization patterns of the transporter mutant and the SBP mutant are very similar.
    - reference_id: PMID:25338022
      supporting_text: >-
        two encoding the hydrophilic nucleotide- and ATP-binding proteins PA14_58470 (dppD)
        and PA14_58490 (dppF)
