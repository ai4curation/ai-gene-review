  review:
    summary: >-
      PseudoCAP row from Pletzer et al. 2014. The claim is correct, but the evidence is an
      operon-deletion phenotype, so the code should be IMP.
    action: ACCEPT
    reason: >-
      The paper deleted the whole dppBCDF operon in PA14 and found loss of dipeptide use as
      nitrogen source (Biolog) and resistance to phaseolotoxin. No uptake, binding or ATPase
      assay was done, and DppD was not mutated alone. This is a mutant phenotype, not a direct
      assay, but it supports the claim for DppD, whose ATPase powers the importer; phaseolotoxin
      resistance shows a loss of uptake specifically. Accepted, with the evidence code flagged
      upstream, as for DppB and DppC.
    supported_by:
    - reference_id: PMID:25338022
      supporting_text: >-
        In order to investigate the substrate profile of the ABC transporter DppBCDF, a deletion
        mutant of the dppBCDF operon was constructed
    - reference_id: PMID:25338022
      supporting_text: >-
        Our results demonstrate that PA14 is sensitive to phaseolotoxin and that it is specifically
        taken up by the dipeptide ABC transporter DppBCDF.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      corrected_value: ECO:0000315
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        GO:0071916 for PA4505 (DppD, Q9HVR6) is annotated IDA to PMID:25338022. The paper's
        evidence is a deletion of the whole dppBCDF operon in strain PA14, scored by Biolog
        respiration on dipeptides and by phaseolotoxin sensitivity. No direct transport, binding
        or ATPase assay was done, so IMP is the correct code. The claim itself is sound. This
        row is the sole seed of the PAINT IBD at PTN000656114 and one of four seeds at PTN000656054.
        The same applies to the PA4503 and PA4504 rows.
      supported_by:
      - reference_id: PMID:25338022
        supporting_text: >-
          Numerous dipeptides could not be used as N-source by the mutant lacking the DppBCDF
          transporter system
