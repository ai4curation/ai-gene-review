  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4505 is DppD, one of the two nucleotide-binding (ATPase) subunits of the DppBCDF dipeptide
  ABC importer of Pseudomonas aeruginosa. It is an OppD-type ABC ATPase (PANTHER subfamily
  DppD) with a Walker A ATP-binding motif and the C-terminal oligopeptide/nickel transporter
  (oligo_HPY) domain, and associates peripherally with the cytoplasmic face of the inner membrane.
  With the second ATPase DppF (PA4506), the permeases DppB and DppC (PA4503, PA4504) and one
  of five periplasmic binding proteins (DppA1-DppA5), it hydrolyses ATP to drive uptake of
  a broad range of dipeptides, and some tripeptides including the toxin phaseolotoxin, used
  as nitrogen sources.
