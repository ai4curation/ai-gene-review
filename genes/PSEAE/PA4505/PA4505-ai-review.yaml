  review:
    summary: >-
      IBA from PTN000656114, whose IBD rests solely on PA4505's own PseudoCAP row. Correct
      for DppD, and the node term suits this DppD-only clade.
    action: ACCEPT
    reason: >-
      PA4505 in its own WITH/FROM marks its experimental seed and is expected. Unlike the
      DppC node PTN000766696 (which also holds NikC and GsiD), PTN000656114 contains only
      DppD orthologs: E. coli, Salmonella, Haemophilus and two Yersinia DppD, plus PA4505
      (6 leaves in 5 taxa). E. coli DppD is the ATPase of the characterised DppABCDF dipeptide
      importer, so a dipeptide transporter term is a fair clade-level claim, even though the
      binding protein sets substrate range (E. coli Dpp also carries heme with a different
      binding protein, and DppD has a heme transporter IMP). Strictly the transport activity
      belongs to the assembled complex (contributes_to), but comparators such as E. coli DppD
      use enables; contributes_to is used in core_functions.
