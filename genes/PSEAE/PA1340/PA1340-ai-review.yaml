core_functions:
- description: >-
    Integral inner-membrane permease subunit (GltK/AatM type) of a binding
    protein-dependent ABC importer for L-glutamate, forming with PA1341 the
    translocation pathway powered by the PA1339 ATPase; the system also
    serves D-glutamate and, with lower efficiency, L-glutamine.
  contributes_to_molecular_function:
    id: GO:0102013
    label: ATPase-coupled L-glutamate tranmembrane transporter activity
  directly_involved_in:
  - id: GO:0098712
    label: L-glutamate import across plasma membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0055052
    label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
  supported_by:
  - reference_id: PMID:18833300
    supporting_text: >-
      All three mutants were defective for utilization of L-glutamic acid as a
      carbon source, and expression of two of these genes was induced by
      L-glutamic acid
  - reference_id: PMID:18310026
    supporting_text: >-
      We describe an ATP-binding cassette (ABC) transporter in Pseudomonas
      putida KT2440 that mediates the uptake of glutamate and aspartate.
suggested_questions:
- question: >-
    Is L-glutamine taken up directly by the PA1342-PA1339 system, or is it
    first deamidated in the periplasm and imported as glutamate?
suggested_experiments:
- description: >-
    [14C]-L-glutamine and [14C]-L-glutamate uptake in an in-frame PA1340
    deletion, with and without a periplasmic glutaminase-asparaginase
    mutation, to separate direct glutamine transport from deamidation.
  experiment_type: transport assay
