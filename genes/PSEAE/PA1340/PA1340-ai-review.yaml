  - statement: >-
      The P. putida KT2440 AatJMQP ABC system takes up Glu and Asp; its
      binding protein binds Glu and Asp with high affinity and Gln weakly.
      Mutants tested were of the binding protein and the ATPase.
    supporting_text: >-
      Uptake of Glu and Asp by either mutant was greatly impaired at both low
      and high amino acid concentrations.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified (Singh and Rohm 2008, Microbiology). Abstract only. The
      abstract explicitly concerns P. putida KT2440 (operon PP1071-PP1068)
      and aatJ/aatP mutants, so an IMP for P. aeruginosa PA1340 looks unsupported, though the full text was not read; it is valid orthology support for the substrate range of the
      system (Glu, Asp; weak Gln).
