taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1340 is an integral inner-membrane permease subunit of a polar amino acid
  ABC importer of Pseudomonas aeruginosa, encoded in the PA1342-PA1339 operon
  that is orthologous to the AatJQMP acidic amino acid transporter of
  Pseudomonas putida and to GltIJKL of Escherichia coli. PA1340 is the
  GltK/AatM-type permease (HisMQ subfamily), with four predicted
  transmembrane helices. With the second permease PA1341, the ATPase PA1339 and
  the periplasmic binding protein, it imports L-glutamate, and the system is
  also needed for growth on D-glutamate and contributes to use of L-glutamine
  and N-acetyl-L-glutamate. The operon is induced by L-glutamate and by
  D-glutamate.
