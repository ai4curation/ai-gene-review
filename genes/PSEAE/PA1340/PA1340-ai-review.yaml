- term:
    id: GO:0006868
    label: L-glutamine transport
  evidence_type: IMP
  original_reference_id: PMID:18310026
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP citing Singh and Rohm 2008, a study of the orthologous
      P. putida KT2440 AatJMQP system. The abstract states the organism and
      the mutants (aatJ binding protein, aatP ATPase); no P. aeruginosa mutant is described, so this is unlikely to be an IMP for PA1340 (full text not read).
    action: MODIFY
    reason: >-
      The claim that PA1340's system can carry L-glutamine is weakly
      supported for P. aeruginosa by the PA1340 Biolog phenotype in
      PMID:18833300 (already annotated as GO:1903803), and by the ortholog's
      weak Gln binding. The P. putida aatJ mutant's failure to grow on Gln
      could also reflect Gln deamidation to Glu by periplasmic
      glutaminase-asparaginase before uptake, which the same abstract places
      under the same regulator. The claim is therefore kept only in the
      precise, non-core form (L-glutamine import across plasma membrane), and
      the evidence code and reference of this row are flagged upstream.
    proposed_replacement_terms:
    - id: GO:1903803
      label: L-glutamine import across plasma membrane
    supported_by:
    - reference_id: PMID:18310026
      supporting_text: >-
        A deletion mutant with inactivated solute-binding protein (KTaatJ)
        failed to grow on Glu and Gln as sole sources of carbon and nitrogen,
        while a mutant lacking a functional nucleotide-binding domain (KTaatP)
        was able to adapt to growth on Glu after an extended lag phase.
    - reference_id: PMID:18833300
      supporting_text: >-
        Additionally, one of these mutants (PA1340) also showed significantly
        decreased utilization of the related compounds, L-glutamine, D-glutamic
        acid, and N-acetyl-L-glutamic acid.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000315
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        GO:0006868 L-glutamine transport for PA1340 (Q9I404) is annotated IMP
        to PMID:18310026. That paper is about Pseudomonas putida KT2440: it
        describes the AatJMQP operon PP1071-PP1068 and mutants of the
        binding protein (aatJ) and ATPase (aatP). The abstract describes no P. aeruginosa mutant and no permease mutant, so IMP is unlikely to apply to PA1340 (full text not read). At most this
        supports an ISS/ISO from the P. putida AatM ortholog, and even there
        the Gln growth defect concerns the binding protein, which binds Gln
        only weakly. PA1340's own glutamine phenotype is already captured by
        the GO:1903803 IMP to PMID:18833300, so the row could be deleted or
        recoded. This row is the sole seed of the PAINT IBD at PTN000764525.
      supported_by:
      - reference_id: PMID:18310026
        supporting_text: >-
          The system (AatJMQP, for acidic amino acid transport) is encoded by
          an operon involving genes PP1071-PP1068.
