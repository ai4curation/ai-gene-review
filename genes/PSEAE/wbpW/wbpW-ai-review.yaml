    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      corrected_value: ECO:0000316
      corrected_label: genetic interaction evidence used in manual assertion (IGI)
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        wbpW (PA5452) involved_in GO:0009298 GDP-mannose biosynthetic process is
        coded IDA from PMID:9781879 (Rocchetta et al. 1998). The abstract states
        that the activity was confirmed by complementing E. coli PMI and GMP
        mutants with wbpW and restoring K30 capsule, and describes no assay of
        WbpW protein. Heterologous complementation is IGI (or IMP), not IDA.
