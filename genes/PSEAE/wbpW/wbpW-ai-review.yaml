suggested_questions:
- question: >-
    Did Rocchetta et al. (PMID:9781879) assay PMI or GMP activity with purified
    or overexpressed WbpW, or does the GDP-mannose biosynthesis row rest only on
    E. coli complementation (IGI rather than IDA)?
suggested_experiments:
- description: >-
    Purify WbpW and measure PMI and GMP kinetics alongside AlgA and PslB, to
    test whether the three paralogues differ in substrate preference or
    regulation in a way that explains their pathway-specific roles.
