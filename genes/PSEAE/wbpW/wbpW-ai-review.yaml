gene_symbol: wbpW
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WbpW (PA5452) is a bifunctional phosphomannose isomerase / GDP-mannose
  pyrophosphorylase (type II PMI family) encoded at the 5' end of the A-band
  (common polysaccharide antigen) O-antigen gene cluster, next to gmd and rmd.
  It makes GDP-D-mannose, which Gmd and Rmd convert to GDP-D-rhamnose, the
  sugar donor for the D-rhamnan of A-band lipopolysaccharide. Its N-terminal
  nucleotidyltransferase domain converts mannose 1-phosphate and GTP to
  GDP-mannose, and its C-terminal cupin domain interconverts fructose
  6-phosphate and mannose 6-phosphate. wbpW complements E. coli PMI and GMP
  mutants, and wbpW mutants make little A-band. It is functionally redundant
  with its paralogue PslB: a pslB wbpW double mutant makes neither A-band LPS
  nor the Psl exopolysaccharide. A third paralogue, AlgA, serves alginate
  synthesis.
