- id: PMID:19659934
  title: Genetic and biochemical analyses of the Pseudomonas aeruginosa Psl exopolysaccharide
    reveal overlapping roles for polysaccharide synthesis enzymes in Psl and LPS production.
  findings:
  - statement: WbpW and PslB are redundant PMI/GMPs for A-band LPS.
    supporting_text: indicating that A-band LPS synthesis requires the redundant PMI/GMP activity of either
      PslB or WbpW to generate product.
  - statement: WbpW supplies GDP-D-mannose for Psl when PslB is absent.
    supporting_text: Together, the attachment, immunoblot, and ELISA data confirm that, in a pslB mutant,
      WbpW is the PMI/GMP responsible for generating the GDP-d-Man essential in the production of Psl.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read in the cache. PseudoCAP source for the O antigen
      biosynthetic process row; the data are deletion-mutant immunoblots and
      ELISA, so the IDA code should be IMP (defect recorded).
