- term:
    id: GO:0009298
    label: GDP-mannose biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:9781879
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row, seed of the PTN000283179 GDP-mannose biosynthesis IBD.
      Seed verdict SOUND (term), with an evidence-code problem.
    action: ACCEPT
    reason: >-
      The abstract shows that wbpW restores K30 capsule synthesis to E. coli
      PMI and GMP mutants, which supports participation in GDP-mannose
      synthesis. The abstract describes no assay with WbpW protein, so the
      evidence is heterologous genetic complementation (IGI) rather than IDA.
    supported_by:
    - reference_id: PMID:9781879
      supporting_text: To confirm the enzymatic activity of WbpW, Escherichia coli PMI and GMP mutants deficient
        in the K30 capsule were complemented with wbpW, and restoration of K30 capsule production was observed.
