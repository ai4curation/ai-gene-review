- term:
    id: GO:0016540
    label: protein autoprocessing
  evidence_type: IMP
  original_reference_id: PMID:1744034
  qualifier: involved_in
  review:
    summary: >-
      Pro-elastase is matured to the 33 kDa enzyme autocatalytically: in E.
      coli the wild-type protein appears as the correctly cleaved mature form,
      whereas the active-site His substitutions accumulate the 51 kDa
      pro-enzyme, which exogenous purified elastase can then process in trans.
    action: NEW
    reason: >-
      Here the gene product genuinely performs the step, which is the condition
      for a process term: the bond cleaved is its own (recorded by UniProt as
      SITE 197..198, "Cleavage; by autolysis") and the catalytic residue needed
      is its own active site. The claim is independent of the general
      proteolysis row and is absent from GOA.
    supported_by:
    - reference_id: PMID:1744034
      supporting_text: >-
        The amino-terminal sequence of the first 15 amino acid residues of this
        33-kDa elastase species was identical to that of the mature P.
        aeruginosa enzyme, suggesting that processing was autocatalytic.
    - reference_id: PMID:1744034
      supporting_text: >-
        The present results confirm that His-223 is essential for elastase
        activity and provide evidence for autoproteolytic processing of
        proelastase.
