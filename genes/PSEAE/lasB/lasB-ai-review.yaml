      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0043952
      confidence: PROBABLE
      explanation: >-
        PA3724 (LasB) is a Sec-exported cargo; it is not part of the Sec
        translocation machinery, and the cited evidence (removal of its signal
        peptide) is neither participation in the transport process nor direct
        evidence that the translocon used is Sec rather than Tat. Consider
        deleting the row. The identical row on PA2939 (PaAP) from the same
        reference has the same problem.
