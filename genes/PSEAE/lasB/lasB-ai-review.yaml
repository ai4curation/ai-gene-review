id: P14756
gene_symbol: lasB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  LasB (elastase B, pseudolysin, EC 3.4.24.26) is the most abundant secreted
  protease of P. aeruginosa and the founding Pseudomonas member of the M4
  thermolysin family of neutral zinc metalloendopeptidases. It is made as a
  498-residue pre-pro-protein: the signal peptide is removed during export
  across the inner membrane, the 174-residue propeptide is cleaved in the
  periplasm (largely autocatalytically, at the 197/198 bond), and the 33 kDa
  mature enzyme is secreted across the outer membrane by the Xcp type II
  secretion system. The catalytic domain has the thermolysin fold with one
  catalytic Zn(2+) (His337, His341, Glu361) and one structural Ca(2+), and His420
  as the proton donor; it is inhibited by phosphoramidon. Efficient production
  and processing of the mature enzyme require both zinc and calcium in the
  growth medium. Extracellularly it cleaves peptide bonds with a bulky
  hydrophobic residue in P1', degrading host elastin, collagen types III and IV,
  fibronectin, immunoglobulins and complement components, and it also matures
  other P. aeruginosa exoproteins, removing the propeptides of the
  chitin-binding protein CbpD and of the secreted aminopeptidase PaAP. It is a
  major virulence factor in acute and early chronic lung infection, and lasB
  mutants are also impaired in swarming and in biofilm formation.
