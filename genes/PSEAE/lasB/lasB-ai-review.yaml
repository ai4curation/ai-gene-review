- term:
    id: GO:0015628
    label: protein secretion by the type II secretion system
  evidence_type: IDA
  original_reference_id: PMID:9642203
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA from Braun et al. 1998. LasB does cross the outer membrane
      through the Xcp T2SS, but as cargo.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The biology is accepted (UniProt: secreted in an Xcp-dependent fashion),
      but a secreted substrate does none of the work of the secretion process;
      GO annotates the Xcp/Gsp machinery to this term, not its cargo. The fact
      belongs on the transporter side and, for LasB, in the extracellular-region
      rows above. Full text of PMID:9642203 was not available, so the precise
      experiment behind the row could not be checked and I do not REMOVE. The
      same pattern was recorded for the other Braun-et-al. cargo, PaAP
      (genes/PSEAE/lap).
    supported_by:
    - reference_id: file:PSEAE/lasB/lasB-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: >-
        Note=Secreted
    - reference_id: PMID:9642203
      supporting_text: >-
        We demonstrate that the propeptide and the mature elastase are both
        secreted but that the propeptide is degraded extracellularly.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0015628
      confidence: PROBABLE
      explanation: >-
        PA3724 (LasB) is a cargo of the Xcp type II secretion system, not a
        component of it. GO practice reserves "protein secretion by the type II
        secretion system" for the secretion machinery; the secreted substrate
        does not carry out the process. Consider deleting the row, or recording
        the cargo relationship on the Xcp proteins (has_input), and keeping the
        extracellular region CC on LasB. The identical row on PA2939 (PaAP),
        from the same reference, has the same problem.
- term:
    id: GO:0043952
