- id: PMID:1597429
  title: Efficient production and processing of elastase and LasA by Pseudomonas aeruginosa
    require zinc and calcium ions.
  findings:
  - statement: >-
      Proteolytic and elastolytic activity of P. aeruginosa supernatants
      requires both zinc and calcium in the medium and tracks with the
      appearance of the mature 33 kDa elastase; activity of the calcium-starved
      33 kDa enzyme is recovered by adding zinc to the assay.
    supporting_text: >-
      High levels of proteolytic and elastolytic activity were exhibited by all
      strains when cultured in the presence of both zinc and calcium, and this
      was associated with the production of mature 33-kDa elastase and 21-kDa
      LasA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Bacteriol 1992); abstract only in the cache. The
      abstract itself describes supernatant proteolytic activity attributed to
      the mature elastase and its metal dependence, which is what the PseudoCAP
      proteolysis IDA and the extracellular-region EXP row assert. It is
      nonetheless an activity-in-supernatant paper, not an assay on purified
      LasB; the definitive catalytic evidence is PMID:1899664 and PMID:1744034.
- id: PMID:3141383
  title: Synthesis, processing, and transport of Pseudomonas aeruginosa elastase.
  findings:
  - statement: >-
      Elastase is synthesised as a precursor, processed in the periplasm, and
      transported to the extracellular medium; expression responds to the
      metal content of the medium.
    supporting_text: >-
      Synthesis, processing, and transport of Pseudomonas aeruginosa elastase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Bacteriol 1988); abstract only in the cache, and the
      cached record carries little beyond the title, so the quote used is the
      title itself plus UniProt's citation of this paper for SUBCELLULAR
      LOCATION and PTM. Supports the secreted location but was not used for any
      functional claim here.
- id: PMID:9642203
  title: Secretion of elastinolytic enzymes and their propeptides by Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Both the mature elastase and its propeptide are secreted, the propeptide
      being degraded extracellularly; loss of extracellular proteolytic
      activity leaves LasA, LasD and a Streptomyces-aminopeptidase homologue
      unprocessed in the medium.
    supporting_text: >-
      We demonstrate that the propeptide and the mature elastase are both
      secreted but that the propeptide is degraded extracellularly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Bacteriol 1998, PMC107305); abstract only. Correctly
      cited for the extracellular location, but it is the source of two
      cargo-as-participant rows (GO:0015628, GO:0043952) that I judge to be
      over-annotations; the same rows exist on PaAP from the same paper.
- id: PMID:1744034
  title: Substitution of active-site His-223 in Pseudomonas aeruginosa elastase and
    expression of the mutated lasB alleles in Escherichia coli show evidence for autoproteolytic
    processing of proelastase.
  findings:
  - statement: >-
      His-223 of the mature chain (His420 of the precursor) is essential for
      proteolytic and elastolytic activity, and pro-elastase maturation is
      autocatalytic: the mutants accumulate the 51 kDa pro-enzyme, which
      exogenous purified elastase processes in trans.
    supporting_text: >-
      The present results confirm that His-223 is essential for elastase
      activity and provide evidence for autoproteolytic processing of
      proelastase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Bacteriol 1991); abstract only, but the abstract
      states the mutagenesis, the loss of activity and the in-trans processing,
      which is what is cited here. Not used by any existing GOA row.
- id: PMID:1899664
  title: Three-dimensional structure of the elastase of Pseudomonas aeruginosa at 1.5-A
    resolution.
  findings:
  - statement: >-
      The 1.5 A structure shows a thermolysin-like fold with one catalytic
      Zn(2+) and one Ca(2+); the active-site residues are nearly identical to
      thermolysin but the cleft is more open.
    supporting_text: >-
      The overall tertiary structure of the PAE molecule is similar to that of
      thermolysin, with which it shares 28% amino acid sequence identity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Biol Chem 1991; PDB 1EZM); abstract only. The source
      of UniProt's active-site, metal-binding and disulfide features. Not used
      by any existing GOA row, although it is the strongest evidence for the
      metalloendopeptidase claim.
- id: PMID:11533066
  title: A secreted aminopeptidase of Pseudomonas aeruginosa. Identification, primary
    structure, and relationship to other aminopeptidases.
  findings:
  - statement: >-
      Conversion of the secreted aminopeptidase AP56 to the active 28 kDa form
      depends on elastase, so LasB matures another secreted P. aeruginosa
      enzyme.
    supporting_text: >-
      Heating (70 degrees C) of the partially purified aminopeptidase
      preparations led to the conversion of AP(56) to a approximately 28-kDa
      protein (AP(28)) that retained enzyme activity, a reaction that depended
      on elastase (LasB).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Biol Chem 2001); abstract only. Cited for the
      physiological substrate range (processing of pro-PaAP), which UniProt also
      records; it supports the proteolysis claim rather than adding a term.
- id: PMID:18245294
  title: Swarming of Pseudomonas aeruginosa is a complex adaptation leading to increased
    production of virulence factors and antibiotic resistance.
  findings:
  - statement: >-
      lasB is induced under swarming conditions and lasB mutants are impaired
      in swarming and form about half as much biofilm; both phenotypes are
      complemented by a chromosomal lasB copy.
    supporting_text: >-
      Elastase LasB and PvdQ are essential for normal swarming behavior.
  - statement: >-
      The authors attribute the phenotypes to LasB secretion, noting that T2SS
      mutants behave similarly.
    supporting_text: >-
      Our results are consistent with the secretion of LasB by the type II
      secretion system, since mutants with defects in this secretion apparatus
      also exhibit strong swarming and biofilm defects ( 41 ).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached and PubMed-verified (J Bacteriol 2008). Correctly cited
      for the two IMP rows; the phenotypes are genuine but downstream of the
      secreted protease activity, hence KEEP_AS_NON_CORE.
- id: PMID:33510733
  title: Pseudomonas aeruginosa Elastase Contributes to the Establishment of Chronic
    Lung Colonization and Modulates the Immune Response in a Murine Model.
  findings:
  - statement: >-
      LasB is the most abundant P. aeruginosa protease, degrades extracellular
      matrix and complement components, and its deletion in an early-persistence
      clinical isolate reduces bacterial burden in a murine persistent-pneumonia
      model.
    supporting_text: >-
      The zinc metalloprotease elastase B (also called LasB or pseudolysin) is
      the most abundant protease in the P.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and PubMed-verified (Front Microbiol 2021). Supports the
      endopeptidase row and the virulence context; the paper explicitly calls
      LasB a zinc metalloprotease, which is why the row is refined to
      GO:0004222.
- id: PMID:30227935
  title: Anti-quorum sensing and antibiofilm potential of Alternaria alternata, a foliar
    endophyte of Carica papaya, evidenced by QS assays and in-silico analysis.
  findings:
  - statement: >-
      A fungal extract reduced quorum-sensing-dependent phenotypes of P.
      aeruginosa, including LasB elastase activity in culture supernatants.
    supporting_text: >-
      significant decrease in proteases activity such as LasA protease
      activity, staphylolytic activity, Las B elastase
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      PubMed-verified (Fungal Biol 2018); abstract only. The paper is about an
      inhibitory extract, and the LasB measurement is an indirect supernatant
      elastase assay in a quorum-sensing screen, so it is weak evidence for an
      IDA of endopeptidase activity even though the underlying claim is true.
core_functions:
- description: >-
    Secreted zinc-dependent thermolysin-type (M4) metalloendopeptidase. The
    mature 33 kDa enzyme hydrolyses internal peptide bonds with a bulky
    hydrophobic residue in P1', using a catalytic Zn(2+) held by His337, His341
    and Glu361 with His420 as proton donor and a structural Ca(2+); it degrades
    host elastin, collagen types III and IV, fibronectin, immunoglobulins and
    complement components, and matures other P. aeruginosa exoproteins
    (pro-CbpD, pro-PaAP).
  molecular_function:
    id: GO:0004222
    label: metalloendopeptidase activity
  directly_involved_in:
  - id: GO:0006508
    label: proteolysis
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:1899664
    supporting_text: >-
      Pseudomonas aeruginosa elastase (PAE) is a zinc metalloprotease with 301
      amino acids.
  - reference_id: PMID:1744034
    supporting_text: >-
      No proteolytic or elastolytic activities were detected in extracts of E.
      coli cells containing the lasB mutant alleles.
  - reference_id: PMID:1597429
    supporting_text: >-
      High levels of proteolytic and elastolytic activity were exhibited by all
      strains when cultured in the presence of both zinc and calcium, and this
      was associated with the production of mature 33-kDa elastase and 21-kDa
      LasA.
- description: >-
    Autocatalytic maturation of its own zymogen: pro-elastase cleaves the
    197/198 bond to release the 174-residue propeptide in the periplasm, which
    is required before the active enzyme is exported. Active-site substitutions
    block this step and leave the 51 kDa pro-enzyme, which mature elastase can
    then process in trans.
  molecular_function:
    id: GO:0004222
    label: metalloendopeptidase activity
  directly_involved_in:
  - id: GO:0016540
    label: protein autoprocessing
  supported_by:
  - reference_id: PMID:1744034
    supporting_text: >-
      The present results confirm that His-223 is essential for elastase
      activity and provide evidence for autoproteolytic processing of
      proelastase.
  - reference_id: PMID:9642203
    supporting_text: >-
      The signal sequence is cleaved off during transport across the inner
      membrane and, in the periplasm, proelastase is further processed.
suggested_questions:
- question: >-
    Is the swarming and biofilm requirement for lasB a consequence of any
    identified LasB substrate (for example a matrix or surface protein), or of
    the general loss of extracellular proteolysis?
- question: >-
    Should GO record cargo relationships for type II secretion substrates on the
    Xcp machinery (has_input) so that rows like GO:0015628 on LasB and PaAP can
    be retired without losing the information?
suggested_experiments:
- description: >-
    Compare a lasB deletion with a catalytically dead point mutant (His420
    substitution expressed from the chromosome) for swarming and biofilm
    formation, to separate loss of protease activity from loss of the
    (secreted) protein itself.
- description: >-
    Define the extracellular substrate repertoire of mature LasB by N-terminomics
    on wild-type versus delta-lasB supernatants and infected airway surface
    liquid, which would let the generic proteolysis annotation be replaced by
    substrate-specific statements.
