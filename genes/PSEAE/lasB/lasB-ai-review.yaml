  evidence_type: IDA
  original_reference_id: PMID:1597429
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA and the sole seed of the IBD at PTN002138658. Olson and
      Ohman measured proteolytic and elastolytic activity of culture
      supernatants as a function of zinc and calcium, correlating it with the
      appearance of the mature 33 kDa elastase.
    action: ACCEPT
    reason: >-
      The claim is the gene product's own activity, and it is correct beyond
      doubt for LasB (EC 3.4.24.26, thermolysin-like active site, 19
      structures, phosphoramidon-inhibited). The specific reference is a
      supernatant activity assay rather than an assay on purified LasB, which
      makes it a weaker choice of evidence than PMID:1899664 or PMID:1744034,
      but the attribution to elastase is supported in the same experiment by
      the zinc-dependent recovery of activity from the 33 kDa species, and the
      curator read the full text. So the seed is sound and the IBD is
      justified.
    supported_by:
    - reference_id: PMID:1597429
      supporting_text: >-
        High levels of proteolytic and elastolytic activity were exhibited by
        all strains when cultured in the presence of both zinc and calcium, and
        this was associated with the production of mature 33-kDa elastase and
        21-kDa LasA.
    - reference_id: PMID:1597429
      supporting_text: >-
        Proteolytic activity could be recovered from 33-kDa elastase produced in
        the presence of calcium by inclusion of zinc in the enzymatic assay.
