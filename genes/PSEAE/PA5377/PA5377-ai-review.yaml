- id: PMID:19919675
  title: The ATP-binding cassette transporter Cbc (choline/betaine/carnitine) recruits multiple
    substrate-binding proteins with strong specificity for distinct quaternary ammonium compounds.
  findings:
  - statement: PA14 transposon mutants in each cbc gene, including PA5377, fail to grow on choline, betaine
      and carnitine as sole carbon sources.
    supporting_text: The PA5376::tn, PA5377::tn and PA5378::tn mutants all failed to grow on choline (Fig.
      3A) and betaine (Fig. S2) as sole C sources
  - statement: The CbcWV core transporter mediates carnitine uptake only with the separately encoded SBP
      CaiX (PA5388). Substrate specificity resides in the SBPs.
    supporting_text: These findings provide compelling evidence that Psyr_2916 and PA5388, hereafter referred
      to as CaiX, enable Cbc-mediated carnitine uptake in P. syringae and P. aeruginosa respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read in the cache. The primary characterisation of CbcXWV, including PA5377::tn
      mutants and PAO1 cbcXWV uptake in E. coli and P. syringae. It supports transport rows. It does not
      support the catabolic-process rows (growth phenotype only) or the amine transporter term (wrong
      branch).
- id: PMID:21478341
  title: Roles of three transporters, CbcXWV, BetT1, and BetT3, in Pseudomonas aeruginosa choline uptake for
    catabolism.
  full_text_unavailable: true
  findings:
  - statement: CbcXWV is one of three choline transporters able to support growth on choline. Its
      expression is induced by GbdR and glycine betaine.
    supporting_text: BetT3 and CbcXWV, but not BetT1, were sufficient to support growth on choline.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Abstract only (PMC full text not retrievable via the PubMed MCP). It supports choline uptake.
      It is cited by PseudoCAP for carnitine transmembrane transport and glycine betaine transport, which the
      abstract does not address, so the carnitine row may be miscited (CHECK defect filed).
