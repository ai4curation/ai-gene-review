    summary: PAINT IBA from PTN000766131, seeded by PA5377 (PseudoCAP IDA, PMID:19919675) and E. coli ProW
      (P14176).
    action: MODIFY
    reason: The transport is real, but the term is on the wrong branch. GO defines amine transmembrane
      transporter activity for weakly basic amino or substituted-amino compounds. Choline, glycine betaine
      and carnitine (and ProW's glycine betaine and proline betaine) are quaternary ammonium compounds,
      which GO places under GO:0015651 and GO:0015418, not under amine transporter activity. The right MF
      for the clade is ABC-type quaternary ammonium compound transporting activity. For a permease subunit
      this is a complex-level activity, recorded as contributes_to in core_functions.
