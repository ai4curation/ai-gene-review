suggested_questions:
- question: Should the PTN000766131 IBDs be revised? The amine transporter term is on the wrong branch for
    quaternary ammonium substrates, and carnitine specificity depends on the trans-encoded CaiX SBP rather
    than on the permease clade.
- question: Does PMID:21478341 contain carnitine or glycine betaine uptake data for CbcXWV, or should the
    PseudoCAP carnitine row be re-keyed to PMID:19919675?
- question: What sulfur compound underlies the PseudoCAP GO:1901682 IDA from PMID:23763788 (for example
    choline-O-sulfate), and was PAO1 cbcXWV used in that study?
suggested_experiments:
- description: Test whether CbcWV transports choline-O-sulfate or dimethylsulfoniopropionate by
    radiolabelled uptake in a QAC transporter-deficient host expressing PAO1 cbcWV with each of the SBPs
    (CbcX, BetX, CaiX), to resolve the sulfur compound transporter claim and to map SBP-dependent
    specificity.
