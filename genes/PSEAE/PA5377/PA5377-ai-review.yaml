- term:
    id: GO:0015226
    label: carnitine transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000766131
  - UniProtKB:Q9HTI7
  review:
    summary: PAINT IBA from PTN000766131, whose sole seed is PA5377 (PseudoCAP IDA, PMID:19919675).
    action: MODIFY
    reason: Carnitine uptake through Cbc in P. aeruginosa is real, but it depends on the separately encoded
      carnitine-specific SBP CaiX (PA5388), not on the permease. Strains with a 98-100% identical Cbc core
      but no CaiX (P. syringae DC3000) do not transport carnitine, and E. coli ProW in the same node is not a
      carnitine transporter. A carnitine-specific MF is therefore over-specific both for the permease and for
      the clade. The activity of CbcW is best captured as contributing to ABC-type quaternary ammonium
      compound transport, with specificity set by the partner SBP.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000766131
        source_label: PTN000766131
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The carnitine specificity of the seed depends on the trans-encoded CaiX SBP, which most
          clade members need not have.
      - source_id: UniProtKB:Q9HTI7
        source_label: PA5377
        source_status: SUPPORTS_TRANSFER
        comment: The target's own IDA is the sole seed, which is expected, not circular. It is true for PA5377
          only in combination with CaiX.
    proposed_replacement_terms:
    - id: GO:0015418
      label: ABC-type quaternary ammonium compound transporting activity
    supported_by:
    - reference_id: PMID:19919675
      supporting_text: A plasmid expressing only the core transporter, pNcbcWV, was constructed by deleting
        cbcX from pNcb-cXWV; it restored carnitine uptake to BT (Fig. 5), consistent with an association
        between the native CaiX SBP and the core transporter.
    - reference_id: PMID:19919675
      supporting_text: yet B728a transports carnitine and DC3000 does not
    source_defects:
    - defect_type: OTHER
      resource: GO_CENTRAL
      record: PANTHER:PTN000766131
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0015226
      cause: OTHER
      confidence: PROBABLE
      explanation: The IBD for GO:0015226 carnitine transmembrane transporter activity at PTN000766131
        (PTHR47737, about 13 leaf IBAs) rests only on P. aeruginosa PA5377/CbcW (Q9HTI7). In PMID:19919675,
        carnitine transport by CbcWV requires the separately encoded SBP CaiX (PA5388). The 98-100% identical
        P. syringae DC3000 Cbc core does not transport carnitine because DC3000 lacks caiX, and E. coli ProW,
