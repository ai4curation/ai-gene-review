taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA5377 (CbcW) is the integral inner-membrane permease subunit of the Cbc
  (choline/betaine/carnitine) ABC importer, encoded in the cbcXWV operon (PA5378-PA5376) with the
  substrate-binding protein CbcX and the ATPase CbcV. It has six transmembrane helices and belongs to the
  ChoW/ProW family of binding protein-dependent permeases. The CbcWV core transporter works with several
  separately encoded periplasmic binding proteins that set its substrate specificity. With CbcX it takes up
  choline (and betaine), with BetX glycine betaine, and with CaiX L-carnitine and short-chain
  acylcarnitines. Cbc imports these quaternary ammonium compounds mainly for use as carbon and nitrogen
  sources. Transposon mutants in PA5377 cannot grow on choline, glycine betaine or carnitine as sole carbon
  sources. Expression of cbcXWV is induced by glycine betaine through the activator GbdR.
