core_functions:
- description: Integral membrane permease (TMD) subunit CbcW of the CbcWV core ABC importer. With the ATPase
    CbcV and an interchangeable periplasmic substrate-binding protein (CbcX for choline, BetX for glycine
    betaine, CaiX for carnitine and short-chain acylcarnitines), it translocates quaternary ammonium compounds
    across the inner membrane, mainly for use as carbon and nitrogen sources.
  supported_by:
  - reference_id: PMID:19919675
    supporting_text: The PA5376::tn, PA5377::tn and PA5378::tn mutants all failed to grow on choline (Fig.
      3A) and betaine (Fig. S2) as sole C sources
  - reference_id: PMID:19919675
    supporting_text: A plasmid expressing only the core transporter, pNcbcWV, was constructed by deleting cbcX
      from pNcb-cXWV; it restored carnitine uptake to BT (Fig. 5), consistent with an association between the
      native CaiX SBP and the core transporter.
  - reference_id: PMID:29517479
    supporting_text: Short-chain acylcarnitines are imported by the ABC transporter CaiX-CbcWV.
