  label: Pseudomonas aeruginosa PAO1
description: >-
  fabD (PA2968) encodes malonyl-CoA:acyl carrier protein transacylase (MCAT, FabD), the enzyme that
  transfers the malonyl group of malonyl-CoA to the phosphopantetheine arm of holo-ACP. Malonyl-ACP is the
  two-carbon extender substrate for every elongation cycle of type II fatty acid synthesis and for FabH
  initiation, so FabD is an essential entry point of the pathway. In P. aeruginosa fabD lies in the
  plsX-fabD-fabG-acpP-fabF cluster, which lacks fabH. His6-tagged FabD, purified together with native
  P. aeruginosa ACP, has malonyl-CoA:ACP transacylase activity in vitro, and a site-directed chromosomal
  W258Q allele gives a temperature-sensitive mutant, consistent with the gene being essential. FabD is a
  soluble cytoplasmic enzyme with the catalytic serine and histidine of the FabD acyltransferase fold.
