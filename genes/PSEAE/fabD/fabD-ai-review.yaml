suggested_questions:
- question: >-
    Does FabD also supply malonyl-ACP to the P. aeruginosa pathways that branch from FAS II (for example
    the 3-hydroxyacyl precursors of rhamnolipids and the acyl chains of acyl-homoserine lactones), and is
    there any FabD paralog that can substitute at the restrictive temperature?
suggested_experiments:
- description: >-
    Measure fatty acid, rhamnolipid and AHL output in the fabD(W258Q) temperature-sensitive strain after
    a shift to the restrictive temperature.
