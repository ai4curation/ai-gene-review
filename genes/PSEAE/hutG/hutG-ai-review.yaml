id: Q9HU92
gene_symbol: hutG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  HutG (PA5091) of Pseudomonas aeruginosa is a monomeric N-formylglutamate
  deformylase (EC 3.5.1.68) of the N-formylglutamate amidohydrolase family. It
  hydrolyses N-formyl-L-glutamate, the product of the HutF
  formimidoylglutamate deiminase, to L-glutamate and formate, completing the
  two-step HutF/HutG terminal branch of histidine utilization encoded in the
  hut operon. P. aeruginosa also carries a one-step formimidoylglutamase
  branch (HutE, PA3175), and the two terminal branches operate in parallel.
existing_annotations:
- term:
    id: GO:0006548
    label: L-histidine catabolic process
  evidence_type: IMP
  original_reference_id: PMID:4290562
  qualifier: involved_in
  review:
    summary: >-
      HutG performs the final hydrolytic step of the HutF/HutG branch from
      formiminoglutamate to glutamate in P. aeruginosa histidine utilization.
    action: ACCEPT
    reason: >-
      HutG itself catalyses a step of the pathway, releasing L-glutamate from
      N-formyl-L-glutamate, so this is participation. The cited 1967 study
      characterized induction of the histidine-degrading enzymes, including
      the capacity to degrade formiminoglutamate, and mutants of the pathway;
      the cached record is abstract-only, so the gene-level attribution is
      deferred to the curator, and it is consistent with the later
      biochemical assignment of PA5091 to this branch (PMID:16475788) and the
      genetic dissection of the two terminal branches (PMID:22225844).
    supported_by:
    - reference_id: PMID:4290562
      supporting_text: >-
        Histidine ammonia lyase (histidase), urocanase, and the capacity to
        degrade formiminoglutamate, which are respectively involved in steps
        I, II, and IV in the catabolism of histidine
    - reference_id: PMID:16475788
      supporting_text: "while Pa5091 catalyzed the hydrolysis of N-formyl-L-glutamate to formate and L-glutamate"
