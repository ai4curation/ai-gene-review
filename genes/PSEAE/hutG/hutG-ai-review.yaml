- id: PMID:22225844
  title: The origin and ecological significance of multiple branches for histidine
    utilization in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: >-
      P. aeruginosa PAO1 has two terminal branches from formiminoglutamate to
      glutamate (HutFG and HutE); either branch suffices for growth, and the
      branches differ in fitness under some conditions.
    supporting_text: "Genetic analysis revealed that the four-step route is dispensable as long as the five-step route is present (and vice versa)."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genetic dissection of the parallel terminal branches; abstract cached.
