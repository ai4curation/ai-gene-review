suggested_questions:
- question: >-
    Under which growth conditions does P. aeruginosa route formiminoglutamate
    through HutF/HutG rather than the HutE formimidoylglutamase, and how is
    flux partitioned between the two branches?
suggested_experiments:
- description: >-
    Measure isotopic flux from labelled histidine into formate versus
    formamide in wild type, hutFG and hutE deletion strains under carbon- and
    nitrogen-limited conditions.
