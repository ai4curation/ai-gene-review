  label: Pseudomonas aeruginosa PAO1
description: PA0508 encodes FadE2, a homodimeric FAD-dependent acyl-CoA dehydrogenase of Pseudomonas aeruginosa
  PAO1. Purified full-length protein oxidizes C4, C6 and C8 acyl-CoAs; no activity was detected on C16
  or C18 under the reported conditions. The enzyme supplies fatty-acyl-CoA dehydrogenation chemistry used
  in beta-oxidation. Physiological pathway evidence includes functional counterparts in PA14, while the
  measured catalytic and structural properties are from PAO1-derived recombinant proteins. The physiological
  electron acceptor and any membrane-associated relay remain unresolved.
