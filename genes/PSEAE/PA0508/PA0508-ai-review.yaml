  review:
    action: NEW
    summary: The PAO1 enzyme performs acyl-CoA dehydrogenation within fatty acid beta-oxidation.
    reason: Direct PAO1 recombinant catalysis establishes the chemical work; the primary PA14 functional-counterpart
      deletions support its beta-oxidation context. Native PAO1 fatty-acid growth or flux was not measured
      in the reported experiments, so this is an explicit integrative inference, not PAO1 IMP. Same-role
      QuickGO comparators E. coli Q47146 and LT2 Q8ZRJ7 carry this process or its descendant, and the
      target has no existing overlapping BP or GO-CAM index match. Participation does not claim this individual
      enzyme completes oxidation. No virulence process is inferred from Galleria necessity.
    supported_by:
    - reference_id: PMID:40057486
      supporting_text: purified FadE1 exhibited dehydrogenase activity against both long-chain (C16, C18)
        and medium-chain (C8, and to a low extent, also C6) substrates with a preference for the longer
        chain acyl-CoAs, whereas FadE2 was active against only the medium-chain substrates
    - reference_id: PMID:40057486
      supporting_text: To investigate the role of fadE1 and fadE2 in fatty acid catabolism further, we
        generated defined deletion mutants in P. aeruginosa PA14.
    - reference_id: PMID:40057486
      supporting_text: Recombinant plasmids for protein expression were made by inserting the full-length
