- id: PMID:24376018
  title: Subtilase SprP exerts pleiotropic effects in Pseudomonas aeruginosa.
  findings:
  - statement: Catalytic Ser499 is required for protease activity.
    supporting_text: >-
      SprP variant S499A which had the catalytic serine replaced by alanine also did not show protease
      activity
  - statement: >-
      Deletion of sprP abolishes all three motility types and increases biofilm formation.
    supporting_text: >-
      Examination of P. aeruginosa ΔsprP for its swimming, swarming, and twitching motility revealed that
      all three types of motility were virtually abolished
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Source of the IDA peptidase row and the IMP motility, biofilm and secondary metabolite
      rows. The phenotypes are those of a deletion mutant with 218 genes changed in the transcriptome;
      the mechanism linking the protease to each phenotype is not established.
- id: PMID:26175208
  title: >-
    Functional expression, purification, and biochemical properties of subtilase SprP from Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      Purified SprP is a serine protease hydrolysing casein, inhibited by AEBSF and TPCK.
    supporting_text: Our results confirm the classification of SprP as a serine protease
  - statement: SprP is autocatalytically activated.
    supporting_text: SprP is autocatalytically activated by proteolysis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA source for GO:0004252 and seed of the PTN002459139 IBD. Full text read: SprP-HlyA1
      secreted from E. coli and purified; casein hydrolysis, inhibitor profile (AEBSF, TPCK inhibit; E-64,
      pepstatin A, EDTA do not), temperature and pH optima. Directly supports serine-type endopeptidase
      activity.
