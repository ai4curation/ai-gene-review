  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1242 encodes SprP, one of the two subtilisin-like (peptidase S8) serine proteases of Pseudomonas aeruginosa
  PAO1. The 590-residue precursor has an N-terminal signal peptide, a Pseudomonas-specific domain of unknown
  function and a C-terminal peptidase S8 domain with an unusual Glu262/His299/Ser499 catalytic triad.
  Recombinant SprP is autocatalytically processed to an active form of about 26 kDa that hydrolyses casein
  and the subtilisin substrate Suc-AAPF-pNA, is inhibited by AEBSF and TPCK and does not need calcium;
  the S499A variant is inactive. Deletion of sprP has pleiotropic effects, with altered expression of
  about 200 genes, abolished swimming, swarming and twitching motility, increased cell aggregation, biofilm
  formation and pyoverdine production, and reduced anaerobic growth. sprP transcription rises at 43 C,
  suggesting a role in the heat shock response. Its natural substrates are unknown.
