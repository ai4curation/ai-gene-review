  label: Pseudomonas aeruginosa PAO1
description: >-
  FolP (PA4750) is the dihydropteroate synthase (EC 2.5.1.15) of Pseudomonas aeruginosa. It condenses
  4-aminobenzoate with 6-hydroxymethyl-7,8-dihydropterin diphosphate to form 7,8-dihydropteroate, the
  precursor of dihydrofolate, in the de novo tetrahydrofolate biosynthesis pathway. It belongs to the
  DHPS family (pterin-binding domain, TIGR01496) and is a soluble cytoplasmic enzyme; in bacteria this
  enzyme is the target of the sulfonamide antibiotics. Its activity has not been studied on the P. aeruginosa
  protein itself; the assignment rests on strong family conservation.
