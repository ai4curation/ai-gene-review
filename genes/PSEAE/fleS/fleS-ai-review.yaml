taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FleS (PA1098) is the sensor histidine kinase of the FleS-FleR two-component system of Pseudomonas aeruginosa,
  encoded in the fleSR operon upstream of the fliE flagellar gene. It is a 402-residue protein with an
  N-terminal PAS domain and a C-terminal HisKA/HATPase kinase core with the conserved phosphoacceptor
  histidine (His191). Its cognate response regulator FleR is a sigma-54 enhancer-binding protein; FleSR
  sits in the middle tier of the FleQ-led flagellar transcription hierarchy and is required for flagellar
  synthesis, motility and adhesion to mucin.
