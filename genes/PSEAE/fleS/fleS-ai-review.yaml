- id: PMID:7591148
  title: >-
    Cloning and phenotypic characterization of fleS and fleR, new response regulators of Pseudomonas aeruginosa
    which regulate motility and adhesion to mucin.
  findings:
  - statement: >-
      fleS was identified by homology to sensor histidine kinases; it lies with fleR in a putative operon
      upstream of fliE.
    supporting_text: >-
      FleS has a predicted molecular mass of 43.87 kDa and shows strong homology to histidine kinases
      which in other two-component systems have been shown to be sensor proteins
  - statement: >-
      A fleR mutant is nonmotile, nonadhesive and lacks flagellin; complementation restores motility.
    supporting_text: >-
      A nonpiliated mutant of P. aeruginosa PAK containing a gentamicin cassette in fleR is nonmotile
      and nonadhesive
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: "Abstract only (the PMC record PMC173697 is a scanned article with no text via the\n\
      \   PubMed MCP). The abstract supports FleS as the kinase partner of FleR by homology and genetics\
      \ on fleR; it\n   does not list a direct assay on FleS, so the PseudoCAP IDA code is queried (PROBABLE)."
