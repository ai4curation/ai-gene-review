id: Q9I2T1
gene_symbol: gloB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  gloB (PA1813) of Pseudomonas aeruginosa PAO1 encodes the GloB-type glyoxalase II (hydroxyacylglutathione
  hydrolase, EC 3.1.2.6), a metallo-beta-lactamase-fold thiolesterase predicted to carry a binuclear zinc
  site. It hydrolyses (R)-S-lactoylglutathione, made by glyoxalase I, to D-lactate and glutathione, completing
  glutathione-dependent methylglyoxal detoxification. Its function is inferred from orthology to E. coli
  GloB; it has not been assayed directly.
