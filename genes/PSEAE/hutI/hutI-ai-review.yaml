core_functions:
- description: >-
    Cytoplasmic zinc/iron-dependent amidohydrolase-family enzyme that hydrolyses
    4-imidazolone-5-propanoate to N-formimino-L-glutamate, the third step of
    histidine utilization, shared by the four-step and five-step FIGLU branches
    of P. aeruginosa. The assignment rests on HAMAP/TIGRFAM family membership,
    conserved active-site residues, homolog structures and hut operon context,
    not on direct study of PA5092.
