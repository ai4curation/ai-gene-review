  title: Formation and operation of the histidine-degrading pathway in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      Histidase, urocanase and FIGLU-degrading activity (steps I, II and IV) are
      induced by urocanate and subject to catabolite repression in P. aeruginosa;
      step III (imidazolonepropionase) is not mentioned in the abstract.
    supporting_text: >-
      Histidine ammonia lyase (histidase), urocanase, and the capacity to degrade
      formiminoglutamate, which are respectively involved in steps I, II, and IV in
      the catabolism of histidine
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Right paper (PMID, title and organism verified via PubMed). The abstract does
      not visibly support the PseudoCAP IMP rows for hutI: it covers steps I, II and
      IV, not imidazolonepropionase, and as a 1967 study it cannot identify a PA5092
      mutation. The full text (scanned PMC276695) could not be retrieved (rechecked
      2026-10-29), so a passing step III measurement cannot be excluded and whether
      the paper supports the rows is unverified.
  full_text_unavailable: true
- id: PMID:16990261
  title: A catalytic mechanism revealed by the crystal structures of the imidazolonepropionase
    from Bacillus subtilis.
  findings:
  - statement: >-
      B. subtilis HutI is a TIM-barrel metallo-dependent hydrolase with an active-site
      zinc that hydrolyses 4-imidazolone-5-propionate to FIGLU.
    supporting_text: >-
      X-ray fluorescence scan analysis confirmed that the bound metal ion was a
      zinc ion.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Structural characterization of a HutI homolog; supports family function and zinc cofactor.
- id: PMID:16475788
  title: 'Annotating enzymes of unknown function: N-formimino-L-glutamate deiminase
    is a member of the amidohydrolase superfamily.'
  findings:
  - statement: >-
      In P. aeruginosa, HutH, HutU and HutI convert histidine to FIGLU; PA5106 (HutF)
      and PA5091 (HutG) and PA3175 (HutE) degrade FIGLU.
    supporting_text: >-
      The first three steps for the degradation of histidine include the action
      of HutH, HutU, and HutI to convert L-histidine to N-formimino-L-glutamate.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: P. aeruginosa hut pathway biochemistry (downstream enzymes characterized; HutI step stated, not assayed).
