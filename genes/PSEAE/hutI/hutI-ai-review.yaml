  review:
    summary: >-
      PseudoCAP IMP; sole seed of the PTN000505272 L-histidine catabolic process
      IBD (52 leaf IBAs, 50 taxa). Lessie and Neidhardt (1967) studied induction
      and repression of the P. aeruginosa histidine-degrading enzymes using
      urocanase-deficient, auxotrophic and repression mutants.
    action: ACCEPT
    reason: >-
      The claim is correct, and it is accepted on independent evidence (HutI
      catalyses step III; HAMAP family; hut operon). The abstract of the cited
      paper does not visibly support it for this gene, though. It names the
      activities studied as steps I, II and IV (histidase, urocanase, FIGLU
      degradation), mentions neither step III nor a step III mutant, and in 1967 no
      mutation could be assigned to PA5092. The full text (scanned PMC276695) could not be
      retrieved, so a passing step III measurement cannot be ruled out. The
      reference is therefore flagged for checking rather than declared wrong.
    supported_by:
