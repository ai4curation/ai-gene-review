suggested_questions:
- question: >-
    Does the full text of Lessie and Neidhardt 1967 (PMID:4290562) report any
    imidazolonepropionase (step III) measurement or step III mutant? If not, the
    PseudoCAP IMP rows on PA5092, the sole seeds of the PTN000505272 IBDs, should be
    re-keyed or withdrawn.
- question: >-
    Is there an experimentally characterized HutI or AMDHD1 (enzyme assay or
    genetically defined mutant) that PAINT could use to re-anchor PTN000505272?
suggested_experiments:
- description: >-
    Construct a clean PAO1 hutI (PA5092) deletion, test growth on histidine and on
    urocanate as sole carbon and nitrogen source, and measure accumulation of
    imidazolonepropionate or its breakdown products, with complementation. In
    parallel, assay purified PA5092 for imidazolonepropionase activity and metal
    dependence (Zn versus Fe).
