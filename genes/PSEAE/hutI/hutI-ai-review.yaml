gene_symbol: hutI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  hutI (PA5092) encodes imidazolonepropionase (imidazolone-5-propionate
  hydrolase, EC 3.5.2.7) of Pseudomonas aeruginosa. It is a cytoplasmic member
  of the metallo-dependent (amidohydrolase) hydrolase superfamily, HutI family,
  with a TIM-barrel catalytic domain that binds one zinc or iron ion. It catalyses
  the third step of the universal histidine utilization (hut) pathway: hydrolytic
  ring opening of 4-imidazolone-5-propanoate, the product of urocanase, to
  N-formimino-L-glutamate (FIGLU). In P. aeruginosa, FIGLU is then converted to
  glutamate by either the four-step (HutE) or the five-step (HutF/HutG) branch.
  hutI lies in the HutC-repressed, urocanate-inducible hutU-hutG operon, and
  histidine catabolism lets the bacterium use histidine as a carbon and nitrogen
  source. In P. aeruginosa itself, its function rests on homology, family
  signatures and operon context: no direct biochemical or genetic study of PA5092
  has been reported.
