  label: Pseudomonas aeruginosa PAO1
description: >-
  Azurin (azu, PA4922) is a small periplasmic type 1 (blue) copper protein of the
  cupredoxin family. Its single copper ion is held in a beta-barrel by Gly45, His46,
  Cys112, His117 and Met121 (mature numbering) and cycles between Cu(II) and Cu(I),
  making azurin a soluble redox shuttle that exchanges electrons with cytochrome c551 and
  respiratory oxidoreductases. In vivo it is not required for denitrification; its
  expression rises in stationary phase and it has been linked to oxidative stress
  tolerance. Azurin is also secreted by the H2 type VI secretion system and, outside the
  cell, binds copper and delivers it to the outer-membrane receptor OprC, aiding copper
  acquisition. It is one of the most studied model proteins for biological electron
  transfer.
