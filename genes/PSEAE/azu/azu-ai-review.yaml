suggested_questions:
- question: >-
    Which periplasmic partners does azurin exchange electrons with in vivo, given that
    cytochrome c551 rather than azurin feeds nitrite reductase?
- question: >-
    Should the T6SS-dependent copper delivery to OprC be captured as a process annotation
    (e.g. copper ion import), given that azurin supplies the copper but OprC transports it?
