- id: PMID:14758526
  title: Methionine-121 coordination determines metal specificity in unfolded Pseudomonas
    aeruginosa azurin.
  findings:
  - statement: Azurin binds copper very tightly.
    supporting_text: Pseudomonas aeruginosa azurin binds copper so tightly that it remains bound even upon polypeptide unfolding.
  - statement: Zinc can replace copper in vitro without structural change.
    supporting_text: Copper can be substituted with zinc without change in protein structure
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP copper ion binding row (PTN002212874 seed) and the IMP
      zinc ion binding row. Abstract only. ITC and spectroscopy on WT and Met121Ala azurin
      and model peptides; the copper binding evidence is direct.
- id: PMID:19299503
  title: Metal-binding loop length and not sequence dictates structure.
  findings:
  - statement: Cupredoxins act as monomeric redox shuttles; a loop mutant forms an unnatural swap dimer.
    supporting_text: The mutant with 3 alanine residues between the ligands forms a strand-swapped dimer in the crystal structure
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. IntAct source for one identical protein binding IPI.
- id: PMID:21352498
  title: Probing the reactivity of different forms of azurin by flavin photoreduction.
  findings:
  - statement: The H117G variant is reduced more slowly by photoreduced flavins than the WT protein.
    supporting_text: The reactivity of the H117G variant in the absence of external ligands appears to be 2.5-fold lower than the WT reactivity
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Abstract only. IntAct source for one identical protein binding IPI; the abstract does
      not describe self-association, so the basis (probably the 3N2J crystal) is unseen.
- id: PMID:23911566
  title: 'Isomorphic deactivation of a Pseudomonas aeruginosa oxidoreductase: The
    crystal structure of Ag(I) metallated azurin at 1.7 Å.'
  findings:
  - statement: Silver binds at the copper site of apo-azurin, giving a redox-inert protein.
    supporting_text: X-ray crystallography of the silver-modified protein reveals that silver binds to azurin at the traditional copper mediated active site with nearly identical geometry.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. PseudoCAP source for the IDA transition metal ion binding row (silver).
- id: PMID:31790504
  title: A Pseudomonas aeruginosa type VI secretion system regulated by CueR facilitates
    copper acquisition.
  findings:
  - statement: Secreted azurin binds OprC and delivers copper to it.
    supporting_text: Secreted Azu acquires extracellular Cu2+ and delivers its load via direct interaction with OprC
  reference_review:
    relevance: HIGH
