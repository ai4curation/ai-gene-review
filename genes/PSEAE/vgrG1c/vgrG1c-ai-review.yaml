suggested_questions:
- question: >-
    Are VgrG1a- and VgrG1c-capped apparatuses assembled on the same baseplates,
    or does the cell build distinct machines with distinct cargo?
suggested_experiments:
- description: >-
    Image fluorescently tagged VgrG1a and VgrG1c alongside a tagged sheath in
    single cells, and score whether firing events contain one spike protein or
    both.
