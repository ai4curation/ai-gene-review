taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  VgrG1c (PA2685, originally called VgrG4) is a valine-glycine repeat G (VgrG)
  spike protein of the H1 type VI secretion system (H1-T6SS) of Pseudomonas
  aeruginosa. Its gene lies outside the HSI-I cluster but is co-regulated with
  it through the RetS/Gac-Rsm pathway. VgrG1c forms homomultimers, is exported
  by the H1-T6SS in a ClpV1-dependent manner, and is required, redundantly
  with VgrG1a, for secretion of Hcp1; VgrG proteins are also needed for export
  of other H1-T6SS substrates, and VgrG1c carries a specific subset of them
  (the Rhs protein RhsP1/Tse5).
