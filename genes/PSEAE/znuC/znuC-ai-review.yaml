id: Q9HT73
gene_symbol: znuC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ZnuC is the ATP-binding, energy-coupling subunit of the high-affinity ZnuABC
  zinc importer of Pseudomonas aeruginosa PAO1. The transporter is an ABC
  importer of the metal type: a periplasmic solute-binding protein (ZnuA)
  delivers Zn(2+) to an inner-membrane permease (ZnuB), and two copies of ZnuC
  hydrolyse ATP on the cytoplasmic face to drive translocation into the
  cytosol. ZnuC itself is a 269-residue peripheral inner-membrane protein with
  a single ABC ATPase domain and a Walker A motif, and it carries no
  transmembrane segment. The genes are organised in a zur-znuC-znuB operon,
  which is repressed by the zinc-responsive Fur-family regulator Zur (Np20)
  when zinc is plentiful and derepressed under zinc limitation; znuA is
  transcribed separately and is also Zur-repressed. Loss of znuC, znuB or znuA
  slows growth under metal chelation, although P. aeruginosa has additional,
  partly redundant routes for zinc acquisition, and the system contributes to
  the activity of secreted zinc-dependent proteases and to dissemination during
  infection.
