- term:
    id: GO:0010043
    label: response to zinc ion
  evidence_type: IMP
  original_reference_id: PMID:24086521
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP, the sole seed of the PTN001952271 IBD. Ellison et al.
      deleted the putative znuA, znuB and znuC genes and found reduced growth
      in LB supplemented with 0.5 mM EDTA, with no general growth defect in
      plain LB. The paper's own focus is the regulator Np20/Zur.
    action: MODIFY
    reason: >-
      The mutant phenotype supports a role in zinc acquisition, which is zinc
      import across the inner membrane; "response to zinc ion" attributes the
      sensing step to the transporter subunit. Note also that the chelator used
      is EDTA, which is not zinc-specific, so the phenotype alone does not pin
      the metal; the metal identity comes from the Zur-regulated operon, the
      E. coli orthology and the curated EC number.
    proposed_replacement_terms:
    - id: GO:0071578
      label: zinc ion import across plasma membrane
    supported_by:
    - reference_id: PMID:24086521
      supporting_text: >-
        the inability to express the putative znuA, znuB, or znuC genes
        resulted in decreased growth at 18 hours as compared wild-type strain
        PAO1 when the strains were grown in LB media supplemented with 0.5 mM
        EDTA
    - reference_id: PMID:24086521
      supporting_text: >-
        First identified in Escherichia coli, this ABC-type transport system is
        comprised of a zinc-binding periplasmic protein (ZnuA), an inner
        membrane permease (ZnuB), and an ATPase (ZnuC)
