- id: PMID:24086521
  title: The transcriptional regulator Np20 is the zinc uptake regulator in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      Np20 (PA5499) is the P. aeruginosa Zur; it is zinc-responsive and
      represses both znuA and the zur-znuC-znuB operon, so the zinc-sensing
      step of this system belongs to the regulator, not to the transporter
      subunits.
    supporting_text: >-
      ZurPA is zinc responsive and represses transcription of both znuA and the
      zur-znuC-znuB operon in a zinc dependent manner.
  - statement: >-
      Deletion of znuA, znuB or znuC reduces growth in LB containing 0.5 mM
      EDTA, with no general growth defect in plain LB; this is the evidence
      behind the PseudoCAP annotation on znuC.
    supporting_text: >-
      the inability to express the putative znuA, znuB, or znuC genes resulted
      in decreased growth at 18 hours as compared wild-type strain PAO1 when
      the strains were grown in LB media supplemented with 0.5 mM EDTA
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      PubMed-verified and the full text is cached; the paper is the right one
      for this gene and its data are sound. The problem is the term it is
      keyed to: a zinc-limitation growth defect of an importer ATPase supports
      zinc import, whereas "response to zinc ion" describes the sensing role
      that the same paper demonstrates for Zur.
- id: PMID:25751674
  title: The capability of Pseudomonas aeruginosa to recruit zinc under conditions
    of limited metal availability is affected by inactivation of the ZnuABC transporter.
  findings:
  - statement: >-
      A znuA mutant of P. aeruginosa PA14 has only a limited growth defect in
      zinc-depleted media and near-normal intracellular zinc, indicating
      redundant zinc acquisition routes, but it shows reduced alginate
      production, lower activity of secreted zinc-dependent proteases and
      impaired dissemination in systemic infection.
    supporting_text: >-
      These findings suggest that P. aeruginosa is equipped with redundant
      mechanisms for the acquisition of zinc that might favor P. aeruginosa
      colonization of environments containing low levels of this metal.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; used as independent context on the physiological role
      and redundancy of ZnuABC in P. aeruginosa. It studies znuA in PA14, not
      znuC in PAO1, so it is corroborating rather than primary evidence here.
