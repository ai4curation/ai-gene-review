core_functions:
- description: >-
    Hydrolyses ATP at the cytoplasmic face of the inner membrane to energise
    the ZnuABC importer, driving Zn(2+) delivered by the periplasmic binding
    protein ZnuA through the ZnuB permease into the cytosol; this is how
    P. aeruginosa acquires zinc when the metal is scarce.
  contributes_to_molecular_function:
    id: GO:0015633
    label: ABC-type zinc transporter activity
  directly_involved_in:
  - id: GO:0071578
    label: zinc ion import across plasma membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  supported_by:
  - reference_id: file:PSEAE/znuC/znuC-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Part of the ABC transporter complex ZnuABC involved in zinc
  - reference_id: PMID:24086521
    supporting_text: >-
      Putative znuA, znuB, and znuC genes are required for wild-type level
      growth in low zinc conditions.
suggested_questions:
- question: >-
    Should PTN001952271's IBD be re-pointed from GO:0010043 response to zinc
    ion to a zinc-import process term, given that all its bacterial leaves are
    ZnuC subunits and 1448 of its 1455 propagated rows are TreeGrafter
    transfers?
- question: >-
    Which transporter accounts for the zinc that P. aeruginosa still acquires
    when ZnuABC is inactivated, given that intracellular zinc is barely
    affected in a znuA mutant?
suggested_experiments:
- description: >-
    Measure radiolabelled zinc uptake in inner-membrane vesicles or in
    proteoliposomes reconstituted with ZnuA, ZnuB and ZnuC, with and without
    ATP and with a Walker A lysine variant of ZnuC. This would establish the
    transport reaction and its ATPase requirement directly, rather than
    through a chelated-medium growth phenotype, and would let the EC number be
    supported experimentally for the P. aeruginosa system.
