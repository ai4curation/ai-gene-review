suggested_questions:
- question: >-
    Does FemA transport carboxymycobactin and mycobactin with comparable affinity, and does
    it also accept the structurally related mycobacterial siderophores? The system was
    identified by its response to both, but the selectivity of the receptor itself has not
    been separated from the response of the signalling cascade.
- question: >-
    Can the transport and signalling functions of FemA be separated by mutation? A variant
    that imports ferric mycobactin without releasing FemI, or the converse, would establish
    whether the two core functions are mechanistically independent and would settle how much
    of the iron-regulation annotation belongs to this protein rather than to FemI.
suggested_experiments:
- description: >-
    Measure ferric-mycobactin uptake in a femA deletion complemented with wild type and with
    STN-domain-deleted FemA, reading transport and FemI-dependent reporter activity
    separately, to test whether signalling and transport are separable.
- description: >-
    Determine the ligand-bound structure of FemA, building on the existing apo structures, to
    establish how siderophore binding at the barrel is communicated to the periplasmic
    signalling domain.
