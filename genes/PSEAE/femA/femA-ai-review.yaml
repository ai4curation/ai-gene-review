  review:
    summary: >-
      PseudoCAP row asserting sigma factor activity on this gene. The paper assigns the loci
      explicitly - PA1912 is FemI, the ECF sigma factor, and PA1910, this gene, is FemA, the
      TonB-dependent transducer - and lists PA1912, not PA1910, among the five ECF sigmas it
      overexpressed. The row describes the wrong protein of the same operon.
    action: REMOVE
    reason: >-
      The activity belongs to PA1912. Two independent checks agree and neither needs the
      full text. The paper's own abstract names the five sigmas and maps the three fem loci
      to names. And the record rules it out on its own: femA is an 804-residue multi-pass
      outer-membrane beta-barrel of the TonB-dependent receptor family, with a plug domain
      and a periplasmic signalling domain, PE 1 and two PDB structures, whereas ECF sigma
      factors are small cytoplasmic DNA-binding proteins - which is why femI carries DNA
      binding and transcription-factor rows and this gene carries none. The exchange is
      reciprocal, which is the strongest form of the confident case: the GO:0015344
      experimental row that belongs to femA sits on femI instead, so each gene received the
      other's molecular function from this paper while its own correct activity kept only
      electronic support. Also note that the four merged members of this shared claim accept
      the term on the stated ground that the ECF sigma domain architecture is complete; femA
      fails that same test, so the group's own criterion excludes it.
