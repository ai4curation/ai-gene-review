id: Q9I2J4
gene_symbol: femA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FemA (PA1910) is the outer-membrane TonB-dependent transducer of the FemI-FemR-FemA
  cell-surface signalling system of Pseudomonas aeruginosa. It is an 804-residue
  twenty-two-stranded beta-barrel with an N-terminal plug domain that occludes the pore until
  a ligand binds, and it recognises the Mycobacterium siderophores mycobactin and
  carboxymycobactin, importing ferric mycobactin across the outer membrane using the proton
  motive force transmitted through TonB. Unlike a plain siderophore receptor it also carries
  a periplasmic signalling domain, which on ligand binding transmits the signal inward to
  the anti-sigma factor FemR and so releases the ECF sigma factor FemI to activate
  transcription. The system lets the organism scavenge iron bound to siderophores made by
  other species.
