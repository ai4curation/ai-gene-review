- id: PMID:18086184
  title: Characterization of five novel Pseudomonas aeruginosa cell-surface signalling systems.
  findings:
  - statement: >-
      A cell-surface signalling system has three distinct parts in three distinct
      compartments, which is what makes an exchange of annotations between its components
      detectable.
    reference_section_type: ABSTRACT
    supporting_text: >-
      an outer membrane-localized TonB-dependent receptor (TonB-dependent transducer), a
      cytoplasmic membrane-localized antisigma factor and an extracytoplasmic function (ECF)
      sigma factor
  - statement: >-
      The paper names the five ECF sigma factors it overexpressed. PA1912 is among them;
      PA1910, the gene reviewed here, is not.
    reference_section_type: ABSTRACT
    supporting_text: >-
      the ECF sigmas PA0149, PA1912, PA2050, PA2093 and PA4896 have been overexpressed
  - statement: >-
      The paper assigns the three loci of this system explicitly: PA1912 is FemI the sigma
      factor, PA1911 is FemR, and PA1910 is FemA, the transducer.
    reference_section_type: ABSTRACT
    supporting_text: >-
      the PA1912-PA1911-PA1910 (designated FemI-FemR-FemA in this work) signalling system
  - statement: >-
      The system responds to mycobacterial siderophores and enables their use as iron
      sources, which is the result behind the iron-regulation and siderophore-transport rows
      on this gene.
    reference_section_type: ABSTRACT
    supporting_text: is involved in the utilization of these heterologous siderophores
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Llamas, Mooij, Sparrius, Vandenbroucke-Grauls, Ratledge & Bitter, Mol
      Microbiol 2008; DOI 10.1111/j.1365-2958.2007.06061.x). Abstract only, but it states
      exactly what is needed: the three-part architecture of a cell-surface signalling
      system, the identity of the five ECF sigma factors studied, and the locus-to-name
      mapping for this system. The paper is correctly cited for this gene - FemA is one of
      its subjects - so this is not a wrong-reference case. What is wrong is which of the
      system's proteins two of its rows were entered against; see the source defects on the
      GO:0016987 and GO:0005829 rows.
