taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AstB (AruB, PA0899) is N2-succinylarginine dihydrolase, the second enzyme of the
  arginine succinyltransferase (AST) pathway, the main route of aerobic arginine and
  ornithine utilization in Pseudomonas aeruginosa. It hydrolyses N2-succinylarginine
  to N2-succinylornithine, ammonia and CO2. The gene lies in the ArgR-controlled
  aruCFGDB operon with the genes for the succinylornithine transaminase, the two
  succinyltransferase subunits and the succinylglutamate semialdehyde
  dehydrogenase. The enzyme belongs to the AstB (succinylarginine dihydrolase)
  family and is expected to be a cytoplasmic homodimer.
