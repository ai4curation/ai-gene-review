suggested_experiments:
- description: >-
    Purify P. aeruginosa AruB and measure N2-succinylarginine hydrolysis kinetics,
    confirming the products (N2-succinylornithine, NH3, CO2), since activity has so
    far been shown only in extracts and for the E. coli ortholog.
