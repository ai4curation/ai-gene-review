  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only (PMC323859 not retrievable through the PubMed MCP). PseudoCAP IDA
      source of the L-arginine catabolic process rows for astB, astA and aruG, which
