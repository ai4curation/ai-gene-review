  title: Cloning and characterization of the aru genes encoding enzymes of the catabolic
    arginine succinyltransferase pathway in Pseudomonas aeruginosa.
  findings:
  - statement: aruB encodes N2-succinylarginine dihydrolase in the aruCFGDB operon.
    supporting_text: >-
      The aruR, aruC, aruD, aruB, and aruE genes specify the ArgR regulatory protein,
