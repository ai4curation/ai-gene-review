taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FdnH (PA4811) is the iron-sulfur (beta) subunit of the membrane-bound, nitrate-inducible
  respiratory formate dehydrogenase FdnGHI of Pseudomonas aeruginosa. It has four ferredoxin-type
  cysteine clusters that bind four [4Fe-4S] clusters and a single C-terminal transmembrane helix
  that anchors it to the cytoplasmic membrane. It carries electrons from the formate-oxidising
  molybdenum site of FdnG to the haem b groups of the membrane cytochrome FdnI, which reduces
  quinone. The enzyme is made during anaerobic growth on nitrate, when it and nitrate reductase
  form a short formate-to-nitrate respiratory chain.
