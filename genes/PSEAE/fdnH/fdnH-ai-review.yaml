  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA, the PTN001732897 seed row. Activity of the purified FDH complex, which
      contained a [4Fe-4S]+ cluster attributable to FdnH.
    action: ACCEPT
    reason: >-
      Seed verdict SOUND as a complex-level activity: a biochemical assay of purified FDH, not an
      operon mutant phenotype, annotated to each subunit as EcoCyc does for E. coli FdnGHI. The paper
      predates gene assignments and I read only the abstract; attribution rests on fdnGHI being the
      only FDH-N-type cluster in PAO1.
    supported_by:
