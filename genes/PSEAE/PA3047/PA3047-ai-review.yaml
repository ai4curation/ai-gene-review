  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3047 (dacB) encodes penicillin-binding protein 4 (PBP4) of Pseudomonas aeruginosa, a
  low-molecular-mass PBP of the peptidase S13 family with a predicted N-terminal signal peptide.
  Purified PBP4 is a bifunctional peptidoglycan hydrolase. As a DD-carboxypeptidase it removes the
  terminal D-Ala from the stem pentapeptide, and as a DD-endopeptidase it cleaves 4,3
  (D-Ala-mDAP) cross-links but not 3,3 cross-links, with similar efficiency for both reactions.
  PBP4 is a target of beta-lactams such as cefoxitin. Loss of PBP4 function, by mutation in clinical
  isolates or by beta-lactam inhibition, leads to high-level expression of the AmpC
  beta-lactamase, probably because muropeptides it would otherwise process enter the recycling
  pathway that signals through AmpR.
