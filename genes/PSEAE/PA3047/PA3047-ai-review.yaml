- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:25495032
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA for peptidoglycan biosynthesis, citing the in vitro characterisation of PBP4
      hydrolase activities.
    action: MODIFY
    reason: >-
      Full text read. The paper shows only hydrolytic reactions (DD-carboxypeptidase trimming and
      4,3 cross-link cleavage) and links them to muropeptide release and recycling; it reports no
      synthetic step and no in vivo role in building the sacculus. PBP4 acts in peptidoglycan
      metabolism, the level PAINT placed on PTN000768632, but biosynthesis is not shown. This
      seed row is OVER-SPECIFIC.
    proposed_replacement_terms:
    - id: GO:0000270
      label: peptidoglycan metabolic process
    supported_by:
    - reference_id: PMID:25495032
      supporting_text: >-
        In the presence of β-lactam antibiotics these altered cell-wall segments enter into the
        muropeptide recycling pathway
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0009252
      corrected_value: GO:0000270
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        involved_in GO:0009252 peptidoglycan biosynthetic process on PA3047 (PBP4) cites Lee et al.
        2015 (PMID:25495032). Full text read. The experiments are in vitro hydrolysis of synthetic
        stem-pentapeptide and 4,3-cross-linked muropeptides by purified PBP4, plus muropeptide
        profiling after cefoxitin induction; no biosynthetic step is measured. The supported
        process is GO:0000270 peptidoglycan metabolic process (or a hydrolytic/remodelling
        child). PROBABLE rather than CONFIRMED because GO practice sometimes places PBP
        DD-carboxypeptidases under biosynthesis as sacculus maturation, a convention a curator
        might defend. The PTN000768632 GO:0000270 IBD does not depend on this row: it stands on
        E. coli DacB and PAINT already generalised the seed to the parent term.
      supported_by:
      - reference_id: PMID:25495032
        supporting_text: >-
          PBP4 is a bifunctional enzyme having both dd-carboxypeptidase and endopeptidase
          activities.
