suggested_questions:
- question: >-
    PTN000768632 propagates GO:0000270 peptidoglycan metabolic process to Dictyostelium pscA,
    an organism without a peptidoglycan wall. Does pscA act on ingested bacterial peptidoglycan,
    or should the process IBD be restricted to the bacterial subclade?
- question: >-
    Which PBP4 product or unprocessed substrate (pentapeptide or 4,3-cross-linked muropeptide)
    is the signal that derepresses AmpC when PBP4 is inactivated?
suggested_experiments:
- description: >-
    Compare periplasmic and cytoplasmic muropeptide pools of PAO1, a dacB (PA3047) deletion and a
    catalytic-serine mutant by LC-MS, together with ampC expression, to identify the signalling
    muropeptide.
