- id: PMID:12581364
  title: The dual roles of AlgG in C-5-epimerization and secretion of alginate polymers in
    Pseudomonas aeruginosa.
  findings:
  - statement: AlgG deletion exposes nascent polymer to AlgL degradation, whereas the S272N allele
      loses epimerization but retains polymer protection/export.
    supporting_text: AlgG is bifunctional with (i) epimerase activity and (ii) a role in protecting
      alginate from degradation by AlgL during transport through the periplasm.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct FRD1 genetics distinguish structural function from catalytic epimerization;
      channeling-scaffold interpretation is a model.
- id: PMID:8144447
  title: Pseudomonas aeruginosa AlgG is a polymer level alginate C5-mannuronan epimerase.
  findings:
  - statement: AlgG is processed into a mature periplasmic protein and directly epimerizes polymeric
      mannuronate into guluronate.
    supporting_text: These results demonstrate that AlgG has polymer-level mannuronan C5-epimerase
      activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: P. aeruginosa FRD1-derived AlgG, including recombinant expression; curated into
      the PAO1 species reference record. Not a PAO1-specific phenotype claim.
- id: PMID:16401084
  title: 'Pseudomonas aeruginosa C5-mannuronan epimerase: steady-state kinetics and characterization of
    the product.'
  findings:
  - statement: Purified P. aeruginosa AlgG acts on sufficiently long mannuronan without a calcium
      requirement; adjacent guluronates can form in vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Do not conflate isolated-enzyme G-block capability with usual native P. aeruginosa
      polymer composition.
- id: PMID:16866359
  title: Chemical mechanism and specificity of the C5-mannuronan epimerase reaction.
  findings:
  - statement: AlgG epimerizes by C5 proton abstraction and opposite-face reprotonation, with an
      unsaturated intermediate proposed from mechanistic experiments.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct enzyme chemistry, distinct from protein-dependent export role.
proposed_new_terms:
- proposed_name: mannuronan C5-epimerase activity
  proposed_definition: Catalysis of C5 epimerization of beta-D-mannuronate residues within a
    (1->4)-linked mannuronan chain to alpha-L-guluronate residues, producing alginate without
    cleaving the glycosidic backbone.
  justification: GO:0016857 covers alteration of chiral centers in carbohydrate molecules, including
    polymer-bound residues, and is the valid current annotation. A specific term would preserve the
    polymer-level mannuronan substrate and C5 stereochemistry of EC 5.1.3.37 (RHEA:45572),
    distinguishing this reaction from small-molecule sugar epimerases. The precise term is an
    ontology proposal, not an additional redundant NEW annotation.
  supported_by:
  - *id002
  - reference_id: PMID:16866359
  proposed_parent:
    id: GO:0016857
    label: racemase and epimerase activity, acting on carbohydrates and derivatives
