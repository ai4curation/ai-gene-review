id: Q51371
gene_symbol: algG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: AlgG is a periplasmic mannuronan C5-epimerase that converts beta-D-mannuronate residues
  in alginate to alpha-L-guluronate. Independently of this catalytic modification, AlgG helps
  protect nascent polymer from periplasmic degradation during export; catalytically defective AlgG
  can retain this structural role.
