- term:
    id: GO:0016857
    label: racemase and epimerase activity, acting on carbohydrates and derivatives
  evidence_type: IDA
  original_reference_id: PMID:8144447
  review:
    action: NEW
    summary: Recombinant AlgG directly epimerizes polymer-bound mannuronate.
    reason: GO:0016857 is defined as changing one or more chiral centers in a carbohydrate molecule;
      it is not restricted to free monosaccharides. Direct recombinant target epimerization
      establishes this MF independently of the noncatalytic polymer-protection role. Existing
      annotations contain no epimerase MF or replacement and therefore do not duplicate this
      proposal. The narrower mannuronan C5-epimerase term is requested separately, not asserted as a
      second NEW annotation.
    supported_by:
    - reference_id: PMID:8144447
      supporting_text: These results demonstrate that AlgG has polymer-level mannuronan C5-epimerase
        activity.
