  title: >-
    Cloning, expression, and purification of UDP-3-O-acyl-GlcNAc deacetylase from Pseudomonas aeruginosa:
    a metalloamidase of the lipid A biosynthesis pathway.
  findings:
  - statement: Recombinant P. aeruginosa LpxC was purified as active deacetylase.
    supporting_text: >-
      We devised a novel, rapid, and reproducible assay for the deacetylase which facilitated purification
      of the enzyme in three steps.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA source for GO:0009245 and seed of the PTN002134692 GO:0009245 IBD. Abstract only (no
      PMC full text via PubMed MCP or Europe PMC). The abstract states that the cloned P. aeruginosa gene
      was expressed, the enzyme assayed and purified; UniProt cites the paper for catalytic activity and
      cofactor. Catalysing the committed step supports involvement in lipid A biosynthesis.
