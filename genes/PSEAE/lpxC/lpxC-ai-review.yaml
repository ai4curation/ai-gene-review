id: P47205
gene_symbol: lpxC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  LpxC (PA4406, EnvA) is the zinc-dependent UDP-3-O-[(R)-3-hydroxyacyl]-N-acetylglucosamine deacetylase
  of Pseudomonas aeruginosa. It removes the acetyl group from UDP-3-O-acyl-GlcNAc, the second and committed
  step of lipid A (Raetz pathway) biosynthesis, and so is required for lipopolysaccharide and outer membrane
  synthesis. The recombinant enzyme is soluble, sensitive to EDTA and reactivated by divalent metal. LpxC
  is essential and a major target of antibacterial inhibitor development.
