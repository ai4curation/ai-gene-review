  knowledge_gaps:
  - gap_statement: 'The molecular function of CcoQ in the cbb3-2 cytochrome c oxidase is undetermined:
      no cofactor, catalytic step, electron-transfer role or interaction has been demonstrated for
      it, and it is not known whether the assembled holoenzyme contains it stoichiometrically or whether
      it is instead required for assembly or stability.'
    boundary: 'Firmly established: the gene lies between ccoO and ccoP in the cbb3-2 operon, the protein
      is 61 residues with a single predicted transmembrane helix and no curated cofactor, and it is
      assigned to the cbb3-oxidase component family (Pfam FixQ, InterPro IPR008621). Also established,
      from the whole-operon deletions of PMID:14763990, is that losing the entire cbb3-1 oxidase costs
      growth in aerated cultures. What that experiment cannot say is what the CcoQ chain itself does,
      and the chain is absent from both cryo-EM models of the supercomplex (PDB 8SMR, 8SNH).'
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is CcoQ a stoichiometric subunit of the assembled cbb3-2 oxidase, or a factor needed for
    its assembly or stability? It is absent from both cryo-EM models of the P. aeruginosa bc1-cbb3
    supercomplex, which would be expected either if it is lost on purification or if it is not part
    of the mature complex.
suggested_experiments:
- description: Delete ccoQ2 alone, then measure oxygen-reduction activity, holoenzyme assembly and
    subunit content of membranes, and look for CcoQ in purified oxidase by mass spectrometry. That
    separates a stoichiometric subunit from an assembly or stability factor, which the whole-operon
    deletions behind the current annotation cannot.
  experiment_type: single-gene deletion with holoenzyme purification and mass spectrometry
