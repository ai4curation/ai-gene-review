core_functions:
- description: Small membrane component of the cbb3-2 cytochrome c oxidase. No molecular function
    is established for this chain, and whether the assembled holoenzyme contains it is itself open;
    it is recorded as contributing to the holoenzyme activity on the strength of its family assignment
    and operon context alone, with no process claim made.
