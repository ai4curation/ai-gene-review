  review:
    summary: The only molecular-function claim on this entry, and it is the operon-level IMP that
      PseudoCAP entered identically on all eight subunits of both cbb3 operons.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Not entirely wrong -- CcoQ is a component of the cbb3 oxidase by family assignment (Pfam
      FixQ, InterPro IPR008621 "Cbb3-type cytochrome oxidase component") -- but asserting the catalytic
      activity of the holoenzyme for this chain is an over-annotation. The protein is 61 residues
      with a single transmembrane helix, no curated cofactor of any kind, and protein existence 4
      (Predicted); it carries neither a heme nor the copper centre, so it performs no step of the
      reaction. That is the distinction from the CcoO and CcoP chains, which do carry hemes and relay
      the electrons, and whose rows this review family accepts with a contributes_to qualifier correction.
      The evidence here is weaker still: the abstract describes the loss of whole cbb3 isoforms, not
      a ccoQ mutant. Marked over-annotated rather than removed, the same call as the human COX5A and
      COX8A reviews for structural subunits; REMOVE is reserved for a protein shown not to be in the
      complex at all, as in the SURF1 assembly-factor review, and that has not been shown for CcoQ.
      No separate WRONG_QUALIFIER defect is filed for this chain, unlike the CcoO and CcoP reviews.
      The enables qualifier is at least as wrong here as there, but the over-annotation call subsumes
      it: this review asks PseudoCAP to reconsider the row itself rather than merely its qualifier,
      and filing both would send two requests about one row.'
