description: 'CcoQ2 (PA1555.1) is the small CcoQ/FixQ component of the cbb3-2 cytochrome c oxidase
  of Pseudomonas aeruginosa, encoded between the ccoO and ccoP genes of the PA1552-PA1557 region.
  It is a 61-residue protein with a single predicted transmembrane helix and no cofactor, and it is
  assigned to the cbb3-oxidase component family on sequence alone; its protein existence is recorded
  as predicted. In other cbb3 and fixNOQP systems the FixQ chain is counted among the subunits of
  the assembled oxidase, but what it does there is not established: it is not resolved in either published
  cryo-EM model of the P. aeruginosa bc1-cbb3 supercomplex (PDB 8SMR, 8SNH), and no activity, cofactor
  or interaction has been demonstrated for it in this organism. Whether it is a structural subunit
  of the holoenzyme, a factor needed for its assembly or stability, or both, is open.'
