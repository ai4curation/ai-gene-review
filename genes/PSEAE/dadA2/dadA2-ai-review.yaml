      dadA2.
- id: PMID:21378189
  title: >-
    Regulation and characterization of the dadRAX locus for D-amino acid catabolism in Pseudomonas
    aeruginosa PAO1.
  findings:
  - statement: >-
      Purified DadA1 (PA5304) is a broad-specificity D-amino acid dehydrogenase and is the enzyme
      solely responsible for the D-amino acid dehydrogenase activity in PAO1.
    supporting_text: >-
      the results from this study clearly demonstrate DadA to be the enzyme solely responsible for
      the proposed D-amino acid dehydrogenase activity of broad substrate specificity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. About the paralog DadA1 (PA5304); cited here because its mutant data show DadA2
      does not substitute for DadA1 in D-alanine use.
