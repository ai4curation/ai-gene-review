suggested_questions:
- question: >-
    Under what conditions is dadA2 (PA5084) expressed, and which D-amino acids, if any, does it oxidise
    that DadA1 does not?
suggested_experiments:
- description: >-
    Purify recombinant DadA2 and measure dehydrogenase activity with a panel of D-amino acids (DCPIP
    or ferricyanide acceptor); test growth of dadA1, dadA2 and double mutants on each D-amino acid
    as sole nitrogen or carbon source.
