taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  DadA2 (PA5084) is the second of two DadA-family FAD-dependent D-amino acid dehydrogenases encoded
  by Pseudomonas aeruginosa PAO1, a paralog of the experimentally characterised DadA1 (PA5304). It
  carries the complete DadA family signature (HAMAP MF_01202, DAO/FAD-dependent oxidoreductase domain)
  and is predicted to oxidatively deaminate D-amino acids to 2-oxo acids and ammonia, passing electrons
  to a membrane acceptor as E. coli DadA does. No experimental study of the PA5084 product has been
  found. Loss of dadA1 alone abolishes growth on D-alanine and several other D-amino acids as nitrogen
  source, so DadA2 does not replace DadA1 under those conditions, and its physiological substrates
  and expression conditions are unknown.
