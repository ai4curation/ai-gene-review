  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2127 (cgrA) encodes CgrA, a 408-residue cytoplasmic protein of the adenine
  nucleotide alpha-hydrolase superfamily with a phosphoadenosine phosphosulfate
  (PAPS) reductase-like domain and a DUF3440 region. It is one of the
  cgrABC genes, which lie immediately upstream of the cupA fimbrial cluster. CgrA, CgrB and CgrC
  are unusual positive coregulators required for phase-variable expression of
  the cupA fimbrial genes, which support biofilm formation on abiotic surfaces.
  cgr expression is repressed by the H-NS-like MvaT and induced by anaerobiosis
  through the oxygen-sensing regulator Anr. CgrA binds CgrC directly, and this
  interaction is required for cupA expression; CgrA itself has no DNA-binding
  motif and was not detected at the cupA promoter, so it is thought to be
  recruited there by CgrC. No enzymatic activity has been shown for its
  PAPS reductase-like domain.
