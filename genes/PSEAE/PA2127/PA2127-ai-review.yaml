suggested_questions:
- question: >-
    Does the PAPS reductase-like domain of CgrA retain any catalytic activity (for example ATP pyrophosphatase or sulfonucleotide reduction), and is that activity needed for cupA activation?
- question: >-
    Are CgrA/CgrC orthologs in other bacteria oxygen-regulated, or is the
    Anr control of cgr expression specific to P. aeruginosa? This decides
    whether any oxygen-response term can be inherited at PTN000764275.
suggested_experiments:
- description: >-
    Purify CgrA (alone and with CgrC) and assay ATP hydrolysis and PAPS/APS reduction; test catalytic-site point mutants for complementation of cupA expression in a cgrA mutant.
