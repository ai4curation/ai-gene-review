  title: Formation of oligomeric rings by XcpQ and PilQ, which are involved in protein transport
    across the outer membrane of Pseudomonas aeruginosa.
  findings:
  - statement: Purified XcpQ is a stable homomultimer forming large ring-shaped structures with a
      central cavity of about 95 Angstroms; the C-terminal part suffices for multimerisation.
    supporting_text: C-terminal part of XcpQ is sufficient for the formation of the multimer.
  reference_review:
