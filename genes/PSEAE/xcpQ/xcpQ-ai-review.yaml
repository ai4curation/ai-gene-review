    label: type II protein secretion system complex
suggested_questions:
- question: Does the proposed C15-to-C6 symmetry transition of the XcpQ N-terminal domains happen
    during a secretion cycle, and can it be captured with substrate engaged?
- question: Should XcpQ carry a channel or protein-transmembrane-transporter molecular function
    term, given that the secretin forms the gated outer-membrane pore itself rather than only
    being part of the complex?
suggested_experiments:
- description: Cryo-EM of the assembled Xcp secreton with a trapped substrate to test whether the
    central gate opens at the proposed pivot residue and whether the N0 ring changes symmetry.
