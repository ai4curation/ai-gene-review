    correctness: VERIFIED
    review_notes: Primary P. aeruginosa study (abstract only in the cache, PubMed publication type
      Journal Article). Supports the T2SS complex and outer-membrane channel claims and is the
      PseudoCAP seed for GO:0015627.
- id: PMID:9818381
  full_text_unavailable: true
  title: 'GSP-dependent protein secretion in gram-negative bacteria: the Xcp system of Pseudomonas
    aeruginosa.'
  findings:
  - statement: Review of the Xcp type II secretion machinery of P. aeruginosa, including pore
      formation in the outer membrane.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PubMed types this as a Review and the abstract calls it one; full text not
      available to us (abstract only, no PMC copy). Reviews from the laboratory that did the work
      can include original or unpublished data, so whether it supports the PseudoCAP IDA is
      unverified. The term it is cited for is correct.
- id: PMID:24657091
  title: Independent domain assembly in a trapped folding intermediate of multimeric outer
    membrane secretins.
  findings:
  - statement: An amino acid substitution blocks secretin assembly at a dodecameric prepore stage
      in PulD, and the equivalent substitution has the same effect in XcpQ.
    supporting_text: in the Pseudomonas aeruginosa secretin XcpQ
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mostly a Klebsiella PulD study; XcpQ is the comparison case, which is enough for
      the self-association row but not for the T2SS process.
- id: PMID:29042496
  title: Structural Basis of Type 2 Secretion System Engagement between the Inner and Outer
    Bacterial Membranes.
  findings:
  - statement: Cryo-EM of the purified 1-MDa XcpQ complex shows a pentadecameric secretin with
      15-fold symmetry in the membrane region, while the N0 and N1 domains are not ordered into
      that symmetry, which is proposed to allow engagement with the 6-fold inner-membrane
      platform.
    supporting_text: class averages revealed that XcpQ is a pentadecameric secretin complex
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Establishes the stoichiometry and the outer-membrane channel
      architecture.
- id: PMID:29042493
  title: Unraveling the Self-Assembly of the Pseudomonas aeruginosa XcpQ Secretin Periplasmic
    Domain Provides New Molecular Insights into Type II Secretion System Secreton Architecture
    and Dynamics.
  findings:
  - statement: The periplasmic N0-N2 domains assemble as a hexamer of dimers, nanobody
      interference against the secretin reproduces the secretome of an xcpQ deletion mutant, and
      PAO1 delta-xcpQ is the reference strain for loss of Xcp secretion.
    supporting_text: the supernatant profile of the wild-type strain producing vHH04 is similar to
      that of an xcpQ deletion mutant
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Provides the mutant-phenotype evidence that the PseudoCAP
      GO:0015628 row should have been keyed to.
- id: PMID:22147293
  title: Outer membrane targeting of Pseudomonas aeruginosa proteins shows variable dependence on
    the components of Bam and Lol machineries.
  findings:
  - statement: XcpQ reaches the outer membrane without detectable dependence on BamA or LolB and
      assembles spontaneously into liposomes as multimers, unlike the PilQ and PscC secretins.
    supporting_text: XcpQ, but not PilQ or PscC, was shown to assemble spontaneously into
      liposomes as multimers.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Background on how the secretin reaches the outer membrane; not
      used to support a GO row.
