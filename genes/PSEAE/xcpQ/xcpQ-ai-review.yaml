core_functions:
- description: Secretin (GspD) subunit of the Xcp type II secretion system; fifteen copies
    assemble into a gated channel spanning the outer membrane whose periplasmic N-domain rings
    engage the inner-membrane assembly platform, forming the conduit through which folded
    exoproteins such as elastase LasB, PrpL, CbpD, PaAP and ImpA leave the cell.
  supported_by:
  - reference_id: PMID:29042496
    supporting_text: class averages revealed that XcpQ is a pentadecameric secretin complex
  - reference_id: PMID:9466268
    supporting_text: C-terminal part of XcpQ is sufficient for the formation of the multimer.
  - reference_id: file:PSEAE/xcpQ/xcpQ-uniprot.txt
    record_section: ["CC:DISRUPTION PHENOTYPE"]
    supporting_text: Loss of export of PrpL, elastase LasB, chitin
  directly_involved_in:
