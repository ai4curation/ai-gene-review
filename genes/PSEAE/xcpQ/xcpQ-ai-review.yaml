taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: XcpQ (PA3105) is the GspD-family secretin of the Xcp type II secretion system of
  Pseudomonas aeruginosa. Fifteen subunits assemble into a gated, barrel-shaped channel that is
  embedded in the outer membrane and extends across the periplasm, where its N0-N3 ring domains
  engage the inner-membrane assembly platform. The channel is wide enough to pass folded
  exoproteins, and it is the outer-membrane conduit through which the machine releases elastase
  LasB, the protease PrpL, the chitin-binding protein CbpD, aminopeptidase PaAP, metalloprotease
  ImpA and other hydrolases. Unlike the other P. aeruginosa secretins it reaches and inserts into
  the outer membrane with little help from the Bam and Lol targeting machineries, and it can
  multimerise into lipid vesicles on its own.
