  review:
    summary: The carboxypeptidase activity is a narrow glycine-specific activity demonstrated only in the E. coli DpaA exemplar; on this uncharacterised ortholog it is an over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only characterised member (E. coli DpaA) has a narrow meso-Dpm-Gly
      carboxypeptidase activity and explicitly lacks the classical ld-carboxypeptidase;
      PMID:33947763 notes homologue ld-carboxypeptidase activity is speculative.
      LdtPae3 is biochemically uncharacterised, so inheriting this narrow secondary
      activity as a function is an over-annotation under the promiscuous-activity tiers.
