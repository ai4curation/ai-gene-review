  label: Pseudomonas aeruginosa UCBPP-PA14
description: >-
  PA14_15840 (LdtPae3) is a small, Sec-exported YafK/LdtF-family cysteine
  enzyme of Pseudomonas aeruginosa strain PA14. Although it carries the
  L,D-transpeptidase catalytic fold, it was tentatively assigned to release of
  the outer-membrane lipoprotein OprI by hydrolyzing the peptidoglycan-OprI
  amide bond, based on its lack of detectable amide-bond-forming activity and
  its close similarity to the E. coli tether hydrolase YafK/DpaA. It shares
  PANTHER subfamily PTHR36699:SF1 with experimentally characterized E. coli
  DpaA (P0AA99) and with the P. putida module exemplar PP_1451.
