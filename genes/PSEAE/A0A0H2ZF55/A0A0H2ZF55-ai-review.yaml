proposed_new_terms:
- proposed_name: peptidoglycan-protein cross-link hydrolase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the amide bond that covalently links a
    protein, such as a Braun-lipoprotein-like outer-membrane lipoprotein, to a
    peptide stem of peptidoglycan.
  justification: >-
    GO:0018104 represents formation of a peptidoglycan-protein cross-link, but no
    molecular-function term identifies the reverse hydrolysis reaction. Generic
    carboxypeptidase activity does not specify the protein-peptidoglycan tether substrate.
  proposed_parent:
    id: GO:0061785
    label: peptidoglycan endopeptidase activity
knowledge_gaps:
- gap_statement: LdtPae3 tether-hydrolase activity and substrate specificity have not been demonstrated directly by purified-enzyme assay.
  status: OPEN
  gap_kind: [BIOLOGY]
  significance: The assignment rests on the absence of detectable amide-bond-forming activity and close similarity to E. coli YafK/DpaA; direct demonstration of OprI-tether cleavage is still needed.
