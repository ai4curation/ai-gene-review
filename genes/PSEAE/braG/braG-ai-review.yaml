  label: Pseudomonas aeruginosa PAO1
description: >-
  BraG is one of the two nucleotide-binding (ATPase) subunits of LIV-I, the
  high-affinity, Na(+)-independent branched-chain amino acid ABC importer of
  Pseudomonas aeruginosa, encoded by the last gene of the
  braC-braD-braE-braF-braG operon. BraG is a LivF-type ABC ATPase with a Walker A
  ATP-binding motif. It associates peripherally with the cytoplasmic face of the
  inner membrane, where it pairs with BraF and binds the BraD/BraE permeases. With
  the periplasmic binding protein BraC, the complex couples ATP hydrolysis to the
  uptake of L-leucine, L-isoleucine and L-valine and, with lower affinity,
  L-alanine and L-threonine. All five Bra components are required for transport
  in reconstituted proteoliposomes.
