    ATPase (nucleotide-binding) subunit of the BraCDEFG (LIV-I) ABC importer. It
    hydrolyses ATP to drive high-affinity uptake of L-leucine, L-isoleucine and
    L-valine, and with lower affinity L-alanine and L-threonine, across the inner
    membrane.
