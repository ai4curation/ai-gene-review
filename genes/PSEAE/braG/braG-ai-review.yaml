suggested_questions:
- question: >-
    Is D-alanine a genuine LIV-I substrate, or is the weak D-alanine growth defect
    of every bra mutant (PA1070-PA1074) indirect?
suggested_experiments:
- description: >-
    Radiolabelled D-alanine uptake in wild-type and braG deletion strains, with
    D-alanine competition for leucine binding to purified BraC.
