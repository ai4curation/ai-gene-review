- term:
    id: GO:0042834
    label: peptidoglycan binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR036680
  review:
    summary: Over-annotation of a structure-only fold match; not demonstrably false, but untested on
      this protein and on any secretin carrying the fold.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The row rests on one signature and that signature is a structural grouping. IPR036680 is
      "Sporulation-like domain superfamily" and its InterPro type is homologous_superfamily, yet
      InterPro maps it to a specific ligand-binding molecular function. In XqhA the match covers
      residues 684-769, in the C-terminal extension past the secretin domain, and nothing else
      covers that region: no Pfam, no PROSITE, no NCBIfam, no family-level InterPro entry. The
      evidence is a fold assignment and nothing more.

      InterPro's own justification for the term comes from other proteins doing another job -- its
      description cites FtsN of E. coli and Caulobacter crescentus, with CwlM and RlpA, which are
      cell division and cell wall enzymes.

      The comparator check is what makes this specific to XqhA rather than a complaint about the
      superfamily. Run after confirming the query returns positives, so a negative could not be a
      malformed-query artifact: GO:0042834 has tens of thousands of annotations and nine in PAO1.
      Of those nine, five (PA5052, PA5037, PA4278, PA3110 and rlpA) match the domain-level entry
      IPR007730 as well as the superfamily, one (PA0667) comes by a LysM-like domain, and one (fimV)
      is experimental, IDA. XqhA is the only one assigned from the superfamily alone. IPR007730 is
      "Sporulation-like domain", type domain, and InterPro maps the same GO term from it -- so every
      other protein here that reaches the term by this route has the domain-level signature that the
      characterised members, rlpA included, actually match.

      Not REMOVE, because the claim is not demonstrably false and there is a plausible reading: a
      secretin must traverse the peptidoglycan layer, and C-terminal modules that grip the sacculus
      occur in related channel-forming families, so a genuine peptidoglycan-binding domain at a
      secretin C-terminus would be unsurprising. But it is untested on XqhA, untested on any secretin
      with this fold, and transferred from proteins with an unrelated function, which is an
      over-annotation of a structure match rather than a mapping that is wrong.
    supported_by:
    - reference_id: file:PSEAE/xqhA/xqhA-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR036680; SPOR-like_sf.'
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: IPR036680 (Sporulation-like domain superfamily) to GO:0042834 peptidoglycan binding
      slot: go_term
      requested_change: CHECK
      asserted_value: IPR036680 -> GO:0042834 peptidoglycan binding
      corrected_value: restrict the mapping to the domain-level entry IPR007730 (Sporulation-like
        domain), or qualify it for matches without a domain-level signature
      cause: OVER_PROPAGATION
      confidence: SUSPECTED
      explanation: >-
        Request to check whether a homologous_superfamily entry should carry a specific
        ligand-binding molecular function when a domain-level entry for the same fold exists and
        already carries it. IPR036680 is typed homologous_superfamily and IPR007730
        (Sporulation-like domain) is typed domain; InterPro maps GO:0042834 from both. The
        experimental support InterPro cites in its own description is FtsN of Escherichia coli and
        Caulobacter crescentus, with CwlM and RlpA.

        The practical effect is visible within one proteome. Of the nine P. aeruginosa PAO1
        annotations to GO:0042834, five come from IPR007730 together with IPR036680, one from a
        LysM-like domain (IPR007340), one is experimental (fimV, IDA), and one -- xqhA -- comes from
        IPR036680 alone. In xqhA the match is at residues 684-769 and no Pfam, PROSITE, NCBIfam or
        family-level InterPro entry covers that region, so the protein is given a binding function
        on a fold assignment with no domain-level corroboration.

        Marked SUSPECTED and CHECK rather than confirmed, and deliberately scoped to the mapping
        rather than to this gene. Whether XqhA's C-terminal extension binds peptidoglycan is
        unknown and plausible: a secretin has to cross the sacculus. What this request can show is
        the tier of evidence the mapping relies on, not that the biology is wrong. The question is
        general -- the superfamily has tens of thousands of matches -- so it should be decided for
        the entry and not for one protein, and xqhA is named only because it is the gene under
        review.
