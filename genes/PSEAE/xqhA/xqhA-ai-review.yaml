id: Q9I2M7
gene_symbol: xqhA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  XqhA is an orphan secretin (GspD family) of Pseudomonas aeruginosa PAO1: a GspD-family
  outer-membrane channel encoded outside both the xcp and hxc clusters, able to replace the
  main Xcp secretin XcpQ. With XphA, a GspC/XcpP homologue encoded beside it, it forms the
  gatekeeper pair of a hybrid type II secretion system that operates with the remaining Xcp
  components. Because the GspC/GspD pair is what sets substrate specificity in this
  organism, the hybrid machine exports a different set from the native one: it restores
  secretion of the major Xcp-dependent exoproteins but not of the aminopeptidase PaAP. The
  xphA-xqhA genes are also transcribed from an earlier growth stage than xcpP-xcpQ, so the
  pair may serve the secretion pathway at a different point in the life cycle. The protein
  has the canonical secretin architecture, an N0 domain and three ring-building domains
  preceding a membrane-spanning beta-barrel, followed by a C-terminal extension of unknown
  function.
