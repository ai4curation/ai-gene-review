- id: PMID:17351035
  title: XphA/XqhA, a novel GspCD subunit for type II secretion in Pseudomonas aeruginosa.
  findings:
  - statement: Substrate specificity of the type II system in this organism is set chiefly by the
      GspC/GspD gatekeeper pair, which is why an alternative secretin changes what is exported.
    supporting_text: this specificity mainly
      involves two proteins, XcpP (GspC family) and the secretin XcpQ (GspD family),
      which are the gatekeepers of the system
    reference_section_type: ABSTRACT
  - statement: XphA and XqhA together substitute for XcpP and XcpQ, establishing XqhA as a working
      secretin of a hybrid machine rather than a silent paralogue.
    supporting_text: Our results also revealed that complementation of an
      xcpP/xcpQ mutant can be obtained with the gene couple xphA/xqhA.
    reference_section_type: ABSTRACT
  - statement: The hybrid machine's substrate range differs by at least one protein, which is the
      functional consequence of swapping the gatekeeper pair.
    supporting_text: analysis showed that except for the aminopeptidase PaAP, for which secretion is
      not restored by the P(A)Q(A) subunit in the xcpP/xcpQ deletion mutant, each
      major Xcp-dependent exoprotein is secreted by the new hybrid machinery.
    reference_section_type: ABSTRACT
  - statement: The pair is expressed on a different schedule from XcpP/XcpQ, suggesting a role at a
      different growth stage rather than redundancy.
    supporting_text: using a chromosomal xphA-lacZ fusion, we showed
      that the xphA-xqhA genes are transcribed from an early stage of bacterial
      growth
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The sole experimental reference in GOA for this gene and the source of the PseudoCAP IDA row.
      PubMed-verified as Michel GP, Durand E, Filloux A, J Bacteriol 2007. Cached abstract only, but
      it names XqhA throughout and states the complementation and 2-D gel results directly, so the
      complex-membership claim does not rest on unread text. The paper says nothing about
      peptidoglycan binding either way.
