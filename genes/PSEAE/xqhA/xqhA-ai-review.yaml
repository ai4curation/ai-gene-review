suggested_questions:
- question: >-
    Should InterPro2GO mappings from homologous_superfamily entries to specific ligand-binding
    molecular functions be treated as a distinct, weaker tier in review? The xqhA peptidoglycan
    row is a clean instance: the same GO term is mapped from a domain entry and from its structural
    superfamily, every characterised member matches the domain, and the one protein assigned from
    the superfamily alone gets a binding function with no domain-level corroboration. A systematic
    pass over homologous_superfamily entries carrying molecular-function terms would say whether
    this is a recurring pattern or a single entry's quirk; this project has one case and so raises
    the question rather than generalising from it.
- question: >-
    What determines a secretin's substrate repertoire? Swapping XcpP/XcpQ for XphA/XqhA restores
    every major Xcp-dependent exoprotein except the aminopeptidase PaAP, which makes PaAP the
    sharpest available probe of specificity in this system, and the GspC/GspD pair the determinant.
    Whether the discriminating contact is in the GspC-family partner, in the secretin's periplasmic
    ring domains, or in their interface is not addressed by the annotations and would not be
    expressible in GO as it stands.
suggested_experiments:
- description: >-
    Test directly whether XqhA's C-terminal extension binds peptidoglycan, which would settle the
    GO:0042834 row rather than leaving it marked over-annotated. Express residues ~605-776 as an
    isolated fragment and assay binding to purified P. aeruginosa sacculi by pulldown or
    co-sedimentation, with the SPOR domain of a characterised binder such as RlpA as a positive
    control and the secretin ring domains as a negative. A deletion of the extension in a strain
    where xphA/xqhA is the only functional gatekeeper pair would then say whether any binding
    matters for secretion.
- description: >-
    Ask whether XphA/XqhA and XcpP/XcpQ are ever both active, and on what schedule. The xphA-xqhA
    pair is transcribed from an early growth stage while xcpP-xcpQ is quorum-sensing regulated, so
    the two gatekeeper pairs may partition the growth curve rather than compete. Quantifying both
    pairs' protein levels and the secretion of a shared substrate and of PaAP across growth, in the
    wild type rather than in complementation strains, would show whether the hybrid machine is a
    physiological state of the cell or only a genetic possibility.
knowledge_gaps:
- gap_statement: >-
    What the C-terminal extension of XqhA does. About 170 residues follow the secretin beta-barrel
    and no domain-level signature covers them; the only signal is a fold match to the SPOR
    superfamily over residues 684-769, from which a peptidoglycan-binding function has been
    inferred electronically but never tested on this protein or on any secretin carrying the fold. A
    secretin must cross the peptidoglycan layer, so a sacculus-gripping module would make sense, but
    equally the region could mediate partner contacts or oligomer stability. Only wet-lab work on
    the isolated region and on a deletion strain can decide.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
- gap_statement: >-
    Why P. aeruginosa maintains a third secretin at all. XqhA can replace XcpQ and HxcQ serves a
    separate phosphate-regulated system, so the organism carries three GspD-family channels whose
    roles overlap. The xphA-xqhA pair's early expression and its inability to export PaAP hint at a
    distinct physiological niche rather than redundancy, but no condition has been identified in
    which the hybrid machine is the one the cell actually uses, and finding one requires experiment.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
