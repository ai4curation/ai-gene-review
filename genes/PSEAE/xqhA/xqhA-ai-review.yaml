core_functions:
- description: >-
    Orphan secretin (GspD family) that forms the outer-membrane channel of a hybrid type II
    secretion system: with its neighbouring GspC-family partner XphA it replaces the XcpP/XcpQ
    gatekeeper pair and works with the rest of the Xcp machinery, exporting the major Xcp-dependent
    exoproteins. Because the GspC/GspD pair determines substrate specificity, the hybrid machine's
    repertoire differs from the native one, excluding the aminopeptidase PaAP, and the pair is
    transcribed from an earlier growth stage than xcpP-xcpQ.
  molecular_function:
    id: GO:0008320
    label: protein transmembrane transporter activity
  supported_by:
  - reference_id: PMID:17351035
    supporting_text: Our results also revealed that complementation of an
      xcpP/xcpQ mutant can be obtained with the gene couple xphA/xqhA.
  - reference_id: PMID:17351035
    supporting_text: analysis showed that except for the aminopeptidase PaAP, for which secretion is
      not restored by the P(A)Q(A) subunit in the xcpP/xcpQ deletion mutant, each
      major Xcp-dependent exoprotein is secreted by the new hybrid machinery.
