id: Q00515
gene_symbol: xcpU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: XcpU (PA3100, also PddB) is the GspH-family minor pseudopilin of the Xcp type II
  secretion system of Pseudomonas aeruginosa, the machine that exports folded enzymes from the
  periplasm across the outer membrane. Like the other pseudopilins it is made as a prepilin-like
  precursor whose short leader is removed by the prepilin peptidase PilD/XcpA, which then
  N-methylates the new N-terminal phenylalanine; the mature protein is anchored in the inner
  membrane by a single hydrophobic helix. XcpU joins the minor-pseudopilin tip complex, entering it
  through a direct interaction with XcpW, so that XcpU, XcpV, XcpW and XcpX together cap the
  XcpT pseudopilus and prime its assembly.
