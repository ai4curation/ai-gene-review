- term:
    id: GO:0044010
    label: single-species biofilm formation
  evidence_type: IMP
  original_reference_id: PMID:17158671
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP from the Overhage et al. 2007 mini-Tn5-lux screen: an xcpU insertion mutant
      makes about half the wild-type amount of biofilm.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The phenotype is real but shared by insertions in xcpS, xcpT and xcpY, so it is a property of
      losing the Xcp machine rather than of XcpU. The authors state explicitly that they could not
      tell whether an Xcp-secreted exoproduct or the pseudopilus itself is responsible, and found no
      attachment difference. Biofilm formation is carried out by matrix synthesis and adhesion
      systems; a pseudopilin that is needed for an exoprotein to reach the medium contributes
      necessity, not participation.
    supported_by:
    - reference_id: PMID:17158671
      supporting_text: exhibited strong defects in biofilms formation, with approximately 50% of
        wild-type levels of biofilm formation
    - reference_id: PMID:17158671
      supporting_text: It still remains whether the excretion of an exoproduct of the Xcp machinery
        is necessary for swarming and biofilm formation or whether the pseudopilus itself is
        involved in these phenotypes
- term:
    id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IMP
  original_reference_id: PMID:17158671
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP from the same swarming screen: the xcpU insertion mutant swarms poorly.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Swarming is performed by the flagellum together with rhamnolipid surfactant; XcpU is an
      inner-membrane pseudopilin of a secretion machine. Insertions in xcpS, xcpT and xcpY give the
      same defect, so the phenotype belongs to the Xcp system, and the authors could not determine
      whether it acts through a secreted exoproduct. This is necessity evidence for an indirect
      effect, not evidence that XcpU performs any step of flagellar swarming.
    supported_by:
    - reference_id: PMID:17158671
      supporting_text: The xcpU mutant exhibited a defect in both swarming motility and biofilm
        formation
    - reference_id: PMID:17158671
      supporting_text: All mutants except the xcpQ mutant showed the same swarming and
        biofilm-deficient phenotype
