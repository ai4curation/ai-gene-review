  label: Pseudomonas aeruginosa PAO1
description: 'LiuB (PA2012) is the beta subunit of 3-methylcrotonyl-CoA carboxylase (MCC) of Pseudomonas
  aeruginosa, a biotin-dependent carboxylase that catalyses the third step of leucine catabolism and
  also acts in acyclic terpene catabolism in pseudomonads. The enzyme is a 750-kDa alpha6beta6 holoenzyme
  in which the two chains perform different halves of one reaction: the alpha subunit (LiuD) carboxylates
  its biotin cofactor at the expense of MgATP, and this beta subunit supplies the carboxyltransferase
  activity that moves the carboxyl group onto 3-methylcrotonyl-CoA to give 3-methylglutaconyl-CoA.
  Its two carboxyltransferase domains form the active site at a dimer interface some 80 A from the
  alpha subunit''s biotin carboxylase site, so the biotin carrier domain has to travel between the
  two chains during catalysis. LiuB therefore has no catalytic activity on its own and carries no
  cofactor; it is one half of an enzyme.'
existing_annotations:
- term:
    id: GO:0004485
    label: methylcrotonoyl-CoA carboxylase activity
  evidence_type: IDA
  original_reference_id: PMID:18469096
  qualifier: enables
  review:
    summary: Activity of the enzyme reconstituted from purified LiuD and LiuB subunits.
    action: ACCEPT
    reason: The term is right and is the gene's core role, so the row is accepted; the qualifier is
      not. The assay in the cited paper measured a reconstituted enzyme made by mixing the purified
      alpha and beta subunits, so it shows the activity of the pair, not of LiuB alone. LiuB supplies
      the carboxyltransferase half-reaction and has no biotin carboxylase site, so it contributes
      to the activity rather than enabling it. Qualifier defect filed at CONFIRMED on the strength
      of the full text.
    supported_by:
    - &id001
      reference_id: PMID:18469096
      supporting_text: The α and β subunits (2 mg each) were mixed and renatured by dialysis
    - reference_id: PMID:18469096
      supporting_text: Reconstitution of MCCase and GCCase was carried out using the subunits purified
        as described above
    - &id002
      reference_id: PMID:22158123
      supporting_text: BC catalyzes the MgATP-dependent carboxylation of biotin, and then a carboxyltransferase
        (CT) activity, supplied by the β subunit, catalyzes the transfer of the carboxyl group to
        the acceptor
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: PSEUDOCAP
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: 'GO:0004485 methylcrotonoyl-CoA carboxylase activity on liuB (Q9I297) is coded
        enables, IDA, PMID:18469096. The activity belongs to the two-subunit enzyme, not to either
        chain: the full text of PMID:18469096, which is the IDA behind these rows, measured it on
        an enzyme reconstituted by mixing purified alpha and beta subunits and renaturing them, so
        no single subunit was shown active. The structure paper PMID:22158123 says why, for this organism''s
        own enzyme: the alpha subunit carries the biotin carboxylase and BCCP domains and the beta
        subunit supplies the carboxyltransferase activity, with roughly 80 A between the two active
        sites, so the carboxyl group has to be handed between chains. Both rows on both subunits should
        read contributes_to. CONFIRMED rather than PROBABLE because the reconstitution is stated in
        the full text rather than inferred from an abstract.'
      supported_by:
      - *id001
      - *id002
