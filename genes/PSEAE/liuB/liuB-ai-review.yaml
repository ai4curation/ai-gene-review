gene_symbol: liuB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: LiuB (PA2014) is the carboxyltransferase beta subunit of 3-methylcrotonyl-CoA 
  carboxylase (MCC) in the leucine/isovalerate utilization (Liu) pathway of Pseudomonas aeruginosa. 
  With the biotin-carrying alpha subunit LiuD it forms an alpha6beta6 holoenzyme in which the 
  beta-subunit hexamer binds the acyl-CoA and transfers the carboxyl group from LiuD carboxybiotin 
  to 3-methylcrotonyl-CoA, forming 3-methylglutaconyl-CoA. The recombinant LiuB/LiuD enzyme 
  carboxylates 3-methylcrotonyl-CoA but not geranyl-CoA. Because the acyclic terpene (Atu) pathway 
  joins the Liu pathway at methylcrotonyl-CoA, MCC is needed for both leucine/isovalerate and 
  acyclic monoterpenoid catabolism.
existing_annotations:
- term:
    id: GO:0004485
    label: methylcrotonoyl-CoA carboxylase activity
  evidence_type: IDA
  original_reference_id: PMID:18469096
  qualifier: enables
  review:
    summary: Activity of the recombinant LiuB/LiuD methylcrotonyl-CoA carboxylase.
    action: ACCEPT
    reason: The recombinant MCCase carboxylates 3-methylcrotonyl-CoA with micromolar affinities for 
      MC-CoA, ATP and bicarbonate and does not carboxylate geranyl-CoA. LiuB is the 
      carboxyltransferase that acts on the acyl-CoA, so this is its core activity (strictly a 
      property of the holoenzyme, as for human MCCC2).
    supported_by:
    - reference_id: PMID:18469096
      supporting_text: The apparent K(0.5) (affinity constant for non-Michaelis-Menten kinetics 
        behavior) values of MCCase for MC-CoA, ATP, and bicarbonate were 9.8 microM, 13 microM, and 
        0.8 microM, respectively.
    - reference_id: PMID:18469096
      supporting_text: MCCase activity showed sigmoidal kinetics for all the substrates and did not 
        carboxylate G-CoA.
