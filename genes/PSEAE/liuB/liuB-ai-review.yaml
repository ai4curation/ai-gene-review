  review:
    summary: PseudoCAP IMP linking MCC to acyclic isoprenoid catabolism.
    action: MODIFY
    reason: The claim is correct for P. aeruginosa, because the Atu pathway enters the Liu pathway 
      at methylcrotonyl-CoA, so MCC performs a step of acyclic terpene degradation. The substrates 
      are acyclic monoterpenoids (citronellol, geraniol), so the general isoprenoid term is refined 
      to monoterpenoid catabolic process, as for LiuC.
