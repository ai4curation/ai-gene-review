- term:
    id: GO:0016743
    label: carboxyl- or carbamoyltransferase activity
  evidence_type: IC
  original_reference_id: PMID:22158123
  qualifier: enables
  review:
    summary: The half-reaction LiuB itself catalyses, which no current row records.
    action: NEW
    reason: Every molecular-function row on this entry is either the holoenzyme activity or a generic
      ligase term; the subunit's own step is unannotated. The structure paper states it for this enzyme
      -- the carboxyltransferase activity is supplied by the beta subunit, which transfers the carboxyl
      group to the acceptor -- and the record carries the matching Pfam Carboxyl_trans domain and
      both CoA-carboxyltransferase InterPro domains. GO:0016743 is the transfer of a carboxyl group
      from a donor to an acceptor, which is that step. Proposed as IC, an inference drawn here from
      the full text and the domain architecture rather than from a row in GOA.
    supported_by:
    - *id002
    - *id004
