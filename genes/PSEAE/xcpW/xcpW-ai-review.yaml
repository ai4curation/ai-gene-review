taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: XcpW (PA3098, also PddD) is the GspJ-family minor pseudopilin of the Xcp type II
  secretion system of Pseudomonas aeruginosa, the machine that exports elastase, lipases and other
  exoproteins from the periplasm across the outer membrane. It is made as a prepilin-like
  precursor whose short leader is removed by the prepilin peptidase PilD/XcpA, which also
  N-methylates the new N-terminal phenylalanine; the mature protein is anchored in the inner
  membrane by its N-terminal helix and has a type IV pilin-like periplasmic domain. XcpW forms with
  XcpV the core of the pseudopilus tip complex, which also recruits XcpX and XcpU, and is required
  for type II secretion.
