suggested_questions:
- question: >-
    Is the c-di-GMP binding site in the C-terminal effector domain or at the dimer interface,
    and does c-di-GMP change BrlR's choice between activating (mex operons) and repressing
    (oprH-phoPQ) promoters?
suggested_experiments:
- description: >-
    Map the c-di-GMP binding residues of purified BrlR by mutagenesis and test the variants
    for promoter binding and in vivo activation of mexA and repression of oprH.
