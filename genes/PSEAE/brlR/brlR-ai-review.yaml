gene_symbol: brlR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  BrlR (biofilm resistance locus regulator, PA4878) is a MerR-like transcriptional regulator
  of Pseudomonas aeruginosa with an N-terminal MerR helix-turn-helix DNA-binding domain and
  a C-terminal GyrI-like (Cass2) effector domain. It is expressed mainly in biofilms and is
  responsive to the second messenger c-di-GMP, which BrlR binds directly (one c-di-GMP per
  BrlR dimer) and which enhances its dimerisation and promoter binding; pyocyanin also enhances
  BrlR activity. BrlR binds its own promoter and activates the mexAB-oprM and mexEF-oprN multidrug
  efflux operons and several ABC transporters, which underlies the high-level antibiotic tolerance
  of P. aeruginosa biofilms. Unusually for the family it also represses the oprH-phoPQ operon,
  binding its promoter directly, and so lowers PhoPQ-driven colistin resistance.
