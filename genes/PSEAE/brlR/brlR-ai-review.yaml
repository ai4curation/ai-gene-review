- id: PMID:22730129
  title: >-
    The MerR-like transcriptional regulator BrlR contributes to Pseudomonas aeruginosa biofilm
    tolerance.
  findings:
  - statement: >-
      BrlR is a biofilm-expressed MerR-family regulator required for high-level biofilm drug
      tolerance.
    supporting_text: >-
      Here we report that the transcriptional regulator BrlR, a member of the MerR family
      of multidrug transport activators, plays a role in the high-level drug tolerance of
      biofilms formed by Pseudomonas aeruginosa.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified (Liao and Sauer 2012). Abstract only (PMC full text not returned by
      the PubMed MCP). The abstract reports genetics and drug susceptibility; it does not
      describe the direct assay behind the PseudoCAP IDA positive-regulation row, but the
      full text may. Direct activation of efflux genes is documented elsewhere (PMID:24612375
      and UniProt).
- id: PMID:23935054
  title: >-
    The MerR-like regulator BrlR impairs Pseudomonas aeruginosa biofilm tolerance to colistin
    by repressing PhoPQ.
  findings:
  - statement: BrlR binds the oprH-phoPQ promoter (EMSA) and represses the operon.
    supporting_text: >-
      Taken together with the gene expression results, our findings indicate that BrlR is
      involved in transcriptional regulation of the oprH-phoPQ operon, acting as a repressor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. EMSA with tagged BrlR on the oprH promoter plus qRT-PCR in mutant
      and overexpressing strains; directly supports the PseudoCAP IDA negative-regulation
      row.
- id: PMID:24612375
  title: BrlR from Pseudomonas aeruginosa is a c-di-GMP-responsive transcription factor.
  findings:
  - statement: BrlR binds its own promoter and binds c-di-GMP in vitro.
    supporting_text: >-
      BrlR was found to bind c-di-GMP in vitro at a ratio of one c-di-GMP per two BrlR.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Source of the CollecTF rows (cis-regulatory region binding, activator
      activity, protein-DNA complex).
