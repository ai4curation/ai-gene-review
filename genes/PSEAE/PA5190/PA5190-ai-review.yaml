  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5190 is a 200-residue soluble flavoenzyme of the nitroreductase family in Pseudomonas
  aeruginosa, and one of five quinone oxidoreductases of this organism shown to reduce
  quinone substrates by a concerted two-electron mechanism. Two-electron transfer bypasses
  the reactive semiquinone intermediate that one-electron reduction would leave behind, so
  enzymes of this kind are thought to contribute to antioxidant defence; for the P.
  aeruginosa set this protective effect is masked in wild-type cells by the dominant catalase
  KatA and becomes apparent only in a katA mutant background. Members of the nitroreductase
  family typically use NAD(P)H and a flavin cofactor and accept a broad range of quinone and
  nitroaromatic electron acceptors.
