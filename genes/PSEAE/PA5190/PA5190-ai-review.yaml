  knowledge_gaps:
  - gap_statement: >-
      Whether PA5190 reduces nitroaromatic compounds is untested. It sits in the
      nitroreductase family and its submitted name calls it a probable nitroreductase, but
      no nitroaromatic substrate has been assayed for this protein and the family
      assignment's only evidence on the record is an association rule, so the physiological
      substrate and whether nitroreduction or quinone reduction is the primary activity are
      both open.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      The physiological role of this enzyme is undetermined. Overexpression gave no
      detectable H2O2 protection in wild-type cells, and the paper attributes that to masking
      by the catalase KatA, with the protective effect emerging only for the WrbA and MdaB
      orthologs in a katA mutant. Whether PA5190 contributes to oxidative-stress defence at
      native expression levels, and under what conditions it is induced, is not known.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Which of the five named enzymes in this paper is PA5190? The abstract gives names and the
    four merged siblings account for WrbA, ChrR, MdaB and NQO1, leaving NfsB, and PA5190 is a
    nitroreductase-family protein - but the entry carries no gene name and nothing checkable
    states the correspondence, so it should be confirmed from the full text before being
    relied on.
- question: >-
    Does PA5190 have a preferred physiological electron acceptor, or is it a generalist? The
    nitroreductase family is notoriously promiscuous, and distinguishing a genuine quinone
    reductase from broad in vitro reactivity matters for whether the accepted activity is the
    protein's function or one of its capabilities.
suggested_experiments:
- description: >-
    Measure steady-state kinetics of purified PA5190 against a panel of quinones and
    nitroaromatics to determine whether quinone reduction is the catalytically preferred
    reaction or one activity among several.
- description: >-
    Delete PA5190 singly and together with the other four oxidoreductases in a katA mutant
    background and challenge with H2O2, to test whether it contributes to oxidative-stress
    resistance at native expression rather than on overexpression.
