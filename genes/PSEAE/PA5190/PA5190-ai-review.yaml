      each enzyme was shown to reduce quinone substrates with only minimal semiquinone
      formation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Green, La Flamme & Ackerley, J Microbiol 2014; DOI
      10.1007/s12275-014-4208-8). Abstract only. The abstract identifies the five enzymes by
      name (MdaB, ChrR, WrbA, NfsB, NQO1) and not by locus tag, so which name belongs to
      PA5190 cannot be read off it; see the review notes for the elimination argument and
      its limits. What the abstract does establish without ambiguity is that each of the
      five was assayed in vitro and reduced quinones with minimal semiquinone formation,
      which is what the activity row needs. The same paper is the source of the GO:0003955
      rows on PA0949, PA1204, PA2580 and PA4975, all of which accepted the term.
