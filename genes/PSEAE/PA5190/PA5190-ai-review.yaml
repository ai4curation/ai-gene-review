  review:
    summary: >-
      PseudoCAP row from the paper that assayed five P. aeruginosa quinone oxidoreductases
      in vitro. PA5190 is one of the five and the last unreviewed member of this shared
      claim; the other four accepted the term.
    action: ACCEPT
    reason: >-
      Core molecular function, and consistent with the four merged members of the same
      claim. The activity was measured directly on the purified enzymes rather than inferred
      from a phenotype, and PA5190's nitroreductase family is an NAD(P)H-dependent
      flavoenzyme family whose members reduce quinones, so the term fits both the experiment
      and the fold. One observation carried over from the merged PA0949 review rather than
      filed as a new finding: the evidence is an in vitro assay, so IDA would be the natural
      code rather than IMP, but the same understatement appears on all five rows of this
      claim, which makes it a uniform practice rather than a slip, and the cache is
      abstract-only.
