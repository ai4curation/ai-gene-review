core_functions:
- description: Membrane-anchored, periplasm-facing SGNH component of alginate O-acetylation.
    Its purified domain has measured acetylesterase capacity on a surrogate substrate, but
    the physiological transfer reaction and its donor/acceptor remain unresolved; that assay
    is not assigned as the core native molecular function.
