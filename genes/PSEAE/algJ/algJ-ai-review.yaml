- term:
    id: GO:0008126
    label: acetylesterase activity
  evidence_type: IDA
  original_reference_id: PMID:25165982
  review:
    summary: The purified P. aeruginosa AlgJ periplasmic domain hydrolyzes an acetylated reporter
      substrate.
    action: NEW
    reason: Direct PaAlgJ79–379 activity assays establish acetylesterase activity. The crystal
      structure is from P. putida, but the target protein was assayed separately. This measured
      surrogate-substrate reaction is not proof of native alginate deacetylation or of acetyl
      transfer from AlgJ to AlgX. It is retained outside the core molecular-function assignment
      because the native reaction and substrates remain unresolved.
    supported_by:
    - reference_id: PMID:25165982
      supporting_text: PaAlgJ79–379 and PpAlgJ75–370 were both assayed to demonstrate that
        the enzymes are functionally equivalent.
    - reference_id: PMID:25165982
      supporting_text: Using the substrate 3-carboxyumbelliferyl acetate, the kinetic parameters
        for PaAlgJ79–379 and PpAlgJ75–370 were observed to be comparable
