  label: Pseudomonas aeruginosa PAO1
description: AlgJ is an inner-membrane-anchored periplasmic SGNH hydrolase-like protein required
  for alginate O-acetylation in Pseudomonas aeruginosa. Its soluble periplasmic domain hydrolyzes
  an acetylated reporter substrate in vitro, and active-site substitutions impair alginate
  acetylation in cells. Unlike AlgX, AlgJ binds polymannuronate weakly or not detectably under
  the tested conditions and has not been established as the terminal polymer acetyltransferase.
  It is proposed to relay acetyl groups between AlgI and AlgX, with AlgF helping organize
  the periplasmic machinery.
