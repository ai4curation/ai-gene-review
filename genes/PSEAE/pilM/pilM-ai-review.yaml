suggested_questions:
- question: >-
    GO has no cellular component for the type IV pilus assembly machine (the
    PilBTCMNOPQ envelope-spanning apparatus) distinct from GO:0044096, the
    surface fibre. Should a "type IV pilus machine" complex term be added, so
    that machine components such as PilM, PilN, PilO, PilP and PilQ are not
    annotated to the fibre?
- question: >-
    What is the role of ATP binding by PilM, given that it does not appear to
    hydrolyse ATP: does nucleotide state switch PilM between PilB- and
    PilT-bound conformations during extension and retraction?
suggested_experiments:
- description: >-
    Test whether ATP-binding-site mutants of P. aeruginosa PilM (P-loop
    18-23) still bind PilN, PilB and PilT and support twitching, to establish
    whether nucleotide binding is required for motor coupling.
