  title: PilMNOPQ from the Pseudomonas aeruginosa type IV pilus system form a transenvelope
    protein interaction network that interacts with PilA.
  findings:
  - statement: >-
      The cytoplasmic N-terminal tail of PilN binds PilM, linking the
      cytoplasm to the PilNOPQ transenvelope complex.
    supporting_text: >-
      the N-terminal cytoplasmic tail of PilN binds to the actin-like protein
      PilM
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Tammam et al. 2013, J Bacteriol); full text cached.
- id: PMID:27022027
  title: PilN Binding Modulates the Structure and Binding Partners of the Pseudomonas
