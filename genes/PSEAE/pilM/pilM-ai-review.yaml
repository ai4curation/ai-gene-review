id: G3XD28
gene_symbol: pilM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PilM (PA5044) is the cytoplasmic, actin-like component of the type IVa pilus
  alignment subcomplex of Pseudomonas aeruginosa, encoded first in the
  pilMNOPQ operon. The 354-residue protein has an FtsA/MreB-type actin fold
  that binds ATP and Mg2+ but has no detectable ATPase activity in
  orthologues. PilM associates with the inner membrane by binding the
  conserved cytoplasmic N-terminal tail of the bitopic membrane protein PilN;
  PilN binding monomerises PilM and closes its domains around the ATP site.
  Together with PilN, PilO and the lipoprotein PilP it forms the PilMNOP
  inner-membrane subcomplex, which, through PilP and the secretin PilQ, spans
  the cell envelope. PilM also binds the motor ATPases PilB and PilT and the
  platform protein PilC, connecting the alignment subcomplex to the motor.
  Loss of PilM destabilises the other subcomplex proteins and the PilQ
  secretin, abolishes surface pili, and therefore abolishes twitching motility
  and pilus-specific phage sensitivity.
