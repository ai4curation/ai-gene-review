- id: PMID:19857645
  title: PilM/N/O/P proteins form an inner membrane complex that affects the stability
    of the Pseudomonas aeruginosa type IV pilus secretin.
  findings:
  - statement: >-
      PilM/N/O/P form an inner-membrane complex; PilM co-fractionates with the
      inner membrane; loss of one component reduces the others and destabilises
      PilQ.
    supporting_text: >-
      Stability studies via Western blot analyses revealed that loss of one
      component has a negative impact on the levels of other members of the
      putative complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Ayers et al. 2009, J Mol Biol 394:128-42). Abstract-only
      here. Supports the PseudoCAP IMP motility and assembly rows and the
      UniProt EXP cytoplasm row; a PseudoCAP seed of the PTN001286216
      motility IBD.
- id: PMID:7565110
  title: Characterization of a five-gene cluster required for the biogenesis of type
    4 fimbriae in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Transposon and deletion mutants of pilM-P lack functional fimbriae
      (twitching, phage sensitivity, EM); PilM resembles FtsA/MreB/actin.
    supporting_text: >-
      PilM-P were found to be required for fimbrial biogenesis by
      complementation studies
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Martin et al. 1995, Mol Microbiol 16:497-508).
      Abstract-only here. Correct paper for the motility and assembly IMP
      rows; it does not support the PseudoCAP located_in type IV pilus row,
      which converts a no-fimbriae phenotype into a location. Sole seed of the
      PTN001286216 type IV pilus IBD and a seed of the motility IBD.
