- description: >-
    Cytoplasmic, ATP-binding actin-like component of the PilMNOP alignment
    subcomplex of the type IVa pilus machine. PilM docks on the inner membrane
    through the PilN N-terminal tail and binds the motor proteins PilB, PilT
    and PilC, coupling the cytoplasmic motor to the transenvelope
    alignment/secretin complex during pilus assembly and twitching motility.
