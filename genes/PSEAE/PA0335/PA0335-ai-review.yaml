taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0335 encodes the histidinol-phosphate phosphatase (Hol-Pase, EC 3.1.3.15) of Pseudomonas
  aeruginosa, which dephosphorylates L-histidinol phosphate to L-histidinol, the penultimate step of
  L-histidine biosynthesis. It is a 217-residue, standalone member of the HAD-like hydrolase
  superfamily (SerB family) with the Asp nucleophile and Mg(2+)-binding residues typical of HAD
  phosphatases, and is unrelated to the PHP-type (HisJ) and IMPase-type (HisN) HolPases.
  Inactivation of PA0335 causes a growth defect on glucose minimal medium through incomplete
  histidine auxotrophy, which is rescued by the Corynebacterium glutamicum HisN HolPase, and the
  protein has histidinol-phosphate phosphatase activity in vitro.
