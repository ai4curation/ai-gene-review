  review:
    summary: UniPathway-derived process annotation, confirmed by the PA0335 disruption phenotype and
      complementation by a heterologous HolPase.
    action: ACCEPT
    reason: >-
      PA0335 catalyses step 8 of histidine biosynthesis. Its inactivation causes incomplete histidine
      auxotrophy, and the defect is rescued by C. glutamicum hisN, which encodes an unrelated HolPase,
      tying the phenotype specifically to loss of HolPase activity (PMID:31862725). The partial
      auxotrophy indicates some backup activity in PAO1 but does not weaken the claim that PA0335
      performs this step.
    supported_by:
    - reference_id: PMID:31862725
      supporting_text: we found that the growth defect was due to incomplete histidine auxotrophy caused
        by PA0335 inactivation.
    - reference_id: file:PSEAE/PA0335/PA0335-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: Inactivation of the gene results in growth defects and incomplete auxotrophy of
        the mutant due to a deficiency in histidine synthesis. The growth defect of the mutant is
        rescued by expressing hisN from C.glutamicum.
- term:
    id: GO:0004401
    label: histidinol-phosphatase activity
  evidence_type: IEA
