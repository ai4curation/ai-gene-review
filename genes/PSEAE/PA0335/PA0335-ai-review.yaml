  supporting_entities:
  - EC:3.1.3.15
  review:
    summary: EC-mapped activity, directly supported by biochemical characterization of PA0335 as a
      Hol-Pase.
    action: ACCEPT
    reason: >-
      The EC 3.1.3.15 assignment in Swiss-Prot rests on PMID:31862725, which shows that PA0335 encodes
      Hol-Pase using genetic and biochemical methods. The protein carries the HAD-family catalytic
      Asp nucleophile and belongs to the Pseudomonas HolPase NCBIfam family. This is the core
      molecular function.
    supported_by:
    - reference_id: PMID:31862725
      supporting_text: PA0335 was shown to encode Hol-Pase, and its function and enzymatic activity were
        investigated using genetic and biochemical methods.
