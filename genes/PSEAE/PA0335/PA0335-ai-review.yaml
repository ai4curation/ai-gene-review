suggested_questions:
- question: Which enzyme provides the residual histidinol-phosphate phosphatase activity that makes the
    PA0335 mutant only partially auxotrophic?
suggested_experiments:
- description: Screen PA0335 double mutants (with other HAD-family and IMPase-family phosphatase genes)
    for complete histidine auxotrophy, and assay candidate purified proteins against histidinol
