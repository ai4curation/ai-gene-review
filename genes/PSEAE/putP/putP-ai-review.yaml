id: Q9I5F5
gene_symbol: putP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PutP (PA0783) is the sodium/proline symporter of Pseudomonas aeruginosa, a multi-pass inner-membrane
  transporter of the solute:sodium symporter family (TC 2.A.21) that couples L-proline uptake
  to the inward sodium gradient. It is 77-84% identical to the characterised PutP proteins
  of Escherichia coli and other pseudomonads. putP forms an operon with putA, which encodes
  the bifunctional proline dehydrogenase/pyrroline-5-carboxylate dehydrogenase, and the operon
  is induced by proline through the AraC-family activator PruR. A putP mutant grows poorly
  on proline as sole carbon and nitrogen source, so PutP is the major proline uptake system
  for proline catabolism.
references:
- id: PMID:12270821
  title: >-
    Divergent structure and regulatory mechanism of proline catabolic systems: characterization
    of the putAP proline catabolic operon of Pseudomonas aeruginosa PAO1 and its regulation
    by PruR, an AraC/XylS family protein.
  findings:
  - statement: >-
      A putP knockout grows poorly on proline; PutP is the major proline transporter for proline
      utilization.
    supporting_text: >-
      Thus, PA0781 appears to be irrelevant to proline utilization and PutP PAO is the major
      proline transporter for proline utilization in strain PAO1, as it is in enteric bacteria
  - statement: PutP of PAO1 is 77-84% identical to PutP of other pseudomonads and E. coli.
    supporting_text: >-
      PutP PAO is highly homologous to the PutP proteins of P. fluorescens (84% identity),
      P. putida (80% identity), and E. coli (77% identity).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. PseudoCAP source for the IMP GO:0015193 row, a seed of PTN001371338
      and PTN005155964. The evidence is a growth defect of the putP knockout on proline, not
      a transport assay; with the high identity to E. coli PutP, the authors' conclusion that
      PutP is the main proline transporter is well founded.
