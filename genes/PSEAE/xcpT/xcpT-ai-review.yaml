id: Q00514
gene_symbol: xcpT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: XcpT (PA3101, also PddA) is the GspG-family major pseudopilin of the Xcp type II
  secretion system of Pseudomonas aeruginosa, the machine that exports folded enzymes from the
  periplasm across the outer membrane. It is made as a prepilin-like precursor that is inserted
  into the inner membrane by the SRP-Sec route; the prepilin peptidase PilD/XcpA removes its short
  leader and N-methylates the new N-terminal phenylalanine. The mature protein keeps a hydrophobic
  N-terminal helix in the inner membrane and polymerises into a periplasmic pseudopilus fibre whose
  assembly is primed by the minor pseudopilins XcpU, XcpV, XcpW and XcpX and whose length is
  limited by XcpX. When overproduced it assembles into a surface-exposed hyper-pseudopilus that
  increases adhesion.
