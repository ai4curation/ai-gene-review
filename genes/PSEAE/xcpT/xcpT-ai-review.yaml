- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:12700254
  qualifier: enables
  review:
    summary: XcpT is the structural subunit of the type II pseudopilus fibre.
    action: NEW
    reason: >-
      The GOA set records XcpT only as a component and participant of the T2SS, with no molecular
      function. Overproduced XcpT polymerises into a multifibrillar surface pseudopilus visualised
      by electron microscopy, and no other Xcp pseudopilin can do so, so structural molecule
      activity is directly supported for XcpT specifically rather than for pseudopilins generally.
      The electron microscopy was done on the hyper-pseudopilus formed on overexpression, not on the
      periplasmic fibre of a wild-type cell; what it shows is the polymerisation property of the
      subunit, which is the claim made here, and the periplasmic pseudopilus of the working machine
      is inferred rather than imaged.
    supported_by:
    - reference_id: PMID:12700254
      supporting_text: Image analysis and filtering of electron micrographs indicated that these
        appendages are composed of individual fibrils assembled together in a bundle structure
    - reference_id: PMID:16012171
      supporting_text: none of the other four pseudopilins are able to form a pseudopilus, suggesting
        that the assembly of such a structure is a unique property of XcpT
