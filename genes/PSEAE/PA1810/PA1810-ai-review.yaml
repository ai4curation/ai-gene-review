suggested_questions:
- question: >-
    Do OppA (PA1811) and OppB (PA1810) form a heteromeric binding protein, and
    which natural peptides (length, sequence) does each bind?
suggested_experiments:
- description: >-
    Purify OppA and OppB and measure binding of a peptide library and of
    pacidamycin by ITC or thermal shift, alone and mixed, to test whether binding
    needs both proteins.
  experiment_type: biochemical binding assay
