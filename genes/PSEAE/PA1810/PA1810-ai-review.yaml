core_functions:
- description: >-
    Periplasmic oligopeptide-binding subunit of the OppABCDE ABC importer. Together
    with OppA it captures peptide substrates (including the uridyl peptide
    antibiotic pacidamycin) in the periplasm and delivers them to the OppCD
    permease for ATP-driven uptake across the inner membrane.
  molecular_function:
    id: GO:1904680
    label: peptide transmembrane transporter activity
  directly_involved_in:
