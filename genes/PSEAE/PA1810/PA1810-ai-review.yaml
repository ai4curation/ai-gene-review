id: Q9I2T4
gene_symbol: PA1810
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1810 (OppB, 615 aa) is one of two periplasmic solute-binding proteins
  (bacterial solute-binding protein family 5, SBP_bac_5 / Peptide/Ni-binding) of
  the Opp oligopeptide ABC importer encoded by the oppABCDE-fabI operon
  (PA1811-PA1806). It carries an N-terminal signal peptide and acts in the
  periplasm with its paralogue OppA (PA1811, about 42% identical);
  OppC and OppD form the membrane permease and OppE the ATPase. Defined
  oppB mutants are highly resistant to the uridyl peptide antibiotic
  pacidamycin, and opp mutants take up less of the dipeptide
  Phe-Arg-beta-naphthylamide. Neither binding protein can substitute for the
  other, which suggests that OppA and OppB act together, possibly as a
  heteromeric binding protein. The operon is also needed for uptake of the
  tripeptide herbicide bialaphos. The natural peptide substrates have not been
  defined.
references:
- id: PMID:23979749
  title: High-level pacidamycin resistance in Pseudomonas aeruginosa is mediated by
    an opp oligopeptide permease encoded by the opp-fabI operon.
  findings:
  - statement: >-
      OppA (609 aa, PA1811) and OppB (615 aa, PA1810) are the two Opp periplasmic
      binding proteins; the protein lengths match the PAO1 loci.
    supporting_text: OppA (609 amino acids) and OppB (615 amino acids) are closely
      related (42.5% identity in CLUSTALW alignments)
  - statement: Both binding proteins are required for pacidamycin uptake and neither
      compensates for the other.
    supporting_text: This mutant analysis also indicated that both OppA and OppB periplasmic
      binding proteins were required for pacidamycin uptake and that they cannot compensate
      for each other.
  - statement: The Opp system transports the dipeptide PAbetaN, and transport is impaired
      in opp mutants.
    supporting_text: The Opp system was shown to be a bona fide oligopeptide transport
      system by demonstrating that transport of PAβN is impaired in opp mutants.
  - statement: OppA and OppB carry type I signal peptides and are predicted periplasmic
      binding proteins.
    supporting_text: The first two genes, oppA and oppB , whose coding sequences overlap,
      contain type I signal peptides; thus, they are probably periplasmic binding proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP oligopeptide transport rows on PA1811 and
      PA1810 (seed of the PTN008624512 IBD). Full text cached (PMC3811240) and
      read. Defined, non-polar oppA and oppB mutants were made and phenotyped
      (pacidamycin MIC); PAbetaN uptake was assayed in the spontaneous and
      transposon (oppB) mutants. The paper names the genes oppA and oppB but
      gives no PA numbers; the protein lengths (609 and 615 aa) identify them as
      PA1811 and PA1810.
