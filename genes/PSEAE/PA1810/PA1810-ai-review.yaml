  review:
    summary: >-
      PseudoCAP IMP and one of the seven seeds of the PTN008624512 IBD (peptide
      transport). The full text shows that the transposon insertion in mutant PAM1194 (pacidamycin resistant, reduced PAbetaN uptake) maps to oppB, and that an unmarked deletion of oppB (PAO1284) is highly pacidamycin resistant even though it still expresses OppA. The binding protein of an ABC importer captures the
