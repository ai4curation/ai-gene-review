- term:
    id: GO:0042884
    label: microcin transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008624519
  - UniProtKB:P33913
  review:
    summary: >-
      IBA from PTN008624519, seeded only by E. coli YejA, the binding protein of
      the YejABEF importer that takes up microcin C. Microcins are ribosomally
      made peptide antibiotics of enteric bacteria. No microcin uptake has been
      reported for P. aeruginosa Opp. Its known substrates are pacidamycin (a
      non-ribosomal uridyl peptide), PAbetaN and bialaphos.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The substrate specificity of one E. coli binding protein is pushed to a
      subnode that includes the P. aeruginosa Opp binding proteins, which have
      no microcin data. Substrate specificity varies among SBP family 5 members,
      so it does not transfer reliably. The broader oligopeptide transport claim
      is what the evidence supports.
    supported_by:
    - reference_id: PMID:23979749
      supporting_text: The Opp system was shown to be a bona fide oligopeptide transport
        system by demonstrating that transport of PAβN is impaired in opp mutants.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008624519
        source_label: PTN008624519
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Microcin C import is a YejA-specific substrate specificity; it does not
          extend to the P. aeruginosa OppA/OppB binding proteins.
      - source_id: UniProtKB:P33913
        source_label: E. coli YejA (IMP/IDA PMID:17873039)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Sound for YejA itself.
