suggested_questions:
- question: >-
    Does P. aeruginosa AmpE affect AmpC induction or basal expression on its
    own, independently of AmpD, and if so through which muropeptide or
    membrane signal?
suggested_experiments:
- description: >-
    Construct a clean, non-polar in-frame ampE deletion in PAO1 and measure
    basal and cefoxitin-induced AmpC activity and beta-lactam MICs, with ampE
    complementation and an ampD ampE double mutant as controls.
