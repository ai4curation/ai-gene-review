references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:9835532
  title: An ampD gene in Pseudomonas aeruginosa encodes a negative regulator of AmpC
    beta-lactamase expression.
  findings:
  - statement: ampD and ampE form an operon; ampD complements E. coli ampD mutants.
    supporting_text: >-
      These genes are transcribed in the same orientation and form an operon.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Langaee et al. 1998 Antimicrob Agents Chemother 42:3296-300; abstract
      only. Sole support of the PseudoCAP IMP that seeds the PTN002214697
      response-to-antibiotic IBD; the abstract describes only AmpD function,
      so whether an ampE phenotype was measured cannot be checked.
- id: PMID:16251318
  title: Molecular mechanisms of beta-lactam resistance mediated by AmpC hyperproduction
    in Pseudomonas aeruginosa clinical strains.
  findings:
  - statement: >-
      Some ampD mutants of clinical isolates are complemented only by ampDE,
      suggesting an indirect role of AmpE in resistance.
    supporting_text: >-
      AmpE plays an indirect role in resistance
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Juan et al. 2005 Antimicrob Agents Chemother; abstract cached.
- id: PMID:2607970
  title: 'Regulation of enterobacterial cephalosporinase production: the role of a
    membrane-bound sensory transducer.'
  findings:
  - statement: >-
      E. coli/Enterobacter AmpE is a cytoplasmic membrane protein whose loss
      blocks AmpC induction; E. coli has no ampR.
    supporting_text: >-
      loss of AmpE results in a total block in induction, despite the presence
      of the activator, AmpR.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Honoré et al. 1989 Mol Microbiol; abstract cached. Conflicts with
      Lindquist et al. 1989 (PMID:2691840) on whether AmpE is needed for
      induction.
- id: PMID:2691840
  title: Signalling proteins in enterobacterial AmpC beta-lactamase regulation.
  findings:
  - statement: >-
      AmpE is an integral membrane protein that lowers basal AmpC expression
      in the absence of AmpD but is not needed for induction.
    supporting_text: >-
      In the absence of AmpD, increasing levels of AmpE therefore decrease the
      basal expression of AmpC beta-lactamase in an AmpR-dependent manner.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Lindquist et al. 1989 Mol Microbiol; abstract cached.
