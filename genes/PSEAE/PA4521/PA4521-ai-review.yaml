taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4521 is the P. aeruginosa AmpE homologue, a polytopic inner-membrane
  protein with five predicted transmembrane helices, encoded second in the
  ampDE operon after the cytoplasmic anhydromuropeptide amidase AmpD. AmpD
  limits induction of the chromosomal AmpC beta-lactamase by recycling the
  peptidoglycan fragments that activate the regulator AmpR. AmpE has been
  proposed to sense or relay the cell-wall signal in this pathway, but its
  role is unresolved: in enterobacteria one study found AmpE essential for
  beta-lactamase induction and another found it dispensable, and in
  P. aeruginosa clinical isolates it seems to contribute only indirectly to
  AmpC-mediated resistance. Its biochemical activity is unknown.
