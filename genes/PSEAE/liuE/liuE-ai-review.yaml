- term:
    id: GO:0046951
    label: ketone body biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0031877
  - PANTHER:PTN000031222
  - RGD:620554
  - UniProtKB:P35914
  - UniProtKB:P35915
  - UniProtKB:Q8TB92
  review:
    summary: PAINT IBA of ketone body biosynthesis from PTN000031222.
    action: MARK_AS_OVER_ANNOTATED
    reason: The HMG-CoA lyase reaction does produce acetoacetate, but ketone body biosynthesis is 
      the animal hepatic ketogenic programme that exports acetoacetate and 3-hydroxybutyrate as 
      fuels. In P. aeruginosa the acetoacetate is a catabolic product of leucine and terpene 
      degradation, and no bacterial ketogenesis is described. The node correctly carries the lyase 
      activity, but the process context is lineage-specific to the animal seeds, so for this 
      bacterial descendant it is an over-annotation, as for P. putida MvaB.
    supported_by:
    - reference_id: PMID:19459965
      supporting_text: an essential enzyme for growth in both leucine and acyclic terpenes
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000031222
        source_label: PTHR42738 HMG-CoA lyase node
        comment: The ketogenesis seeds are animal (human, rat, mouse, fly) HMGCL orthologs; the 
          lyase activity, not the ketogenic context, is what the bacterial clade inherits.
