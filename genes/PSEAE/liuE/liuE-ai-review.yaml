suggested_questions:
- question: How does one active site accommodate both HMG-CoA and the much bulkier HIHG-CoA, and
    what are the relative catalytic efficiencies? Only HMG-CoA kinetics have been published.
- question: Should the animal-seeded ketone body biosynthesis IBD at PANTHER PTN000031222 be
    restricted to the animal clade, so that bacterial, fungal and plant HMG-CoA lyases are not
    annotated to ketogenesis?
suggested_experiments:
- description: Determine kinetic parameters of purified LiuE for 3-hydroxy-3-isohexenylglutaryl-CoA
    versus HMG-CoA to establish which reaction dominates in cells growing on citronellol.
  experiment_type: in vitro enzyme assay
- description: Measure steady-state kinetics of purified LiuE side by side on HMG-CoA and on
    enzymatically prepared HIHG-CoA, and test whether active-site variants can separate the two
    activities, which would show whether the bifunctionality is incidental or selected for.
