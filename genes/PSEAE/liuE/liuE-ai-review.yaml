gene_symbol: liuE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: LiuE (PA2011) is the bifunctional hydroxyacyl-CoA lyase of the liuRABCDE cluster of
  Pseudomonas aeruginosa. It is a 300-residue, divalent cation-dependent homodimeric enzyme of the
  HMG-CoA lyase family. It cleaves (3S)-3-hydroxy-3-methylglutaryl-CoA to acetyl-CoA plus
  acetoacetate (EC 4.1.3.4), the terminal step of L-leucine and isovalerate catabolism, and it also
  cleaves 3-hydroxy-3-isohexenylglutaryl-CoA to 7-methyl-3-oxooct-6-enoyl-CoA plus acetate (EC
  4.1.3.26), the corresponding step of the geranyl-CoA pathway that degrades acyclic monoterpenes of
  the citronellol family. Because the atu cluster that handles the terpene pathway has no lyase of
  its own, LiuE serves both routes, and cells lacking it cannot grow on leucine, isovalerate or
  acyclic terpenes. The acetoacetate it produces is a catabolic intermediate feeding central
  metabolism, not a circulating fuel as in vertebrate ketogenesis.
