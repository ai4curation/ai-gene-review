  review:
    summary: PAINT IBA of ketone body biosynthesis from PTN000031222.
    action: MARK_AS_OVER_ANNOTATED
    reason: The HMG-CoA lyase reaction does produce acetoacetate, but ketone body biosynthesis is
      the animal hepatic ketogenic programme that exports acetoacetate and 3-hydroxybutyrate as
      fuels. In P. aeruginosa the acetoacetate is a catabolic product of leucine and terpene
      degradation, and no bacterial ketogenesis is described. The node correctly carries the lyase
      activity, but the process context is lineage-specific to the animal seeds, so for this
      bacterial descendant it is an over-annotation, as for P. putida MvaB.
    supported_by:
    - reference_id: PMID:19459965
      supporting_text: an essential enzyme for growth in both leucine and acyclic terpenes
    - reference_id: PMID:19459965
      supporting_text: A mutant in the liuE gene (ORF PA2011) of P. aeruginosa was unable to utilize
        both leucine/isovalerate and acyclic terpenes as the carbon source.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000031222
        source_label: PTHR42738 HMG-CoA lyase node
        comment: The ketogenesis seeds are animal (human, rat, mouse, fly) HMGCL orthologs; the
          lyase activity, not the ketogenic context, is what the bacterial clade inherits.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000031222
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0046951
      cause: OTHER
      confidence: PROBABLE
      explanation: The GO:0046951 ketone body biosynthetic process IBD on PANTHER node PTN000031222
        is seeded only by animal HMG-CoA lyases (UniProtKB:P35914, UniProtKB:P35915,
        UniProtKB:Q8TB92, RGD:620554, FB:FBgn0031877), but the node spans bacterial, fungal and
        plant members and propagates the term to them as IBAs - including P. aeruginosa LiuE
        (Q9I2A0), where HMG-CoA cleavage is the terminal step of L-leucine, isovalerate and acyclic
        terpene catabolism and the acetoacetate produced is a catabolic intermediate, not a ketone
        body made as a circulating fuel. Requested change - move this IBD to the animal (or
        vertebrate) clade in which ketogenesis exists, leaving the family-level GO:0004419 and the
        catabolic process IBDs at the broader node. Filed as PROBABLE because the seed list and the
        chemistry are checkable, while the exact node at which to place the restriction is a
        judgement for the PAINT curator.
      supported_by:
      - reference_id: PMID:19597963
        supporting_text: The LiuE protein was purified as a His-tagged recombinant protein and in
          addition to show HMG-CoA lyase activity
