id: Q9I2A0
gene_symbol: liuE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  LiuE (PA2011) is the bifunctional hydroxyacyl-CoA lyase of the liuRABCDE
  cluster of Pseudomonas aeruginosa. It is a 300-residue, divalent
  cation-dependent homodimeric enzyme of the HMG-CoA lyase family. It cleaves
  (3S)-3-hydroxy-3-methylglutaryl-CoA to acetyl-CoA plus acetoacetate
  (EC 4.1.3.4), the terminal step of L-leucine and isovalerate catabolism, and
  it also cleaves 3-hydroxy-3-isohexenylglutaryl-CoA to
  7-methyl-3-oxooct-6-enoyl-CoA plus acetate (EC 4.1.3.26), the corresponding
  step of the geranyl-CoA pathway that degrades acyclic monoterpenes of the
  citronellol family. Because the atu cluster that handles the terpene pathway
  has no lyase of its own, LiuE serves both routes, and cells lacking it cannot
  grow on leucine, isovalerate or acyclic terpenes. The acetoacetate it
  produces is a catabolic intermediate feeding central metabolism, not a
  circulating fuel as in vertebrate ketogenesis.
references:
- id: PMID:19459965
  title: The Pseudomonas aeruginosa liuE gene encodes the 3-hydroxy-3-methylglutaryl
    coenzyme A lyase, involved in leucine and acyclic terpene catabolism.
  findings:
  - statement: A liuE mutant cannot use leucine/isovalerate or acyclic terpenes as
      carbon source.
    supporting_text: >-
      A mutant in the liuE gene (ORF PA2011) of P. aeruginosa was unable to
      utilize both leucine/isovalerate and acyclic terpenes as the carbon source.
  - statement: Purified recombinant LiuE has HMG-CoA lyase activity with measured
      kinetics.
    supporting_text: >-
      LiuE showed HMG-CoA lyase optimal activity at a pH of 7.0 and 37 degrees C,
      an apparent K(m) of 100 microM for HMG-CoA and a V(max) of 21 micromol
      min(-1) mg(-1).
  - statement: The gene encodes the HMG-CoA lyase required for growth on both leucine
      and acyclic terpenes.
    supporting_text: >-
      These results demonstrate that the liuE gene of P. aeruginosa encodes for
      the HMG-CoA lyase, an essential enzyme for growth in both leucine and
      acyclic terpenes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the PseudoCAP source for the GO:0006552 and GO:0046247 IMP
      rows and the seed of the GO:0006552 IBD on PTN000031222, and also cited by
      UniProt for an EXP row. Abstract only in the cache, but the abstract states
      the mutant phenotype, the purified-enzyme activity and the kinetics
      outright, so the molecular function here does not rest on the phenotype
      alone.
- id: PMID:19597963
  title: The bifunctional role of LiuE from Pseudomonas aeruginosa, displays additionally
    HIHG-CoA lyase enzymatic activity.
  findings:
  - statement: The purified protein has HIHG-CoA lyase activity in addition to HMG-CoA
      lyase activity, giving it a role in both the leucine/isovalerate and acyclic
      terpene pathways.
    supporting_text: >-
      The LiuE protein was purified as a His-tagged recombinant protein and in
      addition to show HMG-CoA lyase activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the UniProt source for the two EXP rows (GO:0004419 and
      GO:0047445). Abstract only, but the abstract states the second activity on
      purified protein directly. This is the reference that makes the
      bifunctionality, and therefore both EC numbers, experimental for this gene.
- id: PMID:16517656
  title: The atu and liu clusters are involved in the catabolic pathways for acyclic
    monoterpenes and leucine in Pseudomonas aeruginosa.
  findings:
  - statement: The cluster-level study inferred, rather than measured, that liuE encodes
      a probable bifunctional HMG-CoA lyase essential for both pathways.
    supporting_text: >-
      The liuE gene encodes a probable hydroxy-acyl-CoA lyase (probably HMG-CoA
      lyase), an enzyme with bifunctional activity that is essential for both AMTC
      and leucine degradation.
  - statement: The atu cluster has no HMG-CoA lyase homologue of its own, which is
      why liuE serves the terpene pathway too.
    supporting_text: >-
      it was named the atu cluster (acyclic terpene utilization), consisting of
      the atuCDEF genes and lacking the hydroxymethyl-glutaryl-coenzyme A (CoA)
      lyase (HMG-CoA lyase) homolog.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the PseudoCAP source for the GO:0004419 IMP and GO:0008300
      IMP rows. Abstract only, and the abstract itself describes the enzyme
      assignment as "probable" and sequence-based, with mutagenesis of whole
      clusters as the experimental part. That is why the molecular-function row it
      supports is treated as an indirect-phenotype coding, superseded by the later
      purified-enzyme work rather than wrong.
