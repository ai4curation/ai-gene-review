taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: LiuE (PA2011) is the HMG-CoA lyase of the leucine/isovalerate utilization (Liu) pathway
  of Pseudomonas aeruginosa, a divalent-cation-dependent (Mg2+ or Mn2+) homodimeric enzyme of the 
  HMG-CoA lyase family that cleaves (S)-3-hydroxy-3-methylglutaryl-CoA to acetoacetate and 
  acetyl-CoA, the terminal step of leucine catabolism. It also cleaves 
  3-hydroxy-3-isohexenylglutaryl-CoA to 7-methyl-3-oxooct-6-enoyl-CoA and acetate, a step of the 
  acyclic terpene utilization (Atu) pathway, so liuE mutants cannot grow on leucine, isovalerate or 
  acyclic terpenes.
