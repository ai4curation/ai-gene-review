- term:
    id: GO:0046951
    label: ketone body biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0031877
  - PANTHER:PTN000031222
  - RGD:620554
  - UniProtKB:P35914
  - UniProtKB:P35915
  - UniProtKB:Q8TB92
  review:
    summary: >-
      A third IBD at PTN000031222, seeded only by animal HMGCL and HMGCLL1
      proteins. In vertebrate liver, HMG-CoA cleavage is the last step of
      ketogenesis and the term names that physiological programme. LiuE runs the
      same chemistry as the terminal step of leucine, isovalerate and acyclic
      terpene catabolism - the acetoacetate is an intermediate entering central
      metabolism, and P. aeruginosa has no ketone-body biosynthesis to be part
      of.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The chemistry is shared, so the row is not a simple error, but the process
      is lineage-specific to animals and does not exist in this organism. The
      node spans bacteria, fungi, plants and animals, so the animal-seeded IBD
      should not reach the bacterial members; recorded as a GO_CENTRAL defect
      below.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000031222
        source_label: PTN000031222
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          All five seeds of the GO:0046951 IBD are animal HMGCL/HMGCLL1 proteins
          (human, rat, mouse, Drosophila). The node also holds bacterial, fungal
          and plant lyases, where the same reaction is catabolic rather than
          ketogenic.
      - source_id: UniProtKB:P35914
        source_label: human HMGCL
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Mitochondrial HMGCL genuinely performs the last step of hepatic
          ketogenesis; the process term is right for it and wrong for the
          bacterial leaf.
    supported_by:
    - reference_id: PMID:19459965
      supporting_text: >-
        A mutant in the liuE gene (ORF PA2011) of P. aeruginosa was unable to
        utilize both leucine/isovalerate and acyclic terpenes as the carbon
        source.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000031222
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0046951
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The GO:0046951 ketone body biosynthetic process IBD on PANTHER node
        PTN000031222 is seeded only by animal HMG-CoA lyases (UniProtKB:P35914,
        UniProtKB:P35915, UniProtKB:Q8TB92, RGD:620554, FB:FBgn0031877), but the
        node spans bacterial, fungal and plant members and propagates the term to
