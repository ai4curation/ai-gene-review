    label: 4-hydroxyproline epimerase activity
  evidence_type: EXP
  original_reference_id: PMID:17849014
  qualifier: enables
  review:
    summary: Purified PaHyPRE epimerizes 4-hydroxyproline and lacks proline racemase activity; this is the core activity.
    action: ACCEPT
    reason: >-
      The recombinant P. aeruginosa protein was assayed with both proline and
      4-hydroxyproline stereoisomers. It epimerized 4-hydroxy-L/D-proline, had
      no proline racemase activity, and lost activity when either catalytic
      cysteine was mutated, which ties the activity to the protein itself.
    supported_by:
    - reference_id: PMID:17849014
      supporting_text: >-
        B. pseudomallei and P. aeruginosa recombinant proteins presented no
        measurable PRAC activity but demonstrated strong epimerization of
        OH-L/D-Pro behaving as genuine OH-Pro epimerases.
    - reference_id: PMID:17849014
      supporting_text: >-
        In comparison to wild type HyPRE, C88SHyPRE and C236SHyPRE single
        mutations induce radical loss of OH-L/D-Pro epimerization establishing
        that proton transfer during HyPRE reaction is indeed dependent on the
        presence of the catalytic ‘Cys-Cys’ couple of each subunit (Figure 6).
