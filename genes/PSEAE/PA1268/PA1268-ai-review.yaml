- id: PMID:20665524
  title: 'Determination of 4-hydroxyproline-2-epimerase activity by capillary electrophoresis:
    A stereoselective platform for inhibitor screening of amino acid isomerases.'
  full_text_unavailable: true
  findings:
  - statement: >-
      A capillary-electrophoresis platform measures 4-hydroxyproline
      2-epimerase kinetics and identifies pyrrole-2-carboxylate as an
      inhibitor.
    supporting_text: >-
      pyrrole 2-carboxylic acid was found to be a selective inhibitor of
      4-hydroxyproline-2-epimerase
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Abstract only; it does not name the enzyme's source organism. The
      attribution to Q9I476 rests on UniProt's curated kinetic statements,
      which cite this paper for the trans-L and cis-D Km values. The author
      list (Gavina, White, Finan, Britz-McKibbin) is an analytical-chemistry
      and Sinorhizobium group rather than a Pseudomonas one, which sharpens
