taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1268 (LhpA) is the 4-hydroxyproline 2-epimerase of Pseudomonas aeruginosa,
  a PLP-independent member of the proline racemase family. It interconverts
  trans-4-hydroxy-L-proline and cis-4-hydroxy-D-proline using a pair of
  active-site cysteines (Cys88 and Cys236), one from each subunit of the
  homodimer, and has no detectable proline racemase activity. The reaction is
  the entry step of bacterial hydroxyproline catabolism, which delivers
  cis-4-hydroxy-D-proline to D-hydroxyproline dehydrogenase and onward to
  2-oxoglutarate. lhpA lies in a hydroxyproline-inducible locus controlled by
  the AraC-family regulator LhpR, and the recombinant protein is also reported
  to act as a B-cell mitogen.
