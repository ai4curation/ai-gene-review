      protein. Worth re-checking against the full text if it becomes
      reachable; the activity itself is established independently by
      PMID:17849014.
- id: PMID:24980702
  title: Prediction and characterization of enzymatic activities guided by sequence
    similarity and genome neighborhood networks.
  findings:
  - statement: >-
      Bacterial trans-4-hydroxy-L-proline catabolism runs through
      4-hydroxyproline epimerase, cis-4-hydroxy-D-proline oxidase, a
      DHDPS-superfamily deaminase and an alpha-ketoglutarate semialdehyde
      dehydrogenase.
    supporting_text: >-
      can be initiated by the epimerization of t4Hyp to cis-4-hydroxy-D-proline
      (c4Hyp) by 4HypE, followed by reactions catalyzed by c4Hyp oxidase (a
      member of the DAAO superfamily), c4Hyp imino acid dehydratase/deaminase
      (a member of the DHDPS superfamily), and α-ketoglutarate semialdehyde
      dehydrogenase (a member of the aldehyde dehydrogenase superfamily).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Q9I476 is in the paper's list of characterized
      accessions, and its 2AZP structure anchors the red 4HypE cluster.
