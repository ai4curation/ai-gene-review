suggested_questions:
- question: >-
    Is the reported B-cell mitogenic activity of recombinant P. aeruginosa
    HyPRE a property of the native enzyme during infection, or an effect of
    the purified recombinant protein?
- question: >-
    Which PAO1 genes encode the three subunits of the LhpBEF D-hydroxyproline
    dehydrogenase that acts on this enzyme's product? PMID:27145750 gives the
    operon as lhpABFE and lhpA is PA1268, so the subunits should be among the
    adjacent genes; UniProt currently assigns no lhpB, lhpE or lhpF gene name
    in PAO1, leaving PA1267 and PA1266 (both unnamed oxidoreductases) as
    candidates with no third subunit identified.
suggested_experiments:
- description: >-
    Compare growth on trans-4-hydroxy-L-proline and cis-4-hydroxy-D-proline in
    single lhpA and lhpK mutants and the double mutant, with
    stereoisomer-resolved metabolite measurements, to define how much
    epimerase flux each paralog carries.
  experiment_type: paralog-resolved genetics and metabolite profiling
