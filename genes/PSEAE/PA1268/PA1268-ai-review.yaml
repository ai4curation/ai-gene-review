- term:
    id: GO:0019470
    label: trans-4-hydroxy-L-proline catabolic process
  evidence_type: IMP
  original_reference_id: PMID:27145750
  qualifier: involved_in
  review:
    summary: LhpA catalyses the first step of hydroxyproline catabolism, and lhp knockouts impair growth on L-Hyp.
    action: NEW
    reason: >-
      The GOA rows give only the molecular function. LhpA performs the first
      chemical step of the route, epimerizing trans-4-hydroxy-L-proline to the
      cis-D substrate of D-hydroxyproline dehydrogenase. That is participation
      in the process, not just being required for it. Knockout growth
      phenotypes in the lhp loci, and P. aeruginosa growth on
      trans-4-hydroxy-L-proline, place that step in L-Hyp catabolism.
      KT2440 ProR carries the same process term in its review.
    supported_by:
    - reference_id: PMID:27145750
      supporting_text: >-
        Utilization of hydroxy-l-proline (l-Hyp) in Pseudomonas aeruginosa
        requires conversion of l-Hyp to d-Hyp followed by the d-Hyp
        dehydrogenase pathway
    - reference_id: PMID:27145750
      supporting_text: >-
        The importance of these genes on l-Hyp catabolism was supported by
        growth phenotype analysis on knockout mutants.
    - reference_id: PMID:22833679
      supporting_text: >-
        Pseudomonas putida and Pseudomonas aeruginosa convert L-hydroxyproline
        to α-ketoglutarate via four hypothetical enzymatic steps different from
        known mammalian pathways
