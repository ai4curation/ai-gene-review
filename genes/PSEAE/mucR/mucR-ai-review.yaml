id: Q9I310
gene_symbol: mucR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  MucR (PA1727) is an inner-membrane bifunctional diguanylate cyclase and c-di-GMP
  phosphodiesterase of Pseudomonas aeruginosa. An N-terminal MHYT sensor domain with
  seven predicted transmembrane helices anchors the protein, and the cytosolic
  GGDEF and EAL domains synthesise and hydrolyse c-di-GMP, respectively. MucR
  generates a localized c-di-GMP pool that activates alginate production through the
  c-di-GMP receptor Alg44, and its activity balance appears to shift with growth
  mode. mucR mutants are impaired in biofilm dispersion in response to nitric oxide
  and glutamate.
