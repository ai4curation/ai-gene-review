suggested_questions:
- question: >-
    What signal does the MHYT domain sense, and how is the balance between MucR's
    cyclase and phosphodiesterase activities switched between planktonic and biofilm
    growth?
suggested_experiments:
- description: >-
    Assay full-length MucR reconstituted in membranes for DGC and PDE activity with
    GGDEF and EAL active-site mutants, in the presence of candidate MHYT ligands (NO,
    O2, CO), to define how the sensor controls the activity balance.
