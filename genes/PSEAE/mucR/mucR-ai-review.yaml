- id: PMID:19088322
  title: MucR, a novel membrane-associated regulator of alginate biosynthesis in Pseudomonas
    aeruginosa.
  findings:
  - statement: MucR is in the cytoplasmic membrane with a cytosolic C-terminus.
    supporting_text: >-
      Translational reporter enzyme fusions with LacZ and PhoA suggested that MucR
      is located in the cytoplasmic membrane with a cytosolic C terminus.
  - statement: MucR activates alginate production via a localized c-di-GMP pool.
    supporting_text: >-
      MucR specifically regulates alginate biosynthesis by activation of alginate
      production through generation of a localized c-di-GMP pool in the vicinity of
      Alg44
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Source of the plasma membrane EXP row.
- id: PMID:23729646
  title: NO-induced biofilm dispersion in Pseudomonas aeruginosa is mediated by an
    MHYT domain-coupled phosphodiesterase.
  findings:
  - statement: Recombinant MucR has both diguanylate cyclase and PDE activity in vitro.
    supporting_text: >-
      In contrast, MucR displayed both diguanylate cyclase and PDE activity in vitro,
      which seemed regulated in a growth-dependent manner in vivo.
  - statement: mucR mutants are impaired in dispersion in response to NO and glutamate.
    supporting_text: >-
      Inactivation of mucR impaired biofilm dispersion in response to NO and glutamate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only (PubMed MCP returned no body). PseudoCAP source of the PDE IDA row
      that seeds PTN002403463, of a DGC IDA row and of the NO-response IMP row. The
      abstract states the in vitro DGC and PDE activities outright, which supports
      both MF rows.
