core_functions:
- description: Walker-motif secretion ATPase (GspE) of the Xcp type II secretion system; recruited
    by XcpY to the cytoplasmic face of the inner membrane, it dimerises and joins XcpS, XcpY and
    XcpZ in the assembly platform, where ATP hydrolysis provides the energy for pseudopilus
    assembly and substrate extrusion.
  supported_by:
