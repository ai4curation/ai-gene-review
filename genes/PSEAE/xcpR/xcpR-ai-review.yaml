taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: XcpR (PA3103) is the GspE-family secretion ATPase of the Xcp type II secretion system
  of Pseudomonas aeruginosa. It is a soluble, Walker-motif nucleotide-binding protein that has no
  hydrophobic anchor of its own and is recruited to the cytoplasmic face of the inner membrane by
  XcpY/GspL, where it joins XcpS, XcpY and XcpZ in the inner-membrane assembly platform of the
  secreton. Acting as a dimer, it is the motor that energises the machine - substitution of the
  conserved Walker A glycine abolishes export of exoproteins such as exotoxin A and acts
  dominant-negatively, leaving normally secreted enzymes stranded in the periplasm. It belongs to
  the same ATPase superfamily as the type IV pilus assembly motor PilB.
