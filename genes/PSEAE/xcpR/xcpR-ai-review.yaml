  review:
    summary: PAINT IBA from PTN001250205, the broad GspE/PilB-type ATPase node, seeded by a
      characterised family member.
    action: ACCEPT
    reason: ATP hydrolysis is the ancestral and defining activity of this P-loop motor family, and
      XcpR retains the complete Walker A and metal-binding sites; mutating the Walker A glycine
