suggested_questions:
- question: Has ATP hydrolysis ever been measured directly for purified XcpR, and is it stimulated
    by XcpY or by assembly into the XcpRSYZ platform? Both EC 7.4.2.8 and the protein-exporting
    ATPase activity row currently rest on Walker-site genetics alone.
- question: Is the Zn(2+) cofactor asserted by similarity to P37093 actually bound by XcpR, and
    does the tetracysteine motif contribute to dimerisation or to XcpY binding?
suggested_experiments:
- description: Measure ATPase activity of purified XcpR alone and in reconstituted XcpRSYZ, with
    and without the Walker A glycine substitution, to convert the inferred catalytic activity into
    a direct measurement and to test whether platform assembly activates the motor.
