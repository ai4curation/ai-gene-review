- id: PMID:8102361
  title: Mutations in the consensus ATP-binding sites of XcpR and PilB eliminate extracellular
    protein secretion and pilus biogenesis in Pseudomonas aeruginosa.
  findings:
  - statement: Serine substitution of the conserved Walker A glycine of XcpR abolishes exotoxin A
      secretion, and high-level expression of the mutant protein in wild-type bacteria causes a
      pleiotropic secretion defect with periplasmic accumulation of secreted enzymes.
    supporting_text: unable to secrete exotoxin A or assemble pili, respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary P. aeruginosa genetics (abstract only in the cache; PMC204960 exists).
      This is the paper the PseudoCAP GO:0015628 row should have been keyed to, and it is the
      stated evidence behind UniProt's EC 7.4.2.8 assignment.
