suggested_questions:
- question: What is the physiological quinone substrate of PA1024, and in what process does it act? Possible
    roles include NAD+/NADH balance during fatty acid catabolism and defence against quinone toxicity.
- question: Should the PAINT node PTN002844975 stay at generic oxidoreductase activity, or are the
    cross-kingdom members (plants, fungi, mycobacteria) close enough to PA1024 in the conserved NQR motifs to
    justify propagating NADH:quinone reductase activity?
suggested_experiments:
- description: Construct a PA1024 deletion mutant and profile its growth on fatty acids and its quinone
    tolerance, and measure intracellular NAD+/NADH ratios, to define the physiological role.
  experiment_type: genetic knockout with metabolic phenotyping
