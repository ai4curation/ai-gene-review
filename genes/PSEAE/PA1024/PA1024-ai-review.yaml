taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA1024 is a soluble, monomeric FMN-dependent flavoenzyme with a TIM-barrel fold, a member of
  the Pfam NMO (nitronate monooxygenase) family that was long annotated as 2-nitropropane dioxygenase. Kinetic
  characterisation of the purified enzyme showed that it has no nitronate monooxygenase activity. It is an
  NADH:quinone reductase that prefers NADH to NADPH and reduces a broad range of benzo- and naphthoquinones to
  hydroquinones by a Ping Pong Bi Bi mechanism. It also has a minor NADH oxidase activity, and it does not
  reduce azo dyes. It is the founding member of a class of NADH:quinone reductases within the NMO family. Its
  physiological role is unknown; it may help keep the NAD+/NADH balance.
