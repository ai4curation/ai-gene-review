- term:
    id: GO:0018580
    label: nitronate monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004136
  review:
    summary: InterPro2GO transfer from the NMO family signature IPR004136. Enzyme assays directly contradict it
      for PA1024.
    action: REMOVE
    reason: The purified enzyme was tested against nitronates and nitroalkanes and showed no nitronate
      monooxygenase activity. UniProt records this lack of activity, and attributes the earlier NMO report to a
      non-enzymatic reaction. IPR004136 covers both true NMOs and the PA1024-type NADH:quinone reductase class.
      Mapping the whole entry to GO:0018580 is therefore too broad, and this is a demonstrably wrong electronic
      transfer for this protein.
    supported_by:
    - reference_id: PMID:27502282
      supporting_text: Purified PA1024 did not exhibit nitronate monooxygenase activity
    - reference_id: file:PSEAE/PA1024/PA1024-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Does not exhibit nitronate monooxygenase activity; is inactive against propionate
        3-nitronate, 3-nitropropionate, nitroethane, 1-nitropropane, 2-nitropropane, and the anionic forms
        ethylnitronate, propyl-1-nitronate, and propyl-2-nitronate.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0018580
      cause: OTHER
      confidence: CONFIRMED
      explanation: The InterPro2GO mapping IPR004136 (NMO) -> GO:0018580 nitronate monooxygenase activity
        (resource InterPro / InterPro2GO) puts NMO activity on PA1024 (Q9I4V0). Ball et al. 2016 (PMID:27502282)
        showed that the purified enzyme lacks NMO activity and is an NADH:quinone reductase. The authors report
        that this NQR class covers more than 490 sequences in the NMO family. Restrict the mapping, for example
