  label: Pseudomonas aeruginosa PAO1
description: >-
  SpeC (PA4519) is the ornithine decarboxylase of Pseudomonas aeruginosa PAO1, a fold-type
  III pyridoxal 5'-phosphate decarboxylase of the ODC1-related subfamily that converts L-ornithine
  directly to putrescine and CO2. It provides one of two redundant putrescine-synthesis routes:
  genetic analysis showed that SpeC or the arginine decarboxylase SpeA alone supports normal
  growth, while a speA speC double mutant is a putrescine auxotroph. As a soluble PLP enzyme
  without export or membrane signals it is expected to act in the cytoplasm.
