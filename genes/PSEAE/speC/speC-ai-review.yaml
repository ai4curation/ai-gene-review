suggested_questions:
- question: >-
    Is P. aeruginosa SpeC regulated by an antizyme-like mechanism or by
    polyamine feedback, and what are its kinetic parameters for ornithine
    versus lysine?
suggested_experiments:
- description: >-
    Purify SpeC and measure ornithine and lysine decarboxylase kinetics, with
    and without putrescine and spermidine, to confirm substrate specificity and
    feedback control.
