id: Q9HVQ3
gene_symbol: speC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SpeC (PA4519) is the biosynthetic ornithine decarboxylase of Pseudomonas
  aeruginosa, a pyridoxal 5'-phosphate-dependent fold-type III decarboxylase of the
  eukaryote-like ODC family (Orn/Lys/Arg decarboxylase class II). It
  decarboxylates L-ornithine to putrescine, the direct route of putrescine
  synthesis. P. aeruginosa also makes putrescine from arginine through arginine
  decarboxylase (SpeA) followed by agmatine deiminase (AguA) and
  N-carbamoylputrescine amidohydrolase (AguB). The ODC and ADC activities are
  similar in size and either route alone supports normal growth, so only a speA
  speC double mutant (or an aguAB speC mutant) requires putrescine.
references:
- id: PMID:12634339
  title: Identification of the putrescine biosynthetic genes in Pseudomonas aeruginosa
    and characterization of agmatine deiminase and N-carbamoylputrescine amidohydrolase
    of the arginine decarboxylase pathway.
  findings:
  - statement: speC encodes ODC; ODC and ADC activities are similar and either suffices
      for growth.
    supporting_text: The activities of the two decarboxylases were similar and each
      enzyme alone appeared to direct sufficient formation of the polyamine for normal
      growth.
  - statement: A speA speC double mutant is a putrescine auxotroph.
    supporting_text: A mutant defective in both speA and speC was a putrescine auxotroph.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP ODC activity row, which seeds the
      PTN000159726 IBD. Abstract only (no PMC full text). The abstract states
      the gene identification, the ODC activity and the auxotrophy of the
      double mutant.
