id: P11720
gene_symbol: trpI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  TrpI (PA0037) is a LysR-type transcriptional regulator of Pseudomonas aeruginosa PAO1 encoded
  divergently from trpBA, the genes for the two tryptophan synthase subunits. TrpI binds two adjacent
  sites in the trpI-trpBA intergenic region. Without the inducer indoleglycerol phosphate (InGP), a
  tryptophan-pathway intermediate, it occupies site I (-52 to -77 of trpBA); InGP promotes binding of
  a
  second TrpI molecule at site II, extending the footprint to -32 and activating transcription initiation
  at the trpBA promoter. Purified TrpI with InGP activates trpBA and represses its own overlapping
  promoter in vitro. TrpI thereby couples tryptophan synthase expression to the supply of its substrate.
