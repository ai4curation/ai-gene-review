  - UniProtKB:Q96CU9
  - UniProtKB:Q9UI17
  review:
    summary: >-
      IBA from PTN000354057 placing the active enzyme in the cytoplasm. The donors were
      resolved against UniProt rather than read from the accessions, and the node is a deep
      and heterogeneous one in the FAD-dependent oxidoreductase superfamily: Q9UI17 is human
      mitochondrial dimethylglycine dehydrogenase, Q96CU9 human FAD-dependent
      oxidoreductase domain-containing protein 1, O46504 bovine mitochondrial pyruvate
      dehydrogenase phosphatase regulatory subunit and P33940 E. coli malate:quinone
      oxidoreductase, alongside fly, mouse, rat and yeast members. Several donors are
      mitochondrial and one is membrane-associated, so cytoplasm is the compartment the node
      settles on rather than a tight prediction from close relatives.
    action: ACCEPT
    reason: >-
      Correct compartment despite the breadth of the node, and as precise as the evidence
      allows for a soluble bacterial enzyme: glycine betaine catabolism to glycine runs on
      cytoplasmic substrates, and the characterised tetrameric sarcosine oxidases are
      soluble. A bacterium has no mitochondrion, so the eukaryotic donors' compartment
      cannot transfer, and this is the right generalisation of it. This row is also the
      comparator that shows the plasma-membrane IBA on soxA to be misplaced.
    supported_by:
    - reference_id: PMID:17951379
      reference_section_type: DISCUSSION
      supporting_text: Once in the cytoplasm, choline binds to BetI
