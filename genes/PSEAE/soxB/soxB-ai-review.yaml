  knowledge_gaps:
  - gap_statement: >-
      No sarcosine oxidase activity has been measured for the P. aeruginosa enzyme. The
      assignment rests on homology to the Corynebacterium and Arthrobacter systems plus a
      growth and 13C flux phenotype, so neither the kinetics nor the folate dependence of
      this organism's enzyme is known, and whether SoxB alone is catalytically competent or
      requires the other subunits for activity is untested.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Is the P. aeruginosa sarcosine oxidase folate-dependent like the Corynebacterium
    heterotetramer, or does it run the folate-independent reaction that yields formaldehyde?
    The two routes have different consequences for one-carbon metabolism during growth on
    glycine betaine.
- question: >-
    Does SoxB retain any activity without SoxA, SoxD and SoxG, or is the heterotetramer
    obligate? The paper's inability to rescue a related complex with single-gene constructs
    hints that subunit stoichiometry matters.
suggested_experiments:
- description: >-
    Purify the recombinant SoxBDAG complex and SoxB alone from P. aeruginosa and assay
    sarcosine-dependent oxygen consumption with and without tetrahydrofolate, to establish
    which subunits are needed for catalysis and which reaction the enzyme runs.
- description: >-
    Reconstitute the flavin content of purified SoxB by HPLC and spectroscopy to confirm
    whether it carries FAD, FMN or both, since the cofactor identity on the record is an
    unvetted prediction.
