  reference_review:
    relevance: NONE
    correctness: WRONG_IDENTIFIER
    review_notes: >-
      PubMed-verified: this PMID is the Staphylococcus aureus strain Newman genome sequence
      (Baba, Bae, Schneewind, Takeuchi & Hiramatsu, J Bacteriol 2008; DOI
      10.1128/JB.01000-07). It concerns neither P. aeruginosa, nor sarcosine, nor any
      oxidase, so it cannot support the GO:0008115 IMP row it is cited for. The intended
      paper is PMID:17951379, which sits immediately below a block of consecutive PMIDs from
      the same journal issue (all e-published 2007-10-19) and names the soxBDAG genes
      directly. The same transposition affects soxA, soxD and soxG, each citing a different
      wrong PMID from that block. Recorded as a WRONG_REFERENCE source defect on the IMP row.
    replacement:
      reference_id: PMID:17951379
      reason: WRONG_IDENTIFIER
      review_notes: >-
        The intended paper is the glycine betaine catabolism study whose mutant and NMR
        analyses establish that the soxBDAG genes are required for sarcosine catabolism in
        P. aeruginosa. Verified against PubMed by title, journal, authors and e-publication
        date, and the full text is cached locally and names soxB. Not inferred from PMID
        proximity alone: the paper's own abstract states the soxBDAG result.
- id: PMID:17951379
  title: >-
    Identification of two gene clusters and a transcriptional regulator required for
    Pseudomonas aeruginosa glycine betaine catabolism.
  findings:
  - statement: >-
      Mutant analysis plus 13C NMR establishes that the soxBDAG genes are required for
      sarcosine catabolism, with the authors describing the encoded enzyme as predicted
      rather than assayed.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Mutant analyses and 13 C NMR studies also confirmed that the soxBDAG genes, predicted
      to encode a sarcosine oxidase, are required for sarcosine catabolism
  - statement: >-
      Transposon insertions in all four sox genes give the same growth phenotype, placing
      them at or downstream of the conversion of dimethylglycine to sarcosine.
    reference_section_type: RESULTS
    supporting_text: The 10 mutants in class II were unable to grow on choline, GB, or DMG
  - statement: >-
      The sox gene names were assigned from homology to the characterised Corynebacterium
      sarcosine oxidase system, not from activity measured in this organism.
    reference_section_type: RESULTS
    supporting_text: >-
      designated based on their strong homology to the sarcosine oxidase system in
      Corynebacterium
  - statement: >-
      The characterised bacterial enzyme is a four-subunit complex, which is why the
      catalytic activity has to be apportioned between the subunits rather than asserted
      identically on each.
    reference_section_type: INTRODUCTION
    supporting_text: a heterotetrameric sarcosine oxidase converts sarcosine into glycine
  - statement: >-
      The authors' own summary of the sox result keeps the enzyme predicted and rests the
      conclusion on genetics and bioinformatics.
    reference_section_type: RESULTS
    supporting_text: >-
      Consistent with the genetic and bioinformatics evidence that soxBDAG genes encode an
      enzyme that catalyzes the conversion of sarcosine to glycine
  - statement: >-
      The pathway runs in the cytoplasm, which bears on the subunits' localisation rows.
    reference_section_type: DISCUSSION
    supporting_text: Once in the cytoplasm, choline binds to BetI
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Wargo, Szwergold & Hogan, J Bacteriol 2008; DOI 10.1128/JB.01393-07).
      Full text is cached. This is the paper the four sox IMP rows were meant to cite. Its
      evidence on sox is genetic and spectroscopic rather than enzymological: transposon
      mutants in soxABDG fail to grow on choline, glycine betaine or dimethylglycine, and a
      soxA mutant accumulates sarcosine under 13C-choline feeding. Note that the NMR
      experiment was performed on a soxA mutant only; no per-subunit data are reported for
      soxB, soxD or soxG. The paper therefore supports the pathway assignment of the operon
      but cannot attribute the catalytic step to an individual subunit.
