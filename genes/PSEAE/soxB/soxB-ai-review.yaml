gene_symbol: soxB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SoxB (PA5416) is the beta subunit of the heterotetrameric sarcosine oxidase of Pseudomonas
  aeruginosa, the enzyme that converts sarcosine (N-methylglycine) to glycine in the final
  step of glycine betaine catabolism. It is the catalytic chain of the complex: of the four
  sox subunits it is the one carrying a flavin cofactor and a D-amino-acid-oxidase-family
  flavoprotein domain, and the oxidative demethylation of sarcosine occurs at its active
  site, transferring the methylene group to tetrahydrofolate to give 5,10-methylene
  tetrahydrofolate and glycine. The soxBDAG operon acts downstream of the glycine betaine
  and dimethylglycine demethylases in a cytoplasmic pathway that lets the organism use
  glycine betaine, and the choline and carnitine it derives from, as a carbon and nitrogen
  source.
