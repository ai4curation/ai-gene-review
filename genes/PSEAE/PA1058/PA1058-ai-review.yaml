- id: PMID:16030218
  title: 'Characterization of a multigene-encoded sodium/hydrogen antiporter (sha)
    from Pseudomonas aeruginosa: its involvement in pathogenesis.'
  full_text_unavailable: true
  findings:
  - statement: >-
      The PA1054-PA1059 cluster encodes a Na+/H+ antiporter; the abstract reports mutation of PA1054 only.
    supporting_text: >-
      We disrupted PA1054 (a shaA homologue gene) and determined its effect on
      Na+ tolerance during growth, Na+ efflux, and pathogenicity in mice.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified (Kosono et al. 2005, J Bacteriol). Right paper for the Sha antiporter. The abstract reports a disruption of PA1054 only and antiport evidence for the whole cluster, so an IMP for PA1058 looks unsupported, but the full text (a scanned PDF not retrievable here) was not read; whether it is miscited is unverified. PMC
      copy is a scanned PDF; abstract read.
- id: PMID:11004162
  title: Effects of nonpolar mutations in each of the seven Bacillus subtilis mrp
    genes suggest complex interactions among the gene products in support of Na(+)
    and alkali but not cholate resistance.
  findings:
  - statement: >-
      B. subtilis MrpF alone restores cholate transport and increases Na+
      efflux in an mrp null strain.
    supporting_text: >-
      Expression of mrpF in the mrp null (VKN1) strain also restored cholate
      transport and increased Na+ efflux, indicating that MrpF does not
      require even low levels of other mrp gene expression for its own
      function.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Ito et al. 2000, J Bacteriol); full text cached.
      Family-level evidence for a possible stand-alone MrpF transport role.
- id: PMID:20624916
  title: Single site mutations in the hetero-oligomeric Mrp antiporter from alkaliphilic
    Bacillus pseudofirmus OF4 that affect Na+/H+ antiport activity, sodium exclusion,
    individual Mrp protein levels, or Mrp complex formation.
  findings:
  - statement: Mrp antiport requires the hetero-oligomeric complex of all Mrp subunits.
    supporting_text: >-
      Antiport activity requires hetero-oligomeric complexes of all six or
      seven hydrophobic Mrp proteins (MrpA-MrpG).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Morino et al. 2010, J Biol Chem); family-level evidence.
- id: PMID:29218041
  title: Mrp Antiporters Have Important Roles in Diverse Bacteria and Archaea.
  findings:
  - statement: MrpF-D32A abolishes Mrp antiport and complex formation.
    supporting_text: >-
      In category 1, MrpD-D75A, MrpD-R258A, MrpE-T113Y, and MrpF-D32A were
      studied, and their Na+/H+ antiport activity was found to be completely
      lost, with no Mrp complex detected.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified review (Ito, Morino and Krulwich 2017, Front Microbiol).
- id: PMID:29754813
  title: Structure of an Ancient Respiratory System.
  findings:
  - statement: MrpF corresponds to MBH subunit B; its conserved Asp is needed for antiport.
    supporting_text: >-
      Mutations D32A and R33A in MrpF, equivalent to D29 and R30 of MBH
      subunit B, either abolished (D32A) or reduced (R33A) the H+/Na+
      antiporter activity
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Yu et al. 2018, Cell). Used to judge the breadth of the
      PAINT node, which includes MBH/MBX subunits.
