  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1058 encodes subunit F (ShaF/MrpF) of the Sha (Mrp/Mnh/Pha) multisubunit
  Na+/H+ antiporter of Pseudomonas aeruginosa PAO1. It is a small (89
  residues) integral membrane protein with two predicted transmembrane
  helices, in the CPA3 antiporter subunit F (MrpF/PhaF) family. It is the
  fifth gene of the six-gene sha cluster PA1054-PA1059, in which shaA and shaB
  are fused. The cluster restores Na+ tolerance and Na+/H+ antiport to an
  E. coli strain lacking its major antiporters, and in P. aeruginosa the Sha
  antiporter is largely responsible for Na+ extrusion and supports virulence
  in mouse infection models. In Bacillus Mrp antiporters, a conserved
  aspartate of MrpF is needed for antiport and complex formation, and
  B. subtilis MrpF has in addition been linked to cholate efflux. Its
  homologue in archaeal membrane-bound hydrogenase is MBH subunit B.
