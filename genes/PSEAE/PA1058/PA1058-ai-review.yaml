core_functions:
- description: >-
    Subunit F (ShaF/MrpF) of the Sha multisubunit Na+/H+ antiporter, which
    extrudes Na+ across the cytoplasmic membrane in exchange for H+. It
    contributes to the activity and assembly of the complex rather than
    acting alone.
  contributes_to_molecular_function:
    id: GO:0015385
    label: sodium:proton antiporter activity
  directly_involved_in:
  - id: GO:0035725
    label: sodium ion transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:16030218
    supporting_text: >-
      genes PA1054 to PA1059 encode a Na+/H+ antiporter that is largely
      responsible for Na+ extrusion in P. aeruginosa
  - reference_id: PMID:29218041
    supporting_text: >-
      In category 1, MrpD-D75A, MrpD-R258A, MrpE-T113Y, and MrpF-D32A were
      studied, and their Na+/H+ antiport activity was found to be completely
      lost, with no Mrp complex detected.
suggested_questions:
- question: >-
    Should GO provide a cellular component term for the Mrp-type
    multisubunit Na+/H+ antiporter complex, by analogy with GO:1903103
    potassium:proton antiporter complex, so that Sha/Mrp subunits can be
    annotated to the complex instead of each carrying the activity?
- question: >-
    Should the subunit F IBD at PTN002162906 reach MBH/MBX hydrogenase
    subunit B proteins (TK2081, TK1225)?
- question: >-
    Does P. aeruginosa ShaF, like B. subtilis MrpF, support cholate or other
    efflux independently of the other Sha subunits?
suggested_experiments:
- description: >-
    Make an in-frame PA1058 (shaF) deletion, then test Na+ tolerance, Na+
    efflux, bile-salt sensitivity and Sha complex assembly (BN-PAGE); express
    the cluster lacking only PA1058 in E. coli TO114 and assay Na+/H+ antiport
    in everted vesicles.
