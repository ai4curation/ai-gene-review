  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4400 is the MutT 8-oxo-dGTP diphosphatase of P. aeruginosa, part of the
  GO (8-oxoguanine) system with MutM and MutY that prevents mutations caused by
  oxidised guanine. Its N-terminal Nudix hydrolase domain hydrolyses
  8-oxo-dGTP (and, by homology with E. coli MutT, 8-oxo-GTP) to the
  monophosphate and pyrophosphate, removing the mutagenic nucleotide from the
  precursor pool before it can be misincorporated opposite adenine. The cloned
  gene complements the high mutation frequency of an E. coli mutT mutant, and
  the N-terminal part of the protein is necessary and sufficient for this
  activity. The protein carries a C-terminal domain related to thiamine
  phosphate synthase / TenI whose function is unknown.
