suggested_questions:
- question: >-
    Does the C-terminal TenI/thiamine-phosphate synthase-like domain of PA4400
    have any catalytic activity in thiamine metabolism, or is it a degenerate
    domain?
suggested_experiments:
- description: >-
    Purify PA4400 and its isolated N- and C-terminal domains; measure
    hydrolysis of 8-oxo-dGTP, 8-oxo-GTP and 8-oxo-dGDP, and test the C-terminal
    domain for thiazole tautomerase (TenI) or thiamine-phosphate synthase
    activity.
