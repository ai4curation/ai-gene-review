      E. coli MutT (P08337, EcoCyc EXP, UniProt IC) and PA4400 itself
      (PseudoCAP IDA, PMID:12445642). The self-seed is expected, not circular.
    action: ACCEPT
    reason: >-
      GO annotates MutT-type 8-oxo-dGTPases to DNA repair (E. coli MutT and
      human NUDT1 carry it), as the antimutator arm of the GO system. The IBD
      stands on E. coli MutT alone and the term suits the clade.
    supported_by:
