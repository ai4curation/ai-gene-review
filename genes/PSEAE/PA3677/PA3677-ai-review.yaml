  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3677 (mexJ) encodes the membrane fusion protein (periplasmic adaptor) of the MexJK
  resistance-nodulation-cell division (RND) efflux system of Pseudomonas aeruginosa. It is
  a predicted inner-membrane lipoprotein whose periplasmic barrel-sandwich and beta-barrel
  domains link the inner-membrane RND transporter MexK to an outer-membrane channel. MexJ
  and MexK together are required for triclosan efflux, while efflux of tetracycline and
  erythromycin also needs the outer-membrane channel OprM, forming a tripartite MexJK-OprM
  pump. The mexJK operon is repressed by the TetR-family regulator MexL, encoded
  divergently next to it.
