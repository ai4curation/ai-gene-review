    supporting_text: Triclosan efflux required neither of the outer membrane protein channels tested but necessitated the MexJ membrane fusion protein and the MexK inner membrane RND transporter.
  - statement: MexJK exports tetracycline and erythromycin with OprM.
    supporting_text: The MexJK system effluxed tetracycline and erythromycin but only in the presence of the outer membrane protein channel OprM
