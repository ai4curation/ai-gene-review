suggested_questions:
- question: >-
    Does MucD restrain MucP-dependent MucA cleavage by degrading envelope signals,
    by degrading MucA-associated factors, or through its effect on AlgK/AlgX?
suggested_experiments:
- description: >-
    Compare MucA stability and AlgU activity in a mucD deletion complemented with
    wild-type MucD, catalytic S217A MucD, or the 12-mer-locked variant, and
    identify periplasmic proteins that accumulate in the mutant by proteomics.
