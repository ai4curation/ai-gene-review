- id: PMID:42766672
  title: MucD regulates alginate biosynthesis through the proteolytic control of AlgX
    and AlgK in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Purified MucD degrades AlgK and AlgX; cryo-EM structures and mutagenesis show
      a resting 12-mer and active trimer equilibrium.
    supporting_text: >-
