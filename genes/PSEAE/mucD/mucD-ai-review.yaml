- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IDA
  original_reference_id: PMID:21036998
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA. Damron and Yu showed that in a mucD mutant MucA is degraded
      through MucP, bypassing AlgW, and AlgU is activated.
    action: MODIFY
    reason: >-
      The paper is genetic (mutants, algU-promoter reporter, Western blots of
      tagged MucA), so the evidence is IMP, not IDA. It shows that MucD restrains
      the MucA proteolytic cascade that transmits envelope signals to AlgU, so MucD
      is a negative regulator of that signal transduction, not a component of it.
      Whether it acts by degrading activating signals or the alginate machinery is
      unresolved.
    proposed_replacement_terms:
    - id: GO:0009968
      label: negative regulation of signal transduction
    supported_by:
    - reference_id: PMID:21036998
      supporting_text: >-
        When mucD is inactivated, a high level of algU promoter activity was noted
        (Fig. 3A ), suggesting that the RIP activities are negatively regulated by
        MucD.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      requested_change: REPOINT
      asserted_value: GO:0007165
      corrected_value: GO:0009968
      corrected_label: negative regulation of signal transduction
      confidence: PROBABLE
      explanation: >-
        GO:0007165 signal transduction IDA for MucD (PA0766, G3XD20) from
        PMID:21036998. The paper shows that mucD inactivation activates
        MucP-dependent MucA degradation and AlgU activity, so MucD negatively
        regulates the RIP signalling cascade rather than taking part in it. The
        experiments are mutant phenotypes, so the evidence code should be IMP.
        Suggest GO:0009968 negative regulation of signal transduction, IMP.
      supported_by:
      - reference_id: PMID:21036998
        supporting_text: >-
          When mucD is inactivated, a high level of algU promoter activity was
          noted (Fig. 3A ), suggesting that the RIP activities are negatively
          regulated by MucD.
- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: IDA
  original_reference_id: PMID:21713511
  qualifier: located_in
  review:
    summary: >-
      PseudoCAP IDA; sole seed of the PTN002342204 periplasmic space IBD (5 leaf
      IBAs). Hay et al. identified a periplasmic AlgK-AlgX-MucD complex.
    action: ACCEPT
    reason: >-
      The abstract explicitly reports MucD in a periplasmic complex, which a later
      paper describes as affinity pull-down evidence. Only the abstract is
      available, so the fractionation method could not be checked, but the claim
      agrees with the signal peptide, the DegP family and the in vitro degradation
      of periplasmic AlgK and AlgX. The seed is sound.
    supported_by:
    - reference_id: PMID:21713511
      supporting_text: >-
        Experimental evidence was provided for a periplasmic multiprotein complex
        composed of AlgX, AlgK, and the regulatory protein MucD.
    - reference_id: PMID:42766672
      supporting_text: >-
        Affinity pull-down studies further suggested that MucD could form a
        periplasmic complex with the terminal acetyltransferase AlgX and
        tetratricopeptide repeat (TPR)-rich scaffold protein AlgK [14].
core_functions:
- description: >-
    Periplasmic HtrA/DegP-like serine endoprotease that degrades unfolded proteins,
    including the alginate biosynthesis proteins AlgK and AlgX, and restrains the
    AlgW/MucP proteolysis of MucA that activates the sigma factor AlgU.
