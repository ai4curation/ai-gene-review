- id: PMID:21036998
  title: Pseudomonas aeruginosa MucD regulates the alginate pathway through activation
    of MucA degradation via MucP proteolytic activity.
  findings:
  - statement: >-
      In a mucD mutant, MucA is degraded through MucP without AlgW, and AlgU is
      activated.
    supporting_text: >-
      Here, we show that inactivation of MucD, an HtrA/DegP homolog and alginate
      regulator, can bypass AlgW, leading to an atypical proteolysis of MucA that is
      dependent on the MucP protease.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Genetic evidence of negative regulation; does not support an
      IDA for signal transduction.
