id: G3XD20
gene_symbol: mucD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  mucD (algY, PA0766) encodes MucD, a periplasmic HtrA/DegP-family serine protease
  (peptidase S1C) with a trypsin-like protease domain and two PDZ domains. It is
  the last gene of the algU-mucA-mucB-mucC-mucD operon. MucD degrades unfolded
  proteins in the periplasm, preferring small hydrophobic P1 residues, and its
  proteolytic activity is governed by an equilibrium between a resting 12-mer cage
  and an active trimer. It is a negative regulator of alginate production at two
  levels. Loss of MucD lets the anti-sigma factor MucA be degraded by the
  intramembrane protease MucP, even without AlgW, which releases the sigma factor
  AlgU and activates the algD alginate operon. MucD also binds and degrades the
  periplasmic alginate biosynthesis proteins AlgK and AlgX. mucD mutants are
  mucoid and more sensitive to heat and hydrogen peroxide.
