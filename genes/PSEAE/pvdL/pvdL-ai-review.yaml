  - statement: >-
      PvdL's specific role within pyoverdine synthesis is the chromophore rather than the
      variable peptide chain made by the other synthetases.
    reference_section_type: ABSTRACT
    supporting_text: >-
      PvdL in P. aeruginosa are orthologues involved in the biosynthesis of the pyoverdine
      chromophore.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Mossialos et al., Mol Microbiol 2002; DOI
