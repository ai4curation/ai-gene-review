      the reviewed organism, states that it is an NRPS necessary for pyoverdine production,
      and describes the module layout that the UniProt domain complement independently shows.
      This is the strongest reference on the gene's molecular function and is the main
      support for refining catalytic activity to non-ribosomal peptide synthetase activity.
