id: Q9I157
gene_symbol: pvdL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdL (PA2424) is the 4342-residue non-ribosomal peptide synthetase that initiates
  biosynthesis of the siderophore pyoverdine in Pseudomonas aeruginosa and builds its
  chromophore precursor. Unlike the other pyoverdine synthetases it begins with a fatty
  acyl-AMP ligase module, which activates myristate and attaches it to the growing
  precursor, followed by three amino-acid adenylation modules with condensation and
  phosphopantetheine-carrier domains that assemble the chromophore peptide. The fatty acyl
  group keeps the precursor membrane-associated during assembly and is removed late in
  maturation by the periplasmic hydrolase PvdQ, so PvdL acts at the start of a pathway whose
  product is finally exported as mature pyoverdine. Its expression is iron-regulated through
  the sigma factor PvdS.
