core_functions:
- description: >-
    Initiating non-ribosomal peptide synthetase of pyoverdine biosynthesis: its fatty
    acyl-AMP ligase module loads myristate onto the precursor and its three adenylation,
    condensation and carrier modules assemble the chromophore peptide.
  molecular_function:
    id: GO:1904091
    label: non-ribosomal peptide synthetase activity
  directly_involved_in:
  - id: GO:0002049
    label: pyoverdine biosynthetic process
  supported_by:
  - reference_id: PMID:12354233
    reference_section_type: ABSTRACT
    supporting_text: >-
      their N-terminus starts with an acyl-CoA ligase module, followed by three amino acid
      activation domains.
  - reference_id: PMID:21892836
    reference_section_type: ABSTRACT
    supporting_text: >-
      We demonstrate herein that the initial module of the nonribosomal peptide synthetase
      PvdL adds a myristate moiety to the pyoverdine precursor.
  knowledge_gaps:
  - gap_statement: >-
      Why pyoverdine assembly needs a fatty acyl group at all is unresolved. The myristate is
      added by PvdL's first module and removed again by PvdQ before the mature siderophore is
      exported, so it is a temporary feature; whether it anchors the precursor to the
      membrane, enforces the order of assembly, or prevents premature iron binding has not
      been established.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      The substrate specificity of PvdL's three adenylation domains has not been determined
      experimentally. Their assignment to the chromophore rather than the peptide chain rests
      on computer modelling of the domains, so which residues each activates, and in what
      order, is predicted rather than measured.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    What is the function of the myristate that PvdL adds and PvdQ later removes? Since the
    acyl group does not appear in mature pyoverdine, its role must be in the assembly or
    trafficking of the precursor, and establishing which would explain why the pathway
    carries the cost of adding and then cleaving it.
- question: >-
    Do PvdL's three adenylation domains activate the residues that computer modelling
    assigns to them? The chromophore assignment for this synthetase, as opposed to the
    peptide-chain role of PvdD and PvdJ, rests on that modelling rather than on measured
    specificity.
suggested_experiments:
- description: >-
    Assay each PvdL adenylation domain separately for amino-acid-dependent ATP-PPi exchange
    to determine its substrate, and compare the result with the modelled assignment that
    places this synthetase on the chromophore.
- description: >-
    Express a PvdL variant with the fatty acyl-AMP ligase module inactivated and follow
    pyoverdine precursor accumulation and localisation, to test whether the myristate is
    required for assembly or only for the precursor's compartmentalisation.
