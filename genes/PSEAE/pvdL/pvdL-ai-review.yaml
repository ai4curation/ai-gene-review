  review:
    summary: >-
      Automatic mapping from the fatty acyl-AMP ligase domain and an association rule. PvdL
      does handle a fatty acyl group - its initial module activates myristate - but the
      product of the pathway is a peptide siderophore, not a lipid.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Not simply false, which is why it is marked rather than removed: a fatty acyl-AMP
      ligase step really is part of what this enzyme does, and the FAAL domain is genuinely
      present. But PvdL does not synthesise a lipid. The myristate is drawn from the cell's
      existing pool, attached to the pyoverdine precursor, and cut off again by PvdQ during
      maturation, so the acyl group is a temporary handle rather than a product. The mapping
      most likely derives from mycobacterial FAAL enzymes, which do feed lipid biosynthesis;
      the domain transfers, the pathway context does not.
    supported_by:
