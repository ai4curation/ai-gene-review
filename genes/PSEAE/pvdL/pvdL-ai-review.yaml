  findings:
  - statement: >-
      PvdL of P. aeruginosa is identified as a non-ribosomal peptide synthetase required for
      pyoverdine production, by locus tag, so this paper is directly about the reviewed gene.
    reference_section_type: ABSTRACT
    supporting_text: >-
