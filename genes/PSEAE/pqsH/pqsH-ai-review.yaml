- description: >-
    FAD-dependent HHQ 3-monooxygenase (PQS synthase, EC 1.14.13.182). It
    hydroxylates 2-heptyl-4(1H)-quinolone with NADH and O2 to form the Pseudomonas
    quinolone signal PQS, the final step of PQS biosynthesis.
