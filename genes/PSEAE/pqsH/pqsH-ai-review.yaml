suggested_questions:
- question: >-
    GO:0009372 quorum sensing is defined to include producing the signal molecule.
    Should signal synthases such as PqsH (and PqsABCD, LasI, RhlI) be annotated
    involved_in quorum sensing? None of the comparators in this pathway (pqsB,
    pqsC) carry the term, which suggests a convention to restrict it to signal
    perception and response.
- question: >-
    The PTN008173107 IBD (monooxygenase activity) at the PTHR45934 root propagates
    to about 294 plant proteins (Arabidopsis MO1/MO2/MO3, CTF2A/B and orthologs).
    Its only experimental seed is PqsH, on a horizontally transferred bacterial
    branch. Do any plant members have experimental evidence that could act as
    additional seeds? Are the FAD- and NAD(P)H-binding and catalytic motifs
    conserved across the plant clade?
- question: >-
    Does PqsH also 3-hydroxylate HQNO to PQS-N-oxide in P. aeruginosa, as
    comparative work on AQ 3-monooxygenases suggests?
suggested_experiments:
- description: >-
    Determine the flavin content and reductive/oxidative half-reactions of
    tag-free PqsH (stopped-flow), and test HQNO as a substrate, to confirm the
    class A flavoprotein mechanism and the substrate range.
