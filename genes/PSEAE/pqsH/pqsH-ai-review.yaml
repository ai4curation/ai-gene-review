gene_symbol: pqsH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PqsH (PA2587) is a FAD-dependent class A aromatic hydroxylase (3-hydroxybenzoate
  6-hydroxylase family) that catalyses the last step of Pseudomonas quinolone
  signal (PQS) biosynthesis. It hydroxylates 2-heptyl-4(1H)-quinolone (HHQ) at C3
  to give 2-heptyl-3-hydroxy-4(1H)-quinolone (PQS), using NADH (NADPH less
  efficiently) and O2 (EC 1.14.13.182). The purified enzyme has high-nanomolar
  apparent Km values for HHQ and O2 and a turnover of about 2.5 per min. It
  accepts C7 and C9 alkyl-chain HHQ analogues equally well and shorter chains
  poorly. Because O2 is a substrate, PqsH cannot make PQS anaerobically, so oxygen
  availability directly gates PQS production and PQS-controlled behaviours such as
  membrane vesicle formation, iron chelation and virulence factor expression.
  Converting HHQ to PQS raises the potency of the quinolone quorum-sensing signal
  acting through PqsR (MvfR). pqsH transcription depends on the LasR
  quorum-sensing regulator, which links the Las and PQS systems.
references:
- id: PMID:20662781
  title: Oxygen levels rapidly modulate Pseudomonas aeruginosa social behaviours via
    substrate limitation of PqsH.
  findings:
  - statement: Purified MBP-PqsH converts HHQ to PQS using NADH and O2 in vitro (terminal
      step of PQS biosynthesis).
    supporting_text: we show that PqsH catalyses the terminal step in PQS production,
      synthesizing PQS in vitro using the substrates 2-heptyl-4-quinolone (HHQ), NADH
      and oxygen
  - statement: Steady-state kinetics confirm HHQ, NADH and oxygen as substrates; NADPH
      is a poorer electron donor.
    supporting_text: Steady state kinetic analysis confirmed HHQ, NADH, and oxygen as
      substrates of MBP-PqsH, consistent with its predicted role as an HHQ hydroxylating
      monooxygenase
  - statement: PqsH belongs to the flavin-dependent NAD(P)H/O2 aromatic hydroxylase
      family; FAD content itself was not measured.
    supporting_text: PqsH is a member of a family of flavin-dependent monooxygenases
      that utilize NAD(P)H and oxygen to catalyze hydroxylation of aromatic substrates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IDA rows (monooxygenase activity; secondary metabolite
      biosynthetic process). Full text cached (PMC3098721). The purified-enzyme
      assay with product confirmed by TLC, spectra and ESI-MS is direct evidence
      for HHQ 3-monooxygenase activity (GO:0102164), which is more specific than
      the term PseudoCAP annotated.
- id: PMID:12426334
  title: Functions required for extracellular quinolone signaling by Pseudomonas aeruginosa.
  findings:
  - statement: pqsH is required for PQS synthesis and its transcription depends on
      LasR.
    supporting_text: Since pqsH is required for PQS synthesis, this finding accounts
      for a previous observation that PQS production requires LasR function
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Genetic identification of pqsH as required for PQS synthesis; cited by UniProt
      for the function statement. Full text cached.
- id: PMID:33452035
  title: 'Signal Synthase-Type versus Catabolic Monooxygenases: Retracing 3-Hydroxylation
    of 2-Alkylquinolones and Their N-Oxides by Pseudomonas aeruginosa and Other Pulmonary
    Pathogens.'
  findings:
  - statement: PqsH and the catabolic ortholog AqdB catalyse the same HHQ 3-hydroxylation.
    supporting_text: Hydroxylation of the PQS precursor 2-heptylquinolin-4(1H)-one (HHQ)
      by the signal synthase PqsH boosts AQ quorum sensing. Remarkably, the same reaction,
