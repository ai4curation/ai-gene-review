suggested_questions:
- question: >-
    Is PIB-1 periplasmic as its predicted signal peptide implies, and does its trimerisation occur at
    physiological zinc concentrations in the periplasm?
suggested_experiments:
- description: >-
    Cell fractionation of P. aeruginosa expressing tagged PIB-1, with kinetic comparison of carbapenem
    hydrolysis by monomeric and trimeric enzyme across zinc concentrations.
