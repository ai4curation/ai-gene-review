  review:
    summary: >-
      IBA from PTN009168613, seeded by PA5542 itself, E. coli PBP4B/YfeW (P77619, IDA
      D-alanyl-D-alanine carboxypeptidase) and B. subtilis AmiE/YbbE (O05213, EXP amidase). The
