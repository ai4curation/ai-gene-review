    action: TOO_GENERAL
    reason: >-
      True but entailed by the accepted GO:0008800 beta-lactamase activity, which is_a hydrolase
      activity. The node term is suitably generic for a PF00144 clade of penicillin-binding-fold
      hydrolases with different substrates, and the IBD stands on the two other seeds.
- term:
    id: GO:0046677
    label: response to antibiotic
  evidence_type: IMP
  original_reference_id: PMID:25185138
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row from the knockout susceptibility phenotype: loss of PA5542 increases carbapenem
      susceptibility.
    action: KEEP_AS_NON_CORE
    reason: >-
      The phenotype reflects antibiotic inactivation by the enzyme, not a response to an antibiotic
      stimulus, but GO practice uses this term for resistance determinants and the same convention is
      followed in other P. aeruginosa reviews here (ampR, mexZ, pmpM). The specific process is captured
      by carbapenem catabolic process.
    supported_by:
    - reference_id: PMID:25185138
      supporting_text: >-
        Lack of PA5542 increases P. aeruginosa 59.20 susceptibility to carbapenems and its overexpression
        reduces E. coli susceptibility to these β-lactams.
- term:
    id: GO:1901768
    label: carbapenem catabolic process
  evidence_type: IMP
  original_reference_id: PMID:25185138
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP row. PA5542 hydrolyses the beta-lactam ring of carbapenems, which is carbapenem
      breakdown.
    action: ACCEPT
    reason: >-
      The enzyme itself catalyses the step (hydrolysis of imipenem and meropenem), so it does the work
      of the process; the mutant susceptibility phenotype is consistent with this. This is the
      biological-process counterpart of the core activity.
    supported_by:
