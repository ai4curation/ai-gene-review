id: Q9HT32
gene_symbol: PA5542
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5542 (named PIB-1) is a 414-residue chromosomally encoded beta-lactamase of Pseudomonas aeruginosa
  with a predicted N-terminal signal peptide and a single Beta-lactamase/transpeptidase-like domain
  (Pfam PF00144) that carries the S-x-x-K active-site motif of the serine penicillin-recognising enzymes.
  The purified enzyme hydrolyses imipenem and other carbapenems but not cephalosporins, and its activity
  rises in the presence of metal ions, especially zinc, which promote formation of more active trimers
  rather than binding at the active site. Crystal structures place it in class C beta-lactamases, as the
  founder of a divergent, metal-stimulated subgroup. PA5542 belongs to the P. aeruginosa core genome;
  its loss increases carbapenem susceptibility and its overexpression lowers carbapenem susceptibility
  in Escherichia coli, so it contributes to intrinsic carbapenem resistance.
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:25185138
  title: Characterization of a novel Zn²⁺-dependent intrinsic imipenemase from Pseudomonas
    aeruginosa.
  findings:
  - statement: Purified PA5542 hydrolyses imipenem, with zinc dependence.
    supporting_text: Spectrophotometric analyses showed that PA5542 is a Zn(2+)-dependent imipenemase.
  - statement: >-
      Inactivation of PA5542 raises carbapenem susceptibility and its overexpression lowers carbapenem
      susceptibility in E. coli.
    supporting_text: >-
      Lack of PA5542 increases P. aeruginosa 59.20 susceptibility to carbapenems and its overexpression
      reduces E. coli susceptibility to these β-lactams.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Fajardo et al. 2014, J Antimicrob Chemother). Abstract read; no full text in
      PMC. The abstract reports purification of the enzyme (GST fusion, tag removed) and a
      spectrophotometric imipenem hydrolysis assay, which supports the PseudoCAP IDA beta-lactamase
      activity row that seeds PTN009168613, and knockout/overexpression susceptibility data behind the
      IMP rows.
- id: PMID:39097051
  title: 'A new type of Class C β-lactamases defined by PIB-1. A metal-dependent carbapenem-hydrolyzing
    β-lactamase, from Pseudomonas aeruginosa: Structural and functional analysis.'
  findings:
  - statement: Crystal structures place PIB-1 (PA5542) in the class C beta-lactamases.
    supporting_text: These crystal structures show that it belongs to the Class C β-lactamase group
  - statement: >-
      PIB-1 degrades carbapenems but not cephalosporins, and metal ions stimulate activity through
      trimer formation rather than active-site binding.
    supporting_text: >-
      Functional analysis showed that PIB-1 is able to degrade carbapenems but not cephalosporins, the
      typical substrate of Class C β-lactamases, and that its catalytic activity increases in the presence
      of metal ions, especially zinc.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cited in the UniProt record for PDB 8RLJ/8RLK/8RLL. Abstract read (no PMC full text). Confirms
      and refines the 2014 activity data; not cited by GOA.
