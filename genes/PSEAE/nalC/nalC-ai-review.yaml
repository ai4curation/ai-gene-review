    and characterization of the nalC gene encoding a repressor of PA3720-PA3719.'
  findings:
  - statement: PA3721 (nalC) negatively regulates PA3720-PA3719; MexAB-OprM effects are via PA3719.
    supporting_text: Thus, the nalC (PA3721) mutation serves only to enhance PA3720-PA3719 expression
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PseudoCAP source for IMP GO:0032410 and GO:0034763. Abstract only; it states that NalC
      acts only by repressing PA3720-PA3719, with PA3719 directly or indirectly affecting MexAB-OprM.
- id: PMID:22393435
  title: 'Pentachlorophenol induction of the Pseudomonas aeruginosa mexAB-oprM efflux operon: involvement
    of repressors NalC and MexR and the antirepressor ArmR.'
  findings:
  - statement: NalC binds an inverted repeat upstream of PA3720-armR; PCP releases it.
    supporting_text: The NalC binding site was localized to an inverted repeat (IR) sequence upstream
      of PA3720-armR
  - statement: A nalC mutant shows increased PA3720-armR expression.
    supporting_text: although the mutant showed the expected increase in PA3720-armR expression compared
      with its wild type parent K767
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PseudoCAP source for IDA GO:0000976 and IMP GO:0045892, seeds of the PTN004738546 IBDs.
      Full text cached and read: EMSA with purified NalC on the PA3720-armR promoter and increased PA3720-armR
      expression in the nalC mutant K1454. Both seeds are sound.'
