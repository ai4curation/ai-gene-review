taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: NalC (PA3721) is a TetR/AcrR-family transcriptional repressor of Pseudomonas aeruginosa that
  controls the divergently transcribed PA3720-armR operon. NalC binds an inverted repeat overlapping the
  PA3720-armR promoter, and phenolic compounds such as pentachlorophenol release it from the DNA. ArmR
  (PA3719), a 53-residue anti-repressor, binds the MexR repressor and relieves MexR repression of the
  mexAB-oprM multidrug efflux operon. Loss-of-function nalC mutations (nalC-type multidrug-resistant mutants)
  therefore raise ArmR levels and cause moderate MexAB-OprM overexpression and multidrug resistance, so
  NalC controls efflux indirectly, through a repressor cascade.
