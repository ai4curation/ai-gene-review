- term:
    id: GO:0032410
    label: negative regulation of transporter activity
  evidence_type: IMP
  original_reference_id: PMID:15387820
  qualifier: involved_in
  review:
    summary: PseudoCAP IMP. NalC represses PA3720-PA3719; PA3719 (ArmR) affects MexAB-OprM expression.
    action: REMOVE
    reason: GO:0032410 is a process that reduces transporter activity. NalC represses an anti-repressor
      operon, and the efflux pump changes in amount, not activity, two regulatory steps downstream.
    supported_by:
    - &id007
      reference_id: PMID:15387820
      supporting_text: Thus, the nalC (PA3721) mutation serves only to enhance PA3720-PA3719 expression
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0032410
      cause: OTHER
      confidence: PROBABLE
      explanation: 'PseudoCAP IMP row for PA3721/nalC, GO:0032410 negative regulation of transporter activity,
        from PMID:15387820 (Cao et al. 2004). GO:0032410 is a process that reduces the activity of a transporter.
        The abstract states that NalC acts only by repressing PA3720-PA3719, whose product PA3719 raises
        MexAB-OprM expression. That is regulation of gene expression, not of transporter activity. Requested
        change: delete the row; the transcriptional role is already annotated (GO:0045892). Abstract-only
        reading; the full text could in principle report a post-translational effect, which would be unprecedented
        for a TetR repressor.'
      supported_by:
      - *id007
- term:
    id: GO:0034763
    label: negative regulation of transmembrane transport
  evidence_type: IMP
  original_reference_id: PMID:15387820
  qualifier: involved_in
  review:
    summary: PseudoCAP IMP. nalC mutants overexpress MexAB-OprM through derepression of the ArmR anti-repressor.
    action: MARK_AS_OVER_ANNOTATED
    reason: NalC's direct target is PA3720-armR. The effect on efflux runs through ArmR and MexR, a two-step
      cascade, so annotating NalC to regulation of transmembrane transport stretches the convention that
      a transcription factor is annotated to the process its targets perform. The direct repressors MexR
      and NalD carry this role more faithfully.
    supported_by:
    - *id007
