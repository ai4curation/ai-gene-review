id: P29365
gene_symbol: hom
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  hom (PA3736) encodes homoserine dehydrogenase (HDH, EC 1.1.1.3) of Pseudomonas
  aeruginosa. The enzyme reduces L-aspartate 4-semialdehyde to L-homoserine with
  NADH or NADPH, the third step from aspartate and the branch point that supplies
  homoserine to both threonine biosynthesis (via homoserine kinase and threonine
  synthase) and methionine biosynthesis (via homoserine O-succinyltransferase
  MetXS). It has an N-terminal NAD(P)-binding domain, a central catalytic domain
  and a C-terminal ACT domain, and its activity is feedback-inhibited by
  threonine. hom lies at the thr locus, apparently co-transcribed with thrC
  (threonine synthase), and is expressed constitutively. It is the only
  homoserine dehydrogenase encoded in the PAO1 genome.
