    label: L-homoserine biosynthetic process
  - id: GO:0009088
    label: L-threonine biosynthetic process
  - id: GO:0071265
    label: L-methionine biosynthetic process
  supported_by:
  - reference_id: PMID:1333566
    supporting_text: HDH activity was feedback inhibited by threonine
  - reference_id: file:PSEAE/hom/hom-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      the third step in the biosynthesis of
      threonine and methionine from aspartate
suggested_questions:
- question: >-
    Does the full text of PMID:10220164 (Patte et al. 1999, ThrH) contain a
    homoserine dehydrogenase assay or hom mutant, or should the PseudoCAP hom IDA
    rows cite PMID:1333566 instead?
- question: >-
    Should PTN000752178 also carry an L-methionine biosynthetic process (or
    L-homoserine biosynthetic process) IBD, since every homoserine dehydrogenase in
    the clade supplies homoserine to both branches?
suggested_experiments:
- description: >-
    Construct a clean hom deletion in PAO1 and test for combined threonine and
    methionine auxotrophy (with homoserine rescue), and assay purified Hom with NADH
    versus NADPH and with threonine, to confirm its sole-HDH role and cofactor
    preference.
