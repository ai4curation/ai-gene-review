core_functions:
- description: >-
    Cytoplasmic NAD(P)H-dependent homoserine dehydrogenase that reduces L-aspartate
    4-semialdehyde to L-homoserine, the branch-point precursor of threonine and
    methionine; its activity is feedback-inhibited by threonine through the
    C-terminal ACT domain.
  molecular_function:
    id: GO:0004412
    label: homoserine dehydrogenase activity
  directly_involved_in:
