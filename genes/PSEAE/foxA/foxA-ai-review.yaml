- id: PMID:16484199
  title: >-
    The heterologous siderophores ferrioxamine B and ferrichrome activate signaling pathways in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      FoxA is produced only in the presence of ferrioxamine B, and its induction depends on the adjacent
      foxI-foxR locus.
    supporting_text: >-
      Two of them are only produced in the presence of the hydroxamate siderophores ferrioxamine B and
      ferrichrome
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Cached file is abstract-only and the full text could not be retrieved in this session. The abstract
      shows proteomic identification of FoxA and its siderophore-specific regulation; whether foxA mutant
      transport or signalling assays were reported (the basis of the PseudoCAP IMP rows, including the
      GO:0015344 IBD seed) could not be checked. The rows are accepted because the functions are established
      elsewhere.
- id: PMID:39138320
  title: >-
    The role of FoxA, FiuA, and FpvB in iron acquisition via hydroxamate-type siderophores in Pseudomonas
    aeruginosa.
  findings:
  - statement: FoxA transports ferric nocardamine, bisucaberin, desferrioxamine B and desferrioxamine
      G.
    supporting_text: FoxA of the ferric forms of nocardamine, bisucaberin, DFOB and DFOG
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Growth and 55Fe uptake assays with TBDT mutants define FoxA substrates.
- id: PMID:35138377
  title: >-
    Transcription regulation of iron carrier transport genes by ECF sigma factors through signaling from
    the cell surface into the cytoplasm.
  findings:
  - statement: Ferrioxamine B binding to FoxA triggers transcription of ferrioxamine transport genes.
    supporting_text: >-
      The binding of Fe3+ferrioxamine B to the FoxA OM protein triggers the transcription of ferrioxamine
      transport genes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review, full text cached.
- id: PMID:25809487
  title: >-
    Self-cleavage of the Pseudomonas aeruginosa Cell-surface Signaling Anti-sigma Factor FoxR Occurs through
    an N-O Acyl Rearrangement.
  findings:
  - statement: Ferrioxamine binding to FoxA leads to FoxR processing and FoxI activation.
    supporting_text: >-
      Upon binding of ferrioxamine by the FoxA receptor, FoxR is processed by a complex proteolytic cascade
      leading to the release and activation of σ(FoxI)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract states the Fox pathway model; the paper is about FoxR.
