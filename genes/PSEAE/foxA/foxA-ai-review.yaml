suggested_questions:
- question: >-
    Should GO have a specific ferrioxamine import term, given that FoxA, E. coli FhuE and Yersinia FoxA-type
    receptors are all annotated only to the generic siderophore-iron import term?
suggested_experiments:
- description: >-
    Measure FoxI-dependent foxA promoter induction by ferrioxamine B in FoxA variants lacking the STN
    domain or carrying a TonB-box mutation, to separate signalling from transport.
