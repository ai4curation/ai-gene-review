id: Q9I116
gene_symbol: foxA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FoxA (PA2466) is the TonB-dependent outer-membrane receptor and transporter for ferrioxamine-type hydroxamate
  siderophores in Pseudomonas aeruginosa: ferrioxamine B (desferrioxamine B), ferrioxamine G, nocardamine
  (ferrioxamine E) and bisucaberin. It has the beta-barrel and plug domains of the TonB-dependent receptor
  family and an N-terminal STN signalling domain, which makes it a TonB-dependent transducer. Ferrioxamine
  binding to FoxA is signalled across the envelope to the anti-sigma factor FoxR, whose processing releases
  the ECF sigma factor FoxI to induce foxA transcription; FoxA is produced only under iron limitation
  in the presence of its siderophore. FpvB provides an overlapping uptake route for some ferrioxamines.
