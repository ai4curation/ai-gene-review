suggested_questions:
- question: >-
    How are the catabolic (agmatine utilization) and biosynthetic roles of the
    aguBA operon balanced, for example by control of its expression?
suggested_experiments:
- description: >-
    Mutate the predicted catalytic Cys154 of AguB and test N-carbamoylputrescine
    hydrolysis in vitro and complementation of an aguB speC double mutant.
