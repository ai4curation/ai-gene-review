id: Q9I6J8
gene_symbol: aguB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AguB (PA0293) is the N-carbamoylputrescine amidohydrolase of Pseudomonas
  aeruginosa, a homohexameric member of the nitrilase (carbon-nitrogen
  hydrolase) superfamily that uses thiol-assisted catalysis. It hydrolyses
  N-carbamoylputrescine to putrescine, ammonia and CO2, the second step after
  agmatine deiminase (AguA) in the conversion of agmatine to putrescine. The
  aguBA genes were first identified through agmatine utilization, and the same
  enzymes provide the arginine decarboxylase route of putrescine biosynthesis,
  which is redundant with ornithine decarboxylase (SpeC).
references:
- id: PMID:6423933
  title: Arginine degradation in Pseudomonas aeruginosa mutants blocked in two arginine
    catabolic pathways.
  findings:
  - statement: aguA and aguB encode agmatine deiminase and N-carbamoylputrescine amidohydrolase
      and were mapped in agmatine-utilization mutants.
    supporting_text: The genes encoding agmatine deiminase (aguA) and N-carbamoylputrescine
      amidinohydrolase (aguB) were 98% cotransducible
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP N-carbamoylputrescine amidase row, which seeds
      PTN000557706 and PTN000557638. Abstract only. Genetics-led, but the
      abstract names aguB as the enzyme's gene and the activity is confirmed
      biochemically by PMID:12634339.
- id: PMID:12634339
  title: Identification of the putrescine biosynthetic genes in Pseudomonas aeruginosa
    and characterization of agmatine deiminase and N-carbamoylputrescine amidohydrolase
    of the arginine decarboxylase pathway.
  findings:
  - statement: Purified AguB is specific for N-carbamoylputrescine.
    supporting_text: AguB was specific to N-carbamoylputrescine and the K(m) and K(cat)
      values of the enzyme for the substrate were 0.5 mM and 3.3 s(-1), respectively.
  - statement: AguB is a nitrilase-family enzyme using thiol-assisted catalysis.
    supporting_text: AguB is a protein of the nitrilase family that performs thiol-assisted
      catalysis.
  - statement: AguA and AguB act in putrescine biosynthesis; an aguAB speC mutant is a
      putrescine auxotroph.
    supporting_text: a double mutant of aguAB and speC was a putrescine auxotroph.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; direct purified-enzyme kinetics and genetics for AguB.
