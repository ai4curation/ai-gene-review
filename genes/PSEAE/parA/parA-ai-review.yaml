proposed_new_terms: []
suggested_questions:
- question: Does P. aeruginosa ParA bind DNA non-specifically in an ATP-dependent manner, as B. subtilis
    Soj does, and is that the basis of its nucleoid-based transport?
- question: Is P. aeruginosa ParA ATPase stimulated by ParB and by DNA, and does the ParB N-terminal
    motif deliver that stimulation as in Myxococcus?
suggested_experiments:
- description: Assay purified ParA for ATP-dependent non-specific DNA binding, and measure its ATPase
    rate with DNA, ParB, and both together.
  hypothesis: ParA binds DNA as an ATP-sandwich dimer and its ATPase is synergistically activated by
    DNA and ParB.
  experiment_type: biochemistry (EMSA and ATPase assay)
