taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  ParA (PA5563, Soj) is the ATPase of the Pseudomonas aeruginosa ParABS
  chromosome-partitioning system, encoded upstream of parB in the
  gidAB-parAB operon about 8 kb from oriC. It is a 262-residue deviant
  Walker-type (ParA/MinD-family) P-loop ATPase with the KGGVGKT Walker A box.
  Purified ParA hydrolyses ATP. ParA self-associates and binds its partner
  ParB through a region around residues 67-85 that overlaps the dimer
  interface; dimerization is needed for the ParB interaction. ParA is
  reported as a cytosolic protein, at about 600 molecules per cell in
  exponential growth. With ParB bound at the oriC-proximal parS sites,
  ParA drives separation of the replicated origin domains. Loss of ParA, or
  a ParA that cannot dimerize and bind ParB, causes anucleate cells, failure
  to separate ParB foci, slower growth and altered motility, and
  destabilises ParB. Overproduction of ParA is toxic.
existing_annotations:
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IDA
  original_reference_id: PMID:25139949
  review:
    summary: Purified P. aeruginosa ParA hydrolyses ATP.
    action: NEW
    reason: >-
      Direct biochemical evidence: ParA-His6 releases phosphate from ATP at
      about 1.2 pmol Pi per min per pmol ParA (malachite green assay), and the
      dimerization and ParB-interaction mutants keep this activity. ATP
      hydrolysis is the core activity of the deviant Walker-type ParA
      ATPases, which ParB stimulates in characterized systems. GOA has no
      annotation of any kind for this protein. NCBI's BlastRule names it
      "chromosome partitioning protein Soj" but carries no GO.
    supported_by:
    - reference_id: PMID:25139949
      supporting_text: ParA-His6 demonstrated ATPase activity (Fig. 3) of ~1.2 pmol Pi released min−1
        (pmol ParA)−1.
    - reference_id: PMID:25139949
      supporting_text: Pseudomonas aeruginosa ParA belongs to a large subfamily of Walker-type ATPases
        acting as partitioning proteins in bacteria.
- term:
    id: GO:0007059
    label: chromosome segregation
  evidence_type: IMP
  original_reference_id: PMID:17545287
  review:
    summary: ParA is the ATPase that moves the ParB-parS origin complexes during chromosome segregation.
    action: NEW
    reason: >-
      ParA does work in this process, as the partition ATPase that positions
      the ParB-parS complex. It is not merely necessary for it. The genetics
      are direct: parA inactivation or overexpression causes anucleate cells.
      A dimerization- and ParB-binding-deficient allele (parA84) fails to
      separate ParB foci and phenocopies the null, whereas a ParA that only
      loses ParB binding (parA67) is partly defective. The parA84 protein
      (ParA L84K) accumulates at least fivefold less than wild-type ParA, but
      the authors show that the ParB foci defect persists when the mutant
      protein is supplied at about twice the wild-type level, so it follows
      from the substitution rather than the low level.
    supported_by:
    - reference_id: PMID:17545287
      supporting_text: Both inactivation of parA and overexpression of parA in trans in P. aeruginosa
        also lead to accumulation of anucleate cells and changes in motility.
    - reference_id: PMID:25139949
      supporting_text: Both mutants showed defective separation of ParB foci, but to different extents.
    - reference_id: PMID:25139949
      supporting_text: Only PAO1161 parA84 was visibly impaired in terms of chromosome segregation, growth
        rate and motility, similar to a parA-null mutant.
    - reference_id: PMID:25139949
      supporting_text: confirmed that disturbed ParB foci localization/separation was not associated with
        the ParA level, but resulted from the change in amino acid sequence
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IPI
  original_reference_id: PMID:25139949
  review:
    summary: ParA dimerizes, and dimerization is needed for its interaction with ParB.
    action: NEW
    reason: >-
      ParA self-association was shown by two-hybrid assays only: yeast
      two-hybrid deletion mapping and bacterial two-hybrid (BACTH) alanine
      scanning of region E67-L85. Mutants that cannot dimerize also lose ParB
      binding. Dimerization is not needed for ATP hydrolysis here, since the
      dimerization-deficient L84 mutant keeps wild-type ATPase activity. It is
      a supporting activity, required for the ParB interaction, not a core
      one.
    supported_by:
    - reference_id: PMID:25139949
      supporting_text: ParA has the ability to both self-associate and interact with its partner ParB.
    - reference_id: PMID:25139949
      supporting_text: interactions depend on the ability of ParA to dimerize.
    - reference_id: PMID:25139949
      supporting_text: Alanine scanning of charged and hydrophobic residues in the ParA region E67–L85
        and analysis of ParA variants in the BACTH system clearly demonstrated the essentiality of this
        region for both ParA self-interactions and interactions with ParB.
    - reference_id: PMID:25139949
      supporting_text: All analysed ParA derivatives, among them dimerization-deficient ParAL84A, demonstrated
        ATPase activities similar to WT ParA
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: TAS
  original_reference_id: PMID:17545287
  review:
    summary: ParA is reported as a soluble, cytosolic protein.
    action: NEW
    reason: >-
      The study reports ParA as a cytosolic protein (about 600 molecules per
      cell in exponential phase). Only the abstract is available, so the
      method is not known and the row is recorded as a traceable author
      statement rather than direct assay. Cytoplasm is proposed rather than cytosol: in other
      species, ParA-family ATPases associate with the nucleoid through
      non-specific DNA binding, and cytoplasm covers both states. Nucleoid
      association has not been tested in P. aeruginosa, so no nucleoid term
      is proposed.
    supported_by:
    - reference_id: PMID:17545287
      supporting_text: ParA is a cytosolic protein present at a level of around 600 molecules per cell
        in exponential phase
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IC
  original_reference_id: PMID:25139949
  supporting_entities:
  - GO:0016887
  review:
    summary: ParA binds the ATP it hydrolyses.
    action: NEW
    reason: >-
      Curator inference from the measured ATP hydrolysis by purified ParA,
      which requires ATP binding, together with the deviant Walker A box
      KGGVGKT at residues 11-17. Binding was not measured separately, so the
      code is IC. Recorded separately because GO does not derive ATP binding
      from ATP hydrolysis activity.
    supported_by:
    - reference_id: PMID:25139949
      supporting_text: ParA-His6 demonstrated ATPase activity (Fig. 3) of ~1.2 pmol Pi released min−1
        (pmol ParA)−1.
    - reference_id: file:PSEPK/parA/parA-bioinformatics/RESULTS.md
      supporting_text: ParA has the deviant Walker A box KGGVGKT at 11-17,
        the ATP-binding signature of the ParA/MinD family.
