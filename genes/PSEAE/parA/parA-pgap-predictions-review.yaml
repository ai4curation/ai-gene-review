description: >-
  P. aeruginosa PAO1 is one of NCBI's curated reference genomes, so PGAP does
  not annotate its assembly. The identical protein WP_003097243.1 (53,716
  assemblies in its identical-protein record, 2026-10-24) is annotated by PGAP in other
  genomes. Unlike its 84%-identical P. putida ortholog, it is named not from
  a CDD architecture but from BlastRule NBR012933, "chromosome partitioning
  protein Soj". The BlastRule gives a more specific name than the P. putida
  architecture ("ParA family protein") but carries no GO, and under
  winner-take-all no other model passes on terms. The protein therefore
  gets no GO from NCBI. GOA also has none, so neither pipeline annotates
  this experimentally characterized ATPase. The P. putida architecture
  shows what the BlastRule could carry: ATP binding and ATP hydrolysis
  activity, both correct for this protein. The main review proposes ATP
  hydrolysis activity (IDA), chromosome segregation (IMP), protein
  homodimerization activity (IPI) and cytoplasm (IDA). There are no PGAP
  predictions to assess.
