    supporting_text: O2 appeared to be the native Aer2 ligand
  - reference_id: PMID:14987771
    supporting_text: A double mutant deficient in tlpC and tlpG was negative for aerotaxis.
suggested_questions:
- question: >-
    What is the physiological output of the McpB/Che2 pathway in P. aeruginosa?
    McpB mediates gas repellent responses in E. coli, yet the PAO1 mutant loses
    positive aerotaxis, and the che2 cluster is RpoS-regulated.
- question: >-
    Should PAINT record a loss of the transmembrane architecture (plasma membrane,
    transmembrane signaling receptor activity) for the soluble McpB leaf under the
    MCP node PTN002079588?
suggested_experiments:
- description: >-
    Temporal aerotaxis and O2-gradient capillary assays with PAO1, mcpB deletion and
    heme-pocket point mutants (H234A, W283A) in stationary-phase cells, when the
    RpoS-dependent che2 cluster is expressed, to define the sign and context of the
    McpB response.
  experiment_type: behavioural assay
