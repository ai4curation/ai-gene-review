- term:
    id: GO:0019826
    label: oxygen sensor activity
  evidence_type: IDA
  original_reference_id: PMID:28167524
  qualifier: enables
  review:
    summary: >-
      The PAS-heme domain binds O2 with a Kd of about 16 uM, O2 appears to be the
      native ligand, and O2 binding initiates the signalling conformational change.
    action: NEW
    reason: >-
      Two lines agree. Purified PAS-heme binds O2 and mutants that bind O2 signal,
      while those that cannot stabilise O2 do not; and full-length McpB mediates
      O2-dependent responses through a chemotaxis system. This is the receptor's
      own sensing activity, absent from GOA.
    supported_by:
    - reference_id: PMID:28167524
      supporting_text: O2 appeared to be the native Aer2 ligand
    - reference_id: PMID:28167524
      supporting_text: >-
        With one exception, mutants that bound O2 could signal, whereas many mutants
        that bound CO could not.
