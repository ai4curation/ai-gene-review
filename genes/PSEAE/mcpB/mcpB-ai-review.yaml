core_functions:
- description: >-
    Soluble heme-based O2 (and CO/NO) sensing chemoreceptor of the che2 cluster. O2
    binding to the PAS-heme domain switches the poly-HAMP relay and the kinase
    control module, which regulates the chemotaxis kinase to control aerotaxis and
    chemotactic behaviour.
  molecular_function:
    id: GO:0019826
    label: oxygen sensor activity
  directly_involved_in:
