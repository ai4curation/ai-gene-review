gene_symbol: mcpB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  McpB (Aer2, Aer-2, TlpG; PA0176) is a soluble, cytoplasmic methyl-accepting
  chemoreceptor of Pseudomonas aeruginosa, encoded in chemotaxis gene cluster II
  (che2) together with McpA and the CheA2/CheW2/CheY2/CheR2/CheB2 proteins. It
  lacks transmembrane segments. Its N-terminal half has three HAMP domains, then a
  PAS domain that binds penta-coordinated b-type heme, then two further HAMP
  domains and a conserved kinase control (MCP signalling) module ending in a GWEEF
  pentapeptide that recruits the CheR2 methyltransferase and the CheB2
  methylesterase. The PAS-heme domain binds O2 (Kd about 16 uM), and also CO and
  NO, and ligand binding switches the receptor to a signal-on state; expressed in
  Escherichia coli, McpB mediates repellent responses to these gases. In
  P. aeruginosa an mcpB mutant has general chemotaxis defects and reduced
  aerotaxis, aerotaxis is lost in an aer mcpB double mutant, mcpB expression is
  RpoS-dependent, and the gene contributes to virulence in several infection
  models.
