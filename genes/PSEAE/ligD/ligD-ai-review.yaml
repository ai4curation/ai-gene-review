- id: PMID:15897197
  title: Novel 3'-ribonuclease and 3'-phosphatase activities of the bacterial non-homologous end-joining
    protein, DNA ligase D.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only direct P. aeruginosa LigD terminal-ribonucleotide resection evidence.
      The preferred substrate is a DNA primer bearing a short 3′ ribonucleotide tract, not bulk cellular
      RNA. Sequential nucleoside removal and 3′-phosphate hydrolysis are distinguished.
  full_text_unavailable: true
  findings:
  - statement: Resects short terminal ribonucleotide tracts on DNA primer-templates through sequential
      nucleoside removal and phosphate hydrolysis; this is substrate-specific end healing.
    supporting_text: 'The ribonucleotide resection activity resides within a

      187-amino acid N-terminal nuclease domain'
- id: PMID:16046407
  title: Essential constituents of the 3'-phosphoesterase domain of bacterial DNA ligase D, a nonhomologous
    end-joining enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract explicitly reports P. aeruginosa LigD phosphatase activity on an all-DNA primer-template.
      This supports the DNA substrate in GO0046403; RNA-terminal phosphatase activity alone would not
      establish it. Full Figure5 was not independently inspected here.
  full_text_unavailable: true
  findings:
  - statement: Removes a blocking 3′ phosphate from an all-DNA primer-template through the PE module,
      generating a usable 3′ hydroxyl.
    supporting_text: 'the PE domain has a

      3''-phosphatase activity on an all-DNA primer-template'
- id: PMID:20018881
  title: Gap filling activities of Pseudomonas DNA ligase D (LigD) polymerase and functional interactions
    of LigD with the DNA end-binding Ku protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full primary text: recombinant P. aeruginosa Ku/LigD, DNA gap filling with dNTPs, and
      Ku stimulation of LigD. End protection used Ku-(1–253); full-length and other truncations were separately
      tested. This is not a native PA14 or KT2440 assay.'
  full_text_unavailable: false
  findings:
  - statement: Performs template-directed DNA gap filling with deoxynucleotides. This activity describes
      dNTP incorporation; rNTP chemistry is represented separately.
    supporting_text: The primer extension and gap filling reactions were performed in the presence of
      100 μ m dNTPs
  - statement: Seals DNA strand breaks using ATP-dependent ligase chemistry during Ku-supported end joining.
    supporting_text: PaeKu stimulated ribonucleotide addition to DSB ends by PaePOL and DSB end sealing
      by LigD.
  - statement: Extends a short nascent RNA tract against a DNA template during gap filling; this is repair
      synthesis, not a transcriptional role. Initial addition to a DNA3′ end and non-templated additions
      are distinct substrate situations.
    supporting_text: Processive closure of the gap appeared to be less efficient with rNTPs than dNTPs
- id: PMID:26826709
  title: Identification of a conserved 5'-dRP lyase activity in bacterial DNA repair ligase D and its
    potential role in base excision repair.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary biochemistry directly tests Bacillus LigD dCTP gap filling and 5′-dRP lyase,
      and confirms 5′-dRP lyase in purified P. aeruginosa LigD. Native Bacillus strain168-derived spore
      experiments suggest overlapping repair with Nfo but do not alone prove the proposed full BER role.
  full_text_unavailable: false
  findings:
  - statement: Removes a terminal 5′-deoxyribose-phosphate group by beta elimination on defined repair
      substrates. Reconstitution supports chemistry without proving a general native BER assignment.
    supporting_text: 'We demonstrate

      the presence of the dRP lyase activity also in the homolog protein from the

      distantly related bacterium Pseudomonas aeruginosa'
- id: file:interpro/panther/PTHR42705/PTHR42705-paint.tsv
  title: PANTHER PTHR42705 PAINT ancestral-function export
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual IBD placement read and joined to the official tree. The target inherits PTN001627042
      primer synthesis; no loss is invented from lack of direct assays.
  findings:
  - statement: Primer synthesis is asserted at the ancestral node containing the target; the donor is
      experimental grounding, not a pairwise-transfer requirement.
    supporting_text: "PTHR42705\tPTN001627042\tGO:0006269\tP\tIBD\tfalse\tUniProtKB:P9WNV3"
