suggested_questions:
- question: >-
    Should the PTN001627042 IBD for GO:0006269 DNA replication, synthesis of
    primer be removed, since LigD polymerase/primase activity serves NHEJ
    rather than chromosomal replication?
suggested_experiments:
- description: >-
    Measure ionizing-radiation or desiccation survival and plasmid end-joining
    fidelity in P. aeruginosa ligD and ku deletion mutants, with ligD alleles
    inactivating each domain (K238A ligase, D669A/D671A polymerase, H84A
    phosphoesterase), to establish which activities NHEJ needs in vivo.
