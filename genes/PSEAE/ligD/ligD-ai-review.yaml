  evidence_type: IDA
  original_reference_id: PMID:15897197
  qualifier: enables
  review:
    summary: >-
      Proposed. The PE domain hydrolyses the 3'-phosphate left by its
      3'-ribonuclease step to a 3'-OH, and UniProt records the 3'-phosphatase
      as also acting, more actively, on DNA 3'-phosphate ends.
    action: NEW
    reason: >-
      Direct biochemical evidence with purified PaeLigD and the isolated PE
      domain, with active-site mutants (D50, R52, H84) that abolish it. This
      3'-end healing activity is part of the core end-processing function and
      has no GO row yet.
    supported_by:
