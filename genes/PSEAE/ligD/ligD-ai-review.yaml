- term:
    id: GO:0006269
    label: DNA replication, synthesis of primer
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001627042
  - UniProtKB:P9WNV3
  review:
    summary: >-
      IBA from PTN001627042, seeded only by Mtb LigD (P9WNV3, MTBBASE IDA,
      PMID:16023671). ligD is not a seed of this IBD.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The LigD Pol domain has primase-like and primer-extension activities in
      vitro, but LigD acts in NHEJ repair of double-strand breaks with Ku, not
      in chromosomal replication, where primers are made by DnaG. The process
      term claims a replication role that has not been shown for any LigD.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001627042
        source_label: PTN001627042
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          LigD clade; the activity is real but the replication-process term
          does not suit an NHEJ enzyme clade. The topology (panther_tree.py,
          2026-11-05) shows a homogeneous clade of LigD-type ATP-dependent
          ligases, so there is no subclade with a replicative role to move the
          term to.
      - source_id: UniProtKB:P9WNV3
        source_label: LigD (M. tuberculosis)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          In vitro primase activity, coded as a replication process. Paper not
          read here.
    supported_by:
    - reference_id: PMID:20018881
      supporting_text: Many bacterial pathogens, including Pseudomonas aeruginosa, have a nonhomologous end
        joining (NHEJ) system of DNA double strand break (DSB) repair driven by Ku and DNA ligase D (LigD).
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN001627042
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0006269
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The IBD for GO:0006269 DNA replication, synthesis of primer at
        PTN001627042 (LigD clade, 15 leaf IBAs) rests on M. tuberculosis LigD
        (P9WNV3, MTBBASE IDA, PMID:16023671). LigD polymerase/primase activity
        has been shown in vitro, but LigD functions in Ku-dependent NHEJ repair
        of double-strand breaks, not in chromosomal replication. The topology
        was checked with projects/PSEUDOCAP/panther_tree.py on 2026-11-05.
        PTN001627042 is a SPECIATION node (LUCA) with 15 leaves in two
        subfamilies (PTHR42705:SF2 12, SF3 3) and two children: PTN005127089
        (SPECIATION, Eukaryota, 2 leaves: Monosiga MONBRDRAFT_36321 "DNA ligase
        D" and Gossypium LOC107941224) and PTN000048875 (SPECIATION, Eubacteria,
        13 leaves), which holds the Terrabacteria clade PTN008085115 (7 leaves,
        including Mtb LigD P9WNV3 and B. subtilis LigD O34398, plus the
        Streptomyces SF2/SF3 duplication PTN000048869) and the Proteobacteria
        clade PTN005127091 (6 leaves, with P. aeruginosa LigD Q9I1X7 reached
        through the HORIZ_TRANSFER node PTN005127093). Every leaf is a LigD-type
        or ATP-dependent DNA ligase; the two with full names are both
        bifunctional NHEJ proteins, and no leaf is a replicative primase or a
        DnaG-type enzyme. The clade is thus homogeneous, which means the term
        cannot be rescued by moving it to a subclade: the mismatch is between
        the term and the whole family. Please remove this IBD (the activity is
        already covered by the GO:0003887 IBD at the same node and the role by
        GO:0006303 non-recombinational repair). PROBABLE rather than CONFIRMED
        because the topology settles that relocation is not the fix, while the
        Mtb seed paper PMID:16023671 was still not read and could report a
        replication-linked assay.
