taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: LigD is a multifunctional ATP-dependent DNA repair ligase that combines strand sealing with
  repair polymerization. Pseudomonas aeruginosa PAO1 LigD contains an N-terminal phosphoesterase module,
  central ligase module and C-terminal polymerase module. It trims terminal ribonucleotide tracts, removes
  obstructing 3′ phosphates, fills DNA gaps and joins ends in cooperation with Ku. Purified LigD also
  removes 5′-deoxyribose-phosphate groups.
