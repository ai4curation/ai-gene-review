id: Q9I1X7
gene_symbol: ligD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  LigD (PA2138) is the multifunctional DNA ligase of the bacterial
  non-homologous end-joining (NHEJ) pathway that, with the end-binding protein
  Ku, repairs DNA double-strand breaks. The 840-residue protein has three
  autonomous catalytic modules. An N-terminal 3'-phosphoesterase domain removes
  3'-terminal ribonucleotides from DNA ends in two Mn2+-dependent steps, a
  3'-ribonuclease that leaves a 3'-phosphate and a 3'-phosphatase that converts
  it to 3'-OH. A central ATP-dependent DNA ligase domain (EC 6.5.1.1) seals
  nicks through a lysyl-AMP intermediate. A C-terminal polymerase/primase domain
  performs templated primer extension and gap filling (best on gaps with a
  distal 5'-phosphate) and adds one or two non-templated nucleotides,
  preferring rNTPs, to blunt or single-stranded DNA ends. Ku stimulates the
  polymerase and promotes end joining of plasmid double-strand breaks by
  full-length LigD.
