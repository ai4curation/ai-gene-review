existing_annotations:
- term:
    id: GO:0004713
    label: protein tyrosine kinase activity
  evidence_type: EXP
  original_reference_id: PMID:11741974
  qualifier: enables
  review:
    summary: >-
      Direct-evidence row for protein tyrosine kinase activity. The activity is real and
      curator-accepted - the record carries EC 2.7.10.2 with ECO:0000269 - but what was
      measured is autophosphorylation on tyrosine plus phosphorylation of the artificial
      substrate poly(Glu,Tyr).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Real in vitro activity of unknown physiological relevance, which is the middle tier of
      the project's promiscuous-activity rule and the one it assigns this action. No
      physiological protein substrate has been identified; autophosphorylation is common among
      kinases and does not by itself establish a protein-kinase function, and poly(Glu,Tyr) is
      a generic acceptor used to detect tyrosine kinase activity rather than a biological
      target. Meanwhile the activity whose loss is lethal is the sugar kinase, and both the
      naming paper and the assay paper describe WaaP as an essential sugar kinase. Not REMOVE:
      the activity is genuinely measured and the rule reserves removal for noise-level activity
      of a paralog where a dedicated enzyme exists. Not KEEP_AS_NON_CORE either, since that
      would assert a genuine secondary function the organism evolved, and there is no evidence
      for that. The rule states that this tiering applies even on a direct-evidence row, so the
      EXP code does not change the judgement.
    supported_by:
    - reference_id: file:PSEAE/waaP/waaP-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Also has protein-tyrosine kinase activity: autophosphorylates on all Tyr residues; in
        vitro can phosphorylate poly(Glu,Tyr)
    - reference_id: PMID:11741974
      reference_section_type: TITLE
      supporting_text: >-
        WaaP of Pseudomonas aeruginosa is a novel eukaryotic type protein-tyrosine kinase as
        well as a sugar kinase essential for the biosynthesis of core lipopolysaccharide.
