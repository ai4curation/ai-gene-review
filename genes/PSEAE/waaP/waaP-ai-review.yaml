core_functions:
- description: >-
    Essential lipopolysaccharide core heptose kinase: transfers a phosphate to heptose I of the
    Kdo2-lipid A module in the cytoplasm, the modification on which the remaining core sugars
    and phosphates depend and without which the organism is not viable.
  proposed_molecular_function: lipopolysaccharide core heptose kinase activity
  directly_involved_in:
  - id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:PSEAE/waaP/waaP-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Catalyzes the phosphorylation of heptose I (HepI), the first heptose added to the
      Kdo2-lipid A module
  - reference_id: PMID:10692150
    reference_section_type: TITLE
    supporting_text: >-
      Lipopolysaccharide core phosphates are required for viability and intrinsic drug
      resistance in Pseudomonas aeruginosa.
  knowledge_gaps:
  - gap_statement: >-
      Whether WaaP's tyrosine kinase activity has any physiological protein substrate is
      unknown. It autophosphorylates and will modify poly(Glu,Tyr) in vitro, but no cellular
      target has been identified, so it cannot be told apart from an incidental capability of
      a protein-kinase-superfamily fold acting on its own surface tyrosines. Identifying a real
      substrate, or showing there is none, would settle whether this is a second function or an
      artefact of the assay.
    gap_kind:
    - BIOLOGY
proposed_new_terms:
- proposed_name: lipopolysaccharide core heptose kinase activity
  proposed_definition: >-
    Catalysis of the transfer of a phosphate group from ATP to the heptose I residue of the
    inner core of lipopolysaccharide, forming 4-O-phospho-L-alpha-D-heptose within the
    assembled Kdo2-lipid A module. Corresponds to EC 2.7.1.235. Distinct from heptose
    7-phosphate kinase activity (GO:0033785), which phosphorylates a free heptose phosphate
    during nucleotide-sugar synthesis rather than a heptose already incorporated into
    lipopolysaccharide.
  justification: >-
    GO has no class for the reaction carried out by WaaP and its orthologues, although the
    reaction has an EC number (2.7.1.235), a Rhea entry, a dedicated InterPro family
    (IPR017172, lipopolysaccharide core heptose kinase RfaP) and is essential for viability in
    Pseudomonas aeruginosa. The nearest existing term, GO:0033785 heptose 7-phosphate kinase
    activity, describes a different substrate at a different stage: the free sugar phosphate in
    the ADP-heptose synthesis pathway, not a heptose already attached to the growing
    lipopolysaccharide core. The consequence is that an essential, well characterised and
    EC-numbered activity can currently only be annotated as GO:0016301 kinase activity, the
    root of the kinase branch, which conveys nothing about the substrate. The gap is general
    rather than specific to this organism: the KdkA/RfaP family is widespread in Gram-negative
    bacteria, and E. coli RfaP carries the same problem.
  proposed_parent:
    id: GO:0019200
    label: carbohydrate kinase activity
  supported_by:
  - reference_id: file:PSEAE/waaP/waaP-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Catalyzes the phosphorylation of heptose I (HepI), the first heptose added to the
      Kdo2-lipid A module
  - reference_id: file:PSEAE/waaP/waaP-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: 'DR   InterPro; IPR017172; Lsacc_core_hep_kinase_RfaP.'
suggested_questions:
- question: >-
    Does WaaP phosphorylate any physiological protein substrate, or is its tyrosine kinase
    activity confined to autophosphorylation and artificial acceptors? The answer decides
    whether the protein-kinase annotations describe a second function or an in vitro
    capability, and the gene is currently annotated as though the former.
- question: >-
    Is heptose I phosphorylation the committed step that licenses the rest of core assembly, or
    does the truncated core in WaaP-depleted cells reflect a structural requirement for the
    phosphate at a later step? The disruption phenotype shows the whole outer core is lost, but
    not whether that is ordering or stability.
suggested_experiments:
- description: >-
    Screen for WaaP tyrosine-phosphorylated proteins in vivo by phosphotyrosine
    immunoprecipitation and mass spectrometry in strains with and without induced WaaP, to
    determine whether the protein kinase activity has a cellular target.
- description: >-
    Reconstitute core assembly in vitro with purified heptosyltransferases and WaaP, varying
    the order of addition, to test whether the heptose I phosphate is required before the next
    sugar can be transferred or only for the stability of the finished core.
