id: Q9HUF7
gene_symbol: waaP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  WaaP (PA5009) is the lipopolysaccharide core heptose kinase of Pseudomonas aeruginosa, a
  268-residue cytoplasmic enzyme of the KdkA/RfaP branch of the protein kinase superfamily. It
  phosphorylates heptose I, the first heptose added to the Kdo2-lipid A module, and that
  phosphate is a prerequisite for the further core sugars and phosphates that follow. The
  modification is essential in this organism: loss of WaaP is lethal, and depleting it yields
  a truncated lipopolysaccharide that lacks the core phosphates, fails to reach the outer
  membrane, and leaves the cell morphologically abnormal and sensitive to chelators. The same
  protein also autophosphorylates on tyrosine and will phosphorylate the artificial substrate
  poly(Glu,Tyr) in vitro, an activity for which no physiological protein target is known.
