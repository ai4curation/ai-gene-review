- id: PMID:11741974
  title: >-
    WaaP of Pseudomonas aeruginosa is a novel eukaryotic type protein-tyrosine kinase as well
    as a sugar kinase essential for the biosynthesis of core lipopolysaccharide.
  findings:
  - statement: >-
      The paper's own title carries both activities, and marks only the sugar kinase as
      essential for core lipopolysaccharide biosynthesis.
    reference_section_type: TITLE
    supporting_text: >-
      WaaP of Pseudomonas aeruginosa is a novel eukaryotic type protein-tyrosine kinase as well
      as a sugar kinase essential for the biosynthesis of core lipopolysaccharide.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Abstract only in the cache, but its findings reach this review mainly
      through the curated UniProt record, which cites it with ECO:0000269 for the heptose I
      phosphorylation, for both EC numbers, and for the lethal disruption phenotype. The title
      is itself informative for the judgement made here: it asserts a protein-tyrosine kinase
      activity and a sugar kinase activity, and attaches "essential for the biosynthesis of
      core lipopolysaccharide" only to the latter. This is the source of the EXP, IDA and IMP
      rows on this gene.
- id: PMID:12019135
  title: >-
    Nonradiolabeling assay for WaaP, an essential sugar kinase involved in biosynthesis of core
    lipopolysaccharide of Pseudomonas aeruginosa.
  findings:
  - statement: >-
      A dedicated assay for the sugar kinase activity, whose title again frames WaaP as an
      essential sugar kinase rather than as a protein kinase.
    reference_section_type: TITLE
    supporting_text: >-
      Nonradiolabeling assay for WaaP, an essential sugar kinase involved in biosynthesis of
      core lipopolysaccharide of Pseudomonas aeruginosa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. A methods paper developing a non-radiolabel assay for
      the WaaP sugar kinase reaction, and the source of the second GO:0016301 IDA row. Relevant
      here less for new biology than for which activity the field treats as the enzyme's: the
      assay that was worth developing is the sugar kinase one.
- id: PMID:10692150
  title: >-
    Lipopolysaccharide core phosphates are required for viability and intrinsic drug resistance
    in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      The core phosphates that WaaP installs are required for viability and for intrinsic drug
      resistance, which is why the core-region biosynthesis annotation is the gene's core
      process.
    reference_section_type: TITLE
    supporting_text: >-
      Lipopolysaccharide core phosphates are required for viability and intrinsic drug
      resistance in Pseudomonas aeruginosa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Abstract only. Source of the GO:0009244 IDA row. It establishes the
      consequence of the modification rather than the enzymology: without the core phosphates
      the organism is neither viable nor drug-resistant, which is the context that makes this
      an essential biosynthetic step rather than a decoration.
