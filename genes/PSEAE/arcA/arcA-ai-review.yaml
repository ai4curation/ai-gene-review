taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  arcA (PA5171) encodes arginine deiminase (ADI, EC 3.5.3.6) of Pseudomonas
  aeruginosa, a cytoplasmic homotetrameric enzyme of the pentein
  (guanidino-group modifying enzyme) fold that hydrolyses L-arginine to
  L-citrulline and ammonia through a covalent S-alkylthiouronium intermediate on
  the active-site Cys406. It is the first enzyme of the arginine deiminase
  pathway, encoded with the arginine:ornithine antiporter ArcD, catabolic
  ornithine carbamoyltransferase ArcB and carbamate kinase ArcC in the arcDABC
  operon, which is induced by oxygen limitation. The pathway converts arginine to
  ornithine, ammonia and CO2 and yields ATP by substrate-level phosphorylation,
  which lets P. aeruginosa grow slowly by arginine fermentation when oxygen and
  nitrate are absent. The enzyme is activated by Mg2+ or Mn2+, inhibited by Zn2+,
  and has been characterised kinetically and by several crystal structures.
