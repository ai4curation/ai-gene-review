    action: ACCEPT
    reason: >-
      PA5171 is the canonical, experimentally characterised P. aeruginosa ADI
      (purified enzyme, kinetics, crystal structures, Cys406 mechanism), so it is
      inside the clade whose function this is and the seed is sound. The node is
      broad: it also holds a few short leaves that are not annotated as ADIs (for
      example B. subtilis YkgA, a DDAH-family protein), which may be
      over-propagations. That concerns other leaves, not this gene, and is
      flagged for checking.
    supported_by:
