      defined by loss of ADI activity, and the locus was later shown to be the ADI
      structural gene (PMID:2537202).
  full_text_unavailable: true
- id: PMID:2537202
  title: Sequence analysis and expression of the arginine-deiminase and carbamate-kinase
    genes of Pseudomonas aeruginosa.
  findings:
