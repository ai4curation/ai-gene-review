  review:
    summary: >-
      IBA from PAINT node PTN005338738, which spans the PTHR47271 arginine
      deiminase family (bacteria, archaea, protists). Its IBD is seeded only by
      this gene's own PseudoCAP IMP row; the target appearing in its own WITH/FROM
