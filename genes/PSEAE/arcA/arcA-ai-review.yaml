suggested_questions:
- question: >-
    Do the short, DDAH-like leaves under PTN005338738 (B. subtilis YkgA, archaeal
    Q8TSK4, Q97TX4, B1L3J0) have arginine deiminase activity, or should the ADI IBD
    be blocked for them?
- question: >-
    Should the PseudoCAP seed for PTN005338738 be supplemented by an IDA from the
    purified-enzyme study (PMID:2537202), which ties the activity to the arcA
    product directly?
suggested_experiments:
- description: >-
    Express and purify B. subtilis YkgA and the archaeal short PTHR47271 members
    and assay arginine deiminase versus dimethylarginine dimethylaminohydrolase
    activity, to settle whether the ADI node term applies to them.
