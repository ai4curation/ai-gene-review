- term:
    id: GO:0016990
    label: arginine deiminase activity
  evidence_type: IMP
  original_reference_id: PMID:6438064
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IMP; sole seed of the PTN005338738 arginine deiminase activity IBD
      (23 leaf IBAs, 18 taxa). Vander Wauven et al. (1984) isolated PAO mutants
      unable to grow anaerobically on arginine and classified them by which
      ADI-pathway enzyme they lacked; arcA mutants lack arginine deiminase.
    action: ACCEPT
    reason: >-
      A mutant phenotype can support a molecular function when the mutant is shown
      to lack that specific enzyme activity and the mutation lies in the structural
      gene. Both hold here. The arcA class was defined by loss of ADI activity
      alone, distinct from the regulatory class that lost all three enzymes, and
      the arcA locus was then shown to encode the ADI polypeptide (PMID:2537202).
      This is not the indirect-phenotype failure (loss of growth or of an
      unrelated downstream activity). Direct biochemical evidence (purified enzyme,
      kinetics, structures) would justify an IDA from PMID:2537202, but the IMP is
      sound as it stands.
    supported_by:
    - reference_id: PMID:6438064
      supporting_text: >-
        The mutations arcA (arginine deiminase), arcB (catabolic ornithine
        carbamoyltransferase), arcC (carbamate kinase), and arcD were highly
        cotransducible and mapped in the 17-min chromosome region.
    - reference_id: PMID:6438064
      supporting_text: >-
        Some mutations in the arc cluster led to low, noninducible levels of all
        three arginine deiminase pathway enzymes
    - reference_id: PMID:2537202
      supporting_text: >-
        The arcA open reading frame specifies a polypeptide of 46.3 kDa. The same
        molecular mass was obtained for the subunit of purified arginine deiminase
        after electrophoresis under denaturing conditions.
core_functions:
- description: >-
    Cytoplasmic, cysteine-dependent arginine deiminase that hydrolyses L-arginine
    to L-citrulline and ammonia, the first step of the ATP-generating arginine
    deiminase pathway used for anaerobic (fermentative) growth on arginine.
