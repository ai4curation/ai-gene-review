  title: The arc operon for anaerobic arginine catabolism in Pseudomonas aeruginosa
    contains an additional gene, arcD, encoding a membrane protein.
  findings:
  - statement: The ADI pathway generates ATP and is encoded by the arcDABC operon.
    supporting_text: >-
      The arginine deiminase (ADI) pathway in Pseudomonas aeruginosa serves to
      generate ATP.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
  full_text_unavailable: true
- id: PMID:14701825
  title: Structural insight into arginine degradation by arginine deiminase, an antibacterial
    and parasite drug target.
  findings:
  - statement: >-
      Crystal structure of P. aeruginosa ADI; pentein fold shared with DDAH and
      amidinotransferases; conserved Cys-His-Asp catalytic motif.
    supporting_text: >-
      We have determined the crystal structure of ADI from Pseudomonas aeruginosa
      by the multi-wavelength anomalous diffraction method at 2.45 A resolution.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
  full_text_unavailable: true
- id: PMID:16091358
  title: Crystal structures representing the Michaelis complex and the thiouronium
    reaction intermediate of Pseudomonas aeruginosa arginine deiminase.
  findings:
  - statement: >-
      Cys406 is the catalytic nucleophile forming an S-alkylthiouronium
      intermediate; His278, Asp280 and Asp166 mediate proton transfers.
    supporting_text: >-
      The function of Cys406 in nucleophilic catalysis has been demonstrated by
      transient kinetic studies.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
  full_text_unavailable: true
