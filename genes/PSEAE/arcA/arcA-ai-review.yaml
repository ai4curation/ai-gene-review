      The arcA ORF encodes the 46 kDa ADI subunit (matching purified enzyme size
      and N-terminal sequence); native ADI is a tetramer with Km 0.04 mM for
      arginine, activated by Mg2+/Mn2+ and inhibited by Zn2+.
    supporting_text: >-
      The enzyme was activated by Mg2+ or Mn2+ and strongly inhibited by Zn2+.
