suggested_questions:
- question: >-
    Does SpuB gamma-glutamylate spermidine directly, and at which amino group,
    or does it act on a spermidine-derived intermediate?
suggested_experiments:
- description: >-
    Purify SpuB/PauA2 and measure ATP-dependent gamma-glutamylation of
    spermidine, putrescine and 1,3-diaminopropane, identifying the product by
    LC-MS.
