- id: PMID:21622750
  title: Functional characterization of seven γ-Glutamylpolyamine synthetase genes
    and the bauRABCD locus for polyamine and β-Alanine utilization in Pseudomonas
    aeruginosa PAO1.
  findings:
  - statement: Specific combinations of pauA knockouts are needed to abolish growth on different polyamines.
    supporting_text: The results revealed that it requires specific combinations of
      pauA knockouts to abolish utilization of different polyamines and support the
      importance of γ-glutamylation for polyamine catabolism in P. aeruginosa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP GO:0046203 row, seed of PTN001839150. Cached
      copy abstract only; the PMC page (PMC3147493) was read through a fetch
      summary, which gives Table 1 pauA2 = PA0298 (spuB) and states that a
      single pauA2 knockout completely blocks growth on spermidine while growth
      on diamines is normal. No purified-enzyme assay.
- id: PMID:12081945
  title: Functional analysis and regulation of the divergent spuABCDEFGH-spuI operons
    for polyamine uptake and utilization in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: spuB mutants are defective in spermidine utilization.
    supporting_text: Although spuA and spuB mutants showed an apparent defect in spermidine
      utilization, the biochemical functions of the gene products have yet to be elucidated.
  - statement: SpuB is a glutamine synthetase homologue similar to E. coli YcjK (PuuA).
    supporting_text: One interesting feature of these spu genes is the presence of two
      putative glutamine synthetase homologues encoded by spuB and spuI .
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; independent support for the spermidine phenotype of spuB.
