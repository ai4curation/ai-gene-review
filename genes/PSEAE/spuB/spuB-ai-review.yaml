taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SpuB (PA0298, PauA2) is a glutamine synthetase-like gamma-glutamylpolyamine
  synthetase of Pseudomonas aeruginosa PAO1, encoded in the polyamine-inducible
  spuABCDEFGH operon and homologous to Escherichia coli PuuA, the
  gamma-glutamylputrescine synthetase that starts the gamma-glutamylation route
  from polyamines to GABA. SpuB is the only one of the seven PauA paralogs
  whose single loss blocks growth on spermidine, so it is thought to be the
  spermidine-glutamylating enzyme; it also contributes, with PauA1 and PauA4,
  to putrescine utilization. Its activity has not been assayed with purified
  protein.
