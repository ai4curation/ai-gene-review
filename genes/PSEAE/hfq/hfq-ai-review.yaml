taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: hfq (PA4944) encodes the Sm-like RNA chaperone Hfq of Pseudomonas aeruginosa, a homohexameric
  RNA-binding protein that binds small regulatory RNAs and A-rich sequences in mRNAs. Hfq stabilises
  regulatory RNAs such as RsmY, which titrates the translational repressor RsmA, and so indirectly raises
  translation of quorum-sensing genes such as rhlI. It is the principal post-transcriptional effector of
  carbon catabolite repression, binding the ribosome binding site of catabolic mRNAs such as amiE and
  blocking their translation; the regulatory RNA CrcZ, induced when preferred carbon sources run out,
  sequesters Hfq and relieves repression. Through these activities Hfq affects a large fraction of the
  transcriptome, including virulence and quorum-sensing outputs.
