- description: Hexameric RNA chaperone that binds sRNAs and the A-rich ribosome binding sites of target
    mRNAs, repressing translation of catabolic mRNAs during carbon catabolite repression (antagonised by the
    decoy RNA CrcZ) and stabilising regulatory RNAs such as RsmY.
