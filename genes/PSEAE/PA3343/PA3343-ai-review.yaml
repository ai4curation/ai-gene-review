  review:
    summary: >-
      IBA from PTN002895351, whose GO:0043709 IBD rests on one seed annotated acts_upstream_of_or_within.
      HsbD controls biofilm formation through c-di-GMP but is not an adhesion component.
    action: MODIFY
    reason: >-
      A DGC regulates biofilm formation and does not take part in adhesion. The replacement
      is the unsigned GO:1900190, because HsbD is needed for the hyperbiofilm of an hptB mutant
      but single hsbD mutants show unchanged or more biofilm. The node-level GO_CENTRAL defect
      is recorded once in the PA1107 review.
    proposed_replacement_terms:
    - id: GO:1900190
      label: regulation of single-species biofilm formation
    supported_by:
    - reference_id: PMID:27792789
      supporting_text: >-
        Finally, complementation of the hsbD deletion restored the hyper-biofilm phenotype
        of the hptB mutant (S2 Fig).
    - reference_id: PMID:35935233
      supporting_text: >-
        Three of the mutants in a putative dgc gene resulted in a slight upregulation of attachment
        (fold change ranging between 1.2 and 1.4): PA2771 (dcsbis; Chen et al., 2016), PA3343
        (hsbD; Valentini et al., 2016) and most significantly PA4396.
    - reference_id: file:PSEAE/PA3343/PA3343-notes.md
      supporting_text: |-
