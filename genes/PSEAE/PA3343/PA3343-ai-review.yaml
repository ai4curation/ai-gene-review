taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  HsbD (PA3343) is a 389-aa inner-membrane diguanylate cyclase of Pseudomonas aeruginosa,
  with six predicted transmembrane helices (a MASE8 domain) and a C-terminal GGDEF domain
  carrying the GGEEF motif and an RxxD inhibitory site that binds c-di-GMP. Overexpression
  raises c-di-GMP in P. aeruginosa extracts and turns E. coli colonies red on Congo red, which
  a GGAAF active-site mutant does not. HsbD is encoded next to the hptB-hsbR-hsbA flagellar
  and chemotaxis cluster, binds the anti-anti-sigma factor HsbA, and links c-di-GMP signalling
  to the HptB pathway. In an hptB mutant HsbD is needed for the high c-di-GMP and hyperbiofilm
  phenotypes, and its loss causes hyper-swarming; on its own, the hsbD deletion abolishes
  chemotaxis and alters twitching. HsbD lies at the cell periphery with dynamic polar foci.
  Single hsbD mutants show unchanged or slightly increased biofilm and attachment, so the
  sign of its biofilm effect depends on the state of the HptB pathway.
references:
- id: PMID:16477007
  title: >-
    Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases reveals
    a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: >-
      Extracts of a PA14 strain overexpressing PA3343 contained 22 pmol c-di-GMP per mg wet
      cell weight (Table 1, read in PMC full text; detection limit 12).
    supporting_text: >-
      Analysis of the phenotypes of DGC and PDE mutants and overexpressing clones revealed
      that certain virulence-associated traits are controlled by multiple DGCs and PDEs through
      alterations in c-di-GMP levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0052621 row and of PA3343 seeding PTN002895344. Cached
      copy is abstract-only; full text read on PMC (PMC1413825), verbatim excerpts in the
      notes. Whole-cell extract assay on an overexpressing strain; crude but direct. Note
      that PMID:27792789 cites this table as giving 445 pmol/mg for PA3343; 445 is the value
      of the next row, PA3702 (WspR).
- id: PMID:27792789
  title: >-
    The Diguanylate Cyclase HsbD Intersects with the HptB Regulatory Cascade to Control Pseudomonas
    aeruginosa Biofilm and Motility.
  findings:
  - statement: >-
      HsbD expression causes Congo-red staining in E. coli and a GGAAF active-site mutant
      does not.
    supporting_text: >-
      HsbD causes the red colony staining, phenotype correlated with a global increase in
      intracellular c-di-GMP levels [30, 31]; while a catalytic inactive GGAAF mutant does
      not trigger such output.
  - statement: hsbD is required for the hyperbiofilm phenotype of an hptB mutant (complemented).
    supporting_text: >-
      Finally, complementation of the hsbD deletion restored the hyper-biofilm phenotype of
      the hptB mutant (S2 Fig).
  - statement: Deleting hsbD in an hptB mutant causes hyper-swarming.
    supporting_text: >-
      the resulting strain displays a striking hyper-swarming phenotype (~9 fold increase
      in swarming area, Fig 4B).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Main functional study of HsbD. It misquotes the Kulasekara Table 1
      value for PA3343 (445 vs 22 pmol/mg, a one-row slip), which does not affect its conclusions.
- id: PMID:35935233
  title: >-
    Phenotypic and integrated analysis of a comprehensive Pseudomonas aeruginosa PAO1 library
    of mutants lacking cyclic-di-GMP-related genes.
  findings:
  - statement: A PAO1 hsbD deletion slightly increases attachment.
    supporting_text: >-
      Three of the mutants in a putative dgc gene resulted in a slight upregulation of attachment
      (fold change ranging between 1.2 and 1.4): PA2771 (dcsbis; Chen et al., 2016), PA3343
      (hsbD; Valentini et al., 2016) and most significantly PA4396.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Library-scale screen.
