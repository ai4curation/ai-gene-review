knowledge_gaps:
- gap_statement: >-
    How HsbA binding and HptB-pathway phosphorylation control HsbD cyclase activity and its
    polar localisation, and which c-di-GMP effector carries its output to the flagellar and
    chemotaxis machinery, are unknown.
  gap_kind:
  - BIOLOGY
suggested_experiments:
- description: >-
    Purify HsbD (GGDEF domain and full length) and measure c-di-GMP synthesis with phosphorylated
    and unphosphorylated HsbA.
