taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4218 (AmpP, also called AmpGh1) is a 10-helix inner-membrane transporter of the major
  facilitator superfamily in Pseudomonas aeruginosa, a distant paralog of the muropeptide
  permease AmpG (19% identity). It is classified in the RhtX/FptX siderophore transporter
  subfamily (NCBIfam TIGR02718, TC 2.A.1.57.1), and it is encoded in a two-gene operon with
  PA4219 (ampO). The transported substrate has not been demonstrated. ampP mutants fail to
  reach maximal beta-lactam-induced ampC expression, and ampP expression is AmpR -inducible;
  unlike ampG, ampP does not complement an E. coli ampG mutant.
references:
- id: PMID:21192796
  title: >-
    Pseudomonas aeruginosa β-lactamase induction requires two permeases, AmpG and AmpP.
  findings:
  - statement: PhoA/LacZ fusions show AmpP is an inner-membrane protein with 10 TM helices.
    supporting_text: >-
      AmpP fusions at amino acids 80, 170, 248, 308, 400 as well as full length were LacZ-positive
      and PhoA-negative, and fusions at amino acids 38, 120, 195, 278, and 360 were LacZ-negative
      and PhoA-positive, consistent with 10 TM domains (Figures 4A and 4B).
  - statement: >-
      Benzylpenicillin induction of the ampC promoter is lost in ampP and ampG mutants.
    supporting_text: >-
      Benzyl-penicillin dependent induction of PampC-lacZ was lost in PAOampG or PAOampP (Figure
      6).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. PseudoCAP source for the IDA GO:0022857 seed row of PTN008542531 and
      the cell wall, beta-lactamase activity and antibiotic rows. The direct data are membrane
      topology and beta-lactamase/ampC promoter induction in mutants; no transport assay is
      reported, so the IDA code for transporter activity is not supported by this paper.
- id: PMID:20713660
  title: ampG gene of Pseudomonas aeruginosa and its role in β-lactamase expression.
  findings:
  - statement: >-
      ampGh1 (PA4218) deletion has little effect on beta-lactam resistance and does not complement
      ampG mutants.
    supporting_text: resistance while ampGh1 deletion had little effect on the resistance
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; PA4218 is not the functional AmpG.
