proposed_new_terms:
- proposed_name: glycine betaine monooxygenase activity
  proposed_definition: >-
    Catalysis of the reaction glycine betaine + NADH + O2 + H+ =
    N,N-dimethylglycine + formaldehyde + NAD+ + H2O (EC 1.14.13.251,
    RHEA:45700).
  justification: >-
    The two-component Rieske glycine betaine monooxygenase (GbcAB in
    Pseudomonas) has no GO term, so the reductase and oxygenase subunits can be
    annotated only to generic oxidoreductase activity.
suggested_questions:
- question: >-
    Does purified GbcB reduce GbcA directly with NADH, and is its activity
    specific to GbcA or shared with other Rieske oxygenases?
suggested_experiments:
- description: >-
    Reconstitute GbcA and GbcB in vitro, measure NADH-dependent GB to DMG
    conversion and NADH oxidation by GbcB alone with cytochrome c or GbcA as
    acceptor.
