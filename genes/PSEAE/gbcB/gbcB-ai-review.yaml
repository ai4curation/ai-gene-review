taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  GbcB (PA5411) is the reductase component of the two-component Rieske-type
  glycine betaine monooxygenase of Pseudomonas aeruginosa, which demethylates
  glycine betaine to dimethylglycine in the catabolism of choline-derived
  quaternary amines. It has an N-terminal FAD- and NAD-binding reductase module and
  a C-terminal plant-type [2Fe-2S] ferredoxin domain, and is thought to pass
  electrons from NADH to the oxygenase subunit GbcA. gbcA and gbcB mutants cannot
  grow on glycine betaine but grow on dimethylglycine, and their expression is
  induced by glycine betaine through the AraC-family activator GbdR.
references:
- id: PMID:17951379
  title: Identification of two gene clusters and a transcriptional regulator required
    for Pseudomonas aeruginosa glycine betaine catabolism.
  findings:
  - statement: gbcA and gbcB mutants grow on DMG but not on GB.
    supporting_text: strains with mutations in two genes, gbcA (PA5410) and gbcB (PA5411),
      were capable of growth on dimethylglycine (DMG), a catabolic product of GB, but
      not on GB itself
  - statement: 13C NMR shows gbcAB are needed for GB to DMG conversion.
    supporting_text: Subsequent nuclear magnetic resonance (NMR) experiments with 1,2-(13)C-labeled
      choline indicated that these genes are necessary for conversion of GB to DMG.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only (no PMC body returned). PseudoCAP source of the IDA
      GO:0016491 seed row of PTN005342051 and of the IMP glycine betaine
      catabolic process row. The abstract reports mutant growth and in vivo 13C
      NMR of metabolite flux; it does not mention an enzyme assay, so the IDA
      code may be generous, but the term itself is correct.
