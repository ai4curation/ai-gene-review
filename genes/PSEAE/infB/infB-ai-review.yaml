suggested_questions:
- question: >-
    What fraction of P. aeruginosa translation initiation uses unformylated
    Met-tRNAfMet under normal growth, and does IF-2 discrimination change under
    stress or antibiotic (e.g. actinonin) treatment?
suggested_experiments:
- description: >-
    Measure in vitro 30S initiation complex formation with purified PA IF-2 and
    formylated versus unformylated Met-tRNAfMet, comparing wild-type and
    cleft-charge mutants.
