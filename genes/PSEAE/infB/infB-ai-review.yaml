core_functions:
- description: >-
    Translational GTPase initiation factor IF-2. Binds initiator Met-tRNAfMet
    (formylated or, in P. aeruginosa, also unformylated), delivers it to the
    30S subunit and hydrolyses GTP on 50S joining to form the 70S initiation
    complex.
