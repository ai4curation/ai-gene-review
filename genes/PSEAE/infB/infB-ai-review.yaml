id: Q9HV55
gene_symbol: infB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  infB (PA4744) encodes translation initiation factor IF-2, a translational GTPase
  of the TRAFAC classic translation factor family. IF-2 binds the initiator
  tRNA, promotes its placement on the 30S ribosomal subunit and hydrolyses GTP
  during joining of the 50S subunit to form the 70S initiation complex. P.
  aeruginosa can initiate protein synthesis with either formylated or
  unformylated initiator Met-tRNAfMet, and its IF-2 is required for the
  formylation-independent route. This capacity maps to the charge of the cleft
  that binds the amino end of the aminoacyl group: lowering its positive
  potential lets E. coli IF-2 accept Met-tRNAfMet, and raising it in P.
  aeruginosa IF-2 abolishes formylation-independent initiation. The protein is
  cytoplasmic.
references:
- id: PMID:15385567
  title: The Pseudomonas aeruginosa initiation factor IF-2 is responsible for formylation-independent
    protein initiation in P. aeruginosa.
  findings:
  - statement: P. aeruginosa IF-2 is required for formylation-independent initiation
      of protein synthesis.
    supporting_text: Here we show that the Pseudomonas aeruginosa initiation factor
      IF-2 is required for formylation-independent protein initiation in P. aeruginosa
  - statement: The charge of the aminoacyl-binding cleft of IF-2 determines whether
      unformylated Met-tRNAfMet can be used.
    supporting_text: increasing the positive charge potential of this cleft in the P.
      aeruginosa IF-2 prevented the protein from participating in formylation-independent
      protein initiation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP translational initiation row, which seeds the
      PTN001897651 IBD. Abstract only (no PMC full text). The abstract states
      the genetic requirement and the cleft structure-function result
      directly, so the process term is supported for this gene.
