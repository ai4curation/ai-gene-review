suggested_questions:
- question: >-
    Is the reported promoter-unwinding role of RecG in OxyR regulon induction a direct
    transcriptional function, or an indirect effect of its DNA repair and replication roles?
suggested_experiments:
- description: >-
    Purify P. aeruginosa PA5345 and assay branch migration on synthetic Holliday junctions
    and forks, alongside the palindromic katB/ahpB promoter fragments used by Yeom et al.;
    test OxyR-regulon induction in a recG point mutant lacking ATPase activity.
  experiment_type: biochemistry and genetics
