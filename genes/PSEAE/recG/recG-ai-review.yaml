taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  RecG (PA5345) is the ATP-dependent DNA helicase of Pseudomonas aeruginosa that processes
  branched DNA: by homology with E. coli RecG it drives Holliday-junction branch migration
  and regresses stalled replication forks, translocating with 3'-5' polarity, and so acts
  in recombinational DNA repair. In P. aeruginosa recG forms an operon with oxyR; recG
  mutants are hypersensitive to UV, mitomycin C, chromate, tellurite and selenite and less
  resistant to peroxides. RecG has also been reported to bind palindromic promoter regions
  of OxyR-controlled genes and to promote their induction, possibly by unwinding these
  sequences.
