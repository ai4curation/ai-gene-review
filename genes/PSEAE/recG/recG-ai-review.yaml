- id: PMID:10913087
  title: 'Role of the Pseudomonas aeruginosa oxyR-recG operon in oxidative stress defense and DNA repair:
    OxyR-dependent regulation of katB-ankB, ahpB, and ahpC-ahpF.'
  findings:
  - statement: A recG::Gm mutant is hypersensitive to UV; recG in trans partially restores tolerance.
    supporting_text: The recG ::Gm mutant was hypersensitive to UV and was killed by more than 5 log units
      within 20 s of irradiation.
  - statement: The recG mutant is less resistant to H2O2 and cumene hydroperoxide.
    supporting_text: Still, recG appeared to be essential for optimal resistance to H 2 O 2 and CHP, and
      the recG mutant could be complemented by the recG gene in trans .
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for IMP DNA repair (seed of the PTN002773745 GO:0006281 IBD), cellular
      response to UV and cellular response to oxidative stress. Full text cached and read for
      the recG experiments (UV killing curves with complementation; disk assays).
- id: PMID:16105671
  title: Involvement of DNA helicases in chromate resistance by Pseudomonas aeruginosa PAO1.
  findings:
  - statement: recG (PA5345) transposon mutant is chromate-hypersensitive and complemented by recG.
    supporting_text: The chromate resistance phenotype in mutants GGP-64 and AJ-22 was restored by cosmids
      bearing wild type ruvB or recG genes, respectively.
  - statement: The mutants are also sensitive to tellurite, selenite and mitomycin C.
    supporting_text: both mutant strains showed an increased susceptibility to the toxic oxyanions tellurite
      and selenite as well as to mitomycin C, but not to arsenite, paraquat and hydrogen peroxide.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for IMP DNA repair (seed), cellular response to chromate and cellular
      response to selenite ion. Abstract only; it names PA5345/recG and reports complementation.
- id: PMID:22621928
  title: ATP-dependent RecG helicase is required for the transcriptional regulator OxyR function in Pseudomonas
    species.
  findings:
  - statement: Purified RecG binds palindromic promoters and, with ATP, generates linear DNA that OxyR binds.
    supporting_text: The OxyR tetramer preferentially binds to promoters after RecG has generated linear
      DNA in the presence of ATP
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PseudoCAP source for IDA GO:0003678 (seed of the PTN002773745 GO:0003678 IBD) and IDA
      GO:0009378. Abstract only; the PMC record returned no body text. The abstract covers P.
      aeruginosa, P. putida and E. coli and does not say which organism's RecG was purified,
      so the attribution of the in vitro activity to PA5345 could not be checked. The
      proposed transcriptional role of RecG is unusual and has not, to my knowledge, been
      independently confirmed.
