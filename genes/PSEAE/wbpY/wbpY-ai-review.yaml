- id: PMID:9680202
  title: 'Three rhamnosyltransferases responsible for assembly of the A-band D-rhamnan
    polysaccharide in Pseudomonas aeruginosa: a fourth transferase, WbpL, is required
    for the initiation of both A-band and B-band lipopolysaccharide synthesis.'
  full_text_unavailable: true
  findings:
  - statement: wbpX, wbpY and wbpZ mutants lack A-band LPS while B-band LPS is unaffected; WbpY was
      proposed by sequence and phenotype to add a1-3-linked D-Rha.
    reference_section_type: ABSTRACT
    supporting_text: these mutants are unable to synthesize A-band LPS, while B-band synthesis is
      unaffected
  - statement: The 1998 paper hypothesised that WbpY transfers two alpha1-3 linked D-Rha residues
      before WbpX makes the alpha1-2 linkage.
    reference_section_type: ABSTRACT
    supporting_text: while WbpY and WbpX subsequently transfer two alpha1-->3 linked Rha residues
      and one alpha1-->2 linked Rha respectively
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:35166992
      review_notes: >-
        DISPUTED rather than OVERTURNED, because the later work reports a failure to confirm rather
        than a refutation: WbpY was seen to add a single alpha1-3 residue, and the authors say they
        could not confirm that it adds a second by itself, while noting its low homology to WbdB,
        which transfers two D-Man residues. The one-residue result is in this review's own
        core_functions; the two-residue hypothesis is left unconfirmed, not disproved.
      supported_by:
      - reference_id: PMID:35166992
        reference_section_type: DISCUSSION
        supporting_text: However we were unable to confirm that WbpY by itself adds a second
          D-Rhaα1-3 linkage although it has low homology to WbdB that transfers 2 D-Man residues.
  - statement: The 1998 paper predicted the two chain-extending transferases to be processive.
    reference_section_type: ABSTRACT
    supporting_text: The last two transferases are predicted to be processive
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:35166992
      review_notes: >-
        A prediction from sequence, not a measurement, and the later enzymology reads the mechanism
        the other way: mass spectrometry of the WbpX/WbpY reaction is reported as non-processive, and
        the authors note that neither enzyme carries the QxxRW motif of processive enzymes, so the
        mechanism may be non-processive or partially processive. Recorded here rather than only in
        prose so that a later curator reading this reference does not curate the prediction.
      supported_by:
      - reference_id: PMID:35166992
        reference_section_type: RESULTS
        supporting_text: WbpX and WbpY lack the QxxRW sequence found in processive enzymes [47] and
          therefore may act in a non-processive or partially processive mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; correct genetic support for the process rows (LPS/O antigen
      biosynthesis). As support for an MF (glycosyltransferase activity) its abstract reports only
      phenotype-based evidence; direct activity came in PMID:35166992. Abstract only (no PMC copy).
- id: PMID:35166992
  title: Biosynthesis of the Pseudomonas aeruginosa common polysaccharide antigen by
    D-Rhamnosyltransferases WbpX and WbpY.
  findings:
  - statement: Recombinant WbpY transfers one D-Rha from GDP-D-Rha in a1-3 linkage to the WbpZ
      product.
    reference_section_type: ABSTRACT
    supporting_text: NMR spectroscopic analysis of the WbpY reaction product showed that WbpY
      transferred one D-Rha residue in α1-3 linkage
  - statement: WbpX and WbpY acting together extend the WbpZ product into a D-rhamnan oligomer,
      where each enzyme alone adds a single residue to that acceptor.
    reference_section_type: INTRODUCTION
    supporting_text: While WbpX and WbpY transferred one D-Rha residue to the WbpZ product, the
      combination of WbpX and WbpY resulted in the synthesis of a D-Rhamnan polymer of at least 8
      D-Rha residues.
  - statement: The paper runs the swap in both directions, and it comes out asymmetrically. Given an
      already-elongated acceptor, WbpX keeps going and WbpY does not, so the single-residue limit is
      the acceptor for WbpX and the enzyme for WbpY. This is the result behind reading WbpY as the
      adapter-building enzyme and WbpX as the polymerase.
    reference_section_type: RESULTS
    supporting_text: This suggests that WbpY transfers one D-Rha residue to D-Rhaα1-3-D-GlcNAcα-PP-PhU.
      Subsequently, WbpX transfers additional D-Rha residues.
  - statement: On the isolated WbpX product, WbpY adds one residue and stops.
    reference_section_type: RESULTS
    supporting_text: After 1 h incubation time GST-WbpY added one additional D-Rha residue to the
      WbpX-product indicated by m/z 1064.4 (Fig. 10A).
  - statement: WbpY does not act on WbpX's benzyl-acceptor products at all.
    reference_section_type: RESULTS
    supporting_text: "[D-Rhaα1-2/3]n-D-Rhaα-Bn, the reaction products of WbpX using D-Rhaα-Bn
      substrate at 2.5 mM concentration, was not an acceptor for WbpY."
  - statement: From that the authors conclude that WbpY needs a disaccharide or the lipid diphosphate
      in its acceptor, and so that it is the enzyme acting directly after WbpZ. This is the
      Results-level evidence for the adapter-building role, which the Discussion then states.
    reference_section_type: RESULTS
    supporting_text: This indicates that a terminal D-Rhaα residue is not sufficient and WbpY requires
      a disaccharide or the presence of the diphosphate-lipid moiety in its acceptor. These studies
      suggest that WbpY is the enzyme that follows WbpZ in the pathway to CPA.
  - statement: WbpY makes only the alpha1-3 linkage despite two proposed glycosyltransferase domains.
    reference_section_type: DISCUSSION
    supporting_text: Thus, WbpX may have a flexible and dynamic catalytic site while WbpY only
      synthesizes the α1-3 linkage although it has 2 proposed GT domains.
  - statement: WbpX makes both linkages, and extends the chain, with a single predicted domain.
      Reading the two sentences together, domain count does not predict linkage repertoire in this
      pair, which bears on the 1998 proposal that WbpY adds two of the three repeat residues. That
      cross-sentence reading is this review's, not a claim either sentence makes alone.
    reference_section_type: DISCUSSION
    supporting_text: WbdA has 2 or 3 GT domains while WbpX has only one predicted GT domain that
      appears to add several D-Rha residues in sequence and also alternate between creating α1-2 and
      α1-3 linkages.
  - statement: The authors call WbpY monofunctional on the strength of the linkage NMR, which found a
      single alpha1-3 linkage, not on the strength of its acceptor range.
    reference_section_type: RESULTS
    supporting_text: The spectra indicated that WbpY transferred a single D-Rha residue in α1-3
      linkage to form D-Rhaα1-3-D-Rhaα1-3-D-GlcNAcα-PP-PhU (Fig. 12). Thus WbpY is a monofunctional
      α1,3-D-RhaT.
  - statement: WbpZ makes the primer, on which WbpY builds an adapter or anchor structure that the
      D-rhamnan polymer is then built upon.
    reference_section_type: DISCUSSION
    supporting_text: We conclude that WbpZ synthesizes the D-Rhaα1-3-D-GlcNAc-PP-Und primer which is
      a substrate for WbpY to synthesize an adapter or anchor structure upon which the D-Rha polymer
      is built.
  - statement: The authors read WbpX rather than WbpY as the main polymerase of the pair.
    reference_section_type: DISCUSSION
    supporting_text: This supports the idea that WbpX is the main polymerase enzyme.
  - statement: WbpY's narrow acceptor specificity is read as confining it to act near the lipid
      carrier, where WbpX can extend the polymer away from it.
    reference_section_type: DISCUSSION
    supporting_text: In contrast, the narrow acceptor specificity of WbpY seems to dictate that it
      has to act near the PP-Und moiety.
  - statement: WbpY is judged unlikely to build a D-mannose polymer, its acceptor specificity being
      restricted, so any in vivo D-mannose it contributed would be single residues.
    reference_section_type: DISCUSSION
    supporting_text: WbpY could transfer a single D-Man but due its restricted acceptor specificity
      it is not likely to build a D-Man polymer.
  - statement: CPA is essentially a D-rhamnan but carries a small amount of D-mannose and other
      minor sugars, so WbpY's D-mannosyltransferase activity may have an in vivo counterpart.
    reference_section_type: DISCUSSION
    supporting_text: CPA from various PA strains is essentially a D-rhamnan but has been shown to
      contain a small amount of D-Man as well as other monosaccharides including xylose and ribose
  - statement: WbpY also transfers D-mannose from GDP-D-mannose at about 70 per cent of its
      D-rhamnosyltransferase activity, making it a dual D-rhamnosyl/D-mannosyltransferase.
    reference_section_type: RESULTS
    supporting_text: In contrast, His6-WbpY had also significant D-ManT activity using GDP-[3H]Man
      which was 70% of the D-RhaT activity (Table 1).
  - statement: WbpX, by contrast, transfers no nucleotide sugar other than GDP-D-rhamnose.
    reference_section_type: RESULTS
    supporting_text: WbpX showed no transferase activity using any of the nucleotide sugars other
      than GDP-D-[3H]Rha, indicating that it is exclusively a D-RhaT.
  - statement: The authors read the polymerisation as non-processive, and hedge it themselves on the
      ground that neither enzyme carries the QxxRW motif of processive enzymes.
    reference_section_type: RESULTS
    supporting_text: WbpX and WbpY lack the QxxRW sequence found in processive enzymes [47] and
      therefore may act in a non-processive or partially processive mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; direct biochemical evidence for WbpY D-rhamnosyltransferase
      activity, suitable to re-seed PTN005302544.
- id: PMID:25845842
