- term:
    id: GO:0009103
    label: lipopolysaccharide biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:9680202
  qualifier: involved_in
  review:
    summary: PseudoCAP IMP LPS biosynthetic process (wbpY mutant lacks A-band LPS); sole seed of
      PTN000749272.
    action: TOO_GENERAL
    reason: >-
      The seed is sound in substance; the mutant lacks A-band LPS with B-band unaffected and WbpY
      catalyses a step of CPA synthesis. The specific process is CPA O-antigen synthesis, GO:0009243
      O antigen biosynthetic process, which this review already accepts on its own IDA row. An
      earlier version of this review used MODIFY to that term, but a MODIFY proposes a replacement,
      and proposing one the gene already carries adds nothing: the case is the one
      action_consistency.yaml calls the intended use of TOO_GENERAL, a broad term subsumed by a more
      specific accepted term. wbpX reaches the same verdict on the same row from the same paper, so
      the pair now agrees here too.

      Note why this row is TOO_GENERAL while the GO:0016757 rows are ACCEPT, since both are ancestors
      of a term asserted elsewhere in this review. Lipopolysaccharide biosynthetic process is
      imprecise in its own right once O-antigen synthesis is asserted, because LPS is lipid A plus
      core plus O antigen and the row does not say which part this gene builds. Glycosyltransferase
      activity is not imprecise in that way: it is a definite claim about what the protein does to a
      substrate, and it is as precise as those rows' own evidence reaches.
