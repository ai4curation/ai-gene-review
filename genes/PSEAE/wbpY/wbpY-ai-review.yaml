    Characterization and Role of GDP-D-Rhamnose:GlcNAc/GalNAc-Diphosphate-Lipid α1,3-D-Rhamnosyltransferase
    WbpZ.'
  findings:
  - statement: WbpZ adds the first D-Rha to GlcNAc/GalNAc-PP-lipid, generating the acceptor used by
      WbpY.
    supporting_text: WbpZ transferred one D-Rha residue from GDP-D-Rha in α1-3 linkage to both
      GlcNAc- and GalNAc-diphosphate-lipid acceptor substrates
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Pathway context (step preceding WbpY).
core_functions:
- description: GDP-D-rhamnose-dependent a1,3-D-rhamnosyltransferase that extends the
    undecaprenyl-diphosphate-linked CPA primer (D-Rha a1-3 D-GlcNAc-PP-lipid made by WbpL and WbpZ),
    acting with WbpX to polymerize the D-rhamnan of the common polysaccharide antigen (A-band O
    antigen).
  supported_by:
  - reference_id: PMID:35166992
    supporting_text: NMR spectroscopic analysis of the WbpY reaction product showed that WbpY
      transferred one D-Rha residue in α1-3 linkage
  - reference_id: PMID:9680202
    supporting_text: these mutants are unable to synthesize A-band LPS, while B-band synthesis is
      unaffected
  molecular_function:
    id: GO:0016758
    label: hexosyltransferase activity
  directly_involved_in:
  - id: GO:0009243
    label: O antigen biosynthetic process
suggested_questions:
- question: Should GO add a D-rhamnosyltransferase activity term (GDP-D-rhamnose donor, distinct
    from the plant/bacterial L-rhamnosyltransferases that use UDP- or dTDP-L-rhamnose)?
- question: Does WbpY act at the cytoplasmic face of the inner membrane in a complex with WbpX, WbpZ
    and the Wzm/Wzt ABC transporter, as for other ABC-transporter-dependent O antigens?
suggested_experiments:
- description: Determine the in vivo order of WbpY and WbpX additions by analysing CPA chains from
    wbpY and wbpX point mutants (catalytic EX7E motif) complemented in trans, and test whether a
    WbpX-WbpY complex is required for full-length chain synthesis.
