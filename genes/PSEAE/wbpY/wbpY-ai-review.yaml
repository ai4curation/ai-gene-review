        linkage to form D-Rhaα1-3-D-Rhaα1-3-D-GlcNAcα-PP-PhU (Fig. 12).
    - reference_id: PMID:35166992
      reference_section_type: RESULTS
      supporting_text: His6-WbpX and His6-WbpY transferred one D-Rha residue (146 Da) to
        D-Rhaα1-3-D-GlcNAcα-PP-PhU, forming a product with m/z 918 after 1 or 24 h incubation time
