core_functions:
- description: >-
    GDP-D-rhamnose-dependent a1,3-D-rhamnosyltransferase that extends the
    undecaprenyl-diphosphate-linked CPA primer (D-Rha a1-3 D-GlcNAc-PP-lipid made by WbpL and
    WbpZ), acting with WbpX to polymerize the D-rhamnan of the common polysaccharide antigen
    (A-band O antigen). The two chain-extending enzymes are not interchangeable. The authors read
    WbpY as building an adapter or anchor structure on the WbpZ primer, and WbpX as the main
    polymerase; they separately attribute WbpY's confinement to the lipid carrier, and WbpX's
    freedom from it, to their acceptor specificities. The enzyme also transfers D-mannose at about
    70 per cent of its D-rhamnose activity in vitro, a genuine secondary activity rather than noise;
    CPA is reported to carry a small amount of D-mannose alongside other minor sugars, so the
    activity may well be used, but nothing ties this enzyme to those residues.
  supported_by:
  - reference_id: PMID:35166992
    reference_section_type: ABSTRACT
    supporting_text: NMR spectroscopic analysis of the WbpY reaction product showed that WbpY
      transferred one D-Rha residue in α1-3 linkage
  - reference_id: PMID:9680202
    reference_section_type: ABSTRACT
    supporting_text: these mutants are unable to synthesize A-band LPS, while B-band synthesis is
      unaffected
  - reference_id: PMID:35166992
    reference_section_type: RESULTS
    supporting_text: WbpY is therefore a dual D-RhaT and D-ManT, similar to WbpZ.
  - reference_id: PMID:35166992
    reference_section_type: DISCUSSION
    supporting_text: We conclude that WbpZ synthesizes the D-Rhaα1-3-D-GlcNAc-PP-Und primer which is
      a substrate for WbpY to synthesize an adapter or anchor structure upon which the D-Rha polymer
      is built.
  - reference_id: PMID:35166992
    reference_section_type: DISCUSSION
    supporting_text: This supports the idea that WbpX is the main polymerase enzyme.
  - reference_id: PMID:35166992
    reference_section_type: DISCUSSION
    supporting_text: In contrast, the narrow acceptor specificity of WbpY seems to dictate that it
      has to act near the PP-Und moiety.
  - reference_id: PMID:35166992
    reference_section_type: DISCUSSION
    supporting_text: CPA from various PA strains is essentially a D-rhamnan but has been shown to
      contain a small amount of D-Man as well as other monosaccharides including xylose and ribose
