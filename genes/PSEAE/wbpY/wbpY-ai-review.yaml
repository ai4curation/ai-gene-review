- term:
    id: GO:0016758
    label: hexosyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:35166992
  qualifier: enables
  review:
    summary: >-
      Proposed annotation. The D-rhamnosyltransferase activity of WbpY was shown directly by assay,
      and GOA carries no row for it; the three existing rows all stop at the family-level term.
    action: NEW
    reason: >-
      WbpY was expressed and assayed, and transfers one D-rhamnose residue in alpha1-3 linkage from
      GDP-D-rhamnose onto the product of WbpZ, cooperating with WbpX to polymerise the D-rhamnan
      by a mechanism reported as non-processive and hedged by the authors as possibly partially
      processive. The assays used a chemically synthesised phenylundecyl-diphosphate acceptor,
      an analogue of the natural undecaprenyl-diphosphate lipid intermediate, so the linkage
      chemistry is shown directly while the native lipid carrier is inferred. D-rhamnose is
      6-deoxy-D-mannose, a hexose, so the
      activity is hexosyl transfer and GO:0016758 is the correct term; GO has no
      D-rhamnosyltransferase term, so the refinement stops here rather than naming the sugar. For
      this gene that stop is apt rather than reluctant, because the enzyme transfers two hexoses:
      D-mannose as well as D-rhamnose, at about 70 per cent of the D-rhamnose rate, so a
      sugar-specific term would describe it only in part. The D-mannosyltransferase activity is not
      given a row of its own, since GOA carries none for this gene and its role in vivo is unknown;
      it is recorded in the core function and as a suggested question. The same term is a reluctant
      stop on wbpX, which transfers D-rhamnose alone. This is
      asserted as its own row rather than as a MODIFY of the IBA, IEA or IMP rows because none of
      those three carries evidence reaching past the family-level term, per the 2026-11-14 ruling.
      The same encoding is used on wbpX for this shared claim.
    supported_by:
    - reference_id: PMID:35166992
      reference_section_type: INTRODUCTION
      supporting_text: We demonstrated that these GTs are indeed D-RhaTs and catalyze the transfer of
        D-Rha from GDP-D-Rha to the reaction product of WbpZ.
    - reference_id: PMID:35166992
      reference_section_type: ABSTRACT
      supporting_text: "NMR spectroscopic analysis of the WbpY reaction product showed that WbpY
      transferred\
        \ one D-Rha residue in \u03B11-3 linkage"
