taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: WbpY (PA5448) is a 375-residue GT4-family (GT-B fold) D-rhamnosyltransferase of
  Pseudomonas aeruginosa PAO1 encoded in the common polysaccharide antigen (CPA, A-band) gene
  cluster. CPA is a D-rhamnan built from [D-Rha a1-2 D-Rha a1-3 D-Rha a1-3] trisaccharide repeats
  on an undecaprenyl-diphosphate-linked GlcNAc primer made by WbpL and capped with the first
  a1-3-linked D-Rha by WbpZ. WbpY transfers D-rhamnose from GDP-D-rhamnose in a1-3 linkage onto the
  WbpZ product, and together with WbpX (which adds a1-2- and a1-3-linked D-Rha) extends the
  D-rhamnan in a non-processive manner. wbpY mutants lack A-band LPS but still make B-band
  (O-specific antigen) LPS.
