suggested_questions:
- question: >-
    Should GO add a D-rhamnosyltransferase activity term (GDP-D-rhamnose donor, distinct from the
    plant and bacterial L-rhamnosyltransferases that use UDP- or dTDP-L-rhamnose)? Note that such a
    term would not on its own describe WbpY, which also transfers D-mannose at about 70 per cent of
    its D-rhamnose activity; it would fit WbpX, which transfers no other sugar.
- question: >-
    Is WbpY's D-mannosyltransferase activity the source of the D-mannose reported in CPA? The
    canonical repeat is pure D-rhamnan, but CPA from various strains carries a small amount of
    D-mannose along with other minor sugars, and WbpY transfers D-mannose at about 70 per cent of
    its D-rhamnose rate. The authors go some way to answering this themselves: they judge WbpY
    unlikely to build a D-mannose polymer, because its acceptor specificity is restricted, and they
    attribute CPA's purity to WbpX using GDP-D-rhamnose alone. That fits single D-mannose residues
    inserted by WbpY rather than stretches of them, but nothing yet shows that is what the minor
    sugar is. The alternative remains that the activity is an in vitro consequence of D-rhamnose
    being 6-deoxy-D-mannose, the donor site tolerating the extra hydroxyl.
- question: Does WbpY act at the cytoplasmic face of the inner membrane in a complex with WbpX, WbpZ
    and the Wzm/Wzt ABC transporter, as for other ABC-transporter-dependent O antigens?
suggested_experiments:
- description: Determine the in vivo order of WbpY and WbpX additions by analysing CPA chains from
    wbpY and wbpX point mutants (catalytic EX7E motif) complemented in trans, and test whether a
    WbpX-WbpY complex is required for full-length chain synthesis.
