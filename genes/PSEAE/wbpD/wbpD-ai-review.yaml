id: G3XD01
gene_symbol: wbpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: WbpD (PA3156) is a 191-residue cytoplasmic hexapeptide-repeat (left-handed
  beta-helix) N-acetyltransferase of the Pseudomonas aeruginosa PAO1 (serotype O5) B-band
  O-antigen gene cluster. It forms homotrimers and uses acetyl-CoA to acetylate the C3 amino group
  of UDP-2-acetamido-3-amino-2,3-dideoxy-D-glucuronic acid (UDP-GlcNAc3NA), producing
  UDP-2,3-diacetamido-2,3-dideoxy-D-glucuronic acid (EC 2.3.1.201). This is the fourth step of the
  WbpA-WbpB-WbpE-WbpD-WbpI pathway that converts UDP-GlcNAc into UDP-ManNAc3NAcA, the nucleotide
  sugar donor of the di-N-acetylated mannuronic acid residue of the B-band O-antigen repeat unit.
  wbpD knockouts lack long-chain B-band O antigen and semi-rough LPS, and the Bordetella pertussis
  homolog WlbB complements the mutant.
