- id: PMID:16102001
  title: Evidence that WbpD is an N-acetyltransferase belonging to the hexapeptide
    acyltransferase superfamily and an important protein for O-antigen biosynthesis
    in Pseudomonas aeruginosa PAO1.
  full_text_unavailable: true
  findings:
  - statement: wbpD knockout lacks long-chain B-band O antigen and semi-rough LPS; WbpD is a
      trimeric LbetaH protein that binds acetyl-CoA; no substrate was available for activity assays.
    supporting_text: A chromosomal knockout mutant of wbpD is incapable of producing either
      long-chain B-band O antigen
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: PubMed-verified, correct paper for wbpD knockout phenotype, trimerization and
      acetyl-CoA binding (supports O antigen biosynthesis and trimerization rows). As support for
      the PseudoCAP EXP UDP-glucuronate biosynthetic process row it is miscited, since the paper
      had no substrate and UDP-glucuronate is not in the pathway. Abstract only.
- id: PMID:19282284
  title: Characterization of WbpB, WbpE, and WbpD and reconstitution of a pathway
    for the biosynthesis of UDP-2,3-diacetamido-2,3-dideoxy-D-mannuronic acid in Pseudomonas
    aeruginosa.
  full_text_unavailable: true
  findings:
