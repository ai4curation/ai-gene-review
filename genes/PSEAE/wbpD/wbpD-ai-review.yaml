  qualifier: involved_in
  review:
    summary: PseudoCAP EXP UDP-glucuronate biosynthetic process; sole seed of the PAINT IBD at
      PTN001292385.
    action: MODIFY
    reason: 'The process is wrong as stated. GO:0006065 is the formation of UDP-glucuronate
      (UDP-GlcA). WbpD acetylates UDP-GlcNAc3NA to UDP-GlcNAc3NAcA in the synthesis of
      UDP-ManNAc3NAcA from UDP-GlcNAc; UDP-glucuronate is neither a substrate nor a product of the
      Wbp pathway (even the first step, WbpA, oxidises UDP-GlcNAc, not UDP-Glc). The products are
      glucuronic-acid derivatives, which probably explains the choice. In addition, PMID:16102001
      states that no substrate was available, so it could not demonstrate any nucleotide-sugar
      biosynthesis directly; the knockout phenotype it reports is loss of B-band O antigen. The
      sound essence is nucleotide-sugar biosynthesis (shown by PMID:19282284 and PMID:19348502), so
      the row is modified to the parent GO:0009226 nucleotide-sugar biosynthetic process; no GO
      term exists for UDP-ManNAc3NAcA biosynthesis.'
    proposed_replacement_terms:
    - id: GO:0009226
      label: nucleotide-sugar biosynthetic process
    supported_by:
    - reference_id: PMID:16102001
      supporting_text: As a substrate for studying the enzymatic activity of WbpD is unavailable at
        present
    - reference_id: PMID:19348502
