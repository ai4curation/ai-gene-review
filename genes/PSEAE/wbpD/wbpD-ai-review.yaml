suggested_questions:
- question: Does PTN001917401 (acetyltransferase activity) include LpxA-type acyl-ACP
    O-acyltransferases (the PTHR43300:SF4 subfamily name), in which case acyltransferase activity
    would be the safer node term?
- question: Should GO add a specific MF term for EC 2.3.1.201 (UDP-2-acetamido-3-amino-2,3-dideoxy-glucuronate
    N-acetyltransferase activity, RHEA:33587) and a BP term for UDP-ManNAc3NAcA biosynthesis?
suggested_experiments:
- description: Solve the WbpD-acetyl-CoA-UDP-GlcNAc3NA ternary structure to define the active site
    (Lys136 and the His of the inter-subunit cleft) and the basis of nucleotide-sugar specificity
    compared with PglD-type C4 acetyltransferases.
