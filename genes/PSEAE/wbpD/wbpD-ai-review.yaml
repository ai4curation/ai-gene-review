  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (PMC2673254, full text not retrievable via MCP). Direct biochemical
      support for the PseudoCAP EXP acetyltransferase activity seed.
- id: PMID:19348502
  title: 'Biosynthesis of UDP-GlcNAc(3NAc)A by WbpB, WbpE, and WbpD: enzymes in the
    Wbp pathway responsible for O-antigen assembly in Pseudomonas aeruginosa PAO1.'
  findings:
  - statement: WbpD acetylates UDP-GlcNAc3NA (Km 107 uM, kcat 2.9 x 10^3 min-1); the five Wbp
      enzymes reconstitute UDP-ManNAc3NAcA from UDP-GlcNAc in vitro.
    supporting_text: we confirm that WbpD catalyzes the acetylation of UDP-GlcNAc(3NH(2))A to give
      UDP-GlcNAc(3NAc)A
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; kinetics and pathway order.
- id: PMID:18621892
  title: Biosynthesis of a rare di-N-acetylated sugar in the lipopolysaccharides of both Pseudomonas
    aeruginosa and Bordetella pertussis occurs via an identical scheme despite different gene clusters.
  findings:
  - statement: B. pertussis homologs, including the WbpD homolog, complement the corresponding P.
      aeruginosa knockouts.
    supporting_text: the genes that encode the putative oxidase, transaminase, N-acetyltransferase,
      and epimerase enzymes in B. pertussis are functional homologs of those in P. aeruginosa
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports conservation of the pathway in the WbpD/WlbB clade.
