gene_symbol: PA0847
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0847 is an inner-membrane diguanylate cyclase with a periplasmic CHASE sensory domain
  between two transmembrane helices, followed by cytoplasmic HAMP, PAS and GGDEF domains. The
  purified PAS-GGDEF fragment synthesises cyclic di-GMP from GTP in a Mg2+-dependent reaction;
  the PAS domain is needed for dimerisation and high activity, and the enzyme shows little
  product inhibition. Deletion of PA0847 lowers cellular c-di-GMP and Psl production and
  increases swimming and swarming motility, and its overexpression promotes pellicle and biofilm
  formation. Its sensory input is unknown; mutant phenotypes respond to several amino acids and
  other nutrients.
