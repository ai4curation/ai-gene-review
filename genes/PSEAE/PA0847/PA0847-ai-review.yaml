  review:
    summary: >-
      InterPro2GO from the PAS fold (IPR013767).
    action: REMOVE
    reason: >-
      PA0847 has no DNA-binding domain. Its PAS domain is part of the diguanylate cyclase and
      is needed for c-di-GMP synthesis, not transcription. The PAS-fold mapping to
      transcription regulation is an over-broad electronic inference for this protein.
    supported_by:
