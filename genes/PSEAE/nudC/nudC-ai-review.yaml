- id: PMID:24989777
  title: >-
    NudC Nudix hydrolase from Pseudomonas syringae, but not its counterpart from Pseudomonas
    aeruginosa, is a novel regulator of intracellular redox balance required for growth, motility
    and biofilm formation.
  findings:
  - statement: >-
      The P. aeruginosa protein was purified and assayed, so the paper contains direct in vitro
      evidence on the annotated gene product and not only on its P. syringae orthologue.
    reference_section_type: ABSTRACT
    supporting_text: >-
      We have investigated NudC Nudix proteins from the plant pathogen Pseudomonas syringae pv.
      tomato str. DC3000 and from the human pathogen Pseudomonas aeruginosa PAO1161. We found that
      these homologous enzymes are homodimeric and in vitro preferentially hydrolyse NADH.
  - statement: >-
      The P. aeruginosa mutant has no phenotype, which is the paper's central result and is
      incompatible with an evidence code inferred from a mutant phenotype.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Opposite to P. syringae NudC, the P. aeruginosa NudC deficiency as well as its overproduction
      had no visible impact on cells.
  - statement: >-
      In P. syringae the enzyme's substrate accumulates when it is missing, which links the
      in vitro NADH preference to the phenotype and is why the paper's title frames the protein as
      a regulator of intracellular redox balance.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The P. syringae mutant strain deficient in NudC accumulated NADH and displayed significant
      defects in growth, motility and biofilm formation.
  - statement: >-
      The authors state the species contrast as their conclusion, so the absence of a
      P. aeruginosa phenotype is a finding rather than a gap in the experiments.
    reference_section_type: ABSTRACT
    supporting_text: >-
      These results indicate that NudC from P. syringae, but not from P. aeruginosa is vital for
      bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Modzelan, Kujawa, Głąbski, Jagura-Burdzy & Kraszewska 2014, Mol Microbiol).
      The title names P. syringae first and could be mistaken for a paper about another organism,
      but the abstract makes clear that both orthologues were purified and assayed, and the
      P. aeruginosa strain used, PAO1161, is a PAO1 derivative. Abstract-only in the cache; the
      abstract carries the enzymology, the strain, the subunit state and the negative phenotype,
      so nothing here depends on unread text. Marked VERIFIED: the citation is right and it is the
      evidence code attached to it that is wrong, which is filed separately.
