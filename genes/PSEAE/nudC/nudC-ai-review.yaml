  review:
    summary: >-
      One row with two problems, both fixable from one sentence of its own reference: the term is
      the root of the hydrolase branch, and the evidence code names an experiment whose result the
      paper reports as negative.
    action: MODIFY
    reason: >-
      The row's own reference supplies the deeper term directly. It reports that the purified
      P. aeruginosa and P. syringae enzymes "in vitro preferentially hydrolyse NADH", which is
      GO:0035529 NADH diphosphatase activity — a term this gene already carries by IBA and by Rhea
      mapping, so the refinement is to a claim the review accepts rather than a new one. Under the
      2026-11-14 ruling the test is this row's own evidence, and in vitro hydrolysis of a named
      substrate clears it. Separately, the evidence code is wrong in a way the same paper settles:
      an IMP is inferred from a mutant phenotype, and this paper's finding is that there is none
      for this organism's enzyme. That is filed as a source defect rather than used to weaken the
      term, because the underlying activity is directly measured.
    proposed_replacement_terms:
    - id: GO:0035529
      label: NADH diphosphatase activity
    supported_by:
    - reference_id: PMID:24989777
      reference_section_type: ABSTRACT
      supporting_text: >-
        We have investigated NudC Nudix proteins from the plant pathogen Pseudomonas syringae pv.
        tomato str. DC3000 and from the human pathogen Pseudomonas aeruginosa PAO1161. We found
        that these homologous enzymes are homodimeric and in vitro preferentially hydrolyse NADH.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: REPOINT
      asserted_value: IMP
      corrected_value: IDA
      confidence: CONFIRMED
      explanation: >-
        PseudoCAP annotates GO:0016787 to PA1823 (UniProtKB:O86062) with evidence code IMP from
        PMID:24989777. An IMP is inferred from the phenotype of a mutant in the annotated gene,
        and that paper reports the P. aeruginosa mutant has no phenotype: "Opposite to P. syringae
        NudC, the P. aeruginosa NudC deficiency as well as its overproduction had no visible
        impact on cells", which the authors give as their conclusion — "NudC from P. syringae, but
        not from P. aeruginosa is vital for bacteria". The code therefore rests on an experiment
        whose result was negative. The same paper does contain direct evidence on this protein: it
        was purified and shown to "in vitro preferentially hydrolyse NADH", which is IDA. Requested
