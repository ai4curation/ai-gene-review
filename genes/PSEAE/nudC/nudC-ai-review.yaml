id: O86062
gene_symbol: nudC
product_type: PROTEIN
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
status: COMPLETE
description: >-
  NudC (PA1823) is the NAD-capped RNA hydrolase of Pseudomonas aeruginosa, a homodimeric Nudix
  family enzyme. Its named reaction is deNADding: it removes the nicotinamide adenine dinucleotide
  cap from the 5' end of a subset of mRNAs, hydrolysing the diphosphate linkage to leave
  nicotinamide mononucleotide and a 5'-monophosphate RNA, and so exposing transcripts that the NAD
  cap had protected from 5' processing. The same active site hydrolyses free dinucleotide
  pyrophosphates, NAD+ and NADH among them, and the purified P. aeruginosa protein prefers NADH.
  Catalysis needs a divalent cation, magnesium or manganese, and each subunit also holds one
  structural zinc. Unlike its Pseudomonas syringae counterpart, which is required for normal
  growth, motility and biofilm formation, this enzyme can be deleted or overproduced without
  visible consequence, so what it is for in this organism is unsettled.
