core_functions:
- description: >-
    DeNADding enzyme: removes the NAD cap from the 5' end of a subset of mRNAs, hydrolysing the
    diphosphate linkage to leave nicotinamide mononucleotide and a 5'-monophosphate transcript, and
    so making NAD-capped RNA accessible to 5' processing. The same active site hydrolyses free
    dinucleotide pyrophosphates; the only activity measured on the P. aeruginosa protein itself is
    a preference for NADH.
  molecular_function:
    id: GO:0110153
    label: RNA NAD-cap (NMN-forming) hydrolase activity
  contributes_to_molecular_function:
    id: GO:0000287
    label: magnesium ion binding
  directly_involved_in:
  - id: GO:0019677
    label: NAD+ catabolic process
  supported_by:
  - reference_id: file:PSEAE/nudC/nudC-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      mRNA decapping enzyme that specifically removes the
      nicotinamide adenine dinucleotide (NAD) cap from a subset of mRNAs by
      hydrolyzing the diphosphate linkage to produce nicotinamide
      mononucleotide (NMN) and 5' monophosphate mRNA.
  - reference_id: PMID:24989777
    reference_section_type: ABSTRACT
    supporting_text: >-
      We found that these homologous enzymes are homodimeric and in vitro preferentially hydrolyse
      NADH.
  knowledge_gaps:
  - gap_statement: >-
      What this enzyme is for in P. aeruginosa is unknown. Deleting it and overproducing it both
      leave the cell unchanged, while the P. syringae orthologue is required for normal growth,
      motility and biofilm formation and cannot be replaced by the P. aeruginosa protein. Two
      closely related Nudix enzymes therefore differ in essentiality for reasons nobody has
      identified. The P. syringae mutant accumulates NADH, which the authors read as a loss of
      redox balance; whether the P. aeruginosa deletion also accumulates NADH without consequence,
      or does not accumulate it at all, has not been reported, and the two possibilities point at
      different explanations.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Whether the P. aeruginosa enzyme performs the deNADding reaction at all has not been tested.
      The activity is assigned from a curated family rule; the only reaction measured on this
      protein is hydrolysis of free NADH, and no NAD-capped RNA substrate has been offered to it.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Why is the P. syringae enzyme essential and this one dispensable, when the two are homologous,
    both homodimeric and both prefer NADH in vitro? The paper shows the P. aeruginosa protein
    cannot substitute in a P. syringae mutant, so the difference is not simply expression level.
- question: >-
    Does P. aeruginosa have NAD-capped mRNA, and does NudC act on it? The deNADding function is
    taken from the family rule, and the question is whether the substrate exists in this organism
    in appreciable amounts.
- question: >-
    Is there a second deNADding or NADH-hydrolysing enzyme that makes this one redundant? That
    would explain a null mutant with no phenotype without requiring the enzyme to be inactive.
suggested_experiments:
- description: >-
    Offer a synthetic NAD-capped RNA to the purified P. aeruginosa enzyme and measure NMN release,
    which would convert the core molecular function from a rule-based assignment into a measurement
    on this protein.
- description: >-
    Quantify NAD-capped RNA in wild type and in the nudC deletion by NAD captureSeq, to test
    whether the absence of a growth phenotype hides a molecular one.
- description: >-
    Swap the two orthologues domain by domain and test complementation in the P. syringae mutant,
    to locate the difference that makes one essential and the other not.
