- term:
    id: GO:0006742
    label: NADP+ catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000511346
  - UniProtKB:Q9BQG2
  review:
    summary: >-
      Propagation of a second substrate's catabolism from the same node, with human NUDT12 as the
      donor.
    action: KEEP_AS_NON_CORE
    reason: >-
      Plausible and kept, but peripheral. The curated rule describes the enzyme as hydrolysing "a
      broad range of dinucleotide pyrophosphates", so activity on NADP+ is the kind of substrate
      tolerance a Nudix active site is expected to have; what is missing is any sign that the
