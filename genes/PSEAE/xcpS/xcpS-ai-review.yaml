    summary: PAINT IBA from PTN000768597, whose IBD for this term rests solely on the PseudoCAP
      IDA row for XcpS citing the review PMID:9818381.
    action: ACCEPT
    reason: The biological claim holds for XcpS and for T2SS GspF proteins generally. The seed's
      evidence code is wrong (IDA on a review), but primary evidence that XcpS is a functional
      Xcp component exists (species-specific function of XcpS hybrids, PMID:17464073; functional
      tagged XcpS, PMID:18832308), so the IBD remains sound. Of about 911 leaves in current
      QuickGO, a handful are named PilC/HofC/MshG (type IV pilus or MSHA platforms of the same
      family), a minor over-propagation that does not affect XcpS. XcpS in its own WITH/FROM
      reflects its seed and is expected.
