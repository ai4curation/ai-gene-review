- id: PMID:17464073
  title: Interaction domains in the Pseudomonas aeruginosa type II secretory apparatus component
    XcpS (GspF).
  findings:
  - statement: XcpS is an inner-membrane core Xcp component stabilised by XcpR and XcpY through its
      cytoplasmic loop; P. putida swap hybrids define species-specific functional domains.
    supporting_text: The cytoplasmic loop of XcpS was found to be involved in the stabilization by
      XcpR and XcpY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary study (abstract only; no PMC record). Topology and interactions are also
      curated by UniProt from this paper.
