taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: XcpS (PA3102) is the GspF-family inner-membrane platform protein of the Xcp type II
  secretion system of Pseudomonas aeruginosa, the machine that exports elastase, lipases and other
  exoproteins from the periplasm across the outer membrane. It is a polytopic cytoplasmic-membrane
  protein with three transmembrane segments and a large cytoplasmic N-terminal domain. XcpS forms
  the inner-membrane assembly platform with XcpY (GspL) and XcpZ (GspM) and binds the secretion
  ATPase XcpR (GspE), which stabilises it, coupling ATP hydrolysis to pseudopilus assembly. It is
  related to the PilC platform protein of type IV pili and localises the Xcp machinery to the cell
  poles.
