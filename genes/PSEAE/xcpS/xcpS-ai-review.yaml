      components.
    supporting_text: labelled XcpS was still found to locate at the poles, whereas XcpR was evenly
      distributed in the cell
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary study (abstract only cached).
