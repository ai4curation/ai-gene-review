  findings:
  - statement: >-
      trpBA gene order with a 4-bp cistron overlap; conserved catalytic residues.
    supporting_text: The gene order is trpBA as predicted from earlier genetic studies, and the two cistrons
      overlap by 4 bp
  - statement: >-
      A plasmid-borne P. aeruginosa alpha subunit forms a functional tryptophan synthase with E. coli
      beta2 in vivo.
    supporting_text: We also report the construction of a recombinant plasmid that overproduces a slightly
      modified alpha subunit from P. aeruginosa that can form a functionally effective multimer with normal
      E. coli beta 2 subunit in vivo
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA and NAS GO:0000162 rows (the IDA row seeds PTN000034360). Abstract only
      in cache; the abstract states the sequence analysis and the in vivo complementation of E. coli beta2
      by the P. aeruginosa alpha subunit, which supports participation in tryptophan biosynthesis.
