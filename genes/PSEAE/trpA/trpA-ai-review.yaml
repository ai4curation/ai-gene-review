id: P07344
gene_symbol: trpA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  TrpA (PA0035) is the alpha subunit of tryptophan synthase (EC 4.2.1.20) of Pseudomonas aeruginosa. It
  catalyses the aldol cleavage of indole-3-glycerol phosphate to indole and glyceraldehyde 3-phosphate;
  the indole is passed to the beta subunit TrpB, which condenses it with L-serine to give L-tryptophan,
  the last step of tryptophan biosynthesis. The enzyme is a cytoplasmic alpha2beta2 tetramer. trpA lies
  downstream of trpB in a trpBA operon in which the two cistrons overlap by 4 bp, and a plasmid-borne
  P. aeruginosa alpha subunit forms a functional enzyme with the E. coli beta2 subunit in vivo.
