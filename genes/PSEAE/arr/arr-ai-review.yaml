knowledge_gaps:
- gap_statement: >-
    How Arr senses aminoglycosides, and why loss of a c-di-GMP phosphodiesterase blocks tobramycin-induced
    biofilm formation rather than enhancing it, are unknown. No purified-enzyme activity has
    been reported, and an overexpression lysate assay detected none.
  gap_kind:
  - BIOLOGY
suggested_experiments:
- description: >-
    Purify the Arr EAL domain (and full-length Arr in detergent) and measure c-di-GMP hydrolysis
    with and without tobramycin; compare wild type with the catalytic-residue mutant used
    by Hoffman et al.
