id: Q9I025
gene_symbol: arr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Arr (aminoglycoside response regulator, PA2818) is a 525-aa inner-membrane EAL-domain c-di-GMP
  phosphodiesterase of Pseudomonas aeruginosa PAO1, encoded on a genomic island that most
  strains, including PA14, lack. Two predicted transmembrane helices flank a CSS-motif domain,
  which is probably periplasmic, and the C-terminal cytoplasmic EAL domain has intact catalytic
  motifs. Membranes from arr mutants have less c-di-GMP phosphodiesterase activity, although
  lysates of a PA14 strain overexpressing arr showed no detectable activity. Arr is required
  for the biofilm formation induced by subinhibitory aminoglycosides such as tobramycin, and
  for biofilm-specific aminoglycoside resistance; a mutant in a predicted catalytic residue
  is defective in this response. Its deletion also disrupts mushroom structures in flow-cell
  biofilms. How aminoglycosides are sensed, and why loss of a phosphodiesterase prevents biofilm
  induction, are unknown.
references:
- id: PMID:16121184
  title: Aminoglycoside antibiotics induce bacterial biofilm formation.
  findings:
  - statement: >-
      arr is essential for aminoglycoside-induced biofilm formation and contributes to biofilm-specific
      aminoglycoside resistance.
    supporting_text: >-
      was essential for this induction and contributed to biofilm-specific aminoglycoside
      resistance
  - statement: Membranes from arr mutants have less c-di-GMP phosphodiesterase activity.
    supporting_text: membranes from arr mutants had diminished c-di-GMP phosphodiesterase
      activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the GO:0004114 IDA, GO:1900190 IDA and GO:0046677 IMP rows. Abstract
      only (Nature, not in PMC). The abstract describes genetic evidence (mutant and catalytic-residue
      mutant) and a membrane PDE assay of mutant membranes. The substrate named is c-di-GMP,
      so the GO:0004114 term is mis-chosen (source defect on that row). The full text was
      not read.
- id: PMID:16477007
  title: >-
    Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases reveals
    a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: >-
      Lysates of a PA14 strain overexpressing PA2818 showed no detectable c-di-GMP hydrolysis
      (Table 1, read in PMC full text); PA2818 is absent from most strains.
    supporting_text: >-
      Although the majority of these genes are components of the P. aeruginosa core genome,
      several are located on presumptive horizontally acquired genomic islands.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not a GOA source for arr. Full text read on PMC (PMC1413825); verbatim excerpts in arr-notes.md.
      Negative lysate result, which the authors caution may reflect assay sensitivity.
- id: PMID:35935233
  title: >-
    Phenotypic and integrated analysis of a comprehensive Pseudomonas aeruginosa PAO1 library
    of mutants lacking cyclic-di-GMP-related genes.
  findings:
  - statement: Deletion of PA2818 disrupts mushroom-like structures in flow-cell biofilms.
    supporting_text: >-
      deletion of PA2133 (fcsR; Rossello et al., 2017), PA2200 and PA2818 resulted in the
      disruption of mushroom-like biofilm structures
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Library-scale screen.
