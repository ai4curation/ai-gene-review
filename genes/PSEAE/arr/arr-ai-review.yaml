existing_annotations:
- term:
    id: GO:0004114
    label: 3',5'-cyclic-nucleotide phosphodiesterase activity
  evidence_type: IDA
  original_reference_id: PMID:16121184
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA citing Hoffman 2005, whose abstract reports reduced c-di-GMP phosphodiesterase
      activity in membranes of arr mutants. GO:0004114 is the PDE activity on 3',5'-cyclic
      nucleoside monophosphates (cAMP, cGMP) and is not an ancestor of GO:0071111, the c-di-GMP-specific
      activity.
    action: MODIFY
    reason: >-
      The activity reported is c-di-GMP hydrolysis, so the correct term is GO:0071111, which
      the gene already carries by IBA and IEA. This is a lateral correction, not a refinement.
      Arr is not a seed of the GO:0071111 node, so no IBD depends on this row.
    proposed_replacement_terms:
    - id: GO:0071111
      label: cyclic-guanylate-specific phosphodiesterase activity
    supported_by:
    - reference_id: PMID:16121184
      supporting_text: membranes from arr mutants had diminished c-di-GMP phosphodiesterase
        activity
    - reference_id: PMID:16121184
      supporting_text: >-
        The arr gene is predicted to encode an inner-membrane phosphodiesterase whose substrate
        is cyclic di-guanosine monophosphate (c-di-GMP)
    - reference_id: file:PSEAE/arr/arr-notes.md
      supporting_text: |-
        GO:0004114 is defined on
        3',5'-cyclic nucleoside monophosphates and is not an ancestor of GO:0071111
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      requested_change: REPOINT
      asserted_value: GO:0004114
      corrected_value: GO:0071111
      corrected_label: cyclic-guanylate-specific phosphodiesterase activity
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The cited abstract (PMID:16121184) names c-di-GMP as the substrate whose hydrolysis
        is reduced in arr mutant membranes. GO:0004114 3',5'-cyclic-nucleotide phosphodiesterase
        activity covers cyclic nucleoside monophosphates and does not subsume GO:0071111 (GO:0071111
        is_a GO:0008081). Please repoint the row to GO:0071111.
      supported_by:
      - reference_id: PMID:16121184
        supporting_text: membranes from arr mutants had diminished c-di-GMP phosphodiesterase
          activity
