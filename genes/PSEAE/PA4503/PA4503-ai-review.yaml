  review:
    summary: >-
      PseudoCAP row from Pletzer et al. 2014. The claim is correct, but the
      evidence is an operon-deletion phenotype, so the code should be IMP.
    action: ACCEPT
    reason: >-
      The paper deleted the whole dppBCDF operon in PA14 and found loss of
      dipeptide utilisation as nitrogen source (Biolog respiration and growth)
      and resistance to the tripeptide toxin phaseolotoxin. No uptake,
      binding or ATPase assay was done, and DppB was not mutated alone. This
      is a mutant phenotype, not a direct assay. It still supports the MF for
      DppB: the permeases form the translocation pathway of an ABC importer,
      and phaseolotoxin resistance shows a loss of uptake specifically. The
      claim is accepted and the evidence code is flagged upstream.
    supported_by:
    - reference_id: PMID:25338022
      supporting_text: >-
        In order to investigate the substrate profile of the ABC transporter
        DppBCDF, a deletion mutant of the dppBCDF operon was constructed
    - reference_id: PMID:25338022
      supporting_text: >-
        Our results demonstrate that PA14 is sensitive to phaseolotoxin and
        that it is specifically taken up by the dipeptide ABC transporter
        DppBCDF.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      corrected_value: ECO:0000315
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        GO:0071916 for PA4503 (DppB, Q9HVR8) is annotated IDA to
        PMID:25338022. The paper's evidence is a deletion of the whole
        dppBCDF operon in strain PA14, scored by Biolog respiration on
        dipeptides and by phaseolotoxin sensitivity. No direct transport,
        binding or ATPase assay was done with the protein, so IMP is the
        correct code. The claim itself is sound. This row is the sole seed of
        the PAINT IBD at PTN000765601 and one of four seeds at PTN002455499.
        The same applies to the matching PA4504 (DppC) row.
      supported_by:
      - reference_id: PMID:25338022
        supporting_text: >-
          Numerous dipeptides could not be used as N-source by the mutant
          lacking the DppBCDF transporter system
