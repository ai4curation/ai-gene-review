- id: PMID:25338022
  title: High-throughput screening of dipeptide utilization mediated by the ABC transporter
    DppBCDF and its substrate-binding proteins DppA1-A5 in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PA14_58440 (PAO1 PA4503) is named DppB, one of the two permeases of the
      dppBCDF operon.
    supporting_text: >-
      Since the protein sequence of PA14_58440 shows a high degree of homology
      to other dipeptide ABC transporters, we suggest renaming this protein as
      DppB and refer to the operon as the dppBCDF operon.
  - statement: >-
      Deletion of the whole dppBCDF operon abolishes use of most dipeptides as
      nitrogen source.
    supporting_text: >-
      Numerous dipeptides could not be used as N-source by the mutant lacking
      the DppBCDF transporter system
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified (Pletzer et al. 2014, PLoS One, PMC4206461); full
      text read. Work in strain PA14 with an operon deletion, Biolog
      phenotype microarrays and phaseolotoxin sensitivity. No direct
      transport assays and no single-gene dppB mutant, so the PseudoCAP IDA
      should be IMP. The PA14_58440 to PA4503 mapping follows operon order.
