  review:
    summary: >-
      IBA from PTN000765601, whose IBD rests solely on PA4503's own PseudoCAP
      row. True for PA4503, but the node term is over-specific for the clade.
    action: ACCEPT
    reason: >-
      PA4503 in its own WITH/FROM marks its experimental seed and is expected.
      For PA4503 the claim is correct: it is DppB of the DppBCDF dipeptide
      importer. Strictly, transport is an activity of the assembled
      DppA-BCDF complex, so contributes_to would be the more precise
      qualifier; comparators (E. coli DppB and DppC) use enables, and I keep
      the convention here and use contributes_to in core_functions. The
      problem lies at the node, not on this leaf: PTN000765601 also contains
      E. coli NikB (nickel import) and SapB (putrescine export) and nine
      Bradyrhizobium paralogs. In the OppBC family the binding protein sets
      the substrate, so a dipeptide term placed on the whole clade is
      over-specific (see notes and source_defects).
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q9HVR8
        source_label: PA4503 (self; sole IBD seed, PseudoCAP IDA PMID:25338022)
