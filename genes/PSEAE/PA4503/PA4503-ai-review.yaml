  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4503 is DppB, one of the two integral inner-membrane permease subunits of
  the DppBCDF dipeptide ABC importer of Pseudomonas aeruginosa. It belongs to
  the OppBC subfamily of binding protein-dependent transport permeases and has
  six predicted transmembrane helices. With the second permease DppC (PA4504),
  the ATPase subunits DppD and DppF, and one of five periplasmic
  substrate-binding proteins (DppA1-DppA5), it forms the importer that lets the
  cell use a broad range of dipeptides and some tripeptides as nitrogen
  sources. The same system takes up the tripeptide toxin phaseolotoxin.
