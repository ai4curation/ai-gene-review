      resource: GO_CENTRAL
      record: PANTHER:PTN000765601
      requested_change: CHECK
      asserted_value: GO:0071916
      confidence: PROBABLE
      explanation: >-
        The IBD of GO:0071916 dipeptide transmembrane transporter activity at
        PTN000765601 has one seed, the PseudoCAP row for PA4503 (DppB). The
        node's 25 leaves include E. coli NikB, whose experimental annotation
