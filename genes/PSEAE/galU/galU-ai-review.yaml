id: Q9I291
gene_symbol: galU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  GalU (PA2023) is the cytosolic UTP--glucose-1-phosphate uridylyltransferase
  (UDP-glucose pyrophosphorylase, EC 2.7.7.9) of Pseudomonas aeruginosa, a
  279-residue member of the bacterial UDPGP type 2 family with a nucleotidyl
  transferase fold. It condenses UTP with alpha-D-glucose 1-phosphate to make
  UDP-alpha-D-glucose, the glucosyl donor for the outer core of
  lipopolysaccharide and a precursor of other nucleotide sugars. galU mutants of
  several serogroups make a truncated LPS core.
