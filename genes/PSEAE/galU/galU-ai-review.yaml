- term:
    id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000501197
  - UniProtKB:P0AEP3
  - UniProtKB:Q9I291
  review:
    summary: >-
      Right for P. aeruginosa GalU, which supplies the glucosyl donor for the
      LPS core, but the PTN000501197 node that propagates it also covers
      Gram-positive and LPS-less bacteria.
    action: KEEP_AS_NON_CORE
    reason: >-
      On this leaf the term is supported by the PseudoCAP IMP (truncated core
      in galU mutants of four serogroups), and Q9I291 in its own WITH/FROM
      marks that seed, which is expected. GalU supplies UDP-glucose for the
      core glucosyltransferases rather than assembling the core itself, so the
      process is kept as non-core, consistent with the IMP row. The node term
      is a separate matter. PTN000501197 has 33 leaves, including Bacillus
      subtilis GtaB and YngB, Staphylococcus GtaB, Listeria lmo1078,
      Streptococcus, Clostridium, Mycoplasma, Streptomyces and Mycobacterium
      GalU orthologues, none of which make lipopolysaccharide. Both seeds
      (E. coli and P. aeruginosa GalU) are Gram-negative, and the E. coli seed
      is coded acts_upstream_of_or_within. The LPS process is a lineage-specific
      use of UDP-glucose, not a property of the clade (see the GO_CENTRAL
      defect).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q9I291
        source_label: galU (self; PseudoCAP IMP PMID:12044687)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Sound for P. aeruginosa; galU mutants make a truncated LPS core.
      - source_id: UniProtKB:P0AEP3
        source_label: E. coli GalU
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          EcoCyc IMP coded acts_upstream_of_or_within (PMID:10398745); right
          for E. coli but says nothing about Gram-positive members.
      - source_id: PANTHER:PTN000501197
        source_label: PTN000501197
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          GalU/GtaB clade spanning Proteobacteria, Firmicutes, Mollicutes and
          Actinobacteria; LPS core synthesis exists only in the Gram-negative
          part.
    supported_by:
    - reference_id: PMID:12044687
      supporting_text: >-
        Construction of galU mutants in P. aeruginosa serogroups O11, O5, O6
        and O17 strains led to truncation of the LPS core, indicating the
        involvement of GalU in P. aeruginosa LPS core synthesis.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000501197
      requested_change: CHECK
      asserted_value: GO:0009244
      confidence: CONFIRMED
      explanation: >-
        PTN000501197 carries an IBD of GO:0009244 lipopolysaccharide core
        region biosynthetic process seeded by E. coli GalU (P0AEP3, EcoCyc IMP
        acts_upstream_of_or_within) and P. aeruginosa GalU (Q9I291, PseudoCAP
        IMP PMID:12044687). Both seeds are sound for their own organisms, but
        the node's 33 leaf IBAs (cached PAINT leaf GAF, checked 2026-11-05)
        include Gram-positive and wall-less bacteria that have no
        lipopolysaccharide, among them B. subtilis GtaB (Q05852) and YngB
        (O31822), S. aureus GtaB (Q2G1T6), Listeria lmo1078, Streptococcus
        Q8DN58, Clostridium GtaB, Mycoplasma P47691, Streptomyces GtaB and
        M. tuberculosis GalU (O05576). Please move the IBD to a Gram-negative
        subclade, or drop it and rely on the UDP-glucose activity IBD, which
        suits the whole clade.
      supported_by:
      - reference_id: PMID:12044687
        supporting_text: >-
          indicating the involvement of GalU in P. aeruginosa LPS core
          synthesis
- term:
    id: GO:0009244
    label: lipopolysaccharide core region biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:12044687
  qualifier: involved_in
  review:
    summary: >-
      Dean and Goldberg 2002 - galU complemented a truncated-core PA103 mutant,
      and galU knockouts in four serogroups truncated the LPS core.
    action: KEEP_AS_NON_CORE
    reason: >-
      Sound genetic evidence, with complementation, that GalU is needed for a
      complete LPS core; the biochemical basis is clear (GalU makes the
      UDP-glucose donor used by the core glucosyltransferases). GalU performs
      the precursor step rather than core assembly, and its product also feeds
      other pathways, so the process is kept as non-core and the core function
      is the UDP-glucose pyrophosphorylase activity. Abstract only.
    supported_by:
    - reference_id: PMID:12044687
      supporting_text: >-
        When the wild-type galU gene was introduced into strain PA103 wbpM-C
        containing the cloned wbpM gene, both LPS defects were corrected.
    - reference_id: PMID:12044687
      supporting_text: >-
        Construction of galU mutants in P. aeruginosa serogroups O11, O5, O6
        and O17 strains led to truncation of the LPS core, indicating the
        involvement of GalU in P. aeruginosa LPS core synthesis.
