suggested_questions:
- question: >-
    Does PA0317 oxidise other D-2-hydroxy acids, or is it specific for D-2-HG as its coupling
    to SerA in L-serine synthesis implies?
suggested_experiments:
- description: >-
    Steady-state kinetics of purified PA0317 with D-2-HG and candidate alternative substrates,
    with ETF as electron acceptor, to confirm substrate specificity and the physiological
    electron route.
