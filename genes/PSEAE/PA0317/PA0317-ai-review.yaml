  label: Pseudomonas aeruginosa PAO1
description: >-
  PA0317 encodes the bacterial D-2-hydroxyglutarate dehydrogenase (D2HGDH) of Pseudomonas
  aeruginosa PAO1, a 464-residue FAD-dependent oxidoreductase of the FAD-binding PCMH/type-4
  oxidoreductase family. It catalyses the oxidation of (R)-2-hydroxyglutarate (D-2-HG) back
  to 2-oxoglutarate, passing electrons through electron transfer flavoprotein (ETF) and ETF-ubiquinone
  oxidoreductase to the respiratory chain. The enzyme is functionally coupled to the L-serine
  biosynthetic pathway: SerA (D-3-phosphoglycerate dehydrogenase) produces D-2-HG while reducing
  2-oxoglutarate as it oxidises 3-phosphoglycerate, and D2HGDH removes the D-2-HG, maintaining
  its homeostasis and pulling the thermodynamically unfavourable SerA reaction forward.
