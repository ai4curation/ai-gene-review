id: O05927
gene_symbol: cysH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: CysH is a thioredoxin-dependent APS reductase containing a [4Fe-4S] cluster. It reduces activated
  sulfate in APS to sulfite and AMP during assimilatory sulfate reduction, supplying reduced sulfur for
  cysteine biosynthesis. Its substrate preference distinguishes it from the PAPS reductase used by enteric
  bacteria.
