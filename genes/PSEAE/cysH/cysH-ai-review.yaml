  - AGI_LocusCode:AT4G21990
  - PANTHER:PTN008207357
  - UniProtKB:O05927
  review:
    summary: CysH supplies sulfite for assimilatory reduced-sulfur biosynthesis.
    action: ACCEPT
    reason: The enzyme performs the APS-reduction step and thereby supplies reduced sulfur for cysteine
      synthesis; the native P. aeruginosa knockout is a cysteine auxotroph. This is catalytic pathway
      participation, not solely a downstream growth phenotype.
    supported_by:
    - &id001
      reference_id: PMID:10613872
      supporting_text: 'Purified P. aeruginosa CysH expressed as a His-tagged recombinant

        protein is able to reduce APS, but not PAPS.'
    - &id002
      reference_id: PMID:10613872
      supporting_text: 'Insertional knockout mutation of

        P. aeruginosa cysH produced cysteine auxotrophy, indicating its role in sulfate

        assimilation.'
