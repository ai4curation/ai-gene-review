suggested_questions:
- question: >-
    GO has no term for biofilm dispersal (the reverse sessile-to-motile
    transition). Should one be requested, so that GcbA, BdlA and the dispersal
    phosphodiesterases can be annotated to it instead of cue-specific response
    terms?
