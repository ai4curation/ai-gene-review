id: Q9HUW7
gene_symbol: PA4843
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA4843 (GcbA, also called AdcA) is a soluble PleD-like response regulator
  diguanylate cyclase of Pseudomonas aeruginosa, with two receiver domains and
  a C-terminal GGEEF domain that synthesises cyclic di-GMP. Its transcription
  is directly repressed by AmrZ. GcbA-made c-di-GMP suppresses flagellar
  reversals and swimming and swarming motility, and so promotes initial surface
  attachment. Early in biofilm growth GcbA is needed for processing of the
  chemosensory protein BdlA, which later allows biofilms to disperse in
  response to environmental cues. Derepression of GcbA in amrZ mutants raises
  c-di-GMP and causes a hyperbiofilm phenotype.
references:
- id: PMID:24603766
  title: ChIP-Seq and RNA-Seq reveal an AmrZ-mediated mechanism for cyclic di-GMP synthesis
    and biofilm development by Pseudomonas aeruginosa.
  findings:
  - statement: Expression of PA4843 (adcA) raises cellular c-di-GMP about 30-fold.
    supporting_text: expression of PA4843 in these strains generated nearly thirty
      fold more c-di-GMP
  - statement: Deleting adcA in an amrZ mutant removes its c-di-GMP accumulation and
      hyperbiofilm phenotype.
    supporting_text: Deletion of adcA in a ΔamrZ mutant eliminated the accumulation
      of c-di-GMP and the hyper biofilm phenotype
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. PseudoCAP source of the GO:0052621 EXP and IMP
      seed rows and the GO:1900233 IMP row.
- id: PMID:24891445
  title: The Pseudomonas aeruginosa diguanylate cyclase GcbA, a homolog of P. fluorescens
    GcbA, promotes initial attachment to surfaces, but not biofilm formation, via regulation
    of motility.
  findings:
  - statement: GcbA overexpression raises c-di-GMP to 228 pmol/mg versus under 35
      for controls.
    supporting_text: PAO1/pJN- gcbA cultures on average contained 228 pmol of c-di-GMP
      per mg of total cell protein
  - statement: GcbA represses swimming and swarming motility.
    supporting_text: Inactivation of gcbA resulted in small, but significant increases
      in both swimming and swarming motilities, while overexpression of gcbA suppressed
      both forms of flagellum-driven motility
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. PseudoCAP source of the GO:0052621 IDA
      seed row.
- id: PMID:25331436
  title: The diguanylate cyclase GcbA facilitates Pseudomonas aeruginosa biofilm dispersion
    by activating BdlA.
  findings:
  - statement: GcbA DGC activity is needed for BdlA processing and for dispersal
      in response to many cues.
    supporting_text: plays an essential role in allowing biofilm cells to disperse in
      response to increasing concentrations of a variety of substances, including carbohydrates,
      heavy metals, and nitric oxide
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only (no full text from the PMC API on 2026-11-05). Source of the
      GO:1902065 IMP row; the abstract describes a general dispersal role and
      does not name glutamate.
