- term:
    id: GO:1902065
    label: response to L-glutamate
  evidence_type: IMP
  original_reference_id: PMID:25331436
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP. gcbA mutant biofilms fail to disperse in response to many
      cues because GcbA is needed earlier for BdlA processing. The role is in
      biofilm dispersal generally, not in sensing L-glutamate, which the abstract
      does not name (abstract only).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Dispersal-deficient mutants lack the response to every cue, so the
      glutamate response is a consequence of a general dispersal defect. GO has
      no biofilm dispersal term; this is raised as a question.
    supported_by:
    - reference_id: PMID:25331436
      supporting_text: plays an essential role in allowing biofilm cells to disperse in
        response to increasing concentrations of a variety of substances, including carbohydrates,
        heavy metals, and nitric oxide
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      requested_change: CHECK
      asserted_value: GO:1902065
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        GO:1902065 response to L-glutamate IMP on PA4843/GcbA (Q9HUW7) from
        PMID:25331436. The abstract states that GcbA, through early BdlA
        processing, is required for biofilm dispersal in response to many
        substances (carbohydrates, heavy metals, nitric oxide), so the
        phenotype reflects a general dispersal defect rather than a role in the
        glutamate response. Please consider removing the row, or annotating a
        biofilm dispersal term if one is created (abstract only; full text not
        read).
      supported_by:
      - reference_id: PMID:25331436
        supporting_text: plays an essential role in allowing biofilm cells to disperse
          in response to increasing concentrations of a variety of substances, including
          carbohydrates, heavy metals, and nitric oxide
