id: Q9HY46
gene_symbol: nalD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: NalD (PA3574) is a TetR-family transcriptional repressor of Pseudomonas aeruginosa that,
  together with MexR, controls the mexAB-oprM multidrug efflux operon. NalD binds an operator, similar
  to those of SmeT and TtgR, that overlaps a second, proximal mexAB-oprM promoter, and nalD mutants overexpress
  MexAB-OprM and are multidrug resistant (nalD-type mutants occur in clinical isolates). The phenazine
  pyocyanin binds NalD with micromolar affinity and releases it from the mexA promoter, linking efflux-pump
  induction to pyocyanin production; NalD also binds promoters of phenazine biosynthesis genes.
