- term:
    id: GO:0032410
    label: negative regulation of transporter activity
  evidence_type: IMP
  original_reference_id: PMID:17028276
  qualifier: involved_in
  review:
    summary: PseudoCAP IMP. NalD represses transcription of mexAB-oprM from a second promoter.
    action: REMOVE
    reason: GO:0032410 is a process that reduces transporter activity. NalD represses mexAB-oprM transcription,
      lowering the amount of pump, as the abstract states. The transcriptional role is captured by GO:0045892.
    supported_by:
    - *id004
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0032410
      cause: OTHER
      confidence: PROBABLE
      explanation: 'PseudoCAP IMP row for PA3574/nalD, GO:0032410 negative regulation of transporter activity,
        from PMID:17028276 (Morita et al. 2006). GO:0032410 is a process that reduces the activity of
        a transporter. The abstract states that NalD binds an operator overlapping a mexAB-oprM promoter
        and that expression from that promoter rises in a nalD mutant. That is regulation of gene expression,
        not of transporter activity. Requested change: delete the row; the transcriptional role is already
        annotated (GO:0045892). Abstract-only reading; the full text could in principle report a post-translational
        effect, which would be unprecedented for a TetR repressor.'
      supported_by:
      - *id004
