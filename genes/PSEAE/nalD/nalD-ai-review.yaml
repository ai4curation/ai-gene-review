- id: PMID:15855496
  title: Mutations in PA3574 (nalD) lead to increased MexAB-OprM expression and multidrug resistance in
    laboratory and clinical isolates of Pseudomonas aeruginosa.
  findings:
  - statement: nalD mutations cause MexAB-OprM overexpression; the cloned gene reverses it.
    supporting_text: the cloned nalD gene reduced the multidrug resistance and MexAB-OprM expression of
      the transposon mutant and clinical isolates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PseudoCAP source for IMP GO:0051051. Full text cached.
- id: PMID:17028276
  title: nalD encodes a second repressor of the mexAB-oprM multidrug efflux operon of Pseudomonas aeruginosa.
  findings:
  - statement: NalD binds an operator overlapping a second mexAB-oprM promoter, whose expression rises
      in a nalD mutant.
    supporting_text: increased expression from this promoter was seen in a nalD mutant, consistent with
      NalD directly controlling mexAB-oprM expression from a second promoter
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PseudoCAP source for IDA GO:0003677 and IMP GO:0045892 (seed of the PTN004738546 GO:0006355
      IBD), plus IMP GO:0032410 and GO:0034763. Abstract only in the cache (full text PMC1698243); the
      abstract itself states NalD binding and increased promoter activity in the nalD mutant, so the seed
      is sound.
- id: PMID:40794867
  title: MexR and NalD are pyocyanin-responsive transcriptional repressors of the efflux pump MexAB-OprM
    in Pseudomonas aeruginosa.
  findings:
  - statement: Pyocyanin binds NalD and releases it from the mexA promoter.
    supporting_text: Electrophoretic mobility shift assays show that PYO binding to MexR and NalD induces
      their dissociation from the mexA promoter
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: UniProt source for IDA GO:0000976 (which also makes nalD a seed of the GO:0000976 IBD).
      Full text cached.
