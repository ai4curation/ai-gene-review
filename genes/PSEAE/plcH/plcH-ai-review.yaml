  label: Pseudomonas aeruginosa PAO1
description: >-
  PlcH (PA0844) is the secreted haemolytic phospholipase C of Pseudomonas aeruginosa, the founding member
  of a bacterial PC-PLC/phosphatase superfamily that also contains the M. tuberculosis PlcA-D enzymes
  and plant non-specific phospholipases C. It is exported across the inner membrane by the Tat system
  and reaches the extracellular medium through the Xcp type II secretion system, and is purified from
  culture supernatants as a 1:1 complex with the chaperone PlcR2. PlcHR2 acts only on choline-containing
  phospholipids, hydrolysing phosphatidylcholine and sphingomyelin equally well (plasmenylcholine too)
  and releasing phosphocholine; purified PlcH also catalyses the reverse-type transfer reaction of a sphingomyelin
  synthase. The host-derived choline and glycine betaine released by PlcH feed P. aeruginosa metabolism
  and raise Anr activity, and PlcH contributes to haemolysis and to virulence in animal infection.
