core_functions:
- description: >-
    Secreted choline-phospholipid-specific phospholipase C: hydrolyses host phosphatidylcholine and sphingomyelin
    to phosphocholine plus diacylglycerol or ceramide, acting as a haemolysin and supplying choline for
    catabolism.
