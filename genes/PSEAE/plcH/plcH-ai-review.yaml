- id: PMID:12410824
  title: A novel class of microbial phosphocholine-specific phospholipases C.
  findings:
  - statement: >-
      The 1,500-fold purified PlcHR2 heterodimer hydrolyses only choline-containing phospholipids, phosphatidylcholine
      and sphingomyelin equally.
    supporting_text: >-
      PlcHR2 is only active on choline-containing phospholipids. It is equally active on phosphatidylcholine
      (PC) and sphingomyelin (SM) and is able to hydrolyse plasmenylcholine phospholipids (plasmalogens)
  - statement: >-
      Purified PlcHR2 is haemolytic, and calcium inhibits the haemolytic activity without affecting the
      enzymatic activity.
    supporting_text: >-
      While calcium has no detectable effect on enzymatic activity, it inhibits the haemolytic activity
      of PlcHR2
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "Abstract read. Purified-enzyme substrate specificity and haemolysis; this is the\n\
      \   seed annotation for both PAINT nodes and it is well supported."
- id: PMID:2120196
  title: >-
    Molecular comparison of a nonhemolytic and a hemolytic phospholipase C from Pseudomonas aeruginosa.
  findings:
  - statement: >-
      PLC-H hydrolyses sphingomyelin as well as phosphatidylcholine, unlike PLC-N, which also acts on
      phosphatidylserine.
    supporting_text: PLC-H hydrolyzes sphingomyelin in addition to phosphatidylcholine
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract read. Supports the choline-phospholipid specificity; the PseudoCAP row from it is the general
      lipase term.
- id: PMID:12799377
  title: >-
    Purification, characterization, and identification of a sphingomyelin synthase from Pseudomonas aeruginosa.
    PlcH is a multifunctional enzyme.
  findings:
  - statement: >-
      Purified PlcH has sphingomyelin synthase activity, and the activity is absent from plcH operon knockouts.
    supporting_text: Second, purified PlcH showed SM synthase activity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract read. Real activity of the purified protein; its physiological relevance for a secreted
      enzyme is unclear, hence KEEP_AS_NON_CORE.
- id: PMID:11726509
  title: >-
    Involvement of the twin-arginine translocation system in protein secretion via the type II pathway.
  findings:
  - statement: >-
      Two P. aeruginosa phospholipases, including PlcH, use the Tat system for inner-membrane translocation
      before the Xcp secreton.
    supporting_text: >-
      two substrates for the Pseudomonas aeruginosa secreton, both phospholipases, use the twin-arginine
      translocation (Tat) system
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract read. Supports the secretion route; the abstract names the phospholipases as substrates,
      which is why the T2SS process term is flagged.
- id: PMID:23667230
  title: >-
    Anr and its activation by PlcH activity in Pseudomonas aeruginosa host colonization and virulence.
  findings:
  - statement: >-
      PlcH degrades host phosphatidylcholine; the choline and glycine betaine released activate the Anr
      regulon, and a plcHR mutant is defective in colonization and biofilm formation.
    supporting_text: >-
      A ΔplcHR mutant, known to be defective in virulence in animal models, was less able to colonize
      epithelial cell monolayers and was defective in biofilm formation on plastic when grown in lung
      surfactant
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: "Full text cached and read. The paper supports PlcH-dependent phosphatidylcholine\n\
      \   degradation and virulence-related phenotypes, but no haemolysis assay appears in the cached\
      \ text, so it\n   is a doubtful support for the GO:0044179 IMP row (left UNDECIDED, not removed,\
      \ since figures may not be\n   captured by the extraction)."
