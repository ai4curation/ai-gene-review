suggested_questions:
- question: >-
    Does the sphingomyelin synthase (transfer) reaction of PlcH occur at all outside the test tube, where
    ceramide and phosphatidylcholine are in separate host membrane leaflets?
suggested_experiments:
- description: >-
    Assay purified PlcHR2 on host-cell membranes and lung surfactant for hydrolysis versus transfer products,
    to establish whether sphingomyelin synthesis is physiologically relevant.
