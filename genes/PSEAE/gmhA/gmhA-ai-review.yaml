- term:
    id: GO:0032298
    label: positive regulation of DNA-templated DNA replication initiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000764072
  - UniProtKB:P66817
  review:
    action: UNDECIDED
    summary: The DiaA-like phylogenetic placement suggests an additional replication-related role, but
      its target-specific functional scope remains unresolved.
    reason: The IBA asserts inheritance at PTN000764072, not a pairwise transfer. Q9HVZ0 has the DiaA-labelled
      PTHR30390:SF6 placement and is structurally compared with DiaA in PMID17699754, so an enzymatic
      GmhA identity does not by itself refute the annotation. The consulted full-text studies establish
      E. coli DiaA binding/replication and comparative structures, but do not settle whether PA4425 also
      forms a native DnaA complex and stimulates initiation. Retain uncertainty without claiming a wrong-paralog
      transfer or a loss of function.
    supported_by:
    - reference_id: PMID:17699754
      supporting_text: Pseudomonas aeruginosa GmhA has an SIS domain and is highly homologous in sequence
        to DiaA
    - *id002
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000764072
        source_status: UNRESOLVED
        comment: PAINT places the replication/complex assertion at this DiaA-related node. Pseudomonas
          PA4425 is an enzymatic GmhA in the DiaA-labelled SF6 and resembles the E. coli DiaA scaffold.
          The literature comparison does not resolve whether PA4425 retains a second DnaA-associated role;
          no loss or misplaced node is asserted.
