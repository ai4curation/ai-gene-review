id: Q9HVZ0
gene_symbol: gmhA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: GmhA (PA4425) is a soluble SIS-family sedoheptulose 7-phosphate isomerase that generates
  D-glycero-D-manno-heptose 7-phosphate for nucleotide-heptose synthesis and the Pseudomonas aeruginosa
  LPS inner core. Its sugar-phosphate-binding catalytic sites are formed within an oligomeric assembly,
  with distinct open and closed conformations observed in structural studies. The enzyme supplies the
  common first heptose intermediate; downstream enzymes determine nucleotide attachment and the final
  D,D or L,D stereochemistry.
