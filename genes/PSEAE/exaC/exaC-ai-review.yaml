- description: >-
    NAD(+)-dependent acetaldehyde dehydrogenase that oxidizes acetaldehyde to
    acetate, completing the two-step oxidation of ethanol
    begun by the quinoprotein ethanol dehydrogenase ExaA and so allowing growth on
    ethanol as sole carbon and energy source.
