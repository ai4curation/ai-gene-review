  label: Pseudomonas aeruginosa
description: ExaC from Pseudomonas aeruginosa ATCC17933 is an NAD-dependent acetaldehyde dehydrogenase
  encoded downstream of the cytochrome c550 gene exaB in the ethanol-oxidation region. It oxidizes acetaldehyde
  to acetate, providing the second oxidative step after the quinoprotein ethanol dehydrogenase ExaA. Expression
  is induced during growth on ethanol. The 506-residue protein belongs to the aldehyde dehydrogenase superfamily
  and contains the conserved catalytic glutamate and cysteine. A closely related PAO1 ExaC, encoded by
  PA1984, has overlapping acetaldehyde and hydrazone chemistry with PA4022/HdhA.
