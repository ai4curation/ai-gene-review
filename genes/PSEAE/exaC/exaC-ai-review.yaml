  findings:
  - statement: exaC, downstream of the cytochrome c550 gene exaB, encodes a NAD(+)-dependent acetaldehyde
      dehydrogenase; the cluster also contains the quinoprotein ethanol dehydrogenase exaA and pqq genes,
      and a cytochrome c550 mutant cannot grow on ethanol.
    supporting_text: An ORF encoding a NAD(+)-dependent acetaldehyde dehydrogenase (exaC) was located
      downstream of the cytochrome c550 gene and in the same orientation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
