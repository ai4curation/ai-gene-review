gene_symbol: exaC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:287
  label: Pseudomonas aeruginosa
description: >-
  ExaC is a soluble NAD(+)-dependent acetaldehyde dehydrogenase of Pseudomonas
  aeruginosa, encoded immediately downstream of the cytochrome c550 gene exaB in the
  exa (ethanol oxidation) gene region together with the periplasmic quinoprotein
  (PQQ-dependent) ethanol dehydrogenase exaA and pqq biosynthetic genes. In the
  two-step ethanol oxidation route, ExaA oxidizes ethanol to acetaldehyde in the
  periplasm and ExaC oxidizes acetaldehyde to acetate with reduction of NAD(+),
  completing the conversion of ethanol to acetate that allows growth on ethanol as
  sole carbon and energy source. Expression is induced by growth on ethanol. The
  protein is a 506-residue member of the aldehyde dehydrogenase (ALDH)
  superfamily, with the canonical ALDH catalytic cysteine and glutamate
  (PROSITE PS00070/PS00687 motifs; active sites annotated at residues 262 and 301) and a dedicated
  NCBIfam model (NF050026, AcaldDHExaC); the same enzyme provides the
  acetaldehyde-disposal step shared with other routes that generate acetaldehyde.
