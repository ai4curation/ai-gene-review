  knowledge_gaps:
  - gap_statement: >-
      The substrate range and kinetics of ExaC have not been reported: it is not
      known whether it is specific for acetaldehyde or, like several ALDH-family
      relatives, also oxidizes longer-chain or substituted aldehydes, and no
      kinetic constants or oligomeric state are available for the purified enzyme.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
  - gap_statement: >-
      Whether ExaC is the only acetaldehyde dehydrogenase serving ethanol
      catabolism in P. aeruginosa is unknown: no exaC deletion mutant has been
      reported, so its individual contribution to growth on ethanol (as opposed to
      that of the cytochrome c550 and ExaA steps, which were tested) is untested.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
suggested_questions:
- question: Is ExaC specific for acetaldehyde, or does it accept the longer-chain and
    substituted aldehydes handled by other PTHR43111 members such as E. coli AldB?
  experts:
  - Aldehyde dehydrogenase enzymologists
- question: Does P. aeruginosa have redundant cytoplasmic acetaldehyde dehydrogenases,
    and is ExaC also the acetaldehyde sink for other aldehyde-generating routes?
  experts:
  - Pseudomonas central metabolism groups
suggested_experiments:
- hypothesis: ExaC is the principal NAD(+)-dependent acetaldehyde dehydrogenase required
    for growth on ethanol.
  description: >-
    Construct a non-polar exaC deletion in P. aeruginosa, compare growth on ethanol,
    acetaldehyde and acetate with the wild type and with a complemented strain, and
    measure NAD(+)-dependent acetaldehyde dehydrogenase activity in cell-free
    extracts of ethanol-grown cells.
  experiment_type: Gene deletion and enzyme assay
- hypothesis: ExaC has a narrow aldehyde specificity consistent with a dedicated
    acetaldehyde-disposal role.
  description: >-
    Purify recombinant ExaC and determine steady-state kinetics with acetaldehyde and
    a panel of aliphatic, aromatic and substituted aldehydes using NAD(+) and NADP(+),
    and test the catalytic-cysteine (Cys262) variant as a negative control.
  experiment_type: Enzyme kinetics with active-site mutant
