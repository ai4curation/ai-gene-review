suggested_questions:
- question: Does ATCC17933 Q9ZAA1 share the measured hydrazone substrate range and kinetic properties
    of PAO1 PA1984 ExaC?
  experts:
  - Aldehyde dehydrogenase enzymologists
- question: Does P. aeruginosa have redundant cytoplasmic acetaldehyde dehydrogenases, and is ExaC also
    the acetaldehyde sink for other aldehyde-generating routes?
  experts:
  - Pseudomonas central metabolism groups
suggested_experiments:
- hypothesis: ExaC is the principal NAD(+)-dependent acetaldehyde dehydrogenase required for growth on
    ethanol.
  description: Compare nonpolar exaC deletion and complemented ATCC17933 strains on ethanol, acetaldehyde
    and acetate while measuring aldehyde-dehydrogenase activity and compensating enzymes. This extends,
    rather than repeats, the PAO1 single/double-mutant studies.
  experiment_type: Gene deletion and enzyme assay
- hypothesis: ExaC has a narrow aldehyde specificity consistent with a dedicated acetaldehyde-disposal
    role.
  description: Compare purified ATCC17933 Q9ZAA1 with PAO1 PA1984 ExaC using acetaldehyde, AEH and VEH
    under matched NAD+/NADP+ conditions; include the catalytic-cysteine Cys301 variant as a mechanistic
    control.
  experiment_type: Enzyme kinetics with active-site mutant
