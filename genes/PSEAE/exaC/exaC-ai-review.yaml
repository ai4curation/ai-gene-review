      behind UniProt's EXP annotation is in the full text, so the activity row is accepted on the abstract
      plus the curator's ECO:0000269 catalytic-activity statement. The paper's own focus is cytochrome
      c550, with exaC characterized alongside it - a normal pattern, not a mis-citation.
