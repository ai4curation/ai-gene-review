description: TssL1 is an inner-membrane component of the Pseudomonas aeruginosa H1-T6SS membrane complex. Its cytoplasmic/transmembrane DotU-like region and periplasmic OmpA-like domain link the TssJLM membrane complex to the cytoplasmic baseplate.
