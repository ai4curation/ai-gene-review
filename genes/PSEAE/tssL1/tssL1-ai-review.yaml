    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: located_in
  review:
    summary: TssL1 is anchored in the inner (plasma) membrane via its DotU-like transmembrane region.
    action: MODIFY
    reason: 'The generic membrane term is correct but less specific than the evidence supports: TssL1 is a DotU/OmpA-like protein with a Phobius-predicted transmembrane helix (residues 247-267) that anchors it in the bacterial inner (plasma) membrane. Refine to plasma membrane.'
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
