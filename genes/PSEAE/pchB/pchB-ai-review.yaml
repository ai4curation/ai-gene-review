  review:
    summary: PseudoCAP IDA; sole seed of the GO:0009697 IBD at PTN002211012. The paper shows pchB is required
      for, and alone sufficient to convert isochorismate into, salicylate.
    action: ACCEPT
    reason: Expression of pchB alone in an E. coli entB strain (which accumulates isochorismate) yields
      salicylate, and extracts containing PchA and PchB convert chorismate to equimolar salicylate and
      pyruvate. This is direct evidence that PchB performs a step of salicylate biosynthesis, later confirmed
      with the purified enzyme (PMID:11937513).
    supported_by:
    - reference_id: PMID:7500944
      supporting_text: an entB mutant of E. coli blocked in the conversion of isochorismate to
        2,3-dihydro-2,3-dihydroxybenzoate formed salicylate when transformed with a pchB expression construct
    - reference_id: PMID:7500944
      supporting_text: Our results are consistent with a pathway leading from chorismate to isochorismate and
        then to salicylate plus pyruvate, catalyzed consecutively by the iron-repressible PchA and PchB proteins
        in P. aeruginosa.
