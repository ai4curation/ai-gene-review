taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: pchB encodes isochorismate pyruvate lyase (IPL), a small (101 aa) cytoplasmic enzyme with the
  AroQ-class chorismate-mutase fold that forms an intertwined homodimer with two active sites. It catalyses
  the cofactor-independent elimination of pyruvate from isochorismate to give salicylate, by a pericyclic
  mechanism with hydrogen transfer from C2 to C9. Acting after the isochorismate synthase PchA, encoded by
  the downstream gene of the iron-repressed pchBA operon, PchB supplies the salicylate that the pyochelin
  synthetases incorporate into the siderophore pyochelin. Owing to its fold the enzyme also converts
  chorismate to prephenate in vitro, a non-physiological side activity with much lower catalytic efficiency.
