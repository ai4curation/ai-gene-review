taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  MotB (PA4953) is the B subunit of the MotAB flagellar stator of Pseudomonas
  aeruginosa. It has a single N-terminal transmembrane helix in the inner
  membrane and a periplasmic OmpA-like peptidoglycan-binding domain, and
  together with MotA (PA4954) forms an ion-conducting stator unit that
  generates torque at the flagellar rotor. P. aeruginosa has a second stator,
  MotCD (PA1460-PA1461), and the two are largely redundant: either supports
  swimming, and loss of both MotB homologues abolishes motility. MotCD is the
  stator needed for swarming on firmer surfaces, whereas MotAB is dispensable
  for swarming and, at high c-di-GMP, is needed for repression of swarming,
  probably by displacing MotCD from the motor.
