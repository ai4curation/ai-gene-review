core_functions:
- description: >-
    B subunit of the MotAB stator of the polar flagellum. MotB anchors the
    stator in the inner membrane and, with MotA, conducts ions to generate
    torque, powering flagellum-dependent motility redundantly with the MotCD
    stator.
  directly_involved_in:
  - id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0120101
    label: bacterial-type flagellum stator complex
  supported_by:
  - reference_id: PMID:15375113
    supporting_text: >-
      Mutation of both genes encoding the MotA homologs or MotB homologs was
      sufficient to abolish motility.
  - reference_id: PMID:25349157
    supporting_text: >-
      P. aeruginosa encodes two stator complexes, MotAB and MotCD, that
      participate in the function of its single polar flagellum.
suggested_questions:
- question: >-
    Does MotAB restrain swarming by occupying motor stator sites (displacing
    MotCD), or does it actively generate a different torque output on surfaces?
suggested_experiments:
- description: >-
    Count MotB-containing and MotD-containing stator units per motor by
    fluorescence of functional chromosomal fusions in cells on swarm agar at
    low and high c-di-GMP, alongside motor torque measurements, to test the
    stator-exchange model.
