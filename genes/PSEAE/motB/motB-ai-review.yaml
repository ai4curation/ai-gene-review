- term:
    id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IMP
  original_reference_id: PMID:15629949
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IMP from Toutain et al. 2005 (PA14). The motAB deletion swarms
      like wild type; the motAB motCD double deletion does not swarm.
    action: KEEP_AS_NON_CORE
    reason: >-
      The authors conclude both stators act in swarming, and MotAB alone (in
      the motCD mutant) supports swarming on 0.45% agar, so the stator does
      take part in the swarming motor. But the single-gene phenotype is wild
      type, MotCD is the stator swarming depends on, and multicopy MotAB
      inhibits swarming. Context-specific, non-core; the evidence is a genetic
      interaction rather than a motB mutant phenotype.
    supported_by:
    - reference_id: PMID:15629949
      supporting_text: >-
        we conclude that the MotAB and MotBC proteins are stators that play a
        role in flagellar motor function for both swimming and swarming
        motility.
    - reference_id: PMID:15629949
      supporting_text: >-
        The double mutant Δ motAB Δ motCD is not able to swarm under any of
        the conditions tested.
    source_defects:
