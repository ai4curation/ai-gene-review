- id: PMID:15629949
  title: Evidence for two flagellar stators and their role in the motility of Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      MotAB and MotCD are redundant for swimming; the motAB single mutant
      swarms like wild type, motCD is needed for swarming on firmer agar, and
      the double mutant neither swims nor swarms.
    supporting_text: >-
      The phenotypic analysis of the deletion mutants demonstrated that the
      MotAB and MotCD proteins are functionally redundant for swimming, as well
      as for swarming in relatively low agar concentrations.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Toutain et al. 2005 J Bacteriol (PA14); full text cached. Cited by
      PseudoCAP for the IMP swarming row that seeds PTN001251133. The paper
      supports a stator role in motility; the swarming claim for MotAB rests
      on the double mutant only, as the single motAB deletion swarms normally.
- id: PMID:25349157
  title: Cyclic di-GMP-mediated repression of swarming motility by Pseudomonas aeruginosa
    PA14 requires the MotAB stator.
  findings:
  - statement: >-
      MotAB is needed for c-di-GMP repression of swarming; motAB mutants swarm
      more than wild type.
    supporting_text: >-
      Here we show that the repression of swarming motility requires a
      functional MotAB stator complex.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
