  label: Pseudomonas aeruginosa PAO1
description: >-
  PA1059 encodes subunit G (ShaG/MrpG) of the Sha (Mrp/Mnh/Pha) multisubunit
  Na+/H+ antiporter of Pseudomonas aeruginosa PAO1. It is a small (115
  residues) integral membrane protein with three predicted transmembrane
  helices, in the PhaG/MnhG/YufB family. It is the last gene of the six-gene
  sha cluster PA1054-PA1059, in which shaA and shaB are fused. The cluster
  restores Na+ tolerance and Na+/H+ antiport to an E. coli strain lacking its
  major antiporters, and in P. aeruginosa the Sha antiporter is largely
  responsible for Na+ extrusion and supports virulence in mouse infection
  models. In Bacillus Mrp antiporters, a conserved proline of MrpG (Pro81) is
  needed for Na+/H+ antiport. Its homologue in archaeal membrane-bound
  hydrogenase is MBH subunit C.
