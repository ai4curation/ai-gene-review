suggested_questions:
- question: >-
    Should GO provide a cellular component term for the Mrp-type
    multisubunit Na+/H+ antiporter complex, by analogy with GO:1903103
    potassium:proton antiporter complex, so that Sha/Mrp subunits can be
    annotated to the complex instead of each carrying the activity?
- question: >-
    Should the subunit G IBD at PTN002162936 reach MBH/MBX hydrogenase
    subunit C proteins (TK2082, TK1224)?
suggested_experiments:
- description: >-
    Make an in-frame PA1059 (shaG) deletion and a ShaG proline-to-alanine
    mutant at the position equivalent to B. subtilis MrpG Pro81, then test
    Na+ tolerance, Na+ efflux and Sha complex assembly (BN-PAGE); assay Na+/H+
    antiport in everted vesicles of E. coli TO114 carrying each variant
    cluster.
