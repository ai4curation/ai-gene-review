    supporting_text: >-
      MrpG-P81A in category 7 did not retain Na+/H+ antiport activity, but it
      was able to complement the sodium sensitivity of the E. coli KNabc.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified review (Ito, Morino and Krulwich 2017, Front Microbiol).
