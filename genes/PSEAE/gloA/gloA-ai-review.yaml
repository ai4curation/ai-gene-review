id: Q9HU72
gene_symbol: gloA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5111 (gloA3) of Pseudomonas aeruginosa PAO1 encodes one of three glyoxalase I (lactoylglutathione
  lyase) enzymes in this bacterium. Unlike GloA1 and GloA2, which belong to the Ni2+/Co2+-activated class
  typical of bacteria, GloA3 is a Zn2+-activated glyoxalase I like the eukaryotic enzymes. It isomerises
  the methylglyoxal-glutathione hemithioacetal to (R)-S-lactoylglutathione, the first step of glutathione-dependent
  methylglyoxal detoxification.
