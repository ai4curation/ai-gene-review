- id: PMID:11790124
  title: Characterization of soluble and membrane-bound family 3 lytic transglycosylases from Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      The lipidated paralog (MltB, PA4444) was truncated before Cys17 to give soluble sMltB.
    supporting_text: Its gene was engineered to produce a truncated form of the enzyme lacking its N-terminal
      17 residues which includes Cys17, the putative site of lipidation.
  - statement: Purified sMltB and SltB both release anhydromuropeptides from insoluble peptidoglycan.
    supporting_text: Both enzymes produced the same three major soluble products which were identified as
      anhydromuropeptides based on ESI-MS analysis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only (no PMC full text). PseudoCAP IDA source for GO:0008933 and seed of PTN002410022. The
      abstract itself states the decisive fact (anhydromuropeptide products from insoluble PG). The
      lipidated enzyme with Cys17 matches PA4444 (UniProt lipidation at Cys17), not PA4001.
- id: PMID:18708507
  title: Interaction of penicillin-binding protein 2 with soluble lytic transglycosylase B1 in Pseudomonas
    aeruginosa.
  findings:
  - statement: MltB is the lipoprotein of the four P. aeruginosa family 3 LTs.
    supporting_text: One, MltB, is a lipoprotein, whereas three other homologues are produced in soluble form
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read; used only for the lipoprotein/soluble naming of the paralogs.
