gene_symbol: mltB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  mltB1 (PA4444) encodes membrane-bound lytic transglycosylase B1 (MltB1), a family 3 (GH103,
  MltB-like) lytic transglycosylase of Pseudomonas aeruginosa. The 367-residue precursor has a signal
  peptide followed by a lipobox, and the protein is palmitoylated at Cys17, anchoring it as a lipoprotein
  to the periplasmic face of a membrane. The catalytic SLT domain cleaves the beta-1,4 bond between
  N-acetylmuramic acid and N-acetylglucosamine in peptidoglycan with formation of 1,6-anhydromuramyl
  ends; a soluble form lacking the lipidated N-terminus releases anhydromuropeptides from insoluble
  peptidoglycan. Its soluble paralogs SltB1, SltB2 and SltB3 share the same fold and reaction.
