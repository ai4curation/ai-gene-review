taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA5388 encodes CaiX, the periplasmic carnitine-recognition subunit associated with the shared
  CbcWV ABC importer in Pseudomonas aeruginosa PAO1. Its signal peptide directs export, while the substrate-binding
  domain supplies carnitine recognition to the membrane permease and ATPase. P. aeruginosa genetics and
  reconstitution of compatible CbcWV/CaiX proteins establish import rather than a chemical step of carnitine
  degradation. Substrate uptake kinetics are properties of the assembled transport system, not purified
  CaiX binding constants.
existing_annotations:
- term:
    id: GO:0005275
    label: amine transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:19919675
  qualifier: enables
  review:
    summary: The uptake assays show carnitine transport, but carnitine is a quaternary ammonium compound,
      and GO does not place carnitine transport under amine transport.
    action: MODIFY
    reason: The experiment supports the carnitine-specific term already on this protein (GO:0015226).
      An OLS4 query of the GO hierarchy (PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md, hierarchicalAncestors,
      run 2026-11-04) shows GO:0015226, GO:0015879 and GO:1902603 sit under quaternary ammonium group
      transport (GO:0015697/GO:0015651) and not under GO:0005275 or GO:0015837. The amine term is therefore
      a lateral mis-placement of the substrate class, not a true-but-broad ancestor, and is replaced rather
      than kept as non-core. The genes/human/SLC22A5 review keeps GO:0015837 on a carnitine transporter
      as correct but general; the difference from that precedent is deliberate and follows the OLS placement.
    proposed_replacement_terms:
    - id: GO:0015226
      label: carnitine transmembrane transporter activity
    supported_by:
    - reference_id: PMID:19919675
      supporting_text: As expected, MKH13 cells coexpressing cbcWV (on pNcbcWV) and caiX (on a pTOK2T
        derivative) were able to take up carnitine but not choline and betaine, demonstrating that CaiX
        was sufficient for, and specific to, carnitine uptake (Table 5).
    - reference_id: file:PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
      supporting_text: '| GO:0015226 | carnitine transmembrane transporter activity | no | no | yes |'
