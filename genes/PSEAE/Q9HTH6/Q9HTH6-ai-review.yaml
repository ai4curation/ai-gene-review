- id: PMID:19406895
  title: Identification of genes required for Pseudomonas aeruginosa carnitine catabolism.
  findings:
  - statement: Places PA5388 in the locus required for growth on carnitine.
    supporting_text: The PA5388-PA5384 region contains the predicted P. aeruginosa carnitine dehydrogenase
      homologue along with other genes required for growth on carnitine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full PMC methods/results read through the archived successful web retrieval; protected
      cache remains abstract-only. Includes PAO1 insertion mutants, with targeted deletion/complementation
      and lysate work mainly in PA14. Genetic necessity is distinguished from uptake versus chemical catabolism;
      historical DhcAB/AtoB assignments are not used as a fully established alternative route.
- id: PMID:19919675
  title: The ATP-binding cassette transporter Cbc (choline/betaine/carnitine) recruits multiple substrate-binding
    proteins with strong specificity for distinct quaternary ammonium compounds.
  findings:
  - statement: PA5388 is named CaiX and shown, with CbcWV, to be sufficient for and specific to carnitine
      uptake.
    supporting_text: demonstrating that CaiX was sufficient for, and specific to, carnitine uptake (Table
      5).
  - statement: Rhizobiaceae genomes lack CaiX orthologues.
    supporting_text: The complete genomes of strains of Rhizobiaceae do not contain genes encoding CaiX
      orthologues.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. PAO1 CbcWV constructs, PA14 native mutants and B728a binding proteins/heterologous
      hosts are distinguished. Table5 CaiX specificity reconstitution is not relabeled as a fully native
      PAO1 assay. The core supplies transport, not substrate chemical breakdown.
