      PA2590, PA2070, PA2089) of the PTN002933024 IBD. Abstract only (Mol Microbiol, not in
      PMC). The abstract reports proteomic analysis among the methods and calls the transducers
      outer membrane-localized, but does not name this protein or say whether it was detected in
      an outer-membrane fraction rather than found by microarray; that could not be checked.
