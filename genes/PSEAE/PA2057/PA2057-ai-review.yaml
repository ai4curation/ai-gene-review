suggested_experiments:
- description: >-
    Screen siderophores and other TonB-dependent substrates for growth promotion under iron
    limitation in a PA2057 deletion mutant versus wild type and complemented strain, and confirm
    outer-membrane localisation by fractionation of a tagged protein.
