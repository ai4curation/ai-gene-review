gene_symbol: PA2057
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2057 (Q9I258) is an uncharacterised TonB-dependent outer membrane receptor of Pseudomonas
  aeruginosa PAO1 (PANTHER PTHR47234:SF1). The annotated 846-residue model lacks a signal
  peptide because it starts at an internal GTG codon; the PAO1 genome continues the reading
  frame 139 codons upstream to an ATG, adding a signal-peptide-like segment and an N-terminal
  extension (see gene_model_issues). The full-length protein is a TonB-dependent receptor of 985
  residues. Receptors of this family bind a ligand at the cell surface and, energised by the
  TonB-ExbB-ExbD complex through the TonB box, translocate it across the outer membrane; many
  import siderophore-iron complexes or other scarce nutrients. The substrate of this receptor is
  not known.
gene_model_issues:
- issue_type: WRONG_START_SITE
  status: CONFIRMED
  description: >-
    The PAO1 model (AAG05445.1, NP_250747.1; 846 aa) starts at an internal GTG that corresponds to
    the VVTGS motif of the receptor, so the entry has no signal peptide, which an outer-membrane
    beta-barrel protein must have. Translation of the PAO1 genome upstream of the annotated start
    continues the same open frame for 185 codons; from the ATG aligned with the start of the longer
    orthologous models it encodes 139 residues
    (MPHHAPSTRL...) beginning with a hydrophobic signal-peptide-like segment and followed by a
    segment resembling the STN domain of TonB-dependent transducers (not formally scanned). This extension is 137/139 identical to the N-terminus
    of a 985-aa P. aeruginosa variant (UniParc UPI000EB53B2E) in the same UniRef90 cluster, the
    commonest length in that cluster (98 of 336 members). Functional statements here apply to the
    full-length 985-residue protein. The truncation does not affect the outer-membrane location.
  evidence_types:
  - GENOMIC_SEQUENCE
  - ORTHOLOG_COMPARISON
  - DOMAIN_ARCHITECTURE
  supported_by:
  - reference_id: file:PSEAE/PA2057/PA2057-bioinformatics/RESULTS.md
    supporting_text: the PAO1 genome continues the PA2057 reading frame 185 codons upstream of the
      annotated start without a stop
