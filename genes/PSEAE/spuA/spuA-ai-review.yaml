  supporting_entities:
  - UniRule:UR000415630
  review:
    summary: L-glutamine metabolism is a UniRule transfer from the class I GATase fold.
    action: REMOVE
    reason: 'SpuA itself was assayed: activity and substrate-binding assays show it prefers gamma-Glu-GABA,
      and its structures trap a glutamyl-thioester intermediate from that substrate, so its gamma-glutamyl
      hydrolase role is in polyamine catabolism. The L-glutamine metabolism row comes from a fold-level
      UniRule for class I glutamine amidotransferases with no evidence that SpuA acts on glutamine or
      contributes to glutamine metabolism.'
    supported_by:
    - reference_id: PMID:34605433
      supporting_text: Activity and substrate-binding assays confirm that SpuA exhibits a preference for
        γ-Glu-GABA as a substrate.
    - reference_id: PMID:34605433
      supporting_text: Structures of an inactive H221N mutant were determined with bound glutamate thioester
        intermediate or glutamate product, thus delineating the active site and substrate-binding pocket
        and elucidating the catalytic mechanism.
