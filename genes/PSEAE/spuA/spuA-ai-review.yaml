taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: SpuA (PA0297) of Pseudomonas aeruginosa PAO1 is a gamma-glutamyl-gamma-aminobutyrate hydrolase
  of the class I glutamine amidotransferase-like (peptidase C26, PuuD-like) family. Encoded first in the
  polyamine-inducible spuABCDEFGH operon, it hydrolyses gamma-Glu-GABA to L-glutamate and GABA, the deglutamylation
  step of the gamma-glutamylation route of polyamine catabolism. Crystal structures show a class I GATase
  fold whose catalytic cysteine forms a glutamyl thioester intermediate; activity and binding assays show
  a preference for gamma-Glu-GABA. spuA mutants are defective in spermidine utilization.
