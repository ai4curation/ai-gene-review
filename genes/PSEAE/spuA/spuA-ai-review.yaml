suggested_questions:
- question: >-
    Should SpuA also carry GO:0009447 putrescine catabolic process, as its E. coli
    orthologue PuuD does? It catalyses the last step of the putrescine
    gamma-glutamylation route, but the spuA mutant grows normally on putrescine.
suggested_experiments:
- description: >-
    Construct spuA and pauD2 (and PA2268) single and combined mutants and test
    growth on putrescine and spermidine with gamma-Glu-GABA accumulation measured,
    to resolve which hydrolase serves each polyamine.
