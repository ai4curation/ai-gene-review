- id: PMID:34605433
  title: Structure and mechanism of the γ-glutamyl-γ-aminobutyrate hydrolase SpuA from Pseudomonas aeruginosa.
  findings:
  - statement: SpuA is a class I GATase-family hydrolase that prefers gamma-Glu-GABA; the H221N mutant
      traps a glutamyl thioester intermediate.
    supporting_text: Activity and substrate-binding assays confirm that SpuA exhibits a preference for
      γ-Glu-GABA as a substrate.
  - statement: A glutamine-hydrolysing GATase of M. smegmatis is inactive on gamma-Glu-GABA, separating
      the two activities.
    supporting_text: Activity assays confirm that MsGATase has activity for glutamine as a substrate but
      not for γ-Glu-GABA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structural and biochemical characterization of SpuA; abstract cached.
