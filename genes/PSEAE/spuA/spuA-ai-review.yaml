gene_symbol: spuA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SpuA (PA0297, also called PauD1) is a cytoplasmic class I glutamine
  amidotransferase-like hydrolase of the peptidase C26 (PuuD-like) family and
  the P. aeruginosa homologue of E. coli PuuD. It is encoded first in the
  spuABCDEFGH operon for polyamine uptake and utilization. SpuA is a
  gamma-glutamyl-gamma-aminobutyrate hydrolase (EC 3.5.1.94): it cleaves
  gamma-Glu-GABA to glutamate and GABA through a cysteine-linked glutamyl
  thioester intermediate. This is the last step of the gamma-glutamylation
  pathway that turns putrescine, and the aminobutyl moiety of spermidine, into
  GABA. Purified SpuA prefers gamma-Glu-GABA as substrate, and spuA mutants are
  defective in growth on spermidine but grow normally on putrescine, presumably
  because of a redundant hydrolase.
