- term:
    id: GO:0004485
    label: methylcrotonoyl-CoA carboxylase activity
  evidence_type: IDA
  original_reference_id: PMID:18469096
  qualifier: enables
  review:
    summary: Activity of the enzyme reconstituted from purified LiuD and LiuB subunits.
    action: ACCEPT
    reason: The term is right and is the gene's core role, so the row is accepted; the qualifier is
      not. The assay measured a reconstituted enzyme made by mixing the purified alpha and beta subunits,
      so it shows the activity of the pair. LiuD carries out only the biotin carboxylation half, annotated
      separately as GO:0004075, and the carboxyl group must then travel about 80 A to the beta subunit's
      active site, so LiuD contributes to the overall activity rather than enabling it.
    supported_by:
    - &id001
      reference_id: PMID:18469096
      supporting_text: The α and β subunits (2 mg each) were mixed and renatured by dialysis
    - reference_id: PMID:18469096
      supporting_text: Reconstitution of MCCase and GCCase was carried out using the subunits purified
        as described above
    - &id008
      reference_id: PMID:22158123
      supporting_text: The distance between the active sites of BC and CT is approximately 80 Å in
        MCC
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: PSEUDOCAP
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: 'GO:0004485 methylcrotonoyl-CoA carboxylase activity on liuD (Q9I299) is coded
