taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: LiuD (PA2012) is the biotin-containing alpha subunit of 3-methylcrotonyl-CoA
  carboxylase (MCC) in the leucine/isovalerate utilization (Liu) pathway of Pseudomonas aeruginosa.
  It carries the biotin carboxylase (BC), biotin carboxyl carrier protein (BCCP) and BC-CT
  interaction (BT) domains; BC uses ATP and bicarbonate to carboxylate the biotin attached to the
  BCCP lysine, and the carboxybiotin is carried to the carboxyltransferase site of the LiuB beta
  subunit, which carboxylates 3-methylcrotonyl-CoA. Six LiuD and six LiuB subunits form the
  alpha6beta6 holoenzyme. liuD mutants are impaired in leucine degradation and in acyclic
  monoterpene catabolism, which joins the Liu pathway at methylcrotonyl-CoA, and LiuD is induced by
  both leucine and citronellol.
