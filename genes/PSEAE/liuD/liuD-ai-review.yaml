id: Q9I299
gene_symbol: liuD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: LiuD (PA2014) is the alpha subunit of 3-methylcrotonyl-CoA carboxylase (MCC) of
  Pseudomonas aeruginosa, a biotin-dependent carboxylase acting in the third step of leucine
  catabolism and in acyclic terpene catabolism. The subunit carries the biotin carboxylase domain,
  the biotin carboxyl carrier (BCCP) domain that holds the covalently bound biotin, and the BT
  domain that contacts the partner chain. It catalyses the first half of the reaction, the
  MgATP-dependent carboxylation of biotin, and the carrier domain then delivers the carboxyl group
  to the carboxyltransferase site of the beta subunit (LiuB), about 80 A away, where
  3-methylcrotonyl-CoA is carboxylated to 3-methylglutaconyl-CoA. In the 750-kDa alpha6beta6
  holoenzyme the carrier domain of one alpha subunit reaches into the active site of a neighbouring
  beta subunit, so the full activity is a property of the assembled enzyme and not of either chain
  alone.
