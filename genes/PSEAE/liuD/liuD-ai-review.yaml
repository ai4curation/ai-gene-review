suggested_questions:
- question: P. aeruginosa encodes a second, paralogous carboxylase pair (AtuC/AtuF, geranyl-CoA carboxylase)
    and the substrate-specificity paper could not cleanly separate the two activities in vivo. Do
    LiuD and AtuF cross-pair with the opposite beta subunit to form hybrid holoenzymes, and if so
    does that explain the overlapping leucine and terpene phenotypes attributed to each cluster?
