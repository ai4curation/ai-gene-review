id: P21175
gene_symbol: braC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  BraC (PA1074) is the periplasmic substrate-binding protein of the LIV-I high-affinity branched-chain
  amino acid ABC transporter BraCDEFG of Pseudomonas aeruginosa. It is a type I periplasmic
  binding protein of the leucine-binding protein family, about 51% identical to Escherichia
  coli LivJ and LivK, made with a cleaved 26-residue signal peptide and recovered in osmotic
  shock fluid. BraC binds L-leucine, L-isoleucine, L-valine, L-threonine and L-alanine, and
  also L-homoserine, with nanomolar affinity, and delivers them to the BraDE permease and
  BraFG ATPases for sodium -independent uptake across the inner membrane.
references:
- id: PMID:2509433
  title: >-
    Cloning and nucleotide sequence of braC, the structural gene for the leucine-, isoleucine-,
    and valine-binding protein of Pseudomonas aeruginosa PAO.
  findings:
  - statement: The braC plasmid restores LIV-I transport activity in the braC310 mutant.
    supporting_text: >-
      The plasmid carrying the LIVAT-BP gene restored the activity of the high-affinity branched-chain
      amino acid transport system (the leucine, isoleucine, valine [LIV-I] transport system)
      in the braC310 mutant of P. aeruginosa
  - statement: >-
      Mature BraC lacks a cleaved 26-residue signal peptide and was purified from shock fluid.
    supporting_text: >-
      Determination of the N-terminal amino acid sequence of the LIVAT-BP purified from P.
      aeruginosa shock fluid suggested that the N-terminal 26 residues of the gene product
      are cleaved off posttranslationally
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. PseudoCAP source for the IDA branched-chain amino acid transport row;
      the abstract reports genetic complementation of LIV-I transport and N-terminal sequencing
      of the purified protein.
- id: PMID:18833300
  title: >-
    High-throughput phenotypic characterization of Pseudomonas aeruginosa membrane transport
    genes.
  findings:
  - statement: >-
      Each bra mutant is defective in alanine utilization; some also in valine and isoleucine
      utilization.
    supporting_text: >-
      In this work, mutants for each of these genes were found to be defective in Alanine
      metabolism, while utilization of L-Valine and L-Isoleucine was also altered in some
      cases
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. PseudoCAP source for the IMP L-valine and L-isoleucine import seed rows
      of PTN002524712 and the L- and D-alanine rows. Biolog and plate growth phenotypes of
      a PA1074 Tn5 mutant (L-Ala C-, L-Ile C+/-, L-Val N-, D-Ala C+/-); no uptake assay. braC
      is the first gene of the braCDEFG operon, so the insertion may be polar.
- id: PMID:31627455
  title: >-
    Determination of Ligand Profiles for Pseudomonas aeruginosa Solute Binding Proteins.
  findings:
  - statement: >-
      BraC binds the five LIVAT ligands with nanomolar affinity but not L-Met or D-Ala.
    supporting_text: >-
      ITC experiments revealed binding with nanomolar affinities for the five ligands identified
      in the study by Hoshino et al. [58] (Figure 6A), whereas no binding was detected for
      l-Met and d-Ala.
  - statement: BraC also binds L-homoserine with high affinity.
    supporting_text: >-
      However, PA1074 is not specific for proteinogenic amino acids since l-homoserine also
      bound with high affinity (Table 1).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text in cache. Direct ITC ligand profile of purified BraC.
