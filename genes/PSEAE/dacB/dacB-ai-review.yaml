- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000667
  review:
    summary: InterPro2GO mapping from the peptidase S13 signature.
    action: REMOVE
    reason: >-
      GO:0006508 is defined as "The hydrolysis of proteins into smaller
      polypeptides and/or amino acids by cleavage of their peptide bonds." PBP4
      acts on the stem peptides of the peptidoglycan sacculus, not on proteins.
      Treated the same way in the sibling PBP4/PBP7 reviews of this module.
    supported_by:
    - reference_id: PMID:25495032
      supporting_text: >-
        These data demonstrate that PBP4 has dual dd-carboxypeptidase and
        4,3-endopeptidase activities with respect to the stem peptide of the
        sacculus.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR000667
      slot: interpro2go
      requested_change: DELETE_VALUE
      asserted_value: GO:0006508
      confidence: PROBABLE
      explanation: >-
        Resource is InterPro (InterPro2GO; assigned_by InterPro in GOA).
        The InterPro2GO mapping of IPR000667 (Peptidase S13) to GO:0006508 proteolysis is
        applied to this low-molecular-mass penicillin-binding protein, whose
        substrate is peptidoglycan (stem peptides and crosslinks), not protein.
        The signature records the serine D,D-peptidase fold; the mapping should
        be reviewed for the PBP members of the entry.
- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:25495032
  qualifier: involved_in
  review:
    summary: The paper characterizes PBP4 hydrolysis of the sacculus and links its products to muropeptide recycling.
    action: MODIFY
    reason: >-
      Full text read. The paper demonstrates hydrolysis of existing sacculus
      (carboxypeptidase and 4,3-endopeptidase activities) and relates the products
      to recycling and AmpC induction; it shows no synthetic step. The supported
      process is the parent GO:0000270 peptidoglycan metabolic process, already
      accepted from the IBA row, so the overly specific biosynthetic term is
      generalized (as for the same UniPathway-derived claim in the E. coli PBP4
      review).
    proposed_replacement_terms:
    - id: GO:0000270
      label: peptidoglycan metabolic process
    supported_by:
    - reference_id: PMID:25495032
      supporting_text: >-
        In the presence of β-lactam antibiotics these altered cell-wall segments
        enter into the muropeptide recycling pathway, the conduit connecting the
        sensing event in the periplasm and the unleashing of resistance
        mechanisms in the cytoplasm.
- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IC
  original_reference_id: PMID:25495032
  qualifier: located_in
  review:
    summary: A predicted N-terminal signal peptide exports PBP4 to the periplasm, where its peptidoglycan substrate lies.
    action: NEW
    reason: >-
      Two independent lines agree: SignalP predicts a cleavable signal peptide
      (residues 1-22), and the enzyme hydrolyses the peptidoglycan sacculus,
      which in a diderm bacterium lies in the outer membrane-bounded periplasm.
      The authors of the enzymology paper describe the same N-terminal segment as
      the periplasmic delivery signal. GO:0030288 is the term used for the PBP4
      orthologs in the sibling reviews.
    supported_by:
    - reference_id: file:PSEAE/dacB/dacB-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: SIGNAL          1..22
    - reference_id: PMID:25495032
      supporting_text: >-
        This construct lacks the signal peptide for delivery to the periplasm but
        possesses the membrane-anchor segment.
