  label: Pseudomonas aeruginosa PAO1
description: >-
  DacB (PA3047) is penicillin-binding protein 4 (PBP4) of Pseudomonas aeruginosa,
  a low-molecular-mass penicillin-binding protein of the peptidase S13 family
  with an N-terminal signal peptide for export to the periplasm and a
  membrane-anchor segment. PBP4 is a bifunctional peptidoglycan hydrolase: a
  D,D-carboxypeptidase that removes the terminal D-alanine from pentapeptide stems
  and a 4,3-endopeptidase that cleaves D-Ala-mDAP 4-3 crosslinks, but not 3-3
  crosslinks. Purified enzyme turns over synthetic substrates of both reactions
  with comparable efficiency, while in vivo the endopeptidase activity
  predominates. Loss or beta-lactam inactivation of PBP4 increases the pentapeptide
  and crosslinked muropeptides that enter the recycling pathway and is a major
  route to derepression of the AmpC beta-lactamase in clinical isolates.
