- id: PMID:2507528
  title: Cloning, sequencing, and expression of the gene for NADH-sensitive citrate synthase of Pseudomonas
    aeruginosa.
  findings:
  - statement: The P. aeruginosa citrate synthase gene was cloned and expressed in E. coli; the product is an
      active NADH-sensitive citrate synthase encoded by a single ORF.
    supporting_text: Because the cloned gene contained only one open reading frame large enough to encode a
      polypeptide of such a size, the three peaks must represent different forms of the same protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cited by UniProt (EXP GO:0036440). PubMed record matches; abstract supports activity of the
      cloned gene product. Full text not retrievable from PMC via the PubMed MCP.
- id: PMID:7626013
  title: Purification and characterization of citrate synthase isoenzymes from Pseudomonas aeruginosa.
  findings:
  - statement: Two citrate synthase isoenzymes were purified from P. aeruginosa, a hexameric CSI and a
      dimeric CSII, encoded by different genes. CSI corresponds to the gltA product.
    supporting_text: It is suggested that the CS isoenzymes are products of different structural genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cited by PseudoCAP (IDA GO:0036440 and GO:0006099). The abstract supports citrate synthase
      activity of the native hexameric enzyme, which corresponds to GltA, though the paper does not identify
      the gene. It does not assay the TCA cycle, so the process row's IDA code is generous. Abstract only;
      PMC1135760 returned no full text.
