taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: gltA (PA1580) encodes the type I ("large", hexameric) citrate synthase of Pseudomonas
  aeruginosa, a soluble cytoplasmic enzyme that condenses acetyl-CoA with oxaloacetate to form citrate and
  CoA (EC 2.3.3.16), the first and committing step of the tricarboxylic acid cycle. Like other
  Gram-negative type I citrate synthases it is a homohexamer that is allosterically inhibited by NADH, which
  couples entry of carbon into the cycle to the cellular redox state. The gene was cloned and expressed in
  Escherichia coli, and the native hexameric enzyme (CSI) was purified from P. aeruginosa alongside a
  distinct dimeric isoenzyme (CSII) encoded by a different gene.
