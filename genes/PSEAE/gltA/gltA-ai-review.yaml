suggested_questions:
- question: Is the dimeric CSII isoenzyme purified by Mitchell et al. the PrpC-type 2-methylcitrate synthase
    (PA0795), and does it contribute citrate synthase activity in vivo when gltA is absent?
suggested_experiments:
- description: Compare growth of a PA1580 deletion and a PA1580 PA0795 double mutant on acetate, glucose and
    glutamate, and measure citrate synthase activity in their extracts, to establish whether GltA is the sole
    TCA cycle citrate synthase.
  experiment_type: genetic knockout with metabolic phenotyping
