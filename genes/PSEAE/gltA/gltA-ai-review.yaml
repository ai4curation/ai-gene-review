- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IDA
  original_reference_id: PMID:7626013
  qualifier: involved_in
  review:
    summary: PseudoCAP IDA from the purification and characterisation of the P. aeruginosa citrate synthase
      isoenzymes. The paper assays the enzyme; it does not measure TCA cycle participation. This row is the
      sole seed of the TCA cycle IBD at PTN002450857.
    action: ACCEPT
    reason: The process claim is correct, since citrate synthase activity is by definition the TCA cycle's
      entry step and gltA is the only type I citrate synthase of PAO1. The evidence code overstates the
      paper, which shows activity of the purified native CSI hexamer rather than a process; IC from the
      activity would be accurate. That is recorded as a suspected evidence-code defect, not a reason to
      reject the claim.
    supported_by:
    - reference_id: PMID:7626013
      supporting_text: Two types of citrate synthase (CS) have been purified from Pseudomonas aeruginosa, a
        'large' form (CSI) and a 'small' form (CSII).
