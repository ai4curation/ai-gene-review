- term:
    id: GO:1900705
    label: negative regulation of siderophore biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:12492864
  qualifier: involved_in
  review:
    summary: >-
      FpvR inhibits PvdS, the sigma factor required for transcription of the pyoverdine
      synthesis genes, so it negatively regulates pyoverdine biosynthesis. It acts on
      transcription of the biosynthetic genes, which is a legitimate route of regulation
      of the process.
    action: KEEP_AS_NON_CORE
    reason: >-
      True regulatory consequence of the antagonist activity on PvdS; non-core
      relative to the molecular function.
    supported_by:
      - reference_id: PMID:25433393
        supporting_text: FpvI and PvdS are required for expression of the ferri-pyoverdine receptor gene fpvA and of pyoverdine synthesis genes respectively.
      - reference_id: PMID:25433393
        supporting_text: The cytoplasmic region of FpvR bound to and inhibited both FpvI and PvdS when the proteins were co-expressed in Escherichia coli.
