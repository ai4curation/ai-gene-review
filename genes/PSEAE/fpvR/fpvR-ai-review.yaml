status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FpvR (PA2388) is the FecR-family transmembrane anti-sigma factor of the
  ferri-pyoverdine cell-surface signalling system of Pseudomonas aeruginosa. It spans the
  cytoplasmic membrane once, with a cytoplasmic N-terminal region (FecR_N, DUF4880) and a
  periplasmic FecR domain that receives the signal from the TonB-dependent receptor FpvA
  when ferri-pyoverdine binds. Its cytoplasmic region binds and inhibits two ECF sigma
  factors, PvdS, which directs transcription of pyoverdine synthesis and virulence genes
  (exotoxin A, PrpL), and FpvI, which directs transcription of the receptor gene fpvA; the
  FpvI interaction involves sigma region 4. Ferri-pyoverdine signalling relieves this
  inhibition, so FpvR couples siderophore availability to the production of pyoverdine and
  of its receptor.
references:
- id: PMID:12492864
  title: 'Siderophore-mediated cell signalling in Pseudomonas aeruginosa: divergent
    pathways regulate virulence factor production and siderophore receptor synthesis.'
  findings:
  - statement: FpvR negatively regulates FpvI, and controls PvdS-dependent production of
      pyoverdine and other virulence factors.
    supporting_text: FpvR negatively regulates the activity of a second ECF sigma factor, FpvI, which is required for the synthesis of FpvA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP rows (sigma factor antagonist activity; negative
      regulation of siderophore biosynthetic process). Abstract only; the abstract
      states that FpvR negatively regulates FpvI activity and that FpvR controls PvdS,
      which drives pyoverdine production. Direct binding was shown later (PMID:25433393).
- id: PMID:25433393
  title: Interactions between an anti-sigma protein and two sigma factors that regulate
    the pyoverdine signaling pathway in Pseudomonas aeruginosa.
  findings:
  - statement: The cytoplasmic region of FpvR binds and inhibits FpvI and PvdS.
    supporting_text: The cytoplasmic region of FpvR bound to and inhibited both FpvI and PvdS when the proteins were co-expressed in Escherichia coli.
  - statement: FpvR spans the cytoplasmic membrane.
    supporting_text: In the absence of pyoverdine the anti-sigma factor FpvR that spans the cytoplasmic membrane inhibits the activities of both FpvI and PvdS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Tandem affinity purification in P. aeruginosa, co-expression in E.
      coli and mutagenesis of both sigma factors; direct evidence for the antagonist
      activity.
