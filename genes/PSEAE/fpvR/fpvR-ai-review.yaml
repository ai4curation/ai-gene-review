  review:
    summary: >-
      Proposed location. The protein has a single Phobius transmembrane helix between the
      cytoplasmic FecR_N region and the periplasmic FecR domain, and the literature
      describes it as a transmembrane (cytoplasmic membrane) anti-sigma factor that relays
      a periplasmic signal to a cytoplasmic sigma factor.
    action: NEW
