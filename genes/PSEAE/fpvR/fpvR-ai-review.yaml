suggested_questions:
- question: >-
    FecR-family proteins act both as anti-sigma factors and, through their cytoplasmic
    N-terminal fragments, as pro-sigma factors. Should the pro-sigma (sigma factor
    activation) role be captured in GO, and which term would describe it?
