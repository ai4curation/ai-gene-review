    label: cytoplasmic side of plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000193023
  - UniProtKB:P09546
  review:
    summary: >-
      IBA seeded only by E. coli PutA, which shuttles to the inner membrane when
      proline is abundant. The PRODH domain reduces membrane quinone (EC 1.5.5.2),
      which makes a peripheral inner-membrane location plausible for P. aeruginosa
      PutA, but no localization study exists for this protein.
    action: KEEP_AS_NON_CORE
    reason: >-
      Plausible from the quinone-dependent PRODH chemistry and the bifunctional PutA
      clade, but unverified for this protein and peripheral to the core activity.
