  review:
    summary: >-
      InterPro2GO mapping from IPR025703 (bifunctional PutA), a family that includes
      the enterobacterial PutAs, which carry an N-terminal ribbon-helix-helix
      DNA-binding domain and autoregulate putA/putP. The P. aeruginosa protein lacks
      that domain.
    action: REMOVE
    reason: >-
      P. aeruginosa PutA is 1060 residues with only PRODH and P5CDH domains, and
      putA is regulated by the separate AraC/XylS activator PruR. The mapping is
      over-propagated from RHH-containing PutAs and is wrong for this protein.
