id: Q9I5F6
gene_symbol: putA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PutA (PA0782) is the bifunctional proline utilization A enzyme of Pseudomonas
  aeruginosa. It combines an N-terminal FAD-dependent proline dehydrogenase
  (PRODH) domain, which oxidises L-proline to 1-pyrroline-5-carboxylate (P5C)
  with quinone as the electron acceptor, and a C-terminal aldehyde dehydrogenase
  family P5C dehydrogenase (P5CDH) domain, which oxidises the P5C/L-glutamate
  5-semialdehyde intermediate to L-glutamate with NAD+ (or, less well, NADP+).
  The two reactions together convert proline to glutamate, allowing proline to be
  used as a carbon and nitrogen source. Unlike enterobacterial PutA, the 1060-residue
  P. aeruginosa protein lacks the N-terminal ribbon-helix-helix DNA-binding domain
  and is not known to act as a transcriptional repressor; instead putA expression
  is activated by the AraC/XylS regulator PruR in response to proline. PutA is
  required for full virulence in a mouse acute pneumonia model and for
  oxidative-stress tolerance.
references:
- id: PMID:6819140
  title: Purification and properties of the bifunctional proline dehydrogenase/1-pyrroline-5-carboxylate
    dehydrogenase from Pseudomonas aeruginosa.
  findings:
  - statement: Native PutA purified from PAO1 oxidises L-proline to P5C (FAD-dependent)
      and P5C to L-glutamate with NAD or NADP.
    supporting_text: Pro/P5C dehydrogenase oxidized L-proline in an FAD-dependent
      reaction to L-delta 1-pyrroline-5-carboxylic acid and converted this intermediate
      with NAD or NADP as cosubstrates to L-glutamic acid
  - statement: NAD is the preferred cosubstrate (lower Km than NADP).
    supporting_text: Its apparent Km values were 45 mM for L-proline, 0.03 mM for
      NAD and 0.17 mM for NADP
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for both IDA rows (GO:0003842, GO:0004657) and the seed of the
      PTN000193023 IBD. Abstract only in cache, but the abstract states the decisive
      facts outright: the enzyme was purified to homogeneity from strain PAO1 and
      both half-reactions were assayed.
- id: PMID:29632523
  title: PutA Is Required for Virulence and Regulated by PruR in Pseudomonas aeruginosa.
  findings:
  - statement: P. aeruginosa PutA has only PRODH and P5CDH domains and lacks the
      RHH DNA-binding domain; it is unlikely to act as a transcriptional repressor.
    supporting_text: In P. aeruginosa, PutA is 1,060 amino acid residue long and contains
      only two domains, PRODH domain and P5CDH domain.
  - statement: putA is activated by the AraC/XylS regulator PruR.
    supporting_text: An AraC/XylS family protein, PruR, directly bound to the upstream
      of -35 box in the putA promoter and activated putA expression.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Establishes the domain architecture (no RHH domain) and the
      PruR-dependent regulation, which argue against the InterPro2GO transcription
      factor rows.
