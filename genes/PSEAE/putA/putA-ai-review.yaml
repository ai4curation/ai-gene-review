suggested_questions:
- question: >-
    The PTN000193023 node carries a GO:0009898 cytoplasmic side of plasma membrane
    IBD seeded only by E. coli PutA, while yeast Put2 (mitochondrial) and fly P5CDH
    are seeds of other IBDs on the same node. Do eukaryotic leaves inherit 9898, or
    is it blocked by NOT annotations lower in the tree?
- question: >-
    Does P. aeruginosa PutA associate with the inner membrane in a proline-dependent
    way, as E. coli PutA does, despite lacking the RHH domain?
suggested_experiments:
- description: >-
    Fractionate PAO1 grown with and without proline and immunoblot for PutA (with
    inner-membrane and cytoplasmic markers) to test membrane association.
