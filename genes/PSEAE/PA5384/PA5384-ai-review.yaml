taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5384 is an alpha/beta-hydrolase fold-3 protein of the 'GDXG' lipolytic enzyme (hormone-sensitive
  lipase-like) family, encoded as the last gene of the carnitine catabolism operon (caiX-cdhCAB-PA5384,
  PA5388-PA5384) of Pseudomonas aeruginosa PAO1. It is an L-enantiomer-specific short-chain
  acylcarnitine hydrolase that cleaves acetyl- and butyrylcarnitine to carnitine and the corresponding
  short-chain fatty acid, and it is required for growth on these acylcarnitines. The released carnitine
  is catabolised by the Cdh enzymes to glycine betaine, which serves as an osmoprotectant and an inducer
  of the phospholipase C gene plcH. PA5384 is not required for growth on carnitine itself.
