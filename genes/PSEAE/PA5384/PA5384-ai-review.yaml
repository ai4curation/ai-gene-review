      IBA short-chain carboxylesterase activity from PTN000546472, seeded by E. coli Aes and three M.
      tuberculosis GDXG esterases (LipI, LipN, NlhH).
    action: ACCEPT
    reason: >-
      Hydrolysis of acetyl- and butyrylcarnitine is the hydrolysis of a carboxylic ester whose acyl chain
      has fewer than eight carbons, so the reaction PA5384 performs falls within the GO:0034338
      definition, and the seeds are characterised short-chain esterases of the same family. The two
      terms are not linked by is_a in GO, so this row is not redundant with GO:0047619; it is the
      family-level description of the same activity.
    supported_by:
    - reference_id: PMID:23524670
      supporting_text: >-
        required for growth and hydrolysis of acetyl- and butyrylcarnitine to carnitine and the
        respective short-chain fatty acid
