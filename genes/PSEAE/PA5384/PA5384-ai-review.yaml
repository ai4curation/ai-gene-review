suggested_questions:
- question: >-
    Which enzyme hydrolyses medium- and long-chain acylcarnitines in P. aeruginosa, given that PA5384
    is
    specific for short chains while C10-C16 acylcarnitines still support growth?
suggested_experiments:
- description: >-
    Determine steady-state kinetics of purified PA5384 across C2-C16 acylcarnitines and mutate the
    predicted catalytic serine (GDXG motif) to confirm the active site.
