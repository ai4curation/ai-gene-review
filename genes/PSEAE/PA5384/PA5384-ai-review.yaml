core_functions:
- description: >-
    L-enantiomer-specific short-chain acylcarnitine hydrolase that releases carnitine and acetate or
    butyrate from acetyl- and butyrylcarnitine, enabling use of short-chain acylcarnitines as carbon and
    nitrogen sources via the Cdh carnitine catabolic pathway.
  supported_by:
  - reference_id: PMID:23524670
    supporting_text: >-
      we have characterized PA5384 as an l-enantiomer-specific short-chain acylcarnitine hydrolase that
      is required for growth and hydrolysis of acetyl- and butyrylcarnitine to carnitine and the
      respective short-chain fatty acid
