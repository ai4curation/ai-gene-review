taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  OhrR (PA2849) is the organic hydroperoxide-sensing transcriptional repressor of Pseudomonas aeruginosa,
  a 151-residue MarR/OhrR-family protein with a winged-helix DNA-binding region. It binds the operators
  of the thiol peroxidase gene ohr (PA2850) and of its own gene and represses their transcription. Oxidation
  of OhrR by an organic hydroperoxide changes its structure so that it releases the operators, which induces
  ohr and ohrR expression; the regulator therefore couples organic hydroperoxide sensing to the peroxide-detoxifying
  response. An ohrR mutant is more resistant to organic hydroperoxides, consistent with de-repressed ohr,
  and is attenuated in the Caenorhabditis elegans infection model.
