- id: PMID:20139188
  title: >-
    Analyses of the regulatory mechanism and physiological roles of Pseudomonas aeruginosa OhrR, a transcription
    regulator and a sensor of organic hydroperoxides.
  findings:
  - statement: OhrR binds the ohr and ohrR operators and represses their transcription.
    supporting_text: OhrR binds directly to the operators and represses transcription of these genes
  - statement: >-
      Organic hydroperoxide oxidises OhrR, which loses operator binding and allows target gene expression.
    supporting_text: >-
      Exposure to an organic hydroperoxide leads to oxidation of OhrR and to subsequent structural changes
      that result in the loss of the repressor's ability to bind to the operators that allow expression
      of the target genes
  - statement: >-
      An ohrR mutant is more resistant to organic hydroperoxides and shows reduced virulence in C. elegans.
    supporting_text: >-
      ohrR and ohr mutants show increased and decreased resistance to organic hydroproxides, respectively,
      compared to a parental strain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "Abstract read (the PMC record PMC2849439 returns no body text through the PubMed MCP).\n\
      \   The abstract states operator binding, repression, redox-dependent release and the mutant phenotypes,\n\
      \   which covers every annotation keyed to it by PseudoCAP and CollecTF."
