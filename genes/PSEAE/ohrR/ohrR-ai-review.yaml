suggested_questions:
- question: >-
    Which cysteine chemistry does P. aeruginosa OhrR use: the one-cysteine sulfenamide route of B. subtilis
    OhrR, or a two-cysteine disulfide switch as in Xanthomonas OhrR?
suggested_experiments:
- description: >-
    Mass spectrometry and cysteine-substitution analysis of purified OhrR after tert-butyl hydroperoxide
    treatment, with operator-binding assays, to define the redox switch.
knowledge_gaps:
- gap_statement: >-
    The oxidation chemistry that switches P. aeruginosa OhrR off its operators, and whether a low-molecular-weight
    thiol partner is involved, is undetermined.
  boundary: >-
    It is established that organic hydroperoxide exposure oxidises OhrR and abolishes operator binding,
    and that the protein belongs to the one-cysteine/two-cysteine OhrR subfamily.
  gap_kind:
  - BIOLOGY
