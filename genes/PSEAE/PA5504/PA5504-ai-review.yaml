suggested_questions:
- question: >-
    Does the PA5502-PA5504 MetNIQ-type system import methionine, histidine or
    both, and is the histidine growth defect of the PA5504 mutant due to
    transport?
suggested_experiments:
- description: >-
    Measure uptake of radiolabelled L-methionine, D-methionine and L-histidine
    in a clean PA5504 deletion and its complemented strain, and test growth on
    D-methionine as sole sulfur or carbon source.
