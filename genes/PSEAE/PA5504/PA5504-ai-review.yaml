      PseudoCAP source for the IMP GO:1903810 row, seed of PTN000765163. Full
      text read. The evidence is a reduced (C+/-, not abolished) growth of a
      Mini-Tn5 mutant on L-histidine in Biolog and plate assays; there is no
      uptake assay, histidine did not induce the gene, and the authors note a
      separate histidine porin. Table 2 itself labels PA5504 a D-methionine ABC
      transporter membrane protein.
