- term:
    id: GO:1903810
    label: L-histidine import across plasma membrane
  evidence_type: IMP
  original_reference_id: PMID:18833300
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP seed row for PTN000765163 (node term GO:0006865 amino acid
      transport). The only evidence is a partial growth defect of a transposon
      mutant on L-histidine; there is no uptake assay and histidine did not
      induce the gene. Seed verdict OVER-SPECIFIC.
    action: UNDECIDED
    reason: >-
      The growth defect supports a role in amino acid utilization, and so the
      node-level term, but does not establish histidine as the transported
      substrate. It conflicts with the MetI-family assignment and could be
      indirect (for example a polar or fitness effect in a Biolog well). Until
      histidine uptake is measured the substrate-specific claim can be neither
      accepted nor removed.
    supported_by:
    - reference_id: PMID:18833300
      supporting_text: A PA5504 knockout affected growth on L-histidine as a carbon source
        (Table 2), however its expression was not induced by this compound.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:1903810
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        The PseudoCAP IMP GO:1903810 L-histidine import across plasma membrane
        row on PA5504 rests on a reduced (C+/-) growth of a Mini-Tn5 mutant on
        L-histidine in Johnson et al. 2008 (PMID:18833300), with no uptake
        assay and no induction by histidine. PA5504 is a MetI-family permease
        (NCBIfam metI) next to MetN2. Please consider either a less specific
        term (GO:0003333 amino acid transmembrane transport) or keeping the row
        with a note; SUSPECTED because a growth phenotype on a substrate is an
        accepted, if indirect, basis for transport annotation.
      supported_by:
      - reference_id: PMID:18833300
        supporting_text: A PA5504 knockout affected growth on L-histidine as a carbon source
          (Table 2), however its expression was not induced by this compound.
      report_status: NOT_REPORTED
