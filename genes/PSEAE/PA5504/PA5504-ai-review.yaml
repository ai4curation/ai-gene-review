  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5504 is the five-helix permease (MetI-like, binding protein-dependent
  transport system permease) subunit of an ATP-binding cassette amino acid
  importer in the inner membrane of Pseudomonas aeruginosa PAO1. It is encoded
  next to the ATPase MetN2 (PA5503) and the lipoprotein PA5502, and is a close
  homologue of Escherichia coli MetI, the permease of the MetNIQ L- and
  D-methionine importer, so it most likely forms the translocation channel of a
  methionine uptake system. A transposon mutant grew less well on L-histidine
  as carbon source in a high-throughput screen, but substrate specificity has
  not been tested by uptake assays.
