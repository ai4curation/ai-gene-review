  - statement: PA5504 is the membrane component of a predicted two-gene ABC amino acid transporter operon.
    supporting_text: PA5504 encodes a predicted membrane component of an ABC amino acid
      transporter, and is encoded in a putative two gene operon along with an ATP-binding
      component gene.
  reference_review:
