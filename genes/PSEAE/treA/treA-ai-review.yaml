- id: PMID:2820965
  title: >-
    Trehalase of Escherichia coli. Mapping and cloning of its structural gene and identification
    of the enzyme as a periplasmic protein induced under high osmolarity growth conditions.
  findings:
  - statement: >-
      The mutant whose phenotype the IMP code refers to is an Escherichia coli strain, identified
      by its position on the E. coli genetic map.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The Tn10 insertion was mapped at 26 min on the E. coli linkage map and was 3%
      cotransducible with trp, in the order treA::Tn10, trp, cys.
  - statement: >-
      The enzyme was purified from the periplasmic fraction and shown to carry the whole of the
      trehalase activity, which is why the E. coli protein is the family's reference member.
    reference_section_type: ABSTRACT
    supporting_text: >-
      This protein was purified by ammonium sulfate precipitation and DEAE-Sepharose ion-exchange
      chromatography and contained all the trehalase activity.
  - statement: >-
      The osmotic observation in this paper is about regulation of the gene, not about the enzyme
      taking part in an osmotic response: activity rises when the medium is made hyperosmotic and
      does not rise in response to the substrate.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Trehalase activity in MC4100 was not induced by growth in the presence of trehalose but
      increased by about 10-fold when 0.6 M sucrose was added to minimal growth medium.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Boos, Ehmann, Bremer, Middendorf & Postma 1987, J Biol Chem). A sound and
      important paper, correctly identified, and it does support the trehalase claim — for
      E. coli. Marked VERIFIED rather than MISCITED because the fault is not in the citation but
      in the evidence code attached to it, which is filed separately as a source defect: the
      paper cannot carry an IMP on a P. aeruginosa locus, since the mutants are named
      E. coli strains mapped on the E. coli linkage map, and the paper predates the PAO1 genome by
      thirteen years, so PA2416 did not exist as an identifier when it was written. What the
      paper does support for this gene is orthology-based, which is ISS. Abstract-only in the
      cache, but the organism and the date are not things the full text could change.
