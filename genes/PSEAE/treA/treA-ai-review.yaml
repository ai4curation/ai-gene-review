- term:
    id: GO:0071474
    label: cellular hyperosmotic response
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR023720
  review:
    summary: >-
      InterPro2GO mapping from the periplasmic-trehalase entry, carrying across the observation
      that the E. coli enzyme is osmotically induced.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Over-annotation, but for a narrower reason than an earlier version of this review gave. That
      version argued the mapping confuses being regulated by a condition with taking part in the
      response to it, and concluded that "nothing in the mapping identifies a step of osmotic
      adaptation that this protein carries out; if anything it destroys periplasmic trehalose
      rather than accumulating it". PMID:1825082 contradicts that conclusion: an E. coli treA null
      accumulates trehalose extracellularly specifically under osmotic stress, and the authors
      read wild-type behaviour as a futile cycle by which the stressed cell sets its cytoplasmic
      trehalose level through overproduction, excretion and periplasmic degradation to glucose
      that is then reused. Degrading the excreted pool is a limb of that mechanism, so the term is
      earned by the characterised E. coli enzyme rather than being a category error. What is
      unjustified is propagating it to all 472 proteins the entry matches, because the osmotic part
      of the story lives in the circuitry around the enzyme - an osmotically regulated promoter,
      OtsAB-type trehalose synthesis, trehalose excretion - and none of that is what a trehalase
      signature detects. For P. aeruginosa the architecture is at least plausible, since PAO1
      accumulates trehalose under osmotic stress alongside glutamate and
      N-acetylglutaminylglutamine amide (PMID:8434912), but neither osmotic induction of this gene
      nor any treA phenotype has been measured in this organism, so the claim is not established
      here. That paper is cited here as a plausibility argument and deliberately not in
      supported_by: an osmolyte inventory does not show that this periplasmic enzyme acts on the
      osmolyte or is induced with it, which is what this row would need.
    supported_by:
    - reference_id: file:PSEAE/treA/treA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Provides the cells with the ability to utilize trehalose at
        high osmolarity by splitting it into glucose molecules that can
        subsequently be taken up by the phosphotransferase-mediated uptake
        system.
