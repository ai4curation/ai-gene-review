    summary: >-
      Propagation from PTN004635776, the node where the trehalase activity of glycoside hydrolase
      family 37 sits. This is the review's primary molecular function claim.
    action: ACCEPT
    reason: >-
      The donor list is entirely eukaryotic, which is not a weakness: GH37 trehalases span
      bacteria and eukaryotes, the test is whether the target is inside the clade that inherited
      the function, and PA2416 is. It carries both trehalase PROSITE patterns (PS00927, PS00928),
      the curated NCBIfam treA models, and the periplasmic-trehalase InterPro entry, and the
      HAMAP rule behind its Swiss-Prot entry places two active sites and seven substrate-binding
      residues. Nothing on the gene argues for divergence or loss. Accepted as core.
