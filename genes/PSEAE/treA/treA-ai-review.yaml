id: Q9I165
gene_symbol: treA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  TreA (PA2416) is the periplasmic trehalase of Pseudomonas aeruginosa, a glycoside hydrolase
  family 37 enzyme made with a cleavable signal peptide and exported to the periplasm. It
  hydrolyses the non-reducing disaccharide alpha,alpha-trehalose into two molecules of glucose,
  which the cell then takes up through its own sugar transport systems. Because the hydrolysis
  happens outside the cytoplasmic membrane, the enzyme lets the organism use environmental
  trehalose as a carbon source without needing a transporter for the disaccharide itself. The
  characterised member of this family is the Escherichia coli enzyme, which is strongly induced
  at high osmolarity; the P. aeruginosa protein has not been assayed, and its assignment rests on
  curated family rules and two trehalase sequence patterns.
