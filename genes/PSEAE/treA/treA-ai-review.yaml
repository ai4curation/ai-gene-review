- term:
    id: GO:0071474
    label: cellular hyperosmotic response
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR023720
  review:
    summary: >-
      InterPro2GO mapping from the periplasmic-trehalase entry, carrying across the observation
      that the E. coli enzyme is osmotically induced.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The observation behind the mapping is about regulation of the gene, not about what the
      protein does. In the source paper, trehalase activity "was not induced by growth in the
      presence of trehalose but increased by about 10-fold when 0.6 M sucrose was added" — the
      enzyme responds to osmolarity, which is the opposite of taking part in the response to it.
      The curated rule states the function plainly as a nutritional one exercised under those
      conditions: it "provides the cells with the ability to utilize trehalose at high
      osmolarity". Nothing in the mapping identifies a step of osmotic adaptation that this
      protein carries out; if anything it destroys periplasmic trehalose rather than accumulating
      it. Marked over-annotated rather than removed, because high osmolarity is genuinely the
      condition under which the enzyme matters, and because no P. aeruginosa data exist either
      way.
    supported_by:
    - reference_id: file:PSEAE/treA/treA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Provides the cells with the ability to utilize trehalose at
        high osmolarity by splitting it into glucose molecules that can
        subsequently be taken up by the phosphotransferase-mediated uptake
        system.
    - reference_id: PMID:2820965
      reference_section_type: ABSTRACT
      supporting_text: >-
        Trehalase activity in MC4100 was not induced by growth in the presence of trehalose but
        increased by about 10-fold when 0.6 M sucrose was added to minimal growth medium.
core_functions:
- description: >-
    Periplasmic alpha,alpha-trehalase: hydrolyses environmental trehalose to glucose outside the
    cytoplasmic membrane, so that the cell can use the disaccharide as a carbon source through its
    existing glucose uptake systems rather than having to transport trehalose itself.
  molecular_function:
    id: GO:0004555
    label: alpha,alpha-trehalase activity
  directly_involved_in:
  - id: GO:0005993
    label: trehalose catabolic process
  locations:
  - id: GO:0042597
    label: periplasmic space
  supported_by:
  - reference_id: file:PSEAE/treA/treA-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: 'DR   InterPro; IPR023720; Trehalase_periplasmic.'
  - reference_id: file:PSEAE/treA/treA-uniprot.txt
    record_section: ["DR:PROSITE"]
    supporting_text: 'DR   PROSITE; PS00928; TREHALASE_2; 1.'
  knowledge_gaps:
  - gap_statement: >-
      Whether the P. aeruginosa enzyme is osmotically regulated as the E. coli one is, or regulated
      at all, is unknown. The whole osmotic framing of this family comes from E. coli, and
      P. aeruginosa occupies different environments; the answer decides whether GO:0071474 is
      over-annotated here or merely untested.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      It is not known whether P. aeruginosa can grow on trehalose as a sole carbon source, nor
      what transports the glucose that TreA releases into the periplasm. The enzyme's usefulness
      depends on both, and neither has been reported for this organism.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Can P. aeruginosa use trehalose as a sole carbon source, and does a treA deletion abolish
    that? This is the experiment the existing IMP row implies has been done, and it has not been
    done in this organism.
- question: >-
    Is PA2416 osmotically induced? The E. coli enzyme rises tenfold in 0.6 M sucrose, and whether
    the regulation is conserved determines how the hyperosmotic-response annotation should read.
- question: >-
    Trehalose is also an osmoprotectant that bacteria accumulate. Does P. aeruginosa synthesise
    trehalose, and if so, is a periplasmic trehalase in tension with that, or are the two pools
    kept separate by the inner membrane?
suggested_experiments:
- description: >-
    Construct a clean PA2416 deletion and test growth on trehalose as sole carbon source against
    the wild type, with complementation. This would replace an orthology-based claim with a
    measurement in the organism, and would settle the evidence-code defect reported here.
- description: >-
    Purify the mature protein after signal-peptide cleavage and measure activity against
    alpha,alpha-trehalose and trehalose 6-phosphate, to confirm which of the two reactions the
    enzyme catalyses and so whether the specific or the general GO term is the right one on
    direct evidence.
- description: >-
    Fractionate P. aeruginosa grown at normal and high osmolarity and assay periplasmic trehalase
    activity, to test whether the E. coli regulatory pattern holds here.
