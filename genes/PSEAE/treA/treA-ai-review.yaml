- id: PMID:2820965
  title: >-
    Trehalase of Escherichia coli. Mapping and cloning of its structural gene and identification
    of the enzyme as a periplasmic protein induced under high osmolarity growth conditions.
  findings:
  - statement: >-
      The mutant whose phenotype the IMP code refers to is an Escherichia coli strain, identified
      by its position on the E. coli genetic map.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The Tn10 insertion was mapped at 26 min on the E. coli linkage map and was 3%
      cotransducible with trp, in the order treA::Tn10, trp, cys.
  - statement: >-
      The enzyme was purified from the periplasmic fraction and shown to carry the whole of the
      trehalase activity, which is why the E. coli protein is the family's reference member.
    reference_section_type: ABSTRACT
    supporting_text: >-
      This protein was purified by ammonium sulfate precipitation and DEAE-Sepharose ion-exchange
      chromatography and contained all the trehalase activity.
  - statement: >-
      The osmotic observation in this paper is about regulation of the gene, not about the enzyme
      taking part in an osmotic response: activity rises when the medium is made hyperosmotic and
      does not rise in response to the substrate.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Trehalase activity in MC4100 was not induced by growth in the presence of trehalose but
      increased by about 10-fold when 0.6 M sucrose was added to minimal growth medium.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:1825082
      review_notes: >-
        The measurement stands; the inference drawn from it in this statement does not. Boos et al.
        do show osmotic induction and no substrate induction, and that part is not in question.
        What is disputed is the second half - that the enzyme therefore takes no part in an osmotic
        response. PMID:1825082 shows an E. coli treA null accumulating trehalose extracellularly
        under osmotic stress and reads the wild type as running a futile cycle that sets the
        cytoplasmic trehalose level, which makes periplasmic degradation a limb of an
        osmotic-stress mechanism rather than merely a process switched on by one. DISPUTED rather
        than OVERTURNED because the enzyme still performs no osmoprotective step itself: the
        protectant is cytoplasmic trehalose, and the trehalase acts on what leaves the cell. The
        GO:0071474 row stays MARK_AS_OVER_ANNOTATED, now on the ground that the osmotic context is
        a property of the regulatory circuit and is unmeasured in P. aeruginosa, rather than on the
        ground that no such context exists.
      supported_by:
      - reference_id: PMID:1825082
        reference_section_type: ABSTRACT
        supporting_text: 'treA mutants with a defective periplasmic trehalase accumulated trehalose extracellularly under osmotic stress.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Boos, Ehmann, Bremer, Middendorf & Postma 1987, J Biol Chem). A sound and
      important paper, correctly identified, and it does support the trehalase claim — for
      E. coli. Marked VERIFIED rather than MISCITED because the fault is not in the citation but
      in the evidence code attached to it, which is filed separately as a source defect: the
      paper cannot carry an IMP on a P. aeruginosa locus, since the mutants are named
      E. coli strains mapped on the E. coli linkage map, and the paper predates the PAO1 genome by
      thirteen years, so PA2416 did not exist as an identifier when it was written. What the
      paper does support for this gene is orthology-based, which is ISS. Abstract-only in the
      cache, but the organism and the date are not things the full text could change.
- id: PMID:1825082
  title: >-
    Synthesis, accumulation, and excretion of trehalose in osmotically stressed Escherichia coli
    K-12 strains: influence of amber suppressors and function of the periplasmic trehalase.
  findings:
  - statement: >-
      Loss of the periplasmic trehalase has a phenotype that appears only under osmotic stress:
      the excreted trehalose the wild type would have degraded accumulates outside the cell.
    reference_section_type: ABSTRACT
    supporting_text: 'treA mutants with a defective periplasmic trehalase accumulated trehalose extracellularly under osmotic stress.'
  - statement: >-
      The authors' interpretation makes periplasmic trehalase part of how a stressed cell sets its
      cytoplasmic trehalose level, rather than an enzyme merely switched on by osmolarity.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Thus, stressed E. coli cells regulate the cytoplasmic level of trehalose by a futile
      cycle involving overproduction, excretion, and degradation to glucose, which is
      reutilized.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Styrvold & Strom 1991, J Bacteriol, DOI 10.1128/jb.173.3.1187-1192.1991).
      Relevant to this gene only through the E. coli ortholog, which is why relevance is MEDIUM
      rather than HIGH: no P. aeruginosa work is reported here. Cited because it is the evidence
      that disputes this review's own earlier reasoning about GO:0071474, not because it supports
      an annotation on this gene. Abstract-only in the cache; the two claims used are both stated
      in the abstract, and the futile-cycle sentence is the authors' own summary of their result.
- id: PMID:8391102
  title: >-
    Trehalose metabolism in Escherichia coli: stress protection and stress regulation of gene
    expression.
  findings:
  - statement: >-
      The compartmental split is explicit: trehalose the cell makes itself is the protectant,
      while trehalose supplied from outside is food. The periplasmic trehalase acts on the latter.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Externally supplied trehalose does not serve as a stress protectant, but it can
      be utilized as the sole source of carbon and energy.
  - statement: >-
      Osmolarity selects which catabolic route the cell uses for trehalose, with the periplasmic
      trehalase serving the high-osmolarity route and a PTS-based system serving the unstressed one.
    reference_section_type: ABSTRACT
    supporting_text: >-
      In the absence of osmotic stress, trehalose
      induces the formation of an enzyme IITre (TreB) of the group translocation
      system, a catabolic trehalose-6-phosphate phosphatase (TreE), and an
      amylotrehalase (TreC) which converts trehalose to free glucose and a glucose
      polymer.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Strom & Kaasen 1993, Mol Microbiol, DOI
      10.1111/j.1365-2958.1993.tb01564.x). A review article, so it is used here for the
      compartmental framing and the route-selection logic that its primary literature establishes,
      not as primary evidence for any annotation on this gene. Abstract-only in the cache.
- id: PMID:8434912
  title: >-
    Roles of N-acetylglutaminylglutamine amide and glycine betaine in adaptation of Pseudomonas
    aeruginosa to osmotic stress.
  findings:
  - statement: >-
      P. aeruginosa PAO1 does accumulate trehalose as one of its osmolytes under osmotic stress,
      so the substrate pool the futile-cycle model needs is present in this organism - though the
      cycle itself, and any osmotic induction of this gene, remain unmeasured here.
    reference_section_type: ABSTRACT
    supporting_text: >-
      osmotically stressed cultures were found to accumulate glutamate,
      trehalose, and N-acetylglutaminylglutamine amide, an unusual dipeptide
      previously reported only in osmotically stressed Rhizobium meliloti and
      Pseudomonas fluorescens.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (D'Souza-Ault, Smith & Smith 1993, Appl Environ Microbiol, DOI
      10.1128/aem.59.2.473-478.1993). Directly on strain PAO1, which is this entry's strain, and
      measured by natural-abundance 13C NMR. It is cited for what it does show - that trehalose is
      among PAO1's accumulated osmolytes - and deliberately not as support for the GO:0071474 row:
      an osmolyte inventory says nothing about whether this periplasmic enzyme acts on it or is
      induced with it. Abstract-only in the cache.
