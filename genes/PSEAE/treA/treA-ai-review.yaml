- term:
    id: GO:0015927
    label: trehalase activity
  evidence_type: IMP
  original_reference_id: PMID:2820965
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row citing the paper that characterised the E. coli periplasmic trehalase. The
      activity claim is right for this gene; the term is the group above the specific reaction,
      and the evidence code describes an experiment done in another organism.
    action: TOO_GENERAL
    reason: >-
      Two separate judgements, kept separate. On the term, GO:0015927 is defined as hydrolysis of
      "trehalose or a trehalose derivative" and so also covers trehalose-6-phosphate hydrolases
      (EC 3.2.1.93); OLS confirms it is an ancestor of GO:0004555, which this review accepts on
      two independent rows, so the general term adds nothing here. On the evidence, this row's
      own basis is an E. coli mutant and cannot support a deeper term for PA2416, which is why
      the action is TOO_GENERAL rather than MODIFY. The claim is not disputed and the row is not
      removed; what is wrong with it is recorded as a source defect against the evidence code.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: PSEUDOCAP
      slot: Evidence_Code
      requested_change: REPOINT
      asserted_value: IMP
      corrected_value: ISS
      cause: OVER_PROPAGATION
      confidence: CONFIRMED
      explanation: >-
        PseudoCAP annotates GO:0015927 to PA2416 (UniProtKB:Q9I165) with evidence code IMP citing
        PMID:2820965. An IMP asserts that a mutant of the annotated gene showed the phenotype, and
        that paper's mutants are Escherichia coli strains: the abstract names the treA::Tn10
        insertion as "mapped at 26 min on the E. coli linkage map", along with strains MC4100,
        PPA69 and UE5. The paper was published in 1987, thirteen years before the PAO1 genome
        defined PA2416, so it cannot be reporting a mutant of this gene. The underlying claim is
        well supported for P. aeruginosa by orthology and by curated family rules (HAMAP
        MF_01060, NCBIfam NF009774/NF009775, PROSITE PS00927 and PS00928), so the appropriate
        code is ISS with the E. coli TreA entry in WITH/FROM, not IMP. Requested change: change
        the evidence code to ISS, or replace the reference with a study of the P. aeruginosa
        enzyme if one exists.
      supported_by:
      - reference_id: PMID:2820965
        reference_section_type: ABSTRACT
        supporting_text: >-
          The Tn10 insertion was mapped at 26 min on the E. coli linkage map and was 3%
          cotransducible with trp, in the order treA::Tn10, trp, cys.
