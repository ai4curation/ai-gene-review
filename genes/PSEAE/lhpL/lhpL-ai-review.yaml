suggested_questions:
- question: >-
    Should PTN002433936's IBD be re-pointed from GO:0047580 to GO:0050346, and
    should the 35 propagated rows (including TreeGrafter transfers) be
    re-derived from the corrected node?
- question: >-
    Is there a GO term, or should one be created, for the catabolic pathway that
    converts trans-3-hydroxy-L-proline to L-proline, as a sibling of GO:0019470
    trans-4-hydroxy-L-proline catabolic process?
suggested_experiments:
- description: >-
    Delete PA1255 alone in PAO1 and test growth on trans-3-hydroxy-L-proline,
    cis-3-hydroxy-L-proline and trans-4-hydroxy-L-proline as sole carbon
    sources, with the PA1268 deletion as comparator. This would separate the
    two epimerase/dehydratase genes physiologically, which the published
    double-mutant induction assay cannot do.
