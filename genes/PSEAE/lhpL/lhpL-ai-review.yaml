gene_symbol: lhpL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  lhpL (PA1255) encodes a 344-residue bifunctional enzyme of the proline
  racemase family (Pfam PF05544; catalytic cysteine pair) that acts on
  trans-3-hydroxy-L-proline. It dehydrates trans-3-hydroxy-L-proline to
  Delta(1)-pyrroline-2-carboxylate (EC 4.2.1.77) and also 2-epimerizes it to
  cis-3-hydroxy-D-proline. It has no activity on L-proline, on the
  4-hydroxyprolines, or on D-proline, so it is not a proline racemase and not a
  4-hydroxyproline 2-epimerase; the latter activity in this organism belongs to
  a separate gene, PA1268. lhpL sits in the hydroxyproline (lhp) gene cluster of
  Pseudomonas aeruginosa PAO1, is induced by trans-4- and
  trans-3-hydroxy-L-proline as sole carbon source under the control of the AraC-family activator
  LhpR, and is thought to let the organism funnel
  trans-3-hydroxy-L-proline,
  which is released from hydroxyproline-containing peptide antibiotics and from
  collagen-derived material, into proline and so into central metabolism.
