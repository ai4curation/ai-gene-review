- id: PMID:17849014
  title: Molecular and structural discrimination of proline racemase and hydroxyproline-2-epimerase
    from nosocomial and bacterial pathogens.
  findings:
  - statement: >-
      Assayed P. aeruginosa proline-racemase-family proteins directly; the
      genuine hydroxyproline-2-epimerase (PaHyPRE) epimerizes OH-L/D-Pro,
      whereas members with substituted catalytic couples showed neither proline
      racemase nor hydroxyproline epimerase activity. Swiss-Prot cites this
      paper for the absence of t4LHyp epimerase and proline racemase activity
      in Q9I489.
    supporting_text: >-
      B. pseudomallei and P. aeruginosa recombinant proteins presented no
      measurable PRAC activity but demonstrated strong epimerization of
      OH-L/D-Pro behaving as genuine OH-Pro epimerases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. The text does not name PA1255, but Table 1
      lists Q9I489 as the P. aeruginosa Ser-Cys (SC) variant, and Figure 1
      shows that SC protein has neither proline racemase nor hydroxyproline
      epimerase activity, matching Swiss-Prot's ECO:0000269 statement.
