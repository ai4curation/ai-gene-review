      Genome-neighbourhood study of the proline racemase superfamily that
      defines the trans-3-hydroxy-L-proline dehydratase (t3HypD) activity and
      includes Q9I489 among its sequences; source of the UniProt statement that
      lhpL is induced by trans-4- and trans-3-hydroxy-L-proline.
    supporting_text: >-
      The reactions catalyzed by proline racemase (ProR), 4R-hydroxyproline
      2-epimerase (4HypE), and trans-3-hydroxy-L-proline dehydratase (t3HypD)
      and the metabolic pathways in which they participate.
  reference_review:
