core_functions:
- description: >-
    Dehydrates trans-3-hydroxy-L-proline to Delta(1)-pyrroline-2-carboxylate,
    the committed step that lets P. aeruginosa route this hydroxyproline isomer
    towards L-proline and central metabolism; the same active site also
    2-epimerizes trans-3-hydroxy-L-proline to cis-3-hydroxy-D-proline.
  molecular_function:
    id: GO:0050346
    label: trans-L-3-hydroxyproline dehydratase activity
  supported_by:
  - reference_id: PMID:27929065
    supporting_text: >-
      We herein demonstrated that PaLhpL gene (PA1255; Fig. 1d) in the
      L-hydroxyproline gene cluster encodes a bifunctional dehydratase and
      2-epimerase toward trans-3-hydroxy-L-proline as the leading candidate
  - reference_id: file:PSEAE/lhpL/lhpL-uniprot.txt
    record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
    supporting_text: >-
      KM=23 mM for the dehydration of trans-3-hydroxy-L-proline
proposed_new_terms:
- proposed_name: trans-3-hydroxy-L-proline 2-epimerase activity
  proposed_definition: >-
    Catalysis of the reaction: trans-3-hydroxy-L-proline =
    cis-3-hydroxy-D-proline.
  justification: >-
    Swiss-Prot records this reaction for Q9I489 with experimental evidence and
    an incomplete EC number (5.1.1.-), but no GO term exists for it, so half of
    the gene's curated bifunctional activity cannot be annotated. It is
    distinct from GO:0047580 (the 4-hydroxy isomer) and from GO:0018112
    proline racemase activity.
