  review:
    action: ACCEPT
    summary: Ku promotes DNA-end joining by recruiting LigD and stimulating its ligation activity.
    reason: P. aeruginosa Ku directly stimulates LigD-mediated end sealing in the reported reconstitution.
      This regulation is a core contribution of Ku to end joining and does not assign ATP-dependent ligase
      catalysis to Ku itself.
