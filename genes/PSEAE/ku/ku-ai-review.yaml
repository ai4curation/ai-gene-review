- id: PMID:20018881
  title: Gap filling activities of Pseudomonas DNA ligase D (LigD) polymerase and functional interactions
    of LigD with the DNA end-binding Ku protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full primary text: recombinant P. aeruginosa Ku/LigD, DNA gap filling with dNTPs, and
      Ku stimulation of LigD. End protection used Ku-(1–253); full-length and other truncations were separately
      tested. This is not a native PA14 or KT2440 assay.'
  full_text_unavailable: false
  findings:
  - statement: Binds broken duplex DNA ends, supports synapsis and promotes LigD-mediated end joining;
      Ku does not catalyze ATP-dependent strand ligation.
    supporting_text: Ku afforded virtually complete protection from both exonucleases
  - statement: Binds broken duplex DNA ends, supports synapsis and promotes LigD-mediated end joining;
      Ku does not catalyze ATP-dependent strand ligation.
    supporting_text: PaeKu stimulated ribonucleotide addition to DSB ends by PaePOL and DSB end sealing
      by LigD.
- id: PMID:25355514
  title: Efficient processing of abasic sites by bacterial nonhomologous end-joining Ku proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary biochemistry demonstrates Bacillus Ku AP/5′-dRP lyase and P. aeruginosa
      Ku AP lyase. PAO1 genomic cloning is explicit. Substrate specificity and covalent-intermediate controls
      support catalysis. Proposed participation in cellular BER remains a hypothesis, not a new process
      annotation.
  full_text_unavailable: false
  findings:
  - statement: Catalyzes beta-lyase cleavage at abasic DNA sites, with substrate-position dependence;
      this can assist joining of damaged DNA ends.
    supporting_text: 'The presence

      of an AP-lyase activity also in the homolog protein from the distantly related

      bacterium Pseudomonas aeruginosa'
