  label: Pseudomonas aeruginosa PAO1
description: Ku is a homodimeric bacterial DNA-end-binding protein that organizes broken double-stranded
  DNA ends and promotes LigD-dependent repair. The Pseudomonas aeruginosa PAO1 protein stimulates LigD
  polymerization and end sealing in biochemical reconstitution and also has experimentally demonstrated
  AP-lyase activity.
