suggested_questions:
- question: >-
    Is the trpC deletion a tryptophan auxotroph in minimal medium, and is its
    reduced fitness in synthetic CF sputum due to limited tryptophan there?
suggested_experiments:
- description: >-
    Grow the trpC deletion in minimal medium with and without tryptophan, and
    in SCFM supplemented with tryptophan, to separate auxotrophy from other
    fitness effects.
