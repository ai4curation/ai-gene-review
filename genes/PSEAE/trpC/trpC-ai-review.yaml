id: P20577
gene_symbol: trpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  TrpC (PA0651) is the monofunctional indole-3-glycerol phosphate synthase (IGPS,
  EC 4.1.1.48) of Pseudomonas aeruginosa. It catalyses the ring-closing
  decarboxylation of 1-(2-carboxyphenylamino)-1-deoxy-D-ribulose 5-phosphate to
  indole-3-glycerol phosphate, CO2 and water, a step of L-tryptophan
  biosynthesis from chorismate. The purified enzyme is active over a broad pH
  range and has the highest turnover number reported for an IGPS (kcat about 11
  per second). Deleting trpC reduces the fitness of PAO1 in synthetic cystic
  fibrosis sputum medium.
references:
- id: PMID:22555873
  title: Characterization of the indole-3-glycerol phosphate synthase from Pseudomonas
    aeruginosa PAO1.
  findings:
  - statement: Purified PaIGPS is active, with the highest turnover number of any characterised
      IGPS.
    supporting_text: has the highest turnover number of any characterized IGPS (k (cat)
      = 11.1 ± 0.1 s(-1))
  - statement: trpC deletion reduces fitness in synthetic CF sputum.
    supporting_text: deleting the gene for PaIGPS reduces the fitness of P. aeruginosa
      strain PAO1 in synthetic cystic fibrosis sputum
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IDA (GO:0004425) and IMP (GO:0000162) rows,
      both of which seed PTN000523336 IBDs. Abstract only (no PMC full text).
      The enzyme assay directly supports both terms; the mutant phenotype in
      the abstract is a sputum-medium fitness defect.
