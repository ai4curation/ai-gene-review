- id: PMID:12081945
  title: >-
    Functional analysis and regulation of the divergent spuABCDEFGH-spuI operons for polyamine
    uptake and utilization in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: >-
      The enzyme's amino acceptor was determined by assay, not inferred: SpuC transaminates
      putrescine using pyruvate, which fixes the reaction as EC 2.6.1.113 rather than the
      2-oxoglutarate-dependent one.
    reference_section_type: ABSTRACT
    supporting_text: >-
      enzymatic measurements indicated that spuC encodes putrescine aminotransferase with
      pyruvate as the amino group receptor
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Lu, Itoh, Nakada & Jiang 2002, J Bacteriol; full text cached via
      PMC135167). This is the gene's primary characterisation and the source UniProt uses for the
      EC number and the catalytic-activity statement, although GOA carries no row citing it. It is
      added to this review because it, rather than either of the two annotated references, is what
      establishes the specific reaction that the proposed new term names.
- id: PMID:18192388
  title: Transcriptome analysis of agmatine and putrescine catabolism in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: >-
      SpuC is named as the organism's principal putrescine-pyruvate transaminase, and is placed
      in the alanine-pyruvate cycle that the pyruvate-dependent reaction necessitates.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The newly identified dadRAX locus encoding the regulator alanine transaminase and racemase
      coupled with SpuC, the major putrescine-pyruvate transaminase, were key components to
      maintaining alanine homeostasis.
  - statement: >-
      Loss of these components cripples growth on polyamines, which is the phenotype behind the
      putrescine catabolism annotation.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Corresponding mutant strains were severely hampered in polyamine utilization.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Chou, Kwon, Hegazy & Lu 2008, J Bacteriol). Abstract-only in the cache, but
      the abstract names SpuC explicitly, gives its reaction in the gene's own terms, and states
      the mutant phenotype, so the GO:0009447 row it supports can be checked without the full
      text. UniProt cites the same paper with ECO:0000269 on the function statement.
- id: PMID:21622750
  title: >-
    Functional characterization of seven γ-Glutamylpolyamine synthetase genes and the bauRABCD
    locus for polyamine and β-Alanine utilization in Pseudomonas aeruginosa PAO1.
  findings:
  - statement: >-
      The paper's subject is the gamma-glutamylation route to GABA and its regulator, which is the
      alternative to the transaminase route SpuC works in; spuC is not named anywhere in the
      abstract.
    reference_section_type: ABSTRACT
    supporting_text: >-
      In summary, the present study support that the γ-glutamylation pathway for polyamine
      utilization is evolutionarily conserved in E. coli and Pseudomonas spp. and is further
      expanded in Pseudomonas to accommodate a more diverse metabolic capacity in this group of
      microorganisms.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified (Yao, He & Lu 2011, J Bacteriol) as a real and relevant paper on polyamine
      catabolism in this organism, but its connection to spuC cannot be checked: the abstract
      concerns pauA1-pauA6, pauB, pauC, pauD and bauRABCD and never mentions spuC, and the full
      text is not cached. Marked UNVERIFIED rather than MISCITED, because a study of polyamine
      catabolism could legitimately assay or use a spuC strain in text we cannot see. The
      consequence for this review is that nothing here rests on the row it supports.
- id: file:PSEAE/spuC/spuC-uniprot.txt
  title: UniProt entry Q9I6J2 (SPUC_PSEAE)
  findings:
  - statement: >-
      The record's INDUCTION line names agmatine as an inducer, which the publication it cites
      for that statement explicitly rules out.
    record_section: ["CC:INDUCTION"]
    supporting_text: >-
      By putrescine and agmatine. Also regulated by the global
      CbrA/CbrB two-component system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The reviewed Swiss-Prot record, and the source of the EC number, catalytic activity,
      pathway and disruption phenotype used here, all tied to PubMed:12081945 with ECO:0000269.
      One statement in it is wrong and is filed below: the INDUCTION line contradicts the paper
      it cites.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9I6J2
      slot: CC INDUCTION
      requested_change: REPOINT
      asserted_value: By putrescine and agmatine.
      corrected_value: By putrescine and spermidine.
      confidence: CONFIRMED
      explanation: >-
        The INDUCTION line of UniProtKB:Q9I6J2 reads "By putrescine and agmatine. Also regulated
        by the global CbrA/CbrB two-component system." with evidence ECO:0000269|PubMed:12081945.
        That paper reaches the opposite conclusion about agmatine, and says so in its abstract:
        "Since the observed induction effect of agmatine was abolished in an aguA mutant where
        conversion of agmatine into putrescine was blocked, putrescine or spermidine, but not
        agmatine, serves as the inducer molecule of the spuA-spuI divergent promoters." The
        agmatine effect is indirect, mediated by its conversion to putrescine, and the paper
        identifies spermidine as the second genuine inducer. The line appears to have been
        written from the experiments rather than from the authors' interpretation of them.
        Requested change: replace "By putrescine and agmatine" with "By putrescine and
        spermidine", optionally noting that agmatine induces indirectly through conversion to
        putrescine.
      supported_by:
      - reference_id: PMID:12081945
        reference_section_type: ABSTRACT
        supporting_text: >-
          Since the observed induction effect of agmatine was abolished in an aguA mutant where
          conversion of agmatine into putrescine was blocked, putrescine or spermidine, but not
          agmatine, serves as the inducer molecule of the spuA-spuI divergent promoters.
