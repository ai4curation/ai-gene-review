  review:
    summary: >-
      Propagation of the BioA reaction from PTN000241343. The donors are genuine BioA enzymes;
      the target is a characterised putrescine transaminase, and the organism's real BioA is a
      different gene that already carries this term.
    action: REMOVE
    reason: >-
      The argument is about whether this leaf belongs inside the clade that inherited the BioA
      function, and two independent checks say it does not. First, there is target-specific
      evidence of a different activity, which is the sanctioned ground for disputing an IBA: SpuC
      is a reviewed entry with EC 2.6.1.113 assigned from enzymatic measurement, a function
      statement carrying ECO:0000269 from two publications, a disruption phenotype, a pathway
      assignment to putrescine degradation, and four crystal structures. Second, the comparator
      check points the other way from a gap: P. aeruginosa has its own bioA, PA0420
      (UniProtKB:Q9I693, "Adenosylmethionine-8-amino-7-oxononanoate aminotransferase"), and
      QuickGO returns GO:0004015 on it by IBA from this same GO_REF. The biotin function is
      therefore already annotated where it belongs, and its presence on SpuC is a second copy on
      the wrong family member. What the two genes share is the class-III
      pyridoxal-phosphate-dependent aminotransferase fold, which is a large family whose members
      differ precisely in their amine donor and keto acceptor, so membership predicts the
      chemistry and not the substrate.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
