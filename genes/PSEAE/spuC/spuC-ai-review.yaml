proposed_new_terms:
- proposed_name: putrescine--pyruvate aminotransferase activity
  proposed_definition: >-
    Catalysis of the reaction: putrescine + pyruvate = 4-aminobutanal + L-alanine.
  proposed_parent:
    id: GO:0008483
    label: transaminase activity
  justification: >-
    GO has no term for EC 2.6.1.113, the pyruvate-dependent putrescine aminotransferase reaction,
    although the enzyme is characterised, has an EC number, a Rhea reaction (RHEA:30707) and
    solved structures. The only putrescine transaminase term in GO, GO:0033094, is the
    2-oxoglutarate-dependent reaction (EC 2.6.1.82) and is not a substitute: the two differ in
    both acceptor and product, and the difference has a documented physiological consequence.
    Because the pyruvate route makes L-alanine at every turnover, putrescine utilisation in
    P. aeruginosa depends on an alanine-pyruvate cycle and on the dadRAX alanine transaminase and
    racemase, a coupling that the glutamate-producing reaction does not create. Annotating SpuC to
    GO:0033094 would assert the wrong chemistry; annotating it only to GO:0008483 loses the
    distinction that the biology turns on.
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: EC:2.6.1.113
      label: putrescine--pyruvate transaminase
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:30707
      label: putrescine + pyruvate = 4-aminobutanal + L-alanine
  supported_by:
  - reference_id: PMID:12081945
    reference_section_type: ABSTRACT
    supporting_text: >-
      enzymatic measurements indicated that spuC encodes putrescine aminotransferase with
      pyruvate as the amino group receptor
  - reference_id: PMID:18192388
    reference_section_type: ABSTRACT
    supporting_text: >-
      The newly identified dadRAX locus encoding the regulator alanine transaminase and racemase
      coupled with SpuC, the major putrescine-pyruvate transaminase, were key components to
      maintaining alanine homeostasis.
core_functions:
- description: >-
    First committed enzyme of the transaminase route of putrescine catabolism: transfers the amino
    group of putrescine to pyruvate, giving 4-aminobutanal and L-alanine, and so both feeds
    putrescine carbon toward 4-aminobutyrate and succinate and ties polyamine utilisation to the
    cell's alanine-pyruvate cycle. The transfer proceeds through a pyridoxal-5'-phosphate Schiff
    base, as in every class-III aminotransferase, so the cofactor binding the review accepts
    separately is part of this mechanism rather than an accessory property.
  proposed_molecular_function: putrescine--pyruvate aminotransferase activity
  directly_involved_in:
  - id: GO:0009447
    label: putrescine catabolic process
  supported_by:
  - reference_id: PMID:12081945
    reference_section_type: ABSTRACT
    supporting_text: >-
      enzymatic measurements indicated that spuC encodes putrescine aminotransferase with
      pyruvate as the amino group receptor
  - reference_id: file:PSEAE/spuC/spuC-uniprot.txt
    record_section: ["CC:PATHWAY"]
    supporting_text: |-
      Amine and polyamine degradation; putrescine degradation; 4-
      aminobutanal from putrescine (transaminase route).
suggested_questions:
- question: >-
    Why has P. aeruginosa chosen pyruvate over 2-oxoglutarate as the amino acceptor, when the
    2-oxoglutarate route is the common bacterial one? The choice obliges the cell to run an
    alanine-pyruvate cycle to recycle the product, which looks like a cost rather than a saving.
- question: >-
    SpuC is called "the major" putrescine-pyruvate transaminase. Which enzyme is the minor one,
    and does it use the same acceptor? P. aeruginosa also has the gamma-glutamylation route to
    GABA, so the division of labour between three ways of consuming putrescine is not settled.
- question: >-
    Four crystal structures of SpuC have been deposited. Do they show how the active site selects
    pyruvate over 2-oxoglutarate, and is that selectivity transferable to the many class-III
    aminotransferases of unknown specificity?
suggested_experiments:
- description: >-
    Measure the specificity of purified SpuC against pyruvate and 2-oxoglutarate side by side,
    with putrescine, cadaverine and spermidine as donors, to establish how exclusive the reaction
    is and whether the enzyme is the entry point for polyamines other than putrescine.
- description: >-
    Compare growth on putrescine of a spuC deletion with that of a dadA or dadX mutant that cannot
    recycle alanine, to test directly whether the alanine-pyruvate cycle is required because of
    SpuC's choice of acceptor rather than for an independent reason.
- description: >-
    Use the deposited structures to identify the residues that contact the keto acceptor and swap
    them for the corresponding residues of a 2-oxoglutarate-dependent class-III aminotransferase,
    then assay the acceptor preference of the variant.
