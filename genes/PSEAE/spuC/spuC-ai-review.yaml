id: Q9I6J2
gene_symbol: spuC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  SpuC (PA0299) is the putrescine--pyruvate aminotransferase of Pseudomonas aeruginosa, a
  class-III pyridoxal-phosphate-dependent enzyme encoded in the spuABCDEFGH operon for polyamine
  uptake and utilisation. It transfers the amino group of putrescine to pyruvate, yielding
  4-aminobutanal and L-alanine, and so performs the first committed step of the transaminase route
  by which the organism converts putrescine to 4-aminobutyrate and then to succinate for the TCA
  cycle. The choice of pyruvate rather than 2-oxoglutarate as acceptor is what makes this enzyme
  distinctive: because every turnover makes alanine, putrescine utilisation in this organism
  depends on an alanine-pyruvate cycle and on the alanine transaminase and racemase that recycle
  it. The gene is induced by putrescine and spermidine, and cells lacking it cannot grow on
  putrescine as sole carbon and nitrogen source.
