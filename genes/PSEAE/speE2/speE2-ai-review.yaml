suggested_questions:
- question: >-
    Does P. aeruginosa SpeE2 have any thermospermine or spermine synthase side activity, or
    is it strictly a putrescine aminopropyltransferase as its HAMAP assignment implies?
suggested_experiments:
- description: >-
    Assay purified SpeE2 with putrescine, spermidine and other amine acceptors and decarboxy-AdoMet
    to determine whether it makes spermidine only or also longer polyamines such as thermospermine.
