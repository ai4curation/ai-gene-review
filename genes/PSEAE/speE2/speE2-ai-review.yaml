  label: Pseudomonas aeruginosa PAO1
description: >-
  SpeE2 (polyamine aminopropyltransferase 2, PA4774) is a spermidine synthase of Pseudomonas
  aeruginosa (EC 2.5.1.16), a member of the spermidine/spermine synthase (PABS) family with
  a Rossmann-like SAM-dependent methyltransferase fold. It catalyses the irreversible transfer
  of an aminopropyl group from decarboxylated S-adenosylmethionine (decarboxy-AdoMet) to putrescine,
  producing spermidine and methylthioadenosine; it acts together with SpeD2 (the AdoMet decarboxylase)
  in the spermidine from putrescine step. Spermidine made via this route is exported to the
  cell surface, where as a polycation it binds LPS and stabilises the outer membrane; a PA4774
  mutant lacks surface spermidine and is more susceptible to polymyxin B, aminoglycosides
  and oxidative membrane damage. The enzyme is a soluble cytoplasmic homodimer/tetramer.
