- term:
    id: GO:0010487
    label: thermospermine synthase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G19530
  - PANTHER:PTN000168372
  - UniProtKB:Q9UXE4
  review:
    summary: >-
      IBA from the PTN000168372 IBD for thermospermine synthase activity, seeded by Saccharolobus
      solfataricus SpeE (Q9UXE4, a multifunctional aminopropyltransferase) and Arabidopsis
      ACL5 (AT5G19530, a dedicated thermospermine synthase). P. aeruginosa SpeE2 is a putrescine
      aminopropyltransferase (spermidine synthase, EC 2.5.1.16) by HAMAP curation and makes
      spermidine, not thermospermine. Thermospermine synthase activity is the activity of
      the archaeal and plant seeds, not of this spermidine synthase.
    action: MODIFY
    reason: >-
      Lateral correction to spermidine synthase activity (GO:0004766), the curated activity
      this protein carries by IEA. GO:0010487 and GO:0004766 are sibling aminopropyltransferase
      activities; the thermospermine-synthase IBD was placed at a node that also contains
      dedicated spermidine synthases and over-propagated to this one.
    proposed_replacement_terms:
    - id: GO:0004766
      label: spermidine synthase activity
    propagation_review:
