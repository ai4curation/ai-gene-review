- term:
    id: GO:0015627
    label: type II protein secretion system complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  supporting_entities:
  - InterPro:IPR022346
  review:
    summary: InterPro2GO mapping from IPR022346 (T2SS GspH).
    action: REMOVE
    reason: >-
      FimU shares the GspH fold, but it is the type IV pilus minor pilin, not
      a T2SS component. P. aeruginosa encodes a separate Xcp GspH, XcpU
      (PA3100, Q00515). The pilus minor pilins are assembled into type IV
      pili; what the literature shows is T2S minor pseudopilins substituting
      in T4P assembly, not FimU acting in T2S. The domain-to-complex mapping
      is wrong for this family member.
    supported_by:
    - reference_id: PMID:25389296
      supporting_text: >-
        our 1.4 Å crystal structure of FimU revealed striking architectural
        similarity to its T2S ortholog GspH, despite minimal sequence identity
    - reference_id: PMID:25389296
      supporting_text: >-
        FimU is incorporated independently of the others and is proposed to
        couple the putative minor pilin-PilY1 complex to the major subunit.
- term:
