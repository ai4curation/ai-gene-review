    label: protein secretion by the type II secretion system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR022346
  review:
    summary: InterPro2GO mapping from IPR022346 (T2SS GspH).
    action: REMOVE
    reason: >-
      Same over-reach as the complex row: there is no evidence that FimU
      contributes to Xcp secretion, and the operon and all experimental
      data place it in type IV pilus assembly. The Xcp system has its own
      GspH, XcpU.
    supported_by:
    - reference_id: PMID:8682785
      supporting_text: >-
        Isogenic mutants constructed by allelic exchange demonstrated that the
        fimU gene was required for fimbrial biogenesis and twitching motility
