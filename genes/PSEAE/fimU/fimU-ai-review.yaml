taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  FimU (PA4550) is a minor pilin of the type IVa pilus of Pseudomonas
  aeruginosa. Like the major pilin it is made as a prepilin with a short
  class III leader that the prepilin peptidase PilD removes, followed by a
  hydrophobic N-terminal helix that anchors it in the inner membrane before
  assembly. Its globular domain is structurally similar to the GspH minor
  pseudopilin of type II secretion systems despite little sequence identity.
  FimU is incorporated into pilus fibres independently of the other minor
  pilins and is thought to couple the PilV-PilW-PilX-PilY1 priming complex to
  the major pilin PilA; it is one of the key promoters of pilus assembly.
  fimU mutants make few or no surface pili and do not twitch, a defect that
  overexpression of the related minor pilin FimT can rescue.
