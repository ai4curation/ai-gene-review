core_functions:
- description: >-
    Minor pilin of the type IVa pilus. After PilD processing in the inner
    membrane, FimU is incorporated into the pilus fibre, where it is thought
    to couple the PilVWXY1 priming complex to the major pilin PilA and so
    promote pilus assembly, supporting twitching motility.
  directly_involved_in:
  - id: GO:0043683
    label: type IV pilus assembly
  - id: GO:0043107
    label: type IV pilus-dependent motility
  locations:
  - id: GO:0044096
    label: type IV pilus
  supported_by:
  - reference_id: PMID:25389296
    supporting_text: >-
      FimU is incorporated independently of the others and is proposed to
      couple the putative minor pilin-PilY1 complex to the major subunit.
  - reference_id: PMID:20338182
    supporting_text: >-
      with FimU and PilX being implicated as key promoters of pilus assembly
      on the cell surface
suggested_questions:
- question: >-
    Is FimU located at the pilus tip with the PilVWXY1 priming complex, or
    distributed along the fibre as the antibody data of Giltner et al. 2010
    suggest?
suggested_experiments:
- description: >-
    Map FimU position in purified pili by immunogold or cryo-electron
    tomography of tagged FimU, in wild type and in pilVWX deletion strains, to
    test the proposed coupling role between the priming complex and PilA.
