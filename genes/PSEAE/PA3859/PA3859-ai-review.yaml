    supporting_text: The esterase preferentially hydrolyzed short-chain fatty acids.
suggested_questions:
- question: >-
    Is PA3859, like its human LYPLA1/LYPLA2 relatives, a depalmitoylase or lysophospholipase in vivo, or a
    short-chain esterase acting on another cellular substrate?
suggested_experiments:
- description: >-
    Screen purified PA3859 against lysophospholipids, acylated peptides and acyl-ACP/acyl-CoA thioesters,
    and profile the lipidome of a PA3859 deletion mutant.
