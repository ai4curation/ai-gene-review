  review:
    summary: >-
      Carboxylic ester hydrolase activity by IBA from PTN004181029 (6 seeds, including human LYPLA1 O75608
      and LYPLA2 O95372, rat Lypla1 and E. coli P76561).
    action: ACCEPT
    reason: >-
      The node term is the broad activity shared by the LYPLA-like esterase clade, whose seeds are
      characterised acyl-protein thioesterases, lysophospholipases and carboxylesterases; the general
      ester-hydrolase term is appropriate for a clade with varied substrates. Q9HXE7 in WITH/FROM reflects
      its own IDA.
    supported_by:
    - reference_id: PMID:15717224
      supporting_text: >-
        Homology-based database searches clearly revealed the presence of the consensus GXSXG signature
        motif that is present in the serine-dependent acylhydrolase protein family.
- term:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  evidence_type: IDA
  original_reference_id: PMID:15717224
  qualifier: enables
  review:
    summary: >-
      PseudoCAP IDA, one of six seeds of the PTN004181029 IBD. The native enzyme was purified from PAO1,
      assigned to PA3859 by N-terminal sequencing, and the recombinant protein was purified and assayed.
    action: ACCEPT
    reason: >-
      Abstract only, but the abstract states the purification, gene assignment and kinetics outright, so
      the activity is directly shown for this gene product. Seed verdict SOUND. GO:0034338 short-chain
      carboxylesterase activity was considered, but the preference rests on artificial p-nitrophenyl
      esters and the natural substrate is unknown, so the general ester hydrolase term is as precise as the
      evidence allows.
    supported_by:
    - reference_id: PMID:15717224
      supporting_text: >-
        The corresponding gene PA3859 was identified in the P. aeruginosa PAO1 genome as the only gene
        encoding for a protein with this N-terminus.
    - reference_id: PMID:15717224
      supporting_text: >-
        Native enzyme preparations typically showed a Michaelis constant (K(m)) and V(max) of 0.43 mM and
        12,500 U mg(-1), respectively, using p-nitrophenyl acetate as substrate.
core_functions:
- description: >-
    Intracellular serine carboxylesterase of the LYPLA1/2-like family that hydrolyses short-chain acyl
    esters in vitro; physiological substrate unknown.
  molecular_function:
