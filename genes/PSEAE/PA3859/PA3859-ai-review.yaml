id: Q9HXE7
gene_symbol: PA3859
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA3859 encodes an intracellular carboxylesterase of Pseudomonas aeruginosa PAO1, a 24-kDa monomeric
  alpha/beta-hydrolase of the phospholipase/carboxylesterase (AB hydrolase 2, LYPLA1/2-like) family with
  the GXSXG serine-hydrolase motif. The native enzyme, purified from P. aeruginosa and identified by its
  N-terminal sequence, and the recombinant protein hydrolyse p-nitrophenyl acetate and other acetylated
  substrates, prefer short-chain acyl esters, and are inhibited by PMSF but not EDTA; optimal activity is
  at pH 9.0 and 55 degrees C. Its physiological substrate is not known.
