- term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:22753059
  qualifier: involved_in
  review:
    summary: 'CACAO annotation. The cited paper deletes PA5174 in PAO1 (allelic exchange, strain TMT39). Growth
      slows (doubling time 19 to 62 min, Fig. 4A) and [3H]acetate incorporation into fatty acids falls
      more than [3H]uridine incorporation into RNA (Fig. 4B). Plasmid PA5174 or E. coli fabH restores both.'
    action: ACCEPT
    reason: 'The CACAO term matches what the paper shows. The macromolecular labeling experiment measures
      de novo fatty acid synthesis flux directly, and the defect is complemented. Biochemistry in the same
      paper (Fig. 8) shows FabY catalyses a step of the process, so this is participation, not just
      necessity. The granularity is right: GO has no "fatty acid synthesis initiation" term, and the
      initiating condensation is captured by the MF row.'
    supported_by:
    - reference_id: PMID:22753059
      supporting_text: However, the larger decrease in the rate of label incorporation for FAS in comparison
        to RNA indicates particular attenuation specific to FAS
      reference_section_type: RESULTS
    - reference_id: PMID:22753059
      supporting_text: doubling time increased from 19 to 62 min in the absence of PA5174
      reference_section_type: RESULTS
- term:
    id: GO:0009245
    label: lipid A biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:24145528
  qualifier: involved_in
  review:
    summary: 'CACAO annotation. The cited paper shows by FAME analysis (Fig. 1), LPS SDS-PAGE (Fig. 2) and lipid
      A ESI-MS (Fig. 4, Table 2) that most lipid A in ΔfabY lacks one secondary lauroyl (C12:0/2-OH-C12:0)
      chain and carries extra L-Ara4N. Exogenous decanoate partly restores secondary acylation.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The phenotype is real and complemented, but the term reads a downstream metabolite phenotype
      as process participation (phenotype read as process). FabY makes beta-acetoacetyl-ACP. The lipid
      A steps that are defective, secondary lauroylation, are carried out by the LpxL-like acyltransferases
      PA0011 and PA3242 using C12:0-ACP. The authors explain the defect as reduced FAS flux limiting the
      C12:0-ACP donor pool, and they say they cannot rule out a regulatory cause. FabY therefore supplies
      a precursor and performs no step of lipid A biosynthesis. Its role is fully covered by fatty acid
      biosynthetic process. Initiating condensing enzymes elsewhere, such as E. coli FabH, are not
      conventionally annotated to lipid A biosynthesis for the same reason. Not removed: this is an experimental
      row, and the precursor link is direct (all lipid A acyl chains come from FAS acyl-ACP).'
    supported_by:
    - reference_id: PMID:24145528
      supporting_text: It is likely that decreased flux of the FAS pathway in the Δ fabY strain limits cellular
        pools of the C 12:0 -ACP donor available for the secondary acyl transferases.
      reference_section_type: DISCUSSION
    - reference_id: PMID:24145528
      supporting_text: Although we certainly cannot rule out differences in gene regulation of either a secondary
        lipid A lauroyl transferase, a putative lauroyl deacylase, or another component of the multifaceted
        Δ fabY phenotype to explain the hypoacylation
      reference_section_type: DISCUSSION
- term:
    id: GO:0009372
    label: quorum sensing
  evidence_type: IMP
  original_reference_id: PMID:22753059
  qualifier: involved_in
  review:
    summary: 'CACAO annotation. ΔPA5174 makes almost no rhl acyl-HSL (TLC with C. violaceum overlay, Fig. 5A)
      and only a trace of PQS (Fig. 6C), with loss of rhamnolipid, swarming, elastase and pyocyanin. Las
      3-oxo-acyl-HSL stays near wild type (Fig. 6A). Plasmid PA5174 restores, and even raises, signal levels.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The paper shows muted QS signal output, but as a consequence of reduced fatty acid precursor
      supply, not because FabY acts in signalling (phenotype read as process). The authors predicted the
      rhl defect from the chemistry: C4-HSL is made by RhlI from butanoyl-ACP, which derives from the FabY
      product. They interpret the delay in QS as a lack of fatty acid precursors. The las signal is unaffected
      despite the FAS defect, which argues against a direct role. FabY neither synthesises nor senses a
      signal. Precursor supply into acyl-HSL and PQS synthesis is already captured by fatty acid biosynthetic
      process. The authors do note a correlation between FabY dosage and QS output that warrants study, so
      the row is not removed.'
    supported_by:
    - reference_id: PMID:22753059
      supporting_text: The progression of QS in the ΔFabY mutant is likely delayed by the lack of fatty acid
        precursors
      reference_section_type: DISCUSSION
    - reference_id: PMID:22753059
      supporting_text: The ΔPA5174 mutant apparently can synthesize 3-oxo-acyl-HSL to wild-type levels in
        LB liquid culture after 24 h of incubation despite the FAS defect
      reference_section_type: RESULTS
