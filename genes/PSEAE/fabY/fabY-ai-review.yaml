core_functions:
- description: Initiating beta-ketoacyl-ACP synthase of type II fatty acid synthesis. FabY condenses acetyl-CoA
    (or short-chain C4/C6 acyl-CoA) with malonyl-ACP to form the primer beta-acetoacetyl-ACP, which the
    FabG/FabA/FabI/FabB/FabF cycle then elongates. In P. aeruginosa it replaces the canonical KASIII FabH.
  molecular_function:
    id: GO:0033818
    label: beta-ketoacyl-acyl-carrier-protein synthase III activity
  directly_involved_in:
  - id: GO:0006633
    label: fatty acid biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:22753059
    supporting_text: the specific activities of PA5174 and E. coli FabH with malonyl-ACP and acetyl-CoA as
      substrates were 13.4 and 7.4 pmol/min/ng under the same assay conditions
  - reference_id: PMID:22753059
    supporting_text: Growth analysis confirmed complete fabH-PA5174 cross complementation
suggested_questions:
- question: Does FabY keep any measurable elongating KASI/II activity (acyl-ACP + malonyl-ACP), given
    that the conclusion that it does not rests on the absence of extra bands in one coupled urea-PAGE assay?
- question: What is the function of the ~200-residue N- and C-terminal extensions outside the KS domain,
    which resemble fungal FAS scaffolding elements? Do they determine acyl-CoA versus acyl-ACP acceptor
    selectivity?
- question: Is the reduced siderophore output of ΔfabY due to the pyoverdine myristate precursor or to
    quorum-sensing regulation? This decides whether any siderophore process term is warranted.
- question: How do Pseudomonas species that lack FabY (P. putida, P. fluorescens, P. syringae) initiate
    fatty acid synthesis?
suggested_experiments:
- description: Steady-state kinetics of purified FabY with acetyl-CoA versus acetyl-ACP and C4-C10 acyl-ACP
    acceptors, to quantify any residual elongating activity and confirm acceptor selectivity.
  experiment_type: in vitro enzymology
- description: Quantify pyoverdine and pyochelin (fluorescence, HPLC) in ΔfabY with and without exogenous
    decanoate, and in a ΔfabY ΔrhlI background, to separate precursor-supply from QS-regulatory effects.
  experiment_type: metabolite quantification
- description: Truncation mutants lacking the N- or C-terminal extensions, tested for activity and dimerization,
    guided by the 4CW4 structure.
  experiment_type: structure-function mutagenesis
