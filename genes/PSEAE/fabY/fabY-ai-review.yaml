id: Q9HU15
gene_symbol: fabY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: FabY (PA5174) is the beta-ketoacyl-acyl carrier protein synthase that initiates type II
  fatty acid synthesis in Pseudomonas aeruginosa. Although it belongs to the KASI/II (FabB/FabF-like,
  ketosynthase KS3) family of elongation condensing enzymes, it functions as the cell's FabH equivalent,
  condensing acetyl-CoA with malonyl-ACP to give the primer beta-acetoacetyl-ACP; it also accepts butyryl-
  and hexanoyl-CoA but not longer acyl-CoAs, and does not efficiently elongate acyl-ACPs. FabY fully
  replaces FabH in Escherichia coli, whereas P. aeruginosa lacking all four KASIII homologs grows
  normally. The 634-residue soluble enzyme is a homodimer with N- and C-terminal extensions outside the
  KS domain, and is restricted to P. aeruginosa and a few close relatives. Deleting fabY slows growth and
  de novo fatty acid synthesis. Downstream, the mutant makes less of the fatty acid-derived products,
  including rhl acyl-homoserine lactones, PQS, rhamnolipids, siderophores and secondary lauroyl chains of
  lipid A, and becomes hypersusceptible to several antibiotics. Exogenous medium-chain fatty acids
  bypass FabY through the KASIII enzyme PA3286.
