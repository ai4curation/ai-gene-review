- id: PMID:22753059
  title: Fatty acid biosynthesis in Pseudomonas aeruginosa is initiated by the FabY class of β-ketoacyl
    acyl carrier protein synthases.
  findings:
  - statement: PA5174 alone complements FabH depletion and fabH deletion in E. coli.
    supporting_text: PA5174 is thus by itself sufficient to complement FabH and restore initiation of FAS
    reference_section_type: RESULTS
  - statement: Purified FabY condenses acetyl-CoA with malonyl-ACP at a rate comparable to E. coli FabH
      and prefers C2-C6 acyl-CoA acceptors.
    supporting_text: PA5174 utilized short-chain acyl-CoA as substrates, including acetyl-CoA, butyryl-CoA,
      and hexanoyl-CoA, but did not use any of the longer-chain acyl-CoA substrates
    reference_section_type: RESULTS
  - statement: ΔfabY specifically reduces de novo fatty acid synthesis flux.
    supporting_text: However, the larger decrease in the rate of label incorporation for FAS in comparison
      to RNA indicates particular attenuation specific to FAS
    reference_section_type: RESULTS
  - statement: Defines the FabY class of KASI/II-domain initiating condensing enzymes.
    supporting_text: We propose distinguishing β-ketoacyl-ACP synthases with KASI/II domains and a preference
      for short-chain acyl-CoA acceptor substrates as the new FabY class of condensing enzymes
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary paper (J Bacteriol 194:5171). The cache was upgraded to PMC full
      text (PMC3457228) for this review. Source of four of the five CACAO rows.
- id: PMID:24145528
  title: Deletion of the β-acetoacetyl synthase FabY in Pseudomonas aeruginosa induces hypoacylation of
    lipopolysaccharide and increases antimicrobial susceptibility.
  findings:
  - statement: ΔfabY lipid A mostly lacks one secondary lauroyl chain, attributed to limited C12:0-ACP
      supply.
    supporting_text: The majority of lipid A species in the Δ fabY mutant lacked a single secondary lauroyl
      group, resulting in hypoacylated lipid A.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. It supports lipid A hypoacylation as a downstream consequence of reduced
      FAS flux, not FabY participation in lipid A biosynthesis.
- id: PMID:22753057
  title: Pseudomonas aeruginosa directly shunts β-oxidation degradation intermediates into de novo fatty
