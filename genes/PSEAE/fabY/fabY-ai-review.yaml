- term:
    id: GO:0019290
    label: siderophore biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:22753059
  qualifier: involved_in
  review:
    summary: 'CACAO annotation. On LB-chrome azurol S (CAS) plates, ΔPA5174 gives no Fe3+-sequestration halo,
      while wild type and the plasmid-complemented strain do (Fig. 7). This is the only siderophore assay
      in the paper.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Too far downstream (phenotype read as process). A CAS halo reports secreted iron-chelating activity,
      so it cannot tell biosynthesis from regulation or secretion. The authors gave two possible causes:
      pyoverdine is assembled on a myristate residue, and it is co-regulated by quorum sensing, which is
      muted in this mutant. Neither was resolved, and pyoverdine was not quantified or structurally analysed.
      Even if the myristate route explains it, FabY only supplies a fatty acid precursor upstream of the
      nonribosomal peptide synthetase machinery and performs no step of siderophore biosynthesis. Kept rather
      than removed because the reduction is real and complemented.'
    supported_by:
    - reference_id: PMID:22753059
      supporting_text: the ΔPA5174 strain did not produce a zone, indicating a lack of relative siderophore
        production
      reference_section_type: RESULTS
    - reference_id: PMID:22753059
      supporting_text: Since pyoverdine is coregulated by QS systems (79) and is assembled on a myristate
        fatty acid residue (21, 34)
      reference_section_type: RESULTS
