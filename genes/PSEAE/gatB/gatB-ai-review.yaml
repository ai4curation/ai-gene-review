gene_symbol: gatB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: GatB is the synthetase subunit of the GatCAB tRNA-dependent amidotransferase in Pseudomonas
  aeruginosa PAO1; it activates and amidates the tRNA-bound amino-acid side chain using ATP. Its native
  aminoacyl-tRNA production role is conversion of Asp-tRNA(Asn) to Asn-tRNA(Asn). The purified complex
  can also use supplied heterologous Glu-tRNA(Gln), a biochemical capacity distinct from native substrate
  supply.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR014746
  review:
    summary: GatB has a defined catalytic contribution within the GatCAB reaction.
    action: MODIFY
    reason: The general catalytic claim is sound but underspecified. The replacements retain both demonstrated
      tRNA-transamidation capacities. Complex-level activity is a subunit contribution, not an assertion
      that the isolated polypeptide performs every chemical step. Its native charging role is conversion
      of Asp-tRNA(Asn) to Asn-tRNA(Asn). The purified complex can also use supplied heterologous Glu-tRNA(Gln),
      a biochemical capacity distinct from the native substrate supply.
    supported_by: &id001
    - &id002
      reference_id: PMID:14729703
      supporting_text: This strategy led to a pure and active AdT, with stoichiometric amounts of the
        three subunits
    - &id003
      reference_id: file:PSEAE/gatB/gatB-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Catalytic subunit of the Asp/Glu-tRNA(Asn/Gln) amidotransferase complex GatCAB.
        GatCAB allows the formation of correctly charged Asn-tRNA(Asn) or Gln-tRNA(Gln) through the multi-step
        transamidation of misacylated Asp-tRNA(Asn) or Glu-tRNA(Gln) in organisms which lack either or
        both of asparaginyl-tRNA or glutaminyl- tRNA synthetases. The reaction takes place in the presence
        of glutamine and ATP through an activated phospho-Asp-tRNA(Asn) or phospho-Glu- tRNA(Gln). This
        subunit specifically recognizes tRNA(Gln) and tRNA(Asn), and mediates the transamidation of misloaded
        Glu and Asp respectively by catalyzing formation of the activated gamma-phospho- intermediate
        and its subsequent aminolysis using ammonia produced by the gatA subunit. Recognizes the first
        base pair and the D-loop of its specific tRNA substrates. {ECO:0000255|HAMAP-Rule:MF_00121}.
    proposed_replacement_terms:
    - id: GO:0050566
      label: asparaginyl-tRNA synthase (glutamine-hydrolyzing) activity
    - id: GO:0050567
      label: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
