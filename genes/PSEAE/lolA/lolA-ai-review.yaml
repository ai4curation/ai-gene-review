taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  LolA (PA2614) is the periplasmic outer-membrane lipoprotein carrier of Pseudomonas aeruginosa.
  It has a Sec signal peptide and the LolA/LolB/LppX fold with a hydrophobic cavity that holds the
  acyl chains of a mature lipoprotein. In the Lol pathway the inner-membrane ABC transporter LolCDE
  (PA2986-PA2988) releases outer-membrane-destined lipoproteins to LolA, forming a soluble LolA-lipoprotein
  complex that crosses the periplasm and hands its cargo to the outer-membrane receptor LolB for
  insertion. Reconstitution with purified P. aeruginosa Lol proteins showed this LolCDE to LolA to
  LolB transfer directly, and P. aeruginosa LolA also accepts lipoproteins from E. coli LolCDE. lolA
  is essential in P. aeruginosa; LolA depletion weakens the cell envelope (greater SDS sensitivity)
  and reduces virulence in insect and mouse infection models.
