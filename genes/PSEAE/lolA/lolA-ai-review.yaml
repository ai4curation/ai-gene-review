suggested_questions:
- question: >-
    How does P. aeruginosa LolA cope with lipoproteins whose sorting signal lies at positions 3 and
    4 rather than 2, and does it discriminate them itself or only via LolCDE?
suggested_experiments:
- description: >-
    In vitro transfer assays with purified P. aeruginosa LolA and lipoproteins carrying position-3/4
    variants, released by P. aeruginosa or E. coli LolCDE, to test whether LolA contributes to sorting
    specificity.
