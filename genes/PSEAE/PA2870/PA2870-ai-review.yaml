- term:
    id: GO:0043709
    label: cell adhesion involved in single-species biofilm formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002895351
  - UniProtKB:P31129
  review:
    summary: >-
      IBA from PTN002895351, whose GO:0043709 IBD rests on one seed annotated acts_upstream_of_or_within.
      PA2870 is a DGC; its only biofilm data are a reduced-attachment deletion phenotype in
      PAO1 and negative results in PA14.
    action: MODIFY
    reason: >-
      A DGC regulates biofilm formation and does not take part in adhesion. The replacement
      is the unsigned GO:1900190, kept general because the gene-specific data are thin and
      inconsistent. The node-level GO_CENTRAL defect is recorded once in the PA1107 review.
    proposed_replacement_terms:
    - id: GO:1900190
      label: regulation of single-species biofilm formation
    supported_by:
    - reference_id: PMID:35935233
      supporting_text: >-
        This was clearly observed for 7 mutations, PA0169, PA1120 (yfiN; Malone et al., 2010),
        PA2870, PA3702
    - reference_id: PMID:20978535
      supporting_text: >-
        Only the single-crossover mutation in PA1107 resulted in a consistent observable biofilm
        defect (not shown).
    - reference_id: file:PSEAE/PA2870/PA2870-notes.md
      supporting_text: |-
        P. aeruginosa expressing PA2870 and PA3343, two DGCs that produce high levels
             of c-di-GMP in our assay ( Table 1 ), do not cause an alteration in the biofilm
             phenotype.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002895351
        source_label: PTN002895351
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Single-seed IBD of a participation term on a DGC clade. The node-level defect is
          recorded once in the PA1107 review.
      - source_id: UniProtKB:P31129
        source_label: E. coli DgcZ (sole seed)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The seed annotation is IMP acts_upstream_of_or_within (EcoCyc, PMID:19460094; live
          QuickGO query 2026-11-05). It supports a regulatory role of DgcZ upstream of adhesion,
          not participation in adhesion by every DGC. For PA2870 the evidence supports at
          most regulation of biofilm formation.
