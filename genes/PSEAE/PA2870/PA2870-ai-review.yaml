id: Q9HZX6
gene_symbol: PA2870
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2870 is an uncharacterised 525-aa inner-membrane diguanylate cyclase of Pseudomonas aeruginosa,
  with two predicted transmembrane helices flanking a periplasmic region and a C-terminal
  GGDEF domain carrying the GGEEF motif. Extracts of cells overexpressing PA2870 contain high
  levels of c-di-GMP, but overexpression does not change biofilm formation. A PAO1 deletion
  attaches less to surfaces in early biofilm assays, whereas an insertion mutant in PA14 had
  no consistent biofilm defect. The signal sensed by its periplasmic region and the processes
  that its c-di-GMP controls are unknown.
references:
- id: PMID:16477007
  title: >-
    Analysis of Pseudomonas aeruginosa diguanylate cyclases and phosphodiesterases reveals
    a role for bis-(3'-5')-cyclic-GMP in virulence.
  findings:
  - statement: >-
      Extracts of a PA14 strain overexpressing PA2870 contained 96 pmol c-di-GMP per mg wet
      cell weight (Table 1, read in PMC full text; detection limit 12).
    supporting_text: >-
      Analysis of the phenotypes of DGC and PDE mutants and overexpressing clones revealed
      that certain virulence-associated traits are controlled by multiple DGCs and PDEs through
      alterations in c-di-GMP levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0052621 row and of PA2870 seeding PTN002895344. Cached
      copy is abstract-only; full text read on PMC (PMC1413825), verbatim excerpts in the
      notes. Whole-cell extract assay on an overexpressing strain; crude but direct.
- id: PMID:20978535
  title: >-
    Specific control of Pseudomonas aeruginosa surface-associated behaviors by two c-di-GMP
    diguanylate cyclases.
  findings:
  - statement: A single-crossover PA2870 mutant in PA14 had no consistent biofilm defect.
    supporting_text: >-
      Only the single-crossover mutation in PA1107 resulted in a consistent observable biofilm
      defect (not shown).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached. Mentions PA2870 only as a negative screen result.
- id: PMID:35935233
  title: >-
    Phenotypic and integrated analysis of a comprehensive Pseudomonas aeruginosa PAO1 library
    of mutants lacking cyclic-di-GMP-related genes.
  findings:
  - statement: A PAO1 PA2870 deletion reduces early attachment.
    supporting_text: >-
      This was clearly observed for 7 mutations, PA0169, PA1120 (yfiN; Malone et al., 2010),
      PA2870, PA3702
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Library-scale screen.
