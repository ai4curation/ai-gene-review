      Catalytic properties and structures of three bacterial KynB enzymes, including P. aeruginosa
      KynB.
    supporting_text: >-
      In the present study, we characterize the catalytic properties and present the crystal
      structures of three bacterial kynurenine formamidases.
  - statement: Binuclear zinc catalytic centre.
    supporting_text: >-
      The structures reveal a new amidase protein fold, a highly organized and distinctive
      binuclear Zn2+ catalytic centre
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
