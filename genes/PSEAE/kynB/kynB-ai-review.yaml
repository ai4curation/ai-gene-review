- id: PMID:14592712
  title: >-
    Aerobic tryptophan degradation pathway in bacteria: novel kynurenine formamidase.
  findings:
  - statement: >-
      Recombinant P. aeruginosa KynB has kynurenine formamidase activity; KynB catalyses step
      2 of the bacterial kynurenine (anthranilate) pathway.
    supporting_text: >-
      This functional prediction was experimentally verified by cloning, expression and enzymatic
      characterization of recombinant kynurenine formamidase orthologs from Bacillus cereus,
      Pseudomonas aeruginosa and Ralstonia metallidurans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP and UniProt source for the GO:0004061 IDA seed row of PTN001258690, and UniProt
      source for the IGC tryptophan catabolism row. Abstract only; it states that the P. aeruginosa
      ortholog was expressed and assayed, which is direct evidence for the activity.
- id: PMID:24942958
  title: >-
    Structures of bacterial kynurenine formamidase reveal a crowded binuclear zinc catalytic
    site primed to generate a potent nucleophile.
  findings:
