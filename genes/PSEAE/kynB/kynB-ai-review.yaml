id: Q9I234
gene_symbol: kynB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  KynB (PA2081) is the bacterial kynurenine formamidase (arylformamidase, EC 3.5.1.9), a zinc-dependent
  amidase of the cyclase superfamily. It hydrolyses N-formyl-L-kynurenine to L-kynurenine
  and formate, the second step of the aerobic kynurenine pathway that converts L-tryptophan
  to anthranilate together with tryptophan 2,3-dioxygenase (KynA) and kynureninase (KynU).
  The recombinant P. aeruginosa enzyme is active, and crystal structures of the bacterial
  enzymes show a homodimer with a binuclear Zn2+ catalytic centre in a confined active site.
