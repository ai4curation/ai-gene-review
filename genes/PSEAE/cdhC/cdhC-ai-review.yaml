proposed_new_terms:
  - proposed_name: 3-dehydrocarnitine:acetyl-CoA trimethylamine transferase activity
    proposed_definition: >-
      Catalysis of the reaction: 3-dehydrocarnitine + acetyl-CoA =
      N,N,N-trimethylglycyl-CoA + acetoacetate.
    justification: >-
      The EC 2.3.1.317 (RHEA:47044) activity is experimentally established for
      CdhC and S. meliloti BcoG, but GO has only the unrelated
      3-keto-5-aminohexanoate cleavage term for this family.
    proposed_parent:
      id: GO:0016747
      label: acyltransferase activity, transferring groups other than amino-acyl groups
    supported_by:
      - reference_id: file:PSEAE/cdhC/cdhC-uniprot.txt
        record_section: ["CC:CATALYTIC ACTIVITY"]
        supporting_text: >-
          Reaction=3-dehydrocarnitine + acetyl-CoA = N,N,N-trimethylglycyl-CoA
          + acetoacetate;
suggested_questions:
  - question: >-
      Which BKACE active-site residues distinguish 3-dehydrocarnitine-specific
      CdhC from 3-keto-5-aminohexanoate cleavage enzymes in the same PANTHER
      subfamily?
suggested_experiments:
  - description: >-
      Swap candidate substrate-pocket residues between CdhC and a
      3-keto-5-aminohexanoate cleavage enzyme and measure both activities.
    experiment_type: site-directed mutagenesis and enzyme kinetics
