status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  cdhC (PA5387) encodes the 3-dehydrocarnitine:acetyl-CoA trimethylamine
  transferase of Pseudomonas aeruginosa, a zinc-dependent beta-keto acid
  cleavage enzyme (BKACE, former DUF849 family). It condenses
  3-dehydrocarnitine with acetyl-CoA to give betainyl-CoA
  (N,N,N-trimethylglycyl-CoA) and acetoacetate, the second step of aerobic
  L-carnitine catabolism, between the CdhA dehydrogenase and the CdhB
  betainyl-CoA thioesterase. cdhC is induced by carnitine through the CdhR
  regulator and its disruption abolishes growth on carnitine.
