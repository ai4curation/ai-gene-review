      supported_by:
        - reference_id: file:PSEAE/cdhC/cdhC-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: >-
            Catalyzes the condensation of dehydrocarnitine and acetyl- CoA,
            forming acetoacetate and betainyl-CoA (N,N,N-trimethylglycyl-CoA)
            (PubMed:24240508).
        - reference_id: file:PSEAE/cdhC/cdhC-uniprot.txt
          supporting_text: "EC=2.3.1.317; Evidence={ECO:0000269|PubMed:24240508};"
