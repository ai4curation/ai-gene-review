  - term:
      id: GO:0043720
      label: 3-keto-5-aminohexanoate cleavage activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    supporting_entities:
      - InterPro:IPR008567
    review:
      summary: >-
        InterPro2GO assigns the lysine-fermentation BKACE substrate
        (3-keto-5-aminohexanoate) to every BKACE member; CdhC uses
        3-dehydrocarnitine.
      action: MODIFY
      reason: >-
        The family chemistry (cleavage of a beta-keto acid with acetyl-CoA,
        transferring the acyl fragment to CoA and releasing acetoacetate) is
        right, but the substrate is wrong. The BKACE screen showed the family
        has many distinct substrates, and CdhC's measured reaction uses
        3-dehydrocarnitine. GO has no term for that reaction, so the accurate
        parent is acyltransferase activity, transferring groups other than
        amino-acyl groups.
      proposed_replacement_terms:
        - id: GO:0016747
          label: acyltransferase activity, transferring groups other than amino-acyl groups
      supported_by:
        - reference_id: file:PSEAE/cdhC/cdhC-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: >-
            Reaction=3-dehydrocarnitine + acetyl-CoA = N,N,N-trimethylglycyl-CoA
            + acetoacetate;
        - reference_id: PMID:24240508
          supporting_text: >-
            we investigated the DUF849 Pfam family and unearthed 14 potential new
            enzymatic activities, leading to the designation of these proteins as
            β-keto acid cleavage enzymes.
      source_defects:
        - defect_type: WRONG_TERM
          resource: INTERPRO
          slot: GO ID
          requested_change: REPOINT
          asserted_value: GO:0043720
          corrected_value: GO:0016747
          cause: OTHER
          confidence: CONFIRMED
          explanation: >-
            InterPro2GO maps IPR008567 (BKACE) to the substrate-specific
            3-keto-5-aminohexanoate cleavage activity, but the family is
            substrate-diverse; members such as CdhC act on 3-dehydrocarnitine.
            The InterPro mapping should use a substrate-neutral parent.
  - term:
      id: GO:0016747
      label: acyltransferase activity, transferring groups other than amino-acyl groups
    evidence_type: IDA
    original_reference_id: PMID:24240508
    qualifier: enables
    review:
