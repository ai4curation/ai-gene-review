- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT3G53920
  - PANTHER:PTN000779307
  review:
    summary: >-
      IBA from a PTN000779307 IBD seeded only by Arabidopsis SIG3 (TAIR IMP/ISS rows).
    action: REMOVE
    reason: >-
      A sigma factor has no catalytic site; RNA polymerisation is catalysed by the core
      enzyme (beta and beta' subunits). RpoS is an initiation specificity factor whose
      activity is GO:0016987, accepted here. The seed's annotation conflates the
      sigma subunit with the holoenzyme, and the error propagates to every sigma-70 leaf
      under the node.
    supported_by:
    - reference_id: file:PSEAE/rpoS/rpoS-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Sigma factors are initiation factors that promote the attachment of RNA polymerase
        to specific initiation sites and are then released.
    - reference_id: file:PSEAE/rpoS/rpoS-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts with the RNA polymerase core enzyme.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000779307
        source_label: PTN000779307
        source_status: SOURCE_BAD
        comment: Single-seed IBD of a catalytic activity on a sigma-factor clade.
      - source_id: AGI_LocusCode:AT3G53920
        source_label: Arabidopsis SIG3 (sole seed)
        source_status: SOURCE_BAD
        comment: >-
          TAIR GO:0003899 IMP PMID:17175536 and ISS PMID:9280303 (QuickGO 2026-11-05);
          a sigma factor is at most contributes_to the holoenzyme activity.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000779307
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0003899
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The PAINT IBD of GO:0003899 DNA-directed RNA polymerase activity (enables) at
        PTN000779307 (PTHR30603, sigma-70 family) is seeded only by Arabidopsis SIG3
        (AT3G53920; TAIR IMP PMID:17175536, ISS PMID:9280303) and propagates to 419 leaves in
        77 taxa, including bacterial RpoD, RpoS and SigA. Sigma subunits have no catalytic
        site; the polymerase activity belongs to the core enzyme, and the sigma activity is
        GO:0016987 sigma factor activity, which the same node already carries. Please withdraw
        this IBD (or, if the seed is kept, use contributes_to rather than enables). PROBABLE
        because the TAIR seed papers were not read.
      supported_by:
      - reference_id: file:PSEAE/rpoS/rpoS-uniprot.txt
        record_section: ["CC:FUNCTION"]
        supporting_text: >-
          Sigma factors are initiation factors that promote the attachment of RNA polymerase
          to specific initiation sites and are then released.
