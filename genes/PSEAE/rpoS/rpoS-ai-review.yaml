id: P45684
gene_symbol: rpoS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  RpoS (sigma S, PA3622) is the stationary-phase and general stress response sigma factor
  of Pseudomonas aeruginosa, a group 2 member of the sigma-70 family with conserved
  regions 1-4 and a C-terminal helix-turn-helix that recognises the -35 element. Bound to
  core RNA polymerase it directs transcription initiation from RpoS-dependent promoters,
  such as the psl exopolysaccharide operon and the cheY2-cheA2-cheW2-aer-2 aerotaxis
  operon. rpoS mutants are hypersensitive to heat, high osmolarity and prolonged
  peroxide, make less catalase, exotoxin A and alginate, overproduce pyocyanin and
  pyoverdine, and show altered twitching, aerotaxis and biofilm formation. RpoS
  availability is controlled post-translationally by the anti-sigma factor domain of
  HsbR in the HptB-HsbR-HsbA partner switch and by RssB/RssC-dependent ClpXP proteolysis.
references:
- id: PMID:10383954
  title: Effect of rpoS mutation on the stress response and expression of virulence
    factors in Pseudomonas aeruginosa.
  findings:
  - statement: The PAO1 rpoS mutant is hypersensitive to heat, osmolarity and H2O2.
    supporting_text: >-
      In addition, the PAO1 rpoS mutant was hypersensitive to heat shock at 50°C, increased
      osmolarity, and prolonged exposure to high concentrations of H 2 O 2 .
  - statement: The rpoS mutant overproduces pyocyanin and pyoverdine.
    supporting_text: >-
      The rpoS mutation resulted in the increased production of the phenazine antibiotic
      pyocyanin and the siderophore pyoverdine.
  - statement: The rpoS mutant has altered twitching motility.
    supporting_text: >-
      In addition, the rpoS mutant displayed an altered twitching-motility phenotype,
      suggesting that the colonization factors, type IV fimbriae, were affected.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of the IDA GO:0006355 row (seed of PTN000779307) and of six IMP
      rows. Full text cached and read: all data are mutant phenotypes; no transcription
      assay is reported, so the IDA code on GO:0006355 is wrong (see source_defects).
- id: PMID:15687221
  title: Expression of Pseudomonas aeruginosa aer-2, one of two aerotaxis transducer
    genes, is controlled by RpoS.
  findings:
  - statement: RpoS is required for Aer-2-mediated aerotaxis and transcription of the aer-2 operon.
    supporting_text: >-
      A deletion-insertion mutation of alternative sigma factor RpoS eliminated
      Aer-2-mediated aerotaxis but not Aer-mediated aerotaxis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:20735777
  title: Pseudomonas aeruginosa biofilm matrix polysaccharide Psl is regulated transcriptionally
    by RpoS and post-transcriptionally by RsmA.
  findings:
  - statement: RpoS positively regulates psl transcription.
    supporting_text: >-
      we demonstrate that the alternative σ-factor RpoS is a positive transcriptional
      regulator of psl gene expression
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:31019225
  title: Connected partner-switches control the life style of Pseudomonas aeruginosa through
    RpoS regulation.
  findings:
  - statement: The anti-sigma domain of HsbR binds RpoS.
    supporting_text: Clearly, HsbRD3 interacted with RpoS from P. aeruginosa as well as with CrsR.
  - statement: HsbR is an anti-sigma factor controlling RpoS.
    supporting_text: >-
      We established that HsbR is an anti-sigma factor controlling RpoS and unveiled a
      connection between the HptB-HsbR-HsbA signal transduction cascade and the RpoS pathway
      during biofilm biogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Bacterial two-hybrid evidence for the RpoS-HsbR complex.
- id: PMID:37328957
  title: Defining the regulatory mechanisms of sigma factor RpoS degradation in Azotobacter
    vinelandii and Pseudomonas aeruginosa.
  findings:
  - statement: RssB and RssC are needed for ClpXP-dependent RpoS degradation.
    supporting_text: >-
      We propose that both RssB and RssC are necessary for the ClpXP-dependent RpoS
      degradation during exponential growth in two species of the Pseudomonadaceae family.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only.
