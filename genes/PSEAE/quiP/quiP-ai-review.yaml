id: Q9I4U2
gene_symbol: quiP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  QuiP (PA1032, quorum signal utilization and inactivation protein) is a
  peptidase S45 (penicillin acylase family) N-terminal nucleophile hydrolase
  with a predicted signal peptide, thought to be processed into alpha and beta
  subunits in the periplasm. It is an acyl-homoserine lactone (AHL) acylase
  (EC 3.5.1.97) that cleaves the amide bond of AHLs with acyl chains of seven or
  more carbons, releasing homoserine lactone and the fatty acid; short-chain
  AHLs such as C4-HSL are not degraded. QuiP is the acylase that lets
  P. aeruginosa grow on long-chain AHLs, including its own signal
  3-oxo-C12-HSL, as sole carbon and energy source. It is induced during growth
  on long-chain AHLs, and constitutive expression lowers 3-oxo-C12-HSL
  accumulation, giving QuiP a potential role in quorum quenching.
references:
- id: PMID:16461666
  title: Identification of QuiP, the product of gene PA1032, as the second acyl-homoserine
    lactone acylase of Pseudomonas aeruginosa PAO1.
  findings:
  - statement: quiP transposon mutants cannot grow on decanoyl-HSL as sole carbon source; complementation restores growth.
    supporting_text: Transposon mutants of quiP were defective for growth when P.
      aeruginosa was cultured in medium containing decanoyl-HSL as a sole carbon and
      energy source.
  - statement: E. coli expressing quiP gains long-chain AHL acylase activity, releasing HSL.
    supporting_text: The results confirm that quiP encodes a protein with acyl-HSL
      acylase activity.
  - statement: Periplasmic location is predicted from the signal sequence.
    supporting_text: PA1032 is predicted to be secreted into the periplasm based on
      its signal sequence
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IMP source for GO:0016811 and a seed of the PTN002151232 IBD.
      Full text cached and read. Beyond the mutant growth defect, heterologous
      expression in E. coli shows the acylase activity directly (HSL product by
      LC/MS), so the term is well supported; the IMP code understates the
      evidence.
