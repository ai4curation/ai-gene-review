suggested_questions:
- question: >-
    What natural conditions induce quiP, and is AHL degradation by QuiP used for
    nutrition, for signal turnover, or both?
suggested_experiments:
- description: >-
    Purify mature QuiP and measure kinetics across AHL chain lengths, and test
    its periplasmic location by fractionation.
