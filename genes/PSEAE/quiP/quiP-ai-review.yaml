- term:
    id: GO:0017000
    label: antibiotic biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002692
  review:
    summary: >-
      InterPro2GO mapping from the peptidase S45 signature, reflecting the
      industrial use of penicillin acylases. QuiP is an AHL acylase used for signal
      degradation and catabolism; nothing links it to antibiotic synthesis.
    action: REMOVE
    reason: >-
      Over-propagated family mapping; QuiP's demonstrated role is AHL degradation
      and utilization, not antibiotic biosynthesis.
    supported_by:
    - reference_id: PMID:16461666
      supporting_text: The results confirm that quiP encodes a protein with acyl-HSL
        acylase activity.
