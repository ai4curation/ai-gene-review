core_functions:
- description: >-
    Long-chain acyl-homoserine lactone acylase (EC 3.5.1.97) that deacylates
    AHLs of seven or more carbons, releasing homoserine lactone and allowing
    P. aeruginosa to use long-chain AHLs as growth substrates.
