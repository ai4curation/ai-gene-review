  - UniProtKB:P0AEX7
  review:
    summary: Phenylalanine has not been reported as a substrate of P. aeruginosa LIV-I.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IBA comes from E. coli LivH, whose LivHMGF core works with two binding proteins (LivJ
      and LivK). In this system the binding protein sets substrate specificity. P. aeruginosa has the
      single BraC (LIVAT) binding protein. Its specificity, and the substrate range of LIV-I in cells
      and in proteoliposomes, are Leu/Ile/Val plus Ala/Thr, with no report of Phe.
    supported_by:
    - &id004
      reference_id: PMID:1400443
      supporting_text: Alanine and threonine in addition to branched-chain amino acids were transported
        by the proteoliposomes, reflecting the substrate specificity of the BraC protein.
    - reference_id: PMID:6767701
      supporting_text: The binding activity of the protein was specific for the branched-chain amino acids.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:P0AEX7
