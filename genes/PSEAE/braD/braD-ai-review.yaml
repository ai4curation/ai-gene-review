core_functions:
- description: Integral-membrane permease subunit of the BraCDEFG (LIV-I) ABC importer. It forms part
    of the translocation pathway for high-affinity, ATP-driven uptake of L-leucine, L-isoleucine and L-valine,
    and with lower affinity L-alanine and L-threonine.
  molecular_function:
    id: GO:0015424
    label: ABC-type amino acid transporter activity
  directly_involved_in:
  - id: GO:1903801
    label: L-leucine import across plasma membrane
  - id: GO:1903806
    label: L-isoleucine import across plasma membrane
  - id: GO:1903805
    label: L-valine import across plasma membrane
  - id: GO:1904273
    label: L-alanine import across plasma membrane
  locations: *id009
  in_complex:
    id: GO:0055052
    label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
  supported_by:
  - *id006
  - *id004
  - *id010
  - reference_id: PMID:2120183
    supporting_text: The braD and braE genes specify very hydrophobic proteins of 307 and 417 amino acid
      residues, respectively.
suggested_questions:
- question: Is D-alanine a genuine LIV-I substrate, or is the weak D-alanine growth defect of bra mutants
    indirect? The D-alanine IBD at PTN000765102 rests only on BraD and PA4912 rows from one screen.
- question: Should the L-alanine IBD (sole seed BraD) sit at the LivH node PTN000765102, given that the
    substrate range of HAAT systems is set by the partner binding protein?
suggested_experiments:
- description: Radiolabelled D-alanine uptake in wild-type and clean, non-polar braD deletion strains,
    with complementation in trans. This would test D-alanine as a LIV-I substrate without the polarity
    confound of Tn5 insertions.
  experiment_type: transport assay
