id: P21627
gene_symbol: braD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: BraD is one of the two integral-membrane permease subunits of LIV-I, the high-affinity, Na(+)-independent
  branched-chain amino acid ABC importer of Pseudomonas aeruginosa, encoded by the braC-braD-braE-braF-braG
  operon. It is a LivH-type permease with ten predicted transmembrane helices in the inner membrane. With
  BraE it forms the translocation pathway, energised by the BraF/BraG ATPases and fed by the periplasmic
  binding protein BraC. The complex imports L-leucine, L-isoleucine and L-valine with high affinity and,
  with lower affinity, L-alanine and L-threonine.
