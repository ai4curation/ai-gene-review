- id: PMID:18833300
  title: High-throughput phenotypic characterization of Pseudomonas aeruginosa membrane transport genes.
  findings:
  - statement: Tn5 mutants in each bra operon gene grow less well on alanine, and some also on L-valine
      and L-isoleucine. The PA1073 mutant fails to grow on L-alanine and grows less well on D-alanine
      and L-isoleucine.
    supporting_text: In this work, mutants for each of these genes were found to be defective in Alanine
      metabolism, while utilization of L-Valine and L-Isoleucine was also altered in some cases
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified (Johnson et al. 2008, PLoS Genet, PMC2542419); full text read. A
      high-throughput Biolog/plate growth screen of PathoGenesis Mini-Tn5 transporter mutants (PA1073
      in strain PAK). No uptake assays were done. The L-Ile and L-Ala PseudoCAP IMP rows are indirect
      but corroborated by earlier biochemistry. The D-Ala row is not corroborated.
- id: PMID:1400443
  title: Solubilization and reconstitution of the Pseudomonas aeruginosa high affinity branched-chain
    amino acid transport system.
  findings:
  - statement: Reconstituted BraCDEFG imports leucine in an ATP-dependent way, needs all five components,
      and carries alanine and threonine as well.
    supporting_text: In this reconstituted system, leucine transport was completely dependent on the presence
      of all five Bra components and on ATP loaded internally to the proteoliposomes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Hoshino et al. 1992, J Biol Chem). Direct biochemical evidence for
      the complex. Abstract only.
