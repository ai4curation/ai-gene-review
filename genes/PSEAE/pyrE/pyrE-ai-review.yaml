suggested_questions:
- question: >-
    How does orotate accumulation lower protease and elastase production in P. aeruginosa: through
    quorum-sensing regulators, or through nucleotide pool imbalance?
suggested_experiments:
- description: >-
    Measure quorum-sensing signal levels and las/rhl regulon transcription in the pyrE mutant with and
    without uracil supplementation, to separate orotate effects from pyrimidine limitation.
