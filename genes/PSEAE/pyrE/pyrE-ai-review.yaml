id: P50587
gene_symbol: pyrE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PyrE (PA5331) is the orotate phosphoribosyltransferase (OPRTase, EC 2.4.2.10) of Pseudomonas aeruginosa
  PAO1, a 213-residue Mg2+-dependent homodimeric type I phosphoribosyltransferase. It transfers the
  ribose 5-phosphate group of 5-phospho-alpha-D-ribose 1-diphosphate (PRPP) to orotate, forming orotidine
  5'-monophosphate (OMP), the first of the two steps that convert orotate to UMP in de novo pyrimidine
  nucleotide synthesis. Deleting pyrE causes orotate to accumulate and lowers production of hemolysin,
  casein protease and elastase while raising pyocyanin and pyoverdine, effects that the accumulated
  orotate partly reproduces in wild-type cells.
