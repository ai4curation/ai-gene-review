    summary: >-
      IBA from PTN000208945, an ArcD-type subclade (16 leaf IBAs, 11 taxa) whose IBD has a
      single seed, this protein. The target appearing in its own WITH/FROM is expected, not
      circular.
    action: ACCEPT
    reason: >-
      The seed is sound: arginine:ornithine exchange by ArcD was measured directly in reconstituted
      proteoliposomes and in P. aeruginosa. PA5170 is the founding member of the clade. One
      leaf of the node, C. trachomatis AaxC, is probably an arginine:agmatine exchanger instead;
      that concerns another leaf and is flagged for checking.
    supported_by:
