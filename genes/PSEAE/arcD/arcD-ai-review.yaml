suggested_questions:
- question: >-
    Does Chlamydia trachomatis AaxC (O84379) exchange ornithine at all? Its C. pneumoniae
    ortholog is an arginine:agmatine exchanger insensitive to ornithine, so the arginine:ornithine
    antiporter IBA from PTN000208945 may need a NOT for the chlamydial subclade.
- question: >-
    Should GO:0043858 arginine:ornithine antiporter activity be annotated with the EXP rows
    citing PMID:1311296 and PMID:8449902 instead of PMID:2158926, which proposes the antiport
    only from a mutant phenotype?
suggested_experiments:
- description: >-
    Assay the PAO1 paralog PA1194 (Q9I4E4, same subfamily and node) and C. trachomatis AaxC
    in proteoliposomes for arginine/ornithine versus arginine/agmatine exchange, to define
    which leaves of PTN000208945 truly share the ArcD activity.
