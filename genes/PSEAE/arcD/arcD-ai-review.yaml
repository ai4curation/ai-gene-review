core_functions:
- description: >-
    Inner-membrane arginine:ornithine exchanger that imports L-arginine and exports L-ornithine,
    supplying the arginine deiminase pathway with substrate and removing its end product so
    that anaerobic arginine fermentation yields net ATP.
