        It is concluded that the ArcD protein is a transport system that catalyzes an electroneutral
        exchange between arginine and ornithine
    - reference_id: file:PSEAE/arcD/arcD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes electroneutral exchange between arginine and ornithine to allow high-efficiency
        energy conversion in the arginine deiminase pathway
    source_defects:
    - defect_type: MISSING_NEGATION
      resource: GO_CENTRAL
      record: PANTHER:PTN000208945
      requested_change: CHECK
      asserted_value: UniProtKB:O84379
      confidence: SUSPECTED
      explanation: >-
        The GO:0043858 arginine:ornithine antiporter activity IBD at PTN000208945 (sole seed
        P. aeruginosa ArcD P18275, 16 leaf IBAs) is soundly seeded, but it propagates to Chlamydia
        trachomatis AaxC (O84379, CT_374). The C. pneumoniae ortholog AaxC was shown to exchange
        L-arginine for agmatine in a decarboxylase-coupled system and to be resistant to L-ornithine.
