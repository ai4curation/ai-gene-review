id: P18275
gene_symbol: arcD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  arcD (PA5170) encodes the arginine:ornithine antiporter of Pseudomonas aeruginosa, a polytopic
  inner-membrane protein of the APC superfamily (basic amino acid/polyamine antiporter family,
  TC 2.A.3.2) with 13 predicted hydrophobic segments, a cytoplasmic N terminus and a periplasmic
  C terminus. ArcD catalyses electroneutral exchange of external L-arginine for internal L-ornithine,
  the substrate and end product of the arginine deiminase (ADI) pathway, and can also mediate
  slower proton motive force-driven uptake of arginine and ornithine; lysine can replace arginine
  in the exchange. It is encoded by the first gene of the arcDABC operon, induced by oxygen
  limitation, with arginine deiminase (ArcA), catabolic ornithine carbamoyltransferase (ArcB)
  and carbamate kinase (ArcC). By coupling arginine import to ornithine export without energy
  cost, ArcD lets the ADI pathway yield net ATP, and arcD mutants cannot use external arginine
  for anaerobic energy generation.
