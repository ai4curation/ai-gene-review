  title: Automatic Gene Ontology annotation based on UniRule annotation rules
  findings: []
- id: PMID:12480887
  title: Malate:quinone oxidoreductase is essential for growth on ethanol or acetate
    in Pseudomonas aeruginosa.
  findings:
  - statement: >-
      The paper maps its own gene to this entry's locus explicitly, so the attribution needs no
      inference.
    reference_section_type: ABSTRACT
    supporting_text: >-
      mqo of P. aeruginosa ATCC 17933 corresponds to mqoB (PA4640) of the P. aeruginosa PAO1 genome
      project.
  - statement: >-
      Deletion, phenotype and complementation establish that the gene is required for growth on
      substrates that depend on this oxidation.
    reference_section_type: ABSTRACT
    supporting_text: >-
      A mutant with an interrupted putative mqo gene, in which malate:quinone oxidoreductase (MQO),
      an enzyme involved in the citric acid cycle/glyoxylate cycle, was defective, showed a severe
      growth defect on ethanol and was unable to grow on acetate.
  - statement: >-
      The activity itself was measured in the wild type, which is what makes an IDA row appropriate
      alongside the mutant-based IMP.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Complementation of the mutant by the wild-type allele of the mqo gene restored wild-type
      behaviour. The wild-type expressed the dye-dependent MQO and NAD(P)-dependent malic enzymes
      (MEs).
  - statement: >-
      The specificity is established negatively as well: the quinone-dependent enzyme is the route
      in this organism because the NAD-dependent alternative is absent.
    reference_section_type: ABSTRACT
    supporting_text: >-
      However, an NAD-dependent malate dehydrogenase activity could not be detected.
  - statement: >-
      The bypass that explains why the mutant still grows on other carbon sources, which is what
      keeps the phenotype specific to ethanol and acetate rather than general.
    reference_section_type: ABSTRACT
    supporting_text: >-
      an active MQO is required for growth on ethanol or acetate, while with glucose, lactate,
      succinate or malate an apparent bypass route operates, with MEs using malate for generating
      pyruvate, which is carboxylated to oxaloacetate by PC
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Kretzschmar et al. 2002, Microbiology). Abstract-only in the cache, but the
      abstract is unusually complete: it states the locus mapping, the mutant phenotype, the
      complementation, the measured activity and the absence of the NAD-dependent alternative, so
      the rows resting on it can be judged without the full text. The work was done in strain ATCC
      17933 rather than PAO1, which the paper itself bridges by naming PA4640. It is not cited
      anywhere in this entry's UniProt record - see the MISSING_STATEMENT defect on the IDA row.
