        PMID:10984043
      corrected_value: >-
        cite PMID:12480887 and reflect its in-species experimental evidence
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The entry cites two references: an EMBL submission dated July 2002 (AY129296) and the PAO1
        genome paper. PMID:12480887 is absent, although it reports a deletion phenotype, a
        complementation and a measured dye-dependent MQO activity, and maps its gene to PA4640 in
