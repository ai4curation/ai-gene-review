- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: located_in
  supporting_entities:
  - FB:FBgn0002021
  - MGI:MGI:2183102
  - PANTHER:PTN000354057
