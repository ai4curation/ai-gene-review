- term:
    id: GO:0016614
    label: oxidoreductase activity, acting on CH-OH group of donors
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028437
  review:
    summary: >-
      A true ancestor of the accepted activity, so uninformative rather than wrong. Not the
      wrong-branch case found on soxA.
    action: TOO_GENERAL
    reason: >-
      The claim is true and the term is simply imprecise once GO:0008924 is accepted on this gene
      with direct evidence. Malate oxidation does act on a CH-OH group, and OLS confirms the
      subsumption rather than my assuming it: GO:0008924's ancestors run through GO:0016901
      (CH-OH donor, quinone acceptor) to GO:0016614 and on to GO:0016491.
      That check mattered, because this row first looked like the defect found on soxA in batch 4,
      where GO:0016614 was REMOVEd as the wrong oxidoreductase branch. It is the opposite case.
      soxA's accepted activity GO:0008115 sarcosine oxidase sits under GO:0016645, the CH-NH donor
      branch, with GO:0016614 nowhere among its ancestors - sarcosine oxidation acts on a carbon
      nitrogen bond, not a hydroxyl. Same term, opposite verdicts, decided by looking at the
      ancestry each time rather than by analogy from the earlier gene.
      TOO_GENERAL rather than REMOVE or MARK_AS_OVER_ANNOTATED: the row says nothing false, it just
      says less than the review already asserts elsewhere. The three merged P. putida siblings
      mqo1, mqo2 and mqo3 all reached TOO_GENERAL on this same term, so this is unanimity with the
      family rather than a split.
    supported_by:
    - reference_id: file:PSEAE/mqo2/mqo2-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=(S)-malate + a quinone = a quinol + oxaloacetate;'
- term:
