    label: tricarboxylic acid cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006231
  - UniRule:UR000034411
  - UniPathway:UPA00223
  review:
    summary: >-
      The process the accepted activity performs a step of, supported by this gene's own mutant
      phenotype as well as the rule.
    action: ACCEPT
    reason: >-
      Accepted as core. This is a participation claim and it passes the test: the gene product
      itself catalyses a step of the cycle, the malate-to-oxaloacetate oxidation, which the curated
      pathway statement on the record places as "tricarboxylic acid cycle; oxaloacetate from
      (S)-malate (quinone route): step 1/1". It is not a necessity claim dressed up as
      participation.
      The mutant phenotype corroborates it in the right way: growth fails on ethanol and acetate,
      which enter through the glyoxylate cycle and so require this oxidation, and survives on
      substrates where malic enzymes and pyruvate carboxylase can make oxaloacetate instead. A
      protein merely required for the cycle would not show that pattern.
      Consistent with the three merged P. putida siblings, which all accept this term.
