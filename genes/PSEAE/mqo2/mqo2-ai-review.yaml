  - UniProtKB:Q38A60
  - UniProtKB:Q5JFG7
  - UniProtKB:Q96CU9
  - UniProtKB:Q9UI17
  review:
    summary: >-
      True but as coarse as the deep eukaryote-seeded node that produced it. Kept, with the
      granularity problem recorded rather than papered over.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept, because the claim is right: the catalytic face of a bacterial MQO is cytoplasmic, the
      record carries no signal peptide or transmembrane segment, and malate is a cytoplasmic
      metabolite.
      The row's provenance was examined rather than taken on trust, which is what the project asks
      for a synthesis row on a compartment. PTN000354057 is a deep node and its donor list is
      entirely eukaryotic - fly, mouse, rat, yeast, Arabidopsis and four human accessions - with no
      malate:quinone oxidoreductase among them. So this is a compartment asserted across a wide
      flavoprotein clade, not a transfer from a characterised MQO, and it stops at the organelle-free
      generality a node that wide can support.
      Non-core rather than core: the second substrate of the accepted reaction is a membrane quinone,
      so the enzyme has to work at the inner membrane, and "cytoplasm" names the side it faces
      without naming the surface it works on. Nothing available fixes that - the entry has no
      SUBCELLULAR LOCATION line at all, and the dye-dependent assay does not report a fraction - so
      no sub-compartment row is proposed and the gap is recorded on the core function instead.
      Noted for a later family pass, not acted on here: PTHR43104-review.yaml leaves this node
      unresolved precisely because "no reviewed TCA member receives it", and this gene is a reviewed
      TCA member that does. Keeping the row means nothing in this review conflicts with the family
      review, so no shared-file edit is forced into this PR.
    supported_by:
    - reference_id: file:PSEAE/mqo2/mqo2-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=(S)-malate + a quinone = a quinol + oxaloacetate;'
core_functions:
- description: >-
    Flavin-dependent oxidation of (S)-malate to oxaloacetate with a membrane quinone as the
    electron acceptor, which is this organism's only route for that step: no NAD-dependent malate
    dehydrogenase activity is detectable in it. The step belongs to the tricarboxylic acid cycle and
    is indispensable when carbon enters through the glyoxylate cycle, as it does on ethanol and
    acetate; on other substrates the cell can reach oxaloacetate instead through malic enzymes and
    pyruvate carboxylase, which is why the mutant's defect is confined to those two carbon sources.
  molecular_function:
    id: GO:0008924
    label: L-malate dehydrogenase (quinone) activity
  directly_involved_in:
  - id: GO:0006099
    label: tricarboxylic acid cycle
  supported_by:
  - reference_id: PMID:12480887
    reference_section_type: ABSTRACT
    supporting_text: >-
      Complementation of the mutant by the wild-type allele of the mqo gene restored wild-type
      behaviour. The wild-type expressed the dye-dependent MQO and NAD(P)-dependent malic enzymes
      (MEs).
  - reference_id: PMID:12480887
    reference_section_type: ABSTRACT
    supporting_text: >-
      However, an NAD-dependent malate dehydrogenase activity could not be detected.
  knowledge_gaps:
  - gap_statement: >-
      Where the enzyme sits is not established. The reaction needs a membrane quinone, so the
      protein must work at the inner membrane, but there is no localisation experiment and no
      SUBCELLULAR LOCATION statement on the record; whether it is a peripheral membrane enzyme, part
      of a respiratory supercomplex, or soluble and dependent on a mobile carrier is unknown. No
      locations term is asserted on this core function for that reason.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Which quinone the enzyme reduces in vivo has not been determined. The curated reaction is
      written with a generic quinone and the only assay reported is dye-dependent, so whether it
      feeds ubiquinone, menaquinone or both - and therefore where its electrons enter the
      respiratory chain - is open.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Why this organism carries two malate:quinone oxidoreductases is unexplained. PA4640 is mqo2 or
      mqoB, implying a paralogue, and the mutant phenotype here is specific to ethanol and acetate
      rather than absolute, so whether the second enzyme is redundant, condition-specific or
      differently localised has not been tested.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Should the PTHR43104 GO:0005737 node (PTN000354057) now be resolved? The family review left it
    unresolved on the stated grounds that no reviewed TCA member receives the term, and this gene is
    a reviewed TCA member that does. The question is whether a cytoplasm assertion across a clade
    whose donors are all eukaryotic says anything useful about bacterial members whose substrate is
    a membrane quinone.
- question: >-
    Does UniProt treat experimental work in one strain as protein-level evidence for another strain's
    entry of the same species? The answer decides whether the MISSING_STATEMENT request on this
    record should also change PE 3 to PE 1, or only add the citation and drop "Probable".
suggested_experiments:
- description: >-
    Fractionate the dye-dependent MQO activity to settle the localisation gap. Separating cytosol
    from inner membrane and assaying each, with the deletion strain as the negative control, would
    establish whether the enzyme is peripheral to the membrane or genuinely soluble - which the
    accepted cytoplasm row cannot currently distinguish.
- description: >-
    Test the two paralogues against each other by constructing single and double deletions and
    scoring growth on ethanol, acetate and the bypass substrates. If the single mutant's defect is
    partial because the second enzyme compensates, the double mutant should fail on substrates where
    this one alone does not, which would say what the duplication is for.
