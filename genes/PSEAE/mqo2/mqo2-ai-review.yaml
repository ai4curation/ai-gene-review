id: Q9HVF1
gene_symbol: mqo2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  Mqo2 (PA4640, also mqoB) is a flavin-dependent malate:quinone oxidoreductase of Pseudomonas
  aeruginosa. It oxidises (S)-malate to oxaloacetate and passes the electrons to a membrane quinone
  rather than to NAD, which is the organism's route for that step of the tricarboxylic acid cycle:
  no NAD-dependent malate dehydrogenase activity is detectable in this species. Because the
  reaction is irreversible in practice and feeds the respiratory chain directly, the enzyme is
  needed wherever oxaloacetate must be made from malate rather than from pyruvate. Cells lacking it
  grow poorly on ethanol and not at all on acetate, substrates that enter metabolism through the
  glyoxylate cycle and so depend on this oxidation, while glucose, lactate, succinate and malate
  still support growth through a bypass in which malic enzymes convert malate to pyruvate and
  pyruvate carboxylase makes oxaloacetate from that.
