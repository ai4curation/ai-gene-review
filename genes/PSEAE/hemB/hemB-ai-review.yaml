id: Q59643
gene_symbol: hemB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  HemB (PA5243) is the porphobilinogen synthase (5-aminolevulinate dehydratase, EC 4.2.1.24) of Pseudomonas
  aeruginosa. It condenses two molecules of 5-aminolevulinate in an aldol-like reaction to form porphobilinogen,
  the first pyrrole and the first committed step of tetrapyrrole biosynthesis, which in this organism
  supplies heme and the other tetrapyrrole cofactors. The enzyme is a cytoplasmic Mg2+-dependent homooctamer
  formed from dimers; many crystal structures with substrate analogues and inhibitors, including one showing
  Mg2+ in the active site, support a mechanism that begins with C-C bond formation between the two substrate
  molecules. The gene was cloned by complementation of an E. coli hemB mutant and is not obviously regulated
  by oxygen, nitrate, heme or iron.
