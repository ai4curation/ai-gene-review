suggested_questions:
- question: >-
    How is GDP-mannose partitioned between the alginate (AlgA), A-band (WbpW)
    and Psl (PslB) pathways when the three paralogous PMI-GMPs are co-expressed?
suggested_experiments:
- description: >-
    Measure intracellular GDP-mannose and alginate output in algA, wbpW and
    pslB single and combined deletions of a mucoid strain, to test whether the
    paralogues can substitute for AlgA in alginate synthesis.
