taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  AlgA (PA3551) is the bifunctional phosphomannose isomerase / GDP-mannose
  pyrophosphorylase (PMI-GMP) of the alginate biosynthetic pathway, encoded as
  the last gene of the alginate operon. Its C-terminal type II PMI cupin domain
  converts fructose 6-phosphate to mannose 6-phosphate, which the
  phosphomannomutase AlgC converts to mannose 1-phosphate; its N-terminal
  nucleotidyltransferase domain then condenses mannose 1-phosphate with GTP to
  give GDP-mannose. GDP-mannose is oxidised by AlgD to GDP-mannuronic acid, the
  donor for alginate polymerisation. The purified enzyme is a monomer of about
  54 kDa; the PMI reaction is stimulated by Co2+ and both reactions need Mg2+.
  The paralogues WbpW and PslB supply GDP-mannose for A-band LPS and the Psl
  exopolysaccharide.
