    reason: >-
      AlgA makes the GDP-mannose that AlgD oxidises to the alginate donor
      GDP-mannuronic acid, so it performs early steps of alginate synthesis.
      The abstract reports the algA mutation that lowers both activities; the
      alginate phenotype is not stated in the abstract but is the basis of the
