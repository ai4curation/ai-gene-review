id: G3XDA8
gene_symbol: pstS
product_type: PROTEIN
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
status: COMPLETE
description: >-
  PstS (PA5369) is the substrate-binding component of the Pst high-affinity phosphate importer of
  Pseudomonas aeruginosa, and it occupies two compartments for two purposes. In the periplasm it
  captures inorganic phosphate, one ion per molecule with sub-micromolar affinity and specificity
  for inorganic over organic phosphates, and delivers it to the transporter; cells lacking it keep
  only a low-affinity uptake system. Under phosphate limitation a portion of the protein is also
  exported to the cell surface through the alternative Hxc type II secretion system, where it forms
  appendages. The two roles are separable at the level of single mutations: a substitution that
  abolishes phosphate binding leaves biofilm formation intact, while truncating an unusual
  15-residue N-terminal loop impairs biofilm formation without affecting binding or uptake. So the
  protein sits at a junction between phosphate acquisition and surface organisation rather than
  doing the second as a consequence of the first.
