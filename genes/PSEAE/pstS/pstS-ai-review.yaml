    label: phosphate ion binding
  evidence_type: IDA
  original_reference_id: PMID:6436026
  qualifier: enables
  review:
    summary: >-
      The gene's core molecular function, measured on the purified protein with a stoichiometry,
      an affinity and a specificity test.
    action: ACCEPT
    reason: >-
      About as directly supported as a binding annotation can be. One phosphate per molecule, Kd
      0.34 micromolar, and the specificity is discriminating rather than assumed: arsenate,
      pyrophosphate and polyphosphates competed while glucose 6-phosphate, glycerol 3-phosphate
      and AMP did not, so the site reads inorganic phosphate and not phosphomonoesters generally.
      Accepted as core.
    supported_by:
