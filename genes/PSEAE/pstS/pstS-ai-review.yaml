- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:18282104
  qualifier: located_in
  review:
    summary: >-
      The surface pool is real and this reference establishes it, but the term is the wrong one of
      a mutually exclusive pair: GO reserves extracellular region for products that are not
      attached to the cell.
    action: MODIFY
    reason: >-
      GO's own term comments decide this, and they are explicit. GO:0009986 cell surface is
      "intended to annotate gene products that are attached (integrated or loosely bound) to the
      plasma membrane or cell wall"; GO:0005576 extracellular region is "intended to annotate gene
      products that are not attached to the cell surface. For gene products at the cell surface,
      consider a[nother term]". OLS confirms the two are not parent and child — GO:0005576 is not
      among GO:0009986's ancestors — so they are alternatives distinguished by attachment, and
      this is a lateral correction rather than a refinement. What the reference reports is attached
      protein: "outer surface PstS", forming "appendages", and reduced in a secretion mutant. The
      row's own evidence therefore supports the cell-surface term and not this one. The underlying
      observation is not disputed, which is why the action is MODIFY and not REMOVE.
    proposed_replacement_terms:
    - id: GO:0009986
      label: cell surface
    supported_by:
    - reference_id: PMID:18282104
      reference_section_type: RESULTS
      supporting_text: >-
        Formation of the PstS rich appendages was induced during phosphate limitation and
        completely suppressed in phosphate-rich media.
    - reference_id: PMID:18282104
      reference_section_type: RESULTS
      supporting_text: >-
        significantly less outer surface PstS was observed in the MPAO1 mutant DeltaHxcR thus
        establishing a role for the alternative type II secretion system Hxc in outer surface PstS
        expression
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0005576
      corrected_value: GO:0009986
      corrected_label: cell surface
      confidence: PROBABLE
      explanation: >-
        The GO:0005576 extracellular region row on PA5369 (UniProtKB:G3XDA8), evidence EXP from
        PMID:18282104, appears to use the wrong member of a mutually exclusive pair. GO's comment
        on GO:0005576 states it is "intended to annotate gene products that are not attached to the
        cell surface. For gene products at the cell surface, consider a[nother term]", and the
        comment on GO:0009986 cell surface states it is for products "attached (integrated or
        loosely bound) to the plasma membrane or cell wall". GO:0005576 is not an ancestor of
        GO:0009986, so one does not subsume the other. The cited paper describes attached protein
        throughout: "outer surface PstS", "Formation of the PstS rich appendages", and a reduction
        in surface PstS in a DeltaHxcR secretion mutant. Marked PROBABLE rather than CONFIRMED
        because a type II secretion system can release protein as well as display it, so a
        genuinely released fraction may exist even though the evidence presented is for
        surface-associated protein. Requested change: repoint this row to GO:0009986, or retain
        GO:0005576 only if a released, unattached pool has been demonstrated.
      supported_by:
      - reference_id: PMID:18282104
        reference_section_type: RESULTS
        supporting_text: >-
          significantly less outer surface PstS was observed in the MPAO1 mutant DeltaHxcR thus
          establishing a role for the alternative type II secretion system Hxc in outer surface
          PstS expression
