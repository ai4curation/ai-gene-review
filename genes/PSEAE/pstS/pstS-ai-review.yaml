- id: PMID:6436026
  title: >-
    Phosphate transport in Pseudomonas aeruginosa. Involvement of a periplasmic phosphate-binding
    protein.
  findings:
  - statement: >-
      The protein was purified from osmotic-shock fluid, which is the periplasmic fraction, so the
      compartment is established by the preparation itself.
    reference_section_type: ABSTRACT
    supporting_text: >-
      A binding protein for inorganic phosphate was purified to apparent homogeneity from the shock
      fluids of phosphate-limited Pseudomonas aeruginosa.
  - statement: >-
      Binding was quantified on the purified protein, with a stoichiometry and an affinity.
    reference_section_type: ABSTRACT
    supporting_text: >-
      The purified protein bound one molecule of phosphate per molecule of binding protein with an
      average Kd of 0.34 microM.
  - statement: >-
      Loss of the protein removes the high-affinity uptake system, which is what ties the binding
      activity to transport.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Mutants lacking the phosphate-binding protein were isolated and shown to be deficient in
      phosphate transport compared with wild-type cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Poole & Hancock 1984, Eur J Biochem). Abstract-only in the cache, but it
      carries the purification source, the binding stoichiometry and affinity, the specificity
      against organic phosphates and the transport phenotype, so all three rows it supports can be
      checked without the full text. Predates the PAO1 genome, so it does not name the locus; the
      protein is identified biochemically as the periplasmic phosphate-binding protein, which is
      what PA5369 encodes, and the annotation was made by UniProt rather than inferred here.
- id: PMID:18282104
  title: Structure-function aspects of PstS in multi-drug-resistant Pseudomonas aeruginosa.
  findings:
  - statement: >-
      A portion of the protein is on the outside of the cell, in appendages, and its appearance is
      controlled by the same phosphate limitation that induces the transporter.
    reference_section_type: RESULTS
    supporting_text: >-
      Formation of the PstS rich appendages was induced during phosphate limitation and completely
      suppressed in phosphate-rich media.
  - statement: >-
      The export route to the surface is identified, which is what makes the surface pool a
      destination rather than contamination.
    reference_section_type: RESULTS
    supporting_text: >-
      significantly less outer surface PstS was observed in the MPAO1 mutant DeltaHxcR thus
      establishing a role for the alternative type II secretion system Hxc in outer surface PstS
      expression
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Zaborina et al. 2008, PLoS Pathog). Full text cached. It establishes the
      second, surface location and the secretion system that produces it, and its language is
      consistently about attached protein — "outer surface PstS", "appendages" — which is why this
      review moves the location term from extracellular region to cell surface. Its virulence
      findings are not annotated here.
- id: PMID:25223609
  title: >-
    The Pseudomonas aeruginosa phosphate transport protein PstS plays a phosphate-independent role
    in biofilm formation.
  findings:
  - statement: >-
      The two activities are separable by single mutations in opposite directions, which is
      stronger than a requirement phenotype and is what supports the biofilm annotation.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Structure-based experiments showed that PstS-mediated phosphate uptake and biofilm formation
      are in fact two distinct functions. Specifically, a point mutation that abrogated phosphate
      binding did not eliminate biofilm formation; conversely, truncation of the N' loop diminished
      the ability of PA to form biofilms but had no effect on phosphate binding and uptake.
  - statement: >-
      The structural basis of both the binding site and the biofilm-associated element was
      determined, which is how the separation was designed rather than found.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Using X-ray crystallography, we characterized the unique underpinnings of PstS phosphate
      binding and identified an unusual 15-residue N' loop extension.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Zaborin et al. 2014, FASEB J). Abstract-only in the cache, but the abstract
      states the crystallography, the loop, and both halves of the separation-of-function
      experiment, so the biofilm row can be checked without the full text. This is the reference
      that makes GO:0044010 defensible on this gene.
