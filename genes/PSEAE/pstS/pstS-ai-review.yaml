- term:
    id: GO:0044010
    label: single-species biofilm formation
  evidence_type: IMP
  original_reference_id: PMID:25223609
  qualifier: involved_in
  review:
    summary: >-
      Unusually well supported for a biofilm annotation: two mutations in opposite directions
      separate this role from the transport role.
    action: ACCEPT
    reason: >-
      Accepted, and worth contrasting with how this project treated the same term on pslB, where
      it was marked over-annotated because the cited paper reported no attachment defect in the
      single mutant. Here the evidence is of a different kind. A point mutation that abolishes
      phosphate binding leaves biofilm formation intact, and truncation of an unusual 15-residue
      N-terminal loop diminishes biofilm formation without affecting binding or uptake, so the
      biofilm role is a property of an identified structural element rather than a downstream
      consequence of disturbed phosphate acquisition. That answers the question the participation
      test asks: the protein contributes to biofilm formation through a part of itself that does
      nothing else. Kept non-core only in the sense that the molecular function is the binding
      activity; the role itself is well established.
    supported_by:
    - reference_id: PMID:25223609
      reference_section_type: ABSTRACT
      supporting_text: >-
        Structure-based experiments showed that PstS-mediated phosphate uptake and biofilm
        formation are in fact two distinct functions. Specifically, a point mutation that
        abrogated phosphate binding did not eliminate biofilm formation; conversely, truncation of
        the N' loop diminished the ability of PA to form biofilms but had no effect on phosphate
        binding and uptake.
core_functions:
- description: >-
    Periplasmic substrate-binding protein of the Pst high-affinity phosphate importer: binds a
    single inorganic phosphate ion with sub-micromolar affinity, discriminating it from organic
    phosphates, and delivers it to the membrane components, which is the step that makes
    high-affinity uptake possible at all.
  molecular_function:
    id: GO:0042301
    label: phosphate ion binding
  directly_involved_in:
  - id: GO:0006817
    label: phosphate ion transport
  locations:
  - id: GO:0042597
    label: periplasmic space
  supported_by:
  - reference_id: PMID:6436026
    reference_section_type: ABSTRACT
    supporting_text: >-
      The purified protein bound one molecule of phosphate per molecule of binding protein with an
      average Kd of 0.34 microM.
  - reference_id: PMID:6436026
    reference_section_type: ABSTRACT
    supporting_text: >-
      Mutants lacking the phosphate-binding protein were isolated and shown to be deficient in
      phosphate transport compared with wild-type cells.
  knowledge_gaps:
  - gap_statement: >-
      How the N-terminal loop promotes biofilm formation is unknown. Truncating it impairs biofilm
      without touching phosphate binding or uptake, so it acts through something other than the
      transport function, but no partner, surface interaction or structural role has been
      identified for it.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      It is not known whether the periplasmic and surface pools are the same protein doing two jobs
      or a partitioned population. Export to the surface needs the Hxc secretion system and
      phosphate limitation induces both pools, so whether a molecule can serve as a transporter
      component and then be exported, or commits to one fate, is open.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Does the surface pool of PstS bind phosphate, and does that matter? A surface-displayed
    phosphate-binding protein could scavenge before uptake, or could act purely structurally in the
    appendages; the loop and binding-site mutants already exist to tell the two apart.
- question: >-
    Why is a transporter subunit routed through a second secretion system at all? Hxc is an
    alternative type II system, so the cell maintains a dedicated route for this destination, which
    suggests the surface pool is worth the investment rather than being overflow.
- question: >-
    Is the adhesive and barrier-disrupting phenotype reported for surface PstS a consequence of the
    appendages, or of PstS itself? This review does not annotate those host-interaction outcomes,
    and the distinction is what would determine whether any such annotation belongs on this gene.
suggested_experiments:
- description: >-
    Test the two separation-of-function variants for surface display and appendage formation, which
    would establish whether the N-terminal loop's biofilm role operates through the surface pool or
    the periplasmic one.
- description: >-
    Follow a pulse of labelled PstS to ask whether individual molecules move from periplasm to
    surface, distinguishing a single pool with two fates from two separately committed populations.
- description: >-
    Measure phosphate binding by intact cells displaying surface PstS, in a background lacking the
    periplasmic pool, to find out whether the surface protein retains the activity its fold
    predicts.
