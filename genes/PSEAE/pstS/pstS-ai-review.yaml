- term:
    id: GO:0006817
    label: phosphate ion transport
  evidence_type: IMP
  original_reference_id: PMID:6436026
  qualifier: involved_in
  review:
    summary: >-
      The process the binding serves, supported by the loss of high-affinity uptake in mutants
      lacking the protein.
    action: ACCEPT
    reason: >-
      The gene product does part of the work rather than merely being necessary for it: in an ABC
      importer the periplasmic binding protein captures the substrate and delivers it to the
      membrane components, which is a step of the transport and not a precondition for it. The
      genetics is specific about which step: wild-type cells show two kinetically distinct uptake
      systems and mutants lacking this protein retain only the low-affinity one, so what the
      protein contributes is the high-affinity route. Accepted as core.
    supported_by:
    - reference_id: PMID:6436026
      reference_section_type: ABSTRACT
      supporting_text: >-
        Mutants lacking the phosphate-binding protein were isolated and shown to be deficient in
        phosphate transport compared with wild-type cells.
- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: IDA
  original_reference_id: PMID:6436026
  qualifier: located_in
  review:
    summary: >-
      Established by the preparation: the protein was purified from osmotic-shock fluid, which is
      the periplasmic contents.
    action: ACCEPT
    reason: >-
      Direct and compartment-specific. Osmotic shock releases the periplasm selectively, so
      recovering the protein from shock fluid places it there rather than inferring it from a
      signal peptide. This is also where the accepted activity happens, since the binding protein
      must meet phosphate on the periplasmic face before handing it to the transporter. Accepted
      as the core location; it is not in tension with the surface location below, which is a second
      pool reached by a different route.
    supported_by:
    - reference_id: PMID:6436026
      reference_section_type: ABSTRACT
      supporting_text: >-
        A binding protein for inorganic phosphate was purified to apparent homogeneity from the
        shock fluids of phosphate-limited Pseudomonas aeruginosa.
