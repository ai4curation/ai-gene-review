    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00027128
  - UniProtKB-SubCell:SL-0243
  review:
    summary: >-
      The same term from the automatic side, via the curated secreted-location vocabulary and an
      ARBA rule.
    action: MODIFY
    reason: >-
      Refined with the EXP row above so that both rows carrying this term say the same thing. On
