suggested_questions:
- question: >-
    Does a PA4773 (speH) deletion abolish surface spermidine as the PA4774 mutant does, or is AdoMet decarboxylation
    redundant with another enzyme in P. aeruginosa?
suggested_experiments:
- description: >-
    Build an in-frame speH deletion, measure intracellular and surface spermidine by HPLC-MS with and
    without complementation, and assay recombinant SpeH for AdoMet decarboxylase activity and proenzyme
    self-cleavage.
