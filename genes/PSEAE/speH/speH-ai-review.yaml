  label: Pseudomonas aeruginosa PAO1
description: >-
  SpeH (PA4773) is a prokaryotic class 1a S-adenosylmethionine decarboxylase (AdoMetDC, EC 4.1.1.50) of
  Pseudomonas aeruginosa. It is made as a 160-residue proenzyme that self-cleaves by serinolysis into
  a beta and an alpha chain, generating the pyruvoyl group at the alpha-chain N-terminus that forms the
  catalytic Schiff base. The enzyme decarboxylates S-adenosylmethionine to decarboxylated AdoMet, the
  aminopropyl donor used by the neighbouring spermidine synthase SpeE2 (PA4774) to convert putrescine
  into spermidine. PA4773 is the first gene of the PA4773-PA4775 operon, which is induced by extracellular
  DNA, magnesium limitation and cationic antimicrobial peptides; the spermidine made by this pathway is
  displayed on the cell surface, where it protects the outer membrane against polymyxin B, aminoglycosides
  and oxidative damage.
