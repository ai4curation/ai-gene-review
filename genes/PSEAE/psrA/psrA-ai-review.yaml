core_functions:
- description: Sequence-specific DNA-binding transcription factor of the TetR family that represses fatty
    acid beta-oxidation genes (fadBA5) and its own gene, with repression relieved by long-chain fatty
    acids, and activates rpoS and the type III secretion regulatory operon exsCEBA.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
