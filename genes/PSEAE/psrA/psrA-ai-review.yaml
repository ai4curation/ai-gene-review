  title: Novel target genes of PsrA transcriptional regulator of Pseudomonas aeruginosa.
  findings:
  - statement: PsrA binds a palindromic motif and regulates targets positively and negatively; it autorepresses
      and regulates rpoS.
    supporting_text: Promoters PA0506 and PA2952-PA2951 were regulated negatively whereas promoters of
      PA2953 and PA3571 were regulated positively by PsrA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: CollecTF source for IDA GO:0045892. Abstract only in the cache.
- id: PMID:16428760
  title: PsrA is a positive transcriptional regulator of the type III secretion system in Pseudomonas
    aeruginosa.
  findings:
  - statement: PsrA is required for full exsCEBA and exoS transcription.
    supporting_text: Using transcriptional fusions, we demonstrated that PsrA is required for the full
      activation of transcription of the TTSS regulatory operon exsCEBA and effector exoS
  - statement: T3SS effector secretion falls in the psrA mutant.
    supporting_text: The psrA mutant showed a marked decrease in the secretion of the type III effectors
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PseudoCAP source for the IMP GO:0045893 and GO:0050714 rows. Full text cached and read.
      Supports positive transcriptional regulation of exsCEBA (directness left open by the authors) and,
      indirectly, type III effector secretion.
- id: PMID:18524913
  title: The Pseudomonas aeruginosa PsrA responds to long-chain fatty acid signals to regulate the fadBA5
    beta-oxidation operon.
  findings:
  - statement: PsrA binds the fadBA5 promoter; LCFAs disrupt the binding.
    supporting_text: Electrophoretic mobility shift assays indicate specific binding of PsrA to the fadBA5
      promoter region. This binding is disrupted by specific LCFAs
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: CollecTF source for EXP GO:0045892. Abstract only in the cache; abstract states EMSA
      binding, LCFA disruption and PsrA-dependent fadBA5 induction.
