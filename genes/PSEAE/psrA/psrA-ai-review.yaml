  - *id004
  - *id006
suggested_questions:
- question: Does PsrA bind the exsCEBA promoter directly in vivo, or does it activate exsCEBA through
    another regulator?
- question: Which long-chain fatty acid or acyl species is the physiological PsrA ligand in the cell,
    and does ligand binding also modulate PsrA activation of rpoS and exsCEBA?
suggested_experiments:
- description: ChIP-seq of PsrA with and without oleate supplementation, combined with DNase I footprinting
    on the exsCEBA promoter, to separate direct from indirect targets.
  experiment_type: ChIP-seq and footprinting
