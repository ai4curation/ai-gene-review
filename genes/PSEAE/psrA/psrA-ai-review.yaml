taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PsrA (PA3006) is a TetR-family transcription factor with an N-terminal helix-turn-helix DNA-binding
  domain and a PsrA-type C-terminal ligand-binding domain. It binds a palindromic motif (G/CAAAC N2-4
  GTTTG/C) in target promoters and acts as a global regulator. It represses its own gene and the fadBA5
  beta-oxidation operon; long-chain fatty acids (oleate, palmitate, myristate) disrupt PsrA binding to
  the fadBA5 promoter and so induce fatty acid degradation genes. PsrA activates rpoS in stationary phase,
  and it is required for full transcription of the type III secretion regulatory operon exsCEBA, so it
  supports type III effector secretion. Other targets are regulated positively or negatively.
