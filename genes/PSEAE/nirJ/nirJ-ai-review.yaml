- id: PMID:8982003
  title: 'Gene cluster for dissimilatory nitrite reductase (nir) from Pseudomonas aeruginosa: sequencing and
    identification of a locus for heme d1 biosynthesis.'
  findings:
  - statement: nirJ, in the nirSMCFDLGHJEN cluster, is necessary for heme d1 biosynthesis by insertion and
      complementation.
    supporting_text: Insertional mutation and complementation analyses showed that all of the nirFDLGHJE genes
      were necessary for the biosynthesis of heme d1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cited by PseudoCAP for GO:0006783 (IMP), the sole seed of the IBD at PTN000132400. PubMed
      record matches; abstract only (no PMC body text returned for PMC178684). Supports heme d1 synthesis,
      which falls under the broad GO heme term; it does not concern protoheme.
- id: PMID:20420837
  title: NirJ, a radical SAM family member of the d1 heme biogenesis cluster.
  findings:
  - statement: Purified NirJ has a 4Fe-4S centre and binds SAM, as a radical SAM enzyme.
    supporting_text: The purified protein was found to contain a 4Fe-4S centre, in line with the prediction
      that it belongs to the radical SAM class of enzymes.
- id: PMID:29076625
  title: The Radical SAM enzyme NirJ catalyzes the removal of two propionate side chains during heme d(1)
    biosynthesis.
  findings:
  - statement: NirJ binds 12,18-didecarboxysiroheme and removes its two propionate side chains with SAM
      cleavage; keto groups are not introduced in vitro.
    supporting_text: we show that NirJ indeed catalyzes the removal of the two propionate side chains under
      simultaneous SAM cleavage.
- id: PMID:40318205
  title: The radical SAM enzyme NirJ cleaves off two propionate side chains with the release of acrylate during
    heme d(1) biosynthesis.
  findings:
  - statement: Dinoroseobacter shibae NirJ has an auxiliary [4Fe-4S] cluster and releases acrylate; it is
      related to AhbC of the siroheme-dependent heme pathway.
    supporting_text: We show that acrylate is released during the NirJ reaction as the cleavage byproduct
core_functions:
- description: Radical SAM enzyme of heme d1 biosynthesis that removes the propionate side chains from rings A
    and B of 12,18-didecarboxysiroheme, using a SAM-cleaving and an auxiliary [4Fe-4S] cluster; inferred for
    PA0511 from nirJ mutant genetics and ortholog biochemistry.
  proposed_molecular_function: 12,18-didecarboxysiroheme propionate-cleaving radical SAM activity
  directly_involved_in:
  - id: GO:0006783
    label: heme biosynthetic process
  supported_by:
  - reference_id: PMID:29076625
    supporting_text: we show that NirJ indeed catalyzes the removal of the two propionate side chains under
      simultaneous SAM cleavage.
  - reference_id: PMID:8982003
    supporting_text: Insertional mutation and complementation analyses showed that all of the nirFDLGHJE genes
      were necessary for the biosynthesis of heme d1.
proposed_new_terms:
- proposed_name: 12,18-didecarboxysiroheme propionate-cleaving radical SAM activity
  proposed_definition: Catalysis of the S-adenosyl-L-methionine-dependent radical removal of the propionate
    side chains from pyrrole rings A and B of 12,18-didecarboxysiroheme, with release of acrylate, during
    heme d1 biosynthesis.
  justification: The NirJ reaction has been shown in vitro but has no GO molecular function term, so NirJ
    proteins can only be annotated to catalytic activity.
  proposed_parent:
    id: GO:0003824
    label: catalytic activity
  supported_by:
  - reference_id: PMID:29076625
    supporting_text: we show that NirJ indeed catalyzes the removal of the two propionate side chains under
      simultaneous SAM cleavage.
  - reference_id: PMID:40318205
    supporting_text: We show that acrylate is released during the NirJ reaction as the cleavage byproduct
- proposed_name: heme d1 biosynthetic process
  proposed_definition: The chemical reactions and pathways resulting in the formation of heme d1, the iron
    dioxo-isobacteriochlorin prosthetic group of cytochrome cd1 nitrite reductase, from siroheme.
  justification: Heme d1 enzymes (NirF, NirDLGH, NirJ, NirE) can only be annotated to the broad heme
    biosynthetic process, which most readers take to mean protoheme; a child term parallel to siroheme
    biosynthetic process would make these annotations precise.
  proposed_parent:
    id: GO:0006783
    label: heme biosynthetic process
  supported_by:
  - reference_id: PMID:8982003
    supporting_text: Insertional mutation and complementation analyses showed that all of the nirFDLGHJE genes
      were necessary for the biosynthesis of heme d1.
suggested_questions:
- question: Does P. aeruginosa NirJ itself also introduce the keto groups at C3 and C8, or is a second enzyme
    (for example NirN or NirF) required?
suggested_experiments:
- description: Purify P. aeruginosa NirJ (PA0511) and assay propionate removal from 12,18-didecarboxysiroheme,
    alone and with NirN/NirF, to identify the product and whether the keto groups are formed.
  experiment_type: in vitro enzyme assay with HPLC-MS product analysis
