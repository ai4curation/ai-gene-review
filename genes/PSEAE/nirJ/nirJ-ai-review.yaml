taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: nirJ encodes a radical S-adenosyl-L-methionine (SAM) enzyme of the heme d1 biosynthesis pathway,
  encoded in the nirSMCFDLGHJEN cluster that supports anaerobic denitrification through cytochrome cd1
  nitrite reductase (NirS). Heme d1, the iron dioxo-isobacteriochlorin cofactor of NirS, is made from
  siroheme; NirJ acts on the intermediate 12,18-didecarboxysiroheme, cleaving off the propionate side chains
  of rings A and B with release of acrylate. The protein has an N-terminal radical SAM domain with the
  CxxxCxxC motif that binds the SAM-cleaving [4Fe-4S] cluster and a C-terminal SPASM-type region carrying an
  auxiliary [4Fe-4S] cluster. Insertional inactivation of nirJ abolishes heme d1 formation in P.
  aeruginosa.
