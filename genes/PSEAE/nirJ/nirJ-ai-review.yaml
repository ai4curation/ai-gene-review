- term:
    id: GO:0006783
    label: heme biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:8982003
  qualifier: involved_in
  review:
    summary: PseudoCAP IMP; insertion and complementation show nirJ is needed for heme d1 synthesis. Sole seed
      of the GO:0006783 IBD at PTN000132400.
    action: ACCEPT
    reason: The paper's mutant result shows necessity, and complementation addresses polarity on the
      downstream nirE. Participation (not just necessity) is established by later biochemistry showing that
      NirJ itself removes the two propionate side chains from 12,18-didecarboxysiroheme. GO has no heme d1
      term, and siroheme biosynthesis is already a child of GO:0006783, so this is the most precise term
      available. A heme d1 biosynthetic process NTR is proposed.
    supported_by:
    - reference_id: PMID:8982003
      supporting_text: Insertional mutation and complementation analyses showed that all of the nirFDLGHJE
        genes were necessary for the biosynthesis of heme d1.
    - reference_id: PMID:29076625
      supporting_text: we show that NirJ indeed catalyzes the removal of the two propionate side chains under
        simultaneous SAM cleavage.
