suggested_questions:
- question: >-
    Should the swarming defect of bifA mutants be captured as positive regulation of
    swarming motility, given that it is independent of Pel and follows from raised
    c-di-GMP?
suggested_experiments:
- description: >-
    Measure kcat and Km of purified full-length BifA with and without GTP, to
    quantify how GTP binding to the GGDQF domain regulates the EAL domain.
