core_functions:
- description: >-
    Inner-membrane EAL-domain c-di-GMP phosphodiesterase, regulated by GTP binding
    to its degenerate GGDEF domain, that lowers c-di-GMP to restrain Pel-dependent
    biofilm formation and permit swarming.
