gene_symbol: bifA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  BifA (PA4367) is an inner-membrane c-di-GMP-specific phosphodiesterase with a
  single transmembrane segment, a degenerate GGDEF domain (GGDQF) and a catalytic
  EAL domain. Purified BifA hydrolyses c-di-GMP but has no detectable diguanylate
  cyclase activity. Its inactive GGDEF domain binds GTP, which regulates the
  adjacent EAL domain, and BifA interacts with the c-di-GMP receptor PelD. By
  degrading c-di-GMP, BifA keeps cellular c-di-GMP low: a bifA deletion has raised
  c-di-GMP, overproduces Pel polysaccharide, forms hyperbiofilms, swarms poorly and
  reverses its flagellar motor less often. BifA thus inversely regulates biofilm
  formation and swarming motility, acting genetically upstream of SadB. The
  regulator HecE inhibits BifA to raise c-di-GMP in a subpopulation of
  surface-attached cells.
references:
- id: PMID:17586641
  title: BifA, a cyclic-Di-GMP phosphodiesterase, inversely regulates biofilm formation
    and swarming motility by Pseudomonas aeruginosa PA14.
  findings:
  - statement: Purified BifA has PDE activity and no detectable DGC activity.
    supporting_text: purified BifA protein exhibits phosphodiesterase activity in vitro
      but no detectable diguanylate cyclase activity
  - statement: Catalytic-motif mutants are stable but fail to complement the hyperbiofilm
      phenotype.
    supporting_text: In contrast, expression of either His-BifA-AAAAA or His-BifA-AAL
      fails to suppress the hyperbiofilm phenotype of the Δ bifA mutant.
  - statement: Deletion causes hyperbiofilm and a swarming defect.
    supporting_text: Deletion of the PA4367 gene results in a severe defect in swarming
      motility and a hyperbiofilm phenotype
  - statement: BifA is in the inner membrane.
    supporting_text: BifA localizes to the inner membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source of all three IMP rows and of the bifA seedings of
      PTN002105365 and PTN009140332. Full text cached and read. The MF claim also has
      purified-protein (IDA-type) support.
- id: PMID:38197635
  title: Binding of GTP to BifA is required for the production of Pel-dependent biofilms
    in Pseudomonas aeruginosa.
  findings:
  - statement: The degenerate GGDEF domain binds GTP and regulates the EAL domain.
    supporting_text: Here we demonstrate that the inactive GGDEF domain of BifA binds
      GTP and regulates the adjacent phosphodiesterase EAL domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:37291227
  title: A genetic switch controls Pseudomonas aeruginosa surface colonization.
  findings:
  - statement: HecE inhibits BifA.
    supporting_text: HecE inhibits the phosphodiesterase BifA and stimulates the diguanylate
      cyclase WspR
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:33495218
  title: Induction of Native c-di-GMP Phosphodiesterases Leads to Dispersal of Pseudomonas
    aeruginosa Biofilms.
  findings:
  - statement: Induction of native BifA or PA2133 disperses established biofilms.
    supporting_text: here, we demonstrate that the induction of the P. aeruginosa
      c-di-GMP phosphodiesterases PA2133 and BifA indeed results in the dispersal
      of P. aeruginosa biofilms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Overexpression study.
