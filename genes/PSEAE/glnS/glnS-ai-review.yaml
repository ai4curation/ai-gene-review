  review:
    summary: GlnS directly performs aminoacyl-tRNA synthesis for protein translation.
    action: MODIFY
    reason: This enzyme executes the amino-acid attachment step, so participation is catalytic rather
      than inferred from a loss-of-function phenotype. The current QuickGO record marks the substrate-specific
      process term obsolete; use the active protein-translation charging process while retaining substrate
      specificity in the molecular function. The original machine-sourced term and evidence remain unchanged.
      The original glutamyl-specific label also names the wrong amino acid for GlnS; the supported present-day
      process is glutaminyl-tRNA production for translation, not glutamate ligation.
