  label: Pseudomonas aeruginosa PAO1
description: GlnS supplies the direct glutaminyl-tRNA synthetase route in Pseudomonas aeruginosa PAO1,
  ligating glutamine to tRNA(Gln) using ATP. It acts in cytoplasmic translation alongside a discriminating
  GluRS; the organism separately uses non-discriminating AspRS and GatCAB for Asn-tRNA(Asn) formation.
