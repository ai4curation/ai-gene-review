suggested_questions:
- question: >-
    Is P. aeruginosa DctQ correctly placed in the YiaM-type PANTHER clade
    PTHR35011/PTN002169725, or does the tree mix C4-dicarboxylate and
    2,3-diketo-L-gulonate TRAP permeases under one node?
suggested_experiments:
- description: >-
    [14C]-succinate and [14C]-malate uptake in a dctA background with an
    in-frame dctQ deletion and complementation, to attribute the operon
    phenotype to DctQ and measure the high-affinity Km.
  experiment_type: transport assay
