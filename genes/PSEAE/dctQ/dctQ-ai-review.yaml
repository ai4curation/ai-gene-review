  review:
    summary: >-
      IBA from PTN002169725, whose IBD for this term rests solely on DctQ's
      own PseudoCAP IMP. True for DctQ, where the specific substrates and
      direction (import) are known; but the node term does not suit the
      clade.
    action: MODIFY
    reason: >-
      DctQ in its own WITH/FROM marks its experimental seed and is expected.
      For DctQ the claim is correct, and the precise terms are malate import
      across plasma membrane, succinate import across plasma membrane and
      fumarate transport, all descendants of C4-dicarboxylate transport and
