      matter. PTN002169725 is a YiaM-type TRAP small-permease clade (PANTHER
      PTHR35011 is named for E. coli YiaM), with 24 leaves including E. coli
      and Salmonella YiaM, two Haemophilus, several Bradyrhizobium and
      Geobacter, Dictyoglomus and Yersinia members. E. coli YiaMNO transports
      2,3-diketo-L-gulonate, not a C4-dicarboxylate. In TRAP transporters the
      substrate is set by the DctP-type binding protein, so a C4-dicarboxylate
      term placed on the whole clade is over-specific (see source_defects).
    propagation_review:
