- term:
    id: GO:0015740
    label: C4-dicarboxylate transport
  evidence_type: IMP
  original_reference_id: PMID:21725012
  qualifier: involved_in
  review:
    summary: >-
      Deleting dctPQM in a dctA background abolishes growth on malate and
      fumarate; competition experiments show DctPQM is the high-affinity
      succinate carrier. The claim is sound; the specific substrates and
      direction are known.
    action: MODIFY
    reason: >-
      Growth on a sole carbon source is an indirect read-out of transport,
      but here the double mutant removes only the two transporters, the
      operon is induced by its substrates, and competition experiments
      separate DctPQM from DctA. DctQ, as a TRAP permease, forms part of the
      translocation pathway, so it does part of the work. The deletion is of
      the whole dctPQM operon, so the phenotype is not specific to DctQ, but
      DctQ is essential to TRAP function. The more precise terms are the
      substrate-specific import processes.
    proposed_replacement_terms:
    - id: GO:0098714
      label: malate import across plasma membrane
    - id: GO:0098720
      label: succinate import across plasma membrane
    - id: GO:0015741
      label: fumarate transport
    supported_by:
    - reference_id: PMID:21725012
      supporting_text: >-
        The ΔdctA ΔdctPQM double mutant showed no growth on malate and fumarate
        and residual growth on succinate, suggesting that DctA and DctPQM are
        the only malate and fumarate transporters
    - reference_id: PMID:21725012
      supporting_text: >-
        Competition experiments demonstrated that the DctPQM carrier was more
        efficient than the DctA carrier for the utilization of succinate at
        micromolar concentrations
    - reference_id: file:PSEAE/dctQ/dctQ-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        FUNCTION: Part of the tripartite ATP-independent periplasmic (TRAP)
        transport system DctPQM involved in C4-dicarboxylates uptake.
