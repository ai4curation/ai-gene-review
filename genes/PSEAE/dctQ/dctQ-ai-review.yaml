  label: Pseudomonas aeruginosa PAO1
description: >-
  DctQ (PA5168) is the small integral inner-membrane permease subunit of
  DctPQM, a tripartite ATP-independent periplasmic (TRAP) transporter of
  Pseudomonas aeruginosa. It has four predicted transmembrane helices and,
  with the large permease DctM and the periplasmic substrate-binding protein
  DctP, imports the C4-dicarboxylates succinate, fumarate and malate. DctPQM
  is the high-affinity system that dominates succinate uptake at micromolar
  concentrations, and it works alongside the low-affinity DctA carrier.
  Expression of the dctPQM operon is induced by C4-dicarboxylates and depends
  on RpoN and the DctB/DctD two-component system.
