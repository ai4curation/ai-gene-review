- term:
    id: GO:0031317
    label: tripartite ATP-independent periplasmic transporter complex
  evidence_type: IC
  original_reference_id: PMID:21725012
  qualifier: part_of
  review:
    summary: >-
      DctQ is the small permease of the DctPQM TRAP transporter, made up of
      the binding protein DctP and the membrane proteins DctQ and DctM.
    action: NEW
    reason: >-
      The paper identifies dctPQM as a TRAP operon whose products function
      together, and UniProt's curated subunit statement records the DctPQM
      complex. Complex membership is inferred from the family architecture
      and the operon phenotype rather than shown biochemically, hence IC.
    supported_by:
    - reference_id: PMID:21725012
      supporting_text: >-
        the DctPQM transporter belonging to the tripartite ATP-independent
        periplasmic (TRAP) family of carriers
