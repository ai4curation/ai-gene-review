- id: PMID:18156257
  title: Pseudomonas syringae BetT is a low-affinity choline transporter that is responsible for superior
    osmoprotection by choline over glycine betaine.
  findings:
  - statement: Functional P. aeruginosa BCCTs were identified by heterologous expression in P. syringae.
    supporting_text: Functional P. putida and P. aeruginosa transporters were identified
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Abstract only; full text could not be retrieved. PseudoCAP IDA source for GO:0005275, GO:0015653,
      GO:0031460 and GO:0071475 on PA5291 and seed of PTN001247333. The abstract does not name the
      P. aeruginosa genes. According to the same group's 2011 paper (PMID:21478341, full text), this paper
      showed that BetT2 (PA3933) transports glycine betaine and BetT3 (PA5291) transports choline, so the
      glycine betaine rows are probably on the wrong gene.
- id: PMID:21478341
  title: Roles of three transporters, CbcXWV, BetT1, and BetT3, in Pseudomonas aeruginosa choline uptake
    for catabolism.
  findings:
  - statement: BetT3 supports growth on choline and is the main choline transporter at high osmolarity.
    supporting_text: BetT3 and CbcXWV, but not BetT1, were sufficient to support growth on choline.
  - statement: BetT3 is the major choline transporter under hyperosmolar conditions.
    supporting_text: BetT3 was the major choline transporter under hyperosmolar conditions
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract only; full text read on PMC (PMC3133218). Names BetT3 as PA14_69850, which is
      identical to PAO1 PA5291. PseudoCAP attached its BetT3 rows to PA3933 instead (see the PA3933
      review); no row from this paper is on PA5291.
