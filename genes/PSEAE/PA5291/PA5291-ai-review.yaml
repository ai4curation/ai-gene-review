id: Q9HTR3
gene_symbol: PA5291
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PA5291 encodes BetT3, one of three betaine/carnitine/choline transporter (BCCT, TC 2.A.15) family
  secondary transporters of Pseudomonas aeruginosa. It is a multi-pass cytoplasmic membrane protein with
  twelve predicted transmembrane helices and a long C-terminal tail, a feature linked to osmoregulation
  in related BCCTs. BetT3 transports choline: the PAO1 gene restores choline uptake to a choline
  transport-deficient Pseudomonas syringae strain, and a betT3 deletion lowers choline uptake by about 80%
  in choline-induced P. aeruginosa. Expression is induced by choline and repressed by BetI. BetT3 alone can
  support growth on choline as a carbon source, acts with BetT1 in early uptake after transfer to choline,
  and is the main choline transporter at high osmolarity, where choline is converted to the osmoprotectant
  glycine betaine.
