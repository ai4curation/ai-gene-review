taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: PA3891 is the ATP-binding (nucleotide-binding domain) subunit of an OpuC-type osmoprotectant
  ABC importer encoded by PA3888-PA3891, together with two distinct permeases (PA3888, PA3890) and a
  periplasmic glycine betaine-binding protein (PA3889). It is a soluble protein that sits on the
  cytoplasmic face of the inner membrane and has an N-terminal ABC ATPase domain followed by tandem CBS
  domains, the feature that marks osmoregulatory quaternary-amine ABC transporters. A PAO1 genomic clone
  carrying PA3891 restored osmoprotected growth under high salt to a P. syringae mutant lacking its own
  OpuC ATPase. By analogy with the characterised P. syringae OpuC, the transporter imports glycine betaine
  with high affinity and choline with low affinity, and may accept other quaternary ammonium compounds such
  as carnitine and proline betaine, which accumulate as compatible solutes under osmotic stress.
