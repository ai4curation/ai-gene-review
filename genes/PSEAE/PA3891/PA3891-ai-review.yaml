suggested_questions:
- question: Should the PseudoCAP IDA rows for PA3891 citing PMID:17660277 be re-coded as IGI (heterologous
    functional complementation) or ISS with Q87WH5? They are the sole seeds of two PAINT IBDs
    (PTN001953060, PTN001953445).
- question: Which substrates does the PAO1 PA3888-PA3891 transporter actually take up (glycine betaine,
    choline, proline betaine, carnitine), and which osmoprotectant did the complementing PAO1 clone rescue on?
suggested_experiments:
- description: Measure [14C]glycine betaine, choline and carnitine uptake in PAO1 PA3891 deletion mutants
    (alone and combined with cbcXWV and betT1/betT3 deletions) under hyperosmotic conditions, with
    competition assays to define the substrate range of the PA3888-PA3891 transporter.
