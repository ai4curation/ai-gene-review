- id: PMID:17660277
  title: Characterization of the osmoprotectant transporter OpuC from Pseudomonas syringae and demonstration
    that cystathionine-beta-synthase domains are required for its osmoregulatory function.
  findings:
  - statement: The P. syringae DC3000 OpuC transporter (ATPase Q87WH5, PSPTO_4575) is a high-affinity
      glycine betaine and low-affinity choline osmoprotectant importer with broad QAC specificity, and its
      ATPase CBS domains are required for function.
    supporting_text: The P. syringae pv. tomato OpuC transporter had a high affinity for glycine betaine, a
      low affinity for choline, and a broad substrate specificity that included acetylcholine, carnitine,
      and proline betaine.
  - statement: The only PA3891 experiment is that a PAO1 genomic clone carrying PA3891 restored growth of a
      DC3000 opuCA-deficient triple mutant under hyperosmotic conditions with betaine or choline.
    supporting_text: The sequence of the complementing clones indicated that transporters involving Psyr4249
      from P. syringae pv. syringae strain B728a and PA3891 from P. aeruginosa PAO1 were functional, as
      predicted.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read in the cache. This is the right paper for PA3891 (named in the text and
      recovered in the complementation screen), but most of the data concern the P. syringae DC3000 OpuC
      transporter. Support for PA3891 is limited to heterologous functional complementation, so the six
      PseudoCAP IDA rows citing it overstate the evidence (IGI/ISS would fit). The ISS rows with Q87WH5 are
      correctly cited.
