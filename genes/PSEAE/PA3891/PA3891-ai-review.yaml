- term:
    id: GO:0015226
    label: carnitine transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:17660277
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q87WH5
  review:
    summary: PseudoCAP ISS from DC3000 OpuCA. In that paper carnitine is a substrate of the DC3000 OpuC
      transporter.
    action: KEEP_AS_NON_CORE
    reason: For DC3000 OpuC, carnitine was inferred from inhibition of [14C]betaine and [14C]choline uptake
      and from weak osmoprotection, not from direct carnitine uptake. Nothing was tested for the PAO1
      transporter. Carnitine is plausibly a minor substrate of a broad-specificity OpuC system. Glycine
      betaine is the main substrate, and GO:0015418 covers the broad specificity.
    supported_by:
    - reference_id: PMID:17660277
      supporting_text: Taken together, these results confirm that OpuC mediates the uptake of multiple
        substrates, including glycine betaine, choline, proline betaine, carnitine, and acetylcholine.
