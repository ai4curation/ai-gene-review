core_functions:
- description: ATP-hydrolysing nucleotide-binding subunit (OpuCA-like, with tandem CBS domains) of the
    PA3888-PA3891 OpuC-type ABC importer. It powers uptake of glycine betaine (main substrate) and other
    quaternary ammonium osmoprotectants across the inner membrane.
  supported_by:
  - reference_id: PMID:17660277
    supporting_text: The sequence of the complementing clones indicated that transporters involving Psyr4249
      from P. syringae pv. syringae strain B728a and PA3891 from P. aeruginosa PAO1 were functional, as
      predicted.
  - reference_id: PMID:17660277
    supporting_text: Tandem cystathionine-β-synthase (CBS) domains in the ATP-binding component of OpuC were
      required for transporter function.
