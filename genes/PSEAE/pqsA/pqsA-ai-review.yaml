id: Q9I4X3
gene_symbol: pqsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PqsA (PA0996) is the anthranilate--CoA ligase (EC 6.2.1.32) that primes anthranilate
  for the 2-alkyl-4(1H)-quinolone pathway of Pseudomonas aeruginosa. It is the first
  gene of the pqsABCDE operon and catalyses the ATP-dependent thioesterification
  anthranilate + ATP + CoA = anthraniloyl-CoA + AMP + diphosphate (RHEA:10828). The
  purified monomeric enzyme has a low-micromolar Km for anthranilate (3 uM, against
  22 uM for CoA and 71 uM for ATP) and a pH optimum of 8.5. Anthraniloyl-CoA is then
  condensed with a malonyl thioester by PqsD, with PqsB and PqsC, to build the
  4-quinolone ring, giving 2-heptyl-4(1H)-quinolone (HHQ) and the side product
  2,4-dihydroxyquinoline (DHQ); PqsH hydroxylates HHQ at C3 to give the Pseudomonas
  quinolone signal (PQS) itself. Loss of pqsA abolishes DHQ and the other quinolines,
  placing the enzyme at the single committed entry point to the whole alkylquinolone
  family rather than to PQS alone. The enzyme is promiscuous in vitro, accepting
  benzoate and halogenated anthranilates, which is why anthranilate analogues inhibit
  quinolone signalling and makes the enzyme a candidate antivirulence target.
references:
- id: PMID:18083812
  title: Pseudomonas aeruginosa PqsA is an anthranilate-coenzyme A ligase.
  findings:
  - statement: Purified recombinant His-tagged PqsA has anthranilate-CoA ligase activity.
    supporting_text: The PqsA protein was purified as a recombinant His-tagged polypeptide,
      and this protein was shown to have anthranilate-CoA ligase activity.
    reference_section_type: ABSTRACT
  - statement: Extracts of E. coli expressing PqsA form anthraniloyl-CoA from anthranilate,
      ATP and CoA, establishing the substrates and products of the reaction.
    supporting_text: Extracts prepared from Escherichia coli expressing PqsA were shown
      to catalyze the formation of anthraniloyl-CoA from anthranilate, ATP, and CoA.
    reference_section_type: ABSTRACT
  - statement: The enzyme is promiscuous in vitro, accepting benzoate and halogenated
      anthranilate derivatives; this is substrate breadth of an AMP-binding enzyme
      rather than a second physiological function.
    supporting_text: The enzyme was active on a variety of aromatic substrates, including
      benzoate and chloro and fluoro derivatives of anthranilate.
    reference_section_type: ABSTRACT
  - statement: The authors' own conclusion is that PqsA primes anthranilate for the
      pathway, i.e. that the physiological role is the committed first step.
    supporting_text: These results indicate that the PqsA protein is responsible for
      priming anthranilate for entry into the PQS biosynthetic pathway
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The defining paper for this gene's molecular function and the source of the
      UniProt IDA row. Cached abstract only (full_text_available: false, PMC2238192),
      but the abstract states the decisive facts outright: a purified His-tagged
      protein assayed for anthranilate-CoA ligase activity, with substrates and
      product named. PubMed-verified: Coleman JP et al., J Bacteriol 190(4):1247-55,
      2008, doi 10.1128/JB.01140-07. The kinetic constants quoted in this review are
      taken from the curated UniProt record rather than from the abstract, which does
      not give them.
- id: PMID:12426334
  title: Functions required for extracellular quinolone signaling by Pseudomonas aeruginosa.
  findings:
  - statement: Transposon mutants in the pqs genes lose extracellular PQS; PQS is in
      turn required for other secondary metabolites and extracellular enzymes.
    supporting_text: The largest set of pleiotropic mutations blocked the production
      of the extracellular Pseudomonas quinolone signal (PQS), a molecule required for
      the synthesis of secondary metabolites and extracellular enzymes.
  - statement: At the time of this paper pqsA's activity was a homology prediction
      (benzoate-CoA ligase), not a measurement; the enzymology came six years later.
    supporting_text: Gene pqsA encodes a product homologous to benzoate coenzyme A ligase,
      which may be involved in activating anthranilate for PQS synthesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP source for the IMP row on GO:0044550. Full text cached (PMC135424).
      The screen scored reduced pyocyanin and then assayed PQS, so the mutant
      phenotype that identifies pqsA is loss of the quinolone signal. Pyocyanin loss
      is a downstream regulatory consequence of losing PQS, not evidence that PqsA
      acts in phenazine biosynthesis, and the row is not read that way here.
- id: PMID:18728009
  title: PqsD is responsible for the synthesis of 2,4-dihydroxyquinoline, an extracellular
    metabolite produced by Pseudomonas aeruginosa.
  findings:
  - statement: Places PqsA's reaction as the first step of the pathway, upstream of
      the PqsD condensation that this paper characterises.
    supporting_text: The first step is the formation of anthraniloyl-CoA by PqsA.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      A PqsD paper, not a PqsA paper, and it is cited here for two things it
      nevertheless establishes about PqsA: the enzyme was used to prepare
      anthraniloyl-CoA as a substrate, and a pqsA deletion is the basis of the
      UniProt disruption phenotype in which no DHQ or other quinolines are detectable.
      That phenotype is what extends PqsA's process role beyond PQS to the whole
      alkylquinolone family. Full text cached. This reference is not in GOA for this
      gene; it is added here as supporting evidence, not as a new annotation.
