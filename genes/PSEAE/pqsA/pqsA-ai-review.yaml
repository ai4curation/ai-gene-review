proposed_new_terms:
- proposed_name: 2-alkyl-4(1H)-quinolone biosynthetic process
  proposed_definition: >-
    The chemical reactions and pathways resulting in the formation of
    2-alkyl-4(1H)-quinolones, including 2-heptyl-4(1H)-quinolone (HHQ),
    2-heptyl-3-hydroxy-4(1H)-quinolone (PQS, CHEBI:29472) and 2,4-dihydroxyquinoline
    (DHQ), from anthranilate and a malonyl thioester.
  proposed_parent:
    id: GO:0044550
    label: secondary metabolite biosynthetic process
  justification: >-
    GO has the molecular function GO:0102164 for the final PQS-forming step but no
    biological-process term for this pathway, so every gene of the pqsABCDE operon sits
    on GO:0044550, which cannot distinguish alkylquinolone synthesis from pyoverdine or
    phenazine biosynthesis in the same organism. A searchable process term would let the
    operon be annotated as a pathway and would separate the biosynthetic genes from the
    regulators and sensors that respond to the signal. Checked against OLS before
    proposing: a search for a quinolone biosynthetic process returns nothing while the
    same search style resolves GO:0102164, so the gap is real rather than a failed query.
    GO:0018189 pyrroloquinoline quinone biosynthetic process is the precedent for a term
    at this grain: one named bacterial small molecule, made by one operon, with its own
    biosynthetic-process term. It is a precedent for grain only, not for placement -- PQQ is
    a redox cofactor for quinoprotein dehydrogenases rather than a secondary metabolite, and
    GO:0018189 is not under GO:0044550 at all. Its fifteen ancestors run through GO:0072351
    tricarboxylic acid biosynthetic process, GO:0042181 ketone biosynthetic process and
    GO:0044283 small molecule biosynthetic process, checked in OLS on 2026-11-27.
    GO:0044550 is given as the sole parent deliberately. The
    chemical-class co-parents a reviewer would reach for are all obsolete -- GO:0018130
    heterocycle biosynthetic process, GO:0019438 aromatic compound biosynthetic process
    and GO:1901566 organonitrogen compound biosynthetic process are each recorded as
    obsolete in this repository's GO snapshot -- so adding them would introduce exactly
    the retired ids the obsolete-authored-term check exists to catch.
  supported_by:
  - reference_id: file:PSEAE/pqsA/pqsA-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Catalyzes the formation of anthraniloyl-CoA, which is the priming
      step for entry into the Pseudomonas quinolone signal (PQS) biosynthetic pathway.
  - reference_id: PMID:18728009
    supporting_text: The first step is the formation of anthraniloyl-CoA by PqsA.
suggested_questions:
- question: >-
    Should a signal synthase such as PqsA or LasI carry GO:0009372 quorum sensing, whose
    definition includes producing the diffusible signal, or is the biosynthesis term alone
    the intended annotation? In this corpus no pqs gene and not lasI carries GO:0009372,
    while regulators and responders do, which reads as a deliberate convention rather
    than a gap; stating it would stop reviewers proposing the term gene by gene.
- question: >-
    Is the in vitro benzoate-CoA ligase activity of PqsA ever physiologically relevant,
    for instance when P. aeruginosa grows on aromatic substrates and benzoate accumulates?
    The activity is real but unassigned: if it carries flux under some condition it would
    be a genuine secondary activity, and if not it stays substrate breadth, which decides
    whether a second molecular function is ever warranted.
suggested_experiments:
- description: >-
    Measure anthraniloyl-CoA and benzoyl-CoA pools in wild type and a pqsA deletion by
    LC-MS/MS during growth on benzoate, to test whether PqsA contributes benzoyl-CoA in
    vivo or whether the benzoate activity is purely in vitro breadth.
  hypothesis: >-
    PqsA's benzoate-CoA ligase activity carries no detectable flux in vivo, so the
    enzyme has one physiological function and the breadth is adventitious.
  experiment_type: targeted LC-MS/MS metabolomics of acyl-CoA pools in a deletion mutant
- description: >-
    Determine kcat/Km for anthranilate against benzoate and the halogenated anthranilates
    with the purified enzyme, so the promiscuity is quantified rather than described.
  hypothesis: >-
    Catalytic efficiency for anthranilate exceeds that for benzoate by enough to place
    the benzoate activity in the adventitious tier rather than the secondary-activity tier.
  experiment_type: steady-state enzyme kinetics across substrates
