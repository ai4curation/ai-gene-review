existing_annotations:
- term:
    id: GO:0016878
    label: acid-thiol ligase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002458530
  - UniProtKB:P9WQ61
  - UniProtKB:Q9I4X3
  review:
    summary: >-
      IBA from the PAINT IBD at PTN002458530, asserting the substrate-agnostic EC
      6.2.1 chemistry: formation of a CoA thioester from a carboxylic acid. Correct
      for PqsA and correctly scoped to the node. PANTHER places this gene in
      PTHR43352, whose family name is "ACETYL-COA SYNTHETASE", and recognises
      anthranilate specificity only at the subfamily level (PTHR43352:SF1,
      "ANTHRANILATE--COA LIGASE"); the node's WITH/FROM spans an M. tuberculosis
      member (UniProtKB:P9WQ61) as well as this gene. A node covering acyl-CoA
      synthetases of differing substrate can only inherit the thioester chemistry,
      which is exactly what the curator asserted.
    action: ACCEPT
    reason: >-
      Kept rather than sharpened or marked general. Not MODIFY: this row's own
      evidence is a node spanning substrates, so it does not reach anthranilate
      specificity, and the deeper term is already asserted by IDA on its own row.
      Not TOO_GENERAL either: "acid-thiol ligase activity" names the reaction class
      the enzyme actually performs (EC 6.2.1, an adenylate-forming CoA ligase), which
      is real mechanistic information and is the level at which the function is
      inherited, unlike bare ligase activity on the ARBA row below. The appearance of
      Q9I4X3 in WITH/FROM is expected and is not circularity: it marks this gene's own
      purified-enzyme annotation among the descendant evidences the PAINT curator used.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002458530
        source_label: PTN002458530
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Node of PTHR43352 (acetyl-CoA synthetase family). The general term is the
          right level here; the anthranilate term must not be pushed up to it, since
          PANTHER itself confines that specificity to SF1.
      - source_id: UniProtKB:Q9I4X3
        source_label: pqsA (self; own IDA, PMID:18083812)
        source_status: SUPPORTS_TRANSFER
        comment: Expected self-seed, marking the target's own purified-enzyme evidence.
      - source_id: UniProtKB:P9WQ61
        source_label: M. tuberculosis family member
        source_status: SUPPORTS_TRANSFER
        comment: >-
          A donor outside the Pseudomonas clade, which is why the inherited claim
          stops at the thioester chemistry rather than naming a substrate.
    supported_by:
    - reference_id: PMID:18083812
      supporting_text: Extracts prepared from Escherichia coli expressing PqsA were shown
        to catalyze the formation of anthraniloyl-CoA from anthranilate, ATP, and CoA.
