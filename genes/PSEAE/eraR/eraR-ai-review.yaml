id: Q9I2C7
gene_symbol: eraR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  EraR (PA1980) is a NarL/FixJ-family two-component response regulator of Pseudomonas
  aeruginosa with an N-terminal receiver domain and a C-terminal LuxR-type helix-turn-helix
  DNA-binding domain. It belongs to the regulatory hierarchy that controls the
  pyrroloquinoline quinone-dependent ethanol oxidation system; the response regulator of
  this system (described as ExaE in strain ATCC 17933) works with a cognate histidine
  sensor kinase to control transcription from the quinoprotein ethanol dehydrogenase
  (exaA) promoter.
