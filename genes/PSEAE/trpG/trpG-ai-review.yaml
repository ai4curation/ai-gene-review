    summary: >-
      PseudoCAP IMP seed for the IBD at PTN000230074. Essar et al. inactivated both anthranilate synthase
      gene pairs and returned them to P. aeruginosa; they assign TrpE-TrpG to tryptophan synthesis and
      PhnA-PhnB to pyocyanin.
