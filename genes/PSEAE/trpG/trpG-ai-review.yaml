suggested_questions:
- question: >-
    Which glutamine amidotransferase subunit, TrpG or PhnB, partners the GATase-less PabB (PA1758) in
    4-amino-4-deoxychorismate synthesis in P. aeruginosa?
suggested_experiments:
- description: >-
    Test whether a trpG deletion (in a phnB background) causes p-aminobenzoate auxotrophy on low-ammonium
    medium, and assay ADC synthase activity of purified PabB with TrpG or PhnB.
