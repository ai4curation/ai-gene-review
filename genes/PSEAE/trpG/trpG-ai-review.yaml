- term:
    id: GO:0046654
    label: tetrahydrofolate biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000747575
  - UniProtKB:P00903
  review:
    summary: >-
      Tetrahydrofolate biosynthetic process from PAINT node PTN000747575, seeded by E. coli PabA (P00903).
    action: KEEP_AS_NON_CORE
    reason: >-
      Plausible but untested for TrpG. PAO1 has no standalone pabA: the only glutamine amidotransferase
      subunits of the TrpG/PabA type are TrpG and PhnB, and PabB (PA1758) carries only the chorismate-binding
      domain, so one of them must supply ammonia for 4-amino-4-deoxychorismate synthesis, as the amphibolic
      TrpG/PabA of B. subtilis does. Essar et al. note that Pseudomonas TrpG is closer to E. coli PabA
      than to E. coli TrpG. No experiment shows which subunit serves PabB, so this is kept as a non-core
      inference.
    supported_by:
    - &id004
      reference_id: PMID:2153661
      supporting_text: Pseudomonas TrpE and TrpG are more closely related to E. coli PabB and PabA than
        to E. coli TrpE and TrpG
