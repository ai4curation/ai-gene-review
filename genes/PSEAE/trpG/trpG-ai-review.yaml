  label: Pseudomonas aeruginosa PAO1
description: >-
  TrpG (PA0649) is the glutamine amidotransferase subunit of the tryptophan-pathway anthranilate synthase
  of Pseudomonas aeruginosa PAO1. With the large subunit TrpE it forms a heterotetramer in which TrpG
  hydrolyses L-glutamine and passes the ammonia to TrpE, which converts chorismate to anthranilate, the
  first committed step of L-tryptophan biosynthesis. trpEG mutants are tryptophan auxotrophs; TrpEG is
  expressed mainly at low cell density, whereas the paralogous PhnAB anthranilate synthase supplies anthranilate
  for the quinolone signal PQS at high density. Pseudomonas TrpE and TrpG are phylogenetically closer
  to the E. coli aminodeoxychorismate synthase subunits PabB and PabA than to E. coli TrpE and TrpG, and
  since PAO1 lacks a separate pabA, TrpG may also serve folate precursor synthesis.
