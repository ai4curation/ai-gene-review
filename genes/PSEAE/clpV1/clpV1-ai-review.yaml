    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: Protein-folding process term propagated from ClpA/ClpB family membership.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ClpA/ClpB-derived protein-folding process does not describe ClpV1, whose T6SS-specific activity is ATP-dependent disassembly and recycling of the contracted sheath.
