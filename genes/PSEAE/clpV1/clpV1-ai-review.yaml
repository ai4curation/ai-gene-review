id: Q9I742
gene_symbol: clpV1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: ClpV1 (TssH1) is the dedicated AAA+ ATPase of the Pseudomonas aeruginosa H1-T6SS. It uses ATP hydrolysis to disassemble the contracted TssB1-TssC1 sheath and recycle its subunits, resetting the apparatus for another extension-and-firing cycle.
existing_annotations:
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP hydrolysis is the catalytic activity that powers sheath disassembly.
    action: ACCEPT
    reason: ClpV1 is a T6SS-specific AAA+ ATPase whose ATP hydrolysis activity disassembles the contracted sheath; this is its core molecular function.
    supported_by:
    - reference_id: file:PSEAE/clpV1/clpV1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Acts as an AAA(+) ATPase that disassembles the contracted sheath, which resets the systems for reassembly of an extended sheath that is ready to fire again
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: ATP binding is required for ClpV1 AAA+ ATPase activity.
    action: KEEP_AS_NON_CORE
    reason: ClpV1 is a genuine Walker A/B AAA+ ATPase, so ATP binding is a real molecular function of this protein (not an over-annotation); it is retained as non-core because the informative core catalytic function is the ATP hydrolysis activity (GO:0016887) that powers contracted-sheath disassembly.
    supported_by:
    - reference_id: file:PSEAE/clpV1/clpV1-uniprot.txt
      record_section:
      - FT:BINDING
      supporting_text: BINDING 237..244
- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Chaperone term inherited from the ClpA/ClpB AAA+ unfoldase clade.
    action: MARK_AS_OVER_ANNOTATED
    reason: ClpV1 carries the T6SS-specific ClpV1 ATPase signature and acts as a sheath-disassembly unfoldase at the H1-T6SS, not as a general protein-folding chaperone; the phylogenetically inherited chaperone term over-annotates this neofunctionalized activity.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002461480
        source_label: Clp/Hsp100 AAA+ ATPase ancestral node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The ancestral Clp/Hsp100 node supports a general unfoldase/chaperone
          activity, but ClpV1 has diverged into a dedicated T6SS sheath-recycling
          ATPase (InterPro IPR017729 ATPase_T6SS_ClpV1; TIGRFAM VI_ClpV1), so the
          broad protein-folding chaperone term does not scope to this member.
    supported_by:
    - reference_id: file:PSEAE/clpV1/clpV1-uniprot.txt
      record_section:
      - DR:InterPro
      supporting_text: DR   InterPro; IPR017729; ATPase_T6SS_ClpV1.
- term:
