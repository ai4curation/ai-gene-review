gene_symbol: ptxS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PtxS (PA2259) is a LacI/GalR-family transcriptional repressor of Pseudomonas aeruginosa that controls
  2-ketogluconate catabolism and modulates exotoxin A expression. It carries an N-terminal lacI-type helix-turn-helix
  domain and a C-terminal periplasmic-binding-protein-like effector domain that binds 2-ketogluconate.
  PtxS binds a 14-bp palindromic operator (TGAAACCGGTTTCA) upstream of its own gene and represses itself,
  and binds near the -10 region of the kgu and gad catabolic operon promoters, occluding RNA polymerase.
  PtxS does not bind the toxA promoter; instead it binds the divergently encoded activator PtxR with nanomolar
  affinity and blocks PtxR-dependent activation of toxA, and at the kgu and gad promoters the two DNA-bound
  regulators interact to form a DNA loop. 2-Ketogluconate disrupts the PtxS-PtxR interaction and releases
  PtxS from DNA.
