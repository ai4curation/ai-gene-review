- id: PMID:10438759
  title: >-
    The Pseudomonas aeruginosa exotoxin A regulatory gene, ptxS: evidence for negative autoregulation.
  findings:
  - statement: >-
      PtxS-dependent binding to a 52-bp ptxS upstream fragment, lost in the ptxS mutant.
    supporting_text: >-
      The gel shift band was not detected when the 52-bp fragment was incubated with the lysate of the
      ptxS isogenic mutant PAO1::ptxS.
  - statement: PtxS autoregulates its synthesis.
    supporting_text: >-
      PtxS autoregulates its synthesis by binding to a specific sequence within the ptxS upstream region
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      CollecTF IPI source; abstract read (full text cached). Lysate gel shift with mutant and complementation
      controls, footprinting, ptxS-lacZ in the mutant.
- id: PMID:10894751
  title: >-
    Autoregulation of the Pseudomonas aeruginosa protein PtxS occurs through a specific operator site
    within the ptxS upstream region.
  findings:
  - statement: Deleting the 14-bp palindrome abolishes PtxS binding.
    supporting_text: >-
      PtxS binding was eliminated upon the deletion of the 14-bp palindromic sequence from the 52-bp fragment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      CollecTF IPI/IMP source; abstract only. Operator mutagenesis with binding and promoter-fusion readouts.
- id: PMID:22844393
  title: >-
    Genes for carbon metabolism and the ToxA virulence factor in Pseudomonas aeruginosa are regulated
    through molecular interactions of PtxR and PtxS.
  findings:
  - statement: PtxS binds the -10 region of target promoters and occludes RNA polymerase.
    supporting_text: >-
      PtxS operates as a repressor that binds to the -10 region of the target promoters and occludes RNA
      polymerase access
  - statement: >-
      PtxS regulates its own promoter and the kgu and gad catabolic operons in response to 2-ketogluconate.
    supporting_text: >-
      PtxS with 2-ketogluconate is the regulator of the gluconate degradation pathway and controls expression
      from its own promoter and also from the P(gad) and P(kgu) for the catabolic operons
  - statement: >-
      PtxS binds PtxR with nanomolar affinity; 2-ketogluconate prevents the interaction.
    supporting_text: >-
      In vitro, PtxS recognises PtxR with nanomolar affinity, but this interaction does not occur in the
      presence of 2-ketogluconate, the specific effector of PtxS.
  - statement: PtxS does not bind the toxA promoter.
    supporting_text: >-
      PtxR binds to the -35 region of the P(toxA) promoter in front of the exotoxin A gene, whereas PtxS
      does not bind to this promoter
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PseudoCAP IDA source for GO:0045892 and CollecTF IPI source; seed of the PTN001248758 GO:0006355
      IBD. Full text (PMC3402500) cached and read: EMSA and DNaseI footprints of PtxS on Pkgu and Pgad,
      ITC of PtxS-PtxR, lacZ fusions in deletion mutants.
