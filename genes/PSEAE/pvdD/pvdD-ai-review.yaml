- id: PMID:15271355
  title: Characterization and genetic manipulation of peptide synthetases in Pseudomonas
    aeruginosa PAO1 in order to generate novel pyoverdines.
  findings:
  - statement: >-
      A pvdD mutant makes no pyoverdine and lacks a high-Mr iron-regulated
      cytoplasmic protein; it is complemented in trans, and other pyoverdine NRPSs
      were identified.
    supporting_text: >-
      A pvdD mutant did not synthesize pyoverdine and lacked a high Mr
      iron-regulated cytoplasmic protein (IRCP).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Ackerley and Lamont 2004, Chem Biol). Abstract only. Supports
      the pyoverdine biosynthesis IMP directly.
