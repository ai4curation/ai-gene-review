  review:
    summary: >-
      PseudoCAP IMP and one of the PvdD seeds of the PTN002378821 secondary
      metabolite biosynthetic process IBD. A pvdD mutant makes no pyoverdine and is
      complemented in trans.
    action: ACCEPT
    reason: >-
      Seed verdict SOUND. PvdD does part of the work of the process: it is the NRPS
      that incorporates two L-threonines into the pyoverdine peptide, so the mutant
      phenotype reflects loss of a catalytic step, not an indirect effect.
      Pyoverdine biosynthetic process is_a secondary metabolite biosynthetic
      process, so the seed supports the node term.
