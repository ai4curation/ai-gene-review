      supporting_text: >-
        PvdD, a nonribosomal peptide synthetase (NRPS) of Pseudomonas aeruginosa
        PAO1, incorporates two L-threonines into the siderophore pyoverdine.
    - reference_id: PMID:15271355
      supporting_text: >-
        A pvdD mutant did not synthesize pyoverdine and lacked a high Mr
        iron-regulated cytoplasmic protein (IRCP).
