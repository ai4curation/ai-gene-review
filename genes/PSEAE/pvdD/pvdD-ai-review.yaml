id: Q9I182
gene_symbol: pvdD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdD (PA2399) is a two-module nonribosomal peptide synthetase (NRPS) of
  Pseudomonas aeruginosa PAO1 that assembles part of the peptide chain of the
  siderophore pyoverdine. Each module has condensation, adenylation and
  peptidyl-carrier (phosphopantetheine-binding) domains, and the protein ends in a
  thioesterase domain, consistent with PvdD acting at the end of the NRPS assembly
  line. Both adenylation domains select L-threonine, and PvdD incorporates two
  L-threonines into pyoverdine; the first adenylation domain is highly specific for
  L-threonine in ATP-PPi exchange assays. PvdD is an iron-regulated cytoplasmic
  protein, and a pvdD mutant makes no pyoverdine.
