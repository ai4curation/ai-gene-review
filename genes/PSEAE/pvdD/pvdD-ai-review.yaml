suggested_questions:
- question: >-
    Does the C-terminal thioesterase of PvdD release the completed ferribactin
    precursor peptide, and does PvdD act within a membrane-associated pyoverdine
    NRPS complex (siderosome)?
suggested_experiments:
- description: >-
    In vitro reconstitution of the PvdD thioesterase with a synthetic
    peptidyl-thioester mimic of the ferribactin precursor, and fluorescent tagging
    of chromosomal PvdD to test inner-membrane association under iron limitation.
  experiment_type: biochemical reconstitution
