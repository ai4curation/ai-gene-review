- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IC
  original_reference_id: PMID:24816606
  qualifier: located_in
  review:
    summary: >-
      Proposed row. This gene has no cellular-component annotation at all, which is a gap
      rather than a judgement: the compartment is central to how the pathway works, since
      maturation happens only after the precursor has been exported.
    action: NEW
    reason: >-
      An inference this review authors, from two independent lines that agree. The paper states
      the compartment directly, calling PvdP a periplasmic enzyme. And the record carries a
      twin-arginine translocation signal peptide, by both an NCBIfam match and an InterPro
      signature, which targets folded proteins to the periplasm - so the sequence independently
      predicts the destination the paper reports. The sibling maturation enzyme pvdN carries
      this same term by IDA, which is the comparator. Coded IC because the conclusion is drawn
      from an author statement plus a targeting signal rather than from a localisation
      experiment on this protein.
