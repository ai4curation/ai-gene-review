id: Q9I188
gene_symbol: pvdP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PvdP (PA2386) is the periplasmic tyrosinase that builds the fluorophore of the siderophore
  pyoverdine in Pseudomonas aeruginosa. It is a 544-residue di-copper enzyme exported across
  the cytoplasmic membrane by the twin-arginine translocation system, and it acts on the
  deacylated precursor ferribactin, carrying out the initial hydroxylation and the first
  oxidation of three consecutive oxidation steps that convert the non-fluorescent precursor
  into the fluorescent dihydroxyquinoline chromophore; the final oxidation depends on PvdO.
  Unusually for a tyrosinase it accepts a large peptidic substrate rather than free tyrosine
  or small phenols, and it is the founding characterised member of a small family of such
  enzymes found in fluorescent pseudomonads.
