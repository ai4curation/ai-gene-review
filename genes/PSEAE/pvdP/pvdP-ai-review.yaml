  title: >-
    Identification and characterization of novel pyoverdine synthesis genes in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      Eight new pvd genes were identified by mutating candidates and scoring pyoverdine
      production, which is the mutagenesis basis for the pathway-membership rows on this gene.
    reference_section_type: ABSTRACT
    supporting_text: Eight new pvd genes were identified.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified (Lamont & Martin 2003). Abstract only. It describes mutating fourteen
      candidate genes and identifying eight new pvd genes, but does not name them in the
      abstract, so whether pvdP is among the eight could not be checked here. Left UNVERIFIED;
      the pathway claim for this gene does not depend on it.
- id: PMID:19787431
  title: >-
    Synthesis of the siderophore pyoverdine in Pseudomonas aeruginosa involves a periplasmic
    maturation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified. Abstract only. This is the paper that established the periplasmic
      maturation step, which is the compartment and stage PvdP acts in, so it is apt context
      for the pathway rows. The abstract names PvdE rather than PvdP, so its specific evidence
      for this gene could not be checked; left UNVERIFIED.
- id: PMID:24816606
  title: >-
    PvdP is a tyrosinase that drives maturation of the pyoverdine chromophore in Pseudomonas
    aeruginosa.
  findings:
  - statement: >-
      PvdP is identified as the tyrosinase that matures the pyoverdine chromophore, a function
      previously unknown, and as a periplasmic enzyme.
    reference_section_type: ABSTRACT
    supporting_text: >-
      is a tyrosinase required for the maturation of the pyoverdine chromophore
  - statement: >-
      The compartment is stated directly, which is one of the two lines supporting the
      proposed periplasmic location row.
    reference_section_type: ABSTRACT
    supporting_text: a periplasmic enzyme of previously unknown function
  - statement: >-
      The reaction is the conversion of non-fluorescent ferribactin to fluorescent pyoverdine
      by three consecutive oxidations.
    reference_section_type: ABSTRACT
    supporting_text: >-
      PvdP converts the nonfluorescent ferribactin, containing two iron binding groups, into a
      fluorescent pyoverdine
  - statement: >-
      The enzyme acts on a large peptidic substrate rather than free tyrosine, which is what
      makes this family unusual among tyrosinases.
    reference_section_type: ABSTRACT
    supporting_text: capable of acting on large peptidic substrates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Nadal-Jimenez et al., J Bacteriol 2014; DOI 10.1128/JB.01376-13).
      Abstract only, but it is titled for the finding and states everything the molecular
      function needs: the tyrosinase identity, the substrate, the three-oxidation mechanism,
      the periplasmic location and the peptidic-substrate specificity. This is the source of
      both the GO:0004503 IDA and one GO:0002049 IDA row, and the strongest reference on the
      gene.
- id: PMID:30386787
  title: The biosynthesis of pyoverdines.
  findings:
  - statement: >-
      PvdP performs the initial hydroxylation and first oxidation, with the final oxidation
      depending on PvdO - which bounds what this gene does within chromophore formation.
    reference_section_type: RESULTS
    supporting_text: >-
      a mutant strain lacking the putative oxidoreductase PvdO produced the dihydropyoverdines,
      indicating that PvdP catalyzes only the initial hydroxylation and first oxidation,
      whereas the final oxidation depends on PvdO
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Ringel & Bruser 2018), full text cached. A review, cited for the
      field's reading of how the chromophore-forming oxidations are divided between PvdP and
      PvdO. Useful here precisely because it limits the claim: PvdP does not complete the
      chromophore on its own.
