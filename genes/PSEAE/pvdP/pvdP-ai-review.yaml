core_functions:
- description: >-
    Periplasmic di-copper tyrosinase that initiates chromophore formation on the deacylated
    pyoverdine precursor, carrying out the initial hydroxylation and first oxidation of the
    three that convert non-fluorescent ferribactin into fluorescent pyoverdine.
