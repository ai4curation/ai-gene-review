    supporting_text: >-
      PvdP converts the nonfluorescent ferribactin, containing two iron binding groups, into a
      fluorescent pyoverdine
  - reference_id: PMID:30386787
    reference_section_type: RESULTS
    supporting_text: >-
      a mutant strain lacking the putative oxidoreductase PvdO produced the dihydropyoverdines,
      indicating that PvdP catalyzes only the initial hydroxylation and first oxidation,
      whereas the final oxidation depends on PvdO
  knowledge_gaps:
  - gap_statement: >-
      How a tyrosinase accommodates a large peptidic substrate is not understood. PvdP is the
      first characterised member of a family that acts on peptides rather than free tyrosine or
      small phenols, and no structure of it with a bound substrate exists, so what determines
      the specificity - and whether the enzyme recognises the precursor peptide or only its
      tyrosine-derived moiety - is open.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    What does PvdP recognise in ferribactin? The enzyme acts on a large peptide, so establishing
    whether specificity comes from the tyrosine-derived residue alone or from the surrounding
    peptide would explain how this family was repurposed from ordinary tyrosinases.
- question: >-
    Why is the chromophore oxidation split between PvdP and PvdO rather than completed by one
    enzyme? PvdP performs the first two steps and PvdO the last, and whether that division
    reflects a chemical requirement or a regulatory checkpoint on releasing a finished
    siderophore is unresolved.
suggested_experiments:
- description: >-
    Determine a structure of PvdP with a ferribactin or peptide-analogue substrate bound, or map
    the binding site by crosslinking and mutagenesis, to establish how a di-copper tyrosinase
    accommodates a peptidic substrate.
- description: >-
    Reconstitute chromophore maturation in vitro with purified PvdP and PvdO, separately and
    together, following the dihydropyoverdine intermediate, to confirm the division of
    oxidation steps the mutant phenotypes imply.
