  - UniProtKB-SubCell:SL-0037
  review:
    summary: Correct and as specific as the organism allows; an unassembled pseudopilin is an
      inner-membrane protein.
    action: ACCEPT
    reason: >-
      Mapped from the UniProt subcellular-location vocabulary, where the record reads "Cell inner
      membrane". In a Gram-negative bacterium the plasma membrane is the inner membrane, so
      GO:0005886 is the correct term and not a coarsening of it. The topology agrees: a short
      cleaved leader followed by one hydrophobic helix at residues 20-40, which is where a
      pseudopilin sits before prepilin peptidase processing and polymerisation. Kept rather than
      refined because GO offers no bacterial inner-membrane child of GO:0005886, and the location
      is genuinely the resting place of the protein rather than an incidental one.
    supported_by:
    - reference_id: file:PSEAE/PA0681/PA0681-uniprot.txt
      record_section: ["FT:TRANSMEM"]
      supporting_text: TRANSMEM        20..40
