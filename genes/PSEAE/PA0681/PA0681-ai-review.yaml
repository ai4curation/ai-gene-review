- id: PMID:21586577
  title: 'The assembly mode of the pseudopilus: a hallmark to distinguish a novel secretion
    system subtype.'
  findings:
  - statement: Major pseudopilins are normally exchangeable between type II secretion systems;
      HxcT and XcpT are the documented exception, so HxcT is a T2SS major pseudopilin whose
      assembly behaviour is lineage-specific.
    supporting_text: Although major pseudopilins are exchangeable among type II secretion systems,
      we show that XcpT and HxcT are not.
    reference_section_type: ABSTRACT
  - statement: The specific difference is that HxcT does not build the long cell-surface structure
      a major pseudopilin forms on overproduction, and differs in sequence and in how it
      multimerises.
    supporting_text: We demonstrate that HxcT does not form a hyper-pseudopilus and is different
      in amino acid sequence and multimerization properties.
    reference_section_type: ABSTRACT
  - statement: The divergence is narrow and reversible by point mutation, which argues that HxcT
      retains the pseudopilin fold and function rather than having lost them.
    supporting_text: Using structure-based mutagenesis, we observe that five mutations are
      sufficient to revert HxcT into a functional XcpT-like protein, which also becomes capable
      of forming a hyper-pseudopilus.
    reference_section_type: ABSTRACT
  - statement: The whole Hxc system is horizontally acquired and defines a new T2SS subfamily,
      which is why its pseudopilin can diverge from Xcp's while remaining a pseudopilin.
    supporting_text: Phylogenetic and experimental analysis showed that the whole Hxc system was
      acquired by P. aeruginosa PAO1 and other Pseudomonas species through horizontal gene
      transfer.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The sole experimental reference in GOA for this gene and the source of the PseudoCAP IDA
      row. PubMed-verified as Durand E, Alphonse S, Brochier-Armanet C, Ball G, Douzi B, Filloux
      A, Bernard C, Voulhoux R, J Biol Chem 2011. Cached abstract only, no full text, but the
      abstract names HxcT explicitly and repeatedly and states the multimerization and
      hyper-pseudopilus results directly, so nothing load-bearing here depends on unread text.
- id: PMID:11985723
  title: A novel type II secretion system in Pseudomonas aeruginosa.
  findings:
  - statement: The hxc cluster was identified as a second, xcp-independent type II secretion
      pathway, named for its homology to xcp; this is what makes PA0681 a pseudopilin of a
      distinct system rather than a second copy of the Xcp machinery.
    supporting_text: In this study, we characterized a novel gene cluster, called hxc for
      homologous to xcp.
    reference_section_type: ABSTRACT
  - statement: >-
      The system's substrate and its phosphate dependence were established here. An hxcR mutant
      grown under phosphate limitation loses the alkaline phosphatase LapA from the supernatant,
      while xcp mutants retain it.
    supporting_text: The protein corresponded to the alkaline phosphatase L-AP, renamed LapA, which
      is secreted in an xcp-independent but hxc-dependent manner.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not cited in GOA for this gene; added because it establishes the identity and substrate of
      the system PA0681 belongs to, which is what the description and core function rest on.
      PubMed-verified as Ball G, Durand E, Lazdunski A, Filloux A, Mol Microbiol 2002. Abstract
      only. It does not assay PA0681 itself, so it supports the system-level claims and not the
      protein-level ones.
