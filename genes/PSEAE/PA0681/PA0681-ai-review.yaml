  review:
    summary: Sound propagation; the node is seeded by the Xcp pseudopilins and by PA0681's own
      experimental annotation.
    action: ACCEPT
    reason: >-
      Read phylogenetically rather than as a similarity transfer. PTN000764351 is seeded by XcpT
      (Q00514) and XcpU (Q00515), the major and one minor pseudopilin of the Xcp T2SS, and by
      PA0681 itself. The target's presence in its own WITH/FROM is expected and marks that
      experimental grounding exists on the target: PA0681 carries the IDA row below. It is not
      circular and does not inflate the support.

      The node asserts membership of a T2SS complex, which is the claim PMID:21586577 confirms
      for HxcT directly. That paper's finding that HxcT and XcpT are not interchangeable narrows
      what may be transferred from XcpT -- assembly mode and multimerization are lineage-specific
      -- but it does not touch complex membership, so the inheritance holds at the level this row
      asserts.
    supported_by:
    - reference_id: PMID:21586577
      supporting_text: Although major pseudopilins are exchangeable among type II secretion systems,
        we show that XcpT and HxcT are not.
- term:
    id: GO:0015627
    label: type II protein secretion system complex
  evidence_type: IDA
  original_reference_id: PMID:21586577
  qualifier: part_of
  review:
    summary: Direct evidence on HxcT in the Hxc system; the most specific cellular-component term
      GO offers for a pseudopilin.
    action: ACCEPT
    reason: >-
      The paper works on HxcT by name, assays its multimerization and its failure to form a
      hyper-pseudopilus, and shows that five substitutions convert it into a functional
      XcpT-like protein. That last result is the strongest argument for this row: a protein that
      can be reverted to a working major pseudopilin by point mutation is a major pseudopilin,
      not a degenerate relic.

      Kept at GO:0015627 rather than refined because no pseudopilus term exists in GO -- neither
      a pseudopilus class nor a T2SS-pseudopilus class resolves in OLS or in the repository's GO
      snapshot. This is an ontology gap, recorded in suggested_questions, not a reason to MODIFY
      to something less apt.
    supported_by:
    - reference_id: PMID:21586577
      supporting_text: Using structure-based mutagenesis, we observe that five mutations are
        sufficient to revert HxcT into a functional XcpT-like protein, which also becomes capable
        of forming a hyper-pseudopilus.
