- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IC
  original_reference_id: PMID:21586577
  qualifier: enables
  review:
    summary: HxcT is the structural subunit of the Hxc pseudopilus; proposed as an inference, not as
      a direct observation.
    action: NEW
    reason: >-
      The GOA set gives HxcT a complex and a process but no molecular function, and for a pseudopilin
      the function is structural: it is the subunit of the fibre that acts as the piston.

      Proposed as IC rather than IDA, and the distinction matters here. For XcpT the polymerisation is
      imaged directly, and that review's NEW row is IDA on that basis. For HxcT the same paper reports
      the opposite surface phenotype: it does not form a hyper-pseudopilus on overproduction. What the
      paper does show is that five substitutions make HxcT behave as a functional XcpT-like protein
      capable of forming one, so the polymerisation capacity is present in the fold and suppressed in
      the wild-type sequence, not absent from it. Combined with the Hxc system being secretion
      competent -- an hxcR mutant loses LapA while xcp mutants retain it -- the working machine must
      assemble a pseudopilus from this subunit. That chain is an inference the reviewer authors, which
      is what IC is for; the direct polymerisation result belongs to the revertant, and this row should
      not be read as claiming otherwise.
    supported_by:
    - reference_id: PMID:21586577
      supporting_text: Using structure-based mutagenesis, we observe that five mutations are
        sufficient to revert HxcT into a functional XcpT-like protein, which also becomes capable
        of forming a hyper-pseudopilus.
    - reference_id: PMID:11985723
      supporting_text: The protein corresponded to the alkaline phosphatase L-AP, renamed LapA, which
        is secreted in an xcp-independent but hxc-dependent manner.
core_functions:
- description: >-
    Major pseudopilin (GspG family) of the Hxc type II secretion system; after prepilin-peptidase
    processing it polymerises from the inner membrane into the periplasmic pseudopilus that drives
    exoproteins, principally the alkaline phosphatase LapA under phosphate limitation, out through
    the HxcQ secretin. Its assembly mode is lineage-specific rather than Xcp-like, and is the
    character that defines the Hxc subfamily.
  molecular_function:
