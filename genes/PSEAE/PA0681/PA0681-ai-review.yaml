gene_symbol: PA0681
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  HxcT, the major pseudopilin of the Hxc type II secretion system of Pseudomonas aeruginosa
  PAO1. Hxc is the organism's second T2SS, induced under phosphate limitation and
  responsible for exporting the alkaline phosphatases LapA/LapB independently of the main
  Xcp machinery. Like other GspG-family pseudopilins, HxcT is made as a prepilin with a
  short positively charged leader, is processed by prepilin peptidase to expose a
  methylatable N-terminal phenylalanine and the invariant Glu5, and sits in the inner
  membrane through a single hydrophobic helix until it polymerises into the periplasmic
  pseudopilus that drives exoproteins through the outer-membrane secretin. HxcT is
  nonetheless not functionally interchangeable with its Xcp counterpart XcpT: it does not
  assemble a hyper-pseudopilus when overproduced and differs in sequence and
  multimerization behaviour, and this assembly mode is the character that defines the Hxc
  system as a distinct, horizontally acquired T2SS subfamily.
