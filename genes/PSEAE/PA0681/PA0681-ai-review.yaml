suggested_questions:
- question: >-
    GO has no term for the type II secretion pseudopilus. Neither a pseudopilus class nor a
    T2SS-pseudopilus class resolves in OLS or in this repository's GO snapshot, so a major
    pseudopilin can only be placed in GO:0015627 type II protein secretion system complex,
    alongside the inner-membrane platform and the outer-membrane secretin. Should a pseudopilus
    component term exist? It would separate the piston from the housing for every GspG- and
    GspH-family protein, and the structure is well enough characterised to define, but this
    project has one family of cases rather than a survey, so the question is raised rather than
    a term proposed.
- question: >-
    Is there an annotation-level way to record that HxcT and XcpT are not interchangeable? Both
    are major pseudopilins of a T2SS and both will carry the same GO terms, yet the point of
    PMID:21586577 is that swapping them does not work and that this non-equivalence is the
    diagnostic character of a new T2SS subfamily. The distinction is invisible in GOA.
suggested_experiments:
- description: >-
    Test whether HxcT is N-methylated on its mature N-terminal phenylalanine, and by which
    prepilin peptidase. The sequence carries a canonical cleavage and methylation motif
    (mature FTLIE..., with the invariant Glu5), but UniProt's PROSITE caution records that a
    profile residue did not match, so the modification is assumed rather than shown. Mass
    spectrometry of mature HxcT from wild-type and from a prepilin-peptidase mutant would settle
    it, and would say whether Hxc uses the Xcp peptidase PilD/XcpA or an Hxc-encoded one -- which
    bears on how independent the two systems really are.
knowledge_gaps:
- gap_statement: >-
    Why a major pseudopilin that is reverted to XcpT-like behaviour by five substitutions has not
    converged on that behaviour in the Hxc lineage. The mutations are available and tolerated, so
    the non-Xcp assembly mode is presumably selected for rather than a neutral consequence of
    horizontal acquisition, but what it buys the Hxc system is unknown. Distinguishing a kinetic
    or substrate-range advantage from a constraint imposed by the lipoprotein secretin HxcQ needs
    wet-lab work.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
