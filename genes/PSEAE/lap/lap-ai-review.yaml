    summary: >-
      PseudoCAP IDA; sole seed of the PAINT IBD at PTN000254534 (272 leaf IBAs in
      109 taxa). Cahan et al. purified PaAP from culture filtrates and assayed its
      hydrolysis of amino-acid p-nitroanilides and of short peptides.
