      supporting_text: >-
        Leu-Ala and Ala4, having free N-termini, are both cleaved readily [17].
    - reference_id: PMID:37386135
      supporting_text: >-
        PaAP is a
        promiscuous aminopeptidase acting on unstructured regions of peptides and
        proteins.
