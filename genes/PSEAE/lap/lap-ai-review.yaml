- term:
    id: GO:0015628
    label: protein secretion by the type II secretion system
  evidence_type: IDA
  original_reference_id: PMID:9642203
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA from Braun et al. 1998, who detected the then-uncharacterised
      SGAP homologue in the culture medium of protease-deficient strains. PaAP is
      indeed exported by the Xcp T2SS, but as cargo.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The biology (PaAP crosses the outer membrane via Xcp) is accepted, but a
      secreted substrate does none of the work of the secretion process; GO
      annotates the T2SS machinery (Xcp/Gsp proteins) to this term, not their
      cargo. The fact belongs on the transporter side (has_input / cargo) and in
      the cellular-component and description fields here. Full text of
      PMID:9642203 was not available (PMC restricts access), so the precise
      experiment behind the row could not be checked; I therefore do not REMOVE
      and record the issue as a probable source defect.
    supported_by:
    - reference_id: PMID:39126017
      supporting_text: >-
        the resulting pro-PaAP is secreted across the outer membrane via the Xcp
        export machinery (step 2) [23]
    - reference_id: PMID:9642203
      supporting_text: >-
        Furthermore, a hitherto undefined protein with homology to a Streptomyces griseus
        aminopeptidase accumulated under these conditions.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0015628
      confidence: PROBABLE
      explanation: >-
        PA2939 (PaAP) is a cargo of the Xcp type II secretion system, not a
        component of it. GO practice reserves "protein secretion by the type II
        secretion system" for the secretion machinery; the secreted substrate does
        not carry out the process. Consider deleting the row, or recording the
        cargo relationship on the Xcp proteins (has_input) and keeping the
        extracellular region CC on PaAP.
- term:
    id: GO:0043952
    label: protein transport by the Sec complex
  evidence_type: IDA
  original_reference_id: PMID:9642203
  qualifier: involved_in
  review:
    summary: >-
      PseudoCAP IDA from Braun et al. 1998; the only experimental fact visible for
      PaAP is removal of its signal peptide (UniProt: protein sequence of residues
      25-34 from this paper).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Two problems. First, PaAP is a cargo and does not perform Sec-dependent
      translocation (SecYEG/SecA do). Second, signal-peptide removal shows export
      across the inner membrane but does not by itself identify the Sec translocon
      (versus Tat). Full text was not available, so whether the paper has
      Sec-specific evidence is unchecked; I do not REMOVE, and flag a probable
      PseudoCAP defect on the cargo point.
    supported_by:
    - reference_id: file:PSEAE/lap/lap-uniprot.txt
      record_section: [REF]
      supporting_text: PROTEIN SEQUENCE OF 25-34.
    - reference_id: PMID:9642203
      supporting_text: >-
        The signal sequence is cleaved off during transport across the inner membrane
    source_defects:
    - defect_type: WRONG_TERM
      resource: PSEUDOCAP
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0043952
      confidence: PROBABLE
      explanation: >-
        PA2939 (PaAP) is a Sec-exported cargo; it is not part of the Sec
        translocation machinery. The evidence visible to us (UniProt's
        N-terminal sequence from residue 25, credited to PMID:9642203) shows its
        signal peptide is removed, which is not participation in the transport
        process and does not by itself identify the Sec complex; the full text
        was not read. Consider deleting the row.
core_functions:
- description: >-
    Secreted zinc-dependent (binuclear Zn, M28 family) aminopeptidase that removes
    single N-terminal residues from peptides and unstructured protein regions with
    a free amino terminus, preferring Leu and Lys. Exported as an autoinhibited
    proenzyme via Sec and the Xcp type II secretion system and activated
    extracellularly by LysC removal of its C-terminal propeptide; it completes the
    extracellular digestion of proteins by the secreted endopeptidases, supplying
    amino acids for growth, and is abundant in biofilm matrix and outer membrane
    vesicles.
  molecular_function:
    id: GO:0070006
    label: metalloaminopeptidase activity
  directly_involved_in:
  - id: GO:0006508
    label: proteolysis
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:11533066
    supporting_text: >-
      This activity was inhibited by Zn
      chelators but not by inhibitors of serine- or thiol-proteases, suggesting that
      AP(28) is a Zn-dependent enzyme.
  - reference_id: PMID:37386135
    supporting_text: >-
      PaAP is a
      promiscuous aminopeptidase acting on unstructured regions of peptides and
      proteins.
  - reference_id: PMID:34133429
    supporting_text: >-
      pointed at LysC as the principal
      activating protease, cleaving a Lys512-Ala513 peptide bond at the C-terminal end
      of pro-PaAP.
  - reference_id: PMID:32184248
    supporting_text: >-
      Our results suggest that PaAP is an integral
      part of a proteolytic sequence in P. aeruginosa that permits the utilization of
      protein as a nutrient source.
suggested_questions:
- question: >-
    PTN000254534 carries the only IBD in PTHR12147 (proteolysis), seeded solely by
    PaAP. If the node spans only SGAP-like M28A aminopeptidases, could PAINT add a
    metalloaminopeptidase activity (GO:0070006) IBD, seeded also by characterised
    members such as Streptomyces griseus aminopeptidase (P80561) and B. subtilis
    YwaD (P25152)?
- question: >-
    Should the Xcp T2SS cargo relationship for PaAP be captured as has_input on the
    Xcp machinery (e.g. in a GO-CAM) rather than as a PseudoCAP process annotation on
    the cargo?
- question: >-
    Does the PA domain of mature PaAP recruit protein substrates or mediate its
    association with outer membrane vesicles?
suggested_experiments:
- description: >-
    Systematic N-terminomics of protein and peptide substrates (and OMV-bound
    versus free enzyme) with wild type and PA-domain-deleted PaAP, to define the
    natural substrate range and the role of the PA domain.
