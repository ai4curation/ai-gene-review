  - statement: >-
      PaAP was identified as a secreted, heat-stable, zinc-dependent aminopeptidase
      (AP56, activated to AP28) encoded by PA2939.
    supporting_text: >-
      This activity was inhibited by Zn
      chelators but not by inhibitors of serine- or thiol-proteases, suggesting that
      AP(28) is a Zn-dependent enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title, authors and abstract match UniProt RN[3] (function, catalytic activity,
      subcellular location). Abstract-only in cache. Supports the PseudoCAP IDA
      proteolysis seed and the UniProt EXP aminopeptidase/extracellular rows.
