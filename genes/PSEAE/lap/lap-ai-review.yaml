id: Q9HZQ8
gene_symbol: lap
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  lap (PA2939; PaAP, also called PaaP or LAP) encodes the major secreted
  aminopeptidase of Pseudomonas aeruginosa, a peptidase M28 (M28A, SGAP-like)
  family enzyme with an N-terminal protease-associated (PA) domain and a
  binuclear zinc catalytic domain. It is made as a 536-residue pre-proenzyme: the
  signal peptide is removed on export across the inner membrane, the proenzyme is
  secreted through the Xcp type II secretion system, and it is activated outside
  the cell when the endopeptidase LysC (and, less directly, elastase and alkaline
  protease) removes an autoinhibitory C-terminal propeptide that otherwise blocks
  the active-site cleft. The mature enzyme removes single N-terminal residues from
  peptides and unstructured protein regions that carry a free amino terminus, with
  a preference for Leu and Lys; it is thermostable, has a pH optimum near 8.5 and
  is inhibited by metal chelators. PaAP is one of the most abundant proteins of the
  biofilm matrix and of outer membrane vesicles. It completes the extracellular
  digestion of proteins begun by the secreted endopeptidases, releasing amino
  acids that support growth on protein (an RpoS- and LasR-regulated public good),
  and its activity modulates biofilm development and dispersal.
existing_annotations:
- term:
    id: GO:0004177
    label: aminopeptidase activity
  evidence_type: EXP
  original_reference_id: PMID:11533066
  qualifier: enables
  review:
    summary: >-
      Aminopeptidase activity of purified PaAP (AP56 and AP28) on Leu-pNA and on
      peptides with a free N-terminus was shown directly in Cahan et al. 2001.
    action: MODIFY
    reason: >-
      The activity is well established, but the term is less specific than the
      evidence. The same paper shows inhibition by Zn chelators but not serine or
      thiol protease inhibitors, and the crystal structures (PMID:37386135) show a
      binuclear zinc active site, so the appropriate term is the is_a descendant
      metalloaminopeptidase activity (GO:0070006), which also subsumes the
      InterPro-derived metalloexopeptidase activity row.
    proposed_replacement_terms:
    - id: GO:0070006
      label: metalloaminopeptidase activity
    supported_by:
    - reference_id: PMID:11533066
      supporting_text: >-
        This activity was inhibited by Zn
        chelators but not by inhibitors of serine- or thiol-proteases, suggesting that
        AP(28) is a Zn-dependent enzyme.
    - reference_id: PMID:37386135
      supporting_text: >-
        The active site contains two zinc ions; Zn1 is coordinated by D306, H296
        and D369, while Zn2 is coordinated by E341, H467 and D306.
    - reference_id: file:PSEAE/lap/lap-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        A secreted aminopeptidase. Acts on free N-terminal amino
        groups with a very strong preference for Leu- followed by Met- and
        Ala-
