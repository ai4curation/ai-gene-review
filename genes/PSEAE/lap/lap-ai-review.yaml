      supporting_text: >-
        Using leucine-p-nitroanilide (Leu-pNA) as a substrate, we demonstrated
        aminopeptidase activity in the culture filtrates of several Pseudomonas
        aeruginosa strains.
    - reference_id: PMID:39126017
      supporting_text: >-
        Leu-Ala and Ala4, having free N-termini, are both cleaved readily [17].
