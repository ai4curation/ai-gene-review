  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000254534
  - UniProtKB:Q9HZQ8
  review:
    summary: >-
      IBA from PAINT node PTN000254534 (PTHR12147, peptidase M28), whose IBD is
      seeded only by this gene's own PseudoCAP IDA row. The target appearing in
      its own WITH/FROM is expected, not circular.
    action: ACCEPT
    reason: >-
      The seed is sound (direct peptide hydrolysis by the purified enzyme), PaAP
      retains the conserved M28 zinc ligands and is catalytically active, so it is
      squarely inside the clade that inherits peptidase function. Proteolysis is the
      appropriate general process term for a peptidase; the more specific
      information belongs in the MF (metalloaminopeptidase activity).
    supported_by:
