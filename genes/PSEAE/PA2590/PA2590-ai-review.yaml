  label: Pseudomonas aeruginosa PAO1
description: >-
  PA2590 (Q9I0P7) is an uncharacterised TonB-dependent outer membrane receptor of Pseudomonas
  aeruginosa PAO1 (PANTHER PTHR47234:SF3). It has a signal peptide, an N-terminal secretin/TonB
  short N-terminal (STN) domain of the kind that marks TonB-dependent transducers of
  cell-surface signalling systems, a plug domain and a 22-strand beta-barrel. Receptors of this
  family bind a ligand at the cell surface and, energised by the TonB-ExbB-ExbD complex through
  the TonB box, translocate it across the outer membrane; many import siderophore-iron complexes
  or other scarce nutrients. The substrate of this receptor is not known.
