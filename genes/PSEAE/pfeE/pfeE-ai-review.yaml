gene_symbol: pfeE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  PfeE (PA2689) is a periplasmic esterase-D-family (alpha/beta hydrolase fold) siderophore hydrolase
  of Pseudomonas aeruginosa, encoded next to the ferric-enterobactin outer-membrane transporter gene
  pfeA and induced, like pfeA, by enterobactin. Purified PfeE hydrolyses the trilactone backbone
  of ferric enterobactin, a xenosiderophore made by enterobacteria, into three 2,3-dihydroxybenzoylserine
  units that remain bound to iron; complete release of the iron needs a reductant as well. Crystal
  structures of PfeE alone and of an inactive mutant bound to ferric enterobactin define the substrate
  site and a Ser-His-Asp catalytic triad. PfeE is a monomer located in the periplasm, so in P. aeruginosa
  iron is released from enterobactin in the periplasm, and ferric enterobactin never reaches the
  cytoplasm (unlike E. coli, where the cytoplasmic esterase Fes does this). Deleting pfeE strongly
  reduces iron uptake via enterobactin. PfeE can also hydrolyse salmochelin S4.
