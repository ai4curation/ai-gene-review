suggested_questions:
- question: >-
    Should PfeE carry a process term for siderophore-iron import? Comparable esterases (E. coli Fes,
    A. fumigatus SidJ) carry GO:0033214 only as acts_upstream_of_or_within from mutant data; is iron
    release by siderophore hydrolysis a step of import in GO's sense?
- question: >-
    Which periplasmic or inner-membrane reductase completes iron release from the Fe(III)-DHBS products
    of PfeE?
suggested_experiments:
- description: >-
    Screen periplasmic reductase mutants for loss of enterobactin-dependent 55Fe uptake in a pfeE-proficient
    background, and assay iron release from PfeE products in periplasmic extracts.
