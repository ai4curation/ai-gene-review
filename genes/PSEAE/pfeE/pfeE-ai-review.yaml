proposed_new_terms:
- proposed_name: ferric enterobactin esterase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the three ester bonds of the trilactone backbone of Fe(III)-enterobactin,
    giving Fe(III)-(2,3-dihydroxybenzoyl-L-serine) and two free 2,3-dihydroxybenzoyl-L-serine molecules
    (RHEA:30111; EC 3.1.1.108).
  justification: >-
    GO:0008849 enterochelin esterase activity is defined on iron-free enterobactin. PfeE (and E.
    coli Fes) act on the ferric siderophore; no GO term covers EC 3.1.1.108.
  supported_by:
  - reference_id: PMID:30086222
    supporting_text: >-
      Purified PfeE hydrolyzed ferri-ENT into three molecules of 2,3-DHBS (2,3-dihydroxybenzoylserine)
      still complexed with ferric iron
