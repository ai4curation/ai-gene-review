    summary: >-
      IBA from PTN002868704 (siderophore esterase clade; 3 seeds, 9 leaf IBAs in 8 taxa). Seeds are
      Aspergillus fumigatus SidJ (Q4WF29, fusarinine C esterase, AspGD IMP), Aspergillus nidulans
      EstB (Q5AV79, triacetylfusarinine C esterase, UniProt EXP GO:0008849) and PfeE itself (PseudoCAP
      IDA, PMID:30086222).
    action: MODIFY
    reason: >-
      The node term is correct and suitably broad for a clade of siderophore esterases acting on
      different siderophores, and the IBD would stand on the two Aspergillus seeds. For PfeE the
      bond hydrolysed is known: the carboxylic ester (lactone) bonds of the enterobactin triserine
      backbone, so the specific term is GO:0052689 carboxylic ester hydrolase activity (is_a GO:0016788).
      No GO term exists yet for ferric-enterobactin esterase activity (EC 3.1.1.108); one is proposed.
      No node-level defect.
