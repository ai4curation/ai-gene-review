suggested_questions:
- question: >-
    PAO1 PA5093 (Q9HU90) is a HutH-like in-paralog lacking the MIO Ala-Ser-Gly motif,
    yet it inherits histidase IBAs from PTN000796665. Should PAINT add NOT annotations
    at its leaf, and are other members of PTN000796665 (e.g. Fusobacterium FN0791,
    or the extra Shewanella copies) also MIO-less HutH1-type proteins?
- question: >-
    What is the function, if any, of the conserved MIO-less HutH1-type paralog
    (PA5093) found in the hut loci of most Pseudomonas species?
- question: >-
    Does the full text of PMID:4290562 describe a histidase-deficient mutant
    (supporting IMP), or only enzyme assays (supporting IDA)?
suggested_experiments:
- description: >-
    Delete PA5093 and PA5098 singly and together in PAO1, test growth on histidine
    versus urocanate, and assay histidase in extracts and with purified proteins, to
    confirm that PA5098 alone is the histidase and to probe any histidine-binding or
    regulatory role of the MIO-less PA5093.
