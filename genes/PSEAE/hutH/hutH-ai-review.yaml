- term:
    id: GO:0004397
    label: histidine ammonia-lyase activity
  evidence_type: IMP
  original_reference_id: PMID:4290562
  qualifier: enables
  review:
    summary: >-
      PseudoCAP row from Lessie and Neidhardt 1967. It is the sole seed of the
      PTN000796665 histidase IBD (21 leaf IBAs) and one of 9 seeds of the
      PTN000796617 ammonia-lyase IBD (269 leaf IBAs). The paper assays
      P. aeruginosa histidase, partially purifies it, and reports its size and Km.
    action: ACCEPT
    reason: >-
      Sound seed. The paper measures histidase activity of the P. aeruginosa enzyme
      directly. The partially purified enzyme (about 210 kDa) fits a tetramer of the
      53.8 kDa PA5098 subunit. PA5098 is the only PAL/histidase-family protein in
      PAO1 that has the MIO motif, so the measured activity can be assigned to it
      even though the 1967 paper predates genes. The evidence is a direct enzyme
      assay rather than a hutH mutant (the mutants described are urocanase-deficient
      and regulatory), so IDA would be the better code; this is flagged to PseudoCAP.
      It does not change the soundness of the IBDs.
    supported_by:
    - reference_id: PMID:4290562
      supporting_text: >-
        Its K(m) for histidine was 2 x 10(-3)m in tris(hydroxymethyl)aminomethane
        chloride buffer.
    - reference_id: PMID:4290562
      supporting_text: >-
        The molecular weight of partially purified histidase was estimated at
        210,000 by sucrose gradient centrifugation.
    - reference_id: file:PSEAE/hutH/hutH-bioinformatics/RESULTS.md
      supporting_text: >-
        It is the functional histidase of PAO1.
