taxon:
  id: NCBITaxon:208964
  label: Pseudomonas aeruginosa PAO1
description: >-
  hutH (PA5098) encodes histidine ammonia-lyase (histidase, EC 4.3.1.3), the
  first enzyme of the histidine utilization (hut) pathway of Pseudomonas
  aeruginosa. It is a cytoplasmic, homotetrameric member of the PAL/histidase
  (aromatic amino acid ammonia-lyase) family. Its catalytic electrophile is a
  4-methylidene-imidazol-5-one (MIO) cofactor, formed autocatalytically from the
  internal Ala142-Ser143-Gly144 tripeptide. The enzyme eliminates ammonia from
  L-histidine to form trans-urocanate, which is both the substrate of urocanase
  (HutU) and the physiological inducer of the hut operons, acting through the
  HutC repressor. Histidase synthesis is induced by urocanate and strongly
  subject to catabolite and nitrogen control. The partially purified
  P. aeruginosa enzyme is about 210 kDa, with a Km for histidine near 2 mM and
  sigmoid kinetics under some conditions. The hut locus also encodes a second,
  divergent HutH-like protein (PA5093) that lacks the MIO-forming residues;
  PA5098 is the functional histidase.
