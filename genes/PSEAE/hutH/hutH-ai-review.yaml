core_functions:
- description: >-
    Cytoplasmic MIO-dependent histidine ammonia-lyase that converts L-histidine to
    trans-urocanate and ammonia, the first and committed step of histidine
    utilization. Its product urocanate also acts as the HutC-mediated inducer of the
    hut operons.
