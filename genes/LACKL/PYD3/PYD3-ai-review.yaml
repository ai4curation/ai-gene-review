proposed_new_terms: []
suggested_questions:
- question: >-
    Given the 71 mM Km for N-carbamoyl-beta-alanine, is flux through the
    fungal enzyme limited by substrate accumulation in vivo, or does a second
    substrate or activator lower the effective Km?
suggested_experiments:
- description: >-
    Measure intracellular N-carbamoyl-beta-alanine in L. kluyveri grown on
    uracil, and test whether peptide pools inhibit PYD3 in vivo.
  experiment_type: metabolomics
