id: Q96W94
gene_symbol: PYD3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4934
  label: Lachancea kluyveri
description: >-
  PYD3 of the yeast Lachancea (Saccharomyces) kluyveri encodes beta-alanine
  synthase (beta-ureidopropionase, EC 3.5.1.6), the third and final enzyme of
  the reductive pyrimidine catabolic pathway. It hydrolyzes
  N-carbamoyl-beta-alanine (3-ureidopropanoate) to beta-alanine, ammonia and
  carbon dioxide, and pyd3 mutants cannot use N-carbamoyl-beta-alanine as a
  nitrogen source. Unlike the nitrilase-superfamily beta-alanine synthases of
  animals, plants and Dictyostelium, the fungal enzyme is a homodimeric
  AcyI/M20-family amidohydrolase with a di-zinc catalytic centre in its larger
  domain and a dimerization domain that closes over the substrate; it appears
  to have been recruited from a dizinc exopeptidase ancestor and is inhibited
  by di- and tripeptides. The yeast enzyme has a high Km (about 71 mM) for
  N-carbamoyl-beta-alanine.
existing_annotations:
- term:
    id: GO:0003837
    label: beta-ureidopropionase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:3.5.1.6
  review:
    summary: >-
      The EC 3.5.1.6 assignment is experimentally grounded: PYD3 complements a
      pyd3 mutant defective in beta-alanine synthase activity, confers growth on
      N-carbamyl-beta-alanine to S. cerevisiae, and the purified enzyme converts
      N-carbamyl-beta-alanine to beta-alanine.
    action: ACCEPT
    reason: Core molecular function, supported by genetics, kinetics and product-bound crystal structures.
    supported_by:
    - reference_id: PMID:11454750
      supporting_text: >-
        When the S. kluyveri PYD3 gene was expressed in S. cerevisiae, which has
        no pyrimidine catabolic pathway, it enabled growth on
        N-carbamyl-beta-alanine as the sole nitrogen source.
    - reference_id: PMID:18448119
      supporting_text: >-
        the conversion of N-carbamyl-beta-alanine to beta-alanine, is catalyzed
        by two beta-alanine synthase (beta ASase, EC 3.5.1.6) subfamilies
    - reference_id: PMID:17916556
      supporting_text: >-
        We determined the crystal structures of wild-type beta-alanine synthase
        in complex with the reaction product beta-alanine
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002933
  review:
    summary: Peptidase M20 domain mapping to generic hydrolase activity; true for this amidohydrolase.
    action: TOO_GENERAL
    reason: >-
      True but entailed by beta-ureidopropionase activity (GO:0003837),
      accepted in this review.
- term:
    id: GO:0016813
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds,
      in linear amidines
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010158
  review:
    summary: >-
      The HyuC InterPro entry spans N-carbamoyl amidohydrolases and allantoate
      amidinohydrolases, and its GO mapping carries the linear-amidine class.
      Beta-alanine synthase cleaves the carbamoyl (ureido) amide bond of
      N-carbamyl-beta-alanine; GO places beta-ureidopropionase activity under
      the linear-amide class GO:0016811, not under linear amidines.
    action: REMOVE
    reason: >-
      Demonstrably wrong reaction class for this member. The characterized
      reaction is an N-carbamyl (amide) bond hydrolysis, which the structural
      work contrasts explicitly with peptide-bond hydrolysis by the ancestral
      exopeptidases; no amidine substrate has been reported.
    supported_by:
    - reference_id: PMID:14534321
      supporting_text: >-
        the hydrolysis of an N-carbamyl bond by beta AS compared with the
        hydrolysis of a peptide bond by exopeptidases
- term:
    id: GO:0006208
    label: pyrimidine nucleobase catabolic process
  evidence_type: IMP
  original_reference_id: PMID:11454750
  qualifier: involved_in
  review:
    summary: >-
      PYD3 catalyzes the final step of reductive uracil and thymine
      degradation; a pyd3 mutant cannot grow on N-carbamyl-beta-alanine and has
      reduced beta-alanine synthase activity, and expression is induced by
      pathway intermediates.
    action: NEW
    reason: >-
      PYD3 performs the terminal catalytic step of the pathway itself, so the
      process annotation reflects participation, not only requirement. No
      process annotation is present in GOA for this TrEMBL entry.
    supported_by:
    - reference_id: PMID:11454750
      supporting_text: >-
        A Saccharomyces kluyveri pyd3 mutant that is unable to grow on
        N-carbamyl-beta-alanine as the sole nitrogen source and exhibits
        diminished beta-alanine synthase activity
    - reference_id: PMID:17916556
      supporting_text: >-
        Beta-alanine synthase is the final enzyme of the reductive pyrimidine
        catabolic pathway
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:14534321
  qualifier: enables
  review:
    summary: >-
      The crystal structure shows a di-zinc metal centre in the catalytic
      domain, and the substrate coordinates one of the zinc ions in the closed
      complex.
    action: NEW
    reason: Catalytic metal cofactor observed directly in several crystal structures.
    supported_by:
    - reference_id: PMID:14534321
      supporting_text: >-
        a larger catalytic domain with a dizinc metal center, which represents
        the active site of beta AS
    - reference_id: PMID:17916556
      supporting_text: >-
        coordination to one of the zinc ions of the di-metal center
