- id: PMID:11454750
  title: Eukaryotic beta-alanine synthases are functionally related but have a high
    degree of structural diversity.
  full_text_unavailable: true
  findings:
  - statement: >-
      S. kluyveri PYD3 complements a pyd3 beta-alanine synthase mutant and is
      unrelated in sequence to mammalian beta-alanine synthases.
    supporting_text: >-
      In contrast, the S. kluyveri protein is quite different from these and
      more similar to bacterial N-carbamyl amidohydrolases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genetic identification of PYD3; abstract read.
- id: PMID:14534321
  title: Yeast beta-alanine synthase shares a structural scaffold and origin with
    dizinc-dependent exopeptidases.
  full_text_unavailable: true
  findings:
  - statement: The enzyme is a homodimer with a di-zinc catalytic domain and a dimerization domain.
    supporting_text: >-
      The subunit of the homodimeric enzyme consists of two domains: a larger
      catalytic domain with a dizinc metal center
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: First crystal structure (PDB 1R3N, 1R43); abstract read.
- id: PMID:17916556
  title: Crystal structures of yeast beta-alanine synthase complexes reveal the mode
