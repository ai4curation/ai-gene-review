  full_text_unavailable: true
  findings:
  - statement: Glu159 and Arg322 are crucial for catalysis.
    supporting_text: >-
      identify Glu(159) and Arg(322) as crucial for catalysis and His(262) and
      His(397) as functionally important but not essential
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Substrate and product complexes plus mutagenesis; abstract read.
- id: PMID:18448119
  title: A recruited protease is involved in catabolism of pyrimidines.
  full_text_unavailable: true
  findings:
  - statement: >-
      Fungal beta-alanine synthase has a high Km and is inhibited by short
      peptides, consistent with recruitment from a protease ancestor.
    supporting_text: >-
      which has a high K(m) value (71 mM)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Kinetic comparison of the two eukaryotic beta-alanine synthase classes; abstract read.
