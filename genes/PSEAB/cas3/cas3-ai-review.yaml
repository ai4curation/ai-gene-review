    label: maintenance of CRISPR repeat elements
  evidence_type: IMP
  original_reference_id: PMID:26586803
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      Well grounded and correctly hedged. Three independent lesions in this gene
      abolish new spacer acquisition in the transplanted Pseudomonas aeruginosa
      type I-F system: a stop codon placed after the Cas2 module, a nuclease
      domain D124A substitution, and a helicase domain D576N substitution. The
      acts_upstream_of_or_within qualifier is right because in type I-F the
      acquisition requirement is distributed across the fused Cas2 module, the
      catalytic domains, and the Csy complex, rather than resting on a single
      Cas3 step in the integration chemistry.
