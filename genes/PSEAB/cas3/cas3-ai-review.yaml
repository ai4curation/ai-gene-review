- term:
    id: GO:0004536
    label: DNA nuclease activity
  evidence_type: IDA
  original_reference_id: PMID:32170016
  qualifier: enables
  review:
    summary: >-
      Cas3 is the entity that degrades the target DNA. Reconstitution of the
      Pseudomonas aeruginosa Csy complex with Cas3, ATP and Mg(2+) gives
      cleavage of a labelled double-stranded DNA substrate that is strictly
      Cas3-dependent: the no-Cas3 lane is the negative control, and relieving
      anti-CRISPR inhibition restores cleavage.
    action: NEW
    reason: >-
      GOA for Q02ML8 holds only the two CACAO rows on GO:0043571 and no
      molecular function at all, not even an IEA, which is almost certainly
      because the fused Cas2-3 architecture does not match the signatures the
      electronic pipelines key on. Comparator check: the Escherichia coli
      orthologue Cas3 (P38036) carries GO:0000014, GO:0008296, GO:0033677,
      GO:0003690, GO:0000287 and GO:0003724, and every type I system's Cas3 is
      the degradation nuclease, so a blank molecular-function profile here is a
      one-protein pipeline failure rather than an ontology convention. I
      deliberately propose the moderately specific GO:0004536 rather than the
      Escherichia coli children GO:0000014 or GO:0008296: the assay used
      double-stranded DNA presented by the Csy complex and did not resolve
      exonucleolytic versus endonucleolytic mode or strand preference for this
      orthologue, so asserting those children would transfer a result that
      cannot be cited for this protein.
    supported_by:
    - reference_id: PMID:32170016
      supporting_text: WT AcrF9 inhibits the DNA binding and subsequent Cas3 recruitment
        of the Csy complex, suppressing DNA degradation
    - reference_id: PMID:32170016
      supporting_text: We found that these mutations result in much stronger DNA cleavage
        activities of Cas3 compared to the WT AcrF6
    - reference_id: PMID:32170016
      supporting_text: The Cas3 protein (P. aeruginosa) was proposed to interact with
        the C-terminal helical bundle of Cas8f
- term:
    id: GO:0004386
    label: helicase activity
  evidence_type: IMP
  original_reference_id: PMID:26586803
  qualifier: enables
  review:
    summary: >-
      The protein carries a superfamily 2 helicase domain with a DEAD-box motif
      at residues 576 to 579, substitution of the motif aspartate abolishes
      function in vivo in two independent assays, and the crystal structure of
      this protein shows the helicase domain in a nucleotide-bound state with a
      DNA-binding tunnel that an inhibitor can plug.
    action: NEW
    reason: >-
      Missing from GOA along with every other molecular function for this
      protein. Again the generic term rather than the Escherichia coli
      orthologue's GO:0033677 DNA/RNA helicase activity: no unwinding assay on
      Pseudomonas aeruginosa Cas3 has established which duplex it acts on, so
      the substrate-specific child is not supportable here. The evidence code is
      IMP because the grounding is catalytic-residue mutants rather than a direct
      unwinding measurement.
    supported_by:
    - reference_id: PMID:26586803
