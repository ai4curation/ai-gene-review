- term:
    id: GO:0099048
    label: CRISPR-cas system
  evidence_type: IMP
  original_reference_id: PMID:26586803
  qualifier: involved_in
  review:
    summary: >-
      Cas3 performs the target interference stage that this term's definition
      names as the third of the system's three stages, and through its Cas2
      module it also acts in the acquisition stage. Both are supported by
      gene-specific mutant phenotypes in this strain's system.
    action: NEW
    reason: >-
      Comparator check: every Escherichia coli Cascade subunit plus Cas1 and
      Cas2 carry involved_in GO:0099048 by IDA, yet no Pseudomonas aeruginosa
      PA14 cas gene does, which marks a per-strain curation lag rather than a
      convention. Checked against QuickGO: GO:0099048 is neither an ancestor nor
      a descendant of GO:0043571, so it does not duplicate the existing
      annotation. Cas3 itself does the unwinding and degradation, so this is
      participation, not mere requirement.
    supported_by:
    - reference_id: PMID:26586803
      supporting_text: Point mutations introducing single amino acid substitutions in
        the endonuclease (D124A) and helicase (D576N) domains of the Cas3 protein also
        prevented spacer acquisition
    - reference_id: PMID:28985564
      supporting_text: Formation of the R-loop in both Csy and the related Type I-E
        Cse complexes triggers recruitment of the endonuclease Cas3, which degrades the
        target dsDNA
    - reference_id: PMID:26416740
      supporting_text: The third anti-CRISPR protein operates by binding to the Cas3
        helicase-nuclease and preventing its recruitment to the DNA-bound CRISPR-Cas
        complex
