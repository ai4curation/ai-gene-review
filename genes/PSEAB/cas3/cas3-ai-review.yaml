id: Q02ML8
gene_symbol: cas3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208963
  label: Pseudomonas aeruginosa (strain UCBPP-PA14)
description: >-
  Cas3 of the Pseudomonas aeruginosa UCBPP-PA14 type I-F (Yersinia-subtype)
  CRISPR-Cas system is a 1076-residue Cas2-Cas3 fusion protein: type I-F systems
  encode no separate cas2 gene, so a Cas2 module occupies the N-terminal
  approximately 120 residues ahead of an HD-family metal-dependent nuclease
  domain and a superfamily 2 ATP-dependent helicase domain. The two halves serve
  the two halves of the pathway. Through its Cas2 module the protein is required
  for capture and integration of new spacers alongside Cas1, and through its
  nuclease and helicase domains it is the destruction machine of the
  interference stage: once the Csy surveillance complex has formed a
  PAM-licensed R-loop on an invading DNA, Cas3 is recruited to the C-terminal
  helical bundle of the Csy large subunit Cas8f and processively unwinds and
  degrades the target. Point substitutions in either the nuclease or the
  helicase catalytic centre abolish function in vivo. The recruitment step is
  the sole target of the phage anti-CRISPR protein AcrIF3, which clamps Cas3 in
  a nucleotide-bound state, occludes the helicase DNA-binding tunnel and masks
  the surface the Csy complex uses.
