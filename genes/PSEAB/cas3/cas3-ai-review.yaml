knowledge_gaps:
- gap_statement: >-
    No nuclease or helicase activity has been measured on purified Pseudomonas
    aeruginosa Cas3 in isolation, so the mode of DNA cleavage (endonucleolytic
    versus exonucleolytic, strand preference, processivity) and the duplex
    substrate of the helicase are undetermined for this orthologue.
  boundary: >-
    What is established is that Cas3 is necessary and sufficient to convert
    Csy-bound DNA into degraded product in vitro, that both catalytic centres
    are required in vivo, and that the helicase domain binds nucleotide and has
    a DNA-binding tunnel. The Escherichia coli orthologue's detailed activities
    (single-stranded DNA endonuclease, 3'-5' exonuclease, DNA/RNA helicase) have
    not been reproduced on this protein.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    The absence of any molecular-function annotation on Q02ML8, in contrast to
    nine on the Escherichia coli orthologue, makes the destruction step of the
    best-studied anti-CRISPR system invisible to GO-based reasoning, and leaves
    the nature of the Cas2-3 fusion's division of labour unresolved.
  provenance:
  - reference_id: PMID:32170016
    supporting_text: We found that these mutations result in much stronger DNA cleavage
      activities of Cas3 compared to the WT AcrF6
  - reference_id: PMID:27455460
    supporting_text: locks PaCas3 in an ADP-bound form, blocks the entrance of the DNA-binding
      tunnel in the helicase domain, and masks the linker region and C-terminal domain
      of PaCas3, thereby preventing recruitment by Cascade and inhibiting the type I-F
      CRISPR-Cas system
  resolution: >-
    Run the standard Cas3 biochemical panel (single-stranded and
    double-stranded DNA nuclease assays, directional unwinding, ATPase) on
    purified PA14 Cas2-3 and on isolated HD and helicase domains, then annotate
    the specific children of GO:0004536 and GO:0004386 that the results support.
suggested_questions:
- question: >-
    Does the Cas2 module of PA14 Cas2-3 contribute anything to interference, or
    is its role confined to adaptation? The D124 position sits at the
    module boundary and is also the HD nuclease metal ligand in the numbering
    used by the mutagenesis studies, so the two functions are hard to separate
    genetically.
- question: >-
    AcrIF3 blocks Cas3 recruitment while leaving the Csy complex able to bind
    its target, which converts the system into a sequence-specific
    DNA-binding module. Should that gain-of-function state (reported as
    conversion into a transcriptional repressor) be captured in GO at all, given
    that it occurs only during phage infection?
- question: >-
    Is PA14 Cas3 recruited as a monomer or as an oligomer, and does the
    nucleotide state that AcrIF3 traps correspond to the recruitment-competent
    conformation or to a post-translocation one?
suggested_experiments:
- hypothesis: >-
    PA14 Cas3 degrades the displaced non-target strand first and processively,
    as the Escherichia coli orthologue does, rather than cleaving both strands
    at the R-loop.
  description: >-
    Reconstitute the Csy complex with a target plasmid carrying strand-specific
    labels and run time-course cleavage with purified PA14 Cas2-3, mapping
    products by denaturing gel and sequencing. Repeat with HD-dead (D124A) and
    helicase-dead (D576N) proteins to assign products to each catalytic centre.
  experiment_type: in vitro nuclease mapping
- hypothesis: >-
    The helicase domain of PA14 Cas3 is an ATP-dependent 3' to 5' DNA
    translocase whose activity is licensed by Cas8f contact.
  description: >-
    Measure ATPase and unwinding of defined forked substrates by purified Cas2-3
    alone and in the presence of the Csy complex, and test whether AcrIF3
    inhibits the intrinsic activity or only the Cas8f-dependent stimulation.
  experiment_type: single-molecule or ensemble helicase assay
