knowledge_gaps:
- gap_statement: >-
    Whether Cas5f contributes to target DNA engagement in its own right, beyond
    donating one thumb residue to a pocket dominated by Cas8f, is undetermined.
    No Cas5f DNA-contact mutant has been tested, and no term is asserted for a
    Cas5f DNA-binding activity.
  boundary: >-
    Established: the Cas5f thumb is part of the structural sandwich around the
    PAM-containing duplex, and the type I-E Cas5 orthologue casD carries
    DNA/RNA hybrid binding rather than DNA binding. Not established: whether
    isolated Cas5f binds DNA, or whether its thumb contacts are load-bearing for
    target engagement.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Distinguishing structural proximity from functional contribution is exactly
    what separates a defensible subunit annotation from an over-annotation, and
    the answer determines whether Cas5f should carry a DNA-binding term at all.
  provenance:
  - reference_id: PMID:28985564
    supporting_text: Numerous positively charged residues line this DNA binding pocket,
      including residues from Cas7.6f (K299), the Cas5f thumb (R90), and especially the
      Cas8f hook (R24, K28, K31, R59, K71 and R78)
  resolution: >-
    Test Cas5f thumb substitutions (for example R90A) for target binding and
    interference in an otherwise wild-type complex, and assay isolated Cas5f for
    DNA binding.
- gap_statement: >-
    GO has no molecular-function term for crRNA-guided, PAM-licensed target
    recognition, the activity the assembled Csy complex has, so Cas5f can only
    be annotated with generic nucleic-acid-binding terms.
  boundary: >-
    The nuclease chemistry of the system is covered by existing terms and the
    structural steps are resolved to near-atomic detail; what is missing is a
    term for the guide dependence that defines the system.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: >-
    Without such a term the defining property of every Cas effector is invisible
    to GO-based reasoning.
  provenance:
  - reference_id: PMID:21536913
    supporting_text: the Csy proteins (Csy1-4) assemble into a 350 kDa ribonucleoprotein
      complex that facilitates target recognition by enhancing sequence-specific hybridization
      between the CRISPR RNA and complementary target sequences
  resolution: >-
    Request a molecular-function term for guide-RNA-dependent nucleic acid
    recognition, as proposed in modules/crispr_cas_adaptive_immunity.yaml. No
    existing id has been substituted for the missing concept here.
proposed_new_terms:
- proposed_name: CRISPR RNA-guided surveillance complex
  proposed_definition: >-
    A ribonucleoprotein complex composed of CRISPR-associated (Cas) proteins
    assembled around a single mature CRISPR RNA (crRNA), which uses the crRNA as
    a guide to locate nucleic acid complementary to its spacer sequence. In type
    I systems the complex additionally recognises a protospacer-adjacent motif,
    forms an R-loop at the target, and recruits a trans-acting nuclease for
    target destruction. The Pseudomonas aeruginosa type I-F complex, Csy, has the
    composition Cas8f(1)/Cas5f(1)/Cas7f(6)/Cas6f(1) with one 60-nucleotide crRNA;
    the type I-E equivalent is Cascade.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  justification: >-
    GO's entire CRISPR vocabulary is five biological-process terms (GO:0099048,
    GO:0043571, GO:0098672 and the obsolete GO:0110132 and GO:0110133), with no
    cellular-component term, so every subunit of every CRISPR surveillance
    complex can currently only be placed on the bare GO:0032991 root or on its
    generic child GO:1990904. The complex is a well-defined,
    stoichiometrically determined, structurally solved entity that ComplexPortal
    already models for the type I-E case (CPX-1005, Cascade complex), and the
    Cas7f backbone in particular is the surface targeted by several families of
    phage-encoded anti-CRISPR proteins, so a specific term would make a large
    body of structural and counter-defence curation expressible. This is the same
    request made from the Escherichia coli type I-E Cascade subunit reviews, so
    that the two systems ask for one term rather than two.
  supported_by:
  - reference_id: PMID:32170016
    supporting_text: The Csy complex is comprised of four types of Cas proteins (Cas5f-8f)
      and a single 60-nt crRNA
  - reference_id: PMID:21536913
    supporting_text: the Csy proteins (Csy1-4) assemble into a 350 kDa ribonucleoprotein
      complex that facilitates target recognition by enhancing sequence-specific hybridization
      between the CRISPR RNA and complementary target sequences
suggested_questions:
- question: >-
    Does Cas5f protect the mature crRNA directly, by occluding its 5' end from
    exonucleases, or indirectly, by being required for the complex to assemble
    at all? The two predict different fates for a crRNA bound by a
    Cas7f-Cas6f subcomplex in a csy2 null.
- question: >-
    Cas5f reads the crRNA 5' handle sequence-specifically. Does that make the
    repeat-derived handle a second specificity determinant alongside the
    protospacer-adjacent motif, and would handle mutations be tolerated by
    engineered guides in this system?
- question: >-
    Type I-E Cas5 (casD) is annotated with DNA/RNA hybrid binding. Does PA14
    Cas5f also contact the crRNA-target heteroduplex, or is that role carried
    entirely by the Cas7f thumbs in type I-F?
suggested_experiments:
- hypothesis: >-
    Cas5f is required for crRNA stability rather than for processing, so a csy2
    null accumulates cleaved but unprotected crRNA that is degraded.
  description: >-
