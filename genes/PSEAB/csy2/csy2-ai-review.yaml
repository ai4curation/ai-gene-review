id: Q02MM0
gene_symbol: csy2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208963
  label: Pseudomonas aeruginosa (strain UCBPP-PA14)
description: >-
  Csy2, also called Cas5f, is the Cas5-family subunit of the Csy crRNA-guided
  surveillance complex of the Pseudomonas aeruginosa UCBPP-PA14 type I-F
  (Yersinia-subtype) CRISPR-Cas system. The complex comprises one Cas8f/Csy1,
  one Cas5f/Csy2, six Cas7f/Csy3 and one Cas6f/Csy4 wrapped around a single
  60-nucleotide crRNA in a helically twisted G shape; Csy2 sits with Cas8f in
  the PAM-proximal tail. Its defining job is to cap and read the 5' handle of
  the crRNA: together with Cas8f it makes base-specific contacts that bend the
  first eight nucleotides into an S shape and fix the register of the guide
  within the complex, and its thumb domain also contributes to the pocket that
  grips the protospacer-adjacent-motif-containing target duplex. Csy2 is one of
  the two subunits strictly required for mature crRNA to accumulate in the cell,
  since an unincorporated guide is degraded, and loss of it therefore abolishes
  both target interference and the acquisition of new spacers.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21536913
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q02ML9
  review:
    summary: >-
      Uninformative as a molecular function. The Csy2-Csy1 interaction records a
      contact made inside the Csy ribonucleoprotein surveillance complex. Cas5f/Csy2
      and Cas8f/Csy1 together build the PAM-proximal tail of the spiral: the two
      subunits jointly clamp the 5' handle of the crRNA into its bent conformation,
      and the Cas5f thumb and the Cas8f hook form two of the three walls of the
      pocket that holds the target duplex. The contribution is therefore structural,
      and it is mutual.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0005198
      label: structural molecule activity
    reason: >-
      The term "protein binding" conveys nothing about function. The underlying
      observation is a contact internal to the Csy surveillance complex, so the
      honest subunit-level function is GO:0005198 structural molecule activity,
      defined as the action of a molecule that contributes to the structural
      integrity of a complex. None of its 22 children fits a non-ribosomal
      ribonucleoprotein, so the parent is the correct level. This keeps the
      replacement in the molecular-function aspect, which the GOA row's enables
      qualifier requires: a gene product cannot enable a cellular component, so
      the complex-membership reading of this row, however well supported, cannot
      be expressed by replacing an enables MF term with a CC term. Complex
      membership is instead carried by a dedicated NEW part_of GO:1990904
      ribonucleoprotein complex row and by core_functions in_complex, and the
      missing specific term is requested in proposed_new_terms. The same replacement is used for the
      equivalent intra-complex rows on cas6f, csy1, csy2 and csy3, and matches
      how the five Escherichia coli type I-E Cascade subunits were treated.
    supported_by:
    - reference_id: PMID:32170016
      supporting_text: the Cas5f and Cas8f subunits in the tail region also make extensive
        interactions with crRNA, causing the 8 nt of crRNA at its 5′ terminus to display
        an “S”-shape architecture, called the 5′ handle
    - reference_id: PMID:28985564
      supporting_text: the duplex region of the target DNA (including the G-C/G-C PAM)
        is sandwiched between the Cas8f N-terminal hook domain (residues 1-166), the
        Cas5f thumb domain (residues 48-109), and Cas7
