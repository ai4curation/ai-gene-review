knowledge_gaps:
- gap_statement: >-
    The molecular activity of PA14_60630 is unknown. No catalytic, binding or structural
    activity has been measured, and it is not known what the protein does to confer
    resistance to a tRNA-cleaving ribotoxin.
  boundary: >-
    Genetics places the protein inside the defence pathway and shows the protein product
    is required. Nothing is known downstream of that: the protein has not been purified,
    no partner has been identified, and whether it acts on the toxin, on damaged RNA, on
    the bRNA or on some other target is untested.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Without an activity, the protein can only be annotated to the process it participates
    in, and the proposed link to the function of the eukaryotic vault rests on predicted
    structure alone.
- gap_statement: >-
    Whether PA14_60630 assembles into a vault-like particle in cells, and whether it
    physically associates with the bRNA, has not been shown.
  boundary: >-
    A 12-protomer oligomer was modelled computationally and resembles the human vault in
    shape. There is no experimental structure, no native or recombinant purification, and
    no assay of protein-RNA association; the genetic requirement for both components is
    the only evidence linking them.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    If the particle is real and encloses the bRNA, this would be the first ribonucleoprotein
    vault with an assigned biological role, and the strongest available hypothesis for what
    the eukaryotic vault and its vault RNAs do.

suggested_questions:
- question: >-
    Does PA14_60630 belong to the major vault protein family proper, or to the more
    distant MVP-like groups? UniProt and InterPro place it in the Band7/SPFH stomatin
    group (PANTHER PTHR10264, no IPR039059), not in the major vault protein family
    (PTHR14165), and at 381 residues with the Band7 domain at 148-307 it can hold only
    about two or three N-terminal repeats, against seven to nine in the characterised
    bacterial, phage and eukaryotic vault proteins.
- question: >-
    Is the protein soluble and cytoplasmic, as a vault-like particle implies, or membrane
    associated, as its SPFH relatives and the ARBA prediction on its UniProt record
    suggest? No localisation experiment has been done.
- question: >-
    Does Band7 bind the bRNA directly, and is the bRNA enclosed by the particle in the way
    vault RNAs sit inside the eukaryotic vault?
- question: >-
    Should InterPro and PANTHER recognise a vault-like subgroup within the Band7/SPFH
    superfamily? The characterising study reports 2,026 high-confidence homologs with the
    repeat-plus-shoulder-plus-cap architecture, none of which currently carries the major
    vault protein signature.

suggested_experiments:
- hypothesis: >-
    PA14_60630 assembles into a vault-like particle that binds the bRNA.
  description: >-
    Purify the protein from P. aeruginosa and after heterologous expression, size it by
    size-exclusion chromatography against the excluded-volume behaviour expected of a
    megadalton particle, image it by negative stain and cryo-EM, and test for co-purifying
    RNA by nuclease protection and sequencing.
  experiment_type: structural biology
- hypothesis: >-
    The protein acts on damaged tRNA or on the bRNA rather than on the toxin itself.
  description: >-
    Reconstitute the purified protein with the EndoU toxin, with intact and cleaved
    tRNA-Arg(ACG), and with the bRNA, and test for binding, for protection of tRNA from
    cleavage, and for any effect on RtcB-mediated religation.
  experiment_type: in vitro reconstitution
