references:
- id: DOI:10.64898/2026.11.20.768214
  title: Homologs of the Major Vault Protein defend bacteria against ribotoxins
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Bullen, Holiday, Nagy, Robbins and Whiteley, bioRxiv, posted 2026-11-21. The sole
      functional source for this gene. Not peer reviewed, so correctness is left
      UNVERIFIED rather than VERIFIED; the identifier and content were checked against
      the posted PDF. Genetics is strong: deletion, complementation, premature stop
      codon, and a panel of unrelated stressors as a specificity control. The homology
      and assembly claims are weaker: the resemblance to major vault protein and the
      12-protomer vault-like particle are AlphaFold predictions, with no experimental
      structure, no purified protein, no demonstrated Band7-bRNA physical interaction and
      no localisation data. One internal inconsistency: the Methods give the tRNA-like
      region of bRNA as PA14_60630, which is the band7 coding gene, while the Figure 2C
      legend gives PA14_60620; the figure legend appears correct.
- id: file:PSEAB/PA14_60630/PA14_60630-uniprot.txt
  title: UniProtKB A0A0H2ZHM6 (A0A0H2ZHM6_PSEAB)
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Unreviewed TrEMBL entry. The protein name "Stomatin/prohibitin" is an unchecked
      submitter import (ECO:0000313|EMBL), and the "Membrane; Single-pass membrane
      protein" location and the band 7/mec-2 family statement rest only on ARBA
      association rules, so none of them is usable as support. The single-pass membrane
      prediction is in tension with the characterising study, which models a soluble
      vault-like oligomer and reports no membrane association; flagged as DISPUTED on
      that basis rather than because the record misidentifies the protein. The SMART
      Band7 domain feature at residues 148-307 is ordinary sequence-analysis evidence and
      is cited as such.

core_functions:
- description: >-
    Required component of the inducible ribotoxin-defence arm of the Rtc RNA-repair
    operon. On damage to tRNA by a pyocin-delivered ribotoxin, PA14_60630 is the most
    strongly induced gene in the genome, and the protein it encodes is required for the
    cell to survive that toxin: deletion sensitises, complementation restores protection,
    and a premature stop codon abolishes it. Protection also requires the non-coding
    bRNA transcribed upstream in the same locus, so the protein is necessary but not
    sufficient. No molecular_function is asserted because no activity of the protein has
    been measured; the predicted resemblance to the major vault protein is not evidence
    of an activity.
