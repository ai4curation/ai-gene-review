taxon:
  id: NCBITaxon:208963
  label: Pseudomonas aeruginosa UCBPP-PA14
description: >-
  PA14_60630 (called Band7 by the authors who characterised it) is a 381-residue
  Band7/SPFH-superfamily protein of Pseudomonas aeruginosa UCBPP-PA14, encoded in the
  RNA-repair (Rtc) operon alongside the RNA ligase RtcB, the RNA 3'-phosphate cyclase
  RtcA and a putative nucleotidyltransferase RlaP, under the divergently encoded
  sigma-54-dependent activator RtcR. Transcription of the operon is strongly induced by
  RNA damage: PA14_60630 is the most strongly induced gene in the genome after exposure
  to a pyocin-delivered ribotoxin that cleaves tRNA anticodon loops. Deletion of the gene
  makes cells markedly more sensitive to that ribotoxin, complementation restores
  protection, and a premature stop codon abolishes it, so the protein itself, not merely
  the transcript, is required. Protection additionally requires an upstream non-coding
  RNA from the same locus, so the protein is necessary but not sufficient. The predicted
  structure has an architecture resembling the eukaryotic major vault protein: N-terminal
  globular repeat domains, the central Band7/SPFH domain (residues 148-307) and a
  C-terminal cap helix. Its molecular activity is unknown, no physical partner has been
  demonstrated, and no experimental structure or subcellular localisation exists. Related
  proteins with the same predicted architecture occur in RNA-repair loci across most
  bacterial phyla.

existing_annotations:
- term:
    id: GO:0071237
    label: cellular response to bacteriocin
  evidence_type: IMP
  original_reference_id: DOI:10.64898/2026.11.20.768214
  review:
    summary: >-
      Deletion of PA14_60630 sensitises P. aeruginosa to the pyocin S4-delivered EndoU
      ribotoxin; plasmid complementation restores protection and a premature stop codon
      in the coding sequence abolishes it. The gene is also the most strongly induced in
      the genome on intoxication.
    action: NEW
    reason: >-
      The gene has no GO annotations at all, and this is the first functional
      characterisation. Pyocins are bacteriocins, so the stimulus the cell is responding
      to is exactly what this term names, and the response is cellular: transcriptional
      induction of the Rtc operon followed by resistance to the toxin. The protein does
      part of the work of that response rather than merely being required for it or
      being acted on by it, which is what the premature-stop-codon experiment
      establishes. It is specifically a response to this stimulus and not a general
      stress response: the same deletion leaves the cells no more sensitive than
      wild-type to UV, temperature, redox stress, bacteriophage or antibiotics. The more
      specific-sounding GO:0030153 bacteriocin immunity was considered and rejected: it
      is classified under GO:0009404 toxin metabolic process, so it describes metabolising
      the toxin, which is not what Band7 does, and in the literature it denotes a
      producer's cognate immunity protein, which the authors explicitly distinguish from
      this system. GO:0042742 defense response to bacterium was also rejected, because the
      experiments used purified and engineered pyocins rather than a live competitor.
