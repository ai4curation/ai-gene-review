id: Q02MM2
gene_symbol: cas6f
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208963
  label: Pseudomonas aeruginosa UCBPP-PA14
description: >-
  Cas6f (also called Csy4) is the pre-crRNA endoribonuclease of the Pseudomonas
  aeruginosa UCBPP-PA14 type I-F (Yersinia-subtype) CRISPR-Cas system. It
  recognises the hairpin formed by each 28-nucleotide CRISPR repeat in the
  primary array transcript, clamping the RNA stem between the protein body and
  an arginine-rich helix, and cleaves immediately downstream of the hairpin
  using a serine-histidine catalytic dyad. Catalysis is metal-ion independent
  and leaves 5'-hydroxyl and 3'-phosphate ends, releasing single-spacer guide
  RNAs. Cas6f does not release its product: it remains clamped on the crRNA
  3' hairpin, and that retention nucleates assembly of the Csy surveillance
  complex (one Cas8f/Csy1, one Cas5f/Csy2, six Cas7f/Csy3, one Cas6f and a
  single 60-nucleotide crRNA), in which Cas6f occupies the PAM-distal head. The
  protein is therefore both the crRNA-biogenesis enzyme and a structural subunit
  of the effector it loads, and loss of it abolishes mature crRNA and with it
  both target interference and new spacer acquisition.
