knowledge_gaps:
- gap_statement: >-
    GO has no cellular-component term for a CRISPR RNA-guided surveillance
    complex, so Csy complex membership can only be asserted with the generic
    GO:1990904 ribonucleoprotein complex, which does not distinguish it from a
    ribosome, a spliceosome or any other RNA-protein assembly.
  boundary: >-
    The composition and stoichiometry are settled to near-atomic resolution
    (Cas8f(1), Cas5f(1), Cas7f(6), Cas6f(1), crRNA(1)), and the Escherichia coli
    Cascade subunits are annotated the same uninformative way, so this is a
    shared ontology limitation rather than a gap in knowledge about this protein.
    ComplexPortal does model the type I-E equivalent as CPX-1005; GO does not.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: >-
    Every anti-CRISPR protein acts on this complex; without a term for it the
    host target of a whole class of phage counter-defence proteins is not
    machine-readable.
  provenance:
  - reference_id: PMID:32170016
    supporting_text: The Csy complex is comprised of four types of Cas proteins (Cas5f-8f)
      and a single 60-nt crRNA
  resolution: >-
    Request a cellular-component term for a CRISPR RNA-guided surveillance
    complex under GO:1990904, with subtype children for Cascade and the Csy
    complex; the request is made in this review's proposed_new_terms.
proposed_new_terms:
- proposed_name: CRISPR RNA-guided surveillance complex
  proposed_definition: >-
    A ribonucleoprotein complex composed of CRISPR-associated (Cas) proteins
    assembled around a single mature CRISPR RNA (crRNA), which uses the crRNA as
    a guide to locate nucleic acid complementary to its spacer sequence. In type
    I systems the complex additionally recognises a protospacer-adjacent motif,
    forms an R-loop at the target, and recruits a trans-acting nuclease for
    target destruction. The Pseudomonas aeruginosa type I-F complex, Csy, has the
    composition Cas8f(1)/Cas5f(1)/Cas7f(6)/Cas6f(1) with one 60-nucleotide crRNA;
    the type I-E equivalent is Cascade.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  justification: >-
    GO's entire CRISPR vocabulary is five biological-process terms (GO:0099048,
    GO:0043571, GO:0098672 and the obsolete GO:0110132 and GO:0110133), with no
    cellular-component term, so every subunit of every CRISPR surveillance
    complex can currently only be placed on the bare GO:0032991 root or on its
    generic child GO:1990904. The complex is a well-defined,
    stoichiometrically determined, structurally solved entity that ComplexPortal
    already models for the type I-E case (CPX-1005, Cascade complex), and the
    Cas7f backbone in particular is the surface targeted by several families of
    phage-encoded anti-CRISPR proteins, so a specific term would make a large
    body of structural and counter-defence curation expressible. This is the same
    request made from the Escherichia coli type I-E Cascade subunit reviews, so
    that the two systems ask for one term rather than two.
  supported_by:
  - reference_id: PMID:32170016
    supporting_text: The Csy complex is comprised of four types of Cas proteins (Cas5f-8f)
      and a single 60-nt crRNA
  - reference_id: PMID:21536913
    supporting_text: the Csy proteins (Csy1-4) assemble into a 350 kDa ribonucleoprotein
      complex that facilitates target recognition by enhancing sequence-specific hybridization
      between the CRISPR RNA and complementary target sequences
suggested_questions:
- question: >-
    Cas6f has two separable activities, repeat cleavage and product retention,
    and the second is the one that builds the effector. Should GO express the
    retained-subunit role as a distinct function, or is RNA binding plus complex
    membership sufficient?
- question: >-
    GO has no molecular-function term for crRNA-guided target recognition, the
    activity the assembled Csy complex has. Cas6f contributes the guide and the
    3' anchor but not the target contacts. If such a term were created, should a
    biogenesis subunit retained in the complex carry it, contribute to it, or
    neither?
- question: >-
    In the PA14 strain background, is the mature crRNA pool limited by Cas6f
    cleavage rate or by the availability of Csy1, Csy2 and Csy3 to protect the
    product from degradation?
suggested_experiments:
- hypothesis: >-
    The H29A catalytic mutant abolishes spacer acquisition solely by failing to
    make mature crRNA, not by any separate role of Cas6f in adaptation.
  description: >-
    Complement a PA14 csy4 H29A strain with pre-cleaved mature crRNA supplied in
    trans (for example from a tRNA-flanked expression construct that needs no
    Cas6f processing) and test whether spacer acquisition and interference are
    restored. Restoration would confirm that the adaptation requirement is purely
    upstream.
  experiment_type: genetic complementation
- hypothesis: >-
    Cas6f product retention, rather than cleavage per se, is what commits a crRNA
    to complex assembly.
  description: >-
    Use the separation-of-function mutant set from the structural work (binding
    competent, cleavage dead versus cleavage competent, release accelerated) in
    pulse-chase northern blots and quantitative pull-downs of the Csy complex to
    measure the partition of crRNA between free, Cas6f-bound and complex-bound
    pools.
  experiment_type: biochemical kinetics
