  review:
    summary: PA14 dsbB2 catalyzes quinone-coupled recycling of reduced DsbA1.
    action: NEW
    reason: This exact PA14 paralog was tested in a reconstituted reaction containing 30 micromolar
      decylubiquinone. DsbA1 oxidation was monitored by fluorescence and confirmed by AMS; the
      separate substrate-dependent initial-velocity curve gives an apparent Km of 9.0 micromolar
      DsbA1. The Figure2A pre-enzyme/quinone trace and the reported corresponding B2 behavior
      distinguish enzyme-associated oxidation from quinone-only background. These data support the
      sulfur-donor/quinone-acceptor MF by IC. The five original rows include protein-disulfide
      exchange GO0015035 and electron transfer GO0009055, neither an ancestor nor descendant of
      GO0016672; there is no GO0016491/GO0016667 row to refine and no existing acceptor-qualified
      assertion. Preparations were partial, the main-text and supplemental expression contexts are
      not fully reconciled, and quinone reduction itself was not directly measured. The available
      figures do not show an explicit DsbB-containing minus-quinone trace. This assertion identifies
      the assayed catalytic class, not a particular native quinone, equal binding affinity or a
      native DsbA2 pathway. The PaDsbB2 oxidation time trace itself is explicitly reported as not
      shown; Figure 2C supplies the separate displayed B2 substrate-dependent initial-rate curve.
      AMS confirmation is also reported without a displayed trace. The statement does not imply that
      Figure 2A directly shows B2.
    supported_by:
    - &id003
      reference_id: PMID:24327342
      supporting_text: In vitro reconstitution of the pathway confirms that both PaDsbB1 and PaDsbB2
        shuttle electrons from PaDsbA1 to membrane-bound quinones.
    - &id004
      reference_id: PMID:24327342
      supporting_text: Similar results were obtained for PaDsbB2 (not shown), confirming that both
        PaDsbB1 and PaDsbB2 are able to reoxidize PaDsbA1.
    - &id005
      reference_id: PMID:24327342
      supporting_text: We also measured the dependence of the initial velocities of fluorescence
        decrease on the concentration of PaDsbA1.
