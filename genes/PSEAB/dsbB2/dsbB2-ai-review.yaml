  label: Pseudomonas aeruginosa UCBPP-PA14
description: DsbB2 is an inner-membrane disulfide oxidoreductase of Pseudomonas aeruginosa UCBPP-PA14.
  It reoxidizes periplasmic DsbA1 and transfers reducing equivalents toward membrane quinones, supporting
  oxidative protein folding. DsbB1 and DsbB2 compensate for one another in the tested native conditions.
  DsbB2 can also reoxidize DsbA2 in vitro, whose physiological substrates remain unknown.
