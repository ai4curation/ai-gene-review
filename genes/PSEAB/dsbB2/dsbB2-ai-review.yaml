core_functions:
- description: Reoxidizes DsbA1 through quinone-coupled thiol-disulfide exchange at the inner membrane;
    dsbB2 is an alternative to the other PA14 DsbB paralog. Recombinant partial-preparation assays with
    decylubiquinone support this catalytic class, while direct quinone-redox kinetics and the physiological
    quinone identity remain unestablished.
