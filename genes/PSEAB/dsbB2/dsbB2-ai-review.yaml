  review:
    summary: DsbB2 supplies oxidizing equivalents for DsbA1-dependent protein folding.
    action: ACCEPT
    reason: DsbB catalyzes recycling of the folding oxidant rather than merely being required for a downstream
      phenotype. The native PA14 double deletion shifts DsbA1 toward the reduced state and disrupts several
      exported-protein outputs; single deletions compensate. This is a direct catalytic contribution to
      oxidative folding, not autonomous general chaperone activity.
