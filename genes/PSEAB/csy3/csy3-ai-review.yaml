    label: maintenance of CRISPR repeat elements
  evidence_type: IMP
  original_reference_id: PMID:26586803
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      Well grounded and correctly hedged. A clean csy3 deletion abolished new
      spacer acquisition in the transplanted Pseudomonas aeruginosa type I-F
      system, in which both naive and primed adaptation require the intact Csy
      complex and crRNA. The acts_upstream_of_or_within qualifier is the right
      one, because the requirement runs through complex integrity rather than
      through a Csy3 catalytic step in the integration chemistry. Note that this
      annotation is earned by the acquisition phenotype, not by a
      crRNA-biogenesis phenotype: Csy3 is not strictly required for crRNA to
      accumulate.
