id: Q02MM1
gene_symbol: csy3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208963
  label: Pseudomonas aeruginosa (strain UCBPP-PA14)
description: >-
  Csy3, also called Cas7f, is the backbone subunit of the Csy crRNA-guided
  surveillance complex of the Pseudomonas aeruginosa UCBPP-PA14 type I-F
  (Yersinia-subtype) CRISPR-Cas system. Six copies oligomerise head to tail
  along the spacer portion of a single 60-nucleotide crRNA, forming the helical
  spiral between the Cas6f head and the Cas8f-Cas5f tail. Each copy grips the
  guide through an arginine-rich surface that contacts the sugar-phosphate
  backbone rather than the bases, so recognition is sequence-independent, and a
  thumb from each subunit kinks the crRNA at six-nucleotide intervals, dividing
  the guide into the short segments that are presented for base pairing. When a
  complementary target strand invades, a beta-hairpin from the adjacent subunit
  threads through each kink and pins the crRNA-DNA heteroduplex to the backbone,
  so Cas7f holds the hybrid while target verification proceeds along the guide.
  A lysine-rich patch on the same surface is critical for the complex to bind
  target DNA, and that patch is the principal target surface of the phage
  anti-CRISPR proteins AcrIF8 and AcrIF9.
