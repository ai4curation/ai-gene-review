knowledge_gaps:
- gap_statement: >-
    GO has no molecular-function term for crRNA-guided, PAM-licensed target
    recognition, the activity the assembled Csy complex has and in which the
    Cas7f backbone does the segment-by-segment base-pairing work. The terms that
    can be asserted (RNA binding, DNA/RNA hybrid binding) do not distinguish
    this protein from an unguided nucleic-acid-binding protein.
  boundary: >-
    The structural mechanism is resolved to near-atomic detail, including the
    kink spacing, the hairpin threading, the helical pitch change on target
    binding, and the lysine patch required for DNA engagement. What is missing
    is a term for the guide dependence that defines the system.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: >-
    The Cas7f backbone is the host surface that most type I-F anti-CRISPR
    proteins attack, so the absence of a term for what that surface does leaves
    both sides of a well-characterised arms race unstatable in GO.
  provenance:
  - reference_id: PMID:32170016
    supporting_text: a lysine-rich region of the Cas7f subunit (K76, K78, K84, and K256)
      has been reported to be critical for DNA binding by the Csy complex
  - reference_id: PMID:21536913
    supporting_text: the Csy proteins (Csy1-4) assemble into a 350 kDa ribonucleoprotein
      complex that facilitates target recognition by enhancing sequence-specific hybridization
      between the CRISPR RNA and complementary target sequences
  resolution: >-
    Request a molecular-function term for guide-RNA-dependent nucleic acid
    recognition, as proposed in modules/crispr_cas_adaptive_immunity.yaml and
    modules/anti_crispr_suppression.yaml. No existing id has been substituted
    for the missing concept here.
- gap_statement: >-
    Whether the lysine-rich Cas7f patch binds target DNA directly, or only as
    part of the complex-level DNA-binding surface, has not been separated
    experimentally; isolated Cas7f has not been assayed for DNA binding.
  boundary: >-
    Established: the patch is required for DNA binding by the complex, and it is
    the surface AcrIF8 and AcrIF9 occupy. Not established: whether a Cas7f
    monomer binds DNA, and whether the requirement is for affinity or for
    correct heteroduplex geometry.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    This determines whether Cas7f should eventually carry a DNA-binding term in
    its own right or only contributes_to one, and it is the same distinction
    that separates competitive from allosteric anti-CRISPR mechanisms.
  provenance:
  - reference_id: PMID:32170016
    supporting_text: a lysine-rich region of the Cas7f subunit (K76, K78, K84, and K256)
      has been reported to be critical for DNA binding by the Csy complex
  resolution: >-
    Assay purified Cas7f and the Cas7f-Cas6f-crRNA subcomplex for DNA binding,
    and test lysine-patch substitutions for target affinity versus R-loop
    geometry in the complete complex.
suggested_questions:
- question: >-
    Cas7f recognises the crRNA sequence-independently but pins the heteroduplex
    sequence-dependently through the kinks. Should GO distinguish these as
    separate functions of the same surface, given that one is a scaffolding
    contact and the other is the verification contact?
- question: >-
    AcrIF8 contacts both the Cas7f backbone and the crRNA at a kink, while
    AcrIF9 competes for the lysine patch. Do the six Cas7f copies differ
    functionally by position, such that occluding one specific subunit is enough
    to block verification?
- question: >-
    Csy3 is not strictly required for crRNA accumulation yet a csy3 deletion
    abolishes spacer acquisition. Is the acquisition defect due to loss of
    target engagement by the complex, or does the Cas7f backbone have a further
    role in generating the adaptation substrate?
suggested_experiments:
- hypothesis: >-
    The lysine-rich Cas7f patch is required for target DNA binding and not
    merely for complex assembly, so patch mutants give an assembled but
    targeting-dead complex.
  description: >-
    Build Cas7f K76A, K78A, K84A and K256A variants, confirm Csy complex
    assembly and crRNA loading, then measure target DNA binding by
    electrophoretic mobility shift and Cas3-dependent cleavage in the
    reconstituted system. Compare the loss of function with that caused by
    saturating AcrIF9.
  experiment_type: structure-guided mutagenesis with reconstituted binding and cleavage
    assays
- hypothesis: >-
    Heteroduplex pinning by the Cas7f beta-hairpins enforces directional target
    verification, so hairpin mutants permit binding but not licensing of Cas3.
  description: >-
    Delete or shorten the threading beta-hairpin in individual Cas7f positions
    using a mosaic complex assembled from differently tagged subunits, and use
    single-molecule DNA unzipping or magnetic-tweezer R-loop assays to ask
    whether verification stalls at the modified segment.
  experiment_type: single-molecule R-loop assay with mosaic complexes
