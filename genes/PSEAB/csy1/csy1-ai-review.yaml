- term:
    id: GO:1990904
    label: ribonucleoprotein complex
  evidence_type: IDA
  original_reference_id: PMID:21536913
  qualifier: part_of
  review:
    summary: >-
      Cas8f/Csy1 is an integral subunit of the Csy surveillance complex, which
      forms the PAM-proximal tail together with Cas5f/Csy2. The complex contains a single mature
      60-nucleotide crRNA as an integral component, not as a ligand, so it is a
      ribonucleoprotein complex rather than merely a protein-containing one.
    action: NEW
    reason: >-
      Complex membership is not currently annotated for any Pseudomonas
      aeruginosa PA14 Csy subunit, whereas all five Escherichia coli type I-E
      Cascade subunits (casA, casB, casC, casD, casE) carry a part_of
      protein-complex row by IDA or IPI. The GOA rows that record this contact
