      molecular-function rows, which cannot be converted to a cellular-component
      term; the membership claim consequently needs its own row, which is what
      this is. GO:1990904 is used rather than the bare GO:0032991 root because
      the guide RNA is an integral component of the assembly, and because GO has
      no cellular-component term for any CRISPR surveillance complex - its
      entire CRISPR vocabulary is five biological-process terms - so GO:1990904
      is the most specific existing term. The missing specific term is requested
      in proposed_new_terms.
