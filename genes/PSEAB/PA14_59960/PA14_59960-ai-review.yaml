product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208963
  label: Pseudomonas aeruginosa UCBPP-PA14
description: PA14_59960 encodes the DsbA2 thiol-disulfide oxidoreductase of Pseudomonas aeruginosa UCBPP-PA14.
  Recombinant DsbA2 catalyzes insulin disulfide reduction and can be reoxidized by DsbB1 or DsbB2. It
  has a highly oxidizing active-site redox potential and an additional structural disulfide. Its physiological
  substrates and expression conditions remain unresolved; plasmid expression did not replace DsbA1 in
  the tested mutant.
existing_annotations:
- term:
    id: GO:0045454
    label: cell redox homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000415528
  review:
    summary: DsbA2 protein-disulfide chemistry is established, but native redox-homeostasis participation
      is unresolved.
    action: UNDECIDED
    reason: The UniRule homeostasis claim is plausible, but biochemical redox capability alone does not
      establish maintenance of a cellular redox environment. The primary study could not detect native
      DsbA2 expression in the tested conditions, and plasmid DsbA2 did not rescue the DsbA1 phenotype.
      These findings leave native participation uncertain rather than disproving it.
    supported_by:
    - reference_id: PMID:24327342
      supporting_text: we failed to find the conditions under which PaDsbA2 is expressed
- term: &id001
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IDA
  original_reference_id: PMID:24327342
  review:
    summary: Purified DsbA2 catalyzes protein-disulfide exchange in the insulin assay.
    action: NEW
    reason: A missing molecular activity is directly demonstrated by insulin reduction with DTT, using
      recombinant PA14 DsbA2. GO:0015035 is a reversible protein-disulfide reaction and does not claim
      insulin is a physiological substrate. DsbB-dependent reoxidation and redox-potential measurements
      corroborate redox cycling; neither establishes redundancy with native DsbA1.
    supported_by:
    - reference_id: PMID:24327342
      supporting_text: PaDsbA2 is able to catalyze insulin reduction, although less efficiently than EcDsbA
        and PaDsbA1.
