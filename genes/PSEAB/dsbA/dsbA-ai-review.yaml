suggested_questions:
- question: Should GO:0006457 protein folding be asserted for this direct substrate oxidase under
    current bacterial DsbA annotation conventions? DsbA1 performs protein-thiol oxidation, not
    merely a necessary phenotype, but the current same-role QuickGO check found no GO:0006457 row
    for E. coli DsbA P0AEG4, PA14 DsbA Q02DM0 or Bacillus BdbD O32218. Repository E. coli/P. putida
    DsbA and BdbD NEW proposals are separate authored judgments, not evidence that the upstream
    convention already grants the BP. The core retains the supported chemistry without creating a BP
    solely to resolve a coverage warning.
