  label: Pseudomonas aeruginosa UCBPP-PA14
description: DsbA (DsbA1) is the major periplasmic thiol-disulfide oxidoreductase of Pseudomonas aeruginosa
  UCBPP-PA14. It transfers disulfide bonds to exported proteins during oxidative folding and is recycled
  by either inner-membrane protein DsbB1 or DsbB2. Its activity supports the maturation of multiple secreted
  and surface proteins, including virulence factors.
