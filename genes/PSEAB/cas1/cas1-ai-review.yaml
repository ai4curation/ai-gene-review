core_functions:
- description: >-
    Metal-dependent, DNA-specific endonuclease that, as a homodimer within the
    adaptation complex, cleaves the leader-repeat junction of a CRISPR array and
    joins the ends of a captured protospacer fragment into it, writing a new
    heritable spacer
