  review:
    summary: >-
      Not wrong, but a step removed from what Cas1 does. Cas1 is dispensable for
      the interference stage that actually clears an infecting phage; its
      contribution to antiviral immunity is to write the spacer that a later
      generation's effector will use. The PA14 locus is also the one case where
      the antiviral phenotype has been reported both ways, and no cas1 allele
      has been assayed for phage resistance. Retained rather than removed,
      because the statement is defensible and removing a pipeline term on an
      argument about directness would overreach.
    action: KEEP_AS_NON_CORE
    reason: >-
      Cas1 acts in adaptation, not interference, so it contributes to defence
      only indirectly; GO:0043571 and GO:0099048 carry the direct roles.
