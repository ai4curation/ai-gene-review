knowledge_gaps:
- gap_statement: >-
    The non-catalytic partner that Pseudomonas aeruginosa PA14 Cas1 works with
    during spacer integration has not been identified experimentally. Type I-F
    encodes no standalone Cas2, so the partner is presumed to be the N-terminal
    Cas2 module of the fused Cas2-3 protein, but no direct Cas1-Cas2-3 complex
    has been characterised for this organism.
  boundary: >-
    The fusion itself is established, and a stop codon placed after the cas2
    portion of the fused gene abolishes acquisition, so the Cas2 module is
    necessary. What is missing is the physical Cas1-Cas2 module interaction,
    its stoichiometry, and the protospacer-ruler geometry that Cas2 provides in
    type I-E.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    The protospacer length distribution and the strand bias of primed
    acquisition both depend on the geometry of the integration complex, which
    cannot be modelled without knowing how the Cas2 module docks onto Cas1.
  provenance:
  - reference_id: PMID:26586803
    supporting_text: A specific feature of type I-F systems is a fusion of cas2 and
      cas3 homologs, which are encoded on separate genes in other CRISPR
  - reference_id: PMID:26586803
    supporting_text: A D124Oc mutation in the cas2+cas3 gene that introduced an ochre
      stop codon instead of aspartate codon at position 124, after the cas2 portion of
      the fused gene, abolished spacer acquisition
  resolution: >-
    Reconstitute PA14 Cas1 with full-length Cas2-3 and with an isolated Cas2
    module, and determine the integration-complex structure.
suggested_questions:
- question: >-
    UniProt notes that this organism encodes no standalone Cas2 and that Cas1
    must therefore use a different partner. Does PA14 Cas1 assemble with the
    Cas2 module of Cas2-3 in the same 2:1:2 arrangement as the type I-E
    Cas1-Cas2 integrase, and is the full-length Cas2-3 protein or a processed
    fragment the physiological partner?
- question: >-
    Why does type I-F acquisition require an intact Csy complex and crRNA even
    for naive adaptation, when type I-E naive adaptation needs only Cas1 and
    Cas2? Is the Csy complex supplying the substrate, or licensing Cas1 activity?
- question: >-
    The purified protein degrades DNA to roughly 80 bp fragments in vitro. Is
    that nuclease activity the integration chemistry seen out of context, or a
    separate activity, and what restrains it from damaging the host genome in
    vivo?
suggested_experiments:
- hypothesis: >-
    The Cas2 module of the fused Cas2-3 protein is the integration partner of
    PA14 Cas1 and is sufficient for naive acquisition when supplied separately.
  description: >-
    Express the isolated Cas2 module (residues approximately 1-124 of Cas2-3)
    together with Cas1 in the transplanted type I-F reporter system and test
    whether it restores naive spacer acquisition to a cas2-3 D124 ochre strain.
    Pair with size-exclusion chromatography and mass photometry on the
    co-expressed pair to establish the stoichiometry.
  experiment_type: genetic complementation and reconstitution
- hypothesis: >-
    The requirement for the Csy complex in naive acquisition reflects delivery
    of a protospacer-length DNA intermediate rather than an allosteric effect on
    Cas1.
  description: >-
    Compare acquisition in strains carrying a catalytically dead Cas3 nuclease
    domain, a DNA-binding-dead Cas8f K-wedge mutant, and a wild-type control,
    and sequence the acquired spacers to ask whether the Csy requirement maps
    onto target engagement or onto substrate generation.
  experiment_type: genetic epistasis with spacer sequencing
