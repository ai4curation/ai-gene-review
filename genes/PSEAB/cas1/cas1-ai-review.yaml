id: Q02ML7
gene_symbol: cas1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208963
  label: Pseudomonas aeruginosa UCBPP-PA14
description: >-
  Cas1 is the protospacer integrase of the Pseudomonas aeruginosa UCBPP-PA14
  type I-F (Yersinia-subtype) CRISPR-Cas system and the only protein component
  conserved across all CRISPR system subtypes. It is a homodimeric,
  metal-dependent, DNA-specific endonuclease: Mn(2+) supports cleavage of both
  single- and double-stranded DNA while Mg(2+) supports only double-stranded
  substrates, and the divalent metal site formed by Glu190, His254 and His268 is
  required for activity. In the adaptation stage of the pathway Cas1 captures a
  fragment of invading phage or plasmid DNA and integrates it as a new spacer at
  the leader-proximal end of a CRISPR array, which is what makes the immunity
  heritable; mutation of the metal-coordinating Asp268 abolishes acquisition.
  Type I-F systems encode no standalone Cas2, so the non-catalytic partner that
  measures the protospacer duplex is instead the N-terminal Cas2 module of the
  fused Cas2-3 protein. Cas1 is dispensable for the interference stage, in which
  the Csy surveillance complex and Cas3 destroy the target, but the type I-F
  system nevertheless requires an intact Csy complex and crRNA for acquisition,
  coupling the two stages more tightly than in type I-E.
