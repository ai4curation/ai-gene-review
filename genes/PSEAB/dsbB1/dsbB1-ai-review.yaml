- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003752
  - PANTHER:PTN002443178
  review:
    summary: DsbB1 supplies oxidizing equivalents for DsbA1-dependent protein folding.
    action: ACCEPT
    reason: DsbB catalyzes recycling of the folding oxidant rather than merely being required for a downstream
      phenotype. The native PA14 double deletion shifts DsbA1 toward the reduced state and disrupts several
      exported-protein outputs; single deletions compensate. This is a direct catalytic contribution to
      oxidative folding, not autonomous general chaperone activity.
    supported_by:
    - reference_id: PMID:24327342
      supporting_text: PaDsbA1, which is the primary donor of disulfide bonds to proteins secreted to
        the envelope, is recycled by both PaDsbB1 and PaDsbB2.
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000083131
  review:
    summary: DsbB1 transfers electrons from DsbA toward quinones.
    action: ACCEPT
    reason: Reconstitution with recombinant partially purified DsbB, DsbA1 and decylubiquinone demonstrates
      the electron-transfer relay. This functional movement of electrons fits the current GO definition;
      it does not assert transport of quinone or protein across the membrane.
    supported_by:
    - reference_id: PMID:24327342
      supporting_text: 'both PaDsbB1 and

        PaDsbB2 shuttle electrons from PaDsbA1 to membrane-bound quinones.'
- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003752
  - PANTHER:PTN002443178
  - UniRule:UR000083131
  review:
    summary: DsbB1 catalyzes DsbA protein-thiol oxidation.
    action: ACCEPT
    reason: GO:0015035 defines reversible protein thiol/disulfide chemistry and is not limited to reduction
      in vivo. The PA14 protein oxidizes DsbA1 in reconstitution, with native PA14 redox genetics independently
      corroborating recycling. DsbA2 oxidation is demonstrated in vitro only. Recombinant DsbB was expressed
      in an E. coli dsbB mutant and partially purified, not assayed as a native isolated PA14 membrane
      preparation. Text S2 also describes BL21C43/pET preparations and JFC234/pBAD extract experiments;
      these preparation contexts are kept distinct in the scoped source analysis.
    supported_by:
    - reference_id: PMID:24327342
      supporting_text: PaDsbB1 and PaDsbB2 were expressed in an EcdsbB mutant and partially purified.
