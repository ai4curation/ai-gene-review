id: Q02TM7
gene_symbol: dsbB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:208963
  label: Pseudomonas aeruginosa UCBPP-PA14
description: DsbB1 is an inner-membrane disulfide oxidoreductase of Pseudomonas aeruginosa UCBPP-PA14.
  It reoxidizes periplasmic DsbA1 and transfers reducing equivalents toward membrane quinones, supporting
  oxidative protein folding. DsbB1 and DsbB2 compensate for one another in the tested native conditions.
  DsbB1 can also reoxidize DsbA2 in vitro, whose physiological substrates remain unknown.
