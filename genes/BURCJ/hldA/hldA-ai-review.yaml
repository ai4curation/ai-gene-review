- term:
    id: GO:0016779
    label: nucleotidyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011913
  review:
    summary: A monofunctional HldA kinase does not carry the HldC adenylyltransferase activity.
    action: REMOVE
    reason: The full HldE protein combines two domains, but B4EB35 is the 316-residue N-terminal-like
      kinase component. Its solved structure and PfkB/RfaE-domain-I signatures establish the kinase architecture;
      the C-terminal-like nucleotidyltransferase is a separate HldC protein. Transferring that second
      activity to this kinase conflates fused and split architectures. This rejects a specific electronic
      transfer using target structural evidence, not lack of experimental annotation.
    supported_by:
    - *id001
    - *id002
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: InterPro:IPR011913
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The RfaE domain-I match identifies the kinase portion; nucleotidyl transfer requires
          domain II. The target structure establishes the single-domain architecture.
