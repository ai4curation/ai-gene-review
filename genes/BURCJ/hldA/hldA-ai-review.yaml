id: B4EB35
gene_symbol: hldA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:216591
  label: Burkholderia cenocepacia J2315
description: HldA is a homodimeric heptose 7-phosphate kinase that phosphorylates the C-1 hydroxyl of
  D-glycero-beta-D-manno-heptose 7-phosphate during activated-heptose biosynthesis. It is a monofunctional
  PfkB-family enzyme corresponding to the N-terminal kinase domain of bifunctional HldE. In Burkholderia,
  a separate HldC protein performs subsequent heptose-1-phosphate adenylylation. This route supplies heptose
  precursors for the lipopolysaccharide core.
