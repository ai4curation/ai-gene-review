    reason: >-
      GOA has no assembly or budding annotation for this entry, which is a striking gap for a
      structural polyprotein. The participation test is clearly met: the capsid and E2 chains
      are the entities that perform the assembly steps - capsid-capsid lattice formation,
      capsid-E2 engagement at the membrane - rather than being merely required for or acted
      on by a process another protein executes. The comparator check was run against the
      other alphavirus structural polyproteins, which stand in exactly this role, and its
      result is patchy curation rather than a convention either way: Semliki Forest virus
      P03315 POLS_SFV does carry GO:0019068, by IMP, and the annotation is itself a CACAO
      row; chikungunya Q8JUX5 POLS_CHIKS and Q5XXP3 POLS_CHIK3 carry no assembly or budding
