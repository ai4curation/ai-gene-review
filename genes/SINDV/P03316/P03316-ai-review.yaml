  review:
    summary: >-
      Keyword-driven (KW-0694 RNA-binding) transfer of RNA binding. The claim belongs to the
      capsid chain (PRO_0000041321), which binds the genomic RNA and packages it into the
      T=4 nucleocapsid. Correct and central to the capsid's structural role.
    action: ACCEPT
    reason: >-
      Genome binding by the alphavirus capsid protein is a curated, publication-supported
      activity in the UniProt record, and the crystal structure of the Sindbis core protein
      was solved precisely as "the coat surrounding the genomic RNA". The term is the right
      level: no source available here establishes a selectivity (e.g. single-stranded vs
      duplex, or a defined packaging signal) that would license a more specific child, and
      the GO term is not merely an uninformative ancestor of anything else annotated on this
      entry.
