  review:
    summary: >-
      CACAO row from the liposome fusion study. That paper describes the Sindbis spike -
      80 hetero-oligomeric spikes, each a trimer of E2-E1 heterodimers - and concludes that
      the trypsin-resistant E1 homotrimer is the fusion-active conformation of the spike. The
      annotation places the E1/E2 spike in GO:0098029, whose definition is "A short structure
      attached to an icosahedral virion capsid, and used for attachment to the host cell" and
      whose only ontology placement is part_of GO:0019030 icosahedral viral capsid (checked
      against QuickGO, 2026-10-29).
    action: MODIFY
    reason: >-
      The spike itself is real and these chains are its constituents, so this is a term
      choice problem rather than a false claim - but the term puts the spike on the wrong
      structure. Sindbis is an enveloped alphavirus: the spike trimers are anchored in the
      virion's lipid bilayer, which surrounds the nucleocapsid, and cryo-EM of the particle
      resolves exactly that arrangement. A term that is part_of icosahedral viral capsid
      therefore asserts the glycoproteins are part of the proteinaceous genome shell, which
      they are not; it suits a non-enveloped virus whose spikes protrude from the capsid. The
      supported cellular component for E1 and E2 is GO:0055036 virion membrane, which this
      entry already carries with two experimental rows. GO has no envelope-spike component
      term - a QuickGO text search for "spike" returns only GO:0098029 outside the
      neuroscience senses - so the spike assembly itself cannot currently be expressed, and
      this review files a request for one under proposed_new_terms. Note also that the
      spike architecture in this paper is background citing earlier structural work rather
      than a result of its own assays, which are fusion measurements. New failure shape for
      the CACAO taxonomy: the term names the right supramolecular assembly but attaches it
      to the wrong parent structure, visible only from the term's ontology placement.
