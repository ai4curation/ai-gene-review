      QuickGO query on 2026-10-31). A systematic absence across the comparators would have
      meant a convention to identify; one comparator carrying the term and two lacking it,
      on entries whose rows are dominated by keyword mappings, means the term is accepted
      for this role and simply unannotated here. Sindbis virus's own non-structural
