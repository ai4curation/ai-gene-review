id: P03316
gene_symbol: P03316
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:11034
  label: Sindbis virus
description: >-
  Sindbis virus structural polyprotein (p130) is the single translation product of the
  alphavirus subgenomic RNA and the precursor of all five structural proteins of the virion.
  Its N-terminal capsid protein (C) carries a chymotrypsin-like serine protease that cleaves
  itself from the nascent chain, after which the exposed internal signal sequence targets the
  remainder of the polyprotein to the host endoplasmic reticulum, where host signal peptidase
  releases pE2 (p62), 6K and E1 and host furin later cleaves pE2 into E3 and E2 in trans-Golgi
  vesicles. The released capsid protein binds the genomic RNA and assembles with 239 copies of
  itself into a T=4 icosahedral nucleocapsid in the host cytoplasm; it also binds the host
  kinase IRAK1 and blocks IRAK1-dependent Toll-like receptor signalling, an immune-evasion
  activity exerted before viral gene expression begins. The spike glycoproteins E2 and E1
  heterodimerize in the ER, traffic to the plasma membrane and form 80 trimeric spikes in the
  virion envelope: E2 is the attachment protein, binding the host entry receptors VLDLR and
  LRP8/ApoER2, while E1 is a class II fusion protein held inactive by E2 until endosomal
  acidification dissociates the heterodimer and drives E1 homotrimerization, which fuses the
  viral and endosomal membranes and delivers the nucleocapsid to the cytoplasm. E3 provides the
  pE2 signal sequence and protects E1 from premature low-pH activation in transit, and the small
  palmitoylated 6K protein acts as a viroporin whose ion-channel function is required for
  type II cytopathic vacuole formation from the Golgi, for spike delivery to the plasma membrane
  and for efficient budding. Because every annotation on this entry belongs to one of these
  mature chains rather than to the uncleaved precursor, chain assignment is the central
  interpretive problem for the record.
