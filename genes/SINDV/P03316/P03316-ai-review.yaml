- term:
    id: GO:0019062
    label: virion attachment to host cell
  evidence_type: IMP
  original_reference_id: PMID:7684466
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. Dubuisson and Rice built random-insertion libraries across the PE2 and E1
      genes of a full-length Sindbis cDNA clone, depleted binding-competent virus by serial
      adsorption to chicken embryo fibroblast monolayers at 4 degrees C, and recovered
      binding-defective mutants. Three were characterized: NB1 and NB12 carry insertions near
      the PE2 cleavage site (blocking pE2 cleavage completely and partially, respectively) and
      NB2 carries an insertion between E2 residues 69 and 74. NB1 and NB2 are defective for
      binding to CEF and BHK-21 cells while assembling and releasing particles normally, and
      mild trypsin digestion of NB1 virions cleaves pE2 and partially restores binding.
    action: ACCEPT
    reason: >-
      This is a CACAO annotation and it holds up on every axis. The protein is right (the
      mutations are in pE2/E2, chains of this entry); the assay is a direct cell-binding
      measurement, not a downstream phenotype, so the evidence code IMP fits the mutant-based
      design; and the granularity is exactly right - the paper establishes that attachment
      requires pE2 cleavage and the E2 N-terminal region but does not identify a receptor, and
      the row correspondingly stops at GO:0019062 rather than claiming the
      receptor-mediated child. The trypsin-rescue experiment rules out a general assembly
      defect as the explanation, which is the usual way an attachment phenotype turns out to
      be something else. Note that the cached publication is abstract-only
      (full_text_available: false), so figure-level detail could not be checked, and the
      GONUTS wiki page that would record the student's evidence is offline; the abstract
      alone is nevertheless explicit about the binding defect.
    supported_by:
    - reference_id: PMID:7684466
      supporting_text: NB2 were defective for binding to CEF and BHK-21 cells.
    - reference_id: PMID:7684466
      supporting_text: Consistent with previous work, these results implicate PE2 cleavage
    - reference_id: PMID:7684466
      supporting_text: Insertion mutations for NB1 and NB12 were found
