proposed_new_terms:
- proposed_name: viral envelope spike
  proposed_definition: >-
    A protruding oligomeric glycoprotein assembly anchored in the lipid envelope of an
    enveloped virion, projecting from the virion surface and typically mediating host
    receptor binding and/or membrane fusion.
  justification: >-
    GO has one spike cellular-component term, GO:0098029 icosahedral viral capsid, spike,
    defined as "A short structure attached to an icosahedral virion capsid" and placed
    part_of GO:0019030 icosahedral viral capsid. That placement suits a non-enveloped virus
    whose spikes protrude from the capsid shell, but it is wrong for the large class of
    enveloped viruses whose spikes are anchored in the lipid envelope: alphavirus E1/E2
    trimers, coronavirus S, influenza HA and NA, and the retroviral Env trimer among others.
    Curators wanting to annotate such a spike at present have the choice of the envelope or
    virion-membrane terms, which lose the supramolecular assembly, or GO:0098029, which
    asserts the wrong parent structure. This was the actual failure in a CACAO annotation on
    Sindbis virus P03316 reviewed here, where the E1/E2 spike was placed in GO:0098029. A
    sibling term under viral envelope would let the assembly be stated without
    misattributing it to the capsid.
  proposed_parent:
    id: GO:0019031
    label: viral envelope
  supported_by:
  - reference_id: PMID:3829124
    supporting_text: appear as columnar trimers arranged on a T=4 lattice. The lipid bilayer of the
  - reference_id: PMID:10482600
    supporting_text: 'The glycoproteins are organized in 80 hetero-oligomeric spikes; a single spike consists of a trimer of E2/E1 heterodimers.'
suggested_questions:
- question: >-
    Does the Sindbis 6K protein itself conduct ions in an infected cell, and in what
    oligomeric state? Planar-bilayer recordings and the HMA sensitivity of virus release
    argue for a channel, but expression of 6K cRNA in Xenopus oocytes produced no intrinsic
    conductance - only upregulation of endogenous currents downstream of ER calcium-store
    depletion - and no structure of 6K alone or as an oligomer exists.
  experts:
  - viral ion channel / viroporin biophysics
  - alphavirus assembly
- question: >-
    Which ion does 6K move, and in which direction across which membrane? The channel is
    described as weakly selective and the functional requirement is localized to the
    trans-Golgi; whether its physiological role is proton leak protecting the spikes from
    premature low-pH rearrangement (the M2 analogy the authors draw) or calcium efflux
    affecting Golgi integrity is unresolved and determines which transport child term the
    annotation should carry.
- question: >-
    Should GO have an envelope-spike cellular-component term? The only spike term is placed
    part_of icosahedral viral capsid, which is wrong for every enveloped virus, and the
    absence is already generating misplaced annotations.
  experts:
  - GO cellular component editors
  - virus annotation (UniProt/ViralZone)
- question: >-
    Is the nucleocytoplasmic shuttling of the capsid protein, currently asserted for Sindbis
    only by similarity to the VEEV capsid, real in Sindbis-infected cells, and does it serve
    a function distinct from the IRAK1 interaction? The supraNES/NLS motifs are conserved,
    but no Sindbis-specific localization or CRM1-dependence measurement is available.
- question: >-
    Does the capsid protein's IRAK1 inhibition require the protein to be free in the
    cytoplasm after uncoating, or can the intact incoming nucleocapsid engage IRAK1? The
    claim that suppression precedes viral gene expression depends on which, and neither has
    been tested directly.
suggested_experiments:
- hypothesis: >-
    The 6K protein is itself an ion channel in an infected-cell membrane, rather than a
    modulator of host channels.
  description: >-
    Reconstitute purified, detergent-solubilized Sindbis 6K into planar lipid bilayers or
    nanodiscs and record single-channel currents, testing HMA block and ion substitution to
    establish conductance and selectivity; in parallel, patch-clamp Golgi-enriched membranes
    or use a genetically encoded pH and calcium sensor targeted to the trans-Golgi in cells
    infected with wild-type, 6K-deleted and Vpu-chimeric virus, to ask whether the
    compartment's pH or calcium changes in a 6K- and HMA-dependent way.
  experiment_type: electrophysiology / organelle ion imaging
- hypothesis: >-
    6K's channel activity protects the E2-E1 spike from premature low-pH-triggered E1
    rearrangement in the trans-Golgi.
  description: >-
    In cells infected with wild-type, 6K-deleted, M2-, Vpu- and P7-chimeric SINV, assay the
    conformational state of E1 arriving at the plasma membrane using a trimer-specific or
    acid-conformation-specific monoclonal antibody and limited trypsin digestion, and test
    whether raising secretory-pathway pH with a weak base rescues spike delivery and virus
    release in the 6K-deleted background.
  experiment_type: conformational immunoassay with pharmacological rescue
- hypothesis: >-
    Capsid-IRAK1 engagement occurs on the incoming nucleocapsid before uncoating.
  description: >-
    Infect cells in the presence of a translation inhibitor so that no new capsid is made,
    then assay capsid-IRAK1 proximity by in situ labelling or FRET at early time points, and
    test TLR-agonist-induced IRAK1 autophosphorylation and downstream NF-kB activation under
    the same conditions; compare with a capsid mutant that assembles but cannot be released
    from the nucleocapsid to separate the particle-associated from the free-capsid pool.
  experiment_type: early-infection proximity assay with translation block
- hypothesis: >-
    The capsid protein contributes to virion assembly through a stepwise handoff from
    cytoplasmic nucleocapsid to E2-bound plasma-membrane puncta.
  description: >-
    Use the dual-labelled virus (tetracysteine or miniSOG capsid plus fluorescent E2) with
    fast two-colour live imaging and single-particle tracking to measure whether capsid
    arrives at plasma-membrane puncta as preassembled nucleocapsids or as subunits recruited
    on site, in wild-type and in the L108A/L110A capsid and Y400K E2 backgrounds that
    separately block cytoplasmic core formation and the capsid-E2 interaction.
  experiment_type: two-colour live-cell single-particle imaging
