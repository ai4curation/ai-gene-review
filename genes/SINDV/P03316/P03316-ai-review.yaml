  review:
    summary: >-
      Proposed new annotation. Assembly of the Sindbis particle is performed by the chains of
      this polyprotein and by nothing else: 240 capsid proteins build the nucleocapsid around
      the genome, the E2 cytoplasmic tail binds the capsid to nucleate budding, and 6K is
      required for the Golgi-derived structures that deliver spikes to the assembly site.
