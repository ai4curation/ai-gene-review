gene_symbol: TLR21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9031
  label: Gallus gallus
description: 'Intracellular Toll-like receptor of birds that senses unmethylated CpG DNA and is
  the functional counterpart of mammalian TLR9, which is absent from avian genomes. It has a leucine-rich-repeat
  ectodomain, a transmembrane segment and a cytoplasmic TIR domain, resides in the endoplasmic
  reticulum in resting cells and signals from endolysosomal compartments, its activation being
  blocked by agents that prevent endosomal maturation. Expression of the receptor in cells that
  otherwise lack a CpG sensor confers NF-kappa-B activation in response to synthetic CpG oligodeoxynucleotides
  and to bacterial genomic DNA, with sequence preferences of its own, and reducing receptor expression
  in avian macrophages reduces their response to the same ligands, leading to induction of inflammatory
  mediators. Signalling from the receptor has two arms in chicken macrophages, an NF-kappa-B arm
  that induces inflammatory cytokines and chemokines and an interferon arm that induces interferon
  beta; interferon-beta transcription downstream of the receptor requires both NF-kappa-B and IRF7
  and, unlike mammalian TLR9 signalling, does not require TBK1. Two of its leucine-rich repeats resemble a repeat implicated in ligand binding in
  mammalian TLR9, but the receptor is not a TLR9 orthologue: it belongs to the TLR21/TLR22 branch
  that also contains mouse TLR13 and has homologues in fish and amphibians, so its similarity
  to TLR9 is convergent in ligand rather than inherited. Transcripts are found across tissues.'
