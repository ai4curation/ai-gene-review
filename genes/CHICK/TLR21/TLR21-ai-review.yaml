  review:
    summary: Activation of this receptor by CpG DNA in chicken macrophages induces interferon-beta
      transcription, through an NF-kappa-B- and IRF7-dependent but TBK1-independent route.
    action: NEW
    reason: 'The receptor is the entity that performs the sensing step which initiates this output,
      not a molecule consumed by it, so the participation test is met: CpG recognition by the
      receptor is what turns on the interferon-beta response. The cached record (abstract only)
      shows interferon-beta transcription induced by chTLR21 activation in chicken macrophages and
      its dependence on NF-kappa-B and IRF7; it does not report manipulation of the receptor itself,
      so the evidence code is IDA rather than IMP.
      The comparator check supports the proposal rather than undermining it. The functional
      counterparts in mammals carry exactly this term from equivalent experiments: human TLR9 and
      mouse Tlr9 both hold GO:0032728 (human by IDA from PMID:16286015, mouse by IDA from
      PMID:15356140), and human TLR3 holds it by IDA and IMP. The nucleic-acid-sensing TLRs are
      conventionally annotated to the interferon-production terms for the interferon they induce,
      and this receptor is the avian sensor in that role. The specific interferon-beta child is
      used rather than the type I parent because interferon-beta transcription is what was measured.
      This is not redundant with the proposed GO:0035682 pathway term, which is neither an ancestor
      nor a descendant of it.'
    supported_by:
