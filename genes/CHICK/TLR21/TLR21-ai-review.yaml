suggested_questions:
- question: Does chicken TLR21 bind CpG DNA directly? All the evidence is functional (heterologous
    expression, knockdown, pharmacological blockade of endosomal maturation). A direct binding
    assay would license GO:0045322 unmethylated CpG binding, which is currently held even by human
    TLR9 only by ISS.
- question: Should GO record the relationship between TLR21 and TLR9 as functional analogy? Both
    receptors sense the same ligand class from different branches of the family, and annotation
    transfer between them would be wrong while a note of the analogy would be informative.
- question: Which UniProt entry should carry chicken TLR21 annotations? Several Ensembl models
    of the same gene exist in TrEMBL, this one has no RefSeq or GeneID cross-reference, and none
    is reviewed, so annotations risk being split across accessions.
- question: Does the avian receptor depend on UNC93B1 for trafficking, as the zebrafish and mammalian
    nucleic-acid-sensing receptors do? That dependence is established for zebrafish TLR21 and
    for mouse TLR13 but has not been tested in chicken.
suggested_experiments:
- description: Measure direct binding of defined CpG and GpC oligodeoxynucleotides to the purified
    chicken TLR21 ectodomain at endolysosomal and neutral pH, by fluorescence polarisation or
    surface plasmon resonance, with methylated ligands as controls.
  hypothesis: The receptor binds unmethylated CpG DNA directly and in a pH-dependent manner, which
    would convert the current functional annotations into a molecular binding annotation.
  experiment_type: direct binding assay
- description: Test the trafficking requirement by co-expressing chicken TLR21 with and without
    chicken UNC93B1 in avian cells, following localisation and CpG responsiveness, and by disrupting
    UNC93B1 in a chicken macrophage line.
  hypothesis: Like its zebrafish counterpart and mouse TLR13, the avian receptor needs UNC93B1
    to leave the endoplasmic reticulum and become responsive.
  experiment_type: trafficking dependence assay
- description: Map the sequence preference of the chicken receptor against a matched panel of
    oligodeoxynucleotides also tested on zebrafish TLR21 and on mammalian TLR9, using the same
    reporter system for all three.
  hypothesis: The CpG motif preferences differ systematically between receptors, which matters
    both for adjuvant design in poultry and for deciding how far ligand-level annotations may
    be shared across these receptors.
  experiment_type: ligand specificity assay
