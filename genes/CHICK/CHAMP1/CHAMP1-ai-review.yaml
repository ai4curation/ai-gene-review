gene_symbol: CHAMP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9031
  label: Gallus gallus
description: CHAMP1 (chromosome alignment-maintaining phosphoprotein 1, also ZNF828) is a
  large, mostly disordered nuclear protein with a conserved N-terminal region, a central
  low-complexity repeat region carrying WK, SPE and FPE motifs, and C-terminal C2H2 zinc
  fingers. Chicken CHAMP1 is the ortholog of human CHAMP1, which localizes to mitotic
  chromosomes, the spindle and kinetochores and is required to maintain
  kinetochore-microtubule attachments under tension during sister chromatid biorientation,
  affecting kinetochore localization of CENP-E and CENP-F. In interphase, human CHAMP1
  forms a heterochromatin-associated complex with POGZ and HP1 proteins, and chicken
  CHAMP1 (ZNF828) is likewise enriched on H3K9me3-modified histone peptides. Human CHAMP1
  also binds REV7/MAD2L2 through a WK motif and promotes homologous-recombination repair;
  the central repeat region carrying that motif is diverged in chicken, so whether that
  interaction is conserved is unknown.
