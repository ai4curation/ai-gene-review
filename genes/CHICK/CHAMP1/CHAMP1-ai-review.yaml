  review:
    summary: Role in maintaining sister kinetochore biorientation, transferred from human.
    action: ACCEPT
    reason: In human cells CHAMP1 depletion causes misalignment because K-fibres fail to
      resist the tension generated when sister kinetochores bi-orient, and rescue
      experiments map the function to the FPE region (PMID:21063390). CHAMP1 acts at the
      kinetochore during this process. Orthology transfer to chicken is reasonable given
      the conserved family and retained FPE motifs.
    supported_by:
