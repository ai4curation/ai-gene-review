proposed_new_terms: []
suggested_questions:
- question: Does chicken CHAMP1 bind REV7/MAD2L2 despite divergence of the central WK
    repeat region, and if so through which WK motif?
- question: Does chicken CHAMP1 form the POGZ-HP1 heterochromatin complex described in
    human cells, as suggested by its enrichment on H3K9me3 peptides in chicken extracts?
- question: What molecular activity of the conserved FPE region implements
    kinetochore-microtubule attachment maintenance?
suggested_experiments:
- description: Deplete or knock out CHAMP1 in chicken DT40 cells and assay chromosome
    alignment, cold-stable K-fibres and CENP-E/CENP-F kinetochore levels to test
    conservation of the mitotic function.
  experiment_type: loss-of-function with imaging
- description: Co-immunoprecipitate chicken CHAMP1 with chicken REV7, POGZ and HP1 proteins
    and map the REV7-binding motif by mutagenesis of the chicken WK repeats.
  experiment_type: protein interaction mapping
