core_functions:
- description: Maintains stable kinetochore-microtubule attachments during sister chromatid
    biorientation, acting from mitotic kinetochores, spindle and chromosomes (inferred from
    the human ortholog, whose FPE-region function is conserved in the CAMP family). The
    molecular activity that implements attachment maintenance is unknown; CENP-E and CENP-F
    kinetochore levels depend on it.
  directly_involved_in:
