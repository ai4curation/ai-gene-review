- id: PMID:12885943
  title: A role for Syk-kinase in the control of the binding cycle of the beta2 integrins (CD11/CD18)
    in human polymorphonuclear neutrophils.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The human donor PMID:12885943 directly studies neutrophil CD18 association, adhesion–detachment
      and chemotaxis; chicken heterophils are the relevant avian granulocyte comparator, and native SYK-linked
      heterophil activation is independently supported. Retain the conservative orthology-based adhesion/migration
      context, explicitly not a direct chicken chemotaxis assay or a universal positive-adhesion sign.
- id: PMID:11940607
  title: Coordinate interactions of Csk, Src, and Syk kinases with [alpha]IIb[beta]3 initiate integrin
    signaling to the cytoskeleton.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse primary PMID:17086186 establishes ITAM-adaptor/Syk integrin signaling in myeloid
      cells, and PMID:11940607 resolves platelet integrin-dependent spreading. Retain a conserved integrin
      signaling/adhesion inference for chicken SYK with source-cell limits, rather than equating avian
      thrombocyte and mammalian platelet circuit completeness. The PTN002815343 ancestral assertion is
      not contradicted by donor count or absence of an avian assay alone.
- id: PMID:15845454
  title: Syk-dependent cytokine induction by Dectin-1 reveals a novel pattern recognition pathway for
    C type lectins.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The early-phagosome localization is retained as a conserved receptor-recruited signaling-pool
      inference from the mouse Dectin1/Syk experiment. It does not assert a directly imaged chicken compartment
      or intraluminal SYK, and native avian phagocyte signaling makes the inferred pool biologically coherent.
      The mouse donor PMID:15845454 establishes fungal/beta-glucan-triggered Dectin1/Syk signaling. Retain
