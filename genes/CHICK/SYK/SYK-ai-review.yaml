id: F1N9Y5
gene_symbol: SYK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9031
  label: Gallus gallus
description: Chicken SYK is a cytoplasmic non-receptor protein tyrosine kinase with tandem SH2 domains
  that couple phosphorylated receptor motifs to intracellular signaling. In DT40 B cells, SYK-dependent
  phosphorylation of BLNK links receptor or oxidative stimulation to downstream signaling assemblies.
  Native chicken heterophil experiments also implicate SYK in Fc-receptor-dependent degranulation. Its
  molecular architecture supports conserved receptor recruitment and substrate phosphorylation, while
  broader myeloid, developmental and hemostatic functions rely to varying degrees on mammalian comparative
  evidence. Avian thrombocytes and mammalian platelets differ in cell structure and signaling outputs,
  so they do not establish identical cellular implementations.
