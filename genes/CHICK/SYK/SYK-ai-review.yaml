      of avian SYK signaling. The exact mouse donor PMID:9171347 studies collagen-triggered platelet mediator
      release. Chicken thrombocytes differ from mammalian platelets, and the retrieved avian comparator
      does not resolve a SYK-dependent arachidonate-release assay. Unlike platelet-named terms, this term
      could apply to avian cells, so preserve source-specific uncertainty rather than infer an absence
      of avian arachidonate regulation.
- id: PMID:8798454
  title: Differential intrinsic enzymatic activity of Syk and Zap-70 protein-tyrosine kinases.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Chicken SYK directly supports protein tyrosine phosphorylation in DT40 cells, including
      BLNK phosphorylation in the hydrogen-peroxide experiment of PMID:11434777. The conserved tandem-SH2/non-receptor
      kinase architecture and purified ortholog biochemistry corroborate the catalytic class. Original
      Reactome/domain/ancestral assertions do not make SYK a membrane-spanning receptor kinase, and DT40
      host identity is kept separate from the identity of transfected partner proteins. ATP is the substrate
      phosphate donor for the conserved SYK kinase reaction, supported by kinase-domain architecture and
      direct substrate phosphorylation. This is not a separate ATP-hydrolysis core function.
