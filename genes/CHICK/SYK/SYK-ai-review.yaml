    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse donor PMID:9171347 tests collagen signaling in mammalian platelets. Primary comparative
      PMID:21816834 distinguishes nucleated chicken thrombocytes from mammalian platelets and documents
      substantial differences in spreading/aggregate behavior. The transferred platelet-specific output
