id: F1NI11
gene_symbol: BTBD3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9031
  label: Gallus gallus
description: >-
  BTBD3 (BTB/POZ domain-containing protein 3) is a 520-residue cytoplasmic protein
  of the BTBD1/2/3/6 family, built from an N-terminal BTB/POZ dimerization domain,
  a BACK domain and a C-terminal PHR domain. Its function is known only from
  mammals: in the developing mouse somatosensory (barrel) cortex, Btbd3 is
  expressed in layer 4 spiny stellate neurons, moves from the cytosol into the
  nucleus in response to neuronal activity, and orients their primary dendrites
  toward active thalamocortical axon terminals; it does the same in ferret visual
  cortex. Mouse knockouts show compulsive-like behaviour and reduced exploration
  that track hippocampal expression. Its molecular activity is not established;
  BTB-domain proteins of this kind commonly self-associate and act as adaptors.
  Chicken BTBD3 is an unreviewed, ortholog-predicted entry with no direct
  experimental characterisation; its role is inferred from the conserved
  vertebrate BTBD3 orthologue group, and in birds it would act in the pallium,
  which lacks the layered neocortex in which the mammalian function was described.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: >-
      Cytoplasm comes from the UniProt subcellular-location keyword, which on this
      TrEMBL entry rests only on an ARBA rule. The location is correct (mouse Btbd3 is
      cytosolic and moves to the nucleus with activity), but the gene already carries
      the more specific cytosol term from the IBA row.
    action: MODIFY
    reason: >-
      True but general. The mouse orthologue was localised to the cytosol directly
      (PMID:24179155, curated in Swiss-Prot P58545), and this gene already carries
      GO:0005829 cytosol by IBA, so the specific term is preferred.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    supported_by:
    - reference_id: PMID:24179155
      supporting_text: endogenous Btbd3 translocated to the cell nucleus in response
        to neuronal activity
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:2385155
  - PANTHER:PTN001229949
  - UniProtKB:Q9H0C5
  review:
    summary: >-
      Cytosolic localisation inherited from the BTBD1/2/3/6 family node, with mouse
      Btbd3 (IDA, PMID:24179155) and human BTBD1 among the donors. Mouse Btbd3 resides
      in the cytosol at rest and enters the nucleus upon neuronal activity.
    action: ACCEPT
    reason: >-
      The family is cytoplasmic throughout, the mouse orthologue has direct evidence,
      and nothing about the chicken protein suggests divergence. The activity-induced
      nuclear pool is a second location that GOA does not carry for chicken; it is
      recorded in core_functions rather than proposed as a NEW row because no
      chicken data exist.
    supported_by:
    - reference_id: PMID:24179155
      supporting_text: endogenous Btbd3 translocated to the cell nucleus in response
        to neuronal activity
- term:
    id: GO:0021987
    label: cerebral cortex development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2385155
  - PANTHER:PTN002908884
  review:
    summary: >-
      Inherited from the vertebrate BTBD3 orthology node PTN002908884 (lamprey,
      fishes, frog, reptiles, birds, mammals), whose only experimental donor is mouse
      Btbd3 (IMP, PMID:24179155: dendrite orientation of barrel-cortex layer 4
      neurons). This is the row flagged for Gallus gallus by Wei et al. 2020
      (PMID:32470107). GO defines the cerebral cortex as "the outer layered region of
      the telencephalon"; birds lack a layered neocortex, and their candidate layer 4
      homologues are organised as pallial nuclei. GO:0021987 is part_of GO:0021543
      pallium development, which applies to all vertebrates.
    action: MODIFY
    reason: >-
      The node placement is reasonable for the gene's function: BTBD3 is a single
      conserved vertebrate orthologue, and there is no sign of loss or divergence in
      birds. What does not transfer cleanly is the anatomy. The avian pallium is
      mostly nuclear rather than layered, and whether its sectors are homologous to
      neocortex is disputed. Dugas-Ford et al. (PMID:23027930) argue that layer 4
      input and layer 5 output cell types are conserved but form nuclei in birds;
      Rueda-Alana et al. (PMID:39946453) find that chick sensory-circuit neurons have
      divergent developmental origins and argue for convergence. The claim that
      survives this dispute is the pallium-level one, so the row is generalised to
      GO:0021543 pallium development, the part_of parent. The GO taxon constraint
      (only_in_taxon Bilateria) does not forbid the original term in birds, and about
      1,759 bird rows to GO:0021987 exist, almost all TreeGrafter or Ensembl IEA. The
      issue is therefore systemic and is raised in suggested_questions. It is not
      treated as a wrong-function error, so REMOVE is not appropriate.
    proposed_replacement_terms:
    - id: GO:0021543
      label: pallium development
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: MGI:MGI:2385155
        source_label: Btbd3 (mouse)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse IMP/IDA (PMID:24179155) for dendrite orientation in barrel-cortex
          layer 4 is sound for a mammal with a layered neocortex; the cortex-specific
          anatomy does not carry over to the nuclear avian pallium.
      - source_id: PANTHER:PTN002908884
        source_label: PTN002908884
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Vertebrate BTBD3 orthology node (lamprey, fishes, frog, reptiles, birds,
          mammals). Placement is right for the gene function but propagates a
          mammal-anatomy term to taxa without a layered cortex.
    supported_by:
    - reference_id: PMID:24179155
      supporting_text: during the development of the sensory cortex, dendritic field
        orientation is controlled by the BTB/POZ domain-containing 3 (BTBD3)
    - reference_id: PMID:23027930
      supporting_text: Our findings establish that the layer 4 input and the layer 5
        output cell types are conserved across the amniotes, but are organized into
        very different architectures, forming nuclei in birds, cortical areas in reptiles,
        and cortical layers in mammals.
    - reference_id: PMID:26154980
      supporting_text: The neocortex is found only in mammals
    - reference_id: PMID:39946453
      supporting_text: suggesting the convergence of high-order sensory processing across
        amniote lineages
    - reference_id: PMID:33574185
      supporting_text: Birds display advanced behaviors, including vocal learning and
        problem-solving, yet lack a layered neocortex
    - reference_id: file:CHICK/BTBD3/BTBD3-notes.md
      supporting_text: 'GO:0021543 pallium development, Aves: 0 annotations.'
- term:
    id: GO:0022008
    label: neurogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0262871
  - MGI:MGI:2385155
  - PANTHER:PTN001229949
  review:
    summary: >-
      Family-level IBA from the deep BTBD1/2/3/6 node PTN001229949, with a Drosophila
      family member and mouse Btbd3 as donors. For BTBD3 the only supporting biology is
      the dendrite-orientation role, and dendrite morphogenesis is an is_a descendant
      of neurogenesis (via neuron differentiation).
    action: TOO_GENERAL
    reason: >-
      True of the gene, but entailed by GO:0048813 dendrite morphogenesis, which is
      accepted below. There is no evidence that BTBD3 contributes to generating neurons
      (proliferation or fate specification), as opposed to shaping their dendrites, so
      the broad term adds nothing.
    supported_by:
    - reference_id: PMID:24179155
      supporting_text: oriented primary dendrites toward active axons in the barrel hollow
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9Y2F9
  - ensembl:ENSP00000367471
  review:
    summary: >-
      Ensembl Compara transfer of the human BTBD3 self-interaction detected in the
      HuRI yeast two-hybrid interactome (IntAct IPI, PMID:32296183). BTB/POZ domains
      typically mediate homodimerization, so self-association of the chicken
      orthologue is plausible.
    action: KEEP_AS_NON_CORE
    reason: >-
      Plausible and consistent with the BTB fold, but it comes from a high-throughput
      binary screen of the human protein and says nothing about the protein's
      biological activity. It is retained as a non-core structural property.
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: yeast two-hybrid (Y2H) represents the only binary PPI assay that can be operated
        at sufficient throughput to systematically screen the human proteome for binary PPIs
    - reference_id: file:CHICK/BTBD3/BTBD3-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR000210; BTB/POZ_dom.
- term:
    id: GO:0048813
    label: dendrite morphogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2385155
  - PANTHER:PTN002908884
  review:
    summary: >-
      Inherited from the vertebrate BTBD3 orthology node, donor mouse Btbd3 (IDA,
      PMID:24179155). Mouse Btbd3 orients primary dendrites of layer 4 neurons toward
      active axons, and the effect is reproduced in ferret visual cortex and by
      ectopic expression in mouse visual cortex. This is the best-characterised
      function of the gene.
    action: ACCEPT
    reason: >-
      This is the core biological process of BTBD3, and it is anatomy-neutral, so it
      transfers to birds without the homology problem that affects the cerebral cortex
      term. The orthology group is single-copy in amniotes and the function is
      conserved across mammalian species and cortical areas. No chicken experiment
      exists, but there is no evidence of divergence.
    supported_by:
    - reference_id: PMID:24179155
      supporting_text: Btbd3 also directed dendrites toward active axon terminals when
        ectopically expressed in mouse visual cortex or normally expressed in ferret
        visual cortex.
    - reference_id: PMID:24179155
      supporting_text: BTBD3 regulation of dendrite orientation is conserved across
        species and cortical areas
