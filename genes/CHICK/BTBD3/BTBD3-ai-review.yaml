- id: file:CHICK/BTBD3/BTBD3-notes.md
  title: BTBD3 chicken curation notes (manual literature review and QuickGO/OLS queries)
  findings: []
core_functions:
- description: >-
    Activity-dependent orientation of neuronal dendrites toward active afferent axon
    terminals during sensory circuit development, as shown for the mouse orthologue
    in barrel-cortex layer 4 neurons. The protein resides in the cytosol and enters
    the nucleus with neuronal activity. Its molecular activity is unknown. In
    birds the relevant territory is the pallium.
  directly_involved_in:
  - id: GO:0048813
    label: dendrite morphogenesis
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:24179155
    supporting_text: In developing mouse somatosensory cortex, endogenous Btbd3 translocated
      to the cell nucleus in response to neuronal activity and oriented primary dendrites
      toward active axons in the barrel hollow.
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity of BTBD3 is unknown. It is not known whether it acts
      as a CUL3 substrate adaptor, a transcriptional regulator after nuclear entry, or
      by some other mechanism, and no binding partner that mediates dendrite orientation
      has been identified.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Should GO:0021987 cerebral cortex development, defined as development of "the
    outer layered region of the telencephalon", carry a taxon constraint (for example
    only_in_taxon Mammalia, or an explicit treatment of reptile and bird pallial
    cortices)? At present it is constrained only to Bilateria, and about 1,759 bird
    annotations exist, almost all TreeGrafter or Ensembl IEA, while GO:0021543 pallium
    development has none. A constraint or a taxon-neutral grouping term would redirect
    these propagations to the pallium level automatically.
- question: >-
    Is the PAINT node PTN002908884 the right place for cerebral cortex development?
    It sits at the vertebrate BTBD3 orthology node and so propagates the term to
    lampreys and teleosts, whose everted pallium has no layered cortex. Dendrite
    morphogenesis at the same node transfers cleanly; a pallium-level process
    term would be the anatomy-neutral equivalent.
- question: >-
    Does chicken BTBD3 mark the avian layer-4-like input neurons (entopallium, field
    L, nucleus basorostralis) that Dugas-Ford and colleagues identified by
    layer-marker expression? If it does, the cell-type homology argument would
    support a cortex-like role even though the anatomy is nuclear.
suggested_experiments:
- description: >-
    In situ hybridisation or spatial transcriptomics for BTBD3 across embryonic and
    post-hatch chick pallium, co-registered with thalamorecipient markers (for
    example RORB) in the entopallium, field L and nucleus basorostralis.
  hypothesis: >-
    BTBD3 is expressed in avian thalamorecipient input neurons during the period
    when thalamic afferents arrive, as mouse Btbd3 is in barrel layer 4.
  experiment_type: expression mapping
- description: >-
    In ovo electroporation of BTBD3 shRNA or a dominant-negative construct into
    the chick dorsal telencephalon, followed by morphometry of dendrite orientation
    relative to labelled thalamic afferents.
  hypothesis: >-
    Chicken BTBD3 is required to bias dendrites of pallial input neurons toward
    active afferents, which would confirm that the function, not just the gene,
    is conserved in birds.
  experiment_type: loss of function with morphometry
