id: Q5R2I8
gene_symbol: APCDD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9031
  label: Gallus gallus
description: >-
  Avian single-pass type I plasma-membrane glycoprotein and 1:1 tetrapod ortholog of
  mammalian and amphibian APCDD1 that functions as a cell-surface feedback negative
  regulator of Wnt signaling. Chicken APCDD1 retains the cleavable N-terminal signal
  peptide (with hydrophobic Met9 at the core position mutated in human hereditary
  hypotrichosis simplex), the tandem ABD1/ABD2 beta-barrel extracellular architecture with
  all 12 conserved disulfide cysteines (including the interdomain Cys52-Cys466 bridge) and
  all three conserved N-glycosylation sequons (Asn100, Asn168, Asn319), the ABD2
  hydrophobic WNT-palmitoleate-binding pocket, and the C-terminal transmembrane helix, and
  is expressed dynamically in developing neural, mesenchymal, and embryonic patterning
  tissues.
