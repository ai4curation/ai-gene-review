suggested_questions:
- question: >-
    Does shRNA or CRISPR knockdown of endogenous chicken APCDD1 in the HH13-HH15 chick
    spinal cord hyperactivate dorsal TOP::eGFP Wnt signaling and impair astrocyte precursor
    migration?
suggested_experiments:
- description: >-
    Perform shRNA knockdown and shRNA-resistant Gallus gallus APCDD1 (Q5R2I8) rescue in
    stage HH12-15 chick neural tubes while quantifying TOP::eGFP Wnt reporter activity,
    phospho-Smad1/5/8 levels, and Sox3+/GLAST+ progenitor fates.
