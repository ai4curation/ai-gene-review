- term:
    id: GO:0030178
    label: negative regulation of Wnt signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:20393562
  qualifier: involved_in
  review:
    summary: Accepted as a true core function of chicken APCDD1 (consistent with IBA/IEA), while recording a source defect because PMID:20393562 electroporated human and mouse APCDD1 cDNAs into chick neural tubes rather than assaying chicken Q5R2I8.
    action: ACCEPT
    reason: >-
      Because reviews judge claims about the gene rather than evidence codes and chicken
      APCDD1 genuinely shares the conserved core Wnt-inhibitory function of SF2 (reinforced
      by IBA and IEA rows), this row is retained as ACCEPT for action consistency. However,
      the full Methods of PMID:20393562 explicitly state that the constructs electroporated
      into the stage 12-13 chick neural tube were human APCDD1 (WT, L9R, L9V) and mouse
      Apcdd1 (full-length and mApcdd1DeltaTM), not chicken Q5R2I8; UniProt attached IDA to
      Q5R2I8 by mistaking the chick host embryo for the assayed gene product. A source
      defect is recorded to repoint this experimental row to mouse UniProtKB:Q3U128 (human
      Q8J025 already holds its own IDA row from PMID:20393562).
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: UNIPROT
      slot: DB_Object_ID
      requested_change: REPOINT
      asserted_value: UniProtKB:Q5R2I8
      corrected_value: UniProtKB:Q3U128
      corrected_label: Apcdd1, Protein APCDD1 (Mus musculus, UniProtKB:Q3U128)
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        In PMID:20393562, stage 12-13 chick neural tubes served solely as the recipient host
        tissue for in ovo electroporation of human APCDD1 (WT, L9R, L9V) and mouse Apcdd1
        (full-length and mApcdd1DeltaTM, amplified from mouse brain endothelial cells);
        chicken APCDD1 (UniProtKB:Q5R2I8) was never cloned or assayed. Because human
        UniProtKB:Q8J025 already carries GO:0030178 (IDA, PMID:20393562) whereas mouse
        UniProtKB:Q3U128 lacks an experimental GO:0030178 row from PMID:20393562, this row
        should be repointed from Q5R2I8 to Q3U128 (and Q5R2I8 given ISS from Q8J025/Q3U128).
      supported_by:
      - reference_id: PMID:20393562
        supporting_text: The full length WT-APCDD1, L9R APCDD1, L9V APCDD1, mouse Apcdd1 or mApcdd1ΔTM isoform were subcloned into the pCAGGS vector and transfected into the chick neural tube (stage 12–13) together with nGFP vector (pCIG) using in ovo electroporation as described35.
    supported_by:
    - reference_id: PMID:20393562
      supporting_text: However, overexpression of APCDD1 strongly reduced eGFP expression levels (Fig. S6a-d), decreased by ~20–30% the number of Sox3+ neural progenitors, as well as various neuronal subtypes of dorsal and ventral origin (Figs. 3a-e and S7a-d). This effect was stronger with mouse Apcdd1, a closer ortholog of the chick protein (Figs. S8a-i and S9a-e).
