- id: PMID:20393562
  title: APCDD1 is a novel Wnt inhibitor mutated in hereditary hypotrichosis simplex.
  findings:
  - statement: In ovo electroporation of human APCDD1 and mouse Apcdd1 constructs into the embryonic chick neural tube suppresses TOP::eGFP canonical Wnt reporter activity and neural progenitor proliferation; endogenous chicken APCDD1 was not cloned or perturbed in this study.
    supporting_text: The full length WT-APCDD1, L9R APCDD1, L9V APCDD1, mouse Apcdd1 or mApcdd1ΔTM isoform were subcloned into the pCAGGS vector and transfected into the chick neural tube (stage 12–13) together with nGFP vector (pCIG) using in ovo electroporation as described35.
    reference_section_type: METHODS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Characterizes human and mouse APCDD1 in chick neural tube host assays and Xenopus apcdd1 in frog embryos; misattributed to chicken Q5R2I8 as an IDA row in GOA because the chick embryo was the recipient host organism.
- id: PMID:22500632
  title: Sox9 and NFIA coordinate a transcriptional regulatory cascade during the initiation of gliogenesis.
  findings:
  - statement: Endogenous chick Apcdd1 is induced by Sox9 and NFIA in the embryonic chick spinal cord ventricular zone at the onset of gliogenesis.
    supporting_text: Analysis of embryos coelectroporated with Sox9-EnR and NFIA revealed a similar loss of Apcdd1, Mmd2, and Zcchc24 expression compared to the Sox9-EnR control (Figures 4T–4CC), indicating that NFIA is not capable of restoring gene expression in the presence of Sox9-EnR.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Demonstrates endogenous chick Apcdd1 expression under Sox9/NFIA control in the embryonic chick spinal cord.
- id: PMID:37155902
  title: Structure of WNT inhibitor adenomatosis polyposis coli down-regulated 1 (APCDD1), a cell-surface lipid-binding protein.
  findings:
  - statement: Vertebrate APCDD1 orthologs share a conserved tandem beta-barrel ectodomain stabilized by six disulfide bridges including interdomain Cys52-Cys466 and an ABD2 hydrophobic pocket that binds palmitoylated WNT ligands.
    supporting_text: ABD1 and ABD2 have, respectively, three and two intradomain disulfide bonds, a large area of interfacial contact, and one interdomain disulfide bond (Cys52–Cys466).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Defines the structural determinants conserved at identical residue positions (Cys52-Cys466, Asn100, Asn168, Asn319) in chicken APCDD1 (Q5R2I8).
