  review:
    summary: The receptor itself produces an inward, depolarizing cation current under the tested ionic
      conditions.
    action: ACCEPT
    reason: In native hair cells this calcium entry recruits a separate potassium conductance that can
      dominate the net response and hyperpolarize the cell. Retain the direct depolarizing component without
      equating it with net excitatory auditory transmission.
