- id: PMID:34867208
  title: 'The Hair Cell α9α10 Nicotinic Acetylcholine Receptor: Odd Cousin in an Old Family.'
core_functions:
- description: 'Chicken alpha9 contributes to the alpha9/alpha10 receptor pore and ACh-dependent gating.
    Native auditory inhibition results from coupling this cation current to a separate potassium conductance;
    the receptor is not itself a potassium channel or primary mechanical sound sensor. Chicken alpha9
    and alpha10 can each support homomeric channels in heterologous systems; native hair-cell receptor
    interpretation remains alpha9/alpha10 heteromeric. '
