id: Q9PTS8
gene_symbol: CHRNA9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9031
  label: Gallus gallus
description: CHRNA9 encodes the alpha9 subunit of an acetylcholine-gated cation channel associated with
  efferent signaling to inner-ear hair cells. Chicken alpha9 and alpha10 can each support homomeric channels
  in heterologous systems; native hair-cell receptor interpretation remains alpha9/alpha10 heteromeric.
  Calcium entry through the receptor recruits calcium-dependent potassium channels, allowing a cation
  channel to mediate net inhibition of hair cells. Chicken alpha9/alpha10 receptors have lower relative
  calcium permeability than rat receptors, and choline acts near full efficacy in chicken compared with
  partial agonism in rat. Nicotine antagonizes the ordinary alpha9/alpha10 channel rather than serving
  as its canonical activating agonist.
