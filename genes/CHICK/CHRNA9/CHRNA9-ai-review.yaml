  review:
    summary: The logical inference from acetylcholine-gated cation-channel activity to an excitatory postsynaptic
      potential overstates the physiological sign.
    action: MARK_AS_OVER_ANNOTATED
    reason: Native alpha9-containing hair-cell receptors couple calcium entry to calcium-dependent potassium
      channels and inhibitory synaptic responses. Real inward cation current is retained separately; it
      does not by itself establish a net EPSP in the native sensory circuit.
    supported_by:
    - reference_id: PMID:10875922
      supporting_text: 'neonatal inner hair cells are inhibited by

        cholinergic synaptic input before the onset of hearing.'
    - reference_id: PMID:22371598
