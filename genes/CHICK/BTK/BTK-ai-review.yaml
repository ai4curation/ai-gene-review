- term:
    id: GO:1900227
    label: positive regulation of NLRP3 inflammasome complex assembly
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P35991
  review:
    summary: Mouse BTK-dependent NLRP3 phosphorylation and assembly are directly supported by PMID:34554188,
      but the exact avian NLRP3 substrate/regulatory configuration and BTK-dependent assembly have not
      been established in the inspected sources.
    action: UNDECIDED
    reason: Mouse BTK-dependent NLRP3 phosphorylation and assembly are directly supported by PMID:34554188,
      but the exact avian NLRP3 substrate/regulatory configuration and BTK-dependent assembly have not
      been established in the inspected sources. Conserved kinase chemistry alone cannot resolve the specificity
      of this multisubunit inflammasome mechanism. Preserve the source inference as unresolved rather
      than invent an avian assay or assert a demonstrated evolutionary loss.
    supported_by:
    - reference_id: PMID:34554188
