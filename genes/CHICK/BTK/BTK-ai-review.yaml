id: Q8JH64
gene_symbol: BTK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9031
  label: Gallus gallus
description: Chicken BTK is a Tec-family non-receptor protein tyrosine kinase with PH, SH3, SH2 and catalytic
  domains. It couples B-cell receptor activation to PLCgamma-dependent phosphoinositide and calcium signaling
  and contributes to downstream NF-kappaB activation. Its conserved PH-domain recruitment mechanism supports
  movement from a cytoplasmic pool to membrane signaling assemblies. DT40 genetic experiments establish
  native avian pathway dependence, while mammalian rescue and purified-domain studies provide complementary
  mechanistic evidence. Nuclear, raft and non-B-cell roles transferred from mammals retain narrower comparative
  support.
