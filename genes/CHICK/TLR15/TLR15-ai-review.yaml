  review:
    summary: Ligand specificity transferred from human TLR2; TLR15 is not a TLR2 orthologue and
      does not respond to acylated lipopeptides.
    action: REMOVE
    reason: 'The donor of this assertion is human TLR2, which has the activity by IDA. The transfer
      fails on two counts. First, orthology: TLR15 exists only in birds and reptiles, and although
      it falls near the TLR1/TLR2/TLR6/TLR10 group it shows no close relationship to any member
      of it, so there is no clade within which the TLR2 ligand specificity could have been inherited.
      A later phylogenomic study puts this beyond doubt and strengthens it structurally: the gene is
      a distinct vertebrate subfamily of ancient origin, present in lungfish and holocephalan
      cartilaginous fish as well as birds and reptiles, and its ectodomain has a single-domain
      architecture rather than the three-domain architecture shared by all TLR1-family members, which
      is the architecture in which the lipopeptide-binding site of the TLR1/TLR2 pair is built.
      Second, direct evidence against: the study that identified the activation mechanism tested
      di- and triacylated lipopeptides on this receptor, with and without each candidate chicken
      surface co-receptor, and a high dose of purified microbial TLR ligands did not activate
      it; a second study found no response to a panel of well-characterised TLR agonists. Removal
      concerns the ligand claim only and says nothing against the family-level annotations.'
