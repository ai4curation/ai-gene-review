    action: ACCEPT
    reason: 'TLR15 receives a signal and transmits it, so GO:0038023 is accurate. It is kept as-is
      rather than replaced with GO:0038187 pattern recognition receptor activity, which every
      other characterised TLR in this batch takes, because GO:0038187 requires combining with
      a pathogen-associated molecular pattern and this receptor does not do that: it is activated
      by cleavage of its own ectodomain by secreted microbial proteases, and purified microbial
      patterns do not activate it. The proteases are enzymes acting on the receptor, not ligands
      the receptor binds, so the specific term would misdescribe the mechanism. A 2025 report is
      consistent with this reading rather than against it: the parasite molecule recovered as a
      candidate ligand is itself an aspartyl protease, so the one candidate protein ligand proposed
      for this receptor is again a protease, and the authors present the receptor assignment as
      provisional.'
