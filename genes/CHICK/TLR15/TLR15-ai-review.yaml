- term:
    id: GO:0043235
    label: signaling receptor complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - MGI:MGI:1346060
  - PANTHER:PTN002808136
