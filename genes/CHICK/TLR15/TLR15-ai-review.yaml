suggested_questions:
- question: Is the Eimeria tenella evidence sufficient for a defence-response process annotation
    on this receptor? Overexpression and knockdown in a fibroblast line change NF-kappa-B and
    NLRP3/IL-1-beta activation by sporozoites, a parasite aspartyl protease was recovered as a
    candidate ligand, and cecal expression correlates negatively with oocyst output, but no
    loss-of-function animal has been tested and the ligand paper leaves other pattern recognition
    receptors open, so no process term is proposed here.
- question: Does GO need a molecular function for a receptor activated by proteolysis of its own
    ectodomain? This receptor is left on the generic GO:0038023 because GO:0038187 pattern recognition
    receptor activity would assert pattern binding that does not occur; the protease-activated
    receptors face the same modelling problem.
- question: Is any co-receptor required for TLR15 signalling? Candidate chicken surface TLRs were
    co-expressed without effect, and the GO:0043235 row inherited from the TLR2/TLR1 heterodimer
    is kept only as a generic claim; identifying the actual dimer would let it be replaced by
    something specific.
- question: Do the reported responses to bacterial infection and to yeast lysates both reduce
    to protease sensing, or is there a second, protease-independent activation route? Yeast-lysate
    activity was abolished by serine-protease inhibition and zymosan did not activate, which suggests
    one mechanism, but this has not been tested with protease-deficient pathogens.
- question: Which host proteases, if any, can activate this receptor? Non-microbial proteases
    were reported to activate it in vitro, which raises the question of whether the receptor also
    responds to host-derived proteolysis during inflammation, as the protease-activated receptors
    do.
suggested_experiments:
- description: Infect chicken macrophages and epithelial cells with isogenic pairs of bacterial
    and fungal strains differing only in secreted protease production, and measure receptor cleavage
    and NF-kappa-B output.
  hypothesis: Protease secretion is necessary and sufficient for pathogen-driven activation of
    this receptor, which would establish protease sensing rather than pattern recognition as the
    physiological mechanism.
  experiment_type: infection with isogenic protease mutants
- description: Map the cleavage site or sites in the ectodomain by mass spectrometry of the cleaved
    receptor, then test non-cleavable substitutions for loss of activation while confirming surface
    expression.
  hypothesis: A defined cleavage event, rather than general ectodomain degradation, activates
    the receptor; the cleaved epitope would also give a reagent for detecting activation in tissue.
  experiment_type: cleavage site mapping with mutagenesis
- description: Test the lipopeptide question directly in a chicken cell background by expressing
    this receptor with and without each chicken TLR1-like and TLR2-like paralogue and stimulating
    with Pam3CSK4 and Pam2CSK4 across a dose range.
  hypothesis: The inherited triacyl lipopeptide binding annotation is wrong; a systematic negative
    in the homologous species would close the question rather than leaving it resting on a heterologous
    assay.
  experiment_type: ligand specificity assay
