    summary: Correct, but the receptor-specific child exists and is supported by direct experiment.
    action: MODIFY
    reason: 'Two independent studies show that signalling is initiated at this receptor and ends
      in NF-kappa-B-dependent transcription, which is what GO:0035681 toll-like receptor 15 signaling
      pathway describes. Using the numbered child is appropriate here and not merely more specific:
      TLR15 has no mammalian orthologue, so the pathway it initiates is not a species variant
      of any other numbered TLR pathway, and its activation mechanism is distinct. An independent
      study in a chicken cell background adds gain- and loss-of-function support for signalling at
      this receptor: overexpression in DF-1 fibroblasts augmented, and knockdown reduced, activation
      of the NF-kappa-B and NLRP3/IL-1-beta pathways on exposure to Eimeria tenella sporozoites.'
