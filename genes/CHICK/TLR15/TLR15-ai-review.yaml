  review:
    summary: Inherited from the TLR2/TLR1 heterodimer; defensible only at this generic level,
      since TLR15's signalling complex is unidentified.
    action: KEEP_AS_NON_CORE
    reason: The donor basis is TLR2, whose complex is the TLR1/TLR2 heterodimer, and no heterodimerisation
      partner has been found for TLR15 — the ligand study expressed it with each candidate chicken
      surface TLR without effect. What is reported is that the ectodomain-less receptor autoactivates,
      which the authors interpret as a tendency to self-dimerisation, as for TLR4 and Drosophila
      Toll. Since TLRs generally signal as dimers, membership of some signalling receptor complex
      is plausible, so the row is kept rather than removed, but it is not a core statement. The
      composition is now better constrained than it was, since the cytoplasmic TIR domain has been
      crystallised as a dimer and mutation of an interface residue abolished the dimer peak in
      solution, so the complex is most likely a homodimer of this receptor rather than a heterodimer
      with another TLR. It is still kept as non-core, because the isolated TIR domain is
      predominantly monomeric in solution and no dimer of the full-length receptor has been shown.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: UniProtKB:O60603
        source_label: TLR2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: TLR2's complex is the TLR1/TLR2 heterodimer; the generic parent term survives
          the transfer, the specific partnership does not.
