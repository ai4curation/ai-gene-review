- term:
    id: GO:0051726
    label: regulation of cell cycle
  evidence_type: TAS
  original_reference_id: PMID:18245482
  qualifier: involved_in
  review:
    summary: Full PMID:18245482 establishes reduced Rel-driven transformation/colony formation after BLNK
      restoration, but its experiments do not distinguish cell-cycle progression from survival, differentiation
      or other causes of reduced transformation.
    action: MARK_AS_OVER_ANNOTATED
    reason: Full PMID:18245482 establishes reduced Rel-driven transformation/colony formation after BLNK
      restoration, but its experiments do not distinguish cell-cycle progression from survival, differentiation
      or other causes of reduced transformation. A specific cell-cycle-regulatory process exceeds that
      assay resolution. This does not negate BLNK’s tumor-suppressive effect or claim that BLNK cannot
      influence the cell cycle in another context.
