  review:
    summary: The original source places BLNK in the developmental and tumor-suppressive B-cell context
      and directly shows that restoring BLNK restrains transformation of primary chicken lymphocytes.
    action: KEEP_AS_NON_CORE
    reason: The original source places BLNK in the developmental and tumor-suppressive B-cell context
      and directly shows that restoring BLNK restrains transformation of primary chicken lymphocytes.
      Bursal BASH expression and BCR coupling corroborate a conserved developmental role, but this is
      not a direct chicken developmental-stage knockout assay. Retain the existing broad differentiation
      attribution as non-core contextual biology, distinct from the directly demonstrated adaptor mechanism.
