id: Q9YGC1
gene_symbol: BLNK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9031
  label: Gallus gallus
description: Chicken BLNK, also called BASH or SLP-65, is a noncatalytic adaptor expressed prominently
  in bursal B cells. BCR stimulation promotes its tyrosine phosphorylation and assembly with signaling
  proteins. Multiple phosphorylated docking sites on the same BLNK molecule organize PLCgamma and other
  effectors, linking SYK-dependent receptor signals to calcium and Rac–JNK responses. Its cytoplasmic
  and membrane-associated complexes perform scaffold work rather than kinase or phospholipase catalysis.
  Re-expression of BLNK can restrain Rel-driven transformation of primary chicken lymphocytes.
