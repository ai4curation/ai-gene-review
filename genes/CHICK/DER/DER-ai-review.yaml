    - reference_id: PMID:12200544
      supporting_text: Sequence analysis of a cDNA for D-erythrulose reductase from chicken liver showed that the deduced open reading frame encodes the protein with a molecular mass of 26 kDa consisting of 246 amino acids.
- term:
    id: GO:0050038
    label: L-xylulose reductase (NADPH) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1915130
  - PANTHER:PTN001211870
  - RGD:620031
  - UniProtKB:Q7Z4W1
  - WB:WBGene00000984
  review:
    summary: >-
      PAINT inference from node PTN001211870. Donors include mammalian DCXR (SF2)
      and C. elegans DHS-21, which is in the same PANTHER subfamily (SF3) as chicken
      DER and has been shown to reduce L-xylulose with NADPH. L-xylulose reduction
      has not been reported for the chicken enzyme; UniProt describes it only as a
      probable activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The activity is experimentally grounded on both sides of the SF2/SF3 split, so
      inheritance by DER is a reasonable phylogenetic inference, and the active-site
      residues are conserved with the family. But the native chicken enzyme was
      described as highly specific for D-erythrulose, and no chicken data on
      L-xylulose exist. The function is retained as an inferred, non-core activity;
      it should not be treated as experimentally established in chicken when used
      as a reference for transfer.
    supported_by:
    - reference_id: PMID:21477590
      supporting_text: Recombinant DHS-21 was shown to convert L-xylulose to xylitol using NADPH as a cofactor.
    - reference_id: PMID:11882650
      supporting_text: homotetramers with NADPH-linked reductase activity for alpha-dicarbonyl compounds, catalyzed the oxidoreduction between xylitol and l-xylulose
