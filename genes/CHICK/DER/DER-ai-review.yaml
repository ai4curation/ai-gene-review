  review:
    summary: >-
      EC/Rhea-based IEA (EC 1.1.1.162). This is the defining, experimentally
      established activity of chicken DER: the enzyme purified and crystallized
      from chicken liver reduces D-erythrulose to D-threitol with NADPH (preferred)
