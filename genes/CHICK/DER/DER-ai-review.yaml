    supporting_text: Recombinant DHS-21 was shown to convert L-xylulose to xylitol using NADPH as a cofactor.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Same-subfamily evidence for L-xylulose reductase activity; organismal longevity/reproduction phenotypes are not transferred.
