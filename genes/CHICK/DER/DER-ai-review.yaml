suggested_questions:
- question: >-
    Does chicken DER reduce L-xylulose to xylitol, and with what catalytic
    efficiency relative to D-erythrulose? The L-xylulose reductase annotation rests
    only on PANTHER subfamily SF3 membership shared with C. elegans DHS-21.
- question: >-
    What is the physiological source and fate of D-erythrulose/D-threitol in birds,
    i.e. which metabolic process does DER serve beyond the reaction itself?
suggested_experiments:
- description: >-
    Express recombinant chicken DER and measure kinetics with D-erythrulose,
    L-xylulose, diacetyl and other alpha-dicarbonyls side by side with human DCXR
    and C. elegans DHS-21, to establish whether substrate preference diverges
    between PANTHER subfamilies SF2 and SF3.
  experiment_type: enzyme kinetics
- description: >-
    Determine the stereochemistry of the acetoin produced from diacetyl by chicken
    DER, which would allow assignment of a specific diacetyl reductase activity
    term.
  experiment_type: enzyme assay
