- description: >-
    NADPH-dependent reduction of vicinal dicarbonyl compounds such as diacetyl,
    the SDR carbonyl reductase chemistry shared across the PTHR44252 family.
    Experimentally observed for the chicken enzyme; the stereochemistry of the
    acetoin product is not reported.
