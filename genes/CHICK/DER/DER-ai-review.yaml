id: Q8JIS3
gene_symbol: DER
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9031
  label: Gallus gallus
description: >-
  D-erythrulose reductase (DER) is a 246-residue cytosolic short-chain
  dehydrogenase/reductase (SDR) of chicken that forms a homotetramer and is most
  abundant in kidney and liver. The enzyme purified from chicken liver reduces the
  tetrulose D-erythrulose to D-threitol using NADPH (preferred) or NADH, and also
  reduces vicinal diketones such as diacetyl, consistent with a role in reducing
  small alpha-dicarbonyl and sugar carbonyl compounds. DER belongs to the
  L-xylulose reductase/carbonyl reductase SDR family (PANTHER PTHR44252, subfamily
  SF3), which also contains the nematode DHS-21 and the mammalian
  dicarbonyl/L-xylulose reductases (DCXR, a sister subfamily); by descent it is
  predicted, but not shown in chicken, to reduce L-xylulose to xylitol.
existing_annotations:
- term:
    id: GO:0004090
    label: carbonyl reductase (NADPH) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:107200
  - PANTHER:PTN001211870
  - WB:WBGene00000984
  review:
    summary: >-
      Family-level PAINT inference of NADPH-dependent carbonyl reduction from the
      PTHR44252 ancestral node PTN001211870, which lies above the SF1 (Cbr2), SF2
      (mammalian DCXR) and SF3 (DER, DHS-21) split. Chicken DER is inside this clade,
      and the activity is independently supported in chicken: the purified liver
      enzyme reduces the alpha-diketone diacetyl (a ketone to secondary alcohol
      reduction) as well as D-erythrulose, with NADPH as the preferred cofactor.
    action: ACCEPT
    reason: >-
      The node placement is phylogenetically sound and the activity is directly
      observed for the native chicken enzyme (diacetyl and D-erythrulose reduction;
      NADPH Km 7.9 uM). GO:0004090 (a secondary alcohol + NADP+ = a ketone + NADPH)
      is the right family-level description of the broad dicarbonyl reductase
      chemistry; the more specific D-erythrulose activity is captured by GO:0047880.
    supported_by:
    - reference_id: PMID:9538249
      supporting_text: it can catalyze reduction of not only D-erythrulose but also such diketones as diacetyl
    - reference_id: PMID:7358641
      supporting_text: NADH was less effective than NADPH and the Km's for NADH and NADPH were 67 micrometers and 7.9 micrometers, respectively
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: >-
      UniProt SubCell mapping to cytoplasm. DER was purified as a soluble enzyme from
      chicken liver extract, and its cloning paper notes that its subcellular
      localization differs from that of the closely related (mitochondrial) mouse
      tetrameric lung carbonyl reductase.
    action: ACCEPT
    reason: >-
      A soluble cytosolic location is consistent with purification of the native
      enzyme from crude liver extract and with the stated contrast to the related
      tetrameric carbonyl reductase. No organelle targeting is reported. The
      evidence is indirect but nothing contradicts it, and cytoplasm is as precise
      as the available data allow.
    supported_by:
    - reference_id: PMID:12200544
      supporting_text: these two enzymes have many biochemical differences; their substrate specificity, subcellular localization, organ distribution, etc.
    - reference_id: PMID:7358641
      supporting_text: The overall purification of the enzyme was 164-fold from a crude extract.
- term:
    id: GO:0005997
    label: xylulose metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1915130
  - PANTHER:PTN001211870
  - RGD:620031
  - UniProtKB:Q7Z4W1
  - WB:WBGene00000984
  review:
    summary: >-
      PAINT inference from node PTN001211870, grounded in experimental L-xylulose
      reduction by mammalian DCXR (SF2) and by C. elegans DHS-21, which shares
      PANTHER subfamily SF3 with chicken DER. L-xylulose metabolism has not been
      examined in chicken.
    action: KEEP_AS_NON_CORE
    reason: >-
      The inference is phylogenetically reasonable: the function is present on both
      sides of the SF2/SF3 split (mammalian DCXR and DHS-21), so its loss in DER
      would need a lineage-specific event for which there is no evidence. However,
      chicken DER was characterized as highly specific for D-erythrulose, and no
      chicken study reports L-xylulose reduction or a role in xylulose metabolism,
      so this remains an inferred, non-core process for this protein.
    supported_by:
    - reference_id: PMID:21477590
      supporting_text: Recombinant DHS-21 was shown to convert L-xylulose to xylitol using NADPH as a cofactor.
    - reference_id: PMID:11882650
      supporting_text: catalyzed the oxidoreduction between xylitol and l-xylulose
    - reference_id: PMID:7358641
      supporting_text: was highly specific to D-erythrulose with an apparent Km of 0.38 mM
- term:
    id: GO:0006006
    label: glucose metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1915130
  - PANTHER:PTN001211870
  - RGD:620031
  - UniProtKB:Q7Z4W1
  review:
    summary: >-
      PAINT inference whose donors are all mammalian DCXR (SF2); it reflects the
      proposed role of L-xylulose reductase in the uronate cycle of glucose
      metabolism. Unlike the xylulose terms, no SF3 member is among the donors.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The link to glucose metabolism is indirect (via L-xylulose reduction in the
      uronate cycle) and is drawn from mammalian enzymes in a sister subfamily. Even
      for mammals the DCXR characterization paper states that the kidney
      localization suggests a role other than general carbohydrate metabolism.
      Chicken DER is a D-erythrulose (tetrose) reductase, and neither L-xylulose
      reduction nor uronate-cycle participation has been tested in chicken. The very
      broad term GO:0006006 overstates what is known for this protein.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001211870
        source_label: PTN001211870
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node spans SF1/SF2/SF3; for this term all extant donors are mammalian DCXR
          (SF2), whose glucose-metabolism role is an indirect uronate-cycle inference. Chicken
          DER (SF3) is characterized as a D-erythrulose reductase with no uronate-cycle data.
    supported_by:
    - reference_id: PMID:11882650
      supporting_text: the unique localization of the enzyme in kidney suggests that it has a role other than in general carbohydrate metabolism
    - reference_id: PMID:7358641
      supporting_text: The enzyme was shown to catalyze the reduction of D-erythrulose to D-threitol
