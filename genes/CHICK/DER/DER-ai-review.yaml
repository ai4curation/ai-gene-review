  title: 'Cloning and sequence analysis of D-erythrulose reductase from chicken: its
    close structural relation to tetrameric carbonyl reductases.'
  findings:
  - statement: cDNA cloning of chicken DER (246 aa), >60% identity to mouse tetrameric carbonyl reductase but with distinct substrate specificity and localization; active-site substitutions Asn192 and His148.
    supporting_text: Although the reductase shares more than 60% identity in the amino acid sequence with the mouse tetrameric carbonyl reductase, these two enzymes have many biochemical differences
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; links the characterized enzyme to the Q8JIS3 sequence (UniProt records peptide sequencing of the purified protein).
