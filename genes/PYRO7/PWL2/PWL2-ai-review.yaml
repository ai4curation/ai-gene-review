    action: NEW
    reason: >-
      GOA carries no process or function annotation for PWL2 at all, although its biological activity is now
      established. Participation test: the effector itself performs the step, binding the host target HIPP43 and
      relocalising it, and a binding-dead variant loses both the relocalisation and the virulence contribution,
      so this rests on more than necessity evidence. Comparator check: other secreted fungal effectors that
      suppress pattern-triggered immunity carry this symbiont-side branch (M. oryzae Slp1 and Cladosporium fulvum
      Ecp6 use the child term GO:0140423), confirming the branch is intended for effectors. The parent GO:0052034
      rather than the signaling child GO:0140423 is proposed because the authors explicitly leave open whether
      HIPP43 acts within the immune signalling chain.
