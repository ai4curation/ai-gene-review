proposed_new_terms: []
suggested_questions:
- question: >-
    Which molecular-function term should capture Pwl2 binding to host HIPP43? Protein sequestering activity
    (GO:0140311) would fit displacement of HIPP43 from plasmodesmata, but the same study suggests Pwl2 may
    stabilise or increase HIPP43 accumulation, and HIPP43 overexpression alone suppresses the reactive oxygen
    burst, so it is unclear whether Pwl2 inactivates or co-opts its target. The same question applies to other
    MAX effectors that bind host small HMA proteins, such as AVR-Pik with OsHIPP19.
- question: >-
    Recognition of Pwl2 by barley MLA3 and by the unidentified weeping lovegrass resistance gene is a host-side
    event, and GO offers no symbiont-side term for being recognised. Should the avirulence and host-range role of
    PWL effectors be represented on the effector at all, or only through the plant receptor's annotations and
    GO-CAM models of the interaction?
- question: >-
    Would a cellular-component term for the biotrophic interfacial complex be useful? Cytoplasmic effectors such
    as Pwl2 and apoplastic effectors such as Bas4 are both annotated only to extracellular region, which loses
    the distinction between the two secretion systems and the two sites of action.
suggested_experiments:
- description: >-
    Determine whether Pwl2 binding inhibits or stabilises HIPP43 in planta: measure HIPP43 protein half-life and
    plasmodesmatal pool with and without Pwl2, and test whether the Pwl2 variant that cannot bind HIPP43 behaves
    like the no-effector control, so that a sequestering versus stabilising molecular function can be assigned.
- description: >-
    Test whether HIPP43 acts upstream or downstream of reactive oxygen production by combining HIPP43 knockdown
    with chitin and flg22 elicitation and measuring receptor-complex assembly, so that the parent term
    (suppression of pattern-triggered immunity) can be refined to the signalling child term if warranted.
- description: >-
    Image native (untagged, antibody-detected) Pwl2 during rice infection to confirm that the plasmodesmatal
    relocalisation of HIPP43 observed in Nicotiana benthamiana and transgenic barley also occurs in the natural
    rice interaction.
