taxon:
  id: NCBITaxon:242507
  label: Pyricularia oryzae (strain 70-15 / ATCC MYA-4617 / FGSC 8958)
description: >-
  PWL2 (Pathogenicity toward Weeping Lovegrass 2; MGG_04301, present in two copies in strain 70-15) encodes a
  small (145 aa), glycine-rich, signal-peptide-bearing cytoplasmic effector of the rice blast fungus
  Magnaporthe oryzae (Pyricularia oryzae). Its expression is induced during biotrophic invasion of living rice
  cells and is controlled by the Pmk1 MAP kinase. Pwl2 is secreted by invasive hyphae through a brefeldin
  A-insensitive, exocyst- and Sso1 t-SNARE-dependent route into the biotrophic interfacial complex (BIC), a plant
  membrane-rich structure at the hyphal tip, from where it is translocated into the rice cytoplasm, apparently by
  host clathrin-mediated endocytosis, and moves into neighbouring uninvaded cells. The mature protein adopts a MAX
  (Magnaporthe Avrs and ToxB-like) beta-sandwich fold with a C-terminal helical extension and binds the
  heavy-metal-associated (HMA) domain of host small HMA proteins of the HIPP43 type with nanomolar affinity
  through a large multi-part interface. Binding displaces HIPP43 from plasmodesmata into cytoplasmic mobile
  bodies; in planta expression of Pwl2 attenuates chitin- and flg22-induced reactive oxygen bursts and increases
  blast susceptibility, while deletion of the PWL2 copies reduces disease severity on susceptible hosts. In hosts
  carrying a cognate immune receptor the same protein acts as an avirulence and host-range determinant: it
  prevents infection of weeping lovegrass (Eragrostis curvula) and is recognised by the barley NLR MLA3. Natural
  alleles such as pwl2-2 escape this recognition while retaining HIPP43 binding, and a rice Pik NLR engineered to
  carry the OsHIPP43 HMA domain in place of its integrated HMA domain recognises Pwl2 and related PWL effectors.
