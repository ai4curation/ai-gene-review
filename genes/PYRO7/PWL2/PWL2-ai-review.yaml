core_functions:
- description: >-
    Host-translocated MAX-fold effector that is secreted into the biotrophic interfacial complex, enters the rice
    cytoplasm and binds the heavy-metal-associated domain of host HIPP43-type small HMA proteins, displacing
    HIPP43 from plasmodesmata and thereby suppressing pattern-triggered immune output (chitin- and flg22-induced
    reactive oxygen bursts) to promote biotrophic colonisation.
