  - PANTHER:PTN004691474
  review:
    summary: TreeGrafter assignment from PANTHER node PTN004691474 (PTHR24324:SF5). The same PAINT annotations give
      the N. crassa ortholog KAL-1 its IBA rows; the node is grounded in experimental DNA binding by fission and
      budding yeast and human SF5 members.
    action: ACCEPT
    reason: Sequence-specific binding of cis-regulatory DNA is the ancestral homeodomain activity of the SF5 subfamily,
      and TRF2 is inside that subfamily with an intact recognition helix (WFQNRR, residues 120-125). No TRF2-specific
      binding site or motif has been determined, so no more specific term is warranted. This is the most precise
      DNA-binding claim supported and is accepted as core, but it is inferred, not experimentally established in
      P. oryzae.
