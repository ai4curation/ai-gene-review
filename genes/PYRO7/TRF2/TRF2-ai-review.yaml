core_functions:
- description: Homeodomain DNA-binding transcription factor that represses expression of the pyriculol polyketide
    synthase gene MoPKS19 in its biosynthetic gene cluster. Repression is shown genetically (deletion raises MoPKS19
    transcript); sequence-specific cis-regulatory DNA binding and nuclear action are inferred from the conserved
    homeodomain and PTHR24324:SF5 membership, and whether repression is direct is unknown.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - *id006
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id004
  - *id005
  - *id001
  - *id002
suggested_questions:
- question: Does TRF2 bind the MoPKS19 promoter (and other cluster promoters) directly, and what DNA motif does
    its homeodomain recognise? Do TRF1 and TRF2 act together or in parallel?
- question: Does loss of TRF2 increase pyriculol and pyriculariol production, as UniProt implies, or only MoPKS19
    transcript? Metabolite levels were not reported for the TRF mutants.
- question: What does the C-terminal PF24818 (PH_TRF2_HOY1) PH-like domain contribute, and is repression of secondary-metabolite
    clusters conserved in the N. crassa ortholog KAL-1?
suggested_experiments:
- description: HPLC quantification of pyriculol, pyriculariol and their dihydro derivatives in ΔMoC19TRF2, complemented
    and overexpression strains, together with RNA-seq to define all genes repressed by TRF2.
  experiment_type: metabolite profiling / RNA-seq
- description: ChIP-seq or DAP-seq of tagged TRF2, plus a GFP fusion to confirm nuclear localisation, to establish
    direct binding at cluster promoters and its recognition motif.
  experiment_type: ChIP-seq / DAP-seq / localisation
