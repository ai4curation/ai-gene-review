  label: Pyricularia oryzae 70-15
description: TRF2 (MoC19TRF2, MGG_04853) is a 625-residue homeodomain transcription factor of the rice blast fungus
  Pyricularia oryzae, encoded among the genes flanking the pyriculol polyketide synthase gene MoPKS19. It has a
  single typical homeodomain (residues 73-132, with the WFQNRR DNA-recognition motif) preceded by a disordered N-terminal
  region, and a C-terminal PH-like domain (PF24818, PH_TRF2_HOY1) shared with a lineage of fungal homeobox proteins
  including Neurospora crassa KAL-1 (its one-to-one ortholog) and Yarrowia lipolytica HOY1. Deletion of TRF2, like
  deletion of the second cluster transcription factor TRF1, increases MoPKS19 transcript levels, so TRF2 acts as
  a negative regulator of the cluster that makes the lesion-inducing heptaketides pyriculol and pyriculariol. Its
  DNA-binding specificity, direct target genes and nuclear localisation are inferred from the homeodomain and have
  not been tested directly.
