  label: Chromohalobacter israelensis DSM 3043
description: Csal_1000 encodes the predicted alpha subunit of a heterotetrameric sarcosine oxidase in Chromohalobacter
  israelensis DSM3043, historically called C. salexigens. Its specific SoxA-type domain assignment and the
  Csal_0998–Csal_1001 locus support participation in sarcosine-to-glycine conversion. By comparison with characterized
  heterotetramers, the assembled enzyme couples sarcosine oxidation to oxygen reduction and can transfer the
  one-carbon unit to tetrahydrofolate; without folate it releases formaldehyde. The individual DSM3043 subunit
  has not been biochemically characterized.
