    action: KEEP_AS_NON_CORE
    reason: The Sox-specific signature and matched four-gene locus support a heterotetrameric sarcosine
      oxidase role. GO0008115 describes the folate-free formaldehyde-producing reaction; the folate-coupled
      chemistry of characterized heterotetramers is the more representative core. This is a comparative
      complex contribution, not direct purified activity of this DSM3043 subunit. Native locus involvement
      is reported in PMID32631860, but the accessible 2017 primary material does not map each individual
      deletion. The whole-complex term is retained without claiming independently enabled activity.
