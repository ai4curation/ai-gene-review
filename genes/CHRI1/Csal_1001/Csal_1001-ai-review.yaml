proposed_new_terms:
- proposed_name: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  proposed_definition: 'Catalysis of the reaction: sarcosine + (6S)-5,6,7,8-tetrahydrofolate + O2 = (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate
    + glycine + H2O2.'
  justification: This is EC 1.5.3.24 / RHEA:70455, the reaction of heterotetrameric sarcosine oxidases
    in the presence of tetrahydrofolate. GO:0008115 is defined by the folate-free reaction producing formaldehyde
    (RHEA:13313), which tetrahydrofolate suppresses in the heterotetramers, so no current GO molecular-function
    term represents the physiological activity. This is a proposed activity of the assembled complex,
    not an independently enabled activity of this subunit. The core records contributes_to GO:0016647
    because the schema has no proposed-contributes-to slot.
