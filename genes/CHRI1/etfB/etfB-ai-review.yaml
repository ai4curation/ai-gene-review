- term:
    id: GO:0031457
    label: glycine betaine catabolic process
  evidence_type: IMP
  original_reference_id: PMID:32631860
  qualifier: involved_in
  review:
    summary: EtfB is required for the dimethylglycine-to-sarcosine step of glycine betaine degradation,
      as part of the ETF electron acceptor.
    action: NEW
    reason: 'Disruption and complementation show that csal_0993 is required for dimethylglycine degradation
      to sarcosine; the mutant still uses sarcosine and glycine, which places the defect at this step
      of glycine betaine catabolism. Participation test: as a subunit of the ETF electron acceptor, EtfB
      does part of the work of the step, the same role for which GO annotates human ETFB to acyl-CoA-dehydrogenase
      beta-oxidation (GO:0033539, IDA). GO has no dimethylglycine catabolic process term; GO:0031457 is
      defined as "The chemical reactions and pathways resulting in the breakdown of glycine betaine, N-trimethylglycine."
      The same term is proposed for etfA, ddhC and Csal_0991 in this locus. Not core, because direct electron
      transfer has not been measured. The inferred electron-carrier participation is retained, but the
      exact native sequence of partners is a proposal; it is not a purified-relay result. Genetics used
      the ZW4-1 derivative.'
    supported_by:
    - reference_id: PMID:32631860
      supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991,
        csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine.
    - reference_id: file:CHRI1/etfB/etfB-uniprot.txt
      record_section:
      - CC:DISRUPTION PHENOTYPE
      supporting_text: Deletion mutant loses its ability to grow using DMG as the sole nitrogen source
        but is still capable of utilizing sarcosine and glycine as the sole nitrogen source.
