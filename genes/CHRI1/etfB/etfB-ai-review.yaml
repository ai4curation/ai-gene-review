suggested_questions:
- question: Does EtfA-EtfB accept electrons from reduced Csal_0991 or directly from DdhC, and which quinone
    oxidoreductase reoxidizes it?
suggested_experiments:
- description: Reconstitute purified DdhC, Csal_0991 and EtfA-EtfB with dimethylglycine and follow ETF
    flavin reduction spectroscopically.
