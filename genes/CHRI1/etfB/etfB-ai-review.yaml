core_functions:
- description: Beta subunit of the EtfA-EtfB heterodimer encoded in the ddhC-Csal_0991-etfA-etfB dimethylglycine
    degradation locus. It contributes to the electron-carrier activity of the heterodimer, whose FAD is
    bound mainly by EtfA; donor and acceptor have not been shown biochemically.
  contributes_to_molecular_function:
    id: GO:0009055
    label: electron transfer activity
  supported_by:
