gene_symbol: etfB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:290398
  label: Chromohalobacter israelensis DSM 3043
description: EtfB (Csal_0993) is the beta subunit of an electron-transfer flavoprotein (ETF) heterodimer
  of the halophilic gammaproteobacterium Chromohalobacter salexigens. It belongs to the ETF beta-subunit/FixA
  family; by similarity to characterized ETFs it binds the structural AMP of the heterodimer, while the
  FAD-binding interface lies mainly on the alpha subunit EtfA. etfB is the last gene of a locus with ddhC
  (N,N-dimethylglycine/sarcosine dehydrogenase), the membrane-anchored ferredoxin gene Csal_0991 and etfA,
  and its deletion abolishes growth on dimethylglycine as sole nitrogen source while growth on sarcosine
  and glycine is retained. EtfA-EtfB is therefore thought to carry electrons generated during dimethylglycine
  conversion to sarcosine to an unidentified respiratory acceptor. Native genetic evidence comes from
  the DSM3043-derived rifampin-resistant strain ZW4-1; the ETF itself was not purified in that study.
