    summary: Electron transfer is the defining activity of the ETF heterodimer of which EtfB is the beta
      subunit, and the locus genetics place it in dimethylglycine degradation.
    action: ACCEPT
    reason: Combined automated annotation (GO_REF:0000120) from the InterPro IPR012255 ETF beta-subunit
      family mapping and PANTHER node PTN002327631 (PTHR21294, whose electron-transfer IBD sits on PTN007689635,
      seeded by human ETFB). Family membership is solid (InterPro, NCBIfam ETFlavBetaProt, Pfam ETF, curated
      Swiss-Prot similarity note). Deletion of csal_0993 abolishes dimethylglycine conversion to sarcosine
      (PMID:32631860), and Swiss-Prot curates participation in electron transfer during dimethylglycine
      degradation (ECO:0000269). The FAD-binding interface lies mainly on the alpha subunit, with the
      beta subunit contributing to heterodimer architecture; the activity belongs to the heterodimer,
      so core_functions records it as contributes_to_molecular_function, as in the human ETFB review.
      The GOA term itself is correct.
