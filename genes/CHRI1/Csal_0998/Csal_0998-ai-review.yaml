proposed_new_terms:
- proposed_name: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  proposed_definition: 'Catalysis of the reaction: sarcosine + (6S)-5,6,7,8-tetrahydrofolate + O2 = (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate
    + glycine + H2O2.'
  justification: This proposal describes the complete folate-coupled reaction of heterotetrameric SoxABDG (EC
    1.5.3.24; RHEA:70455), distinct from the glycine/formaldehyde-producing GO:0008115 reaction. It is an ontology
    proposal for the assembled complex, not the activity of each isolated subunit. The target locus is inferred from subunit-specific signatures and genomic context; target-specific
    folate product partition has not been measured.
  proposed_parent:
    id: GO:0016647
    label: oxidoreductase activity, acting on the CH-NH group of donors, oxygen as acceptor
  supported_by:
  - reference_id: PMID:9185627
    supporting_text: only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as substrates
- proposed_name: sarcosine oxidase (imine-forming) activity
  proposed_definition: Catalysis of oxygen-dependent oxidation of sarcosine to the corresponding sarcosine
    imine, with reduction of molecular oxygen to hydrogen peroxide. In heterotetrameric sarcosine oxidase,
    this catalytic subreaction is localized to beta-bound FAD and FMN and is established in the assembled enzyme.
    It excludes subsequent imine hydrolysis and transfer of the one-carbon fragment to tetrahydrofolate.
  justification: Sarcosine reduces beta-bound FAD to FADH2; the two electrons pass through beta-bound FMN to
    reduce one O2 to H2O2. This defines the oxidation step before alpha-associated processing of the imine.
    GO:0008115 additionally specifies glycine/formaldehyde production, while the separate folate-coupled proposal
    specifies the complete heterotetramer reaction. Neither is a precise name for this beta-localized catalytic
    subreaction. The activity proposal does not assert that an isolated beta preparation is catalytically competent.
    The beta-site assignment is inferred from the specific SoxB family and characterized U-96/other heterotetrameric
    homologs; this target subunit has not been isolated and assayed.
  proposed_parent:
    id: GO:0016647
    label: oxidoreductase activity, acting on the CH-NH group of donors, oxygen as acceptor
  supported_by:
  - reference_id: PMID:16934831
    supporting_text: Sarcosine binds near FAD where it is oxidized to the corresponding imine, accompanied
      by the formation of 1,5-dihydroFAD (FADH 2 ).
  - reference_id: PMID:16934831
    supporting_text: Electrons from FADH 2 are transferred, one at a time, to FMN, which then reduces oxygen
      to hydrogen peroxide
  - reference_id: PMID:15946648
    supporting_text: The beta subunit contains dimethylglycine, FAD, and FMN, and these flavins are approximately
      10A apart.
  - reference_id: file:PSEPK/soxB/soxB-source-analysis/assembly-evidence.md
    supporting_text: Moreover, no flavin was found to be bound to these protein samples.
