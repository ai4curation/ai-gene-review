        transfer flavoprotein ubiquinone oxidoreductase.
- term:
    id: GO:0033539
    label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002249443
  review:
    summary: TreeGrafter pathway transfer from a PAINT IBD seeded by human ETFA; for this dimethylglycine-locus
      ETF paralog the specific acyl-CoA dehydrogenase partnership is not supported.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'TreeGrafter IEA (GO_REF:0000118): Q1QYV9 is grafted to PTN002249443 and inherits the GO:0033539
      IBD that PAINT placed on PTN000097951 in PTHR43153, seeded only by human ETFA (P13804) and carrying
      no taxon constraint in the family PAINT file. The term is specific: GO defines it as beta-oxidation
      in which "the initial step of each oxidation cycle, which converts an acyl-CoA to a trans-2-enoyl-CoA,
      is catalyzed by acyl-CoA dehydrogenase". The phylogenetic reading does not support extending that
      partnership to every bacterial ETF alpha. The node spans bacterial ETFs dedicated to other donors
      (the family''s representative structure, 1o97, is the Methylophilus ETF partner of trimethylamine
      dehydrogenase), and the matching PAINT IBD in the beta-subunit family PTHR21294 (PTN000480319) is
      restricted to Eukaryota. PANTHER subfamily SF1 does not separate dedicated paralogs either: C. salexigens
      has two ETF alpha genes, Csal_0992 and Csal_1614, both in PTHR43153:SF1. Yet they are different
      paralogs: Csal_0992 is 65.5% identical to the KT2440 dgc-locus ETF alpha PP_0312 but only 32.6%
      identical to human ETFA (the PAINT seed), whereas Csal_1614 is 58.4% identical to human ETFA (file:PSEPK/PP_0312/PP_0312-bioinformatics/RESULTS.md).
      The gene-specific evidence points to a different donor: Csal_0992 is genetically required for dimethylglycine
      degradation to sarcosine, in a locus with the dehydrogenase ddhC and the ferredoxin Csal_0991, and
      the second pair Csal_1613-Csal_1614 cannot replace it in that pathway. That is positive evidence
      for a different assignment, but it does not show that EtfA cannot accept electrons from an acyl-CoA
      dehydrogenase. ETFs often serve several donors, and no test of EtfA with an acyl-CoA dehydrogenase
      has been reported. Marked over-annotated rather than removed, consistent with the PSEPK PP_0312
      ortholog review.'
    supported_by:
    - reference_id: PMID:32631860
      supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991,
        csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine.
    - reference_id: file:PSEPK/PP_0312/PP_0312-bioinformatics/RESULTS.md
      supporting_text: The dgc-locus ETF is therefore a distinct paralog group conserved between the two
        genera, not the ortholog of the human acyl-CoA-dehydrogenase ETF.
    - reference_id: file:CHRI1/etfA/etfA-uniprot.txt
      record_section:
      - CC:DISRUPTION PHENOTYPE
      supporting_text: Deletion mutant loses its ability to grow using DMG as the sole nitrogen source
        but is still capable of utilizing sarcosine and glycine as the sole nitrogen source.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002249443
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Graft node inheriting the PTHR43153 root-level GO:0033539 IBD (PTN000097951, seeded by
          human ETFA only); the target is a dimethylglycine-locus ETF paralog with genetic evidence for
          a different electron donor.
