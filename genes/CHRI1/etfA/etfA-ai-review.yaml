core_functions:
- description: FAD-binding alpha subunit of the EtfA-EtfB heterodimer encoded in the ddhC-Csal_0991-etfA-etfB
    dimethylglycine degradation locus. The ETF is thought to accept electrons from the dimethylglycine
    dehydrogenase system, probably via the ferredoxin Csal_0991, and pass them to an unidentified respiratory
    acceptor. The electron-transfer activity belongs to the heterodimer, and its donor and acceptor have
    not been shown biochemically.
  molecular_function:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  contributes_to_molecular_function:
    id: GO:0009055
    label: electron transfer activity
  supported_by:
  - reference_id: file:CHRI1/etfA/etfA-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Participates in the electron transfer process during N,N-dimethylglycine (DMG) degradation
      to sarcosine.
  - reference_id: PMID:32631860
    supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991,
      csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine.
  knowledge_gaps:
  - gap_statement: Whether EtfA-EtfB receives electrons directly from reduced Csal_0991 (or from DdhC),
      and which respiratory component reoxidizes it, is unknown.
    gap_kind:
    - BIOLOGY
    significance: This determines whether dimethylglycine oxidation is coupled to the quinone pool through
      a dedicated ETF relay.
proposed_new_terms: []
suggested_questions:
- question: Does EtfA-EtfB accept electrons from reduced Csal_0991 or directly from DdhC, and which quinone
    oxidoreductase reoxidizes it?
- question: Can the second C. salexigens ETF pair (Csal_1613-Csal_1614) serve acyl-CoA dehydrogenases
    while EtfA-EtfB is dedicated to dimethylglycine oxidation, or do the pairs overlap?
suggested_experiments:
- description: Reconstitute purified DdhC, Csal_0991 and EtfA-EtfB with dimethylglycine and follow ETF
    flavin reduction spectroscopically; test acyl-CoA dehydrogenase partners in parallel.
