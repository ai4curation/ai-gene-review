id: Q1QYV9
gene_symbol: etfA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:290398
  label: Chromohalobacter israelensis DSM 3043
description: EtfA (Csal_0992) is the alpha subunit of an electron-transfer flavoprotein (ETF) heterodimer
  of the halophilic gammaproteobacterium Chromohalobacter salexigens. It belongs to the ETF alpha-subunit/FixB
  family and is predicted to carry the FAD-binding domain of the heterodimer. The etfA gene lies in a
  four-gene locus with etfB, the N,N-dimethylglycine/sarcosine dehydrogenase gene ddhC and the membrane-anchored
  ferredoxin gene Csal_0991, and its deletion abolishes growth on dimethylglycine as sole nitrogen source
  while growth on sarcosine and glycine is retained. EtfA-EtfB is therefore thought to accept electrons
  generated during the conversion of dimethylglycine to sarcosine, most likely by way of the ferredoxin,
  and pass them to an unidentified respiratory acceptor. The organism encodes a second, separate EtfAB
  pair (Csal_1613-Csal_1614). Native genetic evidence comes from the DSM3043-derived rifampin-resistant
  strain ZW4-1; the ETF itself was not purified in that study.
