- term:
    id: GO:0031457
    label: glycine betaine catabolic process
  evidence_type: IMP
  original_reference_id: PMID:32631860
  qualifier: involved_in
  review:
    summary: EtfA is required for the dimethylglycine-to-sarcosine step of glycine betaine degradation,
      where the ETF acts as an electron acceptor.
    action: NEW
    reason: 'Disruption and complementation show that csal_0992 is required for dimethylglycine degradation
      to sarcosine. The mutant still uses sarcosine and glycine, which places the defect at this step
      of glycine betaine catabolism (glycine betaine to dimethylglycine to sarcosine to glycine). Participation
      test: the ETF does part of the work of the step, as the electron acceptor that reoxidizes the dehydrogenase
      system. This is the same role for which GO annotates ETF to acyl-CoA-dehydrogenase beta-oxidation
      (human ETFA and ETFB carry GO:0033539 by IDA), so the comparator convention exists. Necessity alone
      would not establish this; here the electron-carrier role is the conserved family function, and the
      authors'' interpretation and the Swiss-Prot function note both state it. GO has no dimethylglycine
      catabolic process term, and GO:0031457 is defined as "The chemical reactions and pathways resulting
      in the breakdown of glycine betaine, N-trimethylglycine." The same term is proposed on the sibling
      locus genes ddhC and Csal_0991. It is not treated as core because direct electron transfer has not
      been measured. The inferred electron-carrier participation is retained, but the exact native sequence
      of partners is a proposal; it is not a purified-relay result. Genetics used the ZW4-1 derivative.'
    supported_by:
    - reference_id: PMID:32631860
      supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991,
        csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine.
    - reference_id: file:CHRI1/etfA/etfA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Participates in the electron transfer process during N,N-dimethylglycine (DMG)
        degradation to sarcosine.
