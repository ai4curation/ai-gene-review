      supporting_text: Belongs to the ETF alpha-subunit/FixB family.
    - reference_id: PMID:32631860
      supporting_text: Our results suggested that the conversion of DMG to sarcosine is accompanied by
        intramolecular delivery of electrons in DMGDH and intermolecular electron transfer between DMGDH
        and other electron acceptors.
    - reference_id: PMID:8962055
      supporting_text: They function as electron shuttles between primary flavoprotein dehydrogenases
