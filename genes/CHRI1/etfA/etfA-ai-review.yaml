  review:
    summary: Electron transfer is the defining activity of the ETF heterodimer, and the C. salexigens
      locus genetics place EtfA in the electron-transfer route of dimethylglycine degradation.
    action: ACCEPT
    reason: 'Combined automated annotation (GO_REF:0000120) from the InterPro IPR001308 ETF alpha-subunit/FixB
      family mapping and the PANTHER node PTN002249443. Family membership is solid (InterPro, Pfam ETF_alpha,
      NCBIfam EtFlavAlphaProt, curated Swiss-Prot similarity note), and the ETF heterodimer is an electron
      carrier between flavoprotein dehydrogenases and respiratory acceptors (PMID:8962055 for the human
      ortholog). Gene-specific support comes from PMID:32631860: deletion of csal_0992 abolishes dimethylglycine-to-sarcosine
      conversion, and the authors infer intermolecular electron transfer from the dehydrogenase to other
      acceptors; Swiss-Prot curates this as participation in electron transfer during dimethylglycine
      degradation (ECO:0000269). Electron flow through EtfA has not been measured biochemically, but the
      function is the conserved family function and fits the genetics. As in the human ETFA review, the
      activity belongs to the heterodimer, so core_functions records it as contributes_to_molecular_function;
      this GOA row is accepted as the correct term.'
