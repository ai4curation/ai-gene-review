    action: MODIFY
    reason: >-
      This InterPro2GO row (GO_REF:0000002) comes from IPR009051 (alpha-helical
      ferredoxin), which maps only to the generic iron-sulfur cluster binding
      term. The record also matches two PROSITE 4Fe-4S ferredoxin-type motifs
      (PS00198, PS51379; PRU00711). The rule-based cofactor annotation places
      two [4Fe-4S] clusters per subunit, each ligated by four cysteines (binding
      sites at 250, 253, 256, 260, 328, 331, 334 and 338). UniProt's reaction for
      the partner DdhC names a 2[4Fe-4S] ferredoxin as the acceptor. The specific
      term GO:0051539 4 iron, 4 sulfur cluster binding is supported.
