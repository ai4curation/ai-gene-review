      This combined automated row (GO_REF:0000120) rests on the UniProt
      subcellular location "Cell inner membrane" (SL-0037, curator inference) and
      a PANTHER node. The sequence has five predicted alpha-helical
      transmembrane segments in residues 2-179. In a Gram-negative bacterium,
      alpha-helical multi-pass proteins sit in the cytoplasmic membrane, which
