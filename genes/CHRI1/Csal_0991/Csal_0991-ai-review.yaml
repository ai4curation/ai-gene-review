core_functions:
- description: >-
    Membrane-anchored 2[4Fe-4S] ferredoxin that accepts electrons from the
    cytoplasmic dimethylglycine dehydrogenase DdhC and is proposed to pass them
    to the EtfA/EtfB electron transfer flavoprotein during dimethylglycine
    demethylation to sarcosine in glycine betaine catabolism.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  directly_involved_in:
