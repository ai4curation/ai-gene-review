    label: glycine betaine catabolic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:CHRI1/Csal_0991/Csal_0991-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Probably transfers the electrons from N,N-dimethylglycine/sarcosine dehydrogenase (DMGDH) to the electron transfer
      flavoprotein (ETF) EtfA-EtfB (PubMed:32631860).
  - reference_id: PMID:32631860
    supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991, csal_0992, and csal_0993
      genes are responsible for DMG degradation to sarcosine
  knowledge_gaps:
  - gap_statement: >-
      Direct electron transfer from DdhC to Csal_0991, and from reduced
      Csal_0991 to the EtfA/EtfB heterodimer, has not been measured. Csal_0991 has
      not been purified, and the redox potentials of its two [4Fe-4S] clusters
      are unknown. It is also unknown whether the five-helix membrane domain
      (DUF3483) only anchors the protein or also exchanges electrons with a
      membrane quinone pool.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Without these measurements, the DdhC to ferredoxin to ETF relay that
      defines EC 1.5.7.3 remains a mechanistic proposal, and so does the fate of
      the electrons beyond ETF.
suggested_questions:
- question: >-
    Does the membrane domain of Csal_0991 (DUF3483) take part in electron
    transfer, for example to ubiquinone, or does it only tether the ferredoxin
    domain near the ETF and its membrane partner?
suggested_experiments:
- description: >-
    Express and purify Csal_0991 in detergent, reconstitute its [4Fe-4S]
    clusters, and measure electron transfer from dimethylglycine-reduced DdhC to
    Csal_0991 and from reduced Csal_0991 to purified EtfA/EtfB by EPR and
    stopped-flow spectroscopy.
  experiment_type: in vitro reconstitution
