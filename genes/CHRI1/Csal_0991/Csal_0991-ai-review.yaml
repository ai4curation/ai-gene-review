taxon:
  id: NCBITaxon:290398
  label: Chromohalobacter israelensis DSM 3043
description: >-
  Csal_0991 is a 670-residue membrane-anchored iron-sulfur protein of
  Chromohalobacter salexigens DSM 3043 (now C. israelensis). It has five
  N-terminal transmembrane helices, a DUF3483 (Csal_0991-like) N-terminal
  region, and a cytoplasmic alpha-helical ferredoxin domain with two
  4Fe-4S ferredoxin-type motifs and two cysteine-rich CCG domains. It is encoded
  between the dimethylglycine dehydrogenase gene ddhC (Csal_0990) and the
  etfB/etfA genes (Csal_0992/Csal_0993), and is required for growth on
  N,N-dimethylglycine as the sole nitrogen source but not on sarcosine or
  glycine. It is proposed to accept electrons from DdhC at the cytoplasmic face
  of the inner membrane and pass them to the electron transfer flavoprotein
  during dimethylglycine demethylation to sarcosine, a step of glycine betaine
  catabolism. Direct electron transfer between the purified proteins has not
  been demonstrated.
