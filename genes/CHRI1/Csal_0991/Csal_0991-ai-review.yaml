- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IC
  original_reference_id: PMID:32631860
  qualifier: enables
  review:
    summary: >-
      Csal_0991 is the proposed membrane-bound ferredoxin that carries electrons
      from the dimethylglycine dehydrogenase DdhC to the ETF.
    action: NEW
    reason: >-
      GOA has no molecular function row for this protein other than generic
      iron-sulfur binding. Several lines point to electron transfer as its
      activity. Its gene is required for dimethylglycine degradation to sarcosine.
      It carries two [4Fe-4S] clusters and no catalytic domain. The reviewed
      UniProt entry, curated from PMID:32631860, describes it as the electron
      carrier between DdhC and EtfA-EtfB. The DdhC reaction is curated as
      EC 1.5.7.3 with a 2[4Fe-4S] ferredoxin acceptor, in which reduced Csal_0991
      is a product. The evidence code is IC because transfer between purified
      proteins has not been shown; the claim rests on gene requirement, cofactor
      content and the proposed mechanism.
    supported_by:
    - reference_id: file:CHRI1/Csal_0991/Csal_0991-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Participates in the electron transfer process during N,N-dimethylglycine (DMG) degradation to sarcosine
        (PubMed:32631860).'
    - reference_id: file:CHRI1/Csal_0991/Csal_0991-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Probably transfers the electrons from N,N-dimethylglycine/sarcosine dehydrogenase (DMGDH) to the electron transfer
        flavoprotein (ETF) EtfA-EtfB (PubMed:32631860).
    - reference_id: PMID:32631860
      supporting_text: intermolecular electron transfer between DMGDH and other electron acceptors
- term:
    id: GO:0031457
    label: glycine betaine catabolic process
  evidence_type: IMP
  original_reference_id: PMID:32631860
  qualifier: involved_in
  review:
    summary: >-
      Csal_0991 is required for the dimethylglycine-to-sarcosine step of glycine
      betaine degradation, in which it acts as the electron acceptor of DdhC.
    action: NEW
    reason: >-
      Disruption and complementation show that csal_0991 is needed for
      dimethylglycine degradation to sarcosine. The mutant still grows on
      sarcosine and glycine, which places the defect at this step. On the
      participation test, Csal_0991 does part of the work of the step: as the
      2[4Fe-4S] electron acceptor in the EC 1.5.7.3 reaction it reoxidizes DdhC,
      in the same way that ETF is the electron acceptor for acyl-CoA
      dehydrogenases in beta-oxidation. GO:0031457 is defined as "The chemical
      reactions and pathways resulting in the breakdown of glycine betaine,
      N-trimethylglycine". GO has no dimethylglycine catabolic process term.
    supported_by:
    - reference_id: PMID:32631860
      supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991, csal_0992, and csal_0993
        genes are responsible for DMG degradation to sarcosine
    - reference_id: file:CHRI1/Csal_0991/Csal_0991-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: Deletion mutant loses its ability to grow using DMG as the sole nitrogen source but is still capable of utilizing
        sarcosine and glycine as the sole nitrogen source.
