      Recombinant DdhC is an active monomeric FAD-containing dimethylglycine
      dehydrogenase that also acts on sarcosine and uses NAD+ or NADP+, preferring
      NAD+.
    supporting_text: The enzyme, existing as a monomer of 79 kDa with a noncovalently bound flavin adenine dinucleotide, utilized both
