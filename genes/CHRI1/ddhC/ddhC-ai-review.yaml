core_functions:
- description: >-
    Cytoplasmic FAD-containing dehydrogenase that oxidatively demethylates
    N,N-dimethylglycine to sarcosine and formaldehyde (and, in vitro, sarcosine
    to glycine). Electrons pass through FAD and enzyme-bound NAD(P) to the
    membrane-anchored 2[4Fe-4S] ferredoxin Csal_0991, and from there to the
    pathway ETF (EC 1.5.7.3). In vivo its role is the dimethylglycine step of
    glycine betaine catabolism; sarcosine is also degraded by other enzymes.
    GO has no term for EC 1.5.7.3 itself; the exact activity is proposed as
    "N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin) activity" (see
    proposed_new_terms), a child of the term used here.
  molecular_function:
    id: GO:0033694
    label: oxidoreductase activity, acting on the CH-NH group of donors, iron-sulfur protein as acceptor
  directly_involved_in:
  - id: GO:0031457
    label: glycine betaine catabolic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:32631860
    supporting_text: The csal_0990 gene heterologously expressed in Escherichia coli was proven to encode an unusual DMG dehydrogenase
      (DMGDH).
  - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: 'Reaction=oxidized 2[4Fe-4S]-[ferredoxin] + N,N-dimethylglycine + H2O ='
  knowledge_gaps:
  - gap_statement: >-
      The immediate electron acceptor of DdhC in vivo has not been shown
      directly. The enzyme was assayed with NAD+ or NADP+, and transfer to the
      membrane-anchored ferredoxin Csal_0991 rests on gene disruption and a
      proposed mechanism, not on reconstitution with purified Csal_0991. Whether
      NAD(P) stays bound as an internal relay or is released as free NAD(P)H is
      also unresolved.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Which acceptor DdhC reduces decides whether EC 1.5.7.3 (ferredoxin) or an
      NAD(P)-linked dehydrogenase describes the reaction, and whether ETF
      reoxidizes the ferredoxin rather than DdhC directly.
proposed_new_terms:
- proposed_name: N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin) activity
  proposed_definition: >-
    Catalysis of the reactions: N,N-dimethylglycine + H2O + oxidized
    2[4Fe-4S]-[ferredoxin] = sarcosine + formaldehyde + reduced
    2[4Fe-4S]-[ferredoxin] + 2 H+, and sarcosine + H2O + oxidized
    2[4Fe-4S]-[ferredoxin] = glycine + formaldehyde + reduced
    2[4Fe-4S]-[ferredoxin] + 2 H+.
  justification: >-
    EC 1.5.7.3 and RHEA:74167/RHEA:74155 describe the DdhC reaction, but GO has
    no corresponding term. The only dimethylglycine and sarcosine dehydrogenase
    terms (GO:0047865, EC:1.5.8.4; GO:0008480, EC:1.5.8.3) are defined with
    electron-transfer flavoprotein as the acceptor. The closest existing term
    is the generic parent GO:0033694, which names neither substrate.
  proposed_parent:
    id: GO:0033694
    label: oxidoreductase activity, acting on the CH-NH group of donors, iron-sulfur protein as acceptor
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: EC:1.5.7.3
      label: N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin)
  - predicate: skos:narrowMatch
    target_term:
      id: RHEA:74167
      label: oxidized 2[4Fe-4S]-[ferredoxin] + N,N-dimethylglycine + H2O = reduced 2[4Fe-4S]-[ferredoxin] + sarcosine + formaldehyde
        + 2 H(+)
  - predicate: skos:narrowMatch
    target_term:
      id: RHEA:74155
      label: oxidized 2[4Fe-4S]-[ferredoxin] + sarcosine + H2O = reduced 2[4Fe-4S]-[ferredoxin] + glycine + formaldehyde + 2 H(+)
  supported_by:
  - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: 'Reaction=oxidized 2[4Fe-4S]-[ferredoxin] + N,N-dimethylglycine + H2O ='
  - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: 'Reaction=oxidized 2[4Fe-4S]-[ferredoxin] + sarcosine + H2O = reduced'
  - reference_id: PMID:32631860
    supporting_text: utilized both DMG and sarcosine as substrates
suggested_questions:
- question: >-
    Is NAD(P) a tightly bound internal electron carrier in DdhC, as the curated
    mechanism proposes, or a diffusible co-substrate whose NAD(P)H is reoxidized
    elsewhere?
- question: >-
    Should GO add an EC 1.5.7.3 child of GO:0033694 for the ferredoxin-linked
    dimethylglycine/sarcosine dehydrogenase, given that GO:0047865 and
    GO:0008480 are ETF-specific?
- question: >-
    Does the sarcosine-demethylating activity measured in vitro contribute to
    sarcosine catabolism in vivo, given that ddhC mutants still use sarcosine as
    a nitrogen source?
suggested_experiments:
- description: >-
    Reconstitute purified DdhC with detergent-solubilized or
    proteoliposome-embedded Csal_0991 and the Csal_0992/Csal_0993 ETF, and follow reduction of
    the ferredoxin [4Fe-4S] clusters and of ETF by EPR or UV-visible
    spectroscopy during dimethylglycine oxidation, with and without added
    NAD(P)+.
  experiment_type: in vitro reconstitution
- description: >-
    Determine bound cofactor stoichiometry (FAD, FMN, NAD(P)) by HPLC of the
    released flavins and nucleotides from purified DdhC, to settle whether the
    Old Yellow Enzyme-type TIM barrel carries FMN.
  experiment_type: biochemical cofactor analysis
