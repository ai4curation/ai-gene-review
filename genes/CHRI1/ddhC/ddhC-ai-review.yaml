      csal_0990 (ddhC), csal_0991 (membrane ferredoxin) and csal_0992/csal_0993
      (ETF subunits) are each required for conversion of dimethylglycine to
      sarcosine.
    supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991, csal_0992, and csal_0993
