proposed_new_terms:
- proposed_name: N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin) activity
  proposed_definition: 'Catalysis of the reactions: N,N-dimethylglycine + H2O + oxidized 2[4Fe-4S]-[ferredoxin]
    = sarcosine + formaldehyde + reduced 2[4Fe-4S]-[ferredoxin] + 2 H+, and sarcosine + H2O + oxidized
    2[4Fe-4S]-[ferredoxin] = glycine + formaldehyde + reduced 2[4Fe-4S]-[ferredoxin] + 2 H+.'
  justification: Conditional term proposal matching curated EC1.5.7.3 chemistry, retained from the original
    review. Its application to DdhC depends on the hypothesized ferredoxin acceptor, which has not been
    assayed directly. The established core is therefore the acceptor-unspecified CH-NH oxidoreductase
    activity; the proposed term is not an assertion that the native relay has been demonstrated.
