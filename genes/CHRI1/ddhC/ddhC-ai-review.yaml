    label: glycine betaine catabolic process
  evidence_type: IMP
  original_reference_id: PMID:32631860
  qualifier: involved_in
  review:
    summary: >-
      DdhC catalyses the dimethylglycine-to-sarcosine step of glycine betaine
      degradation, and its disruption abolishes growth on dimethylglycine as the
      sole nitrogen source.
    action: NEW
    reason: >-
      DdhC performs the second demethylation step of glycine betaine catabolism
      (glycine betaine to dimethylglycine to sarcosine to glycine). It passes the
      participation test: it catalyses the step, as shown by direct assays of the
      purified enzyme. Disruption and complementation show that the step needs it
      in vivo. GO has no dimethylglycine catabolic process term. GO:0031457 is
      defined as "The chemical reactions and pathways resulting in the breakdown
      of glycine betaine, N-trimethylglycine." The UniProt function line states
      the same pathway role.
    supported_by:
