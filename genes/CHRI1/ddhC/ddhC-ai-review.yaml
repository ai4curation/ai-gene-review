- term:
    id: GO:0010181
    label: FMN binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001155
  review:
    summary: >-
      FMN binding is inferred only from the N-terminal Old Yellow Enzyme-type
      TIM-barrel fold. The flavin identified in the purified enzyme is
      noncovalently bound FAD, and the reviewed entry lists FAD and NAD(P)+, not
      FMN, as cofactors.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This InterPro2GO row (GO_REF:0000002) maps IPR001155 (NADH:flavin
      oxidoreductase/NADH oxidase N-terminal domain) to FMN binding. That holds for
      classical Old Yellow Enzyme family members, but it is a fold-level
      inference. For DdhC the direct biochemistry identifies the bound flavin as
      noncovalent FAD. The curated UniProt cofactor lines, written from the full
      text of PMID:32631860, list FAD and NAD(P)+ but no FMN. The cached
      publication is abstract-only, so a weakly bound FMN lost during
      purification cannot be excluded, and FMN binding is not shown to be wrong.
      With FAD as the only demonstrated flavin, FMN binding is most likely an
      over-annotation. FAD binding is proposed as a NEW row below.
    supported_by:
    - reference_id: PMID:32631860
      supporting_text: existing as a monomer of 79 kDa with a noncovalently bound flavin adenine dinucleotide
