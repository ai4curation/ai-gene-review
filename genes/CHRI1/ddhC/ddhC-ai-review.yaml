  label: Chromohalobacter israelensis DSM 3043
description: DdhC (Csal_0990) is a soluble FAD-containing dimethylglycine dehydrogenase of Chromohalobacter
  israelensis DSM3043, historically named C. salexigens. The recombinant monomer oxidizes both dimethylglycine
  and sarcosine in dye-linked assays and requires NAD+ or NADP+ in the tested PMS/DCPIP system, with NAD+
  preferred. Dimethylglycine demethylation produces sarcosine and formaldehyde. Genetics places DdhC in
  dimethylglycine utilization; retained sarcosine growth in mutants indicates additional sarcosine-degrading
  enzymes. The adjacent membrane-associated iron-sulfur protein Csal_0991 and EtfA/EtfB are proposed physiological
  electron-transfer partners, but the native relay has not been reconstituted.
