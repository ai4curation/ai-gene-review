- id: PMID:32631860
  title: Role of N,N-Dimethylglycine and Its Catabolism to Sarcosine in Chromohalobacter salexigens DSM
    3043.
  findings:
  - statement: csal_0990 (ddhC), csal_0991 (membrane ferredoxin) and csal_0992/csal_0993 (ETF subunits)
      are each required for conversion of dimethylglycine to sarcosine.
    supporting_text: gene disruption and complementation assays indicated that the csal_0990, csal_0991,
      csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine
  - statement: Recombinant DdhC is an active monomeric FAD-containing dimethylglycine dehydrogenase that
      also acts on sarcosine and uses NAD+ or NADP+, preferring NAD+.
    supporting_text: The enzyme, existing as a monomer of 79 kDa with a noncovalently bound flavin adenine
      dinucleotide, utilized both DMG and sarcosine as substrates and exhibited dual coenzyme specificity,
      preferring NAD+ to NADP+
  - statement: The authors propose electron flow within DdhC and onward to other electron acceptors rather
      than a free NAD(P)H product.
    supporting_text: the conversion of DMG to sarcosine is accompanied by intramolecular delivery of electrons
      in DMGDH and intermolecular electron transfer between DMGDH and other electron acceptors
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text recovered by normal force-fetch. Genetics used DSM3043-derived rifampin-resistant
      ZW4-1; purified DdhC was N-His6-tagged and expressed in E. coli. Dye-linked dual-substrate activity
      is direct, whereas the native ferredoxin/ETF relay and bound-NAD(P) mechanism remain proposed.
