- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001155
  - InterPro:IPR023753
  review:
    summary: >-
      Correct but very general. DdhC is a characterized CH-NH-oxidizing
      demethylase whose curated reaction (EC 1.5.7.3, RHEA:74167 and RHEA:74155)
      uses an oxidized 2[4Fe-4S] ferredoxin as the electron acceptor.
    action: MODIFY
    reason: >-
      This InterPro2GO row (GO_REF:0000002, from IPR001155 and IPR023753) gives
      only the root oxidoreductase term. Direct assays show that DdhC demethylates
      N,N-dimethylglycine and sarcosine and releases formaldehyde. UniProt curates
      both reactions as EC 1.5.7.3 with a 2[4Fe-4S] ferredoxin acceptor,
      identified as the adjacent membrane-anchored ferredoxin Csal_0991. The
      existing GO term that matches this chemistry is GO:0033694 (oxidoreductase
      activity, acting on the CH-NH group of donors, iron-sulfur protein as
      acceptor; EC:1.5.7.-), defined as "Catalysis of an oxidation-reduction
      (redox) reaction in which a CH-NH group acts as a hydrogen or electron
      donor and reduces an iron-sulfur protein."

      The substrate-specific GO terms do not fit. GO:0047865 dimethylglycine
      dehydrogenase activity (EC:1.5.8.4) is defined with electron-transfer
      flavoprotein as the direct acceptor. GO:0008480 sarcosine dehydrogenase
      activity (EC:1.5.8.3) is also ETF-linked. In the curated DdhC mechanism ETF
      sits downstream of Csal_0991 rather than accepting from DdhC.

      The in vitro assays used NAD+ or NADP+ (dual coenzyme specificity). UniProt
      and the EC entry treat these as enzyme-bound cofactors that are reoxidized
      by the ferredoxin, not as the terminal acceptor, so GO:0016646 (NAD or NADP
      as acceptor) is not proposed. Direct reduction of purified Csal_0991 by DdhC
      has not been shown (see knowledge_gaps).

      The replacement is GO:0033694 now, plus a new
      substrate-specific child term matching EC 1.5.7.3 (proposed_new_terms).
    proposed_replacement_terms:
    - id: GO:0033694
      label: oxidoreductase activity, acting on the CH-NH group of donors, iron-sulfur protein as acceptor
    - id: NTR
      label: N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin) activity
    supported_by:
    - reference_id: PMID:32631860
      supporting_text: utilized both DMG and sarcosine as substrates and exhibited dual coenzyme specificity, preferring NAD+ to NADP+
