suggested_questions:
- question: Is NAD(P) a tightly bound internal electron carrier in DdhC, as the curated mechanism proposes,
    or a diffusible co-substrate whose NAD(P)H is reoxidized elsewhere?
- question: Should GO add an EC 1.5.7.3 child of GO:0033694 for the ferredoxin-linked dimethylglycine/sarcosine
    dehydrogenase, given that GO:0047865 and GO:0008480 are ETF-specific?
- question: Does the sarcosine-demethylating activity measured in vitro contribute to sarcosine catabolism
    in vivo, given that ddhC mutants still use sarcosine as a nitrogen source?
suggested_experiments:
- description: Reconstitute purified DdhC with detergent-solubilized or proteoliposome-embedded Csal_0991
    and the Csal_0992/Csal_0993 ETF, and follow reduction of the ferredoxin [4Fe-4S] clusters and of ETF
    by EPR or UV-visible spectroscopy during dimethylglycine oxidation, with and without added NAD(P)+.
  experiment_type: in vitro reconstitution
- description: Determine bound cofactor stoichiometry (FAD, FMN, NAD(P)) by HPLC of the released flavins
    and nucleotides from purified DdhC, to settle whether the Old Yellow Enzyme-type TIM barrel carries
    FMN.
  experiment_type: biochemical cofactor analysis
