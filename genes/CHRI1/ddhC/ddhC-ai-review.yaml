  - statement: >-
      The authors propose electron flow within DdhC and onward to other electron
      acceptors rather than a free NAD(P)H product.
    supporting_text: the conversion of DMG to sarcosine is accompanied by intramolecular delivery of electrons in DMGDH and intermolecular
      electron transfer between DMGDH and other electron acceptors
