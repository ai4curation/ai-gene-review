      supporting_text: 'Reaction=oxidized 2[4Fe-4S]-[ferredoxin] + sarcosine + H2O = reduced'
    - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Regeneration of NAD(P)(+) is achieved by electron transfer to the [4Fe-4S] cluster in the probable membrane-anchored
        ferredoxin csal_0991
