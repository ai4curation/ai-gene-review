id: Q1QYW1
gene_symbol: ddhC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:290398
  label: Chromohalobacter israelensis DSM 3043
description: >-
  DdhC (Csal_0990) is a soluble cytoplasmic N,N-dimethylglycine dehydrogenase of
  the moderately halophilic bacterium Chromohalobacter salexigens DSM 3043
  (now C. israelensis). It has an N-terminal TIM-barrel domain of the
  NADH:flavin oxidoreductase (Old Yellow Enzyme) family fused to a C-terminal
  FAD/NAD(P)-binding domain. The purified recombinant enzyme is an active 79 kDa
  monomer with noncovalently bound FAD. It oxidatively demethylates both
  N,N-dimethylglycine and sarcosine, releasing formaldehyde, and accepts NAD+ or
  NADP+, preferring NAD+. The proposed physiological electron acceptor is the
  membrane-anchored 2[4Fe-4S] ferredoxin Csal_0991, encoded next to ddhC and
  thought to pass electrons to the electron transfer flavoprotein encoded
  downstream (EC 1.5.7.3). ddhC, Csal_0991 and the two ETF genes are each
  required for growth on dimethylglycine as the sole nitrogen source. The step
  links glycine betaine catabolism to sarcosine. Mutants still grow on sarcosine,
  so sarcosine is also degraded by other enzymes in vivo.
