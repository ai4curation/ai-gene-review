- id: file:PICAN/AMO/AMO-uniprot.txt
  title: UniProt entry P12807 (AMO_PICAN)
  findings:
  - statement: UniProt places AMO in PANTHER subfamily PTHR10638:SF86.
    record_section: ["DR:PANTHER"]
    supporting_text: 'DR   PANTHER; PTHR10638:SF86; COPPER AMINE OXIDASE 1-RELATED; 1.'
suggested_questions:
- question: Does an amo deletion strain of H. polymorpha fail to grow on methylamine or
    ethylamine as sole nitrogen source, or can HPAO-2 compensate? No published deletion
    phenotype was found, so the role in nitrogen assimilation rests on induction, localization
    and enzymology.
- question: The UniProt MOTIF 690..692 "Microbody targeting signal" (ECO:0000255) conflicts with
    in vivo evidence that the C-terminal SRL is dispensable and that an N-terminal PTS2 directs
    import (PMID:8511963, PMID:7805876). Should the record be revised to annotate the N-terminal PTS2?
- question: Which H. polymorpha copper amine oxidase (AMO/HPAO-1 or HPAO-2) carries out the
    peroxisomal amine oxidation seen during choline and ethanolamine degradation?
suggested_experiments:
- description: Delete AMO and HPAO-2 singly and together in H. polymorpha, then measure growth on
    methylamine, ethylamine, benzylamine and choline as sole nitrogen source, with
    complementation by wild-type and D319N AMO.
  experiment_type: genetic
- description: Map the PTS2 within the first 16 residues of AMO by point mutation of the
    consensus residues, and test Pex7 dependence of import in pex7 cells.
  experiment_type: cell biology
