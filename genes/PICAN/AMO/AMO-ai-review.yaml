  review:
    summary: >-
      AMO is a primary amine oxidase (EC 1.4.3.21) that converts methylamine and other small
      primary amines, with O2, to aldehyde, ammonia and H2O2. This paper characterises the
      cofactor-containing catalytic domain of the active recombinant enzyme.
    action: ACCEPT
    reason: >-
      This is the core activity of AMO and has extensive experimental support from the protein
      of this species. UniProt credits this paper (ECO:0000269) for the catalytic activity.
      The cached abstract is limited to the cofactor-bearing proteolytic fragment, so the
      curator's EXP reading of the full text is not overruled. Independent papers confirm the
      activity: the native enzyme oxidises methylamine to ammonia, formaldehyde and H2O2
      [PMID:7192080], the recombinant quinoprotein is as active as the native enzyme
      [PMID:8011631], and kinetic studies give kcat values for methylamine, ethylamine and
      benzylamine [PMID:17409383; PMID:20684524; PMID:23452079]. The family-root PAINT IBD
      for this term (PTN000067313) agrees.
    supported_by:
    - reference_id: PMID:7556609
      supporting_text: The fragment is proposed to be the domain responsible for cofactor production
        in yeast amine oxidase.
    - reference_id: PMID:7192080
      supporting_text: The enzyme catalyses the oxidation of methylamine by molecular oxygen
        into ammonia, formaldehyde and hydrogen peroxide
    - reference_id: PMID:8011631
      supporting_text: The recombinant enzyme is as active as the native enzyme in catalyzing
        methylamine oxidation.
