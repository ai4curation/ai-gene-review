      was located in the microbodies in both organisms.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native-enzyme physiology and localization from 1980, before the gene was
      cloned. The methylamine-oxidising activity of methylamine-grown cells is attributed to
      AMO (HPAO-1). The paralog HPAO-2 prefers benzylamine (PMID:20155950), which supports
