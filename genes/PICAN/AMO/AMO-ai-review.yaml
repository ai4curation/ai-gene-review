  review:
    summary: >-
      AMO is a peroxisomal matrix enzyme in its native host. Cytochemistry places amine oxidase
      activity in peroxisomes of methylamine-grown cells, and targeting studies show that an
      N-terminal PTS2 signal imports AMO into the matrix. The more specific compartment is
      therefore supported.
    action: MODIFY
    reason: >-
      The annotation is correct but less specific than the evidence. Native-host experiments
      show that AMO is a peroxisomal matrix protein [PMID:8511963], that its N-terminal
      16 residues direct a reporter to the peroxisomal matrix [PMID:7805876], and that
      its activity sits in catalase-containing microbodies [PMID:7192080]. Replace with
      GO:0005782 peroxisomal matrix, a part_of descendant of peroxisome. The C-terminal SRL
      (UniProt MOTIF 690..692, ECO:0000255) is not needed for targeting [PMID:8511963], so
      the localization rests on the PTS2 signal. The enzyme is cytosolic when expressed in
      S. cerevisiae [PMID:20155950]. That is a heterologous artefact and does not apply to
      the native host.
    proposed_replacement_terms:
    - id: GO:0005782
      label: peroxisomal matrix
    supported_by:
    - reference_id: PMID:8511963
      supporting_text: Amine oxidase (AMO) is a peroxisomal matrix protein of Hansenula polymorpha,
        which is induced during growth of the yeast in media containing primary amines as
