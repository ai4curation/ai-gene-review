    - reference_id: PMID:7805876
      supporting_text: Moreover, this sequence can direct a reporter protein to the peroxisomal
        matrix of H. polymorpha.
    - reference_id: PMID:7192080
      supporting_text: Cytochemical staining experiments indicated that the amine oxidase activity
        was located in the microbodies in both organisms.
- term:
