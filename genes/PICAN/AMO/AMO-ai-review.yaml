  review:
    summary: >-
      Copper binding is established directly for AMO. Crystal structures of the mature enzyme
      show one type 2 copper per subunit coordinated by His456, His458 and His624. Copper is
      required both for catalysis and for self-catalysed TPQ biogenesis.
    action: ACCEPT
    reason: >-
      The electronic row agrees with experimental structural evidence on this protein
      [PMID:9551552; PMID:22691777]. A proteolytic C-terminal fragment that keeps copper
      and TOPA confirms that the metal is bound by the catalytic domain [PMID:7556609]. The
      family-root PAINT IBD for copper ion binding (PTN000067313) also covers SF86. Copper
      binding is a cofactor requirement of the core amine oxidase activity, so it is kept
      as a supporting part of that core function and not as a separate core activity.
