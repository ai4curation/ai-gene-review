      supporting_text: The fragment contains both TOPA (2,4,5-trihydroxyphenylalanine) and
        copper, as well as the histidine ligands implicated in copper binding.
    - reference_id: PMID:22691777
      supporting_text: TPQ is synthesized through the post-translational modification of an
        endogenous tyrosine residue and requires only oxygen and copper to proceed.
