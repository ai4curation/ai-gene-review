  label: Ogataea angusta
description: >-
  AMO (also called HPAO or HPAO-1) is the peroxisomal copper amine oxidase of the
  methylotrophic yeast Hansenula polymorpha (Ogataea angusta). It is a homodimeric
  quinoprotein of 692 residues in the copper amine oxidase family (PANTHER PTHR10638,
  subfamily SF86) that oxidatively deaminates small primary aliphatic amines, chiefly
  methylamine and ethylamine, using O2 to give the aldehyde, ammonia and hydrogen
  peroxide. Each subunit carries a type 2 copper ion held by three histidines
  (His456, His458, His624) and a topaquinone (TPQ) cofactor generated by
  copper- and oxygen-dependent self-oxidation of Tyr405; Asp319 is the catalytic base.
  The enzyme is induced when primary amines are the sole nitrogen source and is
  imported into the peroxisomal matrix through an N-terminal PTS2-type signal. There it
  catalyses the first step of methylamine use as a nitrogen source, releasing ammonia
  together with formaldehyde and H2O2, which peroxisomal catalase removes. A paralogous
  enzyme, HPAO-2, prefers aromatic amines. AMO is one of the most thoroughly studied
  copper amine oxidases structurally and mechanistically, from TPQ biogenesis to O2
  access channels and substrate specificity.
