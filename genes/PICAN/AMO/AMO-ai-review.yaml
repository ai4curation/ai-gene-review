  review:
    summary: >-
      AMO takes part in amine metabolism by catalysing its first, oxidative step: it degrades
      methylamine (and other small primary amines) to formaldehyde, ammonia and H2O2. For this
      enzyme the specific process is methylamine metabolism, a catabolic route that lets the
      cell use amines as a nitrogen source.
    action: MODIFY
    reason: >-
      The term is correct but general. The family-root PAINT IBD (PTN000067313) places it at
      this broad level for the whole heterogeneous family. For AMO, species-specific evidence
      supports the more specific descendants. AMO is the key enzyme of methylamine metabolism
      in H. polymorpha [PMID:7192080], is induced by primary amines as sole nitrogen source
      [PMID:8511963], and itself catalyses the deamination step, so it does the work of the
      process. Replace with GO:0030416 methylamine metabolic process (is_a amine metabolic
      process) and GO:0009310 amine catabolic process (is_a amine metabolic process).
    proposed_replacement_terms:
    - id: GO:0030416
      label: methylamine metabolic process
    - id: GO:0009310
      label: amine catabolic process
    supported_by:
    - reference_id: PMID:7192080
      supporting_text: it is considered to be the key enzyme in methylamine metabolism in the
        organisms studied
    - reference_id: PMID:8511963
      supporting_text: which is induced during growth of the yeast in media containing primary
        amines as a sole nitrogen source
- term:
    id: GO:0048038
    label: quinone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000269
  - InterPro:IPR015798
  - InterPro:IPR015800
  - InterPro:IPR015802
  - InterPro:IPR016182
  - InterPro:IPR036460
  review:
    summary: >-
      This InterPro2GO mapping refers to the topaquinone cofactor. In AMO the TPQ is Tyr405 of
      the polypeptide itself, oxidised in place, and not an exogenous quinone that the enzyme
      binds.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Structures of the precursor and mature enzyme show that TPQ forms by copper- and
      O2-dependent self-oxidation of an endogenous tyrosine (Tyr405)
      [PMID:22691777; PMID:10933787; PMID:16245947]. No free quinone ligand is known to bind
      AMO. Quinone binding therefore describes a covalent cofactor residue as a binding
      activity and adds nothing beyond primary methylamine oxidase activity. GO has no
      current process term for topaquinone biogenesis (the peptidyl-topaquinone terms are
      obsolete). The row is kept flagged and not removed because the mapping reflects real
      quinone chemistry in the active site.
    supported_by:
    - reference_id: PMID:22691777
      supporting_text: TPQ is synthesized through the post-translational modification of an
        endogenous tyrosine residue and requires only oxygen and copper to proceed.
    - reference_id: PMID:16245947
      supporting_text: is generated from the post-translational modification of an active site
        tyrosine (Y405) in a reaction shown to be dependent on both molecular oxygen and a
        mononuclear copper center
core_functions:
- description: >-
    Copper- and topaquinone-dependent oxidative deamination of small primary aliphatic amines
    (methylamine, ethylamine) to aldehyde, ammonia and H2O2 in the peroxisomal matrix. This is
    the first step of methylamine use as a nitrogen source in H. polymorpha. Activity, cofactor
    content, copper ligands, catalytic base and substrate preferences have been established
    experimentally on the AMO protein itself, mostly as recombinant enzyme. Peroxisomal matrix
    localization and induction by amines were shown in the native host.
  molecular_function:
    id: GO:0008131
    label: primary methylamine oxidase activity
