- id: PMID:7192080
  title: Development of amine oxidase-containing peroxisomes in yeasts during growth
    on glucose in the presence of methylamine as the sole source of nitrogen.
  findings:
  - statement: Amine oxidase is induced on methylamine as nitrogen source, oxidises methylamine
      to ammonia, formaldehyde and H2O2, and is located in catalase-containing peroxisomes.
