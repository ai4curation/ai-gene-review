  review:
    summary: Flagellar-component localization exceeds the evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: The InterPro IPR007439 mapping transfers a flagellum location from a signaling role.
      CheY-P dephosphorylation and regulation of motor behavior do not establish incorporation
      into the filament, hook or basal body. This exact CMCP6 protein was not localized in PMID41495260,
