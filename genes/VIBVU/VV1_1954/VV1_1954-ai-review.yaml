knowledge_gaps:
- gap_statement: The quantitative and spatial division of CheX/CheZ signaling in strain CMCP6
    is not established by the ATCC27562 experiments.
  boundary: Both genes occur in the CMCP6 reference genome. The CMCP6 VV1_1397 protein was crystallized,
    while native behavioral assays and the functional protein-preparation workflow are ATCC27562.
    The polar-CheZ/cytoplasmic-CheX division is partly a model rather than demonstrated CMCP6
    localization.
