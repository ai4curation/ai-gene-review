  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected. Current records are CMCP6, taxon 216895, proteome
      UP000002275, chromosome AE016795/NC_004459.3. VV1_1397 is the explicitly named CMCP6 crystallization
      gene (AAO09846.2; 6VPW). Its structure entity contains residues 2-153 of the target with
      the initiator methionine absent and an SNA construct prefix preceding native Arg2; the
      mapped target sequence is preserved. VV1_1954 is the CheZ-family locus AAO10354.1 in the
      same genome. It has PIRNR002884 and PIRSR002884-1 support independent of ARBA. The paper
      explicitly states ATCC27562 for its native strains; its non-crystallization protein preparation
      and CheY3 dephosphorylation assays follow that workflow. No claim of identical ATCC27562
      and CMCP6 sequences is made. CheX L65R/L67P suppressors reduce protein abundance and do
      not by themselves identify catalytic residues. CheX co-immunoprecipitates with CheY3,
      but no generic protein-binding proposal is needed. Genomic coexistence is evidence about
      these actual loci; the broader taxonomic survey is not used to claim every bacterial lineage
      has both phosphatases.
