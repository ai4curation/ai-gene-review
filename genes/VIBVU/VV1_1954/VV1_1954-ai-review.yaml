  label: Vibrio vulnificus CMCP6
description: VV1_1954 encodes the CMCP6 CheZ-family phosphatase of Vibrio vulnificus. It is
  inferred to promote CheY3-P dephosphorylation and regulate chemotactic motor signaling. The
  V. vulnificus CheZ and CheX systems coexist and make distinguishable contributions to motility,
  as demonstrated in strain ATCC 27562; the exact CMCP6 CheZ protein has not been independently
  established as the assayed construct in that work.
