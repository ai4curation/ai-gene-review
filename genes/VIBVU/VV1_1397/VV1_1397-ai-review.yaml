  label: Vibrio vulnificus CMCP6
description: VV1_1397 encodes the CMCP6 CheX-family protein of Vibrio vulnificus. Its crystal
  structure shows a dimeric CheX fold. CheY-P phosphatase activity and control of flagellar
  switching are inferred from the experimentally characterized V. vulnificus CheX system, in
  which CheX and CheZ coexist and regulate CheY3 phosphorylation with different effects on motility
  under constraint. The CMCP6 protein supplies the structural exemplar; the native behavioral
  and phosphatase experiments used strain ATCC 27562.
