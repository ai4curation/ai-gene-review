- id: PMID:3881386
  title: "Phosphate-specific transport system of Escherichia coli: nucleotide sequence and gene-polypeptide relationships."
  findings:
  - statement: >-
      Establishes the sequence and organization of phoU at the 3' end of the
      phoS-pstC-pstA-pstB-phoU operon.
    supporting_text: "The complete sequence is transcribed counterclockwise, in the order phoS pstC pstA pstB phoU."
- id: PMID:24563032
  title: The PhoU protein from Escherichia coli interacts with PhoR, PstB, and metals
    to form a phosphate-signaling complex at the membrane.
  findings:
  - statement: >-
      PhoU is a soluble homodimer that binds Mn(2+) and Mg(2+) at conserved
      three-helix bundle sites to associate with the membrane and physically
      interact with both PstB and the PAS domain of PhoR.
    supporting_text: "We have demonstrated using bacterial two-hybrid analysis and confirmatory coelution experiments that PhoU interacts with PhoR through its PAS (Per-ARNT-Sim) domain and that it also interacts with PstB, the cytoplasmic component of the transporter. We have also shown that the soluble form of PhoU is a dimer that binds manganese and magnesium."
suggested_questions:
- question: >-
    Does Variovorax paradoxus PhoU (VPARA_10440) also directly regulate
    polyphosphate kinase (Ppk1, VPARA_39980) or exopolyphosphatase (Ppx,
    VPARA_10490, encoded at the opposite end of the same gene cluster) in
    response to fluctuations in PstSCAB transport flux?
  experts:
  - McCleary WR
suggested_experiments:
- description: >-
    Perform bacterial two-hybrid (BACTH) and Ni-NTA co-elution assays with
    Variovorax paradoxus PhoU (VPARA_10440), PstB (VPARA_10450), and the PAS
    domain of PhoR1 (VPARA_10420), and measure Mn(2+)/Mg(2+) binding by ICP-MS
    and intrinsic fluorescence.
  hypothesis: >-
    V. paradoxus PhoU forms a divalent-cation-binding homodimer that bridges
    PstB and the PAS domain of PhoR1 to assemble the membrane-associated
    phosphate-signaling complex (PMID:24563032).
