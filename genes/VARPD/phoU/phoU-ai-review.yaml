  review:
    summary: >-
      Core molecular function; PhoU coordinates divalent metal cations
      (Mn(2+)/Mg(2+)) via conserved carboxylate/arginine clusters in its two
      tandem PhoU three-helix bundle domains (Pfam PF01895) to promote
      membrane association and phosphate-signaling complex assembly.
    action: NEW
