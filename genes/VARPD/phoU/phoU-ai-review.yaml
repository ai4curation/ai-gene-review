      metal-binding pockets (Glu94/Arg95 and Asp157/Glu195/Arg196) shown by
      ICP-MS, fluorescence titration, and site-directed mutagenesis to bind
      Mn(2+) and Mg(2+) and mediate membrane targeting in E. coli PhoU
