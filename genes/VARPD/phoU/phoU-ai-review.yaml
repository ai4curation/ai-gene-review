  review:
    summary: >-
      Core biological process; PhoU acts as the essential negative regulator of
      the PhoR1-PhoB1 phosphate starvation response and PstSCAB phosphate
      import under phosphate-replete conditions.
    action: ACCEPT
    reason: >-
      When extracellular phosphate is abundant, PhoU interacts with PstB and
      the PAS domain of PhoR to promote PhoR phosphatase activity toward
      phospho-PhoB, negatively regulating expression of the Pho regulon and
      preventing unregulated phosphate uptake (PMID:24563032).
    supported_by:
    - reference_id: file:VARPD/phoU/phoU-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: "CC   -!- FUNCTION: Plays a role in the regulation of phosphate uptake.\nCC       {ECO:0000256|PIRNR:PIRNR003107}."
    - reference_id: PMID:24563032
      supporting_text: "When phoU is mutated or deleted, PhoR is a constitutive PhoB kinase leading to high expression of the Pho regulon genes."
