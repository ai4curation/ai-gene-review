    - reference_id: PMID:24563032
      supporting_text: "We have also shown that the soluble form of PhoU is a dimer that binds manganese and magnesium. Alteration of highly conserved residues in PhoU by site-directed mutagenesis shows that these sites play a role in binding metals. Analysis of these phoU mutants suggests that metal binding may be important for PhoU membrane interactions."
core_functions:
- description: >-
    Divalent-metal-binding homodimeric adapter protein that bridges the PstB
    ATPase subunit of the PstSCAB phosphate transporter to the PAS domain of
    the PhoR1 sensor histidine kinase at the cytoplasmic membrane surface,
    negatively regulating the Pho regulon and maintaining intracellular
    phosphate ion homeostasis under phosphate-replete conditions.
