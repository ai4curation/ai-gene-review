description: >-
  Phosphate-specific transport system accessory regulatory protein PhoU
  (VPARA_10440, A0A0H2MBK2) in Variovorax paradoxus strain TBEA6 is a
  233-amino-acid cytoplasmic homodimeric signaling protein (InterPro IPR028366,
  NCBIfam TIGR02135, PIRSF PIRSF003107, PANTHER PTHR42930:SF3) encoded on
  genomic contig JZWI01000005 (EMBL KLN58032.1) between pstB (VPARA_10450) and
  phoB1 (VPARA_10430) within the phoR1-phoB1-phoU-pstB-pstA-pstC-pstS-ppx
  cluster (VPARA_10420-VPARA_10490). PhoU comprises two tandem symmetric
  three-alpha-helix bundle domains (Pfam PF01895 at residues 22-108 and
  129-210) that conserve the divalent metal-coordinating acidic/arginine
  clusters in each bundle. Under phosphate-replete conditions, PhoU binds
  divalent cations (Mn(2+)/Mg(2+)) to promote membrane association and
  physically bridges the PstB ATPase subunit of the PstSCAB importer to the
  PAS domain of the PhoR1 sensor histidine kinase, shifting PhoR1 toward its
  phospho-PhoB1 phosphatase state to repress the Pho regulon and maintain
  intracellular phosphate homeostasis.
