    in Variovorax sp. H002 variochelins in PMID:38590537, and combinatorialized across N-formylated, N-acetylated,
    or unmodified N-hydroxyornithine with monomer substitutions in V. paradoxus P4B variobactin A and
    B in PMID:26412281) during variobactin assembly.
