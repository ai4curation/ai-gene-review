- id: PMID:26412281
  title: An automated Genomes-to-Natural Products platform (GNP) for the discovery of modular natural
    products.
  findings:
  - statement: Identifies the Variovorax paradoxus P4B variobactin NRPS/PKS biosynthetic gene cluster
      (GenBank KT362218) and elucidates the structures of variobactin A and B.
    supporting_text: A second Variovorax isolate (V. paradoxus P4B (ref. 32)) was found to possess another
      distinct NRPS/PKS gene cluster, corresponding to a putative lipopeptide (Fig. 2b, Supplementary
      Fig. 17a and Supplementary Table 7). By altering amino-acid composition, macrocyclization status
      and tailoring modifications, we generated a library of 32 structures (Supplementary Fig. 17b) for
      use in GNP analysis of the LC–MS/MS spectrum. The crude extract of V. paradoxus P4B was shown to
      contain a series of candidate hits (Fig. 2b) whose isolation yielded the novel natural products
      variobactin A and B, in spite of several unforeseen amino-acid substitutions
  - statement: Reports the GenBank accession KT362218 for the variobactin biosynthetic gene cluster.
    supporting_text: 'Accession codes: Genbank: The accession codes for the biosynthetic gene clusters
      for WS9326, variobactin and thanamycin are KT362217, KT362218 and KT362216.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifies the V. paradoxus P4B var cluster (KT362218) and solves the structures of
      variobactin A and B.
- id: PMID:27023373
  title: Variochelins, Lipopeptide Siderophores from Variovorax boronicumulans Discovered by Genome Mining.
  findings:
  - statement: Demonstrates that the Variovorax var PKS/NRPS assembly line produces photoreactive lipopeptide
      siderophores that coordinate Fe(III) via two C-terminal hydroxamate-modified ornithine units and
      beta-hydroxyaspartate.
    supporting_text: In this paper, we describe the genomics-driven discovery and characterization of
      variochelins, lipopeptide siderophores from the bacterium Variovorax boronicumulans, which thrives
      in soil and freshwater habitats. Variochelins are different from most other lipopeptide siderophores
      in that their biosynthesis involves a polyketide synthase. We demonstrate that the ferric iron complex
      of variochelin A possesses photoreactive properties and present the MS-derived structures of two
      degradation products that emerge upon light exposure.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the conserved Variovorax var siderophore biosynthetic pathway and photoreactive
      Fe(III) coordination.
- id: PMID:38590537
  title: New variochelins from soil-isolated Variovorax sp. H002.
  findings:
  - statement: Confirms that Variovorax var gene clusters encode a terminal bimodular NRPS with a C-terminal
      thioesterase domain that incorporates two N-delta-acyl-N-delta-hydroxyornithine residues and releases
      the mature photoreactive lipopeptide siderophore.
    supporting_text: Moreover, these bacteria produce unique photoreactive siderophores other than variochelins,
      including vacidobactin from V. paradoxus S110, variobactin from V. paradoxus P4B, and imaqobactin
      from Variovorax sp. RKJM285, suggesting their significant role in interactions with both plants
      and other microbes in near-surface soil through iron photocycling [5,11–12].
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative domain and functional analysis of the Variovorax var NRPS/PKS siderophore
      cluster.
