taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: Var7 (ALG65342.1) is a 2,431-amino-acid terminal bimodular nonribosomal peptide synthetase
  (NRPS) encoded immediately downstream of var6 in the variobactin/variochelin (var) hybrid NRPS/PKS lipopeptide
  siderophore biosynthetic gene cluster of Variovorax paradoxus strain P4B (GenBank KT362218). Var7 contains
  two condensation/epimerization domains (PF00668; CDD cd19544 E-C_NRPS and cd19531 LCL_NRPS-like), two
  PvdJ-like ATP-dependent amino acid adenylation domains (PF00501 / PF13193 / CDD cd17649), two peptidyl-carrier
  protein (PCP) domains modified with 4'-phosphopantetheine at Ser1041 and Ser2111 (PF00550 / PROSITE
  PS50075), and a C-terminal alpha/beta-hydrolase thioesterase (TE) domain (PF00975 / IPR001031). Var7
  incorporates the two C-terminal N-delta-acyl-N-delta-hydroxyornithine hydroxamate iron-chelating residues
  and catalyzes thioesterase-mediated chain release to yield mature variobactin A and B.
