suggested_questions:
- question: Does the C-terminal thioesterase domain of Var7 catalyze exclusively hydrolytic release of
    linear variobactin, or can it also catalyze ester macrocyclization under specific physiological conditions?
suggested_experiments:
- description: Express and purify the excised C-terminal thioesterase domain of Var7 (residues ~2160-2431)
    and assay its activity on synthetic N-acetylcysteamine (SNAC) thioester mimics of the full-length
    variobactin lipopeptide.
  hypothesis: The excised Var7 thioesterase domain regioselectively cleaves the C-terminal modified N-hydroxyornithine
    thioester to offload mature variobactin.
  experiment_type: In vitro thioesterase offloading assay
