  review:
    summary: >-
      Incorrect InterPro2GO propagation from IPR010067; mature SsuA2 (residues
      30-319) is a soluble periplasmic solute-binding protein lacking
      transmembrane helices.
    action: REMOVE
    reason: >-
      InterPro2GO maps IPR010067 (ABC_SsuA_sub-bd) to GO:0016020 (membrane)
      because SsuA operates with the inner-membrane SsuBC complex. However,
      SsuA2 possesses a cleaved N-terminal signal peptide (residues 1-29) and a
      soluble periplasmic binding protein-like II domain (residues 35-257,
      SMART SM00062) with no transmembrane segments, localizing to the outer
      membrane-bounded periplasmic space (GO:0030288) rather than the membrane.
    supported_by:
