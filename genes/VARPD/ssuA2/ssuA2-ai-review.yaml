  title: "UniProtKB record A0A0H2M784 (A0A0H2M784_VARPD) - Putative aliphatic sulfonates-binding protein from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_09270 (ssuA2, A0A0H2M784) is a 319-aa aliphatic sulfonate-binding
      protein (NCBIfam TIGR01728, InterPro IPR010067, PANTHER PTHR30024:SF42)
      carrying an N-terminal Tat signal peptide (PROSITE PS51318, residues
      1-29).
    record_section: ["FT:SIGNAL"]
    supporting_text: "FT   SIGNAL          1..29\nFT                   /evidence=\"ECO:0000256|SAM:SignalP\""
  - statement: >-
      VPARA_09270 (ssuA2) corresponds to EMBL CDS accession KLN57916.1 on
      genomic contig JZWI01000005, where consecutive CDS accessions and locus
      tags stepping by 10 place ssuA2 in the same organosulfonate gene cluster
      as ssuB2 (VPARA_09230, KLN57912.1), ssuC5 (VPARA_09240, KLN57913.1), ssuD
      (VPARA_09250, KLN57914.1), and ssuE (VPARA_09290, KLN57918.1).
    record_section: ["DR:EMBL"]
    supporting_text: "DR   EMBL; JZWI01000005; KLN57916.1; -; Genomic_DNA."
- id: PMID:10781534
  title: Deletion analysis of the Escherichia coli taurine and alkanesulfonate transport systems.
  findings:
  - statement: >-
      In-frame deletion and complementation analysis of the E. coli ssuABC and
      tauABC genes established that SsuABC forms a dedicated ABC importer for
      aliphatic sulfonates whose subunits are not functionally exchangeable
      with TauABC.
    supporting_text: "Mutants in which only formation of hybrid transporters was possible were unable to grow with sulfonates, indicating that the individual components of the two transport systems were not functionally exchangeable."
- id: PMID:10781557
  title: The ssu locus plays a key role in organosulfur metabolism in Pseudomonas putida S-313.
  findings:
  - statement: >-
      Sequence and complementation analysis of the ssu operon identified ssuA,
      ssuB, and ssuC as the periplasmic binding, ATPase, and membrane permease
      genes of an ABC-type sulfonate transport system.
    supporting_text: "The first group consists of ssuA , ssuB , and ssuC , which are the genes for a putative ATP-binding cassette (ABC)-type transport system."
suggested_questions:
- question: >-
    What is the substrate binding spectrum of Variovorax paradoxus SsuA2
    (VPARA_09270) across linear C2-C10 alkanesulfonates, sulfonated buffers
    (HEPES, MOPS), and aromatic sulfonates compared with paralogous ssuA genes
    in V. paradoxus TBEA6?
  experts:
  - Kertesz MA
  - Leisinger T
  - Ellis HR
suggested_experiments:
- description: >-
    Purify mature recombinant Variovorax paradoxus SsuA2 (residues 30-319,
    lacking the N-terminal Tat signal peptide) and determine dissociation
    constants for ethanesulfonate, pentanesulfonate, octanesulfonate, and
    taurine by isothermal titration calorimetry and intrinsic tryptophan
    fluorescence quenching.
  hypothesis: >-
    Mature SsuA2 binds aliphatic C2-C8 alkanesulfonates with sub-micromolar to
    low-micromolar affinity while discriminating against taurine and inorganic
    sulfate.
