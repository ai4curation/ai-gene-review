  label: Variovorax paradoxus
description: >-
  Periplasmic aliphatic sulfonate-binding protein SsuA2 (VPARA_09270,
  A0A0H2M784) in Variovorax paradoxus strain TBEA6 is a 319-amino-acid
  substrate-recognition subunit (NCBIfam TIGR01728, InterPro IPR010067, PANTHER
  PTHR30024:SF42) of the SsuABC ATP-binding cassette (ABC) importer complex.
  Encoded on genomic contig JZWI01000005 (EMBL KLN57916.1) within the aliphatic
  sulfonate uptake and desulfonation gene cluster alongside the ATPase ssuB2
  (VPARA_09230, KLN57912.1), the transmembrane permease ssuC5 (VPARA_09240,
  KLN57913.1), the alkanesulfonate monooxygenase ssuD (VPARA_09250,
  KLN57914.1), and the FMN reductase ssuE (VPARA_09290, KLN57918.1), SsuA2
  carries an N-terminal twin-arginine translocation (Tat) signal peptide
  (PROSITE PS51318, residues 1-29, containing the Arg8-Arg9-Arg10 motif) that
  directs export of the mature periplasmic solute-binding domain (residues
  30-319) to capture extracellular aliphatic sulfonates and present them to the
  inner-membrane SsuC5-SsuB2 translocon.
