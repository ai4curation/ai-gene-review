  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010067
  review:
    summary: >-
      Over-annotated on the isolated periplasmic binding subunit; GO:0042626
      describes the ATP-driven transmembrane transport activity of the intact
      SsuABC complex rather than the soluble SsuA2 subunit alone.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      InterPro2GO maps IPR010067 (ABC_SsuA_sub-bd) to GO:0042626
      (ATPase-coupled transmembrane transporter activity). Because SsuA2 is a
      soluble periplasmic substrate-binding protein lacking transmembrane pore
      or ATPase domains, it cannot catalyze ATP-coupled transmembrane transport
      on its own; its contribution to complex-level GO:0042959 (ABC-type
      alkanesulfonate transporter transporter activity) is recorded via
      contributes_to_molecular_function in core_functions (matching the
      treatment in PSEPK/ssuA).
    supported_by:
