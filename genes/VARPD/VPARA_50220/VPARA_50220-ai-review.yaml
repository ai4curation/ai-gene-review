suggested_questions:
- question: Does VPARA_50220 exhibit a kinetic preference for GDP over ADP during stationary-phase or
    heavy-metal stress in Variovorax paradoxus, similar to Pseudomonas aeruginosa PA0141?
suggested_experiments:
- description: Compare the kcat/Km values of purified VPARA_50220 (A0A0H2LUF2) for GDP vs. ADP with polyP65
    as the phosphoryl donor, and test whether a delta-VPARA_50220 mutant is impaired in survival under
    nutrient or heavy-metal stress.
  hypothesis: VPARA_50220 functions as a homotetrameric class I PPK2 that preferentially regenerates GTP
    and ATP from accumulated polyP.
  experiment_type: Steady-state enzyme kinetics and mutant stress-survival assay
