  label: Variovorax paradoxus
description: VPARA_50220 (KLN53893.1) is a 306-amino-acid cytosolic class I polyphosphate kinase 2 (ADP/GDP-polyphosphate
  phosphotransferase, EC 2.7.4.-) in Variovorax paradoxus strain TBEA6 (Pfam PF03976, InterPro IPR022486
  PPK2_PA0141, NCBIfam TIGR03707, PANTHER PTHR34383:SF1, RuleBase RU369062). Orthologous to Pseudomonas
  aeruginosa PA0141 (PPK2), it contains a single PPK2 catalytic domain (residues 52-276) with a conserved
  P-loop Walker A motif (GRDAAGK, residues 85-91) and utilizes inorganic polyphosphate (polyP) as a phosphoryl
  donor to convert GDP to GTP and ADP to ATP.
