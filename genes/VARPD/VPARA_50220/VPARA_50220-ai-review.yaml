  findings: []
- id: PMID:31907778
  title: Characterization of Two Polyphosphate Kinase 2 Enzymes Used for ATP Synthesis.
  findings:
  - statement: Class I PPK2 enzymes use long-chain inorganic polyphosphate to phosphorylate nucleoside
      diphosphates (ADP/GDP) to triphosphates (ATP/GTP) and do not act on nucleoside monophosphates (AMP).
    supporting_text: 'The two PPK2s

      preferentially catalyzed the long-chain polyP hexametaphosphate as the phosphate

      donor. Adenosine monophosphate could not be used by HbPPK2 and NdPPK2 to

      synthesize ATP, indicating that they belonged to the class I subfamily of PPK2.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Demonstrates the defining substrate specificity of class I PPK2 enzymes.
- id: PMID:31206993
  title: Class III Polyphosphate Kinase 2 Enzymes Catalyze the Pyrophosphorylation of Adenosine-5'-Monophosphate.
  findings:
  - statement: Summarizes the classification of bacterial PPK2 enzymes into classes I, II, and III according
      to their nucleotide phosphorylation specificity.
    supporting_text: 'Polyphosphate kinase 2 (PPK2) transfer phosphate from inorganic polyphosphate to

      nucleotides. According to their activity, PPK2 enzymes are classified into three

      groups.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Provides comparative classification context for bacterial PPK2 subfamilies.
