  review:
    summary: >-
      Accurate core biological process; CzcD exports excess cytoplasmic Zn(2+)
      to maintain intracellular zinc homeostasis and attenuate CzcCBA induction.
    action: ACCEPT
    reason: >-
      Bacterial CzcD CDF transporters export excess cytoplasmic Zn(2+) across
      the inner membrane to prevent toxic intracellular zinc accumulation and
      regulate heavy-metal resistance homeostasis.
    supported_by:
