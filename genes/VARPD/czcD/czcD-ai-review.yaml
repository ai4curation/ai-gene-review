taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: >-
  Cadmium, cobalt and zinc/H(+)-K(+) antiporter CzcD (VPARA_15480) in
  Variovorax paradoxus strain TBEA6 is a 320-amino-acid inner-membrane Cation
  Diffusion Facilitator (CDF) family transporter (NCBIfam TIGR01297, NCBIfam
  NF033827, Pfam PF01545, InterPro IPR002524) containing six transmembrane
  alpha-helices (residues 28-47, 59-80, 92-113, 125-148, 185-210, and 216-234),
  an extraordinarily histidine-rich cytoplasmic loop between TM4 and TM5
  (residues 152-179, containing 15 histidine residues within
  152-HHHGHGHDHGHGHAHPHHEGHGHAHGHD-179), and a C-terminal cytoplasmic
  regulatory domain (residues 243-320). CzcD preserves the conserved
  intramembrane metal-binding site A residues on TM2 (His59 and His62 in
  59-HMSSHALA-66) and TM5 (His188 and Asp192 in 188-HVVAD-192) and catalyzes
  proton-coupled export of cytoplasmic Zn(2+) (as well as Co(2+) and Cd(2+))
  across the plasma membrane to maintain intracellular zinc and transition-metal
  ion homeostasis.
