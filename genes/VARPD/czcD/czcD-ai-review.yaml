- id: UniProtKB:A0A0H2M558
  title: "UniProtKB record A0A0H2M558 (A0A0H2M558_VARPD) - Cadmium, cobalt and zinc/H(+)-K(+) antiporter from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_15480 (czcD, A0A0H2M558) is a 320-aa Cation Diffusion Facilitator
      (CDF) family transporter (NCBIfam TIGR01297, Pfam PF01545, residues
      29-242) with six transmembrane helices and a basic/acidic histidine-rich
      cytoplasmic loop (residues 155-177).
    supporting_text: "FT   DOMAIN          29..242\nFT                   /note=\"Cation efflux protein transmembrane\"\nFT                   /evidence=\"ECO:0000259|Pfam:PF01545\""
- id: PMID:10559151
  title: CzcD is a heavy metal ion transporter involved in regulation of heavy metal
    resistance in Ralstonia sp. strain CH34.
  findings:
  - statement: >-
      In Ralstonia (Cupriavidus) metallidurans CH34, CzcD is a membrane-bound
      CDF-family transporter that exports cobalt, zinc, and cadmium cations from
      the cytoplasm, reducing intracellular cation accumulation and regulating
      czcCBA expression.
    supporting_text: "All three proteins mediated a small but significant resistance to cobalt, zinc, and cadmium in Ralstonia, and this resistance was based on a reduced accumulation of the cations. Thus, CzcD appeared to repress the Czc system by an export of the inducing cations."
- id: PMID:27797207
  title: "Responses of Pseudomonas putida to Zinc Excess Determined at the Proteome Level: Pathways Dependent and Independent of ColRS."
  findings:
  - statement: >-
      Whole-cell proteomics in Pseudomonas putida showed that the CDF
      transporter CzcD and the RND efflux pumps CzcCBA1 and CzcCBA2 are induced
      in response to excess zinc to maintain zinc homeostasis.
    supporting_text: "We identified dozens of proteins that responded to zinc in a ColR-independent manner, among others, known metal efflux systems CzcCBA1, CzcCBA2, CadA2 and CzcD."
suggested_questions:
- question: >-
    What is the functional role of the unusually long 28-residue histidine-rich
    cytosolic IL2 loop (152-HHHGHGHDHGHGHAHPHHEGHGHAHGHD-179, containing 15
    histidines) in Variovorax paradoxus CzcD (VPARA_15480) — does it act as an
    intracellular Zn2+/Ni2+/Co2+ buffer or an allosteric gate for transmembrane
    transport?
  experts:
  - Nies DH
  - Barber KE
  - Cherezov V
suggested_experiments:
- description: >-
    Reconstitute purified Variovorax paradoxus CzcD (VPARA_15480) and an IL2
    histidine-loop deletion variant (Δ152-179) into proteoliposomes and measure
    ΔpH-driven transport of Zn2+, Co2+, Cd2+, and Ni2+.
  hypothesis: >-
    Wild-type CzcD catalyzes H+-coupled antiport of Zn2+, Co2+, and Cd2+, while
    deletion of the 15-histidine cytoplasmic loop alters metal selectivity and
    allosteric activation kinetics.
