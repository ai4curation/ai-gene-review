  title: "UniProtKB record A0A0H2MMT5 (A0A0H2MMT5_VARPD) - Phosphate transport system permease protein PstC from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_10470 (pstC, A0A0H2MMT5) is a 359-aa six-pass inner-membrane ABC
      permease subunit (InterPro IPR011864, NCBIfam TIGR02138, PANTHER
      PTHR30425:SF1, PROSITE PS50928) encoded on contig JZWI01000005
      (KLN58035.1).
    record_section: ["CC:FUNCTION", "CC:SUBCELLULAR LOCATION"]
    supporting_text: "CC   -!- FUNCTION: Part of the binding protein-dependent transport system for\nCC       phosphate; probably responsible for the translocation of the substrate\nCC       across the membrane. {ECO:0000256|RuleBase:RU363054}.\nCC   -!- SUBCELLULAR LOCATION: Cell inner membrane\nCC       {ECO:0000256|RuleBase:RU363054}; Multi-pass membrane protein\nCC       {ECO:0000256|RuleBase:RU363054}."
- id: PMID:2646285
  title: Specific amino acid residues in both the PstB and PstC proteins are required
    for phosphate transport by the Escherichia coli Pst system.
  findings:
  - statement: >-
      Site-directed mutations of conserved Arg237 and Glu240 residues in E. coli
      PstC (corresponding to Arg276 and Glu280 in VPARA_10470) abolish
      phosphate transport through the Pst system.
    supporting_text: "The amino acid substitutions resulting from the pstC gene mutations, Arg-237----Gln, Glu-240----Gln, or a combination of both, caused the loss of phosphate transport through the Pst system"
- id: PMID:3881386
  title: "Phosphate-specific transport system of Escherichia coli: nucleotide sequence and gene-polypeptide relationships."
  findings:
  - statement: >-
      Establishes the sequence and organization of pstC within the
      phoS-pstC-pstA-pstB-phoU operon.
    supporting_text: "The complete sequence is transcribed counterclockwise, in the order phoS pstC pstA pstB phoU."
- id: PMID:24563032
  title: The PhoU protein from Escherichia coli interacts with PhoR, PstB, and metals
    to form a phosphate-signaling complex at the membrane.
  findings:
  - statement: >-
      PstC and PstA form the integral inner-membrane pore of the PstSCAB ABC
      phosphate importer.
    supporting_text: "PstS is the periplasmic P i -binding protein, PstC and PstA are integral membrane proteins that form the pore through which P i passes, and PstB is the dimeric, cytoplasmic ATPase."
suggested_questions:
- question: >-
    What is the functional role of the 51-residue N-terminal disordered polar
    extension (residues 1-51) in Variovorax paradoxus PstC (VPARA_10470) in
    stabilizing the PstCA-PstB-PhoU signaling complex at the inner membrane?
  experts:
  - McCleary WR
suggested_experiments:
- description: >-
    Construct site-directed Arg276Gln and Glu280Gln substitutions in
    VPARA_10470 (pstC) in Variovorax paradoxus TBEA6 and assay high-affinity
    [32P]orthophosphate uptake and PhoB1-regulated alkaline phosphatase
    repression.
  hypothesis: >-
    Substitutions at Arg276 or Glu280 abolish PstSCAB-mediated orthophosphate
    transport while preserving PhoU-dependent repression of PhoR1-PhoB1 under
    phosphate-replete conditions, mirroring E. coli pstC mutants (PMID:2646285).
