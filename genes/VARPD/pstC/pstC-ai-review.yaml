  label: Variovorax paradoxus
description: >-
  Phosphate transport system permease protein PstC (VPARA_10470, A0A0H2MMT5) is
  a 359-amino-acid six-pass inner-membrane subunit of the high-affinity PstSCAB
  ABC orthophosphate importer in Variovorax paradoxus strain TBEA6, encoded on
  genomic contig JZWI01000005 (EMBL KLN58035.1) between pstS (VPARA_10480) and
  pstA (VPARA_10460) within the phoR1-phoB1-phoU-pstB-pstA-pstC-pstS-ppx
  cluster (VPARA_10420-VPARA_10490). PstC contains six transmembrane alpha-helices
  (residues 65-88, 108-139, 151-175, 195-221, 266-288, and 325-348) forming a
  MetI-like type-1 ABC transmembrane domain (PROSITE PS50928, Pfam PF00528, CDD
  cd06261, InterPro IPR011864, NCBIfam TIGR02138, PANTHER PTHR30425:SF1) and
  conserves the essential Arg276 and Glu280 residues (within 274-LGRALGETM-282)
  required for phosphate translocation. PstC heterodimerizes with PstA in the
  plasma membrane to form the transmembrane orthophosphate translocation pathway
  gated by periplasmic PstS and energized by the cytoplasmic PstB ATPase dimer.
