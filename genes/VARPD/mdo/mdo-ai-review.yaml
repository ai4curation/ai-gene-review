- id: PMID:19001372
  title: 3-mercaptopropionate dioxygenase, a cysteine dioxygenase homologue, catalyzes
    the initial step of 3-mercaptopropionate catabolism in the 3,3-thiodipropionic acid-degrading
    bacterium variovorax paradoxus.
  findings:
  - statement: >-
      Purified Variovorax paradoxus TBEA6 Mdo (B9U5L8) catalyzes the
      oxygenation of 3-mercaptopropionic acid to 3-sulfinopropionate in vivo
      and in vitro and does not utilize L-cysteine or cysteamine.
    supporting_text: "Detection of 3-sulfinopropionate in the supernatant of one of these mutants during cultivation on 3,3-thiodipropionic acid as well as in vivo and in vitro enzyme assays using purified protein demonstrated oxygenation of 3-mercaptopropionic acid to 3-sulfinopropionate by this enzyme; cysteine and cysteamine were not used as substrate."
suggested_questions:
- question: >-
    Which active-site residues in the cupin barrel of Variovorax paradoxus Mdo
    (B9U5L8, VPARA_05600) enforce strict specificity for 3-mercaptopropionate
    while excluding L-cysteine and cysteamine?
  experts:
  - Steinbuchel A
  - Wubbeler JH
  - Pierce BS
suggested_experiments:
- description: >-
    Determine the X-ray crystal structure and EPR/Mossbauer spectra of
    Fe(2+)-bound Variovorax paradoxus Mdo (B9U5L8) in complex with
    3-mercaptopropionate and nitric oxide.
  hypothesis: >-
    Arg/Gln residues lining the cupin pocket form a salt bridge with the
    3-mercaptopropionate carboxylate while sterically or electrostatically
    disfavoring the alpha-amino group of L-cysteine.
