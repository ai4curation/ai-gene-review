description: >-
  3-Mercaptopropionate dioxygenase Mdo (VPARA_05600, B9U5L8; EC 1.13.11.66 /
  BRENDA 1.13.11.91, MetaCyc MONOMER-18546) in Variovorax paradoxus strain
  TBEA6 is a biochemically and genetically characterized 195-amino-acid
  cytosolic non-heme Fe(2+)-dependent thiol dioxygenase of the RmlC-like cupin
  / cysteine dioxygenase type-I family (CDD cd10548, Pfam PF05995, InterPro
  IPR010300, PANTHER PTHR12918:SF1) encoded on genomic contig JZWI01000003
  (EMBL KLN58445.1, KEGG ag:ACB72254). Mdo coordinates a mononuclear catalytic
  ferrous iron (Fe(2+)) center via a conserved 3-His cupin facial triad at
  His90, His92 (within 89-IHNHTVW-95), and His143 (PIRSR PIRSR610300-51). In
  the Variovorax paradoxus TBEA6 3,3'-thiodipropionic acid (TDP) catabolic
  pathway, Mdo catalyzes the dioxygenation of the TDP cleavage product
  3-mercaptopropionate (3MP) with molecular oxygen to yield
  3-sulfinopropionate (3SP), without oxidizing L-cysteine or cysteamine,
  supplying 3SP for CoA activation by Act (VPARA_05450) and desulfination to
  propionyl-CoA and sulfite by Acd (VPARA_05440).
