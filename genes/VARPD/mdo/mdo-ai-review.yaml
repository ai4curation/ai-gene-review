proposed_new_terms:
- proposed_name: 3-mercaptopropionate dioxygenase activity
  proposed_definition: >-
    Catalysis of the reaction: 3-mercaptopropanoate + O2 = 3-sulfinopropanoate +
    H+ (EC 1.13.11.66, RHEA:53808).
  justification: >-
    Directly demonstrated for purified Variovorax paradoxus TBEA6 Mdo (B9U5L8,
    VPARA_05600) in PMID:19001372, which oxygenates 3-mercaptopropionate to
    3-sulfinopropionate and does not accept L-cysteine (GO:0017172) or
    cysteamine (GO:0047800).
