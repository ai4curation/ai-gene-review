suggested_questions:
- question: Does VPARA_00520 (PTHR34383:SF3 / TIGR03709) preferentially phosphorylate AMP to ADP (Class
    II, as predicted by PANTHER PTHR34383:SF3), NDP to NTP (Class I, as predicted by ARBA00009924), or
    both AMP and ADP to ATP (Class III) using inorganic polyphosphate?
suggested_experiments:
- description: Purify recombinant His6-tagged VPARA_00520 (A0A0H2MPR3) from Escherichia coli and measure
    polyP-dependent phosphorylation of AMP, ADP, GMP, and GDP by HPLC.
  hypothesis: VPARA_00520 catalyzes polyP-dependent phosphorylation of adenosine/guanosine monophosphates
    (Class II) or diphosphates (Class I), resolving the conflicting subfamily predictions between PANTHER
    PTHR34383:SF3 and ARBA00009924.
  experiment_type: In vitro polyphosphate phosphotransferase kinetic assay
knowledge_gaps:
- gap_statement: The physiological nucleotide substrate specificity of VPARA_00520 (whether it preferentially
    phosphorylates AMP as a Class II PPK2, nucleoside diphosphates as a Class I PPK2, or both AMP and
    ADP as a Class III PPK2) is experimentally undetermined.
  boundary: Domain architecture (Pfam PF03976 at residues 31-253, InterPro IPR016898 and IPR022300, NCBIfam
    TIGR03709) and conservation of the catalytic Walker A motif (GMDSSGK, residues 65-71) establish that
    VPARA_00520 is a PPK2-family polyphosphate phosphotransferase, whereas automated predictors disagree
    between Class I NDP specificity (ARBA00009924) and Class II AMP specificity (PANTHER PTHR34383:SF3).
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Distinguishing AMP- vs. NDP-phosphorylating activity determines whether VPARA_00520 regenerates
    ADP from AMP or directly synthesizes NTPs from polyphosphate alongside the canonical Class I paralog
    VPARA_50220 in Variovorax paradoxus.
  resolution: In vitro steady-state kinetic assays of purified recombinant VPARA_00520 against AMP, ADP,
    GMP, and GDP using inorganic polyphosphate as the phosphoryl donor.
