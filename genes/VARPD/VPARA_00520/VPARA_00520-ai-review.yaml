- id: PMID:31206993
  title: Class III Polyphosphate Kinase 2 Enzymes Catalyze the Pyrophosphorylation of Adenosine-5'-Monophosphate.
  findings:
  - statement: PPK2 enzymes catalyze phosphate transfer from inorganic polyphosphate to nucleotides and
      are classified into three functional subfamilies according to their nucleotide monophosphate vs.
      diphosphate substrate specificity.
    supporting_text: 'Polyphosphate kinase 2 (PPK2) transfer phosphate from inorganic polyphosphate to

      nucleotides. According to their activity, PPK2 enzymes are classified into three

      groups.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Characterizes heterologous bacterial PPK2 enzymes (focusing on Class III PPK2s) and
      defines the Class I/II/III PPK2 classification framework; does not assay Variovorax paradoxus directly.
- id: PMID:31907778
  title: Characterization of Two Polyphosphate Kinase 2 Enzymes Used for ATP Synthesis.
  findings:
  - statement: Characterizes heterologous bacterial Class I PPK2 enzymes (HbPPK2 and NdPPK2) that utilize
      long-chain inorganic polyphosphate to phosphorylate nucleoside diphosphates rather than AMP.
    supporting_text: 'The two PPK2s

      preferentially catalyzed the long-chain polyP hexametaphosphate as the phosphate

      donor. Adenosine monophosphate could not be used by HbPPK2 and NdPPK2 to

      synthesize ATP, indicating that they belonged to the class I subfamily of PPK2.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Biochemical characterization of heterologous bacterial Class I PPK2 enzymes (HbPPK2
      and NdPPK2); does not assay Variovorax paradoxus directly.
