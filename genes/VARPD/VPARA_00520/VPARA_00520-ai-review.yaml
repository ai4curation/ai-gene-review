description: 'VPARA_00520 (KLN58690.1) is a 268-amino-acid cytosolic polyphosphate kinase 2 (PPK2)-family
  phosphotransferase in Variovorax paradoxus strain TBEA6 (Pfam PF03976, InterPro IPR022300 PPK2-rel_1,
  NCBIfam TIGR03709, PANTHER PTHR34383:SF3). It contains a single P-loop containing nucleoside triphosphate
  hydrolase domain (Gene3D 3.40.50.300, InterPro IPR027417, SUPERFAMILY SSF52540; Pfam PF03976 at residues
  31-253) with a conserved Walker A motif (GMDSSGK, residues 65-71). Automated subfamily predictors disagree
  on its nucleotide substrate preference: ARBA (ARBA00009924) assigns it to the PPK2 Class I (NDP-phosphorylating)
  subfamily, whereas PANTHER PTHR34383:SF3 labels it as a polyphosphate:AMP phosphotransferase (Class
  II) and NCBIfam TIGR03709 (PPK2_rel_1) separates it from the canonical Class I PA0141 subfamily represented
  in strain TBEA6 by VPARA_50220 (A0A0H2LUF2, TIGR03707).'
