core_functions:
- description: Bimodular nonribosomal peptide synthetase that activates, condenses, and epimerizes two
    internal amino acid monomers (established as D-Ser and L-Pro in the orthologous Variovorax sp. H002
    variochelins in PMID:38590537, with Ser/Thr combinatorialization and amino-acid substitutions noted
    for V. paradoxus P4B variobactin A and B in PMID:26412281) on 4'-phosphopantetheinylated peptidyl-carrier
    protein domains during assembly of the photoreactive lipopeptide siderophore variobactin.
