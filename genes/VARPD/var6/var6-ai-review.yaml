suggested_questions:
- question: What is the functional role of the internal cyclic nucleotide-binding-like domain (residues
    1251-1313, PROSITE PS50042) embedded between the first PCP domain and the second condensation domain
    of Var6?
suggested_experiments:
- description: Perform ATP-[32P]pyrophosphate exchange assays on the two excised adenylation domains of
    recombinant Var6 (A1 and A2) across L-serine, L-threonine, L-proline, and related proteinogenic/non-proteinogenic
    amino acids to determine whether P4B Var6 retains the L-Ser/L-Pro specificity of Variovorax sp. H002
    or contributes to the amino-acid substitutions observed in variobactin A and B.
  hypothesis: A1 activates an L-configured hydroxy-amino acid (L-Ser or L-Thr prior to epimerization by
    the E domain) and A2 activates L-proline or a substituted congener matching variobactin A/B.
  experiment_type: ATP-PPi exchange adenylation specificity assay
