taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: Var6 (ALG65341.1) is a 2,583-amino-acid bimodular nonribosomal peptide synthetase (NRPS)
  encoded within the variobactin/variochelin (var) hybrid NRPS/PKS lipopeptide siderophore biosynthetic
  gene cluster of Variovorax paradoxus strain P4B (GenBank KT362218). Var6 comprises three condensation/epimerization
  domains (an LCL-type condensation domain, an epimerization domain, and a DCL-type condensation domain;
  PF00668), two ATP-dependent amino acid adenylation domains (PF00501 / PF13193 / IPR010071), and two
  peptidyl-carrier protein (PCP) domains modified with 4'-phosphopantetheine prosthetic groups at Ser1016
  and Ser2517 (PF00550 / PROSITE PS50075 / IPR020806). Within the cytoplasmic variobactin/variochelin
  assembly line, Var6 activates, condenses, and stereochemically epimerizes two internal peptide monomers
  (established as D-Ser and L-Pro in the orthologous Variovorax sp. H002 variochelins, PMID:38590537)
  downstream of the hybrid PKS/NRPS module Var4 and passes the elongating lipopeptidyl chain to the terminal
  NRPS-thioesterase module Var7.
