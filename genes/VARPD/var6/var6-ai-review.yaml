- id: PMID:26412281
  title: An automated Genomes-to-Natural Products platform (GNP) for the discovery of modular natural
    products.
  findings:
  - statement: Identifies the hybrid NRPS/PKS variobactin biosynthetic gene cluster (GenBank KT362218)
      in Variovorax paradoxus strain P4B and isolates its lipopeptide siderophore products variobactin
      A and B.
    supporting_text: A second Variovorax isolate (V. paradoxus P4B (ref. 32)) was found to possess another
      distinct NRPS/PKS gene cluster, corresponding to a putative lipopeptide (Fig. 2b, Supplementary
      Fig. 17a and Supplementary Table 7). By altering amino-acid composition, macrocyclization status
      and tailoring modifications, we generated a library of 32 structures (Supplementary Fig. 17b) for
      use in GNP analysis of the LC–MS/MS spectrum. The crude extract of V. paradoxus P4B was shown to
      contain a series of candidate hits (Fig. 2b) whose isolation yielded the novel natural products
      variobactin A and B, in spite of several unforeseen amino-acid substitutions
  - statement: Deposits the Variovorax paradoxus P4B variobactin biosynthetic gene cluster under GenBank
      accession KT362218.
    supporting_text: 'Accession codes: Genbank: The accession codes for the biosynthetic gene clusters
      for WS9326, variobactin and thanamycin are KT362217, KT362218 and KT362216.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary discovery paper sequencing the V. paradoxus P4B var cluster (KT362218) and isolating
      variobactin A and B.
- id: PMID:27023373
  title: Variochelins, Lipopeptide Siderophores from Variovorax boronicumulans Discovered by Genome Mining.
  findings:
  - statement: Characterizes the orthologous Variovorax var hybrid PKS/NRPS gene cluster and demonstrates
      that the ferric complexes of its lipopeptide siderophore products are photoreactive.
    supporting_text: In this paper, we describe the genomics-driven discovery and characterization of
      variochelins, lipopeptide siderophores from the bacterium Variovorax boronicumulans, which thrives
      in soil and freshwater habitats. Variochelins are different from most other lipopeptide siderophores
      in that their biosynthesis involves a polyketide synthase. We demonstrate that the ferric iron complex
      of variochelin A possesses photoreactive properties and present the MS-derived structures of two
      degradation products that emerge upon light exposure.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Characterizes the conserved Variovorax var PKS/NRPS siderophore assembly line and photoreactive
      Fe(III) chelation.
- id: PMID:38590537
  title: New variochelins from soil-isolated Variovorax sp. H002.
  findings:
  - statement: Places Variovorax paradoxus P4B variobactin within the family of photoreactive lipopeptide
      siderophores produced by Variovorax species for rhizosphere iron acquisition and microbial competition.
    supporting_text: Moreover, these bacteria produce unique photoreactive siderophores other than variochelins,
      including vacidobactin from V. paradoxus S110, variobactin from V. paradoxus P4B, and imaqobactin
      from Variovorax sp. RKJM285, suggesting their significant role in interactions with both plants
      and other microbes in near-surface soil through iron photocycling [5,11–12].
  - statement: Establishes by Marfey's analysis in the orthologous Variovorax sp. H002 variochelins C-E
      that the internal proline, serine, and two modified ornithine residues have L, D, and L absolute
      configurations, respectively.
    supporting_text: The absolute configurations of the amino acid constituents, Pro, Ser and two modified
      ornithine residues, in 3–5 were assigned as ʟ, ᴅ, and ʟ, respectively (Figures S25, S33, and S41,
      Supporting Information File 1).
  - statement: Illustrates the conserved domain organization and module substrate specificities of the
      Variovorax var PKS/NRPS assembly line (FA-Arg-MM-Asp-Ser-Pro-Orn-Orn), including the central bimodular
      Ser/Pro NRPS containing an epimerization domain.
    supporting_text: 'The circles represent domains: A: adenylation domain, C: condensation domain, PCP:
      peptide carrier protein, E: epimerization domain, TE: thioesterase domain, KS: ketosynthase domain,
      AT: acyl transferase domain, KR: ketoreductase domain, TauD: taurine dioxygenase domain. Substrate
      specificity of A and KS domains is presented at the top of each module (FA: fatty acyl, Arg: arginine,
      MM: methyl malonyl, Asp: aspartic acid, Ser: serine, Pro: proline, Orn: ornithine).'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Provides comparative biosynthetic and functional validation of the Variovorax var NRPS/PKS
      siderophore gene cluster.
