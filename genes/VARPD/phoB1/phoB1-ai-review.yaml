core_functions:
- description: >-
    Two-component phosphorelay response regulator that is phosphorylated at
    Asp54 by PhoR1 under inorganic phosphate limitation, homodimerizes, and
    binds Pho-box cis-regulatory promoter elements via its C-terminal
    OmpR/PhoB-type winged-helix domain to positively regulate transcription of
    the phosphate starvation regulon.
