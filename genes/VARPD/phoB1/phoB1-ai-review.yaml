description: >-
  Phosphate regulon transcriptional regulatory protein PhoB1 (VPARA_10430,
  A0A0H2M7F4) in Variovorax paradoxus strain TBEA6 is a 230-amino-acid
  cytosolic OmpR/PhoB-family two-component response regulator (InterPro
  IPR011879, NCBIfam TIGR02154, PANTHER PTHR48111:SF40) encoded on genomic
  contig JZWI01000005 (EMBL KLN58031.1) between its cognate sensor histidine
  kinase phoR1 (VPARA_10420) and phoU (VPARA_10440) within the
  phoR1-phoB1-phoU-pstB-pstA-pstC-pstS-ppx cluster (VPARA_10420-VPARA_10490).
  PhoB1 comprises an N-terminal CheY-like receiver domain (PROSITE PS50110,
  Pfam PF00072, CDD cd17618, residues 5-121) containing the invariant
  aspartyl-phosphate acceptor Asp54 (50-LILLDWMLPGQSG-62) and a C-terminal
  winged-helix DNA-binding effector domain (PROSITE PS51755, Pfam PF00486, CDD
  cd00383, residues 130-226). Under inorganic phosphate limitation,
  phosphorylation of Asp54 by PhoR1 induces PhoB1 homodimerization and binding
  to Pho-box cis-regulatory sequences upstream of Pho regulon promoters to
  activate transcription of high-affinity phosphate acquisition and starvation
  response genes.
