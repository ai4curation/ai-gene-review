suggested_questions:
- question: >-
    Beyond the canonical pstSCAB-phoU-phoB1-phoR1-ppx gene cluster
    (VPARA_10420-VPARA_10490), does phosphorylated PhoB1 in Variovorax
    paradoxus TBEA6 directly activate phosphonate utilization, alkaline
    phosphatase, or organosulfur/siderophore cross-regulation operons under
    rhizosphere phosphate limitation?
  experts:
  - McCleary WR
  - Wanner BL
suggested_experiments:
- description: >-
    Perform ChIP-seq of FLAG-tagged PhoB1 (VPARA_10430) and RNA-seq comparing
    wild-type and ΔphoB1 Variovorax paradoxus TBEA6 under phosphate-replete
    (2 mM Pi) versus phosphate-starved (50 uM Pi) conditions.
  hypothesis: >-
    Phosphorylated PhoB1 binds conserved Pho-box direct repeats upstream of the
    pstS-pstC-pstA-pstB-phoU-phoB1-phoR1 cluster and accessory phosphorus
    scavenging operons to activate their transcription during Pi starvation.
