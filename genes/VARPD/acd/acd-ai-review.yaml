taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: Acd (3-sulfinopropanoyl-CoA desulfinase, B9U6P5) in Variovorax paradoxus (characterized in
  strain TBEA6 and conserved at locus VPARA_05440) is a 399-amino-acid cytosolic homotetrameric flavoprotein
  (EC 3.13.1.4) that has been neo-functionalized from the acyl-CoA dehydrogenase (ACAD) structural superfamily.
  Rather than catalyzing an oxidative CH-CH dehydrogenation, Acd uses a non-redox, structurally bound
  FAD cofactor to catalyze the non-oxidative C-S bond cleavage (desulfination) of 3-sulfinopropanoyl-CoA
  (3SP-CoA) into propanoyl-CoA and inorganic sulfite, constituting the terminal step in the degradation
  of the organosulfur compounds 3,3'-thiodipropionic acid (TDP) and 3-sulfinopropionate (3SP).
