- description: Catalyzes the non-oxidative, FAD-requiring desulfination (C-S bond cleavage, EC 3.13.1.4)
    of 3-sulfinopropanoyl-CoA into propanoyl-CoA and sulfite during 3,3'-thiodipropionate and 3-sulfinopropionate
    catabolism.
