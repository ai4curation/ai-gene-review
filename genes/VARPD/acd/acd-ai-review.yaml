suggested_questions:
- question: What is the exact role of the oxidized FAD isoalloxazine ring in polarizing the beta-carbon
    or sulfinyl group of 3-sulfinopropanoyl-CoA during non-oxidative C-S cleavage by Variovorax paradoxus
    Acd?
suggested_experiments:
- description: Reconstitute apo-Acd from Variovorax paradoxus with 5-deaza-FAD or redox-inactive flavin
    analogues and determine the X-ray crystal structure of Acd in complex with a non-hydrolyzable 3SP-CoA
    analogue.
  hypothesis: Redox-inactive flavin analogues preserve 3SP-CoA desulfinase activity, confirming that FAD
    acts purely as an electrostatic/structural cofactor in the active site.
proposed_new_terms:
- proposed_name: 3-sulfinopropanoyl-CoA desulfinase activity
  proposed_definition: 'Catalysis of the reaction: 3-sulfinopropanoyl-CoA + H2O = propanoyl-CoA + sulfite
    + H+ (EC 3.13.1.4, RHEA:41560).'
  justification: Experimentally characterized in Variovorax paradoxus TBEA6 Acd (B9U6P5, PMID:24317404)
    and assigned IUBMB EC 3.13.1.4 and RHEA:41560, but currently lacks a dedicated Molecular Function
    term in the Gene Ontology.
  supported_by:
  - reference_id: PMID:24317404
    supporting_text: Only AcdTBEA6, AcdN-1, and AcdLB400 desulfinated 3SP-CoA and were thus identified
      as 3SP-CoA desulfinases within the acyl-CoA dehydrogenase family, although none of these three Acds
      dehydrogenated any of the tested acyl-CoA thioesters.
