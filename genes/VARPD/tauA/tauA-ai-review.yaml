      with high affinity (Kd = 11.3 nM) at a single ligand site (PMID:17203388),
      GO:1901681 (sulfur compound binding) is added for TauA's intrinsic
      ligand-capture activity while its complex-level contribution to
      GO:0015411 (ABC-type taurine transporter transporter activity) is
      recorded via contributes_to_molecular_function in core_functions.
