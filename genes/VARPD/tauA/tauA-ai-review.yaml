  label: Variovorax paradoxus
description: >-
  Taurine-binding periplasmic protein TauA (VPARA_03650, A0A0H2M727) in
  Variovorax paradoxus strain TBEA6 is a 340-amino-acid periplasmic
  solute-binding subunit (NCBIfam TIGR01729, InterPro IPR010068, PANTHER
  PTHR30024:SF47) of the TauABC ATP-binding cassette (ABC) taurine importer
  complex. Encoded at the 5' end of the syntenic tauA-tauB1-tauC
  (VPARA_03650-VPARA_03670) operon on genomic contig JZWI01000003 (consecutive
  EMBL CDS accessions KLN58254.1-KLN58256.1) immediately upstream of the ATPase
  subunit tauB1 (VPARA_03660, KLN58255.1) and the transmembrane permease tauC
  (VPARA_03670, KLN58256.1), TauA possesses an N-terminal signal peptide
  (residues 1-30) that directs export of the mature periplasmic ligand-binding
  domain (residues 31-340) to capture extracellular taurine
  (2-aminoethanesulfonate) with high specificity and deliver it to the
  inner-membrane TauC-TauB1 translocon for cytoplasmic desulfonation by TauD1
  (VPARA_23370).
