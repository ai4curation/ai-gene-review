- id: PMID:8808933
  title: "Identification of sulfate starvation-regulated genes in Escherichia coli: a gene cluster involved in the utilization of taurine as a sulfur source."
  findings:
  - statement: >-
      Characterization of the E. coli tauABCD cluster showed that TauA carries
      a periplasmic signal peptide and functions with TauB and TauC as the
      taurine ABC uptake system supplying TauD.
    supporting_text: "The TauA protein contained a putative signal peptide for transport into the periplasm; the TauB and TauC proteins showed sequence similarity to ATP-binding proteins and membrane proteins, respectively, of ABC-type transport systems"
- id: PMID:10781534
  title: Deletion analysis of the Escherichia coli taurine and alkanesulfonate transport systems.
  findings:
  - statement: >-
      In-frame deletion and complementation of E. coli tauABC and ssuABC showed
      that the two ABC importers are complementary and their subunits are not
      functionally exchangeable.
    supporting_text: "Mutants in which only formation of hybrid transporters was possible were unable to grow with sulfonates, indicating that the individual components of the two transport systems were not functionally exchangeable."
- id: PMID:17203388
  title: Functional characteristics of TauA binding protein from TauABC Escherichia coli system.
  findings:
  - statement: >-
      Purified E. coli TauA binds taurine with high affinity (mean Kd = 11.3
      nM) and specificity at a single ligand-binding site.
    supporting_text: "Measurement of K (d) value (mean 11.3 nM) by binding/dialysis studies revealed high affinity and specificity with taurine and also indicated that TauA possessed a unique binding site for its ligand."
suggested_questions:
- question: >-
    Does Variovorax paradoxus TauA (VPARA_03650) bind hypotaurine or
    isethionate in addition to taurine, and is the unlinked tauA-tauB1-tauC
    (VPARA_03650-VPARA_03670) operon co-regulated by CysB with the unlinked
    taurine dioxygenase tauD1 (VPARA_23370) under sulfate starvation?
  experts:
  - Kertesz MA
  - Leisinger T
suggested_experiments:
- description: >-
    Purify mature Variovorax paradoxus TauA (residues 31-340) and measure its
    binding affinity for taurine, hypotaurine, and ethanesulfonate by
    isothermal titration calorimetry.
  hypothesis: >-
    Mature V. paradoxus TauA binds taurine with nanomolar affinity at a single
    binding site and strongly discriminates against unsubstituted
    alkanesulfonates.
