  review:
    summary: >-
      Intrinsic molecular function capturing high-affinity periplasmic binding
      of the organosulfonate taurine (2-aminoethanesulfonate).
    action: NEW
    reason: >-
      Following the PSEPK/tauA comparator convention, GO currently lacks a
      specific taurine-binding term; because taurine (2-aminoethanesulfonate)
