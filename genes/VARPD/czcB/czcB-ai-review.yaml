  review:
    summary: >-
      InterPro2GO over-annotates the non-pore-forming periplasmic membrane-fusion
      adaptor CzcB with the transmembrane transporter activity of the assembled
      tripartite CzcCBA complex; CzcB itself enables structural molecule
      activity (GO:0005198) and contributes_to efflux transmembrane transporter
      activity (GO:0015562).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      In tripartite RND efflux pumps (CzcCBA), active cation-proton antiport is
      catalyzed by the inner-membrane RND subunit CzcA3 (VPARA_44890) and
      outer-membrane passage occurs through the trimeric OMF channel CzcC
      (VPARA_44910), whereas CzcB (VPARA_44900, InterPro IPR006143) is a
      periplasmic membrane-fusion adaptor that bridges CzcA3 and CzcC without
      forming a transmembrane pore itself. Asserting that CzcB independently
      enables transmembrane transporter activity (GO:0022857) over-annotates a
      non-transporting structural adaptor; instead, CzcB enables structural
      molecule activity (GO:0005198) and contributes_to efflux transmembrane
      transporter activity (GO:0015562) within the assembled CzcCBA complex.
    supported_by:
    - reference_id: UniProtKB:A0A0H2LX82
      supporting_text: "DR   NCBIfam; TIGR01730; RND_mfp; 1."
    - reference_id: PMID:10559151
