      region (containing 10 histidine residues) consistent with auxiliary metal
      coordination in CzcB homologs, direct metal binding has not been
      experimentally assayed on VPARA_44900 and its core biological role is
      serving as the periplasmic structural adaptor of the CzcCBA efflux
      complex.
