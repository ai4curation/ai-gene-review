- id: UniProtKB:A0A0H2LX82
  title: "UniProtKB record A0A0H2LX82 (A0A0H2LX82_VARPD) - Cobalt-zinc-cadmium resistance protein CzcB from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_44900 (czcB, A0A0H2LX82) is a 455-aa RND membrane-fusion protein
      (NCBIfam TIGR01730, InterPro IPR006143) with an N-terminal transmembrane
      helix (residues 18-36), a basic/acidic disordered periplasmic region
      (residues 41-121), and four CzcB/CusB periplasmic domains (Pfam PF25973,
      PF25893, PF25954, and PF25975).
    supporting_text: "FT   DOMAIN          155..298\nFT                   /note=\"CzcB-like barrel-sandwich hybrid\"\nFT                   /evidence=\"ECO:0000259|Pfam:PF25973\""
- id: PMID:10559151
  title: CzcD is a heavy metal ion transporter involved in regulation of heavy metal
    resistance in Ralstonia sp. strain CH34.
  findings:
  - statement: >-
      In the betaproteobacterium Ralstonia (Cupriavidus) metallidurans CH34,
      the tripartite CzcCB2A cation-proton antiporter complex catalyzes heavy
      metal ion efflux to confer cobalt, zinc, and cadmium resistance.
    supporting_text: "The Czc system of Ralstonia sp. strain CH34 mediates resistance to cobalt, zinc, and cadmium through ion efflux catalyzed by the CzcCB(2)A cation-proton antiporter."
- id: PMID:12829273
  title: Efflux-mediated heavy metal resistance in prokaryotes.
  findings:
  - statement: >-
      Tripartite CBA efflux pumps driven by resistance-nodulation-cell division
      (RND) superfamily proteins form a primary layer of heavy-metal resistance
      in bacteria.
    supporting_text: "The mechanisms of action, physiological functions, and distribution of metal-exporting proteins are outlined, namely: CBA efflux pumps driven by proteins of the resistance-nodulation-cell division superfamily, P-type ATPases, cation diffusion facilitator and chromate proteins, NreB- and CnrT-like resistance factors."
suggested_questions:
- question: >-
    Does the histidine-rich N-terminal periplasmic region (residues 41-121,
    containing 10 histidine residues) of Variovorax paradoxus CzcB (VPARA_44900)
    deliver periplasmic Zn2+/Co2+/Cd2+ ions directly to the CzcA3 porter domain
    or act as an allosteric metal sensor that activates the CzcCBA pump?
  experts:
  - Nies DH
  - Su CC
  - Yu EW
suggested_experiments:
- description: >-
    Compare heavy-metal minimum inhibitory concentrations (Zn2+, Co2+, Cd2+,
    Ni2+, Cu2+) of wild-type Variovorax paradoxus TBEA6, a ΔczcB (VPARA_44900)
    deletion mutant, and a czcB variant lacking the histidine-rich periplasmic
    segment (Δ45-121).
  hypothesis: >-
    Deletion of czcB abolishes CzcCBA-mediated divalent metal resistance, while
    truncation of the histidine-rich segment (residues 45-121) impairs
    allosteric activation or low-concentration periplasmic metal scavenging.
