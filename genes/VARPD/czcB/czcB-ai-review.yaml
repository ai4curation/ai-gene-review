  label: Variovorax paradoxus
description: >-
  Cobalt-zinc-cadmium resistance protein CzcB (VPARA_44900) in Variovorax
  paradoxus strain TBEA6 is a 455-amino-acid periplasmic membrane-fusion
  protein (MFP) adaptor subunit (NCBIfam TIGR01730, InterPro IPR006143) that
  bridges the inner-membrane HME-RND cation-proton antiporter CzcA3
  (VPARA_44890) and the outer-membrane factor channel CzcC (VPARA_44910) across
  the periplasmic space to assemble the tripartite CzcCBA heavy-metal efflux
  pump. Anchored to the inner membrane by an N-terminal transmembrane helix
  (residues 18-36), CzcB extends into the periplasm via a histidine- and
  carboxylate-rich disordered region (residues 41-121, containing 10 histidine
  residues) followed by four canonical CzcB/CusB adaptor domains — a
  barrel-sandwich hybrid domain (Pfam PF25973, residues 155-298) with an
  embedded alpha-helical hairpin (Pfam PF25893, residues 194-253), a CusB-like
  beta-barrel domain (Pfam PF25954, residues 301-376), and a C-terminal
  circularly permuted SH3-like domain (Pfam PF25975, residues 383-443) — that
  physically couple CzcA3 and CzcC during trans-envelope export of monoatomic
  metal cations.
