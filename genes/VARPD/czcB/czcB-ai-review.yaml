core_functions:
- description: >-
    Periplasmic membrane-fusion adaptor subunit of the tripartite CzcCBA
    heavy-metal efflux complex that bridges the inner-membrane RND antiporter
    CzcA3 (VPARA_44890) and the outer-membrane channel CzcC (VPARA_44910) and
    binds transition metal cations via its histidine-rich N-terminal periplasmic
    tail to facilitate transmembrane metal cation export.
