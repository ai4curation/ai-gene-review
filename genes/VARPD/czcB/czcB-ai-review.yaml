    action: MODIFY
    reason: >-
      PANTHER family PTHR30097 encompasses both monovalent-copper CusB and
      divalent-cation (Co2+/Zn2+/Cd2+) CzcB membrane-fusion proteins.
      VPARA_44900 carries CzcB-specific domain signatures (Pfam PF25973
      BSH_CzcB, PF25893 HH_CzcB, PF25975 CzcB_C) and is encoded in the
      czcA3-czcB-czcC (VPARA_44890-VPARA_44910) operon, whose exact metal
      substrate specificity in Variovorax paradoxus has not been experimentally
      restricted to copper. Generalizing to GO:0098655 (monoatomic cation
      transmembrane transport) accurately reflects its conserved role in the
      tripartite CzcCBA cation efflux pump.
