  label: Variovorax paradoxus
description: >-
  Cobalt-zinc-cadmium resistance protein CzcB (VPARA_44900) in Variovorax
  paradoxus strain TBEA6 is a 455-amino-acid periplasmic membrane-fusion
  protein (MFP) adaptor subunit (NCBIfam TIGR01730, InterPro IPR006143) encoded
  immediately downstream of the inner-membrane HME-RND antiporter czcA3
  (VPARA_44890) and upstream of the outer-membrane channel czcC (VPARA_44910)
  in the tripartite czcA3-czcB-czcC heavy-metal efflux operon. CzcB contains an
  N-terminal transmembrane helix (residues 18-36) that anchors it to the inner
  membrane, a disordered histidine- and carboxylate-rich periplasmic
  metal-binding region (residues 41-121, containing 10 histidine residues:
  His54, His59, His60, His74, His76, His78, His84, His89, His90, and His110),
  and four canonical CzcB/CusB periplasmic domains: a barrel-sandwich hybrid
  domain (Pfam PF25973, residues 155-298) with an embedded alpha-helical
  hairpin (Pfam PF25893, residues 194-253), a CusB-like beta-barrel domain
  (Pfam PF25954, residues 301-376), and a C-terminal circularly permuted
  SH3-like domain (Pfam PF25975, residues 383-443) that bridges CzcA3 and CzcC
  across the periplasmic space to drive transmembrane export of monoatomic
  metal cations.
