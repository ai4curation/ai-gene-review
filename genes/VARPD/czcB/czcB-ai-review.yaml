  review:
    summary: >-
      Auxiliary non-core molecular function inferred by TreeGrafter; CzcB
      possesses a histidine- and carboxylate-rich N-terminal periplasmic region
      (residues 41-121), but direct metal binding has not been biochemically
      assayed in Variovorax paradoxus and its primary role is as the structural
