  label: Variovorax paradoxus
description: Var8 (ALG65343.1) is an 815-amino-acid TonB-dependent outer-membrane ferric-siderophore receptor
  encoded immediately downstream of the terminal NRPS gene var7 in the variobactin (var) biosynthetic
  and transport gene cluster of Variovorax paradoxus strain P4B (GenBank KT362218). Following cleavage
  of its N-terminal Sec signal peptide (residues 1-31), mature Var8 comprises an N-terminal Secretin/TonB
  short N-terminal (STN) periplasmic signaling domain (residues 64-115, PF07660 / SMART SM00965), a barrel-occluding
  TonB-dependent receptor plug domain (PF07715 / IPR012910), and a C-terminal 22-stranded outer-membrane
  beta-barrel domain (PF00593 / IPR000531). Var8 recognizes extracellular ferric-variobactin complexes
  and mediates TonB-ExbB-ExbD-energized translocation of ferric-variobactin across the outer membrane
  into the periplasmic space.
