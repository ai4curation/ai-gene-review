suggested_questions:
- question: Does the N-terminal STN domain (residues 64-115) of Var8 interact with a cognate ECF sigma/anti-sigma
    factor pair to induce transcription of the var gene cluster upon extracellular ferric-variobactin
    binding, and can Var8 also transport the photolytic Fe(III)-free variobactin photoproduct?
suggested_experiments:
- description: Construct a clean deletion of var8 in Variovorax paradoxus P4B and measure 55Fe-variobactin
    A uptake and iron-limited growth restoration compared with wild-type P4B.
  hypothesis: Deletion of var8 abolishes high-affinity 55Fe-variobactin uptake across the outer membrane
    under iron starvation.
  experiment_type: 55Fe-siderophore uptake and mutant growth assay
