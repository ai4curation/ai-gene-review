suggested_questions:
- question: Does Variovorax paradoxus PqqB (VPARA_00950) act on the excised Glu-Tyr cross-linked dipeptide
    or on a partially proteolyzed PqqA peptide intermediate in vivo, and what is the role of 2-oxoglutarate
    in the first hydroxylation step?
suggested_experiments:
- description: Express and purify recombinant Variovorax paradoxus PqqB (A0A0H2M8Q2), reconstitute with
    Fe(2+) and Zn(2+), and assay O2-dependent hydroxylation of synthetic Glu-Tyr and Cys-DOPA cross-linked
    dipeptide substrates in the presence and absence of 2-oxoglutarate by LC-HRMS and 18O2 isotopic labeling.
  hypothesis: Fe(2+)-reconstituted V. paradoxus PqqB catalyzes O2-dependent aromatic ring hydroxylation
    of the cross-linked tyrosine moiety to generate the trihydroxyquinone precursor of AHQQ.
  experiment_type: In vitro metalloenzyme reconstitution and 18O2 LC-HRMS assay
