- id: PMID:30811189
  title: Discovery of Hydroxylase Activity for PqqB Provides a Missing Link in the Pyrroloquinoline
    Quinone Biosynthetic Pathway.
  findings:
  - statement: Biochemical, mass-spectrometric, 18O2-labeling, and X-ray crystallographic studies demonstrate
      that bacterial PqqB is an Fe(2+)-dependent non-heme hydroxylase within the metallo-beta-lactamase
      superfamily that catalyzes oxygen-insertion reactions on PqqA-derived cross-linked intermediates
      to form the quinone moiety of PQQ.
    supporting_text: Here we show evidence that the remaining essential biosynthetic enzyme PqqB is an
      iron-dependent hydroxylase catalyzing oxygen-insertion reactions that are proposed to produce the
      quinone moiety of the mature PQQ cofactor.
  - statement: Metal-binding and kinetic studies identify Fe(2+) coordinated by a 2-His/1-Asp ligand
      set as the catalytic metal cofactor of PqqB, alongside a tightly bound structural Zn(2+) site.
    supporting_text: The collective observations in this work strongly implicate PqqB as a novel non-heme
      hydroxylase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary biochemical and structural discovery of Fe(2+)-dependent hydroxylase activity
      for PqqB.
- id: PMID:32731194
  title: Biogenesis of the peptide-derived redox cofactor pyrroloquinoline quinone.
  findings:
  - statement: Confirms that PqqB is an iron-dependent hydroxylase that oxidizes the tyrosine ring of
      the PqqA-derived Glu-Tyr cross-linked intermediate to a hydroxyquinone derivative that cyclizes
      to AHQQ, the direct substrate of PqqC.
    supporting_text: Detailed kinetic analyses have confirmed that PqqB is a previously unknown iron-dependent
      hydroxylase, indicating a cross-over between the MBL superfamily and the non-heme iron hydroxylases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authoritative review of PqqB mechanism in PQQ biosynthesis.
