  label: Variovorax paradoxus
description: PqqB (VPARA_00950, A0A0H2M8Q2; also annotated as pqqB1) in Variovorax paradoxus is a 307-amino-acid
  metallo-beta-lactamase-fold non-heme iron-dependent hydroxylase (HAMAP MF_00653, InterPro IPR011842,
  NCBIfam TIGR02108, PANTHER PTHR42663:SF7) encoded in the pqqBCDE (VPARA_00950-VPARA_00920) pyrroloquinoline
  quinone (PQQ) biosynthetic gene cluster. Although older automated rules annotated PqqB as a putative
  periplasmic PQQ transporter, biochemical and crystallographic characterization of bacterial PqqB orthologs
  established that PqqB is a cytosolic Fe(2+)-dependent oxygenase/hydroxylase that catalyzes oxygen insertion
  into the tyrosine ring of a PqqA-derived Glu-Tyr cross-linked intermediate to generate the hydroxyquinone
  precursor that cyclizes into AHQQ prior to terminal oxidation by PqqC.
