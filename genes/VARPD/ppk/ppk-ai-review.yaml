suggested_questions:
- question: Does overexpression of ppk (VPARA_28600) or deletion of exopolyphosphatase (ppx) increase
    intracellular heavy-metal or lanthanide bioaccumulation capacity in Variovorax paradoxus?
suggested_experiments:
- description: Compare intracellular polyP granule formation (DAPI fluorescence shift and TEM-EDS) and
    metal/lanthanide cation sequestration between wild-type Variovorax paradoxus and a delta-ppk mutant.
  hypothesis: Loss of ppk eliminates intracellular polyP granules and reduces intracellular polyphosphate-mediated
    metal cation sequestration.
