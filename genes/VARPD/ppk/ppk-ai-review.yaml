  - statement: VPARA_28600 (A0A0H2M4T4) is a 710-residue polyphosphate kinase 1 (PPK1, EC 2.7.4.1; HAMAP
      MF_00347) with a conserved phosphohistidine active site (His441), ATP-binding site (Asn55), and
      Mg(2+) cofactor site (Glu381).
