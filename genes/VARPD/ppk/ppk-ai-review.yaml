id: A0A0H2M4T4
gene_symbol: ppk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: Ppk (polyphosphate kinase 1, VPARA_28600) in Variovorax paradoxus is a 710-amino-acid cytosolic
  kinase (EC 2.7.4.1; HAMAP rule MF_00347, InterPro IPR003414) that catalyzes the reversible transfer
  of the terminal gamma-phosphate of ATP to synthesize long-chain inorganic polyphosphate (polyP) via
  a phosphohistidine intermediate at His441, using Mg(2+) bound at Glu381 as an essential cofactor.
