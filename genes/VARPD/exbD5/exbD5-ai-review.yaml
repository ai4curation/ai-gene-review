    reason: >-
      ExbD5 does not directly transport ferric-siderophores across the membrane;
      rather, its transmembrane helix (residues 20-39, carrying the invariant
      proton-binding residue Asp23) resides inside the ExbB4 pentamer pore to
      conduct protons across the inner membrane (GO:0015078).
