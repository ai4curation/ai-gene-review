  label: Variovorax paradoxus
description: >-
  Biopolymer transport protein ExbD5 (VPARA_25800) in Variovorax paradoxus
  strain TBEA6 is a 137-amino-acid inner-membrane type II single-pass protein
  (Pfam PF02472, InterPro IPR003400, PANTHER PTHR30558) containing an N-terminal
  transmembrane alpha-helix (residues 20-39) with the invariant proton-binding
  aspartate residue Asp23 (within 20-PLVDVMLVLLIIFIITVPVM-39) and a C-terminal
  periplasmic domain (residues 40-137). Encoded at the 5' end of the syntenic
  exbD5-exbB4-tonB-bfrD1 (VPARA_25800-VPARA_25830) ferric-siderophore uptake
  cluster, ExbD5 forms a central transmembrane dimer inside the inner-membrane
  ExbB4 pentamer pore, coupling proton translocation via Asp23 to periplasmic
  conformational changes that energize TonB (VPARA_25820) and drive active
  outer-membrane ferric-siderophore import through BfrD1 (VPARA_25830).
