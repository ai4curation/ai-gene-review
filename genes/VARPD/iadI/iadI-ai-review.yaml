      catabolism; iadI (kynB2) is instead dedicated to the iad indole-3-acetic acid catabolic operon.
    action: REMOVE
    reason: InterPro:IPR007325 automatically maps all kynurenine formamidase/cyclase family proteins to
      L-tryptophan catabolic process (GO:0006569). However, VPARA_32130 (iadI / kynB2) is embedded within
      the iad auxin-degradation operon (VPARA_32030-VPARA_32220) and is transcriptionally regulated by
      IadR in response to indole-3-acetic acid (IAA) to produce anthranilic acid from IAA rather than
      L-tryptophan (PMID:36266335).
