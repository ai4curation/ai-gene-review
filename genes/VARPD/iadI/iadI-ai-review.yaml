  label: Variovorax paradoxus
description: IadI (VPARA_32130; annotated as kynB2 in the Variovorax paradoxus strain TBEA6 genome submission,
  Proteomes:UP000035170) is a 270-amino-acid kynurenine formamidase / cyclase-family metallohydrolase
  (PF04199 / IPR007325) encoded within the conserved indole-3-acetic acid (IAA) catabolic operon (iad)
  between iadH and iadJ. The gene symbol iadI is adopted from the syntenic ortholog in the experimentally
  characterized V. paradoxus strain CL14 iad operon (PMID:36266335, PMID:37459330). Within the anthranilate-forming
  iad pathway, which degrades IAA through 2-oxindole-3-acetic acid, dioxindole-3-acetic acid, dioxindole,
  isatin, and isatinic acid to anthranilic acid (whereas N-formylanthranilic acid was not detected by
  metabolomics in PMID:36266335), IadI is proposed to function as a cyclic-amide amidohydrolase (such
  as an isatin hydrolase opening the heterocyclic lactam ring of isatin to isatinic acid) rather than
  a canonical tryptophan-pathway arylformamidase.
