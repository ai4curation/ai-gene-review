suggested_questions:
- question: Does IadI directly hydrolyze N-formylanthranilate (generated from oxidative decarbonylation
    of isatinic acid) or does it also exhibit isatin hydrolase activity?
suggested_experiments:
- description: Assay purified recombinant Variovorax paradoxus IadI (VPARA_32130) in vitro against N-formylanthranilate,
    N-formyl-L-kynurenine, isatin, and isatinic acid to determine kcat/Km values and metal-ion dependence.
  hypothesis: IadI exhibits high catalytic efficiency toward N-formylanthranilate to release anthranilic
    acid and formate as the terminal hydrolytic step of the iad pathway.
  experiment_type: Steady-state enzyme kinetics and HPLC product analysis
