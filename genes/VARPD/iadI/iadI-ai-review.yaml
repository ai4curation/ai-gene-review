suggested_questions:
- question: Does IadI catalyze the hydrolytic ring opening of isatin to isatinic acid (EC 3.5.2.14, cyclic-amide
    hydrolase activity), or does it also cleave linear acyl/formyl-anthranilate intermediates?
suggested_experiments:
- description: Assay purified recombinant Variovorax paradoxus IadI (VPARA_32130) in vitro against isatin,
    isatinic acid, N-formylanthranilate, and N-formyl-L-kynurenine to determine kcat/Km values and metal-ion
    dependence.
  hypothesis: IadI exhibits high catalytic efficiency as a cyclic-amide hydrolase converting isatin to
    isatinic acid in the iad pathway.
  experiment_type: Steady-state enzyme kinetics and HPLC product analysis
