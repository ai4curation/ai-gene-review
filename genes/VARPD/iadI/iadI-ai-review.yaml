  review:
    summary: Automated IEA to arylformamidase activity (EC 3.5.1.9) from IPR007325 is laterally modified
      to cyclic-amide C-N hydrolase activity (GO:0016812) to reflect the detected isatin -> isatinic acid
      conversion in the iad pathway.
    action: MODIFY
    reason: The automated IEA to GO:0004061 (arylformamidase activity, EC 3.5.1.9, a linear-amide hydrolase
      under GO:0016811 that cleaves N-formyl-L-kynurenine or N-formylanthranilic acid in tryptophan catabolism)
      derives from InterPro:IPR007325 (KFase/CYL) and the submitted EC 3.5.1.9 annotation on UniProtKB:A0A0H2M433
      (V. paradoxus strain TBEA6 VPARA_32130 / kynB2). However, the PF04199 (Cyclase) / IPR007325 family
      also includes bacterial metal-dependent cyclic-amide hydrolases such as isatin hydrolase (EC 3.5.2.14,
      under GO:0016812) that hydrolyze the heterocyclic lactam ring of isatin to isatinic acid. Because
      13C6-IAA metabolomics of the orthologous V. paradoxus strain CL14 iad pathway (PMID:36266335) directly
      detected isatin and isatinic acid en route to anthranilic acid—and did not detect N-formylanthranilic
      acid—GO:0004061 is laterally modified to GO:0016812 (hydrolase activity, acting on carbon-nitrogen
      (but not peptide) bonds, in cyclic amides).
