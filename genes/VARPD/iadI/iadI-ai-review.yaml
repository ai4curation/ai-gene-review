  label: Variovorax paradoxus
description: IadI (VPARA_32130; annotated as kynB2 in genome submissions) is a 270-amino-acid kynurenine
  formamidase / cyclase-family hydrolase (PF04199 / IPR007325, EC 3.5.1.9) encoded within the conserved
  indole-3-acetic acid (IAA) catabolic operon (iad) of Variovorax paradoxus (between iadH and iadJ). Within
  the anthranilate-forming iad pathway, which degrades IAA sequentially through 2-oxindole-3-acetic acid,
  dioxindole-3-acetic acid, dioxindole, isatin, and isatinic acid to anthranilic acid, IadI provides the
  amidohydrolase/arylformamidase activity that cleaves the acyl/formyl group from ring-opened oxidized
  indole intermediates to yield anthranilic acid.
