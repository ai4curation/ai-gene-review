taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: >-
  Ferric uptake regulation protein Fur1 (VPARA_18200, A0A0H2M8T9; synonym fur)
  in Variovorax paradoxus strain TBEA6 is a 139-amino-acid cytosolic
  homodimeric metalloregulator of the Fur family (NCBIfam NF006999, Pfam
  PF01475, InterPro IPR002481, PANTHER PTHR33202:SF2) encoded on genomic contig
  JZWI01000008 (EMBL KLN57112.1). Fur1 comprises an N-terminal winged-helix
  DNA-binding domain (Gene3D 1.10.10.10, InterPro IPR036388) and a C-terminal
  dimerization and metal-binding domain (InterPro IPR043135) housing two
  distinct metal-coordination sites per monomer: a structural Zn(2+) site
  coordinated by four conserved cysteines at Cys92, Cys95 (92-CTSC-95), Cys132,
  and Cys135 (132-CGDC-135; PIRSR PIRSR602481-1), and a regulatory Fe(2+)
  (or Mn(2+)) sensing site coordinated by His86, Asp88 (within 85-THHDH-89),
  Glu107, and His124 (PIRSR PIRSR602481-2). Under iron-replete conditions,
  Fe(2+)-loaded holo-Fur1 binds conserved Fur-box operator sequences in target
  promoters and acts as a transcriptional repressor of iron-acquisition and
  siderophore biosynthesis/import genes, whereas iron limitation demetallates
  the regulatory site and derepresses siderophore-mediated iron uptake.
