- id: file:VARPD/pstB/pstB-uniprot.txt
  title: "UniProtKB record A0A0D0L7E0 (A0A0D0L7E0_VARPD) - Phosphate import ATP-binding protein PstB from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_10450 (pstB, A0A0D0L7E0) is a 259-aa peripheral inner-membrane ABC
      ATPase subunit (InterPro IPR005670, CDD cd03260, NCBIfam TIGR00972,
      PANTHER PTHR43423:SF3, PROSITE PS50893) with a Walker A ATP-binding site
      at residues 45-52 (45-GPSGCGKS-52).
    record_section: ["FT:DOMAIN", "FT:BINDING"]
    supporting_text: "FT   DOMAIN          13..254\nFT                   /note=\"ABC transporter\"\nFT                   /evidence=\"ECO:0000259|PROSITE:PS50893\"\nFT   BINDING         45..52\nFT                   /ligand=\"ATP\"\nFT                   /ligand_id=\"ChEBI:CHEBI:30616\"\nFT                   /evidence=\"ECO:0000256|PROSITE-ProRule:PRU00434\""
- id: PMID:2646285
  title: Specific amino acid residues in both the PstB and PstC proteins are required
    for phosphate transport by the Escherichia coli Pst system.
  findings:
  - statement: >-
      Substitutions at Walker A residues Gly48 and Lys49 in E. coli PstB
      (corresponding to Gly50 and Lys51 in VPARA_10450) abolish phosphate
      transport through the Pst system and cause constitutive derepression of
      alkaline phosphatase.
    supporting_text: "The amino acid substitutions Gly-48----Ile and Lys-49----Gln, resulting from the pstB mutations, caused the loss of phosphate transport through the Pst system and the derepression of alkaline phosphatase activity. The residues Gly-48 and Lys-49 are key residues in the putative nucleotide-binding site."
- id: PMID:3881386
  title: "Phosphate-specific transport system of Escherichia coli: nucleotide sequence and gene-polypeptide relationships."
  findings:
  - statement: >-
      Establishes the sequence and organization of pstB within the
      phoS-pstC-pstA-pstB-phoU operon.
    supporting_text: "The complete sequence is transcribed counterclockwise, in the order phoS pstC pstA pstB phoU."
- id: PMID:24563032
  title: The PhoU protein from Escherichia coli interacts with PhoR, PstB, and metals
    to form a phosphate-signaling complex at the membrane.
  findings:
  - statement: >-
      PstB is the dimeric cytoplasmic ATPase of the PstSCAB importer and
      directly interacts with PhoU to form the membrane-associated phosphate
      signaling complex.
    supporting_text: "We have demonstrated using bacterial two-hybrid analysis and confirmatory coelution experiments that PhoU interacts with PhoR through its PAS (Per-ARNT-Sim) domain and that it also interacts with PstB, the cytoplasmic component of the transporter."
suggested_questions:
- question: >-
    How does ATP binding versus hydrolysis at the PstB (VPARA_10450) dimer
    interface remodel its interaction with PhoU (VPARA_10440) to toggle PhoR1
    (VPARA_10420) between its kinase and phosphatase states?
  experts:
  - McCleary WR
suggested_experiments:
- description: >-
    Purify recombinant Variovorax paradoxus PstB (A0A0D0L7E0) and PhoU
    (A0A0H2MBK2) and quantify their interaction in the presence of ATP, ADP,
    and non-hydrolyzable ATP-gamma-S by pull-down and size-exclusion
    chromatography.
  hypothesis: >-
    PstB forms a nucleotide-state-dependent complex with PhoU that is
    stabilized in the high-phosphate transport conformation (PMID:24563032).
