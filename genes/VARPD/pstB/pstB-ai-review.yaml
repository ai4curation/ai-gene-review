description: >-
  Phosphate import ATP-binding protein PstB (VPARA_10450, A0A0D0L7E0) is the
  259-amino-acid cytoplasmic nucleotide-binding ATPase subunit of the
  high-affinity PstSCAB ABC orthophosphate importer in Variovorax paradoxus
  strain TBEA6, encoded on genomic contig JZWI01000005 (EMBL KLN58033.1)
  between pstA (VPARA_10460) and phoU (VPARA_10440) within the
  phoR1-phoB1-phoU-pstB-pstA-pstC-pstS-ppx cluster (VPARA_10420-VPARA_10490).
  PstB folds into a P-loop ABC ATPase domain (residues 13-254; PROSITE PS50893,
  Pfam PF00005, CDD cd03260, InterPro IPR005670, NCBIfam TIGR00972, PANTHER
  PTHR43423:SF3) preserving the Walker A ATP-binding motif (45-GPSGCGKS-52,
  including Gly50 and Lys51), the ABC signature motif (156-LSGGQQQRLCIAR-168,
  PROSITE PS00211), the Walker B catalytic glutamate (Glu181 in
  176-VLLLDEPCSALD-187), and the switch histidine (His212). A PstB homodimer
  associates peripherally with the cytoplasmic face of the inner-membrane
  PstCA permease to couple ATP hydrolysis to orthophosphate import, and also
  physically interacts with PhoU to transmit the phosphate-transport signaling
  state to the PhoR1 sensor kinase.
