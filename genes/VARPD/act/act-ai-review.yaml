- id: PMID:19001372
  title: 3-mercaptopropionate dioxygenase, a cysteine dioxygenase homologue, catalyzes
    the initial step of 3-mercaptopropionate catabolism in the 3,3-thiodipropionic acid-degrading
    bacterium variovorax paradoxus.
  findings:
  - statement: >-
      Tn5::mob disruption of act (encoding a family III acyl-CoA-transferase) in
      Variovorax paradoxus TBEA6 causes accumulation of 3-sulfinopropionate
      during cultivation on 3,3'-thiodipropionic acid, demonstrating its role in
      activating 3-sulfinopropionate to 3-sulfinopropionyl-CoA.
    supporting_text: "Insertion of Tn5::mob in a gene putatively coding for a family III acyl-CoA-transferase resulted in the accumulation of 3-sulfinopropionate during cultivation on 3,3-thiodipropionic acid, indicating that this compound is further metabolized to 3-sulfinopropionyl-CoA and subsequently to propionyl-CoA."
- id: PMID:24317404
  title: Identification of 3-sulfinopropionyl coenzyme A (CoA) desulfinases within the
    Acyl-CoA dehydrogenase superfamily.
  findings:
  - statement: >-
      Demonstrates that the adjacent AcdTBEA6 (VPARA_05440, B9U6P5) desulfinates
      3-sulfinopropionyl-CoA to propionyl-CoA and sulfite and that Variovorax
      paradoxus TBEA6 grows on 3-sulfinopropionate as sole carbon and energy
      source.
    supporting_text: "Only AcdTBEA6, AcdN-1, and AcdLB400 desulfinated 3SP-CoA and were thus identified as 3SP-CoA desulfinases within the acyl-CoA dehydrogenase family, although none of these three Acds dehydrogenated any of the tested acyl-CoA thioesters."
suggested_questions:
- question: >-
    Does Variovorax paradoxus TBEA6 Act (B9U6P4, VPARA_05450) prefer
    succinyl-CoA or propionyl-CoA (the product of the adjacent AcdTBEA6
    desulfinase reaction) as the physiological CoA donor for activating
    3-sulfinopropionate in vivo?
  experts:
  - Steinbuchel A
  - Wubbeler JH
  - Schurmann M
suggested_experiments:
- description: >-
    Heterologously express and purify Variovorax paradoxus TBEA6 Act (B9U6P4)
    and measure steady-state kinetic parameters (Km, kcat) for
    3-sulfinopropionate with succinyl-CoA, propionyl-CoA, and acetyl-CoA as
    CoA donors by HPLC-ESI-MS and coupled assay with purified AcdTBEA6
    (B9U6P5).
  hypothesis: >-
    Act catalyzes reversible CoA transfer from succinyl-CoA and/or
    propionyl-CoA (forming a catalytic CoA-recycling loop with AcdTBEA6) to
    3-sulfinopropionate to generate 3-sulfinopropionyl-CoA.
