  review:
    summary: >-
      Core molecular function; Act is a family III CoA-transferase (Pfam
      PF02515, InterPro IPR003673) that activates 3-sulfinopropionate to
      3-sulfinopropionyl-CoA in the Variovorax paradoxus TBEA6 TDP catabolic
      pathway.
    action: ACCEPT
    reason: >-
      Act (B9U6P4, VPARA_05450) belongs to the family III CoA-transferase
      superfamily (Pfam PF02515, InterPro IPR003673, PANTHER PTHR48207:SF3) and
      is required in Variovorax paradoxus TBEA6 to convert 3-sulfinopropionate
      into 3-sulfinopropionyl-CoA prior to desulfination by Acd (PMID:19001372,
      PMID:24317404). Because GO lacks a specific leaf term for
      3-sulfinopropionate CoA-transferase activity, GO:0008410 is the most
      specific accurate term and is accepted.
    supported_by:
