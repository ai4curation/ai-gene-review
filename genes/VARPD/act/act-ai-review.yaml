    3-sulfinopropionate to 3-sulfinopropionyl-CoA during catabolism of
    3,3'-thiodipropionic acid and 3-mercaptopropionate in Variovorax paradoxus
    TBEA6, supplying the substrate for 3-sulfinopropionyl-CoA desulfinase Acd
    (VPARA_05440).
