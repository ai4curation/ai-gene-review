proposed_new_terms:
- proposed_name: succinyl-CoA:3-sulfinopropionate CoA-transferase activity
  proposed_definition: >-
    Catalysis of the transfer of a CoA group from succinyl-CoA (or
    propionyl-CoA) to 3-sulfinopropanoate to form 3-sulfinopropanoyl-CoA and
    succinate (or propanoate).
  justification: >-
    Genetic characterization of Variovorax paradoxus TBEA6 act (B9U6P4,
    VPARA_05450; PMID:19001372) demonstrates that this family III
    CoA-transferase converts 3-sulfinopropionate into 3-sulfinopropionyl-CoA
    for subsequent desulfination by Acd (B9U6P5, VPARA_05440; PMID:24317404).
