      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR003673; CoA-Trfase_fam_III."
- term:
    id: GO:0033877
    label: succinyl-CoA:(R)-benzylsuccinate CoA-transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:2.8.3.15
  review:
    summary: >-
      Automated WGS/EMBL EC 2.8.3.15 mis-mapping; Act converts
      3-sulfinopropionate to 3-sulfinopropionyl-CoA in aerobic TDP catabolism
      rather than catalyzing anaerobic benzylsuccinate CoA transfer.
    action: REMOVE
    reason: >-
      GO:0033877 was assigned via GO_REF:0000003 from the automated WGS EMBL
      qualifier EC=2.8.3.15 on KLN58430.1. Succinyl-CoA:(R)-benzylsuccinate
      CoA-transferase (EC 2.8.3.15, BbsEF) is a heterodimeric alpha2beta2
      enzyme of anaerobic toluene degradation, whereas Variovorax paradoxus
      TBEA6 Act (B9U6P4, VPARA_05450) is a single-chain 398-aa family III
      CoA-transferase encoded immediately adjacent to 3-sulfinopropionyl-CoA
      desulfinase acd (VPARA_05440, B9U6P5) and directly shown by Tn5::mob
      mutagenesis to activate 3-sulfinopropionate to 3-sulfinopropionyl-CoA
      during aerobic 3,3'-thiodipropionic acid degradation (PMID:19001372,
      PMID:24317404).
    supported_by:
    - reference_id: PMID:19001372
      supporting_text: "Insertion of Tn5::mob in a gene putatively coding for a family III acyl-CoA-transferase resulted in the accumulation of 3-sulfinopropionate during cultivation on 3,3-thiodipropionic acid, indicating that this compound is further metabolized to 3-sulfinopropionyl-CoA and subsequently to propionyl-CoA."
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      asserted_value: GO:0033877
      corrected_value: GO:0008410
      corrected_label: CoA-transferase activity
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        EMBL WGS submission KLN58430.1 assigned EC 2.8.3.15
        (succinyl-CoA:(R)-benzylsuccinate CoA-transferase), which UniProt
        propagated to GO:0033877 via GO_REF:0000003, whereas Act activates
        3-sulfinopropionate to 3-sulfinopropionyl-CoA (GO:0008410; PMID:19001372).
