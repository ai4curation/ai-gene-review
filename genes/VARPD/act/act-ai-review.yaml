description: Act (Act(TBEA6), VPARA_05450, KLN58430.1) is a 398-amino-acid cytosolic homodimeric (96 +/-
  3 kDa) succinyl-CoA:3-sulfinopropionate CoA-transferase (EC 2.8.3.-; family III CoA-transferase Pfam
  PF02515, InterPro IPR003673) characterized in Variovorax paradoxus strain TBEA6. Encoded immediately
  upstream of the 3-sulfinopropanoyl-CoA desulfinase gene acd (B9U6P5, VPARA_05440), Act catalyzes the
  reversible transfer of CoA from succinyl-CoA (apparent Vmax = 44.6 umol min^-1 mg^-1, Km = 0.08 mM;
  kcat = 36.0 s^-1), itaconyl-CoA, or glutaryl-CoA to 3-sulfinopropionate (3SP; apparent Vmax = 46.8 umol
  min^-1 mg^-1, Km = 5.9 mM; kcat = 37.7 s^-1) to form 3-sulfinopropanoyl-CoA (3SP-CoA) during the catabolism
  of 3,3'-thiodipropionate (TDP) and 3-sulfinopropionate.
