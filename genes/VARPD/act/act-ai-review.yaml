- id: PMID:23772073
  title: Succinyl-CoA:3-sulfinopropionate CoA-transferase from Variovorax paradoxus strain TBEA6, a novel
    member of the class III coenzyme A (CoA)-transferase family.
  findings:
  - statement: Directly clones, purifies, and characterizes Act(TBEA6) (B9U6P4) from Variovorax paradoxus
      TBEA6 as a succinyl-CoA:3-sulfinopropionate CoA-transferase of the class III CoA-transferase family.
    supporting_text: 'The act gene of Variovorax paradoxus TBEA6 encodes a

      succinyl-CoA:3-sulfinopropionate coenzyme A (CoA)-transferase, Act(TBEA6)

      (2.8.3.x), which catalyzes the activation of 3-sulfinopropionate (3SP), an

      intermediate during 3,3''-thiodipropionate (TDP) degradation.'
  - statement: Shows that purified Act(TBEA6) is a 96 +/- 3 kDa homodimer that uses succinyl-CoA (Km =
      0.08 mM, Vmax = 44.6 umol min^-1 mg^-1), itaconyl-CoA, or glutaryl-CoA to convert 3-sulfinopropionate
      (Km = 5.9 mM, Vmax = 46.8 umol min^-1 mg^-1) into 3-sulfinopropanoyl-CoA.
    supporting_text: 'Analytical size

      exclusion chromatography revealed a homodimeric structure with a molecular mass

      of 96 ± 3 kDa. Enzyme assays identified succinyl-CoA, itaconyl-CoA, and

      glutaryl-CoA as potential CoA donors and unequivocally verified the conversion

      of 3SP to 3SP-CoA. Kinetic studies revealed an apparent V(max) of 44.6 μmol

      min(-1) mg(-1) for succinyl-CoA, which corresponds to a turnover number of 36.0

      s(-1) per subunit of Act(TBEA6). For 3SP, the apparent V(max) was determined as

      46.8 μmol min(-1) mg(-1), which corresponds to a turnover number of 37.7 s(-1)

      per subunit of Act(TBEA6). The apparent K(m) values were 0.08 mM for

      succinyl-CoA and 5.9 mM for 3SP.'
  - statement: Demonstrates that an unmarked delta-act deletion mutant still grows on TDP and 3SP (indicating
      a backup 3SP-activating enzyme in V. paradoxus TBEA6), whereas the original Tn5::mob insertion in
      act blocked 3SP growth via a polar effect on the downstream acd gene (B9U6P5).
    supporting_text: 'Nonetheless, the V. paradoxus Δact mutant did

      not reproduce the phenotype of the Tn5::mob-induced mutant. This defined

      deletion mutant was able to utilize TDP or 3SP as the sole carbon source, like

      the wild type. Complementation of the Tn5::mob-induced mutant with

      pBBR1MCS5::acdDPN7 partially restored growth on 3SP, which indicated a polar

      effect of the Tn5::mob transposon on acd(TBEA6), located downstream of

      act(TBEA6).'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary biochemical and genetic characterization of V. paradoxus TBEA6 Act (B9U6P4).
- id: PMID:19001372
  title: 3-mercaptopropionate dioxygenase, a cysteine dioxygenase homologue, catalyzes the initial step
    of 3-mercaptopropionate catabolism in the 3,3-thiodipropionic acid-degrading bacterium variovorax
    paradoxus.
  findings:
  - statement: Identifies the V. paradoxus TBEA6 act locus via Tn5::mob mutagenesis and shows that insertion
      in this family III acyl-CoA-transferase gene causes accumulation of 3-sulfinopropionate during growth
      on 3,3'-thiodipropionic acid, indicating further metabolism of 3-sulfinopropionate via 3-sulfinopropionyl-CoA
      to propionyl-CoA.
    supporting_text: 'Insertion of Tn5::mob in a gene

      putatively coding for a family III acyl-CoA-transferase resulted in the

      accumulation of 3-sulfinopropionate during cultivation on 3,3-thiodipropionic

      acid, indicating that this compound is further metabolized to

      3-sulfinopropionyl-CoA and subsequently to propionyl-CoA.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Initial transposon mutagenesis and metabolic elucidation of the V. paradoxus TBEA6 3,3'-thiodipropionate
      catabolic pathway.
- id: PMID:24317404
  title: Identification of 3-sulfinopropionyl coenzyme A (CoA) desulfinases within the Acyl-CoA dehydrogenase
    superfamily.
  findings:
  - statement: Characterizes the downstream enzyme Acd(TBEA6) (B9U6P5), which cleaves the 3-sulfinopropanoyl-CoA
      product of Act(TBEA6) into propanoyl-CoA and sulfite.
    supporting_text: 'Only AcdTBEA6, AcdN-1, and AcdLB400 desulfinated 3SP-CoA and

      were thus identified as 3SP-CoA desulfinases within the acyl-CoA dehydrogenase

      family, although none of these three Acds dehydrogenated any of the tested

      acyl-CoA thioesters.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Characterizes the immediately downstream 3SP-CoA desulfinase step in the same V. paradoxus
      TBEA6 gene cluster.
