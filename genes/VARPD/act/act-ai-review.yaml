  label: Variovorax paradoxus
description: >-
  Acyl-CoA-transferase family III protein Act (VPARA_05450, B9U6P4; MetaCyc
  MONOMER-18547) in Variovorax paradoxus strain TBEA6 is a genetically
  characterized 398-amino-acid cytosolic CoA-transferase of the CaiB/BaiF
  family III fold (Pfam PF02515, InterPro IPR003673, SUPFAM SSF89796, PANTHER
  PTHR48207:SF3) encoded on genomic contig JZWI01000003 (EMBL KLN58430.1)
  immediately adjacent to 3-sulfinopropionyl-CoA desulfinase acd (VPARA_05440,
  KLN58429.1, B9U6P5) and near 3-mercaptopropionate dioxygenase mdo
  (VPARA_05600, KLN58445.1, B9U5L8). In the Variovorax paradoxus TBEA6
  3,3'-thiodipropionic acid (TDP) catabolic pathway, Act transfers a CoA moiety
  (from succinyl-CoA or propionyl-CoA) to 3-sulfinopropionate (3SP) to form
  3-sulfinopropionyl-CoA (3SP-CoA), which is then desulfinated by Acd to
  propionyl-CoA and sulfite; transposon disruption of act abolishes TDP
  utilization and causes extracellular accumulation of 3-sulfinopropionate.
