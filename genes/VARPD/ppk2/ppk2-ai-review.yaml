taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: Ppk2 (VPARA_00520, KLN58690.1) is a 268-amino-acid cytosolic polyphosphate kinase 2 (PPK2)-family
  phosphotransferase in Variovorax paradoxus strain TBEA6 (Pfam PF03976, InterPro IPR022300 PPK2-rel_1,
  NCBIfam TIGR03709, PANTHER PTHR34383:SF3). It adopts a single-domain thymidylate kinase-like P-loop
  NTPase fold (residues 31-253) containing the conserved Walker A motif (GMDSSGK, residues 64-70), Walker
  B carboxylate, and alpha-helical lid module characteristic of PPK2 enzymes that catalyze reversible
  polyphosphate-dependent phosphorylation of purine nucleotides.
