description: >-
  Taurine import ATP-binding protein TauB1 (VPARA_03660, A0A0H2MNF8) in
  Variovorax paradoxus strain TBEA6 is a 262-amino-acid peripheral
  inner-membrane ATPase subunit (InterPro IPR003439, PANTHER PTHR42788:SF18) of
  the TauABC ATP-binding cassette (ABC) taurine importer complex. Encoded as
  the middle gene of the syntenic tauA-tauB1-tauC (VPARA_03650-VPARA_03670)
  operon on genomic contig JZWI01000003 (consecutive EMBL CDS accessions
  KLN58254.1-KLN58256.1) immediately between the periplasmic taurine-binding
  protein tauA (VPARA_03650, KLN58254.1) and the transmembrane permease tauC
  (VPARA_03670, KLN58256.1), TauB1 contains an ABC nucleotide-binding domain
  (PROSITE PS50893, Pfam PF00005, residues 6-235) with a conserved Walker A
  P-loop ATP-binding motif at residues 40-47 (40-GASGCGKT-47) that hydrolyzes
  ATP to drive active import of taurine across the cytoplasmic membrane.
