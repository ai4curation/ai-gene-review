- id: PMID:2215649
  title: High specificity of a phosphate transport protein determined by hydrogen bonds.
  findings:
  - statement: >-
      High-resolution (1.7 A) crystal structure of bacterial periplasmic
      phosphate-binding protein (PstS) reveals the atomic features responsible
      for orthophosphate selectivity and exclusion of sulfate.
    supporting_text: "We report here the highly refined 1.7 A resolution X-ray structure of the liganded form of the phosphate-binding protein. The structure reveals the atomic features responsible for phosphate selectivity, either in monobasic or dibasic form, and the exclusion of sulphate."
- id: PMID:6321434
  title: "Structural gene for the phosphate-repressible phosphate-binding protein of Escherichia coli has its own promoter: complete nucleotide sequence of the phoS gene."
  findings:
  - statement: >-
      Establishes that phoS (pstS) encodes the periplasmic phosphate-binding
      protein exported via a cleavable N-terminal signal sequence.
    supporting_text: "The complete nucleotide sequence of the phoS gene, the structural gene for the phosphate-repressible, periplasmic phosphate-binding protein Escherichia coli K-12, was determined. The phosphate-binding protein is synthesized in a precursor form which includes an additional N-terminal segment containing 25 amino acid residues, with the general characteristics of a signal sequence."
- id: PMID:3881386
  title: "Phosphate-specific transport system of Escherichia coli: nucleotide sequence and gene-polypeptide relationships."
  findings:
  - statement: >-
      Determines the complete sequence and gene-polypeptide organization of the
      phoS (pstS)-pstC-pstA-pstB-phoU operon.
    supporting_text: "The complete sequence is transcribed counterclockwise, in the order phoS pstC pstA pstB phoU."
- id: PMID:24563032
  title: The PhoU protein from Escherichia coli interacts with PhoR, PstB, and metals
    to form a phosphate-signaling complex at the membrane.
  findings:
  - statement: >-
      Synthesizes the subunit architecture and signaling role of the PstSCAB
      type I ABC phosphate importer and its coupling through PhoU to PhoR-PhoB.
    supporting_text: "The Pst proteins form a type I ATP-binding cassette (ABC) importer that exhibits high-affinity, P i -specific transport ( 18 – 20 ). PstS is the periplasmic P i -binding protein, PstC and PstA are integral membrane proteins that form the pore through which P i passes, and PstB is the dimeric, cytoplasmic ATPase."
suggested_questions:
- question: >-
    How do the multiple PstS paralogs encoded in the Variovorax paradoxus TBEA6
    genome differ from the canonical operon-encoded PstS (VPARA_10480) in
    orthophosphate binding affinity, pH optimum, and ability to dock onto the
    PstCA (VPARA_10470/VPARA_10460) permease?
  experts:
  - McCleary WR
  - Quiocho FA
suggested_experiments:
- description: >-
    Express and purify mature recombinant VPARA_10480 (residues 25-345) and
    measure its binding affinity and selectivity for orthophosphate, arsenate,
    and sulfate by isothermal titration calorimetry (ITC) across pH 5.5-8.0.
  hypothesis: >-
    Mature VPARA_10480 binds inorganic orthophosphate with submicromolar
    affinity and discriminates strictly against sulfate.
