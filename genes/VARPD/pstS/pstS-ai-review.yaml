  label: Variovorax paradoxus
description: >-
  Periplasmic high-affinity phosphate-binding protein PstS (VPARA_10480,
  A0A0H2M7F6) of the PstSCAB ABC-type inorganic orthophosphate importer in
  Variovorax paradoxus strain TBEA6 is a 345-amino-acid precursor encoded on
  genomic contig JZWI01000005 (EMBL KLN58036.1) within the conserved
  phoR1-phoB1-phoU-pstB-pstA-pstC-pstS-ppx phosphate starvation regulon gene
  cluster (VPARA_10420-VPARA_10490). PstS comprises a 24-residue N-terminal
  Sec signal peptide (residues 1-24) that directs export across the inner
  membrane into the outer membrane-bounded periplasmic space, and a mature
  periplasmic polypeptide (residues 25-345, PRO_5002596677) folding into a
  two-domain Venus flytrap-type periplasmic binding protein-like II domain
  (Pfam PF12849, CDD cd13565, InterPro IPR005673, NCBIfam TIGR00975, PANTHER
  PTHR42996:SF1). PstS binds inorganic orthophosphate with submicromolar
  affinity in the periplasm and delivers it to the inner-membrane PstC-PstA
  permease channel energized by the cytoplasmic PstB ATPase dimer, while also
  participating with PstCAB and PhoU in sensing extracellular phosphate
  sufficiency to regulate the PhoR1-PhoB1 two-component system.
