  label: Variovorax paradoxus
description: >-
  Fur-family zinc uptake transcriptional repressor Zur (VPARA_33720, A0A0H2LYR2)
  in Variovorax paradoxus strain TBEA6 is a 149-amino-acid cytosolic
  homodimeric metalloregulator (Pfam PF01475, CDD cd07153, InterPro IPR002481,
  PANTHER PTHR33202) encoded on genomic contig JZWI01000017 (EMBL KLN55348.1).
  Zur comprises an N-terminal winged-helix DNA-binding domain (Gene3D
  1.10.10.10, InterPro IPR036388, SUPFAM SSF46785) and a C-terminal
  dimerization and metal-sensing domain (InterPro IPR043135) housing a
  four-cysteine structural Zn(2+)-binding site at Cys96, Cys99 (96-CGSC-99),
  Cys133, and Cys136 (133-CAAC-136; PIRSR PIRSR602481-1) together with a
  regulatory metal-sensing site containing His90 (within 87-HHHHYFH-93) and
  His125. Under zinc-replete conditions, Zn(2+)-bound holo-Zur binds
  cis-regulatory Zur-box operator sequences to repress transcription of
  high-affinity zinc acquisition genes and maintain cellular zinc ion
  homeostasis, whereas zinc limitation triggers derepression.
