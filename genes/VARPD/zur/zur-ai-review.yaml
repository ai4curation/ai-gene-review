- id: file:VARPD/zur/zur-uniprot.txt
  title: "UniProtKB record A0A0H2LYR2 (A0A0H2LYR2_VARPD) - Zinc uptake regulation protein Zur from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_33720 (zur, A0A0H2LYR2) is a 149-aa Fur-family zinc uptake
      transcriptional repressor (PANTHER PTHR33202, Pfam PF01475, CDD cd07153,
      InterPro IPR002481) with a four-cysteine structural Zn(2+)-binding site
      (Cys96, Cys99, Cys133, Cys136; PIRSR PIRSR602481-1) and a regulatory
      metal-binding site (His90, His125).
    record_section: ["CC:COFACTOR"]
    supporting_text: "CC   -!- COFACTOR:\nCC       Name=Zn(2+); Xref=ChEBI:CHEBI:29105;\nCC         Evidence={ECO:0000256|PIRSR:PIRSR602481-1};\nCC       Note=Binds 1 zinc ion per subunit. {ECO:0000256|PIRSR:PIRSR602481-1};"
  reference_review:
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      asserted_value: "DE   RecName: Full=Ferric uptake regulation protein {ECO:0000256|RuleBase:RU364037};"
      corrected_value: "Zinc uptake regulation protein Zur"
      cause: OVER_PROPAGATION
      confidence: CONFIRMED
      explanation: >-
        Broad Fur-superfamily rules RuleBase:RU364037 and PIRSR:PIRSR602481-2
        assigned 'Ferric uptake regulation protein' (Synonym fur) and
        Fe(2+)/Mn(2+) cofactor binding at His90/His125 to VPARA_33720, whereas
        VPARA_33720 is the zinc uptake transcriptional repressor Zur (GN
        Name=zur, PANTHER PTHR33202 ZINC UPTAKE REGULATION PROTEIN), distinct
        from the Variovorax paradoxus ferric uptake regulator Fur1
        (VPARA_18200, A0A0H2M8T9).
suggested_questions:
- question: >-
    Does Variovorax paradoxus Zur (VPARA_33720) solely repress the high-affinity
    ZnuABC zinc uptake system and zinc-free ribosomal paralogs under zinc
    sufficiency, or does it also cross-regulate parts of the lanthanide /
    siderophore / heavy-metal homeostasis network?
  experts:
  - Helmann JD
  - Outten CE
suggested_experiments:
- description: >-
    Purify recombinant Variovorax paradoxus Zur (A0A0H2LYR2) and perform
    electrophoretic mobility shift assays (EMSAs) and ChIP-seq in wild-type
    versus Δzur strains grown under Zn(2+)-chelated (TPEN) and Zn(2+)-replete
    conditions.
  hypothesis: >-
    Zn(2+) binding at the His90/His125 regulatory site allosterically activates
    Zur binding to palindromic Zur-box operators upstream of high-affinity
    Zn(2+) importer genes to repress their transcription under zinc sufficiency.
