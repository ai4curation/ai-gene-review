- question: Which residues of the winged-helix-turn-helix fold in Variovorax paradoxus PqqD (VPARA_00930)
    form the beta-sheet augmentation interface with the N-terminal leader sequence of PqqA versus the
    docking interface with PqqE (VPARA_00920)?
suggested_experiments:
- description: Measure the binding affinity (Kd) and stoichiometry of purified Variovorax paradoxus PqqD
    (A0A0H2M992) for synthetic V. paradoxus PqqA peptide and PqqE (A0A0H2MPV4) by isothermal titration
    calorimetry (ITC) and native mass spectrometry.
  hypothesis: V. paradoxus PqqD binds the N-terminal leader motif of PqqA with sub-micromolar affinity
