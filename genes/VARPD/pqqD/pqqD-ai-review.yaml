- id: PMID:25817994
  title: PqqD is a novel peptide chaperone that forms a ternary complex with the radical S-adenosylmethionine
    protein PqqE in the pyrroloquinoline quinone biosynthetic pathway.
  findings:
  - statement: Surface plasmon resonance, isothermal titration calorimetry, and native mass spectrometry
      demonstrate that PqqD is a cofactor-less peptide chaperone that binds the precursor peptide PqqA
      tightly (Kd ~ 200 nM) and forms a 1:1:1 ternary PqqA-PqqD-PqqE complex.
    supporting_text: Moreover, using SPR and isothermal calorimetry techniques, we establish for the
      first time that MePqqD binds MePqqA tightly (KD ∼200 nm). The formation of a ternary MePqqA-D-E
      complex was captured by native mass spectrometry and the KD for the MePqqAD-MePqqE interaction
      was found to be ∼5 μm.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes PqqD as a cofactor-less RiPP peptide chaperone binding PqqA and PqqE.
- id: PMID:26961875
  title: Demonstration That the Radical S-Adenosylmethionine (SAM) Enzyme PqqE Catalyzes de Novo Carbon-Carbon
    Cross-linking within a Peptide Substrate PqqA in the Presence of the Peptide Chaperone PqqD.
  findings:
  - statement: Demonstrates that PqqD is strictly required for PqqE-catalyzed radical SAM carbon-carbon
      cross-linking between the glutamate and tyrosine side chains of PqqA.
    supporting_text: These results indicate that PqqE, in conjunction with PqqD, carries out the first
      step in PQQ biosynthesis
  - statement: Confirms that PqqD binds tightly to PqqA and enters into a catalytically productive ternary
      complex with PqqE.
    supporting_text: PqqD was shown to bind tightly to PqqA and to enter into a ternary complex with
      PqqE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biochemical demonstration that PqqD is essential for PqqE-catalyzed PqqA cross-linking.
- id: PMID:32731194
  title: Biogenesis of the peptide-derived redox cofactor pyrroloquinoline quinone.
  findings:
  - statement: Reviews structural and biophysical evidence that PqqD is a small, cofactor-less monomeric
      peptide recognition protein (RRE) that binds PqqA and guides its Glu and Tyr residues into the
      PqqE active site.
    supporting_text: The missing factor has turned out to be PqqD, a small, cofactor-less protein that
      primarily exists as a free protein (and occasionally as a C-terminal fusion protein of PqqC or
      an N-terminal fusion of PqqE) (Figure 1D).[12]
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Confirms that PqqD is cofactor-less and binds the peptide precursor PqqA rather than
      quinones.
