  label: Variovorax paradoxus
description: PqqD (PqqA binding protein, VPARA_00930, A0A0H2M992) in Variovorax paradoxus is a 98-amino-acid
  cofactor-less RiPP recognition element (RRE) peptide chaperone (HAMAP MF_00655, InterPro IPR008792,
  InterPro IPR022479, NCBIfam TIGR03859, Pfam PF05402) encoded between pqqC (VPARA_00940) and pqqE (VPARA_00920)
  in the pqqBCDE gene cluster. PqqD binds the unmodified precursor peptide PqqA with nanomolar affinity
  and forms a ternary PqqA-PqqD-PqqE complex that presents the conserved glutamate and tyrosine residues
  of PqqA to the active site of the radical SAM cyclase PqqE for initiating carbon-carbon cross-link
  formation in pyrroloquinoline quinone (PQQ) biosynthesis.
