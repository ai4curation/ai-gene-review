proposed_new_terms: []
suggested_questions:
  - question: >-
      Does Variovorax paradoxus UreF (VPARA_50930) protect urease maturation
      against mis-metallation by excess cytoplasmic Zn(2+) in heavy-metal-rich
      rhizosphere soils?
suggested_experiments:
  - hypothesis: >-
      VPARA_50930 (UreF) gates the GTPase activity of UreG to prevent
      noncognate Zn(2+) incorporation into apo-UreABC during metal stress.
    description: >-
      Compare GTP hydrolysis rates and nickel vs. zinc occupancy of
      reconstituted Variovorax paradoxus UreDFG-apourease complexes containing
      wild-type VPARA_50930 versus a conserved gating-loop Ala variant.
    experiment_type: In vitro reconstitution, GTPase assay, and ICP-MS metal occupancy analysis
