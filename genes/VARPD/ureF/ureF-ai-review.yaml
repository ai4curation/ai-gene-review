  - term:
      id: GO:0016151
      label: nickel cation binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - InterPro:IPR002639
      - UniRule:UR000002805
    review:
      summary: >-
        UniRule over-propagates nickel cation binding to UreF; nickel binding
        and delivery are mediated by UreE and UreG rather than UreF.
      action: REMOVE
      reason: >-
        Biochemical and structural analyses of the bacterial UreD-UreF-UreG
        system establish that UreE and UreG bind and transfer Ni(2+), whereas
        UreF serves as an allosteric scaffold and GTPase-gating factor that
        recruits UreG without directly binding nickel as a metallochaperone
        (PMID:22369361).
      supported_by:
        - reference_id: PMID:22369361
          supporting_text: >-
            UreE functions as a metallochaperone that delivers Ni to a
            UreD-UreF-UreG complex bound to urease apoprotein, with UreG serving as a GTPase
            during enzyme activation.
