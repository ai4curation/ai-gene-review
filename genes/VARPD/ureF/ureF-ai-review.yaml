id: A0A0H2LZ72
gene_symbol: ureF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: >-
  UreF (VPARA_50930) in Variovorax paradoxus is a 223-amino-acid cytoplasmic
  urease accessory protein (HAMAP rule MF_01385, InterPro IPR002639, PANTHER
  PTHR33620:SF1, Pfam PF01730) encoded immediately downstream of ureE
  (VPARA_50940). Within the cytoplasmic UreD-UreF-UreG activation complex bound
  to apo-urease, UreF docks the SIMIBI-class GTPase UreG and gates its GTP
  hydrolysis to ensure faithful installation of the dinickel metallocenter into
  the UreC active site.
references:
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: UniProtKB:A0A0H2LZ72
    title: "UniProtKB entry A0A0H2LZ72 (A0A0H2LZ72_VARPD): Urease accessory protein UreF"
    findings:
      - statement: >-
          VPARA_50930 (A0A0H2LZ72, ureF) is a 223-residue cytoplasmic urease
          accessory protein (HAMAP rule MF_01385, InterPro IPR002639, PANTHER
          PTHR33620:SF1) that forms part of the UreD-UreF-UreG chaperone
          complex required for maturation of the urease nickel metallocenter.
        supporting_text: "CC   -!- FUNCTION: Required for maturation of urease via the functional\nCC       incorporation of the urease nickel metallocenter. {ECO:0000256|HAMAP-\nCC       Rule:MF_01385}."
  - id: PMID:22369361
    title: "Klebsiella aerogenes UreF: identification of the UreG binding site and role in enhancing the fidelity of urease activation."
    findings:
      - statement: >-
          UreF provides the binding surface that recruits UreG to the
          UreD-apourease complex and gates UreG GTPase activity to enhance the
          fidelity of nickel metallocenter assembly against noncognate metals.
        supporting_text: >-
          Further experiments with these complexes provided evidence that
          UreF gates the GTPase activity of UreG to enhance the fidelity of urease
  - id: PMID:21183664
    title: Complete genome sequence of the metabolically versatile plant growth-promoting endophyte Variovorax paradoxus S110.
    findings:
      - statement: >-
          Genomic analysis of Variovorax paradoxus highlights its diverse
          metabolic capabilities in soil and plant-associated environments.
        supporting_text: >-
          Variovorax paradoxus is a microorganism of special interest due to its
          diverse metabolic capabilities, including the biodegradation of both
          biogenic compounds and anthropogenic contaminants.
