    evidence_type: ISS
    original_reference_id: PMID:22369361
    qualifier: enables
    review:
      summary: >-
        UreF promotes nickel incorporation into the UreC active site as a
        component of the UreD-UreF-UreG pre-activation complex.
      action: NEW
      reason: >-
        Inferred from sequence and structural similarity (ISS) to Klebsiella
        aerogenes UreF (PMID:22369361; PANTHER PTHR33620:SF1), which docks UreG
        onto the UreD-apourease complex to promote productive nickel
        incorporation into the urease active site (GO:0018237).
      supported_by:
        - reference_id: PMID:22369361
          supporting_text: >-
            Further experiments with these complexes provided evidence that
            UreF gates the GTPase activity of UreG to enhance the fidelity of urease
