suggested_questions:
- question: >-
    Does Variovorax paradoxus CopA2 (VPARA_21930) function primarily in bulk
    cytoplasmic Cu(+) detoxification under copper stress, or does it also
    deliver Cu(+) to periplasmic cuproenzymes such as cytochrome c oxidase?
  experts:
  - Arguello JM
  - Rensing C
suggested_experiments:
- description: >-
    Construct a ΔcopA2 (VPARA_21930) deletion mutant in Variovorax paradoxus
    TBEA6 and compare CuSO4 and AgNO3 minimum inhibitory concentrations,
    intracellular copper accumulation by ICP-MS, and everted membrane vesicle
    ATP-dependent Cu(+) transport against wild type.
  hypothesis: >-
    Loss of copA2 causes intracellular copper hyperaccumulation and
    hypersensitivity to Cu(+) stress, whereas wild-type CopA2 catalyzes
    vanadate-sensitive, ATP-driven Cu(+) export across the inner membrane.
