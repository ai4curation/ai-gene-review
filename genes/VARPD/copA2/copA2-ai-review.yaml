description: >-
  P1B-1-type Cu(+)-translocating efflux ATPase CopA2 (VPARA_21930, A0A0H2M2H3;
  EC 7.2.2.8) in Variovorax paradoxus strain TBEA6 is a 747-amino-acid
  eight-pass inner-membrane heavy-metal P-type ATPase (NCBIfam TIGR01511
  ATPase-IB1_Cu, InterPro IPR027256, PANTHER PTHR43520:SF8, FunFam
  2.70.150.10:FF:000020) encoded on genomic contig JZWI01000010 (EMBL
  KLN56614.1). CopA2 comprises an N-terminal cytoplasmic heavy-metal-associated
  (HMA) regulatory domain (PROSITE PS50846, Pfam PF00403, CDD cd00371, residues
  13-80) housing the conserved Cu(+)-binding 22-MTCASCV-28 CXXC motif, eight
  RuleBase-annotated transmembrane alpha-helices (residues 98-116, 128-147,
  159-181, 193-212, 349-371, 377-410, 700-719, and 725-742) with the
  intramembrane 390-CPCALGLATP-399 (Cys390-Pro391-Cys392) Cu(+) translocation
  site in TM6, a cytoplasmic actuator (A) domain (Pfam PF00122, with the
  287-TGEP-290 phosphatase loop), and a haloacid dehalogenase (HAD)-like
  catalytic phosphorylation (P) and nucleotide-binding (N) domain (Pfam
  PF00702, PROSITE PS00154, InterPro IPR023299) containing the invariant
  acyl-phosphate acceptor Asp434 (within 434-DKTGTLT-440) and Mg(2+)-binding
  hinge (638-GDGVNDAPALA-648). CopA2 couples ATP hydrolysis to active export
  of monovalent copper (Cu(+)) across the bacterial plasma membrane into the
  periplasm to maintain cellular copper homeostasis.
