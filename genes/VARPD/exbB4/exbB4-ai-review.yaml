- id: UniProtKB:A0A0H2MHH3
  title: "UniProtKB record A0A0H2MHH3 (A0A0H2MHH3_VARPD) - Biopolymer transport protein ExbB from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_25810 (exbB4, A0A0H2MHH3) is a 238-aa inner-membrane protein with
      three transmembrane helices (residues 20-41, 127-150, and 174-195) and a
      MotA/TolQ/ExbB proton-channel domain (Pfam PF01618, residues 100-201),
      belonging to PANTHER subfamily PTHR30625:SF14 (BIOPOLYMER TRANSPORT
      PROTEIN EXBB).
    supporting_text: "FT   DOMAIN          100..201\nFT                   /note=\"MotA/TolQ/ExbB proton channel\"\nFT                   /evidence=\"ECO:0000259|Pfam:PF01618\""
- id: PMID:20420522
  title: "TonB-dependent transporters: regulation, structure, and function."
  findings:
  - statement: >-
      Outer-membrane TonB-dependent siderophore transporters require the
      inner-membrane TonB-ExbB-ExbD complex to harvest the proton-motive force
      across the cytoplasmic membrane and transduce energy to the outer
      membrane.
    supporting_text: "These transporters show high affinity and specificity for metal chelates called siderophores and require energy derived from the protonmotive force across the inner membrane to transport them (33, 87). To tap this energy source, TBDTs must interact with an inner membrane protein complex consisting of TonB, ExbB, and ExbD (72)."
- id: PMID:37219427
  title: Energization of Outer Membrane Transport by the ExbB ExbD Molecular Motor.
  findings:
  - statement: >-
      ExbB forms a pentameric inner-membrane pore enclosing an ExbD dimer that
      harvests the cytoplasmic-membrane proton-motive force and transmits it to
      TonB to open outer-membrane TonB-dependent transporters.
    supporting_text: "ExbB forms a pentamer with a pore inside, in which an ExbD dimer resides. This complex harvests the energy of the pmf and transmits it to TonB."
suggested_questions:
- question: >-
    Can the several exbB/exbD paralogs in Variovorax paradoxus TBEA6 functionally
    substitute for exbB4 (VPARA_25810) and exbD5 (VPARA_25800) in energizing the
    co-localized TonB (VPARA_25820) and BfrD1 (VPARA_25830) ferric-siderophore
    transport system?
  experts:
  - Buchanan SK
  - Celia H
  - Noinaj N
suggested_experiments:
- description: >-
    Construct single ΔexbB4 (VPARA_25810) and double ΔexbB4 ΔexbD5 deletion
    mutants in Variovorax paradoxus TBEA6 and measure ferric-siderophore uptake
    and iron-limited growth compared with ΔtonB (VPARA_25820).
  hypothesis: >-
    Deletion of exbB4 impairs BfrD1-mediated ferric-siderophore uptake, with any
    residual activity attributable to cross-complementation by TolQ/TolR or
    paralogous ExbB/ExbD complexes.
