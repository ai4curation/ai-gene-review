- term:
    id: GO:0017038
    label: protein import
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN004746216
  review:
    summary: >-
      TreeGrafter over-propagation from opportunistic bacteriophage/colicin
      protein toxin entry in enterobacteria; physiologically ExbB4 energizes
      siderophore-iron uptake rather than protein import.
    action: REMOVE
    reason: >-
      PANTHER TreeGrafter (PTN004746216) propagates GO:0017038 (protein import)
      to ExbB homologs based on the parasitism of the TonB-ExbB-ExbD system by
      group B colicin protein toxins in Escherichia coli. Physiologically,
      VPARA_25810 (exbB4) is co-localized in the exbD5-exbB4-tonB-bfrD1
      (VPARA_25800-VPARA_25830) operon and forms the proton-conducting stator of
      the TonB-ExbB-ExbD complex that powers active outer-membrane import of
      ferric-siderophore chelates, not physiological protein import.
    supported_by:
    - reference_id: PMID:20420522
      supporting_text: "TonB-dependent transporters (TBDTs) are bacterial outer membrane proteins that bind and transport ferric chelates, called siderophores, as well as vitamin B(12), nickel complexes, and carbohydrates. The transport process requires energy in the form of proton motive force and a complex of three inner membrane proteins, TonB-ExbB-ExbD, to transduce this energy to the outer membrane."
    - reference_id: PMID:37219427
      supporting_text: "ExbB forms a pentamer with a pore inside, in which an ExbD dimer resides. This complex harvests the energy of the pmf and transmits it to TonB."
