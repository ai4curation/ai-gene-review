  label: Variovorax paradoxus
description: >-
  Biopolymer transport protein ExbB4 (VPARA_25810) in Variovorax paradoxus
  strain TBEA6 is a 238-amino-acid integral inner-membrane multi-pass protein
   containing three transmembrane alpha-helices (residues 20-41, 127-150, and
  174-195) and a conserved MotA/TolQ/ExbB proton-channel domain (Pfam PF01618,
  InterPro IPR002898, PANTHER PTHR30625:SF14, residues 100-201). Encoded in the
  syntenic exbD5-exbB4-tonB-bfrD1 (VPARA_25800-VPARA_25830) siderophore-uptake
  gene cluster, ExbB4 assembles with ExbD5 (VPARA_25800) and TonB (VPARA_25820)
  into the plasma-membrane TonB-ExbB-ExbD energy-transducing complex, where the
  ExbB pentamer forms the proton-conducting transmembrane stator that harvests
  the cytoplasmic-membrane proton-motive force and transmits mechanical energy
  through TonB to outer-membrane TonB-dependent ferric-siderophore receptors
  such as BfrD1 (VPARA_25830).
