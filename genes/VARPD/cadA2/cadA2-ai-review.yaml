  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: >-
  P1B-type Zn(2+)/Cd(2+)-translocating efflux ATPase CadA2 (VPARA_44980,
  A0A0H2LVW9; EC 7.2.2.12, RHEA:20621) in Variovorax paradoxus strain TBEA6 is
  a 759-amino-acid multi-pass inner-membrane heavy-metal P-type ATPase (NCBIfam
  TIGR01512 ATPase-IB2_Cd, NCBIfam TIGR01525 ATPase-IB_hvy, InterPro IPR027256,
  PANTHER PTHR48085:SF5) encoded on genomic contig JZWI01000024 (EMBL
  KLN54354.1) within the same heavy-metal resistance island as the
  czcA3-czcB-czcC-czcI-czcR-cusS (VPARA_44890-VPARA_44940, KLN54345.1-KLN54350.1)
  cluster. CadA2 comprises an N-terminal cytoplasmic heavy-metal-associated
  (HMA) regulatory domain (CDD cd00371, InterPro IPR006121, containing the
  cysteine-rich 26-CCGSTAC-32 and 57-MDC-59 motifs), six RuleBase-annotated
  transmembrane alpha-helices (residues 140-160, 166-186, 198-214, 368-390,
  705-726, and 732-750) plus the intramembrane metal-translocation segment
  carrying the canonical Cys410-Pro411-Cys412 (410-CPC-412) motif, a cytoplasmic
  actuator (A) domain (Pfam PF00122, residues 251-352, with the 296-TGES-299
  phosphatase loop), and a haloacid dehalogenase (HAD)-like catalytic
  phosphorylation (P) and nucleotide-binding (N) domain (Pfam PF00702, PROSITE
  PS00154, InterPro IPR023299) containing the invariant acyl-phosphate
  acceptor Asp454 (within 454-DKTGTIT-460) and Mg(2+)-binding hinge
  (650-GDGINDAPALA-660). It couples ATP hydrolysis to active export of
  cytoplasmic Zn(2+) and Cd(2+) across the plasma membrane into the periplasm.
