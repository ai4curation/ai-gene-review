- id: PMID:10781534
  title: Deletion analysis of the Escherichia coli taurine and alkanesulfonate transport systems.
  findings:
  - statement: >-
      Deletion and complementation analysis in E. coli showed that SsuABC and
      TauABC form distinct alkanesulfonate and taurine ABC uptake systems whose
      subunits are not functionally exchangeable.
    supporting_text: "Mutants in which only formation of hybrid transporters was possible were unable to grow with sulfonates, indicating that the individual components of the two transport systems were not functionally exchangeable."
- id: PMID:10781557
  title: The ssu locus plays a key role in organosulfur metabolism in Pseudomonas putida S-313.
  findings:
  - statement: >-
      Genetic characterization of the ssu operon identified ssuA, ssuB, and
      ssuC as the three subunits of the ABC-type alkanesulfonate transporter.
    supporting_text: "The first group consists of ssuA , ssuB , and ssuC , which are the genes for a putative ATP-binding cassette (ABC)-type transport system."
suggested_questions:
- question: >-
    Is SsuB2 (VPARA_09230) strictly dedicated to the co-localized SsuA2-SsuC5
    translocon in Variovorax paradoxus TBEA6, or can it also energize any of
    the paralogous SsuC permeases encoded elsewhere in the TBEA6 genome?
  experts:
  - Kertesz MA
  - Leisinger T
suggested_experiments:
- description: >-
    Construct a clean in-frame ΔssuB2 (VPARA_09230) deletion in Variovorax
    paradoxus TBEA6 and measure growth on C2-C8 linear alkanesulfonates and
    sulfonated buffers (HEPES, MOPS) as sole sulfur sources.
  hypothesis: >-
    Deletion of ssuB2 impairs growth on alkanesulfonates imported via the
    VPARA_09230-VPARA_09290 ssu cluster while leaving taurine utilization via
    TauAB1C intact.
