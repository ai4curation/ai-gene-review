description: >-
  Aliphatic sulfonates import ATP-binding protein SsuB2 (VPARA_09230,
  A0A0H2MBB8) in Variovorax paradoxus strain TBEA6 is a 276-amino-acid
  peripheral inner-membrane ATPase subunit (InterPro IPR003439, PANTHER
  PTHR42788:SF17) of the SsuABC ATP-binding cassette (ABC) importer complex.
  Encoded on genomic contig JZWI01000005 (EMBL KLN57912.1) at the 5' end of the
  aliphatic sulfonate uptake and desulfonation gene cluster immediately
  upstream of the transmembrane permease ssuC5 (VPARA_09240, KLN57913.1) and
  the alkanesulfonate monooxygenase ssuD (VPARA_09250, KLN57914.1), and
  clustered with the periplasmic binding protein ssuA2 (VPARA_09270,
  KLN57916.1) and the FMN reductase ssuE (VPARA_09290, KLN57918.1), SsuB2
  contains a conserved ABC nucleotide-binding domain (PROSITE PS50893, Pfam
  PF00005, residues 19-240) with a canonical Walker A P-loop ATP-binding motif
  at residues 51-58 (51-GRSGCGKS-58) that hydrolyzes ATP to energize
  transmembrane import of aliphatic sulfonates across the cytoplasmic membrane.
