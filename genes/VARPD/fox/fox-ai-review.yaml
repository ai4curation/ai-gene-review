- id: PMID:19001372
  title: 3-mercaptopropionate dioxygenase, a cysteine dioxygenase homologue, catalyzes
    the initial step of 3-mercaptopropionate catabolism in the 3,3-thiodipropionic acid-degrading
    bacterium variovorax paradoxus.
  findings:
  - statement: >-
      Elucidates the catabolism of 3,3'-thiodipropionic acid (TDP) via
      cleavage to 3-mercaptopropionate (3MP) and subsequent oxygenation to
      3-sulfinopropionate in Variovorax paradoxus TBEA6.
    supporting_text: "Genotypic characterization of two 3,3-thiodipropionic acid-negative mutants demonstrated the involvement of a bacterial cysteine dioxygenase (EC 1.13.11.22) homologue in the further catabolism of the 3,3-thiodipropionic acid cleavage product 3-mercaptopropionic acid."
suggested_questions:
- question: >-
    Does purified Variovorax paradoxus Fox (VPARA_05580) directly catalyze the
    FAD-dependent oxidative cleavage of 3,3'-thiodipropionic acid (TDP) to
    3-mercaptopropionate and 3-oxopropionate/3-hydroxypropionate in vitro?
  experts:
  - Steinbuchel A
  - Wubbeler JH
suggested_experiments:
- description: >-
    Heterologously express and purify recombinant VPARA_05580 (Fox) from E.
    coli, verify noncovalent or covalent FAD cofactor occupancy by UV-Vis
    spectroscopy, and assay oxidative cleavage of 3,3'-thiodipropionic acid
    (TDP) to 3-mercaptopropionate by HPLC-ESI-MS.
  hypothesis: >-
    Fox catalyzes the initial FAD-dependent oxidative cleavage of TDP into
    3-mercaptopropionate for subsequent dioxygenation by Mdo (VPARA_05600).
