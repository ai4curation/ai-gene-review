  label: Variovorax paradoxus
description: >-
  FAD-dependent oxidoreductase Fox (VPARA_05580, A0A0H2M811; EC 1.-.-.-) in
  Variovorax paradoxus strain TBEA6 is a 474-amino-acid cytosolic flavoprotein
  of the PCMH/vanillyl-alcohol oxidase type-4 FAD-binding oxidoreductase family
  (PROSITE PS51387, Pfam PF01565, Pfam PF02913, InterPro IPR016166, InterPro
  IPR004113) encoded on genomic contig JZWI01000003 (EMBL KLN58443.1) two open
  reading frames upstream of mdo (VPARA_05600, KLN58445.1,
  3-mercaptopropionate dioxygenase) and ~13 open reading frames from act
  (VPARA_05450, KLN58430.1, 3-sulfinopropionate CoA-transferase) and acd
  (VPARA_05440, KLN58429.1, 3-sulfinopropionyl-CoA desulfinase). Fox comprises
  an N-terminal PCMH-type FAD-binding domain (PROSITE PS51387, Pfam PF01565,
  residues 36-217) and a C-terminal FAD-linked oxidase substrate-binding domain
  (Pfam PF02913, InterPro IPR004113); its genomic proximity to mdo suggests a
  candidate role in oxidative organosulfur or hydroxy-acid metabolism, although
  its physiological substrate has not been biochemically established.
