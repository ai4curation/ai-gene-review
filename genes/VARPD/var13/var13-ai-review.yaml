suggested_questions:
- question: What is the physiological cytoplasmic electron donor (e.g., ferredoxin or flavodoxin reductase)
    that transfers electrons to the C-terminal CC-x(10)-C-x(2)-C [2Fe-2S] cluster (Cys222/Cys223/Cys234/Cys237)
    of Var13 during ferric-variobactin reduction in Variovorax paradoxus?
suggested_experiments:
- description: Purify recombinant His-tagged Var13 anaerobically, record UV-Vis and EPR spectra to verify
    [2Fe-2S] cluster assembly, and measure ferrozine-trapped Fe(II) release from ferric-variobactin A
    in the presence of NADPH and ferredoxin-NADP+ reductase.
  hypothesis: Holo-Var13 catalyzes rapid one-electron reduction of Fe(III)-variobactin A to release ferrozine-chelatable
    Fe(II).
  experiment_type: Anaerobic ferric-siderophore reductase assay
proposed_new_terms:
- proposed_name: reductive ferric-siderophore iron release
  proposed_definition: The chemical reactions and pathways resulting in the reduction of Fe(III) complexed
    to an imported siderophore to Fe(II), lowering chelation affinity and releasing bioavailable ferrous
    iron into the cell.
  justification: GO:0033214 (siderophore-iron import into cell) is defined as directed movement across
    the plasma membrane into the cytosol, whereas cytoplasmic FhuF-family ferric-siderophore reductases
    (such as Var13 and E. coli FhuF) act strictly after membrane translocation to catalyze reductive dissociation
    of Fe(II) from the imported ferric-siderophore complex.
  proposed_parent:
    id: GO:0055072
    label: iron ion homeostasis
  supported_by:
  - reference_id: PMID:38590537
    supporting_text: Subsequently, the stable and water soluble siderophore Fe(III) complex is transported
      across the cell membrane into the cytoplasm, where the iron is released from the complex by reduction,
      generating free Fe(II) ions that are accessible for the cell [2–3].
