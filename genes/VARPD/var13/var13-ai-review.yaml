suggested_questions:
- question: What is the physiological cytoplasmic electron donor (e.g., ferredoxin or flavodoxin reductase)
    that transfers electrons to the C-terminal CC-x(10)-C-x(2)-C [2Fe-2S] cluster (Cys230/Cys231/Cys242/Cys245)
    of Var13 during ferric-variobactin reduction in Variovorax paradoxus?
suggested_experiments:
- description: Purify recombinant His-tagged wild-type Var13 and a C230A/C231A cluster-binding mutant
    anaerobically, record UV-Vis and EPR spectra to verify [2Fe-2S] cluster coordination by Cys230/Cys231/Cys242/Cys245,
    and measure ferrozine-trapped Fe(II) release from ferric-variobactin A in the presence of NADPH and
    ferredoxin-NADP+ reductase.
  hypothesis: Holo-Var13 coordinates a [2Fe-2S] cluster via Cys230/Cys231/Cys242/Cys245 and catalyzes
    rapid one-electron reduction of Fe(III)-variobactin A to release ferrozine-chelatable Fe(II).
  experiment_type: Anaerobic ferric-siderophore reductase assay
proposed_new_terms:
- proposed_name: reductive ferric-siderophore iron release
  proposed_definition: The chemical reactions and pathways resulting in the reduction of Fe(III) complexed
    to an imported siderophore to Fe(II), lowering chelation affinity and releasing bioavailable ferrous
    iron into the cell.
  justification: >-
    Existing iron-uptake process terms do not accurately represent post-import cytoplasmic
    reductive dechelation by FhuF-family reductases (such as Var13 and E. coli FhuF): GO:0033214 (siderophore-iron
    import into cell) is restricted by definition to transmembrane transport or endocytosis of ferric-siderophore
    complexes (so EcoCyc's acts_upstream_of_or_within GO:0033214 annotation on E. coli FhuF reflects
    pathway coupling rather than direct participation), while GO:0033215 (reductive iron assimilation)
    is restricted by definition to extracellular reduction via a cell-surface reductase prior to membrane
    transport. A dedicated term under GO:0006879 (intracellular iron ion homeostasis; replacing obsolete
    GO:0055072) and GO:0009237 (siderophore metabolic process, whose definition explicitly notes that
    subsequent release of iron from imported Fe(3+)-siderophores requires enzymatic action) is needed.
  proposed_parent:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  supported_by:
  - reference_id: PMID:38590537
    supporting_text: Subsequently, the stable and water soluble siderophore Fe(III) complex is transported
      across the cell membrane into the cytoplasm, where the iron is released from the complex by reduction,
      generating free Fe(II) ions that are accessible for the cell [2–3].
