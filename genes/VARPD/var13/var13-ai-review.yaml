  label: Variovorax paradoxus
description: 'Var13 (ALG65348.1) is a 261-amino-acid cytoplasmic FhuF-family ferric-siderophore reductase
  encoded in the variobactin (var) hybrid NRPS/PKS lipopeptide siderophore gene cluster of Variovorax
  paradoxus strain P4B (GenBank KT362218). Var13 belongs to the FhuF ferric iron reductase family (PF06276
  / TIGR03951 / IPR008090) and contains a conserved C-terminal CC-x(10)-C-x(2)-C [2Fe-2S] cluster-binding
  motif (residues 222-239: LHRQCCLYYLVPRLGYCGACPLSPE, coordinating via Cys222, Cys223, Cys234, and Cys237)
  characteristic of hydroxamate siderophore iron reductases (note that UniProt FT DOMAIN 66..206 misleadingly
  labels PF06276 as an IucA/IucC-like domain). Following uptake of ferric-variobactin into the cell, Var13
  catalyzes the reduction of siderophore-bound Fe(III) to Fe(II), lowering chelation affinity to release
  bioavailable ferrous iron in the cytoplasm.'
