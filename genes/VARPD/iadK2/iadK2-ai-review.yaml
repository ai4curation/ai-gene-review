  label: Variovorax paradoxus
description: IadK2 (VPARA_32110) is a 388-amino-acid periplasmic solute-binding protein (SBP) encoded
  within the conserved indole-3-acetic acid (IAA) catabolic operon (iad) of Variovorax paradoxus strain
  TBEA6 (Proteomes:UP000035170). While structural and biophysical characterization in PMID:37459330 was
  performed on the orthologous V. paradoxus strain CL14 protein, direct sequence inspection confirms that
  TBEA6 IadK2 (UniProtKB A0A0H2MF78) is the syntenic ortholog and conserves the complete IAA-binding pocket—including
  Ser104 (in GTAGSPGAL, residues 100-108), Phe168, and Trp172 (in GYIGFSDAWGDL, residues 164-175), as
  well as Thr125, Asn126, Arg199, Phe308, and Tyr311—contrasting with the Val100 and Leu168 substitutions
  in the adjacent paralog IadK3 (VPARA_32100 / A0A0H2LZ84). Following cleavage of its N-terminal Sec signal
  peptide (residues 1-27), mature IadK2 folds into a two-lobed subcluster B-III periplasmic binding protein
  architecture (resolved at 2.3 A resolution in PMID:37459330), binds IAA with nanomolar affinity, and
  undergoes a Venus flytrap-like open-to-closed conformational transition upon ligand engagement. In Variovorax,
  IadK2 functions as the high-affinity periplasmic IAA receptor that delivers auxin to the iad-encoded
  type I ABC transporter complex (IadG/IadH/IadJ) prior to oxidative inactivation by the IadD/IadE-IadC
  dioxygenase system, although IadK2 was dispensable for IAA transformation when the pathway was heterologously
  expressed in Escherichia coli.
references:
- id: PMID:32999461
  title: A single bacterial genus maintains root growth in a complex microbiome.
  findings:
  - statement: Identifies the conserved Variovorax auxin-degradation (iad) operon necessary and sufficient
      for reverting auxin-induced root growth inhibition.
    supporting_text: We identify an auxin-degradation operon that is conserved in all available genomes
      of Variovorax and is necessary and sufficient for the reversion of root growth inhibition.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the biological context of the conserved Variovorax iad operon.
- id: PMID:37459330
  title: Structural and biochemical characterization of the key components of an auxin degradation operon
    from the rhizosphere bacterium Variovorax.
  findings:
  - statement: Demonstrates by isothermal titration calorimetry (ITC) and thermal shift assays (TSA) that
      IadK2 binds indole-3-acetic acid (IAA) with nanomolar affinity and selectively prefers IAA over
      other bicyclic or monocyclic auxin analogs.
    supporting_text: IadK2 could engage IAA with nanomolar affinity, whereas no obvious binding was detected
      for IadK3 and IAA (Figs 1C and S1B).
  - statement: Solves the 2.3 A crystal structure of V. paradoxus CL14 IadK2, revealing a two-lobed subcluster
      B-III solute-binding protein architecture, and maps the interdomain IAA-binding pocket by SAXS,
      molecular dynamics, and site-directed mutagenesis of Ser104, Phe168, Trp172, Arg199, Phe308, and
      Tyr311.
    supporting_text: The hinge region comprises 3 linkers (L1–L3) with 2 α-helices in linker L2, resembling
      SBPs in the subcluster B-III (S3A–S3C Fig), which are usually associated with type I ABC transporters
      for aromatic acids uptake [19,20].
  - statement: Shows that double substitution of IadK2 binding-pocket residues Trp172 and Ser104 with
      the corresponding residues of the paralogous IadK3 (W172L/S104V) completely abolishes IAA binding.
    supporting_text: Notably, the double mutation replacing both Trp172 and Ser104 with those of IadK3
      (W172L/S104V) completely abrogated the binding of IAA.
  - statement: Reports that IadK2 contributes to the Variovorax IAA-degradation pathway by facilitating
      IAA transport, although it was dispensable for IAA transformation in engineered Escherichia coli.
    supporting_text: In addition to the IadD/E-IadC proteins, we also found IadK2 may also contribute
      to the IAA-degradation pathway of Variovorax by facilitating IAA transportation, although it was
      found dispensable for E. coli (Fig 6B).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct structural and biophysical characterization of Variovorax paradoxus strain CL14
      IadK2.
