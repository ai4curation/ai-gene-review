  review:
    summary: IadK2 functions as the high-affinity periplasmic solute-binding protein of the iad operon
      ABC transporter system to mediate cellular uptake of the aromatic monocarboxylic acid indole-3-acetic
      acid (IAA).
    action: NEW
    reason: Inferred by curator (IC) from the nanomolar IAA-binding specificity of the conserved IadK2
      pocket (GO:0010011), its subcluster B-III aromatic-acid ABC transporter solute-binding protein architecture,
      and its co-organization with the ABC transporter permease and ATPase subunits (iadG, iadH, iadJ)
      within the Variovorax paradoxus TBEA6 iad auxin-catabolism operon (PMID:37459330), where it facilitates
      IAA import in Variovorax (though dispensable in engineered E. coli). Because GO:0060918 (auxin transport)
      carries an only_in_taxon NCBITaxon:33090 (Viridiplantae) constraint in GO (verified via QuickGO
      /ontology/go/terms/GO:0060918/constraints, retrieved 2026-11-11), bacterial IAA import is annotated
      to the taxon-unconstrained chemical-class term GO:0015718 (monocarboxylic acid transport; verified
      via QuickGO /ontology/go/terms/GO:0015718/constraints, retrieved 2026-11-11).
    supported_by:
    - reference_id: PMID:37459330
      supporting_text: Both IadK3 and IadK2 belong to the B-III subclass of SBPs with a binding specificity
        for aromatic compounds [20]. Despite the significant structural and sequence similarities, the
        2 SBP proteins have different ligand specificity. While IadK3 show no detectable binding, IadK2
        binds to IAA with nanomolar affinity.
