suggested_questions:
- question: What is the structural basis for the biphasic isothermal titration calorimetry (ITC) binding
    isotherm observed when IadK2 engages indole-3-acetic acid?
- question: Should Gene Ontology relax the Viridiplantae-only taxon constraint (only_in_taxon NCBITaxon:33090)
    on GO:0060918 (auxin transport) or introduce a taxon-neutral indole-3-acetic acid import term to cover
    bacterial IAA uptake systems such as the Variovorax IadK2 ABC transporter?
suggested_experiments:
- description: Reconstitute the purified IadG/IadH/IadJ ABC transporter complex in proteoliposomes and
    measure ATP-dependent [3H]-IAA uptake in the presence of wild-type versus W172L/S104V mutant IadK2.
  hypothesis: Wild-type IadK2, but not the IAA-binding-deficient W172L/S104V variant, stimulates ATP-dependent
    IAA translocation across proteoliposome membranes via IadG/IadH/IadJ.
  experiment_type: Proteoliposome transport reconstitution assay
