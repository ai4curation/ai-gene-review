    summary: Automated InterPro2GO projection from the broad leucine/isoleucine/valine-binding protein
      signature (IPR000709); IadK3 is a subcluster B-III aromatic-acid-type SBP in the iad auxin-catabolism
      operon rather than a branched-chain amino acid transporter.
    action: REMOVE
    reason: InterPro:IPR000709 (PR00337) is a broad Type I periplasmic binding protein superfamily motif.
      Structural and biophysical analysis in PMID:37459330 shows that IadK3 belongs to subcluster B-III
      (aromatic acid SBPs), is encoded in the iad auxin-degradation operon, and weakly associates with
      2-oxindole-3-acetic acid (oxIAA) rather than mediating branched-chain amino acid transport.
    supported_by:
    - reference_id: PMID:37459330
      supporting_text: Both IadK3 and IadK2 belong to the B-III subclass of SBPs with a binding specificity
        for aromatic compounds [20]. Despite the significant structural and sequence similarities, the
        2 SBP proteins have different ligand specificity. While IadK3 show no detectable binding, IadK2
        binds to IAA with nanomolar affinity.
