description: IadK3 (VPARA_32100) is a 381-amino-acid periplasmic subcluster B-III ABC transporter solute-binding
  protein (SBP) encoded immediately adjacent to iadK2 within the conserved indole-3-acetic acid (IAA)
  catabolic operon (iad) of Variovorax paradoxus strain TBEA6 (Proteomes:UP000035170). While biophysical
  and structural comparisons in PMID:37459330 were performed on the orthologous V. paradoxus strain CL14
  protein, direct sequence inspection confirms that TBEA6 IadK3 (UniProtKB A0A0H2LZ84) is the syntenic
  ortholog and carries the exact pocket substitutions that distinguish IadK3 from the high-affinity IAA
  receptor IadK2—specifically Val100 in GTSGVPGAM (residues 96-104, corresponding to Ser104 in IadK2)
  and Leu168 in AFIGFSDALGDL (residues 160-171, corresponding to Trp172 in IadK2). Consequently, purified
  CL14 IadK3 shows no detectable binding to IAA or tested natural and synthetic auxin analogs (4-Cl-IAA,
  IBA, IPA, NAA, 2,4-D, and PAA); a weak, unquantified association with 2-oxindole-3-acetic acid (oxIAA)
  was noted in PMID:37459330, and its physiological ligand remains unidentified.
