  label: Variovorax paradoxus
description: IadK3 (VPARA_32100) is a 381-amino-acid periplasmic subcluster B-III ABC transporter solute-binding
  protein (SBP) encoded immediately adjacent to iadK2 within the conserved indole-3-acetic acid (IAA)
  catabolic operon (iad) of Variovorax paradoxus. Although IadK3 shares approximately 70% sequence identity
  and a conserved two-lobed Type I periplasmic binding protein fold with the high-affinity IAA receptor
  IadK2, key IAA-contacting residues in the interdomain binding pocket of IadK2 (including Ser104, Thr125,
  Asn126, and Trp172) are divergent in IadK3. Consequently, purified IadK3 shows no detectable binding
  to IAA or tested natural and synthetic auxin analogs (4-Cl-IAA, IBA, IPA, NAA, 2,4-D, and PAA), but
  weakly associates with 2-oxindole-3-acetic acid (oxIAA), suggesting a specialized periplasmic ligand-binding
  role for a non-IAA aromatic acid or oxidized auxin catabolite.
