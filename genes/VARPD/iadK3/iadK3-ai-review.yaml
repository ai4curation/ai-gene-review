  review:
    summary: Family-level branched-chain amino-acid transport projection from InterPro:IPR000709 / PANTHER:PTHR30483
      is over-annotated for this iad-operon subcluster B-III SBP whose physiological ligand remains unidentified.
    action: MARK_AS_OVER_ANNOTATED
    reason: The automated IEA to GO:0006865 (amino acid transport) derives from InterPro:IPR000709 (Leu_Ile_Val-bd
      / PR00337, branched-chain amino acid transport system / LIV-binding protein family, matched alongside
      PANTHER:PTHR30483 LEUCINE-SPECIFIC-BINDING PROTEIN within the InterPro:IPR028082 Peripla_BP_I superfamily).
      In Variovorax paradoxus strain TBEA6, VPARA_32100 (UniProtKB:A0A0H2LZ84) is the syntenic ortholog
      of strain CL14 IadK3 in the iad auxin-degradation operon and belongs to subcluster B-III (aromatic
      acid SBPs) rather than canonical branched-chain amino-acid transporters (PMID:37459330). However,
      because direct amino-acid binding has not been experimentally tested and the physiological ligand
      of IadK3 remains unknown (it lacks IAA binding due to the Val100 and Leu168 pocket substitutions
      and showed only a weak, unquantified association with 2-oxindole-3-acetic acid), this family-level
      projection is marked MARK_AS_OVER_ANNOTATED.
    supported_by:
    - reference_id: PMID:37459330
      supporting_text: Both IadK3 and IadK2 belong to the B-III subclass of SBPs with a binding specificity
        for aromatic compounds [20]. Despite the significant structural and sequence similarities, the
        2 SBP proteins have different ligand specificity. While IadK3 show no detectable binding, IadK2
        binds to IAA with nanomolar affinity.
