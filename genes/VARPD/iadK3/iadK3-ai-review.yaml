core_functions:
- description: Periplasmic subcluster B-III ABC transporter solute-binding protein encoded in the Variovorax
    paradoxus TBEA6 iad operon that lacks IAA-binding affinity due to conserved pocket substitutions (Val100
    and Leu168, corresponding to S104V and W172L of IadK2); its native physiological ligand remains to
    be established.
