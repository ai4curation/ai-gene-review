suggested_questions:
- question: What is the physiological high-affinity ligand of IadK3 in the plant rhizosphere—does it capture
    downstream oxidized auxin intermediates (such as dioxindole-3-acetic acid or isatinic acid) or a distinct
    root-exuded aromatic acid?
suggested_experiments:
- description: Screen purified IadK3 by thermal shift assay and isothermal titration calorimetry against
    downstream iad pathway intermediates (dioxindole-3-acetic acid, dioxindole, isatin, isatinic acid,
    and anthranilic acid) as well as root exudate phenolic acids.
  hypothesis: IadK3 selectively binds a downstream oxidized indole catabolite or co-exuded rhizosphere
    aromatic acid with sub-micromolar affinity.
  experiment_type: High-throughput thermal shift assay and isothermal titration calorimetry
