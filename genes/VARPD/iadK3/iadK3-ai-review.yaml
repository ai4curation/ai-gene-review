- description: Periplasmic subcluster B-III ABC transporter solute-binding protein encoded in the Variovorax
    iad operon that lacks IAA-binding affinity due to pocket substitutions (S104V/W172L equivalent) and
    weakly associates with oxidized indole-3-acetic acid catabolites such as 2-oxindole-3-acetic acid
    (oxIAA).
