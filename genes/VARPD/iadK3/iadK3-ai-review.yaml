- id: PMID:37459330
  title: Structural and biochemical characterization of the key components of an auxin degradation operon
    from the rhizosphere bacterium Variovorax.
  findings:
  - statement: Demonstrates by ITC and thermal shift assays that IadK3, despite sharing ~70% sequence
      identity with IadK2, exhibits no detectable binding to indole-3-acetic acid (IAA) or auxin analogs
      (4-Cl-IAA, IBA, IPA, NAA, 2,4-D, PAA) due to substitutions at pocket residues corresponding to Ser104,
      Thr125, Asn126, and Trp172 in IadK2.
    supporting_text: Structural comparison revealed several residues located in the binding pocket in
      IadK2 are not conserved in IadK3, such as Trp172, Ser104, Thr125, and Asn126 in IadK2 (S3A, S3B
      and S3E Fig).
  - statement: Reports that IadK3 belongs to the aromatic-acid-binding B-III subcluster of periplasmic
      solute-binding proteins and weakly associates with 2-oxindole-3-acetic acid (oxIAA).
    supporting_text: IadK3 however show no binding with these auxin analogs. Interestingly, we found IadK3
      could weakly associate with oxIAA. The detailed roles of IadK3 and IadK2 in the Variovorax auxin
      degradation pathway, however, remain to be further characterized and defined.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biophysical characterization and structural comparison of Variovorax paradoxus
      IadK3.
