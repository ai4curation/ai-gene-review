- id: PMID:24816778
  title: 'PQQ-dependent methanol dehydrogenases: rare-earth elements make a difference.'
  findings:
  - statement: Establishes that Gram-negative PQQ-dependent methanol and alcohol dehydrogenases are periplasmic
      eight-bladed beta-propeller quinoproteins that coordinate either Ca(2+) (MxaFI-type) or a trivalent
      rare-earth element (REE/lanthanide, XoxF-type) in the active site, with REE coordination requiring
      a specific additional aspartate residue near the catalytic site.
    supporting_text: While structures of MxaFI- and XoxF-MDH are conserved, also regarding the binding
      of PQQ, the accommodation of a REE requires the presence of a specific aspartate residue near the
      catalytic site.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative structural and sequence review of Ca(2+)-dependent MxaF vs REE-dependent
      XoxF PQQ dehydrogenases.
