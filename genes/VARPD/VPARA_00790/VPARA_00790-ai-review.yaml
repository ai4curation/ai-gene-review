taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: VPARA_00790 (A0A0H2MDH4) in Variovorax paradoxus is a 608-amino-acid periplasmic pyrroloquinoline
  quinone (PQQ)-dependent methanol/alcohol dehydrogenase [cytochrome c] subunit (EC 1.1.2.7; NCBIfam TIGR03075,
  InterPro IPR017512, Pfam PF01011, CDD cd10278) containing a cleavable 28-residue N-terminal Sec signal
  peptide (residues 1-28) and a soluble mature eight-bladed beta-propeller quinoprotein catalytic chain
  (residues 29-608) with a conserved vicinal disulfide bond (Cys130-Cys131). The active site coordinates
  a PQQ prosthetic group (via Arg136, Thr180, Trp266, and Asn83) and a catalytic Lewis-acid metal ion
  (via Glu198, Asn286, and Asp328) to oxidize primary alcohols in the periplasm and transfer electrons
  to a periplasmic cytochrome c acceptor. Notably, the active-site loop of VPARA_00790 (325-PYDEWDFDGIN-335)
  carries the Asp328-Phe329-Asp330 (Asp-X-Asp) motif whose second aspartate (Asp330) is characteristic
  of lanthanide/rare-earth-element (REE)-dependent XoxF-type quinoprotein dehydrogenases, making its physiological
  metal cofactor selectivity (Ca(2+) versus trivalent lanthanides) an open experimental question.
