suggested_questions:
- question: Does Variovorax paradoxus VPARA_00790 (A0A0H2MDH4), which possesses the XoxF-like Asp328-Phe329-Asp330
    active-site motif, require trivalent lanthanide ions (La(3+), Ce(3+), Nd(3+)) or Ca(2+) for catalytic
    activity, and what is its physiological alcohol substrate spectrum in the rhizosphere?
suggested_experiments:
- description: Express and purify Variovorax paradoxus VPARA_00790 (A0A0H2MDH4) from cells grown with
    Ca(2+) versus light lanthanides (La(3+), Ce(3+), Pr(3+), Nd(3+)), determine bound metal stoichiometry
    by ICP-MS, and measure PQQ-dependent dehydrogenase kinetics across methanol, ethanol, and short-chain
    diols.
  hypothesis: Because VPARA_00790 contains the diagnostic Asp330 residue two positions C-terminal to the
    catalytic base Asp328 (328-DFD-330), it preferentially coordinates trivalent lanthanides over Ca(2+)
    to catalyze periplasmic alcohol oxidation.
  experiment_type: ICP-MS metal analysis and steady-state quinoprotein dehydrogenase kinetics
