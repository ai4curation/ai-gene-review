  review:
    action: MODIFY
    reason: InterPro IPR017512 (PQQ_MeOH/EtOH_DH) and PIRSR617512-3 automatically map all members of the
      family to calcium ion binding (GO:0005509) at residues 198, 286, and 328. However, VPARA_00790 (A0A0H2MDH4)
      carries the Asp328-Phe329-Asp330 active-site motif containing the second aspartate (Asp330) that
      Keltjens et al. (PMID:24816778) identified as diagnostic of rare-earth-element (lanthanide)-coordinating
      XoxF-type dehydrogenases. Because the physiological metal cofactor of VPARA_00790 (Ca(2+) versus
      Ln(3+)) has not yet been measured experimentally, generalizing GO:0005509 to GO:0046872 (metal ion
      binding) avoids asserting unverified calcium specificity.
