core_functions:
- description: Hybrid type I polyketide synthase / nonribosomal peptide synthetase module (KS-AT-KR-ACP-C)
    that elongates the N-acyl-arginine starter unit with a malonate/methylmalonate ketide unit, reduces
    the beta-keto intermediate to a 3-hydroxy group, and condenses it with the downstream peptide chain
    during variobactin siderophore biosynthesis.
