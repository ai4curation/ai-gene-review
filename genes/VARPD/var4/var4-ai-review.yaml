- id: file:VARPD/var4/var4-bioinformatics/RESULTS.md
  title: Sequence, Topology, and GenBank KT362218.1 Cluster Audit of Var4 (UniProtKB:A0A0N7FMV9)
  findings:
  - statement: Verifies from var4-uniprot.txt that Var4 (2,345 aa) contains 0 signal/transit peptides
      (FT SIGNAL = 0), 0 transmembrane helices (FT TRANSMEM = 0), and 0 PF00501 adenylation domains, supporting
      cytoplasmic localization (GO:0005737) and trans-loading of position-3 aspartate on Var5 (ALG65340.1).
    supporting_text: Var4 (`A0A0N7FMV9`, 2,345 aa) contains 0 signal/transit peptides (`FT SIGNAL` = 0) and 0 transmembrane helices (`FT TRANSMEM` = 0), carries a covalent 4'-phosphopantetheinyl carrier domain (`Ser1468`), and requires cytosolic malonyl-/methylmalonyl-CoA, NADPH, Fe(II), and 2-oxoglutarate cofactors, supporting cytoplasmic localization (`GO:0005737`).
  - statement: >-
      Parses the verbatim GenBank KT362218.1 (41,899 bp) feature table across all 14 CDSs (var1-var14),
      documenting the non-monotonic GenBank protein_id assignment across var1 (ALG65337.1), var2 (ALG65338.1),
      and var3 (ALG65336.1) followed in locus order by var4-var14 (ALG65339.1-ALG65349.1), including upstream
      starter NRPS Var3 (1510..6735, ALG65336.1) and downstream trans-acting NRPS Var5 (13769..16882, ALG65340.1).
    supporting_text: >-
      GenBank `KT362218.1` (`41,899 bp`) contains 14 CDSs (`var1`–`var14`) with non-monotonic `protein_id` assignment across the first three ORFs (`var1` `1..834` = `ALG65337.1` thioesterase, `var2` `812..1513` = `ALG65338.1` phospantetheinyl transferase, `var3` `1510..6735` = `ALG65336.1` nonribosomal peptide synthetase) followed in locus order by `var4`–`var14` (`ALG65339.1`–`ALG65349.1`): var1 (1..834) = ALG65337.1 [thioesterase]; var2 (812..1513) = ALG65338.1 [phospantetheinyl transferase]; var3 (1510..6735) = ALG65336.1 [nonribosomal peptide synthetase]; var4 (6735..13772) = ALG65339.1 [polyketide synthase]; var5 (13769..16882) = ALG65340.1 [nonribosomal peptide synthetase]; var6 (16879..24630) = ALG65341.1 [nonribosomal peptide synthetase]; var7 (24670..31965) = ALG65342.1 [nonribosomal peptide synthetase]; var8 (complement(32061..34508)) = ALG65343.1 [TonB receptor]; var9 (complement(34707..35735)) = ALG65344.1 [fecr-like protein]; var10 (complement(35732..36310)) = ALG65345.1 [RNA polymerase subunit sigma-24]; var11 (complement(36472..37791)) = ALG65346.1 [lysine N-monooxygenase]; var12 (complement(37778..38884)) = ALG65347.1 [n-acetyltransferase]; var13 (complement(38953..39738)) = ALG65348.1 [ferric iron reductase]; var14 (40220..41899) = ALG65349.1 [cyclic peptide transporter].
