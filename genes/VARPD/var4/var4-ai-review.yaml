- description: Type I polyketide synthase module (KS-AT-KR-ACP) that elongates the N-acyl-arginine starter
    unit (supplied by upstream Var3 / ALG65336.1) with a malonate or methylmalonate ketide unit and reduces
    the beta-keto intermediate to form the 4-acylamino-7-guanidino-3-hydroxy-2-methylheptanoyl-S-ACP moiety
    during variobactin siderophore biosynthesis.
