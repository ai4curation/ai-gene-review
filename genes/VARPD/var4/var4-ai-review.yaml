id: A0A0N7FMV9
gene_symbol: var4
aliases:
- ALG65339.1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: Var4 (ALG65339.1; orthologous to VarG in Variovorax sp. H002 and Variovorax boronicumulans)
  is a 2,345-amino-acid hybrid modular type I polyketide synthase / nonribosomal peptide synthetase (PKS/NRPS)
  with an embedded C-terminal TauD/TfdA-family Fe(II)/2-oxoglutarate-dependent dioxygenase domain, encoded
  in the variobactin (var) biosynthetic gene cluster of Variovorax paradoxus strain P4B (GenBank KT362218).
  Var4 comprises an N-terminal beta-ketoacyl synthase domain (residues 16-450, PF00109 / PF02801 / PROSITE
  PS52004), an acyltransferase domain (PF00698), an NADPH-dependent ketoreductase domain (PF08659), a
  4'-phosphopantetheinylated acyl/peptidyl carrier protein domain (residues 1433-1508, modified at Ser1468;
  PF00550 / PROSITE PS50075), an NRPS LCL-type condensation domain (PF00668), and a C-terminal TauD-like
  beta-aspartyl hydroxylase domain (PF02668 / IPR003819). During variobactin/variochelin assembly, Var4
  elongates the N-acyl-arginine starter unit with a malonate/methylmalonate ketide unit to form the gamma-amino
  acid moiety (4-amino-7-guanidino-3-hydroxy-2-methylheptanoate) and catalyzes beta-hydroxylation of the
  adjacent aspartate monomer to generate the photoreactive beta-hydroxyaspartate (Hya) iron-chelating
  group.
