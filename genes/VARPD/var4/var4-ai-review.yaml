    supporting_text: Mining of in-house-sequenced genomes of lytic environmental organisms revealed a
      novel nonribosomal peptide biosynthetic gene cluster in V. paradoxus P4B. The corresponding gene
      cluster was uploaded to the GNP server to generate an automated structure prediction. The prediction
      was modified as the presence of an aspartate β-hydroxylating enzyme led to the conclusion that the
      predicted position 3 aspartate was β-hydroxyaspartate.
