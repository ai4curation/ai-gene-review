  review:
    summary: Var4 is essential for the biosynthesis of the photoreactive lipopeptide siderophore variobactin/variochelin
      and installs the photoreactive beta-hydroxyaspartate iron-chelating moiety.
    action: NEW
    reason: Targeted deletion of the orthologous varG gene in Variovorax sp. H002 abolishes variochelin
      siderophore production (PMID:38590537), and the embedded TauD domain installs the beta-hydroxyaspartate
      ligand responsible for Fe(III) coordination and photolytic Fe(II) release (PMID:26412281, PMID:27023373).
    supported_by:
    - reference_id: PMID:38590537
      supporting_text: To investigate whether the identified var biosynthetic gene cluster is responsible
        for variochelin production, we substituted varG encoding the polyketide synthase (PKS) module
        with a chloramphenicol resistance (cmR) gene cassette, using homologous recombination (Figure
        3b). As a result, the varG knock-out mutant no longer produced 1–5, validating that the var biosynthetic
        gene cluster is indispensable for variochelin production in Variovorax sp. H002 (Figure 3b).
    - reference_id: PMID:38590537
      supporting_text: In particular, the β-hydroxy group at the Asp residue is introduced by the hydroxylase
        domain (TauD) embedded in VarG. This type of hydroxylase reportedly generates ʟ-erythro-Hya, in
        agreement with the proposed structures of variochelins [20].
