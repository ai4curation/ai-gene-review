    label: 2-oxoglutarate-dependent dioxygenase activity
  directly_involved_in:
  - id: GO:0019290
    label: siderophore biosynthetic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:26412281
    supporting_text: Mining of in-house-sequenced genomes of lytic environmental organisms revealed a
      novel nonribosomal peptide biosynthetic gene cluster in V. paradoxus P4B. The corresponding gene
      cluster was uploaded to the GNP server to generate an automated structure prediction. The prediction
      was modified as the presence of an aspartate β-hydroxylating enzyme led to the conclusion that the
      predicted position 3 aspartate was β-hydroxyaspartate.
  - reference_id: PMID:38590537
    supporting_text: In particular, the β-hydroxy group at the Asp residue is introduced by the hydroxylase
      domain (TauD) embedded in VarG. This type of hydroxylase reportedly generates ʟ-erythro-Hya, in
      agreement with the proposed structures of variochelins [20].
suggested_questions:
- question: Does the C-terminal TauD dioxygenase domain of Var4 hydroxylate L-aspartate while it is tethered
    as a thioester on the adjacent NRPS peptidyl-carrier protein domain in trans, or after condensation
    into the growing lipopeptide chain?
suggested_experiments:
- description: Reconstitute the excised C-terminal TauD domain of Var4 in vitro with Fe(II), 2-oxoglutarate,
    and ascorbate using free L-aspartate versus PCP-tethered L-aspartyl-S-PCP as substrates, and quantify
    beta-hydroxyaspartate formation by Marfey's derivatization and LC-MS.
  hypothesis: The Var4 TauD domain selectively hydroxylates PCP-tethered L-aspartate to L-erythro-beta-hydroxyaspartate
    with no activity on free L-aspartate.
  experiment_type: In vitro Fe(II)/2-oxoglutarate dioxygenase assay
