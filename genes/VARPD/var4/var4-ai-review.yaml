- id: PMID:26412281
  title: An automated Genomes-to-Natural Products platform (GNP) for the discovery of modular natural
    products.
  findings:
  - statement: Identifies the hybrid NRPS/PKS variobactin gene cluster (GenBank KT362218) in Variovorax
      paradoxus P4B and demonstrates that it incorporates a polyketide malonate/methylmalonate unit and
      a beta-hydroxylated aspartate residue into variobactin A and B.
    supporting_text: A second Variovorax isolate (V. paradoxus P4B (ref. 32)) was found to possess another
      distinct NRPS/PKS gene cluster, corresponding to a putative lipopeptide (Fig. 2b, Supplementary
      Fig. 17a and Supplementary Table 7). By altering amino-acid composition, macrocyclization status
      and tailoring modifications, we generated a library of 32 structures (Supplementary Fig. 17b) for
      use in GNP analysis of the LC–MS/MS spectrum. The crude extract of V. paradoxus P4B was shown to
      contain a series of candidate hits (Fig. 2b) whose isolation yielded the novel natural products
      variobactin A and B, in spite of several unforeseen amino-acid substitutions
  - statement: Establishes that the aspartate beta-hydroxylating enzyme in the V. paradoxus P4B var cluster
      converts the position 3 aspartate into beta-hydroxyaspartate and that the PKS module incorporates
      malonate or methylmalonate.
    supporting_text: Mining of in-house-sequenced genomes of lytic environmental organisms revealed a
      novel nonribosomal peptide biosynthetic gene cluster in V. paradoxus P4B. The corresponding gene
      cluster was uploaded to the GNP server to generate an automated structure prediction. The prediction
      was modified as the presence of an aspartate β-hydroxylating enzyme led to the conclusion that the
      predicted position 3 aspartate was β-hydroxyaspartate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterization of the V. paradoxus P4B var cluster (KT362218) and its hybrid
      PKS/beta-hydroxyaspartate-containing products variobactin A and B.
- id: PMID:27023373
  title: Variochelins, Lipopeptide Siderophores from Variovorax boronicumulans Discovered by Genome Mining.
  findings:
  - statement: Demonstrates that Variovorax variochelin-family lipopeptide siderophores require a hybrid
      polyketide synthase and that the beta-hydroxyaspartate coordination group confers photoreactivity
      on the Fe(III)-siderophore complex.
    supporting_text: In this paper, we describe the genomics-driven discovery and characterization of
      variochelins, lipopeptide siderophores from the bacterium Variovorax boronicumulans, which thrives
      in soil and freshwater habitats. Variochelins are different from most other lipopeptide siderophores
      in that their biosynthesis involves a polyketide synthase. We demonstrate that the ferric iron complex
      of variochelin A possesses photoreactive properties and present the MS-derived structures of two
      degradation products that emerge upon light exposure.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the role of the PKS module and beta-hydroxyaspartate moiety in photoreactive
      Variovorax lipopeptide siderophores.
- id: PMID:38590537
  title: New variochelins from soil-isolated Variovorax sp. H002.
  findings:
  - statement: Demonstrates by targeted gene replacement (varG::cmR) in Variovorax sp. H002 that the orthologous
      hybrid PKS/TauD gene varG is essential for variochelin A-E biosynthesis.
    supporting_text: To investigate whether the identified var biosynthetic gene cluster is responsible
      for variochelin production, we substituted varG encoding the polyketide synthase (PKS) module with
      a chloramphenicol resistance (cmR) gene cassette, using homologous recombination (Figure 3b). As
      a result, the varG knock-out mutant no longer produced 1–5, validating that the var biosynthetic
      gene cluster is indispensable for variochelin production in Variovorax sp. H002 (Figure 3b).
  - statement: Shows that the TauD dioxygenase domain embedded at the C-terminus of the hybrid PKS protein
      introduces the beta-hydroxyl group on the aspartate residue to generate L-erythro-beta-hydroxyaspartate
      (Hya).
    supporting_text: In particular, the β-hydroxy group at the Asp residue is introduced by the hydroxylase
      domain (TauD) embedded in VarG. This type of hydroxylase reportedly generates ʟ-erythro-Hya, in
      agreement with the proposed structures of variochelins [20].
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Provides direct genetic knockout validation (varG::cmR) and domain-level functional
      assignment of the orthologous hybrid PKS/TauD enzyme in Variovorax.
