- id: PMID:26412281
  title: An automated Genomes-to-Natural Products platform (GNP) for the discovery of modular natural
    products.
  findings:
  - statement: Identifies the Variovorax paradoxus P4B variobactin gene cluster (GenBank KT362218) and
      isolates the secreted lipopeptide siderophores variobactin A and B from culture supernatants.
    supporting_text: A second Variovorax isolate (V. paradoxus P4B (ref. 32)) was found to possess another
      distinct NRPS/PKS gene cluster, corresponding to a putative lipopeptide (Fig. 2b, Supplementary
      Fig. 17a and Supplementary Table 7). By altering amino-acid composition, macrocyclization status
      and tailoring modifications, we generated a library of 32 structures (Supplementary Fig. 17b) for
      use in GNP analysis of the LC–MS/MS spectrum. The crude extract of V. paradoxus P4B was shown to
      contain a series of candidate hits (Fig. 2b) whose isolation yielded the novel natural products
      variobactin A and B, in spite of several unforeseen amino-acid substitutions
  - statement: Deposits the Variovorax paradoxus P4B variobactin gene cluster under GenBank accession
      KT362218.
    supporting_text: 'Accession codes: Genbank: The accession codes for the biosynthetic gene clusters
      for WS9326, variobactin and thanamycin are KT362217, KT362218 and KT362216.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifies the V. paradoxus P4B var gene cluster (KT362218) encoding Var14 and demonstrates
      extracellular secretion of variobactin A and B.
- id: PMID:38590537
  title: New variochelins from soil-isolated Variovorax sp. H002.
  findings:
  - statement: Notes that siderophores are synthesized under iron-deficient conditions and secreted across
      the cell membrane through dedicated transporters to chelate Fe(III) extracellularly.
    supporting_text: Siderophores are abundantly produced under iron-deficient growth conditions and secreted
      through dedicated transporters to form the siderophore Fe(III) complex extracellularly [2–3]. Subsequently,
      the stable and water soluble siderophore Fe(III) complex is transported across the cell membrane
      into the cytoplasm, where the iron is released from the complex by reduction, generating free Fe(II)
      ions that are accessible for the cell [2–3].
  - statement: Places V. paradoxus P4B variobactin within the conserved Variovorax lipopeptide siderophore
      family.
    supporting_text: Moreover, these bacteria produce unique photoreactive siderophores other than variochelins,
      including vacidobactin from V. paradoxus S110, variobactin from V. paradoxus P4B, and imaqobactin
      from Variovorax sp. RKJM285, suggesting their significant role in interactions with both plants
      and other microbes in near-surface soil through iron photocycling [5,11–12].
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Describes the conserved Variovorax var gene cluster and transporter-mediated secretion
      of lipopeptide siderophores.
