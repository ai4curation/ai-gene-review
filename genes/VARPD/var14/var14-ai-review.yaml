taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: Var14 (ALG65349.1) is a 559-amino-acid inner-membrane ATP-binding cassette (ABC) transporter
  transmembrane/ATPase fusion protein (half-transporter) encoded at the 3' boundary of the variobactin
  (var) hybrid NRPS/PKS lipopeptide siderophore gene cluster in Variovorax paradoxus strain P4B (GenBank
  KT362218). Var14 belongs to the SyrD/YojI cyclic peptide and siderophore type I ABC exporter family
  (NCBIfam TIGR01194 / InterPro IPR005898) and combines an N-terminal six-helix ABC type-1 transmembrane
  domain (residues 25-299, PF00664 / PROSITE PS50929) with a C-terminal cytoplasmic ATP-binding cassette
  catalytic domain (residues 336-558, PF00005 / PROSITE PS50893, P-loop Walker A motif at residues 373-380).
  Var14 functions in ATP-driven export of newly synthesized variobactin lipopeptide siderophores across
  the cytoplasmic membrane.
