suggested_questions:
- question: Does Var14 partner with a periplasmic membrane fusion protein (MFP) and an outer-membrane
    TolC-like channel to form a tripartite trans-envelope efflux pump for variobactin secretion?
suggested_experiments:
- description: Generate an in-frame deletion or Walker A K379A point mutation in var14 in Variovorax paradoxus
    P4B and quantify intracellular versus extracellular variobactin A/B levels by LC-MS/MS.
  hypothesis: Inactivation of Var14 reduces extracellular variobactin accumulation and causes intracellular
    retention of the lipopeptide siderophore.
  experiment_type: LC-MS/MS siderophore secretion assay
