- id: PMID:10781534
  title: Deletion analysis of the Escherichia coli taurine and alkanesulfonate transport systems.
  findings:
  - statement: >-
      In-frame deletion and complementation analysis of E. coli ssuABC and
      tauABC demonstrated that SsuABC mediates alkanesulfonate import and its
      subunits are not functionally exchangeable with TauABC.
    supporting_text: "Mutants in which only formation of hybrid transporters was possible were unable to grow with sulfonates, indicating that the individual components of the two transport systems were not functionally exchangeable."
- id: PMID:10781557
  title: The ssu locus plays a key role in organosulfur metabolism in Pseudomonas putida S-313.
  findings:
  - statement: >-
      Operon and complementation analysis identified ssuA, ssuB, and ssuC as
      the three genes encoding the ABC-type sulfonate importer.
    supporting_text: "The first group consists of ssuA , ssuB , and ssuC , which are the genes for a putative ATP-binding cassette (ABC)-type transport system."
suggested_questions:
- question: >-
    Does SsuC5 (VPARA_09240) assemble as a homodimer in the SsuA2B2C5 complex
    of Variovorax paradoxus TBEA6, and what is the functional division of labor
    among the five annotated ssuC paralogs in the TBEA6 genome?
  experts:
  - Kertesz MA
  - Leisinger T
suggested_experiments:
- description: >-
    Construct a ΔssuC5 (VPARA_09240) deletion mutant in Variovorax paradoxus
    TBEA6 and test complementation of aliphatic sulfonate-dependent growth in
    sulfate-free minimal medium.
  hypothesis: >-
    Deletion of ssuC5 abolishes alkanesulfonate import through the
    VPARA_09230-VPARA_09290 locus unless compensated by a paralogous SsuC
    permease.
