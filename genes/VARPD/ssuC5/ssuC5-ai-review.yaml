description: >-
  Putative aliphatic sulfonates transport permease protein SsuC5 (VPARA_09240,
  A0A0H2M6G6) in Variovorax paradoxus strain TBEA6 is a 284-amino-acid
  multi-pass integral inner-membrane subunit (NCBIfam NF008470, PANTHER
  PTHR30151:SF38) of the SsuABC ATP-binding cassette (ABC) importer complex.
  Encoded on genomic contig JZWI01000005 (EMBL KLN57913.1) immediately
  downstream of the ATPase subunit ssuB2 (VPARA_09230, KLN57912.1) and
  immediately upstream of the alkanesulfonate monooxygenase ssuD (VPARA_09250,
  KLN57914.1), with the periplasmic binding protein ssuA2 (VPARA_09270,
  KLN57916.1) and FMN reductase ssuE (VPARA_09290, KLN57918.1) in the same
  cluster, SsuC5 contains five predicted transmembrane alpha-helices (residues
  34-56, 91-114, 126-144, 150-169, and 245-264) and a conserved ABC
  transmembrane type-1 domain (PROSITE PS50928, Pfam PF00528, residues 80-264)
  that forms the membrane translocation pathway for importing aliphatic
  sulfonates into the cytoplasm.
