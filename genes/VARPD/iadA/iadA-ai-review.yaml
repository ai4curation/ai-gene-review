suggested_questions:
- question: Does the heterodimeric IadA/IadB complex catalyze TPP-dependent oxidative decarboxylation
    or C-C cleavage of dioxindole-3-acetic acid (or its ring-opened 2-oxoacid tautomer) to generate isatin/isatinic
    acid in the iad pathway?
suggested_experiments:
- description: Co-express and purify recombinant Variovorax paradoxus IadA and IadB under anaerobic/microaerobic
    conditions to reconstitute [4Fe-4S] clusters and assay TPP- and CoA-dependent turnover of dioxindole-3-acetic
    acid and indole-3-pyruvate by LC-MS/MS.
  hypothesis: Purified IadA/IadB catalyzes TPP-dependent oxidative side-chain cleavage of the oxidized
    IAA intermediate dioxindole-3-acetic acid toward isatin/isatinic acid.
  experiment_type: In vitro enzymatic reconstitution and LC-MS/MS product identification
