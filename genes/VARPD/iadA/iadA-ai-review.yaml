- id: PMID:32999461
  title: A single bacterial genus maintains root growth in a complex microbiome.
  findings:
  - statement: Identifies the conserved Variovorax auxin-degradation (iad) operon required for reverting
      root growth inhibition.
    supporting_text: We identify an auxin-degradation operon that is conserved in all available genomes
      of Variovorax and is necessary and sufficient for the reversion of root growth inhibition.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Discovery of the conserved Variovorax iad operon.
- id: PMID:36266335
  title: Diverse MarR bacterial regulators of auxin catabolism in the plant microbiome.
  findings:
  - statement: Demonstrates that the MarR-family repressor IadR (MarR_73) binds a DNA operator site between
      iadR and iadA to repress transcription of the iad operon in the absence of IAA, and releases DNA
      upon IAA binding to derepress iadA and downstream catabolic genes.
    supporting_text: 'These data (Fig. 2) demonstrate that MarR_73 functions as a repressor of this locus:
      in the absence of IAA, MarR_73 binds to a DNA site between MarR_73 (iadR) and iadA to repress expression
      of the IAA degradation genes. When IAA is present, it binds to MarR_73, releasing MarR_73 from the
      DNA site to allow expression of the IAA degradation genes downstream.'
  - statement: Establishes by comparative phylogenomics across ~180,000 bacterial genomes that iotA/iadA
      and iorB/iadB are exclusive marker genes of iad-like auxin-degrading operons, which catabolize IAA
      via dioxindole-3-acetic acid, isatin, and isatinic acid to anthranilic acid.
    supporting_text: Specifically, for each potential operon, we determined the prevalence of COGs that
      a priori (Extended Data Fig. 4) showed differential prevalence across the two degrading operons
      (for example, iacA, iacB and iacI are markers of the iac operon, while iorB/iadB and iotA/iadA are
      exclusive markers of the iad-like operon).
  - statement: Establishes by LC-MS/MS metabolomics that the Variovorax iad pathway degrades IAA through
      dioxindole, isatin, and isatinic acid to anthranilic acid.
    supporting_text: The intermediates dioxindole, isatin and isatinic acid, and the product anthranilic
      acid were all detected and thus produced in the bacterial cultures. Importantly, catechol, the main
      product of the iac IAA degradation, was not detected in any of the V. paradoxus CL14 samples.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes transcriptional regulation of iadA by IadR and its role as an exclusive
      marker of the iad auxin catabolism pathway.
