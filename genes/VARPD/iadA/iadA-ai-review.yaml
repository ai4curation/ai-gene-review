  label: Variovorax paradoxus
description: IadA (VPARA_32210; also designated IotA) is the 734-amino-acid alpha subunit of the putative
  indolepyruvate/2-oxoacid ferredoxin oxidoreductase complex (IadA/IadB) encoded as the first structural
  gene of the conserved indole-3-acetic acid (IAA) catabolic operon (iad) in Variovorax paradoxus strain
  TBEA6 (Proteomes:UP000035170), immediately downstream of the IadR (MarR_73) operator site. While experimental
  transcriptomics, operator-binding assays, and metabolomics in PMID:36266335 were performed on the orthologous
  V. paradoxus strain CL14 locus, TBEA6 IadA (UniProtKB A0A0H2MF87) is the direct syntenic ortholog and
  contains an N-terminal pyruvate/ferredoxin oxidoreductase domain (IPR002880), a thiamine pyrophosphate
  (TPP)-binding catalytic module (PF02775 / IPR011766), and a C-terminal [4Fe-4S] ferredoxin-type iron-sulfur
  cluster domain (residues 630-661, PROSITE PS51379). Together with the beta subunit IadB (VPARA_32200),
  IadA is an exclusive phylogenomic marker distinguishing anthranilate-producing iad-type bacterial auxin-degradation
  operons from catechol-producing iac-type operons and is coordinately derepressed upon IAA binding to
  IadR, although the specific oxidized indole intermediate processed by IadA/IadB in vivo remains to be
  biochemically defined.
