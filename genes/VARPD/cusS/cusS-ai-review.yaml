core_functions:
  - description: >-
      Inner-membrane two-component sensor histidine kinase (CzcS/CusS) that senses
      elevated periplasmic Zn2+, Cd2+, and Co2+ concentrations via its N-terminal
      periplasmic domain, autophosphorylates at His-233, and transfers the phosphoryl
      group to its cognate response regulator CzcR (VPARA_44930) to induce the CzcCBA
      heavy-metal efflux system.
