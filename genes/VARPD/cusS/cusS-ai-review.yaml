  label: Variovorax paradoxus
description: >-
  Inner-membrane two-component system sensor histidine kinase CusS/CzcS (VPARA_44940;
  443 aa) in Variovorax paradoxus TBEA6, encoded in a bicistronic operon with the response
  regulator czcR (VPARA_44930) immediately downstream of the czcC-czcB-czcA2-czcI heavy-metal
  efflux locus (VPARA_44890-VPARA_44920). Comprises two transmembrane helices (TM1 residues
  21-41 and TM2 preceding the HAMP domain) flanking a periplasmic heavy-metal-sensing domain,
  a cytoplasmic HAMP signal-transducing linker (residues 169-222; PROSITE:PS50885), and a
  C-terminal histidine kinase domain (residues 230-443; PROSITE:PS50109) that undergoes
  ATP-dependent autophosphorylation at His-233 and transfers the phosphoryl group to CzcR
  (Asp-51) in response to periplasmic Zn2+, Cd2+, and Co2+.
