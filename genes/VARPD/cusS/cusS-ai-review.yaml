  - id: PMID:10198000
    title: >-
      Transcriptional organization of the czc heavy-metal homeostasis determinant from
      Alcaligenes eutrophus.
    findings:
      - statement: >-
          Establishes that CzcS and CzcR form a two-component regulatory system involved in
          Zn2+, Co2+, and Cd2+-inducible regulation of czcCBA transcription.
        supporting_text: >-
          Experiments on (i) growth of these strains in liquid culture containing 5 mM Zn2+,
          (ii) induction of the beta-galactosidase in the reporter strains by zinc, cobalt,
          and cadmium, and (iii) cDNA analysis of czcCBA mRNA synthesis under inducing and
          noninducing conditions showed that the CzcRS two-component regulatory system is
          involved in Czc regulation.
        full_text_unavailable: true
