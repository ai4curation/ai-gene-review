description: >-
  Cobalt-zinc-cadmium resistance protein CzcC (VPARA_44910) in Variovorax
  paradoxus strain TBEA6 is a 445-amino-acid outer-membrane factor (OMF, TC
  1.B.17) channel subunit (InterPro IPR003423, InterPro IPR010131, PANTHER
  PTHR30203) encoded at the 3' end of the tripartite czcA3-czcB-czcC
  (VPARA_44890-VPARA_44910) heavy-metal efflux operon. Synthesized as a
  precursor with a 20-residue N-terminal Sec signal peptide (residues 1-20) and
  a 425-residue mature chain (residues 21-445) containing two tandem outer
  membrane efflux protein (OEP) repeats (Pfam PF02321), CzcC assembles into a
  trimeric TolC-like outer-membrane beta-barrel and periplasmic alpha-helical
  tunnel that docks with the periplasmic adaptor CzcB (VPARA_44900) and the
  inner-membrane HME-RND antiporter CzcA3 (VPARA_44890) to form a continuous
  conduit for exporting monoatomic metal cations across the outer membrane.
