references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: UniProtKB:A0A0H2M0U4
  title: "UniProtKB record A0A0H2M0U4 (A0A0H2M0U4_VARPD) - Cobalt-zinc-cadmium resistance protein CzcC from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_44910 (czcC, A0A0H2M0U4) is a 445-aa outer-membrane efflux protein
      containing an N-terminal signal peptide (residues 1-20), a mature chain
      (residues 21-445) with two Pfam PF02321 OEP repeats, and membership in
      InterPro IPR003423 and PANTHER PTHR30203 (OUTER MEMBRANE CATION EFFLUX
      PROTEIN).
    supporting_text: "DR   PANTHER; PTHR30203; OUTER MEMBRANE CATION EFFLUX PROTEIN; 1."
- id: PMID:10559151
  title: CzcD is a heavy metal ion transporter involved in regulation of heavy metal
    resistance in Ralstonia sp. strain CH34.
  findings:
  - statement: >-
      In Ralstonia (Cupriavidus) metallidurans CH34, CzcC assembles with CzcB
      and CzcA into the tripartite CzcCB2A cation-proton antiporter that exports
      cobalt, zinc, and cadmium ions across the cell envelope.
    supporting_text: "The Czc system of Ralstonia sp. strain CH34 mediates resistance to cobalt, zinc, and cadmium through ion efflux catalyzed by the CzcCB(2)A cation-proton antiporter."
- id: PMID:12829273
  title: Efflux-mediated heavy metal resistance in prokaryotes.
  findings:
  - statement: >-
      Tripartite CBA efflux complexes driven by RND antiporters export heavy
      metal cations across both the inner and outer membranes of Gram-negative
      bacteria.
    supporting_text: "The mechanisms of action, physiological functions, and distribution of metal-exporting proteins are outlined, namely: CBA efflux pumps driven by proteins of the resistance-nodulation-cell division superfamily, P-type ATPases, cation diffusion facilitator and chromate proteins, NreB- and CnrT-like resistance factors."
suggested_questions:
- question: >-
    Is CzcC (VPARA_44910) dedicated exclusively to the co-transcribed
    CzcA3-CzcB (VPARA_44890-VPARA_44900) pump in Variovorax paradoxus TBEA6, or
    can it also serve as the shared outer-membrane channel for other CzcA/CzcB
    paralogs lacking an adjacent OMF gene?
  experts:
  - Nies DH
  - Koronakis V
  - Luisi BF
suggested_experiments:
- description: >-
    Construct a ΔczcC (VPARA_44910) deletion mutant in Variovorax paradoxus
    TBEA6 and compare its sensitivity to Zn2+, Co2+, and Cd2+ with that of a
    ΔczcA3 (VPARA_44890) mutant.
  hypothesis: >-
    Deletion of czcC abolishes outer-membrane export of divalent cations by the
    CzcA3-CzcB complex, increasing intracellular metal accumulation and metal
    sensitivity.
