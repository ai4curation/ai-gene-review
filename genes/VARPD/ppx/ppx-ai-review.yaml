  label: Variovorax paradoxus
description: >-
  Exopolyphosphatase Ppx (VPARA_10490) in Variovorax paradoxus strain TBEA6 is
  a 506-amino-acid cytosolic hydrolase (EC 3.6.1.11; InterPro IPR030673,
  PANTHER PTHR30005:SF14, PIRSF PIRSF001267) that catalyzes the processive
  hydrolytic cleavage of terminal orthophosphate (Pi) residues from linear
  inorganic polyphosphate (polyP) chains. Ppx comprises an N-terminal
  Ppx/GppA phosphatase catalytic domain of the ASKHA (actin-like ATPase)
  superfamily (Pfam PF02541, CDD cd24053, residues 23-307) preserving the P1
  (11-DLGSNSFR-18) and P2 (142-DIGGRSTE-149) phosphate- and Mg(2+)-binding
  loops, followed by a C-terminal polyP-binding domain (Pfam PF21447, residues
  315-480), and acts together with polyphosphate kinase Ppk (VPARA_28600) to
  control intracellular inorganic polyphosphate turnover and phosphate
  homeostasis.
