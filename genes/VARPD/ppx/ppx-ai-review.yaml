- id: PMID:23687963
  title: Accumulation of inorganic polyphosphate enables stress endurance and catalytic
    vigour in Pseudomonas putida KT2440.
  findings:
  - statement: >-
      Bacterial exopolyphosphatase (Ppx) catalyzes the hydrolysis of inorganic
      polyphosphate chains to orthophosphate (Pi), operating alongside
      polyphosphate kinase (Ppk) in the intracellular polyphosphate cycle.
    supporting_text: "In addition to Ppk, there is another polyP-modifying enzyme: the so-called exopolyphosphatase (Ppx), that is in charge of polyP hydrolysis to Pi (Figure 1A)."
suggested_questions:
- question: >-
    Is Variovorax paradoxus Ppx (VPARA_10490) allosterically inhibited by the
    alarmone (p)ppGpp during nutrient or heavy-metal stress to favor
    Ppk-mediated polyphosphate accumulation, and does it also hydrolyze pppGpp
    to ppGpp in vivo?
  experts:
  - Nikel PI
  - de Lorenzo V
  - Gray MJ
suggested_experiments:
- description: >-
    Assay recombinant Variovorax paradoxus TBEA6 Ppx (VPARA_10490) in vitro on
    long-chain inorganic polyphosphate and pppGpp substrates in the presence of
    Mg2+/K+ and physiological concentrations of ppGpp, and quantify
    intracellular polyP levels in a Δppx mutant.
  hypothesis: >-
    VPARA_10490 processively hydrolyzes inorganic polyphosphate to Pi in a
    Mg2+-dependent manner and is competitively inhibited by (p)ppGpp during
    stringent stress.
