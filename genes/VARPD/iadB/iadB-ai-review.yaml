suggested_questions:
- question: What is the role of the C-terminal DUF6537 domain (residues 248-458) of IadB in subunit assembly
    or substrate specificity of the IadA/IadB complex?
suggested_experiments:
- description: Generate an unmarked ΔiadAB deletion in Variovorax paradoxus and profile intracellular
    and extracellular IAA catabolites by 13C6-IAA LC-MS/MS metabolomics.
  hypothesis: Deletion of iadAB causes accumulation of upstream oxidized IAA intermediates (such as dioxindole-3-acetic
    acid or isatinic acid) and blocks downstream conversion to anthranilic acid without preventing initial
    IAA oxygenation by IadD/IadE-IadC.
  experiment_type: Targeted gene deletion and 13C6-IAA LC-MS/MS metabolomics
