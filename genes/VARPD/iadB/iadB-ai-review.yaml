  label: Variovorax paradoxus
description: IadB (VPARA_32200; also designated IorB) is the 498-amino-acid beta subunit of the putative
  indolepyruvate/2-oxoacid ferredoxin oxidoreductase complex (IadA/IadB) encoded immediately downstream
  of iadA in the conserved indole-3-acetic acid (IAA) catabolic operon (iad) of Variovorax paradoxus.
  IadB comprises an N-terminal pyruvate/ketoisovalerate oxidoreductase catalytic domain (residues 6-186,
  PF01558 / IPR019752) and a C-terminal DUF6537 domain (residues 248-458, PF20169 / IPR046667) characteristic
  of indolepyruvate oxidoreductase subunit IorB (PANTHER PTHR43854:SF1). Together with IadA, IadB is an
  exclusive phylogenomic marker of anthranilate-producing iad-type bacterial auxin-degradation operons
  and is transcriptionally induced in response to IAA via derepression of IadR.
