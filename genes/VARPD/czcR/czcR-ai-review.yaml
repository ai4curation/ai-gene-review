proposed_new_terms: []
suggested_questions:
  - question: >-
      Does phosphorylated CzcR (VPARA_44930) bind only the czcN/czcC intergenic promoter
      region, or does it also co-regulate the adjacent cadA2 (VPARA_44980) P-type ATPase
      or outer-membrane porin expression in Variovorax paradoxus TBEA6?
suggested_experiments:
  - description: >-
      Perform electrophoretic mobility shift assays (EMSA) and ChIP-seq with purified
      acetyl-phosphate-phosphorylated CzcR (VPARA_44930) across the VPARA_44880-VPARA_44990
      heavy-metal resistance island in Variovorax paradoxus TBEA6.
    hypothesis: >-
      Phospho-CzcR binds conserved direct-repeat OmpR-box motifs upstream of czcN/czcC
      (VPARA_44880/VPARA_44890) and czcI/czcR (VPARA_44920/VPARA_44930) to drive Zn2+/Cd2+/
      Co2+-inducible transcription.
