  label: Variovorax paradoxus
description: >-
  Two-component system OmpR/PhoB-family response regulator CzcR (VPARA_44930; 225 aa) in
  Variovorax paradoxus TBEA6, encoded in an operon with the sensor histidine kinase cusS
  (VPARA_44940) immediately downstream of czcC-czcB-czcA2-czcI (VPARA_44890-VPARA_44920)
  in the VPARA_44880-VPARA_44990 heavy-metal resistance island. Contains an N-terminal
  phosphorelay receiver domain (residues 2-115; Asp-51 phosphorylation site) and a
  C-terminal OmpR/PhoB-type winged-helix DNA-binding domain (residues 123-221) that
  activates transcription of the czcCBA heavy-metal efflux operon in response to
  periplasmic Zn2+, Cd2+, and Co2+ sensed by CusS (CzcS).
