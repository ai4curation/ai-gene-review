proposed_new_terms: []
suggested_questions:
  - question: >-
      Does phosphorylated CzcR (VPARA_44930) bind only the czcA3 promoter region, or does
      it also co-regulate the adjacent cadA2 (VPARA_44980) P-type ATPase or outer-membrane
      porin expression in Variovorax paradoxus TBEA6?
  - question: >-
      Does phosphorylated CzcR (VPARA_44930) act strictly as a direct transcriptional
      activator (GO:0001216 / GO:0045893) of the czcA3-czcB-czcC operon upon metal-induced
      phosphorylation by CusS (VPARA_44940), as suggested by reporter and mRNA induction in
      Cupriavidus metallidurans CH34 (van der Lelie et al. 1997; Grosse et al. 1999,
      PMID:10198000)?
suggested_experiments:
  - description: >-
      Perform electrophoretic mobility shift assays (EMSA) and ChIP-seq with purified
      acetyl-phosphate-phosphorylated CzcR (VPARA_44930) across the VPARA_44890-VPARA_44980
      heavy-metal resistance island in Variovorax paradoxus TBEA6.
    hypothesis: >-
      Phospho-CzcR binds conserved direct-repeat OmpR-box motifs upstream of czcA3
      (VPARA_44890) and czcI/czcR (VPARA_44920/VPARA_44930) to drive Zn2+/Cd2+/Co2+-inducible
      transcription.
