    title: Combined Automated Annotation using Multiple IEA Methods.
    findings: []
  - id: PMID:10198000
    title: >-
      Transcriptional organization of the czc heavy-metal homeostasis determinant from
      Alcaligenes eutrophus.
    findings:
      - statement: >-
          Demonstrates that CzcR and CzcS form a two-component regulatory system involved in
          Zn2+, Co2+, and Cd2+-inducible regulation of the czc heavy-metal resistance
          determinant, and that purified CzcR binds DNA in the 5' region of the czc locus.
        supporting_text: >-
          The CzcR putative response regulator was purified and shown to bind in the 5'
          region of czcN.
        full_text_unavailable: true
      - statement: >-
          Shows using czcR and czcS deletion mutants, reporter assays, and cDNA analysis that
          the CzcRS two-component system regulates czcCBA mRNA synthesis in response to
          zinc, cobalt, and cadmium.
        supporting_text: >-
          Experiments on (i) growth of these strains in liquid culture containing 5 mM Zn2+,
          (ii) induction of the beta-galactosidase in the reporter strains by zinc, cobalt,
          and cadmium, and (iii) cDNA analysis of czcCBA mRNA synthesis under inducing and
          noninducing conditions showed that the CzcRS two-component regulatory system is
          involved in Czc regulation.
        full_text_unavailable: true
