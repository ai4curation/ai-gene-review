core_functions:
  - description: >-
      Two-component system OmpR/PhoB-family response regulator and sequence-specific
      cis-regulatory DNA-binding transcription factor that receives phosphoryl groups at
      Asp-51 from the cognate heavy-metal sensor histidine kinase CusS (VPARA_44940) and
      binds operator DNA via its C-terminal OmpR/PhoB-type winged-helix domain (residues
      123-221) to regulate transcription of the czcCBA heavy-metal efflux operon in
      response to Zn2+, Cd2+, and Co2+.
