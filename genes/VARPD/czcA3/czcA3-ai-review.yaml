suggested_questions:
- question: What are the specific metal cation substrates (e.g., Co2+/Zn2+/Cd2+ vs Cu+/Ag+ or Ni2+) of
    VPARA_44890 (CzcA3) relative to other HME-RND paralogs in Variovorax paradoxus?
suggested_experiments:
- description: Measure minimum inhibitory concentrations (MICs) and intracellular metal accumulation by
    ICP-MS for Zn2+, Cd2+, Co2+, Ni2+, and Cu2+ in a Variovorax paradoxus delta-czcA3 mutant.
  hypothesis: CzcA3 mediates selective efflux of inorganic transition-metal cations and does not transport
    organic xenobiotics.
