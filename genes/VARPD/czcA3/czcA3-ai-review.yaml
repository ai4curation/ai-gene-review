    family (CzcA3)'
  findings:
  - statement: VPARA_44890 (A0A0H2MBF7, czcA3) is a 1054-residue inner-membrane HME-RND (Heavy Metal Efflux
      Resistance-Nodulation-Division) cation/proton antiporter with 12 transmembrane helices and specific
      membership in NCBIfam TIGR00914 (heavy metal efflux pump, CzcA family) and InterPro IPR004763 (CusA-like).
    supporting_text: DR   NCBIfam; TIGR00914; 2A0601; 1.
- id: PMID:21183664
  title: Complete genome sequence of the metabolically versatile plant growth-promoting endophyte Variovorax
    paradoxus S110.
  findings:
  - statement: Variovorax paradoxus genomes encode an expanded repertoire of metabolic and heavy-metal
      resistance determinants enabling survival in contaminated and rhizosphere soils.
    supporting_text: Variovorax paradoxus is a microorganism of special interest due to its diverse metabolic
      capabilities, including the biodegradation of both biogenic compounds and anthropogenic contaminants.
