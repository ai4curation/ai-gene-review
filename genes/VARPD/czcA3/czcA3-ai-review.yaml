taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: CzcA3 (VPARA_44890) in Variovorax paradoxus is a 1054-amino-acid inner-membrane Heavy-Metal
  Efflux Resistance-Nodulation-Division (HME-RND) transporter subunit (NCBIfam TIGR00914, InterPro IPR004763)
  containing 12 transmembrane alpha-helices and two large periplasmic porter loops. Functioning as the
  proton-driven antiporter core of a tripartite CzcCBA trans-envelope efflux pump, it exports toxic divalent
  transition-metal cations (Co2+, Zn2+, Cd2+) from the cytoplasm and periplasm across the outer membrane,
  conferring high heavy-metal resistance in metalliferous and mine-impacted rhizosphere soils.
