suggested_questions:
- question: What are the distinct metal substrate specificities (Co2+/Zn2+/Cd2+ vs Cu+/Ag+ or Ni2+) of
    the multiple CzcA paralogs in Variovorax paradoxus?
suggested_experiments:
- description: Measure minimum inhibitory concentrations (MICs) and intracellular metal accumulation by
    ICP-MS for Zn2+, Cd2+, Co2+, Ni2+, and Cu2+ in a Variovorax paradoxus delta-czcA3 mutant.
  hypothesis: CzcA3 mediates selective efflux of divalent transition-metal cations (Zn2+/Cd2+/Co2+) and
    does not transport organic xenobiotics.
