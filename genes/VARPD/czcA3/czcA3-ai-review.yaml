  label: Variovorax paradoxus
description: CzcA3 (VPARA_44890) in Variovorax paradoxus is a 1067-amino-acid predicted inner-membrane
  Heavy-Metal Efflux Resistance-Nodulation-Division (HME-RND) transporter subunit (NCBIfam TIGR00914,
  InterPro IPR004763, PANTHER PTHR32063:SF24) containing 12 transmembrane alpha-helices and two large
  periplasmic porter loops. Based on HME-RND family membership, CzcA3 functions as the inner-membrane
  proton/cation antiporter component that partners with a periplasmic membrane-fusion adaptor protein
  and an outer-membrane factor channel to drive transmembrane export of monoatomic metal cations.
