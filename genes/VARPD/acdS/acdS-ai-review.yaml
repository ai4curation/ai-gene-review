taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: AcdS (Q6J256, 1A1D_VARPD) is a 338-amino-acid homotrimeric pyridoxal 5'-phosphate (PLP)-dependent
  1-aminocyclopropane-1-carboxylate (ACC) deaminase (EC 3.5.99.7) in Variovorax paradoxus. It catalyzes
  the cyclopropane ring-opening deamination of ACC, the immediate biosynthetic precursor of the plant
  stress hormone ethylene, yielding 2-oxobutanoate (alpha-ketobutyrate) and ammonium. At its active site,
  the PLP cofactor is covalently linked via a Schiff base to Lys51 alongside the nucleophilic residue
  Ser78. In plant-associated Variovorax paradoxus strains, AcdS acts as a rhizosphere ethylene sink that
  lowers stress ethylene accumulation in host roots to maintain root elongation under biotic and abiotic
  stress.
