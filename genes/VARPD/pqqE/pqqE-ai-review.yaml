    Glu-Tyr cross-linked-[PQQ precursor protein] + 5''-deoxyadenosine + L-methionine + H+ (EC 1.21.98.4,
    RHEA:56836).'
  justification: GO:0009975 (cyclase activity) is overly general for the radical-SAM-dependent intramolecular
