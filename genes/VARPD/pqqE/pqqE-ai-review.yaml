suggested_questions:
- question: Which endogenous flavodoxin and flavodoxin reductase in Variovorax paradoxus supply the low-potential
    electrons required for coupled SAM cleavage and PqqA cross-linking by PqqE (VPARA_00920), and what
    cluster type ([2Fe-2S] vs [4Fe-4S]) occupies the SPASM AuxI site in vivo?
suggested_experiments:
- description: Purify anaerobically reconstituted Variovorax paradoxus PqqE (A0A0H2MPV4) and assay SAM
    cleavage and Glu-Tyr cross-linking of synthetic PqqA in the presence of V. paradoxus PqqD (A0A0H2M992)
    by EPR spectroscopy and LC-HRMS/MS.
  hypothesis: Anaerobically reconstituted V. paradoxus PqqE catalyzes PqqD-dependent formation of the
    Glu-Tyr C-C cross-link in PqqA concurrent with 5'-deoxyadenosine and L-methionine generation.
  experiment_type: Anaerobic radical-SAM reconstitution, EPR spectroscopy, and LC-HRMS/MS
proposed_new_terms:
