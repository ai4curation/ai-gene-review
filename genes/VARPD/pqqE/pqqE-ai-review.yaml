  label: Variovorax paradoxus
description: >-
  PqqE (PqqA peptide cyclase, VPARA_00920, A0A0H2MPV4; also annotated as moaA1) in Variovorax
  paradoxus is a 383-amino-acid radical S-adenosyl-L-methionine (SAM) SPASM-domain metalloenzyme (EC 1.21.98.4,
  RHEA:56836; HAMAP MF_00660, InterPro IPR011843, NCBIfam TIGR02109, PANTHER PTHR11228:SF7) encoded at
  the 3' end of the pqqBCDE (VPARA_00950-VPARA_00920) gene cluster. Using a radical SAM [4Fe-4S] cluster
  coordinated by Cys22, Cys26, and Cys29 in its N-terminal core domain (residues 8-223) together with
  auxiliary iron-sulfur clusters in its C-terminal SPASM domain, PqqE reductively cleaves SAM to generate
  a 5'-deoxyadenosyl radical and catalyzes the first committed step of pyrroloquinoline quinone (PQQ)
  biosynthesis: formation of an intramolecular carbon-carbon cross-link between the conserved glutamate
  and tyrosine side chains of the PqqA precursor peptide presented by the peptide chaperone PqqD.
