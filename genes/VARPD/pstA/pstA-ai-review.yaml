description: >-
  Phosphate transport system permease protein PstA (VPARA_10460, A0A0H2M6I3) is
  a 294-amino-acid six-pass inner-membrane subunit of the high-affinity PstSCAB
  ABC orthophosphate importer in Variovorax paradoxus strain TBEA6, encoded on
  genomic contig JZWI01000005 (EMBL KLN58034.1) between pstC (VPARA_10470) and
  pstB (VPARA_10450) within the phoR1-phoB1-phoU-pstB-pstA-pstC-pstS-ppx
  cluster (VPARA_10420-VPARA_10490). PstA comprises six transmembrane
  alpha-helices (residues 30-51, 79-102, 123-144, 150-169, 205-223, and
  267-289) forming a MetI-like type-1 ABC transmembrane domain (PROSITE
  PS50928, Pfam PF00528, CDD cd06261, InterPro IPR005672, NCBIfam TIGR00974,
  NCBIfam NF008430, PANTHER PTHR42922:SF1) and conserves the essential
  transmembrane Arg220 and Glu224 residues (within 219-ARIAGETA-226,
  corresponding to E. coli PstA Arg220) required for orthophosphate
  translocation. PstA heterodimerizes with PstC in the plasma membrane to form
  the transmembrane phosphate translocation pore gated by periplasmic PstS and
  powered by the cytoplasmic PstB ATPase dimer.
