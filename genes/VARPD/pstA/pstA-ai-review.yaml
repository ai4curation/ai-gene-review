  findings:
  - statement: >-
      VPARA_10460 (pstA, A0A0H2M6I3) is a 294-aa six-pass inner-membrane ABC
      permease subunit (InterPro IPR005672, NCBIfam TIGR00974, NCBIfam NF008430,
      PANTHER PTHR42922:SF1, PROSITE PS50928) encoded on contig JZWI01000005
