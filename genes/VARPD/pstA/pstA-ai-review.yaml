- id: PMID:2896188
  title: Arg-220 of the PstA protein is required for phosphate transport through the
    phosphate-specific transport system in Escherichia coli but not for alkaline phosphatase
    repression.
  findings:
  - statement: >-
      Site-directed substitution of Arg220 in E. coli PstA (corresponding to
      Arg220 in VPARA_10460) abolishes phosphate transport through the Pst
      system while preserving alkaline phosphatase repression.
    supporting_text: "The Arg-220----Gln mutation resulted in the loss of phosphate transport through the phosphate-specific transport system, but the alkaline phosphatase activity remained repressed."
- id: PMID:3881386
  title: "Phosphate-specific transport system of Escherichia coli: nucleotide sequence and gene-polypeptide relationships."
  findings:
  - statement: >-
      Establishes the sequence and organization of pstA within the
      phoS-pstC-pstA-pstB-phoU operon.
    supporting_text: "The complete sequence is transcribed counterclockwise, in the order phoS pstC pstA pstB phoU."
- id: PMID:24563032
  title: The PhoU protein from Escherichia coli interacts with PhoR, PstB, and metals
    to form a phosphate-signaling complex at the membrane.
  findings:
  - statement: >-
      PstC and PstA form the integral inner-membrane pore of the PstSCAB ABC
      phosphate importer.
    supporting_text: "PstS is the periplasmic P i -binding protein, PstC and PstA are integral membrane proteins that form the pore through which P i passes, and PstB is the dimeric, cytoplasmic ATPase."
suggested_questions:
- question: >-
    How do the symmetric Arg276/Glu280 residues of PstC (VPARA_10470) and
    Arg220/Glu224 residues of PstA (VPARA_10460) coordinate tetrahedral
    orthophosphate halfway across the inner-membrane translocation pathway?
  experts:
  - McCleary WR
suggested_experiments:
- description: >-
    Generate an Arg220Gln point mutation in VPARA_10460 (pstA) in Variovorax
    paradoxus TBEA6 and measure [32P]orthophosphate uptake rates and PhoB1
    regulon transcription under high- and low-phosphate growth conditions.
  hypothesis: >-
    The Arg220Gln substitution abolishes high-affinity orthophosphate transport
    through PstSCAB while retaining PhoU-mediated repression of PhoR1-PhoB1 in
    phosphate-replete medium (PMID:2896188).
