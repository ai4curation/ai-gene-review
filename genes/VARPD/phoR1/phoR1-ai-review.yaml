description: >-
  Phosphate regulon sensor histidine kinase PhoR1 (VPARA_10420, A0A0H2MMT2; EC
  2.7.13.3) in Variovorax paradoxus strain TBEA6 is a 464-amino-acid
  inner-membrane bifunctional sensor kinase and phospho-PhoB1 phosphatase
  (InterPro IPR014310, NCBIfam TIGR02966, PANTHER PTHR45453:SF1) encoded on
  genomic contig JZWI01000005 (EMBL KLN58030.1) immediately adjacent to its
  cognate response regulator phoB1 (VPARA_10430) at the 5' boundary of the
  phoR1-phoB1-phoU-pstB-pstA-pstC-pstS-ppx cluster (VPARA_10420-VPARA_10490).
  PhoR1 comprises an N-terminal membrane-anchoring region (Pfam PF11808,
  InterPro IPR021766, transmembrane helix at residues 29-45), a cytoplasmic
  Per-ARNT-Sim (PAS) sensory domain (Pfam PF00989, CDD cd00130, InterPro
  IPR000014), and a C-terminal histidine kinase dimerization/phosphoacceptor
  (HisKA, Pfam PF00512, CDD cd00082) and catalytic ATP-binding (HATPase_c,
  Pfam PF02518; PROSITE PS50109, residues 216-436) module housing the
  autocatalytic phosphohistidine acceptor His219 (within 215-NVSHEIRTPL-224).
  When extracellular inorganic phosphate is limiting, PhoR1 autophosphorylates
  at His219 and transfers the phosphoryl group to Asp54 of PhoB1 to activate
  the Pho starvation regulon; when phosphate is abundant, interaction of its
  PAS domain with the PstSCAB-PhoU signaling complex switches PhoR1 into a
  phospho-PhoB1 phosphatase.
