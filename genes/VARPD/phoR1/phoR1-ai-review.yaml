- term:
    id: GO:0016036
    label: cellular response to phosphate starvation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001976051
  review:
    summary: >-
      Core biological process; PhoR1 is the primary sensor kinase that initiates
      the cellular response to inorganic phosphate starvation.
    action: ACCEPT
    reason: >-
      When extracellular Pi drops below ~4 uM, the low-activity state of
      PstSCAB-PhoU relieves inhibition of PhoR1 autokinase activity, triggering
      phosphorylation of PhoB1 and induction of the phosphate starvation
      regulon (PMID:24563032).
    supported_by:
    - reference_id: file:VARPD/phoR1/phoR1-uniprot.txt
      record_section: ["DR:InterPro", "DR:NCBIfam", "DR:PANTHER"]
      supporting_text: "DR   InterPro; IPR014310; Sig_transdc_His_kinase_PhoR.\nDR   NCBIfam; TIGR02966; phoR_proteo; 1.\nDR   PANTHER; PTHR45453; PHOSPHATE REGULON SENSOR PROTEIN PHOR; 1.\nDR   PANTHER; PTHR45453:SF1; PHOSPHATE REGULON SENSOR PROTEIN PHOR; 1."
    - reference_id: PMID:24563032
      supporting_text: "The low-activity-state transporter signals for the high autokinase activity of PhoR, which leads to elevated levels of phospho-PhoB."
