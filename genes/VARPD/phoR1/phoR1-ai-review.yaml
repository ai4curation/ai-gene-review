  title: "UniProtKB record A0A0H2MMT2 (A0A0H2MMT2_VARPD) - Phosphate regulon sensor protein PhoR from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_10420 (phoR1, A0A0H2MMT2; EC 2.7.13.3) is a 464-aa inner-membrane
      sensor histidine kinase (InterPro IPR014310, NCBIfam TIGR02966, PANTHER
      PTHR45453:SF1) containing an N-terminal transmembrane helix (residues
      29-45, Pfam PF11808), a cytoplasmic PAS domain (Pfam PF00989, CDD
      cd00130), and a C-terminal histidine kinase domain (PROSITE PS50109,
      residues 216-436) with autocatalytic phosphohistidine His219.
    record_section: ["FT:TRANSMEM", "FT:DOMAIN"]
    supporting_text: "FT   TRANSMEM        29..45\nFT                   /note=\"Helical\"\nFT                   /evidence=\"ECO:0000256|SAM:Phobius\"\nFT   DOMAIN          216..436\nFT                   /note=\"Histidine kinase\"\nFT                   /evidence=\"ECO:0000259|PROSITE:PS50109\""
- id: PMID:24563032
  title: The PhoU protein from Escherichia coli interacts with PhoR, PstB, and metals
    to form a phosphate-signaling complex at the membrane.
  findings:
  - statement: >-
      PhoR is a bifunctional histidine autokinase and phospho-PhoB phosphatase
      whose cytoplasmic PAS domain interacts with PhoU to sense PstSCAB
      transport activity.
    supporting_text: "PhoR is the bifunctional histidine autokinase/phospho-PhoB phosphatase that donates a phosphoryl group to PhoB when environmental P i is limiting and removes the phosphoryl group from phosphorylated PhoB (PhoB∼P) when environmental P i is abundant ( 11 , 12 )."
suggested_questions:
- question: >-
    How does binding of PhoU (VPARA_10440) to the cytoplasmic PAS domain of
    PhoR1 (VPARA_10420) reorient the HisKA (DHp) and HATPase_c (CA) domains
    around His219 to switch PhoR1 from autokinase to phospho-PhoB1 phosphatase
    activity?
  experts:
  - McCleary WR
suggested_experiments:
- description: >-
    Reconstitute the cytoplasmic PAS-DHp-CA fragment of Variovorax paradoxus
    PhoR1 (A0A0H2MMT2) with phosphorylated PhoB1 (A0A0H2M7F4) and PhoU
    (A0A0H2MBK2) in vitro to measure autophosphorylation at His219,
    phosphotransfer to PhoB1 Asp54, and PhoU-stimulated phospho-PhoB1
    dephosphorylation.
  hypothesis: >-
    PhoR1 exhibits His219 autokinase and PhoB1 phosphotransfer activity in the
    absence of PstB-PhoU, and shifts toward phospho-PhoB1 phosphatase activity
    when bound by the PhoU-PstB complex (PMID:24563032).
