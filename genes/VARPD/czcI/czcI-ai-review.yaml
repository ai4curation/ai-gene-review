core_functions:
  - description: >-
      Periplasmic heavy-metal resistance modulator that fine-tunes expression and activity
      of the CzcCBA RND heavy-metal efflux complex and CzcR-CusS two-component system in
      response to periplasmic cadmium, zinc, and cobalt ions.
    molecular_function:
      id: GO:0046872
      label: metal ion binding
    directly_involved_in:
      - id: GO:0046686
        label: response to cadmium ion
      - id: GO:0010043
        label: response to zinc ion
    supported_by:
      - reference_id: file:VARPD/czcI/czcI-uniprot.txt
        record_section: ["DR:NCBIfam"]
        supporting_text: "DR   NCBIfam; NF045614; efflu_CzcI_Cupr; 1."
      - reference_id: PMID:10198000
        supporting_text: >-
          Induction of czcN, czcI, czcCBA, and czcDRS followed a similar pattern:
          transcription was induced best by 300 microM zinc, less by 300 microM cobalt, and
          only slightly by 300 microM cadmium.
proposed_new_terms: []
suggested_questions:
  - question: >-
      Does the conserved 71-CAVCH-75 motif of VPARA_44920 bind heme c covalently via the
      cytochrome c maturation pathway, or does it coordinate divalent heavy-metal cations
      (Zn2+/Cd2+/Co2+) directly in the periplasm?
  - question: >-
      Does deletion of czcI (VPARA_44920) in Variovorax paradoxus TBEA6 cause constitutive
      upregulation of czcC-czcB-czcA2 transcription via unrepressed CusS/CzcR signaling?
suggested_experiments:
  - description: >-
      Construct an in-frame delta-czcI (VPARA_44920) deletion mutant in Variovorax paradoxus
      TBEA6 and measure czcCBA promoter activity and Zn2+/Cd2+/Co2+ minimum inhibitory
      concentrations compared to wild type.
    hypothesis: >-
      Loss of periplasmic CzcI elevates basal czcCBA transcription at sub-toxic Zn2+/Cd2+
      concentrations, confirming its role as a periplasmic negative modulator of CzcR-CusS
      or CzcCBA signaling.
  - description: >-
      Purify recombinant mature CzcI (residues 21-123) and perform UV-Vis spectroscopy,
      heme staining, and isothermal titration calorimetry with Zn2+, Cd2+, and Co2+.
    hypothesis: >-
      Mature CzcI binds divalent heavy metals via its N-terminal histidine-rich cluster
      (36-HWGHHEHE-43) and/or 71-CAVCH-75 motif to sense periplasmic metal loading.
