  label: Variovorax paradoxus
description: >-
  Periplasmic cobalt-zinc-cadmium resistance modulator CzcI (VPARA_44920; 123 aa) in
  Variovorax paradoxus TBEA6, encoded immediately downstream of the CzcCBA RND heavy-metal
  efflux pump operon (czcC-czcB-czcA2, VPARA_44890-VPARA_44910) and upstream of the
  CzcR-CusS two-component system (czcR-cusS, VPARA_44930-VPARA_44940) within the
  VPARA_44880-VPARA_44990 heavy-metal resistance island. Possesses an N-terminal sec signal
  peptide (residues 1-20) and a mature periplasmic CzcI/DUF2946 domain (residues 21-123;
  InterPro:IPR055013, NCBIfam:NF045614, Pfam:PF11162) containing a histidine-rich motif
  (36-HWGHHEHE-43) and a conserved CXXCH heme/metal-binding motif (71-CAVCH-75) that
  negatively modulates expression of the czcNICBADR-czcS heavy-metal resistance regulon to
  prevent premature or excessive induction of the CzcCBA efflux complex in the periplasm.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms.
    findings: []
  - id: PMID:10198000
    title: >-
      Transcriptional organization of the czc heavy-metal homeostasis determinant from
      Alcaligenes eutrophus.
    findings:
      - statement: >-
          Establishes in Cupriavidus metallidurans CH34 (formerly Alcaligenes eutrophus CH34)
          that czcI is transcribed as a 400-nucleotide transcript and as part of the
          czcNIC-czcCBA heavy-metal homeostasis determinant induced by Zn2+, Co2+, and Cd2+.
        supporting_text: >-
          Induction of czcN, czcI, czcCBA, and czcDRS followed a similar pattern:
          transcription was induced best by 300 microM zinc, less by 300 microM cobalt, and
          only slightly by 300 microM cadmium.
        full_text_unavailable: true
