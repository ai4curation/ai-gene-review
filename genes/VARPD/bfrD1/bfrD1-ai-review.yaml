- id: UniProtKB:A0A0H2M677
  title: "UniProtKB record A0A0H2M677 (A0A0H2M677_VARPD) - Putative TonB-dependent receptor BfrD from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      BfrD1 (VPARA_25830) is a 739-aa outer-membrane TonB-dependent siderophore
      receptor containing a signal peptide (residues 1-17), an N-terminal plug
      domain (Pfam PF07715, residues 60-159), and a C-terminal beta-barrel
      domain (Pfam PF00593, residues 265-709).
    supporting_text: "SUBCELLULAR LOCATION: Cell outer membrane {ECO:0000256|ARBA:ARBA00004571, ECO:0000256|PROSITE-ProRule:PRU01360}; Multi-pass membrane protein"
  - statement: >-
      VPARA_25830 corresponds to EMBL CDS accession KLN56277.1 on genomic contig
      JZWI01000012, where consecutive CDS accessions (KLN56276.1-KLN56277.1) and
      locus tags stepping by 10 place bfrD1 (VPARA_25830) immediately downstream
      of tonB (VPARA_25820, KLN56276.1).
    supporting_text: "DR   EMBL; JZWI01000012; KLN56277.1; -; Genomic_DNA."
- id: PMID:20420522
  title: "TonB-dependent transporters: regulation, structure, and function."
  findings:
  - statement: >-
      Gram-negative outer-membrane TonB-dependent transporters consist of a
      22-stranded beta-barrel occluded by an N-terminal plug domain that binds
      ferric-siderophore chelates on the extracellular side and interacts with
      the TonB-ExbB-ExbD complex on the periplasmic side.
    supporting_text: "The first crystal structures of two Escherichia coli TonB-dependent transporters, ferrichrome transporter (FhuA) (34, 54) and ferric enterobactin transporter (FepA) (10), showed that TBDTs use a 22-stranded β-barrel to span the outer membrane with an unanticipated ‘plug’ domain folded into the barrel interior. The plug domain functions to bind a specific metal chelate at the extracellular side of the membrane and to interact with TonB-ExbB-ExbD at the periplasmic side of the outer membrane."
- id: PMID:26412281
  title: "An automated Genomes-to-Natural Products platform (GNP) for the discovery of modular natural products."
  findings:
  - statement: >-
      Isolation from Variovorax paradoxus P4B extracts yielded the novel
      siderophore natural products variobactin A and B.
    supporting_text: "The crude extract of V. paradoxus P4B was shown to contain a series of candidate hits (Fig. 2b) whose isolation yielded the novel natural products variobactin A and B"
suggested_questions:
- question: >-
    Does BfrD1 (VPARA_25830) serve as the primary outer-membrane receptor for
    endogenous variobactin/vacidobactin ferric-siderophore complexes in
    Variovorax paradoxus, or does it specialize in xenosiderophore
    (ferrichrome/enterobactin) piracy in the rhizosphere?
  experts:
  - Cornelis P
  - Noinaj N
  - Leadbetter JR
suggested_experiments:
- description: >-
    Construct a ΔbfrD1 deletion mutant in Variovorax paradoxus TBEA6 and assay
    iron-limited growth rescue with purified Fe(III)-variobactin, ferrichrome,
    and enterobactin chelates, alongside isothermal titration calorimetry of
    purified detergent-solubilized BfrD1 with ferric-variobactin.
  hypothesis: >-
    BfrD1 binds ferric-siderophore chelates with nanomolar affinity and mediates
    TonB-dependent iron acquisition under rhizosphere iron limitation.
