- term:
    id: GO:0038023
    label: signaling receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010105
  review:
    summary: >-
      Automated InterPro2GO over-annotation from IPR010105; BfrD1 is a canonical
      739-aa transport receptor lacking an N-terminal FecR-coupled anti-sigma
      transmembrane signaling extension.
    action: REMOVE
    reason: >-
      In the TonB-dependent receptor superfamily, only the specialized TonB-dependent
      transducer subclass (such as E. coli FecA or P. aeruginosa FpvA) possesses
      an ~80-100 residue N-terminal periplasmic signaling domain (Pfam PF07660)
      upstream of the plug domain that engages an inner-membrane anti-sigma
      factor to transduce a transcriptional signal. BfrD1 is 739 residues in
      total with its signal peptide at residues 1-17 and its plug domain starting
      directly at residue 60 (residues 60-159), lacking any N-terminal signaling
      extension. Its biological role is transmembrane ferric-siderophore import
      rather than signal transduction.
    supported_by:
    - reference_id: UniProtKB:A0A0H2M677
      supporting_text: "FT   SIGNAL          1..17"
    - reference_id: PMID:20420522
      supporting_text: "The first crystal structures of two Escherichia coli TonB-dependent transporters, ferrichrome transporter (FhuA) (34, 54) and ferric enterobactin transporter (FepA) (10), showed that TBDTs use a 22-stranded β-barrel to span the outer membrane with an unanticipated ‘plug’ domain folded into the barrel interior."
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR010105
      requested_change: DELETE_VALUE
      asserted_value: GO:0038023
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: >-
        InterPro2GO maps IPR010105 (TonB-dependent siderophore receptor) to
        GO:0038023 (signaling receptor activity). Only the specialized FecA/FpvA
        TonB-dependent transducer subfamily carrying an N-terminal anti-sigma
        signaling domain (Pfam PF07660, IPR005532) performs transmembrane signal
        transduction; canonical TonB-dependent siderophore receptors such as
        BfrD1 (A0A0H2M677) lack PF07660 and function strictly as
        ferric-siderophore uptake transporters (GO:0015344).
      supported_by:
      - reference_id: PMID:20420522
        supporting_text: "The first crystal structures of two Escherichia coli TonB-dependent transporters, ferrichrome transporter (FhuA) (34, 54) and ferric enterobactin transporter (FepA) (10), showed that TBDTs use a 22-stranded β-barrel to span the outer membrane with an unanticipated ‘plug’ domain folded into the barrel interior."
