  label: Variovorax paradoxus
description: >-
  BfrD1 (VPARA_25830) is a 739-amino-acid outer-membrane TonB-dependent
  ferric-siderophore receptor in Variovorax paradoxus TBEA6 encoded immediately
  downstream of the inner-membrane energy transducer tonB (VPARA_25820). The
  precursor contains an N-terminal signal peptide (residues 1-17), a
  periplasm-facing N-terminal plug (cork) domain (Pfam PF07715, residues
  60-159) with a conserved TonB box motif, and a 22-stranded outer-membrane
  beta-barrel domain (Pfam PF00593, residues 265-709). Upon binding
  extracellular ferric-siderophore or photoreactive lipopeptide complexes such
  as variobactin at the cell surface, BfrD1 interacts via its N-terminal TonB
  box with periplasmic TonB to couple inner-membrane proton-motive force to
  plug-domain unfolding and active import of the iron chelate into the
  periplasmic space.
