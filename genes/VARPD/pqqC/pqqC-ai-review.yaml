taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: >-
  PqqC (pyrroloquinoline-quinone synthase, VPARA_00940, A0A0H2MDI9) in Variovorax paradoxus
  is a 254-amino-acid cofactor-less oxidase (EC 1.3.3.11; HAMAP MF_00654, InterPro IPR011845, NCBIfam
  TIGR02111) encoded in the pqqBCDE (VPARA_00950-VPARA_00920) gene cluster. It catalyzes the terminal
  step of pyrroloquinoline quinone (PQQ) biosynthesis: the ring cyclization and eight-electron, eight-proton
  oxidation of 3a-(2-amino-2-carboxyethyl)-4,5-dioxo-4,5,6,7,8,9-hexahydroquinoline-7,9-dicarboxylic
  acid (AHQQ) to mature PQQ using three equivalents of molecular oxygen (producing two equivalents of
  H2O2 and two equivalents of H2O, RHEA:10692) without requiring a metal or organic prosthetic group.
