suggested_questions:
- question: How is mature PQQ released from the closed product-bound conformation of Variovorax paradoxus
    PqqC (VPARA_00940) and exported across the inner membrane to load periplasmic quinoproteins such
    as Gcd (VPARA_65850) and VPARA_00790?
suggested_experiments:
- description: Purify recombinant Variovorax paradoxus PqqC (A0A0H2MDI9) and measure single- and multiple-turnover
    oxidation of AHQQ to PQQ under aerobic conditions, quantifying O2 consumption and H2O2 production
    by Clark electrode oximetry and Amplex Red assays.
  hypothesis: >-
    V. paradoxus PqqC converts AHQQ to PQQ with a 3 O2 : 2 H2O2 : 1 PQQ stoichiometry in a
    single-turnover reaction whose rate-limiting step is product release.
  experiment_type: In vitro enzyme kinetics and oxygen/peroxide stoichiometry assay
