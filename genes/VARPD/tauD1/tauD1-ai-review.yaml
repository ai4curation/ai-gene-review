  findings:
  - statement: >-
      VPARA_23370 (tauD1) encodes a 302-aa alpha-ketoglutarate-dependent taurine
      dioxygenase (EC 1.14.11.17) containing the TauD/TfdA-like dioxygenase
      domain (Pfam PF02668, residues 23-294) and annotated with Iron and
      Metal-binding keywords.
    supporting_text: "DE   SubName: Full=Alpha-ketoglutarate-dependent taurine dioxygenase {ECO:0000313|EMBL:KLN56395.1};\nDE            EC=1.14.11.17 {ECO:0000313|EMBL:KLN56395.1};"
- id: PMID:9287300
  title: "Characterization of alpha-ketoglutarate-dependent taurine dioxygenase from Escherichia coli."
  findings:
  - statement: >-
      Bacterial TauD is a soluble homodimeric Fe(II)- and
      alpha-ketoglutarate-dependent dioxygenase that cleaves taurine (Km = 55 uM)
      as well as short-chain aliphatic sulfonates into sulfite and the
      corresponding aldehyde under sulfate starvation.
    supporting_text: "The pure enzyme converted taurine to sulfite and aminoacetaldehyde, which was identified by high pressure liquid chromatography after enzymatic conversion to ethanolamine. The reaction also consumed equimolar amounts of oxygen and alpha-ketoglutarate; ferrous iron was absolutely required for activity; and ascorbate stimulated the reaction."
suggested_questions:
- question: >-
    How are tauD1 (VPARA_23370) and the ssuEADCB alkanesulfonate monooxygenase
    system (ssuD / VPARA_19220) differentially regulated in Variovorax paradoxus
    TBEA6 during growth on taurine, aliphatic sulfonates, and plant root
    exudates under sulfate starvation?
  experts:
  - Kertesz MA
  - Steinbuechel A
  - Hausinger RP
suggested_experiments:
- description: >-
    Purify recombinant His-tagged V. paradoxus TauD1 (VPARA_23370) and measure
    steady-state Fe(II)/2-oxoglutarate-dependent sulfite release across taurine,
    isethionate, MOPS, and pentanesulfonate, alongside growth phenotyping of
    single ΔtauD1, ΔssuD, and double ΔtauD1 ΔssuD mutants on organosulfonates as
    sole sulfur source.
  hypothesis: >-
    TauD1 exhibits highest catalytic efficiency toward taurine whereas SsuD
    processes broader aliphatic sulfonates, and together they provide dual
    oxygenolytic desulfonation routes in the rhizosphere.
