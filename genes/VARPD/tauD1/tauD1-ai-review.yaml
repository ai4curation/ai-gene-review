  label: Variovorax paradoxus
description: >-
  TauD1 (VPARA_23370) is a 302-amino-acid cytosolic Fe(II)/2-oxoglutarate
  (alpha-ketoglutarate)-dependent taurine dioxygenase (EC 1.14.11.17) in
  Variovorax paradoxus TBEA6. Belonging to the TauD/TfdA non-heme iron
  oxygenase family (Pfam PF02668, residues 23-294), TauD1 catalyzes the
  oxygenolytic desulfonation of taurine (2-aminoethanesulfonate) in the presence
  of O2 and 2-oxoglutarate to yield sulfite, aminoacetaldehyde, succinate, and
  CO2. In the rhizosphere, where inorganic sulfate is frequently immobilized in
  organosulfur esters and sulfonates, TauD1 complements the FMNH2-dependent
  alkanesulfonate monooxygenase SsuD (VPARA_19220) to liberate assimilable
  sulfite for bacterial and plant sulfur nutrition.
