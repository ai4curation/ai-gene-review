  label: Variovorax paradoxus
description: >-
  TonB (VPARA_25820) is a 232-amino-acid inner-membrane proton-motive-force
  energy transducer in Variovorax paradoxus TBEA6 encoded in the conserved
  tonB-bfrD1 (VPARA_25820-VPARA_25830, EMBL KLN56276.1-KLN56277.1 on contig JZWI01000012) locus immediately upstream
  of the outer-membrane TonB-dependent ferric-siderophore receptor bfrD1
  (VPARA_25830). Anchored in the cytoplasmic membrane by a single N-terminal
  transmembrane helix (residues 18-35) within the TonB-ExbB-ExbD complex, TonB
  extends across the periplasmic space via a disordered linker region (residues
  58-143) containing two proline-rich compositionally biased segments (residues
  59-87 and 95-135) so that its globular C-terminal domain (PROSITE PS52015,
  Pfam PF03544, residues 140-232) engages the periplasmic TonB box of
  ligand-loaded outer-membrane TonB-dependent receptors, mechanically coupling
  the inner-membrane proton gradient to active import of ferric-siderophore
  complexes across the outer membrane.
