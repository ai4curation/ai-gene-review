- term:
    id: GO:0015031
    label: protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR001806740
  review:
    summary: >-
      Automated UniRule over-annotation; TonB transduces energy to outer-membrane
      receptors for ferric-siderophore and small-molecule nutrient uptake rather
      than mediating protein translocation.
    action: REMOVE
    reason: >-
      UniRule UR001806740 propagates GO:0015031 (protein transport) to bacterial
      TonB proteins, likely reflecting opportunistic exploitation of the TonB
      system by bacteriophages and colicin protein toxins in enteric bacteria.
      Physiologically, TonB energizes active outer-membrane import of
      ferric-siderophore chelates, vitamin B12, and nickel/carbohydrate
      complexes, and is not a protein translocase.
    supported_by:
    - reference_id: PMID:20420522
      supporting_text: "TonB-dependent transporters (TBDTs) are bacterial outer membrane proteins that bind and transport ferric chelates, called siderophores, as well as vitamin B(12), nickel complexes, and carbohydrates."
- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: located_in
  supporting_entities:
  - UniRule:UR001806740
  review:
    summary: >-
      Core subcellular compartment spanned by the disordered periplasmic linker
      region (residues 58-143, containing proline-rich segments at 59-87 and
      95-135) and C-terminal receptor-binding domain (residues 140-232) of TonB.
    action: ACCEPT
    reason: >-
      While anchored in the inner membrane at residues 18-35, the bulk of TonB
      (the disordered linker region at residues 58-143 containing proline-rich
      segments at residues 59-87 and 95-135, plus the C-terminal globular
      domain at residues 140-232) resides in and spans the Gram-negative
      outer membrane-bounded periplasmic space to contact outer-membrane
      TonB-dependent receptors.
    supported_by:
    - reference_id: UniProtKB:A0A0H2M2E3
      supporting_text: "Single-pass membrane protein {ECO:0000256|ARBA:ARBA00004383, ECO:0000256|PROSITE-ProRule:PRU01359}; Periplasmic side"
    - reference_id: PMID:20420522
      supporting_text: "The plug domain functions to bind a specific metal chelate at the extracellular side of the membrane and to interact with TonB-ExbB-ExbD at the periplasmic side of the outer membrane."
