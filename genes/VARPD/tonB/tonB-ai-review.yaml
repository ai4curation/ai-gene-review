- id: UniProtKB:A0A0H2M2E3
  title: "UniProtKB record A0A0H2M2E3 (A0A0H2M2E3_VARPD) - Gram-negative bacterial tonB protein from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_25820 is a 232-aa inner-membrane single-pass TonB protein containing
      an N-terminal transmembrane helix (residues 18-35), a disordered
      periplasmic linker region (residues 58-143) with proline-rich segments
      (residues 59-87 and 95-135), and a C-terminal TonB domain (PROSITE
      PS52015, Pfam PF03544, residues 140-232).
    supporting_text: "SUBCELLULAR LOCATION: Cell inner membrane {ECO:0000256|ARBA:ARBA00004383, ECO:0000256|PROSITE-ProRule:PRU01359}; Single-pass membrane protein"
  - statement: >-
      VPARA_25820 corresponds to EMBL CDS accession KLN56276.1 on genomic contig
      JZWI01000012, immediately upstream of bfrD1 (VPARA_25830, KLN56277.1).
    supporting_text: "DR   EMBL; JZWI01000012; KLN56276.1; -; Genomic_DNA."
- id: PMID:20420522
  title: "TonB-dependent transporters: regulation, structure, and function."
  findings:
  - statement: >-
      The inner-membrane TonB-ExbB-ExbD complex harvests the proton-motive force
      and interacts with the periplasmic side of outer-membrane TonB-dependent
      transporters to drive active import of ferric-siderophore complexes.
    supporting_text: "The transport process requires energy in the form of proton motive force and a complex of three inner membrane proteins, TonB-ExbB-ExbD, to transduce this energy to the outer membrane."
suggested_questions:
- question: >-
    Does VPARA_25820 (tonB) specifically energize only the adjacent BfrD1
    (VPARA_25830) receptor in Variovorax paradoxus TBEA6, or does it serve as a
    general energy transducer for multiple outer-membrane TonB-dependent
    siderophore and metallophore receptors encoded elsewhere in the genome?
  experts:
  - Noinaj N
  - Postle K
  - Cornelis P
suggested_experiments:
- description: >-
    Construct a ΔtonB (VPARA_25820) deletion mutant in Variovorax paradoxus
    TBEA6 and compare its growth under iron starvation with a ΔbfrD1
    (VPARA_25830) mutant in the presence of endogenous variobactin and exogenous
    xenosiderophores.
  hypothesis: >-
    Deletion of VPARA_25820 abolishes BfrD1-dependent ferric-siderophore import
    and reveals whether parallel TonB homologs in V. paradoxus can partially
    compensate.
