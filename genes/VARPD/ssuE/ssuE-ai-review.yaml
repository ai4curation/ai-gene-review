- id: PMID:10480865
  title: Characterization of a two-component alkanesulfonate monooxygenase from Escherichia coli.
  findings:
  - statement: >-
      Purified E. coli SsuE reduces FMN to FMNH2 and supplies the reduced
      flavin required by SsuD to cleave alkanesulfonates into sulfite and the
      corresponding aldehyde.
    supporting_text: "SsuE is the FMN reducing enzyme providing SsuD with FMNH(2)."
  - statement: >-
      SsuD-catalyzed alkanesulfonate monooxygenation strictly requires reduced
      FMN and molecular oxygen.
    supporting_text: "SsuD catalysis was absolutely dependent on FMNH(2) and oxygen"
- id: PMID:10781557
  title: The ssu locus plays a key role in organosulfur metabolism in Pseudomonas putida S-313.
  findings:
  - statement: >-
      Heterologously expressed P. putida S-313 SsuE catalyzes NADPH-dependent
      FMN reduction in cell extracts.
    supporting_text: "SsuE revealed NADPH-dependent FMN reductase activity and lower levels of FAD reductase activity (32% of the value with FMN). No activity was observed with NADH."
- id: PMID:26634408
  title: Exposing the Alkanesulfonate Monooxygenase Protein-Protein Interaction Sites.
  findings:
  - statement: >-
      Optimal transfer of reduced flavin from SsuE to SsuD involves specific
      protein-protein interactions, while diffusional transfer can also support
      turnover under defined conditions.
    supporting_text: "optimal transfer of reduced flavin from SsuE to SsuD requires defined protein-protein interactions, but diffusion can occur under specified conditions."
suggested_questions:
- question: >-
    Does Variovorax paradoxus TBEA6 SsuE (VPARA_09290) exhibit strict NADPH
    preference like Pseudomonas putida S-313 SsuE or dual NADH/NADPH activity
    like Escherichia coli SsuE, and can alternative flavin reductases in TBEA6
    support SsuD (VPARA_09250) activity in a ΔssuE background?
  experts:
  - Ellis HR
  - Kertesz MA
suggested_experiments:
- description: >-
    Purify recombinant Variovorax paradoxus SsuE (A0A0H2M6H0) and measure
    steady-state kinetic parameters (kcat, Km) with NADPH versus NADH and FMN
    versus FAD, as well as coupled desulfonation of octanesulfonate with
    purified V. paradoxus SsuD (A0A0H2MCI3).
  hypothesis: >-
    V. paradoxus SsuE efficiently reduces FMN and couples with SsuD (VPARA_09250)
    to drive stoichiometric sulfite release from linear alkanesulfonates.
