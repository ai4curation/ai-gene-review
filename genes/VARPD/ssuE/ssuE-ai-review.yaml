  label: Variovorax paradoxus
description: >-
  Putative NAD(P)H-dependent FMN reductase SsuE (VPARA_09290, A0A0H2M6H0; EC
  1.5.1.38) in Variovorax paradoxus strain TBEA6 is a 194-amino-acid cytosolic
  flavin reductase (NCBIfam TIGR03567, InterPro IPR020048, PANTHER
  PTHR43408:SF1, Pfam PF03358 residues 1-142) of the two-component
  alkanesulfonate monooxygenase system. Encoded on genomic contig JZWI01000005
  (EMBL KLN57918.1) at the 3' end of the aliphatic sulfonate uptake and
  desulfonation gene cluster alongside the ABC importer subunits ssuB2
  (VPARA_09230, KLN57912.1), ssuC5 (VPARA_09240, KLN57913.1), and ssuA2
  (VPARA_09270, KLN57916.1) and the alkanesulfonate monooxygenase ssuD
  (VPARA_09250, KLN57914.1), SsuE catalyzes the NAD(P)H-dependent reduction of
  oxidized FMN to reduced FMN (FMNH2) and supplies the reduced flavin
  cosubstrate required by SsuD for oxygenolytic carbon-sulfur bond cleavage of
  aliphatic sulfonates to sulfite and the corresponding aldehyde.
