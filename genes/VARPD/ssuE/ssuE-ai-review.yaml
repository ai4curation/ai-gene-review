  review:
    summary: >-
      Core catalytic activity of SsuE (NCBIfam TIGR03567, InterPro IPR020048,
      PANTHER PTHR43408:SF1), which reduces FMN using NAD(P)H to provide
      reduced flavin to the partner alkanesulfonate monooxygenase SsuD.
    action: ACCEPT
    reason: >-
      VPARA_09290 belongs to the SsuE family of two-component FMN reductases
      (NCBIfam TIGR03567, InterPro IPR020048, PANTHER PTHR43408:SF1, Pfam
      PF03358) and is co-localized in the contig JZWI01000005 ssu cluster with
      ssuD (VPARA_09250, UniProtKB:A0A0H2MCI3). Because SsuE homologs vary in
      nicotinamide cofactor preference across bacteria—Pseudomonas putida S-313
      SsuE prefers NADPH (PMID:10781557) whereas E. coli SsuE utilizes both
      NADPH and NADH (PMID:10480865)—and VPARA_09290 has not been biochemically
      assayed, GO:0008752 (FMN reductase [NAD(P)H] activity) is accepted at the
      warranted level of cofactor specificity.
