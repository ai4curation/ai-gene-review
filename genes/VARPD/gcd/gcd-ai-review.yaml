taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: Gcd (quinoprotein glucose dehydrogenase, VPARA_65850) in Variovorax paradoxus is an 818-amino-acid
  inner-membrane PQQ-dependent glucose dehydrogenase (EC 1.1.5.2; NCBIfam TIGR03074, InterPro IPR017511)
  comprising five N-terminal transmembrane alpha-helices (residues 14-169) that bind ubiquinone and a
  C-terminal periplasmic beta-propeller catalytic domain that binds pyrroloquinoline quinone (PQQ) and
  divalent cations. It catalyzes the direct periplasmic oxidation of D-glucose to D-glucono-1,5-lactone
  (which hydrolyzes to D-gluconate/gluconic acid) coupled to ubiquinone reduction in the respiratory chain.
