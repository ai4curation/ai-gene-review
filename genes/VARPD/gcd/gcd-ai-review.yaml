suggested_questions:
- question: Does Variovorax paradoxus synthesize pyrroloquinoline quinone (PQQ) de novo under low-phosphate
    or mineral-leaching conditions, or can it scavenge exogenous PQQ from co-occurring rhizosphere bacteria?
suggested_experiments:
- description: Generate a clean deletion of gcd (VPARA_65850) in Variovorax paradoxus and quantify extracellular
    gluconic acid production, pH drop, and mineral phosphate or lanthanide solubilization from refractory
    ores by ICP-MS.
  hypothesis: Deletion of gcd abolishes periplasmic gluconic acid production and reduces organic-acid-mediated
    mineral solubilization.
