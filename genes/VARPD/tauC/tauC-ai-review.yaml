- id: file:VARPD/tauC/tauC-uniprot.txt
  title: "UniProtKB record A0A0H2M7Y1 (A0A0H2M7Y1_VARPD) - Taurine transport system permease protein TauC from Variovorax paradoxus TBEA6"
  findings:
  - statement: >-
      VPARA_03670 (tauC, A0A0H2M7Y1) is a 294-aa integral inner-membrane ABC
      permease protein (InterPro IPR000515, PANTHER PTHR30151:SF25) containing
      six predicted transmembrane helices and an ABC transmembrane type-1
      domain (PROSITE PS50928, residues 100-280).
    record_section: ["FT:DOMAIN"]
    supporting_text: "FT   DOMAIN          100..280\nFT                   /note=\"ABC transmembrane type-1\"\nFT                   /evidence=\"ECO:0000259|PROSITE:PS50928\""
  - statement: >-
      VPARA_03670 (tauC) corresponds to EMBL CDS accession KLN58256.1 on
      genomic contig JZWI01000003, where consecutive CDS accessions
      (KLN58254.1-KLN58256.1) and locus tags stepping by 10 place tauC
      immediately downstream of tauA (VPARA_03650, KLN58254.1) and tauB1
      (VPARA_03660, KLN58255.1).
    record_section: ["DR:EMBL"]
    supporting_text: "DR   EMBL; JZWI01000003; KLN58256.1; -; Genomic_DNA."
- id: PMID:8808933
  title: "Identification of sulfate starvation-regulated genes in Escherichia coli: a gene cluster involved in the utilization of taurine as a sulfur source."
  findings:
  - statement: >-
      Characterization of the E. coli tauABCD operon identified TauC as the
      integral membrane permease subunit of the taurine ABC uptake system.
    supporting_text: "The TauA protein contained a putative signal peptide for transport into the periplasm; the TauB and TauC proteins showed sequence similarity to ATP-binding proteins and membrane proteins, respectively, of ABC-type transport systems"
- id: PMID:10781534
  title: Deletion analysis of the Escherichia coli taurine and alkanesulfonate transport systems.
  findings:
  - statement: >-
      Deletion and complementation analysis in E. coli established that TauABC
      mediates taurine import and its subunits cannot form functional hybrid
      transporters with SsuABC.
    supporting_text: "Mutants in which only formation of hybrid transporters was possible were unable to grow with sulfonates, indicating that the individual components of the two transport systems were not functionally exchangeable."
suggested_questions:
- question: >-
    Does Variovorax paradoxus TauC (VPARA_03670) form a homodimeric pore within
    the TauAB1C complex, and how do its periplasmic loops engage taurine-loaded
    TauA (VPARA_03650)?
  experts:
  - Kertesz MA
  - Leisinger T
suggested_experiments:
- description: >-
    Construct an in-frame ΔtauC (VPARA_03670) deletion in Variovorax paradoxus
    TBEA6 and measure [14C]-taurine uptake and taurine-dependent growth under
    sulfate starvation.
  hypothesis: >-
    Deletion of tauC abolishes high-affinity taurine uptake and prevents growth
    on taurine as a sole sulfur source.
