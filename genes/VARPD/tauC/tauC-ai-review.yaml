description: >-
  Taurine transport system permease protein TauC (VPARA_03670, A0A0H2M7Y1) in
  Variovorax paradoxus strain TBEA6 is a 294-amino-acid multi-pass integral
  inner-membrane subunit (InterPro IPR000515, PANTHER PTHR30151:SF25) of the
  TauABC ATP-binding cassette (ABC) taurine importer complex. Encoded at the 3'
  end of the syntenic tauA-tauB1-tauC (VPARA_03650-VPARA_03670) operon on
  genomic contig JZWI01000003 (consecutive EMBL CDS accessions
  KLN58254.1-KLN58256.1) immediately downstream of the periplasmic binding
  protein tauA (VPARA_03650, KLN58254.1) and the ATPase subunit tauB1
  (VPARA_03660, KLN58255.1), TauC contains six predicted transmembrane
  alpha-helices (residues 42-62, 100-121, 141-160, 166-185, 221-241, and
  261-283) and a conserved ABC transmembrane type-1 domain (PROSITE PS50928,
  Pfam PF00528, residues 100-280) that forms the membrane translocation pathway
  for importing taurine into the cytoplasm.
