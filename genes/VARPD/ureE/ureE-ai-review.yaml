taxon:
  id: NCBITaxon:34073
  label: Variovorax paradoxus
description: >-
  UreE (VPARA_50940) in Variovorax paradoxus is a 200-amino-acid cytoplasmic
  nickel-binding metallochaperone for urease maturation (HAMAP rule MF_00822,
  InterPro IPR012406, Pfam PF02814/PF05194) featuring an N-terminal
  dimerization/chaperone domain, a C-terminal metal-binding domain, and a
  histidine-rich C-terminal tail (residues 148-200 containing 15 His residues).
  Encoded immediately upstream of ureF (VPARA_50930) in the urease gene cluster,
  UreE binds intracellular Ni(2+) and donates it to the UreD-UreF-UreG
  activation complex for installation of the dinickel active site in UreC.
