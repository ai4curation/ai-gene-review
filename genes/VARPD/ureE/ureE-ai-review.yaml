  - id: UniProtKB:A0A0H2LU38
    title: "UniProtKB entry A0A0H2LU38 (A0A0H2LU38_VARPD): Urease accessory protein UreE"
    findings:
      - statement: >-
          VPARA_50940 (A0A0H2LU38, ureE) is a 200-residue cytoplasmic urease
          accessory protein (HAMAP rule MF_00822, InterPro IPR012406, Pfam
          PF02814/PF05194) with a histidine-rich C-terminal tail that binds
          nickel and functions as a nickel donor during urease metallocenter
          assembly.
        supporting_text: >-
          CC   -!- FUNCTION: Involved in urease metallocenter assembly. Binds nickel.
          CC       Probably functions as a nickel donor during metallocenter assembly.
          CC       {ECO:0000256|HAMAP-Rule:MF_00822}.
  - id: PMID:8318889
    title: "Purification and characterization of Klebsiella aerogenes UreE protein: a nickel-binding protein that functions in urease metallocenter assembly."
    findings:
      - statement: >-
          Purified bacterial UreE is a cytoplasmic dimeric protein that binds
          nickel ions via histidyl imidazole ligands and functions as an
          intracellular nickel donor during urease metallocenter assembly.
        supporting_text: >-
          We hypothesize that UreE binds intracellular nickel ion and
          functions as a nickel donor during metallocenter assembly into the urease
          apoprotein.
        full_text_unavailable: true
    full_text_unavailable: true
  - id: PMID:22369361
    title: "Klebsiella aerogenes UreF: identification of the UreG binding site and role in enhancing the fidelity of urease activation."
    findings:
      - statement: >-
          UreE functions as a metallochaperone that delivers Ni(2+) to the
          UreD-UreF-UreG complex bound to urease apoprotein.
        supporting_text: >-
          UreE functions as a metallochaperone that delivers Ni to a
          UreD-UreF-UreG complex bound to urease apoprotein, with UreG serving as a GTPase
          during enzyme activation.
  - id: PMID:21183664
    title: Complete genome sequence of the metabolically versatile plant growth-promoting endophyte Variovorax paradoxus S110.
    findings:
      - statement: >-
          Genomic analysis of Variovorax paradoxus highlights its diverse
          metabolic capabilities in soil and plant-associated environments.
        supporting_text: >-
          Variovorax paradoxus is a microorganism of special interest due to its
          diverse metabolic capabilities, including the biodegradation of both
          biogenic compounds and anthropogenic contaminants.
