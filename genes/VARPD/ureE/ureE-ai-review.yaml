suggested_questions:
  - question: >-
      How many Ni(2+) ions are coordinated per dimer by the 15-histidine
      C-terminal extension (residues 148-200) of Variovorax paradoxus UreE
      (VPARA_50940)?
suggested_experiments:
  - hypothesis: >-
      Truncation of the C-terminal histidine-rich tail (residues 148-200) of
      VPARA_50940 reduces high-capacity Ni(2+) buffering and impairs urease
      activation under low-nickel conditions.
    description: >-
      Compare Ni(2+) binding stoichiometry by isothermal titration calorimetry
      (ITC) and in vivo urease activity between full-length VPARA_50940 and a
      C-terminally truncated UreE(1-147) variant across a gradient of media
      NiCl2 concentrations.
    experiment_type: Site-directed truncation, isothermal titration calorimetry, and urease activation assay
