core_functions:
- description: >-
    FogD contributes redox chemistry during formation of the polyketide-derived flavoglaucin core. A trans-acting
    reductive-release role is proposed from pathway reconstruction and the SDR family assignment; the
    isolated reaction and cofactor preference remain unresolved.
  supported_by:
