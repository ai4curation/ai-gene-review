suggested_questions:
- question: What is the exact catalytic mechanism of fogD? Does it perform a true NADPH-dependent
    reductive release of the thioester-bound polyketide from fogA, or does it catalyze a different
    modification of the PKS-bound intermediate?
  experts:
  - Shu-Ming Li (Philipps-Universitat Marburg, senior author of PMID:32134669)
  - Jonas Nies (first author of PMID:32134669)
- question: Does fogD interact directly with the fogA polyketide synthase via protein-protein
    interaction, and if so, which domains mediate this interaction?
  experts:
  - Shu-Ming Li (Philipps-Universitat Marburg)
- question: >-
    Does FogD retain any of the experimentally grounded Ayr1 lipid activities or localizations, and can
    historical TreeGrafter node PTN001211783 be mapped onto the current PTHR44169 PAINT tree? A different
    biosynthetic role and a short source list do not themselves establish an erroneous graft.
  experts: []
- question: 'Which exact reaction and cofactor does isolated FogD use: reductive thioester release, carbonyl/alcohol
    interconversion, or another modification? The specific CH-OH/NAD(P) proposal is withheld pending that
    distinction.'
- question: Would a flavoglaucin-specific GO process add useful coverage beyond polyketide
    biosynthetic process? The former proposal is withheld pending ontology review; the
    ancestor/descendant secondary-metabolite and polyketide proposals must not both be added.
suggested_experiments:
- hypothesis: fogD catalyzes the NADPH-dependent reductive release of polyketide intermediates from
    the fogA PKS, generating salicyl alcohol products.
  description: Express and purify recombinant fogD, then test its ability to release polyketide
    intermediates from purified fogA-bound substrates in vitro. Measure NADPH consumption and
    product formation (salicyl alcohols) by LC-MS. Include controls without NADPH and with a
    predicted catalytic-site mutant (Y147F; inactivity to be measured) to test the proposed
    reductive mechanism.
  experiment_type: in vitro biochemical assay
- hypothesis: fogD forms a direct physical interaction with the fogA polyketide synthase to perform
    trans-acting reductive release.
  description: Perform co-immunoprecipitation or pull-down assays using tagged fogD and fogA
    expressed in A. nidulans. Alternatively, use bacterial two-hybrid or yeast two-hybrid assays to
    test for direct protein-protein interaction between fogD and specific domains of fogA (KS, ACP,
    or thioesterase-like domains).
  experiment_type: protein-protein interaction assay
- hypothesis: Specific active site residues (Tyr-147, Lys-151) are essential for fogD catalytic
    activity in the fog pathway.
  description: Generate site-directed mutants of fogD at predicted active site residues (Y147F,
    K151A) and cofactor binding residues. Express these in a fogD-deletion background in A. ruber or
    heterologously in A. nidulans with fogA/B/C, and measure flavoglaucin and salicyl alcohol
    production by HPLC/LC-MS. Loss of pathway products would test their requirement in this pathway;
    purified-protein assays would be needed to distinguish catalysis from stability.
  experiment_type: site-directed mutagenesis with metabolite profiling
