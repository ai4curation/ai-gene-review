  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: >-
      The propagated acylglycerone-phosphate reductase (NADP+) activity claim is too specific for
      FogD.
    action: MODIFY
    reason: >-
      The focused OpenScientist report supports functional divergence from Ayr1: FogD retains the
      SDR fold and participates in flavoglaucin polyketide redox chemistry, while UniProt records
      EC 1.1.1.- for CH-OH donor/NAD(P) acceptor chemistry. FogD is only 39.5% identical to yeast
      Ayr1 and sits in the distinct PANTHER PTHR44169:SF3 SRDE subfamily, so no target assay supports
      transfer of the Ayr1-specific acyl-DHAP substrate. Keep the CH-OH/NAD(P) parent rather than
      this Ayr1-derived glycerolipid-substrate assertion.
