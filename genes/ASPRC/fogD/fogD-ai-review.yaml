description: >-
  FogD is a short-chain dehydrogenase/reductase in the flavoglaucin biosynthetic cluster of Aspergillus
  ruber. It acts with the polyketide synthase FogA and oxidoreductases FogB and FogC during formation
  of the aromatic core of prenylated salicylaldehyde metabolites. FogD is proposed to contribute reductive
  release of the nascent polyketide as a salicyl alcohol, but its isolated catalytic reaction has not
  been established. The alcohol intermediate permits subsequent hydroxylation and prenylation before oxidation
  to the aldehyde end products. Functional evidence comes from reconstruction and deletion experiments
  with an A. ruber cluster in A. nidulans; the source strain was QEN-0407-G2 and the cluster was mapped
  against the CBS 135680 reference genome. FogD subcellular localization and possible additional substrates
  remain unresolved.
