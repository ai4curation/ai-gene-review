existing_annotations:
  - term:
      id: GO:0007165
      label: signal transduction
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    review:
      summary: Signal transduction is a broad inference without direct evidence 
        for this DESRO cytokine.
      action: MARK_AS_OVER_ANNOTATED
      reason: Annotation is generic and not directly supported in DESRO; core 
        function is cytokine activity.
  - term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    review:
      summary: K9IWR0 is lymphotoxin-alpha (UniProt RecName; PANTHER PTHR11471:SF31
        LYMPHOTOXIN-ALPHA), a secreted TNF-superfamily cytokine that signals through
        TNFRSF1A/TNFR1, TNFRSF1B and TNFRSF14. Canonical NF-kappaB activation is the
        principal downstream output of that receptor engagement, and the propagation
        comes from the lymphotoxin-alpha node (PANTHER:PTN000158030), not from a broad
        family-level node.
      action: ACCEPT
      reason: Relaxed from MARK_AS_OVER_ANNOTATED on re-review. The previous rejection
        rested only on the absence of a Desmodus-specific experiment, which is not
        evidence against a supported phylogenetic inference. The protein carries the
        complete TNF-domain architecture (Pfam PF00229; InterPro IPR002960 TNF_beta)
        and is assigned to the lymphotoxin-alpha subfamily, and the review already
        accepts its cytokine activity (GO:0005125) and TNF receptor binding (GO:0005164);
        positive regulation of canonical NF-kappaB signalling is the established
        consequence of that receptor binding rather than an additional unsupported claim.
  - term:
      id: GO:2001238
      label: positive regulation of extrinsic apoptotic signaling pathway
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    review:
      summary: Lymphotoxin-alpha engages TNFR1, a death-domain receptor, and UniProt
        records that lymphotoxin is cytotoxic for a wide range of tumour cells in vitro
        and in vivo - the extrinsic, receptor-initiated apoptotic route. The propagation
        is from the lymphotoxin-alpha node (PANTHER:PTN000158030).
      action: ACCEPT
      reason: Relaxed from MARK_AS_OVER_ANNOTATED on re-review. The earlier rejection
        cited only the lack of a Desmodus-specific assay. The target has the full TNF
        ligand architecture and subfamily assignment, and the cytotoxic, TNFR1-mediated
        activity of lymphotoxin-alpha is the basis of the term; positive regulation of
        the extrinsic apoptotic signalling pathway follows from the accepted TNF receptor
        binding rather than extending beyond it.
      supported_by:
      - reference_id: file:DESRO/K9IWR0/K9IWR0-uniprot.txt
        supporting_text: cytotoxic for a wide range of tumor cells in vitro
  - term:
      id: GO:0005125
      label: cytokine activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    review:
