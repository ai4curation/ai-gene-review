  - term:
      id: GO:0031640
      label: killing of cells of another organism
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        This is precisely what a muramidase does: hydrolysing peptidoglycan
        weakens the cell wall and lyses the bacterium. The human orthologue LYZ
        carries this term from direct assay (IDA, PMID:9727055). An earlier
        version of this review marked it as over-annotated on the grounds that
        it is broad, but breadth is not the issue here - the term states the
        outcome of the enzyme's own catalytic action.
      action: ACCEPT
      reason: >-
        Bacteriolysis is the direct, demonstrated consequence of lysozyme
        activity, not an inflated inference. The keyword source (Bacteriolytic
        enzyme) is exactly on point.
      supported_by:
        - *id_innate
        - reference_id: file:DESRO/K9IWH5/K9IWH5-deep-research-falcon.md
          supporting_text: >-
            thereby weakening the cell wall and causing osmotic lysis
  - term:
      id: GO:0005576
      label: extracellular region
    evidence_type: ISS
    original_reference_id: PMID:23411029
    review:
      summary: >-
        Proposed new annotation. The GOA record for K9IWH5 carries no cellular
        component term at all, which is a genuine gap: the precursor has a
        SignalP-predicted signal peptide (1-18) with a cleaved 19-148 mature
        chain, lysozyme is a classical secreted protein of body fluids, the
        human orthologue is annotated to GO:0005576 from direct assay, and
        lysozyme was recovered from the D. rotundus accessory submaxillary gland
        by both transcriptome and proteome analysis.
      action: NEW
      reason: >-
        Fills a missing aspect. Secretion is supported independently by signal
        peptide prediction, by orthology, and by direct proteomic detection in
        the bat salivary gland.
      supported_by:
        - reference_id: file:DESRO/K9IWH5/K9IWH5-uniprot.txt
          supporting_text: 'SIGNAL          1..18'
        - reference_id: PMID:23411029
          supporting_text: >-
            families were expressed at higher levels in the AC gland, as
            indicated by both transcriptome and proteome analysis (Figure 2B).
          reference_section_type: RESULTS
        - reference_id: file:DESRO/K9IWH5/K9IWH5-deep-research-falcon.md
          supporting_text: >-
            These features support extracellular localization (secreted protein)
