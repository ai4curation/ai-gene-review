id: K9IWH5
gene_symbol: LYZ
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9430
  label: Desmodus rotundus
description: >-
  LYZ is the single chicken-type (c-type) lysozyme of the common vampire bat, a
  secreted glycoside hydrolase of family GH22 (EC 3.2.1.17). The 148-residue
  precursor has a signal peptide (residues 1-18) and a cleaved 19-148 mature
  chain that adopts the canonical lysozyme C fold. It hydrolyses the
  beta-(1->4) linkages between N-acetylmuramic acid and N-acetyl-D-glucosamine
  in bacterial peptidoglycan, and between N-acetylglucosamine residues in
  chitodextrins, degrading the cell wall and lysing the bacterium. Its
  physiological setting is extracellular: it is a classical innate immune
  effector of body fluids and secretions, and in D. rotundus it is one of the
  antimicrobials that dominate the accessory submaxillary salivary gland, where
  it was detected at both transcript and protein level, and it is also
  transcribed in liver. Unlike insectivorous bats, which duplicated and
  neofunctionalised lysozyme for chitin digestion, vampire bats retain a single
  lysozyme gene; that gene carries a signature of positive selection on the
  mature protein specific to the sanguivorous lineage, with substitutions
  predicted to alter function, consistent with adaptation of antimicrobial
  defence to a blood diet.
