  - id: PMID:31506780
    title: Adaptive Evolution of C-Type Lysozyme in Vampire Bats.
    full_text_unavailable: true
    findings:
      - statement: >-
          Mammalian c-type lysozymes are innate immune effectors that kill
          bacteria by degrading the peptidoglycan of their cell walls. This is
          the general statement of function against which the vampire bat gene
          was analysed.
        supporting_text: >-
          killing bacteria by degrading peptidoglycan in their cell walls
        reference_section_type: ABSTRACT
      - statement: >-
          The common vampire bat, like the other phyllostomid bats analysed, has
          a single c-type lysozyme gene - in contrast to the insectivorous bat
          clade in which lysozyme was duplicated and adapted for chitin
          digestion. This constrains functional interpretation of K9IWH5: there
          is no paralogue to which a digestive role could be partitioned.
        supporting_text: >-
          Only a single lysozyme gene was identified in each of these species.
        reference_section_type: ABSTRACT
      - statement: >-
          Positive selection was detected on the mature lysozyme along the
          lineages leading to vampire bats but not in other single-copy bats,
          and several sanguivore-specific substitutions are predicted to have
          functional impacts.
        supporting_text: >-
          Evidence for positive selection on mature lysozyme was found on
          lineages leading to vampire bats
        reference_section_type: ABSTRACT
      - statement: >-
          The authors interpret this adaptation as antimicrobial rather than
          digestive, driven by the specialised sanguivorous habits of vampire
          bats.
        supporting_text: >-
          Functional adaptation of vampire bat lysozymes could be associated with
          anti-microbial defense, possibly driven by the specialized
          sanguivory-related habits of vampire bats.
        reference_section_type: ABSTRACT
        finding_review:
          finding_status: CURRENT
          review_notes: >-
            Stated by the authors as an interpretation of the selection
            analysis, not as a measured activity. No enzymatic or antibacterial
            assay of vampire bat lysozyme is reported.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified. This is the study behind the third EMBL record in the
        UniProt entry (MK561737 / QEQ43371.1, liver), and it is the only
        publication that analyses this specific gene. Only the abstract is
        cached (full_text_available: false), so all statements used here are
        drawn from the abstract; the sequence-level substitution analysis is not
        available for inspection.
  - id: PMID:23411029
    title: 'The "Vampirome": Transcriptome and proteome analysis of the principal
      and accessory submaxillary glands of the vampire bat Desmodus rotundus, a
      vector of human rabies.'
    findings:
      - statement: >-
          Lysozyme is one of the antimicrobials that dominate the accessory
          submaxillary gland of D. rotundus, expressed there at higher levels
          than in the principal gland and confirmed by both transcriptome and
          proteome analysis. This is the study behind the salivary gland EMBL
          record (JAA45151.1) in the UniProt entry.
        supporting_text: >-
          families were expressed at higher levels in the AC gland, as indicated
          by both transcriptome and proteome analysis (Figure 2B).
        reference_section_type: RESULTS
      - statement: >-
          Lysozyme was also among the proteins directly identified by LC-MS/MS
          in the gland proteome, establishing that the protein - not only the
          transcript - is present in the secretory tissue.
        supporting_text: >-
          components of the complement pathway, galectins, lysozyme, lipases
        reference_section_type: RESULTS
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified, full text available via PMC. Establishes salivary gland
        expression and proteomic detection of lysozyme in D. rotundus, which is
        what supports the proposed extracellular region annotation.
  - id: file:DESRO/K9IWH5/K9IWH5-uniprot.txt
    title: UniProtKB record for K9IWH5 (K9IWH5_DESRO)
    findings:
      - statement: >-
          The gene is named LYZ, the protein carries EC 3.2.1.17 with the
          explicit muramidase reaction, and it belongs to glycosyl hydrolase
          family 22 (PANTHER subfamily PTHR11407:SF28 LYSOZYME C).
        supporting_text: 'Name=LYZ {ECO:0000313|EMBL:QEQ43371.1};'
      - statement: >-
          A SignalP-predicted signal peptide (1-18) is cleaved to give the mature
          19-148 chain, consistent with a secreted protein.
        supporting_text: 'SIGNAL          1..18'
      - statement: >-
          Three independent transcript sources underlie the entry: two vampire
          bat submaxillary/salivary gland transcriptomes and one liver transcript
          from the adaptive evolution study.
        supporting_text: 'TISSUE=Submaxillary gland anterior and posterior lobes'
  - id: file:DESRO/K9IWH5/K9IWH5-deep-research-falcon.md
    title: Deep research report on K9IWH5
    findings:
      - statement: >-
          The Gram-positive preference of GH22 lysozymes is a matter of substrate
          accessibility rather than catalytic specificity; the outer membrane of
          Gram-negative bacteria must be compromised for robust activity.
        supporting_text: >-
          GH22 lysozymes prefer Gram-positive bacteria due to accessibility of
          peptidoglycan, but they can exhibit activity against Gram-negative
          bacteria when the outer membrane barrier is compromised
      - statement: >-
          The report notes that its functional assignment is a GH22 family
          inference and supports extracellular localisation as the primary
          functional context.
        supporting_text: >-
          These features support extracellular localization (secreted protein) as
          primary functional context.
    reference_review:
      relevance: MEDIUM
      correctness: UNVERIFIED
      review_notes: >-
        LLM-generated survey. Accurate and useful at the GH22 family level, and
        appropriately explicit that no D. rotundus-specific experimental data
        were recovered. It did not surface PMID:31506780, the one study that does
        analyse this gene. Cited here only for family-level mechanism.
core_functions:
  - description: >-
      Secreted c-type (GH22) lysozyme that hydrolyses the beta-(1->4) bond
      between N-acetylmuramic acid and N-acetyl-D-glucosamine in bacterial
      peptidoglycan, degrading the cell wall and lysing the bacterium. It acts
      extracellularly as an innate immune effector of body fluids, and in the
      vampire bat is a dominant antimicrobial of the accessory submaxillary
      salivary gland secretion.
    supported_by:
      - reference_id: file:DESRO/K9IWH5/K9IWH5-uniprot.txt
        supporting_text: >-
          Hydrolysis of (1->4)-beta-linkages between N-acetylmuramic
      - reference_id: PMID:31506780
        supporting_text: >-
          killing bacteria by degrading peptidoglycan in their cell walls
        reference_section_type: ABSTRACT
      - reference_id: PMID:23411029
        supporting_text: >-
          families were expressed at higher levels in the AC gland, as indicated
          by both transcriptome and proteome analysis (Figure 2B).
        reference_section_type: RESULTS
    molecular_function:
      id: GO:0003796
      label: lysozyme activity
    directly_involved_in:
      - id: GO:0042742
        label: defense response to bacterium
      - id: GO:0050830
        label: defense response to Gram-positive bacterium
      - id: GO:0031640
        label: killing of cells of another organism
    locations:
      - id: GO:0005576
        label: extracellular region
    knowledge_gaps:
      - gap_statement: >-
          The functional consequence of the sanguivore-specific positively
          selected substitutions in vampire bat lysozyme is undetermined: no
          muramidase or bacteriolytic assay has been performed on the D.
          rotundus enzyme, so it is unknown whether the substitutions alter
          catalytic rate, pH optimum, salt tolerance, or antibacterial spectrum.
        boundary: >-
          What is established is that vampire bats carry a single c-type
          lysozyme gene, that the mature protein shows evidence of positive
          selection on the lineages leading to vampire bats but not in other
          single-copy bats, and that several sanguivore-clade substitutions are
          computationally predicted to have functional impacts. What is missing
          is any measurement of the protein.
        gap_kind:
          - BIOLOGY
        dark_aspect: RESIDUAL_SUBGAP
        status: OPEN
        significance: >-
          Positive selection on an innate immune enzyme in a lineage that feeds
          on an open wound is the kind of adaptation that predicts an altered
          antibacterial spectrum; confirming it would turn a family-level
          annotation into a species-specific one, and would say what selective
          pressure sanguivory imposes on innate immunity.
        resolution: >-
          Express recombinant D. rotundus lysozyme and a reconstructed ancestral
          phyllostomid lysozyme, and compare turbidimetric muramidase rate on
          Micrococcus lysodeikticus cell walls, pH and ionic-strength optima, and
          minimum inhibitory concentrations against oral and blood-borne
          bacteria.
        provenance:
          - reference_id: PMID:31506780
            supporting_text: >-
              several amino acid substitutions found in mature lysozymes from the
              sanguivorous clade are predicted to have functional impacts
            reference_section_type: ABSTRACT
      - gap_statement: >-
          It is undetermined whether vampire bat lysozyme has a digestive role on
          the ingested blood meal in addition to its antimicrobial role.
        boundary: >-
          In insectivorous bats, lysozyme was duplicated and adaptively evolved
          for chitin digestion; vampire bats have only one copy, so any digestive
          role would have to be carried by the same protein that performs innate
          defence. The authors interpret the vampire bat selection signal as
          antimicrobial, but this is an interpretation of a sequence analysis,
          not a measurement.
        gap_kind:
          - BIOLOGY
        dark_aspect: BP_DARK
        status: OPEN
        significance: >-
          Distinguishing digestive from defensive adaptation determines which GO
          biological process branch this gene belongs in, and is the direct
          parallel to the well-studied ruminant and colobine stomach lysozymes.
        resolution: >-
          Measure lysozyme abundance and activity along the vampire bat digestive
          tract (stomach and intestine) versus salivary gland, and test activity
          of the recombinant enzyme at gastric pH.
        provenance:
          - reference_id: PMID:31506780
            supporting_text: >-
              Only a single lysozyme gene was identified in each of these species.
            reference_section_type: ABSTRACT
suggested_questions:
  - question: >-
      Do the positively selected substitutions in vampire bat mature lysozyme
      change its catalytic properties or antibacterial spectrum relative to
      lysozymes of insectivorous and frugivorous phyllostomid bats?
    experts:
      - David M. Irwin
      - Yang Liu
  - question: >-
      Is salivary lysozyme delivered to the host bite wound in amounts that
      matter for wound microbiology, or does it act principally to protect the
      bat's own oral cavity and ingested blood meal?
    experts:
      - Ivo M. B. Francischetti
      - José M. C. Ribeiro
  - question: >-
      Why is lysozyme concentrated in the accessory rather than the principal
      submaxillary gland, and does that compartmentalisation separate
      antimicrobial from anti-hemostatic salivary functions?
suggested_experiments:
  - hypothesis: >-
      Sanguivore-specific substitutions in vampire bat lysozyme alter its
      antibacterial spectrum or its activity under the ionic conditions of blood.
    description: >-
      Express recombinant D. rotundus LYZ alongside lysozyme from a frugivorous
      phyllostomid and human LYZ; compare turbidimetric muramidase rates on
      Micrococcus lysodeikticus cell walls across pH and NaCl gradients, and
      determine minimum inhibitory concentrations against Gram-positive and
      Gram-negative bacteria with and without an outer-membrane permeabiliser.
      Test individual sanguivore-clade substitutions by site-directed mutagenesis
      in the frugivorous background.
    experiment_type: Recombinant enzymology with site-directed mutagenesis
  - hypothesis: >-
      Vampire bat lysozyme is secreted into saliva and reaches the host bite
      site.
    description: >-
      Quantify lysozyme in saliva expectorated by feeding bats by targeted
      parallel reaction monitoring mass spectrometry, and localise the protein
      within accessory versus principal submaxillary gland sections by
      immunohistochemistry.
    experiment_type: Targeted proteomics and immunohistochemistry
  - hypothesis: >-
      In the absence of a duplicated paralogue, the single vampire bat lysozyme
      also acts on the ingested blood meal in the digestive tract.
    description: >-
      Measure lysozyme transcript abundance and muramidase activity in stomach
      and intestinal tissue and contents versus salivary gland, and assay the
      recombinant enzyme for stability and activity at gastric pH and against
      pepsin.
    experiment_type: Tissue expression profiling with activity assay
