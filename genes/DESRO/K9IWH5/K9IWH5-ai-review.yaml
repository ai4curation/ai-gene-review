  - term:
      id: GO:0050830
      label: defense response to Gram-positive bacterium
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    review:
      summary: >-
        Gram-positive bacteria are the canonical target of c-type lysozymes,
        because their thick peptidoglycan is directly accessible to the enzyme.
        The human orthologue LYZ carries this annotation from direct assay
        (IDA), and the TreeGrafter propagation to the bat protein is
        appropriate. An earlier version of this review proposed replacing this
        term with the broader GO:0042742; that would discard information, since
        the general term is separately annotated and retained.
      action: ACCEPT
      reason: >-
        This is the well-supported, mechanistically explained specificity of
        c-type lysozyme, and the broad parent is annotated separately. Keep the
        specific term.
      supported_by:
        - &id_bacteriolytic
          reference_id: file:DESRO/K9IWH5/K9IWH5-uniprot.txt
          supporting_text: 'Lysozymes have primarily a bacteriolytic function'
        - &id_grampos
          reference_id: file:DESRO/K9IWH5/K9IWH5-deep-research-falcon.md
          supporting_text: >-
            GH22 lysozymes prefer Gram-positive bacteria due to accessibility of
            peptidoglycan, but they can exhibit activity against Gram-negative
            bacteria when the outer membrane barrier is compromised
  - term:
      id: GO:0050829
      label: defense response to Gram-negative bacterium
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    review:
      summary: >-
        Activity against Gram-negative bacteria is the secondary, well-described
        behaviour of mammalian c-type lysozymes: the outer membrane shields the
        peptidoglycan, so killing requires permeabilisation, but the activity is
        real and the human orthologue carries the same annotation by
        phylogenetic inference. As with the Gram-positive term, an earlier
        version of this review proposed generalising this to GO:0042742, which
        would lose the distinction between the primary and secondary spectrum.
      action: ACCEPT
      reason: >-
        Consistent with the characterised spectrum of mammalian c-type lysozyme
        and with the same TreeGrafter propagation applied to the human
        orthologue. Retained at the specific level.
      supported_by:
        - *id_grampos
        - *id_bacteriolytic
  - term:
      id: GO:0042742
      label: defense response to bacterium
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        The general antibacterial defence term, correct as the umbrella over the
        two spectrum-specific terms above. Supported by the UniProt
        Antimicrobial and Bacteriolytic enzyme keywords and by the description
        of c-type lysozyme as an innate immune effector that kills bacteria by
        degrading their cell wall peptidoglycan.
      action: ACCEPT
      reason: >-
        Correct and directly supported. Retained as the general parent alongside
        the specific Gram-positive and Gram-negative terms.
      supported_by:
        - *id_bacteriolytic
        - &id_innate
          reference_id: PMID:31506780
