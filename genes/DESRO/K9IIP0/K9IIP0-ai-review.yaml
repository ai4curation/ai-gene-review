core_functions:
  - description: >-
      Secreted hyaladherin that binds hyaluronan through its Link module and
      remodels hyaluronan-rich extracellular matrix, both by non-covalent
      cross-linking and by covalently transferring inter-alpha-inhibitor heavy
      chains onto hyaluronan. The same module sequesters C-X-C and C-C
      chemokines and blocks their presentation on endothelial
      glycosaminoglycans, suppressing neutrophil recruitment and damping
      inflammation. In the vampire bat the protein is an abundant product of the
      principal submaxillary salivary gland.
    supported_by:
      - reference_id: PMID:23411029
        supporting_text: >-
          The N-terminal domain of TSG-6 represents a structural motif known as
          the Link module, which confers affinity for hyaluronan.
        reference_section_type: DISCUSSION
      - reference_id: PMID:23411029
        supporting_text: >-
          TSG-6 inhibits inflammation, according to several in vivo models
        reference_section_type: DISCUSSION
      - reference_id: file:DESRO/K9IIP0/K9IIP0-uniprot.txt
        supporting_text: >-
          is required for transesterification of the HC to hyaluronan.
    molecular_function:
      id: GO:0005540
      label: hyaluronic acid binding
    directly_involved_in:
      - id: GO:0050728
        label: negative regulation of inflammatory response
    locations:
      - id: GO:0005615
        label: extracellular space
    knowledge_gaps:
      - gap_statement: >-
          The function of the C-terminal CUB domain of TSG-6 is undetermined in
          any species, and for this protein the uncertainty is compounded:
          UniProt flags that the sequence lacks conserved residues required for
          propagating CUB feature annotation, so it is unknown whether the bat
          CUB domain is even intact in the functional sense.
        boundary: >-
          What is established is the Link module half: it binds hyaluronan,
          cross-links it, transfers inter-alpha-inhibitor heavy chains onto it,
          and sequesters chemokines. The CUB domain is detected by PROSITE
          PS01180 at residues 135-247 and is required, together with the Link
          module, for some interactions (ITIH1, TNFSF11, fibronectin), but no
          activity has been assigned to it.
        gap_kind:
          - BIOLOGY
        dark_aspect: RESIDUAL_SUBGAP
        status: OPEN
        significance: >-
          Half of a protein that reaches the fourth-highest abundance in the
          vampire bat salivary proteome has no assigned function; if the bat CUB
          domain is degenerate, that would suggest the salivary protein has been
          specialised toward the Link-module functions alone.
        resolution: >-
          Align the bat CUB domain against characterised CUB domains to identify
          which conserved residues are absent, then compare full-length
          recombinant bat TSG-6 with an isolated Link module in heavy-chain
          transfer and fibronectin-binding assays.
        provenance:
          - reference_id: PMID:23411029
            supporting_text: >-
              The C terminal half of TSG-6 forms a CUB (complement subcomponents
              C1r/C1s, Uegf, BMP-1) domain whose function remains unidentified
