suggested_questions:
  - question: >-
      Is the abundant salivary TSG-6 of Desmodus rotundus delivered to the host
      bite wound, and does it suppress host neutrophil recruitment there?
    experts:
      - Ivo M. B. Francischetti
      - José M. C. Ribeiro
  - question: >-
      Does salivary TSG-6 interact functionally with the bat's own salivary
      plasminogen activator, given that mammalian TSG-6 potentiates the
      antiplasmin activity of inter-alpha-inhibitor?
  - question: >-
      Is GO:0106435 carboxylesterase activity the right term for the TSG-6
      heavy-chain transfer reaction, or is a transferase-branch term warranted?
      The reaction is two transesterifications with no net hydrolysis, so the
      hydrolase-branch term used for the human orthologue describes the chemistry
      poorly even though it is the established consortium precedent.
    experts:
      - Anthony J. Day
      - Jan J. Enghild
  - question: >-
      What distinguishes the two TSG-6 family members transcribed in vampire bat
      salivary gland, one of which carries C-terminal deletions - are they
      functionally redundant or specialised?
    experts:
      - Anthony J. Day
suggested_experiments:
  - hypothesis: >-
      Vampire bat salivary TSG-6 retains the heavy-chain transferase activity of
      mammalian TSG-6 despite the flagged CUB domain divergence.
    description: >-
      Express recombinant full-length bat TSG-6 and its isolated Link module,
      incubate each with inter-alpha-inhibitor and hyaluronan in the presence of
      magnesium, and detect heavy chain-hyaluronan complex formation by Western
      blot against inter-alpha-inhibitor heavy chains, using human TSG-6 as the
      positive control.
    experiment_type: In vitro heavy-chain transfer assay
  - hypothesis: >-
      Salivary TSG-6 suppresses host leukocyte recruitment at the bite site.
    description: >-
      Measure binding of recombinant bat TSG-6 to a panel of host C-X-C and C-C
      chemokines by surface plasmon resonance, then test whether it inhibits
      chemokine-driven neutrophil transendothelial migration across a host
      endothelial monolayer.
    experiment_type: Surface plasmon resonance and transendothelial migration assay
  - hypothesis: >-
      The C-terminal CUB domain of the bat protein is degenerate, specialising
      it toward Link-module functions.
    description: >-
      Align the bat CUB domain against characterised CUB domains to identify
      which conserved residues are missing, model the domain with AlphaFold, and
      compare full-length bat TSG-6 with a CUB-deleted construct in fibronectin
      binding and heavy-chain transfer assays.
    experiment_type: Comparative sequence and structure analysis with domain-deletion assays
