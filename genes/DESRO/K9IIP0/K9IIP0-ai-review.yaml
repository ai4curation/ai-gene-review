id: K9IIP0
gene_symbol: K9IIP0
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9430
  label: Desmodus rotundus
description: >-
  K9IIP0 is the common vampire bat orthologue of TSG-6 (TNFAIP6, tumor necrosis
  factor-inducible gene 6 protein), a secreted, inflammation-inducible
  glycoprotein of the extracellular matrix. The 277-residue precursor has a
  signal peptide (residues 1-17) followed by the two modules that define the
  family: an N-terminal Link module (residues 36-129, with the canonical
  58-127 and 82-103 disulfides) that binds hyaluronan, and a C-terminal CUB
  domain (residues 135-247). Through the Link module TSG-6 binds hyaluronan and
  non-covalently cross-links it, and it catalyses the covalent transfer of
  inter-alpha-inhibitor heavy chains onto hyaluronan to build heavy chain-
  hyaluronan complexes, remodelling matrices at sites of inflammation. The same
  module binds a wide range of C-X-C and C-C chemokines and thereby blocks their
  presentation on endothelial glycosaminoglycans, which is the mechanistic basis
  of the protein's anti-inflammatory action: mammalian TSG-6 suppresses
  neutrophil transendothelial migration and dampens inflammation in numerous in
  vivo models. In D. rotundus at least two TSG-6 family members are transcribed
  in the submaxillary salivary glands, and TSG-6 was confirmed in the principal
  gland proteome by LC-MS/MS, making it one of the more abundant salivary
  proteins and a candidate anti-inflammatory component of the bite-site
  secretion.
existing_annotations:
  - term:
      id: GO:0005540
      label: hyaluronic acid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: >-
        Hyaluronan binding is the defining activity of the Link module, and the
        Link module of this protein is intact and confidently detected
        (PROSITE PS50963, residues 36-129, with both canonical disulfides
        annotated). The human orthologue TNFAIP6 carries this term from direct
        assay. The UniProt CAUTION does not bear on this call: it is scoped to
        PROSITE ProRule PRU00059, which is the CUB domain rule, not the Link
        rule (PRU00323) that supports the Link module features here.
      action: ACCEPT
      reason: >-
        Intact, well-detected Link module plus direct experimental support in
        the human orthologue. The earlier UNDECIDED reflected a misreading of
        the CAUTION, which concerns the CUB domain.
      supported_by:
        - &id_link
          reference_id: file:DESRO/K9IIP0/K9IIP0-uniprot.txt
          supporting_text: 'DOMAIN          36..129'
        - &id_linkmod
          reference_id: PMID:23411029
          supporting_text: >-
            The N-terminal domain of TSG-6 represents a structural motif known as
            the Link module, which confers affinity for hyaluronan.
          reference_section_type: DISCUSSION
        - &id_hamod
          reference_id: file:DESRO/K9IIP0/K9IIP0-deep-research-falcon.md
          supporting_text: >-
            The Link module mediates binding to hyaluronan (HA) and other
            glycosaminoglycans
  - term:
      id: GO:0005615
      label: extracellular space
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    review:
      summary: >-
        The precursor has a SignalP-predicted signal peptide (1-17) with a
        cleaved 18-277 mature chain, TSG-6 is a classical secreted matrix
        protein, the human orthologue is annotated to the extracellular region
        from direct assay, and TSG-6 was recovered from the D. rotundus
        principal submaxillary gland proteome by LC-MS/MS. As with the
        hyaluronan binding call, the CAUTION concerns the CUB domain and says
        nothing about localisation.
      action: ACCEPT
      reason: >-
        Signal peptide, family behaviour, and orthologue annotation all agree.
        The LC-MS/MS detection was made on principal gland tissue, so strictly
        it is expression evidence rather than localisation evidence; it
        corroborates that the protein is made in quantity here, while the
        secreted localisation itself rests on the signal peptide, the classical
        secreted family, and the direct-assay annotation of the human
        orthologue. Upgraded from UNDECIDED.
      supported_by:
        - reference_id: file:DESRO/K9IIP0/K9IIP0-uniprot.txt
          supporting_text: 'SIGNAL          1..17'
        - &id_proteome
          reference_id: PMID:23411029
          supporting_text: >-
            Of note, expression of TSG-6 was confirmed by the proteome of the PS
            gland (Figure 2A).
          reference_section_type: RESULTS
        - reference_id: file:DESRO/K9IIP0/K9IIP0-deep-research-falcon.md
          supporting_text: >-
            It is secreted into the extracellular space and acts in the ECM and
            pericellular matrix.
  - term:
      id: GO:0050728
      label: negative regulation of inflammatory response
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    review:
      summary: >-
        Anti-inflammatory action is the best-characterised biology of TSG-6, not
        a peripheral inference: the Link module binds chemokines and blocks
        their presentation on endothelial glycosaminoglycans, suppressing
        neutrophil transendothelial migration, and the protein inhibits
        inflammation across several in vivo models. The human orthologue carries
        this exact term both from direct assay (PMID:21569482) and by
        phylogenetic inference, so the TreeGrafter propagation to the bat
        protein is a legitimate transfer rather than an over-propagation. An
        earlier version of this review removed the term; there is no biological
        argument against it.
      action: ACCEPT
      reason: >-
        Well-supported family function with experimental backing in the human
        orthologue and an identified mechanism that depends on the Link module,
        which is intact in this protein. REMOVE is reserved for annotations that
        can be argued against on biological grounds; this one cannot.
      supported_by:
        - &id_antiinf
          reference_id: PMID:23411029
          supporting_text: >-
            TSG-6 inhibits inflammation, according to several in vivo models
          reference_section_type: DISCUSSION
        - &id_neutro
          reference_id: PMID:23411029
          supporting_text: >-
            TSG-6 also inhibits neutrophil migration to interact with macrophage
            CD44
          reference_section_type: DISCUSSION
  - term:
      id: GO:0016787
      label: hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        This keyword-derived term is uninformative but, contrary to an earlier
        version of this review, it is not wrong. TSG-6 does catalyse a covalent
        chemical step: it transfers inter-alpha-inhibitor heavy chains onto
        hyaluronan via a TSG-6-heavy-chain ester intermediate. The human
        orthologue TNFAIP6 is annotated to GO:0106435 carboxylesterase activity
        from two independent direct assays (PMID:16873769, PMID:20463016), and
        GO:0106435 is a descendant of GO:0016787. The UniProt record for this
        very protein states that the ITIH2/HC2 interaction is required for
        transesterification of the heavy chain to hyaluronan.
      action: MODIFY
      reason: >-
        Replace the root-level hydrolase term with the specific child
        GO:0106435 carboxylesterase activity, which is the term the GO
        consortium uses for the experimentally demonstrated heavy-chain transfer
        activity of the human orthologue. Removing the annotation, as previously
        proposed, would have discarded a real catalytic function. Caveat to
        record explicitly: carboxylesterase activity is defined as ester
        hydrolysis, whereas TSG-6 performs two sequential transesterifications
        with no net hydrolysis, the heavy chain moving from the chondroitin
        sulfate of inter-alpha-inhibitor onto hyaluronan through a covalent
        TSG-6-heavy-chain ester intermediate. GO:0106435 is used here because it
        is the term the consortium applies to the human orthologue, not because
        the chemistry is a good fit; a transferase-branch term would describe
        the reaction better (see suggested_questions).
      proposed_replacement_terms:
        - id: GO:0106435
          label: carboxylesterase activity
      supported_by:
        - &id_transest
          reference_id: file:DESRO/K9IIP0/K9IIP0-uniprot.txt
          supporting_text: >-
            is required for transesterification of the HC to hyaluronan.
        - &id_transest2
          reference_id: file:DESRO/K9IIP0/K9IIP0-deep-research-falcon.md
          supporting_text: >-
            enzymatic transesterase activity transferring I
        - &id_hc_catalytic
          reference_id: PMID:20463016
          supporting_text: >-
            In concert with HC2, TSG-6 have a unique catalytic activity
            transferring HCs from bikunin proteins to hyaluronan (HA).
          reference_section_type: INTRODUCTION
        - &id_hc_ester
          reference_id: PMID:20463016
          supporting_text: >-
            The reaction involves two divalent cation-dependent
            transesterifications and a covalent intermediate composed of TSG-6
            and the HC to be transferred
          reference_section_type: INTRODUCTION
        - &id_hc_catalyst
          reference_id: PMID:26468290
          supporting_text: >-
            TSG-6 was shown to play a direct role in the transfer of HCs from
            IαI onto HA via the formation of covalent intermediates
          reference_section_type: INTRODUCTION
  - term:
      id: GO:0007155
      label: cell adhesion
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    review:
      summary: >-
        This comes from the UniProt Cell adhesion keyword. Even in the human
        orthologue the term has never risen above electronic evidence, and the
        documented matrix biology of TSG-6 is hyaluronan binding,
        cross-linking, and heavy-chain transfer rather than adhesion between
        cells. Any effect on adhesion is indirect, through the altered
        hyaluronan matrix, and is better captured by the hyaluronan terms.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        Keyword-derived, unsupported by experiment in any species, and
        attributing to the protein a role that is a downstream consequence of
        its matrix remodelling rather than its own activity.
      supported_by:
        - reference_id: file:DESRO/K9IIP0/K9IIP0-uniprot.txt
          supporting_text: 'Cell adhesion {ECO:0000256|ARBA:ARBA00022889};'
        - *id_hamod
  - term:
      id: GO:0030212
      label: hyaluronan metabolic process
    evidence_type: ISS
    original_reference_id: PMID:20463016
    review:
      summary: >-
        Proposed new annotation. The heavy-chain transfer reaction covalently
        modifies hyaluronan to form heavy chain-hyaluronan complexes, which is a
        hyaluronan metabolic process; the human orthologue carries this term
        from two direct assays (PMID:20463016, PMID:26468290). This is the
        biological process counterpart of the carboxylesterase activity proposed
        above, and the GOA record for this protein has no term covering it.
      action: NEW
      reason: >-
        Completes the molecular function to biological process link for the
        heavy-chain transfer activity, and mirrors the experimentally supported
        annotation of the human orthologue. Anchored to the orthologue
        experimental evidence (PMID:20463016, PMID:26468290) rather than to the
        deep-research survey, since the justification is orthologue transfer.
      supported_by:
        - *id_transest
        - reference_id: PMID:20463016
          supporting_text: >-
            can be transferred to different hyaluronan (HA) molecules by
            TSG-6/HC2
          reference_section_type: ABSTRACT
        - reference_id: PMID:26468290
          supporting_text: >-
            both HC1 and HC2 of IαI can be covalently transferred onto the
            C6-hydroxyls of the N-acetyl glucosamine sugars in HA
          reference_section_type: INTRODUCTION
