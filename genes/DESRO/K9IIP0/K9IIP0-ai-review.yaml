  - id: PMID:20463016
    title: The TSG-6/HC2-mediated transfer is a dynamic process shuffling heavy
      chains between glycosaminoglycans.
    findings:
      - statement: >-
          TSG-6, acting with heavy chain 2, has a catalytic activity that
          transfers inter-alpha-inhibitor heavy chains onto hyaluronan. This is
          the direct experimental basis for the carboxylesterase activity term
          on the human orthologue and, by orthology, for the proposed
          replacement term here.
        supporting_text: >-
          In concert with HC2, TSG-6 have a unique catalytic activity
          transferring HCs from bikunin proteins to hyaluronan (HA).
        reference_section_type: INTRODUCTION
      - statement: >-
          The reaction proceeds by two divalent cation-dependent
          transesterifications through a covalent TSG-6-heavy-chain
          intermediate, which is why the chemistry is transesterification rather
          than the net hydrolysis that GO:0106435 formally describes.
        supporting_text: >-
          The reaction involves two divalent cation-dependent
          transesterifications and a covalent intermediate composed of TSG-6 and
          the HC to be transferred
        reference_section_type: INTRODUCTION
      - statement: >-
          Heavy chains are transferred onto hyaluronan and can be further
          shuffled between glycosaminoglycans, so the activity covalently
          modifies hyaluronan itself - the basis of the proposed hyaluronan
          metabolic process annotation.
        supporting_text: >-
          can be transferred to different hyaluronan (HA) molecules by TSG-6/HC2
        reference_section_type: ABSTRACT
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Cached full text available. Human/bovine biochemistry, cited here as the
        orthologue evidence underpinning the ISS transfer to the bat protein;
