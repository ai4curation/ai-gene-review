        significance: >-
          The antiplasmin angle is the interesting one: vampire bat saliva's
          best-characterised component is a plasminogen activator, so a salivary
          protein that potentiates an antiplasmin would either counterbalance it
          or act on a different compartment. Resolving this would say whether
          the two are functionally coupled.
        resolution: >-
          Test recombinant bat TSG-6 on host neutrophil transendothelial
          migration and on chemokine binding, and assay its effect on
          plasmin generation in the presence of inter-alpha-inhibitor and of the
          bat's own salivary plasminogen activator.
