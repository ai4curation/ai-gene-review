  - description: >-
      Catalyses the covalent transfer of inter-alpha-inhibitor heavy chains onto
      hyaluronan, through two divalent cation-dependent transesterifications
      that proceed via a covalent TSG-6-heavy-chain ester intermediate, building
      the heavy chain-hyaluronan complexes that stabilise and cross-link
      hyaluronan-rich matrices. This is a distinct catalytic function from the
      non-covalent hyaluronan binding of the Link module, and for the bat
      protein it is inferred by orthology: the activity is experimentally
      established for mammalian TSG-6 and the corresponding UniProt statement is
      made for this record, but the bat protein itself has not been assayed. The
      GO term is the one the consortium applies to the human orthologue;
      chemically the reaction is a transesterification rather than the net
      hydrolysis that carboxylesterase activity denotes.
