      - gap_statement: >-
          It is undetermined whether salivary TSG-6 acts on the host at the bite
          site, and if so whether its principal target there is inflammation,
          chemokine-driven leukocyte recruitment, or fibrinolysis via
          inter-alpha-inhibitor.
        boundary: >-
          What is established is that TSG-6 is abundant in the bat principal
          submaxillary gland at both transcript and protein level, and that
          mammalian TSG-6 suppresses neutrophil transendothelial migration and
          potentiates the antiplasmin activity of inter-alpha-inhibitor. The
          Vampirome authors propose the anti-inflammatory salivary role
          explicitly as a possibility, not a finding.
