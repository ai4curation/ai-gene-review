      action: ACCEPT
      reason: >-
        The protein carries the DNase I family signatures (InterPro DNase_I
        IPR016202, PIRSF000988), and by similarity to human DNase X (DNASE1L1),
        whose recombinant enzyme catalyses DNA hydrolysis (PMID:11141064), it
        degrades DNA, which is DNA catabolism performed by the enzyme itself.
