  - term:
      id: GO:0005783
      label: endoplasmic reticulum
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: The ER location rests only on an ARBA-predicted UniProt subcellular
        location; the DNASE1L1 ortholog resides on the cell surface, so ER is
        secretory-pathway transit, not residence.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        Changed from ACCEPT. The UniProt subcellular-location line behind this
        GO_REF:0000044 row is an ARBA prediction, not curated evidence. By similarity
        to human DNase X (DNASE1L1), whose endogenous protein is a GPI-anchored
        cell-surface enzyme (PMID:17416904), this DNase I-family protein passes
        through the ER on the way to the plasma membrane. Following the
        root-organelle policy (ER transit is not residence), a synthesis row resting
        on transit is an over-annotation. No ER-residence assay exists for this
        protein or its orthologs in the reviewed sources.
      supported_by:
        - reference_id: PMID:17416904
          supporting_text: expressed on the cell surface as a glycosylphosphatidylinositolanchored membrane protein
