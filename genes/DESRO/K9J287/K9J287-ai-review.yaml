existing_annotations:
  - term:
      id: GO:0003677
      label: DNA binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: DNA binding is substrate binding for a DNase I-family nuclease. UniProt
        names this fragment Deoxyribonuclease-1-like 1, and the review already accepts
        deoxyribonuclease I activity (GO:0004530) and DNA catabolic process (GO:0006308),
        both of which require the enzyme to engage DNA.
      action: KEEP_AS_NON_CORE
      reason: Relaxed from MARK_AS_OVER_ANNOTATED on re-review. The previous rejection
        gave only the absence of a direct binding assay, which is not evidence against
        the propagation. Binding DNA is entailed by the DNase I activity accepted
        elsewhere in this review, so the term is true rather than over-attributed; it is simply less informative than the catalytic term, so it is retained as non-core rather than as a core function.
  - term:
      id: GO:0004530
      label: deoxyribonuclease I activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    review:
      summary: DNase I-like annotation supports deoxyribonuclease I activity.
      action: ACCEPT
      reason: UniProt names this protein deoxyribonuclease-1-like 1, consistent 
        with DNase I activity.
      supported_by:
        - &id001
          reference_id: file:DESRO/K9J287/K9J287-uniprot.txt
          record_section: [DE]
          supporting_text: '"RecName: Full=Deoxyribonuclease-1-like 1"'
        - reference_id: file:DESRO/K9J287/K9J287-deep-research-falcon.md
          supporting_text: 'The UniProt accession K9J287 provided corresponds to a protein annotated as a deoxyribonuclease I-like 1 (DNASE1L1; also known as DNase X) fragment in Desmodus rotundus (vampire bat), belonging to the DNase I family'
  - term:
      id: GO:0005634
      label: nucleus
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Nuclear localization is not supported; the DNASE1L1 (DNase X) ortholog
        is a GPI-anchored cell-surface enzyme, and nuclear entry is a property of
        the DNase gamma (DNASE1L3) paralog.
      action: REMOVE
      reason: >-
        No evidence places this protein or its orthologs in the nucleus. By similarity
        to human DNase X (DNASE1L1), whose endogenous protein was shown with a
        monoclonal antibody to sit on the cell surface as a GPI-anchored membrane
        protein (PMID:17416904), the protein acts outside the cell. In the human DNase
        I family study (PMID:11141064) only the paralog DNase gamma (DNASE1L3)
        translocates into the nucleus, during apoptosis, so the TreeGrafter nucleus
        row is a family-level over-propagation from that paralog onto the DNASE1L1
        subfamily (PTHR11371:SF28).
      supported_by:
        - reference_id: PMID:17416904
          supporting_text: expressed on the cell surface as a glycosylphosphatidylinositolanchored membrane protein
        - reference_id: PMID:11141064
          supporting_text: DNase gamma is revealed to be located at the perinuclear region in living cells, and to translocate into the nucleus during apoptosis
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Catalytic activity is too general for this DNase I-like protein.
      action: MODIFY
      reason: >-
        Use the specific deoxyribonuclease I activity term. The protein carries the
        DNase I family signatures (InterPro DNase_I IPR016202, PIRSF000988), and by
        similarity to human DNase X (DNASE1L1), whose recombinant enzyme is a
        Ca2+/Mg2+-dependent endonuclease producing 3'-OH/5'-P ends (PMID:11141064),
        it is a DNase I-type endonuclease. The family membership on this protein is
        the row's own evidence for the deeper term.
      proposed_replacement_terms:
        - id: GO:0004530
          label: deoxyribonuclease I activity
      supported_by:
        - reference_id: PMID:11141064
          supporting_text: "All the recombinant DNases are shown to be Ca(2+)/Mg(2+)-dependent endonucleases and catalyze DNA hydrolysis to produce 3'-OH/5'-P ends"
        - reference_id: file:DESRO/K9J287/K9J287-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: 'InterPro; IPR016202; DNase_I.'
        - reference_id: file:DESRO/K9J287/K9J287-uniprot.txt
          record_section: ["DR:PIRSF"]
          supporting_text: 'PIRSF; PIRSF000988; DNase_I_euk; 1.'
