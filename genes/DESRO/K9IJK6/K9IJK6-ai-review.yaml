id: K9IJK6
gene_symbol: K9IJK6
product_type: PROTEIN
status: IN_PROGRESS

taxon:
  id: NCBITaxon:9430
  label: Desmodus rotundus
description: K9IJK6 is a predicted secreted tissue-type plasminogen activator from the salivary 
  glands of the vampire bat Desmodus rotundus. Its compact DSPA-gamma-like architecture comprises an
  N-terminal signal peptide, a kringle domain and a trypsin-like serine-protease domain. Conserved 
  sequence and phylogenetic evidence support plasminogen activation and extracellular proteolysis 
  associated with the fibrinolytic properties of saliva.


existing_annotations:
- term:
    id: GO:0014909
    label: smooth muscle cell migration
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: Mark full-length tPA smooth-muscle migration transfer as over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The focused OpenScientist report retains the secreted serine-protease/plasminogen-activation
      core but finds no positive evidence that compact salivary DSPA-gamma executes the downstream
      cellular smooth-muscle roles inherited from full-length mammalian tPA. K9IJK6 lacks the finger
      and EGF domains that mediate several noncatalytic tPA receptor/cofactor interactions, so this
      process should not be treated as a core target function.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000667065
        source_label: PTN000667065
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: tPA source placement was recovered, but the focused DSPA-gamma report supports
          treating this as an unsafe transfer from full-length mammalian tPA to compact salivary
          K9IJK6.
    supported_by:
