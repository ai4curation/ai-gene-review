id: K9IJK6
gene_symbol: K9IJK6
product_type: PROTEIN
status: IN_PROGRESS

taxon:
  id: NCBITaxon:9430
  label: Desmodus rotundus
description: K9IJK6 is a predicted secreted tissue-type plasminogen activator from the salivary
  glands of the vampire bat Desmodus rotundus. Its compact DSPA-gamma-like architecture comprises
  an N-terminal signal peptide, a kringle domain and a trypsin-like serine-protease domain.
  Conserved sequence and phylogenetic evidence support plasminogen activation and extracellular
  proteolysis associated with the fibrinolytic properties of saliva.


existing_annotations:
- term:
    id: GO:0014909
    label: smooth muscle cell migration
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: Salivary plasminogen-activator specialization does not alone resolve the additional
      cellular response or signaling claim.
    action: UNDECIDED
    reason: The prior REMOVE relied on absence of bat experiments or on the main fibrinolytic
      role. For TreeGrafter, the exact PTN000667065 graft is below tPA smooth-muscle-migration
      and PDGFR-signaling assertions, not merely a generic protease family. The target has lost
      several noncatalytic domains relative to classical tPA, but the consequences for each
      cellular mechanism require evidence. ARBA response terms also require source/context adjudication.
      No target-specific negative assay was identified; retain uncertainty rather than assert
      functional impossibility.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000667065
        source_label: PTN000667065
        source_status: UNRESOLVED
        comment: tPA source placement recovered; domain and salivary differences need mechanism-specific
          assessment.
    supported_by:
    - reference_id: PMID:23411029
      supporting_text: Predicted secondary structure of DSPAγ shows that it is a truncated form
        displaying only the K1, and protease domains
- term:
    id: GO:0031639
    label: plasminogen activation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: The tPA-like secreted serine protease retains the inferred plasminogen-activating
      catalytic function.
    action: ACCEPT
    reason: The previous UNDECIDED treated the PRU00121 warning as loss of catalytic residues.
      The actual rule concerns kringle-domain disulfide features, not the protease catalytic
      triad. UniProt identifies trypsin His/Ser signatures and a Peptidase S1 region; PMID:23411029
      describes the corresponding salivary DSPA-gamma architecture. The TreeGrafter source PTN000667065
      descends from the plasminogen-activation IBD PTN002799995 and broad protease IBD PTN001208002.
      Retain the conserved catalytic inference without claiming purified target kinetics or
      importing DSPA-alpha1-specific fibrin-selectivity measurements.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000667065
        source_label: PTN000667065
        source_status: SUPPORTS_TRANSFER
        comment: Recovered tPA graft is below the plasminogen-activation IBD. The kringle caution
          is not evidence of catalytic loss.
    supported_by:
    - reference_id: PMID:23411029
      supporting_text: Predicted secondary structure of DSPAγ shows that it is a truncated form
        displaying only the K1, and protease domains
    - reference_id: file:DESRO/K9IJK6/K9IJK6-notes.md
