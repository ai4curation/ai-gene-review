      supporting_text: DSPA beta and -gamma lack the F and F-EGF domains, respectively.
    - reference_id: file:DESRO/K9IJK6/K9IJK6-hypotheses/dspa-gamma-signaling-and-cell-response-capacities/openscientist.md
      supporting_text: No direct DSPA-gamma assay for PDGF-CC cleavage, PDGFR signaling, SMC
