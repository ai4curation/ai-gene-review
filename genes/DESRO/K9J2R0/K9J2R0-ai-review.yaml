  - term:
      id: GO:0005576
      label: extracellular region
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: Secretion is noted, so extracellular region is defensible, but
        the main localization is membrane.
      action: KEEP_AS_NON_CORE
      reason: >-
        By similarity to human DPP4, a soluble form (sDPP4) is released into plasma
        by ectodomain shedding, as summarized in the deep-research synthesis, so
        extracellular region is true, but the main localization is membrane/apical
        membrane. GO has since obsoleted GO:0005615 extracellular space, the
        replacement previously proposed here, and merged it into GO:0005576
        (replaced_by), so this term is now the correct location term.
      supported_by:
        - reference_id: file:DESRO/K9J2R0/K9J2R0-deep-research-falcon.md
          supporting_text: DPP4 functions at the plasma membrane and as sDPP4 in plasma after proteolytic shedding
