      label: serine-type peptidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Serine-type peptidase activity is true of this S9B-family enzyme and
        complements, rather than generalises, its dipeptidyl-peptidase activity.
      action: KEEP_AS_NON_CORE
      reason: >-
        Changed from MODIFY: GO:0008239 dipeptidyl-peptidase activity is not a
        descendant of GO:0008236, so the replacement dropped the catalytic class. Family
        membership supports the serine mechanism: the protein carries the InterPro S9
        serine-peptidase active-site signature (IPR002471), and the deep-research
        synthesis describes the conserved Ser-Asp-His triad of DPP4. Kept as non-core;
        the dipeptidyl-peptidase row carries the core activity.
      supported_by:
        - reference_id: file:DESRO/K9J2R0/K9J2R0-uniprot.txt
