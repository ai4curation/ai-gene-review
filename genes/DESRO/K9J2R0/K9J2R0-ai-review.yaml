  - term:
      id: GO:0031258
      label: lamellipodium membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: Lamellipodium membrane is a plausible, peripheral location transferred
        from the human DPP4 ortholog.
      action: KEEP_AS_NON_CORE
      reason: >-
        Changed from ACCEPT. The UniProt subcellular-location line behind this row is an
        ARBA transfer, not evidence. By similarity, human CD26 (DPP4) relocates with
        CXCR4 into chemokine-induced pseudopodia in lymphocytes (PMID:11278278, abstract
        only); the cached abstract says pseudopodia, and the lamellipodium-specific
        placement was not verified in full text. A leading-edge membrane location is
        peripheral to the peptidase function, so it is non-core.
      supported_by:
        - reference_id: PMID:11278278
          supporting_text: SDF-1alpha and gp120 induce the appearance of pseudopodia in which CD26 and CXCR4 colocalize
  - term:
      id: GO:0042995
      label: cell projection
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: Cell projection is a broad parent term; lamellipodium membrane 
        provides specific localization.
      action: MODIFY
      reason: >-
        Use lamellipodium membrane, carried elsewhere in this review, instead of the
        general cell projection term; both rows derive from the same UniProt
        subcellular-location statement. By similarity, human CD26 (DPP4) localizes to
        chemokine-induced pseudopodia (PMID:11278278), which supports a cell-projection
        membrane location; the lamellipodium refinement rests on the ortholog annotation
        (see the lamellipodium membrane row).
      proposed_replacement_terms:
        - id: GO:0031258
          label: lamellipodium membrane
      supported_by:
        - reference_id: PMID:11278278
          supporting_text: SDF-1alpha and gp120 induce the appearance of pseudopodia in which CD26 and CXCR4 colocalize
  - term:
      id: GO:0045121
      label: membrane raft
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: Membrane raft localization is supported by similarity to human CD26
        (DPP4), which is recruited to lipid rafts on ligation.
      action: ACCEPT
      reason: >-
        By similarity to human CD26 (DPP4): ligation of CD26 by caveolin-1 recruits a
        CD26-CARMA1-Bcl10-IKK complex to lipid rafts in T cells (PMID:17287217). The
        UniProt subcellular-location line behind this row is an ARBA transfer and is not
        itself evidence.
      supported_by:
        - reference_id: PMID:17287217
          supporting_text: Ligation of CD26 by caveolin-1 recruits a complex consisting of CD26, CARMA1, Bcl10, and IkappaB kinase to lipid rafts
