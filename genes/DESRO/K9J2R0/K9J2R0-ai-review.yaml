existing_annotations:
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Plasma membrane localization is supported by similarity to the human
        DPP4 ortholog, a type II transmembrane cell-surface glycoprotein.
      action: ACCEPT
      reason: >-
        By similarity to human DPP4 (CD26), a type II transmembrane glycoprotein
        presented as a dimer on the cell surface (PMID:23486063); the deep-research
        synthesis places the orthologue's activity at the plasma membrane. The
        TreeGrafter row is consistent with the S9B/DPPIV family placement of this
        protein.
      supported_by:
        - reference_id: PMID:23486063
          supporting_text: DPP4 is a multifunctional 766-amino-acid-long type-II transmembrane glycoprotein presented in a dimeric form on the cell surface
        - reference_id: file:DESRO/K9J2R0/K9J2R0-deep-research-falcon.md
          supporting_text: DPP4 functions at the plasma membrane and as sDPP4 in plasma after proteolytic shedding
  - term:
      id: GO:0004177
      label: aminopeptidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    qualifier: enables
    review:
      summary: Aminopeptidase activity is a broad parent term; 
        dipeptidyl-peptidase activity is the specific function.
      action: MODIFY
      reason: >-
        A lateral correction: the keyword-mapped aminopeptidase term (release of a
        single N-terminal residue) is not the activity of this enzyme, which releases
        N-terminal dipeptides; GO:0008239 is not a descendant of GO:0004177. The protein
        carries the S9B/DPPIV family signatures (InterPro IPR050278, Peptidase_S9B_N,
        PANTHER PTHR11731:SF128) and the deep-research synthesis identifies it as the
        vampire bat DPP4 ortholog; by similarity to human DPP4, which removes N-terminal
        dipeptides after a penultimate proline (PMID:23486063, PMID:16651416), it is a
        dipeptidyl peptidase (EC 3.4.14.5).
      proposed_replacement_terms:
        - id: GO:0008239
          label: dipeptidyl-peptidase activity
      supported_by:
        - reference_id: PMID:23486063
          supporting_text: It preferentially cleaves dipeptides from hormones and chemokines after a proline amino acid residue
        - reference_id: PMID:16651416
          supporting_text: serves multiple functions in cleaving the penultimate positioned prolyl bonds at the NH(2) terminus of a variety of physiologically important peptides
        - reference_id: file:DESRO/K9J2R0/K9J2R0-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: 'InterPro; IPR050278; Serine_Prot_S9B/DPPIV.'
        - reference_id: file:DESRO/K9J2R0/K9J2R0-deep-research-falcon.md
          supporting_text: 'Verified identity: K9J2R0 is the Desmodus rotundus ortholog of dipeptidyl peptidase-4 (DPP4/CD26), a peptidase S9B (DPPIV subfamily) serine exopeptidase'
  - term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Serine-type endopeptidase activity is too general; the specific 
        dipeptidyl-peptidase activity is appropriate.
      action: MODIFY
      reason: >-
        A lateral correction: DPP4 is a serine exopeptidase, not an endopeptidase. The
        InterPro S9 serine-peptidase active-site signature (IPR002471) and the conserved
        Ser-Asp-His triad support the serine-type peptidase mechanism, which is kept on
        its own row (GO:0008236). The protein carries the S9B/DPPIV family signatures
        (InterPro IPR050278, Peptidase_S9B_N, PANTHER PTHR11731:SF128) and the
        deep-research synthesis identifies it as the vampire bat DPP4 ortholog; by
        similarity to human DPP4, which removes N-terminal dipeptides after a
        penultimate proline (PMID:23486063, PMID:16651416), it is a dipeptidyl peptidase
        (EC 3.4.14.5).
      proposed_replacement_terms:
        - id: GO:0008239
          label: dipeptidyl-peptidase activity
      supported_by:
        - reference_id: PMID:23486063
          supporting_text: It preferentially cleaves dipeptides from hormones and chemokines after a proline amino acid residue
        - reference_id: PMID:16651416
          supporting_text: serves multiple functions in cleaving the penultimate positioned prolyl bonds at the NH(2) terminus of a variety of physiologically important peptides
        - reference_id: file:DESRO/K9J2R0/K9J2R0-uniprot.txt
          record_section: ["DR:InterPro"]
          supporting_text: 'InterPro; IPR050278; Serine_Prot_S9B/DPPIV.'
        - reference_id: file:DESRO/K9J2R0/K9J2R0-deep-research-falcon.md
          supporting_text: 'Verified identity: K9J2R0 is the Desmodus rotundus ortholog of dipeptidyl peptidase-4 (DPP4/CD26), a peptidase S9B (DPPIV subfamily) serine exopeptidase'
        - reference_id: file:DESRO/K9J2R0/K9J2R0-uniprot.txt
