  review:
    summary: Retain the inferred mucosal innate-defense role of a salivary beta-defensin.
    action: ACCEPT
    reason: The beta-defensin fold and conserved secretory architecture support an inherited innate 
      effector function. The target transcript was obtained from salivary gland and the native 
      vampirome study reports defensin-family expression in accessory glands, consistent with an 
      oral mucosal context. No lineage-specific loss is established; lack of a purified bat assay 
      does not itself make the inherited term too specific.
