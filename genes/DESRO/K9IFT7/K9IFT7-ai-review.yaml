- id: file:DESRO/K9IFT7/K9IFT7-deep-research-falcon.md
  title: Falcon report on Desmodus rotundus K9IFT7 beta-defensin 1-like peptide
  findings:
  - statement: The report supports the secreted beta-defensin fold and antimicrobial inference but 
      does not identify target-specific potency, spectrum or CCR6-binding experiments. Bat 
      DEFB105/DEFB107 expansions are family background rather than evidence about this accession.
    supporting_text: Species-specific experimental function and localization for K9IFT7 in D. 
      rotundus have not been directly reported in the available context.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Read in full; useful family synthesis, but exact CCR6 transfer is unresolved and 
      unrelated paralog expansions cannot establish this target function.
