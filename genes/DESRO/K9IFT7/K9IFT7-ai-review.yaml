  title: 'The "Vampirome": Transcriptome and proteome analysis of the principal and accessory submaxillary
    glands of the vampire bat Desmodus rotundus, a vector of human rabies.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native Desmodus salivary transcriptome/proteome study, linked to JAA44743.1 in the
      UniProt nucleotide-sequence provenance; full text inspected. The defensin-family observation 
      is expression/context, not a purified K9IFT7 assay.
- id: PMID:21248850
  title: Reduction of disulphide bonds unmasks potent antimicrobial activity of human β-defensin 1.
  reference_review:
    relevance: HIGH
