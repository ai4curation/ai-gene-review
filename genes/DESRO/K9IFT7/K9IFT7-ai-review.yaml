taxon:
  id: NCBITaxon:9430
  label: Desmodus rotundus
description: K9IFT7 is a 67-residue beta-defensin 1-like precursor from the vampire bat Desmodus 
  rotundus, with a predicted N-terminal signal peptide and a cysteine-rich beta-defensin domain. Its
  salivary-gland transcript and conserved defensin architecture support secretion of an innate 
  antimicrobial peptide at oral mucosal surfaces. Antibacterial function is inferred from the 
  defensin family; the potency, redox dependence and target spectrum of the bat peptide have not 
  been measured in the inspected studies. Its proposed interaction with CCR6 remains unresolved.
