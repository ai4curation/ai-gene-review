        supporting_text: 'Belongs to the natriuretic peptide family.'
  - id: file:DESRO/K9IWC0/K9IWC0-deep-research-falcon.md
    title: Deep research report on K9IWC0
    findings:
      - statement: >-
          The report accepted the UniProt "Natriuretic peptides B" name without
          checking it and built its entire narrative on BNP cardiac-biomarker
          biology (NT-proBNP thresholds, heart failure diagnostics, NPR1 agonist
          antibodies), none of which applies to a salivary C-type natriuretic
          peptide.
        supporting_text: >-
          UniProt K9IWC0 corresponds to a natriuretic peptide B precursor (BNP
          prohormone) annotated in Desmodus rotundus (vampire bat)
      - statement: >-
          The report does correctly state the receptor division of labour within
          the family, which is what makes the paralogue misassignment
          consequential.
        supporting_text: 'is the cognate receptor for CNP'
    reference_review:
      relevance: LOW
      correctness: UNVERIFIED
      review_notes: >-
        LLM-generated survey that propagated the UniProt paralogue
        misassignment. It did not consult the PANTHER subfamily assignment in
        the same UniProt record, did not find the Vampirome study that names the
        bat salivary peptide as CNP, and devoted most of its length to human
        heart-failure biomarker literature irrelevant to this protein. Cited
        here only as the record of that error and for its correct statement of
        family receptor usage.
core_functions:
  - description: >-
      Secreted C-type natriuretic peptide that acts extracellularly as a
      paracrine peptide hormone, binding the receptor guanylyl cyclase NPR2
      (GC-B) on vascular smooth muscle to raise cGMP and relax the vessel. In
      the vampire bat it is a product of the principal submaxillary salivary
      gland and is understood as one of the salivary vasodilators that maintain
      blood flow at the bite site.
    supported_by:
      - reference_id: file:DESRO/K9IWC0/K9IWC0-bioinformatics/RESULTS.md
        supporting_text: 'Best match: **human NPPC / CNP**.'
      - reference_id: PMID:23411029
        supporting_text: >-
          CNP is a potent relaxant of arterial and venous smooth muscle in most
          mammalian species in vitro and is thought to act locally as a
          paracrine/autoregulator
        reference_section_type: DISCUSSION
      - reference_id: PMID:23411029
        supporting_text: >-
          The bat PS SGs express high transcriptional levels of CNP (Table 4).
        reference_section_type: RESULTS
    molecular_function:
      id: GO:0005179
      label: hormone activity
    directly_involved_in:
      - id: GO:0007168
        label: receptor guanylyl cyclase signaling pathway
      - id: GO:0006182
        label: cGMP biosynthetic process
      - id: GO:0042311
        label: vasodilation
    locations:
      - id: GO:0005615
        label: extracellular space
    knowledge_gaps:
      - gap_statement: >-
          It is undetermined whether the vampire bat salivary CNP acts on the
          host at the bite site or on the bat's own tissues, and no vasodilator
          activity has been measured for the bat peptide at all.
        boundary: >-
          What is established is the paralogue identity (72.3% identity to human
          NPPC, precursor terminating at the ring cysteine), high transcript
          abundance in the principal submaxillary gland, and that mammalian CNP
          is a potent smooth muscle relaxant acting through NPR2. What is
          missing is any assay of the bat peptide and any demonstration that it
          is delivered to the host.
        gap_kind:
          - BIOLOGY
        dark_aspect: BP_DARK
        status: OPEN
        significance: >-
          The whole interpretation of this gene turns on this question: a
          host-directed salivary vasodilator is part of the vampire bat feeding
          pharmacopoeia, whereas a self-directed paracrine peptide is
          unremarkable endothelial biology that happens to be transcribed in a
          gland.
        resolution: >-
          Synthesise the mature bat CNP ring peptide and measure relaxation of
          pre-constricted host arterial rings in a myograph, alongside cGMP
          accumulation in cells expressing host NPR2; and confirm by targeted
          mass spectrometry that the peptide is present in expectorated saliva.
        provenance:
          - reference_id: PMID:23411029
            supporting_text: 'The function of bat CNP is related to vasodilation.'
            reference_section_type: DISCUSSION
      - gap_statement: >-
          The UniProt protein name for this entry assigns the wrong natriuretic
          peptide paralogue, and the FUNCTION text describing NPR1 activation is
          BNP biology that does not apply to this protein. This is a curation
          gap that will keep producing incorrect receptor-specific inferences
          until it is corrected upstream.
        boundary: >-
          The evidence against the name is unambiguous and internal to the
          record: PANTHER assigns subfamily PTHR12167:SF2 "C-TYPE NATRIURETIC
          PEPTIDE", the source publication names the bat salivary peptide CNP,
          and the sequence is 72.3% identical to human NPPC versus 31.9% to
          NPPB. No ontology term is missing; the annotation is simply attached
          to the wrong paralogue name.
        gap_kind:
          - CURATION
        dark_aspect: MF_DARK
        status: OPEN
        significance: >-
          Downstream consumers inherit the error: the deep research report for
          this gene built an entire BNP heart-failure-biomarker narrative on the
          incorrect name, and any NPR1-specific GO annotation propagated from
          the FUNCTION text would be wrong.
        resolution: >-
          Report the misassignment to UniProt so the ARBA-derived name and the
          BNP FUNCTION block are replaced with C-type natriuretic peptide and
          NPR2-based text.
        provenance:
          - reference_id: file:DESRO/K9IWC0/K9IWC0-uniprot.txt
            supporting_text: >-
              Acts by specifically binding and stimulating NPR1 to
          - reference_id: file:DESRO/K9IWC0/K9IWC0-bioinformatics/RESULTS.md
            supporting_text: 'Best match: **human NPPC / CNP**.'
suggested_questions:
  - question: >-
      Is the CNP transcribed in the vampire bat principal submaxillary gland
      actually secreted into saliva and delivered to the host, and does it
      relax host vessels at physiologically achievable concentrations?
    experts:
      - Ivo M. B. Francischetti
      - José M. C. Ribeiro
  - question: >-
      Does salivary CNP act in concert with the other vampire bat salivary
      vasodilator PACAP, and if so are their effects additive or do they target
      different vessel beds at the bite site?
  - question: >-
      Has the vampire bat CNP ring sequence been under selection relative to
      other bats, in the way vampire bat lysozyme has, which would indicate
      recruitment of an endothelial peptide into a salivary role?
suggested_experiments:
  - hypothesis: >-
      Vampire bat salivary CNP is a functional vasodilator acting on host
      vasculature through NPR2.
    description: >-
      Synthesise the mature 17-residue ring peptide CFGQKLDRIGALSGLGC and assay
      relaxation of pre-constricted arterial rings from a typical host species
      in a wire myograph, with and without the NPR2 antagonist P19; in parallel
      measure cGMP accumulation in cells expressing host NPR2 versus NPR1 to
      confirm receptor selectivity.
    experiment_type: Myograph vasorelaxation with receptor-selective cGMP assay
  - hypothesis: >-
      The peptide is present in expectorated saliva, not merely transcribed in
      the gland.
    description: >-
      Collect saliva from feeding bats and run targeted parallel reaction
      monitoring mass spectrometry for the mature CNP ring peptide and for
      pro-region fragments, quantifying against a synthetic heavy-labelled
      standard.
    experiment_type: Targeted quantitative proteomics
  - hypothesis: >-
      Salivary CNP expression is a derived feature of sanguivorous bats rather
      than the general endothelial expression seen in other mammals.
    description: >-
      Compare NPPC transcript abundance in submaxillary gland versus heart and
      aorta across Desmodus rotundus and non-sanguivorous phyllostomid bats by
      RT-qPCR, and test the coding sequence for lineage-specific selection.
    experiment_type: Comparative expression profiling and selection analysis
