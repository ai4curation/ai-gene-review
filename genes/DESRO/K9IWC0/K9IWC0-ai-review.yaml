        supporting_text: 'RecName: Full=Natriuretic peptides B'
      - statement: >-
          The FUNCTION block describes cardiac hormone biology acting through
          NPR1 to produce cGMP. This text belongs to BNP/ANP; CNP signals
          through NPR2. It should not be used to justify NPR1-specific
          annotations for this protein.
        supporting_text: >-
          Acts by specifically binding and stimulating NPR1 to
      - statement: >-
          The precursor has a signal peptide (1-23) and is annotated as
