          natriuretic peptide.
        supporting_text: >-
          It is 72.3% identical to human NPPC over the full precursor, versus 31.9% to
      - statement: >-
          The K9IWC0 precursor terminates exactly at the second ring cysteine
          with no trailing residues, which matches NPPC and excludes NPPA (5
          trailing residues) and NPPB (6).
        supporting_text: >-
          Its precursor terminates at the ring cysteine (0 trailing residues), matching
      - statement: >-
          The analysis is sequence-based orthology assignment only; no D.
          rotundus natriuretic peptide has been purified or assayed and receptor
          usage is inferred from mammalian CNP biology.
        supporting_text: >-
          This is a sequence-based orthology assignment only.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Reproducible analysis added with this review. All four sequences are
