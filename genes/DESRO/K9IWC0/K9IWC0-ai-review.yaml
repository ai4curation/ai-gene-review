    title: TreeGrafter-generated GO annotations
    findings:
      - statement: >-
          The cGMP biosynthetic process and receptor guanylyl cyclase signaling
          pathway annotations were propagated from the PANTHER natriuretic
          peptide tree. Notably, the PANTHER subfamily assigned is
          PTHR12167:SF2 "C-TYPE NATRIURETIC PEPTIDE", which contradicts the
          ARBA-derived protein name in the same record.
        supporting_text: 'PANTHER; PTHR12167:SF2; C-TYPE NATRIURETIC PEPTIDE; 1.'
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings:
      - statement: >-
          Hormone activity and extracellular region come from combined automated
          methods applied to the Hormone and Secreted keywords.
        supporting_text: 'Hormone {ECO:0000256|ARBA:ARBA00022702};'
  - id: PMID:23411029
    title: 'The "Vampirome": Transcriptome and proteome analysis of the principal
      and accessory submaxillary glands of the vampire bat Desmodus rotundus, a
      vector of human rabies.'
    findings:
      - statement: >-
          The natriuretic peptide abundantly transcribed in the D. rotundus
          principal submaxillary gland is C-type natriuretic peptide, and bat
          and human CNP share a similar primary sequence and domain structure.
          This is the study whose EMBL submission (JAA44981.1, salivary gland)
          underlies the K9IWC0 accession.
        supporting_text: >-
          The bat PS SGs express high transcriptional levels of CNP (Table 4).
        reference_section_type: RESULTS
      - statement: >-
          The authors assign vasodilation as the function of the bat salivary
          CNP, placing it alongside PACAP among the vasodilators that support
          blood flow during feeding.
        supporting_text: 'The function of bat CNP is related to vasodilation.'
        reference_section_type: DISCUSSION
      - statement: >-
          CNP signals through NPR-B (NPR2, guanylate cyclase B) and the
          clearance receptor NPR-C (NPR3), not through NPR1. This is the
          receptor distinction that the misassigned NPPB name obscures.
        supporting_text: >-
          CNP interacts with two subtypes of natriuretic peptide receptor,
          namely NPR-B and NPR-C.
        reference_section_type: DISCUSSION
      - statement: >-
          Unlike ANP and BNP, CNP acts locally as a paracrine or autoregulator
          and is cleared rapidly from the circulation, being present in plasma
          at very low concentrations; it is a potent relaxant of arterial and
          venous smooth muscle.
        supporting_text: >-
          CNP is a potent relaxant of arterial and venous smooth muscle in most
          mammalian species in vitro and is thought to act locally as a
          paracrine/autoregulator
        reference_section_type: DISCUSSION
      - statement: >-
          The natriuretic peptide receptors carry a C-terminal guanylate cyclase
          domain that generates cGMP as the second messenger for vasodilation.
        supporting_text: >-
          These receptors contain at the C-terminus a guanylate cyclase
          functional domain that generates the second messenger cGMP for
          signaling purposes
        reference_section_type: DISCUSSION
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified, full text available via PMC. This is the source
