id: K9IWC0
gene_symbol: K9IWC0
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9430
  label: Desmodus rotundus
description: >-
  K9IWC0 is the C-type natriuretic peptide (CNP/NPPC) precursor of the common
  vampire bat, expressed at high levels in the principal submaxillary salivary
  gland. The 119-residue preprohormone has a signal peptide (residues 1-23), a
  long disordered pro-region, and a C-terminal 17-residue disulfide ring
  (CFGQKLDRIGALSGLGC) that constitutes the mature bioactive peptide. Unlike the
  cardiac hormones ANP and BNP, CNP is not a circulating endocrine hormone: it
  is a locally acting paracrine peptide, produced chiefly by vascular
  endothelium in mammals, that potently relaxes arterial and venous smooth
  muscle. It signals by binding the membrane guanylyl cyclase receptor NPR2
  (GC-B), whose cytoplasmic guanylate cyclase domain generates cGMP, and is
  removed by the clearance receptor NPR3. In the vampire bat the peptide is a
  salivary product rather than a cardiovascular one, and it is understood as one
  of the vasodilators - alongside PACAP - that keep blood flowing at the bite
  site during a blood meal.
existing_annotations:
  - term:
      id: GO:0006182
      label: cGMP biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    review:
      summary: >-
        Natriuretic peptides act by binding a membrane guanylyl cyclase receptor
        whose cytoplasmic catalytic domain converts GTP to cGMP, so the peptide
        drives cGMP production in the responding cell. The term is correct, but
        the receptor is NPR2 (GC-B), not NPR1 as stated in the UniProt FUNCTION
        block: that sentence is BNP/ANP biology carried over with the incorrect
        paralogue name.
      action: ACCEPT
      reason: >-
        Correct for a natriuretic peptide of any subtype. Accepted with the
        receptor identity corrected in the summary rather than modified, since
        the GO term itself does not name a receptor.
      supported_by:
        - &id_gc
          reference_id: PMID:23411029
          supporting_text: >-
            These receptors contain at the C-terminus a guanylate cyclase
            functional domain that generates the second messenger cGMP for
            signaling purposes
          reference_section_type: DISCUSSION
        - &id_nprb
          reference_id: PMID:23411029
          supporting_text: >-
            CNP interacts with two subtypes of natriuretic peptide receptor,
            namely NPR-B and NPR-C.
          reference_section_type: DISCUSSION
        - reference_id: file:DESRO/K9IWC0/K9IWC0-deep-research-falcon.md
          supporting_text: >-
            is the cognate receptor for CNP but can contribute to cGMP signaling
            in some contexts
  - term:
      id: GO:0007168
      label: receptor guanylyl cyclase signaling pathway
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    review:
      summary: >-
        CNP is the ligand of the receptor guanylyl cyclase NPR2 (GC-B). The
        pathway term is exactly right for this peptide and is independent of the
        NPPB/NPPC naming problem, since both subtypes signal through a receptor
        guanylyl cyclase.
      action: ACCEPT
      reason: >-
        Directly supported. This is the signalling pathway the peptide
        initiates.
      supported_by:
        - *id_nprb
        - *id_gc
  - term:
      id: GO:0005179
      label: hormone activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    review:
      summary: >-
        Hormone activity is retained. The human orthologue NPPC carries this
        term from experimental evidence and by phylogenetic inference, so the
        term is appropriate at the family level. The caveat worth recording is
        that CNP behaves as a local paracrine regulator rather than a
        circulating endocrine hormone, and that in this species the peptide is a
        salivary secretion acting on host vasculature rather than a
        cardiovascular hormone acting on the bat's own tissues.
      action: ACCEPT
      reason: >-
        Consistent with the curated annotation of the human NPPC orthologue.
        The paracrine and salivary caveats are recorded here and in the
        knowledge gaps rather than by weakening the term.
      supported_by:
        - &id_paracrine
          reference_id: PMID:23411029
          supporting_text: >-
            CNP is a potent relaxant of arterial and venous smooth muscle in most
            mammalian species in vitro and is thought to act locally as a
            paracrine/autoregulator
          reference_section_type: DISCUSSION
  - term:
      id: GO:0005576
      label: extracellular region
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    review:
      summary: >-
        The precursor carries a signal peptide (1-23) with a cleaved 24-119
        chain and UniProt records the subcellular location as Secreted. For a
        small soluble secreted peptide the specific child term is the better
        fit.
      action: MODIFY
      reason: >-
        Use GO:0005615 extracellular space, which is the appropriate
        granularity for a secreted soluble peptide hormone.
      proposed_replacement_terms:
        - id: GO:0005615
          label: extracellular space
      supported_by:
        - reference_id: file:DESRO/K9IWC0/K9IWC0-uniprot.txt
          supporting_text: 'SUBCELLULAR LOCATION: Secreted'
        - reference_id: file:DESRO/K9IWC0/K9IWC0-uniprot.txt
          supporting_text: 'SIGNAL          1..23'
  - term:
      id: GO:0097746
      label: blood vessel diameter maintenance
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: >-
        This keyword-derived term (from the Vasoactive keyword) is correct but
        directionless: it covers both constriction and dilation. CNP is a potent
        relaxant of arterial and venous smooth muscle, and the Vampirome authors
        state directly that the function of the bat salivary CNP is related to
        vasodilation. An earlier version of this review marked the term as
        over-annotated; the better call is to make it specific. GO:0042311
        vasodilation is a direct child of GO:0097746.
      action: MODIFY
      reason: >-
        Replace the direction-neutral parent with the specific child GO:0042311
        vasodilation, which is what CNP actually does and what the salivary
        peptide is inferred to do at the bite site.
      proposed_replacement_terms:
        - id: GO:0042311
          label: vasodilation
      supported_by:
        - *id_paracrine
        - &id_vasodil
          reference_id: PMID:23411029
          supporting_text: 'The function of bat CNP is related to vasodilation.'
          reference_section_type: DISCUSSION
        - reference_id: file:DESRO/K9IWC0/K9IWC0-uniprot.txt
          supporting_text: >-
            Vasoactive {ECO:0000256|ARBA:ARBA00022858,
            ECO:0000256|RuleBase:RU003686}.
