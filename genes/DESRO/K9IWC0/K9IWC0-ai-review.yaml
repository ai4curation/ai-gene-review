  - id: file:DESRO/K9IWC0/K9IWC0-uniprot.txt
    title: UniProtKB record for K9IWC0 (K9IWC0_DESRO)
    findings:
      - statement: >-
          The ARBA-derived protein name is "Natriuretic peptides B" with BNP
          alternative names, but the PANTHER subfamily in the same record is
          PTHR12167:SF2 "C-TYPE NATRIURETIC PEPTIDE". The record is internally
