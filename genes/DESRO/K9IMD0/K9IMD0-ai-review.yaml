- id: file:DESRO/K9IMD0/K9IMD0-deep-research-falcon.md
  title: Deep research report on K9IMD0/LTF/draculin (Falcon/Edison Scientific Literature)
  findings:
  - statement: UniProt K9IMD0 maps to a Desmodus rotundus lactotransferrin (LTF) scaffold detected 
      in submaxillary salivary gland proteomes; later omics places "draculin" on this LTF scaffold 
      but lacks recombinant confirmation that the canonical LTF protein is itself the salivary 
      anticoagulant, so the relationship between LTF identity and the historical draculin 
      anti-FIXa/anti-FXa activity should be treated as draft-level rather than fully resolved.
  - statement: Conserved mammalian lactoferrin family biology (iron binding via two N/C-lobe Fe3+ 
      sites, antimicrobial activity through iron sequestration and LPS binding, immunomodulation via
      TLR4/LRP1/TRAF6/NF-kB signaling, and proteolytic/antiviral activities) provides 
      high-confidence homology-based inference for K9IMD0, but these functions have not been 
      directly assayed for the vampire-bat protein.
  - statement: Draculin anticoagulant activity is strictly glycosylation-dependent (chemical 
      deglycosylation abolishes anti-FXa activity, Fernandez 1998), so any LTF-based explanation of 
      draculin would require intact N-linked glycans; recombinant unglycosylated LTF would not be 
      expected to reproduce the salivary anticoagulant phenotype.
  - statement: Anticoagulant specialization does not establish loss of conserved iron handling or 
      innate defense; exact mapping of native draculin activity remains a separate caveat.
    supporting_text: These functions are **not directly assayed** for the vampire-bat LTF/draculin 
      sequence in the retrieved bat-specific studies; they are best treated as **high-confidence 
      inference from the conserved lactotransferrin scaffold**.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Full report read. Conserved bilobed iron binding and antimicrobial roles are 
      distinct from the native draculin anticoagulant assay; recombinant sequence-to-anticoagulant 
      confirmation remains a mapping caveat. The report does not establish target-specific loss of 
      protease or receptor-associated trafficking functions.
