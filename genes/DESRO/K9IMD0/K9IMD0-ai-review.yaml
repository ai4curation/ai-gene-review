id: K9IMD0
gene_symbol: K9IMD0
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9430
  label: Desmodus rotundus
description: K9IMD0 is a secreted, bilobed lactotransferrin-family glycoprotein expressed in 
  vampire-bat salivary glands and identified as the scaffold of draculin, the native salivary
  glycoprotein that inhibits prey coagulation factors IXa and Xa in a glycosylation-dependent
  manner. Recombinant confirmation tying that anticoagulant activity to this exact lactotransferrin
  sequence remains lacking. The protein retains a conserved N-lobe ferric iron-binding site and a
  candidate lactoferrin serine-protease nucleophile, whereas the C-lobe iron site and canonical
  lactoferrin protease dyad are partly degraded.
