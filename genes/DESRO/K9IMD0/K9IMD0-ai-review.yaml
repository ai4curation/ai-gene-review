id: K9IMD0
gene_symbol: K9IMD0
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9430
  label: Desmodus rotundus
description: K9IMD0 is a secreted, bilobed lactotransferrin-family glycoprotein expressed in vampire-bat salivary glands. Its conserved transferrin domains and iron-binding sites support iron binding and an innate antimicrobial role. The sequence has been identified as the lactotransferrin scaffold of draculin, the native salivary glycoprotein that inhibits prey coagulation factors IXa and Xa in a glycosylation-dependent manner. Recombinant confirmation tying that anticoagulant activity to this exact lactotransferrin sequence remains lacking. Additional receptor-mediated trafficking, iron-transport and proteolytic functions are plausible from mammalian lactotransferrin but remain unresolved for the bat protein.
aliases:
- draculin
