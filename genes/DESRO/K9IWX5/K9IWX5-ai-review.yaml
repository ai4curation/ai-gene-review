id: K9IWX5
gene_symbol: K9IWX5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9430
  label: Desmodus rotundus
description: >-
  K9IWX5 is a secreted cysteine-rich protein of the CAP/SCP/TAPS superfamily
  (antigen 5 / CRISP subfamily) encoded in the submaxillary salivary gland
  transcriptome of the common vampire bat. The 241-residue precursor carries a
  predicted N-terminal signal peptide (residues 1-22), a CAP/PR-1 domain, and a
  C-terminal cysteine-rich ShKT module (residues 206-239) stabilised by two
  disulfide bonds, giving the canonical two-domain CRISP architecture. Antigen
  5/CRISP proteins were recovered both as transcripts and as peptides in the
  principal submaxillary gland proteome of D. rotundus, so the family is
  translated and not merely transcribed in the gland; delivery of this specific
  protein into expectorated saliva has not been directly demonstrated. Its
  molecular activity is not established: CAP-superfamily members in vertebrate
  reproductive tracts, snake venoms, and the salivary glands of blood-feeding
  arthropods have been variously reported to bind lipids or divalent cations
  through the CAP cavity and to modulate ion channels through the cysteine-rich
  domain, but no activity has been demonstrated for any vampire bat CRISP, and
  the family is explicitly described as functionally uncharacterised in
  hematophagous salivary glands. The ShKT module of this protein is itself
  degenerate at residues that are conserved in canonical ShKT domains.
existing_annotations:
  - term:
      id: GO:0005576
      label: extracellular region
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: >-
        Secretion is well supported for this protein and is independent of the
        UniProt CAUTION. The precursor has a SignalP-predicted signal peptide
        (residues 1-22) with a cleaved 23-241 chain, the CRISP family is a
        family of secreted proteins, and antigen-5/CRISP peptides were recovered
        from the principal submaxillary gland proteome of D. rotundus by
        LC-MS/MS. The CAUTION in the UniProt record refers to PROSITE ProRule
        PRU01005, i.e. the ShKT domain feature annotation, not to subcellular
        localisation.
      action: ACCEPT
      reason: >-
        Signal peptide prediction, CRISP family membership, and direct proteomic
        detection of antigen-5/CRISP family members in vampire bat salivary
        gland secretions all support extracellular localisation. The generic
        parent term GO:0005576 is retained rather than the child GO:0005615
        (extracellular space) because there is no evidence distinguishing the
        soluble salivary pool from matrix-associated forms.
      supported_by:
        - reference_id: file:DESRO/K9IWX5/K9IWX5-uniprot.txt
          supporting_text: 'SIGNAL          1..22'
        - reference_id: file:DESRO/K9IWX5/K9IWX5-uniprot.txt
          supporting_text: 'Belongs to the CRISP family.'
        - reference_id: PMID:23411029
          supporting_text: >-
            secretoglobin (65 ions) and antigen-5/CRISP families (57)
          reference_section_type: RESULTS
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with
      GO terms
    findings:
      - statement: >-
          InterPro signature IPR018244 (Allergen V5/Tpx1 conserved site) was used
          to infer extracellular localisation for K9IWX5. This is a family-level
          inference from the CAP/CRISP domain signature rather than direct
          evidence for this protein. The InterPro cross-reference itself is
          recorded on the UniProt record.
  - id: PMID:23411029
    title: 'The "Vampirome": Transcriptome and proteome analysis of the principal
      and accessory submaxillary glands of the vampire bat Desmodus rotundus, a
      vector of human rabies.'
    findings:
      - statement: >-
          Antigen 5/CRISP family members are among the protein families sequenced
          from the D. rotundus submaxillary salivary glands, and antigen-5/CRISP
          peptides were recovered from the principal gland proteome by LC-MS/MS
          (57 ions), showing that the family is translated in the gland rather
          than only transcribed. The identification is family-level and was made
          on dissected gland homogenate, so it does not by itself assign peptides
          to K9IWX5 or demonstrate delivery into expectorated saliva.
        supporting_text: >-
          secretoglobin (65 ions) and antigen-5/CRISP families (57)
        reference_section_type: RESULTS
      - statement: >-
          The authors state that the function of salivary antigen-5/CAP family
          proteins is unknown apart from a few exceptions, and that function in
          bat saliva can only be assigned after recombinant expression. This is
          the field's own admission of ignorance for this protein family.
        supporting_text: >-
          With few exceptions [59, 116], their function is unknown.
        reference_section_type: DISCUSSION
      - statement: >-
          Antigen-5 proteins belong to the larger CAP superfamily and are among
          the most ubiquitous proteins in the salivary glands of blood-feeding
          arthropods, indicating repeated recruitment of this fold into
          hematophagous salivary secretomes.
        supporting_text: >-
          are among the most ubiquitous proteins in the SG of blood sucking arthropods
        reference_section_type: DISCUSSION
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified. This is the source publication for the EMBL entry
        (JAA45881.1) from which K9IWX5 was derived; the salivary gland tissue
        attribution in the UniProt record traces to this transcriptome/proteome
        study. It supports secretion and salivary-gland origin, and explicitly
        states that the function of the salivary antigen-5/CRISP family is
        unknown.
  - id: file:DESRO/K9IWX5/K9IWX5-uniprot.txt
    title: UniProtKB record for K9IWX5 (K9IWX5_DESRO)
    findings:
      - statement: >-
          The precursor carries a SignalP-predicted signal peptide (1-22) and a
          cleaved mature chain (23-241), and belongs to the CRISP family.
        supporting_text: 'Belongs to the CRISP family.'
      - statement: >-
          The record carries the InterPro signature IPR018244 (Allergen
          V5/Tpx1 conserved site) that GO_REF:0000002 used to infer
          extracellular localisation.
        supporting_text: 'InterPro; IPR018244; Allrgn_V5/Tpx1_CS.'
      - statement: >-
          A C-terminal ShKT domain (206-239) with two predicted disulfide bonds
          (215-233, 224-237) completes the canonical CAP + cysteine-rich CRISP
          architecture.
        supporting_text: '/note="ShKT"'
      - statement: >-
          UniProt cautions that the sequence lacks conserved residues required
          for propagating feature annotation under PROSITE ProRule PRU01005,
          which is the ShKT rule. The caution therefore limits confidence in
          ShKT-derived functional transfer, not in the secretion prediction.
        supporting_text: >-
          CAUTION: Lacks conserved residue(s) required for the propagation of
          feature annotation.
  - id: file:DESRO/K9IWX5/K9IWX5-deep-research-falcon.md
    title: Deep research report on K9IWX5
    findings:
      - statement: >-
          No protein-specific peer-reviewed studies exist for K9IWX5; all
          functional statements beyond domain presence and predicted secretion
          are family-level inferences.
        supporting_text: >-
          No peer-reviewed, protein-specific studies for K9IWX5 were found.
    reference_review:
      relevance: MEDIUM
      correctness: UNVERIFIED
      review_notes: >-
        LLM-generated literature survey. Useful for the CAP/CRISP family
        background and for its explicit statement that no protein-specific
        studies exist, but several of its cited sources are flagged in the
        report itself as low-quality journals, and none concerns Desmodus
        rotundus. Not used here to support any positive functional claim.
core_functions:
  - description: >-
      Secreted CAP/CRISP-superfamily protein of the vampire bat submaxillary
      salivary gland. A cleaved signal peptide and CRISP family membership place
      the mature chain in the extracellular region, but no molecular activity
      has been demonstrated for it or for any vampire bat CRISP, so no molecular
      function term is asserted.
    supported_by:
      - reference_id: file:DESRO/K9IWX5/K9IWX5-uniprot.txt
        supporting_text: 'Belongs to the CRISP family.'
      - reference_id: PMID:23411029
        supporting_text: >-
          secretoglobin (65 ions) and antigen-5/CRISP families (57)
        reference_section_type: RESULTS
    locations:
      - id: GO:0005576
        label: extracellular region
    knowledge_gaps:
      - gap_statement: >-
          The molecular activity of the vampire bat salivary antigen-5/CRISP
          protein is undetermined: neither a ligand for the CAP cavity nor an
          ion-channel or receptor target for the cysteine-rich C-terminal module
          has been identified for K9IWX5 or any Desmodus CRISP.
        boundary: >-
          What is firmly established is the architecture and the secretion: a
          cleaved signal peptide, a CAP/PR-1 domain, a C-terminal ShKT module
          with two disulfide bonds, CRISP family membership, and recovery of
          antigen-5/CRISP peptides from the principal submaxillary gland
          proteome by LC-MS/MS.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
        status: OPEN
        significance: >-
          Vampire bat saliva is a source of characterised anti-hemostatic and
          anti-inflammatory proteins; whether this abundant CRISP contributes to
          host modulation at the bite site, or is a vestigial secretory product,
          determines whether it belongs in the salivary pharmacopoeia at all.
        resolution: >-
          Recombinant expression of the mature 23-241 chain followed by
          ion-channel electrophysiology, lipid/sterol binding assays for the CAP
          cavity, and testing on host hemostatic and inflammatory readouts.
        provenance:
          - reference_id: PMID:23411029
            supporting_text: >-
              With few exceptions [59, 116], their function is unknown.
            reference_section_type: DISCUSSION
          - reference_id: PMID:23411029
            supporting_text: >-
              Evidently, the function of these proteins in bat saliva can only be
              assigned after recombinant expression.
            reference_section_type: DISCUSSION
      - gap_statement: >-
          It is undetermined whether the C-terminal ShKT module of K9IWX5 is
          functional, because the sequence lacks conserved residues required for
          propagating ShKT feature annotation.
        boundary: >-
          The module is detected by PROSITE PS51670 and two disulfides are
          predicted, so the fold is present; what is unknown is whether the
          degenerate residues abolish the potassium-channel-blocking activity
          associated with canonical ShKT domains.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
        status: OPEN
        significance: >-
          ShKT modules are the structural basis for the ion-channel activity
          attributed to venom CRISPs; a degenerate module would argue that this
          salivary protein acts through its CAP domain instead.
        resolution: >-
          Site-resolved comparison against characterised ShKT domains plus
          patch-clamp assays of the recombinant C-terminal module on Kv1.x
          channels.
        provenance:
          - reference_id: file:DESRO/K9IWX5/K9IWX5-uniprot.txt
            supporting_text: >-
              CAUTION: Lacks conserved residue(s) required for the propagation of
              feature annotation.
suggested_questions:
  - question: >-
      Is the abundant salivary antigen-5/CRISP of Desmodus rotundus active on
      host hemostasis, vascular tone, or nociception at the bite site, or is it
      a functionally inert secretory product?
    experts:
      - Ivo M. B. Francischetti
      - José M. C. Ribeiro
  - question: >-
      Do vampire bat salivary CRISPs show the signature of positive selection
      seen in vampire bat lysozyme, which would indicate adaptation to
      sanguivory rather than neutral retention?
  - question: >-
      Does the degenerate ShKT module of K9IWX5 retain any ion-channel activity,
      and if not, has the CAP domain taken over as the functional module?
suggested_experiments:
  - hypothesis: >-
      Recombinant mature K9IWX5 modulates host ion channels or inflammatory
      signalling at the feeding site, analogous to characterised venom CRISPs.
    description: >-
      Express the mature 23-241 chain in a eukaryotic system that supports
      extensive disulfide bonding (UniProt annotates only the two ShKT bonds
      215-233 and 224-237, but the mature chain carries 16 cysteines, so up to
      eight bonds are expected for the CRISP fold; e.g. Drosophila S2 or
      Expi293), confirm fold by
      circular dichroism, then screen against a panel of host K+ (BKCa, Kv1.1,
      Kv1.3) and Ca2+ channels by whole-cell patch clamp, and on cytokine release
      from human monocytes.
    experiment_type: Recombinant expression plus electrophysiology and cytokine assay
  - hypothesis: >-
      The CAP cavity of K9IWX5 binds a small hydrophobic ligand (sterol, fatty
      acid, or eicosanoid) that it scavenges or delivers at the bite site.
    description: >-
      Perform lipidomic pull-down on recombinant K9IWX5 from host plasma and skin
      homogenate, and test binding of candidate prohemostatic prostaglandins
      (PGE2, PGF2-alpha, thromboxane) by isothermal titration calorimetry, using
      a CAP-cavity histidine mutant as the negative control.
    experiment_type: Ligand pull-down and isothermal titration calorimetry
  - hypothesis: >-
      K9IWX5 is secreted into saliva rather than retained in the gland, and is
      transferred to the host during feeding.
    description: >-
      Raise antibodies against recombinant K9IWX5 and assay saliva collected
      directly from feeding vampire bats by Western blot and targeted parallel
      reaction monitoring mass spectrometry, comparing principal and accessory
      gland extracts with expectorated saliva.
    experiment_type: Targeted proteomics of expectorated saliva
