id: K9IZA2
gene_symbol: K9IZA2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9430
  label: Desmodus rotundus
description: 'Kunitz-type serine protease inhibitor expressed in salivary gland; single-pass
  membrane protein with predicted inhibitor function.'
existing_annotations:
  - term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Kunitz-type inhibitor annotation supports serine-type 
        endopeptidase inhibitor activity.
      action: ACCEPT
      reason: >-
        Family membership, not an assay of the bat protein. The entry carries
        two Pfam Kunitz/BPTI domains and falls in the PANTHER Kunitz-type
        protease inhibitor 2 (HAI-2/SPINT2) subfamily, whose members are
        Kunitz-type serine protease inhibitors (Falcon deep-research report).
      supported_by:
        - &id_pfam_kunitz
          reference_id: file:DESRO/K9IZA2/K9IZA2-uniprot.txt
          record_section: ["DR:Pfam"]
          supporting_text: 'Pfam; PF00014; Kunitz_BPTI; 2.'
        - &id_pthr_hai2
          reference_id: file:DESRO/K9IZA2/K9IZA2-uniprot.txt
          record_section: ["DR:PANTHER"]
          supporting_text: 'PANTHER; PTHR47247:SF1; KUNITZ-TYPE PROTEASE INHIBITOR 2; 1.'
        - reference_id: file:DESRO/K9IZA2/K9IZA2-deep-research-falcon.md
          supporting_text: 'Protein class: HAI-2/SPINT2 is a Kunitz-type serine protease inhibitor, typically a membrane-associated glycoprotein with one or more Kunitz domains that can also be shed to yield soluble forms.'
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: Cytoplasm rests only on an ARBA location rule; the sequence
        features place this protein in the secretory pathway as a type I
        membrane protein, so the term is likely an over-annotation.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        Changed from ACCEPT. The only basis for this row is UniProt's
        ARBA-predicted "Cytoplasm" location, which is an unvetted association
        rule and not evidence. No assay of this bat protein or statement in the
        Falcon deep-research report places it in the cytoplasm. The sequence
        features point instead to a type I membrane protein: SignalP predicts an
        N-terminal signal peptide (1-27) and Phobius a single helical
        transmembrane segment (198-221), and the deep-research report expects
        the HAI-2 ortholog to be synthesised as a type I membrane protein that
        can be shed to soluble forms. Intracellular secretory-pathway pools
        reported for mammalian HAI-2 are not documented in the sources cached
        here, so the row is marked as an over-annotation rather than removed.
      supported_by:
        - &id_signal
          reference_id: file:DESRO/K9IZA2/K9IZA2-uniprot.txt
          record_section: ["FT:SIGNAL"]
          supporting_text: 'SIGNAL          1..27'
        - &id_tm
          reference_id: file:DESRO/K9IZA2/K9IZA2-uniprot.txt
          record_section: ["FT:TRANSMEM"]
          supporting_text: 'TRANSMEM        198..221'
        - &id_type1
          reference_id: file:DESRO/K9IZA2/K9IZA2-deep-research-falcon.md
          supporting_text: >-
            K9IZA2 is expected to be synthesized as a type I membrane protein
            that can be proteolytically cleaved to soluble forms
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: Plasma membrane location of this predicted type I membrane
        protein.
      action: ACCEPT
      reason: >-
        The UniProt cell-membrane location line rests only on an ARBA rule and
        is not used here. The plasma-membrane location rests on the predicted
        type I topology instead: an N-terminal signal peptide (SignalP, 1-27)
        and a single helical transmembrane segment (Phobius, 198-221), as for
        the HAI-2/SPINT2 family, which the deep-research report describes as
        membrane-associated.
      supported_by:
        - *id_signal
        - *id_tm
        - *id_type1
        - reference_id: file:DESRO/K9IZA2/K9IZA2-deep-research-falcon.md
          supporting_text: 'Protein class: HAI-2/SPINT2 is a Kunitz-type serine protease inhibitor, typically a membrane-associated glycoprotein with one or more Kunitz domains that can also be shed to yield soluble forms.'
  - term:
      id: GO:0030414
      label: peptidase inhibitor activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    qualifier: enables
    review:
      summary: Peptidase inhibitor activity is true but less specific than the
        family evidence supports; serine-type endopeptidase inhibitor activity is
        the better term.
      action: MODIFY
      reason: >-
        Peptidase inhibitor activity is a respectably specific term, so it is not
        TOO_GENERAL, but the family evidence on this protein supports the
        deeper term: two Pfam Kunitz/BPTI domains and the PANTHER Kunitz-type
        protease inhibitor 2 (HAI-2/SPINT2) subfamily, whose members are
        Kunitz-type serine protease inhibitors (Falcon deep-research report).
        The replacement GO:0004867 is the term the review accepts on the
        combined-IEA row. No assay of the bat protein has been reported.
      proposed_replacement_terms:
        - id: GO:0004867
          label: serine-type endopeptidase inhibitor activity
      supported_by:
        - *id_pfam_kunitz
        - *id_pthr_hai2
        - reference_id: file:DESRO/K9IZA2/K9IZA2-deep-research-falcon.md
          supporting_text: 'Protein class: HAI-2/SPINT2 is a Kunitz-type serine protease inhibitor, typically a membrane-associated glycoprotein with one or more Kunitz domains that can also be shed to yield soluble forms.'
