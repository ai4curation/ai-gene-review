- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: This annotation is based on UniProt subcellular location prediction indicating DpuGr29 
      is a multi-pass membrane protein localized to the cell membrane. This is consistent with the 
      7TM architecture of gustatory receptors.
    action: ACCEPT
    reason: The target is a multipass membrane chemoreceptor with eight Phobius-predicted segments 
      in its current sequence record and a 7TM-chemoreceptor domain assignment. Exact helix counting
      can differ among prediction models; it does not weaken the family-supported cell-surface 
      localization. This is a conserved inference, not direct target imaging.
    additional_reference_ids:
    - file:DAPPU/DpuGr29/DpuGr29-deep-research-falcon.md
    supported_by:
    - reference_id: file:DAPPU/DpuGr29/DpuGr29-deep-research-falcon.md
      supporting_text: Daphnia GRs are members of the arthropod GR/OR chemoreceptor superfamily with
        characteristic 7 transmembrane helices and a conserved motif in TM7 (TYhhhhhQF)
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      This annotation is based on InterPro domain IPR013604 (7TM_chemorcpt)
      indicating membrane localization. This is correct but less specific than
      GO:0005886 (plasma membrane) which is also annotated.
    action: ACCEPT
    reason: >-
      The annotation is accurate - DpuGr29 contains the 7TM chemoreceptor domain
      (IPR013604) which is a multi-pass transmembrane domain. While GO:0016020
      (membrane) is a more general term than GO:0005886 (plasma membrane), both
      annotations are appropriate. The IEA annotation based on InterPro domain
      mapping is well-supported by structural predictions showing 7-8 transmembrane
      helices.
    additional_reference_ids:
    - file:DAPPU/DpuGr29/DpuGr29-deep-research-falcon.md
    supported_by:
    - reference_id: file:DAPPU/DpuGr29/DpuGr29-deep-research-falcon.md
      supporting_text: >-
        D. pulex GR genes typically share a characteristic intron-exon structure
        with phase-0 introns; this 7TM chemoreceptor architecture aligns with the
        InterPro 7TM_chemorcpt and Pfam 7tm_7 domain assignments noted for E9FXF3
        (PF08395; IPR013604)
- term:
    id: GO:0050909
    label: sensory perception of taste
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: Aquatic gustation is possible, but the sensory modality of the DpuGr29 clade is 
      unresolved.
    action: UNDECIDED
    reason: GO:0050909 concerns direct chemical detection, usually by contact with chemoreceptor 
      cells; it does not imply terrestrial life. The primary Daphnia paper explicitly discusses both
      contact taste and detection of dissolved chemicals. DpuGr29 belongs to a lineage-expanded 
      clade without an established ligand or expression site, so the InterPro family mapping cannot 
      presently resolve taste versus another chemical sense. Generalizing solely because Daphnia is 
      aquatic was unjustified. The focused report recommends a generic taste inference but supplies 
      no new evidence resolving contact versus another chemosensory modality, and the inspected 
      PAINT ancestry does not carry a taste assertion. This remains an unresolved family-to-modality
      mapping, not a demonstrated loss.
    additional_reference_ids:
    - file:DAPPU/DpuGr29/DpuGr29-deep-research-falcon.md
    supported_by:
    - reference_id: PMID:19383158
      supporting_text: which they do using both a classic "taste" mode involving physical contact 
        with objects, as well as what might be considered a "smell" mode in which they sense 
        dissolved chemicals in the water.
    - reference_id: file:DAPPU/DpuGr29/DpuGr29-report-assessment.md
      supporting_text: The report CSV recommends retaining taste as generic, but does not resolve 
        the contact-versus-non-contact sensory modality.
    - reference_id: PMID:19765987
      supporting_text: it includes members that function in both contact [1-3, 6-11] and non-contact
        chemosensation
references:
- id: PMID:19383158
  title: The chemoreceptor genes of the waterflea Daphnia pulex - many Grs but no Ors
  findings:
  - statement: D. pulex has 58 gustatory receptors organized into three subfamilies
    supporting_text: These 58 Grs form 3 distinctive subfamilies of 37, 12, and 5 genes, as well as 
      a highly divergent singleton (Gr58)
  - statement: The 2009 phylogenetic/membrane-topology analysis supports a ligand-gated ion-channel 
      hypothesis rather than directly assaying Daphnia GR channel activity.
    supporting_text: They therefore support the hypothesis that these chemoreceptors are not coupled
      to G-proteins and instead function as ligand-gated ion channels
  - statement: DpuGr29 location
    supporting_text: 29scaffold_4:2213168-2214628NCBI_GNO_04003953116213468595th intron is longer
  - statement: Daphnia GRs have conserved 7TM architecture with TYhhhhhQF motif
    supporting_text: These Grs are fairly easily recognized through their somewhat conserved TM7 
      regions near the C-terminus, which includes a TYhhhhhQF motif in TM7
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected, including identity table, phylogeny, expression and 
      discussion. DpuGr29 maps to DAPPUDRAFT_346859 and belongs to the Daphnia-expanded Gr1–29/47–54
      clade. Known insect cuticular-hydrocarbon receptors are dipteran-specific, but the study 
      explicitly discusses chemical mating cues in Daphnia. No insect-only courtship or 
      terrestrial-only taste restriction is justified.
