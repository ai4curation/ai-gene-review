suggested_questions:
- question: What is the ligand specificity of DpuGr29 (sugars, bitter compounds, pheromones)?
- question: In which tissues/cells is DpuGr29 expressed in Daphnia?
- question: Does DpuGr29 function as a homomer or heteromer with other Daphnia GRs?
- question: Which ligand, sensory modality and subunit composition does DpuGr29 use? Actual ancestry
    supports a conserved courtship capacity, but its Daphnia circuit and behavioral direction remain
    unknown. The retained TYLVILYQF motif and BmGr9 structure support a channel hypothesis without 
    establishing target conductance/selectivity; the prior GO:0099094 NEW remains withdrawn.
suggested_experiments:
- description: Heterologous expression of DpuGr29 in Xenopus oocytes or HEK293 cells followed by 
    calcium imaging or electrophysiology to identify ligand specificity
  hypothesis: DpuGr29 responds to specific chemical ligands (sugars, bitter compounds, or 
    environmental cues)
  experiment_type: functional assay
- description: In situ hybridization or single-cell RNA-seq of Daphnia chemosensory organs to 
    determine DpuGr29 expression pattern
  hypothesis: DpuGr29 is expressed in chemosensory neurons of antennules or feeding appendages
  experiment_type: expression analysis
- description: AlphaFold2 structure prediction and molecular docking to identify potential 
    ligand-binding residues
  hypothesis: Structural modeling can identify candidate ligands based on binding pocket 
    architecture
  experiment_type: computational analysis
