id: E9FXF3
gene_symbol: DpuGr29
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6669
  label: Daphnia pulex
description: DpuGr29 is a Daphnia pulex gustatory-receptor-family membrane protein, encoded by 
  DAPPUDRAFT_346859. Its multipass membrane architecture and placement in a Daphnia-expanded 
  chemoreceptor clade support a role in chemical sensing and chemosensory behavior. Its ligand, 
  sensory modality and detailed tissue distribution remain unresolved. Experimentally characterized 
  insect gustatory receptors form ligand-gated cation channels, providing a mechanistic hypothesis 
  for DpuGr29 whose ionic selectivity and subunit requirements have not been established.
