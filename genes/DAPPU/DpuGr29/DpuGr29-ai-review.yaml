  title: DpuGr29 report motif verification
  findings:
  - statement: A reusable scan reproduces TYLVILYQF364-372 in the 379-residue target, with an 
      unrelated-input control. This is not a channel-function experiment.
    supporting_text: 'one match: TYLVILYQF at residues 364-372 inclusive.'
- id: PMID:19765987
  title: A Drosophila gustatory receptor essential for aversive taste and inhibiting male-to-male 
    courtship.
  findings:
  - statement: Direct Gr33a loss/rescue experiments establish a fly chemosensory contribution to 
      male-male courtship; exact Daphnia circuit details are not established.
    supporting_text: This phenotype was rescued by the Gr33a+ transgene
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text inspected for Gr33a chemosensory, courtship-rescue and trafficking 
      scope. Gr32a is discussed as previous work; this is not the sole primary source behind every 
      descendant evidence in the ancestral courtship assertion.
