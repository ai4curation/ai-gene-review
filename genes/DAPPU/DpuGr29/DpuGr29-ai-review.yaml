- id: file:DAPPU/DpuGr29/DpuGr29-deep-research-falcon.md
  title: Deep research review of DpuGr29 gustatory receptor
  findings:
  - statement: Exact target functional data were not located.
    supporting_text: There is no direct gene-level functional characterization (ligand specificity, 
      electrophysiology, or precise cellular expression) published for DpuGr29.
  - statement: The provider uses BmGr9 as a mechanistic comparator, with unresolved oligomerization 
      for DpuGr29.
    supporting_text: whether DpuGr29 functions as a homomer or in heteromeric assemblies remains 
      unknown
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Read fully. Correctly resolves identity, the Daphnia-specific expansion and lack 
      of target electrophysiology/tissue mapping. Its proposed broad ion-channel inference is 
      mechanistically plausible but relies principally on a different GR subfamily (BmGr9/Gr43a). 
      Antennular/feeding-appendage expression is a hypothesis, not a measured target location.
- id: PMID:38573859
  title: Structural basis of ligand specificity and channel activation in an insect gustatory 
    receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected. BmGr9 is a fructose-gated tetrameric channel, and 
      conserved GR pore motifs support a family-level channel model. This is not direct functional 
      evidence for the divergent Daphnia Gr29 clade or its ion selectivity. PMID:38187590 is the 
      preceding version of this study, not independent replication. GRs lack the analogous common 
      ORCO coreceptor; ORCO absence is not a negative for GR channel plausibility.
- id: 
    file:DAPPU/DpuGr29/DpuGr29-hypotheses/daphnia-courtship-and-ligand-gated-channel-function/openscientist.md
  title: OpenScientist focused assessment of DpuGr29 courtship and ligand-gated channel function
  findings:
  - statement: The report recovers the positive courtship provenance node but did not inspect actual
      PANTHER topology; its absence-based rejection is disputed.
    supporting_text: PTN001080220 placement was confirmed via QuickGO annotation provenance rather 
      than a live PANTHER tree query.
  - statement: The report identifies a target family-signature motif, independently reproduced by 
      the local sequence-only check; it does not establish conductance.
    supporting_text: TYLVILYQF
  - statement: The report explicitly limits the channel interpretation to homology and does not 
      identify a target ligand or functional assembly.
    supporting_text: homology-inferred, not demonstrated
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Complete report, both CSVs and HTML/PDF variants read. Retains useful BmGr9 
      mechanism and motif lead but rejects courtship from missing target assays and donor species 
      without inspecting topology. Actual target descent supports retention. Mislabels FBgn0032416, 
      calls the donor support one study, double-counts preprint PMID:38187590 and final PMID:38573859, and
      conflates ORCO absence with GR subunit uncertainty. Corrections and remaining limits are 
      independently documented in DpuGr29-report-assessment.md.
