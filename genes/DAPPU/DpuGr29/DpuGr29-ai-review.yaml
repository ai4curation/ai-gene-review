- term:
    id: GO:0007635
    label: chemosensory behavior
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: This annotation is based on phylogenetic inference from Drosophila GR genes that 
      function in chemosensory behavior. Given that GRs are chemoreceptors that detect chemical 
      stimuli and trigger behavioral responses, this annotation is appropriate for DpuGr29. Daphnia 
      relies heavily on chemosensory detection for predator avoidance, food finding, and 
      environmental sensing.
    action: ACCEPT
    reason: Chemosensory behavior (GO:0007635) is defined as "behavior that is dependent upon the 
      sensation of chemicals." GRs are established chemoreceptors across arthropods. Daphnia pulex 
      has an expanded GR repertoire (58 genes) and relies heavily on chemosensory detection for 
      predator avoidance (kairomone detection), food finding, and environmental sensing. The 
      phylogenetic inference from Drosophila GRs to Daphnia GRs for this general chemosensory 
      function is well-supported, as the fundamental role of GRs as chemoreceptors mediating 
      behavioral responses is conserved across arthropods.
    additional_reference_ids:
    - file:DAPPU/DpuGr29/DpuGr29-deep-research-falcon.md
    supported_by:
    - reference_id: PMID:19383158
      supporting_text: This repertoire of 58 chemoreceptors presumably mediates the many 
        chemoperception abilities of waterfleas.
    - reference_id: file:DAPPU/DpuGr29/DpuGr29-report-assessment.md
      supporting_text: the positive arthropod courtship and chemosensory-behavior IBD node.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001080220
        source_status: SUPPORTS_TRANSFER
        comment: Exact target lineage is below this positive IBD. Retained as a conserved inference;
          direct Daphnia expression or behavioral assays are not claimed.
