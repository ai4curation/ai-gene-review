  title: 'Insights into TIM-barrel prenyl transferase mechanisms: crystal structures of PcrB from Bacillus
    subtilis and Staphylococcus aureus.'
  findings:
  - statement: SaPcrB donor-chain-length mutagenesis supports the C35 ether-forming enzyme and substrate
      discrimination.
    supporting_text: we produced A100W and Y104A mutants of SaPcrB and tested the effects of these mutations
      on the conversion of C20, C25, C30, C35 and C40 prenyl diphosphates to the corresponding glyceryl
      phosphate products.
  - statement: Magnesium dependence and D14A activity loss support the catalytic metal mechanism.
    supporting_text: We tested the activity of wild type protein in the presence of 50 μM EDTA as well
      as in the absence of MgCl2. No product was found, indicating that Mg2+ is likely essential for catalysis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. SaPcrB structures3W01/3W02 map to targetA7X435. Bound Sa ligands are
      PEG/sulfate; glycerol phosphate and FsPP complexes are Bacillus. Native Mu3 downstream pathway is
      not tested here.
