knowledge_gaps:
- gap_statement: The downstream fate and physiological function of the PcrB ether-lipid product in Staphylococcus
    aureus subsp. aureus Mu3 remain unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  boundary: The substrate-resolved ether-forming reaction is established. Native downstream dephosphorylation,
    acetylation and use of the lipid in lipoprotein acetylation remain unresolved in this species.
  resolution: Identify native lipid products and perturb downstream candidate genes, coupling lipidomics
    to rescue and envelope phenotypes.
  status: OPEN
suggested_questions:
