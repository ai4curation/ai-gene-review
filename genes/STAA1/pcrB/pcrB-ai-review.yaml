    summary: Magnesium supports the catalytic prenyl-transfer mechanism.
    reason: The full primary study reports loss of detectable product without MgCl2 or with EDTA, and
      inactive D14A mutants of both SaPcrB and BsPcrB. Together with the curated cofactor assignment this
      supports catalytic magnesium binding; the proposed D14 coordination mechanism is distinguished from
      direct Mg occupancy in the target structure.
