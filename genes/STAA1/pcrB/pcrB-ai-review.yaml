taxon:
  id: NCBITaxon:418127
  label: Staphylococcus aureus subsp. aureus Mu3
description: PcrB of Staphylococcus aureus Mu3 is a homodimeric TIM-barrel prenyltransferase that synthesizes
  heptaprenylglyceryl phosphate by transferring a C35 isoprenoid chain to sn-glycerol-1-phosphate. The
  magnesium-dependent reaction forms the first ether bond of this lipid. Structural and mutational work
  identifies a hydrophobic donor tunnel and residues that influence prenyl-chain-length discrimination.
