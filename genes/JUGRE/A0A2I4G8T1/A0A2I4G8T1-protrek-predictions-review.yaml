predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0050403
      label: trans-zeatin O-beta-D-glucosyltransferase activity
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 17.31). Cytokinin O-glucosylation is a real plant UGT activity
        and UGT73C members do glycosylate hormones, so the call is in the right chemistry;
        but zeatin O-glucosyltransferases are characterised in the UGT85A/ZOG clade, not
        UGT73C, and no acceptor has been determined for this walnut protein. Scored LSP
        rather than PLI because the term is a strict descendant of this review's core
        molecular function (UDP-glucosyltransferase activity) and a curator recovers the
        correct annotation by climbing to the parent - which is what the evidence actually
        supports.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0050502
      label: cis-zeatin O-beta-D-glucosyltransferase activity
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Rank 2 (score 17.29), the cis stereoisomer of rank 1 and 0.02 score units behind it.
        The pair is a compact demonstration of the resolution limit: the model cannot
        distinguish two stereochemically distinct acceptors, and reports both as if each were
        an independent finding. Correct at the parent level, uninformative at the level
        stated.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0047254
      label: 2,4-dihydroxy-7-methoxy-2H-1,4-benzoxazin-3(4H)-one 2-D-glucosyltransferase activity
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Rank 3 (score 16.79). DIMBOA glucosylation is a grass-specific benzoxazinoid defence
        pathway (maize BX8/BX9); walnut is a eudicot and does not make benzoxazinoids, so
        this specific acceptor is not available to the protein. Scored LSP on the same
        reasoning as ranks 1 and 2 - the parent term is right and is what a curator would
        keep - while noting that the acceptor here is not merely undetermined but
        taxonomically absent, which the model gives no sign of.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
