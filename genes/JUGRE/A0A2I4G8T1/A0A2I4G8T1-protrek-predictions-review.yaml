id: A0A2I4G8T1
gene_symbol: A0A2I4G8T1
taxon:
  id: NCBITaxon:51240
  label: Juglans regia
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a walnut UDP-glycosyltransferase of the UGT73C
  subfamily. Every one of the top five calls is a specific acceptor-substrate
  glucosyltransferase activity, and all five are strict descendants of the
  UDP-glycosyltransferase activity already annotated in GOA: trans-zeatin, cis-zeatin, a
  benzoxazinone, abscisic acid, 7-deoxyloganetic acid. The family assignment is right and
  the model is confident (scores 17.3 down to 16.7, all within 0.6 of each other), but
  the acceptor is exactly what cannot be determined from sequence in the GT1 family - and
  it is the only thing the ranked list varies. This is the clearest instance in the
  benchmark of what a GO index forces on a retrieval model: there is no term for "a
  UDP-glucosyltransferase of unknown acceptor specificity" at the useful level, so the
  model must pick acceptors, and five picks at indistinguishable scores convey no
  information about which. ProtNLM2 made no GO prediction for this protein.
  Assessment: 3 less precise (LSP).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/JUGRE/A0A2I4G8T1/A0A2I4G8T1-uniprot.txt
