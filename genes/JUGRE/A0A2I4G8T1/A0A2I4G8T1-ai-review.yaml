suggested_questions:
  - question: >-
      Is the PANTHER placement of the walnut protein in SF229 (with UGT73C3/C4)
      rather than SF153 (UGT73C5/C6) or SF88 (UGT73C1) phylogenetically meaningful,
      given that the Arabidopsis UGT73C cluster appears to have expanded after the
      Brassicales-Fagales split?
    experts: []
  - question: >-
      What are the in vivo acceptor substrates of this UGT73C-group
      glucosyltransferase in walnut, which accumulates naphthoquinones (juglone),
      ellagitannins and flavonoids?
    experts: []
suggested_experiments:
  - description: >-
      Express recombinant A0A2I4G8T1 and screen UDP-glucose, UDP-galactose,
      UDP-xylose and UDP-glucuronic acid as donors against a panel of acceptors
      covering the substrates of Arabidopsis UGT73C relatives (brassinosteroids,
      trans-zeatin, flavonols, deoxynivalenol, triterpenoid aglycones) and
      walnut-specific phenolics such as juglone and its reduced form
      hydrojuglone.
    hypothesis: >-
      The enzyme prefers UDP-glucose as donor (as predicted from its PSPG box) and
      has an acceptor range that cannot be predicted from any single UGT73C
      ortholog.
  - description: >-
      Build a maximum-likelihood tree of UGT73C-group sequences from Brassicales and
      Fagales genomes to test whether the walnut protein is a co-ortholog of the
      whole Arabidopsis UGT73C1-C6 cluster.
    hypothesis: >-
      The Arabidopsis cluster expanded within Brassicales, so no one-to-one
      ortholog of the walnut protein exists in Arabidopsis.
