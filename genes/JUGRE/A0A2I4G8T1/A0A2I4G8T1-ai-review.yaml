core_functions:
  - description: >-
      UDP-glucose-dependent glucosyltransferase that transfers glucose to small
      lipophilic acceptor molecules, inferred from descent from a PANTHER ancestral
      node of characterized UGT73C/UGT89 glucosyltransferases and from the
      conserved PSPG nucleotide-sugar-binding box. The physiological acceptor in
      walnut is unknown and cannot be inferred from the varied acceptors of
      Arabidopsis UGT73C relatives.
    molecular_function:
      id: GO:0035251
      label: UDP-glucosyltransferase activity
    supported_by:
      - reference_id: file:interpro/panther/PTHR48047/PTHR48047-paint.tsv
        supporting_text: >-
          PTHR48047	PTN008730368	GO:0035251	F	IBD	false	AGI_LocusCode:AT1G73880|AGI_LocusCode:AT2G36750|AGI_LocusCode:AT2G36790|AGI_LocusCode:AT2G36800|AGI_LocusCode:AT3G53160|AGI_LocusCode:AT5G03490
