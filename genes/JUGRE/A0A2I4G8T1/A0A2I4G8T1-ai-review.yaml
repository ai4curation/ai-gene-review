          supporting_text: >-
            PSPG box (44 aa, residues 348-391): WAPQLLILSHPSVGGFLTHCGWNSCIEGISAGVPMLTWPLFGDQ; last residue: Q
        - reference_id: file:JUGRE/A0A2I4G8T1/A0A2I4G8T1-uniprot.txt
          supporting_text: DR   PANTHER; PTHR48047:SF229; UDP-GLYCOSYLTRANSFERASE 73C3-RELATED; 1.
