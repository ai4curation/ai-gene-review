id: A0A2I4G8T1
gene_symbol: A0A2I4G8T1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:51240
  label: Juglans regia
description: >-
  A0A2I4G8T1 (gene LOC109005703, chromosome 3) is a full-length, 488-residue
  family-1 UDP-glycosyltransferase (GT1, UGT) from English walnut (Juglans regia).
  It has the two-Rossmann-fold GT-B architecture of plant UGTs: an N-terminal
  acceptor-binding glycosyltransferase domain (Pfam PF26168, residues 10-246) and a
  C-terminal nucleotide-sugar-binding domain (Pfam PF00201) carrying an intact
  44-residue PSPG box (residues 348-391) with the conserved HCGWNS core and a
  terminal glutamine typical of UDP-glucose-using plant UGTs. PANTHER places it in
  subfamily PTHR48047:SF229 (UDP-glycosyltransferase 73C3-related) with Arabidopsis
  UGT73C3 and UGT73C4, and it is roughly equidistant (55-59% identity) from all
  members of the Arabidopsis UGT73C tandem cluster, which suggests it is a
  co-ortholog of that cluster rather than of any single member. Through descent from
  a PANTHER ancestral node whose characterized members transfer glucose from
  UDP-glucose to small lipophilic acceptors, it is inferred to be a
  UDP-glucosyltransferase that glucosylates small molecules. Characterized UGT73C
  relatives differ in acceptor (brassinosteroids, cytokinins, flavonols,
  trichothecene toxins, saponin aglycones), so the acceptor used by the walnut
  enzyme cannot be predicted. Its subcellular location has not been determined.
  No experimental characterization of this protein has been reported.
existing_annotations:
  - term:
      id: GO:0035251
      label: UDP-glucosyltransferase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    review:
      summary: >-
        PAINT IBA from ancestral node PANTHER:PTN008730368, whose IBD for
        UDP-glucosyltransferase activity was seeded by six Arabidopsis enzymes:
        UGT73C1 (AT2G36750), UGT73C6 (AT2G36790), UGT73C5/DOGT1 (AT2G36800),
        UGT73C7 (AT3G53160), UGT89B1 (AT1G73880) and UGT89A2 (AT5G03490). The node
        therefore sits at least as deep as the UGT73C/UGT89 split, and the walnut
        protein (SF229, UGT73C group) descends from it. None of the seeds is in SF229
        itself, but the term asserted is the donor-level activity shared across the
        node, not any seed's acceptor specificity. Target-level evidence agrees: the
        protein is full length, retains both GT-B domains and the PSPG box, and the
        PSPG box ends in the glutamine associated with UDP-glucose use. The earlier
        version of this review listed AT1G73880 as UGT73C3; it is UGT89B1 (UGT73C3 is
        AT2G36780, an uncharacterized SF229 member).
      action: ACCEPT
      reason: >-
        The walnut protein lies inside the clade to which the PAINT curator assigned
        UDP-glucosyltransferase activity, and its sequence shows no loss of the
        nucleotide-sugar-binding signature that would argue for divergence. Donor
        identity is not experimentally tested for this protein, but the phylogenetic
        inference is sound and is the most specific molecular function supportable.
      supported_by:
        - reference_id: file:interpro/panther/PTHR48047/PTHR48047-paint.tsv
          supporting_text: >-
            PTHR48047	PTN008730368	GO:0035251	F	IBD	false	AGI_LocusCode:AT1G73880|AGI_LocusCode:AT2G36750|AGI_LocusCode:AT2G36790|AGI_LocusCode:AT2G36800|AGI_LocusCode:AT3G53160|AGI_LocusCode:AT5G03490
