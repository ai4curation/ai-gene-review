description: >-
  ProtNLM2 made no predictions (GO or subcellular location) for this walnut
  protein and returned only the protein name "UDP-glycosyltransferase 73C1". The
  gene review agrees with the family placement but not with the single-member
  name: it places the protein in PANTHER subfamily PTHR48047:SF229 (UGT73C3-related)
  as a roughly equidistant (55-59% identity) co-ortholog of the whole Arabidopsis
  UGT73C tandem cluster, and supports UDP-glucosyltransferase activity by PAINT
  descent, with the acceptor substrate unknown. With no GO or location output there
  is nothing to score; the absence of predictions is recorded as assessed.
