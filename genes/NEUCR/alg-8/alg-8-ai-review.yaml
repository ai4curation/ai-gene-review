id: Q7RXP5
gene_symbol: alg-8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  alg-8 encodes the Neurospora crassa ortholog of the conserved ALG8
  dolichyl-phosphate-glucose glucosyltransferase. The protein is a multi-pass
  endoplasmic-reticulum membrane enzyme predicted to add the second glucose to
  Glc1Man9GlcNAc2-PP-dolichol during lipid-linked oligosaccharide assembly,
  producing the Glc2Man9GlcNAc2-PP-dolichol precursor used for protein
  N-linked glycosylation.
