taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  Neurospora crassa mcr-1 encodes the MCR1-like member of the fungal
  NADH-cytochrome b5 reductase family. The protein has the conserved
  cytochrome-b5 reductase FAD- and NADH-binding regions, an N-terminal
  transmembrane segment, and is inferred from the characterized Saccharomyces
  cerevisiae ortholog and the PTHR19370 PAINT tree to act at mitochondria,
  likely the mitochondrial outer membrane, as an NADH-dependent cytochrome-b5
  reductase.
core_functions:
- description: >-
    FAD-dependent reduction of ferricytochrome b5 using NADH as electron donor
    in the mitochondrial outer membrane-associated MCR1 clade; this
    cytochrome-b5 electron-transfer activity is PAINT-supported as an input to
    fungal ergosterol biosynthesis.
  molecular_function:
