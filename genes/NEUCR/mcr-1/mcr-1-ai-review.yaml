  review:
    summary: >-
      PTN000452208 propagates a direct ergosterol-biosynthesis role for the
      MCR1-like cytochrome-b5 electron-transfer system.
    action: ACCEPT
    reason: >-
      The PAINT assertion comes from the S. cerevisiae MCR1 seed and passes the
      process-participation test because Mcr1 is an electron-transfer enzyme,
      not a substrate or upstream necessity factor. Lamb et al. reconstituted
      fungal CYP51 sterol 14alpha-demethylation with Candida CYP51 plus a yeast
      cytochrome-b5/NADH-cytochrome-b5-reductase system, showing that this
      reductase system can directly supply electrons to the P450 step of
      ergosterol synthesis.
