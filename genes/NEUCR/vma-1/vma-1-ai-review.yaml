  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00091960
  review:
    summary: The automated vacuolar acidification row matches the conserved
      biological role of the fungal vacuolar V-ATPase.
    action: ACCEPT
    reason: The catalytic subunit A of the fungal vacuolar V-ATPase directly
      contributes ATP hydrolysis to the holoenzyme that pumps protons across
      the vacuolar membrane. Vacuolar acidification is therefore the central
      compartment-level outcome of the V-ATPase activity, and the ARBA row is
      consistent with the PTHR43607 PAINT assertions for proton transport and
      fungal vacuole membrane localization.
