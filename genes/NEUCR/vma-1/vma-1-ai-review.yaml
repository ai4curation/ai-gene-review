id: P11592
gene_symbol: vma-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: vma-1 encodes the conserved catalytic subunit A of the fungal
  vacuolar V-type ATPase. The protein is a peripheral V1-sector ATPase
  alpha/beta-chain family member that acts at the cytosolic face of the fungal
  vacuolar membrane, binding and hydrolyzing ATP as part of the V1 domain to
  drive rotary proton translocation by the V-ATPase holoenzyme and support
  vacuolar acidification.
