- term:
    id: GO:0046034
    label: ATP metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004100
  - InterPro:IPR022878
  - InterPro:IPR036121
  review:
    summary: ATP metabolism overstates the V-ATPase A subunit's biological
      process role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The V-ATPase A subunit consumes ATP to power vacuolar proton pumping, but
      its gene-level biological process is proton transmembrane transport and
      vacuolar acidification rather than ATP metabolism. The InterPro signatures
      behind this row are shared F1/V1/A1 alpha-beta ATPase domains whose ATP
      metabolic process mapping is informative for F-type ATP synthase subunits
      but too broad for a vacuolar proton pump subunit.
    additional_reference_ids:
    - file:genes/NEUCR/vma-1/vma-1-uniprot.txt
    supported_by:
    - reference_id: file:genes/NEUCR/vma-1/vma-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: that hydrolyzes ATP and a membrane integral complex (V0)
        that translocates protons
