- id: PMID:8722770
  title: 'The vacuolar ATPase of Neurospora crassa is indispensable: inactivation of
    the vma-1 gene by repeat-induced point mutation.'
  findings:
  - statement: Ferea and Bowman inactivated the endogenous Neurospora vma-1 gene
      by repeat-induced point mutation and found that progeny carrying the
      inactive endogenous allele were inviable unless they cosegregated a
      functional ectopic copy.
    supporting_text: Progeny from strains with an inactive endogenous vma-1 gene
      were inviable unless a functional copy of the gene cosegregated,
      indicating that the vacuolar ATPase is essential in Neurospora crassa.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed record PMID:8722770 resolves to the cited 1996
      Neurospora vma-1 RIP-and-rescue study; the local cache is abstract-only,
      so the paper was used as genetic context rather than as direct support
      for new GO assertions.
