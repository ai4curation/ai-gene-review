id: Q01386
gene_symbol: mcb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  mcb encodes the Neurospora crassa regulatory subunit of cAMP-dependent
  protein kinase A. MCB is a cyclic-nucleotide-binding subunit of the PKA
  holoenzyme that binds catalytic subunits and restrains PKA activity until
  cAMP binding releases active kinase. This cAMP-gated inhibition couples
  adenylyl cyclase output to downstream PKA-dependent control of hyphal growth
  polarity, septum placement, asexual differentiation, carbohydrate metabolism,
  and circadian transcriptional regulation.
