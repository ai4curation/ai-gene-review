suggested_questions:
- question: >-
    Does Neurospora MCB occupy the nucleus constitutively or conditionally, and
    how does its localization compare with the nuclear shuttling observed for
    fungal PKA regulatory subunits in yeast and Candida?
suggested_experiments:
- description: >-
    Construct an endogenous, functional MCB fluorescent fusion and image it with
    cytosolic, nuclear, and PKA catalytic-subunit markers across cAMP, carbon
    source, heat-shock, and circadian growth conditions.
