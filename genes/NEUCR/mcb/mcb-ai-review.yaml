- term:
    id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:104878
  - PANTHER:PTN000180782
  - PomBase:SPAC8C9.03
  - dictyBase:DDB_G0276027
  review:
    summary: >-
      The PAINT row transfers a GPCR-scoped cAMP signaling pathway term from
      PTN000180782. MCB gates cAMP/PKA output by inhibiting PKA catalytic
      subunits, and the receptor-agnostic GO:0141156 term better captures this
      Neurospora regulatory-subunit role.
    action: MODIFY
    reason: >-
      GO:0007189 spans the GPCR-triggered cascade that activates adenylyl
      cyclase and raises cAMP, so downstream PKA subunits can participate when
      that receptor pathway is the relevant upstream route. The cached
      Neurospora evidence instead places MCB at the cAMP-gated PKA holoenzyme:
      the mcb mutant has elevated PKA activity, and lowering PKAC-1 suppresses
      the mcb growth-polarity defect. The PAINT node captures a real cAMP/PKA
      signaling role, but the receptor-neutral cAMP/PKA signal transduction
      term avoids overcommitting Neurospora MCB to a GPCR-defined relay. The
      merged CANAL/BCY1 review accepts the same PAINT transfer because C.
      albicans has a positively asserted upstream Gpr1/Gpa2-to-Cyr1 branch, and
      Bcy1 is the cAMP-responsive PKA regulatory subunit in that architecture;
      the merged SCHPO/cgs1 review accepts it because Cgs1 has
      organism-specific experimental support for GO:0007189 itself. By
      contrast, the cached Neurospora evidence reaches the cyclase through cr-1
      and the PKA holoenzyme through mcb, but not a receptor-to-cyclase GPCR
      relay, so the same PTN000180782 assertion should be scoped back here. The
      sibling Dictyostelium pkaR review keeps this same PTN000180782
      GO:0007189 row as non-core because PKA is required for the GPCR/cAMP
      relay that drives aggregation; in Neurospora, the reviewed mcb evidence
      points to intracellular PKA output in growth-polarity, carbohydrate, and
      circadian contexts rather than to a cAMP relay.
    proposed_replacement_terms:
    - id: GO:0141156
      label: cAMP/PKA signal transduction
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN000180782
        source_label: PTN000180782
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          PTN000180782 carries a GPCR/adenylate-cyclase term from mixed
          cAMP-signaling descendants; Neurospora MCB is better represented by
          the receptor-agnostic PKA-centered term.
    additional_reference_ids:
    - PMID:15824453
    - PMID:17625933
    supported_by:
    - reference_id: PMID:17625933
      supporting_text: accompanied by an increase in PKA activity levels
    - reference_id: PMID:15824453
      supporting_text: the mcb mutant was suppressed by pkac-1 mutation
