- id: PMID:8918454
  title: >-
    Loss of growth polarity and mislocalization of septa in a Neurospora mutant
    altered in the regulatory subunit of cAMP-dependent protein kinase.
  findings:
  - statement: >-
      Cloning and sequencing showed that Neurospora mcb encodes the regulatory
      subunit of cAMP-dependent protein kinase.
    supporting_text: regulatory subunit of cAMP-dependent protein kinase (PKA)
  - statement: >-
      Conditional loss of mcb function disrupted hyphal growth polarity and
      septum localization, implicating the PKA pathway in polarized growth.
    supporting_text: >-
      Our results suggest that the PKA pathway regulates hyphal growth
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cached paper; this is the original mcb cloning paper and
      directly establishes that MCB is the Neurospora PKA regulatory subunit.
- id: PMID:11356572
  title: >-
    Mobilisation of trehalose in mutants of the cyclic AMP signalling pathway,
    cr-1 (CRISP-1) and mcb (microcycle conidiation), of Neurospora crassa.
  findings:
  - statement: >-
      The mcb mutant accumulated trehalose normally during heat shock,
      indicating that this stress-induced trehalose response was not simply a
      direct MCB-executed stress pathway.
    supporting_text: accumulated trehalose normally during a heat shock
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cached paper; useful for stress and trehalose context, but
      it does not add a direct stress-response GO role for MCB.
- id: PMID:15824453
  title: >-
    A catalytic subunit of cyclic AMP-dependent protein kinase, PKAC-1,
    regulates asexual differentiation in Neurospora crassa.
  findings:
  - statement: >-
      Mutation of pkac-1, the major PKA catalytic-subunit gene, suppressed the
      mcb restrictive-temperature loss-of-growth-polarity phenotype.
    supporting_text: the mcb mutant was suppressed by pkac-1 mutation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cached paper; it connects the MCB regulatory-subunit defect
      to elevated PKAC-1-mediated PKA output in Neurospora.
- id: PMID:17625933
  title: >-
    Carbon source affects PKA-dependent polarity of Neurospora crassa in a
    CRE-1-dependent and independent manner.
  findings:
  - statement: >-
      The mcb polarity defect was accompanied by increased PKA activity and was
      modified by the carbon catabolite regulator CRE-1.
    supporting_text: accompanied by an increase in PKA activity levels
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cached paper; confirms that the mcb phenotype reflects
      increased PKA activity and informs downstream polarity regulation.
- id: PMID:19883780
  title: >-
    cAMP signaling pathway controls glycogen metabolism in Neurospora crassa by
    regulating the glycogen synthase gene expression and phosphorylation.
  findings:
  - statement: >-
      The mcb allele was used as a temperature-sensitive PKA regulatory-subunit
      mutant with constitutively active PKA.
    supporting_text: therefore is a strain with constitutively active PKA
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cached paper; useful for confirming the MCB/elevated-PKA
      model and for keeping glycogen phenotypes as downstream pathway outputs.
- id: PMID:25848091
  title: >-
    Role for Protein Kinase A in the Neurospora Circadian Clock by Regulating
    White Collar-Independent frequency Transcription through Phosphorylation of
    RCM-1.
  findings:
  - statement: >-
      mcb encodes the PKA regulatory subunit that inhibits PKA activity, and the
      mcb mutant has high PKA activity because MCB expression is reduced.
    supporting_text: >-
      mcb encodes the regulatory subunit of PKA that inhibits PKA activity
  - statement: >-
      MCB is required to suppress White Collar-independent frq transcription,
      consistent with its upstream inhibitory control over PKA.
    supporting_text: >-
      MCB is required for the suppression of WC-independent frq transcription
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available; the paper uses mcb as an elevated-PKA-activity
      mutant and defines a downstream RCM-1 phosphorylation mechanism for
      circadian transcription, but MCB's direct role remains PKA regulation.
