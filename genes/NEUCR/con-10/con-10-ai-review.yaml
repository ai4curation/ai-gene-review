id: P10713
gene_symbol: con-10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: con-10 (conidiation-specific protein 10) is a light- and development-regulated gene expressed
  specifically during the late stage of macroconidiation in Neurospora crassa; it defines the con-10 protein
  family. Its biochemical function is uncharacterized.
existing_annotations: []
references:
- id: PMID:2970007
  title: Molecular analysis of a Neurospora crassa gene expressed during conidiation.
  findings:
  - statement: con-10 is induced coordinately with con-13 during the later stages of conidiation and
      is not expressed during mycelial growth.
    supporting_text: This clone contains two genes, con-10 and con-13, which are induced coordinately
      during the later stages of conidiation.
  - statement: The evidence placing con-10 in the program is expression timing in conidiation mutants,
      not loss-of-function - the authors state a role only as an inference from expression.
    supporting_text: Expression of the con-10 gene in various mutants defective at different stages of
      conidiation indicates that it plays a role after aerial hyphal development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Roberts et al., Mol Cell Biol 1988); the primary characterization of
      con-10. Abstract-only in the cache. Evidence is expression-based; no con-10 loss-of-function
      conidiation phenotype is reported.
core_functions:
- description: Conidiation-specific, light/development-regulated protein of the con-10 family expressed
    during late macroconidiation; biochemical function uncharacterized. No process involvement is asserted
    here - con-10 is a temporal marker of the conidiation program rather than a demonstrated participant
    in it.
  supported_by:
  - reference_id: PMID:2970007
    supporting_text: This clone contains two genes, con-10 and con-13, which are induced coordinately
      during the later stages of conidiation.
  - reference_id: file:NEUCR/con-10/con-10-uniprot.txt
    supporting_text: Belongs to the con-10 family
  knowledge_gaps:
  - gap_statement: 'No demonstrated role in conidium formation: the only evidence is conidiation-specific
      expression timing, which GO does not accept as process involvement. No con-10 loss-of-function
      conidiation phenotype has been reported, and PMID:15126394 shows fl-driven conidial morphogenesis
      proceeds without con-10 induction.'
