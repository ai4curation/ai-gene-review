description: >-
  Neurospora crassa gtp-14 encodes the Rab7/Ypt7-family small GTPase RAB-7.
  RAB-7 is a prenylated GTP/GDP molecular switch that localizes to
  late-endosomal prevacuolar compartments and fungal-type vacuolar membranes,
  where the conserved fungal Rab7/Ypt7 switch supports vacuole fusion and
  endovacuolar trafficking.
