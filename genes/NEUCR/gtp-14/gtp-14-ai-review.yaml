      Tagged N. crassa RAB-7 localizes to prevacuolar compartments and overlaps
      strongly with the vacuolar ATPase subunit VMA-1.
    supporting_text: >-
      The fluorescence from RAB-7-dsRED almost completely overlapped the
      fluorescence from VMA-1-GFP
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text PMC cache. This is the direct N. crassa confocal study that
      colocalized RAB-7 with VMA-1 on prevacuolar compartments.
- id: PMID:37093794
  title: The structure of prevacuolar compartments in Neurospora crassa as observed
    with super-resolution microscopy.
  findings:
  - statement: >-
      Super-resolution imaging confirmed that RAB-7 labels the dynamic N. crassa
      PVC, a compartment the paper interprets as the late endosome in hyphal
      tips.
    supporting_text: >-
      Using the rab-7 GTPase as a marker, I observed the distribution of PVCs
      in the hyphal tip in a restricted region of the first hyphal compartment,
      starting ~25 microns from the tip and ending where the tubular vacuolar
      network begins
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text PMC cache. This newer super-resolution study used RAB-7-RFP and
      RAB-7-GFP to image the N. crassa PVC structure and supports treating PVCs
      as unusually large hyphal-tip late endosomes.
- id: PMID:37847028
  title: Morphodynamics of non-canonical autophagic structures in Neurospora crassa.
  findings:
  - statement: >-
      Under carbon starvation, mCherry-RAB7 in N. crassa concentrates on
      tonoplasts/vacuolar membranes rather than in the vacuolar bulk.
    supporting_text: >-
      appears concentrated in tonoplasts/vacuolar membranes (panel g), but
      clearly is not in the vacuolar bulk.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text PMC cache. The paper uses RAB7 as a vacuolar/late-endosomal
      marker during carbon-starvation autophagy and corroborates RAB-7 membrane
      localization, but it does not directly assay gtp-14 function.
