- term:
    id: GO:0003925
    label: G protein activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001939797
  review:
    summary: >-
      PTN001939797 places G protein activity on the eukaryotic Rab7 ancestor,
      matching the conserved switch function of N. crassa RAB-7.
    action: NEW
    reason: >-
      Add GO:0003925 G protein activity. GO:0003924 and GO:0005525 capture the
      catalytic and ligand-binding facets, but Rab7/Ypt7 proteins execute their
      membrane-fusion roles as GTP/GDP molecular switches that bind effectors in
      the active state. N. crassa RAB-7 is retained within the PAINT Rab7 clade
      and has all of the expected Rab GTP-binding features.
    supported_by:
    - reference_id: file:interpro/panther/PTHR47981/PTHR47981-paint.tsv
      supporting_text: "PTHR47981\tPTN001939797\tGO:0003925\tF\tIBD\tfalse\tMGI:MGI:105068|UniProtKB:P51149|UniProtKB:P51151|UniProtKB:Q96AH8|UniProtKB:Q9NP90\ttaxon:2759\t20260724"
      reference_section_type: DATABASE_ENTRY
    - reference_id: file:NEUCR/gtp-14/gtp-14-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: |-
        FUNCTION: Ypt/Rab-type GTPases are key regulators of membrane
        CC       trafficking and intracellular vesicular transport. They act as
        CC       molecular switches that convert between GTP-bound and GDP-bound states,
        CC       and regulate virtually all steps of membrane traffic from the formation
        CC       of the transport vesicle at the donor membrane to its fusion at the
        CC       target membrane. In the GDP-bound state, Ypt proteins are predominantly
        CC       cytosolic, solubilized through the interaction with a GDP dissociation
        CC       inhibitor (GDI). In the GTP-bound state, the proteins are membrane
        CC       bound and interact with specific effector proteins that select cargo,
        CC       promote vesicle movement, or verify the correct site of fusion.
      reference_section_type: DATABASE_ENTRY
    - reference_id: file:NEUCR/gtp-14/gtp-14-uniprot.txt
      record_section: ["CC:ACTIVITY REGULATION"]
      supporting_text: >-
        ACTIVITY REGULATION: Alternates between an inactive form bound to GDP
        CC       and an active form bound to GTP.
      reference_section_type: DATABASE_ENTRY
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001939797
        source_status: SUPPORTS_TRANSFER
        comment: >-
