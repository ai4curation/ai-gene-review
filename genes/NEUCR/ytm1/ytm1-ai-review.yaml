id: Q9C2I5
gene_symbol: ytm1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  ytm1 encodes the Neurospora crassa ortholog of WDR12/Ytm1, a conserved WD40-repeat/UBL pre-60S
  assembly factor. By membership in the fungal WDR12/Ytm1 subfamily, N. crassa Ytm1 is inferred
  to act in the nucleolus as part of the Nop7-Erb1-Ytm1/PeBoW-like subcomplex on large-subunit
  preribosomes, supporting 25S/5.8S rRNA maturation, ribosomal large-subunit biogenesis, and
  the Rea1/Mdn1-dependent release of Ytm1-containing assembly factors during pre-60S remodeling.
