    summary: >-
      Ytm1/WDR12-family proteins support 60S-subunit pre-rRNA maturation.
    action: ACCEPT
    reason: >-
      The UniRule annotation matches the conserved Nop7-Erb1-Ytm1/WDR12 role: the budding-yeast
      protein is required for efficient processing of 27S pre-rRNA intermediates during 25S/5.8S
      rRNA and large-subunit maturation.
    supported_by:
    - reference_id: PMID:16287855
      supporting_text: Mutations in the WD40 motifs of Ytm1 disrupt binding to Erb1, 
        destabilize the heterotrimer, and delay pre-rRNA processing and nuclear export 
        of preribosomes.
    - reference_id: PMID:18448671
