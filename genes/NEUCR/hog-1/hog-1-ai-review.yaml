  review:
    summary: The fungal HOG/Sty1 PAINT node transfers the osmosensory signaling pathway role to
      HOG-1/OS-2.
    action: ACCEPT
    reason: 'The PTN001172058 placement matches direct Neurospora genetics: os-2 null alleles and replacement
      mutants are osmosensitive, and wild-type os-2 rescues growth on 4% NaCl. This is a core inherited
      HOG-family process, and the short PAINT seed list is not a weakness because the assertion is placed
      at the fungal HOG/Sty1 node.'
    supported_by:
    - reference_id: PMID:11823187
      supporting_text: An os-2 gene replacement mutant also was generated and was sensitive to high
        osmolarity and resistant to phenylpyrrole fungicides.
