  review:
    summary: The fungal HOG/Sty1 node transfers cellular response to oxidative stress to HOG-1/OS-2.
    action: ACCEPT
    reason: 'Keep the PAINT transfer: the node is the fungal HOG/Sty1 stress-MAPK clade, not an unrelated
      MAPK branch. Direct Neurospora evidence shows that catalase gene induction after osmotic stress,
      fludioxonil, and heat shock is OS-2-dependent and that ATF-1 acts downstream of OS-2 for
