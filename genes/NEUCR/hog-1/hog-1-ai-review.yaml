id: Q96TL5
gene_symbol: hog-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: 'HOG-1/OS-2 is the Neurospora crassa HOG1-subfamily, p38-type mitogen-activated protein kinase
  at the output of the OS-4/OS-5/OS-2 stress-activated MAPK cascade. It is a proline-directed Ser/Thr
  protein kinase with a TxY activation loop that is phosphorylated after hyperosmotic stress and phenylpyrrole/dicarboximide
  fungicide exposure. Activated OS-2 supports osmoadaptation, fungicide responses, intracellular glycerol
  and ion flux/turgor regulation, circadian output through osmotic-stress genes, and developmental outputs
  including conidial integrity and protoperithecial formation.'
