      reference_section_type: ABSTRACT
    - reference_id: PMID:18948219
      supporting_text: like the os-2 strain, up-regulation of the catalase gene cat-1 and the clock-controlled
        gene ccg-1 by treatment with fludioxonil (1 microg/mL) or 4% NaCl was almost completely
        abolished in the Deltaatf-1 strain.
