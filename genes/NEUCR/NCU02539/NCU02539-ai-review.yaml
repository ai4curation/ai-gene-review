id: Q7SHS5
gene_symbol: NCU02539
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU02539 encodes Mcm4, one of the six subunits of the Mcm2-7 complex, the conserved eukaryotic replicative
  DNA helicase. During late M and G1, Mcm2-7 is loaded onto replication origins by ORC, Cdc6 and Cdt1 as an inactive
  double hexamer around double-stranded DNA (origin licensing). In S phase it is activated with Cdc45 and GINS into
  the CMG helicase, which encircles the leading-strand template and unwinds DNA 3' to 5' at the replication fork,
  using ATP hydrolysed at the subunit interfaces of the AAA+ ring. Mcm4 contributes Walker A, Walker B and arginine-finger
  elements to these ATPase sites and helps the ring bind single-stranded DNA. The 1013-residue N. crassa protein
  has the N-terminal OB-fold region, the AAA+ ATPase domain with its lid, and the C-terminal winged-helix region
  typical of Mcm4, plus a longer disordered N-terminal tail than the yeast orthologs.
