id: Q7SHS5
gene_symbol: NCU02539
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU02539 encodes the Mcm4 subunit of the conserved Mcm2-7 replicative helicase. Mcm4 contributes
  to DNA binding and ATP-dependent DNA unwinding in a multisubunit complex, participating in origin licensing,
  initiation and elongation of nuclear DNA replication. Its domain architecture includes the MCM N-terminal
  and OB-fold regions, an AAA+ ATPase domain and an Mcm4 winged-helix region.
