- term:
    id: GO:0003727
    label: single-stranded RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: contributes_to
  supporting_entities:
  - UniProtKB:P29458
  - PomBase:SPCC16A11.17.1:pep
  review:
    summary: Transfer of an in vitro observation that a fission-yeast Mcm4/6/7 preparation can bind RNA oligonucleotides.
      It cannot translocate on RNA, and no physiological RNA-binding role is known.
    action: MARK_AS_OVER_ANNOTATED
    reason: Shin and Kelman (2006) found that replicative helicases from all three domains bind both DNA and RNA
      in vitro, but translocate only on DNA, and only DNA stimulates their ATPase. RNA binding here is a side property
      of an ssDNA-translocating ring, not a function. No in vivo RNA-binding role of Mcm4 has been reported in any
      organism, and none has been studied in Neurospora.
    supported_by:
    - reference_id: PMID:16829518
      supporting_text: whereas the enzymes can bind both DNA and RNA, they could translocate only along DNA and
        only DNA stimulates the ATPase activity of the enzymes
