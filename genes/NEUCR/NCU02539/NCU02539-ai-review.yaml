  review:
    summary: Break-induced replication uses replication machinery for repair-associated DNA synthesis.
    action: KEEP_AS_NON_CORE
    reason: Break-induced replication uses replication machinery for repair-associated DNA synthesis.
      The curated Mcm4 phylogenetic inference supports this secondary application of the helicase, while
      ordinary nuclear genome replication remains the defining function.
