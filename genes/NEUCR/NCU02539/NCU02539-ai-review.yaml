suggested_questions:
- question: Does Neurospora regulate MCM nuclear export through the cell cycle, as budding yeast does, or are Mcm2-7
    subunits nuclear throughout as in many other eukaryotes?
- question: Does the extended disordered N-terminal tail of Neurospora Mcm4 (residues 1-162) carry DDK/CDK phosphorylation
    sites that regulate CMG activation, as the Mcm4 N-terminal regulatory domain does in budding yeast?
suggested_experiments:
- description: Make a conditional (degron or temperature-sensitive) allele of NCU02539 and measure DNA content and
    origin firing, to confirm Mcm4 is needed for nuclear DNA replication in N. crassa.
  experiment_type: genetic depletion
