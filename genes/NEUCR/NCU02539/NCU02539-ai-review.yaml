  review:
    summary: Mcm2-7 is loaded onto origin DNA during licensing, but origin selection is done by ORC, Cdc6 and Cdt1.
      Loaded MCM double hexamers are not fixed to the origin sequence.
    action: KEEP_AS_NON_CORE
    reason: This term is transferred from S. cerevisiae MCM4 (IDA, including reconstituted pre-RC assembly on ARS1
      DNA). Purified yeast proteins recruit ORC, Cdc6, Cdt1 and then Mcm2-7 in order onto ARS1 DNA, and ARS-derived
      ssDNA stimulates Mcm467 helicase activity. MCM does contact origin DNA. However, ORC defines the origin, and
      once loaded Mcm2-7 can slide passively along dsDNA. The term is kept as non-core and does not imply that Mcm4
      recognises origin sequences.
    supported_by:
    - reference_id: PMID:16824194
      supporting_text: The results reveal sequential recruitment of ORC, Cdc6p, Cdt1p and Mcm2-7p on to ARS1 DNA.
    - reference_id: PMID:19896182
      supporting_text: The loading of Mcm2-7 onto DNA requires the origin recognition complex (ORC), Cdc6, and Cdt1,
        and depends on ATP.
    - reference_id: PMID:19896182
      supporting_text: DNA runs through a central channel in the double hexamer, and, once loaded, Mcm2-7 can slide
        passively along double-stranded DNA.
    - reference_id: PMID:15723534
      supporting_text: The DNA helicase activity of Mcm467 complex is also significantly stimulated by the ARS1-derived
