- term:
    id: GO:0000727
    label: double-strand break repair via break-induced replication
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000179968
  - SGD:S000006223
  review:
    summary: Mcm2-7, including Mcm4, is part of the replicative helicase that budding-yeast genetics shows is needed
      for break-induced replication.
    action: KEEP_AS_NON_CORE
    reason: Lydeard et al. showed that BIR in S. cerevisiae needs the CMG helicase (Cdc45, GINS, Mcm2-7) but not
      ORC or Cdc6. The unwinding that drives BIR DNA synthesis is the work of the same helicase, so the claim is
      helicase participation and not just necessity. PAINT placed this term at the Mcm4 subfamily node PTN000179968,
      with S. cerevisiae MCM4 as the seed. NCU02539 sits in that subfamily (PTHR11630:SF66). BIR is a repair use
      of the replicative helicase, secondary to genome replication, and has not been tested in Neurospora.
    supported_by:
    - reference_id: PMID:20516198
      supporting_text: Here we show that BIR requires the replicative DNA helicase (Cdc45, the GINS, and Mcm2-7
        proteins) as well as Cdt1.
    - reference_id: file:NEUCR/NCU02539/NCU02539-uniprot.txt
      supporting_text: DR   PANTHER; PTHR11630:SF66; DNA REPLICATION LICENSING FACTOR MCM4; 1.
    - reference_id: file:NEUCR/NCU02539/NCU02539-bioinformatics/RESULTS-rereview.md
      supporting_text: Q7SHS5 is a full-length Mcm4.
