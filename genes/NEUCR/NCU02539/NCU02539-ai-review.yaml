  review:
    summary: Mcm4 associates with chromatin once it is loaded as part of the MCM double hexamer. The underlying
      activity is topological encirclement of DNA, not a chromatin-reading binding activity.
    action: KEEP_AS_NON_CORE
    reason: The S. pombe experiments behind this transfer (Kearsey et al. 2000) show that Mcm4 associates with chromatin
      in a way that depends on ORC and Cdc18, which load the MCM ring. Mcm2-7 is loaded around DNA as a double hexamer
      that can slide along dsDNA (Remus et al. 2009). Chromatin binding is true at this level of description, but
      the informative activities are ssDNA binding and helicase activity, so the term is non-core.
    supported_by:
    - reference_id: PMID:10747035
      supporting_text: Binding of mcm4 to chromatin requires orc1 and cdc18
    - reference_id: PMID:19896182
      supporting_text: DNA runs through a central channel in the double hexamer, and, once loaded, Mcm2-7 can slide
        passively along double-stranded DNA.
    - reference_id: file:NEUCR/NCU02539/NCU02539-uniprot.txt
      supporting_text: DR   PANTHER; PTHR11630:SF66; DNA REPLICATION LICENSING FACTOR MCM4; 1.
