  review:
    summary: In budding yeast, CDK activity drives Mcm4 and other MCM subunits out of the nucleus outside G1. This
      is transferred to Neurospora by orthology.
    action: KEEP_AS_NON_CORE
    reason: Labib et al. (1999) and Nguyen et al. (2000) showed that S. cerevisiae Mcm2-7 is exported to the cytoplasm
      during S phase and excluded from the nucleus in G2/M, as a once-per-cycle control. A cytoplasmic pool is therefore
      documented for an ortholog. However, this is a regulatory storage state, not a site of function, and whether
