  review:
    summary: Fission-yeast Mcm4 (cdc21) binds chromatin from anaphase to S phase in an ORC- and Cdc18-dependent
      way. The helicase acts on chromatinized DNA.
    action: ACCEPT
    reason: Kearsey et al. showed that S. pombe Mcm4 associates with chromatin in a licensing-dependent, cell-cycle-regulated
