  review:
    assessment: LSP
    confidence_score: 2
    summary: Purified yeast Mcm2-7 and Mcm4/6/7 complexes bind single-stranded DNA in an ATP-dependent
      way, and mutational analysis implicates Mcm4 in the single-stranded DNA binding of the complex.
      GO:0003697 single-stranded DNA binding, an is_a descendant of GO:0003677, is already annotated to
      this gene by PAINT (MCM2-7 node) and is accepted in the gene review, which refines the generic DNA-binding
      row to it. The generic prediction is correct but loses the substrate specificity, so it is less
      precise. The binding is a property of the assembled ring, not of an independent DNA-binding subunit.
