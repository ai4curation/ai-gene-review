    - &id003
      reference_id: PMID:19896182
      supporting_text: The licensing of eukaryotic DNA replication origins, which ensures once-per-cell-cycle
        replication, involves the loading of six related minichromosome maintenance proteins (Mcm2-7)
        into prereplicative complexes (pre-RCs).
    - reference_id: PMID:10834843
