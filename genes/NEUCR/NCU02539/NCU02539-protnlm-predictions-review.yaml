  review:
    assessment: CNN
    confidence_score: 2
    summary: Mcm4-subfamily membership places NCU02539 in the Mcm2-7 helicase. Mcm2-7 is loaded onto origins
      in the pre-replicative complex and becomes the motor of the CMG helicase that unwinds origin DNA,
      which is the Mcm2-7 contribution to initiation. GO:0006270 is already in GOA for this gene and is
      accepted in the gene review as a core process at the level that spans mitotic and premeiotic S phase,
      alongside the more specific IBA term GO:1902975. The prediction is correct but not novel. It concerns
      the Mcm4 subunit as part of the complex, not autonomous initiation activity.
