    summary: The target has the Mcm4-specific MCM domain architecture, including an OB-fold DNA-associated
      region. Biochemical analysis of Mcm4-containing complexes supports a contribution to single-stranded
      DNA binding, which is already annotated through PAINT. The generic DNA-binding prediction loses
      that substrate specificity. Binding and helicase activity are properties of the assembled MCM machinery,
      not evidence for an independent monomeric DNA-binding regulator.
