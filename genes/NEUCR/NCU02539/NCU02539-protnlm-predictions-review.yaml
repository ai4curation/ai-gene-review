    label: nuclear DNA replication
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: NCU02539 carries the InterPro MCM_4 signature and is classified in the Mcm4 subfamily PTHR11630:SF66,
      the subfamily whose PAINT node gives it mitotic DNA replication initiation and DNA strand elongation.
      Budding-yeast experiments show that Mcm2-7 is loaded at origins during licensing and is needed for
      fork progression after initiation, which together make up nuclear DNA replication. GO:0033260 is
      already in GOA for this gene and the gene review accepts it as the level that covers both mitotic
      and premeiotic replication, so the prediction is correct but not novel.
