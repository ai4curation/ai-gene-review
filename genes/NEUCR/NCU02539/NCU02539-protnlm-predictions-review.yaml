description: NCU02539 is the Neurospora Mcm4 subunit of the Mcm2-7 replicative helicase. The two process
  predictions repeat terms already in GOA and accepted by the gene review, so they are correct but not
  novel. The generic DNA-binding prediction is correct but less precise than the supported single-stranded
  DNA binding annotation.
