    summary: InterPro MCM_4 and the Mcm4-specific PANTHER assignment identify a conserved replicative
      helicase subunit. Reconstitution of Mcm2-7 origin loading and biochemical study of Mcm4-containing
      complexes support participation in nuclear DNA replication. GOA already includes the more specific
      mitotic DNA replication initiation and DNA strand elongation functions. The broad prediction is
      therefore less precise; its hydration from premeiotic replication is provenance rather than independent
