suggested_questions:
- question: Which AL-3 isoform is the main translated product under light-induced carotenoid biosynthesis?
suggested_experiments:
- hypothesis: The short AL-3 isoforms have the same GGPP synthase activity as isoform 1.
  description: >-
    Express the three documented AL-3 isoforms in an al-3 deletion background
    and compare GGPP and carotenoid restoration under blue-light induction.
  experiment_type: isoform complementation / targeted metabolomics
