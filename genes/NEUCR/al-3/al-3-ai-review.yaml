id: P24322
gene_symbol: al-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  Neurospora crassa al-3 encodes the cytosolic geranylgeranyl diphosphate
  synthase required for carotenoid biosynthesis. Its transcript is induced by
  blue light and encodes a PTHR12001 SF44 GGPP synthase that catalyses
  sequential trans-prenyl transfer from DMAPP through GPP and FPP to the final
  C20 product, GGPP.
