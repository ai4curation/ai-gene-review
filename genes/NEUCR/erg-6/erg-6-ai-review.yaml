      supporting_text: >-
        Squalene synthases are ER-membrane enzymes that join two molecules of
        farnesyl diphosphate head to head, via presqualene diphosphate, and
        reduce the product with NAD(P)H to squalene.
- term:
    id: GO:0045338
    label: farnesyl diphosphate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
