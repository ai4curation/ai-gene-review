  - SGD:S000001233
  review:
    summary: IBA ER-membrane placement from the eukaryotic PAINT node is sound for erg-6.
    action: ACCEPT
    reason: >-
      erg-6 is a PTHR11626:SF2 squalene synthase, and the PTHR11626 family review
      assesses the ER-membrane PAINT node PTN000179294 as sound across canonical
      eukaryotic squalene synthases. The UniProt record also predicts two
      transmembrane helices and assigns the protein to the ER membrane, so this is
      the expected site of the sterol-committed squalene synthase reaction.
    additional_reference_ids:
    - file:interpro/panther/PTHR11626/PTHR11626-review.yaml
