  supporting_entities:
  - InterPro:IPR019845
  review:
    summary: The broad transferase term is correct but less informative than squalene synthase activity.
    action: TOO_GENERAL
    reason: >-
      The InterPro signature captures the prenyltransferase chemistry of this
      enzyme class, but the accepted GO:0051996 annotations specify the actual
      alkyl-transfer and reductive conversion performed by squalene synthase.
      The broad transferase parent adds no useful functional information here.
    additional_reference_ids:
    - file:interpro/panther/PTHR11626/PTHR11626-review.yaml
    - file:genes/NEUCR/erg-6/erg-6-uniprot.txt
    supported_by:
