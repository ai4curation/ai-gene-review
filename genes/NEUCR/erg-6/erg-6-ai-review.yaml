id: Q7S4Z6
gene_symbol: erg-6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  erg-6/erg9 encodes the Neurospora crassa member of the canonical fungal
  squalene synthase family. It is predicted to be an endoplasmic-reticulum
  membrane enzyme that condenses two farnesyl diphosphate molecules with
  NAD(P)H-dependent reduction to form squalene, the first committed sterol
  intermediate that feeds ergosterol biosynthesis.
