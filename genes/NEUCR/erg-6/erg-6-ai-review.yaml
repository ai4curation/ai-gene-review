  - PANTHER:PTN001700951
  - RGD:61834
  review:
    summary: Squalene synthase consumes FPP, making this true but secondary to sterol synthesis.
    action: KEEP_AS_NON_CORE
    reason: >-
      PAINT node PTN001700951 correctly covers active fungal SF2 squalene
      synthases: erg-6 consumes farnesyl diphosphate as substrate for squalene
      formation. The term is therefore true, but for this enzyme it describes
      substrate metabolism rather than the core ergosterol-biosynthesis role.
    additional_reference_ids:
    - file:interpro/panther/PTHR11626/PTHR11626-review.yaml
    - file:genes/NEUCR/erg-6/erg-6-uniprot.txt
    supported_by:
    - reference_id: file:interpro/panther/PTHR11626/PTHR11626-review.yaml
      supporting_text: >-
        Squalene synthase consumes FPP, so the term is true for the active SF2
        enzymes
    - reference_id: file:genes/NEUCR/erg-6/erg-6-uniprot.txt
      supporting_text: >-
        Reaction=2 (2E,6E)-farnesyl diphosphate + NADPH + H(+) = squalene + 2
        diphosphate + NADP(+)
