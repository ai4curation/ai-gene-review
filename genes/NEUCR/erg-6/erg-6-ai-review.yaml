  title: The genetic basis of cellular morphogenesis in the filamentous fungus Neurospora
    crassa.
  findings:
  - statement: >-
      This Neurospora morphology screen recovered more than 100 complementation
      groups with conditional defects in polarized growth and identified the
      defective genes in 45 mutants.
    supporting_text: >-
      To begin converting this mutant collection into meaningful biological
      information, we identified the defective genes in 45 mutants covering all
      phenotypic classes.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified morphology paper; the cached abstract establishes the
      screen scope, and the PMC full text was checked manually to confirm that
      the mutant table maps one recovered complementation group to erg-9
      (NCU06054.1), ERG9/squalene synthase. The exact full-text table is not in
      the local cache, so the core activity is supported from PTHR11626 and
      UniProt instead.
