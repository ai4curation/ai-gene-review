  review:
    summary: Fungal PAINT node PTN000907895 correctly places erg-6 in ergosterol biosynthesis.
    action: ACCEPT
    reason: >-
      Squalene synthase provides squalene for fungal sterol synthesis, and the
      PTHR11626 review notes that PAINT confines GO:0006696 to the fungal
      squalene synthase node PTN000907895. erg-6 is the N. crassa SF2 squalene
      synthase, so the inferred fungal process is appropriate and core.
    additional_reference_ids:
    - file:interpro/panther/PTHR11626/PTHR11626-review.yaml
    - file:genes/NEUCR/erg-6/erg-6-uniprot.txt
    supported_by:
    - reference_id: file:interpro/panther/PTHR11626/PTHR11626-review.yaml
      supporting_text: >-
        Only the fungal squalene synthases in SF2. PAINT confines the term to a
        fungal node (PTN000907895, taxon Fungi), whose recipients include S.
        cerevisiae ERG9 and S. pombe erg9.
    - reference_id: file:genes/NEUCR/erg-6/erg-6-uniprot.txt
      supporting_text: >-
        PATHWAY: Terpene metabolism; lanosterol biosynthesis; lanosterol from
        farnesyl diphosphate: step 1/3.
