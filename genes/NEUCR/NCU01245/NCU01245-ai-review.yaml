  review:
    summary: RPC4/C53 is a noncatalytic RNA polymerase III subunit that supports transcription of tRNA
      genes.
    action: ACCEPT
    reason: RPC4/C53 is a noncatalytic RNA polymerase III subunit that supports transcription of tRNA
      genes. Reconstituted yeast C37-C53 restores proper termination and, with C11, facilitates polymerase
      recycling; this justifies conserved process participation without assigning autonomous RNA polymerase
      activity.
