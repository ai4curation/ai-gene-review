  label: Neurospora crassa OR74A
description: NCU01245 encodes the Neurospora crassa ortholog of RPC4 (C53 in budding yeast, POLR3D in human), a
  noncatalytic subunit specific to nuclear RNA polymerase III. The 516-residue protein has a long, compositionally
  biased and largely disordered N-terminal region and a conserved C-terminal RPC4 domain (Pfam PF05132, residues
  345-494). By orthology with yeast C53, it forms a peripheral TFIIF-like heterodimer with the C37/RPC5 subunit;
  this module helps open promoter DNA for initiation, slows elongation so that the enzyme recognises oligo(dT) terminators,
  and, together with C11, supports facilitated recycling of the polymerase onto the same gene. It thereby contributes
  to synthesis of tRNAs and other short polymerase III transcripts in the nucleus. It is not itself a catalytic
  polymerase subunit.
