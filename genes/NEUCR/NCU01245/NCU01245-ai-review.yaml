  review:
    summary: NCU01245 contains the RPC4-specific domain and corresponds to the C53 subunit of RNA polymerase
      III.
    action: ACCEPT
    reason: NCU01245 contains the RPC4-specific domain and corresponds to the C53 subunit of RNA polymerase
      III. Photochemical cross-linking places characterized yeast C53 adjacent to the transcribed DNA
      strand; DNA contact occurs within the polymerase complex.
    supported_by:
    - reference_id: PMID:19940126
      supporting_text: 'Protein-RNA and protein-DNA photochemical cross-linking analysis places

