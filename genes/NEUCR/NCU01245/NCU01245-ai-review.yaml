taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU01245 is the conserved RPC4/C53 subunit of nuclear RNA polymerase III. It associates with
  the C37 subunit and supports promoter opening, transcription termination and polymerase recycling during
  synthesis of tRNAs and other polymerase III RNAs. Its role is structural and regulatory within the enzyme
  complex.
