core_functions:
- description: Noncatalytic RPC4/C53 subunit of nuclear RNA polymerase III. With its partner C37/RPC5 it forms a
    TFIIF-like peripheral module that supports promoter opening, terminator recognition and facilitated reinitiation
    during transcription of tRNA and other pol III genes.
  supported_by:
  - reference_id: PMID:16362040
    supporting_text: 'The specific requirement for

      the C37-C53 complex in terminator recognition was determined.'
  - reference_id: PMID:16362040
    supporting_text: The interaction between HsRPC5 and HsRPC53, the human orthologue of C53, is also conserved,
      paralleling the association of yeast C37 and C53 subunits, and is mediated by the domains conserved within
      their yeast counterparts
  - reference_id: PMID:19940126
    supporting_text: 'We show that the C53/C37

      subcomplex additionally plays a role in formation of the initiation-ready open

      promoter complex'
