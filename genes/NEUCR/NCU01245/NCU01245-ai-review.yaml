  review:
    summary: InterPro2GO mapping from the RPC4 domain. Yeast C53 photo-cross-links to the template DNA strand near
      the active centre, but only inside the assembled elongation complex; no autonomous DNA-binding activity is
      shown.
    action: KEEP_AS_NON_CORE
    reason: Retained as non-core rather than accepted. The only experimental basis for DNA contact by an RPC4 family
      member is photochemical cross-linking of a C53 segment to the transcribed strand in the yeast pol III elongation
      complex (PMID:19940126, abstract only), which shows proximity within the 17-subunit enzyme, not a DNA-binding
      activity of the subunit. Yeast RPC53 itself carries DNA binding only by the same InterPro2GO IEA, and the
      PAINT node PTN000334172 propagates complex membership and tRNA transcription but no DNA-binding term. No more
      specific DNA-binding term is supported, so the term is kept at this level but not treated as core; the subunit's
      role is structural/regulatory within pol III.
    supported_by:
    - reference_id: PMID:19940126
      supporting_text: 'Protein-RNA and protein-DNA photochemical cross-linking analysis places

        a segment of C53 close to the RNA 3'' end and transcribed DNA strand at the

        catalytic center of the pol III elongation complex.'
