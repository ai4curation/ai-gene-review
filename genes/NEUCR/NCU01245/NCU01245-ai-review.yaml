  review:
    summary: Pol III subunits participate in all pol III transcription (tRNA, 5S rRNA, U6 snRNA and others); InterPro2GO
      mapping from IPR007811.
    action: ACCEPT
    reason: 'Accepted. As a subunit of the enzyme, RPC4 does part of the work of every pol III transcription cycle:
      the yeast C37-C53 module is needed for terminator recognition and, with C11, for reinitiation. The general
      term is appropriate here because pol III transcribes 5S rRNA, U6 snRNA and other RNAs besides tRNAs; the more
      specific GO:0042797 tRNA transcription is also carried (IBA). Initiation- and termination-specific child terms
      carried by yeast RPC53 (IDA) were not propagated by PAINT, and are not added here.'
    supported_by:
    - reference_id: PMID:16362040
      supporting_text: 'The specific requirement for

        the C37-C53 complex in terminator recognition was determined.'
    - reference_id: PMID:16362040
      supporting_text: 'the presence of the C37-C53 complex required the

        simultaneous addition of C11 to Pol IIIdelta for the enzyme to reinitiate after

