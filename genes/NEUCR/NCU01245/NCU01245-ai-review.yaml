suggested_questions:
- question: Should the initiation (GO:0006384) and termination (GO:0006386) terms that yeast RPC53 carries by IDA
    be propagated across the RPC4 subfamily, or does the PAINT curator's restriction to complex membership and tRNA
    transcription reflect uncertainty about how widely the C53-C37 termination mechanism is conserved?
suggested_experiments:
- description: Conditional depletion of NCU01245 in N. crassa combined with nascent-RNA or 3'-end mapping of tRNA
    genes to test whether loss of RPC4 causes terminator readthrough, as reported for C53-C37-deficient yeast pol
    III; and tagged-protein affinity purification to confirm association with the Neurospora C37 ortholog and pol
    III core.
