- id: PMID:27694803
  title: Cbr1 is a Dph3 reductase required for the tRNA wobble uridine modification.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; directly characterizes S. cerevisiae Cbr1 as the major
      NADH-dependent Dph3 reductase supporting mcm5s2U wobble uridine
      modification and, when electron demand is raised, diphthamide formation.
  findings:
  - statement: >-
      S. cerevisiae Cbr1 was identified as an NADH-dependent Dph3 reductase,
      rapidly reduced Dph3 in vitro when NADH was supplied, and provided the
      Dph3-dependent reducing system for the Dph1-Dph2 radical-SAM enzyme.
    supporting_text: >-
      Upon addition of NADH to initiate the reaction, Dph3 was rapidly reduced
      by Cbr1
  - statement: >-
      Loss of CBR1 alone partially impaired mcm5s2U tRNA wobble uridine
      modification, and combined loss of CBR1 and MCR1 further reduced this
      Dph3-dependent modification.
    supporting_text: >-
      CBR1 deletion alone conferred some resistance to
      γ-toxin, suggesting that formation of tRNA modifications was
      partially impaired
