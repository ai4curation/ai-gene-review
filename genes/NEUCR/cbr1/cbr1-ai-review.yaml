id: Q7RXL1
gene_symbol: cbr1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  Neurospora crassa cbr1 encodes a CBR1-like NADH-cytochrome b5
  reductase of the flavoprotein pyridine nucleotide cytochrome reductase
  family. The protein has an N-terminal transmembrane helix followed by
  conserved FAD- and NADH-binding domains, belongs to the CBR1-like branch of
  PANTHER NADH-cytochrome b5 reductases, and is inferred from the characterized
  Saccharomyces cerevisiae ortholog to reduce cytochrome b5 and the iron protein
  Dph3 from NADH.
core_functions:
- description: >-
    FAD-dependent reduction of ferricytochrome b5 and, by orthology to S.
    cerevisiae Cbr1, Dph3 using NADH as electron donor; the Dph3-reducing branch
    supplies the radical-SAM systems for tRNA wobble uridine modification and the
    first step of diphthamide biosynthesis.
  molecular_function:
    id: GO:0090524
    label: cytochrome-b5 reductase activity, acting on NADH
  directly_involved_in:
  - id: GO:0002926
    label: tRNA wobble base 5-methoxycarbonylmethyl-2-thiouridinylation
  - id: GO:0017183
    label: protein histidyl modification to diphthamide
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: file:genes/NEUCR/cbr1/cbr1-uniprot.txt
    supporting_text: "PANTHER; PTHR19370:SF184; NADH-CYTOCHROME B5 REDUCTASE-LIKE"
  - reference_id: PMID:27694803
    supporting_text: >-
      Here, using a proteomic approach, we identified Saccharomyces cerevisiae
      cytochrome b5 reductase (Cbr1) as a NADH-dependent reductase for Dph3.
    reference_section_type: ABSTRACT
