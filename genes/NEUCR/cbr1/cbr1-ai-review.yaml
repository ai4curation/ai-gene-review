      The N. crassa cbr1 Swiss-Prot record classifies Q7RXL1 as EC 1.6.2.2 and
      as PANTHER subfamily PTHR19370:SF184, the CBR1-like branch.
    supporting_text: "PANTHER; PTHR19370:SF184; NADH-CYTOCHROME B5 REDUCTASE-LIKE"
- id: file:interpro/panther/PTHR19370/PTHR19370-paint.tsv
  title: PTHR19370-paint.tsv
  findings:
  - statement: >-
      PAINT node PTN001833551 is the family-wide ancestral node used to
      propagate broad oxidoreductase activity to cbr1 and other PTHR19370
      reductases.
    supporting_text: "PTHR19370\tPTN001833551\tGO:0016491\tF\tIBD\tfalse"
proposed_new_terms:
- proposed_name: NADH-dependent Dph3 reductase activity
  proposed_definition: >-
    Catalysis of the reaction: 2 Fe(3+)-[Dph3] + NADH = 2 Fe(2+)-[Dph3] +
    NAD(+) + H(+).
  justification: >-
    RHEA:71231 captures the NADH-dependent reduction of Dph3, and
    PMID:27694803 shows that S. cerevisiae Cbr1 performs this reaction in the
    physiological reduction system for the Dph1-Dph2 and Elp3 radical-SAM
    enzymes. GO:0090560 describes the downstream 2-(3-amino-3-carboxypropyl)
    histidine synthase reaction catalyzed by Dph1-Dph2 rather than the cbr1
    reductase step.
  proposed_parent:
    id: GO:0016491
    label: oxidoreductase activity
  supported_by:
  - reference_id: PMID:27694803
    supporting_text: >-
      Upon addition of NADH to initiate the reaction, Dph3 was rapidly reduced
      by Cbr1
suggested_questions:
- question: >-
    Should GO add an NADH-dependent Dph3 reductase molecular-function term for
    RHEA:71231 so CBR1-like reductases can be distinguished from the Dph1-Dph2
    2-(3-amino-3-carboxypropyl)histidine synthase itself?
suggested_experiments: []
