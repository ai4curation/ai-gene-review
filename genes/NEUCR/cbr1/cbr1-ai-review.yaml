  review:
    summary: >-
      The S. cerevisiae CBR1 donor supports the more specific mcm5s2U
      wobble-base modification term already present on this Neurospora protein.
    action: MODIFY
    reason: >-
      Cbr1 is the major physiological NADH-dependent reductase of Dph3 in S.
      cerevisiae, and cbr1 deletion partially impairs the mcm5s2U wobble
      uridine modification. GO:0002098 is true but redundant with the descendant
      GO:0002926 term that captures the specific Elp3/Dph3-dependent
      wobble-base chemistry.
    proposed_replacement_terms:
