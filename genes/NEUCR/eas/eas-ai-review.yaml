id: Q04571
gene_symbol: eas
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: eas (also ccg-2, clock-controlled gene 2) encodes a class I hydrophobin that forms the rodlet
  layer on the surface of Neurospora crassa macroconidia and aerial hyphae. This small, amphipathic, self-assembling
  protein confers spore-surface hydrophobicity required for aerial growth and conidial dispersal; its
  expression is light-induced and clock-controlled.
existing_annotations:
- term:
    id: GO:0042243
    label: asexual spore wall assembly
  evidence_type: IMP
  original_reference_id: PMID:1459460
  qualifier: acts_upstream_of_or_within
  review:
    summary: Proposed new annotation. EAS builds the rodlet monolayer that forms the outer layer of the
      macroconidial (asexual spore) wall; GOA carries only the structural and localization terms, leaving
      the assembly process itself unannotated.
    action: NEW
    reason: Grounded in loss-of-function genetics rather than in vitro self-assembly. RIP inactivation
      of ccg-2/eas produces the eas phenotype with loss of rodlet fascicles, and transformation of an
      eas mutant with ccg-2 DNA restores surface rodlets - reciprocal mutant and complementation evidence
      that the gene product is required to assemble the outer layer of the asexual spore wall. The homologous
      A. nidulans hydrophobins rodA and dewA both carry GO:0042243 on comparable mutant evidence; grounding
      it here also supplies the evidence for the neu_eas annoton's process assertion in the conidiation
      module.
    supported_by:
    - reference_id: PMID:1459460
      supporting_text: inactivation of the ccg-2 gene, by RIP, results in an eas phenotype including loss
        of rodlet fascicles
    - reference_id: PMID:1459460
      supporting_text: transformation of an eas mutant strain with ccg-2 DNA results in phenotypic complementation,
        including restoration of surface rodlets
- term:
    id: GO:0005199
    label: structural constituent of cell wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'Accept: structural constituent of cell wall.'
    action: ACCEPT
    reason: The InterPro hydrophobin signature that drives this IEA is corroborated by genetics for this
      specific protein - eas mutants lack rodlet fascicles and complementation restores them, so EAS is
      a structural component of the outer conidial wall layer rather than an enzyme or regulator acting
      on it. This is the term the core function rests on.
    supported_by:
    - reference_id: PMID:1459460
      supporting_text: inactivation of the ccg-2 gene, by RIP, results in an eas phenotype including loss
        of rodlet fascicles
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: 'Accept: extracellular region.'
    action: ACCEPT
    reason: EAS has a predicted cleaved signal peptide (residues 1-26) and UniProt records it as Secreted
      on the strength of three experimental papers; it does its work outside the plasma membrane, assembling
      at the hydrophobic:hydrophilic interface. The location is broad but not wrong - the spore wall and
      fungal-type cell wall terms below refine it.
- term:
    id: GO:0009277
    label: fungal-type cell wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: 'Accept: fungal-type cell wall.'
    action: ACCEPT
    reason: The rodlet layer is the outermost layer of the fungal-type wall of aerial cells, and EAS coats
      aerial hyphae as well as macroconidia - so this term, unlike spore wall, also covers the non-spore
      aerial surface where EAS is deposited.
- term:
    id: GO:0031160
    label: spore wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'Accept: spore wall.'
    action: ACCEPT
    reason: The most specific and most useful of the four location terms - the rodlet fascicles EAS builds
      sit on the macroconidial surface, and their absence is exactly what the eas mutant phenotype scores.
      Independently supported by the three EXP rows below.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:16537446
  qualifier: located_in
  review:
    summary: 'Accept: extracellular region.'
    action: ACCEPT
    reason: This paper solved the monomeric EAS structure and showed complete segregation of charged and
      hydrophobic residues on its surface - the architecture of a protein that functions at an air/water
      interface outside the cell, and the basis for the UniProt Secreted assignment citing it.
    supported_by:
    - reference_id: PMID:16537446
      supporting_text: EAS forms a beta-barrel structure punctuated by several disordered regions and displays
        a complete segregation of charged and hydrophobic residues on its surface
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:18674544
  qualifier: located_in
  review:
    summary: 'Accept: extracellular region.'
    action: ACCEPT
    reason: This study measured the surface activity of EAS directly, showing that loop deletions leave
      both rodlet formation and surface activity intact - an assay that only makes sense for a protein
      acting at an extracellular interface.
    supported_by:
    - reference_id: PMID:18674544
      supporting_text: deletion of up to 15 residues from this 25-residue loop does not impair rodlet formation
        or reduce the surface activity of the protein
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:22308366
  qualifier: located_in
  review:
    summary: 'Accept: extracellular region.'
    action: ACCEPT
    reason: The self-assembly this paper characterises is explicitly interfacial - EAS polymerises at
      hydrophobic:hydrophilic interfaces into amphipathic monolayers, which places the assembled form
      outside the cell.
    supported_by:
    - reference_id: PMID:22308366
      supporting_text: Self-assembly of EAS into fibrillar rodlets occurs spontaneously at hydrophobic:hydrophilic
        interfaces and the rodlets further associate laterally to form amphipathic monolayers
- term:
    id: GO:0031160
    label: spore wall
  evidence_type: EXP
  original_reference_id: PMID:16537446
  qualifier: located_in
  review:
    summary: 'Accept: spore wall.'
    action: ACCEPT
    reason: The paper's X-ray fibre diffraction on EAS rodlets ties the structural model to the actual
      rodlet polymer, and it frames class I hydrophobins as forming the monolayer on spore surfaces. Note
      the spore-wall placement itself rests on the older mutant genetics (PMID:1459460) rather than on
      in situ imaging here.
    supported_by:
    - reference_id: PMID:16537446
      supporting_text: X-ray fiber diffraction data from EAS rodlets are consistent with our model
- term:
    id: GO:0031160
    label: spore wall
  evidence_type: EXP
  original_reference_id: PMID:18674544
  qualifier: located_in
  review:
    summary: 'Accept: spore wall.'
    action: ACCEPT
    reason: Works on EAS specifically as the N. crassa class I hydrophobin and characterises the rodlet
      monolayers that coat spore surfaces; the mutant series shows the rodlet-forming capability is robust
      to loop truncation, reinforcing that rodlet assembly is EAS's constitutive surface role.
    supported_by:
    - reference_id: PMID:18674544
      supporting_text: we investigated the role of the Cys3-Cys4 loop in EAS, a class I hydrophobin from
        Neurospora crassa
- term:
    id: GO:0031160
    label: spore wall
  evidence_type: EXP
  original_reference_id: PMID:22308366
  qualifier: located_in
  review:
    summary: 'Accept: spore wall.'
    action: ACCEPT
    reason: Identifies the region of EAS that drives rodlet assembly and shows the rodlets are the functional
      amyloid form deployed on the spore surface. The spore-wall localisation is inherited framing from
      the mutant genetics rather than newly demonstrated in this in vitro study, but it is not in doubt.
    supported_by:
    - reference_id: PMID:22308366
      supporting_text: We have used site-directed mutagenesis and peptide experiments to identify the region
        of EAS that drives intermolecular association and formation of the cross-β rodlet structure
