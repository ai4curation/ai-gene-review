- term:
    id: GO:0016120
    label: carotene biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:11017770
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. al-1 catalyses the desaturations that form the
      hydrocarbon carotenes phytofluene, zeta-carotene, neurosporene, lycopene and
      3,4-didehydrolycopene, so it participates directly in the carotene
      biosynthetic process, the hydrocarbon-carotene product class of the pathway.
    action: NEW
    reason: >-
      Participation test: al-1 does the work of this process — it is the enzyme
      whose successive dehydrogenations convert phytoene into the carotenes
      lycopene and 3,4-didehydrolycopene, demonstrated by direct assay of the
      purified enzyme (PMID:11017770). It is not merely required for or acted on by
