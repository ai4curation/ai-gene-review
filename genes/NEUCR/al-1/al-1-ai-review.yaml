    supporting_text: catalyzed the stepwise introduction
  - reference_id: PMID:11017770
    supporting_text: products were 3, 4-didehydrolycopene and lycopene.
  - reference_id: PMID:11017770
    supporting_text: the cofactor involved in the dehydrogenation reaction was NAD
      for Al-1.
  - reference_id: file:NEUCR/al-1/al-1-uniprot.txt
    supporting_text: phytoene into 3,4-didehydrolycopene via the intermediates phytofluene,
proposed_new_terms:
- proposed_name: 3,4-didehydrolycopene-forming phytoene desaturase activity
  proposed_definition: >-
    Catalysis of the five-step desaturation of 15-cis-phytoene to
    all-trans-3,4-didehydrolycopene, in which a single flavoprotein introduces
    five double bonds into phytoene via the intermediates phytofluene,
    zeta-carotene, neurosporene and lycopene (RHEA:30603, RHEA:30607, RHEA:30611,
    RHEA:30623 and RHEA:30979). This is the fungal CrtI-type route, which adds one
    desaturation beyond the four-step, lycopene-forming bacterial CrtI activity.
  justification: >-
    GO:0016166 phytoene dehydrogenase activity has no children and is used for the
    bacterial four-step lycopene-forming reaction, the plant/cyanobacterial
    plastoquinone-dependent PDS reaction, and the fungal five-step
    3,4-didehydrolycopene-forming reaction of al-1 alike, distinguishing them only
    by Rhea and taxon. A dedicated child term for the fungal five-desaturation
    activity would let GO discriminate al-1's activity, which uniquely produces
    3,4-didehydrolycopene and uses NAD, from the bacterial CrtI activity. The
    carotene backbone biosynthesis module records the same absence of a
    CrtI-specific child of GO:0016166.
  proposed_parent:
    id: GO:0016166
    label: phytoene dehydrogenase activity
  supported_by:
  - reference_id: PMID:11017770
    supporting_text: catalyzed the stepwise introduction
  - reference_id: file:NEUCR/al-1/al-1-uniprot.txt
    supporting_text: phytoene into 3,4-didehydrolycopene via the intermediates phytofluene,
suggested_questions:
- question: >-
    al-1 uses NAD in the dehydrogenation reaction, unlike the structurally related
    bacterial CrtI enzymes that pass electrons via FAD to oxygen or quinones. What
    is the full electron-transfer chain of al-1 in vivo, and does the NAD
    dependence reflect a mechanistically distinct redox route or a difference in
    the terminal acceptor?
  experts:
  - Sandmann G
  - Hausmann A
- question: >-
    Hausmann and Sandmann proposed that al-1 assembles as identical protein units
    loosely enough to exchange desaturation intermediates in and out of the
    complex. What is the oligomeric state and membrane topology of al-1, and does
    it physically or kinetically couple to the al-2 synthase and cyclase to channel
    the insoluble carotene intermediates?
  experts:
  - Sandmann G
suggested_experiments:
- experiment_type: substrate and product profiling of the individual desaturation steps
  hypothesis: >-
    al-1 catalyses five sequential desaturations with a defined preference order,
    and the enzyme, not a separate isomerase, sets the geometry of the products.
  description: >-
    Assay purified recombinant al-1 with each pathway intermediate (phytoene,
    phytofluene, zeta-carotene, neurosporene, lycopene) supplied singly in
    phytoene-loaded liposomes, and quantify products and reaction rates by HPLC and
    mass spectrometry under controlled NAD levels, mapping the step-by-step
    kinetics and confirming which double bonds and cis/trans geometries al-1
    installs versus which are set downstream.
- experiment_type: cofactor and electron-acceptor reconstitution
  hypothesis: >-
    The reported NAD dependence of al-1 reflects a specific terminal or shuttle
    acceptor requirement distinct from the FAD/oxygen route of bacterial CrtI.
  description: >-
    Reconstitute purified al-1 with defined redox partners, systematically
    substituting NAD, NADP, FAD, oxygen and membrane quinones as electron
    acceptors, and measure desaturation turnover for each, to define the enzyme's
    obligatory cofactor and the terminal acceptor of the abstracted hydrogens.
