id: P21334
gene_symbol: al-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  al-1 (albino-1, NCU00552) is the phytoene desaturase of the filamentous fungus
  Neurospora crassa, a 595-residue oxidoreductase of the CrtI-type
  carotenoid/retinoid oxidoreductase family (amine-oxidase / FAD-binding fold). As a
  single enzyme it carries out five successive desaturations of the colourless C40
  hydrocarbon 15-cis-phytoene, introducing double bonds through the intermediates
  phytofluene, zeta-carotene, neurosporene and lycopene to yield
  3,4-didehydrolycopene; lycopene is the other major product. This distinguishes
  al-1 from bacterial CrtI enzymes, which stop after four desaturations at
  lycopene. Each dehydrogenation abstracts a pair of hydrogens; unlike the
  structurally related bacterial desaturases, al-1 uses NAD in the reaction. The
  desaturation intermediates zeta-carotene, neurosporene and lycopene are
  themselves accepted as substrates, and al-1 also desaturates
  1-hydroxyneurosporene and 1-hydroxylycopene, whereas gamma-carotene is not a
  substrate. al-1 acts downstream of the bifunctional phytoene synthase/lycopene
  cyclase al-2, which supplies 15-cis-phytoene, and delivers 3,4-didehydrolycopene
  to al-2's cyclase activity, which forms torulene en route to the pathway
  end-product neurosporaxanthin. Because gamma-carotene is not desaturated by
  al-1, torulene arises by cyclization of 3,4-didehydrolycopene rather than by
  desaturation of gamma-carotene. The enzyme is predicted to be membrane
  associated via a C-terminal transmembrane helix, consistent with acting on
  lipophilic polyene substrates, and its expression is strongly induced by blue
  light.
