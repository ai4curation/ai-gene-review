      already-annotated GO:0016117 carotenoid biosynthetic process, so this adds
      genuine, non-redundant coverage rather than duplicating an existing term; the
      ontology relationship itself is left untouched. The QuickGO definition of
      GO:0016120 is the formation of carotenes, hydrocarbon carotenoids, which is
      precisely what al-1's products are.
