core_functions:
- description: >-
    Five-step desaturation of phytoene to 3,4-didehydrolycopene. As a single
    oxidoreductase of the amine-oxidase / FAD-binding fold family, al-1 binds
    15-cis-phytoene at the membrane and introduces up to five double bonds in
    succession, through the intermediates phytofluene, zeta-carotene, neurosporene
    and lycopene, to yield 3,4-didehydrolycopene, with lycopene as the other major
    product. NAD serves as the cofactor in the dehydrogenation. This converts the colourless committed C40 precursor made
    by the phytoene synthase al-2 into coloured, conjugated acyclic carotenes,
    which al-2's cyclase activity then converts to torulene (and beta-carotene)
    downstream. The five-desaturation activity, producing 3,4-didehydrolycopene,
    is a fungal elaboration of the bacterial CrtI four-desaturation route that
    stops at lycopene.
  molecular_function:
    id: GO:0016166
    label: phytoene dehydrogenase activity
  directly_involved_in:
  - id: GO:0016117
    label: carotenoid biosynthetic process
  - id: GO:0016120
    label: carotene biosynthetic process
  locations:
