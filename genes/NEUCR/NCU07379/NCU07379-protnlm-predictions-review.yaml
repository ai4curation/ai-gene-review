  source_version: UniProt API snapshot 2026-09-09
  source_reference_id: file:NEUCR/NCU07379/NCU07379-protnlm-source.json
  predicted_term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: NCU07379 has a bZIP superfamily domain and is placed in the FlbB clade of the fungal AP-1-like
      subfamily PTHR40621:SF6. Aspergillus nidulans FlbB, the characterised member of that clade, is
      a bZIP factor that activates transcription of flbD and, with FlbD, of brlA. The prediction is therefore
      correct. The gene already carries GO:0003700 by InterPro mapping and the more specific descendant
      GO:0001228 (RNA polymerase II-specific activator activity) by PAINT, and the gene review accepts
      GO:0001228 as the core function, so the generic transcription-factor term is less precise than
      an existing supported annotation and is not novel. The N. crassa target genes are unknown.
    supported_by:
    - reference_id: file:NEUCR/NCU07379/NCU07379-uniprot.txt
      supporting_text: DR   InterPro; IPR046347; bZIP_sf.
    - reference_id: file:NEUCR/NCU07379/NCU07379-bioinformatics/RESULTS-rereview.md
      supporting_text: The tree supports NCU07379 as the N. crassa ortholog of FlbB, not of Yap1.
    - reference_id: PMID:17993569
      supporting_text: flbB displays unique characteristics as a transcription factor, i.e., a highly
        conserved N-terminal bZIP domain
    - reference_id: PMID:20132447
      supporting_text: bZip transcription factor FlbB, which has been attributed to participate in
        transducing the aerial stimulus signal, activates the expression of c-Myb transcription factor
        FlbD
