  label: Neurospora crassa OR74A
status: COMPLETE
description: NCU07379 is a bZIP transcription factor of the fungal AP-1-like family (PANTHER PTHR40621:SF6)
  that groups with the FlbB clade, not the Yap1/NapA clade. The single ProtNLM2 GO prediction, generic
  DNA-binding transcription factor activity, is correct but less precise than the RNA polymerase II-specific
  activator activity the gene already carries by PAINT, which the FlbB-clade evidence supports.
