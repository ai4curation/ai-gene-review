taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU07379 encodes a 395-residue basic-leucine-zipper (bZIP) transcription factor of the
  fungal AP-1-like family (PANTHER PTHR40621:SF6). It has an N-terminal bZIP DNA-binding and dimerisation
  region and a less conserved C-terminal region. Within this subfamily it is the Neurospora crassa ortholog
  of the Aspergillus nidulans developmental regulator FlbB, not of the oxidative-stress regulator Yap1/NapA,
  whose N. crassa ortholog is NCU03905. As a bZIP factor it is expected to bind cis-regulatory DNA in the
  nucleus and activate RNA polymerase II transcription. A. nidulans FlbB activates flbD and brlA and is
  required for conidiation. The N. crassa deletion mutant, however, conidiates normally, and the genes
  that NCU07379 regulates in Neurospora are not known.
