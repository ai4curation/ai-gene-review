suggested_questions:
- question: Does NCU07379 share the hyphal-tip-to-nucleus relocalisation of A. nidulans FlbB, given that
    the N. crassa deletion has no reported conidiation defect?
- question: Which genes does NCU07379 regulate in N. crassa, given that the FlbB-FlbD-brlA conidiation
    branch of A. nidulans is not conserved there?
suggested_experiments:
- description: Tag NCU07379 with a fluorescent protein at its endogenous locus and image vegetative hyphae
    and conidiophores, to test whether it localises to the hyphal tip and to nuclei as A. nidulans FlbB
    does.
- description: Run ChIP-seq of tagged NCU07379 together with RNA-seq of the deletion strain under stress
    and developmental conditions, to identify direct targets and binding motifs.
