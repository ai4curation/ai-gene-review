  review:
    summary: The target is placed in the fungal AP-1/Yap1-related bZIP subfamily.
    action: ACCEPT
    reason: The target is placed in the fungal AP-1/Yap1-related bZIP subfamily. Characterized yeast Yap1
      binds a cis-regulatory sequence and is required for element-dependent transcriptional activation;
      the curated PAINT inference supports conservation of this regulatory activity without specifying
      the Neurospora target genes.
