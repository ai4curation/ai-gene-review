  qualifier: part_of
  supporting_entities:
  - CGD:CAL0000188360
  - PANTHER:PTN008082960
  - PomBase:SPAC1783.07c
  review:
    summary: The term is plausible for a dimerising bZIP activator propagated from PTN008082960, but it
      is peripheral to the core activity and no partner has been identified.
    action: KEEP_AS_NON_CORE
    reason: bZIP factors bind DNA as homo- or heterodimers, and the PAINT node supports membership in a
      transcription regulator complex. For the FlbB clade, a heteromeric complex has only been proposed;
      no partner has been demonstrated, and no NCU07379 partner is known. The term is kept as non-core.
      It does not imply membership in core RNA polymerase II.
    supported_by:
    - reference_id: PMID:17993569
      supporting_text: Like many bZIP proteins ( 45 ), FlbB may form a heteromeric complex.
