id: V5IQW8
gene_symbol: NCU07379
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU07379 encodes an AP-1-like bZIP transcription factor related to fungal Yap1 proteins.
  Conserved family placement supports binding to transcriptional regulatory DNA and activation of RNA
  polymerase II transcription in the nucleus. Its physiological target genes and regulatory inputs in
  Neurospora crassa remain incompletely characterized.
