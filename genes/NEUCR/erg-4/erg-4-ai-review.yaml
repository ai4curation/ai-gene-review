    Catalysis of the reaction: lanosterol + S-adenosyl-L-methionine = eburicol +
    S-adenosyl-L-homocysteine + H(+).
  justification: >-
    Neurospora Erg-4 is curated with the RHEA:52652 lanosterol-to-eburicol reaction,
    whereas the existing GO:0003838 sterol 24-C-methyltransferase activity term is
    defined as the budding-yeast zymosterol-to-fecosterol reaction RHEA:21128.
  proposed_parent:
    id: GO:0008757
    label: S-adenosylmethionine-dependent methyltransferase activity
  proposed_mappings:
