id: Q9P3R1
gene_symbol: erg-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  erg-4 (NCU03006) encodes the Neurospora crassa sterol C-24 methyltransferase of the
  Erg6/SMT family. It is a class I-like S-adenosyl-L-methionine-dependent methyltransferase
  required for ergosterol biosynthesis; Neurospora erg-4 mutants are blocked at the C-24
  methylation step and fail to make ergosterol. The curated Neurospora reaction is methyl
  transfer from S-adenosyl-L-methionine to lanosterol to form eburicol, placing the enzyme
  early in the filamentous-fungal route from lanosterol to ergosterol and distinguishing
  it from budding-yeast Erg6, whose curated substrate is zymosterol.
existing_annotations:
- term:
    id: GO:0003838
    label: sterol 24-C-methyltransferase activity
  evidence_type: IBA
