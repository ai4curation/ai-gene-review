  - PANTHER:PTN002226525
  - SGD:S000004467
  review:
    summary: >-
      PTN002226525 is the eukaryotic sterol C-24 methyltransferase node containing
      fungal ERG6/erg-4 and plant SMT enzymes, and Q9P3R1 is a PTHR44068:SF1 member.
      The inherited activity is correct at the family level, but the current GO term
      is formally the zymosterol-to-fecosterol reaction rather than the
      lanosterol-to-eburicol reaction curated for Neurospora Erg-4.
    action: MODIFY
    reason: >-
      PAINT places the activity at the correct ancestral node: Q9P3R1 is in the same
      PTHR44068:SF1 sterol C-24 methyltransferase subfamily as S. cerevisiae Erg6,
      S. pombe erg6, C. albicans Erg6, and Aspergillus fumigatus erg6. However,
      Neurospora and filamentous Aspergillus methylate lanosterol before CYP51, while
      GO:0003838 is bound to RHEA:21128, zymosterol + S-adenosyl-L-methionine =
      fecosterol. A lanosterol 24-C-methyltransferase activity term equivalent to
      RHEA:52652 would be the exact Neurospora molecular-function term.
    proposed_replacement_terms:
    - id: NTR
      label: lanosterol 24-C-methyltransferase activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
