suggested_questions:
- question: >-
    Does Neurospora Erg-4 methylate only lanosterol in vivo, or can it also use
    zymosterol or other C-24-unmethylated sterols under perturbed pathway conditions?
- question: >-
    Is Neurospora Erg-4 restricted to the ER, or does it also partition to lipid
    droplets as budding-yeast Erg6 does?
suggested_experiments:
- hypothesis: Neurospora Erg-4 directly catalyzes RHEA:52652, the methylation of lanosterol to eburicol.
  description: >-
    Express Q9P3R1 and measure SAM-dependent methyl transfer to lanosterol,
    zymosterol, and related sterol acceptors, identifying products by GC-MS or
    LC-MS/MS.
  experiment_type: enzyme kinetics
- hypothesis: The ER is the principal site of Neurospora Erg-4 activity.
  description: >-
    Tag erg-4 at the native locus and compare Erg-4 localization with ER and
    lipid-droplet markers under vegetative growth and azole-induced sterol
    stress.
  experiment_type: fluorescence microscopy
