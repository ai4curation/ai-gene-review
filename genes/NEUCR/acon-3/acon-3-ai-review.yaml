taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: 'acon-3 (aconidiate-3; ''Acr1'', NCU07617) encodes a protein of the MEDUSA/MedA family of
  fungal conidiation regulators (PANTHER PTHR39463; DUF7082 domain), inferred by phylogenetic descent
  to act in the nucleus. It acts downstream of the fluffy (FL) master regulator and is required for later
  stages of macroconidiation: elevated FL expression does not bypass the acon-3 conidiation defect. Its
  precise molecular function is uncharacterized, and its position relative to the conidiation-specific
  con genes has not been established experimentally.'
existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: 'Accept: nuclear localization, consistent with a nuclear conidiation-stage regulator.'
    action: ACCEPT
    reason: Phylogenetic inference (IBA) from the MEDUSA/MedA family (PANTHER PTHR39463), whose characterized
      members are nuclear conidiation regulators. No direct localization evidence for ACON-3 itself is
      available, so the IBA stands on its own rather than on any primary citation.
- term:
    id: GO:0048315
    label: conidium formation
  evidence_type: IMP
  original_reference_id: PMID:15126394
  qualifier: acts_upstream_of_or_within
  review:
    summary: Proposed new annotation. The acon-3 mutant is conidiation-defective, but GOA holds only the
      phylogenetically inferred nucleus term and no process term for the stage the gene is named for.
    action: NEW
    reason: The one experimentally established fact about acon-3 is a loss-of-function conidiation defect that
      elevated fl expression does not bypass, placing acon-3 downstream of the fl master regulator and making
      it required for later conidiation stages. acts_upstream_of_or_within is the correct qualifier - ACON-3's
      molecular activity is uncharacterized, so no more specific involvement can be asserted, and no claim is
      made here about its position relative to the con genes.
    supported_by:
    - reference_id: PMID:15126394
      supporting_text: Two other genes, acon-2 and acon-3, play major roles in controlling development.
    - reference_id: PMID:15126394
      supporting_text: Elevated expression of fl leads to induction of development of the acon-2 mutant in
        nitrogen-starved cultures, but does not bypass the conidiation defect of the acon-3 mutant.
