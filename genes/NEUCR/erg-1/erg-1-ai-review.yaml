id: Q92254
gene_symbol: erg-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  Neurospora crassa erg-1 encodes a late ergosterol-biosynthetic sterol C-8
  isomerase that acts at the endoplasmic-reticulum membrane. The protein is the
  filamentous-fungal ERG2 ortholog and contributes to fungal membrane sterol
  composition by promoting formation of the sterol B-ring C-7 double bond needed
  for progression from zymosterol toward ergosterol; loss of erg-1 blocks
  ergosterol biosynthesis and causes accumulation of C-8/C-9-unsaturated sterol
  intermediates that perturb vegetative germling fusion and development.
