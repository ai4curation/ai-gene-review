suggested_questions:
- question: >-
    Which membrane-associated step between cell-to-cell contact recognition and
    fusion-machinery engagement is sensitive to the C-8/C-9-unsaturated sterol
    intermediates that accumulate in N. crassa erg-1 mutants?
suggested_experiments:
- hypothesis: ERG-1 localizes to the endoplasmic reticulum membrane in N. crassa.
