  review:
    summary: >-
      Broad eukaryotic ERG2/SIGMAR1-family PAINT transfer to the endoplasmic
      reticulum is valid for the Neurospora C-8 sterol isomerase.
    action: ACCEPT
    reason: >-
      PTN001328958 is broader than the fungal ERG2 node and is seeded by animal
      SIGMAR1 as well as fungal ERG2 entries, but the propagated assertion is
      only the shared endoplasmic-reticulum compartment. The animal-specific
      Sigma-receptor signaling and postsynaptic-density rows in PTHR10868 are
      confined to different PTN descendants and did not propagate to erg-1, and
      UniProt's by-similarity ER-membrane placement is consistent with this
      homology transfer but is not target-local experimental localization for N.
      crassa ERG-1.
