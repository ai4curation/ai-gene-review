        binding activates Pho91 to export Pi from vacuoles to the cytosol, enhancing repression of
        the PHO pathway.
    - reference_id: file:NEUCR/NCU01540/NCU01540-uniprot.txt
      supporting_text: DR   PANTHER; PTHR10283:SF92; LOW-AFFINITY PHOSPHATE TRANSPORTER PHO91; 1.
