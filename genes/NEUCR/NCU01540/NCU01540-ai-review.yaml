gene_symbol: NCU01540
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU01540 encodes an 844-residue integral membrane protein with an N-terminal SPX
  domain (residues 1-260) followed by a CitMHS/SLC13-type permease region carrying twelve
  predicted transmembrane helices. PANTHER places it in subfamily PTHR10283:SF92 together with
  budding-yeast Pho91 and fission-yeast Plt1, and it is the only member of the PTHR10283 family
  in the N. crassa reference proteome. By descent from these fungal phosphate transporters it is
  inferred to be a phosphate transmembrane transporter whose activity is controlled through the
  SPX domain; the inositol-pyrophosphate-binding lysine of Pho91 (K237) is conserved as K241.
  In budding yeast the SF92 member Pho91 sits in the vacuolar membrane and releases phosphate
  from the vacuole to the cytosol when inositol pyrophosphate levels fall, which buffers
  cytosolic phosphate and limits vacuolar polyphosphate accumulation. The protein has not been
  studied experimentally in Neurospora, so its resident membrane (vacuolar versus plasma
  membrane), transport direction and coupling ion remain unknown.
