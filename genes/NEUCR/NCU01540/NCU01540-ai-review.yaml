taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU01540 is a predicted SPX-regulated phosphate transporter of the fungal Pho87/Pho90/Pho91
  group. Its SPX regulatory domain and multi-pass permease region support phosphate transport and phosphate/polyphosphate
  homeostasis. The Pho91 subfamily assignment favors a role in intracellular phosphate handling, but its
  resident membrane, transport direction, and coupling ion in Neurospora crassa remain unresolved.
