  review:
    summary: This IBA comes from the family-root node PTN000031793, seeded by plasma-membrane
      SLC13 carriers of animals and by yeast Pho87 (S000000633) and Pho90 (S000003734), which are
      in subfamily SF110. The SF92 seed Pho91 (S000005296) is not among the seeds for this
      location, and its characterized location is the vacuolar membrane. NCU01540 is in SF92 with
      Pho91. Neurospora has no SF110 paralog, so NCU01540 could be the cell's only member of this
      family and might be located at the plasma membrane. Equally, it could resemble Pho91 and sit
      in the vacuolar membrane. No localization data exist for the Neurospora protein or for its
      SF92 relatives in filamentous fungi, so the evidence cannot decide between the two.
    action: UNDECIDED
    reason: The ancestral-node placement conflicts with the location of the characterized member
      of the target's own subfamily, and PAINT curators did not propagate a vacuolar location
      from Pho91. A localization experiment is needed rather than a choice between inferences.
    supported_by:
