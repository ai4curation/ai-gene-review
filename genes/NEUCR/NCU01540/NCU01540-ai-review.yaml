- term:
    id: GO:0006797
    label: polyphosphate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000815044
  - SGD:S000000633
  - SGD:S000003734
  - SGD:S000005296
  review:
    summary: The node PTN000815044 is seeded by all three yeast Pho87/Pho90/Pho91 transporters,
      whose mutants change cellular polyphosphate levels. In the characterized SF92 member Pho91,
      the effect comes from moving phosphate across the vacuolar membrane. Polyphosphate is made
      by VTC and broken down by vacuolar polyphosphatases. The transporter does none of the
      synthesis or hydrolysis; it controls the size of the phosphate pool these enzymes use. The
      term is kept because the curator-placed node covers the target. It is non-core because it
      describes a consequence of the phosphate-transport activity, not a separate activity.
    action: KEEP_AS_NON_CORE
    reason: The transporter affects polyphosphate by controlling phosphate supply, which is an
      indirect contribution. The IBD placement is sound for the clade; the target-level role is
      peripheral to its core transport function.
    supported_by:
    - reference_id: PMID:41324358
      supporting_text: This activates Pho91 to release Pi from the vacuolar pool into the cytosol
        and stabilises cytosolic Pi.
    - reference_id: PMID:17804816
      supporting_text: 'the low-affinity transporter Pho91 limits poly P accumulation in a strain

        lacking PHO85. This phenotype was not caused by a regulatory effect on the PHO

        pathway, but can be attributed to the unexpected localization of Pho91 in the

        vacuolar membrane.'
- term:
    id: GO:0006817
    label: phosphate ion transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
