suggested_questions:
- question: Does NCU01540, the only PTHR10283 member in N. crassa, reside in the vacuolar membrane
    like its SF92 relative Pho91, or at the plasma membrane like the SF110 Pho87/Pho90 pair that
    Neurospora lacks?
- question: Does NCU01540 export phosphate from the vacuole under phosphate limitation, and is
    this gated by inositol pyrophosphate binding at SPX K241?
suggested_experiments:
- description: Tag NCU01540 with GFP at the endogenous locus and image it under high and low
    phosphate, co-staining the vacuole, to determine its resident membrane.
- description: Delete NCU01540 and introduce a K241A SPX allele; measure cytosolic and vacuolar
    phosphate and polyphosphate during phosphate starvation to test for SPX-regulated vacuolar
    phosphate export.
