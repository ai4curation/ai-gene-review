  - PANTHER:PTN000815044
  - SGD:S000000633
  - SGD:S000003734
  - SGD:S000005296
  review:
    summary: Phosphate transport is the conserved process of the eukaryotic Pho87/Pho90/Pho91
      clade (PTN000815044), and NCU01540 is inside this clade. Because the protein is a
      multi-pass membrane transporter, the process it carries out is the movement of phosphate
      across a membrane. The more specific term phosphate ion transmembrane transport
      (GO:0035435), which is_a both phosphate ion transport and transmembrane transport, states
      this directly.
    action: MODIFY
    reason: The claim is correct but less specific than the evidence supports. GO:0035435 is a
      descendant of GO:0006817 and matches the transmembrane transporter activity accepted above.
    proposed_replacement_terms:
    - id: GO:0035435
      label: phosphate ion transmembrane transport
    supported_by:
