  review:
    summary: The IBA derives from PTN000031793 in a broad transporter family. Pho87/Pho90 operate at the
      plasma membrane whereas the characterized Pho91 is vacuolar, and the target is classified in a Pho91
      subfamily. The available evidence does not resolve whether the ancestral plasma-membrane assertion
      applies to this filamentous-fungal branch; neither location is treated as experimentally established
      for NCU01540.
