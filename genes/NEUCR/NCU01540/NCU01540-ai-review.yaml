  title: Acidocalcisome-like vacuoles constitute a feedback-controlled phosphate buffering system for
    the cytosol.
  findings:
  - statement: Loss of inositol-pyrophosphate binding to the Pho91 SPX domain (K237A) activates
      Pho91-dependent export of phosphate from the vacuole to the cytosol in S. cerevisiae.
    supporting_text: The pho91K237A allele generates an amino acid substitution in the InsPP-binding
      patch of the Pho91 SPX domain.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Gives in vivo evidence that yeast Pho91 is an SPX-regulated
      vacuolar phosphate exporter. Flux direction is inferred from genetic and phosphate-pool
      data rather than a reconstituted transport assay. Used here by subfamily-level (SF92)
      transfer; the equivalent lysine (K241) is conserved in NCU01540.
