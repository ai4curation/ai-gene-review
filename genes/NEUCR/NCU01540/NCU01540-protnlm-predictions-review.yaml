    summary: The SPX-permease architecture and PANTHER Pho91 subfamily (PTHR10283:SF92) placement support
      phosphate transport by transfer from the characterized fungal Pho87/Pho90/Pho91 transporters; yeast
      Pho91 is a vacuolar phosphate transporter that exports phosphate to the cytosol (PMID:17804816,
      PMID:41324358). The gene already carries the same generic term from an ARBA rule, which the gene
      review refines to the more specific, IBA-supported phosphate transmembrane transporter activity
      (GO:0005315, a descendant of the predicted term). The prediction is therefore correct but less precise than an
      existing supported annotation. The unresolved plasma versus vacuolar location does not undermine
      generic transmembrane transport.
    supported_by:
