      supporting_text: DR   PANTHER; PTHR10283:SF92; LOW-AFFINITY PHOSPHATE TRANSPORTER PHO91; 1.
    - reference_id: PMID:17804816
      supporting_text: 'the low-affinity transporter Pho91 limits poly P accumulation in a strain

        lacking PHO85. This phenotype was not caused by a regulatory effect on the PHO

        pathway, but can be attributed to the unexpected localization of Pho91 in the

        vacuolar membrane.'
    - reference_id: PMID:41324358
      supporting_text: Collectively, our results are consistent with the notion that loss of InsPP binding
        activates Pho91 to export Pi from vacuoles to the cytosol, enhancing repression of the PHO pathway.
