taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  ant-1/NCU08111 encodes the Neurospora crassa member of the fungal Rmt2 family
  of type IV protein arginine methyltransferases. Its N-terminal region is
  predicted to contain ankyrin repeats and its C-terminal RMT2 domain belongs to
  the class I-like SAM-binding methyltransferase superfamily. By phylogenetic
  inference from budding-yeast Rmt2, ant-1 is predicted to catalyze
  S-adenosyl-L-methionine-dependent methylation of the N5/delta nitrogen of
  protein arginine residues rather than vertebrate-type guanidinoacetate
  methylation.
