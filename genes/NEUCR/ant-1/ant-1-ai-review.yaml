suggested_questions:
- question: >-
    Does Neurospora ant-1 methylate 60S ribosomal protein L12 on the arginine
    residue orthologous to S. cerevisiae Rpl12 Arg67, and are there additional
    filamentous-fungal substrates?
- question: >-
    Does ant-1 deletion alter Neurospora hyphal growth, development, 60S
    ribosomal-subunit maturation, or translational fidelity?
suggested_experiments:
- hypothesis: >-
    NCU08111/ant-1 is the Neurospora methyltransferase for the conserved Rpl12
    N5-arginine mark.
  description: >-
    Compare Rpl12 methylation by targeted mass spectrometry in wild-type,
    ant-1 deletion, and catalytically inactive ant-1 strains, then rescue the
    deletion with wild-type ant-1 to verify that the loss is enzyme-specific.
- hypothesis: >-
    ant-1-dependent protein arginine N5 methylation supports ribosome function
    in filamentous fungi.
  description: >-
    Pair ant-1-null ribosome profiling and polysome analysis with stop-codon
    readthrough and programmed frameshifting reporters to test whether the
    budding-yeast Rmt2 translation-fidelity phenotype is conserved in
    Neurospora.
