core_functions:
- description: >-
    ant-1 is inferred to catalyze S-adenosyl-L-methionine-dependent N5/delta
    methylation of arginine residues in proteins. PAINT places Q7SCW9 in the
    fungal Rmt2 clade that inherited this activity from the experimentally
    characterized budding-yeast Rmt2 enzyme, rather than in the vertebrate GAMT
    branch; by conservation, ribosomal protein L12 is a plausible substrate
    awaiting direct Neurospora validation.
