- id: PMID:24260473
  title: Neurospora crassa protein arginine methyl transferases are involved in
    growth and development and interact with the NDR kinase COT1.
  findings:
  - statement: >-
      Feldman et al. noted NCU08111 as a putative type IV PRMT, cautioned that
      its structure is distinct from the cross-kingdom PRMTs that they assayed,
      and reported no phenotype for inactivation of its F. graminearum homolog.
    supporting_text: >-
      In addition to the three highly conserved PRMTs, another, protein (NCU08111),
      which may be a putative type IV PRMT, but doesn't contain the conserved
      methytransferase domain, is present in the N. crassa genome. In F. graminearum
      inactivation of the homologue of this gene, which is structurally significantly
      different than the cross-kingdom classes of PRMTs [5], had no observable
      phenotypic consequences [9]. The enzymatic characteristics of this enzyme and
      its involvement in cellular functions in N. crassa and additional fungi have
      yet to be determined.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text PLoS One 2013 paper inspected for ant-1/NCU08111. It mentions
      NCU08111 as a putative type IV PRMT but experimentally characterizes the
      classical type I/II Neurospora PRMTs, so it is contextual rather than
      direct evidence for the GO:0019702 row.
