- term:
    id: GO:0045047
    label: protein targeting to ER
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P15367
  - sgd:YIR022W
  review:
    summary: >-
      Cleaving signal peptides after ER engagement does not mean Sec11 directs
      substrates to the ER.
    action: REMOVE
    reason: >-
      Sec11 catalyzes signal peptide cleavage as nascent proteins are
      translocated at the ER membrane. The protein targeting to ER term instead
      describes directing proteins toward the ER using targeting signals, which
      is executed by SRP/Sec61 and Sec62/Sec63 targeting and translocation
      machinery rather than by the SPC catalytic subunit. The EnsemblFungi row
      therefore transfers a pathway-level yeast annotation that is too far
      upstream for sec11 itself.
    supported_by:
    - reference_id: file:NEUCR/sec11/sec11-uniprot.txt
      supporting_text: >-
        catalyzes the cleavage of N-terminal signal sequences from nascent
        proteins as they are translocated into the lumen of the endoplasmic
        reticulum
