- id: file:NEUCR/sec11/sec11-uniprot.txt
  title: UniProtKB Q7RY44 signal peptidase complex catalytic subunit sec11 record
  findings:
  - statement: >-
      UniProtKB classifies Q7RY44 as a 172-residue reviewed fungal Sec11 signal
      peptidase complex catalytic subunit with one N-terminal signal-anchor
      transmembrane helix and conserved active-site residues at positions 49,
      90, and 115.
    supporting_text: >-
      ID   SEC11_NEUCR             Reviewed;         172 AA.
      AC   Q7RY44; ... ACT_SITE        49 ... ACT_SITE        90 ...
      ACT_SITE        115
  - statement: >-
      UniProtKB's curated homology notes place Q7RY44 in the ER signal
      peptidase complex and in the ER membrane.
    supporting_text: >-
      Catalytic component of the signal peptidase complex (SPC) which catalyzes
      the cleavage of N-terminal signal sequences from nascent proteins as they
      are translocated into the lumen of the endoplasmic reticulum
- id: file:interpro/panther/PTHR10806/PTHR10806-paint.tsv
  title: PTHR10806 PAINT IBD export
  findings:
  - statement: >-
      PAINT placed the generic peptidase activity IBD at the PTHR10806 family
      root, while the ER signal peptidase complex and protein maturation IBDs
      are placed at the Eukaryota node PTN000086750.
    supporting_text: >-
      PTHR10806 PTN000086749 GO:0008233 F IBD false
      ... PTHR10806 PTN000086750 GO:0005787 C IBD false
      ... PTHR10806 PTN000086750 GO:0051604 P IBD false
- id: file:interpro/panther/PTHR10806/PTHR10806-entries.csv
  title: PTHR10806 member export
  findings:
  - statement: >-
      The PANTHER export places Neurospora crassa Q7RY44 in PTHR10806:SF6, the
      fungal Sec11 subfamily that also contains budding yeast SEC11.
    supporting_text: >-
      Q7RY44,Signal peptidase complex catalytic subunit sec11,protein,367110
      ... PTHR10806:SF6,SIGNAL PEPTIDASE COMPLEX CATALYTIC SUBUNIT SEC11
- id: PMID:12712197
  title: The genome sequence of the filamentous fungus Neurospora crassa.
  findings:
  - statement: >-
      The Neurospora crassa OR74A genome project supplied the genomic sequence
      from which NCU04519/Q7RY44 was annotated.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary genome-sequence paper for the OR74A reference
      proteome entry.
- id: PMID:3283143
  title: SEC11 is required for signal peptide processing and yeast cell growth.
  findings:
  - statement: >-
      Budding yeast sec11 mutants accumulate signal-peptide-retaining secretory
      precursors, and a SEC11 null mutation is lethal.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified experimental paper establishing fungal Sec11 as the
      essential catalytic signal-peptidase subunit.
- id: PMID:1846444
  title: Yeast signal peptidase contains a glycoprotein and the Sec11 gene product.
  findings:
  - statement: >-
      Biochemical purification of yeast signal peptidase recovered Sec11 as a
      component of the eukaryotic ER signal peptidase complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified yeast SPC purification paper connecting SEC11 with the ER
      signal peptidase complex.
- id: PMID:10206957
  title: The catalytic mechanism of endoplasmic reticulum signal peptidase appears
    to be distinct from most eubacterial signal peptidases.
  findings:
  - statement: >-
      Mutational analysis of yeast Sec11 showed that conserved Ser, His, and Asp
      residues are important for eukaryotic ER signal peptidase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified structure-function study of the fungal Sec11 catalytic
      mechanism.
- id: PMID:34388369
  title: Structure of the human signal peptidase complex reveals the determinants
    for signal peptide cleavage.
  findings:
  - statement: >-
      Cryo-EM structures of human SPC-A and SPC-C showed conserved SEC11A/C
      catalytic cores, a membrane-proximal active site, and a transmembrane
      window that helps discriminate signal peptides by hydrophobic-region
      length.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified structural study of conserved metazoan Sec11-containing
      signal peptidase complexes.
- id: PMID:39565596
  title: Spc2 modulates substrate- and cleavage site-selection in the yeast signal
    peptidase complex.
  findings:
  - statement: >-
      A yeast SPC AlphaFold2-Multimer model and in vivo signal-sequence cleavage
      assays supported the conserved ER-membrane architecture of fungal Sec11
      within the heterotetrameric signal peptidase complex.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified recent yeast SPC study used for mechanistic context rather
      than for a Neurospora-specific annotation.
- id: PMID:42173868
  title: Structural basis of signal peptide recognition by the signal peptidase
    complex.
  findings:
  - statement: >-
      A human SPC-A structure bound to a model signal peptide directly visualized
      the signal peptide binding groove near SEC11A and the transmembrane window
      used by the catalytic subunit to engage substrates.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified 2026 human SPC-substrate structure used as current
      mechanistic context for the conserved Sec11 active site.
- id: PMID:42586426
  title: The Sec11 C-terminal short helix promotes productive engagement of
    internal signal sequences with the signal peptidase complex.
  findings:
  - statement: >-
      Recent yeast work showed that the Sec11 C-terminal short helix traverses
      the ER membrane and contributes selectively to productive engagement of
      internal signal sequences.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified 2026 yeast Sec11 study used as current mechanistic context
      for conserved fungal Sec11 topology and substrate handling.
