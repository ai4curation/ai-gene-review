id: Q7RY44
gene_symbol: sec11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  sec11 encodes the conserved catalytic subunit of the endoplasmic reticulum
  signal peptidase complex. It is a type II membrane serine endopeptidase in the
  peptidase S26B/Sec11 family and cleaves N-terminal signal peptides from
  nascent secretory and membrane proteins after their delivery to the ER
  translocation machinery.
