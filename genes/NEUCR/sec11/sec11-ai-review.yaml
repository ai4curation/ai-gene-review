  review:
    summary: >-
      The InterPro S26 peptidase domains correctly identify Q7RY44 as a
      catalytic serine endopeptidase, but the Sec11/S26B family evidence is more
      specifically signal peptidase activity.
    action: MODIFY
    reason: >-
      Neurospora sec11 is a PTHR10806:SF6 Sec11 member with the conserved
      S26B/signal peptidase fold and active-site residues found in ER signal
      peptidases. The general serine-type endopeptidase assertion should be
      refined to signal peptidase activity, which is also asserted directly by
      independent ISS/IEA rows for this protein.
    proposed_replacement_terms:
    - id: GO:0009003
      label: signal peptidase activity
    supported_by:
