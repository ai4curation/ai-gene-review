suggested_questions:
- question: >-
    Does N. crassa EPP-1 account for any of the Neurospora polyphosphatase
    activities purified before NCU02996 was assigned to the Ppn1 family?
- question: >-
    Is the predicted EPP-1 vacuolar-membrane precursor proteolytically processed
    and activated in Neurospora vacuoles as in S. cerevisiae?
suggested_experiments:
- hypothesis: >-
    N. crassa EPP-1 hydrolyzes long-chain vacuolar polyphosphate by both endo-
    and exopolyphosphatase modes.
  description: >-
    Delete or epitope-tag NCU02996 in N. crassa, measure vacuolar polyphosphate
    chain length by polyacrylamide gel electrophoresis, and assay purified
    full-length or proteolytically processed EPP-1 with long-chain
    polyphosphate substrates and divalent cations.
  experiment_type: biochemical genetics
