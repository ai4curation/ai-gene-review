  label: Neurospora crassa OR74A
description: >-
  epp-1 encodes the Neurospora crassa member of the fungal Ppn1
  endopolyphosphatase family, a predicted single-pass type-II vacuolar membrane
  protein whose metallo-dependent phosphatase domain is inferred to face the
  vacuolar lumen. By orthology to experimentally characterized Saccharomyces
  cerevisiae Ppn1, EPP-1 is expected to catabolize inorganic polyphosphate in
  the fungal vacuolar system by both internal chain cleavage and terminal
  phosphate release.
