  - SGD:S000002860
  review:
    summary: >-
      PAINT assigns endopolyphosphatase activity at the fungal Ppn1 node
      PTN000818947, seeded by the S. cerevisiae PPN1 experimental record.
    action: ACCEPT
    reason: >-
      Q9P3S1 is the N. crassa PTHR10340:SF55 representative and falls in the
      fungal clade whose current PAINT node carries endopolyphosphatase
      activity. PTN000818947 separates fungal Ppn1 polyphosphatases from the
      metazoan sphingomyelinase/SMPDL3 phosphodiesterase branches in the same
      metallo-dependent phosphatase family.
