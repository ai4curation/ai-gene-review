  label: Neurospora crassa OR74A
description: NCU03914 encodes an exgD-like glycoside hydrolase family 5 protein in Neurospora
  crassa. The predicted protein has an internal transmembrane helix and a C-terminal GH5 catalytic
  domain, placing it with membrane-anchored fungal PANTHER SF34 glucanases whose broad family-level
  role is glucan catabolism; its exact beta-glucan linkage specificity and cellular role have
  not been directly assayed in Neurospora.
