  review:
    summary: The InterPro GH5 mapping is a true but overly broad process assertion.
    action: MODIFY
    reason: IPR001547 establishes NCU03914 as a glycoside hydrolase family 5 protein, but
      the parent polysaccharide-catabolism term is less informative than the PTHR31297 root
      IBA inherited by this SF34 protein. PTN001262628 is seeded by the Aspergillus nidulans
      ExgD/SF34 and ExgB/SF39 beta-glucanases, so beta-glucan catabolism is the better biological-process
      scope while the exact beta-1,3 or beta-1,6 linkage remains unresolved for NCU03914.
    proposed_replacement_terms:
