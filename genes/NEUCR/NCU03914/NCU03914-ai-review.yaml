suggested_questions:
- question: Does NCU03914 hydrolyze beta-1,3-glucan, beta-1,6-glucan, another beta-glucan
    substrate, or a transglycosylation substrate in the Neurospora plasma membrane or cell
    wall?
- question: Is the predicted type-II membrane topology required for NCU03914 localization
    or activity?
suggested_experiments:
- description: Purify the NCU03914 GH5 domain or a membrane-reconstituted full-length protein
    and assay hydrolysis and transglycosylation on beta-1,3-, beta-1,6-, mixed-linkage, and
    intact Neurospora wall glucan substrates.
  experiment_type: biochemical substrate profiling
- description: Create an NCU03914-GFP allele expressed from the native promoter and compare
    wild-type, transmembrane-region mutant, and catalytic-site mutant alleles for localization
    and cell-wall phenotypes.
  experiment_type: endogenous localization and genetic complementation
