suggested_questions:
- question: Does N. crassa VTC-4 form distinct subcomplexes with VTC-1 (NCU03883) and the single Vtc2/3-type
    paralog NCU01745, given that yeast has separate Vtc2 and Vtc3 subunits?
suggested_experiments:
- description: Measure polyP accumulation in a vtc-4 deletion and in a K462A active-site mutant of
    N. crassa to confirm that VTC-4 is the catalytic polyP polymerase in this fungus.
