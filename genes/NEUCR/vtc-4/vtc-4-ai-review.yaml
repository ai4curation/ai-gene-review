gene_symbol: vtc-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: VTC-4 (NCU08110) is the Neurospora crassa ortholog of the catalytic subunit Vtc4 of the
  vacuolar transporter chaperone (VTC) complex, the membrane-integral polyphosphate polymerase of fungal
  vacuoles. The 771-residue protein has an N-terminal SPX domain, a central VTC catalytic tunnel domain
  and three C-terminal transmembrane helices. In characterized yeast Vtc4 the central domain transfers
  the ATP gamma-phosphate onto a growing inorganic polyphosphate (polyP) chain, and synthesis is coupled
  to translocation of the polymer through the complex's transmembrane channel into the vacuole lumen;
  the SPX domain binds inositol polyphosphates, which stimulate synthesis and link polyP storage to
  cellular phosphate status. VTC-4 retains every mapped catalytic and ATP-binding residue of yeast Vtc4,
  including the active-site lysine that the non-catalytic Vtc2/Vtc3 paralogs have lost. Fluorescently
  tagged VTC-4 localizes to vacuolar membranes in N. crassa hyphae, including prevacuolar compartments
  near the hyphal tip and the tubular and spherical vacuolar network. Yeast VTC also occurs in the
  endoplasmic reticulum and contributes to microautophagy, vacuole fusion and calmodulin binding; these
  are inferred for VTC-4 by orthology only.
