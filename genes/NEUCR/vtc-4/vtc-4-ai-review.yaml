- term:
    id: GO:0000822
    label: inositol hexakisphosphate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P47075
  - sgd:YJL012C
  review:
    summary: InsP6 binding by the Vtc4 SPX domain is well established structurally in the close
      Sordariomycete ortholog (Chaetomium thermophilum Vtc4, PDB 5IJP) and functionally in yeast; the
      target conserves the SPX basic binding motif. Kept as a regulatory, non-core activity.
    action: KEEP_AS_NON_CORE
    reason: The Ensembl Compara transfer is from yeast Vtc4, which is in the same Vtc4 clade (PANTHER
      PTHR46140:SF1; NJ tree, RESULTS-rereview.md) as the target. The closest structurally characterized
      ortholog, C. thermophilum Vtc4 (80.5% identity to VTC-4), was crystallized with InsP6 bound to
      its SPX domain, and the yeast Vtc4 InsP-binding motif (residues 126-133) is conserved in VTC-4
      (G129-K136). SPX-InsP binding regulates polyP synthesis (PMID:27080106) rather than being the
      catalytic function itself; InsP6 binding is real in vitro but inositol pyrophosphates are the
      more potent physiological activators, so this is kept as a non-core regulatory activity.
    supported_by:
    - reference_id: file:NEUCR/vtc-4/vtc-4-PDB-5IJP.json
      supporting_text: Crystal structure of the SPX domain of Chaetomium thermophilum Vtc4 in complex
        with inositol hexakisphosphate (InsP6).
    - reference_id: PMID:27080106
      supporting_text: SPX domains--which are found in eukaryotic phosphate transporters, signaling proteins,
        and inorganic polyphosphate polymerases--provide a basic binding surface for inositol polyphosphate
        signaling molecules (InsPs)
    - reference_id: file:NEUCR/vtc-4/vtc-4-bioinformatics/RESULTS-rereview.md
      supporting_text: Target G129-F-Y-K-I-I-K-K136 is conserved with the yeast and Chaetomium Vtc4 basic
        surface motif
