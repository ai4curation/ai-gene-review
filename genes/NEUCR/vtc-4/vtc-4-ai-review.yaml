- term:
    id: GO:0007034
    label: vacuolar transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P47075
  - sgd:YJL012C
  review:
    summary: The VTC complex couples polyP synthesis to translocation of the polymer into the vacuole
      lumen, which is directed movement of a substance into the vacuole. No more specific GO term for
      polyphosphate import exists, so the term is kept.
    action: ACCEPT
    reason: GO:0007034 is defined as directed movement of substances into, out of or within a vacuole.
      In yeast, polyP made by VTC is imported into vacuoles and synthesis is obligatorily coupled to
      import through the VTC transmembrane domains (PMID:25315834; PMID:19390046). VTC-4 contributes
      one of the transmembrane modules of that channel and is the synthesizing subunit, so it performs
      part of the transport. No GO term for polyphosphate transmembrane transport was found (OLS
      search, 2026-10-21), so this broad term is as precise as available. Inference by orthology
      (same Vtc4 clade); not assayed in N. crassa.
    supported_by:
    - reference_id: PMID:25315834
      supporting_text: Mutations in the VTC transmembrane regions, which are likely to constitute the
        translocation channel, block not only polyP translocation but also synthesis.
    - reference_id: PMID:19390046
      supporting_text: Mutational analysis of the transmembrane domain indicates that VTC may integrate
        cytoplasmic polymer synthesis with polyP membrane translocation.
