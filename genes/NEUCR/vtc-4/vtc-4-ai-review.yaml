taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: VTC-4 is the catalytic polyphosphate-polymerase subunit of the vacuolar transporter chaperone
  complex. Its SPX regulatory domain, central VTC catalytic domain, and membrane-spanning region support
  ATP-dependent polyphosphate synthesis coupled to storage in the vacuolar lumen. Tagged Neurospora crassa
  VTC-4 occurs in prevacuolar compartments and the tubular and spherical vacuolar network. Conserved fungal
  Vtc4 mechanisms include inositol-phosphate sensing and contributions to vacuolar membrane traffic.
