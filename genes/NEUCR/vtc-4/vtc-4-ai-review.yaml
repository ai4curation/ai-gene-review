- term:
    id: GO:0016237
    label: microautophagy
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P47075
  - sgd:YJL012C
  review:
    summary: The yeast VTC complex is a constituent of autophagic tubes and is required for scission
      of microautophagic vesicles; transfer to the N. crassa ortholog is kept as a secondary,
      non-core process.
    action: KEEP_AS_NON_CORE
    reason: PMID:17079729 shows that deleting VTC blocks microautophagic uptake at the vesicle scission
      step, and the complex is present on the autophagic tube membranes, so VTC acts at the membrane
      where the step occurs rather than being a distant requirement. The evidence is from yeast, by
      orthology; microautophagy has not been studied for VTC-4 in N. crassa, and whether the defect
      reflects loss of polyP synthesis or a separate membrane role is not resolved. Kept as non-core.
    supported_by:
    - reference_id: PMID:17079729
      supporting_text: Deletion of the VTC complex blocks microautophagic uptake into vacuoles. The mutants
        still form autophagic tubes but the production of microautophagic vesicles from their tips is impaired.
