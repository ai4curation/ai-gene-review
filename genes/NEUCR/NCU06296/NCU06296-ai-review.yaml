  title: 'NCU06296 (Q7SAD4) bioinformatics: phylogenetic placement and FMO motif check'
  findings:
  - statement: NCU06296 is in PANTHER subfamily PTHR23023:SF292, a Pezizomycotina clade of a fungal FMO
      lineage that is sister (by speciation) to the whole animal FMO clade; no fungal-clade member has
      experimental annotation.
    supporting_text: No member of SF292 or of the fungal clade has experimental GO annotation; every leaf in the
      Fungi node is an uncharacterised genome-project entry.
  - statement: The FAD-binding motif is conserved, the NADPH-binding motif and FATGY are diverged, and
      no mammalian-type C-terminal membrane anchor is predicted.
    supporting_text: There is no predicted C-terminal membrane anchor of the
      mammalian type, so ER-membrane localization of mammalian FMOs should not be transferred.
core_functions:
- description: Predicted FAD-dependent monooxygenation (single oxygen-atom insertion from O2, with a
    reduced nicotinamide cofactor as electron donor) of an as-yet unidentified organic substrate,
    inherited from the root of the FMO family tree.
