  review:
    summary: PAINT placed monooxygenase activity at the PTHR23023 root node (PTN009058586), so it is
      inherited by every descendant, including the fungal SF292 clade that contains NCU06296. The
      target is unambiguously inside that tree, and its sequence retains the FAD-binding motif and the
      core of the FMO motif, so there is no target-specific sign of loss of catalytic function.
    action: ACCEPT
    reason: The IBA rests on a family-root node placement with many experimentally characterised
      donors (mammalian, nematode, fly and plant FMOs). Generic monooxygenase activity is as precise
      as the evidence allows, because no member of the fungal clade has a known substrate. The donor
      substrate specificities (N- and S-oxygenation, glucosinolate S-oxygenation) were deliberately
      not propagated to the root and are not transferred here.
    supported_by:
    - reference_id: file:NEUCR/NCU06296/NCU06296-bioinformatics/RESULTS.md
      supporting_text: The IBA "monooxygenase activity" on Q7SAD4 lists PANTHER:PTN009058586, the family root.
    - reference_id: file:NEUCR/NCU06296/NCU06296-bioinformatics/RESULTS.md
      supporting_text: 'the FAD-binding motif and the core of
        the FMO motif are retained, consistent with a flavin-dependent monooxygenase.'
    - reference_id: file:NEUCR/NCU06296/NCU06296-uniprot.txt
      supporting_text: DR   Pfam; PF00743; FMO-like; 1.
- term:
    id: GO:0004499
    label: N,N-dimethylaniline monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR020946
  review:
    summary: GO:0004499 is the specific reaction of the mammalian xenobiotic FMOs (N-oxygenation of
      N,N-dimethylaniline, EC 1.14.13.8). It is assigned here by an InterPro2GO mapping of the family-wide
      IPR020946 signature, which also covers FMO-family enzymes with unrelated substrates. NCU06296
      belongs to a fungal clade that is only co-orthologous to the animal FMOs, has no characterised
      member, and has diverged at the NADPH-binding and FATGY motifs.
    action: MARK_AS_OVER_ANNOTATED
    reason: PAINT curators placed only generic monooxygenase activity at the ancestral nodes above
      NCU06296; the PANTHER GO-slim annotations on every node of its path are generic, and no
      substrate-specific activity was propagated even though mammalian donors carry experimental
      N-oxygenation annotations. That omission is a deliberate phylogenetic judgment. Nothing specific
      to NCU06296 or its subfamily supports N,N-dimethylaniline as the substrate, so the specific
      reaction term over-states what is known; the supported claim is the monooxygenase activity that
      the gene already carries.
    supported_by:
    - reference_id: file:NEUCR/NCU06296/NCU06296-bioinformatics/RESULTS.md
      supporting_text: no substrate-specific activity (e.g. GO:0004499) is placed on any ancestor.
    - reference_id: file:NEUCR/NCU06296/NCU06296-bioinformatics/RESULTS.md
      supporting_text: No member of SF292 or of the fungal clade has experimental GO annotation
- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR020946
  review:
    summary: FAD is the prosthetic group of class B FMOs. NCU06296 conserves the N-terminal Rossmann
      GxGxxG FAD-binding motif (residues 10-15, GSGLFG) that aligns to the FAD motif of human FMO3,
      and it matches the FMO-like Pfam domain and the FAD/NAD(P)-binding domain superfamily.
    action: ACCEPT
    reason: Family membership plus a conserved FAD-binding motif at the expected position support FAD
      binding; this cofactor binding is intrinsic to the predicted monooxygenase activity.
    supported_by:
    - reference_id: file:NEUCR/NCU06296/NCU06296-bioinformatics/RESULTS.md
      supporting_text: FAD-binding Rossmann motif GxGxxG is conserved at residues 10-15 (GSGLFG), aligned to
        FMO3 GAGVSG (9-14).
    - reference_id: file:NEUCR/NCU06296/NCU06296-uniprot.txt
      supporting_text: DR   InterPro; IPR036188; FAD/NAD-bd_sf.
- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR020946
  review:
    summary: Characterised class B FMOs use NADPH as the reductant and bind NADP(H) through a second
      Rossmann-type dinucleotide motif. In NCU06296 that second GxGxxG motif is not conserved, so the
      nicotinamide cofactor and its preference (NADPH versus NADH) cannot be read from the sequence,
      although the protein retains the FMO-like domain architecture in which the NADP-binding domain
      resides.
    action: KEEP_AS_NON_CORE
    reason: The annotation is plausible from family membership (characterised FMO-family enzymes use
      NADPH) but is weaker than FAD binding because the canonical NADPH-binding motif is diverged.
      It is retained as a non-core cofactor-binding statement; biochemical measurement of NADPH versus
      NADH turnover would be needed to confirm it.
    supported_by:
    - reference_id: file:NEUCR/NCU06296/NCU06296-bioinformatics/RESULTS.md
      supporting_text: The canonical
        NADPH-binding dinucleotide motif and FATGY are diverged, so NADPH (versus NADH) preference
        cannot be read from the sequence.
    - reference_id: file:NEUCR/NCU06296/NCU06296-uniprot.txt
      supporting_text: DR   InterPro; IPR020946; Flavin_mOase-like.
