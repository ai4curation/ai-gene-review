  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU06296 is a predicted flavin-containing monooxygenase with an FMO-like dinucleotide-binding
  architecture. Family evidence supports FAD-dependent oxygenation using a reduced nicotinamide cofactor,
  commonly NADPH. Its physiological substrate, reaction specificity, pathway, and cellular compartment
  in Neurospora crassa remain unknown.
