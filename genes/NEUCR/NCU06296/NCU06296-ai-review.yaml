taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU06296 encodes an uncharacterised 616-residue member of the class B flavin-containing
  monooxygenase (FMO) family. PANTHER places it in a Pezizomycotina-specific subfamily (PTHR23023:SF292)
  of a fungal FMO clade that is the sister group of the entire animal FMO clade, so animal FMO1-5 are
  co-orthologs of the fungal lineage rather than close relatives. The protein retains the N-terminal
  FAD-binding GxGxxG motif and the core of the FMO-identifying motif, consistent with FAD-dependent,
  NAD(P)H- and O2-dependent oxygenation of an organic substrate, but its second (NADPH) dinucleotide
  motif and the FATGY motif are diverged and it lacks the C-terminal membrane anchor of mammalian FMOs.
  No substrate, product, pathway, phenotype or subcellular location has been determined experimentally
  for this protein or for any member of its fungal subfamily.
