suggested_questions:
- question: What is the physiological substrate of the Pezizomycotina SF292 FMO subfamily (NCU06296,
    its in-paralog NCU08749, Aspergillus fumigatus AFUA_6G01900), and does it oxygenate a nitrogen or
    sulfur heteroatom as mammalian FMOs do?
- question: Does the diverged second dinucleotide-binding motif of NCU06296 alter its nicotinamide
    cofactor preference from NADPH to NADH?
suggested_experiments:
- description: Express and purify NCU06296, confirm FAD occupancy spectroscopically, compare NADPH and
    NADH oxidation with oxygen consumption and H2O2 release to measure coupling, and screen fungal
    metabolites and model N- and S-heteroatom substrates by LC-MS for oxygenated products.
  experiment_type: biochemical assay
- description: Compare untargeted metabolomes of NCU06296, NCU08749 and double deletion strains with
    wild type and complemented strains to find a substrate that accumulates in the absence of the enzyme;
    determine localization with an endogenous fluorescent fusion.
  experiment_type: genetic and metabolomic analysis
