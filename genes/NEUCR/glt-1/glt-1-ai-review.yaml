  review:
    summary: GLT-1 transports glucose, but the inherited proton-coupling mechanism is over-specific.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:28115989 assigns GLT-1 to historical low-affinity system I and describes
      system I as a glucose diffusion system. The focused report verified that the current
      PTN000627328 symporter IBD is ancestral to the exact target leaf, so the IBA is
      procedurally current, but family-level sugar-porter ancestry does not establish
      conserved proton coupling. GLT-1 has a non-protonatable Val48 at the TM1 position
      corresponding to the obligatory protonation-site Asp of XylE/STP symporters, while
      the high-affinity Neurospora HGT-1/HGT-2 paralogs retain acidic residues there. These
      sequence and physiological contrasts make GO:0005351 an over-specific mechanistic
      assertion for GLT-1; the core function should remain the mechanism-agnostic D-glucose
      transporter activity.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000627328
        source_label: PTN000627328
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Actual ancestry is verified, but the protein-specific Val48 loss
          of the symporter protonation-site residue and the HGT-1/HGT-2 acidic-residue
          contrast support loss of proton-coupled symport from GLT-1.
    supported_by:
    - reference_id: PMID:28115989
      supporting_text: system I is a glucose diffusion system, while system II is an active, H+-co-transport
        mechanism
    - reference_id: file:NEUCR/glt-1/glt-1-hypotheses/glucose-transport-and-proton-coupling/openscientist.md
      supporting_text: procedural ancestry validity ≠ demonstrated mechanism
      reference_section_type: RESULTS
