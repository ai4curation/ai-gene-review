gene_symbol: glt-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: GLT-1 (NCU01633) is a 532-residue, twelve-transmembrane-helix sugar porter of the
  major facilitator superfamily in Neurospora crassa. It is the low-affinity (Km about 18 mM),
  high-capacity glucose transporter of the dual-affinity glucose uptake system (historical
  system I), expressed under glucose-replete conditions, whereas the high-affinity HGT-1 and
  HGT-2 transporters supply uptake when glucose is limiting and can compensate for loss of GLT-1.
  Heterologous expression in a hexose-transporter-null yeast restores glucose uptake, and
  GFP-tagged GLT-1 was imaged in yeast and Neurospora, consistent with action at the plasma
  membrane. GLT-1 belongs to the PANTHER subfamily that includes the Aspergillus nidulans
  low-affinity glucose transporter MstE. Both lack the acidic TM1 residue that serves as the
  proton-binding site in proton-coupled sugar porters (Val48 in GLT-1), and whole-cell physiology
  describes system I as glucose diffusion, so GLT-1 is probably a facilitator rather than a
  sugar:proton symporter, although its energetics have not been measured directly.
