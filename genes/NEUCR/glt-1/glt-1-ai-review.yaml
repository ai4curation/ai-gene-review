taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: GLT-1 is a major facilitator superfamily glucose transporter that supplies low-affinity,
  high-capacity glucose uptake in Neurospora crassa. It is the system I component of the dual-affinity
  glucose uptake machinery and operates principally when glucose is abundant. Its plasma-membrane role
  follows from extracellular glucose uptake; the system I mechanism is described as facilitated diffusion.
  Glucose transport is directly demonstrated, whereas a dedicated glucose-sensing role is established
  for the separate HGT transporters.
