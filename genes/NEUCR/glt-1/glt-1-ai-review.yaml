  review:
    summary: GLT-1 transports glucose, but the inherited proton-coupling mechanism is over-specific.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:28115989 assigns GLT-1 to historical low-affinity system I and describes
      system I as a glucose diffusion system. Primary structural work on the sugar-porter
      fold shows that XylE and GLUT1 are close homologs with different energetics and
      places XylE Asp27 versus GLUT1 Asn29 on the symporter/uniporter divide. The focused
      report verified that the current PTN000627328 symporter IBD is ancestral to the exact
      target leaf, so the IBA is procedurally current, but family-level sugar-porter ancestry
      does not establish conserved proton coupling. GLT-1 has non-protonatable Val48 at
      the TM1 position corresponding to XylE Asp27, while the high-affinity Neurospora
      HGT-1/HGT-2 paralogs retain acidic residues there. These sequence and physiological
      contrasts make GO:0005351 an over-specific mechanistic assertion for GLT-1; the
      core function should remain the mechanism-agnostic D-glucose transporter activity.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
