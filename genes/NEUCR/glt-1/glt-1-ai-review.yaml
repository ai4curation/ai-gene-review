taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: GLT-1 (NCU01633) is a multipass major-facilitator-family glucose transporter in
  Neurospora crassa. It supports low-affinity, high-capacity glucose uptake and is prominent
  under glucose-replete conditions; high-affinity HGT-1/HGT-2 transporters can compensate for
  its deletion. Tagged-protein imaging and uptake experiments support function at the cell boundary.
  GLT-1 has been assigned to the historical system-I diffusion pathway, while its precise energetic
  coupling requires distinction from the directly measured glucose kinetics.

