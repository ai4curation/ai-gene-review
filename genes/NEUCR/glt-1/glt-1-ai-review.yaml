  review:
    summary: Protein-specific glucose uptake is established, but the degree to which GLT-1 excludes
      proton coupling remains unresolved.
    action: UNDECIDED
    reason: PMID:28115989 assigns GLT-1 to historical low-affinity system I and describes system
      I as a glucose diffusion system. However, its GLT-1 measurements concern radioglucose kinetics,
      expression, complementation and localization; low affinity alone does not establish proton
      independence. The current PTN000627328 symporter IBD is ancestral to the exact target leaf,
      with no recovered loss assertion. The existing Falcon report also distinguishes the direct
      glucose evidence from less direct mechanism assignment. A focused question is queued to
      reconcile historical whole-cell energetics with molecular identification. Do not reject
      the inherited coupling merely because a target proton-flux experiment is absent.
    propagation_review:
      root_cause: UNRESOLVED
