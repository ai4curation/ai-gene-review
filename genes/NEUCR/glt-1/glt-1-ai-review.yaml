knowledge_gaps:
- gap_statement: GLT-1 glucose uptake energetics are unresolved; no GLT-1-specific proton-flux,
    voltage-clamp, or reconstituted proteoliposome assay has directly distinguished facilitated
    diffusion from proton-coupled symport.
  boundary: GLT-1-specific radiolabeled uptake establishes low-affinity glucose transport,
    the TM1 Val48 scan argues against proton symport, and whole-cell Neurospora physiology
    historically distinguished low-affinity system I from high-affinity, energy-requiring
    system II without measuring GLT-1 alone.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Direct energetics would test the only remaining experimental caveat for replacing
    the inherited carbohydrate:proton symporter activity with a mechanism-agnostic D-glucose
    transporter activity.
  resolution: Reconstitute purified GLT-1 in proteoliposomes and measure glucose uptake
    with and without imposed pH and membrane-potential gradients, or express GLT-1 in Xenopus
    oocytes and test whether glucose evokes a proton-dependent inward current.
  provenance:
  - reference_id: file:NEUCR/glt-1/glt-1-hypotheses/glucose-transport-and-proton-coupling/openscientist.md
    supporting_text: >-
      No direct GLT-1 energetics assay. Checked: no EXP GO, no electrophysiology in the
      retrieved literature.
    reference_section_type: RESULTS
suggested_questions:
- question: Is there any GLT-1-specific proton-flux, voltage-clamp, or reconstitution datum
    not captured in the published Neurospora glucose-transporter literature, and if not should
    GLT-1's PAINT molecular-function row be generalized from carbohydrate:proton symporter
    activity to D-glucose transmembrane transporter activity?
suggested_experiments:
- hypothesis: GLT-1 mediates low-affinity facilitated diffusion of D-glucose rather than
    proton-coupled glucose symport.
  description: Reconstitute purified GLT-1 into proteoliposomes and measure D-glucose uptake
    with and without imposed delta-pH and membrane-potential gradients; as an orthogonal test,
    express GLT-1 in Xenopus oocytes and assay whether glucose elicits a proton-dependent inward
    current.
  experiment_type: Proteoliposome transport assay or oocyte electrophysiology
