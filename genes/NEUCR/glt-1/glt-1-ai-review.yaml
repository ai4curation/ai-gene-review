- id: PMID:28617850
  title: Molecular determinants for the thermodynamic and functional divergence of uniporter
    GLUT1 and proton symporter XylE.
  findings:
  - statement: XylE and GLUT1 illustrate sugar-porter symporter versus uniporter divergence,
      with the TM1 XylE Asp27 / GLUT1 Asn29 position contributing to the mechanistic split.
    supporting_text: studies of XylE and GLUT1 suggest that the variation between an acidic
      residue (Asp27 in XylE) and a neutral one (Asn29 in GLUT1) is a key element for
      their mechanistic divergence
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-fetched full text verified; supports the TM1 protonation-site framing
      used to interpret GLT-1 Val48.
- id: PMID:24847886
  title: Crystal structure of the human glucose transporter GLUT1.
  findings:
  - statement: The same sugar-porter fold includes the passive uniporter GLUT1 and proton-coupled
      XylE, so mechanism is not conserved across GLUT1/XylE homologs.
    supporting_text: Structural comparison of the uniporter GLUT1 with its bacterial homologue
      XylE, a proton-coupled xylose symporter, allows examination of the transport mechanisms
      of both passive facilitators and active transporters.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-fetched abstract verified; used only for the structural GLUT1/XylE
      homology premise stated in the abstract.
- id: PMID:5573732
  title: Kinetic characteristics of the two glucose transport systems in Neurospora
    crassa.
  findings:
  - statement: Historical whole-cell measurements distinguished a constitutive low-affinity
      Neurospora glucose system I from high-affinity glucose system II.
    supporting_text: The apparent K(m) for glucose uptake by system I and system II are
      25 and 0.04 mm, respectively.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-fetched abstract verified; supports the system-I/system-II physiological
      distinction, not GLT-1-specific energetics.
- id: PMID:6444943
  title: Characterization and regulation of galactose transport in Neurospora crassa.
  findings:
  - statement: Carbon starvation induces an energy-requiring high-affinity general monosaccharide
      uptake activity corresponding to glucose transport system II.
    supporting_text: In carbon-starved mycelia or mycelia incubated with galactose, a
      second galactose transport activity appeared which required energy, had a high
      affinity for galactose (Km = 0.7 mM), and was shown to be the same as glucose
      transport system II.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-fetched abstract verified; supports the historical assignment of
      energy-coupled monosaccharide uptake to system II.
- id: file:NEUCR/glt-1/glt-1-hypotheses/glucose-transport-and-proton-coupling/openscientist.md
  title: OpenScientist focused report on glt-1 glucose transport and proton coupling
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The focused report found that the live PANTHER ancestry for GO:0005351
      is valid but does not establish GLT-1 proton coupling.
    supporting_text: procedural ancestry validity ≠ demonstrated mechanism
    reference_section_type: RESULTS
  - statement: The focused report found that GLT-1 lacks the TM1 acidic residue
      retained by high-affinity Neurospora HGT-1 and HGT-2 proton-coupled paralogs.
    supporting_text: GLT-1 has **Val48** at the XylE-Asp27 position
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Focused report read; the TM1 protonation-site argument and intra-genome
      HGT-1/HGT-2 contrast were used to move GO:0005351 from unresolved to over-annotated
      while preserving the experimentally supported mechanism-agnostic D-glucose transporter
      activity. The report's hard remove recommendation for GO:1902600 has been softened
      to an over-annotation because it is a dependent logical inference from the same over-specific
      molecular-function row.
