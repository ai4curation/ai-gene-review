  review:
    summary: The proton-transport process row depends on an unsupported symport assumption.
    action: REMOVE
    reason: This BP is electronically inferred from GO:0005351 carbohydrate:proton
      symporter activity. The focused report found GLT-1-specific glucose uptake
      evidence but no direct proton-flux or electrophysiology assay; its TM1 protonation-site
      scan also supports loss of the proton-coupling determinant from GLT-1 relative
      to Neurospora high-affinity HGT-1/HGT-2 paralogs. The proton-transport process
      should therefore not be asserted for GLT-1.
