id: Q01371
gene_symbol: wc-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: 'wc-1 (white collar-1) encodes the principal blue-light photoreceptor of Neurospora crassa:
  a GATA-type zinc-finger transcription factor with a light-sensing LOV (PAS) domain. With WC-2 it forms
  the White Collar Complex (WCC), the master activator of light-induced transcription that drives photoadaptation,
  entrainment of the circadian clock (activating frq), and light/clock gating of conidiation.'
existing_annotations:
- term:
    id: GO:0009882
    label: blue light photoreceptor activity
  evidence_type: IDA
  original_reference_id: PMID:20813262
  qualifier: enables
  review:
    summary: Proposed new annotation. WC-1 is the LOV-domain photosensor of the WCC; this molecular function
      is absent from GOA despite being the gene's defining activity.
    action: NEW
    reason: The WCC's light response is mediated by its LOV domains, and WC-1 is the LOV-containing subunit;
      light triggers LOV-dependent WCC dimerization. GOA carries only the downstream transcription terms,
      leaving the photoreceptor activity itself unannotated.
    supported_by:
    - reference_id: PMID:20813262
      supporting_text: Light responses and photoadaptation of Neurospora depend on the photosensory light-oxygen-voltage
        (LOV) domains of the circadian transcription factor White Collar Complex (WCC) and its negative
        regulator VIVID (VVD).
    - reference_id: PMID:20813262
      supporting_text: We found that light triggers LOV-mediated dimerization of the WCC.
    - reference_id: PMID:20733070
      supporting_text: the white collar complex (WCC), the primary blue-light photoreceptor and the transcription
        factor complex that initiates light-regulated transcriptional responses in Neurospora
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: 'Accept: nucleus.'
    action: ACCEPT
    reason: The White Collar Complex acts on target promoters in the nucleus, and is_active_in is the right qualifier
      for the site of WC-1's transcriptional activity.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'Accept: nucleus.'
    action: ACCEPT
    reason: Electronic route to the same nuclear location as the IBA row; redundant with it.
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: 'Accept: regulation of DNA-templated transcription.'
    action: ACCEPT
    reason: Generic parent. WC-1's characterised role is light-driven activation of clock and photoresponse genes
      as part of the WCC.
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'Accept: zinc ion binding.'
    action: ACCEPT
    reason: Zinc is structural to the GATA-type finger that mediates WC-1's DNA binding; a cofactor requirement
      rather than a separate function.
- term:
    id: GO:0043565
    label: sequence-specific DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'Accept: sequence-specific DNA binding.'
    action: ACCEPT
    reason: The GATA finger binds specific promoter elements, so this is more informative than bare DNA binding.
      The LOV-domain photoreceptor activity that distinguishes WC-1 from WC-2 is annotated separately in this review.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19427309
  qualifier: enables
  review:
    summary: Protein binding (uninformative MF) reflecting White Collar Complex / clock interactions.
    action: KEEP_AS_NON_CORE
    reason: Interaction evidence from the study of WCC phosphorylation at SP motifs, i.e. WC-1 with its complex
      partner and regulatory kinases. Real, but 'protein binding' names no function; the informative statement is
      WCC membership, annotated separately.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20733070
  qualifier: enables
  review:
    summary: Protein binding (uninformative MF) reflecting White Collar Complex / clock interactions.
    action: KEEP_AS_NON_CORE
    reason: Interaction evidence for the VIVID-WCC association that mediates photoadaptation. Kept as non-core because
      the term records that a partner exists without saying what WC-1 does.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20807745
  qualifier: enables
  review:
    summary: Protein binding (uninformative MF) reflecting White Collar Complex / clock interactions.
    action: KEEP_AS_NON_CORE
    reason: Interaction evidence placing WC-1 in the VIVID/WCC/FRH network that shapes light and clock responses;
      again a partner list rather than a molecular function.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20813262
  qualifier: enables
  review:
    summary: Protein binding (uninformative MF) reflecting White Collar Complex / clock interactions.
    action: KEEP_AS_NON_CORE
    reason: Interaction evidence from the competitive LOV-domain model of photoadaptation, where VIVID competes
      with WC-1's own LOV domain. The mechanistic content sits in the photoreceptor annotation, not in this bare
      binding term.
