description: alg-3 encodes a conserved ALG3-family, multi-pass endoplasmic reticulum membrane mannosyltransferase. By homology to experimentally characterized fungal ALG3 enzymes and by PAINT placement in PTHR12646:SF0, it is inferred to add the first Dol-P-Man-derived mannose in alpha-1,3 linkage to Man5GlcNAc2-PP-dolichol during lumenal extension of the dolichol-linked oligosaccharide precursor used for protein N-glycosylation.
