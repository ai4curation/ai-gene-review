    summary: Cytoplasm is correct but less precise than the supported actin cortical patch localization.
      PANTHER places the target in the Rvs167 subfamily (PTHR47174:SF1), and its BAR-plus-SH3 architecture
      matches the characterized yeast endocytic adaptor Rvs167, which localizes to cortical actin patches
      at endocytic sites on the cytoplasmic face of the plasma membrane. The gene already carries cytoplasm
      (InterPro2GO IEA) and the more specific actin cortical patch (IBA, accepted in the gene review), which
      is a part_of descendant of cytoplasm via cell cortex; the gene review refines the cytoplasm row to that
      term. The ProtNLM2 string match points to medial cortex, a fission-yeast-specific term the gene review
      marks over-annotated, but the emitted cytoplasm term does not depend on it.
