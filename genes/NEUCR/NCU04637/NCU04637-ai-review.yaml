taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU04637 encodes the Neurospora crassa ortholog of yeast Rvs167, an amphiphysin-like BAR adaptor with
  an N-terminal BAR domain, a central proline/alanine-rich disordered linker and a C-terminal SH3 domain. By analogy
  with Rvs167-subfamily proteins it forms a heterodimer with an Rvs161-type BAR protein (amph-1/NCU01069 in Neurospora),
  binds membranes at the neck of clathrin/actin-dependent endocytic invaginations at cortical actin patches, and
  promotes vesicle scission, with the SH3 domain recruiting partners such as the dynamin-like Vps1. In Neurospora,
  loss of rvs-167 reduces endocytic uptake of the antifungal peptide PAF26.
