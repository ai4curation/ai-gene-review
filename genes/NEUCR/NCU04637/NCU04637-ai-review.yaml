taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU04637 encodes a fungal Rvs167-family endocytic adaptor with an N-terminal BAR domain and
  a C-terminal SH3 domain. Comparative evidence supports lipid binding and association with cortical actin
  patches, where Rvs proteins help organize endocytic membrane invaginations and vesicle scission. The
  detailed localization dynamics and interaction partners of the Neurospora protein remain to be established.
