suggested_questions:
- question: Does NCU04637 localize to the subapical endocytic collar of actin patches in growing Neurospora hyphae,
    and does its recruitment depend on amph-1 (NCU01069)?
- question: Is the Vps1-binding function of the Rvs167 SH3 domain conserved for the Neurospora dynamin-like Vps1
    ortholog?
suggested_experiments:
- description: Image an endogenously tagged NCU04637-GFP alongside an actin patch marker (e.g. fimbrin or Abp1)
    and an endocytic coat marker in wild type and amph-1 deletion hyphae, measuring patch lifetime and inward movement
    to test for a scission defect.
