- term:
    id: GO:0051666
    label: actin cortical patch localization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR046982
  review:
    summary: Rvs mutants mislocalize actin patches, but this is a downstream consequence of losing a patch component
      rather than participation in moving or anchoring patches.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The evidence for this term is phenotypic: Candida rvs167 deletion mutants fail to polarize actin patches.
      Rvs167 is itself a patch component acting at the scission step of endocytosis; patch depolarization in its
      absence is most simply explained as a secondary effect of defective endocytosis and patch turnover, not as
      Rvs167 performing patch transport or anchoring. Following the necessity-is-not-participation rule, this InterPro2GO
      process is treated as an over-annotation; the conserved roles are captured by endocytosis and actin cortical
      patch.'
    supported_by:
    - reference_id: PMID:19596778
      supporting_text: The rvs161Delta mutant was more defective in endocytosis and morphogenesis than rvs167Delta,
        but both were strongly defective in polarizing actin patches.
    - *id002
