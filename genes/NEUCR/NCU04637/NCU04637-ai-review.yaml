  review:
    summary: Endocytosis is the core conserved process of Rvs167-subfamily amphiphysins; in Neurospora itself, deletion
      of rvs-167 reduces endocytic uptake of the peptide PAF26.
    action: ACCEPT
    reason: NCU04637 is the only N. crassa member of PANTHER PTHR47174:SF1, the Rvs167 subfamily that contains budding-yeast
      RVS167 and Candida RVS167, inside the PTN002932529 clade where PAINT placed endocytosis. In yeast, Rvs161/Rvs167
      act at the scission step of endocytosis. Direct Neurospora evidence (abstract only) shows that an rvs-167
      deletion mutant has reduced endocytic internalization of PAF26; because NCU04637 is the sole SF1 protein in
      the genome, that RVS-167 is presumably this gene. Fission-yeast Hob1 is also in SF1 and is dispensable for
      endocytosis, which is a lineage-specific loss rather than a reason to doubt the filamentous-fungal protein
      given the Neurospora data.
