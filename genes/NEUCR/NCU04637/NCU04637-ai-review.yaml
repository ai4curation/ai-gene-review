  review:
    summary: Rvs167-subfamily proteins form an obligate BAR heterodimer with Rvs161-type proteins; N. crassa encodes
      both partners.
    action: ACCEPT
    reason: The Rvs161-Rvs167 heterodimer is biochemically established in yeast (purified complex binds liposomes
